# =============================================================================
# Scaffold: Building Access Control & Key Management
# =============================================================================

scenario: |
  Building Access Control & Key Management (building security office): key/fob
  inventory & issuance to residents/staff/vendors, master key hierarchy & rekey
  decision after loss, access group configuration by role/time schedule,
  credential deactivation on move-out or termination, door hardware maintenance
  & propped-door alerts, audit trail retention & incident review, temporary
  vendor credentials with expiry, lock change billing

domain_name: building-access-control
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - scheduled_actions
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - self_referential      # KeyNode.parent_id / supersedes_node_id master-key hierarchy
    - many_to_many          # AccessGroup <-> Door / Person via door_ids / person_ids arrays
    - cross_aggregate       # Incident/RekeyCampaign/Charge cross-reference credentials, doors, persons
  role_model: hierarchical_override   # SecurityAdmin superset; Officer/FrontDesk subsets; Resident/Vendor self-service
  consistency_model: immediate

# =============================================================================
# Conventions
# =============================================================================
conventions:
  clock: |
    Every timestamp and every time rule reads a single logical clock.
    POST /_clock/set_current_utc sets it; before any such call the clock reads
    exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.
  list_ordering: |
    Every list endpoint returns rows ordered by (created_at ASC, seq ASC),
    where seq is the entity's per-building monotone minting counter
    (RekeyCampaign uses rekey_seq; AccessEvent uses a building-scoped seq).
    limit/offset paginate over that ordering.
  timestamps: "ISO 8601 UTC with three fractional digits"

# =============================================================================
# 1.1 Entity-Relationship Table
# common_fields: true expands to id (server-minted UUID), created_at,
# updated_at (ISO 8601 UTC, 3 fractional digits), version (integer, starts 1).
# =============================================================================
entities:
  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Building display name" }
      - { name: audit_retention_days, type: integer, source: input, default: 90, description: "Days an AccessEvent is kept unarchived before run-ops archives it" }
      - { name: alert_escalation_minutes, type: integer, source: input, default: 30, description: "Minutes a ProppedDoorAlert may stay OPEN before run-ops escalates it to an Incident" }
      - { name: vendor_badge_pool_max, type: integer, source: input, default: 10, description: "Max concurrently live vendor temporary credentials building-wide" }
      - { name: default_propped_threshold_seconds, type: integer, source: input, default: 120, description: "Default door propped-open threshold applied at door creation when not overridden" }
      - { name: base_fee_cents, type: integer, source: input, default: 15000, description: "Rekey campaign base fee (cents)" }
      - { name: per_door_fee_cents, type: integer, source: input, default: 7500, description: "Rekey fee per re-pinned door (cents)" }
      - { name: per_key_reissue_fee_cents, type: integer, source: input, default: 2500, description: "Fee per credential deactivated by a rekey that must be reissued (cents)" }
      - { name: emergency_surcharge_pct, type: integer, source: input, default: 20, description: "Percent surcharge on the door portion when a rekey campaign completes outside business hours" }
      - { name: business_open_utc, type: string, source: input, default: "08:00", description: "Business hours start, HH:MM UTC, inclusive" }
      - { name: business_close_utc, type: string, source: input, default: "18:00", description: "Business hours end, HH:MM UTC, exclusive" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each run-ops checkpoint" }

  - name: KeyNode
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: parent_id, type: string, source: input, description: "FK -> KeyNode.id; null/absent for a root node", constraints: "parent's level must be exactly one step above this node's level" }
      - { name: level, type: enum, source: input, description: "GRAND_MASTER | MASTER | SUB_MASTER | CHANGE" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Master A' or 'Floor-3 change'" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPROMISED | RETIRED" }
      - { name: supersedes_node_id, type: string, source: system, description: "FK -> KeyNode.id; set on the successor node created by a rekey campaign approval; null on original nodes", constraints: "nullable" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter; list tie-break after created_at" }
      - { name: stock_credential_count, type: integer, source: computed, description: "Credentials pinned to this node with status IN_STOCK" }
      - { name: issued_credential_count, type: integer, source: computed, description: "Credentials pinned to this node with status ISSUED" }
      - { name: lost_credential_count, type: integer, source: computed, description: "Credentials pinned to this node with status LOST" }

  - name: Door
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: door_code, type: string, source: input, description: "Door identifier unique within the building", constraints: "unique per building_id" }
      - { name: key_node_id, type: string, source: input, description: "FK -> KeyNode.id; the change-level key node this door's lock core is pinned to" }
      - { name: bitting_code, type: string, source: input, default: "STANDARD", description: "Lock core bitting code; rotated to the successor node label on rekey completion" }
      - { name: hardware_status, type: enum, source: system, description: "OPERATIONAL | UNDER_MAINTENANCE; driven by work-order start/complete/cancel" }
      - { name: core_status, type: enum, source: system, description: "ACTIVE | REKEY_REQUIRED; flips when an ancestor-or-self key node is compromised, cleared by rekey work-order completion" }
      - { name: open_since, type: datetime, source: system, description: "Logical-clock timestamp of the GRANTED recorded access that opened the door; null when closed; NOT refreshed by re-scans while already open", constraints: "nullable" }
      - { name: propped_threshold_seconds, type: integer, source: input, description: "Seconds the door may stay open before run-ops raises a ProppedDoorAlert; defaults to building.default_propped_threshold_seconds at creation", constraints: "optional; >= 1" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: Person
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: full_name, type: string, source: input, description: "Person's full name" }
      - { name: kind, type: enum, source: input, description: "RESIDENT | STAFF | VENDOR" }
      - { name: unit_label, type: string, source: input, description: "Unit/suite label; required iff kind == RESIDENT", constraints: "required iff kind == RESIDENT" }
      - { name: employer_name, type: string, source: input, description: "Employer name; optional, typical for VENDOR", constraints: "optional" }
      - { name: key_deposit_cents, type: integer, source: input, default: 0, description: "Key deposit held for this person (cents)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MOVED_OUT | TERMINATED" }
      - { name: moved_out_at, type: datetime, source: system, description: "Logical-clock timestamp of move-out; null otherwise", constraints: "nullable" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: key_node_id, type: string, source: input, description: "FK -> KeyNode.id; hierarchy node whose locks this credential operates" }
      - { name: serial_no, type: string, source: input, description: "Physical serial, unique within the building", constraints: "unique per building_id" }
      - { name: type, type: enum, source: input, description: "METAL_KEY | FOB | CARD" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | ISSUED | LOST | DEACTIVATED" }
      - { name: holder_person_id, type: string, source: system, description: "FK -> Person.id; set at issue, cleared at return-to-stock, RETAINED through report-lost and deactivation for audit/settlement", constraints: "nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of current issuance; null while IN_STOCK", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry supplied at issue time; required iff holder kind == VENDOR, forbidden otherwise; access valid iff now < expires_at", constraints: "nullable" }
      - { name: lost_at, type: datetime, source: system, description: "Logical-clock timestamp of report-lost; persists through later deactivation", constraints: "nullable" }
      - { name: deactivated_reason, type: enum, source: system, description: "MOVE_OUT | TERMINATION | EXPIRED | REKEY | INCIDENT; null until deactivated", constraints: "nullable" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: AccessGroup
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: name, type: string, source: input, description: "Group name, e.g. 'Residents - Tower floors'" }
      - { name: door_ids, type: array, source: input, default: [], description: "Array of Door.id values this group opens; each must belong to the same building" }
      - { name: person_ids, type: array, source: input, default: [], description: "Array of Person.id members; each must belong to the same building and be ACTIVE" }
      - { name: days_of_week, type: array, source: input, description: "Non-empty subset of MON | TUE | WED | THU | FRI | SAT | SUN on which the window applies" }
      - { name: window_start_utc, type: string, source: input, description: "Window start HH:MM UTC, inclusive" }
      - { name: window_end_utc, type: string, source: input, description: "Window end HH:MM UTC, exclusive; start > end means the window wraps past midnight" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: AccessEvent
    parent: null
    common_fields: false
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; copied from the door" }
      - { name: credential_id, type: string, source: system, description: "FK -> Credential.id; the credential presented" }
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; the door checked" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp of the recorded access check" }
      - { name: outcome, type: enum, source: system, description: "GRANTED | DENIED_CREDENTIAL_NOT_ISSUED | DENIED_CREDENTIAL_EXPIRED | DENIED_NOT_AUTHORIZED | DENIED_OUTSIDE_WINDOW" }
      - { name: archived, type: boolean, source: system, default: false, description: "Set true by run-ops when occurred_at is strictly older than building.audit_retention_days; archived rows excluded from list output unless include_archived=true" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: ProppedDoorAlert
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; copied from the door" }
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; the propped door" }
      - { name: opened_at, type: datetime, source: system, description: "Door.open_since at detection time" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | ESCALATED | RESOLVED" }
      - { name: resolved_reason, type: enum, source: system, description: "MANUAL | DOOR_CLOSED; null until RESOLVED", constraints: "nullable" }
      - { name: incident_id, type: string, source: system, description: "FK -> Incident.id; set when the alert escalates", constraints: "nullable" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id" }
      - { name: type, type: enum, source: system, description: "LOST_CREDENTIAL | PROPPED_DOOR; incidents are system-created only" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED | DISMISSED" }
      - { name: credential_id, type: string, source: system, description: "FK -> Credential.id; set for LOST_CREDENTIAL incidents", constraints: "nullable" }
      - { name: door_id, type: string, source: system, description: "FK -> Door.id; set for PROPPED_DOOR incidents", constraints: "nullable" }
      - { name: alert_id, type: string, source: system, description: "FK -> ProppedDoorAlert.id; set for PROPPED_DOOR incidents", constraints: "nullable" }
      - { name: responsible_person_id, type: string, source: system, description: "FK -> Person.id; the credential holder at the moment of report-lost", constraints: "nullable" }
      - { name: resolution_action, type: enum, source: input, description: "NONE | REQUEST_REKEY | DEACTIVATE_CREDENTIAL; supplied at resolve", constraints: "nullable until resolved" }
      - { name: resolution_note, type: string, source: input, description: "Free-text note supplied at resolve", constraints: "optional" }
      - { name: campaign_id, type: string, source: system, description: "FK -> RekeyCampaign.id; set when resolution_action == REQUEST_REKEY creates the campaign", constraints: "nullable" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: RekeyCampaign
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: key_node_id, type: string, source: input, description: "FK -> KeyNode.id; scope root — every node in its subtree is re-pinned" }
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; originating LOST_CREDENTIAL incident, when applicable", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: bill_to, type: enum, source: input, default: "BUILDING", description: "BUILDING | PERSON; who pays the campaign charges" }
      - { name: bill_person_id, type: string, source: input, description: "FK -> Person.id; required iff bill_to == PERSON", constraints: "nullable" }
      - { name: rekey_seq, type: integer, source: system, description: "Per-building monotone campaign counter used in successor node labels" }
      - { name: affected_door_count, type: integer, source: computed, description: "Doors with key_node_id in subtree(key_node_id) and core_status IN {ACTIVE, REKEY_REQUIRED}; computed at creation, refreshed at approval" }
      - { name: affected_credential_count, type: integer, source: computed, description: "Credentials with key_node_id in subtree(key_node_id) and status == ISSUED; computed at creation, refreshed at approval" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Forward-looking estimate per rekey_campaign_cost (estimate variant)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Final cost per rekey_campaign_cost (final variant); null until COMPLETED", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion timestamp; drives the emergency surcharge test", constraints: "nullable" }

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id" }
      - { name: door_id, type: string, source: input, description: "FK -> Door.id" }
      - { name: campaign_id, type: string, source: system, description: "FK -> RekeyCampaign.id; set on system-created REKEY orders", constraints: "nullable" }
      - { name: target_key_node_id, type: string, source: system, description: "FK -> KeyNode.id; successor change node the door is re-pinned to on completion (REKEY only)", constraints: "nullable" }
      - { name: type, type: enum, source: input, description: "HARDWARE_REPAIR | INSPECTION | BATTERY_REPLACE via POST /work-orders; REKEY is reserved for campaign-generated orders" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned window start (logical clock); null on campaign-generated REKEY orders", constraints: "nullable" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned window end, exclusive; null on campaign-generated REKEY orders", constraints: "nullable" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual cost recorded at completion", constraints: "required at complete" }
      - { name: bill_person_id, type: string, source: input, description: "FK -> Person.id; optional person to bill for manual orders", constraints: "nullable" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; charges are system-created only" }
      - { name: person_id, type: string, source: system, description: "FK -> Person.id; null when billed to the building", constraints: "nullable" }
      - { name: campaign_id, type: string, source: system, description: "FK -> RekeyCampaign.id; set for REKEY_CAMPAIGN and KEY_REISSUE charges", constraints: "nullable" }
      - { name: kind, type: enum, source: system, description: "MOVE_OUT_SETTLEMENT | REKEY_CAMPAIGN | KEY_REISSUE" }
      - { name: amount_cents, type: integer, source: computed, description: "Amount the person owes; for settlements = max(0, final_forfeit_total_cents - deposit_cents) computed at ISSUE (0 while DRAFT); for rekey kinds set at creation" }
      - { name: deposit_cents, type: integer, source: system, description: "Person.key_deposit_cents snapshot (MOVE_OUT_SETTLEMENT only)", constraints: "nullable" }
      - { name: provisional_refund_cents, type: integer, source: computed, description: "Settlement provisional variant: deposit minus forfeits over credentials ISSUED at move-out (MOVE_OUT_SETTLEMENT only)", constraints: "nullable" }
      - { name: final_forfeit_total_cents, type: integer, source: computed, description: "Settlement final variant: forfeits over ISSUED-at-move-out plus LOST-in-trailing-30-days credentials; computed at ISSUE", constraints: "nullable" }
      - { name: final_refund_cents, type: integer, source: computed, description: "= max(0, deposit_cents - final_forfeit_total_cents); computed at ISSUE", constraints: "nullable" }
      - { name: line_items, type: array, source: system, default: [], description: "Snapshot array of { credential_id, type, fee_cents } forfeiture lines, in (credential created_at ASC, serial_no ASC) order" }
      - { name: moved_out_at, type: datetime, source: system, description: "Move-out timestamp anchoring the trailing-30-day window (MOVE_OUT_SETTLEMENT only)", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID" }
      - { name: seq, type: integer, source: system, description: "Per-building monotone minting counter" }

# =============================================================================
# 1.2 State Machine Table
# All timestamps come from the logical clock (POST /_clock/set_current_utc;
# startup default 2026-08-01T00:00:00Z).
# =============================================================================
state_machines:
  - entity: Credential
    initial_state: IN_STOCK
    terminal_states: [DEACTIVATED]
    transitions:
      - from: IN_STOCK
        to: ISSUED
        trigger: "POST /credentials/{credentialId}/issue"
        actor: "FrontDesk or SecurityAdmin"
        preconditions:
          - "Credential status == IN_STOCK (else ERR_CREDENTIAL_NOT_ISSUABLE)"
          - "Target person exists and status == ACTIVE (else ERR_PERSON_INACTIVE)"
          - "If credential's key node level != CHANGE, person kind must be STAFF (else ERR_MASTER_KEY_STAFF_ONLY)"
          - "Person holds fewer than 5 credentials with status == ISSUED (else ERR_CREDENTIAL_LIMIT_EXCEEDED)"
          - "VENDOR person: no other ISSUED credential of that person with expires_at > now (else ERR_VENDOR_CREDENTIAL_WINDOW_OVERLAP)"
          - "VENDOR person: building-wide count of ISSUED credentials with expires_at > now must be < building.vendor_badge_pool_max (else ERR_VENDOR_BADGE_POOL_EXHAUSTED)"
          - "VENDOR person: expires_at required and must be > now (else ERR_EXPIRY_REQUIRED_FOR_VENDOR / ERR_VALIDITY_WINDOW_INVALID); non-vendor: expires_at forbidden (ERR_INVALID_REQUEST)"
        side_effects:
          - "holder_person_id = person_id; issued_at = now; expires_at set iff person kind == VENDOR"

      - from: ISSUED
        to: IN_STOCK
        trigger: "POST /credentials/{credentialId}/return"
        actor: "FrontDesk or SecurityAdmin"
        preconditions:
          - "Credential status == ISSUED (else ERR_CREDENTIAL_NOT_ISSUED)"
        side_effects:
          - "holder_person_id = null; issued_at = null; expires_at = null"
        note: "Cyclic reissue loop: a returned credential can be issued again."

      - from: ISSUED
        to: LOST
        trigger: "POST /credentials/{credentialId}/report-lost"
        actor: "SecurityAdmin, FrontDesk, Resident (own), Vendor (own)"
        preconditions:
          - "Credential status == ISSUED (else ERR_CREDENTIAL_NOT_ISSUED)"
          - "Resident/Vendor callers: credential.holder_person_id == X-User-ID (else ERR_FORBIDDEN)"
        side_effects:
          - "lost_at = now; holder_person_id retained for audit/settlement"
          - "Cascade hop 1: the credential's KeyNode status -> COMPROMISED (no-op if already COMPROMISED or RETIRED)"
          - "Cascade hop 2 (caused by hop 1): every Door whose key_node_id lies in subtree(compromised node), including the node itself, gets core_status -> REKEY_REQUIRED"
          - "Cascade hop 3 (caused by hop 1): an Incident is created with type LOST_CREDENTIAL, status OPEN, credential_id, responsible_person_id = credential.holder_person_id"

      - from: IN_STOCK
        to: DEACTIVATED
        trigger: "system (holder move-out/termination cannot apply; via rekey work-order completion, or incident resolve with DEACTIVATE_CREDENTIAL)"
        actor: system
        preconditions: []
        side_effects:
          - "deactivated_reason set (REKEY or INCIDENT); no KEY_REISSUE charge (credential was not issued)"

      - from: ISSUED
        to: DEACTIVATED
        trigger: "system (holder move-out, holder termination, vendor expiry sweep at run-ops, rekey work-order completion, incident resolve with DEACTIVATE_CREDENTIAL)"
        actor: system
        preconditions: []
        side_effects:
          - "deactivated_reason set: MOVE_OUT | TERMINATION | EXPIRED | REKEY | INCIDENT"
          - "holder_person_id retained"
          - "If deactivated_reason == REKEY: a Charge is created with kind KEY_REISSUE, status DRAFT, amount_cents = building.per_key_reissue_fee_cents, campaign_id = the campaign, person_id = campaign.bill_person_id iff bill_to == PERSON else null"

      - from: LOST
        to: DEACTIVATED
        trigger: "system (rekey work-order completion, incident resolve with DEACTIVATE_CREDENTIAL, holder move-out/termination)"
        actor: system
        preconditions: []
        side_effects:
          - "deactivated_reason set; lost_at retained; no KEY_REISSUE charge (credential was not ISSUED)"

  - entity: Person
    initial_state: ACTIVE
    terminal_states: [MOVED_OUT, TERMINATED]
    transitions:
      - from: ACTIVE
        to: MOVED_OUT
        trigger: "POST /persons/{personId}/move-out"
        actor: "FrontDesk or SecurityAdmin"
        preconditions:
          - "Person status == ACTIVE (else ERR_PERSON_INVALID_STATE)"
          - "Person kind == RESIDENT (else ERR_PERSON_KIND_MISMATCH)"
        side_effects:
          - "moved_out_at = now"
          - "Every credential with holder_person_id == person and status == ISSUED -> DEACTIVATED with deactivated_reason MOVE_OUT"
          - "Person id removed from person_ids of every AccessGroup in the building"
          - "A Charge is created: kind MOVE_OUT_SETTLEMENT, status DRAFT, person_id, deposit_cents = key_deposit_cents, moved_out_at = now, line_items = forfeiture lines for credentials ISSUED at move-out, provisional_refund_cents per move_out_settlement (provisional variant), amount_cents = 0"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /persons/{personId}/terminate"
        actor: "SecurityAdmin"
        preconditions:
          - "Person status == ACTIVE (else ERR_PERSON_INVALID_STATE)"
          - "Person kind IN {STAFF, VENDOR} (else ERR_PERSON_KIND_MISMATCH)"
        side_effects:
          - "Every credential with holder_person_id == person and status == ISSUED -> DEACTIVATED with deactivated_reason TERMINATION"
          - "Person id removed from person_ids of every AccessGroup in the building"
          - "No settlement charge (no deposit workflow for staff/vendors)"

  - entity: Incident
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /incidents/{incidentId}/start-review"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Incident status == OPEN (else ERR_INCIDENT_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /incidents/{incidentId}/resolve"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Incident status == UNDER_REVIEW (else ERR_INCIDENT_INVALID_STATE)"
          - "resolution_action == REQUEST_REKEY requires type == LOST_CREDENTIAL and credential_id != null (else ERR_REKEY_REQUIRES_LOST_CREDENTIAL)"
          - "resolution_action == REQUEST_REKEY requires campaign_id == null (else ERR_CAMPAIGN_ALREADY_EXISTS)"
          - "resolution_action == DEACTIVATE_CREDENTIAL requires credential_id != null (else ERR_INVALID_REQUEST)"
        side_effects:
          - "resolution_action and resolution_note recorded"
          - "REQUEST_REKEY: a RekeyCampaign is created with status PROPOSED, key_node_id = the lost credential's key_node_id, incident_id = this incident, bill_to = PERSON iff responsible_person_id != null else BUILDING, bill_person_id = responsible_person_id; incident.campaign_id set; scope counts and estimated_cost_cents computed"
          - "DEACTIVATE_CREDENTIAL: linked credential in status ISSUED or LOST -> DEACTIVATED with deactivated_reason INCIDENT"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /incidents/{incidentId}/dismiss"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Incident status == UNDER_REVIEW (else ERR_INCIDENT_INVALID_STATE)"
        side_effects: []

      - from: RESOLVED
        to: UNDER_REVIEW
        trigger: "POST /incidents/{incidentId}/reopen"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Incident status IN {RESOLVED, DISMISSED} (else ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "resolution_action and resolution_note retained from the prior resolution for audit"
        note: "Revision loop: reopened incidents may be resolved again; REQUEST_REKEY remains blocked because campaign_id is already set."

      - from: DISMISSED
        to: UNDER_REVIEW
        trigger: "POST /incidents/{incidentId}/reopen"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Incident status IN {RESOLVED, DISMISSED} (else ERR_INCIDENT_INVALID_STATE)"
        side_effects: []

  - entity: RekeyCampaign
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /rekey-campaigns/{campaignId}/approve"
        actor: "SecurityAdmin"
        preconditions:
          - "Campaign status == PROPOSED (else ERR_CAMPAIGN_INVALID_STATE)"
          - "affected_door_count > 0 (else ERR_REKEY_SCOPE_EMPTY)"
          - "If incident_id != null: incident.status IN {UNDER_REVIEW, RESOLVED} (else ERR_INCIDENT_NOT_REVIEWED)"
        side_effects:
          - "Scope counts and estimated_cost_cents refreshed per rekey_campaign_cost (estimate variant)"
          - "Successor subtree minted: for every node N in subtree(key_node_id), ordered by (level depth ASC, label ASC), a new KeyNode is created with same level, label = N.label + '-R' + rekey_seq, parent_id = successor of N.parent_id (null for the scope root), supersedes_node_id = N.id, status ACTIVE"
          - "For each affected door, ordered by door_code ASC: a MaintenanceWorkOrder is created with type REKEY, status OPEN, campaign_id, target_key_node_id = successor of the door's current key_node_id, scheduled_start/scheduled_end = null"

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "system (automatic when the first linked work order enters IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when every linked work order is COMPLETED or CANCELLED with at least one COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "completed_at = now; status COMPLETED"
          - "Every node in subtree(key_node_id) -> RETIRED"
          - "final_cost_cents computed per rekey_campaign_cost (final variant)"
          - "A Charge is created with kind REKEY_CAMPAIGN, status DRAFT, amount_cents = door portion (base fee + actual_cost_cents of COMPLETED work orders, with emergency surcharge when completed_at falls outside [business_open_utc, business_close_utc) UTC), person_id = bill_person_id iff bill_to == PERSON else null"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /rekey-campaigns/{campaignId}/cancel"
        actor: "SecurityAdmin"
        preconditions:
          - "Campaign status IN {PROPOSED, APPROVED} (else ERR_CAMPAIGN_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /rekey-campaigns/{campaignId}/cancel"
        actor: "SecurityAdmin"
        preconditions:
          - "Campaign status IN {PROPOSED, APPROVED} (else ERR_CAMPAIGN_INVALID_STATE)"
          - "No linked work order in IN_PROGRESS (else ERR_CAMPAIGN_HAS_ACTIVE_WORK)"
        side_effects:
          - "Every linked work order in OPEN -> CANCELLED"

  - entity: MaintenanceWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /work-orders/{workOrderId}/start"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Work order status == OPEN (else ERR_WORK_ORDER_INVALID_STATE)"
          - "Door hardware_status == OPERATIONAL (else ERR_DOOR_UNDER_MAINTENANCE)"
        side_effects:
          - "Door hardware_status -> UNDER_MAINTENANCE"
          - "If campaign_id != null and campaign status == APPROVED: campaign -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{workOrderId}/complete"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Work order status == IN_PROGRESS (else ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "actual_cost_cents recorded; Door hardware_status -> OPERATIONAL"
          - "Cascade hop 1 (REKEY only): Door re-pinned — key_node_id = target_key_node_id, bitting_code = target node label, core_status -> ACTIVE"
          - "Cascade hop 2 (REKEY only, caused by hop 1): every Credential with key_node_id == the door's pre-rekey node and status != DEACTIVATED -> DEACTIVATED with deactivated_reason REKEY"
          - "Cascade hop 3 (REKEY only, caused by hop 2): for each credential that was ISSUED at deactivation, a Charge is created with kind KEY_REISSUE, status DRAFT, amount_cents = building.per_key_reissue_fee_cents, campaign_id, person_id per campaign bill_to"
          - "Campaign completion check: if every linked work order is COMPLETED or CANCELLED with at least one COMPLETED, campaign -> COMPLETED (see RekeyCampaign)"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /work-orders/{workOrderId}/cancel"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Work order status == OPEN (else ERR_WORK_ORDER_INVALID_STATE)"
        side_effects:
          - "If campaign_id != null: campaign completion check runs (a cancel can be the event that completes the campaign)"

  - entity: Charge
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /charges/{chargeId}/issue"
        actor: "FrontDesk or SecurityAdmin"
        preconditions:
          - "Charge status == DRAFT (else ERR_CHARGE_INVALID_STATE)"
        side_effects:
          - "MOVE_OUT_SETTLEMENT only: final variant of move_out_settlement runs — trailing-30-day LOST forfeiture lines appended to line_items, final_forfeit_total_cents, final_refund_cents and amount_cents computed"

      - from: ISSUED
        to: PAID
        trigger: "POST /charges/{chargeId}/pay"
        actor: "Resident (own), Vendor (own), FrontDesk"
        preconditions:
          - "Charge status == ISSUED (else ERR_CHARGE_INVALID_STATE)"
          - "Resident/Vendor callers: charge.person_id == X-User-ID (else ERR_FORBIDDEN)"
          - "paid_amount_cents == amount_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: []

      - from: DRAFT
        to: VOID
        trigger: "POST /charges/{chargeId}/void"
        actor: "SecurityAdmin"
        preconditions:
          - "Charge status IN {DRAFT, ISSUED} (else ERR_CHARGE_INVALID_STATE)"
        side_effects: []

      - from: ISSUED
        to: VOID
        trigger: "POST /charges/{chargeId}/void"
        actor: "SecurityAdmin"
        preconditions:
          - "Charge status IN {DRAFT, ISSUED} (else ERR_CHARGE_INVALID_STATE)"
        side_effects: []

  - entity: ProppedDoorAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /propped-alerts/{alertId}/acknowledge"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Alert status == OPEN (else ERR_ALERT_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: ESCALATED
        trigger: "system (run-ops: alert stayed OPEN and now - created_at > building.alert_escalation_minutes)"
        actor: system
        preconditions: []
        side_effects:
          - "An Incident is created with type PROPPED_DOOR, status OPEN, door_id, alert_id; alert.incident_id set"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /propped-alerts/{alertId}/resolve (MANUAL) or POST /doors/{doorId}/close (DOOR_CLOSED)"
        actor: "SecurityOfficer, SecurityAdmin, or system"
        preconditions:
          - "Alert status IN {OPEN, ACKNOWLEDGED} for door-close auto-resolution; {OPEN, ACKNOWLEDGED, ESCALATED} for manual resolve (else ERR_ALERT_INVALID_STATE)"
        side_effects:
          - "resolved_reason = MANUAL or DOOR_CLOSED"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /propped-alerts/{alertId}/resolve (MANUAL) or POST /doors/{doorId}/close (DOOR_CLOSED)"
        actor: "SecurityOfficer, SecurityAdmin, or system"
        preconditions:
          - "Alert status IN {OPEN, ACKNOWLEDGED} for door-close auto-resolution; {OPEN, ACKNOWLEDGED, ESCALATED} for manual resolve (else ERR_ALERT_INVALID_STATE)"
        side_effects:
          - "resolved_reason = MANUAL or DOOR_CLOSED"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /propped-alerts/{alertId}/resolve"
        actor: "SecurityOfficer or SecurityAdmin"
        preconditions:
          - "Alert status IN {OPEN, ACKNOWLEDGED, ESCALATED} (else ERR_ALERT_INVALID_STATE)"
        side_effects:
          - "resolved_reason = MANUAL"
        note: "Door close does NOT auto-resolve an ESCALATED alert — the linked incident owns the case."

  - entity: KeyNode
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: COMPROMISED
        trigger: "system (a credential pinned to this node is reported lost)"
        actor: system
        preconditions: []
        side_effects:
          - "Doors pinned to subtree(node) get core_status REKEY_REQUIRED; a LOST_CREDENTIAL incident is opened"

      - from: ACTIVE
        to: RETIRED
        trigger: "system (a rekey campaign whose scope subtree contains this node completes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMPROMISED
        to: RETIRED
        trigger: "system (a rekey campaign whose scope subtree contains this node completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Door
    initial_state: "hardware_status OPERATIONAL; core_status ACTIVE"
    terminal_states: []
    transitions:
      - from: "hardware_status OPERATIONAL"
        to: "hardware_status UNDER_MAINTENANCE"
        trigger: "system (a work order on this door enters IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "hardware_status UNDER_MAINTENANCE"
        to: "hardware_status OPERATIONAL"
        trigger: "system (the work order on this door completes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "core_status ACTIVE"
        to: "core_status REKEY_REQUIRED"
        trigger: "system (a KeyNode in this door's key-node ancestor chain, including the node itself, becomes COMPROMISED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: "core_status REKEY_REQUIRED"
        to: "core_status ACTIVE"
        trigger: "system (the REKEY work order targeting this door completes)"
        actor: system
        preconditions: []
        side_effects:
          - "key_node_id and bitting_code rotate to the successor node"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: access-group-patch-stale-version
    parent_entity: AccessGroup
    write_endpoint: "PATCH /access-groups/{accessGroupId}"
    occ_field: expected_access_group_version
    description: |
      A PATCH to an AccessGroup whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has just edited the group's door_ids/person_ids/schedule and the
      current writer's view of the group is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: door-patch-stale-version
    parent_entity: Door
    write_endpoint: "PATCH /doors/{doorId}"
    occ_field: expected_door_version
    description: |
      A PATCH to a Door whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer
      has just changed propped_threshold_seconds and the current writer's
      view of the door is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: access_decision
    trigger: "POST /doors/{doorId}/access-checks"
    algorithm: ordered_rule_chain
    formula: |
      Evaluate in this exact order; first failure wins the outcome:
        1. credential exists (else request fails ERR_NOT_FOUND)
        2. credential.status == ISSUED, else DENIED_CREDENTIAL_NOT_ISSUED
        3. credential.expires_at != null and now >= expires_at -> DENIED_CREDENTIAL_EXPIRED
        4. covering groups = AccessGroups of the door's building with
           holder_person_id in person_ids AND door.id in door_ids;
           if empty -> DENIED_NOT_AUTHORIZED
        5. if no covering group's schedule contains now (schedule_window_containment)
           -> DENIED_OUTSIDE_WINDOW
        6. GRANTED
      Holder person activity is enforced upstream: issue requires an ACTIVE
      person, and move-out/termination cascade-deactivates ISSUED
      credentials, so by step 2 an inactive holder's credential never
      survives as ISSUED.
      mode RECORDED: an AccessEvent row is appended with the outcome;
        on GRANTED the door's open_since is set to now ONLY if currently null.
      mode SIMULATED: nothing is persisted; the same outcome is returned.
    input_set: "The presented credential, its holder, the door, and the building's access groups"
    precision: "not numeric"

  - name: schedule_window_containment
    trigger: "access_decision step 6"
    algorithm: interval_containment
    formula: |
      Let s = window_start_utc, e = window_end_utc as minutes since 00:00 UTC;
      let t = now's minutes since 00:00 UTC and d = now's UTC weekday.
      Day membership: d must be in days_of_week, evaluated against the UTC date.
      If s < e:  contained iff s <= t < e            (half-open)
      If s > e:  contained iff t >= s OR t < e       (overnight wrap; the day
                 membership still refers to the UTC weekday of now)
      s == e is rejected at group write time (ERR_SCHEDULE_INVALID).
    input_set: "Covering access groups from access_decision step 5"
    precision: "minute precision; seconds component of now ignored"

  - name: node_credential_counts
    trigger: "any credential status mutation; evaluated on read of KeyNode"
    algorithm: aggregation
    formula: |
      stock_credential_count  = count(credentials with key_node_id == node.id AND status == IN_STOCK)
      issued_credential_count = count(credentials with key_node_id == node.id AND status == ISSUED)
      lost_credential_count   = count(credentials with key_node_id == node.id AND status == LOST)
    input_set: "All credentials of the building pinned to this exact node (subtree NOT included)"
    precision: "integer counts"

  - name: rekey_campaign_cost
    trigger: "campaign creation and approval (estimate variant); campaign completion (final variant)"
    algorithm: forward_looking
    formula: |
      estimate variant (PROPOSED / at approve):
        affected_door_count       = count(doors with key_node_id in subtree(scope)
                                    AND core_status IN {ACTIVE, REKEY_REQUIRED})
        affected_credential_count = count(credentials with key_node_id in subtree(scope)
                                    AND status == ISSUED)
        estimated_cost_cents = base_fee_cents
                             + per_door_fee_cents * affected_door_count
                             + per_key_reissue_fee_cents * affected_credential_count
      final variant (at COMPLETED):
        completed_door_count = count(linked work orders with status == COMPLETED)
        actual_door_costs = sum(actual_cost_cents over linked work orders
                            with status == COMPLETED)
        emergency = completed_at time-of-day (UTC) NOT IN
                    [business_open_utc, business_close_utc)
        door_portion = round_half_up(
            (base_fee_cents + actual_door_costs)
            * (1 + emergency_surcharge_pct/100) )  if emergency else
            (base_fee_cents + actual_door_costs)
        key_portion = sum(amount_cents of linked KEY_REISSUE charges)
        final_cost_cents = door_portion + key_portion
    input_set: "Subtree of campaign.key_node_id; campaign-linked work orders and charges"
    constants:
      ROUNDING: "round_half_up to integer cents; the door-portion surcharge is rounded once"
    precision: "integer cents"
    variants:
      - name: estimate
        when: "campaign creation and approval"
        difference: "Uses a snapshot of CURRENT scope counts, standard rates, and never applies the emergency surcharge"
      - name: final
        when: "campaign completion"
        difference: "Uses actually-COMPLETED work orders (cancelled orders drop out), actual KEY_REISSUE charges created, and applies the emergency surcharge when completion is outside business hours"

  - name: move_out_settlement
    trigger: "POST /persons/{personId}/move-out (provisional variant, stored on the DRAFT charge); POST /charges/{chargeId}/issue (final variant)"
    algorithm: aggregation
    formula: |
      forfeiture line for credential c = round_half_up(TYPE_FEE[c.type] * (1 + ADMIN_SURCHARGE_PCT/100))
      Rounding order is pinned: each line is rounded to integer cents FIRST,
      then lines are summed. (Sum-then-round is a different, wrong result.)
      provisional variant (at move-out):
        forfeiture set = credentials with holder_person_id == person AND status == ISSUED
                         (they are deactivated by the move-out)
        provisional_refund_cents = max(0, deposit_cents - sum(lines))
        amount_cents = 0 while DRAFT
      final variant (at charge issue):
        extra set = credentials with holder_person_id == person AND lost_at != null
                    AND moved_out_at - 30 days <= lost_at <= moved_out_at
                    (window bounds inclusive; based on lost_at, regardless of
                    the credential's current status)
        line_items = provisional lines ++ extra lines, each set internally
                     ordered by (credential created_at ASC, serial_no ASC),
                     provisional set first
        final_forfeit_total_cents = sum(all lines)
        final_refund_cents = max(0, deposit_cents - final_forfeit_total_cents)
        amount_cents = max(0, final_forfeit_total_cents - deposit_cents)
    input_set: "Credentials of the person; deposit snapshot on the charge"
    constants:
      TYPE_FEE_METAL_KEY_CENTS: 1500
      TYPE_FEE_FOB_CENTS: 4500
      TYPE_FEE_CARD_CENTS: 1501
      ADMIN_SURCHARGE_PCT: 25
      TRAILING_LOSS_WINDOW_DAYS: 30
    precision: "integer cents, round_half_up per line"
    variants:
      - name: provisional
        when: "at move-out (DRAFT charge)"
        difference: "Forfeits cover only credentials ISSUED at the move-out instant"
      - name: final
        when: "at charge issue"
        difference: "Additionally forfeits credentials reported LOST in the inclusive 30-day window before moved_out_at, so a resident with recent losses sees a smaller final refund than the provisional one"

  - name: propped_duration_check
    trigger: "POST /buildings/{buildingId}/run-ops"
    algorithm: threshold
    formula: |
      For each door of the building, ordered by (door_code ASC):
        if door.open_since != null:
          duration_seconds = now - door.open_since (in seconds)
          if duration_seconds > door.propped_threshold_seconds   # STRICTLY greater
             AND no ProppedDoorAlert for this door in status IN {OPEN, ACKNOWLEDGED}:
            create ProppedDoorAlert(status OPEN, opened_at = door.open_since)
      At duration_seconds == threshold exactly, NO alert is created.
    input_set: "Doors of the building with open_since != null"
    precision: "integer seconds"

  - name: vendor_expiry_sweep
    trigger: "POST /buildings/{buildingId}/run-ops (first duty, before propped evaluation)"
    algorithm: threshold
    formula: |
      For each credential of the building, ordered by (created_at ASC, serial_no ASC):
        if status == ISSUED AND expires_at != null AND now >= expires_at:
          credential -> DEACTIVATED with deactivated_reason EXPIRED
      Equality (now == expires_at) means expired, consistent with the access
      rule "valid iff now < expires_at".
    input_set: "Credentials of the building with expires_at != null"
    precision: "logical-clock timestamp comparison"

  - name: retention_archive
    trigger: "POST /buildings/{buildingId}/run-ops (last duty)"
    algorithm: chronological
    formula: |
      cutoff = now - building.audit_retention_days
      For each AccessEvent of the building, ordered by (occurred_at ASC):
        if archived == false AND occurred_at < cutoff:   # STRICTLY older
          archived = true
      An event with occurred_at == cutoff exactly is kept unarchived.
    input_set: "AccessEvents of the building"
    precision: "logical-clock timestamp comparison"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized; for entity_backed roles the id must resolve to a Person"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; Resident/Vendor ownership: credential.holder_person_id == X-User-ID for report-lost, charge.person_id == X-User-ID for pay, person id == X-User-ID for GET /persons/{id}, holder_person_id/person_id filters equal X-User-ID on self-service list endpoints"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids and body-supplied FK references exist (validated left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches the resource's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /access-groups/{accessGroupId}, PATCH /doors/{doorId}"

  - priority: 5
    category: state
    check: "Resource in a valid state for the requested transition (credential issuable/issued, person ACTIVE, incident/campaign/work-order/charge/alert transition guards, door OPERATIONAL for work-order start, campaign without IN_PROGRESS orders for cancel, REQUEST_REKEY only once per incident)"
    error_id: "ERR_CREDENTIAL_NOT_ISSUABLE | ERR_CREDENTIAL_NOT_ISSUED | ERR_PERSON_INVALID_STATE | ERR_PERSON_KIND_MISMATCH | ERR_INCIDENT_INVALID_STATE | ERR_CAMPAIGN_INVALID_STATE | ERR_CAMPAIGN_ALREADY_EXISTS | ERR_CAMPAIGN_HAS_ACTIVE_WORK | ERR_WORK_ORDER_INVALID_STATE | ERR_DOOR_UNDER_MAINTENANCE | ERR_CHARGE_INVALID_STATE | ERR_ALERT_INVALID_STATE"
    http_status: 409
    applies_to: "transition endpoints"

  - priority: 6
    category: business_safety
    check: "Security-critical rules: issue target person ACTIVE; credentials pinned above CHANGE level go to STAFF only"
    error_id: "ERR_PERSON_INACTIVE | ERR_MASTER_KEY_STAFF_ONLY"
    http_status: 422
    applies_to: "POST /credentials/{credentialId}/issue, POST /access-groups, PATCH /access-groups/{accessGroupId}"

  - priority: 7
    category: business_referential
    check: "Referenced entities belong to the same building (door_ids/person_ids on groups; key_node on credential/door creation; campaign key node; work-order door); cross-entity state references (linked incident reviewed before campaign approval; REQUEST_REKEY requires LOST_CREDENTIAL type)"
    error_id: "ERR_CROSS_BUILDING_REFERENCE | ERR_INCIDENT_NOT_REVIEWED | ERR_REKEY_REQUIRES_LOST_CREDENTIAL"
    http_status: 422
    applies_to: "creation and PATCH endpoints, POST /rekey-campaigns/{campaignId}/approve, POST /incidents/{incidentId}/resolve"

  - priority: 8
    category: business_constraint
    check: "Uniqueness (door_code, serial_no per building); key hierarchy level adjacency (GRAND_MASTER->MASTER->SUB_MASTER->CHANGE; root level IN {GRAND_MASTER, MASTER}); doors pin to CHANGE-level nodes only; credential limits (5 per person; vendor single live badge; building vendor pool); work-order door window overlap; non-empty rekey scope"
    error_id: "ERR_DOOR_CODE_EXISTS | ERR_SERIAL_EXISTS | ERR_KEY_HIERARCHY_INVALID | ERR_CREDENTIAL_LIMIT_EXCEEDED | ERR_VENDOR_CREDENTIAL_WINDOW_OVERLAP | ERR_VENDOR_BADGE_POOL_EXHAUSTED | ERR_WORK_ORDER_OVERLAP | ERR_REKEY_SCOPE_EMPTY"
    http_status: 422
    applies_to: "creation endpoints, issue, approve"

  - priority: 9
    category: business_temporal
    check: "Time-window sanity: vendor expires_at present and strictly in the future; work-order scheduled_end > scheduled_start; access-group window_start_utc != window_end_utc"
    error_id: "ERR_EXPIRY_REQUIRED_FOR_VENDOR | ERR_VALIDITY_WINDOW_INVALID | ERR_SCHEDULE_INVALID"
    http_status: 422
    applies_to: "issue, POST /work-orders, group create/PATCH"

  - priority: 10
    category: business_fiscal
    check: "Money rules: paid_amount_cents equals amount_cents; bill_person_id present iff bill_to == PERSON"
    error_id: "ERR_PAYMENT_AMOUNT_MISMATCH | ERR_BILL_TARGET_INVALID"
    http_status: 422
    applies_to: "POST /charges/{chargeId}/pay, POST /rekey-campaigns"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Building ---
  - method: POST
    path: "/buildings"
    description: "Create a building with its policy/rate configuration"
    roles: [SecurityAdmin]
    code: 201
    input: [name, "audit_retention_days?", "alert_escalation_minutes?", "vendor_badge_pool_max?", "default_propped_threshold_seconds?", "base_fee_cents?", "per_door_fee_cents?", "per_key_reissue_fee_cents?", "emergency_surcharge_pct?", "business_open_utc?", "business_close_utc?"]
    output: Building
    side_effects: ["ops_run_index = 0; defaults applied for omitted config"]

  - method: GET
    path: "/buildings/{buildingId}"
    description: "Get a building"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk, Resident, Vendor]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: POST
    path: "/buildings/{buildingId}/run-ops"
    description: "Operations checkpoint, in pinned order: (1) vendor_expiry_sweep, (2) propped_duration_check, (3) escalation of stale OPEN alerts to incidents, (4) retention_archive, (5) ops_run_index += 1"
    roles: [SecurityAdmin, SecurityOfficer]
    code: 200
    input: []
    output: "{ ops_run_index: integer, vendor_credentials_expired: integer, propped_alerts_created: integer, alerts_escalated: integer, events_archived: integer }"
    side_effects: ["Per the four calculations; increments Building.ops_run_index and Building.version"]

  # --- KeyNode ---
  - method: POST
    path: "/key-nodes"
    description: "Create a master-key hierarchy node"
    roles: [SecurityAdmin]
    code: 201
    input: [building_id, "parent_id?", level, label]
    output: KeyNode
    side_effects: ["status = ACTIVE; level-adjacency to parent validated"]

  - method: GET
    path: "/key-nodes"
    description: "List key nodes with computed credential counts"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "parent_id?", "status?", "supersedes_node_id?", "limit?", "offset?"]
    output: "KeyNode[]"
    side_effects: []

  - method: GET
    path: "/key-nodes/{keyNodeId}"
    description: "Get a key node"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: KeyNode
    side_effects: []

  # --- Door ---
  - method: POST
    path: "/doors"
    description: "Create a door pinned to a change-level key node"
    roles: [SecurityAdmin]
    code: 201
    input: [building_id, door_code, key_node_id, "propped_threshold_seconds?", "bitting_code?"]
    output: Door
    side_effects: ["hardware_status = OPERATIONAL; core_status = ACTIVE; open_since = null; propped_threshold_seconds defaults from building"]

  - method: GET
    path: "/doors"
    description: "List doors"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "key_node_id?", "hardware_status?", "core_status?", "limit?", "offset?"]
    output: "Door[]"
    side_effects: []

  - method: GET
    path: "/doors/{doorId}"
    description: "Get a door"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: Door
    side_effects: []

  - method: PATCH
    path: "/doors/{doorId}"
    description: "Update a door's propped_threshold_seconds; OCC-guarded"
    roles: [SecurityAdmin]
    code: 200
    input: [expected_door_version, "propped_threshold_seconds?"]
    output: Door
    side_effects: ["increments Door.version by 1"]

  - method: POST
    path: "/doors/{doorId}/close"
    description: "Record the door physically closed: open_since = null; OPEN/ACKNOWLEDGED propped alerts on this door auto-resolve with resolved_reason DOOR_CLOSED"
    roles: [SecurityOfficer, FrontDesk, SecurityAdmin]
    code: 200
    input: []
    output: Door
    side_effects: ["open_since = null", "propped alerts in {OPEN, ACKNOWLEDGED} -> RESOLVED (DOOR_CLOSED)"]

  - method: POST
    path: "/doors/{doorId}/access-checks"
    description: "Evaluate access_decision for a credential at this door. RECORDED appends an AccessEvent and on GRANTED sets open_since if null; SIMULATED persists nothing."
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: [credential_id, mode]
    output: "{ outcome: enum, credential_id: string, door_id: string, evaluated_at: datetime, access_event_id: string|null }"
    side_effects: ["RECORDED: AccessEvent appended with the outcome; GRANTED: door.open_since = now iff currently null", "SIMULATED: none"]

  # --- AccessEvent ---
  - method: GET
    path: "/access-events"
    description: "Audit trail query; archived rows excluded unless include_archived=true"
    roles: [SecurityAdmin, SecurityOfficer]
    code: 200
    input: ["building_id?", "credential_id?", "door_id?", "outcome?", "include_archived?", "limit?", "offset?"]
    output: "AccessEvent[]"
    side_effects: []

  - method: GET
    path: "/access-events/{accessEventId}"
    description: "Get a single audit event (archived rows remain readable by id)"
    roles: [SecurityAdmin, SecurityOfficer]
    code: 200
    input: []
    output: AccessEvent
    side_effects: []

  # --- Person ---
  - method: POST
    path: "/persons"
    description: "Register a resident/staff/vendor person"
    roles: [FrontDesk, SecurityAdmin]
    code: 201
    input: [building_id, full_name, kind, "unit_label?", "employer_name?", "key_deposit_cents?"]
    output: Person
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/persons"
    description: "List persons"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Person[]"
    side_effects: []

  - method: GET
    path: "/persons/{personId}"
    description: "Get a person; Resident/Vendor callers may only read their own record"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk, Resident, Vendor]
    code: 200
    input: []
    output: Person
    side_effects: []

  - method: POST
    path: "/persons/{personId}/move-out"
    description: "Move a RESIDENT out: deactivate issued credentials, strip group memberships, create the DRAFT settlement charge"
    roles: [FrontDesk, SecurityAdmin]
    code: 200
    input: []
    output: Person
    side_effects: ["Per Person state machine MOVED_OUT transition"]

  - method: POST
    path: "/persons/{personId}/terminate"
    description: "Terminate a STAFF/VENDOR person: deactivate issued credentials, strip group memberships; no settlement"
    roles: [SecurityAdmin]
    code: 200
    input: []
    output: Person
    side_effects: ["Per Person state machine TERMINATED transition"]

  # --- Credential ---
  - method: POST
    path: "/credentials"
    description: "Add a key/fob/card to stock"
    roles: [FrontDesk, SecurityAdmin]
    code: 201
    input: [building_id, key_node_id, serial_no, type]
    output: Credential
    side_effects: ["status = IN_STOCK"]

  - method: GET
    path: "/credentials"
    description: "List credentials; Resident/Vendor callers must filter holder_person_id == own id"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk, Resident, Vendor]
    code: 200
    input: ["building_id?", "key_node_id?", "holder_person_id?", "status?", "type?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: []

  - method: GET
    path: "/credentials/{credentialId}"
    description: "Get a credential"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: Credential
    side_effects: []

  - method: POST
    path: "/credentials/{credentialId}/issue"
    description: "Issue a stocked credential to an ACTIVE person; vendor expiry and pool rules apply"
    roles: [FrontDesk, SecurityAdmin]
    code: 200
    input: [person_id, "expires_at?"]
    output: Credential
    side_effects: ["Per Credential ISSUED transition"]

  - method: POST
    path: "/credentials/{credentialId}/return"
    description: "Return an issued credential to stock (reissue cycle)"
    roles: [FrontDesk, SecurityAdmin]
    code: 200
    input: []
    output: Credential
    side_effects: ["holder_person_id/issued_at/expires_at cleared"]

  - method: POST
    path: "/credentials/{credentialId}/report-lost"
    description: "Report an issued credential lost; compromises its key node, flags subtree doors REKEY_REQUIRED, opens a LOST_CREDENTIAL incident"
    roles: [SecurityAdmin, FrontDesk, Resident, Vendor]
    code: 200
    input: []
    output: Credential
    side_effects: ["Per Credential LOST transition cascade"]

  # --- AccessGroup ---
  - method: POST
    path: "/access-groups"
    description: "Create an access group with doors, members, and a weekly time window"
    roles: [SecurityAdmin]
    code: 201
    input: [building_id, name, days_of_week, window_start_utc, window_end_utc, "door_ids?", "person_ids?"]
    output: AccessGroup
    side_effects: []

  - method: GET
    path: "/access-groups"
    description: "List access groups; door_id/person_id filters match groups whose arrays contain the value"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "door_id?", "person_id?", "limit?", "offset?"]
    output: "AccessGroup[]"
    side_effects: []

  - method: GET
    path: "/access-groups/{accessGroupId}"
    description: "Get an access group"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: AccessGroup
    side_effects: []

  - method: PATCH
    path: "/access-groups/{accessGroupId}"
    description: "Replace group name/door_ids/person_ids/schedule; OCC-guarded"
    roles: [SecurityAdmin]
    code: 200
    input: [expected_access_group_version, "name?", "door_ids?", "person_ids?", "days_of_week?", "window_start_utc?", "window_end_utc?"]
    output: AccessGroup
    side_effects: ["increments AccessGroup.version by 1"]

  - method: DELETE
    path: "/access-groups/{accessGroupId}"
    description: "Delete an access group"
    roles: [SecurityAdmin]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- Incident ---
  - method: GET
    path: "/incidents"
    description: "List incidents"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "type?", "status?", "credential_id?", "door_id?", "alert_id?", "responsible_person_id?", "campaign_id?", "limit?", "offset?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/incidents/{incidentId}"
    description: "Get an incident"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/incidents/{incidentId}/start-review"
    description: "OPEN -> UNDER_REVIEW"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/incidents/{incidentId}/resolve"
    description: "UNDER_REVIEW -> RESOLVED with resolution_action NONE | REQUEST_REKEY | DEACTIVATE_CREDENTIAL"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: [resolution_action, "resolution_note?"]
    output: Incident
    side_effects: ["Per Incident RESOLVED transition"]

  - method: POST
    path: "/incidents/{incidentId}/dismiss"
    description: "UNDER_REVIEW -> DISMISSED"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/incidents/{incidentId}/reopen"
    description: "RESOLVED/DISMISSED -> UNDER_REVIEW (revision loop)"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []

  # --- RekeyCampaign ---
  - method: POST
    path: "/rekey-campaigns"
    description: "Propose a rekey over a key-node subtree; computes scope counts and the estimate variant"
    roles: [SecurityAdmin]
    code: 201
    input: [building_id, key_node_id, "incident_id?", "bill_to?", "bill_person_id?"]
    output: RekeyCampaign
    side_effects: ["status = PROPOSED; rekey_seq assigned; affected_door_count/affected_credential_count/estimated_cost_cents computed"]

  - method: GET
    path: "/rekey-campaigns"
    description: "List rekey campaigns"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "key_node_id?", "incident_id?", "status?", "bill_person_id?", "limit?", "offset?"]
    output: "RekeyCampaign[]"
    side_effects: []

  - method: GET
    path: "/rekey-campaigns/{campaignId}"
    description: "Get a rekey campaign"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: RekeyCampaign
    side_effects: []

  - method: POST
    path: "/rekey-campaigns/{campaignId}/approve"
    description: "Approve a proposed campaign; mints the successor subtree and one REKEY work order per affected door"
    roles: [SecurityAdmin]
    code: 200
    input: []
    output: RekeyCampaign
    side_effects: ["Per RekeyCampaign APPROVED transition"]

  - method: POST
    path: "/rekey-campaigns/{campaignId}/cancel"
    description: "Cancel a PROPOSED/APPROVED campaign; cancels its OPEN work orders"
    roles: [SecurityAdmin]
    code: 200
    input: []
    output: RekeyCampaign
    side_effects: ["Per RekeyCampaign CANCELLED transition"]

  # --- MaintenanceWorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Create a manual HARDWARE_REPAIR/INSPECTION/BATTERY_REPLACE order (REKEY is campaign-generated only)"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 201
    input: [building_id, door_id, type, scheduled_start, scheduled_end, "bill_person_id?"]
    output: MaintenanceWorkOrder
    side_effects: ["status = OPEN; door window-overlap validated"]

  - method: GET
    path: "/work-orders"
    description: "List work orders"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "door_id?", "campaign_id?", "status?", "type?", "bill_person_id?", "target_key_node_id?", "limit?", "offset?"]
    output: "MaintenanceWorkOrder[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{workOrderId}"
    description: "Get a work order"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: MaintenanceWorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{workOrderId}/start"
    description: "OPEN -> IN_PROGRESS; door enters UNDER_MAINTENANCE"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: MaintenanceWorkOrder
    side_effects: ["Per MaintenanceWorkOrder IN_PROGRESS transition"]

  - method: POST
    path: "/work-orders/{workOrderId}/complete"
    description: "IN_PROGRESS -> COMPLETED; REKEY orders re-pin the door and cascade credential deactivation + KEY_REISSUE charges"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: [actual_cost_cents]
    output: MaintenanceWorkOrder
    side_effects: ["Per MaintenanceWorkOrder COMPLETED transition"]

  - method: POST
    path: "/work-orders/{workOrderId}/cancel"
    description: "OPEN -> CANCELLED; may trigger campaign completion"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: MaintenanceWorkOrder
    side_effects: ["Per MaintenanceWorkOrder CANCELLED transition"]

  # --- Charge ---
  - method: GET
    path: "/charges"
    description: "List charges; Resident/Vendor callers must filter person_id == own id"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk, Resident, Vendor]
    code: 200
    input: ["building_id?", "person_id?", "campaign_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Charge[]"
    side_effects: []

  - method: GET
    path: "/charges/{chargeId}"
    description: "Get a charge"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: Charge
    side_effects: []

  - method: POST
    path: "/charges/{chargeId}/issue"
    description: "DRAFT -> ISSUED; settlement charges run the final variant"
    roles: [FrontDesk, SecurityAdmin]
    code: 200
    input: []
    output: Charge
    side_effects: ["Per Charge ISSUED transition"]

  - method: POST
    path: "/charges/{chargeId}/pay"
    description: "ISSUED -> PAID; paid_amount_cents must equal amount_cents"
    roles: [Resident, Vendor, FrontDesk]
    code: 200
    input: [paid_amount_cents]
    output: Charge
    side_effects: []

  - method: POST
    path: "/charges/{chargeId}/void"
    description: "DRAFT/ISSUED -> VOID"
    roles: [SecurityAdmin]
    code: 200
    input: []
    output: Charge
    side_effects: []

  # --- ProppedDoorAlert ---
  - method: GET
    path: "/propped-alerts"
    description: "List propped-door alerts"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: ["building_id?", "door_id?", "status?", "incident_id?", "limit?", "offset?"]
    output: "ProppedDoorAlert[]"
    side_effects: []

  - method: GET
    path: "/propped-alerts/{alertId}"
    description: "Get a propped-door alert"
    roles: [SecurityAdmin, SecurityOfficer, FrontDesk]
    code: 200
    input: []
    output: ProppedDoorAlert
    side_effects: []

  - method: POST
    path: "/propped-alerts/{alertId}/acknowledge"
    description: "OPEN -> ACKNOWLEDGED"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: ProppedDoorAlert
    side_effects: []

  - method: POST
    path: "/propped-alerts/{alertId}/resolve"
    description: "OPEN/ACKNOWLEDGED/ESCALATED -> RESOLVED (MANUAL)"
    roles: [SecurityOfficer, SecurityAdmin]
    code: 200
    input: []
    output: ProppedDoorAlert
    side_effects: []

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for every timestamp and time rule. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time."
    roles: [SecurityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock := to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID; entity_backed role id does not resolve" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint, or Resident/Vendor ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, expires_at supplied for a non-vendor issue, REKEY type on manual work-order creation, unit_label missing for RESIDENT" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the resource's current version" }
  - { id: ERR_CREDENTIAL_NOT_ISSUABLE, http: 409, condition: "Issue attempted on a credential not in IN_STOCK" }
  - { id: ERR_CREDENTIAL_NOT_ISSUED, http: 409, condition: "Return or report-lost attempted on a credential not in ISSUED" }
  - { id: ERR_PERSON_INVALID_STATE, http: 409, condition: "Move-out/terminate attempted on a person not ACTIVE" }
  - { id: ERR_PERSON_KIND_MISMATCH, http: 409, condition: "Move-out on non-RESIDENT or terminate on RESIDENT" }
  - { id: ERR_PERSON_INACTIVE, http: 422, condition: "Issue or group-membership targets a person not ACTIVE" }
  - { id: ERR_MASTER_KEY_STAFF_ONLY, http: 422, condition: "Credential pinned to a non-CHANGE key node offered to a non-STAFF person" }
  - { id: ERR_CREDENTIAL_LIMIT_EXCEEDED, http: 422, condition: "Person already holds 5 credentials in ISSUED" }
  - { id: ERR_VENDOR_CREDENTIAL_WINDOW_OVERLAP, http: 422, condition: "Vendor already holds a live temporary credential (status ISSUED, expires_at > now)" }
  - { id: ERR_VENDOR_BADGE_POOL_EXHAUSTED, http: 422, condition: "Building-wide live vendor badge count is at vendor_badge_pool_max" }
  - { id: ERR_EXPIRY_REQUIRED_FOR_VENDOR, http: 422, condition: "Issue to a VENDOR person without expires_at" }
  - { id: ERR_VALIDITY_WINDOW_INVALID, http: 422, condition: "expires_at <= now at issue time" }
  - { id: ERR_SCHEDULE_INVALID, http: 422, condition: "window_start_utc == window_end_utc, or work-order scheduled_end <= scheduled_start" }
  - { id: ERR_KEY_HIERARCHY_INVALID, http: 422, condition: "Level not exactly one step below parent, root level not in {GRAND_MASTER, MASTER}, or door pinned to a non-CHANGE node" }
  - { id: ERR_CROSS_BUILDING_REFERENCE, http: 422, condition: "Referenced door/person/key-node belongs to a different building" }
  - { id: ERR_DOOR_CODE_EXISTS, http: 422, condition: "door_code already used in this building" }
  - { id: ERR_SERIAL_EXISTS, http: 422, condition: "serial_no already used in this building" }
  - { id: ERR_DOOR_UNDER_MAINTENANCE, http: 409, condition: "Work-order start attempted on a door not OPERATIONAL" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "Incident transition attempted from a state where it is not defined" }
  - { id: ERR_INCIDENT_NOT_REVIEWED, http: 422, condition: "Campaign approval while the linked incident is still OPEN" }
  - { id: ERR_REKEY_REQUIRES_LOST_CREDENTIAL, http: 422, condition: "resolution_action REQUEST_REKEY on a non-LOST_CREDENTIAL incident or one without a credential" }
  - { id: ERR_CAMPAIGN_INVALID_STATE, http: 409, condition: "Campaign transition attempted from a state where it is not defined" }
  - { id: ERR_CAMPAIGN_ALREADY_EXISTS, http: 409, condition: "REQUEST_REKEY on an incident that already has campaign_id set" }
  - { id: ERR_CAMPAIGN_HAS_ACTIVE_WORK, http: 409, condition: "Cancel of an APPROVED campaign with a work order IN_PROGRESS" }
  - { id: ERR_REKEY_SCOPE_EMPTY, http: 422, condition: "Approval of a campaign whose affected_door_count is 0" }
  - { id: ERR_WORK_ORDER_INVALID_STATE, http: 409, condition: "Work-order transition attempted from a state where it is not defined" }
  - { id: ERR_WORK_ORDER_OVERLAP, http: 422, condition: "New order's [scheduled_start, scheduled_end) intersects another OPEN/IN_PROGRESS order's window on the same door; touching endpoints do not intersect" }
  - { id: ERR_CHARGE_INVALID_STATE, http: 409, condition: "Charge transition attempted from a state where it is not defined" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "paid_amount_cents differs from amount_cents" }
  - { id: ERR_BILL_TARGET_INVALID, http: 422, condition: "bill_to == PERSON without bill_person_id, or bill_to == BUILDING with bill_person_id set" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SecurityAdmin
    description: "Building security office administrator; full configuration and override power"
    identity: opaque
    exclusive_operations:
      - "POST /buildings"
      - "POST /key-nodes"
      - "POST /doors and PATCH /doors/{doorId}"
      - "POST/PATCH/DELETE /access-groups"
      - "POST /persons/{personId}/terminate"
      - "POST /rekey-campaigns, approve, cancel"
      - "POST /charges/{chargeId}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /buildings/{buildingId}/run-ops (with SecurityOfficer)"
      - "POST /persons, move-out (with FrontDesk)"
      - "POST /credentials, issue, return, report-lost"
      - "Incident start-review/resolve/dismiss/reopen (with SecurityOfficer)"
      - "POST /work-orders, start, complete, cancel (with SecurityOfficer)"
      - "POST /charges/{chargeId}/issue (with FrontDesk)"
      - "POST /doors/{doorId}/access-checks and /close (with SecurityOfficer, FrontDesk)"
      - "Propped alert acknowledge/resolve (with SecurityOfficer)"

  - name: SecurityOfficer
    description: "Security office operator; incidents, alerts, work orders, access checks"
    identity: opaque
    exclusive_operations:
      - "POST /incidents/{incidentId}/start-review|resolve|dismiss|reopen (shared with SecurityAdmin only)"
      - "POST /propped-alerts/{alertId}/acknowledge|resolve (shared with SecurityAdmin only)"
    shared_operations:
      - "POST /work-orders, start, complete, cancel (shared with SecurityAdmin)"
      - "POST /doors/{doorId}/access-checks (shared with FrontDesk)"
      - "POST /doors/{doorId}/close (shared with FrontDesk, SecurityAdmin)"
      - "POST /buildings/{buildingId}/run-ops (shared with SecurityAdmin)"
      - "GET endpoints"

  - name: FrontDesk
    description: "Front desk staff; day-to-day issuance, move-ins/move-outs, charge intake"
    identity: opaque
    exclusive_operations:
      - "POST /persons and POST /persons/{personId}/move-out (shared with SecurityAdmin only)"
      - "POST /credentials, issue, return (shared with SecurityAdmin only)"
      - "POST /charges/{chargeId}/issue (shared with SecurityAdmin only)"
    shared_operations:
      - "POST /credentials/{credentialId}/report-lost (shared with SecurityAdmin, Resident-self, Vendor-self)"
      - "POST /charges/{chargeId}/pay (shared with Resident-self, Vendor-self)"
      - "POST /doors/{doorId}/access-checks, /close"
      - "GET endpoints except the audit trail (GET /access-events, GET /access-events/{id})"

  - name: Resident
    description: "A resident person; self-service reads, pays own charges, reports own credentials lost"
    identity: "entity_backed:Person"
    exclusive_operations: []
    shared_operations:
      - "GET /persons/{personId} (own record only)"
      - "GET /credentials?holder_person_id=<self>"
      - "GET /charges?person_id=<self>"
      - "POST /charges/{chargeId}/pay (own charges only)"
      - "POST /credentials/{credentialId}/report-lost (own credentials only)"
      - "GET /buildings/{buildingId}"

  - name: Vendor
    description: "A vendor person holding temporary credentials; self-service reads and lost reports"
    identity: "entity_backed:Person"
    exclusive_operations: []
    shared_operations:
      - "GET /persons/{personId} (own record only)"
      - "GET /credentials?holder_person_id=<self>"
      - "GET /charges?person_id=<self>"
      - "POST /charges/{chargeId}/pay (own charges only)"
      - "POST /credentials/{credentialId}/report-lost (own credentials only)"
      - "GET /buildings/{buildingId}"
