          A supplier document is a two-ended link: it hangs off a supplier AND names one
          ingredient, and verification updates a counter on one end and a set on the other.
          Two documents are uploaded for the same supplier but for two different ingredients
          and only one is verified, so the supplier counter (a supplier-wide aggregate) reads 1
