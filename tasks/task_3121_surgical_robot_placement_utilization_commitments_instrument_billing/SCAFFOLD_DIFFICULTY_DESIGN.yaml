        distinguishing_aspect: "A `state` versus `business_temporal` pair: an agreement that is BOTH past its acceptance_expires_utc AND already TERMINATED violates two rules at once, and the higher-priority state check (priority 7) must win with ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE rather than the temporal check at priority 28."
