          assert:
            - "total_boards == 32 (COSMETIC record excluded; the 2026-08-02T00:00:00Z record excluded by the half-open window)"
            - "rows[0]: OPEN boards 12 pct 37.50 cumulative 37.50 vital_few true"
            - "rows[1]: DRILL_BREAKOUT boards 8 pct 25.00 cumulative 62.50 vital_few true (tie 8 broken by defect_code ASC, D before S)"
            - "rows[2]: SHORT boards 8 pct 25.00 cumulative 87.50 vital_few true (62.50 < 80 at row entry)"
            - "rows[3]: SPACING boards 4 pct 12.50 cumulative 100.00 vital_few false (87.50 >= 80 at row entry)"
