      - name: cesd_card_activate_requires_company_active
        grounds:
          - state_machines.Card.REQUESTED_to_ACTIVE
          - entities.Company.fields.status
          - errors[ERR_COMPANY_SUSPENDED]
        distinguishing_aspect: |
          Card activation is gated by Company.status (Card -> Company pair, distinct from the
          Transaction->ApprovalRequest pair): activating a REQUESTED physical card on a SUSPENDED
