      - name: declare_default_requires_overdue_milestone
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_DEFAULT_NOTICE
          - errors[ERR_NO_DEFAULT_GROUNDS]
        distinguishing_aspect: |
          Pair LicenseMilestone -> LicenseAgreement (fourth distinct pair):
          declare-default is rejected while every PENDING milestone's
