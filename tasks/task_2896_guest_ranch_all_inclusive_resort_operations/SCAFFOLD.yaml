# Task 2896 — Guest Ranch & All-Inclusive Resort Operations
# Seed tables (§1.0–§1.7). Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Corner design → SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  2896. Guest Ranch & All-Inclusive Resort Operations (western guest ranch): weekly package
  structure with arrival day cadence, minimum stay and all-inclusive pricing, horse program with
  rider ability assessment, mount assignment and herd health management, activity scheduling
  across rides, fishing, hiking and children's programs with guide staffing ratios, seasonal staff
  hiring, on-site housing and end-of-season retention bonuses, family group and buyout booking
  with deposit and cancellation terms, ranch dining with single-seating meal service and dietary
  accommodation, liability waivers, equine activity statutes and incident reporting, off-season
  maintenance, livestock care and capital projects

domain_name: guest-ranch-all-inclusive-resort-operations
api_prefix: ""   # flat topology: every collection is a top-level path segment

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # ActivityReservation is a 4-way junction (Booking × ActivitySlot × Guest × Horse);
  # GuideAssignment is a 2-way junction (ActivitySlot × StaffMember); Guest is
  # self-referential through waiver_signed_by_guardian_guest_id.

  state_machine_shape: parallel
  # Booking (booking_status × payment_status), ActivityReservation (reservation_status ×
  # mount_status) and Guest (guest_standing × waiver_status) each carry two independent
  # dimensions; Horse, Cabin, ActivitySlot and RiderAssessment are cyclic; IncidentReport
  # is a branching fork-join.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Peer operational roles (RanchManager / ReservationsAgent / HorseProgramDirector /
  # ActivityGuide / Guest) plus a SafetyOfficer whose incident close MUST be performed by a
  # different X-User-ID than the one that disposed the same incident.

  consistency_model: immediate

  difficulty_level: expert_plus
  entity_count: 12
  state_machine_count: 14   # 14 declared dimensions over 11 entities (Booking, Guest and
                            # ActivityReservation each carry two independent dimensions)
  calculation_count: 13
  concurrency_rule_count: 4
  validation_layers: 68
  endpoint_count: 68
  error_code_count: 77
  role_count: 6

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human label for the operating season
      - name: arrival_weekday
        type: enum
        source: input
        description: the single weekday on which every package stay may begin
        constraints: "one of MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY"
      - name: season_start_date
        type: string
        source: input
        description: first calendar date guests may occupy a cabin (ISO 8601 date, YYYY-MM-DD)
      - name: season_end_date
        type: string
        source: input
        description: last calendar date guests may occupy a cabin (ISO 8601 date, YYYY-MM-DD)
      - name: min_stay_nights
        type: integer
        source: input
        description: minimum nights for any package stay
        default: 7
        constraints: ">= 1"
      - name: max_stay_nights
        type: integer
        source: input
        description: maximum nights for any package stay
        default: 21
        constraints: ">= min_stay_nights"
      - name: deposit_pct
        type: number
        source: input
        description: fraction of provisional_package_total_cents required as deposit before confirm
        default: 0.30
        constraints: "0 < deposit_pct <= 1"
      - name: buyout_premium_pct
        type: number
        source: input
        description: premium added to a whole-ranch buyout booking subtotal
        default: 0.15
      - name: no_show_penalty_cents
        type: integer
        source: input
        description: flat penalty billed per NO_SHOW activity reservation at check-out
        default: 4500
      - name: retention_bonus_cents
        type: integer
        source: input
        description: full end-of-season retention bonus payable to one seasonal staff member
        default: 120000
      - name: dining_seat_capacity
        type: integer
        source: input
        description: single-seating dining room seat count; caps simultaneous in-house guests
        constraints: ">= 1"
      - name: package_tiers
        type: array
        source: input
        description: >-
          all-inclusive tier table; each element is an object
          { code: string, adult_nightly_rate_cents: integer, child_discount_pct: number,
          included_activity_credit_cents: integer }
        constraints: "at least 1 element; `code` unique within the season"
      - name: season_status
        type: enum
        source: system
        description: season lifecycle state
        default: PLANNING
        constraints: "one of PLANNING, OPEN, IN_SEASON, CLOSED, OFF_SEASON"
      - name: gross_package_revenue_cents
        type: integer
        source: computed
        description: sum of final_folio_total_cents over this season's CHECKED_OUT bookings
        default: 0
      - name: retention_bonus_liability_cents
        type: integer
        source: computed
        description: sum of retention_bonus_projected_cents over this season's ACTIVE staff
        default: 0
      - name: net_surplus_cents
        type: integer
        source: computed
        description: gross_package_revenue_cents - retention_bonus_liability_cents (may be negative)
        default: 0
      - name: capital_reserve_cents
        type: integer
        source: computed
        description: capital funds released at season close per season_financial_rollup
        default: 0
      - name: capital_committed_cents
        type: integer
        source: computed
        description: sum of maintenance_capital_cost_cents over cabins holding an OUT_OF_SERVICE project
        default: 0
      - name: bed_nights_sold
        type: integer
        source: computed
        description: sum of party_size * nights over bookings in {CONFIRMED, CHECKED_IN, CHECKED_OUT}
        default: 0
      - name: in_house_guest_count
        type: integer
        source: computed
        description: sum of party_size over this season's CHECKED_IN bookings
        default: 0

  - name: Cabin
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: cabin label, unique across the ranch
        constraints: "unique (case-sensitive) across all Cabin rows"
      - name: bed_capacity
        type: integer
        source: input
        description: maximum party_size the cabin sleeps
        constraints: ">= 1"
      - name: cabin_status
        type: enum
        source: system
        description: housekeeping / maintenance state
        default: READY
        constraints: "one of READY, OCCUPIED, TURNOVER, OUT_OF_SERVICE"
      - name: maintenance_project_code
        type: string
        source: system
        description: off-season capital project code while cabin_status == OUT_OF_SERVICE, else null
      - name: maintenance_capital_cost_cents
        type: integer
        source: system
        description: capital cost committed by the current maintenance hold; 0 when no hold
        default: 0
      - name: last_turnover_completed_at
        type: datetime
        source: system
        description: instant the most recent TURNOVER -> READY transition ran; null before the first

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: guest legal name
      - name: birth_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD); drives age_years and minor-guardian rules
      - name: weight_lb
        type: number
        source: input
        description: rider weight in pounds, checked against Horse.weight_limit_lb
        constraints: "> 0"
      - name: age_years
        type: integer
        source: computed
        description: whole years between birth_date and the logical clock date (floor)
      - name: guest_standing
        type: enum
        source: system
        description: safety standing controlling activity eligibility
        default: GOOD
        constraints: "one of GOOD, RESTRICTED, SUSPENDED"
      - name: waiver_signed_on
        type: string
        source: system
        description: ISO 8601 date of the most recent liability waiver signature; null when never signed
      - name: waiver_expires_on
        type: string
        source: system
        description: ISO 8601 date the current waiver lapses; null when never signed
      - name: waiver_revoked_at
        type: datetime
        source: system
        description: instant the waiver was revoked; null when the current waiver stands
      - name: equine_statute_ack
        type: boolean
        source: system
        description: true once the guest acknowledged the equine activity statute notice
        default: false
      - name: waiver_signed_by_guardian_guest_id
        type: string
        source: system
        description: "FK -> Guest.id; guardian who signed on behalf of a minor guest; null for adults"
      - name: waiver_status
        type: enum
        source: computed
        description: derived waiver posture per guest_waiver_status_resolution
        default: NONE
        constraints: "one of NONE, SIGNED, EXPIRED, REVOKED"
      - name: current_ability_rank
        type: enum
        source: computed
        description: ability from the newest EVALUATED RiderAssessment per rider_ability_rank_resolution
        default: UNASSESSED
        constraints: "one of UNASSESSED, BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"
      - name: effective_ability_rank
        type: enum
        source: computed
        description: current_ability_rank after re-evaluation and standing caps are applied
        default: UNASSESSED
        constraints: "one of UNASSESSED, BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"

  - name: RiderAssessment
    parent: Guest
    common_fields: true
    fields:
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the rider being assessed"
      - name: requested_ability
        type: enum
        source: input
        description: ability level the guest claims when booking the assessment
        constraints: "one of BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"
      - name: assessed_ability
        type: enum
        source: system
        description: ability recorded by the horse program on evaluation; null while PENDING
        constraints: "one of BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"
      - name: assessed_by_note
        type: string
        source: system
        description: evaluator note captured at evaluation; null while PENDING
      - name: evaluated_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent evaluation; null while PENDING
      - name: assessment_status
        type: enum
        source: system
        description: assessment lifecycle state
        default: PENDING
        constraints: "one of PENDING, EVALUATED, RE_EVALUATION_REQUESTED, SUPERSEDED"
      - name: re_evaluation_reason
        type: string
        source: system
        description: reason recorded when the assessment is flagged for re-evaluation; else null

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season whose package terms price this stay"
      - name: cabin_id
        type: string
        source: input
        description: "FK -> Cabin.id; cabin occupied for the whole stay window"
      - name: lead_guest_id
        type: string
        source: input
        description: "FK -> Guest.id; billing contact; MUST also appear in party_members"
      - name: package_tier_code
        type: string
        source: input
        description: tier code; MUST equal one Season.package_tiers[].code of season_id
      - name: arrival_date
        type: string
        source: input
        description: ISO 8601 date of arrival; weekday MUST equal Season.arrival_weekday
      - name: departure_date
        type: string
        source: input
        description: ISO 8601 date of departure; occupancy interval is [arrival_date, departure_date)
      - name: nights
        type: integer
        source: computed
        description: departure_date - arrival_date in whole days
      - name: is_buyout
        type: boolean
        source: input
        description: true when the party buys out the whole ranch for the stay window
        default: false
      - name: party_members
        type: array
        source: input
        description: >-
          family group roster; each element is an object { guest_id: string, member_type: ADULT|CHILD,
          dietary_restrictions: array of NONE|VEGETARIAN|GLUTEN_FREE|DAIRY_FREE|NUT_ALLERGY }; every
          guest_id MUST reference an existing Guest.id
        constraints: "1..12 elements; guest_id unique within the array"
      - name: party_size
        type: integer
        source: computed
        description: length of party_members
      - name: adult_count
        type: integer
        source: computed
        description: count of party_members with member_type == ADULT
      - name: child_count
        type: integer
        source: computed
        description: count of party_members with member_type == CHILD
      - name: dietary_briefing_ack
        type: boolean
        source: system
        description: true once the kitchen dietary briefing was acknowledged at check-in
        default: false
      - name: booking_status
        type: enum
        source: system
        description: occupancy dimension of the booking
        default: HELD
        constraints: "one of HELD, CONFIRMED, CHECKED_IN, CHECKED_OUT, CANCELLED"
      - name: payment_status
        type: enum
        source: system
        description: money dimension of the booking, independent of booking_status
        default: AWAITING_DEPOSIT
        constraints: "one of AWAITING_DEPOSIT, DEPOSIT_PAID, PAID_IN_FULL, PARTIALLY_REFUNDED, REFUNDED, FORFEITED"
      - name: provisional_package_total_cents
        type: integer
        source: computed
        description: package_charge_total variant provisional_at_hold, frozen at creation and re-run on party change
      - name: deposit_required_cents
        type: integer
        source: computed
        description: round_half_up(provisional_package_total_cents * Season.deposit_pct)
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: sum of DEPOSIT payments posted to this booking
        default: 0
      - name: payments_applied_cents
        type: integer
        source: computed
        description: sum of BALANCE payments posted to this booking
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: cash returned to the guest on cancellation
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: deposit retained by the ranch on cancellation
        default: 0
      - name: activity_surcharge_total_cents
        type: integer
        source: computed
        description: sum of surcharge_cents over this booking's reservations in {COMPLETED, NO_SHOW}
        default: 0
      - name: activity_credit_applied_cents
        type: integer
        source: computed
        description: included all-inclusive activity credit consumed at check-out
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: number of this booking's ActivityReservation rows that ended in NO_SHOW
        default: 0
      - name: no_show_penalty_total_cents
        type: integer
        source: computed
        description: no_show_count * Season.no_show_penalty_cents
        default: 0
      - name: gratuity_cents
        type: integer
        source: computed
        description: staff gratuity pool charge computed at check-out
        default: 0
      - name: folio_adjustment_total_cents
        type: integer
        source: computed
        description: signed sum of manual folio adjustments posted to this booking
        default: 0
      - name: realized_nights
        type: integer
        source: computed
        description: actual nights occupied, set at check-out; 0 before check-out
        default: 0
      - name: realized_subtotal_cents
        type: integer
        source: computed
        description: package_charge_total variant final_at_checkout subtotal over realized_nights
        default: 0
      - name: final_folio_total_cents
        type: integer
        source: computed
        description: folio_settlement_amount output; 0 before check-out
        default: 0
      - name: folio_balance_cents
        type: integer
        source: computed
        description: final_folio_total_cents - deposit_paid_cents - payments_applied_cents + folio_adjustment_total_cents residual per folio_settlement_amount step 10
        default: 0
      - name: cancellation_refund_pct
        type: number
        source: computed
        description: refund fraction selected by cancellation_refund_split; 0 before cancellation
        default: 0
      - name: checked_in_at
        type: datetime
        source: system
        description: logical-clock instant of check-in; null before
      - name: checked_out_at
        type: datetime
        source: system
        description: logical-clock instant of check-out; null before
      - name: cancelled_at
        type: datetime
        source: system
        description: logical-clock instant of cancellation; null before

  - name: Horse
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: horse barn name, unique across the herd
        constraints: "unique (case-sensitive) across all Horse rows"
      - name: min_rider_ability
        type: enum
        source: input
        description: lowest rider ability this horse may carry
        constraints: "one of BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"
      - name: max_rider_ability
        type: enum
        source: input
        description: highest rider ability this horse is suitable for
        constraints: "one of BEGINNER, NOVICE, INTERMEDIATE, ADVANCED; rank >= min_rider_ability"
      - name: weight_limit_lb
        type: number
        source: input
        description: maximum rider weight in pounds
        constraints: "> 0"
      - name: horse_status
        type: enum
        source: system
        description: herd health / duty state
        default: IN_SERVICE
        constraints: "one of IN_SERVICE, REST, LAME, REHAB, REVIEW_HOLD, RETIRED"
      - name: scheduled_load_hours
        type: number
        source: computed
        description: horse_load_index variant scheduled over reservations with mount_status == ASSIGNED
        default: 0
      - name: realized_load_hours
        type: number
        source: computed
        description: horse_load_index variant realized over reservations with mount_status == COMPLETED
        default: 0
      - name: consecutive_duty_days
        type: integer
        source: computed
        description: consecutive duty-day run ending at last_duty_date per horse_duty_day_run
        default: 0
      - name: last_duty_date
        type: string
        source: computed
        description: latest ISO 8601 date on which this horse completed a mount; null when never
      - name: last_rest_started_on
        type: string
        source: system
        description: observed_on of the most recent REST_START health event; null when never rested

  - name: HorseHealthEvent
    parent: Horse
    common_fields: false
    fields:
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id; the animal this immutable care record belongs to"
      - name: event_type
        type: enum
        source: input
        description: care event kind driving the horse's status transition
        constraints: "one of LAMENESS, COLIC, REST_START, REHAB_START, VET_CLEARANCE, FARRIER, RETIREMENT"
      - name: observed_on
        type: string
        source: input
        description: ISO 8601 date the condition was observed
      - name: note
        type: string
        source: input
        description: free-text care note
      - name: resulting_horse_status
        type: enum
        source: system
        description: horse_status this event left the animal in; unchanged status is echoed for FARRIER
        constraints: "one of IN_SERVICE, REST, LAME, REHAB, RETIRED"

  - name: ActivitySlot
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season whose ratio and status rules govern this slot"
      - name: activity_type
        type: enum
        source: input
        description: program this slot belongs to
        constraints: "one of TRAIL_RIDE, ARENA_LESSON, FLY_FISHING, HIKE, KIDS_PROGRAM"
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the slot begins
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the slot ends; MUST be > starts_at and same calendar date
      - name: duration_hours
        type: number
        source: computed
        description: (ends_at - starts_at) in hours, 2 decimals, round_half_up
      - name: terrain_grade
        type: enum
        source: input
        description: terrain difficulty driving the guide floor
        constraints: "one of MEADOW, ROLLING, STEEP, RIVER_CROSSING"
      - name: min_ability_rank
        type: enum
        source: input
        description: lowest rider ability admitted to this slot
        constraints: "one of UNASSESSED, BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"
      - name: capacity
        type: integer
        source: input
        description: maximum non-terminal rider reservations
        constraints: ">= 1"
      - name: rider_surcharge_cents
        type: integer
        source: input
        description: per-rider premium fee copied onto each reservation at creation
        default: 0
      - name: mount_required
        type: boolean
        source: computed
        description: true when activity_type in {TRAIL_RIDE, ARENA_LESSON}, else false
      - name: slot_status
        type: enum
        source: system
        description: slot lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, OPEN, HOLD, RUNNING, COMPLETED, CANCELLED"
      - name: hold_reason
        type: enum
        source: system
        description: why the slot auto-held; null unless slot_status == HOLD
        constraints: "one of MOUNT_SHORT, UNDERSTAFFED"
      - name: confirmed_rider_count
        type: integer
        source: computed
        description: count of reservations with reservation_status in {CONFIRMED, CHECKED_IN}
        default: 0
      - name: minor_rider_count
        type: integer
        source: computed
        description: count of those riders whose Guest.age_years < 12
        default: 0
      - name: mount_assigned_count
        type: integer
        source: computed
        description: count of those reservations with mount_status == ASSIGNED
        default: 0
      - name: assigned_guide_count
        type: integer
        source: computed
        description: count of GuideAssignments with assignment_status == SCHEDULED
        default: 0
      - name: required_guide_count
        type: integer
        source: computed
        description: guide_staffing_requirement output for the current rider mix
        default: 0
      - name: readiness_posture
        type: enum
        source: computed
        description: derived gate per slot_readiness_posture
        default: STAFFED_READY
        constraints: "one of FROZEN, MOUNT_SHORT, UNDERSTAFFED, STAFFED_READY"
      - name: seats_available
        type: integer
        source: computed
        description: capacity - confirmed_rider_count
      - name: actual_started_at
        type: datetime
        source: system
        description: logical-clock instant the slot was run; null before
      - name: actual_ended_at
        type: datetime
        source: input
        description: instant supplied at completion and used for realized load; null before completion
      - name: actual_duration_hours
        type: number
        source: computed
        description: (actual_ended_at - actual_started_at) in hours, 2 decimals, round_half_up; null before completion

  - name: GuideAssignment
    parent: ActivitySlot
    common_fields: true
    fields:
      - name: slot_id
        type: string
        source: input
        description: "FK -> ActivitySlot.id; the slot being staffed"
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the guide working the slot"
      - name: guide_role
        type: enum
        source: input
        description: staffing role on this slot
        constraints: "one of LEAD, ASSISTANT, WRANGLER"
      - name: assignment_status
        type: enum
        source: system
        description: assignment lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, RELEASED, COMPLETED"
      - name: credited_hours
        type: number
        source: computed
        description: ActivitySlot.actual_duration_hours credited when the slot completes; 0 otherwise
        default: 0

  - name: ActivityReservation
    parent: ActivitySlot
    common_fields: true
    fields:
      - name: slot_id
        type: string
        source: input
        description: "FK -> ActivitySlot.id; the slot the seat belongs to"
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the stay this activity is billed to"
      - name: guest_id
        type: string
        source: input
        description: "FK -> Guest.id; the rider occupying the seat"
      - name: assigned_horse_id
        type: string
        source: system
        description: "FK -> Horse.id; mount currently held for this rider; null when none held"
      - name: reservation_status
        type: enum
        source: system
        description: seat dimension of the reservation
        default: CONFIRMED
        constraints: "one of CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED"
      - name: mount_status
        type: enum
        source: system
        description: mount dimension, independent of reservation_status
        default: PENDING
        constraints: "one of NOT_REQUIRED, PENDING, ASSIGNED, RELEASED, COMPLETED"
      - name: surcharge_cents
        type: integer
        source: computed
        description: ActivitySlot.rider_surcharge_cents copied at creation
        default: 0
      - name: surcharge_reversed_cents
        type: integer
        source: computed
        description: surcharge credited back when the seat is cancelled before completion
        default: 0
      - name: rider_ability_at_booking
        type: enum
        source: system
        description: Guest.effective_ability_rank frozen at seat creation
        constraints: "one of BEGINNER, NOVICE, INTERMEDIATE, ADVANCED"
      - name: mount_release_count
        type: integer
        source: system
        description: number of times a held mount was released from this seat
        default: 0
      - name: checked_in_at
        type: datetime
        source: system
        description: logical-clock instant the rider checked in at the corral; null before
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the slot completed this seat; null before
      - name: cancelled_at
        type: datetime
        source: system
        description: logical-clock instant the seat was cancelled; null before

  - name: StaffMember
    parent: Season
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; season this seasonal contract belongs to"
      - name: full_name
        type: string
        source: input
        description: staff legal name
      - name: role_type
        type: enum
        source: input
        description: seasonal position
        constraints: "one of WRANGLER, GUIDE, KITCHEN, HOUSEKEEPING"
      - name: certifications
        type: array
        source: input
        description: array of WILDERNESS_FIRST_AID | EQUINE_HANDLER | FLY_CASTING | CHILD_PROGRAM
        default: []
      - name: hired_on
        type: string
        source: input
        description: ISO 8601 date the seasonal contract begins
      - name: contract_end_date
        type: string
        source: input
        description: ISO 8601 date the seasonal contract ends; MUST be > hired_on
      - name: housing_unit_code
        type: string
        source: system
        description: on-site housing unit assigned at onboarding; null until onboarded
      - name: housing_bunk_number
        type: integer
        source: system
        description: bunk within housing_unit_code; null until onboarded
      - name: employment_status
        type: enum
        source: system
        description: employment lifecycle state
        default: HIRED
        constraints: "one of HIRED, ACTIVE, COMPLETED_SEASON, DEPARTED_EARLY"
      - name: separated_on
        type: string
        source: system
        description: ISO 8601 date of early separation; null otherwise
      - name: contract_days
        type: integer
        source: computed
        description: contract_end_date - hired_on in whole days
      - name: days_worked
        type: integer
        source: computed
        description: min(max(clock_date - hired_on, 0), contract_days) in whole days
        default: 0
      - name: retention_bonus_projected_cents
        type: integer
        source: computed
        description: retention_bonus variant projected; 0 once DEPARTED_EARLY
        default: 0
      - name: retention_bonus_settled_cents
        type: integer
        source: computed
        description: retention_bonus variant settled, paid only on the season-completion cliff
        default: 0
      - name: scheduled_guide_hours
        type: number
        source: computed
        description: sum of ActivitySlot.duration_hours over SCHEDULED guide assignments
        default: 0

  - name: IncidentReport
    parent: ActivityReservation
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> ActivityReservation.id; the seat the incident occurred on"
      - name: guest_id
        type: string
        source: system
        description: "FK -> Guest.id; copied from the reservation at filing"
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id; animal involved; null for non-equine incidents"
      - name: reported_by_staff_member_id
        type: string
        source: system
        description: "FK -> StaffMember.id; the filing guide, taken from X-User-ID"
      - name: severity
        type: enum
        source: input
        description: incident severity driving the filing-time side effects
        constraints: "one of MINOR, SERIOUS, CRITICAL"
      - name: equine_activity_statute_notice_given
        type: boolean
        source: input
        description: whether the statutory equine activity notice was posted and read to the rider
      - name: narrative
        type: string
        source: input
        description: factual account of the incident
      - name: occurred_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the incident
      - name: incident_status
        type: enum
        source: system
        description: review lifecycle; CLEARED and REMEDIATION_REQUIRED are the two fork branches
        default: FILED
        constraints: "one of FILED, CLEARED, REMEDIATION_REQUIRED, CLOSED"
      - name: disposition_note
        type: string
        source: system
        description: safety officer note recorded at disposition; null while FILED
      - name: disposed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID that disposed the report; null while FILED
      - name: closed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID that closed the report; MUST differ from disposed_by_user_id
      - name: remediation_completed
        type: boolean
        source: system
        description: true when remediation was recorded at close
        default: false

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Season
    initial_state: PLANNING
    terminal_states: [OFF_SEASON]
    dimension: season_status
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /seasons/{seasonId}/advance with target_status=OPEN"
        actor: RanchManager
        preconditions:
          - "season_status == PLANNING"
          - "package_tiers has >= 1 element"
        side_effects:
          - "bookings and slot opening become permitted for this season"
      - from: OPEN
        to: IN_SEASON
        trigger: "POST /seasons/{seasonId}/advance with target_status=IN_SEASON"
        actor: RanchManager
        preconditions:
          - "season_status == OPEN"
        side_effects:
          - "booking check-in, slot run and slot complete become permitted"
      - from: IN_SEASON
        to: CLOSED
        trigger: "POST /seasons/{seasonId}/advance with target_status=CLOSED"
        actor: RanchManager
        preconditions:
          - "season_status == IN_SEASON"
          - "no Booking of this season has booking_status == CHECKED_IN"
        side_effects:
          - "runs season_financial_rollup: sets gross_package_revenue_cents, retention_bonus_liability_cents, net_surplus_cents, capital_reserve_cents"
          - "new bookings, reservations and slot opens for this season are rejected with ERR_SEASON_NOT_OPEN"
          - "increments Season.version by 1"
      - from: CLOSED
        to: OFF_SEASON
        trigger: "POST /seasons/{seasonId}/advance with target_status=OFF_SEASON"
        actor: RanchManager
        preconditions:
          - "season_status == CLOSED"
          - "every StaffMember of this season has employment_status in {COMPLETED_SEASON, DEPARTED_EARLY}"
        side_effects:
          - "cabin maintenance holds and capital project commitments become permitted"
        note: "any other target_status value, or a repeat of an already-applied one, fails ERR_INVALID_SEASON_TRANSITION"

  - entity: Cabin
    initial_state: READY
    terminal_states: []
    dimension: cabin_status
    transitions:
      - from: READY
        to: OCCUPIED
        trigger: "POST /bookings/{bookingId}/check-in (side effect of the booking transition)"
        actor: ReservationsAgent
        preconditions:
          - "cabin_status == READY"
          - "booking.cabin_id == this cabin"
        side_effects:
          - "Season.in_house_guest_count += booking.party_size"
      - from: OCCUPIED
        to: TURNOVER
        trigger: "POST /bookings/{bookingId}/check-out (side effect of the booking transition)"
        actor: ReservationsAgent
        preconditions:
          - "cabin_status == OCCUPIED"
        side_effects:
          - "Season.in_house_guest_count -= booking.party_size"
      - from: TURNOVER
        to: READY
        trigger: "POST /cabins/{cabinId}/return-to-ready"
        actor: RanchManager
        preconditions:
          - "cabin_status in {TURNOVER, OUT_OF_SERVICE}"
        side_effects:
          - "sets last_turnover_completed_at to the logical clock instant"
      - from: READY
        to: OUT_OF_SERVICE
        trigger: "POST /cabins/{cabinId}/maintenance-hold"
        actor: RanchManager
        preconditions:
          - "cabin_status == READY"
          - "the season named in the request has season_status in {CLOSED, OFF_SEASON}"
          - "capital_cost_cents <= Season.capital_reserve_cents - Season.capital_committed_cents"
          - "no Booking on this cabin with booking_status in {HELD, CONFIRMED} has arrival_date >= the season's season_start_date"
        side_effects:
          - "sets maintenance_project_code and maintenance_capital_cost_cents"
          - "Season.capital_committed_cents += capital_cost_cents"
          - "increments Season.version by 1"
      - from: OUT_OF_SERVICE
        to: READY
        trigger: "POST /cabins/{cabinId}/return-to-ready"
        actor: RanchManager
        preconditions:
          - "cabin_status == OUT_OF_SERVICE"
        side_effects:
          - "Season.capital_committed_cents -= maintenance_capital_cost_cents (the exact amount committed by this hold)"
          - "clears maintenance_project_code and resets maintenance_capital_cost_cents to 0"
          - "sets last_turnover_completed_at to the logical clock instant"
          - "increments Season.version by 1"

  - entity: Guest
    initial_state: GOOD
    terminal_states: []
    dimension: guest_standing
    note: "dimension 1 of 2 on Guest; evolves independently of waiver_status"
    transitions:
      - from: GOOD
        to: SUSPENDED
        trigger: "POST /activity-reservations/{reservationId}/incident-reports with severity=CRITICAL"
        actor: ActivityGuide
        preconditions:
          - "guest_standing == GOOD"
          - "severity == CRITICAL"
        side_effects:
          - "cascade link 2/3: every ActivityReservation of this guest with reservation_status in {CONFIRMED, CHECKED_IN} whose slot.starts_at > clock becomes CANCELLED and surcharge_reversed_cents := surcharge_cents"
          - "cascade link 3/3: each such reservation's mount_status ASSIGNED -> RELEASED, assigned_horse_id cleared, Horse.scheduled_load_hours recomputed, and the parent slot's confirmed_rider_count / mount_assigned_count / required_guide_count / readiness_posture recomputed"
      - from: GOOD
        to: RESTRICTED
        trigger: "POST /incident-reports/{incidentReportId}/dispose with disposition=REMEDIATION_REQUIRED"
        actor: SafetyOfficer
        preconditions:
          - "guest_standing == GOOD"
        side_effects:
          - "cascade link 2/4: effective_ability_rank is capped at BEGINNER by rider_ability_rank_resolution"
          - "cascade link 3/4: every future ActivityReservation of this guest whose slot.min_ability_rank rank > BEGINNER becomes CANCELLED with surcharge_reversed_cents := surcharge_cents"
          - "cascade link 4/4: each such seat releases its mount (ASSIGNED -> RELEASED) and its parent slot recomputes confirmed_rider_count, mount_assigned_count, required_guide_count and readiness_posture"
      - from: RESTRICTED
        to: GOOD
        trigger: "POST /incident-reports/{incidentReportId}/close with remediation_completed=true"
        actor: SafetyOfficer
        preconditions:
          - "guest_standing == RESTRICTED"
          - "incident_status == REMEDIATION_REQUIRED"
        side_effects:
          - "effective_ability_rank cap lifts; Guest.version increments by 1"
      - from: SUSPENDED
        to: GOOD
        trigger: "POST /incident-reports/{incidentReportId}/close with remediation_completed=true"
        actor: SafetyOfficer
        preconditions:
          - "guest_standing == SUSPENDED"
          - "incident_status in {CLEARED, REMEDIATION_REQUIRED}"
        side_effects:
          - "guest becomes eligible for new reservations again; already-cancelled seats are NOT restored"

  - entity: Guest
    initial_state: NONE
    terminal_states: []
    dimension: waiver_status
    note: "dimension 2 of 2 on Guest; a computed projection of waiver_signed_on / waiver_expires_on / waiver_revoked_at per guest_waiver_status_resolution"
    transitions:
      - from: NONE
        to: SIGNED
        trigger: "POST /guests/{guestId}/waiver-signature"
        actor: Guest
        preconditions:
          - "waiver_status in {NONE, EXPIRED, REVOKED}"
          - "equine_statute_ack == true in the request"
          - "if age_years < 18 then guardian_guest_id is present and references a Guest with age_years >= 18"
        side_effects:
          - "sets waiver_signed_on, waiver_expires_on, equine_statute_ack, waiver_signed_by_guardian_guest_id; clears waiver_revoked_at"
      - from: SIGNED
        to: REVOKED
        trigger: "POST /guests/{guestId}/waiver-revocation"
        actor: SafetyOfficer
        preconditions:
          - "waiver_status == SIGNED"
        side_effects:
          - "sets waiver_revoked_at to the logical clock instant"
          - "cascade link 2/4: every ActivityReservation of this guest with reservation_status == CONFIRMED whose slot.starts_at > clock becomes CANCELLED with surcharge_reversed_cents := surcharge_cents"
          - "cascade link 3/4: each cancelled seat's mount_status ASSIGNED -> RELEASED, assigned_horse_id cleared and Horse.scheduled_load_hours recomputed"
          - "cascade link 4/4: each affected slot recomputes confirmed_rider_count, mount_assigned_count, required_guide_count and readiness_posture, and an OPEN slot whose posture became MOUNT_SHORT or UNDERSTAFFED transitions to HOLD"
      - from: REVOKED
        to: SIGNED
        trigger: "POST /guests/{guestId}/waiver-signature"
        actor: Guest
        preconditions:
          - "waiver_status == REVOKED"
          - "equine_statute_ack == true in the request"
        side_effects:
          - "clears waiver_revoked_at; sets a fresh waiver_signed_on / waiver_expires_on pair"
      - from: SIGNED
        to: EXPIRED
        trigger: "system: logical clock date advances past waiver_expires_on"
        actor: system
        preconditions:
          - "waiver_revoked_at is null"
          - "clock date > waiver_expires_on"
        side_effects:
          - "no stored field changes; waiver_status is recomputed on every read and on every safety validation"
      - from: EXPIRED
        to: SIGNED
        trigger: "POST /guests/{guestId}/waiver-signature"
        actor: Guest
        preconditions:
          - "waiver_status == EXPIRED"
          - "equine_statute_ack == true in the request"
        side_effects:
          - "sets a fresh waiver_signed_on / waiver_expires_on pair"

  - entity: RiderAssessment
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    dimension: assessment_status
    transitions:
      - from: PENDING
        to: EVALUATED
        trigger: "POST /rider-assessments/{assessmentId}/evaluate"
        actor: HorseProgramDirector
        preconditions:
          - "assessment_status == PENDING"
        side_effects:
          - "sets assessed_ability, assessed_by_note, evaluated_at"
          - "Guest.current_ability_rank and Guest.effective_ability_rank recomputed per rider_ability_rank_resolution"
          - "increments Guest.version by 1"
      - from: EVALUATED
        to: RE_EVALUATION_REQUESTED
        trigger: "POST /rider-assessments/{assessmentId}/flag-re-evaluation"
        actor: HorseProgramDirector
        preconditions:
          - "assessment_status == EVALUATED"
        side_effects:
          - "sets re_evaluation_reason"
          - "cascade link 2/4: Guest.effective_ability_rank is capped at NOVICE"
          - "cascade link 3/4: every ActivityReservation of this guest with reservation_status == CONFIRMED whose slot.starts_at > clock and slot.min_ability_rank rank > NOVICE becomes CANCELLED with surcharge_reversed_cents := surcharge_cents"
          - "cascade link 4/4: each such seat releases its mount and its parent slot recomputes counts, required_guide_count and readiness_posture"
      - from: RE_EVALUATION_REQUESTED
        to: EVALUATED
        trigger: "POST /rider-assessments/{assessmentId}/evaluate"
        actor: HorseProgramDirector
        preconditions:
          - "assessment_status == RE_EVALUATION_REQUESTED"
        side_effects:
          - "overwrites assessed_ability, assessed_by_note and evaluated_at; clears re_evaluation_reason"
          - "the NOVICE cap lifts and Guest.effective_ability_rank is recomputed"
        note: "cycle EVALUATED -> RE_EVALUATION_REQUESTED -> EVALUATED may repeat without limit"
      - from: EVALUATED
        to: SUPERSEDED
        trigger: "system: POST /guests/{guestId}/rider-assessments creates a newer assessment for the same guest"
        actor: system
        preconditions:
          - "assessment_status in {EVALUATED, RE_EVALUATION_REQUESTED}"
        side_effects:
          - "the new PENDING assessment becomes the guest's only non-terminal assessment"
      - from: RE_EVALUATION_REQUESTED
        to: SUPERSEDED
        trigger: "system: POST /guests/{guestId}/rider-assessments creates a newer assessment for the same guest"
        actor: system
        preconditions:
          - "assessment_status == RE_EVALUATION_REQUESTED"
        side_effects:
          - "the NOVICE cap from this assessment stops applying once it is SUPERSEDED"

  - entity: Booking
    initial_state: HELD
    terminal_states: [CHECKED_OUT, CANCELLED]
    dimension: booking_status
    note: "dimension 1 of 2 on Booking; evolves independently of payment_status"
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{bookingId}/confirm"
        actor: ReservationsAgent
        preconditions:
          - "booking_status == HELD"
          - "Season.season_status in {OPEN, IN_SEASON}"
          - "deposit_paid_cents >= deposit_required_cents"
        side_effects:
          - "Season.bed_nights_sold += party_size * nights"
          - "increments Season.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{bookingId}/check-in"
        actor: ReservationsAgent
        preconditions:
          - "booking_status == CONFIRMED"
          - "Season.season_status == IN_SEASON"
          - "Cabin.cabin_status == READY"
          - "Season.in_house_guest_count + party_size <= Season.dining_seat_capacity"
          - "dietary_briefing_ack == true in the request when any party member declares a dietary_restrictions value other than NONE"
        side_effects:
          - "Cabin READY -> OCCUPIED"
          - "Season.in_house_guest_count += party_size"
          - "sets checked_in_at and dietary_briefing_ack"
          - "increments Cabin.version and Season.version by 1 each"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /bookings/{bookingId}/check-out"
        actor: ReservationsAgent
        preconditions:
          - "booking_status == CHECKED_IN"
          - "no ActivityReservation of this booking has reservation_status in {CONFIRMED, CHECKED_IN} with slot.slot_status in {DRAFT, OPEN, HOLD, RUNNING}"
          - "folio_balance_cents == 0 after settle_payment_cents is applied (else ERR_FOLIO_BALANCE_OUTSTANDING)"
        side_effects:
          - "runs package_charge_total variant final_at_checkout then folio_settlement_amount; sets realized_nights, realized_subtotal_cents, activity_surcharge_total_cents, activity_credit_applied_cents, no_show_penalty_total_cents, gratuity_cents, final_folio_total_cents, folio_balance_cents"
          - "payment_status DEPOSIT_PAID -> PAID_IN_FULL"
          - "Cabin OCCUPIED -> TURNOVER"
          - "Season.in_house_guest_count -= party_size; Season.gross_package_revenue_cents += final_folio_total_cents"
          - "sets checked_out_at"
      - from: HELD
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: ReservationsAgent
        preconditions:
          - "booking_status == HELD"
        side_effects:
          - "runs cancellation_refund_split over deposit_paid_cents; sets cancellation_refund_pct, refunded_cents, forfeited_cents"
          - "payment_status advances on its own dimension to REFUNDED, PARTIALLY_REFUNDED or FORFEITED"
          - "sets cancelled_at; the cabin's occupancy interval is released for re-booking"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: ReservationsAgent
        preconditions:
          - "booking_status == CONFIRMED"
        side_effects:
          - "cascade link 1/4: booking_status -> CANCELLED, cancellation_refund_split runs, cancelled_at set, Season.bed_nights_sold -= party_size * nights"
          - "cascade link 2/4: because the booking is CANCELLED, every ActivityReservation of this booking with reservation_status in {CONFIRMED, CHECKED_IN} becomes CANCELLED and surcharge_reversed_cents := surcharge_cents (Booking.activity_surcharge_total_cents returns to its pre-reservation value)"
          - "cascade link 3/4: because those seats are CANCELLED, each seat with mount_status == ASSIGNED moves to RELEASED, assigned_horse_id is cleared, mount_release_count += 1 and the horse's scheduled_load_hours is recomputed by horse_load_index"
          - "cascade link 4/4: because those seats left CONFIRMED, each parent ActivitySlot recomputes confirmed_rider_count, minor_rider_count, mount_assigned_count, required_guide_count, seats_available and readiness_posture; an OPEN slot whose posture became UNDERSTAFFED or MOUNT_SHORT transitions to HOLD with the matching hold_reason"

  - entity: Booking
    initial_state: AWAITING_DEPOSIT
    terminal_states: [REFUNDED, FORFEITED]
    dimension: payment_status
    note: "dimension 2 of 2 on Booking; a booking may be CANCELLED while payment_status is still AWAITING_DEPOSIT, and PAID_IN_FULL only ever follows check-out"
    transitions:
      - from: AWAITING_DEPOSIT
        to: DEPOSIT_PAID
        trigger: "POST /bookings/{bookingId}/payments with kind=DEPOSIT"
        actor: ReservationsAgent
        preconditions:
          - "booking_status in {HELD, CONFIRMED}"
          - "deposit_paid_cents + amount_cents >= deposit_required_cents"
        side_effects:
          - "deposit_paid_cents += amount_cents"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /bookings/{bookingId}/check-out"
        actor: ReservationsAgent
        preconditions:
          - "folio_balance_cents == 0 after settlement"
        side_effects:
          - "payments_applied_cents += settle_payment_cents"
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "POST /bookings/{bookingId}/cancel with cancellation_refund_pct == 1.00"
        actor: ReservationsAgent
        preconditions:
          - "deposit_paid_cents > 0"
          - "cancellation_refund_split selects refund_pct == 1.00"
        side_effects:
          - "refunded_cents := deposit_paid_cents; forfeited_cents := 0"
      - from: DEPOSIT_PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /bookings/{bookingId}/cancel with 0 < cancellation_refund_pct < 1"
        actor: ReservationsAgent
        preconditions:
          - "deposit_paid_cents > 0"
          - "cancellation_refund_split selects 0 < refund_pct < 1"
        side_effects:
          - "refunded_cents := round_half_up(deposit_paid_cents * refund_pct); forfeited_cents := deposit_paid_cents - refunded_cents"
      - from: DEPOSIT_PAID
        to: FORFEITED
        trigger: "POST /bookings/{bookingId}/cancel with cancellation_refund_pct == 0.00"
        actor: ReservationsAgent
        preconditions:
          - "deposit_paid_cents > 0"
          - "cancellation_refund_split selects refund_pct == 0.00"
        side_effects:
          - "forfeited_cents := deposit_paid_cents; refunded_cents := 0"
      - from: AWAITING_DEPOSIT
        to: FORFEITED
        trigger: "POST /bookings/{bookingId}/cancel while deposit_paid_cents == 0"
        actor: ReservationsAgent
        preconditions:
          - "deposit_paid_cents == 0"
        side_effects:
          - "refunded_cents := 0; forfeited_cents := 0 (nothing was collected, so the conserved total is 0)"

  - entity: Horse
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    dimension: horse_status
    transitions:
      - from: IN_SERVICE
        to: LAME
        trigger: "POST /horses/{horseId}/health-events with event_type in {LAMENESS, COLIC}"
        actor: HorseProgramDirector
        preconditions:
          - "horse_status == IN_SERVICE"
        side_effects:
          - "cascade link 1/4: horse_status -> LAME, resulting_horse_status := LAME on the immutable event"
          - "cascade link 2/4: because the horse is LAME, every ActivityReservation with assigned_horse_id == this horse, mount_status == ASSIGNED and slot.starts_at > clock moves mount_status ASSIGNED -> RELEASED, clears assigned_horse_id and increments mount_release_count"
          - "cascade link 3/4: because those seats lost their mount, each parent ActivitySlot recomputes mount_assigned_count and readiness_posture, which becomes MOUNT_SHORT whenever mount_required and mount_assigned_count < confirmed_rider_count"
          - "cascade link 4/4: because the posture became MOUNT_SHORT, each such slot with slot_status == OPEN transitions to HOLD with hold_reason MOUNT_SHORT"
          - "Horse.scheduled_load_hours recomputed by horse_load_index variant scheduled"
      - from: LAME
        to: REHAB
        trigger: "POST /horses/{horseId}/health-events with event_type=REHAB_START"
        actor: HorseProgramDirector
        preconditions:
          - "horse_status == LAME"
        side_effects:
          - "resulting_horse_status := REHAB"
      - from: REHAB
        to: IN_SERVICE
        trigger: "POST /horses/{horseId}/health-events with event_type=VET_CLEARANCE"
        actor: HorseProgramDirector
        preconditions:
          - "horse_status in {REHAB, REST}"
        side_effects:
          - "resulting_horse_status := IN_SERVICE; consecutive_duty_days := 0"
        note: "closes the cycle IN_SERVICE -> LAME -> REHAB -> IN_SERVICE"
      - from: IN_SERVICE
        to: REST
        trigger: "POST /horses/{horseId}/health-events with event_type=REST_START"
        actor: HorseProgramDirector
        preconditions:
          - "horse_status == IN_SERVICE"
        side_effects:
          - "sets last_rest_started_on := observed_on; consecutive_duty_days := 0"
          - "the same release cascade as IN_SERVICE -> LAME runs for future ASSIGNED seats"
      - from: REST
        to: IN_SERVICE
        trigger: "POST /horses/{horseId}/health-events with event_type=VET_CLEARANCE"
        actor: HorseProgramDirector
        preconditions:
          - "horse_status == REST"
        side_effects:
          - "resulting_horse_status := IN_SERVICE"
        note: "closes the cycle IN_SERVICE -> REST -> IN_SERVICE"
      - from: IN_SERVICE
        to: REVIEW_HOLD
        trigger: "POST /activity-reservations/{reservationId}/incident-reports naming this horse"
        actor: ActivityGuide
        preconditions:
          - "horse_status == IN_SERVICE"
        side_effects:
          - "the horse is withheld from the mount pool until the incident is disposed"
      - from: REVIEW_HOLD
        to: IN_SERVICE
        trigger: "POST /incident-reports/{incidentReportId}/dispose with disposition=CLEARED"
        actor: SafetyOfficer
        preconditions:
          - "horse_status == REVIEW_HOLD"
        side_effects:
          - "the horse re-enters the mount pool immediately"
      - from: REVIEW_HOLD
        to: REHAB
        trigger: "POST /incident-reports/{incidentReportId}/dispose with disposition=REMEDIATION_REQUIRED"
        actor: SafetyOfficer
        preconditions:
          - "horse_status == REVIEW_HOLD"
        side_effects:
          - "the horse stays out of the pool until a VET_CLEARANCE health event"
        note: "divergent branch of the same fork: CLEARED returns the animal to IN_SERVICE, REMEDIATION_REQUIRED routes it to REHAB"
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /horses/{horseId}/health-events with event_type=RETIREMENT"
        actor: HorseProgramDirector
        preconditions:
          - "horse_status in {IN_SERVICE, REST, LAME, REHAB, REVIEW_HOLD}"
        side_effects:
          - "the same release cascade as IN_SERVICE -> LAME runs; the horse can never return to the pool"

  - entity: GuideAssignment
    initial_state: SCHEDULED
    terminal_states: [RELEASED, COMPLETED]
    dimension: assignment_status
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /guide-assignments/{guideAssignmentId}/release, or the StaffMember ACTIVE -> DEPARTED_EARLY cascade"
        actor: RanchManager
        preconditions:
          - "assignment_status == SCHEDULED"
          - "slot.slot_status in {DRAFT, OPEN, HOLD}"
        side_effects:
          - "slot.assigned_guide_count decremented; slot.readiness_posture recomputed"
          - "an OPEN slot whose posture became UNDERSTAFFED transitions to HOLD with hold_reason UNDERSTAFFED"
          - "StaffMember.scheduled_guide_hours recomputed"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /activity-slots/{slotId}/complete"
        actor: ActivityGuide
        preconditions:
          - "assignment_status == SCHEDULED"
          - "slot.slot_status == RUNNING"
        side_effects:
          - "credited_hours := slot.actual_duration_hours"

  - entity: ActivitySlot
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    dimension: slot_status
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /activity-slots/{slotId}/open"
        actor: RanchManager
        preconditions:
          - "slot_status == DRAFT"
          - "Season.season_status in {OPEN, IN_SEASON}"
          - "assigned_guide_count >= 1"
        side_effects:
          - "readiness_posture recomputed by slot_readiness_posture; seats_available := capacity - confirmed_rider_count"
      - from: OPEN
        to: HOLD
        trigger: "a new seat that raises required_guide_count or the unmounted rider count above what is staffed, the guide-release cascade, or the horse-release cascade"
        actor: system
        preconditions:
          - "slot_status == OPEN"
          - "readiness_posture in {UNDERSTAFFED, MOUNT_SHORT}"
        side_effects:
          - "hold_reason := UNDERSTAFFED when assigned_guide_count < required_guide_count, else MOUNT_SHORT"
          - "no new ActivityReservation may be created while the slot is on HOLD"
      - from: HOLD
        to: OPEN
        trigger: "POST /activity-slots/{slotId}/open"
        actor: RanchManager
        preconditions:
          - "slot_status == HOLD"
          - "readiness_posture == STAFFED_READY"
        side_effects:
          - "hold_reason cleared"
        note: "closes the cycle OPEN -> HOLD -> OPEN; a slot may re-enter HOLD any number of times"
      - from: OPEN
        to: RUNNING
        trigger: "POST /activity-slots/{slotId}/run"
        actor: ActivityGuide
        preconditions:
          - "slot_status == OPEN"
          - "Season.season_status == IN_SEASON"
          - "readiness_posture == STAFFED_READY"
          - "current clock >= starts_at"
        side_effects:
          - "every ActivityReservation still in CONFIRMED whose guest has not checked in stays CONFIRMED and is eligible for NO_SHOW at completion"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /activity-slots/{slotId}/complete"
        actor: ActivityGuide
        preconditions:
          - "slot_status == RUNNING"
          - "actual_duration_hours provided in the request"
        side_effects:
          - "every CHECKED_IN reservation becomes COMPLETED; every still-CONFIRMED reservation becomes NO_SHOW and its booking's no_show_count and no_show_penalty_total_cents increase"
          - "every ASSIGNED mount moves to COMPLETED, Horse.realized_load_hours += actual_duration_hours, Horse.consecutive_duty_days recomputed by horse_duty_day_run"
          - "every SCHEDULED GuideAssignment becomes COMPLETED with credited_hours := actual_duration_hours, so StaffMember.scheduled_guide_hours drops by this slot's duration_hours"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /activity-slots/{slotId}/cancel"
        actor: RanchManager
        preconditions:
          - "slot_status == DRAFT"
        side_effects:
          - "no seats exist yet, so nothing is reversed"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /activity-slots/{slotId}/cancel"
        actor: RanchManager
        preconditions:
          - "slot_status in {OPEN, HOLD}"
        side_effects:
          - "every CONFIRMED reservation becomes CANCELLED and surcharge_reversed_cents := surcharge_cents, returning Booking.activity_surcharge_total_cents to its pre-reservation value"
          - "every ASSIGNED mount becomes RELEASED and the horses' scheduled_load_hours are recomputed"
          - "every SCHEDULED GuideAssignment becomes RELEASED"
      - from: HOLD
        to: CANCELLED
        trigger: "POST /activity-slots/{slotId}/cancel"
        actor: RanchManager
        preconditions:
          - "slot_status == HOLD"
        side_effects:
          - "identical reversal to the OPEN -> CANCELLED transition"

  - entity: ActivityReservation
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    dimension: reservation_status
    note: "dimension 1 of 2 on ActivityReservation; evolves independently of mount_status"
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /activity-reservations/{reservationId}/check-in"
        actor: ActivityGuide
        preconditions:
          - "reservation_status == CONFIRMED"
          - "slot.slot_status == RUNNING"
          - "Guest.waiver_status == SIGNED and Guest.equine_statute_ack == true"
          - "Guest.guest_standing != SUSPENDED"
          - "mount_status in {NOT_REQUIRED, ASSIGNED}"
        side_effects:
          - "sets checked_in_at"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /activity-slots/{slotId}/complete"
        actor: ActivityGuide
        preconditions:
          - "reservation_status == CHECKED_IN"
        side_effects:
          - "mount_status ASSIGNED -> COMPLETED on the other dimension; Horse.realized_load_hours increased"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /activity-slots/{slotId}/complete while the seat never checked in"
        actor: ActivityGuide
        preconditions:
          - "reservation_status == CONFIRMED"
          - "slot_status == RUNNING moving to COMPLETED"
        side_effects:
          - "Booking.no_show_count += 1 and Booking.no_show_penalty_total_cents := no_show_count * Season.no_show_penalty_cents, which folio_settlement_amount charges at check-out"
          - "mount_status ASSIGNED -> RELEASED on the other dimension"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /activity-reservations/{reservationId}/cancel, or the booking-cancel / slot-cancel cascade"
        actor: ReservationsAgent
        preconditions:
          - "reservation_status == CONFIRMED"
          - "slot.slot_status != RUNNING"
        side_effects:
          - "surcharge_reversed_cents := surcharge_cents; Booking.activity_surcharge_total_cents -= surcharge_cents"
          - "slot.confirmed_rider_count, minor_rider_count, required_guide_count, seats_available and readiness_posture recomputed"
          - "mount_status ASSIGNED -> RELEASED on the other dimension"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /activity-reservations/{reservationId}/cancel"
        actor: ReservationsAgent
        preconditions:
          - "reservation_status == CHECKED_IN"
          - "slot.slot_status == RUNNING"
        side_effects:
          - "identical reversal to CONFIRMED -> CANCELLED; the seat is not counted as a NO_SHOW"

  - entity: ActivityReservation
    initial_state: PENDING
    terminal_states: [COMPLETED, NOT_REQUIRED]
    dimension: mount_status
    note: "dimension 2 of 2 on ActivityReservation; a seat on a non-mounted slot is created directly in NOT_REQUIRED, and a mounted seat may cycle PENDING -> ASSIGNED -> RELEASED -> ASSIGNED any number of times"
    transitions:
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /activity-slots/{slotId}/reservations on a slot with mount_required == false"
        actor: ReservationsAgent
        preconditions:
          - "slot.mount_required == false"
        side_effects:
          - "assigned_horse_id stays null for the life of the seat"
      - from: PENDING
        to: ASSIGNED
        trigger: "POST /activity-reservations/{reservationId}/mount-assignments or POST /activity-reservations/{reservationId}/mount-auto-assign"
        actor: HorseProgramDirector
        preconditions:
          - "mount_status in {PENDING, RELEASED}"
          - "slot.mount_required == true"
          - "the horse passes every mount_selection_ranking eligibility filter"
        side_effects:
          - "assigned_horse_id set; Horse.scheduled_load_hours += slot.duration_hours; increments Horse.version by 1"
          - "slot.mount_assigned_count += 1; slot.readiness_posture recomputed and a HOLD whose only defect was MOUNT_SHORT can be re-opened"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /activity-reservations/{reservationId}/mount-release, the horse-status cascade, or a seat cancellation"
        actor: HorseProgramDirector
        preconditions:
          - "mount_status == ASSIGNED"
          - "slot.slot_status != COMPLETED"
        side_effects:
          - "Horse.scheduled_load_hours -= slot.duration_hours (exact restoration of the pre-assignment value); assigned_horse_id cleared; mount_release_count += 1"
          - "slot.mount_assigned_count -= 1; readiness_posture recomputed"
      - from: RELEASED
        to: ASSIGNED
        trigger: "POST /activity-reservations/{reservationId}/mount-assignments"
        actor: HorseProgramDirector
        preconditions:
          - "mount_status == RELEASED"
          - "slot.slot_status in {DRAFT, OPEN, HOLD}"
        side_effects:
          - "same effects as PENDING -> ASSIGNED; a different horse may be chosen"
        note: "closes the cycle ASSIGNED -> RELEASED -> ASSIGNED"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /activity-slots/{slotId}/complete"
        actor: ActivityGuide
        preconditions:
          - "mount_status == ASSIGNED"
          - "reservation_status == CHECKED_IN"
        side_effects:
          - "Horse.realized_load_hours += slot.actual_duration_hours; Horse.consecutive_duty_days recomputed; the mount can no longer be released"

  - entity: StaffMember
    initial_state: HIRED
    terminal_states: [COMPLETED_SEASON, DEPARTED_EARLY]
    dimension: employment_status
    transitions:
      - from: HIRED
        to: ACTIVE
        trigger: "POST /staff-members/{staffMemberId}/onboard"
        actor: RanchManager
        preconditions:
          - "employment_status == HIRED"
          - "current clock date >= hired_on"
          - "when housing_unit_code is present, no other StaffMember with employment_status in {HIRED, ACTIVE} in the same Season holds the same housing_unit_code and housing_bunk_number"
        side_effects:
          - "employment_status -> ACTIVE; housing_unit_code and housing_bunk_number are set from the request; the staff member becomes eligible for GuideAssignment"
      - from: ACTIVE
        to: COMPLETED_SEASON
        trigger: "POST /staff-members/{staffMemberId}/complete-season"
        actor: RanchManager
        preconditions:
          - "employment_status == ACTIVE"
          - "current clock date >= contract_end_date"
          - "no GuideAssignment of this staff member is still SCHEDULED"
        side_effects:
          - "retention_bonus variant settled runs: retention_bonus_settled_cents := Season.retention_bonus_cents in full because the contract reached its end date"
          - "Season.retention_bonus_liability_cents += retention_bonus_settled_cents; increments Season.version by 1"
          - "housing_unit_code and housing_bunk_number are released for reuse"
      - from: ACTIVE
        to: DEPARTED_EARLY
        trigger: "POST /staff-members/{staffMemberId}/separate"
        actor: RanchManager
        preconditions:
          - "employment_status == ACTIVE"
          - "current clock date < contract_end_date"
        side_effects:
          - "cascade link 1/3: separated_on set from the clock date, days_worked frozen, and retention_bonus variant settled writes retention_bonus_settled_cents using the pro-rated cliff; Season.retention_bonus_liability_cents += that amount"
          - "cascade link 2/3: because the staff member departed, every GuideAssignment of theirs in SCHEDULED becomes RELEASED and StaffMember.scheduled_guide_hours drops to 0"
          - "cascade link 3/3: because guides were released, each affected ActivitySlot recomputes assigned_guide_count and readiness_posture, and an OPEN slot whose posture became UNDERSTAFFED transitions to HOLD with hold_reason UNDERSTAFFED"
      - from: HIRED
        to: DEPARTED_EARLY
        trigger: "POST /staff-members/{staffMemberId}/separate"
        actor: RanchManager
        preconditions:
          - "employment_status == HIRED"
        side_effects:
          - "retention_bonus_settled_cents := 0 because days_worked is 0; no guide assignment can exist yet, so nothing cascades"

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [CLOSED]
    dimension: incident_status
    transitions:
      - from: FILED
        to: CLEARED
        trigger: "POST /incident-reports/{incidentReportId}/dispose with disposition=CLEARED"
        actor: SafetyOfficer
        preconditions:
          - "incident_status == FILED"
          - "equine_activity_statute_notice_given == true on the report"
        side_effects:
          - "sets disposition_note and disposed_by_user_id from the request and X-User-ID"
          - "when horse_id is present, Horse REVIEW_HOLD -> IN_SERVICE"
      - from: FILED
        to: REMEDIATION_REQUIRED
        trigger: "POST /incident-reports/{incidentReportId}/dispose with disposition=REMEDIATION_REQUIRED"
        actor: SafetyOfficer
        preconditions:
          - "incident_status == FILED"
          - "equine_activity_statute_notice_given == true on the report"
        side_effects:
          - "cascade link 1/3: sets disposition_note and disposed_by_user_id, and incident_status becomes REMEDIATION_REQUIRED"
          - "cascade link 2/3: because remediation is required, the involved Guest moves guest_standing GOOD -> RESTRICTED and Guest.effective_ability_rank is capped at BEGINNER by rider_ability_rank_resolution"
          - "cascade link 3/3: because the guest is RESTRICTED, every future ActivityReservation of that guest on a slot with difficulty_rank above BEGINNER becomes CANCELLED, releasing its mount and forcing each parent slot to recompute readiness_posture"
        note: "divergent branch of the FILED fork: CLEARED touches only the horse, REMEDIATION_REQUIRED runs a three-level guest cascade"
      - from: CLEARED
        to: CLOSED
        trigger: "POST /incident-reports/{incidentReportId}/close"
        actor: SafetyOfficer
        preconditions:
          - "incident_status == CLEARED"
          - "the acting X-User-ID differs from disposed_by_user_id"
        side_effects:
          - "sets closed_by_user_id; the report becomes immutable"
      - from: REMEDIATION_REQUIRED
        to: CLOSED
        trigger: "POST /incident-reports/{incidentReportId}/close"
        actor: SafetyOfficer
        preconditions:
          - "incident_status == REMEDIATION_REQUIRED"
          - "the acting X-User-ID differs from disposed_by_user_id"
          - "remediation_completed == true in the request"
        side_effects:
          - "sets closed_by_user_id and remediation_completed := true"
        note: "join point: both fork branches converge on CLOSED, but only this branch demands remediation_completed"

concurrency_rules:
  - rule_id: reservation-create-stale-slot
    parent_entity: ActivitySlot
    write_endpoint: "POST /activity-slots/{slotId}/reservations"
    occ_field: "expected_slot_version"
    description: |
      Creating an ActivityReservation against an ActivitySlot whose version has
      advanced since the client last read it is rejected. Each accepted seat
      changes confirmed_rider_count, minor_rider_count, required_guide_count,
      seats_available and readiness_posture, so a writer holding a stale view of
      the slot is deciding against an obsolete seat count and staffing ratio;
      the seat itself would otherwise be a legitimate booking, so the stale
      version is the only signal that the client's view is out of date.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-guest
    parent_entity: Guest
    write_endpoint: "POST /guests/{guestId}/rider-assessments"
    occ_field: "expected_guest_version"
    description: |
      Creating a RiderAssessment for a Guest whose version has advanced since the
      client last read it is rejected. A new assessment legitimately supersedes
      the prior one and rewrites Guest.effective_ability_rank, so an assessment
      authored against a stale Guest view would silently overwrite a rank that has
      already moved (for example via an incident remediation cap).
    error_id: ERR_STALE_GUEST_VERSION
    http_status: 412

  - rule_id: mount-assign-stale-horse
    parent_entity: Horse
    write_endpoint: "POST /activity-reservations/{reservationId}/mount-assignments"
    occ_field: "expected_horse_version"
    description: |
      Assigning a Horse to a seat while carrying a Horse version older than the
      stored one is rejected. Every accepted assignment or release moves
      Horse.scheduled_load_hours and may change horse_status, so a writer with a
      stale view of the animal is allocating against an obsolete daily load; the
      assignment would otherwise be valid, which is why the version check is the
      discriminator.
    error_id: ERR_STALE_HORSE_VERSION
    http_status: 412

  - rule_id: folio-adjustment-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{bookingId}/folio-adjustments"
    occ_field: "expected_booking_version"
    description: |
      Posting a folio adjustment against a Booking whose version has advanced
      since the client last read it is rejected. Adjustments are additive money
      entries that a second author may legitimately post as well, so nothing in
      the booking state forbids the write; only the stale version reveals that
      the author priced the adjustment against an obsolete folio.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: package_charge_total
    trigger: "on POST /bookings (variant provisional_at_hold) and again on POST /bookings/{bookingId}/check-out (variant final_at_checkout)"
    algorithm: tiered_pricing
    formula: |
      tier := the element of Season.package_tiers whose code == Booking.package_tier_code
      nights := whole days between arrival_date and departure_date
                (variant provisional_at_hold uses the contracted nights;
                 variant final_at_checkout uses realized_nights)
      # length-of-stay discount band, evaluated on the SAME nights value
      los_discount_pct := 0.00            if nights <= 7
                          0.05            if 8 <= nights <= 13
                          0.08            if nights >= 14
      # PER-MEMBER-LINE ROUNDING, THEN SUM (this order is normative)
      for each member m in Booking.party_members:
          member_nightly_cents := tier.adult_nightly_rate_cents
                                    if m.member_type == ADULT
                                  round_half_up(tier.adult_nightly_rate_cents *
                                                (1 - tier.child_discount_pct))
                                    if m.member_type == CHILD
          member_line_cents := round_half_up(member_nightly_cents * nights *
                                             (1 - los_discount_pct))
      subtotal_cents := sum of member_line_cents over all party members
      buyout_premium_cents := round_half_up(subtotal_cents * Season.buyout_premium_pct)
                                if Booking.is_buyout else 0
      package_total_cents := subtotal_cents + buyout_premium_cents
      deposit_required_cents := round_half_up(package_total_cents * Season.deposit_pct)
    input_set: "every element of Booking.party_members; the tier row named by package_tier_code; Season.buyout_premium_pct only when is_buyout is true"
    constants:
      LOS_BAND_1_MAX_NIGHTS: 7
      LOS_BAND_2_MAX_NIGHTS: 13
      LOS_BAND_2_DISCOUNT_PCT: 0.05
      LOS_BAND_3_DISCOUNT_PCT: 0.08
    precision: "integer cents; round_half_up applied once per member line and once per premium/deposit; rounding the summed unrounded lines instead of each line is a different (wrong) result"
    variants:
      - name: provisional_at_hold
        when: "POST /bookings, before any stay has happened"
        difference: "nights := departure_date - arrival_date as contracted; writes provisional_package_total_cents and deposit_required_cents; no gratuity, credit, surcharge or no-show component exists yet"
      - name: final_at_checkout
        when: "POST /bookings/{bookingId}/check-out"
        difference: "nights := realized_nights, the whole days between arrival_date and the check-out clock date, used exactly as measured with no min_stay_nights floor; an early departure therefore re-bands the length-of-stay discount and writes a realized_subtotal_cents that differs from provisional_package_total_cents, which then feeds folio_settlement_amount"

  - name: folio_settlement_amount
    trigger: "on POST /bookings/{bookingId}/check-out, after package_charge_total variant final_at_checkout has produced realized_subtotal_cents"
    algorithm: waterfall_allocation
    formula: |
      # the ten steps below run in exactly this order; reordering steps 3-7 changes the result
      1. realized_subtotal_cents := package_charge_total(final_at_checkout)
      2. activity_surcharge_total_cents := sum of surcharge_cents over this booking's
         ActivityReservation rows with reservation_status in {CHECKED_IN, COMPLETED, NO_SHOW}
         minus the sum of surcharge_reversed_cents over CANCELLED rows
      3. activity_credit_cap_cents := tier.included_activity_credit_cents
             + HIGH_SPEND_CREDIT_BONUS_CENTS if realized_subtotal_cents >= HIGH_SPEND_THRESHOLD_CENTS
             else tier.included_activity_credit_cents
      4. activity_credit_applied_cents := min(activity_credit_cap_cents,
                                              activity_surcharge_total_cents)
      5. no_show_penalty_total_cents := no_show_count * Season.no_show_penalty_cents
      6. gratuity_base_cents := realized_subtotal_cents
         (the base deliberately EXCLUDES surcharges, credits, penalties and adjustments)
      7. gratuity_cents := round_half_up(gratuity_base_cents * GRATUITY_PCT)
      8. folio_adjustment_total_cents := signed sum of every posted folio adjustment
      9. final_folio_total_cents := realized_subtotal_cents
                                    + activity_surcharge_total_cents
                                    - activity_credit_applied_cents
                                    + no_show_penalty_total_cents
                                    + gratuity_cents
                                    + folio_adjustment_total_cents
      10. folio_balance_cents := final_folio_total_cents
                                 - deposit_paid_cents
                                 - payments_applied_cents
    input_set: "the booking's ActivityReservation rows filtered by reservation_status as shown in step 2; every FolioAdjustment posted through POST /bookings/{bookingId}/folio-adjustments"
    constants:
      GRATUITY_PCT: 0.18
      HIGH_SPEND_THRESHOLD_CENTS: 1200000
      HIGH_SPEND_CREDIT_BONUS_CENTS: 5000
    precision: "integer cents, round_half_up at step 7 only; every other step is exact integer arithmetic"

  - name: horse_load_index
    trigger: "on every mount assignment, mount release and slot completion"
    algorithm: aggregation
    formula: |
      variant scheduled:
        scheduled_load_hours := sum of slot.duration_hours over every ActivityReservation
          with assigned_horse_id == horse.id AND mount_status == ASSIGNED
      variant realized:
        realized_load_hours := sum of slot.actual_duration_hours over every
          ActivityReservation with assigned_horse_id == horse.id
          AND mount_status == COMPLETED
      daily_scheduled_hours(date) := sum of slot.duration_hours over ASSIGNED seats
          whose slot.starts_at falls on `date`
    input_set: "ASSIGNED seats for the scheduled variant; COMPLETED seats for the realized variant; RELEASED and CANCELLED seats are excluded from both"
    constants:
      MAX_DAILY_MOUNT_HOURS: 4.0
    precision: "hours to 1 decimal place, round_half_up"
    variants:
      - name: scheduled
        when: "planning-time eligibility checks and MAX_DAILY_MOUNT_HOURS enforcement"
        difference: "uses slot.duration_hours (the planned figure) over ASSIGNED seats only"
      - name: realized
        when: "after POST /activity-slots/{slotId}/complete"
        difference: "uses slot.actual_duration_hours (which may differ from the plan) over COMPLETED seats only, so the two variants diverge for the same seat whenever the ride ran long or short"

  - name: guide_staffing_requirement
    trigger: "on every change to an ActivitySlot's confirmed seat mix, and on POST /activity-slots/{slotId}/open and /run"
    algorithm: threshold
    formula: |
      # three independent requirements combined by max(); each is computed in full
      ability_mix_requirement :=
          ceil( beginner_count / BEGINNER_PER_GUIDE
              + novice_count   / NOVICE_PER_GUIDE
              + intermediate_count / INTERMEDIATE_PER_GUIDE
              + advanced_count / ADVANCED_PER_GUIDE )
      terrain_requirement := STEEP_TERRAIN_MIN_GUIDES
                               if slot.terrain_grade in {STEEP, RIVER_CROSSING}
                             else FLAT_TERRAIN_MIN_GUIDES
      minor_requirement := MINOR_PRESENT_MIN_GUIDES if slot.minor_rider_count >= 1 else 0
      required_guide_count := 0
          if slot.confirmed_rider_count == 0
        else max(ability_mix_requirement, terrain_requirement, minor_requirement)
    input_set: "ActivityReservation rows on the slot with reservation_status in {CONFIRMED, CHECKED_IN}, bucketed by rider_ability_at_booking; an empty confirmed set yields exactly 0, not the terrain floor"
    constants:
      BEGINNER_PER_GUIDE: 4
      NOVICE_PER_GUIDE: 6
      INTERMEDIATE_PER_GUIDE: 8
      ADVANCED_PER_GUIDE: 10
      STEEP_TERRAIN_MIN_GUIDES: 2
      FLAT_TERRAIN_MIN_GUIDES: 1
      MINOR_PRESENT_MIN_GUIDES: 2
    precision: "whole guides; the ability-mix sum is a real number and ceil() is applied once to the total, never per bucket"

  - name: cancellation_refund_split
    trigger: "on POST /bookings/{bookingId}/cancel"
    algorithm: threshold
    formula: |
      days_out := whole days from the current clock date to Booking.arrival_date
                  (negative when the arrival date has already passed)
      refund_pct := 1.00 if days_out >= FULL_REFUND_DAYS
                    0.50 if days_out >= HALF_REFUND_DAYS
                    0.25 if days_out >= QUARTER_REFUND_DAYS
                    0.00 otherwise
      refunded_cents  := round_half_up(deposit_paid_cents * refund_pct)
      forfeited_cents := deposit_paid_cents - refunded_cents
      # invariant: refunded_cents + forfeited_cents == deposit_paid_cents, always
    input_set: "the booking's deposit_paid_cents at the moment of cancellation; no other money field participates"
    constants:
      FULL_REFUND_DAYS: 90
      HALF_REFUND_DAYS: 60
      QUARTER_REFUND_DAYS: 30
    precision: "integer cents; the refund is rounded and the forfeit takes the remainder, so the split is exactly conservative"

  - name: retention_bonus
    trigger: "on POST /staff-members/{staffMemberId}/separate and POST /staff-members/{staffMemberId}/complete-season (variant settled); recomputed on every read of a HIRED or ACTIVE staff member (variant projected)"
    algorithm: threshold
    formula: |
      contract_days := whole days between hired_on and contract_end_date
      days_worked   := min(max(clock_date - hired_on, 0), contract_days)
      pro_rated_cents := round_half_up(Season.retention_bonus_cents * days_worked
                                       / contract_days)
      variant projected: retention_bonus_projected_cents := pro_rated_cents
      variant settled:
        retention_bonus_settled_cents :=
            Season.retention_bonus_cents                  if employment_status becomes COMPLETED_SEASON
            0                                             if days_worked * 2 < contract_days
            pro_rated_cents                               otherwise
    input_set: "one StaffMember and its Season's retention_bonus_cents; the clock date supplies days_worked"
    constants:
      VESTING_CLIFF_NUMERATOR: 1
      VESTING_CLIFF_DENOMINATOR: 2
    precision: "integer cents, round_half_up"
    variants:
      - name: projected
        when: "any read of a HIRED or ACTIVE staff member"
        difference: "straight pro-rate with no cliff, so it reports a positive accrual even below the 50% vesting cliff"
      - name: settled
        when: "separation or season completion"
        difference: "applies the 50% vesting cliff (below the cliff the payout collapses to 0) and pays the full target when the contract runs to its end date, so identical inputs give a different number from the projected variant"

  - name: season_financial_rollup
    trigger: "on POST /seasons/{seasonId}/advance moving IN_SEASON -> CLOSED"
    algorithm: aggregation
    formula: |
      gross_package_revenue_cents := sum of final_folio_total_cents over this season's
        bookings with booking_status == CHECKED_OUT
      retention_bonus_liability_cents := sum of retention_bonus_settled_cents over this
        season's staff members with employment_status in {COMPLETED_SEASON, DEPARTED_EARLY}
      net_surplus_cents := gross_package_revenue_cents
                           - retention_bonus_liability_cents
                           - capital_committed_cents
      capital_reserve_cents := round_half_up(max(net_surplus_cents, 0)
                                             * CAPITAL_RESERVE_PCT)
    input_set: "CHECKED_OUT bookings and separated/completed staff of this season only; HELD, CONFIRMED, CHECKED_IN and CANCELLED bookings never contribute"
    constants:
      CAPITAL_RESERVE_PCT: 0.25
    precision: "integer cents, round_half_up; a negative net surplus floors the reserve at 0 rather than producing a negative reserve"

  - name: mount_selection_ranking
    trigger: "on POST /activity-reservations/{reservationId}/mount-auto-assign"
    algorithm: constraint_propagation
    formula: |
      # step 1 - eligibility filter (a horse failing ANY clause is discarded)
      eligible := horses where
        horse_status == IN_SERVICE
        AND slot_min_rank_ok: rider rank >= horse.min_rider_ability
        AND slot_max_rank_ok: rider rank <= horse.max_rider_ability
        AND guest.weight_lb <= horse.weight_limit_lb
        AND for every other ASSIGNED seat of the horse the STRICT buffer test fails:
            conflict iff candidate.starts_at < other.ends_at + MOUNT_RECOVERY_MINUTES
                    AND other.starts_at < candidate.ends_at + MOUNT_RECOVERY_MINUTES
            (a gap of exactly MOUNT_RECOVERY_MINUTES is therefore allowed)
        AND daily_scheduled_hours(slot date) + slot.duration_hours
            <= MAX_DAILY_MOUNT_HOURS
        AND horse.consecutive_duty_days < MAX_CONSECUTIVE_DUTY_DAYS
      # step 2 - deterministic ranking of the eligible set
      order eligible by scheduled_load_hours ASC,
                     then consecutive_duty_days ASC,
                     then created_at ASC
      selected := first element of the ordered set
      if eligible is empty -> ERR_NO_ELIGIBLE_MOUNT
    input_set: "every Horse in the season's herd; the requesting seat's guest weight and effective_ability_rank; the parent slot's interval, duration and ability floor"
    constants:
      MOUNT_RECOVERY_MINUTES: 60
      MAX_DAILY_MOUNT_HOURS: 4.0
      MAX_CONSECUTIVE_DUTY_DAYS: 5
    precision: "hours to 1 decimal place; ties broken only by created_at ASC — never by id"

  - name: rider_ability_rank_resolution
    trigger: "on POST /guests/{guestId}/rider-assessments, on POST /rider-assessments/{riderAssessmentId}/evaluate, on incident remediation, and on every read of a Guest"
    algorithm: projection
    formula: |
      rank_of := {UNASSESSED: 0, BEGINNER: 1, NOVICE: 2, INTERMEDIATE: 3, ADVANCED: 4}
      latest := the guest's RiderAssessment with assessment_status == EVALUATED and the
                greatest evaluated_at; ties broken by created_at ASC
      base_rank := latest.assessed_ability if latest exists else UNASSESSED
      # caps, applied in this order, each one only ever lowering the rank
      if the guest has any RiderAssessment with assessment_status ==
         RE_EVALUATION_REQUESTED:  base_rank := min(base_rank, rank_of[NOVICE])
      if guest_standing == RESTRICTED: base_rank := min(base_rank, rank_of[BEGINNER])
      if guest_standing == SUSPENDED:  base_rank := rank_of[UNASSESSED]
      effective_ability_rank := the enum name whose rank_of value equals base_rank
    input_set: "all RiderAssessment rows of the guest; SUPERSEDED rows are ignored for base_rank but a RE_EVALUATION_REQUESTED row still caps the result"
    constants:
      RE_EVALUATION_CAP: NOVICE
      RESTRICTED_CAP: BEGINNER
    precision: "exact enum ranks; no arithmetic rounding"

  - name: guest_waiver_status_resolution
    trigger: "on POST /guests/{guestId}/waiver-signature, on POST /guests/{guestId}/waiver-revocation, and on every read of a Guest"
    algorithm: projection
    formula: |
      waiver_status := NONE     if waiver_signed_on is null
                       REVOKED  if waiver_revoked_at is not null
                       EXPIRED  if clock_date > waiver_expires_on
                       SIGNED   otherwise
      waiver_expires_on := waiver_signed_on + WAIVER_VALID_DAYS days
      # a minor's waiver additionally demands waiver_signed_by_guardian_guest_id
      # pointing at a Guest with age_years >= 18 and waiver_status == SIGNED
    input_set: "one Guest row plus, for minors, the guardian Guest it references"
    constants:
      WAIVER_VALID_DAYS: 365
      ADULT_AGE_YEARS: 18
    precision: "whole days; a waiver signed on day D expires at the end of day D + 365, so clock_date == waiver_expires_on is still SIGNED"

  - name: slot_readiness_posture
    trigger: "on every seat, mount or guide change touching an ActivitySlot"
    algorithm: constraint_propagation
    formula: |
      # first matching clause wins; the order below is the normative precedence
      readiness_posture :=
        FROZEN         if Season.season_status not in {OPEN, IN_SEASON}
        MOUNT_SHORT    if slot.mount_required AND mount_assigned_count < confirmed_rider_count
        UNDERSTAFFED   if assigned_guide_count < required_guide_count
        STAFFED_READY  otherwise
      seats_available := capacity - confirmed_rider_count
    input_set: "the slot's own counters, its season's status, and required_guide_count from guide_staffing_requirement"
    constants: {}
    precision: "exact enum; MOUNT_SHORT outranks UNDERSTAFFED, so a slot missing both a mount and a guide reports MOUNT_SHORT"

  - name: horse_duty_day_run
    trigger: "on POST /activity-slots/{slotId}/complete and on POST /horses/{horseId}/health-events"
    algorithm: decay_function
    formula: |
      on slot completion for a COMPLETED mount on date D:
        consecutive_duty_days := horse.consecutive_duty_days + 1
                                   if horse.last_duty_date == D - 1 day
                                 horse.consecutive_duty_days
                                   if horse.last_duty_date == D
                                 1
                                   otherwise (a gap of one or more idle days resets the run)
        last_duty_date := D
      on a REST_START or VET_CLEARANCE health event:
        consecutive_duty_days := 0
    input_set: "the horse's own last_duty_date and consecutive_duty_days; the completed slot's calendar date"
    constants:
      MAX_CONSECUTIVE_DUTY_DAYS: 5
    precision: "whole days, UTC calendar dates"

  - name: cabin_bed_night_occupancy
    trigger: "on POST /bookings and on POST /bookings/{bookingId}/check-in"
    algorithm: interval_merge
    formula: |
      # a cabin's occupancy interval is HALF-OPEN: [arrival_date, departure_date)
      conflict(existing, candidate) :=
        candidate.arrival_date < existing.departure_date
        AND existing.arrival_date < candidate.departure_date
      # therefore a departure and an arrival on the SAME date do not conflict
      bed_nights(booking) := party_size * nights
      Season.bed_nights_sold := sum of bed_nights over bookings with booking_status in
                                {CONFIRMED, CHECKED_IN, CHECKED_OUT}
      # buyout exclusivity is evaluated over the same half-open interval but against
      # EVERY cabin in the season, not just the requested one
    input_set: "bookings of the same cabin with booking_status in {HELD, CONFIRMED, CHECKED_IN}; CANCELLED and CHECKED_OUT bookings free their interval"
    constants: {}
    precision: "whole calendar dates; adjacency (gap of zero) is allowed, overlap of a single night is not"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority order;
# the first violated rule decides the response)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID are both present and non-empty on every request"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "when the acting role is Guest, X-User-ID equals the Guest.id addressed by the path or the guest_id of the addressed reservation; a guest may never read or write another guest's resources"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /guests/{guestId}, POST /guests/{guestId}/waiver-signature, GET /activity-reservations/{reservationId}"

  - priority: 5
    category: auth
    check: "when the acting role is ActivityGuide, X-User-ID is a StaffMember with a GuideAssignment on the addressed slot whose assignment_status is SCHEDULED"
    error_id: ERR_NOT_ASSIGNED_GUIDE
    http_status: 403
    applies_to: "POST /activity-slots/{slotId}/run, POST /activity-slots/{slotId}/complete, POST /activity-reservations/{reservationId}/check-in, POST /activity-reservations/{reservationId}/incident-reports"

  - priority: 6
    category: auth
    check: "the X-User-ID closing an incident report differs from IncidentReport.disposed_by_user_id (segregation of duties: the officer who dispositioned a report may not also close it)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incident-reports/{incidentReportId}/close"

  - priority: 7
    category: existence
    check: "every templated path id resolves to a stored row, validated left-to-right"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_CABIN_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_HORSE_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_GUIDE_ASSIGNMENT_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_INCIDENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 8
    category: existence
    check: "every foreign key supplied in a request body resolves to a stored row (season_id, cabin_id, lead_guest_id, party_members[].guest_id, horse_id, staff_member_id)"
    error_id: "ERR_CABIN_NOT_FOUND | ERR_GUEST_NOT_FOUND | ERR_HORSE_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /bookings, POST /activity-slots/{slotId}/guide-assignments, POST /activity-reservations/{reservationId}/mount-assignments, POST /activity-reservations/{reservationId}/incident-reports"

  - priority: 9
    category: business_referential
    check: "every required body field declared in the endpoint's input is present"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 10
    category: business_referential
    check: "every supplied field has the declared type, enum membership and numeric range (dates ISO 8601, cents non-negative integers, percentages between 0 and 1)"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 11
    category: business_referential
    check: "the Booking named by a reservation belongs to the same Season as the ActivitySlot, and the Guest named by a reservation appears in that booking's party_members"
    error_id: ERR_SEASON_MISMATCH
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 12
    category: state
    check: "expected_slot_version equals the stored ActivitySlot.version"
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 13
    category: state
    check: "expected_guest_version equals the stored Guest.version"
    error_id: ERR_STALE_GUEST_VERSION
    http_status: 412
    applies_to: "POST /guests/{guestId}/rider-assessments"

  - priority: 14
    category: state
    check: "expected_horse_version equals the stored Horse.version"
    error_id: ERR_STALE_HORSE_VERSION
    http_status: 412
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments"

  - priority: 15
    category: state
    check: "expected_booking_version equals the stored Booking.version"
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /bookings/{bookingId}/folio-adjustments"

  - priority: 16
    category: state
    check: "the requested Season transition is one of PLANNING->OPEN, OPEN->IN_SEASON, IN_SEASON->CLOSED, CLOSED->OFF_SEASON"
    error_id: ERR_INVALID_SEASON_TRANSITION
    http_status: 409
    applies_to: "POST /seasons/{seasonId}/advance"

  - priority: 17
    category: state
    check: "the Season governing the write is in a status that permits it (OPEN or IN_SEASON for booking and scheduling writes; IN_SEASON for check-in, run, complete and seat check-in)"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{bookingId}/confirm, POST /bookings/{bookingId}/check-in, POST /seasons/{seasonId}/activity-slots, POST /activity-slots/{slotId}/open, POST /activity-slots/{slotId}/run"

  - priority: 18
    category: state
    check: "the Booking is in the state the operation requires (HELD for confirm, HELD or CONFIRMED for cancel, CONFIRMED for check-in, CHECKED_IN for check-out, and CONFIRMED, CHECKED_IN or CHECKED_OUT for a folio adjustment); this state gate is evaluated BEFORE any money check on the same request"
    error_id: ERR_BOOKING_STATE_INVALID
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/confirm, POST /bookings/{bookingId}/cancel, POST /bookings/{bookingId}/check-in, POST /bookings/{bookingId}/check-out, POST /bookings/{bookingId}/folio-adjustments"

  - priority: 19
    category: state
    check: "the ActivitySlot is in the state the operation requires (DRAFT for open, HOLD for re-open, OPEN for run, RUNNING for complete, DRAFT/OPEN/HOLD for cancel and for seat creation)"
    error_id: ERR_SLOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/open, POST /activity-slots/{slotId}/run, POST /activity-slots/{slotId}/complete, POST /activity-slots/{slotId}/cancel, POST /activity-slots/{slotId}/reservations"

  - priority: 20
    category: state
    check: "the ActivityReservation is in the state the operation requires (CONFIRMED for seat check-in, CONFIRMED or CHECKED_IN for cancel, mount_status PENDING or RELEASED for assignment, ASSIGNED for release)"
    error_id: ERR_RESERVATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /activity-reservations/{reservationId}/check-in, POST /activity-reservations/{reservationId}/cancel, POST /activity-reservations/{reservationId}/mount-assignments, POST /activity-reservations/{reservationId}/mount-auto-assign, POST /activity-reservations/{reservationId}/mount-release"

  - priority: 21
    category: state
    check: "the Cabin is READY when a booking checks in, and READY when placed on maintenance hold"
    error_id: ERR_CABIN_NOT_READY
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/check-in, POST /cabins/{cabinId}/maintenance-hold"

  - priority: 22
    category: state
    check: "the StaffMember is in the state the operation requires (HIRED for onboard, ACTIVE for complete-season, HIRED or ACTIVE for separate) and is not already terminal"
    error_id: ERR_STAFF_STATE_INVALID
    http_status: 409
    applies_to: "POST /staff-members/{staffMemberId}/onboard, POST /staff-members/{staffMemberId}/separate, POST /staff-members/{staffMemberId}/complete-season"

  - priority: 23
    category: state
    check: "the RiderAssessment is PENDING for evaluate and EVALUATED for flag-re-evaluation; SUPERSEDED assessments accept no transition"
    error_id: ERR_ASSESSMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /rider-assessments/{riderAssessmentId}/evaluate, POST /rider-assessments/{riderAssessmentId}/flag-re-evaluation"

  - priority: 24
    category: state
    check: "the IncidentReport is FILED for dispose and CLEARED or REMEDIATION_REQUIRED for close; a CLOSED report is immutable"
    error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /incident-reports/{incidentReportId}/dispose, POST /incident-reports/{incidentReportId}/close"

  - priority: 25
    category: state
    check: "the Horse is IN_SERVICE when it is assigned to a seat, and the GuideAssignment is SCHEDULED when it is released"
    error_id: ERR_HORSE_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments, POST /activity-reservations/{reservationId}/mount-auto-assign"

  - priority: 26
    category: state
    check: "the Guest referenced by a seat or a seat check-in has guest_standing != SUSPENDED (cross-entity state gate: the reservation is rejected because of the state of a different entity)"
    error_id: ERR_GUEST_SUSPENDED
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations, POST /activity-reservations/{reservationId}/check-in"

  - priority: 27
    category: state
    check: "the Guest referenced by a seat check-in resolves to waiver_status == SIGNED under guest_waiver_status_resolution (a REVOKED or EXPIRED waiver blocks the ride even though the seat itself is valid)"
    error_id: ERR_WAIVER_NOT_SIGNED
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations, POST /activity-reservations/{reservationId}/check-in"

  - priority: 28
    category: business_safety
    check: "Guest.equine_statute_ack is true before the guest may hold a seat on a slot with mount_required == true (statutory equine-activity acknowledgement)"
    error_id: ERR_EQUINE_STATUTE_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /activity-slots/{slotId}/reservations, POST /activity-reservations/{reservationId}/check-in"

  - priority: 29
    category: business_safety
    check: "a Guest with age_years < 18 supplies waiver_signed_by_guardian_guest_id pointing at a Guest with age_years >= 18 whose own waiver resolves to SIGNED"
    error_id: ERR_GUARDIAN_SIGNATURE_REQUIRED
    http_status: 422
    applies_to: "POST /guests/{guestId}/waiver-signature"

  - priority: 30
    category: business_safety
    check: "Guest.effective_ability_rank (per rider_ability_rank_resolution) is at least ActivitySlot.min_ability_rank; this safety gate is evaluated BEFORE any capacity or duplicate check on the same request"
    error_id: ERR_RIDER_ABILITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 31
    category: business_safety
    check: "Guest.weight_lb <= Horse.weight_limit_lb for the mount being assigned"
    error_id: ERR_RIDER_WEIGHT_EXCEEDS_MOUNT
    http_status: 422
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments"

  - priority: 32
    category: business_safety
    check: "the rider's effective_ability_rank lies within [Horse.min_rider_ability, Horse.max_rider_ability]"
    error_id: ERR_MOUNT_ABILITY_MISMATCH
    http_status: 422
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments"

  - priority: 33
    category: business_safety
    check: "Horse.consecutive_duty_days < 5 before the animal takes another duty day"
    error_id: ERR_MOUNT_DUTY_LIMIT
    http_status: 422
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments"

  - priority: 34
    category: business_safety
    check: "the horse's scheduled hours on the slot's calendar date plus the slot's duration_hours stay within MAX_DAILY_MOUNT_HOURS (4.0)"
    error_id: ERR_MOUNT_DAILY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments"

  - priority: 35
    category: business_safety
    check: "for every other ASSIGNED seat of the horse the strict buffer test fails: conflict iff candidate.starts_at < other.ends_at + 60 minutes AND other.starts_at < candidate.ends_at + 60 minutes; a gap of exactly 60 minutes is allowed"
    error_id: ERR_MOUNT_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /activity-reservations/{reservationId}/mount-assignments"

  - priority: 36
    category: business_safety
    check: "mount_selection_ranking yields a non-empty eligible set for auto-assignment"
    error_id: ERR_NO_ELIGIBLE_MOUNT
    http_status: 422
    applies_to: "POST /activity-reservations/{reservationId}/mount-auto-assign"

  - priority: 37
    category: business_safety
    check: "assigned_guide_count >= required_guide_count (per guide_staffing_requirement) before a slot may open or run"
    error_id: ERR_GUIDE_RATIO_UNMET
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/open, POST /activity-slots/{slotId}/run"

  - priority: 38
    category: business_safety
    check: "every ASSIGNED mount is present for a mounted slot (readiness_posture must not be MOUNT_SHORT) before the slot may run"
    error_id: ERR_MOUNTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/run"

  - priority: 39
    category: business_safety
    check: "dietary_briefing_ack is true at check-in whenever any party member declares a dietary restriction other than NONE (single-seating dining service cannot absorb an unannounced restriction)"
    error_id: ERR_DIETARY_BRIEFING_REQUIRED
    http_status: 422
    applies_to: "POST /bookings/{bookingId}/check-in"

  - priority: 40
    category: business_safety
    check: "equine_activity_statute_notice_given is true on an incident report naming a horse, and again at disposition"
    error_id: ERR_STATUTE_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /activity-reservations/{reservationId}/incident-reports, POST /incident-reports/{incidentReportId}/dispose"

  - priority: 41
    category: business_temporal
    check: "Booking.arrival_date falls on Season.arrival_weekday (the weekly package cadence)"
    error_id: ERR_ARRIVAL_DAY_INVALID
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 42
    category: business_temporal
    check: "Season.min_stay_nights <= nights <= Season.max_stay_nights, where nights = departure_date - arrival_date"
    error_id: ERR_STAY_LENGTH_INVALID
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 43
    category: business_temporal
    check: "arrival_date >= Season.season_start_date and departure_date <= Season.season_end_date"
    error_id: ERR_STAY_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 44
    category: business_temporal
    check: "no other HELD, CONFIRMED or CHECKED_IN booking of the same cabin overlaps the half-open interval [arrival_date, departure_date); a departure and an arrival on the same date do NOT overlap"
    error_id: ERR_CABIN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 45
    category: business_temporal
    check: "a buyout booking requires that no other live booking touches ANY cabin over its interval, and no live booking may be created inside an existing buyout's interval"
    error_id: ERR_BUYOUT_CONFLICT
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 46
    category: business_temporal
    check: "the guide has no other SCHEDULED assignment whose slot interval overlaps the half-open interval [starts_at, ends_at), and the guide's scheduled hours on that calendar date stay within 10.0"
    error_id: ERR_GUIDE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/guide-assignments"

  - priority: 47
    category: business_temporal
    check: "the guest holds no other CONFIRMED or CHECKED_IN seat on a slot whose half-open interval overlaps this slot's interval"
    error_id: ERR_GUEST_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 48
    category: business_temporal
    check: "ActivitySlot.starts_at and ends_at fall inside the season window and ends_at > starts_at"
    error_id: ERR_SLOT_OUTSIDE_SEASON
    http_status: 422
    applies_to: "POST /seasons/{seasonId}/activity-slots"

  - priority: 49
    category: business_temporal
    check: "the logical clock has reached ActivitySlot.starts_at before the slot may run"
    error_id: ERR_SLOT_NOT_STARTED
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/run"

  - priority: 50
    category: business_temporal
    check: "the clock date has reached contract_end_date for complete-season, and is strictly before contract_end_date for separate; onboarding requires the clock date to have reached hired_on"
    error_id: ERR_CONTRACT_DATE_INVALID
    http_status: 409
    applies_to: "POST /staff-members/{staffMemberId}/onboard, POST /staff-members/{staffMemberId}/separate, POST /staff-members/{staffMemberId}/complete-season"

  - priority: 51
    category: business_constraint
    check: "each party_members element's member_type agrees with the referenced Guest's age_years (ADULT requires >= 18, CHILD requires < 18)"
    error_id: ERR_MEMBER_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 52
    category: business_constraint
    check: "lead_guest_id appears in party_members, and party_members contains at least one ADULT"
    error_id: ERR_LEAD_GUEST_NOT_IN_PARTY
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 53
    category: business_constraint
    check: "guest_id values inside party_members are unique"
    error_id: ERR_DUPLICATE_PARTY_MEMBER
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 54
    category: business_constraint
    check: "package_tier_code names an existing element of Season.package_tiers"
    error_id: ERR_PACKAGE_TIER_UNKNOWN
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 55
    category: business_constraint
    check: "party_size <= Cabin.bed_capacity"
    error_id: ERR_CABIN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 56
    category: business_constraint
    check: "the ActivitySlot is not on HOLD when a seat is created (a held slot accepts no new riders until its posture clears)"
    error_id: ERR_SLOT_ON_HOLD
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 57
    category: business_constraint
    check: "seats_available >= 1 on the ActivitySlot (aggregate capacity check, evaluated only after every safety gate has passed)"
    error_id: ERR_SLOT_FULL
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 58
    category: business_constraint
    check: "the guest does not already hold a CONFIRMED or CHECKED_IN seat on this exact slot"
    error_id: ERR_DUPLICATE_RESERVATION
    http_status: 409
    applies_to: "POST /activity-slots/{slotId}/reservations"

  - priority: 59
    category: business_constraint
    check: "the StaffMember being assigned as a guide is ACTIVE, belongs to the slot's season, and holds the certification the activity_type demands (EQUINE_HANDLER for TRAIL_RIDE and ARENA_LESSON, FLY_CASTING for FLY_FISHING, CHILD_PROGRAM for KIDS_PROGRAM, WILDERNESS_FIRST_AID for HIKE)"
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /activity-slots/{slotId}/guide-assignments"

  - priority: 60
    category: business_constraint
    check: "no other HIRED or ACTIVE StaffMember of the same season already holds the requested housing_unit_code and housing_bunk_number"
    error_id: ERR_HOUSING_BUNK_TAKEN
    http_status: 409
    applies_to: "POST /staff-members/{staffMemberId}/onboard"

  - priority: 61
    category: business_constraint
    check: "no GuideAssignment of the staff member is still SCHEDULED at season completion"
    error_id: ERR_GUIDE_ASSIGNMENTS_OPEN
    http_status: 409
    applies_to: "POST /staff-members/{staffMemberId}/complete-season"

  - priority: 62
    category: business_constraint
    check: "Season.in_house_guest_count + party_size <= Season.dining_seat_capacity (single-seating meal service is a hard ranch-wide aggregate)"
    error_id: ERR_DINING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/check-in"

  - priority: 63
    category: business_constraint
    check: "no ActivityReservation of the booking is still CONFIRMED or CHECKED_IN on a live slot at check-out"
    error_id: ERR_OPEN_ACTIVITY_RESERVATIONS
    http_status: 409
    applies_to: "POST /bookings/{bookingId}/check-out"

  - priority: 64
    category: business_constraint
    check: "no Booking of the season is still CHECKED_IN when the season advances IN_SEASON -> CLOSED (in-house guests cannot be closed out from under)"
    error_id: ERR_SEASON_HAS_LIVE_BOOKINGS
    http_status: 409
    applies_to: "POST /seasons/{seasonId}/advance"

  - priority: 65
    category: business_fiscal
    check: "payment amount_cents is a positive integer and kind is DEPOSIT or SETTLEMENT"
    error_id: ERR_INVALID_PAYMENT_AMOUNT
    http_status: 422
    applies_to: "POST /bookings/{bookingId}/payments"

  - priority: 66
    category: business_fiscal
    check: "deposit_paid_cents >= deposit_required_cents before a booking may be confirmed (money gate, deliberately BELOW the booking state gate at priority 18)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /bookings/{bookingId}/confirm"

  - priority: 67
    category: business_fiscal
    check: "folio_balance_cents resolves to exactly 0 once settle_payment_cents is applied at check-out"
    error_id: ERR_FOLIO_BALANCE_OUTSTANDING
    http_status: 402
    applies_to: "POST /bookings/{bookingId}/check-out"

  - priority: 68
    category: business_fiscal
    check: "an off-season capital project's maintenance_capital_cost_cents plus Season.capital_committed_cents stays within Season.capital_reserve_cents"
    error_id: ERR_CAPITAL_RESERVE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /cabins/{cabinId}/maintenance-hold"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every date and deadline rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandated server startup default); it never falls back to real wall-clock time."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all subsequent date arithmetic (days_out, days_worked, waiver expiry, slot start gates) uses the new instant"]

  - method: POST
    path: "/seasons"
    description: "Creates a season with its arrival cadence, stay bounds, deposit percentage, dining capacity and all-inclusive package tier table."
    roles: [RanchManager]
    code: 201
    input: [name, arrival_weekday, season_start_date, season_end_date, min_stay_nights, max_stay_nights, deposit_pct, buyout_premium_pct, no_show_penalty_cents, retention_bonus_cents, dining_seat_capacity, package_tiers]
    output: Season
    side_effects: ["season_status initialised to PLANNING; all money rollup counters initialised to 0"]

  - method: GET
    path: "/seasons/{seasonId}"
    description: "Reads one season including its rollup counters and current version."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer, Guest]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: GET
    path: "/seasons"
    description: "Lists seasons, optionally filtered by lifecycle status."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: ["season_status?", "limit?", "offset?"]
    output: Season[]
    side_effects: []

  - method: POST
    path: "/seasons/{seasonId}/advance"
    description: "Advances the season lifecycle one step along PLANNING -> OPEN -> IN_SEASON -> CLOSED -> OFF_SEASON; the IN_SEASON -> CLOSED step runs season_financial_rollup."
    roles: [RanchManager]
    code: 200
    input: [target_status]
    output: Season
    side_effects: ["on IN_SEASON -> CLOSED runs season_financial_rollup, writing gross_package_revenue_cents, retention_bonus_liability_cents, net_surplus_cents and capital_reserve_cents", "increments Season.version by 1"]

  - method: POST
    path: "/cabins"
    description: "Registers a guest cabin with its bed capacity; cabins outlive seasons and are shared across them."
    roles: [RanchManager]
    code: 201
    input: [name, bed_capacity]
    output: Cabin
    side_effects: ["cabin_status initialised to READY"]

  - method: GET
    path: "/cabins/{cabinId}"
    description: "Reads one cabin including its occupancy state and current version."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, SafetyOfficer]
    code: 200
    input: []
    output: Cabin
    side_effects: []

  - method: GET
    path: "/cabins"
    description: "Lists cabins, optionally filtered by occupancy state."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, SafetyOfficer]
    code: 200
    input: ["cabin_status?", "limit?", "offset?"]
    output: Cabin[]
    side_effects: []

  - method: POST
    path: "/cabins/{cabinId}/maintenance-hold"
    description: "Takes a READY cabin out of service for an off-season capital project, charging the project against the season's capital reserve."
    roles: [RanchManager]
    code: 200
    input: [season_id, maintenance_project_code, maintenance_capital_cost_cents]
    output: Cabin
    side_effects: ["cabin_status READY -> OUT_OF_SERVICE", "Season.capital_committed_cents += maintenance_capital_cost_cents", "increments Cabin.version and Season.version by 1 each"]

  - method: POST
    path: "/cabins/{cabinId}/return-to-ready"
    description: "Returns an OUT_OF_SERVICE cabin to READY once the capital project is finished, releasing the committed capital."
    roles: [RanchManager]
    code: 200
    input: [season_id]
    output: Cabin
    side_effects: ["cabin_status OUT_OF_SERVICE -> READY", "Season.capital_committed_cents -= maintenance_capital_cost_cents; maintenance_project_code and maintenance_capital_cost_cents cleared", "increments Cabin.version and Season.version by 1 each"]

  - method: POST
    path: "/cabins/{cabinId}/turnover-complete"
    description: "Marks housekeeping turnover finished, returning a TURNOVER cabin to READY."
    roles: [RanchManager]
    code: 200
    input: []
    output: Cabin
    side_effects: ["cabin_status TURNOVER -> READY; last_turnover_completed_at set from the clock", "increments Cabin.version by 1"]

  - method: POST
    path: "/guests"
    description: "Registers a guest with birth date and weight, both of which gate mount eligibility and waiver rules."
    roles: [ReservationsAgent, RanchManager]
    code: 201
    input: [full_name, birth_date, weight_lb]
    output: Guest
    side_effects: ["age_years computed from birth_date against the clock date; guest_standing GOOD; waiver_status NONE; current_ability_rank and effective_ability_rank UNASSESSED"]

  - method: GET
    path: "/guests/{guestId}"
    description: "Reads one guest including the resolved waiver_status and effective_ability_rank and the current version."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/guests"
    description: "Lists guests, optionally filtered by standing or by the guardian who signed their waiver."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, SafetyOfficer]
    code: 200
    input: ["guest_standing?", "waiver_signed_by_guardian_guest_id?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  - method: POST
    path: "/guests/{guestId}/waiver-signature"
    description: "Records a signed liability waiver and the statutory equine-activity acknowledgement; a minor's waiver must name an adult guardian guest."
    roles: [ReservationsAgent, Guest]
    code: 200
    input: [signed_on, equine_statute_ack, "waiver_signed_by_guardian_guest_id?"]
    output: Guest
    side_effects: ["waiver_signed_on set, waiver_expires_on := signed_on + 365 days, waiver_revoked_at cleared", "waiver_status resolves to SIGNED per guest_waiver_status_resolution", "increments Guest.version by 1"]

  - method: POST
    path: "/guests/{guestId}/waiver-revocation"
    description: "Revokes a signed waiver, which cascades to the guest's future seats and their mounts and slots."
    roles: [RanchManager]
    code: 200
    input: [reason]
    output: Guest
    side_effects: ["waiver_revoked_at set; waiver_status resolves to REVOKED", "every future CONFIRMED seat of the guest becomes CANCELLED, releasing mounts and forcing each parent slot to recompute readiness_posture", "increments Guest.version by 1"]

  - method: POST
    path: "/guests/{guestId}/suspension"
    description: "Suspends a guest for a safety or conduct reason, or restricts them following incident remediation."
    roles: [RanchManager, SafetyOfficer]
    code: 200
    input: [target_standing, reason]
    output: Guest
    side_effects: ["guest_standing GOOD -> SUSPENDED or GOOD -> RESTRICTED", "effective_ability_rank recomputed by rider_ability_rank_resolution (UNASSESSED when SUSPENDED, capped at BEGINNER when RESTRICTED)", "increments Guest.version by 1"]

  - method: POST
    path: "/guests/{guestId}/reinstatement"
    description: "Returns a SUSPENDED or RESTRICTED guest to GOOD standing."
    roles: [RanchManager]
    code: 200
    input: [reason]
    output: Guest
    side_effects: ["guest_standing -> GOOD", "effective_ability_rank recomputed; the cap imposed by the prior standing is lifted", "increments Guest.version by 1"]

  - method: POST
    path: "/guests/{guestId}/rider-assessments"
    description: "Opens a rider ability assessment for a guest, superseding any previously EVALUATED assessment. Requires the caller's last observed Guest version."
    roles: [HorseProgramDirector]
    code: 201
    input: [requested_ability, expected_guest_version]
    output: RiderAssessment
    side_effects: ["assessment_status PENDING", "every prior EVALUATED assessment of the guest becomes SUPERSEDED", "increments Guest.version by 1"]

  - method: GET
    path: "/rider-assessments/{riderAssessmentId}"
    description: "Reads one rider assessment."
    roles: [RanchManager, HorseProgramDirector, ActivityGuide, ReservationsAgent, SafetyOfficer]
    code: 200
    input: []
    output: RiderAssessment
    side_effects: []

  - method: GET
    path: "/rider-assessments"
    description: "Lists rider assessments, optionally filtered by guest or by lifecycle status."
    roles: [RanchManager, HorseProgramDirector, ActivityGuide, ReservationsAgent, SafetyOfficer]
    code: 200
    input: ["guest_id?", "assessment_status?", "limit?", "offset?"]
    output: RiderAssessment[]
    side_effects: []

  - method: POST
    path: "/rider-assessments/{riderAssessmentId}/evaluate"
    description: "Records the wrangler's evaluated ability for a PENDING assessment, which rewrites the guest's effective ability rank."
    roles: [HorseProgramDirector]
    code: 200
    input: [assessed_ability, assessed_by_note, evaluated_at]
    output: RiderAssessment
    side_effects: ["assessment_status PENDING -> EVALUATED", "Guest.current_ability_rank := assessed_ability and Guest.effective_ability_rank recomputed by rider_ability_rank_resolution", "increments Guest.version by 1"]

  - method: POST
    path: "/rider-assessments/{riderAssessmentId}/flag-re-evaluation"
    description: "Flags an EVALUATED assessment for re-evaluation after a guide observes a mismatch in the saddle, capping the guest's effective rank at NOVICE."
    roles: [HorseProgramDirector, ActivityGuide]
    code: 200
    input: [re_evaluation_reason]
    output: RiderAssessment
    side_effects: ["assessment_status EVALUATED -> RE_EVALUATION_REQUESTED", "Guest.effective_ability_rank capped at NOVICE", "every future CONFIRMED seat of the guest on a slot whose min_ability_rank now exceeds the capped rank becomes CANCELLED, releasing its mount and forcing the parent slot to recompute readiness_posture", "increments Guest.version by 1"]

  - method: POST
    path: "/bookings"
    description: "Holds a weekly all-inclusive package for a family group or a whole-ranch buyout, pricing it with package_charge_total variant provisional_at_hold."
    roles: [ReservationsAgent]
    code: 201
    input: [season_id, cabin_id, lead_guest_id, package_tier_code, arrival_date, departure_date, party_members, "is_buyout?"]
    output: Booking
    side_effects: ["nights, party_size, adult_count and child_count computed", "package_charge_total variant provisional_at_hold writes provisional_package_total_cents and deposit_required_cents", "booking_status HELD and payment_status AWAITING_DEPOSIT"]

  - method: GET
    path: "/bookings/{bookingId}"
    description: "Reads one booking with its full folio state and current version."
    roles: [RanchManager, ReservationsAgent, SafetyOfficer, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "Lists bookings, optionally filtered by season, cabin, lead guest or lifecycle status."
    roles: [RanchManager, ReservationsAgent, SafetyOfficer]
    code: 200
    input: ["season_id?", "cabin_id?", "lead_guest_id?", "booking_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/payments"
    description: "Posts a deposit or a settlement payment against the booking folio."
    roles: [ReservationsAgent]
    code: 200
    input: [kind, amount_cents]
    output: Booking
    side_effects: ["deposit_paid_cents or payments_applied_cents increased", "payment_status AWAITING_DEPOSIT -> DEPOSIT_PAID once the deposit requirement is met", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{bookingId}/confirm"
    description: "Confirms a HELD booking once its deposit is fully paid; the booking-state gate is evaluated before the deposit gate."
    roles: [ReservationsAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["booking_status HELD -> CONFIRMED", "Season.bed_nights_sold += party_size * nights", "increments Booking.version and Season.version by 1 each"]

  - method: POST
    path: "/bookings/{bookingId}/cancel"
    description: "Cancels a HELD or CONFIRMED booking, splitting the deposit by cancellation_refund_split and cascading through the party's activity seats, their mounts and the parent slots."
    roles: [ReservationsAgent, RanchManager]
    code: 200
    input: [reason]
    output: Booking
    side_effects: ["booking_status -> CANCELLED and cancellation_refund_split writes cancellation_refund_pct, refunded_cents and forfeited_cents with refunded_cents + forfeited_cents == deposit_paid_cents", "payment_status -> REFUNDED, PARTIALLY_REFUNDED or FORFEITED", "every CONFIRMED or CHECKED_IN seat of the booking becomes CANCELLED with surcharge_reversed_cents := surcharge_cents", "every ASSIGNED mount of those seats becomes RELEASED and each horse's scheduled_load_hours is restored", "each affected slot recomputes its counters and readiness_posture, and an OPEN slot degraded to MOUNT_SHORT or UNDERSTAFFED moves to HOLD", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{bookingId}/check-in"
    description: "Checks a CONFIRMED party into its cabin, seating them in the single-seating dining room and recording the dietary briefing."
    roles: [ReservationsAgent]
    code: 200
    input: [dietary_briefing_ack]
    output: Booking
    side_effects: ["booking_status CONFIRMED -> CHECKED_IN and checked_in_at set", "Cabin READY -> OCCUPIED", "Season.in_house_guest_count += party_size", "increments Booking.version, Cabin.version and Season.version by 1 each"]

  - method: POST
    path: "/bookings/{bookingId}/check-out"
    description: "Checks the party out, re-pricing the stay with package_charge_total variant final_at_checkout and settling the folio with folio_settlement_amount."
    roles: [ReservationsAgent]
    code: 200
    input: [settle_payment_cents]
    output: Booking
    side_effects: ["realized_nights and realized_subtotal_cents written by package_charge_total variant final_at_checkout", "folio_settlement_amount writes activity_surcharge_total_cents, activity_credit_applied_cents, no_show_penalty_total_cents, gratuity_cents, final_folio_total_cents and folio_balance_cents", "booking_status CHECKED_IN -> CHECKED_OUT and payment_status DEPOSIT_PAID -> PAID_IN_FULL", "Cabin OCCUPIED -> TURNOVER; Season.in_house_guest_count -= party_size; Season.gross_package_revenue_cents += final_folio_total_cents", "increments Booking.version, Cabin.version and Season.version by 1 each"]

  - method: POST
    path: "/bookings/{bookingId}/folio-adjustments"
    description: "Posts a signed manual folio adjustment (a courtesy credit or a damage charge) against the booking. Requires the caller's last observed Booking version."
    roles: [RanchManager, ReservationsAgent]
    code: 200
    input: [amount_cents, memo, expected_booking_version]
    output: Booking
    side_effects: ["folio_adjustment_total_cents += amount_cents", "final_folio_total_cents and folio_balance_cents recomputed when the booking is already CHECKED_OUT", "increments Booking.version by 1"]

  - method: POST
    path: "/horses"
    description: "Adds a horse to the herd with its rider ability band and weight limit."
    roles: [HorseProgramDirector]
    code: 201
    input: [name, min_rider_ability, max_rider_ability, weight_limit_lb]
    output: Horse
    side_effects: ["horse_status IN_SERVICE; scheduled_load_hours, realized_load_hours and consecutive_duty_days initialised to 0"]

  - method: GET
    path: "/horses/{horseId}"
    description: "Reads one horse including its load counters, duty-day run and current version."
    roles: [RanchManager, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: []
    output: Horse
    side_effects: []

  - method: GET
    path: "/horses"
    description: "Lists horses, optionally filtered by health status."
    roles: [RanchManager, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: ["horse_status?", "limit?", "offset?"]
    output: Horse[]
    side_effects: []

  - method: POST
    path: "/horses/{horseId}/health-events"
    description: "Files an immutable herd-health record that moves the animal's status and cascades through its future mounts and their slots."
    roles: [HorseProgramDirector]
    code: 201
    input: [event_type, observed_on, "note?"]
    output: HorseHealthEvent
    side_effects: ["horse_status moves per the Horse state machine and resulting_horse_status records the outcome", "on LAMENESS, COLIC, REST_START or RETIREMENT every future ASSIGNED seat of the horse moves mount_status ASSIGNED -> RELEASED and clears assigned_horse_id", "each affected slot recomputes mount_assigned_count and readiness_posture, and an OPEN slot that became MOUNT_SHORT moves to HOLD with hold_reason MOUNT_SHORT", "Horse.scheduled_load_hours recomputed by horse_load_index; VET_CLEARANCE and REST_START reset consecutive_duty_days to 0", "increments Horse.version by 1"]

  - method: GET
    path: "/horse-health-events/{healthEventId}"
    description: "Reads one immutable herd-health record."
    roles: [RanchManager, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: []
    output: HorseHealthEvent
    side_effects: []

  - method: GET
    path: "/horse-health-events"
    description: "Lists herd-health records, optionally filtered by horse or event type; this is the only discovery channel for records created by a cascade."
    roles: [RanchManager, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: ["horse_id?", "event_type?", "limit?", "offset?"]
    output: HorseHealthEvent[]
    side_effects: []

  - method: POST
    path: "/seasons/{seasonId}/activity-slots"
    description: "Schedules an activity slot (ride, fishing outing, hike or children's program) inside the season window."
    roles: [RanchManager]
    code: 201
    input: [activity_type, starts_at, ends_at, terrain_grade, min_ability_rank, capacity, rider_surcharge_cents, mount_required]
    output: ActivitySlot
    side_effects: ["duration_hours computed from starts_at and ends_at", "slot_status DRAFT; all rider, mount and guide counters 0; required_guide_count 0 because the confirmed set is empty", "seats_available := capacity"]

  - method: GET
    path: "/activity-slots/{slotId}"
    description: "Reads one activity slot including its counters, readiness posture and current version."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer, Guest]
    code: 200
    input: []
    output: ActivitySlot
    side_effects: []

  - method: GET
    path: "/activity-slots"
    description: "Lists activity slots, optionally filtered by season, activity type or lifecycle status."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: ["season_id?", "activity_type?", "slot_status?", "limit?", "offset?"]
    output: ActivitySlot[]
    side_effects: []

  - method: POST
    path: "/activity-slots/{slotId}/open"
    description: "Opens a DRAFT slot for booking, or re-opens a HOLD slot once its readiness posture has cleared."
    roles: [RanchManager]
    code: 200
    input: []
    output: ActivitySlot
    side_effects: ["slot_status DRAFT -> OPEN or HOLD -> OPEN and hold_reason cleared", "readiness_posture recomputed by slot_readiness_posture", "increments ActivitySlot.version by 1"]

  - method: POST
    path: "/activity-slots/{slotId}/run"
    description: "Starts the activity once the clock has reached starts_at and the slot is fully staffed and mounted."
    roles: [ActivityGuide]
    code: 200
    input: []
    output: ActivitySlot
    side_effects: ["slot_status OPEN -> RUNNING; actual_started_at set from the clock", "increments ActivitySlot.version by 1"]

  - method: POST
    path: "/activity-slots/{slotId}/complete"
    description: "Completes a RUNNING slot, converting checked-in seats to COMPLETED, absent seats to NO_SHOW, and crediting guide and horse hours."
    roles: [ActivityGuide]
    code: 200
    input: [actual_duration_hours]
    output: ActivitySlot
    side_effects: ["slot_status RUNNING -> COMPLETED; actual_ended_at and actual_duration_hours set", "every CHECKED_IN seat becomes COMPLETED; every still-CONFIRMED seat becomes NO_SHOW, raising Booking.no_show_count and Booking.no_show_penalty_total_cents", "every ASSIGNED mount becomes COMPLETED; Horse.realized_load_hours += actual_duration_hours and consecutive_duty_days recomputed by horse_duty_day_run", "every SCHEDULED GuideAssignment becomes COMPLETED with credited_hours := actual_duration_hours", "increments ActivitySlot.version by 1"]

  - method: POST
    path: "/activity-slots/{slotId}/cancel"
    description: "Cancels a DRAFT, OPEN or HOLD slot, reversing every seat surcharge, mount and guide assignment it holds."
    roles: [RanchManager]
    code: 200
    input: [reason]
    output: ActivitySlot
    side_effects: ["slot_status -> CANCELLED", "every CONFIRMED seat becomes CANCELLED with surcharge_reversed_cents := surcharge_cents, returning each Booking.activity_surcharge_total_cents to its pre-reservation value", "every ASSIGNED mount becomes RELEASED and each horse's scheduled_load_hours is restored exactly", "every SCHEDULED GuideAssignment becomes RELEASED", "increments ActivitySlot.version by 1"]

  - method: POST
    path: "/activity-slots/{slotId}/guide-assignments"
    description: "Staffs a slot with an ACTIVE seasonal guide who holds the certification the activity demands and has no overlapping duty."
    roles: [RanchManager]
    code: 201
    input: [staff_member_id, guide_role]
    output: GuideAssignment
    side_effects: ["assignment_status SCHEDULED", "slot.assigned_guide_count += 1 and readiness_posture recomputed", "StaffMember.scheduled_guide_hours += slot.duration_hours", "increments ActivitySlot.version by 1"]

  - method: GET
    path: "/guide-assignments/{guideAssignmentId}"
    description: "Reads one guide assignment."
    roles: [RanchManager, ActivityGuide, SafetyOfficer, ReservationsAgent]
    code: 200
    input: []
    output: GuideAssignment
    side_effects: []

  - method: GET
    path: "/guide-assignments"
    description: "Lists guide assignments, optionally filtered by slot, staff member or status; the only discovery channel for assignments released by a cascade."
    roles: [RanchManager, ActivityGuide, SafetyOfficer, ReservationsAgent]
    code: 200
    input: ["slot_id?", "staff_member_id?", "assignment_status?", "limit?", "offset?"]
    output: GuideAssignment[]
    side_effects: []

  - method: POST
    path: "/guide-assignments/{guideAssignmentId}/release"
    description: "Releases a scheduled guide from a slot, which can degrade the slot's readiness posture and force it onto HOLD."
    roles: [RanchManager]
    code: 200
    input: [reason]
    output: GuideAssignment
    side_effects: ["assignment_status SCHEDULED -> RELEASED", "slot.assigned_guide_count -= 1 and readiness_posture recomputed; an OPEN slot that became UNDERSTAFFED moves to HOLD with hold_reason UNDERSTAFFED", "StaffMember.scheduled_guide_hours -= slot.duration_hours", "increments ActivitySlot.version by 1"]

  - method: POST
    path: "/activity-slots/{slotId}/reservations"
    description: "Books a seat on an OPEN slot for a guest travelling on a booking. Requires the caller's last observed ActivitySlot version."
    roles: [ReservationsAgent]
    code: 201
    input: [booking_id, guest_id, expected_slot_version]
    output: ActivityReservation
    side_effects: ["reservation_status CONFIRMED; mount_status PENDING when the slot requires a mount, otherwise NOT_REQUIRED", "surcharge_cents := slot.rider_surcharge_cents and Booking.activity_surcharge_total_cents += surcharge_cents", "rider_ability_at_booking snapshots Guest.effective_ability_rank", "slot.confirmed_rider_count, minor_rider_count, required_guide_count, seats_available and readiness_posture recomputed", "an OPEN slot whose posture degraded to UNDERSTAFFED or MOUNT_SHORT moves to HOLD with the matching hold_reason", "increments ActivitySlot.version by 1"]

  - method: GET
    path: "/activity-reservations/{reservationId}"
    description: "Reads one activity seat including its mount state."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer, Guest]
    code: 200
    input: []
    output: ActivityReservation
    side_effects: []

  - method: GET
    path: "/activity-reservations"
    description: "Lists activity seats, optionally filtered by slot, booking, guest, assigned horse or status; the only discovery channel for seats cancelled by a cascade."
    roles: [RanchManager, ReservationsAgent, HorseProgramDirector, ActivityGuide, SafetyOfficer]
    code: 200
    input: ["slot_id?", "booking_id?", "guest_id?", "assigned_horse_id?", "reservation_status?", "mount_status?", "limit?", "offset?"]
    output: ActivityReservation[]
    side_effects: []

  - method: POST
    path: "/activity-reservations/{reservationId}/mount-assignments"
    description: "Assigns a named horse to a seat after every eligibility gate passes. Requires the caller's last observed Horse version."
    roles: [HorseProgramDirector]
    code: 200
    input: [horse_id, expected_horse_version]
    output: ActivityReservation
    side_effects: ["mount_status PENDING -> ASSIGNED or RELEASED -> ASSIGNED; assigned_horse_id set", "Horse.scheduled_load_hours += slot.duration_hours", "slot.mount_assigned_count += 1 and readiness_posture recomputed", "increments Horse.version and ActivitySlot.version by 1 each"]

  - method: POST
    path: "/activity-reservations/{reservationId}/mount-auto-assign"
    description: "Picks the fairest eligible mount for a seat using mount_selection_ranking (scheduled_load_hours ASC, consecutive_duty_days ASC, created_at ASC)."
    roles: [HorseProgramDirector]
    code: 200
    input: []
    output: ActivityReservation
    side_effects: ["the selected horse is assigned with the same effects as a named mount assignment", "ERR_NO_ELIGIBLE_MOUNT when the eligible set is empty", "increments Horse.version and ActivitySlot.version by 1 each"]

  - method: POST
    path: "/activity-reservations/{reservationId}/mount-release"
    description: "Releases the horse held for a seat, restoring the animal's scheduled load exactly."
    roles: [HorseProgramDirector]
    code: 200
    input: [reason]
    output: ActivityReservation
    side_effects: ["mount_status ASSIGNED -> RELEASED; assigned_horse_id cleared; mount_release_count += 1", "Horse.scheduled_load_hours -= slot.duration_hours, returning it to the exact pre-assignment value", "slot.mount_assigned_count -= 1 and readiness_posture recomputed; an OPEN slot that became MOUNT_SHORT moves to HOLD", "increments Horse.version and ActivitySlot.version by 1 each"]

  - method: POST
    path: "/activity-reservations/{reservationId}/check-in"
    description: "Checks a rider in at the trailhead once the slot is running, the waiver is live and the mount is in hand."
    roles: [ActivityGuide]
    code: 200
    input: []
    output: ActivityReservation
    side_effects: ["reservation_status CONFIRMED -> CHECKED_IN; checked_in_at set from the clock", "increments ActivityReservation.version by 1"]

  - method: POST
    path: "/activity-reservations/{reservationId}/cancel"
    description: "Cancels an activity seat, reversing its surcharge and releasing its mount."
    roles: [ReservationsAgent, RanchManager]
    code: 200
    input: [reason]
    output: ActivityReservation
    side_effects: ["reservation_status -> CANCELLED; surcharge_reversed_cents := surcharge_cents and Booking.activity_surcharge_total_cents -= surcharge_cents", "mount_status ASSIGNED -> RELEASED with the horse's scheduled_load_hours restored", "slot counters and readiness_posture recomputed", "increments ActivityReservation.version and ActivitySlot.version by 1 each"]

  - method: POST
    path: "/seasons/{seasonId}/staff-members"
    description: "Hires a seasonal staff member on a dated contract that carries an end-of-season retention bonus."
    roles: [RanchManager]
    code: 201
    input: [full_name, role_type, certifications, hired_on, contract_end_date]
    output: StaffMember
    side_effects: ["employment_status HIRED; contract_days computed from hired_on and contract_end_date", "retention_bonus_projected_cents computed by retention_bonus variant projected"]

  - method: GET
    path: "/staff-members/{staffMemberId}"
    description: "Reads one staff member including days_worked, both retention-bonus figures and the current version."
    roles: [RanchManager, ActivityGuide, SafetyOfficer, HorseProgramDirector]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members"
    description: "Lists staff members, optionally filtered by season, role type or employment status."
    roles: [RanchManager, ActivityGuide, SafetyOfficer, HorseProgramDirector]
    code: 200
    input: ["season_id?", "role_type?", "employment_status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: POST
    path: "/staff-members/{staffMemberId}/onboard"
    description: "Onboards a hired staff member and allots on-site housing, which is exclusive per unit and bunk."
    roles: [RanchManager]
    code: 200
    input: [housing_unit_code, housing_bunk_number]
    output: StaffMember
    side_effects: ["employment_status HIRED -> ACTIVE; housing_unit_code and housing_bunk_number recorded", "increments StaffMember.version by 1"]

  - method: POST
    path: "/staff-members/{staffMemberId}/separate"
    description: "Separates a staff member before the contract end date, applying the retention-bonus vesting cliff and releasing their scheduled guide duties."
    roles: [RanchManager]
    code: 200
    input: [reason]
    output: StaffMember
    side_effects: ["employment_status -> DEPARTED_EARLY; separated_on set from the clock and days_worked frozen", "retention_bonus variant settled writes retention_bonus_settled_cents (0 below the 50% cliff) and Season.retention_bonus_liability_cents += that amount", "every SCHEDULED GuideAssignment of the staff member becomes RELEASED and scheduled_guide_hours drops to 0", "each affected slot recomputes assigned_guide_count and readiness_posture; an OPEN slot that became UNDERSTAFFED moves to HOLD with hold_reason UNDERSTAFFED", "increments StaffMember.version and Season.version by 1 each"]

  - method: POST
    path: "/staff-members/{staffMemberId}/complete-season"
    description: "Closes out a staff contract that ran to its end date, paying the retention bonus in full and releasing the housing bunk."
    roles: [RanchManager]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["employment_status ACTIVE -> COMPLETED_SEASON", "retention_bonus variant settled pays Season.retention_bonus_cents in full into retention_bonus_settled_cents and Season.retention_bonus_liability_cents", "housing_unit_code and housing_bunk_number released for reuse", "increments StaffMember.version and Season.version by 1 each"]

  - method: POST
    path: "/activity-reservations/{reservationId}/incident-reports"
    description: "Files an equine-activity incident report against a seat, naming the animal involved and recording that the statutory notice was given."
    roles: [ActivityGuide]
    code: 201
    input: [severity, equine_activity_statute_notice_given, narrative, occurred_at, "horse_id?"]
    output: IncidentReport
    side_effects: ["incident_status FILED; guest_id copied from the seat and reported_by_staff_member_id taken from X-User-ID", "when horse_id is present the animal moves horse_status IN_SERVICE -> REVIEW_HOLD and is withheld from the mount pool", "increments Horse.version by 1 when a horse is named"]

  - method: GET
    path: "/incident-reports/{incidentReportId}"
    description: "Reads one incident report including its disposition and closure trail."
    roles: [RanchManager, SafetyOfficer, ActivityGuide, HorseProgramDirector]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: GET
    path: "/incident-reports"
    description: "Lists incident reports, optionally filtered by seat, guest, horse, filing guide or review status."
    roles: [RanchManager, SafetyOfficer, ActivityGuide, HorseProgramDirector]
    code: 200
    input: ["reservation_id?", "guest_id?", "horse_id?", "reported_by_staff_member_id?", "incident_status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: POST
    path: "/incident-reports/{incidentReportId}/dispose"
    description: "Dispositions a FILED report as CLEARED or REMEDIATION_REQUIRED; the two branches diverge sharply in what they cascade."
    roles: [SafetyOfficer]
    code: 200
    input: [disposition, disposition_note]
    output: IncidentReport
    side_effects: ["incident_status FILED -> CLEARED or FILED -> REMEDIATION_REQUIRED; disposed_by_user_id set from X-User-ID", "CLEARED returns a REVIEW_HOLD horse to IN_SERVICE", "REMEDIATION_REQUIRED routes a REVIEW_HOLD horse to REHAB, moves the involved Guest to RESTRICTED (capping effective_ability_rank at BEGINNER) and cancels that guest's future seats above BEGINNER, releasing their mounts and forcing each parent slot to recompute readiness_posture", "increments IncidentReport.version, and Horse.version and Guest.version where touched"]

  - method: POST
    path: "/incident-reports/{incidentReportId}/close"
    description: "Closes a disposed report. The closing X-User-ID must differ from the disposing one, and the remediation branch additionally requires remediation_completed."
    roles: [SafetyOfficer]
    code: 200
    input: [remediation_completed]
    output: IncidentReport
    side_effects: ["incident_status CLEARED -> CLOSED or REMEDIATION_REQUIRED -> CLOSED; closed_by_user_id set from X-User-ID", "the report becomes immutable", "increments IncidentReport.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, empty or whitespace-only"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Guest-role caller addresses a guest, booking or seat that is not their own"
  - id: ERR_NOT_ASSIGNED_GUIDE
    http: 403
    condition: "an ActivityGuide acts on a slot they hold no SCHEDULED guide assignment for"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID closing an incident report equals disposed_by_user_id"

  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "no Season with the given id"
  - id: ERR_CABIN_NOT_FOUND
    http: 404
    condition: "no Cabin with the given id, in the path or in a request body"
  - id: ERR_GUEST_NOT_FOUND
    http: 404
    condition: "no Guest with the given id, in the path or in party_members / guest_id"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no RiderAssessment with the given id"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "no Booking with the given id, in the path or in a request body"
  - id: ERR_HORSE_NOT_FOUND
    http: 404
    condition: "no Horse with the given id, in the path or in a request body"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "no ActivitySlot with the given id"
  - id: ERR_GUIDE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no GuideAssignment with the given id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no ActivityReservation with the given id"
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "no StaffMember with the given id, in the path or in a request body"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "no IncidentReport with the given id"

  - id: ERR_MISSING_REQUIRED_FIELD
    http: 400
    condition: "a field declared required in the endpoint's input is absent"
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "a supplied field violates its declared type, enum membership or numeric range"
  - id: ERR_SEASON_MISMATCH
    http: 409
    condition: "a seat's booking belongs to a different season than the slot, or the named guest is not in that booking's party"

  - id: ERR_STALE_SLOT_VERSION
    http: 412
    condition: "expected_slot_version does not equal the stored ActivitySlot.version"
  - id: ERR_STALE_GUEST_VERSION
    http: 412
    condition: "expected_guest_version does not equal the stored Guest.version"
  - id: ERR_STALE_HORSE_VERSION
    http: 412
    condition: "expected_horse_version does not equal the stored Horse.version"
  - id: ERR_STALE_BOOKING_VERSION
    http: 412
    condition: "expected_booking_version does not equal the stored Booking.version"

  - id: ERR_INVALID_SEASON_TRANSITION
    http: 409
    condition: "the requested target_status is not the next step in the season lifecycle"
  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "the governing Season is not in a status that permits the write"
  - id: ERR_SEASON_HAS_LIVE_BOOKINGS
    http: 409
    condition: "a Booking of the season is still CHECKED_IN when the season is closed"
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "the Booking is not in the state the operation requires"
  - id: ERR_SLOT_STATE_INVALID
    http: 409
    condition: "the ActivitySlot is not in the state the operation requires"
  - id: ERR_RESERVATION_STATE_INVALID
    http: 409
    condition: "the ActivityReservation's reservation_status or mount_status forbids the operation"
  - id: ERR_CABIN_NOT_READY
    http: 409
    condition: "the Cabin is not READY when a booking checks in or a maintenance hold is placed"
  - id: ERR_STAFF_STATE_INVALID
    http: 409
    condition: "the StaffMember's employment_status forbids the operation"
  - id: ERR_ASSESSMENT_STATE_INVALID
    http: 409
    condition: "the RiderAssessment's assessment_status forbids the operation"
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "the IncidentReport's incident_status forbids the operation"
  - id: ERR_HORSE_NOT_IN_SERVICE
    http: 409
    condition: "the Horse is not IN_SERVICE when a mount assignment is attempted"
  - id: ERR_GUEST_SUSPENDED
    http: 409
    condition: "the Guest's standing is SUSPENDED when a seat is created or checked in"
  - id: ERR_WAIVER_NOT_SIGNED
    http: 409
    condition: "the Guest's waiver resolves to NONE, REVOKED or EXPIRED"

  - id: ERR_EQUINE_STATUTE_ACK_REQUIRED
    http: 422
    condition: "Guest.equine_statute_ack is false for a mounted activity"
  - id: ERR_GUARDIAN_SIGNATURE_REQUIRED
    http: 422
    condition: "a minor's waiver names no adult guardian guest with a live waiver"
  - id: ERR_RIDER_ABILITY_INSUFFICIENT
    http: 422
    condition: "the guest's effective_ability_rank is below the slot's min_ability_rank"
  - id: ERR_RIDER_WEIGHT_EXCEEDS_MOUNT
    http: 422
    condition: "the rider's weight_lb exceeds the horse's weight_limit_lb"
  - id: ERR_MOUNT_ABILITY_MISMATCH
    http: 422
    condition: "the rider's rank falls outside the horse's [min_rider_ability, max_rider_ability] band"
  - id: ERR_MOUNT_DUTY_LIMIT
    http: 422
    condition: "the horse's consecutive_duty_days has reached 5"
  - id: ERR_MOUNT_DAILY_HOURS_EXCEEDED
    http: 422
    condition: "the assignment would push the horse past 4.0 scheduled hours on that date"
  - id: ERR_MOUNT_INTERVAL_CONFLICT
    http: 409
    condition: "the horse already holds an ASSIGNED seat separated from this slot by strictly less than the 60-minute recovery buffer"
  - id: ERR_NO_ELIGIBLE_MOUNT
    http: 422
    condition: "auto-assignment finds no horse that satisfies every eligibility clause"
  - id: ERR_GUIDE_RATIO_UNMET
    http: 409
    condition: "assigned_guide_count is below required_guide_count when a slot opens or runs"
  - id: ERR_MOUNTS_INCOMPLETE
    http: 409
    condition: "a mounted slot still has fewer assigned mounts than confirmed riders when it tries to run"
  - id: ERR_DIETARY_BRIEFING_REQUIRED
    http: 422
    condition: "a party declares a dietary restriction but check-in omits dietary_briefing_ack"
  - id: ERR_STATUTE_NOTICE_REQUIRED
    http: 422
    condition: "an equine incident report or disposition lacks the statutory notice acknowledgement"

  - id: ERR_ARRIVAL_DAY_INVALID
    http: 422
    condition: "arrival_date does not fall on the season's arrival_weekday"
  - id: ERR_STAY_LENGTH_INVALID
    http: 422
    condition: "nights is outside [min_stay_nights, max_stay_nights]"
  - id: ERR_STAY_OUTSIDE_SEASON
    http: 422
    condition: "the stay window falls outside the season's operating dates"
  - id: ERR_CABIN_DOUBLE_BOOKED
    http: 409
    condition: "another live booking overlaps the half-open cabin interval"
  - id: ERR_BUYOUT_CONFLICT
    http: 409
    condition: "a buyout overlaps any live booking, or a booking falls inside a live buyout's interval"
  - id: ERR_GUIDE_SCHEDULE_CONFLICT
    http: 409
    condition: "the guide already works an overlapping slot or would exceed 10.0 scheduled hours that day"
  - id: ERR_GUEST_SLOT_CONFLICT
    http: 409
    condition: "the guest already holds a live seat on an overlapping slot"
  - id: ERR_SLOT_OUTSIDE_SEASON
    http: 422
    condition: "the slot interval falls outside the season window or ends_at is not after starts_at"
  - id: ERR_SLOT_NOT_STARTED
    http: 409
    condition: "the logical clock has not reached the slot's starts_at"
  - id: ERR_CONTRACT_DATE_INVALID
    http: 409
    condition: "the clock date is on the wrong side of hired_on or contract_end_date for the requested staff transition"

  - id: ERR_MEMBER_TYPE_MISMATCH
    http: 422
    condition: "a party member's member_type disagrees with the referenced guest's age"
  - id: ERR_LEAD_GUEST_NOT_IN_PARTY
    http: 422
    condition: "lead_guest_id is absent from party_members, or the party has no adult"
  - id: ERR_DUPLICATE_PARTY_MEMBER
    http: 422
    condition: "the same guest_id appears twice in party_members"
  - id: ERR_PACKAGE_TIER_UNKNOWN
    http: 422
    condition: "package_tier_code names no element of Season.package_tiers"
  - id: ERR_CABIN_CAPACITY_EXCEEDED
    http: 422
    condition: "party_size exceeds the cabin's bed_capacity"
  - id: ERR_SLOT_ON_HOLD
    http: 409
    condition: "a seat is requested on a slot whose slot_status is HOLD"
  - id: ERR_SLOT_FULL
    http: 409
    condition: "the slot has no seats_available left"
  - id: ERR_DUPLICATE_RESERVATION
    http: 409
    condition: "the guest already holds a live seat on this exact slot"
  - id: ERR_CERTIFICATION_MISSING
    http: 422
    condition: "the assigned guide lacks the certification the activity_type demands, is not ACTIVE, or belongs to another season"
  - id: ERR_HOUSING_BUNK_TAKEN
    http: 409
    condition: "the requested housing unit and bunk is already held by live staff in the same season"
  - id: ERR_GUIDE_ASSIGNMENTS_OPEN
    http: 409
    condition: "the staff member still holds SCHEDULED guide assignments at season completion"
  - id: ERR_DINING_CAPACITY_EXCEEDED
    http: 409
    condition: "check-in would push in-house guests past the single-seating dining capacity"
  - id: ERR_OPEN_ACTIVITY_RESERVATIONS
    http: 409
    condition: "the booking still holds live seats on live slots at check-out"

  - id: ERR_INVALID_PAYMENT_AMOUNT
    http: 422
    condition: "amount_cents is not a positive integer, or kind is not DEPOSIT or SETTLEMENT"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "deposit_paid_cents is below deposit_required_cents at confirmation"
  - id: ERR_FOLIO_BALANCE_OUTSTANDING
    http: 402
    condition: "settle_payment_cents does not bring folio_balance_cents to exactly 0 at check-out"
  - id: ERR_CAPITAL_RESERVE_INSUFFICIENT
    http: 409
    condition: "a capital project would push capital_committed_cents past the season's capital_reserve_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: RanchManager
    description: "ranch general manager: season lifecycle, cabins, slots, guide staffing, seasonal hiring, housing and capital projects"
    identity: opaque
    exclusive_operations:
      - "POST /seasons"
      - "POST /seasons/{seasonId}/advance"
      - "POST /cabins"
      - "POST /cabins/{cabinId}/maintenance-hold"
      - "POST /cabins/{cabinId}/return-to-ready"
      - "POST /cabins/{cabinId}/turnover-complete"
      - "POST /guests/{guestId}/waiver-revocation"
      - "POST /guests/{guestId}/reinstatement"
      - "POST /seasons/{seasonId}/activity-slots"
      - "POST /activity-slots/{slotId}/open"
      - "POST /activity-slots/{slotId}/cancel"
      - "POST /activity-slots/{slotId}/guide-assignments"
      - "POST /guide-assignments/{guideAssignmentId}/release"
      - "POST /seasons/{seasonId}/staff-members"
      - "POST /staff-members/{staffMemberId}/onboard"
      - "POST /staff-members/{staffMemberId}/separate"
      - "POST /staff-members/{staffMemberId}/complete-season"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /guests"
      - "POST /guests/{guestId}/suspension"
      - "POST /bookings/{bookingId}/cancel"
      - "POST /bookings/{bookingId}/folio-adjustments"
      - "POST /activity-reservations/{reservationId}/cancel"
      - "every GET endpoint"

  - name: ReservationsAgent
    description: "reservations desk: guest records, waivers, package bookings, deposits, folios, seats and front-desk check-in/out"
    identity: opaque
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{bookingId}/payments"
      - "POST /bookings/{bookingId}/confirm"
      - "POST /bookings/{bookingId}/check-in"
      - "POST /bookings/{bookingId}/check-out"
      - "POST /activity-slots/{slotId}/reservations"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /guests"
      - "POST /guests/{guestId}/waiver-signature"
      - "POST /bookings/{bookingId}/cancel"
      - "POST /bookings/{bookingId}/folio-adjustments"
      - "POST /activity-reservations/{reservationId}/cancel"
      - "every GET endpoint except staff and incident reads it does not need"

  - name: HorseProgramDirector
    description: "head wrangler: herd registry and health, rider ability assessment, and every mount assignment or release"
    identity: opaque
    exclusive_operations:
      - "POST /horses"
      - "POST /horses/{horseId}/health-events"
      - "POST /guests/{guestId}/rider-assessments"
      - "POST /rider-assessments/{riderAssessmentId}/evaluate"
      - "POST /activity-reservations/{reservationId}/mount-assignments"
      - "POST /activity-reservations/{reservationId}/mount-auto-assign"
      - "POST /activity-reservations/{reservationId}/mount-release"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /rider-assessments/{riderAssessmentId}/flag-re-evaluation"
      - "every GET endpoint"

  - name: ActivityGuide
    description: "seasonal guide working the slot: runs and completes the activity, checks riders in at the trailhead, and files incident reports"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /activity-slots/{slotId}/run"
      - "POST /activity-slots/{slotId}/complete"
      - "POST /activity-reservations/{reservationId}/check-in"
      - "POST /activity-reservations/{reservationId}/incident-reports"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /rider-assessments/{riderAssessmentId}/flag-re-evaluation"
      - "every GET endpoint covering slots, seats, horses, staff and incidents"

  - name: Guest
    description: "the guest themself: reads their own record, booking and seats, and signs their own waiver"
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "POST /guests/{guestId}/waiver-signature"
      - "GET /guests/{guestId}"
      - "GET /seasons/{seasonId}"
      - "GET /bookings/{bookingId}"
      - "GET /activity-slots/{slotId}"
      - "GET /activity-reservations/{reservationId}"

  - name: SafetyOfficer
    description: "safety and compliance officer: dispositions and closes incident reports under segregation of duties, and may restrict a guest"
    identity: opaque
    exclusive_operations:
      - "POST /incident-reports/{incidentReportId}/dispose"
      - "POST /incident-reports/{incidentReportId}/close"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /guests/{guestId}/suspension"
      - "every GET endpoint"
