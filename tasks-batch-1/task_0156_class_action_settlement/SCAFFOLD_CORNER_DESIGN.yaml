              as_user_id: "controller-1"
          trigger:
            - call: "GET /settlements/${s_id}/ledger-entries"
              payload: {}
              as: FundController
          assert:
            - "response_type == array"
            - "data contains entries with entry_type FUND_OPEN, FEE_DEBIT, ADMIN_DEBIT, PAYMENT_DEBIT"
            - "sum of returned amount_cents == 0"

      - name: cascade_void_does_not_touch_ledger
        claim_type: cascading_side_effects
        grounds: [state_machines.DistributionBatch.COMPUTED_to_VOID, entities.Settlement.fields.allocated_cents]
        distinguishing_aspect: "Voiding a COMPUTED batch cancels its planned payments but performs NO ledger debit: allocated_cents stays 0 and ledger-balance stays at net (50000)."
        test_recipe:
          setup: ["DISTRIBUTING net 50000 settlement, COMPUTED batch with one PLANNED payment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements"
              payload: { case_caption: "In re VoidLedger", gross_fund_cents: 50000, attorney_fee_cents: 0, admin_cost_cents: 0, distribution_method: "PRO_RATA", claim_filing_deadline: "2026-02-01T00:00:00Z", objection_deadline: "2026-01-20T00:00:00Z", cy_pres_floor_cents: 0 }
              as: SettlementAdmin
              captures: { s_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-notice"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/class-members"
              payload: { full_name: "M", email: "m@x.com", tin_on_file: true }
              as: ClaimsAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /settlements/${s_id}/open-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /claims"
              payload: { settlement_id: "${s_id}", class_member_id: "${m_id}", claimed_loss_cents: 50000 }
              as: ClaimsAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /claims/${c_id}/validate"
              payload: { recognized_loss_cents: 50000 }
              as: ClaimsReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/close-claims"
              payload: {}
              as: SettlementAdmin
            - call: "POST /settlements/${s_id}/begin-distribution"
              payload: {}
              as: FundController
            - call: "POST /distribution-batches"
              payload: { settlement_id: "${s_id}", sequence_no: 1 }
              as: FundController
              captures: { batch_id: $.data.id }
            - call: "POST /distribution-batches/${batch_id}/compute"
              payload: {}
              as: FundController
          trigger:
            - call: "POST /distribution-batches/${batch_id}/void"
              payload: {}
              as: FundController
            - call: "GET /settlements/${s_id}/ledger-balance"
              payload: {}
              as: FundController
              captures: { bal: $.data.balance_cents }
          assert:
            - "DistributionBatch.${batch_id}.status == VOID"
            - "$.data.balance_cents == 50000 (no PAYMENT_DEBIT)"
            - "Settlement.${s_id}.allocated_cents == 0"

