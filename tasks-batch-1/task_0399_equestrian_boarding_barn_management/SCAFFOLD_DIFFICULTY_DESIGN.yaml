# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Equestrian Boarding & Barn Management — 9 Difficulty Rules x >= 2 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: boarding_charge_provisional_vs_final_diverge
        grounds:
          - calculations.boarding_charge
          - state_machines.BoardingAgreement.DRAFT_to_ACTIVE
          - state_machines.BoardingAgreement.ACTIVE_to_ENDED
          - entities.BoardingAgreement.fields.provisional_charge_cents
          - entities.BoardingAgreement.fields.final_charge_cents
        distinguishing_aspect: |
          On the SAME agreement (daily_rate 4500), the provisional variant projects a flat
          30-day month (135000) at activation while the final variant charges only the 10
          actually-occupied days (45000) at end — proving the two variants diverge on the
          Agreement cost domain.
        test_recipe:
          setup:
            - "Owner with a SIGNED waiver; STALL capacity 1, daily_rate 4500; agreement activated on 2026-06-01, ended on 2026-06-11 (10 occupied days, no suspension)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Ann Rider", email: "ann@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "A-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Comet" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
              captures: { prov: $.data.provisional_charge_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00.000Z" }
              as: BarnManager
          trigger:
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ENDED" }
              as: BarnManager
              captures: { fin: $.data.final_charge_cents }
          assert:
            - "BoardingAgreement.${ba_id}.provisional_charge_cents == 135000"
            - "BoardingAgreement.${ba_id}.final_charge_cents == 45000"
            - "BoardingAgreement.${ba_id}.provisional_charge_cents != BoardingAgreement.${ba_id}.final_charge_cents"

      - name: owner_standing_provisional_vs_final_diverge
        grounds:
          - calculations.owner_standing_score
          - entities.Owner.fields.standing_score
          - entities.Owner.fields.provisional_standing_score
          - state_machines.Invoice.OPEN_to_FINALIZED
        distinguishing_aspect: |
          On the OWNER domain (distinct from boarding cost): with one OPEN invoice whose
          projected amount_due is 25000 and zero committed balance, the provisional variant
          reads 40 (counts the OPEN invoice) while committed standing_score stays 0 until
          finalize — proving dual-variant on a second entity domain.
        test_recipe:
          setup:
            - "Owner has one COMPLETED lesson (8000), one COMPLETED service visit (12000) and one CONFIRMED show entry (5000) = 25000 unbilled; an OPEN invoice exists but is NOT finalized; committed balance 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Bo Rider", email: "bo@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "A-2", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Dash" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 8000, starts_at: "2026-06-02T10:00:00.000Z", ends_at: "2026-06-02T11:00:00.000Z" }
              as: BarnManager
              captures: { les_id: $.data.id }
            - call: "POST /lessons/${les_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: Instructor
            - call: "POST /service-visits"
              payload: { horse_id: "${horse_id}", visit_type: "FARRIER", scheduled_at: "2026-06-03T09:00:00.000Z", duration_minutes: 60, fee_cents: 12000 }
              as: BarnManager
              captures: { sv_id: $.data.id }
            - call: "POST /service-visits/${sv_id}/transition"
              payload: { target_status: "SCHEDULED" }
              as: BarnManager
            - call: "POST /service-visits/${sv_id}/transition"
              payload: { target_status: "COMPLETED" }
              as: ServiceProvider
            - call: "POST /show-entries"
              payload: { horse_id: "${horse_id}", event_name: "County Show", event_date: "2026-07-01T00:00:00.000Z", entry_fee_cents: 5000 }
              as: BarnManager
              captures: { se_id: $.data.id }
            - call: "POST /show-entries/${se_id}/transition"
              payload: { target_status: "CONFIRMED" }
              as: BarnManager
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", period_label: "2026-06" }
              as: BarnManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "GET /owners/${own_id}"
              payload: {}
              as: BarnManager
              captures: { prov_score: $.data.provisional_standing_score, committed: $.data.standing_score }
          assert:
            - "Owner.${own_id}.provisional_standing_score == 40"
            - "Owner.${own_id}.standing_score == 0"
            - "Owner.${own_id}.provisional_standing_score != Owner.${own_id}.standing_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_tiered_discount_and_deposit_waterfall
        grounds:
          - calculations.invoice_total
          - state_machines.Invoice.OPEN_to_FINALIZED
          - entities.Invoice.fields.gross_amount_cents
          - entities.Invoice.fields.multi_horse_discount_cents
          - entities.Invoice.fields.deposit_applied_cents
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction — two ENDED boarding lines (45000+45000)
          select the n==2 tier (5% => discount 4900 over gross 98000) and the deposit waterfall
          then applies min(deposit 20000, net 93100) = 20000, yielding amount_due 73100.
        test_recipe:
          setup:
            - "Owner with deposit 20000; two horses each ended a 10-day/no-suspension boarding at daily 4500 (final 45000 each); no other lines; one OPEN invoice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Cy Rider", email: "cy@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/deposit"
              payload: { amount_cents: 20000 }
              as: BarnManager
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "B-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall1: $.data.id }
            - call: "POST /stalls"
              payload: { label: "B-2", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall2: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Echo" }
              as: BarnManager
              captures: { h1: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Flint" }
              as: BarnManager
              captures: { h2: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${h1}", stall_id: "${stall1}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba1: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${h2}", stall_id: "${stall2}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba2: $.data.id }
            - call: "POST /boarding-agreements/${ba1}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /boarding-agreements/${ba2}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /boarding-agreements/${ba1}/transition"
              payload: { target_status: "ENDED" }
              as: BarnManager
            - call: "POST /boarding-agreements/${ba2}/transition"
              payload: { target_status: "ENDED" }
              as: BarnManager
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", period_label: "2026-06" }
              as: BarnManager
              captures: { inv_id: $.data.id }
            - call: "GET /owners/${own_id}"
              payload: {}
              as: BarnManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/transition"
              payload: { target_status: "FINALIZED", expected_owner_version: "${ov}" }
              as: BarnManager
              captures: { due: $.data.amount_due_cents }
          assert:
            - "Invoice.${inv_id}.gross_amount_cents == 90000"
            - "Invoice.${inv_id}.multi_horse_discount_cents == 4500"
            - "Invoice.${inv_id}.deposit_applied_cents == 20000"
            - "Invoice.${inv_id}.amount_due_cents == 65500"

      - name: invoice_total_round_each_line_then_sum
        grounds:
          - calculations.invoice_total
          - calculations.lesson_fee
          - state_machines.Lesson.SCHEDULED_to_NO_SHOW
          - entities.Invoice.fields.gross_amount_cents
        distinguishing_aspect: |
          MODE (b): nested rounding ORDER is pinned to round-each-line-THEN-sum. Two NO_SHOW
          lessons at fee 7501 each bill round_half_up(3750.5)=3751 per line; summing the rounded
          lines gives gross 7502, NOT round(7501.0)=7501 from a sum-then-round reading.
        test_recipe:
          setup:
            - "Owner+horse with ACTIVE boarding; two SCHEDULED lessons of fee 7501 each, both marked NO_SHOW (billed 3751 each); one OPEN invoice; no deposit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Di Rider", email: "di@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "C-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Gale" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 7501, starts_at: "2026-06-05T10:00:00.000Z", ends_at: "2026-06-05T11:00:00.000Z" }
              as: BarnManager
              captures: { les1: $.data.id }
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 7501, starts_at: "2026-06-06T10:00:00.000Z", ends_at: "2026-06-06T11:00:00.000Z" }
              as: BarnManager
              captures: { les2: $.data.id }
            - call: "POST /lessons/${les1}/transition"
              payload: { target_status: "NO_SHOW" }
              as: Instructor
            - call: "POST /lessons/${les2}/transition"
              payload: { target_status: "NO_SHOW" }
              as: Instructor
            - call: "POST /invoices"
              payload: { owner_id: "${own_id}", period_label: "2026-06" }
              as: BarnManager
              captures: { inv_id: $.data.id }
            - call: "GET /owners/${own_id}"
              payload: {}
              as: BarnManager
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /invoices/${inv_id}/transition"
              payload: { target_status: "FINALIZED", expected_owner_version: "${ov}" }
              as: BarnManager
              captures: { gross: $.data.gross_amount_cents }
          assert:
            - "Lesson.${les1}.billed_fee_cents == 3751"
            - "Lesson.${les2}.billed_fee_cents == 3751"
            - "Invoice.${inv_id}.gross_amount_cents == 7502"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: waiver_signed_expired_signed_cycle
        grounds:
          - state_machines.LiabilityWaiver.SIGNED_to_EXPIRED
          - state_machines.LiabilityWaiver.EXPIRED_to_SIGNED
          - calculations.waiver_expiry
          - entities.LiabilityWaiver.fields.status
        distinguishing_aspect: |
          The LiabilityWaiver machine cycles SIGNED -> EXPIRED -> SIGNED on the same row: after the
          clock passes expires_at the waiver expires, then re-signing returns it to SIGNED with a new
          expires_at — a true revision cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "Waiver signed at 2026-06-01 (expires 2027-06-01); clock advanced to 2027-06-02 and the waiver list read to lazily expire it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Eve Rider", email: "eve@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00.000Z" }
              as: BarnManager
            - call: "GET /owners/${own_id}/waivers"
              payload: {}
              as: BarnManager
          trigger:
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { st: $.data.status }
          assert:
            - "LiabilityWaiver.${wv_id}.status == SIGNED"
            - "LiabilityWaiver.${wv_id}.expires_at == 2028-06-01T00:00:00.000Z"

      - name: boarding_active_suspended_active_cycle
        grounds:
          - state_machines.BoardingAgreement.ACTIVE_to_SUSPENDED
          - state_machines.BoardingAgreement.SUSPENDED_to_ACTIVE
          - entities.BoardingAgreement.fields.status
          - entities.BoardingAgreement.fields.suspended_days
        distinguishing_aspect: |
          The BoardingAgreement machine (a DIFFERENT entity from LiabilityWaiver) cycles
          ACTIVE -> SUSPENDED -> ACTIVE; reinstating accrues suspended_days, distinguishing it
          from a linear lifecycle.
        test_recipe:
          setup:
            - "Owner with SIGNED waiver, standing 0; agreement ACTIVE from 2026-06-01, suspended at 2026-06-04, reinstated at 2026-06-07."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Fay Rider", email: "fay@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "D-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Hazel" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "SUSPENDED" }
              as: BarnManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:00:00.000Z" }
              as: BarnManager
          trigger:
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
              captures: { st: $.data.status }
          assert:
            - "BoardingAgreement.${ba_id}.status == ACTIVE"
            - "BoardingAgreement.${ba_id}.suspended_days == 3"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: waiver_expiry_suspends_boarding_cancels_lessons_depth3
        grounds:
          - state_machines.LiabilityWaiver.SIGNED_to_EXPIRED
          - state_machines.BoardingAgreement.ACTIVE_to_SUSPENDED
          - state_machines.Lesson.SCHEDULED_to_CANCELLED
          - entities.Lesson.fields.status
        distinguishing_aspect: |
          Depth-3 chain from waiver expiry: waiver EXPIRED (hop1) causes its owner's ACTIVE boarding
          to SUSPEND (hop2), and that suspension itself causes the horse's future SCHEDULED lesson to
          CANCEL (hop3) — each link caused by the prior link, not by the original waiver action.
        test_recipe:
          setup:
            - "Owner signed waiver 2026-06-01 (expires 2027-06-01); horse boarding ACTIVE; one future SCHEDULED lesson at 2027-07-01; clock advanced to 2027-06-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
            - call: "POST /owners"
              payload: { full_name: "Gus Rider", email: "gus@x.com" }
              as: BarnManager
              captures: { own_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { wv_id: $.data.id }
            - call: "POST /owners/${own_id}/waivers/${wv_id}/sign"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /stalls"
              payload: { label: "E-1", kind: "STALL", capacity: 1, daily_rate_cents: 4500 }
              as: BarnManager
              captures: { stall_id: $.data.id }
            - call: "POST /horses"
              payload: { owner_id: "${own_id}", name: "Ivy" }
              as: BarnManager
              captures: { horse_id: $.data.id }
            - call: "POST /boarding-agreements"
              payload: { horse_id: "${horse_id}", stall_id: "${stall_id}", start_date: "2026-06-01T00:00:00.000Z" }
              as: BarnManager
              captures: { ba_id: $.data.id }
            - call: "POST /boarding-agreements/${ba_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: BarnManager
            - call: "POST /lessons"
              payload: { horse_id: "${horse_id}", instructor_name: "Pat", lesson_fee_cents: 8000, starts_at: "2027-07-01T10:00:00.000Z", ends_at: "2027-07-01T11:00:00.000Z" }
              as: BarnManager
              captures: { les_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00.000Z" }
              as: BarnManager
          trigger:
            - call: "GET /owners/${own_id}/waivers"
              payload: {}
              as: BarnManager
            - call: "GET /horses/${horse_id}/lessons"
              payload: {}
              as: BarnManager
              captures: { les_status: "$.data[0].status" }
          assert:
            - "LiabilityWaiver.${wv_id}.status == EXPIRED"
            - "BoardingAgreement.${ba_id}.status == SUSPENDED"
            - "Lesson.${les_id}.status == CANCELLED"
            - "Lesson.${les_id}.billed_fee_cents == 0"

      - name: boarding_end_releases_stall_and_turnouts_depth2
        grounds:
          - state_machines.BoardingAgreement.ACTIVE_to_ENDED
