            - call: "POST /driver-pay/pay-packages/${pkg_rop}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Rex Reopen", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_rop: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_rop}/assign-pay-package"
              payload: { pay_package_id: "${pkg_rop}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_rop}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_rop}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1, tarp_required: false }
              as: SettlementClerk
              captures: { load_rop: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_rop}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_rop}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/disputes"
              payload: { dispute_kind: "MILEAGE", driver_id: "${drv_rop}", load_id: "${load_rop}", claimed_guide: "HHG", claimed_miles: 742, narrative: "first filing", evidence_doc_ref: "doc://rop-1" }
              as: SettlementClerk
              captures: { dsp_rop: $.data.id }
            - call: "POST /driver-pay/disputes/${dsp_rop}/review"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
