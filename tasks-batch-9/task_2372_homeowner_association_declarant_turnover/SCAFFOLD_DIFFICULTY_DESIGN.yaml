      - name: repose_deadline_inclusive_at_the_instant_and_strict_for_the_sweep
        grounds:
          - calculations.defect_repose_deadline
          - entities.DefectClaim.fields.repose_deadline
          - validations[priority=11]
          - errors.ERR_REPOSE_PERIOD_EXPIRED
          - state_machines.DefectClaim.INVESTIGATING_to_NOTICED
          - state_machines.DefectClaim.INVESTIGATING_to_TIME_BARRED
        distinguishing_aspect: |
          Instant-level inclusivity tested one second either side of the same computed deadline: with
          substantial_completion_date 2018-03-15T09:30:00Z and statute_of_repose_years 8, repose_deadline
          is 2018+8 = 2026-03-15T09:30:00Z carrying the original time of day; NOTICE at exactly that
          instant MUST succeed (clock <= deadline) while NOTICE one second later MUST fail with
          ERR_REPOSE_PERIOD_EXPIRED, and the sweep's strict clock > deadline comparison bars only the
          still-INVESTIGATING claim, never the one already NOTICED.
        test_recipe:
          setup:
            - "Logical clock moved to 2026-01-01T00:00:00Z before anything is created."
            - "Association 'Pinecrest' with statute_of_repose_years = 8."
            - "One CommonAreaComponent COMPLETE with substantial_completion_date 2018-03-15T09:30:00Z and CONVEYED, so every claim on it carries repose_deadline 2026-03-15T09:30:00Z."
            - "Two DefectClaims on that component, both INVESTIGATING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/associations"
              payload: { name: "Pinecrest", total_planned_lots: 30, turnover_threshold_pct: 66.67, fixed_turnover_date: "2027-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 400000, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 55000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /hoa/components"
              payload: { association_id: "${assoc_id}", name: "Tennis Courts", category: "AMENITY", replacement_cost_cents: 2200000, useful_life_years: 18, effective_age_years: 8, promised_completion_date: "2018-03-01T00:00:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
              captures: { comp_id: $.data.id }
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "BUILD_COMPLETE", effective_date: "2018-03-15T09:30:00Z" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "DEED_TENDERED" }
              as: Declarant
              as_user_id: "declarant-1"
            - call: "POST /hoa/components/${comp_id}/milestones"
              payload: { milestone: "CONVEYANCE_ACCEPTED" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Court surface heaving, north court", repair_cost_estimate_cents: 400000, diminution_value_cents: 250000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_on_time_id: $.data.id }
            - call: "POST /hoa/defect-claims"
              payload: { association_id: "${assoc_id}", component_id: "${comp_id}", defect_summary: "Court surface heaving, south court", repair_cost_estimate_cents: 400000, diminution_value_cents: 250000 }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { claim_late_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /hoa/defect-claims/${claim_on_time_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /hoa/associations/${assoc_id}/repose-sweep"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T09:30:01Z" }
              as: PlatformAdmin
            - call: "POST /hoa/defect-claims/${claim_late_id}/actions"
              payload: { action: "NOTICE" }
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
              captures: { err_repose: $.data.error_id }
            - call: "POST /hoa/associations/${assoc_id}/repose-sweep"
              payload: {}
              as: TransitionCommittee
              as_user_id: "${assoc_id}"
          assert:
            - "DefectClaim.${claim_on_time_id}.repose_deadline == 2026-03-15T09:30:00Z, keeping the 09:30:00 time of day"
            - "second trigger call returns 200 with DefectClaim.${claim_on_time_id}.status == NOTICED"
            - "third trigger call returns 200 with data.swept_claim_count == 0 and data.time_barred_claim_ids == [], because clock == deadline is not strictly past it"
            - "fifth trigger call returns 422 with error_id ERR_REPOSE_PERIOD_EXPIRED"
            - "sixth trigger call returns 200 with data.swept_claim_count == 1 and data.time_barred_claim_ids == [${claim_late_id}]"
            - "DefectClaim.${claim_late_id}.status == TIME_BARRED"
            - "DefectClaim.${claim_on_time_id}.status == NOTICED, never swept"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_notice_depends_on_conveyance_state_of_the_component
        grounds:
          - state_machines.DefectClaim.INVESTIGATING_to_NOTICED
          - state_machines.CommonAreaComponent.DEED_TENDERED_to_CONVEYED
          - entities.CommonAreaComponent.fields.conveyance_status
          - validations[priority=10]
          - errors.ERR_COMPONENT_NOT_CONVEYED
        distinguishing_aspect: |
          The legality of a DefectClaim transition is decided by a field on a different entity: with the
          claim itself perfectly valid (INVESTIGATING, repose_deadline 2031-05-05T00:00:00Z, far in the
          future) NOTICE is still refused with ERR_COMPONENT_NOT_CONVEYED while the component is only
          DEED_TENDERED, and the identical call succeeds the moment the TransitionCommittee accepts the
          conveyance. Nothing about the claim changes between the two calls.
        test_recipe:
          setup:
            - "Association 'Quarry Ridge' with statute_of_repose_years = 8."
            - "One CommonAreaComponent COMPLETE with substantial_completion_date 2023-05-05T00:00:00Z, conveyance_status DEED_TENDERED."
            - "One DefectClaim INVESTIGATING on that component; repose_deadline 2031-05-05T00:00:00Z, so the temporal rule can never fire."
