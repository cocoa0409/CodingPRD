              payload: {}
              as: IntakeClerk
              captures: { appn_v: $.data.version }
            - call: "POST /applications/${appn_id}/determinations"
              payload: { expected_application_version: "${appn_v}", category: "UNCONDITIONAL", effective_date: "2026-08-06", rationale: "cannot board steps" }
              as: EligibilitySpecialist
