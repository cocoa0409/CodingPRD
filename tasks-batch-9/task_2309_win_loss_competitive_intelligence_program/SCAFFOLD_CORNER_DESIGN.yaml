            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /competitors
              payload: { program_id: "${p_id}", name: "Northwind", tier: "PRIMARY" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { c1_id: $.data.id }
            - call: POST /analysts
              payload: { program_id: "${p_id}", full_name: "Ana One", linked_user_ref: "user-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00.000Z", sales_org_member: false }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { a1_id: $.data.id }
            - call: POST /deals
              payload: { program_id: "${p_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00.000Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", primary_competitor_id: "${c1_id}" }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { d1_id: $.data.id }
            - call: POST /deals/${d1_id}/buyer-contacts
              payload: { email: "buyer1@acme.test", full_name: "Bea Buyer", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { b1_id: $.data.id }
            - call: POST /deals/${d1_id}/buyer-contacts/${b1_id}/consent
              payload: { consent_status: "GRANTED" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /sampling-frames
              payload: { program_id: "${p_id}", label: "Wave 1", window_start: "2026-04-01T00:00:00.000Z", window_end: "2026-07-01T00:00:00.000Z", quota_won: 0, quota_lost: 1, quota_no_decision: 0, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { f1_id: $.data.id }
            - call: POST /sampling-frames/${f1_id}/seal
              payload: {}
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /sampling-frames/${f1_id}/draw
              payload: { stratum: "LOST", requested_count: 1 }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /interviews
              payload: { deal_id: "${d1_id}", buyer_contact_id: "${b1_id}", analyst_id: "${a1_id}", scheduled_start_at: "2026-08-10T14:00:00.000Z", scheduled_end_at: "2026-08-10T15:00:00.000Z" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { i1_id: $.data.id }
            - call: POST /interviews/${i1_id}/responses
              payload: { question_key: "EVALUATION_CRITERIA", verbatim_text: "Security depth mattered most", recorded_at: "2026-08-01T10:00:00.000Z", rating: 3 }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
            - call: POST /analysts/${a1_id}/deactivate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /interviews/${i1_id}/responses
              payload: { question_key: "PRICING_PERCEPTION", verbatim_text: "List price felt high for the tier", recorded_at: "2026-08-01T10:10:00.000Z" }
              as: ResearchAnalyst
              as_user_id: ${a1_id}
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ANALYST_IDENTITY_INVALID\""
            - "GET /analysts/${a1_id} returns status == \"INACTIVE\""
            - "GET /interviews/${i1_id}/responses returns total_count == 1 (the PRICING_PERCEPTION answer was not stored)"

      - name: activate_on_unknown_program_id_returns_program_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_5
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "A well-formed but unused uuid in the path must produce 404 ERR_PROGRAM_NOT_FOUND, never 409 ERR_PROGRAM_STATE_INVALID — existence (priority 5) is checked before state (priority 13)."
        test_recipe:
          setup: ["a pinned clock and one unrelated DRAFT program, so the store is non-empty"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
          trigger:
            - call: POST /programs/00000000-0000-4000-8000-0000000000ff/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_PROGRAM_NOT_FOUND\""
            - "GET /programs/${p_id} returns status == \"DRAFT\" (the real program was untouched)"

      - name: deal_creation_with_unknown_competitor_reference_returns_competitor_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_6
          - errors.ERR_COMPETITOR_NOT_FOUND
        distinguishing_aspect: "The unresolvable id is in the BODY, not the path, and must still yield 404 ERR_COMPETITOR_NOT_FOUND — not 400 ERR_INVALID_REQUEST and not 409 ERR_CROSS_PROGRAM_REFERENCE (which requires the row to exist elsewhere)."
        test_recipe:
          setup: ["an ACTIVE program with no competitors"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
