      - PBGCFiling.${filing_id}.variable_rate_premium == 476.54 (9530.81 x 50/1000 = 476.5405 -> half-up)
      - PBGCFiling.${filing_id}.total_premium == 776.54 and cap_applied == false
- section: validations
  instances:
  - name: missing_auth_headers_returns_401
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request with no X-User-Role header is rejected 401 before any other check.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /v1/plans
        payload: {}
        as: ''
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_UNAUTHENTICATED with http 401
  - name: plan_year_mismatch_on_census_create
    claim_type: violation_to_error
    grounds:
    - validations[priority=11]
    - errors[ERR_PLAN_YEAR_MISMATCH]
    distinguishing_aspect: Census batch whose plan_year (2027) differs from the plan's (2028) is rejected ERR_PLAN_YEAR_MISMATCH 422.
    test_recipe:
      setup:
      - plan 2028 exists
      setup_api_calls:
      - call: POST /v1/plans
        payload:
          sponsor_name: Mismatch Co
          plan_year: 2028
          accrual_rate: 0.01
          normal_retirement_age: 62
          prior_aftap_pct: 90.0
        as: PlanAdmin
        captures:
          plan_id: $.data.id
      trigger:
      - call: POST /v1/plans/${plan_id}/census-batches
        payload:
          plan_year: 2027
          source_label: wrong-year
        as: PlanAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_PLAN_YEAR_MISMATCH with http 422
  - name: assumption_retirement_age_must_match_plan
    claim_type: violation_to_error
    grounds:
    - validations[priority=12]
    - errors[ERR_ASSUMPTION_MISMATCH]
    distinguishing_aspect: Assumption set with retirement_age 63 against plan normal_retirement_age 62 is rejected ERR_ASSUMPTION_MISMATCH.
    test_recipe:
      setup:
