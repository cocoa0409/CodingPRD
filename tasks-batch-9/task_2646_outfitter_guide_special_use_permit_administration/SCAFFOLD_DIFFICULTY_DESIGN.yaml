  - rule_id: transitive_cascade
    instances:

      - name: noncompliance_points_suspension_cascade_depth_five
        grounds:
          - state_machines.Permit.compliance_status.PROBATION_to_NONCOMPLIANT
          - state_machines.Permit.administrative_status.ACTIVE_to_SUSPENDED
          - state_machines.GuideAreaAuthorization.AUTHORIZED_to_REVOKED
          - calculations.noncompliance_point_accumulation
          - calculations.permit_compliance_derivation
          - calculations.outfitter_status_derivation
          - entities.Outfitter.fields.status
        distinguishing_aspect: |
          TRIGGER: issuing a NoncomplianceAction. DEPTH 5, and every hop is caused by the previous
          hop rather than by the request: (1) the action row is written and open_noncompliance_points
          recomputes to 20, (2) because 20 crosses 12 the compliance dimension enters NONCOMPLIANT,
          (3) because the permit became NONCOMPLIANT while ACTIVE the administrative dimension is
          suspended with reason POINTS_THRESHOLD and suspended_until_date clock + 30 days,
          (4) because the permit is suspended its authorization rows are revoked and
          authorized_client_capacity_total collapses to 0, (5) because the holder now has no ACTIVE
          permit the Outfitter is re-derived from PERMITTED to SUSPENDED. The chain crosses four
          entities and both dimensions of the parallel machine.
        test_recipe:
          setup:
            - "logical clock advanced to 2027-09-05T00:00:00Z after setup"
            - "UseArea BRW-01 with party_size_max 12 and a PUBLISHED 2027 needs assessment"
            - "Outfitter Alpine with status PERMITTED holding one ACTIVE permit for 200 days, an APPROVED plan, current insurance and bond, and two authorized guides totalling 12 client capacity"
