              captures: { vol_id: $.data.id }
            - call: "POST /fundraising/shifts"
              payload: { campaign_id: "${camp_id}", role_label: "A", starts_at: "2026-04-10T09:00:00Z", ends_at: "2026-04-10T12:00:00Z", setup_buffer_minutes: 0 }
