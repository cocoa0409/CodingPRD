        distinguishing_aspect: "POST /talents/{id}/roster on a PROSPECT talent with zero comp cards returns ERR_NO_COMP_CARD (409)."
        test_recipe:
          setup: ["PROSPECT talent with no comp cards."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { talent_id: $.data.id }
          trigger:
            - call: "POST /talents/${talent_id}/roster"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_COMP_CARD"

      - name: complete_audition_slot_before_end_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AuditionSlot.SCHEDULED_to_COMPLETED
          - errors[ERR_SLOT_NOT_ENDED]
        distinguishing_aspect: "POST /audition-slots/{id}/complete while logical clock (default 2026-01-01) is before end_at returns ERR_SLOT_NOT_ENDED (409)."
