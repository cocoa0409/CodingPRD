        grounds:
          - calculations.hedge_margin_requirement
          - entities.HedgePosition.fields.volatility_tier
          - entities.HedgePosition.fields.total_margin_usd
        distinguishing_aspect: |
          Mode (c) — a self-referential-looking chain whose evaluation order is pinned: volatility_tier is
          selected from base_margin_usd (49900.00 -> T1), never from total_margin_usd. Because the T1 adder
          pushes the total to 50399.00, which is itself above TIER_T2_FLOOR_USD, an implementation that
          re-derives the tier from the total would emit 51147.50 instead of 50399.00.
        test_recipe:
          setup:
            - "Empty database; clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
