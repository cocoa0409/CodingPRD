              captures: { cert1: $.data.id, cert1_v: $.data.version }
            - call: "POST /tuition-fee-reports"
              payload: { certification_id: "${cert1}", gross_tuition_cents: 3000000, mandatory_fees_cents: 150000, tuition_specific_aid_cents: 200000, non_tuition_aid_cents: 0, expected_certification_version: "${cert1_v}" }
