  - rule_id: non_linear_state_machine
    instances:
      - name: policy_lifecycle_and_limit_dimensions_move_independently
        grounds:
          - state_machines.Policy.INTACT_to_EXHAUSTED
          - state_machines.Policy.INFORCE_to_CANCELLED
          - entities.Policy.fields.lifecycle_status
          - entities.Policy.fields.limit_status
          - entities.Policy.fields.aggregate_limit_remaining_usd
          - entities.IncidentClaim.fields.unallocated_loss_usd
          - calculations.tower_allocation_waterfall
        distinguishing_aspect: |
          Policy carries two state dimensions that advance on different triggers: limit_status walks
          INTACT -> EXHAUSTED purely from ClaimPayment erosion while lifecycle_status is still INFORCE, and
          the later cancellation moves lifecycle_status to CANCELLED without resetting limit_status, so the
          combined state (CANCELLED, EXHAUSTED) is only reachable by two independent transitions.
        test_recipe:
          setup:
            - "Bound Bitwise Systems policy: aggregate 250000, retention 0, premium_usd 7500.00 (floored at MIN_PREMIUM_USD), tower FIRST_PARTY_RESPONSE 250000/prio 10 and BUSINESS_INTERRUPTION 250000/wait 12/coins 0.00/prio 20, lifecycle_status INFORCE and limit_status INTACT."
