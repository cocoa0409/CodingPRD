  - section: endpoints
    instances:
      - name: endpoint_clock_set_returns_null_data_and_must_advance_strictly
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - validations.priority_22.ERR_CLOCK_MUST_ADVANCE
        distinguishing_aspect: "The clock endpoint is the one write in the API whose success body carries data == null rather than an entity, and it is monotonic: re-sending the value it already holds is a 422 ERR_CLOCK_MUST_ADVANCE, not an idempotent 200."
        test_recipe:
          setup:
            - "The logical clock sits at its startup default 2026-08-01T00:00:00Z; no other data is needed."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T23:59:59.999Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.001Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "the first call returns HTTP 200 with response_type == success and data is null"
            - "the repeat of 2026-08-05T00:00:00Z returns HTTP 422 with data.error_id == ERR_CLOCK_MUST_ADVANCE"
            - "the backwards 2026-08-04T23:59:59.999Z call returns HTTP 422 with data.error_id == ERR_CLOCK_MUST_ADVANCE"
            - "the 2026-08-05T00:00:00.001Z call returns HTTP 200 with data null, proving one millisecond of advance is enough"

