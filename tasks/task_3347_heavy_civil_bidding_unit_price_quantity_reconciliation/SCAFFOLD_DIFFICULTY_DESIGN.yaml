      - call: POST /construction/bonds
        payload:
          project_id: ${p_o1}
          surety_id: ${s_o1}
          bond_type: PERFORMANCE
          bond_amount_cents: 12000000
          effective_from: '2026-12-01T00:00:00Z'
          effective_to: '2027-03-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
