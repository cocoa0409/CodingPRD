            - "Active cycle, ACTIVE inspector, HIGH parcel that PASSED an initial inspection at clock 2026-08-22 (risk rescored to 37.95 MODERATE, COMPLIANT); certificate A issued and certificate B denied at that clock; a REINSPECTION is then noticed for 2026-09-10."
