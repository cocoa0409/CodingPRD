      - name: submission_lifecycle_actions_on_wrong_states_each_return_their_own_code
        claim_type: Triggerable Error
        grounds:
          - errors[ERR_SUBMISSION_NOT_IN_EDIT_RESOLUTION]
          - errors[ERR_SUBMISSION_NOT_TRANSMITTED]
          - errors[ERR_SUBMISSION_NOT_DRAFT]
          - errors[ERR_CASE_ALREADY_IN_SUBMISSION]
          - errors[ERR_ITEM_NOT_FAILED]
        distinguishing_aspect: |
          The four submission actions each demand a different state, so the same batch refuses
          retransmit and edit-results while DRAFT and refuses new items once TRANSMITTED; the second
          add of an already-listed case is doubly wrong, and the declared priorities decide which
          answer the client gets (state at 40 outranks the duplicate-case rule at 61). Resolving an
          item twice is the last variant: once RESOLVED it is no longer EDIT_FAILED.
        test_recipe:
          setup:
            - "Canonical fixture through QA approval, one DRAFT submission for the July 2026 period holding that one COMPLETED case."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
