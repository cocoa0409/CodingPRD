        claim_type: error_envelope
        grounds:
          - errors
          - validations[priority=10]
          - validations[priority=30]
          - validations[priority=40]
          - validations[priority=50]
          - validations[priority=90]
          - validations[priority=100]
          - validations[priority=115]
          - validations[priority=270]
