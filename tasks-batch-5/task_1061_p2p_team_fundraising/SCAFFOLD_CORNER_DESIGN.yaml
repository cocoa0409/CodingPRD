scaffold_corner_design:
  - section: entities
    instances:
      - name: campaign_creation_returns_201_with_draft_defaults
        claim_type: creation
        grounds: [entities.Campaign.fields.status, entities.Campaign.fields.receipt_seq]
        distinguishing_aspect: "A campaign created with the three required fields returns 201 with status DRAFT, receipt_seq 0, every money field 0 and version 1."
        test_recipe:
          setup: ["One Organization exists."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.fundraising_minimum_cents == 0"
            - "Campaign.${camp_id}.receipt_seq == 0"
            - "Campaign.${camp_id}.available_balance_cents == 0"
            - "Campaign.${camp_id}.version == 1"

      - name: campaign_get_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CAMPAIGN_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /api/campaigns/{id} with a syntactically valid but unknown UUID returns 404 ERR_CAMPAIGN_NOT_FOUND."
        test_recipe:
          setup: ["Empty database except for one Organization."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /api/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_CAMPAIGN_NOT_FOUND"

      - name: participant_create_missing_required_display_name_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/participants without display_name returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup: ["PUBLISHED campaign."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /api/participants?campaign_id=${camp_id} total_count == 0"

      - name: participant_personal_goal_default_applied_when_omitted
        claim_type: defaults
        grounds: [entities.Participant.fields.personal_goal_cents, entities.Participant.fields.status]
        distinguishing_aspect: "Omitting personal_goal_cents yields the declared default 10000, and status defaults to PENDING with credited_cents 0."
        test_recipe:
          setup: ["PUBLISHED campaign."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
              as: Anonymous
              captures: { p_id: $.data.id }
          assert:
            - "Participant.${p_id}.personal_goal_cents == 10000"
            - "Participant.${p_id}.status == PENDING"
            - "Participant.${p_id}.credited_cents == 0"
            - "Participant.${p_id}.recruit_count == 0"
            - "Participant.${p_id}.team_id == null"

      - name: donation_computed_fee_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Donation.fields.fee_cents, entities.Donation.fields.net_cents, calculations.donation_fee_and_net]
        distinguishing_aspect: "fee_cents, net_cents and matched_amount_cents are computed: a 10000-cent gift always reports fee 820 / net 9180 / matched 0 regardless of any client-supplied value."
        test_recipe:
          setup: ["PUBLISHED campaign and a donor; no match pool."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000, benefit_value_cents: 0 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
          assert:
            - "Donation.${don_id}.fee_cents == 820"
            - "Donation.${don_id}.net_cents == 9180"
            - "Donation.${don_id}.charged_amount_cents == 10000"
            - "Donation.${don_id}.matched_amount_cents == 0"
            - "Donation.${don_id}.match_status == UNMATCHED"

      - name: organization_system_fields_generated_by_server
        claim_type: system_fields
        grounds: [entities.Organization.fields.payout_account_status]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted and payout_account_status starts at UNVERIFIED, never taken from the request body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          assert:
            - "Organization.${org_id}.payout_account_status == UNVERIFIED"
            - "Organization.${org_id}.version == 1"
            - "Organization.${org_id}.id is a UUID with no type prefix"
            - "Organization.${org_id}.created_at is an ISO 8601 UTC timestamp with three fractional digits"

      - name: campaign_list_returns_pagination_envelope
        claim_type: listing
        grounds: [entities.Campaign.fields.organization_id]
        distinguishing_aspect: "GET /api/campaigns?organization_id=...&limit=1&offset=0 returns one row plus total_count 2 and has_more true."
        test_recipe:
          setup: ["One organization owning two DRAFT campaigns."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Campaign A", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_a_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Campaign B", goal_amount_cents: 500000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_b_id: $.data.id }
          trigger:
            - call: "GET /api/campaigns"
              payload: { organization_id: "${org_id}", limit: 1, offset: 0 }
              as: Anonymous
          assert:
            - "response_type == array with exactly 1 element"
            - "total_count == 2"
            - "has_more == true"
            - "limit == 1 and offset == 0"

      - name: donation_invalid_designation_type_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Donation.fields.designation_type", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "designation_type outside {CAMPAIGN, TEAM, PARTICIPANT} returns 400 ERR_INVALID_REQUEST before any referential check runs."
        test_recipe:
          setup: ["PUBLISHED campaign and a donor."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "SPONSOR", designation_id: "${camp_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: event_create_with_unknown_campaign_id_returns_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_CAMPAIGN_NOT_FOUND]", "entities.Event.fields.campaign_id"]
        distinguishing_aspect: "Flat-topology FK integrity: POST /api/events with an unknown campaign_id returns 404 ERR_CAMPAIGN_NOT_FOUND rather than creating an orphan event."
        test_recipe:
          setup: ["One Organization exists; no campaigns."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /api/events"
              payload: { campaign_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", name: "Ghost Run", starts_at: "2026-09-12T14:00:00Z", ends_at: "2026-09-12T16:00:00Z", early_bird_ends_at: "2026-08-01T00:00:00Z", registration_fee_cents: 4000, capacity: 10 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_CAMPAIGN_NOT_FOUND"

      - name: participant_self_referential_recruiter_increments_recruit_count
        claim_type: retrieval
        grounds: [entities.Participant.fields.recruited_by_participant_id, entities.Participant.fields.recruit_count]
        distinguishing_aspect: "The self-referential recruiter FK is discoverable both ways: the recruit stores recruited_by_participant_id and the recruiter's recruit_count reads 1."
        test_recipe:
          setup: ["PUBLISHED campaign with one existing participant acting as recruiter."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
              as: Anonymous
              captures: { recruiter_id: $.data.id }
          trigger:
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Ben Ortiz", recruited_by_participant_id: "${recruiter_id}" }
              as: Anonymous
              captures: { recruit_id: $.data.id }
            - call: "GET /api/participants/${recruiter_id}"
              payload: {}
              as: Anonymous
          assert:
            - "Participant.${recruit_id}.recruited_by_participant_id == ${recruiter_id}"
            - "Participant.${recruiter_id}.recruit_count == 1"
            - "GET /api/participants?recruited_by_participant_id=${recruiter_id} total_count == 1"

  - section: state_machines
    instances:
      - name: campaign_publish_twice_rejected_with_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Campaign.DRAFT_to_PUBLISHED", "errors[ERR_INVALID_STATE]", "validations[priority=6]"]
        distinguishing_aspect: "A second publish on an already PUBLISHED campaign returns 409 ERR_INVALID_STATE and leaves published_at untouched."
        test_recipe:
          setup: ["One PUBLISHED campaign."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Campaign.${camp_id}.status == PUBLISHED"

      - name: registration_check_in_before_event_start_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Registration.CONFIRMED_to_CHECKED_IN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Check-in at the 2026-07-01T00:00:00Z clock default, well before the event's 2026-09-12T14:00:00Z start, returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "PUBLISHED campaign with fundraising_minimum_cents 0 and an event starting 2026-09-12T14:00:00Z."
            - "An ACTIVE participant with a CONFIRMED registration for that event."
            - "Clock still at its 2026-07-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000, fundraising_minimum_cents: 0 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_id}", name: "Autumn 10K Walk", starts_at: "2026-09-12T14:00:00Z", ends_at: "2026-09-12T16:00:00Z", early_bird_ends_at: "2026-08-01T00:00:00Z", registration_fee_cents: 4000, capacity: 10 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { event_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
              as: Anonymous
              captures: { p_id: $.data.id }
            - call: "POST /api/participants/${p_id}/activate"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
            - call: "POST /api/registrations"
              payload: { participant_id: "${p_id}", event_id: "${event_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /api/registrations/${reg_id}/confirm"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /api/registrations/${reg_id}/check-in"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Registration.${reg_id}.status == CONFIRMED"

      - name: campaign_close_cascades_events_and_pools_to_closed
        claim_type: side_effect_execution
        grounds: [state_machines.Campaign.PUBLISHED_to_CLOSED, state_machines.Event.OPEN_to_CLOSED, state_machines.MatchPool.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Closing the campaign flips its OPEN event to CLOSED and its ACTIVE match pool to CLOSED in the same request."
        test_recipe:
          setup: ["PUBLISHED campaign owning one OPEN event and one ACTIVE match pool."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_id}", name: "Autumn 10K Walk", starts_at: "2026-09-12T14:00:00Z", ends_at: "2026-09-12T16:00:00Z", early_bird_ends_at: "2026-08-01T00:00:00Z", registration_fee_cents: 4000, capacity: 10 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { event_id: $.data.id }
            - call: "POST /api/match-pools"
              payload: { campaign_id: "${camp_id}", sponsor_name: "Northline Bank", pool_amount_cents: 50000, match_ratio: 0.5, per_donation_cap_cents: 5000, min_donation_cents: 0, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-08-01T00:00:00Z" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_id: $.data.id }
          trigger:
            - call: "POST /api/campaigns/${camp_id}/close"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
          assert:
            - "Campaign.${camp_id}.status == CLOSED"
            - "Event.${event_id}.status == CLOSED"
            - "MatchPool.${pool_id}.status == CLOSED"

      - name: receipt_void_then_reissue_keeps_receipt_number_and_bumps_reissue_count
        claim_type: cyclic
        grounds: [state_machines.Receipt.ISSUED_to_VOIDED, state_machines.Receipt.VOIDED_to_ISSUED, calculations.receipt_issue]
        distinguishing_aspect: "The Receipt cycle ISSUED -> VOIDED -> ISSUED preserves receipt_number RCPT-000001 while reissue_count goes 0 -> 1 and voided_at is cleared."
        test_recipe:
          setup: ["PUBLISHED campaign with one SETTLED 10000-cent gift, so its receipt is RCPT-000001 in status ISSUED."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/receipts"
              payload: { donation_id: "${don_id}" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { receipt_id: "$.data[0].id", receipt_no: "$.data[0].receipt_number" }
          trigger:
            - call: "POST /api/receipts/${receipt_id}/void"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/receipts/${receipt_id}/reissue"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
          assert:
            - "Receipt.${receipt_id}.receipt_number == RCPT-000001 before and after the cycle"
            - "Receipt.${receipt_id}.status after void == VOIDED"
            - "Receipt.${receipt_id}.status after reissue == ISSUED"
            - "Receipt.${receipt_id}.reissue_count == 1"
            - "Receipt.${receipt_id}.voided_at == null after reissue"
            - "Receipt.${receipt_id}.deductible_amount_cents == 10000"

      - name: donation_settle_twice_rejected_idempotency_guard
        claim_type: idempotency
        grounds: ["state_machines.Donation.PENDING_to_SETTLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second settle on an already SETTLED donation returns 409 ERR_INVALID_STATE and does not mint a second receipt."
        test_recipe:
          setup: ["PUBLISHED campaign with one SETTLED 10000-cent gift."]
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
