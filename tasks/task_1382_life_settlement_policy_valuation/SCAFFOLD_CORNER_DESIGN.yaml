scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: broker_create_defaults_and_readback
        claim_type: creation
        grounds: [entities.Broker]
        distinguishing_aspect: "POST /api/brokers with all required fields returns 201 with status defaulted to ACTIVE and version 1; GET returns the stored row."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "Broker One", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id", b_status: "$.data.status", b_v: "$.data.version" } }
          trigger:
            - { call: "GET /api/brokers/${b_id}", as: CaseManager, captures: { fetched_name: "$.data.name" } }
          assert:
            - "captured b_status == ACTIVE (default applied)"
            - "captured b_v == 1"
            - "captured fetched_name == Broker One"

      - name: policy_defaults_and_computed_contestability
        claim_type: defaults
        grounds: [entities.Policy.fields.cash_value_cents, entities.Policy.fields.policy_loan_cents, entities.Policy.fields.in_contestability]
        distinguishing_aspect: "Omitting cash_value_cents/policy_loan_cents yields 0; in_contestability is computed against the logical clock (issue 2025-01-01 -> true at default clock 2026-08-01), and an input-supplied value is ignored."
        test_recipe:
          setup: ["broker and insured exist"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 20000000, policy_type: "VARIABLE", issue_date: "2025-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { cv: "$.data.cash_value_cents", loan: "$.data.policy_loan_cents", contest: "$.data.in_contestability" } }
          assert:
            - "captured cv == 0 and captured loan == 0 (defaults)"
            - "captured contest == true (2025-01-01 + 24 months = 2027-01-01 > clock 2026-08-01)"

      - name: policy_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Policy.fields.policy_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "policy_type 'TERM' is not a declared enum member and is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["broker and insured exist"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 20000000, policy_type: "TERM", issue_date: "2023-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: insured_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Insured.fields.date_of_birth, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required date_of_birth yields ERR_INVALID_REQUEST and no Insured is persisted."
        test_recipe:
          setup: ["broker exists"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/insureds", payload: { full_name: "P", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: policy_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CaseManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: insured_age_years_tracks_clock
        claim_type: computed_fields
        grounds: [entities.Insured.fields.age_years, calculations.calc_age_years]
        distinguishing_aspect: "age_years is recomputed from the logical clock: DOB 1960-08-02 reads 65 at the default clock 2026-08-01 (birthday not yet reached) and 66 after clock set to 2026-08-02."
        test_recipe:
          setup: ["broker exists; insured DOB 1960-08-02 created without any clock set"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-08-02", state_code: "TX", gender: "F", smoker_status: "NON_TOBACCO", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id", age0: "$.data.age_years" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/insureds/${i_id}", as: CaseManager, captures: { age1: "$.data.age_years" } }
          assert:
            - "captured age0 == 65 (birthday 08-02 not reached at 08-01)"
            - "captured age1 == 66"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Broker]
        distinguishing_aspect: "Client-injected id and version are ignored: server mints its own UUID id and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-9", state_code: "TX", id: "00000000-0000-0000-0000-000000000000", version: 99 }, as: PlatformAdmin, captures: { b_id: "$.data.id", b_v: "$.data.version" } }
          assert:
            - "captured b_id != 00000000-0000-0000-0000-000000000000"
            - "captured b_v == 1"

      - name: fk_policy_insured_missing_returns_404
        claim_type: parent_relationships
        grounds: [entities.Policy.fields.insured_id, "validations[priority=5]"]
        distinguishing_aspect: "A body-supplied FK to a non-existent insured is rejected ERR_NOT_FOUND (404) even though the id is a well-formed UUID."
        test_recipe:
          setup: ["broker exists"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/policies", payload: { insured_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", carrier_name: "C", policy_number: "P-1", face_amount_cents: 20000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: cases_list_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset/has_more/total_count interact: 3 DRAFT cases with limit 2 -> page 1 has 2 rows and has_more true; offset 2 -> 1 row and has_more false; total_count 3 on both."
        test_recipe:
          setup: ["broker, insured, three policies P-1..P-3, three DRAFT cases"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 20000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-2", face_amount_cents: 20000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { p2: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-3", face_amount_cents: 20000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { p3: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases", payload: { policy_id: "${p2}" }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases", payload: { policy_id: "${p3}" }, as: Broker, as_user_id: "${b_id}" }
          trigger:
            - { call: "GET /api/cases?limit=2", as: CaseManager }
            - { call: "GET /api/cases?limit=2&offset=2", as: CaseManager }
          assert:
            - "Page 1: response_type == array, data length 2, meta/pagination shows total_count == 3, has_more == true"
            - "Page 2 (offset 2): data length 1, has_more == false, total_count == 3"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: case_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.PolicyCase.DRAFT_to_SCREENING]
        distinguishing_aspect: "A newly created PolicyCase starts in DRAFT with hold_status CLEAR and version 1."
        test_recipe:
          setup: ["broker, insured, policy"]
          setup_api_calls:
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 20000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 900000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { st: "$.data.status", hold: "$.data.hold_status", v: "$.data.version" } }
          assert:
            - "captured st == DRAFT, hold == CLEAR, v == 1"

      - name: declined_case_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.PolicyCase.UNDERWRITING_to_UW_DECLINED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "UW_DECLINED is terminal: a subsequent withdraw attempt returns ERR_ALREADY_TERMINAL, not a transition."
        test_recipe:
          setup: ["TX chain: case in UNDERWRITING with a delivered tier-A LE report"]
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "DECLINE" }, as: Underwriter, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /api/cases/${c1}/withdraw", payload: {}, as: Broker, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured st == UW_DECLINED"
            - "captured err == ERR_ALREADY_TERMINAL"

      - name: resubmit_rejected_when_not_draft
        claim_type: invalid_transition
        grounds: [state_machines.PolicyCase.DRAFT_to_SCREENING, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "submit is valid only from DRAFT; a second submit on the SCREENING case returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["TX chain: case submitted (SCREENING)"]
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE_TRANSITION"

      - name: screening_rerun_after_policy_fix
        claim_type: valid_transition
        grounds: [state_machines.PolicyCase.SCREEN_FAILED_to_SCREENING, calculations.calc_eligibility_screening]
        distinguishing_aspect: "The SCREEN_FAILED -> SCREENING rerun loop: after the broker amends face 9999999 -> 10000000 via PATCH, a rerun screening passes and the case reaches UNDERWRITING."
        test_recipe:
          setup: ["TX chain: case SCREEN_FAILED because face 9999999"]
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 9999999, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager, captures: { res0: "$.data.result" } }
          trigger:
            - { call: "PATCH /api/policies/${p1}", payload: { face_amount_cents: 10000000 }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager, captures: { res1: "$.data.result" } }
          assert:
            - "captured res0 == FAILED (face below minimum)"
            - "PATCH allowed because the case is not in a locking state"
            - "captured res1 == PASSED; GET /api/cases/${c1}: status == UNDERWRITING; GET /api/cases/${c1}/screenings returns 2 rows"

      - name: offer_expiry_boundary_at_clock
        claim_type: invalid_transition
        grounds: [state_machines.Offer.PENDING_to_EXPIRED, entities.Offer.fields.expires_at]
        distinguishing_aspect: "Offer expiry is strict-greater: at clock == expires_at the offer is still PENDING; one second later it is EXPIRED and terminal."
        test_recipe:
          setup: ["TX chain to MARKETED; offer 6000000 created at default clock 2026-08-01 -> expires_at 2026-08-11T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "C", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id", exp: "$.data.expires_at" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/offers/${o1}", as: CaseManager, captures: { st_at: "$.data.status" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:01Z" }, as: PlatformAdmin }
            - { call: "GET /api/offers/${o1}", as: CaseManager, captures: { st_after: "$.data.status" } }
          assert:
            - "captured exp == 2026-08-11T00:00:00Z"
            - "captured st_at == PENDING (clock == expires_at is not yet expired; rule is clock > expires_at)"
            - "captured st_after == EXPIRED"

      - name: marketing_deadline_auto_expire
        claim_type: valid_transition
        grounds: [state_machines.PolicyCase.MARKETED_to_EXPIRED, entities.PolicyCase.fields.marketing_deadline]
        distinguishing_aspect: "System transition: a MARKETED case whose only offer was WITHDRAWN auto-expires when the clock passes marketed_at + 90 days (2026-08-01 -> deadline 2026-10-30)."
        test_recipe:
          setup: ["TX chain to MARKETED; single offer created then withdrawn by the underwriter"]
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "B", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "P", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "UNKNOWN", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
