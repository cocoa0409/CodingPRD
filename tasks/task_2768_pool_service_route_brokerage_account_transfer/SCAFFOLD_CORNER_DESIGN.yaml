      - name: clock_may_not_move_backwards_but_may_be_set_to_the_same_instant
        claim_type: violation_to_error
        grounds:
          - "validations[priority=64]"
          - "errors.ERR_CLOCK_REWIND"
          - "endpoints[POST /_clock/set_current_utc]"
          - "endpoints[GET /_clock]"
        distinguishing_aspect: "The monotonicity rule is >=, so re-setting the clock to its CURRENT value is legal and only a strictly earlier instant is refused -- and the accepted no-op still reports previous_utc equal to current_utc, which is how a caller can tell the write happened."
        test_recipe:
          setup:
            - "The logical clock has been set to 2026-08-01T00:00:00Z and nothing else exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-07-31T23:59:59Z"}
              as: PlatformAdmin
            - call: "GET /_clock"
              as: Broker
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-02T00:00:00Z"}
              as: PlatformAdmin
            - call: "GET /_clock"
              as: Broker
          assert:
            - "one second earlier: HTTP 422, data.error_id == \"ERR_CLOCK_REWIND\"."
            - "GET /_clock after the refusal: current_utc == \"2026-08-01T00:00:00Z\" -- unchanged."
            - "the same instant again: HTTP 200, data.current_utc == \"2026-08-01T00:00:00Z\" and data.previous_utc == \"2026-08-01T00:00:00Z\"."
            - "one day later: HTTP 200, data.current_utc == \"2026-08-02T00:00:00Z\" and data.previous_utc == \"2026-08-01T00:00:00Z\"."
            - "final GET /_clock: current_utc == \"2026-08-02T00:00:00Z\"."

      - name: second_profile_for_the_same_state_code_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=68]"
          - "errors.ERR_DUPLICATE_STATE_PROFILE"
          - "entities.StateLicenseProfile.fields.state_code"
          - "endpoints[POST /state-license-profiles]"
        distinguishing_aspect: "state_code uniqueness is enforced across the whole table and is independent of the rest of the body: a second AZ profile with completely different permits and windows is a 409, while an NV profile carrying the SAME permit list is a 201 -- so the collision key is the state alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One AZ StateLicenseProfile exists (PESTICIDE_APPLICATOR + BUSINESS_TAX, reciprocity [NV], 21 processing days, 14 cooling-off days, no provisional operation)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
          trigger:
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["CONTRACTOR"], "reciprocity_states": [], "transfer_processing_days": 5, "cooling_off_days": 1, "provisional_operation_allowed": true}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "NV", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["AZ"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"nv_profile_id": "$.data.id"}
            - call: "GET /state-license-profiles"
              as: PlatformAdmin
          assert:
            - "second AZ profile: HTTP 409, data.error_id == \"ERR_DUPLICATE_STATE_PROFILE\"."
            - "NV profile with the identical permit list: HTTP 201."
            - "GET /state-license-profiles: total_count == 2 and the AZ row still has transfer_processing_days == 21 and required_permit_types == [\"PESTICIDE_APPLICATOR\", \"BUSINESS_TAX\"] -- the rejected write did not overwrite it."

