              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "F-3001", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-01T00:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe1: $.data.id }
            - call: "POST /wind-ops/fault-events/${fe1}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe1}/remote-reset"
              payload: { reset_outcome: "FAILED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe1}/remote-reset"
              payload: { reset_outcome: "SUCCEEDED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T23:59:59Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-01T23:59:59Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe2: $.data.id }
            - call: "POST /wind-ops/fault-events/${fe2}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe2}/remote-reset"
              payload: { reset_outcome: "SUCCEEDED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbines/${t_id}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-02T00:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe3: $.data.id }
            - call: "POST /wind-ops/fault-events/${fe3}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
