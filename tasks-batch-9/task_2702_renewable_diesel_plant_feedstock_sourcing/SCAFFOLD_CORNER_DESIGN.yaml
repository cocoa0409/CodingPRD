      - name: yield_variant_divergence_on_one_charge
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: run_yield_provisional_vs_final_on_same_charge
          rationale: "That §1.8 instance already asserts both variants of run_yield_split on the same charge (provisional 82.000 with the activity and SAF penalty, final 80.000 from measured mass) plus the -2.000 variance, which is the divergence claim in full."

      - name: credit_variant_selection_by_lifecycle_stage
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: lcfs_credit_provisional_vs_verified_at_identical_ci
          rationale: "That §1.8 instance shows the PROVISIONAL variant selected at credit-block creation and the VERIFIED variant selected at the verification decision, diverging (547.171 vs 536.228) even when verified_ci equals provisional_ci."

      - name: verified_quantities_reconcile_against_provisional
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: second_adjusted_verification_suspends_pathway_and_blocks_sibling_block
          rationale: "That §1.8 instance reconciles verified quantities against the provisional ones across two blocks and asserts the resulting pathway-level outstanding balance, covering the reconciliation claim."

      - name: forward_looking_provisional_yield_at_securement
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: run_yield_provisional_vs_final_on_same_charge
          rationale: "The forward-looking algorithm row is run_yield_split's PROVISIONAL variant, which that §1.8 instance stamps at securement together with planned_total 328.000 / planned_saf 30.832 / planned_rd 297.168."

      - name: tiered_margin_pricing_on_hedge_positions
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: hedge_margin_tier_selected_from_base_not_total
          rationale: "That §1.8 instance drives hedge_margin_requirement across the T1/T2 tier boundary at exactly 50000.00 base margin and asserts both sides (51250.00 vs 50499.19), covering the tiered-pricing row."

      - name: weighted_scoring_of_lcfs_credit_quantity
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: lcfs_credit_provisional_vs_verified_at_identical_ci
          rationale: "lcfs_credit_quantity is the weighted_scoring algorithm; that §1.8 instance asserts its benchmark, EER, energy-density and discount weights end to end at three decimals."

      - name: interval_merge_of_hydrogen_commitments
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: hydrogen_nominations_collide_on_the_shared_inclusive_end_day
          rationale: "hydrogen_committed_capacity is the interval_merge algorithm; that §1.8 instance asserts the per-day merge on the shared inclusive endpoint day and the ERR_HYDROGEN_CAPACITY_EXCEEDED refusal."

      - name: settlement_cost_rounds_per_line_before_summing
        claim_type: Precision
        excluded_because:
          difficulty_instance: feedstock_settlement_round_per_line_then_sum
          rationale: "That §1.8 instance asserts the per-line rounding order of feedstock_settlement_cost (37958.39 + 43336.87 + 48365.73 = 129660.99, not the sum-then-round 129661.00)."

