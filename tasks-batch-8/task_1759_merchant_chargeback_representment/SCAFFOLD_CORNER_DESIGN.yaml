            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-OC1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb1: $.data.id }
          trigger:
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-OC2", reason_code: "10.4", amount_cents: 10000 }
              captures: { err: $.data.error_id }
            - { call: "POST /acquirer/chargebacks/${cb1}/reverse", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-OC3", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb3_case: $.data.case_status }
          assert:
            - "err == ERR_TRANSACTION_HAS_OPEN_CHARGEBACK while NC-OC1 is RECEIVED"
            - "cb3_case == RECEIVED after the first case was REVERSED (terminal states release the gate)"
            - "note: reversal leaves the transaction CHARGED_BACK, but the not-chargebackable check rejects only REFUNDED sales"

      - name: chargeback_amount_exceeds_transaction_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - "errors[ERR_CHARGEBACK_AMOUNT_EXCEEDS_TRANSACTION]"
        distinguishing_aspect: "amount_cents <= transaction amount: 10001 against a 10000 sale fails ERR_CHARGEBACK_AMOUNT_EXCEEDS_TRANSACTION, while a 6000 partial chargeback succeeds."
        test_recipe:
          setup: ["merchant with two 10000-cent sales"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Amt M", merchant_category_code: "5411", reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-2", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
          trigger:
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-AM1", reason_code: "10.4", amount_cents: 10001 }
              captures: { err: $.data.error_id }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-2", network_case_id: "NC-AM2", reason_code: "10.4", amount_cents: 6000 }
              captures: { partial_case: $.data.case_status, partial_amt: $.data.amount_cents }
          assert:
            - "err == ERR_CHARGEBACK_AMOUNT_EXCEEDS_TRANSACTION (10001 > 10000)"
            - "partial_case == RECEIVED and partial_amt == 6000 (partial chargebacks are legal)"

      - name: evidence_attach_wrong_chargeback_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - "errors[ERR_EVIDENCE_NOT_ATTACHABLE]"
        distinguishing_aspect: "A packet may only reference DRAFT evidence of ITS OWN chargeback: pointing at a sibling case's document fails ERR_EVIDENCE_NOT_ATTACHABLE."
        test_recipe:
          setup: ["two notified chargebacks; evidence item uploaded against cb2"]
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
