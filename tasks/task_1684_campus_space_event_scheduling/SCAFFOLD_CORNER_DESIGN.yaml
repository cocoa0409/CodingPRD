            - { call: "POST /campus/event-reservations/${e3}/approve", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
