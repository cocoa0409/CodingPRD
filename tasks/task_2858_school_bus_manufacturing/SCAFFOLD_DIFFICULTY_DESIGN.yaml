              captures: { err_mixed: $.data.error_id }
          assert:
            - "the BRAKE window [2026-09-17, 2026-09-18] returns 409 ERR_TEST_BAY_CONFLICT: it touches the existing [2026-09-15, 2026-09-17] on its last day, and closed windows collide on a shared endpoint"
            - "the BRAKE window [2026-09-18, 2026-09-19] is accepted — one day clear of the predecessor"
            - "two ELECTRICAL tests sharing 2026-09-21 are both accepted (pairwise sharing is legal under priority 51)"
            - "the third overlapping ELECTRICAL test returns 409 ERR_BAY_CONCURRENCY_LIMIT: the aggregate ceiling max_concurrent_electrical 2 trips even though every individual pairing is permitted"
            - "the EMERGENCY_EXIT test on the same 2026-09-21 returns 409 ERR_TEST_BAY_CONFLICT — a non-ELECTRICAL test never shares, not even with an ELECTRICAL one"
            - "only two QualityTests exist in bay ${bay_2_id} on 2026-09-21, both ELECTRICAL and both SCHEDULED"
            - "the build-slot calendar on line L-C1 used end-exclusive adjacency for the very same units, so the two window conventions are exercised side by side"

  - rule_id: compensating_invariant
    instances:

      - name: line_slot_day_ledger_returns_to_pre_commit_value_on_release
        grounds:
          - calculations.line_capacity_ledger
          - state_machines.BuildSlot.PLANNED_to_COMMITTED
          - state_machines.BuildSlot.COMMITTED_to_RELEASED
          - state_machines.BusUnit.SLOTTED_to_PLANNED
          - entities.ProductionLine.fields.committed_slot_days
        distinguishing_aspect: |
          committed_slot_days is an incrementally maintained ledger that must always equal the from-scratch
          recomputation over the line's non-RELEASED-and-non-PLANNED slots, so a commit followed by the
          release of that same slot must return the line to exactly 0 — not to 7, and not to a negative
          value if release is applied twice. The bus and its tests are restored with it, while the line's
          version keeps climbing.
        test_recipe:
          setup:
            - "TYPE_C_CONV + DSL-100, PUBLISHED TX 2026-2027 profile, a 1-unit order promised 2026-12-01 with its BusUnit minted"
            - "ProductionLine L-D1 (horizon 30 slot-days) at committed_slot_days 0"
            - "A PLANNED slot [2026-09-07, 2026-09-14) with slot_days 7"
            - "A SCHEDULED EMERGENCY_EXIT test for the unit, created after the commit"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /solicitations"
              payload: { solicitation_code: "SOL-TX-007", buyer_type: "DISTRICT", buyer_name: "Tyler ISD", spec_profile_id: "${tx_id}", unit_count: 1, required_delivery_date: "2026-12-01", price_cap_cents_per_unit: 20000000 }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { sol_tx_id: $.data.id }
            - call: "POST /bids"
              payload: { solicitation_id: "${sol_tx_id}", bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", unit_count: 1, offered_seat_capacity: 71, offered_emergency_exit_count: 5, offered_mirror_config: "CROSSVIEW", offered_lap_shoulder_belts: false, offered_eight_lamp_system: true, offered_crossing_arm: true, offered_rollover_reinforcement: false }
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { bid_tx_id: $.data.id }
            - call: "POST /bids/${bid_tx_id}/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
            - call: "POST /solicitations/${sol_tx_id}/close"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
            - call: "POST /bids/${bid_tx_id}/award"
              payload: { promised_delivery_date: "2026-12-01" }
              as: ContractsAdmin
              as_user_id: "contracts-02"
              captures: { order_tx_id: $.data.id }
            - call: "POST /contract-orders/${order_tx_id}/units"
              payload: { vin: "1TXDSL0000000501" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { unit_tx_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "L-D1", plant_code: "PLANT-D", supported_body_classes: ["TYPE_C"], horizon_slot_day_capacity: 30, changeover_buffer_days: 3 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { line_d1_id: $.data.id, line_v0: $.data.version, days_before: $.data.committed_slot_days }
            - call: "POST /build-slots"
              payload: { expected_production_line_version: "${line_v0}", production_line_id: "${line_d1_id}", bus_unit_id: "${unit_tx_id}", start_date: "2026-09-07", end_date: "2026-09-14" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { slot_id: $.data.id, slot_days: $.data.slot_days }
            - call: "POST /test-bays"
              payload: { bay_code: "TB-3", plant_code: "PLANT-D", supported_test_types: ["BRAKE", "EMERGENCY_EXIT", "ELECTRICAL"], max_concurrent_electrical: 1 }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { bay_3_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${slot_id}/commit"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { slot_status_committed: $.data.status }
            - call: "GET /production-lines/${line_d1_id}"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { days_after_commit: $.data.committed_slot_days }
            - call: "POST /quality-tests"
              payload: { bus_unit_id: "${unit_tx_id}", test_bay_id: "${bay_3_id}", test_type: "EMERGENCY_EXIT", window_start: "2026-09-16", window_end: "2026-09-16" }
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { test_id: $.data.id }
            - call: "POST /build-slots/${slot_id}/release"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { slot_status_released: $.data.status }
            - call: "GET /production-lines/${line_d1_id}"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { days_after_release: $.data.committed_slot_days }
          assert:
            - "committed_slot_days is 0 before the commit, 7 after the commit and exactly 0 again after the release (line_slot_day_conservation)"
            - "BuildSlot.${slot_id}.status == RELEASED and BuildSlot.${slot_id}.slot_days is still 7 (the slot keeps its size; it just stops counting)"
            - "BusUnit.${unit_tx_id}.production_status goes PLANNED -> SLOTTED -> PLANNED and QualityTest.${test_id}.status == VOIDED after the release"
            - "ProductionLine.${line_d1_id}.version incremented on the slot create, on the commit and on the release (three writes), so the ledger returning to 0 is not a rollback of the row"
            - "the from-scratch recomputation over the line's slots also yields 0 — no RELEASED slot contributes"
            - "ContractOrder.${order_tx_id}.delivery_posture is recomputed on both the commit and the release"

      - name: recall_kit_pool_conserved_across_completion_and_cancellation
        grounds:
          - entities.RecallCampaign.fields.available_kits
          - entities.RecallCampaign.fields.reserved_kits
          - entities.RecallCampaign.fields.consumed_kits
          - state_machines.RemedyTask.OPEN_to_COMPLETED
          - state_machines.RemedyTask.OPEN_to_CANCELLED
          - state_machines.RecallCampaign.LAUNCHED_to_COMPLETED
          - calculations.dealer_recall_exposure
        distinguishing_aspect: |
          The kit pool has three buckets that must always sum to total_kits, and the two terminal task
          transitions compensate differently: completion moves kits from reserved to consumed (available
          unchanged), cancellation moves them from reserved back to available (consumed unchanged). The
          escalation kit reserved by CASCADE-B hop 4 must travel with its task, so a cancelled escalated
          task returns 2 kits, not 1.
        test_recipe:
          setup:
            - "The CASCADE-B fixture: dealer D-TX-01 with two legacy DIESEL units and campaign RC-DSL-01 (kits_per_unit 1, total_kits 5) LAUNCHED"
            - "After launch both tasks are FACTORY_DIRECTED with kits_reserved 2 each: reserved_kits 4, available_kits 1, consumed_kits 0"
            - "Task ids read in creation order from the campaign's task list"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { pkg_dsl_id: $.data.id }
            - call: "POST /state-spec-profiles"
              payload: { state_code: "TX", school_year: "2026-2027", min_seat_capacity: 71, min_emergency_exit_count: 5, min_joint_strength_kn: 55.0, required_route_range_mi: 400.0, requires_eight_lamp_system: true, requires_crossing_arm: true, required_mirror_config: "CROSSVIEW", terrain_class: "FLAT" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { tx_id: $.data.id }
            - call: "POST /state-spec-profiles/${tx_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "POST /dealers"
              payload: { dealer_code: "D-TX-01", dealer_name: "Lone Star Bus Sales", licensed_state_codes: ["TX", "OK"], training_capacity_per_month: 20 }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { dealer_tx_id: $.data.id }
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000009101", delivered_at: "2026-05-10T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { legacy_1_id: $.data.id }
            - call: "POST /dealers/${dealer_tx_id}/legacy-fleet-records"
              payload: { bus_model_id: "${model_c_id}", propulsion_package_id: "${pkg_dsl_id}", spec_profile_id: "${tx_id}", vin: "1TXDSL0000009102", delivered_at: "2026-06-02T00:00:00Z" }
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { legacy_2_id: $.data.id }
            - call: "POST /recall-campaigns"
              payload: { campaign_code: "RC-DSL-01", affected_bus_model_id: "${model_c_id}", affected_propulsion_type: "DIESEL", defect_category: "BRAKE_LINE_CORROSION", build_window_start: "2026-01-01", build_window_end: "2026-07-31", kits_per_unit: 1, total_kits: 5 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { campaign_id: $.data.id }
            - call: "POST /recall-campaigns/${campaign_id}/launch"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { reserved_after_launch: $.data.reserved_kits, available_after_launch: $.data.available_kits }
            - call: "GET /remedy-tasks"
              payload: { recall_campaign_id: "${campaign_id}" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { task_1_id: "$.data[0].id", task_1_kits: "$.data[0].kits_reserved", task_2_id: "$.data[1].id" }
          trigger:
            - call: "POST /remedy-tasks/${task_1_id}/start"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_tx_id}"
              captures: { task_1_status: $.data.status }
            - call: "POST /remedy-tasks/${task_1_id}/complete"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_tx_id}"
            - call: "GET /recall-campaigns/${campaign_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { reserved_mid: $.data.reserved_kits, consumed_mid: $.data.consumed_kits, available_mid: $.data.available_kits }
            - call: "POST /remedy-tasks/${task_2_id}/cancel"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
            - call: "GET /recall-campaigns/${campaign_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { reserved_end: $.data.reserved_kits, consumed_end: $.data.consumed_kits, available_end: $.data.available_kits, campaign_status_end: $.data.status }
          assert:
            - "after launch: reserved_kits 4, consumed_kits 0, available_kits 1 — sum 5 == total_kits"
            - "start moves the task to IN_PROGRESS and changes no kit counter (reserved 4 / consumed 0 / available 1)"
            - "after completing the first task: reserved_kits 2, consumed_kits 2, available_kits 1 — sum still 5; available_kits did NOT move"
            - "after cancelling the second task: reserved_kits 0, consumed_kits 2, available_kits 3 — sum still 5; consumed_kits did NOT move"
            - "the cancelled task returned 2 kits, not 1, because its FACTORY_DIRECTED escalation kit travelled with it"
            - "RecallCampaign.${campaign_id}.status == COMPLETED once both tasks are terminal, with reserved_kits 0 and available_kits == total_kits - consumed_kits == 3"
            - "BusUnit.${legacy_1_id}.service_status == RECALL_CLOSED (completed) while BusUnit.${legacy_2_id}.service_status == NONE (cancelled, no completed task)"
            - "Dealer.${dealer_tx_id}.open_recall_unit_count == 0 and certification_standing == GOOD, but both tasks keep escalation_level FACTORY_DIRECTED (escalation is one-way)"
