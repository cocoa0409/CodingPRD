            - call: "POST /attendance-weeks/${w38_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w37_id}/amend"
              payload: { amendment_reason: "late badge export" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t1_id}", allocated_seats: 1, window_start_week: "2026-W41", window_end_week: "2026-W43", expected_neighborhood_version: "${n1_v2}" }
              as: WorkplaceProgramOffice
          assert:
            - "PolicyCycle.${cyc_id}.posture == LOCKED after call 1"
            - "Fan-out A: Neighborhood.${n1_id}.allocation_state == FROZEN even though utilization_pct is still 0.00 - FROZEN is derived from the parent posture, not from load"
            - "Fan-out B: AttendanceWeek.${w37_id}.status == LOCKED while AttendanceWeek.${w38_id}.status is still OPEN (only FINALIZED weeks were swept)"
            - "Call 2 returns HTTP 409 with error id ERR_CYCLE_LOCKED, not ERR_NEIGHBORHOOD_CAPACITY_EXCEEDED and not ERR_ALLOCATION_NOT_RESERVED; SeatAllocation.${alloc_a}.status is still RESERVED"
            - "Call 3 returns HTTP 409 with error id ERR_CYCLE_LOCKED, not ERR_WEEK_NOT_OPEN - the week IS open, the cycle is not"
            - "Call 4 returns HTTP 409 with error id ERR_CYCLE_LOCKED even though ${w37_id} is now LOCKED and no longer FINALIZED - band 44 is checked before the band-50 ERR_WEEK_NOT_FINALIZED rule"
            - "Call 5 returns HTTP 409 with error id ERR_CYCLE_LOCKED even though ${n1_v2} is the current Neighborhood version, so the band-40 OCC check would have passed"
            - "Employee.${e1_id}.cumulative_shortfall_days still counts the LOCKED week ${w37_id}, so locking does not erase the compliance history"

      - name: auto_desk_requires_committed_allocation_of_the_employees_own_team
        grounds:
          - calculations.desk_selector
