  - rule_id: cross_entity_state_dependency
    instances:
      - name: bond_issuance_waits_on_the_regulatory_agreement_reaching_recorded
        grounds:
          - validations[priority=85]
          - errors[ERR_REG_AGREEMENT_NOT_RECORDED]
          - state_machines.RegulatoryAgreement.DRAFT_to_RECORDED
          - state_machines.BondIssue.DRAFT_to_ISSUED
          - endpoints[POST /bond-issues/{id}/issue]
        distinguishing_aspect: |
          The gating state lives on a DIFFERENT entity than the one being
          transitioned and is written by a DIFFERENT role: the trustee's
          issuance of a BondIssue in DRAFT depends on the compliance officer
          having moved the project's RegulatoryAgreement out of DRAFT into
          RECORDED. Nothing about the bond, the award or the project changes
          between the refused call and the accepted one - only the sibling
          agreement's status - and the same request body then succeeds.
        test_recipe:
          setup:
            - "Canonical developer, cap pool with total_cap_cents 600,000,000 and project with 10 units (four RESTRICTED at ami 60, six MARKET), so set_aside_satisfied is true and designated_unit_count equals total_units."
            - "A RegulatoryAgreement is created for the project electing MIN_40_60 with 15 and 30 years but is deliberately LEFT IN DRAFT."
            - "Cap is awarded for 200,000,000 and a BondIssue is created from eligible 190,000,000 plus capitalized interest 6,000,000, so par_amount_cents is 200,000,000 and the provisional fifty-percent ratio would be exactly 5000 bps."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
