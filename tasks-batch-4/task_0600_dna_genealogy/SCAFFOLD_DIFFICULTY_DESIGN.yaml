            - call: "POST /dna/customers"
              payload: { email: "l@dna.test", display_name: "Lee" }
              as: PlatformAdmin
              captures: { cL: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cL}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cL}"
              captures: { subL: $.data.id }
            - call: "POST /dna/kits"
              payload: { customer_id: "${cL}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cL}"
              captures: { kL: $.data.id, bcL: $.data.barcode }
            - call: "POST /dna/kits/${kL}/activate"
              payload: { barcode: "${bcL}" }
              as: Customer
              as_user_id: "${cL}"
            - call: "POST /dna/kits/${kL}/receive"
              payload: {}
              as: LabTechnician
              captures: { sL: $.data.id }
            - call: "POST /dna/samples/${sL}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-5", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sL}"] }
              as: LabTechnician
              captures: { bat: $.data.id }
            - call: "POST /dna/lab-batches/${bat}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${bat}/finalize"
              payload: { sample_results: [ { sample_id: "${sL}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2] } ] }
              as: LabTechnician
            - call: "POST /dna/subscriptions/${subL}/billing-event"
              payload: { event_type: "PAYMENT_FAILED" }
              as: PlatformAdmin
            - call: "POST /dna/subscriptions/${subL}/billing-event"
              payload: { event_type: "PAYMENT_FAILED" }
              as: PlatformAdmin
            - call: "GET /dna/customers/${cL}"
              payload: {}
              as: Customer
              as_user_id: "${cL}"
              captures: { cvL: $.data.version }
          trigger:
            - call: "POST /dna/customers/${cL}/reports"
              payload: { report_type: "HEALTH_TRAIT", variant: "PROVISIONAL", expected_customer_version: "${cvL}" }
              as: Customer
              as_user_id: "${cL}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_CONSENT_REQUIRED"
            - "Subscription.${subL}.access_status == LOCKED (unchanged)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
