        excluded_because:
          difficulty_instance: plan_approve_requires_case_plan_drafting
          rationale: "The case-state precondition on plan approval is the named §1.8 cross-entity dependency instance."

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: risk_score_moderate_band_correct_result
        claim_type: correct_result
        grounds:
          - "calculations.triage_risk_score"
        distinguishing_aspect: "Known inputs through the INITIAL formula: uniform 10s produce exactly 40.0 and the MODERATE band (30 <= 40.0 < 60)."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 INTAKE"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0012", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 10, harm_to_others: 10, academic_disruption: 10, substance_involvement: 10, rationale: "uniform" }, as: BITChair, as_user_id: "${chair}", captures: { sc_score: $.data.score, sc_tier: $.data.tier } }
          assert:
            - "score == 40.0 (4*(0.35*10+0.35*10+0.15*10+0.15*10) = 4*10) and tier == MODERATE"

      - name: cadence_constants_applied_high_tier
        claim_type: constants_applied
        grounds:
          - "calculations.followup_cadence_schedule"
        distinguishing_aspect: "HIGH tier cadence constant is exactly 7 days: the first check-in after approval at the default clock is due 2026-08-08T00:00:00Z."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 triaged HIGH (62.0); plan p1 approved at default clock"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0013", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}", captures: { sc_tier: $.data.tier } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1_due: "$.data[0].due_at" } }
          assert:
            - "tier == HIGH, so the SCHEDULED check-in's due_at == 2026-08-08T00:00:00Z (approval at 2026-08-01T00:00:00Z + CADENCE_HIGH_DAYS 7)"

      - name: missed_checkin_grace_boundary
        claim_type: correct_result
        grounds:
          - "calculations.followup_cadence_schedule"
          - "state_machines.FollowUpCheckin.SCHEDULED_to_MISSED"
        distinguishing_aspect: "MISSED fires only when now > due_at + 1 day: at exactly due+1d the check-in is still SCHEDULED; one second later it is MISSED with a successor due missed.due_at + 30 days."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 PLAN_ACTIVE LOW; k1 completed STABLE at 2026-08-01 (streak 1); successor k2 due 2026-08-31T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0014", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k2: "$.data[0].id", k2_due: "$.data[0].due_at" } }
          trigger:
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /bit/follow-up-checkins/${k2}", as: BITChair, as_user_id: "${chair}", captures: { k2_at_grace: $.data.status } }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:01Z" }, as: SystemAdmin }
            - { call: "GET /bit/follow-up-checkins/${k2}", as: BITChair, as_user_id: "${chair}", captures: { k2_after: $.data.status } }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k3_due: "$.data[0].due_at" } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { streak: $.data.consecutive_stable_checkins } }
          assert:
            - "k2.due_at == 2026-08-31T00:00:00Z; at now == 2026-09-01T00:00:00Z (exactly due_at + GRACE_DAYS) k2 is still SCHEDULED — the rule is strictly-greater"
            - "at now == 2026-09-01T00:00:01Z k2 is MISSED"
            - "successor k3 due_at == 2026-09-30T00:00:00Z (missed due_at + 30 days) and consecutive_stable_checkins == 0 (MISSED resets the streak)"

      - name: trend_report_empty_window_all_zeros
        claim_type: correct_result
        grounds:
          - "calculations.trend_report_metrics"
          - "calculations.trend_category_distribution"
        distinguishing_aspect: "Empty input set is defined: a window containing no cases yields total_cases 0, closure_rate_pct 0.0, avg_days_to_close 0.0, and an all-zero distribution (no division-by-zero)."
        test_recipe:
          setup: ["empty DB (no cases at all)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bit/trend-reports", payload: { term_code: "2026-SPRING", window_start: "2026-01-01T00:00:00Z", window_end: "2026-05-31T23:59:59Z", variant: ENTRY_COHORT }, as: SystemAdmin, captures: { tr: $.data.id, tr_total: $.data.total_cases, tr_rate: $.data.closure_rate_pct, tr_avg: $.data.avg_days_to_close } }
          assert:
            - "TrendReport.${tr}: total_cases == 0, closed_in_window == 0, closure_rate_pct == 0.0, avg_days_to_close == 0.0"
            - "category_distribution == {ACADEMIC_DISTRESS: 0.0, BEHAVIORAL_THREAT: 0.0, SELF_HARM_RISK: 0.0, SUBSTANCE_CONCERN: 0.0, WELLBEING_GENERAL: 0.0}"

      - name: trend_window_includes_boundary_created_case
        claim_type: input_set_filtering
        grounds:
          - "calculations.trend_report_metrics"
        distinguishing_aspect: "The window is closed on both ends: a case created exactly at window_end is included in ENTRY_COHORT; one created one second after is excluded."
        test_recipe:
          setup: ["clock at 2026-08-31T23:59:59Z; staff chair/cm/rep; case cIn created exactly then; clock at 2026-09-01T00:00:00Z; case cOut created then"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T23:59:59Z" }, as: SystemAdmin }
            - { call: "POST /bit/students", payload: { external_ref: "S0015", full_name: "Stu In" }, as: SystemAdmin, captures: { sin: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${sin}", category: ACADEMIC_DISTRESS, narrative: "in", observed_at: "2026-08-31T20:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { rin: $.data.id } }
            - { call: "POST /bit/concern-reports/${rin}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${rin}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { cIn: $.data.care_case_id } }
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /bit/students", payload: { external_ref: "S0016", full_name: "Stu Out" }, as: SystemAdmin, captures: { sout: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${sout}", category: ACADEMIC_DISTRESS, narrative: "out", observed_at: "2026-09-01T00:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { rout: $.data.id } }
            - { call: "POST /bit/concern-reports/${rout}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${rout}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { cOut: $.data.care_case_id } }
          trigger:
            - { call: "POST /bit/trend-reports", payload: { term_code: "2026-FALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T23:59:59Z", variant: ENTRY_COHORT }, as: SystemAdmin, captures: { tr_total: $.data.total_cases } }
          assert:
            - "total_cases == 1 — case ${cIn} (created_at exactly == window_end) is included; case ${cOut} (window_end + 1s) is excluded"

  # ============================================================ validations
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers fails auth before any role, existence, or business check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /bit/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SystemAdmin, omit_headers: true, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400) even though the id would 404 — auth outranks existence"

      - name: reporter_cannot_score_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
          - "roles[BITChair]"
        distinguishing_aspect: "POST /bit/risk-scorings is BITChair-exclusive; a Reporter caller is rejected with 403 before existence/state checks."
        test_recipe:
          setup: ["staff rep (FACULTY_AFFAIRS)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", mode: INITIAL, harm_to_self: 1, harm_to_others: 1, academic_disruption: 1, substance_involvement: 1, rationale: "x" }, as: Reporter, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403) — role check beats the nonexistent case_id"

      - name: privacy_scope_insufficient_without_grant
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_PRIVACY_SCOPE_INSUFFICIENT]"
        distinguishing_aspect: "A Reporter (office FACULTY_AFFAIRS, no role-based access) reading a case without any APPROVED grant is denied 403."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 INTAKE"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0017", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
          trigger:
            - { call: "GET /bit/care-cases/${c1}", as: Reporter, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRIVACY_SCOPE_INSUFFICIENT (HTTP 403) — Reporter has no implicit case access and no grant"

      - name: summary_only_grant_yields_redacted_view
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority=6]"
          - "entities.DisclosureGrant.fields.scope"
        distinguishing_aspect: "An APPROVED SUMMARY_ONLY grant for the caller's office passes the privacy check but returns the redacted view: only id, student_id, status, current_risk_tier, current_risk_score are populated."
        test_recipe:
          setup: ["staff chair/cm/rep/po; student s1; case c1 INTAKE; SUMMARY_ONLY grant to FACULTY_AFFAIRS [2026-08-01, 2026-09-01) APPROVED"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Privacy One", office: PRIVACY_OFFICE }, as: SystemAdmin, captures: { po: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0018", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/disclosure-grants", payload: { case_id: "${c1}", to_office: FACULTY_AFFAIRS, scope: SUMMARY_ONLY, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", purpose: "faculty follow-up" }, as: CaseManager, as_user_id: "${cm}", captures: { g1: $.data.id } }
            - { call: "POST /bit/disclosure-grants/${g1}/approve", as: PrivacyOfficer, as_user_id: "${po}" }
          trigger:
            - { call: "GET /bit/care-cases/${c1}", as: Reporter, as_user_id: "${rep}", captures: { v_id: $.data.id, v_status: $.data.status, v_mgr: $.data.assigned_case_manager_id } }
          assert:
            - "200 OK: data.id == ${c1} and data.status == INTAKE"
            - "redacted view: data.assigned_case_manager_id is null and data.opened_from_report_id is null (summary fields only)"

      - name: assessment_due_window_boundary
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_ASSESSMENT_DUE_WINDOW_VIOLATION]"
        distinguishing_aspect: "due_at <= now + 14 days is inclusive: exactly +14d succeeds; +14d plus one second fails."
        test_recipe:
          setup: ["staff chair/cm/rep/ev; students s1/s2; cases c1 and c2 both PLAN_ACTIVE (HIGH)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0019", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0020", full_name: "Stu Two" }, as: SystemAdmin, captures: { s2: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv1: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv1}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s2}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r2: $.data.id } }
            - { call: "POST /bit/concern-reports/${r2}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r2}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c2: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c2}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c2}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c2}", expected_case_version: "${cv2}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p2: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p2}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p2}/approve", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-15T00:00:00Z", rationale: "exactly +14d" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id, a1_status: $.data.status } }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c2}", evaluator_id: "${ev}", due_at: "2026-08-15T00:00:01Z", rationale: "one second past" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "due_at == now + 14 days exactly (2026-08-15T00:00:00Z at default clock): order succeeds, assessment SCHEDULED"
            - "due_at == now + 14d + 1s: error_id == ERR_ASSESSMENT_DUE_WINDOW_VIOLATION (HTTP 422)"

      - name: evaluator_same_as_orderer_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_EVALUATOR_SAME_AS_ORDERER]"
        distinguishing_aspect: "Order-time guard: the assigned evaluator must not be the ordering chair — preventing an unresolvable segregation conflict at record-outcome time."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 PLAN_ACTIVE (HIGH)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0021", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${chair}", due_at: "2026-08-10T00:00:00Z", rationale: "self-assigned" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVALUATOR_SAME_AS_ORDERER (HTTP 400)"

      - name: conditions_required_on_reentry_approval
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_CONDITIONS_REQUIRED]"
          - "entities.ReentryEvaluation.fields.conditions"
        distinguishing_aspect: "APPROVED_WITH_CONDITIONS with a missing/empty conditions array is rejected; the evaluation stays PENDING."
        test_recipe:
          setup: ["full leave path: case c1 ON_LEAVE (GRANT_LEAVE by dean); re-entry evaluation ev1 PENDING"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Dean One", office: DEAN_OF_STUDENTS }, as: SystemAdmin, captures: { dean: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Dean Two", office: DEAN_OF_STUDENTS }, as: SystemAdmin, captures: { dean2: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0022", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "mandate" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
            - { call: "POST /bit/mandated-assessments/${a1}/record-outcome", payload: { outcome: NOT_CLEARED, findings_summary: "not cleared" }, as: CounselingEvaluator, as_user_id: "${ev}" }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld1: "$.data[0].id" } }
            - { call: "POST /bit/leave-decisions/${ld1}/decide", payload: { decision: GRANT_LEAVE, rationale: "safety" }, as: DeanOfStudents, as_user_id: "${dean}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version } }
            - { call: "POST /bit/reentry-evaluations", payload: { case_id: "${c1}", expected_case_version: "${cv2}", petition_summary: "ready" }, as: CaseManager, as_user_id: "${cm}", captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /bit/reentry-evaluations/${ev1}/decide", payload: { outcome: APPROVED_WITH_CONDITIONS, rationale: "no conditions attached" }, as: DeanOfStudents, as_user_id: "${dean2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONDITIONS_REQUIRED (HTTP 400); ReentryEvaluation.${ev1} remains PENDING"

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: accept_links_existing_open_case
        claim_type: cross_reference_link
        grounds:
          - "state_machines.ConcernReport.UNDER_REVIEW_to_ACCEPTED"
          - "entities.ConcernReport.fields.care_case_id"
        distinguishing_aspect: "Accepting a second report for a student who already has a non-CLOSED case links to that case instead of creating a duplicate: at most one open case per student."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; report r1 accepted (case cA created); report r2 UNDER_REVIEW for same student"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0023", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "first", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { cA: $.data.care_case_id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "second", observed_at: "2026-08-01T09:00:00Z", related_report_id: "${r1}" }, as: Reporter, as_user_id: "${rep}", captures: { r2: $.data.id } }
            - { call: "POST /bit/concern-reports/${r2}/start-review", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/concern-reports/${r2}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { r2_case: $.data.care_case_id, r2_status: $.data.status } }
            - { call: "GET /bit/care-cases", payload: { student_id: "${s1}" }, as: BITChair, as_user_id: "${chair}" }
          assert:
            - "r2 accept response: status == ACCEPTED and care_case_id == ${cA} (linked, not new)"
            - "GET /bit/care-cases?student_id=${s1} returns total_count == 1"

      - name: assign_manager_retargets_completion_ownership
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /bit/care-cases/{id}/assign-manager]"
          - "errors[ERR_NOT_ASSIGNED_CASE_MANAGER]"
        distinguishing_aspect: "After reassignment the previous manager loses completion rights immediately: old manager's complete is rejected, new manager's succeeds."
        test_recipe:
          setup: ["staff chair/cm/cm2/rep; student s1; case c1 PLAN_ACTIVE LOW with check-in k1 SCHEDULED (assigned to cm)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager Two", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm2: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0024", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
          trigger:
            - { call: "POST /bit/care-cases/${c1}/assign-manager", payload: { case_manager_id: "${cm2}" }, as: BITChair, as_user_id: "${chair}", captures: { c1_mgr: $.data.assigned_case_manager_id } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "old manager" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "new manager" }, as: CaseManager, as_user_id: "${cm2}", captures: { k1_status: $.data.status } }
          assert:
            - "assign-manager response: assigned_case_manager_id == ${cm2}"
            - "old manager complete: error_id == ERR_NOT_ASSIGNED_CASE_MANAGER (HTTP 403)"
            - "new manager complete: k1 -> COMPLETED (200)"

      - name: trend_report_computed_read
        claim_type: computed_read
        grounds:
          - "endpoints[POST /bit/trend-reports]"
          - "endpoints[GET /bit/trend-reports/{id}]"
        excluded_because:
          difficulty_instance: trend_report_entry_cohort_vs_active_window_variants
          rationale: "Computed trend metrics are asserted on both variants in the named §1.8 instance; GET-by-id is a plain retrieval of the same entity."

  # ============================================================ errors
  - section: errors
    instances:
      - name: open_plan_exists_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OPEN_PLAN_EXISTS]"
          - "validations[priority=9]"
        distinguishing_aspect: "A second plan draft while a DRAFT plan exists is rejected even with a current case version — the OCC check passes and the business constraint fires."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 TRIAGED; plan p1 DRAFT (case PLAN_DRAFTING)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0025", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv2}", objectives: ["o2"], success_criteria: "s2" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OPEN_PLAN_EXISTS (HTTP 409): p1 is DRAFT; the fresh expected_case_version proves this is the business constraint, not OCC"

      - name: reentry_already_pending_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REENTRY_ALREADY_PENDING]"
          - "validations[priority=9]"
        distinguishing_aspect: "A second re-entry petition while one is PENDING fails even with the current case version."
        test_recipe:
          setup: ["full leave path: case c1 ON_LEAVE; re-entry evaluation ev1 PENDING"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Dean One", office: DEAN_OF_STUDENTS }, as: SystemAdmin, captures: { dean: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0026", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "mandate" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
            - { call: "POST /bit/mandated-assessments/${a1}/record-outcome", payload: { outcome: NOT_CLEARED, findings_summary: "not cleared" }, as: CounselingEvaluator, as_user_id: "${ev}" }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld1: "$.data[0].id" } }
            - { call: "POST /bit/leave-decisions/${ld1}/decide", payload: { decision: GRANT_LEAVE, rationale: "safety" }, as: DeanOfStudents, as_user_id: "${dean}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version } }
            - { call: "POST /bit/reentry-evaluations", payload: { case_id: "${c1}", expected_case_version: "${cv2}", petition_summary: "first" }, as: CaseManager, as_user_id: "${cm}", captures: { ev1: $.data.id } }
          trigger:
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv3: $.data.version } }
            - { call: "POST /bit/reentry-evaluations", payload: { case_id: "${c1}", expected_case_version: "${cv3}", petition_summary: "second" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REENTRY_ALREADY_PENDING (HTTP 409) — OCC passed (${cv3} current), the pending-evaluation constraint fires"

      - name: trend_window_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TREND_WINDOW_INVALID]"
        distinguishing_aspect: "window_end <= window_start is rejected before any aggregation runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bit/trend-reports", payload: { term_code: "2026-FALL", window_start: "2026-08-31T00:00:00Z", window_end: "2026-08-01T00:00:00Z", variant: ENTRY_COHORT }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TREND_WINDOW_INVALID (HTTP 400)"

      - name: scoring_mode_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SCORING_MODE_INVALID]"
          - "entities.RiskScoring.fields.mode"
        distinguishing_aspect: "REASSESSMENT as the very first scoring of a case is a mode error (not a state error — the case is INTAKE)."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 INTAKE, no scorings yet"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0027", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: REASSESSMENT, harm_to_self: 5, harm_to_others: 5, academic_disruption: 5, substance_involvement: 5, rationale: "no prior" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCORING_MODE_INVALID (HTTP 400): REASSESSMENT requires a prior scoring"

      - name: related_report_student_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RELATED_REPORT_STUDENT_MISMATCH]"
          - "validations[priority=11]"
        distinguishing_aspect: "related_report_id pointing at another student's report violates referential consistency (422), distinct from a nonexistent id (404)."
        test_recipe:
          setup: ["staff rep; students s1, s2; report r1 belongs to s2"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0028", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0029", full_name: "Stu Two" }, as: SystemAdmin, captures: { s2: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s2}", category: ACADEMIC_DISTRESS, narrative: "about s2", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "about s1", observed_at: "2026-08-01T09:00:00Z", related_report_id: "${r1}" }, as: Reporter, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RELATED_REPORT_STUDENT_MISMATCH (HTTP 422)"

      - name: disclosure_window_invalid_error_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DISCLOSURE_WINDOW_INVALID]"
        excluded_because:
          difficulty_instance: grant_window_shape_vs_overlap_conflict
          rationale: "ERR_DISCLOSURE_WINDOW_INVALID is the asserted outcome of the named §1.8 priority-conflict instance."

      - name: assessment_already_pending_error_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ASSESSMENT_ALREADY_PENDING]"
        excluded_because:
          difficulty_instance: assessment_slot_closed_interval_overlap
          rationale: "ERR_ASSESSMENT_ALREADY_PENDING is the asserted failure of the named §1.8 overlap instance."

  # ============================================================ rbac
  - section: rbac
    instances:
      - name: case_manager_cannot_order_assessment
        claim_type: violation_to_error
        grounds:
          - "roles[BITChair]"
          - "endpoints[POST /bit/mandated-assessments]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Ordering a mandated assessment is BITChair-exclusive; a CaseManager caller gets 403 even for a well-formed request."
        test_recipe:
          setup: ["staff chair/cm/rep/ev; student s1; case c1 PLAN_ACTIVE (HIGH)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0030", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
          trigger:
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "cm attempt" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403)"

      - name: chair_cannot_decide_leave
        claim_type: violation_to_error
        grounds:
          - "roles[DeanOfStudents]"
          - "endpoints[POST /bit/leave-decisions/{id}/decide]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Leave decisions are DeanOfStudents-exclusive; the BITChair who ordered the assessment cannot also decide."
        test_recipe:
          setup: ["full chain: case c1 LEAVE_DECISION with PENDING LeaveDecision ld1 (requested_by chair)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0031", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-10T00:00:00Z", rationale: "mandate" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
            - { call: "POST /bit/mandated-assessments/${a1}/record-outcome", payload: { outcome: NOT_CLEARED, findings_summary: "not cleared" }, as: CounselingEvaluator, as_user_id: "${ev}" }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld1: "$.data[0].id" } }
          trigger:
            - { call: "POST /bit/leave-decisions/${ld1}/decide", payload: { decision: GRANT_LEAVE, rationale: "chair attempt" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (HTTP 403) — role gate fires before the segregation check"

      - name: system_admin_opaque_identity_manages_roster
        claim_type: satisfaction_to_pass
        grounds:
          - "roles[SystemAdmin]"
        distinguishing_aspect: "SystemAdmin is identity: opaque — roster and student administration succeed with an operator id that resolves to no StaffMember entity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bit/staff", payload: { full_name: "New Hire", office: BIT_OFFICE }, as: SystemAdmin, captures: { st: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0032", full_name: "Stu New" }, as: SystemAdmin, captures: { stu: $.data.id } }
          assert:
            - "both calls return 201 with server-minted ids; no StaffMember record is required for the SystemAdmin caller"

      - name: segregation_approver_is_drafter_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties is identity-based, not role-based: the same StaffMember wearing CaseManager then BITChair hats cannot approve their own draft."
        test_recipe:
          setup: ["staff hybrid (one person, office BIT_OFFICE, used as both cm-role and chair-role), rep; student s1; case c1 TRIAGED; plan p1 DRAFT drafted by hybrid-as-CaseManager, submitted"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Hybrid Person", office: BIT_OFFICE }, as: SystemAdmin, captures: { hyb: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0033", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${hyb}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${hyb}" }, as: BITChair, as_user_id: "${hyb}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${hyb}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${hyb}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${hyb}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${hyb}" }
          trigger:
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${hyb}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 403): X-User-ID ${hyb} == plan.drafted_by"
            - "InterventionPlan.${p1} remains PENDING_APPROVAL"

      - name: reporter_reads_only_own_reports
        claim_type: violation_to_error
        grounds:
          - "roles[Reporter]"
          - "validations[priority=7]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Reporter ownership rule on GET /bit/concern-reports/{id}: another reporter's submission is invisible (403), own submission readable."
        test_recipe:
          setup: ["staff rep1/rep2 (FACULTY_AFFAIRS); student s1; report r1 by rep1"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Rep One", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep1: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Rep Two", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep2: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0034", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "rep1 report", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "GET /bit/concern-reports/${r1}", as: Reporter, as_user_id: "${rep2}", captures: { err: $.data.error_id } }
            - { call: "GET /bit/concern-reports/${r1}", as: Reporter, as_user_id: "${rep1}", captures: { got: $.data.id } }
          assert:
            - "rep2 reading rep1's report: error_id == ERR_FORBIDDEN (HTTP 403)"
