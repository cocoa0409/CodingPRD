    roles: [ClubComplianceOfficer]
    input: []
    output: ConcussionCase
    status: 200
    side_effects:
      - "sets roster_exemption_status = GRANTED"
      - "increments Club.exemption_slots_used by 1, decrements exemption_slots_available by 1"
      - "increments ConcussionCase.version and Club.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CASE_NOT_FOUND, ERR_CLUB_SCOPE_VIOLATION, ERR_CASE_STATE_INVALID, ERR_EXEMPTION_ALREADY_GRANTED, ERR_NO_EXEMPTION_SLOTS]

  - method: POST
    path: /concussion-program/concussion-cases/{id}/symptom-check
    roles: [ClubPhysician]
    input: [symptom_score]
    output: ConcussionCase
    status: 200
    side_effects:
      - "always records last_symptom_check_score"
      - "when symptom_score >= 4: sets last_symptomatic_at = now, recurrence_count += 1, recomputes severity_index, and (while PENDING_INC_CLEARANCE) denies the PENDING clearance with DENIED_MORE_REST, revokes the highest PASSED ReturnStep, decrements rtp_stage, clears earliest_return_at and returns case_status to RTP_IN_PROGRESS"
      - "sets monitoring_status = PROLONGED_SYMPTOM_WATCH when the new recurrence_count >= 2, which drives Player.availability_status = PROTOCOL_RESTRICTED and public_injury_designation = OUT"
      - "when symptom_score == 0 while OFFSEASON_MONITORING and CLEARED_FOR_CONTACT: sets monitoring_status = MONITORING_CLOSED"
      - "increments ConcussionCase.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CASE_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLUB_SCOPE_VIOLATION, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_CASE_STATE_INVALID]

  - method: GET
    path: /concussion-program/concussion-cases/{id}
