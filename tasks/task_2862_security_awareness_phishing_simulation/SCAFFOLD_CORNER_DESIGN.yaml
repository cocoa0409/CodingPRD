            - { call: "POST /awareness/phishing-templates", payload: { name: "Variant Probe Template", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "ENG Variant Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T09:30:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { prov_before: "$.data.risk_score_provisional", settled_before: "$.data.risk_score_settled" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/close", payload: { debrief_note: "Single-member wave closed; one click, no reports." }, as: ProgramAdmin, captures: { c_state: "$.data.state" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { prov_after: "$.data.risk_score_provisional", settled_after: "$.data.risk_score_settled" } }
          assert:
            - "before the close: risk_score_provisional == 11.00 and risk_score_settled == 0.00"
            - "the close returns HTTP 200 with state CLOSED and frozen click_rate == 1.0000, report_rate == 0.0000"
            - "after the close: risk_score_provisional == 11.00 AND risk_score_settled == 11.00"
            - "Employee.${e}.consecutive_clean_simulations == 0: a CLICKED delivery earns no clean-streak increment at close"
            - "Employee.${e}.repeat_clicker_tier == 1 both before and after (the tier is variant-independent)"

      - name: four_hop_escalation_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CurriculumAssignment.OVERDUE_to_ESCALATED
        excluded_because:
          difficulty_instance: sweep_cascade_overdue_to_notice_to_consequence_to_posture
          rationale: "The Assignment -> Notice -> Consequence -> Employee chain and its sweep counters are asserted hop by hop in the named §1.8 instance."

      - name: optimistic_concurrency_on_campaign_schedule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[campaign-schedule-stale-campaign]
        excluded_because:
          difficulty_instance: campaign_schedule_stale_version_outranks_blackout_returns_412
          rationale: "The third concurrency rule's stale-token rejection is asserted (and priority-ordered) by the named §1.8 instance."

      - name: dual_variant_divergence_on_identical_data
        claim_type: dual_variant_calculation
        grounds:
          - calculations.employee_risk_score
        excluded_because:
          difficulty_instance: risk_score_provisional_vs_settled_diverge_on_one_employee
          rationale: "The simultaneous 11.00-versus-0.00 divergence on one employee is the named §1.8 instance."

      - name: rate_threshold_trigger_opens_the_intervention
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.repeat_clicker_tier
        excluded_because:
          difficulty_instance: interaction_cascade_click_to_delivery_to_tier_to_intervention
          rationale: "Crossing the tier-2 threshold and the intervention it opens (including simulation_frequency_days) are asserted by the named §1.8 instance."

  - section: consistency model
    instances:
      - name: immediate_consistency_every_derived_field_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /awareness/compliance-sweeps]
          - entities.Employee.fields.compliance_state
        distinguishing_aspect: "There is no denormalisation lag anywhere: the sweep's own response counters already reflect the four-hop cascade, the immediately following reads agree with them, and a second identical read returns byte-identical derived values - so no test ever needs a retry or a settling delay."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A manager and a direct report holding a REMEDIAL assignment due 2026-08-08T00:00:00Z; the clock is advanced to 2026-08-15T00:00:00Z (7 days overdue)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "mgr.now@corp.example", full_name: "Nina Manager", department: "SALES", role_code: "MANAGER", hire_date: "2012-12-12" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "rep.now@corp.example", full_name: "Ned Report", department: "SALES", role_code: "IC", hire_date: "2020-10-10", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "NOW-REM", title: "Immediate Probe Remedial", module_type: "REMEDIAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "REMEDIAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { esc: "$.data.escalations_created_count", cons: "$.data.consequences_applied_count" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { posture1: "$.data.access_posture", risk1: "$.data.risk_score_provisional" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { posture2: "$.data.access_posture", risk2: "$.data.risk_score_provisional" } }
            - { call: "GET /awareness/access-consequences", payload: { employee_id: "${e}", state: "ACTIVE" }, as: ProgramAdmin }
          assert:
            - "the sweep response reports escalations_created_count == 2 and consequences_applied_count == 1 in the very same response that performed the cascade"
            - "the first read already shows access_posture ELEVATED_REVIEW, compliance_state DELINQUENT and risk_score_provisional 8.00 - no retry is needed"
            - "the second read returns identical values (posture2 == posture1 and risk2 == risk1): reads are side-effect free"
            - "the ACTIVE consequence listing holds exactly one row with severity_rank 2 and source_assignment_id == ${a}"
            - "a further sweep at the same clock instant changes nothing: escalations_created_count == 0 and consequences_applied_count == 0"

      - name: immediate_consistency_of_the_escalation_cascade_counters
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: sweep_cascade_overdue_to_notice_to_consequence_to_posture
          rationale: "The same-response visibility of every hop's counter and field is already asserted end-to-end by the named §1.8 instance."
