  - rule_id: resource_temporal_overlap
    instances:
      - name: mediator_sessions_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - state_machines.MediationCase.ACCEPTED_to_SCHEDULED
          - errors.ERR_MEDIATOR_SCHEDULE_CONFLICT
        distinguishing_aspect: "Half-open [start, end) interval semantics on the MEDIATOR resource (different resource and geometry from the hearing-room instance): back-to-back sessions 10:00-11:00 and 11:00-12:00 for mediator med-9 both schedule, while 10:30-11:30 intersects and is rejected."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; LARGE business founded 2018-01-01."
            - "Three complaints c1, c2, c3 each UNRESOLVED (answered then rejected); three MediationCases m1, m2, m3 each ACCEPTED by both parties."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_consumer
            - *d_biz_large
            - *d_c1_file
            - *d_c1_forward
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "a1" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REJECT", body: "no" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /complaints/${c1_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /mediation-cases/${m1_id}/party-response"
              payload: { party: "BUSINESS", response: "ACCEPT" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /mediation-cases/${m1_id}/party-response"
              payload: { party: "CONSUMER", response: "ACCEPT" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - *d_c2_file
            - *d_c2_forward
            - *d_c2_respond
            - *d_c2_reject
            - call: "POST /complaints/${c2_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /mediation-cases/${m2_id}/party-response"
              payload: { party: "BUSINESS", response: "ACCEPT" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /mediation-cases/${m2_id}/party-response"
              payload: { party: "CONSUMER", response: "ACCEPT" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - *d_c3_file
            - *d_c3_forward
            - *d_c3_respond
            - call: "POST /complaints/${c3_id}/responses"
              payload: { kind: "CONSUMER_REJECT", body: "no" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /complaints/${c3_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /mediation-cases/${m3_id}/party-response"
              payload: { party: "BUSINESS", response: "ACCEPT" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /mediation-cases/${m3_id}/party-response"
              payload: { party: "CONSUMER", response: "ACCEPT" }
              as: Consumer
              as_user_id: "${consumer_id}"
          trigger:
            - call: "POST /mediation-cases/${m1_id}/schedule"
              payload: { mediator_id: "med-9", session_start_at: "2026-09-21T10:00:00Z", session_end_at: "2026-09-21T11:00:00Z" }
              as: BureauAdmin
              captures: { m1_status: $.data.status }
            - call: "POST /mediation-cases/${m2_id}/schedule"
              payload: { mediator_id: "med-9", session_start_at: "2026-09-21T11:00:00Z", session_end_at: "2026-09-21T12:00:00Z" }
              as: BureauAdmin
              captures: { m2_status: $.data.status }
            - call: "POST /mediation-cases/${m3_id}/schedule"
              payload: { mediator_id: "med-9", session_start_at: "2026-09-21T10:30:00Z", session_end_at: "2026-09-21T11:30:00Z" }
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "m1 schedules: status == SCHEDULED (10:00-11:00)"
            - "m2 schedules adjacent at 11:00: status == SCHEDULED — half-open [start, end) treats end == other.start as non-overlapping"
            - "m3 at 10:30-11:30 returns 409 with error_id == ERR_MEDIATOR_SCHEDULE_CONFLICT (intersects both neighbors)"
            - "MediationCase.${m3_id} remains ACCEPTED with mediator_id null"

      - name: hearing_room_requires_thirty_minute_buffer_adjacency_conflicts
