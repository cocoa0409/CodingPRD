              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id, zone_v: $.data.version }
