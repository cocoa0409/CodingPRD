              captures: { sv: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${sid}", party_size: 1, expected_show_version: "${sv}" }
              as: BoxOfficeOperator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /show-bookings"
              payload: { show_event_id: "${sid}", party_size: 1, expected_show_version: "${sv}" }
              as: BoxOfficeOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_SHOW_VERSION"
            - "response.http_status == 412"

      - name: occ_stale_sponsor_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contribution-stale-fulfillment]", "errors[ERR_STALE_SPONSOR_VERSION]"]
        distinguishing_aspect: "A second POST /sponsors/{id}/contributions carrying the pre-first-installment sponsor version is rejected with ERR_STALE_SPONSOR_VERSION (412) — a different parent entity than the show OCC."
        test_recipe:
