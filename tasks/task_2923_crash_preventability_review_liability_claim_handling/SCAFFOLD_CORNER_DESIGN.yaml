      - name: subrogation_ceiling_rounds_half_up_at_the_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.subrogation_recovery
          - calculations.settlement_layer_waterfall
          - validations[priority=71]
          - errors[ERR_RECOVERY_EXCEEDS_BASE]
        distinguishing_aspect: "A recoverable base of 999,001 cents at 50 percent lands on exactly 499,500.5, and round_half_up yields 499,501 — one cent above the banker's-rounding answer — which is also the largest recovery the resolve endpoint will accept."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One Terminal, one Driver, one MODERATE crash with third_party_at_fault true (provisional reserve 2,500,000 at multiplier 1.00)."
            - "A single-layer 2026 tower: layer_index 1, SIR, attachment 0, limit 10,000,000."
            - "One THIRD_PARTY_PROPERTY demand for 1,000,000 and one DRAFT SubrogationDemand at at_fault_percentage 50."
