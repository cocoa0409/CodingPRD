        grounds: [state_machines.BarnShift.OPEN_to_ASSIGNED, state_machines.BarnShift.ASSIGNED_to_OPEN]
        distinguishing_aspect: "BarnShift cycles OPEN -> ASSIGNED -> OPEN: release nulls volunteer_id and a different volunteer can claim the same shift afterward."
        test_recipe:
          setup: ["Volunteers V1, V2 (both ACTIVE, reliability 50, skills [FEEDING]); shift SH FEEDING 2026-08-05 06:00-08:00 OPEN"]
          setup_api_calls:
            - { call: "POST /rescue-ops/volunteers", payload: { name: "V1", contact_email: "v1@x.com", skills: [FEEDING] }, as: Volunteer, captures: { v1: $.data.id } }
