  - method: GET
    path: "/shoot-bookings/{id}"
    description: "Get a ShootBooking"
    roles: [ClientAgent, Photographer, Coordinator, OpsAdmin]
    code: 200
    input: []
    output: ShootBooking
    side_effects: []

  - method: PATCH
    path: "/shoot-bookings/{id}"
    description: "Update mutable fields while DRAFT (OCC-guarded)"
    roles: [ClientAgent]
    code: 200
    input: [expected_booking_version, "equipment_package?", "photo_count?", "wants_virtual_tour?", "tour_variant?", "license_tier?", "scheduled_start_utc?"]
    output: ShootBooking
    side_effects:
      - "Only legal while booking.state == DRAFT (ERR_INVALID_STATE otherwise)"
      - "scheduled_end_utc recomputed when package/photo_count/scheduled_start change"
      - "increments ShootBooking.version by 1"

  - method: POST
    path: "/shoot-bookings/{id}/submit"
    description: "Submit booking (DRAFT -> AWAITING_READINESS), locking provisional quote and spawning checklist"
    roles: [ClientAgent]
    code: 200
    input: []
    output: ShootBooking
    side_effects: ["provisional_quote_cents locked; 5 default ReadinessChecklistItems created; increments ShootBooking.version"]

  - method: POST
    path: "/shoot-bookings/{id}/cancel"
    description: "Client cancel"
    roles: [ClientAgent]
    code: 200
    input: []
    output: ShootBooking
    side_effects: ["cascade: AddOns, AirspaceAuthorizations cancelled; photographer minutes released"]

  - method: POST
    path: "/shoot-bookings/{id}/assign"
    description: "Coordinator assigns a photographer (READY -> ASSIGNED)"
    roles: [Coordinator]
    code: 200
    input: [photographer_id]
    output: ShootBooking
    side_effects: ["overlap + capacity + equipment + drone-cert checks; committed_minutes updated; may route to AUTHORIZATION_PENDING"]

  - method: POST
    path: "/shoot-bookings/{id}/unassign"
    description: "Coordinator revokes assignment (ASSIGNED/AUTHORIZATION_PENDING -> READY)"
    roles: [Coordinator]
    code: 200
    input: []
    output: ShootBooking
    side_effects: ["minutes released; pending/rejected authorizations cancelled"]

  - method: POST
    path: "/shoot-bookings/{id}/confirm"
    description: "Confirm an ASSIGNED booking with no drone add-ons (ASSIGNED -> CONFIRMED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: ShootBooking
    side_effects: ["increments ShootBooking.version"]

  - method: POST
    path: "/shoot-bookings/{id}/mark-shot"
    description: "Assigned photographer marks the shoot complete (CONFIRMED -> SHOT -> IN_EDIT)"
    roles: [Photographer]
    code: 200
    input: []
    output: ShootBooking
    side_effects: ["AssetBundle created EDITING; delivery_due_utc computed"]

  - method: POST
    path: "/shoot-bookings/{id}/deliver"
    description: "Deliver or re-deliver the asset bundle"
    roles: [Photographer]
    code: 200
    input: [photo_asset_count, "tour_asset_url?"]
    output: AssetBundle
    side_effects: ["bundle -> DELIVERED; booking -> DELIVERED; revision window opens (first delivery only); tour + license spawned (first delivery only)"]

  - method: POST
