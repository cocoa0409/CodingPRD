        distinguishing_aspect: "The ledger-sync side-effect pattern - a report state change re-deriving the Propagator's payable and settled fields with the invariant reconciling before and after - is asserted end to end by the difficulty design."
        excluded_because:
          difficulty_instance: reversing_a_settlement_restores_propagator_royalty_payable_exactly
          rationale: "That compensating_invariant instance already walks accept -> settle -> reverse and asserts royalty_payable_cents / royalty_settled_cents plus invariant I2 at all three points; a separate ledger-sync corner would re-run the same assertions."

      - name: tag_void_compensation_corner_deferred_to_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines[TagOrder.status].transitions[ISSUED->VOIDED]
          - calculations.quota_tag_inventory
        distinguishing_aspect: "The compensation side-effect pattern - undoing a commitment and verifying every original side effect is reversed with no drift - is asserted by the difficulty design."
        excluded_because:
          difficulty_instance: voiding_an_issued_tag_order_restores_quota_unit_inventory_exactly
          rationale: "That compensating_invariant instance already asserts tags_committed_units and units_available before issue, after issue and after void, and checks invariant I1 at each point."

      - name: protection_filing_maintenance_cycle_corner_deferred_to_difficulty_design
        claim_type: cyclic_shape
        grounds:
          - state_machines[ProtectionFiling.status].transitions[MAINTENANCE_DUE->GRANTED]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The cyclic-shape corner - an entity looping back through a state with a lap counter respected - lives on the GRANTED -> MAINTENANCE_DUE -> GRANTED annuity loop."
        excluded_because:
          difficulty_instance: protection_filing_maintenance_cycle_relaps_without_a_terminal_stop
          rationale: "That non_linear_state_machine instance already drives two full laps and asserts annuity_sequence_no, installments_paid_count and the reset of the four annuity money fields on each re-entry."

  # =====================================================================
  - section: calculations
    instances:
      - name: damages_waterfall_fills_the_enforcement_bucket_before_the_breeder_pool
        claim_type: waterfall_allocation
        grounds:
          - calculations.damages_waterfall
          - endpoints[POST /surveillance-cases/{case_id}/resolve]
          - entities.Propagator.fields.damages_credit_cents
        distinguishing_aspect: "Bucket ordering is observable: recovered 1000000 with enforcement_cost 150000 gives enforcement_recovery 150000, breeder_pool min(850000, round_half_up(1000000 * 0.70) = 700000) = 700000, and the residue 150000 to the propagator - and the propagator's damages_credit_cents rises by exactly that residue."
        test_recipe:
          setup:
            - "One Variety, one Propagator, and a SurveillanceCase naming that propagator, concluded NO_MATCH (max_match_confidence 0.4000) so no compliance penalty muddies the assertions."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Cinder Bramble", species: "Rubus idaeus", breeder_code: "CB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Cinder Ridge Nursery", home_territory_code: "US-ID" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /surveillance-cases"
              payload: { variety_id: "${v_id}", suspected_propagator_id: "${p_id}", market_survey_ref: "MS-2026-050" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { c_id: $.data.id }
            - call: "POST /surveillance-cases/${c_id}/sample"
              payload: { sampled_unit_count: 30 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /surveillance-cases/${c_id}/genetic-tests"
              payload: { lab_code: "GENLAB", marker_panel: "SSR-16", match_confidence: 0.4000 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /surveillance-cases/${c_id}/conclude-testing"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /surveillance-cases/${c_id}/resolve"
              payload: { recovered_damages_cents: 1000000, enforcement_cost_cents: 150000 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "HTTP status is 200 and SurveillanceCase.${c_id}.status == RESOLVED"
            - "SurveillanceCase.${c_id}.enforcement_recovery_cents == 150000"
            - "SurveillanceCase.${c_id}.breeder_pool_cents == 700000"
            - "SurveillanceCase.${c_id}.propagator_credit_cents == 150000"
            - "150000 + 700000 + 150000 == 1000000 exactly - the three buckets sum to recovered_damages_cents"
            - "Propagator.${p_id}.damages_credit_cents == 150000 and compliance_score == 100 (a NO_MATCH case carries no penalty)"

      - name: damages_waterfall_overflow_leaves_the_later_buckets_at_zero
        claim_type: waterfall_allocation
        grounds:
          - calculations.damages_waterfall
          - endpoints[POST /surveillance-cases/{case_id}/resolve]
        distinguishing_aspect: "When the first bucket cannot be filled - recovered 100000 against enforcement_cost 150000 - bucket 1 takes everything available (100000, not the 150000 cost) and buckets 2 and 3 are exactly 0 rather than negative, even though BREEDER_POOL_PCT would nominally target round_half_up(100000 * 0.70) = 70000."
        test_recipe:
          setup:
            - "Same shape as the normal waterfall case: one Variety, one Propagator, one SurveillanceCase concluded NO_MATCH."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Dovetail Bramble", species: "Rubus idaeus", breeder_code: "DB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Dovetail Nursery", home_territory_code: "US-ID" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /surveillance-cases"
              payload: { variety_id: "${v_id}", suspected_propagator_id: "${p_id}", market_survey_ref: "MS-2026-051" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { c_id: $.data.id }
            - call: "POST /surveillance-cases/${c_id}/sample"
              payload: { sampled_unit_count: 12 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /surveillance-cases/${c_id}/genetic-tests"
              payload: { lab_code: "WESTLAB", marker_panel: "SNP-8", match_confidence: 0.3000 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /surveillance-cases/${c_id}/conclude-testing"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /surveillance-cases/${c_id}/resolve"
              payload: { recovered_damages_cents: 100000, enforcement_cost_cents: 150000 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "SurveillanceCase.${c_id}.enforcement_recovery_cents == 100000 (capped by what came in, not by the 150000 cost)"
            - "SurveillanceCase.${c_id}.breeder_pool_cents == 0 and propagator_credit_cents == 0"
            - "No field is negative and 100000 + 0 + 0 == 100000"
            - "Propagator.${p_id}.damages_credit_cents == 0 and its version is unchanged (no credit was applied)"
            - "A third resolve is impossible: RESOLVED is terminal, so POST /surveillance-cases/${c_id}/resolve again returns ERR_TERMINAL_STATE"

      - name: compliance_score_excludes_a_submitted_but_unaccepted_late_report
