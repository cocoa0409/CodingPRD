  # ===========================================================================
  - section: calculations
    instances:

      - name: discount_stack_selects_one_survivor_per_class_by_the_pinned_sort_key
        claim_type: correct_result
        grounds:
          - calculations.discount_stack_total_bps
          - entities.DiscountApplication.fields.application_state
          - validations[priority=12]
        distinguishing_aspect: "The class-selection step keeps the highest discount_bps in each stacking_class and marks the losers PREEMPTED, so a loan with three candidate rules in two classes stores the sum of two survivors rather than all three."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-CALC-01 has an ADOPTED LENDING holding with LoanAccount la at base_apr_bps 1200."
            - "Rules A_60 (ADDITIVE, 60 bps, effective_from 2026-02-01), A_40 (ADDITIVE, 40 bps, effective_from 2026-03-01) and B_30 (BASE, 30 bps) are all ACTIVE."
          setup_api_calls:
            - *kc
            - call: "POST /benefits/members"
              payload: { member_number: "M-CALC-01", full_name: "Rhea Lund", email: "rhea@x.com" }
              as: Anonymous
              captures: { calc01_id: $.data.id }
            - call: "POST /benefits/holdings"
              payload: { member_id: "${calc01_id}", product_line: "LENDING", balance_cents: 0 }
              as: PlatformAdmin
              captures: { calc01_h_id: $.data.id }
            - call: "POST /benefits/holdings/${calc01_h_id}/adopt"
              payload: {}
              as: Member
              as_user_id: "${calc01_id}"
            - call: "POST /benefits/loan-accounts"
              payload: { member_id: "${calc01_id}", holding_id: "${calc01_h_id}", loan_type: "PERSONAL", principal_cents: 500000, base_apr_bps: 1200 }
              as: Underwriter
              captures: { calc01_la_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "A_60", discount_kind: "PROMOTIONAL", stacking_class: "ADDITIVE", discount_bps: 60, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { calc01_ra_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${calc01_ra_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "A_40", discount_kind: "PROMOTIONAL", stacking_class: "ADDITIVE", discount_bps: 40, effective_from: "2026-03-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { calc01_rb_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${calc01_rb_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/rate-discount-rules"
              payload: { rule_code: "B_30", discount_kind: "MEMBER_TIER", stacking_class: "BASE", discount_bps: 30, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { calc01_rc_id: $.data.id }
            - call: "POST /benefits/rate-discount-rules/${calc01_rc_id}/activate"
              payload: {}
              as: BenefitsAdmin
          trigger:
            - call: "GET /benefits/rate-discount-rules"
              payload: { discount_kind: "PROMOTIONAL" }
              as: Underwriter
            - call: "GET /benefits/loan-accounts/${calc01_la_id}"
              payload: {}
              as: Underwriter
          assert:
            - "GET /benefits/applications?loan_account_id=${calc01_la_id} reports exactly 1 APPLIED application in the ADDITIVE class, carrying applied_bps 60"
            - "LoanAccount.${calc01_la_id}.discount_stack_bps == 90 (60 ADDITIVE survivor + 30 BASE survivor)"
            - "the 40 bps rule loses the ADDITIVE class to the 60 bps rule by the (discount_bps DESC, effective_from DESC, created_at DESC) sort key"
            - "LoanAccount.${calc01_la_id}.effective_apr_bps == 1110 (1200 - 90)"
            - "the two surviving candidates are observable as APPLIED applications and the loser as PREEMPTED"

      - name: discount_stack_only_counts_rules_inside_their_validity_window
        claim_type: input_set_filtering
        grounds:
          - calculations.discount_stack_total_bps
          - entities.RateDiscountRule.fields.effective_from
          - entities.RateDiscountRule.fields.effective_to
        distinguishing_aspect: "The candidate predicate is half-open on the right and inclusive on the left: a rule whose effective_to equals the logical clock is out, a rule whose effective_from equals it is in, so the same rule set prices differently across a one-second clock move."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Member M-CALC-02 has an ADOPTED LENDING holding with LoanAccount la at base_apr_bps 1000."
            - "Rule W_OPEN (ADDITIVE, 20 bps, effective_from 2026-09-01T00:00:00Z, effective_to 2027-01-01T00:00:00Z) and rule W_CLOSED (ADDITIVE, 90 bps, effective_from 2026-03-01T00:00:00Z, effective_to 2026-09-01T00:00:00Z) are both ACTIVE."
