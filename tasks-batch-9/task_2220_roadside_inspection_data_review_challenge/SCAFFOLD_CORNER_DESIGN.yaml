  - section: errors
    instances:
      - name: challenge_quota_exceeded_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "compensating_invariant / challenge_quota_and_certified_measure_restored_by_withdraw"
          rationale: |
            trigger[0] of that instance submits a second challenge for a SMALL carrier whose
            challenge_quota_limit is 1 and asserts the 409 ERR_CHALLENGE_QUOTA_EXCEEDED plus an
            unchanged certified measure.

      - name: challenge_filing_window_closed_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / filing_window_beats_quota_on_expired_report_submit"
          rationale: |
            A submit against a report 731 whole days old returns ERR_CHALLENGE_FILING_WINDOW_CLOSED
            there, in preference to the quota rule that the same payload also violates.

      - name: invalid_challenge_state_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_filing_window_on_withdrawn_challenge_submit"
          rationale: |
            Submitting a WITHDRAWN challenge returns ERR_INVALID_CHALLENGE_STATE there, which is the
            only way this error is reachable.

      - name: carrier_scope_violation_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / carrier_scope_beats_state_on_foreign_challenge_submit"
          rationale: |
            A CarrierAnalyst acting on another carrier's challenge returns the 403
            ERR_CARRIER_SCOPE_VIOLATION there, ahead of the state gate.

      - name: challenge_round_limit_exceeded_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "non_linear_state_machine / challenge_fourth_info_request_rejected_after_three_rounds"
          rationale: |
            The fourth REQUEST_INFO after three completed rounds returns
            ERR_CHALLENGE_ROUND_LIMIT_EXCEEDED there with info_request_count pinned at 3.

      - name: driver_not_employed_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / coaching_assignment_requires_active_driver"
          rationale: |
            Assigning coaching to a TERMINATED driver returns ERR_DRIVER_NOT_EMPLOYED there, and the
            same call succeeds after the driver is reinstated.

      - name: cap_not_required_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / cap_creation_requires_conditional_or_unsatisfactory_fitness"
          rationale: |
            Creating a plan for a SATISFACTORY or UNRATED carrier returns ERR_CAP_NOT_REQUIRED there.

      - name: duplicate_inspection_window_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / vehicle_inspection_window_closed_interval_with_120_minute_buffer"
          rationale: |
            The 120-minute buffer instance ingests reports at the touching boundary and just inside it,
            asserting ERR_DUPLICATE_INSPECTION_WINDOW for the overlapping cases only.

      - name: coaching_window_conflict_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / driver_coaching_window_half_open_adjacency_allowed"
          rationale: |
            The half-open interval instance asserts ERR_COACHING_WINDOW_CONFLICT for the overlapping
            session and a 201 for the exactly-adjacent one.

      - name: invalid_report_state_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / challenge_submit_requires_report_beyond_received"
          rationale: |
            Submitting a challenge against a RECEIVED report returns ERR_INVALID_REPORT_STATE there;
            the §1.9 state-machine section additionally reaches it from the priority-33 append path.

  - section: rbac
    instances:
      - name: missing_or_unknown_role_headers_rejected
        claim_type: role_permission
        grounds:
          - validations[priority 1]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: |
          Authentication is checked before anything else and covers three distinct header defects — no
          X-User-Role, no X-User-ID, and a role string that is not one of the five declared roles — all
          returning 401 ERR_UNAUTHENTICATED rather than 403, even for a read-only list endpoint.
        test_recipe:
          setup:
            - "Empty database; no fixtures are needed because authentication precedes existence checks."
          setup_api_calls: []
          trigger:
            - call: "GET /carriers"
              payload: {}
              as: "(no X-User-Role header, X-User-ID auditor_alice)"
              as_user_id: "auditor_alice"
              captures: { e1: $.data.error_id }
            - call: "GET /carriers"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "(no X-User-ID header)"
              captures: { e2: $.data.error_id }
            - call: "GET /carriers"
              payload: {}
              as: "SafetyDirector"
              as_user_id: "auditor_alice"
              captures: { e3: $.data.error_id }
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: "(no X-User-Role header)"
              as_user_id: "auditor_alice"
              captures: { e4: $.data.error_id }
          assert:
            - "trigger[0] -> 401 ERR_UNAUTHENTICATED"
            - "trigger[1] -> 401 ERR_UNAUTHENTICATED"
            - "trigger[2] -> 401 ERR_UNAUTHENTICATED (SafetyDirector is not a declared role)"
            - "trigger[3] -> 401 ERR_UNAUTHENTICATED (auth outranks the role check and the payload check)"
            - "after trigger[3]: no Carrier row exists"

      - name: exclusive_operations_of_other_roles_rejected
        claim_type: role_permission
        grounds:
          - validations[priority 2]
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles
        distinguishing_aspect: |
          Ownership of each write is exclusive, so the segregation is visible in both directions: the
          carrier-side roles cannot register carriers or ingest inspections, the state officer cannot
          file a challenge, the review officer cannot ingest reports, and the safety manager cannot
          create the CAP that only the analyst may create — each a 403, not a 404 or 422.
