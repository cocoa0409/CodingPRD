  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: finance_plan_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[finance-plan-create-stale-enrollment]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one finance-plan create bumps Enrollment.version, a second create still carrying the pre-bump expected_enrollment_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["enrollment created (version captured); one finance plan already created (version advanced)"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id, ev0: $.data.version }
            - call: "POST /enrollments/${eid}/finance-plans"
              payload: { term_months: 6, expected_enrollment_version: "${ev0}" }
              as: Registrar
              captures: { fp1: $.data.id }
          trigger:
            - call: "POST /enrollments/${eid}/finance-plans"
              payload: { term_months: 12, expected_enrollment_version: "${ev0}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: finance_plan_supersede_with_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[finance-plan-create-stale-enrollment]", state_machines.FinancePlan.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Re-reading Enrollment.version after the first plan create and passing it on a second create succeeds, SUPERSEDES the first plan, and advances Enrollment.version again."
        test_recipe:
          setup: ["enrollment with one ACTIVE finance plan; current version re-read"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id, ev0: $.data.version }
            - call: "POST /enrollments/${eid}/finance-plans"
              payload: { term_months: 6, expected_enrollment_version: "${ev0}" }
              as: Registrar
              captures: { fp1: $.data.id }
            - call: "GET /enrollments/${eid}"
              as: Registrar
              captures: { ev1: $.data.version }
          trigger:
            - call: "POST /enrollments/${eid}/finance-plans"
              payload: { term_months: 12, expected_enrollment_version: "${ev1}" }
              as: Registrar
              captures: { fp2: $.data.id }
          assert:
            - "FinancePlan.${fp2}.status == ACTIVE"
            - "FinancePlan.${fp1}.status == SUPERSEDED"

      - name: withdraw_cancels_active_finance_plan_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Enrollment.APPLIED_to_WITHDRAWN, state_machines.FinancePlan.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Withdrawing an enrollment that has an ACTIVE finance plan cascades the plan to CANCELLED."
        test_recipe:
          setup: ["enrollment APPLIED with one ACTIVE finance plan"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", cdl_class: "CLASS_B", classroom_required_hours: 1, range_required_hours: 1, road_required_hours: 1, tuition_cents: 700000 }
              as: SchoolAdmin
              captures: { pid: $.data.id }
            - call: "POST /enrollments"
              payload: { program_id: "${pid}", student_name: "Sam" }
              as: Registrar
              captures: { eid: $.data.id, ev0: $.data.version }
            - call: "POST /enrollments/${eid}/finance-plans"
              payload: { term_months: 6, expected_enrollment_version: "${ev0}" }
              as: Registrar
              captures: { fp: $.data.id }
          trigger:
            - call: "POST /enrollments/${eid}/withdraw"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${eid}.status == WITHDRAWN"
            - "FinancePlan.${fp}.status == CANCELLED"

