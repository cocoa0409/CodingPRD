            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_b}", noncustodial_party_id: "${ncp_b}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
