              as: FinanceAdministrator
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/admin-fee-distributions/${d1}/collect"
              payload: { collected_fee_cents: -1 }
              as: FinanceAdministrator
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/admin-fee-distributions/${d1}/distribute"
              payload: {}
              as: FinanceAdministrator
              captures: { e3: $.data.error_id }
            - call: "POST /gpo/admin-fee-distributions/${d1}/collect"
              payload: { collected_fee_cents: 70 }
              as: FinanceAdministrator
              captures: { st: $.data.status, cf: $.data.collected_fee_cents }
            - call: "POST /gpo/admin-fee-distributions/${d1}/collect"
              payload: { collected_fee_cents: 70 }
              as: FinanceAdministrator
              captures: { e5: $.data.error_id }
          assert:
            - "${sb} == COLLECTED (the declared default) and ${af} == 70 with ${ds} == ACCRUED"
            - "${e1} == ERR_COLLECTION_EXCEEDS_ACCRUAL with HTTP 409 — one cent over the aggregate is refused"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 — a negative remittance never reaches the ceiling check"
            - "${e3} == ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE with HTTP 409 — a COLLECTED-basis contract has no ACCRUED to DISTRIBUTED hop"
            - "collecting exactly 70 succeeds: ${st} == COLLECTED and ${cf} == 70, so the ceiling is inclusive"
            - "${e5} == ERR_INVALID_DISTRIBUTION_STATE with HTTP 409 — the collect hop exists only from ACCRUED"

      - name: contract_state_outranks_the_tier_volume_floor
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: contract_state_beats_tier_volume_floor
          rationale: "The §1.4.1 conflict is realised in §1.8: one POST /gpo/commitments against a DRAFT contract while electing TIER_2 with 100 units violates priority 7 and priority 22 together, and the instance asserts ERR_CONTRACT_NOT_ACTIVE plus the fact that activating the contract then surfaces ERR_COMMITTED_VOLUME_BELOW_TIER from the same body."

      - name: clinical_safety_outranks_cross_reference_referential
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: clinical_safety_beats_xref_referential
          rationale: "The §1.4.1 conflict is realised in §1.8: activating a requires_evidence item whose review is UNDER_REVIEW and whose cross-reference is still PROPOSED returns ERR_CLINICAL_REVIEW_NOT_ENDORSED (priority 10), and only after the review is endorsed does ERR_XREF_NOT_APPROVED (priority 13) appear."

      - name: temporal_overlap_outranks_requested_price_shape
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: temporal_overlap_beats_fiscal_price_shape
          rationale: "The §1.4.1 conflict is realised in §1.8: a TIER_PRICE create that both carries a forbidden requested_price_cents and abuts an existing ACTIVE window on a shared endpoint date returns ERR_ACTIVATION_PERIOD_OVERLAP (priority 20), with ERR_REQUESTED_PRICE_NOT_ALLOWED (priority 21) surfacing only once the window is moved."

  # ─────────────────────────────────────────────────────────────────────────
  # §1.9 ENDPOINTS — the six §1.5 endpoint patterns. Each instance pins the
  # declared side_effects of its endpoint, not just its status code.
  # ─────────────────────────────────────────────────────────────────────────
  - section: endpoints
    instances:

      - name: item_master_replacement_keeps_approved_cross_references_working
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /gpo/members/{member_id}/item-master]
          - entities.Member.fields.item_master
          - entities.ItemCrossReference.fields.member_item_number
        distinguishing_aspect: "The PATCH replaces the whole array rather than merging it, and dropping MI-1 from the master does NOT invalidate the APPROVED cross-reference that names MI-1: classification reads the member's APPROVED cross-references, so a later purchase line for MI-1 still lands ON_CONTRACT, while a NEW cross-reference naming MI-1 is refused with ERR_MEMBER_ITEM_NOT_IN_MASTER."
        test_recipe:
          setup: ["ACTIVE contract C-IM with items V-1 and V-2; member M-1 whose master is [MI-1, MI-2]; an APPROVED cross-reference MI-1 to V-1; a countersigned commitment and an ACTIVE TIER_PRICE activation on V-1 at 10000."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-IM", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-2", item_description: "Mesh graft 10x10", uom: "EA", units_per_uom: 1, base_price_cents: 5000, floor_price_cents: 4000, requires_evidence: false }
              as: ContractManager
              captures: { i2: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 }, { member_item_number: "MI-2", description: "Mesh graft", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id, mv0: $.data.version }
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i1}", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { x1: $.data.id }
            - call: "POST /gpo/item-cross-references/${x1}/approve"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { a1: $.data.id }
            - call: "POST /gpo/price-activations/${a1}/activate"
              payload: {}
              as: ContractManager
          trigger:
            - call: "PATCH /gpo/members/${m1}/item-master"
              payload: { item_master: [ { member_item_number: "MI-2", description: "Mesh graft", units_per_uom: 1 }, { member_item_number: "MI-3", description: "Cautery tip", units_per_uom: 1 } ] }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { mv1: $.data.version }
            - call: "GET /gpo/item-cross-references/${x1}"
              payload: {}
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { xs: $.data.status, xmi: $.data.member_item_number }
            - call: "POST /gpo/item-cross-references"
              payload: { member_id: "${m1}", contract_item_id: "${i2}", member_item_number: "MI-1", match_type: "EXACT", conversion_factor: 1.0 }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { e3: $.data.error_id }
            - call: "POST /gpo/distributor-files"
              payload: { member_id: "${m1}", contract_id: "${c1}", distributor_code: "D-A", period_start: "2026-08-01", period_end: "2026-09-01", lines: [ { member_item_number: "MI-1", quantity_units: 2, unit_price_paid_cents: 9500, purchase_date: "2026-08-05" } ] }
              as: DistributorAgent
              captures: { f1: $.data.id }
            - call: "POST /gpo/distributor-files/${f1}/validate"
              payload: {}
              as: DistributorAgent
            - call: "POST /gpo/distributor-files/${f1}/load"
              payload: {}
              as: ComplianceAnalyst
              captures: { fs: $.data.status }
            - call: "GET /gpo/purchase-lines"
              payload: { distributor_file_id: "${f1}", classification: "ON_CONTRACT" }
              as: ComplianceAnalyst
              captures: { pcls: "$.data[0].classification", pmv: "$.data[0].matched_vendor_item_number" }
          assert:
            - "the PATCH returns 200 with item_master exactly [MI-2, MI-3] — MI-1 is gone, so the array is replaced and not merged"
            - "${mv1} == ${mv0} + 1 and no other Member field moved"
            - "${xs} == APPROVED and ${xmi} == MI-1 — the historical mapping survives its master entry"
            - "${e3} == ERR_MEMBER_ITEM_NOT_IN_MASTER — a NEW cross-reference must name a current master entry"
            - "${fs} == LOADED and the ON_CONTRACT filter returns exactly 1 row with ${pcls} == ON_CONTRACT and ${pmv} == V-1: the MI-1 line still classified through the surviving APPROVED cross-reference"

      - name: logical_clock_defaults_then_stamps_every_later_load
