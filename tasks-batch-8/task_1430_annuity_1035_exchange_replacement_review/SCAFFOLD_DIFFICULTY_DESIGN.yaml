# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Annuity 1035 Exchange & Replacement Review
# Every instance is a self-contained empty-DB recipe. Canonical fixture:
#   clock default 2026-08-01T00:00:00Z
#   contract K_STD: issue 2021-09-01, value 10,000,000, basis 8,000,000,
#     schedule 700/600/500/400/300/200/100 bps for years 1..7, rider base
#     12,000,000, rider fee 95 bps
#   -> completed years at 2026-08-01 = 4 (year 5, 300 bps);
#      at settlement 2026-09-15 (= +45d) = 5 (year 6, 200 bps)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: surrender_charge_today_vs_settlement
        grounds:
          - calculations.surrender_charge_schedule
          - entities.ExistingContract.fields.surrender_schedule
          - entities.ComparisonAnalysis.fields.surrender_charge_at_settlement_cents
        distinguishing_aspect: |
          Two valid readings of "the surrender charge" on the SAME ExistingContract
          diverge: the chronological as_of_today variant reads 300 bps (year 5)
          while the forward-looking at_settlement variant crosses the 2026-09-01
          anniversary inside the 45-day lag and reads 200 bps (year 6).
        test_recipe:
          setup:
            - "Producer, senior client, contract K_STD (issue 2021-09-01, value 10,000,000, basis 8,000,000, rider base 12,000,000)"
            - "FULL case submitted and in SUITABILITY_REVIEW; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${case_v}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "ComparisonAnalysis.surrender_pct_bps_today == 300"
            - "ComparisonAnalysis.surrender_charge_today_cents == 300000"
            - "ComparisonAnalysis.surrender_pct_bps_at_settlement == 200"
            - "ComparisonAnalysis.surrender_charge_at_settlement_cents == 200000"
            - "surrender_charge_today_cents != surrender_charge_at_settlement_cents (300000 vs 200000 for identical contract data)"

      - name: rescission_rate_completed_vs_submitted_basis
        grounds:
          - calculations.producer_churn_metrics
          - entities.Producer.fields.rescission_rate_completed_bps
          - entities.Producer.fields.rescission_rate_submitted_bps
        distinguishing_aspect: |
          Same ActivityEvent stream on the Producer, two denominators: with
          1 completion, 1 rescission and 2 submissions the completed-basis rate
          is 10000 bps while the submitted-basis rate is 5000 bps — a different
          entity domain (Producer) from the surrender-charge instance.
        test_recipe:
          setup:
            - "Junior client (dob 1990-06-15 -> 20-day free look); two K_STD contracts CN-A, CN-B"
            - "Case A driven to IN_FREE_LOOK then COMPLETED; case B driven to IN_FREE_LOOK then RESCINDED at 2026-08-01 (within window)"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Jim Junior", date_of_birth: "1990-06-15", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_a: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-B", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_b: $.data.id } }
            # --- case A to IN_FREE_LOOK ---
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_a}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_a: $.data.id } }
            - { call: "POST /cases/${case_a}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_a}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv_a: $.data.version } }
            - { call: "POST /cases/${case_a}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_a1: $.data.id } }
            - { call: "POST /cases/${case_a}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_a2: $.data.id } }
            - { call: "POST /cases/${case_a}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_a3: $.data.id } }
            - { call: "POST /documents/${d_a1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_a2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_a3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_a}/comparison-analyses", payload: { expected_case_version: "${cv_a}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_a}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_a}/approve", payload: { rationale: "approved" }, as: Principal, as_user_id: "prin-1" }
            - { call: "POST /cases/${case_a}/request_funds", payload: {}, as: OperationsDesk, captures: { t_a: $.data.id } }
            - { call: "POST /transfers/${t_a}/mark_received", payload: {}, as: OperationsDesk }
            - { call: "POST /cases/${case_a}/confirm_delivery", payload: {}, as: OperationsDesk }
            # --- case B to IN_FREE_LOOK, then rescinded ---
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_b}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_b}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv_b: $.data.version } }
            - { call: "POST /cases/${case_b}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_b1: $.data.id } }
            - { call: "POST /cases/${case_b}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_b2: $.data.id } }
            - { call: "POST /cases/${case_b}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_b3: $.data.id } }
            - { call: "POST /documents/${d_b1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_b2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_b3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_b}/comparison-analyses", payload: { expected_case_version: "${cv_b}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_b}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_b}/approve", payload: { rationale: "approved" }, as: Principal, as_user_id: "prin-1" }
            - { call: "POST /cases/${case_b}/request_funds", payload: {}, as: OperationsDesk, captures: { t_b: $.data.id } }
            - { call: "POST /transfers/${t_b}/mark_received", payload: {}, as: OperationsDesk }
            - { call: "POST /cases/${case_b}/confirm_delivery", payload: {}, as: OperationsDesk }
            - { call: "POST /cases/${case_b}/rescind", payload: {}, as: Producer, as_user_id: "${p_id}" }
            # --- complete case A after its deadline (2026-08-21) ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /cases/${case_a}/complete", payload: {}, as: OperationsDesk }
          trigger:
            - { call: "GET /producers/${p_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "Producer.submitted_case_count_12m == 2"
            - "Producer.completed_exchange_count_12m == 1"
            - "Producer.rescinded_exchange_count_12m == 1"
            - "Producer.rescission_rate_completed_bps == 10000"
            - "Producer.rescission_rate_submitted_bps == 5000"
            - "rescission_rate_completed_bps != rescission_rate_submitted_bps for identical event data"
            - "Producer.status == ACTIVE (completed_12m == 1 < CHURN_FLAG_MIN_COMPLETED_12M, so no flag despite the 10000 bps rate)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: partial_basis_allocation_rounding_order
        grounds:
          - calculations.tax_basis_allocation
          - entities.ComparisonAnalysis.fields.basis_transferred_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned multiply-then-divide-once order
          yields floor(8,000,000 x 3,333,333 / 10,000,000) = 2,666,666; the
          alternative ratio-first rounding (0.3333 x 8,000,000) yields
          2,666,400 — different cents for identical inputs.
        test_recipe:
          setup:
            - "Producer, client, K_STD contract; PARTIAL case for 3,333,333 in SUITABILITY_REVIEW; clock default"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "PARTIAL", exchange_amount_cents: 3333333, new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${case_v}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "ComparisonAnalysis.exchange_base_cents == 3333333"
            - "ComparisonAnalysis.surrender_charge_today_cents == 99999 (floor(3333333*300/10000))"
            - "ComparisonAnalysis.surrender_charge_at_settlement_cents == 66666 (floor(3333333*200/10000))"
            - "ComparisonAnalysis.basis_transferred_cents == 2666666"
            - "ComparisonAnalysis.basis_remaining_cents == 5333334"
            - "basis_transferred_cents + basis_remaining_cents == 8000000 (no basis leaked or created by rounding)"

      - name: net_replacement_cost_pinned_order
        grounds:
          - calculations.net_replacement_cost
          - entities.ComparisonAnalysis.fields.net_replacement_cost_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the bonus is computed on the
          NET-of-charge amount received (9,800,000 -> 98,000), not on the gross
          exchange base (which would give 100,000); the scaffold pins
          charge -> received -> bonus -> net_cost, yielding 2,102,000.
        test_recipe:
          setup:
            - "Producer, client, K_STD contract (rider base 12,000,000); FULL case in SUITABILITY_REVIEW; clock default"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${case_v}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "ComparisonAnalysis.amount_received_cents == 9800000"
            - "ComparisonAnalysis.bonus_credit_cents == 98000"
            - "ComparisonAnalysis.benefit_loss_cents == 2000000"
            - "ComparisonAnalysis.net_replacement_cost_cents == 2102000"
            - "ComparisonAnalysis.break_even_years == 2 (net 405 bps old vs 485 bps new, floored annual steps)"

      - name: benefit_loss_cap_branch
        grounds:
          - calculations.benefit_loss_estimate
          - entities.ComparisonAnalysis.fields.benefit_loss_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: rider flag on,
          rider_benefit_base 35,000,000 vs value 10,000,000 — raw in-the-money
          25,000,000 exceeds RIDER_LOSS_CAP_CENTS, so the nested min/max pins
          the output to exactly 20,000,000 (cap binds, not the raw difference).
        test_recipe:
          setup:
            - "Producer, client, contract identical to K_STD except rider_benefit_base_cents 35,000,000; FULL case in SUITABILITY_REVIEW"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 35000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${case_v}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "ComparisonAnalysis.benefit_loss_cents == 20000000 (RIDER_LOSS_CAP_CENTS binds; raw in-the-money 25,000,000 is NOT returned)"
            - "ComparisonAnalysis.net_replacement_cost_cents == 20102000 (200000 + 20000000 - 98000)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_info_request_cycle_and_fork
        grounds:
          - state_machines.ExchangeCase.SUITABILITY_REVIEW_to_INFO_REQUESTED
          - state_machines.ExchangeCase.INFO_REQUESTED_to_SUITABILITY_REVIEW
          - state_machines.ExchangeCase.PENDING_PRINCIPAL_to_APPROVED
        distinguishing_aspect: |
          ExchangeCase is branching with a revert cycle: SUITABILITY_REVIEW ->
          INFO_REQUESTED -> SUITABILITY_REVIEW (via document resubmission)
          before the fork into PENDING_PRINCIPAL -> APPROVED; each branch
          appends a differently-staged ReviewDecision.
        test_recipe:
          setup:
            - "Producer, client, K_STD contract; case submitted, in review; SUITABILITY_FORM document rejected once, then resubmitted after request_info"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
