# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1912 Rail Grade Crossing Safety Program. 19 instances across 9 rules.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: crossing_exposure_snapshot_vs_projected
        grounds:
          - calculations.exposure_index
          - entities.Crossing.fields.exposure_index
          - entities.Crossing.fields.projected_exposure_index
        distinguishing_aspect: |
          One inventory record yields two different exposure values: snapshot (20.00) uses recorded
          counts while projected (25.60) compounds 2%/3% growth over 5 years; the sibling instance
          lives on FundingProgram (money), so dual-variant logic spans two entity domains.
        test_recipe:
          setup:
            - "A registered locality to act as road authority"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "City of Example", state_code: "KS", contact_email: "pw@example.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-100001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "ARTERIAL", annual_train_count: 3650, train_speed_max_mph: 40, aadt: 2000, school_bus_count: 4, sight_distance_rating: 4, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
          assert:
            - "Crossing.${cx_id}.exposure_index == 20.00"
            - "Crossing.${cx_id}.projected_exposure_index == 25.60"
            - "Crossing.${cx_id}.hazard_score == 50.00"
            - "Crossing.${cx_id}.diagnostic_review_due == true"

      - name: funding_allocation_waterfall_vs_proportional
        grounds:
          - calculations.funding_allocation
          - entities.FundingProgram.fields.allocation_method
        distinguishing_aspect: |
          Identical project set and pool produce different awards: waterfall funds P1 fully (600000)
          and stops, proportional spreads 500000/416666/83333; entity domain is FundingProgram money,
          distinct from the Crossing exposure sibling instance.
        test_recipe:
          setup:
            - "Two funding programs (WATERFALL_BY_RANK and PROPORTIONAL_SHARE, pool 1000000 each) and two trios of ELIGIBLE projects with identical costs 600000/500000/100000 and rank scores 8.50/7.50/6.50 (bus counts 6/4/2)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Alloc Town", state_code: "KS", contact_email: "pw@alloc.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-200001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 6, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { w1_cx: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-200002", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 4, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { w2_cx: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-200003", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 2, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { w3_cx: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-200004", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 6, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { p1_cx: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-200005", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 4, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { p2_cx: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-200006", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 2, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { p3_cx: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2026, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog_w: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2027, apportionment_cents: 1000000, allocation_method: "PROPORTIONAL_SHARE" }
              as: ProgramAdministrator
              captures: { prog_p: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${w1_cx}", program_id: "${prog_w}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 600000 }
              as: RailSafetyOfficer
              captures: { w1: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${w2_cx}", program_id: "${prog_w}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 500000 }
              as: RailSafetyOfficer
              captures: { w2: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${w3_cx}", program_id: "${prog_w}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 100000 }
              as: RailSafetyOfficer
              captures: { w3: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${p1_cx}", program_id: "${prog_p}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 600000 }
              as: RailSafetyOfficer
              captures: { p1: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${p2_cx}", program_id: "${prog_p}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 500000 }
              as: RailSafetyOfficer
              captures: { p2: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${p3_cx}", program_id: "${prog_p}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 100000 }
              as: RailSafetyOfficer
              captures: { p3: $.data.id }
            - call: "POST /upgrade-projects/${w1}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${w2}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${w3}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${p1}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${p2}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${p3}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /funding-programs/${prog_w}/transition"
              payload: { to_status: "ALLOCATION_LOCKED" }
              as: ProgramAdministrator
            - call: "POST /funding-programs/${prog_p}/transition"
              payload: { to_status: "ALLOCATION_LOCKED" }
              as: ProgramAdministrator
            - call: "GET /upgrade-projects/${w1}"
              as: ProgramAdministrator
              captures: { w1_status: $.data.status, w1_tentative: $.data.tentative_award_cents }
            - call: "GET /upgrade-projects/${w2}"
              as: ProgramAdministrator
              captures: { w2_status: $.data.status, w2_tentative: $.data.tentative_award_cents }
            - call: "GET /upgrade-projects/${w3}"
              as: ProgramAdministrator
              captures: { w3_status: $.data.status }
            - call: "GET /upgrade-projects/${p1}"
              as: ProgramAdministrator
              captures: { p1_status: $.data.status, p1_tentative: $.data.tentative_award_cents }
            - call: "GET /upgrade-projects/${p2}"
              as: ProgramAdministrator
              captures: { p2_status: $.data.status, p2_tentative: $.data.tentative_award_cents }
            - call: "GET /upgrade-projects/${p3}"
              as: ProgramAdministrator
              captures: { p3_status: $.data.status, p3_tentative: $.data.tentative_award_cents }
          assert:
            - "waterfall: UpgradeProject.${w1} status == SELECTED, tentative_award_cents == 600000"
            - "waterfall: UpgradeProject.${w2} status == ELIGIBLE, tentative_award_cents is null (sweep stopped: 500000 > 400000 remaining)"
            - "waterfall: UpgradeProject.${w3} status == ELIGIBLE (never reached after stop)"
            - "proportional: UpgradeProject.${p1} status == SELECTED, tentative_award_cents == 500000"
            - "proportional: UpgradeProject.${p2} status == SELECTED, tentative_award_cents == 416666"
            - "proportional: UpgradeProject.${p3} status == SELECTED, tentative_award_cents == 83333"
            - "same inputs, different awards across variants: w1 600000 != p1 500000"

  - rule_id: combinatorial_formula
    instances:
      - name: hazard_score_tiered_composition
        grounds:
          - calculations.hazard_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — tiered exposure band (HIGH x1.20 vs
          SEVERE x1.40), device factor, and poor-sight multiplier compose multiplicatively:
          (10.00*1.20)*1.50 == 18.00 and (25.00*1.40 + 20*0.5)*1.00*1.15 == 51.75.
        test_recipe:
          setup:
            - "A registered locality"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Hazardville", state_code: "KS", contact_email: "pw@haz.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-300001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "COLLECTOR", annual_train_count: 730, train_speed_max_mph: 30, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "PASSIVE_CROSSBUCK" }
              as: ProgramAdministrator
              captures: { c1: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-300002", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "COLLECTOR", annual_train_count: 1825, train_speed_max_mph: 30, aadt: 5000, school_bus_count: 20, sight_distance_rating: 1, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { c2: $.data.id }
          assert:
            - "Crossing.${c1}.exposure_index == 10.00 (HIGH band)"
            - "Crossing.${c1}.hazard_score == 18.00  # (10.00*1.20 + 0 + 0) * 1.50 * 1.00"
            - "Crossing.${c2}.exposure_index == 25.00 (SEVERE band)"
            - "Crossing.${c2}.hazard_score == 51.75  # (25.00*1.40 + 0 + 10.0) * 1.00 * 1.15"

      - name: match_split_per_award_rounding
        grounds:
          - calculations.match_split
          - entities.UpgradeProject.fields.federal_share_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — each award line rounds its federal share
          half-up FIRST (416666 -> 333333, 83333 -> 66666), then program totals sum the rounded
          lines (encumbered 499999); rounding only the aggregate would misplace cents.
        test_recipe:
          setup:
            - "Locality, two crossings (hazard ranks 8.50 and 7.50 via bus counts 6 and 4), a WATERFALL program with pool 1000000, two projects of cost 416666 and 83333, both nominated to ELIGIBLE"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Split City", state_code: "KS", contact_email: "pw@split.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-300101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 6, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_a: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-300102", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 4, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_b: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2030, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_a}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 416666 }
              as: RailSafetyOfficer
              captures: { pa: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_b}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 83333 }
              as: RailSafetyOfficer
              captures: { pb: $.data.id }
            - call: "POST /upgrade-projects/${pa}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${pb}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /funding-programs/${prog}/transition"
              payload: { to_status: "ALLOCATION_LOCKED" }
              as: ProgramAdministrator
              captures: { prog_v_locked: $.data.version }
          trigger:
            - call: "POST /upgrade-projects/${pa}/award"
              payload: { expected_funding_program_version: "${prog_v_locked}" }
              as: ProgramAdministrator
              captures: { pa_fed: $.data.federal_share_cents, pa_state: $.data.state_share_cents, pa_awarded: $.data.awarded_cents }
            - call: "GET /funding-programs/${prog}"
              as: ProgramAdministrator
              captures: { prog_v_mid: $.data.version }
            - call: "POST /upgrade-projects/${pb}/award"
              payload: { expected_funding_program_version: "${prog_v_mid}" }
              as: ProgramAdministrator
              captures: { pb_fed: $.data.federal_share_cents, pb_state: $.data.state_share_cents }
            - call: "GET /funding-programs/${prog}"
              as: ProgramAdministrator
              captures: { prog_avail: $.data.available_cents, prog_enc: $.data.encumbered_cents }
          assert:
            - "UpgradeProject.${pa}: awarded_cents == 416666, federal_share_cents == 333333, state_share_cents == 83333"
            - "UpgradeProject.${pb}: federal_share_cents == 66666, state_share_cents == 16667"
            - "FundingProgram.${prog}: encumbered_cents == 499999 (sum of per-line awards), available_cents == 500001"

      - name: quiet_zone_ssm_pinned_evaluation_order
        grounds:
          - calculations.quiet_zone_risk
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned order — SSM necessity depends on
          the post-SSM index which depends on chosen SSMs. Order: pre-check first (42.00 > 40.00 so
          not auto-approved), then credit computation (MEDIANS 0.40 on the 50.00 crossing), then
          post-check (32.00 <= 40.00 -> APPROVED).
        test_recipe:
          setup:
            - "Locality (zone owner), diagnostic team, two ACTIVE crossings with hazard scores 50.00 and 34.00, each holding an ACCEPTED diagnostic review (team dates 2 days apart)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Quiet City", state_code: "KS", contact_email: "pw@quiet.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /diagnostic-teams"
              payload: { team_name: "Team Alpha", lead_agency: "DOT" }
              as: ProgramAdministrator
              captures: { team_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-300201", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "ARTERIAL", annual_train_count: 2190, train_speed_max_mph: 40, aadt: 5000, school_bus_count: 16, sight_distance_rating: 4, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { qza_cx: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-300202", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 3650, train_speed_max_mph: 40, aadt: 2000, school_bus_count: 20, sight_distance_rating: 4, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { qzb_cx: $.data.id }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${qza_cx}", team_id: "${team_id}", scheduled_date: "2026-09-10" }
              as: ProgramAdministrator
              captures: { rev_a: $.data.id }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${qzb_cx}", team_id: "${team_id}", scheduled_date: "2026-09-12" }
              as: ProgramAdministrator
              captures: { rev_b: $.data.id }
            - call: "POST /diagnostic-reviews/${rev_a}/transition"
              payload: { to_status: "IN_SESSION" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev_a}/issue-recommendations"
              payload: { recommendations: ["UPGRADE_DEVICES"] }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev_a}/transition"
              payload: { to_status: "ACCEPTED" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev_b}/transition"
              payload: { to_status: "IN_SESSION" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev_b}/issue-recommendations"
              payload: { recommendations: ["NO_ACTION"] }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev_b}/transition"
              payload: { to_status: "ACCEPTED" }
              as: RailSafetyOfficer
            - call: "POST /quiet-zone-applications"
              payload: { locality_id: "${loc_id}", notes: "downtown zone" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { qz_id: $.data.id }
            - call: "POST /quiet-zone-applications/${qz_id}/members"
              payload: { crossing_id: "${qza_cx}", ssm_codes: ["MEDIANS"] }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /quiet-zone-applications/${qz_id}/members"
              payload: { crossing_id: "${qzb_cx}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
          trigger:
            - call: "POST /quiet-zone-applications/${qz_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /quiet-zone-applications/${qz_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RailSafetyOfficer
            - call: "POST /quiet-zone-applications/${qz_id}/decide"
              as: RailSafetyOfficer
              captures: { qz_status: $.data.status, qz_pre: $.data.riwh_pre_ssm, qz_post: $.data.riwh_post_ssm }
          assert:
            - "QuietZoneApplication.${qz_id}.riwh_pre_ssm == 42.00  # mean(50.00, 34.00)"
            - "QuietZoneApplication.${qz_id}.riwh_post_ssm == 32.00  # mean(50.00*0.60, 34.00)"
            - "QuietZoneApplication.${qz_id}.status == APPROVED (pre > NSRT did NOT reject; post <= NSRT approves)"

  - rule_id: non_linear_state_machine
    instances:
      - name: closure_agreement_counter_cycle
        grounds:
          - state_machines.ClosureAgreement.PROPOSED_to_COUNTERED
          - state_machines.ClosureAgreement.COUNTERED_to_PROPOSED
        distinguishing_aspect: |
          Cyclic machine on ClosureAgreement: PROPOSED -> COUNTERED -> PROPOSED with the round
          counter advancing each lap; the sibling non-linear machine is IncidentReport's branching
          fork-join, a different entity.
        test_recipe:
          setup:
            - "Locality and an ACTIVE crossing (exposure 20.00, so a CLOSURE agreement computes a 350000-cent minimum incentive)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Cycle City", state_code: "KS", contact_email: "pw@cycle.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-400001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "ARTERIAL", annual_train_count: 3650, train_speed_max_mph: 40, aadt: 2000, school_bus_count: 4, sight_distance_rating: 4, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_id}", locality_id: "${loc_id}", closure_type: "CLOSURE" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag_id: $.data.id }
            - call: "POST /closure-agreements/${ag_id}/transition"
              payload: { to_status: "PROPOSED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /closure-agreements/${ag_id}/counter"
              payload: { proposed_incentive_cents: 400000 }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { st2: $.data.status, r2: $.data.negotiation_round }
            - call: "POST /closure-agreements/${ag_id}/counter"
              payload: { proposed_incentive_cents: 375000 }
              as: RailSafetyOfficer
              as_user_id: "officer-2"
              captures: { st3: $.data.status, r3: $.data.negotiation_round, offer3: $.data.current_offer_cents }
          assert:
            - "after locality counter: status == COUNTERED, negotiation_round == 2, current_offer_cents == 400000"
            - "after DOT counter: status == PROPOSED (cycle closed), negotiation_round == 3, current_offer_cents == 375000"
            - "ClosureAgreement.${ag_id}.computed_incentive_cents == 350000 (unchanged by counters)"

      - name: incident_investigation_fork_join
        grounds:
          - state_machines.IncidentReport.SCREENED_to_FIELD_INVESTIGATION
          - state_machines.IncidentReport.SCREENED_to_DESK_REVIEW
        distinguishing_aspect: |
          Branching fork-join on IncidentReport: SCREENED forks to FIELD_INVESTIGATION or DESK_REVIEW
          with divergent side effects (FIELD sets the crossing's diagnostic_review_due, DESK does not)
          and both join at FINDINGS_ISSUED; the sibling machine is ClosureAgreement's cycle.
        test_recipe:
          setup:
            - "Locality and an ACTIVE crossing (exposure 5.00, diagnostic_review_due initially false)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Fork City", state_code: "KS", contact_email: "pw@fork.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-400101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id, due0: $.data.diagnostic_review_due }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2026-06-15T14:30:00Z", severity: "CASUALTY", fatalities: 1, property_damage_cents: 2000000 }
              as: RailSafetyOfficer
              captures: { inc1: $.data.id, inc1_fra: $.data.fra_reportable }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2026-07-01T09:00:00Z", severity: "PROPERTY_DAMAGE", property_damage_cents: 500000 }
              as: RailSafetyOfficer
              captures: { inc2: $.data.id }
            - call: "POST /incident-reports/${inc1}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${inc2}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${inc1}/transition"
              payload: { to_status: "FIELD_INVESTIGATION" }
              as: RailSafetyOfficer
              captures: { tr1: $.data.investigation_track }
            - call: "POST /incident-reports/${inc2}/transition"
              payload: { to_status: "DESK_REVIEW" }
              as: RailSafetyOfficer
              captures: { tr2: $.data.investigation_track }
            - call: "POST /incident-reports/${inc1}/issue-findings"
              payload: { findings_summary: "gate arm failed to descend", warning_devices_functioning: false }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /incident-reports/${inc2}/issue-findings"
              payload: { findings_summary: "driver error; devices functioned", warning_devices_functioning: true }
              as: RailSafetyOfficer
            - call: "GET /crossings/${cx_id}"
              as: ProgramAdministrator
              captures: { due_now: $.data.diagnostic_review_due, cnt: $.data.incident_count_5yr, hz: $.data.hazard_score }
          assert:
            - "IncidentReport.${inc1}.investigation_track == FIELD_INVESTIGATION and .fra_reportable == true (fatality)"
            - "IncidentReport.${inc2}.investigation_track == DESK_REVIEW and .status == FINDINGS_ISSUED (join point reached via both branches)"
            - "Crossing.${cx_id}.diagnostic_review_due was false at creation and == true after the FIELD fork (divergent branch side effect)"
            - "Crossing.${cx_id}.incident_count_5yr == 2 after both findings issued"
            - "Crossing.${cx_id}.hazard_score == 21.50  # (5.00*1.10 + 16 + 0) * 1.00 * 1.00"

  - rule_id: transitive_cascade
    instances:
      - name: incident_findings_cascade_to_program_demand
        grounds:
          - state_machines.IncidentReport.DESK_REVIEW_to_FINDINGS_ISSUED
          - state_machines.UpgradeProject.ELIGIBLE_to_PROPOSED
          - entities.FundingProgram.fields.eligible_demand_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by issue-findings: incident -> Crossing (incident_count_5yr 0->1,
          hazard 12.00->20.00) -> UpgradeProject (ELIGIBLE -> PROPOSED, score_stale) ->
          FundingProgram (eligible_demand_cents 300000 -> 0). Sibling cascade is triggered by
          confirm-closure, a different transition.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing (exposure 10.00, hazard 12.00); WATERFALL program pool 1000000; project of cost 300000 nominated to ELIGIBLE (priority_score pinned 12.00, program demand 300000)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Cascade City", state_code: "KS", contact_email: "pw@casc.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-400201", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 730, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2028, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_id}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 300000 }
              as: RailSafetyOfficer
              captures: { pj: $.data.id }
            - call: "POST /upgrade-projects/${pj}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
              captures: { pj_score: $.data.priority_score }
            - call: "POST /incident-reports"
              payload: { crossing_id: "${cx_id}", occurred_at: "2025-01-10T08:00:00Z", severity: "PROPERTY_DAMAGE", property_damage_cents: 500000 }
              as: RailSafetyOfficer
              captures: { inc: $.data.id }
            - call: "POST /incident-reports/${inc}/transition"
              payload: { to_status: "SCREENED" }
              as: RailSafetyOfficer
            - call: "POST /incident-reports/${inc}/transition"
              payload: { to_status: "DESK_REVIEW" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /incident-reports/${inc}/issue-findings"
              payload: { findings_summary: "crossbuck obscured by vegetation", warning_devices_functioning: true }
              as: RailSafetyOfficer
            - call: "GET /crossings/${cx_id}"
              as: ProgramAdministrator
              captures: { cx_cnt: $.data.incident_count_5yr, cx_hz: $.data.hazard_score }
            - call: "GET /upgrade-projects/${pj}"
              as: ProgramAdministrator
              captures: { pj_status: $.data.status, pj_stale: $.data.score_stale, pj_pscore: $.data.priority_score }
            - call: "GET /funding-programs/${prog}"
              as: ProgramAdministrator
              captures: { prog_demand: $.data.eligible_demand_cents }
          assert:
            - "link 1: Crossing.${cx_id}.incident_count_5yr == 1 and hazard_score == 20.00  # (10.00*1.20 + 8) * 1.00 * 1.00"
            - "link 2: UpgradeProject.${pj}.status == PROPOSED, score_stale == true, priority_score still pinned at 12.00"
            - "link 3: FundingProgram.${prog}.eligible_demand_cents == 0 (was 300000)"

      - name: crossing_closure_cascade_suspends_quiet_zone
        grounds:
          - state_machines.Crossing.CLOSURE_PENDING_to_CLOSED
          - state_machines.QuietZoneCrossing.MEMBER_to_REMOVED
          - state_machines.QuietZoneApplication.EFFECTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain triggered by confirm-closure: Crossing CLOSURE_PENDING -> CLOSED ->
          QuietZoneCrossing MEMBER -> REMOVED -> QuietZoneApplication riwh recompute over an empty
          member set -> EFFECTIVE -> SUSPENDED. Trigger differs from the incident-findings sibling.
        test_recipe:
          setup:
            - "Locality (owner); diagnostic team; crossing CD (hazard 22.00) with ACCEPTED review; quiet zone containing CD, EFFECTIVE (riwh 22.00 <= NSRT at submit); an EXECUTED closure agreement moving CD to CLOSURE_PENDING; a PLANNED railroad work order on CD"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Closeville", state_code: "KS", contact_email: "pw@close.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /diagnostic-teams"
              payload: { team_name: "Team Beta", lead_agency: "DOT" }
              as: ProgramAdministrator
              captures: { team_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-400301", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 730, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 20, sight_distance_rating: 4, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cd: $.data.id }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cd}", team_id: "${team_id}", scheduled_date: "2026-09-10" }
              as: ProgramAdministrator
              captures: { rev: $.data.id }
            - call: "POST /diagnostic-reviews/${rev}/transition"
              payload: { to_status: "IN_SESSION" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev}/issue-recommendations"
              payload: { recommendations: ["CLOSE_CROSSING"] }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev}/transition"
              payload: { to_status: "ACCEPTED" }
              as: RailSafetyOfficer
            - call: "POST /quiet-zone-applications"
              payload: { locality_id: "${loc_id}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { qz: $.data.id }
            - call: "POST /quiet-zone-applications/${qz}/members"
              payload: { crossing_id: "${cd}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { member: $.data.id }
            - call: "POST /quiet-zone-applications/${qz}/transition"
              payload: { to_status: "SUBMITTED" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /quiet-zone-applications/${qz}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: RailSafetyOfficer
            - call: "POST /quiet-zone-applications/${qz}/decide"
              as: RailSafetyOfficer
              captures: { qz_decided: $.data.status }
            - call: "POST /quiet-zone-applications/${qz}/transition"
              payload: { to_status: "EFFECTIVE" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cd}", category: "SIGNAL", responsible_party: "RAILROAD", effective_from: "2026-08-01" }
              as: ProgramAdministrator
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cd}", category: "SIGNAL", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { wo: $.data.id }
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cd}", locality_id: "${loc_id}", closure_type: "CLOSURE" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag: $.data.id }
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "PROPOSED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "DOT_ACCEPTED" }
              as: RailSafetyOfficer
              as_user_id: "officer-2"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "LOCALITY_RATIFIED" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "EXECUTED" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /crossings/${cd}/confirm-closure"
              as: ProgramAdministrator
            - call: "GET /quiet-zone-crossings/${member}"
              as: ProgramAdministrator
              captures: { member_status: $.data.membership_status }
            - call: "GET /quiet-zone-applications/${qz}"
              as: ProgramAdministrator
              captures: { qz_status: $.data.status }
            - call: "GET /maintenance-work-orders/${wo}"
              as: ProgramAdministrator
              captures: { wo_status: $.data.status }
          assert:
            - "decide produced APPROVED (riwh_pre 22.00 <= NSRT 40.00) and activate reached EFFECTIVE before closure"
            - "link 1: Crossing.${cd}.status == CLOSED"
            - "link 2: QuietZoneCrossing.${member}.membership_status == REMOVED"
            - "link 3: QuietZoneApplication.${qz}.status == SUSPENDED (no MEMBER rows remain)"
            - "fan-out: MaintenanceWorkOrder.${wo}.status == CANCELLED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: award_state_check_beats_fiscal_check
        grounds:
          - validations[priority=4]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the award targets a PROPOSED project
          (state violation, p4) in a program whose pool (100000) is below the cost (600000)
          (fiscal violation, p10); the state error ERR_PROJECT_NOT_SELECTED must win.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing; WATERFALL program (pool 100000, still OPEN); project of cost 600000 never nominated (stays PROPOSED)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Priority City", state_code: "KS", contact_email: "pw@prio.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-500001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 6, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2031, apportionment_cents: 100000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_id}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 600000 }
              as: RailSafetyOfficer
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /upgrade-projects/${pj}/award"
              payload: { expected_funding_program_version: "${prog_v}" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "award rejected with error_id == ERR_PROJECT_NOT_SELECTED (http 409), NOT ERR_INSUFFICIENT_FUNDS"
            - "both violations held: project.status == PROPOSED and available_cents (100000) < estimated_cost_cents (600000)"

      - name: work_order_safety_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: one request both lacks the
          flagging plan for fouling work (safety, p6) and overlaps an existing window (temporal, p9);
          ERR_FLAGGING_PLAN_REQUIRED must win. Different pair from the state-vs-fiscal sibling.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing (railroad BNSF); ACTIVE SIGNAL assignment to RAILROAD; existing PLANNED work order occupying [2026-09-01T08:00Z, 2026-09-01T12:00Z)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Safety City", state_code: "KS", contact_email: "pw@safety.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-500101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", responsible_party: "RAILROAD", effective_from: "2026-08-01" }
              as: ProgramAdministrator
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
          trigger:
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T11:00:00Z", window_end: "2026-09-01T13:00:00Z", fouls_track: true }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { err: $.data.error_id }
          assert:
            - "create rejected with error_id == ERR_FLAGGING_PLAN_REQUIRED (http 422), NOT ERR_WORK_WINDOW_OVERLAP"
            - "both violations held: fouls_track true without flagging_vendor AND [11:00,13:00) overlaps [08:00,12:00)"

  - rule_id: boundary_precision_check
    instances:
      - name: exposure_threshold_exact_vs_below
        grounds:
          - calculations.exposure_index
        distinguishing_aspect: |
          Metric exposure_index at the review threshold: 10.00 exactly triggers
          diagnostic_review_due (>= semantics), 9.99 does not; exercised through PATCH
          /crossings/{id}/inventory. Sibling boundary is pool cents through the lock endpoint.
        test_recipe:
          setup:
            - "Locality; crossing A at aadt 4995 (exposure 9.99, review not due); crossing B at aadt 5000 (exposure 10.00, review due at creation)"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Boundary City", state_code: "KS", contact_email: "pw@bound.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-600001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 730, train_speed_max_mph: 25, aadt: 4995, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_a: $.data.id, a_exp: $.data.exposure_index, a_due: $.data.diagnostic_review_due, a_v: $.data.version }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-600002", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 730, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_b: $.data.id, b_exp: $.data.exposure_index, b_due: $.data.diagnostic_review_due }
          trigger:
            - call: "PATCH /crossings/${cx_a}/inventory"
              payload: { expected_crossing_version: "${a_v}", aadt: 5000 }
              as: ProgramAdministrator
              captures: { a_exp2: $.data.exposure_index, a_due2: $.data.diagnostic_review_due }
          assert:
            - "Crossing.${cx_a} before patch: exposure_index == 9.99 and diagnostic_review_due == false"
            - "Crossing.${cx_b} at creation: exposure_index == 10.00 and diagnostic_review_due == true (equality triggers)"
            - "Crossing.${cx_a} after patch: exposure_index == 10.00 and diagnostic_review_due == true"

      - name: waterfall_fit_at_exact_pool
        grounds:
          - calculations.funding_allocation
        distinguishing_aspect: |
          Metric pool cents at the fit boundary: a project whose cost equals the remaining pool
          exactly IS funded (>= semantics, remaining becomes 0) while the next project of cost 1
          stops the sweep; exercised through the program lock endpoint, distinct from the
          exposure/PATCH sibling on both metric and endpoint.
        test_recipe:
          setup:
            - "Locality; crossings X (rank 8.50) and Y (rank 7.50); WATERFALL program pool 600000; P1 cost 600000 on X, P2 cost 1 on Y; both nominated ELIGIBLE"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Exact Pool City", state_code: "KS", contact_email: "pw@pool.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-600101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 6, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_x: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-600102", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 4, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_y: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2032, apportionment_cents: 600000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_x}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 600000 }
              as: RailSafetyOfficer
              captures: { p1: $.data.id }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_y}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 1 }
              as: RailSafetyOfficer
              captures: { p2: $.data.id }
            - call: "POST /upgrade-projects/${p1}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
            - call: "POST /upgrade-projects/${p2}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /funding-programs/${prog}/transition"
              payload: { to_status: "ALLOCATION_LOCKED" }
              as: ProgramAdministrator
            - call: "GET /upgrade-projects/${p1}"
              as: ProgramAdministrator
              captures: { p1_status: $.data.status, p1_tent: $.data.tentative_award_cents }
            - call: "GET /upgrade-projects/${p2}"
              as: ProgramAdministrator
              captures: { p2_status: $.data.status, p2_tent: $.data.tentative_award_cents }
          assert:
            - "UpgradeProject.${p1}: status == SELECTED, tentative_award_cents == 600000 (remaining 600000 >= 600000, exact fit)"
            - "UpgradeProject.${p2}: status == ELIGIBLE, tentative_award_cents is null (remaining 0 < 1 cent, sweep stops)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: project_create_requires_active_crossing
        grounds:
          - validations[priority=4]
          - entities.UpgradeProject.fields.crossing_id
          - state_machines.Crossing.ACTIVE_to_CLOSURE_PENDING
        distinguishing_aspect: |
          Entity pair UpgradeProject x Crossing: project creation is gated on the crossing's
          status (CLOSURE_PENDING after an EXECUTED agreement rejects with ERR_CROSSING_NOT_ACTIVE).
          Sibling dependency crosses QuietZoneApplication x DiagnosticReview.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing with an EXECUTED closure agreement (crossing now CLOSURE_PENDING); an OPEN funding program"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Gate City", state_code: "KS", contact_email: "pw@gate.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-700001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2033, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id }
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cx_id}", locality_id: "${loc_id}", closure_type: "CLOSURE" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
              captures: { ag: $.data.id }
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "PROPOSED" }
              as: RailSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "DOT_ACCEPTED" }
              as: RailSafetyOfficer
              as_user_id: "officer-2"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "LOCALITY_RATIFIED" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /closure-agreements/${ag}/transition"
              payload: { to_status: "EXECUTED" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_id}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 300000 }
              as: RailSafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "project creation rejected with error_id == ERR_CROSSING_NOT_ACTIVE (http 409)"
            - "Crossing.${cx_id}.status == CLOSURE_PENDING at the time of the attempt"

      - name: quiet_zone_submit_requires_accepted_reviews
        grounds:
          - validations[priority=8]
          - state_machines.QuietZoneApplication.DRAFT_to_SUBMITTED
          - entities.DiagnosticReview.fields.status
        distinguishing_aspect: |
          Entity pair QuietZoneApplication x DiagnosticReview: submit is gated on every member
          crossing holding an ACCEPTED review; one member lacks any review and submit fails with
          ERR_DIAGNOSTIC_REVIEW_REQUIRED. Different pair from UpgradeProject x Crossing.
        test_recipe:
          setup:
            - "Locality (owner); team; crossing A with an ACCEPTED review; crossing B with no review; a DRAFT zone containing both"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Review Gap City", state_code: "KS", contact_email: "pw@rg.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /diagnostic-teams"
              payload: { team_name: "Team Gamma", lead_agency: "DOT" }
              as: ProgramAdministrator
              captures: { team_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-700101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_a: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-700102", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_b: $.data.id }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cx_a}", team_id: "${team_id}", scheduled_date: "2026-09-10" }
              as: ProgramAdministrator
              captures: { rev: $.data.id }
            - call: "POST /diagnostic-reviews/${rev}/transition"
              payload: { to_status: "IN_SESSION" }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev}/issue-recommendations"
              payload: { recommendations: ["NO_ACTION"] }
              as: RailSafetyOfficer
            - call: "POST /diagnostic-reviews/${rev}/transition"
              payload: { to_status: "ACCEPTED" }
              as: RailSafetyOfficer
            - call: "POST /quiet-zone-applications"
              payload: { locality_id: "${loc_id}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { qz: $.data.id }
            - call: "POST /quiet-zone-applications/${qz}/members"
              payload: { crossing_id: "${cx_a}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /quiet-zone-applications/${qz}/members"
              payload: { crossing_id: "${cx_b}" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
          trigger:
            - call: "POST /quiet-zone-applications/${qz}/transition"
              payload: { to_status: "SUBMITTED" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "submit rejected with error_id == ERR_DIAGNOSTIC_REVIEW_REQUIRED (http 409)"
            - "Crossing.${cx_b} has zero ACCEPTED DiagnosticReviews at submit time"
            - "QuietZoneApplication.${qz}.status remains DRAFT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: work_window_half_open_overlap
        grounds:
          - validations[priority=9]
          - entities.MaintenanceWorkOrder.fields.window_start
          - entities.MaintenanceWorkOrder.fields.window_end
        distinguishing_aspect: |
          Interval semantics: half-open [window_start, window_end) on resource Crossing — pure
          overlap check where adjacency (end == start) is allowed. Sibling rule uses a positive
          date-buffer on DiagnosticTeam, a different resource and different interval arithmetic.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing (railroad BNSF); ACTIVE SIGNAL assignment to RAILROAD"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Overlap City", state_code: "KS", contact_email: "pw@ovl.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-800001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", responsible_party: "RAILROAD", effective_from: "2026-08-01" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { wo1: $.data.id, wo1_status: $.data.status }
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T14:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { wo2: $.data.id, wo2_status: $.data.status }
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", window_start: "2026-09-01T11:00:00Z", window_end: "2026-09-01T13:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { err: $.data.error_id }
          assert:
            - "WO1 [08:00,12:00) created: status PLANNED"
            - "WO2 [12:00,14:00) created: status PLANNED (adjacent at 12:00 allowed under half-open semantics)"
            - "WO3 [11:00,13:00) rejected with error_id == ERR_WORK_WINDOW_OVERLAP (http 409)"

      - name: team_review_date_buffer
        grounds:
          - validations[priority=9]
          - entities.DiagnosticReview.fields.scheduled_date
          - entities.DiagnosticReview.fields.team_id
        distinguishing_aspect: |
          Interval semantics: positive buffer rule on resource DiagnosticTeam — reviews for the same
          team must be >= 2 days apart, so even disjoint same-day/next-day dates are rejected.
          Different resource entity and different arithmetic than the work-window sibling.
        test_recipe:
          setup:
            - "Locality; diagnostic team; ACTIVE crossing"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Buffer City", state_code: "KS", contact_email: "pw@buf.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /diagnostic-teams"
              payload: { team_name: "Team Delta", lead_agency: "DOT" }
              as: ProgramAdministrator
              captures: { team_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-800101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
          trigger:
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cx_id}", team_id: "${team_id}", scheduled_date: "2026-09-10" }
              as: ProgramAdministrator
              captures: { r1: $.data.id, r1_status: $.data.status }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cx_id}", team_id: "${team_id}", scheduled_date: "2026-09-12" }
              as: ProgramAdministrator
              captures: { r2: $.data.id, r2_status: $.data.status }
            - call: "POST /diagnostic-reviews"
              payload: { crossing_id: "${cx_id}", team_id: "${team_id}", scheduled_date: "2026-09-11" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "review on 2026-09-10 created (SCHEDULED)"
            - "review on 2026-09-12 created (exactly 2 days later, buffer satisfied at equality)"
            - "review on 2026-09-11 rejected with error_id == ERR_TEAM_SCHEDULE_BUFFER (http 409): 1 day from both existing reviews"

  - rule_id: compensating_invariant
    instances:
      - name: award_rescind_restores_pool
        grounds:
          - state_machines.UpgradeProject.ELIGIBLE_to_AWARDED
          - state_machines.UpgradeProject.AWARDED_to_ELIGIBLE
          - entities.FundingProgram.fields.encumbered_cents
        distinguishing_aspect: |
          Conserved quantity is money: available_cents + encumbered_cents == apportionment_cents
          (1000000) after the forward award (700000 + 300000) and after the compensating rescind
          (1000000 + 0); share fields are nulled with zero drift.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing; OPEN WATERFALL program (pool 1000000); project cost 300000 nominated to ELIGIBLE"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Invariant City", state_code: "KS", contact_email: "pw@inv.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-900001", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 6, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
            - call: "POST /funding-programs"
              payload: { fiscal_year: 2034, apportionment_cents: 1000000, allocation_method: "WATERFALL_BY_RANK" }
              as: ProgramAdministrator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /upgrade-projects"
              payload: { crossing_id: "${cx_id}", program_id: "${prog}", target_device_class: "FOUR_QUADRANT_GATES", estimated_cost_cents: 300000 }
              as: RailSafetyOfficer
              captures: { pj: $.data.id }
            - call: "POST /upgrade-projects/${pj}/transition"
              payload: { to_status: "ELIGIBLE" }
              as: RailSafetyOfficer
          trigger:
            - call: "POST /upgrade-projects/${pj}/award"
              payload: { expected_funding_program_version: "${prog_v}" }
              as: ProgramAdministrator
              captures: { awarded: $.data.awarded_cents, fed: $.data.federal_share_cents, st: $.data.state_share_cents }
            - call: "GET /funding-programs/${prog}"
              as: ProgramAdministrator
              captures: { avail_after_award: $.data.available_cents, enc_after_award: $.data.encumbered_cents }
            - call: "POST /upgrade-projects/${pj}/rescind-award"
              as: ProgramAdministrator
              captures: { pj_after: $.data.status, awarded_after: $.data.awarded_cents }
            - call: "GET /funding-programs/${prog}"
              as: ProgramAdministrator
              captures: { avail_final: $.data.available_cents, enc_final: $.data.encumbered_cents }
          assert:
            - "after award: awarded_cents == 300000, federal_share_cents == 240000, state_share_cents == 60000"
            - "after award: available_cents == 700000 and encumbered_cents == 300000 (sum == apportionment 1000000)"
            - "after rescind: project status == ELIGIBLE, awarded_cents is null"
            - "after rescind: available_cents == 1000000 and encumbered_cents == 0 (sum == apportionment, zero drift)"

      - name: assignment_transfer_revoke_restores_cardinality
        grounds:
          - state_machines.MaintenanceResponsibilityAssignment.ACTIVE_to_SUPERSEDED
          - state_machines.MaintenanceResponsibilityAssignment.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity is assignment cardinality: exactly one ACTIVE row per
          (crossing_id, category) holds after the forward transfer (create-supersede) and after
          the compensating revoke reinstates the original RAILROAD row. Different quantity type
          from the pool-money sibling.
        test_recipe:
          setup:
            - "Locality; ACTIVE crossing"
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Assign City", state_code: "KS", contact_email: "pw@asg.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
            - call: "POST /crossings"
              payload: { dot_crossing_number: "DOT-900101", railroad_code: "BNSF", road_authority_locality_id: "${loc_id}", highway_functional_class: "LOCAL", annual_train_count: 365, train_speed_max_mph: 25, aadt: 5000, school_bus_count: 0, sight_distance_rating: 3, warning_device_class: "GATES" }
              as: ProgramAdministrator
              captures: { cx_id: $.data.id }
          trigger:
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", responsible_party: "RAILROAD", effective_from: "2026-08-01" }
              as: ProgramAdministrator
              captures: { a1: $.data.id, a1_status: $.data.status }
            - call: "POST /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", responsible_party: "ROAD_AUTHORITY", effective_from: "2026-09-01" }
              as: ProgramAdministrator
              captures: { a2: $.data.id, a2_status: $.data.status }
            - call: "GET /maintenance-assignments/${a1}"
              as: ProgramAdministrator
              captures: { a1_mid: $.data.status }
            - call: "POST /maintenance-assignments/${a2}/revoke"
              as: ProgramAdministrator
              captures: { a2_final: $.data.status }
            - call: "GET /maintenance-assignments"
              payload: { crossing_id: "${cx_id}", category: "SIGNAL", status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { active_id: "$.data[0].id" }
          assert:
            - "A1 created ACTIVE; after A2 creation A1 == SUPERSEDED and A2 == ACTIVE (transfer)"
            - "after revoke: A2 == REVOKED and the fallback selector reinstated A1 -> ACTIVE"
            - "filtered list (crossing_id, SIGNAL, ACTIVE) returns exactly 1 row (total_count == 1) and its id == ${a1} (cardinality and identity restored)"
