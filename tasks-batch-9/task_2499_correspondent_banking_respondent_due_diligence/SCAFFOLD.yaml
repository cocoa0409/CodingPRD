    side_effects: ["requires state SENT, OVERDUE or ESCALATED", "sets state RESPONDED and responded_at = the logical clock"]

  - method: POST
    path: "/correspondent-banking/information-requests/{informationRequestId}/overdue-marking"
    description: "Operator-driven SLA maintenance: send a reminder, mark the request overdue once the clock passes due_at, or advance the escalation ladder one level per 72 elapsed hours."
    roles: [ComplianceAnalyst, PlatformAdmin]
    code: 200
    input: ["action"]
    output: InformationRequest
    side_effects: ["REMIND requires state SENT or OVERDUE and increments reminder_count", "MARK_OVERDUE requires state SENT and the logical clock >= due_at, else ERR_RFI_NOT_YET_OVERDUE; it sets state OVERDUE and runs calculations.unresponsive_strike_ledger (+1 strike)", "ESCALATE requires state OVERDUE, the clock at least 72 hours past due_at per level, and raises escalation_level up to 3, setting state ESCALATED at level 1", "reaching 3 strikes restricts the respondent with restriction_reason UNRESPONSIVE_STRIKES", "increments RespondentBank.version by 1 when a strike or restriction is written"]

  - method: POST
    path: "/correspondent-banking/information-requests/{informationRequestId}/adjudication"
