scenario: |
  1190. Community Land Trust Homeownership Program (community land trust): buyer eligibility & income certification, homebuyer education completion requirement, ground lease terms & resale formula, subsidy retention & affordability preservation calculation, home maintenance standards & inspection, resale process & buyer waitlist matching, refinancing/home equity restrictions & lender approval, ground lease fee & default/cure process

domain_name: community-land-trust
api_prefix: /

# =============================================================================
# Table 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: CLTProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: ami_table_effective_date, type: datetime, source: input, description: "Date the AMI schedule takes effect" }
      - { name: area_median_income_cents, type: integer, source: input, description: "Baseline 100% AMI for the program's metro area, annual, whole cents" }
      - { name: max_eligibility_ami_pct, type: number, source: input, description: "Maximum AMI percentage a household may be at to qualify (e.g. 0.80 for 80% AMI)" }
      - { name: ground_lease_term_years, type: integer, source: input, default: 99, description: "Standard ground lease length, years" }
      - { name: ground_lease_base_fee_cents, type: integer, source: input, description: "Base monthly ground lease fee in cents (pre-subsidy)" }
      - { name: low_income_fee_reduction_pct, type: number, source: input, default: 0.5, description: "Fraction of base fee waived for households <=50% AMI" }
      - { name: resale_formula_kind, type: enum, source: input, description: "APPRAISAL_BASED | INDEXED — which resale price formula variant is in force" }
      - { name: indexed_annual_appreciation_pct, type: number, source: input, default: 0.015, description: "Annual simple appreciation for INDEXED formula (e.g. 0.015 = 1.5%/yr)" }
      - { name: appraisal_seller_share_pct, type: number, source: input, default: 0.25, description: "Seller's share of appreciation under APPRAISAL_BASED formula (e.g. 0.25 = 25%)" }
      - { name: max_refi_ltv_pct, type: number, source: input, default: 0.95, description: "Maximum loan-to-value ratio a refinance may reach on the leasehold interest" }
      - { name: max_equity_withdrawal_cents, type: integer, source: input, default: 0, description: "Hard cap on cash-out equity in any refinance" }
      - { name: default_cure_window_days, type: integer, source: input, default: 30, description: "Days household has to cure a DefaultNotice before escalation" }
      - { name: inspection_cycle_months, type: integer, source: input, default: 24, description: "Months between required maintenance inspections of an occupied unit" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Household
    parent: CLTProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CLTProgram.id; owning program" }
      - { name: legal_name, type: string, source: input, description: "Primary applicant full legal name" }
      - name: household_size
        type: integer
        source: input
        description: "Number of persons in household; drives AMI size-adjustment"
        constraints: ">= 1"
      - { name: annual_gross_income_cents, type: integer, source: input, description: "Most recent self-reported annual gross income in cents; verified by IncomeCertification" }
      - { name: ami_pct, type: number, source: computed, description: "Current AMI fraction: annual_gross_income_cents / (area_median_income_cents * size_adjustment(household_size)); computed at latest IncomeCertification approval" }
      - { name: eligibility_status, type: enum, source: system, description: "PENDING | ELIGIBLE | INELIGIBLE | SUSPENDED | EXPIRED" }
      - { name: eligibility_expires_at, type: datetime, source: system, description: "UTC timestamp at which current ELIGIBLE status lapses (24 months after latest approved cert); null when not ELIGIBLE" }
      - { name: education_required, type: boolean, source: system, default: true, description: "Whether the program requires homebuyer education before purchase" }
      - { name: education_completed_at, type: datetime, source: system, description: "UTC timestamp when the household's last required course was completed; null if not complete" }
      - { name: active_lease_id, type: string, source: system, description: "FK -> GroundLease.id; set while this household occupies a unit, null otherwise" }
      - { name: waitlist_entry_id, type: string, source: system, description: "FK -> WaitlistEntry.id; set while this household has an ACTIVE waitlist entry, null otherwise" }
      - { name: notes, type: string, source: input, default: "", description: "Free-form staff notes" }

  - name: IncomeCertification
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; certified household" }
      - { name: tax_year, type: integer, source: input, description: "Tax year the income documentation covers" }
      - { name: reported_annual_income_cents, type: integer, source: input, description: "Annual income the household self-reported for tax_year" }
      - { name: verified_annual_income_cents, type: integer, source: input, description: "Annual income after staff verification (may differ from reported)" }
      - { name: household_size_at_cert, type: integer, source: input, description: "Household size used for AMI size adjustment on this cert" }
      - { name: ami_pct_at_cert, type: number, source: computed, description: "AMI fraction at certification: verified_annual_income_cents / (area_median_income_cents * size_adjustment(household_size_at_cert))" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | EXPIRED" }
      - { name: rejection_reason, type: string, source: system, default: "", description: "Reason recorded when status moves to REJECTED" }
      - { name: reviewed_by, type: string, source: system, default: "", description: "X-User-ID of ComplianceOfficer who last approved/rejected; segregation-of-duties target" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of IntakeSpecialist (or Household) who created the cert; cannot equal reviewed_by" }
      - { name: decided_at, type: datetime, source: system, description: "UTC timestamp of latest APPROVED or REJECTED transition; null otherwise" }

  - name: EducationCourse
    parent: CLTProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CLTProgram.id; owning program" }
      - { name: code, type: string, source: input, description: "Course code (e.g. 'HOME-101')" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: integer, source: input, description: "Credit hours awarded on completion" }
      - { name: is_required, type: boolean, source: input, default: true, description: "Whether completion is mandatory for buyer eligibility" }
      - { name: validity_months, type: integer, source: input, default: 24, description: "Months a completion remains valid before it must be re-taken" }
      - { name: status, type: enum, source: system, description: "OFFERED | RETIRED" }

  - name: EducationCompletion
    parent: Household
    common_fields: false
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; completing household" }
      - { name: course_id, type: string, source: input, description: "FK -> EducationCourse.id; course completed" }
      - { name: completed_at, type: datetime, source: input, description: "UTC timestamp the household finished the course" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + course.validity_months" }
      - { name: recorded_by, type: string, source: system, description: "X-User-ID of IntakeSpecialist recording the completion" }
      - { name: score_pct, type: number, source: input, description: "Final course score 0.0–1.0; must be >= 0.7 to count", constraints: "0.0 <= score_pct <= 1.0" }

  - name: Unit
    parent: CLTProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> CLTProgram.id; owning program" }
      - { name: address, type: string, source: input, description: "Street address of the home" }
      - { name: bedrooms, type: integer, source: input, description: "Number of bedrooms" }
      - { name: original_subsidy_cents, type: integer, source: input, description: "Public/philanthropic subsidy invested at acquisition; locked in at first sale and amortized for resale-formula purposes" }
      - { name: original_sale_price_cents, type: integer, source: input, description: "Initial affordable sale price to the first CLT buyer" }
      - { name: current_lease_id, type: string, source: system, description: "FK -> GroundLease.id; the active lease on this unit, null when vacant" }
      - { name: occupancy_status, type: enum, source: system, description: "VACANT | OCCUPIED | LISTED_FOR_RESALE | UNDER_CONTRACT | IN_DEFAULT | FORECLOSED" }
      - { name: last_inspection_passed_at, type: datetime, source: system, description: "UTC timestamp of last PASSED InspectionRecord; null if never" }
      - { name: next_inspection_due_at, type: datetime, source: system, description: "UTC timestamp when next inspection is due; computed from inspection_cycle_months" }
      - { name: maintenance_flag, type: enum, source: system, description: "OK | NEEDS_REPAIR | UNSAFE — derived from latest InspectionRecord" }
      - { name: appraisal_value_cents, type: integer, source: system, default: 0, description: "Most recent independent market appraisal in cents; refreshed on listing and on refinance approval" }

  - name: GroundLease
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; leased unit" }
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; leasing household" }
      - { name: start_date, type: datetime, source: input, description: "UTC start of lease term" }
      - { name: end_date, type: datetime, source: computed, description: "start_date + program.ground_lease_term_years" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "Current monthly ground-lease fee, post-subsidy; recomputed on each approved IncomeCertification and on program parameter change" }
      - { name: subsidy_locked_cents, type: integer, source: system, description: "Subsidy locked in for this household at lease execution; preserved on resale per resale formula" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Price this household paid for the improvements (the leasehold interest)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | IN_DEFAULT | CURE_PERIOD | FORECLOSED | TERMINATED | EXPIRED" }
      - { name: fee_arrears_cents, type: integer, source: system, default: 0, description: "Cumulative unpaid ground lease fees, in cents" }
      - { name: last_fee_charged_at, type: datetime, source: system, description: "UTC timestamp of most recent LeaseFee charge; null before first charge" }
      - { name: resale_count, type: integer, source: system, default: 0, description: "Number of times this leasehold has been resold (counted after TERMINATED with a successor lease created)" }

  - name: LeaseFee
    parent: GroundLease
    common_fields: false
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> GroundLease.id; the lease being charged" }
      - { name: period_year, type: integer, source: input, description: "Billing period year (e.g. 2026)" }
      - { name: period_month, type: integer, source: input, description: "Billing period month (1-12)" }
      - { name: amount_cents, type: integer, source: computed, description: "Fee charged for this period, after subsidy-tier adjustments" }
      - { name: due_date, type: datetime, source: computed, description: "First of the period month at 00:00:00 UTC" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | LATE | WAIVED | DEFAULTED" }
      - { name: paid_at, type: datetime, source: system, description: "UTC timestamp of PAID transition; null otherwise" }
      - { name: paid_amount_cents, type: integer, source: system, default: 0, description: "Cumulative amount paid toward this fee" }

  - name: DefaultNotice
    parent: GroundLease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> GroundLease.id; lease in default" }
      - { name: notice_kind, type: enum, source: input, description: "FEE_ARREARS | MAINTENANCE | UNAUTHORIZED_REFINANCE | OCCUPANCY_VIOLATION" }
      - { name: issued_at, type: datetime, source: system, description: "UTC timestamp notice issued" }
      - { name: cure_deadline_at, type: datetime, source: computed, description: "issued_at + program.default_cure_window_days" }
      - { name: amount_due_cents, type: integer, source: input, description: "Cents required to cure (0 for non-monetary notices)" }
      - { name: status, type: enum, source: system, description: "OPEN | CURED | ESCALATED | DISMISSED" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of LeaseManager issuing the notice" }
      - { name: cured_at, type: datetime, source: system, description: "UTC timestamp of CURED transition; null otherwise" }
      - { name: cure_evidence, type: string, source: input, default: "", description: "Free-form description of cure (payment ref, repair photos, etc.)" }

  - name: InspectionRecord
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit inspected" }
      - { name: scheduled_for, type: datetime, source: input, description: "UTC timestamp the inspection is scheduled for" }
      - { name: completed_at, type: datetime, source: system, description: "UTC timestamp inspection completed; null until closed" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of Inspector who performed (or will perform) the inspection" }
      - { name: result, type: enum, source: system, description: "PENDING | PASSED | FAILED | NEEDS_REPAIR" }
      - { name: findings, type: string, source: input, default: "", description: "Free-text findings" }
      - { name: follow_up_due_at, type: datetime, source: system, description: "For NEEDS_REPAIR: deadline for follow-up; null otherwise" }
      - { name: linked_notice_id, type: string, source: system, description: "FK -> DefaultNotice.id; the MAINTENANCE default notice opened by a FAILED result, if any" }

  - name: WaitlistEntry
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; queued household" }
      - { name: desired_bedrooms, type: integer, source: input, description: "Minimum bedrooms requested" }
      - { name: max_price_cents, type: integer, source: input, description: "Maximum price household can afford at current AMI" }
      - { name: priority_score, type: integer, source: computed, description: "Higher = more priority; derived from household AMI (lower AMI gets higher score) and waitlist age" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MATCHED | WITHDRAWN | EXPIRED | FULFILLED" }
      - { name: matched_unit_id, type: string, source: system, description: "FK -> Unit.id; unit matched by a ResaleListing, null until matched" }
      - { name: matched_at, type: datetime, source: system, description: "UTC timestamp of MATCHED transition; null otherwise" }
      - { name: match_rank_at_match, type: integer, source: system, description: "Rank among ACTIVE entries when matched (1 = highest priority); null otherwise" }

  - name: ResaleListing
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; unit listed for resale" }
      - { name: seller_lease_id, type: string, source: system, description: "FK -> GroundLease.id; the seller's current lease" }
      - { name: listed_at, type: datetime, source: system, description: "UTC timestamp listing opened" }
      - { name: appraisal_at_listing_cents, type: integer, source: input, description: "Independent market appraisal at time of listing, in cents" }
      - { name: asking_price_cents, type: integer, source: computed, description: "Maximum permitted asking price, computed via program resale formula (APPRAISAL_BASED or INDEXED)" }
      - { name: seller_proceeds_cents, type: integer, source: computed, description: "Projected seller net = asking_price_cents - seller_lease.purchase_price_cents" }
      - { name: subsidy_retained_cents, type: integer, source: computed, description: "Subsidy preserved for the program at this sale; = unit.original_subsidy_cents + (appreciation not paid to seller)" }
      - { name: affordability_preserved, type: boolean, source: computed, description: "True iff asking_price_cents <= 30% of (area_median_income * max_eligibility_ami_pct) monthly-equivalent * 12 * 30 (a 30-year affordability proxy)" }
      - { name: status, type: enum, source: system, description: "OPEN | MATCHED | UNDER_CONTRACT | CLOSED | CANCELLED" }
      - { name: matched_waitlist_entry_id, type: string, source: system, description: "FK -> WaitlistEntry.id; entry selected by the matching run" }
      - { name: buyer_household_id, type: string, source: system, description: "FK -> Household.id; purchasing household (set at MATCHED)" }

  - name: RefinanceRequest
    parent: GroundLease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> GroundLease.id; lease being refinanced" }
      - { name: lender_name, type: string, source: input, description: "Name of the refinancing lender" }
      - { name: requested_loan_cents, type: integer, source: input, description: "New loan principal" }
      - { name: requested_cash_out_cents, type: integer, source: input, default: 0, description: "Cash-out equity requested" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Lender's appraised value of the leasehold interest" }
      - { name: computed_ltv, type: number, source: computed, description: "requested_loan_cents / appraised_value_cents, rounded to 4 decimals" }
      - { name: program_max_loan_cents, type: integer, source: computed, description: "Maximum loan allowed = floor(appraised_value_cents * program.max_refi_ltv_pct)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | LENDER_REVIEW | APPROVED | REJECTED | WITHDRAWN | RECORDED" }
      - { name: rejection_reason, type: string, source: system, default: "", description: "Why the program rejected the request" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of Household member who submitted" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of LeaseManager who approved/rejected" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CLTProgram
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "CLTProgram.status == ACTIVE"
        side_effects:
          - "Blocks new Household creation, new GroundLease creation, new ResaleListing opening"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "CLTProgram.status == SUSPENDED"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "No GroundLease in status ACTIVE, IN_DEFAULT, or CURE_PERIOD"
          - "No ResaleListing in status OPEN, MATCHED, or UNDER_CONTRACT"
        side_effects:
          - "All remaining WaitlistEntry rows in ACTIVE move to EXPIRED"

  - entity: Household
    field: eligibility_status
    initial_state: PENDING
    terminal_states: [INELIGIBLE]
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "system (auto when IncomeCertification APPROVED with ami_pct_at_cert <= program.max_eligibility_ami_pct AND all required EducationCompletion rows unexpired)"
        actor: system
        preconditions:
          - "Household has at least one APPROVED IncomeCertification with decided_at within past 24 months"
          - "For every EducationCourse with is_required == true in Household.program_id, Household has an EducationCompletion with expires_at > now"
        side_effects:
          - "eligibility_expires_at = latest approved cert.decided_at + 24 months"
          - "Household.ami_pct = latest approved cert.ami_pct_at_cert"
      - from: PENDING
        to: INELIGIBLE
        trigger: "system (auto when IncomeCertification REJECTED with no prior APPROVED cert, OR approved cert has ami_pct_at_cert > program.max_eligibility_ami_pct)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ELIGIBLE
        to: EXPIRED
        trigger: "system (auto at eligibility_expires_at when no new APPROVED cert extends it)"
        actor: system
        preconditions:
          - "now >= Household.eligibility_expires_at"
        side_effects:
          - "ACTIVE WaitlistEntry rows for this Household move to EXPIRED"
          - "If Household.active_lease_id is set, lease remains ACTIVE (residents do not lose home on cert lapse, but may not sell/refinance until re-certified)"
      - from: EXPIRED
        to: ELIGIBLE
        trigger: "system (auto on new APPROVED IncomeCertification meeting PENDING→ELIGIBLE preconditions)"
        actor: system
        preconditions:
          - "Same as PENDING → ELIGIBLE"
        side_effects:
          - "eligibility_expires_at reset"
      - from: [ELIGIBLE, EXPIRED]
        to: SUSPENDED
        trigger: "POST /programs/{pid}/households/{hid}/suspend"
        actor: LeaseManager
        preconditions:
          - "Household.eligibility_status in (ELIGIBLE, EXPIRED)"
        side_effects:
          - "ACTIVE WaitlistEntry rows for this Household move to WITHDRAWN"
      - from: SUSPENDED
        to: PENDING
        trigger: "POST /programs/{pid}/households/{hid}/reinstate"
        actor: LeaseManager
        preconditions:
          - "Household.eligibility_status == SUSPENDED"
        side_effects: []

  - entity: IncomeCertification
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /programs/{pid}/households/{hid}/income-certifications/{cid}/start-review"
        actor: ComplianceOfficer
        preconditions:
          - "IncomeCertification.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /programs/{pid}/households/{hid}/income-certifications/{cid}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "IncomeCertification.status == UNDER_REVIEW"
          - "reviewed_by (acting X-User-ID) != submitted_by — segregation of duties (ERR_SO_DUTY_VIOLATION)"
          - "verified_annual_income_cents >= 0"
        side_effects:
          - "decided_at = now; reviewed_by = acting X-User-ID"
          - "Household.ami_pct recomputed (latest approved cert wins)"
          - "Household eligibility_status re-evaluated (PENDING/EXPIRED → ELIGIBLE if criteria met; ELIGIBLE → ELIGIBLE with expiry extended; ELIGIBLE → INELIGIBLE if ami_pct exceeds max_eligibility_ami_pct)"
          - "If Household.active_lease_id set, GroundLease.monthly_fee_cents recomputed via lease_fee_tier calc"
          - "All PENDING LeaseFee rows for that lease with due_date > now are re-amounted"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /programs/{pid}/households/{hid}/income-certifications/{cid}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "IncomeCertification.status == UNDER_REVIEW"
          - "reviewed_by != submitted_by (ERR_SO_DUTY_VIOLATION)"
          - "rejection_reason non-empty"
        side_effects:
          - "If Household has no other APPROVED cert: Household.eligibility_status → INELIGIBLE"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (auto when a newer APPROVED cert supersedes, or 24 months elapse)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EducationCourse
    field: status
    initial_state: OFFERED
    terminal_states: [RETIRED]
    transitions:
      - from: OFFERED
        to: RETIRED
        trigger: "POST /programs/{pid}/education-courses/{cid}/retire"
        actor: ProgramAdmin
        preconditions:
          - "EducationCourse.status == OFFERED"
        side_effects:
          - "Households missing this course's completion have it waived going forward (existing completions still count)"

  - entity: Unit
    field: occupancy_status
    initial_state: VACANT
    terminal_states: [FORECLOSED]
    transitions:
      - from: VACANT
        to: OCCUPIED
        trigger: "system (auto when GroundLease for this unit transitions DRAFT → ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit.current_lease_id set"
      - from: OCCUPIED
        to: LISTED_FOR_RESALE
        trigger: "system (auto when ResaleListing opens)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LISTED_FOR_RESALE
        to: UNDER_CONTRACT
        trigger: "system (auto when ResaleListing transitions MATCHED → UNDER_CONTRACT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_CONTRACT
        to: VACANT
        trigger: "system (auto when ResaleListing closes: seller lease TERMINATED, buyer lease created in DRAFT)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit.current_lease_id cleared"
      - from: OCCUPIED
        to: IN_DEFAULT
        trigger: "system (auto when any DefaultNotice for current lease becomes OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_DEFAULT
        to: OCCUPIED
        trigger: "system (auto when all DefaultNotice rows for current lease are CURED or DISMISSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_DEFAULT
        to: FORECLOSED
        trigger: "system (auto when a DefaultNotice ESCALATED past cure_deadline without cure)"
        actor: system
        preconditions: []
        side_effects:
          - "GroundLease → FORECLOSED"
          - "Unit.current_lease_id cleared"
          - "Household.active_lease_id cleared"
      - from: [VACANT, LISTED_FOR_RESALE, UNDER_CONTRACT]
        to: OCCUPIED
        trigger: "system (rare reinstatement path — only via LeaseManager override after CANCELLED ResaleListing)"
        actor: LeaseManager
        preconditions:
          - "Previous GroundLease restored to ACTIVE"
        side_effects: []

  - entity: GroundLease
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, FORECLOSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/activate"
        actor: LeaseManager
        preconditions:
          - "Household.eligibility_status == ELIGIBLE"
          - "Household.education_completed_at is not null AND every required course has unexpired EducationCompletion"
          - "Unit.occupancy_status in (VACANT, UNDER_CONTRACT for resale successor)"
          - "Household has no other ACTIVE GroundLease in this program"
          - "expected_unit_version matches Unit.version (OCC)"
        side_effects:
          - "increments Unit.version by 1"
          - "Unit.occupancy_status → OCCUPIED; Unit.current_lease_id = this lease"
          - "Household.active_lease_id = this lease"
          - "subsidy_locked_cents = Unit.original_subsidy_cents (initial sale) OR computed retained subsidy (resale)"
          - "monthly_fee_cents computed via lease_fee_tier calc"
          - "First LeaseFee row auto-created for current month, status=PENDING"
      - from: ACTIVE
        to: IN_DEFAULT
        trigger: "system (auto when any DefaultNotice for this lease becomes OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit.occupancy_status → IN_DEFAULT"
      - from: IN_DEFAULT
        to: CURE_PERIOD
        trigger: "system (auto when DefaultNotice.cure_deadline_at within 7 days AND amount_due_cents > 0 AND partial payment received)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURE_PERIOD
        to: ACTIVE
        trigger: "system (auto when all OPEN DefaultNotice rows transition to CURED)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit.occupancy_status → OCCUPIED"
          - "fee_arrears_cents = 0 (cleared on cure)"
      - from: IN_DEFAULT
        to: ACTIVE
        trigger: "system (auto when all DefaultNotice rows transition to CURED or DISMISSED before deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "Unit.occupancy_status → OCCUPIED"
      - from: [IN_DEFAULT, CURE_PERIOD]
        to: FORECLOSED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/foreclose"
        actor: LeaseManager
        preconditions:
          - "At least one DefaultNotice for this lease with status == OPEN AND cure_deadline_at < now"
          - "expected_lease_version matches GroundLease.version (OCC)"
        side_effects:
          - "increments GroundLease.version by 1 AND increments Unit.version by 1"
          - "Unit.occupancy_status → FORECLOSED"
          - "Unit.current_lease_id = null"
          - "Household.active_lease_id = null"
          - "Household.eligibility_status → SUSPENDED"
          - "All OPEN DefaultNotice rows → ESCALATED"
          - "All PENDING LeaseFee rows → DEFAULTED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (auto when ResaleListing closes and successor lease is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Household.active_lease_id = null"
          - "resale_count incremented by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/terminate"
        actor: LeaseManager
        preconditions:
          - "No OPEN DefaultNotice rows"
          - "expected_lease_version matches GroundLease.version (OCC)"
        side_effects:
          - "increments GroundLease.version by 1 AND increments Unit.version by 1"
          - "Unit.occupancy_status → VACANT; Unit.current_lease_id = null"
          - "Household.active_lease_id = null"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (auto at end_date if not renewed)"
        actor: system
        preconditions:
          - "now >= GroundLease.end_date"
        side_effects:
          - "Unit.occupancy_status → VACANT"
          - "Household.active_lease_id = null"

  - entity: LeaseFee
    field: status
    initial_state: PENDING
    terminal_states: [PAID, WAIVED, DEFAULTED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/fees/{fid}/pay"
        actor: Household
        preconditions:
          - "LeaseFee.status == PENDING or LATE"
          - "paid_amount_cents + payment_amount_cents >= amount_cents"
        side_effects:
          - "paid_at = now"
          - "GroundLease.fee_arrears_cents -= amount_cents (capped at 0)"
      - from: PENDING
        to: LATE
        trigger: "system (auto at due_date + 5 days grace)"
        actor: system
        preconditions: []
        side_effects:
          - "GroundLease.fee_arrears_cents += amount_cents"
          - "If arrears >= 3 * monthly_fee_cents, auto-issue DefaultNotice(FEE_ARREARS)"
      - from: [PENDING, LATE]
        to: WAIVED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/fees/{fid}/waive"
        actor: LeaseManager
        preconditions:
          - "LeaseFee.status != PAID, != DEFAULTED"
        side_effects:
          - "GroundLease.fee_arrears_cents -= (amount_cents - paid_amount_cents) (capped at 0)"
      - from: LATE
        to: DEFAULTED
        trigger: "system (auto when associated lease foreclosed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DefaultNotice
    field: status
    initial_state: OPEN
    terminal_states: [CURED, ESCALATED, DISMISSED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/default-notices/{nid}/cure"
        actor: LeaseManager
        preconditions:
          - "DefaultNotice.status == OPEN"
          - "For FEE_ARREARS: GroundLease.fee_arrears_cents must be 0"
          - "For MAINTENANCE: a follow-up InspectionRecord with result == PASSED exists with completed_at > DefaultNotice.issued_at"
          - "cure_evidence non-empty"
        side_effects:
          - "cured_at = now"
          - "If all notices on lease cured: GroundLease → ACTIVE; Unit.occupancy_status → OCCUPIED"
      - from: OPEN
        to: ESCALATED
        trigger: "system (auto at cure_deadline_at without cure) OR POST /programs/{pid}/units/{uid}/leases/{lid}/default-notices/{nid}/escalate"
        actor: "system or LeaseManager"
        preconditions:
          - "DefaultNotice.status == OPEN"
          - "now > DefaultNotice.cure_deadline_at (for auto path)"
        side_effects:
          - "GroundLease status re-evaluated: if still IN_DEFAULT or CURE_PERIOD, eligible for FORECLOSED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/default-notices/{nid}/dismiss"
        actor: LeaseManager
        preconditions:
          - "DefaultNotice.status == OPEN"
        side_effects:
          - "If all notices closed, lease/unit status recomputed"

  - entity: InspectionRecord
    field: result
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, NEEDS_REPAIR]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /programs/{pid}/units/{uid}/inspections/{iid}/record-result with result=PASSED"
        actor: Inspector
        preconditions:
          - "InspectionRecord.result == PENDING"
          - "inspector_user_id (acting X-User-ID) is an Inspector role"
        side_effects:
          - "completed_at = now"
          - "Unit.last_inspection_passed_at = now"
          - "Unit.next_inspection_due_at = now + program.inspection_cycle_months"
          - "Unit.maintenance_flag = OK"
      - from: PENDING
        to: NEEDS_REPAIR
        trigger: "POST /programs/{pid}/units/{uid}/inspections/{iid}/record-result with result=NEEDS_REPAIR"
        actor: Inspector
        preconditions:
          - "InspectionRecord.result == PENDING"
        side_effects:
          - "completed_at = now"
          - "Unit.maintenance_flag = NEEDS_REPAIR"
          - "follow_up_due_at = now + 30 days"
      - from: PENDING
        to: FAILED
        trigger: "POST /programs/{pid}/units/{uid}/inspections/{iid}/record-result with result=FAILED"
        actor: Inspector
        preconditions:
          - "InspectionRecord.result == PENDING"
        side_effects:
          - "completed_at = now"
          - "Unit.maintenance_flag = UNSAFE"
          - "Auto-issue DefaultNotice(notice_kind=MAINTENANCE, amount_due_cents=0) on Unit.current_lease_id (cascades lease to IN_DEFAULT)"
          - "InspectionRecord.linked_notice_id set to the new notice id"

  - entity: WaitlistEntry
    field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, EXPIRED, FULFILLED]
    transitions:
      - from: ACTIVE
        to: MATCHED
        trigger: "system (auto via ResaleListing matching run, or POST /programs/{pid}/waitlist-entries/{wid}/match)"
        actor: "system or LeaseManager"
        preconditions:
          - "WaitlistEntry.status == ACTIVE"
          - "Household.eligibility_status == ELIGIBLE"
          - "Household.education_completed_at not null"
          - "Target ResaleListing.asking_price_cents <= WaitlistEntry.max_price_cents"
          - "Unit.bedrooms >= WaitlistEntry.desired_bedrooms"
          - "Entry is highest priority_score among eligible entries (tie-break: created_at ASC)"
        side_effects:
          - "matched_at = now"
          - "matched_unit_id = ResaleListing.unit_id"
          - "match_rank_at_match = computed rank"
          - "ResaleListing.status → MATCHED; ResaleListing.matched_waitlist_entry_id, buyer_household_id set"
      - from: MATCHED
        to: FULFILLED
        trigger: "system (auto when successor GroundLease for the matched unit transitions to ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "ResaleListing.status → CLOSED"
      - from: [ACTIVE, MATCHED]
        to: WITHDRAWN
        trigger: "POST /programs/{pid}/waitlist-entries/{wid}/withdraw"
        actor: "Household or LeaseManager"
        preconditions:
          - "WaitlistEntry.status in (ACTIVE, MATCHED)"
        side_effects:
          - "If MATCHED, ResaleListing.status → OPEN (re-listed); matched_waitlist_entry_id, buyer_household_id cleared"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (auto when Household.eligibility_status leaves ELIGIBLE for > 30 days, or when program closes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ResaleListing
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: MATCHED
        trigger: "POST /programs/{pid}/units/{uid}/resale-listings/{rid}/run-matching"
        actor: LeaseManager
        preconditions:
          - "ResaleListing.status == OPEN"
          - "Unit.occupancy_status == LISTED_FOR_RESALE"
          - "Unit.maintenance_flag != UNSAFE"
          - "expected_listing_version matches ResaleListing.version (OCC)"
          - "At least one eligible WaitlistEntry"
        side_effects:
          - "increments ResaleListing.version by 1"
          - "Selected WaitlistEntry → MATCHED"
          - "matched_waitlist_entry_id, buyer_household_id set"
          - "Unit.occupancy_status unchanged (still LISTED_FOR_RESALE)"
      - from: MATCHED
        to: UNDER_CONTRACT
        trigger: "POST /programs/{pid}/units/{uid}/resale-listings/{rid}/open-contract"
        actor: LeaseManager
        preconditions:
          - "ResaleListing.status == MATCHED"
          - "buyer_household still ELIGIBLE"
          - "buyer has unexpired required EducationCompletion"
          - "expected_listing_version matches"
        side_effects:
          - "increments ResaleListing.version by 1"
          - "Unit.occupancy_status → UNDER_CONTRACT"
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "POST /programs/{pid}/units/{uid}/resale-listings/{rid}/close"
        actor: LeaseManager
        preconditions:
          - "ResaleListing.status == UNDER_CONTRACT"
          - "expected_listing_version matches"
          - "Buyer purchase funds confirmed (input flag)"
        side_effects:
          - "increments ResaleListing.version by 1"
          - "Seller GroundLease → TERMINATED"
          - "Seller Household.active_lease_id = null"
          - "Seller proceeds paid out per resale_formula calculation"
          - "Subsidy retained per subsidy_retention calculation (rolled into buyer's subsidy_locked_cents)"
          - "New buyer GroundLease auto-created in DRAFT (caller must then POST /activate)"
          - "Buyer WaitlistEntry → FULFILLED"
          - "Unit.occupancy_status → VACANT (transitions to OCCUPIED on buyer lease activate)"
      - from: [OPEN, MATCHED]
        to: CANCELLED
        trigger: "POST /programs/{pid}/units/{uid}/resale-listings/{rid}/cancel"
        actor: LeaseManager
        preconditions:
          - "ResaleListing.status in (OPEN, MATCHED)"
        side_effects:
          - "If MATCHED: WaitlistEntry → ACTIVE, matched_unit_id = null, matched_at = null, match_rank_at_match = null"
          - "Unit.occupancy_status → OCCUPIED (seller remains)"

  - entity: RefinanceRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, RECORDED]
    transitions:
      - from: SUBMITTED
        to: LENDER_REVIEW
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/refinance-requests/{rid}/submit-to-lender"
        actor: Household
        preconditions:
          - "RefinanceRequest.status == SUBMITTED"
          - "Household is the lease's household"
        side_effects: []
      - from: LENDER_REVIEW
        to: APPROVED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/refinance-requests/{rid}/approve"
        actor: LeaseManager
        preconditions:
          - "RefinanceRequest.status == LENDER_REVIEW"
          - "computed_ltv <= program.max_refi_ltv_pct"
          - "requested_cash_out_cents <= program.max_equity_withdrawal_cents"
          - "GroundLease.status == ACTIVE"
          - "No OPEN DefaultNotice rows on lease"
          - "reviewed_by != submitted_by (segregation of duties)"
        side_effects:
          - "reviewed_by = acting X-User-ID"
          - "Unit.appraisal_value_cents = appraised_value_cents (refreshed)"
      - from: LENDER_REVIEW
        to: REJECTED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/refinance-requests/{rid}/reject"
        actor: LeaseManager
        preconditions:
          - "RefinanceRequest.status == LENDER_REVIEW"
          - "reviewed_by != submitted_by"
          - "rejection_reason non-empty"
        side_effects: []
      - from: [SUBMITTED, LENDER_REVIEW]
        to: WITHDRAWN
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/refinance-requests/{rid}/withdraw"
        actor: Household
        preconditions:
          - "RefinanceRequest.status in (SUBMITTED, LENDER_REVIEW)"
        side_effects: []
      - from: APPROVED
        to: RECORDED
        trigger: "POST /programs/{pid}/units/{uid}/leases/{lid}/refinance-requests/{rid}/record"
        actor: LeaseManager
        preconditions:
          - "RefinanceRequest.status == APPROVED"
          - "expected_lease_version matches GroundLease.version (OCC)"
        side_effects:
          - "increments GroundLease.version by 1"
          - "Recorded as final; lease terms updated to reflect new lender"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lease-activate-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /programs/{pid}/units/{uid}/leases/{lid}/activate"
    occ_field: "expected_unit_version"
    description: |
      Activating a GroundLease against a Unit whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      actor has just activated a lease on the same unit (which legitimately
      transitions the unit to OCCUPIED) and the current writer's view is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lease-terminate-stale-lease
    parent_entity: GroundLease
    write_endpoint: "POST /programs/{pid}/units/{uid}/leases/{lid}/terminate"
    occ_field: "expected_lease_version"
    description: |
      Terminating a GroundLease whose version has advanced since the client
      last observed it is rejected. Captures the case where a default notice
      has just been issued (bumping the lease to IN_DEFAULT and version) and
      the terminator's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lease-foreclose-stale-lease
    parent_entity: GroundLease
    write_endpoint: "POST /programs/{pid}/units/{uid}/leases/{lid}/foreclose"
    occ_field: "expected_lease_version"
    description: |
      Foreclosing a GroundLease whose version has advanced since the client
      last observed it is rejected. Captures the case where a cure event has
      just restored the lease to ACTIVE and the forecloser's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: resale-matching-stale-listing
    parent_entity: ResaleListing
    write_endpoint: "POST /programs/{pid}/units/{uid}/resale-listings/{rid}/run-matching"
    occ_field: "expected_listing_version"
    description: |
      Running the matching algorithm against a ResaleListing whose version has
      advanced since the client last observed it is rejected. Captures the case
      where another operator has just re-priced the listing via recalculation
      and the matcher's view of asking_price_cents is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: refinance-record-stale-lease
    parent_entity: GroundLease
    write_endpoint: "POST /programs/{pid}/units/{uid}/leases/{lid}/refinance-requests/{rid}/record"
    occ_field: "expected_lease_version"
    description: |
      Recording an approved RefinanceRequest against a GroundLease whose
      version has advanced since approval is rejected. Captures the case where
      a default notice or cure event has mutated the lease between approval
      and recording.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: ami_pct_calc
    trigger: "IncomeCertification approval; Household.ami_pct refresh"
    algorithm: ratio
    formula: |
      size_adjustment(household_size) = lookup table:
        1 -> 0.70, 2 -> 0.80, 3 -> 0.90, 4 -> 1.00,
        5 -> 1.08, 6 -> 1.16, 7 -> 1.24, 8+ -> 1.32
      ami_pct = verified_annual_income_cents / (program.area_median_income_cents * size_adjustment(household_size_at_cert))
      Rounded to 4 decimal places, round_half_up.
      Eligibility requires ami_pct <= program.max_eligibility_ami_pct (inclusive).
    constants:
      SIZE_ADJ_1: 0.70
      SIZE_ADJ_2: 0.80
      SIZE_ADJ_3: 0.90
      SIZE_ADJ_4: 1.00
      SIZE_ADJ_5: 1.08
      SIZE_ADJ_6: 1.16
      SIZE_ADJ_7: 1.24
      SIZE_ADJ_8PLUS: 1.32
    precision: "4 decimal places, round_half_up"

  - name: lease_fee_tier
    trigger: "GroundLease activation; each IncomeCertification approval on resident household; program parameter change"
    algorithm: tiered_pricing
    formula: |
      base = program.ground_lease_base_fee_cents
      if household.ami_pct <= 0.50:
        monthly_fee_cents = round_half_up(base * (1 - program.low_income_fee_reduction_pct))
      elif household.ami_pct <= 0.80:
        monthly_fee_cents = round_half_up(base * (1 - (program.low_income_fee_reduction_pct * (0.80 - household.ami_pct) / 0.30)))
      else:
        monthly_fee_cents = base
      Boundary rule: ami_pct == 0.50 hits the LOW-INCOME tier (<=, inclusive);
      ami_pct == 0.80 hits the MIDDLE tier (<=, inclusive);
      ami_pct > 0.80 pays full base fee.
    constants:
      LOW_INCOME_CEILING: 0.50
      MIDDLE_INCOME_CEILING: 0.80
    precision: "integer cents, round_half_up"

  - name: resale_formula
    trigger: "ResaleListing creation and recalculation"
    algorithm: dual_variant
    formula: |
      Variant is selected by CLTProgram.resale_formula_kind.

      Inputs (common):
        P0 = seller_lease.purchase_price_cents          (what seller paid)
        S0 = unit.original_subsidy_cents                (initial subsidy)
        A0 = unit.appraisal_value_cents AT seller's purchase time (captured on seller lease)
        A1 = resale_listing.appraisal_at_listing_cents  (current market appraisal)
        Y  = years between seller_lease.start_date and listing.listed_at, computed as
             full calendar years elapsed (integer, floor of days/365.25)

      --- APPRAISAL_BASED variant ---
        appreciation = max(0, A1 - A0)
        seller_share = round_half_up(appreciation * program.appraisal_seller_share_pct)
        asking_price_cents = P0 + seller_share
        subsidy_retained_cents = S0 + (appreciation - seller_share)
        seller_proceeds_cents = asking_price_cents - P0     (= seller_share)

      --- INDEXED variant ---
        indexed_value = round_half_up(P0 * (1 + program.indexed_annual_appreciation_pct * Y))
        asking_price_cents = min(indexed_value, A1)         (cap by current market)
        subsidy_retained_cents = S0 + max(0, A1 - asking_price_cents)
        seller_proceeds_cents = asking_price_cents - P0     (capped by formula)

      Precision: integer cents, round_half_up at each multiplication; final values floored to integer cents if any fractional remains.
      Evaluation order (pinned): compute indexed_value BEFORE applying min(); seller_share computed BEFORE asking_price for APPRAISAL_BASED.
    constants: {}
    precision: "integer cents, round_half_up per multiplication"
    variants:
      - name: appraisal_based
        when: "program.resale_formula_kind == APPRAISAL_BASED"
        difference: "Seller shares 25% of market appreciation; subsidy retains 75%; price can exceed indexed cap"
      - name: indexed
        when: "program.resale_formula_kind == INDEXED"
        difference: "Price grows by fixed 1.5%/yr simple; subsidy retains any market overage; price capped by current appraisal"

  - name: subsidy_retention
    trigger: "ResaleListing creation; cross-checked at close"
    algorithm: constraint_propagation
    formula: |
      # Conservation invariant: appreciation_split
      # total_appreciation = max(0, A1 - A0)
      # seller_gain + program_retained_gain = total_appreciation
      # where:
      #   APPRAISAL_BASED: seller_gain = seller_share; program_retained_gain = appreciation - seller_share
      #   INDEXED:         seller_gain = asking_price - P0; program_retained_gain = max(0, A1 - asking_price)
      # And: subsidy_retained_cents = S0 + program_retained_gain
      # Compensating rule: any resale formula change MUST keep subsidy_retained_cents + seller_proceeds_cents
      # invariant for fixed (P0, A0, A1, S0, Y). Two variants produce different splits but conserve
      # (subsidy_retained + seller_proceeds) + P0 = A1 when appreciation > 0 (for APPRAISAL_BASED);
      # for INDEXED, the conservation is (subsidy_retained + seller_proceeds) = S0 + A1 - P0 when A1 > asking_price.
      pass
    constants: {}
    precision: "integer cents"

  - name: affordability_preservation_check
    trigger: "ResaleListing creation"
    algorithm: threshold
    formula: |
      # 30% of income at max eligibility AMI is the affordability ceiling
      eligible_ami_annual_cents = program.area_median_income_cents * program.max_eligibility_ami_pct
      monthly_housing_budget_cents = round_half_up(eligible_ami_annual_cents * 0.30 / 12)
      # 30-year affordability proxy: assume 30x annual budget = total price ceiling
      price_ceiling_cents = monthly_housing_budget_cents * 12 * 30
      affordability_preserved = (asking_price_cents <= price_ceiling_cents)
      Boundary rule: asking_price == price_ceiling passes (inclusive).
    constants:
      HOUSING_BUDGET_PCT: 0.30
      AFFORDABILITY_YEARS: 30
    precision: "integer cents, round_half_up"

  - name: priority_score_calc
    trigger: "WaitlistEntry creation; daily refresh; Household.ami_pct change"
    algorithm: weighted_scoring
    formula: |
      # Higher score = higher priority
      # Components:
      #   need_score       = round((1 - ami_pct) * 1000)         # lower AMI = higher need
      #   wait_age_days    = integer days since WaitlistEntry.created_at
      #   age_score        = min(wait_age_days, 365)             # capped at 1 year
      #   size_match_bonus = +50 if |unit_bedrooms - household_size| <= 1 (evaluated at match time)
      # Final score at evaluation time:
      #   priority_score = need_score + age_score + size_match_bonus (when matching against a specific unit)
      # Stored priority_score (on the entry) = need_score + age_score at creation/refresh (no size_match_bonus).
      # Tie-break at match time: priority_score DESC, then created_at ASC.
      # NEVER use entry.id as tie-break.
    constants:
      NEED_WEIGHT: 1000
      AGE_CAP_DAYS: 365
      SIZE_MATCH_BONUS: 50
    precision: "integer score"

  - name: refi_ltv_calc
    trigger: "RefinanceRequest creation; RefinanceRequest approval"
    algorithm: ratio
    formula: |
      computed_ltv = round_half_up(requested_loan_cents / appraised_value_cents, 4)
      program_max_loan_cents = floor(appraised_value_cents * program.max_refi_ltv_pct)
      Approval requires computed_ltv <= program.max_refi_ltv_pct (inclusive) AND
      requested_cash_out_cents <= program.max_equity_withdrawal_cents (inclusive).
      Edge: appraised_value_cents == 0 is rejected at input validation (ERR_INVALID_REQUEST).
    constants: {}
    precision: "ltv 4 decimals; program_max_loan integer cents floor"

  - name: waitlist_match_selector
    trigger: "ResaleListing run-matching"
    algorithm: selector_policy
    formula: |
      # Eligibility filter (candidate pool):
      #   WaitlistEntry.status == ACTIVE
      #   AND WaitlistEntry.household.eligibility_status == ELIGIBLE
      #   AND WaitlistEntry.household.education_completed_at IS NOT NULL
      #   AND ResaleListing.asking_price_cents <= WaitlistEntry.max_price_cents
      #   AND Unit.bedrooms >= WaitlistEntry.desired_bedrooms
      # Ranking expression:
      #   effective_score = entry.priority_score + (50 if |unit.bedrooms - household.household_size| <= 1 else 0)
      #   ORDER BY effective_score DESC
      # Tie-break: WaitlistEntry.created_at ASC (earliest first); UUID id is NEVER consulted.
      # Empty pool fallback: raise ERR_NO_ELIGIBLE_BUYER (422) and leave ResaleListing.status == OPEN.
    constants: {}
    precision: "n/a"

  - name: default_escalation_check
    trigger: "scheduled system pass (every tick) over OPEN DefaultNotice rows"
    algorithm: chronological
    formula: |
      For each OPEN DefaultNotice where now > cure_deadline_at:
        DefaultNotice → ESCALATED
        If GroundLease.status == IN_DEFAULT or CURE_PERIOD AND no cure evidence recorded:
          GroundLease eligible for foreclose action (LeaseManager must still call /foreclose)
      Process order: notices with earliest issued_at first; ties broken by DefaultNotice.created_at ASC.
    constants: {}
    precision: "n/a"

  - name: inspection_scheduling
    trigger: "Unit occupancy begin; InspectionRecord PASSED; program parameter change"
    algorithm: interval_merge
    formula: |
      next_inspection_due_at = (last PASSED inspection completed_at OR lease.start_date) + program.inspection_cycle_months
      If next_inspection_due_at < now AND no PENDING InspectionRecord exists for the unit, auto-create PENDING InspectionRecord with scheduled_for = now.
      Adjacent inspections: if a PENDING inspection exists with scheduled_for within 7 days of new computed due date, reuse the existing record (do not create duplicate).
    constants:
      INSPECTION_REUSE_WINDOW_DAYS: 7
    precision: "n/a"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template resource ids must exist within their parent scope (program → household/unit → child); cross-scope access returns 404"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Target resource must be in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "All body-referenced ids (course_id, household_id, lease_id, etc.) must resolve to existing entities in the same program scope"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST/PUT endpoints with FK inputs"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: acting X-User-ID must differ from the entity's submitted_by (or analogous creator) for approval/verification actions"
    error_id: ERR_SO_DUTY_VIOLATION
    http_status: 409
    applies_to: "approve/reject endpoints (IncomeCertification, RefinanceRequest)"

  - priority: 7
    category: business_safety
    check: "For MAINTENANCE cure, a PASSED InspectionRecord with completed_at > DefaultNotice.issued_at must exist"
    error_id: ERR_CURE_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /programs/{pid}/units/{uid}/leases/{lid}/default-notices/{nid}/cure"

  - priority: 8
    category: business_fiscal
    check: "For FEE_ARREARS cure, GroundLease.fee_arrears_cents must equal 0 after any concurrent payment"
    error_id: ERR_ARREARS_NOT_CLEARED
    http_status: 402
    applies_to: "POST /programs/{pid}/units/{uid}/leases/{lid}/default-notices/{nid}/cure"

  - priority: 9
    category: business_constraint
    check: "Buyer eligibility: Household.eligibility_status == ELIGIBLE AND education completed for purchase/lease activation/waitlist match"
    error_id: ERR_HOUSEHOLD_INELIGIBLE
    http_status: 409
    applies_to: "lease activation, waitlist entry creation, run-matching"

  - priority: 10
    category: business_constraint
    check: "ResaleListing preconditions: unit not UNSAFE, occupancy LISTED_FOR_RESALE, no OPEN default on seller lease"
    error_id: ERR_UNIT_BLOCKED
    http_status: 409
    applies_to: "resale-listings create, run-matching, open-contract"

  - priority: 11
    category: business_constraint
    check: "RefinanceRequest constraints: computed_ltv <= max_refi_ltv_pct AND requested_cash_out_cents <= max_equity_withdrawal_cents"
    error_id: ERR_REFINANCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "refinance-requests approve"

  - priority: 12
    category: business_constraint
    check: "Education completion validity: every required course has unexpired EducationCompletion"
    error_id: ERR_EDUCATION_INCOMPLETE
    http_status: 409
    applies_to: "lease activation, waitlist match, resale-listing close"

  - priority: 13
    category: business_temporal
    check: "Cure deadlines: only OPEN DefaultNotice rows past cure_deadline_at may be foreclosed; only notices within cure window may be CURED via the cure endpoint"
    error_id: ERR_CURE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "default-notices cure/escalate, lease foreclose"

  - priority: 14
    category: business_temporal
    check: "Income cert recency: approved cert decided_at must be within trailing 24 months for ELIGIBLE re-evaluation"
    error_id: ERR_CERT_STALE
    http_status: 409
    applies_to: "waitlist entry creation, lease activation"

  - priority: 15
    category: business_fiscal
    check: "LeaseFee payment: paid_amount_cents + payment_amount_cents must be >= amount_cents for PAID transition"
    error_id: ERR_UNDERPAYMENT
    http_status: 402
    applies_to: "POST fees/{fid}/pay"

  - priority: 16
    category: business_fiscal
    check: "ResaleListing close requires confirmed buyer funds (input flag confirmed_funds=true)"
    error_id: ERR_FUNDS_NOT_CONFIRMED
    http_status: 402
    applies_to: "resale-listings close"

  - priority: 17
    category: business_constraint
    check: "Household may not hold more than one ACTIVE GroundLease in this program"
    error_id: ERR_MULTI_LEASE_PROHIBITED
    http_status: 409
    applies_to: "lease activation"

  - priority: 18
    category: business_constraint
    check: "Waitlist match: at least one eligible candidate after filtering; else no match"
    error_id: ERR_NO_ELIGIBLE_BUYER
    http_status: 422
    applies_to: "run-matching"

  - priority: 19
    category: business_constraint
    check: "Unit may have at most one ACTIVE GroundLease"
    error_id: ERR_UNIT_OCCUPIED
    http_status: 409
    applies_to: "lease activation"

  - priority: 20
    category: state
    check: "Optimistic concurrency: expected_*_version must match the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "OCC-guarded endpoints per §1.2.1"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- System / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default time is 2026-05-01T00:00:00Z; before any set_current_utc call, the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin, ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["Re-evaluates all time-based transitions: Household EXPIRED, WaitlistEntry EXPIRED, DefaultNotice ESCALATED, LeaseFee LATE, GroundLease EXPIRED, EducationCompletion expiry, inspection auto-scheduling"]

  # --- CLTProgram ---
  - method: POST
    path: "/programs"
    description: "Create a new CLT program"
    roles: [PlatformAdmin]
    code: 201
    input: [name, ami_table_effective_date, area_median_income_cents, max_eligibility_ami_pct, "ground_lease_term_years?", ground_lease_base_fee_cents, "low_income_fee_reduction_pct?", resale_formula_kind, "indexed_annual_appreciation_pct?", "appraisal_seller_share_pct?", "max_refi_ltv_pct?", "max_equity_withdrawal_cents?", "default_cure_window_days?", "inspection_cycle_months?"]
    output: CLTProgram
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/programs"
    description: "List programs"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Inspector, Household]
    code: 200
    input: ["limit?", "offset?"]
    output: "CLTProgram[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}"
    description: "Get a program"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Inspector, Household]
    code: 200
    input: []
    output: CLTProgram
    side_effects: []

  - method: PUT
    path: "/programs/{id}"
    description: "Update program parameters (triggers fee/subsidy recalculation)"
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "ami_table_effective_date?", "area_median_income_cents?", "max_eligibility_ami_pct?", "ground_lease_base_fee_cents?", "low_income_fee_reduction_pct?", "resale_formula_kind?", "indexed_annual_appreciation_pct?", "appraisal_seller_share_pct?", "max_refi_ltv_pct?", "max_equity_withdrawal_cents?", "default_cure_window_days?", "inspection_cycle_months?"]
    output: CLTProgram
    side_effects: ["On area_median_income_cents change: every Household.ami_pct recomputed; every GroundLease.monthly_fee_cents recomputed; PENDING LeaseFee rows re-amounted", "increments CLTProgram.version by 1"]

  - method: POST
    path: "/programs/{id}/suspend"
    description: "Suspend program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CLTProgram
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/programs/{id}/reinstate"
    description: "Reinstate program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CLTProgram
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/programs/{id}/close"
    description: "Close program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: CLTProgram
    side_effects: ["status → CLOSED; remaining ACTIVE WaitlistEntry rows → EXPIRED"]

  # --- Household ---
  - method: POST
    path: "/programs/{id}/households"
    description: "Create household (buyer applicant)"
    roles: [IntakeSpecialist]
    code: 201
    input: [legal_name, household_size, annual_gross_income_cents, "notes?"]
    output: Household
    side_effects: ["eligibility_status=PENDING"]

  - method: GET
    path: "/programs/{id}/households"
    description: "List households"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist]
    code: 200
    input: ["eligibility_status?", "limit?", "offset?"]
    output: "Household[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}/households/{householdId}"
    description: "Get household"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Household]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: POST
    path: "/programs/{id}/households/{householdId}/suspend"
    description: "Suspend household"
    roles: [LeaseManager]
    code: 200
    input: []
    output: Household
    side_effects: ["eligibility_status → SUSPENDED; ACTIVE WaitlistEntry rows → WITHDRAWN"]

  - method: POST
    path: "/programs/{id}/households/{householdId}/reinstate"
    description: "Reinstate suspended household"
    roles: [LeaseManager]
    code: 200
    input: []
    output: Household
    side_effects: ["eligibility_status → PENDING"]

  # --- IncomeCertification ---
  - method: POST
