              as: EscrowOfficer
              captures: { hb_a: $.data.id }
            - { call: "POST /escrow/holdbacks/${hb_a}/submit", payload: {}, as: EscrowOfficer }
            - call: "GET /escrow/holdbacks/${hb_a}/approvals"
              as: EscrowOfficer
              captures: { ap_a: "$.data[0].id" }
            - { call: "POST /escrow/approvals/${ap_a}/decide", payload: { decision: "APPROVED" }, as: Lender, as_user_id: "lender_1" }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_a}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }
              as: EscrowOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /escrow/files"
              payload: { property_address: "2 Cedar Ln", closing_date: "2026-08-01", buyer_user_id: "buyer_1", seller_user_id: "seller_1", lender_user_id: "lender_1" }
              as: EscrowOfficer
              captures: { file_b: $.data.id }
