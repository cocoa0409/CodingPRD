              payload: {}
              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "GET /fairtrade/certificate-holders/${prod_id}/premium-funds"
              payload: {}
              as: CertificationOfficer
              captures: { fund_v2: "$.data[0].version" }
            - call: "POST /fairtrade/premium-use-proposals"
