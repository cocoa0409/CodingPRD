  - section: consistency_model
    instances:
      - name: settle_immediately_visible_across_entities
        claim_type: immediate_consistency
        grounds:
          - state_machines.TrueUpReport.INVOICED_to_SETTLED
        distinguishing_aspect: "Immediate consistency: the settle response and a subsequent GET of the entitlement and anniversary show all cascaded effects in the same request sequence with no delay."
        test_recipe:
          setup: ["INVOICED report for product IM1 (entitlement 5, growth 2)"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "IM Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-IM-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "IM1", name: "IM Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 5 }
