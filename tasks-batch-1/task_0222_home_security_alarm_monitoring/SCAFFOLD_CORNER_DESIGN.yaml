# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Home Security & Alarm Monitoring — breadth probe over §1.1–§1.7.
# Section/claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_monitoring_plan_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.MonitoringPlan, endpoints]
        distinguishing_aspect: "POST /monitoring-plans with all required fields returns 201 and echoes tier/monthly_fee_cents/flags; id and created_at are system-minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
          assert:
            - "response status == 201"
            - "MonitoringPlan.${pid}.tier == BASIC"
            - "MonitoringPlan.${pid}.monthly_fee_cents == 1500"

      - name: get_account_returns_stored_data
        claim_type: Retrieval
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts/{id} returns the stored account with contract_status PENDING right after creation."
        test_recipe:
          setup: ["A plan and a PENDING account exist."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
          trigger:
            - call: "GET /accounts/${aid}"
              payload: {}
              as: Administrator
              captures: { cs: $.data.contract_status }
          assert:
            - "Account.${aid}.contract_status == PENDING"
            - "Account.${aid}.monitoring_status == SUSPENDED"

      - name: list_monitoring_plans_paginated_envelope
        claim_type: Listing
        grounds: [entities.MonitoringPlan, endpoints, response_envelope]
        distinguishing_aspect: "GET /monitoring-plans returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["One plan exists."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
          trigger:
            - call: "GET /monitoring-plans"
              payload: {}
              as: Administrator
          assert:
            - "response_type == array"
            - "meta/pagination total_count == 1 and has_more == false"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /accounts/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_account_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Account, "errors[ERR_VALIDATION]", endpoints]
        distinguishing_aspect: "POST /accounts omitting contract_term_months returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: create_account_invalid_premises_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Account.fields.premises_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /accounts with premises_type=OFFICE (not in {RESIDENTIAL,COMMERCIAL}) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { premises_type: "OFFICE", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_VALIDATION"

      - name: system_field_default_test_mode_false
        claim_type: Defaults
        grounds: [entities.SecuritySystem.fields.test_mode]
        distinguishing_aspect: "A freshly registered system has test_mode default false and arming_state DISARMED."
        test_recipe:
          setup: ["A plan and account exist."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
          assert:
            - "SecuritySystem.${sid}.test_mode == false"
            - "SecuritySystem.${sid}.arming_state == DISARMED"

      - name: system_computed_communicator_health_offline_on_stale_checkin
        claim_type: Computed Fields
        grounds: [calculations.communicator_health, entities.SecuritySystem.fields.communicator_health]
        distinguishing_aspect: "communicator_health is computed OFFLINE when last_checkin_minutes_ago > 360, ignoring any client-supplied health value."
        test_recipe:
          setup: ["A plan and account exist."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 361 }
              as: Administrator
              captures: { sid: $.data.id }
          assert:
            - "SecuritySystem.${sid}.communicator_health == OFFLINE"

      - name: monitoring_plan_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.MonitoringPlan]
        distinguishing_aspect: "MonitoringPlan has common_fields:false — no version field and no update endpoint; only id + created_at as system fields."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /monitoring-plans/${pid}"
              payload: {}
              as: Administrator
          assert:
            - "MonitoringPlan response has no version field"
            - "no PUT/PATCH endpoint for /monitoring-plans/{id} exists in §1.5"

      - name: create_system_unknown_account_id_returns_reference_not_found
        claim_type: Parent Relationships
        grounds: [entities.SecuritySystem.fields.account_id, "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /systems with a non-existent account_id returns ERR_REFERENCE_NOT_FOUND (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /systems"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: flat_fk_filter_systems_by_account_id
        claim_type: Creation
        grounds: [entities.SecuritySystem.fields.account_id, endpoints]
        distinguishing_aspect: "Flat-topology FK integrity: GET /systems?account_id=X returns only systems whose account_id == X."
        test_recipe:
          setup: ["Two accounts, one system on the first."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { a1: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { a2: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${a1}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
          trigger:
            - call: "GET /systems?account_id=${a2}"
              payload: {}
              as: Administrator
          assert:
            - "total_count == 0 for account ${a2}'s systems"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: account_initial_state_pending
        claim_type: Initial State
        grounds: [state_machines.Account, entities.Account.fields.contract_status]
        distinguishing_aspect: "A newly created account starts in contract_status PENDING."
        test_recipe:
          setup: ["A plan exists."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
          assert:
            - "Account.${aid}.contract_status == PENDING"

      - name: activate_account_without_system_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Account.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an account that has no SecuritySystem (sensor_count<1) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING account with no system."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: finalize_cancellation_from_pending_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Account.CANCELLATION_REQUESTED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "finalize-cancellation on a PENDING account (never requested) is an undefined transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A PENDING account (with a system, but not activated)."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "GET /accounts/${aid}"
              payload: {}
              as: Administrator
              captures: { av: $.data.version }
          trigger:
            - call: "POST /accounts/${aid}/finalize-cancellation"
              payload: { expected_account_version: "${av}" }
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: pay_already_paid_fine_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Fine.ASSESSED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a fine already in PAID is an undefined transition -> ERR_INVALID_STATE on the 2nd attempt."
        test_recipe:
          setup: ["An account with an ASSESSED fine that has been paid once. (Fine arises from a no-permit false alarm; ordinal 1 with no permit = 7500.)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { senid: $.data.id }
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sid}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sid}", sensor_id: "${senid}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { ev: $.data.id }
            - call: "POST /alarm-events/${ev}/route"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev}/dispatch"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-events/${ev}/resolve"
              payload: { resolution: "FALSE_ALARM" }
              as: MonitoringOperator
            - call: "GET /fines?alarm_event_id=${ev}"
              payload: {}
              as: Administrator
              captures: { fid: "$.data[0].id" }
            - call: "POST /fines/${fid}/pay"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /fines/${fid}/pay"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminal_cancelled_account_request_cancellation_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Account, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CANCELLED, request-cancellation is undefined -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["An account driven to CANCELLED via activate -> request -> finalize at day0."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
            - call: "POST /accounts/${aid}/request-cancellation"
              payload: {}
              as: Administrator
              captures: { av: $.data.version }
            - call: "POST /accounts/${aid}/finalize-cancellation"
              payload: { expected_account_version: "${av}" }
              as: Administrator
          trigger:
            - call: "POST /accounts/${aid}/request-cancellation"
              payload: {}
              as: Administrator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: disarm_resolves_received_burglary_event_false
        claim_type: Side Effect Execution
        grounds: [state_machines.SecuritySystem.ARMED_AWAY_to_DISARMED, state_machines.AlarmEvent]
        distinguishing_aspect: "Cross-entity side effect: disarming resolves a still-RECEIVED BURGLARY event on that system to RESOLVED_FALSE; FIRE events are untouched."
        test_recipe:
          setup: ["Activated armed-away system; a RECEIVED BURGLARY event and a RECEIVED FIRE event exist (ingested while armed)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "PRO", monthly_fee_cents: 6200, police_dispatch_included: true, max_sensors: 32, cellular_backup_included: true }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "CELLULAR", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "MOTION" }
              as: Administrator
              captures: { sen1: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 2, sensor_type: "SMOKE" }
              as: Administrator
              captures: { sen2: $.data.id }
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
            - call: "POST /systems/${sid}/arm"
              payload: { mode: "ARMED_AWAY" }
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /alarm-events"
              payload: { system_id: "${sid}", sensor_id: "${sen1}", signal_type: "BURGLARY" }
              as: MonitoringOperator
              captures: { evb: $.data.id }
            - call: "POST /alarm-events"
              payload: { system_id: "${sid}", sensor_id: "${sen2}", signal_type: "FIRE" }
              as: MonitoringOperator
              captures: { evf: $.data.id }
          trigger:
            - call: "POST /systems/${sid}/disarm"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
            - call: "GET /alarm-events/${evb}"
              payload: {}
              as: Administrator
              captures: { bs: $.data.status }
            - call: "GET /alarm-events/${evf}"
              payload: {}
              as: Administrator
              captures: { fs: $.data.status }
          assert:
            - "AlarmEvent.${evb}.status == RESOLVED_FALSE"
            - "AlarmEvent.${evf}.status == RECEIVED (FIRE unaffected)"

      - name: withdraw_cancellation_resets_etf_to_zero
        claim_type: Side Effect Execution
        grounds: [state_machines.Account.CANCELLATION_REQUESTED_to_ACTIVE, calculations.early_termination_fee]
        distinguishing_aspect: "Withdrawing a cancellation resets early_termination_fee_cents to 0 and returns contract_status to ACTIVE."
        test_recipe:
          setup: ["Activated account at day0, term 12mo; cancellation requested (ETF frozen at 24000)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: Administrator
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
            - call: "POST /systems"
              payload: { account_id: "${aid}", primary_path: "BROADBAND", cellular_signal_dbm: -60, backup_battery_pct: 100, last_checkin_minutes_ago: 5 }
              as: Administrator
              captures: { sid: $.data.id }
            - call: "POST /sensors"
              payload: { system_id: "${sid}", zone_number: 1, sensor_type: "DOOR" }
              as: Administrator
            - call: "POST /accounts/${aid}/activate"
              payload: {}
              as: Administrator
            - call: "POST /accounts/${aid}/request-cancellation"
              payload: {}
              as: Administrator
              captures: { etf_frozen: $.data.early_termination_fee_cents }
          trigger:
            - call: "POST /accounts/${aid}/withdraw-cancellation"
              payload: {}
              as: Administrator
              captures: { cs: $.data.contract_status, etf: $.data.early_termination_fee_cents }
          assert:
            - "after request early_termination_fee_cents == 24000"
            - "Account.${aid}.contract_status == ACTIVE after withdraw"
            - "Account.${aid}.early_termination_fee_cents == 0 after withdraw"

      - name: account_cyclic_arming_already_covered
        claim_type: Valid Transition
        grounds: [state_machines.SecuritySystem.DISARMED_to_ARMED_AWAY]
        excluded_because:
          difficulty_instance: non_linear_state_machine / system_arming_cycle_disarmed_armed_disarmed
          rationale: "The cyclic arming valid-transition path is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: permit_fee_residential_ontime_base_only
        claim_type: Correct Result
        grounds: [calculations.permit_fee, entities.Permit.fields.fee_total_cents]
        distinguishing_aspect: "Residential on-time permit fee == BASE_PERMIT_FEE_CENTS (5000) with no uplift and no penalty."
        test_recipe:
          setup: ["A residential account exists."]
          setup_api_calls:
            - call: "POST /monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1500, police_dispatch_included: false, max_sensors: 8, cellular_backup_included: false }
              as: Administrator
              captures: { pid: $.data.id }
            - call: "POST /accounts"
              payload: { premises_type: "RESIDENTIAL", plan_id: "${pid}", contract_term_months: 12 }
              as: Administrator
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /permits"
