# =============================================================================
# Scaffold: Comic Book & Graphic-Novel Shop (pull-list) — Expert difficulty
# =============================================================================

scenario: |
  729. Comic Book & Graphic-Novel Shop (pull-list): pull/subscription box & weekly reservation,
  new-comic-day allocation, back-issue grading & inventory, pre-order (Previews) & cutoff,
  grading-submission intake, loyalty/store credit, event/signing, consignment

domain_name: comic-book-shop
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths. Every collection
  # is a top-level resource under /api. Chosen for diversity (flat = prioritized).
  state_machine_shape: cyclic
  # GradingSubmission carries a dispute/resubmit loop; Consignment forks; Subscription
  # oscillates ACTIVE<->PAUSED. Non-linear on multiple entities.
  relationship_patterns:
    - one_to_many        # Customer -> Reservation/PreOrder/Consignment; ComicSeries -> ComicIssue
    - cross_aggregate    # Reservation references ComicIssue across aggregate boundary
  role_model: hierarchical_override
  # Manager superset of Clerk; Customer is an entity-backed peer acting on own resources.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Contact email; unique per customer" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: loyalty_tier, type: enum, source: computed, default: BRONZE, description: "BRONZE | SILVER | GOLD — recomputed by loyalty_tier_assignment from lifetime_spend_cents plus forward-looking confirmed pre-orders", constraints: "one of {BRONZE, SILVER, GOLD}" }
      - { name: loyalty_points_balance, type: integer, source: system, default: 0, description: "Loyalty points accrued at checkout; never spent by this scaffold (accrual only)" }
      - { name: store_credit_cents, type: integer, source: system, default: 0, description: "Store-credit wallet balance in cents; mutated by credit-adjustments, refunds, consignment payouts, and checkout redemptions" }
      - { name: lifetime_spend_cents, type: integer, source: computed, default: 0, description: "Cumulative amount_due_cents across settled checkouts; input to loyalty tier" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | BANNED", constraints: "one of {ACTIVE, BANNED}" }

  - name: ComicSeries
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Series title" }
      - { name: publisher, type: string, source: input, description: "Publisher name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED", constraints: "one of {ACTIVE, DISCONTINUED}" }

  - name: ComicIssue
    parent: null
    common_fields: true
    fields:
      - { name: series_id, type: string, source: input, description: "FK -> ComicSeries.id; the series this issue belongs to" }
      - { name: issue_number, type: string, source: input, description: "Issue number label, e.g. '1', '1B'" }
      - { name: cover_price_cents, type: integer, source: input, description: "Cover price in cents", constraints: ">= 0" }
      - { name: on_sale_date, type: datetime, source: input, description: "New-comic-day on-sale date (ISO 8601 UTC)" }
      - { name: order_cutoff_date, type: datetime, source: input, description: "Previews order cutoff (ISO 8601 UTC); pre-orders forbidden at/after this instant" }
      - { name: copies_ordered, type: integer, source: input, default: 0, description: "Total copies ordered from distributor; the finite allocation pool", constraints: ">= 0" }
      - { name: copies_reserved, type: integer, source: system, default: 0, description: "Soft demand: sum of requested_qty across non-terminal Reservations; bumped on reserve" }
      - { name: copies_allocated, type: integer, source: computed, default: 0, description: "Sum of allocated_qty across Reservations in {ALLOCATED, PULLED, SOLD}" }
      - { name: copies_available, type: integer, source: computed, description: "= copies_ordered - copies_allocated" }
      - { name: status, type: enum, source: system, default: SOLICITED, description: "SOLICITED | ORDERED | ON_SALE | CLOSED", constraints: "one of {SOLICITED, ORDERED, ON_SALE, CLOSED}" }

  - name: PullSubscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscriber" }
      - { name: series_id, type: string, source: input, description: "FK -> ComicSeries.id; the subscribed series" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED | CANCELLED", constraints: "one of {ACTIVE, PAUSED, CANCELLED}" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; who the copy is held for" }
      - { name: issue_id, type: string, source: input, description: "FK -> ComicIssue.id; the issue being reserved" }
      - { name: subscription_id, type: string, source: input, description: "FK -> PullSubscription.id; optional standing-order link (null for one-off weekly reservation)" }
      - { name: requested_qty, type: integer, source: input, default: 1, description: "Copies requested", constraints: ">= 1" }
      - { name: allocated_qty, type: integer, source: computed, default: 0, description: "Copies granted by run-allocation; 0 until allocation runs" }
      - { name: unit_price_cents, type: integer, source: computed, default: 0, description: "Copied from ComicIssue.cover_price_cents at SELL" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | WAITLISTED | ALLOCATED | PULLED | SOLD | RELEASED | EXPIRED", constraints: "one of {RESERVED, WAITLISTED, ALLOCATED, PULLED, SOLD, RELEASED, EXPIRED}" }

  - name: PreOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; who pre-ordered" }
      - { name: issue_id, type: string, source: input, description: "FK -> ComicIssue.id; the pre-ordered issue" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Copies pre-ordered", constraints: ">= 1" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "= quantity * ComicIssue.cover_price_cents at creation" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CONFIRMED | FULFILLED | CANCELLED", constraints: "one of {PENDING, CONFIRMED, FULFILLED, CANCELLED}" }

  - name: BackIssue
    parent: null
    common_fields: true
    fields:
      - { name: series_id, type: string, source: input, description: "FK -> ComicSeries.id; series of this back-issue copy" }
      - { name: issue_number, type: string, source: input, description: "Issue number label" }
      - { name: condition, type: enum, source: input, description: "RAW | GRADED", constraints: "one of {RAW, GRADED}" }
      - { name: grade_value, type: number, source: input, default: null, description: "Numeric grade (e.g. 9.8) when condition=GRADED; null when RAW" }
      - { name: price_cents, type: integer, source: input, description: "Listed price in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: IN_STOCK, description: "IN_STOCK | RESERVED | SOLD", constraints: "one of {IN_STOCK, RESERVED, SOLD}" }

  - name: GradingSubmission
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the book submitted for grading" }
      - { name: description, type: string, source: input, description: "Free-text description of the submitted book" }
      - { name: declared_value_cents, type: integer, source: input, description: "Owner-declared value in cents", constraints: ">= 0" }
      - { name: grade_result, type: number, source: system, default: null, description: "Grade assigned by the grader; set on RETURNED" }
      - { name: dispute_count, type: integer, source: system, default: 0, description: "Number of times owner disputed the returned grade (resubmit loop counter)" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | SUBMITTED | AT_GRADER | RETURNED | READY_FOR_PICKUP | PICKED_UP", constraints: "one of {INTAKE, SUBMITTED, AT_GRADER, RETURNED, READY_FOR_PICKUP, PICKED_UP}" }

  - name: CreditTransaction
    parent: null
    common_fields: false   # append-only event: only id + created_at
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; wallet owner affected" }
      - { name: amount_cents, type: integer, source: input, description: "Signed delta to store_credit_cents (positive credit, negative debit)" }
      - { name: reason, type: enum, source: input, description: "CONSIGNMENT_PAYOUT | REFUND | ADJUSTMENT | REDEMPTION", constraints: "one of {CONSIGNMENT_PAYOUT, REFUND, ADJUSTMENT, REDEMPTION}" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Customer.store_credit_cents immediately after this transaction was applied" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event / signing name" }
      - { name: store_location, type: string, source: input, description: "Venue identifier; events at the same store_location must not overlap in time" }
      - { name: starts_at, type: datetime, source: input, description: "Event start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Event end (ISO 8601 UTC); must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum registrations", constraints: ">= 0" }
      - { name: registered_count, type: integer, source: computed, default: 0, description: "Count of EventRegistrations in {REGISTERED, CHECKED_IN}" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | CLOSED | COMPLETED | CANCELLED", constraints: "one of {DRAFT, OPEN, CLOSED, COMPLETED, CANCELLED}" }

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the registrant" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the event registered for" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | CHECKED_IN | CANCELLED | NO_SHOW", constraints: "one of {REGISTERED, CHECKED_IN, CANCELLED, NO_SHOW}" }

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - { name: consignor_id, type: string, source: input, description: "FK -> Customer.id; the customer consigning the item" }
      - { name: description, type: string, source: input, description: "Description of the consigned item" }
      - { name: asking_price_cents, type: integer, source: input, description: "Consignor's asking price in cents", constraints: ">= 0" }
      - { name: commission_pct, type: number, source: input, default: 0.30, description: "Shop commission fraction in [0,1)", constraints: ">= 0 and < 1" }
      - { name: sale_price_cents, type: integer, source: input, default: null, description: "Actual sale price in cents; provided at SELL" }
      - { name: provisional_payout_cents, type: integer, source: computed, default: null, description: "Estimated payout computed at LIST from asking_price_cents" }
      - { name: final_payout_cents, type: integer, source: computed, default: null, description: "Actual payout computed at SELL from sale_price_cents" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | LISTED | SOLD | RETURNED_TO_CONSIGNOR | PAID_OUT", constraints: "one of {RECEIVED, LISTED, SOLD, RETURNED_TO_CONSIGNOR, PAID_OUT}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ComicIssue
    initial_state: SOLICITED
    terminal_states: [CLOSED]
    transitions:
      - from: SOLICITED
        to: ORDERED
        trigger: "POST /api/comic-issues/{id}/transition {to_status: ORDERED}"
        actor: Clerk
        preconditions: ["ComicSeries.status == ACTIVE"]
        side_effects: []
      - from: ORDERED
        to: ON_SALE
        trigger: "POST /api/comic-issues/{id}/transition {to_status: ON_SALE}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: ON_SALE
        to: CLOSED
        trigger: "POST /api/comic-issues/{id}/transition {to_status: CLOSED}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "Every Reservation on this issue still in {RESERVED, WAITLISTED, ALLOCATED} transitions to EXPIRED"
          - "Each EXPIRED reservation decrements ComicIssue.copies_reserved by its requested_qty and, if it had allocated_qty>0, increments copies_available (copies_allocated -= allocated_qty)"

  - entity: PullSubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/pull-subscriptions/{id}/transition {to_status: PAUSED}"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/pull-subscriptions/{id}/transition {to_status: ACTIVE}"
        actor: Customer
        preconditions: []
        side_effects: []
        note: "Oscillation ACTIVE<->PAUSED forms the cyclic shape on this entity"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/pull-subscriptions/{id}/transition {to_status: CANCELLED}"
        actor: Customer
        preconditions: []
        side_effects:
          - "CASCADE HOP 1: every linked Reservation (subscription_id == this.id) in {RESERVED, WAITLISTED, ALLOCATED} transitions to RELEASED"
          - "CASCADE HOP 2: each RELEASED reservation decrements ComicIssue.copies_reserved by requested_qty; if the reservation had allocated_qty > 0, ComicIssue.copies_allocated -= allocated_qty (copies_available rises by allocated_qty)"
          - "CASCADE HOP 3: for each issue whose copies_available rose above 0, the earliest-created (created_at ASC) Reservation on that issue in WAITLISTED status is promoted to ALLOCATED (allocated_qty = min(requested_qty, copies_available, tier cap)); this decrements that issue's copies_available"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /api/pull-subscriptions/{id}/transition {to_status: CANCELLED}"
        actor: Customer
        preconditions: []
        side_effects: ["Same cascade as ACTIVE->CANCELLED"]

  - entity: Reservation
    initial_state: RESERVED
    terminal_states: [SOLD, RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: ALLOCATED
        trigger: "system (POST /api/comic-issues/{id}/run-allocation)"
        actor: Clerk
        preconditions:
          - "ComicIssue.status == ON_SALE (allocation only runs for on-sale issues)"
          - "allocated_qty granted = min(requested_qty, remaining copies_available, tier cap) and must be > 0 to reach ALLOCATED"
        side_effects: ["allocated_qty set; ComicIssue.copies_allocated += allocated_qty; copies_available recomputed"]
      - from: RESERVED
        to: WAITLISTED
        trigger: "system (POST /api/comic-issues/{id}/run-allocation)"
        actor: Clerk
        preconditions: ["remaining copies_available == 0 at the time this reservation is processed (granted allocation would be 0)"]
        side_effects: []
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "system (cascade HOP 3 from a subscription cancel, or POST /api/comic-issues/{id}/run-allocation re-run)"
        actor: system
        preconditions: ["ComicIssue.copies_available >= 1"]
        side_effects: ["allocated_qty = min(requested_qty, copies_available, tier cap); ComicIssue.copies_allocated += allocated_qty"]
      - from: ALLOCATED
        to: PULLED
        trigger: "POST /api/reservations/{id}/transition {to_status: PULLED}"
        actor: Clerk
        preconditions: ["ComicIssue.status == ON_SALE"]
        side_effects: []
      - from: PULLED
        to: SOLD
        trigger: "POST /api/reservations/{id}/transition {to_status: SOLD}"
        actor: Clerk
        preconditions: []
        side_effects: ["unit_price_cents = ComicIssue.cover_price_cents"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /api/reservations/{id}/transition {to_status: RELEASED}"
        actor: Customer
        preconditions: []
        side_effects: ["ComicIssue.copies_reserved -= requested_qty"]
      - from: WAITLISTED
        to: RELEASED
        trigger: "POST /api/reservations/{id}/transition {to_status: RELEASED}"
        actor: Customer
        preconditions: []
        side_effects: ["ComicIssue.copies_reserved -= requested_qty"]
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /api/reservations/{id}/transition {to_status: RELEASED}"
        actor: Customer
        preconditions: ["release must not drive ComicIssue.copies_available below 0 or copies_allocated below 0 (invariant guard)"]
        side_effects:
          - "ComicIssue.copies_reserved -= requested_qty; copies_allocated -= allocated_qty (copies_available rises by allocated_qty)"
          - "The earliest-created WAITLISTED Reservation on that issue is promoted to ALLOCATED if copies_available >= 1"

  - entity: PreOrder
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /api/pre-orders/{id}/transition {to_status: CONFIRMED}"
        actor: Clerk
        preconditions:
          - "current clock < ComicIssue.order_cutoff_date (business_temporal; else ERR_PAST_CUTOFF)"
          - "ComicIssue.status in {SOLICITED, ORDERED} (cross-entity; else ERR_ISSUE_ALREADY_ON_SALE)"
        side_effects: ["Customer loyalty_tier recomputed (forward-looking variant now counts this CONFIRMED pre-order)"]
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /api/pre-orders/{id}/transition {to_status: FULFILLED}"
        actor: Clerk
        preconditions: ["ComicIssue.status == ON_SALE"]
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/pre-orders/{id}/transition {to_status: CANCELLED}"
        actor: Customer
        preconditions: []
        side_effects: ["Customer loyalty_tier recomputed"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/pre-orders/{id}/transition {to_status: CANCELLED}"
        actor: Customer
        preconditions: []
        side_effects: ["Customer loyalty_tier recomputed (this pre-order no longer counts in forward-looking spend)"]

  - entity: BackIssue
    initial_state: IN_STOCK
    terminal_states: [SOLD]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "POST /api/back-issues/{id}/transition {to_status: RESERVED}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: IN_STOCK
        trigger: "POST /api/back-issues/{id}/transition {to_status: IN_STOCK}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: SOLD
        trigger: "POST /api/back-issues/{id}/transition {to_status: SOLD}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: SOLD
        trigger: "POST /api/back-issues/{id}/transition {to_status: SOLD}"
        actor: Clerk
        preconditions: []
        side_effects: []

  - entity: GradingSubmission
    initial_state: INTAKE
    terminal_states: [PICKED_UP]
    transitions:
      - from: INTAKE
        to: SUBMITTED
        trigger: "POST /api/grading-submissions/{id}/transition {to_status: SUBMITTED}"
        actor: Clerk
        preconditions: ["Customer.status == ACTIVE"]
        side_effects: []
      - from: SUBMITTED
        to: AT_GRADER
        trigger: "POST /api/grading-submissions/{id}/transition {to_status: AT_GRADER}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: AT_GRADER
        to: RETURNED
        trigger: "POST /api/grading-submissions/{id}/transition {to_status: RETURNED, grade_result: <number>}"
        actor: Clerk
        preconditions: ["grade_result provided"]
        side_effects: ["grade_result recorded"]
      - from: RETURNED
        to: AT_GRADER
        trigger: "POST /api/grading-submissions/{id}/transition {to_status: AT_GRADER}"
        actor: Customer
        preconditions: ["dispute_count < DISPUTE_LIMIT (3)"]
        side_effects: ["dispute_count += 1 (owner disputes the grade; resubmit loop)"]
        note: "Cyclic loop RETURNED->AT_GRADER->RETURNED; bounded by DISPUTE_LIMIT"
      - from: RETURNED
        to: READY_FOR_PICKUP
        trigger: "POST /api/grading-submissions/{id}/transition {to_status: READY_FOR_PICKUP}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /api/grading-submissions/{id}/transition {to_status: PICKED_UP}"
        actor: Clerk
        preconditions: []
        side_effects: []

  - entity: Event
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/events/{id}/transition {to_status: OPEN}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/events/{id}/transition {to_status: CLOSED}"
        actor: Clerk
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: COMPLETED
        trigger: "POST /api/events/{id}/transition {to_status: COMPLETED}"
        actor: Clerk
        preconditions: []
        side_effects: ["Every EventRegistration still REGISTERED transitions to NO_SHOW"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/events/{id}/transition {to_status: CANCELLED}"
        actor: Clerk
        preconditions: []
        side_effects: ["Every EventRegistration in {REGISTERED, CHECKED_IN} transitions to CANCELLED; registered_count -> 0"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/events/{id}/transition {to_status: CANCELLED}"
        actor: Clerk
        preconditions: []
        side_effects: []

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED, NO_SHOW]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /api/event-registrations/{id}/transition {to_status: CHECKED_IN}"
        actor: Clerk
        preconditions: ["Event.status == OPEN (cross-entity)"]
        side_effects: []
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /api/event-registrations/{id}/transition {to_status: CANCELLED}"
        actor: Customer
        preconditions: []
        side_effects: ["Event.registered_count -= 1"]
      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "POST /api/event-registrations/{id}/transition {to_status: NO_SHOW}"
        actor: Clerk
        preconditions: []
        side_effects: ["Event.registered_count -= 1"]

  - entity: Consignment
    initial_state: RECEIVED
    terminal_states: [RETURNED_TO_CONSIGNOR, PAID_OUT]
    transitions:
      - from: RECEIVED
        to: LISTED
        trigger: "POST /api/consignments/{id}/transition {to_status: LISTED}"
        actor: Clerk
        preconditions: ["Customer(consignor).status == ACTIVE (cross-entity)"]
        side_effects: ["provisional_payout_cents = round_half_up(asking_price_cents * (1 - commission_pct))"]
      - from: LISTED
        to: SOLD
        trigger: "POST /api/consignments/{id}/transition {to_status: SOLD, sale_price_cents: <int>}"
        actor: Clerk
        preconditions: ["sale_price_cents provided (ERR_SALE_PRICE_REQUIRED otherwise)"]
        side_effects: ["final_payout_cents = round_half_up(sale_price_cents * (1 - commission_pct))"]
      - from: LISTED
        to: RETURNED_TO_CONSIGNOR
        trigger: "POST /api/consignments/{id}/transition {to_status: RETURNED_TO_CONSIGNOR}"
        actor: Clerk
        preconditions: []
        side_effects: ["No payout; branch diverges from SOLD (no CreditTransaction, no store-credit change)"]
        note: "Fork: LISTED -> {SOLD, RETURNED_TO_CONSIGNOR} with divergent side-effect sets"
      - from: SOLD
        to: PAID_OUT
        trigger: "POST /api/consignments/{id}/transition {to_status: PAID_OUT}"
        actor: Manager
        preconditions: []
        side_effects:
          - "CASCADE HOP 1: create CreditTransaction (reason=CONSIGNMENT_PAYOUT, amount_cents=final_payout_cents) for consignor; Customer.store_credit_cents += final_payout_cents"
          - "CASCADE HOP 2: consignor Customer.loyalty_tier recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reserve-stale-issue
    parent_entity: ComicIssue
    write_endpoint: "POST /api/reservations"
    occ_field: "expected_comic_issue_version"
    description: |
      Creating a Reservation against a ComicIssue whose version has advanced since the client
      last observed it is rejected. A prior Reservation create against the same issue legitimately
      bumped copies_reserved and the issue's version; the current writer's view of the issue is
      therefore stale. Both creates would otherwise succeed identically, so this is a genuine
      supersede-style write that OCC reduces to a stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: new_comic_day_allocation
    trigger: "POST /api/comic-issues/{id}/run-allocation; also cascade HOP 3 promotions"
    algorithm: waterfall_allocation
    formula: |
      # Candidate set: Reservations on the issue with status == RESERVED.
      # Processing order (deterministic): loyalty_tier rank DESC (GOLD=3, SILVER=2, BRONZE=1),
      #   then Reservation.created_at ASC (earliest first). NEVER id.
      remaining = issue.copies_available   # = copies_ordered - copies_allocated
      for r in ordered_candidates:
        tier_cap = TIER_MAX[customer.loyalty_tier]
        grant = min(r.requested_qty, remaining, tier_cap)
        if grant >= 1:
          r.allocated_qty = grant
          r.status = ALLOCATED
          issue.copies_allocated += grant
          remaining -= grant
        else:
          r.status = WAITLISTED   # grant would be 0 (remaining == 0)
    input_set: "Reservations with status == RESERVED for this issue; issue must be ON_SALE"
    constants:
      TIER_MAX: { BRONZE: 1, SILVER: 2, GOLD: 3 }
    precision: "integer copies; no rounding"

  - name: loyalty_points_earned
    trigger: "POST /api/checkout"
    algorithm: weighted_scoring
    formula: |
      # Mode (b): nested rounding where order matters. PIN: floor PER LINE ITEM, THEN sum.
      # (Summing cents first then flooring once yields a different total.)
      mult = TIER_MULT[customer.loyalty_tier]
      points = 0
      for li in line_items:
        line_total_cents = li.unit_price_cents * li.quantity
        points += floor((line_total_cents / 100.0) * mult)   # floor each line
      return points   # sum of per-line floored values
    input_set: "All line_items in the checkout payload"
    constants:
      TIER_MULT: { BRONZE: 1.0, SILVER: 1.25, GOLD: 1.5 }
    precision: "floor per line item, then integer sum"

  - name: checkout_settlement
    trigger: "POST /api/checkout"
    algorithm: aggregation
    formula: |
      amount_due_cents = sum(li.unit_price_cents * li.quantity for li in line_items)
      if pay_with_store_credit_only == true:
        if customer.store_credit_cents < amount_due_cents: reject ERR_INSUFFICIENT_STORE_CREDIT
      store_credit_applied_cents = min(customer.store_credit_cents, amount_due_cents)
      charge_cents = amount_due_cents - store_credit_applied_cents   # boundary: == 0 when credit exactly covers
      # side effects:
      customer.store_credit_cents -= store_credit_applied_cents
      if store_credit_applied_cents > 0: create CreditTransaction(reason=REDEMPTION, amount_cents = -store_credit_applied_cents)
      customer.lifetime_spend_cents += amount_due_cents
      customer.loyalty_points_balance += loyalty_points_earned
      recompute customer.loyalty_tier
    input_set: "line_items array; customer.store_credit_cents"
    precision: "integer cents"

  - name: consignment_payout
    trigger: "Consignment LISTED (provisional) and SOLD (final)"
    algorithm: threshold
    formula: |
      provisional_payout_cents = round_half_up(asking_price_cents * (1 - commission_pct))   # at LIST
      final_payout_cents       = round_half_up(sale_price_cents   * (1 - commission_pct))   # at SELL
    input_set: "Single Consignment; asking_price_cents at LIST, sale_price_cents at SELL"
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "Consignment transitions RECEIVED -> LISTED"
        difference: "Uses asking_price_cents; an estimate before a buyer is found"
      - name: final
        when: "Consignment transitions LISTED -> SOLD"
        difference: "Uses actual sale_price_cents; drives the CONSIGNMENT_PAYOUT credit at PAID_OUT. Diverges from provisional whenever sale_price_cents != asking_price_cents"

  - name: loyalty_tier_assignment
    trigger: "POST /api/checkout; PreOrder CONFIRM/CANCEL; Consignment PAID_OUT"
    algorithm: threshold
    formula: |
      # Dual variant on the Customer domain.
      settled_spend = customer.lifetime_spend_cents
      forward_spend = settled_spend + sum(po.estimated_total_cents for po in customer's PreOrders with status == CONFIRMED)
      basis = forward_spend      # forward-looking variant (the one the system persists)
      if basis >= GOLD_THRESHOLD: tier = GOLD
      elif basis >= SILVER_THRESHOLD: tier = SILVER
      else: tier = BRONZE
    input_set: "Customer.lifetime_spend_cents plus estimated_total_cents of CONFIRMED PreOrders"
    constants:
      SILVER_THRESHOLD: 50000
      GOLD_THRESHOLD: 150000
    precision: "integer cents; boundary is inclusive (>=)"
    variants:
      - name: forward_looking
        when: "Persisted tier used for allocation caps and point multipliers"
        difference: "Includes CONFIRMED (not-yet-fulfilled) pre-orders' estimated_total_cents"
      - name: settled_only
        when: "Chronological audit basis (lifetime_spend_cents only)"
        difference: "Excludes CONFIRMED pre-orders; can yield a lower tier than forward_looking for the same customer"

  - name: issue_copies_available
    trigger: "any change to copies_ordered or copies_allocated"
    algorithm: aggregation
    formula: |
      copies_allocated = sum(r.allocated_qty for r in Reservations on issue with status in {ALLOCATED, PULLED, SOLD})
      copies_available = copies_ordered - copies_allocated
      # Invariant (all times): copies_available + copies_allocated == copies_ordered
    input_set: "Reservations on the issue in {ALLOCATED, PULLED, SOLD}"
    precision: "integer copies"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7; entity-backed Customer acts only on own resources"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path ids and FK body ids resolve to existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers in range, ends_at > starts_at, commission_pct in [0,1)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition/operation is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition and lifecycle endpoints"
  - priority: 6
    category: business_temporal
    check: "Time-window rules: pre-order CONFIRM before order_cutoff_date; event registration before event starts_at"
    error_id: "ERR_PAST_CUTOFF / ERR_EVENT_ALREADY_STARTED"
    http_status: 422
    applies_to: "POST /api/pre-orders/{id}/transition, POST /api/event-registrations"
  - priority: 7
    category: business_referential
    check: "Cross-entity linked state: issue ON_SALE for allocation/pull; event OPEN for registration/check-in; series ACTIVE; consignor ACTIVE"
    error_id: "ERR_ISSUE_NOT_ON_SALE / ERR_EVENT_CLOSED / ERR_SERIES_DISCONTINUED / ERR_CUSTOMER_BANNED"
    http_status: 409
    applies_to: "allocation, reservation pull, event registration/check-in, issue/consignment lifecycle"
  - priority: 8
    category: business_constraint
    check: "Capacity, overlap, uniqueness, and allocation limits: event capacity, event time overlap, registration time overlap, duplicate registration, copies availability, dispute limit"
    error_id: "ERR_EVENT_FULL / ERR_EVENT_TIME_CONFLICT / ERR_REGISTRATION_TIME_CONFLICT / ERR_DUPLICATE_REGISTRATION / ERR_INSUFFICIENT_COPIES / ERR_DISPUTE_LIMIT_REACHED / ERR_ALLOCATION_ALREADY_RUN / ERR_NEGATIVE_INVENTORY"
    http_status: 409
    applies_to: "events, event-registrations, allocation, reservation release, grading dispute"
  - priority: 9
    category: business_fiscal
    check: "Funds checks: store-credit-only checkout requires sufficient store_credit_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /api/checkout"
  - priority: 10
    category: state
    check: "Optimistic concurrency: expected_comic_issue_version must equal current ComicIssue.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/reservations"

