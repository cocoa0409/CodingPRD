            - "Appointment.${appt_id}.approved_by_user_id == user-gs-1 (unchanged by either payroll-axis transition)"

      - name: renewal_certification_revoked_cycle_increments_revision_count
        grounds:
          - state_machines.RenewalDecision.DRAFT_to_SAP_CERTIFIED
          - state_machines.RenewalDecision.SAP_CERTIFIED_to_DRAFT
          - entities.RenewalDecision.fields.revision_count
          - entities.GraduateStudent.fields.sap_status
        distinguishing_aspect: |
          RenewalDecision is cyclic, not linear: an academic-progress downgrade drags SAP_CERTIFIED
          back to DRAFT and increments revision_count to 1, and a second certification after the
          student is restored to SATISFACTORY returns to SAP_CERTIFIED while revision_count stays 1
          and certified_by_user_id is repopulated - a linear implementation cannot reach DRAFT twice.
        test_recipe:
          setup:
            - "Logical clock set to 2026-10-01T00:00:00Z, inside the renewal window of an appointment ending 2026-12-15 (window opens 2026-08-17, notice deadline 2026-10-16)."
            - "Term RNW2026 (2026-09-01..2026-12-15, CALENDAR_DAY) OPEN with a single pay period [2026-09-01, 2026-12-16)."
