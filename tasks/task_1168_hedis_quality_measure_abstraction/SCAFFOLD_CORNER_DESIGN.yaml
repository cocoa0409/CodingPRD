          - "errors[ERR_OVERREADS_OUTSTANDING]"
        distinguishing_aspect: "A flagged SUBMITTED abstraction without an over-read blocks finalize with ERR_OVERREADS_OUTSTANDING (chases are all resolved, so 12.2/12.3 pass and 12.4 is the firing gate)."
        test_recipe:
