  # ===================================================================================
  - section: endpoints
    instances:

      - name: applicant_crud_round_trip_re_derives_the_tax_and_visa_picture
        claim_type: standard_crud
        grounds: ["endpoints[POST /applicants]", "endpoints[GET /applicants/{id}]", "endpoints[PATCH /applicants/{id}]", "endpoints[GET /applicants]", "entities.Applicant.is_international"]
        distinguishing_aspect: "Applicant is the one entity whose full create/read/update/list cycle is externally visible AND whose update has declared downstream consequences: PATCHing citizenship_country must re-derive is_international and, on subsequent reads, the residency's visa_required and tax_form_type. The read-after-write must therefore be checked on a DIFFERENT entity than the one that was written."
        test_recipe:
          setup: ["An OPEN cycle with one discipline and a US applicant holding one invited residency, so the residency currently reads visa_required false / tax_form_type W9."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id", art_v0: "$.data.version" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
          trigger:
            - call: "PATCH /applicants/${art}"
              payload: { affiliation_org: "Harbour Works", citizenship_country: "FR", treaty_country: true, declared_annual_income_cents: 1750000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_v1: "$.data.version" }
          assert:
            - "create returned 201 with every input echoed and the computed pair is_international false / completed_residency_count 0"
            - "read matches write: GET /applicants/${art} returns the same field values as the create response, and GET /applicants?email=ada.rivet@example.org returns total_count == 1 containing it"
            - "the PATCH returns 200 with affiliation_org 'Harbour Works', citizenship_country 'FR', treaty_country true, declared_annual_income_cents 1750000 and version ${art_v1} == ${art_v0} + 1"
            - "the update re-derived the computed field on the SAME entity: is_international is now true"
            - "and on a DIFFERENT entity on the next read: GET /residencies/${res} now reads visa_required true and tax_form_type '1042S', where it read false and 'W9' before the PATCH"
            - "unsupplied fields are left alone rather than nulled: full_name is still 'Ada Rivet' and email is still 'ada.rivet@example.org' (email is not even a PATCH input, so sending it returns 400 ERR_VALIDATION)"
            - "uniqueness is enforced on create, not silently deduplicated: a second POST /applicants with email 'ada.rivet@example.org' returns 409 ERR_DUPLICATE_CODE"
            - "there is no DELETE /applicants/{id} in §1.5 - artists accumulate as the alumni network, so the D of CRUD is deliberately absent and the alumni counter completed_residency_count is the only lifecycle signal"

      - name: tax_report_reconciles_both_withholding_variants_without_writing
        claim_type: computed_read
        grounds: ["endpoints[GET /residencies/{id}/tax-report]", "calculations.stipend_withholding", "constants.TREATY_WITHHOLDING_RATE", "constants.WITHHOLDING_EXEMPT_THRESHOLD_CENTS"]
        distinguishing_aspect: "The report is the only place both withholding variants are evaluated side by side, so its reconciliation_delta_cents is non-zero ONLY when per-payment rounding diverges from rounding once over the year - here exactly -1 cent after two payments at 43751/week. The endpoint must produce that figure while writing nothing: no version moves and a repeat call is byte-identical."
        test_recipe:
          setup: ["A treaty-country FR resident (tax_form_type 1042S, rate 0.15) in an 8-week residency starting 2027-02-01, whose stipend schedule was generated by FinanceOfficer fin-01 at weekly_rate_override_cents 43751 (4 periods of 87502). Visa approved and the resident checked in on 2027-02-01. FinanceOfficer fin-02 has paid periods 1 and 2."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2027-02-01", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}", weekly_rate_override_cents: 43751 }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "GET /visa-cases"
              payload: { residency_id: "${res}" }
              as: VisaCoordinator
              as_user_id: "visa-01"
              captures: { vc: "$.data[0].id" }
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "REQUEST", doc_list: ["PASSPORT", "CV"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "SUBMIT", doc_list: ["PASSPORT", "CV"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/adjudication"
              payload: { action: "FILE", consulate_appointment_date: "2026-12-01" }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/adjudication"
              payload: { action: "APPROVE", reason: "issued" }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /stipend-disbursements"
              payload: { residency_id: "${res}", period_index: 1 }
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { d1: "$.data[0].id" }
            - call: "POST /stipend-disbursements/${d1}/settlement"
              payload: { action: "PAY", paid_on_date: "2027-02-15" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "GET /stipend-disbursements"
              payload: { residency_id: "${res}", period_index: 2 }
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { d2: "$.data[0].id" }
            - call: "POST /stipend-disbursements/${d2}/settlement"
              payload: { action: "PAY", paid_on_date: "2027-03-01" }
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { res_after: "$.data.version" }
          trigger:
            - call: "GET /residencies/${res}/tax-report"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-02"
          assert:
            - "200 with tax_form_type == '1042S' and withholding_rate == 0.15, selected from the resident's tax status (treaty_country true) and not from any payment amount"
            - "paid_period_count == 2, annual_gross_cents == 175004 (2 x 87502) and annual_taxable_cents == 115004 (175004 - 60000)"
            - "withheld_actual_cents == 17250: period 1 held round_half_up(27502 x 0.15) = 4125 and period 2 held round_half_up(87502 x 0.15) = 13125, each rounded before summing"
            - "statutory_liability_cents == 17251: round_half_up(115004 x 0.15) = round_half_up(17250.60), rounded once over the whole base"
            - "reconciliation_delta_cents == -1, i.e. withheld_actual minus statutory - a one-cent under-withholding created purely by rounding order"
            - "the report agrees with the residency ledgers it summarises: GET /residencies/${res} reads stipend_paid_gross_cents == 175004 and withholding_to_date_cents == 17250"
            - "the read writes nothing: Residency.version is still ${res_after} after the report call, no StipendDisbursement version moves, and a second identical call returns byte-identical data"
            - "SCHEDULED rows are outside both variants: periods 3 and 4 (87502 each) are excluded, so annual_gross_cents is 175004 and not 350008"
            - "role scoping matches §1.7: the same call as Funder returns 403 ERR_UNAUTHORIZED, while ProgramAdmin and FinanceOfficer both get 200"

      - name: follow_on_residency_links_only_to_a_completed_predecessor_of_the_same_artist
        claim_type: cross_reference_link
        grounds: ["endpoints[POST /residencies]", "errors[ERR_PREDECESSOR_NOT_COMPLETED]", "entities.Residency.predecessor_residency_id", "validations[priority 41]"]
        distinguishing_aspect: "The self-referential alumni link is validated on TWO axes at once - the predecessor's status must be COMPLETED and its applicant_id must match the new residency's - so a link to one's own SCHEDULED residency and a link to another artist's COMPLETED residency both fail with the same code from opposite causes. The successful link must also be discoverable in reverse through the predecessor_residency_id filter."
        test_recipe:
          setup: ["Two artists in one OPEN cycle. Ada's first residency is driven to COMPLETED (scheduled 2026-11-02 for 8 weeks, trained, checked in on the start date, completed on 2026-12-27, clock left at 2026-12-27); Kell holds a still-SCHEDULED residency scheduled for the same window."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_a: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_k: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_a}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r_a1: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_k}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r_k: "$.data.id" }
            - call: "POST /residencies/${r_a1}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${r_k}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${r_a1}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${r_a1}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${r_a1}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-27T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${r_a1}/lifecycle"
              payload: { action: "COMPLETE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_a}", discipline_id: "${disc}", predecessor_residency_id: "${r_a1}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r_a2: "$.data.id" }
          assert:
            - "201 with predecessor_residency_id == ${r_a1}, application_id null, status 'SCHEDULED' and compliance_status 'TRAINING_PENDING' - a follow-on residency needs no new application"
            - "the link is discoverable in reverse: GET /residencies?predecessor_residency_id=${r_a1} returns total_count == 1 containing ${r_a2}"
            - "the predecessor's own alumni signal is what made the link legal: GET /applicants/${art_a} reads completed_residency_count == 1"
            - "wrong STATUS on the right artist fails: a further POST /residencies for ${art_a} naming predecessor_residency_id ${r_a2} (still SCHEDULED) returns 422 ERR_PREDECESSOR_NOT_COMPLETED"
            - "right STATUS on the wrong artist fails identically: a POST /residencies for ${art_k} naming predecessor_residency_id ${r_a1} returns 422 ERR_PREDECESSOR_NOT_COMPLETED, because applicant_id does not match"
            - "both ends must exist first: predecessor_residency_id set to an unknown uuid returns 404 ERR_RESIDENCY_NOT_FOUND, so existence outranks the state and ownership checks"
            - "the link is optional and its absence is not an error: omitting predecessor_residency_id stores null, and the funder report counts only the linked ones - follow_on_count == 1 for this cycle"
            - "the follow-on residency counts as a fresh award: GET /cycles/${cyc} shows slots_filled_count == 3 after the trigger"

      - name: waiving_an_obligation_removes_it_from_both_residency_sums
        claim_type: action_endpoint
        grounds: ["endpoints[POST /obligations/{id}/progress]", "state_machines.Obligation[PENDING -> WAIVED]", "entities.Residency.obligations_required_total", "entities.Residency.obligations_completed_total"]
        distinguishing_aspect: "WAIVE is the one obligation action that shrinks a DENOMINATOR: the row leaves both residency sums entirely, so obligations_required_total drops while obligations_completed_total must drop by that row's already-logged completions too. A partially-completed multi-count row makes both movements visible in one call, and the waived row must not later BREACH when the residency completes."
        test_recipe:
          setup: ["A scheduled 8-week residency with its four obligations (required_count 1, 1, 1, 2 for a total of 5). One completion has been logged on the COMMUNITY_WORKSHOP row (required_count 2), so it is PENDING with completed_count 1."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /obligations"
              payload: { residency_id: "${res}", obligation_type: "COMMUNITY_WORKSHOP" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ob_w: "$.data[0].id" }
            - call: "POST /obligations/${ob_w}/progress"
              payload: { action: "LOG_COMPLETION", attendance: 25 }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /obligations/${ob_w}/progress"
              payload: { action: "WAIVE", waived_reason: "venue closed for repairs" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ob_v: "$.data.version" }
          assert:
            - "200 with status == 'WAIVED' and waived_reason == 'venue closed for repairs', while completed_count stays 1 and total_attendance stays 25 on the row itself"
            - "the denominator shrank by the whole row: GET /residencies/${res} reads obligations_required_total == 3 (was 5, the waived row carried required_count 2)"
            - "the numerator shrank with it: obligations_completed_total == 0 (was 1), because the row's logged completion left the sum along with the row"
            - "the action bumped both versions per the endpoint's declared side effects: Obligation.version == ${ob_v} and Residency.version incremented by 1"
            - "the row is out of the working set: further LOG_COMPLETION on it returns 409 ERR_OBLIGATION_NOT_PENDING, and it is still listed by GET /obligations?residency_id=${res} with total_count == 4 (waiving does not delete)"
            - "a waived row never breaches: after trainings, CHECK_IN on 2026-11-02 and COMPLETE on 2026-12-27, obligations_breached_count == 3 - the three untouched PENDING rows - and the WAIVED row is not among them"
            - "the action is state-gated on the parent too: WAIVE requires Residency.status IN {SCHEDULED, IN_RESIDENCE, WITHDRAWN}, so the same call on an obligation of a COMPLETED residency returns 409 ERR_OBLIGATION_NOT_PENDING once the row has already BREACHED"

  # ===================================================================================
  # From Table 6 (Errors)
  # ===================================================================================
  - section: errors
    instances:

      - name: business_key_uniqueness_is_global_for_some_keys_and_per_cycle_for_others
        claim_type: error_triggerable
        grounds: ["errors[ERR_DUPLICATE_CODE]", "validations[priority 11]", "entities.Cycle.code", "entities.Discipline.code"]
        distinguishing_aspect: "One error code covers two different uniqueness SCOPES. Cycle.code, Applicant.email, Panelist.email, Studio.code and HousingUnit.code collide globally, while Discipline.code collides only inside one cycle_id - so the very same discipline code must be accepted in a second cycle and refused in the first. A single global unique index over discipline codes passes the negative leg and fails the positive one."
        test_recipe:
          setup: ["Two cycles CY-2027 and CY-2028, each with a SCULPT discipline, plus one applicant, one studio and one housing unit."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc_a: "$.data.id" }
            - call: "POST /cycles"
              payload: { code: "CY-2028", open_at: "2027-08-01T00:00:00Z", close_at: "2027-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
