              payload: { mrn: "MRN-0800", full_name: "Gudrun Ivarsdottir", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 2.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id, c_v1: $.data.version }
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { depart_utc: "2026-08-02T00:00:00Z", return_utc: "2026-08-02T23:00:00Z", expected_contract_version: "${c_v1}" }
              as: IntakeCoordinator
              captures: { t23_hours: $.data.trip_hours, t23_factor: $.data.altitude_factor, t23_eff: $.data.effective_lpm, t23_base: $.data.base_liters, t23_res: $.data.reserve_liters, t23_req: $.data.required_liters, t23_raw: $.data.cylinders_raw, t23_sur: $.data.handling_surcharge_cylinders, t23_auth: $.data.supply_cylinders_authorized }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { c_v2: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { depart_utc: "2026-08-05T00:00:00Z", return_utc: "2026-08-06T00:00:00Z", expected_contract_version: "${c_v2}" }
              as: IntakeCoordinator
              captures: { t24_hours: $.data.trip_hours, t24_base: $.data.base_liters, t24_res: $.data.reserve_liters, t24_req: $.data.required_liters, t24_raw: $.data.cylinders_raw, t24_sur: $.data.handling_surcharge_cylinders, t24_auth: $.data.supply_cylinders_authorized }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { c_v3: $.data.version }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/travel-authorizations"
              payload: { depart_utc: "2026-08-10T00:00:00Z", return_utc: "2026-08-11T01:00:00Z", expected_contract_version: "${c_v3}" }
              as: IntakeCoordinator
              captures: { t25_hours: $.data.trip_hours, t25_base: $.data.base_liters, t25_res: $.data.reserve_liters, t25_req: $.data.required_liters, t25_raw: $.data.cylinders_raw, t25_sur: $.data.handling_surcharge_cylinders, t25_auth: $.data.supply_cylinders_authorized }
          assert:
            - "${t23_hours} == 23, ${t23_factor} == 1.00 and ${t23_eff} == 2.00: omitting destination_altitude_feet leaves the factor at its floor rather than defaulting to the patient's own altitude"
            - "${t23_base} == 2760, ${t23_res} == 552 and ${t23_req} == 3312, giving ${t23_raw} == 5 with ${t23_sur} == 0 and ${t23_auth} == 5: one cylinder below the threshold, nothing is added"
            - "${t24_hours} == 24, ${t24_base} == 2880, ${t24_res} == 576, ${t24_req} == 3456, ${t24_raw} == 6, ${t24_sur} == 1 and ${t24_auth} == 7: a single extra hour adds 144 litres and two cylinders, because the litres crossed a cylinder boundary and the cylinder crossed the surcharge threshold"
            - "${t24_auth} == 7 is itself at or above the threshold of 6 and yet ${t24_sur} remains 1: STEP 7 reads cylinders_raw, so the surcharge cannot compound on itself"
            - "${t25_hours} == 25 moves the reserve to 0.35, giving ${t25_base} == 3000, ${t25_res} == 1050 and ${t25_req} == 4050 — 594 litres more than the 24-hour trip — yet ${t25_raw} == 6, ${t25_sur} == 1 and ${t25_auth} == 7 are identical: the threshold keys on cylinders, not on hours or litres"
            - "All three authorizations coexist in status REQUESTED because their closed intervals are pairwise disjoint, and each one bumped the contract version, which is why ${c_v2} and ${c_v3} had to be re-read between the calls"

      - name: recall_cascade_side_effect_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RecallNotice
          - state_machines.EquipmentUnit
        excluded_because:
          difficulty_instance: recall_class_i_four_hop_cascade
          rationale: |
            The deepest cascade in the model — recall notice to affected units to their placements to
            the contracts' allowable and service status, with auto_quarantined_unit_count as the
            fan-out receipt — is driven end to end by the §1.8 transitive_cascade instance, and the
            setup-failure cascade covers the second chain. A §1.9 instance would restate them.

      - name: cap_basis_dual_variant_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cap_month_position
        excluded_because:
          difficulty_instance: cap_position_variant_divergence_bid_vs_fee_schedule
          rationale: |
            Both dual-variant calculations in the model — the cap position's service-month versus
            paid-month bases and the risk score's initial versus surveillance variants — are exercised
            by §1.8 instances that drive the two bases apart on identical inputs; the endpoints section
            already checks that the computed reads publish the losing variant alongside the winner.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: malfunction_cascade_is_readable_in_the_same_transaction
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /home-oxygen/placements/{placement_id}/malfunction]
          - calculations.monthly_allowable_cents
          - calculations.oxygen_safety_risk_score
        distinguishing_aspect: |
          One TIER_1 report writes five rows — placement, unit, contract, patient and the contract's
          derived allowable — and the model is immediate, so every one of them answers the new value on
          the very next read with no sweep, no retry and no eventual reconciliation. The strongest form
          of that claim is not a read at all: the money endpoint invoked immediately afterwards must
          already see the empty PLACED set and post a zero-cent month, and the risk read must already
          report the surveillance variant that the same call persisted.
        test_recipe:
          setup:
            - "One branch with a single stationary concentrator, a HOMEBOUND patient at 3.0 L/min, and a contract driven to IN_SERVICE with a perfect teachback score of 5."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0810", full_name: "Hyacinthe Jourdain", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_id: $.data.id }
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r1: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r1}", contract_id: "${c_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60, cylinders_requested: 0 }
              as: BranchManager
              captures: { s_setup: $.data.id }
            - call: "POST /home-oxygen/delivery-routes/${r1}/lock"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/delivery-routes/${r1}/dispatch"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/route-stops/${s_setup}/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 5, education_topics_covered: ["EQUIPMENT_OPERATION", "FIRE_SAFETY", "EMERGENCY_CONTACT"] }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
              captures: { setup_status: $.data.status }
          trigger:
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: BillingSpecialist
              captures: { allow_before: $.data.monthly_allowable_cents, svc_before: $.data.service_status }
            - call: "POST /home-oxygen/placements/${pl_id}/malfunction"
              payload: { symptom: "NO_FLOW", oxygen_gap_minutes: 90 }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
              captures: { pl_status: $.data.status, pl_reason: $.data.removal_reason, pl_tier: $.data.last_severity_tier, pl_symptom: $.data.last_symptom, pl_count: $.data.malfunction_count }
            - call: "GET /home-oxygen/equipment-units/${u_stat}"
              payload: {}
              as: RespiratoryTherapist
              captures: { u_status: $.data.status, u_reason: $.data.quarantine_reason }
            - call: "GET /home-oxygen/rental-contracts/${c_id}"
              payload: {}
              as: BillingSpecialist
              captures: { allow_after: $.data.monthly_allowable_cents, svc_after: $.data.service_status, bill_after: $.data.billing_status, mc_after: $.data.malfunction_count, gap_after: $.data.cumulative_oxygen_gap_minutes }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: RespiratoryTherapist
              captures: { p_score: $.data.oxygen_safety_risk_score, p_variant: $.data.risk_variant_applied, p_hold: $.data.compliance_hold }
            - call: "GET /home-oxygen/patients/${p_id}/risk-assessment"
              payload: {}
              as: RespiratoryTherapist
              captures: { ra_incident: $.data.factor_incident, ra_flow: $.data.factor_flow, ra_initial: $.data.initial_assessment_score, ra_ongoing: $.data.ongoing_surveillance_score, ra_persisted: $.data.persisted_score }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/billing-months"
              payload: { service_month: "2026-08" }
              as: BillingSpecialist
              captures: { bm_life: $.data.lifetime_paid_cents, bm_count: $.data.posted_month_count, bm_last: $.data.last_posted_service_month }
          assert:
            - "${setup_status} == COMPLETED and ${allow_before} == 5590 with ${svc_before} == IN_SERVICE before the report"
            - "${pl_status} == REMOVED, ${pl_reason} == MALFUNCTION, ${pl_tier} == TIER_1, ${pl_symptom} == NO_FLOW and ${pl_count} == 1 in the response to the report itself: the first hop of the cascade is already in the returned body"
            - "${u_status} == IN_QUARANTINE and ${u_reason} == MALFUNCTION on the very next read: the unit hop needs no sweep, no background job and no second call to become visible"
            - "${allow_after} == 0 while ${svc_after} == IN_SERVICE: the derived allowable follows the now-empty PLACED set immediately, and the contract deliberately stays in service because the patient still has an open episode of care"
            - "${bill_after} == ACCRUING, ${mc_after} == 1 and ${gap_after} == 90: the contract-level counters moved in the same transaction as the placement"
            - "${p_score} == 35.00 with ${p_variant} == ONGOING_SURVEILLANCE and ${p_hold} == false: the surveillance variant (base factor 30 plus one 5-point breadth step) is persisted, and 35.00 is below the 70.00 hold threshold"
            - "${ra_incident} == 30, ${ra_flow} == 20, ${ra_ongoing} == 35.00, ${ra_initial} == 9.00 and ${ra_persisted} == 35.00: the computed read agrees with the persisted row instantly, including which variant won"
            - "${bm_life} == 0, ${bm_count} == 1 and ${bm_last} == 2026-08: the money endpoint called immediately after the cascade already prices the month at zero — the strongest form of immediacy, because a stale allowable would have billed 5590 cents"
