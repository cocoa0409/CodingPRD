  - rule_id: resource_temporal_overlap
    instances:

      - name: audience_fatigue_point_buffer_conflict
        grounds:
          - calculations.send_window_overlap_capacity
          - validations[priority=23]
          - errors[ERR_AUDIENCE_FATIGUE_CONFLICT]
          - entities.Audience.fields.name
        distinguishing_aspect: |
          Interval semantics #1, resource = AUDIENCE: campaigns are treated as
          POINT EVENTS and the rule is a symmetric 6-hour BUFFER around
          scheduled_at, ignoring send_window_minutes entirely. A campaign 4 hours
          after another on the same audience collides even though their 60-minute
          send windows do not overlap at all.
        test_recipe:
          setup:
