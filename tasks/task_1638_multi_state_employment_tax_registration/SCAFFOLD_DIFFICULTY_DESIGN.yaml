            - { call: "POST /etax/employees", payload: { employee_ref: "E-1022", full_name: "V Two", resident_state_code: "NJ", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_nj}" }, as: NexusAnalyst }
