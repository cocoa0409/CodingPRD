          trigger:
            - call: "POST /permittees/${c_m16_id}/base-properties"
              payload: { base_property_type: "LIVESTOCK", legal_description: "401 head controlled under a private lease near Battle Mountain", carrying_capacity_aums: 401, controlled_since_date: "2015-02-02" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { c_bp14_id: "$.data.id" }
            - call: "POST /permittees/${c_m16_id}/base-properties"
