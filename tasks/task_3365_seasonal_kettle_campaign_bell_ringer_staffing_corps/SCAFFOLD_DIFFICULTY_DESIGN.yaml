scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: collection_variance_provisional_vs_final_variant
        grounds:
          - calculations.kettle_collection_variance
          - calculations.deposit_denomination_split
          - state_machines.KettleCollection.SUBMITTED_to_VERIFIED
          - state_machines.KettleCollection.DEPOSITED_to_RECONCILED
        distinguishing_aspect: |
          Two variants of kettle_collection_variance run on the same KettleCollection row and
          return different numbers for identical teller counts: the PROVISIONAL variant
          (counted_total_cents - declared_cents = 345) is evaluated at VERIFY, while the FINAL
          variant (deposited_cents - (counted_total_cents - handling_fee_cents) = 0) is evaluated
          at RECONCILE, so a test that asserts one value at one transition and the other value at
          the next transition proves the two algorithms are distinct.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one ACTIVE campaign with one APPROVED exclusive host site and one ACTIVE kettle location"
            - "one KettleCollection in SUBMITTED with declared_cents 72000, coin_cents 12345, currency_cents 50000, check_cents 10000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000, labor_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/kettle-collections"
              payload: { kettle_location_id: "${loc_id}", collected_on: "2026-11-14T18:00:00Z", declared_cents: 72000, coin_cents: 12345, currency_cents: 50000, check_cents: 10000 }
              as: CountingRoomTeller
              captures: { col_id: "$.data.id", col_v: "$.data.version" }
          trigger:
            - call: "POST /api/kettle-collections/${col_id}/verify"
              payload: { expected_kettle_collection_version: "${col_v}" }
              as: CountingRoomTeller
              captures: { col_v2: "$.data.version", provisional_var: "$.data.variance_cents" }
            - call: "POST /api/kettle-collections/${col_id}/deposit"
              payload: { deposited_cents: 71961 }
              as: FinanceOfficer
            - call: "POST /api/kettle-collections/${col_id}/reconcile"
              payload: { matched: true, bank_confirmed_cents: 71961 }
              as: FinanceOfficer
              captures: { final_var: "$.data.variance_cents" }
          assert:
            - "KettleCollection.${col_id}.counted_total_cents == 72345"
            - "KettleCollection.${col_id}.handling_fee_cents == 384"
            - "provisional variance after VERIFY == 345 (counted_total_cents 72345 - declared_cents 72000)"
            - "final variance after RECONCILE == 0 (deposited_cents 71961 - (counted_total_cents 72345 - handling_fee_cents 384))"
            - "provisional variance 345 != final variance 0 for identical teller counts"
            - "KettleCollection.${col_id}.deposit_status == RECONCILED"

      - name: assistance_score_provisional_vs_final_variant
        grounds:
          - calculations.assistance_eligibility_score
          - state_machines.AssistanceApplication.SUBMITTED_to_SCREENING
          - state_machines.AssistanceApplication.SCREENING_to_ELIGIBLE
          - validations[priority=28]
        distinguishing_aspect: |
          Two variants of assistance_eligibility_score run on the same AssistanceApplication row
          and return different numbers for identical household data: the PROVISIONAL variant
          (self-reported annual_income_cents, no deduction) yields 63, while the FINAL variant
          (verified_income_cents minus a 150000-cent per-member asset deduction) yields 70, so the
          same household sits below the 65 threshold at intake and above it at screening.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z"
            - "one ACTIVE campaign and one OPEN TOY assistance program with household_cap 50"
            - "one AssistanceApplication in SUBMITTED with household_size 4 and annual_income_cents 3000000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000, labor_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/assistance-programs"
              payload: { campaign_id: "${campaign_id}", name: "Christmas Toy Distribution", program_type: "TOY", intake_opens_on: "2026-10-01T00:00:00Z", intake_closes_on: "2026-12-15T23:59:59Z", household_cap: 50, per_household_limit_cents: 25000 }
              as: AssistanceCaseworker
              captures: { program_id: "$.data.id" }
            - call: "POST /api/assistance-programs/${program_id}/open"
              payload: {}
              as: AssistanceCaseworker
            - call: "POST /api/assistance-applications"
              payload: { program_id: "${program_id}", applicant_name: "Dolores Whitfield", household_size: 4, annual_income_cents: 3000000, distribution_site_unit_id: "${unit_id}" }
              as: AssistanceCaseworker
              captures: { app_id: "$.data.id", app_v: "$.data.version" }
          trigger:
            - call: "POST /api/assistance-applications/${app_id}/screen"
              payload: { verified_income_cents: 3000000 }
              as: AssistanceCaseworker
              captures: { final_score: "$.data.eligibility_score", final_status: "$.data.eligibility_status" }
          assert:
            - "AssistanceApplication.${app_id}.provisional_score == 63"
            - "AssistanceApplication.${app_id}.eligibility_score == 70"
            - "provisional_score 63 < ELIGIBILITY_THRESHOLD 65 and eligibility_score 70 >= 65"
            - "final eligibility_status == ELIGIBLE"
            - "AssistanceApplication.${app_id}.verified_income_cents == 3000000"

  - rule_id: combinatorial_formula
    instances:
      - name: location_performance_index_tiered_multi_input
        grounds:
          - calculations.location_performance_index
          - calculations.shift_coverage_gap
          - state_machines.Shift.CHECKED_IN_to_COMPLETED
          - state_machines.Shift.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          location_performance_index is mode (a): it consumes four inputs
          (covered_minutes, location_total_cents, cancelled_shift_count, completed_shift_count),
          nests floor and max inside a rate division, and applies a conditional one-tier downgrade
          when the disruption-adjusted index falls below 2000 — so a location with cents_per_hour
          45000 and a 33 percent disruption rate lands at index 30150 and stays PLATINUM, while an
          identical cents_per_hour with no completed shifts would be UNRATED.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z, later advanced to each shift's start instant"
            - "one ACTIVE kettle location with daily_required_minutes 480 and placement window 2026-11-01..2026-12-24"
            - "one CLEARED volunteer bell ringer"
            - "two COMPLETED 480-minute shifts on 2026-11-16 and 2026-11-17, one CANCELLED-from-CONFIRMED shift on 2026-11-18"
            - "one DEPOSITED collection with counted_total_cents 720000"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000, labor_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 3 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Ruth Alvarez", email: "ruth.alvarez@example.org", ringer_type: "VOLUNTEER", corps_id: "${unit_id}", date_of_birth: "1979-04-02T00:00:00Z", hourly_rate_cents: 0 }
              as: VolunteerCoordinator
