      - name: clearance_exception_on_an_active_product_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "The CLEARANCE lifecycle check happens at DECISION time, not at request time: the exception is created happily and only approval fails with ERR_PRODUCT_NOT_IN_CLEARANCE."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 in lifecycle_status ACTIVE; a REQUESTED CLEARANCE exception over [2026-08-10, 2026-08-25)."]
          setup_api_calls:
