            - "after certification: HTTP 200, disposition == RECLAIMED, current_contents_lbs == 28.5, shipped_for_reclaim_lbs == 1.5"
            - "Cylinder.${cyl1_id}.reclaim_certificate_number == RC-2026-0001, purity_verified == true, reclaimed_quantity_lbs == 28.5, reclaim_issued_on == 2026-08-01T00:00:00Z"
            - "current_contents_lbs + shipped_for_reclaim_lbs == 30.0 after shipment and after certification"
            - "TOTAL_MASS(store) == 50.0 + 28.5 + 1.5 + 0.0 == 80.0 and Store.${store_id}.vented_loss_lbs == 0.0"

