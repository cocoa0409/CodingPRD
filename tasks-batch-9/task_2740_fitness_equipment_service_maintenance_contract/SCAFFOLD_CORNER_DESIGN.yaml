            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Omar Diaz", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t3_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-15T08:00:00Z", window_end: "2026-08-15T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
