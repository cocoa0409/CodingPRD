              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "run 1: HTTP 200 with generated_count 1 and skipped_count 0; the generated order is REJECTED with rejection_error_id \"ERR_PROHIBITED_DESTINATION\", and ClubSubscription.${cs_id} is still \"ACTIVE\" with missed_run_count 1 and next_run_date still \"2026-08-01\""
            - "one miss is below the threshold: no suspension after run 1, which rules off `>= 1`"
            - "run 2: generated_count 1 again \u2014 the untouched next_run_date is what makes the subscription due a second time \u2014 and now ClubSubscription.${cs_id}.status is \"SUSPENDED_COMPLIANCE\" with missed_run_count 2 and next_run_date null"
            - "the suspension is mirrored on the parent: Winery.${w_id}.suspended_subscription_count is 1 and Winery.version advanced by exactly 1"
            - "run 3: HTTP 200 with generated_count 0, skipped_count 0 and generated_order_ids [] \u2014 a SUSPENDED_COMPLIANCE subscription is not even a candidate, so it is not reported as skipped either"
            - "the officer's reinstatement: HTTP 200 with data.status \"ACTIVE\", data.missed_run_count 0 and data.next_run_date \"2026-08-01\""
            - "run 4 proves the counter really restarted: the new order is REJECTED again, missed_run_count reads 1 (NOT 3) and the subscription is still \"ACTIVE\""
            - "run 5 re-crosses the same threshold: missed_run_count 2 and status \"SUSPENDED_COMPLIANCE\" again \u2014 the trigger is re-armable, not one-shot"
            - "no allotment was ever consumed: consumed_shipments is 0 and remaining_allotment is 6 across all four generated orders"
            - "GET /dtc/orders?club_subscription_id=${cs_id} reports total_count 4, all with compliance_status \"REJECTED\", and GET /dtc/volume-ledger-entries?consumer_id=${c_id} returns zero rows"
      - name: cascading_side_effects_verified_end_to_end_over_four_hops
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Shipment.IN_TRANSIT_to_RETURNED
        excluded_because:
          difficulty_instance: transitive_cascade / return_to_sender_four_hop_cascade_to_screening_tier
          rationale: "The named \u00a71.8 instance walks the whole shipment -> order -> ledger -> consumer -> screening_tier chain and asserts each hop's fields, which is exactly this layer's end-to-end claim."
      - name: cascading_side_effects_ordering_and_selective_application
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.StatePermit.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / permit_revoke_three_hop_cascade_to_winery_counter
          rationale: "The named \u00a71.8 instance revokes a permit with a mix of eligible and ineligible children, asserting both the created_at ASC processing order and that already-shipped orders are skipped, which covers ordering sensitivity and partial application."
      - name: both_calculation_variants_produce_their_own_result_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.remittance_due_amounts.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / remittance_accrual_vs_delivery_basis_diverge
          rationale: "The named \u00a71.8 instance files both bases over one identical period and asserts the delta between them, which is this layer's divergence claim."
      - name: the_gating_variant_is_the_only_one_that_can_refuse_an_operation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.consumer_compliance_risk_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / consumer_risk_screening_vs_audit_diverge
          rationale: "The named \u00a71.8 instance drives the two risk variants apart and asserts that only risk_score_screening gates validations priority 95 while risk_score_audit merely reports, which is this layer's variant-selection claim."
      - name: the_instantaneous_volume_threshold_is_tested_at_its_exact_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - validations.priority_80
        excluded_because:
          difficulty_instance: boundary_precision_check / consumer_volume_limit_exact_equality_clears_then_one_bottle_breaches
          rationale: "The named \u00a71.8 instance clears an order at exact equality with per_consumer_limit_liters and breaches it by a single bottle, which is the instantaneous-threshold-at-boundary claim for this layer."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_first_response_after_the_write_that_moved_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Winery.fields.excise_accrued_cents
          - entities.Winery.fields.excise_reversed_cents
          - entities.Consumer.fields.return_credit_count
          - endpoints.GET_/dtc/consumers/{id}/volume-summary
          - state_machines.Order.DRAFT_to_CLEARED
          - state_machines.Shipment.IN_TRANSIT_to_RETURNED
        distinguishing_aspect: |
          The declared consistency model is `immediate`, so no derived field is allowed to lag: the mutating
          call's own envelope must already show the entity it changed, and the first read of every dependent
          aggregate must already agree. This is asserted across two opposite mutations — a clearance that accrues
          and a return-to-sender that reverses — over four different derived surfaces (the winery's two excise
          counters, the consumer's rolling volume and risk fields, and the computed volume-summary read). No
          sleep, retry or second read is permitted anywhere in the recipe.
        test_recipe:
          setup:
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Ada is ID-verified. Clock 2026-08-01."
            - "Estate 1 produces 120000 gallons, under the 250000-gallon small-producer ceiling, so the 6 x 750 ml order at 4200 c carries excise_tax_cents 211 and sales_tax_cents 2284."
            - "Before the trigger every counter is at its default: excise_accrued_cents 0, excise_reversed_cents 0, return_credit_count 0, risk_score_screening 0, screening_tier STANDARD."
            - "A DRAFT order for that basket already exists and has never been screened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /dtc/consumers/${c_id}/volume-summary"
              payload: { state_code: "TX" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/shipments"
              payload: { order_id: "${o_id}", carrier_enrollment_id: "${ce_id}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { s_id: $.data.id }
            - call: "POST /dtc/shipments/${s_id}/scan"
              payload: { scan_type: "PICKUP" }
              as: CarrierAgent
              as_user_id: "agent_1"
            - call: "GET /dtc/consumers/${c_id}/volume-summary"
              payload: { state_code: "TX" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/shipments/${s_id}/scan"
              payload: { scan_type: "RETURN_TO_SENDER" }
              as: CarrierAgent
              as_user_id: "agent_1"
            - call: "GET /dtc/orders/${o_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /dtc/consumers/${c_id}/volume-summary"
              payload: { state_code: "TX" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "the screen response itself already carries the outcome: HTTP 200 with data.compliance_status \"CLEARED\" and data.cleared_at \"2026-08-01T00:00:00Z\" \u2014 no follow-up read is needed to learn it"
            - "the very next winery read already shows the accrual: excise_accrued_cents 211 with excise_reversed_cents still 0"
            - "the volume-summary read immediately after the clearance reports TX rolling liters 4.500 and headroom 22.500, while risk_score_screening is 0 because the order is still UNFULFILLED \u2014 immediate does not mean the SCREENING variant changes its own scope rule"
            - "the PICKUP scan response itself shows data.status \"IN_TRANSIT\", and the very next volume-summary read already scores risk_score_screening 5 \u2014 the liters became settled in the same call, so f3 = floor(30 * 4.500 / 27.000) = 5 with f1 and f2 at 0, and screening_tier is still \"STANDARD\""
            - "the RETURN_TO_SENDER scan response itself shows data.status \"RETURNED\" \u2014 the four-hop cascade is complete before the response is written"
            - "the first order read after that scan already shows fulfillment_status \"RETURNED\" with excise_tax_cents and sales_tax_cents reversed to 0"
            - "the first winery read after that scan already shows excise_reversed_cents 211 against excise_accrued_cents 211"
            - "the first volume-summary read after that scan already shows TX rolling liters 0.000, return_credit_count 1 and risk_score_screening 10, with screening_tier still \"STANDARD\""
            - "no assertion in this recipe requires a repeated read: every value above is correct on its first observation after the write that caused it"
