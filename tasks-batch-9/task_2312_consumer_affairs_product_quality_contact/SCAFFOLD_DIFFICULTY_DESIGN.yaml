            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-MUG", name: "Ceramic Mug", category: HOUSEWARE, is_regulated_food: false, unit_retail_price_cents: 1800, units_per_case: 6 }, captures: { pr2: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr2}", production_line_id: "${ln1}", batch_code: "LOT-B", code_date: "2026-07-10T00:00:00Z", units_produced: 100000 }, captures: { lotb: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr2}", production_line_id: "${ln1}", batch_code: "LOT-C", code_date: "2026-07-11T00:00:00Z", units_produced: 40000 }, captures: { lotc: "$.data.id" } }
