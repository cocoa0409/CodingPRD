          assert:
            - "claim with service_date 2026-06-30 (one day BEFORE earliest eligible): line denial_code == WAITING_PERIOD and claim status == DENIED"
            - "claim with service_date 2026-07-01 (exactly effective_date + 6 months): line status == PAYABLE and plan_pay_cents == 4000 (floor(8000*50/100)) — the boundary is INCLUSIVE"

      - name: predet_approve_annual_max_remaining_exact_equality_allowed
        grounds:
          - validations[priority=17]
          - calculations.predetermination_estimate
          - entities.Plan.fields.annual_maximum_cents
        distinguishing_aspect: |
          Metric = integer cents of remaining annual maximum at approve time.
          An estimate exactly EQUAL to the remaining maximum (5000 == 5000)
          approves, while an estimate one cent over (15000 > 5000) rejects
          with ERR_ANNUAL_MAX_EXCEEDED. Reached via
          POST /dental/predeterminations/{id}/approve — a distinct endpoint
          from the waiting-period boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan with annual_maximum_cents 5000, deductible 0, major 50, no waiting, ABP off; subscriber effective 2026-01-01."
            - "PPO provider; schedule with D2740 MAJOR allowed 30000 ACTIVE."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-BP2", plan_year_start_month: 1, annual_maximum_cents: 5000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567800", legal_name: "Smile Dental 11", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 30000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-BP2", full_name: "Liam Prime", date_of_birth: "1986-06-06T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 10000, planned_service_date: "2026-03-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_eq: $.data.id }
            - call: "POST /dental/predeterminations/${predet_eq}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_eq_v: $.data.version }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 30000, planned_service_date: "2026-03-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_over: $.data.id }
            - call: "POST /dental/predeterminations/${predet_over}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_over_v: $.data.version }
          trigger:
            - call: "POST /dental/predeterminations/${predet_eq}/approve"
              payload: { expected_predetermination_version: "${predet_eq_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { eq_status: $.data.status }
            - call: "POST /dental/predeterminations/${predet_over}/approve"
              payload: { expected_predetermination_version: "${predet_over_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { over_err: $.data.error_id }
          assert:
            - "estimate exactly equal to the cap: submitted 10000 -> allowed 10000 -> est plan floor(10000*50/100) = 5000 == remaining 5000 -> approve succeeds, status == APPROVED"
            - "estimate over the cap: submitted 30000 -> allowed 30000 -> est plan 15000 > remaining 5000 -> response 422 with error_id == ERR_ANNUAL_MAX_EXCEEDED and the predetermination remains UNDER_REVIEW"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_submission_depends_on_plan_state
        grounds:
          - validations[priority=6]
          - state_machines.Plan.ACTIVE_to_SUSPENDED
          - endpoints.POST_/dental/claims
        distinguishing_aspect: |
          Entity pair Claim -> Plan: a claim's admissibility depends on the
          OWNING plan's lifecycle state, not on any claim field. The same
          claim payload succeeds while Plan is ACTIVE and is rejected with
          ERR_PLAN_NOT_ACTIVE once the plan is SUSPENDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan ACTIVE (no waiting, deductible 0, prev 100); PPO provider; schedule with D0120 5000 ACTIVE; subscriber effective 2026-01-01."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-XD1", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567801", legal_name: "Smile Dental 12", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 5000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-XD1", full_name: "Mia Prime", date_of_birth: "1993-09-09T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_ok: $.data.id }
            - call: "POST /dental/plans/${plan_id}/suspend"
