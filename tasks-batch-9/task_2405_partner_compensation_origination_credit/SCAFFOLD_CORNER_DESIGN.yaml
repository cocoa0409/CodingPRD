        excluded_because:
          difficulty_instance: transitive_cascade / split_adjudication_cascade_matter_allocation_partner_cycle
          rationale: "The N-level-chain-verified-end-to-end and ordering-sensitivity claims of this layer are asserted by the named §1.8 instance, which follows one SPLIT adjudication through CreditAllocation, Matter, both Partners and CompensationCycle and pins every hop."

      - name: dual_variant_calculation_layer_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.matter_realization_and_profitability.variants
          - calculations.partner_formula_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / partner_formula_score_provisional_vs_final_diverge
          rationale: "The both-variants-produce-expected-results and correct-delta-on-switch claims of this layer are asserted by the named §1.8 instance, which pins the PROVISIONAL_ACCRUAL and FINAL_COLLECTED scores and the delta produced by closing the matters."

  # =====================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_same_response_body
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /comp/matters/{id}/financials]
          - calculations.matter_realization_and_profitability
        distinguishing_aspect: |
          The declared model is immediate, so the response body of the financials post
          already carries the recomputed realization_pct and both profitability indices -
          a re-read returns byte-identical values, with no lag and no second call needed to
          settle the derived fields.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; partner P is billing and responsible attorney of OPEN Matter M with an empty ledger and one verified 10.00-hour BILLABLE record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Imm Ediate", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2014 }
              as: CycleAdmin
              captures: { pp: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-IM", client_display_name: "Immediate Industries", matter_type: "EXISTING", practice_group: "CORPORATE", opened_on: "2026-01-10", billing_attorney_id: "${pp}", responsible_attorney_id: "${pp}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv0: "$.data.version" }
            - call: "POST /comp/contribution-records"
              payload: { partner_id: "${pp}", cycle_id: "${cy}", matter_id: "${m}", kind: "BILLABLE", category: "CLIENT_WORK", hours: 10.00, standard_rate_cents: 50000, service_period_start: "2026-02-01", service_period_end: "2026-02-28" }
              as: CycleAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /comp/contribution-records/${cr}/verify"
              payload: {}
              as: CycleAdmin
          trigger:
            - call: "POST /comp/matters/${m}/financials"
              payload: { billed_delta_cents: 500000, collected_delta_cents: 400000, direct_cost_delta_cents: 100000, expected_matter_version: "${mv0}" }
              as: CycleAdmin
              captures: { real: "$.data.realization_pct", pic: "$.data.profitability_index_contribution", pif: "$.data.profitability_index_fully_loaded", hrs: "$.data.verified_billable_hours" }
            - call: "GET /comp/matters/${m}"
              payload: {}
              as: CycleAdmin
              captures: { real2: "$.data.realization_pct", pic2: "$.data.profitability_index_contribution", pif2: "$.data.profitability_index_fully_loaded" }
            - call: "GET /comp/partners/${pp}"
              payload: {}
              as: CycleAdmin
              captures: { ccp: "$.data.credited_collection_provisional_cents" }
          assert:
            - "${hrs} == 10.00 and ${real} == 0.8000, i.e. 400000 collected over 500000 billed"
            - "${pic} == 0.7500, i.e. (400000 - 100000) / 400000"
            - "${pif} == 0.5250, i.e. (400000 - 100000 - 10.00 * 9000) / 400000"
            - "${real2} == ${real}, ${pic2} == ${pic} and ${pif2} == ${pif} - the write response already carried the settled values"
            - "${ccp} > 0 - the partner-level roll-up is also visible on the very next read, with no reconciliation step in between"
