  # =========================================================================
  # Rule 7 - cross-entity state dependency over different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_submit_depends_on_account_direct_locked_state
        grounds:
          - validations[priority=30]
          - state_machines.Account.CHANNEL_PROTECTED_to_DIRECT_LOCKED
          - state_machines.ConflictCase.OPEN_to_RESOLVED_DIRECT
          - state_machines.DealRegistration.DRAFT_to_SUBMITTED
          - errors[ERR_EXCLUSIVITY_CONFLICT]
        distinguishing_aspect: |
          Entity pair (DealRegistration, Account): whether a partner may submit depends on the
          OTHER entity's terminal coverage_state, not on any registration window - after the
          director resolves a PARTNER_VS_DIRECT case as DIRECT the incumbent registration is
          REJECTED so NO live window exists at all, yet the submit still fails with
          ERR_EXCLUSIVITY_CONFLICT purely because Account.coverage_state == DIRECT_LOCKED, while
          the identical submit on a second OPEN_CHANNEL account succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Two RESELLER partners each with one TECH_ASSOCIATE certification (2 credits, enough for ANALYTICS_ADDON) and marketing_commitment_cents = 0."
            - "Two accounts; on the first one the incumbent partner's registration was APPROVED, a DirectSalesRep then declared direct pursuit while the account was CHANNEL_PROTECTED (CASCADE D raised a PARTNER_VS_DIRECT case), and the ChannelDirector resolved that case as DIRECT - so the account is DIRECT_LOCKED and the incumbent registration is REJECTED with closure_reason RESOLVED_DIRECT."
            - "The challenger partner then drafts one registration on the locked account and one on the untouched second account, same product line, both still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
