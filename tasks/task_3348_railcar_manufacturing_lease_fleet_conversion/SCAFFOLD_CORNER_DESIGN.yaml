- section: errors
  instances:
  - name: error_unauthenticated_undeclared_role_on_read_returns_401
    claim_type: Violation → Error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    - GET /api/v1/lease-fleet-cars
    distinguishing_aspect: A read issued under the undeclared role Anonymous is rejected by priority 1
      with ERR_UNAUTHENTICATED and HTTP 401 before any state or payload rule is evaluated, while the identical
      read under the declared role PlatformAdmin returns 200.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - One car type CT-H1 exists so the store is not empty and the read has a resolvable collection.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-H1
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-H1
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      trigger:
      - call: GET /api/v1/lease-fleet-cars
        payload: {}
        as: Anonymous
        captures:
          err_id: $.data.error_id
          err_msg: $.data.message
      - call: GET /api/v1/lease-fleet-cars
        payload: {}
        as: PlatformAdmin
        captures:
          ok_rtype: $.response_type
      assert:
      - The undeclared-role read returns HTTP 401 with data.error_id == ${err_id} == "ERR_UNAUTHENTICATED"
      - 'The error envelope is the §1.0 error shape: response_type is "error" and data carries error_id
        plus a non-empty message == ${err_msg}'
      - The role name Anonymous is not declared in §1.7, which is exactly the condition §1.6 attaches
        to ERR_UNAUTHENTICATED
      - Priority 1 is category auth and precedes every other rule, so the rejection is not affected by
        the query string or by any stored row
      - 'The control read under the declared PlatformAdmin role succeeds: HTTP 200 with response_type
        == ${ok_rtype} == "array", so the 401 is header-caused rather than endpoint-wide'
  - name: error_forbidden_declared_role_lacks_operation_returns_403
    claim_type: Violation → Error
    grounds:
    - validations[priority=2]
    - errors[ERR_FORBIDDEN]
    - roles.RegulatoryRetrofitist.exclusive_operations
    - POST /api/v1/retrofit-programs
    distinguishing_aspect: A declared role that §1.7 does not grant POST /retrofit-programs is rejected
      by priority 2 with ERR_FORBIDDEN and HTTP 403 — the authenticated-but-unpermitted case, distinct
      from priority 1's undeclared role — and no program row is written.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - ProductionPlanner is a declared §1.7 role, but POST /retrofit-programs is listed only under RegulatoryRetrofitist.exclusive_operations,
        so the operation is out of scope for the planner.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-FBD
          description: Denied mandate
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: ProductionPlanner
        captures:
          err_id: $.data.error_id
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-FBD
          description: Allowed mandate
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          ok_id: $.data.id
          ok_status: $.data.status
      - call: GET /api/v1/retrofit-programs
        payload: {}
        as: PlatformAdmin
        captures:
          only_row: $.data[0].id
      assert:
      - The planner's write returns HTTP 403 with data.error_id == ${err_id} == "ERR_FORBIDDEN"
      - The role is authenticated — ProductionPlanner is declared in §1.7 — so priority 1 passes and priority
        2 is the rejecting rule, not ERR_UNAUTHENTICATED
      - 'The identical payload under RegulatoryRetrofitist succeeds: HTTP 201 with data.id == ${ok_id}
        and data.status == ${ok_status} == "PLANNED", so the denial is role-scoped rather than payload-scoped'
      - 'The denial is per-operation, not per-role: the same ProductionPlanner role is allowed GET /api/v1/retrofit-programs
        and POST /api/v1/car-types'
      - 'Nothing was written by the denied call: GET /api/v1/retrofit-programs lists exactly one row,
        ${only_row} == ${ok_id}, so the 403 left no partial state'
  - name: error_self_approval_forbidden_same_operator_returns_403
    claim_type: Violation → Error
    grounds:
    - errors[ERR_SELF_APPROVAL_FORBIDDEN]
    - state_machines.SubstitutionEndorsement.PENDING_to_APPROVED
    - roles.LeaseAdministrator.exclusive_operations
    - POST /api/v1/substitution-endorsements/{id}/approve
    distinguishing_aspect: Approving an endorsement with the same X-User-ID that created it is rejected
      403 ERR_SELF_APPROVAL_FORBIDDEN and the row stays PENDING, while a second endorsement created by
      a different operator is approved 200 by that same X-User-ID.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-I (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-I) with
        WHEELSET WS-I at qty_per_car 2 and CASTING CS-I at qty_per_car 1; substitute WHEELSET WS-I2 exists
        as a second catalogue part.
      - One DRAFT order of 1 car stands at version 1; endorsement E1 (WS-I -> WS-I2) is created by X-User-ID
        user-op-9 and endorsement E2 (CS-I -> WS-I2, decides_material true) by X-User-ID user-op-8, each
        against the version current at its own creation.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-I
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-I
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-I
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-I2
          component_class: WHEELSET
          unit_cost_cents: 1100
          lead_time_days: 4
        as: SupplyChainCoordinator
        captures:
          ws2_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-I
          component_class: CASTING
          unit_cost_cents: 2000
          lead_time_days: 6
        as: SupplyChainCoordinator
        captures:
          cs_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${cs_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          po_v1: $.data.version
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws_id}
          substitute_component_id: ${ws2_id}
          substitute_qty_per_car: 2
          decides_material: false
          expected_production_order_version: ${po_v1}
        as: ProductionPlanner
        as_user_id: user-op-9
        captures:
          e1_id: $.data.id
          e1_status: $.data.status
          po_v2: $.data.version
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${cs_id}
          substitute_component_id: ${ws2_id}
          substitute_qty_per_car: 1
          decides_material: true
          expected_production_order_version: ${po_v2}
        as: ProductionPlanner
        as_user_id: user-op-8
        captures:
          e2_id: $.data.id
      trigger:
      - call: POST /api/v1/substitution-endorsements/${e1_id}/approve
        payload: {}
        as: LeaseAdministrator
        as_user_id: user-op-9
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/substitution-endorsements/${e1_id}
        payload: {}
        as: PlatformAdmin
        captures:
          e1_after: $.data.status
      - call: POST /api/v1/substitution-endorsements/${e2_id}/approve
        payload: {}
        as: LeaseAdministrator
        as_user_id: user-op-9
        captures:
          e2_after: $.data.status
          e2_version: $.data.version
      assert:
      - 'Both endorsements were raised PENDING: SubstitutionEndorsement.${e1_id}.status == ${e1_status}
        == "PENDING"'
      - The self-approval attempt returns HTTP 403 with data.error_id == ${err_id} == "ERR_SELF_APPROVAL_FORBIDDEN"
      - 'The rejected approval performed no transition: SubstitutionEndorsement.${e1_id}.status == ${e1_after}
        == "PENDING"'
      - 'The segregation-of-duties rule keys on the operator id, not the role: the caller holds LeaseAdministrator,
        which is the role the endpoint requires, and is still refused because X-User-ID user-op-9 created
        the endorsement'
      - 'The control proves the approver is otherwise authorised: POST /substitution-endorsements/${e2_id}/approve
        by the same X-User-ID user-op-9 returns HTTP 200 with data.status == ${e2_after} == "APPROVED"'
      - data.version == ${e2_version} == 2 on the approved endorsement, so the approval's own version
        increment landed
  - name: error_not_found_unresolvable_component_path_id_returns_404
    claim_type: Violation → Error
    grounds:
    - validations[priority=3]
    - errors[ERR_NOT_FOUND]
    - GET /api/v1/components/{id}
    distinguishing_aspect: A path-templated component id that resolves to no persisted row is rejected
      by priority 3 with ERR_NOT_FOUND and HTTP 404, while the identical call against a created component
      returns 200 — so the 404 is id-specific rather than endpoint-wide.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - One real component WS-N1 exists so the 404 cannot be blamed on an empty store.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/components
        payload:
          part_number: WS-N1
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      trigger:
      - call: GET /api/v1/components/00000000-0000-0000-0000-0000000000d1
        payload: {}
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          real_id: $.data.id
          real_part: $.data.part_number
      assert:
      - The unresolvable path id returns HTTP 404 with data.error_id == ${err_id} == "ERR_NOT_FOUND"
      - The control read on the created component returns HTTP 200 with data.id == ${real_id} == ${ws_id}
        and data.part_number == ${real_part} == "WS-N1"
      - Priority 3 resolves path ids left to right and precedes payload and state rules; this GET carries
        no body, so no later rule can pre-empt it
      - A syntactically well-formed UUID that names nothing is treated exactly like any other unresolvable
        id
      - 'The failed lookup is side-effect free: the Component row count stays at 1 and no row is created
        or mutated'
  - name: error_component_not_found_unresolvable_body_fk_returns_404
    claim_type: Violation → Error
    grounds:
    - validations[priority=4]
    - errors[ERR_COMPONENT_NOT_FOUND]
    - entities.ComponentPurchaseOrder.fields.component_id
    - POST /api/v1/component-purchase-orders
    distinguishing_aspect: A body foreign key that resolves to no persisted row is rejected by priority
      4 with ERR_COMPONENT_NOT_FOUND and HTTP 404 — the FK-specific error, not the path-level ERR_NOT_FOUND
      — and no purchase order row is written.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - One real component WS-N2 exists, so the failure cannot be blamed on an empty catalogue; the rejected
        body names a different, absent component id.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/components
        payload:
          part_number: WS-N2
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      trigger:
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: 00000000-0000-0000-0000-0000000000d2
          qty_ordered: 10
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-21'
        as: SupplyChainCoordinator
        captures:
          err_fk: $.data.error_id
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 10
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-21'
        as: SupplyChainCoordinator
        captures:
          ok_id: $.data.id
          ok_status: $.data.status
      - call: GET /api/v1/component-purchase-orders
        payload: {}
        as: PlatformAdmin
        captures:
          only_row: $.data[0].id
      assert:
      - The dangling body FK returns HTTP 404 with data.error_id == ${err_fk} == "ERR_COMPONENT_NOT_FOUND"
      - 'The error id is the FK-specific one, not ERR_NOT_FOUND: priority 4 owns unresolvable body foreign
        keys while priority 3 owns unresolvable path ids'
      - The identical payload with a real component id returns HTTP 201 with data.status == ${ok_status}
        == "PLACED", so the 404 is caused by the missing row rather than by the body shape
      - 'Nothing was written by the rejected call: GET /api/v1/component-purchase-orders lists exactly
        one row, ${only_row} == ${ok_id}'
      - The FK is checked before any range or enum rule on the same body, since priority 4 precedes priority
        17
  - name: error_invalid_state_already_asserted_by_difficulty_design
    claim_type: Violation → Error
    grounds:
    - validations[priority=5]
    - errors[ERR_INVALID_STATE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / suspend_assignment_gated_on_contract_status
      rationale: 'Asserted as the failure path of the named §1.8 instance: its trigger drives POST /api/v1/car-assignments/{id}/suspend
        on an ACTIVE placement while the governing contract has been moved to AMENDMENT_DRAFTED, and its
        assertion pins HTTP 409 with data.error_id == "ERR_INVALID_STATE" before the identical call succeeds
        once the contract is back in ACTIVE. The same error_id and status are asserted as the winning
        rule of the priority-5-versus-priority-18 conflict in the sibling priority_pair_validation_conflict
        instance state_vs_business_fiscal_return_conflict.'
  - name: error_already_terminal_start_on_voided_program_returns_409
    claim_type: Violation → Error
    grounds:
    - validations[priority=6]
    - errors[ERR_ALREADY_TERMINAL]
    - state_machines.RetrofitProgram.terminal_states.VOIDED
    - POST /api/v1/retrofit-programs/{id}/start
    distinguishing_aspect: A second POST /retrofit-programs/{id}/start on a program already VOIDED — a
      declared terminal state of §1.2's RetrofitProgram machine — is rejected by priority 6 with ERR_ALREADY_TERMINAL
      and HTTP 409, while the identical call on a still-PLANNED program returns 200.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-J (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-J) exists
        and covers both programs, satisfying the start precondition that the program has at least one
        RetrofitProgramCarType row.
      - Program MAND-J1 was started and then voided, so it stands VOIDED with version 3; program MAND-J2
        is untouched and still PLANNED.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-J
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-J
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-J1
          description: Program to be voided
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          p1_id: $.data.id
      - call: POST /api/v1/retrofit-program-car-types
        payload:
          retrofit_program_id: ${p1_id}
          car_type_id: ${ct_id}
        as: RegulatoryRetrofitist
      - call: POST /api/v1/retrofit-programs/${p1_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          p1_started: $.data.status
      - call: POST /api/v1/retrofit-programs/${p1_id}/void
        payload:
          reason: Mandate withdrawn
        as: RegulatoryRetrofitist
        captures:
          p1_voided: $.data.status
          p1_version: $.data.version
      - call: POST /api/v1/retrofit-programs
        payload:
          mandate_code: MAND-J2
          description: Control program
          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 3
        as: RegulatoryRetrofitist
        captures:
          p2_id: $.data.id
      - call: POST /api/v1/retrofit-program-car-types
        payload:
          retrofit_program_id: ${p2_id}
          car_type_id: ${ct_id}
        as: RegulatoryRetrofitist
      trigger:
      - call: POST /api/v1/retrofit-programs/${p1_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          err_terminal: $.data.error_id
      - call: GET /api/v1/retrofit-programs/${p1_id}
        payload: {}
        as: PlatformAdmin
        captures:
          p1_after: $.data.status
          p1_after_version: $.data.version
      - call: POST /api/v1/retrofit-programs/${p2_id}/start
        payload: {}
        as: RegulatoryRetrofitist
        captures:
          p2_status: $.data.status
      assert:
      - 'The first program reached the terminal state: status == ${p1_voided} == "VOIDED" at version ${p1_version}
        == 3 (PLANNED -> IN_PROGRESS -> VOIDED)'
      - The restart attempt returns HTTP 409 with data.error_id == ${err_terminal} == "ERR_ALREADY_TERMINAL"
      - 'The terminal state is unchanged by the rejection: status == ${p1_after} == "VOIDED" with version
        still ${p1_after_version} == 3'
      - VOIDED is a declared terminal_state of §1.2's RetrofitProgram machine and §1.4 priority 6 lists
        POST /retrofit-programs/{id}/start in its applies_to set, so the terminal rule rather than the
        generic state rule owns this rejection
      - 'The control program is still legal to start: POST /retrofit-programs/${p2_id}/start returns HTTP
        200 with data.status == ${p2_status} == "IN_PROGRESS", so the 409 is terminal-state-specific'
  - name: error_stale_version_amendment_redraft_returns_412
    claim_type: Violation → Error
    grounds:
    - validations[priority=7]
    - errors[ERR_STALE_VERSION]
    - concurrency_rules[amendment-redraft-stale-contract]
    - POST /api/v1/lease-contracts/{id}/amendments
    distinguishing_aspect: Drafting an amendment with expected_lease_version one below the contract's
      current version is rejected 412 ERR_STALE_VERSION with the contract left ACTIVE and unversioned,
      while the identical call carrying the current version succeeds and moves it to AMENDMENT_DRAFTED.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Lessee "Stale Amendment Rail Co" holds contract LC-K, activated so it stands ACTIVE at version
        2 (create 1 -> activate 2).
      - The amendment body is identical in both attempts — per_diem_rate_cents 1500 and liability_bearer
        LESSEE — so only the expected_lease_version differs.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: Stale Amendment Rail Co
          credit_tier: B
          utilization_threshold_pct: 0
          credit_ceiling_cents: 1000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 1000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2027-09-01'
          fleet_car_cap: 5
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_status: $.data.status
          lc_v: $.data.version
      trigger:
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 1500
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v} - 1
        as: LeaseAdministrator
        captures:
          err_stale: $.data.error_id
      - call: GET /api/v1/lease-contracts/${lc_id}
        payload: {}
        as: PlatformAdmin
        captures:
          lc_after_reject: $.data.status
          lc_v_after_reject: $.data.version
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 1500
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v}
        as: LeaseAdministrator
        captures:
          lc_drafted: $.data.status
          lc_v_drafted: $.data.version
      assert:
      - The contract stood ACTIVE at version ${lc_v} == 2 after activation
      - The stale draft returns HTTP 412 with data.error_id == ${err_stale} == "ERR_STALE_VERSION", the
        priority-7 OCC rule named by concurrency_rules[amendment-redraft-stale-contract]
      - 'The rejection is atomic: GET /lease-contracts/${lc_id} still reports status == ${lc_after_reject}
        == "ACTIVE" at version == ${lc_v_after_reject} == ${lc_v}'
      - The stale version was the only difference — ${lc_v} - 1 versus ${lc_v} — so the 412 is caused
        by the version mismatch rather than by the rate or bearer in the body
      - 'The same call carrying the observed version succeeds: HTTP 200 with data.status == ${lc_drafted}
        == "AMENDMENT_DRAFTED" and data.version == ${lc_v_drafted} == 3'
      - The write bumps the parent version exactly once, so a second draft built on the stale ${lc_v}
        would now also be rejected
