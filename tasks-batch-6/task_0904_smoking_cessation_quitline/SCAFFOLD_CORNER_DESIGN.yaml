# =============================================================================
# Task 0904 — §1.9 Scaffold Corner Design (breadth coverage of non-§1.8 claims)
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: participant_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Participant.fields.cigarettes_per_day]
        distinguishing_aspect: "POST /participants omitting cigarettes_per_day -> ERR_VALIDATION (400); no participant created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"

      - name: self_pay_enrollment_defaults_nrt_allotment
        claim_type: defaults
        grounds: [entities.Enrollment.fields.nrt_courses_allotted]
        distinguishing_aspect: "Self-pay participant (no employer_program_id) enrollment inherits DEFAULT_SELF_PAY_NRT_COURSES == 2."
        test_recipe:
          setup: ["Self-pay participant, no program."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "SP", email: "sp@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
          assert:
            - "Enrollment.${enr_id}.nrt_courses_allotted == 2"
            - "Enrollment.${enr_id}.nrt_eligibility == ELIGIBLE"

      - name: participant_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PARTICIPANT_NOT_FOUND]"]
        distinguishing_aspect: "GET /participants/{unknown-uuid} -> ERR_PARTICIPANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /participants/00000000-0000-4000-8000-000000000000"
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PARTICIPANT_NOT_FOUND"

      - name: enrollment_system_fields_generated
        claim_type: system_fields
        grounds: [entities.Enrollment.fields.status, entities.Enrollment.fields.participant_id]
        distinguishing_aspect: "New enrollment has server-minted id, version==1, status==PENDING_ASSESSMENT, participant_id set from the path."
        test_recipe:
          setup: ["One participant."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id, enr_v: $.data.version }
          assert:
            - "Enrollment.${enr_id}.status == PENDING_ASSESSMENT"
            - "Enrollment.${enr_id}.version == 1"
            - "Enrollment.${enr_id}.participant_id == ${part_id}"

  # ------------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: activate_without_pass_returns_readiness_not_met
        claim_type: precondition_enforcement
        grounds: [state_machines.Enrollment.PENDING_ASSESSMENT_to_ACTIVE, "errors[ERR_READINESS_NOT_MET]"]
        distinguishing_aspect: "Activation when latest readiness result is FAIL (score 11 < 12) -> ERR_READINESS_NOT_MET; enrollment stays PENDING_ASSESSMENT."
        test_recipe:
          setup: ["Enrollment with a FAIL readiness assessment (motivation 6 + confidence 5, cpd 10 -> score 11)."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 5, prior_quit_attempts: 0 }
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_READINESS_NOT_MET"

      - name: nrt_skip_states_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.NRTShipment.SHIPPED_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REQUESTED shipment transitioned directly to DELIVERED (skipping APPROVED/SHIPPED) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE enrollment, committed quit attempt, one REQUESTED shipment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 15 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "NRT_ASSISTED" }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-05T00:00:00Z", course_end_date: "2026-06-30T00:00:00Z" }
              as: CaseManager
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "DELIVERED" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: disenroll_from_terminal_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Enrollment.ACTIVE_to_DISENROLLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second disenroll on an already-DISENROLLED enrollment -> ERR_INVALID_STATE; no side effects re-fire."
        test_recipe:
          setup: ["ACTIVE enrollment already disenrolled (status DISENROLLED)."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/disenroll"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/disenroll"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"

      - name: followup_before_window_returns_not_open
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_FOLLOWUP_WINDOW_NOT_OPEN]", entities.FollowUpOutcome.fields.day]
        distinguishing_aspect: "Recording day=7 outcome while clock (2026-06-03) is before quit_date+7 (2026-06-09) -> ERR_FOLLOWUP_WINDOW_NOT_OPEN."
        test_recipe:
          setup: ["ACTIVE enrollment, committed quit attempt quit_date 2026-06-02, clock 2026-06-03."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FOLLOWUP_WINDOW_NOT_OPEN"

      - name: duplicate_followup_same_day_returns_error
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_DUPLICATE_FOLLOWUP]", entities.FollowUpOutcome.fields.day]
        distinguishing_aspect: "A second day=7 FollowUpOutcome for the same enrollment -> ERR_DUPLICATE_FOLLOWUP."
        test_recipe:
          setup: ["ACTIVE enrollment, committed quit attempt, clock 2026-06-09, one day=7 outcome already recorded (abstinent true)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "COLD_TURKEY" }
              as: CaseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/follow-up-outcomes"
              payload: { day: 7, abstinent: true }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_FOLLOWUP"

  # ------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: nrt_weeks_supply_heavy_smoker_patch
        claim_type: correct_result
        grounds: [calculations.nrt_course_quantity, entities.NRTShipment.fields.weeks_supply, entities.NRTShipment.fields.dose_mg]
        distinguishing_aspect: "cpd 25 + PATCH -> weeks_supply 12, dose_mg 21 (heavy-smoker tier)."
        test_recipe:
          setup: ["ACTIVE enrollment, participant cpd 25."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 25 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 8, confidence_score: 8, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-05T00:00:00Z", course_end_date: "2026-07-01T00:00:00Z" }
              as: CaseManager
              captures: { ship_id: $.data.id }
          assert:
            - "NRTShipment.${ship_id}.weeks_supply == 12"
            - "NRTShipment.${ship_id}.dose_mg == 21"

      - name: readiness_score_light_smoker_no_penalty
        claim_type: correct_result
        grounds: [calculations.readiness_score]
        distinguishing_aspect: "motivation 5 + confidence 5 + prior_bonus(1->1) - penalty(cpd 8 ->0) == 11 -> FAIL (below 12)."
        test_recipe:
          setup: ["Participant cpd 8; enrollment PENDING."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 8 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 5, confidence_score: 5, prior_quit_attempts: 1 }
              as: CaseManager
              captures: { ra_id: $.data.id }
          assert:
            - "ReadinessAssessment.${ra_id}.readiness_score == 11"
            - "ReadinessAssessment.${ra_id}.result == FAIL"

  # ------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: nrt_exhausted_blocks_new_request
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NRT_EXHAUSTED]", entities.Enrollment.fields.nrt_eligibility]
        distinguishing_aspect: "With allotment 1 already DELIVERED (EXHAUSTED), a new NRT shipment request -> ERR_NRT_EXHAUSTED."
        test_recipe:
          setup: ["Sponsored program allotment 1; ACTIVE enrollment, committed quit attempt; one shipment DELIVERED (used 1)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Ex", budget_total_cents: 100000, nrt_courses_allotted: 1 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 15, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/quit-attempts"
              payload: { quit_date: "2026-06-02T00:00:00Z", method: "NRT_ASSISTED" }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "PATCH", course_start_date: "2026-06-02T00:00:00Z", course_end_date: "2026-06-20T00:00:00Z" }
              as: CaseManager
              captures: { ship_id: $.data.id }
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "APPROVED" }
              as: CaseManager
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "SHIPPED" }
              as: CaseManager
            - call: "POST /nrt-shipments/${ship_id}/transition"
              payload: { to_status: "DELIVERED" }
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/nrt-shipments"
              payload: { medication_type: "GUM", course_start_date: "2026-06-25T00:00:00Z", course_end_date: "2026-07-10T00:00:00Z" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NRT_EXHAUSTED"

      - name: manual_award_exceeds_budget_returns_fiscal_error
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_PROGRAM_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "On an ACTIVE sponsored enrollment (no state conflict), a manual award amount 999999 > budget_remaining 1000 -> ERR_PROGRAM_BUDGET_EXCEEDED."
        test_recipe:
          setup: ["Sponsored program budget 2000; enrollment ACTIVE (ENROLLMENT award debits 1000, leaving budget_remaining 1000). Fresh program version read."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Tiny", budget_total_cents: 2000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "GET /employer-programs/${prog_id}"
              as: CaseManager
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/incentive-awards"
              payload: { milestone_type: "DISCRETIONARY", amount_cents: 999999, expected_employer_program_version: "${prog_v}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PROGRAM_BUDGET_EXCEEDED"

      - name: schedule_window_invalid_past_slot
        claim_type: temporal_validation
        grounds: ["validations[priority=7]", "errors[ERR_SCHEDULE_WINDOW_INVALID]"]
        distinguishing_aspect: "Language-matched coach but scheduled_start 2026-05-01 (past, < now+60min) -> ERR_SCHEDULE_WINDOW_INVALID (temporal isolated from referential)."
        test_recipe:
          setup: ["ACTIVE EN enrollment; EN coach; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /coaches"
              payload: { full_name: "Coach EN", languages: ["EN"] }
              as: ProgramAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "${coach_id}", scheduled_start: "2026-05-01T00:00:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SCHEDULE_WINDOW_INVALID"

      - name: manual_award_on_closed_program_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=6]", "errors[ERR_PROGRAM_CLOSED]", state_machines.EmployerProgram.ACTIVE_to_CLOSED]
        distinguishing_aspect: "After closing the sponsor program, a manual award -> ERR_PROGRAM_CLOSED."
        test_recipe:
          setup: ["Sponsored ACTIVE enrollment; program then CLOSED via OCC-guarded close."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Cl", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "GET /employer-programs/${prog_id}"
              as: ProgramAdmin
              captures: { prog_v: $.data.version }
            - call: "POST /employer-programs/${prog_id}/close"
              payload: { expected_employer_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/incentive-awards"
              payload: { milestone_type: "DISCRETIONARY", amount_cents: 500, expected_employer_program_version: "${prog_v2}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PROGRAM_CLOSED"

  # ------------------------------------------------------------- Endpoints
  - section: endpoints
    instances:
      - name: schedule_call_with_unknown_coach_returns_not_found
        claim_type: action_endpoint
        grounds: ["errors[ERR_COACH_NOT_FOUND]", entities.CoachingCall.fields.coach_id]
        distinguishing_aspect: "Scheduling with a non-existent coach_id -> ERR_COACH_NOT_FOUND (404)."
        test_recipe:
          setup: ["ACTIVE EN enrollment; clock 2026-06-01; no coach created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/coaching-calls"
              payload: { coach_id: "00000000-0000-4000-8000-000000000000", scheduled_start: "2026-06-02T10:00:00Z", duration_minutes: 30 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_COACH_NOT_FOUND"

      - name: transition_unknown_quit_attempt_returns_not_found
        claim_type: action_endpoint
        grounds: ["errors[ERR_QUIT_ATTEMPT_NOT_FOUND]"]
        distinguishing_aspect: "Transitioning a non-existent quit-attempt id -> ERR_QUIT_ATTEMPT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /quit-attempts/00000000-0000-4000-8000-000000000000/transition"
              payload: { to_status: "RELAPSED" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_QUIT_ATTEMPT_NOT_FOUND"

      - name: manual_award_on_self_pay_returns_program_not_found
        claim_type: conditional_action
        grounds: ["errors[ERR_EMPLOYER_PROGRAM_NOT_FOUND]", entities.Participant.fields.employer_program_id]
        distinguishing_aspect: "Manual award on a self-pay enrollment (participant.employer_program_id null) has no sponsor budget -> ERR_EMPLOYER_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["Self-pay ACTIVE enrollment (no program). OCC field must still be a placeholder; use enrollment version as a stand-in bound var (server rejects on program lookup before OCC)."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/incentive-awards"
              payload: { milestone_type: "DISCRETIONARY", amount_cents: 500, expected_employer_program_version: "${enr_v}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_EMPLOYER_PROGRAM_NOT_FOUND"

  # ------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: program_admin_cannot_create_enrollment
        claim_type: exclusive_operation_denied
        grounds: [roles.CaseManager, roles.ProgramAdmin]
        distinguishing_aspect: "ProgramAdmin POST /participants/{id}/enrollments (CaseManager-exclusive) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One participant."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: participant_cannot_read_other_participants_enrollment
        claim_type: peer_isolation_denied
        grounds: [roles.Participant, entities.Enrollment.fields.participant_id]
        distinguishing_aspect: "Participant B (X-User-ID = participant B) GET participant A's enrollment -> ERR_UNAUTHORIZED (entity-backed ownership)."
        test_recipe:
          setup: ["Participant A with an enrollment; Participant B registered separately."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { a_id: $.data.id }
            - call: "POST /participants/${a_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { ea_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "B", email: "b@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { b_id: $.data.id }
          trigger:
            - call: "GET /enrollments/${ea_id}"
              as: Participant
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: participant_reads_own_enrollment_ok
        claim_type: shared_operation_allowed
        grounds: [roles.Participant, entities.Enrollment.fields.participant_id]
        distinguishing_aspect: "Participant A (X-User-ID = A) GET own enrollment -> 200 with status PENDING_ASSESSMENT."
        test_recipe:
          setup: ["Participant A with an enrollment."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "A", email: "a@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { a_id: $.data.id }
            - call: "POST /participants/${a_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { ea_id: $.data.id }
          trigger:
            - call: "GET /enrollments/${ea_id}"
              as: Participant
              as_user_id: "${a_id}"
          assert:
            - "Enrollment.${ea_id}.status == PENDING_ASSESSMENT"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: authentication_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request with no X-User-Role / X-User-ID headers -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["One participant with an enrollment; the trigger omits auth headers."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10 }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /enrollments/${enr_id}"
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED (auth headers omitted on this request)"

  # ------------------------------------------------------------- Cross-cutting (OCC)
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_program_version_on_manual_award
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[manual-award-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Manual award carrying the program version observed at creation (v1) after activation bumped it to v2 -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Sponsored ACTIVE enrollment; program version captured at creation (v1) is stale after activation's ENROLLMENT award bumped it to v2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Occ", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
          trigger:
            - call: "POST /enrollments/${enr_id}/incentive-awards"
              payload: { milestone_type: "DISCRETIONARY", amount_cents: 500, expected_employer_program_version: "${prog_v0}" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_VERSION"

      - name: occ_correct_program_version_on_manual_award_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[manual-award-stale-program]", entities.EmployerProgram.fields.budget_remaining_cents]
        distinguishing_aspect: "Manual award with the current program version (read fresh) succeeds, debits budget by 500, and bumps program version."
        test_recipe:
          setup: ["Sponsored ACTIVE enrollment; program version read fresh after activation (v2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employer-programs"
              payload: { name: "Occ2", budget_total_cents: 100000, nrt_courses_allotted: 3 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P", email: "p@x.com", primary_language: "EN", cigarettes_per_day: 10, employer_program_id: "${prog_id}" }
              as: CaseManager
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/enrollments"
              payload: {}
              as: CaseManager
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/readiness-assessments"
              payload: { motivation_score: 6, confidence_score: 6, prior_quit_attempts: 0 }
              as: CaseManager
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseManager
            - call: "GET /employer-programs/${prog_id}"
              as: CaseManager
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/incentive-awards"
              payload: { milestone_type: "DISCRETIONARY", amount_cents: 500, expected_employer_program_version: "${prog_v}" }
              as: CaseManager
              captures: { award_id: $.data.id }
          assert:
            - "IncentiveAward.${award_id}.status == EARNED"
            - "IncentiveAward.${award_id}.source == MANUAL"
            - "EmployerProgram.${prog_id}.budget_remaining_cents == 98500"

