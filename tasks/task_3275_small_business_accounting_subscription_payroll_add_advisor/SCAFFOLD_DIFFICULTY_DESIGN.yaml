              as: CompanyUser
              as_user_id: "${company_g_admin_id}"
              captures: { payroll_g_id: $.data.id }
            - call: "POST /api/companies/${company_g_id}/payroll/employees"
              payload: { payroll_addon_id: "${payroll_g_id}", legal_name: "Emp One", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_g_admin_id}"
            - &k_tr_g
              call: "POST /api/companies/${company_g_id}/billing_transfers"
              payload: { company_id: "${company_g_id}", subscription_id: "${sub_g_id}", initiating_firm_id: "${firm_gold_id}", to_owner: "FIRM" }
              as: AccountantUser
              as_user_id: "${firm_admin_id}"
              captures: { tr_g_id: $.data.id }
            - call: "POST /api/companies/${company_g_id}/billing_transfers/${tr_g_id}/accept"
              payload: { expected_subscription_version: "${sub_g_v}" }
              as: CompanyUser
              as_user_id: "${company_g_admin_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_inv_g
              call: "POST /api/companies/${company_g_id}/invoices/${sub_g_id}/issue"
              payload: {}
              as: PlatformAdmin
              captures: { inv_g_id: $.data.id }
          trigger:
            - call: "GET /api/companies/${company_g_id}/invoices/${inv_g_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Invoice.${inv_g_id}.list_subscription_cents == 8000"
            - "Invoice.${inv_g_id}.wholesale_discount_cents == 2400 (8000 * 0.30, GOLD tier)"
            - "Invoice.${inv_g_id}.payroll_base_cents == 4500"
            - "Invoice.${inv_g_id}.payroll_per_employee_cents == 600 (1 emp * 30 days * 600/30)"
            - "subtotal == 8000 - 2400 + 4500 + 600 == 10700"
            - "Invoice.${inv_g_id}.tax_cents == 2140 (round_half_up(10700 * 0.20))"
            - "Invoice.${inv_g_id}.total_cents == 12840 (10700 + 2140)"
            - "Proves pinned order: tax is on post-discount subtotal including payroll"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_cyclic_active_suspended_active_loop
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
          - state_machines.Subscription.CANCELLED_READ_ONLY_to_REACTIVATED
        distinguishing_aspect: |
