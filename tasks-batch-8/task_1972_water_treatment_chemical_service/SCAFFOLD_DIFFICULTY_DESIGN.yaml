              as: WaterChemist
              captures: { c4a_st2: $.data.id }
            - call: "POST /wt/test-routes/${c4a_rt}/stops"
              payload: { asset_id: "${c4a_asset}", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-06T12:00:00Z", sequence_index: 3 }
              as: WaterChemist
              captures: { c4a_st3: $.data.id }
            - { call: "POST /wt/test-routes/${c4a_rt}/publish", payload: {}, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T06:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${c4a_st1}/arrive", payload: {}, as: WaterChemist }
            - { call: "POST /wt/route-stops/${c4a_st1}/water-test-results", payload: { asset_id: "${c4a_asset}", ph: 9.8, conductivity_umhos: 3900, calcium_ppm: 300, alkalinity_ppm: 150, temperature_f: 90, inhibitor_residual_ppm: 1.0 }, as: WaterChemist }
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T13:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${c4a_st2}/arrive", payload: {}, as: WaterChemist }
            - { call: "POST /wt/route-stops/${c4a_st2}/water-test-results", payload: { asset_id: "${c4a_asset}", ph: 9.8, conductivity_umhos: 3900, calcium_ppm: 300, alkalinity_ppm: 150, temperature_f: 90, inhibitor_residual_ppm: 1.0 }, as: WaterChemist }
          trigger:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T06:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/route-stops/${c4a_st3}/arrive", payload: {}, as: WaterChemist }
            - call: "POST /wt/route-stops/${c4a_st3}/water-test-results"
              payload: { asset_id: "${c4a_asset}", ph: 9.8, conductivity_umhos: 3900, calcium_ppm: 300, alkalinity_ppm: 150, temperature_f: 90, inhibitor_residual_ppm: 1.0 }
              as: WaterChemist
              as_user_id: "chemist-recorder-1"
              captures: { c4a_wtr3: $.data.id }
            - call: "GET /wt/corrective-actions"
              payload: { asset_id: "${c4a_asset}", status: "PENDING" }
              as: WaterChemist
              captures: { c4a_action: "$.data[0].id" }
            - call: "GET /wt/feed-stations/${c4a_fs}"
              payload: {}
              as: WaterChemist
              captures: { c4a_fs_v: $.data.version }
            - call: "POST /wt/corrective-actions/${c4a_action}/approve"
              payload: { setpoint_delta_ml_per_min: 2.5, rationale: "raise inhibitor feed", expected_feed_station_version: "${c4a_fs_v}" }
              as: WaterChemist
              as_user_id: "chemist-approver-2"
            - { call: "POST /wt/corrective-actions/${c4a_action}/apply", payload: {}, as: WaterChemist }
          assert:
            - "SystemAsset.${c4a_asset}.consecutive_out_of_range_count == 0 after apply"
            - "CorrectiveAction.${c4a_action}.status == APPLIED"
            - "FeedStation.${c4a_fs}.setpoint_ml_per_min == 27.4206"
            - "Exactly one DeliveryOrder with station_id == ${c4a_fs} and auto_drafted == true exists in status DRAFT"
            - "That DeliveryOrder.quantity_gal == 55"

      - name: program_accept_cascade_depth3_supersede_and_setpoint_reprice
        grounds:
          - state_machines.ProgramDesign.PROPOSED_to_ACCEPTED
          - calculations.feed_rate_setpoint
          - calculations.inventory_depletion_projection
        distinguishing_aspect: |
          Depth-3 chain from the accept trigger: accept design D2 -> prior
          design D1 SUPERSEDED (link 1) -> asset.target_coc frozen to D2's
          proposed_coc (link 2, caused by the accept) -> every station setpoint
          recomputed from the new target (link 3, caused by the freeze) ->
          depletion projection recomputed. Different trigger than the
          test-result cascade.
        test_recipe:
          setup:
            - "Asset with D1 ACCEPTED (coc 3.0, inhibitor 5) and station setpoint at the coc-3.0 value 38.3273; D2 progressed to PROPOSED with proposed_coc 4.0"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Supersede Co" }
              as: AccountManager
              captures: { c4b_acct: $.data.id }
            - call: "POST /wt/assets"
