      - name: reschedule_after_14_days_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "calculations.guarantee_windows", "errors[ERR_RESCHEDULE_WINDOW_EXPIRED]"]
        distinguishing_aspect: "A WEATHER_HELD order rescheduled on held_at date + 15 days is rejected with ERR_RESCHEDULE_WINDOW_EXPIRED (the 14th day would be allowed)."
        test_recipe:
          setup: ["RETAIL customer; site; 1 SEDAN; order SCHEDULED for window date 2026-08-10; freeze evaluation at clock 2026-08-10T08:00:00Z holds it; clock advanced to 2026-08-25T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/customers", payload: { name: "V9", email: "v9@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "V9S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
