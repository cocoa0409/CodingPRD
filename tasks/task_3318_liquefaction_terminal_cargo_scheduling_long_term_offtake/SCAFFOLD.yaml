scenario: "Liquefaction Terminal Cargo Scheduling & Long-Term Offtake (Cheniere Energy): long-term sale and purchase agreements with fixed liquefaction fees plus commodity-linked components and annual contract quantities, annual delivery program construction assigning cargo slots to customers with flexibility windows, feed gas nomination and pipeline scheduling coordinated with train availability, vessel arrival scheduling with berth availability, laytime and demurrage exposure, cargo cancellation rights where a customer pays the fixed fee and forgoes the cargo with feed gas resale, maintenance turnaround scheduling across trains with production impact on the delivery program, destination flexibility and title transfer terms in customer contracts, commissioning of new trains and transition from testing cargoes to commercial operation"
domain_name: liquefaction-terminal-cargo-scheduling
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Buyer's legal entity name" }
      - { name: credit_rating, type: enum, source: input, description: "Credit band", constraints: "one of {AAA, AA, A, BBB}" }
      - { name: billing_currency, type: string, source: input, description: "ISO currency for all invoicing", default: "USD" }

  - name: SalesPurchaseAgreement
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning buyer" }
      - { name: contract_year_start, type: integer, source: input, description: "First contract year (calendar year number), e.g. 2027" }
      - { name: term_years, type: integer, source: input, description: "Number of contract years; >= 1" }
      - { name: annual_contract_quantity_mmbtu, type: integer, source: input, description: "ACQ per contract year; > 0" }
      - { name: fixed_liquefaction_fee_usd_per_mmbtu, type: number, source: input, description: "Fixed fee component, payable even on cancelled cargoes" }
      - { name: commodity_multiplier, type: number, source: input, description: "Multiplier on the commodity index, e.g. 1.15 for 115% of Henry Hub" }
      - { name: commodity_index, type: enum, source: input, description: "Commodity price index", constraints: "one of {HENRY_HUB, TTF, JKM}" }
      - { name: destination_flexibility, type: enum, source: input, description: "FOB = customer controls destination; DES = terminal delivers", constraints: "one of {FOB, DES}" }
      - { name: title_transfer_point, type: enum, source: input, description: "Where title to LNG passes", constraints: "one of {LOADING_FLANGE, DISCHARGE_PORT}" }
      - { name: cancellation_notice_days, type: integer, source: input, description: "Minimum whole days of notice before cargo window_start to cancel; >= 0" }
      - { name: tolerance_pct, type: number, source: input, description: "Annual take-or-pay tolerance fraction, e.g. 0.05; >= 0 and <= 1" }
      - { name: estimated_index_price_usd_per_mmbtu, type: number, source: input, description: "Provisional commodity index estimate used for provisional invoices; > 0" }
      - { name: status, type: enum, source: system, description: "EXECUTED on create; DELIVERIES_COMMENCED after first-train gating; EXPIRED by system when the logical clock passes contract end", constraints: "one of {EXECUTED, DELIVERIES_COMMENCED, EXPIRED}" }

  - name: LiquefactionTrain
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Train name, unique" }
      - { name: design_capacity_mtpa, type: number, source: input, description: "Nameplate capacity in MTPA; > 0" }
      - { name: daily_capacity_mmbtu, type: integer, source: input, description: "Assumed daily LNG output while in COMMERCIAL_OPERATION; > 0" }
      - { name: commissioning_cargoes_required, type: integer, source: input, description: "Testing cargoes that must complete before COD; >= 0" }
      - { name: commissioning_cargoes_completed, type: integer, source: computed, description: "Count of recorded commissioning (testing) cargoes; incremented by record-commissioning-cargo" }
      - { name: cod_date, type: string, source: system, description: "Commercial operation date (YYYY-MM-DD), set at declare-cod; null until then" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of {CONSTRUCTION, COMMISSIONING, COMMERCIAL_OPERATION, TURNAROUND, DECOMMISSIONED}" }

  - name: AnnualDeliveryProgram
    parent: SalesPurchaseAgreement
    common_fields: true
    fields:
      - { name: spa_id, type: string, source: input, description: "FK -> SalesPurchaseAgreement.id; parent SPA" }
      - { name: contract_year, type: integer, source: input, description: "Calendar contract year this program covers; must be within SPA term" }
      - { name: revision_no, type: integer, source: system, description: "1 for the first ADP of (spa, contract_year); increments per superseding revision" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "one of {DRAFT, PROPOSED, CONFIRMED, LOCKED, SUPERSEDED}" }
      - { name: scheduled_quantity_mmbtu, type: integer, source: computed, description: "Sum of quantity_mmbtu over non-CANCELLED CargoSlots of this ADP" }
      - { name: cancelled_quantity_mmbtu, type: integer, source: computed, description: "Sum of quantity_mmbtu over CANCELLED CargoSlots of this ADP" }
      - { name: unallocated_quantity_mmbtu, type: integer, source: computed, description: "SPA ACQ minus scheduled_quantity_mmbtu minus cancelled_quantity_mmbtu" }
      - { name: delivered_equivalent_mmbtu, type: integer, source: computed, description: "LOADED plus CANCELLED slot quantities; set at reconcile" }
      - { name: shortfall_mmbtu, type: integer, source: computed, description: "max(0, ACQ*(1-tolerance) - delivered_equivalent); set at reconcile" }
      - { name: deficiency_amount_usd, type: number, source: computed, description: "shortfall * (fixed fee + multiplier * reference index); set at reconcile; 2dp half-up" }

  - name: CargoSlot
    parent: AnnualDeliveryProgram
    common_fields: true
    fields:
      - { name: adp_id, type: string, source: input, description: "FK -> AnnualDeliveryProgram.id; owning delivery program" }
      - { name: window_start, type: datetime, source: input, description: "Start of the delivery flexibility window (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "End of the delivery flexibility window (exclusive); must be after window_start and within the ADP contract year" }
      - { name: quantity_mmbtu, type: integer, source: input, description: "Cargo LNG quantity; > 0" }
      - { name: lift_status, type: enum, source: system, description: "Parallel dimension 1: physical lifting state", constraints: "one of {SCHEDULED, VESSEL_NOMINATED, BERTH_ASSIGNED, LOADED, CANCELLED, RESCHEDULED}" }
      - { name: billing_status, type: enum, source: system, description: "Parallel dimension 2: billing state, evolves independently of lift_status", constraints: "one of {UNBILLED, PROVISIONALLY_INVOICED, FINAL_INVOICED}" }
      - { name: scheduled_feed_gas_mmbtu, type: integer, source: computed, description: "ceil(quantity_mmbtu * FEED_GAS_RATIO); feed gas the terminal must receive for this cargo" }
      - { name: provisional_invoice_usd, type: number, source: computed, description: "Provisional invoice set when the vessel departs; null until then" }
      - { name: final_invoice_usd, type: number, source: computed, description: "Final invoice set by issue-final-invoice; null until then" }

  - name: Berth
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Berth name, unique" }
      - { name: max_loa_m, type: number, source: input, description: "Maximum vessel length overall accepted; > 0" }
      - { name: max_dwt_t, type: integer, source: input, description: "Maximum vessel deadweight accepted; > 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE on create; OUT_OF_SERVICE while any turnaround on any train is IN_PROGRESS", constraints: "one of {IN_SERVICE, OUT_OF_SERVICE}" }

  - name: VesselCall
    parent: CargoSlot
    common_fields: true
    fields:
      - { name: cargo_slot_id, type: string, source: input, description: "FK -> CargoSlot.id; cargo this call lifts" }
      - { name: berth_id, type: string, source: system, description: "FK -> Berth.id; assigned at accept; null while NOMINATED" }
      - { name: vessel_name, type: string, source: input, description: "Vessel name" }
      - { name: imo_number, type: string, source: input, description: "IMO number" }
      - { name: vessel_loa_m, type: number, source: input, description: "Vessel length overall; > 0" }
      - { name: vessel_dwt_t, type: integer, source: input, description: "Vessel deadweight; > 0" }
      - { name: demurrage_rate_usd_per_day, type: number, source: input, description: "Contract demurrage rate; > 0" }
      - { name: status, type: enum, source: system, description: "Arrival lifecycle", constraints: "one of {NOMINATED, ACCEPTED, NOR_TENDERED, BERTHED, DEPARTED, SUPERSEDED}" }
      - { name: window_start, type: datetime, source: input, description: "Assigned berth window start (inclusive), set at accept" }
      - { name: window_end, type: datetime, source: input, description: "Assigned berth window end (exclusive), set at accept" }
      - { name: nor_tendered_at, type: datetime, source: system, description: "Notice-of-readiness timestamp; set at tender-nor" }
      - { name: berthed_at, type: datetime, source: system, description: "All-fast timestamp; set at berth" }
      - { name: departed_at, type: datetime, source: system, description: "Departure timestamp; set at depart" }

  - name: LaytimeStatement
    parent: VesselCall
    common_fields: true
    fields:
      - { name: vessel_call_id, type: string, source: input, description: "FK -> VesselCall.id; the completed call this statement covers" }
      - { name: billing_basis, type: enum, source: input, description: "Which variant of used laytime is billed", constraints: "one of {SOF_BASIS, PUMP_LOG_BASIS}" }
      - { name: excluded_periods, type: array, source: input, description: "Optional list of {start, end, reason} intervals not counting against laytime (terminal fault, weather); each must lie within [laytime_start, departed_at]" }
      - { name: pump_hours, type: number, source: input, description: "Optional vessel pump-log hours; required when billing_basis is PUMP_LOG_BASIS" }
      - { name: laytime_start_at, type: datetime, source: computed, description: "min(nor_tendered_at + NOR_GRACE_HOURS, berthed_at)" }
      - { name: allowed_laytime_hours, type: number, source: computed, description: "ceil(quantity / LOADING_RATE_MMBTU_PER_HOUR) + BERTH_ALLOWANCE_HOURS" }
      - { name: elapsed_hours, type: number, source: computed, description: "departed_at minus laytime_start_at, in hours, 2dp half-up" }
      - { name: used_laytime_hours_sof, type: number, source: computed, description: "elapsed_hours minus sum of excluded periods, 2dp half-up (variant A)" }
      - { name: used_laytime_hours_pumplog, type: number, source: computed, description: "pump_hours + CONNECTION_ALLOWANCE_HOURS, 2dp half-up (variant B); null if pump_hours absent" }
      - { name: demurrage_amount_sof_usd, type: number, source: computed, description: "Demurrage on the SOF variant; 2dp half-up" }
      - { name: demurrage_amount_pumplog_usd, type: number, source: computed, description: "Demurrage on the pump-log variant; null if pump_hours absent" }
      - { name: billed_demurrage_usd, type: number, source: computed, description: "Variant selected by billing_basis; the amount that flows to settlement" }
      - { name: adjusted_demurrage_usd, type: number, source: input, description: "Commercially agreed override set at resolve; null until resolved" }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", constraints: "one of {SUBMITTED, AGREED, DISPUTED, RESOLVED}" }

  - name: Pipeline
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pipeline name, unique" }
      - { name: daily_capacity_mmbtu, type: integer, source: input, description: "Maximum daily transport capacity; > 0" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE on create; OUTAGE while any turnaround is IN_PROGRESS", constraints: "one of {IN_SERVICE, OUTAGE}" }

  - name: PipelineDaySchedule
    parent: Pipeline
    common_fields: true
    fields:
      - { name: pipeline_id, type: string, source: input, description: "FK -> Pipeline.id; scheduled pipeline" }
      - { name: gas_day, type: string, source: input, description: "Gas day YYYY-MM-DD; unique per pipeline" }
      - { name: capacity_mmbtu, type: integer, source: input, description: "Firm capacity offered this day; > 0 and <= pipeline.daily_capacity_mmbtu" }
      - { name: status, type: enum, source: system, description: "OPEN accepts nominations; CLOSED is prorated and frozen", constraints: "one of {OPEN, CLOSED}" }
      - { name: total_nominated_mmbtu, type: integer, source: computed, description: "Sum of nominated_mmbtu over all nominations (any status)" }
      - { name: total_confirmed_mmbtu, type: integer, source: computed, description: "Sum of confirmed_mmbtu over CONFIRMED nominations" }
      - { name: total_cut_mmbtu, type: integer, source: computed, description: "Sum of cut_mmbtu over CUT nominations plus cut volume on CONFIRMED nominations" }

  - name: FeedGasNomination
    parent: PipelineDaySchedule
    common_fields: true
    fields:
      - { name: pipeline_day_schedule_id, type: string, source: input, description: "FK -> PipelineDaySchedule.id; day schedule nominated against" }
      - { name: cargo_slot_id, type: string, source: input, description: "FK -> CargoSlot.id; cargo this gas feeds" }
      - { name: nominated_mmbtu, type: integer, source: input, description: "Requested volume; > 0 and <= cargo slot scheduled_feed_gas_mmbtu" }
      - { name: confirmed_mmbtu, type: integer, source: computed, description: "Volume confirmed by proration; 0 while SUBMITTED or when CUT" }
      - { name: cut_mmbtu, type: integer, source: computed, description: "nominated_mmbtu - confirmed_mmbtu" }
      - { name: status, type: enum, source: system, description: "Nomination lifecycle", constraints: "one of {SUBMITTED, CONFIRMED, CUT, RECONCILED}" }

  - name: CargoCancellation
    parent: CargoSlot
    common_fields: true
    fields:
      - { name: cargo_slot_id, type: string, source: input, description: "FK -> CargoSlot.id; the cancelled cargo" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock timestamp of registration" }
      - { name: notice_days_provided, type: integer, source: computed, description: "floor((window_start - cancelled_at) / 24h); must be >= SPA cancellation_notice_days" }
      - { name: fixed_fee_due_usd, type: number, source: computed, description: "quantity_mmbtu * fixed fee; 2dp half-up" }
      - { name: resale_credit_usd, type: number, source: computed, description: "Capped resale credit per cancellation_settlement; 0 until settle" }
      - { name: net_due_usd, type: number, source: computed, description: "fixed_fee_due_usd - resale_credit_usd; set at settle" }
      - { name: status, type: enum, source: system, description: "REGISTERED until economics are settled", constraints: "one of {REGISTERED, SETTLED}" }

  - name: FeedGasResale
    parent: CargoCancellation
    common_fields: true
    fields:
      - { name: cargo_cancellation_id, type: string, source: input, description: "FK -> CargoCancellation.id; cancellation whose feed gas is resold" }
      - { name: offered_volume_mmbtu, type: integer, source: input, description: "Volume offered for resale; > 0 and <= cancelled slot scheduled_feed_gas_mmbtu minus volume already offered on non-UNSOLD resales" }
      - { name: status, type: enum, source: system, description: "OFFERED until sold; auto-UNSOLD at settle if still OFFERED", constraints: "one of {OFFERED, SOLD, UNSOLD}" }
      - { name: sale_price_usd_per_mmbtu, type: number, source: input, description: "Achieved sale price; set at sell; null while OFFERED" }
      - { name: gross_proceeds_usd, type: number, source: computed, description: "offered_volume_mmbtu * sale_price_usd_per_mmbtu at sell; 2dp half-up" }

  - name: MaintenanceTurnaround
    parent: LiquefactionTrain
    common_fields: true
    fields:
      - { name: train_id, type: string, source: input, description: "FK -> LiquefactionTrain.id; train taken out of service" }
      - { name: planned_start_date, type: string, source: input, description: "First day out of service (YYYY-MM-DD, inclusive)" }
      - { name: planned_end_date, type: string, source: input, description: "Last day out of service (YYYY-MM-DD, inclusive; closed interval); >= planned_start_date" }
      - { name: status, type: enum, source: system, description: "Turnaround lifecycle", constraints: "one of {PROPOSED, APPROVED, IN_PROGRESS, COMPLETED, CANCELLED}" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposing TerminalOperator" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving TerminalOperator; must differ from proposed_by_user_id (segregation of duties)" }
      - { name: lost_production_mmbtu, type: integer, source: computed, description: "(end - start + 1) days * train.daily_capacity_mmbtu; set at approve" }
      - { name: shifted_cargo_slot_count, type: integer, source: computed, description: "Number of cargo slots shifted when the turnaround began; set at begin" }

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: SalesPurchaseAgreement
    initial_state: EXECUTED
    terminal_states: [EXPIRED]
    transitions:
      - from: EXECUTED
        to: DELIVERIES_COMMENCED
        trigger: "POST /api/spas/{id}/commence-deliveries"
        actor: CommercialManager
        preconditions:
          - "spa.status == EXECUTED"
          - "at least one LiquefactionTrain has status == COMMERCIAL_OPERATION"
        side_effects:
          - "increments SalesPurchaseAgreement.version by 1"
      - from: DELIVERIES_COMMENCED
        to: EXPIRED
        trigger: "system: logical clock passes (contract_year_start + term_years)-01-01T00:00:00Z; applied lazily on any read or write of the SPA"
        actor: system
        preconditions:
          - "current logical UTC >= first instant after the last contract year"
        side_effects:
          - "increments SalesPurchaseAgreement.version by 1"

  - entity: LiquefactionTrain
    initial_state: CONSTRUCTION
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: CONSTRUCTION
        to: COMMISSIONING
        trigger: "POST /api/trains/{id}/begin-commissioning"
        actor: TerminalOperator
        preconditions:
          - "train.status == CONSTRUCTION"
        side_effects:
          - "increments LiquefactionTrain.version by 1"
      - from: COMMISSIONING
        to: COMMISSIONING
        trigger: "POST /api/trains/{id}/record-commissioning-cargo (self-transition recording one testing cargo)"
        actor: TerminalOperator
        preconditions:
          - "train.status == COMMISSIONING"
        side_effects:
          - "commissioning_cargoes_completed += 1"
          - "increments LiquefactionTrain.version by 1"
      - from: COMMISSIONING
        to: COMMERCIAL_OPERATION
        trigger: "POST /api/trains/{id}/declare-cod"
        actor: TerminalOperator
        preconditions:
          - "train.status == COMMISSIONING"
          - "commissioning_cargoes_completed >= commissioning_cargoes_required"
          - "performance_test_passed == true"
        side_effects:
          - "sets cod_date"
          - "increments LiquefactionTrain.version by 1"
      - from: COMMERCIAL_OPERATION
        to: TURNAROUND
        trigger: "POST /api/turnarounds/{id}/begin on an APPROVED turnaround of this train"
        actor: TerminalOperator
        preconditions:
          - "turnaround.status == APPROVED"
          - "current logical UTC date >= turnaround.planned_start_date"
          - "train.status == COMMERCIAL_OPERATION"
        side_effects:
          - "turnaround.status -> IN_PROGRESS"
          - "every CargoSlot whose [window_start, window_end) intersects the turnaround closed interval and whose lift_status in {SCHEDULED, VESSEL_NOMINATED} is shifted: window_start and window_end advance by the turnaround length in days; lift_status -> RESCHEDULED; that shift itself triggers a recompute of the owning AnnualDeliveryProgram.scheduled_quantity_mmbtu / unallocated_quantity_mmbtu and increments the ADP version by 1"
          - "every Berth with status IN_PROGRESS-blocking rule: all Berths -> OUT_OF_SERVICE while any turnaround is IN_PROGRESS"
          - "every Pipeline -> OUTAGE while any turnaround is IN_PROGRESS"
          - "turnaround.shifted_cargo_slot_count set"
          - "increments LiquefactionTrain.version by 1"
      - from: TURNAROUND
        to: COMMERCIAL_OPERATION
        trigger: "POST /api/turnarounds/{id}/complete on the IN_PROGRESS turnaround of this train"
        actor: TerminalOperator
        preconditions:
          - "turnaround.status == IN_PROGRESS"
          - "train.status == TURNAROUND"
        side_effects:
          - "turnaround.status -> COMPLETED"
          - "when no turnaround remains IN_PROGRESS: all Berths -> IN_SERVICE and all Pipelines -> IN_SERVICE"
          - "increments LiquefactionTrain.version by 1"

  - entity: AnnualDeliveryProgram
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/adps/{id}/propose"
        actor: CommercialManager
        preconditions:
          - "adp.status == DRAFT"
          - "adp has at least one CargoSlot"
        side_effects:
          - "increments AnnualDeliveryProgram.version by 1"
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /api/adps/{id}/confirm"
        actor: CustomerRep
        preconditions:
          - "adp.status == PROPOSED"
          - "acting CustomerRep's X-User-ID equals the owning SPA's customer_id"
          - "sum of CargoSlot quantity_mmbtu <= SPA annual_contract_quantity_mmbtu"
        side_effects:
          - "increments AnnualDeliveryProgram.version by 1"
      - from: CONFIRMED
        to: LOCKED
        trigger: "POST /api/adps/{id}/lock"
        actor: CommercialManager
        preconditions:
          - "adp.status == CONFIRMED"
        side_effects:
          - "increments AnnualDeliveryProgram.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /api/adps creating revision_no n+1 for the same (spa_id, contract_year)"
        actor: CommercialManager
        preconditions:
          - "prior revision exists in any state"
        side_effects:
          - "prior revision status -> SUPERSEDED; its non-CANCELLED CargoSlots are re-parented to the new revision (their adp_id changes), which triggers scheduled_quantity_mmbtu recompute on both revisions"
          - "increments AnnualDeliveryProgram.version by 1 on both revisions"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /api/adps creating revision_no n+1 for the same (spa_id, contract_year)"
        actor: CommercialManager
        preconditions:
          - "prior revision exists in any state"
        side_effects:
          - "prior revision status -> SUPERSEDED; non-CANCELLED CargoSlots re-parented to the new revision; quantities recomputed on both revisions"
          - "increments AnnualDeliveryProgram.version by 1 on both revisions"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "POST /api/adps creating revision_no n+1 for the same (spa_id, contract_year)"
        actor: CommercialManager
        preconditions:
          - "prior revision exists in any state"
        side_effects:
          - "prior revision status -> SUPERSEDED; non-CANCELLED CargoSlots re-parented to the new revision; quantities recomputed on both revisions"
          - "increments AnnualDeliveryProgram.version by 1 on both revisions"
      - from: LOCKED
        to: LOCKED
        trigger: "POST /api/adps/{id}/reconcile (self-transition computing annual reconciliation)"
        actor: CommercialManager
        preconditions:
          - "adp.status == LOCKED"
          - "current logical UTC > (contract_year + 1)-01-01T00:00:00Z"
        side_effects:
          - "sets delivered_equivalent_mmbtu, shortfall_mmbtu, deficiency_amount_usd per adp_annual_reconciliation"
          - "increments AnnualDeliveryProgram.version by 1"

  - entity: CargoSlot
    initial_state: SCHEDULED
    terminal_states: [LOADED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: VESSEL_NOMINATED
        trigger: "POST /api/cargo-slots/{id}/vessel-nominations"
        actor: CustomerRep
        preconditions:
          - "slot.lift_status == SCHEDULED or (slot.lift_status == VESSEL_NOMINATED and its current VesselCall is still NOMINATED, in which case the prior call -> SUPERSEDED)"
          - "owning ADP status in {CONFIRMED, LOCKED}"
          - "acting CustomerRep's X-User-ID equals the owning SPA's customer_id"
          - "expected_cargo_slot_version equals slot.version (OCC)"
        side_effects:
          - "creates VesselCall in NOMINATED linked to this slot"
          - "prior NOMINATED VesselCall (if any) -> SUPERSEDED"
          - "increments CargoSlot.version by 1"
      - from: VESSEL_NOMINATED
        to: BERTH_ASSIGNED
        trigger: "POST /api/vessel-calls/{id}/accept on this slot's NOMINATED call"
        actor: MarineScheduler
        preconditions:
          - "vessel call accept preconditions pass"
        side_effects:
          - "increments CargoSlot.version by 1"
      - from: BERTH_ASSIGNED
        to: LOADED
        trigger: "POST /api/vessel-calls/{id}/depart on this slot's call"
        actor: MarineScheduler
        preconditions:
          - "vessel call depart preconditions pass"
        side_effects:
          - "computes provisional_invoice_usd per cargo_invoice_amount (provisional variant); billing_status UNBILLED -> PROVISIONALLY_INVOICED"
          - "increments CargoSlot.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/cargo-slots/{id}/cancellations"
        actor: CustomerRep
        preconditions:
          - "slot.lift_status in {SCHEDULED, VESSEL_NOMINATED, BERTH_ASSIGNED}"
          - "notice_days_provided >= SPA cancellation_notice_days"
          - "acting CustomerRep's X-User-ID equals the owning SPA's customer_id"
        side_effects:
          - "creates CargoCancellation in REGISTERED with fixed_fee_due_usd computed"
          - "every FeedGasNomination of this slot in {SUBMITTED, CONFIRMED} -> CUT with confirmed_mmbtu 0 and cut_mmbtu = nominated_mmbtu; each such cut itself triggers recompute of its PipelineDaySchedule totals and a re-run of prorata_nomination_scaling over the schedule's remaining non-CUT nominations"
          - "owning ADP scheduled_quantity_mmbtu, cancelled_quantity_mmbtu, unallocated_quantity_mmbtu recomputed"
          - "increments CargoSlot.version by 1"
      - from: VESSEL_NOMINATED
        to: CANCELLED
        trigger: "POST /api/cargo-slots/{id}/cancellations"
        actor: CustomerRep
        preconditions:
          - "same as SCHEDULED -> CANCELLED"
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED; the slot's NOMINATED VesselCall -> SUPERSEDED"
      - from: BERTH_ASSIGNED
        to: CANCELLED
        trigger: "POST /api/cargo-slots/{id}/cancellations"
        actor: CustomerRep
        preconditions:
          - "same as SCHEDULED -> CANCELLED"
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED; the slot's ACCEPTED VesselCall is left DEPARTED-unreachable and -> SUPERSEDED, freeing its berth window"
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "system: applied immediately after the turnaround-begin shift completes (window has moved to a non-conflicting position)"
        actor: system
        preconditions:
          - "slot.lift_status == RESCHEDULED set by turnaround cascade"
        side_effects:
          - "increments CargoSlot.version by 1"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "system: turnaround-begin cascade on an overlapping train"
        actor: system
        preconditions:
          - "slot window intersects the turnaround closed interval"
        side_effects:
          - "window shifted by turnaround length; owning ADP quantities recomputed (see LiquefactionTrain COMMERCIAL_OPERATION -> TURNAROUND)"
      - from: VESSEL_NOMINATED
        to: RESCHEDULED
        trigger: "system: turnaround-begin cascade on an overlapping train"
        actor: system
        preconditions:
          - "slot window intersects the turnaround closed interval"
        side_effects:
          - "window shifted by turnaround length; owning ADP quantities recomputed"
      - from: LOADED
        to: LOADED
        trigger: "POST /api/cargo-slots/{id}/issue-final-invoice (billing dimension only: billing_status PROVISIONALLY_INVOICED -> FINAL_INVOICED; lift_status unchanged)"
        actor: CommercialManager
        preconditions:
          - "slot.lift_status == LOADED"
          - "slot.billing_status == PROVISIONALLY_INVOICED"
        side_effects:
          - "computes final_invoice_usd per cargo_invoice_amount (final variant)"
          - "increments CargoSlot.version by 1"

  - entity: VesselCall
    initial_state: NOMINATED
    terminal_states: [DEPARTED, SUPERSEDED]
    transitions:
      - from: NOMINATED
        to: ACCEPTED
        trigger: "POST /api/vessel-calls/{id}/accept"
        actor: MarineScheduler
        preconditions:
          - "call.status == NOMINATED"
          - "berth exists and berth.status == IN_SERVICE"
          - "vessel_loa_m <= berth.max_loa_m and vessel_dwt_t <= berth.max_dwt_t"
          - "assigned [window_start, window_end) lies within the cargo slot's flexibility window"
          - "no berth-window conflict per berth_window_overlap (half-open windows with BERTH_CHANGEOVER_BUFFER_HOURS)"
        side_effects:
          - "sets berth_id, window_start, window_end"
          - "cargo slot lift_status VESSEL_NOMINATED -> BERTH_ASSIGNED"
          - "increments VesselCall.version by 1"
      - from: ACCEPTED
        to: NOR_TENDERED
        trigger: "POST /api/vessel-calls/{id}/tender-nor"
        actor: CustomerRep
        preconditions:
          - "call.status == ACCEPTED"
          - "acting CustomerRep's X-User-ID equals the owning SPA's customer_id"
        side_effects:
          - "sets nor_tendered_at to current logical UTC"
          - "increments VesselCall.version by 1"
      - from: NOR_TENDERED
        to: BERTHED
        trigger: "POST /api/vessel-calls/{id}/berth"
        actor: MarineScheduler
        preconditions:
          - "call.status == NOR_TENDERED"
        side_effects:
          - "sets berthed_at to current logical UTC"
          - "increments VesselCall.version by 1"
      - from: BERTHED
        to: DEPARTED
        trigger: "POST /api/vessel-calls/{id}/depart"
        actor: MarineScheduler
        preconditions:
          - "call.status == BERTHED"
        side_effects:
          - "sets departed_at to current logical UTC"
          - "cargo slot lift_status BERTH_ASSIGNED -> LOADED; slot provisional invoice computed (see CargoSlot BERTH_ASSIGNED -> LOADED)"
          - "increments VesselCall.version by 1"
      - from: NOMINATED
        to: SUPERSEDED
        trigger: "POST /api/cargo-slots/{id}/vessel-nominations replacing this call, or cancellation of the cargo slot"
        actor: system
        preconditions:
          - "call.status == NOMINATED"
        side_effects:
          - "increments VesselCall.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "cancellation of the cargo slot"
        actor: system
        preconditions:
          - "call.status == ACCEPTED"
        side_effects:
          - "berth window freed"
          - "increments VesselCall.version by 1"

  - entity: LaytimeStatement
    initial_state: SUBMITTED
    terminal_states: [AGREED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: AGREED
        trigger: "POST /api/laytime-statements/{id}/agree"
        actor: CustomerRep
        preconditions:
          - "statement.status == SUBMITTED"
          - "acting CustomerRep's X-User-ID equals the owning SPA's customer_id"
        side_effects:
          - "increments LaytimeStatement.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /api/laytime-statements/{id}/dispute"
        actor: CustomerRep
        preconditions:
          - "statement.status == SUBMITTED"
          - "acting CustomerRep's X-User-ID equals the owning SPA's customer_id"
        side_effects:
          - "increments LaytimeStatement.version by 1"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /api/laytime-statements/{id}/resolve"
        actor: CommercialManager
        preconditions:
          - "statement.status == DISPUTED"
        side_effects:
          - "sets adjusted_demurrage_usd (may differ from billed_demurrage_usd)"
          - "increments LaytimeStatement.version by 1"

  - entity: PipelineDaySchedule
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/pipeline-day-schedules/{id}/close"
        actor: GasScheduler
        preconditions:
          - "schedule.status == OPEN"
        side_effects:
          - "runs prorata_nomination_scaling over the schedule's SUBMITTED nominations: each -> CONFIRMED (with confirmed_mmbtu) or CUT (confirmed 0, cut = nominated) when confirmed_mmbtu == 0"
          - "recomputes total_nominated_mmbtu, total_confirmed_mmbtu, total_cut_mmbtu"
          - "increments PipelineDaySchedule.version by 1"

  - entity: FeedGasNomination
    initial_state: SUBMITTED
    terminal_states: [RECONCILED, CUT]
    transitions:
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "system: pipeline-day-schedule close proration allocates confirmed_mmbtu > 0"
        actor: system
        preconditions:
          - "nomination.status == SUBMITTED"
        side_effects:
          - "sets confirmed_mmbtu and cut_mmbtu"
          - "increments FeedGasNomination.version by 1"
      - from: SUBMITTED
        to: CUT
        trigger: "system: proration allocates 0, or the linked cargo slot is cancelled"
        actor: system
        preconditions:
          - "nomination.status in {SUBMITTED, CONFIRMED}"
        side_effects:
          - "confirmed_mmbtu -> 0; cut_mmbtu -> nominated_mmbtu"
          - "triggers schedule totals recompute and re-proration of remaining non-CUT nominations (see CargoSlot cancellation cascade)"
          - "increments FeedGasNomination.version by 1"
      - from: CONFIRMED
        to: CUT
        trigger: "system: linked cargo slot cancelled"
        actor: system
        preconditions:
          - "nomination.status == CONFIRMED"
        side_effects:
          - "same as SUBMITTED -> CUT"
      - from: CONFIRMED
        to: RECONCILED
        trigger: "POST /api/feed-gas-nominations/{id}/reconcile"
        actor: GasScheduler
        preconditions:
          - "nomination.status == CONFIRMED"
          - "nomination's pipeline day schedule status == CLOSED"
        side_effects:
          - "increments FeedGasNomination.version by 1"

  - entity: CargoCancellation
    initial_state: REGISTERED
    terminal_states: [SETTLED]
    transitions:
      - from: REGISTERED
        to: SETTLED
        trigger: "POST /api/cargo-cancellations/{id}/settle"
        actor: CommercialManager
        preconditions:
          - "cancellation.status == REGISTERED"
          - "no FeedGasResale of this cancellation is in OFFERED with a pending clock: all resales must be SOLD or are auto-flipped to UNSOLD by this transition"
        side_effects:
          - "any OFFERED FeedGasResale -> UNSOLD"
          - "computes resale_credit_usd and net_due_usd per cancellation_settlement"
          - "cancelled slot billing_status UNBILLED -> FINAL_INVOICED (fixed fee is the final bill for a cancelled cargo)"
          - "increments CargoCancellation.version by 1"

  - entity: FeedGasResale
    initial_state: OFFERED
    terminal_states: [SOLD, UNSOLD]
    transitions:
      - from: OFFERED
        to: SOLD
        trigger: "POST /api/feed-gas-resales/{id}/sell"
        actor: GasScheduler
        preconditions:
          - "resale.status == OFFERED"
          - "parent cancellation status == REGISTERED"
        side_effects:
          - "computes gross_proceeds_usd"
          - "increments FeedGasResale.version by 1"
      - from: OFFERED
        to: UNSOLD
        trigger: "system: parent cancellation settles while this resale is OFFERED"
        actor: system
        preconditions:
          - "resale.status == OFFERED"
        side_effects:
          - "increments FeedGasResale.version by 1"

  - entity: MaintenanceTurnaround
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/turnarounds/{id}/approve"
        actor: TerminalOperator
        preconditions:
          - "turnaround.status == PROPOSED"
          - "approver X-User-ID != turnaround.proposed_by_user_id (segregation of duties)"
          - "no overlap per turnaround_overlap (closed interval) with any non-CANCELLED turnaround of the same train"
        side_effects:
          - "sets approved_by_user_id"
          - "computes lost_production_mmbtu"
          - "increments MaintenanceTurnaround.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /api/turnarounds/{id}/begin"
        actor: TerminalOperator
        preconditions:
          - "turnaround.status == APPROVED"
          - "current logical UTC date >= planned_start_date"
          - "train.status == COMMERCIAL_OPERATION"
        side_effects:
          - "train COMMERCIAL_OPERATION -> TURNAROUND cascade (see LiquefactionTrain)"
          - "increments MaintenanceTurnaround.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/turnarounds/{id}/complete"
        actor: TerminalOperator
        preconditions:
          - "turnaround.status == IN_PROGRESS"
        side_effects:
          - "train TURNAROUND -> COMMERCIAL_OPERATION cascade (see LiquefactionTrain)"
          - "increments MaintenanceTurnaround.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: vessel-nomination-stale-slot
    parent_entity: CargoSlot
    write_endpoint: "POST /api/cargo-slots/{id}/vessel-nominations"
    occ_field: expected_cargo_slot_version
    description: |
      Creating a VesselCall nomination against a CargoSlot whose version has
      advanced since the client last observed it is rejected with 412. The new
      nomination legitimately supersedes a prior NOMINATED call, so a second
      nomination carrying a stale expected_cargo_slot_version must fail rather
      than supersede a call the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: adp-revision-stale-spa
    parent_entity: SalesPurchaseAgreement
    write_endpoint: "POST /api/adps"
    occ_field: expected_spa_version
    description: |
      Creating a new AnnualDeliveryProgram revision against an SPA whose
      version has advanced since the client last observed it is rejected with
      412. A new revision supersedes the prior revision for the same
      (spa, contract_year), so a stale expected_spa_version must fail rather
      than silently supersede state the client never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: cargo_invoice_amount
    trigger: "provisional variant: VesselCall DEPARTED transition (slot -> LOADED); final variant: POST /api/cargo-slots/{id}/issue-final-invoice"
    algorithm: tiered_pricing
    formula: |
      invoice_usd = round_half_up(quantity_mmbtu * (fixed_liquefaction_fee_usd_per_mmbtu + commodity_multiplier * index_price), 2)
      provisional variant: index_price = spa.estimated_index_price_usd_per_mmbtu
      final variant:       index_price = actual_index_price_usd_per_mmbtu supplied at issue-final-invoice
    input_set: "the single CargoSlot being invoiced; its owning SPA supplies fee, multiplier and index inputs"
    constants:
      ROUNDING: "round_half_up to 2 decimal places"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "vessel departure (slot becomes LOADED)"
        difference: "uses the SPA's estimated index price; billing_status -> PROVISIONALLY_INVOICED"
      - name: final
        when: "issue-final-invoice with the settled actual index price"
        difference: "uses actual_index_price_usd_per_mmbtu; billing_status -> FINAL_INVOICED; for identical quantity the two variants differ whenever estimated != actual index price"

  - name: laytime_demurrage
    trigger: "POST /api/vessel-calls/{id}/laytime-statements (statement creation on a DEPARTED call)"
    algorithm: threshold
    formula: |
      laytime_start_at = min(nor_tendered_at + NOR_GRACE_HOURS, berthed_at)
      allowed_laytime_hours = ceil(quantity_mmbtu / LOADING_RATE_MMBTU_PER_HOUR) + BERTH_ALLOWANCE_HOURS
      elapsed_hours = round_half_up((departed_at - laytime_start_at) in seconds / 3600, 2)
      # variant A (statement-of-facts basis):
      #   rounding order is PINNED: round each excluded period to whole minutes
      #   FIRST, sum the rounded periods, THEN subtract from elapsed_hours.
      #   (Summing raw seconds then rounding gives a different cent result.)
      excluded_hours = round_half_up(sum over excluded_periods of round_to_whole_minutes(end - start)) / 60, 2)
      used_laytime_hours_sof = round_half_up(elapsed_hours - excluded_hours, 2)
      demurrage_amount_sof_usd = round_half_up(max(0, used_laytime_hours_sof - allowed_laytime_hours) / 24 * demurrage_rate_usd_per_day, 2)
      # variant B (pump-log basis):
      used_laytime_hours_pumplog = round_half_up(pump_hours + CONNECTION_ALLOWANCE_HOURS, 2)
      demurrage_amount_pumplog_usd = round_half_up(max(0, used_laytime_hours_pumplog - allowed_laytime_hours) / 24 * demurrage_rate_usd_per_day, 2)
      billed_demurrage_usd = variant selected by billing_basis
      # Demurrage accrues only when used > allowed (strictly greater); at used == allowed the amount is exactly 0.
    input_set: "the DEPARTED VesselCall, its CargoSlot quantity, and the statement's excluded_periods / pump_hours"
    constants:
      LOADING_RATE_MMBTU_PER_HOUR: 240000
      BERTH_ALLOWANCE_HOURS: 4
      NOR_GRACE_HOURS: 6
      CONNECTION_ALLOWANCE_HOURS: 2
    precision: "hours at 2dp round_half_up; money at 2dp round_half_up"
    variants:
      - name: sof_basis
        when: "billing_basis == SOF_BASIS"
        difference: "used laytime = elapsed minus excluded periods; terminal-fault time does not count"
      - name: pump_log_basis
        when: "billing_basis == PUMP_LOG_BASIS"
        difference: "used laytime = vessel pump hours plus a fixed connection allowance; for identical calls the two variants differ whenever pump_hours + 2 != elapsed - excluded"

  - name: prorata_nomination_scaling
    trigger: "POST /api/pipeline-day-schedules/{id}/close, and re-run on any cancellation-triggered cut within a CLOSED schedule"
    algorithm: waterfall_allocation
    formula: |
      if total_nominated_mmbtu <= capacity_mmbtu:
        every nomination: confirmed = nominated, cut = 0, status CONFIRMED
      else:
        factor = capacity_mmbtu / total_nominated_mmbtu
        per nomination, base = min(nominated, max(min(nominated, FLOOR_MIN_MMBTU), floor(nominated * factor)))
        remainder = capacity_mmbtu - sum(base)
        distribute remainder one mmbtu at a time by largest fractional part of (nominated * factor);
        ties on fractional part break by nomination created_at ASC (earliest first);
        no nomination may receive more than its nominated volume
      cut_mmbtu = nominated_mmbtu - confirmed_mmbtu
      nominations with confirmed == 0 become CUT; otherwise CONFIRMED
      # Invariant: sum(confirmed) + sum(cut) == sum(nominated) always.
    input_set: "all non-CUT FeedGasNominations of the schedule being closed or re-prorated"
    constants:
      FLOOR_MIN_MMBTU: 5000
    precision: "integer mmbtu; floor for base allocation; largest-remainder for the residual"

  - name: cancellation_settlement
    trigger: "POST /api/cargo-cancellations/{id}/settle"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED (the dependency is circular-looking:
      # the handling fee is a percentage of the amount due, but it is computed
      # on the GROSS due, never on the net):
      (1) fixed_fee_due_usd   = round_half_up(quantity_mmbtu * fixed_liquefaction_fee_usd_per_mmbtu, 2)   # at registration
      (2) gross_proceeds      = sum of gross_proceeds_usd over SOLD FeedGasResales
      (3) handling_fee        = round_half_up(HANDLING_FEE_PCT * fixed_fee_due_usd, 2)                    # on gross, breaking the circle
      (4) pipeline_tariff     = round_half_up(PIPELINE_TARIFF_USD_PER_MMBTU * sum of offered_volume_mmbtu over SOLD resales, 2)
      (5) resale_credit_usd   = min(fixed_fee_due_usd, max(0, gross_proceeds - handling_fee - pipeline_tariff))
      (6) net_due_usd         = round_half_up(fixed_fee_due_usd - resale_credit_usd, 2)
    input_set: "the CargoCancellation, its slot quantity, its SPA fee terms, and all SOLD FeedGasResales of the cancellation"
    constants:
      HANDLING_FEE_PCT: 0.02
      PIPELINE_TARIFF_USD_PER_MMBTU: 0.35
    precision: "2 decimal places, round_half_up, applied at each numbered step in order"

  - name: feed_gas_requirement
    trigger: "CargoSlot creation"
    algorithm: aggregation
    formula: |
      scheduled_feed_gas_mmbtu = ceil(quantity_mmbtu * FEED_GAS_RATIO)
    input_set: "the created CargoSlot"
    constants:
      FEED_GAS_RATIO: 1.10
    precision: "integer mmbtu, round up (ceil)"

  - name: adp_annual_reconciliation
    trigger: "POST /api/adps/{id}/reconcile"
    algorithm: threshold
    formula: |
      delivered_equivalent_mmbtu = sum(quantity_mmbtu over slots with lift_status == LOADED)
                                 + sum(quantity_mmbtu over slots with lift_status == CANCELLED)
      lower_bound = ACQ * (1 - tolerance_pct)
      shortfall_mmbtu = max(0, floor(lower_bound) - delivered_equivalent_mmbtu)
      # boundary: delivered_equivalent == floor(lower_bound) yields shortfall 0 (no deficiency; the bound is inclusive)
      deficiency_amount_usd = round_half_up(shortfall_mmbtu * (fixed_liquefaction_fee_usd_per_mmbtu + commodity_multiplier * reference_index_price_usd_per_mmbtu), 2)
    input_set: "all CargoSlots of the LOCKED ADP; reference_index_price_usd_per_mmbtu supplied at reconcile"
    constants: {}
    precision: "integer mmbtu for quantities; 2dp round_half_up for money"

  - name: turnaround_production_impact
    trigger: "MaintenanceTurnaround approve (lost production) and begin (slot shift)"
    algorithm: interval_merge
    formula: |
      turnaround_length_days = (planned_end_date - planned_start_date) + 1   # closed interval, both days inclusive
      lost_production_mmbtu = turnaround_length_days * train.daily_capacity_mmbtu
      overlapping slots = CargoSlots (of any ADP) with lift_status in {SCHEDULED, VESSEL_NOMINATED}
        whose [window_start, window_end) intersects [planned_start_date, planned_end_date] closed interval
        (intersection test: window_start < end_date + 1 day AND window_end > start_date)
      each overlapping slot: window_start += turnaround_length_days; window_end += turnaround_length_days
    input_set: "the turnaround's train and every non-terminal CargoSlot terminal-wide"
    constants: {}
    precision: "integer days and mmbtu"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is listed for the endpoint; for CustomerRep endpoints, X-User-ID must equal the owning SPA's customer_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id exists, validated left-to-right; body FK references (customer_id, spa_id, berth_id, cargo_slot_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "target resource is in a state from which the requested transition is defined (per-entity ERR_*_INVALID_STATE / ERR_LAYTIME_PREMATURE / ERR_SCHEDULE_CLOSED variants)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 5
    category: business_safety
    check: "vessel-berth physical compatibility: vessel_loa_m <= berth.max_loa_m and vessel_dwt_t <= berth.max_dwt_t"
    error_id: ERR_VESSEL_BERTH_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /api/vessel-calls/{id}/accept"
  - priority: 6
    category: business_temporal
    check: "berth window free per berth_window_overlap (half-open, with BERTH_CHANGEOVER_BUFFER_HOURS changeover buffer against other ACCEPTED-or-later calls on the same berth)"
    error_id: ERR_BERTH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/vessel-calls/{id}/accept"
  - priority: 7
    category: business_temporal
    check: "new turnaround closed interval must not intersect any non-CANCELLED turnaround of the same train (touching end/start dates count as overlap)"
    error_id: ERR_TURNAROUND_OVERLAP
    http_status: 409
    applies_to: "POST /api/trains/{id}/turnarounds, POST /api/turnarounds/{id}/approve"
  - priority: 8
    category: business_temporal
    check: "cancellation notice: floor((slot.window_start - now)/24h) >= spa.cancellation_notice_days"
    error_id: ERR_INSUFFICIENT_NOTICE
    http_status: 422
    applies_to: "POST /api/cargo-slots/{id}/cancellations"
  - priority: 9
    category: business_constraint
    check: "window_start < window_end and the slot window lies within the ADP contract year [year-01-01, (year+1)-01-01)"
    error_id: ERR_SLOT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /api/adps/{id}/cargo-slots"
  - priority: 10
    category: business_constraint
    check: "segregation of duties: turnaround approver X-User-ID must differ from proposed_by_user_id"
    error_id: ERR_TURNAROUND_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/turnarounds/{id}/approve"
  - priority: 11
    category: business_constraint
    check: "COD gating: commissioning_cargoes_completed >= commissioning_cargoes_required and performance_test_passed true"
    error_id: ERR_COMMISSIONING_INCOMPLETE
    http_status: 422
    applies_to: "POST /api/trains/{id}/declare-cod"
  - priority: 12
    category: business_constraint
    check: "schedule capacity_mmbtu <= pipeline.daily_capacity_mmbtu and gas_day unique per pipeline"
    error_id: ERR_SCHEDULE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/pipelines/{id}/day-schedules"
  - priority: 13
    category: business_constraint
    check: "nominated_mmbtu > 0 and <= linked cargo slot's scheduled_feed_gas_mmbtu"
    error_id: ERR_NOMINATION_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /api/pipeline-day-schedules/{id}/nominations"
  - priority: 14
    category: business_constraint
    check: "offered_volume_mmbtu > 0 and cumulative offered volume over non-UNSOLD resales <= cancelled slot's scheduled_feed_gas_mmbtu"
    error_id: ERR_RESALE_VOLUME_EXCEEDED
    http_status: 422
    applies_to: "POST /api/cargo-cancellations/{id}/resales"
  - priority: 15
    category: business_referential
    check: "SPA commence requires at least one train in COMMERCIAL_OPERATION"
    error_id: ERR_NO_COMMERCIAL_TRAIN
    http_status: 422
    applies_to: "POST /api/spas/{id}/commence-deliveries"
  - priority: 16
    category: business_referential
    check: "nomination requires its pipeline IN_SERVICE"
    error_id: ERR_PIPELINE_NOT_SERVICEABLE
    http_status: 422
    applies_to: "POST /api/pipeline-day-schedules/{id}/nominations"
  - priority: 17
    category: business_referential
    check: "berth referenced at accept has status IN_SERVICE"
    error_id: ERR_BERTH_NOT_SERVICEABLE
    http_status: 422
    applies_to: "POST /api/vessel-calls/{id}/accept"
  - priority: 18
    category: business_referential
    check: "ADP reconcile requires status LOCKED and logical clock past contract year end"
    error_id: ERR_RECONCILE_PREMATURE
    http_status: 422
    applies_to: "POST /api/adps/{id}/reconcile"
  - priority: 19
    category: business_fiscal
    check: "ADP confirm: sum of slot quantity_mmbtu <= SPA annual_contract_quantity_mmbtu"
    error_id: ERR_ACQ_EXCEEDED
    http_status: 422
    applies_to: "POST /api/adps/{id}/confirm"
  - priority: 20
    category: business_constraint
    check: "request body schema: required fields present, types valid, enums in range, numbers positive where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- customers / SPAs ----
  - method: POST
    path: /api/customers
    description: "Register a buyer"
    roles: [TerminalOperator]
    code: 201
    input: [legal_name, credit_rating, "billing_currency?"]
    output: Customer
    side_effects: []
  - method: GET
    path: /api/customers/{id}
    description: "Fetch one customer"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: /api/customers/{id}/spas
    description: "List SPAs of a customer (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: SalesPurchaseAgreement[]
    side_effects: []
  - method: POST
    path: /api/spas
    description: "Execute a long-term sale and purchase agreement (created in EXECUTED)"
    roles: [CommercialManager]
    code: 201
    input: [customer_id, contract_year_start, term_years, annual_contract_quantity_mmbtu, fixed_liquefaction_fee_usd_per_mmbtu, commodity_multiplier, commodity_index, destination_flexibility, title_transfer_point, cancellation_notice_days, tolerance_pct, estimated_index_price_usd_per_mmbtu]
    output: SalesPurchaseAgreement
    side_effects: []
  - method: GET
    path: /api/spas/{id}
    description: "Fetch one SPA (applies lazy EXPIRED transition)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: SalesPurchaseAgreement
    side_effects: ["system EXPIRED transition when the logical clock has passed contract end"]
  - method: GET
    path: /api/spas/{id}/adps
    description: "List annual delivery programs of an SPA (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: AnnualDeliveryProgram[]
    side_effects: []
  - method: POST
    path: /api/spas/{id}/commence-deliveries
    description: "Move SPA to DELIVERIES_COMMENCED once a train is commercial"
    roles: [CommercialManager]
    code: 200
    input: []
    output: SalesPurchaseAgreement
    side_effects: ["increments SalesPurchaseAgreement.version by 1"]

  # ---- trains / turnarounds ----
  - method: POST
    path: /api/trains
    description: "Register a liquefaction train (CONSTRUCTION)"
    roles: [TerminalOperator]
    code: 201
    input: [name, design_capacity_mtpa, daily_capacity_mmbtu, commissioning_cargoes_required]
    output: LiquefactionTrain
    side_effects: []
  - method: GET
    path: /api/trains/{id}
    description: "Fetch one train"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: LiquefactionTrain
    side_effects: []
  - method: POST
    path: /api/trains/{id}/begin-commissioning
    description: "CONSTRUCTION -> COMMISSIONING (start producing testing cargoes)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: LiquefactionTrain
    side_effects: ["increments LiquefactionTrain.version by 1"]
  - method: POST
    path: /api/trains/{id}/record-commissioning-cargo
    description: "Record one completed testing cargo during commissioning"
    roles: [TerminalOperator]
    code: 200
    input: [proceeds_usd]
    output: LiquefactionTrain
    side_effects: ["commissioning_cargoes_completed += 1", "increments LiquefactionTrain.version by 1"]
  - method: POST
    path: /api/trains/{id}/declare-cod
    description: "COMMISSIONING -> COMMERCIAL_OPERATION when testing cargoes complete and performance test passed"
    roles: [TerminalOperator]
    code: 200
    input: [cod_date, performance_test_passed]
    output: LiquefactionTrain
    side_effects: ["sets cod_date", "increments LiquefactionTrain.version by 1"]
  - method: POST
    path: /api/trains/{id}/turnarounds
    description: "Propose a maintenance turnaround window (PROPOSED); proposer recorded from X-User-ID"
    roles: [TerminalOperator]
    code: 201
    input: [planned_start_date, planned_end_date]
    output: MaintenanceTurnaround
    side_effects: []
  - method: GET
    path: /api/trains/{id}/turnarounds
    description: "List turnarounds of a train (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: MaintenanceTurnaround[]
    side_effects: []
  - method: GET
    path: /api/turnarounds/{id}
    description: "Fetch one turnaround"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: MaintenanceTurnaround
    side_effects: []
  - method: POST
    path: /api/turnarounds/{id}/approve
    description: "PROPOSED -> APPROVED; approver must differ from proposer (segregation of duties)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: MaintenanceTurnaround
    side_effects: ["computes lost_production_mmbtu", "increments MaintenanceTurnaround.version by 1"]
  - method: POST
    path: /api/turnarounds/{id}/begin
    description: "APPROVED -> IN_PROGRESS; cascades train to TURNAROUND, shifts overlapping cargo slots, recomputes ADP quantities, takes berths and pipelines out of service"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: MaintenanceTurnaround
    side_effects:
      - "train COMMERCIAL_OPERATION -> TURNAROUND"
      - "overlapping CargoSlots shifted (RESCHEDULED then SCHEDULED); owning ADP quantities recomputed and ADP versions incremented"
      - "all Berths -> OUT_OF_SERVICE; all Pipelines -> OUTAGE"
      - "increments MaintenanceTurnaround.version by 1"
  - method: POST
    path: /api/turnarounds/{id}/complete
    description: "IN_PROGRESS -> COMPLETED; train returns to COMMERCIAL_OPERATION; berths and pipelines return to service when no turnaround remains IN_PROGRESS"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: MaintenanceTurnaround
    side_effects:
      - "train TURNAROUND -> COMMERCIAL_OPERATION"
      - "Berths -> IN_SERVICE; Pipelines -> IN_SERVICE"
      - "increments MaintenanceTurnaround.version by 1"

  # ---- ADPs / cargo slots ----
  - method: POST
    path: /api/adps
    description: "Create an ADP revision (DRAFT) for (spa_id, contract_year); supersedes any prior revision; OCC on SPA version"
    roles: [CommercialManager]
    code: 201
    input: [spa_id, contract_year, expected_spa_version]
    output: AnnualDeliveryProgram
    side_effects:
      - "prior revision for the same (spa, contract_year) -> SUPERSEDED; its non-CANCELLED CargoSlots re-parented to the new revision with quantity recompute on both"
      - "increments SalesPurchaseAgreement.version by 1"
  - method: GET
    path: /api/adps/{id}
    description: "Fetch one ADP"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: AnnualDeliveryProgram
    side_effects: []
  - method: POST
    path: /api/adps/{id}/propose
    description: "DRAFT -> PROPOSED (requires at least one cargo slot)"
    roles: [CommercialManager]
    code: 200
    input: []
    output: AnnualDeliveryProgram
    side_effects: ["increments AnnualDeliveryProgram.version by 1"]
  - method: POST
    path: /api/adps/{id}/confirm
    description: "PROPOSED -> CONFIRMED by the owning customer; enforces ACQ cap"
    roles: [CustomerRep]
    code: 200
    input: []
    output: AnnualDeliveryProgram
    side_effects: ["increments AnnualDeliveryProgram.version by 1"]
  - method: POST
    path: /api/adps/{id}/lock
    description: "CONFIRMED -> LOCKED"
    roles: [CommercialManager]
    code: 200
    input: []
    output: AnnualDeliveryProgram
    side_effects: ["increments AnnualDeliveryProgram.version by 1"]
  - method: POST
    path: /api/adps/{id}/reconcile
    description: "Annual reconciliation on a LOCKED ADP after contract year end; sets delivered_equivalent, shortfall, deficiency"
    roles: [CommercialManager]
    code: 200
    input: [reference_index_price_usd_per_mmbtu]
    output: AnnualDeliveryProgram
    side_effects: ["runs adp_annual_reconciliation", "increments AnnualDeliveryProgram.version by 1"]
  - method: POST
    path: /api/adps/{id}/cargo-slots
    description: "Add a cargo slot with a flexibility window to a DRAFT ADP"
    roles: [CommercialManager]
    code: 201
    input: [window_start, window_end, quantity_mmbtu]
    output: CargoSlot
    side_effects: ["computes scheduled_feed_gas_mmbtu per feed_gas_requirement", "recomputes ADP scheduled/unallocated quantities", "increments AnnualDeliveryProgram.version by 1"]
  - method: GET
    path: /api/adps/{id}/cargo-slots
    description: "List cargo slots of an ADP (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: CargoSlot[]
    side_effects: []
  - method: GET
    path: /api/cargo-slots/{id}
    description: "Fetch one cargo slot"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: CargoSlot
    side_effects: []
  - method: POST
    path: /api/cargo-slots/{id}/vessel-nominations
    description: "Nominate a vessel against a slot (creates VesselCall NOMINATED; supersedes a prior NOMINATED call); OCC on slot version"
    roles: [CustomerRep]
    code: 201
    input: [vessel_name, imo_number, vessel_loa_m, vessel_dwt_t, demurrage_rate_usd_per_day, expected_cargo_slot_version]
    output: VesselCall
    side_effects: ["slot lift_status -> VESSEL_NOMINATED", "prior NOMINATED VesselCall -> SUPERSEDED", "increments CargoSlot.version by 1"]
  - method: GET
    path: /api/cargo-slots/{id}/vessel-calls
    description: "List vessel calls of a cargo slot (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: VesselCall[]
    side_effects: []
  - method: POST
    path: /api/cargo-slots/{id}/cancellations
    description: "Customer cancels a cargo: pays the fixed fee, forgoes the cargo; cascades feed-gas nomination cuts and schedule re-proration"
    roles: [CustomerRep]
    code: 201
    input: []
    output: CargoCancellation
    side_effects:
      - "slot lift_status -> CANCELLED; CargoCancellation REGISTERED with fixed_fee_due_usd"
      - "slot's SUBMITTED/CONFIRMED nominations -> CUT; each cut re-runs prorata_nomination_scaling on its CLOSED schedule and recomputes schedule totals"
      - "slot's NOMINATED/ACCEPTED VesselCall -> SUPERSEDED (berth window freed)"
      - "ADP quantities recomputed; increments CargoSlot.version by 1"
  - method: GET
    path: /api/cargo-slots/{id}/cancellations
    description: "List cancellations of a cargo slot (paginated; 0 or 1 entries)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: CargoCancellation[]
    side_effects: []
  - method: GET
    path: /api/cargo-slots/{id}/nominations
    description: "List feed gas nominations of a cargo slot (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedGasNomination[]
    side_effects: []
  - method: POST
    path: /api/cargo-slots/{id}/issue-final-invoice
    description: "Final invoice at the settled index price; billing_status PROVISIONALLY_INVOICED -> FINAL_INVOICED"
    roles: [CommercialManager]
    code: 200
    input: [actual_index_price_usd_per_mmbtu]
    output: CargoSlot
    side_effects: ["computes final_invoice_usd per cargo_invoice_amount (final variant)", "increments CargoSlot.version by 1"]

  # ---- berths / vessel calls / laytime ----
  - method: POST
    path: /api/berths
    description: "Register a loading berth (IN_SERVICE)"
    roles: [TerminalOperator]
    code: 201
    input: [name, max_loa_m, max_dwt_t]
    output: Berth
    side_effects: []
  - method: GET
    path: /api/berths/{id}
    description: "Fetch one berth"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: Berth
    side_effects: []
  - method: GET
    path: /api/berths/{id}/vessel-calls
    description: "List vessel calls assigned to a berth (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: VesselCall[]
    side_effects: []
  - method: GET
    path: /api/vessel-calls/{id}
    description: "Fetch one vessel call"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: VesselCall
    side_effects: []
  - method: POST
    path: /api/vessel-calls/{id}/accept
    description: "Accept a nominated call, assign berth window; safety compatibility then temporal overlap checks"
    roles: [MarineScheduler]
    code: 200
    input: [berth_id, window_start, window_end]
    output: VesselCall
    side_effects: ["sets berth_id/window", "slot lift_status -> BERTH_ASSIGNED", "increments VesselCall.version by 1"]
  - method: POST
    path: /api/vessel-calls/{id}/tender-nor
    description: "Vessel tenders notice of readiness (timestamped at logical clock)"
    roles: [CustomerRep]
    code: 200
    input: []
    output: VesselCall
    side_effects: ["sets nor_tendered_at", "increments VesselCall.version by 1"]
  - method: POST
    path: /api/vessel-calls/{id}/berth
    description: "Vessel all-fast at berth; starts laytime-relevant timestamps"
    roles: [MarineScheduler]
    code: 200
    input: []
    output: VesselCall
    side_effects: ["sets berthed_at", "increments VesselCall.version by 1"]
  - method: POST
    path: /api/vessel-calls/{id}/depart
    description: "Vessel departs; slot becomes LOADED and provisional invoice is computed"
    roles: [MarineScheduler]
    code: 200
    input: []
    output: VesselCall
    side_effects: ["sets departed_at", "slot -> LOADED with provisional invoice (cargo_invoice_amount provisional)", "increments VesselCall.version by 1"]
  - method: POST
    path: /api/vessel-calls/{id}/laytime-statements
    description: "Create and submit a laytime statement for a DEPARTED call; computes both laytime variants and demurrage"
    roles: [MarineScheduler]
    code: 201
    input: [billing_basis, "excluded_periods?", "pump_hours?"]
    output: LaytimeStatement
    side_effects: ["runs laytime_demurrage (both variants; billed amount per billing_basis)"]
  - method: GET
    path: /api/vessel-calls/{id}/laytime-statements
    description: "List laytime statements of a vessel call (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: LaytimeStatement[]
    side_effects: []
  - method: GET
    path: /api/laytime-statements/{id}
    description: "Fetch one laytime statement"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: LaytimeStatement
    side_effects: []
  - method: POST
    path: /api/laytime-statements/{id}/agree
    description: "Customer accepts the statement as submitted"
    roles: [CustomerRep]
    code: 200
    input: []
    output: LaytimeStatement
    side_effects: ["increments LaytimeStatement.version by 1"]
  - method: POST
    path: /api/laytime-statements/{id}/dispute
    description: "Customer disputes the statement"
    roles: [CustomerRep]
    code: 200
    input: ["reason?"]
    output: LaytimeStatement
    side_effects: ["increments LaytimeStatement.version by 1"]
  - method: POST
    path: /api/laytime-statements/{id}/resolve
    description: "Commercial resolution of a disputed statement with an adjusted demurrage amount"
    roles: [CommercialManager]
    code: 200
    input: [adjusted_demurrage_amount_usd, "resolution_note?"]
    output: LaytimeStatement
    side_effects: ["sets adjusted_demurrage_usd", "increments LaytimeStatement.version by 1"]

  # ---- pipelines / nominations ----
  - method: POST
    path: /api/pipelines
    description: "Register a feed gas pipeline (IN_SERVICE)"
    roles: [TerminalOperator]
    code: 201
    input: [name, daily_capacity_mmbtu]
    output: Pipeline
    side_effects: []
  - method: GET
    path: /api/pipelines/{id}
    description: "Fetch one pipeline"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: Pipeline
    side_effects: []
  - method: POST
    path: /api/pipelines/{id}/day-schedules
    description: "Create an OPEN day schedule for a gas day"
    roles: [GasScheduler]
    code: 201
    input: [gas_day, capacity_mmbtu]
    output: PipelineDaySchedule
    side_effects: []
  - method: GET
    path: /api/pipelines/{id}/day-schedules
    description: "List day schedules of a pipeline (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: PipelineDaySchedule[]
    side_effects: []
  - method: GET
    path: /api/pipeline-day-schedules/{id}
    description: "Fetch one day schedule with totals"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: PipelineDaySchedule
    side_effects: []
  - method: POST
    path: /api/pipeline-day-schedules/{id}/close
    description: "Close nomination window; runs prorata_nomination_scaling and sets CONFIRMED/CUT"
    roles: [GasScheduler]
    code: 200
    input: []
    output: PipelineDaySchedule
    side_effects: ["runs prorata_nomination_scaling", "recomputes totals", "increments PipelineDaySchedule.version by 1"]
  - method: POST
    path: /api/pipeline-day-schedules/{id}/nominations
    description: "Nominate feed gas for a cargo slot against an OPEN schedule"
    roles: [GasScheduler, CustomerRep]
    code: 201
    input: [cargo_slot_id, nominated_mmbtu]
    output: FeedGasNomination
    side_effects: ["recomputes schedule total_nominated_mmbtu"]
  - method: GET
    path: /api/pipeline-day-schedules/{id}/nominations
    description: "List nominations of a day schedule (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedGasNomination[]
    side_effects: []
  - method: GET
    path: /api/feed-gas-nominations/{id}
    description: "Fetch one nomination"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: FeedGasNomination
    side_effects: []
  - method: POST
    path: /api/feed-gas-nominations/{id}/reconcile
    description: "Reconcile a CONFIRMED nomination after flow (CONFIRMED -> RECONCILED)"
    roles: [GasScheduler]
    code: 200
    input: []
    output: FeedGasNomination
    side_effects: ["increments FeedGasNomination.version by 1"]

  # ---- cancellations / resales ----
  - method: GET
    path: /api/cargo-cancellations/{id}
    description: "Fetch one cancellation"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: []
    output: CargoCancellation
    side_effects: []
  - method: POST
    path: /api/cargo-cancellations/{id}/settle
    description: "Settle cancellation economics: flips OFFERED resales to UNSOLD, computes resale credit and net due"
    roles: [CommercialManager]
    code: 200
    input: []
    output: CargoCancellation
    side_effects: ["runs cancellation_settlement", "OFFERED resales -> UNSOLD", "slot billing_status -> FINAL_INVOICED", "increments CargoCancellation.version by 1"]
  - method: POST
    path: /api/cargo-cancellations/{id}/resales
    description: "Offer part of the cancelled cargo's feed gas for resale"
    roles: [GasScheduler]
    code: 201
    input: [offered_volume_mmbtu]
    output: FeedGasResale
    side_effects: []
  - method: GET
    path: /api/cargo-cancellations/{id}/resales
    description: "List resales of a cancellation (paginated)"
    roles: [TerminalOperator, CommercialManager, GasScheduler, MarineScheduler, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedGasResale[]
    side_effects: []
  - method: POST
    path: /api/feed-gas-resales/{id}/sell
    description: "Record the achieved sale of an offered resale"
    roles: [GasScheduler]
    code: 200
    input: [sale_price_usd_per_mmbtu]
    output: FeedGasResale
    side_effects: ["computes gross_proceeds_usd", "increments FeedGasResale.version by 1"]

  # ---- logical clock (test-driving endpoint) ----
  - method: POST
    path: /api/_clock/set_current_utc
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [TerminalOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy system transitions (SPA EXPIRED) apply on subsequent reads/writes"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint, or CustomerRep X-User-ID does not match the owning SPA's customer_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body schema violation: missing required field, bad type, bad enum, non-positive quantity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_SPA_INVALID_STATE, http: 409, condition: "SPA transition requested from a state where it is undefined (e.g. commence twice, EXPIRED)" }
  - { id: ERR_NO_COMMERCIAL_TRAIN, http: 422, condition: "commence-deliveries with no train in COMMERCIAL_OPERATION" }
  - { id: ERR_TRAIN_INVALID_STATE, http: 409, condition: "Train transition from an undefined state (e.g. begin-commissioning twice, declare-cod from CONSTRUCTION)" }
  - { id: ERR_COMMISSIONING_INCOMPLETE, http: 422, condition: "declare-cod before required commissioning cargoes are complete or without performance test pass" }
  - { id: ERR_TURNAROUND_INVALID_STATE, http: 409, condition: "Turnaround transition from an undefined state (approve twice, complete before begin)" }
  - { id: ERR_TURNAROUND_SOD_VIOLATION, http: 403, condition: "Turnaround approver X-User-ID equals proposed_by_user_id" }
  - { id: ERR_TURNAROUND_OVERLAP, http: 409, condition: "Turnaround closed interval intersects a non-CANCELLED turnaround of the same train (touching dates count)" }
  - { id: ERR_ADP_INVALID_STATE, http: 409, condition: "ADP transition from an undefined state (confirm from DRAFT, propose without slots, lock from DRAFT, slots added to non-DRAFT)" }
  - { id: ERR_ACQ_EXCEEDED, http: 422, condition: "ADP confirm with slot quantity sum greater than SPA ACQ" }
  - { id: ERR_RECONCILE_PREMATURE, http: 422, condition: "reconcile on a non-LOCKED ADP or before the contract year has ended" }
  - { id: ERR_SLOT_INVALID_STATE, http: 409, condition: "Cargo-slot operation from an undefined lift/billing state (nominate on CANCELLED/LOADED, cancel on LOADED, final invoice before departure)" }
  - { id: ERR_SLOT_WINDOW_INVALID, http: 422, condition: "window_start >= window_end or window outside the ADP contract year" }
  - { id: ERR_INSUFFICIENT_NOTICE, http: 422, condition: "Cancellation notice_days_provided below the SPA cancellation_notice_days" }
  - { id: ERR_VESSEL_BERTH_INCOMPATIBLE, http: 422, condition: "Vessel LOA or DWT exceeds berth maximums" }
  - { id: ERR_BERTH_WINDOW_OVERLAP, http: 409, condition: "Assigned berth window conflicts with another ACCEPTED-or-later call on the same berth (half-open windows, 2h changeover buffer)" }
  - { id: ERR_BERTH_NOT_SERVICEABLE, http: 422, condition: "Berth OUT_OF_SERVICE (terminal turnaround in progress) at accept" }
  - { id: ERR_CALL_INVALID_STATE, http: 409, condition: "Vessel-call transition from an undefined state (berth before NOR, depart before berthed, statement before DEPARTED)" }
  - { id: ERR_STATEMENT_INVALID_STATE, http: 409, condition: "Laytime-statement transition from an undefined state (agree after dispute, resolve without dispute)" }
  - { id: ERR_SCHEDULE_INVALID_STATE, http: 409, condition: "Day-schedule transition from an undefined state (close twice) or nomination on a CLOSED schedule" }
  - { id: ERR_SCHEDULE_CAPACITY_EXCEEDED, http: 422, condition: "Day-schedule capacity exceeds pipeline daily capacity or duplicate gas_day on the pipeline" }
  - { id: ERR_PIPELINE_NOT_SERVICEABLE, http: 422, condition: "Pipeline OUTAGE at nomination, or reconcile against an OPEN schedule" }
  - { id: ERR_NOMINATION_QUANTITY_MISMATCH, http: 422, condition: "nominated_mmbtu not in (0, slot scheduled_feed_gas_mmbtu]" }
  - { id: ERR_NOMINATION_INVALID_STATE, http: 409, condition: "reconcile on a nomination not in CONFIRMED" }
  - { id: ERR_CANCELLATION_INVALID_STATE, http: 409, condition: "settle on an already SETTLED cancellation, or resale offered against a SETTLED cancellation" }
  - { id: ERR_RESALE_INVALID_STATE, http: 409, condition: "sell on a resale not in OFFERED" }
  - { id: ERR_RESALE_VOLUME_EXCEEDED, http: 422, condition: "Cumulative offered resale volume exceeds the cancelled slot's scheduled feed gas" }

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: TerminalOperator
    description: "Terminal owner's operations desk: registers customers, trains, berths, pipelines; drives commissioning, COD, and turnaround lifecycle; operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/trains, /api/trains/{id}/begin-commissioning, /api/trains/{id}/record-commissioning-cargo, /api/trains/{id}/declare-cod"
      - "POST /api/trains/{id}/turnarounds, /api/turnarounds/{id}/approve, /api/turnarounds/{id}/begin, /api/turnarounds/{id}/complete"
      - "POST /api/berths, POST /api/pipelines"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: CommercialManager
    description: "Commercial desk: owns SPAs, builds and locks ADPs, settles cancellations and disputed laytime statements, runs annual reconciliation"
    identity: opaque
    exclusive_operations:
      - "POST /api/spas, /api/spas/{id}/commence-deliveries"
      - "POST /api/adps, /api/adps/{id}/propose, /api/adps/{id}/lock, /api/adps/{id}/reconcile, /api/adps/{id}/cargo-slots"
      - "POST /api/cargo-slots/{id}/issue-final-invoice"
      - "POST /api/cargo-cancellations/{id}/settle"
      - "POST /api/laytime-statements/{id}/resolve"
    shared_operations: ["all GET endpoints"]
  - name: GasScheduler
    description: "Gas control: opens and closes pipeline day schedules, nominates feed gas, reconciles flow, markets cancelled-cargo feed gas"
    identity: opaque
    exclusive_operations:
      - "POST /api/pipelines/{id}/day-schedules, /api/pipeline-day-schedules/{id}/close"
      - "POST /api/feed-gas-nominations/{id}/reconcile"
      - "POST /api/cargo-cancellations/{id}/resales, /api/feed-gas-resales/{id}/sell"
    shared_operations: ["all GET endpoints", "POST /api/pipeline-day-schedules/{id}/nominations (shared with CustomerRep)"]
  - name: MarineScheduler
    description: "Marine/berth planning: accepts vessel nominations, assigns berth windows, moves vessels through berth and departure, submits laytime statements"
    identity: opaque
    exclusive_operations:
      - "POST /api/vessel-calls/{id}/accept, /api/vessel-calls/{id}/berth, /api/vessel-calls/{id}/depart"
      - "POST /api/vessel-calls/{id}/laytime-statements"
    shared_operations: ["all GET endpoints"]
  - name: CustomerRep
    description: "Offtake customer representative; X-User-ID equals the Customer.id of the buyer they represent and ownership is enforced on every write"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/adps/{id}/confirm"
      - "POST /api/cargo-slots/{id}/vessel-nominations, /api/cargo-slots/{id}/cancellations"
      - "POST /api/vessel-calls/{id}/tender-nor"
      - "POST /api/laytime-statements/{id}/agree, /api/laytime-statements/{id}/dispute"
    shared_operations: ["all GET endpoints", "POST /api/pipeline-day-schedules/{id}/nominations (shared with GasScheduler)"]

# Segregation-of-duties note (role_model): turnaround approval is forbidden to
# the same X-User-ID that proposed the turnaround, enforced even though both
# are TerminalOperator (ERR_TURNAROUND_SOD_VIOLATION). Commercial settlement
# (CommercialManager) is separated from physical scheduling (Marine/Gas).
