# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Specialty Glass Co-Development & Capacity Commitment
# All asserted numerals were computed from the scaffold's formulas by hand.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: campaign_cost_provisional_vs_final_diverge
        grounds:
          - calculations.campaign_unit_cost
          - calculations.yield_learning_curve
        distinguishing_aspect: |
          Entity domain = Campaign production cost. For the identical campaign, the
          provisional variant (planned_units 40000 with step yield 0.78, energy tier T1)
          yields 1244 cents/unit while the final variant (realized yield 30000/42000,
          energy tier re-selected on actual good units) yields 1358 cents/unit.
        test_recipe:
          setup:
            - "Device maker, program past NDA, composition GX-100 QUALIFIED (multiplier 1.0)"
            - "SECURED commitment committed/required 5000/5000 with prepayment 2500000"
            - "Tank commissioned (created at default clock 2026-09-01T00:00:00Z, ready 2028-02-23T00:00:00Z)"
            - "Campaign planned 40000 units over [2028-03-01, 2029-03-01), no prior campaign on the tank"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 40000 }, as: CapacityPlanner, captures: { camp_id: $.data.id, prov_cost: $.data.provisional_unit_cost_cents, exp_good: $.data.expected_good_units } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/campaigns/${camp_id}/start", as: CapacityPlanner }
            - { call: "POST /glass/campaigns/${camp_id}/record-production", payload: { record_date: "2028-06-01T00:00:00Z", good_units: 30000, scrap_units: 12000 }, as: CapacityPlanner }
          trigger:
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2029-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/campaigns/${camp_id}/complete", as: CapacityPlanner, captures: { final_cost: $.data.final_unit_cost_cents, realized: $.data.realized_yield } }
          assert:
            - "provisional variant: Campaign.${camp_id}.provisional_unit_cost_cents == 1244 (ceil((850*1.0+120)/0.78) + 0 changeover)"
            - "Campaign.${camp_id}.expected_good_units == 31200 (floor(40000 * 0.78))"
            - "final variant: Campaign.${camp_id}.final_unit_cost_cents == 1358 (ceil((850+120)/0.714286) + 0; energy tier re-selected on 30000 actual good units stays T1)"
            - "Campaign.${camp_id}.realized_yield == 0.714286 (30000/42000 at 6dp round_half_up)"
            - "provisional_unit_cost_cents != final_unit_cost_cents for identical campaign setup"

      - name: royalty_provisional_vs_final_rounding_diverge
        grounds:
          - calculations.royalty_statement
        distinguishing_aspect: |
          Entity domain = License royalty accounting on UsageReport (distinct from
          campaign cost). Identical lines produce provisional 24 (round per line, then
          sum) versus final 25 (sum raw revenues, then round once).
        test_recipe:
          setup:
            - "Program DESIGN_FROZEN with QUALIFIED composition; license ACTIVE on primary market; marketing APPROVED"
            - "Clock at 2027-01-01T00:00:00Z (license in term)"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Falcon", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-002" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-200", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "CONSUMER_ELECTRONICS", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic_id}/activate", as: LegalCounsel }
            - { call: "POST /glass/licenses/${lic_id}/submit-marketing", payload: { materials_ref: "MKT-1" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/licenses/${lic_id}/review-marketing", payload: { decision: "APPROVED" }, as: LegalCounsel }
          trigger:
            - { call: "POST /glass/usage-reports", payload: { license_id: "${lic_id}", period_start: "2027-01-01T00:00:00Z", period_end: "2027-03-31T00:00:00Z", lines: [{ channel: "DOMESTIC", units: 10, net_revenue_cents: 180 }, { channel: "EXPORT", units: 20, net_revenue_cents: 280 }, { channel: "DOMESTIC", units: 30, net_revenue_cents: 380 }] }, as: DeviceMaker, as_user_id: "${m_id}", captures: { ur_id: $.data.id, ur_prov: $.data.provisional_royalty_cents, ur_rate: $.data.royalty_rate_applied } }
            - { call: "POST /glass/usage-reports/${ur_id}/accept", as: FinanceController, captures: { ur_final: $.data.final_royalty_cents } }
          assert:
            - "UsageReport.${ur_id}.royalty_rate_applied == 0.03 (total units 60 <= CONST.ROYALTY_T1_MAX_UNITS)"
            - "UsageReport.${ur_id}.provisional_royalty_cents == 24 (round_half_up per line: 5 + 8 + 11)"
            - "UsageReport.${ur_id}.final_royalty_cents == 25 (round_half_up(840 * 0.03) once)"
            - "provisional != final for identical input lines"
            - "License.${lic_id}.cumulative_royalty_cents == 25 after acceptance"

  - rule_id: combinatorial_formula
    instances:
      - name: campaign_cost_multifactor_changeover_interaction
        grounds:
          - calculations.campaign_unit_cost
        distinguishing_aspect: |
          Mode (a): a >= 3-input formula with non-linear interaction — division by the
          step yield, an energy tier selected by planned volume, and a changeover
          amortization that exists only because a different composition ran before on
          the same tank. Result 1192 = ceil((850*1.0+60)/0.78) + ceil(1460000/60000).
        test_recipe:
          setup:
            - "Two QUALIFIED compositions (GX-100, GX-300) under one program"
            - "Tank commissioned; campaign A on GX-100 occupies [2028-03-01, 2029-03-01)"
            - "No production records needed; all values provisional at scheduling"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx1_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx1_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q1_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q1_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q1_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-300", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx2_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx2_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q2_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q2_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q2_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx1_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_a: $.data.id } }
          trigger:
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx2_id}", start_date: "2029-04-15T00:00:00Z", end_date: "2030-04-15T00:00:00Z", planned_units: 60000 }, as: CapacityPlanner, captures: { camp_b: $.data.id, b_cost: $.data.provisional_unit_cost_cents, b_good: $.data.expected_good_units } }
          assert:
            - "Campaign.${camp_b} created 201 (gap 2029-03-01 -> 2029-04-15 is exactly CONST.CHANGEOVER_GAP_DAYS = 45)"
            - "Campaign.${camp_b}.provisional_unit_cost_cents == 1192 (ceil((850*1.0+60)/0.78)=1167 energy tier T2 because 60000 >= 50000; plus ceil(4000*365/60000)=25 changeover amortization because prior campaign melts a different composition)"
            - "Campaign.${camp_b}.expected_good_units == 46800 (floor(60000 * 0.78))"

      - name: royalty_nested_rounding_order_pinned
        grounds:
          - calculations.royalty_statement
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — provisional rounds each line
          then sums (8 + 14 + 20 = 42); final sums raw revenue then rounds once
          (round_half_up(1350 * 0.03) = 41). Distinct rounding orders are pinned per
          variant and produce different cents on identical lines.
        test_recipe:
          setup:
            - "Program DESIGN_FROZEN; license ACTIVE on primary market; marketing APPROVED; clock 2027-01-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Falcon", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-002" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-200", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "CONSUMER_ELECTRONICS", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic_id}/activate", as: LegalCounsel }
            - { call: "POST /glass/licenses/${lic_id}/submit-marketing", payload: { materials_ref: "MKT-1" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/licenses/${lic_id}/review-marketing", payload: { decision: "APPROVED" }, as: LegalCounsel }
          trigger:
            - { call: "POST /glass/usage-reports", payload: { license_id: "${lic_id}", period_start: "2027-04-01T00:00:00Z", period_end: "2027-06-30T00:00:00Z", lines: [{ channel: "EXPORT", units: 15, net_revenue_cents: 250 }, { channel: "DOMESTIC", units: 25, net_revenue_cents: 450 }, { channel: "EXPORT", units: 35, net_revenue_cents: 650 }] }, as: DeviceMaker, as_user_id: "${m_id}", captures: { ur_id: $.data.id, ur_prov: $.data.provisional_royalty_cents } }
            - { call: "POST /glass/usage-reports/${ur_id}/accept", as: FinanceController, captures: { ur_final: $.data.final_royalty_cents } }
          assert:
            - "UsageReport.${ur_id}.provisional_royalty_cents == 42 (per-line round_half_up: 8 + 14 + 20)"
            - "UsageReport.${ur_id}.final_royalty_cents == 41 (round_half_up(1350 * 0.03) = round_half_up(40.5))"
            - "the rounding-order difference is exactly 1 cent and is pinned per variant, not an implementation choice"

      - name: commitment_coverage_evaluation_order_pinned
        grounds:
          - calculations.commitment_coverage
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the tier bonus enlarges effective
          units while the tier itself depends on coverage — resolved by pinned order
          (tier from PRE-bonus base_coverage only). With base_coverage exactly 1.18 the
          tier is TIER_B even though effective coverage 1.2036 would cross TIER_A if
          the order were inverted; effective_units 14443 locks the order.
        test_recipe:
          setup:
            - "Program past NDA in COMPOSITION_TUNING; no compositions required"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Gamma Devices", region: "APAC" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Heron", primary_market: "AUTOMOTIVE" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-003" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-500", complexity_multiplier: 1.5 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 11000, required_units: 12000, prepayment_cents: 3160000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
          trigger:
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01", captures: { c_tier: $.data.coverage_tier, c_eff: $.data.effective_units } }
          assert:
            - "credit_units == 3160 (floor(3160000 / CONST.PREPAYMENT_UNIT_CREDIT_CENTS)); base_units == 14160; base_coverage == 1.18 exactly"
            - "Commitment.${c_id}.coverage_tier == TIER_B (1.18 < CONST.TIER_A_COVERAGE_MIN 1.2, >= CONST.TIER_B_COVERAGE_MIN 1.0)"
            - "Commitment.${c_id}.effective_units == 14443 (floor(14160 * 1.02)); an order-inverted implementation deriving the tier from effective coverage 1.2036 would wrongly report TIER_A"
            - "Commitment.${c_id}.status == SECURED"

  - rule_id: non_linear_state_machine
    instances:
      - name: qual_cycle_resubmission_loop
        grounds:
          - state_machines.QualCycle.SUBMITTED_to_IN_TESTING
          - state_machines.QualCycle.FAILED_to_SUBMITTED
          - state_machines.QualCycle.IN_TESTING_to_PASSED
        distinguishing_aspect: |
          Cyclic machine on QualCycle: FAILED -> SUBMITTED -> IN_TESTING -> PASSED with
          a monotonic attempt counter; the composition's side-effect promotions
          (EXPERIMENTAL -> TUNED -> QUALIFIED) fire exactly once each across the loop.
        test_recipe:
          setup:
            - "Program past NDA; composition EXPERIMENTAL with one qualification cycle"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
          trigger:
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "FAILED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/resubmit", as: ProgramManager, captures: { q_attempt: $.data.attempt_number, q_status: $.data.status } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}", captures: { q_final: $.data.status } }
            - { call: "GET /glass/compositions/${cx_id}", as: ProgramManager, captures: { cx_status: $.data.status } }
          assert:
            - "after first begin-testing: Composition.${cx_id} became TUNED (one-time side effect)"
            - "after resubmit: QualCycle.${q_id}.status == SUBMITTED and attempt_number == 2 (loop edge FAILED -> SUBMITTED)"
            - "second begin-testing succeeds from SUBMITTED after the loop"
            - "final: QualCycle.${q_id}.status == PASSED and Composition.${cx_id}.status == QUALIFIED"

      - name: license_parallel_status_dimensions
        grounds:
          - state_machines.License.license_status
          - state_machines.License.marketing_status
        distinguishing_aspect: |
          Two independent state dimensions on one entity: marketing review
          (DRAFT -> IN_REVIEW -> CHANGES_REQUIRED -> IN_REVIEW -> APPROVED) evolves
          while license_status sits in NEGOTIATION, and a later suspension flips
          license_status ACTIVE -> SUSPENDED -> ACTIVE without touching
          marketing_status (stays APPROVED throughout).
        test_recipe:
          setup:
            - "Program DESIGN_FROZEN with QUALIFIED composition; license created (NEGOTIATION / DRAFT); clock in license term"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Falcon", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
