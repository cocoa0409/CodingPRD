          trigger: "POST /finish-runs with build_order_id ${bo1}, booth_id ${dry1}, finish_system NITRO, coat_count 8 and expected_build_order_version ${bo_v3} as FinishTech, then the same call with booth_id ${br1}, then the same call with booth_id ${fb1}"
          assert:
            dry_store_http_status: 422
            dry_store_error_id: "ERR_BOOTH_ROOM_TYPE_INVALID"
            build_room_http_status: 422
            build_room_error_id: "ERR_BOOTH_ROOM_TYPE_INVALID"
            build_stage_after_refusals: "IN_ASSEMBLY"
            finish_booth_http_status: 201
            finish_run_status: "SPRAYING"
            build_stage_after_success: "IN_FINISH"
            fb1_occupied_slots_after: 1
            dry1_occupied_slots_after: 0
            note: "The two refused calls never bumped the order's version, which is why the same ${bo_v3} is still accepted by the third. booth_hold_until is projected at creation as 2026-08-01T00:00:00Z + (4 + 336) hours = 2026-08-15T04:00:00Z, before any climate sample exists."

      - name: the_finish_run_verbs_police_the_cure_clock_and_their_own_from_state
        claim_type: error_triggerable
        grounds: ["errors[ERR_CURE_NOT_COMPLETE]", "errors[ERR_FINISH_RUN_STATE_INVALID]", "calculations.finish_cure_ready_at"]
        distinguishing_aspect: "A CURING run refuses four different calls with two different codes: buff before cure_ready_at is 409 ERR_CURE_NOT_COMPLETE, while complete, resume-cure and a second complete-spray are all 409 ERR_FINISH_RUN_STATE_INVALID. At exactly cure_ready_at the buff succeeds, because the bound is inclusive — one second earlier it does not."
        test_recipe:
          setup: "The same IN_ASSEMBLY order with FB-1 sampled at 50.0 / 21.0."
          setup_api_calls: *order_in_assembly
          trigger: "POST /finish-runs with build_order_id ${bo1}, booth_id ${fb1}, finish_system NITRO, coat_count 8 and expected_build_order_version ${bo_v3} as FinishTech, then POST /finish-runs/{that run}/complete-spray as FinishTech, then POST /finish-runs/{that run}/buff as FinishTech, then POST /finish-runs/{that run}/complete as FinishTech, then POST /finish-runs/{that run}/resume-cure as FinishTech, then POST /finish-runs/{that run}/complete-spray again as FinishTech, then POST /_clock/set_current_utc to 2026-08-15T11:59:59Z and POST /finish-runs/{that run}/buff, then POST /_clock/set_current_utc to 2026-08-15T12:00:00Z and POST /finish-runs/{that run}/buff"
          assert:
            complete_spray_http_status: 200
            status_after_complete_spray: "CURING"
            spray_completed_at: "2026-08-01T00:00:00Z"
            cure_hours: 348
            cure_ready_at: "2026-08-15T12:00:00Z"
            early_buff_http_status: 409
            early_buff_error_id: "ERR_CURE_NOT_COMPLETE"
            complete_http_status: 409
            complete_error_id: "ERR_FINISH_RUN_STATE_INVALID"
            resume_cure_http_status: 409
            resume_cure_error_id: "ERR_FINISH_RUN_STATE_INVALID"
            second_complete_spray_http_status: 409
            second_complete_spray_error_id: "ERR_FINISH_RUN_STATE_INVALID"
            buff_one_second_early_http_status: 409
            buff_one_second_early_error_id: "ERR_CURE_NOT_COMPLETE"
            buff_at_the_boundary_http_status: 200
            status_after_boundary_buff: "BUFFING"
            fb1_occupied_slots_during_buffing: 1
            note: "cure_hours = max(240, 336 + ceil((50.0 - 45.0) / 5.0) * 12 - floor((21.0 - 21.0) / 2.0) * 8) = max(240, 348) = 348, and 348 hours after 2026-08-01T00:00:00Z is 2026-08-15T12:00:00Z — four hours past the booth_hold_until projection of 2026-08-15T04:00:00Z, which is informational and never an error. The booth slot is still occupied while buffing; only complete releases it."

      - name: a_compliance_hold_blocks_a_clean_sibling_component_until_the_dirty_one_is_scrapped
        claim_type: error_triggerable
        grounds: ["errors[ERR_COMPLIANCE_HOLD_ACTIVE]", "state_machines.BuildOrder.build_stage.transitions", "validations.priority_61"]
        distinguishing_aspect: "The hold is order-wide, not component-wide: routing the UNAFFECTED sibling component — whose own status is ROUGH_SAWN, so the priority-50 check passes — is refused 409 ERR_COMPLIANCE_HOLD_ACTIVE purely because its order sits in COMPLIANCE_HOLD. Clearing the hold requires zero PROTECTED_SPECIES components, so it only becomes possible after the tainted part is scrapped, and the restore returns the order to the exact stage it left, COMPONENTS_RELEASED."
        test_recipe:
          setup: "An order at COMPONENTS_RELEASED with two ROUGH_SAWN components cut from two different SITKA lots, and a HELD CNC-1 reservation for the second component."
