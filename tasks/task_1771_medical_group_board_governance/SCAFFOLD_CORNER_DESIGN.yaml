            - { call: "POST /governance/motions", payload: { motion_type: DISTRIBUTION, sponsor_physician_id: "${s_id}", payload: { amount_cents: 100000, method: PRO_RATA, fiscal_net_income_before_bonus_cents: 800000000 } }, as: Physician, as_user_id: "${s_id}", captures: { m_id: $.data.id } }
