            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 900, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
