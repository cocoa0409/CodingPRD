# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# RIA / Financial-Advisor Practice — Expert.
# Nine §0.5 rules, >= 2 instances each (>= 18 total). Every grounds[] resolves
# to SCAFFOLD.yaml §1.1-§1.7; every formula-derived assert is a pre-computed
# literal; every setup_api_calls/trigger call resolves to §1.5.
#
# Common fee schedule used across fee instances (created in-chain each time):
#   tiers ascending, marginal:
#     [ {upper_bound_cents:100000000, annual_rate_bps:100},   # <=$1.0M @ 1.00%
#       {upper_bound_cents:500000000, annual_rate_bps:75},    # <=$5.0M @ 0.75%
#       {upper_bound_cents:null,      annual_rate_bps:50} ]   # rest   @ 0.50%
#   minimum_annual_fee_cents: 100000   # $1,000.00
# Logical clock default 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_basis_arrears_vs_advance_diverge
        grounds:
          - calculations.aum_fee_basis_selection
          - calculations.tiered_marginal_fee
          - entities.FeeRun.fields.billing_method_snapshot
          - entities.FeeRun.fields.basis_aum_cents
          - state_machines.FeeRun.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Same account trajectory (200,000,000c then 300,000,000c) and same Q2 period bills 300,000,000c
          under ARREARS (period-end value) but 200,000,000c under ADVANCE (prior FINALIZED run snapshot at
          period_start), so the two billing-method variants on the FeeRun/Household domain produce different
          basis_aum_cents (623,288c vs 436,301c assessed) — distinct from the Goal-domain dual variant below.
        test_recipe:
          setup:
            - "Two households H_arr (ARREARS) and H_adv (ADVANCE) on the same fee schedule, each with one ACTIVE billable account."
            - "H_adv has a FINALIZED Q1 fee run (period_end 2026-04-01) with basis_aum_cents=200,000,000 captured before its account is re-valued to 300,000,000."
            - "H_arr account is re-valued to 300,000,000 directly."
            - "A Q2 fee run (2026-04-01..2026-06-30) is created and CALCULATED for each household."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: 100000000, annual_rate_bps: 100}, {upper_bound_cents: 500000000, annual_rate_bps: 75}, {upper_bound_cents: null, annual_rate_bps: 50} ], minimum_annual_fee_cents: 100000 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            # ---- ARREARS household ----
            - call: "POST /households"
              payload: { name: "Arr HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { harr_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${harr_id}", full_name: "Arr Client", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { carr_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${harr_id}", client_id: "${carr_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 200000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { aarr_id: $.data.id }
            - call: "POST /clients/${carr_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${aarr_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "POST /accounts/${aarr_id}/valuation"
              payload: { market_value_cents: 300000000, equity_value_cents: 0 }
              as: Advisor
            # ---- ADVANCE household ----
            - call: "POST /households"
              payload: { name: "Adv HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ADVANCE" }
              as: Advisor
              captures: { hadv_id: $.data.id, hadv_v0: $.data.version }
            - call: "POST /clients"
              payload: { household_id: "${hadv_id}", full_name: "Adv Client", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { cadv_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hadv_id}", client_id: "${cadv_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 200000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { aadv_id: $.data.id }
            - call: "POST /clients/${cadv_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${aadv_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            # Seed the ADVANCE snapshot: Q1 run created by billing-1, finalized by billing-2 (SoD distinct).
            - call: "POST /fee-runs"
              payload: { household_id: "${hadv_id}", period_start: "2026-01-01", period_end: "2026-04-01", expected_household_version: "${hadv_v0}" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { q1_id: $.data.id }
            - call: "POST /fee-runs/${q1_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              as_user_id: "billing-1"
            - call: "POST /fee-runs/${q1_id}/state"
              payload: { action: "FINALIZE" }
              as: BillingAdmin
              as_user_id: "billing-2"
              captures: { q1_basis: $.data.basis_aum_cents }
            # Re-read household to get the post-finalize version (finalize bumped it).
            - call: "GET /households/${hadv_id}"
              payload: {}
              as: BillingAdmin
              captures: { hadv_v1: $.data.version }
            - call: "POST /accounts/${aadv_id}/valuation"
              payload: { market_value_cents: 300000000, equity_value_cents: 0 }
              as: Advisor
            # Read the ARREARS household's current version immediately before its Q2 create (OCC source).
            - call: "GET /households/${harr_id}"
              payload: {}
              as: BillingAdmin
              captures: { harr_v0: $.data.version }
          trigger:
            # H_arr Q2 run: created by billing-1, CALCULATE.
            - call: "POST /fee-runs"
              payload: { household_id: "${harr_id}", period_start: "2026-04-01", period_end: "2026-06-30", expected_household_version: "${harr_v0}" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { qarr_id: $.data.id }
            - call: "POST /fee-runs/${qarr_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              captures: { arr_basis: $.data.basis_aum_cents, arr_assessed: $.data.assessed_fee_cents }
            # H_adv Q2 run.
            - call: "POST /fee-runs"
              payload: { household_id: "${hadv_id}", period_start: "2026-04-01", period_end: "2026-06-30", expected_household_version: "${hadv_v1}" }
              as: BillingAdmin
              captures: { qadv_id: $.data.id }
            - call: "POST /fee-runs/${qadv_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              captures: { adv_basis: $.data.basis_aum_cents, adv_assessed: $.data.assessed_fee_cents }
          assert:
            - "FeeRun.${qarr_id}.basis_aum_cents == 300000000"
            - "FeeRun.${qarr_id}.assessed_fee_cents == 623288"
            - "FeeRun.${qadv_id}.basis_aum_cents == 200000000"
            - "FeeRun.${qadv_id}.assessed_fee_cents == 436301"
            - "FeeRun.${qarr_id}.assessed_fee_cents != FeeRun.${qadv_id}.assessed_fee_cents"

      - name: goal_funding_projected_vs_actual_diverge
        grounds:
          - calculations.goal_funding_projection
          - entities.Goal.fields.funded_ratio_bps
          - entities.Goal.fields.on_track
          - entities.FinancialPlan.fields.lifecycle_status
          - state_machines.FinancialPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          A goal with current 0c, target 1,200,000c, plan monthly_contribution 100,000c, return 0bps, clock
          2026-03-01, target_date 2027-03-01 reads funded_ratio_bps=0 (on_track false) while the plan is DRAFT
          (ACTUAL variant) but funded_ratio_bps=10000 (on_track true) once the plan is ACTIVE (PROJECTED
          variant) — same Goal/FinancialPlan domain, distinct from the FeeRun/Household fee dual variant above.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01."
            - "A DRAFT financial plan with monthly_contribution_cents=100000, assumed_annual_return_bps=0, and one goal target 1,200,000c, current 0c, target_date 2027-03-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "Plan HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /financial-plans"
              payload: { household_id: "${hh_id}", name: "Retire", assumed_annual_return_bps: 0, monthly_contribution_cents: 100000 }
              as: Advisor
              captures: { plan_id: $.data.id }
            - call: "POST /goals"
              payload: { plan_id: "${plan_id}", name: "Nest", target_amount_cents: 1200000, target_date: "2027-03-01", current_amount_cents: 0, priority: "ESSENTIAL" }
              as: Advisor
              captures: { goal_id: $.data.id }
          trigger:
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: Advisor
              captures: { draft_ratio: $.data.funded_ratio_bps }
            - call: "POST /financial-plans/${plan_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: Advisor
              captures: { active_ratio: $.data.funded_ratio_bps }
          assert:
            - "Goal.${goal_id}.funded_ratio_bps changes from 0 (plan DRAFT, ACTUAL variant) to 10000 (plan ACTIVE, PROJECTED variant)"
            - "Goal.${goal_id}.on_track == true after plan ACTIVATE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_marginal_fee_three_tier_proration
        grounds:
          - calculations.tiered_marginal_fee
          - entities.FeeRun.fields.gross_fee_cents
          - entities.FeeRun.fields.assessed_fee_cents
          - state_machines.FeeRun.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Mode (a) non-linear interaction: basis 200,000,000c splits across two marginal tiers
          (100,000,000c@100bps + 100,000,000c@75bps = 1,750,000c annual), then prorates by inclusive
          day-count 90/365 to 431,507c gross — three inputs (basis, tier schedule, day-count) interacting
          non-linearly. Distinct mode from the householding circular-dependency instance below.
        test_recipe:
          setup:
            - "An ACTIVE billable account valued 200,000,000c in an ARREARS household on the standard 3-tier schedule (minimum 100,000c)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: 100000000, annual_rate_bps: 100}, {upper_bound_cents: 500000000, annual_rate_bps: 75}, {upper_bound_cents: null, annual_rate_bps: 50} ], minimum_annual_fee_cents: 100000 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 200000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-03-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /fee-runs/${run_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              captures: { gross: $.data.gross_fee_cents, assessed: $.data.assessed_fee_cents }
          assert:
            - "FeeRun.${run_id}.basis_aum_cents == 200000000"
            - "FeeRun.${run_id}.gross_fee_cents == 431507"
            - "FeeRun.${run_id}.assessed_fee_cents == 431507"

      - name: householding_breakpoint_circular_dependency_order
        grounds:
          - calculations.householding_breakpoint_tier
          - entities.Household.fields.aggregated_aum_cents
          - entities.Household.fields.breakpoint_tier_index
          - state_machines.Account.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: aggregated_aum_cents (sum of ACTIVE
          member accounts) -> breakpoint_tier_index -> next fee run's marginal schedule, evaluated in that
          fixed order and never recursing. With two ACTIVE accounts summing to exactly 100,000,000c the strict
          '<' boundary places the household in tier index 1, not 0. Distinct mode from the tiered-proration (a)
          instance above.
        test_recipe:
          setup:
            - "A household whose two ACTIVE accounts sum to exactly 100,000,000c (the tier-0 upper bound)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: 100000000, annual_rate_bps: 100}, {upper_bound_cents: 500000000, annual_rate_bps: 75}, {upper_bound_cents: null, annual_rate_bps: 50} ], minimum_annual_fee_cents: 100000 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 40000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a1_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "IRA", market_value_cents: 60000000, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a2_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a1_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
          trigger:
            - call: "POST /accounts/${a2_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Advisor
              captures: { agg: $.data.aggregated_aum_cents, tier: $.data.breakpoint_tier_index }
          assert:
            - "Household.${hh_id}.aggregated_aum_cents == 100000000"
            - "Household.${hh_id}.breakpoint_tier_index == 1"

      - name: tiered_fee_per_tier_round_then_sum_order
        grounds:
          - calculations.tiered_marginal_fee
          - entities.FeeRun.fields.gross_fee_cents
          - state_machines.FeeRun.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Mode (b) rounding-order pin: basis 66,667c on a two-tier 100bps schedule yields 666c when each tier
          slice is rounded then summed (333c + 333c) versus 667c under sum-then-round (rhu(666.67)); the
          scaffold pins round-per-tier-then-sum, so gross_fee_cents==666 (full year, minimum 0).
        test_recipe:
          setup:
            - "An ACTIVE billable account valued 66,667c in an ARREARS household on a two-tier 100bps schedule (tier0 upper 33,333c, minimum 0)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Round", tiers: [ {upper_bound_cents: 33333, annual_rate_bps: 100}, {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}", billing_method: "ARREARS" }
              as: Advisor
              captures: { hh_id: $.data.id, hh_v0: $.data.version }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /accounts"
              payload: { household_id: "${hh_id}", client_id: "${c_id}", custodian: "Schwab", account_type: "TAXABLE", market_value_cents: 66667, equity_value_cents: 0, billable: true, held_away: false }
              as: Advisor
              captures: { a_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /accounts/${a_id}/state"
              payload: { action: "ACTIVATE" }
              as: Advisor
            - call: "POST /fee-runs"
              payload: { household_id: "${hh_id}", period_start: "2026-01-01", period_end: "2026-12-31", expected_household_version: "${hh_v0}" }
              as: BillingAdmin
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /fee-runs/${run_id}/state"
              payload: { action: "CALCULATE" }
              as: BillingAdmin
              captures: { gross: $.data.gross_fee_cents }
          assert:
            - "FeeRun.${run_id}.gross_fee_cents == 666"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ips_draft_proposed_revision_cycle
        grounds:
          - state_machines.InvestmentPolicyStatement.DRAFT_to_PROPOSED
          - state_machines.InvestmentPolicyStatement.PROPOSED_to_DRAFT
          - entities.InvestmentPolicyStatement.fields.revision_round
        distinguishing_aspect: |
          The IPS machine cycles DRAFT -> PROPOSED -> DRAFT -> PROPOSED on the same row; revision_round
          increments to 2 after two request-changes loops, proving a genuine cycle (not a linear pipeline).
          Entity = InvestmentPolicyStatement, distinct from the FinancialPlan parallel-dimension instance.
        test_recipe:
          setup:
            - "A published portfolio (model_equity_pct 60) and a DRAFT IPS (max_equity_pct 80) for a KYC-verified client."
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Bal", model_equity_pct: 60, target_weights: [ {sleeve: "EQ", target_pct: 60}, {sleeve: "FI", target_pct: 40} ] }
              as: Advisor
              captures: { pf_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/publish"
              payload: {}
              as: Advisor
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /investment-policy-statements"
              payload: { client_id: "${c_id}", target_portfolio_id: "${pf_id}", max_equity_pct: 80, drift_tolerance_bps: 500 }
              as: Advisor
              captures: { ips_id: $.data.id }
          trigger:
            - call: "POST /investment-policy-statements/${ips_id}/state"
              payload: { action: "PROPOSE" }
              as: Advisor
              as_user_id: "adv-1"
            - call: "POST /investment-policy-statements/${ips_id}/state"
              payload: { action: "REQUEST_CHANGES" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investment-policy-statements/${ips_id}/state"
              payload: { action: "PROPOSE" }
              as: Advisor
              as_user_id: "adv-1"
            - call: "POST /investment-policy-statements/${ips_id}/state"
              payload: { action: "REQUEST_CHANGES" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { final_status: $.data.status, rounds: $.data.revision_round }
          assert:
            - "InvestmentPolicyStatement.${ips_id}.status == DRAFT"
            - "InvestmentPolicyStatement.${ips_id}.revision_round == 2"

      - name: financial_plan_parallel_lifecycle_and_review_axes
        grounds:
          - state_machines.FinancialPlan.DRAFT_to_ACTIVE
          - state_machines.FinancialPlan.NEEDS_REVIEW_to_REVIEWED
          - entities.FinancialPlan.fields.lifecycle_status
          - entities.FinancialPlan.fields.review_status
        distinguishing_aspect: |
          One FinancialPlan row carries two independent state axes: marking it REVIEWED (review axis) leaves
          lifecycle_status==DRAFT unchanged, and later ACTIVATE (lifecycle axis) leaves review_status==REVIEWED
          unchanged — parallel dimensions on one entity. Entity = FinancialPlan, distinct from the IPS cycle.
        test_recipe:
          setup:
            - "A DRAFT financial plan (review_status NEEDS_REVIEW) with one goal so it can later be activated."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: null, annual_rate_bps: 100} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /financial-plans"
              payload: { household_id: "${hh_id}", name: "Plan", assumed_annual_return_bps: 600, monthly_contribution_cents: 0 }
              as: Advisor
              captures: { plan_id: $.data.id }
            - call: "POST /goals"
