          setup:
            - "One IMMINENT_HAZARD violation code FAC-960 (base_points 1.0, fine_cents_base 50000), so a single observation scores 1.0 * 8.0 = 8.00."
            - "Establishment 'Hazard Salon' (PENDING_INSPECTION) has a ROUTINE inspection with one FAC-960 finding on which the inspector declares an imminent hazard, then submits and finalizes it: final score 8.00 with outcome IMMEDIATE_CLOSURE, and the establishment is CLOSED_IMMINENT_HAZARD / FROZEN."
            - "A REINSPECTION of that inspection is then run clean (zero findings) and finalized, scoring 0.00 with outcome PASS."
