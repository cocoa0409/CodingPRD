            - "at exactly expires_at (2026-08-15T00:00:00Z >= expires_at): error_id == ERR_QUOTE_EXPIRED and Quote.${q2}.status == EXPIRED"

      - name: approve_exchange_order_without_reserved_unit
        claim_type: violation_to_error
