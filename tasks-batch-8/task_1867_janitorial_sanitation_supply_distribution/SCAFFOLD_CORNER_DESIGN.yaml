scaffold_corner_design:
- section: entities
  instances:
  - name: create_facility_applies_system_defaults
    claim_type: defaults
    grounds:
    - entities.Facility.fields.status
    - entities.Facility.fields.committed_cents
    distinguishing_aspect: Facility created without status/balance fields gets status ACTIVE, committed_cents 0, outstanding_cents 0, closed_loop_enrolled false, version 1.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac Q
          facility_group_code: GPO-1
          credit_limit_cents: 500000
          service_zone: Z9
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      trigger:
      - call: GET /jansan/facilities/${fac_id}
        payload: {}
        as: DistributorAdmin
      assert:
      - Facility.${fac_id}.status == ACTIVE AND committed_cents == 0 AND outstanding_cents == 0 AND closed_loop_enrolled == false AND version == 1
  - name: get_facility_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /jansan/facilities/00000000-0000-4000-8000-000000000000
        payload: {}
        as: DistributorAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and http status 404
  - name: create_product_invalid_enum_returns_validation
    claim_type: type_constraints
    grounds:
    - entities.Product.fields.category
    - errors[ERR_VALIDATION]
    distinguishing_aspect: category 'FOOD' is not in {CHEMICAL, PAPER, EQUIPMENT, DISPENSER_SUPPLY, OTHER} -> 400 ERR_VALIDATION.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /jansan/products
        payload:
          sku: SKU-BAD
          name: Bad
          category: FOOD
          base_price_cents: 100
          unit_of_measure: EACH
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 10
        as: DistributorAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION and http status 400; no product persisted
  - name: create_facility_missing_required_returns_validation
    claim_type: required_fields
    grounds:
    - entities.Facility.fields.credit_limit_cents
    - errors[ERR_VALIDATION]
    distinguishing_aspect: Omitting required credit_limit_cents -> 400 ERR_VALIDATION.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /jansan/facilities
        payload:
          name: Fac NoCredit
          facility_group_code: GPO-1
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION and http status 400
  - name: create_product_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Product
    distinguishing_aspect: 'Client-supplied id/version/created_at are ignored: server mints its own id (different from supplied) and version starts at 1.'
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /jansan/products
        payload:
          id: 11111111-2222-4333-8444-555555555555
          version: 9
          sku: SKU-SYS
          name: Sys
          category: PAPER
          base_price_cents: 100
          unit_of_measure: EACH
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 10
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      assert:
      - response id != '11111111-2222-4333-8444-555555555555' (server-minted) AND version == 1
  - name: create_order_computed_fields_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.Order.fields.merchandise_subtotal_cents
    distinguishing_aspect: Client-supplied merchandise_subtotal_cents/total_cents on create are ignored; DRAFT order carries server-computed values (0 until placed).
    test_recipe:
      setup:
      - Facility ACTIVE; product price 1000 stock 100
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac R
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-R1
          name: Rags
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      trigger:
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
          merchandise_subtotal_cents: 999999
          total_cents: 1
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          ord_id: $.data.id
          ord_total: $.data.total_cents
      assert:
      - response total_cents != 1 and merchandise_subtotal_cents != 999999 (client values ignored; computed fields are 0 in DRAFT)
  - name: list_orders_pagination_and_filter
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints
    distinguishing_aspect: 'limit/offset/total_count/has_more interact with the facility_id filter: 3 orders -> page1 (limit 2) has_more true, page2 (offset 2) returns 1 row has_more false.'
    test_recipe:
      setup:
      - Facility with three DRAFT orders
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac S
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-S9
          name: Stock
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-06T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-07T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
      trigger:
      - call: GET /jansan/orders
        payload:
          facility_id: ${fac_id}
          limit: 2
          offset: 0
        as: DistributorAdmin
      - call: GET /jansan/orders
        payload:
          facility_id: ${fac_id}
          limit: 2
          offset: 2
        as: DistributorAdmin
      assert:
      - 'Page 1: data length == 2 AND total_count == 3 AND has_more == true'
      - 'Page 2: data length == 1 AND total_count == 3 AND has_more == false'
  - name: create_order_with_unknown_product_returns_not_found
    claim_type: parent_relationships
    grounds:
    - validations[priority=4]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: Body-referenced product_id that does not exist -> 404 ERR_NOT_FOUND (existence checked after auth, before state).
    test_recipe:
      setup:
      - Facility ACTIVE
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac T
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      trigger:
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: 00000000-0000-4000-8000-000000000000
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and http status 404
- section: state_machines
  instances:
  - name: new_order_initial_state_draft
    claim_type: initial_state
    grounds:
    - state_machines.Order
    distinguishing_aspect: A freshly created order has status DRAFT and no committed exposure.
    test_recipe:
      setup:
      - Facility ACTIVE; product stock 100
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac U
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-U1
          name: U
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      trigger:
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          ord_id: $.data.id
      assert:
      - Order.${ord_id}.status == DRAFT AND Facility.${fac_id}.committed_cents == 0 (DRAFT orders do not commit credit)
  - name: place_order_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.Order.DRAFT_to_PLACED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Repeating the place trigger on an already-PLACED order fails with ERR_INVALID_STATE and does not double-allocate stock.
    test_recipe:
      setup:
      - Facility ACTIVE; product stock 100; order 1 x 1000 PLACED
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac V
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-V1
          name: V
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          ord_id: $.data.id
      - call: POST /jansan/orders/${ord_id}/place
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      trigger:
      - call: POST /jansan/orders/${ord_id}/place
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE; Product.${prod_id}.qty_on_hand == 99 AND qty_allocated == 1 (no double allocation)
  - name: cancel_invoiced_order_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Order
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'INVOICED is terminal: cancel on an INVOICED order fails with ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - Facility ACTIVE; product stock 100; order 1 x 1000 driven PLACED -> DELIVERED -> INVOICED
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac W
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-W1
          name: W
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          ord_id: $.data.id
      - call: POST /jansan/orders/${ord_id}/place
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/orders/${ord_id}/confirm-delivery
        payload:
          fuel_index_at_delivery: 2.5
        as: DistributorAdmin
      - call: POST /jansan/orders/${ord_id}/invoice
        payload: {}
        as: DistributorAdmin
      trigger:
      - call: POST /jansan/orders/${ord_id}/cancel
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE; Order.${ord_id}.status remains INVOICED
  - name: invoice_moves_committed_to_outstanding
    claim_type: side_effect_execution
    grounds:
    - state_machines.Order.DELIVERED_to_INVOICED
    - calculations.credit_exposure
    distinguishing_aspect: 'Ledger sync on invoice: committed_cents decreases and outstanding_cents increases by exactly the delivered total (6200 for 1 x 1000 at index 2.50).'
    test_recipe:
      setup:
      - Facility ACTIVE; product price 1000 stock 100; order 1 x 1000 PLACED then DELIVERED at same index
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac X
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-X1
          name: X
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      - call: POST /jansan/orders
        payload:
          facility_id: ${fac_id}
          lines:
          - product_id: ${prod_id}
            qty: 1
          delivery_date: '2026-08-05T00:00:00Z'
          fuel_index: 2.5
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          ord_id: $.data.id
      - call: POST /jansan/orders/${ord_id}/place
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/orders/${ord_id}/confirm-delivery
        payload:
          fuel_index_at_delivery: 2.5
        as: DistributorAdmin
      trigger:
      - call: POST /jansan/orders/${ord_id}/invoice
        payload: {}
        as: DistributorAdmin
      assert:
      - Order.${ord_id}.status == INVOICED AND total_cents == 6200
      - Facility.${fac_id}.committed_cents == 0 AND outstanding_cents == 6200
  - name: facility_suspend_resume_conditional_cascade
    claim_type: side_effect_execution
    grounds:
    - state_machines.Facility.ACTIVE_to_SUSPENDED
    - state_machines.Facility.SUSPENDED_to_ACTIVE
    distinguishing_aspect: 'Conditional cascade: suspend pauses only ACTIVE standing orders (reason SUSPENSION); a MANUAL-paused one stays MANUAL-paused through suspend AND reinstate.'
    test_recipe:
      setup:
      - Facility ACTIVE with SO-A ACTIVE and SO-B PAUSED (pause_reason MANUAL)
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac Y
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-Y1
          name: Y1
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 500
        as: DistributorAdmin
        captures:
          p1: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-Y2
          name: Y2
          category: EQUIPMENT
          base_price_cents: 2000
          unit_of_measure: EACH
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 500
        as: DistributorAdmin
        captures:
          p2: $.data.id
      - call: POST /jansan/standing-orders
        payload:
          facility_id: ${fac_id}
          items:
          - product_id: ${p1}
            qty: 1
          frequency: WEEKLY
          next_run_date: '2026-08-03T00:00:00Z'
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          so_a: $.data.id
      - call: POST /jansan/standing-orders
        payload:
          facility_id: ${fac_id}
          items:
          - product_id: ${p2}
            qty: 1
          frequency: MONTHLY
          next_run_date: '2026-09-01T00:00:00Z'
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          so_b: $.data.id
      - call: POST /jansan/standing-orders/${so_a}/activate
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/standing-orders/${so_b}/activate
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/standing-orders/${so_b}/pause
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      trigger:
      - call: POST /jansan/facilities/${fac_id}/suspend
        payload: {}
        as: DistributorAdmin
      - call: POST /jansan/facilities/${fac_id}/reinstate
        payload: {}
        as: DistributorAdmin
      assert:
      - 'After suspend: StandingOrder.${so_a} == PAUSED with pause_reason SUSPENSION; StandingOrder.${so_b} stays PAUSED with pause_reason MANUAL'
      - 'After reinstate: StandingOrder.${so_a} == ACTIVE (reason NONE); StandingOrder.${so_b} remains PAUSED with pause_reason MANUAL'
  - name: award_reprices_protected_standing_order
    claim_type: side_effect_execution
    grounds:
    - state_machines.ContractBid.UNDER_REVIEW_to_AWARDED
    - calculations.effective_unit_price
    distinguishing_aspect: 'Award cascade: standing order of a GPO-6 facility reprices from base (2x1000=2000) to bid price (2x800=1600) and price_protected flips true.'
    test_recipe:
      setup:
      - Facility in group GPO-6; product base 1000; SO ACTIVE items [{product,2}] previewing 2000; bid for GPO-6 at 800 UNDER_REVIEW with window covering now
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac Z
          facility_group_code: GPO-6
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-Z1
          name: Z1
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 500
        as: DistributorAdmin
        captures:
          prod_id: $.data.id
      - call: POST /jansan/standing-orders
        payload:
          facility_id: ${fac_id}
          items:
          - product_id: ${prod_id}
            qty: 2
          frequency: WEEKLY
          next_run_date: '2026-08-03T00:00:00Z'
        as: FacilityManager
        as_user_id: ${fac_id}
        captures:
          so_id: $.data.id
      - call: POST /jansan/standing-orders/${so_id}/activate
        payload: {}
        as: FacilityManager
        as_user_id: ${fac_id}
      - call: POST /jansan/contract-bids
        payload:
          bid_reference: BID-Z
          facility_group_code: GPO-6
          lines:
          - product_id: ${prod_id}
            bid_price_cents: 800
          protection_start: '2026-07-01T00:00:00Z'
          protection_end: '2026-12-31T00:00:00Z'
        as: SalesRep
        captures:
          bid_id: $.data.id
      - call: POST /jansan/contract-bids/${bid_id}/submit
        payload: {}
        as: SalesRep
      - call: POST /jansan/contract-bids/${bid_id}/open-review
        payload: {}
        as: SalesRep
      trigger:
      - call: POST /jansan/contract-bids/${bid_id}/award
        payload: {}
        as: DistributorAdmin
      assert:
      - StandingOrder.${so_id}.price_protected == true AND next_delivery_total_cents == 1600 (was 2000)
  - name: proposal_accept_swaps_line_and_reprices_order
    claim_type: side_effect_execution
    grounds:
    - state_machines.SubstitutionProposal.PENDING_to_ACCEPTED
    - state_machines.OrderLine.SUBSTITUTION_PENDING_to_ALLOCATED
    distinguishing_aspect: 'Accept path: line swaps to the cheaper substitute (1000 -> 900), order totals recompute (subtotal 1800, fee 3200, surcharge 200, total unchanged 5200), stock moves to the substitute,
      order returns to PLACED.'
    test_recipe:
      setup:
      - Facility ACTIVE; P_SHORT price 1000 stock 100 and cheaper substitute P_SUB price 900 stock 100 (same category PAPER)
      setup_api_calls:
      - call: POST /jansan/facilities
        payload:
          name: Fac AA
          facility_group_code: GPO-1
          credit_limit_cents: 1000000
          service_zone: Z1
          delivery_distance_miles: 10
          default_delivery_day: MON
        as: DistributorAdmin
        captures:
          fac_id: $.data.id
      - call: POST /jansan/products
        payload:
          sku: SKU-AA1
          name: Short
          category: PAPER
          base_price_cents: 1000
          unit_of_measure: CASE
          dilution_required: false
          chemical_family: NONE
          qty_on_hand: 100
        as: DistributorAdmin
        captures:
          p_short: $.data.id
