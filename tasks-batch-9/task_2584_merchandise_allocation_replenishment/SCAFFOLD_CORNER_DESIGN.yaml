            - "GET /allocation/items/${item_id} reports replenishment_model == DEMAND_DRIVEN (resolved from item_type SEASONAL with no override) and lifecycle_state == BROKEN (both positions are missing core sizes)"
            - "Re-reading ${p1_id} after all of those GETs returns the identical version - reads never mutate, and none of the computed fields drifted between reads"
      - name: patch_re_derives_the_stock_dimension_and_leaves_the_assortment_dimension_alone
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /allocation/store-positions/{positionId}
          - endpoints.PATCH /allocation/items/{itemId}
          - entities.StorePosition.fields.stock_status
          - entities.StorePosition.fields.assortment_status
        distinguishing_aspect: |
          The position PATCH accepts only five planning inputs and no physical stock, which makes it the
          cleanest probe of the two-dimensional status model: moving min_units and max_units around a fixed
          available_units of 6 walks stock_status from LOW to IN_STOCK to OVERSTOCK, while
          assortment_status stays BROKEN and broken_size_count stays 2 through every call, because those
          depend on size_on_hand and size_on_hand is not patchable. on_order_units is the trap - it is an
          accepted input that feeds the FORWARD_LOOKING need calculation, yet it is absent from
          available_units, so patching it from 0 to 10 must leave stock_status untouched. Each accepted PATCH
          bumps the row's version by exactly one, and the item PATCH proves the same discipline on a
          different entity: a new retail price changes no computed model.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with store 0101 (capacity 48 / pmin 12)"
            - "SKU-1001 SEASONAL on TOP-4SZ, all four sizes core, retail 36.50"
            - "Position 0101 holds 6 units (M 4 / L 2) with on_order 0, min 12, max 48, forecast 9, trailing 30"
            - "At the start available_units is 6, stock_status is LOW (0 < 6 < 12) and assortment_status is BROKEN (S and XL out)"
            - "PATCH /allocation/store-positions/{positionId} accepts only min_units, max_units, weekly_forecast_units, trailing_4wk_sales_units and on_order_units"
            - "PATCH /allocation/items/{itemId} accepts only replenishment_model_override and retail_price_usd"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "M", units: 4 }, { size_code: "L", units: 2 }], on_order_units: 0, min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: Allocator
            - call: "PATCH /allocation/store-positions/${p1_id}"
              payload: { min_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "PATCH /allocation/store-positions/${p1_id}"
              payload: { max_units: 5 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "PATCH /allocation/store-positions/${p1_id}"
              payload: { on_order_units: 10 }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "PATCH /allocation/store-positions/${p1_id}"
              payload: { weekly_forecast_units: 12, trailing_4wk_sales_units: 40 }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "PATCH /allocation/items/${item_id}"
              payload: { retail_price_usd: 42.00 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "GET /allocation/store-positions"
              payload: { stock_status: "OVERSTOCK" }
              as: Allocator
            - call: "GET /allocation/store-positions"
              payload: { assortment_status: "BROKEN" }
              as: Allocator
            - call: "GET /allocation/items/${item_id}"
              payload: {}
              as: PlanningAdmin
          assert:
            - "Baseline read: available_units == 6, stock_status == LOW, broken_size_count == 2, assortment_status == BROKEN, version == 1"
            - "PATCH min_units 12 -> 5 re-derives stock_status to IN_STOCK (5 <= 6 <= 48) and bumps version to 2, while assortment_status stays BROKEN and broken_size_count stays 2"
            - "PATCH max_units 48 -> 5 re-derives stock_status to OVERSTOCK (6 > 5) and bumps version to 3 - the same field moved twice by two different inputs"
            - "PATCH on_order_units 0 -> 10 bumps version to 4 but leaves available_units at 6 and stock_status at OVERSTOCK: on-order units are visible to the FORWARD_LOOKING need only and never to the stock bands"
            - "PATCH of weekly_forecast_units 12 and trailing_4wk_sales_units 40 in one body bumps version to 5 and changes no derived field at all - need is computed at propose time, not stored on the position"
            - "on_hand_units and size_on_hand are unpatchable by construction (absent from the input list), so the assortment dimension cannot be repaired through CRUD - only ship / confirm-receipt / transfer receive move sizes"
            - "Both PlanningAdmin and Allocator are accepted on the position PATCH, matching the declared role pair, and neither call needed an expected_version - the position is an OCC PARENT, not a child"
            - "PATCH retail_price_usd 36.50 -> 42.00 bumps Item.version by 1 and leaves replenishment_model == DEMAND_DRIVEN and lifecycle_state == BROKEN untouched"
            - "GET /allocation/store-positions?stock_status=OVERSTOCK returns the position and ?assortment_status=BROKEN returns the same row - one row, two orthogonal filters, both true at once"
      - name: the_six_transfer_action_endpoints_each_move_one_edge
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/approve
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/reject
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/dispatch
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/receive
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/cancel
        excluded_because:
          difficulty_instance: transfer_recommendation_forks_to_rejected_cancelled_and_expired
          rationale: "All six action endpoints of the recommendation are driven there across four sibling rows, each one landing on a different terminal state from the same PROPOSED start, with the reason strings and the version bumps asserted per call."
      - name: the_consolidation_transfer_carries_its_action_back_and_forth
        claim_type: cross_reference_link
        grounds:
          - entities.TransferRecommendation.fields.assortment_action_id
          - endpoints.GET /allocation/transfer-recommendations
          - endpoints.POST /allocation/assortment-actions/{actionId}/execute
        excluded_because:
          difficulty_instance: transfer_receive_cascades_position_then_item_then_assortment_action
          rationale: "The link is traversed in both directions there: execute writes assortment_action_id onto the created transfer, and the transfer reaching RECEIVED walks back up the same edge to move the action to EXECUTED and the item out of CONSOLIDATION_PENDING."
      - name: the_same_endpoint_is_permitted_or_refused_by_parent_state
        claim_type: conditional_action
        grounds:
          - validations[priority:9]
          - endpoints.POST /allocation/allocation-lines/{lineId}/ship
          - endpoints.POST /allocation/allocation-runs/{runId}/commit
        excluded_because:
          difficulty_instance: locked_program_blocks_decisions_but_not_line_ship_or_confirm_receipt
          rationale: "That instance is exactly this claim: the twelve decision endpoints and the three logistics endpoints are called under one LOCKED program and split into refusals and successes, then the lock is released and the refused calls are replayed successfully."
  # section 1.6 errors: every declared code is reachable and distinguishable
  - section: errors
    instances:
      - name: five_uniqueness_codes_are_distinct_and_all_scoped_to_the_program
        claim_type: error_triggerable
        grounds:
          - validations[priority:15]
          - errors.ERR_DUPLICATE_STORE_CODE
          - errors.ERR_DUPLICATE_SKU_CODE
          - errors.ERR_DUPLICATE_EVENT_CODE
          - errors.ERR_DUPLICATE_POSITION
          - errors.ERR_DUPLICATE_PROFILE_CODE
        distinguishing_aspect: |
          One priority rung carries five different error ids, and an implementation that collapses them into
          a single ERR_DUPLICATE passes every uniqueness test except this one. All five are triggered in a
          row on the same program, and the store code is then re-created successfully inside a SECOND
          program to prove the constraint is (program_id, code) rather than global. The event-code case is
          doubly loaded: the duplicate EV-FALL also overlaps the already-SCHEDULED EV-FALL window, so a
          correct implementation must answer the uniqueness code at rung 15 rather than the window-conflict
          code at rung 23 - and the immediately following EV-WINTER, which is unique but genuinely
          overlapping, must answer the window code, which is the only way to show the two are not confused.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE containing store 0101, size profile TOP-4SZ, item SKU-1001 and a position for (0101, SKU-1001)"
            - "PromoEvent EV-FALL is PROGRAM-scoped over 2026-08-10..2026-08-14 at 13000bp and has been SCHEDULED"
            - "A second program FA26 Kids Tops exists and is empty"
            - "The logical clock is 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
