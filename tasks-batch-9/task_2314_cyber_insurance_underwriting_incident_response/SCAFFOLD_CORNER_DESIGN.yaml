      - name: insured_account_system_fields_generated_and_client_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.InsuredAccount
          - response_envelope
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-owned: a POST that smuggles id and version
          still returns a server-minted id different from the submitted one and version 1.
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "u-underwriter-1"
          trigger:
            - call: "POST /cyber/insured-accounts"
              payload: { legal_name: "Aurora Health", industry_code: "HEALTHCARE", annual_revenue_usd: 43800000, record_count: 12345, primary_dependency_key: "CSP_ALPHA", id: "00000000-0000-4000-8000-000000000000", version: 99 }
              as: Underwriter
              as_user_id: "u-underwriter-1"
              captures: { acct_sys_id: "$.data.id" }
          assert:
            - "$.data.id != 00000000-0000-4000-8000-000000000000, proving the submitted id was ignored"
            - "InsuredAccount.${acct_sys_id}.version == 1, not 99"
            - "InsuredAccount.${acct_sys_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "InsuredAccount.${acct_sys_id}.open_remediation_count == 0"
