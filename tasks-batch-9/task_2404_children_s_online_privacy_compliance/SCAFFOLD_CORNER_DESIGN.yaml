            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_a}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", total_users: 4000, users_under_13: 800, sample_verified: true }
              as: ComplianceOfficer
              captures: { ev_a2: $.data.id, seq_a2: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_a}", evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "AGE_SCREEN_LOG", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", total_users: 6000, users_under_13: 3200, sample_verified: true }
              as: ComplianceOfficer
              captures: { ev_a3: $.data.id, seq_a3: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_a}", evidence_kind: "DESIGN_FACTOR", factor_code: "VISUAL_CONTENT", rating: "STRONG" }
              as: ComplianceOfficer
              captures: { ev_a4: $.data.id, seq_a4: $.data.evidence_sequence }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_b}", evidence_kind: "DESIGN_FACTOR", factor_code: "MUSIC_AUDIO", rating: "STRONG" }
              as: ComplianceOfficer
              captures: { ev_b1: $.data.id, seq_b1: $.data.evidence_sequence }
          trigger:
            - call: "GET /online-services/${svc_a}/determination-evidence"
              payload: { limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { all_total: $.meta.total_count, first_seq: "$.data[0].evidence_sequence", last_kind: "$.data[3].evidence_kind" }
            - call: "GET /online-services/${svc_a}/determination-evidence"
              payload: { evidence_kind: "DESIGN_FACTOR", limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { design_total: $.meta.total_count, design_first: "$.data[0].evidence_sequence", design_second: "$.data[1].evidence_sequence" }
            - call: "GET /online-services/${svc_a}/determination-evidence"
              payload: { evidence_kind: "AUDIENCE_SAMPLE", measurement_method: "PANEL", limit: 100, offset: 0 }
              as: PrivacyEngineer
              captures: { panel_total: $.meta.total_count, panel_row: "$.data[0].id" }
            - call: "GET /online-services/${svc_a}/determination-evidence"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              captures: { page_total: $.meta.total_count, page_first: "$.data[0].evidence_sequence", page_more: $.meta.has_more }
            - call: "GET /online-services/${svc_b}/determination-evidence"
              payload: { limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { b_total: $.meta.total_count, b_first_seq: "$.data[0].evidence_sequence" }
          assert:
            - "${seq_a1} == 1, ${seq_a2} == 2, ${seq_a3} == 3, ${seq_a4} == 4 and ${seq_b1} == 1 (per-service counters, not global)"
            - "${all_total} == 4, ${first_seq} == 1, ${last_kind} == DESIGN_FACTOR (ordered by evidence_sequence ASC)"
            - "${design_total} == 2 with ${design_first} == 1 and ${design_second} == 4 (the filter preserves the sequence order and skips the two samples)"
            - "${panel_total} == 1 and ${panel_row} == ${ev_a2} (the AGE_SCREEN_LOG row is excluded by measurement_method even though it is also an AUDIENCE_SAMPLE)"
            - "${page_total} == 4, ${page_first} == 3, ${page_more} == false (limit 2 offset 2 returns the tail)"
            - "${b_total} == 1 and ${b_first_seq} == 1 (service B's row never leaks into service A's lookup and vice versa)"

      - name: determination_endpoint_writes_only_the_determination_axis
        claim_type: conditional_action
        grounds:
