      - name: work_assignment_ranges_are_half_open_and_capacity_sums_only_the_overlapping_set
        grounds:
          - calculations.work_assignment_hour_capacity
          - validations[priority=50]
          - errors.ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED
          - constants.MAX_SCHEDULED_WEEKLY_HOURS
        distinguishing_aspect: |
          Assignment ranges are HALF-OPEN, the opposite convention to the
          authorization periods in the previous instance: an assignment ending
          2026-10-01 and one starting 2026-10-01 do not overlap, so 35 + 20 hours
          coexist. Capacity is summed only over the overlapping PROPOSED/ACTIVE set,
          so 35 + 25 == 60 is admitted at the exact maximum while one further hour
          inside the same window (61) is refused, and 20 + 25 in the adjacent window
          stays admissible.
