          assert:
            - "${lifecycle_at_create} == UNPUBLISHED and ${lifecycle_after_activate} == ACTIVE and ${susp_after_activate} == 0"
            - "${lifecycle_s1} == SUSPENDED and ${susp_1} == 1"
            - "${lifecycle_r1} == ACTIVE and ${reason_r1} == null"
            - "${lifecycle_s2} == SUSPENDED and ${susp_2} == 2"
            - "${lifecycle_r2} == ACTIVE and ${susp_final} == 2 — the state returned to its start value but the cycle counter did not"
            - "Alert.${al_id}.review_state == APPROVED throughout: the lifecycle cycle never touches the review dimension"

      - name: non_linear_vendor_release_fork_join_divergent_side_effects
        grounds:
          - state_machines.VendorContentRelease.RECEIVED_to_IMPACT_ANALYZED_FAST_TRACK
          - state_machines.VendorContentRelease.RECEIVED_to_IMPACT_ANALYZED_CLINICAL_REVIEW
          - state_machines.VendorContentRelease.IMPACT_ANALYZED_FAST_TRACK_to_ACTIVATED
          - state_machines.VendorContentRelease.IMPACT_ANALYZED_CLINICAL_REVIEW_to_ACTIVATED
          - calculations.vendor_release_impact_score
          - validations[priority=26]
        distinguishing_aspect: |
          VendorContentRelease is a branching fork-join on a third entity: the same
          RECEIVED state forks on the 25-point impact threshold into two distinct
          IMPACT_ANALYZED states that rejoin at ACTIVATED with genuinely different
          side-effect and permission sets — the FAST_TRACK arm activates under
          PharmacyInformaticist and tolerates an unjustified SUPPRESS delta, while the
          CLINICAL_REVIEW arm rejects that same role and demands the justification.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a pharmacist and a committee chair exist."
            - "Release A carries four deltas weighing 24 points: two SEVERITY_INCREASED CONTRAINDICATED (9 each), one NEW_INTERACTION MAJOR (3) and one DOSING_BOUND_CHANGED MODERATE (3)."
            - "Release B carries the same four deltas plus one RETIRED_INTERACTION (2), weighing 26 points."
            - "Every delta on both releases is dispositioned; on each release the last delta is SUPPRESS, justified on B and unjustified on A."
