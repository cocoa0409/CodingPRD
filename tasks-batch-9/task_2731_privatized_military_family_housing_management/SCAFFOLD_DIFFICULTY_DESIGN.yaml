  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Three instances on three different entities: Lease (two parallel state
  # dimensions), WorkOrder (cycle with a hard budget and a divergent terminal
  # branch of the same trigger), HazardCase (fork with divergent side-effect
  # sets that rejoin at one state).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: lease_parallel_occupancy_and_allotment_dimensions
        grounds:
          - state_machines.Lease.PENDING_MOVE_IN_to_OCCUPIED
          - state_machines.Lease.ACTIVE_to_SUSPENDED
          - state_machines.Lease.SUSPENDED_to_ACTIVE
          - state_machines.Lease.OCCUPIED_to_NOTICE_GIVEN
          - state_machines.Lease.NOTICE_GIVEN_to_TERMINATED
          - entities.Lease.fields.occupancy_status
          - entities.Lease.fields.allotment_status
        distinguishing_aspect: |
          Lease carries TWO independent state dimensions: move-in advances both
          at once (PENDING_MOVE_IN -> OCCUPIED and NOT_STARTED -> ACTIVE), a
          hazard assessment moves only the allotment dimension
          (ACTIVE -> SUSPENDED) while occupancy_status stays OCCUPIED, a
          clearance moves only the allotment dimension back
          (SUSPENDED -> ACTIVE), a termination notice moves only the occupancy
          dimension (OCCUPIED -> NOTICE_GIVEN) while allotment_status stays
          ACTIVE, and only terminate closes both — this is the Lease entity, not
          the WorkOrder cycle or the HazardCase fork below.
        test_recipe:
          setup:
            - "One installation, one 2-bedroom TOWNHOME unit, one E5 sponsor with three full-time-custody dependents."
            - "Lease 1 is OCCUPIED / ACTIVE on that unit from 2026-09-01 with net_rent_cents 218150 and daily_rent_cents 7172."
