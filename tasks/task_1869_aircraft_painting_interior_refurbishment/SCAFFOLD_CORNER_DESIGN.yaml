            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-T20", painted_area_sqft: 3500, coat_count: 2, stripe_pct: 0.0 }, as: DesignLead, captures: { sch_a: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_a}/submit", payload: {}, as: DesignLead }
            - { call: "POST /completion/paint-schemes/${sch_a}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { gal_a: $.data.material_estimate_gallons, cost_a: $.data.material_estimate_cost_cents, prog_v1: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-T21", painted_area_sqft: 2400, coat_count: 3, stripe_pct: 0.0 }, as: DesignLead, captures: { sch_b: $.data.id } }
            - { call: "POST /completion/paint-schemes/${sch_b}/submit", payload: {}, as: DesignLead }
          trigger:
            - { call: "POST /completion/paint-schemes/${sch_b}/approve", payload: { expected_program_version: "${prog_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { gal_b: $.data.material_estimate_gallons, cost_b: $.data.material_estimate_cost_cents } }
          assert:
            - "gal_a == 20 and cost_a == 370000 (20 <= 20 -> tier1 boundary inclusive)"
            - "gal_b == 21 and cost_b == 362250 (21 x 17250 — every gallon repriced, proving average-rate tiers)"

      - name: projection_excludes_disputed_events
        claim_type: input_set_filtering
        grounds:
          - calculations.delivery_penalty
          - state_machines.DelayEvent.REPORTED_to_DISPUTED
        distinguishing_aspect: "Input-set filtering: a DISPUTED excusable event is excluded from BOTH variants. With a 5-day CUSTOMER_CAUSED event DISPUTED and clock 2026-09-03, the projection still reads 300,000 (2 days past unadjusted 2026-09-01); wrongly including it would push the adjusted date to 2026-09-06 and read 0."
        test_recipe:
          setup: ["program QUOTED; 5-day CUSTOMER_CAUSED event created then DISPUTED by the customer; clock 2026-09-03"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/delay-events", payload: { program_id: "${prog_id}", category: "CUSTOMER_CAUSED", impact_days: 5, reason: "disputed scope wait" }, as: ProgramManager, captures: { ev_id: $.data.id } }
            - { call: "POST /completion/delay-events/${ev_id}/dispute", payload: {}, as: CustomerRep, as_user_id: "${cust_id}", captures: { ev_st: $.data.status } }
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: CenterAdmin }
          trigger:
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { proj: $.data.projected_penalty_cents, cdd: $.data.committed_delivery_date } }
          assert:
            - "ev_st == DISPUTED and cdd == 2026-09-01 (unchanged)"
            - "proj == 300000 (2 days x 150000) — DISPUTED excluded from the projection input set"

      - name: variant_divergence_covered
        claim_type: variant_divergence
        grounds:
          - calculations.weight_delta
        excluded_because:
          difficulty_instance: weight_delta_provisional_vs_final_diverge
          rationale: "Both variants executed on identical fixture and deltas asserted distinct (41.7 vs 38.6)."

      - name: variant_selection_covered
        claim_type: variant_selection
        grounds:
          - calculations.booth_utilization_fee
        excluded_because:
          difficulty_instance: booth_fee_scheduled_vs_actual_diverge
          rationale: "Scheduled fee asserted while BOOKED and actual fee after COMPLETED — variant selected by lifecycle moment."

      - name: variant_reconciliation_covered
        claim_type: reconciliation
        grounds:
          - calculations.delivery_penalty
        excluded_because:
          difficulty_instance: penalty_projection_vs_settlement_diverge
          rationale: "Projection read (300,000) then settlement persisted at issuance (1,050,000) — the variant switch delta IS the assertion."

  # ------------------------------------------------------------ Validations
  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID headers are rejected 401 ERR_UNAUTHENTICATED before role, existence or state checks (the call below is issued with NO auth headers)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401) — the test harness omits both auth headers for this call"

      - name: existence_precedes_state_on_advance
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
        distinguishing_aspect: "Advancing a nonexistent program id returns 404 ERR_NOT_FOUND, never a 409 state error — existence (P4) precedes state (P7)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /completion/programs/11111111-2222-3333-4444-555555555555/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: defer_without_reason_rejected_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_DEFER_REASON_REQUIRED]
        distinguishing_aspect: "A non-safety item within the delivery window still requires defer_reason; omitting it yields 422 ERR_DEFER_REASON_REQUIRED (constraint P21, reached only after safety/temporal pass)."
        test_recipe:
          setup: ["program INDUCTED; non-safety discovery item ESTIMATED; clock 2026-08-01 (before committed date)"]
