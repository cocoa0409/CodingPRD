      - name: invariant_region_premium_revenue_conserved_on_transfer_cancellation
        grounds:
          - state_machines.MemberTransfer.PENDING_EFFECTIVE_to_CANCELLED
          - calculations.capitation_rate_cents
          - entities.Region.fields.premium_revenue_cents
          - entities.Member.fields.region_id
        distinguishing_aspect: "Conserved quantity is SYSTEM-WIDE CAPITATION: completing then re-transferring a member across two regions preserves the total premium revenue exactly, which the check can distinguish from a drift picked up by a mid-flight cancellation."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-09-01T00:00:00Z."
            - "Two OPEN regions each with one member; a transfer from the first to the second is requested, accepted, completed, and then a second transfer back is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regions"
