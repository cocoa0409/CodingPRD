            - call: "POST /accreditation/surveys/${resurvey_id}/complete"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um1}" }
              as: AccreditationOfficer
              captures: { rescore_um1: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_cr1}" }
              as: AccreditationOfficer
              captures: { rescore_cr1: $.data.id }
          assert:
            - "AccreditationOutcome.${outcome_r}.status == DENIED and must_pass_failure_count == 2 and composite_score == 58.30"
            - "Survey.${resurvey_id}.frozen_cap_closure_rate == 0.5000 (frozen with 1 of 2 CAPs VERIFIED at confirm)"
            - "verifying CAP-CR1 after confirm did not change the frozen rate (still 0.5000)"
            - "old ElementScore.${score_um1}.status == VOIDED and old ElementScore.${score_cr1}.status == VOIDED after resurvey complete"
            - "ElementScore.${rescore_um1}.scoring_basis == RESURVEY and awarded_points == 2.00 (min(4, 0 + round(0.5*4.00,2))) — NOT 4.00 (live rate 1.0) "
            - "ElementScore.${rescore_cr1}.awarded_points == 2.50 (min(4, 1.00 + round(0.5*3.00,2)=1.50))"
            - "ElementScore.${rescore_um1}.forfeited_points == 2.00 and ElementScore.${rescore_cr1}.forfeited_points == 1.50"

