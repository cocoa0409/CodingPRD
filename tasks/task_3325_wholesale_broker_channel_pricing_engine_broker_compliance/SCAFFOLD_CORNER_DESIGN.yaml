              captures: { b_v_fund921: $.data.version }
            - call: "POST /wholesale-channel/quality-control-reviews"
              payload: { loan_submission_id: "${l921}", defect_type: "TITLE_DEFECT", severity: "CRITICAL", remediation_status: "NONE" }
              as: QualityControlAnalyst
              captures: { qc921: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/quality-control-reviews/${qc921}/repurchase"
              payload: {}
              as: QualityControlAnalyst
              captures: { b_v_re921: $.data.version }
          assert:
            - "Broker.${b}.rolling_funded_volume_cents == 30000000 before the repurchase"
            - "LoanSubmission.${l921}.repurchase_exposure_cents == 30000000"
            - "LoanSubmission.${l921}.repurchase_exposure_cents != 15000000, ruling out the volume share alone"
            - "Broker.${b}.rolling_funded_volume_cents == 0 after the repurchase"

      - name: defect_multiplier_applied_at_the_open_tier_value
        claim_type: Precision
        grounds:
          - calculations.defect_multiplier
          - calculations.weighted_defect_points
          - entities.Broker.fields.rolling_quality_score
        distinguishing_aspect: "A CRITICAL APPRAISAL_DEVIATION weighs 9.00 points and, read at open_defect_tier 1, is debited at the 1.25 multiplier for exactly 11.25 points, leaving rolling_quality_score at 88.75."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with one funded loan, one OPEN defect already on file at tier 1 and a quality score of 100.00."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
            - *k_uw
            - *k_cond
            - *k_ctc
            - *k_fund
            - call: "POST /wholesale-channel/quality-control-reviews"
              payload: { loan_submission_id: "${l}", defect_type: "UNDISCLOSED_LIABILITY", severity: "MAJOR", remediation_status: "NONE" }
              as: QualityControlAnalyst
              captures: { qc922a: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/quality-control-reviews"
              payload: { loan_submission_id: "${l}", defect_type: "APPRAISAL_DEVIATION", severity: "CRITICAL", remediation_status: "OPEN" }
              as: QualityControlAnalyst
              captures: { error_id_dup_review: $.data.error_id }
          assert:
            - "Broker.${b}.open_defect_tier == 0 before the second review, because the first review carries remediation_status NONE"
            - "the second creation returns 409 and error_id_dup_review == ERR_QC_REVIEW_EXISTS"
            - "Broker.${b}.rolling_quality_score == 95.00, the 5.00-point MAJOR liability debit at the tier-0 multiplier"
            - "Broker.${b}.rolling_quality_score != 83.75, ruling out a second CRITICAL appraisal finding being counted"

      - name: variant_divergence_and_reconciliation_covered_by_dual_variant_rule
        claim_type: Variant Divergence
        grounds:
          - calculations.repurchase_exposure.variants.compensating_reversal
          - calculations.repurchase_exposure.variants.flat_reversal
          - calculations.pricing_quote_note_rate.variants.sum_then_round
          - calculations.pricing_quote_note_rate.variants.round_per_component
        distinguishing_aspect: "Both dual-variant calculations are asserted against their rejected interpretation inside the §1.8 dual-variant rule."
        excluded_because:
          difficulty_instance: dual_variant_calc / repurchase_exposure_pair_share_vs_flat_reversal
          rationale: "The divergence assertions live in the two named §1.8 dual-variant instances."

      - name: tiered_rate_boundaries_covered_by_difficulty_rule
        claim_type: threshold_boundary
        grounds:
          - calculations.pricing_quote_price_points.constants.PLATINUM_MAX_POINTS
          - calculations.overall_rate_adjustment.constants.CREDIT_BUCKETS
        distinguishing_aspect: "The tier and bucket boundary behaviour is asserted by the §1.8 boundary-precision and combinatorial instances rather than repeated here."
        excluded_because:
          difficulty_instance: boundary_precision_check / credit_bucket_720_inclusive_and_ltv_700_boundary
          rationale: "The named §1.8 instance pins the inclusive bucket edges and the provisional-tier inclusive edges."

      - name: funded_and_commitment_rollups_after_compensating_reversals
        claim_type: aggregation
        grounds:
          - calculations.funded_volume_rollup
          - calculations.compensation_commitment_reconciliation
        distinguishing_aspect: "Aggregation-after-reversal is asserted by the two §1.8 compensating-invariant instances."
        excluded_because:
          difficulty_instance: compensating_invariant / funded_volume_zero_sum_on_fund_and_repurchase
          rationale: "Reversal arithmetic on both conserved quantities is asserted in the named §1.8 instances."

      - name: broker_tier_banded_score_with_volume_cap
        claim_type: Correct Result
        grounds:
          - calculations.broker_tier
          - calculations.broker_financial_strength_score.constants.ATTAINMENT_NEAR_RATIO
          - entities.Broker.fields.tier
        distinguishing_aspect: "A review scoring the maximum 100.00 bands to TIER_1, but the BELOW_EXPECTATION volume band caps it down to TIER_2, so the score and the tier disagree by design."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B submitted with an unexpired TX licence; the volume expectation is 100000000 cents."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/financial-reviews"
              payload: { net_worth_cents: 300000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 50000000, audit_attested: true }
              as: ChannelManager
              captures: { fr923: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr923}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b_v_fr923: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b}/approve"
              payload: {}
              as: ChannelManager
              captures: { b_v_appr923: $.data.version }
          assert:
            - "FinancialReview.${fr923}.computed_financial_strength_score == 100.00"
            - "Broker.${b}.financial_strength_score == 100.00"
            - "Broker.${b}.tier == TIER_2, the rotated cap for a BELOW_EXPECTATION band, not TIER_1"
            - "FinancialReview.${fr923}.status == PASSED and is_current == true"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_user_context_header_is_the_first_check
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_USER_CONTEXT
        distinguishing_aspect: "The header check is priority 1, so a broker creation with no role header and a duplicate nmls_id answers ERR_MISSING_USER_CONTEXT rather than the uniqueness conflict."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One broker already submitted with NMLS-3325930."
          setup_api_calls:
            - *k_clock
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Header First Brokers Inc", nmls_id: "NMLS-3325930", home_state: "TX", volume_expectation_cents: 50000000 }
              as: ChannelManager
              captures: { b930: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Header First Duplicate LLC", nmls_id: "NMLS-3325930", home_state: "NV", volume_expectation_cents: 50000000 }
              as: Anonymous
              captures: { error_id_noctx: $.data.error_id }
          assert:
            - "the response status is 400 and error_id_noctx == ERR_MISSING_USER_CONTEXT"
            - "error_id_noctx != ERR_DUPLICATE_NMLS_ID, ruling out the business uniqueness check running first"
            - "GET /wholesale-channel/brokers?limit=100 returns exactly 1 row"

      - name: reviewer_role_cannot_approve_brokers
        claim_type: RBAC denial
        grounds:
          - validations[priority=2]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
          - roles.ChannelManager.exclusive_operations
        distinguishing_aspect: "Broker approval is exclusive to ChannelManager, so an Underwriter whose role is valid but unwelcome is refused with ERR_INSUFFICIENT_PERMISSIONS before the state check, even from a SUBMITTED broker."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B submitted."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
          trigger:
            - call: "POST /wholesale-channel/brokers/${b}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { error_id_role: $.data.error_id }
          assert:
            - "the response status is 403 and error_id_role == ERR_INSUFFICIENT_PERMISSIONS"
            - "error_id_role != ERR_FINANCIAL_REVIEW_PENDING"
            - "Broker.${b}.status is still SUBMITTED"

      - name: malformed_body_enum_outranks_every_business_check
        claim_type: Violation → Error
        grounds:
          - validations[priority=29]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "The body well-formedness check runs last in the ordering but is the only one triggered here, so an out-of-enum occupancy_type answers ERR_INVALID_REQUEST without reaching the sheet-status or eligibility gates."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a PUBLISHED sheet."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_approve
            - *k_sheet
          trigger:
            - call: "POST /wholesale-channel/rate-sheets/${rs}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "VACATION_HOME", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs_v}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_enum930: $.data.error_id }
          assert:
            - "the response status is 400 and error_id_enum930 == ERR_INVALID_REQUEST"
            - "error_id_enum930 != ERR_PRODUCT_NOT_ELIGIBLE and != ERR_PRICING_QUOTE_SUPERSEDED"
            - "GET /wholesale-channel/rate-sheets/${rs}/pricing-quotes returns 0 rows"
            - "GET /wholesale-channel/rate-sheets/${rs} still reports status PUBLISHED"

      - name: aggregate_eligibility_enforced_collectively_over_the_broker_loans
        claim_type: Aggregate validation
        grounds:
          - validations[priority=14]
          - entities.ProductEligibility.fields.max_loan_amount_cents
          - errors.ERR_PRODUCT_NOT_ELIGIBLE
        distinguishing_aspect: "Eligibility is validated against the aggregate submission figure: the same 40000000-cent loan passes against a 200000000-cent limit and 120000000-cent limit, and fails only against the 30000000-cent limit, proving the bound is inclusive on the aggregate amount."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a TX licence, a quote on file and a CONVENTIONAL eligibility capping the amount at 30000000 cents."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - call: "POST /wholesale-channel/brokers/${b}/product-eligibilities"
              payload: { product_code: "CONVENTIONAL", max_ltv: 0.9500, min_fico: 620, max_loan_amount_cents: 30000000 }
              as: ChannelManager
              captures: { pe930: $.data.id, b_v_pe930: $.data.version }
            - call: "POST /wholesale-channel/product-eligibilities/${pe930}/decision"
              payload: { outcome: "APPROVED", expected_broker_version: "${b_v_pe930}" }
              as: ChannelManager
              captures: { b_v_elig930: $.data.version }
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Aggregate Limit Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_amt: $.data.error_id }
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Aggregate Within Limit Borrower", property_state: "TX", loan_amount_cents: 30000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { l_ok: $.data.id }
          assert:
            - "the 40000000-cent submission returns 422 and error_id_amt == ERR_PRODUCT_NOT_ELIGIBLE"
            - "the 30000000-cent submission at the exact ceiling returns 201 and LoanSubmission.${l_ok}.status == SUBMITTED"
            - "LoanSubmission.${l_ok}.loan_amount_cents == 30000000"
            - "GET /wholesale-channel/loan-submissions?broker_id=${b} returns exactly 1 row"

      - name: conditional_validation_applies_only_when_posture_gates_the_operation
        claim_type: Conditional validation
        grounds:
          - validations[priority=12]
          - errors.ERR_BROKER_EXCLUSIVITY_RESTRICTED
          - entities.ExclusivityPolicy.fields.restriction_scope
        distinguishing_aspect: "The restriction only bites when the broker's posture has escalated to RESTRICTED and the policy's restriction_scope covers the attempt, so a LOAN_SUBMISSION-scoped policy blocks submission while leaving pricing quotes untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with two policies in breach, taking the posture to RESTRICTED, each scoped to LOAN_SUBMISSION."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - call: "POST /wholesale-channel/exclusivity-policies"
              payload: { broker_id: "${b}", competitor_identifier: "COMP-RESTRICT-ONE", competitor_name: "Restrict One Lending", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", status: "ACTIVE", restriction_scope: "LOAN_SUBMISSION" }
              as: ChannelManager
              captures: { pol_r1: $.data.id }
            - call: "POST /wholesale-channel/exclusivity-policies"
              payload: { broker_id: "${b}", competitor_identifier: "COMP-RESTRICT-TWO", competitor_name: "Restrict Two Lending", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", status: "ACTIVE", restriction_scope: "LOAN_SUBMISSION" }
              as: ChannelManager
              captures: { pol_r2: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Restricted Breach Borrower One", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", competitor_channel_identifier: "comp-restrict-one", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_breach1: $.data.error_id }
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Restricted Breach Borrower Two", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", competitor_channel_identifier: "comp-restrict-two", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_breach2: $.data.error_id }
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b}", pricing_quote_id: "${q}", borrower_name: "Restricted Clean Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan}" }
              as: BrokerUser
              as_user_id: "${b}"
              captures: { error_id_restricted: $.data.error_id }
          assert:
            - "the first breach returns 403 and error_id_breach1 == ERR_EXCLUSIVITY_POLICY_BREACH"
            - "the second breach returns 403 and error_id_breach2 == ERR_EXCLUSIVITY_POLICY_BREACH"
            - "Broker.${b}.exclusivity_status == RESTRICTED after two breached policies"
            - "the clean submission returns 403 and error_id_restricted == ERR_BROKER_EXCLUSIVITY_RESTRICTED, distinct from the breach identifier"
            - "GET /wholesale-channel/brokers/${b}/exclusivity-policies?status=ACTIVE returns exactly 2 rows"

  # ===========================================================================
  - section: endpoints
    instances:

