            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-06", units_sold: 270 }
              as: DistributorContact
              as_user_id: "${dist_id}"
            - call: "GET /brand-ops/distributors/${dist_id}"
              payload: {}
              as: ChannelManager
              captures: { att_before: $.data.attainment_actual_bps }
          trigger:
            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-05", units_sold: 500 }
              as: DistributorContact
              as_user_id: "${dist_id}"
              captures: { old_report_id: $.data.id }
