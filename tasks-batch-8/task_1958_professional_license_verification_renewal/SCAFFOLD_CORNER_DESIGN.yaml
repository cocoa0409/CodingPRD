# =============================================================================
# Task 1958 — Scaffold Corner Design (section 1.9 Coverage Index)
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: employee_created_with_derived_restriction_defaults
        claim_type: computed_fields
        grounds:
          - entities.Employee.fields.work_authorization
          - entities.Employee.fields.restriction_reason
          - calculations.employee_restriction
        distinguishing_aspect: "A new employee in a role with a mandatory requirement starts RESTRICTED/MISSING_LICENSE with zeroed money counters; an employee in an uncovered role starts AUTHORIZED."
        test_recipe:
          setup:
            - "RN type exists; STAFF_NURSE requires RN-CA"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
          trigger:
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.ent@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { wr: $.data.work_authorization, rr: $.data.restriction_reason, committed: $.data.reimbursement_committed_cents, paid: $.data.reimbursement_paid_cents, posture: $.data.screening_posture }
            - call: "POST /licensing/employees"
              payload: { full_name: "Walt Warehouse", work_email: "walt.ent@example.com", role_code: "WAREHOUSE" }
              as: HRPartner
              captures: { wr2: $.data.work_authorization, rr2: $.data.restriction_reason }
          assert:
            - "wr == \"RESTRICTED\" and rr == \"MISSING_LICENSE\""
            - "posture == \"CLEAR\" and committed == 0 and paid == 0"
            - "wr2 == \"AUTHORIZED\" and rr2 == null  (no requirement covers WAREHOUSE)"

      - name: license_created_with_pending_defaults
        claim_type: defaults
        grounds:
          - entities.License.fields.status
          - entities.License.fields.verification_posture
          - entities.License.fields.alert_tier
        distinguishing_aspect: "A newly registered license starts PENDING_VERIFICATION / NEVER_VERIFIED with zeroed CE tallies and the alert tier computed from days-to-expiry (333 days -> NONE)."
        test_recipe:
          setup:
            - "RN type and employee exist"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.def@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
          trigger:
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9001", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { st: $.data.status, posture: $.data.verification_posture, tier: $.data.alert_tier, cycle: $.data.cycle_ce_hours_validated, anchor: $.data.ce_cycle_anchor_on }
          assert:
            - "st == \"PENDING_VERIFICATION\" and posture == \"NEVER_VERIFIED\""
            - "cycle == 0.0 and anchor == \"2026-01-01\""
            - "tier == \"NONE\"  (333 days until expiry at the default clock 2026-08-01)"

      - name: get_nonexistent_license_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but unknown license id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "A license type exists so the server is initialized"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
          trigger:
            - call: "GET /licensing/licenses/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NOT_FOUND\" and HTTP status == 404"

      - name: list_employees_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope."
        test_recipe:
          setup:
            - "Two employees exist"
          setup_api_calls:
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.page@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
            - call: "POST /licensing/employees"
              payload: { full_name: "Nick Nurse", work_email: "nick.page@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
          trigger:
            - call: "GET /licensing/employees"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /licensing/employees"
              payload: { limit: 1, offset: 1 }
              as: ComplianceOfficer
          assert:
            - "page 1 (limit 1, offset 0) returns exactly 1 item with total_count == 2 and has_more == true"
            - "page 2 (limit 1, offset 1) returns exactly 1 item with has_more == false"

      - name: create_employee_missing_required_role_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required role_code on employee creation yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Server initialized (license type exists)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
          trigger:
            - call: "POST /licensing/employees"
              payload: { full_name: "No Role", work_email: "norole@example.com" }
              as: HRPartner
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" and HTTP status == 400"

      - name: duplicate_employee_email_rejected_case_insensitive
        claim_type: type_constraints
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "work_email uniqueness is case-insensitive: NORA.DUP@example.com collides with nora.dup@example.com."
        test_recipe:
          setup:
            - "One employee exists"
          setup_api_calls:
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.dup@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
          trigger:
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Again", work_email: "NORA.DUP@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_DUPLICATE_EMAIL\" and HTTP status == 409"

      - name: verification_event_system_fields_recorded
        claim_type: system_fields
        grounds:
          - entities.VerificationEvent.fields.verifier_user_id
          - entities.VerificationEvent.fields.next_verification_due_on
        distinguishing_aspect: "The append-only verification log stamps verifier_user_id from X-User-ID and echoes the computed next due date; events carry id/created_at but no version field."
        test_recipe:
          setup:
            - "RN type, employee, PENDING_VERIFICATION license (expires 2027-06-30)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.ve@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9002", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
          trigger:
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /licensing/licenses/${lic}/verification-events"
              as: ComplianceOfficer
              captures: { ev_on: "$.data[0].verified_on", ev_src: "$.data[0].source", ev_out: "$.data[0].outcome", ev_by: "$.data[0].verifier_user_id", ev_due: "$.data[0].next_verification_due_on" }
          assert:
            - "the event list contains exactly 1 event (total_count == 1)"
            - "ev_on == \"2026-08-01\" and ev_src == \"STATE_BOARD_API\" and ev_out == \"VERIFIED\""
            - "ev_by == \"officer-1\""
            - "ev_due == \"2027-01-28\"  (min(2026-08-01 + 180d, 2027-06-30))"

      - name: fk_reverse_licenses_listed_under_employee
        claim_type: parent_relationships
        grounds:
          - entities.License.fields.employee_id
        distinguishing_aspect: "GET /licensing/employees/{id}/licenses returns exactly that employee's licenses; an employee with none returns an empty array."
        test_recipe:
          setup:
            - "RN type; employee Nora with one license; employee Walt with none"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.fk@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Walt Warehouse", work_email: "walt.fk@example.com", role_code: "WAREHOUSE" }
              as: HRPartner
              captures: { emp2: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9003", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
          trigger:
            - call: "GET /licensing/employees/${emp}/licenses"
              as: ComplianceOfficer
              captures: { first: "$.data[0].id" }
            - call: "GET /licensing/employees/${emp2}/licenses"
              as: ComplianceOfficer
          assert:
            - "Nora's list contains exactly 1 license and first == \"${lic}\""
            - "Walt's list is empty (total_count == 0)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ce_rejected_activity_cannot_be_validated
        claim_type: invalid_transition
        grounds:
          - state_machines.CEActivity.LOGGED_to_VALIDATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VALIDATED is only reachable from LOGGED: validating an already-REJECTED activity fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "RN type, employee, ACTIVE license, one LOGGED CE activity"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.cerej@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9101", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Refresher", hours: 2.0, completed_on: "2026-03-01" }
              as: ComplianceOfficer
              captures: { ce: $.data.id }
            - call: "POST /licensing/ce-activities/${ce}/reject"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /licensing/ce-activities/${ce}/validate"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\""

      - name: expired_reinstatement_below_ce_gate_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=19]
          - errors[ERR_CE_HOURS_INSUFFICIENT]
          - state_machines.License.EXPIRED_to_ACTIVE
        distinguishing_aspect: "A cycle tally of 29.5 against a 30.0 requirement blocks reinstatement with ERR_CE_HOURS_INSUFFICIENT — the failing twin of the exact-boundary difficulty instance."
        test_recipe:
          setup:
            - "RN type (CE 30.0, grace 45d); employee with RN-CA license issued 2026-01-01, expires 2026-12-31, verified ACTIVE 2026-08-01"
            - "29.5 VALIDATED cycle hours (10.25->10.5, 9.0->9.0, 9.75->10.0)"
            - "clock at 2027-01-05: license EXPIRED"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.cefail@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9102", issued_on: "2026-01-01", expires_on: "2026-12-31" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course A", hours: 10.25, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce1: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course B", hours: 9.0, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce2: $.data.id }
            - call: "POST /licensing/licenses/${lic}/ce-activities"
              payload: { provider_name: "CEU Inc", activity_title: "Course C", hours: 9.75, completed_on: "2026-06-01" }
              as: ComplianceOfficer
              captures: { ce3: $.data.id }
            - call: "POST /licensing/ce-activities/${ce1}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce2}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/ce-activities/${ce3}/validate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ComplianceAdmin
          trigger:
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2027-01-05", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_CE_HOURS_INSUFFICIENT\"  (29.5 < 30.0)"
            - "License.${lic} remains EXPIRED"

      - name: revoked_license_verify_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.License
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is terminal: any verify attempt on a revoked license fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "RN type, employee, license verified ACTIVE then revoked via confirmed REVOCATION event"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.rev@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9103", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-31", event_type: "REVOCATION", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { de: $.data.id }
            - call: "POST /licensing/disciplinary-events/${de}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_STATE\" and HTTP status == 409"
            - "License.${lic} remains REVOKED"

      - name: second_open_suspension_keeps_license_suspended
        claim_type: conditional_cascade
        grounds:
          - state_machines.License.SUSPENDED_to_ACTIVE
          - state_machines.DisciplinaryEvent.CONFIRMED_to_RESOLVED
        distinguishing_aspect: "Resolve lifts the suspension only when no other open SUSPENSION event covers the license: resolving the first of two confirmed suspensions leaves the license SUSPENDED; resolving the second reactivates it."
        test_recipe:
          setup:
            - "RN type; STAFF_NURSE requires RN-CA; employee with ACTIVE license and two confirmed SUSPENSION events (license SUSPENDED)"
          setup_api_calls:
            - call: "POST /licensing/license-types"
              payload: { code: "RN", name: "Registered Nurse", ce_hours_required_per_cycle: 30.0, cycle_length_months: 24, verification_frequency_days: 180, grace_period_days: 45, requires_exclusion_screening: true, reimbursement_mode: "RECEIPT_BASED", reimburse_full_up_to_cents: 200000, reimburse_half_up_to_cents: 500000, flat_schedule_amount_cents: 0, hard_claim_cap_cents: 500000 }
              as: ComplianceAdmin
              captures: { lt_rn: $.data.id }
            - call: "POST /licensing/role-requirements"
              payload: { role_code: "STAFF_NURSE", license_type_id: "${lt_rn}", state_code: "CA", is_required: true }
              as: ComplianceAdmin
            - call: "POST /licensing/employees"
              payload: { full_name: "Nora Nurse", work_email: "nora.dbl@example.com", role_code: "STAFF_NURSE" }
              as: HRPartner
              captures: { emp: $.data.id }
            - call: "POST /licensing/licenses"
              payload: { employee_id: "${emp}", license_type_id: "${lt_rn}", state_code: "CA", license_number: "RN-9104", issued_on: "2026-01-01", expires_on: "2027-06-30" }
              as: ComplianceOfficer
              captures: { lic: $.data.id }
            - call: "POST /licensing/licenses/${lic}/verify"
              payload: { verified_on: "2026-08-01", source: "STATE_BOARD_API", outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-41", event_type: "SUSPENSION", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { de1: $.data.id }
            - call: "POST /licensing/licenses/${lic}/disciplinary-events"
              payload: { board_case_number: "B-42", event_type: "SUSPENSION", effective_on: "2026-08-01", received_via: "BOARD_FEED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { de2: $.data.id }
            - call: "POST /licensing/disciplinary-events/${de1}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
            - call: "POST /licensing/disciplinary-events/${de2}/confirm"
              payload: {}
              as: ComplianceOfficer
