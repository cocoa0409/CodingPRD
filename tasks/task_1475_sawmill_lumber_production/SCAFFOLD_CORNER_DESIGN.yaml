  # ---------------------------------------------- cross-cutting complexity ---
  - section: complexity_layers
    instances:
      - name: contract_amend_occ_conflict_and_success
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Amend with the observed version succeeds and bumps it; replaying the same observed version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["one DRAFT contract, version captured at creation"]
          setup_api_calls:
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { cid: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "PUT /api/sales-contracts/${cid}", payload: { contract_price_per_mbf_cents: 56000, expected_contract_version: "${cv}" }, as: MillManager, captures: { v2: $.data.version, p2: $.data.contract_price_per_mbf_cents } }
            - { call: "PUT /api/sales-contracts/${cid}", payload: { contract_price_per_mbf_cents: 57000, expected_contract_version: "${cv}" }, as: MillManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/sales-contracts/${cid}", payload: {}, as: MillManager, captures: { p3: $.data.contract_price_per_mbf_cents } }
          assert:
            - "first amend succeeds: v2 == ${cv} + 1 and p2 == 56000"
            - "second amend with the same observed version: err == ERR_STALE_VERSION (http 412)"
            - "p3 == 56000 (rejected amendment did not apply)"

      - name: ops_run_expires_contract_past_end_date
        claim_type: ops_run_checkpoint
        grounds: ["state_machines.SalesContract.ACTIVE_to_EXPIRED", "endpoints[POST /api/ops/runs]"]
        distinguishing_aspect: "The ops sweep flips ACTIVE contracts whose end_date is before the current logical date to EXPIRED and reports them."
        test_recipe:
          setup: ["ACTIVE contract with end_date 2026-08-10; clock advanced to 2026-08-11"]
          setup_api_calls:
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-08-10" }, as: MillManager, captures: { cid: $.data.id } }
            - { call: "POST /api/sales-contracts/${cid}/activate", payload: {}, as: MillManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/ops/runs", payload: {}, as: MillManager, captures: { expired: $.data.expired_contract_ids } }
            - { call: "GET /api/sales-contracts/${cid}", payload: {}, as: MillManager, captures: { c_st: $.data.status } }
          assert:
            - "expired contains ${cid}"
            - "c_st == EXPIRED"

      - name: derived_dry_mbf_reconciliation
        claim_type: derived_field_reconciliation
        grounds: ["calculations.dry_volume_estimate_vs_actual]"]
        excluded_because:
          difficulty_instance: dry_volume_estimated_vs_actual_reconciliation
          rationale: "Estimate -> actual reconciliation of dry_mbf asserted in §1.8."

      - name: degrade_refresh_via_ops_run
        claim_type: ops_run_checkpoint
        grounds: ["calculations.deck_degrade_pct", "endpoints[POST /api/ops/runs]"]
        excluded_because:
          difficulty_instance: degrade_boundary_exactly_14_days
          rationale: "Ops-run degrade refresh with day-14/day-21 boundary asserted in §1.8."

