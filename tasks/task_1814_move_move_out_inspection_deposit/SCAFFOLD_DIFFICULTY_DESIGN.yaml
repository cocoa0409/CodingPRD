  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: moveout_completion_requires_notice_given
        grounds:
          - state_machines.Inspection.DRAFT_to_COMPLETED
          - state_machines.Tenancy.OCCUPIED_to_NOTICE_GIVEN
        distinguishing_aspect: |
          Pair Inspection -> Tenancy: creating or completing a MOVE_OUT
          inspection is rejected while the tenancy is OCCUPIED (no notice);
          after give_notice flips the tenancy to NOTICE_GIVEN, the identical
          request succeeds. The inspection's valid transition set depends on
          the tenancy's state.
        test_recipe:
          setup:
            - "Canonical tenancy OCCUPIED (move-in completed), notice NOT yet given"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
          trigger:
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-11T10:00:00Z", scheduled_end_at: "2025-01-11T11:00:00Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-11T10:00:00Z", scheduled_end_at: "2025-01-11T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION while tenancy is OCCUPIED"
            - "After give_notice: POST /pm/inspections MOVE_OUT succeeds (201) with status DRAFT"
            - "Inspection.${mo}.status == DRAFT"

      - name: disbursement_requires_issued_statement
        grounds:
          - state_machines.DepositStatement.DRAFT_to_ISSUED
          - entities.Disbursement.fields.statement_id
        distinguishing_aspect: |
          Pair Disbursement -> DepositStatement: a REFUND disbursement is
          rejected while the tenancy's current statement is DRAFT; after the
          statement is issued, the identical request succeeds. The
          disbursement's validity depends on the statement's state.
        test_recipe:
          setup:
            - "Canonical tenancy VACATED, paint deduction 60,000c, statement created but still DRAFT"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "Tanya Tenant", lease_start_on: "2025-01-10", lease_end_on: "2026-08-10", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2025-01-10T09:00:00Z", scheduled_end_at: "2025-01-10T10:00:00Z" }
              as: PropertyManager
              captures: { mi: $.data.id }
            - call: "POST /pm/inspections/${mi}/items"
              payload: { area_name: "bedroom_paint", category: "PAINT", condition: "GOOD", photo_count: 2 }
              as: Inspector
              captures: { mi_item: $.data.id }
            - { call: "POST /pm/inspections/${mi}/complete", payload: {}, as: Inspector }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/tenancies/${ten}/give_notice", payload: {}, as: PropertyManager }
            - { call: "POST /pm/tenancies/${ten}/record_key_return", payload: { keys_returned: 2, fobs_returned: 1 }, as: PropertyManager }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten}", kind: "MOVE_OUT", inspector_user_id: "insp-1", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: PropertyManager
              captures: { mo: $.data.id }
            - call: "POST /pm/inspections/${mo}/items"
              payload: { area_name: "bedroom_paint", category: "PAINT", condition: "DAMAGED", photo_count: 4, determination: "TENANT_DAMAGE", linked_move_in_item_id: "${mi_item}", replacement_cost_cents: 90000 }
              as: Inspector
            - { call: "POST /pm/inspections/${mo}/complete", payload: {}, as: Inspector }
            - call: "GET /pm/tenancies/${ten}"
              as: PropertyManager
              captures: { ten_v: $.data.version }
            - call: "POST /pm/statements"
              payload: { tenancy_id: "${ten}", expected_tenancy_version: "${ten_v}" }
              as: PropertyManager
              captures: { stmt: $.data.id }
          trigger:
            - call: "POST /pm/disbursements"
              payload: { tenancy_id: "${ten}", statement_id: "${stmt}", kind: "REFUND", amount_cents: 1000, payee_name: "Tanya Tenant" }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ManagerAdmin }
            - { call: "POST /pm/statements/${stmt}/issue", payload: {}, as: PropertyManager }
            - call: "POST /pm/disbursements"
              payload: { tenancy_id: "${ten}", statement_id: "${stmt}", kind: "REFUND", amount_cents: 1000, payee_name: "Tanya Tenant" }
              as: PropertyManager
              captures: { disb: $.data.id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION while the statement is DRAFT"
            - "After issue: identical POST /pm/disbursements succeeds (201), Disbursement.${disb}.status == SENT"
            - "Tenancy.${ten}.reserved_cents == 1000"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: tenancy_lease_overlap_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_UNIT_OCCUPANCY_OVERLAP]
          - entities.Tenancy.fields.lease_start_on
        distinguishing_aspect: |
          Half-open interval semantics on resource Unit: lease
          [lease_start_on, lease_end_on). A back-to-back tenancy starting
          exactly on the predecessor's end date is ALLOWED (adjacency), while
          an interior overlap is rejected. This contrasts with the inspector
          window rule, where adjacency conflicts.
        test_recipe:
          setup:
            - "One unit; tenancy T1 lease [2026-01-01, 2027-01-01)"
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "T One", lease_start_on: "2026-01-01", lease_end_on: "2027-01-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten1: $.data.id }
          trigger:
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "T Two", lease_start_on: "2027-01-01", lease_end_on: "2028-01-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten2: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit}", tenant_display_name: "T Three", lease_start_on: "2026-06-01", lease_end_on: "2027-06-01", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent tenancy created (201): Tenancy.${ten2} exists — half-open adjacency allowed"
            - "${err} == ERR_UNIT_OCCUPANCY_OVERLAP for the interior-overlapping tenancy"
            - "HTTP status == 409"

      - name: inspector_window_closed_interval_adjacency_conflicts
        grounds:
          - validations[priority=8]
          - errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]
          - entities.Inspection.fields.scheduled_start_at
        distinguishing_aspect: |
          Closed interval semantics on resource Inspection (inspector's
          calendar): [scheduled_start_at, scheduled_end_at] inclusive — a new
          DRAFT inspection starting exactly when another ends CONFLICTS
          (no turnover gap), unlike the half-open lease rule. A different
          inspector at the same window is fine.
        test_recipe:
          setup:
            - "Two tenancies in PENDING_MOVE_IN on two units (MOVE_IN inspections schedulable)"
            - "Inspector insp-1 already holds DRAFT inspection 09:00-10:00 for tenancy A"
          setup_api_calls:
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: false, annual_interest_rate_bp: 0, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1B", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_b: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_a}", tenant_display_name: "T A", lease_start_on: "2026-01-05", lease_end_on: "2027-01-05", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_a: $.data.id }
            - call: "POST /pm/tenancies"
              payload: { unit_id: "${unit_b}", tenant_display_name: "T B", lease_start_on: "2026-01-05", lease_end_on: "2027-01-05", monthly_rent_cents: 150000, deposit_cents: 200000, keys_issued: 2, fobs_issued: 1 }
              as: PropertyManager
              captures: { ten_b: $.data.id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_a}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2026-01-05T09:00:00Z", scheduled_end_at: "2026-01-05T10:00:00Z" }
              as: PropertyManager
              captures: { mi_a: $.data.id }
          trigger:
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_IN", inspector_user_id: "insp-1", scheduled_start_at: "2026-01-05T10:00:00Z", scheduled_end_at: "2026-01-05T11:00:00Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
            - call: "POST /pm/inspections"
              payload: { tenancy_id: "${ten_b}", kind: "MOVE_IN", inspector_user_id: "insp-2", scheduled_start_at: "2026-01-05T10:00:00Z", scheduled_end_at: "2026-01-05T11:00:00Z" }
              as: PropertyManager
              captures: { mi_b: $.data.id }
          assert:
            - "${err} == ERR_INSPECTOR_SCHEDULE_CONFLICT (closed intervals: end == start touches)"
            - "Same window for insp-2 succeeds (201): Inspection.${mi_b}.status == DRAFT"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: cash_then_reverse_restores_refund_paid
        grounds:
          - state_machines.Disbursement.SENT_to_CASHED
          - state_machines.Disbursement.CASHED_to_REVERSED
          - calculations.deposit_reconciliation
        distinguishing_aspect: |
          Conserved quantity = deposit money (cents): the forward action
          mark_cashed and its compensating action reverse must leave
          refund_paid_cents, reserved_cents, and balance_remaining_cents
          identical to their pre-cash values, and the reconciliation formula
          balance = deposit + interest - billed + released - refund_paid
          - escheated - reserved holds on both sides (149,337c).
        test_recipe:
          setup:
            - "Canonical tenancy: timely statement issued 2026-08-10, refund_due 149,337c; REFUND disbursement 149,337c SENT (reserved 149,337, balance 0)"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
