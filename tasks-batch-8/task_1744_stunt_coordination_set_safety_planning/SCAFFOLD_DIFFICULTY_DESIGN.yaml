            - "Link 1: Production.${prod_id}.posture == STOPPED"
            - "Link 2: StuntSequence.${seq_id}.status == SAFETY_HOLD (caused by the stoppage)"
            - "Link 3: Rehearsal.${reh2}.status == CANCELLED (caused by the sequence hold, not by the incident directly)"

      - name: tc_inspection_quarantine_cascade
