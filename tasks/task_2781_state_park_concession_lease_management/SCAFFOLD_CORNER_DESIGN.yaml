      - name: submission_window_and_responsiveness_guards_each_return_their_own_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_GUARANTEE_BELOW_MINIMUM]
          - errors[ERR_OFFEROR_DEBARRED]
          - errors[ERR_SUBMISSION_WINDOW_OPEN]
          - errors[ERR_SUBMISSION_WINDOW_CLOSED]
          - errors[ERR_NO_RESPONSIVE_PROPOSAL]
        distinguishing_aspect: "A solicitation that attracts nothing admissible walks through five different refusals in one narrative: a guarantee one cent under the minimum annual guarantee, a debarred offeror whose numbers are otherwise perfect, a close attempted while the window is still open, a submission attempted at the exact deadline instant, and finally an award with an empty candidate set. The two window errors are mirror images gated on the same instant, and the deadline is inclusive-closed on the submission side and inclusive-open on the closing side, so the same timestamp rejects a proposal and permits a close."
