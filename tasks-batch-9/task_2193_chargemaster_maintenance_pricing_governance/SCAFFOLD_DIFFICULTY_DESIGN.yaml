  - name: boundary_precision_check__similarity_score_exactly_at_0_8000_threshold_on_mark_duplicate
    grounds:
    - calculations.duplicate_similarity_score
    - calculations.duplicate_similarity_score.variants.FUZZY_DESCRIPTION
    - entities.Facility.fields.duplicate_detection_mode
    - entities.ChargeItem.fields.duplicate_of_item_id
    - validations[priority=48]
    - errors.ERR_DUPLICATE_SIMILARITY_TOO_LOW
    - state_machines.ChargeItem.lifecycle_status.ACTIVE_to_INACTIVE
    distinguishing_aspect: 'The metric under test is the 4-decimal weighted similarity score against

      SIMILARITY_THRESHOLD = 0.8000 reached through POST

      /chargemaster/charge-items/{charge_item_id}/lifecycle action=MARK_DUPLICATE (a

      third distinct metric on a third distinct endpoint): a pair whose unrounded

      score is 0.79999 lands on exactly 0.8000 after the mandatory 4dp round-half-up

      and MUST be accepted under the >= comparison, a pair scoring 0.7900 MUST be

      rejected with ERR_DUPLICATE_SIMILARITY_TOO_LOW, and a third pair reaching

      exactly 0.80000 through a completely different weight composition (code 0.5 +

      jaccard 1.0000 x 0.3 + revenue-code 0) MUST also be accepted.

      '
    test_recipe:
      setup:
      - Logical clock left at the fixed startup default 2026-08-01T00:00:00Z.
      - Facility SIM with rounding_mode = NEAREST_CENT, aggregate_markup_limit_bp = 40000 and duplicate_detection_mode = FUZZY_DESCRIPTION.
      - Department GENERAL (manager_user_id = u_dm_gen). Two ACTIVE RevenueCodes 0300 and 0301, each with an identically-parameterised ACTIVE COST_PLUS_MARKUP PriceRule (default tiers, min_medicare_multiple_bp
        12000, market_cap_multiple_bp 11000).
      - Six ChargeItems, all code_type CPT with the SAME code_value 99213 and identical economics (cost_basis_cents 40000, medicare_rate_cents 20000, market_p75_cents 200000 -> gross_charge_cents 128000,
        standalone markup ratio 32000 bp so every APPROVE passes the 40000 bp limit); all repriced and driven to ACTIVE.
      - 'Pair 1 (score exactly 0.8000 via 0.79999): S1 ''ALPHA BETA'' and T1 ''ALPHA GAMMA'', both on revenue code 0300 -> code_match 1, rev_match 1, token intersection 1 / union 3 -> jaccard 0.3333.'
      - 'Pair 2 (score 0.7900, just below): S2 ''RED GREEN BLUE ONE TWO THREE'' and T2 ''RED GREEN BLUE FOUR FIVE SIX SEVEN'', both on revenue code 0300 -> code_match 1, rev_match 1, token intersection
        3 / union 10 -> jaccard 0.3000.'
      - 'Pair 3 (score exactly 0.80000 via a different composition): S3 on revenue code 0300 and T3 on revenue code 0301, both described ''OMEGA SIGMA DELTA'' -> code_match 1, rev_match 0, jaccard 1.0000.'
