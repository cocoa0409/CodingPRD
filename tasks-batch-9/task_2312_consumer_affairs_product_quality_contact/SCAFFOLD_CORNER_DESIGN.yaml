            - { call: "POST /regulatory-reports/${rr1}/submit", as: RegulatoryOfficer, as_user_id: "${ro2}", payload: { agency_reference: "AG-00002" }, captures: { e3: "$.data.error_id" } }
            - { call: "POST /regulatory-reports/${rr1}/determine", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: { determination: REPORTABLE, determination_note: "Changed my mind." }, captures: { e4: "$.data.error_id" } }
