            - call: "GET /feedlot/pens/${pb}"
              as: Any
              captures: { pb_occ: $.data.current_occupancy_head, pb_status: $.data.status }
          assert:
            - "d_value == 983815 (7 x (140000 in-cost/head + 545 accrued/head = (0 feed + 450 yardage + 5000 health)/10))"
            - "l_cur == 3 and l_deaths == 7 and l_dlc == 983815 (link 1: lot counters and cost pool)"
            - "a1_head == 0 and a2_head == 3 (link 2: waterfall absorbs 6 from the oldest-created assignment, spills 1 to the next)"
            - "pa_occ == 0 and pa_status == EMPTY (link 3: occupancy collapse flips pen D-01)"
            - "pb_occ == 3 and pb_status == OCCUPIED"

      - name: closeout_confirm_cascade_closeout_lot_invoice_owner
