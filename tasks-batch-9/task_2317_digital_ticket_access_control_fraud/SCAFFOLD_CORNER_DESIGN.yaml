      - name: gate_links_to_a_zone_of_the_same_event_only
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /events/{id}/gates]
          - validations[priority=6]
          - validations[priority=13]
          - errors.ERR_CROSS_EVENT_REFERENCE
          - errors.ERR_ZONE_NOT_FOUND
        distinguishing_aspect: |
          The link is validated three ways: an unresolvable access_zone_id is
          ERR_ZONE_NOT_FOUND (404), a zone belonging to the other Event is
          ERR_CROSS_EVENT_REFERENCE (422), and gate creation is refused once the Event has
          left DRAFT with ERR_EVENT_STATE_FORBIDS_OPERATION (409). The successful link is
          then discoverable through the access_zone_id filter.
        test_recipe:
          setup:
            - "Two DRAFT Events, each with one AccessZone (Z1 in EV1, Z2 in EV2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
