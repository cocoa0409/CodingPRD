            - "CirculationLine.${line_id}.gross_margin_cents == 24087000"
            - "CirculationLine.${line_id}.contribution_cents == 8787000"
            - "CirculationPlan.${plan_id}.planned_cost_cents == 15300000 and CirculationPlan.${plan_id}.planned_contribution_cents == 8787000"

      - name: provisional_then_final_rebate_band_evaluation_order_pinned
        grounds:
          - calculations.drop_provisional_cost_per_book
          - calculations.drop_allocation_waterfall
          - calculations.drop_cost_per_book
          - calculations.line_profitability
          - calculations.plan_profitability_rollup
          - entities.Drop.fields.provisional_cost_per_book_cents
          - entities.Drop.fields.print_rebate_bps
          - entities.CirculationLine.fields.unit_cost_cents
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency resolved by a pinned evaluation
          order: the unit cost depends on the print rebate band, the band depends on
          the quantity, and the quantity depends on the unit cost. The scaffold pins
          provisional-from-REQUESTED then waterfall then final-from-PLANNED exactly
          once: requested 125000 selects the 800 bps band (provisional 302), the
          waterfall spends the 20000000 budget at 302 producing planned_quantity
          66225, and the final figure re-derives the band from 66225 (500 bps,
          cost_per_book 309) WITHOUT ever re-basing the provisional rate — feeding
          309 back into the waterfall would change every allocated_quantity and spin
          the loop forever.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "Two leaf segments: S_BIG (50000 names, 620 bps, AOV 18500, rfm_score 1000) and S_SECOND (30000 names, 300 bps, AOV 9000, recency_days 200 / orders_12mo 3 / ltv_cents 26000 -> rfm_score 620, CORE, STANDARD)."
            - "Plan P1 with budget_cents 20000000 and a COMPLETED housefile-only merge-purge run."
            - "Drop 1 at page_count 94 with two PROPOSED HOUSEFILE lines: S_BIG requesting 95000 (created first) and S_SECOND requesting 30000, so requested_quantity_total is 125000 and lands in the 800 bps band."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_BIG", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 50000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_big_id: "$.data.id", seg_big_rfm: "$.data.rfm_score" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_SECOND", recency_days: 200, orders_12mo: 3, ltv_cents: 26000, housefile_count: 30000, avg_order_value_cents: 9000, historical_response_rate_bps: 300 }
              as: CirculationPlanner
              captures: { seg_second_id: "$.data.id", seg_second_rfm: "$.data.rfm_score" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 94 }
              as: CirculationPlanner
              captures: { drop_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_big_id}", requested_quantity: 95000 }
              as: CirculationPlanner
              captures: { line_big_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_second_id}", requested_quantity: 30000 }
              as: CirculationPlanner
              captures: { line_second_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/drops/${drop_id}/allocate"
              payload: {}
              as: CirculationPlanner
          assert:
            - "${seg_big_rfm} == 1000 and ${seg_second_rfm} == 620  # S_BIG outranks S_SECOND in the waterfall"
            - "Drop.${drop_id}.requested_quantity_total == 125000"
            - "Drop.${drop_id}.provisional_cost_per_book_cents == 302  # 800 bps band on the REQUESTED 125000: printing 225 + paper 22 + postage 55"
            - "CirculationLine.${line_big_id}.allocation_rank == 1 and CirculationLine.${line_second_id}.allocation_rank == 2"
            - "CirculationLine.${line_big_id}.unit_cost_cents == 302 and CirculationLine.${line_second_id}.unit_cost_cents == 302"
            - "CirculationLine.${line_big_id}.allocated_quantity == 50000  # audience cap, not the 95000 request"
            - "CirculationLine.${line_big_id}.committed_cost_cents == 15100000"
            - "CirculationLine.${line_second_id}.allocated_quantity == 16225  # floor(4900000 remaining / 302), the budget cap"
            - "CirculationLine.${line_second_id}.committed_cost_cents == 4899950"
            - "CirculationLine.${line_second_id}.status == ALLOCATED"
            - "CirculationPlan.${plan_id}.committed_cost_cents == 19999950"
            - "CirculationPlan.${plan_id}.uncommitted_budget_cents == 50  # 50 cents left, less than one book"
            - "Drop.${drop_id}.planned_quantity == 66225"
            - "Drop.${drop_id}.print_rebate_bps == 500  # the FINAL band re-derived from 66225, one band below the provisional 800"
            - "Drop.${drop_id}.printing_cents_per_book == 232 and Drop.${drop_id}.cost_per_book_cents == 309"
            - "Drop.${drop_id}.provisional_cost_per_book_cents == 302  # unchanged: the provisional rate is never re-based from planned_quantity"
            - "Drop.${drop_id}.cost_per_book_cents > Drop.${drop_id}.provisional_cost_per_book_cents"
            - "CirculationLine.${line_big_id}.circulation_cost_cents == 15450000 and CirculationLine.${line_big_id}.contribution_cents == 8637000"
            - "CirculationLine.${line_second_id}.circulation_cost_cents == 5013525 and CirculationLine.${line_second_id}.contribution_cents == -3176445"
            - "CirculationPlan.${plan_id}.planned_cost_cents == 20463525  # measured at the FINAL 309, so it exceeds committed_cost_cents 19999950"
            - "CirculationPlan.${plan_id}.planned_demand_cents == 61724000"
            - "CirculationPlan.${plan_id}.planned_contribution_cents == 5460555"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine  (3 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: plan_revision_back_edge_reopens_approved_plan_and_unwinds_presort
        grounds:
          - state_machines.CirculationPlan.APPROVED_to_DRAFT
          - state_machines.CirculationPlan.UNDER_REVIEW_to_APPROVED
          - state_machines.CirculationPlan.DRAFT_to_COSTED
          - state_machines.Drop.production_status.PLANNED_to_PRESORTED
          - entities.CirculationPlan.fields.revision_round
          - entities.CirculationPlan.fields.costed_by_user_id
          - entities.Drop.fields.cost_basis
          - validations[priority=50]
        distinguishing_aspect: |
          Entity = CirculationPlan, shape CYCLIC: the plan re-enters DRAFT from
          APPROVED over the request-revision back-edge, revision_round increments to
          1, all three audit user ids are cleared, the PRESORTED drop is dragged back
          to PLANNED with its presort batches deleted and cost_basis reverted to
          ESTIMATED_POSTAGE (cost_per_book_cents 306 -> 309), and the very same
          DRAFT -> COSTED -> UNDER_REVIEW -> APPROVED path then runs a second time to
          completion with revision_round still 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "Segment S_BIG (50000 names, 620 bps, AOV 18500); plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run."
            - "Drop 1 at page_count 94 with one HOUSEFILE line for 50000 books, allocated at the provisional 309."
            - "Plan costed by u-planner-1, submitted by u-planner-1, approved by u-director-9; drop 1 presorted over two batches (20000 FIVE_DIGIT + 30000 MIXED_AADC) so cost_basis is PRESORTED_ACTUAL and cost_per_book_cents is 306."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_BIG", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 50000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_big_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 94 }
              as: CirculationPlanner
              captures: { drop_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_big_id}", requested_quantity: 50000 }
              as: CirculationPlanner
              captures: { line_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${drop_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${drop_id}/presort-batches"
              payload: { declared_tier: "MIXED_AADC", piece_count: 30000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${drop_id}/presort"
              payload: {}
              as: CirculationPlanner
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/request-revision"
              payload: { note: "reprice the paper line" }
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "GET /catalog-circulation/drops/${drop_id}/presort-batches"
              payload: {}
              as: CirculationPlanner
              captures: { batches_after_revision: "$.data" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-2"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-2"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
          assert:
            - "CirculationPlan.${plan_id}.revision_round == 1  # incremented exactly once by the APPROVED -> DRAFT back-edge"
            - "${batches_after_revision} is an empty array  # every PostalPresortBatch row of the drop was deleted by the back-edge"
            - "immediately after request-revision: CirculationPlan.${plan_id}.status == DRAFT"
            - "immediately after request-revision: CirculationPlan.${plan_id}.costed_by_user_id == null and submitted_by_user_id == null and approved_by_user_id == null"
            - "immediately after request-revision: Drop.${drop_id}.production_status == PLANNED"
            - "immediately after request-revision: Drop.${drop_id}.postage_total_cents == 0 and automation_share_bps == 0 and automation_qualified == false"
            - "immediately after request-revision: Drop.${drop_id}.cost_basis == ESTIMATED_POSTAGE"
            - "immediately after request-revision: Drop.${drop_id}.postage_cents_per_book == 55 and Drop.${drop_id}.cost_per_book_cents == 309  # back from the presorted 306"
            - "immediately after request-revision: CirculationLine.${line_id}.circulation_cost_cents == 15450000 and contribution_cents == 8637000"
            - "immediately after request-revision: CirculationPlan.${plan_id}.planned_cost_cents == 15450000 and planned_contribution_cents == 8637000"
            - "immediately after request-revision: CirculationPlan.${plan_id}.committed_cost_cents == 15450000  # reopening the plan does NOT release committed budget"
            - "immediately after request-revision: CirculationLine.${line_id}.status == ALLOCATED  # the allocation survives the cycle"
            - "after the second lap: CirculationPlan.${plan_id}.status == APPROVED"
            - "after the second lap: CirculationPlan.${plan_id}.revision_round == 1  # a completed second lap does not bump the counter again"
            - "after the second lap: CirculationPlan.${plan_id}.costed_by_user_id == u-planner-2 and submitted_by_user_id == u-planner-2 and approved_by_user_id == u-director-9"
            - "after the second lap: Drop.${drop_id}.production_status == PLANNED and cost_basis == ESTIMATED_POSTAGE  # approval alone does not re-presort"

      - name: drop_production_and_measurement_dimensions_advance_independently
        grounds:
          - state_machines.Drop.production_status.MAILED_to_DELIVERED
          - state_machines.Drop.measurement_status.PENDING_to_MATCHBACK_OPEN
          - state_machines.Drop.measurement_status.MATCHBACK_OPEN_to_MATCHBACK_CLOSED
          - state_machines.MatchbackRun.OPEN_to_FINALIZED
          - entities.Drop.fields.production_status
          - entities.Drop.fields.measurement_status
          - concurrency_rules[matchback-create-stale-drop]
          - errors[ERR_INVALID_MEASUREMENT_STATE]
        distinguishing_aspect: |
          Entity = Drop, shape PARALLEL: two dimensions on one row move on disjoint
          triggers. Creating a matchback run moves measurement_status
          PENDING -> MATCHBACK_OPEN while production_status stays MAILED; the
          subsequent deliver moves production_status MAILED -> DELIVERED while
          measurement_status stays MATCHBACK_OPEN; finalize then moves
          measurement_status -> MATCHBACK_CLOSED while production_status stays
          DELIVERED. Neither dimension is derivable from the other, and a further
          matchback create against the CLOSED measurement dimension is rejected with
          ERR_INVALID_MEASUREMENT_STATE even though the production dimension is
          perfectly legal.
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-09-20T00:00:00Z."
