        distinguishing_aspect: |
          Pair (state-OCC vs business_safety): approving a claim with BOTH a
          stale expected_claim_version (the claim's version advanced when it
          moved to UNDER_REVIEW) AND a segregation-of-duties violation (the
          approver is the same staff user who reviewed) must return
          ERR_STALE_VERSION (priority 6), not ERR_SEGREGATION_OF_DUTIES
          (priority 16) — the OCC state check preempts the safety rule.
        test_recipe:
          setup:
            - "Claim CL for a completed 10-unit referral; captured version at submission (cl_v_submit) goes stale when review advances the claim version"
            - "Same funder staff user (rev1) performs review and then the failing approve"
