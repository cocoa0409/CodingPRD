          - state_machines.MedicalRecordShare.GRANTED_to_REVOKED
          - entities.MedicalEvaluation.fields.active_share_count
          - entities.MedicalEvaluation.fields.disclosure_state
          - entities.MedicalRecordShare.fields.effective_access
        distinguishing_aspect: |
          Granting the share raises active_share_count from 0 to 1 and sets expires_at to
          2027-04-25T18:00:00.000Z (the draft-start grace cap, the earliest of the three
          candidates); revoking it must decrement the counter back to exactly 0, flip
          effective_access to NONE, seal the evaluation, and leave the prospect's consent
          untouched at GRANTED / FULL. Decrementing without the zero-check leaves the
          evaluation DISCLOSABLE and a later request would be admitted against a dead consent
          trail.
