              captures: { r_gt_again: $.data.request_status }
            - call: "POST /api/hosts/${h_gt}/decisions"
              payload: { action: "SUSPEND", reason: "ordinance audit", expected_host_version: "${h_gt_v2}" }
              as: PlatformAdmin
          trigger:
