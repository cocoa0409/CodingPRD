      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 400
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          hold_id: $.data.id
      - call: POST /accelerators/allocation-holds/${hold_id}/commit
        payload:
          consume_reservation: false
        as: PartnerOps
        as_user_id: ${pa_id}
      - call: POST /accelerators/stack-licenses
        payload:
          license_code: SL-TRAIN-1
          product_sku_id: ${sku_id}
          stack_name: Training Suite
          entitlement_units: 250
          min_package_version: 1.0.0
          preview_stack_flag: false
        as: SupplyPlanner
        captures:
          st_id: $.data.id
      - call: POST /accelerators/stack-licenses/${st_id}/release
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/deployments
        payload:
          product_sku_id: ${sku_id}
          destination_country_code: US
          stack_manifest:
          - license_id: ${st_id}
            entitlement_units: 250
        as: SupportAccountManager
        captures:
          dep_id: $.data.id
      - call: POST /accelerators/deployments/${dep_id}/activate
        payload: {}
        as: SupportAccountManager
      - call: POST /accelerators/subscriptions
        payload:
          deployment_id: ${dep_id}
          support_tier: BUSINESS
          seat_count: 60
          licence_group:
          - license_id: ${st_id}
          trial_flag: true
        as: SupportAccountManager
        captures:
          sub_id: $.data.id
      - call: POST /accelerators/subscriptions/${sub_id}/activate
        payload: {}
        as: SupportAccountManager
      - call: POST /accelerators/partners/${pa_id}/suspend
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/reinstate
        payload: {}
        as: PlatformAdmin
      - call: GET /accelerators/subscriptions/${sub_id}
        payload: {}
        as: SupportAccountManager
        captures:
          sub_pre: $.data.status
      trigger:
      - call: POST /accelerators/deployments/${dep_id}/terminate
        payload: {}
        as: SupportAccountManager
        captures:
          dep_final: $.data.activation_state
          dep_effect: $.data.termination_effect_units
      - call: GET /accelerators/subscriptions/${sub_id}
        payload: {}
        as: SupportAccountManager
        captures:
          sub_final: $.data.status
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          ent_final: $.data.entitlement_units_held
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          alloc_final: $.data.allocated_units
      assert:
      - ${sub_pre} == SUSPENDED
      - ${dep_final} == TERMINATED
      - ${sub_final} == RECLAIMED
      - ${ent_final} == 0
      - ${alloc_final} == 0
- section: calculations
  instances:
  - name: subscription_fee_variant_divergence_already_exercised
    claim_type: Variant Divergence
    grounds:
    - calculations.subscription_fee_provisional
    - calculations.subscription_fee_final
    excluded_because:
      difficulty_instance: subscription_fee_forward_looking_vs_chronological
      rationale: Asserted end-to-end as the §1.8 dual-variant instance.
  - name: allocation_value_variant_divergence_already_exercised
    claim_type: Variant Divergence
    grounds:
    - calculations.allocation_value_estimate
    - calculations.allocation_value_confirm
    excluded_because:
      difficulty_instance: allocation_value_estimate_vs_confirm_saturating_ramp
      rationale: Asserted as the §1.8 dual-variant instance on the allocation subject.
  - name: support_credit_boundary_already_exercised
