              payload: { geofence_zone_id: "${zone_id}", processing_purpose_id: "${pur_share_id}", campaign_name: "Wave A", target_radius_meters: 200, distance_to_zone_center_meters: 2000, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-09-05T00:00:00Z" }
              as: DataSteward
              captures: { camp_a_id: $.data.id }
            - call: "POST /health-data/geofence-campaigns/${camp_a_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/geofence-campaigns"
              payload: { geofence_zone_id: "${zone_id}", processing_purpose_id: "${pur_share_id}", campaign_name: "Wave B", target_radius_meters: 200, distance_to_zone_center_meters: 2000, window_start_at: "2026-09-05T00:00:00Z", window_end_at: "2026-09-08T00:00:00Z" }
              as: DataSteward
              captures: { camp_b_id: $.data.id }
