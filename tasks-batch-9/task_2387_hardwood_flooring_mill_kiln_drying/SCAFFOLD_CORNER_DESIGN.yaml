  - section: state_machines
    instances:
      - name: green_receipt_starts_in_received_and_rejects_to_terminal
        claim_type: initial_state
        grounds: ["state_machines.GreenReceipt.initial_state", "state_machines.GreenReceipt.transitions.RECEIVED_to_REJECTED"]
        distinguishing_aspect: "A new receipt is RECEIVED; rejecting it records the reason, leaves accepted_board_feet at 0 and lands in a terminal state where accept is refused."
        test_recipe:
          setup: ["One species profile and one RECEIVED receipt of 6000 bf."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /mill/green-receipts/${r1}/reject", payload: { rejection_reason: "Stain and insect damage beyond FAS" }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
          assert:
            - "The receipt was created with status \"RECEIVED\" (initial state)."
            - "reject: status 200 with data.status == \"REJECTED\", data.rejection_reason == \"Stain and insect damage beyond FAS\" and data.accepted_board_feet == 0."
            - "accept after reject: status 409 with data.error_id == \"ERR_RECEIPT_STATE_INVALID\" - REJECTED is terminal."
            - "GET /mill/green-receipts?status=REJECTED returns total_count 1."

      - name: receipt_accept_twice_second_call_rejected
        claim_type: idempotency
        grounds: ["state_machines.GreenReceipt.transitions.RECEIVED_to_ACCEPTED", "errors[ERR_RECEIPT_STATE_INVALID]"]
        distinguishing_aspect: "Accept is not idempotent: the second accept is refused and cannot overwrite accepted_board_feet."
        test_recipe:
          setup: ["One ACCEPTED receipt at 5800 bf."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
          trigger:
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5900 }, as: ProcurementClerk }
          assert:
            - "Response status 409 with data.error_id == \"ERR_RECEIPT_STATE_INVALID\"."
            - "GET /mill/green-receipts/{r1} still shows accepted_board_feet == 5800 and status \"ACCEPTED\"."

      - name: accept_above_received_board_feet_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.GreenReceipt.transitions.RECEIVED_to_ACCEPTED.preconditions", "errors[ERR_ACCEPTED_BF_EXCEEDS_RECEIVED]"]
        distinguishing_aspect: "accepted_board_feet 6001 against 6000 received is refused at priority 38, leaving the receipt RECEIVED with 0 accepted."
        test_recipe:
          setup: ["One RECEIVED receipt of 6000 bf."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
          trigger:
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 6001 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 6000 }, as: ProcurementClerk }
          assert:
            - "First accept: status 422 with data.error_id == \"ERR_ACCEPTED_BF_EXCEEDS_RECEIVED\"; GET shows status \"RECEIVED\" and accepted_board_feet 0."
            - "Second accept at exactly 6000: status 200 with data.status == \"ACCEPTED\" and data.accepted_board_feet == 6000 - the bound is inclusive."

      - name: charge_load_with_no_allocated_volume_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.KilnCharge.transitions.SCHEDULED_to_LOADED.preconditions", "errors[ERR_CHARGE_STATE_INVALID]"]
        distinguishing_aspect: "A SCHEDULED charge with charged_green_bf 0 cannot be loaded even though its chamber is AVAILABLE."
        test_recipe:
          setup: ["A SCHEDULED charge with no receipts allocated and an AVAILABLE chamber."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
          assert:
            - "Response status 409 with data.error_id == \"ERR_CHARGE_STATE_INVALID\"."
            - "GET /mill/kiln-charges/{charge_a} still shows status \"SCHEDULED\", charged_green_bf == 0 and weighted_initial_moisture_pct == null."
            - "GET /mill/kiln-chambers/{chamber_id} still shows status \"AVAILABLE\"."

      - name: charge_start_drying_from_scheduled_is_invalid_transition
        claim_type: invalid_transition
        grounds: ["state_machines.KilnCharge.transitions.LOADED_to_DRYING", "errors[ERR_CHARGE_STATE_INVALID]"]
        distinguishing_aspect: "start_drying is only declared from LOADED; calling it on a SCHEDULED charge is refused and the charge does not skip the load step."
        test_recipe:
          setup: ["A SCHEDULED charge with 5800 bf allocated."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 45.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
          assert:
            - "start_drying: status 409 with data.error_id == \"ERR_CHARGE_STATE_INVALID\"."
            - "record_stress_test from SCHEDULED: status 409 with data.error_id == \"ERR_CHARGE_STATE_INVALID\" - the stress test is only declared from CONDITIONING."
            - "GET /mill/kiln-charges/{charge_a} still shows status \"SCHEDULED\", shell_moisture_pct == null and dry_bf_out == null."
            - "GET /mill/green-receipts/{r1} still shows status \"ALLOCATED\"."

      - name: start_maintenance_on_occupied_chamber_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.KilnChamber.transitions.AVAILABLE_to_MAINTENANCE", "errors[ERR_CHAMBER_STATE_INVALID]"]
        distinguishing_aspect: "MAINTENANCE is only reachable from AVAILABLE; an OCCUPIED chamber cannot be taken out of service under a drying charge."
        test_recipe:
          setup: ["Charge A LOADED into chamber K1, so the chamber is OCCUPIED."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 45.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-chambers/${chamber_id}/start_maintenance", payload: { maintenance_note: "Emergency fan inspection" }, as: KilnOperator }
          assert:
            - "Response status 409 with data.error_id == \"ERR_CHAMBER_STATE_INVALID\"."
            - "GET /mill/kiln-chambers/{chamber_id} still shows status \"OCCUPIED\" and maintenance_note == null."

      - name: chamber_returns_to_available_when_charge_released
        claim_type: side_effect_execution
        grounds: ["state_machines.KilnChamber.transitions.OCCUPIED_to_AVAILABLE", "state_machines.KilnCharge.transitions.CONDITIONING_to_RELEASED.side_effects"]
        distinguishing_aspect: "The release side effect crosses entities: the chamber the charge occupied returns to AVAILABLE in the same request, and the consumed receipts stay CONSUMED."
        test_recipe:
          setup: ["Charge A in CONDITIONING in chamber K1 with 5800 bf consumed."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
