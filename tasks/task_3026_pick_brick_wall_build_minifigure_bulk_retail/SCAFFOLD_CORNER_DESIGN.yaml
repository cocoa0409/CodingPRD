      - name: stale_member_version_on_a_replacement_filing_is_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[replacement-create-stale-member]", "errors[ERR_MEMBER_STALE_VERSION]"]
        distinguishing_aspect: "A third distinct parent-entity OCC rule: re-filing against a member whose version moved when the first filing bumped it is rejected with the member stale-version error, whose id differs from the other two OCC errors."
        test_recipe:
