# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Flight Dispatch & Release Management
# Taxonomy sections/claim_types follow references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: station_create_applies_default_status_open
        claim_type: defaults
        grounds: [entities.Station.fields.status]
        distinguishing_aspect: "Omitting optional status on create yields OPEN, the value the alternate selector and divert eligibility depend on."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id, sta_status: $.data.status } }
          trigger:
            - { call: "GET /dispatch/stations/${sta}", as: DispatchSupervisor, captures: { sta_get_status: $.data.status } }
          assert:
            - "sta_status == OPEN and sta_get_status == OPEN"

      - name: station_duplicate_iata_rejected
        claim_type: type_constraints
        grounds: [entities.Station.fields.iata_code, "errors[ERR_DUPLICATE_RESOURCE]"]
        distinguishing_aspect: "Second station with the same iata_code violates uniqueness -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["Station KAAA exists"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
          trigger:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 3000, alternate_distance_nm: 20, min_ceiling_ft: 300, min_visibility_m: 900 }, as: DispatchSupervisor, captures: { dup_err: $.data.error_id } }
          assert:
            - "dup_err == ERR_DUPLICATE_RESOURCE"

      - name: aircraft_get_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dispatch/aircraft/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DispatchSupervisor, captures: { nf_err: $.data.error_id } }
          assert:
            - "nf_err == ERR_NOT_FOUND (HTTP 404)"

      - name: leg_create_rejects_unknown_system_field
        claim_type: system_fields
        grounds: [entities.FlightLeg.fields.ops_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ops_status is system-owned; supplying it in the create body is an unknown-field rejection (ERR_INVALID_REQUEST), never silently honored."
        test_recipe:
          setup: ["Stations/aircraft/dispatcher/captain exist"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD900", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 400, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T11:00:00Z", dispatcher_id: "${d1}", ops_status: "DEPARTED" }, as: Dispatcher, as_user_id: "${d1}", captures: { bad_err: $.data.error_id } }
          assert:
            - "bad_err == ERR_INVALID_REQUEST (client cannot smuggle system-owned state)"

      - name: release_signature_immutable_rows
        claim_type: immutability
        grounds: [entities.ReleaseSignature]
        distinguishing_aspect: "ReleaseSignature has common_fields:false — rows expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Standard chain to PENDING_SIGNATURES, dispatcher has signed once"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD910", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases", payload: { leg_id: "${leg1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { rel1: $.data.id } }
            - { call: "POST /dispatch/releases/${rel1}/submit", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases/${rel1}/sign", payload: {}, as: Dispatcher, as_user_id: "${d1}" }
          trigger:
            - { call: "GET /dispatch/releases/${rel1}/signatures", as: Dispatcher, as_user_id: "${d1}", captures: { sig0_role: "$.data[0].signer_role", sig0_seq: "$.data[0].cycle_seq", sig0_at: "$.data[0].signed_at_utc" } }
          assert:
            - "exactly 1 row; sig0_role == DISPATCHER; sig0_seq == 1; sig0_at == 2026-05-01T08:00:00Z (logical clock)"
            - "each row carries id and created_at but NO version or updated_at field (common_fields: false)"

      - name: dispatcher_default_max_active_legs
        claim_type: defaults
        grounds: [entities.Dispatcher.fields.max_active_legs]
        distinguishing_aspect: "Omitting max_active_legs on create applies the default 6."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana Default", license_no: "D900" }, as: DispatchSupervisor, captures: { dd: $.data.id, dd_max: $.data.max_active_legs } }
          trigger:
            - { call: "GET /dispatch/dispatchers/${dd}", as: DispatchSupervisor }
          assert:
            - "dd_max == 6"

      - name: desk_shift_status_derives_from_clock
        claim_type: computed_fields
        grounds: [entities.DeskShift.fields.status]
        distinguishing_aspect: "DeskShift.status is derived from the logical clock: PLANNED before the window, ACTIVE inside [start, end), ENDED at/after end — same row, three reads, three values."
        test_recipe:
          setup: ["Dispatcher D8, desk K8; shift window 2026-05-01T06:00:00Z-14:00:00Z; clock starts at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana Eight", license_no: "D008", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d8: $.data.id } }
            - { call: "POST /dispatch/desks", payload: { code: "K8", region: "WEST", max_dispatchers: 2 }, as: DispatchSupervisor, captures: { k8: $.data.id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${d8}", desk_id: "${k8}", shift_start_utc: "2026-05-01T06:00:00Z", shift_end_utc: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor, captures: { sh8: $.data.id, sh8_status0: $.data.status } }
          trigger:
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: DispatchSupervisor }
            - { call: "GET /dispatch/desk-shifts/${sh8}", as: DispatchSupervisor, captures: { sh8_status1: $.data.status } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor }
            - { call: "GET /dispatch/desk-shifts/${sh8}", as: DispatchSupervisor, captures: { sh8_status2: $.data.status } }
          assert:
            - "sh8_status0 == PLANNED (clock 00:00 < start)"
            - "sh8_status1 == ACTIVE (06:00 <= 10:00 < 14:00)"
            - "sh8_status2 == ENDED (14:00 <= 14:00 — end is exclusive)"

      - name: plan_computed_fields_exact_values
        claim_type: computed_fields
        grounds: [entities.FlightPlan.fields.required_fuel_kg]
        excluded_because:
          difficulty_instance: dual_variant_calc / trip_fuel_forecast_vs_worst_case_divergence
          rationale: "All FlightPlan computed fields are asserted as literals there (ground_speed, trip, contingency, alternate, reserve, required)."

      - name: manifest_computed_fields_exact_values
        claim_type: computed_fields
        grounds: [entities.PayloadManifest.fields.total_payload_kg, entities.PayloadManifest.fields.max_payload_kg]
        excluded_because:
          difficulty_instance: combinatorial_formula / max_payload_single_pass_order_mode_c
          rationale: "total/zero-fuel/takeoff/max_payload asserted as literals across recompute and PUT."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: release_created_in_draft_initial_state
        claim_type: initial_state
        grounds: [state_machines.FlightRelease]
        distinguishing_aspect: "A freshly created release is DRAFT with cycle_seq 1 and amendment_count 0."
        test_recipe:
          setup: ["Standard chain through manifest (plan LOCKED)"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD300", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dispatch/releases", payload: { leg_id: "${leg1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { rel1: $.data.id, rel1_status: $.data.status, rel1_cycle: $.data.cycle_seq, rel1_amends: $.data.amendment_count } }
          assert:
            - "rel1_status == DRAFT and rel1_cycle == 1 and rel1_amends == 0"
            - "release.plan_id == ${plan1} and release.dispatcher_id == ${d1} and release.captain_id == ${c1} (snapshots pinned at creation)"

      - name: second_signature_same_slot_rejected
        claim_type: idempotency
        grounds: [state_machines.FlightRelease.PENDING_SIGNATURES_to_RELEASED, "errors[ERR_DUPLICATE_SIGNATURE]"]
        distinguishing_aspect: "The same slot cannot sign twice in one cycle: second dispatcher signature -> ERR_DUPLICATE_SIGNATURE; the release stays PENDING_SIGNATURES (captain slot still empty)."
        test_recipe:
          setup: ["Standard chain to PENDING_SIGNATURES"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD310", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/releases", payload: { leg_id: "${leg1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { rel1: $.data.id } }
            - { call: "POST /dispatch/releases/${rel1}/submit", as: Dispatcher, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dispatch/releases/${rel1}/sign", payload: {}, as: Dispatcher, as_user_id: "${d1}", captures: { rel_mid: $.data.status } }
            - { call: "POST /dispatch/releases/${rel1}/sign", payload: {}, as: Dispatcher, as_user_id: "${d1}", captures: { dup_err: $.data.error_id } }
          assert:
            - "rel_mid == PENDING_SIGNATURES (one slot filled does not release)"
            - "dup_err == ERR_DUPLICATE_SIGNATURE"

      - name: recall_from_released_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.FlightRelease.PENDING_SIGNATURES_to_DRAFT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recall is defined only from PENDING_SIGNATURES; calling it on RELEASED is an invalid-from rejection with no cycle_seq bump."
        test_recipe:
          setup: ["Standard chain to RELEASED"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD320", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}" }
