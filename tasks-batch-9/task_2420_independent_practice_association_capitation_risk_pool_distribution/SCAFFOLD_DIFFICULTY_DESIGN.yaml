# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2420 — Independent Practice Association Capitation & Risk Pool Distribution
# 9 rule_ids, 20 instances. Every numeric literal below was computed by executing
# the corresponding §1.3 formula against the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: capitation_reconciliation_variant_divergence_on_remittance
        grounds:
          - calculations.expected_capitation_for_coverage_month
          - calculations.remittance_variance_and_allocation
          - entities.DelegationAgreement.fields.reconciliation_method
          - entities.CapitationRemittance.fields.reconciliation_method_used
          - entities.CapitationRemittance.fields.member_month_count_bps
          - state_machines.EnrollmentFile.PARSED_to_RECONCILED
        distinguishing_aspect: |
          This variant pair lives on the capitation-revenue domain
          (CapitationRemittance money owed for a coverage month): two agreements
          holding byte-identical rosters reconcile the same 2026-07 file to
          37500 cents under ROSTER_SNAPSHOT and 83694 cents under
          MEMBER_MONTHS_PRORATED, a 46194-cent divergence caused solely by
          whether a mid-month add is counted at all.
        test_recipe:
          setup:
            - "Agreement AGR_S (reconciliation_method ROSTER_SNAPSHOT) and agreement AGR_P (reconciliation_method MEMBER_MONTHS_PRORATED) are both ACTIVE with identical economics: base_pmpm_cents 30000, quality_withhold_bps 700, professional/institutional shares 6000/4000, max_panel_size 5."
            - "Each agreement has one ACTIVE PRIMARY_CARE physician and two enrollees with identical demographics: an ADULT/HMO member at risk_score_bps 12500 (gross_pmpm_cents 37500) assigned for all of July, and a SENIOR/HMO_PLUS member at risk_score_bps 20000 (gross_pmpm_cents 89500) assigned from 2026-07-16 (16 of 31 days)."
            - "Each agreement has a PARSED EnrollmentFile for coverage_month 2026-07 carrying one MATCHED ADD row of 37500 cents."
            - "Logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "North Bay Health Plan", payer_tax_id: "94-1000001", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_s: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_s}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_s}/physicians"
              payload: { npi: "1000000001", full_name: "Dana Reyes", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_s: "$.data.id" }
            - call: "POST /ipa/physicians/${p_s}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_s}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_s}/enrollees"
              payload: { external_member_id: "M-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_s1: "$.data.id", e_s1_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_s1}", physician_id: "${p_s}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_s1_v}" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_s}/enrollees"
              payload: { external_member_id: "M-0002", age_band: "SENIOR", benefit_tier: "HMO_PLUS", risk_score_bps: 20000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_s2: "$.data.id", e_s2_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_s2}", physician_id: "${p_s}", effective_date: "2026-07-16T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_s2_v}" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "South Bay Health Plan", payer_tax_id: "94-1000002", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "MEMBER_MONTHS_PRORATED", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_p: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_p}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_p}/physicians"
              payload: { npi: "1000000002", full_name: "Omar Diaz", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_p: "$.data.id" }
            - call: "POST /ipa/physicians/${p_p}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_p}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_p}/enrollees"
              payload: { external_member_id: "M-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_p1: "$.data.id", e_p1_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_p1}", physician_id: "${p_p}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_p1_v}" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_p}/enrollees"
              payload: { external_member_id: "M-0002", age_band: "SENIOR", benefit_tier: "HMO_PLUS", risk_score_bps: 20000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_p2: "$.data.id", e_p2_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_p2}", physician_id: "${p_p}", effective_date: "2026-07-16T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_p2_v}" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_s}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-S-2026-07" }
              as: IpaAdmin
              captures: { file_s: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_s}/rows"
              payload: { external_member_id: "M-0001", physician_npi: "1000000001", row_action: "ADD", claimed_capitation_cents: 37500, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_s}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_p}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-P-2026-07" }
              as: IpaAdmin
              captures: { file_p: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_p}/rows"
              payload: { external_member_id: "M-0001", physician_npi: "1000000002", row_action: "ADD", claimed_capitation_cents: 37500, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_p}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/enrollment-files/${file_s}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "GET /ipa/enrollment-files/${file_s}/remittances"
              payload: { limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { rem_s: "$.data[0].id" }
            - call: "POST /ipa/enrollment-files/${file_p}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "GET /ipa/enrollment-files/${file_p}/remittances"
              payload: { limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { rem_p: "$.data[0].id" }
          assert:
            - "CapitationRemittance.${rem_s}.reconciliation_method_used == \"ROSTER_SNAPSHOT\""
            - "CapitationRemittance.${rem_s}.expected_capitation_cents == 37500"
            - "CapitationRemittance.${rem_s}.member_month_count_bps == 10000"
            - "CapitationRemittance.${rem_s}.withhold_cents == 2625"
            - "CapitationRemittance.${rem_s}.net_payable_cents == 34875"
            - "CapitationRemittance.${rem_s}.institutional_allocation_cents == 13950"
            - "CapitationRemittance.${rem_s}.professional_allocation_cents == 20925"
            - "CapitationRemittance.${rem_s}.variance_cents == 0"
            - "CapitationRemittance.${rem_p}.reconciliation_method_used == \"MEMBER_MONTHS_PRORATED\""
            - "CapitationRemittance.${rem_p}.expected_capitation_cents == 83694"
            - "CapitationRemittance.${rem_p}.member_month_count_bps == 15161"
            - "CapitationRemittance.${rem_p}.withhold_cents == 5859"
            - "CapitationRemittance.${rem_p}.net_payable_cents == 77835"
            - "CapitationRemittance.${rem_p}.institutional_allocation_cents == 31134"
            - "CapitationRemittance.${rem_p}.professional_allocation_cents == 46701"
            - "CapitationRemittance.${rem_p}.variance_cents == -46194"
            - "the divergence on identical rosters is exactly 83694 - 37500 == 46194 cents"

      - name: ibnr_reserve_variant_divergence_on_risk_pool
        grounds:
          - calculations.ibnr_reserve_estimate
          - entities.RiskPool.fields.ibnr_reserve_cents
          - entities.RiskPool.fields.ibnr_method_used
          - entities.DelegationAgreement.fields.ibnr_method
          - state_machines.RiskPool.CLOSED_FOR_INCURRAL_to_RESERVED
          - state_machines.RiskPool.RESERVED_to_RESERVED
        distinguishing_aspect: |
          This variant pair lives on the claims-reserving domain (RiskPool
          unreported tail), not on capitation revenue: the same pool with
          paid_claims_cents 13520 and member_months_bps 10000 reserves 3380
          cents under COMPLETION_FACTOR and 1480 cents under PMPM_LOSS_RATIO,
          because one variant scales the observed paid triangle while the other
          anchors on member-month exposure.
          setup_note: "Reusable fixture I: single-enrollee agreement whose PROFESSIONAL pool ends with funded_cents 20000, paid_claims_cents 13520 and member_months_bps 10000."
        test_recipe:
          setup:
            - "Agreement AGR_I is ACTIVE with base_pmpm_cents 20000, quality_withhold_bps 0, professional_pool_share_bps 10000, institutional_pool_share_bps 0, ibnr_method COMPLETION_FACTOR, ibnr_completion_factor_bps 8000, target_claims_pmpm_cents 15000."
            - "One ACTIVE PRIMARY_CARE physician; one ADULT/HMO enrollee at risk_score_bps 10000 (gross_pmpm_cents 20000) assigned from 2026-01-01."
            - "A PROFESSIONAL RiskPool covers 2026-01-01T00:00:00Z through 2026-12-31T23:59:59Z; one downstream claim of 13520 cents has been approved and PAID into it, and the 2026-07 enrollment file has been POSTED, so funded_cents is 20000, member_months_bps is 10000, paid_claims_cents is 13520 and loss_ratio_bps is 6760 (deficit_flag false)."
            - "Logical clock is at 2027-01-01T00:00:00Z and the pool is CLOSED_FOR_INCURRAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Cascade Health Plan", payer_tax_id: "94-2000002", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "MEMBER_MONTHS_PRORATED", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_i: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_i}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_i}/physicians"
              payload: { npi: "2000000001", full_name: "Ivy Chen", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_i: "$.data.id" }
            - call: "POST /ipa/physicians/${p_i}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_i}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_i}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_i: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_i}/enrollees"
              payload: { external_member_id: "M-2001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_i1: "$.data.id", e_i1_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_i1}", physician_id: "${p_i}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_i1_v}" }
              as: NetworkManager
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_i}", enrollee_id: "${e_i1}", attributed_physician_id: "${p_i}", pool_type: "PROFESSIONAL", downstream_provider_name: "Rainier Imaging", billed_cents: 13520, service_date: "2026-06-15T00:00:00Z" }
              as: ClaimsExaminer
              captures: { clm_i: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_i}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 13520 }
              as: ClaimsExaminer
            - call: "POST /ipa/downstream-claims/${clm_i}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_i}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-I-2026-07" }
              as: IpaAdmin
              captures: { file_i: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_i}/rows"
              payload: { external_member_id: "M-2001", physician_npi: "2000000001", row_action: "ADD", claimed_capitation_cents: 20000, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_i}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_i}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_i}/state"
              payload: { to_state: "POSTED" }
              as: IpaAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/risk-pools/${pool_i}/state"
              payload: { to_state: "CLOSED_FOR_INCURRAL" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/risk-pools/${pool_i}/state"
              payload: { to_state: "RESERVED" }
              as: IpaAdmin
            - call: "POST /ipa/risk-pools/${pool_i}/state"
              payload: { to_state: "RESERVED", ibnr_method_override: "PMPM_LOSS_RATIO" }
              as: IpaAdmin
          assert:
            - "after the first trigger call RiskPool.${pool_i}.ibnr_method_used == \"COMPLETION_FACTOR\" and RiskPool.${pool_i}.ibnr_reserve_cents == 3380"
            - "after the second trigger call RiskPool.${pool_i}.ibnr_method_used == \"PMPM_LOSS_RATIO\" and RiskPool.${pool_i}.ibnr_reserve_cents == 1480"
            - "the two variants diverge by exactly 3380 - 1480 == 1900 cents on identical pool data"
            - "RiskPool.${pool_i}.funded_cents == 20000"
            - "RiskPool.${pool_i}.paid_claims_cents == 13520"
            - "RiskPool.${pool_i}.member_months_bps == 10000"
            - "RiskPool.${pool_i}.status == \"RESERVED\" after both calls"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # ---- mode (a): >=3 inputs, non-linear, nested clamp + enum branches ----
      - name: member_pmpm_nested_clamp_and_enum_branches
        mode: "(a) three or more inputs combined non-linearly with nested min/max and enum branches"
        grounds:
          - calculations.member_pmpm_components
          - entities.Enrollee.fields.gross_pmpm_cents
          - entities.Enrollee.fields.withhold_cents
          - entities.Enrollee.fields.net_pmpm_cents
          - endpoints.POST_/ipa/delegation-agreements/{id}/enrollees
        distinguishing_aspect: |
          Mode (a): gross_pmpm_cents multiplies base_pmpm_cents by an age-band
          enum factor AND by a continuous risk_score_bps, THEN adds a
          benefit-tier enum constant, THEN clamps into [8000, 95000] — four
          inputs, two of them enum-selected constants, and a nested
          max(min(...)) whose two arms are both exercised. It is not the
          rounding-order instance (mode b) and not the pinned-evaluation-order
          instance (mode c): every step here is a single rounding, and the
          discriminating behaviour is that the clamp bites on E3 from below and
          on E4 from above while E1 and E2 pass through untouched.
        test_recipe:
          setup:
            - "Agreement AGR_C is ACTIVE with base_pmpm_cents 30000 and quality_withhold_bps 700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Clamp Mutual Health", payer_tax_id: "94-3000003", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 10, continuity_of_care_days: 90 }
              as: IpaAdmin
              captures: { agr_c: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_c}/enrollees"
              payload: { external_member_id: "C-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 12500, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c}/enrollees"
              payload: { external_member_id: "C-0002", age_band: "SENIOR", benefit_tier: "HMO_PLUS", risk_score_bps: 20000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c}/enrollees"
              payload: { external_member_id: "C-0003", age_band: "PEDIATRIC", benefit_tier: "HMO", risk_score_bps: 3000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { c3: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c}/enrollees"
              payload: { external_member_id: "C-0004", age_band: "SENIOR", benefit_tier: "HMO_PLUS", risk_score_bps: 22000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { c4: "$.data.id" }
          assert:
            - "Enrollee.${c1}.gross_pmpm_cents == 37500"
            - "Enrollee.${c1}.withhold_cents == 2625"
            - "Enrollee.${c1}.net_pmpm_cents == 34875"
            - "Enrollee.${c2}.gross_pmpm_cents == 89500"
            - "Enrollee.${c2}.withhold_cents == 6265"
            - "Enrollee.${c2}.net_pmpm_cents == 83235"
            - "Enrollee.${c3}.gross_pmpm_cents == 8000 (raw 5850 lifted by PMPM_FLOOR_CENTS, not 5850)"
            - "Enrollee.${c3}.withhold_cents == 560"
            - "Enrollee.${c3}.net_pmpm_cents == 7440"
            - "Enrollee.${c4}.gross_pmpm_cents == 95000 (raw 98200 capped by PMPM_CEILING_CENTS, not 98200)"
            - "Enrollee.${c4}.withhold_cents == 6650"
            - "Enrollee.${c4}.net_pmpm_cents == 88350"

      # ---- mode (b): nested rounding where the pinned order changes the answer ----
      - name: prorated_capitation_round_per_member_then_sum
        mode: "(b) nested rounding where the order of operations changes the result and the scaffold pins one order"
        grounds:
          - calculations.expected_capitation_for_coverage_month
          - calculations.remittance_variance_and_allocation
          - entities.CapitationRemittance.fields.expected_capitation_cents
          - entities.CapitationRemittance.fields.withhold_cents
          - state_machines.EnrollmentFile.PARSED_to_RECONCILED
        distinguishing_aspect: |
          Mode (b): the pinned order is round-per-member THEN sum, and then a
          SINGLE withhold rounding on the summed total. A 3-enrollee July
          roster with 31/16/10 covered days totals 86275 cents under the pinned
          order but 86274 under sum-then-round, and its remittance withhold is
          6039 under the pinned single rounding but 6040 as a sum of
