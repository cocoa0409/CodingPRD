            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "POLICE", expected_permit_version: "${pm_v}" }, as: CommitteeAdmin, captures: { e1: $.data.id, pv1: $.data.permit_version } }
            - { call: "POST /permits/${pm_id}/endorsements", payload: { agency_type: "FIRE", expected_permit_version: "${pv1}" }, as: CommitteeAdmin, captures: { e2: $.data.id, pv2: $.data.permit_version } }
