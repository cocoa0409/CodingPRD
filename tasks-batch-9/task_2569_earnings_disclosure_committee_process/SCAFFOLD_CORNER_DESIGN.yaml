      - name: replaying_a_transition_that_already_fired_reports_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.DisclosureCommitteeCharter.DRAFT_to_ADOPTED
          - state_machines.Milestone.PLANNED_to_IN_PROGRESS
          - state_machines.SubCertificationRequest.PENDING_to_SUBMITTED
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The API carries no idempotency key, so a repeated trigger is not a no-op: a second ADOPT on an
          ADOPTED charter, a second START on an IN_PROGRESS milestone and a second SUBMIT on a SUBMITTED
          sub-certification each return ERR_INVALID_STATE. None of the three current states is terminal,
          which is what separates this from the ERR_ENTITY_TERMINAL corner, and no stamped field is
          overwritten: the charter's adopted_at_utc, the milestone's actual_start_utc and the request's
          submitted_utc all keep their first values and every version stays put.
        test_recipe:
          setup:
            - "An ADOPTED charter with an ACTIVE voting FINANCE member and an ACTIVE voting LEGAL member."
            - "A cycle in CLOSE_OPEN whose CLOSE milestone is IN_PROGRESS after a START at the default clock."
            - "One SubCertificationRequest for the FINANCE member in status SUBMITTED."
