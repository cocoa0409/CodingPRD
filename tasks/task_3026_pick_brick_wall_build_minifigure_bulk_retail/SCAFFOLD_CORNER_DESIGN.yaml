              as: PlatformAdmin
              captures: { mem_x1: $.data.id }
            - call: "POST /stores/members"
              payload: { email: "m_x2@example.com", display_name: "Cross Two", home_store_id: "${st222}" }
              as: PlatformAdmin
              captures: { mem_x2: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st222}", element_id: "${el5901}", bin_label: "S01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
