            - "after trigger call 8: state == SUBMITTED; after trigger call 9: state == CERTIFIED, certified_by_user_id == \"so-certifier-2\", safety_cost_cents == 641000 (fence height carries no cost line) and TourStop.${stop_atl}.safety_state == SAFETY_CERTIFIED"

      - name: corner_validation_season_window_outranks_the_booking_lead_time
        claim_type: Priority Ordering
        grounds:
          - validations[order=28]
          - validations[order=29]
          - global_constants.BOOKING_LEAD_TIME_DAYS
          - errors.ERR_DATE_OUTSIDE_SEASON
          - errors.ERR_BOOKING_LEAD_TIME
        distinguishing_aspect: "BOOKING_LEAD_TIME_DAYS is counted in whole days from the logical clock and is inclusive at 45: booking 2026-11-14 is legal at clock 2026-09-30 and illegal one day later. When a date violates BOTH the season window and the lead time, order 28 must answer ERR_DATE_OUTSIDE_SEASON — the earlier rule wins even though the later one is also true."
        test_recipe:
          setup:
            - "A Season running 2026-10-01 to 2027-03-31 and two venues in different markets, so no occupancy or rotation rule can interfere"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Dallas Coliseum", market_code: "DAL", city: "Dallas", state_code: "TX", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_dal: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SeriesPromoter
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_ok: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: SeriesPromoter
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dal}", tour_date: "2026-11-14", rental_base_cents: 2900000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 400, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { err_lead: "$.data.error_id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dal}", tour_date: "2027-04-15", rental_base_cents: 2900000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 400, load_in_start_utc: "2027-04-14T14:00:00Z", tear_down_end_utc: "2027-04-16T06:00:00Z" }
              as: SeriesPromoter
              captures: { err_after: "$.data.error_id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_dal}", tour_date: "2026-09-15", rental_base_cents: 2900000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 400, load_in_start_utc: "2026-09-14T14:00:00Z", tear_down_end_utc: "2026-09-16T06:00:00Z" }
              as: SeriesPromoter
              captures: { err_both: "$.data.error_id" }
          assert:
            - "trigger call 2 returns HTTP 201 at exactly 45 whole days (2026-09-30 -> 2026-11-14): VenueBooking.${b_ok}.state == TERMS_PROPOSED"
            - "trigger call 4 returns HTTP 422 with ${err_lead} == ERR_BOOKING_LEAD_TIME — the identical tour_date is 44 days out from 2026-10-01"
            - "trigger call 5 returns HTTP 422 with ${err_after} == ERR_DATE_OUTSIDE_SEASON: 2027-04-15 is past season_end_date although the lead time is satisfied"
            - "trigger call 6 returns HTTP 422 with ${err_both} == ERR_DATE_OUTSIDE_SEASON, not ERR_BOOKING_LEAD_TIME, even though the date is also in the past relative to the clock"
            - "GET /venue-bookings with season_id ${season} returns total_count == 1 — only the legal booking exists"

      - name: corner_validation_priority_sales_state_over_seat_pool
        claim_type: Priority conflict
        grounds:
