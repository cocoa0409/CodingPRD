# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Commercial Real Estate Brokerage & Leasing
# 9 rules x >= 2 instances each = 19 instances total.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls
# chain drives empty-DB -> the stated precondition using only §1.5 endpoints.
# All numeric asserts are literals computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: net_vs_gross_effective_rent_on_proposal
        grounds:
          - calculations.net_effective_rent
          - entities.Proposal.fields.net_effective_rent_psf_yr
          - state_machines.Deal.PROSPECT_to_LOI_DRAFT
        distinguishing_aspect: |
          Same Proposal inputs feed the net variant (subtracts free-rent credit + TI)
          and the gross variant (omits both); on the Proposal entity domain the two
          differ — base=60, term=36, free=3, ti=25, esc=0.03 yields net 48.48 vs gross 61.82.
        test_recipe:
          setup:
            - "Listing broker firm + listing broker; property + AVAILABLE space + ACTIVE listing; tenant firm + tenant broker + OPEN requirement; a PROSPECT Deal (version 1)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Anchor CRE", side: "LISTING", default_commission_pct: 0.06 }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "Beacon Tenant Rep", side: "TENANT_REP", default_commission_pct: 0.06 }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "Lara List", license_no: "L-1001", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "Tom Tenant", license_no: "T-2001", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "100 Market", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 50000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "300", rentable_sf: 5000, asking_rent_psf_yr: 60, free_rent_months: 3, ti_allowance_psf: 25 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 36, annual_escalation_pct: 0.03, co_broke_offered_pct: 0.5 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "Acme Corp", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 2000, max_sf: 8000, max_rent_psf_yr: 70 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { deal_id: $.data.id, deal_v: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 60, term_months: 36, free_rent_months: 3, ti_allowance_psf: 25, annual_escalation_pct: 0.03, expected_deal_version: "${deal_v}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id_resp: $.data.id }
          assert:
            - "Proposal.${prop_id_resp}.net_effective_rent_psf_yr == 48.48"
            - "Proposal.${prop_id_resp}.outcome == PENDING"

      - name: co_broke_vs_in_house_commission_split
        grounds:
          - calculations.commission_split
          - entities.CommissionSplit.fields.amount
          - state_machines.Deal.LEASE_OUT_to_EXECUTED
        distinguishing_aspect: |
          Same total_commission splits two ways on the CommissionSplit/Deal domain: the
          co-broke variant pays procuring co_broke_offered_pct of total; the in-house
          variant pays the listing side everything and 0.00 to procuring — different
          entity domain from net_vs_gross (which lives on Proposal).
        test_recipe:
          setup:
            - "An EXECUTED in-house Deal (same brokerage on both sides): base=40, term=120, esc=0, rsf=5000 -> consideration 2,000,000.00, eff_pct 0.05 (long-term discount), total_commission 100,000.00; is_co_broke=false."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Solo Dual House", side: "DUAL", default_commission_pct: 0.06 }
              as: BrokerageAdmin
              captures: { bkrg_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "Liam List", license_no: "L-3001", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_id}", full_name: "Tina Tenant", license_no: "T-3002", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "200 Hub", market: "DT-LA", asset_class: "OFFICE", total_sf: 40000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "500", rentable_sf: 5000, asking_rent_psf_yr: 40 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 120, annual_escalation_pct: 0, co_broke_offered_pct: 0.5 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "InHouse Tenant", market: "DT-LA", asset_class: "OFFICE", min_sf: 1000, max_sf: 9000, max_rent_psf_yr: 50 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { deal_id: $.data.id, dv0: $.data.version }
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 40, term_months: 120, annual_escalation_pct: 0, expected_deal_version: "${dv0}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "GET /deals/${deal_id}"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { dv1: $.data.version }
            - call: "POST /deals/${deal_id}/accept"
              payload: { from_side: "TENANT", expected_deal_version: "${dv1}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { dv2: $.data.version }
            - call: "POST /deals/${deal_id}/lease-out"
              payload: { expected_deal_version: "${dv2}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { dv3: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/execute"
              payload: { expected_deal_version: "${dv3}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
          assert:
            - "Deal.${deal_id}.is_co_broke == false"
            - "Deal.${deal_id}.total_commission == 100000.00"
            - "CommissionSplit where deal_id=${deal_id} and side=LISTING has amount == 100000.00"
            - "CommissionSplit where deal_id=${deal_id} and side=PROCURING has amount == 0.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: net_effective_rent_nonlinear_three_input
        grounds:
          - calculations.net_effective_rent
          - entities.Proposal.fields.net_effective_rent_psf_yr
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base, escalation, term, free, ti) with non-linear
          interaction — escalated gross stream compounded per year, then free-rent
          credit and TI subtracted; base=50, term=24, free=2, ti=10, esc=0.05 -> 42.08.
        test_recipe:
          setup:
            - "ACTIVE listing + OPEN requirement + PROSPECT Deal v1 (co-broke), same skeleton as net_vs_gross."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Combo List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "Combo Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB Combo", license_no: "L-4001", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB Combo", license_no: "T-4002", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "300 Tower", market: "RIVER-CHI", asset_class: "OFFICE", total_sf: 30000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "700", rentable_sf: 4000, asking_rent_psf_yr: 50 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 24 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "Combo Tenant", market: "RIVER-CHI", asset_class: "OFFICE", min_sf: 1000, max_sf: 8000, max_rent_psf_yr: 80 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { deal_id: $.data.id, dv0: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "TENANT", base_rent_psf_yr: 50, term_months: 24, free_rent_months: 2, ti_allowance_psf: 10, annual_escalation_pct: 0.05, expected_deal_version: "${dv0}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { p_id: $.data.id }
          assert:
            - "Proposal.${p_id}.net_effective_rent_psf_yr == 42.08"

      - name: commission_residual_rounding_order
        grounds:
          - calculations.commission_split
          - calculations.lease_consideration
          - entities.CommissionSplit.fields.amount
          - state_machines.Deal.LEASE_OUT_to_EXECUTED
        distinguishing_aspect: |
          Mode (b): nested-rounding ORDER matters. consideration sum-then-rounded =
          157,500.00; total_commission 9,450.00; co_broke 0.3333 -> procuring rounds to
          3,149.69, listing is the RESIDUAL 6,300.31 (NOT independently rounded to 6,300.32),
          so the pair conserves total exactly. Distinct mode from net_effective_rent's (a).
        test_recipe:
          setup:
            - "EXECUTED co-broke Deal: base=26.25, term=24, esc=0, rsf=3000 -> consideration 157,500.00; eff_pct 0.06; total_commission 9,450.00; Listing.co_broke_offered_pct=0.3333."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Resid List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "Resid Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB Resid", license_no: "L-5001", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB Resid", license_no: "T-5002", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "400 Plaza", market: "MIDTOWN-NY", asset_class: "OFFICE", total_sf: 20000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "900", rentable_sf: 3000, asking_rent_psf_yr: 26.25 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 24, annual_escalation_pct: 0, co_broke_offered_pct: 0.3333 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "Resid Tenant", market: "MIDTOWN-NY", asset_class: "OFFICE", min_sf: 1000, max_sf: 5000, max_rent_psf_yr: 40 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { deal_id: $.data.id, dv0: $.data.version }
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 26.25, term_months: 24, annual_escalation_pct: 0, expected_deal_version: "${dv0}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "GET /deals/${deal_id}"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { dv1: $.data.version }
            - call: "POST /deals/${deal_id}/accept"
              payload: { from_side: "TENANT", expected_deal_version: "${dv1}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { dv2: $.data.version }
            - call: "POST /deals/${deal_id}/lease-out"
              payload: { expected_deal_version: "${dv2}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { dv3: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/execute"
              payload: { expected_deal_version: "${dv3}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
          assert:
            - "Deal.${deal_id}.total_consideration == 157500.00"
            - "Deal.${deal_id}.total_commission == 9450.00"
            - "CommissionSplit where deal_id=${deal_id} and side=PROCURING has amount == 3149.69"
            - "CommissionSplit where deal_id=${deal_id} and side=LISTING has amount == 6300.31"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_negotiation_cycle_countered_loop
        grounds:
          - state_machines.Deal.LOI_COUNTERED_to_LOI_COUNTERED
          - state_machines.Deal.LOI_DRAFT_to_LOI_COUNTERED
          - entities.Deal.fields.round_count
        distinguishing_aspect: |
          Deal is cyclic: LOI_COUNTERED -> LOI_COUNTERED loops on each alternating
          counter, incrementing round_count without leaving the state — a self-loop
          no linear pipeline has. After 3 counters Deal stays LOI_COUNTERED, round_count==4.
        test_recipe:
          setup:
            - "PROSPECT Deal v1 on an ACTIVE listing/OPEN requirement (co-broke skeleton)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Cyc List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "Cyc Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB Cyc", license_no: "L-6001", role: "LISTING_BROKER" }
              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB Cyc", license_no: "T-6002", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "500 Center", market: "SOMA-SF", asset_class: "OFFICE", total_sf: 30000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "110", rentable_sf: 3000, asking_rent_psf_yr: 55 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 60 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "Cyc Tenant", market: "SOMA-SF", asset_class: "OFFICE", min_sf: 1000, max_sf: 6000, max_rent_psf_yr: 80 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { deal_id: $.data.id, dv0: $.data.version }
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 55, term_months: 60, expected_deal_version: "${dv0}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "GET /deals/${deal_id}"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { dv1: $.data.version }
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "TENANT", base_rent_psf_yr: 48, term_months: 60, expected_deal_version: "${dv1}" }
              as: TenantBroker
              as_user_id: "${tb_id}"
            - call: "GET /deals/${deal_id}"
              payload: {}
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { dv2: $.data.version }
          trigger:
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 52, term_months: 60, expected_deal_version: "${dv2}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { p3_id: $.data.id }
          assert:
            - "Deal.${deal_id}.stage == LOI_COUNTERED"
            - "Deal.${deal_id}.round_count == 3"
            - "Proposal.${p3_id}.outcome == PENDING"

      - name: tour_branch_join_divergent_side_effects
        grounds:
          - state_machines.Tour.CONFIRMED_to_COMPLETED
          - state_machines.Tour.CONFIRMED_to_CANCELLED
          - state_machines.Tour.CONFIRMED_to_NO_SHOW
          - entities.Space.fields.status
        distinguishing_aspect: |
          Tour branches from CONFIRMED into three terminal states whose side-effect sets
          DIVERGE: complete and cancel and no-show all release a space hold, but only via
          different triggers/preconditions — different entity (Tour) from the Deal cycle.
          Here cancel from CONFIRMED releases the ON_HOLD space back to AVAILABLE.
        test_recipe:
          setup:
            - "A CONFIRMED tour holding its space (Space ON_HOLD, Requirement TOURING)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Br List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "Br Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_a_id}", full_name: "LB Br", license_no: "L-7001", role: "LISTING_BROKER" }
              as: BrokerageAdmin
