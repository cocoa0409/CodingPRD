      - name: crew_double_booked_whole_day_exclusivity
        grounds:
          - validations[priority=23]
          - errors[ERR_CREW_DOUBLE_BOOKED]
          - entities.Route.fields.service_date
          - entities.Route.fields.crew_id
        distinguishing_aspect: "Interval semantics B: whole-calendar-day exclusivity on the Crew resource — a crew with an existing non-CLOSED route on 2026-07-01 cannot get a second route on the same service_date regardless of any minute window; different geometry (full-day, no buffer/window arithmetic) and different resource (Crew) than the Route minute-window rule."
        test_recipe:
          setup:
            - "A crew with one PLANNING route on 2026-07-01."
