        grounds:
          - validations.priority_34
          - errors.ERR_INVALID_TIME_RANGE
          - calculations.zone_window_conflict_geometry
        distinguishing_aspect: |
          The rule is strict inequality on a pair of instants, so the interesting
          probe is the degenerate case where the two instants are IDENTICAL - an
          implementation using ends_at >= starts_at accepts it and then owns a
          zero-length interval that the half-open overlap geometry can never
          intersect, which would silently disable the whole conflict check. The
          accepted window is one minute long and QUIET, whose two buffer constants
          are both 0, so the effective edges must equal the nominal ones exactly and
          the shortest legal window in the system is pinned.
