    code: 200
    input: ["limit?", "offset?", "manufacturer_id?", "status?"]
    output: ManufacturerAgreement[]
    side_effects: []
  - method: GET
    path: "/agreements/{id}"
    description: "Fetch one agreement"
    roles: [PlatformAdmin, ContractsManager, ComplianceOfficer, Auditor, FinanceOps, ResellerOps]
    code: 200
    input: []
    output: ManufacturerAgreement
    side_effects: []
  - method: PATCH
    path: "/agreements/{id}"
