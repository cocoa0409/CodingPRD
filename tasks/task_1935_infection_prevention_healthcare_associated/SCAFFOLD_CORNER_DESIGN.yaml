    grounds:
    - calculations.infection_window_period
    - errors[ERR_DOE_OUTSIDE_IWP]
    distinguishing_aspect: 'IWP is closed [specimen-3d, specimen+3d]: DOE on 2026-08-06 (one day before window start 08-07) fails; DOE on 08-07 (first window day) passes.'
    test_recipe:
