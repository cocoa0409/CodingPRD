              payload: { season_id: "${s1}", venue_id: "${v1}", title: "C1", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons/${s1}/advance"
              payload: { target_status: "RENEWAL_WINDOW" }
              as: ArtisticAdmin
            - call: "POST /_clock/set_current_utc"
