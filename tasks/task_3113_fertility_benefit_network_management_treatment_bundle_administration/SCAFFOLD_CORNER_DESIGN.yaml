              payload: {}
              as: ClaimsProcessor
              captures: { occ_cl_v: $.data.version }
            - call: "GET /preauthorizations/${bph}"
              payload: {}
              as: ClaimsProcessor
              captures: { bph_occ_v: $.data.version }
          trigger:
            - call: "POST /claims/${occ_cl}/pay"
              payload: { expected_preauthorization_version: "${bph_occ_v} - 1" }
              as: ClaimsProcessor
              captures: { err_stale: $.data.error_id }
            - call: "POST /claims/${occ_cl}/pay"
              payload: { expected_preauthorization_version: "${bph_occ_v}" }
              as: ClaimsProcessor
              captures: { occ_cl_paid: $.data.version }
          assert:
            - "the stale pay returns 412 and err_stale == ERR_PREAUTH_VERSION_STALE"
            - "Claim.${occ_cl}.claim_status == ADJUDICATED after the stale rejection"
            - "the current-version pay succeeds and Claim.${occ_cl}.claim_status == PAID"
            - "the successful pay advanced Preauthorization.${bph}.version beyond ${bph_occ_v}"
            - "replaying the first payload with ${bph_occ_v} - 1 still returns 412 ERR_PREAUTH_VERSION_STALE"
            - "Claim.${occ_cl}.version > ${occ_cl_v}"

      - name: occ_stale_treatment_cycle_version_on_report_outcome_returns_cycle_version_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[outcome-report-stale-cycle]
          - errors[ERR_CYCLE_VERSION_STALE]
          - endpoints.POST_/clinics/{id}/report-outcome
        distinguishing_aspect: "A third OCC parent on a different entity: reporting an outcome against a cycle whose version advanced after the clinic read it is rejected with 412 ERR_CYCLE_VERSION_STALE, and the rejection persists no OutcomeRecord — so the clinic's reporting workset is provably unchanged by the refusal."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-14T00:00:00Z. The anchored base through a cycle driven to OUTCOME_RECORDED."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /treatment-plans/${bp}/treatment-cycles"
              payload: { preauthorization_id: "${bph}", retrieval_date: "2026-09-28T00:00:00Z", transfer_date: "2026-09-30T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { occ_cy: $.data.id }
            - call: "POST /treatment-cycles/${occ_cy}/start-stimulation"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${occ_cy}/record-retrieval"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${occ_cy}/record-fertilization"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${occ_cy}/record-transfer"
              payload: { transfer_date: "2026-09-30T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${occ_cy}/record-outcome"
              payload: { live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { occ_cy_v: $.data.version }
            - call: "GET /treatment-cycles/${occ_cy}"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { occ_cy_v2: $.data.version }
          trigger:
            - call: "POST /clinics/${bc}/report-outcome"
              payload: { treatment_cycle_id: "${occ_cy}", live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39, expected_treatment_cycle_version: "${occ_cy_v2} - 1" }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { err_stale: $.data.error_id }
            - call: "POST /clinics/${bc}/report-outcome"
              payload: { treatment_cycle_id: "${occ_cy}", live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39, expected_treatment_cycle_version: "${occ_cy_v2}" }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { occ_or: $.data.id }
          assert:
            - "the stale report returns 412 and err_stale == ERR_CYCLE_VERSION_STALE"
            - "GET /outcome-records?clinic_id=${bc} returns 0 rows after the stale rejection"
            - "Clinic.${bc}.cycles_reported == 0 after the stale rejection"
            - "the current-version report succeeds and OutcomeRecord.${occ_or}.outcome_status == RECORDED"
            - "Clinic.${bc}.cycles_reported == 1 and Clinic.${bc}.live_birth_rate_bps == 10000"
            - "TreatmentCycle.${occ_cy}.version == ${occ_cy_v2}"

      - name: derived_field_reconciliation_on_advocate_caseload_and_employer_member_count
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CareAdvocate.fields.current_caseload
          - entities.EmployerAccount.fields.active_member_count
          - endpoints.POST_/members/{id}/complete-care
        distinguishing_aspect: "Two denormalized counters must stay consistent with their source rows: current_caseload counts only CARE_ACTIVE and CARE_COMPLETE members while active_member_count counts those plus INTAKE, so closing one member moves the two counters by different amounts and a naive shared counter drifts."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through a CARE_ACTIVE member, plus a second member on the same advocate left in INTAKE."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_plan
            - call: "POST /members"
              payload: { employer_account_id: "${be}", external_ref: "DERIVED-2", full_name: "Pending Member", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { bm5: $.data.id }
            - call: "POST /members/${bm5}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
          trigger:
            - call: "POST /members/${bm}/complete-care"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bm_done: $.data.version }
          assert:
            - "before the close EmployerAccount.${be}.active_member_count == 2 and CareAdvocate.${ba}.current_caseload == 1"
            - "TreatmentPlan.${bp}.plan_status == PLAN_DRAFT, so the close is refused with ERR_INVALID_STATE and neither counter moves"
            - "after POST /treatment-plans/${bp}/abandon and a successful close, Member.${bm}.member_status == CARE_COMPLETE"
            - "CareAdvocate.${ba}.current_caseload == 1 and CareAdvocate.${ba}.assignments_completed == 1"
            - "EmployerAccount.${be}.active_member_count == 2 — the INTAKE member is still counted while the closed member is not"
            - "GET /members?care_advocate_id=${ba}&member_status=INTAKE returns exactly 1 row, the pending member"

      - name: idempotency_second_outcome_report_for_one_cycle_returns_duplicate_operation
        claim_type: idempotency
        grounds:
          - errors[ERR_DUPLICATE_OPERATION]
          - validations[priority=17]
          - state_machines.OutcomeRecord.RECORDED_to_RECORDED
        distinguishing_aspect: "One outcome record per treatment cycle is enforced: the second report-outcome for the same cycle returns 409 ERR_DUPLICATE_OPERATION with a conforming OCC version, so the refusal is the idempotency gate rather than a stale-version conflict."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-14T00:00:00Z. The anchored base through a cycle driven to OUTCOME_RECORDED and reported once."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
