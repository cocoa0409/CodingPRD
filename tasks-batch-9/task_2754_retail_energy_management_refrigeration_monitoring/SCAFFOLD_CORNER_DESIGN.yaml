              GET /energy-ops/refrigeration-cases/${case_id}/excursions?state=CLOSED
                -> 1 element, total_count 1

      - name: superseded_standard_admits_no_further_transition
        claim_type: terminal_state_lockdown
        grounds: "§1.2 state_machines.SetpointStandard terminal_states [SUPERSEDED], transition standard_superseded (link 1 of the successor's publish chain); §1.4 priority 61 -> ERR_STANDARD_STATE_INVALID; §1.4 priority 100 (a DRAFT successor naming the PUBLISHED predecessor is admitted)"
        distinguishing_aspect: |
          The terminal state is reached by CASCADE, not by a direct call: the
          successor's publish drives the predecessor to SUPERSEDED. From there
          the only transition the API offers (publish) must be refused, and the
          predecessor must stay SUPERSEDED - a terminal state that an
          implementation could accidentally re-open by re-publishing.
        test_recipe:
          setup: |
            standard A (MIXED/SUPERCENTER/SUMMER) published; standard B drafted
            with supersedes_standard_id = A and published, which cascades A to
            SUPERSEDED. No store is commissioned, so the DEGRADE links of the
            publish chain have no target.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_a: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_a}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 780, supersedes_standard_id: "${std_a}" }
              as: EnergyManager
              captures: { std_b: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_b}/publish"
              payload: {}
              as: EnergyManager
          trigger:
            call: "POST /energy-ops/setpoint-standards/${std_a}/publish"
            payload: {}
            as: EnergyManager
            captures: { err: "$.data.error_id" }
          assert: |
            Setup call 4 was admitted (400 would mean priority 100 was applied
            without its supersedes exemption) and setup call 5 returned 200 with
            ${std_b} status "PUBLISHED".
            After setup call 5, GET /energy-ops/setpoint-standards/${std_a}
            reports status == "SUPERSEDED".
            Trigger: 409; data.error_id == "ERR_STANDARD_STATE_INVALID".
            GET /energy-ops/setpoint-standards/${std_a}: status still
            "SUPERSEDED"; published_at_iso unchanged.
            GET /energy-ops/setpoint-standards?status=PUBLISHED returns exactly
            1 element (${std_b}).

      - name: completed_work_order_refuses_schedule_and_completion
        claim_type: terminal_state_lockdown
        grounds: "§1.2 state_machines.MaintenanceWorkOrder terminal_states [COMPLETED], transitions work_order_schedule / work_order_complete; §1.4 priority 69 -> ERR_WORK_ORDER_STATE_INVALID; §1.2 fault_triage_work_order link 1 (work order created in OPEN)"
        distinguishing_aspect: |
          Locks down the one terminal state that carries a money-free but
          posture-relevant cascade: completing the work order already released
          Store.urgent_work_order_count, so a second completion would
          double-release the counter and drive the posture wrong. Both
          transitions available on the entity are refused from COMPLETED, and
          the store's counters are asserted to have moved exactly once.
        test_recipe:
          setup: |
            commissioned store; a REFRIGERATION fault (severity MAJOR,
            occurrence_count 3, affected_load_kw 120.0 -> fault_score 82.5)
            triaged to an URGENT work order, which is then completed. The URGENT
            + REFRIGERATION combination also drove bms_status ACTIVE -> DEGRADED.
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-WT", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/fault-diagnostics"
              payload: { equipment_ref: "RACK-A", equipment_class: "REFRIGERATION", fault_code: "SUCTION-HI", severity: "MAJOR", occurrence_count: 3, affected_load_kw: 120.0 }
              as: MaintenanceTech
              captures: { fault_id: "$.data.id" }
            - call: "POST /energy-ops/fault-diagnostics/${fault_id}/triage"
              payload: { outcome: "WORK_ORDER" }
              as: MaintenanceTech
              captures: { wo_id: "$.data.work_order_id", wo_state: "$.data.work_order_state", wo_priority: "$.data.work_order_priority", urgent_count: "$.data.urgent_work_order_count" }
            - call: "POST /energy-ops/work-orders/${wo_id}/complete"
              payload: { completion_note: "compressor valve replaced; suction pressure normal" }
              as: MaintenanceTech
              captures: { wo_final: "$.data.state" }
          trigger:
            call: "POST /energy-ops/work-orders/${wo_id}/schedule"
            payload: { scheduled_start_iso: "2026-08-02T09:00:00Z", scheduled_end_iso: "2026-08-02T12:00:00Z" }
            as: MaintenanceTech
            captures: { err: "$.data.error_id" }
          assert: |
            Setup: ${wo_state} == "OPEN" (MaintenanceWorkOrder initial state),
            ${wo_priority} == "URGENT" (fault_score 82.5 >= 70.0),
            ${urgent_count} == 1; ${wo_final} == "COMPLETED" with
            completed_at_iso == "2026-08-01T08:00:00Z" and the owning fault
            moved TRIAGED -> RESOLVED.
            Trigger (schedule from COMPLETED): 409, data.error_id ==
            "ERR_WORK_ORDER_STATE_INVALID"; scheduled_start_iso and
            scheduled_end_iso remain null.
            A second POST /energy-ops/work-orders/${wo_id}/complete is likewise
            409 ERR_WORK_ORDER_STATE_INVALID and completion_note is unchanged.
            GET /energy-ops/stores/${store_id}: urgent_work_order_count == 0
            (released exactly once, never negative), energy_posture ==
            "CONSTRAINED" because bms_status is still "DEGRADED" and requires an
            explicit recommission.
            GET /energy-ops/fault-diagnostics/${fault_id}: state == "RESOLVED".

      - name: bypassed_case_readings_are_stored_but_never_evaluated
        claim_type: side_effect_execution
        grounds: "§1.2 case_bypass side effects ('resets consecutive_breach_count to 0', 'subsequent readings are stored on the case but excluded from excursion evaluation'); §1.3 calculations.excursion_exposure input_set (readings of a BYPASSED case take no part in breach evaluation); §1.4 priority 65"
        distinguishing_aspect: |
          A CONDITIONAL cascade suppression: three consecutive breaching readings
          - more than GRACE_READINGS - produce no excursion at all while the case
          is BYPASSED, and the case's own reading fields still update. The bypass
          also resets a breach run that was already in progress (one breach was
