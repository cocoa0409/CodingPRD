                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "On Deadline", email: "t1@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_t1: "$.data.id" }
            - call: "POST /api/students"
              payload: { ssn: "123456789", full_name: "One Second Late", email: "t2@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_t2: "$.data.id" }
          trigger:
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_t1}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-03-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
              captures: { isir_t1: "$.data.id", cohort_t1: "$.data.cohort" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_t2}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-03-01T00:00:01Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
              captures: { isir_t2: "$.data.id", cohort_t2: "$.data.cohort" }
          assert:
