  - name: combinatorial_quarantine_days_six_step_non_commutative_pipeline
    grounds:
    - '§1.3 quarantine_required_days (mode c: six ordered steps, ceil at STEP 2 only, risk_tier keyed on the STEP-2 taxon_days rather than the STEP-4 subtotal)'
    - §1.1 Specimen.quarantine_required_days, QuarantineCase.protocol_days / started_at / projected_release_at
    - §1.3 sustainability_score FINAL (permit bonus and quota pressure)
    - §1.2 AcquisitionRequest PENDING_PERMIT -> CLEARED and CLEARED -> FULFILLED
    - §1.5 POST /aquarium/specimens
    - §1.4 priority 46 ERR_QUOTA_EXCEEDED, priority 47 ERR_CLEARANCE_SCORE_TOO_LOW
    distinguishing_aspect: taxon_days is 36 and the subtotal is 60. HIGH_TIER_TAXON_DAYS is 45, so the tier is STANDARD and no extension applies — but a pipeline that tests the tier against the surcharge-inflated subtotal sees 60 >= 45, adds HIGH_TIER_EXTRA_DAYS and returns 67. The two readings differ by exactly the 7-day extension and by a 7-day shift of projected_release_at.
    test_recipe:
      setup: An ELASMOBRANCH species with base_quarantine_days 24 is acquired by WILD_COLLECTION from a NON_ACCREDITED source institution, so both surcharges apply (14 + 10 = 24). The import permit is issued first so the request can be cleared, then the animal is accessioned with arrival_at 2026-08-01T00:00:00Z.
