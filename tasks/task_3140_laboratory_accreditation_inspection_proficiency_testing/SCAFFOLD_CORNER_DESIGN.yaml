# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3140_laboratory_accreditation_inspection_proficiency_testing
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# Clock default before any set call: 2026-09-01T00:00:00Z.
# A recurring setup chain for a fully-postured lab is factored per-instance
# (each instance is self-contained; no cross-instance anchors).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: laboratory_create_returns_declared_fields_and_applied_state
        claim_type: Creation
        grounds: [entities.Laboratory, endpoints.POST_/laboratories]
        distinguishing_aspect: "POST /laboratories with name + clia_number returns 201 with accreditation_status APPLIED, active_discipline_count 0, version 1, and system-generated id/created_at/updated_at — accreditation_status is never client-supplied."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /laboratories"
              payload: { name: "Apex Regional Lab", clia_number: "45D1000001" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Laboratory.${lab_id}.accreditation_status == APPLIED"
            - "Laboratory.${lab_id}.active_discipline_count == 0"
            - "Laboratory.${lab_id}.version == 1 with non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: laboratory_duplicate_clia_rejected
        claim_type: TypeConstraints
        grounds:
          - entities.Laboratory.fields.clia_number
          - errors[ERR_DUPLICATE_CLIA]
        distinguishing_aspect: "The clia_number uniqueness constraint is global: a second laboratory with the same clia_number is rejected with ERR_DUPLICATE_CLIA even though every other field differs."
        test_recipe:
          setup: ["One laboratory with clia_number 45D1000002 exists."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "First Lab", clia_number: "45D1000002" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /laboratories"
              payload: { name: "Second Lab", clia_number: "45D1000002" }
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status 409, error_id == ERR_DUPLICATE_CLIA"

      - name: laboratory_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/laboratories/{labId}
        distinguishing_aspect: "GET on a laboratory id that was never created returns 404 with a not-found error_id from the catalog."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /laboratories/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and error_id is ERR_NOT_FOUND or ERR_LABORATORY_NOT_FOUND"

      - name: enrollment_duplicate_discipline_rejected
        claim_type: TypeConstraints
        grounds:
          - entities.DisciplineEnrollment.fields.discipline
          - errors[ERR_DUPLICATE_ENROLLMENT]
        distinguishing_aspect: "One enrollment per (laboratory_id, discipline): a second CHEMISTRY enrollment for the same laboratory fails with ERR_DUPLICATE_ENROLLMENT while the same discipline on a DIFFERENT laboratory succeeds."
        test_recipe:
          setup: ["Lab L1 and L2 exist; L1 already enrolled in CHEMISTRY."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Dup Lab One", clia_number: "45D1000003" }
              as: AccreditationOfficer
              captures: { lab1: $.data.id }
            - call: "POST /laboratories"
              payload: { name: "Dup Lab Two", clia_number: "45D1000004" }
              as: AccreditationOfficer
              captures: { lab2: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab1}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab1}"
          trigger:
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab1}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab1}"
              captures: { err: $.data.error_id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab2}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab2}"
          assert:
            - "First duplicate call: 409 ERR_DUPLICATE_ENROLLMENT"
            - "Second call (different laboratory, same discipline): 201"

      - name: pt_subscription_requires_critical_analyte
        claim_type: Required Fields
        grounds:
          - entities.PTSubscription.fields.analytes
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The analytes array must be non-empty AND contain at least one analyte with critical == true: an all-non-critical array is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment (one section assigned)."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Sub Lab", clia_number: "45D1000005" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "sodium", critical: false }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400, error_id == ERR_INVALID_REQUEST (no critical analyte)"

      - name: system_fields_ignore_client_supplied_values
        claim_type: System Fields
        grounds: [entities.Laboratory]
        distinguishing_aspect: "Client-supplied accreditation_status / version / created_at on create are ignored; the server stamps its own values."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /laboratories"
              payload: { name: "Sneaky Lab", clia_number: "45D1000006" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
          assert:
            - "Laboratory.${lab_id}.accreditation_status == APPLIED and version == 1 regardless of any client-supplied overrides"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: enrollment_initial_state_is_waiting_until_first_checklist
        claim_type: initial_state
        grounds: [state_machines.DisciplineEnrollment]
        distinguishing_aspect: "A newly created DisciplineEnrollment starts WAITING; the laboratory stays APPLIED; only the first assign-checklist flips the enrollment ACTIVE and the laboratory ENROLLED."
        test_recipe:
          setup: ["Lab L created; one enrollment E created; one section S created (no checklist assigned yet)."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Init Lab", clia_number: "45D1000010" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "HEMATOLOGY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id, enr_v: $.data.version }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "CBC", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "HEM", checklist_version: "2026" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "HEM", checklist_version: "2026", expected_enrollment_version: "${enr_v}" }
              as: AccreditationOfficer
          assert:
            - "Before assignment: DisciplineEnrollment.${enr_id}.status == WAITING and Laboratory.${lab_id}.accreditation_status == APPLIED"
            - "After assignment: TestingSection.${sec_id}.checklist_status == ASSIGNED with checklist_code CHM and checklist_version 2026 pinned"
            - "DisciplineEnrollment.${enr_id}.status == ACTIVE and Laboratory.${lab_id}.accreditation_status == ENROLLED"
            - "Laboratory.${lab_id}.active_discipline_count == 1"

      - name: assign_checklist_on_assigned_section_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TestingSection
          - errors[ERR_CHECKLIST_ALREADY_ASSIGNED]
        distinguishing_aspect: "ASSIGNED is not a re-assignable state: assign-checklist on an already-ASSIGNED section fails with ERR_CHECKLIST_ALREADY_ASSIGNED; only CHECKLIST_INVALIDATED sections may be re-assigned."
        test_recipe:
          setup: ["Lab with ACTIVE enrollment; section S ASSIGNED to CHM/2026."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Twice Lab", clia_number: "45D1000011" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_CHECKLIST_ALREADY_ASSIGNED"
            - "TestingSection.${sec_id}.checklist_status remains ASSIGNED with the original pin"

      - name: checklist_edition_retirement_invalidates_and_reassign_restores
        claim_type: side_effect_execution
        grounds: [state_machines.TestingSection.ASSIGNED_to_CHECKLIST_INVALIDATED, state_machines.TestingSection.CHECKLIST_INVALIDATED_to_ASSIGNED]
        distinguishing_aspect: "Registering CHM/2027 with retires_checklist_version 2026 flips every section pinned to CHM/2026 to CHECKLIST_INVALIDATED (retired_count == 1) WITHOUT touching the enrollment's ACTIVE state; re-assigning the section to CHM/2027 restores ASSIGNED."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment; section S ASSIGNED to CHM/2026. Checklist edition CHM/2026 registered."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Edition Lab", clia_number: "45D1000012" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
          trigger:
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2027", retires_checklist_version: "2026" }
              as: AccreditationOfficer
              captures: { retired: $.data.retired_count }
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2027" }
              as: AccreditationOfficer
          assert:
            - "retired_count == 1 and TestingSection.${sec_id}.checklist_status == CHECKLIST_INVALIDATED after edition registration"
            - "DisciplineEnrollment.${enr_id}.status stays ACTIVE (invalidation does not cascade to enrollment)"
            - "Re-assignment succeeds: TestingSection.${sec_id}.checklist_status == ASSIGNED with checklist_version 2027"

      - name: cease_enrollment_blocks_new_pt_subscription
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=5]
          - errors[ERR_ENROLLMENT_INACTIVE]
        distinguishing_aspect: "PT subscription creation requires an ACTIVE enrollment: after cease-testing drives the enrollment to CEASED, POST /pt-subscriptions for it is rejected with ERR_ENROLLMENT_INACTIVE."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment, PT subscription, one UNSATISFACTORY result [50] -> investigation OPEN; second shipment with another UNSATISFACTORY result -> standing_rolling UNSATISFACTORY; first investigation resolved, second investigation UNDER_REVIEW, then cease-testing -> enrollment CEASED."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Ceased Sub Lab", clia_number: "45D1000013" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh1}", collected_at: "2026-09-02T00:00:00Z", analyte_scores: [{ name: "glucose", score: 50 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /pt-shipments/${sh1}/close"
              payload: {}
              as: PTCoordinator
            - call: "GET /pt-investigations"
              payload: { enrollment_id: "${enr_id}" }
              as: AccreditationOfficer
              captures: { inv1: "$.data[0].id" }
            - call: "POST /pt-investigations/${inv1}/resolve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-B" }
              as: PTCoordinator
              captures: { sh2: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh2}", collected_at: "2026-09-02T12:00:00Z", analyte_scores: [{ name: "glucose", score: 50 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "GET /pt-investigations"
              payload: { enrollment_id: "${enr_id}" }
              as: AccreditationOfficer
              captures: { inv2: "$.data[1].id" }
            - call: "POST /pt-investigations/${inv2}/cease-testing"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "sodium", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { err: $.data.error_id }
          assert:
            - "DisciplineEnrollment.${enr_id}.status == CEASED"
            - "POST /pt-subscriptions -> 409 ERR_ENROLLMENT_INACTIVE"

      - name: investigation_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PTInvestigation]
        distinguishing_aspect: "From RESOLVED (terminal), begin-review, require-corrective-action, resolve and cease-testing are all rejected with ERR_INVALID_INVESTIGATION_STATE."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment; one UNSATISFACTORY result created an investigation; investigation resolved from OPEN."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Lock Lab", clia_number: "45D1000014" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh1}", collected_at: "2026-09-02T00:00:00Z", analyte_scores: [{ name: "glucose", score: 50 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "GET /pt-investigations"
              payload: { enrollment_id: "${enr_id}" }
              as: AccreditationOfficer
              captures: { inv1: "$.data[0].id" }
            - call: "POST /pt-investigations/${inv1}/resolve"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /pt-investigations/${inv1}/begin-review"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_INVALID_INVESTIGATION_STATE; PTInvestigation.${inv1}.status stays RESOLVED"

      - name: cease_testing_requires_rolling_unsatisfactory_standing
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PTInvestigation.OPEN_to_TESTING_CEASED
          - errors[ERR_CESSATION_REQUIRES_ROLLING_UNSATISFACTORY]
        distinguishing_aspect: "cease-testing is gated on standing_rolling == UNSATISFACTORY: after a SINGLE unsuccessful event (standing_per_event UNSATISFACTORY, standing_rolling SATISFACTORY because len(E) < 2), cease-testing is rejected — per-event failure alone never justifies cessation."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment; one shipment graded UNSATISFACTORY ([50] on critical glucose) -> investigation INV OPEN, standing_per_event UNSATISFACTORY, standing_rolling SATISFACTORY."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Single Fail Lab", clia_number: "45D1000015" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh1}", collected_at: "2026-09-02T00:00:00Z", analyte_scores: [{ name: "glucose", score: 50 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "GET /pt-investigations"
              payload: { enrollment_id: "${enr_id}" }
              as: AccreditationOfficer
              captures: { inv1: "$.data[0].id" }
          trigger:
            - call: "POST /pt-investigations/${inv1}/cease-testing"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_CESSATION_REQUIRES_ROLLING_UNSATISFACTORY"
            - "PTInvestigation.${inv1}.status stays OPEN; DisciplineEnrollment.${enr_id}.status stays ACTIVE"

      - name: resolve_from_corrective_action_restores_enrollment_and_streak
        claim_type: side_effect_execution
        grounds:
          - state_machines.PTInvestigation.CORRECTIVE_ACTION_REQUIRED_to_RESOLVED
        distinguishing_aspect: "resolve from CORRECTIVE_ACTION_REQUIRED both restores the SUSPENDED enrollment to ACTIVE AND resets unsuccessful_event_streak to 0 — but deliberately leaves standing_per_event / standing_rolling UNSATISFACTORY (they are functions of graded history, not of investigation state)."
        test_recipe:
          setup: ["Lab with ACTIVE CHEMISTRY enrollment; one UNSATISFACTORY result ([50]) -> INV OPEN -> UNDER_REVIEW -> require-corrective-action (enrollment SUSPENDED)."]
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Restore Lab", clia_number: "45D1000016" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Chem", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
