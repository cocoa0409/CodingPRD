              as: RightsAdministrator
              captures: { gx_id: $.data.id }
            - call: "POST /consent-grants/${gx_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
              captures: { t_v2: $.data.version }
          trigger:
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Adjacent successor term", territory_codes: ["US", "MX"], exclusivity: "NON_EXCLUSIVE", effective_from: "2027-02-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v2}" }
              as: RightsAdministrator
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
              captures: { t_v3: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "One day too early", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2027-01-31T00:00:00Z", effective_until: "2027-06-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v3}" }
              as: RightsAdministrator
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["EPISODIC"], permitted_use_notes: "Overlapping in time but a different medium", territory_codes: ["US", "MX"], exclusivity: "EXCLUSIVE", effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", initial_creation_fee_cents: 200000, per_use_base_fee_cents: 100000, expected_talent_version: "${t_v3}" }
              as: RightsAdministrator
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
              captures: { t_v4: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Overlapping in time but a disjoint territory", territory_codes: ["JP"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v4}" }
              as: RightsAdministrator
          assert:
            - "trigger call 1 -> 201: a term beginning exactly at the exclusive term's effective_until is adjacent, not overlapping, under half-open semantics"
            - "trigger call 3 -> 409 with error.id == ERR_EXCLUSIVITY_WINDOW_CONFLICT: [2027-01-31, 2027-06-01) overlaps [2026-08-01, 2027-02-01) by one day and shares ADVERTISING and US"
            - "trigger call 4 -> 201: the time ranges overlap but permitted_media_types are disjoint (EPISODIC vs ADVERTISING)"
            - "trigger call 6 -> 201: the time ranges and the media type overlap but territory_codes are disjoint (JP vs US/MX)"
            - "GET /consent-grants?talent_id=${t_id} returns exactly 4 grants — the rejected one was never persisted"
            - "the rejected attempt does not bump Talent.${t_id}.version, so the version captured as t_v3 was still current for trigger call 4"
            - "only the exclusive grant is countersigned, and its INITIAL_CREATION entry is 300000 * 1.00 (one medium) * 1.00 (6 months, short term) * 1.35 (EXCLUSIVE) = 405000, above the 300000 floor: ConsentGrant.${gx_id}.initial_compensation_cents == 405000, union_topup_cents == 0, total_compensation_cents == 405000, with shares 303750 / 81000 / 20250"
            - "GET /compensation-entries?talent_id=${t_id} therefore returns exactly 1 entry and Talent.${t_id}.lifetime_compensation_cents == 405000"

