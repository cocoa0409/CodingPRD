  - rule_id: compensating_invariant
    instances:
      - name: voiding_reservation_restores_program_ledger_and_frees_stacking_headroom
        grounds:
          - state_machines.RebateClaim.RESERVED_to_VOID
          - calculations.program_budget_reservation
          - calculations.rebate_award
          - entities.IncentiveProgram.fields.reserved_budget_cents
          - endpoints[POST /rebate-claims/{claimId}/void]
        distinguishing_aspect: |
          The compensated invariant is the program's three-bucket cents ledger
          (total == remaining + reserved + paid): voiding the 423000-cent reservation returns exactly that
          amount from reserved to remaining with no drift, and because VOID claims leave the sibling set the next
          claim sees the full 480000-cent ceiling as headroom and reserves its whole 211500-cent award instead of
          the 57000 cents it would have been truncated to.
        test_recipe:
          setup:
            - "A 2-unit PWX_A system (installed_cost_cents 3200000) is INSTALLED with LIMITED_EXPORT approval."
            - "IncentiveProgram 'State Storage Capacity Incentive' (5000000 cents, 5000 bp stack ceiling) holds a RESERVED claim of 423000 cents for this system."
            - "IncentiveProgram 'Tight-Stack Municipal Adder' (5000000 cents, 1500 bp stack ceiling, tier1_limit 20, rates 10000/5000, cap 500000) has no claim yet."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /battery-systems"
              payload: { site_id: "${site_id}", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_A", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 3200000 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /battery-systems/${sys_id}/lock-design"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits"
              payload: { battery_system_id: "${sys_id}", jurisdiction_code: "AHJ_CITY", plan_set_ref: "PS-2790-A" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits/${permit_id}/review"
              payload: { decision: "ISSUE", expires_on: "2027-06-30" }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /interconnection-applications"
              payload: { battery_system_id: "${sys_id}", export_mode: "LIMITED_EXPORT", requested_export_kw: 8.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { app_id: $.data.id }
            - call: "POST /interconnection-applications/${app_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /interconnection-applications/${app_id}/review"
              payload: { decision: "APPROVE_TO_INSTALL", approved_export_kw: 8.0 }
              as: UtilityInterconnectionReviewer
              as_user_id: "utility-rev-1"
            - call: "POST /battery-systems/${sys_id}/mark-installed"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /incentive-programs"
              payload: { name: "State Storage Capacity Incentive", program_type: "STATE_CAPACITY", total_budget_cents: 5000000, tier1_limit_kwh: 20, tier1_rate_cents_per_kwh: 20000, tier2_rate_cents_per_kwh: 10000, per_project_cap_cents: 1500000, stack_priority: 1, max_stack_pct_of_cost_bp: 5000, requires_export_commitment: false, min_capacity_commitment_kw: 5.0 }
              as: RebateAdministrator
              as_user_id: "rebate-admin-1"
              captures: { prog_state: $.data.id }
            - call: "POST /incentive-programs"
              payload: { name: "Tight-Stack Municipal Adder", program_type: "FEDERAL_ADDER", total_budget_cents: 5000000, tier1_limit_kwh: 20, tier1_rate_cents_per_kwh: 10000, tier2_rate_cents_per_kwh: 5000, per_project_cap_cents: 500000, stack_priority: 3, max_stack_pct_of_cost_bp: 1500, requires_export_commitment: false, min_capacity_commitment_kw: 3.0 }
              as: RebateAdministrator
              as_user_id: "rebate-admin-1"
              captures: { prog_tight: $.data.id }
            - call: "GET /battery-systems/${sys_id}"
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_v1: $.data.version }
            - call: "POST /rebate-claims"
              payload: { battery_system_id: "${sys_id}", program_id: "${prog_state}", capacity_commitment_kw: 8.0, export_commitment: "LIMITED_EXPORT", expected_battery_system_version: "${sys_v1}" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { claim_a: $.data.id }
          trigger:
            - call: "POST /rebate-claims/${claim_a}/void"
              payload: { reason: "Homeowner switched to the municipal adder." }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "GET /battery-systems/${sys_id}"
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_v2: $.data.version }
            - call: "POST /rebate-claims"
              payload: { battery_system_id: "${sys_id}", program_id: "${prog_tight}", capacity_commitment_kw: 5.0, export_commitment: "LIMITED_EXPORT", expected_battery_system_version: "${sys_v2}" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { claim_b: $.data.id }
          assert:
            - "RebateClaim.${claim_a}.status == VOID"
            - "IncentiveProgram.${prog_state}.reserved_budget_cents == 0"
            - "IncentiveProgram.${prog_state}.remaining_budget_cents == 5000000"
            - "IncentiveProgram.${prog_state}.total_budget_cents == IncentiveProgram.${prog_state}.remaining_budget_cents + IncentiveProgram.${prog_state}.reserved_budget_cents + IncentiveProgram.${prog_state}.paid_budget_cents"
            - "RebateClaim.${claim_b}.stack_ceiling_cents == 480000"
            - "RebateClaim.${claim_b}.reserved_amount_cents == 211500"
            - "RebateClaim.${claim_b}.reserved_amount_cents != 57000"
            - "IncentiveProgram.${prog_tight}.reserved_budget_cents == 211500"
            - "IncentiveProgram.${prog_tight}.remaining_budget_cents == 4788500"
      - name: enrollment_withdrawal_restores_event_pledged_capacity_ledger
        grounds:
          - state_machines.ByodEnrollment.ENROLLED_to_WITHDRAWN
          - state_machines.DispatchPerformance.PENDING_to_CANCELLED
          - entities.DispatchEvent.fields.enrolled_pledged_kw
          - entities.DispatchEvent.fields.total_net_payment_cents
          - endpoints[POST /byod-enrollments/{enrollmentId}/withdraw]
        distinguishing_aspect: |
          A different invariant on a different aggregate than the money ledger: DispatchEvent.enrolled_pledged_kw
          must always equal the sum of pledged_kw_snapshot over that event's non-CANCELLED performances, so
          withdrawing the only participant returns the ledger to exactly 0.0 kW and the subsequent settlement of
