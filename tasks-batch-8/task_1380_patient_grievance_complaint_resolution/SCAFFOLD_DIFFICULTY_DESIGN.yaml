            - "asa_st == 'RELEASED' and n1 == 0 (release -1, then supersede released the caseB PRIMARY: -1)"
            - "n2 == 1 (supersede target now held by inv2)"
            - "act1 is an empty array — counter == count(ACTIVE assignments) exactly, no drift from the release+supersede pair"
