scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: fund_creation_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.Fund.fields.cutoff_time_utc
          - entities.Fund.fields.status
          - "endpoints[POST /funds]"
        distinguishing_aspect: "A fund created without cutoff_time_utc or status comes back with cutoff_time_utc 16:00:00, status ACTIVE, version 1 and a server-minted UUID id carrying no type prefix."
        test_recipe:
          setup:
            - "Empty database; the logical clock has not been moved."
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id, fund_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "Fund.${fund_id}.cutoff_time_utc == 16:00:00"
            - "Fund.${fund_id}.status == ACTIVE"
            - "Fund.${fund_id}.version == 1"
            - "Fund.${fund_id}.id is a bare UUID with no prefix before the first hyphen group"
            - "the response envelope carries meta.api_request_id and response_type object"

      - name: share_class_creation_initialises_total_shares_outstanding_to_zero
        claim_type: computed_fields
        grounds:
          - entities.ShareClass.fields.total_shares_outstanding
          - "endpoints[POST /share-classes]"
        distinguishing_aspect: "total_shares_outstanding is source computed and starts at exactly 0.000 on a newly created class regardless of what the request body contains."
        test_recipe:
          setup:
            - "One fund exists."
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
          assert:
            - "HTTP status is 201"
            - "ShareClass.${sc_a}.total_shares_outstanding == 0.000"
            - "ShareClass.${sc_a}.cdsc_enabled == false"
            - "ShareClass.${sc_a}.twelve_b_one_fee_pct == 0.0025"

      - name: account_creation_defaults_to_cash_dividends_and_pending_docs
        claim_type: defaults
        grounds:
          - entities.ShareholderAccount.fields.dividend_option
          - entities.ShareholderAccount.fields.status
          - entities.ShareholderAccount.fields.tin_certified
          - state_machines.ShareholderAccount.initial_state
        distinguishing_aspect: "An account created without dividend_option comes back with CASH, status PENDING_DOCS, tin_certified false, household_basis_amount 0.00 and household_basis_variant MARKET_VALUE_BASIS for a DIRECT channel."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "UGMA_UTMA", account_channel: "DIRECT", state_code: "CA", tax_id: "151-51-5151", primary_owner_name: "Minor Custodial" }
              as: TransferAgentOperator
              captures: { acc: $.data.id }
          assert:
            - "HTTP status is 201"
            - "ShareholderAccount.${acc}.dividend_option == CASH"
            - "ShareholderAccount.${acc}.status == PENDING_DOCS"
            - "ShareholderAccount.${acc}.tin_certified == false"
            - "ShareholderAccount.${acc}.household_basis_amount == 0.00"
            - "ShareholderAccount.${acc}.household_basis_variant == MARKET_VALUE_BASIS"
            - "ShareholderAccount.${acc}.linked_primary_account_id is null"

      - name: omnibus_account_creation_sets_historical_cost_basis_variant
        claim_type: computed_fields
        grounds:
          - entities.ShareholderAccount.fields.household_basis_variant
          - entities.ShareholderAccount.fields.account_channel
        distinguishing_aspect: "household_basis_variant is derived from account_channel at creation: OMNIBUS yields HISTORICAL_COST_BASIS while NETWORKED yields MARKET_VALUE_BASIS."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "CORPORATE", account_channel: "OMNIBUS", state_code: "NY", tax_id: "161-61-6161", primary_owner_name: "Omni Street Name", dealer_firm_code: "DLR777" }
              as: TransferAgentOperator
              captures: { acc_o: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "CORPORATE", account_channel: "NETWORKED", state_code: "NY", tax_id: "171-71-7171", primary_owner_name: "Net Street Name", dealer_firm_code: "DLR777" }
              as: TransferAgentOperator
              captures: { acc_n: $.data.id }
          assert:
            - "ShareholderAccount.${acc_o}.household_basis_variant == HISTORICAL_COST_BASIS"
            - "ShareholderAccount.${acc_n}.household_basis_variant == MARKET_VALUE_BASIS"

      - name: get_fund_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_FUND_NOT_FOUND]
          - "validations[priority=40]"
        distinguishing_aspect: "A GET against a syntactically valid but unknown fund id returns 404 ERR_FUND_NOT_FOUND rather than an empty object."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /funds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_FUND_NOT_FOUND"

      - name: get_trade_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_TRADE_NOT_FOUND]
          - "validations[priority=40]"
        distinguishing_aspect: "A second not-found surface on a different entity: an unknown trade id returns 404 ERR_TRADE_NOT_FOUND, proving the error catalog is entity specific rather than one generic code."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /trades/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_TRADE_NOT_FOUND"

      - name: create_share_class_missing_required_breakpoint_tiers_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=30]"
          - errors[ERR_INVALID_REQUEST]
          - entities.ShareClass.fields.breakpoint_tiers
        distinguishing_aspect: "breakpoint_tiers has source input with no default, so omitting it is a 422 ERR_INVALID_REQUEST and no ShareClass row is created."
        test_recipe:
          setup:
            - "One fund exists."
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000 }
              as: FundAccountant
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /share-classes with fund_id ${fund_id} returns an empty array with total_count 0"

      - name: create_account_with_invalid_registration_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "validations[priority=30]"
          - entities.ShareholderAccount.fields.registration_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "registration_type is a closed enum of seven values; SOLE_PROPRIETOR is not among them and must be rejected with 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "SOLE_PROPRIETOR", account_channel: "DIRECT", state_code: "CA", tax_id: "181-81-8181", primary_owner_name: "Not A Type" }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: share_ledger_entry_is_append_only_with_no_version_field_semantics
        claim_type: immutability
        grounds:
          - entities.ShareLedgerEntry.fields.share_delta
          - entities.ShareLedgerEntry.fields.resulting_share_balance
          - "endpoints[GET /share-ledger-entries]"
        distinguishing_aspect: "ShareLedgerEntry is declared common_fields false, so it carries only id and created_at, has no mutation endpoint, and a rejected repeat settlement appends nothing: the trade still has exactly one ledger row."
        test_recipe:
          setup:
            - "Class A, CA registration of 1000000.00, account L is DIRECT/CA and ACTIVE, NAV 2026-08-03 at the 10.0000 seed and FINAL."
            - "A 60000.00 purchase has been priced and settled, producing one ledger entry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "191-91-9191", primary_owner_name: "Lea Ledger" }
              as: TransferAgentOperator
              captures: { acc_l: $.data.id }
            - call: "POST /shareholder-accounts/${acc_l}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_l}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_l: $.data.id }
            - call: "POST /trades/${t_l}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_l}/settle"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades/${t_l}/settle"
              payload: {}
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
            - call: "GET /share-ledger-entries"
              payload: { trade_id: "${t_l}" }
              as: TransferAgentOperator
              captures: { entry_id: "$.data[0].id", entry_delta: "$.data[0].share_delta" }
          assert:
            - "the repeat settle returns HTTP 409 with error_id ERR_INVALID_TRADE_STATE"
            - "GET /share-ledger-entries with trade_id ${t_l} returns total_count 1"
            - "ShareLedgerEntry.${entry_id}.share_delta == 5730.000"
            - "ShareLedgerEntry.${entry_id}.entry_reason == PURCHASE_SETTLEMENT"
            - "ShareLedgerEntry.${entry_id}.resulting_share_balance == 5730.000"
            - "ShareLedgerEntry.${entry_id}.effective_date == 2026-08-03"

      - name: position_row_appears_only_after_settlement
        claim_type: parent_relationships
        grounds:
          - entities.Position.fields.account_id
          - "endpoints[GET /shareholder-accounts/{id}/positions]"
          - state_machines.Trade.UNSETTLED_to_SETTLED
        distinguishing_aspect: "Position has no creation endpoint: the account's position list is empty while the trade is priced but unsettled, and holds exactly one row with shares 5730.000 immediately after settlement."
        test_recipe:
          setup:
            - "Class A, CA registration of 1000000.00, account Q is DIRECT/CA and ACTIVE, NAV 2026-08-03 at the 10.0000 seed and FINAL."
            - "A 60000.00 purchase has been priced to PRICED_FINAL but not settled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "212-12-1212", primary_owner_name: "Quinn Position" }
              as: TransferAgentOperator
              captures: { acc_q: $.data.id }
            - call: "POST /shareholder-accounts/${acc_q}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_q}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_q: $.data.id }
            - call: "POST /trades/${t_q}/price"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "GET /shareholder-accounts/${acc_q}/positions"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_q}/settle"
              payload: {}
              as: TransferAgentOperator
            - call: "GET /positions"
              payload: { account_id: "${acc_q}" }
              as: TransferAgentOperator
              captures: { pos_q: "$.data[0].id" }
          assert:
            - "the first positions list returns total_count 0"
            - "the second list returns total_count 1"
            - "Position.${pos_q}.shares == 5730.000"
            - "Position.${pos_q}.cost_basis_amount == 60000.00"
            - "Position.${pos_q}.avg_cost_per_share == 10.4712"
            - "Position.${pos_q}.first_purchase_date == 2026-08-03"
            - "Position.${pos_q}.reinvested_shares == 0.000"

      - name: account_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "endpoints[GET /shareholder-accounts]"
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three accounts on file, limit 2 offset 0 returns exactly two rows with total_count 3 and has_more true, and offset 2 returns one row with has_more false."
        test_recipe:
          setup:
            - "Three DIRECT/CA accounts exist in PENDING_DOCS."
          setup_api_calls:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "221-11-1111", primary_owner_name: "Page One" }
              as: TransferAgentOperator
              captures: { p1: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "222-22-2222", primary_owner_name: "Page Two" }
              as: TransferAgentOperator
              captures: { p2: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "223-33-3333", primary_owner_name: "Page Three" }
              as: TransferAgentOperator
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /shareholder-accounts"
              payload: { limit: 2, offset: 0 }
              as: TransferAgentOperator
            - call: "GET /shareholder-accounts"
              payload: { limit: 2, offset: 2 }
              as: TransferAgentOperator
          assert:
            - "the first page returns 2 items with total_count 3 and has_more true"
            - "the second page returns 1 item with total_count 3 and has_more false"
            - "the response_type is array on both calls"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_on_an_already_active_account_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.ShareholderAccount.PENDING_DOCS_to_ACTIVE
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - "validations[priority=80]"
        distinguishing_aspect: "The activate transition is declared only from PENDING_DOCS, so a second activate on the same account returns 409 ERR_ACCOUNT_NOT_ACTIVE and leaves version unchanged from the first activation."
        test_recipe:
          setup:
            - "One DIRECT/CA account that has already been activated with tin_certified true."
          setup_api_calls:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "231-31-3131", primary_owner_name: "Ida Idempotent" }
              as: TransferAgentOperator
              captures: { acc_i: $.data.id }
            - call: "POST /shareholder-accounts/${acc_i}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
              captures: { acc_i_v: $.data.version }
          trigger:
            - call: "POST /shareholder-accounts/${acc_i}/activate"
              payload: { tin_certified: false }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id ERR_ACCOUNT_NOT_ACTIVE"
            - "ShareholderAccount.${acc_i}.status == ACTIVE"
            - "ShareholderAccount.${acc_i}.tin_certified == true (the rejected call did not overwrite it)"
            - "ShareholderAccount.${acc_i}.version == ${acc_i_v}"

      - name: close_account_still_holding_shares_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ShareholderAccount.ACTIVE_to_CLOSED
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: "The close transition requires every Position of the account to hold exactly 0.000 shares; an account holding 5730.000 shares is refused and stays ACTIVE."
        test_recipe:
          setup:
            - "Class A, CA registration of 1000000.00, account H is DIRECT/CA and ACTIVE holding 5730.000 shares from a settled 60000.00 purchase."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}, {min_qualifying_amount: 50000, load_pct: 0.045}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "241-41-4141", primary_owner_name: "Hank Holder" }
              as: TransferAgentOperator
              captures: { acc_h: $.data.id }
            - call: "POST /shareholder-accounts/${acc_h}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_h}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 60000.00 }
              as: TransferAgentOperator
              captures: { t_h: $.data.id }
            - call: "POST /trades/${t_h}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_h}/settle"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /shareholder-accounts/${acc_h}/close"
              payload: {}
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id ERR_ACCOUNT_NOT_ACTIVE"
            - "ShareholderAccount.${acc_h}.status == ACTIVE"
            - "ShareholderAccount.${acc_h}.closed_at is null"

      - name: restrict_suspends_active_plans_and_reinstate_does_not_resume_them
        claim_type: conditional_cascade
        grounds:
          - state_machines.ShareholderAccount.ACTIVE_to_RESTRICTED
          - state_machines.ShareholderAccount.RESTRICTED_to_ACTIVE
          - state_machines.SystematicPlan.ACTIVE_to_SUSPENDED
          - entities.SystematicPlan.fields.suspension_reason
        distinguishing_aspect: "Restricting the account cascades the plan to SUSPENDED with suspension_reason ACCOUNT_RESTRICTED, and the reinstate transition is explicitly declared NOT to resume it, so the plan is still SUSPENDED after the account returns to ACTIVE."
        test_recipe:
          setup:
            - "Class A, account W is DIRECT/CA and ACTIVE, with one ACTIVE SYSTEMATIC_INVESTMENT plan of 500.00 monthly."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}] }
              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "251-51-5151", primary_owner_name: "Wendy Plan" }
              as: TransferAgentOperator
              captures: { acc_w: $.data.id }
            - call: "POST /shareholder-accounts/${acc_w}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
              captures: { acc_w_v: $.data.version }
            - call: "POST /systematic-plans"
              payload: { account_id: "${acc_w}", plan_type: "SYSTEMATIC_INVESTMENT", source_share_class_id: "${sc_a}", amount: 500.00, frequency: "MONTHLY", next_run_date: "2026-09-01", expected_account_version: "${acc_w_v}" }
              as: TransferAgentOperator
              captures: { plan_w: $.data.id }
          trigger:
            - call: "POST /shareholder-accounts/${acc_w}/restrict"
              payload: { restriction_reason: "Suspicious activity report filed" }
