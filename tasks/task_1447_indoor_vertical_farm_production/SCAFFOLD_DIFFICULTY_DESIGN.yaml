            - { call: "GET /farm/batches/${b1}", as: Grower, captures: { res_before: "$.data.reserved_lb", avail_before: "$.data.packed_available_lb" } }
          trigger:
            - { call: "POST /farm/contracts/${ct1}/terminate", as: ContractsManager, captures: { ct_status: "$.data.contract_status" } }
            - { call: "GET /farm/shipments/${s1}", as: ContractsManager, captures: { s_status: "$.data.shipment_status" } }
            - { call: "GET /farm/shipments/${s1}/lines", as: ContractsManager, captures: { l_status: "$.data[0].line_status" } }
            - { call: "GET /farm/batches/${b1}", as: Grower, captures: { res_after: "$.data.reserved_lb", avail_after: "$.data.packed_available_lb" } }
          assert:
            - "before terminate: batch reserved_lb == 25.00 and packed_available_lb == 75.00"
            - "link 1: Shipment.${s1}.shipment_status == CANCELED (caused by terminate)"
            - "link 2: its ShipmentLine line_status == RELEASED (caused by the shipment cancel)"
            - "link 3: batch reserved_lb == 0.00 and packed_available_lb == 100.00 (caused by the line release)"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pack_state_violation_beats_safety_pending
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - endpoints."POST /farm/batches/{id}/pack"
        distinguishing_aspect: |
          Pair state(5) vs business_safety(7): the batch is HARVEST_READY (pack requires
          HARVESTED -> state violation) AND safety_status is PENDING (safety violation);
          the response MUST be ERR_INVALID_STATE_TRANSITION (409), proving state outranks safety.
        test_recipe:
          setup:
            - "Batch GROWING -> marked HARVEST_READY at 2026-08-22T06:00:00Z; never harvested (state violation) and never safety-released (safety violation)"
