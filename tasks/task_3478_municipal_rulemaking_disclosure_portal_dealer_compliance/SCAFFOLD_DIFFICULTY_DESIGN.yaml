scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rule_effectiveness_standard_vs_expedited
        grounds:
          - calculations.rule_effectiveness_delay
          - state_machines.RuleProposal.PENDING_APPROVAL_to_APPROVED
          - state_machines.RuleProposal.APPROVED_to_EFFECTIVE
          - entities.RuleProposal.fields.effective_at
        distinguishing_aspect: |
          Dual variant on the RuleProposal domain: two proposals approved at the
          same logical instant produce effective_at values exactly 20 days apart
          solely because one carries expedited == true (10-day delay) and the
          other expedited == false (30-day delay).
        test_recipe:
          setup:
            - "Two DRAFT proposals G-900 (standard) and G-901 (expedited), both with comment windows opened at the default clock 2026-09-01T00:00:00Z for 21 days, both submitted and approved at 2026-09-22T00:00:00Z."
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-900", title: "Standard rule", body: "body-std", category: "DEALER_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_std: $.data.id }
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-901", title: "Expedited rule", body: "body-exp", category: "DEALER_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_exp: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_std}/open-comment-period"
              payload: { comment_period_days: 21, expedited: false }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_exp}/open-comment-period"
              payload: { comment_period_days: 21, expedited: true }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_std}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_exp}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_std}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
            - call: "POST /msrb/rule-proposals/${p_exp}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "RuleProposal.${p_std}.approval_at == '2026-09-22T00:00:00Z'"
            - "RuleProposal.${p_std}.effective_at == '2026-10-22T00:00:00Z'"
            - "RuleProposal.${p_exp}.effective_at == '2026-10-02T00:00:00Z'"
            - "RuleProposal.${p_exp}.status == EFFECTIVE"
            - "RuleProposal.${p_std}.status == APPROVED"
      - name: trade_publication_actual_vs_capped_size
        grounds:
          - calculations.disseminated_par_publication
          - entities.TradeReport.fields.published_par
          - entities.TradeReport.fields.capped_flag
        distinguishing_aspect: |
          Dual variant on the TradeReport domain (distinct from the RuleProposal
          delay variant): two trades differing only in par_amount publish
          different disseminated sizes — the 3,000,000-par trade publishes its
          actual size, the 8,000,000-par trade publishes exactly the 5,000,000
          cap with capped_flag true.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER organization exists; logical clock at 2026-09-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-100", name: "Dealer One", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 3000000, price: 101.25, executed_at: "2026-09-01T11:50:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t_small_par: $.data.published_par, t_small_cap: $.data.capped_flag }
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 8000000, price: 101.25, executed_at: "2026-09-01T11:50:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t_big_par: $.data.published_par, t_big_cap: $.data.capped_flag }
          assert:
            - "${t_small_par} == 3000000"
            - "${t_small_cap} == false"
            - "${t_big_par} == 5000000"
            - "${t_big_cap} == true"
  # =====================================================================
  # Rule 2 — combinatorial_formula (modes (a) and (b))
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: subscription_fee_multi_input_interaction
        grounds:
          - calculations.subscription_monthly_fee
          - entities.DataSubscription.fields.monthly_fee_cents
        distinguishing_aspect: |
          Mode (a): the monthly fee interacts four inputs non-linearly —
          per-product base and per-seat rates with an included-seat floor
          (max(seats - included, 0)), a scope multiplier, and an org-type
          discount — pinned to 577125 cents for TRADE_REALTIME x
          REDISTRIBUTION x 12 seats on a MUNICIPAL_ADVISOR licensee.
        test_recipe:
          setup:
            - "An ACTIVE MUNICIPAL_ADVISOR organization exists."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "MA-200", name: "Advisor Two", org_type: "MUNICIPAL_ADVISOR" }
              as: PortalOperator
              captures: { org_ma: $.data.id }
          trigger:
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "TRADE_REALTIME", licensee_org_id: "${org_ma}", subscriber_principal: "sub-ma-1", license_scope: "REDISTRIBUTION", seats: 12 }
              as: LicensingOfficer
              captures: { fee_m: $.data.monthly_fee_cents, fee_a: $.data.annual_invoice_cents }
          assert:
            - "${fee_m} == 577125"
            - "${fee_a} == 6925500"
      - name: annual_invoice_round_per_line_then_sum
        grounds:
          - calculations.subscription_annual_invoice
          - entities.DataSubscription.fields.annual_invoice_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order, a different mode than the
          multi-input interaction instance: the monthly line 153748.5 cents is
          rounded half-up per line (153749) and THEN multiplied across the 12
          monthly lines (1844988); the forbidden sum-then-round order would
          yield 1844982.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER organization exists."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-201", name: "Dealer Two", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_bd: $.data.id }
          trigger:
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "TRADE_HISTORICAL", licensee_org_id: "${org_bd}", subscriber_principal: "sub-bd-1", license_scope: "DISPLAY", seats: 11 }
              as: LicensingOfficer
              captures: { fee_m: $.data.monthly_fee_cents, fee_a: $.data.annual_invoice_cents }
          assert:
            - "${fee_m} == 153749"
            - "${fee_a} == 1844988"
  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_disapproval_revision_cycle
        grounds:
          - state_machines.RuleProposal.PENDING_APPROVAL_to_DISAPPROVED
          - state_machines.RuleProposal.DISAPPROVED_to_DRAFT
          - state_machines.RuleProposal.DRAFT_to_OPEN_FOR_COMMENT
          - concurrency_rules[proposal-draft-edit-stale-version]
        distinguishing_aspect: |
          Cycle on RuleProposal: PENDING_APPROVAL -> DISAPPROVED -> DRAFT ->
          OPEN_FOR_COMMENT loops the entity back to an earlier state, and the
          second open increments comment_round to 2 with a fresh window
          anchored at the current logical time.
        test_recipe:
          setup:
            - "Proposal G-910 has been opened (21 days), the window has ended, it was submitted by officer-1 and DISAPPROVED by regulator-1."
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-910", title: "Cycle rule", body: "v1", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21, expedited: false }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_id}/decide"
              payload: { decision: "DISAPPROVE", reason: "needs rework" }
              as: Regulator
              as_user_id: regulator-1
              captures: { decide_v: $.data.version }
          trigger:
            - call: "PATCH /msrb/rule-proposals/${p_id}"
              payload: { title: "Cycle rule revised", expected_rule_proposal_version: "${decide_v}" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { patch_status: $.data.status, patch_v: $.data.version }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 30, expedited: false }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { round2: $.data.comment_round, win_end: $.data.comment_window_end, st2: $.data.status }
          assert:
            - "${patch_status} == DRAFT"
            - "${decide_v} == 4"
            - "${patch_v} == 5"
            - "${st2} == OPEN_FOR_COMMENT"
            - "${round2} == 2"
            - "${win_end} == '2026-10-22T00:00:00Z'"
      - name: professional_parallel_dimension_independence
        grounds:
          - state_machines.MunicipalProfessional.ACTIVE_to_SUSPENDED
          - state_machines.MunicipalProfessional.SUSPENDED_to_ACTIVE
          - state_machines.MunicipalProfessional.UNQUALIFIED_to_QUALIFIED
          - entities.MunicipalProfessional.fields.may_transact
        distinguishing_aspect: |
          Parallel dimensions on MunicipalProfessional (a different entity than
          the RuleProposal cycle): moving the standing axis ACTIVE -> SUSPENDED
          -> ACTIVE leaves the qualification axis QUALIFIED untouched, and
          may_transact recomputes false then true without any qualification
          transition firing.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org; a MUNICIPAL_DEALER_REP professional who has passed MSRB_52 (score 80 >= 72) and is QUALIFIED with standing ACTIVE."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-300", name: "Dealer Three", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pat Parallel", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { prof: $.data.id }
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 80 }
              as: ExamAdmin
          trigger:
            - call: "POST /msrb/professionals/${prof}/standing"
              payload: { standing: "SUSPENDED", reason: "investigation" }
              as: ComplianceOfficer
              as_user_id: co-1
              captures: { s1: $.data.standing, q1: $.data.qualification_status, m1: $.data.may_transact }
            - call: "POST /msrb/professionals/${prof}/standing"
              payload: { standing: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: co-1
              captures: { s2: $.data.standing, q2: $.data.qualification_status, m2: $.data.may_transact }
          assert:
            - "${s1} == SUSPENDED"
            - "${q1} == QUALIFIED"
            - "${m1} == false"
            - "${s2} == ACTIVE"
            - "${q2} == QUALIFIED"
            - "${m2} == true"
  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 3)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rule_effectuation_supersession_referral_cascade
        grounds:
          - state_machines.RuleProposal.APPROVED_to_EFFECTIVE
          - state_machines.RuleProposal.EFFECTIVE_to_SUPERSEDED
          - entities.EnforcementReferral.fields.needs_rule_review
          - calculations.epoch_pass_ordering
        distinguishing_aspect: |
          Depth-3 cascade originating from the clock-set trigger:
          B APPROVED -> EFFECTIVE (link 1) causes A EFFECTIVE -> SUPERSEDED
          (link 2), which itself causes the OPEN referral citing A's rule_code
          to flip needs_rule_review to true (link 3).
        test_recipe:
          setup:
            - "Rule G-100 (proposal A) is EFFECTIVE since 2026-10-22T00:00:00Z; proposal B (G-101) supersedes A and is APPROVED with expedited effective_at 2026-11-22T00:00:00Z; an OPEN referral cites G-100 against a dealer org; clock at 2026-11-12T00:00:00Z."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-400", name: "Dealer Four", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-100", title: "Rule A", body: "a", category: "TRADE_REPORTING" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { pa: $.data.id }
            - call: "POST /msrb/rule-proposals/${pa}/open-comment-period"
              payload: { comment_period_days: 21, expedited: false }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${pa}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${pa}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-101", title: "Rule B", body: "b", category: "TRADE_REPORTING", supersedes_proposal_id: "${pa}" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { pb: $.data.id }
            - call: "POST /msrb/rule-proposals/${pb}/open-comment-period"
              payload: { comment_period_days: 21, expedited: true }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${pb}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${pb}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
            - call: "POST /msrb/enforcement-referrals"
              payload: { rule_code: "G-100", violation_summary: "late reporting pattern", subject_org_id: "${org_d}" }
              as: ComplianceOfficer
              as_user_id: co-1
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-22T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "RuleProposal.${pb}.status == EFFECTIVE"
            - "RuleProposal.${pa}.status == SUPERSEDED"
            - "EnforcementReferral.${ref}.needs_rule_review == true"
      - name: late_trade_watch_posture_subscription_cascade
        grounds:
          - calculations.late_report_tally_and_posture
          - state_machines.Organization.CLEAR_to_WATCH
          - state_machines.DataSubscription.PENDING_to_REJECTED
          - state_machines.TradeReport (creation side effects)
        distinguishing_aspect: |
          Depth-3 cascade originating from a trade-create trigger (distinct
          from the clock-set origin of the supersession cascade): the 5th late
          TradeReport recomputes Organization.late_report_count to 5 (link 1),
          which itself flips compliance_posture CLEAR -> WATCH (link 2), which
          itself rejects the licensee's PENDING DataSubscription (link 3).
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org with a PENDING TRADE_REALTIME subscription; clock at 2026-09-01T09:00:00Z; four late trades (executed 2026-09-01T08:00:00Z, 3600 s) already reported, so late_report_count == 4 and posture is still CLEAR."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-401", name: "Dealer Cascade", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "TRADE_REALTIME", licensee_org_id: "${org_d}", subscriber_principal: "sub-d-1", license_scope: "INTERNAL", seats: 3 }
              as: LicensingOfficer
              captures: { sub: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 1000000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 1000000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 1000000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 1000000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
          trigger:
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "INTER_DEALER", par_amount: 1000000, price: 100.0, executed_at: "2026-09-01T08:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t5_late: $.data.late_flag }
          assert:
            - "${t5_late} == true"
            - "Organization.${org_d}.late_report_count == 5"
            - "Organization.${org_d}.compliance_posture == WATCH"
            - "DataSubscription.${sub}.status == REJECTED"
  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: comment_state_gate_beats_window_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_PROPOSAL_NOT_OPEN_FOR_COMMENT]
          - errors[ERR_COMMENT_WINDOW_CLOSED]
        distinguishing_aspect: |
          Pair (state, business_temporal): the proposal is PENDING_APPROVAL
          (state gate fails) AND the comment window has already ended
          (temporal check would also fail); the state-category error
          ERR_PROPOSAL_NOT_OPEN_FOR_COMMENT (priority 8) must win over
          ERR_COMMENT_WINDOW_CLOSED (priority 13).
        test_recipe:
          setup:
            - "Proposal G-920 opened for 21 days at the default clock, submitted (zero letters) after the window ended; now PENDING_APPROVAL with the window in the past."
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-920", title: "Priority rule", body: "p", category: "MARKET_DATA" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21, expedited: false }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/comment-letters"
              payload: { author_name: "Ann", body: "too late", sentiment: "SUPPORT" }
              as: PublicReader
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROPOSAL_NOT_OPEN_FOR_COMMENT"
      - name: solicitation_type_gate_beats_fee_cap
        grounds:
          - validations[priority=19]
          - validations[priority=23]
          - errors[ERR_ORG_TYPE_NOT_PERMITTED]
          - errors[ERR_FEE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal) — a different category
          pair than (state, business_temporal): the solicitation targets an
          org of type BROKER_DEALER (referential type-gate fails) AND its
          CONTINGENT compensation exceeds the cap (fiscal check would also
          fail); ERR_ORG_TYPE_NOT_PERMITTED (priority 19) must win over
          ERR_FEE_CAP_EXCEEDED (priority 23).
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER organization exists (no MUNICIPAL_ADVISOR registration)."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-500", name: "Dealer Five", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_bd: $.data.id }
          trigger:
            - call: "POST /msrb/solicitation-records"
              payload: { advisor_org_id: "${org_bd}", municipal_entity_name: "City of Example", compensation_type: "CONTINGENT", compensation_cents: 99999999, disclosure_provided: true }
              as: DealerRep
              as_user_id: "${org_bd}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORG_TYPE_NOT_PERMITTED"
  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: exam_pass_score_exact_boundary
        grounds:
          - calculations.exam_pass_result
          - entities.ExamAttempt.fields.result
        distinguishing_aspect: |
          Metric = integer exam score on POST /msrb/exam-attempts: the
          PASS_SCORES[MSRB_53] == 75 boundary is inclusive, so 75 is PASS and
          74 is FAIL.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org with two registered professionals."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-600", name: "Dealer Six", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro SeventyFour", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_PRINCIPAL" }
              as: ExamAdmin
              captures: { p1: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro SeventyFive", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_PRINCIPAL" }
              as: ExamAdmin
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${p1}", series_code: "MSRB_53", score: 74 }
              as: ExamAdmin
              captures: { r1: $.data.result }
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${p2}", series_code: "MSRB_53", score: 75 }
              as: ExamAdmin
              captures: { r2: $.data.result }
          assert:
            - "${r1} == FAIL"
            - "${r2} == PASS"
      - name: trade_report_nine_hundred_second_boundary
        grounds:
          - calculations.trade_timeliness
          - entities.TradeReport.fields.late_flag
          - entities.TradeReport.fields.seconds_late
        distinguishing_aspect: |
          Metric = elapsed whole seconds on POST /msrb/trade-reports (a
          different metric and endpoint than the exam score boundary): the
          900-second limit is strict-greater, so exactly 900 s is timely and
          901 s is late with seconds_late == 1.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org; clock at 2026-09-01T10:15:00Z."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-601", name: "Dealer Boundary", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:15:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_SELL", par_amount: 100000, price: 99.5, executed_at: "2026-09-01T10:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { f1: $.data.late_flag, s1: $.data.seconds_late }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:15:01Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_SELL", par_amount: 100000, price: 99.5, executed_at: "2026-09-01T10:00:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { f2: $.data.late_flag, s2: $.data.seconds_late }
          assert:
            - "${f1} == false"
            - "${s1} == 0"
            - "${f2} == true"
            - "${s2} == 1"
  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_blocked_by_unmoderated_comment_letters
        grounds:
          - validations[priority=9]
          - state_machines.RuleProposal.OPEN_FOR_COMMENT_to_PENDING_APPROVAL
          - state_machines.CommentLetter.RECEIVED_to_PUBLISHED
        distinguishing_aspect: |
          Pair RuleProposal <- CommentLetter: the proposal's
          OPEN_FOR_COMMENT -> PENDING_APPROVAL transition is gated by the
          moderation state of a DIFFERENT entity — one letter still RECEIVED
          blocks with ERR_UNRESOLVED_COMMENTS; publishing that letter unblocks
          the identical retry.
        test_recipe:
          setup:
            - "Proposal G-930 opened for 21 days at the default clock with one RECEIVED comment letter; clock advanced past the window end."
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-930", title: "Gate rule", body: "g", category: "ADVISOR_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21, expedited: false }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_id}/comment-letters"
              payload: { author_name: "Citizen", body: "concerns", sentiment: "OPPOSE" }
              as: PublicReader
              captures: { letter: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err: $.data.error_id }
            - call: "POST /msrb/comment-letters/${letter}/moderate"
              payload: { action: "PUBLISH" }
              as: PortalOperator
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_UNRESOLVED_COMMENTS"
            - "${st} == PENDING_APPROVAL"
      - name: exam_attempt_blocked_by_suspended_employer_org
        grounds:
          - validations[priority=10]
          - state_machines.Organization.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair ExamAttempt <- Organization (a different pair than RuleProposal
          <- CommentLetter): creating an exam attempt is gated by the
          professional's EMPLOYER organization's status; once the org is
          SUSPENDED the attempt fails with ERR_ORG_SUSPENDED even though the
          professional's own standing is ACTIVE.
        test_recipe:
          setup:
            - "An org (BROKER_DEALER) with one registered professional; the org has been suspended."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-700", name: "Dealer Seven", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro Blocked", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { prof: $.data.id }
            - call: "POST /msrb/organizations/${org_d}/suspend"
              payload: { reason: "regulatory action" }
              as: ComplianceOfficer
              as_user_id: co-1
          trigger:
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 80 }
              as: ExamAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORG_SUSPENDED"
  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_retake_half_open_thirty_day_window
        grounds:
          - calculations.exam_pass_result
          - validations[priority=16]
          - errors[ERR_RETAKE_WINDOW_ACTIVE]
        distinguishing_aspect: |
          Half-open exclusion window on the (professional, series) resource: a
          prior attempt blocks retakes only while strictly younger than 30
          days — at 29 days the retake is rejected, at exactly 30 days it is
          allowed (the boundary instant is OUTSIDE the exclusion window).
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org with one professional; a FAILING MSRB_52 attempt (score 60 < 72) recorded at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-800", name: "Dealer Eight", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro Retake", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { prof: $.data.id }
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 60 }
              as: ExamAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 80 }
              as: ExamAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 80 }
              as: ExamAdmin
              captures: { res: $.data.result }
          assert:
            - "${err} == ERR_RETAKE_WINDOW_ACTIVE"
            - "${res} == PASS"
            - "MunicipalProfessional.${prof}.qualification_status == QUALIFIED"
      - name: annual_coverage_closed_interval_overlap
        grounds:
          - validations[priority=22]
          - errors[ERR_COVERAGE_PERIOD_OVERLAP]
          - entities.DisclosureSubmission.fields.period_start
        distinguishing_aspect: |
          Closed-interval semantics on the issuer-organization resource (a
          different geometry than the half-open retake window): two
          ANNUAL_FINANCIAL filings sharing even a single day
          (2025-12-31) overlap and are rejected, while perfect adjacency
          (2026-01-01 following 2025-12-31) is accepted.
        test_recipe:
          setup:
            - "An ACTIVE ISSUER org with one ANNUAL_FINANCIAL submission covering the closed interval [2025-01-01, 2025-12-31]."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "IS-900", name: "Issuer Nine", org_type: "ISSUER" }
              as: PortalOperator
              captures: { org_i: $.data.id }
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "ANNUAL_FINANCIAL", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", document_uri: "doc://fy2025", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
          trigger:
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "ANNUAL_FINANCIAL", period_start: "2025-12-31T00:00:00Z", period_end: "2026-12-30T00:00:00Z", document_uri: "doc://fy2025b", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { err: $.data.error_id }
            - call: "POST /msrb/disclosure-submissions"
              payload: { issuer_org_id: "${org_i}", submission_type: "ANNUAL_FINANCIAL", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", document_uri: "doc://fy2026", cusip: "123456789" }
              as: IssuerRep
              as_user_id: "${org_i}"
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_COVERAGE_PERIOD_OVERLAP"
            - "${st} == RECEIVED"
  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: standing_cycle_conserves_active_professional_count
        grounds:
          - state_machines.MunicipalProfessional.ACTIVE_to_SUSPENDED
          - state_machines.MunicipalProfessional.SUSPENDED_to_ACTIVE
          - entities.Organization.fields.active_professional_count
        distinguishing_aspect: |
          Conserved quantity = headcount: Organization.active_professional_count
          == |{ professionals with employer_org_id == org AND standing ==
          ACTIVE }|. The forward action (suspend) paired with its compensating
          action (reinstate) must return the count to exactly its prior value
          — 2 -> 1 -> 2 with no drift.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org with exactly two registered professionals, both standing ACTIVE."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-1000", name: "Dealer Ten", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro One", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { p1: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro Two", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_ADVISOR_REP" }
              as: ExamAdmin
          trigger:
            - call: "POST /msrb/professionals/${p1}/standing"
              payload: { standing: "SUSPENDED", reason: "audit hold" }
              as: ComplianceOfficer
              as_user_id: co-1
            - call: "POST /msrb/professionals/${p1}/standing"
              payload: { standing: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: co-1
          assert:
            - "Organization.${org_d}.active_professional_count == 2"
        note_assertion_detail: "Intermediate read after the suspend shows 1; the invariant is that after the suspend+reinstate pair the count equals the pre-suspend value 2."
      - name: trade_cancel_conserves_published_par_total
        grounds:
          - state_machines.TradeReport.DISSEMINATED_to_CANCELLED
          - entities.Organization.fields.published_par_total
          - calculations.disseminated_par_publication
        distinguishing_aspect: |
          Conserved quantity = published par volume (a different quantity type
          than headcount): Organization.published_par_total == sum of
          published_par over its DISSEMINATED TradeReports. Publishing trade T
          (+5,000,000 capped) paired with its compensating cancel must return
          the total to exactly its pre-publish value 2,000,000 — the capped
          publication leaves no residue after compensation.
        test_recipe:
          setup:
            - "An ACTIVE BROKER_DEALER org; clock 2026-09-01T12:00:00Z; two timely trades reported: T1 par 2,000,000 (published 2,000,000) and T2 par 6,000,000 (published 5,000,000, capped). published_par_total == 7,000,000."
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-1001", name: "Dealer Eleven", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 2000000, price: 100.0, executed_at: "2026-09-01T11:50:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t1: $.data.id }
            - call: "POST /msrb/trade-reports"
              payload: { dealer_org_id: "${org_d}", cusip: "123456789", trade_type: "CUSTOMER_BUY", par_amount: 6000000, price: 100.0, executed_at: "2026-09-01T11:50:00Z" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /msrb/trade-reports/${t2}/cancel"
              payload: {}
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { st: $.data.status }
          assert:
            - "${st} == CANCELLED"
            - "Organization.${org_d}.published_par_total == 2000000"
