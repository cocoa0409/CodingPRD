            - "Site.${site_id}.slots_requested_total == 3"
            - "Site.${site_id}.slots_held_count == 0"
            - "Site.${site_id}.slots_released_count == 1"
            - "Site.${site_id}.slots_no_show_count == 1"
            - "Site.${site_id}.slots_consumed_count == 1"
