              as: IpaAdmin
              captures: { agr_c1: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c1}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_c1}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_c1: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_c1}/physicians"
              payload: { npi: "4100000001", full_name: "Alma Cheng", specialty: "PRIMARY_CARE" }
              as: NetworkManager
              captures: { p_c1: "$.data.id" }
            - call: "POST /ipa/physicians/${p_c1}/state"
