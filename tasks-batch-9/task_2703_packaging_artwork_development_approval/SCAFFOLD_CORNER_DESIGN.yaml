      - name: a_reviewer_cannot_decide_a_task_of_another_discipline_and_discipline_outranks_stage
        claim_type: role_deny
        grounds:
          - roles[BrandReviewer]
          - roles[LegalReviewer]
          - roles[QualityReviewer]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_ROUTE_STAGE_NOT_ACTIVE]
          - validations[priority=2]
          - validations[priority=27]
          - endpoints[POST /review-tasks/{id}/decision]
          - entities.ReviewTask.fields.discipline
          - entities.ReviewTask.fields.is_active
        distinguishing_aspect: |
          The decision endpoint admits all four reviewer roles, so role-list checking
          alone passes every one of these calls; the refusal has to come from the
          discipline binding named in §1.6's ERR_UNAUTHORIZED condition
          (BRAND->BrandReviewer, REGULATORY->RegulatoryReviewer, LEGAL->LegalReviewer,
          QUALITY->QualityReviewer). The third call pins the ladder: the QUALITY task
          is the reviewer's OWN discipline but sits in stage 3 while stage 1 is open,
          so it must be 409 ERR_ROUTE_STAGE_NOT_ACTIVE (priority 27) - whereas the
          second call, a QualityReviewer on the stage-1 REGULATORY task, must be 403
          (priority 2) even though that task IS active. Same reviewer, two different
          answers, decided purely by which check outranks which.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; brief SKU-1001 APPROVED."
            - "One US CARTON asset whose version v1 verified at compliance_score 100.0 and was submitted, so the frozen stage_plan is stage 1 PARALLEL [BRAND, REGULATORY], stage 2 SEQUENTIAL [LEGAL], stage 3 SEQUENTIAL [QUALITY]."
            - "Only the two stage-1 tasks are is_active; the LEGAL and QUALITY tasks are PENDING and inactive."
            - "The task ids of all four disciplines were read from GET /review-tasks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork for the US carton."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Mandatory element verification run."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
              payload: {submit_note: "Route through brand, regulatory, legal and quality."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes"
              payload: {artwork_version_id: "${v1_id}", status: "IN_PROGRESS"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { r_1: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "BRAND"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_brand: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "REGULATORY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_reg: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "LEGAL"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_legal: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "QUALITY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_qa: "$.data[0].id" }
          trigger:
            - call: "POST /review-tasks/${t_1_brand}/decision"
              payload: {decision: "APPROVED", comment: "Looks on-brand to me."}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /review-tasks/${t_1_reg}/decision"
              payload: {decision: "APPROVED", comment: "Regulatory copy approved."}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /review-tasks/${t_1_qa}/decision"
              payload: {decision: "APPROVED", comment: "Quality sign-off."}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /review-tasks/${t_1_brand}/decision"
              payload: {decision: "APPROVED", comment: "Brand identity approved."}
              as: BrandReviewer
              as_user_id: "u_brand"
          assert:
            - "the LegalReviewer decision on the BRAND task returns 403 ERR_UNAUTHORIZED per validations[priority=2] - the endpoint admits LegalReviewer, the discipline binding does not"
            - "the QualityReviewer decision on the active stage-1 REGULATORY task returns 403 ERR_UNAUTHORIZED per validations[priority=2]"
            - "the QualityReviewer decision on its own QUALITY task returns 409 ERR_ROUTE_STAGE_NOT_ACTIVE per validations[priority=27] - a different error class, because the role/discipline pair is correct and only the stage is wrong"
            - "the BrandReviewer decision on the BRAND task returns 200 with decision == APPROVED and decided_by_user_id == u_brand"
            - "after the three refusals the REGULATORY and QUALITY tasks still report decision == null and decided_at == null"

      - name: a_printer_rep_cannot_act_for_a_printer_that_is_not_its_own_row
        claim_type: role_deny
        grounds:
          - roles[PrinterRep]
          - errors[ERR_PRINTER_IDENTITY_MISMATCH]
          - validations[priority=15]
          - endpoints[POST /printer-proofs]
          - endpoints[POST /error-escapes/{id}/dispute]
          - entities.PrinterProof.fields.printer_id
          - entities.ErrorEscape.fields.printer_id
          - entities.ErrorEscape.fields.dispute_count
        distinguishing_aspect: |
          PrinterRep is the one entity_backed identity in §1.7, so the role check is
          not enough: X-User-ID must equal the printer row the request touches. Both
          directions of the mismatch are probed on the proof endpoint - vendor B
          submitting for printer_id A, and vendor A submitting for printer_id B - so
          an implementation that compares the id against the wrong side still fails
          one of them, and both must be 403 ERR_PRINTER_IDENTITY_MISMATCH (priority
          15) rather than the priority-2 ERR_UNAUTHORIZED, because PrinterRep IS an
