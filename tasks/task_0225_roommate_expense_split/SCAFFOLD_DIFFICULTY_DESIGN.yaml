scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_estimate_vs_final_diverge
        grounds:
          - calculations.move_proration
          - state_machines.Membership.ACTIVE_to_MOVED_OUT
          - entities.Membership.fields.occupied_days_estimate
          - entities.Membership.fields.occupied_days_actual
        distinguishing_aspect: >-
          On the Membership/Bill cost domain: the forward-looking estimate uses planned_move_out_date
          (2026-06-30 -> 30 inclusive occupied days) while the chronological final uses
          actual_move_out_date (2026-06-15 -> 15 days), so occupied_days_estimate=30 but
          occupied_days_actual=15 on the same Membership row.
        test_recipe:
          setup:
            - "Lister L manages a household; M1 is the sole ACTIVE member; clock 2026-06-01."
            - "M1 membership: move_in 2026-06-01, planned_move_out 2026-06-30."
            - "A RENT Bill for June (2026-06-01..2026-06-30) issued (M1's only share = full 200000)."
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "l1@x.com", full_name: "L1", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "m1@x.com", full_name: "M1", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "Flat", monthly_rent_cents: 200000, capacity: 4, room_size_sqft: 200, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: $.data.id }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /bills"
              payload: { household_id: "${hid}", bill_type: "RENT", total_amount_cents: 200000, period_start: "2026-06-01T00:00:00.000Z", period_end: "2026-06-30T00:00:00.000Z" }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { bill_id: $.data.id }
          trigger:
            - call: "GET /memberships/${mem1}"
              payload: {}
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { est_days: $.data.occupied_days_estimate }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-15T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /memberships/${mem1}/move-out"
              payload: {}
              as: Roommate
              as_user_id: "${m1_id}"
          assert:
            - "Membership.${mem1}.occupied_days_estimate == 30"
            - "Membership.${mem1}.occupied_days_actual == 15"
            - "Membership.${mem1}.status == MOVED_OUT"

      - name: compatibility_strict_vs_lenient_diverge
        grounds:
          - calculations.compatibility_score
          - entities.MatchRequest.fields.scoring_mode
          - entities.MatchRequest.fields.compatibility_score
        distinguishing_aspect: >-
          On the MatchRequest/RoommateProfile fit-scoring domain (not a cost domain): for a smoker
          applicant against a no_smokers listing, STRICT hard-zeroes the score to 0 while LENIENT only
          subtracts 0.5*W_LIFESTYLE (15), yielding 85 (40 clean + 30 sleep + 15 lifestyle) — same
          inputs, different results.
        test_recipe:
          setup:
            - "A no_smokers listing by lister L; applicant S is a smoker, otherwise a perfect fit."
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "l2@x.com", full_name: "L2", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "EARLY_BIRD", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "s2@x.com", full_name: "S2", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "EARLY_BIRD", smoker: true, pets: false }
              as: Roommate
              captures: { s_id: $.data.id }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "NoSmoke", monthly_rent_cents: 150000, capacity: 2, room_size_sqft: 180, wants_cleanliness: 5, wants_sleep_schedule: "EARLY_BIRD", no_smokers: true, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${s_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${s_id}"
              captures: { mr_strict: $.data.id }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${s_id}", scoring_mode: "LENIENT" }
              as: Roommate
              as_user_id: "${s_id}"
              captures: { mr_lenient: $.data.id }
          assert:
            - "MatchRequest.${mr_strict}.compatibility_score == 0"
            - "MatchRequest.${mr_lenient}.compatibility_score == 85"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: compatibility_nonlinear_three_factor
        grounds:
          - calculations.compatibility_score
          - entities.RoommateProfile.fields.cleanliness
          - entities.RoomListing.fields.wants_sleep_schedule
        distinguishing_aspect: >-
          Mode (a): compatibility_score combines >=3 inputs (cleanliness diff, sleep-match branch, two
          dealbreaker conditionals) with a nested max() floor on lifestyle_fit and conditional sleep
          branching; applicant cleanliness 3 vs wants 5 (clean_fit 0.6 -> 24) + sleep match (30) +
          lifestyle full (30) yields 84, not a plain linear sum.
        test_recipe:
          setup:
            - "Listing wants_cleanliness 5, wants_sleep EARLY_BIRD, no flags; applicant cleanliness 3, EARLY_BIRD."
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "l3@x.com", full_name: "L3", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "EARLY_BIRD", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "c3@x.com", full_name: "C3", monthly_income_cents: 500000, cleanliness: 3, sleep_schedule: "EARLY_BIRD", smoker: false, pets: false }
              as: Roommate
              captures: { c_id: $.data.id }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "Mid", monthly_rent_cents: 150000, capacity: 2, room_size_sqft: 180, wants_cleanliness: 5, wants_sleep_schedule: "EARLY_BIRD", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${c_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${c_id}"
              captures: { mr: $.data.id }
          assert:
            - "MatchRequest.${mr}.compatibility_score == 84"

      - name: bill_split_rounding_remainder_order
        grounds:
          - calculations.bill_split
          - state_machines.Bill.UNPAID_to_PARTIALLY_PAID
          - entities.BillSplit.fields.share_cents
        distinguishing_aspect: >-
          Mode (b): rounding order is pinned — floor each exact share to whole cents then assign the
          1-cent remainder to members ordered by Membership.created_at ASC. For 10001 cents EQUAL across
          3 members the two earliest-created (M1, M2) get 3334 and the last-created (M3) gets 3333.
        test_recipe:
          setup:
            - "Household managed by lister L with 3 ACTIVE members created in order M1, M2, M3; split_policy EQUAL."
            - "A UTILITIES Bill of 10001 cents issued."
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "l4@x.com", full_name: "L4", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "m1.4@x.com", full_name: "M1.4", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "m2.4@x.com", full_name: "M2.4", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m2_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "m3.4@x.com", full_name: "M3.4", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m3_id: $.data.id }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "Triple", monthly_rent_cents: 300000, capacity: 4, room_size_sqft: 240, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: $.data.id }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m2_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m2_id}"
              captures: { mr2: $.data.id }
            - call: "POST /match-requests/${mr2}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /memberships?profile_id=${m2_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem2: "$.data[0].id" }
            - call: "POST /memberships/${mem2}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m3_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m3_id}"
              captures: { mr3: $.data.id }
            - call: "POST /match-requests/${mr3}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /memberships?profile_id=${m3_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem3: "$.data[0].id" }
            - call: "POST /memberships/${mem3}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /bills"
              payload: { household_id: "${hid}", bill_type: "UTILITIES", total_amount_cents: 10001, period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-07-31T00:00:00.000Z" }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { bill_id: $.data.id }
            - call: "GET /bills/${bill_id}/splits"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
          assert:
            - "BillSplit for M1 (profile_id == ${m1_id}).share_cents == 3334"
            - "BillSplit for M2 (profile_id == ${m2_id}).share_cents == 3334"
            - "BillSplit for M3 (profile_id == ${m3_id}).share_cents == 3333"
            - "sum of all BillSplit.share_cents for bill ${bill_id} == 10001"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: match_request_withdraw_reapply_cycle
        grounds:
          - state_machines.MatchRequest.PENDING_to_WITHDRAWN
          - state_machines.MatchRequest.WITHDRAWN_to_PENDING
        distinguishing_aspect: >-
          Cyclic shape on MatchRequest: PENDING -> WITHDRAWN -> PENDING (reapply) re-enters a
          non-terminal state already visited; reapply recomputes compatibility_score (perfect fit -> 100).
        test_recipe:
          setup:
            - "A PENDING match request by applicant M on lister L's listing, then withdrawn."
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "l5@x.com", full_name: "L5", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "m5@x.com", full_name: "M5", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m_id: $.data.id }
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "Cycle", monthly_rent_cents: 150000, capacity: 2, room_size_sqft: 180, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m_id}"
              captures: { mr: $.data.id }
            - call: "POST /match-requests/${mr}/withdraw"
              payload: {}
              as: Roommate
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /match-requests/${mr}/reapply"
              payload: {}
              as: Roommate
              as_user_id: "${m_id}"
          assert:
            - "MatchRequest.${mr}.status == PENDING"
            - "MatchRequest.${mr}.compatibility_score == 100"

      - name: bill_parallel_payment_and_reminder_dimensions
        grounds:
          - state_machines.Bill.NONE_to_SCHEDULED
          - state_machines.Bill.SCHEDULED_to_SENT
          - state_machines.Bill.UNPAID_to_PARTIALLY_PAID
          - entities.Bill.fields.payment_status
          - entities.Bill.fields.reminder_status
        distinguishing_aspect: >-
          Parallel dimensions on Bill (a different entity from MatchRequest): reminder_status advances
          NONE->SCHEDULED->SENT independently of payment_status, which stays UNPAID throughout; the two
          axes evolve on the same row without coupling.
        test_recipe:
          setup:
            - "Household managed by L with 1 ACTIVE member M1; clock 2026-06-01."
            - "A RENT Bill issued (UNPAID, reminder NONE); a reminder scheduled for 2026-06-10."
          setup_api_calls:
            - call: "POST /roommate-profiles"
              payload: { email: "l6@x.com", full_name: "L6", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { l_id: $.data.id }
            - call: "POST /roommate-profiles"
              payload: { email: "m6@x.com", full_name: "M6", monthly_income_cents: 500000, cleanliness: 5, sleep_schedule: "FLEXIBLE", smoker: false, pets: false }
              as: Roommate
              captures: { m1_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /room-listings"
              payload: { lister_id: "${l_id}", title: "Par", monthly_rent_cents: 200000, capacity: 3, room_size_sqft: 200, wants_cleanliness: 1, wants_sleep_schedule: "FLEXIBLE", no_smokers: false, no_pets: false }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /match-requests"
              payload: { listing_id: "${listing_id}", applicant_id: "${m1_id}", scoring_mode: "STRICT" }
              as: Roommate
              as_user_id: "${m1_id}"
              captures: { mr1: $.data.id }
            - call: "POST /match-requests/${mr1}/accept"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "GET /households?manager_id=${l_id}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { hid: "$.data[0].id" }
            - call: "GET /memberships?profile_id=${m1_id}&household_id=${hid}"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
              captures: { mem1: "$.data[0].id" }
            - call: "POST /memberships/${mem1}/activate"
              payload: {}
              as: Roommate
              as_user_id: "${l_id}"
            - call: "POST /bills"
              payload: { household_id: "${hid}", bill_type: "RENT", total_amount_cents: 200000, period_start: "2026-06-01T00:00:00.000Z", period_end: "2026-06-30T00:00:00.000Z" }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { bill_id: $.data.id }
            - call: "POST /payment-reminders"
              payload: { household_id: "${hid}", bill_id: "${bill_id}", due_date: "2026-06-10T00:00:00.000Z" }
              as: Roommate
              as_user_id: "${l_id}"
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-10T00:00:00.000Z" }
              as: PlatformOperator
            - call: "POST /_reminders/dispatch"
              payload: {}
              as: PlatformOperator
          assert:
            - "Bill.${bill_id}.reminder_status == SENT"
            - "Bill.${bill_id}.payment_status == UNPAID"
            - "PaymentReminder.${rem_id}.status == SENT"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: moveout_cascade_proration_splits_balances
        grounds:
          - state_machines.Membership.ACTIVE_to_MOVED_OUT
          - calculations.move_proration
          - calculations.bill_split
          - calculations.household_net_balance
          - entities.Household.fields.ledger_sum_cents
        distinguishing_aspect: >-
          Depth-4 chain from ONE trigger (move-out): move-out -> final proration on the current RENT
          Bill -> BillSplit rows recomputed across remaining ACTIVE members -> household_net_balance
          recomputed -> Household.ledger_sum_cents stays 0; each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Household managed by L with ACTIVE members M1 and M2; clock 2026-06-01."
            - "A RENT Bill for June 200000 cents split EQUAL (M1=100000, M2=100000)."
