  - rule_id: boundary_precision_check
    instances:
      - name: revenue_margin_sustainable_at_exact_fifteen_percent_boundary
        grounds:
          - calculations.provider_revenue_projection
          - endpoints[GET /fccn/providers/{id}/revenue-model]
          - entities.Provider.fields.projected_monthly_revenue_cents
        distinguishing_aspect: |
          Probes the margin_pct metric at the exact SUSTAINABLE threshold on
          GET /fccn/providers/{id}/revenue-model: revenue 300000 against cost 255000 gives
          margin_pct exactly 0.1500 and must classify SUSTAINABLE (the comparison is >=, not >),
          and dropping revenue by 1000 cents lands on 0.1474 / THIN. Rounding to 4 decimals with
          ROUND_HALF_UP is load-bearing: truncation would yield 0.1473.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE, fixed_monthly_cost_cents 237000, network_fee_pct 6.0."
            - "Two subsidy enrollments (99000 each at daily_rate_cents 4500) plus one private enrollment at 102000, so monthly_revenue_cents is 300000, network_fee_cents 18000, monthly_cost_cents 255000."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-08-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-3", family_name: "Cortez", days_per_week: 5, private_monthly_tuition_cents: 102000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /fccn/providers/${p1}/revenue-model"
              as: NetworkAdmin
              captures: { rev_at: $.data.monthly_revenue_cents, fee_at: $.data.network_fee_cents, cost_at: $.data.monthly_cost_cents, margin_at: $.data.margin_pct, sust_at: $.data.sustainability, rec_at: $.data.recommended_private_tuition_cents }
            - call: "POST /fccn/enrollments/${e3}/withdraw"
              payload: { exit_on: "2026-08-31T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-4", family_name: "Dolan", days_per_week: 5, private_monthly_tuition_cents: 101000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e4: $.data.id }
            - call: "GET /fccn/providers/${p1}/revenue-model"
              as: NetworkAdmin
              captures: { rev_below: $.data.monthly_revenue_cents, fee_below: $.data.network_fee_cents, cost_below: $.data.monthly_cost_cents, margin_below: $.data.margin_pct, sust_below: $.data.sustainability, rec_below: $.data.recommended_private_tuition_cents }
          assert:
            - "${rev_at} == 300000 and ${fee_at} == 18000 and ${cost_at} == 255000"
            - "${margin_at} == 0.1500 exactly (4 decimal places, not 0.15 as a 2-place value)"
            - "${sust_at} == SUSTAINABLE (the boundary value is inclusive)"
            - "${rec_at} == 102000"
            - "${rev_below} == 299000 and ${fee_below} == 17940 and ${cost_below} == 254940"
            - "${margin_below} == 0.1474 (ROUND_HALF_UP of 0.14735...; truncation would give 0.1473)"
            - "${sust_below} == THIN"
            - "${rec_below} == 102000"

