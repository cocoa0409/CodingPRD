              captures: { final_status: $.data.status }
          assert:
            - "CouncilResolution.eligible_voter_count == 4"
            - "CouncilResolution.status == PASSED (2 votes met the 50% quorum exactly; yes 2 > no 0)"

      - name: bed_occupy_at_exact_expiry_period_succeeds
        grounds:
          - state_machines.BedReservation.HELD_to_OCCUPIED
          - entities.BedReservation.fields.hold_expiry_period
          - errors[ERR_BED_RESERVATION_EXPIRED]
        distinguishing_aspect: |
          `<=` boundary on the hold-window metric, a different metric reached through a different
          endpoint (bed occupy): with hold_expiry_period=3, occupying when current_period_index==3
          succeeds (3 <= 3); advancing to 4 would expire it. This is an empty-vs-nonempty-time-window
          edge distinct from the quorum count edge above.
        test_recipe:
          setup:
