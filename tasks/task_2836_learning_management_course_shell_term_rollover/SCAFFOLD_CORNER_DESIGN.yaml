              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${t_hold}", owner_person_id: "${prof_id}", sis_section_code: "HI110-01", shell_type: "OFFICIAL", base_seat_cap: 15 }
              as: LmsAdmin
              captures: { sh_hold: $.data.id }
            - call: "POST /course-shells/${sh_hold}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /academic-terms/${t_std}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /academic-terms/${t_std}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /academic-terms/${t_std}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
            - call: "POST /academic-terms/${t_std}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
            - call: "POST /academic-terms/${t_hold}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /academic-terms/${t_hold}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /academic-terms/${t_hold}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
            - call: "POST /academic-terms/${t_hold}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
            - call: "POST /course-shells/${sh_std}/lifecycle-transitions"
              payload: { target_state: "ARCHIVED" }
              as: Registrar
              captures: { std_archived: $.data.provisioning_state }
            - call: "POST /course-shells/${sh_hold}/lifecycle-transitions"
              payload: { target_state: "ARCHIVED" }
              as: Registrar
              captures: { hold_archived: $.data.provisioning_state }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-11T23:59:59Z" }
              as: LmsAdmin
            - call: "POST /course-shells/${sh_std}/lifecycle-transitions"
              payload: { target_state: "PURGED", reason: "retention horizon reached" }
              as: Registrar
              captures: { std_state: $.data.provisioning_state, std_storage: $.data.storage_mb, std_items: $.data.content_item_count }
            - call: "POST /course-shells/${sh_hold}/lifecycle-transitions"
              payload: { target_state: "PURGED", reason: "retention horizon reached" }
              as: Registrar
              captures: { err_hold: $.data.error_id }
            - call: "GET /course-shells/${sh_hold}"
              payload: {}
              as: Registrar
              captures: { hold_state_after: $.data.provisioning_state }
          assert:
            - "${purge_at_std} == \"2027-12-11T23:59:59Z\" and ${purge_at_hold} == null — LEGAL_HOLD produces no horizon at all"
            - "${std_archived} == ARCHIVED and ${hold_archived} == ARCHIVED — both shells reach the same state through the same path"
            - "${std_state} == PURGED with ${std_storage} == 0.00 and ${std_items} == 0"
            - "${err_hold} == ERR_RETENTION_HOLD_ACTIVE at HTTP 403 — NOT ERR_PURGE_NOT_DUE (409), even though ${purge_at_hold} is null: priority 27 outranks priority 28"
            - "${hold_state_after} == ARCHIVED — the refused purge left the shell and its content untouched"

  # ===========================================================================
  # 6. Errors  (§1.6 catalog sweep: every one of the 55 codes must be triggerable)
  # ===========================================================================
  - section: errors
    instances:

      - name: authentication_and_ownership_gates_fire_before_any_business_rule
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[1]
          - validations[2]
          - validations[3]
        distinguishing_aspect: "The top three priority bands are three DIFFERENT refusals with three different causes: a missing X-User-ID header is 401, a present-but-wrong role is 403 ERR_ROLE_NOT_PERMITTED, and a right role acting on someone else's shell is 403 ERR_NOT_RESOURCE_OWNER. Collapsing any pair into one code (a common shortcut) fails this instance."
        test_recipe:
          setup:
            - "Term 2026FA plus two FACULTY people; the OFFICIAL shell PH101-01 is owned by the first of them."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6180", full_name: "Emmy Noether", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_a: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6181", full_name: "Sofya Kovalevskaya", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_b: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_a}", sis_section_code: "PH101-01", shell_type: "OFFICIAL", base_seat_cap: 25 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
          trigger:
            - call: "GET /academic-terms"
              payload: {}
              as: "unauthenticated"
              captures: { err_unauth: $.data.error_id }
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Student
              as_user_id: "${prof_b}"
              captures: { err_role: $.data.error_id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "PAGE", title: "not my shell", storage_mb: 1.00 }
              as: Instructor
              as_user_id: "${prof_b}"
              captures: { err_owner: $.data.error_id }
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "PAGE", title: "my shell", storage_mb: 1.00 }
              as: Instructor
              as_user_id: "${prof_a}"
              captures: { ok_item: $.data.id }
          assert:
            - "${err_unauth} == ERR_UNAUTHENTICATED at HTTP 401 — the request carries no X-User-ID header at all, and the role that WOULD have been permitted is irrelevant"
            - "${err_role} == ERR_ROLE_NOT_PERMITTED at HTTP 403 — Student is not among POST /academic-terms' roles, and no term is created"
            - "${err_owner} == ERR_NOT_RESOURCE_OWNER at HTTP 403 — the acting user holds a permitted role but does not own shell ${shell_id}"
            - "${ok_item} is created at HTTP 201 for the byte-identical call made by the owner ${prof_a}"
            - "GET /academic-terms as LmsAdmin returns total_count 1 — none of the three refusals wrote anything"

      - name: merge_requests_refuse_cross_term_absorbed_and_chained_shell_pairs
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CROSS_TERM_MERGE]
          - errors[ERR_SHELL_ALREADY_MERGED]
          - errors[ERR_MERGE_CHAIN_FORBIDDEN]
          - validations[20]
          - validations[21]
          - validations[22]
        distinguishing_aspect: "Four rejected pairings against one applied merge, each hitting a different referential rule: a child in another term is 422 ERR_CROSS_TERM_MERGE, an already-absorbed child is 409 ERR_SHELL_ALREADY_MERGED, an absorbed PARENT is 422 ERR_MERGE_CHAIN_FORBIDDEN, and a child that has itself absorbed someone is also ERR_MERGE_CHAIN_FORBIDDEN. The absorbed-child and absorbed-parent cases look symmetric but must return different codes."
        test_recipe:
          setup:
            - "Term 2026FA (REGISTRATION_OPEN) holds three PROVISIONED OFFICIAL shells P, C and D; term 2027SP holds one PROVISIONED OFFICIAL shell X."
            - "Merge request M1 is submitted by adm-1, approved by adm-2 (segregation of duties) and applied, so C is MERGED into P and P.absorbed_child_count is 1."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { t1: $.data.id }
            - call: "POST /academic-terms/${t1}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms"
              payload: { term_code: "2027SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-07T00:00:00Z" }
              as: Registrar
              captures: { t2: $.data.id }
            - call: "POST /academic-terms/${t2}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6190", full_name: "Grace Hopper", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t1}", owner_person_id: "${prof_id}", sis_section_code: "LT100-01", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /course-shells/${p_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              captures: { p_v: $.data.version }
            - call: "POST /course-shells"
              payload: { term_id: "${t1}", owner_person_id: "${prof_id}", sis_section_code: "LT100-02", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /course-shells/${c_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${t1}", owner_person_id: "${prof_id}", sis_section_code: "LT100-03", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { d_id: $.data.id }
            - call: "POST /course-shells/${d_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${t2}", owner_person_id: "${prof_id}", sis_section_code: "LT100-01", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { x_id: $.data.id }
            - call: "POST /course-shells/${x_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${p_id}", child_shell_id: "${c_id}", expected_parent_shell_version: "${p_v}", justification: "cross-listed section" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { m1: $.data.id }
            - call: "POST /merge-requests/${m1}/transitions"
              payload: { action: "SUBMIT" }
              as: LmsAdmin
              as_user_id: "adm-1"
            - call: "POST /merge-requests/${m1}/transitions"
              payload: { action: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-2"
            - call: "POST /merge-requests/${m1}/transitions"
              payload: { action: "APPLY" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { m1_state: $.data.merge_state }
            - call: "GET /course-shells/${c_id}"
              payload: {}
              as: LmsAdmin
              captures: { c_state: $.data.provisioning_state, c_merged_into: $.data.merged_into_shell_id }
            - call: "GET /course-shells/${p_id}"
              payload: {}
              as: LmsAdmin
              captures: { p_v2: $.data.version, p_absorbed: $.data.absorbed_child_count }
          trigger:
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${p_id}", child_shell_id: "${x_id}", expected_parent_shell_version: "${p_v2}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { err_cross: $.data.error_id }
            - call: "GET /course-shells/${d_id}"
              payload: {}
              as: LmsAdmin
              captures: { d_v: $.data.version }
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${d_id}", child_shell_id: "${c_id}", expected_parent_shell_version: "${d_v}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { err_absorbed: $.data.error_id }
            - call: "GET /course-shells/${c_id}"
              payload: {}
              as: LmsAdmin
              captures: { c_v: $.data.version }
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${c_id}", child_shell_id: "${d_id}", expected_parent_shell_version: "${c_v}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { err_chain_parent: $.data.error_id }
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${d_id}", child_shell_id: "${p_id}", expected_parent_shell_version: "${d_v}" }
