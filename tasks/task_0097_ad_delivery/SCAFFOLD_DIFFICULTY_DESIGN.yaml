# =============================================================================
# task_0097_ad_delivery — Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §0.5 of the scaffold generator skill against §1.1–§1.7 of
# SCAFFOLD.yaml. Every grounds[*] reference resolves to a declared element.
# =============================================================================

scaffold_difficulty_design:

  # ------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gsp_vs_vcg_clearing_price_on_auction_event
        grounds:
          - calculations.auction_clearing_price_gsp
          - calculations.auction_clearing_price_vcg
          - state_machines.AuctionEvent
          - entities.AuctionEvent.fields.clearing_price_cents
          - entities.AuctionEvent.fields.pricing_rule
        distinguishing_aspect: |
          Same auction inputs (winner bid 500, runner-up ranking 300, winner quality*ctr 10,
          floor 1) produce different clearing prices on the AuctionEvent entity depending on
          pricing_rule: GSP yields 31 cents (ceil(300/10)+1), VCG yields 30 cents (ceil(300/10)),
          a dual-variant calc operating on the auction-pricing domain.
        test_recipe:
          setup:
            - "POST /advertisers -> Advertiser A1 (industry=GENERAL, billing_mode=PREPAY, tax_rate_bps=0)"
            - "Recharge wallet so A1.balance_cents = 100000; qualification verified"
            - "Create Campaign C1 (daily_budget=100000) -> activate; AdGroup G_winner with bid=500, quality_score=10, predicted_ctr=1.0; AdGroup G_runner_up with bid=300, quality_score=1.0, predicted_ctr=1.0; one approved creative under each"
          trigger:
            - "POST /auctions {pricing_rule:GSP, floor_price_cents:1, candidate_ad_group_ids:[G_winner,G_runner_up]}"
            - "POST /auctions {pricing_rule:VCG, floor_price_cents:1, candidate_ad_group_ids:[G_winner,G_runner_up]}"
          assert:
            - "First AuctionEvent.winning_ad_group_id == G_winner.id"
            - "First AuctionEvent.clearing_price_cents == 31"
            - "Second AuctionEvent.clearing_price_cents == 30"
            - "First.clearing_price_cents != Second.clearing_price_cents"

      - name: last_click_vs_position_based_attribution_on_conversion
        grounds:
          - calculations.attribution_credit_distribution
          - state_machines.ConversionEvent
          - entities.ConversionEvent.fields.attributed_touchpoints
          - entities.ConversionEvent.fields.attribution_model
        distinguishing_aspect: |
          On the ConversionEvent entity domain (distinct from AuctionEvent), the same three
          click touchpoints with value_cents=1000 produce divergent credit distributions:
          LAST_CLICK assigns 1000 to touchpoint #3 only; POSITION_BASED assigns 400/200/400.
          Different inputs to attributed_touchpoints despite identical billing-event history.
        test_recipe:
          setup:
            - "POST /advertisers -> A1; recharge; create Campaign/AdGroup with one approved creative"
            - "Run 3 auctions and POST /billing-events three CLICKs at t=0, t=1d, t=2d for the same user_id u1; each BillingEvent FINALIZES with cost_cents=10"
            - "POST /conversions with user_id=u1, advertiser_id=A1, value_cents=1000, attribution_window_days=7 — once with attribution_model=LAST_CLICK and once with POSITION_BASED (two distinct conversions)"
          trigger:
            - "POST /conversions/{conv_last_click_id}/attribute"
            - "POST /conversions/{conv_position_based_id}/attribute"
          assert:
            - "conv_last_click.attributed_touchpoints == [{billing_event_id:click_3, credit_fraction:1.0, credit_cents:1000}]"
            - "conv_position_based.attributed_touchpoints sums to 1000 cents"
            - "conv_position_based.attributed_touchpoints[0].credit_cents == 400"
            - "conv_position_based.attributed_touchpoints[1].credit_cents == 200"
            - "conv_position_based.attributed_touchpoints[2].credit_cents == 400"

      - name: chronic_vs_acute_advertiser_risk_score
        grounds:
          - calculations.advertiser_risk_score
          - entities.Advertiser.fields.id
        distinguishing_aspect: |
          On the Advertiser entity domain (separate from AuctionEvent and ConversionEvent), the
          same advertiser's invalid_traffic_rate and reject_rate produce different risk_score
          values depending on the window mode — chronic (30d) lags acute (24h), so an advertiser
          who just had a burst of invalid events shows acute=100, chronic=20.
        test_recipe:
          setup:
            - "Create advertiser A1; over the past 30 days have 8 BillingEvents with status=VALID/FINALIZED and 2 with status=INVALID_TRAFFIC (20% chronic rate)"
            - "Within the past 24h: 1 VALID and 9 INVALID_TRAFFIC (90% acute rate)"
          trigger:
            - "GET /advertisers/{A1}/risk-score              (defaults to chronic)"
            - "GET /advertisers/{A1}/risk-score?mode=acute"
          assert:
            - "chronic response.risk_score == round((11/30) * 0.6 * 100 + 0 * 0.4 * 100) = round(22) = 22"
            - "acute response.risk_score == round((9/10) * 0.6 * 100 + 0 * 0.4 * 100) = round(54) = 54"
            - "chronic.risk_score != acute.risk_score"

  # ------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: auction_ranking_score_three_input_nonlinear
        grounds:
          - calculations.auction_ranking_score
          - calculations.auction_clearing_price_gsp
          - entities.AdGroup.fields.bid_cents
          - entities.AdGroup.fields.quality_score
          - entities.AdGroup.fields.predicted_ctr
        distinguishing_aspect: |
          Mode (a): a ≥3-input non-linear formula. ranking_score = bid * quality_score *
          predicted_ctr with floor enforcement on clearing price, and conditional CPM/CPC
          branch on bidding_strategy. Three inputs interact multiplicatively, the clearing
          price applies max(., floor) and min(., effective_bid) — non-linear.
        test_recipe:
          setup:
            - "Advertiser A1 active; Campaign+AdGroup G1 (bid=1000, quality_score=2.0, predicted_ctr=0.05, bidding_strategy=CPC) with approved creative"
            - "AdGroup G2 (bid=200, quality_score=8.0, predicted_ctr=0.10, bidding_strategy=CPC) with approved creative"
          trigger:
            - "POST /auctions {pricing_rule:GSP, floor_price_cents:50, candidate_ad_group_ids:[G1,G2]}"
          assert:
            - "ranking_score(G1) = 1000 * 2.0 * 0.05 = 100.0"
            - "ranking_score(G2) = 200 * 8.0 * 0.10 = 160.0"
            - "AuctionEvent.winning_ad_group_id == G2.id (G2 wins despite lower bid because quality*CTR raises rank)"
            - "AuctionEvent.clearing_price_cents == max(ceil(100.0 / (8.0 * 0.10)) + 1, 50) = max(126, 50) = 126"

      - name: billing_event_tax_rounding_order
        grounds:
          - calculations.billing_event_cost
          - entities.BillingEvent.fields.gross_cost_cents
          - entities.BillingEvent.fields.tax_cents
          - entities.BillingEvent.fields.cost_cents
          - entities.Advertiser.fields.tax_rate_bps
        distinguishing_aspect: |
          Mode (b): nested rounding order matters. The scaffold pins compute_tax_on_gross
          THEN add, NOT round-after-summing. Inputs gross=37 cents, tax_rate_bps=1500 (15%):
          (pinned order) tax = floor(37*1500/10000) = floor(5.55) = 5; cost = 42.
          (wrong order) total = 37 * 1.15 = 42.55 -> round to 43. The two cents differ.
        test_recipe:
          setup:
            - "Advertiser A1 with tax_rate_bps=1500 (15%); recharge; active campaign+ad-group (CPC, bid=37) with approved creative"
            - "Run auction yielding clearing_price_cents = 37"
          trigger:
            - "POST /billing-events {event_type:CLICK, auction_event_id:auc1, ad_group_id:G1, dedup_key:k1, ivt_score:0.0}"
          assert:
            - "BillingEvent.gross_cost_cents == 37"
            - "BillingEvent.tax_cents == 5    # floor(37 * 1500 / 10000)"
            - "BillingEvent.cost_cents == 42  # NOT 43"
            - "BillingEvent.status == FINALIZED"

  # ------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: creative_review_branching_and_cycle_via_appeal
        grounds:
          - state_machines.Creative
          - entities.Creative.fields.review_status
          - entities.Creative.fields.appeal_count
        distinguishing_aspect: |
          Branching fork-join + cycle on Creative.review_status: from PENDING_PRESCREEN the
          pre-screen forks to PRESCREEN_FAILED or PENDING_HUMAN_REVIEW; from REJECTED the
          appeal loop (REJECTED -> APPEAL_FILED -> UNDER_APPEAL_REVIEW -> APPROVED or
          REJECTED) is a cycle returning to REJECTED. Cycle plus branch on a single entity.
        test_recipe:
          setup:
            - "Advertiser A1 active; Campaign+AdGroup G1 with one Creative cr1 in PENDING_PRESCREEN"
          trigger:
            - "POST /creatives/{cr1}/prescreen {pre_screen_score:0.4}    # branch -> PENDING_HUMAN_REVIEW"
            - "POST /creatives/{cr1}/human-review {outcome:REJECT, rejection_codes:[NO_DISCLAIMER]}"
            - "POST /creatives/{cr1}/appeal"
            - "POST /creatives/{cr1}/appeal/start-review"
            - "POST /creatives/{cr1}/appeal/decide {outcome:REJECT}      # cycle back into REJECTED"
          assert:
            - "After step 1 review_status == PENDING_HUMAN_REVIEW"
            - "After step 2 review_status == REJECTED"
            - "After step 3 review_status == APPEAL_FILED"
            - "After step 4 review_status == UNDER_APPEAL_REVIEW"
            - "After step 5 review_status == REJECTED AND appeal_count == 1"
            - "A second POST /creatives/{cr1}/appeal returns 409 ERR_APPEAL_ALREADY_FILED"

      - name: advertiser_parallel_status_and_balance_state
        grounds:
          - state_machines.Advertiser.field=status
          - state_machines.Advertiser.field=balance_state
          - entities.Advertiser.fields.status
          - entities.Advertiser.fields.balance_state
        distinguishing_aspect: |
          On the Advertiser entity, two parallel state dimensions evolve independently:
          status in {PENDING,ACTIVE,SUSPENDED,CLOSED} and balance_state in
          {HEALTHY,LOW_BALANCE,ZERO_BALANCE}. An ACTIVE advertiser can be ZERO_BALANCE; a
          SUSPENDED advertiser can be HEALTHY. Different entity from Creative.
        test_recipe:
          setup:
            - "Create advertiser A1 (billing_mode=PREPAY, low_balance_threshold_cents=10000, credit_line_cents=0); upload qualification; reviewer approves -> Advertiser.status -> ACTIVE after first recharge"
            - "POST recharge for 100000 -> balance_cents=100000, balance_state=HEALTHY"
          trigger:
            - "Run auctions+billing events until cumulative cost reaches 90001 cents (balance_cents=9999) — balance_state -> LOW_BALANCE"
            - "Run further billing events totalling 9999 more cents (balance_cents=0) — balance_state -> ZERO_BALANCE"
            - "POST /advertisers/{A1}/suspend   — status -> SUSPENDED"
            - "POST /advertisers/{A1}/wallet/transactions {tx_type:RECHARGE, amount_cents:50000, idempotency_key:k1}"
          assert:
            - "After step 1 Advertiser.status == ACTIVE AND balance_state == LOW_BALANCE"
            - "After step 2 Advertiser.status == ACTIVE AND balance_state == ZERO_BALANCE"
            - "After step 3 Advertiser.status == SUSPENDED AND balance_state == ZERO_BALANCE"
            - "After step 4 Advertiser.status == SUSPENDED AND balance_state == HEALTHY (two dimensions evolve independently)"

  # ------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: advertiser_close_to_campaign_to_ad_group_to_creative
        grounds:
          - state_machines.Advertiser.ACTIVE_to_CLOSED
          - state_machines.Campaign.ACTIVE_to_ENDED
          - state_machines.AdGroup.RUNNING_to_ARCHIVED
          - state_machines.Creative.APPROVED_to_ARCHIVED
        distinguishing_aspect: |
          Trigger: POST /advertisers/{id}/close. Depth-3 chain where each hop is caused by
          the previous link (NOT a parallel fan-out from the root): Advertiser CLOSE causes
          Campaign.status -> ENDED; ENDED's side_effects cause AdGroup.status -> ARCHIVED;
          ARCHIVED's side_effects cause Creative.review_status -> ARCHIVED.
        test_recipe:
          setup:
            - "Advertiser A1 ACTIVE; Campaign C1 ACTIVE with one AdGroup G1 RUNNING and one Creative cr1 APPROVED; all campaigns paused so close is permitted"
            - "POST /advertisers/{A1}/campaigns/{C1}/pause to permit close (advertiser cannot close while ACTIVE campaign exists)"
          trigger:
            - "POST /advertisers/{A1}/close"
          assert:
            - "Advertiser.status == CLOSED"
            - "Campaign C1.status == ENDED"
            - "AdGroup G1.status == ARCHIVED"
            - "Creative cr1.review_status == ARCHIVED AND cr1.archived_at != null"

      - name: qualification_rejection_to_creatives_rejected_to_ad_group_disapproved
        grounds:
          - state_machines.Creative.APPROVED_to_REJECTED
          - state_machines.AdGroup.RUNNING_to_DISAPPROVED
          - entities.Advertiser.fields.qualification_status
          - endpoints.POST_/advertisers/{advertiserId}/qualifications/{docId}/review
        distinguishing_aspect: |
          Trigger: POST /advertisers/{id}/qualifications/{docId}/review with outcome=REJECT
          on a re-verification. Depth-2 chain caused by previous link: qualification rejection
          on the Advertiser flips its qualification_status to REJECTED; the qualification
          flip causes all APPROVED Creatives to transition to REJECTED; the creative flip
          drops AdGroup.approved_creative_count to 0 which causes AdGroup -> DISAPPROVED.
          DIFFERENT triggering transition than the close cascade above.
        test_recipe:
          setup:
            - "Advertiser A1 ACTIVE (qualification VERIFIED); Campaign+AdGroup G1 RUNNING with one APPROVED Creative cr1; submit a re-verification qualification document doc2"
          trigger:
            - "POST /advertisers/{A1}/qualifications/{doc2}/review {outcome:REJECT, rejection_reason:'expired'}"
          assert:
            - "QualificationDoc doc2.review_status == REJECTED"
            - "Advertiser.qualification_status == REJECTED"
            - "Creative cr1.review_status == REJECTED"
            - "AdGroup G1.approved_creative_count == 0 AND G1.status == DISAPPROVED"

  # ------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_creative_review_on_suspended_advertiser
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors.ERR_ADVERTISER_SUSPENDED
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
        distinguishing_aspect: |
          Error-category pair: state (priority 4, ERR_ADVERTISER_SUSPENDED) vs business_safety
          (priority 8, ERR_SEGREGATION_OF_DUTIES_VIOLATION). A reviewer who is also an
          AccountUser of a SUSPENDED advertiser tries human-review. Both checks would fail;
          the lower-priority-number (state) wins per ordered validation list.
        test_recipe:
          setup:
            - "Create advertiser A1 ACTIVE; create AccountUser u_owner with external_user_id=ru1; verify qualification; create campaign/ad-group with Creative cr1 in PENDING_HUMAN_REVIEW"
            - "POST /advertisers/{A1}/suspend                          (status -> SUSPENDED)"
          trigger:
            - "POST /creatives/{cr1}/human-review {outcome:APPROVE} with headers X-User-Role=CreativeReviewer, X-User-ID=ru1 (the offending dual-affiliation reviewer)"
          assert:
            - "Response status == 409"
            - "Response.data.error_id == 'ERR_ADVERTISER_SUSPENDED' (state wins; segregation-of-duties NOT surfaced)"

      - name: business_safety_vs_business_fiscal_disclaimer_vs_zero_balance_on_campaign_activate
        grounds:
          - validations[priority=7]
          - validations[priority=20]
          - errors.ERR_DISCLAIMER_REQUIRED
          - errors.ERR_ZERO_BALANCE
        distinguishing_aspect: |
          Error-category pair: business_safety (priority 7, ERR_DISCLAIMER_REQUIRED) vs
          business_fiscal (priority 20, ERR_ZERO_BALANCE). On campaign activate for a medical
          advertiser with both a missing-disclaimer creative AND balance_cents=0 — the
          higher-priority safety check wins. DIFFERENT error-category pair from instance #1.
        test_recipe:
          setup:
            - "Advertiser A1 with industry_category=MEDICAL, qualification VERIFIED, balance_cents=0 (no recharge)"
            - "Campaign C1 DRAFT; AdGroup G1 with Creative cr1 submitted WITHOUT required_disclaimer (will fail safety) — submission itself rejected unless we exercise activate path; instead use a creative that was approved before being audited; for testing, the activate is the trigger that surfaces both checks (creative-without-disclaimer is rejected first at submission, so use approve-then-edit landing flow)"
            - "Equivalent: submit creative WITH disclaimer, get it APPROVED, then PATCH-equivalent change to clear disclaimer is forbidden; alternative: use Campaign.activate where balance==0 AND no APPROVED creative under any AdGroup"
            - "Simpler: Advertiser A1 industry_category=MEDICAL, qualification VERIFIED, balance_cents=0; Campaign C1; AdGroup G1; ATTEMPT to submit a creative without required_disclaimer"
          trigger:
            - "POST /advertisers/{A1}/campaigns/{C1}/ad-groups/{G1}/creatives {format:IMAGE, ..., required_disclaimer:null}"
          assert:
            - "Response status == 422"
            - "Response.data.error_id == 'ERR_DISCLAIMER_REQUIRED' (safety priority 7 wins over fiscal priority 20)"

  # ------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: frequency_cap_inclusive_threshold
        grounds:
          - calculations.frequency_cap_check
          - entities.AdGroup.fields.frequency_cap_per_user_per_day
          - entities.AuctionEvent.fields.filtered_ad_group_ids
        distinguishing_aspect: |
          Numeric threshold boundary on a count metric (impressions per user per day) reached
          via POST /auctions. impressions_today == cap excludes (>= is inclusive). At cap-1
          the candidate stays eligible. Different metric (count) from instance #2 (empty-set).
        test_recipe:
          setup:
            - "Advertiser A1 active; AdGroup G1 with frequency_cap_per_user_per_day=2; one approved creative"
            - "Two prior IMPRESSION BillingEvents finalized for user_id=u1 on today's UTC day for G1"
          trigger:
            - "POST /auctions {pricing_rule:GSP, floor_price_cents:1, user_id:u1, candidate_ad_group_ids:[G1]}"
          assert:
            - "AuctionEvent.outcome == ALL_FILTERED"
            - "G1.id in AuctionEvent.filtered_ad_group_ids"
            - "Second trial after deleting one impression (cap-1=1) returns AuctionEvent with G1 as winner (G1.id NOT in filtered_ad_group_ids)"

      - name: empty_auction_candidate_pool_zero_count_boundary
        grounds:
          - validations[priority=12]
          - errors.ERR_EMPTY_AUCTION_POOL
          - endpoints.POST_/auctions
        distinguishing_aspect: |
          Empty-collection boundary on the candidate_ad_group_ids input via POST /auctions —
          zero candidates is the empty-set edge. Different endpoint and different metric
          (collection-count vs frequency-cap count) than instance #1.
        test_recipe:
          setup:
            - "Advertiser A1 ACTIVE"
          trigger:
            - "POST /auctions {pricing_rule:GSP, floor_price_cents:1, candidate_ad_group_ids:[]}"
          assert:
            - "Response status == 400"
            - "Response.data.error_id == 'ERR_EMPTY_AUCTION_POOL'"
            - "Repeated call with one candidate succeeds (returns AuctionEvent)"

  # ------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: campaign_activate_requires_advertiser_active_and_healthy_balance
        grounds:
          - state_machines.Campaign.PAUSED_to_ACTIVE
          - validations[priority=4]
          - validations[priority=20]
          - errors.ERR_ADVERTISER_SUSPENDED
          - errors.ERR_ZERO_BALANCE
        distinguishing_aspect: |
          Cross-entity pair Campaign->Advertiser: Campaign.PAUSED_to_ACTIVE transition's
          validity depends on Advertiser.status==ACTIVE AND Advertiser.balance_state in
          {HEALTHY,LOW_BALANCE}. Two distinct preconditions reference Advertiser fields.
        test_recipe:
          setup:
            - "Advertiser A1 ACTIVE with balance_state=HEALTHY; Campaign C1 PAUSED with at least one approved creative under AdGroup G1"
            - "Variant 1: suspend the advertiser before activating campaign"
            - "Variant 2: drain wallet to balance_cents=0 before activating campaign"
          trigger:
            - "Variant 1: POST /advertisers/{A1}/suspend ; then POST /advertisers/{A1}/campaigns/{C1}/activate"
            - "Variant 2: with advertiser ACTIVE, drain to balance_cents=0 ; then POST /advertisers/{A1}/campaigns/{C1}/activate"
          assert:
            - "Variant 1 response.status == 409 AND error_id == 'ERR_ADVERTISER_SUSPENDED'"
            - "Variant 2 response.status == 402 AND error_id == 'ERR_ZERO_BALANCE'"
            - "Variant 2 after recharge to balance_cents > low_balance_threshold: activate succeeds, Campaign.status == ACTIVE"

      - name: creative_human_review_requires_creative_state_and_advertiser_qualification
        grounds:
          - state_machines.Creative.PENDING_HUMAN_REVIEW_to_APPROVED
          - validations[priority=6]
          - validations[priority=5]
          - errors.ERR_QUALIFICATION_REQUIRED
          - errors.ERR_INVALID_CREATIVE_STATE
        distinguishing_aspect: |
          Cross-entity pair Creative->Advertiser (a DIFFERENT pair from Campaign->Advertiser
          in instance #1). Creative human-review approval requires (a) Creative.review_status
          == PENDING_HUMAN_REVIEW and (b) for industry MEDICAL/FINANCIAL/EDUCATION,
          Advertiser.qualification_status == VERIFIED. Two distinct cross-entity gates.
        test_recipe:
          setup:
            - "Advertiser A1 industry=MEDICAL, qualification VERIFIED; Campaign+AdGroup G1; submit Creative cr1 with required_disclaimer; pre-screen passes -> PENDING_HUMAN_REVIEW"
            - "Submit a NEW qualification doc that gets rejected -> Advertiser.qualification_status -> REJECTED (cascading earlier APPROVED creatives -> REJECTED but cr1 in PENDING_HUMAN_REVIEW is not yet APPROVED)"
          trigger:
            - "POST /creatives/{cr1}/human-review {outcome:APPROVE}"
          assert:
            - "Response status == 422"
            - "Response.data.error_id == 'ERR_QUALIFICATION_REQUIRED'"
            - "After re-verifying qualification (status back to VERIFIED) the same human-review APPROVE returns Creative.review_status == APPROVED"

  # ------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: ad_group_daypart_targeting_overlap_at_auction_time
        grounds:
          - entities.AdGroup.fields.targeting_dayparts
          - state_machines.AuctionEvent
          - calculations.frequency_cap_check
        distinguishing_aspect: |
          Geometric semantics: closed-open daypart intervals [hour_start, hour_end) per
          (dow, hour_start, hour_end). The auction's wall-clock UTC hour must lie strictly
          inside the half-open interval. Boundary semantics: hour == hour_end EXCLUDES the
          candidate. Resource = AdGroup targeting window.
        test_recipe:
          setup:
            - "AdGroup G1 with targeting_dayparts=[{dow:1, hour_start:9, hour_end:17}] (Monday 09:00-17:00 UTC); approved creative"
            - "Advance clock to Monday 16:59 UTC"
          trigger:
            - "POST /auctions at clock=Monday 16:59 UTC with candidates=[G1]"
            - "Advance clock to Monday 17:00 UTC"
            - "POST /auctions at clock=Monday 17:00 UTC with candidates=[G1]"
          assert:
            - "First auction G1 IS eligible (winning_ad_group_id == G1.id)"
            - "Second auction G1 IS filtered (outcome=ALL_FILTERED; G1.id in filtered_ad_group_ids) because hour_end is EXCLUSIVE"

      - name: qualification_doc_expiry_window_overlap_on_creative_submission
        grounds:
          - entities.QualificationDoc.fields.expiry_date
          - state_machines.Creative.PENDING_PRESCREEN_to_PENDING_HUMAN_REVIEW
          - validations[priority=6]
        distinguishing_aspect: |
          DIFFERENT interval semantics from instance #1: an inclusive expiry boundary on a
          resource (QualificationDoc.expiry_date) with adjacency rule: a creative submitted
          at expiry_date+epsilon is rejected (industry-required qualification expired). The
          adjacency rule treats expiry_date as 'valid through end of that day inclusive',
          a different geometric semantics from the half-open daypart window in instance #1.
        test_recipe:
          setup:
            - "Advertiser A1 industry=MEDICAL; submit qualification doc with expiry_date=2026-06-01T23:59:59Z; reviewer approves"
            - "Advance clock to 2026-06-01T23:59:00Z; verify Advertiser.qualification_status == VERIFIED"
            - "Advance clock to 2026-06-02T00:00:01Z (one second past expiry)"
          trigger:
            - "POST /advertisers/{A1}/campaigns/{C1}/ad-groups/{G1}/creatives {required_disclaimer:'...'} at 2026-06-01T23:59:00Z"
            - "POST same creative at 2026-06-02T00:00:01Z"
          assert:
            - "First submission succeeds (Creative.review_status == PENDING_PRESCREEN)"
            - "Second submission returns 422 ERR_QUALIFICATION_REQUIRED (Advertiser.qualification_status recomputed to UNVERIFIED/REJECTED at expiry)"

  # ------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: billing_event_finalize_then_reverse_preserves_balance_cents
        grounds:
          - state_machines.BillingEvent.VALID_to_FINALIZED
          - state_machines.BillingEvent.FINALIZED_to_REVERSED
          - entities.Advertiser.fields.balance_cents
          - entities.WalletTransaction.fields.tx_type
        distinguishing_aspect: |
          Conserved quantity: Advertiser.balance_cents. Invariant: starting from balance B0,
          BillingEvent FINALIZED creates WalletTransaction CONSUMPTION -B; subsequent
          REVERSED on same BillingEvent creates a REFUND +B; final balance_cents == B0.
          Conserved across the (FINALIZE, REVERSE) pair.
        test_recipe:
          setup:
            - "Advertiser A1 ACTIVE with balance_cents=100000 (B0)"
            - "Active campaign+ad-group+approved creative; run auction yielding clearing_price=100; ingest CLICK BillingEvent be1"
            - "Confirm BillingEvent be1.status=FINALIZED, be1.cost_cents=100 (tax_rate_bps=0)"
          trigger:
            - "POST /billing-events/{be1}/reverse {reversal_reason:'late-ivt'}"
          assert:
            - "Before reverse: Advertiser.balance_cents == 99900"
            - "After reverse:  Advertiser.balance_cents == 100000  (== B0; compensating pair conserves balance)"
            - "Campaign.lifetime_spent_cents == 0 after reverse"
            - "Sum of WalletTransaction.amount_cents where status=SETTLED == 100000 (recharge - 100 - +100 = 100000)"

      - name: campaign_lifetime_spent_cents_finalize_then_reverse_preserves_zero_drift
        grounds:
          - state_machines.BillingEvent.VALID_to_FINALIZED
          - state_machines.BillingEvent.FINALIZED_to_REVERSED
          - calculations.campaign_budget_consumption
          - entities.Campaign.fields.lifetime_spent_cents
          - entities.Campaign.fields.today_spent_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity from balance_cents: Campaign.lifetime_spent_cents AND
          Campaign.today_spent_cents (budget consumption ledger). Invariant: forward FINALIZE
          + compensating REVERSE returns BOTH spent counters to their pre-finalize values,
          and Campaign.status (if it had transitioned to BUDGET_EXHAUSTED on the forward)
          reverts to ACTIVE on the reverse.
        test_recipe:
          setup:
            - "Advertiser A1 ACTIVE; Campaign C1 with daily_budget_cents=200 and lifetime_budget_cents=500; AdGroup G1 (CPC bid=300) with approved creative; balance pre-funded"
            - "Run auction1 yielding clearing_price=200 -> POST /billing-events be1 (CLICK) finalizes with cost_cents=200; today_spent=200 == daily_budget -> Campaign C1.status -> BUDGET_EXHAUSTED"
          trigger:
            - "POST /billing-events/{be1}/reverse {reversal_reason:'late-ivt'}"
          assert:
            - "Before reverse: Campaign C1.today_spent_cents == 200 AND lifetime_spent_cents == 200 AND status == BUDGET_EXHAUSTED"
            - "After reverse:  Campaign C1.today_spent_cents == 0  AND lifetime_spent_cents == 0  AND status returns to ACTIVE"
            - "AdGroup G1.status returns to RUNNING (cascade compensating)"
            - "No drift in the campaign budget ledger across the FINALIZE/REVERSE pair"
