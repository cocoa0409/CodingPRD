          setup:
            - "Clock 2026-06-01; Acme; SOW countersigned (SENIOR pinned rate 20000); campaign IN_FLIGHT."
            - "TimeEntry A for Dana: 2026-06-02 09:00-16:50 = 470 minutes, billable, APPROVED (all regular)."
            - "TimeEntry B for Dana: 2026-06-02 16:50-17:50 = 60 minutes, billable, still SUBMITTED."
