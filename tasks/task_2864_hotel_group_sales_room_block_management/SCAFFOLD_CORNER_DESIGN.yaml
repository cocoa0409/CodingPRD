        captures: {an2_id: $.data.id}
      - call: POST /group-sales/displacement-analyses/${an_id}/decide
        payload: {decision: APPROVE, expected_lead_version: '${v_read}'}
        as: RevenueManager
        as_user_id: rm-002
        captures: {e_stale: $.data.error_id}
      - call: GET /group-sales/displacement-analyses/${an_id}
        payload: {}
