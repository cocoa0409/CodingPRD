              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10216", full_name: "Fay Osei", date_of_birth: "1991-01-15", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_1: $.data.id }
            - call: "POST /patients"
