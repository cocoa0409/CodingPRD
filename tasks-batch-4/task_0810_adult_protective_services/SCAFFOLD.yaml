scenario: "Adult Protective Services (APS): report intake & screening (abuse/neglect/exploitation), investigation & risk assessment, emergency protective placement, capacity & guardianship referral, service plan & benefit linkage, financial-exploitation freeze, cross-report & mandatory reporter, closure"
domain_name: "adult-protective-services"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies; child
  # discovery is by filtered-list GET (e.g. GET /investigations?case_id=...),
  # not by nested URL paths. No entity nests under another in the URL tree.

  state_machine_shape: branching
  # Report forks RECEIVED -> {SCREENED_IN, SCREENED_OUT} with divergent side
  # effects; Investigation carries a FINDINGS_SUBMITTED -> IN_PROGRESS revision
  # cycle; FinancialAccount toggles ACTIVE <-> FROZEN.

  relationship_patterns:
    - one_to_many          # Case -> Investigation/Placement/Freeze
    - flat_foreign_key     # Report.client_id, Freeze.account_id, etc.
    - cross_aggregate      # Placement eligibility reads Client; Freeze reads Case

  role_model: approval_chain
  # IntakeWorker files -> Supervisor screens/disposes/closes; Caseworker
  # investigates but cannot dispose its own findings (Supervisor disposes).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Report
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the alleged victim this report concerns"
      - name: reporter_type
        type: enum
        source: input
        description: "who filed the report; MANDATORY reporters (clinicians, bankers) carry legal reporting duty"
        constraints: "one of {MANDATORY, VOLUNTARY, ANONYMOUS}"
      - name: reporter_name
        type: string
        source: input
        description: "reporter name; may be null for ANONYMOUS"
        default: null
      - name: allegation_types
        type: array
        source: input
        description: "non-empty subset of allegation categories"
        constraints: "each in {PHYSICAL_ABUSE, NEGLECT, FINANCIAL_EXPLOITATION, EMOTIONAL_ABUSE, SELF_NEGLECT}; length >= 1"
      - name: priority
        type: enum
        source: input
        description: "intake urgency; drives response_due_at SLA"
        constraints: "one of {EMERGENCY, PRIORITY, ROUTINE}"
      - name: narrative
        type: string
        source: input
        description: "free-text description of the allegation"
      - name: status
        type: enum
        source: system
        description: "screening lifecycle state"
        default: RECEIVED
        constraints: "one of {RECEIVED, SCREENED_IN, SCREENED_OUT}"
      - name: response_due_at
        type: datetime
        source: computed
        description: "created_at + SLA(priority); see response_deadline calculation"
      - name: screening_overdue
        type: boolean
        source: computed
        description: "true when the logical clock at screen time is strictly past response_due_at"
        default: false
      - name: screen_out_reason
        type: string
        source: system
        description: "reason recorded when screened out; null otherwise"
        default: null
      - name: case_id
        type: string
        source: system
        description: "id of the Case opened on SCREEN_IN (null until screened in); back-reference, discover Cases via GET /cases?report_id="
        default: null

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "vulnerable adult's name"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD)"
      - name: address
        type: string
        source: input
        description: "residential address"
      - name: capacity_status
        type: enum
        source: system
        description: "decisional-capacity determination outcome"
        default: UNKNOWN
        constraints: "one of {UNKNOWN, INTACT, IMPAIRED}"
      - name: status
        type: enum
        source: system
        description: "case-lifecycle-driven client status"
        default: INTAKE
        constraints: "one of {INTAKE, UNDER_INVESTIGATION, SERVICES_PENDING, SERVICES_ACTIVE, CLOSED}"
      - name: placement_status
        type: enum
        source: computed
        description: "PLACED while any owned EmergencyPlacement is ACTIVE, else NONE"
        default: NONE
        constraints: "one of {NONE, PLACED}"
      - name: risk_level
        type: enum
        source: computed
        description: "tier from the latest COMPREHENSIVE risk score; null until a comprehensive assessment exists"
        default: null
        constraints: "one of {LOW, MODERATE, HIGH} or null"
      - name: preliminary_risk_score
        type: integer
        source: computed
        description: "risk_score under the PRELIMINARY variant; null until assessed"
        default: null
      - name: comprehensive_risk_score
        type: integer
        source: computed
        description: "risk_score under the COMPREHENSIVE variant; null until assessed"
        default: null
      - name: open_case_count
        type: integer
        source: computed
        description: "count of non-CLOSED Cases whose client_id is this client"
        default: 0

  - name: FinancialAccount
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the account holder"
      - name: institution_name
        type: string
        source: input
        description: "bank/credit-union name"
      - name: total_balance_cents
        type: integer
        source: input
        description: "total ledger balance in cents; >= 0"
        constraints: ">= 0"
      - name: frozen_amount_cents
        type: integer
        source: computed
        description: "amount held under an ACTIVE freeze; equals total_balance_cents while FROZEN, else 0"
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: "= total_balance_cents - frozen_amount_cents; invariant available + frozen == total"
      - name: status
        type: enum
        source: computed
        description: "FROZEN while an ACTIVE freeze exists, else ACTIVE"
        default: ACTIVE
        constraints: "one of {ACTIVE, FROZEN}"
      - name: flagged_amount_cents
        type: integer
        source: computed
        description: "suspected-exploited amount recorded by the ACTIVE freeze; 0 when no active freeze"
        default: 0
      - name: restitution_cents
        type: integer
        source: computed
        description: "cumulative recovered funds distributed to this account by recover-funds"
        default: 0

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "placement facility name"
      - name: total_beds
        type: integer
        source: input
        description: "licensed bed capacity; >= 1"
        constraints: ">= 1"
      - name: occupied_beds
        type: integer
        source: computed
        description: "count of ACTIVE EmergencyPlacements at this facility"
        default: 0
      - name: available_beds
        type: integer
        source: computed
        description: "= total_beds - occupied_beds; invariant available + occupied == total"

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: system
        description: "FK -> Report.id; the originating screened-in report"
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; the case subject (copied from the report)"
      - name: status
        type: enum
        source: system
        description: "investigation lifecycle state"
        default: OPEN
        constraints: "one of {OPEN, UNDER_INVESTIGATION, READY_FOR_CLOSURE, CLOSED}"
      - name: allegation_types
        type: array
        source: system
        description: "copied verbatim from the originating report"
      - name: risk_level
        type: enum
        source: computed
        description: "mirror of the subject Client.risk_level at the latest comprehensive assessment"
        default: null
        constraints: "one of {LOW, MODERATE, HIGH} or null"
      - name: estimated_exposure_cents
        type: integer
        source: computed
        description: "financial_exposure ESTIMATED variant over accounts with an ACTIVE freeze in this case"
        default: 0
      - name: substantiated_exposure_cents
        type: integer
        source: computed
        description: "financial_exposure SUBSTANTIATED variant over ACTIVE freezes in this case"
        default: 0
      - name: frozen_account_count
        type: integer
        source: computed
        description: "count of accounts with an ACTIVE freeze in this case"
        default: 0
      - name: cross_report_agency
        type: string
        source: system
        description: "external agency the case was cross-reported to; null until cross-reported"
        default: null
      - name: cross_reported_at
        type: datetime
        source: system
        description: "logical-clock instant of the cross-report; null until cross-reported"
        default: null
      - name: guardianship_status
        type: enum
        source: system
        description: "capacity/guardianship referral state"
        default: NONE
        constraints: "one of {NONE, REFERRED}"
      - name: service_plan_status
        type: enum
        source: system
        description: "service-plan lifecycle"
        default: NONE
        constraints: "one of {NONE, ACTIVE, TERMINATED}"
      - name: benefit_programs
        type: array
        source: system
        description: "benefit programs linked by the service plan; empty until a plan is created"
        default: []
      - name: closed_at
        type: datetime
        source: system
        description: "logical-clock instant of closure; null while open"
        default: null
      - name: closure_reason
        type: string
        source: system
        description: "reason string supplied at close"
        default: null

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case being investigated"
      - name: assigned_caseworker_id
        type: string
        source: system
        description: "X-User-ID (opaque) of the Caseworker who created the investigation"
      - name: status
        type: enum
        source: system
        description: "investigation state"
        default: IN_PROGRESS
        constraints: "one of {IN_PROGRESS, FINDINGS_SUBMITTED, DISPOSED}"
      - name: finding_summary
        type: string
        source: system
        description: "narrative submitted with findings; null until submitted"
        default: null
      - name: disposition
        type: enum
        source: system
        description: "final disposition set at dispose"
        default: null
        constraints: "one of {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE} or null"
      - name: return_count
        type: integer
        source: computed
        description: "how many times findings were returned for re-investigation"
        default: 0
      - name: disposed_at
        type: datetime
        source: system
        description: "logical-clock instant of disposal; null until disposed"
        default: null

  - name: EmergencyPlacement
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id"
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; copied from the case subject"
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; where the client is placed"
      - name: start_at
        type: datetime
        source: input
        description: "placement start instant (ISO 8601 UTC)"
      - name: end_at
        type: datetime
        source: input
        description: "scheduled placement end instant; must be strictly after start_at"
      - name: court_authorized
        type: boolean
        source: input
        description: "true when a court order backs the placement (exempts the 72h emergency cap)"
        default: false
      - name: status
        type: enum
        source: system
        description: "placement state"
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCHARGED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: computed
        description: "start_at + 72h when not court_authorized, else end_at; see placement expiry threshold"
      - name: discharged_at
        type: datetime
        source: system
        description: "logical-clock instant of discharge/expiry; null while ACTIVE"
        default: null

  - name: FinancialFreeze
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; must allege FINANCIAL_EXPLOITATION"
      - name: account_id
        type: string
        source: input
        description: "FK -> FinancialAccount.id; the account to freeze"
      - name: flagged_amount_cents
        type: integer
        source: input
        description: "suspected exploited amount on this account in cents; 0 <= flagged <= account.total_balance_cents"
        constraints: ">= 0"
      - name: freeze_start
        type: datetime
        source: input
        description: "freeze window start (ISO 8601 UTC)"
      - name: freeze_end
        type: datetime
        source: input
        description: "freeze window end; must be strictly after freeze_start"
      - name: status
        type: enum
        source: system
        description: "freeze state"
        default: ACTIVE
        constraints: "one of {ACTIVE, LIFTED}"
      - name: lifted_at
        type: datetime
        source: system
        description: "logical-clock instant the freeze was lifted; null while ACTIVE"
        default: null

state_machines:
  - entity: Report
    initial_state: RECEIVED
    terminal_states: [SCREENED_IN, SCREENED_OUT]
    transitions:
      - from: RECEIVED
        to: SCREENED_IN
        trigger: "POST /reports/{id}/screen with decision=SCREEN_IN"
        actor: Supervisor
        preconditions:
          - "report.status == RECEIVED"
          - "referenced Client exists"
        side_effects:
          - "create a Case (status OPEN) with report_id=this report, client_id=report.client_id, allegation_types copied from the report"
          - "set report.case_id to the new Case.id"
          - "set report.screening_overdue = (current_clock > report.response_due_at)"
          - "transition subject Client INTAKE -> UNDER_INVESTIGATION (see Client machine)"
          - "increment Client.open_case_count by 1"
        note: "branch A of the fork; divergent side effects from SCREEN_OUT"
      - from: RECEIVED
        to: SCREENED_OUT
        trigger: "POST /reports/{id}/screen with decision=SCREEN_OUT"
        actor: Supervisor
        preconditions:
          - "report.status == RECEIVED"
        side_effects:
          - "set report.screen_out_reason from request body"
          - "set report.screening_overdue = (current_clock > report.response_due_at)"
          - "NO Case is created; Client is untouched"
        note: "branch B of the fork; no case, no client mutation"

  - entity: Client
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: UNDER_INVESTIGATION
        trigger: "system, on Report SCREEN_IN"
        actor: system
        preconditions:
          - "client.status == INTAKE"
        side_effects:
          - "bubble-up: driven by the owning Case being opened"
      - from: UNDER_INVESTIGATION
        to: SERVICES_PENDING
        trigger: "system, when the owning Case reaches READY_FOR_CLOSURE"
        actor: system
        preconditions:
          - "client.status == UNDER_INVESTIGATION"
        side_effects:
          - "cascade link C of the dispose cascade (Investigation -> Case -> Client)"
      - from: SERVICES_PENDING
        to: SERVICES_ACTIVE
        trigger: "POST /cases/{id}/service-plan"
        actor: Caseworker
        preconditions:
          - "client.status == SERVICES_PENDING"
        side_effects:
          - "set Case.service_plan_status = ACTIVE"
      - from: UNDER_INVESTIGATION
        to: CLOSED
        trigger: "system, on Case close"
        actor: system
        preconditions: []
        side_effects: []
      - from: SERVICES_PENDING
        to: CLOSED
        trigger: "system, on Case close"
        actor: system
        preconditions: []
        side_effects: []
      - from: SERVICES_ACTIVE
        to: CLOSED
        trigger: "system, on Case close"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /investigations (case_id=this case)"
        actor: Caseworker
        preconditions:
          - "case.status == OPEN"
        side_effects:
          - "create Investigation (status IN_PROGRESS) bound to this case"
      - from: UNDER_INVESTIGATION
        to: READY_FOR_CLOSURE
        trigger: "system, on Investigation dispose"
        actor: system
        preconditions:
          - "case.status == UNDER_INVESTIGATION"
          - "the disposed Investigation belongs to this case"
        side_effects:
          - "cascade link B: transition subject Client UNDER_INVESTIGATION -> SERVICES_PENDING (link C)"
      - from: READY_FOR_CLOSURE
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: Supervisor
        preconditions:
          - "case.status == READY_FOR_CLOSURE"
          - "if case.estimated_exposure_cents >= 5000000 then case.cross_report_agency is not null"
        side_effects:
          - "set case.closed_at = current_clock, case.closure_reason from body"
          - "cascade: for each EmergencyPlacement in this case with status==ACTIVE, discharge it (ACTIVE -> DISCHARGED)"
          - "cascade: for each FinancialFreeze in this case with status==ACTIVE, lift it (ACTIVE -> LIFTED)"
          - "if case.service_plan_status == ACTIVE set it to TERMINATED"
          - "transition subject Client -> CLOSED; decrement Client.open_case_count by 1"

  - entity: Investigation
    initial_state: IN_PROGRESS
    terminal_states: [DISPOSED]
    transitions:
      - from: IN_PROGRESS
        to: FINDINGS_SUBMITTED
        trigger: "POST /investigations/{id}/submit-findings"
        actor: Caseworker
        preconditions:
          - "investigation.status == IN_PROGRESS"
          - "the subject Client.comprehensive_risk_score is not null (a COMPREHENSIVE risk assessment exists)"
        side_effects:
          - "set investigation.finding_summary from body"
      - from: FINDINGS_SUBMITTED
        to: IN_PROGRESS
        trigger: "POST /investigations/{id}/return"
        actor: Supervisor
        preconditions:
          - "investigation.status == FINDINGS_SUBMITTED"
        side_effects:
          - "increment investigation.return_count by 1"
        note: "revision cycle: findings bounced back to the caseworker"
      - from: FINDINGS_SUBMITTED
        to: DISPOSED
        trigger: "POST /investigations/{id}/dispose"
        actor: Supervisor
        preconditions:
          - "investigation.status == FINDINGS_SUBMITTED"
        side_effects:
          - "set investigation.disposition from body, investigation.disposed_at = current_clock"
          - "cascade link A -> B: transition owning Case UNDER_INVESTIGATION -> READY_FOR_CLOSURE"

  - entity: EmergencyPlacement
    initial_state: ACTIVE
    terminal_states: [DISCHARGED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /placements/{id}/discharge (or cascade from Case close)"
        actor: Caseworker
        preconditions:
          - "placement.status == ACTIVE"
        side_effects:
          - "set placement.discharged_at = current_clock"
          - "increment Facility.available_beds by 1 (occupied_beds decreases by 1)"
          - "recompute Client.placement_status (NONE if no other ACTIVE placement)"
        note: "cascade link B of the close cascade (Case -> Placement -> Facility)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /placements/{id}/review when not court_authorized and current_clock >= expires_at"
        actor: Supervisor
        preconditions:
          - "placement.status == ACTIVE"
          - "placement.court_authorized == false"
          - "current_clock >= placement.expires_at"
        side_effects:
          - "set placement.discharged_at = current_clock"
          - "increment Facility.available_beds by 1"
          - "recompute Client.placement_status"

  - entity: FinancialAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /freezes (account_id=this account)"
        actor: Caseworker
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "set account.frozen_amount_cents = account.total_balance_cents, account.available_balance_cents = 0"
          - "set account.flagged_amount_cents = freeze.flagged_amount_cents"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /freezes/{id}/lift (or cascade from Case close)"
        actor: Supervisor
        preconditions:
          - "account.status == FROZEN"
        side_effects:
          - "set account.frozen_amount_cents = 0, account.available_balance_cents = account.total_balance_cents, account.flagged_amount_cents = 0"
        note: "ACTIVE <-> FROZEN toggle allows repeated freeze/unfreeze cycles"

concurrency_rules:
  - rule_id: risk-assessment-supersede-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{id}/risk-assessments"
    occ_field: "expected_client_version"
    description: |
      Submitting a COMPREHENSIVE risk assessment against a Client whose version
      has advanced since the client last observed it is rejected. A comprehensive
      assessment supersedes the prior authoritative risk_level for the client (and
      mirrors onto the open Case), so a writer holding a stale view of the client
      must be rejected on a stale-version check rather than silently overwriting a
      newer authoritative assessment.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

calculations:
  - name: risk_score
    trigger: "POST /clients/{id}/risk-assessments (both variants); result stored on the Client"
    algorithm: weighted_scoring
    formula: |
      raw = 10*isolation_level
          + 12*cognitive_impairment_level
          + 9*financial_vulnerability_level
          + 8*caregiver_dependency_level
          + 4*min(prior_report_count, 5)
      score = min(raw, 100)              # integer, capped at 100
      risk_level = HIGH      if score >= 70
                 = MODERATE  if 40 <= score < 70
                 = LOW       if score < 40
      # evaluation order is fixed: compute raw, then cap, then tier.
    input_set: "the four *_level factors (each an integer 0..3) plus prior_report_count (integer >= 0) supplied in the request body"
    constants:
      W_ISOLATION: 10
      W_COGNITIVE: 12
      W_FINANCIAL_VULN: 9
      W_CAREGIVER_DEP: 8
      W_PRIOR_REPORT: 4
      PRIOR_REPORT_CAP: 5
      SCORE_CAP: 100
      HIGH_THRESHOLD: 70
      MODERATE_THRESHOLD: 40
    precision: "integer arithmetic; no rounding; boundary is inclusive (score == 70 is HIGH)"
    variants:
      - name: PRELIMINARY
        when: "assessment_type == PRELIMINARY (intake screening, reporter-supplied factors)"
        difference: "stored into Client.preliminary_risk_score; does NOT set Client.risk_level and does NOT mirror to the Case"
      - name: COMPREHENSIVE
        when: "assessment_type == COMPREHENSIVE (post-investigation, caseworker-verified factors)"
        difference: "stored into Client.comprehensive_risk_score AND becomes the authoritative Client.risk_level, mirrored onto the open Case.risk_level; only this variant bumps Client.version under OCC"

  - name: financial_exposure
    trigger: "recomputed on every FinancialFreeze create/lift and Case recover-funds; stored on the Case"
    algorithm: aggregation
    formula: |
      # ESTIMATED variant
      estimated_exposure_cents = sum( account.total_balance_cents
                                      for account in accounts_with_ACTIVE_freeze_in_case )
      # SUBSTANTIATED variant
      substantiated_exposure_cents = sum( freeze.flagged_amount_cents
                                          for freeze in ACTIVE_freezes_in_case )
    input_set: "ESTIMATED sums full balances of accounts that currently hold an ACTIVE freeze in this case; SUBSTANTIATED sums flagged_amount_cents over ACTIVE freezes in this case. Both exclude LIFTED freezes."
    constants:
      MANDATORY_CROSS_REPORT_THRESHOLD_CENTS: 5000000
    precision: "integer cents; no rounding"
    variants:
      - name: ESTIMATED
        when: "projected worst-case exposure at freeze time"
        difference: "uses the whole account balance (total_balance_cents); gates the mandatory cross-report at close when >= 5000000"
      - name: SUBSTANTIATED
        when: "verified exploited amount"
        difference: "uses only freeze.flagged_amount_cents; is typically strictly less than ESTIMATED for the same accounts"

  - name: fund_recovery_distribution
    trigger: "POST /cases/{id}/recover-funds"
    algorithm: waterfall_allocation
    formula: |
      accounts = accounts with an ACTIVE freeze in this case,
                 ordered by created_at ASC (ties broken by created_at only; id is never used)
      total_flagged = sum(a.flagged_amount_cents for a in accounts)
      for a in accounts:
        share[a] = round_half_up( recovered_amount_cents * a.flagged_amount_cents / total_flagged )
      # ORDER IS PINNED: round each per-account share first, THEN sum.
      remainder = recovered_amount_cents - sum(share[a] for a in accounts)
      # allocate the whole remainder to the account with the largest flagged_amount_cents;
      # tie-break: earliest created_at (never id).
      target = argmax_by(flagged_amount_cents, tie_break=created_at ASC)
      share[target] += remainder
      for a in accounts: a.restitution_cents += share[a]; a.available_balance_cents += share[a]
    input_set: "recovered_amount_cents (> 0) from the request body, distributed across accounts with an ACTIVE freeze in the case"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; per-account round_half_up THEN sum; remainder to largest flagged (tie: earliest created_at)"

  - name: response_deadline
    trigger: "computed at POST /reports; stored as report.response_due_at"
    algorithm: threshold
    formula: |
      sla_hours = 24   if priority == EMERGENCY
                = 72   if priority == PRIORITY
                = 240  if priority == ROUTINE
      response_due_at = created_at + sla_hours hours
      # at screen time: screening_overdue = (current_clock > response_due_at)   # strict >
    input_set: "report.priority and report.created_at; the logical clock at screen time"
    constants:
      SLA_EMERGENCY_HOURS: 24
      SLA_PRIORITY_HOURS: 72
      SLA_ROUTINE_HOURS: 240
    precision: "datetime arithmetic in whole hours; overdue boundary is strict (equal instant is NOT overdue)"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc has same auth"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body id (report, client, account, facility, case, investigation, placement, freeze) resolves to a stored entity, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying an id"
  - priority: 4
    category: business_constraint
    check: "request body is well-formed: required fields present, correct JSON types"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: business_constraint
    check: "enum-typed fields carry a declared member (reporter_type, priority, decision, disposition, assessment_type, determination); allegation_types non-empty"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "writes with enum/array inputs"
  - priority: 6
    category: business_temporal
    check: "interval inputs are well-ordered: end_at strictly after start_at (placements), freeze_end strictly after freeze_start (freezes)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /placements, POST /freezes"
  - priority: 7
    category: state
    check: "target entity is in a state that admits the requested transition (report RECEIVED to screen; investigation FINDINGS_SUBMITTED to dispose/return; case READY_FOR_CLOSURE to close; placement ACTIVE to discharge/review; freeze ACTIVE to lift; guardianship referral requires case not CLOSED)"
    error_id: "ERR_<CONTEXT>_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "expected_client_version equals the current Client.version (OCC) on COMPREHENSIVE risk-assessment create"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /clients/{id}/risk-assessments"
  - priority: 9
    category: business_referential
    check: "submit-findings requires the subject Client.comprehensive_risk_score is not null"
    error_id: ERR_COMPREHENSIVE_ASSESSMENT_REQUIRED
    http_status: 409
    applies_to: "POST /investigations/{id}/submit-findings"
  - priority: 10
    category: business_safety
    check: "EmergencyPlacement create requires the subject Client is eligible: capacity_status == IMPAIRED OR risk_level == HIGH"
    error_id: ERR_CLIENT_NOT_ELIGIBLE_FOR_PLACEMENT
    http_status: 422
    applies_to: "POST /placements"
  - priority: 11
    category: business_safety
    check: "guardianship referral requires the subject Client.capacity_status == IMPAIRED"
    error_id: ERR_CAPACITY_NOT_IMPAIRED
    http_status: 422
    applies_to: "POST /cases/{id}/refer-guardianship"
  - priority: 12
    category: business_referential
    check: "FinancialFreeze create requires the Case allegation_types include FINANCIAL_EXPLOITATION and Case.status == UNDER_INVESTIGATION"
    error_id: ERR_NOT_FINANCIAL_EXPLOITATION
    http_status: 422
    applies_to: "POST /freezes"
  - priority: 13
    category: state
    check: "FinancialFreeze create requires the target account.status == ACTIVE (not already frozen)"
    error_id: ERR_ACCOUNT_ALREADY_FROZEN
    http_status: 409
    applies_to: "POST /freezes"
  - priority: 14
    category: business_temporal
    check: "FinancialFreeze create requires freeze_start >= (freeze_end of the most recent prior freeze on the same account) + 24h buffer; closed-interval semantics with a mandatory cool-down"
    error_id: ERR_FREEZE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /freezes"
  - priority: 15
    category: business_temporal
    check: "EmergencyPlacement create requires an available bed at the facility for the half-open interval [start_at, end_at): count of ACTIVE placements whose [start_at,end_at) overlaps must be < facility.total_beds; adjacency (end==next start) does not overlap"
    error_id: ERR_NO_BED_AVAILABLE
    http_status: 409
    applies_to: "POST /placements"
  - priority: 16
    category: business_fiscal
    check: "recover-funds requires recovered_amount_cents > 0 and at least one ACTIVE freeze in the case; flagged amount on freeze must not exceed the account total_balance_cents"
    error_id: ERR_NO_ACTIVE_FREEZE
    http_status: 409
    applies_to: "POST /cases/{id}/recover-funds"
  - priority: 17
    category: business_constraint
    check: "close requires a cross-report already filed when estimated_exposure_cents >= 5000000 (mandatory cross-report threshold)"
    error_id: ERR_CROSS_REPORT_REQUIRED
    http_status: 422
    applies_to: "POST /cases/{id}/close"

endpoints:
  # ---- Reports ----
  - method: POST
    path: "/reports"
    description: "File an intake report about an alleged victim"
    roles: [IntakeWorker]
    code: 201
    input: [client_id, reporter_type, allegation_types, priority, narrative, "reporter_name?"]
    output: Report
    side_effects: ["compute response_due_at via response_deadline", "status = RECEIVED"]
  - method: GET
    path: "/reports/{id}"
    description: "Fetch one report"
    roles: [IntakeWorker, Supervisor, Caseworker]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: GET
    path: "/reports"
    description: "List reports, optionally filtered by client_id or status"
    roles: [IntakeWorker, Supervisor]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: POST
    path: "/reports/{id}/screen"
    description: "Screen a report in or out (branch fork)"
    roles: [Supervisor]
    code: 200
    input: [decision, "screen_out_reason?"]
    output: Report
    side_effects: ["SCREEN_IN: create Case, set report.case_id, transition Client, increment open_case_count", "SCREEN_OUT: set screen_out_reason", "set screening_overdue"]

  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "Create a client (alleged victim) record"
    roles: [IntakeWorker]
    code: 201
    input: [full_name, date_of_birth, address]
    output: Client
    side_effects: ["capacity_status = UNKNOWN", "status = INTAKE"]
  - method: GET
    path: "/clients/{id}"
    description: "Fetch one client"
    roles: [IntakeWorker, Supervisor, Caseworker]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{id}/capacity-determination"
    description: "Record a decisional-capacity determination"
    roles: [Caseworker]
    code: 200
    input: [determination]
    output: Client
    side_effects: ["set capacity_status to INTACT or IMPAIRED", "increments Client.version by 1"]
  - method: POST
    path: "/clients/{id}/risk-assessments"
    description: "Submit a PRELIMINARY or COMPREHENSIVE risk assessment (OCC-guarded)"
    roles: [Caseworker]
    code: 200
    input: [assessment_type, isolation_level, cognitive_impairment_level, financial_vulnerability_level, caregiver_dependency_level, prior_report_count, expected_client_version]
    output: Client
    side_effects: ["compute risk_score for the variant", "PRELIMINARY: set preliminary_risk_score", "COMPREHENSIVE: set comprehensive_risk_score, risk_level, mirror Case.risk_level", "increments Client.version by 1"]

  # ---- Financial accounts ----
  - method: POST
    path: "/accounts"
    description: "Register a client financial account"
    roles: [IntakeWorker, Caseworker]
    code: 201
    input: [client_id, institution_name, total_balance_cents]
    output: FinancialAccount
    side_effects: ["available_balance_cents = total_balance_cents", "status = ACTIVE"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch one financial account"
    roles: [Caseworker, Supervisor]
    code: 200
    input: []
    output: FinancialAccount
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List financial accounts, optionally filtered by client_id"
    roles: [Caseworker, Supervisor]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: FinancialAccount[]
    side_effects: []

  # ---- Facilities ----
  - method: POST
    path: "/facilities"
    description: "Create a placement facility with a bed capacity"
    roles: [Admin]
    code: 201
    input: [name, total_beds]
    output: Facility
    side_effects: ["available_beds = total_beds", "occupied_beds = 0"]
  - method: GET
    path: "/facilities/{id}"
    description: "Fetch one facility (bed counts)"
    roles: [Admin, Caseworker, Supervisor]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ---- Cases ----
  - method: GET
    path: "/cases/{id}"
    description: "Fetch one case"
    roles: [Caseworker, Supervisor, IntakeWorker]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases, optionally filtered by report_id, client_id or status"
    roles: [Caseworker, Supervisor]
    code: 200
    input: ["report_id?", "client_id?", "status?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/close"
    description: "Close a case (cascades to placements, freezes, service plan)"
    roles: [Supervisor]
    code: 200
    input: [closure_reason]
    output: Case
    side_effects: ["discharge ACTIVE placements -> release beds", "lift ACTIVE freezes -> unfreeze accounts", "terminate ACTIVE service plan", "transition Client -> CLOSED, decrement open_case_count"]
  - method: POST
    path: "/cases/{id}/cross-report"
    description: "Cross-report the case to an external agency (law enforcement, LTC ombudsman)"
    roles: [Caseworker, Supervisor]
    code: 200
    input: [recipient_agency]
    output: Case
    side_effects: ["set cross_report_agency, cross_reported_at = current_clock"]
  - method: POST
    path: "/cases/{id}/recover-funds"
    description: "Distribute recovered funds across frozen accounts (fund_recovery_distribution)"
    roles: [Supervisor]
    code: 200
    input: [recovered_amount_cents]
    output: Case
    side_effects: ["per-account round_half_up share, remainder to largest flagged (tie: earliest created_at)", "increment account.restitution_cents and account.available_balance_cents"]
  - method: POST
    path: "/cases/{id}/refer-guardianship"
    description: "File a capacity/guardianship referral for the subject client"
    roles: [Caseworker]
    code: 200
    input: []
    output: Case
    side_effects: ["set guardianship_status = REFERRED (requires Client.capacity_status == IMPAIRED)"]
  - method: POST
    path: "/cases/{id}/service-plan"
    description: "Create the service plan and link benefit programs"
    roles: [Caseworker]
    code: 200
    input: [benefit_programs]
    output: Case
    side_effects: ["set service_plan_status = ACTIVE, benefit_programs", "transition Client SERVICES_PENDING -> SERVICES_ACTIVE"]

  # ---- Investigations ----
  - method: POST
    path: "/investigations"
    description: "Open an investigation on an OPEN case"
    roles: [Caseworker]
    code: 201
    input: [case_id]
    output: Investigation
    side_effects: ["status = IN_PROGRESS", "set assigned_caseworker_id from X-User-ID", "transition Case OPEN -> UNDER_INVESTIGATION"]
  - method: GET
    path: "/investigations/{id}"
    description: "Fetch one investigation"
    roles: [Caseworker, Supervisor]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: GET
    path: "/investigations"
    description: "List investigations, optionally filtered by case_id"
    roles: [Caseworker, Supervisor]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
  - method: POST
    path: "/investigations/{id}/submit-findings"
    description: "Submit findings (requires a comprehensive risk assessment)"
    roles: [Caseworker]
    code: 200
    input: [finding_summary]
    output: Investigation
    side_effects: ["status IN_PROGRESS -> FINDINGS_SUBMITTED", "set finding_summary"]
  - method: POST
    path: "/investigations/{id}/return"
    description: "Return findings for re-investigation (revision cycle)"
    roles: [Supervisor]
    code: 200
    input: [return_reason]
    output: Investigation
    side_effects: ["status FINDINGS_SUBMITTED -> IN_PROGRESS", "increment return_count"]
  - method: POST
    path: "/investigations/{id}/dispose"
    description: "Dispose the investigation with a final disposition"
    roles: [Supervisor]
    code: 200
    input: [disposition]
    output: Investigation
    side_effects: ["status FINDINGS_SUBMITTED -> DISPOSED", "cascade: Case -> READY_FOR_CLOSURE -> Client SERVICES_PENDING"]

  # ---- Risk assessment reverse-reachability handled on Client ----

  # ---- Placements ----
  - method: POST
    path: "/placements"
    description: "Create an emergency protective placement"
    roles: [Caseworker]
    code: 201
    input: [case_id, facility_id, start_at, end_at, "court_authorized?"]
    output: EmergencyPlacement
    side_effects: ["status = ACTIVE", "set client_id from case", "decrement Facility.available_beds", "Client.placement_status = PLACED", "compute expires_at"]
  - method: GET
    path: "/placements/{id}"
    description: "Fetch one placement"
    roles: [Caseworker, Supervisor]
    code: 200
    input: []
    output: EmergencyPlacement
    side_effects: []
  - method: GET
    path: "/placements"
    description: "List placements, optionally filtered by case_id, facility_id or client_id"
    roles: [Caseworker, Supervisor]
    code: 200
    input: ["case_id?", "facility_id?", "client_id?", "limit?", "offset?"]
    output: EmergencyPlacement[]
    side_effects: []
  - method: POST
    path: "/placements/{id}/discharge"
    description: "Discharge an active placement"
    roles: [Caseworker]
    code: 200
    input: []
    output: EmergencyPlacement
    side_effects: ["status ACTIVE -> DISCHARGED", "increment Facility.available_beds", "recompute Client.placement_status"]
  - method: POST
    path: "/placements/{id}/review"
    description: "Review an active placement; expire it if past the 72h emergency cap without court authorization"
    roles: [Supervisor]
    code: 200
    input: []
    output: EmergencyPlacement
    side_effects: ["if not court_authorized and current_clock >= expires_at: ACTIVE -> EXPIRED, increment Facility.available_beds"]

  # ---- Freezes ----
  - method: POST
    path: "/freezes"
    description: "Place a financial-exploitation freeze on a client account"
    roles: [Caseworker, Supervisor]
    code: 201
    input: [case_id, account_id, flagged_amount_cents, freeze_start, freeze_end]
    output: FinancialFreeze
    side_effects: ["status = ACTIVE", "account -> FROZEN, frozen_amount = total_balance, available = 0, flagged_amount set", "increment Case.frozen_account_count", "recompute Case exposures"]
  - method: GET
    path: "/freezes/{id}"
    description: "Fetch one freeze"
    roles: [Caseworker, Supervisor]
    code: 200
    input: []
    output: FinancialFreeze
    side_effects: []
  - method: GET
    path: "/freezes"
    description: "List freezes, optionally filtered by case_id or account_id"
    roles: [Caseworker, Supervisor]
    code: 200
    input: ["case_id?", "account_id?", "limit?", "offset?"]
    output: FinancialFreeze[]
    side_effects: []
  - method: POST
    path: "/freezes/{id}/lift"
    description: "Lift an active freeze"
    roles: [Supervisor]
    code: 200
    input: []
    output: FinancialFreeze
    side_effects: ["status ACTIVE -> LIFTED", "account -> ACTIVE, frozen_amount = 0, available = total_balance", "decrement Case.frozen_account_count", "recompute Case exposures"]

  # ---- Clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (test-driving). Server startup default is 2026-03-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set the logical clock used by response_deadline, placement expiry, cross_reported_at, closed_at, etc."]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "authenticated role is not permitted for this endpoint"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "report id does not resolve"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client id does not resolve"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "financial account id does not resolve"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility id does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "case id does not resolve"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "investigation id does not resolve"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement id does not resolve"
  - id: ERR_FREEZE_NOT_FOUND
    http: 404
    condition: "freeze id does not resolve"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field or wrong JSON type"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "enum-typed field carries a non-member value, or allegation_types is empty"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "end_at not strictly after start_at, or freeze_end not strictly after freeze_start"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "screen attempted on a report whose status != RECEIVED"
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "case operation from a disallowed status (open investigation when case != OPEN; close when case != READY_FOR_CLOSURE; refer-guardianship/service-plan/cross-report/recover-funds on a CLOSED case)"
  - id: ERR_INVESTIGATION_INVALID_STATE
    http: 409
    condition: "submit-findings when != IN_PROGRESS; return/dispose when != FINDINGS_SUBMITTED"
  - id: ERR_PLACEMENT_INVALID_STATE
    http: 409
    condition: "discharge/review a placement whose status != ACTIVE"
  - id: ERR_FREEZE_INVALID_STATE
    http: 409
    condition: "lift a freeze whose status != ACTIVE"
  - id: ERR_ACCOUNT_ALREADY_FROZEN
    http: 409
    condition: "freeze create against an account whose status == FROZEN"
  - id: ERR_STALE_CLIENT_VERSION
    http: 412
    condition: "expected_client_version != current Client.version on risk-assessment create"
  - id: ERR_COMPREHENSIVE_ASSESSMENT_REQUIRED
    http: 409
    condition: "submit-findings when the subject Client.comprehensive_risk_score is null"
  - id: ERR_CLIENT_NOT_ELIGIBLE_FOR_PLACEMENT
    http: 422
    condition: "placement create when subject Client is neither capacity IMPAIRED nor risk_level HIGH"
  - id: ERR_CAPACITY_NOT_IMPAIRED
    http: 422
    condition: "refer-guardianship when subject Client.capacity_status != IMPAIRED"
  - id: ERR_NOT_FINANCIAL_EXPLOITATION
    http: 422
    condition: "freeze create when case lacks FINANCIAL_EXPLOITATION allegation or case.status != UNDER_INVESTIGATION"
  - id: ERR_FREEZE_WINDOW_OVERLAP
    http: 409
    condition: "freeze_start falls within 24h after the most recent prior freeze's freeze_end on the same account"
  - id: ERR_NO_BED_AVAILABLE
    http: 409
    condition: "no free bed at the facility for the requested [start_at, end_at) interval"
  - id: ERR_NO_ACTIVE_FREEZE
    http: 409
    condition: "recover-funds with recovered_amount_cents <= 0 or no ACTIVE freeze in the case"
  - id: ERR_CROSS_REPORT_REQUIRED
    http: 422
    condition: "close a case with estimated_exposure_cents >= 5000000 and no cross-report filed"

roles:
  - name: IntakeWorker
    description: "Front-door staff: file reports, register clients and their financial accounts"
    identity: "opaque"
    exclusive_operations:
      - "POST /reports"
      - "POST /clients"
    shared_operations:
      - "POST /accounts (with Caseworker)"
      - "GET reads on reports, clients, cases"
  - name: Caseworker
    description: "Investigator: opens investigations, assesses risk/capacity, places clients, freezes accounts, plans services"
    identity: "opaque"
    exclusive_operations:
      - "POST /investigations"
      - "POST /investigations/{id}/submit-findings"
      - "POST /clients/{id}/capacity-determination"
      - "POST /clients/{id}/risk-assessments"
      - "POST /placements"
      - "POST /placements/{id}/discharge"
      - "POST /cases/{id}/refer-guardianship"
      - "POST /cases/{id}/service-plan"
    shared_operations:
      - "POST /accounts (with IntakeWorker)"
      - "POST /freezes (with Supervisor)"
      - "POST /cases/{id}/cross-report (with Supervisor)"
      - "GET reads on cases, investigations, accounts, placements, freezes, facilities"
  - name: Supervisor
    description: "Approval authority: screens reports, disposes/returns findings, closes cases, lifts freezes, expires placements, recovers funds"
    identity: "opaque"
    exclusive_operations:
      - "POST /reports/{id}/screen"
      - "POST /investigations/{id}/return"
      - "POST /investigations/{id}/dispose"
      - "POST /cases/{id}/close"
      - "POST /cases/{id}/recover-funds"
      - "POST /freezes/{id}/lift"
      - "POST /placements/{id}/review"
    shared_operations:
      - "POST /freezes (with Caseworker)"
      - "POST /cases/{id}/cross-report (with Caseworker)"
      - "GET reads on reports, cases, investigations, accounts, placements, freezes, facilities"
  - name: Admin
    description: "System operator: provisions facilities and controls the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /facilities"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /facilities/{id}"

