            - "RunPlan.${rp_id}.run_status == READINESS_PENDING after the trigger"
            - "the cascade flips TerminalServiceWindow.${win_id}.window_status to REQUESTED and drives Terminal.${t_phx}.reserved_apron_units to 0 with no direct window call"
            - "ShipperCommitment.${com_id}.remaining_slots stays 4, because a requeued run still holds its slot"

      - name: derived_field_reconciliation_of_carrier_incident_band
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Carrier.fields.incident_band
          - calculations.safe_stop_fee.constants.HEALTH_WATCH
          - endpoints.POST_/ledger-checkpoints/{id}/roll-over
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Carrier.incident_band is a denormalised band recomputed from recordable_incidents_last_epoch, and the band is what the safe-stop exposure multiplies: adding a second recordable incident recomputes the band to WATCH, which changes safe_stop_fee_cents for a monitoring window created afterwards but not one already written."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted. Carrier AURORA is ACTIVE with incident_band CLEAN and one recordable incident."
