  - rule_id: boundary_precision_check
    instances:
      - name: admission_posture_flips_at_exactly_zero_available_beds
        grounds:
          - calculations.care_unit_bed_availability
          - calculations.care_unit_operational_posture
          - validations[priority=72,ERR_UNIT_POSTURE_BLOCKED]
          - errors.ERR_UNIT_POSTURE_BLOCKED
        distinguishing_aspect: |
          The posture threshold is available_bed_count <= 0, so a 2-bed unit stays OPEN at
          available 1 and flips to RESTRICTED at exactly available 0. The third admission must fail
          with ERR_UNIT_POSTURE_BLOCKED. An off-by-one that flips at available 1 rejects the second
          admission; one that flips at available -1 lets the third admission through and oversells
          the unit.
