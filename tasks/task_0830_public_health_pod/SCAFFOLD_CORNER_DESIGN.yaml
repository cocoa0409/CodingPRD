          assert:
            - "pods_restricted == 1"
            - "readiness == 'RED'  (pods_restricted_count >= 1 forces RED regardless of staffing_fill_rate_pct)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: dispensing_event_defer_missing_reason_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]"]
        distinguishing_aspect: "Deferring a SCREENED DispensingEvent without a deferral_reason is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["DispensingEvent progressed to SCREENED"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Defer Reason Plan", jurisdiction_code: "CTY30", target_population: 1100 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Defer Reason POD", site_type: FIXED_POD, address: "31 Defer St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Defer Reason Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Defer Staffer", email: "deferstaffer@example.org", primary_role: SCREENER, mrc_unit: "UnitQ", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Defer", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de_id: $.data.id }
            - call: "POST /dispensing-events/${de_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
          trigger:
            - call: "POST /dispensing-events/${de_id}/defer"
              payload: { deferral_reason: "" }
              as: ClinicalLead
              captures: { defer_error: $.data.error_id }
          assert:
            - "defer_error == 'ERR_VALIDATION'  (deferral_reason is empty)"

      - name: shift_assignment_invalid_time_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]"]
        distinguishing_aspect: "Creating a ShiftAssignment with end_time not strictly after start_time is rejected with ERR_INVALID_TIME_RANGE."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; POD OPERATIONAL; StaffMember exists"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Time Range Plan", jurisdiction_code: "CTY31", target_population: 900 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Time Range POD", site_type: FIXED_POD, address: "32 Time St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Time Range Staffer", email: "timerangestaffer@example.org", primary_role: RUNNER, mrc_unit: "UnitR", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: RUNNER, start_time: "2026-03-10T16:00:00Z", end_time: "2026-03-10T08:00:00Z" }
              as: PublicHealthAdmin
              captures: { create_error: $.data.error_id }
          assert:
            - "create_error == 'ERR_INVALID_TIME_RANGE'  (end_time 08:00 is before start_time 16:00 on the same day)"

      - name: allocation_request_invalid_source_configuration_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]"]
        distinguishing_aspect: "Creating an AllocationRequest with source_type=SNS_CACHE but a non-null partner_pod_id is rejected with ERR_INVALID_SOURCE_CONFIGURATION."
        test_recipe:
          setup: ["Two PODs under an activated plan; Countermeasure exists"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Source Config Plan", jurisdiction_code: "CTY32", target_population: 850 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Source Config POD", site_type: FIXED_POD, address: "33 Source St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id, pod_v: $.data.version }
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Source Config Other POD", site_type: FIXED_POD, address: "34 Source St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { other_pod_id: $.data.id }
            - call: "POST /countermeasures"
              payload: { name: "Source Config Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, partner_pod_id: "${other_pod_id}", requested_quantity: 10, expected_pod_version: "${pod_v}" }
              as: LogisticsCoordinator
              captures: { create_error: $.data.error_id }
          assert:
            - "create_error == 'ERR_INVALID_SOURCE_CONFIGURATION'  (source_type SNS_CACHE requires partner_pod_id to be null)"

      - name: inventory_lot_invalid_expiration_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]"]
        distinguishing_aspect: "Creating an InventoryLot whose expiration_date is not strictly after the current clock time is rejected with ERR_INVALID_EXPIRATION."
        test_recipe:
          setup: ["clock advanced to 2026-04-01T00:00:00Z; Countermeasure exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Expired Lot Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-EXPIRED1", on_hand_quantity: 50, expiration_date: "2026-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { create_error: $.data.error_id }
          assert:
            - "create_error == 'ERR_INVALID_EXPIRATION'  (expiration_date 2026-01-01 is before the clock 2026-04-01, not strictly after)"

      - name: hazard_plan_stand_down_blocked_by_open_pod
        claim_type: cross_entity_validation
        grounds: ["validations[priority=17]", state_machines.HazardPlan.ACTIVATED_to_STOOD_DOWN]
        distinguishing_aspect: "Standing down a HazardPlan while a child POD is still OPERATIONAL (not CLOSED) is rejected with ERR_POD_NOT_READY_FOR_STAND_DOWN — the HazardPlan<->POD cross-entity pair, distinct from the pairs exercised in the difficulty design."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; POD OPERATIONAL (not CLOSED)"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Stand Down Blocked Plan", jurisdiction_code: "CTY33", target_population: 700 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Stand Down POD", site_type: FIXED_POD, address: "35 Stand St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
          trigger:
            - call: "POST /hazard-plans/${hp_id}/stand_down"
              payload: {}
              as: PublicHealthAdmin
              captures: { stand_down_error: $.data.error_id }
          assert:
            - "stand_down_error == 'ERR_POD_NOT_READY_FOR_STAND_DOWN'  (POD.operational_status is OPERATIONAL, not CLOSED)"

      - name: pod_close_blocked_by_checked_in_staff
        claim_type: violation_to_error
        grounds: ["validations[priority=18]"]
        distinguishing_aspect: "Closing a POD while a ShiftAssignment is CHECKED_IN there is rejected with ERR_POD_STAFF_ONSITE."
        test_recipe:
          setup: ["HazardPlan ACTIVATED; POD OPERATIONAL; one CHECKED_IN ShiftAssignment"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Staff Onsite Plan", jurisdiction_code: "CTY34", target_population: 650 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Staff Onsite POD", site_type: FIXED_POD, address: "36 Onsite St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Onsite Staffer", email: "onsitestaffer@example.org", primary_role: VACCINATOR, mrc_unit: "UnitS", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /staff-members/${staff_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: VACCINATOR, start_time: "2026-03-11T08:00:00Z", end_time: "2026-03-11T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /shift-assignments/${sa_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments/${sa_id}/check_in"
              payload: {}
              as: ClinicalLead
          trigger:
            - call: "POST /pods/${pod_id}/close"
              payload: {}
              as: PublicHealthAdmin
              captures: { close_error: $.data.error_id }
          assert:
            - "close_error == 'ERR_POD_STAFF_ONSITE'  (a ShiftAssignment at this POD is CHECKED_IN)"

      - name: allocation_request_reserve_blocked_by_hazard_plan_not_activated
        claim_type: cross_entity_validation
        grounds: ["validations[priority=12]", state_machines.AllocationRequest.REQUESTED_to_RESERVED]
        distinguishing_aspect: "Reserving an AllocationRequest whose POD belongs to a HazardPlan still in DRAFT (never activated) is rejected — the AllocationRequest<->HazardPlan pair, exercised here via a plan that was never activated at all, distinct from the plan-was-activated-then-stood-down scenario referenced elsewhere."
        test_recipe:
          setup: ["HazardPlan created but left DRAFT; POD created under it (POD creation itself does not require ACTIVATED, only /open does — so POD stays STAGING); AllocationRequest created"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Never Activated Plan", jurisdiction_code: "CTY35", target_population: 600 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Never Activated POD", site_type: FIXED_POD, address: "37 Draft St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id, pod_v: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Draft Plan Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-M1", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_v: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 10, expected_pod_version: "${pod_v}" }
              as: LogisticsCoordinator
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests/${ar_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v}" }
              as: LogisticsCoordinator
              captures: { reserve_error: $.data.error_id }
          assert:
            - "reserve_error == 'ERR_HAZARD_PLAN_NOT_ACTIVATED'  (HazardPlan.status is DRAFT, never activated)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: dispensing_events_filtered_list_by_screened_by_staff_member_id
        claim_type: cross_reference_link
        grounds: [entities.DispensingEvent.screened_by_staff_member_id, endpoints.GET__dispensing-events]
        distinguishing_aspect: "GET /dispensing-events?screened_by_staff_member_id=... is the reverse-reachability channel for the screened_by_staff_member_id FK, returning only events that staff member screened."
        test_recipe:
          setup: ["Two DispensingEvents at the same POD, screened by two different StaffMembers"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Cross Ref Plan", jurisdiction_code: "CTY36", target_population: 550 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Cross Ref POD", site_type: FIXED_POD, address: "38 Ref St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Cross Ref Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Screener X", email: "screenerx@example.org", primary_role: SCREENER, mrc_unit: "UnitT", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_x_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Screener Y", email: "screenery@example.org", primary_role: SCREENER, mrc_unit: "UnitT", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_y_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant X", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_x_id}"
              captures: { de_x_id: $.data.id }
            - call: "POST /dispensing-events/${de_x_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_x_id}" }
              as: ClinicalLead
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Y", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_y_id}"
              captures: { de_y_id: $.data.id }
            - call: "POST /dispensing-events/${de_y_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_y_id}" }
              as: ClinicalLead
          trigger:
            - call: "GET /dispensing-events"
              payload: { screened_by_staff_member_id: "${staff_x_id}" }
              as: PublicHealthAdmin
              captures: { result_count: $.meta.total_count, first_id: "$.data[0].id" }
          assert:
            - "result_count == 1"
            - "first_id == de_x_id  (only the event screened by staff_x is returned, not staff_y's)"

      - name: inventory_lots_filtered_list_by_pod_and_countermeasure
        claim_type: standard_crud
        grounds: [entities.InventoryLot.pod_id, entities.InventoryLot.countermeasure_id, endpoints.GET__inventory-lots]
        distinguishing_aspect: "GET /inventory-lots supports combined pod_id and countermeasure_id filters in a single request, excluding lots for other PODs or the central cache."
        test_recipe:
          setup: ["A central-cache lot and a POD-scoped lot for the same countermeasure"]
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Filter Lot Plan", jurisdiction_code: "CTY37", target_population: 500 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Filter Lot POD", site_type: FIXED_POD, address: "39 Filter St", staffing_capacity_lanes: 2, lane_throughput_rate_per_hour: 10 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /countermeasures"
              payload: { name: "Filter Lot Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 300, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-CENTRAL", on_hand_quantity: 500, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { central_lot_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-POD", on_hand_quantity: 50, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { pod_lot_id: $.data.id }
          trigger:
            - call: "GET /inventory-lots"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}" }
              as: PublicHealthAdmin
              captures: { result_count: $.meta.total_count, first_id: "$.data[0].id" }
          assert:
            - "result_count == 1"
            - "first_id == pod_lot_id  (the central-cache lot, pod_id==null, is excluded)"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_ids_across_core_entities
        claim_type: violation_to_error
        grounds: ["errors[ERR_HAZARD_PLAN_NOT_FOUND]", "errors[ERR_POD_NOT_FOUND]", "errors[ERR_STAFF_MEMBER_NOT_FOUND]", "errors[ERR_SHIFT_ASSIGNMENT_NOT_FOUND]", "errors[ERR_COUNTERMEASURE_NOT_FOUND]", "errors[ERR_INVENTORY_LOT_NOT_FOUND]", "errors[ERR_ALLOCATION_REQUEST_NOT_FOUND]", "errors[ERR_DISPENSING_EVENT_NOT_FOUND]", "errors[ERR_DRILL_NOT_FOUND]", "errors[ERR_SITUATION_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "Every entity's not-found error is triggerable by referencing a well-formed but non-existent UUID, either via a direct GET or, for entities without a GET/{id} endpoint, via a body-FK reference on a create call."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /hazard-plans/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: PublicHealthAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /pods/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: PublicHealthAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /staff-members/00000000-0000-0000-0000-000000000003/verify-credential"
              payload: {}
              as: PublicHealthAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /shift-assignments/00000000-0000-0000-0000-000000000004/confirm"
              payload: {}
              as: ClinicalLead
              captures: { e4: $.data.error_id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "00000000-0000-0000-0000-000000000005", lot_number: "LOT-NF1", on_hand_quantity: 10, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { e5: $.data.error_id }
            - call: "GET /inventory-lots/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: PublicHealthAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /allocation-requests/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: PublicHealthAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /dispensing-events/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: PublicHealthAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /drills/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: PublicHealthAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /situation-reports/00000000-0000-0000-0000-000000000010"
              payload: {}
              as: PublicHealthAdmin
