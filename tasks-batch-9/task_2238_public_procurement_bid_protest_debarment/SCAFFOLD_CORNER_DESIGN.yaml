        claim_type: Triggerability
        grounds:
          - errors[ERR_PETITION_PREMATURE]
        excluded_because:
          difficulty_instance: reinstatement_petition_accepted_at_exactly_the_earliest_petition_instant
          rationale: "That §1.8 boundary instance accepts the petition at exactly reinstatement_earliest_petition_utc and rejects one millisecond earlier with ERR_PETITION_PREMATURE."

      - name: corner_error_standing_fee_and_stay_and_eligibility
        claim_type: Triggerability
        grounds:
          - errors[ERR_PROTESTER_LACKS_STANDING]
          - errors[ERR_INSUFFICIENT_FEE_BALANCE]
          - errors[ERR_AWARD_STAYED]
          - errors[ERR_VENDOR_NOT_ELIGIBLE]
          - errors[ERR_SOLICITATION_NOT_PROTESTABLE]
          - errors[ERR_PROTEST_UNTIMELY]
          - errors[ERR_RESPONSIBILITY_SCORE_BELOW_THRESHOLD]
        excluded_because:
          difficulty_instance: absent_standing_safety_error_precedes_insufficient_fee_fiscal_error
          rationale: "Standing and fee-balance failures are asserted by that §1.8 instance; ERR_SOLICITATION_NOT_PROTESTABLE and ERR_PROTEST_UNTIMELY by cancelled_solicitation_state_error_precedes_untimely_protest_temporal_error; ERR_VENDOR_NOT_ELIGIBLE by bid_creation_rejected_because_vendor_is_interim_suspended; ERR_AWARD_STAYED by award_execution_unblocked_only_because_the_protest_stay_was_overridden; ERR_RESPONSIBILITY_SCORE_BELOW_THRESHOLD by the composite-score gate exercised in the same §1.8 group."

  - section: endpoints
    instances:
      - name: corner_resolicit_creates_a_linked_draft_successor
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /procurement/solicitations/{id}/resolicit]
          - state_machines.Solicitation.CANCELLED_to_RESOLICITED
          - entities.Solicitation.fields.predecessor_solicitation_id
        distinguishing_aspect: "Resolicitation is a two-row outcome from one call: the predecessor moves CANCELLED -> RESOLICITED and a DRAFT successor appears carrying predecessor_solicitation_id and a copy of only the sequence-0 mandatory requirements, so the addendum-introduced requirement is NOT copied."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one ISSUED Solicitation SOL-2238-C41 with estimated_value_cents 10000000 and one original requirement REQ-BASE; addendum 1 introduced a second requirement REQ-ADD; the officer then cancelled the solicitation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/solicitations"
              payload:
                solicitation_number: "SOL-2238-C41"
                title: "Culvert Lining Package"
                issuing_agency_code: "DOT"
                estimated_value_cents: 10000000
                original_bid_due_utc: "2026-08-27T00:00:00Z"
