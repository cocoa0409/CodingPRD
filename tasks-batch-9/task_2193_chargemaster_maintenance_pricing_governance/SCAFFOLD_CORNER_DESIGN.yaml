          setup:
            - "Clock 2026-09-01; facility CCN-0001; revenue codes 0300 and 0301; department CC-100 (mgr_cath); COST_PLUS_MARKUP rule on 0300; items CDM-1001 (93458) and CDM-2002 (93460) both ACTIVE at 240000."
