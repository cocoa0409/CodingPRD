              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_stale: $.data.version }
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_stale}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_RETURN_VERSION"
            - "HTTP status == 412"

