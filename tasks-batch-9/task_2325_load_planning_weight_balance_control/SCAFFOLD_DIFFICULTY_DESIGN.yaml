  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: sheet_accept_cascade_release_load_notoc
        depth: 4
        trigger_transition: "LoadSheet ISSUED -> ACCEPTED (POST /load-sheets/{id}/accept)"
        chain:
          - "hop 0 (direct): LoadSheet.status ISSUED -> ACCEPTED and accepted_by_user_id set"
          - "hop 1 (caused by hop 0): because a sheet on this flight's plan reached ACCEPTED, Flight.load_release_state OPEN -> RELEASED"
          - "hop 2 (caused by hop 1): because the flight is now RELEASED, every CargoItem on it in ACCEPTED status with a non-null assigned_compartment_id moves ACCEPTED -> LOADED"
          - "hop 3 (caused by hop 2): because that CargoItem reached LOADED, every HazmatDeclaration on it in ACCEPTED status has notoc_issued set to true"
        grounds:
          - state_machines.LoadSheet.transitions.ISSUED_to_ACCEPTED
          - state_machines.Flight.dimension_load_release_state.transitions.OPEN_to_RELEASED
          - state_machines.CargoItem.transitions.ACCEPTED_to_LOADED
          - entities.HazmatDeclaration.fields.notoc_issued
        distinguishing_aspect: |
          Four entities deep and every hop is caused by the previous one, not by
          the original call: the NOTOC flag is not set by sheet acceptance, it is
          set by the cargo reaching LOADED, which itself only happens because the
          flight reached RELEASED. An unassigned but ACCEPTED consignment proves
          the chain is conditional at hop 2 - it stays ACCEPTED and its
          declaration's notoc_issued stays false.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and holds H1, H4; runway LSGG/04 with the [15,30) band; STANDARD program; one flight 10:00-12:30 UTC."
            - "Plan: OC 50 male / 6 child / 4 infant = 4650.00 kg, H1 1450.00 kg of bags, DG1 400.00 kg dangerous goods in H4 and CG2 300.00 kg general cargo in H4 -> base_payload_kg 6800.00."
            - "CG3 150.00 kg of general cargo is created and auto-accepted but never assigned to a compartment, and carries its own accepted dangerous-goods declaration; it must NOT be promoted to LOADED."
            - "DG1's and CG3's declarations are accepted by dg-01, then DG1 and CG3 are accepted by the ramp agent; the plan is computed and a sheet is issued by lc-01."
