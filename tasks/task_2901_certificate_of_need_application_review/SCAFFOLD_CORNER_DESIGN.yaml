      - name: recompute_need_run_twice_without_an_amendment_reproduces_the_same_figures
        claim_type: Conditional action
        grounds:
          - endpoints[POST /batching-cycles/{id}/recompute-need]
          - calculations.cycle_need_methodology
        distinguishing_aspect: "recompute-need is value-idempotent but not version-idempotent: two consecutive runs against an unamended formula leave every need figure identical (unmet 19, pin 1) while BatchingCycle.version increases by exactly 1 per call."
        test_recipe:
          setup:
            - "Cycle 1 in HSA-NORTH was created against formula version 1 with unmet_bed_need_at_open 19; nothing else has been written."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
