  - name: state_redundancy_test_failure_takes_the_plant_offline_and_closes_the_exhibit
    claim_type: Side Effect Execution
    grounds:
    - §1.2 LifeSupportSystem NORMAL -> OFFLINE
    - §1.2 LifeSupportSystem OFFLINE -> NORMAL
    - §1.2 Exhibit OPEN -> CLOSED
    - §1.2 Exhibit CLOSED -> OPEN
    - §1.3 exhibit_posture
    - §1.5 POST /aquarium/life-support-systems/{id}/redundancy-tests
    - §1.1 LifeSupportSystem.last_redundancy_test_at / last_redundancy_test_result
    distinguishing_aspect: A FAIL redundancy test writes last_redundancy_test_result FAIL WITHOUT touching last_redundancy_test_at, drives the plant to OFFLINE and closes the served exhibit with LSS_OFFLINE; the following PASS (no readings on file) returns the plant to NORMAL and the exhibit to OPEN with last_posture_reason null.
    test_recipe:
      setup:
      - One COLD_MARINE plant serving one exhibit; no water-quality readings at all; clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      trigger:
      - call: POST /aquarium/life-support-systems/${lss_id}/redundancy-tests
        payload: {performed_at: '2026-08-01T00:00:00Z', result: FAIL}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
      - call: POST /aquarium/life-support-systems/${lss_id}/redundancy-tests
        payload: {performed_at: '2026-08-01T00:00:00Z', result: PASS}
        as: AquaristTechnician
      - call: GET /aquarium/exhibits/${ex_id}
        payload: {}
        as: AquaristTechnician
      assert:
      - 'after FAIL: LifeSupportSystem.alarm_state == OFFLINE'
      - 'after FAIL: LifeSupportSystem.last_redundancy_test_result == FAIL and last_redundancy_test_at == null'
      - 'after FAIL: LifeSupportSystem.water_quality_index == 100.00 (no reading exists)'
      - 'after FAIL: Exhibit.posture == CLOSED and Exhibit.last_posture_reason == LSS_OFFLINE'
      - 'after FAIL: Exhibit.version == 2'
      - 'after PASS: LifeSupportSystem.alarm_state == NORMAL (the zero-reading recovery fork)'
      - 'after PASS: LifeSupportSystem.last_redundancy_test_at == 2026-08-01T00:00:00Z, last_redundancy_test_result == PASS, redundancy_overdue == false'
      - 'after PASS: Exhibit.posture == OPEN, Exhibit.last_posture_reason == null, Exhibit.version == 3'
