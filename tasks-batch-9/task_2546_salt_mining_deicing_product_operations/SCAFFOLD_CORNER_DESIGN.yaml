            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 0, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_id: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_id}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts/${c_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { stale_c_v: "$.data.version" }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 200, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${stale_c_v}" }
              as: LogisticsPlanner
              captures: { order_1: "$.data.id" }
            - call: "GET /salt/bid-contracts/${c_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { fresh_c_v: "$.data.version" }
          trigger:
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 200, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${stale_c_v}" }
              as: LogisticsPlanner
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c_id}", depot_id: "${depot_a}", requested_tons: 200, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 82.00, expected_bid_contract_version: "${fresh_c_v}" }
              as: LogisticsPlanner
              captures: { order_2: "$.data.id" }
          assert:
            - "${fresh_c_v} == ${stale_c_v} + 1 — placing order_1 bumped the contract"
            - "call 1 -> HTTP 412 with error code ERR_STALE_BID_CONTRACT_VERSION"
            - "call 2 -> HTTP 201, so the only defect in call 1 was the token"
            - "GET /salt/delivery-orders?bid_contract_id=${c_id} -> total_count == 2"
            - "the ledger reports take_band_consumed_tons == 400.00 against take_band_limit_tons == 1100.00, so no fiscal check was ever close to firing"

      - name: allocation_create_with_a_stale_stockpile_lot_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[manual_reservation_against_lot]
          - errors[ERR_STALE_STOCKPILE_LOT_VERSION]
          - "validations[priority=10]"
        distinguishing_aspect: |
          The lot's version is bumped by an unrelated quarantine-and-clear round trip, so the
          allocation's stale token must be refused with 412 before any tonnage check runs — and the
          fresh token then succeeds with tonnage still fully intact. Priority 10 also outranks the
          lot-state and tonnage checks, which is why the quarantine was cleared first.
        test_recipe:
          setup:
            - "A 940.00 t covered HIGHWAY_DEICING lot at Syracuse Depot, an ACTIVE 1000 t NY contract and a REQUESTED 500 t order; the lot is quarantined and cleared to bump its version twice."
          setup_api_calls:
            - call: "POST /salt/mines"
