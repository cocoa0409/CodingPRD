scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /patients with required fields returns 201; medical_insurance_on_file defaults false, recall_interval_months defaults 12, computed balance fields are 0/null."
        test_recipe:
          setup: ["Empty DB, a FrontDesk actor"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Jane Doe", date_of_birth: "1985-04-12", plan_carrier: "EYEMED" }
              as: FrontDesk
              captures: { pat_id: $.data.id, bal: $.data.outstanding_patient_balance_cents }
          assert:
            - "HTTP status == 201"
            - "Patient.${pat_id}.medical_insurance_on_file == false"
            - "Patient.${pat_id}.recall_interval_months == 12"
            - "Patient.${pat_id}.outstanding_patient_balance_cents == 0"
            - "Patient.${pat_id}.last_routine_exam_date == null"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Patient, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /patients/{id} with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_patient_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Patient.fields.plan_carrier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /patients omitting plan_carrier (required, no default) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB, FrontDesk actor"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "No Carrier", date_of_birth: "1985-04-12" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_patient_invalid_enum_carrier_returns_422
        claim_type: Type Constraints
        grounds: [entities.Patient.fields.plan_carrier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /patients with plan_carrier not in {VSP,EYEMED,NONE} returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB, FrontDesk actor"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Bad Enum", date_of_birth: "1985-04-12", plan_carrier: "AETNA" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_provider_invalid_npi_length_returns_422
        claim_type: Type Constraints
        grounds: [entities.Provider.fields.npi, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /providers with npi not exactly 10 digits returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB, FrontDesk actor"]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { full_name: "Short NPI", role: "OPTOMETRIST", npi: "123" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: prescription_sphere_not_quarter_step_returns_422
        claim_type: Type Constraints
        grounds: [entities.Prescription.fields.sphere_od, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /patients/{id}/prescriptions with sphere_od not a multiple of 0.25 returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Patient + Optometrist + a REFRACTED-eligible (OPEN) encounter"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat Q", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.13, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: system_fields_generated_on_create_input_ignored
        claim_type: System Fields
        grounds: [entities.Patient]
        distinguishing_aspect: "id/created_at/updated_at/version are system-minted on POST /patients; version starts at 1; client cannot set them."
        test_recipe:
          setup: ["Empty DB, FrontDesk actor"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Sys Fields", date_of_birth: "1985-04-12", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id, ver: $.data.version }
          assert:
            - "Patient.${pat_id}.version == 1"
            - "Patient.${pat_id}.id is a server-minted UUID with no type prefix"

      - name: encounter_reference_not_found_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Encounter.fields.patient_id, "validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /encounters with a non-existent patient_id FK returns ERR_REFERENCE_NOT_FOUND 404."
        test_recipe:
          setup: ["An Optometrist provider exists; the referenced patient_id does not"]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "22222222-2222-4222-8222-222222222222", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"
            - "HTTP status == 404"

      - name: provider_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Provider]
        distinguishing_aspect: "Provider has common_fields:false — its response carries id/created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["Empty DB, FrontDesk actor"]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { full_name: "Immutable P", role: "OPTICIAN", npi: "3333333333" }
              as: FrontDesk
              captures: { pid: $.data.id }
          assert:
            - "Provider.${pid}.id present"
            - "Provider response has no version field"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: finalize_open_encounter_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Encounter.REFRACTED_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an OPEN (not REFRACTED) encounter returns ERR_INVALID_STATE 409; status unchanged."
        test_recipe:
          setup: ["An OPEN encounter with no prescription yet"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat O", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
          trigger:
            - call: "POST /encounters/${enc_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: void_encounter_with_prescription_blocked_invalid_state
        claim_type: precondition_violation
        grounds: [state_machines.Encounter.OPEN_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding an encounter that already has a Prescription (now REFRACTED) violates both the OPEN precondition and the no-Rx precondition; returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["An encounter that has been refracted (a Prescription issued from it)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat V", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
          trigger:
            - call: "POST /encounters/${enc_id}/void"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: new_laborder_starts_in_placed
        claim_type: initial_state
        grounds: [state_machines.LabOrder, entities.LabOrder.fields.status]
        distinguishing_aspect: "A newly created LabOrder starts in PLACED with remake_count 0."
        test_recipe:
          setup: ["A self-pay eyeglass Rx ready to order"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op T", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat L", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { st: $.data.status, rc: $.data.remake_count }
          assert:
            - "LabOrder status == PLACED"
            - "LabOrder remake_count == 0"

      - name: third_remake_blocked_max_remakes_terminal_count
        claim_type: precondition_violation
        grounds: [state_machines.LabOrder.DISPENSED_to_REMAKE_REQUESTED, "validations[priority=9]", "errors[ERR_REMAKE_WINDOW_CLOSED]"]
        distinguishing_aspect: "After 2 completed remakes (remake_count==2), a third request-remake is rejected with ERR_REMAKE_WINDOW_CLOSED 409 (MAX_REMAKES boundary)."
        test_recipe:
          setup: ["A self-pay order taken through two full remake cycles (remake_count == 2), currently DISPENSED, within the 90-day window"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op T", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat RM", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_id: $.data.id }
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/request-remake"
              payload: { reason: "r1" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/request-remake"
              payload: { reason: "r2" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
          trigger:
            - call: "POST /lab-orders/${order_id}/request-remake"
              payload: { reason: "r3" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REMAKE_WINDOW_CLOSED"
            - "HTTP status == 409"

      - name: remake_surcharge_applied_on_second_remake
        claim_type: side_effect_execution
        grounds: [calculations.remake_surcharge, state_machines.LabOrder.REMAKE_REQUESTED_to_IN_LAB, entities.LabOrder.fields.remake_count]
        distinguishing_aspect: "On the 2nd remake send-to-lab (remake_count becomes 2 >= threshold), REMAKE_SURCHARGE_CENTS 2500 is added to patient_materials_cost_cents; the 1st remake adds 0."
        test_recipe:
          setup: ["A self-pay order through one full remake (remake_count 1, surcharge 0), DISPENSED, in window"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op T", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat RS", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_id: $.data.id }
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/request-remake"
              payload: { reason: "r1" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/request-remake"
              payload: { reason: "r2" }
              as: Optician
              as_user_id: "${opt_id}"
          trigger:
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
              captures: { rc: $.data.remake_count, pm: $.data.patient_materials_cost_cents }
          assert:
            - "LabOrder.${order_id}.remake_count == 2"
            - "LabOrder.${order_id}.patient_materials_cost_cents == 25500"

      - name: terminal_cancelled_laborder_no_further_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LabOrder.PLACED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_laborder_cancel_terminal
          rationale: "The double-cancel on a CANCELLED order asserting ERR_INVALID_STATE already proves terminal lockdown for LabOrder."

      - name: prescription_supersede_terminal_revoked
        claim_type: invalid_transition
        grounds: [state_machines.Prescription.ACTIVE_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoking an already-REVOKED prescription returns ERR_INVALID_STATE 409 (terminal state)."
        test_recipe:
          setup: ["A patient with one ACTIVE EYEGLASS Rx, then revoked"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat PR", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/revoke"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
          trigger:
            - call: "POST /prescriptions/${rx_id}/revoke"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: expired_prescription_blocks_laborder_placement
        claim_type: guarded_transition
        grounds: [state_machines.Prescription.ACTIVE_to_EXPIRED, "validations[priority=8]", "errors[ERR_PRESCRIPTION_NOT_DISPENSABLE]"]
        distinguishing_aspect: "A CONTACT Rx (12-month expiry) is EXPIRED once the clock passes expiry_date; placing a LabOrder against it returns ERR_PRESCRIPTION_NOT_DISPENSABLE 409."
        test_recipe:
          setup: ["A CONTACT Rx issued 2026-06-01 (expires 2027-06-01); clock advanced to 2027-07-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
