            - "a third Aetna Choice term for 2027-01-01 through 2027-06-30, which overlaps the NOT_REQUESTED replacement, is rejected with ERR_PAYER_CONTRACT_INTERVAL_OVERLAP (409) — the filter removes denied peers only"
            - "a Cigna Connect term for 2026-11-01 through 2027-10-31 is accepted, because the peer set is also keyed on payer_name"

      - name: fmv_income_and_market_approaches_diverge_on_one_ebitda
        claim_type: Variant Divergence
        grounds:
          - calculations.fmv_concluded_value
          - calculations.fmv_concluded_value.variants
        excluded_because:
          difficulty_instance: fmv_income_vs_market_diverges_on_same_ebitda_inputs
          rationale: |
            That §1.8 instance already drives both FMV methods from the identical
            normalized_ebitda_cents of 240000000 and asserts the full divergence — the
            discounted-cash-flow conclusion of 2167511341 against the multiple-based
            1560000000 — plus the per-year rounding that produces it. A separate corner
            test would repeat the same two calls and the same two literals.

      - name: net_consideration_synergy_tier_uses_the_declared_ceilings
        claim_type: Constants Applied
        grounds:
          - calculations.deal_net_consideration
          - calculations.deal_net_consideration.constants
        excluded_because:
          difficulty_instance: net_consideration_tier_pinned_to_gross_not_net
          rationale: |
            The §1.8 combinatorial instance already pins every constant in the chain —
            INTEGRATION_RESERVE_BPS 350, the TIER_2_CEILING_CENTS boundary at
            1500000000 and TIER_2_BPS 275 — and contrasts the correct 1459479375 with
            the 1478858184 a re-tiering from net would produce. Asserting the constants
            again in isolation adds no discriminating power.

      - name: staff_wage_components_are_rounded_before_they_are_summed
        claim_type: Precision
        grounds:
          - calculations.staff_offer_wage_harmonization
        excluded_because:
          difficulty_instance: staff_wage_rounding_per_component_then_sum
          rationale: |
            That instance already isolates the per-component rounding on the BILLER
            fixture, where rounding each of the uplift and PTO components before adding
            gives 5572880 while rounding the single summed expression gives 5572879.
            The one-cent discriminator only exists in that fixture, so duplicating it
            here would be the same test under another name.

      - name: retention_bonus_is_clamped_to_the_floor_and_the_cap
        claim_type: Correct Result
        grounds:
          - calculations.retention_bonus_award
          - calculations.retention_bonus_award.constants
        excluded_because:
          difficulty_instance: retention_bonus_nested_min_max_with_criticality
          rationale: |
            The §1.8 instance already walks all four service tiers, both sides of the
            critical-role multiplier and both clamps — the FRONT_DESK award lifted from
            72000 to the 100000 floor and the PRACTICE_MANAGER award cut from 1845461 to
            the 1500000 cap — in one fixture set. A corner variant would re-derive the
            same five awards.

      - name: benchmark_basis_follows_the_compensation_model_type
        claim_type: Variant Selection
        grounds:
          - calculations.compensation_benchmark_percentile
          - entities.CompensationPlan.fields.benchmark_basis
        excluded_because:
          difficulty_instance: comp_percentile_tcc_vs_per_wrvu_diverges_on_same_physician_economics
          rationale: |
            That instance already holds the physician economics fixed at 34000000 of
            total cash compensation and 8500 cents per wRVU while flipping model_type,
            and asserts the resulting 84.00 against 91.07 with the two benchmark_basis
            values. The selection claim is fully covered by that divergence assertion.

      - name: match_rate_bps_is_floored_against_the_reconcile_threshold
        claim_type: Precision
        grounds:
          - calculations.ehr_reconciliation_match_rate
          - calculations.ehr_reconciliation_match_rate.constants.RECONCILE_MIN_BPS
        excluded_because:
          difficulty_instance: ehr_match_rate_exactly_9950_bps_reconciles
          rationale: |
            The §1.8 boundary instance already sits on both sides of RECONCILE_MIN_BPS
            with 19900 of 20000 reconciling at exactly 9950 and 19899 of 20000 failing
            at 9949 rather than rounding up from 9949.5. Any corner phrasing of the
            truncation claim reuses those exact two fixtures.

      - name: comp_true_up_prorates_the_threshold_by_months_elapsed
        claim_type: Correct Result
        grounds:
          - calculations.comp_true_up
          - calculations.comp_true_up.constants.MONTHS_PER_YEAR
        excluded_because:
          difficulty_instance: performance_report_true_up_flags_acquisition_and_returns_pending_plans
          rationale: |
            That depth-three cascade instance already asserts the whole true-up
            arithmetic on a one-month period — the 250 prorated threshold wRVU, the
            4816667 earned figure, the 2483333 paid to date and the resulting 2333334
            true-up — before following the cascade outward. Re-asserting the arithmetic
            alone would duplicate its first three assertions.

  # ===========================================================================
  # Section 4 — Validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:
      - name: forbidden_role_call_missing_x_user_returns_unauthenticated
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: |
          Authentication outranks authorisation, so a request that both omits X-User-Id
          and carries a role the endpoint does not accept reports
          ERR_UNAUTHENTICATED (401), never ERR_FORBIDDEN_ROLE (403) — the caller is
          never told which of its two defects the server noticed second.
        test_recipe:
          setup:
            - "Empty database; no entity is required because the request never reaches the body."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: PracticePhysician
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED with HTTP 401, because X-User-Id is absent"
            - "the response is not ERR_FORBIDDEN_ROLE even though PracticePhysician is not in the endpoint's roles list"
            - "no Acquisition row is created: GET /acquisitions as DealLead reports total_count == 0"
            - "an empty-string X-User-Id with a valid DealLead role also returns ERR_UNAUTHENTICATED (401)"
            - "an unrecognised X-User-Role value likewise returns ERR_UNAUTHENTICATED (401) rather than ERR_FORBIDDEN_ROLE"

      - name: malformed_body_from_wrong_role_returns_forbidden
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: |
          The role gate runs before the body is parsed, so a PracticePhysician posting a
          body that is also missing required fields and carrying an unrecognised
          specialty is told ERR_FORBIDDEN_ROLE (403) — a forbidden caller never learns
          whether its payload was well formed.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PODIATRY" }
              as: PracticePhysician
              as_user_id: "phys-unknown"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "the response is not ERR_INVALID_REQUEST (400) even though specialty PODIATRY is unrecognised and eight required fields are missing"
            - "the identical body sent as DealLead with user id dl-1 returns ERR_INVALID_REQUEST (400), which confirms the body really is malformed"
            - "no Acquisition row is created by either attempt"

      - name: unknown_acquisition_with_invalid_enum_returns_invalid_request
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: |
          Schema validation outranks existence, so an action on a nonexistent
          acquisition with an unrecognised target_status reports ERR_INVALID_REQUEST
          (400) rather than ERR_RESOURCE_NOT_FOUND (404) — the request is rejected
          before any lookup is attempted.
        test_recipe:
          setup:
            - "Empty database; no acquisition with the requested id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions/00000000-0000-4000-8000-000000000000/status"
              payload: { target_status: "RENEGOTIATING" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "the response is not ERR_RESOURCE_NOT_FOUND (404) even though the path id resolves to nothing"
            - "the same unknown id with a well-formed target_status of DILIGENCE does return ERR_RESOURCE_NOT_FOUND (404)"

      - name: unknown_acquisition_with_valid_transition_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=14]
        distinguishing_aspect: |
          Existence outranks the state machine, so a well-formed but impossible
          transition aimed at a nonexistent acquisition reports
          ERR_RESOURCE_NOT_FOUND (404) rather than ERR_INVALID_STATE_TRANSITION (409):
          there is no current state against which to judge the transition.
        test_recipe:
          setup:
            - "One real Acquisition in deal_status SOURCING, so the collection is not empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /acquisitions/00000000-0000-4000-8000-000000000000/status"
              payload: { target_status: "CLOSED" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND with HTTP 404"
            - "the response is not ERR_INVALID_STATE_TRANSITION (409), even though SOURCING -> CLOSED is undeclared for the real acquisition"
            - "the same target_status CLOSED against the real ${acq_id} does return ERR_INVALID_STATE_TRANSITION (409)"
            - "the shared not-found code is used: the error_id does not name the entity type, only the message does"

      - name: unknown_physician_with_cross_acquisition_contract_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Body references are resolved before cross-reference consistency, so a package
          quoting an unknown physician_id together with a payer_contract_id that belongs
          to a different acquisition reports ERR_RESOURCE_NOT_FOUND (404), not
          ERR_ACQUISITION_SCOPE_MISMATCH (409).
        test_recipe:
          setup:
            - "Two Acquisitions in deal_status SOURCING; acquisition B owns a Physician and acquisition A owns the PayerContract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_a_id: "$.data.id" }
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Northgate Cardiology Associates", specialty: "CARDIOLOGY", structure: "EQUITY", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 9600000, trailing_annual_collections_cents: 900000000, target_close_on: "2026-12-01", required_staff_headcount: 8, retention_pool_total_cents: 6000000, escrow_total_cents: 20000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_b_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_b_id}", npi: "1730492857", full_name: "Idris Colefax MD", specialty: "CARDIOLOGY", board_certified: true, state_license_expires_on: "2029-03-31" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_b_id: "$.data.id" }
            - call: "POST /payer-contracts"
              payload: { acquisition_id: "${acq_a_id}", payer_name: "Aetna Choice", payer_type: "COMMERCIAL", contract_form: "ASSIGNABLE", notice_days_required: 90, effective_on: "2026-11-01", terminates_on: "2027-10-31", annual_revenue_share_bps: 2500, committee_slots_per_cycle: 2 }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { contract_a_id: "$.data.id" }
          trigger:
            - call: "POST /credentialing-packages"
              payload: { acquisition_id: "${acq_a_id}", physician_id: "00000000-0000-4000-8000-000000000000", payer_contract_id: "${contract_a_id}", submitted_on: "2026-08-03" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND with HTTP 404"
            - "swapping in the real ${phys_b_id}, which belongs to acquisition B, returns ERR_ACQUISITION_SCOPE_MISMATCH (409) instead"
            - "no CredentialingPackage row is created by either attempt"

      - name: stale_version_beats_missing_valuation_input
        claim_type: Priority Ordering
        grounds:
          - validations[priority=13]
          - validations[priority=22]
          - concurrency_rules
        distinguishing_aspect: |
          Optimistic concurrency is checked before any business rule, so a valuation
          quoting a version that a later physician registration has already superseded
          reports ERR_STALE_ACQUISITION_VERSION (412) even though its INCOME_APPROACH
          body is also missing four of the five inputs that method requires — a stale
          reader is told to re-read rather than handed a business error derived from a
          version it never saw.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE whose version is read before a further Physician registration bumps it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_a_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { acq_stale_v: "$.data.version" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1962037481", full_name: "Rowan Ilesanmi MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-09-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_b_id: "$.data.id" }
          trigger:
            - call: "POST /valuation-opinions"
              payload: { acquisition_id: "${acq_id}", expected_acquisition_version: "${acq_stale_v}", opinion_type: "FMV", method: "INCOME_APPROACH", normalized_ebitda_cents: 240000000, independence_attested: true, effective_on: "2026-08-01" }
              as: ValuationAnalyst
              as_user_id: "va-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_STALE_ACQUISITION_VERSION with HTTP 412"
            - "the response is not ERR_MISSING_VALUATION_INPUT (422) even though projection_years, ebitda_growth_bps, discount_rate_bps and terminal_growth_bps are all absent"
            - "no ValuationOpinion row is created: GET /valuation-opinions with acquisition_id ${acq_id} reports total_count == 0"
            - "re-reading the acquisition and resending the identical body with the fresh version does return ERR_MISSING_VALUATION_INPUT (422), which confirms the body really is incomplete"

      - name: referral_credit_beats_missing_stark_exception
        claim_type: Priority Ordering
        grounds:
          - validations[priority=17]
          - validations[priority=18]
        distinguishing_aspect: |
          Referral-linked compensation is the highest-priority business rule in the
          domain, so a plan that both pays for referrals and names no Stark exception
          reports ERR_REFERRAL_LINKED_COMPENSATION (422) rather than
          ERR_STARK_EXCEPTION_REQUIRED — no exception could have saved it anyway.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with one Physician."
            - "One CompensationPlan in status DRAFT with includes_referral_credit true and stark_exception NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
