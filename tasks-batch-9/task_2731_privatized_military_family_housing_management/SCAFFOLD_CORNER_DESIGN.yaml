# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
#
# Task 2731 — Privatized Military Family Housing Management
#
# One `- section:` block per claim-extraction-guide section. Every instance
# grounds in SCAFFOLD.yaml §1.1–§1.7; every `setup_api_calls` / `trigger` entry
# is a structured call against a §1.5 endpoint; every numeric literal in
# `assert:` was produced by executing the matching §1.3 `formula:` with its
# `constants:` under round_half_up. Corners already asserted by §1.8 appear as
# `excluded_because:` stubs naming the covering difficulty instance.
#
# Fixture note — the logical clock starts at 2026-08-01T00:00:00Z and every
# recipe repositions it explicitly with POST /_clock/set_current_utc. The
# recurring "BASE_A" fixture named in `setup:` prose is: Fort Cavazos +
# BahRate E5/with-dependents/2026 (245000 / 19500) + unit A-101 (2BR TOWNHOME,
# JUNIOR_ENLISTED) + an E5 sponsor with three full-time-custody dependents
# (bedroom_eligibility 2) whose lease starting 2026-09-01 is OCCUPIED / ACTIVE
# with gross 237650, net 218150 and daily_rent_cents 7172.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # ENTITIES - creation / retrieval / listing / defaults / system + computed
  # fields / type constraints / immutability / parent FKs / flat-topology
  # cross-reference integrity, walked over the 14 §1.1 entities.
  # =========================================================================
  - section: entities
    instances:

      - name: installation_creation_with_all_overrides_returns_declared_fields
        claim_type: creation
        grounds:
          - entities.Installation
          - endpoints.POST_/installations
          - endpoints.GET_/installations/{id}
          - response_envelope.success
        distinguishing_aspect: "POST /installations with all five optional overrides supplied returns 201 and echoes every §1.1 Installation field, with the six unit counters and pending_application_count at 0 and offer_run_epoch at 0 - no override is silently replaced by its default."
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /installations"
              payload: { name: "Norfolk Naval Station Family Housing", branch: "NAVY", mha_code: "VA-NRF", bill_of_rights_version: "2026.1", turn_buffer_days: 7, offer_response_hours: 48, decline_limit: 3, decline_penalty_days: 20, incentive_base_pct: 0.04 }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id", inst_created: "$.data.created_at" }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { reread_epoch: "$.data.offer_run_epoch" }
          assert:
            - "POST /installations returns HTTP 201 with response_type object and a meta.api_request_id present"
            - "data.name == Norfolk Naval Station Family Housing and data.branch == NAVY and data.mha_code == VA-NRF"
            - "data.bill_of_rights_version == 2026.1"
            - "data.turn_buffer_days == 7 and data.offer_response_hours == 48 and data.decline_limit == 3"
            - "data.decline_penalty_days == 20 and data.incentive_base_pct == 0.04"
            - "data.total_unit_count == 0 and data.available_unit_count == 0 and data.assigned_unit_count == 0"
            - "data.occupied_unit_count == 0 and data.offline_unit_count == 0 and data.hazard_hold_unit_count == 0"
            - "data.pending_application_count == 0"
            - "data.offer_run_epoch == 0 and data.last_offer_run_at == null"
            - "data.version == 1 and ${inst_created} == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z"
            - "GET /installations/${inst_id} returns HTTP 200 and ${reread_epoch} == 0, i.e. the read reproduces the stored row"

      - name: housing_unit_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.HousingUnit
          - entities.HousingUnit.fields.accessibility_features
          - entities.HousingUnit.fields.last_lease_end_date
          - endpoints.GET_/housing-units/{id}
          - entities.Installation.fields.total_unit_count
        distinguishing_aspect: "GET /housing-units/{id} returns every stored HousingUnit field including the array-valued accessibility_features and the two null system fields (hazard_hold_reason, last_lease_end_date), and the parent Installation counters recomputed to total 1 / available 1."
        test_recipe:
          setup:
            - "One installation with the declared defaults."
            - "One unit B-200 with 3 bedrooms, SFH, designated SENIOR_ENLISTED, historic_flag true and accessibility_features [ROLL_IN_SHOWER, ZERO_STEP_ENTRY]."
            - "No lease, application or work order exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "B-200", bedroom_count: 3, unit_type: "SFH", designated_rank_category: "SENIOR_ENLISTED", historic_flag: true, accessibility_features: ["ROLL_IN_SHOWER", "ZERO_STEP_ENTRY"] }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
          trigger:
            - call: "GET /housing-units/${u1_id}"
              payload: {}
              as: MaintenanceTech
              captures: { u1_status: "$.data.status", u1_hold: "$.data.hazard_hold_reason", u1_lastend: "$.data.last_lease_end_date" }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { i_total: "$.data.total_unit_count", i_avail: "$.data.available_unit_count" }
          assert:
            - "GET /housing-units/${u1_id} returns HTTP 200 with data.installation_id == ${inst_id}"
            - "data.unit_code == B-200 and data.bedroom_count == 3 and data.unit_type == SFH"
            - "data.designated_rank_category == SENIOR_ENLISTED and data.historic_flag == true"
            - "data.accessibility_features == [ROLL_IN_SHOWER, ZERO_STEP_ENTRY]"
            - "${u1_status} == AVAILABLE and ${u1_hold} == null and ${u1_lastend} == null"
            - "data.version == 1"
            - "${i_total} == 1 and ${i_avail} == 1"

      - name: housing_unit_listing_paginates_and_filters_independently
        claim_type: listing
        grounds:
          - endpoints.GET_/housing-units
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.HousingUnit.fields.status
        distinguishing_aspect: "GET /housing-units reports total_count 5 / has_more true at limit 2 and the status, bedroom_count and unit_type filters narrow the count independently of the OFFLINE_MAINTENANCE placement - the status filter counts 4 while bedroom_count 2 plus unit_type TOWNHOME still counts all 3 townhomes."
        test_recipe:
          setup:
            - "One installation with five units: A-101, A-102 and A-103 (2BR TOWNHOME, JUNIOR_ENLISTED), B-200 (3BR SFH, SENIOR_ENLISTED) and C-300 (2BR APARTMENT, JUNIOR_ENLISTED)."
            - "A-103 has been moved to OFFLINE_MAINTENANCE; the other four are AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-102", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u2_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-103", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u3_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "B-200", bedroom_count: 3, unit_type: "SFH", designated_rank_category: "SENIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u4_id: "$.data.id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "C-300", bedroom_count: 2, unit_type: "APARTMENT", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u5_id: "$.data.id" }
            - call: "POST /housing-units/${u3_id}/status"
              payload: { status: "OFFLINE_MAINTENANCE" }
              as: PropertyManager
          trigger:
            - call: "GET /housing-units?installation_id=${inst_id}&limit=2&offset=0"
              payload: {}
              as: PropertyManager
              captures: { p1_first: "$.data[0].unit_code" }
            - call: "GET /housing-units?installation_id=${inst_id}&limit=2&offset=4"
              payload: {}
              as: PropertyManager
              captures: { p3_first: "$.data[0].unit_code" }
            - call: "GET /housing-units?installation_id=${inst_id}&status=AVAILABLE"
              payload: {}
              as: PropertyManager
            - call: "GET /housing-units?installation_id=${inst_id}&bedroom_count=2&unit_type=TOWNHOME"
              payload: {}
              as: PropertyManager
          assert:
            - "GET /housing-units?installation_id=${inst_id}&limit=2&offset=0 reports total_count == 5 and has_more == true and returns exactly 2 rows in data"
            - "${p1_first} == A-101, i.e. the list is ordered by created_at ASC"
            - "GET /housing-units?installation_id=${inst_id}&limit=2&offset=4 reports total_count == 5 and has_more == false and returns exactly 1 row"
            - "${p3_first} == C-300"
            - "GET /housing-units?installation_id=${inst_id}&status=AVAILABLE reports total_count == 4 and A-103 is absent from data"
            - "GET /housing-units?installation_id=${inst_id}&bedroom_count=2&unit_type=TOWNHOME reports total_count == 3 and includes A-103 despite its OFFLINE_MAINTENANCE status"

      - name: omitted_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Installation.fields.turn_buffer_days
          - entities.Installation.fields.offer_response_hours
          - entities.Installation.fields.decline_limit
          - entities.Installation.fields.decline_penalty_days
          - entities.Installation.fields.incentive_base_pct
          - entities.HousingUnit.fields.historic_flag
          - entities.HousingUnit.fields.accessibility_features
          - entities.Dependent.fields.is_full_time_custody
          - entities.WorkOrder.fields.habitability_impact
          - calculations.work_order_priority_classification
        distinguishing_aspect: "Creating an Installation, HousingUnit, Dependent and WorkOrder with every optional input omitted stamps exactly the §1.1 declared defaults - 5 / 72 / 2 / 15 / 0.03, historic_flag false with an empty accessibility_features array, is_full_time_custody true, and habitability_impact false which classifies the COSMETIC order ROUTINE."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
            - "Every create call below supplies only the fields §1.5 lists without a trailing question mark."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id", d_turn: "$.data.turn_buffer_days", d_hours: "$.data.offer_response_hours", d_limit: "$.data.decline_limit", d_pen: "$.data.decline_penalty_days", d_pct: "$.data.incentive_base_pct" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id", d_hist: "$.data.historic_flag", d_feats: "$.data.accessibility_features", d_ustatus: "$.data.status" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE" }
              as: PlatformAdmin
              captures: { d_ftc: "$.data.is_full_time_custody" }
            - call: "GET /service-members/${sm1_id}"
              payload: {}
              as: PropertyManager
              captures: { d_depcount: "$.data.dependent_count" }
            - call: "POST /work-orders"
              payload: { housing_unit_id: "${u1_id}", category: "COSMETIC", description: "Scuffed baseboard in the living room" }
              as: PropertyManager
              captures: { wo_id: "$.data.id", d_hab: "$.data.habitability_impact", d_pri: "$.data.priority_class", d_resp: "$.data.response_due_at", d_comp: "$.data.completion_due_at" }
          assert:
            - "${d_turn} == 5 and ${d_hours} == 72 and ${d_limit} == 2 and ${d_pen} == 15 and ${d_pct} == 0.03"
            - "${d_hist} == false and ${d_feats} == [] and ${d_ustatus} == AVAILABLE"
            - "${d_ftc} == true and ${d_depcount} == 1"
            - "${d_hab} == false and ${d_pri} == ROUTINE"
            - "${d_resp} == 2026-08-06T00:00:00Z and ${d_comp} == 2026-08-31T00:00:00Z"
            - "WorkOrder.${wo_id}.lease_id == null and parent_work_order_id == null and inspection_deficiency_code == null"
            - "WorkOrder.${wo_id}.status == SUBMITTED and escalation_level == 0 and reopen_count == 0 and sla_breached == false and first_response_at == null"

      - name: installation_system_fields_are_server_minted_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Installation.fields.offer_run_epoch
          - entities.Installation.fields.last_offer_run_at
          - endpoints.POST_/installations
          - response_envelope.success
        distinguishing_aspect: "The four common system fields plus offer_run_epoch and last_offer_run_at are minted by the server: two installations created in the same request chain receive distinct ids, both stamp created_at == updated_at == the logical clock 2026-08-01T00:00:00Z, version 1, offer_run_epoch 0 and last_offer_run_at null, and §1.5 declares no input field that could set any of them."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
            - "POST /installations declares only the nine business fields in its §1.5 input - no id, created_at, updated_at or version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { i1_id: "$.data.id", i1_created: "$.data.created_at", i1_updated: "$.data.updated_at", i1_ver: "$.data.version", i1_epoch: "$.data.offer_run_epoch", i1_last: "$.data.last_offer_run_at" }
            - call: "POST /installations"
              payload: { name: "Fort Hood Historic District", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { i2_id: "$.data.id", i2_created: "$.data.created_at" }
          assert:
            - "${i1_id} != ${i2_id} and both are server-minted opaque ids the request body never supplied"
            - "${i1_created} == 2026-08-01T00:00:00Z and ${i1_updated} == 2026-08-01T00:00:00Z, i.e. stamped from the logical clock rather than wall time"
            - "${i2_created} == 2026-08-01T00:00:00Z, identical to ${i1_created} because the clock did not move between the two creates"
            - "${i1_ver} == 1 and ${i1_epoch} == 0 and ${i1_last} == null"

      - name: lease_money_and_link_fields_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.Lease.fields.gross_rent_cents
          - entities.Lease.fields.net_rent_cents
          - entities.Lease.fields.daily_rent_cents
          - entities.Lease.fields.service_member_id
          - calculations.gross_rent_determination
          - calculations.daily_rent_rate
          - endpoints.POST_/leases
        distinguishing_aspect: "POST /leases accepts only application_id, housing_unit_id, start_date and term_months, yet the created Lease carries gross_rent_cents 237650, utility_allowance_cents 19500, net_rent_cents 218150 and daily_rent_cents 7172 computed from the BahRate row, plus a service_member_id copied from the application and all four settlement / ledger money fields initialised to 0."
        test_recipe:
          setup:
            - "BASE_A up to and including accept-offer: the E5 sponsor with three dependents has ACCEPTED the offer of unit A-101 and the unit is ASSIGNED."
            - "The 2026 BahRate row for E5 with dependents is 245000 / 19500; the application pcs_orders_date is 2026-08-25 so both rent variants read the 2026 row."
            - "No lease exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
          trigger:
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: "$.data.id", l_gross: "$.data.gross_rent_cents", l_util: "$.data.utility_allowance_cents", l_net: "$.data.net_rent_cents", l_daily: "$.data.daily_rent_cents", l_sm: "$.data.service_member_id", l_basis: "$.data.rent_basis", l_year: "$.data.rent_effective_year" }
            - call: "GET /waitlist-applications/${app1_id}"
              payload: {}
              as: PropertyManager
              captures: { app_status_after: "$.data.status" }
            - call: "GET /housing-units/${u1_id}"
              payload: {}
              as: PropertyManager
              captures: { u_status_after: "$.data.status" }
          assert:
            - "POST /leases returns HTTP 201 with ${l_gross} == 237650 and ${l_util} == 19500"
            - "${l_net} == 218150 and ${l_daily} == 7172"
            - "${l_basis} == OFFER_PROVISIONAL and ${l_year} == 2026"
            - "${l_sm} == ${sm1_id}, copied from the application rather than supplied in the body"
            - "Lease.${l1_id}.occupancy_status == PENDING_MOVE_IN and allotment_status == NOT_STARTED"
            - "Lease.${l1_id}.early_termination_fee_cents == 0 and settlement_total_cents == 0"
            - "Lease.${l1_id}.allotment_balance_cents == 0 and abatement_total_cents == 0"
            - "Lease.${l1_id}.bill_of_rights_version_ack == null and termination_reason == null"
            - "${app_status_after} == HOUSED and ${u_status_after} == ASSIGNED"

      - name: housing_unit_out_of_range_and_unknown_enum_values_are_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.HousingUnit.fields.bedroom_count
          - entities.HousingUnit.fields.unit_type
          - entities.HousingUnit.fields.accessibility_features
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Each of the three §1.1 HousingUnit constraint kinds is enforced at priority 4 with ERR_INVALID_REQUEST and HTTP 400: bedroom_count 6 breaks the 1..5 range, unit_type CONDO is not a declared enum member, and accessibility_features [ELEVATOR] carries an undeclared element - and no unit row is created by any of them."
        test_recipe:
          setup:
            - "One installation with the declared defaults and no units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 6, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
              captures: { e_beds: "$.data.error_id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-102", bedroom_count: 2, unit_type: "CONDO", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
              captures: { e_type: "$.data.error_id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-103", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
