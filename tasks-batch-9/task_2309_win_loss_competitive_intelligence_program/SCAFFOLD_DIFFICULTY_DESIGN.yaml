          - state_machines.Battlecard.PUBLISHED_to_WITHDRAWN
          - state_machines.EnablementAssignment.ASSIGNED_to_EXPIRED
          - entities.Competitor.fields.published_battlecard_count
          - calculations.battlecard_risk_index
          - calculations.battlecard_adoption_rate
        distinguishing_aspect: |
          Depth-3 chain on a completely different trigger and a completely
          different entity spine from the completion cascade above:
          (1) POST /battlecards/{id}/claims/{cid}/legal-decision with REJECT flips the
          only APPROVED claim to REJECTED and drops approved_claim_count to 0;
          (2) because approved_claim_count reached 0 the PUBLISHED card transitions to
          WITHDRAWN; (3) because the card was withdrawn its ASSIGNED enablement
          assignment transitions to EXPIRED and Competitor.published_battlecard_count
