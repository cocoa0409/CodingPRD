  # =====================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: annual_plan_review_return_revision_cycle
        grounds:
          - state_machines.AnnualPlan
        distinguishing_aspect: |
          AnnualPlan has a cyclic review loop: DRAFT -> SUBMITTED_FOR_REVIEW
          -> RETURNED -> DRAFT -> SUBMITTED_FOR_REVIEW -> APPROVED ->
          PUBLISHED. The cycle can be traversed multiple times before
          terminal publish; each loop increments version.
        test_recipe:
          setup:
            - "Airport A; senior biologist B1; RegulatorAgent R"
            - "One AnnualPlan AP1 for A + plan_year 2027"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KEEE", name: "Echo Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-401", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9101" }
              as: AirportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /wildlife/annual-plans"
              payload: { airport_id: "${ap_id}", plan_year: 2027, version_note: "v1" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /wildlife/annual-plans/${plan_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/annual-plans/${plan_id}/return-for-revision"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r_id}"
            - call: "POST /wildlife/annual-plans/${plan_id}/revise"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/annual-plans/${plan_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/annual-plans/${plan_id}/approve"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r_id}"
            - call: "GET /wildlife/annual-plans/${plan_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { plan_status: $.data.status, plan_version: $.data.version }
          assert:
            - "AnnualPlan.${plan_id}.status == APPROVED after DRAFT -> SUBMITTED -> RETURNED -> DRAFT -> SUBMITTED -> APPROVED cycle"
            - "AnnualPlan.${plan_id}.version == 6 (5 transitions + initial create=1)"
            - "approved_by_regulator_id == ${r_id}"

      - name: carcass_record_dispute_resolve_cycle_with_cascade
        grounds:
          - state_machines.CarcassRecord
          - state_machines.WildlifeStrikeReport
        distinguishing_aspect: |
          CarcassRecord has a non-linear branching shape: COLLECTED can go
          direct to IDENTIFIED or via PENDING_ID; IDENTIFIED can be
          DISPUTED and then RESOLVED (a revert edge with cascade back to
          the parent WildlifeStrikeReport). This is NOT a linear pipeline.
        test_recipe:
          setup:
            - "Airport A; senior biologists B1 and B2; non-senior B3"
            - "Species S1 (MEDIUM risk) and S2 (LOW risk)"
            - "Strike report SR confirmed with carcass_present=true, species_id=S1"
            - "CarcassRecord CR auto-created on confirmation"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KFFF", name: "Foxtrot Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Red-tailed Hawk", scientific_name: "Buteo jamaicensis", guild: "RAPTOR", risk_tier: "MEDIUM", body_mass_g: 1100, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp1: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "European Starling", scientific_name: "Sturnus vulgaris", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 85, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp2: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-501", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-502", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Three", certification_id: "CERT-503", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b3_id: $.data.id }
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b3_id}", strike_at: "2026-07-01T10:00:00Z", runway_designator: "09L", aircraft_registration: "N301", species_id: "${sp1}", damage_class: "MINOR", phase_of_flight: "LANDING", altitude_ft_agl: 30, strike_count_animals: 1, carcass_present: true }
              as: WildlifeBiologist
              as_user_id: "${b3_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /wildlife/strike-reports/${sr_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b3_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/confirm"
              payload: { confirmation_notes: "carcass present" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "GET /wildlife/strike-reports/${sr_id}/carcass-records"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { cr_id: "$.data[0].id" }
          trigger:
            # B1 identifies as sp2 — cascades strike to AMENDED
            - call: "POST /wildlife/carcass-records/${cr_id}/identify"
              payload: { species_id_final: "${sp2}", identification_method: "DNA" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # B2 disputes (segregation: B2 != B1)
            - call: "POST /wildlife/carcass-records/${cr_id}/dispute"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            # B2 resolves to sp1 (back to original)
            - call: "POST /wildlife/carcass-records/${cr_id}/resolve"
              payload: { species_id_final: "${sp1}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "GET /wildlife/carcass-records/${cr_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { cr_status: $.data.identification_status }
            - call: "GET /wildlife/strike-reports/${sr_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { sr_status: $.data.status, sr_species: $.data.species_id }
          assert:
            - "CarcassRecord.${cr_id}.identification_status == RESOLVED after IDENTIFIED -> DISPUTED -> RESOLVED cycle"
            - "WildlifeStrikeReport.${sr_id}.status == AMENDED (cascade from identify with different species)"
            - "CarcassRecord.species_id_final == ${sp1} after resolve"
            - "CarcassRecord.version == 4 (create=1, identify=2, dispute=3, resolve=4)"

  # =====================================================================
  # Rule 4 — transitive_cascade (≥2 instances, depth ≥3 and ≥2, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: strike_confirm_cascade_chain_3_hops
        grounds:
          - state_machines.WildlifeStrikeReport.UNDER_REVIEW_to_CONFIRMED
          - calculations.rolling_strike_window
          - calculations.airport_hazard_level
          - entities.Airport.fields.current_hazard_level
        distinguishing_aspect: |
          Depth-3 chain originating from a strike confirmation:
          confirm -> CarcassRecord auto-create -> Airport.strikes_trailing_12m
          recompute -> Airport.current_hazard_level recompute. Each hop is
          caused by the previous link, not by the original action — the
          carcass creation is caused by the confirm transition, the strike
          recompute is caused by the strike status change, and the hazard
          recompute is caused by the strikes count change.
        test_recipe:
          setup:
            - "Airport A; senior biologist B1; non-senior B2"
            - "Species S1 HIGH risk (to require senior confirmer)"
            - "9 already-CONFIRMED strikes within window (so 10th confirmation crosses the ELEVATED->HIGH threshold)"
