    output: Lease
    side_effects: ["contract_status ACTIVE -> HOLDOVER", "increments Lease.version by 1"]
  - method: POST
    path: "/leases/{id}/expire"
    description: "Expires the lease. Completed improvements vest in the agency or become compensable per ownership_at_expiration, unfinished improvements are withdrawn, live operating plans are superseded, and possessory_interest_value_cents is frozen."
