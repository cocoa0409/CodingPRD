              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners"
              payload: { company_name: "Meridian Partners", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { pl_id: $.data.id }
            - call: "POST /partners/${pl_id}/certifications"
              payload: { engineer_name: "Hal Ortiz", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc1_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${pw_id}", account_id: "${acc1_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 600000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${pw_id}"
              captures: { rw1_id: $.data.id }
            - call: "POST /deal-registrations/${rw1_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pw_id}"
            - call: "POST /deal-registrations/${rw1_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${rw1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /deal-registrations"
              payload: { partner_id: "${pl_id}", account_id: "${acc1_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-09-30T00:00:00.000Z" }
              as: Partner
