            - "re-using VIN 1TXDSL0000000601 on the same dealer fails 422 ERR_VIN_ALREADY_EXISTS"
            - "the same duplicate VIN sent to D-NV fails 422 ERR_DEALER_NOT_LICENSED_IN_STATE — priority 60 outranks priority 62 and the VIN check is never reached"
            - "delivered_at 2026-11-15, after the logical clock at 2026-09-01, fails 422 ERR_INVALID_BUILD_WINDOW"
            - "D-TX ends with delivered_unit_count 1 and certification_standing GOOD: the three rejected imports created nothing"

      - name: minting_checks_the_vin_before_the_awarded_unit_count
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VIN_ALREADY_EXISTS]
          - errors[ERR_ORDER_UNIT_COUNT_EXCEEDED]
          - validations[priority=62]
          - validations[priority=65]
          - endpoints[POST /contract-orders/{id}/units]
        distinguishing_aspect: |
          A one-unit order exercises both mint guards from the same post-mint state: retrying with the VIN
          just used reports ERR_VIN_ALREADY_EXISTS (62) while retrying with a fresh VIN reports
          ERR_ORDER_UNIT_COUNT_EXCEEDED (65) — so a naive implementation that checks the order counter
          first would return the wrong id for the retry case. created_unit_count stays 1 through both.
        test_recipe:
          setup:
            - "TX 1-unit award on TYPE_C_CONV + DSL-100, promised 2026-11-20 against required 2026-12-01"
