          - errors[ERR_RULE_NOT_EFFECTIVE]
        distinguishing_aspect: "Citation gating splits existence from state: an unknown rule_code yields 404 ERR_RULE_NOT_FOUND; a known but still-DRAFT rule yields 422 ERR_RULE_NOT_EFFECTIVE."
        test_recipe:
