      - name: record_reject_resubmit_loop
        claim_type: valid_transition
        grounds: [state_machines.ActivityRecord.UNDER_REVIEW_to_REJECTED, state_machines.ActivityRecord.REJECTED_to_SUBMITTED]
        distinguishing_aspect: "REJECTED stores reject_reason and resubmit (REJECTED -> SUBMITTED) clears it — the revision loop round-trips cleanly."
