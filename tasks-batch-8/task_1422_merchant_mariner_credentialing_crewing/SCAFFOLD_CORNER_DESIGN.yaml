            - "err == ERR_INVALID_STATE (legs frozen once BOOKED)"

  - section: consistency_model
    instances:
      - name: immediate_clock_visibility_after_set
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.\"POST /_clock/set_current_utc\"", "endpoints.\"GET /_clock/current\""]
        distinguishing_aspect: "Immediate consistency model: the clock-set response and the very next GET /_clock/current expose the same value; before any set the clock reads exactly the pinned default 2026-08-01T00:00:00Z (no wall-clock fallback)."
        test_recipe:
          setup: ["fresh state (no clock set yet)"]
          setup_api_calls:
            - { call: "GET /_clock/current", as: FleetAdmin, captures: { c0: $.data.current_utc } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T12:00:00Z" }, as: FleetAdmin, captures: { c1: $.data.current_utc } }
            - { call: "GET /_clock/current", as: CrewingManager, captures: { c2: $.data.current_utc } }
          assert:
            - "c0 == 2026-08-01T00:00:00Z (pinned startup default)"
            - "c1 == 2026-08-15T12:00:00Z and c2 == c1 (write visible in the same request's response and in the next read)"
