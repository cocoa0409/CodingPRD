              payload: { full_name: "Frank Falsify", email: "frank@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "Dubious EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
