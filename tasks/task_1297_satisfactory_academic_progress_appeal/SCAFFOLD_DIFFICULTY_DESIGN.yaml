# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_1297_satisfactory_academic_progress_appeal
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pace_official_vs_preview_projection
        grounds:
          - calculations.pace_calculation
          - endpoints["GET /sap/students/{id}/sap-preview"]
        distinguishing_aspect: |
          On identical stored data, the official_cumulative variant (POSTED|AMENDED
          enrollments only) yields pace 66.67 while the preview_projected variant
          (IN_PROGRESS credits counted as earned) yields 80.00 — the pace metric on
          the Student/TermEnrollment domain, distinct from the Program max-timeframe
          domain of the sibling instance.
        test_recipe:
          setup:
            - "Program required_credits=120; Term T1 seq 1; Student S in the program"
            - "Enrollment E1: attempted 9, POSTED earned 6 / QP 18.0 / gpa_hours 9"
            - "Enrollment E2: attempted 6, still IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-CSCI", name: "Computer Science", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1001", full_name: "Ada Pace", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 9 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 18.0, gpa_hours: 9 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
          trigger:
            - call: "GET /sap/students/${stu}/sap-preview"
              as: AidOfficer
              captures: { p_off: $.data.pace_pct_official_basis, p_proj: $.data.pace_pct_projected, p_gpa: $.data.cumulative_gpa }
          assert:
            - "preview.pace_pct_official_basis == 66.67 (6 earned / 9 attempted, POSTED rows only)"
            - "preview.pace_pct_projected == 80.00 ((6+6) / (9+6), IN_PROGRESS row counted as earned)"
            - "preview.pace_pct_official_basis != preview.pace_pct_projected on identical stored data"
            - "preview.cumulative_gpa == 2.0 (18.0 / 9)"

      - name: max_timeframe_attempted_only_vs_projection
        grounds:
          - calculations.max_timeframe_check
          - endpoints["GET /sap/students/{id}/sap-preview"]
        distinguishing_aspect: |
          On identical stored data (attempted 175, earned 100, required 120, cap 180),
          the attempted_only variant reports WITHIN (175 < 180) while the
          remaining_projection variant reports EXCEEDED (175 + 20 remaining = 195 > 180)
          — the Program-completion domain, distinct from the pace domain of the sibling
          instance; the official evaluation must use the projection variant.
        test_recipe:
          setup:
            - "Program required_credits=120 (cap floor(120*1.5)=180); Terms T1 seq 1, T2 seq 2; Student S"
            - "T1 enrollment attempted 100 POSTED earned 60 / QP 180.0 / gh 100; T1 evaluated (S -> WARNING)"
            - "T2 enrollment attempted 75 POSTED earned 40 / QP 80.0 / gh 75; T2 NOT yet closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-MATH", name: "Mathematics", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-2001", full_name: "Max Timeframe", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 100 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 60, quality_points: 180.0, gpa_hours: 100 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 75 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 40, quality_points: 80.0, gpa_hours: 75 }, as: Registrar }
          trigger:
            - call: "GET /sap/students/${stu}/sap-preview"
              as: AidOfficer
              captures: { m_ao: $.data.max_tf_attempted_only_exceeded, m_proj: $.data.max_tf_projection_exceeded }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}"
              as: AidOfficer
              captures: { ev_maxtf: "$.data[0].max_tf_exceeded", ev_pace: "$.data[0].pace_pct", ev_gpa: "$.data[0].cumulative_gpa", ev_result: "$.data[0].result_standing" }
          assert:
            - "preview.max_tf_attempted_only_exceeded == false (175 attempted < cap 180)"
            - "preview.max_tf_projection_exceeded == true (175 + 20 remaining = 195 > 180) on the same data"
            - "official SapEvaluation(T2).max_tf_exceeded == true (official uses remaining_projection)"
            - "SapEvaluation(T2).pace_pct == 57.14 and cumulative_gpa == 1.486"
            - "SapEvaluation(T2).result_standing == SUSPENSION"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: standing_assignment_max_tf_overrides_passing_metrics
        grounds:
          - calculations.sap_standing_assignment
          - calculations.max_timeframe_check
        distinguishing_aspect: |
          Mode (a): standing assignment is a >=3-input non-linear rule (pace_ok, gpa_ok,
          max_tf_exceeded, prior standing, checkpoint outcome). A max-timeframe breach
          from GOOD_STANDING with PASSING pace (67.74) and GPA (2.032) lands directly
          on SUSPENSION, skipping the WARNING rung that a pace/GPA failure would produce
          — proving the max_tf_exceeded override branch of the formula.
        test_recipe:
          setup:
            - "Program required_credits=200 (cap floor(200*1.5)=300); T1 seq 1, T2 seq 2; Student S"
            - "T1: attempted 200, earned 200, QP 600.0, gh 200 -> evaluated GOOD_STANDING"
            - "T2: attempted 110, earned 10, QP 30.0, gh 110 posted; grading closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BA-HIST", name: "History", required_credits: 200 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-3001", full_name: "Olive Override", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 200 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 200, quality_points: 600.0, gpa_hours: 200 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 110 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 10, quality_points: 30.0, gpa_hours: 110 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer, captures: { n_eval: $.data.evaluated_count, n_susp: $.data.suspension_count } }
            - call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}"
              as: AidOfficer
              captures: { ev_pace: "$.data[0].pace_pct", ev_gpa: "$.data[0].cumulative_gpa", ev_maxtf: "$.data[0].max_tf_exceeded", ev_prior: "$.data[0].prior_standing", ev_result: "$.data[0].result_standing" }
          assert:
            - "SapEvaluation(T2).pace_pct == 67.74 (210/310, PASSES >= 67.00)"
            - "SapEvaluation(T2).cumulative_gpa == 2.032 (630/310, PASSES >= 2.000)"
            - "SapEvaluation(T2).max_tf_exceeded == true (310 attempted + max(0, 200-210) remaining = 310 > 300)"
            - "SapEvaluation(T2).prior_standing == GOOD_STANDING and result_standing == SUSPENSION (no WARNING grace under max-TF breach)"
            - "evaluate response: evaluated_count == 1, suspension_count == 1"
            - "GET /sap/students/${stu}.sap_status == SUSPENSION"

      - name: cumulative_gpa_raw_sum_vs_term_rounded_recomposition
        grounds:
          - calculations.gpa_calculation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Cumulative GPA MUST be computed
          from raw sums (18.5/12 -> 1.542) and MUST NOT be recomposed from rounded
          per-term GPAs (1.533 x 3 + 1.544 x 9 over 12 -> 1.541); the two orders diverge
          at the third decimal on identical inputs. Sibling instance is mode (a).
        test_recipe:
          setup:
            - "Program required_credits=120; T1 seq 1, T2 seq 2; Student S"
            - "T1: attempted 3, earned 3, QP 4.6, gh 3 (term GPA rounds to 1.533) -> evaluated WARNING (GPA fail)"
            - "T2: attempted 9, earned 9, QP 13.9, gh 9 (term GPA rounds to 1.544) posted; grading closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-CHEM", name: "Chemistry", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-4001", full_name: "Rhea Rounding", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 3 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 4.6, gpa_hours: 3 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 9 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 9, quality_points: 13.9, gpa_hours: 9 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}"
              as: AidOfficer
              captures: { ev_gpa: "$.data[0].cumulative_gpa", ev_pace: "$.data[0].pace_pct", ev_result: "$.data[0].result_standing" }
          assert:
            - "SapEvaluation(T2).cumulative_gpa == 1.542 (raw sums (4.6+13.9)/12 = 18.5/12 rounded once)"
            - "SapEvaluation(T2).cumulative_gpa != 1.541 (the forbidden term-rounded recomposition)"
            - "SapEvaluation(T2).pace_pct == 100.0 and result_standing == SUSPENSION (prior WARNING + GPA 1.542 < 2.000)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_info_request_cycle_and_branching_decision
        grounds:
          - state_machines.Appeal.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Appeal.UNDER_REVIEW_to_MORE_INFO_REQUESTED
          - state_machines.Appeal.MORE_INFO_REQUESTED_to_SUBMITTED
          - state_machines.Appeal.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The Appeal machine is non-linear: UNDER_REVIEW -> MORE_INFO_REQUESTED ->
          SUBMITTED forms a cycle (info-request loop) before the branching decide fork
          (APPROVED vs DENIED). Sibling instance exercises the Student standing machine —
          a different entity.
        test_recipe:
          setup:
            - "Program required_credits=120; T1, T2; Student S suspended at T2 (T1: 3/6 earned QP 6.0 gh 6 -> WARNING; T2: 3/6 -> SUSPENSION)"
            - "Appeal A submitted against the T2 evaluation while clock is the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-BIO", name: "Biology", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-5001", full_name: "Cy Clerical", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MEDICAL", statement: "Hospitalized during finals", documents: [{ doc_type: "MEDICAL_RECORD", description: "Discharge summary" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer, captures: { st_screen: $.data.status } }
            - { call: "POST /sap/appeals/${ap}/request-info", payload: { info_request_note: "Need physician statement" }, as: AidOfficer, captures: { st_info: $.data.status } }
            - { call: "POST /sap/appeals/${ap}/resubmit", payload: { documents: [{ doc_type: "PHYSICIAN_STATEMENT", description: "Attending note" }] }, as: Student, as_user_id: "${stu}", captures: { st_resub: $.data.status } }
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer }
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "PROBATION_ONLY", rationale: "Documented medical hardship" }, as: CommitteeMember, captures: { st_dec: $.data.status } }
          assert:
            - "after screen: Appeal.status == UNDER_REVIEW"
            - "after request-info: Appeal.status == MORE_INFO_REQUESTED"
            - "after resubmit: Appeal.status == SUBMITTED (cycle closes)"
            - "second screen succeeds (loop is repeatable): Appeal.status == UNDER_REVIEW"
            - "after decide: Appeal.status == APPROVED and resolution == PROBATION_ONLY"
            - "GET /sap/students/${stu}.sap_status == PROBATION"

      - name: student_standing_warning_reinstatement_cycle
        grounds:
          - state_machines.Student.GOOD_STANDING_to_WARNING
          - state_machines.Student.WARNING_to_GOOD_STANDING
        distinguishing_aspect: |
          The Student standing machine is cyclic/branching: GOOD_STANDING -> WARNING on
          failure, then WARNING -> GOOD_STANDING on recovery (A->B->A loop without any
          appeal), with notifications only on actual standing change. Sibling instance
          exercises the Appeal machine — a different entity.
        test_recipe:
          setup:
            - "Program required_credits=120; T1, T2; Student S"
            - "T1: attempted 12, earned 6, QP 24.0, gh 12 (pace 50.00 fails, gpa 2.0 passes) -> WARNING"
            - "T2: attempted 12, earned 12, QP 48.0, gh 12 posted; grading closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BA-ENGL", name: "English", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-6001", full_name: "Wendy Warning", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 12 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 12, quality_points: 48.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t1}", as: AidOfficer, captures: { ev1_prior: "$.data[0].prior_standing", ev1_result: "$.data[0].result_standing" } }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2_prior: "$.data[0].prior_standing", ev2_result: "$.data[0].result_standing" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_status: $.data.sap_status, s_pace: $.data.pace_pct, s_gpa: $.data.cumulative_gpa } }
            - { call: "GET /sap/notifications?student_id=${stu}", as: AidOfficer }
          assert:
            - "SapEvaluation(T1): prior_standing == GOOD_STANDING, result_standing == WARNING"
            - "SapEvaluation(T2): prior_standing == WARNING, result_standing == GOOD_STANDING (cycle closes)"
            - "Student.sap_status == GOOD_STANDING, pace_pct == 75.0, cumulative_gpa == 3.0"
            - "notifications list: exactly 2 rows, both kind STANDING_CHANGE (no REINSTATEMENT from WARNING)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: term_evaluation_cascade_to_audit
        grounds:
          - state_machines.Term.GRADING_CLOSED_to_EVALUATED
          - state_machines.Student.GOOD_STANDING_to_WARNING
          - calculations.term_evaluation_pipeline
          - calculations.notification_cadence
        distinguishing_aspect: |
          Depth-4 chain from the evaluate trigger: evaluate mutates Term and creates
          SapEvaluation -> the evaluation reassigns Student.sap_status -> the standing
          change queues a Notification -> each queued notification appends AuditEvent
          rows. Every link is caused by the previous link, and the audit trail is
          observable via GET /sap/audit-events. Sibling cascade originates from the
          appeal-decide trigger instead.
        test_recipe:
          setup:
            - "Program required_credits=120; T1 seq 1; Student S; enrollment attempted 12 POSTED earned 6 / QP 24.0 / gh 12; grading closed"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-PHYS", name: "Physics", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-7001", full_name: "Cal Cascade", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer, captures: { n_eval: $.data.evaluated_count, n_warn: $.data.warning_count } }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t1}", as: AidOfficer, captures: { ev_status: "$.data[0].status", ev_result: "$.data[0].result_standing" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_status: $.data.sap_status } }
            - { call: "GET /sap/notifications?student_id=${stu}", as: AidOfficer, captures: { n0_kind: "$.data[0].kind", n0_status: "$.data[0].status", n0_sched: "$.data[0].scheduled_at" } }
            - { call: "GET /sap/audit-events?student_id=${stu}", as: Auditor }
          assert:
            - "evaluate response: evaluated_count == 1, warning_count == 1"
            - "SapEvaluation exists with status OFFICIAL and result_standing WARNING (hop 1)"
            - "Student.sap_status == WARNING (hop 2, caused by the evaluation)"
            - "exactly 1 Notification: kind STANDING_CHANGE, status QUEUED, scheduled_at == 2026-08-01T00:00:00Z (hop 3, caused by hop 2)"
            - "audit-events for the student: total_count == 6 with actions STUDENT_CREATED, ENROLLMENT_CREATED, ENROLLMENT_POSTED, EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED (hop 4, one event per mutation)"

      - name: appeal_decision_cascade_to_notification
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_APPROVED
          - state_machines.Student.SUSPENSION_to_PLAN_PENDING
          - calculations.notification_cadence
        distinguishing_aspect: |
          Depth-3 chain from the decide trigger (a different trigger than the evaluation
          run of the sibling): decide mutates Appeal -> APPROVED+WITH_PLAN mutates
          Student.sap_status SUSPENSION -> PLAN_PENDING -> the standing change queues an
          APPEAL_DECISION Notification -> audit rows record each hop. Also verifies the
          branch-specific side effect (PROBATION vs PLAN_PENDING).
        test_recipe:
          setup:
            - "Program required_credits=120; T1, T2; Student S suspended at T2 (T1 3/6 QP 6.0 gh 6 -> WARNING; T2 3/6 QP 6.0 gh 6 -> SUSPENSION)"
            - "Appeal submitted and screened (UNDER_REVIEW)"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-NURS", name: "Nursing", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-8001", full_name: "Dee Cision", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "FAMILY_EMERGENCY", statement: "Caretaker for ill parent", documents: [{ doc_type: "AFFIDAVIT", description: "Family affidavit" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer }
          trigger:
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "WITH_PLAN", rationale: "Committee approval contingent on plan" }, as: CommitteeMember, captures: { ap_status: $.data.status, ap_res: $.data.resolution } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_status: $.data.sap_status } }
            - { call: "GET /sap/notifications?student_id=${stu}&kind=APPEAL_DECISION", as: AidOfficer, captures: { nd_status: "$.data[0].status" } }
            - { call: "GET /sap/audit-events?student_id=${stu}", as: Auditor }
          assert:
            - "Appeal.status == APPROVED and resolution == WITH_PLAN (hop 1)"
            - "Student.sap_status == PLAN_PENDING (hop 2, caused by the approval; not PROBATION)"
            - "an APPEAL_DECISION notification exists with status QUEUED (hop 3, caused by hop 2)"
            - "audit-events for the student: total_count == 18 and include actions APPEAL_SUBMITTED, APPEAL_SCREENED, APPEAL_DECIDED, STANDING_CHANGED, NOTIFICATION_QUEUED"
            - "no AcademicPlan exists yet (plan creation is a separate explicit POST, not part of the cascade): GET /sap/plans?student_id=${stu} total_count == 0"

