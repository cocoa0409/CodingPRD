            - "Circuit.${cb_id}.spof_flag == true (the surviving LEG_B circuit)"
            - "Circuit.${ca_id}.spof_flag == false (the tested leg is not the single point of failure)"
            - "ApplicationPath.${pp_id}.posture == PROTECTED and healthy_leg_count == 2 (the tested leg was restored)"

      - name: corner_ticket_reopen_cycle_recomputes_restoration
        claim_type: cyclic
        grounds:
          - state_machines.CarrierTicket.RESTORED_PENDING_CONFIRM_to_REOPENED
        excluded_because:
          difficulty_instance: non_linear_state_machine / carrier_ticket_reopened_cycle_reclears_and_recomputes_restoration
          rationale: "The loop back through REOPENED, its reopen_count counter and the recomputation on the second restoration are the whole subject of the named §1.8 instance."

      - name: corner_incident_two_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Incident.escalation_state_dimension
        excluded_because:
          difficulty_instance: non_linear_state_machine / incident_escalation_dimension_de_escalates_on_mitigated
          rationale: "Independent advancement of response_state and escalation_state plus the one-step coupling is asserted end-to-end by the named §1.8 instance."

      - name: corner_guarded_transition_ticket_open_requires_monitoring
        claim_type: guarded_transitions
        grounds:
          - validations[priority=62]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / carrier_ticket_open_requires_monitored_circuit_not_suppressed
          rationale: "The cross-entity guard on Circuit.monitoring_state is exactly the negative-then-positive pair asserted by the named §1.8 instance."

