          trigger:
            - call: "POST /population-health/care-gaps/${gap_id}/outreach-attempts"
              payload: { campaign_id: "${camp_id}", channel: "CALL", outcome: "NO_ANSWER", expected_care_gap_version: "${gap_v2}" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE  # priority 4 wins over priority 6"

      - name: exclusion_safety_vs_referential
        grounds:
          - validations[priority=16]
          - validations[priority=18]
          - errors[ERR_SOD_VIOLATION]
