scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: revenue_share_gross_vs_net_basis
        grounds:
          - calculations.revenue_share_settlement
          - entities.Venue.fields.share_basis
          - entities.Event.fields.gross_sales_cents
          - entities.Event.fields.waste_cost_cents
          - state_machines.Event.IN_PROGRESS_to_SETTLED
        distinguishing_aspect: |
          Domain is Venue/Event revenue. Same gross_sales_cents=4922 and
          waste_cost_cents=300 produce venue_share_cents=984 under GROSS basis
          but 924 under NET basis — divergence comes from whether waste is
          subtracted from the share base, a Venue-level contract toggle.
        test_recipe:
          setup:
            - "Two venues identical except share_basis (V_GROSS=GROSS, V_NET=NET), both venue_share_pct=20, service_fee_pct=7."
            - "Under each venue: one event (mult 100), doors open, one MID stand opened with staff, one hotdog product (base 1000) on the menu, one bun product stocked one lot of 100@30."
            - "One order of 4 hotdogs is placed/paid/readied/picked-up (gross_sales=4922), and a SPILLAGE waste of 10 buns is logged (waste_cost=300)."
            - "Stand is closed, event settled, RevenueShareStatement produced under each basis."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "GrossVenue", venue_share_pct: 20, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 7 }
              as: ConcessionsManager
              captures: { vg_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vg_id}", sku: "HOTDOG", name: "Hot Dog", base_price_cents: 1000, unit_cost_cents: 200, perishable: false }
              as: ConcessionsManager
              captures: { hot_g_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vg_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { bun_g_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vg_id}", name: "EvtG", doors_time: "2026-06-01T18:00:00.000Z", end_time: "2026-06-01T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evg_id: $.data.id }
            - call: "POST /concessions/events/${evg_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evg_id}", name: "StandG", demand_tier: "MID", expected_orders_per_hour: 80 }
              as: ConcessionsManager
              captures: { stg_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stg_id}", worker_name: "Ada", shift_start: "2026-06-01T18:00:00.000Z", shift_end: "2026-06-01T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shg_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shg_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stg_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stg_id}", product_id: "${hot_g_id}", available: true }
              as: ConcessionsManager
              captures: { mig_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stg_id}", product_id: "${hot_g_id}", received_qty: 50, unit_cost_cents: 200, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stg_id}", product_id: "${bun_g_id}", received_qty: 100, unit_cost_cents: 30, par_level: 100, reorder_point: 20 }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "PatG" }
              as: Patron
              captures: { pat_g_id: $.data.id }
            - call: "POST /concessions/orders"
              payload: { event_id: "${evg_id}", stand_id: "${stg_id}", patron_id: "${pat_g_id}" }
              as: Patron
              as_user_id: "${pat_g_id}"
              captures: { org_id: $.data.id }
            - call: "POST /concessions/orders/${org_id}/lines"
              payload: { menu_item_id: "${mig_id}", qty: 4 }
              as: Patron
              as_user_id: "${pat_g_id}"
            - call: "POST /concessions/orders/${org_id}/place"
              payload: {}
              as: Patron
              as_user_id: "${pat_g_id}"
            - call: "POST /concessions/orders/${org_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${pat_g_id}"
            - call: "GET /concessions/stands/${stg_id}"
              payload: {}
              as: StandOperator
              captures: { stg_v: $.data.version }
            - call: "POST /concessions/orders/${org_id}/ready"
              payload: { expected_stand_version: "${stg_v}" }
              as: StandOperator
            - call: "POST /concessions/orders/${org_id}/pickup"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/waste-records"
              payload: { stand_id: "${stg_id}", product_id: "${bun_g_id}", reason: "SPILLAGE", qty: 10 }
              as: StockRunner
            - call: "POST /concessions/stands/${stg_id}/close"
              payload: {}
              as: StandOperator
          trigger:
            - call: "POST /concessions/events/${evg_id}/settle"
              payload: {}
              as: ConcessionsManager
              captures: { stmt_g_id: $.data.id }
          assert:
            - "RevenueShareStatement.${stmt_g_id}.gross_sales_cents == 4922"
            - "RevenueShareStatement.${stmt_g_id}.waste_cost_cents == 300"
            - "RevenueShareStatement.${stmt_g_id}.venue_share_cents == 984"
            - "RevenueShareStatement.${stmt_g_id}.operator_net_cents == 3938"

      - name: spoilage_fifo_vs_weighted_avg_costing
        grounds:
          - calculations.spoilage_valuation
          - entities.Venue.fields.spoilage_valuation
          - entities.InventoryLot.fields.unit_cost_cents
          - entities.WasteRecord.fields.cost_cents
          - entities.WasteRecord.fields.reason
        distinguishing_aspect: |
          Domain is InventoryLot/waste costing (different entity domain from the
          revenue instance). Same SPILLAGE of 120 buns drawn from two lots
          (100@30 older, 100@50 newer) costs 4000 under FIFO but 4800 under
          WEIGHTED_AVG — divergence comes from lot-ordering vs blended unit cost.
        test_recipe:
          setup:
            - "Venue V_WAVG with spoilage_valuation=WEIGHTED_AVG; one event/stand opened with staff."
            - "Two bun lots at the stand: lot A 100 units @ 30c created first, lot B 100 units @ 50c created second."
            - "A SPILLAGE waste of 120 buns is logged; cost is computed by the weighted-average variant."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "WavgVenue", venue_share_pct: 20, share_basis: "GROSS", spoilage_valuation: "WEIGHTED_AVG", service_fee_pct: 7 }
              as: ConcessionsManager
              captures: { vw_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vw_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: true }
              as: ConcessionsManager
              captures: { bun_w_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vw_id}", name: "EvtW", doors_time: "2026-06-02T18:00:00.000Z", end_time: "2026-06-02T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evw_id: $.data.id }
            - call: "POST /concessions/events/${evw_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evw_id}", name: "StandW", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stw_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stw_id}", worker_name: "Bob", shift_start: "2026-06-02T18:00:00.000Z", shift_end: "2026-06-02T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shw_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shw_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stw_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stw_id}", product_id: "${bun_w_id}", received_qty: 100, unit_cost_cents: 30, par_level: 200, reorder_point: 20 }
              as: StockRunner
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stw_id}", product_id: "${bun_w_id}", received_qty: 100, unit_cost_cents: 50, par_level: 200, reorder_point: 20 }
              as: StockRunner
          trigger:
            - call: "POST /concessions/waste-records"
              payload: { stand_id: "${stw_id}", product_id: "${bun_w_id}", reason: "SPILLAGE", qty: 120 }
              as: StockRunner
              captures: { wr_w_id: $.data.id }
          assert:
            - "WasteRecord.${wr_w_id}.cost_cents == 4800"
            - "Event.${evw_id}.waste_cost_cents == 4800"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: event_day_pricing_multiplicative_surge_selection
        grounds:
          - calculations.event_day_item_pricing
          - entities.Stand.fields.demand_tier
          - entities.Event.fields.event_multiplier_pct
          - entities.Event.fields.peak_window
          - entities.MenuItem.fields.price_cents
        distinguishing_aspect: |
          Mode (a): three multiplicative inputs (base 850, event multiplier 120,
          surge selected from demand_tier=HIGH plus a conditional PEAK_BONUS).
          Off-peak price 1326 = round(850*1.20*1.30); after peak window opens it
          becomes 1428 = round(850*1.20*1.40). State-conditional surge selection.
        test_recipe:
          setup:
            - "Venue, hotdog product base_price_cents=850, event with multiplier 120, doors open, stand demand_tier=HIGH with staff opened."
            - "Menu item created (off-peak price computed), then the event's peak window is opened."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "PriceVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vp_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vp_id}", sku: "HOTDOG", name: "Hot Dog", base_price_cents: 850, unit_cost_cents: 200, perishable: false }
              as: ConcessionsManager
              captures: { hot_p_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vp_id}", name: "EvtP", doors_time: "2026-06-03T18:00:00.000Z", end_time: "2026-06-03T23:00:00.000Z", event_multiplier_pct: 120 }
              as: ConcessionsManager
              captures: { evp_id: $.data.id }
            - call: "POST /concessions/events/${evp_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evp_id}", name: "StandP", demand_tier: "HIGH", expected_orders_per_hour: 160 }
              as: ConcessionsManager
              captures: { stp_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stp_id}", worker_name: "Cory", shift_start: "2026-06-03T18:00:00.000Z", shift_end: "2026-06-03T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shp_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shp_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stp_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stp_id}", product_id: "${hot_p_id}", available: true }
              as: ConcessionsManager
              captures: { mip_id: $.data.id }
          trigger:
            - call: "POST /concessions/events/${evp_id}/peak-window/open"
              payload: {}
              as: ConcessionsManager
            - call: "GET /concessions/menu-items/${mip_id}"
              payload: {}
              as: ConcessionsManager
              captures: { mip_price: $.data.price_cents }
          assert:
            - "MenuItem.${mip_id}.price_cents == 1428"

      - name: order_total_round_per_line_then_sum
        grounds:
          - calculations.order_totals
          - entities.Venue.fields.service_fee_pct
          - entities.OrderLine.fields.line_fee_cents
          - entities.Order.fields.service_fee_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Three lines each
          subtotal 50, service_fee_pct=9 → per-line fee round(4.5)=5, summed to
          service_fee_cents=15 and total_cents=165. 'Sum then round' would give
          round(13.5)=14 → total 164; the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Venue service_fee_pct=9; event/stand opened with staff; a 50c product on the menu; an order with three separate lines of qty 1 each."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "RoundVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 9 }
              as: ConcessionsManager
              captures: { vr_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vr_id}", sku: "WATER", name: "Water", base_price_cents: 50, unit_cost_cents: 10, perishable: false }
              as: ConcessionsManager
              captures: { wat_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vr_id}", name: "EvtR", doors_time: "2026-06-04T18:00:00.000Z", end_time: "2026-06-04T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evr_id: $.data.id }
            - call: "POST /concessions/events/${evr_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evr_id}", name: "StandR", demand_tier: "LOW", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { str_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${str_id}", worker_name: "Dee", shift_start: "2026-06-04T18:00:00.000Z", shift_end: "2026-06-04T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shr_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shr_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${str_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${str_id}", product_id: "${wat_id}", available: true }
              as: ConcessionsManager
              captures: { mir_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${str_id}", product_id: "${wat_id}", received_qty: 50, unit_cost_cents: 10, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "PatR" }
              as: Patron
              captures: { pat_r_id: $.data.id }
            - call: "POST /concessions/orders"
              payload: { event_id: "${evr_id}", stand_id: "${str_id}", patron_id: "${pat_r_id}" }
              as: Patron
              as_user_id: "${pat_r_id}"
              captures: { orr_id: $.data.id }
            - call: "POST /concessions/orders/${orr_id}/lines"
              payload: { menu_item_id: "${mir_id}", qty: 1 }
              as: Patron
              as_user_id: "${pat_r_id}"
            - call: "POST /concessions/orders/${orr_id}/lines"
              payload: { menu_item_id: "${mir_id}", qty: 1 }
              as: Patron
              as_user_id: "${pat_r_id}"
            - call: "POST /concessions/orders/${orr_id}/lines"
              payload: { menu_item_id: "${mir_id}", qty: 1 }
              as: Patron
              as_user_id: "${pat_r_id}"
          trigger:
            - call: "POST /concessions/orders/${orr_id}/place"
              payload: {}
              as: Patron
              as_user_id: "${pat_r_id}"
              captures: { orr_total: $.data.total_cents }
          assert:
            - "Order.${orr_id}.subtotal_cents == 150"
            - "Order.${orr_id}.service_fee_cents == 15"
            - "Order.${orr_id}.total_cents == 165"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
          - state_machines.Order.fulfillment_PLACED_to_READY
        distinguishing_aspect: |
          Order carries two independent state axes: paying advances
          payment_status UNPAID→PAID without touching fulfillment_status
          (stays PLACED), proving the dimensions evolve independently on the
          same row before fulfillment continues to READY.
        test_recipe:
          setup:
            - "Event/stand opened with staff, water product on menu and stocked, an order placed (fulfillment PLACED, payment UNPAID)."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "ParVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vpar_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vpar_id}", sku: "WATER", name: "Water", base_price_cents: 100, unit_cost_cents: 10, perishable: false }
              as: ConcessionsManager
              captures: { wpar_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vpar_id}", name: "EvtPar", doors_time: "2026-06-05T18:00:00.000Z", end_time: "2026-06-05T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evpar_id: $.data.id }
            - call: "POST /concessions/events/${evpar_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evpar_id}", name: "StandPar", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stpar_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stpar_id}", worker_name: "Eli", shift_start: "2026-06-05T18:00:00.000Z", shift_end: "2026-06-05T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shpar_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shpar_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stpar_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stpar_id}", product_id: "${wpar_id}", available: true }
              as: ConcessionsManager
              captures: { mipar_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stpar_id}", product_id: "${wpar_id}", received_qty: 50, unit_cost_cents: 10, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "PatPar" }
              as: Patron
              captures: { patpar_id: $.data.id }
            - call: "POST /concessions/orders"
              payload: { event_id: "${evpar_id}", stand_id: "${stpar_id}", patron_id: "${patpar_id}" }
              as: Patron
              as_user_id: "${patpar_id}"
              captures: { orpar_id: $.data.id }
            - call: "POST /concessions/orders/${orpar_id}/lines"
              payload: { menu_item_id: "${mipar_id}", qty: 2 }
              as: Patron
              as_user_id: "${patpar_id}"
            - call: "POST /concessions/orders/${orpar_id}/place"
              payload: {}
              as: Patron
              as_user_id: "${patpar_id}"
          trigger:
            - call: "POST /concessions/orders/${orpar_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patpar_id}"
              captures: { orpar_pay: $.data.payment_status, orpar_ful: $.data.fulfillment_status }
          assert:
            - "Order.${orpar_id}.payment_status == PAID"
            - "Order.${orpar_id}.fulfillment_status == PLACED"

      - name: stand_open_suspend_open_revert_cycle
        grounds:
          - state_machines.Stand
          - state_machines.Stand.OPEN_to_SUSPENDED
          - state_machines.Stand.SUSPENDED_to_OPEN
          - entities.Stand.fields.status
        distinguishing_aspect: |
          Stand (a different entity from Order) cycles OPEN→SUSPENDED→OPEN: the
          SUSPENDED→OPEN edge returns the stand to a previously-visited state,
          a revert loop no linear pipeline permits.
        test_recipe:
          setup:
            - "Event/stand opened with staff (stand OPEN)."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "CycVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vcyc_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vcyc_id}", name: "EvtCyc", doors_time: "2026-06-06T18:00:00.000Z", end_time: "2026-06-06T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evcyc_id: $.data.id }
            - call: "POST /concessions/events/${evcyc_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evcyc_id}", name: "StandCyc", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stcyc_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stcyc_id}", worker_name: "Fay", shift_start: "2026-06-06T18:00:00.000Z", shift_end: "2026-06-06T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shcyc_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shcyc_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stcyc_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stcyc_id}/suspend"
              payload: {}
              as: StandOperator
          trigger:
