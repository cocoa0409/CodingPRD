        distinguishing_aspect: "Two PERMIT_ISSUE_FEE invoices issued in the same clock instant sit at the same stage (CURRENT) with the same due_on 2026-08-31, so only created_at ASC can order them: a 6000-cent payment fills the first invoice completely (5500) before giving the remaining 500 to the second, and the id ordering is never consulted."
