        grounds:
          - calculations.record_suppression_sweep
          - entities.ScreeningRecord.fields.status
          - entities.ScreeningRecord.fields.suppression_reason
        distinguishing_aspect: |
          Date boundary on a different metric (record age) through a different endpoint (record-searches):
          with clock 2026-08-01 and the CA 7-year eviction lookback (cutoff 2019-08-01), a record dated
          exactly 2019-08-01 is NOT strictly older and stays INCLUDED, while one dated 2019-07-31 is
          SUPPRESSED with LOOKBACK_EXPIRED.
        test_recipe:
          setup:
            - "CA rule (eviction_lookback_years 7); landlord with published criteria; one consented, identity-verified, SUBMITTED CA application"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /api/jurisdiction-rules", payload: { state_code: "CA", criminal_lookback_years: 7, eviction_lookback_years: 7, source_of_income_protected: false, portable_report_acceptance_required: true, effective_from: "2020-01-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Cut", contact_email: "lcut@x.com" }
