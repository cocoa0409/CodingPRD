        excluded_because:
          difficulty_instance: tier_boundary_unit_at_exact_threshold
          rationale: "Cumulative-unit tier threshold (strictly-greater) asserted by the named §1.8 instance; the 85% budget-posture threshold is asserted by §1.9 budget_posture_at_risk_threshold."

