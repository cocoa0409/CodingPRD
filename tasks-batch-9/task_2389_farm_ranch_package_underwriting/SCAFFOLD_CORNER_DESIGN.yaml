      - name: corner_inspector_day_capacity_then_inactive_status
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "calculations.inspector_day_load", "errors.ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED", "errors.ERR_INSPECTOR_INACTIVE"]
        distinguishing_aspect: "With a 240-minute inspector already holding 120 booked minutes, a 180-minute request is ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED (409) while a 120-minute request at the same start instant fits exactly; deactivating the inspector then yields ERR_INSPECTOR_INACTIVE (422) on a window that breaks no calendar rule."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy, one ACTIVE Inspector with daily_capacity_minutes 240, one SCHEDULED 120-minute inspection at 2026-08-16T09:00:00Z"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - *k_item
            - call: "POST /inspectors"
              payload: { full_name: "Marta Kell", region_code: "KS-WEST", daily_capacity_minutes: 240 }
              as: PlatformAdmin
              captures: { insp_cap: $.data.id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_cap}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { ins_first: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_cap}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T13:30:00Z", duration_minutes: 180 }
              as: Underwriter
              captures: { e_cap: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_cap}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T13:30:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { ins_second: $.data.id }
            - call: "PATCH /inspectors/${insp_cap}"
              payload: { status: "INACTIVE" }
              as: PlatformAdmin
              captures: { insp_off: $.data.status }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_cap}", inspection_type: "INITIAL", scheduled_for: "2026-08-18T09:00:00Z", duration_minutes: 60 }
              as: ComplianceOfficer
              captures: { e_inactive: $.data.error_id }
          assert:
            - "the 180-minute request returns HTTP 409 ERR_INSPECTOR_DAY_CAPACITY_EXCEEDED: booked 120 + 180 = 300 > 240"
            - "it clears the window check first — 13:30 is after the existing 11:00 end plus the 90-minute buffer (12:30) — so the 409 comes from the capacity rule and not from ERR_INSPECTOR_WINDOW_CONFLICT"
            - "the 120-minute request at the same start succeeds because 120 + 120 == 240 exactly"
            - "the final request on a free, conflict-free day returns HTTP 422 ERR_INSPECTOR_INACTIVE, confirming the inactive check runs after the window and capacity checks"
            - "the already-SCHEDULED inspections ${ins_first} and ${ins_second} are untouched by the deactivation"

      - name: corner_chemical_buyback_needs_custom_farming_exposure
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors.ERR_ENDORSEMENT_EXPOSURE_MISSING", "state_machines.Endorsement[REQUESTED->APPROVED]"]
        distinguishing_aspect: "A CHEMICAL_APPLICATION_BUYBACK clears both priority-11 buy-back gates (a COMPLETED inspection at hazard 10) and still fails at priority 12 with ERR_ENDORSEMENT_EXPOSURE_MISSING (422) until a CUSTOM_FARMING exposure exists — and adding that exposure reverts the policy to DRAFT, so it must be re-rated before the approval can land."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING rated to 269200, one Inspector, one inspection completed with an empty findings array (hazard 10, compliance COMPLIANT), one REQUESTED CHEMICAL_APPLICATION_BUYBACK endorsement with sublimit 5000000, and no liability exposure at all"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_inspector
            - *k_inspection
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "clean risk", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { clean_hazard: $.data.hazard_score }
            - *k_rate_get
            - *k_rate
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v_chem: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v_chem}", form_code: "CHEMICAL_APPLICATION_BUYBACK", sublimit_cents: 5000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { end_chem: $.data.id, chem_ri: $.data.requires_inspection }
          trigger:
            - call: "POST /endorsements/${end_chem}/decision"
              payload: { decision: "APPROVE", decision_note: "spray operations" }
              as: Underwriter
              captures: { e_expo: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/liability-exposures"
              payload: { exposure_type: "CUSTOM_FARMING", annual_receipts_cents: 15000000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { ex_cf2: $.data.id }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v_rerate: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v_rerate}" }
              as: Underwriter
              captures: { rerated_total: $.data.total_premium_cents }
            - call: "POST /endorsements/${end_chem}/decision"
              payload: { decision: "APPROVE", decision_note: "spray operations, custom farming now scheduled" }
