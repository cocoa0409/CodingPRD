            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAT_LEAKAGE", failure_description: "passing", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 10 }, as: IntakeCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /repair-orders/${ro}/start-teardown", payload: {}, as: IntakeCoordinator }
            - { call: "POST /repair-orders/${ro}/inspection-reports", payload: { findings_summary: "seat scored", recommended_action: "REPAIR", estimated_labor_hours: 2, part_lines: [] }, as: Inspector, captures: { rep: $.data.id } }
            - { call: "POST /inspection-reports/${rep}/finalize", payload: {}, as: Inspector }
            - { call: "GET /repair-orders/${ro}", payload: {}, as: ServiceManager, captures: { ro_v: $.data.version } }
            - { call: "POST /quotes", payload: { repair_order_id: "${ro}", capacity_window_id: "${win}", labor_hours: 2, labor_rate_cents: 20000, part_lines: [], expected_repair_order_version: "${ro_v}" }, as: ServiceManager, captures: { q: $.data.id } }
