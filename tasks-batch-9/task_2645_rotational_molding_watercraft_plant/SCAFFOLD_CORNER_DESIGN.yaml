            - *cd2_clock0
            - *cd2_pm
            - *cd2_pm3
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - &cd2_whf
              call: "POST /warehouses"
              payload: { site_code: "WH-CD-F", footprint_capacity_cube_m3: 2.1000, zones: [{ zone_code: "Z-F", capacity_cube_m3: 2.1000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { whf: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-CD-F", product_model_id: "${pm}", target_warehouse_id: "${whf}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pof: $.data.id }
            - call: "POST /production-orders/${pof}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pof_v: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${pof}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${pof_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cycf: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cycf}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - *cd2_clk0900
            - call: "POST /molding-cycles/${cycf}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - *cd2_clk1000
            - call: "POST /molding-cycles/${cycf}/enter-cooling"
              payload: { actual_oven_end_at: "2026-08-01T10:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - *cd2_clk1035
            - call: "POST /molding-cycles/${cycf}/demold"
