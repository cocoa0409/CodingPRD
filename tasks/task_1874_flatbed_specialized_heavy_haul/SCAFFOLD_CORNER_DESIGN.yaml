# =============================================================================
# Task 1874: Flatbed & Specialized Heavy Haul - Section 1.9 Scaffold Corner Design
# Breadth coverage: every testable claim of SCAFFOLD.yaml section 1.1-1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already cover. Section/claim_type
# vocabulary follows references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.Customer.fields.status, entities.Customer.fields.outstanding_balance_cents, response_envelope]
        distinguishing_aspect: "A created customer starts ACTIVE with outstanding 0 and version 1, inside the fixed envelope (meta.api_request_id, response_type object)."
        test_recipe:
          setup: ["PlatformAdmin available; no customers exist"]
          setup_api_calls: []
          trigger:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Envelope Co", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { c_id: "$.data.id", c_status: "$.data.status", c_out: "$.data.outstanding_balance_cents", c_ver: "$.data.version" } }
          assert:
            - "c_status == ACTIVE and c_out == 0 and c_ver == 1"
            - "c_id is a server-minted UUID (no client control over identity)"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == object"

      - name: shipper_load_creation_owner_defaults
        claim_type: defaults
        grounds: [entities.Load.fields.customer_id, entities.Load.fields.cargo_requires_tarp, entities.Load.fields.declared_value_cents, entities.Load.fields.status]
        distinguishing_aspect: "Load creation derives customer_id from X-User-ID (never from the body), applies defaults false/0, and lands in DRAFT with survey_result null."
        test_recipe:
          setup: ["Customer registered"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Default Shippers", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crated pump", gross_weight_lbs: 30000, width_in: 96, height_in: 60, length_in: 300, origin: "Bakersfield CA", destination: "Fresno CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { l_cust: "$.data.customer_id", l_status: "$.data.status", l_tarp: "$.data.cargo_requires_tarp", l_value: "$.data.declared_value_cents", l_survey: "$.data.survey_result", l_ver: "$.data.version" } }
          assert:
            - "l_cust == ${cust_id} (ownership bound from the header, not the payload)"
            - "l_status == DRAFT (initial state) and l_ver == 1"
            - "l_tarp == false and l_value == 0 (documented defaults applied)"
            - "l_survey == null (no survey recorded yet)"

      - name: load_list_pagination_and_shipper_scope
        claim_type: listing
        grounds: [endpoints.GET_loads, response_envelope.pagination_fields, "validations[priority=4]"]
        distinguishing_aspect: "List pagination honors limit/offset with total_count and has_more, and a Shipper caller is auto-scoped to loads of their own customer_id even without a filter."
        test_recipe:
          setup: ["Customer A with 3 loads; customer B with 1 load"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Pager A", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_a: "$.data.id" } }
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Pager B", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_b: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "A1", gross_weight_lbs: 30000, width_in: 96, height_in: 60, length_in: 300, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_a}" }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "A2", gross_weight_lbs: 30000, width_in: 96, height_in: 60, length_in: 300, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_a}" }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "A3", gross_weight_lbs: 30000, width_in: 96, height_in: 60, length_in: 300, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_a}" }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "B1", gross_weight_lbs: 30000, width_in: 96, height_in: 60, length_in: 300, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_b}" }
          trigger:
            - { call: "GET /heavy-haul/loads", payload: { customer_id: "${cust_a}", limit: 2, offset: 0 }, as: BillingClerk }
            - { call: "GET /heavy-haul/loads", payload: { customer_id: "${cust_a}", limit: 2, offset: 2 }, as: BillingClerk }
            - { call: "GET /heavy-haul/loads", payload: {}, as: Shipper, as_user_id: "${cust_a}", captures: { first_cust: "$.data[0].customer_id" } }
          assert:
            - "page 1 (limit 2, offset 0) returns 2 items with total_count == 3 and has_more == true"
            - "page 2 (limit 2, offset 2) returns 1 item with total_count == 3 and has_more == false"
            - "Shipper-scoped list (no filter param) returns only customer A loads: first_cust == ${cust_a} and B's load is absent"

      - name: missing_resources_return_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Unknown ids at any path depth return 404 ERR_NOT_FOUND - top-level (load) and action on a missing child (permit file) alike."
        test_recipe:
          setup: ["One customer exists (system initialized)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Ghost Hunt", credit_limit_cents: 500000 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /heavy-haul/loads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Dispatcher, captures: { err1: "$.data.error_id" } }
            - { call: "POST /heavy-haul/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/file", payload: {}, as: PermitClerk, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_NOT_FOUND with http 404"
            - "err2 == ERR_NOT_FOUND with http 404 (existence validated before any state logic)"

      - name: load_create_missing_required_weight_rejected
        claim_type: required_fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]", entities.Load.fields.gross_weight_lbs]
        distinguishing_aspect: "Omitting the required input field gross_weight_lbs yields ERR_INVALID_REQUEST (400) - computed/system fields cannot be smuggled in either."
        test_recipe:
          setup: ["Customer registered"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Forgetful Freight", credit_limit_cents: 500000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Mystery box", width_in: 96, height_in: 60, length_in: 300, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (missing required gross_weight_lbs)"

      - name: computed_flags_after_plan
        claim_type: computed_fields
        grounds: [entities.Load.fields.is_oversize, entities.Load.fields.is_overweight, entities.Load.fields.is_superload, entities.Load.fields.required_axles, entities.Load.fields.overall_height_in, calculations.trailer_selection_check]
        distinguishing_aspect: "Classification fields are null before planning and computed by the plan call: 85000 lbs + 150 in wide on EXTENDABLE_DOUBLE_DROP yields is_oversize true, is_overweight true, is_superload false, required_axles 5, overall_height_in 122."
        test_recipe:
          setup: ["Customer + load 85000 lbs, 150x100x400 in"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Computed Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Oven", gross_weight_lbs: 85000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id", pre_os: "$.data.is_oversize" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "T. Ray", driver_oversize_endorsed: true }, as: Dispatcher, captures: { os: "$.data.is_oversize", ow: "$.data.is_overweight", sl: "$.data.is_superload", ax: "$.data.required_axles", oh: "$.data.overall_height_in" } }
          assert:
            - "pre_os == null (classification does not exist before planning)"
            - "os == true (width 150 > 102), ow == true (85000 > 80000), sl == false (<= 150000 lbs and <= 192 in)"
            - "ax == 5 (max(2, ceil(85000/20000))) and oh == 122 (100 + deck 22)"

      - name: scale_ticket_immutability
        claim_type: immutability
        grounds: [entities.ScaleTicket]
        distinguishing_aspect: "ScaleTicket carries common_fields: false - its response exposes id and created_at but no version or updated_at, and no update/delete endpoint exists in section 1.5."
        test_recipe:
          setup: ["STANDARD load 40000 lbs CLEARED (plan, survey, cranes, securement approved)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Weigh Co", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Pipe bundles", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "U. Finn", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/scale-tickets", payload: { measured_gross_lbs: 40500, weighed_at: "2026-08-12T07:00:00Z" }, as: Driver, captures: { st_viol: "$.data.is_violation", st_excess: "$.data.excess_lbs" } }
          assert:
            - "st_viol == false and st_excess == 500 (40500 vs declared 40000; 4050000 <= 4120000)"
            - "response data contains id and created_at but no version or updated_at key (immutable event)"
            - "no PUT/PATCH/DELETE endpoint exists for scale-tickets in the API surface"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_in_transit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Load, "errors[ERR_LOAD_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel from IN_TRANSIT is outside the cancellable set {DRAFT, PLANNED, SURVEYED, CLEARED, ON_HOLD} and fails with ERR_LOAD_NOT_CANCELLABLE; no child is touched."
        test_recipe:
          setup: ["STANDARD load 40000 lbs IN_TRANSIT (departed 2026-08-12T10:00Z)"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Transit Cancel Co", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Crates", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "V. Day", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_id}/depart", payload: {}, as: Driver }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/cancel", payload: {}, as: Shipper, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_LOAD_NOT_CANCELLABLE (IN_TRANSIT is outside the cancellable set)"
            - "load remains IN_TRANSIT after the rejected cancel (GET verifies no drift)"

      - name: delivered_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Load, "errors[ERR_LOAD_INVALID_STATE]", "errors[ERR_LOAD_NOT_CANCELLABLE]"]
        distinguishing_aspect: "DELIVERED and CANCELLED are terminal: plan, survey, and depart are rejected with ERR_LOAD_INVALID_STATE and cancel with ERR_LOAD_NOT_CANCELLABLE from both terminal states."
        test_recipe:
          setup: ["Load X DELIVERED (full STANDARD chain); load Y CANCELLED from DRAFT"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Terminal Co", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "X", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_x: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_x}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "W. Eve", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_x}/survey", payload: { route_miles: 100, states_crossed: ["OR"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_x}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_x}/crane-appointments", payload: { site: "DESTINATION", crane_id: "CRANE-B", window_start: "2026-08-13T06:00:00Z", window_end: "2026-08-13T08:00:00Z" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_x}/securement-plans", payload: { method: "STRAPS", tiedown_count: 2, wll_per_tiedown_lbs: 10000 }, as: Dispatcher, captures: { sp_x: "$.data.id" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_x}/approve", payload: {}, as: SafetyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /heavy-haul/loads/${load_x}/depart", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads/${load_x}/arrive", payload: {}, as: Driver }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Y", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_y: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_y}/cancel", payload: {}, as: Shipper, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_x}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "W. Eve", driver_oversize_endorsed: false }, as: Dispatcher, captures: { e1: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_x}/depart", payload: {}, as: Driver, captures: { e2: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_x}/cancel", payload: {}, as: Shipper, as_user_id: "${cust_id}", captures: { e3: "$.data.error_id" } }
            - { call: "POST /heavy-haul/loads/${load_y}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "W. Eve", driver_oversize_endorsed: false }, as: Dispatcher, captures: { e4: "$.data.error_id" } }
          assert:
            - "e1 == ERR_LOAD_INVALID_STATE and e2 == ERR_LOAD_INVALID_STATE (DELIVERED terminal)"
            - "e3 == ERR_LOAD_NOT_CANCELLABLE (DELIVERED)"
            - "e4 == ERR_LOAD_INVALID_STATE (CANCELLED terminal)"

      - name: load_cancel_cascades_children
        claim_type: side_effect_execution
        grounds: [state_machines.Load.SURVEYED_to_CANCELLED, state_machines.Permit.DRAFT_to_WITHDRAWN, state_machines.EscortBooking.CONFIRMED_to_CANCELLED, state_machines.CraneAppointment.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SURVEYED load withdraws its DRAFT permit, cancels its CONFIRMED escort, and cancels its SCHEDULED crane appointment in one cascade; a terminal (DENIED) sibling permit stays DENIED, proving conditional cascade selectivity."
        test_recipe:
          setup: ["Load 40000 lbs width 150 (oversize only), SURVEYED, states [CA]; CA OVERSIZE permit in DRAFT; one CONFIRMED REAR escort; one SCHEDULED ORIGIN crane"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Cascade Cancel Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide tank", gross_weight_lbs: 40000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "X. Abe", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 100, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 80000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERSIZE", expected_load_version: "${lv3}" }, as: PermitClerk }
            - { call: "GET /heavy-haul/loads/${load_id}", as: Dispatcher, captures: { lv4: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/escort-bookings", payload: { provider_name: "Cascade Pilots", position: "REAR", scheduled_start: "2026-08-12T08:00:00Z", scheduled_end: "2026-08-12T12:00:00Z", rate_per_hour_cents: 12000, expected_load_version: "${lv4}" }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/crane-appointments", payload: { site: "ORIGIN", crane_id: "CRANE-A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/cancel", payload: {}, as: Shipper, as_user_id: "${cust_id}", captures: { st: "$.data.status" } }
            - { call: "GET /heavy-haul/loads/${load_id}/permits", as: Dispatcher, captures: { p_st: "$.data[0].status" } }
            - { call: "GET /heavy-haul/loads/${load_id}/escort-bookings", as: Dispatcher, captures: { e_st: "$.data[0].status" } }
            - { call: "GET /heavy-haul/loads/${load_id}/crane-appointments", as: Dispatcher, captures: { c_st: "$.data[0].status" } }
          assert:
            - "st == CANCELLED"
            - "p_st == WITHDRAWN (non-terminal permit swept)"
            - "e_st == CANCELLED and c_st == CANCELLED (all non-terminal children cascade)"

      - name: securement_reject_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SecurementPlan, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for SecurementPlan: a later approve attempt on the same plan fails with ERR_INVALID_STATE; the remedy is a new plan."
        test_recipe:
          setup: ["Load 40000 lbs PLANNED; one SUBMITTED securement plan"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Reject Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Skids", gross_weight_lbs: 40000, width_in: 100, height_in: 50, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "FLATBED", trailer_axle_count: 2, driver_name: "Y. Kay", driver_oversize_endorsed: false }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/securement-plans", payload: { method: "CHAINS", tiedown_count: 4, wll_per_tiedown_lbs: 6000 }, as: Dispatcher, captures: { sp_id: "$.data.id" } }
          trigger:
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/reject", payload: {}, as: SafetyManager, captures: { st_rj: "$.data.status" } }
            - { call: "POST /heavy-haul/securement-plans/${sp_id}/approve", payload: {}, as: SafetyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "st_rj == REJECTED"
            - "err == ERR_INVALID_STATE (no approve path out of REJECTED)"

      - name: fine_dispute_state_and_liability_rules
