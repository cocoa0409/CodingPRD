              as_user_id: "rev-1"
          assert:
            - "response.status == 409"
            - "response.error.code == \"ERR_INVALID_PRODUCT_STATE\""
            - "${prod_formula} == \"REJECTED\""
            - "Product.${prod_id}.formula_status == \"REJECTED\""
            - "Product.${prod_id}.testing_plan_status == \"NONE\""
            - "Product.${prod_id}.threshold_ppm == null"
            - "Product.${prod_id}.version == ${prod_v}"

      - name: reusing_a_sku_within_the_same_applicant_is_rejected
