            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TA" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ta: "$.data.id" } }
            - { call: "POST /spd/trays/${ta}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ta}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ta}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ta}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { la: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${la}/trays", payload: { tray_id: "${ta}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${la}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
