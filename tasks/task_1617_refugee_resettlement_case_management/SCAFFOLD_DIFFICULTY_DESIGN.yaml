              as: HousingCoordinator
              captures: { setup_a: $.data.id }
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_a}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_a}/arrive"
              payload: { actual_arrival_date: "2026-12-10" }
              as: CaseManager
            - call: "POST /cases"
              payload: { case_number: "CASE-CF2B", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-12-10" }
              as: CaseManager
              captures: { case_b: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "70 Chestnut Ave", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_b: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_b}", housing_unit_id: "${unit_b}", occupancy_start: "2026-12-01", occupancy_end: "2027-06-01" }
              as: HousingCoordinator
              captures: { setup_b: $.data.id }
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_b}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_b}/arrive"
              payload: { actual_arrival_date: "2026-12-10" }
              as: CaseManager
          trigger:
            - call: "POST /federal-reports"
              payload: { period_start: "2026-10-01", period_end: "2027-01-01" }
              as: AgencyDirector
              captures: { report_id: $.data.id, report_alloc: $.data.per_capita_allocation_cents, report_cases: $.data.cases_arrived_count }
          assert:
            - "FederalReport.${report_id}.cases_arrived_count == 2"
            - "FederalReport.${report_id}.per_capita_allocation_cents == 208334 (104167 per case: round_half_up(1250000*1*1/12) = 104167, summed per case; sum-then-round would give 208333)"
            - "FederalReport.${report_id}.benchmarks_met_count == 0 (all seeded due dates 2027-01-09+ fall outside the period)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: BenefitApplication re-file CYCLE vs
  # CaseTransfer BRANCHING with divergent side-effect sets. DIFFERENT entities.
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: benefit_application_refile_cycle
        grounds:
          - state_machines.BenefitApplication.FILED_to_DENIED
          - state_machines.BenefitApplication.DENIED_to_APPEALED
          - state_machines.BenefitApplication.APPEALED_to_FILED
          - entities.BenefitApplication.fields.filed_on
        distinguishing_aspect: |
          BenefitApplication supports the cycle FILED -> DENIED -> APPEALED ->
          FILED on the SAME entity instance; the re-file stamps a new filed_on
          (2026-08-25 replacing 2026-08-15) and clears decided_on, proving a
          genuine loop rather than a linear pipeline.
