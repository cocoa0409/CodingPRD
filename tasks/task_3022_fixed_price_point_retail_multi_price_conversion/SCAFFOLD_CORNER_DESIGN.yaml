              as: MerchandiseBuyer
              captures: { item_id: $.data.id }
            - call: "POST /merchandise/items/${item_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 0 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
