      - name: water_sampling_evidence_may_only_carry_the_utility_side
        claim_type: conditional_validation
        grounds:
          - validations.priority_70_ERR_EVIDENCE_SIDE_MISMATCH
          - errors.ERR_EVIDENCE_SIDE_MISMATCH
        distinguishing_aspect: "WATER_SAMPLING evidence with side CUSTOMER returns ERR_EVIDENCE_SIDE_MISMATCH 422 while the identical item with side UTILITY is accepted — the rule is conditional on source_type, not a blanket side check. Adding a customer-side VISUAL_INSPECTION then flips the line to FIELD_BASIS, where the sampling item finally governs at CONFIDENCE_WEIGHT 0.70 and certainty_score becomes round(100 * (0.60*0.70 + 0.40*0.85), 2) == 76.00."
        test_recipe:
          setup:
            - "One water system and one service line."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2103007", system_name: "Sampling Side Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "WATER_SAMPLING", side: "CUSTOMER", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "WATER_SAMPLING", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "VISUAL_INSPECTION", side: "CUSTOMER", observed_material: "COPPER", observed_at: "2026-06-02T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The first call returns HTTP 422 with ${err} == ERR_EVIDENCE_SIDE_MISMATCH"
            - "The second and third calls return HTTP 201"
            - "ServiceLine.${l1}.inventory_state == CLASSIFIED_VERIFIED and ServiceLine.${l1}.certainty_basis == FIELD_BASIS"
            - "ServiceLine.${l1}.utility_side_material == LEAD and ServiceLine.${l1}.customer_side_material == COPPER"
            - "ServiceLine.${l1}.classification == LEAD and ServiceLine.${l1}.certainty_score == 76.00"
            - "ServiceLine.${l1}.replacement_priority_score == 65.00"

