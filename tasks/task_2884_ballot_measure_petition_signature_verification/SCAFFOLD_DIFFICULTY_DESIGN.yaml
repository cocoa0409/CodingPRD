              payload: { standard_id: "${std_id}", proponent_name: "Buffer Committee", submitted_title: "Buffer Measure", measure_subject_codes: ["ELECTIONS"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
