  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: safety_over_constraint_on_component_add
        grounds:
          - validations[priority=44]
          - validations[priority=62]
          - errors.ERR_DONOR_NOT_QUALIFIED
          - errors.ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING
          - state_machines.Donor.QUALIFIED_to_PERMANENTLY_DEFERRED
          - entities.Donation.fields.remaining_ml
        distinguishing_aspect: |
          Category pair business_safety (priority 44) versus business_constraint (priority 62),
          both on POST /milk-bank/pools/{id}/components and both violated by the same request:
          the donation's donor was deferred after the milk was logged AND the requested 1200 ml
          exceeds the 800 ml remaining. The response must be ERR_DONOR_NOT_QUALIFIED with HTTP
          409 — a validator that checks arithmetic before donor eligibility returns
          ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING and hides the safety problem.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-05T08:00:00Z."
            - "Donor DNR-1001 was QUALIFIED, shipped cooler TRK-1001, and its 800 ml donation C1 (expressed 2026-07-05, TERM) is ELIGIBLE with remaining_ml 800."
            - "The donor's physician then withdrew approval: a PERMANENT deferral with lookback_days 0 and recall_scope NONE was recorded, so the donor is PERMANENTLY_DEFERRED while donation C1 stays ELIGIBLE and outside the [2026-08-05, 2026-08-05] lookback window."
            - "Pool POOL-0001 is DRAFT with target_milk_class TERM and no components."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-1001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-1001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 800, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
            - { call: "POST /milk-bank/shipments/${s1}/receive", payload: { excursion_minutes: 0, arrival_max_temp_celsius: -18.0, verified_volume_ml: 800 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sv1: "$.data.version" } }
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C1", expressed_on: "2026-07-05", volume_ml: 800, kcal_per_oz: 18.5, milk_class: "TERM", expected_shipment_version: "${sv1}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { n1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "PHYSICIAN_WITHDRAWAL", deferral_type: "PERMANENT", effective_from: "2026-08-05", deferral_days: 0, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/pools", payload: { pool_code: "POOL-0001", target_milk_class: "TERM" }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { p: "$.data.id" } }
            - { call: "GET /milk-bank/pools/${p}", payload: {}, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { pv1: "$.data.version" } }
          trigger:
            - { call: "POST /milk-bank/pools/${p}/components", payload: { donation_id: "${n1}", allocated_volume_ml: 1200, expected_pool_version: "${pv1}" }, as: ProcessingTechnician, as_user_id: "u-tech-1", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_DONOR_NOT_QUALIFIED"
            - "${err} != ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING"
            - "Donor.${d1}.status == PERMANENTLY_DEFERRED"
            - "Donation.${n1}.status == ELIGIBLE and remaining_ml == 800 (unchanged)"
            - "Pool.${p}.status == DRAFT and total_volume_ml == 0 and distinct_donor_count == 0 and projected_kcal_per_oz == null"
            - "GET /milk-bank/pools/${p}/components returns total_count == 0"

