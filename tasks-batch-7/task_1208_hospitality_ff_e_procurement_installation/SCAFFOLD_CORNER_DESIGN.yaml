  # ------------------------- additional state-machine corners (appended) ---
  - section: state_machines
    instances:
      - name: po_ready_requires_lines
        claim_type: precondition_enforcement
        grounds: ["state_machines.PurchaseOrder", "errors[ERR_PO_HAS_NO_LINES]"]
        distinguishing_aspect: "READY_TO_SHIP requires at least one non-CANCELLED line; an empty PO cannot advance."
        test_recipe:
          setup: ["Project in PROCUREMENT with a budget line; PO for VENDA acknowledged, no lines"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S13", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 1000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_PO_HAS_NO_LINES; fulfillment_status remains ACKNOWLEDGED"

      - name: window_release_repeat_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.InstallationWindow", "errors[ERR_INVALID_WINDOW_TRANSITION]"]
        distinguishing_aspect: "Releasing an already-RELEASED window is an invalid transition (repeat trigger is rejected, not silently idempotent)."
        test_recipe:
          setup: ["Project; window created and released once"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-S14", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 5000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
