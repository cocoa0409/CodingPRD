# =============================================================================
# PRD Benchmark Seed Tables — DOT Compliance & Carrier Safety Rating Management
# =============================================================================

scenario: |
  DOT Compliance & Carrier Safety Rating Management (motor carrier safety department): safety measurement categories & violation trend monitoring, roadside inspection data review & DataQs challenge, driver coaching & corrective action assignment, audit readiness & document retention, drug/alcohol program administration, accident register & preventability review, new-entrant audit & rating upgrade, insurance premium impact modeling

domain_name: dot-carrier-safety
api_prefix: /safety

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit      # regulatory gating, SoD, tamper-evident audit trail
  secondary_archetype: event_sourcing      # measurement snapshots recomputed by epoch replay of violation/accident events
  complexity_layers:
    - rate_threshold_triggers              # percentile >= intervention_threshold alerts; risk tiers at 10/20
    - dual_variant_calculation             # official vs provisional safety measures; BASELINE vs PROJECTED premiums
    - cascading_side_effects               # challenge overturn -> violation -> inspection -> driver risk -> premium staleness
    - optimistic_concurrency               # OCC on Carrier.version and Driver.version
  entity_topology: flat                    # peer entities linked by FK references; no nested URL paths
  state_machine_shape: cyclic              # DataQs remand loop, premium DRAFT->QUOTED->STALE->DRAFT loop, carrier rating cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties        # recorder cannot MRO-verify; registrar cannot determine preventability
  consistency_model: immediate             # all mutations atomic within the request; epoch batch runs synchronously

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK links; canonical FK prefix)
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: dot_number, type: string, source: input, description: "USDOT number; unique across all carriers" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the motor carrier" }
      - { name: fleet_size, type: integer, source: input, description: "Number of power units; must be >= 1 (ERR_INVALID_FLEET_SIZE)" }
      - { name: is_new_entrant, type: boolean, source: input, default: false, description: "Whether the carrier is in the new-entrant safety assurance program" }
      - { name: safety_audit_due_date, type: datetime, source: input, description: "Deadline for the new-entrant safety audit; required iff is_new_entrant is true (ERR_INVALID_REQUEST otherwise)" }
      - { name: safety_rating, type: enum, source: system, default: NONE, description: "NONE | SATISFACTORY | CONDITIONAL | UNSATISFACTORY; written only by audit close or upgrade approval" }
      - { name: new_entrant_status, type: enum, source: system, description: "NOT_NEW_ENTRANT | PENDING_AUDIT | PASSED | FAILED; initial PENDING_AUDIT when is_new_entrant, else NOT_NEW_ENTRANT" }
      - { name: rating_cooling_off_until, type: datetime, source: system, description: "Null until a downgrade or upgrade denial; blocks new RatingUpgradeRequests while clock < this value" }
      - { name: posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | INTERVENTION_WATCH | INTERVENTION_PRIORITY | OUT_OF_SERVICE_PROPOSED; derived per calculations.carrier_posture" }
      - { name: last_cycle_date, type: string, source: system, description: "UTC calendar date (YYYY-MM-DD) of the last measurement cycle run for this carrier; null until first cycle" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; employing carrier" }
      - { name: cdl_number, type: string, source: input, description: "Commercial driver license number" }
      - { name: full_name, type: string, source: input, description: "Driver full legal name" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date" }
      - { name: employment_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Per calculations.driver_risk_score; floored at 0; refreshed on violation/accident/coaching mutations and by measurement cycles" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "LOW (<10) | MEDIUM (10-19) | HIGH (>=20) derived from risk_score" }
      - { name: coaching_strikes, type: integer, source: system, default: 0, description: "Count of escalations; incremented when a CoachingAssignment is escalated" }

  - name: ViolationCategory
    parent: null
    common_fields: true
    fields:
      - { name: category_code, type: enum, source: input, description: "UNSAFE_DRIVING | HOURS_OF_SERVICE | DRIVER_FITNESS | CONTROLLED_SUBSTANCES_ALCOHOL | VEHICLE_MAINTENANCE | HAZMAT | CRASH_INDICATOR; unique" }
      - { name: display_name, type: string, source: input, description: "Human-readable category name" }
      - { name: intervention_threshold, type: integer, source: input, description: "Percentile (1..100) at or above which the category is alerted" }
      - { name: benchmark_measure, type: number, source: input, description: "Measure value (points per power unit) that maps to the 100th percentile; must be > 0" }
      - { name: measure_window_months, type: integer, source: input, default: 24, description: "Look-back window for the time-weight rule; pinned to 24 for all categories in this benchmark" }

  - name: RoadsideInspection
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; inspected carrier" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; inspected driver; driver.carrier_id must equal carrier_id (ERR_DRIVER_CARRIER_MISMATCH)" }
      - { name: report_number, type: string, source: input, description: "State inspection report number; unique per carrier (ERR_DUPLICATE_REPORT_NUMBER)" }
      - { name: inspection_date, type: datetime, source: input, description: "When the roadside inspection occurred" }
      - { name: inspection_level, type: integer, source: input, description: "Inspection level 1..3" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code where the inspection occurred" }
      - { name: review_status, type: enum, source: system, default: IMPORTED, description: "IMPORTED | UNDER_REVIEW | FINALIZED; violations mutable and challenges allowed only while not FINALIZED" }
      - { name: total_weighted_points, type: integer, source: computed, default: 0, description: "Sum of weighted_points of its violations with status ACTIVE or CHALLENGED (REMOVED excluded)" }

  - name: InspectionViolation
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> RoadsideInspection.id; parent inspection" }
      - { name: category_id, type: string, source: input, description: "FK -> ViolationCategory.id; measurement category" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; cited driver; optional on input — defaults to the inspection's driver_id" }
      - { name: violation_code, type: string, source: input, description: "Regulation citation, e.g. 392.2 or 395.8" }
      - { name: severity_weight, type: integer, source: input, description: "Severity weight 1..10 (ERR_INVALID_SEVERITY_WEIGHT outside)" }
      - { name: occurred_at, type: datetime, source: input, description: "When the violation occurred; must be <= current logical clock (ERR_FUTURE_OCCURRENCE)" }
      - { name: time_weight_multiplier, type: integer, source: computed, description: "3 | 2 | 1 | 0 per calculations.violation_time_weight, computed at creation against the current clock and refreshed by each measurement cycle" }
      - { name: weighted_points, type: integer, source: computed, description: "severity_weight x time_weight_multiplier; recomputed whenever time_weight_multiplier is refreshed" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CHALLENGED | REMOVED; REMOVED is terminal and set only by an OVERTURNED DataQs challenge" }

  - name: DataQsChallenge
    parent: null
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: input, description: "FK -> InspectionViolation.id; challenged violation" }
      - { name: reason_code, type: enum, source: input, description: "INCORRECT_DATA | WRONG_CARRIER | WRONG_DRIVER | DUPLICATE_REPORT | OTHER" }
      - { name: evidence_note, type: string, source: input, description: "Free-text evidence summary" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceAnalyst who filed the challenge" }
      - { name: remand_count, type: integer, source: system, default: 0, description: "Number of times the challenge has been remanded; REMAND decision rejected with ERR_REMAND_LIMIT_REACHED when remand_count == 2" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of the latest decide call; null until first decision" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | REMANDED | UPHELD | OVERTURNED; UPHELD and OVERTURNED are terminal" }

  - name: CoachingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; coached driver" }
      - { name: coaching_type, type: enum, source: input, description: "VERBAL_WARNING | TRAINING_COURSE | PROBATION" }
      - { name: source_violation_id, type: string, source: input, description: "FK -> InspectionViolation.id; optional triggering violation" }
      - { name: assigned_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyManager who created the assignment" }
      - { name: due_date, type: datetime, source: input, description: "Completion deadline; a measurement cycle marks the assignment OVERDUE when clock > due_date" }
      - { name: completed_at, type: datetime, source: system, description: "Clock timestamp of completion; null until COMPLETED" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | IN_PROGRESS | OVERDUE | ESCALATED | COMPLETED | SUPERSEDED | CANCELLED; COMPLETED, SUPERSEDED, CANCELLED terminal" }

  - name: DrugAlcoholTest
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; tested driver" }
      - { name: test_type, type: enum, source: input, description: "PRE_EMPLOYMENT | RANDOM | POST_ACCIDENT | REASONABLE_SUSPICION | RETURN_TO_DUTY | FOLLOW_UP" }
      - { name: substance, type: enum, source: input, description: "DRUG | ALCOHOL" }
      - { name: collected_at, type: datetime, source: input, description: "Specimen collection timestamp; must be <= current logical clock" }
      - { name: accident_id, type: string, source: input, description: "FK -> AccidentRecord.id; required iff test_type == POST_ACCIDENT (ERR_MISSING_ACCIDENT_LINK)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyManager (DER) who created the test record" }
      - { name: lab_result, type: enum, source: system, default: PENDING, description: "PENDING | NEGATIVE | POSITIVE | REFUSAL | CANCELLED_BY_LAB" }
      - { name: mro_verdict, type: enum, source: system, default: NONE, description: "NONE | VERIFIED_NEGATIVE | VERIFIED_POSITIVE | VERIFIED_REFUSAL | CANCELLED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying MedicalReviewOfficer; must differ from recorded_by_user_id (ERR_SOD_VERIFIER_IS_RECORDER)" }
      - { name: verified_at, type: datetime, source: system, description: "Clock timestamp of MRO verification; null until MRO_VERIFIED" }
      - { name: status, type: enum, source: system, default: COLLECTED, description: "COLLECTED | LAB_REPORTED | MRO_VERIFIED | CANCELLED; MRO_VERIFIED and CANCELLED terminal" }

  - name: AccidentRecord
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier holding the accident register" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; driver involved; driver.carrier_id must equal carrier_id (ERR_DRIVER_CARRIER_MISMATCH)" }
      - { name: occurred_at, type: datetime, source: input, description: "Accident timestamp; must be <= current logical clock (ERR_FUTURE_OCCURRENCE)" }
      - { name: fatalities, type: integer, source: input, description: "Number of fatalities, >= 0" }
      - { name: injuries, type: integer, source: input, description: "Number of injuries with immediate treatment away from scene, >= 0" }
      - { name: tow_away, type: boolean, source: input, description: "Whether any vehicle was towed from the scene" }
      - { name: hazmat_release, type: boolean, source: input, default: false, description: "Whether hazardous materials were released" }
      - { name: dot_reportable, type: boolean, source: computed, description: "true iff fatalities >= 1 OR injuries >= 1 OR tow_away == true" }
      - { name: crash_points, type: integer, source: computed, description: "Per calculations.crash_severity_points: 4*(fatalities>=1) + 2*(injuries>=1) + 1*tow_away, range 0..7" }
      - { name: registered_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyManager who registered the accident" }
      - { name: preventability_status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | PREVENTABLE | NOT_PREVENTABLE; determination is terminal" }
      - { name: preventability_determined_by, type: string, source: system, description: "X-User-ID of the SafetyDirector who determined preventability; must differ from registered_by_user_id (ERR_SOD_PREVENTABILITY_SAME_USER)" }

  - name: ComplianceAuditCase
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; audited carrier" }
      - { name: audit_type, type: enum, source: input, description: "NEW_ENTRANT | COMPLIANCE_REVIEW" }
      - { name: scheduled_date, type: datetime, source: input, description: "Start of the field-work window" }
      - { name: field_work_duration_days, type: integer, source: input, default: 14, description: "Length of the field-work window in days, >= 1; window is half-open [scheduled_date, scheduled_date + duration)" }
      - { name: acute_count, type: integer, source: system, description: "Acute violations found; set by issue-findings; null before" }
      - { name: critical_count, type: integer, source: system, description: "Critical violations found; set by issue-findings; null before" }
      - { name: proposed_outcome, type: enum, source: system, description: "NEW_ENTRANT: PASS | FAIL. COMPLIANCE_REVIEW: SATISFACTORY | CONDITIONAL | UNSATISFACTORY. Computed per calculations.audit_outcome_rating" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | FIELD_WORK | FINDINGS_ISSUED | CORRECTIVE_ACTION_PHASE | CLOSED_PASSED | CLOSED_FAILED; CLOSED_* terminal" }

  - name: RatingUpgradeRequest
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier requesting the upgrade" }
      - { name: requested_rating, type: enum, source: input, description: "SATISFACTORY | CONDITIONAL; must rank strictly above the carrier's current safety_rating" }
      - { name: justification_note, type: string, source: input, description: "Corrective-action evidence summary" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of decision; null until decided" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED; APPROVED and DENIED terminal" }

  - name: InsurancePremiumModel
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; insured carrier" }
      - { name: policy_period_start, type: datetime, source: input, description: "Policy period start; closed interval lower bound" }
      - { name: policy_period_end, type: datetime, source: input, description: "Policy period end; closed interval upper bound; must be > policy_period_start (ERR_INVALID_DATE_RANGE)" }
      - { name: base_rate_cents_per_unit, type: integer, source: input, description: "Base premium rate in cents per power unit per policy period; >= 1" }
      - { name: scenario, type: enum, source: input, description: "BASELINE | PROJECTED; PROJECTED applies the assume_* overrides" }
      - { name: assume_rating, type: enum, source: input, description: "NONE | SATISFACTORY | CONDITIONAL; PROJECTED only — replaces the carrier's current rating factor (UNSATISFACTORY not modelable)" }
      - { name: assume_cleared_category_codes, type: array, source: input, description: "PROJECTED only — category codes treated as below intervention threshold" }
      - { name: assume_removed_preventable_accidents, type: integer, source: input, description: "PROJECTED only — number of preventable accidents treated as removed from the 36-month window" }
      - { name: rating_factor_used, type: number, source: computed, description: "Rating factor applied: NONE 1.05 | SATISFACTORY 1.00 | CONDITIONAL 1.25 | UNSATISFACTORY 1.60" }
      - { name: score_loading_pct, type: number, source: computed, description: "3 per alerted category in effect for the scenario, capped at 15" }
      - { name: crash_loading_pct, type: number, source: computed, description: "5 per in-window preventable accident in effect for the scenario, capped at 25" }
      - { name: driver_loading_pct, type: number, source: computed, description: "2 per ACTIVE driver with risk_tier HIGH, capped at 10" }
      - { name: computed_premium_cents, type: integer, source: computed, description: "Per calculations.insurance_premium; single final round to whole cents, round_half_up" }
      - { name: carrier_version_at_compute, type: integer, source: system, description: "Carrier.version at the time the premium was last computed; staleness gate" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | QUOTED | STALE | BOUND; BOUND terminal" }

  - name: DocumentRecord
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; document owner" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; optional subject driver; must belong to carrier_id (ERR_DRIVER_CARRIER_MISMATCH)" }
      - { name: document_type, type: enum, source: input, description: "INSPECTION_REPORT | DQ_FILE | DRUG_TEST_RECORD | ALCOHOL_TEST_RECORD | ACCIDENT_REGISTER_ENTRY | TRAINING_CERTIFICATE" }
      - { name: filed_at, type: datetime, source: input, description: "Date the document was filed; retention clock starts here" }
      - { name: retention_months, type: integer, source: computed, description: "12 for INSPECTION_REPORT; 36 for DQ_FILE, ACCIDENT_REGISTER_ENTRY, TRAINING_CERTIFICATE; 60 for DRUG_TEST_RECORD, ALCOHOL_TEST_RECORD" }
      - { name: retention_until, type: datetime, source: computed, description: "filed_at + retention_months calendar months, day clamped to month end (e.g. 2024-02-29 + 12mo = 2025-02-28)" }
      - { name: status, type: enum, source: system, default: RETAINED, description: "RETAINED | PURGE_ELIGIBLE | PURGED; PURGED terminal; PURGE_ELIGIBLE set by a measurement cycle once clock >= retention_until" }

  - name: RandomTestingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; program carrier" }
      - { name: program_year, type: integer, source: input, description: "Calendar year of the testing program; unique per carrier (ERR_DUPLICATE_TESTING_PERIOD)" }
      - { name: avg_driver_count, type: integer, source: input, description: "Average number of drivers in the random pool; >= 1" }
      - { name: required_drug_tests, type: integer, source: computed, description: "ceil(avg_driver_count x 0.25)" }
      - { name: required_alcohol_tests, type: integer, source: computed, description: "ceil(avg_driver_count x 0.10)" }
      - { name: completed_drug_tests, type: integer, source: computed, description: "Live count of MRO_VERIFIED (verdict not CANCELLED) RANDOM/DRUG tests for the carrier's drivers collected within [program_year-01-01, (program_year+1)-01-01)" }
      - { name: completed_alcohol_tests, type: integer, source: computed, description: "Same counter for RANDOM/ALCOHOL tests" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED_COMPLIANT | CLOSED_DEFICIENT; CLOSED_* terminal" }

  - name: MeasurementSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; snapshot carrier" }
      - { name: category_id, type: string, source: system, description: "FK -> ViolationCategory.id; snapshot category" }
      - { name: cycle_date, type: string, source: system, description: "UTC calendar date (YYYY-MM-DD) of the producing measurement cycle" }
      - { name: as_of, type: datetime, source: system, description: "Logical clock value the cycle computed against" }
      - { name: official_measure, type: number, source: computed, description: "Points per power unit including CHALLENGED violations; 2 decimals round_half_up" }
      - { name: provisional_measure, type: number, source: computed, description: "Points per power unit excluding CHALLENGED violations; 2 decimals round_half_up" }
      - { name: official_percentile, type: integer, source: computed, description: "min(100, floor(official_measure / benchmark_measure x 100))" }
      - { name: provisional_percentile, type: integer, source: computed, description: "min(100, floor(provisional_measure / benchmark_measure x 100))" }
      - { name: alerted_official, type: boolean, source: computed, description: "official_percentile >= intervention_threshold" }
      - { name: alerted_provisional, type: boolean, source: computed, description: "provisional_percentile >= intervention_threshold" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    # Two parallel state dimensions on one entity: safety_rating x new_entrant_status.
    initial_state: "safety_rating=NONE, new_entrant_status=NOT_NEW_ENTRANT|PENDING_AUDIT"
    terminal_states: []
    transitions:
      - from: "safety_rating: NONE | SATISFACTORY | CONDITIONAL | UNSATISFACTORY"
        to: "safety_rating: SATISFACTORY | CONDITIONAL | UNSATISFACTORY (per ComplianceAuditCase.proposed_outcome)"
        trigger: "POST /safety/compliance-audit-cases/{id}/close (audit_type == COMPLIANCE_REVIEW)"
        actor: SafetyDirector
        preconditions:
          - "audit case in FINDINGS_ISSUED or CORRECTIVE_ACTION_PHASE"
        side_effects:
          - "carrier.safety_rating := proposed_outcome; carrier.version += 1"
          - "if new rating ranks worse than the old (SATISFACTORY < CONDITIONAL < UNSATISFACTORY): rating_cooling_off_until := clock + 180 days"
          - "carrier.posture recomputed per calculations.carrier_posture"
          - "all InsurancePremiumModels of this carrier with status QUOTED: status -> STALE (DRAFT models are checked lazily at quote time via ERR_PREMIUM_INPUT_STALE)"
      - from: "safety_rating: CONDITIONAL | UNSATISFACTORY"
        to: "safety_rating: requested_rating"
        trigger: "POST /safety/rating-upgrade-requests/{id}/decide with outcome APPROVED"
        actor: SafetyDirector
        preconditions:
          - "upgrade request in UNDER_REVIEW"
        side_effects:
          - "carrier.safety_rating := requested_rating; rating_cooling_off_until := null; carrier.version += 1"
          - "carrier.posture recomputed per calculations.carrier_posture"
          - "all InsurancePremiumModels of this carrier with status QUOTED: status -> STALE (DRAFT models are checked lazily at quote time via ERR_PREMIUM_INPUT_STALE)"
      - from: "new_entrant_status: PENDING_AUDIT"
        to: "new_entrant_status: PASSED"
        trigger: "POST /safety/compliance-audit-cases/{id}/close with proposed_outcome PASS (audit_type == NEW_ENTRANT)"
        actor: SafetyDirector
        preconditions: []
        side_effects:
          - "carrier.version += 1; posture recomputed"
      - from: "new_entrant_status: PENDING_AUDIT"
        to: "new_entrant_status: FAILED"
        trigger: "POST /safety/compliance-audit-cases/{id}/close with proposed_outcome FAIL (audit_type == NEW_ENTRANT)"
        actor: SafetyDirector
        preconditions: []
        side_effects:
          - "carrier.version += 1"
          - "carrier.posture -> OUT_OF_SERVICE_PROPOSED (via carrier_posture rule 1)"
          - "all InsurancePremiumModels of this carrier with status QUOTED: status -> STALE (DRAFT models are checked lazily at quote time via ERR_PREMIUM_INPUT_STALE)"

  - entity: RoadsideInspection
    initial_state: IMPORTED
    terminal_states: [FINALIZED]
    transitions:
      - from: IMPORTED
        to: UNDER_REVIEW
        trigger: "POST /safety/roadside-inspections/{id}/begin-review"
        actor: ComplianceAnalyst
        preconditions:
          - "review_status == IMPORTED (ERR_INSPECTION_NOT_REVIEWABLE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: FINALIZED
        trigger: "POST /safety/roadside-inspections/{id}/finalize"
        actor: ComplianceAnalyst
        preconditions:
          - "review_status == UNDER_REVIEW (ERR_INSPECTION_NOT_REVIEWABLE)"
          - "no DataQsChallenge with status SUBMITTED, UNDER_REVIEW, or REMANDED exists on any violation of this inspection (ERR_OPEN_CHALLENGES_BLOCK_FINALIZE)"
        side_effects: []

  - entity: InspectionViolation
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: CHALLENGED
        trigger: "POST /safety/dataqs-challenges (create)"
        actor: ComplianceAnalyst
        preconditions:
          - "violation.status == ACTIVE (ERR_VIOLATION_NOT_ACTIVE)"
          - "parent inspection review_status != FINALIZED (ERR_INSPECTION_FINALIZED)"
          - "single open challenge per violation is enforced structurally: a challenged violation leaves ACTIVE, so the ERR_VIOLATION_NOT_ACTIVE state check rejects further challenges"
        side_effects:
          - "violation.status := CHALLENGED (official measure still counts it; provisional excludes it)"
      - from: CHALLENGED
        to: ACTIVE
        trigger: "POST /safety/dataqs-challenges/{id}/decide with outcome UPHELD"
        actor: SafetyAdmin
        preconditions:
          - "challenge.status == UNDER_REVIEW (ERR_CHALLENGE_NOT_UNDER_REVIEW)"
        side_effects:
          - "violation.status := ACTIVE"
          - "inspection.total_weighted_points recomputed (unchanged vs pre-decision; see compensating invariant)"
          - "driver.risk_score recomputed (unchanged)"
      - from: CHALLENGED
        to: REMOVED
        trigger: "POST /safety/dataqs-challenges/{id}/decide with outcome OVERTURNED"
        actor: SafetyAdmin
        preconditions:
          - "challenge.status == UNDER_REVIEW (ERR_CHALLENGE_NOT_UNDER_REVIEW)"
        side_effects:
          - "violation.status := REMOVED"
          - "inspection.total_weighted_points recomputed (drops by the violation's weighted_points)"
          - "driver.risk_score recomputed; if risk_tier changes, every QUOTED InsurancePremiumModel of the carrier -> STALE"
          - "challenge.decided_at := clock"

  - entity: DataQsChallenge
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /safety/dataqs-challenges/{id}/start-review"
        actor: SafetyAdmin
        preconditions:
          - "status == SUBMITTED (ERR_CHALLENGE_NOT_SUBMITTED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /safety/dataqs-challenges/{id}/decide with outcome UPHELD"
        actor: SafetyAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_CHALLENGE_NOT_UNDER_REVIEW)"
        side_effects:
          - "violation CHALLENGED -> ACTIVE (see InspectionViolation machine)"
          - "decided_at := clock"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /safety/dataqs-challenges/{id}/decide with outcome OVERTURNED"
        actor: SafetyAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_CHALLENGE_NOT_UNDER_REVIEW)"
        side_effects:
          - "violation CHALLENGED -> REMOVED (cascade per InspectionViolation machine)"
          - "decided_at := clock"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /safety/dataqs-challenges/{id}/decide with outcome REMANDED"
        actor: SafetyAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_CHALLENGE_NOT_UNDER_REVIEW)"
          - "remand_count < 2 (ERR_REMAND_LIMIT_REACHED)"
        side_effects:
          - "remand_count += 1; decided_at := clock"
          - "violation remains CHALLENGED"
      - from: REMANDED
        to: SUBMITTED
        trigger: "POST /safety/dataqs-challenges/{id}/resubmit"
        actor: ComplianceAnalyst
        preconditions:
          - "status == REMANDED (ERR_CHALLENGE_NOT_REMANDED)"
        side_effects: []

  - entity: CoachingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, SUPERSEDED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /safety/coaching-assignments/{id}/start"
        actor: SafetyManager
        preconditions:
          - "status == ASSIGNED (ERR_COACHING_NOT_OPEN)"
        side_effects: []
      - from: "ASSIGNED | IN_PROGRESS | OVERDUE | ESCALATED"
        to: COMPLETED
        trigger: "POST /safety/coaching-assignments/{id}/complete"
        actor: SafetyManager
        preconditions:
          - "status in {ASSIGNED, IN_PROGRESS, OVERDUE, ESCALATED} (ERR_COACHING_NOT_OPEN)"
        side_effects:
          - "completed_at := clock"
          - "driver.risk_score recomputed (completion credit: -2 per coaching completed within trailing 24 months)"
          - "if prior status was ESCALATED: re-evaluate driver suspension holds (calculations.suspension_hold_evaluation); driver SUSPENDED -> ACTIVE iff zero holds remain"
      - from: "ASSIGNED | IN_PROGRESS"
        to: OVERDUE
        trigger: "system (POST /safety/measurement-cycles sweep: clock > due_date)"
        actor: system
        preconditions:
          - "status in {ASSIGNED, IN_PROGRESS} and current logical clock > due_date"
        side_effects: []
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /safety/coaching-assignments/{id}/escalate"
        actor: SafetyManager
        preconditions:
          - "status == OVERDUE (ERR_COACHING_NOT_OVERDUE)"
          - "driver.employment_status == ACTIVE (ERR_DRIVER_NOT_ACTIVE)"
        side_effects:
          - "driver.employment_status := SUSPENDED; driver.coaching_strikes += 1; driver.version += 1"
      - from: "ASSIGNED | IN_PROGRESS | OVERDUE | ESCALATED"
        to: SUPERSEDED
        trigger: "POST /safety/coaching-assignments (create with same driver_id + coaching_type while an open assignment exists)"
        actor: system
        preconditions: []
        side_effects:
          - "prior open assignment -> SUPERSEDED"
          - "if the superseded assignment was ESCALATED: re-evaluate suspension holds; driver SUSPENDED -> ACTIVE iff zero holds remain"
      - from: "ASSIGNED | IN_PROGRESS | OVERDUE | ESCALATED"
        to: CANCELLED
        trigger: "POST /safety/drivers/{id}/terminate (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "if the cancelled assignment was ESCALATED: driver remains TERMINATED (no reinstatement evaluation)"

  - entity: DrugAlcoholTest
    initial_state: COLLECTED
    terminal_states: [MRO_VERIFIED, CANCELLED]
    transitions:
      - from: COLLECTED
        to: LAB_REPORTED
        trigger: "POST /safety/drug-alcohol-tests/{id}/report-lab-result with lab_result in {NEGATIVE, POSITIVE, REFUSAL}"
        actor: SafetyManager
        preconditions:
          - "status == COLLECTED (ERR_TEST_NOT_COLLECTED)"
        side_effects:
          - "lab_result := payload value"
      - from: COLLECTED
        to: CANCELLED
        trigger: "POST /safety/drug-alcohol-tests/{id}/report-lab-result with lab_result CANCELLED_BY_LAB"
        actor: SafetyManager
        preconditions:
          - "status == COLLECTED (ERR_TEST_NOT_COLLECTED)"
        side_effects:
          - "lab_result := CANCELLED_BY_LAB"
      - from: LAB_REPORTED
        to: MRO_VERIFIED
        trigger: "POST /safety/drug-alcohol-tests/{id}/verify with verdict in {VERIFIED_NEGATIVE, VERIFIED_POSITIVE, VERIFIED_REFUSAL}"
        actor: MedicalReviewOfficer
        preconditions:
          - "status == LAB_REPORTED (ERR_TEST_NOT_LAB_REPORTED)"
          - "verified_by (X-User-ID) != recorded_by_user_id (ERR_SOD_VERIFIER_IS_RECORDER)"
          - "verdict consistent with lab_result: NEGATIVE->VERIFIED_NEGATIVE, POSITIVE->VERIFIED_POSITIVE, REFUSAL->VERIFIED_REFUSAL (ERR_VERDICT_RESULT_MISMATCH)"
        side_effects:
          - "mro_verdict := verdict; verified_by_user_id := X-User-ID; verified_at := clock"
          - "if verdict in {VERIFIED_POSITIVE, VERIFIED_REFUSAL} and driver.employment_status == ACTIVE: driver -> SUSPENDED; driver.version += 1"
          - "RandomTestingPeriod completed counters recompute lazily on read (no stored mutation)"
      - from: LAB_REPORTED
        to: CANCELLED
        trigger: "POST /safety/drug-alcohol-tests/{id}/verify with verdict CANCELLED"
        actor: MedicalReviewOfficer
        preconditions:
          - "status == LAB_REPORTED (ERR_TEST_NOT_LAB_REPORTED)"
          - "verified_by (X-User-ID) != recorded_by_user_id (ERR_SOD_VERIFIER_IS_RECORDER)"
        side_effects:
          - "mro_verdict := CANCELLED; verified_at := clock"

  - entity: AccidentRecord
    initial_state: PENDING_REVIEW
    terminal_states: [PREVENTABLE, NOT_PREVENTABLE]
    transitions:
      - from: PENDING_REVIEW
        to: PREVENTABLE
        trigger: "POST /safety/accident-records/{id}/determine-preventability with determination PREVENTABLE"
        actor: SafetyDirector
        preconditions:
          - "preventability_status == PENDING_REVIEW (ERR_PREVENTABILITY_ALREADY_DETERMINED)"
          - "determiner X-User-ID != registered_by_user_id (ERR_SOD_PREVENTABILITY_SAME_USER)"
        side_effects:
          - "preventability_determined_by := X-User-ID"
          - "driver.risk_score recomputed (crash points x time weight now count against the driver); if risk_tier changes: carrier's QUOTED InsurancePremiumModels -> STALE"
      - from: PENDING_REVIEW
        to: NOT_PREVENTABLE
        trigger: "POST /safety/accident-records/{id}/determine-preventability with determination NOT_PREVENTABLE"
        actor: SafetyDirector
        preconditions:
          - "preventability_status == PENDING_REVIEW (ERR_PREVENTABILITY_ALREADY_DETERMINED)"
          - "determiner X-User-ID != registered_by_user_id (ERR_SOD_PREVENTABILITY_SAME_USER)"
        side_effects:
          - "preventability_determined_by := X-User-ID"

  - entity: ComplianceAuditCase
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASSED, CLOSED_FAILED]
    transitions:
      - from: SCHEDULED
        to: FIELD_WORK
        trigger: "POST /safety/compliance-audit-cases/{id}/start-field-work"
        actor: SafetyAdmin
        preconditions:
          - "status == SCHEDULED (ERR_AUDIT_INVALID_STATE)"
          - "current logical clock >= scheduled_date (ERR_AUDIT_BEFORE_SCHEDULED_DATE)"
          - "GET audit-readiness for the carrier returns ready == true (ERR_AUDIT_READINESS_INCOMPLETE)"
        side_effects: []
      - from: FIELD_WORK
        to: FINDINGS_ISSUED
        trigger: "POST /safety/compliance-audit-cases/{id}/issue-findings"
        actor: SafetyAdmin
        preconditions:
          - "status == FIELD_WORK (ERR_AUDIT_INVALID_STATE)"
        side_effects:
          - "acute_count, critical_count := payload; proposed_outcome computed per calculations.audit_outcome_rating"
      - from: FINDINGS_ISSUED
        to: CORRECTIVE_ACTION_PHASE
        trigger: "POST /safety/compliance-audit-cases/{id}/begin-corrective-action"
        actor: SafetyManager
        preconditions:
          - "status == FINDINGS_ISSUED (ERR_AUDIT_INVALID_STATE)"
          - "proposed_outcome is adverse: FAIL | CONDITIONAL | UNSATISFACTORY (ERR_CORRECTIVE_ACTION_NOT_APPLICABLE)"
        side_effects: []
      - from: "FINDINGS_ISSUED | CORRECTIVE_ACTION_PHASE"
        to: CLOSED_PASSED
        trigger: "POST /safety/compliance-audit-cases/{id}/close (proposed_outcome PASS or SATISFACTORY)"
        actor: SafetyDirector
        preconditions:
          - "status in {FINDINGS_ISSUED, CORRECTIVE_ACTION_PHASE} (ERR_AUDIT_INVALID_STATE)"
        side_effects:
          - "NEW_ENTRANT PASS: carrier.new_entrant_status -> PASSED"
          - "COMPLIANCE_REVIEW SATISFACTORY: carrier.safety_rating := SATISFACTORY with rating-change cascade (Carrier machine)"
      - from: "FINDINGS_ISSUED | CORRECTIVE_ACTION_PHASE"
        to: CLOSED_FAILED
        trigger: "POST /safety/compliance-audit-cases/{id}/close (proposed_outcome FAIL, CONDITIONAL, or UNSATISFACTORY)"
        actor: SafetyDirector
        preconditions:
          - "status in {FINDINGS_ISSUED, CORRECTIVE_ACTION_PHASE} (ERR_AUDIT_INVALID_STATE)"
        side_effects:
          - "NEW_ENTRANT FAIL: carrier.new_entrant_status -> FAILED; carrier.posture -> OUT_OF_SERVICE_PROPOSED; premium models QUOTED -> STALE"
          - "COMPLIANCE_REVIEW CONDITIONAL|UNSATISFACTORY: carrier.safety_rating := proposed_outcome; if worse than prior rating, rating_cooling_off_until := clock + 180 days; posture recomputed; premium models QUOTED -> STALE"
          - "carrier.version += 1"

  - entity: RatingUpgradeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /safety/rating-upgrade-requests/{id}/start-review"
        actor: SafetyDirector
        preconditions:
          - "status == SUBMITTED (ERR_UPGRADE_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /safety/rating-upgrade-requests/{id}/decide with outcome APPROVED"
        actor: SafetyDirector
        preconditions:
          - "status == UNDER_REVIEW (ERR_UPGRADE_INVALID_STATE)"
        side_effects:
          - "carrier.safety_rating := requested_rating (Carrier machine cascade: cooling-off cleared, posture recompute, premium STALE sweep, carrier.version += 1)"
          - "decided_at := clock"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /safety/rating-upgrade-requests/{id}/decide with outcome DENIED"
        actor: SafetyDirector
        preconditions:
          - "status == UNDER_REVIEW (ERR_UPGRADE_INVALID_STATE)"
        side_effects:
          - "carrier.rating_cooling_off_until := clock + 90 days; carrier.version += 1"
          - "decided_at := clock"

  - entity: InsurancePremiumModel
    initial_state: DRAFT
    terminal_states: [BOUND]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /safety/insurance-premium-models/{id}/quote"
        actor: InsuranceAnalyst
        preconditions:
          - "status == DRAFT (ERR_PREMIUM_MODEL_NOT_DRAFT)"
          - "carrier_version_at_compute == carrier.version (ERR_PREMIUM_INPUT_STALE)"
        side_effects: []
      - from: QUOTED
        to: STALE
        trigger: "system (carrier PATCH, carrier rating change, measurement cycle for the carrier, or a driver risk_tier change on that carrier)"
        actor: system
        preconditions: []
        side_effects:
          - "status := STALE (derived-field reconciliation marker)"
      - from: "STALE | DRAFT"
        to: DRAFT
        trigger: "POST /safety/insurance-premium-models/{id}/recompute"
        actor: InsuranceAnalyst
        preconditions:
          - "status in {STALE, DRAFT} (ERR_PREMIUM_MODEL_NOT_STALE on QUOTED or BOUND)"
          - "policy period overlap re-validated excluding self (ERR_POLICY_PERIOD_OVERLAP)"
        side_effects:
          - "computed_premium_cents and loadings recomputed from current carrier data and scenario overrides"
          - "carrier_version_at_compute := carrier.version"
      - from: QUOTED
        to: BOUND
        trigger: "POST /safety/insurance-premium-models/{id}/bind"
        actor: InsuranceAnalyst
        preconditions:
          - "status == QUOTED (ERR_PREMIUM_MODEL_NOT_QUOTED)"
          - "carrier_version_at_compute == carrier.version (ERR_PREMIUM_INPUT_STALE)"
        side_effects: []

  - entity: DocumentRecord
    initial_state: RETAINED
    terminal_states: [PURGED]
    transitions:
      - from: RETAINED
        to: PURGE_ELIGIBLE
        trigger: "system (POST /safety/measurement-cycles sweep: clock >= retention_until)"
        actor: system
        preconditions:
          - "status == RETAINED and current logical clock >= retention_until"
        side_effects: []
      - from: PURGE_ELIGIBLE
        to: PURGED
        trigger: "POST /safety/document-records/{id}/purge"
        actor: SafetyManager
        preconditions:
          - "status == PURGE_ELIGIBLE (ERR_RETENTION_NOT_EXPIRED when RETAINED, ERR_DOCUMENT_ALREADY_PURGED when PURGED)"
          - "no ComplianceAuditCase for the carrier in {SCHEDULED, FIELD_WORK, FINDINGS_ISSUED, CORRECTIVE_ACTION_PHASE} (ERR_AUDIT_HOLD_ACTIVE)"
        side_effects: []

  - entity: RandomTestingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED_COMPLIANT, CLOSED_DEFICIENT]
    transitions:
      - from: OPEN
        to: CLOSED_COMPLIANT
        trigger: "POST /safety/random-testing-periods/{id}/close"
        actor: SafetyManager
        preconditions:
          - "status == OPEN (ERR_PERIOD_NOT_OPEN)"
          - "current logical clock >= (program_year + 1)-01-01T00:00:00Z (ERR_PERIOD_NOT_ENDED)"
          - "completed_drug_tests >= required_drug_tests AND completed_alcohol_tests >= required_alcohol_tests"
        side_effects: []
      - from: OPEN
        to: CLOSED_DEFICIENT
        trigger: "POST /safety/random-testing-periods/{id}/close"
        actor: SafetyManager
        preconditions:
          - "status == OPEN (ERR_PERIOD_NOT_OPEN)"
          - "current logical clock >= (program_year + 1)-01-01T00:00:00Z (ERR_PERIOD_NOT_ENDED)"
          - "completed_drug_tests < required_drug_tests OR completed_alcohol_tests < required_alcohol_tests"
        side_effects: []

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "coaching escalate | MRO verified positive/refusal (system cascades)"
        actor: system
        preconditions: []
        side_effects:
          - "driver.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /safety/drivers/{id}/reinstate | coaching complete/supersede auto-evaluation (system)"
        actor: SafetyManager
        preconditions:
          - "calculations.suspension_hold_evaluation returns zero holds (ERR_REINSTATE_REQUIREMENTS_UNMET)"
        side_effects:
          - "driver.version += 1"
      - from: "ACTIVE | SUSPENDED"
        to: TERMINATED
        trigger: "POST /safety/drivers/{id}/terminate"
        actor: SafetyManager
        preconditions:
          - "employment_status in {ACTIVE, SUSPENDED} (ERR_DRIVER_NOT_ACTIVE)"
        side_effects:
          - "all CoachingAssignments of the driver in {ASSIGNED, IN_PROGRESS, OVERDUE, ESCALATED} -> CANCELLED"
          - "driver.version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: coaching-create-stale-driver-version
    parent_entity: Driver
    write_endpoint: "POST /safety/coaching-assignments"
    occ_field: expected_driver_version
    description: |
      Creating a CoachingAssignment against a Driver whose version has advanced
      since the client last observed it is rejected. Creation legitimately
      supersedes any open assignment of the same (driver_id, coaching_type),
      so a second create issued after another manager's create still sees an
      ACTIVE driver and would succeed on state grounds alone; only the stale
      expected_driver_version reveals that the client's basis is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: carrier-patch-stale-version
    parent_entity: Carrier
    write_endpoint: "PATCH /safety/carriers/{id}"
    occ_field: expected_carrier_version
    description: |
      Updating a Carrier's fleet_size or legal_name with an
      expected_carrier_version older than the carrier's current version is
      rejected, because the carrier may have advanced through rating changes,
      audit closes, or measurement cycles that the client's edit did not
      account for.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: violation_time_weight
    trigger: "InspectionViolation creation; every measurement cycle (refresh against cycle as_of)"
    algorithm: threshold
    formula: |
      Let as_of = current logical clock. Month arithmetic is calendar-month
      subtraction with day-clamp (e.g. 2026-08-31 minus 6 months = 2026-02-28).
      occurred_at in [as_of - 6mo, as_of]        -> multiplier 3
      occurred_at in [as_of - 12mo, as_of - 6mo) -> multiplier 2
      occurred_at in [as_of - 24mo, as_of - 12mo) -> multiplier 1
      occurred_at <  as_of - 24mo                -> multiplier 0 (excluded from every measure and risk score)
      Interval starts are INCLUSIVE, interval ends EXCLUSIVE, except the
      upper end as_of of the first interval which is inclusive.
      weighted_points = severity_weight x multiplier.
    input_set: "The single violation being created or refreshed"
    constants:
      TIER1_MONTHS: 6
      TIER2_MONTHS: 12
      TIER3_MONTHS: 24
    precision: "integer multipliers; no rounding"

  - name: crash_severity_points
    trigger: "AccidentRecord creation"
    algorithm: aggregation
    formula: |
      crash_points = 4 x (1 if fatalities >= 1 else 0)
                   + 2 x (1 if injuries >= 1 else 0)
                   + 1 x (1 if tow_away else 0)
      dot_reportable = (fatalities >= 1) OR (injuries >= 1) OR (tow_away == true)
    input_set: "The single accident record"
    constants:
      FATALITY_POINTS: 4
      INJURY_POINTS: 2
      TOW_AWAY_POINTS: 1
    precision: "integer"

  - name: category_measure
    trigger: "measurement cycle (per carrier per category) -> MeasurementSnapshot"
    algorithm: aggregation
    formula: |
      Let as_of = cycle clock. For the carrier and category:
      violation_points = sum of weighted_points (recomputed at as_of per
        violation_time_weight) over InspectionViolations v where
        v.category_id == category AND v belongs to an inspection of this carrier
        AND variant-specific status filter (below) AND time_weight_multiplier > 0.
      For category CRASH_INDICATOR only, add crash_points x time_weight(occurred_at)
        over AccidentRecords of the carrier with dot_reportable == true
        (preventability irrelevant; identical in both variants because crashes
        are not challengeable).
      measure = violation_points / carrier.fleet_size, rounded half-up to 2 decimals.
    input_set: "Violations of the carrier in the category whose recomputed time_weight_multiplier > 0; official includes statuses {ACTIVE, CHALLENGED}, provisional includes {ACTIVE} only"
    constants:
      WINDOW_MONTHS: 24
    precision: "2 decimal places, round_half_up"
    variants:
      - name: official
        when: "Regulatory exposure view; drives alerted_official and carrier posture"
        difference: "Includes CHALLENGED violations"
      - name: provisional
        when: "Carrier's optimistic view while DataQs challenges are pending"
        difference: "Excludes CHALLENGED violations (REMOVED always excluded in both)"

  - name: percentile_from_measure
    trigger: "with category_measure inside a measurement cycle"
    algorithm: threshold
    formula: |
      percentile = min(100, floor(measure / category.benchmark_measure x 100))
      alerted    = (percentile >= category.intervention_threshold)
      applied independently to official and provisional measures.
    input_set: "The freshly computed measure and the category configuration"
    constants: {}
    precision: "integer percentile via floor; comparison is >= (equality alerts)"

  - name: carrier_posture
    trigger: "measurement cycle completion; audit close; rating upgrade decision"
    algorithm: constraint_propagation
    formula: |
      First matching rule wins (evaluation order is normative):
      1. If safety_rating == UNSATISFACTORY OR new_entrant_status == FAILED
         -> OUT_OF_SERVICE_PROPOSED
      2. Else if (count of categories with alerted_official) >= 2
              OR CONTROLLED_SUBSTANCES_ALCOHOL has alerted_official
         -> INTERVENTION_PRIORITY
      3. Else if (count of categories with alerted_official) == 1
         -> INTERVENTION_WATCH
      4. Else -> NORMAL
      Alerted categories are taken from the LATEST measurement cycle's
      snapshots; before any cycle, the alerted set is empty.
    input_set: "carrier.safety_rating, carrier.new_entrant_status, latest-cycle MeasurementSnapshot.alerted_official set"
    constants: {}
    precision: "enum derivation; no rounding"

  - name: driver_risk_score
    trigger: "violation create/overturn/uphold; accident determine-preventability; coaching complete; measurement cycle refresh"
    algorithm: aggregation
    formula: |
      as_of = current logical clock.
      risk_score = sum(weighted_points over driver's InspectionViolations with
                       status in {ACTIVE, CHALLENGED} and time_weight_multiplier > 0)
                 + sum(crash_points x time_weight(accident.occurred_at) over driver's
                       AccidentRecords with preventability_status == PREVENTABLE
                       and dot_reportable == true and time_weight > 0)
                 - 2 x count(driver's CoachingAssignments with status == COMPLETED
                       and completed_at in [as_of - 24mo, as_of])
      Floor: risk_score = max(0, risk_score).
      risk_tier: risk_score < 10 -> LOW; 10..19 -> MEDIUM; >= 20 -> HIGH.
    input_set: "Driver's non-removed violations, preventable reportable accidents, and recently completed coaching"
    constants:
      COACHING_CREDIT: 2
      CREDIT_WINDOW_MONTHS: 24
      TIER_MEDIUM_MIN: 10
      TIER_HIGH_MIN: 20
    precision: "integer"

  - name: insurance_premium
    trigger: "InsurancePremiumModel creation; recompute"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS NORMATIVE (single final rounding; no intermediate rounding):
      1. base_amount = carrier.fleet_size x base_rate_cents_per_unit
      2. rating_factor: NONE 1.05 | SATISFACTORY 1.00 | CONDITIONAL 1.25 | UNSATISFACTORY 1.60
         (PROJECTED with assume_rating uses the assumed rating's factor)
      3. score_loading_pct = min(15, 3 x N_alerted), where N_alerted counts
         categories alerted_official in the latest cycle; PROJECTED excludes
         codes listed in assume_cleared_category_codes. Before any cycle, N_alerted = 0.
      4. crash_loading_pct = min(25, 5 x N_preventable), where N_preventable counts
         the carrier's AccidentRecords with preventability_status == PREVENTABLE,
         dot_reportable == true, occurred_at in [as_of - 36mo, as_of];
         PROJECTED subtracts assume_removed_preventable_accidents (floored at 0).
      5. driver_loading_pct = min(10, 2 x N_high), where N_high counts the carrier's
         drivers with employment_status == ACTIVE and risk_tier == HIGH (same in both variants).
      6. computed_premium_cents = round_half_up_to_integer(
           base_amount x rating_factor x (1 + (score_loading_pct + crash_loading_pct + driver_loading_pct)/100))
      Rounding happens exactly once, at step 6.
    input_set: "Carrier fleet_size + rating; latest-cycle alert set; preventable in-window accidents; ACTIVE HIGH-tier drivers; scenario overrides"
    constants:
      FACTOR_NONE: 1.05
      FACTOR_SATISFACTORY: 1.00
      FACTOR_CONDITIONAL: 1.25
      FACTOR_UNSATISFACTORY: 1.60
      SCORE_LOADING_PER_ALERT: 3
      SCORE_LOADING_CAP: 15
      CRASH_LOADING_PER_ACCIDENT: 5
      CRASH_LOADING_CAP: 25
      CRASH_WINDOW_MONTHS: 36
      DRIVER_LOADING_PER_HIGH: 2
      DRIVER_LOADING_CAP: 10
    precision: "integer cents; round_half_up applied once at the final step"
    variants:
      - name: BASELINE
        when: "scenario == BASELINE"
        difference: "Uses current safety_rating, current alerted set, current preventable-accident count"
      - name: PROJECTED
        when: "scenario == PROJECTED"
        difference: "assume_rating replaces the rating factor; assume_cleared_category_codes removes those alerts from score_loading; assume_removed_preventable_accidents reduces crash_loading"

  - name: audit_outcome_rating
    trigger: "POST /safety/compliance-audit-cases/{id}/issue-findings"
    algorithm: threshold
    formula: |
      NEW_ENTRANT:
        FAIL if acute_count >= 1 OR critical_count >= 3, else PASS.
      COMPLIANCE_REVIEW:
        UNSATISFACTORY if acute_count >= 2 OR critical_count >= 4
        else SATISFACTORY if acute_count == 0 AND critical_count <= 1
        else CONDITIONAL.
      Boundaries are inclusive as written (acute 1 -> CONDITIONAL path; critical 3 -> CONDITIONAL; critical 4 -> UNSATISFACTORY).
    input_set: "acute_count, critical_count from the issue-findings payload"
    constants:
      NE_CRITICAL_FAIL_MIN: 3
      CR_ACUTE_UNSAT_MIN: 2
      CR_CRITICAL_UNSAT_MIN: 4
      CR_CRITICAL_SAT_MAX: 1
    precision: "enum derivation"

  - name: random_testing_quota
    trigger: "RandomTestingPeriod creation (required counts); period close (compliance verdict)"
    algorithm: threshold
    formula: |
      required_drug_tests   = ceil(avg_driver_count x 0.25)
      required_alcohol_tests = ceil(avg_driver_count x 0.10)
      completed counters count tests with test_type == RANDOM, matching substance,
      status == MRO_VERIFIED, mro_verdict in {VERIFIED_NEGATIVE, VERIFIED_POSITIVE,
      VERIFIED_REFUSAL}, collected_at in [program_year-01-01, (program_year+1)-01-01),
      for drivers whose carrier_id == period.carrier_id.
      close verdict: completed >= required for BOTH substances -> CLOSED_COMPLIANT,
      else CLOSED_DEFICIENT (equality is compliant).
    input_set: "Period's avg_driver_count; the carrier's verified RANDOM tests in the program year"
    constants:
      DRUG_RATE: 0.25
      ALCOHOL_RATE: 0.10
    precision: "integer via ceil; exact multiples do not round up (8 drivers -> 2 drug tests)"

  - name: retention_until
    trigger: "DocumentRecord creation"
    algorithm: chronological
    formula: |
      retention_months: INSPECTION_REPORT 12; DQ_FILE 36; ACCIDENT_REGISTER_ENTRY 36;
        TRAINING_CERTIFICATE 36; DRUG_TEST_RECORD 60; ALCOHOL_TEST_RECORD 60.
      retention_until = filed_at + retention_months calendar months, with the
      day-of-month clamped to the target month's last day when it does not exist
      (2024-02-29 + 12 months = 2025-02-28; 2026-01-31 + 12 months = 2027-01-31).
      Purge eligibility: clock >= retention_until (equality eligible).
    input_set: "The document being created"
    constants: {}
    precision: "datetime; calendar-month arithmetic with day-clamp"

  - name: suspension_hold_evaluation
    trigger: "driver reinstate; coaching complete or supersede of an ESCALATED assignment"
    algorithm: constraint_propagation
    formula: |
      Driver has a hold iff either:
      (a) any CoachingAssignment of the driver has status == ESCALATED, or
      (b) there exists a MRO_VERIFIED DrugAlcoholTest of the driver with
          mro_verdict in {VERIFIED_POSITIVE, VERIFIED_REFUSAL} for which NO
          MRO_VERIFIED RETURN_TO_DUTY test with mro_verdict == VERIFIED_NEGATIVE
          and collected_at > that test's verified_at exists.
      Reinstatement (manual or automatic) succeeds iff hold count == 0.
    input_set: "Driver's open coaching assignments and verified drug/alcohol tests"
    constants: {}
    precision: "boolean predicate"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is a declared role and is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present (incl. conditional: safety_audit_due_date iff is_new_entrant; accident_id iff test_type == POST_ACCIDENT); enum members valid; ranges valid (fleet_size >= 1, severity_weight 1..10, inspection_level 1..3, counts >= 0); policy_period_end > policy_period_start"
    error_id: "ERR_INVALID_REQUEST | ERR_MISSING_ACCIDENT_LINK | ERR_INVALID_FLEET_SIZE | ERR_INVALID_SEVERITY_WEIGHT | ERR_INVALID_DATE_RANGE"
    http_status: 400
    applies_to: all write endpoints

  - priority: 4
    category: existence
    check: "Path ids exist (left-to-right); then body FK ids exist in declared input order"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path or body ids

  - priority: 5
    category: state
    check: "Target entity and referenced entities are in a state that permits the operation (transition from-state, driver ACTIVE for new violations/tests/coaching — except test_type RETURN_TO_DUTY or FOLLOW_UP, which require SUSPENDED — inspection not FINALIZED, model DRAFT/QUOTED/STALE as required, etc.)"
    error_id: "state-specific: ERR_DRIVER_NOT_ACTIVE | ERR_INSPECTION_FINALIZED | ERR_VIOLATION_NOT_ACTIVE | ERR_CHALLENGE_* | ERR_COACHING_* | ERR_TEST_* | ERR_AUDIT_INVALID_STATE | ERR_UPGRADE_INVALID_STATE | ERR_PREMIUM_MODEL_* | ERR_RETENTION_NOT_EXPIRED | ERR_DOCUMENT_ALREADY_PURGED | ERR_PERIOD_NOT_OPEN | ERR_PREVENTABILITY_ALREADY_DETERMINED"
    http_status: 409
    applies_to: state-transition and state-gated endpoints

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_<parent>_version equals the parent entity's current version (only on endpoints that declare the field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /safety/coaching-assignments, PATCH /safety/carriers/{id}"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: MRO verifier != test recorder; preventability determiner != accident registrar"
    error_id: "ERR_SOD_VERIFIER_IS_RECORDER | ERR_SOD_PREVENTABILITY_SAME_USER"
    http_status: 409
    applies_to: "POST /safety/drug-alcohol-tests/{id}/verify, POST /safety/accident-records/{id}/determine-preventability"

  - priority: 8
    category: business_temporal
    check: "Clock/window rules: occurred_at <= clock; POST_ACCIDENT test within 8h (alcohol) / 32h (drug) of accident; upgrade create requires clock >= rating_cooling_off_until; new-entrant audit scheduled_date <= safety_audit_due_date; field work not before scheduled_date; period close only after program year end; clock moves strictly forward"
    error_id: "ERR_FUTURE_OCCURRENCE | ERR_POST_ACCIDENT_WINDOW_MISSED | ERR_COOLING_OFF_ACTIVE | ERR_AUDIT_SCHEDULED_PAST_DUE | ERR_AUDIT_BEFORE_SCHEDULED_DATE | ERR_PERIOD_NOT_ENDED | ERR_CLOCK_REGRESSION"
    http_status: 409
    applies_to: temporally gated endpoints

  - priority: 9
    category: business_constraint
    check: "Uniqueness/overlap/limits: dot_number, category_code, report_number per carrier, one testing period per (carrier, year), one open challenge per violation, one open upgrade request per carrier, audit field-work windows (half-open) non-overlapping, policy periods (closed) non-overlapping among DRAFT/QUOTED/BOUND, remand_count < 2, verdict matches lab result, one measurement cycle per carrier per UTC date, driver belongs to carrier, NEW_ENTRANT audit only for PENDING_AUDIT new entrants"
    error_id: "ERR_DUPLICATE_* | ERR_OPEN_UPGRADE_REQUEST_EXISTS | ERR_AUDIT_WINDOW_OVERLAP | ERR_POLICY_PERIOD_OVERLAP | ERR_REMAND_LIMIT_REACHED | ERR_VERDICT_RESULT_MISMATCH | ERR_CYCLE_ALREADY_RUN_TODAY | ERR_DRIVER_CARRIER_MISMATCH | ERR_AUDIT_TYPE_NOT_APPLICABLE"
    http_status: 409
    applies_to: constraint-checked endpoints

  - priority: 10
    category: business_referential
    check: "Cross-entity holds: finalize blocked by open challenges; purge blocked by open audit; field work requires audit-readiness; reinstate requires zero suspension holds; upgrade requires current rating CONDITIONAL|UNSATISFACTORY and requested rating strictly higher"
    error_id: "ERR_OPEN_CHALLENGES_BLOCK_FINALIZE | ERR_AUDIT_HOLD_ACTIVE | ERR_AUDIT_READINESS_INCOMPLETE | ERR_REINSTATE_REQUIREMENTS_UNMET | ERR_RATING_NOT_UPGRADABLE"
    http_status: 409
    applies_to: referentially gated endpoints

# =============================================================================
# 1.5 API Endpoint Table (flat; all list GETs support limit?/offset? plus filters)
# =============================================================================
endpoints:
  # --- Carrier ---
  - { method: POST, path: "/safety/carriers", description: "Register a carrier", roles: [SafetyAdmin], code: 201, input: [dot_number, legal_name, fleet_size, "is_new_entrant?", "safety_audit_due_date?"], output: Carrier, side_effects: ["safety_rating NONE; posture NORMAL; new_entrant_status per is_new_entrant; version 1"] }
  - { method: GET, path: "/safety/carriers", description: "List carriers", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "safety_rating?", "posture?"], output: "Carrier[]", side_effects: [] }
  - { method: GET, path: "/safety/carriers/{id}", description: "Get one carrier", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: Carrier, side_effects: [] }
  - { method: PATCH, path: "/safety/carriers/{id}", description: "Update fleet_size/legal_name under OCC", roles: [SafetyAdmin], code: 200, input: ["legal_name?", "fleet_size?", expected_carrier_version], output: Carrier, side_effects: ["increments Carrier.version by 1", "QUOTED premium models of the carrier -> STALE"] }
  - { method: GET, path: "/safety/carriers/{id}/audit-readiness", description: "Computed audit-readiness summary", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: "{ ready: boolean, missing_dq_driver_count: integer, accident_register_gap: integer, purge_eligible_document_count: integer, open_audit_case_count: integer }", side_effects: [] }

  # --- Driver ---
  - { method: POST, path: "/safety/drivers", description: "Add a driver to a carrier roster", roles: [SafetyManager], code: 201, input: [carrier_id, cdl_number, full_name, hire_date], output: Driver, side_effects: ["employment_status ACTIVE; risk_score 0; risk_tier LOW"] }
  - { method: GET, path: "/safety/drivers", description: "List drivers", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "employment_status?", "risk_tier?"], output: "Driver[]", side_effects: [] }
  - { method: GET, path: "/safety/drivers/{id}", description: "Get one driver", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: Driver, side_effects: [] }
  - { method: POST, path: "/safety/drivers/{id}/terminate", description: "Terminate a driver", roles: [SafetyManager], code: 200, input: [], output: Driver, side_effects: ["employment_status -> TERMINATED; open CoachingAssignments -> CANCELLED; increments Driver.version by 1"] }
  - { method: POST, path: "/safety/drivers/{id}/reinstate", description: "Reinstate a suspended driver when zero suspension holds remain", roles: [SafetyManager], code: 200, input: [], output: Driver, side_effects: ["employment_status -> ACTIVE; increments Driver.version by 1"] }

  # --- ViolationCategory ---
  - { method: POST, path: "/safety/violation-categories", description: "Define a measurement category", roles: [SafetyAdmin], code: 201, input: [category_code, display_name, intervention_threshold, benchmark_measure, "measure_window_months?"], output: ViolationCategory, side_effects: [] }
  - { method: GET, path: "/safety/violation-categories", description: "List categories", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?"], output: "ViolationCategory[]", side_effects: [] }
  - { method: GET, path: "/safety/violation-categories/{id}", description: "Get one category", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: ViolationCategory, side_effects: [] }

  # --- RoadsideInspection ---
  - { method: POST, path: "/safety/roadside-inspections", description: "Import a roadside inspection", roles: [SafetyManager], code: 201, input: [carrier_id, driver_id, report_number, inspection_date, inspection_level, state_code], output: RoadsideInspection, side_effects: ["review_status IMPORTED; total_weighted_points 0"] }
  - { method: GET, path: "/safety/roadside-inspections", description: "List inspections", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "driver_id?", "review_status?"], output: "RoadsideInspection[]", side_effects: [] }
  - { method: GET, path: "/safety/roadside-inspections/{id}", description: "Get one inspection", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: RoadsideInspection, side_effects: [] }
  - { method: POST, path: "/safety/roadside-inspections/{id}/begin-review", description: "IMPORTED -> UNDER_REVIEW", roles: [ComplianceAnalyst], code: 200, input: [], output: RoadsideInspection, side_effects: [] }
  - { method: POST, path: "/safety/roadside-inspections/{id}/finalize", description: "UNDER_REVIEW -> FINALIZED; blocked by open challenges", roles: [ComplianceAnalyst], code: 200, input: [], output: RoadsideInspection, side_effects: [] }

  # --- InspectionViolation ---
  - { method: POST, path: "/safety/inspection-violations", description: "Record a violation on an inspection", roles: [SafetyManager], code: 201, input: [inspection_id, category_id, violation_code, severity_weight, occurred_at, "driver_id?"], output: InspectionViolation, side_effects: ["time_weight_multiplier and weighted_points computed at current clock", "inspection.total_weighted_points recomputed", "driver.risk_score recomputed; risk_tier change marks carrier QUOTED premium models STALE"] }
  - { method: GET, path: "/safety/inspection-violations", description: "List violations", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "inspection_id?", "category_id?", "driver_id?", "status?"], output: "InspectionViolation[]", side_effects: [] }
  - { method: GET, path: "/safety/inspection-violations/{id}", description: "Get one violation", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: InspectionViolation, side_effects: [] }

  # --- DataQsChallenge ---
  - { method: POST, path: "/safety/dataqs-challenges", description: "File a DataQs challenge against a violation", roles: [ComplianceAnalyst], code: 201, input: [violation_id, reason_code, evidence_note], output: DataQsChallenge, side_effects: ["violation ACTIVE -> CHALLENGED"] }
  - { method: GET, path: "/safety/dataqs-challenges", description: "List challenges", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "violation_id?", "status?"], output: "DataQsChallenge[]", side_effects: [] }
  - { method: GET, path: "/safety/dataqs-challenges/{id}", description: "Get one challenge", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: DataQsChallenge, side_effects: [] }
  - { method: POST, path: "/safety/dataqs-challenges/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [SafetyAdmin], code: 200, input: [], output: DataQsChallenge, side_effects: [] }
  - { method: POST, path: "/safety/dataqs-challenges/{id}/decide", description: "UNDER_REVIEW -> UPHELD | OVERTURNED | REMANDED", roles: [SafetyAdmin], code: 200, input: [outcome], output: DataQsChallenge, side_effects: ["UPHELD: violation -> ACTIVE; OVERTURNED: violation -> REMOVED + inspection/driver recompute cascade + premium STALE on tier change; REMANDED: remand_count += 1"] }
  - { method: POST, path: "/safety/dataqs-challenges/{id}/resubmit", description: "REMANDED -> SUBMITTED with new evidence", roles: [ComplianceAnalyst], code: 200, input: [evidence_note], output: DataQsChallenge, side_effects: [] }

  # --- CoachingAssignment ---
  - { method: POST, path: "/safety/coaching-assignments", description: "Assign coaching to a driver (supersedes open assignment of same type; OCC on driver)", roles: [SafetyManager], code: 201, input: [driver_id, coaching_type, due_date, "source_violation_id?", expected_driver_version], output: CoachingAssignment, side_effects: ["prior open assignment of same (driver_id, coaching_type) -> SUPERSEDED (+ hold re-evaluation if it was ESCALATED)", "increments Driver.version by 1"] }
  - { method: GET, path: "/safety/coaching-assignments", description: "List coaching assignments", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "driver_id?", "status?", "source_violation_id?"], output: "CoachingAssignment[]", side_effects: [] }
  - { method: GET, path: "/safety/coaching-assignments/{id}", description: "Get one coaching assignment", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: CoachingAssignment, side_effects: [] }
  - { method: POST, path: "/safety/coaching-assignments/{id}/start", description: "ASSIGNED -> IN_PROGRESS", roles: [SafetyManager], code: 200, input: [], output: CoachingAssignment, side_effects: [] }
  - { method: POST, path: "/safety/coaching-assignments/{id}/complete", description: "ASSIGNED|IN_PROGRESS|OVERDUE|ESCALATED -> COMPLETED", roles: [SafetyManager], code: 200, input: [completion_note], output: CoachingAssignment, side_effects: ["completed_at := clock", "driver.risk_score recomputed (completion credit)", "if was ESCALATED: suspension hold re-evaluation; SUSPENDED -> ACTIVE iff zero holds"] }
  - { method: POST, path: "/safety/coaching-assignments/{id}/escalate", description: "OVERDUE -> ESCALATED; suspends the driver", roles: [SafetyManager], code: 200, input: [], output: CoachingAssignment, side_effects: ["driver -> SUSPENDED; coaching_strikes += 1; increments Driver.version by 1"] }

  # --- DrugAlcoholTest ---
  - { method: POST, path: "/safety/drug-alcohol-tests", description: "Record a drug/alcohol test collection", roles: [SafetyManager], code: 201, input: [driver_id, test_type, substance, collected_at, "accident_id?"], output: DrugAlcoholTest, side_effects: ["status COLLECTED; lab_result PENDING; recorded_by := X-User-ID"] }
  - { method: GET, path: "/safety/drug-alcohol-tests", description: "List tests", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "driver_id?", "test_type?", "status?", "accident_id?"], output: "DrugAlcoholTest[]", side_effects: [] }
  - { method: GET, path: "/safety/drug-alcohol-tests/{id}", description: "Get one test", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: DrugAlcoholTest, side_effects: [] }
  - { method: POST, path: "/safety/drug-alcohol-tests/{id}/report-lab-result", description: "COLLECTED -> LAB_REPORTED (or CANCELLED)", roles: [SafetyManager], code: 200, input: [lab_result], output: DrugAlcoholTest, side_effects: ["lab_result := payload"] }
  - { method: POST, path: "/safety/drug-alcohol-tests/{id}/verify", description: "LAB_REPORTED -> MRO_VERIFIED (or CANCELLED); positive/refusal suspends driver", roles: [MedicalReviewOfficer], code: 200, input: [verdict], output: DrugAlcoholTest, side_effects: ["VERIFIED_POSITIVE|VERIFIED_REFUSAL: ACTIVE driver -> SUSPENDED, Driver.version += 1", "verified_by_user_id, verified_at stamped"] }

  # --- AccidentRecord ---
  - { method: POST, path: "/safety/accident-records", description: "Register an accident", roles: [SafetyManager], code: 201, input: [carrier_id, driver_id, occurred_at, fatalities, injuries, tow_away, "hazmat_release?"], output: AccidentRecord, side_effects: ["dot_reportable and crash_points computed", "registered_by := X-User-ID", "preventability_status PENDING_REVIEW"] }
  - { method: GET, path: "/safety/accident-records", description: "List accident register entries", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "driver_id?", "preventability_status?"], output: "AccidentRecord[]", side_effects: [] }
  - { method: GET, path: "/safety/accident-records/{id}", description: "Get one accident record", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: AccidentRecord, side_effects: [] }
  - { method: POST, path: "/safety/accident-records/{id}/determine-preventability", description: "PENDING_REVIEW -> PREVENTABLE | NOT_PREVENTABLE (SoD vs registrar)", roles: [SafetyDirector], code: 200, input: [determination], output: AccidentRecord, side_effects: ["PREVENTABLE: driver.risk_score recomputed; risk_tier change marks carrier QUOTED premium models STALE"] }

  # --- ComplianceAuditCase ---
  - { method: POST, path: "/safety/compliance-audit-cases", description: "Schedule an audit; half-open field-work window overlap check", roles: [SafetyAdmin], code: 201, input: [carrier_id, audit_type, scheduled_date, "field_work_duration_days?"], output: ComplianceAuditCase, side_effects: ["status SCHEDULED"] }
  - { method: GET, path: "/safety/compliance-audit-cases", description: "List audit cases", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "audit_type?", "status?"], output: "ComplianceAuditCase[]", side_effects: [] }
  - { method: GET, path: "/safety/compliance-audit-cases/{id}", description: "Get one audit case", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: ComplianceAuditCase, side_effects: [] }
  - { method: POST, path: "/safety/compliance-audit-cases/{id}/start-field-work", description: "SCHEDULED -> FIELD_WORK; gated by clock >= scheduled_date and audit readiness", roles: [SafetyAdmin], code: 200, input: [], output: ComplianceAuditCase, side_effects: [] }
  - { method: POST, path: "/safety/compliance-audit-cases/{id}/issue-findings", description: "FIELD_WORK -> FINDINGS_ISSUED; computes proposed_outcome", roles: [SafetyAdmin], code: 200, input: [acute_count, critical_count], output: ComplianceAuditCase, side_effects: ["proposed_outcome per calculations.audit_outcome_rating"] }
  - { method: POST, path: "/safety/compliance-audit-cases/{id}/begin-corrective-action", description: "FINDINGS_ISSUED -> CORRECTIVE_ACTION_PHASE (adverse outcomes only)", roles: [SafetyManager], code: 200, input: [], output: ComplianceAuditCase, side_effects: [] }
  - { method: POST, path: "/safety/compliance-audit-cases/{id}/close", description: "FINDINGS_ISSUED|CORRECTIVE_ACTION_PHASE -> CLOSED_PASSED|CLOSED_FAILED with carrier rating cascade", roles: [SafetyDirector], code: 200, input: [], output: ComplianceAuditCase, side_effects: ["applies proposed_outcome to carrier (rating / new-entrant status / cooling-off / posture / premium STALE sweep); increments Carrier.version by 1"] }

  # --- RatingUpgradeRequest ---
  - { method: POST, path: "/safety/rating-upgrade-requests", description: "File a safety-rating upgrade request", roles: [SafetyManager], code: 201, input: [carrier_id, requested_rating, justification_note], output: RatingUpgradeRequest, side_effects: ["status SUBMITTED"] }
  - { method: GET, path: "/safety/rating-upgrade-requests", description: "List upgrade requests", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "status?"], output: "RatingUpgradeRequest[]", side_effects: [] }
  - { method: GET, path: "/safety/rating-upgrade-requests/{id}", description: "Get one upgrade request", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: RatingUpgradeRequest, side_effects: [] }
  - { method: POST, path: "/safety/rating-upgrade-requests/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [SafetyDirector], code: 200, input: [], output: RatingUpgradeRequest, side_effects: [] }
  - { method: POST, path: "/safety/rating-upgrade-requests/{id}/decide", description: "UNDER_REVIEW -> APPROVED | DENIED with carrier rating cascade", roles: [SafetyDirector], code: 200, input: [outcome], output: RatingUpgradeRequest, side_effects: ["APPROVED: carrier.safety_rating := requested_rating, cooling-off cleared, posture recompute, premium STALE sweep, Carrier.version += 1; DENIED: cooling_off := clock + 90 days, Carrier.version += 1"] }

  # --- InsurancePremiumModel ---
  - { method: POST, path: "/safety/insurance-premium-models", description: "Model a policy premium (BASELINE or PROJECTED); closed-interval period overlap check", roles: [InsuranceAnalyst], code: 201, input: [carrier_id, policy_period_start, policy_period_end, base_rate_cents_per_unit, scenario, "assume_rating?", "assume_cleared_category_codes?", "assume_removed_preventable_accidents?"], output: InsurancePremiumModel, side_effects: ["computed_premium_cents per calculations.insurance_premium; carrier_version_at_compute := carrier.version; status DRAFT"] }
  - { method: GET, path: "/safety/insurance-premium-models", description: "List premium models", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "status?", "scenario?"], output: "InsurancePremiumModel[]", side_effects: [] }
  - { method: GET, path: "/safety/insurance-premium-models/{id}", description: "Get one premium model", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: InsurancePremiumModel, side_effects: [] }
  - { method: POST, path: "/safety/insurance-premium-models/{id}/quote", description: "DRAFT -> QUOTED; requires carrier_version_at_compute == carrier.version (DRAFT models are not eagerly swept, so the freshness check fires here with ERR_PREMIUM_INPUT_STALE)", roles: [InsuranceAnalyst], code: 200, input: [], output: InsurancePremiumModel, side_effects: [] }
  - { method: POST, path: "/safety/insurance-premium-models/{id}/recompute", description: "STALE -> DRAFT, or DRAFT -> DRAFT refresh (the recovery path for a DRAFT rejected at quote with ERR_PREMIUM_INPUT_STALE); recomputes from current data; re-validates period overlap excluding self", roles: [InsuranceAnalyst], code: 200, input: [], output: InsurancePremiumModel, side_effects: ["computed_premium_cents recomputed; carrier_version_at_compute := carrier.version"] }
  - { method: POST, path: "/safety/insurance-premium-models/{id}/bind", description: "QUOTED -> BOUND; requires fresh carrier_version_at_compute", roles: [InsuranceAnalyst], code: 200, input: [], output: InsurancePremiumModel, side_effects: [] }

  # --- DocumentRecord ---
  - { method: POST, path: "/safety/document-records", description: "File a compliance document; retention_until computed", roles: [SafetyManager], code: 201, input: [carrier_id, document_type, filed_at, "driver_id?"], output: DocumentRecord, side_effects: ["retention_months and retention_until computed; status RETAINED"] }
  - { method: GET, path: "/safety/document-records", description: "List documents", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "driver_id?", "document_type?", "status?"], output: "DocumentRecord[]", side_effects: [] }
  - { method: GET, path: "/safety/document-records/{id}", description: "Get one document", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: DocumentRecord, side_effects: [] }
  - { method: POST, path: "/safety/document-records/{id}/purge", description: "PURGE_ELIGIBLE -> PURGED; blocked by open audit", roles: [SafetyManager], code: 200, input: [], output: DocumentRecord, side_effects: [] }

  # --- RandomTestingPeriod ---
  - { method: POST, path: "/safety/random-testing-periods", description: "Open an annual random testing period", roles: [SafetyManager], code: 201, input: [carrier_id, program_year, avg_driver_count], output: RandomTestingPeriod, side_effects: ["required_drug_tests / required_alcohol_tests computed via ceil"] }
  - { method: GET, path: "/safety/random-testing-periods", description: "List testing periods", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "status?"], output: "RandomTestingPeriod[]", side_effects: [] }
  - { method: GET, path: "/safety/random-testing-periods/{id}", description: "Get one testing period", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: RandomTestingPeriod, side_effects: [] }
  - { method: POST, path: "/safety/random-testing-periods/{id}/close", description: "OPEN -> CLOSED_COMPLIANT | CLOSED_DEFICIENT after program year end", roles: [SafetyManager], code: 200, input: [], output: RandomTestingPeriod, side_effects: [] }

  # --- Measurement cycle (ops-run epoch) + snapshots ---
  - { method: POST, path: "/safety/measurement-cycles", description: "Run the monthly measurement epoch for one carrier: refresh time weights, emit one snapshot per category, recompute posture, sweep overdue coaching and purge-eligible documents, mark affected premium models STALE. One cycle per carrier per UTC date (ERR_CYCLE_ALREADY_RUN_TODAY).", roles: [ComplianceAnalyst], code: 201, input: [carrier_id], output: "{ cycle_date: string, carrier_id: string, snapshots_created: integer, overdue_coaching_marked: integer, documents_marked_purge_eligible: integer, premiums_marked_stale: integer, posture_before: string, posture_after: string }", side_effects: ["creates MeasurementSnapshots", "refreshes violation time_weight_multiplier/weighted_points and driver risk_score/risk_tier", "coaching ASSIGNED|IN_PROGRESS with clock > due_date -> OVERDUE", "documents RETAINED with clock >= retention_until -> PURGE_ELIGIBLE", "carrier.posture recomputed; carrier.last_cycle_date set; increments Carrier.version by 1", "carrier's QUOTED premium models -> STALE"] }
  - { method: GET, path: "/safety/measurement-snapshots", description: "List measurement snapshots", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: ["limit?", "offset?", "carrier_id?", "category_id?", "cycle_date?"], output: "MeasurementSnapshot[]", side_effects: [] }
  - { method: GET, path: "/safety/measurement-snapshots/{id}", description: "Get one snapshot", roles: [SafetyAdmin, SafetyDirector, SafetyManager, ComplianceAnalyst, MedicalReviewOfficer, InsuranceAnalyst], code: 200, input: [], output: MeasurementSnapshot, side_effects: [] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (strictly forward; ERR_CLOCK_REGRESSION). Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [SafetyAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/empty/unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  # --- request shape (400) ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field (incl. safety_audit_due_date when is_new_entrant), invalid enum member, wrong type, or negative count" }
  - { id: ERR_MISSING_ACCIDENT_LINK, http: 400, condition: "test_type == POST_ACCIDENT without accident_id, or accident_id present on a non-POST_ACCIDENT test" }
  - { id: ERR_INVALID_FLEET_SIZE, http: 400, condition: "fleet_size < 1" }
  - { id: ERR_INVALID_SEVERITY_WEIGHT, http: 400, condition: "severity_weight outside 1..10" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "policy_period_end <= policy_period_start, or collected_at before accident.occurred_at on a POST_ACCIDENT test" }
  # --- existence (404) ---
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Carrier id does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Driver id does not exist" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 404, condition: "ViolationCategory id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "RoadsideInspection id does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "InspectionViolation id does not exist" }
  - { id: ERR_CHALLENGE_NOT_FOUND, http: 404, condition: "DataQsChallenge id does not exist" }
  - { id: ERR_COACHING_NOT_FOUND, http: 404, condition: "CoachingAssignment id does not exist" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "DrugAlcoholTest id does not exist" }
  - { id: ERR_ACCIDENT_NOT_FOUND, http: 404, condition: "AccidentRecord id does not exist" }
  - { id: ERR_AUDIT_CASE_NOT_FOUND, http: 404, condition: "ComplianceAuditCase id does not exist" }
  - { id: ERR_UPGRADE_REQUEST_NOT_FOUND, http: 404, condition: "RatingUpgradeRequest id does not exist" }
  - { id: ERR_PREMIUM_MODEL_NOT_FOUND, http: 404, condition: "InsurancePremiumModel id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "DocumentRecord id does not exist" }
  - { id: ERR_TESTING_PERIOD_NOT_FOUND, http: 404, condition: "RandomTestingPeriod id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "MeasurementSnapshot id does not exist" }
  # --- state (409) ---
  - { id: ERR_DRIVER_NOT_ACTIVE, http: 409, condition: "Operation requires driver employment_status == ACTIVE (violation/test/coaching create, escalate, terminate when already TERMINATED)" }
  - { id: ERR_DRIVER_NOT_SUSPENDED, http: 409, condition: "reinstate requires employment_status == SUSPENDED; also fired when creating a RETURN_TO_DUTY or FOLLOW_UP test for a driver who is not SUSPENDED" }
  - { id: ERR_INSPECTION_NOT_REVIEWABLE, http: 409, condition: "begin-review requires IMPORTED; finalize requires UNDER_REVIEW" }
  - { id: ERR_INSPECTION_FINALIZED, http: 409, condition: "Violation create or challenge create on a FINALIZED inspection" }
  - { id: ERR_VIOLATION_NOT_ACTIVE, http: 409, condition: "Challenge create requires violation status == ACTIVE" }
  - { id: ERR_CHALLENGE_NOT_SUBMITTED, http: 409, condition: "start-review requires SUBMITTED" }
  - { id: ERR_CHALLENGE_NOT_UNDER_REVIEW, http: 409, condition: "decide requires UNDER_REVIEW (incl. second decide on a terminal challenge)" }
  - { id: ERR_CHALLENGE_NOT_REMANDED, http: 409, condition: "resubmit requires REMANDED" }
  - { id: ERR_COACHING_NOT_OPEN, http: 409, condition: "start/complete requires status in {ASSIGNED, IN_PROGRESS, OVERDUE, ESCALATED} (start: ASSIGNED only); also fired on SUPERSEDED/CANCELLED/COMPLETED" }
  - { id: ERR_COACHING_NOT_OVERDUE, http: 409, condition: "escalate requires OVERDUE" }
  - { id: ERR_TEST_NOT_COLLECTED, http: 409, condition: "report-lab-result requires COLLECTED" }
  - { id: ERR_TEST_NOT_LAB_REPORTED, http: 409, condition: "verify requires LAB_REPORTED" }
  - { id: ERR_PREVENTABILITY_ALREADY_DETERMINED, http: 409, condition: "determine-preventability requires PENDING_REVIEW" }
  - { id: ERR_AUDIT_INVALID_STATE, http: 409, condition: "Audit action's required from-state not met (incl. actions on CLOSED_* cases)" }
  - { id: ERR_UPGRADE_INVALID_STATE, http: 409, condition: "Upgrade action's required from-state not met (incl. decide on APPROVED/DENIED)" }
  - { id: ERR_PREMIUM_MODEL_NOT_DRAFT, http: 409, condition: "quote requires DRAFT" }
  - { id: ERR_PREMIUM_MODEL_NOT_QUOTED, http: 409, condition: "bind requires QUOTED" }
  - { id: ERR_PREMIUM_MODEL_NOT_STALE, http: 409, condition: "recompute requires status STALE or DRAFT (DRAFT refreshes in place); rejected on QUOTED or BOUND" }
  - { id: ERR_PREMIUM_INPUT_STALE, http: 409, condition: "quote/bind require carrier_version_at_compute == carrier.version" }
  - { id: ERR_RETENTION_NOT_EXPIRED, http: 409, condition: "purge requires PURGE_ELIGIBLE; fired when still RETAINED" }
  - { id: ERR_DOCUMENT_ALREADY_PURGED, http: 409, condition: "purge on an already PURGED document" }
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "close requires OPEN testing period" }
  # --- optimistic concurrency (412) ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version" }
  # --- segregation of duties (409) ---
  - { id: ERR_SOD_VERIFIER_IS_RECORDER, http: 409, condition: "MRO verifier X-User-ID equals the test's recorded_by_user_id" }
  - { id: ERR_SOD_PREVENTABILITY_SAME_USER, http: 409, condition: "Preventability determiner X-User-ID equals the accident's registered_by_user_id" }
  # --- temporal (409) ---
  - { id: ERR_FUTURE_OCCURRENCE, http: 409, condition: "occurred_at / collected_at / inspection_date is after the current logical clock" }
  - { id: ERR_POST_ACCIDENT_WINDOW_MISSED, http: 409, condition: "POST_ACCIDENT test collected more than 8h (ALCOHOL) or 32h (DRUG) after accident.occurred_at" }
  - { id: ERR_COOLING_OFF_ACTIVE, http: 409, condition: "RatingUpgradeRequest create while clock < carrier.rating_cooling_off_until" }
  - { id: ERR_AUDIT_SCHEDULED_PAST_DUE, http: 409, condition: "NEW_ENTRANT audit scheduled_date after carrier.safety_audit_due_date" }
  - { id: ERR_AUDIT_BEFORE_SCHEDULED_DATE, http: 409, condition: "start-field-work before scheduled_date" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "Testing period close before (program_year+1)-01-01T00:00:00Z" }
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc with to_iso8601 <= current logical clock" }
  # --- constraint (409) ---
  - { id: ERR_DUPLICATE_DOT_NUMBER, http: 409, condition: "dot_number already registered" }
  - { id: ERR_DUPLICATE_CATEGORY_CODE, http: 409, condition: "category_code already defined" }
  - { id: ERR_DUPLICATE_REPORT_NUMBER, http: 409, condition: "report_number already exists for the carrier" }
  - { id: ERR_DUPLICATE_TESTING_PERIOD, http: 409, condition: "A RandomTestingPeriod already exists for (carrier_id, program_year)" }
  - { id: ERR_OPEN_UPGRADE_REQUEST_EXISTS, http: 409, condition: "An open (SUBMITTED|UNDER_REVIEW) upgrade request already exists for the carrier" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 409, condition: "New audit's half-open field-work window intersects another non-closed audit's window for the carrier" }
  - { id: ERR_POLICY_PERIOD_OVERLAP, http: 409, condition: "Closed policy interval intersects another DRAFT/QUOTED/BOUND model's period for the carrier" }
  - { id: ERR_REMAND_LIMIT_REACHED, http: 409, condition: "decide REMANDED when remand_count == 2" }
  - { id: ERR_VERDICT_RESULT_MISMATCH, http: 409, condition: "MRO verdict inconsistent with lab_result (NEGATIVE->VERIFIED_NEGATIVE, POSITIVE->VERIFIED_POSITIVE, REFUSAL->VERIFIED_REFUSAL)" }
  - { id: ERR_CYCLE_ALREADY_RUN_TODAY, http: 409, condition: "A measurement cycle already ran for this carrier on the current UTC date" }
  - { id: ERR_DRIVER_CARRIER_MISMATCH, http: 409, condition: "driver_id belongs to a different carrier than the carrier_id on the request (inspections, accidents, documents)" }
  # --- referential (409) ---
  - { id: ERR_OPEN_CHALLENGES_BLOCK_FINALIZE, http: 409, condition: "finalize while any violation of the inspection has an open challenge" }
  - { id: ERR_AUDIT_HOLD_ACTIVE, http: 409, condition: "purge while any audit case of the carrier is in SCHEDULED|FIELD_WORK|FINDINGS_ISSUED|CORRECTIVE_ACTION_PHASE" }
  - { id: ERR_AUDIT_READINESS_INCOMPLETE, http: 409, condition: "start-field-work while audit-readiness.ready is false" }
  - { id: ERR_REINSTATE_REQUIREMENTS_UNMET, http: 409, condition: "reinstate while suspension_hold_evaluation finds a hold" }
  - { id: ERR_AUDIT_TYPE_NOT_APPLICABLE, http: 409, condition: "NEW_ENTRANT audit created for a carrier that is not a new entrant or whose new_entrant_status is not PENDING_AUDIT" }
  - { id: ERR_RATING_NOT_UPGRADABLE, http: 409, condition: "Upgrade create when carrier rating is NONE or SATISFACTORY, or requested_rating does not rank strictly above current rating" }
  - { id: ERR_CORRECTIVE_ACTION_NOT_APPLICABLE, http: 409, condition: "begin-corrective-action when proposed_outcome is PASS or SATISFACTORY" }

# =============================================================================
# 1.7 RBAC Matrix (all roles opaque operator identities; SoD compares X-User-ID values)
# =============================================================================
roles:
  - name: SafetyAdmin
    description: "Platform-side administrator: carrier registration, category configuration, audit scheduling and findings, DataQs adjudication (agency proxy), logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /safety/carriers, PATCH /safety/carriers/{id}"
      - "POST /safety/violation-categories"
      - "POST /safety/compliance-audit-cases, .../start-field-work, .../issue-findings"
      - "POST /safety/dataqs-challenges/{id}/start-review, .../decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: SafetyDirector
    description: "Carrier safety executive: audit close, rating upgrade adjudication, preventability determination"
    identity: opaque
    exclusive_operations:
      - "POST /safety/compliance-audit-cases/{id}/close"
      - "POST /safety/rating-upgrade-requests/{id}/start-review, .../decide"
      - "POST /safety/accident-records/{id}/determine-preventability"
    shared_operations:
      - "All GET endpoints"
  - name: SafetyManager
    description: "Day-to-day safety department operator (also the drug/alcohol DER): drivers, inspections, violations, coaching, tests, accidents, documents, testing periods, upgrade filings"
    identity: opaque
    exclusive_operations:
      - "POST /safety/drivers, .../terminate, .../reinstate"
      - "POST /safety/roadside-inspections; POST /safety/inspection-violations"
      - "POST /safety/coaching-assignments, .../start, .../complete, .../escalate"
      - "POST /safety/drug-alcohol-tests, .../report-lab-result"
      - "POST /safety/accident-records"
      - "POST /safety/document-records, .../purge"
      - "POST /safety/random-testing-periods, .../close"
      - "POST /safety/rating-upgrade-requests"
      - "POST /safety/compliance-audit-cases/{id}/begin-corrective-action"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceAnalyst
    description: "Data analyst: inspection review workflow, DataQs filing/resubmission, measurement cycle operation"
    identity: opaque
    exclusive_operations:
      - "POST /safety/roadside-inspections/{id}/begin-review, .../finalize"
      - "POST /safety/dataqs-challenges, .../resubmit"
      - "POST /safety/measurement-cycles"
    shared_operations:
      - "All GET endpoints"
  - name: MedicalReviewOfficer
    description: "Independent MRO: verifies lab results; segregated from the recording DER by the SoD rule"
    identity: opaque
    exclusive_operations:
      - "POST /safety/drug-alcohol-tests/{id}/verify"
    shared_operations:
      - "All GET endpoints"
  - name: InsuranceAnalyst
    description: "Insurance analyst: premium impact models, quoting, rebasing, binding"
    identity: opaque
    exclusive_operations:
      - "POST /safety/insurance-premium-models, .../quote, .../recompute, .../bind"
    shared_operations:
      - "All GET endpoints"
