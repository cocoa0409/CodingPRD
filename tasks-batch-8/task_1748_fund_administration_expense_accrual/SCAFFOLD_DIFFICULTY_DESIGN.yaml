# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x 2 instances = 18 instances. All numeric asserts were computed by
# executing the scaffold's formulas. Shared fixture values:
#   standard fund: admin_fee_bps 10, ACT_365, tiers [{100000000,50},{null,40}]
#   base kit: shares 10000, position qty 1000 @ price 100.00 on 2026-08-04 ->
#   GAV 100000.00, accrual 0.27, TNA 99999.73, nav_per_share 10.0000
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: nav_provisional_vs_final_pricing_variant
        grounds:
          - calculations.security_price_selection
          - entities.NavRecord.fields.provisional_nav_per_share
          - entities.NavRecord.fields.final_nav_per_share
        distinguishing_aspect: |
          Pricing-domain dual variant: on identical observation data (a SUBMITTED
          LEVEL_1 at 100.00 and an APPROVED LEVEL_2 at 99.00), the PROVISIONAL
          variant admits SUBMITTED rows and selects 100.00 while the FINAL_PRICED
          variant admits APPROVED rows only and selects 99.00 — both observable
          side by side on the same ESTIMATED record.
        test_recipe:
          setup:
            - "Fund (admin 10bps, ACT_365) with class, 10000 shares, position qty 1000"
            - "Security has two observations on 2026-08-04: EXCHANGE_CLOSE LEVEL_1 100.00 SUBMITTED; PRICING_SERVICE LEVEL_2 99.00 APPROVED"
            - "Logical clock at 2026-08-04T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: 100000000, rate_bps: 50 }, { up_to_net_assets: null, rate_bps: 40 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 99.00, source: "PRICING_SERVICE", pricing_level: "LEVEL_2" }, as: FundAccountant, captures: { px2_id: "$.data.id" } }
            - { call: "POST /price-observations/${px2_id}/approve", payload: {}, as: PricingCommittee }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id" } }
          assert:
            - "NavRecord.${nav_id}.gross_asset_value == 100000.00 (PROVISIONAL selects SUBMITTED LEVEL_1 100.00)"
            - "NavRecord.${nav_id}.nav_per_share == 10.0000 and provisional_nav_per_share == 10.0000"
            - "NavRecord.${nav_id}.final_nav_per_share == 9.9000 (FINAL_PRICED excludes the SUBMITTED row: GAV 99000.00, TNA 98999.73)"
            - "NavRecord.${nav_id}.pricing_variant_used == PROVISIONAL and expense_accrual_total == 0.27"
      - name: expense_accrual_day_count_divergence
        grounds:
          - calculations.expense_accrual_daily
          - entities.Fund.fields.day_count_convention
        distinguishing_aspect: |
          Expense-domain dual variant (different entity domain from the pricing
          variant): two funds identical except day_count_convention produce
          accruals 0.14 (ACT_365) vs 0.15 (ACT_360) on identical base 52340.00
          at identical 10bps.
        test_recipe:
          setup:
            - "Fund A ACT_365 and Fund B ACT_360, each with a class holding 10000 shares and a position qty 5234 priced 10.00 on 2026-08-04 (GAV 52340.00, first record so accrual base = GAV)"
            - "Logical clock at 2026-08-04T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Fund 365", ticker: "F365X", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_a: "$.data.id" } }
            - { call: "POST /funds", payload: { fund_name: "Fund 360", ticker: "F360X", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_360", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_b: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_a}", class_ticker: "F365A", distribution_frequency: "MONTHLY" }, as: FundController, captures: { class_a: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_b}", class_ticker: "F360A", distribution_frequency: "MONTHLY" }, as: FundController, captures: { class_b: "$.data.id" } }
            - { call: "POST /share-classes/${class_a}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /share-classes/${class_b}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0365", description: "Sec A", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_a: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0360", description: "Sec B", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_b: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_a}", security_id: "${sec_a}", quantity: 5234, cost_basis_total: 52340, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /positions", payload: { share_class_id: "${class_b}", security_id: "${sec_b}", quantity: 5234, cost_basis_total: 52340, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_a}", price_date: "2026-08-04", price: 10.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_b}", price_date: "2026-08-04", price: 10.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_a}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_a: "$.data.id" } }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_b}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_b: "$.data.id" } }
          assert:
            - "NavRecord.${nav_a}.expense_accrual_total == 0.14 (round2(52340 x 10/10000/365))"
            - "NavRecord.${nav_b}.expense_accrual_total == 0.15 (round2(52340 x 10/10000/360))"
            - "NavRecord.${nav_a}.total_net_assets == 52339.86 and NavRecord.${nav_b}.total_net_assets == 52339.85 — identical inputs, different accrual variant, different TNA"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: adviser_fee_tiered_marginal_straddle
        grounds:
          - calculations.adviser_fee_tiered
          - entities.FeeInvoice.fields.average_daily_net_assets
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: ADNA 119999671.23
          straddles the 100M tier boundary, so the marginal tier split (not the
          average rate) applies, then scales by inclusive 90-day year fraction
          and floors the waiver offset at zero.
        test_recipe:
          setup:
            - "Fund with tiers [{100000000, 50bps}, {null, 40bps}], class with 10000 shares and one position qty 1200000 priced 100.00 on 2026-08-04"
            - "NavRecord 2026-08-04 FINAL: GAV 120000000.00, accrual 328.77, TNA 119999671.23"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: 100000000, rate_bps: 50 }, { up_to_net_assets: null, rate_bps: 40 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1200000, cost_basis_total: 120000000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
          trigger:
            - { call: "POST /fee-invoices", payload: { fund_id: "${fund_id}", fee_type: "ADVISER", period_start: "2026-08-01", period_end: "2026-10-29" }, as: FundAccountant, as_user_id: "acct_1", captures: { inv_id: "$.data.id" } }
          assert:
            - "FeeInvoice.${inv_id}.average_daily_net_assets == 119999671.23 (single FINAL date in the 90-day period)"
            - "FeeInvoice.${inv_id}.gross_fee == 143013.37 (100M x 50bps + 19999671.23 x 40bps, x 90/365)"
            - "FeeInvoice.${inv_id}.waiver_offset == 0 and net_fee == 143013.37 and status == DRAFT"
      - name: distribution_per_share_rounding_order
        grounds:
          - calculations.distribution_per_share
          - entities.Distribution.fields.income_per_share
          - entities.Distribution.fields.total_amount
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          round4-per-share FIRST then multiply; with retained_income 51.00 over
          100000 shares the pinned order yields total 50.00, whereas
          multiply-first would yield 51.00.
        test_recipe:
          setup:
            - "Base kit fund/class with 100000 shares and a FINAL NavRecord on 2026-08-04"
            - "INCOME_POSTING of 51.00 raises retained_income to 51.00"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 100000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "INCOME_POSTING", activity_date: "2026-08-05", amount: 51.00 }, as: FundAccountant }
          trigger:
            - { call: "POST /distributions", payload: { share_class_id: "${class_id}", declaration_date: "2026-08-05", ex_date: "2026-08-06", record_date: "2026-08-07", payable_date: "2026-08-10" }, as: FundAccountant, captures: { dist_id: "$.data.id" } }
          assert:
            - "Distribution.${dist_id}.distributable_amount == 51.00 and shares_snapshot == 100000"
            - "Distribution.${dist_id}.income_per_share == 0.0005 (round4(51.00/100000))"
            - "Distribution.${dist_id}.total_amount == 50.00 (round2(0.0005 x 100000)), NOT 51.00 — per-share rounding happens first"
      - name: expense_cap_circular_evaluation_order
        grounds:
          - calculations.expense_cap_test_and_waiver
          - entities.WaiverLedgerEntry.fields.expires_at
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by an explicit evaluation
          order: accruals need net assets, the cap ratio needs accruals, and the
          scaffold breaks the circle by computing the ratio against the accrual
          BASE (never TNA) and booking the waiver off-record; observable as an
          exact 0.01 waiver above the cap and zero waiver at exact equality.
        test_recipe:
          setup:
            - "Fund/class with 10000 shares, position qty 3650 @ 100.00 (GAV 365000.00), waiver agreement cap 10bps effective 2026-08-01..2026-12-31 with 3-month recovery"
            - "2026-08-04 record FINAL: accrual 1.00 on base 365000 -> ratio exactly 10.0000 bps == cap -> NO waiver"
            - "2026-08-05 record: accrual 1.00 on base 364999.00 plus manual OTHER accrual 0.01 -> ratio 10.1000 > 10 -> waiver 0.01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 3650, cost_basis_total: 365000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px1_id: "$.data.id" } }
            - { call: "POST /price-observations/${px1_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /waiver-agreements", payload: { share_class_id: "${class_id}", cap_bps: 10, effective_from: "2026-08-01", effective_to: "2026-12-31", recovery_window_months: 3 }, as: FundController, captures: { agmt_id: "$.data.id" } }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav1_id: "$.data.id", nav1_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav1_id}/finalize", payload: { expected_nav_record_version: "${nav1_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "GET /waiver-agreements/${agmt_id}", payload: {}, as: FundController, captures: { bal_after_d1: "$.data.recoverable_balance" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: FundController }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-05", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px2_id: "$.data.id" } }
            - { call: "POST /price-observations/${px2_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-05" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav2_id: "$.data.id" } }
            - { call: "POST /expense-accruals", payload: { share_class_id: "${class_id}", accrual_date: "2026-08-05", category: "OTHER", annual_rate_bps: 0.1 }, as: FundAccountant, captures: { accr2_id: "$.data.id" } }
            - { call: "GET /nav-records/${nav2_id}", payload: {}, as: FundController, captures: { nav2_v: "$.data.version" } }
          trigger:
            - { call: "POST /nav-records/${nav2_id}/finalize", payload: { expected_nav_record_version: "${nav2_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "GET /waiver-agreements/${agmt_id}", payload: {}, as: FundController, captures: { bal_after_d2: "$.data.recoverable_balance" } }
            - { call: "GET /waiver-agreements/${agmt_id}/ledger", payload: {}, as: FundController, captures: { waiver_amount: "$.data[0].amount", waiver_expiry: "$.data[0].expires_at" } }
          assert:
            - "Day 1 finalize: ratio round4(1.00 x 365 / 365000 x 10000) == 10.0000 == cap -> ${bal_after_d1} == 0 (strictly-greater breach rule)"
            - "ExpenseAccrual.${accr2_id}.accrued_amount == 0.01 (base 364999.00 at 0.1bps)"
            - "Day 2 finalize: ratio 10.1000 > 10 -> WAIVER entry amount == 0.01, entry_date 2026-08-05, expires_at 2026-11-05 (${waiver_expiry})"
            - "WaiverAgreement.${agmt_id}.recoverable_balance == 0.01 (${bal_after_d2})"
            - "NavRecord.${nav2_id}.total_net_assets == 364998.99 (GAV 365000.00 - accruals 1.01; waiver does NOT mutate the triggering record's TNA)"
  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: nav_record_finalize_reopen_cycle
        grounds:
          - state_machines.NavRecord.FINAL_to_REOPENED
          - state_machines.NavRecord.REOPENED_to_FINAL
        distinguishing_aspect: |
          Cyclic machine on NavRecord: FINAL -> REOPENED -> FINAL is a legal
          loop (not a linear pipeline); each pass bumps version and re-runs the
          FINAL_PRICED recompute, ending FINAL at version 4.
        test_recipe:
          setup:
            - "Base kit: fund, class (10000 shares), position qty 1000, APPROVED price 100.00 on 2026-08-04"
            - "NavRecord 2026-08-04 created by acct_1 (version 1)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v1: "$.data.version" } }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v1}" }, as: FundController, as_user_id: "ctl_1", captures: { st1: "$.data.status" } }
            - { call: "POST /nav-records/${nav_id}/reopen", payload: {}, as: FundController, captures: { st2: "$.data.status", nav_v3: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v3}" }, as: FundController, as_user_id: "ctl_1", captures: { st3: "$.data.status", nav_v4: "$.data.version" } }
          assert:
            - "${st1} == FINAL, ${st2} == REOPENED, ${st3} == FINAL — the cycle closed"
            - "${nav_v4} == 4 (create + finalize + reopen + finalize)"
            - "NavRecord.${nav_id}.nav_per_share == 10.0000 after the loop (idempotent recompute on unchanged inputs)"
      - name: regulatory_filing_amendment_cycle
        grounds:
          - state_machines.RegulatoryFiling.FILED_to_AMENDED
          - state_machines.RegulatoryFiling.AMENDED_to_PENDING_REVIEW
        distinguishing_aspect: |
          Cyclic machine on a different entity: RegulatoryFiling loops
          FILED -> AMENDED -> PENDING_REVIEW -> APPROVED -> FILED, so the filing
          reaches FILED twice in one lifecycle (deadline/SoD gates re-evaluated
          on the second pass).
