      - name: case_score_weighted_sum_all_pass
        grounds:
          - calculations.case_recommendation_score
          - calculations.vote_tally
          - entities.TenureCase.fields.recommendation_score
        distinguishing_aspect: |
          Mode (a) combinatorial formula: recommendation_score combines THREE
          level percentages (inputs: 0.75, 0.80, 0.6667) with non-uniform weights
