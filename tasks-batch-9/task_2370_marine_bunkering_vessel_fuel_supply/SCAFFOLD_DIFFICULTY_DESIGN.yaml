scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: agreed_quantity_supplier_vs_joint_survey_basis
        grounds:
          - calculations.agreed_quantity_resolution
          - entities.DeliveryOrder.fields.agreed_quantity_mt
          - entities.DeliveryOrder.fields.measurement_basis
          - entities.DeliveryOrder.fields.shortfall_mt
          - entities.Customer.fields.settlement_basis
          - state_machines.DeliveryOrder.FIGURES_RECORDED_to_RESURVEYED
          - state_machines.DeliveryOrder.RESURVEYED_to_AGREED
        distinguishing_aspect: |
          This dual-variant calculation operates on the DeliveryOrder quantity-measurement domain:
          identical sounding/meter/survey figures yield agreed_quantity_mt 1198.450 with
          shortfall_mt 0.000 under the supplier_figures variant and 1191.850 with shortfall_mt
          6.600 under the joint_survey variant, and the variant is selected by
          Customer.settlement_basis, not by the caller.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:30:00Z"
            - "Port NLRTM (ECA, limit 0.100, notice 24h, capacity 2), grade MGO-DMA (max 0.100, tolerance 0.010, barging 9.50/mt, min fee 2000.00, DISTILLATE)"
            - "Customer with settlement_basis JOINT_SURVEY_MANDATORY and credit_limit_usd 5000000.00"
            - "Barge Alpha, 3000.000 mt, boom certified, turnaround buffer 90 minutes"
            - "One nomination for 1200.000 mt, compliance APPROVED, fulfillment DELIVERED"
            - "Its delivery order has logistics_status DELIVERED and measurement_status FIGURES_RECORDED with barge_sounding_mt 1198.450, vessel_sounding_mt 1191.200, meter_mt 1197.800 (the SUPPLIER_FIGURES same-request branch did NOT fire because the customer is JOINT_SURVEY_MANDATORY)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2, spill_response_tier: "TIER_1" }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, test_tolerance_pct: 0.010, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-03T00:00:00Z", price_usd_per_mt: 705.00, source: "PLATTS" }
              as: OpsCoordinator
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-10T00:00:00Z", price_usd_per_mt: 745.50, source: "PLATTS" }
              as: OpsCoordinator
            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00, payment_terms_days: 30, settlement_basis: "JOINT_SURVEY_MANDATORY" }
              as: CreditController
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Bunker Alpha", asset_type: "BARGE", capacity_mt: 3000.000, home_port_id: "${port_id}", boom_certified: true, segregated_tanks: false, turnaround_buffer_minutes: 90 }
              as: OpsCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", scrubber_fitted: false, nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
              captures: { nom_id: $.data.id }
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /nominations/${nom_id}/confirm"
              payload: {}
              as: OpsCoordinator
              captures: { nom_v3: $.data.version }
            - call: "POST /delivery-orders"
              payload: { nomination_id: "${nom_id}", asset_id: "${asset_id}", planned_quantity_mt: 1200.000, slot_start: "2026-08-10T06:00:00Z", slot_end: "2026-08-10T12:00:00Z", expected_nomination_version: "${nom_v3}" }
              as: OpsCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:30:00Z" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/clear"
              payload: { port_clearance_ref: "PA-RTM-0001" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/start-pumping"
              payload: {}
              as: BargeMaster
              as_user_id: "${asset_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:30:00Z" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/complete-pumping"
              payload: { barge_sounding_mt: 1198.450, vessel_sounding_mt: 1191.200, meter_mt: 1197.800 }
              as: BargeMaster
              as_user_id: "${asset_id}"
          trigger:
            - call: "POST /delivery-orders/${order_id}/joint-survey"
              payload: { surveyed_mt: 1191.850 }
              as: Surveyor
              as_user_id: "sv-001"
            - call: "POST /delivery-orders/${order_id}/quantity-decision"
              payload: { decision: "AGREE" }
              as: Surveyor
              as_user_id: "sv-001"
          assert:
            - "DeliveryOrder.${order_id}.measurement_status == AGREED"
            - "DeliveryOrder.${order_id}.measurement_basis == JOINT_SURVEY"
            - "DeliveryOrder.${order_id}.agreed_quantity_mt == 1191.850"
            - "DeliveryOrder.${order_id}.shortfall_mt == 6.600"
            - "DeliveryOrder.${order_id}.barge_sounding_mt == 1198.450 (unchanged; the supplier figure is recorded but does not govern)"
            - "The supplier_figures variant on the same three figures would have produced agreed_quantity_mt 1198.450 and shortfall_mt 0.000, a delta of 6.600 mt"

      - name: credit_exposure_conservative_vs_settled_divergence
        grounds:
          - calculations.customer_credit_exposure
          - entities.Customer.fields.outstanding_balance_usd
          - entities.Customer.fields.conservative_exposure_usd
          - entities.Customer.fields.available_credit_usd
          - entities.Customer.fields.open_commitment_count
          - endpoints["GET /customers/{id}/credit-exposure"]
        distinguishing_aspect: |
          This dual-variant calculation operates on the Customer credit-risk domain (a different
          entity domain from the DeliveryOrder quantity variants): the same customer data yields
          outstanding_balance_usd 941193.73 under the settled_receivables variant and
          conservative_exposure_usd 1686693.73 under the conservative_commitments variant, the
          745500.00 difference being one CONFIRMED but unbilled stem valued at the index price.
