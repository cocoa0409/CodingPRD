        distinguishing_aspect: |
          The OCC token is read mid-build and then invalidated by a perfectly ordinary milestone
          write on the other dimension, so the booking arrives holding version N while the skid is at
          N+1: the answer is ERR_STALE_SKID_VERSION (412), not a 422 about readiness - the skid really
          is READY, which is why this proves the version guard fires on its own account. The bay ledger
          stays 0 and no FatRun row is minted.
        test_recipe:
          setup:
            - 'TestBay BAY-1 seeded with reserved_footprint_minutes 0'
            - 'the project''s only Skid walked to MECH_COMPLETE and CONTROLS at LOOP_TESTED, whose version is captured'
            - 'one further milestone write (CONTROLS_COMPLETE) then advances the skid version by one, leaving fat_readiness READY'
