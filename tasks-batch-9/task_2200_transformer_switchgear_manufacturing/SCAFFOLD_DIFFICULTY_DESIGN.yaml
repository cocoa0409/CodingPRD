            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CON", legal_name: "Summit Bushing Co", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/long-lead-components"
              payload: { part_number: "CON-BSH", category: "HV_BUSHING", lead_time_days: 20, quantity_on_hand: 10, allocation_policy: "PREEMPTIBLE" }
              as: MaterialsPlanner
              captures: { comp_id: $.data.id }
