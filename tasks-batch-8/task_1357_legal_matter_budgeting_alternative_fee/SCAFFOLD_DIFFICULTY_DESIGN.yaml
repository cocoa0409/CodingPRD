        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Error-category pair: state (ERR_MATTER_NOT_OPEN, priority 5) vs
          business_temporal (ERR_PERIOD_CLOSED, priority 7). When a TimeEntry
          submission targets a CLOSED matter AND its entry_date falls in a
          closed fiscal period, the state error (higher priority = lower
          number) MUST be returned, not the temporal one.
        test_recipe:
          setup:
            - "Matter M1 was ACTIVE but is now CLOSED"
            - "Firm books closed through period 0 (closed_through_period_index=0)"
            - "TimeEntry TE1 (DRAFT) with entry_date in period 0"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
