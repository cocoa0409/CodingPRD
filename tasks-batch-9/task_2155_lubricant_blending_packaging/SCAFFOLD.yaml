    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["Order DRAFT -> CONFIRMED", "subtotal_cents, total_volume_l, freight_surcharge_cents, pre_credit_total_cents and total_cents computed per calculations.order_freight_and_credit", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/hold"
    description: "Puts a confirmed order on hold."
    roles: [SalesRep]
    code: 200
    input: [reason]
    output: Order
    side_effects: ["Order CONFIRMED -> HOLD", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/resume"
    description: "Returns a held order to CONFIRMED once every referenced configuration is ACTIVE again."
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["Order HOLD -> CONFIRMED", "every HOLD OrderLine -> OPEN", "pricing recomputed", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/invoice"
    description: "Invoices a confirmed order."
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["Order CONFIRMED -> INVOICED", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/void"
    description: "Voids an order, cancels its lines and returns any applied take-back credit to the customer ledger."
    roles: [SalesRep]
    code: 200
    input: [reason]
    output: Order
    side_effects: ["Order -> VOID", "every OPEN or HOLD OrderLine -> CANCELLED", "takeback_credit_applied_cents reset to 0 and total_cents recomputed", "Customer.takeback_credit_balance_cents recomputed and Customer.version incremented by 1", "increments Order.version by 1"]

  - method: POST
    path: "/orders/{id}/apply-takeback-credit"
    description: "Draws used-oil credit against an order that must be in status CONFIRMED and must carry takeback_linked == true. OCC-guarded on the customer's version per concurrency_rules[takeback-credit-apply-stale-customer]."
    roles: [SalesRep]
    code: 200
    input: [expected_customer_version]
    output: Order
    side_effects: ["takeback_credit_applied_cents and total_cents computed per calculations.order_freight_and_credit steps 4 and 5", "Customer.takeback_credit_balance_cents recomputed, Customer.last_credit_event_at stamped and Customer.version incremented by 1", "increments Order.version by 1"]

  # ---- TakebackCollection ----------------------------------------------------------
  - method: POST
    path: "/takeback-collections"
    description: "Schedules a used-oil collection for an account, optionally linked to a delivery order."
    roles: [SalesRep, Customer]
    code: 201
    input: [customer_id, "order_id?", "scheduled_volume_l?"]
    output: TakebackCollection
    side_effects: ["status initialised to SCHEDULED"]

  - method: GET
    path: "/takeback-collections/{id}"
    description: "Reads one collection including its credit variant and amount."
    roles: [PlatformAdmin, SalesRep, QCTechnician, QualityManager, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: TakebackCollection
    side_effects: []

  - method: GET
    path: "/takeback-collections"
    description: "Lists collections with filtering and pagination (reverse reachability for customer_id and order_id)."
    roles: [PlatformAdmin, SalesRep, QCTechnician, QualityManager, ComplianceOfficer, Customer]
    code: 200
    input: ["customer_id?", "order_id?", "status?", "limit?", "offset?"]
    output: TakebackCollection[]
    side_effects: []

  - method: POST
    path: "/takeback-collections/{id}/collect"
    description: "Records the litres actually picked up."
    roles: [SalesRep]
    code: 200
    input: [collected_volume_l]
    output: TakebackCollection
    side_effects: ["SCHEDULED -> COLLECTED", "increments TakebackCollection.version by 1"]

  - method: POST
    path: "/takeback-collections/{id}/assay"
    description: "Records the water and sediment assay; a combined contamination above 25 percent rejects the load outright."
    roles: [QCTechnician]
    code: 200
    input: [water_pct, sediment_pct]
    output: TakebackCollection
    side_effects: ["COLLECTED -> ASSAYED, or COLLECTED -> REJECTED when water_pct + sediment_pct > 25", "increments TakebackCollection.version by 1"]

  - method: POST
    path: "/takeback-collections/{id}/credit"
    description: "Grants the used-oil credit and posts it to the customer ledger; the variant is selected per calculations.takeback_credit."
    roles: [SalesRep]
    code: 200
    input: []
    output: TakebackCollection
    side_effects: ["COLLECTED -> CREDITED or ASSAYED -> CREDITED", "credit_variant and credit_cents computed", "Customer.takeback_credit_balance_cents recomputed, last_credit_event_at stamped and Customer.version incremented by 1", "increments TakebackCollection.version by 1"]

  # ---- SpecChangeRequest -----------------------------------------------------------
  - method: GET
    path: "/spec-change-requests/{id}"
    description: "Reads one change request with both fork branches."
    roles: [PlatformAdmin, ProductManager, QualityManager, ComplianceOfficer]
    code: 200
    input: []
    output: SpecChangeRequest
    side_effects: []

  - method: GET
    path: "/spec-change-requests"
    description: "Lists change requests with filtering and pagination (reverse reachability for SpecChangeRequest.product_spec_id)."
    roles: [PlatformAdmin, ProductManager, QualityManager, ComplianceOfficer]
    code: 200
    input: ["product_spec_id?", "status?", "limit?", "offset?"]
    output: SpecChangeRequest[]
    side_effects: []

  - method: POST
    path: "/spec-change-requests/{id}/submit"
    description: "Submits a change request; the fork opens immediately so the resulting status is IN_REVIEW with both branches PENDING."
    roles: [ProductManager]
    code: 200
    input: []
    output: SpecChangeRequest
    side_effects: ["DRAFT -> SUBMITTED -> IN_REVIEW in one request", "increments SpecChangeRequest.version by 1"]

  - method: POST
    path: "/spec-change-requests/{id}/viscosity-review"
    description: "Records the viscosity branch verdict. decision is CLEAR or BLOCK; CLEAR is refused when any ACTIVE recipe would fall outside the requested band."
    roles: [QualityManager]
    code: 200
    input: [decision, "note?"]
    output: SpecChangeRequest
    side_effects: ["viscosity_review set", "join to CLEARED or REJECTED when both branches have decided", "increments SpecChangeRequest.version by 1"]

  - method: POST
    path: "/spec-change-requests/{id}/approval-review"
    description: "Records the certification branch verdict and counts the claims that will need re-approval. decision is CLEAR or BLOCK."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
    output: SpecChangeRequest
    side_effects: ["approval_review set", "claims_to_suspend_count recorded", "join to CLEARED or REJECTED when both branches have decided", "increments SpecChangeRequest.version by 1"]

  - method: POST
    path: "/spec-change-requests/{id}/make-effective"
    description: "Makes a cleared change effective and fires cascade A across the spec, its claims, its configurations and their order lines."
    roles: [ProductManager]
    code: 200
    input: []
    output: SpecChangeRequest
    side_effects: ["CLEARED -> EFFECTIVE", "ProductSpec.revision + 1 with the four requested fields written through", "ACTIVE claims pinned to the old revision -> SUSPENDED", "ACTIVE configurations carrying those claim_codes -> CLAIM_BLOCKED", "their OPEN order lines -> HOLD and CONFIRMED orders -> HOLD", "ACTIVE recipes pinned to the old revision -> RETIRED", "increments SpecChangeRequest.version by 1"]

  - method: POST
    path: "/spec-change-requests/{id}/withdraw"
    description: "Withdraws a DRAFT change request."
    roles: [ProductManager]
    code: 200
    input: [reason]
    output: SpecChangeRequest
    side_effects: ["DRAFT -> WITHDRAWN", "increments SpecChangeRequest.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "a Customer-role caller touches a resource whose customer_id differs from the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the caller's X-User-ID matches a technician_user_id on a QCResult of the batch being released or waived"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is not a declared member, a numeric field is out of range, or a datetime does not parse"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id in a path segment or request body does not resolve"
  - id: ERR_COMPONENT_LOT_NOT_FOUND
    http: 404
    condition: "component lot id in a path segment does not resolve"
  - id: ERR_PRODUCT_SPEC_NOT_FOUND
    http: 404
    condition: "product spec id in a path segment or request body does not resolve"
  - id: ERR_BLEND_RECIPE_NOT_FOUND
    http: 404
    condition: "blend recipe id in a path segment or request body does not resolve"
  - id: ERR_BLEND_TANK_NOT_FOUND
    http: 404
    condition: "blend tank id in a path segment or request body does not resolve"
  - id: ERR_BLEND_BATCH_NOT_FOUND
    http: 404
    condition: "blend batch id in a path segment or request body does not resolve"
  - id: ERR_RETAIN_SAMPLE_NOT_FOUND
    http: 404
    condition: "retain sample id in a path segment does not resolve"
  - id: ERR_APPROVAL_CLAIM_NOT_FOUND
    http: 404
    condition: "approval claim id in a path segment does not resolve"
  - id: ERR_PACKAGE_CONFIGURATION_NOT_FOUND
    http: 404
    condition: "package configuration id in a path segment or request body does not resolve"
  - id: ERR_PACKAGING_LINE_NOT_FOUND
    http: 404
    condition: "packaging line id in a path segment or request body does not resolve"
  - id: ERR_PACKAGING_RUN_NOT_FOUND
    http: 404
    condition: "packaging run id in a path segment does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id in a path segment or request body does not resolve"
  - id: ERR_TAKEBACK_COLLECTION_NOT_FOUND
    http: 404
    condition: "takeback collection id in a path segment does not resolve"
  - id: ERR_SPEC_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "spec change request id in a path segment does not resolve"
  - id: ERR_STALE_SPEC_VERSION
    http: 412
    condition: "expected_product_spec_version does not equal the ProductSpec's current version on POST /product-specs/{id}/change-requests"
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "expected_customer_version does not equal the Customer's current version on POST /orders/{id}/apply-takeback-credit"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's own current state is not a declared from-state for the requested transition"
  - id: ERR_TANK_NOT_AVAILABLE
    http: 409
    condition: "the tank named in a charge request has status CHARGED or QUARANTINED"
  - id: ERR_RECIPE_NOT_ACTIVE
    http: 409
    condition: "the batch's BlendRecipe is DRAFT or RETIRED when a charge is attempted"
  - id: ERR_SPEC_NOT_ACTIVE
    http: 409
    condition: "the governing ProductSpec is DRAFT or WITHDRAWN where an ACTIVE spec is required"
  - id: ERR_BATCH_NOT_RELEASED
    http: 409
    condition: "a packaging run is scheduled against a batch whose production_status is not RELEASED"
  - id: ERR_CONFIG_NOT_ACTIVE
    http: 409
    condition: "a PackageConfiguration referenced by a run, an order line, a confirm or a resume is not ACTIVE"
  - id: ERR_LINE_NOT_AVAILABLE
    http: 409
    condition: "the packaging line is DOWN"
  - id: ERR_FLUSH_REQUIRED
    http: 422
    condition: "a FOOD_GRADE_H1 product meets a non-H1 heel, or a non-H1 product meets an H1 heel, at any ratio"
  - id: ERR_HEEL_CONTAMINATION_EXCEEDED
    http: 422
    condition: "heel_ratio_actual exceeds 0.005000 for a cross-family heel or 0.020000 for a same-family heel"
  - id: ERR_LOT_QUARANTINED
    http: 422
    condition: "AVAILABLE lots of a required component_code fall short of required_kg, but AVAILABLE plus QUARANTINED lots of that code would have covered it"
  - id: ERR_TREAT_RATE_BELOW_SPEC
    http: 422
    condition: "BlendRecipe.additive_treat_pct is below ProductSpec.min_additive_treat_pct at activation"
  - id: ERR_PREDICTED_VISCOSITY_OUT_OF_SPEC
    http: 422
    condition: "BlendRecipe.predicted_kv100_cst falls outside the spec's viscosity band at activation"
  - id: ERR_CLAIM_NOT_SUBSTANTIATED
    http: 422
    condition: "a claim-bearing configuration is packed from a batch with claim_eligible false, or a QC waiver is attempted on a batch with claim_eligible true"
  - id: ERR_INSUFFICIENT_RETAINS
    http: 422
    condition: "retain_count is below 2 at release, including the zero-retain case"
  - id: ERR_TANK_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open tank window, widened by the changeover buffer when the chemistry differs, overlaps another batch's window on the same tank"
  - id: ERR_LINE_CAPACITY_EXCEEDED
    http: 409
    condition: "the count of closed-interval-overlapping SCHEDULED or RUNNING runs on the line already equals max_concurrent_runs"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_RETENTION_WINDOW_ACTIVE
    http: 422
    condition: "a retain is disposed of before the logical clock reaches its retention_until"
  - id: ERR_RECIPE_FRACTION_SUM
    http: 422
    condition: "the recipe's mass_fraction_pct values do not sum to exactly 100.00"
  - id: ERR_SPEC_REVISION_STALE
    http: 409
    condition: "BlendRecipe.spec_revision_pinned is behind the current ProductSpec.revision"
  - id: ERR_CLAIM_NOT_ACTIVE
    http: 422
    condition: "a configuration's claim_codes reference a claim that is not ACTIVE on the same spec"
  - id: ERR_NO_ELIGIBLE_RECIPE
    http: 409
    condition: "a claim is submitted while the spec has no ACTIVE recipe pinned to the current revision"
  - id: ERR_TAKEBACK_AGREEMENT_INACTIVE
    http: 409
    condition: "take-back activity is attempted while Customer.takeback_agreement_status is NONE or SUSPENDED"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "the (product_spec_id, claim_body, claim_code) triple already exists in a non-terminal claim"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "product_code, tank_code, batch_code or line_code is already taken, or retain_code repeats inside a batch"
  - id: ERR_COMPONENT_SHORTAGE
    http: 422
    condition: "AVAILABLE lots of a required component_code cannot cover required_kg and no QUARANTINED lot of that code exists that would have closed the gap"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "Order.pre_credit_total_cents exceeds Customer.credit_limit_cents"
  - id: ERR_NO_TAKEBACK_CREDIT
    http: 422
    condition: "take-back credit is applied to an order that is not takeback_linked, or the customer's balance is 0"
  - id: ERR_TANK_CAPACITY_EXCEEDED
    http: 422
    condition: "heel_volume_l plus charge_volume_l exceeds BlendTank.capacity_l"
  - id: ERR_VISCOSITY_REVIEW_BLOCKED
    http: 422
    condition: "a CLEAR verdict is attempted while an ACTIVE recipe on the spec falls outside the requested viscosity band"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Master-data operator: registers accounts, component lots, tanks and filling lines, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /customers"
      - "POST /component-lots"
      - "POST /blend-tanks"
      - "POST /packaging-lines"
      - "POST /packaging-lines/{id}/service-status"
    shared_operations:
      - "POST /customers/{id}/takeback-agreement (with SalesRep)"
      - "every staff-visible GET"

  - name: ProductManager
    description: "Owns specifications, recipes, package configurations and the spec-change workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /product-specs"
      - "POST /product-specs/{id}/activate"
      - "POST /product-specs/{id}/withdraw"
      - "POST /product-specs/{id}/change-requests"
      - "POST /blend-recipes"
      - "POST /blend-recipes/{id}/activate"
      - "POST /package-configurations"
      - "POST /package-configurations/{id}/activate"
      - "POST /package-configurations/{id}/retire"
      - "POST /spec-change-requests/{id}/submit"
      - "POST /spec-change-requests/{id}/make-effective"
      - "POST /spec-change-requests/{id}/withdraw"
    shared_operations:
      - "every staff-visible GET"

  - name: BlendOperator
    description: "Runs the blend floor: creates batches, charges tanks, completes blends, flushes tanks and schedules packaging runs. Deliberately cannot record QC results or release a batch."
    identity: "opaque"
    exclusive_operations:
      - "POST /blend-batches"
      - "POST /blend-batches/{id}/charge"
      - "POST /blend-batches/{id}/cancel-charge"
      - "POST /blend-batches/{id}/complete-blend"
      - "POST /blend-batches/{id}/rework"
      - "POST /blend-tanks/{id}/flush"
      - "POST /packaging-runs"
      - "POST /packaging-runs/{id}/start"
      - "POST /packaging-runs/{id}/complete"
      - "POST /packaging-runs/{id}/cancel"
    shared_operations:
      - "every staff-visible GET"

  - name: QCTechnician
    description: "Laboratory analyst: records test results, books retain jars and assays used-oil loads. Every result carries the technician's X-User-ID, which later locks that person out of the disposition decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /blend-batches/{id}/qc-results"
      - "POST /blend-batches/{id}/retain-samples"
      - "POST /takeback-collections/{id}/assay"
    shared_operations:
      - "every staff-visible GET"

  - name: QualityManager
    description: "Disposition authority: releases, quarantines, disposes and waives batches, quarantines lots, disposes retains and rules on the viscosity branch of a spec change. Barred by segregation of duties from disposing of any batch whose QC results carry the manager's own X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /blend-batches/{id}/release"
      - "POST /blend-batches/{id}/quarantine"
      - "POST /blend-batches/{id}/dispose"
      - "POST /blend-batches/{id}/waive-qc"
      - "POST /component-lots/{id}/quarantine"
      - "POST /retain-samples/{id}/dispose"
      - "POST /spec-change-requests/{id}/viscosity-review"
    shared_operations:
      - "every staff-visible GET"

  - name: ComplianceOfficer
    description: "Owns API/ILSAC/OEM approval claims and the certification branch of a spec change."
    identity: "opaque"
    exclusive_operations:
      - "POST /approval-claims"
      - "POST /approval-claims/{id}/submit"
      - "POST /approval-claims/{id}/decision"
      - "POST /approval-claims/{id}/lifecycle"
      - "POST /spec-change-requests/{id}/approval-review"
    shared_operations:
      - "every staff-visible GET"

  - name: SalesRep
    description: "Commercial desk: opens orders and lines, confirms, holds, resumes, invoices and voids them, applies take-back credit and runs collections."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/confirm"
      - "POST /orders/{id}/hold"
      - "POST /orders/{id}/resume"
      - "POST /orders/{id}/invoice"
      - "POST /orders/{id}/void"
      - "POST /orders/{id}/apply-takeback-credit"
      - "POST /takeback-collections/{id}/collect"
      - "POST /takeback-collections/{id}/credit"
    shared_operations:
      - "POST /customers/{id}/takeback-agreement (with PlatformAdmin)"
      - "POST /takeback-collections (with Customer)"
      - "every staff-visible GET"

  - name: Customer
    description: "The buying account acting for itself. X-User-ID is the Customer row's id, so ownership checks compare it directly against Order.customer_id and TakebackCollection.customer_id."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /takeback-collections (with SalesRep), restricted to its own customer_id"
      - "GET /customers/{id}, GET /orders/{id}, GET /orders, GET /orders/{id}/lines, GET /takeback-collections/{id}, GET /takeback-collections, all restricted to its own customer_id"
