# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3401_seasonal_confection_production_planning_retail_sell_through
# 9 Difficulty Rules x 2 instances. Every setup_api_calls / trigger chain is
# replayable from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Shared fixture (anchors defined at first use, referenced later):
#   Program HALLOWEEN 2027, retail_price_cents 499,
#   windows: commit [2027-01-10, 2027-02-15), deadline 2027-06-30,
#   ship [2027-07-15, 2027-09-15], on-shelf 2027-09-20, pull 2027-11-15,
#   destroy-by 2027-12-31. Warehouse W1 cap 1000. Summer months {6,7,8}.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_provisional_vs_final_settlement
        grounds:
          - calculations.landed_material_cost
          - entities.CommodityContract.fields.provisional_spend_cents
          - entities.CommodityContract.fields.effective_spend_cents
          - endpoints.POST_/confection/commodity-contracts/{id}/settle
        distinguishing_aspect: "Same contract data priced by two variants on the procurement domain: PROVISIONAL references contract_price, FINAL references actual spot_price — they diverge by exactly the hedge payoff whenever spot != contract."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. One HALLOWEEN 2027 program in PLANNING."
            - "COCOA contract: 10000 units @200, hedged 6000 @210. SUGAR contract: 5000 units @80, unhedged."
          setup_api_calls:
            - &k_clock_0105
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: PlatformAdmin
            - &k_prog
              call: "POST /confection/seasonal-programs"
              payload: { season_code: "HALLOWEEN", season_year: 2027, commitment_open_on: "2027-01-10T00:00:00Z", commitment_close_on: "2027-02-15T00:00:00Z", production_deadline_on: "2027-06-30T00:00:00Z", ship_window_open_on: "2027-07-15T00:00:00Z", ship_window_close_on: "2027-09-15T00:00:00Z", on_shelf_on: "2027-09-20T00:00:00Z", pull_on: "2027-11-15T00:00:00Z", destroy_by_on: "2027-12-31T00:00:00Z", retail_price_cents: 499, forecast_units: 100000 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /confection/commodity-contracts"
              payload: { program_id: "${prog_id}", commodity: "COCOA", quantity_units: 10000, contract_price_cents_per_unit: 200, hedged_quantity_units: 6000, hedge_price_cents_per_unit: 210 }
              as: PlatformAdmin
              captures: { cc_cocoa: $.data.id }
            - call: "POST /confection/commodity-contracts"
              payload: { program_id: "${prog_id}", commodity: "SUGAR", quantity_units: 5000, contract_price_cents_per_unit: 80 }
              as: PlatformAdmin
              captures: { cc_sugar: $.data.id }
          trigger:
            - call: "POST /confection/commodity-contracts/${cc_cocoa}/settle"
              payload: { spot_price_cents_per_unit: 250 }
              as: PlatformAdmin
            - call: "POST /confection/commodity-contracts/${cc_sugar}/settle"
              payload: { spot_price_cents_per_unit: 95 }
              as: PlatformAdmin
          assert:
            - "before settle, CommodityContract.${cc_cocoa}.provisional_spend_cents == 2000000 (10000*200 - 6000*max(0, 200-210)=0 payoff)"
            - "CommodityContract.${cc_cocoa}.effective_spend_cents == 2260000 (10000*250 - 6000*40 = 2500000 - 240000)"
            - "CommodityContract.${cc_cocoa}.effective_spend_cents != CommodityContract.${cc_cocoa}.provisional_spend_cents — same inputs, two variants, delta 260000"
            - "the hedge saved exactly 240000 = 6000 * (250 - 210); unhedged effective would be 2500000"
            - "CommodityContract.${cc_sugar}.provisional_spend_cents == 400000 and effective_spend_cents == 475000 (5000*95; no hedge offset)"
            - "both contracts' status == SETTLED after their settle calls"

      - name: cannibalization_raw_vs_seasonally_adjusted
        grounds:
          - calculations.cannibalization_index
          - entities.SellThroughReport.fields.cannibalization_raw
          - entities.SellThroughReport.fields.cannibalization_adjusted
          - endpoints.POST_/confection/sell-through-reports
        distinguishing_aspect: "Same report row yields two variants on the retail sell-through domain: RAW divides by the retailer baseline only; SEASONALLY_ADJUSTED additionally divides by SEASONAL_LIFT[HALLOWEEN]=1.25, so 880 sold -> raw 0.8800 vs adjusted 0.7040."
        test_recipe:
          setup:
            - "HALLOWEEN 2027 program advanced to ON_SHELF; GOLD retailer baseline 1000/week; one SEASONAL product with a 10-unit run completed."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - &k_prog_open
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "OPEN_FOR_COMMITMENTS", expected_program_version: "${prog_v1}" }
              as: PlatformAdmin
            - &k_retailer_gold
              call: "POST /confection/retailer-accounts"
              payload: { name: "GoldGro", region: "NE", tier: "GOLD", max_seasonal_units: 100000, everyday_baseline_weekly_units: 1000 }
              as: PlatformAdmin
              captures: { r_gold: $.data.id }
            - &k_wh
              call: "POST /confection/warehouses"
              payload: { name: "W1", temp_controlled: true, capacity_units: 1000 }
              as: PlatformAdmin
              captures: { wh_id: $.data.id }
            - &k_prod_seas
              call: "POST /confection/products"
              payload: { program_id: "${prog_id}", sku_code: "HAL-PUMP-0499", kind: "SEASONAL", molded_shape: "pumpkin", brand_protected: true, requires_temp_control: true, units_per_case: 24 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - &k_clock_0215
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-15T00:00:00Z" }
              as: PlatformAdmin
            - &k_g2
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv2: $.data.version }
            - &k_adv_lock
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "LOCKED", expected_program_version: "${pv2}" }
              as: PlatformAdmin
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - &k_clock_0306
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 10, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - &k_g4
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv4: $.data.version }
            - &k_adv_inprod
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "IN_PRODUCTION", expected_program_version: "${pv4}" }
              as: PlatformAdmin
            - &k_clock_0715
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T00:00:00Z" }
              as: PlatformAdmin
            - &k_g5
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv5: $.data.version }
            - &k_adv_ship
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "SHIPPING", expected_program_version: "${pv5}" }
              as: PlatformAdmin
            - &k_clock_0920
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-20T00:00:00Z" }
              as: PlatformAdmin
            - &k_g6
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv6: $.data.version }
            - &k_adv_onshelf
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "ON_SHELF", expected_program_version: "${pv6}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /confection/sell-through-reports"
              payload: { retailer_id: "${r_gold}", program_id: "${prog_id}", week_of_on: "2027-10-04T00:00:00Z", seasonal_units_sold: 120, seasonal_units_on_hand: 300, everyday_units_sold: 880 }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { rep_id: $.data.id }
          assert:
            - "the response status is 201"
            - "SellThroughReport.${rep_id}.cannibalization_raw == 0.88 (880 / 1000, 4dp round_half_up)"
            - "SellThroughReport.${rep_id}.cannibalization_adjusted == 0.704 (880 / (1000 * 1.25) = 0.7040)"
            - "cannibalization_adjusted != cannibalization_raw for identical report data — HALLOWEEN lift 1.25 drives the divergence"
            - "program remains ON_SHELF; reports do not mutate program state"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_waterfall_tier_then_created_at_partial_fill
        grounds:
          - calculations.commitment_supply_allocation
          - state_machines.SeasonalProgram.IN_PRODUCTION_to_SHIPPING
          - entities.RetailerAccount.fields.credit_balance_cents
        distinguishing_aspect: "Mode (a): pool x tier-rank x created_at x min-grant with conditional SHORTED credit — GOLD 60 fills fully, SILVER 60 partial-fills to 40 with 998-cent credit, BRONZE 10 zero-fills with 499-cent credit off a 100-unit pool."
        test_recipe:
          setup:
            - "Program OPEN->LOCKED->IN_PRODUCTION with one 100-unit COMPLETE run; GOLD committed 60, SILVER 60, BRONZE 10 (all CONFIRMED before lock, creation order GOLD, SILVER, BRONZE)."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_retailer_gold
            - &k_retailer_silver
              call: "POST /confection/retailer-accounts"
              payload: { name: "SilverMart", region: "MW", tier: "SILVER", max_seasonal_units: 100000, everyday_baseline_weekly_units: 800 }
              as: PlatformAdmin
              captures: { r_silver: $.data.id }
            - &k_retailer_bronze
              call: "POST /confection/retailer-accounts"
              payload: { name: "BronzeBasket", region: "SE", tier: "BRONZE", max_seasonal_units: 100000, everyday_baseline_weekly_units: 500 }
              as: PlatformAdmin
              captures: { r_bronze: $.data.id }
            - *k_wh
            - *k_prod_seas
            - &k_clock_0120
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 60, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - &k_submit_gold
              call: "POST /confection/retailer-commitments/${c_gold}/submit"
              payload: {}
              as: Retailer
              as_user_id: "${r_gold}"
            - &k_confirm_gold
              call: "POST /confection/retailer-commitments/${c_gold}/confirm"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-alice"
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_silver}", product_id: "${prod_id}", committed_units: 60, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_silver}"
              captures: { c_silver: $.data.id }
            - call: "POST /confection/retailer-commitments/${c_silver}/submit"
              payload: {}
              as: Retailer
              as_user_id: "${r_silver}"
            - call: "POST /confection/retailer-commitments/${c_silver}/confirm"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-alice"
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_bronze}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_bronze}"
              captures: { c_bronze: $.data.id }
            - call: "POST /confection/retailer-commitments/${c_bronze}/submit"
              payload: {}
              as: Retailer
              as_user_id: "${r_bronze}"
            - call: "POST /confection/retailer-commitments/${c_bronze}/confirm"
              payload: {}
              as: CategoryManager
              as_user_id: "cm-alice"
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 100, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-05T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *k_clock_0215
            - *k_g2
            - *k_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *k_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 100, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *k_g4
            - *k_adv_inprod
            - *k_clock_0715
            - *k_g5
          trigger:
            - call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "SHIPPING", expected_program_version: "${pv5}" }
              as: PlatformAdmin
          assert:
            - "GET /confection/retailer-commitments/${c_gold}: status == ALLOCATED and allocated_units == 60 (GOLD ranks first)"
            - "GET /confection/retailer-commitments/${c_silver}: status == SHORTED and allocated_units == 40 (pool 100 - 60 = 40 remaining)"
            - "GET /confection/retailer-commitments/${c_bronze}: status == SHORTED and allocated_units == 0 (zero-grant SHORTED is legal)"
            - "RetailerAccount.${r_silver}.credit_balance_cents == 998 (20 shortfall x 499 x 0.10 = 998.0)"
            - "RetailerAccount.${r_bronze}.credit_balance_cents == 499 (10 x 499 x 0.10 = 499.0)"
            - "RetailerAccount.${r_gold}.credit_balance_cents == 0"
            - "GET supply-summary: produced_units_total == 100, committed_units_total == 130, allocated_units_total == 100, remaining_supply_pool_units == 0"

      - name: markdown_recovery_rounds_per_unit_before_summation
        grounds:
          - calculations.markdown_recovery_value
          - state_machines.DispositionOrder.APPROVED_to_EXECUTED
          - entities.DispositionOrder.fields.recovered_value_cents
        distinguishing_aspect: "Mode (b): nested rounding with pinned order — round_half_up per UNIT first (499 x 0.85 = 424.15 -> 424) then multiply by 10 units = 4240; the forbidden sum-then-round order would give 4242."
        test_recipe:
          setup:
            - "Program advanced to DISPOSITION at pull_on with 10 quarantined units of the brand_protected seasonal product at W1; GOLD commitment of 10 fully ALLOCATED; no shipments."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_retailer_gold
            - *k_wh
            - *k_prod_seas
            - *k_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - *k_submit_gold
            - *k_confirm_gold
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *k_clock_0215
            - *k_g2
            - *k_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *k_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 10, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *k_g4
            - *k_adv_inprod
            - *k_clock_0715
            - *k_g5
            - *k_adv_ship
            - *k_clock_0920
            - *k_g6
            - *k_adv_onshelf
            - &k_clock_1115
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-15T00:00:00Z" }
              as: PlatformAdmin
            - &k_g7
              call: "GET /confection/seasonal-programs/${prog_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pv7: $.data.version }
            - &k_adv_disposition
              call: "POST /confection/seasonal-programs/${prog_id}/advance"
              payload: { to_state: "DISPOSITION", expected_program_version: "${pv7}" }
              as: PlatformAdmin
            - call: "POST /confection/disposition-orders"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", units: 10, channel: "MARKDOWN", markdown_pct: 0.15 }
              as: CategoryManager
              as_user_id: "cm-alice"
              captures: { disp_id: $.data.id }
            - call: "POST /confection/disposition-orders/${disp_id}/approve"
              payload: { decision: "APPROVE" }
              as: CategoryManager
              as_user_id: "cm-bob"
          trigger:
            - call: "POST /confection/disposition-orders/${disp_id}/execute"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "DispositionOrder.${disp_id}.status == EXECUTED"
            - "DispositionOrder.${disp_id}.recovered_value_cents == 4240 (round per unit: 424 x 10)"
            - "recovered_value_cents != 4242 (the forbidden multiply-then-round order)"
            - "GET /confection/inventory-lots?production_run_id=${run_id}: the lot is DISPOSITIONED with units_on_hand == 0"
            - "SeasonalProgram.${prog_id}.disposed_units_total == 10"
            - "Warehouse.${wh_id}.in_use_units == 0 and posture == OPEN"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: heat_claim_more_info_review_cycle
        grounds:
          - state_machines.HeatClaim.UNDER_REVIEW_to_MORE_INFO
          - state_machines.HeatClaim.MORE_INFO_to_UNDER_REVIEW
          - state_machines.HeatClaim.UNDER_REVIEW_to_APPROVED
          - calculations.heat_claim_settlement
        distinguishing_aspect: "HeatClaim cycles UNDER_REVIEW -> MORE_INFO -> UNDER_REVIEW twice before APPROVED — a non-linear review loop on the claims entity, with the settlement computed once at the terminal hop."
        test_recipe:
          setup:
            - "Program in SHIPPING; GOLD commitment 10 ALLOCATED; a 10-unit temp_controlled shipment DELIVERED on 2027-07-20; claim for 4 units filed and auto-advanced to UNDER_REVIEW."
          setup_api_calls:
            - *k_clock_0105
            - *k_prog
            - *k_prog_open
            - *k_retailer_gold
            - *k_wh
            - *k_prod_seas
            - *k_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - *k_submit_gold
            - *k_confirm_gold
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 10, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *k_clock_0215
            - *k_g2
            - *k_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *k_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 10, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *k_g4
            - *k_adv_inprod
            - *k_clock_0715
            - *k_g5
            - *k_adv_ship
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 10, ship_on: "2027-08-01T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { sh_id: $.data.id }
            - &k_clock_0720
              call: "POST /confection/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /confection/shipments/${sh_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /confection/heat-claims"
              payload: { shipment_id: "${sh_id}", claimed_units: 4, reason: "MELT", evidence_note: "photos of fused units attached" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /confection/heat-claims/${cl_id}/decide"
              payload: { decision: "REQUEST_MORE_INFO" }
              as: ClaimsAdjuster
            - call: "POST /confection/heat-claims/${cl_id}/provide-info"
              payload: { evidence_note: "added carrier temperature log" }
              as: Retailer
              as_user_id: "${r_gold}"
            - call: "POST /confection/heat-claims/${cl_id}/decide"
              payload: { decision: "REQUEST_MORE_INFO" }
              as: ClaimsAdjuster
            - call: "POST /confection/heat-claims/${cl_id}/provide-info"
              payload: { evidence_note: "second packet: warehouse receipt photos" }
              as: Retailer
              as_user_id: "${r_gold}"
            - call: "POST /confection/heat-claims/${cl_id}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "after the first REQUEST_MORE_INFO, HeatClaim.${cl_id}.status == MORE_INFO"
            - "after the first provide-info, status == UNDER_REVIEW again (cycle closes)"
            - "the second MORE_INFO -> UNDER_REVIEW loop also succeeds (cycle is repeatable, not one-shot)"
            - "after APPROVE: status == APPROVED and credit_cents == 1996 (4 x 499 x 1.00, temp_controlled branch)"
            - "HeatClaim.${cl_id}.auto_approve == false"
            - "RetailerAccount.${r_gold}.credit_balance_cents == 1996"
