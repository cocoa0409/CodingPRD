- rule_id: non_linear_state_machine
  instances:
  - name: supplier_contract_propose_counter_negotiation_cycle_terminates_at_five_rounds
    grounds:
    - §1.2 SupplierContract.status DRAFT -> PROPOSED, PROPOSED -> COUNTERED, COUNTERED -> PROPOSED (cycle)
    - §1.0 complexity_profile.state_machine_shape == cyclic
    - §1.4 priority 19 ERR_NEGOTIATION_ROUNDS_EXHAUSTED (MAX_NEGOTIATION_ROUNDS 5)
    - §1.5 POST /supplier-contracts/{contract_id}/negotiate
    - §1.1 SupplierContract.round_count, last_proposed_by_user_id, last_countered_by_user_id
    distinguishing_aspect: |-
      A SupplierContract must be able to re-enter PROPOSED from COUNTERED an unbounded number of times as far as the edge set is concerned, yet the cycle terminates on the loop counter: rounds 3, 4 and 5 succeed and leave round_count 5 with status PROPOSED, while the sixth negotiate call is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED and leaves round_count at 5.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
