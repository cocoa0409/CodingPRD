scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: customer_create_returns_system_fields_and_defaults
        claim_type: Creation
        grounds: [entities.Customer, endpoints.POST_/dna/customers]
        distinguishing_aspect: "A newly created Customer has a server-minted UUID id, version == 1, account_status == ACTIVE, dna_status == NO_SAMPLE, wallet_credit_cents == 0, visible_match_count == 0 and all three consent flags false."
        test_recipe:
          setup: ["Empty DB; logical clock at its startup default 2026-05-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /dna/customers"
              payload: { email: "new@dna.test", display_name: "New" }
              as: PlatformAdmin
              captures: { c: $.data.id, v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "${v} == 1"
            - "Customer.${c}.account_status == ACTIVE"
            - "Customer.${c}.dna_status == NO_SAMPLE"
            - "Customer.${c}.wallet_credit_cents == 0"
            - "Customer.${c}.visible_match_count == 0"
            - "Customer.${c}.matching_opt_in == false and Customer.${c}.research_opt_in == false and Customer.${c}.health_opt_in == false"
            - "response envelope has meta.api_request_id, meta.api_request_timestamp, response_type == 'object', data"

      - name: get_customer_with_unknown_id_returns_customer_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CUSTOMER_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A well-formed but non-existent UUID on GET /dna/customers/{id} returns ERR_CUSTOMER_NOT_FOUND with HTTP 404 and the error envelope shape."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dna/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CUSTOMER_NOT_FOUND"
            - "response_type == 'error'"

      - name: lab_instrument_status_defaults_to_online_when_omitted
        claim_type: Defaults
        grounds: [entities.LabInstrument.fields.status, endpoints.POST_/dna/lab-instruments]
        distinguishing_aspect: "status is an optional input with default ONLINE; omitting it yields status == ONLINE, and the instrument is immediately usable for batch creation."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-DEF", chip_version: "V4" }
              as: PlatformAdmin
              captures: { i: $.data.id, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "${st} == ONLINE"
            - "LabInstrument.${i}.chip_version == V4"

      - name: kit_barcode_and_price_are_system_minted
        claim_type: System Fields
        grounds: [entities.Kit.fields.barcode, entities.Kit.fields.price_cents]
        distinguishing_aspect: "POST /dna/kits accepts only customer_id and chip_version; the server mints a unique barcode and pins price_cents to 9900, and two kits for the same customer receive different barcodes."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /dna/customers"
              payload: { email: "kb@dna.test", display_name: "KB" }
              as: PlatformAdmin
              captures: { c: $.data.id }
          trigger:
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k1: $.data.id, b1: $.data.barcode, p1: $.data.price_cents }
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V4" }
              as: Customer
              as_user_id: "${c}"
              captures: { k2: $.data.id, b2: $.data.barcode }
          assert:
            - "${p1} == 9900"
            - "${b1} != ${b2}"
            - "Kit.${k1}.status == ORDERED and Kit.${k2}.status == ORDERED"
            - "Kit.${k1}.activated_at == null"

      - name: kit_create_with_invalid_chip_version_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Kit.fields.chip_version, "errors[ERR_INVALID_REQUEST]", "validations[priority=6]"]
        distinguishing_aspect: "chip_version is constrained to {V4, V5}; the value 'V6' is rejected with ERR_INVALID_REQUEST (400) and no Kit row is created."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /dna/customers"
              payload: { email: "enum@dna.test", display_name: "Enum" }
              as: PlatformAdmin
              captures: { c: $.data.id }
          trigger:
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V6" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /dna/kits?customer_id=${c} returns 0 kits"

      - name: tree_person_create_under_unknown_tree_returns_tree_not_found
        claim_type: Parent Relationships
        grounds: [entities.TreePerson.fields.tree_id, "errors[ERR_TREE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "The body FK tree_id is validated for existence (priority 4) before any business rule; an unknown tree_id yields ERR_TREE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Customer C exists with a FREE subscription; no family tree."]
          setup_api_calls:
            - call: "POST /dna/customers"
              payload: { email: "tp@dna.test", display_name: "TP" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "FREE" }
              as: Customer
              as_user_id: "${c}"
          trigger:
            - call: "POST /dna/tree-people"
              payload: { tree_id: "00000000-0000-4000-8000-0000000000aa", given_name: "Ghost", surname: "Nobody" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_TREE_NOT_FOUND"

  # =========================================================================
  - section: state_machines
    instances:
      - name: kit_activate_twice_returns_barcode_already_activated
        claim_type: Idempotency
        grounds: [state_machines.Kit.ORDERED_to_ACTIVATED, "errors[ERR_BARCODE_ALREADY_ACTIVATED]", "validations[priority=10]"]
        distinguishing_aspect: "The second activate on an already-ACTIVATED kit fails with ERR_BARCODE_ALREADY_ACTIVATED (409); activated_at is not overwritten and no second Sample is created."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer with a PLUS subscription and an ACTIVATED V5 kit."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "dbl@dna.test", display_name: "Dbl" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k: $.data.id, bc: $.data.barcode }
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
          trigger:
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_BARCODE_ALREADY_ACTIVATED"
            - "Kit.${k}.status == ACTIVATED"
            - "Kit.${k}.activated_at == 2026-05-01T00:00:00.000Z"

      - name: sample_requeue_from_extracted_is_invalid_transition
        claim_type: Invalid Transitions
        grounds: [state_machines.Sample.QC_FAILED_to_RECEIVED, "errors[ERR_INVALID_STATE]", "validations[priority=9]"]
        distinguishing_aspect: "Requeue is declared only from QC_FAILED; calling it on an EXTRACTED sample returns ERR_INVALID_STATE (409) and leaves status EXTRACTED with extraction_attempts unchanged at 1."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. A Sample in EXTRACTED (one successful extraction, extraction_attempts = 1)."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "rq@dna.test", display_name: "Rq" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k: $.data.id, bc: $.data.barcode }
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits/${k}/receive"
              payload: {}
              as: LabTechnician
              captures: { s: $.data.id }
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
          trigger:
            - call: "POST /dna/samples/${s}/requeue"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "Sample.${s}.status == EXTRACTED"
            - "Sample.${s}.extraction_attempts == 1"

      - name: third_failed_extraction_terminates_sample_and_voids_kit_with_refund
        claim_type: Compensation
        grounds:
          - state_machines.Sample.RECEIVED_to_FAILED_TERMINAL
          - state_machines.Kit.RECEIVED_to_VOID
          - entities.Customer.fields.wallet_credit_cents
          - entities.Customer.fields.dna_status
        distinguishing_aspect: "Three failing extractions (yield < 200.0) drive the sample to FAILED_TERMINAL, which cascades Kit -> VOID, which in turn refunds the kit's 9900 cents to wallet_credit_cents and resets dna_status to NO_SAMPLE."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer with PLUS subscription, wallet_credit_cents = 0, kit RECEIVED, Sample RECEIVED with extraction_attempts = 0."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "fail@dna.test", display_name: "Fail" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k: $.data.id, bc: $.data.barcode }
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits/${k}/receive"
              payload: {}
              as: LabTechnician
              captures: { s: $.data.id }
          trigger:
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 10.0 }
              as: LabTechnician
            - call: "POST /dna/samples/${s}/requeue"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 20.0 }
              as: LabTechnician
            - call: "POST /dna/samples/${s}/requeue"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 30.0 }
              as: LabTechnician
              captures: { st: $.data.status, at: $.data.extraction_attempts }
          assert:
            - "${st} == FAILED_TERMINAL and ${at} == 3"
            - "Kit.${k}.status == VOID"
            - "Customer.${c}.wallet_credit_cents == 9900"
            - "Customer.${c}.dna_status == NO_SAMPLE"

      - name: requeue_after_exhausted_attempts_returns_extraction_attempts_exhausted
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=12]", "errors[ERR_EXTRACTION_ATTEMPTS_EXHAUSTED]"]
        distinguishing_aspect: "A sample knocked back to QC_FAILED by a failing genotype call at the third attempt cannot be requeued: ERR_EXTRACTION_ATTEMPTS_EXHAUSTED (409). This is reachable because the batch-finalize QC_FAILED path (unlike the extract path) increments attempts to 3 while leaving the sample in QC_FAILED only when attempts < 3 — so we reach attempts == 2 via extraction failures and then finalize-fail into FAILED_TERMINAL instead; the requeue test therefore uses the QC_FAILED sample at attempts == 3 produced by two extraction failures plus one finalize failure."
        excluded_because:
          difficulty_instance: sample_qc_failure_requeue_cycle_returns_to_received
          rationale: "The requeue edge and its attempt-count guard are exercised by the §1.8 cycle instance; the exhausted branch is the same guard evaluated at its boundary and is asserted there via extraction_attempts == 2 plus the FAILED_TERMINAL corner above."

      - name: batch_abort_releases_members_back_to_extracted
        claim_type: Side Effect Execution
        grounds: [state_machines.LabBatch.RUNNING_to_ABORTED, entities.Sample.fields.batch_id]
        distinguishing_aspect: "Aborting a RUNNING batch returns every GENOTYPING member to EXTRACTED, clears Sample.batch_id, and resets LabBatch.member_count to 0 while pass_rate stays null."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. One RUNNING batch on an ONLINE V5 instrument with one GENOTYPING member sample."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "ab@dna.test", display_name: "Ab" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k: $.data.id, bc: $.data.barcode }
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits/${k}/receive"
              payload: {}
              as: LabTechnician
              captures: { s: $.data.id }
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-AB", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { i: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${i}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${s}"] }
              as: LabTechnician
              captures: { b: $.data.id }
            - call: "POST /dna/lab-batches/${b}/start"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /dna/lab-batches/${b}/abort"
              payload: {}
              as: LabTechnician
          assert:
            - "LabBatch.${b}.status == ABORTED"
            - "LabBatch.${b}.member_count == 0"
            - "LabBatch.${b}.pass_rate == null"
            - "Sample.${s}.status == EXTRACTED"
            - "Sample.${s}.batch_id == null"

      - name: withdraw_already_withdrawn_consent_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ConsentGrant.ACTIVE_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal for ConsentGrant: a second withdraw returns ERR_INVALID_STATE (409) and withdrawn_at is not overwritten."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer holds one WITHDRAWN RESEARCH grant (withdrawn at 2026-05-01T00:00:00Z)."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "ww@dna.test", display_name: "Ww" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${c}", scope: "RESEARCH", effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${c}"
              captures: { g: $.data.id }
            - call: "POST /dna/consent-grants/${g}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${c}"
          trigger:
            - call: "POST /dna/consent-grants/${g}/withdraw"
              payload: {}
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_STATE"
            - "ConsentGrant.${g}.status == WITHDRAWN"
            - "ConsentGrant.${g}.withdrawn_at == 2026-05-01T00:00:00.000Z"
            - "Customer.${c}.research_opt_in == false"

      - name: health_consent_withdrawal_revokes_published_health_report
        claim_type: Cross-entity
        grounds: [state_machines.Report.PUBLISHED_to_REVOKED, state_machines.ConsentGrant.ACTIVE_to_WITHDRAWN]
        distinguishing_aspect: "Withdrawing the HEALTH_TRAITS grant transitions the customer's PUBLISHED HEALTH_TRAIT report to REVOKED, while a PUBLISHED PROVISIONAL ETHNICITY report is untouched."
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer H is DNA_READY on a PLUS subscription with genotype_markers [1, 2, 20]."
            - "H holds an ACTIVE HEALTH_TRAITS grant and has published one HEALTH_TRAIT report and one ETHNICITY (PROVISIONAL) report."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "h@dna.test", display_name: "Hal" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${c}", tier: "PLUS" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${c}", chip_version: "V5" }
              as: Customer
              as_user_id: "${c}"
              captures: { k: $.data.id, bc: $.data.barcode }
            - call: "POST /dna/kits/${k}/activate"
              payload: { barcode: "${bc}" }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /dna/kits/${k}/receive"
              payload: {}
              as: LabTechnician
              captures: { s: $.data.id }
            - call: "POST /dna/samples/${s}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-H", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { i: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${i}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${s}"] }
              as: LabTechnician
              captures: { b: $.data.id }
            - call: "POST /dna/lab-batches/${b}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${b}/finalize"
              payload: { sample_results: [ { sample_id: "${s}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2, 20] } ] }
              as: LabTechnician
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${c}", scope: "HEALTH_TRAITS", effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${c}"
              captures: { g: $.data.id }
            - call: "GET /dna/customers/${c}"
              payload: {}
              as: Customer
              as_user_id: "${c}"
              captures: { v1: $.data.version }
            - call: "POST /dna/customers/${c}/reports"
              payload: { report_type: "HEALTH_TRAIT", variant: "PROVISIONAL", expected_customer_version: "${v1}" }
              as: Customer
              as_user_id: "${c}"
              captures: { rH: $.data.id, tc: $.data.trait_count }
            - call: "GET /dna/customers/${c}"
              payload: {}
              as: Customer
              as_user_id: "${c}"
              captures: { v2: $.data.version }
            - call: "POST /dna/customers/${c}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${v2}" }
              as: Customer
              as_user_id: "${c}"
              captures: { rE: $.data.id }
          trigger:
            - call: "POST /dna/consent-grants/${g}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${c}"
          assert:
            - "${tc} == 2 (markers 1 and 2 are <= 12; marker 20 is not)"
            - "Report.${rH}.status == REVOKED"
            - "Report.${rE}.status == PUBLISHED"
            - "Customer.${c}.health_opt_in == false"

      - name: data_request_export_approval_completes_with_export_url
        claim_type: Valid Transition
        grounds: [state_machines.DataRequest.PENDING_to_COMPLETED, entities.DataRequest.fields.export_url]
        distinguishing_aspect: "The EXPORT branch of the decide fork completes immediately: status COMPLETED, export_url minted, scheduled_purge_at stays null and reviewed_by carries the PrivacyOfficer's opaque X-User-ID."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer E has one PENDING EXPORT DataRequest."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "e@dna.test", display_name: "Eve" }
              as: PlatformAdmin
              captures: { c: $.data.id }
            - call: "POST /dna/data-requests"
              payload: { customer_id: "${c}", request_type: "EXPORT" }
              as: Customer
              as_user_id: "${c}"
              captures: { dr: $.data.id }
          trigger:
            - call: "POST /dna/data-requests/${dr}/decide"
              payload: { decision: "APPROVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "DataRequest.${dr}.status == COMPLETED"
            - "DataRequest.${dr}.export_url is a non-null string"
