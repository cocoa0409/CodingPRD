  # ----------------------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: recruitment_closed_outranks_quota_cell_filled
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - calculations.market_recruitment_posture
          - calculations.quota_cell_fill
          - errors[ERR_RECRUITMENT_CLOSED]
          - errors[ERR_QUOTA_CELL_FILLED]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 10) versus business_constraint (priority 12):
          a market whose only cell is FILLED is simultaneously CLOSED for intake and pointing at a
          FILLED cell, and the response must be ERR_RECRUITMENT_CLOSED with HTTP 409, never
          ERR_QUOTA_CELL_FILLED.
        test_recipe:
          setup:
            - "Market DMA-509 with exactly one quota cell (target 1, base incentive 2000)."
            - "One household ACTIVE in that cell, so the cell is FILLED and the market's recruitment_posture is CLOSED (filled_cell_count 1 == quota_cell_count 1)."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Iota", market_code: "DMA-509", dma_rank: 9, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m9_id: "$.data.id" }
            - call: "POST /markets/${m9_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_j_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m9_id}", quota_cell_id: "${cell_j_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hi1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hi1_id}", meter_type: "TV_TUNER", serial_no: "MT-000801" }
              as: FieldTechnician
              captures: { mti1_id: "$.data.id" }
            - call: "POST /meters/${mti1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hi1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
          trigger:
            - call: "POST /households"
              payload: { market_id: "${m9_id}", quota_cell_id: "${cell_j_id}", recruitment_source: "RDD_PHONE", persons_count: 1 }
              as: PanelOperationsManager
          assert:
            - "HTTP 409 with data.error_id == ERR_RECRUITMENT_CLOSED"
            - "data.error_id != ERR_QUOTA_CELL_FILLED even though the referenced cell is FILLED"
            - "Market.${m9_id}.recruitment_posture == CLOSED and QuotaCell.${cell_j_id}.quota_status == FILLED"
            - "QuotaCell.${cell_j_id}.intab_count == 1 - the rejected recruitment left no trace"
            - "GET /households?market_id=${m9_id} returns total_count == 1"

      - name: meter_faulted_outranks_market_frozen_on_enumeration
        grounds:
          - validations[priority=22]
          - validations[priority=23]
          - errors[ERR_METER_FAULTED]
          - errors[ERR_MARKET_FROZEN]
          - state_machines.AccreditationAudit.OPEN_to_FINALIZED
          - calculations.market_recruitment_posture
        distinguishing_aspect: |
          A different error-category pair from the recruitment conflict - state (priority 22) versus
          business_safety (priority 23): a NONCOMPLIANT_HOLD household whose only installed tuner is
          FAULTED, sitting in a market frozen by an open accreditation audit, must be refused with
          ERR_METER_FAULTED and HTTP 409 rather than with ERR_MARKET_FROZEN.
        test_recipe:
          setup:
            - "Market DMA-510 with one quota cell (target 1, base incentive 2000) and a published edit rule set to scope the audit against."
            - "Household h1 with an INSTALLED TV_TUNER, enumerated once with a roster head-count of 3 against persons_count 2, so the verdict was NONCOMPLIANT and the household sits in NONCOMPLIANT_HOLD - which validation priority 20 still treats as enumerable."
            - "That tuner then reported FAULTED; because the household was not ACTIVE no FAULT_HOLD cascade fired, so the household is still NONCOMPLIANT_HOLD with a FAULTED tuner."
            - "An accreditation audit opened on the market, so open_audit_count is 1 and recruitment_posture is FROZEN."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Kappa", market_code: "DMA-510", dma_rank: 10, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m10_id: "$.data.id" }
            - call: "POST /markets/${m10_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_k_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs10_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs10_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
              payload: { market_id: "${m10_id}", quota_cell_id: "${cell_k_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hj1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hj1_id}", meter_type: "TV_TUNER", serial_no: "MT-000901" }
              as: FieldTechnician
              captures: { mtj1_id: "$.data.id" }
            - call: "POST /meters/${mtj1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hj1_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 1 }
              as: FieldTechnician
              captures: { hj1_status_after_first_enum: "$.data.status", hj1_verdict: "$.data.enumeration_verdict" }
            - call: "POST /meters/${mtj1_id}/fault-reports"
              payload: { fault_code: "TUNER_DEAD" }
              as: FieldTechnician
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m10_id}", scope_edit_rule_set_id: "${rs10_id}", auditor_note: "Annual methodology review of DMA-510" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-10"
              captures: { audit10_id: "$.data.id" }
          trigger:
            - call: "POST /households/${hj1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
          assert:
            - "${hj1_status_after_first_enum} == NONCOMPLIANT_HOLD and ${hj1_verdict} == NONCOMPLIANT"
            - "Market.${m10_id}.open_audit_count == 1 and .recruitment_posture == FROZEN"
            - "HTTP 409 with data.error_id == ERR_METER_FAULTED"
            - "data.error_id != ERR_MARKET_FROZEN even though the market is FROZEN"
            - "Household.${hj1_id}.status == NONCOMPLIANT_HOLD and .enumeration_count == 1 - the refused visit was not recorded"
            - "QuotaCell.${cell_k_id}.intab_count == 0"

      - name: run_not_published_outranks_custom_analysis_quota
        grounds:
          - validations[priority=47]
          - validations[priority=49]
          - errors[ERR_RUN_NOT_PUBLISHED]
          - errors[ERR_CUSTOM_ANALYSIS_QUOTA_EXCEEDED]
          - entities.Client.fields.custom_analysis_quota
          - entities.Client.fields.custom_analysis_used
        distinguishing_aspect: |
          A third, distinct error-category pair - state (priority 47) versus business_fiscal
          (priority 49): a BASIC client with custom_analysis_quota 0 filing an analysis against a run
          still in OPEN violates both rules, and the response must be ERR_RUN_NOT_PUBLISHED with HTTP
          409, not the fiscal quota error.
        test_recipe:
          setup:
            - "Market DMA-511 with one quota cell, a published 2026Q3 universe of 120000 households and a published edit rule set."
            - "A run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) left in OPEN - never edited, weighted or published."
            - "A BASIC-tier client contracted to that market, so tier_base_fee_cents is 25000, delivery_sla_hours is 168 and custom_analysis_quota is 0."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Lambda", market_code: "DMA-511", dma_rank: 11, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m11_id: "$.data.id" }
            - call: "POST /markets/${m11_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_l_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs11_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs11_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m11_id}"
              payload: {}
              as: MethodologyStatistician
