              as: AccreditationReviewer
            - call: "POST /society/classroom-audits"
              payload: { classroom_id: "${h1_id}", students_present: 30, adults_present: 2, observed_uninterrupted_minutes: 180, materials_groups: [ { domain: "PRACTICAL_LIFE", required_count: 10, present_count: 9 }, { domain: "SENSORIAL", required_count: 10, present_count: 9 } ] }
              as: Consultant
              as_user_id: "con-ada"
            - call: "GET /society/schools/${h_id}"
              payload: {}
              as: SocietyAdmin
              captures: { h_v2: $.data.version }
