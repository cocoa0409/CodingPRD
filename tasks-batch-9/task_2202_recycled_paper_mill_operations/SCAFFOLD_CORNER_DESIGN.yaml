# =============================================================================
# task_2202 — Recycled Paper Mill Operations
# §1.9 Scaffold Corner Design — breadth coverage index over SCAFFOLD.yaml §1.1–§1.7
#
# Taxonomy: references/claim-extraction-guide.md (9 sections = `section:` values,
# per-section rows = `claim_type:` values). No `excluded_because:` stubs are used;
# every instance below carries a full, reachable `test_recipe`.
#
# Conventions used by every recipe in this file:
#   * The logical clock reads 2026-08-01T00:00:00Z until POST /_clock/set_current_utc
#     is called, so date literals are safe to write out.
#   * Every OCC `expected_*_version` is a ${var} captured from an immediately
#     preceding GET of the parent, never a literal, because cascades bump versions.
#   * Opaque-role X-User-IDs are literal strings (`planner-1`, `lab-a`, ...);
#     entity_backed roles (Supplier, Customer) pass the server-minted row id.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (§1.1)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_customer_returns_201_with_full_roll_spec_envelope
        claim_type: creation
        grounds:
          - entities.Customer
          - endpoints.POST /customers
          - response_envelope.success
        distinguishing_aspect: "POST /customers with all five input fields returns 201, echoes every input field verbatim, and stamps the system-sourced status = ACTIVE plus common_fields id/created_at/updated_at/version — a create that silently drops max_roll_width_mm or omits status fails."
        test_recipe:
          setup: ["Empty database; no prior calls are required beyond the create itself."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /customers"
              payload: { name: "Gulf Coast Box Co", allocation_priority_tier: "P1", max_roll_diameter_mm: 1400, max_roll_width_mm: 2400, wrap_spec: "KRAFT_ONLY" }
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "HTTP status is 201"
            - "response.meta.api_request_id is a non-empty string and response.meta.api_request_timestamp is an ISO8601 string"
            - "response.response_type == 'object'"
            - "response.data.name == 'Gulf Coast Box Co'"
            - "response.data.allocation_priority_tier == 'P1'"
            - "response.data.max_roll_diameter_mm == 1400"
            - "response.data.max_roll_width_mm == 2400"
            - "response.data.wrap_spec == 'KRAFT_ONLY'"
            - "response.data.status == 'ACTIVE'"
            - "response.data.version == 1"
            - "response.data.id is a non-empty string; response.data.created_at and response.data.updated_at are ISO8601 strings"

      - name: customer_defaults_applied_when_tier_and_wrap_omitted
        claim_type: defaults
        grounds:
          - entities.Customer.fields.allocation_priority_tier
          - entities.Customer.fields.wrap_spec
          - entities.Customer.fields.status
        distinguishing_aspect: "Omitting the two fields that declare `default:` yields allocation_priority_tier = 'P3' and wrap_spec = 'KRAFT_ONLY' rather than null or ERR_VALIDATION; the two fields with no default (max_roll_diameter_mm, max_roll_width_mm) are still supplied, so this isolates default application from required-field enforcement."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /customers"
              payload: { name: "Piedmont Tissue LLC", max_roll_diameter_mm: 1100, max_roll_width_mm: 1800 }
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "HTTP status is 201"
            - "response.data.allocation_priority_tier == 'P3'"
            - "response.data.wrap_spec == 'KRAFT_ONLY'"
            - "response.data.status == 'ACTIVE'"

      - name: create_paper_grade_spec_missing_basis_weight_rejected
        claim_type: required_fields
        grounds:
          - entities.PaperGradeSpec.fields.basis_weight_gsm
          - validations.priority_26
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "basis_weight_gsm is `source: input` with no default, so omitting it is ERR_VALIDATION (422) — not a 201 with a null basis weight and not ERR_GRADE_CODE_NOT_FOUND, because no referential lookup is involved."
        test_recipe:
          setup: ["Empty database; no PaperGradeSpec rows exist yet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /paper-grade-specs"
              payload: { product_code: "TL_140", family: "CONTAINERBOARD", target_moisture_pct: 7.50, moisture_tolerance_pct: 0.50, min_sct_kn_m: 2.50, requires_deink_pulp: false, rank_order: 10 }
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "HTTP status is 422"
            - "response.response_type == 'error'"
            - "response.data.error_id == 'ERR_VALIDATION'"
            - "GET /paper-grade-specs as MillPlanner returns total_count == 0"

      - name: fiber_grade_rejects_undeclared_index_symbol_enum_member
        claim_type: type_constraints
        grounds:
          - entities.FiberGrade.fields.index_symbol
          - validations.priority_26
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "index_symbol is an enum closed over {PPI_OCC, PPI_DLK, PPI_SOP, PPI_ONP}; 'PPI_MIX' is well-formed and plausible but undeclared, so priority 26 rejects with ERR_VALIDATION (422) rather than storing it or coercing it to PPI_OCC."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /fiber-grades"
              payload: { grade_code: "MIX_54", index_symbol: "PPI_MIX", max_contamination_pct: 8.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 9 }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 422"
            - "response.data.error_id == 'ERR_VALIDATION'"
            - "GET /fiber-grades as FiberBuyer returns total_count == 0"

      - name: fiber_grade_rejects_grade_code_failing_business_key_regex
        claim_type: type_constraints
        grounds:
          - entities.FiberGrade.fields.grade_code
          - validations.priority_26
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "grade_code is constrained to ^[A-Z]{2,4}_[0-9]{2}$; 'occ-11' violates both the case class and the separator, so the range/format arm of priority 26 fires with ERR_VALIDATION (422) — this is a shape failure, distinct from the uniqueness failure at priority 57 which returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /fiber-grades"
              payload: { grade_code: "occ-11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 422"
            - "response.data.error_id == 'ERR_VALIDATION'"

      - name: get_paper_machine_returns_stored_row_with_occ_version
        claim_type: retrieval
        grounds:
          - endpoints.GET /paper-machines/{id}
          - entities.PaperMachine
        distinguishing_aspect: "GET /paper-machines/{id} returns the machine exactly as stored including current_product_code = null (no run has COMPLETED yet) and version = 1, which is the value later OCC calls must quote; a handler that omits version makes §1.2.1 untestable."
        test_recipe:
          setup: ["One PaperMachine PM1 created with wire_width_mm 5600, max_tons_per_hour 20.00, changeover_buffer_minutes 30, steam_tph_per_ton 2.500."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 5600, max_tons_per_hour: 20.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 2.500 }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_id: "$.data.id" }
          trigger:
            - call: "GET /paper-machines/${machine_id}"
              payload: {}
              as: MachineOperator
              as_user_id: "op-1"
          assert:
            - "HTTP status is 200"
            - "response.data.id == ${machine_id}"
            - "response.data.name == 'PM1'"
            - "response.data.wire_width_mm == 5600"
            - "response.data.changeover_buffer_minutes == 30"
            - "response.data.steam_tph_per_ton == 2.500"
            - "response.data.status == 'RUNNABLE'"
            - "response.data.current_product_code is null"
            - "response.data.version == 1"

      - name: list_fiber_grades_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /fiber-grades
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three FiberGrade rows and limit=2&offset=0 the envelope reports total_count == 3 and has_more == true while data carries exactly 2 rows; the second page (offset=2) reports has_more == false. total_count must count the whole filtered set, not the page."
        test_recipe:
          setup: ["Three FiberGrade rows: MIX_54, OCC_11 (downgrade target MIX_54), DLK_37."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "MIX_54", index_symbol: "PPI_SOP", max_contamination_pct: 8.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 9 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 1.50, max_moisture_pct: 10.00, nominal_yield_pct: 72.00, deink_required: true, rank_order: 2 }
              as: FiberBuyer
              as_user_id: "buyer-1"
          trigger:
            - call: "GET /fiber-grades?limit=2&offset=0"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "HTTP status is 200"
            - "response.response_type == 'array'"
            - "response.data has exactly 2 elements"
            - "response.total_count == 3"
            - "response.limit == 2"
            - "response.offset == 0"
            - "response.has_more == true"
            - "a follow-up GET /fiber-grades?limit=2&offset=2 as MillPlanner returns 1 element with total_count == 3 and has_more == false"

      - name: list_fiber_grades_rejects_limit_above_max
        claim_type: listing
        grounds:
          - validations.priority_25
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit=101 is one above the declared max of 100, so priority 25 returns ERR_INVALID_PAGINATION (400) rather than silently clamping to 100; limit=100 on the same data succeeds."
        test_recipe:
          setup: ["One FiberGrade row exists so the list is non-empty and the failure is attributable to the pagination check."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
          trigger:
            - call: "GET /fiber-grades?limit=101&offset=0"
              payload: {}
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 400"
            - "response.data.error_id == 'ERR_INVALID_PAGINATION'"
            - "a follow-up GET /fiber-grades?limit=100&offset=0 as FiberBuyer returns 200 with total_count == 1"

      - name: get_pulp_batch_with_unknown_id_returns_pulp_batch_not_found
        claim_type: not_found
        grounds:
          - validations.priority_11
          - errors[ERR_PULP_BATCH_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but non-existent PulpBatch id returns ERR_PULP_BATCH_NOT_FOUND (404) and not the generic ERR_VALIDATION; the collection-specific error id is what distinguishes priority 11 from priorities 10 and 12."
        test_recipe:
          setup: ["A pulper-charge chain has produced exactly one real PulpBatch, so the collection is non-empty and the 404 is attributable to the id, not to an empty table."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-grade-specs"
              payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.50, min_sct_kn_m: 2.50, requires_deink_pulp: false, rank_order: 10 }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 180.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-purchase-orders/${po_id}/confirm"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /fiber-purchase-orders/${po_id}/receipts"
              payload: { truck_reference: "TRK-0001", sublots: [ { sublot_no: 1, gross_tons: 30.000, tare_tons: 8.000, moisture_pct: 10.00, contamination_pct: 2.00 } ] }
              as: QualityLab
              as_user_id: "lab-a"
              captures: { receipt_id: "$.data.id" }
            - call: "POST /fiber-receipts/${receipt_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: QualityLab
              as_user_id: "lab-b"
            - call: "GET /fiber-inventory-lots?receipt_id=${receipt_id}"
              payload: {}
              as: MachineOperator
              as_user_id: "op-1"
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /pulp-batches"
              payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 20.000 } ] }
              as: MachineOperator
              as_user_id: "op-1"
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "GET /pulp-batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MachineOperator
              as_user_id: "op-1"
          assert:
            - "HTTP status is 404"
            - "response.response_type == 'error'"
            - "response.data.error_id == 'ERR_PULP_BATCH_NOT_FOUND'"
            - "a follow-up GET /pulp-batches/${batch_id} as MachineOperator returns 200"

      - name: receipt_creation_computes_net_tons_and_weighted_sample_fields
        claim_type: computed_fields
        grounds:
          - entities.FiberReceipt.fields.net_tons
          - entities.FiberReceipt.fields.weighted_moisture_pct
          - entities.FiberReceipt.fields.weighted_contamination_pct
          - entities.FiberReceipt.fields.moisture_deduction_tons
          - calculations.receipt_net_tons
        distinguishing_aspect: "A single sublot of 30.000 gross / 8.000 tare at 10.00% moisture sits BELOW OCC_11.max_moisture_pct of 12.00, so exc_1 = 0.00 and moisture_deduction_tons = 0.000 while net_tons = 22.00 — the computed fields must come from the formula, and the deduction must be exactly zero rather than a small positive number derived from raw moisture."
        test_recipe:
          setup: ["Supplier Delta Fiber Recovery (freight 12.50), FiberGrade OCC_11 (max_moisture_pct 12.00, max_contamination_pct 3.00), a CONFIRMED purchase order for 400.00 tons of OCC_11."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 180.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-purchase-orders/${po_id}/confirm"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
          trigger:
            - call: "POST /fiber-purchase-orders/${po_id}/receipts"
              payload: { truck_reference: "TRK-0001", sublots: [ { sublot_no: 1, gross_tons: 30.000, tare_tons: 8.000, moisture_pct: 10.00, contamination_pct: 2.00 } ] }
              as: QualityLab
              as_user_id: "lab-a"
          assert:
            - "HTTP status is 201"
            - "response.data.net_tons == 22.00"
            - "response.data.moisture_deduction_tons == 0.000"
            - "response.data.weighted_moisture_pct == 10.00"
            - "response.data.weighted_contamination_pct == 2.00"
            - "response.data.status == 'SAMPLED'"

      - name: receipt_creation_stamps_system_fields_from_parent_and_header
        claim_type: system_fields
        grounds:
          - entities.FiberReceipt.fields.supplier_id
          - entities.FiberReceipt.fields.declared_grade_code
          - entities.FiberReceipt.fields.sampled_by_user_id
          - entities.FiberReceipt.fields.dispositioned_by_user_id
          - endpoints.POST /fiber-purchase-orders/{id}/receipts
        distinguishing_aspect: "supplier_id and declared_grade_code are denormalized from the PARENT purchase order (they are not request inputs), sampled_by_user_id is taken from the X-User-ID header of the sampling call, and dispositioned_by_user_id is still null while SAMPLED — a handler that accepts these as body fields or leaves them null fails."
        test_recipe:
          setup: ["Supplier Delta Fiber Recovery, FiberGrade OCC_11, a CONFIRMED purchase order for OCC_11 owned by that supplier."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 180.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-purchase-orders/${po_id}/confirm"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
          trigger:
            - call: "POST /fiber-purchase-orders/${po_id}/receipts"
              payload: { truck_reference: "TRK-0002", sublots: [ { sublot_no: 1, gross_tons: 25.000, tare_tons: 7.000, moisture_pct: 9.00, contamination_pct: 1.50 } ] }
              as: QualityLab
              as_user_id: "lab-a"
          assert:
            - "HTTP status is 201"
            - "response.data.purchase_order_id == ${po_id}"
            - "response.data.supplier_id == ${supplier_id}"
            - "response.data.declared_grade_code == 'OCC_11'"
