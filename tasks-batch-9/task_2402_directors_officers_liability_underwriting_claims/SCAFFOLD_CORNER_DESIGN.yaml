            - "the accept is 404 ERR_QUOTE_NOT_FOUND — not ERR_INVALID_QUOTE_STATE and not a 403, because the RiskManager role is permitted on this endpoint and ownership cannot be evaluated for a resource that does not exist"
            - "the resolve is 404 ERR_EXCLUSION_TERM_NOT_FOUND"
            - "the mature is 404 ERR_CIRCUMSTANCE_REPORT_NOT_FOUND — not ERR_PRIOR_ACTS_EXCLUDED or any other business error"
            - "every response carries response_type == \"error\" with a meta block, and no entity was created by any of the four calls"
