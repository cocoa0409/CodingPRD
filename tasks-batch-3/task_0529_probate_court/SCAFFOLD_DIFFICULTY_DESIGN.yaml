              payload: { estate_id: "${est_id}", petitioner_name: "P", will_lodged: false, nominated_representative_name: "R" }
              as: Clerk
              captures: { pet_id: $.data.id }
            - call: "POST /representatives"
              payload: { estate_id: "${est_id}", petition_id: "${pet_id}", full_name: "R", representative_user_id: "pr-user-1" }
              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v0: $.data.version }
          trigger:
