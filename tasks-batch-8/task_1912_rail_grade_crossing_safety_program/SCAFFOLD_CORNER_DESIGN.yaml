              as: RailSafetyOfficer
            - call: "POST /quiet-zone-applications/${qz}/transition"
              payload: { to_status: "EFFECTIVE" }
              as: LocalAuthority
              as_user_id: "${loc_id}"
            - call: "POST /closure-agreements"
              payload: { crossing_id: "${cd}", locality_id: "${loc_id}", closure_type: "CLOSURE" }
