              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.5 }
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/drip-pad-logs"
              payload: { pad_code: "PAD-A", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 75.0, containment_breach: true }
              as: PlantOperator
