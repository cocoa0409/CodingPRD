            - "after call 2 RateAgreement.${ra2}.status is still DRAFT, activated_at is null, and Insurer.${ins}.version is unchanged (${ins_v1} == ${ins_v0} + 1) — a rejected OCC write bumps nothing"
            - "call 4 returns 200 with RateAgreement.${ra2}.status == ACTIVE"
