              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/coverages"
              payload: { patient_id: "${pat_id}", carrier_name: "Meridian Dental", rank: "PRIMARY", effective_date: "2024-01-01T00:00:00Z", annual_maximum_amount: 1500.00, coinsurance_major_rate: 0.50 }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { cov_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MANDIBULAR" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/claims"
              payload: { case_id: "${case_id}", coverage_id: "${cov_id}" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /prosthetics/claims/${claim_id}/submit"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_id}/post-payment"
              payload: { adjudication_outcome: "PAID" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
            - call: "POST /prosthetics/claims/${claim_id}/reverse"
              payload: { reversal_reason: "Carrier recouped the payment after an eligibility audit" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
          assert:
            - "before the trigger, Coverage.${cov_id}.benefit_used_ytd == 0.00 and benefit_remaining == 1500.00, summing to 1500.00"
            - "after the post-payment, Coverage.${cov_id}.benefit_used_ytd == 600.00 and benefit_remaining == 900.00, summing to 1500.00"
            - "after the post-payment, Claim.${claim_id}.adjudication_status == CLOSED and plan_paid_amount == 600.00"
            - "after the reverse, Coverage.${cov_id}.benefit_used_ytd == 0.00 and benefit_remaining == 1500.00, summing to 1500.00"
            - "after the reverse, Claim.${claim_id}.adjudication_status == REVERSED, plan_paid_amount == 0.00 and primary_paid_amount == 0.00"
            - "after the reverse, ProsthesisCase.${case_id}.insurance_paid_amount == 0.00 and patient_responsibility_amount == 1200.00"

      - name: payment_plan_principal_conserved_across_pay_and_reverse_payment
        grounds:
          - conservation_invariants.payment_plan_conservation
          - state_machines.Installment.SCHEDULED_to_PAID
          - state_machines.Installment.PAID_to_SCHEDULED
          - entities.PaymentPlan.fields.outstanding_amount
        distinguishing_aspect: |
          Conserved quantity: an AMORTISED PRINCIPAL, a third kind of quantity distinct
          from the visit count and from the insurance benefit pool. paid_amount plus
          outstanding_amount equals principal_amount 960.00 before the payment
          (0.00 + 960.00), after it (320.00 + 640.00) and after the reversal
          (0.00 + 960.00).
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A FLEXIBLE_PARTIAL case past complete-exam with patient_responsibility_amount 1200.00."
            - "An ACTIVE PaymentPlan with down_payment_amount 240.00, principal_amount 960.00 and three SCHEDULED installments of 320.00 due 2026-06-01, 2026-07-01 and 2026-07-31."
          setup_api_calls:
            - call: "POST /prosthetics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "POST /prosthetics/patients"
              payload: { full_name: "Wren Kilcoyne", date_of_birth: "1962-02-28", phone: "555-0455" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { pat_id: $.data.id }
            - call: "POST /prosthetics/cases"
              payload: { patient_id: "${pat_id}", prosthesis_type: "FLEXIBLE_PARTIAL" }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_id: $.data.id }
            - call: "POST /prosthetics/case-arches"
              payload: { case_id: "${case_id}", arch_position: "MAXILLARY" }
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "POST /prosthetics/cases/${case_id}/complete-exam"
              payload: {}
              as: Prosthodontist
              as_user_id: "dr-nunes"
            - call: "GET /prosthetics/cases/${case_id}"
              payload: {}
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { case_v: $.data.version }
            - call: "POST /prosthetics/payment-plans"
              payload: { patient_id: "${pat_id}", case_id: "${case_id}", installment_count: 3, down_payment_amount: 240.00, first_due_date: "2026-06-01T00:00:00Z", frequency: "MONTHLY", expected_prosthesis_case_version: "${case_v}", pay_in_full: false }
              as: FrontOffice
              as_user_id: "fo-lindgren"
              captures: { plan_id: $.data.id }
            - call: "GET /prosthetics/installments"
              payload: { payment_plan_id: "${plan_id}", installment_status: "SCHEDULED", limit: 10, offset: 0 }
