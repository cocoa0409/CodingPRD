              payload: { current_utc: "2026-07-31T23:59:59.999Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
          trigger: "POST /night-audit/card-authorizations/${auth_id}/capture with captured_amount 100.00 and business_date_id ${bd1_id} as NightAuditor (X-User-ID u_na_1), at clock 2026-08-01T00:00:00.000Z."
          assert:
            - "At clock 2026-07-31T23:59:59.999Z, GET /night-audit/card-authorizations/${auth_id} read aging_days == 6 (floor(604799.999 seconds / 86400)) and status == \"APPROVED\"."
            - "At clock 2026-08-01T00:00:00.000Z, a plain GET of the same row reads aging_days == 7 and status == \"EXPIRED\" - the lapse is applied on read, without any client call."
            - "The trigger fails 409 with data.error_id == \"ERR_AUTHORIZATION_EXPIRED\", not ERR_AUTHORIZATION_NOT_APPROVED: on a capture the aging recompute runs before the status gate, so the lapse is named for what it is."
            - "No PAYMENT line was appended: GET /night-audit/journal-postings?folio_id=${folio_id} returns only the pre-existing rows and the folio's credits_total_amount is unchanged."
            - "POST /night-audit/card-authorizations/${auth_id}/decline with decline_code EXPIRED_CARD also fails 409 ERR_AUTHORIZATION_NOT_APPROVED, so EXPIRED really is terminal."
            - "A fresh authorization obtained at 2026-08-01T00:00:00.000Z for the same folio reads aging_days == 0 and status == \"APPROVED\", and capturing 100.00 against it returns 200 with a PAYMENT line of -100.00 - the curve restarts from the new obtained_at."

      - name: calc_aggregation_folio_balance_is_a_running_total_over_every_line_ever_posted
        claim_type: aggregation
        grounds: ["calculations.folio_balance", "entities.Folio.fields.settlement_status", "entities.JournalPosting.fields.amount", "validations[priority=49]"]
        distinguishing_aspect: "The folio aggregate is not date-scoped and not sign-collapsed: charges and credits are summed into two separate declared fields over lines from two different business dates, the derived settlement_status walks UNSETTLED to PARTIALLY_SETTLED to SETTLED, and a reversal is another line rather than a subtraction."
        test_recipe:
          setup: ["Standard property; two OPEN business dates 2026-08-01 and 2026-08-02; one IN_HOUSE CASH folio with credit_limit_amount 2000.00 and no lines yet."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-02", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd2_id: "$.data.id" }
            - call: "POST /night-audit/folios"
              payload: { property_id: "${prop_id}", arrival_business_date_id: "${bd1_id}", confirmation_code: "CF-AGG1", guest_name: "Jon Whitlock", room_number: "701", nights_count: 2, contracted_rate_amount: 200.00, rate_plan_code: "BAR", market_segment: "TRANSIENT", settlement_method: "CASH", scheduled_checkout_at: "2026-08-03T11:00:00.000Z", credit_limit_amount: 2000.00 }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { folio_id: "$.data.id" }
            - call: "POST /night-audit/folios/${folio_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd1_id}", charge_type: "MISC_CHARGE", amount: 120.55, folio_id: "${folio_id}", memo: "Day one spa" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { post_1_id: "$.data.id" }
            - call: "POST /night-audit/journal-postings"
              payload: { business_date_id: "${bd2_id}", charge_type: "MISC_CHARGE", amount: 79.45, folio_id: "${folio_id}", memo: "Day two spa" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/folios/${folio_id}/payments"
              payload: { business_date_id: "${bd2_id}", amount: 50.00, memo: "Part payment" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
          trigger: "POST /night-audit/journal-postings/${post_1_id}/reverse with memo Spa charge disputed as NightAuditor (X-User-ID u_na_1)."
          assert:
            - "After the two charges the folio read charges_total_amount == 200.00, credits_total_amount == 0.00, balance_amount == 200.00 and settlement_status == \"UNSETTLED\", even though the two lines belong to different business dates."
            - "After the 50.00 payment it read charges_total_amount == 200.00, credits_total_amount == -50.00, balance_amount == 150.00 and settlement_status == \"PARTIALLY_SETTLED\"."
            - "The trigger returns 201 with amount == -120.55, and the folio then reads charges_total_amount == 200.00, credits_total_amount == -170.55 and balance_amount == 29.45 - the reversal is a credit line, not a retraction of the original charge."
            - "A second POST /night-audit/journal-postings/${post_1_id}/reverse fails 409 ERR_POSTING_ALREADY_REVERSED and the balance stays 29.45."
            - "A final payment of 29.45 drives balance_amount to 0.00 and settlement_status to \"SETTLED\"; GET /night-audit/journal-postings?folio_id=${folio_id} then returns exactly 5 rows."
            - "GET /night-audit/business-dates/${bd1_id} reads total_revenue_amount == 0.00 throughout, because MISC_CHARGE, PAYMENT and reversal lines are not room, outlet or tax revenue - the folio aggregate and the date aggregate sum different things over the same rows."

      - name: calc_threshold_outlet_ticket_discount_gate
        claim_type: threshold
        excluded_because:
          difficulty_instance: outlet_ticket_threshold_pinned_to_pre_discount_taxable_base
          rationale: "The scaffold's threshold calculation is outlet_ticket_total, whose large_ticket_threshold_amount is compared against the taxable base while the discount itself is computed from the gross. The §1.8 instance already probes that gate at the base one cent below the threshold, exactly at it and one cent above, which is precisely the 'threshold-1, threshold, threshold+1 plus crossing behaviour' claim, so a breadth copy would add nothing but duplicate ids."

      - name: calc_tiered_pricing_late_checkout_tier_boundaries
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: late_checkout_charge_nested_floor_and_rate_ceiling_clamp
          rationale: "late_checkout_charge is the only tiered calculation, and every tier boundary - 30, 31, 180, 181, 360 and 361 overdue minutes - plus the marginal-versus-average question is settled inside the §1.8 instance, which additionally pins the order of the round-then-clamp composition that decides the answer at the boundaries."

      - name: calc_interval_merge_settlement_batch_window_matching
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: settlement_shift_half_open_window_allows_adjacent_shifts
          rationale: "settlement_reconciliation is the scaffold's interval calculation and its adjacency semantics are the whole point: [shift_start_at, shift_end_at) means two touching shifts are disjoint while any true overlap is refused. The §1.8 instance covers adjacency at gap zero, genuine overlap and the ticket that lands exactly on the shared endpoint, which is the full interval claim set."

      - name: calc_precision_city_ledger_fee_rounding_order
        claim_type: precision
        excluded_because:
          difficulty_instance: city_ledger_fee_rounded_per_folio_then_summed
          rationale: "Rounding mode and rounding position are only observable where they change the answer, and in this scaffold that place is the city-ledger fee: rounding per folio before summation gives 5.85 where rounding once over the summed balances gives 5.84. The §1.8 instance asserts that one-cent difference directly, so a generic two-decimal precision test would be strictly weaker."

      - name: calc_variant_divergence_occupancy_tax_two_bases
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: occupancy_tax_provisional_vs_final_true_up_on_seal
          rationale: "occupancy_tax is one of the two declared dual-variant calculations, and its PROVISIONAL and FINAL variants differ both in base (gross per line versus net of credits per folio) and in rounding position. The §1.8 instance runs the same folio through both variants and asserts the divergence and the exact delta, which is the variant-divergence claim in full."

      - name: calc_variant_selection_pace_basis_chooses_the_benchmark
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: pace_index_calendar_aligned_vs_weekday_aligned_benchmark
          rationale: "pace_index is the other dual-variant calculation and the variant is selected by the report's pace_basis input. The §1.8 instance publishes two reports over identical revenue with the two bases and asserts each picks its own declared denominator, which is exactly the 'correct variant applied in the correct context' claim."

      - name: calc_reconciliation_true_up_delta_posted_on_seal
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: occupancy_tax_provisional_vs_final_true_up_on_seal
          rationale: "The variant switch in this domain happens at seal-charges, where the PROVISIONAL to FINAL move is settled by appending a TAX_TRUE_UP line of the delta and by writing no line at all when the delta is 0.00. The §1.8 instance asserts both the non-zero delta posting and the zero-delta silence, so the reconciliation claim is already fully exercised there."

  - section: validations
    instances:

      - name: validation_violation_to_error_cancelling_a_folio_that_owes_money
        claim_type: violation_to_error
        grounds: ["validations[priority=95]", "errors[ERR_FOLIO_BALANCE_NOT_ZERO]", "validations[priority=38]"]
        distinguishing_aspect: "The declared cancel gate is on money, not on state, and it is reachable only because the scaffold puts no stay-status gate on client postings: a RESERVED folio can legitimately carry a pre-arrival charge, and that is exactly what blocks its cancellation."
        test_recipe:
          setup: ["Standard property; business date 2026-08-01 left OPEN; one RESERVED folio carrying a single 75.00 pre-arrival MISC_CHARGE."]
          setup_api_calls:
            - call: "POST /night-audit/properties"
