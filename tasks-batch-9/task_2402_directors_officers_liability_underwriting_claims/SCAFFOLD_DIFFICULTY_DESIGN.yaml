            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/policies/${policy_id}/claims"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Probe D", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-10T00:00:00Z", alleged_damages_usd: 1000000 }
              as: RiskManager
