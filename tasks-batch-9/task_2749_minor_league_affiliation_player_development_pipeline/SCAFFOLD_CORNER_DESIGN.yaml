              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { cv_ok: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Legacy Coach", discipline: "HITTING", curriculum_version_certified: "2025.2", certification_expires_on: "2027-01-31" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { cv_old: $.data.id }
          trigger:
            - call: "GET /affiliates/${cv_aff}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { cv_v1: $.data.version }
            - call: "POST /staff-allocations"
              payload: { staff_member_id: "${cv_ok}", affiliate_id: "${cv_aff}", staff_role: "PITCHING_COACH", fte_pct: 50, effective_start: "2026-04-01", effective_end: "2026-09-01", curriculum_version: "2025.2", expected_affiliate_version: "${cv_v1}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { cv_e1: $.data.error_id }
            - call: "POST /staff-allocations"
              payload: { staff_member_id: "${cv_old}", affiliate_id: "${cv_aff}", staff_role: "HITTING_COACH", fte_pct: 50, effective_start: "2026-04-01", effective_end: "2026-09-01", curriculum_version: "2026.1", expected_affiliate_version: "${cv_v1}" }
              as: FarmDirector
