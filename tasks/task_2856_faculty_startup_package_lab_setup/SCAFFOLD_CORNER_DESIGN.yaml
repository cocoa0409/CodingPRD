        distinguishing_aspect: "The API is declared immediately consistent, and the ledger-moving endpoint is where that bites: the 200 body of /place already carries the derived encumbrance and the computed delivery date, and every derived field on four other entities is final in the very next read - no re-read, no delay, no eventual convergence."
