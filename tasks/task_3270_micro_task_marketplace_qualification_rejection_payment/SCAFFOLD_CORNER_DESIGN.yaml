scaffold_corner_design:


  # ===========================================================================
  - section: entities
    instances:

      - name: requester_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Requester
          - endpoints.POST_/mkt/requesters
        distinguishing_aspect: "A requester created with only name comes back 201 with status ACTIVE, version 1, prepaid_balance_cents 0, abuse_score 0 and task_abuse_flag false — none of those are client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Corner" }
              as: Anonymous
              captures: { rid: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Requester.${rid}.status == ACTIVE and version == 1"
            - "Requester.${rid}.prepaid_balance_cents == 0 and escrowed_cents == 0 and lifetime_spent_cents == 0"
            - "Requester.${rid}.abuse_score == 0 and task_abuse_flag == false"
            - "the response data carries non-null id, created_at and updated_at, and meta.api_request_id is present"

      - name: worker_create_defaults_counters_to_zero_and_rate_to_100
        claim_type: Defaults
        grounds:
          - entities.Worker
          - endpoints.POST_/mkt/workers
        distinguishing_aspect: "A brand-new worker reads approval_rate_pct 100 even though both counts are 0, because the zero-denominator default is 100 rather than 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Corner", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
          assert:
            - "the response status is 201"
            - "Worker.${w1}.approval_rate_pct == 100 while approved_count == 0 and rejected_count == 0"
            - "Worker.${w1}.returned_count == 0 and expired_count == 0"
            - "Worker.${w1}.identity_verified == false and status == ACTIVE"

      - name: hit_funds_required_is_computed_on_create
        claim_type: Computed Fields
        grounds:
          - entities.HIT.fields.funds_required_cents
          - calculations.hit_funds_required
        distinguishing_aspect: "A 100c single-slot HIT with no bonus reports funds_required_cents 125 on read, derived from the pinned tier evaluation rather than supplied by the client."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One requester registered."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Compprobe" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Computed Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
          trigger:
            - call: "GET /mkt/hits/${hit1}"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "HIT.${hit1}.funds_required_cents == 125"
            - "HIT.${hit1}.escrowed_cents == 0 and HIT.${hit1}.accepted_count == 0"
            - "HIT.${hit1}.status == DRAFT and HIT.${hit1}.committed_assignments == 0"

      - name: qualification_type_out_of_enum_kind_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.QualificationType.fields.kind
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "kind is a closed enum SYSTEM | REQUESTER; any other token is rejected with 400 ERR_INVALID_REQUEST rather than being coerced to a default."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mkt/qualification-types"
              payload: { name: "Bad Kind", kind: "BOGUS", auto_assign_threshold_pct: 80 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no QualificationType row is persisted"

      - name: assignment_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/mkt/assignments/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated id on the assignment path yields 404 ERR_NOT_FOUND, not 400 and not an empty object."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One real assignment exists (to prove the endpoint works for a live id), plus an id that was never minted."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme NotFound" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "NotFound Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 NotFound", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /mkt/assignments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "GET /mkt/assignments/${a1} returns 200 for the live id, proving the 404 is about the unknown id"

      - name: hits_list_paginates_and_filters_by_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/mkt/hits
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two PUBLISHED and one DRAFT HIT, status=PUBLISHED&limit=1&offset=0 returns one row with total_count 2 and has_more true, so total_count counts the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One requester with three HITs, two published and one left draft."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Listing" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "List A", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hA: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "List B", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hB: $.data.id }
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "List C", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hC: $.data.id }
            - call: "POST /mkt/hits/${hA}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/hits/${hB}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "GET /mkt/hits"
              payload: { requester_id: "${rid}", status: "PUBLISHED", limit: 1, offset: 0 }
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 1 row is returned with total_count == 2 and has_more == true"
            - "GET /mkt/hits?requester_id=${rid} returns 3 rows"
            - "GET /mkt/hits?requester_id=${rid}&status=PUBLISHED&limit=10&offset=0 returns 2 rows with has_more == false"

      - name: hit_create_without_title_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/mkt/hits
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "title is a required input with no default; omitting it is rejected with 400 ERR_INVALID_REQUEST and no HIT row is created."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One requester registered."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Required" }
              as: Anonymous
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /mkt/hits?requester_id=${rid} returns 0 rows"

      - name: review_rows_are_append_only_and_carry_the_requester_actor
        claim_type: System Fields
        grounds:
          - entities.Review
          - endpoints.GET_/mkt/assignments/{id}/reviews
        distinguishing_aspect: "Approving appends one Review with actor_role REQUESTER and actor_requester_id equal to the HIT owner, while bonus_cents and abuse_points stay 0 for an APPROVAL-kind row."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One approved assignment owned by requester Acme."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Reviews" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Review Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Reviews", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "GET /mkt/assignments/${a1}/reviews"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "the response status is 200 and returns exactly 1 row"
            - "the row has kind == APPROVAL and actor_role == REQUESTER"
            - "the row has actor_requester_id == ${rid}, bonus_cents == 0 and abuse_points == 0"

      - name: requester_get_returns_the_stored_profile_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Requester
          - endpoints.GET_/mkt/requesters/{id}
        distinguishing_aspect: "A requester profile round-trips through GET with name unchanged, lifetime_rejection_rate_pct defaulting to 100 on a zero denominator, and status ACTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester Acme registered."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Retrieval" }
              as: Anonymous
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /mkt/requesters/${rid}"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "Requester.${rid}.name == \"Acme Retrieval\""
            - "Requester.${rid}.lifetime_rejection_rate_pct == 100 and lifetime_spent_cents == 0"
            - "Requester.${rid}.status == ACTIVE and suspension_reason is null"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: hit_create_starts_in_draft_with_no_escrow
        claim_type: Initial State
        grounds:
          - state_machines.HIT.initial_state
        distinguishing_aspect: "A newly created HIT is DRAFT with escrowed_cents 0 — posting a HIT never holds funds, only publish does."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One requester registered."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Initial" }
              as: Anonymous
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Initial Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
          assert:
            - "the response status is 201 and HIT.${hit1}.status == DRAFT"
            - "HIT.${hit1}.escrowed_cents == 0 and HIT.${hit1}.accepted_count == 0"
            - "Requester.${rid}.escrowed_cents == 0"

      - name: hit_publish_moves_draft_to_published_and_holds_funds
        claim_type: Valid Transition
        grounds:
          - state_machines.HIT.transitions.DRAFT_to_PUBLISHED
          - endpoints.POST_/mkt/hits/{hit_id}/publish
        distinguishing_aspect: "Publish moves DRAFT to PUBLISHED and, in the same request, moves funds_required_cents 125 out of the prepaid balance into escrow."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Requester deposited 2000c; a 100c single-slot HIT exists in DRAFT."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Publish" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 2000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Publish Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
          trigger:
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          assert:
            - "the response status is 200 and HIT.${hit1}.status == PUBLISHED"
            - "HIT.${hit1}.escrowed_cents == 125"
            - "Requester.${rid}.prepaid_balance_cents == 1875 and Requester.${rid}.escrowed_cents == 125"

      - name: assignment_submit_after_approval_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Assignment.transitions.SUBMITTED_to_APPROVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "APPROVED is terminal, so a second submit is refused with 409 ERR_INVALID_STATE; only the state error fires, not a re-review."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One assignment submitted and approved by the requester."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Invalid" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Invalid Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Invalid", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Assignment.${a1}.status == APPROVED and Worker.${w1}.approved_count == 1"

      - name: assignment_reject_after_approval_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Assignment.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once APPROVED, a rejection is refused and no second Review row is appended, so the terminal state genuinely locks the review loop closed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One assignment submitted and approved."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Terminal" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "Terminal Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 120 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 Terminal", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:40:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
            - call: "POST /mkt/assignments/${a1}/approve"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
          trigger:
            - call: "POST /mkt/assignments/${a1}/reject"
              payload: { reason: "changed my mind" }
              as: Requester
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
