            - "GET /grain-inspection/inspection-requests/${r2}/certificates?limit=101 -> 422 ERR_INVALID_REQUEST (max 100) and limit=0 -> 422 ERR_INVALID_REQUEST (min 1)"

      - name: service_area_patch_touches_only_the_declared_mutable_fields
        claim_type: standard_crud
        grounds:
          - "endpoints[PATCH /grain-inspection/service-areas/{id}]"
          - "entities.ServiceArea.fields.fee_multiplier_bp"
          - "entities.ServiceArea.fields.concurrent_watch_capacity"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A partial update on the one patchable entity in the model: omitted keys must be left alone rather than reset to their defaults, the authority multiplier has a hard 10000..15000 window whose lower bound is the default, and immutable identity fields are not merely ignored but rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "One DESIGNATED area created with defaults (fee_multiplier_bp 10000, supervision_required true, concurrent_watch_capacity 2, status ACTIVE)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id", v0: "$.data.version" }
          trigger:
            - call: PATCH /grain-inspection/service-areas/${area}
              as: ServiceAdmin
              payload: { fee_multiplier_bp: 12500 }
              captures: { fm: "$.data.fee_multiplier_bp" }
          assert:
            - "200 with fee_multiplier_bp 12500 while name, state_code, authority_type DESIGNATED, supervision_required true, concurrent_watch_capacity 2, status ACTIVE and open_watch_count 0 are unchanged"
            - "version increments from ${v0} by exactly one and updated_at advances to the logical clock"
            - "fee_multiplier_bp 9999 -> 422 ERR_INVALID_REQUEST and 15001 -> 422 ERR_INVALID_REQUEST; 10000 and 15000 -> 200 (both bounds inclusive)"
            - "A body naming name or authority_type -> 422 ERR_INVALID_REQUEST: unknown or immutable keys are rejected, not silently dropped"
            - "An empty body -> 422 ERR_INVALID_REQUEST at priority 6, and any PATCH as SupervisingInspector -> 403 ERR_UNAUTHORIZED"
            - "PATCH on an unknown id -> 404 ERR_SERVICE_AREA_NOT_FOUND, which is reached at priority 3, before the body is even parsed"

  - section: errors
    instances:
      - name: every_unknown_path_id_returns_its_own_not_found_code
        claim_type: error_triggerability
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_APPEAL_VOTE_NOT_FOUND]"
          - "errors[ERR_SERVICE_AREA_NOT_FOUND]"
          - "errors[ERR_CERTIFICATE_NOT_FOUND]"
          - "response_envelope.error_shape"
        distinguishing_aspect: "Fourteen collections must each map to their own 404 code rather than to a generic one, and the same code family is reused at priority 6 for FK references inside a body, so an unknown id in the path and the same unknown id in a payload produce identical error_ids from different rules."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; the store is otherwise empty."
            - "A syntactically valid UUID that names no row: 00000000-0000-4000-8000-000000000001."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
          trigger:
            - call: GET /grain-inspection/appeal-votes/00000000-0000-4000-8000-000000000001
              as: Auditor
              captures: { err: "$.data.error_id" }
          assert:
            - "404 ERR_APPEAL_VOTE_NOT_FOUND with an envelope of success false, data null and an error object carrying error_id, message and no stack detail"
            - "The same unknown id under /service-areas/{id}, /fee-schedules/{id}, /applicants/{id}, /inspectors/{id}, /equipment/{id} and /inspection-requests/{id} -> 404 ERR_SERVICE_AREA_NOT_FOUND, ERR_FEE_SCHEDULE_NOT_FOUND, ERR_APPLICANT_NOT_FOUND, ERR_INSPECTOR_NOT_FOUND, ERR_EQUIPMENT_NOT_FOUND, ERR_INSPECTION_REQUEST_NOT_FOUND respectively"
            - "The same unknown id under /samples/{id}, /grading-results/{id}, /protein-analyses/{id}, /weighing-records/{id} -> ERR_SAMPLE_NOT_FOUND, ERR_GRADING_RESULT_NOT_FOUND, ERR_PROTEIN_ANALYSIS_NOT_FOUND, ERR_WEIGHING_RECORD_NOT_FOUND"
            - "The same unknown id under /certificates/{id}, /appeals/{id}, /vessel-watches/{id} -> ERR_CERTIFICATE_NOT_FOUND, ERR_APPEAL_NOT_FOUND, ERR_VESSEL_WATCH_NOT_FOUND"
            - "POST /grain-inspection/samples with an unknown sampling_device_id -> 404 ERR_EQUIPMENT_NOT_FOUND at priority 6, and with an unknown inspection_request_id -> 404 ERR_INSPECTION_REQUEST_NOT_FOUND, the path-level and body-level rules sharing one code per collection"
            - "A malformed id such as 'not-a-uuid' in the path -> 404 of the same collection code, never a 500"

  - section: rbac
    instances:
      - name: requests_without_a_user_header_are_unauthenticated
        claim_type: authentication
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "rbac.roles"
        distinguishing_aspect: "Authentication is priority 1, so it pre-empts every other diagnosis: the very same call that would otherwise return a 404 for an unknown path id, or a 422 for a malformed body, must return 401 when the X-User-Id header is absent or names an unknown user."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; one DESIGNATED area exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
          trigger:
            - call: GET /grain-inspection/service-areas/${area}
              as: "(request sent with no X-User-Id header)"
              captures: { err: "$.data.error_id" }
          assert:
            - "401 ERR_UNAUTHENTICATED even though the path id resolves and the caller would have been allowed as any role"
            - "An X-User-Id of 'nobody_user' -> 401 ERR_UNAUTHENTICATED: the header must name a known user, not merely be present"
            - "A header-less GET on an unknown service-area id -> 401 ERR_UNAUTHENTICATED, not 404: priority 1 precedes priority 3"
            - "A header-less POST /grain-inspection/service-areas with an empty body -> 401 ERR_UNAUTHENTICATED, not 422"
            - "A header-less POST /_clock/set_current_utc -> 401 ERR_UNAUTHENTICATED: the clock endpoint is open to all roles but not to anonymous callers"

      - name: applicant_scope_violation_precedes_the_version_check
        claim_type: ownership_scope
        grounds:
          - "validations[priority=4]"
          - "validations[priority=8]"
          - "errors[ERR_APPLICANT_SCOPE_VIOLATION]"
          - "errors[ERR_CERTIFICATE_VERSION_CONFLICT]"
          - "rbac.roles.ApplicantUser"
        distinguishing_aspect: "Ownership is priority 4, four steps ahead of the OCC check, so an appeal that names a foreign applicant is refused with 403 even when its expected_certificate_version is deliberately stale; the same body with the owning applicant and a fresh version succeeds, which isolates ownership from every other cause."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with an ACTIVE GRADING fee schedule, a certified probe and an inspector holding SAMPLING and GRADING."
            - "Applicant OWNER holds a graded CORN request and a GRADE certificate; applicant OTHER exists with no work of its own."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fsg: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fsg}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Owner Coop", account_code: "OWN-120", contact_email: "ap@owner.example" }
              captures: { owner: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Other Coop", account_code: "OTH-120", contact_email: "ap@other.example" }
              captures: { other: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1440", full_name: "O. Owner Grader", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-SCOPE", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${owner}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-SCOPE", declared_quantity_bushels: 900, requested_services: ["GRADING"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-SCOPE", portions_count: 4 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 55.0, moisture_pct: 14.6, damaged_total_pct: 4.0, heat_damaged_pct: 0.1, foreign_material_pct: 2.6 }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", issuing_inspector_id: "${insp}", certificate_type: "GRADE" }
              captures: { cert: "$.data.id", cv: "$.data.version" }
          trigger:
            - call: POST /grain-inspection/appeals
              as: ApplicantUser
              payload: { certificate_id: "${cert}", applicant_id: "${other}", appeal_type: "APPEAL", expected_certificate_version: "${cv}" }
              captures: { err: "$.data.error_id" }
          assert:
            - "403 ERR_APPLICANT_SCOPE_VIOLATION: the certificate's applicant chain resolves to OWNER, not to the named applicant"
            - "GET /grain-inspection/certificates/${cert} -> status still ISSUED and GET /grain-inspection/applicants/${other} -> charges_total_cents 0 (no deposit was taken)"
            - "The same body with a deliberately stale expected_certificate_version and applicant_id ${other} -> still 403 ERR_APPLICANT_SCOPE_VIOLATION, never 412 ERR_CERTIFICATE_VERSION_CONFLICT: priority 4 outranks priority 8"
            - "The same body with applicant_id ${owner} and version ${cv} -> 201, isolating ownership as the only defect"
            - "GET /grain-inspection/applicants as ApplicantUser -> 403 (the applicant list is admin, supervisor and auditor only), while GET /grain-inspection/applicants/${owner} as ApplicantUser -> 200"

      - name: role_exclusive_operations_are_closed_to_every_other_role
        claim_type: authorization
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "rbac.roles.SupervisingInspector"
          - "rbac.roles.Auditor"
        distinguishing_aspect: "Authorization is priority 2, ahead of path existence, so a forbidden role gets 403 even on an id that does not exist; and the segregation-of-duties role model means authority is not nested - a SupervisingInspector who may do every line task still cannot configure areas, and an Auditor may read everything yet write nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; a DESIGNATED area and an inspector exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1441", full_name: "A. Anybody", endorsements: ["GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/inspectors/${insp}/suspend
              as: SupervisingInspector
              payload: { suspension_reason: "unilateral suspension attempt" }
              captures: { err: "$.data.error_id" }
          assert:
            - "403 ERR_UNAUTHORIZED: licence actions are ServiceAdmin exclusives even for a supervisor"
            - "GET /grain-inspection/inspectors/${insp} -> license_status still PROBATIONARY"
            - "POST /grain-inspection/weighing-records/{id}/supervise, /samples/{id}/break-seal, /vessel-watches/{id}/start and /vessel-watches/{id}/close as LicensedInspector -> 403 ERR_UNAUTHORIZED (SupervisingInspector exclusives)"
            - "POST /grain-inspection/certificates, /grading-results, /samples and /applicants/{id}/payments as Auditor -> 403 ERR_UNAUTHORIZED, while every GET as Auditor -> 200"
            - "POST /grain-inspection/appeals/{id}/dismiss as SupervisingInspector -> 403 ERR_UNAUTHORIZED even though assign-sample and decide are shared with ServiceAdmin"
            - "POST /grain-inspection/inspectors/00000000-0000-4000-8000-000000000001/suspend as SupervisingInspector -> 403 ERR_UNAUTHORIZED, not 404: priority 2 precedes priority 3"

      - name: original_grader_cannot_regrade_or_vote_on_their_own_determination
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "state_machines.Appeal.status.SAMPLE_ASSIGNED_to_UNDER_REVIEW"
          - "rbac.roles.SupervisingInspector"
        distinguishing_aspect: "The forbidden identity is defined by data, not by role: the inspector who produced the challenged FINAL determination is barred from two different endpoints on that one appeal while remaining a perfectly valid actor everywhere else, and because the rule sits at priority 10 the actor must first be ACTIVE and endorsed for the refusal to be attributable to segregation at all."
        test_recipe:
