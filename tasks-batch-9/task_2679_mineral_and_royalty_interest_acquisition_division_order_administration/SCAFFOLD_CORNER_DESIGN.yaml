- section: endpoints
  instances:

  - name: list_tracts_applies_pagination_defaults_and_rejects_out_of_range_limits
    claim_type: Standard CRUD
    grounds:
    - response_envelope.pagination
    - validations[priority=8]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: "The list envelope defaults to limit 10 offset 0 and reports total_count over the whole filtered set with has_more derived from it; limit 101, limit 0 and offset -1 are each rejected with ERR_INVALID_REQUEST (400) rather than being clamped."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "three RESEARCH tracts in TX"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
      - call: "POST /tracts"
        payload: { county: "Loving", state_code: "TX", gross_acres: 320.0000, operator_activity_tier: "MODERATE" }
        as: TitleAnalyst
      - call: "POST /tracts"
        payload: { county: "Ward", state_code: "TX", gross_acres: 160.0000, operator_activity_tier: "LOW" }
        as: TitleAnalyst
      trigger:
      - call: "GET /tracts"
        payload: { state_code: "TX" }
        as: TitleAnalyst
      - call: "GET /tracts"
        payload: { state_code: "TX", limit: 2, offset: 2 }
        as: TitleAnalyst
      - call: "GET /tracts"
        payload: { limit: 101 }
        as: TitleAnalyst
        captures: { err: $.data.error_id }
      - call: "GET /tracts"
        payload: { limit: 0 }
        as: TitleAnalyst
      - call: "GET /tracts"
        payload: { offset: -1 }
        as: TitleAnalyst
      assert:
      - "the first call returns HTTP 200 with three items, total_count == 3, has_more == false and the default limit 10 / offset 0 applied"
      - "the second call returns exactly one item with total_count == 3 and has_more == false"
      - "the limit 101 call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST (the declared maximum is 100, and 100 itself is accepted)"
      - "the limit 0 call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST (the declared minimum is 1)"
      - "the offset -1 call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"

  - name: allocation_link_requires_both_unit_and_tract_and_reports_which_is_missing
    claim_type: Cross-reference link
    grounds:
    - validations[priority=6]
    - errors[ERR_UNIT_NOT_FOUND]
    - errors[ERR_TRACT_NOT_FOUND]
    distinguishing_aspect: "The body-level FK check names the offending parent: an unknown unit_id yields ERR_UNIT_NOT_FOUND while an unknown tract_id on the same endpoint yields ERR_TRACT_NOT_FOUND, both 404, and the valid pair then creates the association with unallocated_acres reduced."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "one CERTIFIED tract and one Unit of 1280.0000 acres owned by op-user-001"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { p2t: $.data.id }
      - call: "POST /tracts/${p2t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${p2t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /units"
        payload: { unit_name: "Reeves Unit 41H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3 }
        as: Operator
        as_user_id: "op-user-001"
        captures: { p2u: $.data.id }
      trigger:
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "00000000-0000-0000-0000-000000000000", tract_id: "${p2t}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
        captures: { err: $.data.error_id }
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "${p2u}", tract_id: "00000000-0000-0000-0000-000000000000", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "${p2u}", tract_id: "${p2t}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
      assert:
      - "the unknown-unit call returns HTTP 404 with data.error_id == ERR_UNIT_NOT_FOUND"
      - "the unknown-tract call returns HTTP 404 with data.error_id == ERR_TRACT_NOT_FOUND"
      - "the valid call returns HTTP 201 with allocation_status == ACTIVE and released_acres == 0.0000"
      - "after the valid call Unit.${p2u}.unallocated_acres == 960.0000 and active_allocation_count == 1"
      - "neither rejected call changed Unit.${p2u}.unallocated_acres from 1280.0000"

  - name: pugh_release_on_a_unit_without_a_pugh_clause_is_not_applicable
    claim_type: Conditional action
    grounds:
    - validations[priority=70]
    - errors[ERR_PUGH_CLAUSE_NOT_APPLICABLE]
    distinguishing_aspect: "The pugh action is gated on the unit's configuration flag, not on time: with pugh_clause_active false the release returns ERR_PUGH_CLAUSE_NOT_APPLICABLE (409) even though the clock is far past any plausible deadline, and PATCHing the flag on (with a past deadline) makes the same request succeed."
    test_recipe:
      setup:
      - "logical clock moved to 2027-06-01T00:00:00Z"
      - "a Unit with pugh_clause_active false, producing_depth_count 2 of 3, and one ACTIVE 320.0000-acre allocation"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { p3t: $.data.id }
      - call: "POST /tracts/${p3t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${p3t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /units"
        payload: { unit_name: "Reeves Unit 42H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3 }
        as: Operator
        as_user_id: "op-user-001"
        captures: { p3u: $.data.id }
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "${p3u}", tract_id: "${p3t}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
        captures: { p3a: $.data.id }
      - call: "POST /_clock/set_current_utc"
        payload: { current_utc: "2027-06-01T00:00:00Z" }
        as: PlatformAdmin
      trigger:
      - call: "POST /unit-tract-allocations/${p3a}/pugh-release"
        payload: {}
        as: Operator
        as_user_id: "op-user-001"
        captures: { err: $.data.error_id }
      - call: "PATCH /units/${p3u}"
        payload: { pugh_clause_active: true, pugh_deadline: "2026-12-31" }
        as: Operator
        as_user_id: "op-user-001"
      - call: "POST /unit-tract-allocations/${p3a}/pugh-release"
        payload: {}
        as: Operator
        as_user_id: "op-user-001"
      assert:
      - "the first release returns HTTP 409 with data.error_id == ERR_PUGH_CLAUSE_NOT_APPLICABLE"
      - "UnitTractAllocation.${p3a}.allocation_status is still ACTIVE with allocated_acres 320.0000 and released_acres 0.0000"
      - "after the PATCH the second release returns HTTP 200 with allocation_status == PUGH_RELEASED"
      - "the released allocation keeps allocated_acres == 213.3333 and released_acres == 106.6667 (2 of 3 depths producing), and Unit.${p3u}.unallocated_acres == 1066.6667"

  - name: tax_statement_is_a_computed_read
    claim_type: Computed read
    grounds:
    - endpoints[GET /royalty-owners/{id}/tax-statement]
    excluded_because:
      difficulty_instance: boundary_precision_check / tax_statement_with_no_paid_details_returns_zeroed_statement
      rationale: "The computed-read contract - eight derived fields, no stored row, HTTP 200 on an empty input set - is asserted by the named §1.8 instance."

  - name: terminate_allocation_action_returns_acreage_to_the_unit
    claim_type: Action endpoint
    grounds:
    - endpoints[POST /unit-tract-allocations/{id}/terminate]
    excluded_because:
      difficulty_instance: compensating_invariant / unit_acreage_total_preserved_across_pugh_release_and_termination
      rationale: "Every side effect of the terminate action, including the acreage returned to unallocated_acres, is asserted at each checkpoint of the named §1.8 instance."

# ===========================================================================
# 6. ERRORS
# ===========================================================================
- section: errors
  instances:

  - name: unknown_path_ids_return_the_entity_specific_not_found_error
    claim_type: Triggerability
    grounds:
    - validations[priority=5]
    - errors[ERR_ROYALTY_OWNER_NOT_FOUND]
    - errors[ERR_VALUATION_NOT_FOUND]
    - errors[ERR_OFFER_LETTER_NOT_FOUND]
    - errors[ERR_PSA_NOT_FOUND]
    - errors[ERR_TITLE_DEFECT_NOT_FOUND]
    - errors[ERR_UNIT_NOT_FOUND]
    - errors[ERR_ALLOCATION_NOT_FOUND]
    - errors[ERR_DIVISION_ORDER_NOT_FOUND]
    - errors[ERR_REVENUE_DETAIL_NOT_FOUND]
    - errors[ERR_SUSPENSE_ACCOUNT_NOT_FOUND]
    distinguishing_aspect: "Each path parameter resolves to its own 404 code rather than a single generic ERR_NOT_FOUND, so ten reads of the same non-existent id 00000000-0000-0000-0000-000000000000 produce ten distinct error_ids."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "an empty database - no fixtures are needed for a 404 sweep"
      setup_api_calls: []
      trigger:
      - call: "GET /royalty-owners/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: DivisionOrderAdmin
        captures: { err: $.data.error_id }
      - call: "GET /valuations/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: AcquisitionManager
      - call: "GET /offer-letters/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: AcquisitionManager
      - call: "GET /psas/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: AcquisitionManager
      - call: "GET /title-defects/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: TitleAnalyst
      - call: "GET /units/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: Operator
        as_user_id: "op-user-001"
      - call: "GET /unit-tract-allocations/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: Operator
        as_user_id: "op-user-001"
      - call: "GET /division-orders/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: DivisionOrderAdmin
      - call: "GET /revenue-check-details/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: DivisionOrderAdmin
      - call: "GET /suspense-accounts/00000000-0000-0000-0000-000000000000"
        payload: {}
        as: DivisionOrderAdmin
      assert:
      - "every call returns HTTP 404 with success == false and a non-empty message"
      - "the error_ids are, in call order: ERR_ROYALTY_OWNER_NOT_FOUND, ERR_VALUATION_NOT_FOUND, ERR_OFFER_LETTER_NOT_FOUND, ERR_PSA_NOT_FOUND, ERR_TITLE_DEFECT_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_DIVISION_ORDER_NOT_FOUND, ERR_REVENUE_DETAIL_NOT_FOUND, ERR_SUSPENSE_ACCOUNT_NOT_FOUND"
      - "data is null in every response envelope"

  - name: assignments_summing_above_the_burden_cap_are_rejected_at_certification
    claim_type: Triggerability
    grounds:
    - validations[priority=69]
    - calculations.tract_burden_fraction.constants.BURDEN_CAP
    - errors[ERR_BURDEN_CAP_EXCEEDED]
    distinguishing_aspect: "The cap is on the aggregate of ASSIGNMENT fractions, not on any single instrument: 0.2000 and 0.1000 are individually legal but sum to 0.3000 > 0.2500, so certify-title returns ERR_BURDEN_CAP_EXCEEDED (422) while the acreage replay itself is perfectly valid."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a RESEARCH tract with one PATENT and two ASSIGNMENT instruments of 0.2000 and 0.1000"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { e2t: $.data.id }
      - call: "POST /tracts/${e2t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e2t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2009-04-02", conveyed_fraction: 0.2, county_book_page: "700/11", grantor_name: "A Patentee", grantee_name: "ORRI One" }
        as: TitleAnalyst
      - call: "POST /tracts/${e2t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.1, county_book_page: "780/301", grantor_name: "A Patentee", grantee_name: "ORRI Two" }
        as: TitleAnalyst
      trigger:
      - call: "POST /tracts/${e2t}/certify-title"
        payload: {}
        as: TitleAnalyst
        captures: { err: $.data.error_id }
      assert:
      - "HTTP 422 with data.error_id == ERR_BURDEN_CAP_EXCEEDED - not ERR_CHAIN_ACREAGE_NEGATIVE, since the acreage replay stays at 640.0000 throughout"
      - "Tract.${e2t}.title_status is still RESEARCH with net_mineral_acres_certified null and existing_burden_fraction null"
      - "dropping the 0.1000 assignment would certify with existing_burden_fraction == 0.2000, and a chain summing to exactly 0.2500 certifies too - the cap is inclusive"

  - name: offer_below_the_walk_away_floor_is_rejected_at_the_floor_boundary
    claim_type: Triggerability
    grounds:
    - validations[priority=81]
    - errors[ERR_OFFER_BELOW_BID_FLOOR]
    - calculations.valuation_bid_band
    distinguishing_aspect: "The band's lower edge is inclusive: with bid_floor 37115.34, an offer of 37115.33 is rejected with ERR_OFFER_BELOW_BID_FLOOR (422) and 37115.34 exactly is accepted, so the failure is one cent wide."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a CERTIFIED tract, a PROSPECT interest and a CURRENT valuation filed by am-user-001 with bid_floor 37115.34 and max_bid 55340.34"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { e3t: $.data.id }
      - call: "POST /tracts/${e3t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e3t}/title-chain-entries"
        payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e3t}/title-chain-entries"
        payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
        as: TitleAnalyst
      - call: "POST /tracts/${e3t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
        as: TitleAnalyst
      - call: "POST /tracts/${e3t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
        as: DivisionOrderAdmin
        captures: { e3o: $.data.id }
      - call: "POST /mineral-interests"
        payload: { tract_id: "${e3t}", seller_owner_id: "${e3o}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
        captures: { e3i: $.data.id }
      - call: "POST /mineral-interests/${e3i}/valuations"
        payload: { current_monthly_net_revenue: 1200.00, annual_decline_rate: 0.18, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
        as_user_id: "am-user-001"
      trigger:
      - call: "POST /mineral-interests/${e3i}/offer-letters"
        payload: { offer_amount: 37115.33, expires_on: "2026-09-01" }
        as: AcquisitionManager
        as_user_id: "am-user-002"
        captures: { err: $.data.error_id }
      - call: "POST /mineral-interests/${e3i}/offer-letters"
        payload: { offer_amount: 37115.34, expires_on: "2026-09-01" }
        as: AcquisitionManager
        as_user_id: "am-user-002"
      assert:
      - "the valuation carries pdp_pv == 39589.70, undeveloped_pv == 19440.00, bid_floor == 37115.34 and max_bid == 55340.34"
      - "the 37115.33 offer returns HTTP 422 with data.error_id == ERR_OFFER_BELOW_BID_FLOOR and leaves interest_status == PROSPECT"
      - "the 37115.34 offer returns HTTP 201 with offer_status == SENT and current_amount == 37115.34"
      - "MineralInterest.${e3i}.interest_status == OFFERED only after the accepted offer"

  - name: recording_a_deed_twice_returns_deed_already_recorded
    claim_type: Triggerability
    grounds:
    - validations[priority=29]
    - errors[ERR_DEED_ALREADY_RECORDED]
    distinguishing_aspect: "Recording is single-shot: the second POST /psas/{id}/record-deed with a different book/page returns ERR_DEED_ALREADY_RECORDED (409) and the PSA keeps the first recorded_book_page 915/210, so the interest's acquiring_deed_book_page cannot be overwritten."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a FUNDED PSA with curative_status CURATIVE_CLOSED, adjusted_purchase_price 48000.00, whose deed has been recorded once"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { e4t: $.data.id }
      - call: "POST /tracts/${e4t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e4t}/title-chain-entries"
        payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e4t}/title-chain-entries"
        payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
        as: TitleAnalyst
      - call: "POST /tracts/${e4t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
        as: TitleAnalyst
      - call: "POST /tracts/${e4t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
        as: DivisionOrderAdmin
        captures: { e4o: $.data.id }
      - call: "POST /mineral-interests"
        payload: { tract_id: "${e4t}", seller_owner_id: "${e4o}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
        captures: { e4i: $.data.id }
      - call: "POST /mineral-interests/${e4i}/valuations"
        payload: { current_monthly_net_revenue: 1200.00, annual_decline_rate: 0.18, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
        as_user_id: "am-user-001"
      - call: "POST /mineral-interests/${e4i}/offer-letters"
        payload: { offer_amount: 48000.00, expires_on: "2026-09-01" }
        as: AcquisitionManager
        as_user_id: "am-user-002"
        captures: { e4f: $.data.id }
      - call: "POST /offer-letters/${e4f}/accept"
        payload: {}
        as: RoyaltyOwner
        as_user_id: "${e4o}"
      - call: "GET /mineral-interests/${e4i}"
        payload: {}
        as: AcquisitionManager
        captures: { e4iv: $.data.version }
      - call: "POST /psas"
        payload: { offer_letter_id: "${e4f}", effective_date: "2026-08-01", curative_days: 45, individual_defect_threshold: 2500.00, aggregate_defect_basket: 16000.00, expected_mineral_interest_version: "${e4iv}" }
        as: AcquisitionManager
        as_user_id: "am-user-002"
        captures: { e4p: $.data.id }
      - call: "POST /psas/${e4p}/close-curative"
        payload: {}
        as: AcquisitionManager
        as_user_id: "am-user-002"
      - call: "POST /psas/${e4p}/fund"
        payload: { wire_amount: 48000.00, wire_reference: "WIRE-E4" }
        as: AcquisitionManager
        as_user_id: "am-user-002"
      trigger:
      - call: "POST /psas/${e4p}/record-deed"
        payload: { recording_county: "Reeves", recorded_book_page: "915/210", recording_date: "2026-08-15" }
        as: TitleAnalyst
      - call: "POST /psas/${e4p}/record-deed"
        payload: { recording_county: "Reeves", recorded_book_page: "916/211", recording_date: "2026-08-16" }
        as: TitleAnalyst
        captures: { err: $.data.error_id }
      assert:
      - "the first recording returns HTTP 200 with psa_status == CLOSED and recorded_book_page == 915/210"
      - "MineralInterest.${e4i}.interest_status == ACQUIRED with acquiring_deed_book_page == 915/210"
      - "the second recording returns HTTP 409 with data.error_id == ERR_DEED_ALREADY_RECORDED"
      - "PurchaseSaleAgreement.${e4p}.recorded_book_page is still 915/210 and recording_date is still 2026-08-15"

  - name: writes_against_the_wrong_lifecycle_state_return_their_own_state_errors
    claim_type: Triggerability
    grounds:
    - validations[priority=23]
    - validations[priority=25]
    - validations[priority=26]
    - validations[priority=30]
    - errors[ERR_INTEREST_STATE_INVALID]
    - errors[ERR_OFFER_STATE_INVALID]
    - errors[ERR_CURATIVE_PERIOD_CLOSED]
    - errors[ERR_DEFECT_STATE_INVALID]
    distinguishing_aspect: "Four different from-set violations on one fixture return four different codes: submit-cure on a WAIVED defect gives ERR_DEFECT_STATE_INVALID, raising a defect after close-curative gives ERR_CURATIVE_PERIOD_CLOSED, a new offer letter on an UNDER_PSA interest gives ERR_INTEREST_STATE_INVALID, and re-accepting an ACCEPTED letter gives ERR_OFFER_STATE_INVALID."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "an EXECUTED PSA with curative_status CURATIVE_OPEN over an UNDER_PSA interest, carrying one WAIVED defect"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { e5t: $.data.id }
      - call: "POST /tracts/${e5t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e5t}/title-chain-entries"
        payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
        as: TitleAnalyst
      - call: "POST /tracts/${e5t}/title-chain-entries"
        payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
        as: TitleAnalyst
      - call: "POST /tracts/${e5t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
        as: TitleAnalyst
      - call: "POST /tracts/${e5t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
        as: DivisionOrderAdmin
        captures: { e5o: $.data.id }
      - call: "POST /mineral-interests"
        payload: { tract_id: "${e5t}", seller_owner_id: "${e5o}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
        captures: { e5i: $.data.id }
      - call: "POST /mineral-interests/${e5i}/valuations"
        payload: { current_monthly_net_revenue: 1200.00, annual_decline_rate: 0.18, undeveloped_net_acres: 20.0000 }
        as: AcquisitionManager
        as_user_id: "am-user-001"
      - call: "POST /mineral-interests/${e5i}/offer-letters"
        payload: { offer_amount: 48000.00, expires_on: "2026-09-01" }
        as: AcquisitionManager
        as_user_id: "am-user-002"
        captures: { e5f: $.data.id }
      - call: "POST /offer-letters/${e5f}/accept"
        payload: {}
        as: RoyaltyOwner
        as_user_id: "${e5o}"
      - call: "GET /mineral-interests/${e5i}"
        payload: {}
        as: AcquisitionManager
        captures: { e5iv: $.data.version }
      - call: "POST /psas"
        payload: { offer_letter_id: "${e5f}", effective_date: "2026-08-01", curative_days: 45, individual_defect_threshold: 2500.00, aggregate_defect_basket: 16000.00, expected_mineral_interest_version: "${e5iv}" }
