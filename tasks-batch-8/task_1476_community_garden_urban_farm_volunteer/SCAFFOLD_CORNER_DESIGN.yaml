          assert:
            - "err_patch == ERR_INVALID_HARVEST_STATE (PATCH allowed only while DRAFT)"
            - "st_rej == REJECTED and rej_reason == 'scale uncalibrated'"
            - "st_draft == DRAFT and draft_reason == null (resubmit clears the reason)"
            - "patched_w == 6000 (edit applied in DRAFT)"
            - "st_ver == VERIFIED after the second submit"

      - name: allocation_approve_distribute_finalizes_harvest_log
        claim_type: side_effect_execution
        grounds: [state_machines.DonationAllocation, state_machines.HarvestLog.VERIFIED_to_SPLIT_FINALIZED, entities.DonationRecipient.fields.committed_this_week_grams, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Full allocation lifecycle with SoD at both approval steps: the harvest logger cannot verify or approve (ERR_SEGREGATION_OF_DUTIES); approve books recipient weekly commitment; DISTRIBUTED cascades the log to SPLIT_FINALIZED (terminal)."
        test_recipe:
          setup: ["season HARVESTING; bed HARVEST_OPEN; certified logger V1; officer O; log VERIFIED (weight 10000, share 2000, donatable 8000); recipient R1 cap 100000"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "Officer", email: "o@x.com", date_of_birth: "1985-01-01" }, as: GardenAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/certifications", payload: { volunteer_id: "${v1_id}", cert_type: "PRODUCE_SAFETY", expires_at: "2027-08-01T00:00:00Z" }, as: FoodSafetyOfficer, as_user_id: "${o_id}" }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin, captures: { bed_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans", payload: { season_id: "${season_id}", bed_id: "${bed_id}", proposer_volunteer_id: "${v1_id}", crop_type: "Tomato", plant_family: "Solanaceae", requested_sq_ft: 60, planned_start_date: "2026-08-01", planned_end_date: "2026-09-01" }, as: GardenAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "APPROVED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "PLANTING" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "RESERVED" }, as: GardenAdmin }
            - { call: "POST /api/crop-plans/${plan_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/beds/${bed_id}/transition", payload: { to_state: "PLANTED" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "GROWING" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "HARVESTING" }, as: GardenAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T12:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/harvest-logs", payload: { season_id: "${season_id}", bed_id: "${bed_id}", logged_by_volunteer_id: "${v1_id}", crop_type: "Tomato", weight_grams: 10000, quality_grade: "A", harvested_at: "2026-09-15T10:00:00Z", safety_attestation: true }, as: Volunteer, as_user_id: "${v1_id}", captures: { log_id: $.data.id } }
            - { call: "POST /api/harvest-logs/${log_id}/transition", payload: { to_state: "SUBMITTED" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /api/donation-recipients", payload: { org_name: "Food Bank", contact_email: "fb@x.com", weekly_capacity_grams: 100000, priority_tier: 1 }, as: GardenAdmin, captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /api/harvest-logs/${log_id}/transition", payload: { to_state: "VERIFIED" }, as: FoodSafetyOfficer, as_user_id: "${v1_id}", captures: { err_sod_verify: $.data.error_id } }
            - { call: "POST /api/harvest-logs/${log_id}/transition", payload: { to_state: "VERIFIED" }, as: FoodSafetyOfficer, as_user_id: "${o_id}", captures: { st_ver: $.data.status } }
            - { call: "POST /api/donation-allocations", payload: { harvest_log_id: "${log_id}", lines: [ { recipient_id: "${r1_id}", grams: 8000 } ] }, as: GardenAdmin, captures: { alloc_id: $.data.id } }
            - { call: "POST /api/donation-allocations/${alloc_id}/transition", payload: { to_state: "APPROVED" }, as: FoodSafetyOfficer, as_user_id: "${v1_id}", captures: { err_sod_approve: $.data.error_id } }
            - { call: "POST /api/donation-allocations/${alloc_id}/transition", payload: { to_state: "APPROVED" }, as: FoodSafetyOfficer, as_user_id: "${o_id}", captures: { st_appr: $.data.status } }
            - { call: "GET /api/donation-recipients/${r1_id}", as: GardenAdmin, captures: { r1_committed: $.data.committed_this_week_grams } }
            - { call: "POST /api/donation-allocations/${alloc_id}/transition", payload: { to_state: "DISTRIBUTED" }, as: GardenAdmin, captures: { st_dist: $.data.status } }
            - { call: "GET /api/harvest-logs/${log_id}", as: GardenAdmin, captures: { log_st: $.data.status } }
          assert:
            - "err_sod_verify == ERR_SEGREGATION_OF_DUTIES (officer acting with the logger's identity)"
            - "st_ver == VERIFIED when a distinct officer verifies"
            - "err_sod_approve == ERR_SEGREGATION_OF_DUTIES (approver == logger)"
            - "st_appr == APPROVED and r1_committed == 8000 (commitment booked at approve)"
            - "st_dist == DISTRIBUTED and log_st == SPLIT_FINALIZED (cascade to terminal)"

      - name: terminal_entities_reject_all_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ToolItem, state_machines.ToolCheckout, state_machines.ShiftSignup, "errors[ERR_INVALID_TOOL_STATE]", "errors[ERR_INVALID_CHECKOUT_STATE]", "errors[ERR_INVALID_SIGNUP_STATE]"]
        distinguishing_aspect: "Terminal lockdown across three entity families: RETIRED tool rejects a second retire and new checkouts; RETURNED checkout rejects further transitions; CANCELLED signup rejects cancel."
        test_recipe:
          setup: ["tool M (3 units); checkout returned in full; signup cancelled"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin }
            - { call: "POST /api/tools", payload: { tool_name: "Hoe set", category: "HAND", total_count: 3 }, as: GardenAdmin, captures: { tool_id: $.data.id } }
            - { call: "POST /api/tool-checkouts", payload: { tool_id: "${tool_id}", volunteer_id: "${v1_id}", qty: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { co_id: $.data.id } }
            - { call: "POST /api/tool-checkouts/${co_id}/transition", payload: { to_state: "RETURNED", qty_returned: 1, condition_on_return: "GOOD" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /api/seasons", payload: { name: "2026 Summer", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2026-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2026-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/shift-signups/${s_id}/cancel", as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /api/tools/${tool_id}/retire", as: GardenAdmin, captures: { tool_st: $.data.status } }
            - { call: "POST /api/tools/${tool_id}/retire", as: GardenAdmin, captures: { err_retire2: $.data.error_id } }
            - { call: "POST /api/tool-checkouts", payload: { tool_id: "${tool_id}", volunteer_id: "${v1_id}", qty: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { err_co_retired: $.data.error_id } }
            - { call: "POST /api/tool-checkouts/${co_id}/transition", payload: { to_state: "CLOSED_LOSS" }, as: GardenAdmin, captures: { err_co_term: $.data.error_id } }
            - { call: "POST /api/shift-signups/${s_id}/cancel", as: Volunteer, as_user_id: "${v1_id}", captures: { err_signup_term: $.data.error_id } }
          assert:
            - "tool_st == RETIRED (first retire succeeds with zero checked out)"
            - "err_retire2 == ERR_INVALID_TOOL_STATE (terminal)"
            - "err_co_retired == ERR_INVALID_TOOL_STATE (checkout against RETIRED tool)"
            - "err_co_term == ERR_INVALID_CHECKOUT_STATE (RETURNED is terminal)"
            - "err_signup_term == ERR_INVALID_SIGNUP_STATE (CANCELLED is terminal)"

      - name: waiver_expiry_blocks_signup_until_renewed
        claim_type: temporal_validation
        grounds: [state_machines.Volunteer, "errors[ERR_WAIVER_REQUIRED]", entities.Volunteer.fields.waiver_signed_at]
        distinguishing_aspect: "Waiver validity is a 365-day rolling window from waiver_signed_at evaluated by the scheduler epoch: at +366 days the status flips SIGNED -> EXPIRED and blocks signup; re-signing (EXPIRED -> SIGNED cyclic edge) restores eligibility."
        test_recipe:
          setup: ["V1 oriented; waiver signed at 2026-08-01; slot 2027-08-20 09:00-12:00 OPEN (season spans into 2027)"]
          setup_api_calls:
            - { call: "POST /api/volunteers", payload: { full_name: "V One", email: "v1@x.com", date_of_birth: "1990-05-20" }, as: GardenAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /api/volunteers/${v1_id}/orientation/complete", as: GardenAdmin }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: GardenAdmin, captures: { w0: $.data.waiver_status } }
            - { call: "POST /api/seasons", payload: { name: "2026-27 Extended", signup_opens_at: "2026-07-01T00:00:00Z", signup_closes_at: "2027-08-10T00:00:00Z", season_starts_at: "2026-08-01T00:00:00Z", season_ends_at: "2027-11-30T00:00:00Z", water_budget_gallons: 1000 }, as: GardenAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/beds", payload: { bed_code: "B-01", size_sq_ft: 100, sun_exposure: "FULL", irrigation_zone: "Z1" }, as: GardenAdmin }
            - { call: "POST /api/seasons/${season_id}/transition", payload: { to_state: "OPEN_ENROLLMENT" }, as: GardenAdmin }
            - { call: "POST /api/shift-slots", payload: { season_id: "${season_id}", task_type: "WEEDING", starts_at: "2027-08-20T09:00:00Z", ends_at: "2027-08-20T12:00:00Z", capacity_total: 3, capacity_youth: 1 }, as: GardenAdmin, captures: { slot_id: $.data.id } }
            - { call: "POST /api/shift-slots/${slot_id}/transition", payload: { to_state: "OPEN" }, as: GardenAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-08-05T00:00:00Z" }, as: GardenAdmin }
            - { call: "POST /api/_scheduler/run_epoch", as: GardenAdmin }
          trigger:
            - { call: "GET /api/volunteers/${v1_id}", as: GardenAdmin, captures: { w1: $.data.waiver_status } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err_waiver: $.data.error_id } }
            - { call: "POST /api/volunteers/${v1_id}/waiver/sign", as: Volunteer, as_user_id: "${v1_id}", captures: { w2: $.data.waiver_status } }
            - { call: "POST /api/shift-signups", payload: { slot_id: "${slot_id}", volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { s_st: $.data.status } }
          assert:
            - "w0 == SIGNED at 2026-08-01"
            - "w1 == EXPIRED after epoch at 2027-08-05 (signed_at + 365d passed)"
            - "err_waiver == ERR_WAIVER_REQUIRED"
            - "w2 == SIGNED (EXPIRED -> SIGNED renewal edge) and s_st == REQUESTED"
