      - name: balance_index_rounds_to_four_decimals_half_up
        claim_type: Precision
        grounds:
          - calculations.domicile_balance_index
          - entities.Domicile.balance_index
          - entities.Domicile.assigned_driver_count
        distinguishing_aspect: "With driver_headcount_target 7, five ACTIVE drivers give 5/7 = 0.714285... which must be reported as 0.7143 (half-up at the 4th decimal, not the truncated 0.7142); terminating one gives 4/7 = 0.571428... which rounds DOWN to 0.5714, so the same fixture pins both rounding directions."
        test_recipe:
          setup:
            - "Domicile DOM-C5 has driver_headcount_target 7 and no drivers."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-C5", region_code: "WEST", tractor_capacity: 12, driver_headcount_target: 7, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id, d0_count: $.data.assigned_driver_count, d0_index: $.data.balance_index }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C5A", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-01-01" }
              as: TransportManager
              captures: { d_a: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C5B", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-02-01" }
              as: TransportManager
              captures: { d_b: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C5C", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { d_c: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C5D", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-04-01" }
              as: TransportManager
              captures: { d_d: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C5E", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-05-01" }
              as: TransportManager
              captures: { d_e: $.data.id }
          trigger:
            - call: "GET /fleet/domiciles/${dom_id}"
              payload: {}
              as: TransportManager
              captures: { d5_count: $.data.assigned_driver_count, d5_index: $.data.balance_index }
            - call: "POST /fleet/drivers/${d_e}/termination"
              payload: { termination_reason: "VOLUNTARY" }
              as: TransportManager
              captures: { term_status: $.data.status }
            - call: "GET /fleet/domiciles/${dom_id}"
              payload: {}
              as: TransportManager
              captures: { d4_count: $.data.assigned_driver_count, d4_index: $.data.balance_index }
          assert:
            - "${d0_count} == 0 and ${d0_index} == 0.0 on an empty domicile - no division by the target is attempted against an empty numerator"
            - "${d5_count} == 5 and ${d5_index} == 0.7143 - round_half_up at 4 decimals, NOT the truncated 0.7142"
            - "${term_status} == TERMINATED"
            - "${d4_count} == 4 and ${d4_index} == 0.5714 - the same rounding mode rounds this ratio down, and the TERMINATED driver left the numerator immediately"

      - name: short_count_completion_rewrites_the_trip_totals_but_not_the_store_ledger
        claim_type: Input Set Filtering
        grounds:
          - state_machines[TripStop].transitions[ARRIVED->COMPLETED].side_effects
          - state_machines[ReplenishmentOrder].transitions[SCHEDULED->DELIVERED].side_effects
          - calculations.trip_plan_totals
        distinguishing_aspect: "Completing a 600-case stop with cases_handled 300 rewrites the stop's cases and service_minutes and re-derives the trip totals, but the store ledger moves by the ORDER's 600 cases, not the stop's 300: Trip.delivered_cases reads 300 while Store.delivered_cases_total reads 600 and open_scheduled_cases returns to 0."
        test_recipe:
          setup:
            - "TRIP-C6A is dispatched with a single DELIVERY stop of 600 cases at S-4006 (rate 600/h): service 75, drive 120, duty 195."
