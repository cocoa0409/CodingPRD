  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: cutting_test_reject_revise_cycle_exhausts_revision_budget
        grounds:
          - state_machines.CuttingTest.SUBMITTED_to_REJECTED
          - state_machines.CuttingTest.REJECTED_to_DRAFT
          - state_machines.CuttingTest.DRAFT_to_SUBMITTED
          - entities.CuttingTest.fields.revision_count
          - validations[priority=30]
          - calculations.cutting_test_yield_metrics
        distinguishing_aspect: |
          CuttingTest is the cyclic machine here: DRAFT -> SUBMITTED -> REJECTED -> DRAFT is
          traversed twice on the SAME row and the third REVISE is refused with
          ERR_REVISION_LIMIT_REACHED because revision_count has reached REVISION_LIMIT 2 — the
          loop is bounded by a counter, not by a state; the sibling instance is CasePlan's
          two-dimension parallel machine, a different entity and a different non-linearity.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "PrimalPurchase P1 RECEIVED (net_weight_lb 98.50); CuttingTest T1 on P1 is SUBMITTED with all four lines and revision_count 0."
            - "T1 was submitted by user cutter-01, so any APPROVE/REJECT must come from a different user id (segregation of duties)."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 12.0, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_TRIM_EXTRA_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 6.5, market_value_per_lb_cents: 520, lean_pct: 92.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 4, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
          trigger:
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REJECT", rejection_reason: "seq 3 lean reading not witnessed" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REVISE" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REJECT", rejection_reason: "scale tare not logged" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REVISE" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REJECT", rejection_reason: "third pass still unwitnessed" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "REVISE" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { revise_err: $.data.error_id }
          assert:
            - "After the first REVISE: CuttingTest.${t1_id}.status == DRAFT and CuttingTest.${t1_id}.revision_count == 1"
            - "After the second REVISE: CuttingTest.${t1_id}.status == DRAFT and CuttingTest.${t1_id}.revision_count == 2"
            - "${revise_err} == ERR_REVISION_LIMIT_REACHED with HTTP 422 on the third REVISE"
            - "CuttingTest.${t1_id}.status == REJECTED after the refused third REVISE (no state change)"
            - "CuttingTest.${t1_id}.revision_count == 2 (unchanged; the counter is not incremented by the refused call)"
            - "CuttingTest.${t1_id}.rejection_reason == 'third pass still unwitnessed'"
            - "CuttingTest.${t1_id}.unaccounted_lb == 0.00 and CuttingTest.${t1_id}.salable_yield_pct == 0.6294 across every cycle (the lines never changed)"
            - "PrimalPurchase.${p1_id}.status == RECEIVED and PrimalPurchase.${p1_id}.allocated_cost_cents == 0 (a rejected test never allocates)"

