            - "GET /api/tenants/${t_id}/credit-summary .data.on_time_rate_as_paid_pct == null"
            - "GET /api/tenants/${t_id}/credit-summary .data.total_payments == 0"
            - "GET /api/tenants/${t_id}/credit-summary .data.effective_reported_items == 0"

