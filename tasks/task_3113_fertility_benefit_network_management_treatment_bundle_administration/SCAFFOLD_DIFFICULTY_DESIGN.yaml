              payload: { employer_account_id: "${e16}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 6, max_cycles_per_year: 6, max_transfers_per_cycle: 2, pharmacy_pool_cents: 1000000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b16: $.data.id }
            - call: "POST /bundle-entitlements/${b16}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A16", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv16: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${e16}", external_ref: "M22", full_name: "M22", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m22: $.data.id }
            - call: "POST /members/${m22}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m22}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv16}"
            - call: "POST /clinics"
              payload: { legal_name: "C16", npi: "1000000016", state_code: "TX", network_tier: "PREFERRED", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { c16: $.data.id }
            - call: "POST /clinics/${c16}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1450000 } }
