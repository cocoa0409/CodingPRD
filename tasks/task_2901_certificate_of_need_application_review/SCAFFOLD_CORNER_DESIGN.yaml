              payload: { certificate_id: "${cert_id}", period_end_date: "2026-12-31", disbursed_cents: 1000000000, obligated_cents: 0, physical_completion_pct: 20.00, expected_certificate_version: "${cert_v1}" }
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "GET /certificates/${cert_id}"
              as: DecisionOfficer
              as_user_id: "officer-1"
              captures: { cert_v2: $.data.version, status_at_limit: $.data.expenditure_status, life_at_limit: $.data.lifecycle_status }
            - call: "POST /progress-reports"
              payload: { certificate_id: "${cert_id}", period_end_date: "2027-03-31", disbursed_cents: 50000000, obligated_cents: 0, physical_completion_pct: 30.00, expected_certificate_version: "${cert_v2}" }
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "GET /certificates/${cert_id}"
              as: DecisionOfficer
              as_user_id: "officer-1"
              captures: { cert_v3: $.data.version, status_at_ceiling: $.data.expenditure_status, life_at_ceiling: $.data.lifecycle_status }
          trigger:
            - call: "POST /progress-reports"
              payload: { certificate_id: "${cert_id}", period_end_date: "2027-06-30", disbursed_cents: 1, obligated_cents: 0, physical_completion_pct: 40.00, expected_certificate_version: "${cert_v3}" }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { report_3_id: $.data.id }
          assert:
            - "${ceiling} == 1050000000"
            - "${status_at_limit} == WITHIN_LIMIT and ${life_at_limit} == ISSUED (cumulative 1000000000 is exactly the limit)"
            - "${status_at_ceiling} == OVER_LIMIT_PENDING_AMENDMENT and ${life_at_ceiling} == ISSUED (cumulative 1050000000 is exactly the ceiling; the lifecycle axis did not move)"
            - "HTTP status == 201 and ProgressReport.${report_3_id}.status == ACCEPTED"
            - "Certificate.${cert_id}.cumulative_expenditure_cash_cents == 1050000001 and expenditure_status == LIMIT_BREACHED"
            - "Certificate.${cert_id}.lifecycle_status == SUSPENDED and lifecycle_status_before_suspension == ISSUED"
            - "Certificate.${cert_id}.latest_completion_pct == 40.00"
            - "Applicant.${appl_a_id}.compliance_strike_count == 1 and standing == GOOD (one strike does not restrict standing)"

      - name: cascading_side_effects_layer_covered_by_difficulty_instances
        claim_type: cascading_side_effects
        grounds:
          - complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_reversed_depth_five_vacate_cascade
          rationale: "The depth-five appeal-reversal chain and the depth-three progress-report breach chain (transitive_cascade / progress_report_breach_depth_three_suspension_strike_cascade) verify this layer end-to-end, including ordering sensitivity between links."

      - name: dual_variant_calculation_layer_covered_by_difficulty_instances
        claim_type: dual_variant_calculation
        grounds:
          - complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / certificate_expenditure_cash_vs_accrual_same_reports
          rationale: "Variant divergence on identical rows is asserted for expenditure basis by the named instance and for review threshold basis by dual_variant_calc / loi_threshold_project_basis_vs_aggregated_same_row_data."

  # ===========================================================================
  # §0 consistency_model is `immediate`: every derived field written by a request
  # is already correct in that request's own response body.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: comparative_decision_response_already_carries_the_drained_need_pool
        claim_type: immediate_visibility
        grounds:
          - consistency_model[immediate]
          - endpoints[POST /batching-cycles/{id}/comparative-decision]
          - calculations.need_allocation_waterfall
        distinguishing_aspect: "The decision endpoint returns BatchingCycle, and that single response already shows status DECIDED with unallocated_bed_need drained from 19 to 7 by the award it just made — no follow-up read is needed for the denormalized pool, and a follow-up read agrees exactly."
        test_recipe:
          setup:
            - "Cycle 1 is in COMPARATIVE_REVIEW with unmet_bed_need_at_open 19 and one fully scored candidate requesting 12 beds."
            - "The clock is 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id }
            - call: "POST /letters-of-intent"
              payload: { applicant_id: "${appl_a_id}", hsa_id: "${hsa_id}", batching_cycle_id: "${cycle_id}", service_type: "ACUTE_CARE_BEDS", project_description: "12-bed acute care expansion", capital_cost_cents: 800000000, bed_delta: 12 }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { loi_a_id: $.data.id }
            - call: "POST /applications"
              payload: { loi_id: "${loi_a_id}", requested_bed_count: 12, projected_capital_cost_cents: 800000000, narrative: "Northside 12-bed acute care application" }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "OPEN_FOR_APPLICATIONS" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
              captures: { pool_at_open: $.data.unmet_bed_need_at_open, unallocated_at_open: $.data.unallocated_bed_need }
            - call: "POST /applications/${app_a_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${appl_a_id}"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPLETENESS_WINDOW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /applications/${app_a_id}/deem-complete"
              payload: {}
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "POST /batching-cycles/${cycle_id}/advance"
              payload: { to_status: "COMPARATIVE_REVIEW" }
              as: IntakeAnalyst
              as_user_id: "intake-1"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-1"
              captures: { v_a1: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 88, financial_feasibility_score: 75, cost_containment_score: 70, access_underserved_score: 90, quality_record_score: 60, expected_application_version: "${v_a1}" }
              as: ReviewAnalyst
              as_user_id: "rev-1"
            - call: "GET /applications/${app_a_id}"
              as: ReviewAnalyst
              as_user_id: "rev-2"
              captures: { v_a2: $.data.version }
            - call: "POST /score-sheets"
              payload: { application_id: "${app_a_id}", need_conformity_score: 91, financial_feasibility_score: 80, cost_containment_score: 65, access_underserved_score: 85, quality_record_score: 62, expected_application_version: "${v_a2}" }
              as: ReviewAnalyst
              as_user_id: "rev-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /batching-cycles/${cycle_id}/comparative-decision"
              payload: { decision_note: "Sole reviewable application; partial pool retained" }
              as: DecisionOfficer
              as_user_id: "officer-1"
              captures: { cycle_status_in_response: $.data.status, unallocated_in_response: $.data.unallocated_bed_need, reopened_in_response: $.data.reopened_count }
          assert:
            - "${pool_at_open} == 19 and ${unallocated_at_open} == 19"
            - "HTTP status == 200"
            - "${cycle_status_in_response} == DECIDED"
            - "${unallocated_in_response} == 7 — the award is already reflected in the same response body"
            - "${reopened_in_response} == 0 (a first-pass decision, not a remand re-run)"
            - "an immediately following GET /batching-cycles/${cycle_id} returns the identical status DECIDED and unallocated_bed_need 7"
            - "an immediately following GET /applications/${app_a_id} returns status APPROVED, allocated_bed_count 12, comparative_score 79.40, decision_at 2026-09-10T00:00:00Z and appeal_window_closes_at 2026-10-10T00:00:00Z"
            - "HealthServiceArea.${hsa_id}.approved_unimplemented_beds is still 0, because that ledger moves only on certificate issuance"
