              as: ClientOps
              as_user_id: "${cf2_cl}"
              captures: { cf2_iba: $.data.id }
            - { call: "POST /import-batches/${cf2_iba}/commit", as: ClientOps, as_user_id: "${cf2_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${cf2_pla}", period: "2026-05" }
              as: WarehouseOps
              captures: { cf2_rna: $.data.id }
            - { call: "POST /assembly-runs/${cf2_rna}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${cf2_rna}/start-kitting", as: WarehouseOps }
