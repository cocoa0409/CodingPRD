  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_rejected_when_voucher_expired
        grounds:
          - state_machines.Voucher.ISSUED_to_EXPIRED
          - "validations[priority=27]"
        distinguishing_aspect: |
          Entity pair Booking -> Voucher: a booking whose voucher has flipped to
          EXPIRED (ops-run at a clock past expires_at) is rejected with
          ERR_VOUCHER_NOT_ISSUABLE even though the booking interval itself
          precedes the expiry timestamp (temporal rule passes; state rule fires).
        test_recipe:
          setup:
            - "Caregiver ACTIVE; provider ACTIVE with window 2026-07-01..2026-08-15 capacity 1; voucher 10.00h issued at 2026-05-01 (expires_at 2026-07-30T00:00:00Z); clock advanced to 2026-07-30T00:00:01Z and a STANDARD ops-run flipped the voucher to EXPIRED"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
