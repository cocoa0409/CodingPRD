              as_user_id: "admin-2"
          assert:
            - "first response HTTP status is 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "after the denial: EnforcementCase.${case_id}.case_status == NOTICE_ISSUED, penalty_status == NONE, penalty_cents == 0 and adjudicated_by_user_id == null"
            - "second response HTTP status is 201 with case_status == ADJUDICATED_UPHELD and adjudicated_by_user_id == admin-2"
            - "second response: penalty_variant == STATUTORY_SCHEDULE, aggravation_multiplier == 1.00 and penalty_cents == 19320"
            - "EnforcementCase.${case_id}.notice_issued_by_user_id == admin-1, so notice and adjudication are held by different user ids"
            - "Manufacturer.${mfr_id}.outstanding_penalty_cents == 19320, total_assessed_penalty_cents == 19320, upheld_case_count == 1 and standing == GOOD"

      - name: segregation_of_duties_vacate_must_differ_from_the_adjudicator
        claim_type: Segregation of duties
        grounds:
