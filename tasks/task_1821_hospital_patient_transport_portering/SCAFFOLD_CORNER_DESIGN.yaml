        claim_type: rbac_denial
        grounds: [roles.TransportDispatcher, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "SUPERSEDE is a dispatcher-exclusive action even though clinicians share the close endpoint for CANCEL."
        test_recipe:
          setup: ["R1 (PX, W4->IMG) QUEUED; R2 (PX, W4->W5) QUEUED — valid duplicate pair"]
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "W4", name: "Ward 4", location_type: "WARD", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_a: $.data.id } }
