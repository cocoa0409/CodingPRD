            - { call: "POST /perioperative/supply-items", payload: { sku: "WRAP-LT", name: "Wrap lt", unit_cost_cents: 799, substitute_group: "WRAP", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_w7: "$.data.id" } }
            - { call: "POST /perioperative/supply-items", payload: { sku: "GEL-PK", name: "Gel pack", unit_cost_cents: 201, substitute_group: "GEL", initial_on_hand: 50 }, as: SupplyChainAnalyst, captures: { item_g: "$.data.id" } }
            - { call: "POST /perioperative/preference-cards", payload: { surgeon_id: "${s_id}", procedure_name: "FUSION-A" }, as: SupplyChainAnalyst, captures: { card_8: "$.data.id" } }
