            - "GET /dh/claims/${claim_id}/claim-lines returns 3 rows (BASE_VISIT, IV_DRUG, DIAGNOSTIC)"

      - name: acuity_score_combinatorial_inputs_with_state_branches
        grounds:
          - calculations.acuity_score
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          nested clamp(), conditional branches on bp range, multiplicative
          red-flag accumulation, and tiered age/comorbidity points. The same
          vital set produces different bands when comorbidity_count crosses
          thresholds; combinatorial across {vitals, age, comorbidity, red-flag}.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T10:00:00Z."
            - "Active market; three patients with different (age, comorbidity_count, vitals) chosen to cross thresholds."
            - "P1: dob=1950-01-01 (age 76 -> 10 pts), comorbidity_count=5 (capped at 15 pts), HR=110 (7 pts), SBP=100 (bp <90? no, |100-120|/5=4 -> 4 pts), SpO2=93 ((95-93)*2=4 pts) — total 10+15+7+4+4 = 40 -> STANDARD."
            - "P2: same vitals but is_chest_pain=true (20 pts) — total 60 -> URGENT by score, but red-flag overrides to EMERGENT anyway."
            - "P3: dob=1990-01-01 (age 36), comorbidity_count=0, HR=80 (0), SBP=120 (0), SpO2=99 (0), no flags — total 0 -> NON_ACUTE."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-NORTH", display_name: "Dallas Fort Worth North", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "P1 Elderly", date_of_birth: "1950-01-01", payer_code: "AETNA", member_id: "M401", pcp_name: "Dr. X", pcp_npi: "1111111111", comorbidity_count: 5, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { p1_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "P2 Elderly Chest", date_of_birth: "1950-01-01", payer_code: "AETNA", member_id: "M402", pcp_name: "Dr. X", pcp_npi: "1111111111", comorbidity_count: 5, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { p2_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "P3 Young Healthy", date_of_birth: "1990-01-01", payer_code: "AETNA", member_id: "M403", pcp_name: "Dr. Y", pcp_npi: "2222222222", comorbidity_count: 0, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { p3_id: $.data.id }
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${p1_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "weakness" }
              as: TriageNurse
