      - name: error_stale_fund_version
        claim_type: "Violation → Error"
        grounds: ["errors[ERR_STALE_FUND_VERSION]", "concurrency_rules[award-commit-stale-fund]"]
        distinguishing_aspect: "Awarding with an expected_fund_version older than the fund's current version (after a prior award bumped it) -> ERR_STALE_FUND_VERSION (412); the OCC stale-version conflict on ScholarshipFund."
        test_recipe:
          setup:
            - "Fund AWARDING with two distinct SCORED applications app1, app2; endowment ample (5000000)."
            - "Client captured fund version BEFORE awarding app1; app1 award bumps fund.version; the captured (now stale) version is reused on app2's award."
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "OCC Fund", endowment_cents: 5000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 1000000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "O1", email: "o1@x.edu", self_reported_gpa: 3.5, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { ap1: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "O2", email: "o2@x.edu", self_reported_gpa: 3.5, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { ap2: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${ap1}", requested_amount_cents: 500000 }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${ap2}", requested_amount_cents: 500000 }
              as: Applicant
              as_user_id: "${ap2}"
              captures: { app2: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app1}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${ap1}"
            - call: "POST /transcripts"
              payload: { application_id: "${app1}", document_uri: "s3://t", verified_gpa: 3.50 }
              as: Applicant
              as_user_id: "${ap1}"
            - call: "POST /recommendations"
              payload: { application_id: "${app2}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${ap2}"
            - call: "POST /transcripts"
              payload: { application_id: "${app2}", document_uri: "s3://t", verified_gpa: 3.50 }
              as: Applicant
              as_user_id: "${ap2}"
            - call: "POST /committee-members"
              payload: { full_name: "RA", email: "ra@x.edu", expertise_field: "CS" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "RB", email: "rb@x.edu", expertise_field: "CS" }
              as: CommitteeMember
              captures: { mem_b: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app1}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app1}", committee_member_id: "${mem_b}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app2}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /committee-assignments"
              payload: { application_id: "${app2}", committee_member_id: "${mem_b}" }
              as: FoundationAdmin
            - call: "POST /applications/${app1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap1}"
            - call: "POST /applications/${app2}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap2}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applications/${app1}/start-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applications/${app2}/start-review"
              payload: {}
              as: FoundationAdmin
            - call: "POST /rubric-scores"
              payload: { application_id: "${app1}", committee_member_id: "${mem_a}", academic_score: 95, need_score: 90, essay_score: 85 }
              as: CommitteeMember
              as_user_id: "${mem_a}"
              captures: { s1a: $.data.id }
            - call: "POST /rubric-scores"
              payload: { application_id: "${app1}", committee_member_id: "${mem_b}", academic_score: 95, need_score: 90, essay_score: 85 }
              as: CommitteeMember
