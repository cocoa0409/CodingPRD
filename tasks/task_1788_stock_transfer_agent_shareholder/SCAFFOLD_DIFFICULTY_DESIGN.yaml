              as: AgentAdmin
              captures: { c2: $.data.id }
            - call: "POST /accounts/${c2}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 1 }
              as: AgentAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-01T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /escheatment/scan"
              payload: {}
              as: AgentAdmin
              captures: { dormant_n: $.data.accounts_marked_dormant }
