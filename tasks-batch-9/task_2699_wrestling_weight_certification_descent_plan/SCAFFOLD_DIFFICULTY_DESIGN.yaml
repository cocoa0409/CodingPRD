            - call: "POST /events/${event_id}/weigh-ins"
              payload: { entry_id: "${entry_a}", day_index: 0, recorded_weight_lbs: 147.5 }
              as: WeighInOfficial
              captures: { wi_deficit: $.data.id }
            - call: "GET /teams/${team_id}"
              payload: {}
              as: StateOffice
              captures: { total_peak: $.data.open_flag_severity_total, posture_peak: $.data.compliance_status }
            - call: "GET /health-flags?wrestler_id=${wrestler_a}&source=WEIGH_IN_DEFICIT"
              payload: {}
              as: MedicalReviewer
              captures: { deficit_flag: "$.data[0].id" }
            - call: "POST /health-flags/${deficit_flag}/review"
              payload: { outcome: "DISMISSED", review_note: "Scale calibration error confirmed; deficit flag dismissed." }
              as: MedicalReviewer
          assert:
            - "${total_before} == 1 and ${posture_before} == 'WATCH'"
            - "WeighIn.${wi_deficit}.result == PASS (147.5 <= class 150, so the allowance is never consulted) but below_minimum == true (147.5 < 147.6) — the flag is raised by the health rule, not by the weigh-in verdict"
            - "${total_peak} == 5 and ${posture_peak} == 'PROBATION' (1 + severity 4)"
            - "immediately after the weigh-in, Wrestler.${wrestler_a}.eligibility_status == RESTRICTED while certification_status == CERTIFIED"
            - "after the dismissal: HealthFlag.${deficit_flag}.status == DISMISSED with reviewer_user_id set"
            - "after the dismissal: Team.${team_id}.open_flag_severity_total == 1 exactly — the pre-raise value, neither 0 nor 5"
            - "after the dismissal: Team.${team_id}.compliance_status == WATCH and Wrestler.${wrestler_a}.eligibility_status == ELIGIBLE"
            - "the HYDRATION_FAIL flag is still OPEN with severity 1, and GET /health-flags?wrestler_id=${wrestler_a}&status=OPEN returns exactly 1 row"
            - "Wrestler.${wrestler_a}.certification_status == CERTIFIED and TournamentEntry.${entry_a}.status == WEIGHED_IN throughout"

      - name: certified_wrestler_population_counter_restored_by_supersede
        conserved_quantity: "Season.certified_wrestler_count == COUNT(Wrestler where certification_status == CERTIFIED) — a cardinality counter over a state predicate, not a weighted sum"
        grounds:
          - entities.Season.fields.certified_wrestler_count
          - state_machines.DescentPlan.CERTIFIED_to_CANCELLED
          - state_machines.Wrestler.CERTIFIED_to_PROVISIONAL
          - state_machines.Wrestler.PROVISIONAL_to_CERTIFIED
          - endpoints.POST_/descent-plans/{id}/certify
        distinguishing_aspect: |
          A different KIND of conserved quantity — an integer population count derived from a state
          predicate rather than a weighted severity sum — and it is restored by a FORWARD action
          (certifying the replacement plan) instead of by an undo/review action. Superseding drops the
          counter to 0 and demotes the wrestler to PROVISIONAL / INELIGIBLE; certifying the successor
          returns it to exactly 1 with the successor, not the cancelled plan, as the governing plan.
          Double-counting or a forgotten decrement both surface immediately.
        test_recipe:
          setup:
            - "One OPEN Season; Alex Mercer CERTIFIED / ELIGIBLE on plan P1 (WEEKLY_STEP, target 150, start 2026-11-02) in status CERTIFIED."
            - "Season.certified_wrestler_count is 1 and Team.compliance_status is CLEAR."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
