            - "The 11:00 TELEHEALTH booking returned 201 and Encounter.${enc_after}.scheduling_status == SCHEDULED"
            - "Exactly three Encounter rows exist for practitioner ${nd_id}"

      - name: membership_cycles_are_closed_so_touching_cycles_collide
        grounds:
          - validations[priority=22]
          - errors[ERR_MEMBERSHIP_CYCLE_OVERLAP]
          - entities.Membership.fields.cycle_start_date
          - entities.Membership.fields.cycle_end_date
        distinguishing_aspect: |
          Interval semantics on a different resource (the Patient's membership timeline)
          with the OPPOSITE geometry to practitioner occupancy: the cycle interval is
          CLOSED, so a new cycle starting exactly on the existing cycle_end_date of
          2026-05-30 collides, while one starting 2026-05-31 does not.
        test_recipe:
          setup:
            - "One OR patient holding a FOUNDATION membership opened 2026-05-01, whose cycle_end_date is 2026-05-30"
          setup_api_calls:
            - call: "POST /practitioners"
