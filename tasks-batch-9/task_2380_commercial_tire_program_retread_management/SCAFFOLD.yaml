    roles: [DealerAdmin, FleetManager, TireTechnician, CasingInspector, PlantScheduler, ComplianceOfficer]
    code: 200
    input: ["fleet_account_id?", "collected_at_location_id?", "scrap_manifest_id?", "status?", "intended_position?", "inspection_grade?", "limit?", "offset?"]
    output: Casing[]
    side_effects: []

