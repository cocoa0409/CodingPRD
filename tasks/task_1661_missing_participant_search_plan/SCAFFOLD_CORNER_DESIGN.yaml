      - name: withholding_floor_boundary
        claim_type: correct_result
        grounds: ["calculations.net_payout_withholding", "entities.Payout.fields.withholding_cents"]
        distinguishing_aspect: "The 20000-cent withholding floor is inclusive: gross 19999 withholds 0 (net 19999) while gross 20000 withholds exactly 4000 (net 16000) — a one-cent gross difference flips the branch."
        test_recipe:
          setup:
            - "Case in DISTRIBUTION_IN_PROGRESS with participants LO 19999 and HI 20000, vested 100%, each with an accepted LUMP_SUM_CHECK election."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Floor Co 401k", sponsor_ein: "123456789", plan_number: "130", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_fl: "$.data.id", c_fl_v: "$.data.version" } }
