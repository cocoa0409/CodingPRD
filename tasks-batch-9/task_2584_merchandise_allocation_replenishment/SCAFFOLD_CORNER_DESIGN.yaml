              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run2_id}", store_id: "${s2_id}" }
              as: Allocator
              captures: { l2_id: "$.data[0].id" }
          assert:
            - "AllocationLine.${l1_id}.units_proposed == 16 (need-capped, pool 16) and size_breakdown == [{S:3},{M:6},{L:5},{XL:1},{XXL:1}]"
            - "The floors are FLOOR(16 x 1900/10000) = 3, FLOOR(5.28) = 5, FLOOR(4.64) = 4, FLOOR(1.92) = 1 and FLOOR(1.12) = 1, summing to 14, so the 2-unit remainder goes to M (3300bp) then L (2900bp) by share_bp DESC"
            - "sum(size_breakdown.units) == 16 == units_proposed exactly"
            - "The split ignores Receipt.${r1_id}.size_received entirely: the receipt is 16 units of M, yet only 6 units of M are allotted and 3 units of S are promised - the DC substitutes at pick time"
            - "The two NON-CORE sizes XL and XXL each receive a unit even though they can never contribute to broken_size_count - core-ness governs assortment health, not the split"
            - "AllocationLine.${l2_id}.units_proposed == 10 and size_breakdown == [{S:3},{M:4},{L:2},{XL:1}]"
            - "On the tied curve the floors are 3 / 3 / 2 / 1 = 9 and the single remainder unit goes to M, not S: share_bp ties at 3000 and the secondary key is size_code ASC, where M precedes S"
            - "Neither line has capacity_capped_units above 0, so the breakdowns are of the full need in both cases"
      - name: consolidation_target_eligibility_filter_runs_before_the_ranking
        claim_type: correct_result
        grounds:
          - calculations.assortment_remedy_selection
          - entities.AssortmentAction.fields.action_type
          - entities.AssortmentAction.fields.consolidation_target_store_id
          - endpoints.POST /allocation/_run-assortment-detection
        distinguishing_aspect: |
          Six candidate stores hold a COMPLETE position of the broken item and the winner is the FIFTH best
          on the headline metric, because the eligibility filter runs first: the 9500-sell-through store is
          REMODEL and the 9000 store has only 2 units of shelf headroom against the 4 units that must move.
          That leaves four stores tied at 8000, so grade rank picks the two grade-A doors over the C and the
          D, and store_code ASC separates 0105 from 0106. The second item in the same sweep supplies the
          other branch of the same calculation: its source position is empty, so the candidate set is emptied
          by fiat regardless of the perfectly good target that exists, and the remedy falls back to
          MARKDOWN.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with seven stores; sell-through: 0101 6500, 0102 9000, 0103 8000, 0104 8000, 0105 8000, 0106 8000, 0107 9500"
            - "Shelf plans: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, and 0103-0107 capacity 20 / pmin 6"
            - "SKU-1001 positions: 0101 holds 4 units (M 3 / L 1) so S and XL are out -> BROKEN with available 4; 0102 holds 22 units -> COMPLETE but headroom 24 - 22 = 2; 0103, 0104, 0105, 0106 and 0107 each hold 8 units -> COMPLETE with headroom 12"
            - "Store 0107 was then moved to REMODEL, so it is still scanned by the sweep but is no longer an eligible target"
            - "SKU-2001 positions: 0101 is EMPTY (available 0) -> BROKEN; 0103 holds 4 units -> COMPLETE with headroom 16"
