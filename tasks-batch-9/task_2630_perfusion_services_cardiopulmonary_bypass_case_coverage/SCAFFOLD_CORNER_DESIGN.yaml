      - name: device_event_log_action_ticks_runtime_and_counts_only_alarm_codes
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /perfusion-devices/{id}/event-logs]
          - entities.DeviceEventLog.fields.event_code
          - entities.DeviceEventLog.fields.runtime_hours_delta
          - entities.PerfusionDevice.fields.runtime_hours_since_service
          - entities.PerfusionDevice.fields.alarm_count_since_service
        distinguishing_aspect: |
          runtime_hours_delta is honoured only for RUNTIME_TICK and the alarm counter moves only for
          ALARM_CRITICAL, ALARM_ADVISORY and SELF_TEST_FAIL, so an ALARM_ADVISORY carrying a delta of 5
          must raise alarm_count_since_service to 1 while leaving runtime_hours_since_service at 4 and the
          status at AVAILABLE.
        test_recipe:
          setup:
            - "Contract c1 with two heart-lung machines: d2 (HLM-002) and d1 (HLM-001, backup d2), both AVAILABLE with zero counters."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id, d1_v: $.data.version }
          trigger:
            - call: "POST /perfusion-devices/${d1}/event-logs"
              payload: { event_code: "RUNTIME_TICK", runtime_hours_delta: 4, detail: "post-case runtime" }
              as: BiomedTech
              captures: { log1: $.data.id }
            - call: "POST /perfusion-devices/${d1}/event-logs"
              payload: { event_code: "SELF_TEST_PASS", detail: "morning self test" }
              as: BiomedTech
              as_user_id: "tech-audit-7"
              captures: { log2: $.data.id }
            - call: "POST /perfusion-devices/${d1}/event-logs"
              payload: { event_code: "ALARM_ADVISORY", runtime_hours_delta: 5, detail: "gas blender advisory" }
              as: BiomedTech
              captures: { log3: $.data.id }
            - call: "GET /perfusion-devices/${d1}/event-logs"
              as: BiomedTech
          assert:
            - "each call returns HTTP 201 with the DeviceEventLog it appended: DeviceEventLog.${log1}.event_code == RUNTIME_TICK, ${log2}.event_code == SELF_TEST_PASS, ${log3}.event_code == ALARM_ADVISORY"
            - "PerfusionDevice.${d1}.runtime_hours_since_service == 4 - the delta of 5 carried by the ALARM_ADVISORY is ignored"
            - "PerfusionDevice.${d1}.alarm_count_since_service == 1 - only the ALARM_ADVISORY counted, SELF_TEST_PASS and RUNTIME_TICK did not"
            - "PerfusionDevice.${d1}.status is still AVAILABLE - ALARM_ADVISORY is not one of the two codes that force NEEDS_SERVICE"
            - "DeviceEventLog.${log2}.recorded_by_user_id == 'tech-audit-7' - the actor id is stored verbatim without being resolved to any entity"
            - "PerfusionDevice.${d1}.version == ${d1_v} + 3 - each appended event log increments the device version once"
            - "GET /perfusion-devices/${d1}/event-logs returns total_count == 3, has_more == false, limit == 10 and offset == 0"

