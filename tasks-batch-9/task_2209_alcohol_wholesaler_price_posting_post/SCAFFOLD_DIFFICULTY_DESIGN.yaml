              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
