            captures: { prov: "$.data.id" }
          - call: "POST /patients"
            payload: { state_policy_id: "${pol}", email: "cb@example.com", full_name: "Cleo Brand", age_years: 65 }
            as: CareOpsAgent
            as_user_id: "ops_1"
            captures: { pat: "$.data.id" }
          - call: "POST /patients/${pat}/device-orders"
            payload: { model: "NEO", dome_size: "M", tip_type: "OPEN", list_price_cents: 199900, discount_cents: 9900, accessory_subtotal_cents: 4500, shipping_cents: 1495 }
            as: Patient
            as_user_id: "${pat}"
            captures: { ord: "$.data.id" }
          - call: "POST /remote-fitting-sessions"
            payload: { patient_id: "${pat}", session_type: "INITIAL_FIT", scheduled_start_utc: "2026-08-10T10:00:00Z", scheduled_end_utc: "2026-08-10T11:00:00Z", provider_id: "${prov}", device_order_id: "${ord}" }
            as: Patient
            as_user_id: "${pat}"
            captures: { sess: "$.data.id" }
          - call: "POST /patients/${pat}/screening-sessions"
            payload: {}
            as: Patient
