              payload: { nurse_id: "${nw_id}", target_level: "CN_II", portfolio_narrative: "w", expected_nurse_version: "${nw_v}" }
              as: Nurse
              as_user_id: "${nw_id}"
              captures: { wapp: $.data.id }
            - call: "POST /clinical-ladder/applications/${wapp}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${nw_id}"
            - call: "POST /clinical-ladder/applications/${wapp}/assignments"
