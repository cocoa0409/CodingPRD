scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_price_estimate_vs_final_late_fee
        grounds:
          - calculations.ticket_price_calc
          - state_machines.EventRegistration.PENDING_PAYMENT_to_CONFIRMED
        distinguishing_aspect: |
          Dual-variant on the EventRegistration domain: ESTIMATE (quoted_price_cents)
          ignores the late fee, while FINAL (final_price_cents) applies the +1500-cent
          late fee because the logical clock at confirm time is within 7 days of
          event_date. Same tier data, two variants, different cents.
        test_recipe:
          setup:
            - "ReunionEvent OPEN_FOR_REGISTRATION with event_date 2026-08-10T18:00:00Z, quorum 1, one ACTIVE committee member"
            - "TicketTier base_price_cents=10000, capacity=0 (unlimited), sales window [2026-05-01, 2026-08-10), early_bird_discount_pct=0"
            - "AlumniRecord for registrant (ACTIVE), logical clock at 2026-08-05T00:00:00Z (within 7-day late window, past early-bird cutoff)"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Reg One", primary_email: "reg1@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { reg1_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Chair One", primary_email: "chair1@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair1_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Class of 2001 25th Reunion", event_date: "2026-08-10T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev1_id: $.data.id, ev1_v: $.data.version }
            - call: "POST /alumni/events/${ev1_id}/committee"
              payload: { name: "Reunion Committee" }
              as: AlumniRelationsStaff
              captures: { com1_id: $.data.id }
            - call: "POST /alumni/committees/${com1_id}/memberships"
              payload: { alumni_id: "${chair1_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem1_id: $.data.id }
            - call: "POST /alumni/memberships/${mem1_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair1_id}"
            - call: "POST /alumni/events/${ev1_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev1_id}/ticket-tiers"
              payload: { name: "Standard", base_price_cents: 10000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-08-10T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev1_v}" }
              as: AlumniRelationsStaff
              captures: { tier1_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev1_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${ev1_id}/registrations"
              payload: { tier_id: "${tier1_id}", alumni_id: "${reg1_id}" }
              as: Alumni
              as_user_id: "${reg1_id}"
              captures: { regn1_id: $.data.id, quoted1: $.data.quoted_price_cents }
            - call: "POST /alumni/registrations/${regn1_id}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${reg1_id}"
          assert:
            - "EventRegistration.${regn1_id}.quoted_price_cents == 10000"
            - "EventRegistration.${regn1_id}.final_price_cents == 11500"
            - "EventRegistration.${regn1_id}.final_price_cents != EventRegistration.${regn1_id}.quoted_price_cents"

      - name: engagement_score_provisional_vs_final_on_unfulfilled_pledge
        grounds:
          - calculations.engagement_score_calc
          - entities.AlumniRecord.fields.engagement_score
        distinguishing_aspect: |
          Dual-variant on the AlumniRecord domain (different subject than ticket
          pricing): the PROVISIONAL variant counts PLEDGED pledges at 50% weight,
          while the FINAL persisted variant ignores them. Identical pledge data
          yields a strictly higher PROVISIONAL display score than the persisted
          FINAL score.
        test_recipe:
          setup:
            - "AlumniRecord ACTIVE with class_year 2001; milestone ReunionEvent (event_date 2026-08-10, class_year 2001 so milestone_year=25) with ACTIVE GiftCampaign (goal 1000000, matching_multiplier_bps=0)"
            - "Logical clock at 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Donor Two", primary_email: "donor2@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { donor2_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Chair Two", primary_email: "chair2@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair2_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Class of 2001 25th Reunion", event_date: "2026-08-10T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev2_id: $.data.id }
            - call: "POST /alumni/events/${ev2_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { com2_id: $.data.id }
            - call: "POST /alumni/committees/${com2_id}/memberships"
              payload: { alumni_id: "${chair2_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem2_id: $.data.id }
            - call: "POST /alumni/memberships/${mem2_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair2_id}"
            - call: "POST /alumni/events/${ev2_id}/campaigns"
              payload: { name: "25th Reunion Fund", goal_cents: 1000000, matching_multiplier_bps: 0 }
              as: AlumniRelationsStaff
              captures: { camp2_id: $.data.id }
            - call: "POST /alumni/campaigns/${camp2_id}/activate"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/campaigns/${camp2_id}/pledges"
              payload: { alumni_id: "${donor2_id}", amount_cents: 10000000 }
              as: Alumni
              as_user_id: "${donor2_id}"
              captures: { pledge2_id: $.data.id }
            - call: "GET /alumni/records/${donor2_id}"
              as: AlumniRelationsStaff
              captures: { final_score_2: $.data.engagement_score }
          assert:
            - "AlumniRecord.${donor2_id}.engagement_score == 0.00 (FINAL variant excludes the still-PLEDGED pledge of 10000000 cents)"
            - "GiftPledge.${pledge2_id}.status == PLEDGED"
            - "PROVISIONAL variant for the same data would be 0.30 * (10000000 * 0.5 / 100000 * 100) = 15.00 > 0.00, demonstrating divergence"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_price_three_input_stacked_discounts
        grounds:
          - calculations.ticket_price_calc
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction: base
          price, early-bird discount (conditional on clock vs cutoff), committee
          25% discount (conditional on membership state), and late fee
          (conditional on clock vs event_date - 7d) interact multiplicatively
          then additively in the pinned order discount -> committee -> fee -> round.
        test_recipe:
          setup:
            - "Event OPEN_FOR_REGISTRATION, event_date 2026-09-20T18:00:00Z, quorum 1, one ACTIVE CHAIR"
            - "TicketTier base 20000 cents, capacity 0, window [2026-05-01, 2026-09-20), early_bird_discount_pct=10"
            - "Registrant is an ACTIVE committee MEMBER on the event's committee; clock at 2026-07-01 (before early-bird cutoff 2026-07-22, outside late window)"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Chair Three", primary_email: "chair3@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair3_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Member Three", primary_email: "member3@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { member3_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-09-20T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev3_id: $.data.id, ev3_v: $.data.version }
            - call: "POST /alumni/events/${ev3_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { com3_id: $.data.id }
            - call: "POST /alumni/committees/${com3_id}/memberships"
              payload: { alumni_id: "${chair3_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem3a_id: $.data.id }
            - call: "POST /alumni/committees/${com3_id}/memberships"
              payload: { alumni_id: "${member3_id}", role: "MEMBER" }
              as: AlumniRelationsStaff
              captures: { mem3b_id: $.data.id }
            - call: "POST /alumni/memberships/${mem3a_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair3_id}"
            - call: "POST /alumni/memberships/${mem3b_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${member3_id}"
            - call: "POST /alumni/events/${ev3_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev3_id}/ticket-tiers"
              payload: { name: "Early", base_price_cents: 20000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-20T00:00:00Z", early_bird_discount_pct: 10, expected_event_version: "${ev3_v}" }
              as: AlumniRelationsStaff
              captures: { tier3_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev3_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${ev3_id}/registrations"
              payload: { tier_id: "${tier3_id}", alumni_id: "${member3_id}" }
              as: Alumni
              as_user_id: "${member3_id}"
              captures: { regn3_id: $.data.id }
            - call: "POST /alumni/registrations/${regn3_id}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${member3_id}"
          assert:
            - "EventRegistration.${regn3_id}.final_price_cents == 13500 (20000 * 0.90 * 0.75, no late fee, round_half_up at end)"

      - name: campaign_matching_credit_per_pledge_rounding
        grounds:
          - calculations.campaign_matching_credit
          - state_machines.GiftPledge.PLEDGED_to_FULFILLED
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: matching credit is
          rounded PER PLEDGE then summed. Three pledges of 333 cents at 3333 bps
          (33.33%): per-pledge round_half_up(333*3333/10000)=round_half_up(110.99)=111
          each, total 333; sum-then-round would give round_half_up(332.97)=333 —
          pick amounts where orders diverge: two pledges of 155 cents at 5000 bps
          give per-pledge round_half_up(77.5)=78 each, total 156, vs sum-then-round
          round_half_up(155)=155. Scaffold pins per-pledge, so matched_credit_cents == 156.
        test_recipe:
          setup:
            - "Milestone event (class_year 2001, event_date 2026-08-10) with ACTIVE GiftCampaign goal 100000, matching_multiplier_bps=5000"
            - "Two ACTIVE donors; clock 2026-06-01"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Donor A", primary_email: "donora@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { donora_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Donor B", primary_email: "donorb@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { donorb_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Chair Four", primary_email: "chair4@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair4_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-08-10T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev4_id: $.data.id }
            - call: "POST /alumni/events/${ev4_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { com4_id: $.data.id }
            - call: "POST /alumni/committees/${com4_id}/memberships"
              payload: { alumni_id: "${chair4_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem4_id: $.data.id }
            - call: "POST /alumni/memberships/${mem4_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair4_id}"
            - call: "POST /alumni/events/${ev4_id}/campaigns"
              payload: { name: "Match Fund", goal_cents: 100000, matching_multiplier_bps: 5000 }
              as: AlumniRelationsStaff
              captures: { camp4_id: $.data.id }
            - call: "POST /alumni/campaigns/${camp4_id}/activate"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/campaigns/${camp4_id}/pledges"
              payload: { alumni_id: "${donora_id}", amount_cents: 155 }
              as: Alumni
              as_user_id: "${donora_id}"
              captures: { pledge4a_id: $.data.id }
            - call: "POST /alumni/campaigns/${camp4_id}/pledges"
              payload: { alumni_id: "${donorb_id}", amount_cents: 155 }
              as: Alumni
              as_user_id: "${donorb_id}"
              captures: { pledge4b_id: $.data.id }
            - call: "POST /alumni/pledges/${pledge4a_id}/fulfill"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/pledges/${pledge4b_id}/fulfill"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "GiftPledge.${pledge4a_id}.matched_credit_cents == 78"
            - "GiftPledge.${pledge4b_id}.matched_credit_cents == 78"
            - "GiftCampaign.${camp4_id}.matched_credit_cents == 156 (per-pledge rounding, NOT sum-then-round 155)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: research_case_verified_reopen_cycle
        grounds:
          - state_machines.LostAlumniResearchCase.VERIFIED_to_OPEN
          - state_machines.LostAlumniResearchCase.OPEN_to_LEAD_LOGGED
        distinguishing_aspect: |
          Cyclic machine on LostAlumniResearchCase: OPEN -> LEAD_LOGGED ->
          VERIFIED -> OPEN loops, with reopened_count enforcing the cycle bound
          (max 3 reopens). Not a linear pipeline.
        test_recipe:
          setup:
            - "AlumniRecord in LOST status with a research case in VERIFIED (lead_confidence 80)"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Lost One", primary_email: "lost1@x.com", class_year: 1995, degree_code: "BS" }
              as: AlumniRelationsStaff
              captures: { lost1_id: $.data.id }
            - call: "POST /alumni/records/${lost1_id}/mark-lost"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/research-cases"
              payload: { alumni_id: "${lost1_id}", lead_source: "SOCIAL_MEDIA", lead_detail: "Possible LinkedIn profile", lead_confidence: 80 }
              as: AlumniRelationsStaff
              captures: { case1_id: $.data.id }
            - call: "POST /alumni/research-cases/${case1_id}/log-lead"
              payload: { lead_source: "SOCIAL_MEDIA", lead_detail: "Possible LinkedIn profile", lead_confidence: 80 }
              as: AlumniRelationsStaff
            - call: "POST /alumni/research-cases/${case1_id}/verify"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/research-cases/${case1_id}/reopen"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/research-cases/${case1_id}/log-lead"
              payload: { lead_source: "PEER_TIP", lead_detail: "Classmate tip", lead_confidence: 90 }
              as: AlumniRelationsStaff
            - call: "POST /alumni/research-cases/${case1_id}/verify"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "LostAlumniResearchCase.${case1_id}.status == VERIFIED after completing the VERIFIED->OPEN->LEAD_LOGGED->VERIFIED cycle"
            - "LostAlumniResearchCase.${case1_id}.reopened_count == 1"

      - name: registration_parallel_payment_and_attendance_dimensions
        grounds:
          - state_machines.EventRegistration.CONFIRMED_to_CHECKED_IN
          - state_machines.EventRegistration.PENDING_PAYMENT_to_CANCELLED
        distinguishing_aspect: |
          Parallel state dimensions on EventRegistration (different entity than
          the research case): payment_status and attendance_status evolve
          independently, but CHECKED_IN on the attendance axis is gated by
          payment_status == CONFIRMED; a PENDING_PAYMENT row can cancel without
          touching attendance.
        test_recipe:
          setup:
            - "Event OPEN_FOR_REGISTRATION with unlimited tier; two ACTIVE alumni registered; clock inside sales window"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Chair Five", primary_email: "chair5@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair5_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Guest A", primary_email: "guesta@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { guesta_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev5_id: $.data.id, ev5_v: $.data.version }
            - call: "POST /alumni/events/${ev5_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { com5_id: $.data.id }
            - call: "POST /alumni/committees/${com5_id}/memberships"
              payload: { alumni_id: "${chair5_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem5_id: $.data.id }
            - call: "POST /alumni/memberships/${mem5_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair5_id}"
            - call: "POST /alumni/events/${ev5_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev5_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 5000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev5_v}" }
              as: AlumniRelationsStaff
              captures: { tier5_id: $.data.id }
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev5_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${ev5_id}/registrations"
              payload: { tier_id: "${tier5_id}", alumni_id: "${guesta_id}" }
              as: Alumni
              as_user_id: "${guesta_id}"
              captures: { regn5_id: $.data.id }
            - call: "POST /alumni/registrations/${regn5_id}/confirm-payment"
              payload: {}
              as: Alumni
              as_user_id: "${guesta_id}"
            - call: "POST /alumni/registrations/${regn5_id}/check-in"
              payload: {}
              as: AlumniRelationsStaff
          assert:
            - "EventRegistration.${regn5_id}.payment_status == CONFIRMED"
            - "EventRegistration.${regn5_id}.attendance_status == CHECKED_IN (attendance moved while payment stayed CONFIRMED)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascade_depth3_to_propensity
        grounds:
          - state_machines.ReunionEvent.OPEN_FOR_REGISTRATION_to_CANCELLED
          - state_machines.GiftPledge.PLEDGED_to_LAPSED
          - calculations.giving_propensity_calc
        distinguishing_aspect: |
          Depth-3 chain from POST /alumni/events/{id}/cancel: event CANCELLED ->
          each PLEDGED GiftPledge on the linked campaign LAPSED (link 1); each
          lapse decrements campaign.pledged_total_cents (link 2); each lapse
          triggers giving_propensity recompute on the pledgor's AlumniRecord
          (link 3). Each hop is caused by the previous mutation, not by the
          original cancel action.
        test_recipe:
          setup:
            - "Event OPEN_FOR_REGISTRATION (class_year 2001, event_date 2026-08-10) with ACTIVE campaign and one PLEDGED pledge of 200000 cents from donor D"
            - "Clock 2026-06-01"
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Chair Six", primary_email: "chair6@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { chair6_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "Donor D", primary_email: "donord@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { donord_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "Reunion 25", event_date: "2026-08-10T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { ev6_id: $.data.id, ev6_v: $.data.version }
            - call: "POST /alumni/events/${ev6_id}/committee"
              payload: { name: "Committee" }
              as: AlumniRelationsStaff
              captures: { com6_id: $.data.id }
            - call: "POST /alumni/committees/${com6_id}/memberships"
              payload: { alumni_id: "${chair6_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { mem6_id: $.data.id }
            - call: "POST /alumni/memberships/${mem6_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${chair6_id}"
            - call: "POST /alumni/events/${ev6_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${ev6_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 5000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-08-10T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${ev6_v}" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AlumniRelationsStaff
