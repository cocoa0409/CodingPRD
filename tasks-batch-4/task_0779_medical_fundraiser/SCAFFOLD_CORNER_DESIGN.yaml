# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — 0779
# Breadth probe across entities / state machines / calculations / validations /
# endpoints / errors / rbac / cross-cutting layers / consistency model.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: campaign_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Campaign, endpoints]
        distinguishing_aspect: "POST /campaigns returns 201 with lifecycle_status DRAFT, payout_posture OPEN, raised_cents 0, tax_disclosure NOT_TAX_DEDUCTIBLE."
        test_recipe:
          setup: ["A registered organizer and beneficiary."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id, life: $.data.lifecycle_status }
          assert:
            - "http_status == 201"
            - "Campaign.${camp_id}.lifecycle_status == DRAFT"
            - "Campaign.${camp_id}.payout_posture == OPEN"
            - "Campaign.${camp_id}.raised_cents == 0"
            - "Campaign.${camp_id}.tax_disclosure == NOT_TAX_DEDUCTIBLE"

      - name: get_campaign_not_found
        claim_type: Not Found
        grounds: [entities.Campaign, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /campaigns/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /campaigns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Guest
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: campaign_missing_goal_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Campaign.fields.goal_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /campaigns without goal_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered organizer and beneficiary."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: donation_tax_receipt_status_deductible_for_charity
        claim_type: Computed Fields
        grounds: [entities.Donation.fields.tax_receipt_status, entities.Campaign.fields.is_charity]
        distinguishing_aspect: "A donation on a campaign with is_charity=true carries tax_receipt_status DEDUCTIBLE."
        test_recipe:
          setup: ["A published campaign created with is_charity true."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL", is_charity: true }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id, trs: $.data.tax_receipt_status }
          assert:
            - "Donation.${don_id}.tax_receipt_status == DEDUCTIBLE"

      - name: donation_tip_defaults_zero
        claim_type: Defaults
        grounds: [entities.Donation.fields.tip_cents, calculations.donation_charge_breakdown]
        distinguishing_aspect: "Omitting tip_cents defaults it to 0; amount 10000 tip 0 -> total_charged 10330, net 10000."
        test_recipe:
          setup: ["A published campaign."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id }
          assert:
            - "Donation.${don_id}.tip_cents == 0"
            - "Donation.${don_id}.total_charged_cents == 10330"
            - "Donation.${don_id}.net_to_campaign_cents == 10000"

  # ------------------------------------------------------------ state_machines
  - section: state_machines
    instances:
      - name: publish_already_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Campaign.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing an already-ACTIVE campaign returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A published (ACTIVE) campaign."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: pause_cancelled_campaign_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Campaign.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pausing a CANCELLED (terminal) campaign returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A campaign that has been cancelled."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/cancel"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /campaigns/${camp_id}/pause"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: approve_verification_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Beneficiary.PENDING_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already-VERIFIED beneficiary returns ERR_INVALID_STATE (not PENDING)."
        test_recipe:
          setup: ["A VERIFIED beneficiary."]
          setup_api_calls:
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
          trigger:
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: posture_returns_open_after_hold_release
        claim_type: compound
        grounds: [state_machines.Campaign.HOLD_to_OPEN, state_machines.Hold.ACTIVE_to_RELEASED, calculations.campaign_payout_posture]
        distinguishing_aspect: "Releasing the only ACTIVE Hold recomputes payout_posture back to OPEN."
        test_recipe:
          setup: ["Published campaign with one ACTIVE hold (posture HOLD)."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /holds"
              payload: { campaign_id: "${camp_id}", reason: "review", severity: "STANDARD" }
              as: TrustSafetyAgent
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /holds/${hold_id}/release"
              payload: {}
              as: TrustSafetyAgent
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Guest
              captures: { posture: $.data.payout_posture }
          assert:
            - "Campaign.${camp_id}.payout_posture == OPEN"

  # -------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: team_member_duplicate_returns_conflict
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_TEAM_MEMBER]"]
        distinguishing_aspect: "Adding the same organizer to a campaign twice returns ERR_DUPLICATE_TEAM_MEMBER (409)."
        test_recipe:
          setup: ["A campaign (owner org1) and a second organizer org2 already added once as CO_ORGANIZER."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O1", email: "o1@x.com" }
              as: Guest
              captures: { org1_id: $.data.id }
            - call: "POST /organizers"
              payload: { display_name: "O2", email: "o2@x.com" }
              as: Guest
              captures: { org2_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org1_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /team-members"
              payload: { campaign_id: "${camp_id}", organizer_id: "${org2_id}", team_role: "CO_ORGANIZER" }
              as: Organizer
              as_user_id: "${org1_id}"
          trigger:
            - call: "POST /team-members"
              payload: { campaign_id: "${camp_id}", organizer_id: "${org2_id}", team_role: "CO_ORGANIZER" }
              as: Organizer
              as_user_id: "${org1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_TEAM_MEMBER"
            - "http_status == 409"

      - name: placement_window_invalid_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_WINDOW_INVALID]"]
        distinguishing_aspect: "FeaturePlacement with window_end <= window_start returns ERR_WINDOW_INVALID (422)."
        test_recipe:
          setup: ["A campaign."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /feature-placements"
              payload: { campaign_id: "${camp_id}", category: "HOMEPAGE", slot_index: 1, window_start: "2026-04-08T00:00:00Z", window_end: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WINDOW_INVALID"
            - "http_status == 422"

      - name: campaign_goal_zero_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=9]", "errors[ERR_GOAL_INVALID]", entities.Campaign.fields.goal_cents]
        distinguishing_aspect: "POST /campaigns with goal_cents 0 returns ERR_GOAL_INVALID (422)."
        test_recipe:
          setup: ["A registered organizer and beneficiary."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 0, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GOAL_INVALID"
            - "http_status == 422"

      - name: submit_verification_without_stripe_returns_conflict
        claim_type: Cross-entity validation
        grounds: [state_machines.Beneficiary.UNVERIFIED_to_PENDING, "errors[ERR_WITHDRAWAL_NOT_READY]"]
        distinguishing_aspect: "Submitting verification before withdrawal-setup (stripe_account_ref null) returns ERR_WITHDRAWAL_NOT_READY (409)."
        test_recipe:
          setup: ["An UNVERIFIED beneficiary with no stripe_account_ref."]
          setup_api_calls:
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
          trigger:
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WITHDRAWAL_NOT_READY"
            - "http_status == 409"

      - name: donation_donor_mismatch_returns_forbidden
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_DONOR_MISMATCH]"]
        distinguishing_aspect: "A donation whose donor_id differs from the acting Donor's X-User-ID returns ERR_DONOR_MISMATCH (403)."
        test_recipe:
          setup: ["A published campaign and two donors donorA (acting) and donorB (id used in body)."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "DA", email: "da@x.com" }
              as: Guest
              captures: { donorA_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "DB", email: "db@x.com" }
              as: Guest
              captures: { donorB_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donorB_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donorA_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DONOR_MISMATCH"
            - "http_status == 403"

  # ---------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: list_donations_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Donation]
        distinguishing_aspect: "GET /donations?campaign_id=&limit=1 returns a paginated array with total_count 2 and has_more true."
        test_recipe:
          setup: ["A published campaign with two CAPTURED donations."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 20000 }
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "GET /donations"
              payload: { campaign_id: "${camp_id}", limit: 1 }
              as: Guest
          assert:
            - "response.response_type == array"
            - "response.data length == 1"
            - "meta/pagination total_count == 2 and has_more == true"

      - name: thankyou_update_sets_donation_thanked
        claim_type: Cross-reference link
        grounds: [endpoints, entities.Update.fields.update_type, entities.Donation.fields.thanked]
        distinguishing_aspect: "POST /updates with update_type THANK_YOU and donation_id sets that Donation.thanked = true."
        test_recipe:
          setup: ["A published campaign with one CAPTURED donation."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /updates"
              payload: { campaign_id: "${camp_id}", update_type: "THANK_YOU", body: "Thank you!", donation_id: "${don_id}" }
              as: Organizer
              as_user_id: "${org_id}"
            - call: "GET /donations/${don_id}"
              payload: {}
              as: Guest
              captures: { thanked: $.data.thanked }
          assert:
            - "Donation.${don_id}.thanked == true"

      - name: list_payouts_by_beneficiary_reverse_reach
        claim_type: Retrieval
        grounds: [endpoints, entities.Payout.fields.beneficiary_id]
        distinguishing_aspect: "GET /payouts?beneficiary_id returns the beneficiary's Payout[] (FK reverse reachability)."
        test_recipe:
          setup: ["Verified campaign with a net-100000 donation and one REQUESTED payout of 1000."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
