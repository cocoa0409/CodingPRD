              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 9900000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
            - call: "GET /clients/${client_a_id}"
              payload: {}
              as: BillingSpecialist
              captures: { stale_ver: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
            - call: "POST /feeding-assessments"
              payload: { consult_id: "${consult_a_id}", latch_score: 8, pre_feed_weight_grams: 4000, post_feed_weight_grams: 4040 }
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/start"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /consults/${consult_a_id}/complete"
              payload: {}
              as: Consultant
              as_user_id: "${cons_id}"
            - call: "POST /superbills"
              payload: { consult_id: "${consult_a_id}", billed_amount_cents: 25000, allowed_amount_cents: 15000, is_aca_preventive: true }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
            - call: "POST /superbills/${sb_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: BillingSpecialist
          trigger:
            - call: "POST /superbills/${sb_id}/void"
              payload: { expected_client_version: "${stale_ver}" }
              as: BillingSpecialist
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_CLIENT_VERSION"
            - "Client.${client_a_id}.reimbursement_ledger_cents == 15000"

      - name: derived_ledger_reconciled_after_paid
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Client.fields.reimbursement_ledger_cents
          - calculations.reimbursement_amount
        excluded_because:
          difficulty_instance: transitive_cascade / superbill_pay_ledger_sync_depth2
          rationale: "Client.reimbursement_ledger_cents reconciliation after a PAID adjudication is asserted by the named §1.8 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_fee_visible_in_create_response
        claim_type: immediate
        grounds:
          - entities.Consult.fields.fee_cents
          - calculations.sliding_scale_fee
        distinguishing_aspect: "The computed fee_cents is present in the SAME POST /consults response body (immediate consistency), not lazily on a later GET."
        test_recipe:
          setup: ["Practice with TIER_A ceiling 5000000 (40%); client income 4800000."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "Solo Practice" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /sliding-scale-tiers"
              payload: { practice_id: "${prac_id}", name: "TIER_A", income_ceiling_cents: 5000000, discount_pct: 40 }
              as: PracticeAdmin
            - call: "POST /consultants"
              payload: { practice_id: "${prac_id}", full_name: "Ana IBCLC", standard_rate_cents: 20000 }
              as: PracticeAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /clients"
              payload: { practice_id: "${prac_id}", full_name: "Parent A", infant_dob: "2026-05-01T00:00:00Z", household_income_cents: 4800000 }
              as: FrontDesk
              captures: { client_a_id: $.data.id }
          trigger:
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
          assert:
            - "response status == 201"
            - "the POST /consults response data.fee_cents == 12000 (no second GET needed)"
