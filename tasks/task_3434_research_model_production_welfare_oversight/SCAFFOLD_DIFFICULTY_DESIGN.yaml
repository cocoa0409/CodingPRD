        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INVALID_AGE_WINDOW]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          Error-category pair business_constraint vs business_fiscal: the order
          payload has min_age_weeks 7 > max_age_weeks 4 (constraint, priority 8)
          AND the customer is on CREDIT_HOLD (fiscal, priority 10); the lower
          priority number wins, so ERR_INVALID_AGE_WINDOW must be returned.
