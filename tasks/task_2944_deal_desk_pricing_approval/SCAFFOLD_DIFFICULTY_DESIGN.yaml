              as_user_id: "u-desk-1"
              captures: { booked_status: $.data.status, booked_arr: $.data.booked_arr_cents, booked_tcv: $.data.booked_tcv_cents }
          assert:
            - "${q_status} == APPROVED"
            - "${q_level} == 0"
            - "${q_expires} == 2026-08-31T00:00:00.000Z"
            - "${of_from_version} == ${q_v}"
            - "${of_sent_status} == OUT_FOR_SIGNATURE"
            - "${of_signed_status} == SIGNED"
            - "${acct_hold_status} == HOLD"
            - "${err_id} == ERR_ACCOUNT_CREDIT_HOLD"
            - "HTTP status == 409"
            - "${blocked_status} == SIGNED"
            - "${blocked_arr} == 0"
            - "${blocked_acct_arr} == 0"
            - "${acct_clear_status} == CLEAR"
            - "${booked_status} == BOOKED"
            - "${booked_arr} == 300000"
            - "${booked_tcv} == 300000"
            - "Account.${acct_id}.booked_arr_cents == 300000"
            - "Quote.${q_id}.status == BOOKED"
            - "Quote.${q_id}.booked_arr_cents == 300000"
            - "Quote.${q_id}.booked_tcv_cents == 300000"

      - name: step_decision_under_delegation_grant_at_exact_window_end_is_not_active
        grounds:
          - state_machines.ApprovalStep.PENDING_to_APPROVED
          - entities.DelegationGrant.fields.starts_at
          - entities.DelegationGrant.fields.ends_at
          - entities.DelegationGrant.fields.used_step_count
          - entities.ApprovalStep.fields.delegation_grant_id
          - errors.ERR_DELEGATION_NOT_ACTIVE
        distinguishing_aspect: |
          A level-2 ApprovalStep whose assigned_role the acting user does not hold is decidable only
          through a DelegationGrant on a different entity whose half-open [starts_at, ends_at) window
          contains the logical clock: at exactly 2026-08-20T00:00:00Z, the grant's ends_at, the decide
          call fails with ERR_DELEGATION_NOT_ACTIVE (409) and leaves the step PENDING and the grant's
          used_step_count 0, while one second earlier the identical call approves the step, stamps
          delegation_grant_id and increments used_step_count to 1.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One quote: term_months 36, payment_terms_days 30, Core Platform quantity 250 at requested_discount_pct 0.05 plus Premium Support quantity 250 at requested_discount_pct 0 — final_blended_discount_pct 0.246053, so required_approval_level is 2 and the chain runs level 1 then level 2."
            - "Level 1 approved by the deal desk analyst u-desk-1, which creates the level-2 step assigned to SalesDirector."
            - "One DelegationGrant from the sales director u-dir-1 to u-dual-2 at tier_level 2 with max_discount_pct 0.30 (well above the quote's 0.246053, so scope is never the blocker) over the window [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "The logical clock moved to exactly 2026-08-20T00:00:00Z, the grant's ends_at, which is outside the half-open window."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Delegated Approval", term_months: 36, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 250, requested_discount_pct: 0.05 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { core_line_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 250, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { sup_line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_blended: $.data.final_blended_discount_pct, q_level: $.data.required_approval_level, q_expires: $.data.expires_at }
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step1_id: "$.data[0].id", req_id: "$.data[0].approval_request_id" }
            - call: "POST /approval-steps/${step1_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Level 1 cleared by deal desk" }
              as: DealDeskAnalyst
              as_user_id: "u-desk-1"
              captures: { step1_decision: $.data.decision }
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step2_id: "$.data[0].id", step2_level: "$.data[0].level", step2_role: "$.data[0].assigned_role" }
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-dual-2", tier_level: 2, max_discount_pct: 0.30, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { grant_id: $.data.id, grant_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /approval-steps/${step2_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Approving under delegated authority" }
              as: DealDeskAnalyst
              as_user_id: "u-dual-2"
              captures: { err_id: $.data.error_id }
            - call: "GET /approval-steps/${step2_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { blocked_decision: $.data.decision, blocked_grant: $.data.delegation_grant_id }
            - call: "GET /delegation-grants"
              payload: { grantee_user_id: "u-dual-2" }
              as: DealDeskAnalyst
              captures: { blocked_used: "$.data[0].used_step_count", blocked_grant_status: "$.data[0].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /approval-steps/${step2_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Approving under delegated authority" }
              as: DealDeskAnalyst
              as_user_id: "u-dual-2"
              captures: { ok_decision: $.data.decision, ok_grant: $.data.delegation_grant_id, ok_actor: $.data.acting_user_id, ok_turnaround: $.data.turnaround_hours }
          assert:
            - "${q_blended} == 0.246053"
            - "${q_level} == 2"
            - "${q_expires} == 2026-08-31T00:00:00.000Z"
            - "${step1_decision} == APPROVED"
            - "${step2_level} == 2"
            - "${step2_role} == SalesDirector"
            - "${grant_status} == ACTIVE"
            - "${err_id} == ERR_DELEGATION_NOT_ACTIVE"
            - "HTTP status == 409"
            - "${blocked_decision} == PENDING"
            - "${blocked_grant} == null"
            - "${blocked_used} == 0"
            - "${blocked_grant_status} == ACTIVE"
            - "${ok_decision} == APPROVED"
            - "${ok_grant} == ${grant_id}"
            - "${ok_actor} == u-dual-2"
            - "${ok_turnaround} == 456.00"
            - "DelegationGrant.${grant_id}.used_step_count == 1"
            - "ApprovalRequest.${req_id}.status == APPROVED"
            - "ApprovalRequest.${req_id}.total_turnaround_hours == 456.00"
            - "ApprovalRequest.${req_id}.sla_state == MET"
            - "Quote.${q_id}.status == APPROVED"
            - "Quote.${q_id}.approved_at == 2026-08-19T23:59:59.000Z"
            - "Quote.${q_id}.expires_at == 2026-09-18T23:59:59.000Z"

  # =========================================================================
  # R8 resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delegation_grant_windows_overlap_rejected_adjacent_and_other_grantor_allowed
        grounds:
          - validations.P13_temporal_conflicts
          - entities.DelegationGrant.fields.starts_at
          - entities.DelegationGrant.fields.ends_at
          - entities.DelegationGrant.fields.grantor_user_id
          - entities.DelegationGrant.fields.tier_level
          - errors.ERR_DELEGATION_WINDOW_OVERLAP
        distinguishing_aspect: |
          The delegation calendar is keyed on (grantor_user_id, tier_level) and compared on the
          half-open interval [starts_at, ends_at): against a live grant covering
          [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z) a second grant from the same director at the
          same tier starting 2026-08-19T00:00:00Z is rejected with ERR_DELEGATION_WINDOW_OVERLAP (409),
          the same grant starting exactly at 2026-08-20T00:00:00Z is accepted because touching
          endpoints do not overlap, and the rejected window is accepted verbatim when a different
          grantor issues it.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain (only the policy and its tiers matter here)."
            - "One ACTIVE DelegationGrant from the sales director u-dir-1 to u-appr-a at tier_level 2, max_discount_pct 0.20, over [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "The logical clock stays at 2026-08-01T00:00:00Z throughout, so no grant is ever swept to EXPIRED."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-appr-a", tier_level: 2, max_discount_pct: 0.20, starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { g1_id: $.data.id, g1_status: $.data.status, g1_grantor: $.data.grantor_user_id }
          trigger:
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-appr-b", tier_level: 2, max_discount_pct: 0.20, starts_at: "2026-08-19T00:00:00Z", ends_at: "2026-08-25T00:00:00Z" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-appr-b", tier_level: 2, max_discount_pct: 0.20, starts_at: "2026-08-20T00:00:00Z", ends_at: "2026-08-25T00:00:00Z" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { g2_id: $.data.id, g2_status: $.data.status, g2_starts: $.data.starts_at }
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-appr-b", tier_level: 2, max_discount_pct: 0.20, starts_at: "2026-08-19T00:00:00Z", ends_at: "2026-08-25T00:00:00Z" }
              as: VPSales
              as_user_id: "u-vp-1"
              captures: { g3_id: $.data.id, g3_status: $.data.status, g3_grantor: $.data.grantor_user_id }
            - call: "GET /delegation-grants"
              payload: { tier_level: 2 }
              as: DealDeskAnalyst
              captures: { list_count: $.total_count, first_id: "$.data[0].id", second_id: "$.data[1].id", third_id: "$.data[2].id" }
          assert:
            - "${g1_status} == ACTIVE"
            - "${g1_grantor} == u-dir-1"
            - "${err_id} == ERR_DELEGATION_WINDOW_OVERLAP"
            - "HTTP status == 409"
            - "${g2_status} == ACTIVE"
            - "${g2_starts} == 2026-08-20T00:00:00.000Z"
            - "${g3_status} == ACTIVE"
            - "${g3_grantor} == u-vp-1"
            - "${list_count} == 3"
            - "${first_id} == ${g1_id}"
            - "${second_id} == ${g3_id}"
            - "${third_id} == ${g2_id}"
            - "DelegationGrant.${g1_id}.status == ACTIVE"

      - name: price_hold_windows_need_the_cooldown_gap_per_account_and_product
        grounds:
          - validations.P13_temporal_conflicts
          - entities.NonStandardTerm.fields.hold_start_date
          - entities.NonStandardTerm.fields.hold_end_date
          - entities.NonStandardTerm.fields.hold_product_id
          - entities.DeskPolicy.fields.price_hold_cooldown_days
          - errors.ERR_PRICE_HOLD_WINDOW_CONFLICT
        distinguishing_aspect: |
          Two price-hold windows on the same (account, product) must be separated by more than
          DeskPolicy.price_hold_cooldown_days (30) of clear calendar even across different quotes: a
          renewal hold starting 2028-01-30, exactly 30 days after the live hold's inclusive
          hold_end_date 2027-12-31, is rejected with ERR_PRICE_HOLD_WINDOW_CONFLICT (409), the same
          hold starting 2028-01-31 at 31 days clears, and the rejected window is accepted verbatim for
          a different product because the cooldown is keyed per product.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; DeskPolicy.price_hold_cooldown_days is 30."
            - "Quote A on the account, DRAFT, term_months 12, payment_terms_days 30, one Premium Support line of quantity 10, carrying a PENDING PRICE_HOLD_RENEWAL term on SUP-PREM over the inclusive window 2027-01-01 through 2027-12-31."
            - "Quote B on the same account, DRAFT, term_months 12, payment_terms_days 30, one Premium Support line of quantity 10 — the second quote is where the colliding holds are attempted."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Hold Quote A", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qa_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${qa_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qa_line_id: $.data.id }
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${qa_id}", term_category: "PRICE_HOLD_RENEWAL", requested_numeric_value: 12, requested_text: "Hold FY27 support pricing for the renewal year", hold_product_id: "${sup_id}", hold_start_date: "2027-01-01", hold_end_date: "2027-12-31" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { hold_a_id: $.data.id, hold_a_state: $.data.review_state }
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Hold Quote B", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qb_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${qb_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qb_line_id: $.data.id }
          trigger:
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${qb_id}", term_category: "PRICE_HOLD_RENEWAL", requested_numeric_value: 12, requested_text: "Second support hold, 30 days after the first", hold_product_id: "${sup_id}", hold_start_date: "2028-01-30", hold_end_date: "2028-06-30" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${qb_id}", term_category: "PRICE_HOLD_RENEWAL", requested_numeric_value: 12, requested_text: "Second support hold, 31 days after the first", hold_product_id: "${sup_id}", hold_start_date: "2028-01-31", hold_end_date: "2028-06-30" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { hold_b_id: $.data.id, hold_b_state: $.data.review_state, hold_b_start: $.data.hold_start_date }
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${qb_id}", term_category: "PRICE_HOLD_RENEWAL", requested_numeric_value: 12, requested_text: "Platform hold inside the support cooldown", hold_product_id: "${core_id}", hold_start_date: "2028-01-30", hold_end_date: "2028-06-30" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { hold_c_id: $.data.id, hold_c_product: $.data.hold_product_id }
            - call: "GET /products/${sup_id}/price-holds"
              payload: {}
              as: DealDeskAnalyst
              captures: { sup_hold_count: $.total_count, sup_first_start: "$.data[0].hold_start_date", sup_second_start: "$.data[1].hold_start_date" }
            - call: "GET /products/${core_id}/price-holds"
              payload: {}
              as: DealDeskAnalyst
              captures: { core_hold_count: $.total_count, core_first_start: "$.data[0].hold_start_date" }
          assert:
            - "${hold_a_state} == PENDING"
            - "${err_id} == ERR_PRICE_HOLD_WINDOW_CONFLICT"
            - "HTTP status == 409"
            - "${hold_b_state} == PENDING"
            - "${hold_b_start} == 2028-01-31"
            - "${hold_c_product} == ${core_id}"
            - "${sup_hold_count} == 2"
            - "${sup_first_start} == 2027-01-01"
            - "${sup_second_start} == 2028-01-31"
            - "${core_hold_count} == 1"
            - "${core_first_start} == 2028-01-30"
            - "NonStandardTerm.${hold_a_id}.hold_end_date == 2027-12-31"

  # =========================================================================
  # R9 compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: account_booked_arr_ledger_conserved_across_booking_and_reversal
        grounds:
          - calculations.C8_booking_values
          - entities.Account.fields.booked_arr_cents
          - entities.OrderForm.fields.booked_arr_cents
          - entities.OrderForm.fields.booking_reversal_count
          - state_machines.OrderForm.BOOKED_to_VOID
          - state_machines.Quote.BOOKED_to_APPROVED
        distinguishing_aspect: |
          Account.booked_arr_cents is a conserved ledger equal to the sum of booked_arr_cents over the
          account's BOOKED order forms, so booking the 300000-cent support renewal raises it from 0 to
          300000 and the CFO reversal must return it to exactly 0 while the voided form retains
          booked_arr_cents 300000 and booked_tcv_cents 300000 for audit and the quote drops back to
          APPROVED with its own booking fields zeroed — no residue on either side of the round trip.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; Account.booked_arr_cents starts at its 0 default and credit_status at CLEAR."
            - "One quote with a single Premium Support line of quantity 10 at requested_discount_pct 0 (term_months 12, payment_terms_days 30): final_net_total_cents 300000, required_approval_level 0, so submit auto-approves it."
            - "One OrderForm generated, sent and signed, then booked — booked_arr_cents = RATABLE net 300000 / (12/12) = 300000 and booked_tcv_cents = 300000."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { acct_arr_before: $.data.booked_arr_cents, acct_credit_before: $.data.credit_status }
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Support Renewal FY27", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_status: $.data.status, q_net: $.data.final_net_total_cents, q_v: $.data.version }
            - call: "POST /order-forms"
              payload: { quote_id: "${q_id}", signer_name: "Dana Reeves", signer_email: "dana.reeves@northwind.example", expected_quote_version: "${q_v}" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of_id: $.data.id }
            - call: "POST /order-forms/${of_id}/send"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
            - call: "POST /order-forms/${of_id}/signature"
              payload: { outcome: "SIGNED", signed_by_name: "Dana Reeves" }
              as: DealDeskAnalyst
              as_user_id: "u-desk-1"
            - call: "POST /order-forms/${of_id}/book"
              payload: {}
              as: DealDeskAnalyst
              as_user_id: "u-desk-1"
              captures: { booked_status: $.data.status, booked_arr: $.data.booked_arr_cents, booked_tcv: $.data.booked_tcv_cents, booked_at: $.data.booked_at }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { acct_arr_booked: $.data.booked_arr_cents }
          trigger:
            - call: "POST /order-forms/${of_id}/reverse-booking"
              payload: { reversal_reason: "Customer legal entity changed; rebooking under the correct entity" }
              as: CFO
