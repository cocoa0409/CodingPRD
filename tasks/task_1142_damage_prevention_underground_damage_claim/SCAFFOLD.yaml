# =============================================================================
# Task 1142 — Damage Prevention & Underground Damage Claim Recovery
# Scaffold seed tables (§1.0–§1.7). Difficulty target: beyond Expert band
# (dense coupling: parallel case dimensions, cyclic negotiation, transitive
# cascades, segregation of duties, polymorphic dispute targets, OCC supersede).
# =============================================================================

scenario: |
  1142. Damage Prevention & Underground Damage Claim Recovery (utility damage
  recovery unit): excavation damage report intake & scene documentation,
  ticket/locate record retrieval & timeline reconstruction, root cause & fault
  allocation (locator/excavator/facility owner), repair cost compilation &
  claim invoicing, dispute & subrogation, regulatory damage reporting,
  repeat-offender program, prevention training & outreach

domain_name: underground-damage-recovery
api_prefix: /damage-recovery

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate, self_referential, polymorphic]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Excavator
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Excavating contractor legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: program_status, type: enum, source: system, default: GOOD_STANDING, description: "Repeat-offender band: GOOD_STANDING | WATCH | PROBATION | SUSPENDED", constraints: "enum {GOOD_STANDING, WATCH, PROBATION, SUSPENDED}" }
      - { name: offender_points, type: integer, source: computed, default: 0, description: "Decay-adjusted sum of ACTIVE ViolationRecord.effective_points (calculation repeat_offender_score)" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Overpayment remainder from payment waterfall, usable against future invoices" }
      - { name: total_outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of amount_due_cents over this excavator's ClaimInvoices in {ISSUED, PARTIALLY_PAID, DISPUTED}" }

  - name: Locator
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Locating contractor legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: contract_region, type: string, source: input, description: "Service region code the locator is contracted for" }
      - { name: contract_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "enum {ACTIVE, SUSPENDED}" }
      - { name: performance_score_bp, type: integer, source: computed, default: 10000, description: "Accuracy basis points: ACCURATE audits / total audited responses * 10000 (10000 when no audits)" }
      - { name: total_responses, type: integer, source: computed, default: 0, description: "Count of LocateResponses submitted by this locator" }

  - name: LocateTicket
    parent: null
    common_fields: true
    fields:
      - { name: excavator_id, type: string, source: input, description: "FK -> Excavator.id; must equal X-User-ID when role is Excavator" }
      - { name: dig_site_address, type: string, source: input, description: "Street address of the dig site; part of the overlap resource key (excavator_id, dig_site_address)" }
      - { name: work_start_at, type: datetime, source: input, description: "Dig window start (UTC); half-open interval [work_start_at, work_end_at)" }
      - { name: work_end_at, type: datetime, source: input, description: "Dig window end (UTC, exclusive); must be strictly after work_start_at" }
      - { name: ticket_number, type: string, source: system, description: "Server-minted human reference TCK-<seq>" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | COMPLETED | EXPIRED", constraints: "enum {OPEN, COMPLETED, EXPIRED}" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of successful renewals" }

  - name: LocateResponse
    parent: null
    common_fields: true
    fields:
      - { name: locate_ticket_id, type: string, source: input, description: "FK -> LocateTicket.id" }
      - { name: locator_id, type: string, source: input, description: "FK -> Locator.id; must equal X-User-ID when role is Locator" }
      - { name: response_code, type: enum, source: input, description: "MARKED | CLEAR | PARTIAL", constraints: "enum {MARKED, CLEAR, PARTIAL}" }
      - { name: marks_completed_at, type: datetime, source: input, description: "When the locator finished marking (UTC)" }
      - { name: accuracy_verdict, type: enum, source: system, default: UNAUDITED, description: "UNAUDITED | ACCURATE | INACCURATE", constraints: "enum {UNAUDITED, ACCURATE, INACCURATE}" }
      - { name: notes, type: string, source: input, description: "Free-form notes", default: "" }

  - name: DamageCase
    parent: null
    common_fields: true
    fields:
      - { name: excavator_id, type: string, source: input, description: "FK -> Excavator.id; the excavator who caused the damage" }
      - { name: locate_ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; optional at intake, set via create field or link-ticket", default: null }
      - { name: case_number, type: string, source: system, description: "Server-minted human reference DC-<seq>" }
      - { name: dig_site_address, type: string, source: input, description: "Where the damage occurred" }
      - { name: facility_type, type: enum, source: input, description: "GAS | ELECTRIC | TELECOM | WATER", constraints: "enum {GAS, ELECTRIC, TELECOM, WATER}" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL", constraints: "enum {MINOR, MAJOR, CRITICAL}" }
      - { name: occurred_at, type: datetime, source: input, description: "When the strike occurred (UTC)" }
      - { name: investigation_status, type: enum, source: system, default: REPORTED, description: "REPORTED | DOCUMENTING | INVESTIGATING | FAULT_PROPOSED | FAULT_FINAL | CLOSED", constraints: "enum {REPORTED, DOCUMENTING, INVESTIGATING, FAULT_PROPOSED, FAULT_FINAL, CLOSED}" }
      - { name: recovery_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | COSTING | INVOICED | COLLECTING | RECOVERED", constraints: "enum {UNBILLED, COSTING, INVOICED, COLLECTING, RECOVERED}" }
      - { name: investigator_user_id, type: string, source: system, default: null, description: "X-User-ID captured by begin-investigation; segregation-of-duties anchor" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over non-deleted CostLineItems (per-line rounding pinned by repair_cost_compilation)" }
      - { name: total_invoiced_cents, type: integer, source: computed, default: 0, description: "Sum of invoiced_cents over this case's ClaimInvoices" }
      - { name: total_recovered_cents, type: integer, source: computed, default: 0, description: "Sum of amount_paid_cents over this case's ClaimInvoices" }
      - { name: evidence_count, type: integer, source: computed, default: 0, description: "Count of EvidenceItems for this case (all admissible by construction)" }
      - { name: reconstruction_flags, type: array, source: computed, default: [], description: "Flags from latest timeline_reconstruction: subset of {NO_TICKET, LATE_MARK, STALE_MARKS, POST_DAMAGE_MARK}" }

  - name: EvidenceItem
    parent: null
    common_fields: false
    fields:
      - { name: damage_case_id, type: string, source: input, description: "FK -> DamageCase.id" }
      - { name: evidence_type, type: enum, source: input, description: "PHOTO | MEASUREMENT | WITNESS_STATEMENT | SKETCH", constraints: "enum {PHOTO, MEASUREMENT, WITNESS_STATEMENT, SKETCH}" }
      - { name: captured_at, type: datetime, source: input, description: "When the scene item was captured (UTC); must be <= case.occurred_at + 72h" }
      - { name: description, type: string, source: input, description: "Free-form description" }

  - name: TimelineEvent
    parent: null
    common_fields: false
    fields:
      - { name: damage_case_id, type: string, source: system, description: "FK -> DamageCase.id" }
      - { name: event_kind, type: enum, source: system, description: "TICKET_SUBMITTED | RESPONSE_SUBMITTED | EVIDENCE_CAPTURED | DAMAGE_OCCURRED", constraints: "enum {TICKET_SUBMITTED, RESPONSE_SUBMITTED, EVIDENCE_CAPTURED, DAMAGE_OCCURRED}" }
      - { name: event_at, type: datetime, source: system, description: "Timestamp of the reconstructed event (UTC)" }
      - { name: source_ref_id, type: string, source: system, description: "id of the source record (ticket, response, evidence, or case)" }
      - { name: flag, type: enum, source: system, default: NONE, description: "NONE | LATE_MARK | STALE_MARKS | POST_DAMAGE_MARK", constraints: "enum {NONE, LATE_MARK, STALE_MARKS, POST_DAMAGE_MARK}" }

  - name: FaultAllocation
    parent: null
    common_fields: true
    fields:
      - { name: damage_case_id, type: string, source: input, description: "FK -> DamageCase.id" }
      - { name: supersedes_allocation_id, type: string, source: system, default: null, description: "FK -> FaultAllocation.id; self-reference to the non-FINAL allocation this one replaces" }
      - { name: root_cause_code, type: enum, source: input, description: "NO_TICKET | EXPIRED_TICKET | MISMARK | LOCATE_LATE | OWNER_ABANDONED", constraints: "enum {NO_TICKET, EXPIRED_TICKET, MISMARK, LOCATE_LATE, OWNER_ABANDONED}" }
      - { name: basis, type: enum, source: system, description: "RULE_DEFAULT when shares omitted (computed from root_cause_code) | ADJUDICATED when shares supplied", constraints: "enum {RULE_DEFAULT, ADJUDICATED}" }
      - { name: shares, type: array, source: input, description: "Array of { party_type: EXCAVATOR|LOCATOR|FACILITY_OWNER, party_id: string|null, share_bp: integer }; must sum to exactly 10000; omitted => rule-based default", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | CONTESTED | FINAL | SUPERSEDED", constraints: "enum {DRAFT, PROPOSED, CONTESTED, FINAL, SUPERSEDED}" }
      - { name: revision_no, type: integer, source: system, default: 0, description: "Increments on each revise (CONTESTED -> DRAFT)" }
      - { name: proposed_at, type: datetime, source: system, default: null, description: "When the allocation entered PROPOSED" }
      - { name: contest_deadline_at, type: datetime, source: computed, default: null, description: "= proposed_at + 10 days" }

  - name: CostLineItem
    parent: null
    common_fields: true
    fields:
      - { name: damage_case_id, type: string, source: input, description: "FK -> DamageCase.id" }
      - { name: category, type: enum, source: input, description: "LABOR | MATERIAL | EQUIPMENT | RESTORATION", constraints: "enum {LABOR, MATERIAL, EQUIPMENT, RESTORATION}" }
      - { name: description, type: string, source: input, description: "Free-form description" }
      - { name: quantity, type: number, source: input, description: "Units billed (hours, items); must be > 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Actual per-unit cost in cents; must be > 0" }
      - { name: line_total_cents, type: integer, source: computed, description: "min(LINE_CAP, round_half_up(quantity * unit_cost_cents * (1+markup_pct) * emergency_mult)); see repair_cost_compilation" }

  - name: ClaimInvoice
    parent: null
    common_fields: true
    fields:
      - { name: damage_case_id, type: string, source: system, description: "FK -> DamageCase.id" }
      - { name: fault_allocation_id, type: string, source: system, description: "FK -> FaultAllocation.id" }
      - { name: debtor_type, type: enum, source: system, description: "EXCAVATOR | LOCATOR | FACILITY_OWNER", constraints: "enum {EXCAVATOR, LOCATOR, FACILITY_OWNER}" }
      - { name: debtor_id, type: string, source: system, description: "Excavator.id or Locator.id; the literal string 'FACILITY_OWNER' when debtor_type is FACILITY_OWNER" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | DISPUTED | WRITTEN_OFF", constraints: "enum {DRAFT, ISSUED, PARTIALLY_PAID, PAID, DISPUTED, WRITTEN_OFF}" }
      - { name: invoiced_cents, type: integer, source: computed, description: "Billed amount on the ACTUAL cost basis, allocated by share with remainder absorption (see allocation_distribution)" }
      - { name: standard_basis_cents, type: integer, source: computed, description: "Same quantities priced at STANDARD_UNIT_RATES with identical markups/caps, allocated by share (dual-variant comparison field)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of APPLIED Payment allocation legs targeting this invoice, minus reversed legs" }
      - { name: amount_due_cents, type: integer, source: computed, description: "= invoiced_cents - amount_paid_cents" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "When issued" }
      - { name: due_at, type: datetime, source: computed, default: null, description: "= issued_at + 30 days" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: payer_type, type: enum, source: input, description: "EXCAVATOR | LOCATOR", constraints: "enum {EXCAVATOR, LOCATOR}" }
      - { name: payer_id, type: string, source: input, description: "FK -> Excavator.id; polymorphic payer — Locator.id when payer_type=LOCATOR; must equal X-User-ID for Excavator/Locator roles" }
      - { name: amount_cents, type: integer, source: input, description: "Total payment amount; must be > 0" }
      - { name: claim_invoice_id, type: string, source: input, description: "FK -> ClaimInvoice.id; optional — omit for waterfall allocation", default: null }
      - { name: status, type: enum, source: system, default: APPLIED, description: "APPLIED | REVERSED", constraints: "enum {APPLIED, REVERSED}" }
      - { name: allocations, type: array, source: system, description: "Array of { claim_invoice_id, amount_cents } produced at apply time" }
      - { name: applied_at, type: datetime, source: system, description: "When the payment applied" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: target_type, type: enum, source: input, description: "FAULT_ALLOCATION | CLAIM_INVOICE", constraints: "enum {FAULT_ALLOCATION, CLAIM_INVOICE}" }
      - { name: target_id, type: string, source: input, description: "FK -> ClaimInvoice.id; polymorphic — FaultAllocation.id when target_type=FAULT_ALLOCATION" }
      - { name: reason, type: enum, source: input, description: "FAULT_SHARE | AMOUNT | EVIDENCE | OTHER", constraints: "enum {FAULT_SHARE, AMOUNT, EVIDENCE, OTHER}" }
      - { name: detail, type: string, source: input, description: "Free-form detail", default: "" }
      - { name: filed_by_type, type: enum, source: system, description: "EXCAVATOR | LOCATOR, taken from caller role" }
      - { name: filed_by_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_REVIEW | COUNTERED | RESOLVED | ESCALATED | EXPIRED", constraints: "enum {OPEN, UNDER_REVIEW, COUNTERED, RESOLVED, ESCALATED, EXPIRED}" }
      - { name: rounds, type: integer, source: system, default: 0, description: "Number of adjuster responses recorded" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "= created_at + 14 days; expiry sweep past this moves OPEN disputes to EXPIRED" }

  - name: SubrogationCase
    parent: null
    common_fields: true
    fields:
      - { name: dispute_id, type: string, source: system, description: "FK -> Dispute.id; the escalated dispute that spawned this case" }
      - { name: claim_invoice_id, type: string, source: system, description: "FK -> ClaimInvoice.id; recovered against this invoice's debtor", default: null }
      - { name: target_party_type, type: enum, source: system, description: "EXCAVATOR | LOCATOR", constraints: "enum {EXCAVATOR, LOCATOR}" }
      - { name: target_party_id, type: string, source: system, description: "Entity id of the pursued party" }
      - { name: status, type: enum, source: system, default: DEMANDED, description: "DEMANDED | SETTLED | CLOSED", constraints: "enum {DEMANDED, SETTLED, CLOSED}" }
      - { name: demand_amount_cents, type: integer, source: system, description: "Invoice amount_due_cents snapshot at escalation" }
      - { name: recovered_cents, type: integer, source: system, default: 0, description: "Gross settlement amount recorded" }
      - { name: legal_cost_cents, type: integer, source: system, default: 0, description: "Legal costs deducted first in the recovery split" }
      - { name: owner_share_cents, type: integer, source: computed, default: 0, description: "Remainder after legal costs and invoice application (see subrogation_recovery_split)" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: damage_case_id, type: string, source: input, description: "FK -> DamageCase.id; required for INCIDENT, must be null for QUARTERLY_SUMMARY", default: null }
      - { name: report_type, type: enum, source: input, description: "INCIDENT | QUARTERLY_SUMMARY", constraints: "enum {INCIDENT, QUARTERLY_SUMMARY}" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (QUARTERLY_SUMMARY only; closed interval)", default: null }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (QUARTERLY_SUMMARY only; closed interval, inclusive)", default: null }
      - { name: payload_notes, type: string, source: input, description: "Narrative body of the filing", default: "" }
      - { name: amends_report_id, type: string, source: input, description: "FK -> RegulatoryReport.id; self-reference set on the successor created by amend", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FILED | SUPERSEDED", constraints: "enum {DRAFT, FILED, SUPERSEDED}" }
      - { name: filed_at, type: datetime, source: system, default: null, description: "When filed (logical clock)" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "Whole days past the filing deadline; 0 when on time (deadline inclusive)" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "min(PENALTY_CAP, 5000 + 500 * days_late); 0 when on time" }

  - name: ViolationRecord
    parent: null
    common_fields: true
    fields:
      - { name: excavator_id, type: string, source: input, description: "FK -> Excavator.id" }
      - { name: damage_case_id, type: string, source: input, description: "FK -> DamageCase.id; the case the violation is tied to" }
      - { name: points, type: integer, source: computed, description: "Base points from case severity: MINOR 2, MAJOR 4, CRITICAL 6" }
      - { name: effective_points, type: integer, source: computed, description: "Decay-adjusted points at the logical clock: full <365d, floor(half) 365..1095d, 0 beyond (see repeat_offender_score)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | OVERTURNED", constraints: "enum {ACTIVE, OVERTURNED}" }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: course_code, type: string, source: input, description: "Unique course code", constraints: "unique across all TrainingCourses" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: required_for_status, type: enum, source: input, description: "Program band this course remediates: WATCH | PROBATION | SUSPENDED", constraints: "enum {WATCH, PROBATION, SUSPENDED}" }
      - { name: credit_hours, type: integer, source: input, description: "Credit hours; must be > 0" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: excavator_id, type: string, source: input, description: "FK -> Excavator.id" }
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | COMPLETED | EXPIRED", constraints: "enum {ASSIGNED, COMPLETED, EXPIRED}" }
      - { name: due_at, type: datetime, source: computed, description: "= created_at + 90 days; expiry sweep past this moves ASSIGNED to EXPIRED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "When completed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DamageCase
    initial_state: "REPORTED / UNBILLED (parallel dimensions investigation_status x recovery_status)"
    terminal_states: ["investigation_status=CLOSED", "recovery_status=RECOVERED"]
    note: "Two independent state dimensions on one entity; each has its own transitions and neither blocks the other except at close."
    transitions:
      - from: "investigation_status=REPORTED"
        to: "investigation_status=DOCUMENTING"
        trigger: "system (first EvidenceItem created for the case)"
        actor: system
        preconditions: ["case not CLOSED"]
        side_effects: ["DamageCase.evidence_count += 1", "DamageCase.version += 1"]
      - from: "investigation_status in {REPORTED, DOCUMENTING}"
        to: "investigation_status=INVESTIGATING"
        trigger: "POST /damage-recovery/damage-cases/{id}/begin-investigation"
        actor: DamageInvestigator
        preconditions: ["investigation_status in {REPORTED, DOCUMENTING} (else ERR_INVALID_STATE)"]
        side_effects: ["DamageCase.investigator_user_id = X-User-ID", "DamageCase.version += 1"]
      - from: "investigation_status=INVESTIGATING"
        to: "investigation_status=FAULT_PROPOSED"
        trigger: "system (linked FaultAllocation transitions DRAFT -> PROPOSED)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.version += 1"]
      - from: "investigation_status=FAULT_PROPOSED"
        to: "investigation_status=FAULT_FINAL"
        trigger: "system (linked FaultAllocation transitions PROPOSED -> FINAL via finalize)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.version += 1"]
      - from: "investigation_status=FAULT_PROPOSED"
        to: "investigation_status=INVESTIGATING"
        trigger: "system (linked FaultAllocation transitions CONTESTED -> DRAFT via revise)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.version += 1"]
      - from: "recovery_status=UNBILLED"
        to: "recovery_status=COSTING"
        trigger: "system (first CostLineItem created for the case)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.subtotal_cents recomputed", "DamageCase.version += 1"]
      - from: "recovery_status=COSTING"
        to: "recovery_status=INVOICED"
        trigger: "system (finalize creates this case's ClaimInvoices)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.total_invoiced_cents recomputed"]
      - from: "recovery_status=INVOICED"
        to: "recovery_status=COLLECTING"
        trigger: "system (first APPLIED payment leg lands on any of the case's invoices)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.total_recovered_cents recomputed"]
      - from: "recovery_status in {INVOICED, COLLECTING}"
        to: "recovery_status=RECOVERED"
        trigger: "system (every ClaimInvoice of the case reaches a terminal state {PAID, WRITTEN_OFF})"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.total_recovered_cents recomputed"]
      - from: "recovery_status=RECOVERED"
        to: "recovery_status=COLLECTING"
        trigger: "system (a payment reversal reopens an invoice of the case)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.total_recovered_cents recomputed"]
      - from: "investigation_status=FAULT_FINAL AND recovery_status=RECOVERED"
        to: "investigation_status=CLOSED"
        trigger: "POST /damage-recovery/damage-cases/{id}/close"
        actor: RecoveryManager
        preconditions:
          - "investigation_status == FAULT_FINAL AND recovery_status == RECOVERED"
          - "no INCIDENT RegulatoryReport for this case is in DRAFT"
          - "else ERR_CASE_NOT_CLOSABLE"
        side_effects: ["DamageCase.version += 1"]

  - entity: LocateTicket
    initial_state: OPEN
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "system (first LocateResponse submitted against the ticket)"
        actor: system
        preconditions: ["ticket.status == OPEN (response on EXPIRED ticket -> ERR_TICKET_EXPIRED)"]
        side_effects: ["LocateTicket.version += 1"]
      - from: OPEN
        to: EXPIRED
        trigger: "system (logical-clock sweep: current_utc > work_end_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: OPEN
        trigger: "POST /damage-recovery/locate-tickets/{id}/renew"
        actor: Excavator
        preconditions:
          - "ticket.status == OPEN (EXPIRED -> ERR_INVALID_STATE)"
          - "new_work_end_at > current work_end_at (else ERR_TICKET_WINDOW_INVALID)"
          - "extended window must not overlap another OPEN ticket of same (excavator_id, dig_site_address) (else ERR_TICKET_WINDOW_CONFLICT)"
        side_effects: ["work_end_at = new_work_end_at", "renewal_count += 1", "LocateTicket.version += 1"]
        note: "Self-loop renewal; renewals are reflected only in ticket fields, not reconstructed as timeline events."

  - entity: Locator
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /damage-recovery/locators/{id}/suspend"
        actor: RecoveryManager
        preconditions: ["contract_status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: LocateResponse
    initial_state: UNAUDITED
    terminal_states: [ACCURATE, INACCURATE]
    transitions:
      - from: UNAUDITED
        to: ACCURATE
        trigger: "POST /damage-recovery/locate-responses/{id}/audit {verdict: ACCURATE}"
        actor: DamageInvestigator
        preconditions: ["response.accuracy_verdict == UNAUDITED (else ERR_INVALID_STATE)"]
        side_effects: ["Locator.performance_score_bp recomputed", "Locator.total_responses unchanged (set at creation)"]
      - from: UNAUDITED
        to: INACCURATE
        trigger: "POST /damage-recovery/locate-responses/{id}/audit {verdict: INACCURATE}"
        actor: DamageInvestigator
        preconditions: ["response.accuracy_verdict == UNAUDITED (else ERR_INVALID_STATE)"]
        side_effects: ["Locator.performance_score_bp recomputed"]

  - entity: FaultAllocation
    initial_state: DRAFT
    terminal_states: [FINAL, SUPERSEDED]
    note: "Cyclic negotiation: PROPOSED -> CONTESTED -> DRAFT (revise) -> PROPOSED, any number of rounds."
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /damage-recovery/fault-allocations/{id}/propose"
        actor: DamageInvestigator
        preconditions:
          - "allocation.status == DRAFT (else ERR_INVALID_STATE)"
          - "case.investigation_status == INVESTIGATING (else ERR_INVALID_STATE)"
        side_effects:
          - "proposed_at = current_utc; contest_deadline_at = proposed_at + 10 days"
          - "DamageCase.investigation_status -> FAULT_PROPOSED"
          - "DamageCase.version += 1"
      - from: PROPOSED
        to: CONTESTED
        trigger: "POST /damage-recovery/fault-allocations/{id}/contest"
        actor: "Excavator | Locator | RecoveryManager"
        preconditions:
          - "allocation.status == PROPOSED (else ERR_INVALID_STATE — checked before temporal rules)"
          - "current_utc <= contest_deadline_at (else ERR_CONTEST_WINDOW_CLOSED)"
          - "Excavator/Locator caller's X-User-ID must appear as a shares[].party_id on this allocation (else ERR_OWNERSHIP_MISMATCH); RecoveryManager exempt"
        side_effects: ["FaultAllocation.version += 1"]
      - from: CONTESTED
        to: DRAFT
        trigger: "POST /damage-recovery/fault-allocations/{id}/revise"
        actor: DamageInvestigator
        preconditions: ["allocation.status == CONTESTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "revision_no += 1; proposed_at = null; contest_deadline_at = null"
          - "if shares provided in revise payload they replace shares (must still sum to 10000)"
          - "DamageCase.investigation_status -> INVESTIGATING; DamageCase.version += 1"
          - "FaultAllocation.version += 1"
      - from: PROPOSED
        to: FINAL
        trigger: "POST /damage-recovery/fault-allocations/{id}/finalize"
        actor: RecoveryManager
        preconditions:
          - "allocation.status == PROPOSED (else ERR_INVALID_STATE)"
          - "caller X-User-ID != case.investigator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "case.evidence_count >= 1 (else ERR_NO_SCENE_EVIDENCE)"
          - "case.subtotal_cents <= INVOICE_AUTHORITY_CAP_CENTS unless override_authority_cap=true (else ERR_INVOICE_AUTHORITY_CAP_EXCEEDED)"
        side_effects:
          - "DamageCase.investigation_status -> FAULT_FINAL; recovery_status -> INVOICED"
          - "create one ClaimInvoice (DRAFT) per share with share_bp > 0 via allocation_distribution"
          - "if excavator share_bp >= 5000: create ViolationRecord for case.excavator_id (points from case.severity)"
          - "that ViolationRecord creation triggers repeat_offender_score recompute"
          - "score recompute applies program band; entering PROBATION/SUSPENDED auto-creates TrainingAssignment(s)"
          - "DamageCase.version += 1; FaultAllocation.version += 1"
      - from: "DRAFT | PROPOSED | CONTESTED"
        to: SUPERSEDED
        trigger: "system (a new FaultAllocation is created for the same case)"
        actor: system
        preconditions: []
        side_effects: ["new allocation.supersedes_allocation_id = old allocation id"]

  - entity: ClaimInvoice
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /damage-recovery/claim-invoices/{id}/issue"
        actor: ClaimsAdjuster
        preconditions: ["invoice.status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["issued_at = current_utc; due_at = issued_at + 30 days", "debtor total_outstanding_cents recomputed"]
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "system (APPLIED payment leg with 0 < amount_paid_cents < invoiced_cents)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase.recovery_status -> COLLECTING if INVOICED"]
      - from: "ISSUED | PARTIALLY_PAID"
        to: PAID
        trigger: "system (amount_paid_cents reaches invoiced_cents)"
        actor: system
        preconditions: []
        side_effects: ["DamageCase recovery totals recomputed; case may auto-advance to RECOVERED"]
      - from: "ISSUED | PARTIALLY_PAID"
        to: DISPUTED
        trigger: "system (Dispute opened with target_type=CLAIM_INVOICE on this invoice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: "ISSUED | PARTIALLY_PAID | PAID"
        trigger: "system (all open disputes on this invoice reach terminal {RESOLVED, EXPIRED, ESCALATED-with-settlement})"
        actor: system
        preconditions: []
        side_effects: ["status recomputed from amount_paid_cents: 0 -> ISSUED; 0<paid<invoiced -> PARTIALLY_PAID; paid==invoiced -> PAID"]
      - from: "PARTIALLY_PAID | PAID | DISPUTED"
        to: "ISSUED | PARTIALLY_PAID"
        trigger: "system (payment reversal reduces amount_paid_cents)"
        actor: system
        preconditions: []
        side_effects: ["status recomputed from amount_paid_cents", "DamageCase.recovery_status RECOVERED -> COLLECTING if applicable"]
      - from: "ISSUED | PARTIALLY_PAID"
        to: WRITTEN_OFF
        trigger: "POST /damage-recovery/claim-invoices/{id}/write-off"
        actor: RecoveryManager
        preconditions:
          - "invoice.status in {ISSUED, PARTIALLY_PAID} (else ERR_INVALID_STATE)"
          - "no Dispute on this invoice in {OPEN, UNDER_REVIEW, COUNTERED} (else ERR_INVOICE_HAS_OPEN_DISPUTE)"
          - "amount_due_cents <= WRITE_OFF_MAX_CENTS (else ERR_WRITE_OFF_CAP_EXCEEDED)"
        side_effects: ["remaining amount_due_cents forgiven", "debtor total_outstanding_cents recomputed", "DamageCase may auto-advance to RECOVERED"]

  - entity: Payment
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /damage-recovery/payments/{id}/reverse"
        actor: RecoveryManager
        preconditions: ["payment.status == APPLIED (else ERR_INVALID_STATE)"]
        side_effects:
          - "undo every allocation leg: each targeted ClaimInvoice.amount_paid_cents reduced, status recomputed"
          - "payer credit_balance_cents reduced by any remainder leg this payment created"
          - "DamageCase.recovery_status recomputed (RECOVERED -> COLLECTING if a terminal invoice reopens)"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED, EXPIRED]
    note: "Cyclic negotiation: OPEN -> UNDER_REVIEW -> COUNTERED -> UNDER_REVIEW ... with rounds counting adjuster responses."
    transitions:
      - from: "OPEN | COUNTERED"
        to: UNDER_REVIEW
        trigger: "POST /damage-recovery/disputes/{id}/respond"
        actor: ClaimsAdjuster
        preconditions: ["dispute.status in {OPEN, COUNTERED} (else ERR_INVALID_STATE)"]
        side_effects: ["rounds += 1", "Dispute.version += 1"]
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /damage-recovery/disputes/{id}/counter"
        actor: "Excavator | Locator"
        preconditions:
          - "dispute.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "caller X-User-ID == dispute.filed_by_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["Dispute.version += 1"]
      - from: "UNDER_REVIEW | COUNTERED"
        to: RESOLVED
        trigger: "POST /damage-recovery/disputes/{id}/accept-resolution"
        actor: "Excavator | Locator"
        preconditions:
          - "dispute.status in {UNDER_REVIEW, COUNTERED} (else ERR_INVALID_STATE)"
          - "caller X-User-ID == dispute.filed_by_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["target ClaimInvoice leaves DISPUTED; status recomputed from amount_paid_cents"]
      - from: "OPEN | UNDER_REVIEW | COUNTERED"
        to: ESCALATED
        trigger: "POST /damage-recovery/disputes/{id}/escalate"
        actor: "ClaimsAdjuster | RecoveryManager"
        preconditions: ["dispute.status in {OPEN, UNDER_REVIEW, COUNTERED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "create SubrogationCase (DEMANDED) with dispute_id, claim_invoice_id (when target is an invoice), target party = invoice debtor, demand_amount_cents = invoice.amount_due_cents"
      - from: OPEN
        to: EXPIRED
        trigger: "system (logical-clock sweep: OPEN and current_utc > response_deadline_at)"
        actor: system
        preconditions: []
        side_effects: ["target ClaimInvoice leaves DISPUTED; status recomputed from amount_paid_cents"]

  - entity: SubrogationCase
    initial_state: DEMANDED
    terminal_states: [CLOSED]
    transitions:
      - from: DEMANDED
        to: SETTLED
        trigger: "POST /damage-recovery/subrogation-cases/{id}/record-settlement"
        actor: RecoveryManager
        preconditions:
          - "subrogation.status == DEMANDED (else ERR_INVALID_STATE)"
          - "legal_cost_cents <= recovered_cents (else ERR_INVALID_REQUEST)"
        side_effects: ["subrogation_recovery_split waterfall applies", "SubrogationCase.version += 1"]
      - from: "DEMANDED | SETTLED"
        to: CLOSED
        trigger: "POST /damage-recovery/subrogation-cases/{id}/close"
        actor: RecoveryManager
        preconditions: ["subrogation.status in {DEMANDED, SETTLED} (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /damage-recovery/regulatory-reports/{id}/file"
        actor: ClaimsAdjuster
        preconditions: ["report.status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["filed_at = current_utc", "days_late and penalty_cents computed via late_filing_penalty"]
      - from: FILED
        to: SUPERSEDED
        trigger: "system (POST /damage-recovery/regulatory-reports/{id}/amend creates the successor DRAFT)"
        actor: system
        preconditions: ["report.status == FILED (amend on DRAFT or SUPERSEDED -> ERR_AMEND_CHAIN_BROKEN)"]
        side_effects: ["successor RegulatoryReport created in DRAFT with amends_report_id = this report id, same report_type/damage_case_id/period fields"]

  - entity: ViolationRecord
    initial_state: ACTIVE
    terminal_states: [OVERTURNED]
    transitions:
      - from: ACTIVE
        to: OVERTURNED
        trigger: "POST /damage-recovery/violation-records/{id}/overturn"
        actor: RecoveryManager
        preconditions: ["violation.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Excavator.offender_points recomputed (program_status NOT re-banded until next evaluate-program)"]

  - entity: Excavator
    initial_state: GOOD_STANDING
    terminal_states: []
    note: "Threshold-band machine driven by evaluate-program; upgrades free, downgrades gated by training."
    transitions:
      - from: "GOOD_STANDING | WATCH | PROBATION | SUSPENDED"
        to: "WATCH | PROBATION | SUSPENDED (worse band)"
        trigger: "POST /damage-recovery/excavators/{id}/evaluate-program (also runs automatically inside finalize's violation cascade)"
        actor: "RecoveryManager | system"
        preconditions: []
        side_effects:
          - "offender_points recomputed via repeat_offender_score"
          - "band assignment: points >= 18 -> SUSPENDED; >= 12 -> PROBATION; >= 6 -> WATCH; else GOOD_STANDING"
          - "entering PROBATION or SUSPENDED from a better band auto-creates one TrainingAssignment per matching course (selector below)"
      - from: "WATCH | PROBATION | SUSPENDED"
        to: "better band per repeat_offender_score"
        trigger: "POST /damage-recovery/excavators/{id}/evaluate-program"
        actor: RecoveryManager
        preconditions:
          - "leaving PROBATION or SUSPENDED requires: every TrainingAssignment for this excavator whose course.required_for_status == current band is COMPLETED; otherwise program_status holds (no error, response shows unchanged status)"
        side_effects: ["offender_points recomputed"]

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /damage-recovery/training-assignments/{id}/complete"
        actor: Excavator
        preconditions:
          - "assignment.status == ASSIGNED (else ERR_INVALID_STATE)"
          - "caller X-User-ID == assignment.excavator_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["completed_at = current_utc"]
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (logical-clock sweep: current_utc > due_at)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: fault-allocation-create-stale-case
    parent_entity: DamageCase
    write_endpoint: "POST /damage-recovery/fault-allocations"
    occ_field: expected_damage_case_version
    description: |
      Creating a FaultAllocation against a DamageCase whose version has advanced
      since the client last observed it is rejected. Creating an allocation
      legitimately supersedes the case's prior non-FINAL allocation and mutates
      the case (version bump), so a writer holding a stale case version must
      re-observe before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: repair_cost_compilation
    trigger: "CostLineItem create; recompute on delete of a sibling line is not needed (per-line rule)"
    algorithm: tiered_pricing
    formula: |
      markup_pct = MARKUP_PCT[category]            # category branch
      emergency_mult = 1.25 if case.severity == CRITICAL else 1.00
      raw = quantity * unit_cost_cents * (1 + markup_pct) * emergency_mult
      line_total_cents = min(LINE_CAP_CENTS, round_half_up(raw))
    input_set: "the new CostLineItem plus its DamageCase.severity; rounding applied once, at the final multiply"
    constants:
      MARKUP_PCT: { LABOR: 0.15, MATERIAL: 0.10, EQUIPMENT: 0.12, RESTORATION: 0.08 }
      EMERGENCY_MULT_CRITICAL: 1.25
      LINE_CAP_CENTS: 500000
    precision: "integer cents, round_half_up at the final multiply only"

  - name: fault_share_default
    trigger: "FaultAllocation create when shares is omitted"
    algorithm: constraint_propagation
    formula: |
      DEFAULT_SHARES[root_cause_code]:
        NO_TICKET        -> [{EXCAVATOR, 10000}]
        EXPIRED_TICKET   -> [{EXCAVATOR, 8000}, {FACILITY_OWNER, 2000}]
        MISMARK          -> [{LOCATOR, 7000}, {EXCAVATOR, 3000}]
        LOCATE_LATE      -> [{LOCATOR, 6000}, {EXCAVATOR, 4000}]
        OWNER_ABANDONED  -> [{FACILITY_OWNER, 10000}]
      party_id for EXCAVATOR = case.excavator_id; for LOCATOR = locator_id of the
      earliest-created LocateResponse on the case's linked ticket (null if none);
      for FACILITY_OWNER = null.
    input_set: "DamageCase row + root_cause_code"
    constants: {}
    precision: "basis points, integers summing to 10000"
    variants:
      - name: rule_based_default
        when: "shares omitted on create"
        difference: "shares come from the DEFAULT_SHARES table; basis = RULE_DEFAULT"
      - name: adjudicated
        when: "shares supplied on create (must sum to exactly 10000)"
        difference: "shares taken verbatim from the investigator; basis = ADJUDICATED; identical case data yields different per-party invoices than rule_based_default"

  - name: allocation_distribution
    trigger: "FaultAllocation finalize"
    algorithm: waterfall_allocation
    formula: |
      subtotal = case.subtotal_cents   (integer; line totals were rounded per line BEFORE this sum)
      shares with share_bp == 0 are skipped (no invoice)
      largest = share with max share_bp; tie -> lowest index in the allocation's shares array
      for each share except largest:
        invoiced_i = round_half_up(subtotal * share_bp_i / 10000)     # round AFTER the multiply
      invoiced_largest = subtotal - sum(invoiced_i for i != largest)  # remainder absorption
      Conservation: sum over created invoices of invoiced_cents == case.subtotal_cents exactly.
    input_set: "the finalized FaultAllocation's shares and the case's current subtotal_cents"
    constants: {}
    precision: "integer cents; nested rounding order pinned: per-line rounding first, allocation rounding second; per-line allocation is FORBIDDEN (would drift cents)"

  - name: claim_amount_basis
    trigger: "ClaimInvoice creation at finalize (both variants computed and stored)"
    algorithm: aggregation
    formula: |
      actual_basis_cents(case)   = sum of line_total_cents over the case's CostLineItems
      standard_basis_cents(case) = sum over the case's CostLineItems of
          min(LINE_CAP_CENTS, round_half_up(quantity * STANDARD_UNIT_RATES[category]
              * (1 + MARKUP_PCT[category]) * emergency_mult))
      per invoice: invoiced_cents       = allocation_distribution over actual_basis_cents
                   standard_basis_cents = allocation_distribution over standard_basis_cents
    input_set: "all CostLineItems of the case at finalize time"
    constants:
      STANDARD_UNIT_RATES: { LABOR: 9500, MATERIAL: 4000, EQUIPMENT: 15000, RESTORATION: 6000 }
    precision: "integer cents, same rounding rules as allocation_distribution"
    variants:
      - name: actual_cost_basis
        when: "always billed (invoiced_cents)"
        difference: "uses submitted unit_cost_cents"
      - name: standard_cost_basis
        when: "always computed alongside (standard_basis_cents), surfaced for audit comparison"
        difference: "substitutes STANDARD_UNIT_RATES for submitted unit costs; identical inputs yield a different total whenever any submitted unit cost differs from the standard rate"

  - name: repeat_offender_score
    trigger: "ViolationRecord create, violation overturn, evaluate-program, logical-clock sweep"
    algorithm: decay_function
    formula: |
      for each ViolationRecord of the excavator with status == ACTIVE:
        base = POINTS[case.severity]            # MINOR 2, MAJOR 4, CRITICAL 6
        age_days = floor((current_utc - violation.created_at) / 86400)
        effective = base                     if age_days < 365
                  = floor(base / 2)          if 365 <= age_days <= 1095
                  = 0                        if age_days > 1095
      offender_points = sum(effective)
      band: offender_points >= 18 -> SUSPENDED; >= 12 -> PROBATION; >= 6 -> WATCH; else GOOD_STANDING
    input_set: "ViolationRecords of the excavator with status == ACTIVE only; OVERTURNED excluded"
    constants:
      POINTS: { MINOR: 2, MAJOR: 4, CRITICAL: 6 }
      WATCH_THRESHOLD: 6
      PROBATION_THRESHOLD: 12
      SUSPENDED_THRESHOLD: 18
      HALF_LIFE_DAYS: 365
      ZERO_DAYS: 1095
    precision: "integer points; boundaries inclusive (>=)"

  - name: late_filing_penalty
    trigger: "RegulatoryReport file"
    algorithm: threshold
    formula: |
      deadline = (INCIDENT ? case.occurred_at : report.period_end) + 30 days
      if filed_at <= deadline: days_late = 0, penalty_cents = 0        # boundary inclusive
      else: days_late = floor((filed_at - deadline) / 86400)           # at least 1
            penalty_cents = min(PENALTY_CAP_CENTS, BASE_CENTS + PER_DAY_CENTS * days_late)
    input_set: "the report being filed, its case (INCIDENT) or period (QUARTERLY_SUMMARY)"
    constants:
      BASE_CENTS: 5000
      PER_DAY_CENTS: 500
      PENALTY_CAP_CENTS: 100000
      FILING_WINDOW_DAYS: 30
    precision: "integer cents and whole days"

  - name: payment_waterfall_allocation
    trigger: "Payment create without claim_invoice_id"
    algorithm: waterfall_allocation
    formula: |
      candidates = payer's ClaimInvoices with status in {ISSUED, PARTIALLY_PAID}
      order: due_at ASC, tie -> created_at ASC
      walk candidates in order; leg_i = min(remaining, invoice.amount_due_cents)
      fill each invoice to zero due before moving to the next
      remainder after all candidates -> payer entity credit_balance_cents += remainder
      explicit-invoice payment (claim_invoice_id given): single leg of the full amount,
      must be <= invoice.amount_due_cents else ERR_PAYMENT_EXCEEDS_BALANCE
    input_set: "payer's invoices filtered to status in {ISSUED, PARTIALLY_PAID}; DISPUTED/DRAFT/PAID/WRITTEN_OFF excluded"
    constants: {}
    precision: "integer cents"

  - name: timeline_reconstruction
    trigger: "POST /damage-recovery/damage-cases/{id}/reconstruct-timeline"
    algorithm: chronological
    formula: |
      delete any prior TimelineEvents of the case, then rebuild:
      sources = linked LocateTicket (TICKET_SUBMITTED at ticket.created_at;
                renewals are not event-sourced, only reflected in ticket fields),
                every LocateResponse of that ticket (RESPONSE_SUBMITTED at marks_completed_at),
                every EvidenceItem of the case (EVIDENCE_CAPTURED at captured_at),
                the case itself (DAMAGE_OCCURRED at occurred_at)
      sort: event_at ASC, tie -> source record created_at ASC, tie -> event_kind enum order
            (TICKET_SUBMITTED < RESPONSE_SUBMITTED < EVIDENCE_CAPTURED < DAMAGE_OCCURRED)
      flags (written to the event and unioned onto case.reconstruction_flags):
        NO_TICKET         -> no linked ticket (case-level flag, no event)
        LATE_MARK         -> RESPONSE_SUBMITTED with event_at > ticket.work_start_at
        STALE_MARKS       -> RESPONSE_SUBMITTED with event_at < case.occurred_at - 14 days
        POST_DAMAGE_MARK  -> RESPONSE_SUBMITTED with event_at > case.occurred_at
      requires at least one source record else ERR_TIMELINE_EMPTY
    input_set: "linked ticket, its responses, case evidence items, the case row"
    constants:
      STALE_MARKS_DAYS: 14
    precision: "UTC datetimes compared exactly"

  - name: subrogation_recovery_split
    trigger: "SubrogationCase record-settlement"
    algorithm: waterfall_allocation
    formula: |
      net = recovered_cents - legal_cost_cents                 # legal costs off the top
      if claim_invoice_id is set:
        apply = min(net, invoice.amount_due_cents)
        invoice.amount_paid_cents += apply; invoice.status recomputed
        remainder = net - apply
      else: remainder = net
      owner_share_cents = remainder                            # utility general fund
      Conservation: apply + legal_cost_cents + owner_share_cents == recovered_cents.
    input_set: "the SubrogationCase and its linked ClaimInvoice"
    constants: {}
    precision: "integer cents"

  - name: locator_performance_score
    trigger: "LocateResponse audit"
    algorithm: aggregation
    formula: |
      audited = responses of the locator with accuracy_verdict in {ACCURATE, INACCURATE}
      performance_score_bp = 10000 if audited is empty
                           else floor(10000 * count(ACCURATE) / count(audited))
    input_set: "all LocateResponses of the locator regardless of ticket"
    constants: {}
    precision: "integer basis points, floor"

  - name: training_assignment_selector
    trigger: "Excavator band upgrade to PROBATION or SUSPENDED (inside repeat_offender_score application)"
    algorithm: selector
    formula: |
      candidates = TrainingCourses with required_for_status == new band
      assign ALL candidates in course_code ASC order (deterministic; course_code is a natural key)
      empty candidate set -> no assignment created (no error)
      skip candidates already having an ASSIGNED assignment for this excavator (no duplicates)
    input_set: "all TrainingCourses"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "entity-backed ownership: Excavator/Locator callers act only on their own resources (ticket excavator_id, response locator_id, payment payer_id, dispute filer, contest party membership, assignment excavator_id)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /locate-tickets, /locate-tickets/{id}/renew, /locate-responses, /payments, /disputes, /disputes/{id}/counter, /disputes/{id}/accept-resolution, /fault-allocations/{id}/contest, /training-assignments/{id}/complete"
  - priority: 4
    category: existence
    check: "every id in path and body resolves (damage_case_id, locate_ticket_id, shares[].party_id, course_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "target resource state permits the transition (incl. renew only from OPEN, contest only from PROPOSED, finalize only from PROPOSED, create allocation only while case INVESTIGATING, cost lines only before CLOSED, dispute target invoice ISSUED/PARTIALLY_PAID)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 6
    category: business_safety
    check: "segregation of duties: finalize caller X-User-ID != case.investigator_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /fault-allocations/{id}/finalize"
  - priority: 7
    category: business_temporal
    check: "temporal rules: contest within contest_deadline_at (ERR_CONTEST_WINDOW_CLOSED); evidence captured_at <= occurred_at + 72h (ERR_EVIDENCE_INADMISSIBLE); link-ticket requires occurred_at in [work_start_at, work_end_at) of a COMPLETED ticket (ERR_DAMAGE_OUTSIDE_TICKET_WINDOW); response on EXPIRED ticket (ERR_TICKET_EXPIRED)"
    error_id: "ERR_CONTEST_WINDOW_CLOSED | ERR_EVIDENCE_INADMISSIBLE | ERR_DAMAGE_OUTSIDE_TICKET_WINDOW | ERR_TICKET_EXPIRED"
    http_status: 409
    applies_to: "contest, evidence create, link-ticket, locate-response create"
  - priority: 8
    category: business_referential
    check: "referential integrity: dispute target_type must match target_id's entity (ERR_DISPUTE_TARGET_MISMATCH); amend only on FILED report (ERR_AMEND_CHAIN_BROKEN); response locator must be ACTIVE (ERR_LOCATOR_INACTIVE)"
    error_id: "ERR_DISPUTE_TARGET_MISMATCH | ERR_AMEND_CHAIN_BROKEN | ERR_LOCATOR_INACTIVE"
    http_status: 422
    applies_to: "dispute create, report amend, response create"
  - priority: 9
    category: business_constraint
    check: "structural constraints: shares sum exactly 10000 (ERR_SHARES_MUST_SUM_10000); work_end_at > work_start_at (ERR_TICKET_WINDOW_INVALID); no OPEN-ticket overlap per (excavator_id, dig_site_address) (ERR_TICKET_WINDOW_CONFLICT); no QUARTERLY period overlap (ERR_REPORT_PERIOD_OVERLAP); one open dispute per target (ERR_DISPUTE_ALREADY_OPEN); finalize requires evidence_count >= 1 (ERR_NO_SCENE_EVIDENCE); reconstruct requires >= 1 source record (ERR_TIMELINE_EMPTY); SUSPENDED excavator cannot create tickets (ERR_PROGRAM_SUSPENDED); duplicate course_code (ERR_DUPLICATE_COURSE_CODE)"
    error_id: "ERR_SHARES_MUST_SUM_10000 | ERR_TICKET_WINDOW_INVALID | ERR_TICKET_WINDOW_CONFLICT | ERR_REPORT_PERIOD_OVERLAP | ERR_DISPUTE_ALREADY_OPEN | ERR_NO_SCENE_EVIDENCE | ERR_TIMELINE_EMPTY | ERR_PROGRAM_SUSPENDED | ERR_DUPLICATE_COURSE_CODE"
    http_status: 422
    applies_to: "allocation create/revise, ticket create/renew, quarterly report create, dispute create, finalize, reconstruct, ticket create, course create"
  - priority: 10
    category: business_fiscal
    check: "fiscal limits: finalize blocked when case.subtotal_cents > INVOICE_AUTHORITY_CAP_CENTS unless override (ERR_INVOICE_AUTHORITY_CAP_EXCEEDED); write-off only when amount_due_cents <= WRITE_OFF_MAX_CENTS (ERR_WRITE_OFF_CAP_EXCEEDED); explicit-invoice payment must be <= amount_due_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
    error_id: "ERR_INVOICE_AUTHORITY_CAP_EXCEEDED | ERR_WRITE_OFF_CAP_EXCEEDED | ERR_PAYMENT_EXCEEDS_BALANCE"
    http_status: 409
    applies_to: "finalize, write-off, payment create"
  - priority: 11
    category: business_constraint
    check: "OCC: expected_damage_case_version must equal DamageCase.version on fault-allocation create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fault-allocations"
  - priority: 12
    category: business_constraint
    check: "close gate: case close requires FAULT_FINAL + RECOVERED + no DRAFT incident reports"
    error_id: ERR_CASE_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /damage-cases/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/damage-recovery/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Startup default before any call is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time. Setting the clock also runs the expiry sweep: OPEN LocateTickets past work_end_at -> EXPIRED, OPEN Disputes past response_deadline_at -> EXPIRED, ASSIGNED TrainingAssignments past due_at -> EXPIRED."
    roles: [RecoveryManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["expiry sweep for tickets, disputes, training assignments"]

  # --- Excavator ---
  - method: POST
    path: "/damage-recovery/excavators"
    description: "Register an excavating contractor"
    roles: [RecoveryManager]
    code: 201
    input: [company_name, contact_email]
    output: Excavator
    side_effects: ["program_status=GOOD_STANDING, offender_points=0"]

  - method: GET
    path: "/damage-recovery/excavators/{id}"
    description: "Get an excavator (includes computed offender_points, credit_balance_cents, total_outstanding_cents)"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: Excavator
    side_effects: []

  - method: GET
    path: "/damage-recovery/excavators"
    description: "List excavators"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["program_status?", "limit?", "offset?"]
    output: "Excavator[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/excavators/{id}/evaluate-program"
    description: "Recompute repeat-offender score and apply band (downgrades gated by completed remediation training; holds silently when unmet)"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: Excavator
    side_effects: ["repeat_offender_score recompute", "band transition", "possible TrainingAssignment auto-creation"]

  # --- Locator ---
  - method: POST
    path: "/damage-recovery/locators"
    description: "Register a locating contractor"
    roles: [RecoveryManager]
    code: 201
    input: [company_name, contact_email, contract_region]
    output: Locator
    side_effects: ["contract_status=ACTIVE, performance_score_bp=10000"]

  - method: GET
    path: "/damage-recovery/locators"
    description: "List locators"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["contract_status?", "limit?", "offset?"]
    output: "Locator[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/locators/{id}/suspend"
    description: "Suspend a locator's contract; suspended locators cannot submit responses"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: Locator
    side_effects: ["contract_status -> SUSPENDED"]

  # --- LocateTicket ---
  - method: POST
    path: "/damage-recovery/locate-tickets"
    description: "File an 811-style locate ticket; half-open dig window [work_start_at, work_end_at); overlap with another OPEN ticket of same (excavator_id, dig_site_address) rejected; adjacency allowed"
    roles: [Excavator]
    code: 201
    input: [excavator_id, dig_site_address, work_start_at, work_end_at]
    output: LocateTicket
    side_effects: ["status=OPEN", "ownership: excavator_id must equal X-User-ID", "ERR_PROGRAM_SUSPENDED if excavator SUSPENDED", "ERR_TICKET_WINDOW_INVALID / ERR_TICKET_WINDOW_CONFLICT"]

  - method: GET
    path: "/damage-recovery/locate-tickets/{id}"
    description: "Get a locate ticket"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: LocateTicket
    side_effects: []

  - method: GET
    path: "/damage-recovery/locate-tickets"
    description: "List locate tickets"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["excavator_id?", "status?", "dig_site_address?", "limit?", "offset?"]
    output: "LocateTicket[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/locate-tickets/{id}/renew"
    description: "Extend the dig window of an OPEN ticket (self-loop; renewal_count += 1)"
    roles: [Excavator]
    code: 200
    input: [new_work_end_at]
    output: LocateTicket
    side_effects: ["work_end_at extended", "renewal_count += 1", "version += 1"]

  # --- LocateResponse ---
  - method: POST
    path: "/damage-recovery/locate-responses"
    description: "Locator submits a marking response against a ticket"
    roles: [Locator]
    code: 201
    input: [locate_ticket_id, locator_id, response_code, marks_completed_at, "notes?"]
    output: LocateResponse
    side_effects: ["ticket -> COMPLETED", "Locator.total_responses += 1", "ownership: locator_id must equal X-User-ID", "ERR_TICKET_EXPIRED if ticket EXPIRED", "ERR_LOCATOR_INACTIVE if locator SUSPENDED"]

  - method: GET
    path: "/damage-recovery/locate-responses/{id}"
    description: "Get a locate response"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: LocateResponse
    side_effects: []

  - method: GET
    path: "/damage-recovery/locate-responses"
    description: "List locate responses (reverse lookup from ticket or locator)"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["locate_ticket_id?", "locator_id?", "accuracy_verdict?", "limit?", "offset?"]
    output: "LocateResponse[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/locate-responses/{id}/audit"
    description: "Investigator audits marking accuracy; feeds locator performance score"
    roles: [DamageInvestigator]
    code: 200
    input: [verdict]
    output: LocateResponse
    side_effects: ["accuracy_verdict set", "Locator.performance_score_bp recomputed"]

  # --- DamageCase ---
  - method: POST
    path: "/damage-recovery/damage-cases"
    description: "Intake an excavation damage report"
    roles: [IntakeCoordinator]
    code: 201
    input: [excavator_id, dig_site_address, facility_type, severity, occurred_at, "locate_ticket_id?"]
    output: DamageCase
    side_effects: ["investigation_status=REPORTED, recovery_status=UNBILLED", "case_number minted"]

  - method: GET
    path: "/damage-recovery/damage-cases/{id}"
    description: "Get a damage case (includes computed totals and both status dimensions)"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: DamageCase
    side_effects: []

  - method: GET
    path: "/damage-recovery/damage-cases"
    description: "List damage cases"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["excavator_id?", "locate_ticket_id?", "investigation_status?", "recovery_status?", "severity?", "limit?", "offset?"]
    output: "DamageCase[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/damage-cases/{id}/link-ticket"
    description: "Link a COMPLETED locate ticket; damage must have occurred inside the ticket window"
    roles: [IntakeCoordinator, DamageInvestigator]
    code: 200
    input: [locate_ticket_id]
    output: DamageCase
    side_effects: ["locate_ticket_id set", "ERR_INVALID_STATE unless ticket COMPLETED", "ERR_DAMAGE_OUTSIDE_TICKET_WINDOW if occurred_at outside [work_start_at, work_end_at)", "version += 1"]

  - method: POST
    path: "/damage-recovery/damage-cases/{id}/begin-investigation"
    description: "Claim the investigation; records investigator_user_id from X-User-ID (segregation-of-duties anchor)"
    roles: [DamageInvestigator]
    code: 200
    input: []
    output: DamageCase
    side_effects: ["investigation_status -> INVESTIGATING", "investigator_user_id = X-User-ID", "version += 1"]

  - method: POST
    path: "/damage-recovery/damage-cases/{id}/reconstruct-timeline"
    description: "Rebuild the case's TimelineEvents chronologically and set reconstruction_flags"
    roles: [DamageInvestigator]
    code: 200
    input: []
    output: { created_event_count: integer, reconstruction_flags: "array" }
    side_effects: ["TimelineEvents rebuilt", "case.reconstruction_flags recomputed", "ERR_TIMELINE_EMPTY if no source records"]

  - method: POST
    path: "/damage-recovery/damage-cases/{id}/close"
    description: "Close a fully resolved case"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: DamageCase
    side_effects: ["investigation_status -> CLOSED", "ERR_CASE_NOT_CLOSABLE unless FAULT_FINAL + RECOVERED + no DRAFT incident reports"]

  # --- EvidenceItem ---
  - method: POST
    path: "/damage-recovery/evidence-items"
    description: "Add scene documentation; captured_at must be <= case.occurred_at + 72h"
    roles: [IntakeCoordinator, DamageInvestigator]
    code: 201
    input: [damage_case_id, evidence_type, captured_at, description]
    output: EvidenceItem
    side_effects: ["first evidence moves case REPORTED -> DOCUMENTING", "case.evidence_count += 1", "case.version += 1", "ERR_EVIDENCE_INADMISSIBLE past the 72h window", "ERR_INVALID_STATE if case CLOSED"]

  - method: GET
    path: "/damage-recovery/evidence-items/{id}"
    description: "Get an evidence item"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  - method: GET
    path: "/damage-recovery/evidence-items"
    description: "List evidence items"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["damage_case_id?", "evidence_type?", "limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []

  # --- TimelineEvent ---
  - method: GET
    path: "/damage-recovery/timeline-events/{id}"
    description: "Get a timeline event"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: TimelineEvent
    side_effects: []

  - method: GET
    path: "/damage-recovery/timeline-events"
    description: "List timeline events (chronological per case)"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["damage_case_id?", "event_kind?", "limit?", "offset?"]
    output: "TimelineEvent[]"
    side_effects: []

  # --- FaultAllocation ---
  - method: POST
    path: "/damage-recovery/fault-allocations"
    description: "Create a fault allocation for a case under OCC; supersedes the case's prior non-FINAL allocation; omitting shares selects the RULE_DEFAULT basis from root_cause_code"
    roles: [DamageInvestigator]
    code: 201
    input: [damage_case_id, root_cause_code, expected_damage_case_version, "shares?"]
    output: FaultAllocation
    side_effects: ["prior non-FINAL allocation -> SUPERSEDED", "increments DamageCase.version by 1", "ERR_INVALID_STATE unless case INVESTIGATING", "ERR_STALE_VERSION on version mismatch", "ERR_SHARES_MUST_SUM_10000 when shares supplied but mis-summed"]

  - method: GET
    path: "/damage-recovery/fault-allocations/{id}"
    description: "Get a fault allocation"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: FaultAllocation
    side_effects: []

  - method: GET
    path: "/damage-recovery/fault-allocations"
    description: "List fault allocations"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["damage_case_id?", "supersedes_allocation_id?", "status?", "limit?", "offset?"]
    output: "FaultAllocation[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/fault-allocations/{id}/propose"
    description: "Propose a DRAFT allocation to the named parties"
    roles: [DamageInvestigator]
    code: 200
    input: []
    output: FaultAllocation
    side_effects: ["status -> PROPOSED", "proposed_at set; contest_deadline_at = proposed_at + 10 days", "case -> FAULT_PROPOSED", "case.version += 1"]

  - method: POST
    path: "/damage-recovery/fault-allocations/{id}/contest"
    description: "A named party contests within the 10-day window"
    roles: [Excavator, Locator, RecoveryManager]
    code: 200
    input: ["contest_note?"]
    output: FaultAllocation
    side_effects: ["status -> CONTESTED", "ERR_CONTEST_WINDOW_CLOSED past deadline", "ERR_OWNERSHIP_MISMATCH if caller not a named party (manager exempt)"]

  - method: POST
    path: "/damage-recovery/fault-allocations/{id}/revise"
    description: "Investigator revises a CONTESTED allocation back to DRAFT (cycle; revision_no += 1)"
    roles: [DamageInvestigator]
    code: 200
    input: ["root_cause_code?", "shares?"]
    output: FaultAllocation
    side_effects: ["status -> DRAFT", "revision_no += 1", "shares replaced if supplied (must sum 10000)"]

  - method: POST
    path: "/damage-recovery/fault-allocations/{id}/finalize"
    description: "Manager finalizes a PROPOSED allocation; creates party invoices and the repeat-offender cascade"
    roles: [RecoveryManager]
    code: 200
    input: ["override_authority_cap?"]
    output: FaultAllocation
    side_effects: ["status -> FINAL", "ClaimInvoices (DRAFT) created via allocation_distribution", "case -> FAULT_FINAL + INVOICED", "ViolationRecord when excavator share >= 5000 bp", "program band recompute with training cascade", "ERR_SEGREGATION_OF_DUTIES when caller is the case investigator"]

  # --- CostLineItem ---
  - method: POST
    path: "/damage-recovery/cost-line-items"
    description: "Add a repair cost line; line_total_cents computed server-side"
    roles: [ClaimsAdjuster]
    code: 201
    input: [damage_case_id, category, description, quantity, unit_cost_cents]
    output: CostLineItem
    side_effects: ["first line moves case UNBILLED -> COSTING", "case.subtotal_cents recomputed", "case.version += 1", "ERR_INVALID_STATE if case CLOSED or INVOICED-or-later"]

  - method: GET
    path: "/damage-recovery/cost-line-items/{id}"
    description: "Get a cost line"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: CostLineItem
    side_effects: []

  - method: GET
    path: "/damage-recovery/cost-line-items"
    description: "List cost lines"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["damage_case_id?", "category?", "limit?", "offset?"]
    output: "CostLineItem[]"
    side_effects: []

  - method: DELETE
    path: "/damage-recovery/cost-line-items/{id}"
    description: "Remove a cost line while the case is still in COSTING"
    roles: [ClaimsAdjuster]
    code: 204
    input: []
    output: null
    side_effects: ["case.subtotal_cents recomputed", "case.version += 1", "ERR_INVALID_STATE unless case.recovery_status == COSTING"]

  # --- ClaimInvoice ---
  - method: GET
    path: "/damage-recovery/claim-invoices/{id}"
    description: "Get a claim invoice"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: ClaimInvoice
    side_effects: []

  - method: GET
    path: "/damage-recovery/claim-invoices"
    description: "List claim invoices"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["damage_case_id?", "fault_allocation_id?", "debtor_id?", "status?", "limit?", "offset?"]
    output: "ClaimInvoice[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/claim-invoices/{id}/issue"
    description: "Issue a DRAFT invoice to its debtor"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimInvoice
    side_effects: ["status -> ISSUED", "issued_at set; due_at = issued_at + 30 days", "debtor total_outstanding_cents recomputed"]

  - method: POST
    path: "/damage-recovery/claim-invoices/{id}/write-off"
    description: "Write off a small uncollectable balance"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: ClaimInvoice
    side_effects: ["status -> WRITTEN_OFF", "ERR_WRITE_OFF_CAP_EXCEEDED when amount_due_cents > 20000", "ERR_INVOICE_HAS_OPEN_DISPUTE when a dispute is open"]

  # --- Payment ---
  - method: POST
    path: "/damage-recovery/payments"
    description: "Record a debtor payment; explicit invoice or waterfall allocation across the payer's open invoices (due_at ASC, created_at ASC), remainder to credit balance"
    roles: [Excavator, Locator, RecoveryManager]
    code: 201
    input: [payer_type, payer_id, amount_cents, "claim_invoice_id?"]
    output: Payment
    side_effects: ["allocations computed", "invoice amount_paid_cents / status recomputed", "case recovery totals recomputed", "ownership: payer_id == X-User-ID for Excavator/Locator", "ERR_PAYMENT_EXCEEDS_BALANCE on explicit overpayment"]

  - method: GET
    path: "/damage-recovery/payments/{id}"
    description: "Get a payment"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/damage-recovery/payments"
    description: "List payments"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["payer_id?", "claim_invoice_id?", "status?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/payments/{id}/reverse"
    description: "Reverse an APPLIED payment (compensating action)"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> REVERSED", "allocation legs undone", "invoice/case recovery recomputed", "payer credit clawback"]

  # --- Dispute ---
  - method: POST
    path: "/damage-recovery/disputes"
    description: "Open a dispute against a claim invoice (ISSUED/PARTIALLY_PAID) or a fault allocation (PROPOSED/CONTESTED)"
    roles: [Excavator, Locator]
    code: 201
    input: [target_type, target_id, reason, "detail?"]
    output: Dispute
    side_effects: ["status=OPEN", "response_deadline_at = now + 14 days", "invoice target -> DISPUTED", "ERR_DISPUTE_ALREADY_OPEN per target", "ERR_DISPUTE_TARGET_MISMATCH on type/id mismatch"]

  - method: GET
    path: "/damage-recovery/disputes/{id}"
    description: "Get a dispute"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/damage-recovery/disputes"
    description: "List disputes"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["target_id?", "target_type?", "status?", "limit?", "offset?"]
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/disputes/{id}/respond"
    description: "Adjuster responds; rounds += 1"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["response_note?"]
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW", "rounds += 1"]

  - method: POST
    path: "/damage-recovery/disputes/{id}/counter"
    description: "Filer counters the response (cycle back)"
    roles: [Excavator, Locator]
    code: 200
    input: ["counter_note?"]
    output: Dispute
    side_effects: ["status -> COUNTERED"]

  - method: POST
    path: "/damage-recovery/disputes/{id}/accept-resolution"
    description: "Filer accepts; dispute RESOLVED, invoice leaves DISPUTED"
    roles: [Excavator, Locator]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> RESOLVED", "invoice status recomputed from amount_paid_cents"]

  - method: POST
    path: "/damage-recovery/disputes/{id}/escalate"
    description: "Escalate to subrogation; spawns a SubrogationCase"
    roles: [ClaimsAdjuster, RecoveryManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> ESCALATED", "SubrogationCase created (DEMANDED)"]

  # --- SubrogationCase ---
  - method: GET
    path: "/damage-recovery/subrogation-cases/{id}"
    description: "Get a subrogation case"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: []

  - method: GET
    path: "/damage-recovery/subrogation-cases"
    description: "List subrogation cases"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["dispute_id?", "claim_invoice_id?", "status?", "limit?", "offset?"]
    output: "SubrogationCase[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/subrogation-cases/{id}/record-settlement"
    description: "Record a settlement; waterfall: legal costs, then invoice balance, remainder to owner"
    roles: [RecoveryManager]
    code: 200
    input: [recovered_cents, legal_cost_cents]
    output: SubrogationCase
    side_effects: ["status -> SETTLED", "invoice amount_paid_cents increased by applied portion", "owner_share_cents computed"]

  - method: POST
    path: "/damage-recovery/subrogation-cases/{id}/close"
    description: "Close a subrogation case"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: ["status -> CLOSED"]

  # --- RegulatoryReport ---
  - method: POST
    path: "/damage-recovery/regulatory-reports"
    description: "Create a regulatory report (INCIDENT needs damage_case_id; QUARTERLY_SUMMARY needs non-overlapping closed period)"
    roles: [ClaimsAdjuster]
    code: 201
    input: [report_type, "damage_case_id?", "period_start?", "period_end?", "payload_notes?"]
    output: RegulatoryReport
    side_effects: ["status=DRAFT", "ERR_REPORT_PERIOD_OVERLAP for overlapping quarterly periods among non-SUPERSEDED reports"]

  - method: GET
    path: "/damage-recovery/regulatory-reports/{id}"
    description: "Get a regulatory report"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  - method: GET
    path: "/damage-recovery/regulatory-reports"
    description: "List regulatory reports"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["damage_case_id?", "amends_report_id?", "report_type?", "status?", "limit?", "offset?"]
    output: "RegulatoryReport[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/regulatory-reports/{id}/file"
    description: "File a DRAFT report; computes days_late and penalty against the 30-day deadline (inclusive)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["status -> FILED", "filed_at set", "days_late/penalty_cents via late_filing_penalty"]

  - method: POST
    path: "/damage-recovery/regulatory-reports/{id}/amend"
    description: "Amend a FILED report; creates the successor DRAFT and supersedes this one"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["payload_notes?"]
    output: RegulatoryReport
    side_effects: ["this report -> SUPERSEDED", "successor DRAFT created with amends_report_id = this id", "ERR_AMEND_CHAIN_BROKEN when not FILED"]

  # --- ViolationRecord ---
  - method: POST
    path: "/damage-recovery/violation-records"
    description: "Manually record a violation notice against an excavator for a case (points derived from case severity)"
    roles: [RecoveryManager]
    code: 201
    input: [excavator_id, damage_case_id]
    output: ViolationRecord
    side_effects: ["points from case severity", "Excavator.offender_points recomputed (band applied only at evaluate-program)"]

  - method: GET
    path: "/damage-recovery/violation-records/{id}"
    description: "Get a violation record"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: ViolationRecord
    side_effects: []

  - method: GET
    path: "/damage-recovery/violation-records"
    description: "List violation records"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["excavator_id?", "damage_case_id?", "status?", "limit?", "offset?"]
    output: "ViolationRecord[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/violation-records/{id}/overturn"
    description: "Overturn a violation (appeal upheld)"
    roles: [RecoveryManager]
    code: 200
    input: []
    output: ViolationRecord
    side_effects: ["status -> OVERTURNED", "Excavator.offender_points recomputed"]

  # --- TrainingCourse ---
  - method: POST
    path: "/damage-recovery/training-courses"
    description: "Create a prevention-training course"
    roles: [RecoveryManager]
    code: 201
    input: [course_code, title, required_for_status, credit_hours]
    output: TrainingCourse
    side_effects: ["ERR_DUPLICATE_COURSE_CODE on course_code reuse"]

  - method: GET
    path: "/damage-recovery/training-courses/{id}"
    description: "Get a training course"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: TrainingCourse
    side_effects: []

  - method: GET
    path: "/damage-recovery/training-courses"
    description: "List training courses"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["required_for_status?", "limit?", "offset?"]
    output: "TrainingCourse[]"
    side_effects: []

  # --- TrainingAssignment ---
  - method: POST
    path: "/damage-recovery/training-assignments"
    description: "Assign a course to an excavator"
    roles: [RecoveryManager]
    code: 201
    input: [excavator_id, course_id]
    output: TrainingAssignment
    side_effects: ["status=ASSIGNED", "due_at = created_at + 90 days"]

  - method: GET
    path: "/damage-recovery/training-assignments/{id}"
    description: "Get a training assignment"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: []

  - method: GET
    path: "/damage-recovery/training-assignments"
    description: "List training assignments"
    roles: [IntakeCoordinator, DamageInvestigator, ClaimsAdjuster, RecoveryManager, Excavator, Locator]
    code: 200
    input: ["excavator_id?", "course_id?", "status?", "limit?", "offset?"]
    output: "TrainingAssignment[]"
    side_effects: []

  - method: POST
    path: "/damage-recovery/training-assignments/{id}/complete"
    description: "Excavator completes an assigned course"
    roles: [Excavator]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["status -> COMPLETED", "completed_at set", "ERR_OWNERSHIP_MISMATCH when caller is not the assignee"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed or role undeclared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not in the endpoint's role list" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller acts on a resource owned by another party (ticket/response/payment/dispute/contest/assignment)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path or body id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive quantity/amount, malformed datetime" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Finalize caller is the same user recorded as the case's investigator" }
  - { id: ERR_CONTEST_WINDOW_CLOSED, http: 409, condition: "Contest attempted after contest_deadline_at while allocation still PROPOSED" }
  - { id: ERR_EVIDENCE_INADMISSIBLE, http: 422, condition: "Evidence captured_at is after case.occurred_at + 72 hours" }
  - { id: ERR_TICKET_WINDOW_INVALID, http: 422, condition: "work_end_at <= work_start_at, or renew's new_work_end_at <= current work_end_at" }
  - { id: ERR_TICKET_WINDOW_CONFLICT, http: 409, condition: "Half-open dig window overlaps another OPEN ticket of the same (excavator_id, dig_site_address)" }
  - { id: ERR_TICKET_EXPIRED, http: 409, condition: "Locate response submitted against an EXPIRED ticket" }
  - { id: ERR_DAMAGE_OUTSIDE_TICKET_WINDOW, http: 409, condition: "link-ticket: case.occurred_at outside the COMPLETED ticket's [work_start_at, work_end_at)" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "QUARTERLY_SUMMARY closed period overlaps a non-SUPERSEDED quarterly report's period (shared boundary day counts)" }
  - { id: ERR_LOCATOR_INACTIVE, http: 409, condition: "Locate response submitted by a SUSPENDED locator" }
  - { id: ERR_DISPUTE_TARGET_MISMATCH, http: 422, condition: "dispute target_id does not resolve to an entity of target_type" }
  - { id: ERR_AMEND_CHAIN_BROKEN, http: 409, condition: "amend attempted on a report not in FILED status (DRAFT or already SUPERSEDED)" }
  - { id: ERR_SHARES_MUST_SUM_10000, http: 422, condition: "Supplied fault shares do not sum to exactly 10000 basis points" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "Target already has a dispute in {OPEN, UNDER_REVIEW, COUNTERED}" }
  - { id: ERR_PROGRAM_SUSPENDED, http: 409, condition: "SUSPENDED excavator cannot file new locate tickets" }
  - { id: ERR_NO_SCENE_EVIDENCE, http: 409, condition: "Finalize requires evidence_count >= 1 on the case" }
  - { id: ERR_INVOICE_AUTHORITY_CAP_EXCEEDED, http: 409, condition: "Finalize with case.subtotal_cents > 5000000 and no override_authority_cap" }
  - { id: ERR_WRITE_OFF_CAP_EXCEEDED, http: 409, condition: "Write-off attempted with amount_due_cents > 20000" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 409, condition: "Explicit-invoice payment exceeds that invoice's amount_due_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_damage_case_version does not match the case's current version on allocation create" }
  - { id: ERR_TIMELINE_EMPTY, http: 409, condition: "Reconstruct-timeline with no linked ticket, no responses, and no evidence" }
  - { id: ERR_CASE_NOT_CLOSABLE, http: 409, condition: "Close gate unmet: not FAULT_FINAL + RECOVERED, or a DRAFT incident report exists" }
  - { id: ERR_INVOICE_HAS_OPEN_DISPUTE, http: 409, condition: "Write-off blocked by a dispute in {OPEN, UNDER_REVIEW, COUNTERED} on the invoice" }
  - { id: ERR_DUPLICATE_COURSE_CODE, http: 409, condition: "TrainingCourse course_code already exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Damage report intake desk: registers damage cases and scene evidence, links tickets"
    identity: opaque
    exclusive_operations:
      - "POST /damage-recovery/damage-cases — intake a damage report"
    shared_operations:
      - "POST /damage-recovery/evidence-items (with DamageInvestigator)"
      - "POST /damage-recovery/damage-cases/{id}/link-ticket (with DamageInvestigator)"
      - "all GET endpoints"

  - name: DamageInvestigator
    description: "Field investigator: scene evidence, timeline reconstruction, locate-response audits, fault allocation drafting/proposal/revision"
    identity: opaque
    exclusive_operations:
      - "POST /damage-recovery/damage-cases/{id}/begin-investigation"
      - "POST /damage-recovery/damage-cases/{id}/reconstruct-timeline"
      - "POST /damage-recovery/locate-responses/{id}/audit"
      - "POST /damage-recovery/fault-allocations"
      - "POST /damage-recovery/fault-allocations/{id}/propose"
      - "POST /damage-recovery/fault-allocations/{id}/revise"
    shared_operations:
      - "POST /damage-recovery/evidence-items (with IntakeCoordinator)"
      - "POST /damage-recovery/damage-cases/{id}/link-ticket (with IntakeCoordinator)"
      - "all GET endpoints"

  - name: ClaimsAdjuster
    description: "Recovery adjuster: repair cost compilation, invoice issue, dispute responses, regulatory filings"
    identity: opaque
    exclusive_operations:
      - "POST /damage-recovery/cost-line-items"
      - "DELETE /damage-recovery/cost-line-items/{id}"
      - "POST /damage-recovery/claim-invoices/{id}/issue"
      - "POST /damage-recovery/disputes/{id}/respond"
      - "POST /damage-recovery/regulatory-reports"
      - "POST /damage-recovery/regulatory-reports/{id}/file"
      - "POST /damage-recovery/regulatory-reports/{id}/amend"
    shared_operations:
      - "POST /damage-recovery/disputes/{id}/escalate (with RecoveryManager)"
      - "all GET endpoints"

  - name: RecoveryManager
    description: "Unit manager: registrations, finalize (never own-investigated cases), write-offs, reversals, subrogation, offender program, training, clock"
    identity: opaque
    exclusive_operations:
      - "POST /damage-recovery/_clock/set_current_utc"
      - "POST /damage-recovery/excavators, /locators, /training-courses, /training-assignments, /violation-records"
      - "POST /damage-recovery/locators/{id}/suspend"
      - "POST /damage-recovery/excavators/{id}/evaluate-program"
      - "POST /damage-recovery/fault-allocations/{id}/finalize"
      - "POST /damage-recovery/claim-invoices/{id}/write-off"
      - "POST /damage-recovery/payments/{id}/reverse"
      - "POST /damage-recovery/subrogation-cases/{id}/record-settlement, /close"
      - "POST /damage-recovery/damage-cases/{id}/close"
      - "POST /damage-recovery/violation-records/{id}/overturn"
    shared_operations:
      - "POST /damage-recovery/payments (with debtor roles)"
      - "POST /damage-recovery/fault-allocations/{id}/contest (with named parties)"
      - "POST /damage-recovery/disputes/{id}/escalate (with ClaimsAdjuster)"
      - "all GET endpoints"

  - name: Excavator
    description: "Excavating contractor user: files locate tickets, disputes, payments, completes training"
    identity: "entity_backed:Excavator"
    exclusive_operations:
      - "POST /damage-recovery/locate-tickets"
      - "POST /damage-recovery/locate-tickets/{id}/renew"
      - "POST /damage-recovery/training-assignments/{id}/complete"
    shared_operations:
      - "POST /damage-recovery/payments (payer_id == self)"
      - "POST /damage-recovery/disputes (with Locator)"
      - "POST /damage-recovery/disputes/{id}/counter, /accept-resolution (filer only)"
      - "POST /damage-recovery/fault-allocations/{id}/contest (named party only)"
      - "all GET endpoints"

  - name: Locator
    description: "Locating contractor user: submits marking responses, disputes, payments"
    identity: "entity_backed:Locator"
    exclusive_operations:
      - "POST /damage-recovery/locate-responses"
    shared_operations:
      - "POST /damage-recovery/payments (payer_id == self)"
      - "POST /damage-recovery/disputes (with Excavator)"
      - "POST /damage-recovery/disputes/{id}/counter, /accept-resolution (filer only)"
      - "POST /damage-recovery/fault-allocations/{id}/contest (named party only)"
      - "all GET endpoints"

  - name: System
    description: "Automation actor for clock sweeps and cascaded auto-transitions (not callable via API role)"
    identity: opaque
    exclusive_operations:
      - "logical-clock expiry sweeps and cascade transitions"
    shared_operations: []
