      - name: discontinue_blocked_by_live_promotion_then_writes_off_the_deal
        claim_type: cascade_down
        grounds:
          - state_machines.Authorization.AUTHORIZED_to_DISCONTINUED
          - state_machines.SlottingDeal.AMORTIZING_to_WRITTEN_OFF
