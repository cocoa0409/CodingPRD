              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-I2", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /dh/vehicle-shifts/${shift_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "dehydration" }
