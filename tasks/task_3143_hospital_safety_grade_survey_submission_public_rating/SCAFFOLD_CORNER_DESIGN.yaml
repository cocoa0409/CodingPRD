              as_user_id: "${p0_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "ReanalysisRequest.${rq0_id}.status is still PENDING"
            - "the same request WITHDRAWN by its own respondent succeeds and returns status WITHDRAWN"

      - name: purchaser_admin_cannot_touch_clinical_surfaces
        claim_type: exclusive_operation_denied
        grounds:
          - roles.PurchaserAdmin
          - endpoints.POST_/hospital-safety-rating/hospitals/{id}/surveys
        distinguishing_aspect: "A PurchaserAdmin owns only the employer surfaces, so posting a survey is refused at priority 2 with 403 even though the hospital id in the path resolves."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned to M_B0."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: PurchaserAdmin
              as_user_id: "emp-e1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /hospital-safety-rating/hospitals/${p0_id}/surveys returns 0 rows"
            - "the same call as HospitalRespondent succeeds with 201"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: measure_set_refresh_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[measure-set-refresh-vs-reanalysis]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/hospital-safety-rating/hospitals/{id}/refresh-measures
        distinguishing_aspect: "The refresh endpoint advances Hospital.version on success, so a refresh reusing a version observed before any intervening mutation is refused with 412 ERR_STALE_VERSION rather than silently re-materialising."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned; the caller captured version 4 before one more mutation landed."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id, p0_v_observed: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { p0_v_now: $.data.version }
          assert:
            - "the submit advanced Hospital.version from ${p0_v_observed} to ${p0_v_now}"
            - "a refresh carrying expected_hospital_version ${p0_v_observed} returns 412 ERR_STALE_VERSION"
            - "a refresh carrying expected_hospital_version ${p0_v_now} succeeds and returns readiness_state INCOMPLETE or READY"
            - "the stale attempt did not rewrite source_snapshot_at"

      - name: cascading_side_effects_two_segment_chain_is_order_sensitive
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Survey.SUBMITTED_to_DISCREPANCY_OPEN
          - state_machines.SurveyMeasure.REPORTED_to_REPORTED
          - state_machines.HospitalMeasureSet.READY_to_INCOMPLETE
        distinguishing_aspect: "The cascade is order-sensitive: a discrepancy opened BEFORE the set is refreshed leaves readiness READY, while the same discrepancy opened AFTER a refresh forces readiness INCOMPLETE, so the same call produces different end states."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Two P0-style hospitals differ only in whether their measure set was refreshed before the discrepancy."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals"
              payload: { name: "C3 Community Hospital", ccn: "261003", state_code: "MO", bed_count: 40, teaching_status: "NON_TEACHING", annual_discharges: 500, survey_contact_email: "c3@example.org" }
              as: RatingAdmin
              captures: { c3_id: $.data.id, c3_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${c3_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
              as: RatingAdmin
            - call: "POST /hospital-safety-rating/hospitals/${c3_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "ATTESTATION" }
              as: HospitalRespondent
              as_user_id: "${c3_id}"
              captures: { s3_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${c3_id}/survey-measures"
              payload: { survey_id: "${s3_id}", measure_code: "o1", raw_value: 70.0 }
              as: HospitalRespondent
              as_user_id: "${c3_id}"
            - call: "POST /hospital-safety-rating/surveys/${s3_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${c3_id}"
              captures: { c3_v1: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${c3_id}/refresh-measures"
              payload: { expected_hospital_version: "${c3_v1}" }
              as: RatingEngine
              captures: { ms3_id: $.data.id, c3_v2: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${s3_id}/verify"
              payload: { verification_response: "DISCREPANCY_REQUEST" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { c3_v3: $.data.version }
            - call: "GET /hospital-safety-rating/hospital-measure-sets/${ms3_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "va-owen"
              captures: { ms3_state: $.data.readiness_state }
          assert:
            - "the discrepancy advanced Survey.${s3_id} to DISCREPANCY_OPEN with verification_cycle 1"
            - "HospitalMeasureSet.${ms3_id}.readiness_state == INCOMPLETE, because the discrepancy landed after the refresh"
            - "had the discrepancy landed before the refresh, the refreshed set would read READY instead — the chain is order-sensitive"
            - "Hospital.${c3_id}.disclosure_status == UNVERIFIED"

      - name: frozen_measure_definition_pin_keeps_a_survey_on_its_original_version
        claim_type: version_pinning_on_approval
        grounds:
          - entities.Survey.fields.methodology_version_id
          - calculations.methodology_comparability_index
          - entities.PendingMethodologyChange.fields.comparability_index
        distinguishing_aspect: "A survey pins the hospital's methodology version at creation and keeps it even after the hospital is re-pinned, so the survey's scores stay on the old measure tree and the pending change records the comparability index separately."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned to M_B0 and holds a survey; M_MG is requested as the next pin."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/pending-methodology-changes"
              payload: { to_methodology_version_id: "${meth_mg_id}" }
              as: RatingAdmin
              captures: { chg_id: $.data.id }
            - call: "POST /hospital-safety-rating/pending-methodology-changes/${chg_id}/review"
              payload: { decision: "APPLY" }
              as: VerificationAnalyst
              as_user_id: "va-owen"
              captures: { chg_status: $.data.status, chg_index: $.data.comparability_index }
          assert:
            - "PendingMethodologyChange.${chg_id}.comparability_index == 1.0000, because M_MG still declares o1, o2 and o3"
            - "PendingMethodologyChange.${chg_id}.status == APPLIED"
            - "Survey.${sp0_id}.methodology_version_id is still ${meth_b0_id}, so the survey did not follow the re-pin"
            - "Hospital P0's active pin now resolves to M_MG, so the survey and the hospital disagree on version"
            - "a reanalysis against the old-pinned survey reports reference_stale true"

      - name: derived_field_reconciliation_on_hospital_read
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Hospital.fields.submitted_source_document_count
          - endpoints.GET_/hospital-safety-rating/hospitals/{id}
          - calculations.derived_measure_value
        distinguishing_aspect: "submitted_source_document_count is recomputed on read from the hospital's survey measures, so adding a sourced measure raises it and a substitution does not, keeping the denormalised counter consistent with its source rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 holds a survey with one sourced measure."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /hospital-safety-rating/hospitals/${p0_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { doc_count_one: $.data.submitted_source_document_count }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o2", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "GET /hospital-safety-rating/hospitals/${p0_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { doc_count_two: $.data.submitted_source_document_count }
          assert:
            - "the counter reads 1 after the first sourced measure and 2 after the second"
            - "re-posting the same measure_code does not raise the counter above 2, because the row is replaced rather than added"
            - "GET /hospital-safety-rating/hospitals/${p0_id}/survey-measures returns exactly 2 rows"
            - "the counter is derived from the source rows, so deleting a source program would lower it on the next read"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_disclosure_status_visible_in_the_submit_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Hospital.fields.disclosure_status
          - endpoints.POST_/hospital-safety-rating/surveys/{id}/submit
        distinguishing_aspect: "All cascades are atomic in the submit request, so the hospital's disclosure_status and version are already advanced when the submit response returns — no follow-up read is needed to observe them."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 holds a survey with one sourced measure."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id, p0_v0: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
          trigger:
            - call: "POST /hospital-safety-rating/surveys/${sp0_id}/submit"
              payload: {}
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sub_sample_rate: $.data.sample_rate }
          assert:
            - "the submit response already reports Survey.${sp0_id}.sample_rate == 0.0600 and af_status == SUBMITTED"
            - "a read of GET /hospital-safety-rating/hospitals/${p0_id} taken immediately afterwards reports disclosure_status == SUBMITTED"
            - "Hospital.${p0_id}.version advanced from ${p0_v0} to a version exactly one higher, so the cascade was atomic"
            - "no second request is needed to observe the disclosure status"

      - name: immediate_consistency_stale_version_is_observed_on_the_very_next_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - concurrency_rules[preliminary-results-accept-vs-reanalysis]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Because writes are immediately consistent, the version bumped by one call is visible to the very next write, so a second write carrying the pre-mutation version is refused with 412 without any wait."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Hospital P0 is pinned and has a survey; the caller reads the hospital version before submitting."
          setup_api_calls:
            - *c_clock
            - *c_meth_b0
            - *c_meth_mg
            - *c_hp0
            - *c_pin_b0
            - *c_hp1
            - *c_rc_b0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { sp0_id: $.data.id }
            - call: "GET /hospital-safety-rating/hospitals/${p0_id}"
              payload: {}
              as: AnyAuthenticated
              as_user_id: "pa-lin"
              captures: { v_before: $.data.version }
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/survey-measures"
              payload: { survey_id: "${sp0_id}", measure_code: "o1", raw_value: 70.0, source_program_id: "CMS_HOSPITAL_COMPARE" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/surveys"
              payload: { started_survey_count: 800, completed_survey_count: 600, entity_annual_discharges: 1000, validation_method: "SOURCE_DOCUMENT" }
              as: HospitalRespondent
              as_user_id: "${p0_id}"
              captures: { v_after: $.data.version }
          trigger:
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/refresh-measures"
              payload: { expected_hospital_version: "${v_before} - 1" }
              as: RatingEngine
              captures: { error_id: $.data.error_id }
          assert:
            - "the two intervening writes raised Hospital.version from ${v_before} to ${v_after}"
            - "the refresh carrying an expression over the stale version returns 412 ERR_STALE_VERSION"
            - "the very next refresh carrying expected_hospital_version ${v_after} succeeds, proving no propagation delay"
            - "the rejection fired before any business tier, so readiness_state was untouched by the stale call"
