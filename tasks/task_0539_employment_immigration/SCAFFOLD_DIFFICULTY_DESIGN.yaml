  - rule_id: priority_pair_validation_conflict
    instances:
      - name: quiet_period_temporal_beats_recruitment_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.PermCase.RECRUITING_to_QUIET_PERIOD
        distinguishing_aspect: |
          On RECRUITING->QUIET_PERIOD, recruitment ran <30 days (temporal, priority 9) AND no
          recruitment steps exist (constraint, priority 10) fail together; the temporal error
          ERR_RECRUITMENT_TOO_SHORT wins. Pair = business_temporal vs business_constraint.
        test_recipe:
          setup:
            - "A PermCase is RECRUITING at clock 2026-05-01 with NO recruitment steps; clock advanced only to 2026-05-06 (5 days)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "999999999", legal_name: "Theta Co", employee_count: 9 }
              as: EmployerAgent
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /prevailing-wage-determinations/${pwd_id}/transitions"
              payload: { to_status: "ISSUED", expected_employer_version: "${emp_v}" }
              as: DOLAnalyst
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "RECRUITING" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
