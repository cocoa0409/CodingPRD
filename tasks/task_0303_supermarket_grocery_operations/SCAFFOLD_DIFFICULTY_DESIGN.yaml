          - calculations.effective_unit_price
          - entities.PricePlan.fields.effective_start
          - entities.PricePlan.fields.effective_end
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
        distinguishing_aspect: |
          PricePlan interval semantics are half-open [effective_start, effective_end): a clock at exactly
          effective_end is OUTSIDE the window so the ad price does NOT apply (everyday price used). Adjacency
          treatment: end-exclusive. Resource = PricePlan on Product.
        test_recipe:
          setup:
            - "Product everyday 200 c. Ad price 150 c for window [2026-06-01, 2026-06-10). Clock set to exactly 2026-06-10T00:00:00Z (== end). On-hand 5."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Juice", sku: "SKU-JUICE", sell_by_weight: false, unit_price_cents: 200, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /price-plans"
              payload: { product_id: "${prod_id}", ad_price_cents: 150, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-10T00:00:00Z", expected_product_version: "${prod_v}" }
              as: PriceManager
              as_user_id: "pm-1"
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-L1", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "GET /products/${prod_id}"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { prod_v_now: $.data.version }
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v_now}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: Cashier
              as_user_id: "csh-1"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          assert:
            - "SaleLineItem.${line_id}.unit_price_applied_cents == 200"
            - "SalesTransaction.${sale_id}.subtotal_cents == 200"

      # ---- InventoryLot expiration boundary: expiration_date <= clock semantics ----
      - name: lot_expiry_inclusive_at_exact_expiration_instant
        grounds:
          - state_machines.InventoryLot.ACTIVE_to_EXPIRED
          - entities.InventoryLot.fields.expiration_date
          - errors[ERR_LOT_NOT_EXPIRED_YET]
        distinguishing_aspect: |
          InventoryLot expiry uses inclusive expiration_date <= clock (different interval semantics from
          PricePlan's end-exclusive window): a lot with expiration exactly equal to the clock IS expirable,
          while a lot whose expiration is one second after the clock is rejected with ERR_LOT_NOT_EXPIRED_YET.
          Resource = InventoryLot (a different resource entity than PricePlan).
        test_recipe:
          setup:
            - "Clock 2026-06-10T00:00:00Z. Perishable product with one ACTIVE lot expiring at exactly 2026-06-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "DAIRY", name: "Dairy" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Milk", sku: "SKU-MILK", sell_by_weight: false, unit_price_cents: 99, is_perishable: true, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-M1", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100, expiration_date: "2026-06-10T00:00:00Z" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "GET /inventory-lots"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /inventory-lots/${lot_id}/expire"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { st: $.data.status }
          assert:
            - "InventoryLot.${lot_id}.status == EXPIRED"
            - "Product.${prod_id}.on_hand_qty == 0"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- inventory quantity conserved: finalize + refund leaves on_hand/value unchanged ----
      - name: pay_then_refund_conserves_on_hand_and_value
        grounds:
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
          - state_machines.SalesTransaction.PAID_to_REFUNDED
          - calculations.fefo_depletion
          - calculations.product_inventory_rollup
          - entities.Product.fields.on_hand_qty
          - entities.Product.fields.on_hand_value_cents
        distinguishing_aspect: |
          Conserved quantity = Product on-hand: finalize (deplete) then refund (restock same lots reverse-FEFO)
          must return Product.on_hand_qty to 10 and on_hand_value_cents to 1000 (their pre-finalize values),
          with the depleted lot restored ACTIVE. Invariant: on_hand_qty_after == on_hand_qty_before.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Each-sold product, one ACTIVE lot remaining 10 @ cost 100 (book value 1000). Sale finalized then paid with quantity 4."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Pasta", sku: "SKU-PASTA", sell_by_weight: false, unit_price_cents: 200, is_perishable: false, reorder_point_qty: 0 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-N1", expected_total_cents: 1000 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 10, accepted_qty: 10, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}" }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 4 }
              as: Cashier
              as_user_id: "csh-1"
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
            - call: "POST /sales/${sale_id}/pay"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/refund"
              payload: {}
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { ten: $.data.tender_status }
          assert:
            - "SalesTransaction.${sale_id}.tender_status == REFUNDED"
            - "Product.${prod_id}.on_hand_qty == 10"
            - "Product.${prod_id}.on_hand_value_cents == 1000"

      # ---- loyalty points/spend conserved: finalize accrual + refund reversal ----
      - name: refund_reverses_loyalty_points_and_lifetime_spend
        grounds:
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
          - state_machines.SalesTransaction.PAID_to_REFUNDED
          - calculations.loyalty_points_accrual
          - calculations.loyalty_tier
          - entities.LoyaltyMember.fields.points_balance
          - entities.LoyaltyMember.fields.lifetime_spend_cents
        distinguishing_aspect: |
          Conserved quantity = member loyalty ledger (a different conserved type than inventory):
          finalize accrues points and lifetime_spend on a BASIC member; refund reverses both back to 0,
          leaving points_balance == 0 and lifetime_spend_cents == 0 (pre-finalize values).
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. ACTIVE BASIC member (points 0, lifetime 0). Each-sold product 250 c, on-hand 10."
            - "Sale on member, line quantity 4 (total 1000), finalized then paid."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
