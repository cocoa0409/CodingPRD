  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deferred_and_unaffordable_project_reports_state_error_not_fiscal_error
        grounds:
          - validations.priority_40.ERR_PROJECT_NOT_SCORED
          - validations.priority_72.ERR_GRANT_FUNDS_EXHAUSTED
          - validations.priority_60.ERR_PROJECT_NOT_TOP_RANKED
          - errors.ERR_PROJECT_NOT_SCORED
        distinguishing_aspect: |
          Pair (state 40, fiscal 72). The target project violates both rules at once:
          it is DEFERRED rather than SCORED, and its 1,500,000-cent request exceeds
          the program's remaining_cents of 0. The declared order makes the fiscal
          check the last gate on the fund path, so the response must be
          ERR_PROJECT_NOT_SCORED with HTTP 409 — never ERR_GRANT_FUNDS_EXHAUSTED with
          HTTP 402, and never the priority-60 ERR_PROJECT_NOT_TOP_RANKED that the
          emptied candidate pool would also justify.
        test_recipe:
          setup:
            - "School with one WARRANTED intersection (latest_warrant_score 66.19, crash_severity_points 23); clock advanced to 2026-09-30T09:00:00Z; no complaints, so referred_complaint_count is 0."
