              captures:
                r_id: "id"
          assert:
            - "response status code == 201"
            - "response body data.penetration_pct == 0.6501 — 0.65005 rounded HALF UP, not 0.6500"
            - "response body data.provisional_fee_cents == 5200400 — derived from 130,010 raw subscribers, not from the rounded 0.6501"
            - "POST /carriage/subscriber-reports/${r_id}/review with action=\"ACCEPT\" returns 200 with data.license_fee_due_cents == 5200400 and data.billable_subscribers == 130010"

