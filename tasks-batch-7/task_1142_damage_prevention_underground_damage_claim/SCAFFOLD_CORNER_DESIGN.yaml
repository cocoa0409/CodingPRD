# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1142: Damage Prevention & Underground Damage Claim Recovery
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 using the claim-extraction guide.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: damage_case_creation_defaults
        claim_type: creation
        grounds: ["entities.DamageCase"]
        distinguishing_aspect: "POST /damage-cases with required fields returns 201 with server defaults: investigation_status REPORTED, recovery_status UNBILLED, subtotal_cents 0, evidence_count 0, non-empty case_number."
        test_recipe:
          setup: ["excavator ex1 exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "1 First St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { st_i: $.data.investigation_status, st_r: $.data.recovery_status, sub: $.data.subtotal_cents, ev: $.data.evidence_count, num: $.data.case_number } }
          assert:
            - "${st_i} == REPORTED and ${st_r} == UNBILLED"
            - "${sub} == 0 and ${ev} == 0 and ${num} is non-empty"

      - name: damage_case_missing_required_occurred_at_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.DamageCase.fields.occurred_at", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input occurred_at on case intake fails with ERR_INVALID_REQUEST (400) before any state is created."
        test_recipe:
          setup: ["excavator ex1 exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "1 First St", facility_type: "GAS", severity: "MINOR" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"

      - name: damage_case_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.DamageCase.fields.severity", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "severity 'SEVERE' is not in {MINOR, MAJOR, CRITICAL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["excavator ex1 exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "1 First St", facility_type: "GAS", severity: "SEVERE", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_missing_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /damage-recovery/damage-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: RecoveryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"

      - name: excavator_defaults_on_registration
        claim_type: defaults
        grounds: ["entities.Excavator.fields.program_status", "entities.Excavator.fields.offender_points"]
        distinguishing_aspect: "New excavator starts at program_status GOOD_STANDING, offender_points 0, credit_balance_cents 0, total_outstanding_cents 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { st: $.data.program_status, pts: $.data.offender_points, cr: $.data.credit_balance_cents, out: $.data.total_outstanding_cents } }
          assert:
            - "${st} == GOOD_STANDING and ${pts} == 0 and ${cr} == 0 and ${out} == 0"

      - name: evidence_item_immutable_common_fields_absent
        claim_type: immutability
        grounds: ["entities.EvidenceItem"]
        distinguishing_aspect: "EvidenceItem declares common_fields: false — the GET response carries id and created_at but no version/updated_at, and no update endpoint exists for it."
        test_recipe:
          setup: ["excavator ex1; case exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "2 Second St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseE: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseE}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator, captures: { evId: $.data.id } }
            - { call: "GET /damage-recovery/evidence-items/${evId}", payload: {}, as: RecoveryManager }
          assert:
            - "GET response contains id and created_at"
            - "GET response contains no 'version' and no 'updated_at' field"

      - name: damage_cases_list_pagination_and_filter
        claim_type: listing
        grounds: ["endpoints", "response_envelope"]
        distinguishing_aspect: "GET /damage-cases?investigation_status=REPORTED&limit=1 over two REPORTED cases returns exactly 1 row with total_count == 2 and has_more == true."
        test_recipe:
          setup: ["excavator ex1; two fresh cases (both REPORTED)"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "3 Third St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "4 Fourth St", facility_type: "WATER", severity: "MINOR", occurred_at: "2026-05-03T09:00:00Z" }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /damage-recovery/damage-cases", payload: { investigation_status: "REPORTED", limit: 1, offset: 0 }, as: RecoveryManager }
          assert:
            - "exactly 1 row returned in data"
            - "pagination reports total_count == 2 and has_more == true"

      - name: envelope_shape_on_object_read
        claim_type: retrieval
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response wraps data in { meta: { api_request_id, api_request_timestamp }, response_type, data } — verified on a single-entity GET."
        test_recipe:
          setup: ["excavator ex1 exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
          trigger:
            - { call: "GET /damage-recovery/excavators/${ex1}", payload: {}, as: RecoveryManager }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'object' and data.id == ${ex1}"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: renew_expired_ticket_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.LocateTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Renew is defined only from OPEN; after the clock sweep moves the ticket to EXPIRED, renew fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["excavator ex1; ticket window [2026-05-01T08:00:00Z, 2026-05-01T17:00:00Z); clock advanced to 2026-05-02T00:00:00Z so the sweep expires it"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "6 Sixth St", work_start_at: "2026-05-01T08:00:00Z", work_end_at: "2026-05-01T17:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { tck: $.data.id } }
            - { call: "POST /damage-recovery/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: RecoveryManager }
          trigger:
            - { call: "POST /damage-recovery/locate-tickets/${tck}/renew", payload: { new_work_end_at: "2026-05-03T17:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and LocateTicket.status remains EXPIRED"

      - name: closed_case_rejects_new_evidence
        claim_type: terminal_lockdown
        grounds: ["state_machines.DamageCase", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal for the investigation dimension: adding evidence to a fully closed case fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "excavator ex1; case fully resolved: evidence, INVESTIGATING, RULE_DEFAULT NO_TICKET allocation FINAL, one cost line 120000, invoice ISSUED then PAID in full, INCIDENT report FILED, case CLOSED"
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "7 Seventh St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseX: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseX}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseX}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseX_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseX}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseX_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocX: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseX}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseX}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocX}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocX}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseX}" }, as: RecoveryManager, captures: { invX: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invX}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/payments", payload: { payer_type: "EXCAVATOR", payer_id: "${ex1}", amount_cents: 120000, claim_invoice_id: "${invX}" }, as: Excavator, as_user_id: "${ex1}" }
            - { call: "POST /damage-recovery/regulatory-reports", payload: { report_type: "INCIDENT", damage_case_id: "${caseX}", payload_notes: "filing" }, as: ClaimsAdjuster, captures: { repX: $.data.id } }
            - { call: "POST /damage-recovery/regulatory-reports/${repX}/file", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/damage-cases/${caseX}/close", payload: {}, as: RecoveryManager, captures: { closed_st: $.data.investigation_status } }
          trigger:
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseX}", evidence_type: "PHOTO", captured_at: "2026-05-02T11:00:00Z", description: "late" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "close succeeded: ${closed_st} == CLOSED"
            - "error_id == ERR_INVALID_STATE and case.evidence_count stays 1"

      - name: locate_ticket_initial_state_open
        claim_type: initial_state
        grounds: ["state_machines.LocateTicket"]
        distinguishing_aspect: "A newly filed ticket starts OPEN with renewal_count 0 and a server-minted ticket_number."
        test_recipe:
          setup: ["excavator ex1 exists"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/locate-tickets", payload: { excavator_id: "${ex1}", dig_site_address: "8 Eighth St", work_start_at: "2026-06-01T08:00:00Z", work_end_at: "2026-06-01T17:00:00Z" }, as: Excavator, as_user_id: "${ex1}", captures: { st: $.data.status, rc: $.data.renewal_count, num: $.data.ticket_number } }
          assert:
            - "${st} == OPEN and ${rc} == 0 and ${num} is non-empty"

      - name: dispute_counter_cycle_increments_rounds
        claim_type: valid_transition
        grounds: ["state_machines.Dispute"]
        distinguishing_aspect: "Cyclic negotiation on Dispute: OPEN -> respond (UNDER_REVIEW, rounds 1) -> counter (COUNTERED) -> respond (UNDER_REVIEW, rounds 2) -> accept-resolution (RESOLVED), and the target invoice leaves DISPUTED back to ISSUED."
        test_recipe:
          setup: ["excavator ex1; finalized case (120000 costs), invoice ISSUED, dispute opened by ex1 against the invoice"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "9 Ninth St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseN: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseN}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseN}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseN_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseN}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseN_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocN: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseN}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseN}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocN}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocN}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseN}" }, as: RecoveryManager, captures: { invN: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invN}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/disputes", payload: { target_type: "CLAIM_INVOICE", target_id: "${invN}", reason: "AMOUNT", detail: "too high" }, as: Excavator, as_user_id: "${ex1}", captures: { dsp: $.data.id, dsp0: $.data.status } }
          trigger:
            - { call: "POST /damage-recovery/disputes/${dsp}/respond", payload: { response_note: "reviewed" }, as: ClaimsAdjuster, captures: { s1: $.data.status, r1: $.data.rounds } }
            - { call: "POST /damage-recovery/disputes/${dsp}/counter", payload: { counter_note: "still too high" }, as: Excavator, as_user_id: "${ex1}", captures: { s2: $.data.status } }
            - { call: "POST /damage-recovery/disputes/${dsp}/respond", payload: { response_note: "final offer" }, as: ClaimsAdjuster, captures: { s3: $.data.status, r3: $.data.rounds } }
            - { call: "POST /damage-recovery/disputes/${dsp}/accept-resolution", payload: {}, as: Excavator, as_user_id: "${ex1}", captures: { s4: $.data.status } }
            - { call: "GET /damage-recovery/claim-invoices/${invN}", payload: {}, as: RecoveryManager, captures: { inv_st: $.data.status } }
          assert:
            - "${dsp0} == OPEN, ${s1} == UNDER_REVIEW, ${s2} == COUNTERED, ${s3} == UNDER_REVIEW, ${s4} == RESOLVED"
            - "rounds: ${r1} == 1 then ${r3} == 2"
            - "ClaimInvoice.status returns to ISSUED after resolution (${inv_st} == ISSUED)"

      - name: propose_side_effect_moves_case_to_fault_proposed
        claim_type: side_effect_execution
        grounds: ["state_machines.FaultAllocation.DRAFT_to_PROPOSED", "state_machines.DamageCase"]
        distinguishing_aspect: "The propose transition's documented bubble-up side effect fires: DamageCase.investigation_status becomes FAULT_PROPOSED in the same request."
        test_recipe:
          setup: ["excavator ex1; case with evidence in INVESTIGATING (inv-1); DRAFT allocation"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "10 Tenth St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseS: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseS}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseS}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseS_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseS}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseS_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocS: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations/${allocS}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "GET /damage-recovery/damage-cases/${caseS}", payload: {}, as: RecoveryManager, captures: { inv_st: $.data.investigation_status } }
          assert:
            - "DamageCase.investigation_status == FAULT_PROPOSED (${inv_st})"
            - "FaultAllocation.proposed_at set and contest_deadline_at == proposed_at + 10 days"

      - name: escalate_creates_subrogation_case
        claim_type: side_effect_execution
        grounds: ["state_machines.Dispute", "state_machines.SubrogationCase"]
        distinguishing_aspect: "Escalate's cross-entity side effect: a SubrogationCase is created in DEMANDED with demand_amount_cents equal to the invoice's amount_due_cents at escalation time."
        test_recipe:
          setup: ["excavator ex1; finalized case, invoice ISSUED 120000, dispute OPEN on the invoice"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "11 Eleventh St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseQ: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseQ}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseQ}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseQ_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseQ}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseQ_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocQ: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseQ}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseQ}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocQ}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocQ}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseQ}" }, as: RecoveryManager, captures: { invQ: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invQ}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/disputes", payload: { target_type: "CLAIM_INVOICE", target_id: "${invQ}", reason: "FAULT_SHARE" }, as: Excavator, as_user_id: "${ex1}", captures: { dspQ: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/disputes/${dspQ}/escalate", payload: {}, as: ClaimsAdjuster, captures: { dspQ_st: $.data.status } }
            - { call: "GET /damage-recovery/subrogation-cases", payload: { dispute_id: "${dspQ}" }, as: RecoveryManager, captures: { sub_st: "$.data[0].status", sub_dem: "$.data[0].demand_amount_cents", sub_inv: "$.data[0].claim_invoice_id" } }
          assert:
            - "${dspQ_st} == ESCALATED"
            - "SubrogationCase created: status DEMANDED, demand_amount_cents == 120000, claim_invoice_id == ${invQ}"

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: late_filing_penalty_ten_days_late
        claim_type: correct_result
        grounds: ["calculations.late_filing_penalty"]
