              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { err_pool: $.data.error_id }
          assert:
            - "The OWN_HISTORY call returns HTTP 422 with data.error_id == 'ERR_INSUFFICIENT_PRICE_HISTORY' (3 weeks < MIN_SAMPLE_WEEKS 4)"
            - "The AUTO call returns HTTP 422 with data.error_id == 'ERR_EMPTY_PEER_POOL' - AUTO resolved to cluster_pooled, not to own_history"
            - "GET /elasticity-estimates?item_id=${item_g_id} returns total_count == 0 - neither rejected request stored a row"
            - "Item.${item_g_id}.sample_weeks == 3"
