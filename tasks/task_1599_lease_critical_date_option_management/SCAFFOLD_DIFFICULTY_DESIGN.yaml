              captures: { lid: $.data.id, l_ver: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-08-10T00:00:00Z", notice_window_close_date: "2026-09-10T00:00:00Z", target_commencement_date: "2028-01-01T00:00:00Z", extension_years: 5, rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { oid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
