            - call: "POST /api/checkouts"
              payload: { member_id: "${m3}", packet_id: "${p3}" }
              as: Member
              as_user_id: "${m3}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m2}", packet_id: "${p4}" }
              as: Member
              as_user_id: "${m2}"
            - call: "POST /api/checkouts"
              payload: { member_id: "${m2}", packet_id: "${p5}" }
              as: Member
              as_user_id: "${m2}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/ops/run-daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { flipped: "$.data.overdue_flipped_count", suspended: "$.data.members_suspended_count" }
            - call: "GET /api/members/${m3}"
              as: ProgramAdmin
              captures: { m3_st: "$.data.status" }
            - call: "GET /api/members/${m2}"
              as: ProgramAdmin
              captures: { m2_st: "$.data.status" }
          assert:
            - "flipped == 5"
            - "suspended == 1"
            - "m3_st == SUSPENDED    # 3 >= 3 suspends"
            - "m2_st == ACTIVE       # 2 < 3 stays"

      - name: layer_immediate_consistency_checkout_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "POST /api/checkouts response itself carries status ACTIVE, due_at exactly checked_out_at + 21 days (2026-08-01 -> 2026-08-22 under the default clock), and the packet side effect is visible via an immediate follow-up GET."
        test_recipe:
          setup: ["ACTIVE lot 1 packet; member M"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 5 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "IC1", harvest_year: 2026, seeds_received: 50, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_st: "$.data.status", due: "$.data.due_at", created: "$.data.checked_out_at" }
            - call: "GET /api/seed-packets/${p1}"
              as: ProgramAdmin
              captures: { p_st: "$.data.status" }
          assert:
            - "c_st == ACTIVE"
            - "due == created + 21 days exactly (2026-08-01T00:00:00Z -> 2026-08-22T00:00:00Z under the default clock)"
            - "p_st == CHECKED_OUT   # packet side effect visible immediately"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: consistency_cascade_atomic_single_request
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "state_machines.SwapEvent.INTAKE_CLOSED_to_COMPLETED"]
        distinguishing_aspect: "POST /swap-events/{id}/complete atomically flips ACCEPTED items to SWAPPED and appends EXPIRED credit entries: the response shows event COMPLETED and an immediate credit-summary read shows expired_total == the unredeemed remainder (7 earned, 2 redeemed -> 5 expired, balance 0)."
        test_recipe:
          setup: ["event E INTAKE_OPEN -> INTAKE_CLOSED; member M earned 7 (rare PLANT_START GOOD accepted), redeemed 2"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "VR", species: "Rare sp", category: "NATIVE", approved_zones: ["ZONE_5A"], rarity_flag: true }
              as: ProgramAdmin
              captures: { vr: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2027-03-06T10:00:00Z", end_at: "2027-03-06T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${vr}", item_type: "PLANT_START", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it: "$.data.id" }
            - call: "POST /api/intake-items/${it}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/redeem-credits"
              payload: { member_id: "${m_id}", credits: 2 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /api/swap-events/${e_id}/close-intake"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/swap-events/${e_id}/complete"
              payload: {}
              as: ProgramAdmin
              captures: { ev_st: "$.data.status" }
            - call: "GET /api/intake-items/${it}"
              as: ProgramAdmin
              captures: { it_st: "$.data.status" }
            - call: "GET /api/members/${m_id}/credit-summary"
              as: ProgramAdmin
              captures: { earned: "$.data.credits_earned_total", redeemed: "$.data.credits_redeemed_total", expired: "$.data.credits_expired_total", balance: "$.data.credits_balance" }
          assert:
            - "ev_st == COMPLETED"
            - "it_st == SWAPPED"
            - "earned == 7 and redeemed == 2 and expired == 5 and balance == 0   # max(0, 7-2) expired atomically"
