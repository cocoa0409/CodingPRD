      - name: restatement_event_bubbles_to_closed_when_its_last_determination_recovers
        claim_type: side_effect_pattern_bubble_up
        grounds:
          - state_machines.RestatementEvent.RECOVERY_ORDERED_to_CLOSED
          - state_machines.ClawbackDetermination.NOTICED_to_RECOVERED
        excluded_because:
          difficulty_instance: transitive_cascade / clawback_recovery_cascades_five_levels_from_determination_to_screen
          rationale: "That instance recovers the only outstanding determination and asserts the parent event auto-transitions RECOVERY_ORDERED -> CLOSED as level 3 of its cascade."

      - name: program_design_and_vote_dimensions_advance_independently
        claim_type: state_machine_shape_parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PayProgram.initial_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / program_vote_dimension_advances_while_design_dimension_holds
          rationale: "That instance drives vote_status NOT_VOTED -> PASSED while design_status stays DISCLOSED and asserts the combined state."

      - name: market_data_refresh_adjusts_the_dependent_screen_and_draft
        claim_type: side_effect_pattern_cross_entity
        grounds:
          - state_machines.ProxyAdvisorScreen.SCREENED_to_STALE
          - state_machines.CdaDraft.LEGAL_CLEARED_to_DRAFTING
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / market_data_refresh_invalidates_legal_clearance_through_screen_staleness
          rationale: "That instance changes Company.share_price_usd and asserts the dependent ProxyAdvisorScreen and CdaDraft both adjust state."

      - name: reversing_a_recovery_undoes_every_original_side_effect
        claim_type: side_effect_pattern_compensation
        grounds:
          - state_machines.ClawbackDetermination.RECOVERED_to_NOTICED
          - endpoints[POST /exec-comp/clawback-determinations/{id}/reverse-recovery]
        excluded_because:
          difficulty_instance: compensating_invariant / recovery_and_reversal_conserve_realized_dollars_across_award_event_and_program
          rationale: "That instance asserts the reversal restores PayoutAward.realized_value_usd, RestatementEvent.recovered_total_usd and the program totals to their pre-recovery values with no drift."

      - name: legal_clearance_is_guarded_by_a_cross_entity_precondition
        claim_type: guarded_transitions
        grounds:
          - state_machines.PayoutAward.GRANTED_to_VESTED
          - errors[ERR_METRIC_NOT_CERTIFIED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / psu_vesting_blocked_until_every_metric_of_the_vehicle_is_certified
          rationale: "That instance asserts a transition on one entity is blocked purely by the state of sibling rows on another entity."
  # =========================================================================
  - section: calculations
    instances:

      - name: odd_member_count_takes_the_true_middle_while_nearest_rank_picks_index_one
        claim_type: correct_result
        grounds:
          - calculations.peer_group_medians
          - calculations.benchmark_target_tdc
          - calculations.peer_size_band_fit
          - entities.PeerGroup.fields.median_revenue_usd
        distinguishing_aspect: |
          With three ACCEPTED peers the two selection rules deliberately differ: the medians take the true middle
          element (revenue 12,000,000,000.00, market cap 30,000,000,000.00) while the benchmark uses nearest-rank
          index ceil(0.50*3)-1 = 1 of the sorted ceo_tdc list, giving raw 18,000,000.00 — and size_fit_score falls to
          80.00 because the median revenue now sits 20% above the issuer's 10,000,000,000.00.
        test_recipe:
          setup:
            - "ACME issuer (revenue 10,000,000,000, ceo_tdc 15,000,000)."
            - "DRAFT RAW_MEDIAN peer group with three ACCEPTED members added in order BRVO (rev 8e9, tdc 12,000,000), CHRL (rev 12e9, tdc 18,000,000), DLTA (rev 20e9, tdc 24,000,000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Delta Systems", ticker: "DLTA", is_issuer: false, gics_sector: "TECH", revenue_usd: 20000000000, market_cap_usd: 40000000000, share_price_usd: 80.00, ceo_tdc_usd: 24000000 }
              as: CompConsultant
              captures: { delta_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v1}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v2: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${delta_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v2}" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
          assert:
            - "HTTP status == 200 and PeerGroup.${pg_id}.accepted_member_count == 3"
            - "PeerGroup.${pg_id}.median_revenue_usd == 12000000000.00 — the middle value, not the mean 13,333,333,333.33"
            - "PeerGroup.${pg_id}.median_market_cap_usd == 30000000000.00"
            - "PeerGroup.${pg_id}.size_fit_score == 80.00"
            - "PeerGroup.${pg_id}.benchmark_target_tdc_raw_usd == 18000000.00 — index 1, not index 0's 12,000,000.00"
            - "PeerGroup.${pg_id}.benchmark_target_tdc_adjusted_usd == 14999400.00"
            - "PeerGroup.${pg_id}.benchmark_target_tdc_usd == 18000000.00"

      - name: excluded_members_never_enter_the_medians_or_the_benchmark
