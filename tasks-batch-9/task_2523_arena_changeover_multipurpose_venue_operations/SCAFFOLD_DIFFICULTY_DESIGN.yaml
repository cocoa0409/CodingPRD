      - name: ice_sheet_cover_uncover_cycle_terminates_by_auto_meltout_on_the_fourth_cover
        grounds:
          - state_machines.IceSheet.IN_SERVICE_to_COVERED
          - state_machines.IceSheet.COVERED_to_IN_SERVICE
          - state_machines.IceSheet.COVERED_to_MELTING
          - entities.IceSheet.fields.cover_cycles
          - entities.IceSheet.fields.cover_hours_accumulated
          - calculations.condensation_risk_score
          - entities.Venue.fields.ice_deck_status
        distinguishing_aspect: |
          The sheet re-enters COVERED four times and IN_SERVICE three times on one row, and the loop
          is terminated by a counter rather than by an operator: the fourth IN_SERVICE -> COVERED
          transition takes cover_cycles to 4, which is strictly greater than COVER_CYCLE_LIMIT 3, so
          the server itself appends COVERED -> MELTING inside the same request, leaving status
          MELTING with cover_cycles 4, cover_hours_accumulated 6.000 and condensation_risk_score
          2.50 — and it does so without consulting the ERR_ICE_EVENT_DEPENDENCY booking guard that
          gates the manual melt-out.
