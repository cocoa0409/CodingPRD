scenario: |
  Yacht Brokerage & Vessel Documentation (YachtWorld broker): central listing agreement
  & MLS syndication, buyer offer with contingency (survey/sea trial), escrow deposit &
  acceptance/rejection deadlines, Coast Guard documentation vs state titling, lien
  search & satisfaction, closing statement with commission split, sales/use tax &
  offshore delivery, warranty of title & transfer

domain_name: yacht-brokerage
api_prefix: /yacht

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the brokerage house"
      - name: home_state_code
        type: enum
        source: input
        description: "Two-letter US state of principal office; drives default use-tax table"
        constraints: "member of {FL, CA, WA, NY, TX, RI, MD, NC, SC, MA, GA, NJ}"
      - name: default_commission_tier_code
        type: enum
        source: input
        description: "Tier schedule code applied when a ListingAgreement does not override"
        default: "STANDARD"
        constraints: "member of {STANDARD, PREMIER, BOUTIQUE}"
      - name: escrow_account_ref
        type: string
        source: input
        description: "Bank reference of the brokerage's escrow trust account"
      - name: license_no
        type: string
        source: input
        description: "State yacht-and-ship broker license number"

  - name: BrokerAgent
    parent: null
    common_fields: true
    fields:
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; employing brokerage"
      - name: full_name
        type: string
        source: input
        description: "Agent full legal name"
      - name: license_no
        type: string
        source: input
        description: "Individual salesperson license number"
      - name: split_pct_basis
        type: integer
        source: input
        description: "Agent's personal split of the house-side commission in basis points (0..9000); remainder retained by house"
      - name: status
        type: enum
        source: system
        description: "ACTIVE on creation; SUSPENDED blocks new listings and offers"
        default: "ACTIVE"
        constraints: "member of {ACTIVE, SUSPENDED}"

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: "Whether this client record is a seller, buyer, or both"
        constraints: "member of {SELLER, BUYER, BOTH}"
      - name: full_name
        type: string
        source: input
        description: "Legal name as it will appear on closing instruments"
      - name: residency_state_code
        type: enum
        source: input
        description: "State of tax residency; drives use-tax credit lookups"
        constraints: "member of {FL, CA, WA, NY, TX, RI, MD, NC, SC, MA, GA, NJ, NON_US}"
      - name: tax_id_last4
        type: string
        source: input
        description: "Last four digits of SSN/EIN for 8300/finCEN cross-checks"
      - name: is_entity_buyer
        type: boolean
        source: input
        description: "True when buyer is an LLC/corp; affects warranty-of-title signatory rules"
        default: false

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: hin
        type: string
        source: input
        description: "Hull Identification Number; 12 chars, globally unique across Vessel records"
        constraints: "unique; exactly 12 uppercase alphanumerics"
      - name: make
        type: string
        source: input
        description: "Builder name"
      - name: model
        type: string
        source: input
        description: "Model designation"
      - name: year_built
        type: integer
        source: input
        description: "Model year; must be <= current clock year"
      - name: length_overall_ft
        type: number
        source: input
        description: "LOA in feet; drives USCG documentation eligibility at >= 26.0 ft net tonnage proxy"
      - name: documentation_mode
        type: enum
        source: input
        description: "USCG = federally documented vessel; STATE = state-titled only"
        constraints: "member of {USCG, STATE}"
      - name: uscg_official_no
        type: string
        source: input
        description: "USCG official number; required iff documentation_mode == USCG, forbidden otherwise"
        constraints: "6-7 digit string"
      - name: state_title_no
        type: string
        source: input
        description: "State title number; required iff documentation_mode == STATE, optional decal reference otherwise"
      - name: current_location_state_code
        type: enum
        source: input
        description: "Where the vessel physically lies; drives sales-tax situs"
        constraints: "member of {FL, CA, WA, NY, TX, RI, MD, NC, SC, MA, GA, NJ}"
      - name: liens_status
        type: enum
        source: system
        description: "Computed: CLEAN iff zero LienRecord rows in {RECORDED, PARTIALLY_SATISFIED}; else ENCUMBERED"
        default: "CLEAN"
        constraints: "member of {CLEAN, ENCUMBERED}"

  - name: ListingAgreement
    parent: null
    common_fields: true
    fields:
      - name: brokerage_id
        type: string
        source: input
        description: "FK -> Brokerage.id; listing-side brokerage"
      - name: listing_agent_id
        type: string
        source: input
        description: "FK -> BrokerAgent.id; must belong to brokerage_id"
      - name: seller_id
        type: string
        source: input
        description: "FK -> Client.id; kind must include SELLER"
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; one ACTIVE/UNDER_CONTRACT listing per vessel at a time"
      - name: agreement_type
        type: enum
        source: input
        description: "CENTRAL = exclusive central agency (sole selling rights); OPEN = non-exclusive"
        constraints: "member of {CENTRAL, OPEN}"
      - name: list_price_cents
        type: integer
        source: input
        description: "Asking price in cents; must be >= 100000000 (USD 1M floor for this desk)"
      - name: commission_tier_code
        type: enum
        source: input
        description: "Overrides brokerage default when present"
        default: null
        constraints: "null or member of {STANDARD, PREMIER, BOUTIQUE}"
      - name: start_date
        type: datetime
        source: input
        description: "Agreement effective date"
      - name: end_date
        type: datetime
        source: input
        description: "Agreement expiry; must be strictly after start_date; listing auto-expires at this instant"
      - name: protection_period_days
        type: integer
        source: input
        description: "Post-expiry protection window during which prior-introduced buyers still earn commission"
        default: 90
        constraints: "0..180"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see ListingAgreement state machine"
        default: "DRAFT"
        constraints: "member of {DRAFT, ACTIVE, SUSPENDED, UNDER_CONTRACT, CLOSED, EXPIRED, CANCELLED}"
      - name: syndication_status
        type: enum
        source: system
        description: "Computed: NOT_SENT when no syndication event; SYNDICATED after successful MLS push; STALE after price change not yet re-pushed"
        default: "NOT_SENT"
        constraints: "member of {NOT_SENT, SYNDICATED, STALE, WITHDRAWN}"

  - name: SyndicationEvent
    parent: null
    common_fields: false
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> ListingAgreement.id"
      - name: channel
        type: enum
        source: input
        description: "MLS outlet"
        constraints: "member of {YACHTWORLD, BOATS_COM, BOATTRADER, DENISON_MLS}"
      - name: payload_price_cents
        type: integer
        source: input
        description: "Price carried in this push; must equal listing.list_price_cents at send time"
      - name: outcome
        type: enum
        source: input
        description: "Acknowledgement result reported by the channel"
        constraints: "member of {ACKED, REJECTED}"
      - name: sent_at
        type: datetime
        source: system
        description: "Server clock at send time"

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> ListingAgreement.id; listing must be ACTIVE or UNDER_CONTRACT (kick-out)"
      - name: buyer_id
        type: string
        source: input
        description: "FK -> Client.id; kind must include BUYER"
      - name: selling_agent_id
        type: string
        source: input
        description: "FK -> BrokerAgent.id; buyer-side agent; may differ from listing brokerage"
      - name: offer_price_cents
        type: integer
        source: input
        description: "Offered price in cents; must be > 0"
      - name: deposit_pct_basis
        type: integer
        source: input
        description: "Earnest-money deposit as basis points of offer price; must be >= 1000 (10%)"
        constraints: "1000..10000"
      - name: acceptance_deadline
        type: datetime
        source: input
        description: "Seller must accept/reject/counter by this instant; offer auto-expires after"
      - name: settlement_state_code
        type: enum
        source: input
        description: "State where closing will occur; drives tax situs unless offshore delivery elected"
        constraints: "member of {FL, CA, WA, NY, TX, RI, MD, NC, SC, MA, GA, NJ}"
      - name: offshore_delivery
        type: boolean
        source: input
        description: "True when buyer elects offshore/international-waters delivery (tax exemption path)"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see Offer state machine (cyclic negotiation)"
        default: "PENDING"
        constraints: "member of {PENDING, COUNTERED, ACCEPTED, REJECTED, EXPIRED, WITHDRAWN, CLOSED, FAILED}"
      - name: round_no
        type: integer
        source: system
        description: "Negotiation round; increments on each counter; PENDING re-entry keeps prior round_no"
        default: 1
      - name: parent_offer_id
        type: string
        source: input
        description: "FK -> Offer.id; set on counter-offers to link the negotiation chain; null on root offers"
        constraints: "nullable"

  - name: Contingency
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; contingencies attach to the accepted offer"
      - name: kind
        type: enum
        source: input
        description: "Contingency type"
        constraints: "member of {SURVEY, SEA_TRIAL, FINANCING, DOCUMENTATION}"
      - name: deadline
        type: datetime
        source: input
        description: "Buyer must satisfy, waive, or object by this instant"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see Contingency state machine"
        default: "OPEN"
        constraints: "member of {OPEN, SATISFIED, WAIVED, OBJECTED, EXPIRED}"
      - name: objection_note
        type: string
        source: input
        description: "Required when transitioning to OBJECTED; records the deficiency found"
        constraints: "nullable"

  - name: EscrowLedgerEntry
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id"
      - name: entry_type
        type: enum
        source: input
        description: "DEPOSIT = buyer earnest money in; RELEASE = disbursement out at closing; REFUND = return to buyer; FORFEIT = retained by seller on buyer default"
        constraints: "member of {DEPOSIT, RELEASE, REFUND, FORFEIT}"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed cents: DEPOSIT positive; RELEASE/REFUND/FORFEIT positive outflow recorded against running balance"
      - name: status
        type: enum
        source: system
        description: "PENDING on create; CLEARED after funds-clear action; terminal outflow states per EscrowLedgerEntry machine"
        default: "PENDING"
        constraints: "member of {PENDING, CLEARED, DISBURSED, REFUNDED, FORFEITED, VOIDED}"
      - name: value_date
        type: datetime
        source: input
        description: "Date funds are expected to clear; drives provisional-vs-final interest accrual"

  - name: LienRecord
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: lienholder_name
        type: string
        source: input
        description: "Recorded lienholder"
      - name: instrument_type
        type: enum
        source: input
        description: "PREFERRED_MORTGAGE = USCG preferred ship mortgage (USCG vessels only); UCC1 = state UCC filing; MECHANIC = yard/mechanic lien"
        constraints: "member of {PREFERRED_MORTGAGE, UCC1, MECHANIC}"
      - name: amount_cents
        type: integer
        source: input
        description: "Face amount of the lien; payoff may differ via payoff_amount_cents"
      - name: payoff_amount_cents
        type: integer
        source: system
        description: "Computed per lien_payoff_waterfall at closing statement build time"
        default: 0
      - name: priority_rank
        type: integer
        source: input
        description: "Payoff order; 1 = highest; ties broken by created_at ASC; PREFERRED_MORTGAGE must outrank all non-mortgage liens"
      - name: status
        type: enum
        source: system
        description: "RECORDED on discovery; PARTIALLY_SATISFIED after waterfall shortfall; SATISFIED when fully paid; RELEASED when lienholder files release without payment"
        default: "RECORDED"
        constraints: "member of {RECORDED, PARTIALLY_SATISFIED, SATISFIED, RELEASED}"

  - name: DocumentationRecord
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: record_kind
        type: enum
        source: input
        description: "USCG_COD = Certificate of Documentation; STATE_TITLE = state certificate of title; ABSTRACT = USCG abstract of title search"
        constraints: "member of {USCG_COD, STATE_TITLE, ABSTRACT}"
      - name: instrument_no
        type: string
        source: input
        description: "COD number, title number, or abstract reference"
      - name: issue_date
        type: datetime
        source: input
        description: "Instrument issue date; ABSTRACT must be within 30 days of closing to be valid"
      - name: status
        type: enum
        source: system
        description: "VALID on record; SUPERSEDED when a newer record of same kind is filed; TRANSFERRED after closing"
        default: "VALID"
        constraints: "member of {VALID, SUPERSEDED, TRANSFERRED, REVOKED}"

  - name: ClosingStatement
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; exactly one CLOSED-eligible statement per offer"
        constraints: "unique per offer"
      - name: gross_price_cents
        type: integer
        source: system
        description: "Computed: offer.offer_price_cents snapshot at statement build"
      - name: commission_cents
        type: integer
        source: system
        description: "Computed per commission_split calculation (house side + co-broke side combined)"
      - name: listing_side_cents
        type: integer
        source: system
        description: "Computed: listing brokerage's share of commission_cents per commission_split"
      - name: selling_side_cents
        type: integer
        source: system
        description: "Computed: selling brokerage's share; listing_side_cents + selling_side_cents == commission_cents invariant"
      - name: tax_cents
        type: integer
        source: system
        description: "Computed per sales_use_tax calculation; 0 when offshore_delivery exemption applies"
      - name: prorations_cents
        type: integer
        source: system
        description: "Computed per proration_aggregator; signed (credit to seller positive)"
      - name: escrow_applied_cents
        type: integer
        source: system
        description: "Sum of CLEARED EscrowLedgerEntry DEPOSIT rows applied against buyer's balance due"
      - name: lien_payoff_total_cents
        type: integer
        source: system
        description: "Sum of LienRecord.payoff_amount_cents across satisfied liens after waterfall"
      - name: seller_net_cents
        type: integer
        source: system
        description: "Computed per closing_total calculation"
      - name: buyer_due_cents
        type: integer
        source: system
        description: "Computed per closing_total calculation"
      - name: rounding_mode
        type: enum
        source: input
        description: "PER_LINE_THEN_SUM or SUM_THEN_PER_LINE; pinned at build and immutable after"
        constraints: "member of {PER_LINE_THEN_SUM, SUM_THEN_PER_LINE}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; see ClosingStatement state machine"
        default: "DRAFT"
        constraints: "member of {DRAFT, BALANCED, APPROVED, DISBURSED, VOIDED}"

  - name: TaxAssessment
    parent: null
    common_fields: true
    fields:
      - name: closing_statement_id
        type: string
        source: input
        description: "FK -> ClosingStatement.id"
      - name: assessment_kind
        type: enum
        source: input
        description: "SALES_TAX = collected at delivery situs; USE_TAX = self-assessed by buyer's state with credit for sales tax paid"
        constraints: "member of {SALES_TAX, USE_TAX}"
      - name: situs_state_code
        type: enum
        source: input
        description: "State claiming the tax"
        constraints: "member of {FL, CA, WA, NY, TX, RI, MD, NC, SC, MA, GA, NJ}"
      - name: basis_cents
        type: integer
        source: system
        description: "Taxable basis after exemptions/caps per sales_use_tax"
      - name: amount_cents
        type: integer
        source: system
        description: "Computed tax due"
      - name: exemption_code
        type: enum
        source: input
        description: "OFFSHORE_DELIVERY = delivery beyond state waters; NONRESIDENT_REMOVAL = removed from state within statutory days; NONE"
        default: "NONE"
        constraints: "member of {NONE, OFFSHORE_DELIVERY, NONRESIDENT_REMOVAL}"
      - name: status
        type: enum
        source: system
        description: "ASSESSED on creation; FILED once remitted to state; EXEMPT when exemption_code != NONE validated"
        default: "ASSESSED"
        constraints: "member of {ASSESSED, FILED, EXEMPT, VOIDED}"

  - name: TitleTransfer
    parent: null
    common_fields: true
    fields:
      - name: closing_statement_id
        type: string
        source: input
        description: "FK -> ClosingStatement.id; one transfer per statement"
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; must equal the offer's listing vessel"
      - name: from_client_id
        type: string
        source: input
        description: "FK -> Client.id; seller"
      - name: to_client_id
        type: string
        source: input
        description: "FK -> Client.id; buyer"
      - name: warranty_of_title
        type: enum
        source: input
        description: "FULL = warrants free and clear; QUITCLAIM = no warranty; SPECIAL = warrants only against grantor's acts"
        constraints: "member of {FULL, QUITCLAIM, SPECIAL}"
      - name: executed_at
        type: datetime
        source: system
        description: "Set on EXECUTED transition"
      - name: status
        type: enum
        source: system
        description: "DRAFT on create; EXECUTED after signatures; RECORDED after USCG/state filing; REVOKED on unwind"
        default: "DRAFT"
        constraints: "member of {DRAFT, EXECUTED, RECORDED, REVOKED}"

  - name: DomainEvent
    parent: null
    common_fields: false
    fields:
      - name: aggregate_type
        type: string
        source: system
        description: "Entity name of the mutated aggregate"
      - name: aggregate_id
        type: string
        source: system
        description: "id of the mutated aggregate"
      - name: event_type
        type: string
        source: system
        description: "Transition or calculation name, e.g. OFFER_COUNTERED, CLOSING_BALANCED"
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the mutating call"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the mutating call"
      - name: payload
        type: object
        source: system
        description: "Before/after snapshot fields relevant to the event"

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ListingAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /yacht/listings/{id}/activate"
        actor: ListingAgent
        preconditions:
          - "listing.brokerage_id == agent.brokerage_id"
          - "agent.status == ACTIVE"
          - "seller exists and kind in {SELLER, BOTH}"
          - "no other ListingAgreement for same vessel_id in {DRAFT, ACTIVE, SUSPENDED, UNDER_CONTRACT}"
          - "clock < listing.end_date"
        side_effects:
          - "sets listing.status = ACTIVE"
          - "increments listing.version by 1"
          - "emits DomainEvent LISTING_ACTIVATED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /yacht/listings/{id}/suspend"
        actor: ListingAgent
        preconditions:
          - "listing.status == ACTIVE"
        side_effects:
          - "sets listing.status = SUSPENDED"
          - "increments listing.version by 1"
          - "emits DomainEvent LISTING_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /yacht/listings/{id}/activate"
        actor: ListingAgent
        preconditions:
          - "listing.status == SUSPENDED"
          - "clock < listing.end_date"
        side_effects:
          - "sets listing.status = ACTIVE"
          - "increments listing.version by 1"
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "POST /yacht/offers/{id}/accept (on an Offer whose listing_id == this listing)"
        actor: SellingAgent (initiator) / system effect on listing
        preconditions:
          - "offer.status == PENDING"
          - "listing.status == ACTIVE"
          - "clock <= offer.acceptance_deadline"
        side_effects:
          - "sets listing.status = UNDER_CONTRACT"
          - "increments listing.version by 1"
          - "sets offer.status = ACCEPTED"
          - "auto-creates Contingency rows per offer terms (SURVEY, SEA_TRIAL at minimum)"
      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "POST /yacht/offers/{id}/fail (kick-out reactivation when accepted offer collapses)"
        actor: ListingAgent
        preconditions:
          - "listing.status == UNDER_CONTRACT"
          - "the accepted Offer on this listing transitioned to FAILED"
        side_effects:
          - "sets listing.status = ACTIVE"
          - "increments listing.version by 1"
          - "emits DomainEvent LISTING_REACTIVATED"
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "POST /yacht/closing-statements/{id}/disburse"
        actor: ClosingOfficer
        preconditions:
          - "closing statement for the accepted offer reached DISBURSED"
        side_effects:
          - "sets listing.status = CLOSED"
          - "increments listing.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep when clock >= listing.end_date"
        actor: system
        preconditions:
          - "listing.status in {ACTIVE, SUSPENDED}"
          - "clock >= listing.end_date"
        side_effects:
          - "sets listing.status = EXPIRED"
          - "sets listing.syndication_status = WITHDRAWN"
          - "auto-transitions every Offer on this listing still in {PENDING, COUNTERED} to EXPIRED"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system clock sweep when clock >= listing.end_date"
        actor: system
        preconditions:
          - "clock >= listing.end_date"
        side_effects:
          - "sets listing.status = EXPIRED"
          - "sets listing.syndication_status = WITHDRAWN"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /yacht/listings/{id}/cancel"
        actor: ListingAgent
        preconditions:
          - "listing.status in {ACTIVE, SUSPENDED}"
          - "no Offer on this listing in {ACCEPTED}"
        side_effects:
          - "sets listing.status = CANCELLED"
          - "sets listing.syndication_status = WITHDRAWN"
          - "auto-transitions every Offer on this listing still in {PENDING, COUNTERED} to EXPIRED"
          - "increments listing.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /yacht/listings/{id}/cancel"
        actor: ListingAgent
        preconditions:
          - "listing.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "sets listing.status = CANCELLED"
          - "sets listing.syndication_status = WITHDRAWN"

  - entity: Offer
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED, WITHDRAWN, CLOSED, FAILED]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /yacht/offers/{id}/counter"
        actor: ListingAgent
        preconditions:
          - "offer.status == PENDING"
          - "clock <= offer.acceptance_deadline"
          - "expected_offer_version == offer.version (OCC)"
        side_effects:
          - "sets offer.status = COUNTERED on the original offer"
          - "creates child Offer with parent_offer_id = original.id, status = PENDING, round_no = original.round_no + 1"
          - "increments original offer.version by 1"
          - "emits DomainEvent OFFER_COUNTERED"
      - from: COUNTERED
        to: PENDING
        trigger: "POST /yacht/offers/{id}/counter (buyer counter-of-counter on the child offer)"
        actor: SellingAgent
        preconditions:
          - "the child offer created by the previous counter is in PENDING"
          - "clock <= child.acceptance_deadline"
        side_effects:
          - "prior child offer transitions PENDING -> COUNTERED; new grandchild Offer created PENDING with round_no + 1"
          - "increments offer.version by 1 on the transitioned offer"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /yacht/offers/{id}/accept"
        actor: ListingAgent
        preconditions:
          - "offer.status == PENDING"
          - "listing.status == ACTIVE"
          - "clock <= offer.acceptance_deadline"
          - "expected_offer_version == offer.version (OCC)"
          - "vessel.liens_status must be resolvable: if ENCUMBERED, acceptance allowed only when a lien payoff plan can be computed (lien_payoff_waterfall yields non-null)"
        side_effects:
          - "sets offer.status = ACCEPTED"
          - "sets listing.status = UNDER_CONTRACT (cross-entity)"
          - "auto-creates Contingency rows (SURVEY and SEA_TRIAL with deadline = clock + 10 days; DOCUMENTATION deadline = clock + 21 days; FINANCING only if offer payload requested)"
          - "increments offer.version by 1"
      - from: ACCEPTED
        to: FAILED
        trigger: "POST /yacht/offers/{id}/fail"
        actor: SellingAgent
        preconditions:
          - "offer.status == ACCEPTED"
          - "at least one Contingency on this offer is in {OBJECTED, EXPIRED} and negotiation on it has collapsed (contingency.status == OBJECTED for >= 5 days on clock without resolution)"
        side_effects:
          - "sets offer.status = FAILED"
          - "sets listing.status = ACTIVE (kick-out reactivation, cross-entity cascade)"
          - "auto-transitions every CLEARED EscrowLedgerEntry DEPOSIT on this offer toward REFUNDED via POST /yacht/escrow-entries/{id}/refund obligation"
          - "increments offer.version by 1"
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /yacht/closing-statements/{id}/disburse"
        actor: ClosingOfficer
        preconditions:
          - "closing statement for this offer is DISBURSED"
          - "every Contingency on this offer in {SATISFIED, WAIVED}"
        side_effects:
          - "sets offer.status = CLOSED"
          - "increments offer.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /yacht/offers/{id}/reject"
        actor: ListingAgent
        preconditions:
          - "offer.status == PENDING"
          - "clock <= offer.acceptance_deadline"
        side_effects:
          - "sets offer.status = REJECTED"
          - "increments offer.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /yacht/offers/{id}/withdraw"
        actor: SellingAgent
        preconditions:
          - "offer.status == PENDING"
          - "acting SellingAgent == offer.selling_agent_id"
        side_effects:
          - "sets offer.status = WITHDRAWN"
          - "increments offer.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "system clock sweep when clock > offer.acceptance_deadline OR listing expired/cancelled"
        actor: system
        preconditions:
          - "offer.status in {PENDING, COUNTERED}"
        side_effects:
          - "sets offer.status = EXPIRED"
          - "increments offer.version by 1"
      - from: COUNTERED
        to: EXPIRED
        trigger: "system clock sweep when clock > offer.acceptance_deadline OR listing expired/cancelled"
        actor: system
        preconditions:
          - "offer.status in {PENDING, COUNTERED}"
        side_effects:
          - "sets offer.status = EXPIRED"

  - entity: Contingency
    initial_state: OPEN
    terminal_states: [SATISFIED, WAIVED, EXPIRED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "POST /yacht/contingencies/{id}/satisfy"
        actor: SellingAgent
        preconditions:
          - "contingency.status == OPEN"
          - "clock <= contingency.deadline"
          - "parent offer.status == ACCEPTED"
        side_effects:
          - "sets contingency.status = SATISFIED"
          - "increments contingency.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /yacht/contingencies/{id}/waive"
        actor: SellingAgent
        preconditions:
          - "contingency.status == OPEN"
          - "clock <= contingency.deadline"
          - "parent offer.status == ACCEPTED"
        side_effects:
          - "sets contingency.status = WAIVED"
          - "increments contingency.version by 1"
      - from: OPEN
        to: OBJECTED
        trigger: "POST /yacht/contingencies/{id}/object"
        actor: SellingAgent
        preconditions:
          - "contingency.status == OPEN"
          - "clock <= contingency.deadline"
          - "objection_note non-empty"
        side_effects:
          - "sets contingency.status = OBJECTED"
          - "starts objection-resolution clock (5 days)"
          - "increments contingency.version by 1"
      - from: OBJECTED
        to: OPEN
        trigger: "POST /yacht/contingencies/{id}/renegotiate (parties agree a cure and reset)"
        actor: ListingAgent
        preconditions:
          - "contingency.status == OBJECTED"
          - "within 5-day cure window since objection"
        side_effects:
          - "sets contingency.status = OPEN with a new deadline supplied in payload"
          - "increments contingency.version by 1"
      - from: OBJECTED
        to: EXPIRED
        trigger: "system clock sweep when 5-day cure window elapses without renegotiate"
        actor: system
        preconditions:
          - "contingency.status == OBJECTED"
          - "clock > objection_timestamp + 5 days"
        side_effects:
          - "sets contingency.status = EXPIRED"
          - "enables parent Offer fail transition"
      - from: OPEN
        to: EXPIRED
        trigger: "system clock sweep when clock > contingency.deadline"
        actor: system
        preconditions:
          - "contingency.status == OPEN"
          - "clock > contingency.deadline"
        side_effects:
          - "sets contingency.status = EXPIRED"
          - "enables parent Offer fail transition"

  - entity: EscrowLedgerEntry
    initial_state: PENDING
    terminal_states: [DISBURSED, REFUNDED, FORFEITED, VOIDED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /yacht/escrow-entries/{id}/clear"
        actor: EscrowOfficer
        preconditions:
          - "entry.status == PENDING"
          - "entry.entry_type == DEPOSIT"
          - "clock >= entry.value_date"
        side_effects:
          - "sets entry.status = CLEARED"
          - "increments entry.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "POST /yacht/escrow-entries/{id}/void"
        actor: EscrowOfficer
        preconditions:
          - "entry.status == PENDING"
          - "clock < entry.value_date (still voidable)"
        side_effects:
          - "sets entry.status = VOIDED"
          - "increments entry.version by 1"
      - from: CLEARED
        to: DISBURSED
        trigger: "POST /yacht/escrow-entries/{id}/release (applied to seller/closing disbursement)"
        actor: ClosingOfficer
        preconditions:
          - "entry.status == CLEARED"
          - "parent offer.status == ACCEPTED"
          - "parent offer's ClosingStatement.status == APPROVED"
        side_effects:
          - "sets entry.status = DISBURSED"
          - "increments entry.version by 1"
      - from: CLEARED
        to: REFUNDED
        trigger: "POST /yacht/escrow-entries/{id}/refund"
        actor: EscrowOfficer
        preconditions:
          - "entry.status == CLEARED"
          - "parent offer.status in {FAILED, WITHDRAWN, EXPIRED, REJECTED}"
        side_effects:
          - "sets entry.status = REFUNDED"
          - "increments entry.version by 1"
      - from: CLEARED
        to: FORFEITED
        trigger: "POST /yacht/escrow-entries/{id}/forfeit"
        actor: ListingAgent
        preconditions:
          - "entry.status == CLEARED"
          - "parent offer.status == FAILED"
          - "every Contingency on parent offer in {SATISFIED, WAIVED} (buyer defaulted without a live contingency)"
        side_effects:
          - "sets entry.status = FORFEITED"
          - "increments entry.version by 1"

  - entity: LienRecord
    initial_state: RECORDED
    terminal_states: [SATISFIED, RELEASED]
    transitions:
      - from: RECORDED
        to: SATISFIED
        trigger: "POST /yacht/closing-statements/{id}/build waterfall pays lien in full"
        actor: system
        preconditions:
          - "lien payoff_amount_cents == amount_cents after waterfall"
        side_effects:
          - "sets lien.status = SATISFIED"
          - "recomputes vessel.liens_status = CLEAN iff this was the last encumbrance"
          - "increments lien.version by 1"
      - from: RECORDED
        to: PARTIALLY_SATISFIED
        trigger: "waterfall shortfall at closing statement build"
        actor: system
        preconditions:
          - "0 < lien.payoff_amount_cents < lien.amount_cents"
        side_effects:
          - "sets lien.status = PARTIALLY_SATISFIED"
          - "vessel.liens_status remains ENCUMBERED"
      - from: RECORDED
        to: RELEASED
        trigger: "POST /yacht/liens/{id}/release"
        actor: ListingAgent
        preconditions:
          - "lien.status == RECORDED"
          - "release evidence filed (payload release_ref non-empty)"
        side_effects:
          - "sets lien.status = RELEASED"
          - "recomputes vessel.liens_status = CLEAN iff last encumbrance"
          - "increments lien.version by 1"

  - entity: ClosingStatement
    initial_state: DRAFT
    terminal_states: [DISBURSED, VOIDED]
    transitions:
      - from: DRAFT
        to: BALANCED
        trigger: "POST /yacht/closing-statements/{id}/build"
        actor: ClosingOfficer
        preconditions:
          - "statement.status == DRAFT"
          - "parent offer.status == ACCEPTED"
          - "every Contingency on parent offer in {SATISFIED, WAIVED}"
          - "every LienRecord on vessel has payoff_amount_cents computed"
          - "expected_offer_version == offer.version (OCC — statement build pins the offer)"
        side_effects:
          - "runs commission_split, sales_use_tax, proration_aggregator, lien_payoff_waterfall, closing_total"
          - "sets statement.status = BALANCED"
          - "creates TaxAssessment rows per tax outcome"
          - "increments statement.version by 1"
      - from: BALANCED
        to: APPROVED
        trigger: "POST /yacht/closing-statements/{id}/approve"
        actor: ListingAgent
        preconditions:
          - "statement.status == BALANCED"
          - "expected_statement_version == statement.version (OCC)"
          - "approver role differs from builder role (segregation of duties: ClosingOfficer built, ListingAgent approves)"
        side_effects:
          - "sets statement.status = APPROVED"
          - "increments statement.version by 1"
      - from: APPROVED
        to: BALANCED
        trigger: "POST /yacht/closing-statements/{id}/reopen"
        actor: ClosingOfficer
        preconditions:
          - "statement.status == APPROVED"
          - "no EscrowLedgerEntry on this offer in DISBURSED yet"
        side_effects:
          - "sets statement.status = BALANCED"
          - "re-runs all five calculations"
          - "increments statement.version by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /yacht/closing-statements/{id}/disburse"
        actor: ClosingOfficer
        preconditions:
          - "statement.status == APPROVED"
          - "every CLEARED DEPOSIT escrow entry on the offer transitioned to DISBURSED via /release"
          - "title transfer for this statement is EXECUTED"
          - "vessel.liens_status == CLEAN"
        side_effects:
          - "sets statement.status = DISBURSED"
          - "sets offer.status = CLOSED (cross-entity)"
          - "sets listing.status = CLOSED (cross-entity)"
          - "sets TitleTransfer.status = RECORDED"
          - "sets TaxAssessment rows to FILED"
          - "increments statement.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /yacht/closing-statements/{id}/void"
        actor: ClosingOfficer
        preconditions:
          - "statement.status in {DRAFT, BALANCED}"
        side_effects:
          - "sets statement.status = VOIDED"
      - from: BALANCED
        to: VOIDED
        trigger: "POST /yacht/closing-statements/{id}/void"
        actor: ClosingOfficer
        preconditions:
          - "statement.status in {DRAFT, BALANCED}"
        side_effects:
          - "sets statement.status = VOIDED"
          - "voids attached TaxAssessment rows (status = VOIDED)"

  - entity: TitleTransfer
    initial_state: DRAFT
    terminal_states: [RECORDED, REVOKED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /yacht/title-transfers/{id}/execute"
        actor: ClosingOfficer
        preconditions:
          - "transfer.status == DRAFT"
          - "statement.status == APPROVED"
          - "warranty_of_title == FULL requires vessel.liens_status == CLEAN"
          - "USCG vessels: a VALID USCG_COD DocumentationRecord exists"
          - "STATE vessels: a VALID STATE_TITLE DocumentationRecord exists"
        side_effects:
          - "sets transfer.status = EXECUTED"
          - "sets executed_at = clock"
          - "increments transfer.version by 1"
      - from: EXECUTED
        to: RECORDED
        trigger: "system effect of closing-statements/{id}/disburse"
        actor: system
        preconditions:
          - "statement DISBURSED"
        side_effects:
          - "sets transfer.status = RECORDED"
          - "sets attached DocumentationRecord.status = TRANSFERRED"
      - from: EXECUTED
        to: REVOKED
        trigger: "POST /yacht/title-transfers/{id}/revoke (unwind before disbursement)"
        actor: ClosingOfficer
        preconditions:
          - "transfer.status == EXECUTED"
          - "statement.status != DISBURSED"
        side_effects:
          - "sets transfer.status = REVOKED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-accept-stale-version
    parent_entity: Offer
    write_endpoint: "POST /yacht/offers/{id}/accept"
    occ_field: "expected_offer_version"
    description: |
      Accepting an Offer whose version has advanced since the caller last observed
      it is rejected. Captures the case where a counter transition legitimately
      moved the offer to a new round and the caller's stale accept must not
      silently reactivate the superseded round.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-approve-stale-version
    parent_entity: ClosingStatement
    write_endpoint: "POST /yacht/closing-statements/{id}/approve"
    occ_field: "expected_statement_version"
    description: |
      Approving a ClosingStatement whose version has advanced since the caller
      last observed it is rejected. Captures the case where a reopen/rebalance
      cycle has legitimately recomputed the figures and the caller's stale
      approval must not bless superseded numbers.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: statement-build-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /yacht/closing-statements/{id}/build"
    occ_field: "expected_offer_version"
    description: |
      Building a ClosingStatement against an Offer whose version has advanced
      since the caller last observed it is rejected. Statement figures are
      pinned to the accepted offer snapshot; a newer offer round invalidates
      the caller's basis.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: commission_split
    trigger: "on ClosingStatement build (DRAFT -> BALANCED) and reopen (APPROVED -> BALANCED)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — tier selection on gross_price_cents
      if gross_price_cents < 500000000:        tier_rate = TIER_LOW_RATE
      elif gross_price_cents < 2000000000:     tier_rate = TIER_MID_RATE
      else:                                     tier_rate = TIER_HIGH_RATE
      # Step 2 — gross commission (round BEFORE split; order pinned)
      commission_cents = round_half_up(gross_price_cents * tier_rate)
      # Step 3 — co-broke split between listing side and selling side
      if offer.selling_agent.brokerage_id == listing.brokerage_id:
          listing_side_cents = commission_cents            # in-house: listing side keeps all
          selling_side_cents = 0
      else:
          selling_side_cents  = round_half_up(commission_cents * CO_BROKER_SHARE)
          listing_side_cents  = commission_cents - selling_side_cents   # remainder, NOT re-rounded
      # Step 4 — agent-vs-house split WITHIN each side (per-line rounding, pinned)
      # listing agent earns split_pct_basis of listing_side; selling agent of selling_side
      # These per-agent figures are informational on the statement; the side totals above are authoritative.
    input_set: "ClosingStatement.gross_price_cents, ListingAgreement.commission_tier_code (fallback Brokerage.default_commission_tier_code), Offer.selling_agent.brokerage_id vs Listing.brokerage_id"
    constants:
      TIER_LOW_RATE: 0.10
      TIER_MID_RATE: 0.08
      TIER_HIGH_RATE: 0.06
      CO_BROKER_SHARE: 0.50
    precision: "integer cents; round_half_up at each labelled step; step order fixed as written"
    variants:
      - name: standard_tier
        when: "commission_tier_code == STANDARD"
        difference: "rates as listed in constants"
      - name: premier_tier
        when: "commission_tier_code == PREMIER"
        difference: "tier rates all multiplied by 1.10 (premium desk), thresholds unchanged"
      - name: boutique_tier
        when: "commission_tier_code == BOUTIQUE"
        difference: "flat 0.05 regardless of gross tier; bypasses Step 1"

  - name: sales_use_tax
    trigger: "on ClosingStatement build / reopen"
    algorithm: threshold
    formula: |
      if offer.offshore_delivery == true and tax_assessment.exemption_code == OFFSHORE_DELIVERY:
          basis_cents = 0; amount_cents = 0; assessment status = EXEMPT
      else:
          situs = offer.settlement_state_code
          raw_basis = gross_price_cents
          # Per-state caps and rates (STATUTORY table pinned as constants)
          rate = STATE_RATE[situs]
          cap  = STATE_CAP_CENTS[situs]            # tax owed never exceeds cap (FL $18,000 cap on boats)
          uncapped = round_half_up(raw_basis * rate)
          amount_cents = min(uncapped, cap)
          # Boundary rule: amount == cap exactly when uncapped >= cap (inclusive >=, pinned)
          basis_cents = raw_basis
          # Use-tax credit: if buyer residency != situs and residency state grants credit,
          # use_tax_due_home = max(0, home_rate*basis - amount_cents) — computed but recorded separately
    input_set: "ClosingStatement.gross_price_cents, Offer.offshore_delivery, Offer.settlement_state_code, Client.residency_state_code, TaxAssessment.exemption_code"
    constants:
      STATE_RATE: {FL: 0.06, CA: 0.0725, WA: 0.065, NY: 0.04, TX: 0.0625, RI: 0.07, MD: 0.06, NC: 0.0475, SC: 0.06, MA: 0.0625, GA: 0.04, NJ: 0.06625}
      STATE_CAP_CENTS: {FL: 1800000, CA: 9223372036854775807, WA: 9223372036854775807, NY: 9223372036854775807, TX: 9223372036854775807, RI: 9223372036854775807, MD: 9223372036854775807, NC: 9223372036854775807, SC: 3000000, MA: 9223372036854775807, GA: 9223372036854775807, NJ: 9223372036854775807}
    precision: "integer cents; round_half_up once on uncapped amount before min() with cap"
    variants:
      - name: sales_tax_situs
        when: "delivery within situs state waters"
        difference: "rate/cap of settlement_state_code apply"
      - name: offshore_exempt
        when: "offshore_delivery == true and exemption validated"
        difference: "basis and amount both 0; assessment recorded with status EXEMPT for audit"

  - name: proration_aggregator
    trigger: "on ClosingStatement build / reopen"
    algorithm: chronological
    formula: |
      # Prorate slip fees / fuel credits / insurance from closing date to period end.
      # Chronological accumulation, DAY-BY-DAY, over the closing month.
      # days_in_month determined from clock calendar at closing date.
      # credit_to_seller_per_day = round_half_up(monthly_slip_fee_cents / days_in_month)   # per-day rounding pinned
      # prorations_cents = credit_to_seller_per_day * days_remaining_in_month_inclusive_of_closing_day
      # Note: per-day rounding first, then multiply — reverse order yields different cents and is FORBIDDEN.
    input_set: "closing date (clock), ListingAgreement-attached slip fee schedule (fixed constant SLIP_FEE_CENTS), fuel credit constant"
    constants:
      SLIP_FEE_CENTS: 450000     # $4,500/month
      FUEL_CREDIT_CENTS: 75000   # flat credit
    precision: "integer cents; per-day round_half_up THEN multiply; fuel credit added after, unrounded"

  - name: lien_payoff_waterfall
    trigger: "on ClosingStatement build / reopen"
    algorithm: waterfall_allocation
    formula: |
      # Available payoff pool = gross_price_cents - commission_cents - tax_cents + prorations_cents
      # Allocate pool to liens ordered by (priority_rank ASC, created_at ASC).
      # Each lien takes min(remaining_pool, lien.amount_cents).
      # payoff_amount_cents = allocated; status SATISFIED iff allocated == amount_cents.
      # If pool < 0 treat pool as 0.
      # If any lien lands PARTIALLY_SATISFIED (0 < payoff < amount), the closing CANNOT
      # proceed to disbursement — vessel remains ENCUMBERED.
    input_set: "LienRecord rows on vessel in status RECORDED, ordered (priority_rank ASC, created_at ASC); pool from closing_total inputs"
    constants: {}
    precision: "integer cents, no rounding — waterfall allocation is exact"
    variants: []

  - name: closing_total
    trigger: "on ClosingStatement build / reopen, AFTER commission_split, sales_use_tax, proration_aggregator, lien_payoff_waterfall (evaluation order pinned)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency resolved by fixed evaluation order:
      #   1. commission_cents (depends on gross only)
      #   2. tax_cents        (depends on gross; NOT on commission)
      #   3. prorations_cents (depends on clock)
      #   4. waterfall pool = gross - commission - tax + prorations  (defines lien_payoff_total)
      #   5. seller_net_cents = gross - commission - tax - lien_payoff_total + prorations
      #   6. buyer_due_cents  = gross + tax - escrow_applied_cents
      # escrow_applied_cents = sum of EscrowLedgerEntry.amount_cents where offer_id == offer.id
      #                        AND entry_type == DEPOSIT AND status == CLEARED
      # The reverse order (seller_net first) is FORBIDDEN — pool must exist before liens pay out.
    input_set: "All computed fields of the same ClosingStatement plus CLEARED DEPOSIT EscrowLedgerEntry rows on the offer"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: escrow_interest_accrual
    trigger: "on escrow entry clear (provisional) and on closing build (final reconciliation)"
    algorithm: aggregation
    formula: |
      # Provisional accrual: simple interest on cleared deposits from value_date to clock,
      # rate PROV_RATE, day-count ACT/360, rounding per entry.
      # Final accrual at closing: same inputs but rate FINAL_RATE and day-count ACT/365.
      # The two variants legitimately diverge for identical inputs; final supersedes provisional
      # on the closing statement's prorations (interest credited to buyer).
      # interest_cents = round_half_up(amount_cents * rate * days_elapsed / day_count_base)
    input_set: "EscrowLedgerEntry rows in CLEARED status for the offer; clock"
    constants:
      PROV_RATE: 0.0100
      FINAL_RATE: 0.0125
      PROV_DAY_BASE: 360
      FINAL_DAY_BASE: 365
    precision: "integer cents, round_half_up per entry then sum"
    variants:
      - name: provisional
        when: "before closing statement build"
        difference: "PROV_RATE with ACT/360"
      - name: final
        when: "at closing statement build"
        difference: "FINAL_RATE with ACT/365; replaces provisional figures"

  - name: documentation_fee
    trigger: "on ClosingStatement build / reopen"
    algorithm: forward_looking
    formula: |
      # USCG vessels: flat COD transfer fee + per-foot documentation recording fee
      #   uscg_fee_cents = COD_FLAT_CENTS + round_half_up(vessel.length_overall_ft) * PER_FOOT_CENTS
      # STATE vessels: title transfer fee is a percent of gross with per-state cap
      #   state_fee_cents = min(round_half_up(gross_price_cents * STATE_TITLE_RATE), STATE_TITLE_CAP_CENTS[situs])
      # Provisional (forward-looking) variant uses listing.list_price_cents as gross proxy
      # BEFORE an offer is accepted; final variant uses statement.gross_price_cents.
    input_set: "Vessel.documentation_mode, Vessel.length_overall_ft, gross price (offer or listing per variant), situs"
    constants:
      COD_FLAT_CENTS: 13300
      PER_FOOT_CENTS: 400
      STATE_TITLE_RATE: 0.0015
      STATE_TITLE_CAP_CENTS: {FL: 200000, CA: 250000, WA: 225000, NY: 200000, TX: 200000, RI: 200000, MD: 200000, NC: 200000, SC: 200000, MA: 200000, GA: 200000, NJ: 200000}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "pre-acceptance estimate on a ListingAgreement (uses list price)"
        difference: "basis = listing.list_price_cents"
      - name: final
        when: "at closing statement build (uses accepted offer price)"
        difference: "basis = statement.gross_price_cents"

  - name: deposit_requirement
    trigger: "on Offer create (validation of deposit_pct_basis) and on escrow DEPOSIT entry create"
    algorithm: threshold
    formula: |
      # required_deposit_cents = round_half_up(offer.offer_price_cents * offer.deposit_pct_basis / 10000)
      # Boundary: a DEPOSIT entry amount must be >= required_deposit_cents (inclusive >= pinned);
      # exactly-equal is accepted.
      # DEPOSIT entry exceeding 2x required triggers ERR_DEPOSIT_EXCESSIVE (anti-structuring guard).
    input_set: "Offer.offer_price_cents, Offer.deposit_pct_basis"
    constants:
      MAX_DEPOSIT_MULTIPLE: 2
    precision: "integer cents, round_half_up"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body-referenced FK ids exist (listing_id, buyer_id, selling_agent_id, vessel_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH"
  - priority: 5
    category: state
    check: "Target resource state permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current version where §1.2.1 applies"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /yacht/offers/{id}/accept, POST /yacht/offers/{id}/counter, POST /yacht/closing-statements/{id}/build, POST /yacht/closing-statements/{id}/approve"
  - priority: 7
    category: business_safety
    check: "Anti-structuring: single DEPOSIT entry amount must be <= 2x required_deposit_cents"
    error_id: ERR_DEPOSIT_EXCESSIVE
    http_status: 422
    applies_to: "POST /yacht/offers/{id}/escrow-entries"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: ClosingStatement approve must be executed by a ListingAgent, not by the ClosingOfficer who built it (actor role of build must differ from actor role of approve)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /yacht/closing-statements/{id}/approve"
  - priority: 9
    category: business_constraint
    check: "Uniqueness: Vessel.hin unique; one non-terminal ListingAgreement per vessel_id; one ClosingStatement per offer_id"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /yacht/vessels, POST /yacht/listings, POST /yacht/closing-statements"
  - priority: 10
    category: business_constraint
    check: "Vessel documentation coherence: uscg_official_no present iff documentation_mode == USCG; state_title_no present iff documentation_mode == STATE"
    error_id: ERR_DOC_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /yacht/vessels, PUT /yacht/vessels/{id}"
  - priority: 11
    category: business_temporal
    check: "Offer.acceptance_deadline must be > clock at creation; Contingency.deadline > clock when renegotiated; ListingAgreement end_date > start_date"
    error_id: ERR_INVALID_DEADLINE
    http_status: 422
    applies_to: "POST /yacht/offers, POST /yacht/contingencies/{id}/renegotiate, POST /yacht/listings"
  - priority: 12
    category: business_temporal
    check: "Acceptance window: accept/reject/counter rejected when clock > offer.acceptance_deadline"
    error_id: ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /yacht/offers/{id}/accept, POST /yacht/offers/{id}/reject, POST /yacht/offers/{id}/counter"
  - priority: 13
    category: business_referential
    check: "Lien instrument coherence: PREFERRED_MORTGAGE only on USCG-documented vessels"
    error_id: ERR_LIEN_INSTRUMENT_MISMATCH
    http_status: 422
    applies_to: "POST /yacht/vessels/{id}/liens"
  - priority: 14
    category: business_referential
    check: "Offer creation requires listing.status in {ACTIVE, UNDER_CONTRACT}; offers on SUSPENDED/UNDER_CONTRACT-with-no-kickout listings rejected"
    error_id: ERR_LISTING_NOT_ACCEPTING
    http_status: 409
    applies_to: "POST /yacht/offers"
  - priority: 15
    category: business_referential
    check: "TitleTransfer.warranty_of_title == FULL requires vessel.liens_status == CLEAN at execute time"
    error_id: ERR_TITLE_ENCUMBERED
    http_status: 422
    applies_to: "POST /yacht/title-transfers/{id}/execute"
  - priority: 16
    category: business_fiscal
    check: "Deposit sufficiency: DEPOSIT entry amount_cents >= required_deposit_cents per deposit_requirement"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /yacht/offers/{id}/escrow-entries"
  - priority: 17
    category: business_fiscal
    check: "Escrow refund/forfeit/release only against CLEARED entries; amount already terminal rejected"
    error_id: ERR_ESCROW_NOT_CLEARED
    http_status: 409
    applies_to: "POST /yacht/escrow-entries/{id}/release, POST /yacht/escrow-entries/{id}/refund, POST /yacht/escrow-entries/{id}/forfeit"
  - priority: 18
    category: business_fiscal
    check: "Disbursement requires vessel.liens_status == CLEAN (all liens SATISFIED or RELEASED)"
    error_id: ERR_LIENS_OUTSTANDING
    http_status: 422
    applies_to: "POST /yacht/closing-statements/{id}/disburse"
  - priority: 19
    category: business_constraint
    check: "Syndication push requires listing.status == ACTIVE and payload_price_cents == listing.list_price_cents"
    error_id: ERR_SYNDICATION_STALE_PRICE
    http_status: 422
    applies_to: "POST /yacht/listings/{id}/syndication-events"
  - priority: 20
    category: business_constraint
    check: "Required-field and enum-shape validation on every input field; unknown fields ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
