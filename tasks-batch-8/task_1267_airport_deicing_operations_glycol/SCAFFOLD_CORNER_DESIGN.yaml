  # =================================================================
  # Section: rbac
  # =================================================================
  - section: rbac
    instances:
      - name: airline_rep_cannot_create_pad_forbidden
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "AirlineRep is not in the roles of POST /deice-ops/pads; the attempt is rejected ERR_FORBIDDEN (403) before existence checks."
        test_recipe:
          setup: ["Station and airline exist"]
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "SMALL", rated_collection_pct: 60 }, as: AirlineRep, as_user_id: "${al}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP status 403"

      - name: airline_rep_scoped_to_own_airline
        claim_type: ownership_scope
        grounds: [roles, entities.Airline]
        distinguishing_aspect: "entity_backed identity: AirlineRep with X-User-ID of airline A reading airline B's record is ERR_FORBIDDEN; reading its own record succeeds."
        test_recipe:
          setup: ["Airlines A and B exist"]
          setup_api_calls:
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air A", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { ala: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "BB", name: "Air B", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { alb: $.data.id } }
          trigger:
            - { call: "GET /deice-ops/airlines/${alb}", as: AirlineRep, as_user_id: "${ala}", captures: { err: $.data.error_id } }
            - { call: "GET /deice-ops/airlines/${ala}", as: AirlineRep, as_user_id: "${ala}", captures: { code: $.data.code } }
          assert:
            - "Cross-airline read: error_id == ERR_FORBIDDEN"
            - "Own read: succeeds, code == AA"

      - name: inspector_cannot_complete_operation_forbidden
