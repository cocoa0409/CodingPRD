# =============================================================================
# SCAFFOLD.yaml — Blood Bank & Transfusion Service (task 2010)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2010. Blood Bank & Transfusion Service (hospital blood bank): donor unit inventory by type/product & expiration, type & screen, crossmatch & antibody workup, order verification & massive transfusion protocol activation, issue/return & 30-minute rule, transfusion reaction reporting & investigation, product wastage tracking & shortage triage, blood supplier ordering & emergency release, look-back & recall of implicated units

domain_name: blood-bank-transfusion-service
api_prefix: /blood-bank

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: |
    Deliberately pushed past the Expert band per user directive: 15 entities,
    13 state machines, 87 endpoints, 60+ error codes. Difficulty is carried by
    coupling density (cascades up to depth 4, dual-variant calculations in two
    entity domains, a combinatorial compatibility matrix with opposite ABO logic
    per product class, segregation-of-duties identity checks, and four
    boundary-precision rules on distinct metrics), not by entity count alone.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all FK links in bodies)
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across all patients" }
      - { name: full_name, type: string, source: input, description: "Patient full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: special_requirements, type: array, source: input, default: [], description: "Subset of [IRRADIATED, CMV_NEGATIVE, WASHED]; every unit issued must satisfy all listed requirements" }
      - { name: current_abo_type, type: enum, source: computed, default: UNKNOWN, description: "O | A | B | AB | UNKNOWN — copied from the most recently validated TypeAndScreen (latest validated_at); historical fact, retained after T&S expiry" }
      - { name: current_rh_type, type: enum, source: computed, default: UNKNOWN, description: "POS | NEG | UNKNOWN — same source as current_abo_type" }
      - { name: antibody_status, type: enum, source: computed, default: UNKNOWN, description: "NEGATIVE | POSITIVE | UNKNOWN — antibody_screen of the most recently validated TypeAndScreen" }
      - { name: identified_antibodies, type: array, source: computed, default: [], description: "antibody_identifications of the most recently validated TypeAndScreen (e.g. [anti-K, anti-Jka])" }
      - { name: abo_confirmed, type: boolean, source: computed, default: false, description: "Latched true once two TypeAndScreens from distinct specimens (distinct specimen_collected_at) validate with the same abo_result; never auto-clears" }
      - { name: has_active_type_and_screen, type: boolean, source: computed, default: false, description: "True iff patient has a TypeAndScreen with status ACTIVE (server now < its expires_at)" }
      - { name: active_mtp, type: boolean, source: computed, default: false, description: "True iff an MTPActivation with status ACTIVATED exists for this patient" }
      - { name: total_units_transfused, type: integer, source: computed, default: 0, description: "Count of IssueRecords for this patient reaching status TRANSFUSED" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier name" }
      - { name: license_number, type: string, source: input, description: "Regulatory license number; unique" }
      - { name: default_lead_time_hours, type: integer, source: input, default: 48, description: "Nominal delivery lead time" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (state machine: ACTIVE <-> SUSPENDED)" }
      - { name: suspended_at, type: datetime, source: system, description: "Set on suspend; null when ACTIVE" }
      - { name: suspend_reason, type: string, source: input, description: "Reason given at suspend" }

  - name: SupplierOrder
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; ordering supplier" }
      - { name: is_emergency, type: boolean, source: input, default: false, description: "Emergency shipment; auto-acknowledges on submit and applies cost surcharge" }
      - { name: lines, type: array, source: input, description: "Array of {product_type, abo_type, rh_type, quantity}; quantity integer >= 1" }
      - { name: expected_delivery_at, type: datetime, source: input, description: "Optional expected delivery timestamp; drives prospective posture inclusion" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | RECEIVING | CLOSED | CANCELLED" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "calculations.supplier_order_estimated_cost; computed at create, recomputed never (lines immutable)" }
      - { name: received_summary, type: array, source: computed, default: [], description: "Per-line received quantities: [{product_type, abo_type, rh_type, received_qty}]" }
      - { name: total_units_received, type: integer, source: computed, default: 0, description: "Sum of received units" }
      - { name: backordered, type: boolean, source: computed, default: false, description: "True when CLOSED with any line received_qty < quantity" }

  - name: BloodUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_number, type: string, source: input, description: "Supplier-assigned unit identifier (ISBT DIN); globally unique" }
      - { name: supplier_order_id, type: string, source: system, description: "FK -> SupplierOrder.id; the receipt that created this unit" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; denormalized from supplier order at receipt" }
      - { name: donor_id, type: string, source: input, description: "Opaque donor identifier (not an entity); look-back scope key" }
      - { name: lot_number, type: string, source: input, description: "Supplier lot number; recall scope key" }
      - { name: product_type, type: enum, source: input, description: "RBC | WHOLE_BLOOD | PLT_APHERESIS | PLT_POOL | FFP | CRYO" }
      - { name: abo_type, type: enum, source: input, description: "O | A | B | AB" }
      - { name: rh_type, type: enum, source: input, description: "POS | NEG" }
      - { name: volume_ml, type: integer, source: input, description: "Unit volume, > 0" }
      - { name: collected_at, type: datetime, source: input, description: "Collection timestamp; must not be in the future" }
      - { name: thawed_at, type: datetime, source: input, description: "Optional; set for thawed FFP/CRYO — starts the derived-product clock" }
      - { name: pooled_at, type: datetime, source: input, description: "Optional; set for PLT_POOL — starts the 4-hour pool clock" }
      - { name: expires_at, type: datetime, source: computed, description: "calculations.unit_expiration_at_receive; min of class shelf life and derived-product clock" }
      - { name: antigen_negative, type: array, source: input, default: [], description: "Antigens the unit tested negative for; subset of [K, k, C, c, E, e, Jka, Jkb, Fya, Fyb, S, s]" }
      - { name: irradiated, type: boolean, source: input, default: false, description: "Irradiated unit" }
      - { name: cmv_negative, type: boolean, source: input, default: false, description: "CMV-seronegative unit" }
      - { name: washed, type: boolean, source: input, default: false, description: "Washed unit" }
      - { name: derived_from_unit_id, type: string, source: input, description: "FK -> BloodUnit.id; optional self-reference for split/aliquot units" }
      - { name: status, type: enum, source: system, description: "QUARANTINED | AVAILABLE | RESERVED | ISSUED | TRANSFUSED | EXPIRED | DISCARDED | REJECTED | RETURNED_TO_SUPPLIER | QUARANTINED_HOLD" }
      - { name: hold_origin_state, type: enum, source: system, description: "QUARANTINED | AVAILABLE | RESERVED | ISSUED — state the unit occupied when QUARANTINED_HOLD was entered; null otherwise" }
      - { name: hold_reason, type: enum, source: system, description: "REACTION_PRECAUTION | RECALL | SUPPLIER_SUSPENSION; null when not held" }
      - { name: intake_reject_reason, type: string, source: system, description: "Reason recorded on reject-intake; null otherwise" }

  - name: TypeAndScreen
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: specimen_collected_at, type: datetime, source: input, description: "Specimen collection timestamp; must not be in the future; must differ from any other non-REJECTED TypeAndScreen of the same patient (ERR_DUPLICATE_SPECIMEN)" }
      - { name: expires_at, type: datetime, source: computed, description: "= specimen_collected_at + 72h (TS_VALIDITY_HOURS). ACTIVE requires server now < expires_at (strict)" }
      - { name: abo_result, type: enum, source: input, description: "O | A | B | AB — set via the result endpoint only" }
      - { name: rh_result, type: enum, source: input, description: "POS | NEG — set via the result endpoint only" }
      - { name: antibody_screen, type: enum, source: input, description: "NEGATIVE | POSITIVE — set via the result endpoint only" }
      - { name: antibody_identifications, type: array, source: input, default: [], description: "Identified antibodies (e.g. [anti-K]); REQUIRED non-empty when antibody_screen == POSITIVE (ERR_ANTIBODY_DETAIL_REQUIRED)" }
      - { name: resulted_at, type: datetime, source: system, description: "Set when result recorded; null before" }
      - { name: resulted_by_user_id, type: string, source: system, description: "X-User-ID of the technologist who recorded the result" }
      - { name: validated_at, type: datetime, source: system, description: "Set on validate; null before" }
      - { name: validated_by_user_id, type: string, source: system, description: "X-User-ID of validator; MUST differ from resulted_by_user_id (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "COLLECTED | RESULTED | ACTIVE | EXPIRED | SUPERSEDED | REJECTED" }
      - { name: reject_reason, type: string, source: input, description: "Set via reject-specimen" }

  - name: TransfusionOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: ordering_physician_id, type: string, source: system, description: "X-User-ID of the OrderingPhysician creator" }
      - { name: product_type, type: enum, source: input, description: "RBC | WHOLE_BLOOD | PLT_APHERESIS | PLT_POOL | FFP | CRYO" }
      - { name: units_requested, type: integer, source: input, description: "1..20" }
      - { name: urgency, type: enum, source: input, description: "ROUTINE | URGENT | EMERGENCY" }
      - { name: indication_code, type: string, source: input, description: "Clinical indication code" }
      - { name: requires_crossmatch, type: boolean, source: computed, description: "= (product_type IN {RBC, WHOLE_BLOOD})" }
      - { name: type_restriction, type: enum, source: computed, default: NONE, description: "NONE | O_ONLY | AB_ONLY — set at verify: EMERGENCY orders verified without an ACTIVE T&S get O_ONLY (RBC/WHOLE_BLOOD) or AB_ONLY (plasma products)" }
      - { name: demand_bucket, type: string, source: computed, description: "<product_type>:<abo>:<rh> evaluated at verify: patient current_abo_type/current_rh_type; UNKNOWN maps to O:NEG for RBC/WHOLE_BLOOD and AB:NEG for plasma products" }
      - { name: special_requirements_snapshot, type: array, source: computed, default: [], description: "Copy of patient.special_requirements taken at verify" }
      - { name: units_crossmatched, type: integer, source: computed, default: 0, description: "Count of Crossmatches for this order with status COMPATIBLE" }
      - { name: units_issued_net, type: integer, source: computed, default: 0, description: "Count of IssueRecords for this order in status ISSUED | TRANSFUSION_STARTED | TRANSFUSED" }
      - { name: units_transfused, type: integer, source: computed, default: 0, description: "Count of IssueRecords for this order in status TRANSFUSED" }
      - { name: verified_by_user_id, type: string, source: system, description: "Technologist who verified; MUST differ from ordering_physician_id" }
      - { name: verified_at, type: datetime, source: system, description: "Set at verify; null before" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED (transient) | AWAITING_CROSSMATCH | READY | PARTIALLY_ISSUED | ON_HOLD | COMPLETED | CANCELLED | REJECTED" }
      - { name: rejection_reason, type: string, source: input, description: "Set via reject endpoint" }
      - { name: cancel_reason, type: string, source: input, description: "Set via cancel endpoint" }

  - name: Crossmatch
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> TransfusionOrder.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> BloodUnit.id; optional at create — when omitted the server auto-selects per calculations.fefo_unit_selector and sets auto_selected=true" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the order at create" }
      - { name: method, type: enum, source: computed, description: "ELECTRONIC iff patient.abo_confirmed AND patient.antibody_status == NEGATIVE; else SEROLOGIC_AHG" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPATIBLE | INCOMPATIBLE | EXPIRED | CANCELLED | CONSUMED" }
      - { name: auto_selected, type: boolean, source: computed, default: false, description: "True when the server selected the unit" }
      - { name: resulted_at, type: datetime, source: system, description: "Set on record-result; null before" }
      - { name: resulted_by_user_id, type: string, source: system, description: "Technologist who recorded the result" }
      - { name: reserved_until, type: datetime, source: system, description: "= min(resulted_at + 72h, unit.expires_at, type_and_screen.expires_at); set on COMPATIBLE; EXPIRED when server now >= reserved_until" }

  - name: MTPActivation
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: activated_by_physician_id, type: string, source: system, description: "X-User-ID of the activating OrderingPhysician" }
      - { name: activation_reason, type: string, source: input, description: "Free-text justification, >= 10 chars" }
      - { name: status, type: enum, source: system, description: "ACTIVATED | STANDING_DOWN | DEACTIVATED" }
      - { name: packs_dispatched, type: integer, source: computed, default: 0, description: "Number of dispatch-pack calls completed" }
      - { name: units_issued_total, type: integer, source: computed, default: 0, description: "IssueRecords created under this activation" }
      - { name: units_wasted_total, type: integer, source: computed, default: 0, description: "WastageRecords referencing units issued under this activation" }
      - { name: activated_at, type: datetime, source: system, description: "Set at create" }
      - { name: stood_down_at, type: datetime, source: system, description: "Set at stand-down" }
      - { name: deactivated_at, type: datetime, source: system, description: "Set at deactivate" }

  - name: IssueRecord
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> TransfusionOrder.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> BloodUnit.id; required for RBC/WHOLE_BLOOD standard issues (must be RESERVED via a COMPATIBLE crossmatch for this order); optional for plasma-product and emergency issues (auto-select per calculations.fefo_unit_selector)" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the order" }
      - { name: mtp_activation_id, type: string, source: system, description: "FK -> MTPActivation.id; set when created by dispatch-pack; null otherwise" }
      - { name: is_emergency_release, type: boolean, source: computed, default: false, description: "True when issued under emergency semantics (explicit flag on a qualifying order, or any dispatch-pack issue)" }
      - { name: emergency_justification, type: string, source: input, description: "Required (>= 20 chars) when is_emergency_release is true (ERR_EMERGENCY_JUSTIFICATION_REQUIRED)" }
      - { name: verified_by_user_id, type: string, source: input, description: "Second technologist performing independent verification; MUST differ from the caller X-User-ID (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing technologist" }
      - { name: issued_at, type: datetime, source: system, description: "Set at create" }
      - { name: transfusion_started_at, type: datetime, source: system, description: "Set at start-transfusion; must be <= issued_at + 4h (ERR_TRANSFUSION_START_WINDOW_LAPSED)" }
      - { name: completed_at, type: datetime, source: system, description: "Set at complete-transfusion" }
      - { name: returned_at, type: datetime, source: system, description: "Set at return (server clock)" }
      - { name: return_seal_intact, type: boolean, source: input, description: "Required at return" }
      - { name: return_temperature_excursion, type: boolean, source: input, description: "Required at return" }
      - { name: return_disposition, type: enum, source: computed, description: "RESTOCKED | DISCARDED_OVER_30MIN | DISCARDED_COMPROMISED — calculations.return_disposition (30-minute rule); null until returned" }
      - { name: physician_acknowledged_at, type: datetime, source: system, description: "Set by acknowledge-emergency; required within 24h of issued_at for emergency releases (ERR_EMERGENCY_ACK_WINDOW_LAPSED)" }
      - { name: ack_overdue, type: boolean, source: computed, default: false, description: "is_emergency_release AND physician_acknowledged_at is null AND server now > issued_at + 24h" }
      - { name: lookback_notified, type: boolean, source: system, default: false, description: "Set true by recall record-notification" }
      - { name: status, type: enum, source: system, description: "ISSUED | TRANSFUSION_STARTED | TRANSFUSED | RETURNED | TRANSFUSION_STOPPED" }

  - name: TransfusionReaction
    parent: null
    common_fields: true
    fields:
      - { name: issue_record_id, type: string, source: input, description: "FK -> IssueRecord.id; must be TRANSFUSION_STARTED or TRANSFUSED (ERR_ISSUE_NOT_REACTIONABLE)" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; denormalized from the issue record" }
      - { name: unit_id, type: string, source: system, description: "FK -> BloodUnit.id; denormalized from the issue record" }
      - { name: reaction_type, type: enum, source: input, description: "FEBRILE_NON_HEMOLYTIC | ALLERGIC_MILD | ALLERGIC_ANAPHYLAXIS | HEMOLYTIC_ACUTE | HEMOLYTIC_DELAYED | TRALI | TACO | SEPTIC | OTHER" }
      - { name: severity, type: enum, source: input, description: "MILD | MODERATE | SEVERE | LIFE_THREATENING" }
      - { name: symptoms, type: string, source: input, description: "Optional free text" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporting technologist" }
      - { name: investigator_user_id, type: string, source: system, description: "X-User-ID of the QualityOfficer who began the investigation; MUST differ from reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: clerical_check_passed, type: boolean, source: input, description: "Workup field, set via record-workup" }
      - { name: dat_result, type: enum, source: input, description: "POSITIVE | NEGATIVE — workup field" }
      - { name: hemolysis_present, type: boolean, source: input, description: "Workup field" }
      - { name: workup_recorded_at, type: datetime, source: system, description: "Null until record-workup; conclude requires it (ERR_REACTION_WORKUP_MISSING)" }
      - { name: conclusion, type: enum, source: input, description: "CONFIRMED | RULED_OUT — set via conclude" }
      - { name: final_classification, type: string, source: input, description: "Optional final classification text at conclude" }
      - { name: linked_recall_case_id, type: string, source: system, description: "FK -> RecallCase.id; set when a CONFIRMED severe reaction (HEMOLYTIC_ACUTE | TRALI | SEPTIC) auto-creates a recall; null otherwise" }
      - { name: status, type: enum, source: system, description: "REPORTED | INVESTIGATING | CONFIRMED | RULED_OUT | CLOSED" }

  - name: RecallCase
    parent: null
    common_fields: true
    fields:
      - { name: scope_type, type: enum, source: input, description: "DONOR | LOT | UNIT" }
      - { name: donor_id, type: string, source: input, description: "Required iff scope_type == DONOR (ERR_RECALL_SCOPE_INVALID)" }
      - { name: lot_number, type: string, source: input, description: "Required iff scope_type == LOT" }
      - { name: unit_id, type: string, source: input, description: "FK -> BloodUnit.id; required iff scope_type == UNIT" }
      - { name: implicated_since, type: datetime, source: input, description: "Optional; DONOR scope only — implicates units with collected_at >= implicated_since" }
      - { name: reason, type: string, source: input, description: "Free-text reason" }
      - { name: disposition, type: enum, source: input, description: "DESTRUCTION | MARKET_WITHDRAWAL — applied to held units at close" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when auto-created by a CONFIRMED severe TransfusionReaction" }
      - { name: implicated_unit_ids, type: array, source: computed, default: [], description: "Pinned at identify-units; sorted by unit created_at ASC then unit_number ASC" }
      - { name: implicated_unit_count, type: integer, source: computed, default: 0, description: "= len(implicated_unit_ids)" }
      - { name: quarantined_count, type: integer, source: computed, default: 0, description: "Units moved to QUARANTINED_HOLD by execute-quarantine" }
      - { name: transfused_issue_count, type: integer, source: computed, default: 0, description: "IssueRecords in TRANSFUSED | TRANSFUSION_STOPPED referencing implicated units — the notification workload" }
      - { name: notifications_sent_count, type: integer, source: computed, default: 0, description: "IssueRecords marked lookback_notified by this recall" }
      - { name: status, type: enum, source: system, description: "OPEN | UNITS_IDENTIFIED | QUARANTINE_COMPLETE | NOTIFICATION_COMPLETE | CLOSED | VOIDED" }

  - name: WastageRecord
    parent: null
    common_fields: false  # append-only event: id + created_at only
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> BloodUnit.id" }
      - { name: product_type, type: enum, source: system, description: "Denormalized from the unit" }
      - { name: abo_type, type: enum, source: system, description: "Denormalized from the unit" }
      - { name: rh_type, type: enum, source: system, description: "Denormalized from the unit" }
      - { name: reason, type: enum, source: system, description: "EXPIRED | RETURNED_OVER_30MIN | RETURNED_COMPROMISED | PARTIAL_TRANSFUSION | REACTION_INVESTIGATION | RECALL_DESTRUCTION | MANUAL" }
      - { name: quantity_units, type: integer, source: system, default: 1, description: "Always 1 in this benchmark (one record per wasted unit)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the actor whose action created the record; 'system' for sweep/closure-created records" }
      - { name: note, type: string, source: input, description: "Optional note (manual discard)" }

  - name: ParLevelPolicy
    parent: null
    common_fields: true
    fields:
      - { name: product_type, type: enum, source: input, description: "Bucket key part: RBC | WHOLE_BLOOD | PLT_APHERESIS | PLT_POOL | FFP | CRYO" }
      - { name: abo_type, type: enum, source: input, description: "Bucket key part: O | A | B | AB" }
      - { name: rh_type, type: enum, source: input, description: "Bucket key part: POS | NEG" }
      - { name: watch_threshold, type: integer, source: input, description: ">= 0; must satisfy watch_threshold >= shortage_threshold >= critical_threshold (ERR_THRESHOLD_ORDER_INVALID)" }
      - { name: shortage_threshold, type: integer, source: input, description: ">= 0" }
      - { name: critical_threshold, type: integer, source: input, description: ">= 0" }
      - { name: min_shelf_life_hours, type: integer, source: input, default: 4, description: "Usable-unit horizon: a unit counts as usable only while expires_at > now + min_shelf_life_hours" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }
      - { name: current_posture, type: enum, source: computed, description: "NORMAL | WATCH | SHORTAGE | CRITICAL — calculations.bucket_physical_posture; recomputed on every inventory mutation, sweep, and policy update" }
      - { name: usable_units, type: integer, source: computed, description: "Physical usable count (see calculations.bucket_physical_posture)" }
      - { name: inbound_units_24h, type: integer, source: computed, description: "Undelivered units on SUBMITTED/ACKNOWLEDGED/RECEIVING supplier orders with expected_delivery_at <= now + 24h for this bucket" }
      - { name: excessive_wastage, type: boolean, source: computed, default: false, description: "calculations.rolling_wastage_rate for this bucket >= 0.05" }

  - name: TransportCooler
    parent: null
    common_fields: true
    fields:
      - { name: cooler_tag, type: string, source: input, description: "Unique cooler identifier" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT | RESTOCKING" }
      - { name: restock_until, type: datetime, source: system, description: "= actual_returned_at + 60min buffer; set on checkout return; null otherwise" }

  - name: CoolerCheckout
    parent: null
    common_fields: true
    fields:
      - { name: cooler_id, type: string, source: input, description: "FK -> TransportCooler.id" }
      - { name: planned_start, type: datetime, source: input, description: "Planned checkout start; planned_end > planned_start and duration <= 12h (ERR_CHECKOUT_WINDOW_INVALID)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned checkout end" }
      - { name: checked_out_by_user_id, type: string, source: system, description: "X-User-ID of the technologist" }
      - { name: actual_returned_at, type: datetime, source: system, description: "Set on return; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | RETURNED" }
      - { name: overdue, type: boolean, source: computed, default: false, description: "status == OPEN AND server now > planned_end" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BloodUnit
    initial_state: QUARANTINED
    terminal_states: [TRANSFUSED, EXPIRED, DISCARDED, REJECTED, RETURNED_TO_SUPPLIER]
    transitions:
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /blood-bank/blood-units/{id}/release-from-quarantine"
        actor: BloodBankTechnologist
        preconditions:
          - "status == QUARANTINED (ERR_UNIT_NOT_RELEASABLE)"
          - "supplier.status == ACTIVE (ERR_SUPPLIER_SUSPENDED)"
        side_effects:
          - "recompute current_posture for the unit's bucket policy"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /blood-bank/blood-units/{id}/reject-intake"
        actor: BloodBankTechnologist
        preconditions:
          - "status == QUARANTINED (ERR_UNIT_NOT_REJECTABLE)"
        side_effects:
          - "sets intake_reject_reason"
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (crossmatch record-result COMPATIBLE)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute bucket posture (usable_units decremented)"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (crossmatch CANCELLED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute bucket posture (usable_units incremented)"
      - from: RESERVED
        to: ISSUED
        trigger: "system (issue-records create consumes the crossmatch)"
        actor: system
        preconditions: []
        side_effects:
          - "linked Crossmatch -> CONSUMED"
      - from: AVAILABLE
        to: ISSUED
        trigger: "system (issue-records create for non-crossmatched product or emergency release)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: AVAILABLE
        trigger: "system (issue return with disposition RESTOCKED — 30-minute rule passed)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute bucket posture (usable_units incremented)"
          - "note: the consumed crossmatch is NOT revived; the order's fulfillment is recomputed and may drop READY -> AWAITING_CROSSMATCH"
      - from: ISSUED
        to: DISCARDED
        trigger: "system (issue return with disposition DISCARDED_OVER_30MIN or DISCARDED_COMPROMISED, or stop-transfusion)"
        actor: system
        preconditions: []
        side_effects:
          - "create WastageRecord (reason RETURNED_OVER_30MIN | RETURNED_COMPROMISED | PARTIAL_TRANSFUSION)"
          - "recompute bucket posture and rolling wastage rate"
      - from: ISSUED
        to: TRANSFUSED
        trigger: "system (complete-transfusion)"
        actor: system
        preconditions: []
        side_effects:
          - "order.units_transfused += 1; if units_transfused == units_requested, order -> COMPLETED"
          - "patient.total_units_transfused += 1 (increments Patient.version)"
      - from: ISSUED
        to: QUARANTINED_HOLD
        trigger: "system (transfusion reaction reported on a TRANSFUSION_STARTED issue)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_origin_state = ISSUED; hold_reason = REACTION_PRECAUTION"
      - from: QUARANTINED
        to: QUARANTINED_HOLD
        trigger: "system (recall execute-quarantine or supplier suspend)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_origin_state = QUARANTINED; hold_reason = RECALL | SUPPLIER_SUSPENSION"
      - from: AVAILABLE
        to: QUARANTINED_HOLD
        trigger: "system (recall execute-quarantine or supplier suspend)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_origin_state = AVAILABLE; hold_reason = RECALL | SUPPLIER_SUSPENSION"
      - from: RESERVED
        to: QUARANTINED_HOLD
        trigger: "system (recall execute-quarantine or supplier suspend)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_origin_state = RESERVED; hold_reason = RECALL | SUPPLIER_SUSPENSION"
          - "the unit's COMPATIBLE crossmatch -> CANCELLED, which itself recomputes the order (READY -> AWAITING_CROSSMATCH when fulfillment < units_requested)"
      - from: QUARANTINED_HOLD
        to: AVAILABLE
        trigger: "system (supplier reinstate releases SUPPLIER_SUSPENSION holds only)"
        actor: system
        preconditions:
          - "hold_reason == SUPPLIER_SUSPENSION"
        side_effects:
          - "always lands on AVAILABLE regardless of hold_origin_state (a RESERVED unit's crossmatch was already cancelled at hold time)"
          - "recompute bucket posture"
      - from: QUARANTINED_HOLD
        to: DISCARDED
        trigger: "system (reaction conclude CONFIRMED or RULED_OUT on REACTION_PRECAUTION hold; recall close with disposition DESTRUCTION on RECALL hold)"
        actor: system
        preconditions: []
        side_effects:
          - "create WastageRecord (reason REACTION_INVESTIGATION | RECALL_DESTRUCTION)"
          - "recompute bucket posture and rolling wastage rate"
      - from: QUARANTINED_HOLD
        to: RETURNED_TO_SUPPLIER
        trigger: "system (recall close with disposition MARKET_WITHDRAWAL on RECALL hold)"
        actor: system
        preconditions: []
        side_effects:
          - "no WastageRecord (unit returned, not wasted)"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (POST /blood-bank/_clock/sweep when server now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "create WastageRecord (reason EXPIRED)"
          - "recompute bucket posture and rolling wastage rate"
      - from: RESERVED
        to: EXPIRED
        trigger: "system (sweep when server now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "the unit's COMPATIBLE crossmatch -> EXPIRED (which recomputes the order)"
          - "create WastageRecord (reason EXPIRED)"
      - from: QUARANTINED
        to: EXPIRED
        trigger: "system (sweep when server now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "create WastageRecord (reason EXPIRED)"
      - from: QUARANTINED_HOLD
        to: EXPIRED
        trigger: "system (sweep when server now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "create WastageRecord (reason EXPIRED)"
      - from: AVAILABLE
        to: DISCARDED
        trigger: "POST /blood-bank/blood-units/{id}/discard"
        actor: BloodBankSupervisor
        preconditions:
          - "status IN {AVAILABLE, QUARANTINED, QUARANTINED_HOLD} (ERR_UNIT_NOT_DISCARDABLE)"
        side_effects:
          - "create WastageRecord (reason MANUAL)"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /blood-bank/blood-units/{id}/discard"
        actor: BloodBankSupervisor
        preconditions:
          - "status IN {AVAILABLE, QUARANTINED, QUARANTINED_HOLD} (ERR_UNIT_NOT_DISCARDABLE)"
        side_effects:
          - "create WastageRecord (reason MANUAL)"
      - from: QUARANTINED_HOLD
        to: DISCARDED
        trigger: "POST /blood-bank/blood-units/{id}/discard"
        actor: BloodBankSupervisor
        preconditions:
          - "status IN {AVAILABLE, QUARANTINED, QUARANTINED_HOLD} (ERR_UNIT_NOT_DISCARDABLE)"
        side_effects:
          - "create WastageRecord (reason MANUAL)"
    note: "ISSUED units are exempt from the expiry sweep — the 4-hour start window and 30-minute return rule govern them instead."

  - entity: TypeAndScreen
    initial_state: COLLECTED
    terminal_states: [EXPIRED, SUPERSEDED, REJECTED]
    transitions:
      - from: COLLECTED
        to: RESULTED
        trigger: "POST /blood-bank/type-and-screens/{id}/result"
        actor: BloodBankTechnologist
        preconditions:
          - "status == COLLECTED (ERR_TS_NOT_COLLECTED)"
          - "antibody_screen == POSITIVE requires non-empty antibody_identifications (ERR_ANTIBODY_DETAIL_REQUIRED)"
        side_effects:
          - "sets resulted_at, resulted_by_user_id"
      - from: RESULTED
        to: ACTIVE
        trigger: "POST /blood-bank/type-and-screens/{id}/validate"
        actor: BloodBankTechnologist
        preconditions:
          - "status == RESULTED (ERR_TS_NOT_RESULTED)"
          - "validator X-User-ID != resulted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "any other ACTIVE TypeAndScreen for the same patient -> SUPERSEDED"
          - "recompute patient summary (current_abo_type, current_rh_type, antibody_status, identified_antibodies, has_active_type_and_screen = true) — increments Patient.version"
          - "calculations.abo_confirmation_latch may set patient.abo_confirmed = true"
      - from: COLLECTED
        to: REJECTED
        trigger: "POST /blood-bank/type-and-screens/{id}/reject-specimen"
        actor: BloodBankTechnologist
        preconditions:
          - "status == COLLECTED (ERR_TS_NOT_COLLECTED)"
        side_effects:
          - "sets reject_reason"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another TypeAndScreen for the same patient is validated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (sweep when server now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "if the patient has no other ACTIVE TypeAndScreen: has_active_type_and_screen = false, and the T&S-expiry cascade fires: every COMPATIBLE crossmatch on this patient's orders -> EXPIRED (each releases its RESERVED unit -> AVAILABLE); every PENDING crossmatch on this patient's orders -> CANCELLED; every TransfusionOrder of this patient in {AWAITING_CROSSMATCH, READY, PARTIALLY_ISSUED} -> ON_HOLD; bucket postures recomputed"
          - "current_abo_type / current_rh_type / antibody_status are RETAINED (historical facts)"

  - entity: TransfusionOrder
    initial_state: PENDING_VERIFICATION
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /blood-bank/transfusion-orders/{id}/verify"
        actor: BloodBankTechnologist
        preconditions:
          - "status == PENDING_VERIFICATION (ERR_ORDER_NOT_VERIFIABLE)"
          - "verifier X-User-ID != ordering_physician_id (ERR_SEGREGATION_OF_DUTIES)"
          - "patient.has_active_type_and_screen == true, OR urgency == EMERGENCY (ERR_TS_NOT_ACTIVE)"
          - "demand-bucket gate: if an ACTIVE ParLevelPolicy exists for demand_bucket and current_posture == CRITICAL and urgency == ROUTINE -> ERR_BUCKET_CRITICAL_ELECTIVE_BLOCKED"
          - "MTP triage gate: if any MTPActivation is ACTIVATED (any patient) and demand-bucket posture IN {SHORTAGE, CRITICAL} and urgency == ROUTINE -> ERR_BUCKET_SHORTAGE_MTP_PRIORITY"
        side_effects:
          - "sets verified_by_user_id, verified_at, special_requirements_snapshot, requires_crossmatch, type_restriction, demand_bucket"
          - "type_restriction = O_ONLY (RBC/WHOLE_BLOOD) or AB_ONLY (plasma products) when verified without an ACTIVE T&S; else NONE"
          - "immediately auto-advances: VERIFIED -> AWAITING_CROSSMATCH when requires_crossmatch, else VERIFIED -> READY"
      - from: VERIFIED
        to: AWAITING_CROSSMATCH
        trigger: "system (auto-advance within the verify call)"
        actor: system
        preconditions:
          - "requires_crossmatch == true"
        side_effects: []
      - from: VERIFIED
        to: READY
        trigger: "system (auto-advance within the verify call)"
        actor: system
        preconditions:
          - "requires_crossmatch == false"
        side_effects: []
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /blood-bank/transfusion-orders/{id}/reject"
        actor: BloodBankTechnologist
        preconditions:
          - "status == PENDING_VERIFICATION (ERR_ORDER_NOT_REJECTABLE)"
        side_effects:
          - "sets rejection_reason"
      - from: AWAITING_CROSSMATCH
        to: READY
        trigger: "system (fulfillment = units_crossmatched + units_issued_net reaches units_requested)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: PARTIALLY_ISSUED
        trigger: "system (first successful issue: units_issued_net becomes >= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: AWAITING_CROSSMATCH
        trigger: "system (fulfillment drops below units_requested: crossmatch cancel/expiry cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_ISSUED
        to: READY
        trigger: "system (return/stop brings units_issued_net to 0 while fulfillment >= units_requested)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_ISSUED
        to: AWAITING_CROSSMATCH
        trigger: "system (return/stop drops fulfillment below units_requested)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_ISSUED
        to: COMPLETED
        trigger: "system (units_transfused == units_requested)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AWAITING_CROSSMATCH
        to: ON_HOLD
        trigger: "system (T&S-expiry cascade: patient loses last ACTIVE TypeAndScreen)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: ON_HOLD
        trigger: "system (T&S-expiry cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_ISSUED
        to: ON_HOLD
        trigger: "system (T&S-expiry cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: AWAITING_CROSSMATCH
        trigger: "POST /blood-bank/transfusion-orders/{id}/reactivate"
        actor: BloodBankTechnologist
        preconditions:
          - "status == ON_HOLD (ERR_ORDER_NOT_REACTIVATABLE)"
          - "patient.has_active_type_and_screen == true (ERR_TS_NOT_ACTIVE)"
          - "target state derived from current counters: fulfillment < units_requested"
        side_effects: []
      - from: ON_HOLD
        to: READY
        trigger: "POST /blood-bank/transfusion-orders/{id}/reactivate"
        actor: BloodBankTechnologist
        preconditions:
          - "status == ON_HOLD (ERR_ORDER_NOT_REACTIVATABLE)"
          - "patient.has_active_type_and_screen == true (ERR_TS_NOT_ACTIVE)"
          - "derived: fulfillment >= units_requested AND units_issued_net == 0"
        side_effects: []
      - from: ON_HOLD
        to: PARTIALLY_ISSUED
        trigger: "POST /blood-bank/transfusion-orders/{id}/reactivate"
        actor: BloodBankTechnologist
        preconditions:
          - "status == ON_HOLD (ERR_ORDER_NOT_REACTIVATABLE)"
          - "patient.has_active_type_and_screen == true (ERR_TS_NOT_ACTIVE)"
          - "derived: units_issued_net >= 1 AND units_transfused < units_requested"
        side_effects: []
      - from: PENDING_VERIFICATION
        to: CANCELLED
        trigger: "POST /blood-bank/transfusion-orders/{id}/cancel"
        actor: OrderingPhysician
        preconditions:
          - "status IN {PENDING_VERIFICATION, AWAITING_CROSSMATCH, READY, PARTIALLY_ISSUED, ON_HOLD} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every PENDING or COMPATIBLE crossmatch for this order -> CANCELLED; each RESERVED unit -> AVAILABLE"
          - "ISSUED/TRANSFUSION_STARTED issue records are unaffected (they must be returned or completed independently)"
      - from: AWAITING_CROSSMATCH
        to: CANCELLED
        trigger: "POST /blood-bank/transfusion-orders/{id}/cancel"
        actor: OrderingPhysician
        preconditions:
          - "status IN {PENDING_VERIFICATION, AWAITING_CROSSMATCH, READY, PARTIALLY_ISSUED, ON_HOLD} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every PENDING or COMPATIBLE crossmatch -> CANCELLED; RESERVED units -> AVAILABLE"
      - from: READY
        to: CANCELLED
        trigger: "POST /blood-bank/transfusion-orders/{id}/cancel"
        actor: OrderingPhysician
        preconditions:
          - "status IN {PENDING_VERIFICATION, AWAITING_CROSSMATCH, READY, PARTIALLY_ISSUED, ON_HOLD} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every PENDING or COMPATIBLE crossmatch -> CANCELLED; RESERVED units -> AVAILABLE"
      - from: PARTIALLY_ISSUED
        to: CANCELLED
        trigger: "POST /blood-bank/transfusion-orders/{id}/cancel"
        actor: OrderingPhysician
        preconditions:
          - "status IN {PENDING_VERIFICATION, AWAITING_CROSSMATCH, READY, PARTIALLY_ISSUED, ON_HOLD} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every PENDING or COMPATIBLE crossmatch -> CANCELLED; RESERVED units -> AVAILABLE; in-flight issue records unaffected"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /blood-bank/transfusion-orders/{id}/cancel"
        actor: OrderingPhysician
        preconditions:
          - "status IN {PENDING_VERIFICATION, AWAITING_CROSSMATCH, READY, PARTIALLY_ISSUED, ON_HOLD} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "every PENDING or COMPATIBLE crossmatch -> CANCELLED; RESERVED units -> AVAILABLE"

  - entity: Crossmatch
    initial_state: PENDING
    terminal_states: [INCOMPATIBLE, EXPIRED, CANCELLED, CONSUMED]
    transitions:
      - from: PENDING
        to: COMPATIBLE
        trigger: "POST /blood-bank/crossmatches/{id}/record-result with result=COMPATIBLE"
        actor: BloodBankTechnologist
        preconditions:
          - "status == PENDING (ERR_XM_NOT_PENDING)"
          - "unit.status == AVAILABLE (ERR_UNIT_NOT_AVAILABLE — the reservation window is half-open [resulted_at, reserved_until); a unit freed exactly at reserved_until is eligible again)"
          - "patient.has_active_type_and_screen == true (ERR_TS_NOT_ACTIVE)"
          - "unit.expires_at > server now (else sweep first; an expired unit yields ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "unit AVAILABLE -> RESERVED"
          - "reserved_until = min(resulted_at + 72h, unit.expires_at, T&S.expires_at) per calculations.crossmatch_reserved_until"
          - "order.units_crossmatched += 1; if fulfillment >= units_requested, order AWAITING_CROSSMATCH -> READY"
      - from: PENDING
        to: INCOMPATIBLE
        trigger: "POST /blood-bank/crossmatches/{id}/record-result with result=INCOMPATIBLE"
        actor: BloodBankTechnologist
        preconditions:
          - "status == PENDING (ERR_XM_NOT_PENDING)"
        side_effects:
          - "unit is never reserved; order counters unchanged"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /blood-bank/crossmatches/{id}/cancel, or system cascade (order cancel, T&S expiry)"
        actor: BloodBankTechnologist
        preconditions:
          - "status IN {PENDING, COMPATIBLE} (ERR_XM_NOT_CANCELLABLE)"
        side_effects:
          - "no unit was reserved from PENDING; order counters unchanged"
      - from: COMPATIBLE
        to: CANCELLED
        trigger: "POST /blood-bank/crossmatches/{id}/cancel, or system cascade (order cancel, recall/supplier hold, T&S expiry)"
        actor: BloodBankTechnologist
        preconditions:
          - "status IN {PENDING, COMPATIBLE} (ERR_XM_NOT_CANCELLABLE)"
        side_effects:
          - "unit RESERVED -> AVAILABLE (skipped when the unit is entering QUARANTINED_HOLD as part of the same cascade — the hold wins and no release occurs)"
          - "order.units_crossmatched -= 1; if fulfillment < units_requested: READY -> AWAITING_CROSSMATCH or PARTIALLY_ISSUED -> AWAITING_CROSSMATCH (PARTIALLY_ISSUED only when units_issued_net also drops)"
      - from: COMPATIBLE
        to: EXPIRED
        trigger: "system (sweep when server now >= reserved_until)"
        actor: system
        preconditions: []
        side_effects:
          - "unit RESERVED -> AVAILABLE"
          - "order.units_crossmatched -= 1; READY -> AWAITING_CROSSMATCH when fulfillment < units_requested"
      - from: COMPATIBLE
        to: CONSUMED
        trigger: "system (the reserved unit is issued against this order)"
        actor: system
        preconditions: []
        side_effects:
          - "unit RESERVED -> ISSUED"
          - "units_crossmatched is NOT decremented (the slot is now filled by the issued unit)"

  - entity: IssueRecord
    initial_state: ISSUED
    terminal_states: [TRANSFUSED, RETURNED, TRANSFUSION_STOPPED]
    transitions:
      - from: ISSUED
        to: TRANSFUSION_STARTED
        trigger: "POST /blood-bank/issue-records/{id}/start-transfusion"
        actor: BloodBankTechnologist
        preconditions:
          - "status == ISSUED (ERR_ISSUE_NOT_STARTABLE)"
          - "server now <= issued_at + 4h (ERR_TRANSFUSION_START_WINDOW_LAPSED — strict >: exactly +4h is allowed)"
        side_effects:
          - "sets transfusion_started_at"
      - from: TRANSFUSION_STARTED
        to: TRANSFUSED
        trigger: "POST /blood-bank/issue-records/{id}/complete-transfusion"
        actor: BloodBankTechnologist
        preconditions:
          - "status == TRANSFUSION_STARTED (ERR_ISSUE_NOT_COMPLETABLE)"
        side_effects:
          - "unit ISSUED -> TRANSFUSED; order.units_transfused += 1 (may complete the order); patient.total_units_transfused += 1"
      - from: TRANSFUSION_STARTED
        to: TRANSFUSION_STOPPED
        trigger: "POST /blood-bank/issue-records/{id}/stop-transfusion, or system (transfusion reaction reported)"
        actor: BloodBankTechnologist
        preconditions:
          - "status == TRANSFUSION_STARTED (ERR_ISSUE_NOT_STOPPABLE)"
        side_effects:
          - "manual stop: unit ISSUED -> DISCARDED + WastageRecord(PARTIAL_TRANSFUSION)"
          - "reaction stop: unit ISSUED -> QUARANTINED_HOLD (REACTION_PRECAUTION); no wastage record until the reaction is concluded"
          - "order.units_issued_net -= 1 (may revert PARTIALLY_ISSUED -> READY or -> AWAITING_CROSSMATCH)"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /blood-bank/issue-records/{id}/return"
        actor: BloodBankTechnologist
        preconditions:
          - "status == ISSUED (ERR_ISSUE_NOT_RETURNABLE — a started transfusion can never be returned)"
        side_effects:
          - "return_disposition per calculations.return_disposition (30-minute rule)"
          - "RESTOCKED: unit ISSUED -> AVAILABLE"
          - "DISCARDED_OVER_30MIN / DISCARDED_COMPROMISED: unit ISSUED -> DISCARDED + WastageRecord(RETURNED_OVER_30MIN | RETURNED_COMPROMISED)"
          - "order.units_issued_net -= 1 (may revert order state); consumed crossmatch stays CONSUMED"

  - entity: MTPActivation
    initial_state: ACTIVATED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVATED
        to: STANDING_DOWN
        trigger: "POST /blood-bank/mtp-activations/{id}/stand-down"
        actor: OrderingPhysician
        preconditions:
          - "status == ACTIVATED (ERR_MTP_NOT_ACTIVE)"
        side_effects:
          - "sets stood_down_at; emergency-release privilege for the patient ends immediately"
      - from: STANDING_DOWN
        to: DEACTIVATED
        trigger: "POST /blood-bank/mtp-activations/{id}/deactivate"
        actor: OrderingPhysician
        preconditions:
          - "status == STANDING_DOWN (ERR_MTP_NOT_STANDING_DOWN)"
          - "no IssueRecord with mtp_activation_id == this activation in status ISSUED or TRANSFUSION_STARTED (ERR_MTP_UNITS_OUTSTANDING)"
        side_effects:
          - "patient.active_mtp = false (increments Patient.version)"
          - "computes units_wasted_total from linked units' WastageRecords"

  - entity: TransfusionReaction
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: "POST /blood-bank/transfusion-reactions/{id}/begin-investigation"
        actor: QualityOfficer
        preconditions:
          - "status == REPORTED (ERR_REACTION_NOT_INVESTIGABLE)"
          - "investigator X-User-ID != reported_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets investigator_user_id"
      - from: INVESTIGATING
        to: INVESTIGATING
        trigger: "POST /blood-bank/transfusion-reactions/{id}/record-workup"
        actor: QualityOfficer
        preconditions:
          - "status == INVESTIGATING (ERR_REACTION_NOT_INVESTIGATING)"
        side_effects:
          - "sets clerical_check_passed, dat_result, hemolysis_present, workup_recorded_at"
      - from: INVESTIGATING
        to: CONFIRMED
        trigger: "POST /blood-bank/transfusion-reactions/{id}/conclude with conclusion=CONFIRMED"
        actor: QualityOfficer
        preconditions:
          - "status == INVESTIGATING (ERR_REACTION_NOT_INVESTIGATING)"
          - "workup_recorded_at is not null (ERR_REACTION_WORKUP_MISSING)"
        side_effects:
          - "if the implicated unit is QUARANTINED_HOLD with hold_reason == REACTION_PRECAUTION: unit -> DISCARDED + WastageRecord(REACTION_INVESTIGATION)"
          - "severe cascade (reaction_type IN {HEMOLYTIC_ACUTE, TRALI, SEPTIC}): auto-create RecallCase (scope DONOR on the unit's donor_id, disposition DESTRUCTION, auto_created=true) and immediately run identification — the recall is created in status UNITS_IDENTIFIED; sets linked_recall_case_id"
      - from: INVESTIGATING
        to: RULED_OUT
        trigger: "POST /blood-bank/transfusion-reactions/{id}/conclude with conclusion=RULED_OUT"
        actor: QualityOfficer
        preconditions:
          - "status == INVESTIGATING (ERR_REACTION_NOT_INVESTIGATING)"
          - "workup_recorded_at is not null (ERR_REACTION_WORKUP_MISSING)"
        side_effects:
          - "if the implicated unit is QUARANTINED_HOLD with hold_reason == REACTION_PRECAUTION: unit -> DISCARDED + WastageRecord(REACTION_INVESTIGATION) — a unit involved in a reported reaction is never restocked"
          - "no recall is created"
      - from: CONFIRMED
        to: CLOSED
        trigger: "POST /blood-bank/transfusion-reactions/{id}/close"
        actor: QualityOfficer
        preconditions:
          - "status IN {CONFIRMED, RULED_OUT} (ERR_REACTION_NOT_CLOSABLE)"
          - "if linked_recall_case_id is set: the linked RecallCase must be in NOTIFICATION_COMPLETE or CLOSED (ERR_RECALL_INCOMPLETE)"
        side_effects: []
      - from: RULED_OUT
        to: CLOSED
        trigger: "POST /blood-bank/transfusion-reactions/{id}/close"
        actor: QualityOfficer
        preconditions:
          - "status IN {CONFIRMED, RULED_OUT} (ERR_REACTION_NOT_CLOSABLE)"
        side_effects: []

  - entity: RecallCase
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: UNITS_IDENTIFIED
        trigger: "POST /blood-bank/recall-cases/{id}/identify-units"
        actor: QualityOfficer
        preconditions:
          - "status == OPEN (ERR_RECALL_NOT_IDENTIFIABLE)"
        side_effects:
          - "computes implicated_unit_ids: DONOR scope = units with donor_id == scope AND (implicated_since null OR collected_at >= implicated_since); LOT scope = lot_number == scope; UNIT scope = unit plus the transitive closure of derived_from_unit_id descendants; sorted by created_at ASC then unit_number ASC"
          - "sets implicated_unit_count, transfused_issue_count"
      - from: UNITS_IDENTIFIED
        to: QUARANTINE_COMPLETE
        trigger: "POST /blood-bank/recall-cases/{id}/execute-quarantine"
        actor: QualityOfficer
        preconditions:
          - "status == UNITS_IDENTIFIED (ERR_RECALL_NOT_QUARANTINABLE)"
        side_effects:
          - "every implicated unit in {QUARANTINED, AVAILABLE, RESERVED} -> QUARANTINED_HOLD (hold_reason RECALL, hold_origin_state = prior state)"
          - "each RESERVED unit's COMPATIBLE crossmatch -> CANCELLED, which recomputes its order (READY -> AWAITING_CROSSMATCH when fulfillment drops below units_requested)"
          - "ISSUED/TRANSFUSED/terminal units are untouched; sets quarantined_count"
      - from: QUARANTINE_COMPLETE
        to: NOTIFICATION_COMPLETE
        trigger: "POST /blood-bank/recall-cases/{id}/complete-notifications"
        actor: QualityOfficer
        preconditions:
          - "status == QUARANTINE_COMPLETE (ERR_RECALL_NOTIFICATIONS_NOT_COMPLETABLE)"
          - "every IssueRecord in TRANSFUSED | TRANSFUSION_STOPPED that references an implicated unit has lookback_notified == true (ERR_NOTIFICATIONS_PENDING)"
        side_effects: []
      - from: QUARANTINE_COMPLETE
        to: QUARANTINE_COMPLETE
        trigger: "POST /blood-bank/recall-cases/{id}/record-notification"
        actor: QualityOfficer
        preconditions:
          - "status == QUARANTINE_COMPLETE (ERR_RECALL_NOTIFICATIONS_NOT_COMPLETABLE)"
          - "issue_record.unit_id IN implicated_unit_ids AND issue_record.status IN {TRANSFUSED, TRANSFUSION_STOPPED} (ERR_ISSUE_NOT_IMPLICATED)"
          - "issue_record.lookback_notified == false (ERR_ISSUE_ALREADY_NOTIFIED)"
        side_effects:
          - "issue_record.lookback_notified = true; notifications_sent_count += 1"
      - from: NOTIFICATION_COMPLETE
        to: CLOSED
        trigger: "POST /blood-bank/recall-cases/{id}/close"
        actor: QualityOfficer
        preconditions:
          - "status == NOTIFICATION_COMPLETE (ERR_RECALL_NOT_CLOSABLE)"
        side_effects:
          - "disposition DESTRUCTION: held units (hold_reason RECALL) -> DISCARDED + WastageRecord(RECALL_DESTRUCTION) each"
          - "disposition MARKET_WITHDRAWAL: held units -> RETURNED_TO_SUPPLIER (no wastage record)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /blood-bank/recall-cases/{id}/void"
        actor: QualityOfficer
        preconditions:
          - "status IN {OPEN, UNITS_IDENTIFIED} (ERR_RECALL_NOT_VOIDABLE — quarantine must not have executed)"
        side_effects: []
      - from: UNITS_IDENTIFIED
        to: VOIDED
        trigger: "POST /blood-bank/recall-cases/{id}/void"
        actor: QualityOfficer
        preconditions:
          - "status IN {OPEN, UNITS_IDENTIFIED} (ERR_RECALL_NOT_VOIDABLE)"
        side_effects: []

  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /blood-bank/suppliers/{id}/suspend"
        actor: BloodBankSupervisor
        preconditions:
          - "status == ACTIVE (ERR_SUPPLIER_SUSPENDED)"
        side_effects:
          - "every BloodUnit of this supplier in {QUARANTINED, AVAILABLE, RESERVED} -> QUARANTINED_HOLD (hold_reason SUPPLIER_SUSPENSION, hold_origin_state = prior state)"
          - "each RESERVED unit's COMPATIBLE crossmatch -> CANCELLED, which recomputes its order (READY -> AWAITING_CROSSMATCH when fulfillment drops)"
          - "sets suspended_at, suspend_reason"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /blood-bank/suppliers/{id}/reinstate"
        actor: BloodBankSupervisor
        preconditions:
          - "status == SUSPENDED (ERR_SUPPLIER_SUSPENDED)"
        side_effects:
          - "every QUARANTINED_HOLD unit with hold_reason == SUPPLIER_SUSPENSION -> AVAILABLE (hold_origin cleared); postures recomputed"

  - entity: SupplierOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /blood-bank/supplier-orders/{id}/submit"
        actor: SupplierCoordinator
        preconditions:
          - "status == DRAFT (ERR_SO_NOT_SUBMITTABLE)"
          - "supplier.status == ACTIVE (ERR_SUPPLIER_SUSPENDED)"
          - "wastage review gate: for a non-emergency order submitted by a SupplierCoordinator, if rolling_wastage_rate >= 0.05 for any bucket named in lines -> ERR_WASTAGE_REVIEW_REQUIRED (BloodBankSupervisor is exempt)"
        side_effects:
          - "emergency orders auto-acknowledge: is_emergency == true advances SUBMITTED -> ACKNOWLEDGED within the same call"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /blood-bank/supplier-orders/{id}/acknowledge"
        actor: SupplierCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_SO_NOT_ACKNOWLEDGEABLE)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: RECEIVING
        trigger: "POST /blood-bank/supplier-orders/{id}/receive (first receipt)"
        actor: SupplierCoordinator
        preconditions:
          - "status IN {ACKNOWLEDGED, RECEIVING} (ERR_SO_NOT_RECEIVABLE)"
          - "each received unit's product_type/abo_type/rh_type must match a line, and cumulative received per line must not exceed the line quantity (ERR_OVER_RECEIPT)"
          - "unit_number globally unique (ERR_DUPLICATE_UNIT_NUMBER); collected_at not in the future (ERR_SPECIMEN_TIME_INVALID)"
        side_effects:
          - "creates one BloodUnit per unit descriptor in status QUARANTINED (expires_at computed per calculations.unit_expiration_at_receive)"
          - "updates received_summary, total_units_received"
      - from: RECEIVING
        to: RECEIVING
        trigger: "POST /blood-bank/supplier-orders/{id}/receive (subsequent partial receipt)"
        actor: SupplierCoordinator
        preconditions:
          - "status IN {ACKNOWLEDGED, RECEIVING} (ERR_SO_NOT_RECEIVABLE)"
          - "same over-receipt and uniqueness checks"
        side_effects:
          - "same unit creation; auto-close check below"
      - from: RECEIVING
        to: CLOSED
        trigger: "system (auto-close when every line's received_qty == quantity, within the receive call) OR POST /blood-bank/supplier-orders/{id}/close"
        actor: SupplierCoordinator
        preconditions:
          - "manual close: status == RECEIVING (ERR_SO_NOT_CLOSABLE)"
        side_effects:
          - "backordered = true when any line closed short"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /blood-bank/supplier-orders/{id}/cancel"
        actor: SupplierCoordinator
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_SO_NOT_CANCELLABLE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /blood-bank/supplier-orders/{id}/cancel"
        actor: SupplierCoordinator
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_SO_NOT_CANCELLABLE)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /blood-bank/supplier-orders/{id}/cancel"
        actor: SupplierCoordinator
        preconditions:
          - "status IN {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_SO_NOT_CANCELLABLE)"
        side_effects: []

  - entity: ParLevelPolicy
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /blood-bank/par-level-policies/{id}/retire"
        actor: BloodBankSupervisor
        preconditions:
          - "status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "the bucket is ungated while no ACTIVE policy exists"

  - entity: TransportCooler
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "system (a CoolerCheckout whose window covers the current time exists: at create when planned_start <= now <= planned_end, or at sweep when an OPEN checkout's planned_start is reached)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Checkout creation is gated by the interval-conflict rule only (validations priority 16); cooler status never blocks creation. Multiple non-conflicting future windows may be booked."
      - from: CHECKED_OUT
        to: RESTOCKING
        trigger: "system (checkout return)"
        actor: system
        preconditions: []
        side_effects:
          - "restock_until = actual_returned_at + 60 minutes (COOLER_REDISPATCH_BUFFER_MINUTES)"
      - from: RESTOCKING
        to: AVAILABLE
        trigger: "system (sweep when server now >= restock_until)"
        actor: system
        preconditions: []
        side_effects:
          - "restock_until cleared"
      - from: CHECKED_OUT
        to: AVAILABLE
        trigger: "system (sweep when an OPEN checkout's planned_end has passed without return — overdue checkout auto-closes the occupancy; the checkout itself stays OPEN/overdue until returned)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CoolerCheckout
    initial_state: OPEN
    terminal_states: [RETURNED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /blood-bank/cooler-checkouts/{id}/return"
        actor: BloodBankTechnologist
        preconditions:
          - "status == OPEN (ERR_CHECKOUT_NOT_RETURNABLE)"
        side_effects:
          - "sets actual_returned_at; cooler CHECKED_OUT -> RESTOCKING"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: ts-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /blood-bank/type-and-screens"
    occ_field: "expected_patient_version"
    description: |
      Creating a TypeAndScreen against a Patient whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another technologist has just posted or validated a specimen for
      the same patient (which advances Patient.version via the summary
      recompute), so the current writer's view of the patient's typing state
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: policy-update-stale-version
    parent_entity: ParLevelPolicy
    write_endpoint: "PUT /blood-bank/par-level-policies/{id}"
    occ_field: "expected_policy_version"
    description: |
      Updating a ParLevelPolicy whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      supervisor has just tightened or loosened the same bucket's thresholds,
      so the current writer's threshold set would silently overwrite a newer
      configuration.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_expiration_at_receive
    trigger: "BloodUnit creation (supplier-order receive)"
    algorithm: threshold
    formula: |
      base_expiry = collected_at + CLASS_SHELF_HOURS[product_type]
      derived_expiry = null
      if thawed_at is present:
          derived_expiry = thawed_at + (24h if product_type == FFP else 6h if product_type == CRYO else 0h)
      if pooled_at is present:
          derived_expiry = min(derived_expiry or +inf, pooled_at + 4h)
      expires_at = base_expiry if derived_expiry is null else min(base_expiry, derived_expiry)
    input_set: "the unit being created"
    constants:
      CLASS_SHELF_HOURS: { RBC: 1008, WHOLE_BLOOD: 840, PLT_APHERESIS: 120, PLT_POOL: 120, FFP: 8760, CRYO: 8760 }
      THAWED_FFP_HOURS: 24
      THAWED_CRYO_HOURS: 6
      POOLED_PLT_HOURS: 4
    precision: "exact timestamps, no rounding"
    variants:
      - name: fixed_shelf
        when: "no thawed_at / pooled_at supplied"
        difference: "expires_at = collected_at + class shelf hours (e.g. FFP collected 2026-08-01T00:00:00Z -> 2027-08-01T00:00:00Z)"
      - name: derived_clock
        when: "thawed_at or pooled_at supplied"
        difference: "expires_at = min(fixed shelf, event + derived hours); an FFP unit thawed at 2026-08-10T06:00:00Z expires 2026-08-11T06:00:00Z even though its frozen shelf life runs to 2027 — same collected_at, different expires_at"

  - name: bucket_physical_posture
    trigger: "any BloodUnit status change, any receive, policy create/update, sweep"
    algorithm: threshold
    formula: |
      usable = count(BloodUnit u: u.product_type == policy.product_type
                     AND u.abo_type == policy.abo_type AND u.rh_type == policy.rh_type
                     AND u.status == AVAILABLE
                     AND u.expires_at > now + policy.min_shelf_life_hours)
      if usable <= critical_threshold: CRITICAL
      elif usable <= shortage_threshold: SHORTAGE
      elif usable <= watch_threshold: WATCH
      else: NORMAL
      Boundary is INCLUSIVE (<=): usable == critical_threshold yields CRITICAL.
      Buckets with no ACTIVE policy are treated as NORMAL everywhere.
    input_set: "all BloodUnits in the bucket (any status; only AVAILABLE counted)"
    constants:
      BOUNDARY_OPERATOR: "<="
    precision: "integer counts"
    variants:
      - name: physical
        when: "order verification gating, posture endpoint field physical_posture"
        difference: "counts only stock on the shelf"

  - name: bucket_prospective_posture
    trigger: "same recomputation events as bucket_physical_posture"
    algorithm: forward_looking
    formula: |
      inbound = sum over SupplierOrder so (so.status IN {SUBMITTED, ACKNOWLEDGED, RECEIVING}
                AND so.expected_delivery_at is not null
                AND so.expected_delivery_at <= now + 24h)
                of (line.quantity - line.received_qty) for lines matching the bucket
      prospective_usable = usable (from bucket_physical_posture) + inbound
      Same threshold ladder as bucket_physical_posture applied to prospective_usable.
    input_set: "same units plus undelivered supplier-order line quantities inside the 24h horizon"
    constants:
      INBOUND_HORIZON_HOURS: 24
    precision: "integer counts"
    variants:
      - name: prospective
        when: "posture endpoint field prospective_posture; reorder planning"
        difference: "includes inbound stock arriving within 24h — a bucket with 1 usable unit and 4 inbound units can be CRITICAL physically yet NORMAL prospectively for identical on-shelf data"

  - name: unit_compatibility_decision
    trigger: "crossmatch create (explicit unit or selector eligibility), issue create, MTP pack selection"
    algorithm: constraint_propagation
    formula: |
      inputs: patient (current_abo_type, current_rh_type, identified_antibodies,
                       special_requirements_snapshot from the order), unit, product
              class, order context (urgency, type_restriction)
      1. product_class = RBC_CLASS iff product_type IN {RBC, WHOLE_BLOOD} else PLASMA_CLASS
      2. If patient.current_abo_type == UNKNOWN (no ACTIVE T&S at selection time):
             RBC_CLASS: unit must be abo O AND rh NEG
             PLASMA_CLASS: unit must be abo AB (rh ignored)
             (steps 3-4 skipped)
      3. ABO matrix:
             RBC (RBC_CLASS): O-:[O-], O+:[O-,O+], A-:[O-,A-], A+:[O-,O+,A-,A+],
                              B-:[O-,B-], B+:[O-,O+,B-,B+], AB-:[O-,A-,B-,AB-], AB+:[any]
             WHOLE_BLOOD: unit abo AND rh must both be identical to the patient
             PLASMA_CLASS (FFP, CRYO, PLT_APHERESIS, PLT_POOL — OPPOSITE direction):
                              O:[O,A,B,AB], A:[A,AB], B:[B,AB], AB:[AB]; rh ignored
      4. type_restriction: O_ONLY -> unit abo must be O; AB_ONLY -> unit abo must be AB
      5. Rh (RBC_CLASS with typed patient): unit rh POS into patient rh NEG is allowed
         only when urgency == EMERGENCY AND ALLOW_EMERGENCY_RH_MISMATCH
      6. Antibodies: every antibody in identified_antibodies must appear in
         unit.antigen_negative (unit tested antigen-negative), else incompatible
      7. Special requirements: IRRADIATED -> unit.irradiated; CMV_NEGATIVE ->
         unit.cmv_negative; WASHED -> unit.washed
      Any failed check -> incompatible (ERR_UNIT_INCOMPATIBLE on explicit selection;
      exclusion from the selector candidate pool on auto-select)
    input_set: "one patient/order context x one unit"
    constants:
      ALLOW_EMERGENCY_RH_MISMATCH: true
    precision: "boolean decision"

  - name: fefo_unit_selector
    trigger: "crossmatch create without unit_id, issue create without unit_id, MTP pack component selection"
    algorithm: aggregation
    formula: |
      candidates = BloodUnits u: u.status == AVAILABLE
                   AND u.expires_at > now + bucket.min_shelf_life_hours (default 4h)
                   AND u passes unit_compatibility_decision for the patient/order context
      rank: expires_at ASC, tie-break created_at ASC, final tie-break unit_number ASC
      select first candidate; empty pool -> ERR_NO_COMPATIBLE_UNIT (crossmatch/issue)
      or a recorded shortfall (MTP pack dispatch)
    input_set: "all AVAILABLE BloodUnits"
    constants:
      DEFAULT_MIN_SHELF_HOURS: 4
    precision: "deterministic single winner; no random inputs; id is never used"

  - name: supplier_order_estimated_cost
    trigger: "SupplierOrder creation"
    algorithm: tiered_pricing
    formula: |
      total_qty = sum(lines[].quantity)
      discount = 0.10 if total_qty >= 50 else 0.05 if total_qty >= 20 else 0.00
      # PINNED ROUNDING ORDER (mode b): round EACH LINE first, then sum:
      line_cost[i] = round_half_up(PRICE_CENTS[lines[i].product_type] * lines[i].quantity * (1 - discount))
      subtotal = sum(line_cost[])
      # emergency surcharge applied ONCE to the summed subtotal, rounded half-up:
      estimated_cost_cents = round_half_up(subtotal * 1.25) if is_emergency else subtotal
    input_set: "the order's lines"
    constants:
      PRICE_CENTS: { RBC: 21997, WHOLE_BLOOD: 34995, PLT_APHERESIS: 54995, PLT_POOL: 47995, FFP: 7995, CRYO: 6495 }
      TIER2_QTY: 50
      TIER1_QTY: 20
      EMERGENCY_SURCHARGE: 1.25
    precision: "integer cents, round_half_up per line then once on the emergency total"

  - name: crossmatch_reserved_until
    trigger: "crossmatch record-result COMPATIBLE"
    algorithm: threshold
    formula: |
      reserved_until = min(resulted_at + XM_HOLD_HOURS, unit.expires_at, type_and_screen.expires_at)
      The crossmatch EXPIRES when now >= reserved_until (boundary inclusive: exactly
      at reserved_until the crossmatch is expired and the unit is free again).
    input_set: "the crossmatch, its unit, the patient's current ACTIVE TypeAndScreen"
    constants:
      XM_HOLD_HOURS: 72
    precision: "exact timestamps"

  - name: rolling_wastage_rate
    trigger: "any WastageRecord creation, any receive, posture endpoint reads, supplier-order submit gate"
    algorithm: aggregation
    formula: |
      window = [now - 30d, now] (both ends inclusive) on WastageRecord.created_at
      wasted = sum(WastageRecord.quantity_units for the bucket in window)
      received = count(BloodUnits of the bucket with created_at in window)
      rate = 0.0000 if received == 0 else round_half_up(wasted / received, 4)
      excessive = (rate >= 0.05)   # boundary INCLUSIVE
    input_set: "WastageRecords and BloodUnits of one bucket in the rolling window"
    constants:
      WASTAGE_WINDOW_DAYS: 30
      EXCESSIVE_RATE: 0.05
    precision: "4 decimal places, round_half_up"

  - name: mtp_pack_constitution
    trigger: "POST /blood-bank/mtp-activations/{id}/dispatch-pack"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (mode c — later steps observe earlier decrements):
      1. Snapshot context: patient typing (current_abo_type/current_rh_type or
         UNKNOWN), identified_antibodies, special_requirements.
      2. For each component in the FIXED order [RBC x4, FFP x2, PLT_APHERESIS x1]:
         a. Build the ABO preference list:
            RBC, typed patient: [(patient_abo, patient_rh), (O, NEG),
                                 (patient_abo, opposite_rh)*, (O, POS)*]
                                 (* only when ALLOW_EMERGENCY_RH_MISMATCH)
            RBC, UNKNOWN patient: [(O, NEG)]
            FFP, typed patient: [(patient_abo, NEG), (AB, NEG), (A, NEG), (B, NEG), (O, NEG)]
                                filtered to plasma-compatible buckets for the patient
            FFP, UNKNOWN patient: [(AB, NEG)]
            PLT_APHERESIS: [(patient_abo or O, NEG), (A, NEG), (B, NEG), (AB, NEG), (O, NEG)],
                           de-duplicated preserving first occurrence
         b. Walk the preference list in order; within a bucket select units per
            fefo_unit_selector until the component quantity is filled; decrement
            availability immediately so later components see earlier selections.
         c. If every bucket is exhausted with quantity unfilled, record a shortfall
            {product_type, missing_qty} and continue to the next component —
            dispatch NEVER fails on short stock.
      3. Create one IssueRecord per selected unit (is_emergency_release = true,
         mtp_activation_id = this activation, verified_by_user_id required,
         emergency_justification copied from the activation's activation_reason).
    input_set: "all AVAILABLE BloodUnits, the patient, the activation"
    constants:
      PACK_SPEC: [ { product_type: RBC, qty: 4 }, { product_type: FFP, qty: 2 }, { product_type: PLT_APHERESIS, qty: 1 } ]
    precision: "integer unit counts; deterministic component and in-bucket order"

  - name: abo_confirmation_latch
    trigger: "TypeAndScreen validate"
    algorithm: aggregation
    formula: |
      prior = exists another TypeAndScreen t for the same patient with
              t.status IN {ACTIVE, SUPERSEDED, EXPIRED}
              AND t.abo_result == this.abo_result
              AND t.specimen_collected_at != this.specimen_collected_at
      if prior: patient.abo_confirmed = true  (latched; never auto-clears)
      Patient summary is then recomputed from the newly validated T&S.
    input_set: "all TypeAndScreens of the patient"
    precision: "boolean latch"

  - name: return_disposition
    trigger: "POST /blood-bank/issue-records/{id}/return"
    algorithm: threshold
    formula: |
      if returned_at <= issued_at + 30 minutes AND return_seal_intact AND NOT return_temperature_excursion:
          RESTOCKED
      elif NOT return_seal_intact OR return_temperature_excursion:
          DISCARDED_COMPROMISED
      else:
          DISCARDED_OVER_30MIN
      Boundary INCLUSIVE: exactly 30 minutes 00 seconds restocks; 30m01s discards.
    input_set: "the issue record being returned"
    constants:
      RETURN_RESTOCK_WINDOW_MINUTES: 30
    precision: "exact timestamp comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left-to-right; unknown ids yield the resource-specific not-found error (ERR_PATIENT_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_SUPPLIER_ORDER_NOT_FOUND, ERR_TS_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_CROSSMATCH_NOT_FOUND, ERR_ISSUE_NOT_FOUND, ERR_REACTION_NOT_FOUND, ERR_RECALL_NOT_FOUND, ERR_WASTAGE_RECORD_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_COOLER_NOT_FOUND, ERR_CHECKOUT_NOT_FOUND, ERR_MTP_NOT_FOUND)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request schema: required fields present, types correct, enum values in their declared sets, integer ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 5
    category: existence
    check: "Body foreign-key references exist (patient_id, supplier_id, order_id, unit_id, issue_record_id, cooler_id, recall unit_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST /blood-bank/type-and-screens, /transfusion-orders, /crossmatches, /issue-records, /transfusion-reactions, /recall-cases, /cooler-checkouts, /supplier-orders, record-notification"
  - priority: 6
    category: state
    check: "OCC: expected_*_version matches the parent's current version (only on endpoints declaring the field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /blood-bank/type-and-screens, PUT /blood-bank/par-level-policies/{id}"
  - priority: 7
    category: state
    check: "State-machine from-state precondition of the invoked transition (per-endpoint errors: ERR_UNIT_NOT_RELEASABLE, ERR_UNIT_NOT_REJECTABLE, ERR_UNIT_NOT_DISCARDABLE, ERR_TS_NOT_COLLECTED, ERR_TS_NOT_RESULTED, ERR_ORDER_NOT_VERIFIABLE, ERR_ORDER_NOT_REJECTABLE, ERR_ORDER_NOT_CANCELLABLE, ERR_ORDER_NOT_REACTIVATABLE, ERR_ORDER_NOT_ISSUABLE, ERR_XM_NOT_PENDING, ERR_XM_NOT_CANCELLABLE, ERR_ISSUE_NOT_STARTABLE, ERR_ISSUE_NOT_COMPLETABLE, ERR_ISSUE_NOT_RETURNABLE, ERR_ISSUE_NOT_STOPPABLE, ERR_ISSUE_NOT_REACTIONABLE, ERR_ISSUE_NOT_ACKNOWLEDGABLE, ERR_REACTION_NOT_INVESTIGABLE, ERR_REACTION_NOT_INVESTIGATING, ERR_REACTION_NOT_CLOSABLE, ERR_RECALL_NOT_IDENTIFIABLE, ERR_RECALL_NOT_QUARANTINABLE, ERR_RECALL_NOTIFICATIONS_NOT_COMPLETABLE, ERR_RECALL_NOT_CLOSABLE, ERR_RECALL_NOT_VOIDABLE, ERR_MTP_NOT_ACTIVE, ERR_MTP_NOT_STANDING_DOWN, ERR_SO_NOT_SUBMITTABLE, ERR_SO_NOT_ACKNOWLEDGEABLE, ERR_SO_NOT_RECEIVABLE, ERR_SO_NOT_CLOSABLE, ERR_SO_NOT_CANCELLABLE, ERR_CHECKOUT_NOT_RETURNABLE, ERR_POLICY_NOT_ACTIVE)"
    error_id: "ERR_* (per transition)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Unit compatibility per calculations.unit_compatibility_decision (ABO matrix for the product class, Rh emergency rule, antigen-negative coverage, special requirements, type_restriction) when a unit is explicitly selected"
    error_id: ERR_UNIT_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /blood-bank/crossmatches (with unit_id), POST /blood-bank/issue-records (with unit_id)"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: T&S validator != resulted_by; issue verified_by_user_id != caller X-User-ID; order verifier != ordering_physician_id; reaction investigator != reported_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST .../type-and-screens/{id}/validate, .../transfusion-orders/{id}/verify, POST /issue-records, POST .../transfusion-reactions/{id}/begin-investigation"
  - priority: 10
    category: business_safety
    check: "Two-specimen rule: issuing a non-O RBC/WHOLE_BLOOD unit to a patient with abo_confirmed == false is forbidden unless is_emergency_release"
    error_id: ERR_SECOND_SPECIMEN_REQUIRED
    http_status: 409
    applies_to: "POST /blood-bank/issue-records"
  - priority: 11
    category: business_safety
    check: "Emergency release: is_emergency_release requires order.urgency == EMERGENCY or an ACTIVATED MTP for the patient; justification >= 20 chars required"
    error_id: "ERR_EMERGENCY_RELEASE_NOT_ALLOWED | ERR_EMERGENCY_JUSTIFICATION_REQUIRED"
    http_status: 409
    applies_to: "POST /blood-bank/issue-records"
  - priority: 12
    category: business_referential
    check: "Emergency-release acknowledgement may only be performed by the ordering physician of the issue's order"
    error_id: ERR_NOT_ORDERING_PHYSICIAN
    http_status: 403
    applies_to: "POST /blood-bank/issue-records/{id}/acknowledge-emergency"
  - priority: 13
    category: business_temporal
    check: "Timestamps must not be in the future (specimen_collected_at, unit collected_at/thawed_at/pooled_at)"
    error_id: ERR_SPECIMEN_TIME_INVALID
    http_status: 400
    applies_to: "POST /blood-bank/type-and-screens, POST .../supplier-orders/{id}/receive"
  - priority: 14
    category: business_temporal
    check: "Transfusion start window: now <= issued_at + 4h (boundary inclusive)"
    error_id: ERR_TRANSFUSION_START_WINDOW_LAPSED
    http_status: 409
    applies_to: "POST /blood-bank/issue-records/{id}/start-transfusion"
  - priority: 15
    category: business_temporal
    check: "Emergency acknowledgement window: now <= issued_at + 24h"
    error_id: ERR_EMERGENCY_ACK_WINDOW_LAPSED
    http_status: 409
    applies_to: "POST /blood-bank/issue-records/{id}/acknowledge-emergency"
  - priority: 16
    category: business_temporal
    check: "Cooler checkout window: planned_end > planned_start, duration <= 12h (ERR_CHECKOUT_WINDOW_INVALID); closed-interval conflict with 60-minute buffer against other checkouts of the same cooler (conflict iff new.planned_start < existing_effective_end AND existing.planned_start < new.planned_end + 60min, where existing_effective_end = (actual_returned_at else planned_end) + 60min; equality is NOT a conflict)"
    error_id: "ERR_CHECKOUT_WINDOW_INVALID | ERR_COOLER_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /blood-bank/cooler-checkouts"
  - priority: 17
    category: business_constraint
    check: "No second non-REJECTED TypeAndScreen for the same patient with the same specimen_collected_at"
    error_id: ERR_DUPLICATE_SPECIMEN
    http_status: 409
    applies_to: "POST /blood-bank/type-and-screens"
  - priority: 18
    category: business_constraint
    check: "At most one ACTIVE ParLevelPolicy per (product_type, abo_type, rh_type) bucket"
    error_id: ERR_POLICY_BUCKET_DUPLICATE
    http_status: 409
    applies_to: "POST /blood-bank/par-level-policies"
  - priority: 19
    category: business_constraint
    check: "watch_threshold >= shortage_threshold >= critical_threshold >= 0"
    error_id: ERR_THRESHOLD_ORDER_INVALID
    http_status: 400
    applies_to: "POST /blood-bank/par-level-policies, PUT /blood-bank/par-level-policies/{id}"
  - priority: 20
    category: business_constraint
    check: "Recall scope fields consistent with scope_type (DONOR requires donor_id; LOT requires lot_number; UNIT requires unit_id; implicated_since only meaningful for DONOR)"
    error_id: ERR_RECALL_SCOPE_INVALID
    http_status: 400
    applies_to: "POST /blood-bank/recall-cases"
  - priority: 21
    category: business_constraint
    check: "At most one ACTIVATED MTPActivation per patient"
    error_id: ERR_MTP_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /blood-bank/mtp-activations"
  - priority: 22
    category: business_constraint
    check: "Order not already fulfilled: crossmatch create requires units_crossmatched + units_issued_net < units_requested"
    error_id: ERR_ORDER_FULLY_CROSSMATCHED
    http_status: 409
    applies_to: "POST /blood-bank/crossmatches"
  - priority: 23
    category: business_constraint
    check: "Issue quota: units_issued_net < units_requested"
    error_id: ERR_ORDER_ISSUE_QUOTA_MET
    http_status: 409
    applies_to: "POST /blood-bank/issue-records"
  - priority: 24
    category: business_constraint
    check: "Receipt lines must not exceed ordered quantities (cumulative per line)"
    error_id: ERR_OVER_RECEIPT
    http_status: 422
    applies_to: "POST /blood-bank/supplier-orders/{id}/receive"
  - priority: 25
    category: business_constraint
    check: "unit_number globally unique across all received units"
    error_id: ERR_DUPLICATE_UNIT_NUMBER
    http_status: 409
    applies_to: "POST /blood-bank/supplier-orders/{id}/receive"
  - priority: 26
    category: business_referential
    check: "Supplier must be ACTIVE for new submissions and unit releases"
    error_id: ERR_SUPPLIER_SUSPENDED
    http_status: 409
    applies_to: "POST .../supplier-orders/{id}/submit, POST .../blood-units/{id}/release-from-quarantine"
  - priority: 27
    category: business_referential
    check: "record-notification target must reference an implicated transfused unit and not be already notified"
    error_id: "ERR_ISSUE_NOT_IMPLICATED | ERR_ISSUE_ALREADY_NOTIFIED"
    http_status: 409
    applies_to: "POST /blood-bank/recall-cases/{id}/record-notification"
  - priority: 28
    category: business_referential
    check: "complete-notifications requires every implicated transfused issue notified; reaction close requires linked recall in NOTIFICATION_COMPLETE+; conclude requires workup recorded"
    error_id: "ERR_NOTIFICATIONS_PENDING | ERR_RECALL_INCOMPLETE | ERR_REACTION_WORKUP_MISSING"
    http_status: 409
    applies_to: "POST .../recall-cases/{id}/complete-notifications, POST .../transfusion-reactions/{id}/close, POST .../transfusion-reactions/{id}/conclude"
  - priority: 29
    category: business_fiscal
    check: "Wastage review gate: non-emergency submit by SupplierCoordinator while any line's bucket has rolling_wastage_rate >= 0.05 (Supervisor exempt)"
    error_id: ERR_WASTAGE_REVIEW_REQUIRED
    http_status: 409
    applies_to: "POST /blood-bank/supplier-orders/{id}/submit"
  - priority: 30
    category: business_fiscal
    check: "Shortage admission gates at verify: CRITICAL bucket blocks ROUTINE orders; any ACTIVE MTP with SHORTAGE/CRITICAL bucket blocks ROUTINE orders"
    error_id: "ERR_BUCKET_CRITICAL_ELECTIVE_BLOCKED | ERR_BUCKET_SHORTAGE_MTP_PRIORITY"
    http_status: 409
    applies_to: "POST /blood-bank/transfusion-orders/{id}/verify"
  - priority: 31
    category: business_fiscal
    check: "Selector empty pool: no eligible unit for an auto-select crossmatch/issue"
    error_id: ERR_NO_COMPATIBLE_UNIT
    http_status: 409
    applies_to: "POST /blood-bank/crossmatches (no unit_id), POST /blood-bank/issue-records (no unit_id)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (logical clock; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/blood-bank/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default — never wall-clock)."
    roles: [BloodBankSupervisor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: []
  - method: POST
    path: "/blood-bank/_clock/sweep"
    description: "Run time-based maintenance at the current logical time: expire TypeAndScreens (now >= expires_at) with the T&S-expiry cascade; expire crossmatches (now >= reserved_until) releasing units; expire units (now >= expires_at, ISSUED exempt) creating EXPIRED WastageRecords; advance RESTOCKING coolers past restock_until; recompute all bucket postures."
    roles: [BloodBankSupervisor]
    code: 200
    input: []
    output: { ts_expired_count: integer, crossmatches_expired_count: integer, units_expired_count: integer, coolers_restocked_count: integer, orders_held_count: integer }
    side_effects: ["see description; cascades per state machines"]

  # --- Patients ---
  - method: POST
    path: "/blood-bank/patients"
    description: "Register a patient blood-bank record"
    roles: [BloodBankTechnologist, BloodBankSupervisor]
    code: 201
    input: [mrn, full_name, date_of_birth, "special_requirements?"]
    output: Patient
    side_effects: ["status fields default: abo UNKNOWN, abo_confirmed false"]
  - method: GET
    path: "/blood-bank/patients"
    description: "List patients (default sort created_at ASC)"
    roles: &all_roles [OrderingPhysician, BloodBankTechnologist, BloodBankSupervisor, SupplierCoordinator, QualityOfficer]
    code: 200
    input: ["mrn?", "current_abo_type?", "has_active_type_and_screen?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/patients/{id}"
    description: "Get one patient"
    roles: *all_roles
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- Suppliers ---
  - method: POST
    path: "/blood-bank/suppliers"
    description: "Register a blood supplier"
    roles: [BloodBankSupervisor]
    code: 201
    input: [name, license_number, "default_lead_time_hours?"]
    output: Supplier
    side_effects: []
  - method: GET
    path: "/blood-bank/suppliers"
    description: "List suppliers"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/suppliers/{id}"
    description: "Get one supplier"
    roles: *all_roles
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: POST
    path: "/blood-bank/suppliers/{id}/suspend"
    description: "Suspend a supplier; quarantine-holds all its non-terminal units and cancels their crossmatches"
    roles: [BloodBankSupervisor]
    code: 200
    input: [reason]
    output: Supplier
    side_effects: ["units -> QUARANTINED_HOLD (SUPPLIER_SUSPENSION); COMPATIBLE crossmatches -> CANCELLED; orders recompute"]
  - method: POST
    path: "/blood-bank/suppliers/{id}/reinstate"
    description: "Reinstate a suspended supplier; releases SUPPLIER_SUSPENSION holds to AVAILABLE"
    roles: [BloodBankSupervisor]
    code: 200
    input: []
    output: Supplier
    side_effects: ["held units (SUPPLIER_SUSPENSION) -> AVAILABLE; postures recomputed"]

  # --- Supplier orders ---
  - method: POST
    path: "/blood-bank/supplier-orders"
    description: "Create a replenishment order (estimated_cost_cents computed at create)"
    roles: [SupplierCoordinator, BloodBankSupervisor]
    code: 201
    input: [supplier_id, lines, "is_emergency?", "expected_delivery_at?"]
    output: SupplierOrder
    side_effects: ["estimated_cost_cents per calculations.supplier_order_estimated_cost"]
  - method: GET
    path: "/blood-bank/supplier-orders"
    description: "List supplier orders"
    roles: *all_roles
    code: 200
    input: ["supplier_id?", "status?", "limit?", "offset?"]
    output: "SupplierOrder[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/supplier-orders/{id}"
    description: "Get one supplier order"
    roles: *all_roles
    code: 200
    input: []
    output: SupplierOrder
    side_effects: []
  - method: POST
    path: "/blood-bank/supplier-orders/{id}/submit"
    description: "Submit an order; emergency orders auto-acknowledge in the same call"
    roles: [SupplierCoordinator, BloodBankSupervisor]
    code: 200
    input: []
    output: SupplierOrder
    side_effects: ["is_emergency -> status ACKNOWLEDGED; wastage review gate applies to SupplierCoordinator"]
  - method: POST
    path: "/blood-bank/supplier-orders/{id}/acknowledge"
    description: "Record supplier acknowledgement"
    roles: [SupplierCoordinator, BloodBankSupervisor]
    code: 200
    input: []
    output: SupplierOrder
    side_effects: []
  - method: POST
    path: "/blood-bank/supplier-orders/{id}/receive"
    description: "Receive a (possibly partial) shipment manifest; creates one BloodUnit per descriptor in QUARANTINED"
    roles: [SupplierCoordinator, BloodBankSupervisor]
    code: 200
    input: [units]
    output: SupplierOrder
    side_effects: ["BloodUnits created (expires_at computed); received_summary/total_units_received updated; auto-CLOSED when all lines fully received"]
  - method: POST
    path: "/blood-bank/supplier-orders/{id}/close"
    description: "Manually close a partially received order (sets backordered when short)"
    roles: [SupplierCoordinator, BloodBankSupervisor]
    code: 200
    input: []
    output: SupplierOrder
    side_effects: ["backordered = any line short"]
  - method: POST
    path: "/blood-bank/supplier-orders/{id}/cancel"
    description: "Cancel an order before any receipt"
    roles: [SupplierCoordinator, BloodBankSupervisor]
    code: 200
    input: []
    output: SupplierOrder
    side_effects: []

  # --- Blood units ---
  - method: GET
    path: "/blood-bank/blood-units"
    description: "List/filter blood units (default sort created_at ASC)"
    roles: *all_roles
    code: 200
    input: ["status?", "product_type?", "abo_type?", "rh_type?", "supplier_id?", "supplier_order_id?", "donor_id?", "lot_number?", "derived_from_unit_id?", "unit_number?", "expires_before?", "limit?", "offset?"]
    output: "BloodUnit[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/blood-units/{id}"
    description: "Get one blood unit"
    roles: *all_roles
    code: 200
    input: []
    output: BloodUnit
    side_effects: []
  - method: POST
    path: "/blood-bank/blood-units/{id}/release-from-quarantine"
    description: "Release an intake-quarantined unit to AVAILABLE"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: BloodUnit
    side_effects: ["posture recompute"]
  - method: POST
    path: "/blood-bank/blood-units/{id}/reject-intake"
    description: "Reject a unit at intake (terminal REJECTED)"
    roles: [BloodBankTechnologist]
    code: 200
    input: [reason]
    output: BloodUnit
    side_effects: []
  - method: POST
    path: "/blood-bank/blood-units/{id}/discard"
    description: "Manual discard of an AVAILABLE/QUARANTINED/held unit"
    roles: [BloodBankSupervisor]
    code: 200
    input: ["note?"]
    output: BloodUnit
    side_effects: ["WastageRecord(MANUAL) created; posture + wastage rate recompute"]

  # --- Type & screens ---
  - method: POST
    path: "/blood-bank/type-and-screens"
    description: "Collect a type & screen specimen (OCC on Patient.version)"
    roles: [BloodBankTechnologist]
    code: 201
    input: [patient_id, specimen_collected_at, expected_patient_version]
    output: TypeAndScreen
    side_effects: ["increments Patient.version by 1", "expires_at = specimen_collected_at + 72h"]
  - method: GET
    path: "/blood-bank/type-and-screens"
    description: "List type & screens"
    roles: *all_roles
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: "TypeAndScreen[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/type-and-screens/{id}"
    description: "Get one type & screen"
    roles: *all_roles
    code: 200
    input: []
    output: TypeAndScreen
    side_effects: []
  - method: POST
    path: "/blood-bank/type-and-screens/{id}/result"
    description: "Record ABO/Rh and antibody screen results"
    roles: [BloodBankTechnologist]
    code: 200
    input: [abo_result, rh_result, antibody_screen, "antibody_identifications?"]
    output: TypeAndScreen
    side_effects: ["COLLECTED -> RESULTED; sets resulted_at/resulted_by_user_id"]
  - method: POST
    path: "/blood-bank/type-and-screens/{id}/validate"
    description: "Second technologist validates the result (segregation of duties); activates the T&S"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: TypeAndScreen
    side_effects: ["RESULTED -> ACTIVE; supersedes prior ACTIVE; recomputes Patient summary (increments Patient.version); abo_confirmation_latch"]
  - method: POST
    path: "/blood-bank/type-and-screens/{id}/reject-specimen"
    description: "Reject a collected specimen (mislabeled/hemolyzed)"
    roles: [BloodBankTechnologist]
    code: 200
    input: [reason]
    output: TypeAndScreen
    side_effects: []

  # --- Transfusion orders ---
  - method: POST
    path: "/blood-bank/transfusion-orders"
    description: "Create a transfusion order"
    roles: [OrderingPhysician]
    code: 201
    input: [patient_id, product_type, units_requested, urgency, indication_code]
    output: TransfusionOrder
    side_effects: ["status PENDING_VERIFICATION; ordering_physician_id from X-User-ID"]
  - method: GET
    path: "/blood-bank/transfusion-orders"
    description: "List transfusion orders"
    roles: *all_roles
    code: 200
    input: ["patient_id?", "status?", "product_type?", "urgency?", "limit?", "offset?"]
    output: "TransfusionOrder[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/transfusion-orders/{id}"
    description: "Get one transfusion order"
    roles: *all_roles
    code: 200
    input: []
    output: TransfusionOrder
    side_effects: []
  - method: POST
    path: "/blood-bank/transfusion-orders/{id}/verify"
    description: "Technologist verifies the order (T&S gate, shortage gates, segregation vs ordering physician)"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: TransfusionOrder
    side_effects: ["VERIFIED then auto -> AWAITING_CROSSMATCH (requires_crossmatch) or READY; sets type_restriction, demand_bucket, special_requirements_snapshot"]
  - method: POST
    path: "/blood-bank/transfusion-orders/{id}/reject"
    description: "Reject an unverifiable order"
    roles: [BloodBankTechnologist]
    code: 200
    input: [rejection_reason]
    output: TransfusionOrder
    side_effects: []
  - method: POST
    path: "/blood-bank/transfusion-orders/{id}/cancel"
    description: "Cancel an order; compensates reservations (crossmatches cancelled, units released)"
    roles: [OrderingPhysician]
    code: 200
    input: ["cancel_reason?"]
    output: TransfusionOrder
    side_effects: ["PENDING/COMPATIBLE crossmatches -> CANCELLED; RESERVED units -> AVAILABLE"]
  - method: POST
    path: "/blood-bank/transfusion-orders/{id}/reactivate"
    description: "Reactivate an ON_HOLD order after a fresh ACTIVE T&S exists"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: TransfusionOrder
    side_effects: ["target state derived from counters (AWAITING_CROSSMATCH | READY | PARTIALLY_ISSUED)"]

  # --- Crossmatches ---
  - method: POST
    path: "/blood-bank/crossmatches"
    description: "Create a crossmatch; unit_id optional (auto-select via FEFO selector when omitted)"
    roles: [BloodBankTechnologist]
    code: 201
    input: [order_id, "unit_id?"]
    output: Crossmatch
    side_effects: ["status PENDING; method computed (ELECTRONIC vs SEROLOGIC_AHG); patient_id denormalized"]
  - method: GET
    path: "/blood-bank/crossmatches"
    description: "List crossmatches"
    roles: *all_roles
    code: 200
    input: ["order_id?", "unit_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "Crossmatch[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/crossmatches/{id}"
    description: "Get one crossmatch"
    roles: *all_roles
    code: 200
    input: []
    output: Crossmatch
    side_effects: []
  - method: POST
    path: "/blood-bank/crossmatches/{id}/record-result"
    description: "Record COMPATIBLE or INCOMPATIBLE result"
    roles: [BloodBankTechnologist]
    code: 200
    input: [result]
    output: Crossmatch
    side_effects: ["COMPATIBLE: unit -> RESERVED, reserved_until set, order counters advance (may -> READY)"]
  - method: POST
    path: "/blood-bank/crossmatches/{id}/cancel"
    description: "Cancel a PENDING or COMPATIBLE crossmatch (releases the unit)"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: Crossmatch
    side_effects: ["COMPATIBLE cancel: unit -> AVAILABLE; order recompute"]

  # --- Issue records ---
  - method: POST
    path: "/blood-bank/issue-records"
    description: "Issue a unit against an order (standard crossmatched, plasma auto-select, or emergency release)"
    roles: [BloodBankTechnologist]
    code: 201
    input: [order_id, verified_by_user_id, "unit_id?", "is_emergency_release?", "emergency_justification?"]
    output: IssueRecord
    side_effects: ["unit -> ISSUED; crossmatch -> CONSUMED (when crossmatched); order counters/state advance; emergency flags set"]
  - method: GET
    path: "/blood-bank/issue-records"
    description: "List issue records"
    roles: *all_roles
    code: 200
    input: ["order_id?", "unit_id?", "patient_id?", "mtp_activation_id?", "status?", "limit?", "offset?"]
    output: "IssueRecord[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/issue-records/{id}"
    description: "Get one issue record"
    roles: *all_roles
    code: 200
    input: []
    output: IssueRecord
    side_effects: []
  - method: POST
    path: "/blood-bank/issue-records/{id}/start-transfusion"
    description: "Start the transfusion (within 4h of issue)"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: IssueRecord
    side_effects: []
  - method: POST
    path: "/blood-bank/issue-records/{id}/complete-transfusion"
    description: "Complete the transfusion"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: IssueRecord
    side_effects: ["unit -> TRANSFUSED; order.units_transfused += 1 (may -> COMPLETED); patient.total_units_transfused += 1"]
  - method: POST
    path: "/blood-bank/issue-records/{id}/return"
    description: "Return an unstarted unit (30-minute rule decides restock vs discard)"
    roles: [BloodBankTechnologist]
    code: 200
    input: [seal_intact, temperature_excursion]
    output: IssueRecord
    side_effects: ["return_disposition computed; unit -> AVAILABLE or DISCARDED (+WastageRecord); order recompute"]
  - method: POST
    path: "/blood-bank/issue-records/{id}/stop-transfusion"
    description: "Stop a started transfusion without a reaction report (unit discarded)"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: IssueRecord
    side_effects: ["unit -> DISCARDED + WastageRecord(PARTIAL_TRANSFUSION); order recompute"]
  - method: POST
    path: "/blood-bank/issue-records/{id}/acknowledge-emergency"
    description: "Ordering physician acknowledges an emergency release (within 24h)"
    roles: [OrderingPhysician]
    code: 200
    input: []
    output: IssueRecord
    side_effects: ["sets physician_acknowledged_at"]

  # --- Massive transfusion protocol ---
  - method: POST
    path: "/blood-bank/mtp-activations"
    description: "Activate the massive transfusion protocol for a patient"
    roles: [OrderingPhysician]
    code: 201
    input: [patient_id, activation_reason]
    output: MTPActivation
    side_effects: ["patient.active_mtp = true (increments Patient.version)"]
  - method: GET
    path: "/blood-bank/mtp-activations"
    description: "List MTP activations"
    roles: *all_roles
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: "MTPActivation[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/mtp-activations/{id}"
    description: "Get one MTP activation"
    roles: *all_roles
    code: 200
    input: []
    output: MTPActivation
    side_effects: []
  - method: POST
    path: "/blood-bank/mtp-activations/{id}/dispatch-pack"
    description: "Dispatch the next MTP pack per calculations.mtp_pack_constitution (creates emergency-release IssueRecords; records shortfalls instead of failing)"
    roles: [BloodBankTechnologist]
    code: 200
    input: [verified_by_user_id]
    output: { pack_number: integer, issue_record_ids: array, shortfalls: array }
    side_effects: ["packs_dispatched += 1; units -> ISSUED; units_issued_total updated"]
  - method: POST
    path: "/blood-bank/mtp-activations/{id}/stand-down"
    description: "Stand down an active MTP"
    roles: [OrderingPhysician]
    code: 200
    input: []
    output: MTPActivation
    side_effects: ["emergency-release privilege ends"]
  - method: POST
    path: "/blood-bank/mtp-activations/{id}/deactivate"
    description: "Deactivate after stand-down; requires no outstanding MTP issue records"
    roles: [OrderingPhysician]
    code: 200
    input: []
    output: MTPActivation
    side_effects: ["patient.active_mtp = false; units_wasted_total computed"]

  # --- Transfusion reactions ---
  - method: POST
    path: "/blood-bank/transfusion-reactions"
    description: "Report a transfusion reaction on a started/transfused issue"
    roles: [BloodBankTechnologist]
    code: 201
    input: [issue_record_id, reaction_type, severity, "symptoms?"]
    output: TransfusionReaction
    side_effects: ["TRANSFUSION_STARTED issue -> TRANSFUSION_STOPPED; unit -> QUARANTINED_HOLD (REACTION_PRECAUTION)"]
  - method: GET
    path: "/blood-bank/transfusion-reactions"
    description: "List transfusion reactions"
    roles: *all_roles
    code: 200
    input: ["issue_record_id?", "patient_id?", "unit_id?", "status?", "reaction_type?", "linked_recall_case_id?", "limit?", "offset?"]
    output: "TransfusionReaction[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/transfusion-reactions/{id}"
    description: "Get one transfusion reaction"
    roles: *all_roles
    code: 200
    input: []
    output: TransfusionReaction
    side_effects: []
  - method: POST
    path: "/blood-bank/transfusion-reactions/{id}/begin-investigation"
    description: "Assign investigating quality officer (must differ from reporter)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: TransfusionReaction
    side_effects: ["sets investigator_user_id"]
  - method: POST
    path: "/blood-bank/transfusion-reactions/{id}/record-workup"
    description: "Record serologic workup results"
    roles: [QualityOfficer]
    code: 200
    input: [clerical_check_passed, dat_result, hemolysis_present]
    output: TransfusionReaction
    side_effects: ["sets workup_recorded_at"]
  - method: POST
    path: "/blood-bank/transfusion-reactions/{id}/conclude"
    description: "Conclude the investigation; CONFIRMED severe reactions auto-create + identify a DONOR-scope recall"
    roles: [QualityOfficer]
    code: 200
    input: [conclusion, "final_classification?"]
    output: TransfusionReaction
    side_effects: ["held unit -> DISCARDED + WastageRecord(REACTION_INVESTIGATION); severe CONFIRMED -> RecallCase created in UNITS_IDENTIFIED, linked_recall_case_id set"]
  - method: POST
    path: "/blood-bank/transfusion-reactions/{id}/close"
    description: "Close a concluded reaction (gated on linked recall progress)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: TransfusionReaction
    side_effects: []

  # --- Recall / look-back ---
  - method: POST
    path: "/blood-bank/recall-cases"
    description: "Open a recall/look-back case (DONOR | LOT | UNIT scope)"
    roles: [QualityOfficer]
    code: 201
    input: [scope_type, reason, disposition, "donor_id?", "lot_number?", "unit_id?", "implicated_since?"]
    output: RecallCase
    side_effects: []
  - method: GET
    path: "/blood-bank/recall-cases"
    description: "List recall cases"
    roles: *all_roles
    code: 200
    input: ["status?", "scope_type?", "unit_id?", "limit?", "offset?"]
    output: "RecallCase[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/recall-cases/{id}"
    description: "Get one recall case"
    roles: *all_roles
    code: 200
    input: []
    output: RecallCase
    side_effects: []
  - method: POST
    path: "/blood-bank/recall-cases/{id}/identify-units"
    description: "Compute and pin the implicated unit set"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: RecallCase
    side_effects: ["implicated_unit_ids pinned; counts computed"]
  - method: POST
    path: "/blood-bank/recall-cases/{id}/execute-quarantine"
    description: "Quarantine-hold all non-terminal implicated units (cancels their crossmatches)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: RecallCase
    side_effects: ["units -> QUARANTINED_HOLD (RECALL); crossmatches -> CANCELLED; orders recompute"]
  - method: POST
    path: "/blood-bank/recall-cases/{id}/record-notification"
    description: "Mark one implicated transfused issue record as notified (look-back)"
    roles: [QualityOfficer]
    code: 200
    input: [issue_record_id]
    output: RecallCase
    side_effects: ["issue.lookback_notified = true; notifications_sent_count += 1"]
  - method: POST
    path: "/blood-bank/recall-cases/{id}/complete-notifications"
    description: "Advance when all implicated transfused issues are notified"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: RecallCase
    side_effects: []
  - method: POST
    path: "/blood-bank/recall-cases/{id}/close"
    description: "Close the recall; applies disposition to held units (DESTRUCTION -> DISCARDED + wastage; MARKET_WITHDRAWAL -> RETURNED_TO_SUPPLIER)"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: RecallCase
    side_effects: ["held units disposed per disposition"]
  - method: POST
    path: "/blood-bank/recall-cases/{id}/void"
    description: "Void a false-alarm recall before quarantine executed"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: RecallCase
    side_effects: []

  # --- Wastage ---
  - method: GET
    path: "/blood-bank/wastage-records"
    description: "List wastage records"
    roles: *all_roles
    code: 200
    input: ["unit_id?", "product_type?", "reason?", "limit?", "offset?"]
    output: "WastageRecord[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/wastage-records/{id}"
    description: "Get one wastage record"
    roles: *all_roles
    code: 200
    input: []
    output: WastageRecord
    side_effects: []
  - method: GET
    path: "/blood-bank/wastage-summary"
    description: "Computed per-bucket rolling wastage rates"
    roles: *all_roles
    code: 200
    input: ["product_type?", "window_days?"]
    output: { as_of_utc: datetime, window_days: integer, buckets: array }
    side_effects: []

  # --- Par-level policies / shortage posture ---
  - method: POST
    path: "/blood-bank/par-level-policies"
    description: "Create a bucket par-level policy (one ACTIVE per bucket)"
    roles: [BloodBankSupervisor]
    code: 201
    input: [product_type, abo_type, rh_type, watch_threshold, shortage_threshold, critical_threshold, "min_shelf_life_hours?"]
    output: ParLevelPolicy
    side_effects: ["posture computed immediately"]
  - method: GET
    path: "/blood-bank/par-level-policies"
    description: "List policies"
    roles: *all_roles
    code: 200
    input: ["product_type?", "status?", "limit?", "offset?"]
    output: "ParLevelPolicy[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/par-level-policies/{id}"
    description: "Get one policy"
    roles: *all_roles
    code: 200
    input: []
    output: ParLevelPolicy
    side_effects: []
  - method: PUT
    path: "/blood-bank/par-level-policies/{id}"
    description: "Update thresholds (OCC on policy version)"
    roles: [BloodBankSupervisor]
    code: 200
    input: [expected_policy_version, "watch_threshold?", "shortage_threshold?", "critical_threshold?", "min_shelf_life_hours?"]
    output: ParLevelPolicy
    side_effects: ["increments ParLevelPolicy.version by 1", "posture recomputed"]
  - method: POST
    path: "/blood-bank/par-level-policies/{id}/retire"
    description: "Retire a policy"
    roles: [BloodBankSupervisor]
    code: 200
    input: []
    output: ParLevelPolicy
    side_effects: []
  - method: GET
    path: "/blood-bank/par-level-policies/{id}/posture"
    description: "Computed physical + prospective posture read for the bucket"
    roles: *all_roles
    code: 200
    input: []
    output: { product_type: string, abo_type: string, rh_type: string, usable_units: integer, inbound_units_24h: integer, physical_posture: string, prospective_posture: string, excessive_wastage: boolean }
    side_effects: []

  # --- Transport coolers ---
  - method: POST
    path: "/blood-bank/coolers"
    description: "Register a transport cooler"
    roles: [BloodBankSupervisor]
    code: 201
    input: [cooler_tag]
    output: TransportCooler
    side_effects: []
  - method: GET
    path: "/blood-bank/coolers"
    description: "List coolers"
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TransportCooler[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/coolers/{id}"
    description: "Get one cooler"
    roles: *all_roles
    code: 200
    input: []
    output: TransportCooler
    side_effects: []
  - method: POST
    path: "/blood-bank/cooler-checkouts"
    description: "Check out a cooler for a planned window (60-minute redispatch buffer conflict rule)"
    roles: [BloodBankTechnologist]
    code: 201
    input: [cooler_id, planned_start, planned_end]
    output: CoolerCheckout
    side_effects: ["cooler AVAILABLE -> CHECKED_OUT when planned_start <= now <= planned_end; otherwise cooler unchanged"]
  - method: GET
    path: "/blood-bank/cooler-checkouts"
    description: "List cooler checkouts"
    roles: *all_roles
    code: 200
    input: ["cooler_id?", "status?", "limit?", "offset?"]
    output: "CoolerCheckout[]"
    side_effects: []
  - method: GET
    path: "/blood-bank/cooler-checkouts/{id}"
    description: "Get one checkout"
    roles: *all_roles
    code: 200
    input: []
    output: CoolerCheckout
    side_effects: []
  - method: POST
    path: "/blood-bank/cooler-checkouts/{id}/return"
    description: "Return a checked-out cooler (starts the 60-minute restock buffer)"
    roles: [BloodBankTechnologist]
    code: 200
    input: []
    output: CoolerCheckout
    side_effects: ["cooler CHECKED_OUT -> RESTOCKING; restock_until = now + 60min"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  # --- generic ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Unmatched route or resource id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum value, or range violation" }
  # --- per-resource not found ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id does not exist" }
  - { id: ERR_SUPPLIER_ORDER_NOT_FOUND, http: 404, condition: "Supplier order id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Blood unit id does not exist" }
  - { id: ERR_TS_NOT_FOUND, http: 404, condition: "TypeAndScreen id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "TransfusionOrder id does not exist" }
  - { id: ERR_CROSSMATCH_NOT_FOUND, http: 404, condition: "Crossmatch id does not exist" }
  - { id: ERR_ISSUE_NOT_FOUND, http: 404, condition: "IssueRecord id does not exist" }
  - { id: ERR_REACTION_NOT_FOUND, http: 404, condition: "TransfusionReaction id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "RecallCase id does not exist" }
  - { id: ERR_WASTAGE_RECORD_NOT_FOUND, http: 404, condition: "WastageRecord id does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "ParLevelPolicy id does not exist" }
  - { id: ERR_COOLER_NOT_FOUND, http: 404, condition: "TransportCooler id does not exist" }
  - { id: ERR_CHECKOUT_NOT_FOUND, http: 404, condition: "CoolerCheckout id does not exist" }
  - { id: ERR_MTP_NOT_FOUND, http: 404, condition: "MTPActivation id does not exist" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  # --- unit state ---
  - { id: ERR_UNIT_NOT_RELEASABLE, http: 409, condition: "release-from-quarantine requires status QUARANTINED" }
  - { id: ERR_UNIT_NOT_REJECTABLE, http: 409, condition: "reject-intake requires status QUARANTINED" }
  - { id: ERR_UNIT_NOT_DISCARDABLE, http: 409, condition: "manual discard requires AVAILABLE | QUARANTINED | QUARANTINED_HOLD" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit not AVAILABLE (reserved, issued, held, expired, or terminal) where availability is required" }
  - { id: ERR_UNIT_INCOMPATIBLE, http: 422, condition: "Unit fails calculations.unit_compatibility_decision for this patient/order context" }
  - { id: ERR_NO_COMPATIBLE_UNIT, http: 409, condition: "Auto-select found no eligible unit (empty candidate pool)" }
  # --- T&S ---
  - { id: ERR_TS_NOT_COLLECTED, http: 409, condition: "result/reject-specimen requires status COLLECTED" }
  - { id: ERR_TS_NOT_RESULTED, http: 409, condition: "validate requires status RESULTED" }
  - { id: ERR_TS_NOT_ACTIVE, http: 409, condition: "Patient lacks an ACTIVE TypeAndScreen where one is required" }
  - { id: ERR_SPECIMEN_TIME_INVALID, http: 400, condition: "specimen_collected_at / collected_at / thawed_at / pooled_at in the future" }
  - { id: ERR_DUPLICATE_SPECIMEN, http: 409, condition: "Same patient already has a non-REJECTED T&S with this specimen_collected_at" }
  - { id: ERR_ANTIBODY_DETAIL_REQUIRED, http: 422, condition: "antibody_screen POSITIVE requires non-empty antibody_identifications" }
  # --- order ---
  - { id: ERR_ORDER_NOT_VERIFIABLE, http: 409, condition: "verify requires PENDING_VERIFICATION" }
  - { id: ERR_ORDER_NOT_REJECTABLE, http: 409, condition: "reject requires PENDING_VERIFICATION" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires a non-terminal status" }
  - { id: ERR_ORDER_NOT_REACTIVATABLE, http: 409, condition: "reactivate requires ON_HOLD" }
  - { id: ERR_ORDER_NOT_ISSUABLE, http: 409, condition: "issue requires READY | PARTIALLY_ISSUED (or AWAITING_CROSSMATCH for emergency release)" }
  - { id: ERR_ORDER_FULLY_CROSSMATCHED, http: 409, condition: "fulfillment already meets units_requested at crossmatch create" }
  - { id: ERR_ORDER_ISSUE_QUOTA_MET, http: 409, condition: "units_issued_net already equals units_requested" }
  # --- crossmatch ---
  - { id: ERR_XM_NOT_PENDING, http: 409, condition: "record-result requires PENDING" }
  - { id: ERR_XM_NOT_CANCELLABLE, http: 409, condition: "cancel requires PENDING | COMPATIBLE" }
  # --- issue ---
  - { id: ERR_ISSUE_NOT_STARTABLE, http: 409, condition: "start-transfusion requires ISSUED" }
  - { id: ERR_ISSUE_NOT_COMPLETABLE, http: 409, condition: "complete-transfusion requires TRANSFUSION_STARTED" }
  - { id: ERR_ISSUE_NOT_RETURNABLE, http: 409, condition: "return requires ISSUED" }
  - { id: ERR_ISSUE_NOT_STOPPABLE, http: 409, condition: "stop-transfusion requires TRANSFUSION_STARTED" }
  - { id: ERR_ISSUE_NOT_REACTIONABLE, http: 409, condition: "reaction report requires TRANSFUSION_STARTED | TRANSFUSED" }
  - { id: ERR_ISSUE_NOT_ACKNOWLEDGABLE, http: 409, condition: "acknowledge-emergency requires an unacknowledged emergency release" }
  - { id: ERR_TRANSFUSION_START_WINDOW_LAPSED, http: 409, condition: "now > issued_at + 4h at start-transfusion" }
  - { id: ERR_EMERGENCY_RELEASE_NOT_ALLOWED, http: 409, condition: "is_emergency_release requires EMERGENCY urgency or an ACTIVATED MTP for the patient" }
  - { id: ERR_EMERGENCY_JUSTIFICATION_REQUIRED, http: 422, condition: "emergency release requires justification >= 20 chars" }
  - { id: ERR_EMERGENCY_ACK_WINDOW_LAPSED, http: 409, condition: "now > issued_at + 24h at acknowledge-emergency" }
  - { id: ERR_NOT_ORDERING_PHYSICIAN, http: 403, condition: "acknowledge-emergency caller is not the order's ordering physician" }
  - { id: ERR_SECOND_SPECIMEN_REQUIRED, http: 409, condition: "Non-O RBC/WHOLE_BLOOD issue to an ABO-unconfirmed patient (non-emergency)" }
  # --- segregation ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempted two steps that must be performed by different people" }
  # --- MTP ---
  - { id: ERR_MTP_ALREADY_ACTIVE, http: 409, condition: "Patient already has an ACTIVATED MTP" }
  - { id: ERR_MTP_NOT_ACTIVE, http: 409, condition: "dispatch-pack / stand-down requires ACTIVATED" }
  - { id: ERR_MTP_NOT_STANDING_DOWN, http: 409, condition: "deactivate requires STANDING_DOWN" }
  - { id: ERR_MTP_UNITS_OUTSTANDING, http: 409, condition: "deactivate blocked: MTP issue records still ISSUED or TRANSFUSION_STARTED" }
  # --- reaction ---
  - { id: ERR_REACTION_NOT_INVESTIGABLE, http: 409, condition: "begin-investigation requires REPORTED" }
  - { id: ERR_REACTION_NOT_INVESTIGATING, http: 409, condition: "record-workup / conclude requires INVESTIGATING" }
  - { id: ERR_REACTION_WORKUP_MISSING, http: 409, condition: "conclude requires record-workup first" }
  - { id: ERR_REACTION_NOT_CLOSABLE, http: 409, condition: "close requires CONFIRMED | RULED_OUT" }
  - { id: ERR_RECALL_INCOMPLETE, http: 409, condition: "reaction close blocked: linked recall not yet NOTIFICATION_COMPLETE" }
  # --- recall ---
  - { id: ERR_RECALL_SCOPE_INVALID, http: 400, condition: "scope fields inconsistent with scope_type" }
  - { id: ERR_RECALL_NOT_IDENTIFIABLE, http: 409, condition: "identify-units requires OPEN" }
  - { id: ERR_RECALL_NOT_QUARANTINABLE, http: 409, condition: "execute-quarantine requires UNITS_IDENTIFIED" }
  - { id: ERR_RECALL_NOTIFICATIONS_NOT_COMPLETABLE, http: 409, condition: "record-notification / complete-notifications require QUARANTINE_COMPLETE" }
  - { id: ERR_NOTIFICATIONS_PENDING, http: 409, condition: "complete-notifications blocked: implicated transfused issues not all notified" }
  - { id: ERR_RECALL_NOT_CLOSABLE, http: 409, condition: "close requires NOTIFICATION_COMPLETE" }
  - { id: ERR_RECALL_NOT_VOIDABLE, http: 409, condition: "void requires OPEN | UNITS_IDENTIFIED" }
  - { id: ERR_ISSUE_NOT_IMPLICATED, http: 409, condition: "record-notification issue does not reference an implicated transfused unit" }
  - { id: ERR_ISSUE_ALREADY_NOTIFIED, http: 409, condition: "issue already marked lookback_notified" }
  # --- supplier / order ---
  - { id: ERR_SUPPLIER_SUSPENDED, http: 409, condition: "Supplier is SUSPENDED (submit / unit release / suspend / reinstate misuse)" }
  - { id: ERR_SO_NOT_SUBMITTABLE, http: 409, condition: "submit requires DRAFT" }
  - { id: ERR_SO_NOT_ACKNOWLEDGEABLE, http: 409, condition: "acknowledge requires SUBMITTED" }
  - { id: ERR_SO_NOT_RECEIVABLE, http: 409, condition: "receive requires ACKNOWLEDGED | RECEIVING" }
  - { id: ERR_SO_NOT_CLOSABLE, http: 409, condition: "manual close requires RECEIVING" }
  - { id: ERR_SO_NOT_CANCELLABLE, http: 409, condition: "cancel requires DRAFT | SUBMITTED | ACKNOWLEDGED" }
  - { id: ERR_OVER_RECEIPT, http: 422, condition: "Cumulative line receipt exceeds ordered quantity or line not on order" }
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "unit_number already exists" }
  - { id: ERR_WASTAGE_REVIEW_REQUIRED, http: 409, condition: "Non-emergency submit by SupplierCoordinator while a line's bucket wastage rate >= 0.05" }
  # --- policy / shortage gates ---
  - { id: ERR_POLICY_BUCKET_DUPLICATE, http: 409, condition: "An ACTIVE policy already exists for this bucket" }
  - { id: ERR_THRESHOLD_ORDER_INVALID, http: 400, condition: "Thresholds violate watch >= shortage >= critical >= 0" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "retire/PUT require status ACTIVE" }
  - { id: ERR_BUCKET_CRITICAL_ELECTIVE_BLOCKED, http: 409, condition: "ROUTINE order verify blocked: demand bucket posture CRITICAL" }
  - { id: ERR_BUCKET_SHORTAGE_MTP_PRIORITY, http: 409, condition: "ROUTINE order verify blocked: an MTP is ACTIVATED and demand bucket posture is SHORTAGE or CRITICAL" }
  # --- cooler ---
  - { id: ERR_CHECKOUT_WINDOW_INVALID, http: 400, condition: "planned_end <= planned_start or duration > 12h" }
  - { id: ERR_COOLER_WINDOW_CONFLICT, http: 409, condition: "Checkout window collides with another checkout plus its 60-minute buffer" }
  - { id: ERR_CHECKOUT_NOT_RETURNABLE, http: 409, condition: "return requires OPEN" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrderingPhysician
    description: "Licensed physician who orders transfusions, activates/stands down/deactivates MTP, and acknowledges emergency releases"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/transfusion-orders"
      - "POST /blood-bank/transfusion-orders/{id}/cancel"
      - "POST /blood-bank/mtp-activations"
      - "POST /blood-bank/mtp-activations/{id}/stand-down"
      - "POST /blood-bank/mtp-activations/{id}/deactivate"
      - "POST /blood-bank/issue-records/{id}/acknowledge-emergency"
    shared_operations: ["all GET endpoints"]
  - name: BloodBankTechnologist
    description: "Bench technologist: patients, type & screen, crossmatch, issue/return, unit intake, reaction reporting, cooler checkouts"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/type-and-screens (+/result, /validate, /reject-specimen)"
      - "POST /blood-bank/transfusion-orders/{id}/verify, /reject, /reactivate"
      - "POST /blood-bank/crossmatches (+/record-result, /cancel)"
      - "POST /blood-bank/issue-records (+/start-transfusion, /complete-transfusion, /return, /stop-transfusion)"
      - "POST /blood-bank/blood-units/{id}/release-from-quarantine, /reject-intake"
      - "POST /blood-bank/transfusion-reactions"
      - "POST /blood-bank/cooler-checkouts (+/return)"
      - "POST /blood-bank/mtp-activations/{id}/dispatch-pack"
    shared_operations: ["POST /blood-bank/patients (with Supervisor)", "all GET endpoints"]
  - name: BloodBankSupervisor
    description: "Blood bank supervisor: suppliers, par-level policies, coolers, manual discards, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/suppliers (+/suspend, /reinstate)"
      - "POST /blood-bank/par-level-policies (+PUT, /retire)"
      - "POST /blood-bank/coolers"
      - "POST /blood-bank/blood-units/{id}/discard"
      - "POST /blood-bank/_clock/set_current_utc, /_clock/sweep"
    shared_operations: ["POST /blood-bank/patients", "all /supplier-orders operations (with SupplierCoordinator)", "all GET endpoints"]
  - name: SupplierCoordinator
    description: "Inventory coordinator managing replenishment orders and receipts"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all /supplier-orders operations (with BloodBankSupervisor)", "all GET endpoints"]
  - name: QualityOfficer
    description: "Quality/hemovigilance officer: reaction investigation and recall/look-back management"
    identity: opaque
    exclusive_operations:
      - "POST /blood-bank/transfusion-reactions/{id}/begin-investigation, /record-workup, /conclude, /close"
      - "POST /blood-bank/recall-cases (+/identify-units, /execute-quarantine, /record-notification, /complete-notifications, /close, /void)"
    shared_operations: ["all GET endpoints"]
