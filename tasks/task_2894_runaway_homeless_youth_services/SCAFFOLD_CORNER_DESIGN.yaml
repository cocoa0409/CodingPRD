          - calculations.trafficking_risk_score.variants
          - entities.Youth.fields.trafficking_risk_score
        excluded_because:
          difficulty_instance: trafficking_risk_score_screening_snapshot_versus_decayed_outreach_history
          rationale: "The screening_time snapshot (frozen at 55) versus the decayed outreach_history figure (44 after one completed week, with the per-contact floor applied before summation) is exactly what that difficulty instance asserts, including the rejected decay-the-total alternative. Nothing observable is left for a corner test."

  - section: validations
    instances:
      - name: age_below_the_program_band_is_rejected_on_admission
        claim_type: violation_to_error
        grounds:
          - validations[priority=25]
          - errors.ERR_AGE_OUTSIDE_PROGRAM_BAND
        distinguishing_aspect: "An 11-year-old is one year under min_age_years 12, so the admission is refused with 422 ERR_AGE_OUTSIDE_PROGRAM_BAND even though the screening is CLEARED and the program is OPEN with a free bed - the lower bound is inclusive and 11 is outside it."
        test_recipe:
          setup:
            - "an OPEN EMERGENCY_SHELTER program with licensed_bed_capacity 2 and age band 12..17"
            - "youth Ilan Rezaei, dob 2015-03-15, so age_years is 11 at the default clock, with a CLEARED screening"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { band_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ilan", legal_last_name: "Rezaei", date_of_birth: "2015-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { band_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${band_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { band_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${band_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${band_youth_id}", program_id: "${band_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { band_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 422 with error_id ERR_AGE_OUTSIDE_PROGRAM_BAND"
            - "Youth.${band_youth_id}.age_years == 11"
            - "Youth.${band_youth_id}.status == PROSPECT"
            - "ShelterProgram.${band_program_id}.occupied_beds == 0"
            - "GET /ryhs/admissions?program_id=${band_program_id} returns total_count 0"

      - name: admission_at_a_transitional_living_program_is_a_type_mismatch
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors.ERR_PROGRAM_TYPE_MISMATCH
        distinguishing_aspect: "Admissions belong to EMERGENCY_SHELTER programs only: pointing POST /ryhs/admissions at a TRANSITIONAL_LIVING program returns 422 ERR_PROGRAM_TYPE_MISMATCH, and because the youth's age 16 sits inside that program's 16..20 band the rejection cannot be confused with an age-band failure."
        test_recipe:
          setup:
            - "a TRANSITIONAL_LIVING program with age band 16..20 and free beds"
            - "youth Fen Larsson, dob 2010-03-15 (age 16), with a CLEARED screening"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
