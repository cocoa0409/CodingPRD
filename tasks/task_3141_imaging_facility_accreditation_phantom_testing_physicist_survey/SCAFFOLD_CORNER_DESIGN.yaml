    grounds:
    - state_machines.PhysicistSurvey.SUBMITTED_to_ACCEPTED
    - entities.PersonnelQualification.fields.qualification_verified_at
    - entities.PersonnelQualification.fields.survey_count
    distinguishing_aspect: Accepting a survey cascades onto two derived fields of the performing qualification — its survey_count and, when |dose_deviation_pct| <= 8.0, its credential_status — so the survey hop and the qualification hop must both be observed.
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z.
      - Facility Northgate Imaging Center (CT) is ENROLLED with accreditation_currency PROVISIONAL, payer_participation_status ACTIVE and registry_credit_cents 500000.
      - ModalityUnit CT-1 (CT) is ENROLLED with EquipmentItem SN-CT-0001 ACTIVE.
      - PersonnelQualification TECH-1001 (TECHNOLOGIST) and PHYS-2001 (MEDICAL_PHYSICIST) are VERIFIED.
      - 'AccreditationCycle #1 is ACTIVE.'
      - The performing MEDICAL_PHYSICIST qualification is left PENDING by skipping its own verify call, so only the survey path can verify it.
      setup_api_calls:
      - call: POST /accreditation/facilities
        payload:
          name: Northgate Imaging Center
          state_code: CT
          facility_type: IMAGING_CENTER
        as: FacilityAdmin
        captures:
          fac_id: $.data.id
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Hana Reyes
          personnel_role: TECHNOLOGIST
          credential_number: TECH-1001
          ce_credit_hours: 24.0
          required_ce_hours: 24.0
          credential_expires_on: '2027-06-30T00:00:00Z'
        as: AccreditationBody
        captures:
          tq_id: $.data.id
      - call: POST /accreditation/qualifications/${tq_id}/verify
        payload:
          verified_at: '2026-09-02T00:00:00Z'
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/modality-units
        payload:
          facility_id: ${fac_id}
          modality_code: CT
          unit_label: CT-1
          expected_facility_version: ${fv}
        as: FacilityAdmin
        captures:
          unit_id: $.data.id
      - call: POST /accreditation/equipment
        payload:
          unit_id: ${unit_id}
          manufacturer: Siemens
          model_number: SOMATOM-X1
          serial_number: SN-CT-0001
          modality_code: CT
          installed_on: '2026-08-01T00:00:00Z'
        as: FacilityAdmin
        captures:
          eq_id: $.data.id
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/facilities/${fac_id}/register
        payload:
          expected_facility_version: ${fv}
        as: FacilityAdmin
      - call: POST /accreditation/cycles
        payload:
          facility_id: ${fac_id}
          cycle_index: 1
          cycle_started_at: '2026-09-01T00:00:00Z'
        as: AccreditationBody
        captures:
          cyc_id: $.data.id
      - call: POST /accreditation/cycles/${cyc_id}/activate
        payload: {}
        as: AccreditationBody
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Ira Sundaram
          personnel_role: MEDICAL_PHYSICIST
          credential_number: PHYS-2001
          ce_credit_hours: 50.0
          required_ce_hours: 50.0
          credential_expires_on: '2028-06-30T00:00:00Z'
        as: AccreditationBody
        captures:
          pq_id: $.data.id
      - call: POST /accreditation/qualifications/${pq_id}/verify
        payload:
          verified_at: '2026-09-02T00:00:00Z'
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/facilities/${fac_id}/registry-credit
        payload:
          amount_cents: 500000
          expected_facility_version: ${fv}
        as: FacilityAdmin
      - call: GET /accreditation/modality-units/${unit_id}
        payload: {}
        as: Any
        captures:
          uv: $.data.version
      - call: POST /accreditation/physicist-surveys
        payload:
          facility_id: ${fac_id}
          physicist_qualification_id: ${pq_id}
          survey_type: ANNUAL
          scheduled_at: '2026-09-03T00:00:00Z'
          reference_entrance_dose_mgy: 2.0
          unit_id: ${unit_id}
        as: MedicalPhysicist
        as_user_id: ${pq_id}
        captures:
          svy_id: $.data.id
      - call: POST /accreditation/physicist-surveys/${svy_id}/submit
        payload:
          performed_at: '2026-09-10T00:00:00Z'
          measured_entrance_dose_mgy: 2.15
          shielding_verdict: PASS
        as: MedicalPhysicist
        as_user_id: ${pq_id}
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/physicist-surveys/${svy_id}/accept
        payload: {}
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv3: $.data.version
      - call: POST /accreditation/physicist-surveys
        payload:
          facility_id: ${fac_id}
          physicist_qualification_id: ${pq_id}
          survey_type: POST_REPAIR
          scheduled_at: '2026-09-20T00:00:00Z'
          reference_entrance_dose_mgy: 2.0
          unit_id: ${unit_id}
        as: MedicalPhysicist
        as_user_id: ${pq_id}
        captures:
          svy_c_id: $.data.id
      - call: POST /accreditation/physicist-surveys/${svy_c_id}/submit
        payload:
          performed_at: '2026-09-20T00:00:00Z'
          measured_entrance_dose_mgy: 2.15
          shielding_verdict: PASS
        as: MedicalPhysicist
        as_user_id: ${pq_id}
      trigger:
      - call: POST /accreditation/physicist-surveys/${svy_c_id}/accept
        payload: {}
        as: AccreditationBody
      assert:
      - PhysicistSurvey.${svy_c_id}.survey_status == ACCEPTED
      - PersonnelQualification.${pq_id}.survey_count == 3 — the accepted baseline, the earlier POST_REPAIR survey and this one
      - PersonnelQualification.${pq_id}.credential_status == VERIFIED because |7.5| <= 8.0
      - PersonnelQualification.${pq_id}.qualification_verified_at is stamped
      - ModalityUnit.${unit_id}.last_survey_at == 2026-09-20T00:00:00Z
      - Facility.${fac_id}.accreditation_currency == CURRENT
- section: consistency_model
