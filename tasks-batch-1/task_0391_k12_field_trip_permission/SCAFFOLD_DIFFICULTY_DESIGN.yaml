# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0391_k12_field_trip_permission — Expert tier
#
# 9 Difficulty Rules × ≥2 instances = 18 instances total.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; OCC version
# inputs are dynamic ${vars}; formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: slip_fee_provisional_vs_final_diverges
        grounds:
          - calculations.slip_fee_due
          - calculations.per_student_cost_allocation
          - entities.PermissionSlip.fields.fee_due_cents
          - state_machines.PermissionSlip.UNSIGNED_to_SIGNED
          - state_machines.FieldTrip.APPROVED_to_ROSTER_LOCKED
        distinguishing_aspect: |
          slip_fee_due is a dual-variant calc on the PermissionSlip domain: the
          PROVISIONAL transport_share at sign (ceil(10000/3)=3334 → fee 4334) differs
          from the FINAL waterfall share at lock for the non-remainder slips
          (3333 → fee 4333). Same slip, two variants, different cents.
        test_recipe:
          setup:
            - "Trip APPROVED, grade_band MIDDLE, base_fee 1000c, transport_cost 10000c, deposit 0c, capacity 5."
            - "3 slips, all SIGNED in order s1 then s2 then s3 (signed_at ascending), each with an emergency contact."
            - "1 CLEARED chaperone (required_chaperones for S=3 MIDDLE = ceil(3/12)=1) and a CONFIRMED transport booking of 3 seats."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "T One", email: "t1@x.com", phone: "555-0001" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G A", email: "ga@x.com", phone: "555-0101" }
              as: DistrictAdmin
              captures: { g_a: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G B", email: "gb@x.com", phone: "555-0102" }
              as: DistrictAdmin
              captures: { g_b: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G C", email: "gc@x.com", phone: "555-0103" }
              as: DistrictAdmin
              captures: { g_c: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "Chap", email: "chap@x.com", phone: "555-0900" }
              as: DistrictAdmin
              captures: { g_chap: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S A", grade_level: 7, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_a: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S B", grade_level: 7, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_b: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S C", grade_level: 7, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_c: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "Bus 1", seat_capacity: 40 }
              as: DistrictAdmin
              captures: { veh: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Museum", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "MIDDLE", depart_at: "2026-09-01T09:00:00Z", return_at: "2026-09-01T12:00:00Z", capacity: 5, base_fee_cents: 1000, transport_cost_cents: 10000, deposit_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_a}", guardian_id: "${g_a}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_a: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_b}", guardian_id: "${g_b}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_b: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_c}", guardian_id: "${g_c}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_c: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips/${slip_a}/emergency-contacts"
              payload: { name: "EC A", phone: "555-1", relationship: "aunt" }
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/permission-slips/${slip_b}/emergency-contacts"
              payload: { name: "EC B", phone: "555-2", relationship: "uncle" }
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/permission-slips/${slip_c}/emergency-contacts"
              payload: { name: "EC C", phone: "555-3", relationship: "gp" }
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/permission-slips/${slip_a}/sign"
              payload: {}
              as: Guardian
              as_user_id: "${g_a}"
            - call: "POST /field-trips/${trip}/permission-slips/${slip_b}/sign"
              payload: {}
              as: Guardian
              as_user_id: "${g_b}"
            - call: "POST /field-trips/${trip}/permission-slips/${slip_c}/sign"
              payload: {}
              as: Guardian
              as_user_id: "${g_c}"
            - call: "POST /field-trips/${trip}/chaperones"
              payload: { guardian_id: "${g_chap}", background_check_ref: "BG-1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { chap: $.data.id }
            - call: "POST /field-trips/${trip}/chaperones/${chap}/confirm"
              payload: {}
              as: Guardian
              as_user_id: "${g_chap}"
            - call: "POST /field-trips/${trip}/chaperones/${chap}/clear"
              payload: {}
              as: Principal
            - call: "POST /field-trips/${trip}/transport-bookings"
              payload: { vehicle_id: "${veh}", seat_count: 3 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { bk: $.data.id }
            - call: "POST /field-trips/${trip}/transport-bookings/${bk}/confirm"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
          trigger:
            - call: "GET /permission-slips/${slip_c}"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { prov_fee_c: $.data.fee_due_cents }
            - call: "GET /field-trips/${trip}"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip_v: $.data.version }
            - call: "POST /field-trips/${trip}/lock-roster"
              payload: { expected_trip_version: "${trip_v}" }
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "GET /permission-slips/${slip_c}"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { final_fee_c: $.data.fee_due_cents }
          assert:
            - "PermissionSlip.${slip_c}.fee_due_cents == 4334 before lock (PROVISIONAL: 1000 + ceil(10000/3)=3334)"
            - "PermissionSlip.${slip_c}.fee_due_cents == 4333 after lock (FINAL: 1000 + base_share 3333, remainder went to earliest-signed slip_a)"
            - "PermissionSlip.${slip_a}.fee_due_cents == 4334 after lock (FINAL: remainder cent assigned to earliest signed_at)"

      - name: refund_voluntary_vs_cancellation_diverges
        grounds:
          - calculations.voluntary_withdrawal_refund
          - entities.FeeTransaction.fields.amount_cents
          - state_machines.PermissionSlip.PAID_to_REFUNDED
          - state_machines.FieldTrip.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          voluntary_withdrawal_refund is a dual-variant calc on the FieldTrip/
          FeeTransaction domain: a PAID slip (paid 4334) refunds only 500 on
          guardian withdraw (deposit 500 + transport_share 3334 forfeited) but
          refunds the FULL 4334 when the trip is cancelled by the principal.
        test_recipe:
          setup:
            - "Trip APPROVED, base_fee 1000c, transport_cost 10000c, deposit 500c, capacity 5, MIDDLE band."
            - "3 slips SIGNED (signed_count=3), slip_a additionally PAID 4334c (provisional fee: gross 1000+ceil(10000/3)=3334=4334, deposit not waivable, no scholarship)."
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "T2", email: "t2@x.com", phone: "555-0002" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "GA2", email: "ga2@x.com", phone: "555-0201" }
              as: DistrictAdmin
              captures: { g_a: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "GB2", email: "gb2@x.com", phone: "555-0202" }
              as: DistrictAdmin
              captures: { g_b: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "GC2", email: "gc2@x.com", phone: "555-0203" }
              as: DistrictAdmin
              captures: { g_c: $.data.id }
            - call: "POST /students"
              payload: { full_name: "SA2", grade_level: 7, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_a: $.data.id }
            - call: "POST /students"
              payload: { full_name: "SB2", grade_level: 7, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_b: $.data.id }
            - call: "POST /students"
              payload: { full_name: "SC2", grade_level: 7, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_c: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Zoo", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "MIDDLE", depart_at: "2026-09-03T09:00:00Z", return_at: "2026-09-03T12:00:00Z", capacity: 5, base_fee_cents: 1000, transport_cost_cents: 10000, deposit_cents: 500 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_a}", guardian_id: "${g_a}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_a: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_b}", guardian_id: "${g_b}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_b: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_c}", guardian_id: "${g_c}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_c: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips/${slip_a}/emergency-contacts"
