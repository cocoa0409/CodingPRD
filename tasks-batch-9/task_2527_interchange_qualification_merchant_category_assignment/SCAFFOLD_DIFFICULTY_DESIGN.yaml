              as: NetworkAdmin
              captures: { ip_id: $.data.id, ip_v0: $.data.version }
            - call: "POST /merchants"
              payload: { legal_name: "Grocer A", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_a_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Grocer B", business_type_key: "GROCERY", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_b_id: $.data.id }
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_a_id}", committed_volume_cents: 96000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_a_id: $.data.id }
            - call: "GET /incentive-programs/${ip_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ip_v1: $.data.version }
          trigger:
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_b_id}", committed_volume_cents: 6000000, waitlist_requested: false, expected_incentive_program_version: "${ip_v1}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_ENROLLMENT_CLOSED"
            - "response data.error_id != ERR_INCENTIVE_CAPACITY_EXCEEDED"
            - "IncentiveProgram.${ip_id}.enrollment_state == CLOSED_FULL"
            - "IncentiveProgram.${ip_id}.uncommitted_capacity_cents == 4000000"
            - "IncentiveProgram.${ip_id}.enrolled_count == 1"
            - "IncentiveProgram.${ip_id}.version == ${ip_v1}"

