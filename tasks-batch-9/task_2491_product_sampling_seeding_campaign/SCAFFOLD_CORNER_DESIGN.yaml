          - endpoints[POST /purchase-matches]
          - endpoints[GET /enrollments/{enrollment_id}/purchase-matches]
        distinguishing_aspect: "PurchaseMatch declares common_fields false, so the ingested row exposes no id, no version and no updated_at, and §1.5 offers no endpoint that mutates or re-reads it by id — only the enrollment-scoped list."
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE with one screened non-holdout enrollment."
            - "One purchase match ingested for that enrollment at 2026-08-01T00:00:00Z with match_confidence 0.9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "Immutable Match", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, review_due_days: 21, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
