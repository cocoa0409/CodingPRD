# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2828 Ethanol Plant Operations & Co-Product Marketing
#
# Companion to SCAFFOLD.yaml (§1.0-§1.7) and SCAFFOLD_DIFFICULTY_DESIGN.yaml
# (§1.8, 19 instances across the nine §0.5 difficulty rules).
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by a §1.8
# instance appear as excluded_because stubs that name that instance.
#
# All money is integer cents; all gallons, bushels and tons carry the decimal
# precision declared in §1.1. Every numeric literal below was computed against
# the §1.3 formulas and their constants with Decimal / ROUND_HALF_UP.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: plant_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Plant.fields.base_grind_cap_bushels
          - entities.Plant.fields.coverage_floor_bushels
          - entities.Plant.fields.procurement_posture
          - entities.Plant.fields.daily_grind_cap_bushels
          - calculations.daily_grind_cap
        distinguishing_aspect: |
          Creating the plant with only name and nameplate_capacity_gallons
          applies every declared default and then derives the postures from the
          empty contract book: coverage 0.00 is below the default floor of
          200000, so procurement_posture is SHORT and daily_grind_cap_bushels is
          90000, not the 120000 base cap.
        test_recipe:
          setup:
            - "Empty database; the logical clock is set to 2026-08-15T00:00:00Z before the create so created_at is pinned."
          setup_api_calls:
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id, cap: $.data.daily_grind_cap_bushels, posture: $.data.procurement_posture }
          assert:
            - "HTTP 201 and response_type is object"
            - "Plant.${plant_id}.base_grind_cap_bushels == 120000"
            - "Plant.${plant_id}.coverage_floor_bushels == 200000"
            - "Plant.${plant_id}.baseline_ci_g_per_mj == 60.0 and ci_score_g_per_mj == 60.0"
            - "Plant.${plant_id}.rin_generation_enabled == true"
            - "${posture} == SHORT (an empty contract book covers 0.00 bushels)"
            - "${cap} == 90000 (floor(120000 * 1.00 * 0.75))"
            - "Plant.${plant_id}.compliance_posture == OPEN"
            - "Plant.${plant_id}.corn_inventory_bushels == 0.00, ddgs_inventory_tons == 0.000, corn_oil_inventory_lbs == 0.00"
            - "Plant.${plant_id}.open_contract_coverage_bushels == 0.00"
            - "Plant.${plant_id}.rolling_yield_gal_per_bushel == 2.850"
            - "Plant.${plant_id}.lcfs_credit_tonnes_per_million_gal == 0.000"
            - "Plant.${plant_id}.rin_generated_count == 0, rin_separated_count == 0, rin_retired_count == 0"
            - "Plant.${plant_id}.mark_corn_cents_per_bushel == null and marks_effective_month == null"
            - "Plant.${plant_id}.created_at == 2026-08-15T00:00:00Z and version == 1"

      - name: product_tank_creation_defaults_opening_gallons_and_settling_buffer
        claim_type: defaults
        grounds:
          - entities.ProductTank.fields.opening_gallons
          - entities.ProductTank.fields.settling_buffer_minutes
          - entities.ProductTank.fields.available_gallons
          - calculations.tank_balance
        distinguishing_aspect: |
          Omitting opening_gallons and settling_buffer_minutes yields 0.00 and
          120 respectively, and available_gallons is derived as
          capacity_gallons minus current_gallons — 1000000.00 on an empty tank.
        test_recipe:
          setup:
            - "Plant exists; the clock is 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id, buffer: $.data.settling_buffer_minutes, avail: $.data.available_gallons }
          assert:
            - "HTTP 201"
            - "ProductTank.${t101_id}.opening_gallons == 0.00 and current_gallons == 0.00"
            - "${buffer} == 120"
            - "${avail} == 1000000.00"
            - "ProductTank.${t101_id}.service_status == IN_SERVICE and hold_reason == null and held_at == null"
            - "ProductTank.${t101_id}.version == 1"

      - name: system_fields_are_server_generated_on_loading_track_create
        claim_type: system_fields
        grounds:
          - entities.LoadingTrack.fields.committed_railcars
          - entities.LoadingTrack.fields.loading_rate_cars_per_hour
          - entities.LoadingTrack.fields.is_active
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server:
          created_at equals the logical clock 2026-08-15T00:00:00Z, updated_at
          equals created_at, version is 1, and the omitted
          loading_rate_cars_per_hour and is_active take their declared defaults
          4.0 and true.
        test_recipe:
          setup:
            - "Plant exists; the clock is 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, rate: $.data.loading_rate_cars_per_hour, active: $.data.is_active }
          assert:
            - "HTTP 201 and ${trk_id} is a server-minted identifier the client never supplied"
            - "${rate} == 4.0 and ${active} == true"
            - "LoadingTrack.${trk_id}.committed_railcars == 0"
            - "LoadingTrack.${trk_id}.created_at == 2026-08-15T00:00:00Z and updated_at == 2026-08-15T00:00:00Z"
            - "LoadingTrack.${trk_id}.version == 1"

      - name: corn_contract_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.CornPurchaseContract.fields.basis_cents_per_bushel
          - entities.CornPurchaseContract.fields.bushels_contracted
          - entities.CornPurchaseContract.fields.pricing_status
        distinguishing_aspect: |
          GET /corn-contracts/{id} returns the row exactly as created:
          bushels_contracted 200000.00, basis -18.0, status OPEN,
          pricing_status UNPRICED, bushels_delivered 0.00 and
          futures_price_cents_per_bushel null.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is created for 200000.00 bushels at basis -18.0 for delivery month 2026-10."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /ethanol-ops/corn-contracts/${c1_id}"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { got_id: $.data.id, got_status: $.data.status, got_pricing: $.data.pricing_status }
          assert:
            - "HTTP 200 and ${got_id} == ${c1_id}"
            - "${got_status} == OPEN and ${got_pricing} == UNPRICED"
            - "CornPurchaseContract.${c1_id}.bushels_contracted == 200000.00 and bushels_delivered == 0.00"
            - "CornPurchaseContract.${c1_id}.basis_cents_per_bushel == -18.0"
            - "CornPurchaseContract.${c1_id}.futures_price_cents_per_bushel == null and priced_at == null"
            - "CornPurchaseContract.${c1_id}.rolled_from_contract_id == null"

      - name: corn_contract_listing_paginates_with_envelope_metadata
        claim_type: listing
        grounds:
          - entities.CornPurchaseContract.fields.delivery_month
          - entities.CornPurchaseContract.fields.status
        distinguishing_aspect: |
          Three contracts exist; GET /corn-contracts with limit 2 and offset 0
          returns exactly two rows ordered by created_at ASC with total_count 3
          and has_more true, and offset 2 returns the single remaining row with
          has_more false.
        test_recipe:
          setup:
            - "Plant exists; three contracts C-1, C-2 and C-3 are created in that order, all OPEN."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Mill Creek Farms", delivery_month: "2026-11", bushels_contracted: 150000.00, basis_cents_per_bushel: -12.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c2_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Two Rivers Grain", delivery_month: "2026-11", bushels_contracted: 90000.00, basis_cents_per_bushel: -9.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /ethanol-ops/corn-contracts"
              payload: { limit: 2, offset: 0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { first_id: "$.data[0].id", second_id: "$.data[1].id" }
            - call: "GET /ethanol-ops/corn-contracts"
              payload: { limit: 2, offset: 2, delivery_month: "2026-11" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "The first call returns HTTP 200 with response_type array, exactly 2 rows, meta total_count 3 and has_more true"
            - "${first_id} == ${c1_id} and ${second_id} == ${c2_id} (created_at ASC)"
            - "The second call returns exactly 1 row with has_more false"
            - "${page2_first} == ${c3_id}"
            - "Filtering delivery_month 2026-11 with limit 2 offset 0 would return C-2 and C-3 only"

      - name: corn_contract_not_found_on_foreign_id
        claim_type: not_found
        grounds:
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          Reading a contract by an id that belongs to a different entity type
          (the plant's id) returns ERR_CONTRACT_NOT_FOUND with HTTP 404, not the
          plant row and not a 500.
        test_recipe:
          setup:
            - "Plant exists; no corn contract has been created."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
          trigger:
            - call: "GET /ethanol-ops/corn-contracts/${plant_id}"
              payload: {}
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "${err_id} == ERR_CONTRACT_NOT_FOUND with HTTP 404"
            - "${err_msg} is a non-empty string and response_type is error"

      - name: delivery_create_missing_required_gross_weight_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - entities.CornDelivery.fields.gross_weight_lbs
        distinguishing_aspect: |
          POST /corn-contracts/{id}/deliveries without gross_weight_lbs is
          rejected with ERR_VALIDATION 400 and no CornDelivery row is created,
          so the contract's delivery sub-collection stays empty.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is OPEN and UNPRICED."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP 400"
            - "GET /ethanol-ops/corn-contracts/${c1_id}/deliveries returns 0 rows"
            - "CornPurchaseContract.${c1_id}.version == 1 (unchanged)"

      - name: delivery_create_extra_field_net_dry_bushels_rejected
        claim_type: computed_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - entities.CornDelivery.fields.net_dry_bushels
        distinguishing_aspect: |
          net_dry_bushels is computed, so the create contract does not accept it:
          §1.4 priority 4 rejects unknown fields outright with ERR_VALIDATION
          400 rather than silently ignoring the client's 9999.00.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is OPEN and UNPRICED."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00, net_dry_bushels: 9999.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP 400"
            - "GET /ethanol-ops/corn-contracts/${c1_id}/deliveries returns 0 rows"

      - name: product_tank_unknown_product_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - entities.ProductTank.fields.product_type
        distinguishing_aspect: |
          product_type admits only ETHANOL_200_PROOF, DENATURANT and
          DENATURED_E100; GASOLINE is rejected with ERR_VALIDATION 400 and no
          tank is created.
        test_recipe:
          setup:
            - "Plant exists; no tank has been created."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-999", product_type: "GASOLINE", capacity_gallons: 1000000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_VALIDATION with HTTP 400"
            - "No ProductTank with tank_code T-999 exists afterwards"

      - name: fermentation_health_reading_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.FermentationHealthReading.fields.reading_score
          - entities.FermentationHealthReading.fields.batch_id
          - calculations.fermentation_health_index
        distinguishing_aspect: |
          FermentationHealthReading is declared common_fields false: the created
          row carries id, created_at, batch_id, the three readings and
          reading_score 100.00 and nothing else — no version, no updated_at —
          and §1.5 declares no endpoint that mutates or deletes it.
        test_recipe:
          setup:
            - "Plant exists with 940.00 bushels of settled corn; tank T-101 is an ETHANOL_200_PROOF tank; batch FB-1 is charged with 900.00 bushels."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-1", corn_bushels_charged: 900.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 12, lactic_acid_ppm: 400, acetic_acid_ppm: 150, temperature_c: 32.0 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { r1_id: $.data.id, r1_batch: $.data.batch_id, r1_score: $.data.reading_score }
          assert:
            - "HTTP 201 and ${r1_batch} == ${b1_id}"
            - "${r1_score} == 100.00"
            - "The response body has no version key and no updated_at key"
            - "GET /ethanol-ops/fermentation-batches/${b1_id}/health-readings returns exactly 1 row whose id == ${r1_id}"
            - "§1.5 declares no PATCH, PUT or DELETE on FermentationHealthReading"

      - name: delivery_create_requires_existing_parent_contract
        claim_type: parent_relationships
        grounds:
          - errors[ERR_CONTRACT_NOT_FOUND]
          - entities.CornDelivery.fields.contract_id
        distinguishing_aspect: |
          The delivery's contract_id comes from the path, so posting a ticket
          under a non-contract id (the plant's) returns ERR_CONTRACT_NOT_FOUND
          404 before any shape or business check runs, and no orphan delivery is
          created.
        test_recipe:
          setup:
            - "Plant exists; no corn contract has been created."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${plant_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CONTRACT_NOT_FOUND with HTTP 404"
            - "GET /ethanol-ops/corn-contracts returns 0 rows"

      - name: rin_batch_junction_links_fermentation_batch_and_shipment
        claim_type: graph
        grounds:
          - entities.RinBatch.fields.fermentation_batch_id
          - entities.RinBatch.fields.separated_shipment_id
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / rin_retire_requires_separating_shipment_invoiced
          rationale: "That instance discovers the RinBatch through GET /ethanol-ops/rin-batches?separated_shipment_id=... and asserts both foreign keys plus the SEPARATED linkage, which is exactly this graph-topology claim."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: contract_starts_in_open_and_unpriced
        claim_type: initial_state
        grounds:
          - state_machines.CornPurchaseContract.status.initial_state
          - state_machines.CornPurchaseContract.pricing_status.initial_state
        distinguishing_aspect: |
          A freshly created contract occupies the initial state of both
          dimensions at once — status OPEN and pricing_status UNPRICED — with
          bushels_delivered 0.00 and priced_at null.
        test_recipe:
          setup:
            - "Plant exists; the clock is 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
          trigger:
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id, st: $.data.status, ps: $.data.pricing_status }
          assert:
            - "HTTP 201, ${st} == OPEN and ${ps} == UNPRICED"
            - "CornPurchaseContract.${c1_id}.bushels_delivered == 0.00 and priced_at == null"
            - "Plant.${plant_id}.open_contract_coverage_bushels == 200000.00 after the create"

      - name: contract_price_moves_pricing_status_to_priced_and_stamps_priced_at
        claim_type: valid_transition
        grounds:
          - state_machines.CornPurchaseContract.pricing_status.transitions[UNPRICED->PRICED]
          - endpoints[POST /ethanol-ops/corn-contracts/{id}/price]
        distinguishing_aspect: |
          Fixing the futures leg flips only the pricing dimension: pricing_status
          becomes PRICED, futures_price_cents_per_bushel is stored as 458.0 and
          priced_at is stamped with the logical clock, while status stays OPEN.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is OPEN and UNPRICED; the clock is 2026-09-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { ps: $.data.pricing_status, st: $.data.status, pat: $.data.priced_at, ver: $.data.version }
          assert:
            - "HTTP 200, ${ps} == PRICED and ${st} == OPEN"
            - "CornPurchaseContract.${c1_id}.futures_price_cents_per_bushel == 458.0"
            - "${pat} == 2026-09-02T00:00:00Z"
            - "${ver} == 2"

      - name: contract_second_price_call_rejected_as_already_priced
        claim_type: idempotency
        grounds:
          - errors[ERR_CONTRACT_ALREADY_PRICED]
          - validations[priority=24]
        distinguishing_aspect: |
          Pricing is a one-shot: replaying the same price call returns
          ERR_CONTRACT_ALREADY_PRICED 409 — priority 24, not the generic
          ERR_INVALID_CONTRACT_STATE at 23 — and the stored price stays 458.0.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 has been priced once at 458.0."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
          trigger:
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 470.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_CONTRACT_ALREADY_PRICED with HTTP 409"
            - "CornPurchaseContract.${c1_id}.futures_price_cents_per_bushel == 458.0 (not 470.0)"
            - "CornPurchaseContract.${c1_id}.version == 2 (the failed call did not write)"

      - name: grade_auto_rejects_the_load_when_aflatoxin_is_over_the_limit
        claim_type: valid_transition
        grounds:
          - state_machines.CornDelivery.grading_status.transitions[PENDING_GRADE->REJECTED]
          - entities.CornDelivery.fields.rejection_reason
          - calculations.corn_delivery_settlement
        distinguishing_aspect: |
          Auto-rejection is a successful grading call, not an error: 25 ppb of
          aflatoxin (limit 20) returns HTTP 200 with grading_status REJECTED and
          rejection_reason AFLATOXIN_OVER_LIMIT, while aflatoxin is tested
          before moisture so a load that fails both still reports the aflatoxin
          reason, and no settlement figures are computed.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is PRICED; delivery TK-0001 is PENDING_GRADE."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 22.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 25 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { gs: $.data.grading_status, rr: $.data.rejection_reason, sac: $.data.settlement_amount_cents }
          assert:
            - "HTTP 200 (not an error response) and ${gs} == REJECTED"
            - "${rr} == AFLATOXIN_OVER_LIMIT even though moisture 22.00 also breaches MOISTURE_REJECT_PCT 20.00"
            - "${sac} == null and CornDelivery.${d1_id}.net_dry_bushels == null"
            - "CornDelivery.${d1_id}.graded_by_user_id == scale-01"
            - "CornPurchaseContract.${c1_id}.bushels_delivered == 0.00"
            - "Plant.${plant_id}.corn_inventory_bushels == 0.00"

      - name: settle_on_a_rejected_delivery_is_locked_out
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CornDelivery.grading_status.terminal_states
          - errors[ERR_INVALID_DELIVERY_STATE]
          - validations[priority=25]
        distinguishing_aspect: |
          REJECTED is terminal on the grading dimension, so neither a re-grade
          nor a settlement is admitted: the settle call returns
          ERR_INVALID_DELIVERY_STATE 409 and the row keeps its rejection.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is PRICED; delivery TK-0001 was auto-rejected at 25 ppb aflatoxin."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 25 }
              as: ScaleOperator
              as_user_id: "scale-01"
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_DELIVERY_STATE with HTTP 409"
            - "CornDelivery.${d1_id}.grading_status == REJECTED and settled_at == null"
            - "Plant.${plant_id}.corn_inventory_bushels == 0.00"

      - name: dump_from_charged_forfeits_the_corn_without_producing_ethanol
        claim_type: side_effect_execution
        grounds:
          - state_machines.FermentationBatch.status.transitions[CHARGED->DUMPED]
          - calculations.plant_inventory_and_coverage
          - endpoints[POST /ethanol-ops/fermentation-batches/{id}/dump]
        distinguishing_aspect: |
          Dumping is not a reversal: corn_inventory_bushels stays at 40.00
          because plant_inventory_and_coverage subtracts charges in every
          status including DUMPED, the destination tank never receives gallons,
          and ethanol_gallons_produced stays 0.00.
        test_recipe:
          setup:
            - "Plant exists with 940.00 settled bushels; tank T-101 is IN_SERVICE with 0.00 gallons; batch FB-1 is CHARGED with 900.00 bushels."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-1", corn_bushels_charged: 900.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/dump"
              payload: { dump_reason: "Stuck fermentation after chiller failure" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { st: $.data.status, dat: $.data.dumped_at, eth: $.data.ethanol_gallons_produced }
          assert:
            - "HTTP 200, ${st} == DUMPED and ${dat} == 2026-09-01T00:00:00Z"
            - "${eth} == 0.00 and FermentationBatch.${b1_id}.ddgs_tons_produced == 0.000"
            - "FermentationBatch.${b1_id}.dump_reason == Stuck fermentation after chiller failure"
            - "Plant.${plant_id}.corn_inventory_bushels == 40.00 (940.00 settled minus the 900.00 forfeited charge)"
            - "ProductTank.${t101_id}.current_gallons == 0.00 and available_gallons == 1000000.00"
            - "Plant.${plant_id}.rin_generated_count == 0 and no RinBatch exists"

      - name: complete_before_distill_rejected_as_invalid_batch_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.FermentationBatch.status.transitions[DISTILLING->COMPLETED]
          - errors[ERR_INVALID_BATCH_STATE]
          - validations[priority=26]
        distinguishing_aspect: |
          COMPLETED is reachable only from DISTILLING: calling complete on a
          batch that is still FERMENTING returns ERR_INVALID_BATCH_STATE 409, no
          gallons land in the tank and no RIN batch is minted.
        test_recipe:
          setup:
            - "Plant exists with 940.00 settled bushels; batch FB-1 is FERMENTING after one healthy reading; tank T-101 holds 0.00 gallons."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 3 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-1", corn_bushels_charged: 900.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 12, lactic_acid_ppm: 400, acetic_acid_ppm: 150, temperature_c: 32.0 }
              as: ProcessOperator
              as_user_id: "op-01"
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/complete"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INVALID_BATCH_STATE with HTTP 409"
            - "FermentationBatch.${b1_id}.status == FERMENTING and completed_at == null"
            - "ProductTank.${t101_id}.current_gallons == 0.00"
            - "GET /ethanol-ops/rin-batches returns 0 rows"

      - name: mechanical_hold_takes_the_tank_out_of_service_and_release_restores_it
        claim_type: valid_transition
        grounds:
          - state_machines.ProductTank.service_status.transitions[IN_SERVICE->OUT_OF_SERVICE]
          - state_machines.ProductTank.service_status.transitions[OUT_OF_SERVICE->IN_SERVICE]
          - endpoints[POST /ethanol-ops/product-tanks/{id}/hold]
        distinguishing_aspect: |
          The hold_reason selects the target state: MECHANICAL sends the tank to
          OUT_OF_SERVICE (OFF_SPEC would send it to ON_HOLD), held_at is stamped,
          and the single release endpoint returns it to IN_SERVICE from either
          hold state while clearing hold_reason and held_at.
        test_recipe:
          setup:
            - "Plant exists; tank T-101 is IN_SERVICE; the clock is 2026-09-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
          trigger:
            - call: "POST /ethanol-ops/product-tanks/${t101_id}/hold"
              payload: { hold_reason: "MECHANICAL" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { ss: $.data.service_status, hr: $.data.hold_reason, hat: $.data.held_at, v2: $.data.version }
            - call: "POST /ethanol-ops/product-tanks/${t101_id}/release"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { ss2: $.data.service_status, hr2: $.data.hold_reason, hat2: $.data.held_at, v3: $.data.version }
          assert:
            - "${ss} == OUT_OF_SERVICE, ${hr} == MECHANICAL, ${hat} == 2026-09-03T00:00:00Z, ${v2} == 2"
            - "${ss2} == IN_SERVICE, ${hr2} == null, ${hat2} == null, ${v3} == 3"
            - "Plant.${plant_id}.compliance_posture == OPEN throughout (a MECHANICAL hold contributes nothing to the posture)"

      - name: off_spec_hold_blocks_the_shipment_and_release_reschedules_it
        claim_type: conditional_cascade
        grounds:
          - state_machines.UnitTrainShipment.loading_status.transitions[SCHEDULED->BLOCKED]
          - state_machines.UnitTrainShipment.loading_status.transitions[BLOCKED->SCHEDULED]
          - calculations.plant_compliance_posture
        distinguishing_aspect: |
          An OFF_SPEC hold on the source tank blocks the shipment without
          releasing its railcars — committed_railcars stays 100 — and lifts the
          plant to RESTRICTED; the release reverses exactly that, returning the
          shipment to SCHEDULED and the plant to OPEN, and the billing dimension
          never moves off PENDING_BOL.
        test_recipe:
          setup:
            - "Plant exists; DENATURED_E100 tank T-301 opens with 400000.00 gallons; track TRK-A has spot capacity 110; shipment SH-1 is SCHEDULED for 100 railcars."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "SH-1", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T18:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id, planned: $.data.planned_gallons }
          trigger:
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/hold"
              payload: { hold_reason: "OFF_SPEC" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { ss: $.data.service_status }
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/release"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { ss2: $.data.service_status }
          assert:
            - "${planned} == 265900.00 (100 * 2659.00)"
            - "${ss} == ON_HOLD and, after the hold, UnitTrainShipment.${sh1_id}.loading_status == BLOCKED"
            - "UnitTrainShipment.${sh1_id}.billing_status == PENDING_BOL after the hold"
            - "LoadingTrack.${trk_id}.committed_railcars == 100 after the hold (an OFF_SPEC block does not release railcars)"
            - "Plant.${plant_id}.compliance_posture == RESTRICTED while the tank is ON_HOLD"
            - "${ss2} == IN_SERVICE and UnitTrainShipment.${sh1_id}.loading_status == SCHEDULED again"
            - "Plant.${plant_id}.compliance_posture == OPEN after the release"

      - name: mechanical_hold_cancels_the_scheduled_blend
        claim_type: cross_entity_side_effect
        grounds:
          - state_machines.DenaturantBlend.status.transitions[SCHEDULED->CANCELLED]
          - endpoints[POST /ethanol-ops/product-tanks/{id}/hold]
        distinguishing_aspect: |
          The cascade fires from any of the blend's three tanks: a MECHANICAL
          hold on the neat source cancels the SCHEDULED blend, stamps
          cancelled_at, and leaves every tank balance untouched because the
          blend never executed.
        test_recipe:
          setup:
            - "Plant exists; T-101 (ETHANOL_200_PROOF) opens with 500000.00 gallons, T-201 (DENATURANT) with 500000.00, T-301 (DENATURED_E100) with 0.00; blend BL-1 is SCHEDULED."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 1000000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id, t301_v: $.data.version }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-1", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v}", neat_gallons: 2565.00, denaturant_gallons: 60.00, window_start: "2026-09-04T06:00:00Z", window_end: "2026-09-04T10:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id, bl_status: $.data.status }
          trigger:
            - call: "POST /ethanol-ops/product-tanks/${t101_id}/hold"
              payload: { hold_reason: "MECHANICAL" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { ss: $.data.service_status }
          assert:
            - "${bl_status} == SCHEDULED before the hold"
            - "${ss} == OUT_OF_SERVICE"
            - "DenaturantBlend.${bl1_id}.status == CANCELLED and cancelled_at == 2026-09-03T00:00:00Z"
            - "DenaturantBlend.${bl1_id}.output_gallons == null and denaturant_pct == null"
            - "ProductTank.${t101_id}.current_gallons == 500000.00, ProductTank.${t201_id}.current_gallons == 500000.00, ProductTank.${t301_id}.current_gallons == 0.00"
            - "A subsequent POST /ethanol-ops/denaturant-blends/${bl1_id}/execute returns ERR_INVALID_BLEND_STATE 409"

      - name: declined_sale_cannot_be_shipped
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CoProductSale.status.terminal_states
          - errors[ERR_INVALID_SALE_STATE]
          - validations[priority=32]
        distinguishing_aspect: |
          DECLINED is terminal: shipping a declined quote returns
          ERR_INVALID_SALE_STATE 409, no co-product inventory moves, and a
          second respond call is refused with the same error.
        test_recipe:
          setup:
            - "Plant exists; sale SL-1 is a FLAT DDGS_DRY quote for 5.000 tons that the buyer declined."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/co-product-sales"
              payload: { sale_code: "SL-1", buyer_name: "Midwest Feeders", product: "DDGS_DRY", pricing_basis: "FLAT", quantity: 5.000, quoted_price: 210.00, quote_expires_at: "2026-09-10T00:00:00Z" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { sl1_id: $.data.id }
            - call: "POST /ethanol-ops/co-product-sales/${sl1_id}/respond"
              payload: { decision: "DECLINE" }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { st: $.data.status }
          trigger:
            - call: "POST /ethanol-ops/co-product-sales/${sl1_id}/ship"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${st} == DECLINED with responded_at 2026-09-03T00:00:00Z"
            - "${err_id} == ERR_INVALID_SALE_STATE with HTTP 409"
            - "CoProductSale.${sl1_id}.status == DECLINED and shipped_at == null"
            - "CoProductSale.${sl1_id}.settlement_price == null and invoice_amount_cents == null"
            - "Plant.${plant_id}.ddgs_inventory_tons == 0.000"

      - name: resolve_deviation_on_a_compliant_condition_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PermitCondition.status.transitions[EXCEEDANCE->COMPLIANT]
          - errors[ERR_CONDITION_NOT_IN_EXCEEDANCE]
          - validations[priority=36]
        distinguishing_aspect: |
          A condition that has never exceeded has no deviation to close: the
          resolve call returns ERR_CONDITION_NOT_IN_EXCEEDANCE 409 and
          resolution_note stays null even though the request supplied one.
        test_recipe:
          setup:
            - "Plant exists; permit condition VOC-1 is COMPLIANT with no readings."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/permit-conditions"
              payload: { condition_code: "VOC-1", permit_type: "AIR_EMISSIONS", parameter_name: "VOC", limit_value: 12.500, unit: "lb/hr", averaging_period_hours: 24, severity: "MINOR" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { pc1_id: $.data.id, st: $.data.status, rav: $.data.rolling_average_value }
          trigger:
            - call: "POST /ethanol-ops/permit-conditions/${pc1_id}/resolve-deviation"
              payload: { resolution_note: "Scrubber tuned" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${st} == COMPLIANT and ${rav} == null on creation, with readings_in_window 0 and exceedance_count 0"
            - "${err_id} == ERR_CONDITION_NOT_IN_EXCEEDANCE with HTTP 409"
            - "PermitCondition.${pc1_id}.resolution_note == null and version == 1"
            - "Plant.${plant_id}.compliance_posture == OPEN"

      - name: hedge_partial_close_then_full_close_walks_the_position_to_closed
        claim_type: valid_transition
        grounds:
          - state_machines.HedgePosition.status.transitions[OPEN->PARTIALLY_CLOSED]
          - state_machines.HedgePosition.status.transitions[PARTIALLY_CLOSED->CLOSED]
          - calculations.hedge_pnl
        distinguishing_aspect: |
          Realized P&L accumulates across closes while unrealized shrinks with
          the open lots: a SHORT of 10 ethanol lots entered at 182.00 against a
          178.00 mark shows 1160000 unrealized, then 797500 realized with 580000
          unrealized after 5 lots are closed at 176.50, then 1595000 realized
          with 0 unrealized when the last 5 go — and the terminal CLOSED state
          refuses any further close with ERR_INVALID_POSITION_STATE.
        test_recipe:
          setup:
            - "Plant exists with all five market marks posted for 2026-10, ethanol at 178.00 cents per gallon; position HP-1 is a SHORT of 10 ETHANOL lots at 182.00."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/plants/${plant_id}/market-marks"
              payload: { marks_effective_month: "2026-10", mark_corn_cents_per_bushel: 440.0, mark_ethanol_cents_per_gallon: 178.00, mark_natgas_cents_per_mmbtu: 320.0, mark_soybean_meal_usd_per_ton: 330.00, mark_sbo_cents_per_lb: 48.00 }
              as: RiskManager
              as_user_id: "risk-01"
            - call: "POST /ethanol-ops/hedge-positions"
              payload: { position_code: "HP-1", commodity: "ETHANOL", direction: "SHORT", contracts: 10, entry_price: 182.00, contract_month: "2026-10" }
              as: RiskManager
              as_user_id: "risk-01"
              captures: { hp1_id: $.data.id, us: $.data.unit_size, unreal0: $.data.unrealized_pnl_cents }
          trigger:
            - call: "POST /ethanol-ops/hedge-positions/${hp1_id}/close"
              payload: { contracts_to_close: 5, exit_price: 176.50 }
              as: RiskManager
              as_user_id: "risk-01"
              captures: { st1: $.data.status, real1: $.data.realized_pnl_cents, unreal1: $.data.unrealized_pnl_cents, open1: $.data.contracts_open }
            - call: "POST /ethanol-ops/hedge-positions/${hp1_id}/close"
              payload: { contracts_to_close: 5, exit_price: 176.50 }
              as: RiskManager
              as_user_id: "risk-01"
              captures: { st2: $.data.status, real2: $.data.realized_pnl_cents, unreal2: $.data.unrealized_pnl_cents, open2: $.data.contracts_open, cat: $.data.closed_at }
          assert:
            - "${us} == 29000 and ${unreal0} == 1160000 ((182.00 - 178.00) * 10 * 29000)"
            - "${st1} == PARTIALLY_CLOSED, ${real1} == 797500, ${unreal1} == 580000, ${open1} == 5"
            - "${st2} == CLOSED, ${real2} == 1595000, ${unreal2} == 0, ${open2} == 0"
            - "HedgePosition.${hp1_id}.contracts_closed == 10 and ${cat} is non-null"
            - "A third close of 1 lot returns ERR_INVALID_POSITION_STATE 409"

      - name: shipment_parallel_dimensions_move_independently
        claim_type: parallel_state_dimensions
        excluded_because:
          difficulty_instance: non_linear_state_machine / shipment_billing_dimension_blocks_cancel_after_invoice_while_loading_dimension_unchanged
          rationale: "That instance drives loading_status and billing_status apart and asserts that an INVOICED billing dimension blocks cancellation while the loading dimension stays LOADED, which is the parallel-shape claim in full."

      - name: health_watch_cycle_terminates_at_the_intervention_limit
        claim_type: cyclic_loop_bound
        excluded_because:
          difficulty_instance: non_linear_state_machine / fermentation_health_watch_intervention_cycle_third_intervention_blocked
          rationale: "That instance walks FERMENTING -> HEALTH_WATCH -> FERMENTING twice and asserts the third intervention is refused with ERR_INTERVENTION_LIMIT_REACHED, covering both the cycle and its termination condition."

      - name: shipment_cancellation_compensates_every_original_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: compensating_invariant / shipment_cancel_restores_total_denatured_gallons_invariant
          rationale: "That instance reconciles the tank ledger and the railcar commitment before and after a cancellation, which is exactly the compensation side-effect-pattern claim."

  # ===========================================================================
  - section: calculations
    instances:

      - name: settlement_stacks_all_four_discount_components_on_a_unit_train_load
        claim_type: correct_result
        grounds:
          - calculations.corn_delivery_settlement
          - entities.CornDelivery.fields.discount_cents_per_bushel
          - entities.CornDelivery.fields.settlement_amount_cents
        distinguishing_aspect: |
          A 5,500,000 lb load on a 300,000 lb tare with moisture 16.50, test
          weight 53.2, foreign material 3.40 and damage 6.00 exercises all four
          discount ladders at once and the moisture shrink: 92857.14 wet bushels
          shrink to 91218.48 dry, the discounts are 12.00 / 2.80 / 6.00 / 8.00 =
          28.80, the net price is 411.20 and the settlement is 37509039 cents.
          Applying the discounts to the wet bushels, or shrinking after pricing,
          gives a different number.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is PRICED at futures 458.0 with basis -18.0; the load is booked and graded but not yet settled."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-BIG", gross_weight_lbs: 5500000, tare_weight_lbs: 300000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 16.50, test_weight_lb_per_bu: 53.2, foreign_material_pct: 3.40, damaged_kernels_pct: 6.00, aflatoxin_ppb: 8 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { gw: $.data.gross_wet_bushels, nd: $.data.net_dry_bushels, md: $.data.moisture_discount_cents, td: $.data.test_weight_discount_cents, fd: $.data.foreign_material_discount_cents, dd: $.data.damage_discount_cents }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { disc: $.data.discount_cents_per_bushel, np: $.data.net_price_cents_per_bushel, amt: $.data.settlement_amount_cents }
          assert:
            - "${gw} == 92857.14 and ${nd} == 91218.48"
            - "${md} == 12.00 (2 steps of 0.50% over 15.00% at 4.0 cents)"
            - "${td} == 2.80 (8 tenths under 54.0 at 0.35 cents)"
            - "${fd} == 6.00 (40 hundredths over 3.00% at 0.15 cents)"
            - "${dd} == 8.00 (100 hundredths over 5.00% at 0.08 cents)"
            - "${disc} == 28.80 and ${np} == 411.20"
            - "${amt} == 37509039"
            - "CornPurchaseContract.${c1_id}.bushels_delivered == 91218.48 and status == PARTIALLY_FILLED"
            - "Plant.${plant_id}.corn_inventory_bushels == 91218.48"

      - name: moisture_discount_ceils_at_the_half_percent_step_boundary
        claim_type: precision
        grounds:
          - calculations.corn_delivery_settlement.constants.MOISTURE_STEP_PCT
          - calculations.corn_delivery_settlement.constants.MOISTURE_RATE_CENTS
        distinguishing_aspect: |
          The step count is a ceiling over integer hundredths: moisture 15.50
          is exactly one step (4.00 cents, settlement 407429) while 15.51 rolls
          into the second step (8.00 cents, settlement 403644). Truncating or
          rounding the step count instead of ceiling it leaves 15.51 at 4.00
          cents, and the dry-bushel figures 934.47 versus 934.36 move too.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is PRICED at 458.0 with basis -18.0; two 78640/26000 lb loads are booked, TK-A and TK-B."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-A", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { da_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-B", gross_weight_lbs: 78640, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { db_id: $.data.id }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${da_id}/grade"
              payload: { moisture_pct: 15.50, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 4 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { nda: $.data.net_dry_bushels, mda: $.data.moisture_discount_cents, npa: $.data.net_price_cents_per_bushel }
            - call: "POST /ethanol-ops/corn-deliveries/${db_id}/grade"
              payload: { moisture_pct: 15.51, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 4 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { ndb: $.data.net_dry_bushels, mdb: $.data.moisture_discount_cents, npb: $.data.net_price_cents_per_bushel }
            - call: "POST /ethanol-ops/corn-deliveries/${da_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { amta: $.data.settlement_amount_cents }
            - call: "POST /ethanol-ops/corn-deliveries/${db_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
              captures: { amtb: $.data.settlement_amount_cents }
          assert:
            - "Both loads have gross_wet_bushels 940.00"
            - "${nda} == 934.47, ${mda} == 4.00, ${npa} == 436.00, ${amta} == 407429"
            - "${ndb} == 934.36, ${mdb} == 8.00, ${npb} == 432.00, ${amtb} == 403644"
            - "The 0.01 point of extra moisture costs 3785 cents on an otherwise identical load"
            - "Plant.${plant_id}.corn_inventory_bushels == 1868.83 after both settlements"

      - name: rolling_yield_counts_only_completed_batches
        claim_type: input_set_filtering
        grounds:
          - calculations.plant_inventory_and_coverage
          - calculations.batch_yield
          - entities.Plant.fields.rolling_yield_gal_per_bushel
        distinguishing_aspect: |
          A batch under way contributes nothing: while FB-1 is DISTILLING the
          plant still reports the DEFAULT_ROLLING_YIELD 2.850, and only on
          completion does the ratio become 2592.00 / 900.00 == 2.880 — the
          starch bonus of 0.030 earned by the 56.0 lb charge test weight.
        test_recipe:
          setup:
            - "Plant exists with 1500.00 settled bushels; tank T-101 is IN_SERVICE and empty; batch FB-1 is charged with 900.00 bushels at 56.0 lb/bu and one healthy reading has moved it to FERMENTING."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
