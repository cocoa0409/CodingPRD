  - rule_id: cross_entity_state_dependency
    instances:
      - name: beta_build_blocked_until_predecessor_milestone_is_accepted
        grounds:
          - validations[priority=47]
          - errors.ERR_DEPENDENCY_NOT_ACCEPTED
          - state_machines.Milestone.IN_DEVELOPMENT_to_UNDER_REVIEW
          - state_machines.Milestone.DEFINED_to_IN_DEVELOPMENT
          - entities.Milestone.fields.depends_on_milestone_id
        distinguishing_aspect: |
          The identical, gate-passing BETA build payload on M2 is refused with 409
          ERR_DEPENDENCY_NOT_ACCEPTED while M1 is merely UNDER_REVIEW and accepted with 201 once M1
          reaches ACCEPTED: admissibility depends on a DIFFERENT entity's state, not on the build or
          on M2's own fields. Because the payload clears the BETA gate, the failure cannot be
          confused with priority 46, and because M2 is DEFINED (a build-open state) it cannot be
          confused with priority 31.
        test_recipe:
          setup:
            - "Agreement Aurora Drift with the canonical three milestones, advance_total_cents 12000000, ACTIVE; M1 is IN_DEVELOPMENT and M2/M3 are DEFINED."
            - "M1 build 1 (75.00 / 96.00 / 60.00 / 5) is filed first so M1 sits in UNDER_REVIEW, not yet ACCEPTED."
            - "The M2 payload 95.00 / 98.50 / 85.00 / 2 clears the BETA gate outright (crash surplus even relaxes the feature bar to 88.00)."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
