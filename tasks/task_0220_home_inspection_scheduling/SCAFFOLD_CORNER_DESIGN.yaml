        claim_type: violation_to_error
        grounds:
          - errors[ERR_VALIDATION_RANGE]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /inspection-orders?limit=500 (above max 100) returns ERR_VALIDATION_RANGE 400."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /inspection-orders"
              payload: { limit: 500 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_VALIDATION_RANGE"
