            - "after trigger call 1: AdvertisedItem.${item_id}.claim_review_status == CLAIM_PENDING, claim_reviewer_user_id == null and status == DRAFT"
            - "trigger call 2 returns HTTP 200 with AdvertisedItem.${item_id}.claim_review_status == CLAIM_CLEARED"
            - "AdvertisedItem.${item_id}.cool_reviewer_user_id == \"officer-cool-1\" and claim_reviewer_user_id == \"officer-claim-2\""
            - "AdvertisedItem.${item_id}.status == APPROVED (the join fired once both dimensions cleared)"

      - name: label_withdrawal_is_shared_by_manager_and_compliance_officer
