            - "the second call returns HTTP 403 and ${e_waive} == \"ERR_WAIVE_NOT_PERMITTED\" with RejectionError.${blk_id}.state still OPEN"
            - "the third call returns HTTP 200: RejectionError.${blk_id}.state == WAIVED and resolved_by_user_id == \"admin_1\""
            - "RetailerListing.${lb_id}.open_blocking_error_count == 0"
            - "RetailerListing.${lb_id}.syndication_state == NOT_SYNDICATED"
            - "RetailerListing.${lb_id}.readiness_score == 51.00"
            - "Product.${pb_id}.shelf_health_index == 0.00   # the listing left the qualifying set"

