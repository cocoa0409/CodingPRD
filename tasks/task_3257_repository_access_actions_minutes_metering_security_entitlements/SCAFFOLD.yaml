# =============================================================================
# task_3257 — Repository Access, Actions Minutes Metering & Security Entitlements
# =============================================================================

scenario: |
  Repository Access, Actions Minutes Metering & Security Entitlements (GitHub): organization and enterprise account structures with repository visibility, team permissions and outside collaborator limits, seat licensing by active committer with automatic seat consumption and reclamation, continuous integration minutes metering by runner type and operating system with multipliers and included allowances, self-hosted runner registration with security boundaries for public repository workflows, package and artifact storage billing with retention policies, advanced security entitlements for secret scanning, code scanning and dependency review with per-committer pricing, single sign-on enforcement, personal access token policies and audit log streaming, marketplace application installation with permission scopes

domain_name: repo-access-minutes-metering
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Enterprise
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Enterprise display name" }
      - { name: purchased_seats, type: integer, source: input, description: "Total seat licenses purchased" }
      - { name: used_seats, type: integer, source: computed, default: 0, description: "Seats currently consumed by active committers and members" }
      - { name: available_seats, type: integer, source: computed, description: "Read-only = purchased_seats - used_seats; kept consistent on every seat consume/reclaim" }
      - { name: sso_enforcement, type: enum, source: system, default: "DISABLED", description: "DISABLED → CONFIGURING → ENFORCED; ENFORCED → SUSPENDED → ENFORCED cycle allowed" }
      - { name: pat_policy, type: enum, source: input, default: "UNRESTRICTED", description: "UNRESTRICTED | ADMIN_APPROVAL_REQUIRED | DISALLOWED — governs PersonalAccessToken creation" }
      - { name: audit_log_stream_status, type: enum, source: system, default: "INACTIVE", description: "INACTIVE → STREAMING → PAUSED → STREAMING; stream health posture" }
      - { name: billing_cycle_anchor_day, type: integer, source: input, default: 1, description: "Day of month (1-28) when the billing cycle resets minutes/storage counters" }

  - name: Organization
    parent: Enterprise
    common_fields: true
    fields:
      - { name: enterprise_id, type: string, source: system, description: "Reference to Enterprise.id; owning enterprise" }
      - { name: login, type: string, source: input, description: "Organization handle, unique within enterprise" }
      - { name: plan_tier, type: enum, source: input, default: "TEAM", description: "FREE | TEAM | ENTERPRISE — gates advanced security purchase and included allowances" }
      - { name: included_actions_minutes, type: integer, source: computed, description: "Monthly included CI minutes by plan_tier: FREE=500, TEAM=3000, ENTERPRISE=50000" }
      - { name: included_storage_gb, type: integer, source: computed, description: "Monthly included storage GB by plan_tier: FREE=0.5→stored as 500 MB units, TEAM=2, ENTERPRISE=50 (stored in GB)" }
      - { name: consumed_actions_minutes, type: number, source: computed, default: 0, description: "Multiplier-weighted minutes consumed this billing cycle" }
      - { name: consumed_storage_gb, type: number, source: computed, default: 0, description: "Storage GB currently retained across non-expired artifacts" }
      - { name: outside_collaborator_limit, type: integer, source: computed, description: "Max outside collaborators: FREE=10, TEAM=100, ENTERPRISE=1000" }
      - { name: retention_freeze_windows, type: array, source: input, default: [], description: "List of {start, end} ISO-8601 windows during which new artifact retention windows may not overlap; set at creation, immutable" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED → ACTIVE (cyclic); terminal ARCHIVED" }

  - name: UserAccount
    parent: null
    common_fields: true
    fields:
      - { name: login, type: string, source: input, description: "Globally unique user handle" }
      - { name: email, type: string, source: input, description: "User email" }
      - { name: is_active_committer, type: boolean, source: computed, default: false, description: "True iff user authored at least one CommitEvent within the trailing 90-day window ending at the logical clock" }
      - { name: seat_held_enterprise_id, type: string, source: computed, description: "Reference to Enterprise.id; enterprise currently holding this user's seat, null when seat-free" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED → ACTIVE" }

  - name: CommitEvent
    parent: null
    common_fields: false
    fields:
      - { name: author_user_id, type: string, source: input, description: "Reference to UserAccount.id; commit author" }
      - { name: organization_id, type: string, source: input, description: "Reference to Organization.id; org whose repository received the commit" }
      - { name: committed_at, type: datetime, source: input, description: "Commit timestamp; drives the 90-day active-committer window" }

  - name: Team
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "FK -> Organization.id" }
      - { name: name, type: string, source: input, description: "Team name, unique within organization" }
      - { name: parent_team_id, type: string, source: input, description: "Reference to Team.id; optional parent team for nested permission inheritance" }

  - name: TeamMembership
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "Reference to Team.id" }
      - { name: user_id, type: string, source: input, description: "Reference to UserAccount.id" }
      - { name: role, type: enum, source: input, default: "MEMBER", description: "MEMBER | MAINTAINER" }

  - name: Repository
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id" }
      - { name: name, type: string, source: input, description: "Repository name, unique within organization" }
      - { name: visibility, type: enum, source: input, default: "PRIVATE", description: "PRIVATE | INTERNAL | PUBLIC; visibility transitions gated by SSO and plan" }
      - { name: advanced_security_enabled, type: boolean, source: system, default: false, description: "True when a SecurityEntitlement in ACTIVE state covers this repository" }
      - { name: status, type: enum, source: system, description: "ACTIVE → ARCHIVED (terminal for writes)" }

  - name: OutsideCollaborator
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id" }
      - { name: user_id, type: string, source: input, description: "Reference to UserAccount.id" }
      - { name: repository_id, type: string, source: input, description: "Reference to Repository.id the collaborator is invited to" }
      - { name: invite_expires_at, type: datetime, source: computed, description: "Logical clock + 7 days at invitation; invites past expiry auto-transition to EXPIRED" }
      - { name: status, type: enum, source: system, description: "INVITED → ACCEPTED | EXPIRED | REVOKED" }

  - name: SelfHostedRunner
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id" }
      - { name: name, type: string, source: input, description: "Runner display name" }
      - { name: os_type, type: enum, source: input, description: "LINUX | WINDOWS | MACOS — drives minutes multiplier" }
      - { name: labels, type: array, source: input, description: "Free-form label list used for job routing" }
      - { name: allowed_on_public_repos, type: boolean, source: input, default: false, description: "Security boundary: self-hosted runners default-deny public repository workflows" }
      - { name: status, type: enum, source: system, description: "REGISTERED → ACTIVE → OFFLINE → ACTIVE; terminal REMOVED" }

  - name: WorkflowRun
    parent: Repository
    common_fields: true
    fields:
      - { name: repository_id, type: string, source: system, description: "FK -> Repository.id" }
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id (denormalized for metering)" }
      - { name: runner_id, type: string, source: input, description: "Reference to SelfHostedRunner.id, or null for hosted runs" }
      - { name: runner_kind, type: enum, source: input, description: "HOSTED | SELF_HOSTED" }
      - { name: os_type, type: enum, source: input, description: "LINUX | WINDOWS | MACOS" }
      - { name: requested_minutes, type: integer, source: input, description: "Wall-clock minutes the run is expected to consume (>= 1)" }
      - { name: billed_minutes, type: number, source: computed, description: "requested_minutes × os multiplier, 0 for SELF_HOSTED runs" }
      - { name: overage_cost_cents, type: integer, source: computed, default: 0, description: "ceil(overage_minutes × per-minute overage rate) settled at completion/failure; 0 while METERED or fully inside allowance" }
      - { name: execution_status, type: enum, source: system, description: "QUEUED → RUNNING → COMPLETED | FAILED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "METERED → ALLOWANCE_APPLIED → BILLED | REFUNDED — parallel dimension independent of execution_status" }

  - name: StorageArtifact
    parent: Repository
    common_fields: true
    fields:
      - { name: repository_id, type: string, source: system, description: "FK -> Repository.id" }
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id (denormalized for billing)" }
      - { name: name, type: string, source: input, description: "Artifact name" }
      - { name: size_mb, type: integer, source: input, description: "Artifact size in MB (>= 1)" }
      - { name: retention_days, type: integer, source: input, default: 90, description: "Days retained before auto-expiry; 1-400" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + retention_days on the logical clock" }
      - { name: status, type: enum, source: system, description: "RETAINED → EXPIRED (system) | DELETED" }

  - name: SecurityEntitlement
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id" }
      - { name: repository_id, type: string, source: input, description: "Reference to Repository.id being covered" }
      - { name: product, type: enum, source: input, description: "SECRET_SCANNING | CODE_SCANNING | DEPENDENCY_REVIEW" }
      - { name: committer_count, type: integer, source: computed, description: "Distinct active committers on the repository in the trailing 90-day window at activation; drives per-committer pricing" }
      - { name: monthly_price_cents, type: integer, source: computed, description: "committer_count × per-committer rate by product; frozen at activation" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION → ACTIVE → SUSPENDED → ACTIVE | CANCELLED" }

  - name: PersonalAccessToken
    parent: UserAccount
    common_fields: true
    fields:
      - { name: user_id, type: string, source: system, description: "FK -> UserAccount.id; token owner" }
      - { name: enterprise_id, type: string, source: input, description: "Reference to Enterprise.id the token is scoped to" }
      - { name: scopes, type: array, source: input, description: "OAuth-style scope list; each entry from {REPO, WORKFLOW, PACKAGES, ADMIN_ORG}" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL → ACTIVE → REVOKED; ACTIVE → EXPIRED" }

  - name: AuditLogEvent
    parent: Enterprise
    common_fields: false
    fields:
      - { name: enterprise_id, type: string, source: system, description: "FK -> Enterprise.id" }
      - { name: action, type: string, source: system, description: "Dot-namespaced action, e.g. repo.visibility_changed, sso.enforced, seat.consumed" }
      - { name: actor_login, type: string, source: system, description: "Login of the acting user (or 'system')" }
      - { name: streamed, type: boolean, source: computed, default: false, description: "True once the event has been emitted to the audit log stream while stream_status == STREAMING" }

  - name: MarketplaceAppInstallation
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: system, description: "Reference to Organization.id" }
      - { name: app_slug, type: string, source: input, description: "Marketplace application identifier" }
      - { name: permission_scopes, type: array, source: input, description: "Requested scopes from {ISSUES_READ, CONTENTS_WRITE, ACTIONS_ADMIN}; install-time validation" }
      - { name: status, type: enum, source: system, description: "PENDING → INSTALLED → SUSPENDED → INSTALLED | UNINSTALLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Enterprise
    initial_state: DISABLED   # sso_enforcement dimension; field-level machine
    terminal_states: []
    note: "State machine applies to Enterprise.sso_enforcement; audit_log_stream_status evolves on its own independent axis (INACTIVE → STREAMING → PAUSED → STREAMING, no terminal state)."
    transitions:
      - from: DISABLED
        to: CONFIGURING
        trigger: "POST /enterprises/{enterpriseId}/sso/transition with action=CONFIGURE"
        actor: EnterpriseAdmin
        preconditions:
          - "sso_enforcement == DISABLED (ERR_SSO_ALREADY_CONFIGURED)"
        side_effects:
          - "Emit AuditLogEvent action=sso.configuration_started"

      - from: CONFIGURING
        to: ENFORCED
        trigger: "POST /enterprises/{enterpriseId}/sso/transition with action=ENFORCE"
        actor: EnterpriseAdmin
        preconditions:
          - "sso_enforcement == CONFIGURING (ERR_SSO_NOT_CONFIGURING)"
          - "Every Organization of the enterprise has status == ACTIVE (ERR_ORG_SUSPENDED_BLOCKS_SSO)"
        side_effects:
          - "Cascade depth 1: every PersonalAccessToken scoped to this enterprise with status == ACTIVE AND created while enterprise.pat_policy == UNRESTRICTED is transitioned to REVOKED"
          - "Cascade depth 2: each revoked token's revocation emits AuditLogEvent action=pat.revoked_by_sso"
          - "Cascade depth 3: every MarketplaceAppInstallation in status INSTALLED whose permission_scopes contain ADMIN_ORG transitions to SUSPENDED (least-privilege re-baseline)"
          - "Emit AuditLogEvent action=sso.enforced"

      - from: ENFORCED
        to: SUSPENDED
        trigger: "POST /enterprises/{enterpriseId}/sso/transition with action=SUSPEND"
        actor: EnterpriseAdmin
        preconditions:
          - "sso_enforcement == ENFORCED (ERR_SSO_NOT_ENFORCED)"
        side_effects:
          - "Emit AuditLogEvent action=sso.suspended"

      - from: SUSPENDED
        to: ENFORCED
        trigger: "POST /enterprises/{enterpriseId}/sso/transition with action=ENFORCE"
        actor: EnterpriseAdmin
        preconditions:
          - "Every Organization of the enterprise has status == ACTIVE (ERR_ORG_SUSPENDED_BLOCKS_SSO)"
        side_effects:
          - "Emit AuditLogEvent action=sso.reenforced (NO token revocation cascade on re-enforcement — re-cycle is non-destructive)"

  - entity: Organization
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /organizations/{orgId}/transition with action=SUSPEND"
        actor: EnterpriseAdmin
        preconditions:
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects:
          - "Cascade depth 1: every SelfHostedRunner of the org with status ACTIVE transitions to OFFLINE"
          - "Cascade depth 2: every WorkflowRun of the org in QUEUED transitions to CANCELLED (execution_status), and its billing_status transitions METERED/ALLOWANCE_APPLIED → REFUNDED with minutes credited back"
          - "Cascade depth 3: each refunded run re-credits Organization.consumed_actions_minutes and increments Enterprise.version (ledger sync up the aggregate)"
          - "SecurityEntitlements in ACTIVE transition to SUSPENDED (billing pause)"
          - "Emit AuditLogEvent action=org.suspended"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /organizations/{orgId}/transition with action=UNSUSPEND"
        actor: EnterpriseAdmin
        preconditions:
          - "Organization status == SUSPENDED (ERR_ORG_NOT_SUSPENDED)"
          - "Enterprise sso_enforcement != CONFIGURING (ERR_SSO_CONFIGURATION_IN_FLIGHT)"
        side_effects:
          - "SecurityEntitlements in SUSPENDED return to ACTIVE (billing resumes; no back-billing for suspended period)"
          - "SelfHostedRunners remain OFFLINE until re-heartbeated (no automatic revival)"
          - "Emit AuditLogEvent action=org.unsuspended"

      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /organizations/{orgId}/transition with action=ARCHIVE"
        actor: EnterpriseAdmin
        preconditions:
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "No WorkflowRun in QUEUED or RUNNING (ERR_INFLIGHT_RUNS_EXIST)"
          - "All SecurityEntitlements in CANCELLED (ERR_ACTIVE_ENTITLEMENTS_EXIST)"
        side_effects:
          - "All Repositories → ARCHIVED"
          - "All OutsideCollaborators in INVITED/ACCEPTED → REVOKED"
          - "All MarketplaceAppInstallations in INSTALLED/SUSPENDED → UNINSTALLED"
          - "Emit AuditLogEvent action=org.archived"

  - entity: UserAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /users/{userId}/transition with action=SUSPEND"
        actor: EnterpriseAdmin
        preconditions:
          - "UserAccount status == ACTIVE (ERR_USER_NOT_ACTIVE)"
        side_effects:
          - "If seat_held_enterprise_id is non-null: reclaim the seat — Enterprise.used_seats -= 1, available_seats recomputed, seat_held_enterprise_id cleared; emit AuditLogEvent action=seat.reclaimed"
          - "All PersonalAccessTokens of the user in PENDING_APPROVAL/ACTIVE → REVOKED"
          - "All OutsideCollaborator rows for the user in INVITED/ACCEPTED → REVOKED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /users/{userId}/transition with action=UNSUSPEND"
        actor: EnterpriseAdmin
        preconditions:
          - "UserAccount status == SUSPENDED (ERR_USER_NOT_SUSPENDED)"
        side_effects:
          - "No automatic seat re-acquisition — the seat is only re-consumed on the user's next CommitEvent"

  - entity: OutsideCollaborator
    initial_state: INVITED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /outside-collaborators/{collabId}/accept"
        actor: UserAccount   # the invited user themself
        preconditions:
          - "Logical clock < invite_expires_at (ERR_INVITE_EXPIRED)"
          - "Invited user status == ACTIVE (ERR_USER_NOT_ACTIVE)"
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects:
          - "Seat consumption check: if the user holds no seat on this enterprise and is_active_committer == false, the seat is consumed provisionally at acceptance (Enterprise.used_seats += 1; ERR_NO_SEATS_AVAILABLE when available_seats == 0)"

      - from: INVITED
        to: EXPIRED
        trigger: "system (lazy: evaluated whenever the collaborator row is read or acted on after invite_expires_at, or on POST /_clock/set_current_utc sweep)"
        actor: system
        preconditions:
          - "Logical clock >= invite_expires_at"
        side_effects: []

      - from: INVITED
        to: REVOKED
        trigger: "DELETE /outside-collaborators/{collabId}"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: REVOKED
        trigger: "DELETE /outside-collaborators/{collabId}"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "If the collaborator held a provisionally consumed seat (accepted while not an active committer) AND holds no other ACCEPTED collaborator row or membership in the enterprise: reclaim the seat (used_seats -= 1)"

  - entity: Repository
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "PATCH /repositories/{repoId} with status=ARCHIVED"
        actor: OrgAdmin
        preconditions:
          - "Repository status == ACTIVE (ERR_REPO_NOT_ACTIVE)"
        side_effects:
          - "QUEUED WorkflowRuns of the repo → CANCELLED with billing refund (same refund semantics as org suspension depth 2)"
          - "StorageArtifacts in RETAINED → DELETED; Organization.consumed_storage_gb decremented by their size_mb/1024"

  - entity: SelfHostedRunner
    initial_state: REGISTERED
    terminal_states: [REMOVED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /runners/{runnerId}/heartbeat"
        actor: RunnerAgent
        preconditions:
          - "Runner status in {REGISTERED, OFFLINE} (ERR_RUNNER_NOT_ACTIVATABLE)"
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects: []

      - from: ACTIVE
        to: OFFLINE
        trigger: "system (org suspension cascade)"
        actor: "system | OrgAdmin"
        preconditions: []
        side_effects: []

      - from: OFFLINE
        to: ACTIVE
        trigger: "POST /runners/{runnerId}/heartbeat"
        actor: RunnerAgent
        preconditions:
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects: []

      - from: REGISTERED
        to: REMOVED
        trigger: "DELETE /runners/{runnerId}"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /runners/{runnerId}"
        actor: OrgAdmin
        preconditions:
          - "No WorkflowRun referencing this runner in RUNNING (ERR_RUNNER_IN_USE)"
        side_effects: []

      - from: OFFLINE
        to: REMOVED
        trigger: "DELETE /runners/{runnerId}"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

  - entity: WorkflowRun
    initial_state: QUEUED   # both dimensions start QUEUED / METERED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    note: "Parallel dimensions: execution_status (QUEUED → RUNNING → COMPLETED|FAILED|CANCELLED) and billing_status (METERED → ALLOWANCE_APPLIED → BILLED; METERED|ALLOWANCE_APPLIED → REFUNDED) evolve independently — a RUNNING run may already be BILLED, and a CANCELLED run's refund is a billing-dimension event."
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /workflow-runs/{runId}/transition with action=START"
        actor: RunnerAgent
        preconditions:
          - "execution_status == QUEUED (ERR_RUN_NOT_QUEUED)"
          - "If runner_kind == SELF_HOSTED: referenced runner status == ACTIVE (ERR_RUNNER_NOT_ACTIVE)"
        side_effects:
          - "Minutes are metered at start: billed_minutes computed and Organization.consumed_actions_minutes += billed_minutes"

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /workflow-runs/{runId}/transition with action=COMPLETE"
        actor: RunnerAgent
        preconditions:
          - "execution_status == RUNNING (ERR_RUN_NOT_RUNNING)"
        side_effects:
          - "billing_status METERED → ALLOWANCE_APPLIED (within allowance) or BILLED (beyond allowance), per actions_minutes_billing calculation"

      - from: RUNNING
        to: FAILED
        trigger: "POST /workflow-runs/{runId}/transition with action=FAIL"
        actor: RunnerAgent
        preconditions:
          - "execution_status == RUNNING (ERR_RUN_NOT_RUNNING)"
        side_effects:
          - "billing_status METERED → ALLOWANCE_APPLIED or BILLED (failed runs are still billed)"

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /workflow-runs/{runId}/transition with action=CANCEL, or org/repo cascade"
        actor: "OrgAdmin | system"
        preconditions: []
        side_effects:
          - "billing_status METERED/ALLOWANCE_APPLIED → REFUNDED; Organization.consumed_actions_minutes -= billed_minutes (queued runs never consume)"

      - from: RUNNING
        to: CANCELLED
        trigger: "POST /workflow-runs/{runId}/transition with action=CANCEL"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "Billing retained for the started run (already metered at start); billing_status proceeds to ALLOWANCE_APPLIED/BILLED as on completion"

  - entity: StorageArtifact
    initial_state: RETAINED
    terminal_states: [EXPIRED, DELETED]
    transitions:
      - from: RETAINED
        to: EXPIRED
        trigger: "system (lazy evaluation on read, or sweep on POST /_clock/set_current_utc when logical clock >= expires_at)"
        actor: system
        preconditions:
          - "Logical clock >= expires_at"
        side_effects:
          - "Organization.consumed_storage_gb -= size_mb/1024 (precision per storage_billing calculation)"

      - from: RETAINED
        to: DELETED
        trigger: "DELETE /artifacts/{artifactId}"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "Organization.consumed_storage_gb -= size_mb/1024"

  - entity: SecurityEntitlement
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /security-entitlements/{entitlementId}/transition with action=ACTIVATE"
        actor: OrgAdmin
        preconditions:
          - "Organization plan_tier in {TEAM, ENTERPRISE} (ERR_PLAN_TIER_INSUFFICIENT)"
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "committer_count >= 1 (repository has at least one active committer; ERR_NO_ACTIVE_COMMITTERS)"
        side_effects:
          - "monthly_price_cents frozen from committer_count × product rate"
          - "Repository.advanced_security_enabled = true"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (org suspension) OR POST /security-entitlements/{entitlementId}/transition with action=SUSPEND"
        actor: "system | OrgAdmin"
        preconditions: []
        side_effects:
          - "Repository.advanced_security_enabled = false"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (org unsuspension) OR POST /security-entitlements/{entitlementId}/transition with action=RESUME"
        actor: "system | OrgAdmin"
        preconditions:
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects:
          - "Repository.advanced_security_enabled = true"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /security-entitlements/{entitlementId}/transition with action=CANCEL"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "Repository.advanced_security_enabled = false (unless another ACTIVE entitlement covers the same repository)"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /security-entitlements/{entitlementId}/transition with action=CANCEL"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

      - from: PENDING_ACTIVATION
        to: CANCELLED
        trigger: "POST /security-entitlements/{entitlementId}/transition with action=CANCEL"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

  - entity: PersonalAccessToken
    initial_state: PENDING_APPROVAL   # when pat_policy == ADMIN_APPROVAL_REQUIRED; ACTIVE otherwise
    terminal_states: [REVOKED, EXPIRED]
    note: "Initial state is policy-dependent: pat_policy == ADMIN_APPROVAL_REQUIRED → PENDING_APPROVAL; UNRESTRICTED → ACTIVE; DISALLOWED → creation rejected (ERR_PAT_POLICY_DISALLOWED)."
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /personal-access-tokens/{tokenId}/transition with action=APPROVE"
        actor: EnterpriseAdmin
        preconditions:
          - "Token status == PENDING_APPROVAL (ERR_TOKEN_NOT_PENDING)"
          - "Enterprise sso_enforcement == ENFORCED implies scopes must not contain ADMIN_ORG (ERR_SCOPE_FORBIDDEN_UNDER_SSO)"
        side_effects:
          - "Emit AuditLogEvent action=pat.approved"

      - from: PENDING_APPROVAL
        to: REVOKED
        trigger: "POST /personal-access-tokens/{tokenId}/transition with action=REVOKE"
        actor: "UserAccount | EnterpriseAdmin"
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /personal-access-tokens/{tokenId}/transition with action=REVOKE, or SSO enforcement cascade, or user suspension cascade"
        actor: "UserAccount | EnterpriseAdmin | system"
        preconditions: []
        side_effects:
          - "Emit AuditLogEvent action=pat.revoked"

  - entity: MarketplaceAppInstallation
    initial_state: PENDING
    terminal_states: [UNINSTALLED]
    transitions:
      - from: PENDING
        to: INSTALLED
        trigger: "POST /app-installations/{installationId}/transition with action=INSTALL"
        actor: OrgAdmin
        preconditions:
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "If Enterprise sso_enforcement == ENFORCED: permission_scopes must not contain ADMIN_ORG (ERR_SCOPE_FORBIDDEN_UNDER_SSO)"
        side_effects:
          - "Emit AuditLogEvent action=app.installed"

      - from: INSTALLED
        to: SUSPENDED
        trigger: "POST /app-installations/{installationId}/transition with action=SUSPEND, or SSO enforcement cascade (depth 3)"
        actor: "OrgAdmin | system"
        preconditions: []
        side_effects:
          - "Emit AuditLogEvent action=app.suspended"

      - from: SUSPENDED
        to: INSTALLED
        trigger: "POST /app-installations/{installationId}/transition with action=RESUME"
        actor: OrgAdmin
        preconditions:
          - "Organization status == ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects: []

      - from: INSTALLED
        to: UNINSTALLED
        trigger: "POST /app-installations/{installationId}/transition with action=UNINSTALL"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: UNINSTALLED
        trigger: "POST /app-installations/{installationId}/transition with action=UNINSTALL"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

      - from: PENDING
        to: UNINSTALLED
        trigger: "POST /app-installations/{installationId}/transition with action=UNINSTALL"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

  - entity: TeamMembership
    initial_state: MEMBER    # field-level machine on role: MEMBER ↔ MAINTAINER cyclic
    terminal_states: []
    note: "Membership role may cycle MEMBER → MAINTAINER → MEMBER; membership rows are created via POST and removed via DELETE (no terminal status)."
    transitions:
      - from: MEMBER
        to: MAINTAINER
        trigger: "POST /teams/{teamId}/memberships with an updated role for an existing user (upsert)"
        actor: OrgAdmin
        preconditions: []
        side_effects:
          - "Seat consumption: adding a user to any team consumes a seat if the user holds none on the enterprise (see seat_consumption calculation)"

      - from: MAINTAINER
        to: MEMBER
        trigger: "POST /teams/{teamId}/memberships with an updated role for an existing user (upsert)"
        actor: OrgAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: entitlement-create-stale-org
    parent_entity: Organization
    write_endpoint: "POST /enterprises/{enterpriseId}/organizations/{orgId}/security-entitlements"
    occ_field: "expected_organization_version"
    description: |
      Creating a SecurityEntitlement against an Organization whose version has
      advanced since the client last observed it is rejected. A second
      entitlement on the same repository+product legitimately supersedes the
      pending one under the scaffold's one-active-entitlement-per-repo-product
      rule, so a stale view of the organization means the supersession
      decision was made against outdated state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: workflow-run-create-stale-repo
    parent_entity: Repository
    write_endpoint: "POST /enterprises/{enterpriseId}/organizations/{orgId}/repositories/{repoId}/workflow-runs"
    occ_field: "expected_repository_version"
    description: |
      Dispatching a WorkflowRun against a Repository whose version has advanced
      since the client last observed it is rejected. A visibility change or
      archive between the client's read and dispatch invalidates the runner
      eligibility and security-boundary decisions made from the stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: active_committer_seat_count
    trigger: "seat reconciliation on CommitEvent creation, user suspend/unsuspend, collaborator accept/revoke, team membership add, and billing-cycle reset"
    algorithm: aggregation
    formula: |
      A user consumes exactly one seat on enterprise E iff ANY of:
        (a) user has >= 1 CommitEvent with organization_id in E.organizations
            AND committed_at within [clock - 90 days, clock]   → is_active_committer = true
        (b) user has >= 1 TeamMembership row in any Team of any Organization of E
        (c) user has >= 1 OutsideCollaborator row in ACCEPTED status in any Organization of E
      used_seats = count of distinct users satisfying (a) | (b) | (c)
      available_seats = purchased_seats - used_seats
      Reclaim rule: when (a) lapses (90-day window slides past the user's most
      recent CommitEvent) AND (b) and (c) are absent, the seat is reclaimed at
      the next billing-cycle reset OR on user suspension (immediate).
    precision: "integer seats"
    variants:
      - name: forward_looking_projection
        when: "GET .../seat-usage?mode=PROJECTED — used by admins for capacity planning"
        difference: "includes users whose ONLY qualifying CommitEvent falls within the trailing 90-day window as of clock + 30 days (i.e., seats that would still be held a month from now), excluding seats whose last commit ages out within the next 30 days"
      - name: cycle_snapshot
        when: "GET .../seat-usage?mode=CYCLE (default) and all billing outputs"
        difference: "strictly the trailing 90-day window evaluated at the current logical clock; no projection"

  - name: actions_minutes_billing
    trigger: "WorkflowRun start (metering) and completion/failure (allowance settlement)"
    algorithm: tiered_pricing
    formula: |
      1. billed_minutes per run (computed at RUNNING transition):
           SELF_HOSTED → 0
           HOSTED → requested_minutes × OS_MULTIPLIER[os_type]
         where OS_MULTIPLIER = { LINUX: 1.0, WINDOWS: 2.0, MACOS: 10.0 }
         Rounding: billed_minutes is rounded UP to the next whole minute
         (ceil) PER RUN at meter time — pinned rounding order:
         round-per-run-then-sum, never sum-then-round.
      2. Allowance waterfall at run completion/failure, in this exact order:
           remaining_allowance = max(0, included_actions_minutes - consumed_actions_minutes_before_this_run)
           allowance_applied = min(remaining_allowance, billed_minutes)
           overage_minutes = billed_minutes - allowance_applied
           billing_status = ALLOWANCE_APPLIED if overage_minutes == 0 else BILLED
           overage_cost_cents = ceil(overage_minutes × PER_MINUTE_OVERAGE_CENTS[os_type])
         PER_MINUTE_OVERAGE_CENTS = { LINUX: 0.8, WINDOWS: 1.6, MACOS: 8.0 }
      3. consumed_actions_minutes accumulates billed_minutes at meter time
         (step 1), NOT at settlement — cancellation of a QUEUED run refunds 0
         because QUEUED runs were never metered; cancellation of RUNNING
         retains the metered amount.
      4. Billing-cycle reset (POST /enterprises/{id}/billing-cycle/reset):
         consumed_actions_minutes = 0 and consumed_storage_gb recomputed from
         live artifacts; runs from prior cycles are unaffected.
    constants:
      OS_MULTIPLIER_LINUX: 1.0
      OS_MULTIPLIER_WINDOWS: 2.0
      OS_MULTIPLIER_MACOS: 10.0
      OVERAGE_CENTS_PER_MIN_LINUX: 0.8
      OVERAGE_CENTS_PER_MIN_WINDOWS: 1.6
      OVERAGE_CENTS_PER_MIN_MACOS: 8.0
    precision: "billed_minutes: whole minutes via per-run ceil; overage_cost_cents: ceil to whole cents"
    variants:
      - name: allowance_applied
        when: "billed_minutes fits inside remaining allowance"
        difference: "billing_status = ALLOWANCE_APPLIED, overage_cost_cents = 0"
      - name: overage_billed
        when: "billed_minutes exceeds remaining allowance"
        difference: "billing_status = BILLED, overage charged only on the excess minutes (partial crossing is split, not all-or-nothing)"

  - name: security_entitlement_pricing
    trigger: "SecurityEntitlement activation"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
      1. committer_count := count of distinct author_user_id over CommitEvents
         where organization_id == entitlement.organization_id
           AND committed_at within [clock - 90 days, clock]
         (per-repository filtering is NOT applied — GitHub prices per unique
         committer across the org's repositories that have the product enabled;
         this scaffold prices per organization to keep the aggregate auditable)
      2. rate := PRODUCT_RATE_CENTS[product]
         = { SECRET_SCANNING: 1900, CODE_SCANNING: 3000, DEPENDENCY_REVIEW: 400 }
      3. monthly_price_cents := committer_count × rate
      4. monthly_price_cents is FROZEN at activation — later committer-count
         drift does NOT re-price an ACTIVE entitlement; re-pricing requires
         cancel + re-create + re-activate.
      Activation requires committer_count >= 1 (ERR_NO_ACTIVE_COMMITTERS).
    constants:
      SECRET_SCANNING_RATE_CENTS: 1900
      CODE_SCANNING_RATE_CENTS: 3000
      DEPENDENCY_REVIEW_RATE_CENTS: 400
    precision: "integer cents"

  - name: storage_billing
    trigger: "StorageArtifact create, delete, expiry sweep, billing-cycle reset"
    algorithm: aggregation
    formula: |
      consumed_storage_gb = sum(size_mb for artifacts in RETAINED status) / 1024.0
      Overage at billing-cycle reset:
        overage_gb = max(0, consumed_storage_gb - included_storage_gb)
        storage_overage_cents = ceil(overage_gb × 25)   # $0.25/GB-month
      Retention conflict rule (temporal): creating an artifact whose retention
      window [created_at, created_at + retention_days) would overlap a
      RETENTION_FREEZE window declared on the organization is rejected with
      ERR_RETENTION_FREEZE_CONFLICT — half-open interval semantics:
      overlap iff artifact.created_at < freeze.end AND freeze.start < artifact.expires_at.
      Adjacent windows (artifact.expires_at == freeze.start) do NOT overlap.
    constants:
      STORAGE_OVERAGE_CENTS_PER_GB: 25
    precision: "consumed_storage_gb: 3 decimal places, round_half_up; overage cents: ceil"

  - name: outside_collaborator_limit_check
    trigger: "OutsideCollaborator invitation creation"
    algorithm: threshold
    formula: |
      active_collaborators = count of OutsideCollaborator rows for the org with
        status in {INVITED, ACCEPTED}   # pending invites consume the limit
      Creating an invite requires: active_collaborators < outside_collaborator_limit
      Boundary: when active_collaborators == outside_collaborator_limit exactly,
      reject with ERR_COLLABORATOR_LIMIT_REACHED (>= comparison; the invite that
      would make it exceed is rejected — equality blocks).

  - name: team_permission_inheritance
    trigger: "Repository permission resolution (implicit, exercised via endpoints that gate on repo access)"
    algorithm: topological
    formula: |
      A user's effective permission on a repository is the MAX over:
        - direct team grants on teams the user is a MEMBER/MAINTAINER of
        - grants inherited up the Team.parent_team_id chain (child team members
          inherit parent team grants; cycles in parent_team_id are rejected at
          team creation/update with ERR_TEAM_CYCLE)
      MAINTAINER of any team granting access ≥ the MEMBER grant.
      Detection of cycles: on Team create/update, walk parent chain; if the
      walk revisits a Team.id, reject.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted on this endpoint per §1.5 roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Resource ids in path must exist, validated left-to-right (enterprise → org → repo/team → child)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Enterprise SSO posture: when sso_enforcement == ENFORCED, operations that mint credentials (PAT approve, app install with ADMIN_ORG scope) are scope-checked; when == CONFIGURING, org unsuspend is blocked"
    error_id: "ERR_SCOPE_FORBIDDEN_UNDER_SSO | ERR_SSO_CONFIGURATION_IN_FLIGHT"
    http_status: 409
    applies_to: "PAT approve, app install, org unsuspend"

  - priority: 5
    category: state
    check: "Organization must be ACTIVE for all child mutations (repos, teams, runners, runs, artifacts, entitlements, collaborators, apps)"
    error_id: ERR_ORG_NOT_ACTIVE
    http_status: 409
    applies_to: "all org-scoped mutation endpoints"

  - priority: 6
    category: state
    check: "Target resource in required state for the operation (runner ACTIVE for dispatch, run QUEUED for start, entitlement PENDING_ACTIVATION for activate, etc.)"
    error_id: "ERR_{RESOURCE}_NOT_{REQUIRED_STATE} (state-specific)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Public-repository security boundary: a WorkflowRun with runner_kind == SELF_HOSTED on a repository with visibility == PUBLIC requires the referenced runner to have allowed_on_public_repos == true"
    error_id: ERR_PUBLIC_REPO_RUNNER_FORBIDDEN
    http_status: 403
    applies_to: "POST .../workflow-runs"

  - priority: 8
    category: business_safety
    check: "Self-hosted runner referenced by the run must carry a label set that includes every label in the run request's required_labels (subset check)"
    error_id: ERR_RUNNER_LABEL_MISMATCH
    http_status: 409
    applies_to: "POST .../workflow-runs (SELF_HOSTED only)"

  - priority: 9
    category: business_constraint
    check: "Team parent chain must be acyclic (walk parent_team_id; revisit ⇒ cycle)"
    error_id: ERR_TEAM_CYCLE
    http_status: 409
    applies_to: "POST .../teams, PATCH .../teams/{teamId}"

  - priority: 10
    category: business_constraint
    check: "Outside collaborator limit: active collaborators (INVITED + ACCEPTED) must be strictly below the org limit at invite creation"
    error_id: ERR_COLLABORATOR_LIMIT_REACHED
    http_status: 409
    applies_to: "POST .../outside-collaborators"

  - priority: 11
    category: business_referential
    check: "Referenced runner/repository/team/user must belong to the same organization as the path's org (cross-org reference rejected)"
    error_id: ERR_CROSS_ORG_REFERENCE
    http_status: 409
    applies_to: "endpoints with body FKs"

  - priority: 12
    category: business_temporal
    check: "Artifact retention window must not overlap an org retention-freeze window (half-open intervals)"
    error_id: ERR_RETENTION_FREEZE_CONFLICT
    http_status: 409
    applies_to: "POST .../artifacts"

  - priority: 13
    category: business_temporal
    check: "Outside collaborator invite must be accepted strictly before invite_expires_at; acceptance at or after expiry fails"
    error_id: ERR_INVITE_EXPIRED
    http_status: 409
    applies_to: "POST .../outside-collaborators/{collabId}/accept"

  - priority: 14
    category: business_fiscal
    check: "Seat availability: any operation that consumes a seat (collaborator accept, team membership add for seat-less user, commit event from seat-less user) requires available_seats > 0"
    error_id: ERR_NO_SEATS_AVAILABLE
    http_status: 402
    applies_to: "collaborator accept, membership create, commit event ingest"

  - priority: 15
    category: business_fiscal
    check: "Security entitlement activation requires plan_tier in {TEAM, ENTERPRISE} and committer_count >= 1"
    error_id: "ERR_PLAN_TIER_INSUFFICIENT | ERR_NO_ACTIVE_COMMITTERS"
    http_status: 402
    applies_to: "POST .../security-entitlements/{id}/activate"

  - priority: 16
    category: business_constraint
    check: "One ACTIVE or PENDING_ACTIVATION entitlement per (repository_id, product) pair; duplicates rejected"
    error_id: ERR_DUPLICATE_ENTITLEMENT
    http_status: 409
    applies_to: "POST .../security-entitlements"

  - priority: 17
    category: business_constraint
    check: "PAT creation against enterprise with pat_policy == DISALLOWED is rejected"
    error_id: ERR_PAT_POLICY_DISALLOWED
    http_status: 403
    applies_to: "POST /users/{userId}/personal-access-tokens"

  - priority: 18
    category: business_constraint
    check: "Repository visibility change to PUBLIC requires the owning org's enterprise sso_enforcement != DISABLED (public surface requires identity baseline)"
    error_id: ERR_VISIBILITY_REQUIRES_SSO
    http_status: 409
    applies_to: "PATCH .../repositories/{repoId}"

  - priority: 19
    category: business_constraint
    check: "Marketplace app install scopes must be a subset of the app's declared scope catalog {ISSUES_READ, CONTENTS_WRITE, ACTIONS_ADMIN, ADMIN_ORG}"
    error_id: ERR_INVALID_APP_SCOPE
    http_status: 400
    applies_to: "POST .../app-installations"

# =============================================================================
# Table 5: API Endpoint Table (40 endpoints, flat topology)
# =============================================================================
endpoints:
  # --- Enterprise ---
  - method: POST
    path: "/enterprises"
    description: "Create an Enterprise"
    roles: [EnterpriseAdmin]
    code: 201
    input: [name, purchased_seats, "pat_policy?", "billing_cycle_anchor_day?"]
    output: Enterprise
    side_effects: ["sso_enforcement = DISABLED", "used_seats = 0", "audit_log_stream_status = INACTIVE"]

  - method: GET
    path: "/enterprises/{enterpriseId}"
    description: "Get an Enterprise"
    roles: [Any]
    code: 200
    input: []
    output: Enterprise
    side_effects: []

  - method: GET
    path: "/enterprises/{enterpriseId}/seat-usage"
    description: "Computed seat usage; mode=CYCLE (default) or PROJECTED selects the variant of active_committer_seat_count"
    roles: [EnterpriseAdmin, OrgAdmin]
    code: 200
    input: ["mode?"]
    output: { used_seats: integer, available_seats: integer, purchased_seats: integer, mode: string }
    side_effects: []

  - method: POST
    path: "/enterprises/{enterpriseId}/sso/transition"
    description: "SSO lifecycle action: CONFIGURE (DISABLED→CONFIGURING), ENFORCE (CONFIGURING→ENFORCED, or SUSPENDED→ENFORCED), SUSPEND (ENFORCED→SUSPENDED)"
    roles: [EnterpriseAdmin]
    code: 200
    input: [action]
    output: Enterprise
    side_effects: ["ENFORCE from CONFIGURING fires the depth-3 cascade: PAT revoke → audit event → app suspend"]

  - method: POST
    path: "/enterprises/{enterpriseId}/billing-cycle/reset"
    description: "Reset billing cycle: zero consumed_actions_minutes on all orgs, recompute consumed_storage_gb, reclaim lapsed seats"
    roles: [EnterpriseAdmin]
    code: 200
    input: []
    output: { reclaimed_seats: integer, orgs_reset: integer }
    side_effects: ["seat reclamation sweep", "storage overage computed for closing cycle", "increments Enterprise.version by 1"]

  - method: POST
    path: "/enterprises/{enterpriseId}/audit-log-stream/toggle"
    description: "Advance audit log streaming one step in the cycle INACTIVE → STREAMING → PAUSED → STREAMING"
    roles: [EnterpriseAdmin]
    code: 200
    input: []
    output: Enterprise
    side_effects: ["while STREAMING, each new AuditLogEvent is marked streamed=true at write time"]

  - method: GET
    path: "/enterprises/{id}/audit-log-events"
    description: "List audit log events of the enterprise; streamed? filter selects delivered vs pending"
    roles: [EnterpriseAdmin]
    code: 200
    input: ["streamed?", "limit?", "offset?"]
    output: "AuditLogEvent[]"
    side_effects: []

  # --- Organization ---
  - method: POST
    path: "/organizations"
    description: "Create an Organization within an enterprise"
    roles: [EnterpriseAdmin]
    code: 201
    input: [enterprise_id, login, "plan_tier?", "retention_freeze_windows?"]
    output: Organization
    side_effects: ["included allowances computed from plan_tier", "status = ACTIVE"]

  - method: GET
    path: "/organizations/{orgId}"
    description: "Get an Organization"
    roles: [Any]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: POST
    path: "/organizations/{orgId}/transition"
    description: "Organization lifecycle action: SUSPEND (ACTIVE→SUSPENDED, depth-3 cascade), UNSUSPEND (SUSPENDED→ACTIVE), ARCHIVE (ACTIVE→ARCHIVED terminal)"
    roles: [EnterpriseAdmin]
    code: 200
    input: [action]
    output: Organization
    side_effects: ["SUSPEND: runners → OFFLINE; queued runs → CANCELLED + REFUNDED; entitlements → SUSPENDED", "ARCHIVE: repos archived, collaborators revoked, apps uninstalled"]

  # --- UserAccount & CommitEvent ---
  - method: POST
    path: "/users"
    description: "Register a UserAccount"
    roles: [EnterpriseAdmin]
    code: 201
    input: [login, email]
    output: UserAccount
    side_effects: ["status = ACTIVE", "is_active_committer = false"]

  - method: GET
    path: "/users/{userId}"
    description: "Get a UserAccount"
    roles: [Any]
    code: 200
    input: []
    output: UserAccount
    side_effects: []

  - method: POST
    path: "/users/{userId}/transition"
    description: "User lifecycle action: SUSPEND (ACTIVE→SUSPENDED, immediate seat reclaim + token/collaborator revocation), UNSUSPEND (SUSPENDED→ACTIVE)"
    roles: [EnterpriseAdmin]
    code: 200
    input: [action]
    output: UserAccount
    side_effects: ["SUSPEND reclaims the seat if held, revokes PATs and collaborator rows"]

  - method: POST
    path: "/commit-events"
    description: "Ingest a CommitEvent; recomputes author is_active_committer and consumes a seat when the author holds none"
    roles: [OrgAdmin, EnterpriseAdmin]
    code: 201
    input: [author_user_id, organization_id, committed_at]
    output: CommitEvent
    side_effects: ["seat consumption per active_committer_seat_count (ERR_NO_SEATS_AVAILABLE)", "AuditLogEvent seat.consumed on new seat"]

  # --- Team & Membership ---
  - method: POST
    path: "/teams"
    description: "Create a Team (optional parent_team_id; cycle-checked)"
    roles: [OrgAdmin]
    code: 201
    input: [organization_id, name, "parent_team_id?"]
    output: Team
    side_effects: ["ERR_TEAM_CYCLE when parent chain revisits a team"]

  - method: GET
    path: "/organizations/{id}/teams"
    description: "List Teams of an Organization"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Team[]"
    side_effects: []

  - method: POST
    path: "/teams/{teamId}/memberships"
    description: "Add a member to a Team, or upsert the role of an existing member (MEMBER ↔ MAINTAINER); consumes a seat when the user holds none on the enterprise"
    roles: [OrgAdmin]
    code: 201
    input: [user_id, "role?"]
    output: TeamMembership
    side_effects: ["seat consumption per active_committer_seat_count (ERR_NO_SEATS_AVAILABLE)"]

  # --- Repository ---
  - method: POST
    path: "/repositories"
    description: "Create a Repository"
    roles: [OrgAdmin]
    code: 201
    input: [organization_id, name, "visibility?"]
    output: Repository
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/repositories/{repoId}"
    description: "Get a Repository"
    roles: [Any]
    code: 200
    input: []
    output: Repository
    side_effects: []

  - method: PATCH
    path: "/repositories/{repoId}"
    description: "Update a Repository: name, visibility (PUBLIC requires sso_enforcement != DISABLED), or status=ARCHIVED (terminal; cascades run cancellation + artifact deletion)"
    roles: [OrgAdmin]
    code: 200
    input: ["name?", "visibility?", "status?"]
    output: Repository
    side_effects: ["AuditLogEvent repo.visibility_changed on visibility change", "ARCHIVED: queued runs cancelled, artifacts deleted with storage re-credit"]

  # --- OutsideCollaborator ---
  - method: POST
    path: "/organizations/{orgId}/outside-collaborators"
    description: "Invite an outside collaborator (limit check: INVITED + ACCEPTED < outside_collaborator_limit)"
    roles: [OrgAdmin]
    code: 201
    input: [user_id, repository_id]
    output: OutsideCollaborator
    side_effects: ["invite_expires_at = clock + 7 days", "status = INVITED"]

  - method: POST
    path: "/outside-collaborators/{collabId}/accept"
    description: "Accept an invitation; X-User-ID must equal the invited user's id"
    roles: [UserAccount]
    code: 200
    input: []
    output: OutsideCollaborator
    side_effects: ["provisional seat consumption when user holds no seat and is not an active committer", "ERR_INVITE_EXPIRED at or after invite_expires_at"]

  - method: DELETE
    path: "/outside-collaborators/{collabId}"
    description: "Revoke an invitation or remove a collaborator"
    roles: [OrgAdmin]
    code: 200
    input: []
    output: OutsideCollaborator
    side_effects: ["provisional seat reclaimed when this was the user's only seat justification"]

  # --- SelfHostedRunner ---
  - method: POST
    path: "/organizations/{orgId}/runners"
    description: "Register a self-hosted runner"
    roles: [OrgAdmin]
    code: 201
    input: [name, os_type, "labels?", "allowed_on_public_repos?"]
    output: SelfHostedRunner
    side_effects: ["status = REGISTERED"]

  - method: POST
    path: "/runners/{runnerId}/heartbeat"
    description: "Runner heartbeat: REGISTERED/OFFLINE → ACTIVE (requires org ACTIVE)"
    roles: [RunnerAgent]
    code: 200
    input: []
    output: SelfHostedRunner
    side_effects: []

  - method: DELETE
    path: "/runners/{runnerId}"
    description: "Remove a runner (blocked while a RUNNING run references it)"
    roles: [OrgAdmin]
    code: 200
    input: []
    output: SelfHostedRunner
    side_effects: []

  # --- WorkflowRun ---
  - method: POST
    path: "/repositories/{repoId}/workflow-runs"
    description: "Dispatch a workflow run (OCC-guarded on repository version)"
    roles: [OrgAdmin, UserAccount]
    code: 201
    input: [runner_kind, os_type, requested_minutes, "runner_id?", "required_labels?", expected_repository_version]
    output: WorkflowRun
    side_effects:
      - "increments Repository.version by 1"
      - "public-repo + self-hosted security boundary check (ERR_PUBLIC_REPO_RUNNER_FORBIDDEN)"
      - "label subset check (ERR_RUNNER_LABEL_MISMATCH)"
      - "execution_status = QUEUED; billing_status = METERED"

  - method: GET
    path: "/repositories/{id}/workflow-runs"
    description: "List workflow runs of a repository"
    roles: [Any]
    code: 200
    input: ["execution_status?", "billing_status?", "limit?", "offset?"]
    output: "WorkflowRun[]"
    side_effects: []

  - method: POST
    path: "/workflow-runs/{runId}/transition"
    description: "Run lifecycle action: START (QUEUED→RUNNING, meters minutes immediately), COMPLETE and FAIL (RUNNING→terminal, allowance waterfall settlement), CANCEL (QUEUED→CANCELLED refunds 0; RUNNING→CANCELLED retains metered minutes)"
    roles: [RunnerAgent, OrgAdmin]
    code: 200
    input: [action]
    output: WorkflowRun
    side_effects: ["START: billed_minutes = ceil(requested_minutes × os multiplier), Organization.consumed_actions_minutes += billed_minutes", "COMPLETE/FAIL: billing_status → ALLOWANCE_APPLIED or BILLED"]

  # --- StorageArtifact ---
  - method: POST
    path: "/repositories/{repoId}/artifacts"
    description: "Upload an artifact; retention-freeze conflict check applies (half-open intervals)"
    roles: [OrgAdmin, UserAccount]
    code: 201
    input: [name, size_mb, "retention_days?"]
    output: StorageArtifact
    side_effects: ["expires_at = clock + retention_days", "Organization.consumed_storage_gb += size_mb/1024"]

  - method: GET
    path: "/repositories/{id}/artifacts"
    description: "List artifacts of a repository (lazy expiry applied on read)"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StorageArtifact[]"
    side_effects: ["RETAINED rows past expires_at flip to EXPIRED with storage re-credit"]

  - method: DELETE
    path: "/artifacts/{artifactId}"
    description: "Delete an artifact (RETAINED → DELETED, storage re-credit)"
    roles: [OrgAdmin]
    code: 200
    input: []
    output: StorageArtifact
    side_effects: ["Organization.consumed_storage_gb -= size_mb/1024"]

  # --- SecurityEntitlement ---
  - method: POST
    path: "/organizations/{orgId}/security-entitlements"
    description: "Create a SecurityEntitlement (OCC-guarded on organization version; one ACTIVE/PENDING per repo+product)"
    roles: [OrgAdmin]
    code: 201
    input: [repository_id, product, expected_organization_version]
    output: SecurityEntitlement
    side_effects: ["increments Organization.version by 1", "status = PENDING_ACTIVATION"]

  - method: POST
    path: "/security-entitlements/{entitlementId}/transition"
    description: "Entitlement lifecycle action: ACTIVATE (freezes committer_count and monthly_price_cents), SUSPEND, RESUME, CANCEL (terminal)"
    roles: [OrgAdmin]
    code: 200
    input: [action]
    output: SecurityEntitlement
    side_effects: ["ACTIVATE: Repository.advanced_security_enabled = true", "CANCEL: recomputed from remaining ACTIVE entitlements"]

  # --- PersonalAccessToken ---
  - method: POST
    path: "/users/{userId}/personal-access-tokens"
    description: "Create a PAT scoped to an enterprise; initial state depends on enterprise pat_policy; X-User-ID must equal userId"
    roles: [UserAccount]
    code: 201
    input: [enterprise_id, scopes]
    output: PersonalAccessToken
    side_effects: ["status = ACTIVE when UNRESTRICTED, PENDING_APPROVAL when ADMIN_APPROVAL_REQUIRED; ERR_PAT_POLICY_DISALLOWED when DISALLOWED"]

  - method: GET
    path: "/users/{id}/personal-access-tokens"
    description: "List a user's tokens"
    roles: [UserAccount, EnterpriseAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PersonalAccessToken[]"
    side_effects: []

  - method: POST
    path: "/personal-access-tokens/{tokenId}/transition"
    description: "Token lifecycle action: APPROVE (PENDING_APPROVAL→ACTIVE, EnterpriseAdmin only, SSO scope gate), REVOKE (PENDING_APPROVAL|ACTIVE→REVOKED, owner or EnterpriseAdmin)"
    roles: [UserAccount, EnterpriseAdmin]
    code: 200
    input: [action]
    output: PersonalAccessToken
    side_effects: ["AuditLogEvent pat.approved / pat.revoked"]

  # --- MarketplaceAppInstallation ---
  - method: POST
    path: "/organizations/{orgId}/app-installations"
    description: "Create a marketplace app installation request (scope catalog validated)"
    roles: [OrgAdmin]
    code: 201
    input: [app_slug, permission_scopes]
    output: MarketplaceAppInstallation
    side_effects: ["status = PENDING"]

  - method: POST
    path: "/app-installations/{installationId}/transition"
    description: "App lifecycle action: INSTALL (PENDING→INSTALLED, SSO scope gate), SUSPEND (INSTALLED→SUSPENDED), RESUME (SUSPENDED→INSTALLED), UNINSTALL (any non-terminal→UNINSTALLED)"
    roles: [OrgAdmin]
    code: 200
    input: [action]
    output: MarketplaceAppInstallation
    side_effects: ["AuditLogEvent app.installed / app.suspended"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default time is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and MUST NOT fall back to wall-clock time. Setting the clock triggers the lazy expiry sweep for OutsideCollaborator invites and StorageArtifact retention."
    roles: [EnterpriseAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["invite expiry sweep", "artifact retention expiry sweep with storage re-credit"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_ENTERPRISE_NOT_FOUND, http: 404, condition: "enterpriseId does not exist" }
  - { id: ERR_ORG_NOT_FOUND, http: 404, condition: "orgId does not exist within the enterprise" }
  - { id: ERR_USER_NOT_FOUND, http: 404, condition: "userId does not exist" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "teamId does not exist within the org" }
  - { id: ERR_REPO_NOT_FOUND, http: 404, condition: "repoId does not exist within the org" }
  - { id: ERR_RUNNER_NOT_FOUND, http: 404, condition: "runnerId does not exist within the org" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "runId does not exist within the repository" }
  - { id: ERR_ARTIFACT_NOT_FOUND, http: 404, condition: "artifactId does not exist" }
  - { id: ERR_ENTITLEMENT_NOT_FOUND, http: 404, condition: "entitlementId does not exist" }
  - { id: ERR_TOKEN_NOT_FOUND, http: 404, condition: "tokenId does not exist" }
  - { id: ERR_APP_INSTALLATION_NOT_FOUND, http: 404, condition: "installationId does not exist" }
  - { id: ERR_COLLABORATOR_NOT_FOUND, http: 404, condition: "collabId does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or enum outside declared set" }
  - { id: ERR_ORG_NOT_ACTIVE, http: 409, condition: "Organization must be ACTIVE for this operation" }
  - { id: ERR_ORG_NOT_SUSPENDED, http: 409, condition: "Unsuspend requires organization in SUSPENDED" }
  - { id: ERR_USER_NOT_ACTIVE, http: 409, condition: "Operation requires user in ACTIVE status" }
  - { id: ERR_USER_NOT_SUSPENDED, http: 409, condition: "Unsuspend requires user in SUSPENDED" }
  - { id: ERR_REPO_NOT_ACTIVE, http: 409, condition: "Operation requires repository in ACTIVE status" }
  - { id: ERR_SSO_ALREADY_CONFIGURED, http: 409, condition: "sso/configure requires sso_enforcement == DISABLED" }
  - { id: ERR_SSO_NOT_CONFIGURING, http: 409, condition: "sso/enforce from fresh state requires sso_enforcement == CONFIGURING" }
  - { id: ERR_SSO_NOT_ENFORCED, http: 409, condition: "sso/suspend requires sso_enforcement == ENFORCED" }
  - { id: ERR_SSO_CONFIGURATION_IN_FLIGHT, http: 409, condition: "Org unsuspend blocked while enterprise SSO is CONFIGURING" }
  - { id: ERR_ORG_SUSPENDED_BLOCKS_SSO, http: 409, condition: "SSO enforcement requires every org ACTIVE" }
  - { id: ERR_SCOPE_FORBIDDEN_UNDER_SSO, http: 409, condition: "ADMIN_ORG scope forbidden while sso_enforcement == ENFORCED" }
  - { id: ERR_PAT_POLICY_DISALLOWED, http: 403, condition: "Enterprise pat_policy == DISALLOWED rejects token creation" }
  - { id: ERR_TOKEN_NOT_PENDING, http: 409, condition: "Approve requires token in PENDING_APPROVAL" }
  - { id: ERR_RUNNER_NOT_ACTIVE, http: 409, condition: "Run start requires self-hosted runner in ACTIVE" }
  - { id: ERR_RUNNER_NOT_ACTIVATABLE, http: 409, condition: "Heartbeat requires runner in REGISTERED or OFFLINE" }
  - { id: ERR_RUNNER_IN_USE, http: 409, condition: "Runner removal blocked by a RUNNING workflow run" }
  - { id: ERR_RUNNER_LABEL_MISMATCH, http: 409, condition: "Runner labels do not cover the run's required_labels" }
  - { id: ERR_PUBLIC_REPO_RUNNER_FORBIDDEN, http: 403, condition: "Self-hosted run on PUBLIC repo requires runner.allowed_on_public_repos == true" }
  - { id: ERR_RUN_NOT_QUEUED, http: 409, condition: "Start requires execution_status == QUEUED" }
  - { id: ERR_RUN_NOT_RUNNING, http: 409, condition: "Complete/fail requires execution_status == RUNNING" }
  - { id: ERR_TEAM_CYCLE, http: 409, condition: "parent_team_id chain would form a cycle" }
  - { id: ERR_COLLABORATOR_LIMIT_REACHED, http: 409, condition: "INVITED + ACCEPTED collaborators >= org outside_collaborator_limit" }
  - { id: ERR_INVITE_EXPIRED, http: 409, condition: "Acceptance at or after invite_expires_at" }
  - { id: ERR_NO_SEATS_AVAILABLE, http: 402, condition: "Operation would consume a seat but available_seats == 0" }
  - { id: ERR_PLAN_TIER_INSUFFICIENT, http: 402, condition: "Advanced security requires plan_tier TEAM or ENTERPRISE" }
  - { id: ERR_NO_ACTIVE_COMMITTERS, http: 402, condition: "Entitlement activation requires committer_count >= 1" }
  - { id: ERR_DUPLICATE_ENTITLEMENT, http: 409, condition: "An ACTIVE or PENDING_ACTIVATION entitlement already exists for (repository, product)" }
  - { id: ERR_ENTITLEMENT_NOT_PENDING_ACTIVATION, http: 409, condition: "ACTIVATE requires entitlement in PENDING_ACTIVATION" }
  - { id: ERR_RETENTION_FREEZE_CONFLICT, http: 409, condition: "Artifact retention window overlaps an org retention-freeze window (half-open interval semantics)" }
  - { id: ERR_CROSS_ORG_REFERENCE, http: 409, condition: "Body FK references a resource owned by a different organization" }
  - { id: ERR_VISIBILITY_REQUIRES_SSO, http: 409, condition: "visibility → PUBLIC requires enterprise sso_enforcement != DISABLED" }
  - { id: ERR_INVALID_APP_SCOPE, http: 400, condition: "permission_scopes outside the declared catalog" }
  - { id: ERR_INFLIGHT_RUNS_EXIST, http: 409, condition: "Org archive blocked by QUEUED or RUNNING workflow runs" }
  - { id: ERR_ACTIVE_ENTITLEMENTS_EXIST, http: 409, condition: "Org archive blocked by non-CANCELLED entitlements" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: EnterpriseAdmin
    description: "Enterprise-level administrator: owns enterprise settings, SSO, billing cycle, user lifecycle, org lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /enterprises"
      - "POST /enterprises/{id}/sso/transition"
      - "POST /enterprises/{id}/billing-cycle/reset"
      - "POST /organizations"
      - "POST /organizations/{id}/transition"
      - "POST /users"
      - "POST /users/{id}/transition"
      - "POST /personal-access-tokens/{id}/transition with action=APPROVE"
      - "POST /_clock/set_current_utc"
      - "POST /enterprises/{id}/audit-log-stream/toggle"
    shared_operations:
      - "GET endpoints marked roles: [Any] or listing EnterpriseAdmin"
      - "GET /enterprises/{id}/audit-log-events"
      - "GET /enterprises/{id}/seat-usage"
      - "POST /commit-events"
      - "POST /personal-access-tokens/{id}/transition with action=REVOKE"

  - name: OrgAdmin
    description: "Organization administrator: manages repos, teams, memberships, collaborators, runners, entitlements, artifacts, apps within an org"
    identity: opaque
    exclusive_operations:
      - "POST /teams"
      - "POST /teams/{id}/memberships"
      - "POST /repositories and PATCH /repositories/{id}"
      - "POST /organizations/{id}/outside-collaborators and DELETE /outside-collaborators/{id}"
      - "POST /organizations/{id}/runners and DELETE /runners/{id}"
      - "POST /workflow-runs/{id}/transition with action=CANCEL"
      - "POST /repositories/{id}/artifacts and DELETE /artifacts/{id}"
      - "POST /organizations/{id}/security-entitlements and POST /security-entitlements/{id}/transition"
      - "POST /organizations/{id}/app-installations and POST /app-installations/{id}/transition"
    shared_operations:
      - "GET endpoints marked roles: [Any] or listing OrgAdmin"
      - "GET /enterprises/{id}/seat-usage"
      - "POST /commit-events"
      - "POST /repositories/{id}/workflow-runs (dispatch)"

  - name: UserAccount
    description: "An end user: accepts collaborator invites, owns PATs, may dispatch workflow runs and upload artifacts"
    identity: "entity_backed:UserAccount"
    exclusive_operations:
      - "POST /outside-collaborators/{id}/accept (X-User-ID must equal the invited user)"
      - "POST /users/{userId}/personal-access-tokens (userId must equal X-User-ID)"
    shared_operations:
      - "GET endpoints marked roles: [Any] or listing UserAccount"
      - "POST /personal-access-tokens/{id}/transition with action=REVOKE on own tokens"
      - "POST /repositories/{id}/workflow-runs (dispatch)"
      - "POST /repositories/{id}/artifacts"

  - name: RunnerAgent
    description: "Machine identity for self-hosted runner processes"
    identity: opaque
    exclusive_operations:
      - "POST /runners/{id}/heartbeat"
      - "POST /workflow-runs/{id}/transition with action=START, COMPLETE, FAIL"

  - name: Any
    description: "Shared read operations across all roles"
    identity: opaque
    shared_operations:
      - "GET endpoints marked roles: [Any]"
