# =============================================================================
# School Health Office & Nurse Records — benchmark seed tables (v1)
# §1.0 – §1.7  (design indices §1.8 / §1.9 live in sibling files)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2130. School Health Office & Nurse Records (school nurse office): student health profile & chronic condition action plan, medication authorization, storage & administration log, visit documentation & disposition (return to class/send home), screening programs (vision/hearing/scoliosis) & referral, emergency response & epinephrine/inhaler stock protocol, nurse-to-student ratio & coverage across buildings, immunization/allergy alert flags, health data privacy & release

domain_name: school-health-office
api_prefix: /health-office

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Eleven peer entities linked purely by foreign keys; no entity id is nested
  # inside another entity's URL path. Every collection sits directly under
  # /health-office/<collection>.

  state_machine_shape: parallel
  # MedicationAuthorization carries two independent state dimensions
  # (consent_status x clinical_status). HealthVisit is branching fork-join with
  # a reopen cycle. ActionPlan and Screening are cyclic (revision / rescreen
  # rounds). MedicationStockLot and DisclosureRequest are branching.

  relationship_patterns:
    - one_to_many          # School -> Student, Student -> HealthVisit, ...
    - self_referential     # ActionPlan.supersedes_action_plan_id -> ActionPlan.id
    - cross_aggregate      # AdministrationRecord spans Visit x Authorization x Lot
    - polymorphic_scope    # DisclosureRequest.scope selects across four record families

  role_model: segregation_of_duties
  # Controlled-medication administration needs a witness who is not the
  # administering nurse; a screening referral cannot be closed by the nurse who
  # recorded the result; a disclosure cannot be released by the actor who
  # decided it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 11 entities / 7 state machines / 12 calculations / 47 validation rows /
  # 56 endpoints / 41 error codes / 6 roles. Density target: every write on
  # AdministrationRecord touches five entities and three conserved counters.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: School
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Building display name" }
      - { name: building_code, type: string, source: input, description: "Short building code; unique across all School rows", constraints: "unique; 2-8 uppercase alphanumeric characters" }
      - { name: cot_capacity, type: integer, source: input, default: 2, description: "Number of treatment cots in the health office; caps overlapping visit occupancy", constraints: ">= 1 and <= 20" }
      - { name: emergency_protocol_enabled, type: boolean, source: input, default: true, description: "Whether undesignated stock epinephrine/albuterol may be given under STOCK_EMERGENCY protocol_mode" }
      - { name: enrolled_student_count, type: integer, source: computed, description: "Count of Student rows with school_id == this School.id AND enrollment_status == ENROLLED" }
      - { name: eligible_stock_student_count, type: integer, source: computed, description: "Count of Student rows with school_id == this School.id AND enrollment_status == ENROLLED AND (allergy_severity == ANAPHYLAXIS OR 'ASTHMA' is a member of chronic_condition_codes)" }
      - { name: base_required_units, type: integer, source: computed, description: "Step 1 of stock_protocol_requirement: ceil(eligible_stock_student_count / 25)" }
      - { name: surge_units, type: integer, source: computed, description: "Step 2 of stock_protocol_requirement: tier keyed on base_required_units ONLY" }
      - { name: required_stock_units, type: integer, source: computed, description: "Step 3 of stock_protocol_requirement: base_required_units + surge_units; never re-tiered" }
      - { name: contracted_weekly_minutes, type: integer, source: computed, description: "Sum of CoverageAssignment.duration_minutes for this school where status IN {SCHEDULED, ACTIVE}, unweighted" }
      - { name: delivered_weekly_minutes, type: number, source: computed, description: "Credential-weighted sum of CoverageAssignment.duration_minutes for this school where status == ACTIVE AND the assigned Nurse.employment_status == ACTIVE" }
      - { name: contracted_students_per_nurse_fte, type: number, source: computed, description: "CONTRACTED variant of school_nurse_coverage_ratio; null when contracted_weekly_minutes == 0", constraints: "2 decimal places, round_half_up" }
      - { name: delivered_students_per_nurse_fte, type: number, source: computed, description: "DELIVERED variant of school_nurse_coverage_ratio; null when delivered_weekly_minutes == 0", constraints: "2 decimal places, round_half_up" }
      - { name: coverage_posture, type: enum, source: computed, description: "Gate on child operations, derived from delivered_students_per_nurse_fte and stock_protocol_status", constraints: "FULL | LIMITED | UNCOVERED" }
      - { name: epinephrine_days_of_supply, type: number, source: computed, description: "school_days_of_supply for medication_code EPINEPHRINE; per-lot rounding applied before summation", constraints: "2 decimal places, round_half_up" }
      - { name: albuterol_days_of_supply, type: number, source: computed, description: "school_days_of_supply for medication_code ALBUTEROL; per-lot rounding applied before summation", constraints: "2 decimal places, round_half_up" }
      - { name: stock_protocol_status, type: enum, source: computed, description: "Emergency stock readiness derived from available units and days of supply for EPINEPHRINE and ALBUTEROL", constraints: "READY | DEGRADED | DEPLETED" }
      - { name: occupied_cot_count, type: integer, source: computed, description: "Count of HealthVisit rows for this school with status IN {OPEN, IN_ASSESSMENT, REOPENED}" }

  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Nurse display name" }
      - { name: credential, type: enum, source: input, description: "Licensure class; drives credential weight and delegation rules", constraints: "RN | LPN | HEALTH_AIDE" }
      - { name: delegation_authorized, type: boolean, source: input, default: false, description: "Whether an LPN or HEALTH_AIDE has a signed delegation of nursing task" }
      - { name: weekly_contracted_minutes, type: integer, source: input, description: "Total weekly minutes the district contracts from this nurse; the conserved quantity of nurse_minute_conservation", constraints: ">= 0 and <= 3000" }
      - { name: committed_weekly_minutes, type: integer, source: computed, default: 0, description: "Sum of CoverageAssignment.duration_minutes for this nurse where status IN {SCHEDULED, ACTIVE}" }
      - { name: uncommitted_weekly_minutes, type: integer, source: computed, description: "weekly_contracted_minutes - committed_weekly_minutes; must never be negative" }
      - { name: assigned_school_count, type: integer, source: computed, description: "Count of distinct school_id over CoverageAssignment rows for this nurse where status IN {SCHEDULED, ACTIVE}" }
      - { name: employment_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE on creation; set to INACTIVE by PATCH /health-office/nurses/{id}", constraints: "ACTIVE | INACTIVE" }

  - name: CoverageAssignment
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; the nurse who staffs the block" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; the building staffed during the block" }
      - { name: weekday, type: enum, source: input, description: "Weekday on which the block recurs", constraints: "MON | TUE | WED | THU | FRI" }
      - { name: start_minute, type: integer, source: input, description: "Block start as minutes after local midnight; interval is half-open [start_minute, end_minute)", constraints: ">= 0 and < 1440" }
      - { name: end_minute, type: integer, source: input, description: "Block end as minutes after local midnight, exclusive", constraints: "> start_minute and <= 1440" }
      - { name: effective_from, type: datetime, source: input, description: "First instant the block is in force (ISO 8601 UTC, inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Instant the block stops being in force (ISO 8601 UTC, exclusive); null means open-ended", default: null }
      - { name: duration_minutes, type: integer, source: computed, description: "end_minute - start_minute" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED when clock < effective_from; ACTIVE when effective_from <= clock AND (effective_to is null OR clock < effective_to); ENDED when effective_to is not null AND clock >= effective_to", constraints: "SCHEDULED | ACTIVE | ENDED" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; building of enrollment" }
      - { name: full_name, type: string, source: input, description: "Student display name" }
      - { name: grade_level, type: integer, source: input, description: "Grade of enrollment", constraints: ">= 0 and <= 12" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO 8601 UTC)" }
      - { name: allergy_severity, type: enum, source: input, description: "Highest documented allergy severity", constraints: "NONE | MILD | MODERATE | ANAPHYLAXIS" }
      - { name: chronic_condition_codes, type: array, source: input, description: "Documented chronic conditions", constraints: "members drawn from {ASTHMA, T1DM, SEIZURE, CARDIAC, MENTAL_HEALTH}; may be empty" }
      - { name: immunization_status, type: enum, source: input, description: "Registry compliance state", constraints: "COMPLIANT | PROVISIONAL | EXEMPT | NONCOMPLIANT" }
      - { name: privacy_hold, type: boolean, source: input, default: false, description: "Guardian-requested hold that blocks non-guardian record release" }
      - { name: enrollment_status, type: enum, source: system, default: ENROLLED, description: "ENROLLED on creation; moved by PATCH /health-office/students/{id}", constraints: "ENROLLED | TRANSFERRED | WITHDRAWN" }
      - { name: intake_risk_score, type: integer, source: computed, description: "INTAKE variant of student_risk_scoring: declared profile only", constraints: ">= 0 and <= 100" }
      - { name: observed_risk_score, type: integer, source: computed, description: "OBSERVED variant of student_risk_scoring: trailing 90-day encounter history", constraints: ">= 0 and <= 100" }
      - { name: effective_risk_score, type: integer, source: computed, description: "max(intake_risk_score, observed_risk_score)" }
      - { name: risk_tier, type: enum, source: computed, description: "Tier of effective_risk_score: ROUTINE < 25, ELEVATED 25..59, CRITICAL >= 60", constraints: "ROUTINE | ELEVATED | CRITICAL" }
      - { name: alert_flags, type: array, source: computed, description: "Sorted-ascending list of alert strings recomputed on every profile, plan, and authorization mutation", constraints: "members drawn from {ALLERGY_ANAPHYLAXIS, IMMUNIZATION_HOLD, NO_ACTIVE_PLAN, SCREENING_REFERRAL, SELF_CARRY}" }
      - { name: self_carry_authorized, type: boolean, source: computed, description: "True when an ActionPlan for this student has status == ACTIVE AND self_carry_requested == true" }
      - { name: active_action_plan_id, type: string, source: computed, description: "Computed pointer (not an input foreign key) to the ActionPlan for this student with status == ACTIVE and the latest effective_from; null when no such plan exists" }

  - name: ActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; subject of the chronic-condition action plan" }
      - { name: supersedes_action_plan_id, type: string, source: input, default: null, description: "FK -> ActionPlan.id; self-referential pointer to the plan this one replaces on approval; null for a first plan" }
      - { name: condition_code, type: enum, source: input, description: "Chronic condition the plan governs", constraints: "ASTHMA | ANAPHYLAXIS | SEIZURE | T1DM" }
      - { name: severity_score, type: integer, source: input, description: "Clinician-assigned severity", constraints: ">= 1 and <= 5" }
      - { name: requires_stock_epinephrine, type: boolean, source: input, description: "Whether the plan authorises undesignated stock epinephrine for this student" }
      - { name: self_carry_requested, type: boolean, source: input, description: "Whether the student is requested to carry and self-administer" }
      - { name: effective_from, type: datetime, source: input, description: "First instant the plan is clinically in force (ISO 8601 UTC)" }
      - { name: review_due_at, type: datetime, source: computed, description: "effective_from + 365 days; set when the plan transitions to ACTIVE" }
      - { name: guardian_consent_at, type: datetime, source: system, default: null, description: "Instant guardian consent was recorded; cleared to null on REQUEST_REVISION" }
      - { name: provider_signed_at, type: datetime, source: system, default: null, description: "Instant the SchoolPhysician approved the plan" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Count of REQUEST_REVISION decisions already applied; capped at MAX_REVISION_ROUNDS = 2" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state; see §1.2 ActionPlan", constraints: "DRAFT | PENDING_GUARDIAN | PENDING_PROVIDER | ACTIVE | SUPERSEDED | EXPIRED | REVOKED" }

  - name: MedicationAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the child the medication is authorised for" }
      - { name: action_plan_id, type: string, source: input, default: null, description: "FK -> ActionPlan.id; the plan this authorisation hangs off; null for a standalone order" }
      - { name: medication_code, type: enum, source: input, description: "Formulary entry", constraints: "EPINEPHRINE | ALBUTEROL | INSULIN | METHYLPHENIDATE | ACETAMINOPHEN" }
      - { name: route, type: enum, source: input, description: "Route of administration", constraints: "IM | INHALED | ORAL | SUBQ" }
      - { name: dose_amount, type: number, source: input, description: "Amount given per administration event", constraints: "> 0" }
      - { name: dose_unit, type: enum, source: input, description: "Unit of dose_amount", constraints: "MG | MCG | ML | PUFF | UNIT" }
      - { name: schedule_type, type: enum, source: input, description: "SCHEDULED for fixed-time orders, PRN for as-needed orders", constraints: "SCHEDULED | PRN" }
      - { name: prn_min_interval_minutes, type: integer, source: input, default: null, description: "Minimum minutes between two ADMINISTERED doses; required when schedule_type == PRN, must be null when schedule_type == SCHEDULED", constraints: ">= 1 and <= 1440" }
      - { name: max_doses_per_day, type: integer, source: input, description: "Hard cap on ADMINISTERED doses per UTC calendar day", constraints: ">= 1 and <= 12" }
      - { name: valid_from, type: datetime, source: input, description: "First instant the order may be acted on (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Instant the order stops being actionable (exclusive)", constraints: "> valid_from" }
      - { name: is_controlled, type: boolean, source: computed, description: "True when medication_code == METHYLPHENIDATE; drives the witness and segregation-of-duties rules" }
      - { name: consent_status, type: enum, source: system, default: CONSENT_PENDING, description: "Dimension A of the two independent state dimensions; guardian-owned", constraints: "CONSENT_PENDING | CONSENT_GRANTED | CONSENT_WITHDRAWN" }
      - { name: clinical_status, type: enum, source: system, default: UNVERIFIED, description: "Dimension B of the two independent state dimensions; nurse/physician-owned", constraints: "UNVERIFIED | VERIFIED | SUSPENDED | EXPIRED" }
      - { name: dispensable, type: boolean, source: computed, description: "True only when consent_status == CONSENT_GRANTED AND clinical_status == VERIFIED AND valid_from <= clock < valid_until" }
      - { name: doses_administered_today, type: integer, source: computed, description: "Count of AdministrationRecord rows for this authorisation with status == ADMINISTERED AND administered_at inside the current UTC day [00:00:00.000, next 00:00:00.000)" }
      - { name: last_administered_at, type: datetime, source: computed, default: null, description: "Maximum administered_at over AdministrationRecord rows for this authorisation with status == ADMINISTERED; null when there are none" }

  - name: MedicationStockLot
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; building where the lot is stored" }
      - { name: medication_code, type: enum, source: input, description: "Formulary entry stored in the lot", constraints: "EPINEPHRINE | ALBUTEROL | INSULIN | METHYLPHENIDATE | ACETAMINOPHEN" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot label" }
      - { name: is_stock_protocol, type: boolean, source: input, description: "True for undesignated emergency stock; false for a student-specific supply" }
      - { name: expiration_date, type: datetime, source: input, description: "Instant the lot expires; a lot is eligible only while expiration_date > clock (strict)" }
      - { name: received_total, type: integer, source: computed, description: "Conserved quantity of lot_unit_conservation: total units ever received into this lot" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "Units physically present and free to reserve" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Units held by AdministrationRecord rows with status == PREPARED" }
      - { name: quantity_administered, type: integer, source: computed, description: "Units consumed by AdministrationRecord rows with status == ADMINISTERED" }
      - { name: quantity_wasted, type: integer, source: computed, description: "Units discarded by AdministrationRecord rows with status == WASTED plus DISCARD inventory actions" }
      - { name: quantity_available, type: integer, source: computed, description: "Alias of quantity_on_hand; the pool the selector draws from" }
      - { name: days_of_supply, type: number, source: computed, description: "round_half_up(quantity_available / AVG_DAILY_UNITS[medication_code], 2); the per-lot term of school_days_of_supply", constraints: "2 decimal places, round_half_up" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Lot lifecycle; see §1.2 MedicationStockLot", constraints: "AVAILABLE | QUARANTINED | DEPLETED | EXPIRED" }

  - name: HealthVisit
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the child seen in the office" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; building whose office was used" }
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; nurse who owns the encounter record" }
      - { name: complaint_code, type: enum, source: input, description: "Presenting complaint category", constraints: "INJURY | ILLNESS | MEDICATION | CHRONIC_CARE | MENTAL_HEALTH | SCREENING_FOLLOWUP" }
      - { name: acuity, type: enum, source: input, description: "Nurse-assigned acuity at arrival", constraints: "ROUTINE | URGENT | EMERGENT" }
      - { name: assessment_note, type: string, source: input, default: null, description: "Free-text assessment recorded at the assess step" }
      - { name: arrival_at, type: datetime, source: system, description: "Logical clock value at creation; start of the cot-occupancy interval [arrival_at, closed_at]" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical clock value when the visit reached CLOSED; end of the cot-occupancy interval (inclusive)" }
      - { name: triage_score, type: integer, source: computed, description: "visit_triage_score, frozen at creation and recomputed on every reopen", constraints: ">= 0 and <= 100" }
      - { name: requires_ems_review, type: boolean, source: computed, description: "True when triage_score >= 85" }
      - { name: disposition, type: enum, source: system, default: null, description: "Set by the dispose branch; cleared to null on reopen", constraints: "RETURN_TO_CLASS | SEND_HOME | EMS_TRANSPORT | REFERRED_EXTERNAL" }
      - { name: guardian_notified, type: boolean, source: system, default: false, description: "Whether the guardian contact was logged for this encounter" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of CLOSED -> REOPENED transitions already applied; capped at MAX_REOPENS = 1" }
      - { name: pending_administration_count, type: integer, source: computed, description: "Count of AdministrationRecord rows for this visit with status == PREPARED" }
      - { name: minutes_in_office, type: integer, source: computed, default: null, description: "Whole minutes between arrival_at and closed_at, floored; null until the visit reaches CLOSED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Encounter lifecycle; see §1.2 HealthVisit", constraints: "OPEN | IN_ASSESSMENT | DISPOSITIONED | CLOSED | REOPENED" }

  - name: AdministrationRecord
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> HealthVisit.id; encounter the dose belongs to" }
      - { name: authorization_id, type: string, source: input, default: null, description: "FK -> MedicationAuthorization.id; null exactly when protocol_mode == STOCK_EMERGENCY" }
      - { name: lot_id, type: string, source: system, description: "FK -> MedicationStockLot.id; lot chosen by the stock_lot_selection policy at PREPARED time" }
      - { name: administering_nurse_id, type: string, source: system, description: "FK -> Nurse.id; copied from the acting X-User-ID at creation" }
      - { name: witness_nurse_id, type: string, source: input, default: null, description: "FK -> Nurse.id; second signer required for controlled medications" }
      - { name: medication_code, type: enum, source: system, description: "Copied from the authorisation, or supplied directly under STOCK_EMERGENCY", constraints: "EPINEPHRINE | ALBUTEROL | INSULIN | METHYLPHENIDATE | ACETAMINOPHEN" }
      - { name: units, type: integer, source: input, description: "Whole stock units drawn from the lot", constraints: ">= 1 and <= 10" }
      - { name: dose_amount, type: number, source: system, description: "Copied from MedicationAuthorization.dose_amount, or the STOCK_EMERGENCY protocol dose" }
      - { name: protocol_mode, type: enum, source: input, description: "AUTHORIZED for an order-backed dose, STOCK_EMERGENCY for undesignated stock", constraints: "AUTHORIZED | STOCK_EMERGENCY" }
      - { name: reason_code, type: string, source: input, default: null, description: "Free-text reason recorded on REFUSED, WASTED, and VOIDED outcomes" }
      - { name: prepared_at, type: datetime, source: system, description: "Logical clock value when the units were reserved" }
      - { name: administered_at, type: datetime, source: system, default: null, description: "Logical clock value when the dose was given" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Logical clock value when the record was voided" }
      - { name: status, type: enum, source: system, default: PREPARED, description: "Record lifecycle; see §1.2 AdministrationRecord", constraints: "PREPARED | ADMINISTERED | REFUSED | WASTED | VOIDED" }

  - name: Screening
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the child screened" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; building where the screening is run" }
      - { name: screened_by_nurse_id, type: string, source: system, default: null, description: "FK -> Nurse.id; nurse who recorded the result; anchors the segregation-of-duties rule on referral closure" }
      - { name: screening_type, type: enum, source: input, description: "Screening programme", constraints: "VISION | HEARING | SCOLIOSIS" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned screening instant (ISO 8601 UTC)" }
      - { name: cycle_number, type: integer, source: system, default: 1, description: "Rescreen round; incremented on each SCHEDULE_RESCREEN, capped at MAX_SCREENING_CYCLES = 3" }
      - { name: result_value, type: number, source: input, default: null, description: "Programme-specific measurement recorded at the record-result step" }
      - { name: outcome, type: enum, source: computed, default: null, description: "Classification of result_value by screening_outcome_classification", constraints: "PASS | REFER | INCONCLUSIVE" }
      - { name: rescreen_due_at, type: datetime, source: system, default: null, description: "clock + 14 days, set when outcome == INCONCLUSIVE" }
      - { name: referral_due_at, type: datetime, source: system, default: null, description: "clock + 30 days, set when outcome == REFER" }
      - { name: referral_completed_at, type: datetime, source: system, default: null, description: "Logical clock value when the referral was closed" }
      - { name: referral_outcome, type: enum, source: input, default: null, description: "Outcome recorded when the referral is closed", constraints: "TREATED | NO_ACTION | LOST_TO_FOLLOWUP" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Screening lifecycle; see §1.2 Screening", constraints: "SCHEDULED | COMPLETED | RESCREEN_DUE | REFERRED | CLOSED | DECLINED" }

  - name: DisclosureRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; subject of the records request" }
      - { name: requester_type, type: enum, source: input, description: "Who is asking for the records", constraints: "GUARDIAN | EXTERNAL_PROVIDER | SCHOOL_STAFF | AGENCY" }
      - { name: requester_reference, type: string, source: input, description: "Free-text identifier of the requesting party as written on the release form" }
      - { name: scope, type: array, source: input, description: "Record families requested", constraints: "non-empty; members drawn from {VISITS, MEDICATIONS, SCREENINGS, ACTION_PLANS}" }
      - { name: purpose_code, type: enum, source: input, description: "Stated purpose of the release", constraints: "TREATMENT | ENROLLMENT | LEGAL | RESEARCH" }
      - { name: consent_granted_at, type: datetime, source: system, default: null, description: "Logical clock value when the guardian granted release consent" }
      - { name: expires_at, type: datetime, source: computed, default: null, description: "consent_granted_at + 30 days; the release is actionable only while clock < expires_at" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical clock value when the package was released" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the SchoolPhysician who decided the request; never equal to any entity id" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the RecordsOfficer who released the package; must differ from decided_by_user_id" }
      - { name: redaction_level, type: enum, source: computed, description: "Output of disclosure_redaction_and_package, recomputed on every status change", constraints: "NONE | PARTIAL | FULL" }
      - { name: release_package_item_count, type: integer, source: computed, default: 0, description: "Number of releasable records under the current scope and redaction_level; 0 until the request reaches RELEASED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Request lifecycle; see §1.2 DisclosureRequest", constraints: "DRAFT | CONSENT_PENDING | AWAITING_DECISION | APPROVED | DENIED | RELEASED | EXPIRED | REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # ActionPlan — cyclic (revision loop) with a self-referential supersede edge
  # ---------------------------------------------------------------------------
  - entity: ActionPlan
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED, REVOKED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /health-office/action-plans"
        actor: SchoolNurse
        preconditions:
          - "Student.enrollment_status == ENROLLED"
          - "expected_student_version equals the current Student.version"
          - "no other ActionPlan for the same student_id and condition_code has status == ACTIVE, unless supersedes_action_plan_id names exactly that plan"
        side_effects:
          - "sets status = DRAFT, revision_round = 0, guardian_consent_at = null, provider_signed_at = null"
          - "increments Student.version by 1"
          - "recomputes Student.alert_flags (adds NO_ACTIVE_PLAN when Student.active_action_plan_id is null)"

      - from: DRAFT
        to: PENDING_GUARDIAN
        trigger: "POST /health-office/action-plans/{id}/submit"
        actor: SchoolNurse
        preconditions:
          - "ActionPlan.status == DRAFT"
          - "Student.enrollment_status == ENROLLED"
        side_effects:
          - "sets status = PENDING_GUARDIAN"

      - from: PENDING_GUARDIAN
        to: PENDING_PROVIDER
        trigger: "POST /health-office/action-plans/{id}/guardian-consent"
        actor: Guardian
        preconditions:
          - "ActionPlan.status == PENDING_GUARDIAN"
          - "X-User-ID equals ActionPlan.student_id"
        side_effects:
          - "sets guardian_consent_at = clock"
          - "sets status = PENDING_PROVIDER"

      - from: PENDING_PROVIDER
        to: ACTIVE
        trigger: "POST /health-office/action-plans/{id}/decision with decision = APPROVE"
        actor: SchoolPhysician
        preconditions:
          - "ActionPlan.status == PENDING_PROVIDER"
          - "ActionPlan.guardian_consent_at is not null"
          - "Student.enrollment_status == ENROLLED"
        side_effects:
          - "sets provider_signed_at = clock, review_due_at = effective_from + 365 days, status = ACTIVE"
          - "CASCADE HOP 1 — when supersedes_action_plan_id is not null and that plan has status == ACTIVE, that plan transitions ACTIVE -> SUPERSEDED"
          - "recomputes Student.active_action_plan_id, Student.self_carry_authorized and Student.alert_flags (drops NO_ACTIVE_PLAN, adds SELF_CARRY when self_carry_requested == true)"
          - "recomputes School.eligible_stock_student_count, School.required_stock_units and School.stock_protocol_status (stock_protocol_requirement then stock_protocol_status)"
        note: "Hops 2-4 of the cascade are declared on the ACTIVE -> SUPERSEDED transition below; each hop is caused by the hop before it, not by this approval."

      - from: PENDING_PROVIDER
        to: DRAFT
        trigger: "POST /health-office/action-plans/{id}/decision with decision = REQUEST_REVISION"
        actor: SchoolPhysician
        preconditions:
          - "ActionPlan.status == PENDING_PROVIDER"
          - "ActionPlan.revision_round < 2"
        side_effects:
          - "increments revision_round by 1"
          - "clears guardian_consent_at to null so the guardian must consent again"
          - "sets status = DRAFT"
        note: "Closes the revision cycle DRAFT -> PENDING_GUARDIAN -> PENDING_PROVIDER -> DRAFT. A third REQUEST_REVISION on a plan already at revision_round == 2 is refused with ERR_REVISION_LIMIT_REACHED and leaves the plan in PENDING_PROVIDER."

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a successor ActionPlan whose supersedes_action_plan_id names this plan reaches ACTIVE"
        actor: system
        preconditions:
          - "ActionPlan.status == ACTIVE"
        side_effects:
          - "sets status = SUPERSEDED"
          - "CASCADE HOP 2 — because this plan is now SUPERSEDED, every MedicationAuthorization with action_plan_id == this plan and clinical_status == VERIFIED moves to clinical_status = SUSPENDED"
          - "CASCADE HOP 3 — because those authorisations are now SUSPENDED, every AdministrationRecord referencing them with status == PREPARED moves to status = VOIDED and releases its reservation (lot.quantity_reserved -= units, lot.quantity_on_hand += units)"
          - "CASCADE HOP 4 — because those reservations were released, every touched MedicationStockLot with status == DEPLETED and quantity_on_hand > 0 returns to status = AVAILABLE, then School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status are recomputed"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /health-office/_ops/run-daily-checkpoint"
        actor: system
        preconditions:
          - "ActionPlan.status == ACTIVE"
          - "ActionPlan.review_due_at <= clock"
        side_effects:
          - "sets status = EXPIRED"
          - "every MedicationAuthorization with action_plan_id == this plan and clinical_status IN {UNVERIFIED, VERIFIED} moves to clinical_status = SUSPENDED"
          - "recomputes Student.active_action_plan_id, Student.self_carry_authorized and Student.alert_flags (adds NO_ACTIVE_PLAN)"

      - from: DRAFT | PENDING_GUARDIAN | PENDING_PROVIDER | ACTIVE
        to: REVOKED
        trigger: "POST /health-office/action-plans/{id}/revoke"
        actor: SchoolPhysician
        preconditions:
          - "ActionPlan.status IN {DRAFT, PENDING_GUARDIAN, PENDING_PROVIDER, ACTIVE}"
        side_effects:
          - "sets status = REVOKED"
          - "every MedicationAuthorization with action_plan_id == this plan and clinical_status IN {UNVERIFIED, VERIFIED} moves to clinical_status = SUSPENDED"
          - "recomputes Student.active_action_plan_id, Student.self_carry_authorized and Student.alert_flags"

  # ---------------------------------------------------------------------------
  # MedicationAuthorization — two independent state dimensions on one row
  # ---------------------------------------------------------------------------
  - entity: MedicationAuthorization
    shape: independent_dimensions
    state_dimensions: [consent_status, clinical_status]
    initial_state: "consent_status = CONSENT_PENDING, clinical_status = UNVERIFIED"
    terminal_states: ["clinical_status = EXPIRED"]
    note: |
      The two dimensions advance on their own edges and never gate each other's
      transitions; only the derived field `dispensable` reads both. A row may sit
      at (CONSENT_WITHDRAWN, VERIFIED) or (CONSENT_GRANTED, SUSPENDED) — both are
      legal, and both make dispensable false.
    transitions:
      - from: null
        to: "consent_status = CONSENT_PENDING, clinical_status = UNVERIFIED"
        dimension: both
        trigger: "POST /health-office/medication-authorizations"
        actor: SchoolNurse
        preconditions:
          - "Student.enrollment_status == ENROLLED"
          - "when action_plan_id is not null, that ActionPlan.student_id == student_id"
          - "prn_min_interval_minutes is not null exactly when schedule_type == PRN"
        side_effects:
          - "sets consent_status = CONSENT_PENDING, clinical_status = UNVERIFIED, is_controlled = (medication_code == METHYLPHENIDATE), dispensable = false"
          - "recomputes Student.alert_flags"

      - from: CONSENT_PENDING
        to: CONSENT_GRANTED
        dimension: consent_status
        trigger: "POST /health-office/medication-authorizations/{id}/consent with decision = GRANT"
        actor: Guardian
        preconditions:
          - "consent_status == CONSENT_PENDING"
          - "X-User-ID equals MedicationAuthorization.student_id"
          - "Student.enrollment_status == ENROLLED"
        side_effects:
          - "sets consent_status = CONSENT_GRANTED"
          - "recomputes dispensable"

      - from: CONSENT_GRANTED
        to: CONSENT_WITHDRAWN
        dimension: consent_status
        trigger: "POST /health-office/medication-authorizations/{id}/consent with decision = WITHDRAW"
        actor: Guardian
        preconditions:
          - "consent_status == CONSENT_GRANTED"
          - "X-User-ID equals MedicationAuthorization.student_id"
        side_effects:
          - "sets consent_status = CONSENT_WITHDRAWN and dispensable = false"
          - "every AdministrationRecord referencing this authorisation with status == PREPARED moves to status = VOIDED, releasing its reservation (lot.quantity_reserved -= units, lot.quantity_on_hand += units)"
          - "recomputes School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status for each touched lot's school"

      - from: CONSENT_WITHDRAWN
        to: CONSENT_GRANTED
        dimension: consent_status
        trigger: "POST /health-office/medication-authorizations/{id}/consent with decision = GRANT"
        actor: Guardian
        preconditions:
          - "consent_status == CONSENT_WITHDRAWN"
          - "X-User-ID equals MedicationAuthorization.student_id"
        side_effects:
          - "sets consent_status = CONSENT_GRANTED"
          - "recomputes dispensable"
        note: "Consent dimension is cyclic: a withdrawn consent can be re-granted without touching clinical_status."

      - from: UNVERIFIED
        to: VERIFIED
        dimension: clinical_status
        trigger: "POST /health-office/medication-authorizations/{id}/clinical-review with decision = VERIFY"
        actor: SchoolNurse
        preconditions:
          - "clinical_status == UNVERIFIED"
          - "the acting Nurse.credential == RN"
          - "action_plan_id is null OR the referenced ActionPlan.status == ACTIVE"
        side_effects:
          - "sets clinical_status = VERIFIED"
          - "recomputes dispensable"

      - from: VERIFIED
        to: SUSPENDED
        dimension: clinical_status
        trigger: "POST /health-office/medication-authorizations/{id}/clinical-review with decision = SUSPEND, or system cascade from an ActionPlan leaving ACTIVE"
        actor: SchoolPhysician | system
        preconditions:
          - "clinical_status == VERIFIED"
        side_effects:
          - "sets clinical_status = SUSPENDED and dispensable = false"
          - "every AdministrationRecord referencing this authorisation with status == PREPARED moves to status = VOIDED, releasing its reservation"
          - "recomputes stock_protocol_status for each touched lot's school"

      - from: SUSPENDED
        to: VERIFIED
        dimension: clinical_status
        trigger: "POST /health-office/medication-authorizations/{id}/clinical-review with decision = VERIFY"
        actor: SchoolNurse
        preconditions:
          - "clinical_status == SUSPENDED"
          - "the acting Nurse.credential == RN"
          - "action_plan_id is null OR the referenced ActionPlan.status == ACTIVE"
        side_effects:
          - "sets clinical_status = VERIFIED"
          - "recomputes dispensable"
        note: "Clinical dimension is cyclic: VERIFIED -> SUSPENDED -> VERIFIED."

      - from: UNVERIFIED | VERIFIED | SUSPENDED
        to: EXPIRED
        dimension: clinical_status
        trigger: "POST /health-office/_ops/run-daily-checkpoint"
        actor: system
        preconditions:
          - "clinical_status IN {UNVERIFIED, VERIFIED, SUSPENDED}"
          - "clock >= valid_until"
        side_effects:
          - "sets clinical_status = EXPIRED and dispensable = false"
          - "every AdministrationRecord referencing this authorisation with status == PREPARED moves to status = VOIDED, releasing its reservation"

  # ---------------------------------------------------------------------------
  # HealthVisit — branching fork (four dispositions) with a reopen cycle
  # ---------------------------------------------------------------------------
  - entity: HealthVisit
    shape: branching_with_cycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /health-office/health-visits"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "Student.enrollment_status == ENROLLED"
          - "Student.school_id == the supplied school_id"
          - "School.coverage_posture IN {FULL, LIMITED} (a school at UNCOVERED refuses new encounters)"
          - "School.occupied_cot_count < School.cot_capacity"
        side_effects:
          - "sets arrival_at = clock, status = OPEN, disposition = null, guardian_notified = false, reopen_count = 0"
          - "computes triage_score by visit_triage_score and sets requires_ems_review = (triage_score >= 85)"
          - "increments School.occupied_cot_count by 1"

      - from: OPEN
        to: IN_ASSESSMENT
        trigger: "POST /health-office/health-visits/{id}/assess"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status == OPEN"
          - "X-User-ID equals HealthVisit.nurse_id"
          - "a CoverageAssignment exists with nurse_id == HealthVisit.nurse_id, school_id == HealthVisit.school_id, status == ACTIVE, weekday == the weekday of clock, and start_minute <= minute-of-day(clock) < end_minute"
        side_effects:
          - "sets status = IN_ASSESSMENT and stores assessment_note"

      - from: IN_ASSESSMENT
        to: DISPOSITIONED
        trigger: "POST /health-office/health-visits/{id}/dispose with disposition = RETURN_TO_CLASS"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status == IN_ASSESSMENT"
          - "NOT (complaint_code == ILLNESS AND Student.immunization_status == NONCOMPLIANT)"
        side_effects:
          - "sets disposition = RETURN_TO_CLASS, status = DISPOSITIONED"
          - "decrements School.occupied_cot_count by 1"
        note: "Branch 1 of 4 — the only branch that neither notifies a guardian nor touches Screening rows."

      - from: IN_ASSESSMENT
        to: DISPOSITIONED
        trigger: "POST /health-office/health-visits/{id}/dispose with disposition = SEND_HOME"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status == IN_ASSESSMENT"
          - "the request carries guardian_notified == true"
        side_effects:
          - "sets disposition = SEND_HOME, guardian_notified = true, status = DISPOSITIONED"
          - "decrements School.occupied_cot_count by 1"
          - "every Screening for this student with status == SCHEDULED and scheduled_for on the same UTC calendar day as clock moves to status = RESCREEN_DUE with rescreen_due_at = clock + 14 days"
          - "recomputes Student.observed_risk_score, Student.effective_risk_score and Student.risk_tier"
        note: "Branch 2 of 4 — divergent side-effect set: guardian gate plus Screening displacement."

      - from: IN_ASSESSMENT
        to: DISPOSITIONED
        trigger: "POST /health-office/health-visits/{id}/dispose with disposition = EMS_TRANSPORT"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status == IN_ASSESSMENT"
          - "acuity == EMERGENT OR triage_score >= 85"
        side_effects:
          - "sets disposition = EMS_TRANSPORT, guardian_notified = true (forced regardless of the request body), status = DISPOSITIONED"
          - "decrements School.occupied_cot_count by 1"
          - "recomputes Student.observed_risk_score, Student.effective_risk_score and Student.risk_tier"
          - "recomputes School.stock_protocol_status"
        note: "Branch 3 of 4 — divergent side-effect set: forced notification plus school stock re-evaluation."

      - from: IN_ASSESSMENT
        to: DISPOSITIONED
        trigger: "POST /health-office/health-visits/{id}/dispose with disposition = REFERRED_EXTERNAL"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status == IN_ASSESSMENT"
          - "complaint_code == SCREENING_FOLLOWUP"
        side_effects:
          - "sets disposition = REFERRED_EXTERNAL, status = DISPOSITIONED"
          - "decrements School.occupied_cot_count by 1"
          - "every Screening for this student with status == REFERRED has referral_due_at extended to clock + 30 days"
        note: "Branch 4 of 4 — divergent side-effect set: referral clock extension only."

      - from: DISPOSITIONED
        to: CLOSED
        trigger: "POST /health-office/health-visits/{id}/close"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status == DISPOSITIONED"
          - "HealthVisit.pending_administration_count == 0"
        side_effects:
          - "sets closed_at = clock, status = CLOSED"
          - "computes minutes_in_office = floor((closed_at - arrival_at) in minutes)"
          - "recomputes Student.observed_risk_score, Student.effective_risk_score and Student.risk_tier"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /health-office/health-visits/{id}/reopen"
        actor: SchoolNurse
        preconditions:
          - "HealthVisit.status == CLOSED"
          - "clock < closed_at + 120 minutes"
          - "HealthVisit.reopen_count < 1"
          - "School.occupied_cot_count < School.cot_capacity"
        side_effects:
          - "sets status = REOPENED, disposition = null, closed_at = null, minutes_in_office = null"
          - "increments reopen_count by 1 and increments School.occupied_cot_count by 1"
          - "recomputes triage_score by visit_triage_score against the student's current risk_tier and the school's current coverage_posture"
        note: "Closes the cycle CLOSED -> REOPENED -> IN_ASSESSMENT -> DISPOSITIONED -> CLOSED."

      - from: REOPENED
        to: IN_ASSESSMENT
        trigger: "POST /health-office/health-visits/{id}/assess"
        actor: SchoolNurse
        preconditions:
          - "HealthVisit.status == REOPENED"
          - "X-User-ID equals HealthVisit.nurse_id"
          - "a CoverageAssignment exists with nurse_id == HealthVisit.nurse_id, school_id == HealthVisit.school_id, status == ACTIVE, weekday == the weekday of clock, and start_minute <= minute-of-day(clock) < end_minute"
        side_effects:
          - "sets status = IN_ASSESSMENT and overwrites assessment_note"

  # ---------------------------------------------------------------------------
  # AdministrationRecord — branching outcomes plus a compensating VOID edge
  # ---------------------------------------------------------------------------
  - entity: AdministrationRecord
    shape: branching_with_compensation
    initial_state: PREPARED
    terminal_states: [REFUSED, VOIDED]
    transitions:
      - from: null
        to: PREPARED
        trigger: "POST /health-office/administration-records (protocol_mode = AUTHORIZED)"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status IN {IN_ASSESSMENT, DISPOSITIONED}"
          - "expected_authorization_version equals the current MedicationAuthorization.version"
          - "MedicationAuthorization.consent_status == CONSENT_GRANTED"
          - "MedicationAuthorization.clinical_status == VERIFIED"
          - "MedicationAuthorization.student_id == HealthVisit.student_id"
          - "the acting nurse may give this medication under the credential/delegation rule"
          - "when MedicationAuthorization.is_controlled == true, witness_nurse_id is present and differs from the acting nurse"
          - "valid_from <= clock < valid_until"
          - "when schedule_type == PRN and last_administered_at is not null, (clock - last_administered_at) in whole minutes >= prn_min_interval_minutes"
          - "doses_administered_today < max_doses_per_day"
          - "stock_lot_selection yields a non-empty candidate pool and the winning lot holds quantity_available >= units"
        side_effects:
          - "selects lot_id by stock_lot_selection and copies medication_code and dose_amount from the authorisation"
          - "sets status = PREPARED, prepared_at = clock, administering_nurse_id = X-User-ID"
          - "moves units on the chosen lot: quantity_on_hand -= units, quantity_reserved += units (received_total unchanged)"
          - "increments HealthVisit.pending_administration_count by 1"
          - "increments MedicationAuthorization.version by 1"
          - "recomputes lot.days_of_supply, School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status"

      - from: null
        to: PREPARED
        trigger: "POST /health-office/administration-records/stock-emergency (protocol_mode = STOCK_EMERGENCY)"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "HealthVisit.status IN {IN_ASSESSMENT, DISPOSITIONED}"
          - "School.emergency_protocol_enabled == true"
          - "medication_code IN {EPINEPHRINE, ALBUTEROL}"
          - "the acting nurse may give this medication under the credential/delegation rule"
          - "stock_lot_selection restricted to lots with is_stock_protocol == true yields a non-empty candidate pool"
        side_effects:
          - "sets authorization_id = null, protocol_mode = STOCK_EMERGENCY, status = PREPARED, prepared_at = clock, administering_nurse_id = X-User-ID"
          - "sets dose_amount from the protocol table STOCK_PROTOCOL_DOSE (EPINEPHRINE 0.3, ALBUTEROL 2)"
          - "moves units on the chosen lot: quantity_on_hand -= units, quantity_reserved += units"
          - "increments HealthVisit.pending_administration_count by 1"
          - "recomputes lot.days_of_supply and School.stock_protocol_status"

      - from: PREPARED
        to: ADMINISTERED
        trigger: "POST /health-office/administration-records/{id}/outcome with outcome = ADMINISTERED"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "AdministrationRecord.status == PREPARED"
          - "X-User-ID equals AdministrationRecord.administering_nurse_id"
          - "when the record is controlled, witness_nurse_id is present and differs from administering_nurse_id"
        side_effects:
          - "sets status = ADMINISTERED, administered_at = clock"
          - "moves units on the lot: quantity_reserved -= units, quantity_administered += units"
          - "when the lot's quantity_on_hand == 0 the lot moves AVAILABLE -> DEPLETED"
          - "decrements HealthVisit.pending_administration_count by 1"
          - "recomputes MedicationAuthorization.doses_administered_today and last_administered_at"
          - "recomputes Student.observed_risk_score, Student.effective_risk_score and Student.risk_tier"
          - "recomputes lot.days_of_supply, School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status"

      - from: PREPARED
        to: REFUSED
        trigger: "POST /health-office/administration-records/{id}/outcome with outcome = REFUSED"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "AdministrationRecord.status == PREPARED"
          - "X-User-ID equals AdministrationRecord.administering_nurse_id"
        side_effects:
          - "sets status = REFUSED and stores reason_code"
          - "returns units to the shelf: quantity_reserved -= units, quantity_on_hand += units"
          - "decrements HealthVisit.pending_administration_count by 1"
          - "recomputes lot.days_of_supply and School.stock_protocol_status"

      - from: PREPARED
        to: WASTED
        trigger: "POST /health-office/administration-records/{id}/outcome with outcome = WASTED"
        actor: SchoolNurse | HealthAide
        preconditions:
          - "AdministrationRecord.status == PREPARED"
          - "X-User-ID equals AdministrationRecord.administering_nurse_id"
        side_effects:
          - "sets status = WASTED and stores reason_code"
          - "moves units on the lot: quantity_reserved -= units, quantity_wasted += units"
          - "when the lot's quantity_on_hand == 0 the lot moves AVAILABLE -> DEPLETED"
          - "decrements HealthVisit.pending_administration_count by 1"
          - "recomputes lot.days_of_supply, School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status"

      - from: PREPARED | ADMINISTERED | WASTED
        to: VOIDED
        trigger: "POST /health-office/administration-records/{id}/void, or a system cascade from an authorisation leaving VERIFIED or a lot leaving AVAILABLE"
        actor: SchoolNurse | system
        preconditions:
          - "AdministrationRecord.status IN {PREPARED, ADMINISTERED, WASTED}"
          - "for a manual void: clock < prepared_at + 1440 minutes"
        side_effects:
          - "sets status = VOIDED, voided_at = clock, stores reason_code"
          - "compensates the lot exactly: from PREPARED move quantity_reserved -= units and quantity_on_hand += units; from ADMINISTERED move quantity_administered -= units and quantity_on_hand += units; from WASTED move quantity_wasted -= units and quantity_on_hand += units — received_total never changes"
          - "when the source state was PREPARED, decrements HealthVisit.pending_administration_count by 1"
          - "when the lot's status == DEPLETED and quantity_on_hand > 0 the lot returns to AVAILABLE"
          - "recomputes MedicationAuthorization.doses_administered_today and last_administered_at"
          - "recomputes Student.observed_risk_score, Student.effective_risk_score and Student.risk_tier"
          - "recomputes lot.days_of_supply, School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status"
        note: "Compensating edge for lot_unit_conservation: received_total == quantity_on_hand + quantity_reserved + quantity_administered + quantity_wasted holds before and after."

  # ---------------------------------------------------------------------------
  # MedicationStockLot — quarantine cycle plus the depletion boundary
  # ---------------------------------------------------------------------------
  - entity: MedicationStockLot
    shape: branching_with_cycle
    initial_state: AVAILABLE
    terminal_states: [EXPIRED]
    transitions:
      - from: null
        to: AVAILABLE
        trigger: "POST /health-office/medication-stock-lots"
        actor: DistrictHealthAdmin
        preconditions:
          - "expiration_date > clock"
          - "initial_quantity >= 1"
        side_effects:
          - "sets received_total = initial_quantity, quantity_on_hand = initial_quantity, quantity_reserved = 0, quantity_administered = 0, quantity_wasted = 0, status = AVAILABLE"
          - "recomputes lot.days_of_supply, School.epinephrine_days_of_supply, School.albuterol_days_of_supply and School.stock_protocol_status"

      - from: AVAILABLE | DEPLETED
        to: QUARANTINED
        trigger: "POST /health-office/medication-stock-lots/{id}/inventory-action with action = QUARANTINE"
        actor: DistrictHealthAdmin
        preconditions:
          - "MedicationStockLot.status IN {AVAILABLE, DEPLETED}"
          - "expected_lot_version equals the current MedicationStockLot.version"
        side_effects:
          - "sets status = QUARANTINED and increments version by 1"
          - "CASCADE HOP 1 — because the lot is now QUARANTINED, every AdministrationRecord drawing on it with status == PREPARED moves to status = VOIDED"
          - "CASCADE HOP 2 — because those records are now VOIDED, their reservations are released back to the lot (quantity_reserved -= units, quantity_on_hand += units) and each parent HealthVisit.pending_administration_count is decremented"
          - "CASCADE HOP 3 — because the lot has left AVAILABLE, it stops contributing to school_days_of_supply, so School.epinephrine_days_of_supply / School.albuterol_days_of_supply and then School.stock_protocol_status are recomputed"
          - "CASCADE HOP 4 — because School.stock_protocol_status may now be DEPLETED, School.coverage_posture is recomputed and can drop to LIMITED, which gates new HealthVisit creation at that building"

      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /health-office/medication-stock-lots/{id}/inventory-action with action = RESTORE"
        actor: DistrictHealthAdmin
        preconditions:
          - "MedicationStockLot.status == QUARANTINED"
          - "expiration_date > clock"
          - "expected_lot_version equals the current MedicationStockLot.version"
        side_effects:
          - "sets status = AVAILABLE and increments version by 1"
          - "recomputes lot.days_of_supply, School.epinephrine_days_of_supply, School.albuterol_days_of_supply, School.stock_protocol_status and School.coverage_posture"
        note: "Cycle AVAILABLE -> QUARANTINED -> AVAILABLE."

      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: quantity_on_hand reaches exactly 0 after an ADMINISTERED or WASTED outcome, or after a DISCARD inventory action"
        actor: system
        preconditions:
          - "MedicationStockLot.status == AVAILABLE"
          - "quantity_on_hand == 0"
        side_effects:
          - "sets status = DEPLETED (the lot leaves the stock_lot_selection candidate pool)"

      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: quantity_on_hand rises above 0 after a RECEIVE inventory action or a VOID compensation"
        actor: system
        preconditions:
          - "MedicationStockLot.status == DEPLETED"
          - "quantity_on_hand > 0"
          - "expiration_date > clock"
        side_effects:
          - "sets status = AVAILABLE"

      - from: AVAILABLE | QUARANTINED | DEPLETED
        to: EXPIRED
        trigger: "POST /health-office/_ops/run-daily-checkpoint"
        actor: system
        preconditions:
          - "MedicationStockLot.status IN {AVAILABLE, QUARANTINED, DEPLETED}"
          - "expiration_date <= clock"
        side_effects:
          - "sets status = EXPIRED"
          - "every AdministrationRecord drawing on the lot with status == PREPARED moves to status = VOIDED, releasing its reservation and decrementing the parent HealthVisit.pending_administration_count"
          - "recomputes School.epinephrine_days_of_supply, School.albuterol_days_of_supply, School.stock_protocol_status and School.coverage_posture"

  # ---------------------------------------------------------------------------
  # Screening — rescreen cycle with a segregated referral closure
  # ---------------------------------------------------------------------------
  - entity: Screening
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [CLOSED, DECLINED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /health-office/screenings"
        actor: SchoolNurse
        preconditions:
          - "Student.enrollment_status == ENROLLED"
          - "Student.school_id == the supplied school_id"
        side_effects:
          - "sets status = SCHEDULED, cycle_number = 1, outcome = null"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /health-office/screenings/{id}/record-result yielding outcome = PASS"
        actor: SchoolNurse
        preconditions:
          - "Screening.status == SCHEDULED"
          - "screening_outcome_classification(screening_type, result_value) == PASS"
          - "a CoverageAssignment exists with nurse_id == screened_by_nurse_id, school_id == Screening.school_id and status == ACTIVE"
        side_effects:
          - "sets outcome = PASS, screened_by_nurse_id, status = COMPLETED"

      - from: SCHEDULED
        to: REFERRED
        trigger: "POST /health-office/screenings/{id}/record-result yielding outcome = REFER"
        actor: SchoolNurse
        preconditions:
          - "Screening.status == SCHEDULED"
          - "screening_outcome_classification(screening_type, result_value) == REFER"
          - "a CoverageAssignment exists with nurse_id == screened_by_nurse_id, school_id == Screening.school_id and status == ACTIVE"
        side_effects:
          - "sets outcome = REFER, screened_by_nurse_id, referral_due_at = clock + 30 days, status = REFERRED"
          - "recomputes Student.alert_flags (adds SCREENING_REFERRAL)"

      - from: SCHEDULED
        to: RESCREEN_DUE
        trigger: "POST /health-office/screenings/{id}/record-result yielding outcome = INCONCLUSIVE"
        actor: SchoolNurse
        preconditions:
          - "Screening.status == SCHEDULED"
          - "screening_outcome_classification(screening_type, result_value) == INCONCLUSIVE"
          - "a CoverageAssignment exists with nurse_id == screened_by_nurse_id, school_id == Screening.school_id and status == ACTIVE"
        side_effects:
          - "sets outcome = INCONCLUSIVE, screened_by_nurse_id, rescreen_due_at = clock + 14 days, status = RESCREEN_DUE"

      - from: RESCREEN_DUE
        to: SCHEDULED
        trigger: "POST /health-office/screenings/{id}/follow-up with action = SCHEDULE_RESCREEN"
        actor: SchoolNurse
        preconditions:
          - "Screening.status == RESCREEN_DUE"
          - "Screening.cycle_number < 3"
        side_effects:
          - "increments cycle_number by 1, sets scheduled_for to the supplied instant, clears outcome and result_value to null, sets status = SCHEDULED"
        note: "Closes the cycle SCHEDULED -> RESCREEN_DUE -> SCHEDULED."

      - from: RESCREEN_DUE
        to: REFERRED
        trigger: "POST /health-office/_ops/run-daily-checkpoint"
        actor: system
        preconditions:
          - "Screening.status == RESCREEN_DUE"
          - "rescreen_due_at <= clock"
        side_effects:
          - "sets outcome = REFER, referral_due_at = clock + 30 days, status = REFERRED"
          - "recomputes Student.alert_flags (adds SCREENING_REFERRAL)"

      - from: REFERRED
        to: CLOSED
        trigger: "POST /health-office/screenings/{id}/follow-up with action = CLOSE_REFERRAL"
        actor: SchoolNurse
        preconditions:
          - "Screening.status == REFERRED"
          - "X-User-ID differs from Screening.screened_by_nurse_id (segregation of duties)"
          - "referral_outcome is supplied"
        side_effects:
          - "sets referral_outcome, referral_completed_at = clock, status = CLOSED"
          - "recomputes Student.alert_flags (drops SCREENING_REFERRAL when no other Screening for the student has status == REFERRED)"

      - from: SCHEDULED | RESCREEN_DUE
        to: DECLINED
        trigger: "system: PATCH /health-office/students/{id} moves enrollment_status out of ENROLLED"
        actor: system
        preconditions:
          - "Screening.status IN {SCHEDULED, RESCREEN_DUE}"
          - "Student.enrollment_status IN {TRANSFERRED, WITHDRAWN}"
        side_effects:
          - "sets status = DECLINED"

  # ---------------------------------------------------------------------------
  # DisclosureRequest — approve/deny fork with a segregated release step
  # ---------------------------------------------------------------------------
  - entity: DisclosureRequest
    shape: branching
    initial_state: DRAFT
    terminal_states: [DENIED, RELEASED, EXPIRED, REVOKED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /health-office/disclosure-requests"
        actor: RecordsOfficer
        preconditions:
          - "Student row exists (enrollment_status may be any value — records survive withdrawal)"
          - "scope is non-empty"
        side_effects:
          - "sets status = DRAFT, release_package_item_count = 0"
          - "computes redaction_level by disclosure_redaction_and_package"

      - from: DRAFT
        to: CONSENT_PENDING
        trigger: "POST /health-office/disclosure-requests/{id}/submit"
        actor: RecordsOfficer
        preconditions:
          - "DisclosureRequest.status == DRAFT"
        side_effects:
          - "sets status = CONSENT_PENDING"
          - "recomputes redaction_level"

      - from: CONSENT_PENDING
        to: AWAITING_DECISION
        trigger: "POST /health-office/disclosure-requests/{id}/guardian-consent with decision = GRANT"
        actor: Guardian
        preconditions:
          - "DisclosureRequest.status == CONSENT_PENDING"
          - "X-User-ID equals DisclosureRequest.student_id"
        side_effects:
          - "sets consent_granted_at = clock, expires_at = consent_granted_at + 30 days, status = AWAITING_DECISION"

      - from: CONSENT_PENDING | AWAITING_DECISION | APPROVED
        to: REVOKED
        trigger: "POST /health-office/disclosure-requests/{id}/guardian-consent with decision = WITHDRAW"
        actor: Guardian
        preconditions:
          - "DisclosureRequest.status IN {CONSENT_PENDING, AWAITING_DECISION, APPROVED}"
          - "X-User-ID equals DisclosureRequest.student_id"
        side_effects:
          - "sets status = REVOKED, consent_granted_at = null, expires_at = null, release_package_item_count = 0"

      - from: AWAITING_DECISION
        to: APPROVED
        trigger: "POST /health-office/disclosure-requests/{id}/decide with decision = APPROVE"
        actor: SchoolPhysician
        preconditions:
          - "DisclosureRequest.status == AWAITING_DECISION"
          - "redaction_level != FULL"
          - "clock < expires_at"
        side_effects:
          - "sets decided_by_user_id = X-User-ID, status = APPROVED"
          - "recomputes redaction_level (a redaction_override in the request body may only tighten NONE to PARTIAL, never loosen)"

      - from: AWAITING_DECISION
        to: DENIED
        trigger: "POST /health-office/disclosure-requests/{id}/decide with decision = DENY"
        actor: SchoolPhysician
        preconditions:
          - "DisclosureRequest.status == AWAITING_DECISION"
        side_effects:
          - "sets decided_by_user_id = X-User-ID, status = DENIED, release_package_item_count = 0"

      - from: APPROVED
        to: RELEASED
        trigger: "POST /health-office/disclosure-requests/{id}/release"
        actor: RecordsOfficer
        preconditions:
          - "DisclosureRequest.status == APPROVED"
          - "clock < expires_at"
          - "Student.privacy_hold == false OR requester_type == GUARDIAN"
          - "X-User-ID differs from decided_by_user_id (segregation of duties)"
        side_effects:
          - "computes release_package_item_count by disclosure_redaction_and_package"
          - "sets released_by_user_id = X-User-ID, released_at = clock, status = RELEASED"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /health-office/_ops/run-daily-checkpoint"
        actor: system
        preconditions:
          - "DisclosureRequest.status == APPROVED"
          - "clock >= expires_at"
        side_effects:
          - "sets status = EXPIRED and release_package_item_count = 0"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: administration-prepare-stale-authorization
    parent_entity: MedicationAuthorization
    write_endpoint: "POST /health-office/administration-records"
    occ_field: "expected_authorization_version"
    description: |
      Preparing a dose against a MedicationAuthorization whose version has
      advanced since the client last read it is rejected. Two prepared doses on
      one authorisation are legitimate under the daily cap, so the write is not
      excluded by any state precondition; the stale version is what marks the
      writer's view of consent, clinical status and today's dose count as
      out of date.
    error_id: ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412

  - rule_id: action-plan-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /health-office/action-plans"
    occ_field: "expected_student_version"
    description: |
      Creating an ActionPlan against a Student whose version has advanced since
      the client last read it is rejected. A superseding plan may legitimately
      be created while an ACTIVE plan exists, so the create is not excluded by a
      state precondition; the stale version signals that the student's profile,
      alert flags or plan pointer moved underneath the author.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

  - rule_id: lot-inventory-action-stale-lot
    parent_entity: MedicationStockLot
    write_endpoint: "POST /health-office/medication-stock-lots/{id}/inventory-action"
    occ_field: "expected_lot_version"
    description: |
      Applying an inventory action to a MedicationStockLot whose version has
      advanced since the client last read it is rejected. Repeated RECEIVE and
      DISCARD actions on one lot are legitimate, so no state precondition
      excludes the write; the stale version marks the caller's unit counts as
      out of date.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: school_nurse_coverage_ratio
    trigger: "On POST /health-office/coverage-assignments, POST /health-office/coverage-assignments/{id}/end, PATCH /health-office/nurses/{id}, POST /health-office/students, PATCH /health-office/students/{id}, POST /health-office/_clock/set_current_utc and POST /health-office/_ops/run-daily-checkpoint"
    algorithm: aggregation
    formula: |
      # --- shared term -------------------------------------------------------
      duration_minutes(a) = a.end_minute - a.start_minute

      # --- VARIANT 1: CONTRACTED --------------------------------------------
      contracted_weekly_minutes =
          sum over CoverageAssignment a where a.school_id == school.id
                                          and a.status IN {SCHEDULED, ACTIVE}
              of duration_minutes(a)                      # unweighted, nurse state ignored

      # --- VARIANT 2: DELIVERED ---------------------------------------------
      credential_weight(n) =
          1.00 if n.credential == RN
          0.60 if n.credential == LPN
          0.30 if n.credential == HEALTH_AIDE and n.delegation_authorized == true
          0.00 if n.credential == HEALTH_AIDE and n.delegation_authorized == false

      delivered_weekly_minutes =
          sum over CoverageAssignment a where a.school_id == school.id
                                          and a.status == ACTIVE
                                          and Nurse(a.nurse_id).employment_status == ACTIVE
              of duration_minutes(a) * credential_weight(Nurse(a.nurse_id))

      # --- shared ratio shape ------------------------------------------------
      fte(minutes) = minutes / FULL_TIME_WEEKLY_MINUTES

      contracted_students_per_nurse_fte =
          null if contracted_weekly_minutes == 0
          else round_half_up(enrolled_student_count / fte(contracted_weekly_minutes), 2)

      delivered_students_per_nurse_fte =
          null if delivered_weekly_minutes == 0
          else round_half_up(enrolled_student_count / fte(delivered_weekly_minutes), 2)
    input_set: |
      CoverageAssignment rows are filtered by status, which is itself derived
      from the logical clock (SCHEDULED / ACTIVE / ENDED). The CONTRACTED
      variant admits SCHEDULED and ACTIVE rows and ignores both Nurse.credential
      and Nurse.employment_status. The DELIVERED variant admits only ACTIVE rows
      whose nurse has employment_status == ACTIVE and weights every minute by
      credential. enrolled_student_count counts Student rows with
      enrollment_status == ENROLLED. Identical stored data therefore yields two
      different ratios whenever any assignment is SCHEDULED, any nurse is
      INACTIVE, or any nurse is not an RN.
    constants:
      FULL_TIME_WEEKLY_MINUTES: 2100
      CREDENTIAL_WEIGHT_RN: 1.00
      CREDENTIAL_WEIGHT_LPN: 0.60
      CREDENTIAL_WEIGHT_AIDE_DELEGATED: 0.30
      CREDENTIAL_WEIGHT_AIDE_UNDELEGATED: 0.00
    precision: "2 decimal places, round_half_up; the division is performed on unrounded minutes and rounded exactly once at the end"
    variants:
      - name: CONTRACTED
        when: "Reported as School.contracted_students_per_nurse_fte; used for district staffing reports"
        difference: "Counts SCHEDULED and ACTIVE assignments at full weight regardless of credential or employment_status"
      - name: DELIVERED
        when: "Reported as School.delivered_students_per_nurse_fte; the only variant that feeds coverage_posture"
        difference: "Counts only ACTIVE assignments of ACTIVE nurses and multiplies each block by credential_weight, so an aide-heavy building shows a far worse ratio than its contract implies"

  - name: student_risk_scoring
    trigger: "INTAKE on POST /health-office/students and PATCH /health-office/students/{id}; OBSERVED additionally on the HealthVisit DISPOSITIONED (SEND_HOME / EMS_TRANSPORT) and CLOSED transitions, on the AdministrationRecord PREPARED -> ADMINISTERED transition, on the AdministrationRecord VOIDED transition, and on POST /health-office/_ops/run-daily-checkpoint"
    algorithm: weighted_scoring
    formula: |
      # --- VARIANT 1: INTAKE (declared profile only) -------------------------
      allergy_points     = {NONE: 0, MILD: 5, MODERATE: 15, ANAPHYLAXIS: 40}[student.allergy_severity]
      condition_points   = 10 * len(student.chronic_condition_codes)
      immunization_points= {COMPLIANT: 0, PROVISIONAL: 5, EXEMPT: 5, NONCOMPLIANT: 20}[student.immunization_status]
      intake_risk_score  = min(100, allergy_points + condition_points + immunization_points)

      # --- VARIANT 2: OBSERVED (trailing encounter history) ------------------
      window = [clock - 90 days, clock)          # left-inclusive, right-exclusive
      V  = HealthVisit rows where student_id == student.id
                            and status IN {DISPOSITIONED, CLOSED}
                            and arrival_at in window
      Vh = subset of V with disposition IN {SEND_HOME, EMS_TRANSPORT}
      A  = AdministrationRecord rows where status == ADMINISTERED
                            and protocol_mode == STOCK_EMERGENCY
                            and administered_at in window
                            and HealthVisit(visit_id).student_id == student.id
      observed_risk_score = min(100, 6 * count(V) + 12 * count(Vh) + 8 * count(A))

      # --- tiering over both variants ---------------------------------------
      effective_risk_score = max(intake_risk_score, observed_risk_score)
      risk_tier = ROUTINE  if effective_risk_score < 25
                  ELEVATED if 25 <= effective_risk_score < 60
                  CRITICAL if effective_risk_score >= 60
    input_set: |
      INTAKE reads only fields stored on the Student row and never touches the
      encounter tables. OBSERVED reads only HealthVisit rows that reached
      DISPOSITIONED or CLOSED (OPEN, IN_ASSESSMENT and REOPENED encounters are
      excluded) and AdministrationRecord rows still in status ADMINISTERED
      (VOIDED records leave the set, which is what makes the void compensating).
      Both variants are stored side by side; the tier reads the maximum.
    constants:
      OBSERVED_WINDOW_DAYS: 90
      VISIT_POINTS: 6
      HIGH_DISPOSITION_POINTS: 12
      STOCK_EMERGENCY_POINTS: 8
      TIER_ELEVATED_MIN: 25
      TIER_CRITICAL_MIN: 60
    precision: "integer points; min/max clamp to [0, 100]; tier boundaries are inclusive on the lower bound (25 is ELEVATED, 60 is CRITICAL)"
    variants:
      - name: INTAKE
        when: "Stored as Student.intake_risk_score; the only variant available before the student has any encounter history"
        difference: "Derived from declared profile fields alone; unchanged by visits, dispositions or administrations"
      - name: OBSERVED
        when: "Stored as Student.observed_risk_score; recomputed on every encounter-side mutation"
        difference: "Derived from a rolling 90-day encounter window; a student with a clean profile and three send-home visits scores higher here than at intake, and voiding an emergency administration lowers it again"

  - name: visit_triage_score
    trigger: "On the HealthVisit null -> OPEN transition (POST /health-office/health-visits) and again on the HealthVisit CLOSED -> REOPENED transition"
    algorithm: weighted_scoring
    formula: |
      base            = {ROUTINE: 10, URGENT: 40, EMERGENT: 70}[visit.acuity]
      complaint_points= {INJURY: 10, ILLNESS: 8, MEDICATION: 12,
                         CHRONIC_CARE: 15, MENTAL_HEALTH: 18, SCREENING_FOLLOWUP: 2}[visit.complaint_code]
      tier_points     = {ROUTINE: 0, ELEVATED: 10, CRITICAL: 20}[student.risk_tier]
      anaphylaxis_bonus = 15 if (student.allergy_severity == ANAPHYLAXIS
                                 and visit.complaint_code IN {ILLNESS, MEDICATION})
                             else 0
      risk_uplift     = min(25, tier_points + anaphylaxis_bonus)      # nested clamp
      coverage_penalty= {FULL: 0, LIMITED: 8, UNCOVERED: 15}[school.coverage_posture]

      triage_score    = max(0, min(100, base + complaint_points + risk_uplift + coverage_penalty))
      requires_ems_review = (triage_score >= 85)
    input_set: |
      Four inputs interact non-linearly: acuity and complaint_code are request
      fields, risk_tier is a derived field on the Student row read at the instant
      of the transition, and coverage_posture is a derived field on the School
      row read at the same instant. The inner min(25, ...) clamps the risk uplift
      before the outer min(100, ...) clamps the total, so a CRITICAL anaphylaxis
      student contributes 25 and not 35.
    constants:
      ACUITY_BASE: { ROUTINE: 10, URGENT: 40, EMERGENT: 70 }
      COMPLAINT_POINTS: { INJURY: 10, ILLNESS: 8, MEDICATION: 12, CHRONIC_CARE: 15, MENTAL_HEALTH: 18, SCREENING_FOLLOWUP: 2 }
      RISK_TIER_POINTS: { ROUTINE: 0, ELEVATED: 10, CRITICAL: 20 }
      ANAPHYLAXIS_BONUS: 15
      RISK_UPLIFT_CAP: 25
      COVERAGE_PENALTY: { FULL: 0, LIMITED: 8, UNCOVERED: 15 }
      EMS_REVIEW_MIN: 85
    precision: "integer; clamped to [0, 100]; requires_ems_review uses >= 85 so exactly 85 sets the flag"

  - name: school_days_of_supply
    trigger: "On POST /health-office/medication-stock-lots, on every AdministrationRecord transition that moves lot units (PREPARED, ADMINISTERED, REFUSED, WASTED, VOIDED), on POST /health-office/medication-stock-lots/{id}/inventory-action, on the MedicationStockLot EXPIRED transition and on POST /health-office/_ops/run-daily-checkpoint"
    algorithm: aggregation
    formula: |
      AVG_DAILY_UNITS = {EPINEPHRINE: 0.30, ALBUTEROL: 1.20, INSULIN: 3.00,
                         METHYLPHENIDATE: 1.00, ACETAMINOPHEN: 2.50}

      # STEP 1 — per-lot term, ROUNDED FIRST (this ordering is pinned)
      lot.days_of_supply = round_half_up(lot.quantity_available / AVG_DAILY_UNITS[lot.medication_code], 2)

      # STEP 2 — sum the already-rounded per-lot terms
      raw_sum(school, code) =
          sum over MedicationStockLot lot where lot.school_id == school.id
                                            and lot.medication_code == code
                                            and lot.status == AVAILABLE
                                            and lot.expiration_date > clock
              of lot.days_of_supply

      # STEP 3 — round the sum once more
      school_days_of_supply(school, code) = round_half_up(raw_sum(school, code), 2)

      school.epinephrine_days_of_supply = school_days_of_supply(school, EPINEPHRINE)
      school.albuterol_days_of_supply   = school_days_of_supply(school, ALBUTEROL)
    input_set: |
      Only lots with status == AVAILABLE and expiration_date strictly greater
      than the logical clock enter the sum; QUARANTINED, DEPLETED and EXPIRED
      lots contribute nothing, and a lot expiring exactly at the clock instant is
      excluded. When no lot qualifies the result is 0.00, never null.
    constants:
      AVG_DAILY_UNITS: { EPINEPHRINE: 0.30, ALBUTEROL: 1.20, INSULIN: 3.00, METHYLPHENIDATE: 1.00, ACETAMINOPHEN: 2.50 }
    precision: |
      2 decimal places, round_half_up, applied TWICE in a pinned order: round
      each lot's quotient to 2 dp FIRST, then sum the rounded terms, then round
      the sum to 2 dp. Summing the raw quotients and rounding once is the wrong
      order and produces a different figure — for example two EPINEPHRINE lots
      holding 1 unit each give 3.33 + 3.33 = 6.66, not round(2/0.30, 2) = 6.67.

  - name: stock_protocol_requirement
    trigger: "On POST /health-office/students, PATCH /health-office/students/{id}, the ActionPlan PENDING_PROVIDER -> ACTIVE transition, and POST /health-office/_ops/run-daily-checkpoint"
    algorithm: threshold
    formula: |
      # This looks circular — the surge allowance is keyed on the requirement it
      # is added to — so the evaluation order below is PINNED and must not be
      # iterated to a fixed point.

      # STEP 1 — base requirement from the eligible population ONLY
      eligible_stock_student_count =
          count of Student s where s.school_id == school.id
                              and s.enrollment_status == ENROLLED
                              and (s.allergy_severity == ANAPHYLAXIS
                                   or 'ASTHMA' in s.chronic_condition_codes)
      base_required_units = ceil(eligible_stock_student_count / STUDENTS_PER_STOCK_UNIT)

      # STEP 2 — surge tier keyed on base_required_units and NOTHING else
      surge_units = 0 if base_required_units <= 2
                    1 if 3 <= base_required_units <= 5
                    2 if base_required_units >= 6

      # STEP 3 — combine once; never re-tier on the combined figure
      required_stock_units = base_required_units + surge_units
    input_set: |
      Only ENROLLED students at the building count, and only those with
      allergy_severity == ANAPHYLAXIS or ASTHMA among chronic_condition_codes.
      A student meeting both criteria counts once. Zero eligible students give
      base_required_units == 0, surge_units == 0 and required_stock_units == 0.
    constants:
      STUDENTS_PER_STOCK_UNIT: 25
      SURGE_TIER_1_MAX: 2
      SURGE_TIER_2_MAX: 5
    precision: |
      Integer arithmetic; ceil on the division. Evaluation order is pinned:
      base -> surge(base) -> total. Re-tiering on the total (e.g. 5 eligible
      units becoming 6 and therefore earning surge 2) is the wrong reading and
      yields a different requirement.

  - name: stock_protocol_status
    trigger: "Immediately after school_days_of_supply or stock_protocol_requirement runs, on every MedicationStockLot transition, and on POST /health-office/_ops/run-daily-checkpoint"
    algorithm: threshold
    formula: |
      epi_units = sum of quantity_available over MedicationStockLot lot where
                      lot.school_id == school.id and lot.medication_code == EPINEPHRINE
                      and lot.is_stock_protocol == true and lot.status == AVAILABLE
                      and lot.expiration_date > clock
      alb_units = same sum for medication_code == ALBUTEROL

      min_days = min(school.epinephrine_days_of_supply, school.albuterol_days_of_supply)

      stock_protocol_status =
          DEPLETED if epi_units == 0 or alb_units == 0
          DEGRADED if epi_units < school.required_stock_units or min_days < DAYS_OF_SUPPLY_READY_MIN
          READY    otherwise
    input_set: "Only AVAILABLE, unexpired, is_stock_protocol == true lots at the building contribute units; student-specific lots are excluded from the emergency-stock readiness view even though they do contribute to school_days_of_supply."
    constants:
      DAYS_OF_SUPPLY_READY_MIN: 30.00
    precision: "Comparisons on days of supply use the 2-dp rounded figures; the READY boundary is inclusive (exactly 30.00 is READY, 29.99 is DEGRADED)"

  - name: school_coverage_posture
    trigger: "Immediately after school_nurse_coverage_ratio or stock_protocol_status runs, and on POST /health-office/_ops/run-daily-checkpoint"
    algorithm: threshold
    formula: |
      ratio = school.delivered_students_per_nurse_fte     # DELIVERED variant only

      base_posture =
          UNCOVERED if ratio is null or ratio > POSTURE_LIMITED_MAX
          LIMITED   if POSTURE_FULL_MAX < ratio <= POSTURE_LIMITED_MAX
          FULL      if ratio <= POSTURE_FULL_MAX

      coverage_posture =
          UNCOVERED if base_posture == UNCOVERED
          LIMITED   if base_posture == FULL and school.stock_protocol_status == DEPLETED
          base_posture otherwise
    input_set: "Reads the DELIVERED ratio only; the CONTRACTED ratio never gates operations. A school with zero delivered minutes (no ACTIVE assignment, or only assignments held by INACTIVE nurses or undelegated aides) has a null ratio and is UNCOVERED."
    constants:
      POSTURE_FULL_MAX: 750.00
      POSTURE_LIMITED_MAX: 1500.00
    precision: "Boundaries are inclusive on the upper edge: exactly 750.00 is FULL, exactly 1500.00 is LIMITED, 1500.01 is UNCOVERED"

  - name: prn_dose_gate
    trigger: "On the AdministrationRecord null -> PREPARED transition (POST /health-office/administration-records)"
    algorithm: threshold
    formula: |
      day_window = [floor_to_utc_midnight(clock), floor_to_utc_midnight(clock) + 24 hours)
      D = AdministrationRecord rows where authorization_id == auth.id
                                     and status == ADMINISTERED
                                     and administered_at in day_window
      auth.doses_administered_today = count(D)
      auth.last_administered_at     = max(administered_at) over
                                        AdministrationRecord rows where
                                        authorization_id == auth.id and status == ADMINISTERED
                                      (null when that set is empty)

      elapsed_minutes = null if auth.last_administered_at is null
                        else floor((clock - auth.last_administered_at) in minutes)

      interval_ok = true if auth.schedule_type == SCHEDULED
                    true if elapsed_minutes is null
                    else (elapsed_minutes >= auth.prn_min_interval_minutes)

      cap_ok = (auth.doses_administered_today < auth.max_doses_per_day)
    input_set: "Only records still in status ADMINISTERED count; a VOIDED record leaves both the daily count and the last_administered_at maximum, which is exactly how a mis-entered dose is undone. PREPARED, REFUSED and WASTED records never count toward the cap."
    constants:
      DAY_BOUNDARY: "UTC midnight, left-inclusive and right-exclusive"
    precision: |
      Both boundaries are exact: elapsed_minutes is floored to whole minutes and
      compared with >=, so a dose at exactly prn_min_interval_minutes is allowed;
      the daily cap is compared with <, so the dose that would make the count
      equal max_doses_per_day is the last one allowed and the next is rejected.

  - name: stock_lot_selection
    trigger: "On both AdministrationRecord null -> PREPARED transitions (POST /health-office/administration-records and POST /health-office/administration-records/stock-emergency)"
    algorithm: selector_policy
    formula: |
      # (a) ELIGIBILITY FILTER — explicit predicate, no adjectives
      candidates = MedicationStockLot lot where
            lot.school_id        == HealthVisit(visit_id).school_id
        and lot.medication_code  == required_code
        and lot.status           == AVAILABLE
        and lot.expiration_date  >  clock                 # strict; expiring at the clock instant is out
        and lot.quantity_available >= units
        and lot.is_stock_protocol == (protocol_mode == STOCK_EMERGENCY)

      # (b) RANKING EXPRESSION — first-expiring-first-out
      order by lot.expiration_date ASC

      # (c) TIE-BREAK — applied in this order when the ranking expression ties
      then by lot.quantity_available ASC
      then by lot.created_at ASC        # common-field fallback; lot.id is never consulted

      # (d) EMPTY-POOL FALLBACK
      if candidates is empty:
          reject with ERR_NO_ELIGIBLE_LOT (409)
      if the winning lot exists but a later units check fails:
          reject with ERR_INSUFFICIENT_STOCK (409)
    input_set: "required_code is MedicationAuthorization.medication_code under AUTHORIZED mode and the request's medication_code under STOCK_EMERGENCY mode. The is_stock_protocol equality makes the two pools disjoint: an authorised dose never draws on undesignated emergency stock and vice versa."
    constants:
      RANK_KEYS: ["expiration_date ASC", "quantity_available ASC", "created_at ASC"]
    precision: "Deterministic total order; the random `id` field is never a decision input at any level, including the final tie-break"

  - name: screening_outcome_classification
    trigger: "On POST /health-office/screenings/{id}/record-result, which drives the Screening SCHEDULED -> COMPLETED / REFERRED / RESCREEN_DUE fork"
    algorithm: threshold
    formula: |
      VISION    (result_value = Snellen denominator at 20 feet):
          PASS         if result_value <= 30
          INCONCLUSIVE if 30 <  result_value <  40
          REFER        if result_value >= 40
      HEARING   (result_value = pure-tone threshold in dB HL):
          PASS         if result_value <= 20
          INCONCLUSIVE if 20 <  result_value <  30
          REFER        if result_value >= 30
      SCOLIOSIS (result_value = Adams forward-bend trunk rotation in degrees):
          PASS         if result_value <= 5
          INCONCLUSIVE if 5  <  result_value <  7
          REFER        if result_value >= 7
    input_set: "One measurement per screening cycle; the classification never reads prior cycles. A rescreen overwrites result_value and re-runs the same thresholds under the incremented cycle_number."
    constants:
      VISION_PASS_MAX: 30
      VISION_REFER_MIN: 40
      HEARING_PASS_MAX: 20
      HEARING_REFER_MIN: 30
      SCOLIOSIS_PASS_MAX: 5
      SCOLIOSIS_REFER_MIN: 7
    precision: "All boundaries inclusive on the named edge: a VISION value of exactly 40 REFERs, exactly 30 PASSes, and 35 is INCONCLUSIVE"

  - name: lot_unit_conservation
    trigger: "Asserted on every AdministrationRecord transition (null -> PREPARED, PREPARED -> ADMINISTERED / REFUSED / WASTED, and any state -> VOIDED) and on POST /health-office/medication-stock-lots/{id}/inventory-action"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY (physical units of medication)
      INVARIANT:
        lot.received_total ==   lot.quantity_on_hand
                              + lot.quantity_reserved
                              + lot.quantity_administered
                              + lot.quantity_wasted

      # received_total moves ONLY on a RECEIVE inventory action:
      RECEIVE(u):     received_total += u ; quantity_on_hand += u
      DISCARD(u):     quantity_on_hand -= u ; quantity_wasted += u      # total unchanged
      PREPARE(u):     quantity_on_hand -= u ; quantity_reserved += u
      ADMINISTER(u):  quantity_reserved -= u ; quantity_administered += u
      REFUSE(u):      quantity_reserved -= u ; quantity_on_hand += u
      WASTE(u):       quantity_reserved -= u ; quantity_wasted += u
      VOID(u) from PREPARED:      quantity_reserved -= u ; quantity_on_hand += u
      VOID(u) from ADMINISTERED:  quantity_administered -= u ; quantity_on_hand += u
      VOID(u) from WASTED:        quantity_wasted -= u ; quantity_on_hand += u

      # Compensating pair: PREPARE then VOID, or PREPARE-ADMINISTER then VOID,
      # both restore quantity_on_hand to its pre-action value and leave
      # received_total untouched. Zero drift is required, not approximate return.
    input_set: "Every unit movement on a lot is attributable to exactly one AdministrationRecord transition or one inventory action; there is no other writer of the four counters."
    constants:
      CONSERVED_QUANTITY: "MedicationStockLot.received_total (physical units)"
    precision: "Integer units; no rounding; the invariant must hold after every single mutation, including each hop of a cascade"

  - name: nurse_minute_conservation
    trigger: "Asserted on POST /health-office/coverage-assignments and POST /health-office/coverage-assignments/{id}/end"
    algorithm: constraint_propagation
    formula: |
      # CONSERVED QUANTITY (contracted staffing time, not physical units)
      INVARIANT:
        nurse.weekly_contracted_minutes == nurse.committed_weekly_minutes
                                         + nurse.uncommitted_weekly_minutes

      CREATE assignment a:  committed_weekly_minutes += duration_minutes(a)
                            uncommitted_weekly_minutes -= duration_minutes(a)
      END assignment a:     committed_weekly_minutes -= duration_minutes(a)
                            uncommitted_weekly_minutes += duration_minutes(a)

      GUARD: a CREATE whose duration_minutes would drive
             uncommitted_weekly_minutes below 0 is rejected with
             ERR_NURSE_HOURS_EXCEEDED (409) and moves neither counter.

      # Compensating pair: CREATE then END restores both counters exactly,
      # so weekly_contracted_minutes is unchanged and no minutes leak.
    input_set: "Only CoverageAssignment rows with status IN {SCHEDULED, ACTIVE} are committed; an ENDED assignment has already returned its minutes. The clock advancing a SCHEDULED assignment to ACTIVE does not move any counter — commitment happens at create time, not at activation."
    constants:
      CONSERVED_QUANTITY: "Nurse.weekly_contracted_minutes (staffing minutes per week)"
    precision: "Integer minutes; the guard uses >= 0 on the post-move uncommitted balance, so an assignment that consumes the last remaining minute exactly is accepted"

  - name: disclosure_redaction_and_package
    trigger: "On POST /health-office/disclosure-requests, on the DisclosureRequest DRAFT -> CONSENT_PENDING transition, on the AWAITING_DECISION -> APPROVED transition, and on the APPROVED -> RELEASED transition"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — redaction level (evaluated top to bottom, first match wins)
      redaction_level =
          FULL    if student.privacy_hold == true and request.requester_type != GUARDIAN
          PARTIAL if request.purpose_code IN {ENROLLMENT, RESEARCH}
                     or ('MEDICATIONS' in request.scope and request.requester_type == AGENCY)
          NONE    otherwise

      # STEP 2 — per-family releasable counts, only for families named in scope
      visits_n     = count HealthVisit where student_id == s.id and status == CLOSED
      meds_n       = count MedicationAuthorization where student_id == s.id
                                                   and consent_status == CONSENT_GRANTED
      screenings_n = count Screening where student_id == s.id
                                       and status IN {COMPLETED, REFERRED, CLOSED}
      plans_n      = count ActionPlan where student_id == s.id
                                       and status IN {ACTIVE, SUPERSEDED, EXPIRED}

      # STEP 3 — redaction withholding, applied to the per-family counts
      if redaction_level == PARTIAL:
          visits_n -= count of those visits with complaint_code == MENTAL_HEALTH
          meds_n   -= count of those authorisations with is_controlled == true
      if redaction_level == FULL:
          release_package_item_count = 0 and the release is refused
                                        with ERR_PRIVACY_HOLD_BLOCKS_RELEASE (403)

      # STEP 4 — sum only the families present in scope
      release_package_item_count =
          (visits_n     if 'VISITS'       in scope else 0)
        + (meds_n       if 'MEDICATIONS'  in scope else 0)
        + (screenings_n if 'SCREENINGS'   in scope else 0)
        + (plans_n      if 'ACTION_PLANS' in scope else 0)
    input_set: |
      Only terminal-quality records are releasable: CLOSED visits (an OPEN,
      IN_ASSESSMENT, DISPOSITIONED or REOPENED encounter is never in a package),
      CONSENT_GRANTED authorisations (pending and withdrawn ones are excluded),
      COMPLETED / REFERRED / CLOSED screenings (SCHEDULED, RESCREEN_DUE and
      DECLINED are excluded) and ACTIVE / SUPERSEDED / EXPIRED plans (DRAFT,
      PENDING_GUARDIAN, PENDING_PROVIDER and REVOKED are excluded).
    constants:
      CONSENT_VALIDITY_DAYS: 30
      PARTIAL_WITHHOLD_COMPLAINTS: ["MENTAL_HEALTH"]
      PARTIAL_WITHHOLD_MEDICATIONS: ["METHYLPHENIDATE"]
    precision: "Integer counts; expires_at = consent_granted_at + 30 days and the release window is half-open, so a release at exactly expires_at is refused with ERR_DISCLOSURE_CONSENT_EXPIRED"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending `priority`; the first
# failing row wins and its error_id is the response)
# =============================================================================
validations:

  # --- 1. Authentication -----------------------------------------------------
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }

  # --- 2. Authorization ------------------------------------------------------
  - { priority: 2, category: auth, check: "the acting X-User-Role appears in the target endpoint's roles list", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "for an entity_backed role, X-User-ID matches the resource it claims: Guardian's X-User-ID equals the target row's student_id; SchoolNurse/HealthAide X-User-ID equals HealthVisit.nurse_id on assess/dispose/close/reopen and equals AdministrationRecord.administering_nurse_id on outcome/void", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "all Guardian endpoints; POST /health-office/health-visits/{id}/assess|dispose|close|reopen; POST /health-office/administration-records/{id}/outcome|void" }

  # --- 3. Existence ----------------------------------------------------------
  - { priority: 4, category: existence, check: "every referenced row exists, validated left-to-right over path parameters first and then over body foreign keys in the order they appear in the endpoint's input list", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }

  # --- 4. Payload shape ------------------------------------------------------
  - { priority: 5, category: business_constraint, check: "every non-optional field in the endpoint's input list is present and non-null", error_id: ERR_MISSING_REQUIRED_FIELD, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: business_constraint, check: "every supplied field satisfies its declared type, enum membership and numeric range, including limit in [1, 100] and offset >= 0 on list endpoints", error_id: ERR_INVALID_FIELD_VALUE, http_status: 422, applies_to: "all" }

  # --- 5. State preconditions ------------------------------------------------
  - { priority: 7, category: state, check: "the ActionPlan is in a from-state that admits the requested transition per §1.2 ActionPlan", error_id: ERR_PLAN_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/action-plans/{id}/submit|guardian-consent|decision|revoke" }
  - { priority: 8, category: state, check: "the MedicationAuthorization dimension being moved is in a from-state that admits the requested transition per §1.2 MedicationAuthorization", error_id: ERR_AUTHORIZATION_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/medication-authorizations/{id}/consent|clinical-review" }
  - { priority: 9, category: state, check: "the HealthVisit is in a from-state that admits the requested transition per §1.2 HealthVisit (create requires no visit; assess requires OPEN or REOPENED; dispose requires IN_ASSESSMENT; close requires DISPOSITIONED; reopen requires CLOSED; preparing a dose requires IN_ASSESSMENT or DISPOSITIONED)", error_id: ERR_VISIT_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/assess|dispose|close|reopen; POST /health-office/administration-records; POST /health-office/administration-records/stock-emergency" }
  - { priority: 10, category: state, check: "the AdministrationRecord is in a from-state that admits the requested outcome or void per §1.2 AdministrationRecord", error_id: ERR_ADMINISTRATION_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/administration-records/{id}/outcome|void" }
  - { priority: 11, category: state, check: "the MedicationStockLot is in a from-state that admits the requested inventory action (QUARANTINE requires AVAILABLE or DEPLETED; RESTORE requires QUARANTINED; RECEIVE and DISCARD require AVAILABLE, QUARANTINED or DEPLETED; an EXPIRED lot admits nothing)", error_id: ERR_LOT_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/medication-stock-lots/{id}/inventory-action" }
  - { priority: 12, category: state, check: "the Screening is in a from-state that admits the requested step (record-result requires SCHEDULED; SCHEDULE_RESCREEN requires RESCREEN_DUE; CLOSE_REFERRAL requires REFERRED)", error_id: ERR_SCREENING_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/screenings/{id}/record-result|follow-up" }
  - { priority: 13, category: state, check: "the DisclosureRequest is in a from-state that admits the requested step per §1.2 DisclosureRequest", error_id: ERR_DISCLOSURE_INVALID_STATE, http_status: 409, applies_to: "POST /health-office/disclosure-requests/{id}/submit|guardian-consent|decide|release" }

  # --- 6. Optimistic concurrency (OCC on the parent's version) ---------------
  - { priority: 14, category: state, check: "expected_student_version equals the current Student.version", error_id: ERR_STALE_STUDENT_VERSION, http_status: 412, applies_to: "POST /health-office/action-plans" }
  - { priority: 15, category: state, check: "expected_authorization_version equals the current MedicationAuthorization.version", error_id: ERR_STALE_AUTHORIZATION_VERSION, http_status: 412, applies_to: "POST /health-office/administration-records" }
  - { priority: 16, category: state, check: "expected_lot_version equals the current MedicationStockLot.version", error_id: ERR_STALE_LOT_VERSION, http_status: 412, applies_to: "POST /health-office/medication-stock-lots/{id}/inventory-action" }

  # --- 7a. Business rules — safety / compliance first ------------------------
  - { priority: 17, category: business_safety, check: "the referenced Student has enrollment_status == ENROLLED", error_id: ERR_STUDENT_NOT_ENROLLED, http_status: 409, applies_to: "POST /health-office/action-plans; POST /health-office/medication-authorizations; POST /health-office/health-visits; POST /health-office/screenings; POST /health-office/action-plans/{id}/submit; POST /health-office/medication-authorizations/{id}/consent" }
  - { priority: 18, category: business_safety, check: "the target School.coverage_posture is FULL or LIMITED; a building at UNCOVERED refuses new encounters", error_id: ERR_SCHOOL_COVERAGE_UNAVAILABLE, http_status: 409, applies_to: "POST /health-office/health-visits", note: "PRIORITY CONFLICT C — outranks the cot-capacity check at priority 34 (business_safety beats business_constraint on the same request)" }
  - { priority: 19, category: business_safety, check: "a CoverageAssignment exists with nurse_id == the acting nurse, school_id == the target school, status == ACTIVE, weekday == the weekday of the logical clock, and start_minute <= minute-of-day(clock) < end_minute", error_id: ERR_NURSE_NOT_ON_COVERAGE, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/assess; POST /health-office/screenings/{id}/record-result" }
  - { priority: 20, category: business_safety, check: "the acting nurse may give this medication: Nurse.credential == RN always qualifies; credential IN {LPN, HEALTH_AIDE} qualifies only when delegation_authorized == true AND the medication is not controlled", error_id: ERR_CREDENTIAL_NOT_DELEGATED, http_status: 403, applies_to: "POST /health-office/administration-records; POST /health-office/administration-records/stock-emergency; POST /health-office/administration-records/{id}/outcome" }
  - { priority: 21, category: business_safety, check: "when the medication is controlled (medication_code == METHYLPHENIDATE), witness_nurse_id is present", error_id: ERR_WITNESS_REQUIRED, http_status: 422, applies_to: "POST /health-office/administration-records; POST /health-office/administration-records/{id}/outcome" }
  - { priority: 22, category: business_safety, check: "segregation of duties: witness_nurse_id differs from administering_nurse_id on a controlled dose; the actor closing a screening referral differs from Screening.screened_by_nurse_id; the actor releasing a disclosure differs from DisclosureRequest.decided_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /health-office/administration-records; POST /health-office/administration-records/{id}/outcome; POST /health-office/screenings/{id}/follow-up; POST /health-office/disclosure-requests/{id}/release" }
  - { priority: 23, category: business_safety, check: "MedicationAuthorization.consent_status == CONSENT_GRANTED", error_id: ERR_CONSENT_NOT_GRANTED, http_status: 409, applies_to: "POST /health-office/administration-records", note: "PRIORITY CONFLICT A — outranked by the HealthVisit state check at priority 9 (state beats business_safety on the same request)" }
  - { priority: 24, category: business_safety, check: "MedicationAuthorization.clinical_status == VERIFIED", error_id: ERR_AUTHORIZATION_NOT_VERIFIED, http_status: 409, applies_to: "POST /health-office/administration-records" }
  - { priority: 25, category: business_safety, check: "ActionPlan.guardian_consent_at is not null before a provider decision may be recorded", error_id: ERR_GUARDIAN_CONSENT_MISSING, http_status: 409, applies_to: "POST /health-office/action-plans/{id}/decision" }
  - { priority: 26, category: business_safety, check: "a student with immunization_status == NONCOMPLIANT presenting with complaint_code == ILLNESS may not be dispositioned RETURN_TO_CLASS", error_id: ERR_IMMUNIZATION_HOLD, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/dispose" }
  - { priority: 27, category: business_safety, check: "a SEND_HOME disposition carries guardian_notified == true in the request body", error_id: ERR_GUARDIAN_NOTIFICATION_REQUIRED, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/dispose" }
  - { priority: 28, category: business_safety, check: "an EMS_TRANSPORT disposition requires acuity == EMERGENT or triage_score >= 85", error_id: ERR_EMS_DISPOSITION_NOT_JUSTIFIED, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/dispose" }
  - { priority: 29, category: business_safety, check: "the release is blocked when Student.privacy_hold == true and requester_type != GUARDIAN, or when the computed redaction_level == FULL", error_id: ERR_PRIVACY_HOLD_BLOCKS_RELEASE, http_status: 403, applies_to: "POST /health-office/disclosure-requests/{id}/decide; POST /health-office/disclosure-requests/{id}/release" }
  - { priority: 30, category: business_safety, check: "STOCK_EMERGENCY administration requires School.emergency_protocol_enabled == true and medication_code IN {EPINEPHRINE, ALBUTEROL}", error_id: ERR_STOCK_PROTOCOL_DISABLED, http_status: 409, applies_to: "POST /health-office/administration-records/stock-emergency" }

  # --- 7b. Business rules — temporal windows and interval geometry -----------
  - { priority: 31, category: business_temporal, check: "the logical clock satisfies valid_from <= clock < valid_until on the MedicationAuthorization", error_id: ERR_AUTHORIZATION_WINDOW_CLOSED, http_status: 409, applies_to: "POST /health-office/administration-records" }
  - { priority: 32, category: business_temporal, check: "for a PRN order with a prior ADMINISTERED dose, floor((clock - last_administered_at) in minutes) >= prn_min_interval_minutes", error_id: ERR_PRN_INTERVAL_NOT_ELAPSED, http_status: 409, applies_to: "POST /health-office/administration-records", note: "PRIORITY CONFLICT B — outranks the daily-cap check at priority 35 (business_temporal beats business_constraint on the same request)" }
  - { priority: 33, category: business_temporal, check: "INTERVAL RULE 1 (pairwise, half-open, travel buffer) — for the nurse named in the request, no existing CoverageAssignment with status IN {SCHEDULED, ACTIVE}, the same weekday and an overlapping effective-date range may conflict with the new block [start_minute, end_minute): two blocks at the SAME school may touch exactly (existing.end_minute == new.start_minute is accepted) but must not overlap; two blocks at DIFFERENT schools must additionally be separated by at least TRAVEL_BUFFER_MINUTES = 20 of clear time on both sides", error_id: ERR_COVERAGE_OVERLAP, http_status: 409, applies_to: "POST /health-office/coverage-assignments", note: "Resource entity: Nurse. Distinct from interval rule 2 at priority 34, which is an aggregate-capacity rule on School with closed intervals and no buffer." }
  - { priority: 34, category: business_constraint, check: "INTERVAL RULE 2 (aggregate capacity, closed intervals, no buffer) — a School's cot occupancy interval for a visit is [arrival_at, closed_at] with BOTH ends inclusive, and the count of HealthVisit rows whose occupancy interval contains the new arrival instant (status IN {OPEN, IN_ASSESSMENT, REOPENED}) must be strictly less than School.cot_capacity", error_id: ERR_OFFICE_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /health-office/health-visits; POST /health-office/health-visits/{id}/reopen", note: "Resource entity: School. Overlap is tolerated up to cot_capacity rather than forbidden pairwise, and adjacency does not free a cot until the closing instant has passed." }
  - { priority: 35, category: business_constraint, check: "MedicationAuthorization.doses_administered_today < max_doses_per_day", error_id: ERR_DAILY_DOSE_CAP_REACHED, http_status: 409, applies_to: "POST /health-office/administration-records" }
  - { priority: 36, category: business_temporal, check: "the reopen happens while clock < closed_at + REOPEN_WINDOW_MINUTES (120)", error_id: ERR_REOPEN_WINDOW_CLOSED, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/reopen" }
  - { priority: 37, category: business_temporal, check: "a manual void happens while clock < prepared_at + VOID_WINDOW_MINUTES (1440)", error_id: ERR_VOID_WINDOW_CLOSED, http_status: 409, applies_to: "POST /health-office/administration-records/{id}/void" }
  - { priority: 38, category: business_temporal, check: "the disclosure consent is still in force: clock < DisclosureRequest.expires_at", error_id: ERR_DISCLOSURE_CONSENT_EXPIRED, http_status: 409, applies_to: "POST /health-office/disclosure-requests/{id}/decide; POST /health-office/disclosure-requests/{id}/release" }
  - { priority: 39, category: business_temporal, check: "the lot's expiration_date is strictly greater than the logical clock", error_id: ERR_LOT_EXPIRED, http_status: 409, applies_to: "POST /health-office/medication-stock-lots; POST /health-office/medication-stock-lots/{id}/inventory-action" }

  # --- 7c. Business rules — referential and uniqueness -----------------------
  - { priority: 40, category: business_referential, check: "School.building_code is unique across all School rows", error_id: ERR_DUPLICATE_BUILDING_CODE, http_status: 409, applies_to: "POST /health-office/schools" }
  - { priority: 41, category: business_referential, check: "no other ActionPlan for the same student_id and condition_code has status == ACTIVE, unless supersedes_action_plan_id names exactly that plan", error_id: ERR_ACTIVE_PLAN_CONFLICT, http_status: 409, applies_to: "POST /health-office/action-plans" }
  - { priority: 42, category: business_referential, check: "MedicationAuthorization.student_id equals HealthVisit.student_id, and the winning lot's medication_code equals the required medication_code", error_id: ERR_LOT_MEDICATION_MISMATCH, http_status: 409, applies_to: "POST /health-office/administration-records; POST /health-office/administration-records/stock-emergency" }
  - { priority: 43, category: business_referential, check: "HealthVisit.pending_administration_count == 0 before the encounter may be closed", error_id: ERR_PENDING_ADMINISTRATION, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/close" }

  # --- 7d. Business rules — round caps and capacity/fiscal checks last -------
  - { priority: 44, category: business_constraint, check: "a REQUEST_REVISION decision requires ActionPlan.revision_round < MAX_REVISION_ROUNDS (2); the third such request on the same plan is refused and the plan stays PENDING_PROVIDER", error_id: ERR_REVISION_LIMIT_REACHED, http_status: 409, applies_to: "POST /health-office/action-plans/{id}/decision" }
  - { priority: 45, category: business_constraint, check: "HealthVisit.reopen_count < MAX_REOPENS (1)", error_id: ERR_REOPEN_LIMIT_REACHED, http_status: 409, applies_to: "POST /health-office/health-visits/{id}/reopen" }
  - { priority: 46, category: business_constraint, check: "Screening.cycle_number < MAX_SCREENING_CYCLES (3)", error_id: ERR_RESCREEN_LIMIT_REACHED, http_status: 409, applies_to: "POST /health-office/screenings/{id}/follow-up" }
  - { priority: 47, category: business_fiscal, check: "the post-move Nurse.uncommitted_weekly_minutes stays >= 0", error_id: ERR_NURSE_HOURS_EXCEEDED, http_status: 409, applies_to: "POST /health-office/coverage-assignments", note: "PRIORITY CONFLICT D — outranked by the coverage-overlap check at priority 33 (business_temporal beats business_fiscal on the same request)" }
  - { priority: 48, category: business_fiscal, check: "the stock_lot_selection candidate pool is non-empty", error_id: ERR_NO_ELIGIBLE_LOT, http_status: 409, applies_to: "POST /health-office/administration-records; POST /health-office/administration-records/stock-emergency" }
  - { priority: 49, category: business_fiscal, check: "the winning lot's quantity_available >= the requested units, and a DISCARD inventory action never drives quantity_on_hand below 0", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /health-office/administration-records; POST /health-office/administration-records/stock-emergency; POST /health-office/medication-stock-lots/{id}/inventory-action" }

# =============================================================================
# §1.5 API Endpoint Table  (all paths carry the /health-office prefix; every
# path parameter is spelled {id})
# =============================================================================
endpoints:

  # --- School ----------------------------------------------------------------
  - method: POST
    path: "/health-office/schools"
    description: "Register a building with a health office"
    roles: [DistrictHealthAdmin]
    code: 201
    input: [name, building_code, cot_capacity, "emergency_protocol_enabled?"]
    output: School
    side_effects:
      - "initialises enrolled_student_count = 0, occupied_cot_count = 0, required_stock_units = 0"
      - "runs school_days_of_supply, stock_protocol_status and school_coverage_posture, yielding coverage_posture = UNCOVERED and stock_protocol_status = DEPLETED for an empty building"

  - method: GET
    path: "/health-office/schools/{id}"
    description: "Read one building with all derived staffing and stock fields"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: []
    output: School
    side_effects: []

  # --- Nurse -----------------------------------------------------------------
  - method: POST
    path: "/health-office/nurses"
    description: "Register a nurse or health aide and their weekly contracted minutes"
    roles: [DistrictHealthAdmin]
    code: 201
    input: [full_name, credential, weekly_contracted_minutes, "delegation_authorized?"]
    output: Nurse
    side_effects:
      - "sets employment_status = ACTIVE, committed_weekly_minutes = 0, uncommitted_weekly_minutes = weekly_contracted_minutes, assigned_school_count = 0"

  - method: GET
    path: "/health-office/nurses/{id}"
    description: "Read one nurse with the two conservation counters"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: []
    output: Nurse
    side_effects: []

  - method: PATCH
    path: "/health-office/nurses/{id}"
    description: "Update a nurse's employment_status or delegation_authorized flag"
    roles: [DistrictHealthAdmin]
    code: 200
    input: ["employment_status?", "delegation_authorized?"]
    output: Nurse
    side_effects:
      - "recomputes school_nurse_coverage_ratio (both variants) and school_coverage_posture for every school the nurse holds a CoverageAssignment at with status IN {SCHEDULED, ACTIVE}"
      - "increments Nurse.version by 1"

  # --- CoverageAssignment ----------------------------------------------------
  - method: POST
    path: "/health-office/coverage-assignments"
    description: "Assign a nurse to a building for a recurring weekday block"
    roles: [DistrictHealthAdmin]
    code: 201
    input: [nurse_id, school_id, weekday, start_minute, end_minute, effective_from, "effective_to?"]
    output: CoverageAssignment
    side_effects:
      - "enforces interval rule 1 (pairwise half-open with a 20-minute travel buffer between different schools)"
      - "moves nurse_minute_conservation counters: Nurse.committed_weekly_minutes += duration_minutes, Nurse.uncommitted_weekly_minutes -= duration_minutes"
      - "recomputes Nurse.assigned_school_count"
      - "recomputes school_nurse_coverage_ratio (both variants), stock_protocol_status and school_coverage_posture for the school"

  - method: GET
    path: "/health-office/coverage-assignments"
    description: "List coverage blocks, filterable by nurse, building, weekday and derived status"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["nurse_id?", "school_id?", "weekday?", "status?", "limit?", "offset?"]
    output: CoverageAssignment[]
    side_effects: []

  - method: GET
    path: "/health-office/coverage-assignments/{id}"
    description: "Read one coverage block"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: []
    output: CoverageAssignment
    side_effects: []

  - method: POST
    path: "/health-office/coverage-assignments/{id}/end"
    description: "End a coverage block at the supplied instant; the compensating half of nurse_minute_conservation"
    roles: [DistrictHealthAdmin]
    code: 200
    input: [effective_to]
    output: CoverageAssignment
    side_effects:
      - "sets effective_to, which drives status to ENDED once the clock reaches it"
      - "returns minutes: Nurse.committed_weekly_minutes -= duration_minutes, Nurse.uncommitted_weekly_minutes += duration_minutes"
      - "recomputes Nurse.assigned_school_count"
      - "recomputes school_nurse_coverage_ratio (both variants) and school_coverage_posture for the school"

  # --- Student ---------------------------------------------------------------
  - method: POST
    path: "/health-office/students"
    description: "Enrol a student and record the health profile that seeds the intake risk score"
    roles: [DistrictHealthAdmin, SchoolNurse]
    code: 201
    input: [school_id, full_name, grade_level, date_of_birth, allergy_severity, chronic_condition_codes, immunization_status, "privacy_hold?"]
    output: Student
    side_effects:
      - "sets enrollment_status = ENROLLED"
      - "runs student_risk_scoring INTAKE, sets observed_risk_score = 0, effective_risk_score and risk_tier"
      - "computes alert_flags (ALLERGY_ANAPHYLAXIS when allergy_severity == ANAPHYLAXIS, IMMUNIZATION_HOLD when immunization_status == NONCOMPLIANT, NO_ACTIVE_PLAN always at creation)"
      - "increments School.enrolled_student_count, then runs stock_protocol_requirement, stock_protocol_status and school_coverage_posture for the school"

  - method: GET
    path: "/health-office/students/{id}"
    description: "Read one student with both risk variants, alert flags and the active plan pointer"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer, Guardian]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/health-office/students"
    description: "List students, filterable by building, enrolment state, risk tier and alert flag"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["school_id?", "enrollment_status?", "risk_tier?", "alert_flag?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: PATCH
    path: "/health-office/students/{id}"
    description: "Amend the health profile, privacy hold or enrolment state of a student"
    roles: [DistrictHealthAdmin, SchoolNurse]
    code: 200
    input: ["allergy_severity?", "chronic_condition_codes?", "immunization_status?", "privacy_hold?", "enrollment_status?"]
    output: Student
    side_effects:
      - "re-runs student_risk_scoring INTAKE and re-tiers effective_risk_score"
      - "recomputes alert_flags"
      - "when enrollment_status moves out of ENROLLED, every Screening for the student with status IN {SCHEDULED, RESCREEN_DUE} moves to DECLINED"
      - "recomputes School.enrolled_student_count, stock_protocol_requirement, stock_protocol_status, school_nurse_coverage_ratio and school_coverage_posture for the school"
      - "increments Student.version by 1"

  # --- ActionPlan ------------------------------------------------------------
  - method: POST
    path: "/health-office/action-plans"
    description: "Draft a chronic-condition action plan, optionally superseding an existing plan"
    roles: [SchoolNurse]
    code: 201
    input: [student_id, condition_code, severity_score, requires_stock_epinephrine, self_carry_requested, effective_from, expected_student_version, "supersedes_action_plan_id?"]
    output: ActionPlan
    side_effects:
      - "sets status = DRAFT, revision_round = 0"
      - "increments Student.version by 1"
      - "recomputes Student.alert_flags"

  - method: GET
    path: "/health-office/action-plans/{id}"
    description: "Read one action plan"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer, Guardian]
    code: 200
    input: []
    output: ActionPlan
    side_effects: []

  - method: GET
    path: "/health-office/action-plans"
    description: "List action plans, filterable by student, status, condition and the self-referential supersede pointer"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["student_id?", "status?", "condition_code?", "supersedes_action_plan_id?", "limit?", "offset?"]
    output: ActionPlan[]
    side_effects: []

  - method: POST
    path: "/health-office/action-plans/{id}/submit"
    description: "Send a drafted plan to the guardian for consent"
    roles: [SchoolNurse]
    code: 200
    input: []
    output: ActionPlan
    side_effects:
      - "DRAFT -> PENDING_GUARDIAN"

  - method: POST
    path: "/health-office/action-plans/{id}/guardian-consent"
    description: "Guardian records consent to the plan, advancing it to the provider queue"
    roles: [Guardian]
    code: 200
    input: []
    output: ActionPlan
    side_effects:
      - "sets guardian_consent_at = clock; PENDING_GUARDIAN -> PENDING_PROVIDER"

  - method: POST
    path: "/health-office/action-plans/{id}/decision"
    description: "Physician approves the plan or sends it back for revision; a third revision request revokes it"
    roles: [SchoolPhysician]
    code: 200
    input: [decision, "note?"]
    output: ActionPlan
    side_effects:
      - "APPROVE: PENDING_PROVIDER -> ACTIVE, sets provider_signed_at and review_due_at, then runs the four-hop supersede cascade declared on the ActionPlan ACTIVE -> SUPERSEDED transition"
      - "REQUEST_REVISION with revision_round < 2: PENDING_PROVIDER -> DRAFT, increments revision_round, clears guardian_consent_at"
      - "REQUEST_REVISION with revision_round == 2: refused with ERR_REVISION_LIMIT_REACHED; the plan stays PENDING_PROVIDER and the physician must use POST /health-office/action-plans/{id}/revoke instead"
      - "recomputes Student.active_action_plan_id, Student.self_carry_authorized, Student.alert_flags, stock_protocol_requirement and stock_protocol_status"

  - method: POST
    path: "/health-office/action-plans/{id}/revoke"
    description: "Withdraw a plan at any non-terminal stage"
    roles: [SchoolPhysician]
    code: 200
    input: ["reason_code?"]
    output: ActionPlan
    side_effects:
      - "sets status = REVOKED and suspends every MedicationAuthorization linked to the plan with clinical_status IN {UNVERIFIED, VERIFIED}"
      - "recomputes Student.active_action_plan_id, Student.self_carry_authorized and Student.alert_flags"

  # --- MedicationAuthorization ------------------------------------------------
  - method: POST
    path: "/health-office/medication-authorizations"
    description: "Record a medication order for a student, optionally hung off an action plan"
    roles: [SchoolNurse]
    code: 201
    input: [student_id, medication_code, route, dose_amount, dose_unit, schedule_type, max_doses_per_day, valid_from, valid_until, "action_plan_id?", "prn_min_interval_minutes?"]
    output: MedicationAuthorization
    side_effects:
      - "sets consent_status = CONSENT_PENDING, clinical_status = UNVERIFIED, dispensable = false, is_controlled = (medication_code == METHYLPHENIDATE)"
      - "recomputes Student.alert_flags"

  - method: GET
    path: "/health-office/medication-authorizations/{id}"
    description: "Read one medication order with both state dimensions and the derived dispensable flag"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer, Guardian]
    code: 200
    input: []
    output: MedicationAuthorization
    side_effects: []

  - method: GET
    path: "/health-office/medication-authorizations"
    description: "List medication orders, filterable by student, plan, drug and either state dimension"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["student_id?", "action_plan_id?", "medication_code?", "consent_status?", "clinical_status?", "limit?", "offset?"]
    output: MedicationAuthorization[]
    side_effects: []

  - method: POST
    path: "/health-office/medication-authorizations/{id}/consent"
    description: "Guardian grants or withdraws consent on the consent_status dimension"
    roles: [Guardian]
    code: 200
    input: [decision]
    output: MedicationAuthorization
    side_effects:
      - "GRANT: CONSENT_PENDING or CONSENT_WITHDRAWN -> CONSENT_GRANTED; recomputes dispensable"
      - "WITHDRAW: CONSENT_GRANTED -> CONSENT_WITHDRAWN; voids every PREPARED AdministrationRecord on this order, releasing reservations and recomputing school stock posture"

  - method: POST
    path: "/health-office/medication-authorizations/{id}/clinical-review"
    description: "Verify or suspend the order on the clinical_status dimension"
    roles: [SchoolNurse, SchoolPhysician]
    code: 200
    input: [decision, "note?"]
    output: MedicationAuthorization
    side_effects:
      - "VERIFY (SchoolNurse with credential RN): UNVERIFIED or SUSPENDED -> VERIFIED; requires action_plan_id null or the plan ACTIVE; recomputes dispensable"
      - "SUSPEND (SchoolPhysician): VERIFIED -> SUSPENDED; voids every PREPARED AdministrationRecord on this order"

  # --- MedicationStockLot -----------------------------------------------------
  - method: POST
    path: "/health-office/medication-stock-lots"
    description: "Receive a lot of medication into a building's storage"
    roles: [DistrictHealthAdmin]
    code: 201
    input: [school_id, medication_code, lot_number, is_stock_protocol, initial_quantity, expiration_date]
    output: MedicationStockLot
    side_effects:
      - "sets received_total = initial_quantity, quantity_on_hand = initial_quantity, all other counters 0, status = AVAILABLE"
      - "runs school_days_of_supply, stock_protocol_status and school_coverage_posture for the school"

  - method: GET
    path: "/health-office/medication-stock-lots/{id}"
    description: "Read one lot with the four conservation counters and its days of supply"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician]
    code: 200
    input: []
    output: MedicationStockLot
    side_effects: []

  - method: GET
    path: "/health-office/medication-stock-lots"
    description: "List lots, filterable by building, drug, status and stock-protocol designation"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician]
    code: 200
    input: ["school_id?", "medication_code?", "status?", "is_stock_protocol?", "limit?", "offset?"]
    output: MedicationStockLot[]
    side_effects: []

  - method: POST
    path: "/health-office/medication-stock-lots/{id}/inventory-action"
    description: "Receive, discard, quarantine or restore a lot under optimistic concurrency on the lot version"
    roles: [DistrictHealthAdmin]
    code: 200
    input: [action, expected_lot_version, "units?", "reason_code?"]
    output: MedicationStockLot
    side_effects:
      - "RECEIVE: received_total += units, quantity_on_hand += units; a DEPLETED lot returns to AVAILABLE"
      - "DISCARD: quantity_on_hand -= units, quantity_wasted += units; received_total unchanged; a lot reaching quantity_on_hand == 0 moves AVAILABLE -> DEPLETED"
      - "QUARANTINE: AVAILABLE or DEPLETED -> QUARANTINED, then the four-hop cascade declared on that transition"
      - "RESTORE: QUARANTINED -> AVAILABLE"
      - "increments MedicationStockLot.version by 1"
      - "recomputes lot.days_of_supply, school_days_of_supply, stock_protocol_status and school_coverage_posture"

  # --- HealthVisit ------------------------------------------------------------
  - method: POST
    path: "/health-office/health-visits"
    description: "Open an office encounter; the triage score is frozen at this instant"
    roles: [SchoolNurse, HealthAide]
    code: 201
    input: [student_id, school_id, nurse_id, complaint_code, acuity]
    output: HealthVisit
    side_effects:
      - "sets arrival_at = clock, status = OPEN"
      - "runs visit_triage_score and sets requires_ems_review = (triage_score >= 85)"
      - "increments School.occupied_cot_count by 1"

  - method: GET
    path: "/health-office/health-visits/{id}"
    description: "Read one encounter with its triage score, disposition and pending-dose count"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer, Guardian]
    code: 200
    input: []
    output: HealthVisit
    side_effects: []

  - method: GET
    path: "/health-office/health-visits"
    description: "List encounters, filterable by student, building, nurse, status and disposition"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["student_id?", "school_id?", "nurse_id?", "status?", "disposition?", "limit?", "offset?"]
    output: HealthVisit[]
    side_effects: []

  - method: POST
    path: "/health-office/health-visits/{id}/assess"
    description: "Move an open or reopened encounter into assessment; requires the acting nurse to be on coverage right now"
    roles: [SchoolNurse, HealthAide]
    code: 200
    input: ["assessment_note?"]
    output: HealthVisit
    side_effects:
      - "OPEN or REOPENED -> IN_ASSESSMENT and stores assessment_note"

  - method: POST
    path: "/health-office/health-visits/{id}/dispose"
    description: "Record one of the four dispositions; each branch carries a different side-effect set"
    roles: [SchoolNurse, HealthAide]
    code: 200
    input: [disposition, "guardian_notified?"]
    output: HealthVisit
    side_effects:
      - "IN_ASSESSMENT -> DISPOSITIONED with the branch-specific effects declared in §1.2 HealthVisit"
      - "decrements School.occupied_cot_count by 1"
      - "SEND_HOME and EMS_TRANSPORT recompute student_risk_scoring OBSERVED and re-tier the student"

  - method: POST
    path: "/health-office/health-visits/{id}/close"
    description: "Close a dispositioned encounter once no dose is still reserved for it"
    roles: [SchoolNurse, HealthAide]
    code: 200
    input: []
    output: HealthVisit
    side_effects:
      - "DISPOSITIONED -> CLOSED, sets closed_at = clock and minutes_in_office"
      - "recomputes student_risk_scoring OBSERVED and re-tiers the student"

  - method: POST
    path: "/health-office/health-visits/{id}/reopen"
    description: "Reopen a recently closed encounter, re-occupying a cot and re-scoring triage"
    roles: [SchoolNurse]
    code: 200
    input: ["reason_code?"]
    output: HealthVisit
    side_effects:
      - "CLOSED -> REOPENED, clears disposition and closed_at, increments reopen_count and School.occupied_cot_count"
      - "re-runs visit_triage_score against current student risk_tier and school coverage_posture"

  # --- AdministrationRecord ----------------------------------------------------
  - method: POST
    path: "/health-office/administration-records"
    description: "Reserve a dose against a medication order under optimistic concurrency on the order version"
    roles: [SchoolNurse, HealthAide]
    code: 201
    input: [visit_id, authorization_id, units, expected_authorization_version, "witness_nurse_id?"]
    output: AdministrationRecord
    side_effects:
      - "runs stock_lot_selection to pick lot_id, then reserves units (quantity_on_hand -= units, quantity_reserved += units)"
      - "sets protocol_mode = AUTHORIZED, status = PREPARED, prepared_at = clock, administering_nurse_id = X-User-ID"
      - "increments HealthVisit.pending_administration_count by 1"
      - "increments MedicationAuthorization.version by 1"
      - "recomputes lot.days_of_supply, school_days_of_supply, stock_protocol_status and school_coverage_posture"

  - method: POST
    path: "/health-office/administration-records/stock-emergency"
    description: "Reserve a dose from undesignated emergency stock with no medication order behind it"
    roles: [SchoolNurse, HealthAide]
    code: 201
    input: [visit_id, medication_code, units, "witness_nurse_id?"]
    output: AdministrationRecord
    side_effects:
      - "runs stock_lot_selection restricted to lots with is_stock_protocol == true, then reserves units"
      - "sets authorization_id = null, protocol_mode = STOCK_EMERGENCY, status = PREPARED, prepared_at = clock, dose_amount from STOCK_PROTOCOL_DOSE"
      - "increments HealthVisit.pending_administration_count by 1"
      - "recomputes lot.days_of_supply, school_days_of_supply, stock_protocol_status and school_coverage_posture"

  - method: GET
    path: "/health-office/administration-records/{id}"
    description: "Read one administration record"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: []
    output: AdministrationRecord
    side_effects: []

  - method: GET
    path: "/health-office/administration-records"
    description: "List administration records, filterable by encounter, order, lot, either nurse role and status"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["visit_id?", "authorization_id?", "lot_id?", "administering_nurse_id?", "witness_nurse_id?", "status?", "protocol_mode?", "limit?", "offset?"]
    output: AdministrationRecord[]
    side_effects: []

  - method: POST
    path: "/health-office/administration-records/{id}/outcome"
    description: "Record the outcome of a prepared dose: given, refused, or wasted"
    roles: [SchoolNurse, HealthAide]
    code: 200
    input: [outcome, "reason_code?", "witness_nurse_id?"]
    output: AdministrationRecord
    side_effects:
      - "ADMINISTERED: quantity_reserved -= units, quantity_administered += units; a lot at quantity_on_hand == 0 moves AVAILABLE -> DEPLETED; recomputes doses_administered_today, last_administered_at and student_risk_scoring OBSERVED"
      - "REFUSED: quantity_reserved -= units, quantity_on_hand += units"
      - "WASTED: quantity_reserved -= units, quantity_wasted += units"
      - "decrements HealthVisit.pending_administration_count by 1 in every branch"
      - "recomputes lot.days_of_supply, school_days_of_supply, stock_protocol_status and school_coverage_posture"

  - method: POST
    path: "/health-office/administration-records/{id}/void"
    description: "Void a mis-entered record; the compensating action of lot_unit_conservation"
    roles: [SchoolNurse]
    code: 200
    input: [reason_code]
    output: AdministrationRecord
    side_effects:
      - "reverses the source state's unit movement exactly and leaves received_total unchanged"
      - "a DEPLETED lot with quantity_on_hand > 0 returns to AVAILABLE"
      - "recomputes doses_administered_today, last_administered_at, student_risk_scoring OBSERVED, lot.days_of_supply, school_days_of_supply, stock_protocol_status and school_coverage_posture"

  # --- Screening ---------------------------------------------------------------
  - method: POST
    path: "/health-office/screenings"
    description: "Schedule a vision, hearing or scoliosis screening for a student"
    roles: [SchoolNurse]
    code: 201
    input: [student_id, school_id, screening_type, scheduled_for]
    output: Screening
    side_effects:
      - "sets status = SCHEDULED, cycle_number = 1"

  - method: GET
    path: "/health-office/screenings/{id}"
    description: "Read one screening with its outcome, rescreen clock and referral clock"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer, Guardian]
    code: 200
    input: []
    output: Screening
    side_effects: []

  - method: GET
    path: "/health-office/screenings"
    description: "List screenings, filterable by student, building, recording nurse, programme and status"
    roles: [DistrictHealthAdmin, SchoolNurse, HealthAide, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["student_id?", "school_id?", "screened_by_nurse_id?", "screening_type?", "status?", "limit?", "offset?"]
    output: Screening[]
    side_effects: []

  - method: POST
    path: "/health-office/screenings/{id}/record-result"
    description: "Record a measurement; screening_outcome_classification forks the screening into PASS, REFER or INCONCLUSIVE"
    roles: [SchoolNurse]
    code: 200
    input: [result_value, screened_by_nurse_id]
    output: Screening
    side_effects:
      - "PASS: SCHEDULED -> COMPLETED"
      - "REFER: SCHEDULED -> REFERRED, sets referral_due_at = clock + 30 days and adds SCREENING_REFERRAL to Student.alert_flags"
      - "INCONCLUSIVE: SCHEDULED -> RESCREEN_DUE, sets rescreen_due_at = clock + 14 days"
      - "stores screened_by_nurse_id, which anchors the segregation-of-duties rule on referral closure"

  - method: POST
    path: "/health-office/screenings/{id}/follow-up"
    description: "Book the next rescreen round or close an outstanding referral"
    roles: [SchoolNurse]
    code: 200
    input: [action, "scheduled_for?", "referral_outcome?"]
    output: Screening
    side_effects:
      - "SCHEDULE_RESCREEN: RESCREEN_DUE -> SCHEDULED, increments cycle_number, clears outcome and result_value"
      - "CLOSE_REFERRAL: REFERRED -> CLOSED, sets referral_outcome and referral_completed_at, and drops SCREENING_REFERRAL from Student.alert_flags when no other REFERRED screening remains"

  # --- DisclosureRequest --------------------------------------------------------
  - method: POST
    path: "/health-office/disclosure-requests"
    description: "Open a health-records release request for a student"
    roles: [RecordsOfficer]
    code: 201
    input: [student_id, requester_type, requester_reference, scope, purpose_code]
    output: DisclosureRequest
    side_effects:
      - "sets status = DRAFT, release_package_item_count = 0"
      - "runs disclosure_redaction_and_package step 1 to set redaction_level"

  - method: GET
    path: "/health-office/disclosure-requests/{id}"
    description: "Read one release request with its redaction level and package size"
    roles: [DistrictHealthAdmin, SchoolPhysician, RecordsOfficer, Guardian]
    code: 200
    input: []
    output: DisclosureRequest
    side_effects: []

  - method: GET
    path: "/health-office/disclosure-requests"
    description: "List release requests, filterable by student, status and requester type"
    roles: [DistrictHealthAdmin, SchoolPhysician, RecordsOfficer]
    code: 200
    input: ["student_id?", "status?", "requester_type?", "limit?", "offset?"]
    output: DisclosureRequest[]
    side_effects: []

  - method: POST
    path: "/health-office/disclosure-requests/{id}/submit"
    description: "Send the drafted request to the guardian for release consent"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: DisclosureRequest
    side_effects:
      - "DRAFT -> CONSENT_PENDING and recomputes redaction_level"

  - method: POST
    path: "/health-office/disclosure-requests/{id}/guardian-consent"
    description: "Guardian grants release consent or withdraws it, revoking the request"
    roles: [Guardian]
    code: 200
    input: [decision]
    output: DisclosureRequest
    side_effects:
      - "GRANT: CONSENT_PENDING -> AWAITING_DECISION, sets consent_granted_at = clock and expires_at = consent_granted_at + 30 days"
      - "WITHDRAW: CONSENT_PENDING, AWAITING_DECISION or APPROVED -> REVOKED and clears consent_granted_at and expires_at"

  - method: POST
    path: "/health-office/disclosure-requests/{id}/decide"
    description: "Physician approves or denies the release; approval records the deciding operator id"
    roles: [SchoolPhysician]
    code: 200
    input: [decision, "redaction_override?"]
    output: DisclosureRequest
    side_effects:
      - "APPROVE: AWAITING_DECISION -> APPROVED, sets decided_by_user_id = X-User-ID; a redaction_override may only tighten NONE to PARTIAL"
      - "DENY: AWAITING_DECISION -> DENIED and zeroes release_package_item_count"

  - method: POST
    path: "/health-office/disclosure-requests/{id}/release"
    description: "Release the package; the releasing operator must differ from the deciding operator"
    roles: [RecordsOfficer]
    code: 200
    input: []
    output: DisclosureRequest
    side_effects:
      - "APPROVED -> RELEASED, sets released_by_user_id = X-User-ID and released_at = clock"
      - "runs disclosure_redaction_and_package steps 2-4 to set release_package_item_count"

  # --- System / test-driving ------------------------------------------------------
  - method: POST
    path: "/health-office/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every window, expiry and coverage-block evaluation in this scaffold reads this clock."
    roles: [DistrictHealthAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "advances the logical clock; recomputes CoverageAssignment.status, MedicationAuthorization.dispensable and every school's coverage_posture on the next read"

  - method: POST
    path: "/health-office/_ops/run-daily-checkpoint"
    description: "Advance the operational epoch: expire plans, orders, lots and consents, promote overdue rescreens, and recompute every derived school field"
    roles: [DistrictHealthAdmin]
    code: 200
    input: ["school_id?"]
    output: "{ epoch: integer, expired_action_plan_ids: string_array, expired_authorization_ids: string_array, expired_lot_ids: string_array, expired_disclosure_ids: string_array, promoted_screening_ids: string_array, voided_administration_ids: string_array, recomputed_school_ids: string_array }"
    side_effects:
      - "ActionPlan ACTIVE with review_due_at <= clock -> EXPIRED, suspending linked orders"
      - "MedicationAuthorization with clock >= valid_until -> clinical_status EXPIRED, voiding its PREPARED records"
      - "MedicationStockLot with expiration_date <= clock -> EXPIRED, voiding PREPARED records drawing on it"
      - "DisclosureRequest APPROVED with clock >= expires_at -> EXPIRED"
      - "Screening RESCREEN_DUE with rescreen_due_at <= clock -> REFERRED"
      - "re-runs school_nurse_coverage_ratio, stock_protocol_requirement, school_days_of_supply, stock_protocol_status, school_coverage_posture and student_risk_scoring OBSERVED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed in the target endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An entity_backed role acted on a resource it does not own: a Guardian whose X-User-ID is not the row's student_id, or a nurse whose X-User-ID is not the encounter's nurse_id or the record's administering_nurse_id" }
  - { id: ERR_CREDENTIAL_NOT_DELEGATED, http: 403, condition: "An LPN or HEALTH_AIDE without delegation_authorized, or any non-RN handling a controlled medication, attempted an administration step" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The witness equals the administering nurse on a controlled dose, the referral closer equals the recording nurse, or the disclosure releaser equals the deciding operator" }
  - { id: ERR_PRIVACY_HOLD_BLOCKS_RELEASE, http: 403, condition: "Release or approval attempted while Student.privacy_hold == true for a non-guardian requester, or while redaction_level == FULL" }

  # --- payload / existence ---------------------------------------------------
  - { id: ERR_MISSING_REQUIRED_FIELD, http: 400, condition: "A field the endpoint declares as required is absent or null" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "A field violates its declared type, enum membership or numeric range, including limit outside [1, 100] or a negative offset" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A referenced School, Nurse, CoverageAssignment, Student, ActionPlan, MedicationAuthorization, MedicationStockLot, HealthVisit, AdministrationRecord, Screening or DisclosureRequest row does not exist" }

  # --- state preconditions ---------------------------------------------------
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "The ActionPlan is not in a from-state that admits the requested transition" }
  - { id: ERR_AUTHORIZATION_INVALID_STATE, http: 409, condition: "The MedicationAuthorization dimension being moved is not in a from-state that admits the requested transition" }
  - { id: ERR_VISIT_INVALID_STATE, http: 409, condition: "The HealthVisit is not in a from-state that admits the requested transition, including preparing a dose against an encounter outside {IN_ASSESSMENT, DISPOSITIONED}" }
  - { id: ERR_ADMINISTRATION_INVALID_STATE, http: 409, condition: "The AdministrationRecord is not in a from-state that admits the requested outcome or void" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "The MedicationStockLot is not in a from-state that admits the requested inventory action" }
  - { id: ERR_SCREENING_INVALID_STATE, http: 409, condition: "The Screening is not in a from-state that admits the requested result or follow-up step" }
  - { id: ERR_DISCLOSURE_INVALID_STATE, http: 409, condition: "The DisclosureRequest is not in a from-state that admits the requested step" }

  # --- optimistic concurrency ------------------------------------------------
  - { id: ERR_STALE_STUDENT_VERSION, http: 412, condition: "expected_student_version does not equal the current Student.version on action-plan creation" }
  - { id: ERR_STALE_AUTHORIZATION_VERSION, http: 412, condition: "expected_authorization_version does not equal the current MedicationAuthorization.version on dose preparation" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_lot_version does not equal the current MedicationStockLot.version on an inventory action" }

  # --- clinical safety and compliance ----------------------------------------
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "The referenced Student has enrollment_status TRANSFERRED or WITHDRAWN" }
  - { id: ERR_SCHOOL_COVERAGE_UNAVAILABLE, http: 409, condition: "A new encounter was requested at a building whose coverage_posture is UNCOVERED" }
  - { id: ERR_NURSE_NOT_ON_COVERAGE, http: 409, condition: "No CoverageAssignment with status ACTIVE places the acting nurse at that building for the current weekday and minute-of-day" }
  - { id: ERR_WITNESS_REQUIRED, http: 422, condition: "A controlled medication step was attempted without witness_nurse_id" }
  - { id: ERR_CONSENT_NOT_GRANTED, http: 409, condition: "Dose preparation attempted while consent_status is CONSENT_PENDING or CONSENT_WITHDRAWN" }
  - { id: ERR_AUTHORIZATION_NOT_VERIFIED, http: 409, condition: "Dose preparation attempted while clinical_status is UNVERIFIED, SUSPENDED or EXPIRED" }
  - { id: ERR_GUARDIAN_CONSENT_MISSING, http: 409, condition: "A provider decision was attempted on a plan whose guardian_consent_at is null" }
  - { id: ERR_IMMUNIZATION_HOLD, http: 409, condition: "RETURN_TO_CLASS was requested for an ILLNESS encounter of a student whose immunization_status is NONCOMPLIANT" }
  - { id: ERR_GUARDIAN_NOTIFICATION_REQUIRED, http: 409, condition: "SEND_HOME was requested without guardian_notified == true in the body" }
  - { id: ERR_EMS_DISPOSITION_NOT_JUSTIFIED, http: 409, condition: "EMS_TRANSPORT was requested for an encounter that is neither EMERGENT nor scored at triage_score >= 85" }
  - { id: ERR_STOCK_PROTOCOL_DISABLED, http: 409, condition: "STOCK_EMERGENCY administration attempted at a building with emergency_protocol_enabled == false, or for a medication outside {EPINEPHRINE, ALBUTEROL}" }

  # --- temporal windows and interval geometry --------------------------------
  - { id: ERR_AUTHORIZATION_WINDOW_CLOSED, http: 409, condition: "The logical clock is before valid_from or at/after valid_until on the medication order" }
  - { id: ERR_PRN_INTERVAL_NOT_ELAPSED, http: 409, condition: "A PRN dose was requested before prn_min_interval_minutes had fully elapsed since last_administered_at" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "The requested coverage block collides with an existing block for the same nurse on the same weekday, either by overlapping [start_minute, end_minute) at the same school or by leaving less than 20 minutes of travel buffer between different schools" }
  - { id: ERR_OFFICE_CAPACITY_EXCEEDED, http: 409, condition: "The count of encounters whose closed-interval cot occupancy contains the new arrival instant already equals School.cot_capacity" }
  - { id: ERR_REOPEN_WINDOW_CLOSED, http: 409, condition: "A reopen was requested at or after closed_at + 120 minutes" }
  - { id: ERR_VOID_WINDOW_CLOSED, http: 409, condition: "A manual void was requested at or after prepared_at + 1440 minutes" }
  - { id: ERR_DISCLOSURE_CONSENT_EXPIRED, http: 409, condition: "A decision or release was attempted at or after DisclosureRequest.expires_at" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "A lot was created with expiration_date at or before the clock, or an inventory action targeted a lot whose expiration_date has passed" }

  # --- referential integrity and uniqueness ----------------------------------
  - { id: ERR_DUPLICATE_BUILDING_CODE, http: 409, condition: "A School with the same building_code already exists" }
  - { id: ERR_ACTIVE_PLAN_CONFLICT, http: 409, condition: "Another ActionPlan for the same student and condition_code is already ACTIVE and is not named by supersedes_action_plan_id" }
  - { id: ERR_LOT_MEDICATION_MISMATCH, http: 409, condition: "The order's student_id differs from the encounter's student_id, or the selected lot's medication_code differs from the required medication_code" }
  - { id: ERR_PENDING_ADMINISTRATION, http: 409, condition: "Close was requested while the encounter still has an AdministrationRecord in status PREPARED" }

  # --- round caps, capacity and fiscal ---------------------------------------
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "A REQUEST_REVISION decision was made on a plan whose revision_round is already 2" }
  - { id: ERR_REOPEN_LIMIT_REACHED, http: 409, condition: "A second reopen was requested on an encounter whose reopen_count is already 1" }
  - { id: ERR_RESCREEN_LIMIT_REACHED, http: 409, condition: "A fourth screening cycle was requested on a screening whose cycle_number is already 3" }
  - { id: ERR_DAILY_DOSE_CAP_REACHED, http: 409, condition: "doses_administered_today already equals max_doses_per_day for the order" }
  - { id: ERR_NURSE_HOURS_EXCEEDED, http: 409, condition: "The requested coverage block would drive the nurse's uncommitted_weekly_minutes below zero" }
  - { id: ERR_NO_ELIGIBLE_LOT, http: 409, condition: "The stock_lot_selection candidate pool is empty for the required medication, building and protocol mode" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "The winning lot holds fewer available units than requested, or a DISCARD would drive quantity_on_hand below zero" }

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: DistrictHealthAdmin
    description: "District health services operator: owns buildings, staffing, medication inventory, the logical clock and the daily checkpoint. Never touches a clinical encounter."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-office/schools"
      - "POST /health-office/nurses"
      - "PATCH /health-office/nurses/{id}"
      - "POST /health-office/coverage-assignments"
      - "POST /health-office/coverage-assignments/{id}/end"
      - "POST /health-office/medication-stock-lots"
      - "POST /health-office/medication-stock-lots/{id}/inventory-action"
      - "POST /health-office/_clock/set_current_utc"
      - "POST /health-office/_ops/run-daily-checkpoint"
    shared_operations:
      - "POST /health-office/students (shared with SchoolNurse)"
      - "PATCH /health-office/students/{id} (shared with SchoolNurse)"
      - "all GET endpoints except GET /health-office/disclosure-requests scoped reads, which it shares with SchoolPhysician and RecordsOfficer"

  - name: SchoolNurse
    description: "Licensed nurse (credential RN or LPN) who runs the office: encounters, doses, screenings, plan drafting and clinical verification. Only an RN may verify a medication order or void a record."
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /health-office/action-plans"
      - "POST /health-office/action-plans/{id}/submit"
      - "POST /health-office/medication-authorizations"
      - "POST /health-office/medication-authorizations/{id}/clinical-review with decision = VERIFY (requires credential == RN)"
      - "POST /health-office/health-visits/{id}/reopen"
      - "POST /health-office/administration-records/{id}/void"
      - "POST /health-office/screenings"
      - "POST /health-office/screenings/{id}/record-result"
      - "POST /health-office/screenings/{id}/follow-up"
    shared_operations:
      - "POST /health-office/students, PATCH /health-office/students/{id} (shared with DistrictHealthAdmin)"
      - "POST /health-office/health-visits and its assess / dispose / close steps (shared with HealthAide)"
      - "POST /health-office/administration-records, POST /health-office/administration-records/stock-emergency, POST /health-office/administration-records/{id}/outcome (shared with HealthAide)"
      - "clinical read endpoints"
    ownership_rules:
      - "X-User-ID must equal HealthVisit.nurse_id on assess, dispose, close and reopen"
      - "X-User-ID must equal AdministrationRecord.administering_nurse_id on outcome and void"
      - "SEGREGATION: on a controlled dose the supplied witness_nurse_id must differ from X-User-ID"
      - "SEGREGATION: on POST /health-office/screenings/{id}/follow-up with action = CLOSE_REFERRAL, X-User-ID must differ from Screening.screened_by_nurse_id"

  - name: HealthAide
    description: "Unlicensed assistive personnel (credential HEALTH_AIDE) who may staff an office and give delegated, non-controlled medications only when delegation_authorized is true."
    identity: "entity_backed:Nurse"
    exclusive_operations: []
    shared_operations:
      - "POST /health-office/health-visits and its assess / dispose / close steps (shared with SchoolNurse)"
      - "POST /health-office/administration-records, POST /health-office/administration-records/stock-emergency, POST /health-office/administration-records/{id}/outcome (shared with SchoolNurse)"
      - "clinical read endpoints"
    ownership_rules:
      - "Same X-User-ID ownership rules as SchoolNurse"
      - "Every administration step is refused with ERR_CREDENTIAL_NOT_DELEGATED unless Nurse.delegation_authorized == true, and always refused for a controlled medication"
      - "Cannot reopen an encounter, verify a medication order, void a record, or touch plans and screenings"

  - name: Guardian
    description: "Parent or guardian acting for exactly one student. X-User-ID carries that student's id, so ownership checks compare it directly to the target row's student_id."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /health-office/action-plans/{id}/guardian-consent"
      - "POST /health-office/medication-authorizations/{id}/consent"
      - "POST /health-office/disclosure-requests/{id}/guardian-consent"
    shared_operations:
      - "GET /health-office/students/{id}, GET /health-office/action-plans/{id}, GET /health-office/medication-authorizations/{id}, GET /health-office/health-visits/{id}, GET /health-office/screenings/{id}, GET /health-office/disclosure-requests/{id} — all restricted to rows whose student_id equals X-User-ID"
    ownership_rules:
      - "Every Guardian write is refused with ERR_NOT_RESOURCE_OWNER unless X-User-ID equals the target row's student_id"

  - name: SchoolPhysician
    description: "Medical director who signs action plans, suspends medication orders and decides records releases. Operational identity only; never equal to a persisted entity id."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-office/action-plans/{id}/decision"
      - "POST /health-office/action-plans/{id}/revoke"
      - "POST /health-office/medication-authorizations/{id}/clinical-review with decision = SUSPEND"
      - "POST /health-office/disclosure-requests/{id}/decide"
    shared_operations:
      - "clinical and disclosure read endpoints"
    ownership_rules:
      - "The X-User-ID that approves a DisclosureRequest is stored as decided_by_user_id and blocks that same operator from releasing it"

  - name: RecordsOfficer
    description: "Records custodian who opens release requests and hands over approved packages. Operational identity only."
    identity: "opaque"
    exclusive_operations:
      - "POST /health-office/disclosure-requests"
      - "POST /health-office/disclosure-requests/{id}/submit"
      - "POST /health-office/disclosure-requests/{id}/release"
    shared_operations:
      - "GET /health-office/disclosure-requests, GET /health-office/disclosure-requests/{id} and the record-family read endpoints"
    ownership_rules:
      - "SEGREGATION: X-User-ID on release must differ from DisclosureRequest.decided_by_user_id"
