          - entities.RescissionRequest.fields.is_timely
          - state_machines.RescissionRequest.RECEIVED_to_REJECTED_LATE
        distinguishing_aspect: |
          Two CERTIFIED_MAIL notices taken in at the identical instant 2026-08-25T10:00:00Z
