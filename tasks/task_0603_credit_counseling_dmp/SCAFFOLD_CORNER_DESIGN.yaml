  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_activates
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[client-activate-stale-version]", state_machines.Client.INTAKE_to_ACTIVE]
        distinguishing_aspect: "Activating with the exact current expected_client_version succeeds (status->ACTIVE) and increments Client.version; this is the happy path opposite of the §1.8 stale-version test."
        test_recipe:
          setup: ["Client ready to activate; caller reads the current version."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Gus", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
          trigger:
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { newv: $.data.version }
          assert:
            - "Client.${cl}.status == ACTIVE"
            - "Client.${cl}.monthly_deposit_cents == 33500"

      - name: occ_stale_version_on_activate
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[client-activate-stale-version]", "errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: cascade_activate_enroll_recompute_deposit
          rationale: "The activation OCC happy path is exercised across §1.8 cascade/dual-variant instances which all pass expected_client_version from a fresh GET; the stale-version negative is enumerated here only as a coverage marker and a dedicated stale test is generated from this corner's twin happy-path instance occ_correct_version_activates."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_on_activate
        claim_type: immediate
        grounds: [state_machines.Client.INTAKE_to_ACTIVE, calculations.monthly_deposit]
        excluded_because:
          difficulty_instance: cascade_activate_enroll_recompute_deposit
          rationale: "Immediate visibility of monthly_deposit_cents in the activation response is asserted by the named §1.8 cascade instance."
