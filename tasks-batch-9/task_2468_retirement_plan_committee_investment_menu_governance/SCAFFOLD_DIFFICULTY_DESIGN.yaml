            - "trigger step 3: ${eng_ad26_id} gets gross_cost_bps == 20.00, fee_credit_tier == TIER_A, total_cost_bps == 20.00 and rfp_required == true purely because benchmark_percentile == 75 satisfies >= 75.00 inclusively; status ends UNDER_RFP"
