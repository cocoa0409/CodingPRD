            - "ServiceTerritory.${t_id}.total_credit_cents == 1875000"

      - name: if_match_territory_posture_zone_override_beats_mapping
        claim_type: Variant Selection
        grounds:
          - calculations.territory_posture
          - calculations.territory_posture.variants.territory_zone_override
          - entities.ServiceTerritory.fields.active_zone_count
        distinguishing_aspect: "Three active zones force RESTRICTED even though mapped_pct 40 would otherwise read MAPPING, confirming the zone gates are evaluated before the mapping gates."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One territory with mapped_pct 40 (MAPPING) and three SCHEDULED exclusion zones."]
          setup_api_calls:
            - *c_clock
            - call: "POST /fleet/territories"
              payload: { name: "Phoenix Metro", region_code: "PHX-METRO", mapped_pct: 40, validation_hours: 0, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "CONSTRUCTION", route_class: "FREEWAY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "EVENT", route_class: "ARTERIAL", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z2_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones"
              payload: { kind: "TEMPORARY", route_class: "ALLEY", start_utc: "2026-06-01T00:00:00Z", duration_seconds: 86400 }
              as: SafetyReviewer
              captures: { z3_id: $.data.id }
          trigger:
            - call: "GET /fleet/territories/${t_id}"
              payload: {}
              as: FleetOperations
              captures: { pre_posture: $.data.posture }
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z1_id}/activate"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z2_id}/activate"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/exclusion-zones/${z3_id}/activate"
              payload: {}
              as: SafetyReviewer
          assert:
            - "the pre-activation read returns pre_posture == \"MAPPING\" with active_zone_count == 0"
            - "after activating ${z1_id}, ${z2_id} and ${z3_id}: ServiceTerritory.${t_id}.posture == RESTRICTED"
            - "ServiceTerritory.${t_id}.mapped_pct == 40 and active_zone_count == 3"
  # ===========================================================================
  - section: validations
    instances:
      - name: if_match_route_class_not_allowed_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=5]
          - errors[ERR_ROUTE_NOT_ALLOWED]
        distinguishing_aspect: "A route class with no APPROVED ServiceAreaRule allowing it is rejected with ERR_ROUTE_NOT_ALLOWED, while the same request on an allowed class succeeds."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with one IN_SERVICE vehicle, a SAFE curb, an ACTIVE STANDARD curb rule, an APPROVED FREEWAY rule that denies access and an APPROVED ARTERIAL rule that allows it, plus two REQUESTED rides."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - *c_v1
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - *c_cy1
            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
            - *c_rts1
            - *c_getv1
            - *c_safe
            - *c_curb_ok
            - call: "POST /fleet/territories/${t_id}/area-rules"
              payload: { route_class: "FREEWAY", allowed: false }
              as: MappingEngineer
              captures: { ar_free_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/area-rules/${ar_free_id}/approve"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/area-rules"
              payload: { route_class: "ARTERIAL", allowed: true }
              as: MappingEngineer
              captures: { ar_art_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/area-rules/${ar_art_id}/approve"
              payload: {}
              as: SafetyReviewer
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider Free", sub_service_type: "STANDARD", idempotency_key: "idem-odd-1" }
              as: FleetOperations
              captures: { r_free_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider Art", sub_service_type: "STANDARD", idempotency_key: "idem-odd-2" }
              as: FleetOperations
              captures: { r_art_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r_free_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}", route_class: "FREEWAY" }
              as: FleetOperations
              captures: { err: $.data.error_id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r_art_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}", route_class: "ARTERIAL" }
              as: FleetOperations
              captures: { ok_status: $.data.status }
          assert:
            - "the FREEWAY match returns error_id ERR_ROUTE_NOT_ALLOWED and http == 422"
            - "the ARTERIAL match returns ok_status == \"MATCHED\" with no error"
            - "RideRequest.${r_free_id}.status == REQUESTED and RideRequest.${r_art_id}.status == MATCHED"

      - name: if_match_weather_suspension_on_peak_wave
        claim_type: Conditional Validation
        grounds:
          - validations[priority=7]
          - errors[ERR_WEATHER_SUSPENDED]
        distinguishing_aspect: "The weather gate is conditional on the window code: a MORNING_PEAK wave activation is rejected with ERR_WEATHER_SUSPENDED when the tier is 3 or higher, while a MIDDAY wave with identical conditions activates."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with one AT_DEPOT service-ready vehicle, a MORNING_PEAK wave and a MIDDAY wave, and a severe-weather window covering MORNING_PEAK."]
