  - rule_id: non_linear_state_machine
    instances:
      - name: session_confirmed_reverts_to_crew_pending_on_crew_release
        grounds:
          - state_machines.Session.CONFIRMED_to_CREW_PENDING
          - state_machines.CrewAssignment.ASSIGNED_to_RELEASED
          - calculations.crew_satisfaction_evaluation
          - entities.Session.fields.crew_satisfied
        distinguishing_aspect: |
          The non-linearity here is a CYCLE on the SESSION entity - CREW_PENDING -> CONFIRMED
          -> CREW_PENDING - driven entirely by a write on a different entity (CrewAssignment),
          with no operator action on the session itself.
        test_recipe:
          setup:
