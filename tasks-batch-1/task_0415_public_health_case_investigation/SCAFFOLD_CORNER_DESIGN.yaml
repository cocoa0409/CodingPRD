              payload: { program_id: "${prog}", case_id: "${cu}" }
              as: EpiAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EXPORT_CASE_NOT_REPORTABLE"

      - name: duplicate_fips_code_within_program_returns_duplicate_key
        claim_type: Violation to Error
