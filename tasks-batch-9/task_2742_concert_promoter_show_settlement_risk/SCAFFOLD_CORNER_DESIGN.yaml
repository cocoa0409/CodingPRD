              as: TalentBuyer
              captures: { vs_conf_id: $.data.id, vs_conf_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${vs_conf_id}", expected_show_version: "${vs_conf_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { vs_of2_id: $.data.id }
            - call: "POST /offers/${vs_of2_id}/submit"
              payload: {}
              as: TalentBuyer
