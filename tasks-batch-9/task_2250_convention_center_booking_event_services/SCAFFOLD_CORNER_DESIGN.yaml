        excluded_because:
          difficulty_instance: resource_temporal_overlap / blackout_buffer_clearance_admits_three_day_gap_and_refuses_two_day_gap
          rationale: "Asserted as the failure path of the named §1.8 instance, which brackets the buffer_days clearance from both sides."

  - section: rbac
    instances:
      - name: licensee_cannot_create_bookings_or_publish_policy_windows
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.Licensee
          - rbac.roles.SalesManager.exclusive_operations
          - rbac.roles.VenueAdmin.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The entity-backed outside role is confined to countersigning, disputing and
          reading its own paperwork. Booking creation belongs to SalesManager and window
          publication to VenueAdmin, and both refusals arrive at priority 20, ahead of the
          path and body existence checks, so the unknown identifiers in the payload never
          matter.
        test_recipe:
          setup:
            - "no fixture data is required because the role gate at priority 20 precedes every existence check at priority 30 and 32"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "00000000-0000-4000-8000-000000000000", space_id: "00000000-0000-4000-8000-000000000000", event_name: "Self Serve Congress", event_class: "LOCAL_EVENT", move_in_start_date: "2027-05-01", show_start_date: "2027-05-02", show_end_date: "2027-05-03", move_out_end_date: "2027-05-04" }
              as: Licensee
              as_user_id: "00000000-0000-4000-8000-000000000000"
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "LOCAL_EVENT", priority_rank: 2, open_months_before: 24, close_months_before: 3, max_holds_per_booking: 2, challenge_response_hours: 72, rental_discount_pct: 0.1, max_challenge_rounds: 2 }
              as: Licensee
              as_user_id: "00000000-0000-4000-8000-000000000000"
          assert:
            - "both triggers return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "neither response carries ERR_CLIENT_NOT_FOUND or ERR_SPACE_NOT_FOUND"
            - "GET /convention-center/policy-windows as VenueAdmin returns total_count == 0"

      - name: facilities_planner_cannot_issue_licenses_or_order_event_services
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.FacilitiesPlanner
          - rbac.roles.SalesManager.exclusive_operations
          - rbac.roles.EventServicesManager.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The planner owns the maintenance calendar and nothing else. It may read spaces
          and bookings to place a blackout, but the licensing desk and the event services
          desk are closed to it, which keeps capital project scheduling separate from
          revenue commitments.
        test_recipe:
          setup:
            - "no fixture data is required because the role gate precedes the existence checks"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/licenses/00000000-0000-4000-8000-000000000000/issue"
              payload: {}
              as: FacilitiesPlanner
            - call: "POST /convention-center/bookings/00000000-0000-4000-8000-000000000000/service-orders"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000000", service_category: "CLEANING", ordered_quantity: 500 }
              as: FacilitiesPlanner
          assert:
            - "both triggers return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "neither response carries ERR_LICENSE_NOT_FOUND or ERR_BOOKING_NOT_FOUND"

      - name: sales_manager_cannot_schedule_blackouts_or_open_settlements
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.SalesManager
          - rbac.roles.FacilitiesPlanner.exclusive_operations
          - rbac.roles.SettlementAnalyst.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The desk that sells the dates cannot also take the dates off the market for
          maintenance, nor open the settlement that prices its own sale. This is the
          load-bearing half of the segregation model: the booking calendar and the money
          close are held by different roles.
        test_recipe:
          setup:
            - "no fixture data is required because the role gate precedes the existence checks"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/maintenance-blackouts"
              payload: { space_id: "00000000-0000-4000-8000-000000000000", window_start_date: "2027-12-01", window_end_date: "2027-12-10", project_kind: "CAPITAL_PROJECT" }
              as: SalesManager
            - call: "POST /convention-center/bookings/00000000-0000-4000-8000-000000000000/settlement"
              payload: { basis: "CONTRACTED" }
              as: SalesManager
          assert:
            - "both triggers return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "GET /convention-center/maintenance-blackouts as FacilitiesPlanner returns total_count == 0"

      - name: event_services_manager_cannot_confirm_first_option_or_finalize_settlements
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.EventServicesManager
          - rbac.roles.SalesManager.exclusive_operations
          - rbac.roles.SettlementAnalyst.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The show-floor desk owns orders, labour calls, catering and the usage
          attestations, but it may neither promote a tentative hold to first option nor
          sign off the settlement that its own usage records feed. That keeps the attesting
          party out of the figure it attests to.
        test_recipe:
          setup:
            - "no fixture data is required because the role gate precedes the existence checks"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/holds/00000000-0000-4000-8000-000000000000/confirm-first-option"
              payload: {}
              as: EventServicesManager
            - call: "POST /convention-center/settlements/00000000-0000-4000-8000-000000000000/finalize"
              payload: {}
              as: EventServicesManager
          assert:
            - "both triggers return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "neither response carries ERR_HOLD_NOT_FOUND or ERR_SETTLEMENT_NOT_FOUND"

      - name: settlement_analyst_cannot_open_the_show_or_approve_service_orders
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.SettlementAnalyst
          - rbac.roles.EventServicesManager.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The analyst reads every order and labour call in order to price them but cannot
          create or approve the charges it later bills, and cannot advance the event into
          the building. Read breadth without write reach is the point of the role.
        test_recipe:
          setup:
            - "no fixture data is required because the role gate precedes the existence checks"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/bookings/00000000-0000-4000-8000-000000000000/open-show"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
            - call: "POST /convention-center/service-orders/00000000-0000-4000-8000-000000000000/approve"
              payload: {}
              as: SettlementAnalyst
              as_user_id: "analyst-1"
          assert:
            - "both triggers return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "neither response carries ERR_BOOKING_NOT_FOUND or ERR_SERVICE_ORDER_NOT_FOUND"

      - name: venue_admin_cannot_countersign_or_dispute_in_place_of_the_licensee
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.VenueAdmin
          - rbac.roles.Licensee.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The administrator holds the widest write surface in the system, including
          cancellation, termination and arbitration finalisation, yet the two acts that
          bind the outside party to the paperwork are not among them. Breadth of authority
          does not extend downward into the counterparty's signature, so a
          hierarchical-override reading of the role model is wrong here.
        test_recipe:
          setup:
            - "no fixture data is required because the role gate precedes the existence checks"
          setup_api_calls: []
          trigger:
            - call: "POST /convention-center/licenses/00000000-0000-4000-8000-000000000000/countersign"
              payload: {}
              as: VenueAdmin
            - call: "POST /convention-center/settlements/00000000-0000-4000-8000-000000000000/dispute"
              payload: { dispute_reason: "administrator speaking for the licensee" }
              as: VenueAdmin
          assert:
            - "both triggers return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "the same administrator can reach POST /convention-center/settlements/{id}/arbitrate-finalize and POST /convention-center/licenses/{id}/terminate, so the refusal is specific to the counterparty acts"

      - name: licensee_reading_another_clients_license_rejected
        claim_type: entity_backed_ownership
        grounds:
          - rbac.roles.Licensee.identity
          - validations[priority=25]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[GET /convention-center/licenses/{id}]
        distinguishing_aspect: |
          Licensee is an entity_backed role whose X-User-ID is a Client identifier, so the
          role gate at priority 20 passes and the ownership gate at priority 25 is the one
          that fires. The requester is a perfectly valid Licensee and the license exists;
          only the ownership edge from license to booking to client fails, which is a
          two-hop check rather than a direct field comparison.
        test_recipe:
          setup:
            - "two clients each hold a Meeting Room booking, and only the Sunbelt booking has a drafted license"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
