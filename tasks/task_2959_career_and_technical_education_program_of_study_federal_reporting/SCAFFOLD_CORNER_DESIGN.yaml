  - section: rbac
    instances:

      - name: other_roles_cannot_perform_a_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.CteDirector.exclusive_operations
          - roles.StateComplianceReviewer.exclusive_operations
          - roles.GrantFiscalOfficer.exclusive_operations
          - roles.CommitteeChair.exclusive_operations
          - roles.SchoolRegistrar.exclusive_operations
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=6]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Each of the five roles is pointed at another role's exclusive operation, so a handler that checks only whether
          the caller is authenticated, or that treats CteDirector as a superuser, fails on the first two calls. The
          entity-backed role gets two extra probes that a plain role check cannot distinguish: an ACTIVE but non-chair
          member of the right committee, and the legitimate chair of a DIFFERENT committee — both must be 403, because
          the identity binding at priority 6 is per-committee. The 401 probe with an empty X-User-ID separates the
          authentication gate at priority 1 from the authorisation gate at priority 2.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy A with an ACTIVE advisory committee holding three seated members, the first of whom is the chair, and one SCHEDULED EQUIPMENT_REVIEW meeting."
            - "One separate DRAFT ProgramOfStudy B with its own ACTIVE advisory committee and its own seated chair."
            - "One GrantAward for fiscal_year 2027 with allocation_cents 5000000."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
