          setup: "ch1 ACTIVE on a FULL_POWER transmitter with posture NORMAL. Two playlists on ch1 with window_duration_seconds 1800 and content sums 1830 and 1831 respectively, both structurally valid."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *op_qc
            - *op_pd
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - *as_prog
            - *dl_prog
            - *qc_prog
            - *as_spot
            - *dl_spot
            - *qc_spot
            - call: "POST /playlists"
              payload:
                channel_id: "${ch1_id}"
                broadcast_day: "2026-08-02"
                schedule_start_utc: "2026-08-02T12:00:00Z"
                window_duration_seconds: 1800
                items:
                  - { sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-02T12:00:00Z", scheduled_duration_seconds: 1800 }
