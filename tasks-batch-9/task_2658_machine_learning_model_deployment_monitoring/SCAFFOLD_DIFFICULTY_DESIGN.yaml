              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.1.0", artifact_digest: "sha256:bbb", feature_spec_hash: "fs-v1", baseline_accuracy: 0.85, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 180, parent_version_id: "${v1_id}", doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"], evaluation_sample_quota: 5000 }
