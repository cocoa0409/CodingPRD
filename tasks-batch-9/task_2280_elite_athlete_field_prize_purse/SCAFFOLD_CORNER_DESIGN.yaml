          rationale: "That §1.8 instance approves as fin-approve-1 and pays as fin-pay-2, pinning the two-user rule on the positive path; the violation itself is asserted in corner_endpoint_settle_purse_action_endpoint_preconditions."

  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_layer_occ_stale_invitation_version_on_negotiation_round
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.negotiation-round-stale-invitation
          - errors.ERR_STALE_INVITATION_VERSION
        distinguishing_aspect: >-
          The negotiation channel is guarded by expected_invitation_version, and because every round
          bumps the version, a client that replays the version it just used is refused: the offer
          version works once, the counter bumps it, the same value now yields 412, and the refreshed
          value works again — with no NegotiationRound row created by either refusal.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition (offer_response_days default 14, max_negotiation_rounds default 3) with one OFFERED invitation; the version after the offer is captured."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "OCC Invitation Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "OCC Reps", license_code: "AGT-OC-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Version Vera", country_code: KEN, gender: MALE, birth_date: "1997-08-01" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual OC", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-OC-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id", v_create: "$.data.version" }
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 800000, air_class: ECONOMY, hotel_nights: 3, ground_transport: false }
              as: ElitesDirector
              captures: { v_offer: "$.data.version" }
          trigger:
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 1200000, air_class: BUSINESS, hotel_nights: 5, ground_transport: true, expected_invitation_version: "${v_create}" }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { err1: "$.data.error_id" }
            - call: GET /invitations/${inv_id}/negotiation-rounds
              as: ElitesDirector
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 1200000, air_class: BUSINESS, hotel_nights: 5, ground_transport: true, expected_invitation_version: "${v_offer}" }
              as: AthleteAgent
              as_user_id: "${agt_id}"
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 1000000, air_class: BUSINESS, hotel_nights: 4, ground_transport: true, expected_invitation_version: "${v_offer}" }
              as: ElitesDirector
              captures: { err2: "$.data.error_id" }
            - call: GET /invitations/${inv_id}
              as: ElitesDirector
              captures: { v_now: "$.data.version" }
            - call: POST /invitations/${inv_id}/negotiation-rounds
              payload: { appearance_fee_cents: 1000000, air_class: BUSINESS, hotel_nights: 4, ground_transport: true, expected_invitation_version: "${v_now}" }
              as: ElitesDirector
            - call: GET /invitations/${inv_id}/negotiation-rounds
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 412 with error_id == ERR_STALE_INVITATION_VERSION — the version captured on the invitation create response predates the offer write that bumped it"
            - "trigger call 2 returns total_count == 0 — a rejected round leaves no row behind"
            - "trigger call 3 returns HTTP 201 with round_number == 1, side == AGENT and the invitation COUNTERED with version == the captured offer version + 1"
            - "trigger call 4 returns HTTP 412 with error_id == ERR_STALE_INVITATION_VERSION — the very value that worked one call earlier is now stale, which is the whole point of the guard"
            - "trigger call 6 returns HTTP 201 with round_number == 2, side == COMMITTEE and the invitation back to OFFERED"
            - "trigger call 7 returns total_count == 2 — exactly the two accepted rounds, in creation order (created_at ascending)"

