  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:

      - name: computed_read_dwell_summary_matches_the_derivation
        claim_type: computed_read
        grounds:
          - endpoints.GET /stores/{store_id}/dwell-summary
          - calculations.attraction_posture
          - entities.Store.fields.dwell_free_minutes
        distinguishing_aspect: "The dwell summary is a pure read that re-derives the store aggregate without mutating it, so two consecutive reads return identical values."
        test_recipe:
          setup: ["a store with an open aquarium, one member and one confirmed session"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_cr@x.com", full_name: "Cato Reed", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 4, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
            - call: "GET /stores/${st_id}"
              as: StoreManager
          assert:
            - "both summary reads return the same object: dwell_committed_minutes == 120 and dwell_free_minutes == 59880"
            - "attraction_posture == OPEN in both reads and over_capacity_venues == 0"
            - "GET /stores/${st_id} reports the same dwell_committed_minutes == 120, so the derived field on the store agrees with the summary"
            - "no read incremented Store.${st_id}.version, so the computed read is free of side effects"

      - name: expired_waiver_venues_are_counted_in_the_summary
        claim_type: computed_read
        grounds:
          - endpoints.GET /stores/{store_id}/dwell-summary
          - calculations.attraction_posture
        distinguishing_aspect: "The summary exposes expired_waiver_venues as its own counter, and a non-zero counter is what pushes the posture to RESTRICTED rather than FROZEN."
        test_recipe:
          setup: ["a store with an open archery range and one member holding a one-day waiver, with one confirmed session"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "ARCHERY_RANGE", capacity_units: 12, dwell_cost_minutes: 45 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ew@x.com", full_name: "Elle Ward", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/waivers"
              payload: { member_id: "${m_id}", activity_scope: "ARCHERY_RANGE", signed_at_utc: "2026-08-30T00:00:00Z", waiver_term_days: 1 }
              as: AttractionHost
              captures: { wv_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "ARCHERY_LANE", party_size: 2, lane_no: 5, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z", waiver_id: "${wv_id}" }
              as: AttractionHost
              captures: { s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
          assert:
            - "before the checkpoint expired_waiver_venues == 1, because the waiver expired on 2026-08-31 and the clock has moved to 2026-09-05"
            - "before the checkpoint attraction_posture == RESTRICTED, not FROZEN, since the dwell budget is untouched at 45 committed minutes"
            - "after the checkpoint the ops-run moved the waiver to EXPIRED and expired_waiver_venues == 0, so the counter tracks SIGNED rows only"
            - "after the checkpoint attraction_posture == OPEN again, so the counter alone drives the RESTRICTED branch"

      - name: cross_reference_filtered_reads_resolve_both_directions
        claim_type: standard_crud
        grounds:
          - endpoints.GET /stores/attractions/{attraction_id}/sessions
          - endpoints.GET /stores/sessions
          - entities.AttractionSession.fields.attraction_id
        distinguishing_aspect: "The same child set is reachable through the nested route and through the flat filtered-list route, and both return the identical row set."
