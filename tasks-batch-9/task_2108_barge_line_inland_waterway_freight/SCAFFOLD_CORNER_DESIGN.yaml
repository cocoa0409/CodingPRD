              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LOCK_RESERVATION_INVALID_STATE with HTTP 409"
            - "LockReservation.${lr_id}.status == REQUESTED, delay_minutes == 0 and actual_end_at == null"
