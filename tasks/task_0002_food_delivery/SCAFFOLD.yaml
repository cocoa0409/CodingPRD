# =============================================================================
# Food Delivery Platform benchmark seed tables (v1)
# =============================================================================

scenario: |
  The food delivery platform system connects customers, restaurants, delivery riders,
  the platform itself, customer service, and other roles, involving complex business logic.

domain_name: food-delivery
api_prefix: /platform

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Restaurants, Riders, Customers are peer entities with many-to-many via Orders/Deliveries

  state_machine_shape: branching
  # Orders fork into payment + fulfillment paths; disputes branch approve/reject

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: peer_roles
  # Each role (customer, restaurant, rider, platform_admin, customer_service) owns different operations

  consistency_model: eventual
  # Rider earnings, restaurant payouts, platform fees reconciled asynchronously via settlement

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Restaurant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Restaurant display name" }
      - { name: cuisine_type, type: string, source: input, description: "Primary cuisine category" }
      - { name: address, type: string, source: input, description: "Restaurant street address" }
      - { name: latitude, type: number, source: input, description: "GPS latitude" }
      - { name: longitude, type: number, source: input, description: "GPS longitude" }
      - { name: commission_rate, type: number, source: input, description: "Platform commission percentage (0.10 to 0.30)" }
      - { name: average_prep_time_minutes, type: integer, source: input, description: "Estimated preparation time in minutes" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | ACTIVE | SUSPENDED | CLOSED" }
      - { name: rating_average, type: number, source: computed, description: "Average rating from completed orders, 2 decimal places" }
      - { name: rating_count, type: integer, source: computed, description: "Total number of ratings received" }
      - { name: total_orders_completed, type: integer, source: computed, description: "Lifetime completed order count" }
      - { name: balance_pending_cents, type: integer, source: computed, description: "Unsettled earnings awaiting payout" }
      - { name: balance_settled_cents, type: integer, source: computed, description: "Cumulative settled payouts" }
      - { name: is_accepting_orders, type: boolean, source: input, description: "Whether restaurant is currently open for orders" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: MenuItem
    parent: Restaurant
    common_fields: true
    fields:
      - { name: restaurant_id, type: string, source: system, description: "Parent restaurant ID" }
      - { name: name, type: string, source: input, description: "Menu item display name" }
      - { name: description, type: string, source: input, required: false, description: "Optional item description" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price in cents, must be >= 100" }
      - { name: category, type: string, source: input, description: "Item category (appetizer, main, dessert, drink, etc.)" }
      - { name: is_available, type: boolean, source: input, description: "Whether item is currently orderable" }
      - { name: prep_time_minutes, type: integer, source: input, description: "Preparation time for this specific item" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: phone, type: string, source: input, description: "Phone number, unique across platform" }
      - { name: default_address, type: string, source: input, required: false, description: "Default delivery address" }
      - { name: default_latitude, type: number, source: input, required: false, description: "Default GPS latitude" }
      - { name: default_longitude, type: number, source: input, required: false, description: "Default GPS longitude" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DELETED" }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Prepaid wallet balance in cents" }
      - { name: loyalty_points, type: integer, source: computed, description: "Accumulated loyalty points" }
      - { name: total_orders, type: integer, source: computed, description: "Lifetime order count" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rider display name" }
      - { name: phone, type: string, source: input, description: "Phone number, unique across riders" }
      - { name: vehicle_type, type: enum, source: input, description: "BICYCLE | MOTORCYCLE | CAR" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | ACTIVE | SUSPENDED | DEACTIVATED" }
      - { name: current_latitude, type: number, source: input, required: false, description: "Current GPS latitude" }
      - { name: current_longitude, type: number, source: input, required: false, description: "Current GPS longitude" }
      - { name: is_online, type: boolean, source: input, description: "Whether rider is currently accepting deliveries" }
      - { name: active_delivery_count, type: integer, source: computed, description: "Number of in-progress deliveries" }
      - { name: max_concurrent_deliveries, type: integer, source: input, default: 3, description: "Maximum simultaneous deliveries" }
      - { name: is_at_capacity, type: boolean, source: computed, description: "True when active_delivery_count >= max_concurrent_deliveries" }
      - { name: rating_average, type: number, source: computed, description: "Average delivery rating, 2 decimal places" }
      - { name: rating_count, type: integer, source: computed, description: "Total number of ratings received" }
      - { name: total_deliveries_completed, type: integer, source: computed, description: "Lifetime completed delivery count" }
      - { name: cancellation_count, type: integer, source: computed, description: "Number of rider-initiated cancellations" }
      - { name: cancellation_rate, type: number, source: computed, description: "cancellation_count / total_deliveries_completed, 4 decimal places" }
      - { name: earnings_balance_cents, type: integer, source: computed, description: "Unsettled earnings awaiting payout" }
      - { name: earnings_settled_cents, type: integer, source: computed, description: "Cumulative settled payouts" }
      - { name: penalty_points, type: integer, source: computed, description: "Accumulated penalty points, 100 triggers suspension" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "Ordering customer ID" }
      - { name: restaurant_id, type: string, source: input, description: "Target restaurant ID" }
      - { name: delivery_address, type: string, source: input, description: "Delivery street address" }
      - { name: delivery_latitude, type: number, source: input, description: "Delivery GPS latitude" }
      - { name: delivery_longitude, type: number, source: input, description: "Delivery GPS longitude" }
      - { name: status, type: enum, source: system, description: "PLACED | CONFIRMED | PREPARING | READY_FOR_PICKUP | PICKED_UP | DELIVERED | CANCELLED_BY_CUSTOMER | CANCELLED_BY_RESTAURANT | CANCELLED_BY_PLATFORM" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | AUTHORIZED | CAPTURED | REFUNDED | PARTIALLY_REFUNDED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of order item amounts before fees" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "Calculated delivery fee based on distance and surge" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Platform service fee (percentage of subtotal)" }
      - { name: small_order_fee_cents, type: integer, source: computed, description: "Applied when subtotal < 1500 cents; equals 1500 - subtotal, capped at 500" }
      - { name: discount_cents, type: integer, source: computed, description: "Applied promotion discount amount" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Customer tip for rider in cents" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal + delivery_fee + service_fee + small_order_fee - discount + tip" }
      - { name: commission_amount_cents, type: integer, source: computed, description: "Platform commission from restaurant (subtotal * commission_rate)" }
      - { name: rider_payout_cents, type: integer, source: computed, description: "delivery_fee + tip - rider_platform_fee" }
      - { name: restaurant_payout_cents, type: integer, source: computed, description: "subtotal - commission_amount" }
      - { name: estimated_prep_time_minutes, type: integer, source: computed, description: "Max prep_time across order items" }
      - { name: estimated_delivery_time_minutes, type: integer, source: computed, description: "Based on distance and vehicle type" }
      - { name: placed_at, type: datetime, source: system, description: "Timestamp when order was placed" }
      - { name: confirmed_at, type: datetime, source: system, required: false, description: "Timestamp when restaurant confirmed" }
      - { name: picked_up_at, type: datetime, source: system, required: false, description: "Timestamp when rider picked up" }
      - { name: delivered_at, type: datetime, source: system, required: false, description: "Timestamp when delivered" }
      - { name: cancelled_at, type: datetime, source: system, required: false, description: "Timestamp when cancelled" }
      - { name: promotion_id, type: string, source: input, required: false, description: "Applied promotion ID" }
      - { name: special_instructions, type: string, source: input, required: false, description: "Delivery instructions" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: OrderItem
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Parent order ID" }
      - { name: menu_item_id, type: string, source: input, description: "Referenced menu item ID" }
      - { name: quantity, type: integer, source: input, description: "Number of this item, must be >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price per unit at time of order (snapshot from menu item)" }
      - { name: item_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: special_requests, type: string, source: input, required: false, description: "Item-level customization notes" }

  - name: Delivery
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Associated order ID" }
      - { name: rider_id, type: string, source: input, description: "Assigned rider ID" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | HEADING_TO_RESTAURANT | AT_RESTAURANT | PICKED_UP | EN_ROUTE | DELIVERED | FAILED | CANCELLED_BY_RIDER" }
      - { name: assigned_at, type: datetime, source: system, description: "When rider was assigned" }
      - { name: pickup_at, type: datetime, source: system, required: false, description: "When food was picked up" }
      - { name: delivered_at, type: datetime, source: system, required: false, description: "When delivery was completed" }
      - { name: distance_km, type: number, source: computed, description: "Haversine distance from restaurant to delivery address" }
      - { name: actual_delivery_time_minutes, type: integer, source: computed, required: false, description: "Time from pickup to delivery in minutes" }
      - { name: is_late, type: boolean, source: computed, description: "True if actual_delivery_time > estimated_delivery_time * 1.5" }
      - { name: rider_earnings_cents, type: integer, source: computed, description: "Rider payout for this delivery" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique promotion code" }
      - { name: discount_type, type: enum, source: input, description: "PERCENTAGE | FIXED_AMOUNT | FREE_DELIVERY" }
      - { name: discount_value, type: integer, source: input, description: "Percentage (1-50) or fixed amount in cents" }
      - { name: minimum_order_cents, type: integer, source: input, description: "Minimum subtotal to qualify" }
      - { name: max_discount_cents, type: integer, source: input, required: false, description: "Cap on discount for PERCENTAGE type" }
      - { name: max_uses, type: integer, source: input, description: "Maximum total redemptions" }
      - { name: current_uses, type: integer, source: computed, description: "Number of times redeemed" }
      - { name: max_uses_per_customer, type: integer, source: input, default: 1, description: "Max uses per individual customer" }
      - { name: valid_from, type: datetime, source: input, description: "Promotion start time" }
      - { name: valid_until, type: datetime, source: input, description: "Promotion end time" }
      - { name: restaurant_id, type: string, source: input, required: false, description: "If set, only valid for this restaurant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | EXHAUSTED | DISABLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Rating
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Associated order ID" }
      - { name: rater_type, type: enum, source: input, description: "CUSTOMER_TO_RESTAURANT | CUSTOMER_TO_RIDER | RESTAURANT_TO_RIDER" }
      - { name: rater_id, type: string, source: input, description: "ID of the entity giving the rating" }
      - { name: ratee_id, type: string, source: input, description: "ID of the entity being rated" }
      - { name: score, type: integer, source: input, description: "Rating score 1-5" }
      - { name: comment, type: string, source: input, required: false, description: "Optional text comment" }
      - { name: status, type: enum, source: system, description: "PENDING | PUBLISHED | HIDDEN" }

  - name: Complaint
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Associated order ID" }
      - { name: filed_by, type: enum, source: input, description: "CUSTOMER | RESTAURANT | RIDER" }
      - { name: filer_id, type: string, source: input, description: "ID of complaint filer" }
      - { name: category, type: enum, source: input, description: "WRONG_ITEMS | MISSING_ITEMS | COLD_FOOD | LATE_DELIVERY | RUDE_BEHAVIOR | DAMAGED_PACKAGING | OTHER" }
      - { name: description, type: string, source: input, description: "Complaint details" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RESOLVED_REFUND | RESOLVED_CREDIT | RESOLVED_NO_ACTION | ESCALATED | CLOSED" }
      - { name: resolution_amount_cents, type: integer, source: computed, required: false, description: "Refund or credit amount if resolved with compensation" }
      - { name: assigned_agent_id, type: string, source: system, required: false, description: "Customer service agent handling this" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Settlement
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique settlement ID" }
      - { name: entity_type, type: enum, source: system, description: "RESTAURANT | RIDER" }
      - { name: entity_id, type: string, source: system, description: "Restaurant or rider ID being settled" }
      - { name: period_start, type: datetime, source: system, description: "Settlement period start" }
      - { name: period_end, type: datetime, source: system, description: "Settlement period end" }
      - { name: total_orders, type: integer, source: computed, description: "Number of orders in this settlement" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Total pre-deduction earnings" }
      - { name: deductions_cents, type: integer, source: computed, description: "Platform fees, penalties, clawbacks" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Amount to be paid out" }
      - { name: status, type: enum, source: system, description: "DRAFT | CALCULATED | APPROVED | PAID | DISPUTED" }
      - { name: created_at, type: datetime, source: system, description: "Settlement creation timestamp" }

  - name: SurgeZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_name, type: string, source: input, description: "Geographic zone identifier" }
      - { name: center_latitude, type: number, source: input, description: "Zone center latitude" }
      - { name: center_longitude, type: number, source: input, description: "Zone center longitude" }
      - { name: radius_km, type: number, source: input, description: "Zone radius in kilometers" }
      - { name: surge_multiplier, type: number, source: input, description: "Delivery fee multiplier >= 1.0, <= 3.0" }
      - { name: active_rider_count, type: integer, source: computed, description: "Online riders currently in this zone" }
      - { name: pending_order_count, type: integer, source: computed, description: "Unassigned orders in this zone" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RiderPenaltyLog
    parent: Rider
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique log entry ID" }
      - { name: rider_id, type: string, source: system, description: "Associated rider ID" }
      - { name: reason, type: enum, source: system, description: "LATE_DELIVERY | CANCELLATION | COMPLAINT_UPHELD | NO_SHOW" }
      - { name: points, type: integer, source: system, description: "Penalty points assessed" }
      - { name: delivery_id, type: string, source: system, required: false, description: "Associated delivery if applicable" }
      - { name: complaint_id, type: string, source: system, required: false, description: "Associated complaint if applicable" }
      - { name: created_at, type: datetime, source: system, description: "When penalty was assessed" }
      - { name: cumulative_points, type: integer, source: computed, description: "Rider total penalty points after this entry" }

  - name: WalletTransaction
    parent: Customer
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Unique transaction ID" }
      - { name: customer_id, type: string, source: system, description: "Associated customer ID" }
      - { name: type, type: enum, source: system, description: "TOP_UP | PAYMENT | REFUND | CREDIT | LOYALTY_REDEMPTION" }
      - { name: amount_cents, type: integer, source: input, description: "Transaction amount in cents (positive for credit, negative for debit)" }
      - { name: reference_id, type: string, source: system, required: false, description: "Associated order or complaint ID" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Wallet balance after this transaction" }
      - { name: created_at, type: datetime, source: system, description: "Transaction timestamp" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Restaurant
    field: status
    initial_state: PENDING_APPROVAL
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /platform/restaurants/:restaurant_id/approve"
        actor: platform_admin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /platform/restaurants/:restaurant_id/suspend"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "All PLACED orders for this restaurant are auto-cancelled (CANCELLED_BY_PLATFORM)"
          - "Restaurant.is_accepting_orders set to false"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /platform/restaurants/:restaurant_id/reinstate"
        actor: platform_admin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /platform/restaurants/:restaurant_id/close"
        actor: platform_admin
        preconditions:
          - "No orders in CONFIRMED or PREPARING status"
        side_effects:
          - "All menu items set to is_available = false"
          - "All PLACED orders auto-cancelled (CANCELLED_BY_PLATFORM)"

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /platform/restaurants/:restaurant_id/close"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "All menu items set to is_available = false"

  - entity: Rider
    field: status
    initial_state: PENDING_APPROVAL
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /platform/riders/:rider_id/approve"
        actor: platform_admin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /platform/riders/:rider_id/suspend"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "Rider.is_online set to false"
          - "All ASSIGNED deliveries for this rider become CANCELLED_BY_RIDER"
          - "Corresponding orders revert to READY_FOR_PICKUP for reassignment"
          - "Penalty points += 15 per cancelled delivery"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (penalty_points >= 100)"
        actor: system
        preconditions:
          - "Rider.penalty_points >= 100"
        side_effects:
          - "Same as admin-triggered suspension"
        note: "Auto-suspension when penalty threshold reached"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /platform/riders/:rider_id/reinstate"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "penalty_points reset to 0"

      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /platform/riders/:rider_id/deactivate"
        actor: platform_admin
        preconditions:
          - "No active deliveries (active_delivery_count = 0)"
        side_effects:
          - "Rider.is_online set to false"
          - "Remaining earnings_balance_cents settled in next settlement run"

      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /platform/riders/:rider_id/deactivate"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "Remaining earnings_balance_cents settled in next settlement run"

  - entity: Order
    field: status
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED_BY_CUSTOMER, CANCELLED_BY_RESTAURANT, CANCELLED_BY_PLATFORM]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /platform/orders/:order_id/confirm"
        actor: restaurant
        preconditions:
          - "Restaurant is ACTIVE"
          - "All referenced menu items are still available"
        side_effects:
          - "Order.confirmed_at set to now"
          - "payment_status transitions PENDING -> AUTHORIZED"
          - "Order.estimated_prep_time_minutes computed from max(item prep times)"

      - from: CONFIRMED
        to: PREPARING
        trigger: "POST /platform/orders/:order_id/start-preparing"
        actor: restaurant
        preconditions: []
        side_effects: []

      - from: PREPARING
        to: READY_FOR_PICKUP
        trigger: "POST /platform/orders/:order_id/mark-ready"
        actor: restaurant
        preconditions: []
        side_effects: []

      - from: READY_FOR_PICKUP
        to: PICKED_UP
        trigger: "POST /platform/orders/:order_id/pickup"
        actor: rider
        preconditions:
          - "Order has an assigned delivery with matching rider_id"
          - "Delivery status is AT_RESTAURANT"
        side_effects:
          - "Order.picked_up_at set to now"
          - "Delivery.status -> PICKED_UP"
          - "Delivery.pickup_at set to now"

      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /platform/orders/:order_id/deliver"
        actor: rider
        preconditions:
          - "Delivery.status is PICKED_UP or EN_ROUTE"
        side_effects:
          - "Order.delivered_at set to now"
          - "Delivery.status -> DELIVERED"
          - "Delivery.delivered_at set to now"
          - "payment_status transitions AUTHORIZED -> CAPTURED"
          - "Restaurant.balance_pending_cents += restaurant_payout_cents"
          - "Rider.earnings_balance_cents += rider_payout_cents"
          - "Rider.total_deliveries_completed += 1"
          - "Restaurant.total_orders_completed += 1"
          - "Customer.total_orders += 1"
          - "Customer.loyalty_points += floor(total_cents / 100)"
          - "Delivery.is_late calculated"
          - "If delivery is late: rider penalty_points += 10, log entry created"

      - from: PLACED
        to: CANCELLED_BY_CUSTOMER
        trigger: "POST /platform/orders/:order_id/cancel"
        actor: customer
        preconditions:
          - "Order.customer_id matches requesting customer"
        side_effects:
          - "Order.cancelled_at set to now"
          - "payment_status stays PENDING (no charge)"

      - from: CONFIRMED
        to: CANCELLED_BY_CUSTOMER
        trigger: "POST /platform/orders/:order_id/cancel"
        actor: customer
        preconditions:
          - "Order.customer_id matches requesting customer"
          - "No delivery has been assigned yet, OR delivery status is ASSIGNED"
        side_effects:
          - "Order.cancelled_at set to now"
          - "payment_status transitions AUTHORIZED -> REFUNDED"
          - "If delivery exists, Delivery.status -> CANCELLED_BY_RIDER, rider.active_delivery_count -= 1"

      - from: PLACED
        to: CANCELLED_BY_RESTAURANT
        trigger: "POST /platform/orders/:order_id/reject"
        actor: restaurant
        preconditions: []
        side_effects:
          - "Order.cancelled_at set to now"
          - "payment_status stays PENDING (no charge)"

      - from: CONFIRMED
        to: CANCELLED_BY_RESTAURANT
        trigger: "POST /platform/orders/:order_id/reject"
        actor: restaurant
        preconditions: []
        side_effects:
          - "Order.cancelled_at set to now"
          - "payment_status transitions AUTHORIZED -> REFUNDED"
          - "If delivery exists, Delivery.status -> CANCELLED_BY_RIDER"

      - from: PLACED
        to: CANCELLED_BY_PLATFORM
        trigger: "system (restaurant suspended or closed)"
        actor: system
        preconditions: []
        side_effects:
          - "Order.cancelled_at set to now"

      - from: CONFIRMED
        to: CANCELLED_BY_PLATFORM
        trigger: "POST /platform/orders/:order_id/platform-cancel"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "Order.cancelled_at set to now"
          - "payment_status transitions AUTHORIZED -> REFUNDED"
          - "If delivery exists, Delivery.status -> CANCELLED_BY_RIDER"

  - entity: Order
    field: payment_status
    initial_state: PENDING
    terminal_states: [CAPTURED, REFUNDED, PARTIALLY_REFUNDED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "Order confirmed by restaurant"
        actor: system
        preconditions:
          - "Customer wallet_balance_cents >= order.total_cents (if paying by wallet)"
        side_effects:
          - "WalletTransaction created with type PAYMENT, amount = -total_cents"
          - "Customer.wallet_balance_cents -= total_cents"

      - from: AUTHORIZED
        to: CAPTURED
        trigger: "Order delivered"
        actor: system
        preconditions: []
        side_effects: []

      - from: AUTHORIZED
        to: REFUNDED
        trigger: "Order cancelled after authorization"
        actor: system
        preconditions: []
        side_effects:
          - "WalletTransaction created with type REFUND, amount = +total_cents"
          - "Customer.wallet_balance_cents += total_cents"

      - from: CAPTURED
        to: PARTIALLY_REFUNDED
        trigger: "Complaint resolved with partial refund"
        actor: customer_service
        preconditions: []
        side_effects:
          - "WalletTransaction created with type REFUND, amount = +resolution_amount_cents"
          - "Customer.wallet_balance_cents += resolution_amount_cents"

      - from: CAPTURED
        to: REFUNDED
        trigger: "Complaint resolved with full refund"
        actor: customer_service
        preconditions: []
        side_effects:
          - "WalletTransaction created with type REFUND, amount = +total_cents"
          - "Customer.wallet_balance_cents += total_cents"
          - "Restaurant.balance_pending_cents -= restaurant_payout_cents (clawback)"

  - entity: Delivery
    field: status
    initial_state: ASSIGNED
    terminal_states: [DELIVERED, FAILED, CANCELLED_BY_RIDER]
    transitions:
      - from: ASSIGNED
        to: HEADING_TO_RESTAURANT
        trigger: "POST /platform/orders/:order_id/deliveries/:delivery_id/start"
        actor: rider
        preconditions:
          - "Rider is the assigned rider"
        side_effects: []

      - from: HEADING_TO_RESTAURANT
        to: AT_RESTAURANT
        trigger: "POST /platform/orders/:order_id/deliveries/:delivery_id/arrive"
        actor: rider
        preconditions: []
        side_effects: []

      - from: AT_RESTAURANT
        to: PICKED_UP
        trigger: "POST /platform/orders/:order_id/pickup (via order)"
        actor: rider
        preconditions:
          - "Order is READY_FOR_PICKUP"
        side_effects:
          - "Delivery.pickup_at set to now"

      - from: PICKED_UP
        to: EN_ROUTE
        trigger: "system (automatic after pickup)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /platform/orders/:order_id/deliver (via order)"
        actor: rider
        preconditions: []
        side_effects:
          - "Delivery.delivered_at set to now"
          - "Delivery.actual_delivery_time_minutes computed"
          - "Rider.active_delivery_count -= 1"

      - from: ASSIGNED
        to: CANCELLED_BY_RIDER
        trigger: "POST /platform/orders/:order_id/deliveries/:delivery_id/cancel"
        actor: rider
        preconditions: []
        side_effects:
          - "Rider.active_delivery_count -= 1"
          - "Rider.cancellation_count += 1"
          - "Rider.penalty_points += 20"
          - "RiderPenaltyLog entry created (reason: CANCELLATION)"
          - "Order reverts to READY_FOR_PICKUP (if was PICKED_UP) or stays in current status"

      - from: HEADING_TO_RESTAURANT
        to: CANCELLED_BY_RIDER
        trigger: "POST /platform/orders/:order_id/deliveries/:delivery_id/cancel"
        actor: rider
        preconditions: []
        side_effects:
          - "Same as ASSIGNED -> CANCELLED_BY_RIDER"

      - from: ASSIGNED
        to: FAILED
        trigger: "system (no pickup within 30 minutes of assignment)"
        actor: system
        preconditions:
          - "30 minutes elapsed since assigned_at with no state progression"
        side_effects:
          - "Rider.active_delivery_count -= 1"
          - "Rider.penalty_points += 25"
          - "RiderPenaltyLog entry created (reason: NO_SHOW)"

  - entity: Complaint
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_REFUND, RESOLVED_CREDIT, RESOLVED_NO_ACTION, CLOSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/assign"
        actor: customer_service
        preconditions: []
        side_effects:
          - "Complaint.assigned_agent_id set"

      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/escalate"
        actor: customer_service
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: UNDER_REVIEW
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/assign"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "Complaint.assigned_agent_id updated"
        note: "Cyclic: escalated complaints can be reassigned"

      - from: UNDER_REVIEW
        to: RESOLVED_REFUND
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/resolve"
        actor: customer_service
        preconditions: []
        side_effects:
          - "resolution_amount_cents set"
          - "Order.payment_status -> PARTIALLY_REFUNDED or REFUNDED"
          - "WalletTransaction created with REFUND type"
          - "Customer.wallet_balance_cents += resolution_amount_cents"
          - "If complaint against rider: rider.penalty_points += 15, RiderPenaltyLog entry"

      - from: UNDER_REVIEW
        to: RESOLVED_CREDIT
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/resolve"
        actor: customer_service
        preconditions: []
        side_effects:
          - "resolution_amount_cents set"
          - "WalletTransaction created with CREDIT type"
          - "Customer.wallet_balance_cents += resolution_amount_cents"

      - from: UNDER_REVIEW
        to: RESOLVED_NO_ACTION
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/resolve"
        actor: customer_service
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: RESOLVED_REFUND
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/resolve"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "Same as UNDER_REVIEW -> RESOLVED_REFUND"

      - from: ESCALATED
        to: RESOLVED_CREDIT
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/resolve"
        actor: platform_admin
        preconditions: []
        side_effects:
          - "Same as UNDER_REVIEW -> RESOLVED_CREDIT"

      - from: ESCALATED
        to: RESOLVED_NO_ACTION
        trigger: "POST /platform/orders/:order_id/complaints/:complaint_id/resolve"
        actor: platform_admin
        preconditions: []
        side_effects: []

      - from: RESOLVED_REFUND
        to: CLOSED
        trigger: "system (auto-close after 7 days)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESOLVED_CREDIT
        to: CLOSED
        trigger: "system (auto-close after 7 days)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESOLVED_NO_ACTION
        to: CLOSED
        trigger: "system (auto-close after 7 days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Promotion
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, EXHAUSTED, DISABLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (current time > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (current_uses >= max_uses)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: DISABLED
        trigger: "POST /platform/promotions/:promotion_id/disable"
        actor: platform_admin
        preconditions: []
        side_effects: []

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: order_subtotal
    trigger: "Order creation (computed from order items)"
    algorithm: aggregation
    formula: |
      subtotal_cents = SUM(order_item.unit_price_cents * order_item.quantity)
      for all items in the order.
      unit_price_cents is snapshot of menu_item.base_price_cents at order creation time.
    precision: "integer cents, no rounding needed"

  - name: delivery_fee
    trigger: "Order creation, recalculated if surge zone changes"
    algorithm: tiered_pricing
    formula: |
      base_fee = 299  # $2.99 base
      distance_km = haversine(restaurant, delivery_address)
      distance_fee = ceil(distance_km) * 100  # $1.00 per km (rounded up)
      raw_fee = base_fee + distance_fee

      # Surge pricing
      surge_multiplier = max applicable SurgeZone.surge_multiplier for restaurant location
      if no active surge zone applies: surge_multiplier = 1.0

      delivery_fee_cents = floor(raw_fee * surge_multiplier)

      # Vehicle type adjustment
      if rider.vehicle_type == BICYCLE and distance_km > 5: delivery_fee_cents += 200
      if rider.vehicle_type == CAR: delivery_fee_cents += 150  # premium vehicle surcharge
    constants:
      BASE_FEE_CENTS: 299
      PER_KM_CENTS: 100
      BICYCLE_LONG_DISTANCE_SURCHARGE: 200
      CAR_PREMIUM_SURCHARGE: 150
      BICYCLE_MAX_DISTANCE_KM: 5
    precision: "integer cents, floor after surge multiplication"
    variants:
      - name: provisional_delivery_fee
        when: "At order creation, before rider assignment"
        difference: "Uses surge_multiplier at order time, no vehicle adjustment. This is the customer-facing estimate."
      - name: final_delivery_fee
        when: "After rider assignment"
        difference: "Uses actual rider vehicle type and surge at assignment time. May differ from provisional."

  - name: service_fee
    trigger: "Order creation"
    algorithm: threshold
    formula: |
      if subtotal_cents < 2000:
        service_fee_cents = ceil(subtotal_cents * 0.15)  # 15% for small orders
      elif subtotal_cents < 5000:
        service_fee_cents = ceil(subtotal_cents * 0.10)  # 10% for medium orders
      else:
        service_fee_cents = ceil(subtotal_cents * 0.05)  # 5% for large orders

      # Minimum service fee
      service_fee_cents = max(service_fee_cents, 99)  # at least $0.99
    constants:
      SMALL_ORDER_THRESHOLD_CENTS: 2000
      MEDIUM_ORDER_THRESHOLD_CENTS: 5000
      SMALL_RATE: 0.15
      MEDIUM_RATE: 0.10
      LARGE_RATE: 0.05
      MINIMUM_SERVICE_FEE_CENTS: 99
    precision: "integer cents, ceil on percentage calculation"

  - name: small_order_fee
    trigger: "Order creation"
    algorithm: threshold
    formula: |
      if subtotal_cents < 1500:
        small_order_fee_cents = min(1500 - subtotal_cents, 500)
      else:
        small_order_fee_cents = 0
    constants:
      SMALL_ORDER_SUBTOTAL_THRESHOLD_CENTS: 1500
      MAX_SMALL_ORDER_FEE_CENTS: 500
    precision: "integer cents"

  - name: promotion_discount
    trigger: "Order creation with promotion_id"
    algorithm: tiered_pricing
    formula: |
      if promotion.status != ACTIVE: discount = 0
      if subtotal_cents < promotion.minimum_order_cents: discount = 0
      if customer has used this promotion >= max_uses_per_customer: discount = 0
      if promotion.current_uses >= promotion.max_uses: discount = 0

      switch promotion.discount_type:
        PERCENTAGE:
          discount = floor(subtotal_cents * promotion.discount_value / 100)
          if promotion.max_discount_cents:
            discount = min(discount, promotion.max_discount_cents)
        FIXED_AMOUNT:
          discount = promotion.discount_value
        FREE_DELIVERY:
          discount = delivery_fee_cents

      discount_cents = min(discount, subtotal_cents)  # discount cannot exceed subtotal
      promotion.current_uses += 1
    precision: "integer cents, floor on percentage"

  - name: order_total
    trigger: "Order creation, after all fee calculations"
    algorithm: aggregation
    formula: |
      total_cents = subtotal_cents + delivery_fee_cents + service_fee_cents
                    + small_order_fee_cents - discount_cents + tip_cents
      total_cents must be >= 0
    precision: "integer cents"

  - name: commission_and_payouts
    trigger: "Order delivery (DELIVERED status)"
    algorithm: aggregation
    formula: |
      # Restaurant payout
      commission_amount_cents = floor(subtotal_cents * restaurant.commission_rate)
      restaurant_payout_cents = subtotal_cents - commission_amount_cents

      # Rider payout
      rider_platform_fee_cents = floor(delivery_fee_cents * 0.20)  # 20% platform take on delivery fee
      rider_payout_cents = delivery_fee_cents - rider_platform_fee_cents + tip_cents
    constants:
      RIDER_PLATFORM_FEE_RATE: 0.20
    precision: "integer cents, floor on multiplication"
    variants:
      - name: provisional_payout
        when: "At order confirmation, for display/estimation"
        difference: "Uses provisional_delivery_fee, may change after rider assignment"
      - name: final_payout
        when: "At delivery completion"
        difference: "Uses final_delivery_fee with actual vehicle surcharges"

  - name: rider_penalty_scoring
    trigger: "Late delivery, cancellation, upheld complaint, no-show"
    algorithm: weighted_scoring
    formula: |
      Penalty points accumulated per event:
        LATE_DELIVERY: +10 points
        CANCELLATION: +20 points
        COMPLAINT_UPHELD: +15 points
        NO_SHOW: +25 points

      If penalty_points >= 100: rider auto-suspended

      On reinstatement by admin: penalty_points reset to 0
    constants:
      LATE_DELIVERY_POINTS: 10
      CANCELLATION_POINTS: 20
      COMPLAINT_UPHELD_POINTS: 15
      NO_SHOW_POINTS: 25
      SUSPENSION_THRESHOLD: 100
    precision: "integer points"

  - name: rider_cancellation_rate
    trigger: "After each delivery completion or cancellation"
    algorithm: aggregation
    formula: |
      if total_deliveries_completed == 0:
        cancellation_rate = 0.0
      else:
        cancellation_rate = cancellation_count / (total_deliveries_completed + cancellation_count)
    precision: "4 decimal places, round_half_up"

  - name: rating_average
    trigger: "New rating published"
    algorithm: aggregation
    formula: |
      For restaurant: average of all PUBLISHED ratings where rater_type = CUSTOMER_TO_RESTAURANT
      For rider: average of all PUBLISHED ratings where rater_type in (CUSTOMER_TO_RIDER, RESTAURANT_TO_RIDER)

      rating_average = sum(scores) / count(scores)
      If count == 0: rating_average = 0.0
    precision: "2 decimal places, round_half_up"

  - name: loyalty_points
    trigger: "Order delivered"
    algorithm: aggregation
    formula: |
      points_earned = floor(order.total_cents / 100)
      customer.loyalty_points += points_earned

      Loyalty redemption rate: 100 points = 100 cents ($1.00)
      Minimum redemption: 500 points
      Customer can redeem points on order creation to reduce total
    constants:
      POINTS_PER_CENT: 1
      POINTS_REDEMPTION_RATE_CENTS: 1
      MINIMUM_REDEMPTION_POINTS: 500

  - name: settlement_calculation
    trigger: "POST /platform/settlements/run"
    algorithm: chronological
    formula: |
      For each restaurant with balance_pending_cents > 0:
        Create Settlement with gross = balance_pending_cents
        deductions = sum of clawbacks from resolved complaints in period
        net = gross - deductions
        restaurant.balance_pending_cents = 0
        restaurant.balance_settled_cents += net

      For each rider with earnings_balance_cents > 0:
        Create Settlement with gross = earnings_balance_cents
        deductions = 0  # rider penalties are already point-based, not monetary
        net = gross
        rider.earnings_balance_cents = 0
        rider.earnings_settled_cents += net
    precision: "integer cents"
    variants:
      - name: gross_settlement
        when: "No complaints resolved against restaurant in period"
        difference: "deductions = 0, net = gross"
      - name: net_settlement_with_clawback
        when: "Complaints resolved with refund in period"
        difference: "deductions include restaurant_payout_cents from refunded orders, net < gross"

  - name: estimated_delivery_time
    trigger: "Order creation and delivery assignment"
    algorithm: threshold
    formula: |
      distance_km = haversine(restaurant, delivery_address)

      base_time by vehicle:
        BICYCLE: 3 min/km
        MOTORCYCLE: 1.5 min/km
        CAR: 2 min/km

      estimated_delivery_time_minutes = ceil(distance_km * base_time) + estimated_prep_time_minutes

      Late threshold: actual_delivery_time > estimated_delivery_time * 1.5
    constants:
      BICYCLE_MIN_PER_KM: 3
      MOTORCYCLE_MIN_PER_KM: 1.5
      CAR_MIN_PER_KM: 2
      LATE_THRESHOLD_MULTIPLIER: 1.5
    precision: "integer minutes, ceil"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Role header must be present and contain a valid role"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Id header must be present"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Caller role must be authorized for the requested endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Referenced restaurant must exist"
    error_id: ERR_RESTAURANT_NOT_FOUND
    http_status: 404
    applies_to: "all restaurant-scoped endpoints"

  - priority: 5
    category: existence
    check: "Referenced customer must exist"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "order creation, customer endpoints"

  - priority: 6
    category: existence
    check: "Referenced rider must exist"
    error_id: ERR_RIDER_NOT_FOUND
    http_status: 404
    applies_to: "delivery assignment, rider endpoints"

  - priority: 7
    category: existence
    check: "Referenced order must exist"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all order-scoped endpoints"

  - priority: 8
    category: existence
    check: "Referenced menu item must exist and belong to the correct restaurant"
    error_id: ERR_MENU_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "order creation"

  - priority: 9
    category: existence
    check: "Referenced delivery must exist"
    error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "delivery action endpoints"

  - priority: 10
    category: existence
    check: "Referenced complaint must exist"
    error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    applies_to: "complaint action endpoints"

  - priority: 11
    category: existence
    check: "Referenced promotion must exist"
    error_id: ERR_PROMOTION_NOT_FOUND
    http_status: 404
    applies_to: "order creation with promotion_id"

  - priority: 12
    category: state
    check: "Resource must be in valid state for requested operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 13
    category: state
    check: "Restaurant must be ACTIVE to accept/process orders"
    error_id: ERR_RESTAURANT_NOT_ACTIVE
    http_status: 409
    applies_to: "order creation, order confirmation"

  - priority: 14
    category: state
    check: "Restaurant must be accepting orders (is_accepting_orders = true)"
    error_id: ERR_RESTAURANT_NOT_ACCEPTING
    http_status: 409
    applies_to: "order creation"

  - priority: 15
    category: state
    check: "Customer must be ACTIVE"
    error_id: ERR_CUSTOMER_NOT_ACTIVE
    http_status: 409
    applies_to: "order creation"

  - priority: 16
    category: state
    check: "Rider must be ACTIVE and is_online = true for delivery assignment"
    error_id: ERR_RIDER_NOT_AVAILABLE
    http_status: 409
    applies_to: "delivery assignment"

  - priority: 17
    category: business_constraint
    check: "Menu item must be available (is_available = true)"
    error_id: ERR_ITEM_NOT_AVAILABLE
    http_status: 409
    applies_to: "order creation"

  - priority: 18
    category: business_constraint
    check: "Rider must not be at capacity (active_delivery_count < max_concurrent_deliveries)"
    error_id: ERR_RIDER_AT_CAPACITY
    http_status: 409
    applies_to: "delivery assignment"

  - priority: 19
    category: business_constraint
    check: "Order must have at least one order item"
    error_id: ERR_EMPTY_ORDER
    http_status: 422
    applies_to: "order creation"

  - priority: 20
    category: business_constraint
    check: "OrderItem quantity must be >= 1"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "order creation"

  - priority: 21
    category: business_constraint
    check: "Order cannot have more than 20 distinct items"
    error_id: ERR_TOO_MANY_ITEMS
    http_status: 422
    applies_to: "order creation"

  - priority: 22
    category: business_constraint
    check: "All order items must belong to the same restaurant as the order"
    error_id: ERR_CROSS_RESTAURANT_ORDER
    http_status: 422
    applies_to: "order creation"

  - priority: 23
    category: business_fiscal
    check: "Customer wallet balance must be sufficient for order total (if wallet payment)"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "order confirmation (payment authorization)"

  - priority: 24
    category: business_fiscal
    check: "Promotion must be valid (ACTIVE, within date range, not exhausted, customer under per-customer limit)"
    error_id: ERR_PROMOTION_NOT_VALID
    http_status: 422
    applies_to: "order creation with promotion"

  - priority: 25
    category: business_fiscal
    check: "Order subtotal must meet promotion minimum_order_cents"
    error_id: ERR_BELOW_MINIMUM_ORDER
    http_status: 422
    applies_to: "order creation with promotion"

  - priority: 26
    category: business_fiscal
    check: "Loyalty redemption requires at least 500 points"
    error_id: ERR_INSUFFICIENT_LOYALTY_POINTS
    http_status: 422
    applies_to: "order creation with loyalty redemption"

  - priority: 27
    category: business_constraint
    check: "Tip must be non-negative"
    error_id: ERR_INVALID_TIP
    http_status: 422
    applies_to: "order creation"

  - priority: 28
    category: business_constraint
    check: "Rating score must be 1-5"
    error_id: ERR_INVALID_RATING
    http_status: 422
    applies_to: "rating creation"

  - priority: 29
    category: business_constraint
    check: "Order must be DELIVERED to create a rating"
    error_id: ERR_ORDER_NOT_DELIVERED
    http_status: 409
    applies_to: "rating creation"

  - priority: 30
    category: business_constraint
    check: "Duplicate rating (same rater_type + rater_id + order_id) not allowed"
    error_id: ERR_DUPLICATE_RATING
    http_status: 409
    applies_to: "rating creation"

  - priority: 31
    category: business_constraint
    check: "Complaint can only be filed on DELIVERED or CANCELLED orders"
    error_id: ERR_ORDER_NOT_ELIGIBLE_FOR_COMPLAINT
    http_status: 409
    applies_to: "complaint creation"

  - priority: 32
    category: business_constraint
    check: "Maximum 2 complaints per order"
    error_id: ERR_MAX_COMPLAINTS_REACHED
    http_status: 409
    applies_to: "complaint creation"

  - priority: 33
    category: business_fiscal
    check: "Complaint resolution amount cannot exceed order total_cents"
    error_id: ERR_RESOLUTION_EXCEEDS_ORDER
    http_status: 422
    applies_to: "complaint resolution"

  - priority: 34
    category: business_constraint
    check: "Surge multiplier must be >= 1.0 and <= 3.0"
    error_id: ERR_INVALID_SURGE_MULTIPLIER
    http_status: 422
    applies_to: "surge zone creation/update"

  - priority: 35
    category: business_constraint
    check: "Customer cannot cancel order once it is PREPARING or beyond"
    error_id: ERR_CANCELLATION_TOO_LATE
    http_status: 409
    applies_to: "customer order cancellation"

  - priority: 36
    category: concurrency
    check: "If-Match header must match current version on PUT/PATCH"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PUT/PATCH endpoints"

  - priority: 37
    category: business_constraint
    check: "Phone number must be unique across customers (or riders for rider phone)"
    error_id: ERR_DUPLICATE_PHONE
    http_status: 409
    applies_to: "customer creation, rider creation"

  - priority: 38
    category: business_constraint
    check: "Promotion code must be unique"
    error_id: ERR_DUPLICATE_PROMOTION_CODE
    http_status: 409
    applies_to: "promotion creation"

  - priority: 39
    category: business_constraint
    check: "No active orders in CONFIRMED/PREPARING for restaurant closure"
    error_id: ERR_ACTIVE_ORDERS_EXIST
    http_status: 409
    applies_to: "restaurant close (from ACTIVE)"

  - priority: 40
    category: business_constraint
    check: "No active deliveries for rider deactivation (from ACTIVE)"
    error_id: ERR_ACTIVE_DELIVERIES_EXIST
    http_status: 409
    applies_to: "rider deactivation"

# =============================================================================
# Table 5: API Endpoint Table (40 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 20, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Restaurant Management ---
  - method: POST
    path: "/platform/restaurants"
    description: "Register a new restaurant"
    authorized_roles: [platform_admin]
    success_code: 201
    request_body: [name, cuisine_type, address, latitude, longitude, commission_rate, average_prep_time_minutes]
    response: Restaurant
    side_effects: ["status set to PENDING_APPROVAL"]

  - method: GET
    path: "/platform/restaurants"
    description: "List all restaurants with optional filtering by status, cuisine_type"
    authorized_roles: [platform_admin, customer]
    success_code: 200
    request_body: []
    response: "Restaurant[]"
    side_effects: []

  - method: GET
    path: "/platform/restaurants/:restaurant_id"
    description: "Get restaurant details"
    authorized_roles: [platform_admin, restaurant, customer]
    success_code: 200
    request_body: []
    response: Restaurant
    side_effects: []

  - method: PATCH
    path: "/platform/restaurants/:restaurant_id"
    description: "Update restaurant details (name, address, is_accepting_orders, average_prep_time_minutes)"
    authorized_roles: [restaurant, platform_admin]
    success_code: 200
    request_body: ["name?", "address?", "is_accepting_orders?", "average_prep_time_minutes?", "version"]
    response: Restaurant
    side_effects: []

  - method: POST
    path: "/platform/restaurants/:restaurant_id/approve"
    description: "Approve a pending restaurant"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Restaurant
    side_effects: ["PENDING_APPROVAL -> ACTIVE"]

  - method: POST
    path: "/platform/restaurants/:restaurant_id/suspend"
    description: "Suspend a restaurant"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Restaurant
    side_effects: ["ACTIVE -> SUSPENDED, cascade cancel PLACED orders"]

  - method: POST
    path: "/platform/restaurants/:restaurant_id/reinstate"
    description: "Reinstate a suspended restaurant"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Restaurant
    side_effects: ["SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/platform/restaurants/:restaurant_id/close"
    description: "Permanently close a restaurant"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Restaurant
    side_effects: ["ACTIVE/SUSPENDED -> CLOSED"]

  # --- Menu Items ---
  - method: POST
    path: "/platform/restaurants/:restaurant_id/menu-items"
    description: "Add a menu item to a restaurant"
    authorized_roles: [restaurant]
    success_code: 201
    request_body: [name, base_price_cents, category, prep_time_minutes, "description?", "is_available?"]
    response: MenuItem
    side_effects: []

  - method: GET
    path: "/platform/restaurants/:restaurant_id/menu-items"
    description: "List menu items for a restaurant, filterable by category, is_available"
    authorized_roles: [restaurant, customer, platform_admin]
    success_code: 200
    request_body: []
    response: "MenuItem[]"
    side_effects: []

  - method: PATCH
    path: "/platform/restaurants/:restaurant_id/menu-items/:menu_item_id"
    description: "Update a menu item (price, availability, etc.)"
    authorized_roles: [restaurant]
    success_code: 200
    request_body: ["name?", "base_price_cents?", "is_available?", "prep_time_minutes?", "description?", "version"]
    response: MenuItem
    side_effects: []

  # --- Customer Management ---
  - method: POST
    path: "/platform/customers"
    description: "Register a new customer"
    authorized_roles: [platform_admin, customer]
    success_code: 201
    request_body: [name, phone, "default_address?", "default_latitude?", "default_longitude?"]
    response: Customer
    side_effects: ["status set to ACTIVE, wallet_balance_cents = 0"]

  - method: GET
    path: "/platform/customers/:customer_id"
    description: "Get customer details"
    authorized_roles: [customer, platform_admin, customer_service]
    success_code: 200
    request_body: []
    response: Customer
    side_effects: []

  - method: PATCH
    path: "/platform/customers/:customer_id"
    description: "Update customer profile"
    authorized_roles: [customer]
    success_code: 200
    request_body: ["name?", "phone?", "default_address?", "default_latitude?", "default_longitude?", "version"]
    response: Customer
    side_effects: []

  - method: POST
    path: "/platform/customers/:customer_id/wallet/top-up"
    description: "Add funds to customer wallet"
    authorized_roles: [customer]
    success_code: 200
    request_body: [amount_cents]
    response: Customer
    side_effects: ["WalletTransaction created, wallet_balance_cents += amount_cents"]

  # --- Rider Management ---
  - method: POST
    path: "/platform/riders"
    description: "Register a new rider"
    authorized_roles: [platform_admin]
    success_code: 201
    request_body: [name, phone, vehicle_type, "max_concurrent_deliveries?"]
    response: Rider
    side_effects: ["status set to PENDING_APPROVAL"]

  - method: GET
    path: "/platform/riders"
    description: "List riders with optional filtering by status, vehicle_type, is_online"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: "Rider[]"
    side_effects: []

  - method: GET
    path: "/platform/riders/:rider_id"
    description: "Get rider details"
    authorized_roles: [rider, platform_admin]
    success_code: 200
    request_body: []
    response: Rider
    side_effects: []

  - method: PATCH
    path: "/platform/riders/:rider_id"
    description: "Update rider profile (location, online status)"
    authorized_roles: [rider]
    success_code: 200
    request_body: ["current_latitude?", "current_longitude?", "is_online?", "max_concurrent_deliveries?", "version"]
    response: Rider
    side_effects: []

  - method: POST
    path: "/platform/riders/:rider_id/approve"
    description: "Approve a pending rider"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Rider
    side_effects: ["PENDING_APPROVAL -> ACTIVE"]

  - method: POST
    path: "/platform/riders/:rider_id/suspend"
    description: "Suspend a rider"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Rider
    side_effects: ["ACTIVE -> SUSPENDED, cascade effects on active deliveries"]

  - method: POST
    path: "/platform/riders/:rider_id/reinstate"
    description: "Reinstate a suspended rider"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Rider
    side_effects: ["SUSPENDED -> ACTIVE, penalty_points reset to 0"]

  - method: POST
    path: "/platform/riders/:rider_id/deactivate"
    description: "Permanently deactivate a rider"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Rider
    side_effects: ["ACTIVE/SUSPENDED -> DEACTIVATED"]

  # --- Orders ---
  - method: POST
    path: "/platform/orders"
    description: "Place a new order"
    authorized_roles: [customer]
    success_code: 201
    request_body: [customer_id, restaurant_id, delivery_address, delivery_latitude, delivery_longitude, items, "tip_cents?", "promotion_id?", "special_instructions?", "loyalty_points_to_redeem?"]
    response: Order
    side_effects:
      - "Order created in PLACED status with payment_status PENDING"
      - "OrderItems created from items array"
      - "subtotal, fees, discount, total computed"
      - "Promotion usage incremented if applicable"

  - method: GET
    path: "/platform/orders"
    description: "List orders with filtering by customer_id, restaurant_id, status"
    authorized_roles: [customer, restaurant, platform_admin, customer_service]
    success_code: 200
    request_body: []
    response: "Order[]"
    side_effects: []

  - method: GET
    path: "/platform/orders/:order_id"
    description: "Get order details including items"
    authorized_roles: [customer, restaurant, rider, platform_admin, customer_service]
    success_code: 200
    request_body: []
    response: Order
    side_effects: []

  - method: POST
    path: "/platform/orders/:order_id/confirm"
    description: "Restaurant confirms an order"
    authorized_roles: [restaurant]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["PLACED -> CONFIRMED, payment PENDING -> AUTHORIZED"]

  - method: POST
    path: "/platform/orders/:order_id/start-preparing"
    description: "Restaurant starts preparing the order"
    authorized_roles: [restaurant]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["CONFIRMED -> PREPARING"]

  - method: POST
    path: "/platform/orders/:order_id/mark-ready"
    description: "Restaurant marks order as ready for pickup"
    authorized_roles: [restaurant]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["PREPARING -> READY_FOR_PICKUP"]

  - method: POST
    path: "/platform/orders/:order_id/pickup"
    description: "Rider picks up the order"
    authorized_roles: [rider]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["READY_FOR_PICKUP -> PICKED_UP, delivery status updated"]

  - method: POST
    path: "/platform/orders/:order_id/deliver"
    description: "Rider confirms delivery"
    authorized_roles: [rider]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["PICKED_UP -> DELIVERED, payment captured, payouts credited, loyalty points awarded"]

  - method: POST
    path: "/platform/orders/:order_id/cancel"
    description: "Customer cancels an order"
    authorized_roles: [customer]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["PLACED/CONFIRMED -> CANCELLED_BY_CUSTOMER, refund if authorized"]

  - method: POST
    path: "/platform/orders/:order_id/reject"
    description: "Restaurant rejects an order"
    authorized_roles: [restaurant]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["PLACED/CONFIRMED -> CANCELLED_BY_RESTAURANT, refund if authorized"]

  - method: POST
    path: "/platform/orders/:order_id/platform-cancel"
    description: "Platform admin cancels an order"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Order
    side_effects: ["Any pre-delivery state -> CANCELLED_BY_PLATFORM, refund if authorized"]

  # --- Deliveries ---
  - method: POST
    path: "/platform/orders/:order_id/deliveries"
    description: "Assign a rider to deliver an order"
    authorized_roles: [platform_admin]
    success_code: 201
    request_body: [rider_id]
    response: Delivery
    side_effects: ["Delivery created in ASSIGNED status, rider.active_delivery_count += 1, distance_km computed"]

  - method: GET
    path: "/platform/orders/:order_id/deliveries/:delivery_id"
    description: "Get delivery details"
    authorized_roles: [rider, restaurant, platform_admin]
    success_code: 200
    request_body: []
    response: Delivery
    side_effects: []

  - method: POST
    path: "/platform/orders/:order_id/deliveries/:delivery_id/start"
    description: "Rider starts heading to restaurant"
    authorized_roles: [rider]
    success_code: 200
    request_body: []
    response: Delivery
    side_effects: ["ASSIGNED -> HEADING_TO_RESTAURANT"]

  - method: POST
    path: "/platform/orders/:order_id/deliveries/:delivery_id/arrive"
    description: "Rider arrives at restaurant"
    authorized_roles: [rider]
    success_code: 200
    request_body: []
    response: Delivery
    side_effects: ["HEADING_TO_RESTAURANT -> AT_RESTAURANT"]

  - method: POST
    path: "/platform/orders/:order_id/deliveries/:delivery_id/cancel"
    description: "Rider cancels a delivery"
    authorized_roles: [rider]
    success_code: 200
    request_body: []
    response: Delivery
    side_effects: ["ASSIGNED/HEADING_TO_RESTAURANT -> CANCELLED_BY_RIDER, penalty applied"]

  # --- Ratings ---
  - method: POST
    path: "/platform/orders/:order_id/ratings"
    description: "Submit a rating for an order"
    authorized_roles: [customer, restaurant]
    success_code: 201
    request_body: [rater_type, rater_id, ratee_id, score, "comment?"]
    response: Rating
    side_effects: ["Rating created in PENDING status"]

  - method: GET
    path: "/platform/orders/:order_id/ratings"
    description: "List ratings for an order"
    authorized_roles: [customer, restaurant, rider, platform_admin]
    success_code: 200
    request_body: []
    response: "Rating[]"
    side_effects: []

  - method: POST
    path: "/platform/orders/:order_id/ratings/:rating_id/publish"
    description: "Publish a pending rating"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Rating
    side_effects: ["PENDING -> PUBLISHED, restaurant/rider rating_average recalculated"]

  - method: POST
    path: "/platform/orders/:order_id/ratings/:rating_id/hide"
    description: "Hide a published rating"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Rating
    side_effects: ["PUBLISHED -> HIDDEN, restaurant/rider rating_average recalculated"]

  # --- Complaints ---
  - method: POST
    path: "/platform/orders/:order_id/complaints"
    description: "File a complaint about an order"
    authorized_roles: [customer, restaurant, rider]
    success_code: 201
    request_body: [filed_by, filer_id, category, description]
    response: Complaint
    side_effects: ["Complaint created in FILED status"]

  - method: GET
    path: "/platform/orders/:order_id/complaints"
    description: "List complaints for an order"
    authorized_roles: [customer, restaurant, rider, platform_admin, customer_service]
    success_code: 200
    request_body: []
    response: "Complaint[]"
    side_effects: []

  - method: POST
    path: "/platform/orders/:order_id/complaints/:complaint_id/assign"
    description: "Assign a customer service agent to a complaint"
    authorized_roles: [customer_service, platform_admin]
    success_code: 200
    request_body: [assigned_agent_id]
    response: Complaint
    side_effects: ["FILED -> UNDER_REVIEW or ESCALATED -> UNDER_REVIEW"]

  - method: POST
    path: "/platform/orders/:order_id/complaints/:complaint_id/escalate"
    description: "Escalate a complaint"
    authorized_roles: [customer_service]
    success_code: 200
    request_body: []
    response: Complaint
    side_effects: ["UNDER_REVIEW -> ESCALATED"]

  - method: POST
    path: "/platform/orders/:order_id/complaints/:complaint_id/resolve"
    description: "Resolve a complaint with a decision"
    authorized_roles: [customer_service, platform_admin]
    success_code: 200
    request_body: [resolution_type, "resolution_amount_cents?"]
    response: Complaint
    side_effects: ["UNDER_REVIEW/ESCALATED -> RESOLVED_*, potential refund/credit, potential rider penalty"]

  # --- Promotions ---
  - method: POST
    path: "/platform/promotions"
    description: "Create a promotion"
    authorized_roles: [platform_admin]
    success_code: 201
    request_body: [code, discount_type, discount_value, minimum_order_cents, max_uses, valid_from, valid_until, "max_discount_cents?", "max_uses_per_customer?", "restaurant_id?"]
    response: Promotion
    side_effects: ["Promotion created in ACTIVE status"]

  - method: GET
    path: "/platform/promotions"
    description: "List promotions with optional filtering by status"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: "Promotion[]"
    side_effects: []

  - method: GET
    path: "/platform/promotions/:promotion_id"
    description: "Get promotion details"
    authorized_roles: [platform_admin, customer]
    success_code: 200
    request_body: []
    response: Promotion
    side_effects: []

  - method: POST
    path: "/platform/promotions/:promotion_id/disable"
    description: "Disable an active promotion"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Promotion
    side_effects: ["ACTIVE -> DISABLED"]

  # --- Surge Zones ---
  - method: POST
    path: "/platform/surge-zones"
    description: "Create a surge pricing zone"
    authorized_roles: [platform_admin]
    success_code: 201
    request_body: [zone_name, center_latitude, center_longitude, radius_km, surge_multiplier]
    response: SurgeZone
    side_effects: ["SurgeZone created in ACTIVE status"]

  - method: GET
    path: "/platform/surge-zones"
    description: "List surge zones"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: "SurgeZone[]"
    side_effects: []

  - method: PATCH
    path: "/platform/surge-zones/:surge_zone_id"
    description: "Update surge zone (multiplier, radius, status)"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: ["surge_multiplier?", "radius_km?", "status?", "version"]
    response: SurgeZone
    side_effects: []

  # --- Settlements ---
  - method: POST
    path: "/platform/settlements/run"
    description: "Run settlement calculation for all pending balances"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: [period_start, period_end]
    response: "Settlement[]"
    side_effects: ["Settlements created, balances zeroed and settled amounts updated"]

  - method: GET
    path: "/platform/settlements"
    description: "List settlements with filtering by entity_type, status"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/platform/settlements/:settlement_id/approve"
    description: "Approve a calculated settlement for payout"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Settlement
    side_effects: ["CALCULATED -> APPROVED"]

  - method: POST
    path: "/platform/settlements/:settlement_id/mark-paid"
    description: "Mark an approved settlement as paid"
    authorized_roles: [platform_admin]
    success_code: 200
    request_body: []
    response: Settlement
    side_effects: ["APPROVED -> PAID"]

# =============================================================================
# Table 6: Error Code Catalog (38 error codes)
# =============================================================================
errors:
  # --- Auth errors ---
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "Missing or invalid X-Role or X-User-Id header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller role is not authorized for this endpoint"

  # --- Not found errors ---
  - id: ERR_RESTAURANT_NOT_FOUND
    http: 404
    condition: "Referenced restaurant does not exist"

  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "Referenced menu item does not exist or does not belong to the restaurant"

  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Referenced customer does not exist"

  - id: ERR_RIDER_NOT_FOUND
    http: 404
    condition: "Referenced rider does not exist"

  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order does not exist"

  - id: ERR_DELIVERY_NOT_FOUND
    http: 404
    condition: "Referenced delivery does not exist"

  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "Referenced complaint does not exist"

  - id: ERR_RATING_NOT_FOUND
    http: 404
    condition: "Referenced rating does not exist"

  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "Referenced promotion does not exist"

  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "Referenced settlement does not exist"

  - id: ERR_SURGE_ZONE_NOT_FOUND
    http: 404
    condition: "Referenced surge zone does not exist"

  # --- State errors ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for the requested operation"

  - id: ERR_RESTAURANT_NOT_ACTIVE
    http: 409
    condition: "Restaurant must be ACTIVE for this operation"

  - id: ERR_RESTAURANT_NOT_ACCEPTING
    http: 409
    condition: "Restaurant is not currently accepting orders (is_accepting_orders = false)"

  - id: ERR_CUSTOMER_NOT_ACTIVE
    http: 409
    condition: "Customer must be ACTIVE for this operation"

  - id: ERR_RIDER_NOT_AVAILABLE
    http: 409
    condition: "Rider is not ACTIVE or not online"

  - id: ERR_RIDER_AT_CAPACITY
    http: 409
    condition: "Rider has reached maximum concurrent deliveries"

  - id: ERR_CANCELLATION_TOO_LATE
    http: 409
    condition: "Customer cannot cancel order after PREPARING has started"

  - id: ERR_ACTIVE_ORDERS_EXIST
    http: 409
    condition: "Cannot close restaurant while CONFIRMED/PREPARING orders exist"

  - id: ERR_ACTIVE_DELIVERIES_EXIST
    http: 409
    condition: "Cannot deactivate rider while active deliveries exist"

  # --- Business constraint errors ---
  - id: ERR_ITEM_NOT_AVAILABLE
    http: 409
    condition: "Menu item is not currently available"

  - id: ERR_EMPTY_ORDER
    http: 422
    condition: "Order must contain at least one item"

  - id: ERR_INVALID_QUANTITY
    http: 422
    condition: "Order item quantity must be >= 1"

  - id: ERR_TOO_MANY_ITEMS
    http: 422
    condition: "Order cannot contain more than 20 distinct items"

  - id: ERR_CROSS_RESTAURANT_ORDER
    http: 422
    condition: "All order items must belong to the same restaurant"

  - id: ERR_DUPLICATE_PHONE
    http: 409
    condition: "Phone number is already registered"

  - id: ERR_DUPLICATE_PROMOTION_CODE
    http: 409
    condition: "Promotion code already exists"

  - id: ERR_DUPLICATE_RATING
    http: 409
    condition: "A rating with the same rater_type, rater_id, and order_id already exists"

  - id: ERR_ORDER_NOT_DELIVERED
    http: 409
    condition: "Order must be in DELIVERED status to submit a rating"

  - id: ERR_ORDER_NOT_ELIGIBLE_FOR_COMPLAINT
    http: 409
    condition: "Order must be DELIVERED or CANCELLED to file a complaint"

  - id: ERR_MAX_COMPLAINTS_REACHED
    http: 409
    condition: "Maximum of 2 complaints per order already filed"

  # --- Fiscal errors ---
  - id: ERR_INSUFFICIENT_BALANCE
    http: 402
    condition: "Customer wallet balance is insufficient for order total"

  - id: ERR_PROMOTION_NOT_VALID
    http: 422
    condition: "Promotion is not active, expired, exhausted, or customer has exceeded per-customer limit"

  - id: ERR_BELOW_MINIMUM_ORDER
    http: 422
    condition: "Order subtotal does not meet promotion minimum_order_cents"

  - id: ERR_INSUFFICIENT_LOYALTY_POINTS
    http: 422
    condition: "Customer does not have enough loyalty points for redemption (minimum 500)"

  - id: ERR_RESOLUTION_EXCEEDS_ORDER
    http: 422
    condition: "Complaint resolution amount cannot exceed order total_cents"

  - id: ERR_INVALID_SURGE_MULTIPLIER
    http: 422
    condition: "Surge multiplier must be between 1.0 and 3.0 inclusive"

  - id: ERR_INVALID_TIP
    http: 422
    condition: "Tip amount must be non-negative"

  - id: ERR_INVALID_RATING
    http: 422
    condition: "Rating score must be between 1 and 5 inclusive"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match header value does not match current resource version"

  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General request format error (missing required fields, invalid types)"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: platform_admin
    description: "Platform operator with full administrative access"
    exclusive_operations:
      - "Register restaurants and riders"
      - "Approve/suspend/reinstate/close/deactivate restaurants and riders"
      - "Create and disable promotions"
      - "Create and manage surge zones"
      - "Assign deliveries to riders"
      - "Run settlements and approve/mark-paid"
      - "Platform-cancel orders"
      - "Publish/hide ratings"
      - "Resolve escalated complaints"
    shared_operations:
      - "View restaurants, orders, riders, complaints, ratings, settlements"

  - name: restaurant
    description: "Restaurant owner/manager who manages menu and processes orders"
    exclusive_operations:
      - "Create and update menu items"
      - "Confirm orders"
      - "Start preparing orders"
      - "Mark orders as ready for pickup"
      - "Reject orders"
    shared_operations:
      - "View own restaurant details and orders"
      - "Submit ratings (RESTAURANT_TO_RIDER)"
      - "File complaints"

  - name: customer
    description: "End user who places orders and interacts with the platform"
    exclusive_operations:
      - "Place orders"
      - "Cancel own orders (pre-PREPARING)"
      - "Top up wallet"
      - "Redeem loyalty points"
    shared_operations:
      - "View restaurants and menu items"
      - "View own orders"
      - "Submit ratings (CUSTOMER_TO_RESTAURANT, CUSTOMER_TO_RIDER)"
      - "File complaints"

  - name: rider
    description: "Delivery rider who picks up and delivers orders"
    exclusive_operations:
      - "Start delivery (heading to restaurant)"
      - "Arrive at restaurant"
      - "Pick up order"
      - "Deliver order"
      - "Cancel own delivery"
      - "Update own location and online status"
    shared_operations:
      - "View assigned order details"
      - "File complaints"

  - name: customer_service
    description: "Support agent who handles complaints and customer issues"
    exclusive_operations:
      - "Assign complaints to agents"
      - "Escalate complaints"
      - "Resolve complaints (refund, credit, no action)"
    shared_operations:
      - "View orders, customers, complaints"
