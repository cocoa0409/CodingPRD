              payload: { title: "Partial batch", reversibility: "REVERSIBLE", decision_deadline: "2026-10-01T00:00:00Z", impacted_user_count: 4000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_id: $.data.id }
            - call: "POST /research-requests"
