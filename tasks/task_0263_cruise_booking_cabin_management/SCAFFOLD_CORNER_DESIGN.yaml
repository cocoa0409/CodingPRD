# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cruise Booking & Cabin Management — Expert
# Breadth probe across §1.1-§1.7. excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_sailing_minimal_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Sailing, endpoints]
        distinguishing_aspect: "POST /sailings with all required fields returns 201; status defaults to DRAFT, version=1, total_cabins=0, available_cabins=0, and a server-minted id/created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Sailing.${s_id}.status == DRAFT"
            - "Sailing.${s_id}.version == 1"
            - "Sailing.${s_id}.total_cabins == 0"
            - "Sailing.${s_id}.available_cabins == 0"

      - name: get_sailing_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Sailing, endpoints]
        distinguishing_aspect: "GET /sailings/{id} returns the previously created sailing with matching ship_name and itinerary_code."
        test_recipe:
          setup: ["One sailing created."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /sailings/${s_id}"
              payload: {}
              as: ReservationsAgent
          assert:
            - "HTTP status == 200"
            - "response data.ship_name == Aurora"
            - "response data.itinerary_code == WCAR7N"

      - name: list_sailings_paginated_envelope
        claim_type: Listing
        grounds: [entities.Sailing, endpoints]
        distinguishing_aspect: "GET /sailings returns an array response with pagination fields total_count and has_more in meta/data per the response envelope."
        test_recipe:
          setup: ["Two sailings created."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Borealis", itinerary_code: "NEUR10N", embark_date: "2026-10-01T16:00:00Z", disembark_date: "2026-10-11T16:00:00Z", nights: 10 }
              as: RevenueManager
          trigger:
            - call: "GET /sailings"
              payload: {}
              as: RevenueManager
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "total_count == 2 and has_more == false"

      - name: get_sailing_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Sailing, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /sailings/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /sailings/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_cabin_category_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds: [entities.CabinCategory, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cabin-categories omitting base_fare_per_guest_cents returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One sailing created."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, max_occupancy: 4 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: group_block_discount_pct_default_applied
        claim_type: Defaults
        grounds: [entities.GroupBlock.fields.group_discount_pct]
        distinguishing_aspect: "POST /group-blocks omitting group_discount_pct applies the default 0.15."
        test_recipe:
          setup: ["One sailing with a BALCONY category."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /group-blocks"
              payload: { sailing_id: "${s_id}", group_name: "Reunion", cabin_category_id: "${cc_id}", block_size: 2, release_cutoff_date: "2026-08-01T00:00:00Z" }
              as: RevenueManager
              captures: { gb_id: $.data.id }
          assert:
            - "GroupBlock.${gb_id}.group_discount_pct == 0.15"

      - name: cabin_status_system_field_ignores_client_input
        claim_type: System Fields
        grounds: [entities.Cabin.fields.status]
        distinguishing_aspect: "POST /cabins always starts the cabin in AVAILABLE; status is system-controlled and any client-supplied status is ignored (it is not an accepted input field)."
        test_recipe:
          setup: ["One sailing with a BALCONY category."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
              captures: { cab_id: $.data.id }
          assert:
            - "Cabin.${cab_id}.status == AVAILABLE"
            - "Cabin.${cab_id}.booking_id == null"

      - name: create_cabin_deck_out_of_category_range_rejected
        claim_type: Type Constraints
        grounds: [entities.Cabin.fields.deck, "errors[ERR_DECK_OUT_OF_RANGE]", "validations[priority=7]"]
        distinguishing_aspect: "POST /cabins with deck=12 in a category whose range is 8..10 returns 422 ERR_DECK_OUT_OF_RANGE."
        test_recipe:
          setup: ["One sailing with a BALCONY category deck_low=8 deck_high=10."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 12 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_DECK_OUT_OF_RANGE"

      - name: duplicate_category_code_on_sailing_rejected
        claim_type: Type Constraints
        grounds: [entities.CabinCategory.fields.code, "errors[ERR_DUPLICATE_CATEGORY_CODE]"]
        distinguishing_aspect: "Creating a second BALCONY category on the same sailing returns 409 ERR_DUPLICATE_CATEGORY_CODE."
        test_recipe:
          setup: ["One sailing with a BALCONY category."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
          trigger:
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 11, deck_high: 12, base_fare_per_guest_cents: 129900, max_occupancy: 4 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_CATEGORY_CODE"

      - name: duplicate_cabin_number_on_sailing_rejected
        claim_type: Type Constraints
        grounds: [entities.Cabin.fields.cabin_number, "errors[ERR_DUPLICATE_CABIN_NUMBER]"]
        distinguishing_aspect: "Creating a second cabin numbered 8001 on the same sailing returns 409 ERR_DUPLICATE_CABIN_NUMBER."
        test_recipe:
          setup: ["One sailing with a BALCONY category and cabin 8001."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
          trigger:
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 9 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_CABIN_NUMBER"

      - name: create_cabin_nonexistent_category_not_found
        claim_type: Parent Relationships
        grounds: [entities.Cabin.fields.cabin_category_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /cabins with an unknown cabin_category_id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cabins"
              payload: { cabin_category_id: "22222222-2222-4222-8222-222222222222", cabin_number: "8001", deck: 8 }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: filtered_list_cabins_by_category_fk_reverse_reachability
        claim_type: Listing
        grounds: [entities.Cabin.fields.cabin_category_id, endpoints]
        distinguishing_aspect: "GET /cabins?cabin_category_id=<cc> returns the Cabin[] children of that category (FK reverse-reachability filtered-list form)."
        test_recipe:
          setup: ["One BALCONY category with 2 cabins."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
          trigger:
            - call: "GET /cabins?cabin_category_id=${cc_id}"
              payload: {}
              as: RevenueManager
          assert:
            - "HTTP status == 200"
            - "total_count == 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_sailing_already_open_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Sailing.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling open on an already-OPEN sailing returns 409 ERR_INVALID_STATE (open is only valid from DRAFT or CLOSED)."
        test_recipe:
          setup: ["An OPEN sailing with a BALCONY category and one cabin."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: depart_before_embark_date_not_departable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Sailing.OPEN_to_SAILED, "errors[ERR_SAILING_NOT_DEPARTABLE]"]
        distinguishing_aspect: "Departing an OPEN sailing while the clock is before embark_date returns 409 ERR_SAILING_NOT_DEPARTABLE."
        test_recipe:
          setup: ["Clock at 2026-06-18T16:00:00Z; an OPEN sailing embarking 2026-09-01T16:00:00Z with one cabin."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${s_id}/depart"
              payload: {}
              as: PortAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_SAILING_NOT_DEPARTABLE"

      - name: terminal_sailing_cancelled_cannot_reopen
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Sailing, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED sailing is terminal; open returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT sailing, then cancelled."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /sailings/${s_id}/cancel"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: hold_deposit_without_guests_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.QUOTE_to_DEPOSIT_HELD, "errors[ERR_NO_GUESTS]"]
        distinguishing_aspect: "hold-deposit on a QUOTE booking with zero guests returns 409 ERR_NO_GUESTS."
        test_recipe:
          setup: ["An OPEN sailing with a BALCONY category and one cabin; a QUOTE booking with no guests."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-c1", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-c1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-c1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_NO_GUESTS"

      - name: hold_deposit_without_captured_deposit_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.QUOTE_to_DEPOSIT_HELD, "errors[ERR_DEPOSIT_NOT_SATISFIED]", "validations[priority=10]"]
        distinguishing_aspect: "hold-deposit with no captured DEPOSIT payment matching deposit_due_cents returns 402 ERR_DEPOSIT_NOT_SATISFIED."
        test_recipe:
          setup: ["An OPEN sailing, BALCONY category, one cabin; a QUOTE booking with 2 guests but no captured deposit."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-c2", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-c2"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C One", age: 40 }
              as: GuestUser
              as_user_id: "guest-c2"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-c2"
          trigger:
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-c2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 402"
            - "response data.error_id == ERR_DEPOSIT_NOT_SATISFIED"

      - name: confirm_without_full_balance_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.DEPOSIT_HELD_to_CONFIRMED, "errors[ERR_BALANCE_OUTSTANDING]", "validations[priority=10]"]
        distinguishing_aspect: "confirm a DEPOSIT_HELD booking whose amount_paid_cents (50000) < booking_total_cents (195978) returns 402 ERR_BALANCE_OUTSTANDING."
        test_recipe:
          setup: ["An OPEN sailing; a DEPOSIT_HELD booking, 2 guests, only the 50000 deposit captured."]
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-c3", expected_sailing_version: "${s_v}" }
