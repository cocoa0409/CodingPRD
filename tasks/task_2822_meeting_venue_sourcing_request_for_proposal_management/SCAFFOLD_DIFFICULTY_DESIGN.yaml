    - name: award_supersede_conserves_the_money_envelope
      grounds:
      - calculations.budget_envelope_invariant
      - calculations.contract_volume_rebate
      - state_machines.MeetingEvent.AWARDED_to_AWARDED
      - state_machines.Contract.IN_APPROVAL_to_CANCELLED
      - state_machines.Contract.UNSIGNED_to_VOIDED
      - state_machines.ApprovalStep.PENDING_to_SKIPPED
      - state_machines.Proposal.AWARDED_to_REJECTED
      - entities.MeetingEvent.fields.committed_spend_usd
      - concurrency_rules[award-with-stale-event]
      distinguishing_aspect: 'A different conserved quantity under a different compensating action: the MONEY envelope budget_remaining_usd + committed_spend_usd + cancellation_liability_usd == 500000.00 across an award supersede, where the voided contract must contribute exactly 0.00 - so committed_spend_usd becomes 284740.05, never the stale 432170.27 and never the double-counted 716910.32.'
