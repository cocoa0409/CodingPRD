  - section: state_machines
    instances:
      - name: brokerage_activation_moves_pending_to_active_and_the_self_affiliation_issues_the_broker
        claim_type: valid_transition
        grounds:
          - state_machines.Brokerage.PENDING_to_ACTIVE
          - state_machines.Licensee.license_status.EXAM_PASSED_to_ACTIVE
          - validations[priority=22]
        distinguishing_aspect: |
          Two transitions in a fixed order that a naive implementation collapses: activation only flips
          the brokerage to ACTIVE (status, posture, version) and leaves the designated broker
          EXAM_PASSED; the licence is issued by the separate self-affiliation call, which is also what
          increments affiliated_licensee_count. An implementation that issues the broker at activation
          double-counts the affiliation.
        test_recipe:
          setup:
            - "Dana Broker is EXAM_PASSED and Harbor Realty Group is PENDING with trust_account_required false"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: false, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id, bkg_v0: $.data.version }
          trigger:
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "no trust account required" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "GET /commission/licensees/${br_id}"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
          assert:
            - "the activation returns 200 with Brokerage.${bkg_id}.status == ACTIVE, supervision_posture == COMPLIANT and version == ${bkg_v1} == ${bkg_v0} + 1"
            - "immediately after activation the intermediate GET shows Licensee.${br_id}.license_status == EXAM_PASSED with sponsoring_brokerage_id == null - activation issues nobody"
            - "Brokerage.${bkg_id}.affiliated_licensee_count == 0 at that point"
            - "the affiliation returns 200 with Licensee.${br_id}.license_status == ACTIVE, sponsoring_brokerage_id == ${bkg_id}, supervising_broker_id == ${br_id}, license_issued_at == 2026-08-01T00:00:00Z, license_expires_at == 2028-07-31T00:00:00Z and ce_period_start_on == 2026-08-01"
            - "Brokerage.${bkg_id}.affiliated_licensee_count == 1 and version == ${bkg_v1} + 1 - counted exactly once"
            - "the self-supervision exemption of priority 22 applies: supervising_broker_id == the licensee's own id is accepted even though Dana was not yet ACTIVE when the call was evaluated"
      - name: hearing_convene_before_the_scheduled_start_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Hearing.SCHEDULED_to_CONVENED
          - validations[priority=46]
          - errors.ERR_HEARING_NOT_STARTED
        distinguishing_aspect: |
          CONVENE is legal from SCHEDULED but only at or after scheduled_start_at, so the same call
          with the same body flips from 409 to 200 on the strength of the logical clock alone. The
          boundary is inclusive: exactly scheduled_start_at convenes.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising"
            - "a MISREPRESENTATION complaint alleging 1000000 cents against Dana reached PROBABLE_CAUSE (investigation score 50) and a hearing is SCHEDULED for 2026-08-10T09:00:00Z in ROOM-A under chair-01"
            - "the clock is still 2026-08-01T00:00:00Z"
