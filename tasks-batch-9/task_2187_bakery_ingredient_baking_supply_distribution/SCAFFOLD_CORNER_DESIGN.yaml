      - name: corner_layer_quarantine_cascade_four_hops_unseals_route_and_clears_lock
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Lot.AVAILABLE_to_QUARANTINED
          - state_machines.DeliveryRoute.SEALED_to_PLANNING
        distinguishing_aspect: "One quarantine drives the whole four-hop chain in a single request: line UNALLOCATED, order back to NEW, stop CANCELLED with the route's aggregates recomputed, and - because stop_count hit 0 on a SEALED route - the route reverts to PLANNING with allergen_class_lock reset to NONE, while lot pounds stay conserved."
