  # ===========================================================================
  - section: validations
    instances:

      - name: v_missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", errors.ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header is 401 ERR_UNAUTHENTICATED regardless of how valid the rest of the request is."
        test_recipe:
          setup: ["Clock at default. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /jurisdictions"
              payload: {}
              as: "Anonymous"
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response status is 401 and err_auth == ERR_UNAUTHENTICATED"

      - name: v_existence_checked_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", errors.ERR_NOT_FOUND]
        distinguishing_aspect: "A deposit submit where the deposit id itself does not exist yields 404 ERR_NOT_FOUND (priority 4), never the 409 ERR_INVALID_STATE that a real but wrongly-stated deposit would produce."
        test_recipe:
          setup: ["Clock at default. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /deposits/00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: BureauTaxFiler
              captures: { err_ex: $.data.error_id }
          assert:
            - "the response status is 404 and err_ex == ERR_NOT_FOUND"

      - name: v_duplicate_deposit_returns_domain_error
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", errors.ERR_DUPLICATE_DEPOSIT]
        distinguishing_aspect: "Excluded: exercised as the first trigger leg of the §1.8 overlap instance."
        excluded_because:
          difficulty_instance: deposit_uniqueness_window_per_run_jurisdiction
          rationale: "ERR_DUPLICATE_DEPOSIT is asserted there."

      - name: v_aggregate_deposit_cap_returns_exceeds_liability
        claim_type: aggregate_validation
        grounds: ["validations[priority=14]", errors.ERR_DEPOSIT_EXCEEDS_LIABILITY]
        distinguishing_aspect: "Each deposit is individually valid (200000 <= 300000 run tax), but the SECOND deposit of 200000 pushes the cumulative total to 400000 > 300000: 422 ERR_DEPOSIT_EXCEEDS_LIABILITY — aggregate validation, not per-row."
        test_recipe:
          setup: ["Clock at default. FED-941 and CA-DE9 jurisdictions. Client ACTIVE with verified registrations for BOTH; run (tax 300000) SETTLED; deposit D1 of 200000 SCHEDULED against FED-941."]
