# =============================================================================
# PRD Benchmark Seed Tables — §1.0–§1.7
# Task: task_3246_organized_play_sanctioning_set_release_cadence_print
# Domain: Organized Play sanctioning, set release cadence & print policy (WotC)
# =============================================================================

scenario: |
  Organized Play Sanctioning, Set Release Cadence & Print Policy (Wizards of the
  Coast): store-level organized play program enrollment with event sanctioning,
  prize support allocation and reporting requirements, competitive tier structure
  from local events to qualifying and championship levels with invitation
  tracking, set release cadence with prerelease weekends, street dates and
  distributor allocation, card legality by format with rotation schedules and
  banned or restricted list updates, reprint policy balancing accessibility with
  secondary market expectations, judge certification, event rules enforcement
  levels and penalty guidelines, digital and physical product interaction with
  code redemption, collector product configurations and print run allocation

domain_name: organized-play-sanctioning
api_prefix: /op

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_deferred_actions
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retail store legal name" }
      - { name: region_code, type: string, source: input, description: "Organized-play region code" }
      - { name: reporting_tier, type: enum, source: system, description: "Reporting obligation tier derived from sanctioned-event volume", constraints: "STANDARD | ENHANCED" }
      - { name: daily_event_capacity, type: integer, source: input, description: "Maximum number of QUALIFIER or CHAMPIONSHIP events this store may crowd onto one UTC calendar day" }
      - { name: event_space_capacity, type: integer, source: input, description: "Maximum number of buffered event occupancies that may cover any single instant in this store's event space" }
      - { name: status, type: enum, source: system, description: "Enrollment lifecycle of the store's organized-play program", constraints: "ACTIVE | SUSPENDED" }
      - { name: tp_balance, type: integer, source: computed, description: "Derived: sum of remaining_tp across all of this store's PrizeAllocations" }
      - { name: reporting_violation_points, type: integer, source: computed, description: "Derived: sum of current_points across all RulesEnforcementCase rows whose event_application_id belongs to an EventApplication owned by this store" }

  - name: SetRelease
    parent: null
    common_fields: true
    fields:
      - { name: set_code, type: string, source: input, description: "Product set code; globally unique" }
      - { name: prerelease_start_date, type: datetime, source: input, description: "First instant of the prerelease weekend" }
      - { name: prerelease_end_date, type: datetime, source: input, description: "Last instant of the prerelease weekend" }
      - { name: street_date, type: datetime, source: input, description: "Instant the set becomes street-legal for sale and constructed play" }
      - { name: status, type: enum, source: system, description: "Set release cadence lifecycle", constraints: "ANNOUNCED | PRERELEASE | RELEASED | RETIRED" }

  - name: Format
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Format name; globally unique" }
      - { name: format_code, type: string, source: input, description: "Format code carried on every sanctioned event under this format; globally unique" }
      - { name: rotation_policy, type: enum, source: input, description: "Rotation policy applied at format rotation", constraints: "FIXED | ROLLING" }
      - { name: current_epoch, type: integer, source: system, description: "Rotation epoch, bumped by each rotation run; starts at 0" }
      - { name: banned_card_refs, type: array, source: system, description: "Card references currently on the format's banned list; starts empty" }
      - { name: restricted_card_refs, type: array, source: system, description: "Card references currently on the format's restricted list; starts empty" }

  - name: EventApplication
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store applying to sanction an event" }
      - { name: set_release_id, type: string, source: input, description: "FK -> SetRelease.id; the set release this event is tied to" }
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the constructed format this event is sanctioned under" }
      - { name: format_code, type: string, source: input, description: "Format code the event is run under; must equal the format_code of the Format named by format_id" }
      - { name: tier, type: enum, source: input, description: "Competitive tier requested by the store", constraints: "LOCAL | QUALIFIER | CHAMPIONSHIP" }
      - { name: scheduled_date, type: datetime, source: input, description: "Instant the event is scheduled to start" }
      - { name: expected_headcount, type: integer, source: input, description: "Store's expected player headcount" }
      - { name: status, type: enum, source: system, description: "Sanctioning approval lifecycle", constraints: "SUBMITTED | APPROVED | DENIED | WITHDRAWN | COMPLETED | REPORTED" }
      - { name: prizing_report_status, type: enum, source: system, description: "Prize reporting dimension, evolves independently of status", constraints: "NOT_DUE | DUE | SUBMITTED" }
      - { name: reporting_due_by, type: datetime, source: system, description: "Deadline by which event results must be reported = cited street_date + 18 days for QUALIFIER and CHAMPIONSHIP, null for LOCAL" }
      - { name: prize_allocation_id, type: string, source: system, description: "ID of the PrizeAllocation created when this application was approved; null until approval" }
      - { name: prize_report_id, type: string, source: system, description: "ID of the PrizeReport filed against this application; null until reporting" }

  - name: PrizeAllocation
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the store the pool belongs to" }
      - { name: event_application_id, type: string, source: input, description: "FK -> EventApplication.id; the application that consumed this pool" }
      - { name: tier, type: enum, source: system, description: "Tier the pool was sized for, copied from the originating application", constraints: "LOCAL | QUALIFIER | CHAMPIONSHIP" }
      - { name: base_tp, type: integer, source: computed, description: "Total tournament points in the pool before draw-down, computed by tier_prize_support_pool" }
      - { name: remaining_tp, type: integer, source: computed, description: "Draw-down-adjusted remaining points = base_tp - total_drawn_tp + total_restored_tp" }
      - { name: total_drawn_tp, type: integer, source: computed, description: "Materialized sum of quantities on PASSED prize distributions plus disbursed physical grants; starts at 0" }
      - { name: total_restored_tp, type: integer, source: computed, description: "Materialized sum of unclaimed_tp on SUBMITTED prize reports plus disbursed physical grants; starts at 0" }
      - { name: status, type: enum, source: system, description: "Allocation lifecycle", constraints: "OPEN | CLOSED | RELEASED" }

  - name: PrizeDistribution
    parent: null
    common_fields: true
    fields:
      - { name: prize_allocation_id, type: string, source: input, description: "FK -> PrizeAllocation.id; the pool this distribution draws on" }
      - { name: recipient_ref, type: string, source: input, description: "Opaque recipient reference (player handle or organizer code)" }
      - { name: quantity, type: integer, source: input, description: "Tournament points drawn by this distribution" }
      - { name: status, type: enum, source: system, description: "Distribution approval lifecycle", constraints: "PROPOSED | PASSED | VOIDED" }

  - name: PrizeReport
    parent: null
    common_fields: true
    fields:
      - { name: event_application_id, type: string, source: input, description: "FK -> EventApplication.id; the application whose results are being reported" }
      - { name: prize_allocation_id, type: string, source: input, description: "FK -> PrizeAllocation.id; the pool being restored against" }
      - { name: unclaimed_tp, type: integer, source: input, description: "Tournament points unclaimed at the event and restored to the pool" }
      - { name: reported_headcount, type: integer, source: input, description: "Actual player headcount at the event" }
      - { name: status, type: enum, source: system, description: "Prize report filing lifecycle", constraints: "FILED | OVERDUE" }

  - name: RulesEnforcementCase
    parent: null
    common_fields: true
    fields:
      - { name: event_application_id, type: string, source: input, description: "FK -> EventApplication.id; the event at which the infraction occurred" }
      - { name: player_ref, type: string, source: input, description: "Opaque player reference for the subject of the investigation" }
      - { name: judge_ref, type: string, source: input, description: "Opaque judge reference for the judge who filed the case" }
      - { name: offense_class, type: enum, source: input, description: "Offense class driving the baseline penalty", constraints: "MINOR | MAJOR | SEVERE" }
      - { name: rules_enforcement_level, type: enum, source: input, description: "Rules Enforcement Level the event was run at", constraints: "REGULAR | COMPETITIVE | PROFESSIONAL" }
      - { name: repeated_offense, type: boolean, source: input, description: "Whether this player_ref already has an enforcement case on this event_application_id", default: false }
      - { name: penalty_points, type: integer, source: computed, description: "Base penalty points before escalation = class_points x level_multiplier" }
      - { name: current_points, type: integer, source: computed, description: "Penalty points after case escalation; the value the store's reporting_violation_points aggregates" }
      - { name: status, type: enum, source: system, description: "Case lifecycle", constraints: "FILED | ESCALATED | CLOSED | REDUCED" }

  - name: CodeRedemption
    parent: null
    common_fields: true
    fields:
      - { name: code_kind, type: enum, source: input, description: "Whether the printed code was redeemed as a digital entitlement or as physical prize support", constraints: "DIGITAL | PHYSICAL" }
      - { name: redemption_code, type: string, source: input, description: "Redemption code printed on the inserted card; globally unique" }
      - { name: event_application_id, type: string, source: input, description: "FK -> EventApplication.id; the sanctioned event the code is redeemed for" }
      - { name: redemption_seq, type: integer, source: system, description: "Global monotonic sequence assigned at redemption time; starts at 1" }
      - { name: status, type: enum, source: system, description: "Redemption lifecycle dimension; independent of code_kind", constraints: "AVAILABLE | REDEEMED | DECLINED" }
      - { name: physical_grant_status, type: enum, source: system, description: "Physical fulfillment dimension, evolves independently of status", constraints: "NOT_APPLICABLE | RESERVED | DISBURSED" }
      - { name: prize_allocation_id, type: string, source: system, description: "ID of the PrizeAllocation that got a compensating draw plus restore when a PHYSICAL redemption disbursed" }

  - name: ProductConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: set_release_id, type: string, source: input, description: "FK -> SetRelease.id; the set release this collector configuration belongs to" }
      - { name: configuration_kind, type: enum, source: input, description: "Collector product shape", constraints: "DRAFT_BOOSTER | COLLECTOR_BOOSTER | BUNDLE" }
      - { name: pack_count, type: integer, source: input, description: "Packs per unit of this configuration" }
      - { name: print_run_units, type: integer, source: input, description: "Total units allotted in this print run" }
      - { name: units_allocated, type: integer, source: system, description: "Sum of fulfilled_qty over AllocationOrders of this configuration with status IN {APPROVED, PARTIALLY_FULFILLED}; starts at 0" }
      - { name: units_available, type: integer, source: computed, description: "Derived: print_run_units - units_allocated" }

  - name: AllocationOrder
    parent: null
    common_fields: true
    fields:
      - { name: distributor_name, type: string, source: input, description: "Name of the distributor placing the order" }
      - { name: product_configuration_id, type: string, source: input, description: "FK -> ProductConfiguration.id; the collector configuration being drawn down" }
      - { name: quantity, type: integer, source: input, description: "Units requested" }
      - { name: submitted_seq, type: integer, source: system, description: "Global monotonic sequence assigned at creation; starts at 1 and is the sole tie-break for allocation ordering" }
      - { name: status, type: enum, source: system, description: "Allocation order lifecycle", constraints: "PENDING | APPROVED | DENIED | PARTIALLY_FULFILLED" }
      - { name: approval_rank, type: integer, source: computed, description: "Rank in the queue for this configuration; computed over candidates where status IN {PENDING, PARTIALLY_FULFILLED} and quantity > units_available, sorted by submitted_seq ASC" }
      - { name: fulfilled_qty, type: integer, source: system, description: "Units actually allocated; starts at 0" }

  - name: JudgeCertification
    parent: null
    common_fields: true
    fields:
      - { name: judge_ref, type: string, source: input, description: "Opaque judge reference; globally unique" }
      - { name: name, type: string, source: input, description: "Judge display name" }
      - { name: level, type: enum, source: input, description: "Judge certification level", constraints: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: status, type: enum, source: system, description: "Certification lifecycle", constraints: "ACTIVE | DECERTIFIED" }
      - { name: practice_events, type: integer, source: system, description: "Count of lower-tier events successfully reported by this judge; starts at 0" }
      - { name: promotion_eligible, type: boolean, source: computed, description: "Derived: true when level is LEVEL_2 and practice_events >= 5; false otherwise" }

  - name: ReprintPlan
    parent: null
    common_fields: true
    fields:
      - { name: card_name, type: string, source: input, description: "Name of the card being considered for reprint" }
      - { name: set_release_id, type: string, source: input, description: "FK -> SetRelease.id; the set release the reprint would ship in" }
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the format whose legality and market context is evaluated" }
      - { name: secondary_market_index, type: integer, source: input, description: "Secondary-market price index in whole currency units" }
      - { name: first_print_index, type: integer, source: input, description: "First-print price index for the same card, in whole currency units" }
      - { name: verdict, type: enum, source: computed, description: "Reprint-policy verdict computed by the reprint policy calculation", constraints: "REPRINT_ALLOWED | REPRINT_DENIED" }
      - { name: status, type: enum, source: system, description: "Reprint plan lifecycle", constraints: "DRAFT | APPROVED | REJECTED | PUBLISHED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: SetRelease
    field: status
    initial_state: ANNOUNCED
    terminal_states: [RETIRED]
    transitions:
      - from: ANNOUNCED
        to: PRERELEASE
        trigger: "system event: logical clock reaches prerelease_start_date"
        actor: system
        preconditions:
          - "logical clock current_utc >= prerelease_start_date"
          - "logical clock current_utc < prerelease_end_date"
        side_effects:
          - "No other entity is mutated; the release window merely opens"

      - from: PRERELEASE
        to: RELEASED
        trigger: "system event: logical clock reaches street_date"
        actor: system
        preconditions:
          - "logical clock current_utc >= street_date"
        side_effects:
          - "Every ACTIVE Format gains an epoch entry for this set release, moving the set release to LEGAL in all of them"
          - "Every EventApplication whose set_release_id is this release gains status transition eligibility for APPROVE"
          - "Every EventApplication with status APPROVED and tier in {QUALIFIER, CHAMPIONSHIP} gets reporting_due_by = street_date + 18 days"
          - "Every EventApplication with status APPROVED and prizing_report_status NOT_DUE gets prizing_report_status = DUE"
        settlement_invariant: "Street-date settlement performs no draw-down on any PrizeAllocation; total_drawn_tp stays 0 and every allocation created before the street date still satisfies remaining_tp == base_tp after settlement."

      - from: RELEASED
        to: RETIRED
        trigger: "POST /op/set-releases/{id}/transition (action=RETIRE)"
        actor: ops
        preconditions:
          - "status == RELEASED"
        side_effects:
          - "Any EventApplication on this set release with status in {SUBMITTED, APPROVED} gets status = COMPLETED"
          - "Any EventApplication on this set release with prizing_report_status in {DUE, NOT_DUE} gets prizing_report_status = SUBMITTED and gains a synthesized PrizeReport with unclaimed_tp = 0 and reported_headcount = 0"
        settlement_invariant: "Retirement synthesizes restores only, never draws; total_drawn_tp is unchanged and total_restored_tp increases by the sum of the synthesized reports' unclaimed_tp."

  - entity: Format
    field: current_epoch
    initial_state: EPOCH_0
    terminal_states: []
    transitions:
      - from: EPOCH_0
        to: EPOCH_1
        trigger: "POST /op/formats/{id}/transition (action=ROTATE)"
        actor: ops
        preconditions:
          - "logical clock current_utc >= 2026-10-15T00:00:00Z"
          - "at least one SetRelease has reached RELEASED, so the format has a card pool to rotate"
        side_effects:
          - "current_epoch increments from 0 to 1"
          - "Any ReprintPlan whose format_id is this format and status == APPROVED gets status = REJECTED"
        note: "EPOCH_N is the state name for current_epoch == N; the machine admits an unbounded ladder of epoch states, which makes it cyclic in the sense of an unbounded counter rather than a fixed pipeline."

      - from: EPOCH_N
        to: EPOCH_N_PLUS_1
        trigger: "POST /op/formats/{id}/transition (action=ROTATE)"
        actor: ops
        preconditions:
          - "logical clock current_utc >= 2026-10-15T00:00:00Z"
          - "current_epoch >= 1"
        side_effects:
          - "current_epoch increments by 1"
          - "Any ReprintPlan whose format_id is this format and status == APPROVED gets status = REJECTED"

      - from: EPOCH_N
        to: EPOCH_N
        trigger: "POST /op/formats/{id}/transition (action=BAN_CARD)"
        actor: ops
        preconditions: []
        side_effects:
          - "card_ref appended to banned_card_refs or restricted_card_refs for the current epoch"
          - "Any EventApplication citing this format with status == APPROVED gets status = DENIED"
          - "The reverse-reachability read on those applications surfaces them for re-submission after the store clears the banned card reference"
        note: "Self-loop: a ban-list update does not advance the rotation epoch."

  - entity: Store
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /op/stores/{id}/transition (action=SUSPEND)"
        actor: ops
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Every EventApplication belonging to this store with status IN {SUBMITTED, APPROVED, COMPLETED} gets status = DENIED, and its prizing_report_status is frozen at its current value"
          - "Every PrizeAllocation belonging to this store with status == OPEN gets status = RELEASED"
          - "Every PrizeDistribution with status == PASSED under those allocations gets status = VOIDED; the compensating restore is authoritative and total_restored_tp is re-derived as the sum over all VOIDED distributions plus all SUBMITTED reports, rather than incremented, so ALLOC_INVARIANT = base_tp - total_drawn_tp + total_restored_tp returns to its pre-draw figure for every affected allocation"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /op/stores/{id}/transition (action=REINSTATE)"
        actor: ops
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "No allocation or application is re-opened; reinstatement is not an undo"

  - entity: EventApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, REPORTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /op/event-applications/{id}/transition (action=APPROVE)"
        actor: ops
        preconditions:
          - "Store.status == ACTIVE"
          - "prizing_report_status == NOT_DUE"
          - "The cited set release's status is RELEASED"
          - "The store holds strictly fewer than Store.daily_event_capacity EventApplications with status IN {SUBMITTED, APPROVED} and tier IN {QUALIFIER, CHAMPIONSHIP} on this application's UTC calendar day (ERR_TIER_SLOT_CONFLICT)"
          - "No other EventApplication of this store with status IN {SUBMITTED, APPROVED} has the half-open window [scheduled_date, scheduled_date + 6 hours] overlapping this application's own half-open window (ERR_EVENT_WINDOW_OVERLAP)"
          - "No instant is covered by more than Store.event_space_capacity padded windows [scheduled_date - 30 minutes, scheduled_date + 6 hours + 30 minutes] drawn from this store's non-terminal applications (ERR_EVENT_SPACE_CAPACITY)"
          - "CHAMPIONSHIP additionally requires an unredeemed DIGITAL CodeRedemption whose status == AVAILABLE and whose event_application_id names this application (ERR_INVITATION_REQUIRED)"
        side_effects:
          - "Creates a PrizeAllocation (status OPEN); tier is copied from this application, total_drawn_tp and total_restored_tp start at 0, and base_tp is the output of tier_prize_support_pool"
          - "prize_allocation_id is set on this application"
          - "If tier is LOCAL: reporting_due_by stays null"
          - "If tier is QUALIFIER or CHAMPIONSHIP: reporting_due_by = cited set release's street_date + 18 days"
          - "EventApplication.version increments by 1"
          - "Store.version increments by 1"
        note: "APPROVE does not flip prizing_report_status — that dimension is driven only by the set release reaching RELEASED and by OPTION_OUT."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /op/event-applications/{id}/transition (action=DENY)"
        actor: ops
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "No PrizeAllocation is created"

      - from: APPROVED
        to: DENIED
        trigger: "POST /op/formats/{id}/transition (action=BAN_CARD)"
        actor: system
        preconditions:
          - "The banned card reference belongs to the format cited by this application"
        side_effects:
          - "The application's PrizeAllocation is CLOSED if still OPEN"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /op/event-applications/{id}/transition (action=WITHDRAW)"
        actor: ops
        preconditions:
          - "status == SUBMITTED"
        side_effects: []

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /op/event-applications/{id}/transition (action=COMPLETE)"
        actor: ops
        preconditions:
          - "status == APPROVED"
          - "logical clock current_utc >= street_date + 7 days"
        side_effects:
          - "No other entity is mutated; completion only unlocks prize reporting"

      - from: COMPLETED
        to: REPORTED
        trigger: "POST /op/event-applications/{id}/prize-reports"
        actor: ops
        preconditions:
          - "status == COMPLETED"
          - "prizing_report_status == DUE"
          - "the body's prize_allocation_id equals this application's prize_allocation_id"
          - "logical clock current_utc <= reporting_due_by"
        side_effects:
          - "Creates a PrizeReport (status FILED)"
          - "The new PrizeReport's unclaimed_tp is added to the parent allocation's total_restored_tp, which shifts ALLOC_INVARIANT = base_tp - total_drawn_tp + total_restored_tp upward by exactly unclaimed_tp"
          - "prize_report_id is set on this application"
          - "prizing_report_status = SUBMITTED"
          - "Store.reporting_tier is re-derived by store_reporting_tier"
          - "Filing a second report for the same application is rejected with ERR_PRIZE_REPORT_ALREADY_FILED"

      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /op/_clock/set_current_utc with current_utc > reporting_due_by"
        actor: system
        preconditions:
          - "prizing_report_status IN {NOT_DUE, DUE}"
          - "reporting_due_by is non-null and < the newly set clock"
        side_effects:
          - "prizing_report_status is left unchanged, but any PrizeReport on this application with status == FILED gets status = OVERDUE"
        note: "Past-due reporting is surfaced on the report row itself so the reporting obligation stays observable without mutating the application's own dimension."

  - entity: EventApplication
    field: prizing_report_status
    initial_state: NOT_DUE
    terminal_states: [SUBMITTED]
    transitions:
      - from: NOT_DUE
        to: DUE
        trigger: "OPTION_IN via POST /op/event-applications/{id}/transition (action=OPTION_IN), or the system event in which the cited SetRelease reaches RELEASED"
        actor: ops
        preconditions:
          - "status IN {SUBMITTED, APPROVED, COMPLETED}"
        side_effects:
          - "No allocation mutation; the reporting window is now open"
        note: "A store may opt in to the reporting window while the application is still SUBMITTED, which is what makes the ERR_REPORTING_WINDOW_OPEN approval guard observable."

      - from: DUE
        to: NOT_DUE
        trigger: "POST /op/event-applications/{id}/transition (action=OPTION_OUT)"
        actor: ops
        preconditions:
          - "status IN {SUBMITTED, APPROVED, COMPLETED}"
        side_effects:
          - "No allocation mutation; the store opts out of the reporting window"

      - from: DUE
        to: SUBMITTED
        trigger: "POST /op/event-applications/{id}/prize-reports"
        actor: ops
        preconditions:
          - "status == COMPLETED"
          - "logical clock current_utc <= reporting_due_by"
        side_effects:
          - "Creates the PrizeReport and restores unclaimed_tp to the pool"
        note: "This is the same transition row as EventApplication.status COMPLETED -> REPORTED; the pair (status, prizing_report_status) is the parallel dimension."

      - from: NOT_DUE
        to: SUBMITTED
        trigger: "POST /op/formats/{id}/transition (action=ROTATE) (rotation reaching this application's set release)"
        actor: system
        preconditions:
          - "status == COMPLETED"
          - "prizing_report_status == NOT_DUE"
        side_effects:
          - "A PrizeReport is synthesized with unclaimed_tp = 0 and reported_headcount = 0"
          - "prizing_report_status = SUBMITTED and status = REPORTED"
          - "Store.reporting_tier is re-derived by store_reporting_tier"
        note: "This is the only path from NOT_DUE straight to SUBMITTED; it exists so rotation cannot leave a completed event permanently unreported."

  - entity: PrizeAllocation
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED, RELEASED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /op/formats/{id}/transition (action=BAN_CARD) denying the parent application, or POST /op/set-releases/{id}/transition (action=RETIRE) on the cited release"
        actor: system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "Every PrizeDistribution under this allocation with status == PASSED gets status = VOIDED, and total_restored_tp is re-derived so that ALLOC_INVARIANT returns to its pre-close figure"

      - from: CLOSED
        to: OPEN
        trigger: "POST /op/prize-allocations/{id}/transition (action=REOPEN)"
        actor: ops
        preconditions:
          - "status == CLOSED"
          - "The cited set release's status is RETIRED"
          - "The parent application's prizing_report_status IN {DUE, SUBMITTED}"
        side_effects:
          - "remaining_tp is re-derived from the restored quantities and the reporting window is re-opened; the re-derivation may raise remaining_tp above every previously observed value but ALLOC_INVARIANT is unchanged because this transition draws and restores nothing"
        note: "This is the one re-open cycle available on PrizeAllocation; it exists so that a late-arriving unclaimed-prize report can be reconciled."

      - from: OPEN
        to: RELEASED
        trigger: "POST /op/stores/{id}/transition (action=SUSPEND)"
        actor: system
        preconditions:
          - "The owning Store moved ACTIVE -> SUSPENDED"
        side_effects:
          - "Every PrizeDistribution under this allocation with status == PASSED gets status = VOIDED and total_restored_tp is re-derived so that ALLOC_INVARIANT over that allocation returns to exactly 0 unless a physical grant was previously disbursed"

  - entity: PrizeDistribution
    field: status
    initial_state: PROPOSED
    terminal_states: [VOIDED]
    transitions:
      - from: PROPOSED
        to: PASSED
        trigger: "POST /op/prize-distributions/{id}/transition (action=PASS)"
        actor: ops
        preconditions:
          - "parent PrizeAllocation.status == OPEN"
          - "quantity <= parent PrizeAllocation.remaining_tp"
        side_effects:
          - "parent PrizeAllocation.total_drawn_tp += quantity"
          - "parent PrizeAllocation.remaining_tp is re-derived by prize_pool_remaining"

      - from: PASSED
        to: VOIDED
        trigger: "POST /op/prize-distributions/{id}/transition (action=VOID)"
        actor: ops
        preconditions:
          - "logical clock current_utc < 2026-10-15T00:00:00Z (distributions lock at the reprint policy review date)"
          - "this distribution has not already been offset once (ERR_INVALID_STATE)"
        side_effects:
          - "parent PrizeAllocation.total_restored_tp += quantity"
          - "parent PrizeAllocation.remaining_tp is re-derived by prize_pool_remaining"
        note: "A VOID of an already-offset distribution is rejected; the offset direction is void -> restore, and its exact inverse is the ordering in which the distribution is PASSed again rather than voided twice."

      - from: VOIDED
        to: VOIDED
        trigger: "POST /op/prize-distributions/{id}/transition (action=VOID) repeated"
        actor: ops
        preconditions:
          - "status == VOIDED"
        side_effects: []
        note: "Idempotency guard: a second VOID on an already-voided distribution is rejected with ERR_INVALID_STATE because the first VOID already performed its compensating restore."

  - entity: CodeRedemption
    field: status
    initial_state: AVAILABLE
    terminal_states: [REDEEMED, DECLINED]
    transitions:
      - from: AVAILABLE
        to: REDEEMED
        trigger: "POST /op/event-applications/{id}/code-redemption (action=REDEEM)"
        actor: ops
        preconditions:
          - "status == AVAILABLE and code_kind IN {DIGITAL, PHYSICAL}"
          - "the cited EventApplication's status IN {SUBMITTED, APPROVED}"
        side_effects:
          - "redemption_seq assigned from the global monotonic sequence"
          - "If code_kind == PHYSICAL: physical_grant_status = RESERVED (separate parallel dimension)"
          - "A DIGITAL redemption is what satisfies the CHAMPIONSHIP invitation precondition for a later APPROVE"

      - from: AVAILABLE
        to: DECLINED
        trigger: "POST /op/event-applications/{id}/code-redemption (action=DECLINE)"
        actor: ops
        preconditions:
          - "status == AVAILABLE and code_kind == PHYSICAL"
        side_effects:
          - "physical_grant_status = NOT_APPLICABLE; no draw-down on any allocation"
          - "A DECLINED row no longer satisfies the CHAMPIONSHIP invitation precondition"

  - entity: CodeRedemption
    field: physical_grant_status
    initial_state: NOT_APPLICABLE
    terminal_states: [DISBURSED]
    transitions:
      - from: NOT_APPLICABLE
        to: RESERVED
        trigger: "POST /op/event-applications/{id}/code-redemption with code_kind == PHYSICAL"
        actor: ops
        preconditions:
          - "status == AVAILABLE"
        side_effects: []

      - from: RESERVED
        to: DISBURSED
        trigger: "POST /op/code-redemptions/{id}/transition (action=DISBURSE)"
        actor: ops
        preconditions:
          - "status == REDEEMED"
          - "the cited event_application_id is COMPLETED"
        side_effects:
          - "The cited application's PrizeAllocation is recorded into this redemption's prize_allocation_id"
          - "That allocation's total_drawn_tp += floor(PACK_COUNT_BY_TIER[tier] * PACK_VALUE_NUM / PACK_VALUE_DEN), floored once for this redemption"
          - "That allocation's total_restored_tp += the identical floored amount"
          - "remaining_tp is re-derived by prize_pool_remaining"
        note: "The draw and the restore are one transaction; the named conserved quantity ALLOC_INVARIANT = (base_tp - total_drawn_tp + total_restored_tp) is bit-for-bit identical before and after this transition."

  - entity: AllocationOrder
    field: status
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /op/allocation-orders/{id}/transition (action=APPROVE)"
        actor: ops
        preconditions:
          - "quantity <= parent ProductConfiguration.units_available"
        side_effects:
          - "fulfilled_qty = quantity"
          - "parent ProductConfiguration.units_allocated += quantity"

      - from: PENDING
        to: PARTIALLY_FULFILLED
        trigger: "POST /op/allocation-orders/{id}/transition (action=FULFILL_PARTIAL)"
        actor: ops
        preconditions:
          - "quantity > parent ProductConfiguration.units_available"
          - "parent ProductConfiguration.units_available > 0"
        side_effects:
          - "fulfilled_qty = parent ProductConfiguration.units_available at the moment of the call"
          - "parent ProductConfiguration.units_allocated += fulfilled_qty"

      - from: PENDING
        to: DENIED
        trigger: "POST /op/allocation-orders/{id}/transition (action=DENY)"
        actor: ops
        preconditions:
          - "parent ProductConfiguration.units_available == 0"
        side_effects: []

      - from: PARTIALLY_FULFILLED
        to: APPROVED
        trigger: "POST /op/product-configurations/{id}/transition (action=INCREASE_REPRINT_RUN)"
        actor: system
        preconditions:
          - "parent ProductConfiguration.units_available >= (quantity - fulfilled_qty)"
        side_effects:
          - "fulfilled_qty = quantity"
          - "parent ProductConfiguration.units_allocated += (quantity - prior fulfilled_qty)"

  - entity: ReprintPlan
    field: status
    initial_state: DRAFT
    terminal_states: [REJECTED, PUBLISHED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /op/reprint-plans/{id}/transition (action=APPROVE)"
        actor: ops
        preconditions:
          - "verdict == REPRINT_ALLOWED"
        side_effects: []

      - from: APPROVED
        to: REJECTED
        trigger: "system event: the cited Format rotates"
        actor: system
        preconditions:
          - "format_id names a format whose current_epoch is bumped by POST /op/formats/{id}/transition (action=ROTATE)"
          - "logical clock current_utc >= 2026-10-15T00:00:00Z"
        side_effects:
          - "The approval in place is voided in place because the format's market context has moved past the review point; no forward transition is permitted"

      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /op/reprint-plans/{id}/transition (action=PUBLISH)"
        actor: ops
        preconditions:
          - "logical clock current_utc < 2026-12-01T00:00:00Z"
        side_effects: []

  - entity: JudgeCertification
    field: status
    initial_state: ACTIVE
    terminal_states: [DECERTIFIED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /op/judges/{ref}/transition (action=RECORD_PRACTICE_EVENT)"
        actor: system
        preconditions:
          - "level == LEVEL_2"
          - "the reported EventApplication's tier == LOCAL and status == REPORTED"
        side_effects:
          - "practice_events += 1; the certification status does not move"
        note: "Self-loop on the status axis: recording a practice event advances the counter only, so JudgeCertification.status is untouched."

      - from: ACTIVE
        to: DECERTIFIED
        trigger: "POST /op/judges/{ref}/transition (action=DECERTIFY)"
        actor: ops
        preconditions:
          - "the judge is the subject of an ESCALATED RulesEnforcementCase"
        side_effects:
          - "status = DECERTIFIED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: prize-allocation-path-draw-stale-store
    parent_entity: Store
    write_endpoint: "POST /op/event-applications/{id}/transition"
    occ_field: "expected_store_version"
    description: |
      Approving an event application against a Store whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the store was suspended (which legitimately releases its open prize
      allocations under §1.2), so the client's view of the store's organized-play
      posture is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-order-partial-fulfil-stale-config
    parent_entity: ProductConfiguration
    write_endpoint: "POST /op/allocation-orders/{id}/transition"
    occ_field: "expected_product_configuration_version"
    description: |
      Fulfilling an allocation order against a ProductConfiguration whose
      version has advanced since the client last observed it is rejected. This
      captures the case where a prior allocation order legitimately drew down the
      print run under §1.2, so the client's view of units_available is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: tier_prize_support_pool
    trigger: "EventApplication transitions SUBMITTED -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      base_tp = TIER_BASE_TP[tier]
      member_count = count of CodeRedemption rows where
                       event_application_id == application.id
                       AND status == REDEEMED
                       AND code_kind == DIGITAL
      Bundled: if member_count >= POD_BUNDLE_MINIMUM:
                   pool = base_tp + POD_BUNDLE_TP[tier] * (member_count - POD_BUNDLE_MINIMUM)
               else:
                   pool = base_tp
      Unbundled (chosen by the store at approval):
                   pool = base_tp + POD_TP_PER_MEMBER * member_count
      Every addition is computed at integer precision and summed BEFORE any
      rounding; no intermediate rounding is performed.
    input_set: "Counted rows satisfy status == REDEEMED AND code_kind == DIGITAL AND event_application_id == application.id. Excluded: rows with status IN {AVAILABLE, DECLINED} and every row with code_kind == PHYSICAL. member_count is recomputed from scratch at each approval; a later redemption after approval does not enlarge an already-created pool."
    constants:
      TIER_BASE_TP: { LOCAL: 16, QUALIFIER: 48, CHAMPIONSHIP: 96 }
      POD_BUNDLE_MINIMUM: 4
      POD_BUNDLE_TP: { LOCAL: 3, QUALIFIER: 6, CHAMPIONSHIP: 12 }
      POD_TP_PER_MEMBER: 4
    precision: "integer; no rounding"
    variants:
      - name: bundled_digital_pod
        when: "The store approves with pool_mode=BUNDLED"
        difference: "Adds POD_BUNDLE_TP per member beyond the fourth; members 1-4 are absorbed by the base tier pool."
      - name: unbundled_digital_pod
        when: "The store approves with pool_mode=UNBUNDLED"
        difference: "Adds POD_TP_PER_MEMBER for every redeemed digital code including the first four; identical inputs yield a strictly larger pool whenever member_count > 0."

  - name: prize_pool_remaining
    trigger: "Any PrizeDistribution PASS or VOID, any PrizeReport filing, any code disbursement, any store suspension"
    algorithm: aggregation
    formula: |
      base_tp = PrizeAllocation.base_tp
      total_drawn_tp = sum of quantity over PrizeDistribution rows where
                         prize_allocation_id == allocation.id
                         AND status == PASSED
      total_restored_tp = sum of quantity over PrizeDistribution rows where
                         prize_allocation_id == allocation.id
                         AND status == VOIDED
                        + sum of unclaimed_tp over PrizeReport rows where
                         prize_allocation_id == allocation.id
                         AND status IN {FILED, OVERDUE}
                        + sum of floor(PACK_COUNT_BY_TIER[allocation.tier] * PACK_VALUE_NUM
                                       / PACK_VALUE_DEN) over
                          CodeRedemption rows where
                         prize_allocation_id == allocation.id
                         AND status == REDEEMED
                         AND physical_grant_status == DISBURSED
      remaining_tp = base_tp - total_drawn_tp + total_restored_tp
    input_set: "Only PASSED distributions (status == PASSED), VOIDED distributions (status == VOIDED), filed reports (status IN {FILED, OVERDUE}), and DISBURSED physical redemptions (status == REDEEMED AND physical_grant_status == DISBURSED) enter the aggregation. PROPOSED distributions, AVAILABLE redemptions and DECLINED redemptions are excluded. Source rows are the materialized counters: total_drawn_tp is the sum over PASSED distributions plus disbursed grants, total_restored_tp is the sum over VOIDED distributions plus SUBMITTED reports plus disbursed grants."
    constants:
      PACK_COUNT_BY_TIER: { LOCAL: 6, QUALIFIER: 12, CHAMPIONSHIP: 24 }
      PACK_VALUE_NUM: 27
      PACK_VALUE_DEN: 4
    precision: "integer; the per-redemption grant is floored ONCE per disbursed redemption and only then summed into total_drawn_tp and total_restored_tp, so the nested-rounding order is floor-then-sum and never sum-then-floor; remaining_tp is computed once from the two integer sums and is never itself rounded"
    variants:
      - name: void_then_restore_ordering
        when: "A PASSED distribution is voided and the store then passes it again"
        difference: "VOID first raises total_restored_tp by quantity; the later PASS raises total_drawn_tp by the same quantity, so remaining_tp returns to its pre-void value and exactly matches the pre-void figure."
      - name: restore_then_void_ordering
        when: "A prize report is filed before the distribution it offsets is voided"
        difference: "The report's unclaimed_tp enters total_restored_tp first; when the distribution is voided afterwards the report's restore still stands, so remaining_tp ends exactly quantity higher than under the void-first ordering for identical inputs."

  - name: reporting_due_deadline
    trigger: "EventApplication transitions SUBMITTED -> APPROVED; recomputed when the cited SetRelease reaches RELEASED"
    algorithm: threshold
    formula: |
      if tier == LOCAL:
          reporting_due_by = null
      else:
          reporting_due_by = cited_set_release.street_date + REPORTING_WINDOW_DAYS
    input_set: "The cited set release's street_date; LOCAL tier is excluded entirely and carries a null deadline."
    constants:
      REPORTING_WINDOW_DAYS: 18
      EVENT_COMPLETION_DAYS_AFTER_STREET: 7
    precision: "second precision, UTC; no rounding"
    variants: []

  - name: qualified_headcount_gate
    trigger: "GET /op/event-applications/{id}/prizing-summary"
    algorithm: threshold
    formula: |
      qualified = (reported_headcount >= QUALIFIED_THRESHOLD)
      if tier == LOCAL:
          gate_error = null
      elif qualified:
          gate_error = null
      else:
          gate_error = ERR_HEADCOUNT_BELOW_THRESHOLD
      Boundary: the comparison is >=, so a headcount exactly equal to
      QUALIFIED_THRESHOLD qualifies. A reported_headcount of 0 is treated as a
      filed report with no attendees and still fails the gate for non-LOCAL
      tiers.
    input_set: "The latest SUBMITTED PrizeReport's reported_headcount for this application; applications with no SUBMITTED report are excluded from the gate and surface report_status NOT_FILED."
    constants:
      QUALIFIED_THRESHOLD: 24
    precision: "integer comparison; no rounding"
    variants: []

  - name: reprint_policy_verdict
    trigger: "POST /op/reprint-plans"
    algorithm: weighted_scoring
    formula: |
      wow_index = secondary_market_index + floor(WOW_ADDENDUM_NUMERATOR * secondary_market_index / WOW_ADDENDUM_DENOMINATOR)
      if wow_index > REPRINT_CEILING_INDEX:
          verdict = REPRINT_DENIED
      else:
          verdict = REPRINT_ALLOWED
      The addendum is computed first and floored once; the ceiling comparison
      never re-rounds.
    input_set: "secondary_market_index as supplied; first_print_index is recorded for the market-context audit but does not enter the verdict."
    constants:
      WOW_ADDENDUM_NUMERATOR: 64
      WOW_ADDENDUM_DENOMINATOR: 137
      REPRINT_CEILING_INDEX: 42
    precision: "integer; floor applied once to the addendum before the comparison"
    variants:
      - name: reprint_policy_secondary_only
        when: "The verdict is evaluated on the raw secondary-market index alone, with the market-context addendum suppressed for the accessibility audit"
        difference: "Reports REPRINT_ALLOWED whenever secondary_market_index <= 42, so an index of exactly 42 clears the ceiling."
      - name: reprint_policy_with_addendum
        when: "The verdict is evaluated with the market-context addendum in force; this is the default path taken by POST /op/reprint-plans"
        difference: "The addendum shifts every index upward by floor(64*idx/137), so a secondary_market_index of exactly 42 yields wow_index 42 + 19 = 61 and REPRINT_DENIED, while the suppressed variant yields REPRINT_ALLOWED for the identical input."

  - name: store_reporting_tier
    trigger: "EventApplication transitions COMPLETED -> REPORTED"
    algorithm: threshold
    formula: |
      reported_count = count of EventApplication rows where
                         store_id == store.id
                         AND status == REPORTED
      if reported_count >= ENHANCED_REPORTING_THRESHOLD:
          reporting_tier = ENHANCED
      else:
          reporting_tier = STANDARD
      Boundary: the comparison is >=, so a store reporting its fifth event moves to
      ENHANCED on that same report and never before it.
    input_set: "Counted rows satisfy status == REPORTED and store_id == store.id. Applications in SUBMITTED, APPROVED, DENIED, WITHDRAWN or COMPLETED are excluded, so a store cannot reach ENHANCED by filing events it has not yet closed out."
    constants:
      ENHANCED_REPORTING_THRESHOLD: 5
    precision: "integer count; no rounding"
    variants: []

  - name: enforcement_penalty_points
    trigger: "POST /op/enforcement-cases and POST /op/enforcement-cases/{id}/transition (action=ESCALATE)"
    algorithm: weighted_scoring
    formula: |
      penalty_points = CLASS_POINTS[offense_class] * LEVEL_MULTIPLIER[rules_enforcement_level]
      (integer multiply; no rounding, computed once when the case is filed)
      Evaluation order is pinned by the action that triggered the run:
        at filing        -> current_points = penalty_points
        escalate         -> if repeated_offense:
                                current_points = penalty_points * REPEAT_MULTIPLIER
                            else:
                                current_points = penalty_points + ESCALATION_INCREMENT
        close            -> current_points = penalty_points
        reduce           -> current_points = floor(penalty_points / 2)
      penalty_points is never recomputed by a later action; only current_points moves.
    input_set: "Case's own offense_class, rules_enforcement_level and repeated_offense; closed and reduced cases still contribute their current_points to the owning store's reporting_violation_points."
    constants:
      CLASS_POINTS: { MINOR: 2, MAJOR: 5, SEVERE: 11 }
      LEVEL_MULTIPLIER: { REGULAR: 1, COMPETITIVE: 2, PROFESSIONAL: 3 }
      REPEAT_MULTIPLIER: 3
      ESCALATION_INCREMENT: 4
    precision: "integer; floor applied on reduce before summing into the store total"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a role declared in §1.7; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The named role is permitted on this operation per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request shape: every required body field for the invoked endpoint is present, no undeclared body field is supplied, and each supplied value conforms to its declared type and enum domain"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Referenced resources exist, validated left-to-right in path order: path resources first, then body foreign keys (store_id, set_release_id, format_id, event_application_id, prize_allocation_id, product_configuration_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "The redemption_code supplied to POST /op/event-applications/{id}/code-redemption matches exactly one CodeRedemption row"
    error_id: ERR_INVALID_REDEMPTION_CODE
    http_status: 404
    applies_to: "POST /op/event-applications/{id}/code-redemption"

  - priority: 6
    category: state
    check: "The target resource is in the state its §1.2 transition requires (EventApplication.status, EventApplication.prizing_report_status, PrizeAllocation.status, PrizeDistribution.status, Store.status, SetRelease.status, ReprintPlan.status, CodeRedemption.status, AllocationOrder.status, Format.current_epoch)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "The cited EventApplication has prizing_report_status == NOT_DUE at approval time"
    error_id: ERR_REPORTING_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /op/event-applications/{id}/transition (action=APPROVE)"

  - priority: 8
    category: state
    check: "The cited SetRelease.status == RELEASED for approval; prerelease-only events are rejected"
    error_id: ERR_SET_NOT_STREET_LEGAL
    http_status: 409
    applies_to: "POST /op/event-applications/{id}/transition (action=APPROVE)"

  - priority: 9
    category: business_constraint
    check: "CHAMPIONSHIP tier requires an invitation in hand: a DIGITAL CodeRedemption whose status == AVAILABLE and whose event_application_id names this application"
    error_id: ERR_INVITATION_REQUIRED
    http_status: 422
    applies_to: "POST /op/event-applications/{id}/transition (action=APPROVE)"

  - priority: 10
    category: business_temporal
    check: "Daily tier-slot capacity: the store must hold strictly fewer than Store.daily_event_capacity EventApplications with status IN {SUBMITTED, APPROVED} whose tier IN {QUALIFIER, CHAMPIONSHIP} and whose scheduled_date's UTC calendar day equals this application's UTC calendar day"
    error_id: ERR_TIER_SLOT_CONFLICT
    http_status: 422
    applies_to: "POST /op/event-applications/{id}/transition (action=APPROVE)"
    note: "Point occupancy: any two events sharing a calendar day collide once the capacity is reached, so exact equality of day is a conflict."

  - priority: 11
    category: business_temporal
    check: "Aggregate event-space capacity with buffer: at no instant may more than Store.event_space_capacity padded occupancy intervals [scheduled_date - 30 minutes, scheduled_date + 6 hours + 30 minutes] from this store's non-terminal applications cover the same instant"
    error_id: ERR_EVENT_SPACE_CAPACITY
    http_status: 422
    applies_to: "POST /op/event-applications/{id}/transition (action=APPROVE)"
    note: "Buffered aggregate count: adjacency that would be legal for the unbuffered pairwise rule becomes a conflict here because both padded intervals cover the shared instant."

  - priority: 12
    category: business_temporal
    check: "Pairwise occupancy overlap: this store must not hold another non-terminal EventApplication whose half-open occupancy window [scheduled_date, scheduled_date + 6 hours] overlaps this application's own occupancy window"
    error_id: ERR_EVENT_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /op/event-applications/{id}/transition (action=APPROVE)"
    note: "Half-open arithmetic: a prior event ending exactly at this event's scheduled_date does NOT overlap. Boundary equality is legal for this rule and illegal for the ban-list rule."

  - priority: 13
    category: business_constraint
    check: "format_code must equal the format_code of the Format named by format_id, and that Format must not have rotated past the epoch in which the cited set release was legalized"
    error_id: ERR_FORMAT_CODE_NOT_LEGAL
    http_status: 422
    applies_to: ["POST /op/event-applications", "POST /op/event-applications/{id}/transition (action=APPROVE)"]

  - priority: 14
    category: business_fiscal
    check: "The pool draw does not exceed the allocation: PrizeDistribution.quantity <= parent PrizeAllocation.remaining_tp"
    error_id: ERR_INSUFFICIENT_POOL
    http_status: 402
    applies_to: "POST /op/prize-distributions/{id}/transition (action=PASS)"
    note: "Inclusive boundary: quantity exactly equal to remaining_tp is legal and leaves remaining_tp == 0."

  - priority: 15
    category: business_fiscal
    check: "The print run draw does not exceed remaining units when the caller requests action=APPROVE: AllocationOrder.quantity <= parent ProductConfiguration.units_available"
    error_id: ERR_PRINT_RUN_EXHAUSTED
    http_status: 402
    applies_to: "POST /op/allocation-orders/{id}/transition (action=APPROVE)"

  - priority: 16
    category: business_fiscal
    check: "The reprint plan's verdict is REPRINT_ALLOWED before approval"
    error_id: ERR_REPRINT_MARKET_FLOOR
    http_status: 422
    applies_to: "POST /op/reprint-plans/{id}/transition (action=APPROVE)"

  - priority: 17
    category: business_temporal
    check: "Completed events must be reported inside the window: logical clock current_utc <= reporting_due_by when reporting_due_by is non-null"
    error_id: ERR_REPORT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /op/event-applications/{id}/prize-reports"

  - priority: 18
    category: business_temporal
    check: "The street date must fall at or after the prerelease weekend: street_date >= prerelease_end_date"
    error_id: ERR_STREET_DATE_BEFORE_PRERELEASE
    http_status: 422
    applies_to: "POST /op/set-releases"

  - priority: 19
    category: business_constraint
    check: "Optimistic concurrency: the expected parent version supplied by the client equals the parent's current version (Store.version for EventApplication approval, ProductConfiguration.version for allocation fulfilment)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /op/event-applications/{id}/transition", "POST /op/allocation-orders/{id}/transition"]

  - priority: 20
    category: business_constraint
    check: "No PrizeReport already exists for this EventApplication"
    error_id: ERR_PRIZE_REPORT_ALREADY_FILED
    http_status: 409
    applies_to: "POST /op/event-applications/{id}/prize-reports"

  - priority: 21
    category: business_constraint
    check: "The reprint plan's cited set release is not already RETIRED"
    error_id: ERR_REPRINT_REVIEW_CLOSED
    http_status: 409
    applies_to: "POST /op/reprint-plans/{id}/transition"

  - priority: 22
    category: business_constraint
    check: "The set code is globally unique across SetRelease rows"
    error_id: ERR_DUPLICATE_SET_CODE
    http_status: 409
    applies_to: "POST /op/set-releases"

  - priority: 23
    category: business_constraint
    check: "The judge_ref is globally unique across JudgeCertification rows"
    error_id: ERR_DUPLICATE_JUDGE_REF
    http_status: 409
    applies_to: "POST /op/judges"

  - priority: 24
    category: business_constraint
    check: "The redemption_code is globally unique across CodeRedemption rows"
    error_id: ERR_DUPLICATE_REDEMPTION_CODE
    http_status: 409
    applies_to: "POST /op/code-redemptions"

# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  - method: POST
    path: "/op/_clock/set_current_utc"
    description: "Test-driving logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the logical clock reads that value and never falls back to real wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: [ "Re-evaluates street-date and prerelease system transitions for every SetRelease", "Re-evaluates reporting_due_by deadlines for every non-LOCAL approved EventApplication" ]

  - method: POST
    path: "/op/stores"
    description: "Enroll a retail store in the organized-play program"
    roles: [OpsAdmin]
    code: 201
    input: [name, region_code, daily_event_capacity, event_space_capacity]
    output: Store
    side_effects: [ "status initialized to ACTIVE", "reporting_tier initialized to STANDARD" ]

  - method: GET
    path: "/op/stores"
    description: "List stores with pagination"
    roles: [OpsAdmin, StoreOrganizer, Judge, Distributor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Store[]
    side_effects: []

  - method: POST
    path: "/op/stores/{id}/transition"
    description: "Single action endpoint driving Store state transitions (SUSPEND, REINSTATE)"
    roles: [OpsAdmin]
    code: 200
    input: [action, "reason?"]
    output: Store
    side_effects: [ "Applies the transition named by action per §1.2", "Increments Store.version by 1", "On SUSPEND: OPEN PrizeAllocations of this store become RELEASED, APPROVED EventApplications become DENIED, and PASSED PrizeDistributions under those allocations become VOIDED with their quantities added to total_restored_tp" ]

  - method: POST
    path: "/op/set-releases"
    description: "Announce a set release with its prerelease weekend and street date"
    roles: [OpsAdmin]
    code: 201
    input: [set_code, prerelease_start_date, prerelease_end_date, street_date]
    output: SetRelease
    side_effects: [ "status initialized to ANNOUNCED" ]

  - method: GET
    path: "/op/set-releases"
    description: "List set releases with pagination"
    roles: [OpsAdmin, StoreOrganizer, Judge, Distributor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SetRelease[]
    side_effects: []

  - method: POST
    path: "/op/set-releases/{id}/transition"
    description: "Single action endpoint driving SetRelease state transitions (RETIRE)"
    roles: [OpsAdmin]
    code: 200
    input: [action]
    output: SetRelease
    side_effects: [ "SetRelease.status RELEASED -> RETIRED", "SUBMITTED/APPROVED applications on this release become COMPLETED", "DUE prizing reports on those applications become SUBMITTED" ]

  - method: POST
    path: "/op/formats"
    description: "Register a constructed format"
    roles: [OpsAdmin]
    code: 201
    input: [name, format_code, rotation_policy]
    output: Format
    side_effects: [ "current_epoch initialized to 0", "banned_card_refs and restricted_card_refs initialized empty" ]

  - method: GET
    path: "/op/formats"
    description: "List formats with pagination"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: ["limit?", "offset?"]
    output: Format[]
    side_effects: []

  - method: POST
    path: "/op/formats/{id}/transition"
    description: "Single action endpoint driving Format epoch and list updates (ROTATE, BAN_CARD, RESTRICT_CARD)"
    roles: [OpsAdmin]
    code: 200
    input: [action, "card_ref?", "list_kind?"]
    output: Format
    side_effects: [ "On ROTATE: current_epoch += 1, APPROVED ReprintPlans citing this format become REJECTED, and COMPLETED EventApplications citing this format with prizing_report_status NOT_DUE gain a synthesized zero-value PrizeReport and become REPORTED", "On BAN_CARD/RESTRICT_CARD: card_ref is appended to the matching list, APPROVED EventApplications citing this format become DENIED, and their OPEN PrizeAllocations become CLOSED" ]

  - method: POST
    path: "/op/event-applications"
    description: "Submit an organized-play event sanctioning application"
    roles: [StoreOrganizer]
    code: 201
    input: [store_id, set_release_id, format_id, format_code, tier, scheduled_date, expected_headcount]
    output: EventApplication
    side_effects: [ "status initialized to SUBMITTED", "prizing_report_status initialized to NOT_DUE", "reporting_due_by initialized to null" ]

  - method: GET
    path: "/op/event-applications"
    description: "List event applications; filterable by store, set release, format, tier and status"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: ["limit?", "offset?", "store_id?", "set_release_id?", "format_id?", "tier?", "status?"]
    output: EventApplication[]
    side_effects: []

  - method: GET
    path: "/op/event-applications/{id}"
    description: "Retrieve one event application"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: EventApplication
    side_effects: []

  - method: PATCH
    path: "/op/event-applications/{id}"
    description: "Edit a submitted application's mutable fields before sanctioning"
    roles: [OpsAdmin, StoreOrganizer]
    code: 200
    input: [expected_headcount, scheduled_date]
    output: EventApplication
    side_effects: [ "Increments EventApplication.version by 1", "Re-derives reporting_due_by when the application is APPROVED" ]

  - method: POST
    path: "/op/event-applications/{id}/transition"
    description: "Single action endpoint driving every EventApplication state transition and prizing_report_status option (APPROVE, DENY, WITHDRAW, COMPLETE, OPTION_IN, OPTION_OUT)"
    roles: [OpsAdmin, StoreOrganizer]
    code: 200
    input: [action, "expected_store_version?", "pool_mode?", "pool_variant?"]
    output: EventApplication
    side_effects: [ "Applies the transition named by action per §1.2", "On APPROVE: creates a PrizeAllocation sized by tier_prize_support_pool, sets prize_allocation_id, and re-derives Store.reporting_tier is NOT touched here", "Increments EventApplication.version by 1", "Increments Store.version by 1 on APPROVE" ]

  - method: GET
    path: "/op/event-applications/{id}/prizing-summary"
    description: "Computed read: the application's deadline, pool state and headcount gate outcome"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: { reporting_due_by: datetime, reporting_due_status: string, qualified_headcount: boolean, prize_pool_remaining_tp: integer, report_status: string, headcount_gate_error: string }
    # reporting_due_status ∈ {NOT_SCHEDULED, OPEN, PAST_DUE}; report_status ∈ {NOT_FILED, FILED}; headcount_gate_error is null unless the gate fails, in which case it is ERR_HEADCOUNT_BELOW_THRESHOLD.
    side_effects: []

  - method: POST
    path: "/op/event-applications/{id}/prize-reports"
    description: "File the event's prize and attendance report against the application"
    roles: [StoreOrganizer]
    code: 201
    input: [prize_allocation_id, unclaimed_tp, reported_headcount]
    output: PrizeReport
    side_effects: [ "Creates PrizeReport with status FILED", "Adds unclaimed_tp to the parent allocation's total_restored_tp", "EventApplication.status COMPLETED -> REPORTED", "prizing_report_status -> SUBMITTED", "Store.reporting_tier re-derived by store_reporting_tier" ]

  - method: POST
    path: "/op/event-applications/{id}/code-redemption"
    description: "Redeem a printed code card against the event as a digital entitlement or physical prize support"
    roles: [StoreOrganizer]
    code: 201
    input: [redemption_code, code_kind, "action?"]
    output: CodeRedemption
    side_effects: [ "CodeRedemption.status AVAILABLE -> REDEEMED", "redemption_seq assigned", "PHYSICAL sets physical_grant_status to RESERVED" ]

  - method: GET
    path: "/op/event-applications/{id}/prize-distributions"
    description: "Reverse-reachability read: every PrizeDistribution whose prize_allocation_id equals this application's prize_allocation_id"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: PrizeDistribution[]
    side_effects: []

  - method: GET
    path: "/op/prize-allocations"
    description: "List prize allocations; filterable by store and by originating application"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: ["limit?", "offset?", "store_id?", "event_application_id?", "status?"]
    output: PrizeAllocation[]
    side_effects: []

  - method: GET
    path: "/op/prize-allocations/{id}"
    description: "Retrieve one prize allocation including its draw-down aggregate"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: PrizeAllocation
    side_effects: []

  - method: POST
    path: "/op/prize-allocations/{id}/transition"
    description: "Single action endpoint driving PrizeAllocation transitions and pool adjustments (REOPEN, INCREASE_REPRINT_RUN)"
    roles: [OpsAdmin]
    code: 200
    input: [action, "additional_tp?"]
    output: PrizeAllocation
    side_effects: [ "On REOPEN: status CLOSED -> OPEN", "On INCREASE_REPRINT_RUN: base_tp += additional_tp and remaining_tp is recomputed", "Increments PrizeAllocation.version by 1" ]

  - method: POST
    path: "/op/prize-distributions"
    description: "Propose a prize distribution drawn on a pool"
    roles: [StoreOrganizer]
    code: 201
    input: [prize_allocation_id, recipient_ref, quantity]
    output: PrizeDistribution
    side_effects: [ "status initialized to PROPOSED", "No draw-down until PASSED" ]

  - method: GET
    path: "/op/prize-distributions"
    description: "List prize distributions; filterable by pool and by status"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: ["limit?", "offset?", "prize_allocation_id?", "status?"]
    output: PrizeDistribution[]
    side_effects: []

  - method: GET
    path: "/op/prize-distributions/{id}"
    description: "Retrieve one prize distribution"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: PrizeDistribution
    side_effects: []

  - method: POST
    path: "/op/prize-distributions/{id}/transition"
    description: "Single action endpoint driving PrizeDistribution state transitions (PASS, VOID)"
    roles: [OpsAdmin, StoreOrganizer]
    code: 200
    input: [action]
    output: PrizeDistribution
    side_effects: [ "On PASS: parent allocation's total_drawn_tp += quantity", "On VOID: parent allocation's total_restored_tp += quantity", "Increments PrizeAllocation.version by 1" ]

  - method: GET
    path: "/op/prize-reports"
    description: "List prize reports; filterable by application and by allocation"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: ["limit?", "offset?", "event_application_id?", "prize_allocation_id?", "status?"]
    output: PrizeReport[]
    side_effects: []

  - method: GET
    path: "/op/prize-reports/{id}"
    description: "Retrieve one prize report"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: PrizeReport
    side_effects: []

  - method: POST
    path: "/op/enforcement-cases"
    description: "File a rules enforcement case against a player at a sanctioned event"
    roles: [Judge]
    code: 201
    input: [event_application_id, player_ref, judge_ref, offense_class, rules_enforcement_level, "repeated_offense?"]
    output: RulesEnforcementCase
    side_effects: [ "status initialized to FILED", "penalty_points and current_points set by enforcement_penalty_points" ]

  - method: GET
    path: "/op/enforcement-cases"
    description: "List enforcement cases; filterable by event application and by status"
    roles: [OpsAdmin, Judge]
    code: 200
    input: ["limit?", "offset?", "event_application_id?", "status?"]
    output: RulesEnforcementCase[]
    side_effects: []

  - method: GET
    path: "/op/enforcement-cases/{id}"
    description: "Retrieve one enforcement case"
    roles: [OpsAdmin, Judge]
    code: 200
    input: []
    output: RulesEnforcementCase
    side_effects: []

  - method: POST
    path: "/op/enforcement-cases/{id}/transition"
    description: "Single action endpoint driving RulesEnforcementCase transitions (ESCALATE, CLOSE, REDUCE)"
    roles: [OpsAdmin]
    code: 200
    input: [action, "reason?"]
    output: RulesEnforcementCase
    side_effects: [ "On ESCALATE: status FILED -> ESCALATED and current_points is recomputed by the escalate branch of enforcement_penalty_points", "On CLOSE: status -> CLOSED and current_points resets to penalty_points", "On REDUCE: status -> REDUCED and current_points = floor(penalty_points / 2)", "Owning Store.reporting_violation_points is re-derived" ]

  - method: POST
    path: "/op/code-redemptions/{id}/transition"
    description: "Single action endpoint driving CodeRedemption disbursement (DISBURSE); draws and restores prize points in one transaction"
    roles: [OpsAdmin]
    code: 200
    input: [action]
    output: CodeRedemption
    side_effects: [ "physical_grant_status RESERVED -> DISBURSED", "parent allocation's total_drawn_tp += floor(card_value)", "parent allocation's total_restored_tp += floor(card_value)" ]

  - method: POST
    path: "/op/code-redemptions"
    description: "Mint an unredeemed invitation or prize code card pre-bound to a sanctioned event application"
    roles: [OpsAdmin]
    code: 201
    input: [redemption_code, code_kind, event_application_id]
    output: CodeRedemption
    side_effects: [ "status initialized to AVAILABLE", "physical_grant_status initialized to NOT_APPLICABLE" ]

  - method: GET
    path: "/op/code-redemptions"
    description: "List code redemptions; filterable by originating application"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: ["limit?", "offset?", "event_application_id?", "status?"]
    output: CodeRedemption[]
    side_effects: []

  - method: GET
    path: "/op/code-redemptions/{id}"
    description: "Retrieve one code redemption"
    roles: [OpsAdmin, StoreOrganizer, Judge]
    code: 200
    input: []
    output: CodeRedemption
    side_effects: []

  - method: POST
    path: "/op/product-configurations"
    description: "Define a collector product configuration and its print run"
    roles: [OpsAdmin]
    code: 201
    input: [set_release_id, configuration_kind, pack_count, print_run_units]
    output: ProductConfiguration
    side_effects: [ "units_allocated initialized to 0" ]

  - method: GET
    path: "/op/product-configurations"
    description: "List collector product configurations; filterable by set release"
    roles: [OpsAdmin, Distributor, StoreOrganizer]
    code: 200
    input: ["limit?", "offset?", "set_release_id?", "configuration_kind?"]
    output: ProductConfiguration[]
    side_effects: []

  - method: GET
    path: "/op/product-configurations/{id}"
    description: "Retrieve one collector product configuration with its derived units_available"
    roles: [OpsAdmin, Distributor, StoreOrganizer]
    code: 200
    input: []
    output: ProductConfiguration
    side_effects: []

  - method: POST
    path: "/op/product-configurations/{id}/transition"
    description: "Single action endpoint driving ProductConfiguration changes (INCREASE_REPRINT_RUN); re-ranks the pending allocation queue"
    roles: [OpsAdmin]
    code: 200
    input: [action, "additional_units?"]
    output: ProductConfiguration
    side_effects: [ "print_run_units += additional_units", "Increments ProductConfiguration.version by 1", "Orders whose low approval_rank is no longer above the new availability lose their demotion and re-rank" ]

  - method: POST
    path: "/op/allocation-orders"
    description: "Place a distributor allocation order against a collector configuration"
    roles: [Distributor]
    code: 201
    input: [distributor_name, product_configuration_id, quantity]
    output: AllocationOrder
    side_effects: [ "status initialized to PENDING", "submitted_seq assigned from the global monotonic sequence", "fulfilled_qty initialized to 0", "approval_rank computed by the selector rule" ]

  - method: GET
    path: "/op/allocation-orders"
    description: "List allocation orders; filterable by product configuration and by status"
    roles: [OpsAdmin, Distributor]
    code: 200
    input: ["limit?", "offset?", "product_configuration_id?", "status?"]
    output: AllocationOrder[]
    side_effects: []

  - method: GET
    path: "/op/allocation-orders/{id}"
    description: "Retrieve one allocation order with its approval_rank and fulfilled_qty"
    roles: [OpsAdmin, Distributor]
    code: 200
    input: []
    output: AllocationOrder
    side_effects: []

  - method: POST
    path: "/op/allocation-orders/{id}/transition"
    description: "Single action endpoint driving AllocationOrder state transitions (APPROVE, FULFILL_PARTIAL, DENY)"
    roles: [OpsAdmin]
    code: 200
    input: [action, "expected_product_configuration_version?"]
    output: AllocationOrder
    side_effects: [ "Applies the transition named by action per §1.2", "parent ProductConfiguration.units_allocated += fulfilled_qty", "Increments ProductConfiguration.version by 1" ]

  - method: POST
    path: "/op/reprint-plans"
    description: "File a reprint policy plan for a card and compute its market verdict"
    roles: [OpsAdmin]
    code: 201
    input: [card_name, set_release_id, format_id, secondary_market_index, first_print_index]
    output: ReprintPlan
    side_effects: [ "status initialized to DRAFT", "verdict computed by reprint_policy_verdict" ]

  - method: GET
    path: "/op/reprint-plans"
    description: "List reprint plans; filterable by format and by set release"
    roles: [OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "format_id?", "set_release_id?", "status?"]
    output: ReprintPlan[]
    side_effects: []

  - method: GET
    path: "/op/reprint-plans/{id}"
    description: "Retrieve one reprint plan with its verdict"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: ReprintPlan
    side_effects: []

  - method: POST
    path: "/op/reprint-plans/{id}/transition"
    description: "Single action endpoint driving ReprintPlan state transitions (APPROVE, PUBLISH)"
    roles: [OpsAdmin]
    code: 200
    input: [action]
    output: ReprintPlan
    side_effects: [ "Applies the transition named by action per §1.2", "PUBLISH additionally records the plan under its SetRelease" ]

  - method: POST
    path: "/op/judges"
    description: "Register a certified judge"
    roles: [OpsAdmin]
    code: 201
    input: [judge_ref, name, level]
    output: JudgeCertification
    side_effects: [ "status initialized to ACTIVE", "practice_events initialized to 0" ]

  - method: GET
    path: "/op/judges"
    description: "List judge certifications with pagination"
    roles: [OpsAdmin, Judge]
    code: 200
    input: ["limit?", "offset?", "level?", "status?"]
    output: JudgeCertification[]
    side_effects: []

  - method: GET
    path: "/op/judges/{ref}"
    description: "Retrieve one judge certification with its derived promotion_eligible flag"
    roles: [OpsAdmin, Judge]
    code: 200
    input: []
    output: JudgeCertification
    side_effects: []

  - method: POST
    path: "/op/judges/{ref}/transition"
    description: "Single action endpoint driving JudgeCertification changes (RECORD_PRACTICE_EVENT, DECERTIFY)"
    roles: [OpsAdmin]
    code: 200
    input: [action, "event_application_id?"]
    output: JudgeCertification
    side_effects: [ "On RECORD_PRACTICE_EVENT: practice_events += 1 when level is LEVEL_2 and the cited application is LOCAL and REPORTED", "On DECERTIFY: status ACTIVE -> DECERTIFIED" ]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required body field is absent, an undeclared body field is supplied, or a value violates its declared type or enum domain" }
  - { id: ERR_DUPLICATE_REDEMPTION_CODE, http: 409, condition: "redemption_code collides with an existing CodeRedemption row" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header absent or names an undeclared role; X-User-ID absent for an entity_backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The caller's role is not listed on the invoked endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource or a body foreign key names a row that does not exist" }
  - { id: ERR_INVALID_REDEMPTION_CODE, http: 404, condition: "The redemption_code does not match exactly one CodeRedemption row" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in the state its §1.2 transition requires" }
  - { id: ERR_REPORTING_WINDOW_OPEN, http: 409, condition: "Event application approval attempted while prizing_report_status is DUE or SUBMITTED" }
  - { id: ERR_SET_NOT_STREET_LEGAL, http: 409, condition: "Event application approval attempted while the cited set release is ANNOUNCED or PRERELEASE" }
  - { id: ERR_INVITATION_REQUIRED, http: 422, condition: "CHAMPIONSHIP-tier approval attempted without an AVAILABLE DIGITAL CodeRedemption bound to the application" }
  - { id: ERR_TIER_SLOT_CONFLICT, http: 422, condition: "The store already holds Store.daily_event_capacity QUALIFIER or CHAMPIONSHIP applications on the same UTC calendar day as this one" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 422, condition: "This application's half-open [scheduled_date, scheduled_date + 6 hours] window overlaps another non-terminal application of the same store" }
  - { id: ERR_EVENT_SPACE_CAPACITY, http: 422, condition: "More than Store.event_space_capacity buffered occupancies cover the same instant in this store's event space" }
  - { id: ERR_FORMAT_CODE_NOT_LEGAL, http: 422, condition: "format_code does not equal the format_code of the Format named by format_id" }
  - { id: ERR_INSUFFICIENT_POOL, http: 402, condition: "PrizeDistribution.quantity exceeds the parent allocation's remaining_tp" }
  - { id: ERR_PRINT_RUN_EXHAUSTED, http: 402, condition: "AllocationOrder.quantity exceeds the parent configuration's units_available and the caller requested APPROVE" }
  - { id: ERR_REPRINT_MARKET_FLOOR, http: 422, condition: "ReprintPlan approval attempted while verdict is REPRINT_DENIED" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 422, condition: "Prize report filed after reporting_due_by on a non-LOCAL application" }
  - { id: ERR_STREET_DATE_BEFORE_PRERELEASE, http: 422, condition: "street_date is earlier than prerelease_end_date" }

  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_store_version or expected_product_configuration_version does not equal the parent's current version" }
  - { id: ERR_PRIZE_REPORT_ALREADY_FILED, http: 409, condition: "A PrizeReport already exists for this EventApplication" }
  - { id: ERR_REPRINT_REVIEW_CLOSED, http: 409, condition: "The reprint plan's cited set release is already RETIRED" }
  - { id: ERR_DUPLICATE_SET_CODE, http: 409, condition: "set_code collides with an existing SetRelease" }
  - { id: ERR_DUPLICATE_JUDGE_REF, http: 409, condition: "judge_ref collides with an existing JudgeCertification" }
  - { id: ERR_HEADCOUNT_BELOW_THRESHOLD, http: 200, condition: "Reported to the prizing summary as a non-fatal gate flag on GET /op/event-applications/{id}/prizing-summary when reported_headcount < 24 on a QUALIFIER or CHAMPIONSHIP application" }

