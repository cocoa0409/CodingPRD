      - name: roster_move_action_endpoints_each_enforce_their_own_from_state_returns_409
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RosterMove.PENDING_to_APPROVED
          - state_machines.RosterMove.APPROVED_to_EXECUTED
          - state_machines.RosterMove.EXECUTED_to_REVERSED
