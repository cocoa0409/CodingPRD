          setup:
            - "Certified+LISTED listing L with guarantee G (ISSUED); buyer B1 offer accepted (escrow OPENED); buyer B2 registered with funds"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
