          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one successful booking bumps the plan version, a second booking still carrying the OLD expected_treatment_plan_version is rejected ERR_STALE_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup: ["Patient with finalized intake + ACTIVE plan (capture plan version v0); one booking succeeds and advances plan version."]
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr O1", license_number: "LIC-O1" }
              as: ClinicAdmin
              captures: { prac: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room O1" }
              as: ClinicAdmin
              captures: { room: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "O1 Pat", date_of_birth: "1990-01-01" }
              as: ClinicAdmin
              captures: { pid: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pid}", chief_complaint: "x", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { ik: $.data.id }
            - call: "POST /intakes/${ik}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pid}", practitioner_id: "${prac}", intake_id: "${ik}", acupoints: ["LI4"], planned_sessions: 5 }
              as: Practitioner
              as_user_id: "${prac}"
              captures: { pl: $.data.id, plv0: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-26T09:00:00Z", scheduled_end: "2026-06-26T09:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pid}", treatment_plan_id: "${pl}", practitioner_id: "${prac}", room_id: "${room}", charge_source: "PER_VISIT", scheduled_start: "2026-06-26T11:00:00Z", scheduled_end: "2026-06-26T11:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First booking succeeded (201) and advanced TreatmentPlan.${pl}.version above plv0"
            - "Second booking with stale ${plv0} → HTTP 412; data.error_id == ERR_STALE_VERSION"

      - name: occ_current_plan_version_succeeds_on_dispense
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispense-create-stale-plan]
          - entities.FormulaDispense.fields.status
        distinguishing_aspect: "Creating a dispense with the CURRENT expected_treatment_plan_version (re-read after a prior plan-version bump) succeeds 201 — proving the OCC happy path advances the plan version on each guarded write."
        test_recipe:
