      - name: late_regulatory_filing_applies_the_notification_weight_to_one_center
        claim_type: constants_applied
        grounds:
          - calculations.center_compliance_score.constants
          - state_machines.ThermalEvent.notification_status.transitions.PENDING_to_LATE_FILED
          - entities.ServiceCenter.fields.compliance_score
        distinguishing_aspect: |
          An S4 event detected 2026-07-29T00:00:00Z has a 24-hour deadline of 2026-07-30T00:00:00Z,
          so a filing at the 2026-08-01 clock is STRICTLY late. The score is recomputed from the
          counters as MAX(0, 100 - 15*0 - 40*1) == 60 - the NOTIFICATION_WEIGHT of 40, not the
          SHIPMENT_WEIGHT of 15 - and 60 is still above the decert threshold of 20, so the center
          stays ACTIVE. The other center's score is untouched.
        test_recipe:
          setup:
