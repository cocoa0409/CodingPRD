# ============================================================================
# SCAFFOLD.yaml — Marketplace Seller Account Health & Policy Enforcement
# Sections §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  2777. Marketplace Seller Account Health & Policy Enforcement (online marketplace seller performance): performance metric thresholds across order defect rate, late shipment, cancellation and valid tracking, policy violation categories including listing accuracy, intellectual property and restricted products, warning, listing removal and account suspension ladder with severity weighting, plan of action submission requirements with root cause, corrective and preventive measures, appeal review with reinstatement criteria and repeated-offense denial, funds disbursement holds during investigation with reserve policies, related-account detection for banned seller re-registration, seller communication, notification transparency and dispute escalation

domain_name: marketplace-seller-account-health

# Flat topology: every collection is a top-level peer resource. There is no
# shared path prefix; child rows are located through FK-filtered list endpoints
# and parent sub-resource lists (see §1.5).
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities joined by foreign keys. Only three write paths are nested
  # (/sellers/{id}/proceeds-credits, /sellers/{id}/metric-snapshots,
  # /sellers/{id}/health-evaluations) because those rows are per-seller
  # timeline events; every other resource is addressed at the top level.

  state_machine_shape: parallel
  # Seller carries two INDEPENDENT state dimensions that evolve separately:
  # enforcement_state (ACTIVE/WATCHLIST/RESTRICTED/SUSPENDED/BANNED) and
  # disbursement_state (NORMAL/RESERVE_HELD/FULL_HOLD). PlanOfAction adds a
  # revision cycle (SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED) and Appeal
  # adds a branch-then-reopen shape (DENIED -> ESCALATED_REVIEW -> {GRANTED_ON_
  # ESCALATION, FINAL_DENIED}).

  relationship_patterns:
    - one_to_many          # Seller -> Listing / Violation / EnforcementAction / DisbursementHold / Notification
    - self_referential     # Seller.root_seller_id -> Seller.id (banned-seller re-registration chain)
    - many_to_many         # RelatedAccountLink is the junction between two Sellers
    - cross_aggregate      # Appeal (enforcement aggregate) gates DisbursementHold (funds aggregate)

  role_model: segregation_of_duties
  # The operator id that issued an EnforcementAction may not review its
  # PlanOfAction, may not decide its Appeal, and may not decide the escalation
  # of that Appeal. Enforced on X-User-ID, not on role name.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 44 endpoints / 49 error codes / 13 calculations (2 of them
  # dual-variant) / 10 state machines across 9 entities / 16 validation rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal entity name of the seller.
        constraints: 1..200 chars, non-empty after trim
      - name: email
        type: string
        source: input
        description: Contact email; also the login identity of the seller.
        constraints: must contain exactly one '@'; unique across Seller rows (case-insensitive) or ERR_DUPLICATE_SELLER_EMAIL
      - name: tax_id_hash
        type: string
        source: input
        description: Opaque hash of the seller's tax identifier; a related-account matching signal.
        constraints: 4..64 chars
      - name: payout_bank_token
        type: string
        source: input
        description: Opaque payout bank account token; a related-account matching signal.
        constraints: 4..64 chars
      - name: address_fingerprint
        type: string
        source: input
        description: Normalized business-address fingerprint; a related-account matching signal.
        constraints: 4..64 chars
      - name: device_fingerprint
        type: string
        source: input
        description: Registration device fingerprint; a related-account matching signal.
        default: null
        constraints: null or 4..64 chars
      - name: email_domain
        type: string
        source: computed
        description: Lowercased substring of `email` after '@'; matching signal only when not in PUBLIC_EMAIL_DOMAINS.
      - name: root_seller_id
        type: string
        source: system
        description: "FK -> Seller.id; the matched_seller_id of the highest-scoring RelatedAccountLink minted at registration (ranking: confidence_score DESC, tie-break matched seller created_at ASC). Null when no link scored >= RELATED_LINK_MIN_SCORE."
        default: null
      - name: registration_risk_flag
        type: boolean
        source: system
        description: True when registration minted a RelatedAccountLink with confidence_score >= RELATED_LINK_WATCH_SCORE against a seller whose enforcement_state is BANNED or SUSPENDED.
        default: false
      - name: enforcement_state
        type: enum
        source: computed
        description: Enforcement dimension of the account posture; recomputed by calculations.enforcement_state_target at the end of every request that mutates this seller's EnforcementAction set, ban_reason or registration_risk_flag.
        default: ACTIVE
        constraints: one of ACTIVE, WATCHLIST, RESTRICTED, SUSPENDED, BANNED
      - name: disbursement_state
        type: enum
        source: computed
        description: Funds dimension of the account posture; recomputed by calculations.disbursement_state_target after enforcement_state settles and after any Violation or DisbursementHold state change.
        default: NORMAL
        constraints: one of NORMAL, RESERVE_HELD, FULL_HOLD
      - name: ban_reason
        type: enum
        source: system
        description: Why the account is permanently banned; non-null forces enforcement_state BANNED.
        default: null
        constraints: null, RELATED_ACCOUNT_CONFIRMED, or ESCALATION_EXHAUSTED
      - name: severity_points_balance
        type: number
        source: computed
        description: Decay-weighted severity points from non-vacated EnforcementActions (calculations.severity_points_balance).
        default: 0.00
        constraints: 2 decimal places, >= 0.00
      - name: health_score
        type: number
        source: computed
        description: health_score of this seller's most recent HealthEvaluation (by evaluated_at DESC, tie-break created_at ASC); null before the first evaluation.
        default: null
        constraints: 2 decimal places, 0.00..100.00
      - name: metric_tier
        type: enum
        source: computed
        description: metric_tier of this seller's most recent HealthEvaluation (same selector as health_score); null before the first evaluation.
        default: null
        constraints: null, EXEMPT, HEALTHY, AT_RISK, or BREACHING
      - name: available_balance_cents
        type: integer
        source: system
        description: Marketplace proceeds currently disbursable, in cents.
        default: 0
        constraints: ">= 0"
      - name: held_balance_cents
        type: integer
        source: system
        description: Sum of held_amount_cents over this seller's DisbursementHold rows in state ACTIVE, in cents.
        default: 0
        constraints: ">= 0"
      - name: lifetime_credited_cents
        type: integer
        source: system
        description: Cumulative proceeds ever credited by settlements, in cents; never decreases.
        default: 0
        constraints: ">= 0"
      - name: lifetime_debited_cents
        type: integer
        source: system
        description: Cumulative funds ever removed from the seller (forfeited holds), in cents; never decreases.
        default: 0
        constraints: ">= 0"
      - name: open_defect_claim_units
        type: integer
        source: computed
        description: defect_claims_pending of this seller's most recent MetricSnapshot (window_end DESC, tie-break created_at ASC); 0 when no snapshot exists.
        default: 0
        constraints: ">= 0"
      - name: reinstated_count
        type: integer
        source: system
        description: Number of times an appeal or escalation vacated an ACCOUNT_SUSPENSION action for this seller.
        default: 0
        constraints: ">= 0"

  - name: MetricSnapshot
    parent: null
    common_fields: false
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the seller whose performance window this row measures.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the measured window (ISO 8601 UTC, three fractional digits).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the measured window; windows are half-open [window_start, window_end).
        constraints: must be strictly after window_start
      - name: order_volume
        type: integer
        source: input
        description: Orders placed in the window; denominator of late_shipment_rate and cancellation_rate.
        constraints: ">= 0"
      - name: delivered_or_refunded_volume
        type: integer
        source: input
        description: Orders in the window that reached DELIVERED or REFUNDED; denominator of the FINAL order-defect-rate variant.
        constraints: ">= 0"
      - name: defect_claims_pending
        type: integer
        source: input
        description: Defect claims opened in the window still awaiting adjudication; counted only by the PROVISIONAL order-defect-rate variant.
        constraints: ">= 0"
      - name: defect_claims_substantiated
        type: integer
        source: input
        description: Defect claims opened in the window already adjudicated against the seller; counted by both order-defect-rate variants.
        constraints: ">= 0"
      - name: late_shipments
        type: integer
        source: input
        description: Shipments confirmed after the promised ship date in the window.
        constraints: ">= 0"
      - name: pre_fulfillment_cancellations
        type: integer
        source: input
        description: Seller-initiated cancellations before fulfillment in the window.
        constraints: ">= 0"
      - name: shipments_total
        type: integer
        source: input
        description: Shipments confirmed in the window; denominator of valid_tracking_rate.
        constraints: ">= 0"
      - name: shipments_with_valid_tracking
        type: integer
        source: input
        description: Shipments in the window carrying carrier-validated tracking.
        constraints: 0 .. shipments_total
      - name: source
        type: enum
        source: input
        description: Provenance of the counters.
        default: PLATFORM_PIPELINE
        constraints: one of PLATFORM_PIPELINE, MANUAL_CORRECTION

  - name: HealthEvaluation
    parent: null
    common_fields: false
    fields:
      - name: seller_id
        type: string
        source: system
        description: FK -> Seller.id; the evaluated seller (taken from the path, not the body).
      - name: auto_violation_id
        type: string
        source: system
        description: "FK -> Violation.id; the Violation this evaluation auto-created because metric_tier == BREACHING. Null when metric_tier != BREACHING or when no PolicyRule with category SHIPPING_PERFORMANCE exists."
        default: null
      - name: input_snapshot_count
        type: integer
        source: computed
        description: Number of MetricSnapshot rows in the FINAL input set S (1 or 2; see calculations.order_defect_rate.input_set).
        constraints: 1 or 2
      - name: input_window_start
        type: datetime
        source: computed
        description: window_start of the earliest MetricSnapshot in S.
      - name: input_window_end
        type: datetime
        source: computed
        description: window_end of the latest MetricSnapshot in S.
      - name: odr_provisional
        type: number
        source: computed
        description: PROVISIONAL order defect rate (latest snapshot only, pending + substantiated claims over order_volume).
        constraints: 4 decimal places
      - name: odr_final
        type: number
        source: computed
        description: FINAL order defect rate (set S, substantiated claims only, over summed delivered_or_refunded_volume).
        constraints: 4 decimal places
      - name: odr_variant_delta
        type: number
        source: computed
        description: odr_provisional - odr_final, rounded HALF_UP to 4 decimals; the observable divergence between the two variants.
        constraints: 4 decimal places
      - name: late_shipment_rate
        type: number
        source: computed
        description: Sum of late_shipments over S divided by sum of order_volume over S.
        constraints: 4 decimal places
      - name: cancellation_rate
        type: number
        source: computed
        description: Sum of pre_fulfillment_cancellations over S divided by sum of order_volume over S.
        constraints: 4 decimal places
      - name: valid_tracking_rate
        type: number
        source: computed
        description: Sum of shipments_with_valid_tracking over S divided by sum of shipments_total over S; exactly 1.0000 when that denominator is 0.
        constraints: 4 decimal places
      - name: order_volume_final
        type: integer
        source: computed
        description: Sum of order_volume over S; drives the EXEMPT tier when 0.
        constraints: ">= 0"
      - name: health_score
        type: number
        source: computed
        description: 100.00 minus the rounded penalty total (calculations.health_score); floored at 0.00.
        constraints: 2 decimal places, 0.00..100.00
      - name: metric_tier
        type: enum
        source: computed
        description: Tier derived from breaches and health_score (calculations.metric_tier).
        constraints: one of EXEMPT, HEALTHY, AT_RISK, BREACHING
      - name: breached_metrics
        type: array
        source: computed
        description: "Breached metric names, emitted in this fixed order: ORDER_DEFECT_RATE, LATE_SHIPMENT_RATE, CANCELLATION_RATE, VALID_TRACKING_RATE. Empty array when no metric breaches."
      - name: evaluated_at
        type: datetime
        source: system
        description: Logical clock reading when the evaluation ran.

  - name: PolicyRule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short policy code shown to sellers in notifications.
        constraints: 2..32 chars, unique across PolicyRule rows
      - name: category
        type: enum
        source: input
        description: Policy family; drives severity escalation, decay exemption and reinstatement safety gates.
        constraints: one of LISTING_ACCURACY, INTELLECTUAL_PROPERTY, RESTRICTED_PRODUCT, REVIEW_MANIPULATION, SHIPPING_PERFORMANCE
      - name: base_severity_weight
        type: number
        source: input
        description: Base severity points before repeat, category and posture factors.
        constraints: 2 decimal places, 0.50..8.00
      - name: removal_scope
        type: enum
        source: input
        description: What a LISTING_REMOVAL rung removes — only the cited listing, or every non-removed listing of the seller.
        constraints: one of LISTING, ACCOUNT
      - name: requires_poa
        type: boolean
        source: input
        description: When true, an appeal against an action citing this rule requires a linked PlanOfAction in state ACCEPTED.
        default: true
      - name: decay_exempt
        type: boolean
        source: computed
        description: "True exactly when category is INTELLECTUAL_PROPERTY or RESTRICTED_PRODUCT; such points never decay."

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; owner of the listing. Must equal X-User-ID when the caller role is Seller.
      - name: sku
        type: string
        source: input
        description: Seller-assigned stock keeping unit.
        constraints: 1..40 chars
      - name: title
        type: string
        source: input
        description: Listing title shown to buyers.
        constraints: 1..200 chars
      - name: category_code
        type: string
        source: input
        description: Marketplace category code of the listing.
        constraints: 2..32 chars
      - name: restricted_flag
        type: boolean
        source: input
        description: Seller-declared indicator that the item falls in a restricted product programme.
        default: false
      - name: state
        type: enum
        source: computed
        description: Listing lifecycle state; only enforcement cascades and relist move it.
        default: ACTIVE
        constraints: one of ACTIVE, SUPPRESSED, REMOVED
      - name: removal_policy_category
        type: enum
        source: system
        description: category of the PolicyRule whose enforcement action removed this listing; null while the listing has never been removed.
        default: null
        constraints: null, LISTING_ACCURACY, INTELLECTUAL_PROPERTY, RESTRICTED_PRODUCT, REVIEW_MANIPULATION, or SHIPPING_PERFORMANCE
      - name: suppressed_by_suspension
        type: boolean
        source: system
        description: True while the listing sits in SUPPRESSED because an ACCOUNT_SUSPENSION rung suppressed it (rather than a listing-level removal).
        default: false

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the seller accused of the violation.
      - name: policy_rule_id
        type: string
        source: input
        description: FK -> PolicyRule.id; the policy allegedly violated.
      - name: listing_id
        type: string
        source: input
        description: FK -> Listing.id; the cited listing. Required when the rule's removal_scope is LISTING, must belong to seller_id.
        default: null
      - name: reporter_type
        type: enum
        source: input
        description: Who reported the violation; RIGHTS_OWNER reports are the only ones allowed to cite INTELLECTUAL_PROPERTY rules.
        constraints: one of RIGHTS_OWNER, BUYER, PLATFORM_AUTOMATION, REGULATOR
      - name: evidence_reference
        type: string
        source: input
        description: Opaque evidence bundle reference disclosed to the seller in notifications.
        constraints: 3..64 chars
      - name: state
        type: enum
        source: computed
        description: Adjudication lifecycle of the report.
        default: REPORTED
        constraints: one of REPORTED, UNDER_INVESTIGATION, SUBSTANTIATED, DISMISSED
      - name: auto_generated
        type: boolean
        source: system
        description: True when the row was minted by a BREACHING HealthEvaluation rather than by POST /violations.
        default: false
      - name: detected_at
        type: datetime
        source: system
        description: Logical clock reading when the violation row was created.
      - name: adjudicated_at
        type: datetime
        source: system
        description: Logical clock reading when the violation reached SUBSTANTIATED or DISMISSED; null before that.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Investigator note stored at adjudication time; disclosed to the seller.
        default: null

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: system
        description: FK -> Seller.id; copied from the cited Violation at issuance.
      - name: violation_id
        type: string
        source: input
        description: FK -> Violation.id; the SUBSTANTIATED violation this action enforces. At most one non-vacated action per violation.
      - name: policy_category
        type: enum
        source: system
        description: PolicyRule.category snapshotted at issuance; later edits to the rule never move an issued action.
        constraints: one of LISTING_ACCURACY, INTELLECTUAL_PROPERTY, RESTRICTED_PRODUCT, REVIEW_MANIPULATION, SHIPPING_PERFORMANCE
      - name: policy_rule_code
        type: string
        source: system
        description: PolicyRule.code snapshotted at issuance and disclosed in the ACTION_ISSUED notification.
      - name: decay_exempt
        type: boolean
        source: system
        description: PolicyRule.decay_exempt snapshotted at issuance; drives calculations.severity_points_balance.
      - name: severity_points_applied
        type: number
        source: computed
        description: Severity points this action contributes before decay (calculations.severity_points_applied).
        constraints: 2 decimal places, 0.00..12.00
      - name: ladder_rung_computed
        type: enum
        source: computed
        description: Rung the ladder selected from post-issuance severity balance and category override (calculations.enforcement_ladder_rung).
        constraints: one of WARNING, LISTING_REMOVAL, ACCOUNT_SUSPENSION
      - name: action_type
        type: enum
        source: computed
        description: Rung actually applied — equals ladder_rung_computed unless action_type_override was supplied and is strictly more severe.
        constraints: one of WARNING, LISTING_REMOVAL, ACCOUNT_SUSPENSION
      - name: override_applied
        type: boolean
        source: computed
        description: True when action_type differs from ladder_rung_computed because of action_type_override.
        default: false
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyInvestigator who issued the action; segregation-of-duties compares against this value.
      - name: issued_at
        type: datetime
        source: system
        description: Logical clock reading at issuance; the severity decay clock and the appeal window both start here.
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: issued_at + APPEAL_WINDOW_DAYS (30 days); an appeal is accepted while clock_now <= this instant.
      - name: state
        type: enum
        source: computed
        description: Enforcement lifecycle; VACATED removes the action's points from the seller's balance.
        default: ISSUED
        constraints: one of ISSUED, ACKNOWLEDGED, UPHELD, VACATED
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical clock reading when the seller acknowledged the action; null before that.
        default: null
      - name: resolution_reason
        type: enum
        source: system
        description: Why the action left ISSUED/ACKNOWLEDGED; null while unresolved.
        default: null
        constraints: null, APPEAL_GRANTED, APPEAL_DENIED, ESCALATION_GRANTED, or ESCALATION_DENIED
      - name: removed_listing_count
        type: integer
        source: computed
        description: Number of Listing rows this action moved to REMOVED at issuance.
        default: 0
        constraints: ">= 0"

  - name: PlanOfAction
    parent: null
    common_fields: true
    fields:
      - name: enforcement_action_id
        type: string
        source: input
        description: FK -> EnforcementAction.id; the action this plan answers.
      - name: root_cause
        type: string
        source: input
        description: Seller's root-cause statement; the reviewer rejects plans that restate the symptom.
        constraints: 40..2000 chars after trim, else ERR_POA_INCOMPLETE
      - name: corrective_measures
        type: array
        source: input
        description: Measures already taken to fix existing damage; each element 10..500 chars.
        constraints: 1..10 non-empty elements, else ERR_POA_INCOMPLETE
      - name: preventive_measures
        type: array
        source: input
        description: Measures that stop recurrence; each element 10..500 chars.
        constraints: 1..10 non-empty elements, else ERR_POA_INCOMPLETE
      - name: state
        type: enum
        source: computed
        description: Review lifecycle with a revision cycle back to SUBMITTED.
        default: SUBMITTED
        constraints: one of SUBMITTED, RETURNED_FOR_REVISION, ACCEPTED, REJECTED, SUPERSEDED
      - name: revision_count
        type: integer
        source: computed
        description: Number of completed resubmissions; the third return is the last one the seller may answer.
        default: 0
        constraints: 0..POA_MAX_REVISIONS (0..2)
      - name: submitted_at
        type: datetime
        source: system
        description: Logical clock reading of the most recent SUBMITTED entry (creation or resubmission).
      - name: deadline_at
        type: datetime
        source: computed
        description: EnforcementAction.issued_at + POA_DEADLINE_DAYS (17 days); recorded for transparency and disclosed in notifications.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who performed the most recent review; null before the first review.
        default: null
      - name: review_notes
        type: string
        source: input
        description: Reviewer note from the most recent review, disclosed to the seller.
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: enforcement_action_id
        type: string
        source: input
        description: FK -> EnforcementAction.id; the action under appeal.
      - name: plan_of_action_id
        type: string
        source: input
        description: FK -> PlanOfAction.id; required when the action's PolicyRule had requires_poa true, and then it must be in state ACCEPTED before review starts.
        default: null
      - name: grounds
        type: string
        source: input
        description: Seller's appeal grounds.
        constraints: 20..2000 chars
      - name: state
        type: enum
        source: computed
        description: Appeal lifecycle; DENIED can reopen once through ESCALATED_REVIEW.
        default: SUBMITTED
        constraints: one of SUBMITTED, UNDER_REVIEW, GRANTED, DENIED, ESCALATED_REVIEW, GRANTED_ON_ESCALATION, FINAL_DENIED
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the AppealReviewer who decided the first-level outcome; null before that.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical clock reading of the first-level decision; null before that.
        default: null
      - name: denial_reason
        type: enum
        source: input
        description: Required when the first-level or escalation outcome is a denial.
        default: null
        constraints: null, REPEAT_OFFENSE, INSUFFICIENT_POA, EVIDENCE_UPHELD, or RESTRICTED_PRODUCT_RISK
      - name: rationale
        type: string
        source: input
        description: Decision rationale text disclosed verbatim to the seller in the notification.
        default: null
        constraints: 20..2000 chars when supplied
      - name: escalation_deadline_at
        type: datetime
        source: computed
        description: decided_at + ESCALATION_WINDOW_DAYS (14 days); the seller may escalate while clock_now <= this instant. Null before the first-level decision.
        default: null
      - name: escalation_requested_at
        type: datetime
        source: system
        description: Logical clock reading when the seller escalated the denial; null when never escalated.
        default: null
      - name: escalation_grounds
        type: string
        source: input
        description: Seller's escalation grounds; required to escalate.
        default: null
        constraints: 20..2000 chars when supplied
      - name: escalation_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who decided the escalation; null before that.
        default: null
      - name: reinstatement_granted
        type: boolean
        source: computed
        description: True exactly when state is GRANTED or GRANTED_ON_ESCALATION and the appealed action_type was ACCOUNT_SUSPENSION.
        default: false

  - name: DisbursementHold
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the seller whose proceeds are held.
      - name: enforcement_action_id
        type: string
        source: input
        description: FK -> EnforcementAction.id; the investigation this hold funds-freezes against. Null for auto-created FULL_HOLD rows.
        default: null
      - name: hold_type
        type: enum
        source: input
        description: RESERVE holds a computed fraction; FULL_HOLD sweeps the whole available balance and is only ever auto-created.
        constraints: one of RESERVE, FULL_HOLD
      - name: reserve_basis
        type: enum
        source: input
        description: Which reserve algorithm computed held_amount_cents; NONE only on auto-created FULL_HOLD rows.
        constraints: one of ROLLING, CLAIM_EXPOSURE, NONE
      - name: risk_tier
        type: enum
        source: computed
        description: Tier snapshotted at creation by calculations.risk_tier; the reserve percentage and exposure multiplier both read this snapshot.
        constraints: one of TIER_1, TIER_2, TIER_3
      - name: held_amount_cents
        type: integer
        source: computed
        description: Cents moved from available_balance_cents to held_balance_cents at creation (calculations.reserve_requirement_cents for RESERVE; the whole available balance for FULL_HOLD).
        constraints: ">= 0"
      - name: coverage_start
        type: datetime
        source: input
        description: Inclusive start of the coverage interval; intervals are closed and separated by HOLD_BUFFER_HOURS (24 hours).
      - name: coverage_end
        type: datetime
        source: input
        description: Inclusive end of the coverage interval.
        constraints: must be strictly after coverage_start
      - name: state
        type: enum
        source: computed
        description: Hold lifecycle; RELEASED returns funds, FORFEITED debits them permanently.
        default: ACTIVE
        constraints: one of ACTIVE, RELEASED, FORFEITED
      - name: auto_created
        type: boolean
        source: system
        description: True when a posture cascade minted the row rather than POST /disbursement-holds.
        default: false
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyInvestigator who created the row through POST /disbursement-holds; null for cascade-minted rows. The §1.4 priority-60 segregation check compares a release or forfeit caller against this value.
        default: null
      - name: released_at
        type: datetime
        source: system
        description: Logical clock reading when the hold left ACTIVE; null while ACTIVE.
        default: null
      - name: release_reason
        type: enum
        source: input
        description: Why the hold left ACTIVE. Callers may only pass INVESTIGATION_CLOSED or MANUAL; cascades write APPEAL_GRANTED or SUPERSEDED_BY_FULL_HOLD.
        default: null
        constraints: null, INVESTIGATION_CLOSED, MANUAL, APPEAL_GRANTED, or SUPERSEDED_BY_FULL_HOLD
      - name: forfeited_amount_cents
        type: integer
        source: computed
        description: Cents permanently debited when the hold was forfeited; 0 while ACTIVE or RELEASED.
        default: 0
        constraints: ">= 0"

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: system
        description: FK -> Seller.id; recipient of the notice.
      - name: template_code
        type: enum
        source: system
        description: Which transparency notice this is.
        constraints: one of REGISTRATION_FLAGGED, HEALTH_BREACH, ACTION_ISSUED, POA_DECISION, APPEAL_DECISION, ESCALATION_DECISION, FUNDS_HELD, FUNDS_RELEASED, ACCOUNT_BANNED
      - name: related_entity_type
        type: enum
        source: system
        description: Type of the row this notice is about; with related_entity_id it forms a polymorphic pointer (deliberately not a declared FK).
        constraints: one of SELLER, HEALTH_EVALUATION, ENFORCEMENT_ACTION, PLAN_OF_ACTION, APPEAL, DISBURSEMENT_HOLD, RELATED_ACCOUNT_LINK
      - name: related_entity_id
        type: string
        source: system
        description: id of the row named by related_entity_type; resolve through that type's own read endpoint.
      - name: policy_rule_code
        type: string
        source: system
        description: PolicyRule.code disclosed to the seller; required non-null on ACTION_ISSUED notices, null elsewhere unless the source row carries a rule.
        default: null
      - name: severity_points_disclosed
        type: number
        source: system
        description: severity_points_applied disclosed to the seller; required non-null on ACTION_ISSUED notices.
        default: null
        constraints: 2 decimal places when non-null
      - name: appeal_deadline_at
        type: datetime
        source: system
        description: Copy of EnforcementAction.appeal_deadline_at; required non-null on ACTION_ISSUED notices.
        default: null
      - name: escalation_deadline_at
        type: datetime
        source: system
        description: Copy of Appeal.escalation_deadline_at; required non-null on APPEAL_DECISION notices whose outcome was a denial.
        default: null
      - name: amount_cents
        type: integer
        source: system
        description: Cents held or released; required non-null on FUNDS_HELD and FUNDS_RELEASED notices.
        default: null
      - name: decision_rationale
        type: string
        source: system
        description: Verbatim copy of the reviewer or officer rationale; required non-null on POA_DECISION, APPEAL_DECISION and ESCALATION_DECISION notices.
        default: null
      - name: evidence_reference
        type: string
        source: system
        description: Copy of Violation.evidence_reference; required non-null on ACTION_ISSUED notices.
        default: null
      - name: state
        type: enum
        source: computed
        description: SENT until a newer notice with the same template_code and related_entity_id supersedes it.
        default: SENT
        constraints: one of SENT, SUPERSEDED
      - name: sent_at
        type: datetime
        source: system
        description: Logical clock reading when the notice was emitted.

  - name: RelatedAccountLink
    parent: null
    common_fields: true
    fields:
      - name: candidate_seller_id
        type: string
        source: system
        description: FK -> Seller.id; the newly registered seller whose signals matched.
      - name: matched_seller_id
        type: string
        source: system
        description: FK -> Seller.id; the pre-existing seller that was matched.
      - name: matched_signals
        type: array
        source: system
        description: "Matched signal names in this fixed order: TAX_ID, BANK_TOKEN, ADDRESS, EMAIL_DOMAIN, DEVICE."
        constraints: 1..5 elements
      - name: confidence_score
        type: number
        source: computed
        description: Weighted signal score (calculations.related_account_confidence_score), capped at 1.00.
        constraints: 2 decimal places, 0.00..1.00
      - name: matched_seller_state_at_detection
        type: enum
        source: system
        description: matched seller's enforcement_state snapshotted at detection; drives whether the candidate is put on the watchlist.
        constraints: one of ACTIVE, WATCHLIST, RESTRICTED, SUSPENDED, BANNED
      - name: state
        type: enum
        source: computed
        description: Adjudication lifecycle of the link.
        default: DETECTED
        constraints: one of DETECTED, CONFIRMED, DISMISSED
      - name: detected_at
        type: datetime
        source: system
        description: Logical clock reading when registration minted the link.
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who adjudicated the link; null while DETECTED.
        default: null
      - name: adjudication_note
        type: string
        source: input
        description: Officer note stored at adjudication; disclosed in the ACCOUNT_BANNED notice when the link is confirmed.
        default: null

# ============================================================================
# §1.2 State Machine Table
# Seller carries TWO independent dimensions (parallel shape): `enforcement_state`
# and `disbursement_state`. Each is declared as its own machine below and is
# identified by `state_field:`.
# ============================================================================

state_machines:

  - entity: Seller
    state_field: enforcement_state
    initial_state: ACTIVE
    terminal_states: [BANNED]
    transitions:
      - from: ACTIVE
        to: WATCHLIST
        trigger: "POST /sellers — registration matched a banned or suspended seller"
        actor: system
        preconditions:
          - "the highest-scoring RelatedAccountLink minted by this registration has confidence_score >= RELATED_LINK_WATCH_SCORE"
          - "that link's matched_seller_state_at_detection IN {BANNED, SUSPENDED}"
        side_effects:
          - "sets registration_risk_flag true and root_seller_id to that link's matched_seller_id"
          - "calculations.enforcement_state_target returns WATCHLIST because registration_risk_flag is true"
          - "because enforcement_state became WATCHLIST, calculations.disbursement_state_target returns RESERVE_HELD and the disbursement machine moves NORMAL -> RESERVE_HELD"
          - "emits Notification(template_code REGISTRATION_FLAGGED, related_entity_type RELATED_ACCOUNT_LINK, related_entity_id = link id)"
      - from: [ACTIVE, WATCHLIST, RESTRICTED]
        to: WATCHLIST
        trigger: "POST /enforcement-actions or POST /appeals/{id}/decide or POST /appeals/{id}/escalation-decision — posture recompute lands on WATCHLIST"
        actor: system
        preconditions:
          - "ban_reason IS NULL"
          - "calculations.enforcement_state_target == WATCHLIST (0.00 < severity_points_balance < LADDER_RESTRICT_POINTS, or balance 0.00 with registration_risk_flag true)"
        side_effects:
          - "recomputes severity_points_balance first, then enforcement_state, then disbursement_state (fixed order)"
          - "because enforcement_state is WATCHLIST, disbursement_state_target is RESERVE_HELD"
      - from: [ACTIVE, WATCHLIST, RESTRICTED]
        to: RESTRICTED
        trigger: "POST /enforcement-actions — posture recompute lands on RESTRICTED"
        actor: system
        preconditions:
          - "ban_reason IS NULL"
          - "calculations.enforcement_state_target == RESTRICTED (LADDER_RESTRICT_POINTS <= severity_points_balance < LADDER_SUSPEND_POINTS and no non-vacated ACCOUNT_SUSPENSION action exists)"
        side_effects:
          - "because enforcement_state is RESTRICTED, disbursement_state_target is RESERVE_HELD"
      - from: [ACTIVE, WATCHLIST, RESTRICTED]
        to: SUSPENDED
        trigger: "POST /enforcement-actions — issued action_type is ACCOUNT_SUSPENSION"
        actor: system
        preconditions:
          - "ban_reason IS NULL"
          - "calculations.enforcement_state_target == SUSPENDED (severity_points_balance >= LADDER_SUSPEND_POINTS, or a non-vacated action with action_type ACCOUNT_SUSPENSION exists)"
        side_effects:
          - "every Listing of the seller in state ACTIVE moves to SUPPRESSED with suppressed_by_suspension true"
          - "because enforcement_state became SUSPENDED, calculations.disbursement_state_target returns FULL_HOLD and the disbursement machine moves to FULL_HOLD"
          - "because disbursement_state entered FULL_HOLD, every DisbursementHold of the seller in state ACTIVE is RELEASED with release_reason SUPERSEDED_BY_FULL_HOLD (held_balance_cents -> available_balance_cents) and then one DisbursementHold(hold_type FULL_HOLD, reserve_basis NONE, auto_created true) is created"
          - "because the FULL_HOLD row was created, held_amount_cents = the seller's available_balance_cents at that instant, available_balance_cents becomes 0 and held_balance_cents becomes that amount"
          - "emits Notification(template_code FUNDS_HELD, related_entity_type DISBURSEMENT_HOLD, amount_cents = held_amount_cents)"
      - from: [SUSPENDED, RESTRICTED, WATCHLIST]
        to: ACTIVE
        trigger: "POST /appeals/{id}/decide (GRANTED) or POST /appeals/{id}/escalation-decision (GRANTED_ON_ESCALATION) — vacating the action empties the balance"
        actor: system
        preconditions:
          - "ban_reason IS NULL"
          - "calculations.enforcement_state_target == ACTIVE (severity_points_balance == 0.00 and registration_risk_flag is false)"
        side_effects:
          - "every Listing of the seller with suppressed_by_suspension true returns to ACTIVE and suppressed_by_suspension becomes false (conditional cascade: listings in REMOVED are untouched)"
          - "because enforcement_state left SUSPENDED, calculations.disbursement_state_target is recomputed and the disbursement machine moves FULL_HOLD -> NORMAL or FULL_HOLD -> RESERVE_HELD"
      - from: SUSPENDED
        to: [RESTRICTED, WATCHLIST]
        trigger: "POST /appeals/{id}/decide (GRANTED) — vacating one action leaves residual points"
        actor: system
        preconditions:
          - "ban_reason IS NULL"
          - "calculations.enforcement_state_target IN {RESTRICTED, WATCHLIST} after the vacate"
        side_effects:
          - "listings with suppressed_by_suspension true return to ACTIVE"
          - "reinstated_count increments by 1 because the vacated action_type was ACCOUNT_SUSPENSION"
          - "because enforcement_state left SUSPENDED, disbursement_state_target becomes RESERVE_HELD and every ACTIVE DisbursementHold is RELEASED with release_reason APPEAL_GRANTED"
      - from: SUSPENDED
        to: BANNED
        trigger: "POST /appeals/{id}/escalation-decision (FINAL_DENIED) against an ACCOUNT_SUSPENSION action"
        actor: system
        preconditions:
          - "the appealed EnforcementAction.action_type == ACCOUNT_SUSPENSION"
        side_effects:
          - "sets ban_reason = ESCALATION_EXHAUSTED, which pins enforcement_state to BANNED permanently"
          - "every Listing of the seller in state ACTIVE or SUPPRESSED moves to REMOVED"
          - "because enforcement_state became BANNED, disbursement_state stays FULL_HOLD and the existing auto FULL_HOLD row is left ACTIVE"
          - "emits Notification(template_code ACCOUNT_BANNED, related_entity_type APPEAL)"
      - from: [ACTIVE, WATCHLIST, RESTRICTED, SUSPENDED]
        to: BANNED
        trigger: "POST /related-account-links/{id}/adjudicate (CONFIRMED)"
        actor: system
        preconditions:
          - "the adjudicated RelatedAccountLink.candidate_seller_id == this seller's id"
        side_effects:
          - "sets ban_reason = RELATED_ACCOUNT_CONFIRMED, which pins enforcement_state to BANNED"
          - "every Listing of the seller in state ACTIVE or SUPPRESSED moves to REMOVED"
          - "because enforcement_state became BANNED, calculations.disbursement_state_target returns FULL_HOLD and the disbursement machine moves to FULL_HOLD"
          - "because disbursement_state entered FULL_HOLD, ACTIVE holds are RELEASED with release_reason SUPERSEDED_BY_FULL_HOLD and one auto FULL_HOLD row is created"
          - "because the FULL_HOLD row was created, available_balance_cents becomes 0 and held_balance_cents becomes the swept amount"
          - "emits Notification(template_code ACCOUNT_BANNED, related_entity_type RELATED_ACCOUNT_LINK) and Notification(template_code FUNDS_HELD)"
        note: "BANNED is absorbing — no transition leaves it, and every write endpoint except the GETs rejects a BANNED seller with ERR_SELLER_BANNED."

  - entity: Seller
    state_field: disbursement_state
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: RESERVE_HELD
        trigger: "POST /violations/{id}/open-investigation, POST /enforcement-actions, POST /sellers (risk flag), or POST /sellers/{id}/health-evaluations (auto violation)"
        actor: system
        preconditions:
          - "calculations.disbursement_state_target == RESERVE_HELD (enforcement_state IN {WATCHLIST, RESTRICTED} OR a Violation of this seller is in state UNDER_INVESTIGATION)"
        side_effects:
          - "no funds move: RESERVE_HELD is a posture that gates disbursement and authorises POST /disbursement-holds; reserve rows are created explicitly by investigators"
      - from: RESERVE_HELD
        to: NORMAL
        trigger: "POST /violations/{id}/adjudicate or POST /appeals/{id}/decide — the last gating condition disappears"
        actor: system
        preconditions:
          - "calculations.disbursement_state_target == NORMAL (enforcement_state == ACTIVE and no Violation of this seller is in state UNDER_INVESTIGATION)"
        side_effects:
          - "every DisbursementHold of this seller in state ACTIVE is RELEASED with release_reason INVESTIGATION_CLOSED, moving held_amount_cents from held_balance_cents back to available_balance_cents"
          - "emits Notification(template_code FUNDS_RELEASED) per released hold"
      - from: [NORMAL, RESERVE_HELD]
        to: FULL_HOLD
        trigger: "POST /enforcement-actions (ACCOUNT_SUSPENSION) or POST /related-account-links/{id}/adjudicate (CONFIRMED)"
        actor: system
        preconditions:
          - "calculations.disbursement_state_target == FULL_HOLD (enforcement_state IN {SUSPENDED, BANNED})"
        side_effects:
          - "step 1: every ACTIVE DisbursementHold is RELEASED with release_reason SUPERSEDED_BY_FULL_HOLD (held -> available)"
          - "step 2: a DisbursementHold(hold_type FULL_HOLD, reserve_basis NONE, risk_tier = calculations.risk_tier, auto_created true, coverage_start = clock_now, coverage_end = clock_now + FULL_HOLD_COVERAGE_DAYS (90 days)) is created with held_amount_cents = available_balance_cents after step 1"
          - "step 3: available_balance_cents becomes 0 and held_balance_cents becomes held_amount_cents; lifetime_credited_cents and lifetime_debited_cents are untouched"
          - "emits Notification(template_code FUNDS_HELD, amount_cents = held_amount_cents)"
        note: "Steps 1-3 run in this fixed order so that the funds invariant available + held == lifetime_credited - lifetime_debited holds after every step."
      - from: FULL_HOLD
        to: [NORMAL, RESERVE_HELD]
        trigger: "POST /appeals/{id}/decide (GRANTED) or POST /appeals/{id}/escalation-decision (GRANTED_ON_ESCALATION) vacating the suspension"
        actor: system
        preconditions:
          - "calculations.disbursement_state_target != FULL_HOLD (enforcement_state left {SUSPENDED, BANNED})"
        side_effects:
          - "every ACTIVE DisbursementHold of this seller is RELEASED with release_reason APPEAL_GRANTED; held_amount_cents returns from held_balance_cents to available_balance_cents"
          - "emits Notification(template_code FUNDS_RELEASED, amount_cents = released total)"

  - entity: Listing
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUPPRESSED
        trigger: "POST /enforcement-actions — issued action_type is ACCOUNT_SUSPENSION"
        actor: system
        preconditions:
          - "the listing's seller_id == the suspended seller's id"
        side_effects:
          - "sets suppressed_by_suspension true so a later reinstatement can tell suppression apart from removal"
      - from: [ACTIVE, SUPPRESSED]
        to: REMOVED
        trigger: "POST /enforcement-actions — issued action_type is LISTING_REMOVAL, or the seller became BANNED"
        actor: system
        preconditions:
          - "for removal_scope LISTING: the listing id equals the cited Violation.listing_id"
          - "for removal_scope ACCOUNT: the listing belongs to the seller and is in state ACTIVE or SUPPRESSED"
        side_effects:
          - "sets removal_policy_category to the action's policy_category and suppressed_by_suspension false"
          - "increments the issuing EnforcementAction.removed_listing_count"
      - from: SUPPRESSED
        to: ACTIVE
        trigger: "POST /appeals/{id}/decide (GRANTED) or POST /appeals/{id}/escalation-decision (GRANTED_ON_ESCALATION) — the seller leaves SUSPENDED"
        actor: system
        preconditions:
          - "suppressed_by_suspension is true"
        side_effects:
          - "clears suppressed_by_suspension"
      - from: REMOVED
        to: ACTIVE
        trigger: "POST /listings/{id}/relist"
        actor: Seller
        preconditions:
          - "the acting Seller's X-User-ID == listing.seller_id"
          - "seller.enforcement_state IN {ACTIVE, WATCHLIST} — this is a cross-entity guard on the parent Seller"
          - "removal_policy_category != RESTRICTED_PRODUCT"
        side_effects:
          - "clears removal_policy_category"
        note: "Cross-entity state dependency: the same request succeeds or fails purely on the parent Seller's enforcement_state."

  - entity: Violation
    initial_state: REPORTED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /violations/{id}/open-investigation"
        actor: PolicyInvestigator
        preconditions:
          - "state == REPORTED"
          - "seller.ban_reason IS NULL"
        side_effects:
          - "because a Violation of this seller entered UNDER_INVESTIGATION, calculations.disbursement_state_target returns RESERVE_HELD and the seller's disbursement machine moves NORMAL -> RESERVE_HELD"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /violations/{id}/adjudicate with outcome SUBSTANTIATED"
        actor: PolicyInvestigator
        preconditions:
          - "state == UNDER_INVESTIGATION"
        side_effects:
          - "sets adjudicated_at to the logical clock reading and stores decision_note"
          - "recomputes disbursement_state_target: with no remaining UNDER_INVESTIGATION violation and enforcement_state ACTIVE the seller returns to NORMAL, releasing ACTIVE holds with release_reason INVESTIGATION_CLOSED"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /violations/{id}/adjudicate with outcome DISMISSED"
        actor: PolicyInvestigator
        preconditions:
          - "state == UNDER_INVESTIGATION"
        side_effects:
          - "sets adjudicated_at and decision_note; no EnforcementAction may ever be issued for this violation"
          - "recomputes disbursement_state_target exactly as the SUBSTANTIATED branch does"
        note: "Branching fork: the two outcomes carry different side-effect sets — only SUBSTANTIATED leaves the violation enforceable."
      - from: null
        to: UNDER_INVESTIGATION
        trigger: "POST /sellers/{id}/health-evaluations — the evaluation's metric_tier is BREACHING"
        actor: system
        preconditions:
          - "metric_tier == BREACHING"
          - "at least one PolicyRule with category SHIPPING_PERFORMANCE and removal_scope ACCOUNT exists"
        side_effects:
          - "creates Violation(auto_generated true, state UNDER_INVESTIGATION, reporter_type PLATFORM_AUTOMATION, listing_id null, evidence_reference = 'HEALTH-EVAL-' + evaluation id, policy_rule_id = the selected rule) and writes its id into HealthEvaluation.auto_violation_id"
          - "because that Violation is UNDER_INVESTIGATION, the seller's disbursement machine moves NORMAL -> RESERVE_HELD"
          - "emits Notification(template_code HEALTH_BREACH, related_entity_type HEALTH_EVALUATION)"
        note: "Rule selector — candidate set: PolicyRule rows with category == SHIPPING_PERFORMANCE AND removal_scope == ACCOUNT; ranking: base_severity_weight DESC; tie-break: created_at ASC; empty-pool fallback: no violation is created and auto_violation_id stays null (the evaluation still returns 201)."

  - entity: EnforcementAction
    initial_state: ISSUED
    terminal_states: [VACATED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /enforcement-actions"
        actor: PolicyInvestigator
        preconditions:
          - "the cited Violation is in state SUBSTANTIATED"
          - "no non-vacated EnforcementAction already cites that Violation"
          - "if the cited PolicyRule.requires_poa is true, the seller has no PlanOfAction in state SUBMITTED or RETURNED_FOR_REVISION"
        side_effects:
          - "snapshots policy_category, policy_rule_code and decay_exempt from the cited PolicyRule so later rule edits cannot rewrite history"
          - "sets severity_points_applied from calculations.severity_points_applied and ladder_rung_computed from calculations.enforcement_ladder_rung"
          - "sets action_type from ladder_rung_computed unless action_type_override was supplied; the override is accepted only when it is strictly more severe on the ordering WARNING < LISTING_REMOVAL < ACCOUNT_SUSPENSION (else ERR_OVERRIDE_NOT_MORE_SEVERE) and then override_applied becomes true"
          - "sets appeal_deadline_at = issued_at + APPEAL_WINDOW_DAYS"
          - "because a new non-vacated action exists, seller.severity_points_balance is recomputed, then seller.enforcement_state, then seller.disbursement_state (fixed order)"
          - "if action_type == LISTING_REMOVAL, the listings in scope move to REMOVED and removed_listing_count is set"
          - "if action_type == ACCOUNT_SUSPENSION, the seller's SUSPENDED cascade runs (listing suppression, FULL_HOLD, funds sweep)"
          - "emits Notification(template_code ACTION_ISSUED) carrying policy_rule_code, severity_points_disclosed, appeal_deadline_at and decision_rationale"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /enforcement-actions/{id}/acknowledge"
        actor: Seller
        preconditions:
          - "the acting Seller's X-User-ID == the action's seller_id"
          - "state == ISSUED"
        side_effects:
          - "records acknowledged_at; acknowledgement does not stop the appeal clock"
      - from: [ISSUED, ACKNOWLEDGED]
        to: UPHELD
        trigger: "POST /appeals/{id}/decide (DENIED) or POST /appeals/{id}/escalation-decision (FINAL_DENIED)"
        actor: system
        preconditions:
          - "an Appeal against this action reached a denial outcome"
        side_effects:
          - "sets resolution_reason to APPEAL_DENIED (first-level denial) or ESCALATION_DENIED (escalation denial)"
          - "severity_points_applied keeps counting toward the balance — no recompute is needed because nothing left the input set"
      - from: [ISSUED, ACKNOWLEDGED]
        to: VACATED
        trigger: "POST /appeals/{id}/decide (GRANTED) or POST /appeals/{id}/escalation-decision (GRANTED_ON_ESCALATION)"
        actor: system
        preconditions:
          - "an Appeal against this action was granted"
        side_effects:
          - "sets resolution_reason = APPEAL_GRANTED for a first-level grant, ESCALATION_GRANTED for an escalation grant"
          - "because a VACATED action leaves the severity input set, seller.severity_points_balance is recomputed downward (compensating invariant)"
          - "because the balance fell, seller.enforcement_state is recomputed and may walk back down the ladder, which in turn recomputes disbursement_state"
          - "if action_type was ACCOUNT_SUSPENSION, seller.reinstated_count increments and every listing with suppressed_by_suspension true returns to ACTIVE"
      - from: UPHELD
        to: VACATED
        trigger: "POST /appeals/{id}/escalation-decision (GRANTED_ON_ESCALATION)"
        actor: system
        preconditions:
          - "the Appeal against this action is in state ESCALATED_REVIEW and the escalation outcome is GRANTED_ON_ESCALATION"
          - "calculations.repeat_offense_count < APPEAL_REPEAT_DENIAL_THRESHOLD (else ERR_REPEAT_OFFENSE_DENIAL)"
        side_effects:
          - "sets resolution_reason = ESCALATION_GRANTED and runs the same reinstatement cascade as the ISSUED/ACKNOWLEDGED -> VACATED edge"
        note: "This is the only edge that leaves UPHELD: the second-level review can reopen a denial, so UPHELD is NOT a terminal state while VACATED is. Terminal-state lockdown: from VACATED, acknowledge returns ERR_ACTION_NOT_APPEALABLE_STATE and a second appeal returns ERR_APPEAL_ALREADY_EXISTS; from UPHELD the same two calls are refused for the same reasons and only the escalation grant may move the row."

  - entity: PlanOfAction
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /plans-of-action"
        actor: Seller
        preconditions:
          - "the cited EnforcementAction.seller_id == the acting Seller's X-User-ID"
          - "the cited action's PolicyRule snapshot has requires_poa true"
          - "the cited action is in state ISSUED or ACKNOWLEDGED"
          - "expected_enforcement_action_version matches the action's current version"
          - "no PlanOfAction for that action is currently in state SUBMITTED"
        side_effects:
          - "sets revision_count = the superseded RETURNED_FOR_REVISION plan's revision_count + 1, or 0 when this is the first plan for the action"
          - "sets submitted_at to the logical clock reading and deadline_at = the cited action's issued_at + POA_DEADLINE_DAYS"
          - "increments the parent EnforcementAction.version"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /plans-of-action/{id}/review with decision RETURN"
        actor: ComplianceOfficer
        preconditions:
          - "state == SUBMITTED"
          - "revision_count < POA_MAX_REVISIONS"
          - "the reviewing ComplianceOfficer X-User-ID differs from the appealed action's issued_by_user_id (segregation of duties)"
        side_effects:
          - "stores reviewed_by_user_id and review_notes"
          - "emits Notification(template_code POA_DECISION, decision_rationale = review_notes)"
      - from: RETURNED_FOR_REVISION
        to: SUPERSEDED
        trigger: "POST /plans-of-action — the seller submits the next revision for the same action"
        actor: system
        preconditions:
          - "a newer PlanOfAction row for the same enforcement_action_id was accepted for creation"
        side_effects:
          - "the older row moves to SUPERSEDED and the new row's revision_count is one higher"
        note: "Cyclic shape: SUBMITTED -> RETURNED_FOR_REVISION -> (new SUBMITTED) may loop up to POA_MAX_REVISIONS times; the POA_MAX_REVISIONS+1-th return attempt is rejected with ERR_POA_REVISION_LIMIT."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /plans-of-action/{id}/review with decision ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "state == SUBMITTED"
          - "root_cause, corrective_measures and preventive_measures satisfy their §1.1 constraints (else ERR_POA_INCOMPLETE)"
          - "the reviewing ComplianceOfficer X-User-ID differs from the appealed action's issued_by_user_id (segregation of duties)"
        side_effects:
          - "stores reviewed_by_user_id and review_notes"
          - "an accepted plan is a precondition for any Appeal against the same action when the rule requires a POA"
          - "emits Notification(template_code POA_DECISION)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plans-of-action/{id}/review with decision REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "stores reviewed_by_user_id and review_notes"
          - "a rejected plan can never satisfy the appeal precondition, and no further revision is accepted for that action"
          - "emits Notification(template_code POA_DECISION)"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, FINAL_DENIED, GRANTED_ON_ESCALATION]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /appeals"
        actor: Seller
        preconditions:
          - "the cited EnforcementAction.seller_id == the acting Seller's X-User-ID"
          - "the action is in state ISSUED or ACKNOWLEDGED"
          - "the logical clock reading is <= action.appeal_deadline_at"
          - "if the action's snapshotted rule requires_poa is true, a PlanOfAction for that action is in state ACCEPTED"
          - "no Appeal for that action exists in any state"
        side_effects:
          - "stores grounds and, when the rule requires a plan, plan_of_action_id"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/start-review"
        actor: AppealReviewer
        preconditions:
          - "state == SUBMITTED"
          - "the reviewing X-User-ID is not the user who issued the appealed action"
        side_effects:
          - "no field beyond state and updated_at changes; only an UNDER_REVIEW appeal may be decided"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /appeals/{id}/decide with outcome GRANTED"
        actor: AppealReviewer
        preconditions:
          - "state == UNDER_REVIEW"
          - "the deciding X-User-ID is not the user who issued the appealed action"
          - "calculations.repeat_offense_count < APPEAL_REPEAT_DENIAL_THRESHOLD — at or above the threshold the grant is refused with ERR_REPEAT_OFFENSE_DENIAL"
        side_effects:
          - "sets decided_by_user_id, decided_at and rationale; reinstatement_granted becomes true exactly when the appealed action_type was ACCOUNT_SUSPENSION"
          - "because the appeal was granted, the appealed EnforcementAction moves to VACATED and the full reinstatement cascade runs (balance -> enforcement_state -> disbursement_state -> holds -> listings)"
          - "emits Notification(template_code APPEAL_DECISION, decision_rationale = rationale)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{id}/decide with outcome DENIED"
        actor: AppealReviewer
        preconditions:
          - "state == UNDER_REVIEW"
          - "denial_reason is supplied"
        side_effects:
          - "sets escalation_deadline_at = decided_at + ESCALATION_WINDOW_DAYS"
          - "the appealed action moves to UPHELD with resolution_reason APPEAL_DENIED"
          - "if the seller was SUSPENDED it stays SUSPENDED and the FULL_HOLD stays in force"
          - "emits Notification(template_code APPEAL_DECISION, decision_rationale = denial_reason, escalation_deadline_at set)"
        note: "Branch point: GRANTED is terminal, DENIED is not — DENIED is the only state from which escalation is reachable."
      - from: DENIED
        to: ESCALATED_REVIEW
        trigger: "POST /appeals/{id}/escalate"
        actor: Seller
        preconditions:
          - "state == DENIED"
          - "the acting Seller's X-User-ID == the appealed action's seller_id"
          - "the logical clock reading is <= escalation_deadline_at"
        side_effects:
          - "records escalation_requested_at and escalation_grounds; the appealed action stays UPHELD until the escalation is decided"
      - from: ESCALATED_REVIEW
        to: GRANTED_ON_ESCALATION
        trigger: "POST /appeals/{id}/escalation-decision with outcome GRANTED_ON_ESCALATION"
        actor: ComplianceOfficer
        preconditions:
          - "state == ESCALATED_REVIEW"
          - "escalation_decided_by_user_id differs from both decided_by_user_id and the action's issued_by_user_id"
        side_effects:
          - "reinstatement_granted becomes true exactly when the appealed action_type was ACCOUNT_SUSPENSION"
          - "because the escalation was granted, the appealed EnforcementAction leaves UPHELD for VACATED — the only path that reopens a terminal-looking action"
          - "the full reinstatement cascade runs and reinstated_count increments when the vacated action_type was ACCOUNT_SUSPENSION"
          - "emits Notification(template_code ESCALATION_DECISION)"
      - from: ESCALATED_REVIEW
        to: FINAL_DENIED
        trigger: "POST /appeals/{id}/escalation-decision with outcome FINAL_DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "state == ESCALATED_REVIEW"
        side_effects:
          - "sets resolution_reason ESCALATION_DENIED on the action (it stays UPHELD)"
          - "if the action_type was ACCOUNT_SUSPENSION, the seller's ban_reason becomes ESCALATION_EXHAUSTED and enforcement_state moves to BANNED with the full ban cascade"
          - "emits Notification(template_code ESCALATION_DECISION) and, when the ban fires, Notification(template_code ACCOUNT_BANNED)"

  - entity: DisbursementHold
    initial_state: ACTIVE
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /disbursement-holds (explicit) or the FULL_HOLD cascade (automatic)"
        actor: PolicyInvestigator
        preconditions:
          - "seller.disbursement_state != NORMAL for an explicit RESERVE row"
          - "expected_seller_version matches seller.version for an explicit row"
          - "the requested held_amount_cents plus the sum of held_amount_cents over the seller's ACTIVE holds must not exceed available_balance_cents + that sum"
          - "coverage_start < coverage_end, and the closed interval [coverage_start, coverage_end] must be separated from every other ACTIVE hold of the same seller by more than HOLD_BUFFER_HOURS (else ERR_HOLD_COVERAGE_OVERLAP)"
        side_effects:
          - "moves held_amount_cents from seller.available_balance_cents into seller.held_balance_cents"
          - "increments seller.version"
          - "emits Notification(template_code FUNDS_HELD, amount_cents = held_amount_cents)"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /disbursement-holds/{id}/release, or automatically when the seller's disbursement posture relaxes"
        actor: ComplianceOfficer
        preconditions:
          - "state == ACTIVE"
          - "for the manual release: the releasing X-User-ID is not the user who created the hold"
          - "for the manual release: hold_type == RESERVE (a FULL_HOLD row can only be released by the appeal cascade, else ERR_HOLD_NOT_MANUALLY_RELEASABLE)"
        side_effects:
          - "stores release_reason (MANUAL, INVESTIGATION_CLOSED, APPEAL_GRANTED or SUPERSEDED_BY_FULL_HOLD) and released_at"
          - "moves held_amount_cents from seller.held_balance_cents back to seller.available_balance_cents"
          - "emits Notification(template_code FUNDS_RELEASED, amount_cents = held_amount_cents)"
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /disbursement-holds/{id}/forfeit"
        actor: ComplianceOfficer
        preconditions:
          - "state == ACTIVE"
          - "seller.enforcement_state == BANNED"
          - "forfeited_amount_cents <= held_amount_cents"
        side_effects:
          - "removes forfeited_amount_cents from seller.held_balance_cents and adds it to seller.lifetime_debited_cents so that available + held == lifetime_credited - lifetime_debited still holds"
          - "any residue (held_amount_cents - forfeited_amount_cents) returns to seller.available_balance_cents"
        note: "Compensating invariant: forfeiture is the only operation that debits lifetime_debited_cents, and it must leave the funds identity intact."

  - entity: RelatedAccountLink
    initial_state: DETECTED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: null
        to: DETECTED
        trigger: "POST /sellers — registration signals match an existing seller"
        actor: system
        preconditions:
          - "calculations.related_account_confidence_score for the candidate/incumbent pair is >= RELATED_LINK_MIN_SCORE"
        side_effects:
          - "snapshots matched_signals and matched_seller_state_at_detection at detection time so later state changes cannot rewrite the evidence"
          - "if the top link's score >= RELATED_LINK_WATCH_SCORE and matched_seller_state_at_detection IN {BANNED, SUSPENDED}, the candidate's enforcement_state becomes WATCHLIST"
      - from: DETECTED
        to: CONFIRMED
        trigger: "POST /related-account-links/{id}/adjudicate with decision CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "state == DETECTED"
          - "matched_seller_state_at_detection == BANNED — a link to a merely suspended seller cannot be confirmed (ERR_LINK_MATCH_NOT_BANNED)"
          - "the adjudicating X-User-ID differs from the candidate seller's own user id"
        side_effects:
          - "because the link is confirmed, candidate.ban_reason becomes RELATED_ACCOUNT_CONFIRMED and enforcement_state becomes BANNED"
          - "because the candidate became BANNED, its ACTIVE and SUPPRESSED listings move to REMOVED"
          - "because the candidate became BANNED, disbursement_state moves to FULL_HOLD, ACTIVE holds are RELEASED as SUPERSEDED_BY_FULL_HOLD and one auto FULL_HOLD row sweeps the available balance"
          - "emits Notification(template_code ACCOUNT_BANNED) and Notification(template_code FUNDS_HELD)"
      - from: DETECTED
        to: DISMISSED
        trigger: "POST /related-account-links/{id}/adjudicate with decision DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "state == DETECTED"
        side_effects:
          - "if no other DETECTED or CONFIRMED link points at this candidate, registration_risk_flag is cleared and enforcement_state is recomputed (WATCHLIST -> ACTIVE when the balance is 0.00), which relaxes disbursement_state"

  - entity: Notification
    initial_state: SENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: SENT
        trigger: "any transition whose side_effects list an emitted Notification"
        actor: system
        preconditions:
          - "the emitting transition committed"
        side_effects:
          - "populates the transparency payload for the template_code: ACTION_ISSUED carries policy_rule_code, severity_points_disclosed and appeal_deadline_at; APPEAL_DECISION carries decision_rationale and (on denial) escalation_deadline_at; FUNDS_HELD and FUNDS_RELEASED carry amount_cents"
      - from: SENT
        to: SUPERSEDED
        trigger: "a later Notification with the same template_code and the same related_entity_type/related_entity_id pair is emitted"
        actor: system
        preconditions:
          - "an earlier SENT notification with the identical (seller_id, template_code, related_entity_type, related_entity_id) tuple exists"
        side_effects:
          - "the earlier row moves to SUPERSEDED; GET /sellers/{id}/notifications returns both, newest first, so the transparency trail is never destroyed"

# ============================================================================
# §1.2.1 Concurrency Rules
# Only true CREATE-with-supersede races appear here, each resolved by OCC on a
# parent entity's `version`. Every other write-write conflict in this domain is
# a state precondition and lives in §1.2 / §1.4.
# ============================================================================

concurrency_rules:
  - rule_id: hold-create-stale-seller
    parent_entity: Seller
    write_endpoint: "POST /disbursement-holds"
    occ_field: "expected_seller_version"
    description: |
      Creating a DisbursementHold against a Seller whose version has advanced
      since the client last read it is rejected. A new RESERVE hold is a
      legitimate operation whose computed held_amount_cents depends on the
      seller's available_balance_cents, risk_tier and disbursement_state at
      read time; if any of those moved (another hold was created or released,
      proceeds were credited, or a posture cascade ran), the amount the client
      believes it is reserving is no longer the amount the server would
      compute, so the stale writer is refused instead of silently reserving a
      different figure.
    error_id: ERR_STALE_SELLER_VERSION
    http_status: 412

  - rule_id: poa-create-stale-action
    parent_entity: EnforcementAction
    write_endpoint: "POST /plans-of-action"
    occ_field: "expected_enforcement_action_version"
    description: |
      Submitting a PlanOfAction against an EnforcementAction whose version has
      advanced since the seller last read it is rejected. A fresh submission
      legitimately supersedes the seller's prior RETURNED_FOR_REVISION plan
      (§1.2 PlanOfAction), so the operation cannot be refused on state alone;
      but if the action's version moved (it was acknowledged, a plan was
      reviewed, or the appeal outcome resolved it), the seller is answering a
      version of the action that no longer exists and is refused.
    error_id: ERR_STALE_ACTION_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. All rates are 4-decimal fractions (0.0125 == 1.25%).
# All point values and scores are 2-decimal. Every rounding step is HALF_UP.
# ============================================================================

calculations:

  - name: order_defect_rate
    trigger: "POST /sellers/{id}/health-evaluations, before health_score"
    algorithm: aggregation
    formula: |
      # input set S (see input_set below), latest = the row in S with the greatest
      # window_end (tie-break: created_at ASC)
      odr_provisional = round4((latest.defect_claims_pending + latest.defect_claims_substantiated)
                               / latest.order_volume)                      # 0.0000 when latest.order_volume == 0
      odr_final       = round4(sum(s.defect_claims_substantiated for s in S)
                               / sum(s.delivered_or_refunded_volume for s in S))   # 0.0000 when that denominator is 0
      odr_variant_delta = round4(odr_provisional - odr_final)
      # metric_tier, breached_metrics and health_score all read odr_final.
      # odr_provisional is disclosed for transparency and is what the seller
      # sees in the HEALTH_BREACH notification trail; it is never the tier input.
    input_set: |
      S = MetricSnapshot rows with seller_id == {id} AND window_end <= clock_now AND
      window_end > clock_now - EVAL_LOOKBACK_DAYS, ordered by window_end DESC
      (tie-break created_at ASC), truncated to the first EVAL_MAX_SNAPSHOTS rows.
      S is empty -> the whole request fails with ERR_NO_SNAPSHOTS_IN_WINDOW (422);
      no HealthEvaluation row is created.
    constants:
      EVAL_LOOKBACK_DAYS: 90
      EVAL_MAX_SNAPSHOTS: 2
    precision: "4 decimal places, round_half_up; the breach comparison uses the ROUNDED rate, so 20/2010 = 0.0099502 rounds to 0.0100 and does breach"
    variants:
      - name: PROVISIONAL
        when: "disclosed on every evaluation as odr_provisional"
        difference: "latest snapshot only; numerator counts pending AND substantiated claims; denominator is order_volume"
      - name: FINAL
        when: "drives breached_metrics, health_score and metric_tier"
        difference: "whole set S; numerator counts substantiated claims only; denominator is summed delivered_or_refunded_volume"

  - name: secondary_metric_rates
    trigger: "POST /sellers/{id}/health-evaluations, same input set S as order_defect_rate"
    algorithm: aggregation
    formula: |
      order_volume_final  = sum(s.order_volume for s in S)
      late_shipment_rate  = round4(sum(s.late_shipments for s in S) / order_volume_final)
      cancellation_rate   = round4(sum(s.pre_fulfillment_cancellations for s in S) / order_volume_final)
      shipments_total_sum = sum(s.shipments_total for s in S)
      valid_tracking_rate = round4(sum(s.shipments_with_valid_tracking for s in S) / shipments_total_sum)
                            if shipments_total_sum > 0 else 1.0000
      # order_volume_final == 0 -> late_shipment_rate = cancellation_rate = 0.0000
      # and metric_tier is EXEMPT (see metric_tier).
    input_set: "identical to calculations.order_defect_rate.input_set — one set S per evaluation, never re-derived per metric"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: health_score
    trigger: "POST /sellers/{id}/health-evaluations, after the four rates"
    algorithm: weighted_scoring
    formula: |
      # Each metric contributes a penalty proportional to how far it OVERSHOOTS its
      # policy threshold. A metric exactly AT its threshold contributes zero penalty
      # but still appears in breached_metrics (see metric_tier) — the score measures
      # overage, the tier measures crossing.
      ratio_odr   = min(max(odr_final - ODR_BREACH_RATE, 0) / ODR_BREACH_RATE, RATIO_CAP)
      ratio_late  = min(max(late_shipment_rate - LATE_SHIPMENT_BREACH_RATE, 0) / LATE_SHIPMENT_BREACH_RATE, RATIO_CAP)
      ratio_canc  = min(max(cancellation_rate - CANCELLATION_BREACH_RATE, 0) / CANCELLATION_BREACH_RATE, RATIO_CAP)
      ratio_track = min(max(VALID_TRACKING_MIN_RATE - valid_tracking_rate, 0) / VALID_TRACKING_MIN_RATE, RATIO_CAP)

      # PINNED EVALUATION ORDER — round EACH weighted penalty to 2 decimals FIRST,
      # then sum the four rounded penalties. The alternative reading (sum the four
      # unrounded penalties, round the total once) yields a health_score that
      # differs by 0.01 on many inputs and is WRONG.
      penalty_odr   = round2(HEALTH_WEIGHT_ODR         * ratio_odr)
      penalty_late  = round2(HEALTH_WEIGHT_LATE        * ratio_late)
      penalty_canc  = round2(HEALTH_WEIGHT_CANCELLATION* ratio_canc)
      penalty_track = round2(HEALTH_WEIGHT_TRACKING    * ratio_track)
      penalty_total = round2(penalty_odr + penalty_late + penalty_canc + penalty_track)
      health_score  = max(0.00, round2(100.00 - penalty_total))
      # order_volume_final == 0 -> all four ratios are 0 and health_score is 100.00
    input_set: "the four rates of this evaluation only; no other seller data participates"
    constants:
      ODR_BREACH_RATE: 0.0100
      LATE_SHIPMENT_BREACH_RATE: 0.0400
      CANCELLATION_BREACH_RATE: 0.0250
      VALID_TRACKING_MIN_RATE: 0.9500
      HEALTH_WEIGHT_ODR: 42.50
      HEALTH_WEIGHT_LATE: 24.50
      HEALTH_WEIGHT_CANCELLATION: 18.50
      HEALTH_WEIGHT_TRACKING: 14.50
      RATIO_CAP: 2.0000
    precision: "2 decimal places, round_half_up, applied per weighted penalty and once more to the total"

  - name: metric_tier
    trigger: "POST /sellers/{id}/health-evaluations, after health_score"
    algorithm: threshold
    formula: |
      breached_metrics = []                                    # fixed emission order
      if odr_final           >= ODR_BREACH_RATE:            breached_metrics += ORDER_DEFECT_RATE
      if late_shipment_rate  >= LATE_SHIPMENT_BREACH_RATE:  breached_metrics += LATE_SHIPMENT_RATE
      if cancellation_rate   >= CANCELLATION_BREACH_RATE:   breached_metrics += CANCELLATION_RATE
      if valid_tracking_rate <  VALID_TRACKING_MIN_RATE:    breached_metrics += VALID_TRACKING_RATE

      # evaluated top to bottom, first match wins
      if order_volume_final == 0:                                       metric_tier = EXEMPT
      elif len(breached_metrics) >= TIER_BREACH_METRIC_COUNT
           or health_score < TIER_BREACH_SCORE:                         metric_tier = BREACHING
      elif len(breached_metrics) >= 1 or health_score < TIER_AT_RISK_SCORE: metric_tier = AT_RISK
      else:                                                             metric_tier = HEALTHY
      # NOTE the asymmetry: the three "lower is better" metrics breach at >= their
      # threshold, valid tracking breaches at < its floor. A seller sitting exactly
      # ON the ODR threshold IS in breach; a seller sitting exactly ON the tracking
      # floor is NOT.
    input_set: "this evaluation's four rates, health_score and order_volume_final"
    constants:
      TIER_BREACH_METRIC_COUNT: 2
      TIER_BREACH_SCORE: 60.00
      TIER_AT_RISK_SCORE: 80.00
    precision: "comparisons on the 4-decimal rates and the 2-decimal health_score exactly as stored"

  - name: severity_points_applied
    trigger: "POST /enforcement-actions, before the ladder"
    algorithm: weighted_scoring
    formula: |
      # inputs: the cited PolicyRule, the cited Violation's reporter_type, the
      # seller's PRIOR action set, and the seller's latest metric_tier.
      prior_same_category = count(EnforcementAction a where a.seller_id == seller.id
                                  AND a.policy_category == rule.category
                                  AND a.state in (ISSUED, ACKNOWLEDGED, UPHELD))   # excludes VACATED and this action
      repeat_factor = 1.00 + REPEAT_STEP * min(prior_same_category, REPEAT_CAP_COUNT)
      raw = rule.base_severity_weight * repeat_factor
      if rule.category == INTELLECTUAL_PROPERTY and violation.reporter_type == RIGHTS_OWNER:
          raw = raw * IP_ESCALATION_MULTIPLIER
      if seller.metric_tier == BREACHING:
          raw = raw * BREACHING_ESCALATION_MULTIPLIER
      # PINNED: raw is carried at full precision through every multiplication and
      # rounded EXACTLY ONCE, here. Rounding after each factor drifts by 0.01.
      severity_points_applied = min(max(round2(raw), SEVERITY_MIN_POINTS), SEVERITY_MAX_POINTS)
    input_set: "EnforcementAction rows of the same seller in state ISSUED, ACKNOWLEDGED or UPHELD; VACATED rows never count toward repeat escalation"
    constants:
      REPEAT_STEP: 0.25
      REPEAT_CAP_COUNT: 3
      IP_ESCALATION_MULTIPLIER: 1.50
      BREACHING_ESCALATION_MULTIPLIER: 1.25
      SEVERITY_MIN_POINTS: 0.50
      SEVERITY_MAX_POINTS: 12.00
    precision: "2 decimal places, round_half_up, applied once to raw before the floor/cap clamp"

  - name: severity_points_balance
    trigger: "recomputed from scratch at the end of POST /enforcement-actions, POST /appeals/{id}/decide, POST /appeals/{id}/escalation-decision and POST /related-account-links/{id}/adjudicate"
    algorithm: decay_function
    formula: |
      balance = 0
      for a in input_set:
          age_days = floor((clock_now - a.issued_at) / 1 day)
          if a.decay_exempt:                      factor = 1.00     # IP and RESTRICTED_PRODUCT never decay
          elif age_days <  DECAY_TIER1_DAYS:      factor = DECAY_TIER1_FACTOR
          elif age_days <  DECAY_TIER2_DAYS:      factor = DECAY_TIER2_FACTOR
          else:                                   factor = DECAY_TIER3_FACTOR
          balance += a.severity_points_applied * factor            # full precision
      severity_points_balance = round2(balance)                    # single rounding at the end
      # Step decay, not continuous: an action 179 days old still counts in full and
      # the same action one day later counts half. The curve is anchored on
      # issued_at and is never reset by acknowledgement, appeal denial or a plan.
    input_set: "EnforcementAction rows of this seller in state ISSUED, ACKNOWLEDGED or UPHELD; VACATED rows leave the set, which is what makes reinstatement compensating"
    constants:
      DECAY_TIER1_DAYS: 180
      DECAY_TIER2_DAYS: 365
      DECAY_TIER1_FACTOR: 1.00
      DECAY_TIER2_FACTOR: 0.50
      DECAY_TIER3_FACTOR: 0.00
    precision: "2 decimal places, round_half_up, applied once to the summed products"

  - name: enforcement_ladder_rung
    trigger: "POST /enforcement-actions, immediately after severity_points_applied"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (the value is otherwise circular-looking: the rung
      # depends on the balance, the balance depends on this action's points, and
      # this action's repeat factor depends on the pre-existing action set):
      #   1. prior_balance = calculations.severity_points_balance over the action set
      #      that EXISTS BEFORE this issuance, decayed at clock_now.
      #   2. severity_points_applied = calculations.severity_points_applied, whose
      #      repeat_factor counts only those pre-existing actions.
      #   3. post_balance = round2(prior_balance + severity_points_applied)
      #      (this action's own decay factor is 1.00 because its age is 0 days).
      #   4. The rung is selected from post_balance — INCLUDING this action's points.
      #      Selecting from prior_balance is the wrong reading and yields a strictly
      #      milder rung on the same fixture.
      #   5. seller.severity_points_balance := post_balance.
      if   post_balance >= LADDER_SUSPEND_POINTS:  rung = ACCOUNT_SUSPENSION
      elif post_balance >= LADDER_RESTRICT_POINTS: rung = LISTING_REMOVAL
      else:                                        rung = WARNING
      # category floor: a RESTRICTED_PRODUCT action is never a bare warning
      if rule.category == RESTRICTED_PRODUCT and rung == WARNING: rung = LISTING_REMOVAL
      ladder_rung_computed = rung

      # action_type = ladder_rung_computed unless action_type_override was supplied.
      # severity order: WARNING < LISTING_REMOVAL < ACCOUNT_SUSPENSION. An override
      # is accepted only when strictly MORE severe than ladder_rung_computed, else
      # ERR_OVERRIDE_NOT_MORE_SEVERE. override_applied = (action_type != ladder_rung_computed).
    input_set: "the seller's pre-existing non-vacated EnforcementAction rows plus this issuance"
    constants:
      LADDER_RESTRICT_POINTS: 4.00
      LADDER_SUSPEND_POINTS: 12.00
    precision: "2 decimal places on post_balance; comparisons are >= so a post_balance of exactly 12.00 suspends"

  - name: enforcement_state_target
    trigger: "end of every request that changes this seller's EnforcementAction set, ban_reason or registration_risk_flag"
    algorithm: constraint_propagation
    formula: |
      # evaluated top to bottom, first match wins; runs AFTER severity_points_balance
      if seller.ban_reason is not null:                                    target = BANNED
      elif exists a in EnforcementAction(seller) where a.action_type == ACCOUNT_SUSPENSION
           and a.state in (ISSUED, ACKNOWLEDGED, UPHELD):                  target = SUSPENDED
      elif seller.severity_points_balance >= LADDER_SUSPEND_POINTS:        target = SUSPENDED
      elif seller.severity_points_balance >= LADDER_RESTRICT_POINTS:       target = RESTRICTED
      elif seller.severity_points_balance >  0.00
           or seller.registration_risk_flag is true:                       target = WATCHLIST
      else:                                                               target = ACTIVE
      # BANNED is absorbing: once ban_reason is set nothing lowers the posture.
    input_set: "this seller's non-vacated EnforcementAction rows, ban_reason, registration_risk_flag"
    constants:
      LADDER_RESTRICT_POINTS: 4.00
      LADDER_SUSPEND_POINTS: 12.00
    precision: "2 decimal places on the balance comparisons"

  - name: disbursement_state_target
    trigger: "end of every request that changes enforcement_state, a Violation state or a DisbursementHold state — always AFTER enforcement_state settles"
    algorithm: constraint_propagation
    formula: |
      if seller.enforcement_state in (SUSPENDED, BANNED):                  target = FULL_HOLD
      elif seller.enforcement_state in (WATCHLIST, RESTRICTED)
           or exists v in Violation(seller) where v.state == UNDER_INVESTIGATION: target = RESERVE_HELD
      else:                                                                target = NORMAL
      # The two dimensions are independent in shape but coupled in this one
      # direction only: enforcement_state feeds disbursement_state, never the
      # reverse. Releasing a hold NEVER changes enforcement_state.
    input_set: "this seller's enforcement_state and its Violation rows in state UNDER_INVESTIGATION"
    constants: {}
    precision: "n/a"

  - name: risk_tier
    trigger: "POST /disbursement-holds and the automatic FULL_HOLD cascade, snapshotted onto the hold"
    algorithm: threshold
    formula: |
      if   seller.enforcement_state in (SUSPENDED, BANNED)
        or seller.severity_points_balance >= LADDER_SUSPEND_POINTS
        or seller.metric_tier == BREACHING:                    risk_tier = TIER_3
      elif seller.severity_points_balance >= LADDER_RESTRICT_POINTS
        or seller.metric_tier == AT_RISK
        or seller.registration_risk_flag is true:              risk_tier = TIER_2
      else:                                                    risk_tier = TIER_1
    input_set: "the seller row as it stands when the hold is created"
    constants:
      LADDER_RESTRICT_POINTS: 4.00
      LADDER_SUSPEND_POINTS: 12.00
    precision: "n/a"

  - name: reserve_requirement_cents
    trigger: "POST /disbursement-holds with hold_type RESERVE — computes held_amount_cents"
    algorithm: tiered_pricing
    formula: |
      # risk_tier is snapshotted first (calculations.risk_tier), then exactly one
      # basis is applied. The two bases are both defensible readings of "reserve
      # policy" and produce different cents on identical data.
      if reserve_basis == ROLLING:
          held_amount_cents = round_half_up_to_int(seller.available_balance_cents
                                                   * RESERVE_ROLLING_PCT[risk_tier])
      elif reserve_basis == CLAIM_EXPOSURE:
          held_amount_cents = round_half_up_to_int(seller.open_defect_claim_units
                                                   * CLAIM_EXPOSURE_CENTS
                                                   * EXPOSURE_MULTIPLIER[risk_tier])
      # NO implicit clamp to the available balance: a CLAIM_EXPOSURE reserve that
      # exceeds available_balance_cents is refused with ERR_HOLD_EXCEEDS_AVAILABLE
      # (§1.4 priority 140) rather than silently reduced.
      # FULL_HOLD rows ignore this rule entirely: held_amount_cents is the whole
      # available_balance_cents and reserve_basis is NONE.
    input_set: "the seller's available_balance_cents and open_defect_claim_units at creation time; open_defect_claim_units is defect_claims_pending of the most recent MetricSnapshot"
    constants:
      RESERVE_ROLLING_PCT: { TIER_1: 0.10, TIER_2: 0.20, TIER_3: 0.30 }
      CLAIM_EXPOSURE_CENTS: 9000
      EXPOSURE_MULTIPLIER: { TIER_1: 1.00, TIER_2: 1.25, TIER_3: 1.50 }
      HOLD_BUFFER_HOURS: 24             # minimum separation between two ACTIVE coverage intervals
      FULL_HOLD_COVERAGE_DAYS: 90       # coverage_end of a cascade-minted FULL_HOLD row
    precision: "integer cents, round_half_up on the product"
    variants:
      - name: ROLLING
        when: "reserve_basis == ROLLING — a share of the balance actually sitting on the account"
        difference: "scales with available_balance_cents and is therefore always affordable"
      - name: CLAIM_EXPOSURE
        when: "reserve_basis == CLAIM_EXPOSURE — the money a wave of open defect claims could cost"
        difference: "scales with open_defect_claim_units and ignores the balance entirely, so it can exceed it and be refused"

  - name: related_account_confidence_score
    trigger: "POST /sellers, once per pre-existing Seller row, before the candidate is persisted as visible"
    algorithm: weighted_scoring
    formula: |
      matched = []
      if candidate.tax_id_hash        == other.tax_id_hash:        matched += TAX_ID
      if candidate.payout_bank_token  == other.payout_bank_token:  matched += BANK_TOKEN
      if candidate.address_fingerprint== other.address_fingerprint:matched += ADDRESS
      if candidate.email_domain       == other.email_domain
         and candidate.email_domain not in PUBLIC_EMAIL_DOMAINS:   matched += EMAIL_DOMAIN
      if candidate.device_fingerprint is not null
         and candidate.device_fingerprint == other.device_fingerprint: matched += DEVICE
      confidence_score = round2(min(sum(SIGNAL_WEIGHT[s] for s in matched), 1.00))
      # A RelatedAccountLink row is minted for every `other` scoring
      # >= RELATED_LINK_MIN_SCORE, with matched_signals in the fixed order
      # TAX_ID, BANK_TOKEN, ADDRESS, EMAIL_DOMAIN, DEVICE.
      # root_seller_id / registration_risk_flag come from the TOP link only:
      # ranking confidence_score DESC, tie-break other.created_at ASC (never id).
      # registration_risk_flag is true iff that top link scores
      # >= RELATED_LINK_WATCH_SCORE and its matched_seller_state_at_detection is
      # BANNED or SUSPENDED.
    input_set: "every pre-existing Seller row in any enforcement_state, including BANNED ones — that is the whole point of the check"
    constants:
      SIGNAL_WEIGHT: { TAX_ID: 0.35, BANK_TOKEN: 0.45, ADDRESS: 0.15, EMAIL_DOMAIN: 0.10, DEVICE: 0.20 }
      RELATED_LINK_MIN_SCORE: 0.35
      RELATED_LINK_WATCH_SCORE: 0.60
      PUBLIC_EMAIL_DOMAINS: [gmail.com, yahoo.com, outlook.com, hotmail.com]
    precision: "2 decimal places, round_half_up, capped at 1.00 (the weights sum to 1.25, so the cap is reachable)"

  - name: repeat_offense_count
    trigger: "POST /appeals/{id}/decide with outcome GRANTED, and POST /appeals/{id}/escalation-decision with outcome GRANTED_ON_ESCALATION"
    algorithm: aggregation
    formula: |
      appealed = the EnforcementAction under appeal
      repeat_offense_count = count(EnforcementAction a where a.seller_id == appealed.seller_id
                                   AND a.id != appealed.id
                                   AND a.policy_category == appealed.policy_category
                                   AND a.state in (ISSUED, ACKNOWLEDGED, UPHELD)
                                   AND a.issued_at <= appealed.issued_at)
      # >= APPEAL_REPEAT_DENIAL_THRESHOLD makes reinstatement unavailable: the
      # reviewer MUST deny (denial_reason REPEAT_OFFENSE). A GRANTED outcome on such
      # an appeal is refused with ERR_REPEAT_OFFENSE_DENIAL (§1.4 priority 100).
      # Vacated actions do not count, so a successful earlier appeal genuinely
      # restores the seller's eligibility.
    input_set: "the seller's non-vacated EnforcementAction rows in the appealed action's category, issued no later than the appealed action"
    constants:
      APPEAL_REPEAT_DENIAL_THRESHOLD: 2
      APPEAL_WINDOW_DAYS: 30            # EnforcementAction.appeal_deadline_at = issued_at + this
      ESCALATION_WINDOW_DAYS: 14        # Appeal.escalation_deadline_at = decided_at + this
      POA_DEADLINE_DAYS: 17             # PlanOfAction.deadline_at = action.issued_at + this
      POA_MAX_REVISIONS: 2              # returns allowed before ERR_POA_REVISION_LIMIT
    precision: "integer count"

# ============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST rule that fails decides the response, so a request that violates
# several rules always reports the lowest-priority-number error)
# ============================================================================

validations:
  - priority: 10
    category: auth
    check: "X-User-Role header present and one of the §1.7 role names; X-User-ID present for every role except Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "every path-templated id resolves to a live row, validated left to right"
    error_id: "ERR_SELLER_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_ACTION_NOT_FOUND | ERR_POA_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_HOLD_NOT_FOUND | ERR_LINK_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 40
    category: existence
    check: "every foreign key in the request body resolves to a live row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_SELLER_NOT_FOUND | ERR_POLICY_RULE_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_ACTION_NOT_FOUND | ERR_POA_NOT_FOUND"
    http_status: 404
    applies_to: "POST /listings, POST /violations, POST /enforcement-actions, POST /plans-of-action, POST /appeals, POST /disbursement-holds"

  - priority: 50
    category: auth
    check: "when the acting role is Seller, X-User-ID must equal the seller_id reached from the target row (listing.seller_id, action.seller_id, plan.action.seller_id, appeal.action.seller_id, or the path {id} on a /sellers/{id} route). Seller callers are never granted the operator list endpoints, so no query-filter ownership check is needed"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include Seller"

  - priority: 60
    category: auth
    check: "segregation of duties — the acting X-User-ID must differ from the user recorded for the conflicting earlier step: appeal decision vs action.issued_by_user_id; escalation decision vs appeal.decided_by_user_id AND action.issued_by_user_id; plan review vs action.issued_by_user_id; hold release or forfeit vs the hold's creating investigator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/start-review, POST /appeals/{id}/decide, POST /appeals/{id}/escalation-decision, POST /plans-of-action/{id}/review, POST /disbursement-holds/{id}/release, POST /disbursement-holds/{id}/forfeit"

  - priority: 70
    category: business_constraint
    check: "request shape — required fields present, types correct, enums in range, string lengths and numeric ranges within the §1.1 constraints, datetimes ISO 8601 UTC with three fractional digits, pagination limit 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 72
    category: business_constraint
    check: "plan-of-action completeness — root_cause 40..2000 chars after trim, corrective_measures and preventive_measures each 1..10 elements of 10..500 chars"
    error_id: ERR_POA_INCOMPLETE
    http_status: 422
    applies_to: "POST /plans-of-action, POST /plans-of-action/{id}/review"

  - priority: 80
    category: state
    check: "the seller reached from the target row must not be banned — ban_reason is null / enforcement_state != BANNED"
    error_id: ERR_SELLER_BANNED
    http_status: 409
    applies_to: "every POST except POST /sellers, POST /sellers/{id}/proceeds-credits, POST /disbursement-holds/{id}/forfeit and POST /_clock/set_current_utc"

  - priority: 85
    category: state
    check: "the target row is in a state from which this transition exists (§1.2), including the cross-entity gates: an action may only be issued for a SUBSTANTIATED violation; a listing may only be relisted while its seller is ACTIVE or WATCHLIST; a reserve hold may only be created while disbursement_state != NORMAL; an appeal may only be filed against an ISSUED or ACKNOWLEDGED action"
    error_id: "ERR_INVALID_STATE | ERR_VIOLATION_NOT_SUBSTANTIATED | ERR_SELLER_NOT_UNDER_HOLD_POSTURE | ERR_ACTION_NOT_APPEALABLE_STATE | ERR_POA_NOT_ACCEPTED | ERR_LISTING_NOT_REMOVED | ERR_HOLD_NOT_MANUALLY_RELEASABLE | ERR_SELLER_NOT_BANNED"
    http_status: 409
    applies_to: "all action endpoints and every create whose parent must be in a given state"

  - priority: 90
    category: state
    check: "optimistic concurrency — expected_seller_version / expected_enforcement_action_version must equal the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_SELLER_VERSION | ERR_STALE_ACTION_VERSION"
    http_status: 412
    applies_to: "POST /disbursement-holds, POST /plans-of-action"

  - priority: 100
    category: business_safety
    check: "compliance gates that override operator discretion — reinstatement is unavailable once repeat_offense_count >= APPEAL_REPEAT_DENIAL_THRESHOLD; a related-account link may only be confirmed when the matched seller was BANNED at detection; a listing removed under RESTRICTED_PRODUCT may never be relisted; an action_type_override must be strictly more severe than the computed rung"
    error_id: "ERR_REPEAT_OFFENSE_DENIAL | ERR_LINK_MATCH_NOT_BANNED | ERR_LISTING_RESTRICTED_NO_RELIST | ERR_OVERRIDE_NOT_MORE_SEVERE"
    http_status: 422
    applies_to: "POST /appeals/{id}/decide, POST /appeals/{id}/escalation-decision, POST /related-account-links/{id}/adjudicate, POST /listings/{id}/relist, POST /enforcement-actions"

  - priority: 110
    category: business_temporal
    check: "clock windows and interval geometry — clock_now <= appeal_deadline_at to appeal; clock_now <= escalation_deadline_at to escalate; a MetricSnapshot half-open window [window_start, window_end) must not overlap another window of the same seller and source (touching endpoints are legal); a DisbursementHold closed coverage interval [coverage_start, coverage_end] must be separated from every other ACTIVE hold of the same seller by strictly more than HOLD_BUFFER_HOURS"
    error_id: "ERR_APPEAL_WINDOW_CLOSED | ERR_ESCALATION_WINDOW_CLOSED | ERR_SNAPSHOT_WINDOW_OVERLAP | ERR_HOLD_COVERAGE_OVERLAP | ERR_NO_SNAPSHOTS_IN_WINDOW"
    http_status: 422
    applies_to: "POST /appeals, POST /appeals/{id}/escalate, POST /metric-snapshots, POST /disbursement-holds, POST /sellers/{id}/health-evaluations"

  - priority: 120
    category: business_constraint
    check: "uniqueness and at-most-one constraints — seller email (case-insensitive), policy rule code, at most one non-vacated action per violation, at most one appeal per action, at most one SUBMITTED plan per action, at most POA_MAX_REVISIONS returns per action"
    error_id: "ERR_DUPLICATE_SELLER_EMAIL | ERR_DUPLICATE_POLICY_CODE | ERR_ACTION_ALREADY_EXISTS | ERR_APPEAL_ALREADY_EXISTS | ERR_POA_ALREADY_OPEN | ERR_POA_REVISION_LIMIT"
    http_status: 409
    applies_to: "POST /sellers, POST /policy-rules, POST /enforcement-actions, POST /appeals, POST /plans-of-action, POST /plans-of-action/{id}/review"

  - priority: 130
    category: business_referential
    check: "cross-row coherence between rows that all exist — the cited listing must belong to the cited seller; a LISTING-scope rule requires a cited listing; only RIGHTS_OWNER reports may cite an INTELLECTUAL_PROPERTY rule; a cited plan must belong to the appealed action; a cited enforcement action on a hold must belong to the cited seller"
    error_id: "ERR_LISTING_SELLER_MISMATCH | ERR_LISTING_REQUIRED_FOR_SCOPE | ERR_REPORTER_NOT_ELIGIBLE | ERR_POA_ACTION_MISMATCH | ERR_HOLD_ACTION_SELLER_MISMATCH"
    http_status: 422
    applies_to: "POST /violations, POST /appeals, POST /disbursement-holds"

  - priority: 140
    category: business_fiscal
    check: "money capacity — a new hold's held_amount_cents must not exceed the seller's available_balance_cents (equivalently: the sum over ACTIVE holds plus this row must not exceed lifetime_credited_cents - lifetime_debited_cents); a forfeit amount must not exceed the hold's held_amount_cents"
    error_id: "ERR_HOLD_EXCEEDS_AVAILABLE | ERR_FORFEIT_EXCEEDS_HOLD"
    http_status: 422
    applies_to: "POST /disbursement-holds, POST /disbursement-holds/{id}/forfeit"

# ============================================================================
# §1.5 API Endpoint Table
# Flat topology: the only nested paths are read sub-resources under /sellers/{id}
# and action endpoints of the form POST /<collection>/{id}/<verb>. Every path
# parameter is spelled {id}. All list endpoints accept limit? and offset? and
# return the §1.0 pagination envelope.
# ============================================================================

endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock every deadline, decay window and evaluation lookback reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["no stored row changes; all subsequent clock_now readings return to_iso8601"]

  # --- sellers --------------------------------------------------------------
  - method: POST
    path: "/sellers"
    description: "Registers a seller and runs related-account detection against every existing seller."
    roles: [Anonymous]
    code: 201
    input: [legal_name, email, tax_id_hash, payout_bank_token, address_fingerprint, "device_fingerprint?"]
    output: Seller
    side_effects:
      - "computes email_domain from email"
      - "runs calculations.related_account_confidence_score against every existing Seller and mints a RelatedAccountLink (state DETECTED) per match scoring >= RELATED_LINK_MIN_SCORE"
      - "sets root_seller_id and registration_risk_flag from the top-ranked link"
      - "when registration_risk_flag becomes true: enforcement_state -> WATCHLIST, then disbursement_state -> RESERVE_HELD, and a REGISTRATION_FLAGGED Notification is emitted"
      - "rejects a duplicate email case-insensitively with ERR_DUPLICATE_SELLER_EMAIL"

  - method: GET
    path: "/sellers/{id}"
    description: "Reads one seller including both posture dimensions, the severity balance and the funds fields."
    roles: [Seller, PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Seller
    side_effects: []

  - method: GET
    path: "/sellers"
    description: "Operator list of sellers; root_seller_id resolves the self-referential registration family."
    roles: [PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["root_seller_id?", "enforcement_state?", "disbursement_state?", "limit?", "offset?"]
    output: Seller[]
    side_effects: []

  - method: POST
    path: "/sellers/{id}/proceeds-credits"
    description: "Credits settled marketplace proceeds to the seller; the only way funds enter the system."
    roles: [ComplianceOfficer]
    code: 201
    input: [amount_cents, "external_reference?"]
    output: Seller
    side_effects:
      - "available_balance_cents += amount_cents and lifetime_credited_cents += amount_cents, preserving available + held == lifetime_credited - lifetime_debited"
      - "increments Seller.version by 1"
      - "amount_cents < 1 is rejected with ERR_INVALID_REQUEST (priority 70)"

  - method: GET
    path: "/sellers/{id}/metric-snapshots"
    description: "Performance snapshots of one seller, newest window first."
    roles: [Seller, PolicyInvestigator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: MetricSnapshot[]
    side_effects: []

  - method: GET
    path: "/sellers/{id}/listings"
    description: "Listings of one seller; the only way to observe suppression and removal cascades."
    roles: [Seller, PolicyInvestigator, ComplianceOfficer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: GET
    path: "/sellers/{id}/notifications"
    description: "The seller's transparency trail, newest first; also the seller's only discovery channel for actions, decisions and holds."
    roles: [Seller, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["template_code?", "state?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []

  # --- metrics and health ---------------------------------------------------
  - method: POST
    path: "/metric-snapshots"
    description: "Files one measured performance window for a seller."
    roles: [ComplianceOfficer]
    code: 201
    input: [seller_id, window_start, window_end, order_volume, delivered_or_refunded_volume, defect_claims_pending, defect_claims_substantiated, late_shipments, pre_fulfillment_cancellations, shipments_total, shipments_with_valid_tracking, "source?"]
    output: MetricSnapshot
    side_effects:
      - "rejects a half-open window overlapping an existing window of the same seller AND same source with ERR_SNAPSHOT_WINDOW_OVERLAP; windows that merely touch (new.window_start == old.window_end) are accepted"
      - "recomputes Seller.open_defect_claim_units from the seller's most recent snapshot"
      - "increments Seller.version by 1"

  - method: POST
    path: "/sellers/{id}/health-evaluations"
    description: "Evaluates the seller's performance metrics over the lookback window and files an immutable HealthEvaluation."
    roles: [PolicyInvestigator, ComplianceOfficer]
    code: 201
    input: []
    output: HealthEvaluation
    side_effects:
      - "runs calculations.order_defect_rate, secondary_metric_rates, health_score and metric_tier over the input set S"
      - "fails with ERR_NO_SNAPSHOTS_IN_WINDOW and files nothing when S is empty"
      - "copies health_score and metric_tier onto the Seller and increments Seller.version by 1"
      - "when metric_tier == BREACHING: auto-creates a Violation (state UNDER_INVESTIGATION, auto_generated true, reporter_type PLATFORM_AUTOMATION) against the ranked SHIPPING_PERFORMANCE / ACCOUNT rule, writes its id to auto_violation_id, drives disbursement_state to RESERVE_HELD and emits a HEALTH_BREACH Notification"

  - method: GET
    path: "/health-evaluations"
    description: "Operator list of evaluations; auto_violation_id finds the evaluation that minted a given auto-violation."
    roles: [PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["seller_id?", "auto_violation_id?", "metric_tier?", "limit?", "offset?"]
    output: HealthEvaluation[]
    side_effects: []

  # --- policy catalogue -----------------------------------------------------
  - method: GET
    path: "/health-evaluations/{id}"
    description: "Reads one filed health evaluation."
    roles: [PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: HealthEvaluation
    side_effects: []

  # --- policy catalogue -----------------------------------------------------
  - method: POST
    path: "/policy-rules"
    description: "Publishes a policy rule; decay_exempt is derived from the category."
    roles: [ComplianceOfficer]
    code: 201
    input: [code, category, base_severity_weight, removal_scope, "requires_poa?"]
    output: PolicyRule
    side_effects:
      - "sets decay_exempt true exactly for INTELLECTUAL_PROPERTY and RESTRICTED_PRODUCT"
      - "rejects a duplicate code with ERR_DUPLICATE_POLICY_CODE"

  - method: GET
    path: "/policy-rules"
    description: "Lists published policy rules."
    roles: [Seller, PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: PolicyRule[]
    side_effects: []

  # --- listings -------------------------------------------------------------
  - method: POST
    path: "/listings"
    description: "Creates a listing owned by the acting seller."
    roles: [Seller]
    code: 201
    input: [seller_id, sku, title, category_code, "restricted_flag?"]
    output: Listing
    side_effects: ["rejects seller_id != X-User-ID with ERR_NOT_RESOURCE_OWNER"]

  - method: POST
    path: "/listings/{id}/relist"
    description: "Returns a removed listing to ACTIVE — allowed only while the owning seller's enforcement_state is ACTIVE or WATCHLIST."
    roles: [Seller]
    code: 200
    input: []
    output: Listing
    side_effects:
      - "state REMOVED -> ACTIVE and removal_policy_category is cleared"
      - "rejects a listing that is not REMOVED with ERR_LISTING_NOT_REMOVED"
      - "rejects a RESTRICTED_PRODUCT removal with ERR_LISTING_RESTRICTED_NO_RELIST"
      - "rejects a seller in RESTRICTED, SUSPENDED or BANNED with ERR_INVALID_STATE / ERR_SELLER_BANNED"

  # --- violations -----------------------------------------------------------
  - method: POST
    path: "/violations"
    description: "Files a policy violation report against a seller."
    roles: [PolicyInvestigator, ComplianceOfficer]
    code: 201
    input: [seller_id, policy_rule_id, "listing_id?", reporter_type, evidence_reference]
    output: Violation
    side_effects:
      - "sets detected_at from the logical clock; state starts at REPORTED"
      - "requires listing_id when the rule's removal_scope is LISTING (ERR_LISTING_REQUIRED_FOR_SCOPE) and requires the listing to belong to seller_id (ERR_LISTING_SELLER_MISMATCH)"
      - "only reporter_type RIGHTS_OWNER may cite an INTELLECTUAL_PROPERTY rule (ERR_REPORTER_NOT_ELIGIBLE)"

  - method: GET
    path: "/violations"
    description: "Operator list of violations; the discovery channel for auto-generated ones."
    roles: [PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["seller_id?", "policy_rule_id?", "listing_id?", "state?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: GET
    path: "/violations/{id}"
    description: "Reads one violation, including the auto-generated ones."
    roles: [PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/violations/{id}/open-investigation"
    description: "Moves a REPORTED violation into UNDER_INVESTIGATION, which puts the seller's funds into reserve posture."
    roles: [PolicyInvestigator]
    code: 200
    input: []
    output: Violation
    side_effects:
      - "state REPORTED -> UNDER_INVESTIGATION"
      - "drives Seller.disbursement_state NORMAL -> RESERVE_HELD and increments Seller.version by 1"

  - method: POST
    path: "/violations/{id}/adjudicate"
    description: "Closes an investigation as SUBSTANTIATED or DISMISSED."
    roles: [PolicyInvestigator]
    code: 200
    input: [outcome, "decision_note?"]
    output: Violation
    side_effects:
      - "sets adjudicated_at and decision_note"
      - "recomputes disbursement_state; when no investigation remains open and enforcement_state is ACTIVE the seller returns to NORMAL and every ACTIVE hold is RELEASED with release_reason INVESTIGATION_CLOSED, moving held_balance_cents back to available_balance_cents and emitting FUNDS_RELEASED notices"

  # --- enforcement actions --------------------------------------------------
  - method: POST
    path: "/enforcement-actions"
    description: "Issues the enforcement rung the severity ladder selects for a SUBSTANTIATED violation."
    roles: [PolicyInvestigator]
    code: 201
    input: [violation_id, "action_type_override?"]
    output: EnforcementAction
    side_effects:
      - "snapshots policy_category, policy_rule_code and decay_exempt from the cited rule; sets issued_by_user_id from X-User-ID and issued_at from the clock"
      - "computes severity_points_applied, then ladder_rung_computed, then action_type and override_applied (calculations.enforcement_ladder_rung); sets appeal_deadline_at = issued_at + APPEAL_WINDOW_DAYS"
      - "writes Seller.severity_points_balance = post_balance, then recomputes enforcement_state, then disbursement_state; increments Seller.version by 1"
      - "action_type LISTING_REMOVAL removes the cited listing (scope LISTING) or every ACTIVE/SUPPRESSED listing of the seller (scope ACCOUNT) and sets removed_listing_count"
      - "action_type ACCOUNT_SUSPENSION suppresses every ACTIVE listing with suppressed_by_suspension true, then drives disbursement_state to FULL_HOLD, which releases ACTIVE holds as SUPERSEDED_BY_FULL_HOLD, mints one auto FULL_HOLD row sweeping available_balance_cents and emits FUNDS_HELD"
      - "emits an ACTION_ISSUED Notification carrying policy_rule_code, severity_points_disclosed, appeal_deadline_at and evidence_reference"

  - method: GET
    path: "/enforcement-actions"
    description: "Operator list of enforcement actions."
    roles: [PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["seller_id?", "violation_id?", "state?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: GET
    path: "/enforcement-actions/{id}"
    description: "Reads one action; the seller may read only its own."
    roles: [Seller, PolicyInvestigator, AppealReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: POST
    path: "/enforcement-actions/{id}/acknowledge"
    description: "Seller acknowledges receipt of an action; does not pause the appeal window."
    roles: [Seller]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "state ISSUED -> ACKNOWLEDGED and acknowledged_at is set"
      - "increments EnforcementAction.version by 1, which invalidates any pending expected_enforcement_action_version"

  # --- plans of action ------------------------------------------------------
  - method: POST
    path: "/plans-of-action"
    description: "Seller submits (or resubmits) a plan of action answering an enforcement action."
    roles: [Seller]
    code: 201
    input: [enforcement_action_id, root_cause, corrective_measures, preventive_measures, expected_enforcement_action_version]
    output: PlanOfAction
    side_effects:
      - "OCC: expected_enforcement_action_version must equal the action's version, else ERR_STALE_ACTION_VERSION (412)"
      - "supersedes the seller's RETURNED_FOR_REVISION plan for the same action and sets revision_count one higher"
      - "sets submitted_at from the clock and deadline_at = action.issued_at + POA_DEADLINE_DAYS"
      - "increments EnforcementAction.version by 1"
      - "rejects a second open plan with ERR_POA_ALREADY_OPEN and a rule with requires_poa false with ERR_INVALID_STATE"

  - method: GET
    path: "/plans-of-action"
    description: "Lists plans of action, newest revision first."
    roles: [Seller, AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["enforcement_action_id?", "state?", "limit?", "offset?"]
    output: PlanOfAction[]
    side_effects: []

  - method: GET
    path: "/plans-of-action/{id}"
    description: "Reads one plan of action; the seller may read only its own."
    roles: [Seller, AppealReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: PlanOfAction
    side_effects: []

  - method: POST
    path: "/plans-of-action/{id}/review"
    description: "Compliance review of a submitted plan: ACCEPT, RETURN for revision, or REJECT."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_notes?"]
    output: PlanOfAction
    side_effects:
      - "SUBMITTED -> ACCEPTED | RETURNED_FOR_REVISION | REJECTED; stores reviewed_by_user_id and review_notes"
      - "rejects a reviewer whose X-User-ID equals the action's issued_by_user_id with ERR_SEGREGATION_OF_DUTIES"
      - "rejects a RETURN once revision_count has reached POA_MAX_REVISIONS with ERR_POA_REVISION_LIMIT"
      - "emits a POA_DECISION Notification whose decision_rationale is review_notes"

  # --- appeals --------------------------------------------------------------
  - method: POST
    path: "/appeals"
    description: "Seller appeals an enforcement action inside the appeal window."
    roles: [Seller]
    code: 201
    input: [enforcement_action_id, "plan_of_action_id?", grounds]
    output: Appeal
    side_effects:
      - "rejects clock_now > action.appeal_deadline_at with ERR_APPEAL_WINDOW_CLOSED"
      - "requires an ACCEPTED plan for a requires_poa rule (ERR_POA_NOT_ACCEPTED) and requires the cited plan to belong to the appealed action (ERR_POA_ACTION_MISMATCH)"
      - "rejects a second appeal for the same action with ERR_APPEAL_ALREADY_EXISTS"

  - method: GET
    path: "/appeals"
    description: "Lists appeals."
    roles: [AppealReviewer, ComplianceOfficer]
    code: 200
    input: ["enforcement_action_id?", "plan_of_action_id?", "state?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: GET
    path: "/appeals/{id}"
    description: "Reads one appeal; the seller may read only its own."
    roles: [Seller, AppealReviewer, ComplianceOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/appeals/{id}/start-review"
    description: "Reviewer takes the appeal under review; the reviewer may not be the issuing investigator."
    roles: [AppealReviewer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["SUBMITTED -> UNDER_REVIEW"]

  - method: POST
    path: "/appeals/{id}/decide"
    description: "First-level appeal decision: GRANTED vacates the action and reinstates the seller; DENIED upholds it and opens the escalation window."
    roles: [AppealReviewer]
    code: 200
    input: [outcome, "denial_reason?", rationale]
    output: Appeal
    side_effects:
      - "sets decided_by_user_id, decided_at and rationale; rejects a decider whose X-User-ID equals the action's issued_by_user_id with ERR_SEGREGATION_OF_DUTIES"
      - "GRANTED is refused with ERR_REPEAT_OFFENSE_DENIAL when calculations.repeat_offense_count >= APPEAL_REPEAT_DENIAL_THRESHOLD"
      - "GRANTED: action -> VACATED (resolution_reason APPEAL_GRANTED), Seller.severity_points_balance is recomputed downward, enforcement_state walks back down the ladder, disbursement_state relaxes, every ACTIVE hold is RELEASED with release_reason APPEAL_GRANTED and listings with suppressed_by_suspension true return to ACTIVE; reinstated_count increments when the vacated action_type was ACCOUNT_SUSPENSION"
      - "DENIED: action -> UPHELD (resolution_reason APPEAL_DENIED) and escalation_deadline_at = decided_at + ESCALATION_WINDOW_DAYS; denial_reason is required"
      - "emits an APPEAL_DECISION Notification carrying decision_rationale and, on denial, escalation_deadline_at"

  - method: POST
    path: "/appeals/{id}/escalate"
    description: "Seller escalates a denied appeal inside the escalation window."
    roles: [Seller]
    code: 200
    input: [escalation_grounds]
    output: Appeal
    side_effects:
      - "DENIED -> ESCALATED_REVIEW; records escalation_requested_at and escalation_grounds"
      - "rejects clock_now > escalation_deadline_at with ERR_ESCALATION_WINDOW_CLOSED"

  - method: POST
    path: "/appeals/{id}/escalation-decision"
    description: "Final compliance decision on an escalated appeal."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "denial_reason?", rationale]
    output: Appeal
    side_effects:
      - "rejects an officer whose X-User-ID equals decided_by_user_id or the action's issued_by_user_id with ERR_SEGREGATION_OF_DUTIES"
      - "GRANTED_ON_ESCALATION: the UPHELD action reopens to VACATED (resolution_reason ESCALATION_GRANTED) and the full reinstatement cascade runs, subject to the same ERR_REPEAT_OFFENSE_DENIAL gate"
      - "FINAL_DENIED: resolution_reason ESCALATION_DENIED; when the action_type was ACCOUNT_SUSPENSION the seller's ban_reason becomes ESCALATION_EXHAUSTED, enforcement_state becomes BANNED, every ACTIVE and SUPPRESSED listing is REMOVED and an ACCOUNT_BANNED Notification is emitted"
      - "emits an ESCALATION_DECISION Notification"

  # --- disbursement holds ---------------------------------------------------
  - method: POST
    path: "/disbursement-holds"
    description: "Creates a reserve hold against a seller under investigation; the amount comes from the selected reserve basis."
    roles: [PolicyInvestigator]
    code: 201
    input: [seller_id, "enforcement_action_id?", hold_type, reserve_basis, coverage_start, coverage_end, expected_seller_version]
    output: DisbursementHold
    side_effects:
      - "OCC: expected_seller_version must equal Seller.version, else ERR_STALE_SELLER_VERSION (412)"
      - "snapshots risk_tier and computes held_amount_cents from calculations.reserve_requirement_cents; sets created_by_user_id from X-User-ID"
      - "moves held_amount_cents from available_balance_cents to held_balance_cents and increments Seller.version by 1"
      - "rejects disbursement_state NORMAL with ERR_SELLER_NOT_UNDER_HOLD_POSTURE, hold_type FULL_HOLD with ERR_INVALID_REQUEST (cascade-only), an amount above available_balance_cents with ERR_HOLD_EXCEEDS_AVAILABLE and a coverage interval within HOLD_BUFFER_HOURS of another ACTIVE hold with ERR_HOLD_COVERAGE_OVERLAP"
      - "emits a FUNDS_HELD Notification carrying amount_cents"

  - method: GET
    path: "/disbursement-holds"
    description: "Lists holds; the discovery channel for cascade-created FULL_HOLD rows."
    roles: [PolicyInvestigator, ComplianceOfficer]
    code: 200
    input: ["seller_id?", "enforcement_action_id?", "state?", "limit?", "offset?"]
    output: DisbursementHold[]
    side_effects: []

  - method: GET
    path: "/disbursement-holds/{id}"
    description: "Reads one disbursement hold."
    roles: [PolicyInvestigator, ComplianceOfficer]
    code: 200
    input: []
    output: DisbursementHold
    side_effects: []

  - method: POST
    path: "/disbursement-holds/{id}/release"
    description: "Manually releases a reserve hold, returning the money to the available balance."
    roles: [ComplianceOfficer]
    code: 200
    input: [release_reason]
    output: DisbursementHold
    side_effects:
      - "ACTIVE -> RELEASED; released_at is set and held_amount_cents moves from held_balance_cents back to available_balance_cents"
      - "callers may only pass release_reason MANUAL or INVESTIGATION_CLOSED; a FULL_HOLD row is refused with ERR_HOLD_NOT_MANUALLY_RELEASABLE"
      - "increments Seller.version by 1 and emits a FUNDS_RELEASED Notification"

  - method: POST
    path: "/disbursement-holds/{id}/forfeit"
    description: "Permanently debits part or all of a hold after the account is banned."
    roles: [ComplianceOfficer]
    code: 200
    input: [forfeited_amount_cents]
    output: DisbursementHold
    side_effects:
      - "ACTIVE -> FORFEITED; requires the seller to be BANNED (ERR_SELLER_NOT_BANNED) and forfeited_amount_cents <= held_amount_cents (ERR_FORFEIT_EXCEEDS_HOLD)"
      - "held_balance_cents -= held_amount_cents, lifetime_debited_cents += forfeited_amount_cents and the residue held_amount_cents - forfeited_amount_cents returns to available_balance_cents, so available + held == lifetime_credited - lifetime_debited still holds"
      - "increments Seller.version by 1"

  # --- related-account detection -------------------------------------------
  - method: GET
    path: "/related-account-links"
    description: "Lists detected registration links from either side of the pair."
    roles: [PolicyInvestigator, ComplianceOfficer]
    code: 200
    input: ["candidate_seller_id?", "matched_seller_id?", "state?", "limit?", "offset?"]
    output: RelatedAccountLink[]
    side_effects: []

  - method: GET
    path: "/related-account-links/{id}"
    description: "Reads one related-account link."
    roles: [PolicyInvestigator, ComplianceOfficer]
    code: 200
    input: []
    output: RelatedAccountLink
    side_effects: []

  - method: POST
    path: "/related-account-links/{id}/adjudicate"
    description: "Confirms or dismisses a suspected banned-seller re-registration."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "adjudication_note?"]
    output: RelatedAccountLink
    side_effects:
      - "DETECTED -> CONFIRMED | DISMISSED; stores adjudicated_by_user_id and adjudication_note"
      - "CONFIRMED requires matched_seller_state_at_detection == BANNED (ERR_LINK_MATCH_NOT_BANNED) and bans the candidate: ban_reason RELATED_ACCOUNT_CONFIRMED, enforcement_state BANNED, every ACTIVE/SUPPRESSED listing REMOVED, disbursement_state FULL_HOLD with the release-then-sweep sequence, ACCOUNT_BANNED and FUNDS_HELD Notifications"
      - "DISMISSED clears registration_risk_flag when no other DETECTED or CONFIRMED link points at the candidate, which relaxes enforcement_state and then disbursement_state"
      - "increments Seller.version by 1"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:
  # authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or not a §1.7 role name, or X-User-ID missing for a role other than Anonymous"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Seller caller targets a row whose owning seller_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the conflicting earlier step (issued the action, decided the first-level appeal, or created the hold)"

  # existence
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "no Seller with the given id"
  - id: ERR_POLICY_RULE_NOT_FOUND
    http: 404
    condition: "no PolicyRule with the given id"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "no Listing with the given id"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "no Violation with the given id"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "no HealthEvaluation with the given id"
  - id: ERR_ACTION_NOT_FOUND
    http: 404
    condition: "no EnforcementAction with the given id"
  - id: ERR_POA_NOT_FOUND
    http: 404
    condition: "no PlanOfAction with the given id"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "no Appeal with the given id"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "no DisbursementHold with the given id"
  - id: ERR_LINK_NOT_FOUND
    http: 404
    condition: "no RelatedAccountLink with the given id"

  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, enum out of range, string or numeric constraint violated, malformed datetime, pagination limit outside 1..100, hold_type FULL_HOLD passed to POST /disbursement-holds, or amount_cents < 1"
  - id: ERR_POA_INCOMPLETE
    http: 422
    condition: "root_cause shorter than 40 characters after trim, or corrective_measures / preventive_measures empty, over 10 elements, or containing an element outside 10..500 characters"

  # state
  - id: ERR_SELLER_BANNED
    http: 409
    condition: "the seller reached from the target row has ban_reason set; every write except registration, proceeds credits and hold forfeiture is refused"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target row is not in a state from which the requested transition exists, and no more specific state error applies (e.g. relisting while the seller is RESTRICTED or SUSPENDED, submitting a plan for a rule with requires_poa false, deciding an appeal that is not UNDER_REVIEW)"
  - id: ERR_VIOLATION_NOT_SUBSTANTIATED
    http: 409
    condition: "POST /enforcement-actions cites a Violation whose state is not SUBSTANTIATED"
  - id: ERR_SELLER_NOT_UNDER_HOLD_POSTURE
    http: 409
    condition: "POST /disbursement-holds targets a seller whose disbursement_state is NORMAL"
  - id: ERR_ACTION_NOT_APPEALABLE_STATE
    http: 409
    condition: "the appealed or acknowledged EnforcementAction is already UPHELD or VACATED"
  - id: ERR_POA_NOT_ACCEPTED
    http: 409
    condition: "an appeal is filed against an action whose rule has requires_poa true while no PlanOfAction for that action is in state ACCEPTED"
  - id: ERR_LISTING_NOT_REMOVED
    http: 409
    condition: "POST /listings/{id}/relist targets a listing that is not in state REMOVED"
  - id: ERR_HOLD_NOT_MANUALLY_RELEASABLE
    http: 409
    condition: "POST /disbursement-holds/{id}/release targets a FULL_HOLD row, which only a reinstatement or posture cascade may release"
  - id: ERR_SELLER_NOT_BANNED
    http: 409
    condition: "POST /disbursement-holds/{id}/forfeit targets a hold whose seller is not BANNED"

  # optimistic concurrency
  - id: ERR_STALE_SELLER_VERSION
    http: 412
    condition: "expected_seller_version does not equal the seller's current version (§1.2.1 hold-create-stale-seller)"
  - id: ERR_STALE_ACTION_VERSION
    http: 412
    condition: "expected_enforcement_action_version does not equal the action's current version (§1.2.1 poa-create-stale-action)"

  # safety and compliance
  - id: ERR_REPEAT_OFFENSE_DENIAL
    http: 422
    condition: "a GRANTED or GRANTED_ON_ESCALATION outcome is requested while calculations.repeat_offense_count >= APPEAL_REPEAT_DENIAL_THRESHOLD"
  - id: ERR_LINK_MATCH_NOT_BANNED
    http: 422
    condition: "a RelatedAccountLink is confirmed although matched_seller_state_at_detection is not BANNED"
  - id: ERR_LISTING_RESTRICTED_NO_RELIST
    http: 422
    condition: "a listing removed under removal_policy_category RESTRICTED_PRODUCT is relisted"
  - id: ERR_OVERRIDE_NOT_MORE_SEVERE
    http: 422
    condition: "action_type_override is equal to or milder than ladder_rung_computed on the ordering WARNING < LISTING_REMOVAL < ACCOUNT_SUSPENSION"

  # temporal and interval geometry
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "clock_now is strictly after the action's appeal_deadline_at"
  - id: ERR_ESCALATION_WINDOW_CLOSED
    http: 422
    condition: "clock_now is strictly after the appeal's escalation_deadline_at"
  - id: ERR_SNAPSHOT_WINDOW_OVERLAP
    http: 422
    condition: "a new MetricSnapshot's half-open window [window_start, window_end) overlaps an existing window of the same seller and source; touching endpoints do not overlap"
  - id: ERR_HOLD_COVERAGE_OVERLAP
    http: 422
    condition: "a new hold's closed coverage interval [coverage_start, coverage_end] is not separated by strictly more than HOLD_BUFFER_HOURS from every other ACTIVE hold of the same seller"
  - id: ERR_NO_SNAPSHOTS_IN_WINDOW
    http: 422
    condition: "POST /sellers/{id}/health-evaluations finds no MetricSnapshot in the EVAL_LOOKBACK_DAYS window — the empty-input-set edge"

  # uniqueness and at-most-one
  - id: ERR_DUPLICATE_SELLER_EMAIL
    http: 409
    condition: "another Seller already uses that email, compared case-insensitively"
  - id: ERR_DUPLICATE_POLICY_CODE
    http: 409
    condition: "another PolicyRule already uses that code"
  - id: ERR_ACTION_ALREADY_EXISTS
    http: 409
    condition: "the cited Violation already has an EnforcementAction in state ISSUED, ACKNOWLEDGED or UPHELD"
  - id: ERR_APPEAL_ALREADY_EXISTS
    http: 409
    condition: "the appealed EnforcementAction already has an Appeal in any state"
  - id: ERR_POA_ALREADY_OPEN
    http: 409
    condition: "the cited EnforcementAction already has a PlanOfAction in state SUBMITTED"
  - id: ERR_POA_REVISION_LIMIT
    http: 409
    condition: "a RETURN decision is requested although revision_count has already reached POA_MAX_REVISIONS"

  # referential coherence between existing rows
  - id: ERR_LISTING_SELLER_MISMATCH
    http: 422
    condition: "the cited listing_id belongs to a different seller than seller_id"
  - id: ERR_LISTING_REQUIRED_FOR_SCOPE
    http: 422
    condition: "a violation cites a PolicyRule whose removal_scope is LISTING without a listing_id"
  - id: ERR_REPORTER_NOT_ELIGIBLE
    http: 422
    condition: "a violation cites an INTELLECTUAL_PROPERTY rule with a reporter_type other than RIGHTS_OWNER"
  - id: ERR_POA_ACTION_MISMATCH
    http: 422
    condition: "the cited plan_of_action_id belongs to a different EnforcementAction than the one under appeal"
  - id: ERR_HOLD_ACTION_SELLER_MISMATCH
    http: 422
    condition: "the cited enforcement_action_id on a hold belongs to a different seller than seller_id"

  # money capacity
  - id: ERR_HOLD_EXCEEDS_AVAILABLE
    http: 422
    condition: "the computed held_amount_cents exceeds the seller's available_balance_cents — reachable with reserve_basis CLAIM_EXPOSURE, which ignores the balance"
  - id: ERR_FORFEIT_EXCEEDS_HOLD
    http: 422
    condition: "forfeited_amount_cents exceeds the hold's held_amount_cents"

# ============================================================================
# §1.7 RBAC Matrix — segregation of duties
# Four operator roles split the enforcement pipeline so that no single user can
# investigate, enforce, review the remedy and decide the appeal.
# ============================================================================

roles:
  - name: Anonymous
    description: "Unauthenticated registrant; the only role that can create a Seller."
    identity: opaque
    exclusive_operations: ["POST /sellers"]
    shared_operations: []

  - name: Seller
    description: "The marketplace seller under enforcement; acts only on its own rows."
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /listings"
      - "POST /listings/{id}/relist"
      - "POST /enforcement-actions/{id}/acknowledge"
      - "POST /plans-of-action"
      - "POST /appeals"
      - "POST /appeals/{id}/escalate"
    shared_operations:
      - "GET /sellers/{id} (own row only)"
      - "GET /sellers/{id}/metric-snapshots (own rows only)"
      - "GET /sellers/{id}/listings (own rows only)"
      - "GET /sellers/{id}/notifications (own rows only)"
      - "GET /enforcement-actions/{id} (own actions only)"
      - "GET /appeals/{id} (own appeals only)"
      - "GET /plans-of-action (own plans only), GET /plans-of-action/{id} (own plans only)"
      - "GET /policy-rules"

  - name: PolicyInvestigator
    description: "Files, investigates and adjudicates violations, issues enforcement actions and opens reserve holds."
    identity: opaque
    exclusive_operations:
      - "POST /violations/{id}/open-investigation"
      - "POST /violations/{id}/adjudicate"
      - "POST /enforcement-actions"
      - "POST /disbursement-holds"
    shared_operations:
      - "POST /violations"
      - "POST /sellers/{id}/health-evaluations"
      - "GET /sellers, GET /sellers/{id}, GET /sellers/{id}/metric-snapshots, GET /sellers/{id}/listings"
      - "GET /health-evaluations, GET /health-evaluations/{id}, GET /violations, GET /violations/{id}, GET /enforcement-actions, GET /enforcement-actions/{id}"
      - "GET /disbursement-holds, GET /disbursement-holds/{id}, GET /related-account-links, GET /related-account-links/{id}, GET /policy-rules"

  - name: AppealReviewer
    description: "Decides first-level appeals; may never be the investigator who issued the action under appeal."
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{id}/start-review"
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "GET /sellers, GET /sellers/{id}, GET /sellers/{id}/notifications"
      - "GET /health-evaluations, GET /health-evaluations/{id}, GET /violations, GET /violations/{id}, GET /enforcement-actions, GET /enforcement-actions/{id}"
      - "GET /appeals, GET /appeals/{id}, GET /plans-of-action, GET /plans-of-action/{id}, GET /policy-rules"

  - name: ComplianceOfficer
    description: "Owns the policy catalogue, the metric feed, seller funds, plan-of-action review, escalation decisions and related-account adjudication; may never be the appeal decider or the issuing investigator on the same case."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /policy-rules"
      - "POST /metric-snapshots"
      - "POST /sellers/{id}/proceeds-credits"
      - "POST /plans-of-action/{id}/review"
      - "POST /appeals/{id}/escalation-decision"
      - "POST /disbursement-holds/{id}/release"
      - "POST /disbursement-holds/{id}/forfeit"
      - "POST /related-account-links/{id}/adjudicate"
    shared_operations:
      - "POST /violations"
      - "POST /sellers/{id}/health-evaluations"
      - "every GET endpoint except GET /sellers/{id}/metric-snapshots is shared with the other operator roles; GET /sellers/{id}/metric-snapshots is shared with Seller and PolicyInvestigator"
