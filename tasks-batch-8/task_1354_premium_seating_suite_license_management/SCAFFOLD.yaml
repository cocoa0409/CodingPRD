      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /api/waitlist-entries/{id}/set_status {target_status: WITHDRAWN}"
        actor: AccountHolder | PremiumSalesRep
        preconditions: ["AccountHolder caller must own entry.account_id"]
        side_effects: []
      - from: WAITING
        to: EXPIRED
        trigger: "system (season settle sweep when target_season_id == settled season)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/assessments/{id}/set_status {target_status: PROPOSED}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/assessments/{id}/set_status {target_status: APPROVED}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/assessments/{id}/set_status {target_status: CANCELLED}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/assessments/{id}/set_status {target_status: CANCELLED}"
        actor: StadiumAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: LEVIED
        trigger: "POST /api/assessments/{id}/levy"
        actor: FinanceController | StadiumAdmin
        preconditions:
          - "venue has >= 1 suite in LICENSED status (else ERR_NO_LICENSED_SUITES)"
        side_effects:
          - "levied_at = clock; shares computed per assessment_share_allocation over LICENSED suites"
          - "one ASSESSMENT invoice per licensed suite's current agreement account (ISSUED, due_on = clock + 60d); each account balance_due_cents recomputes upward"
      - from: LEVIED
        to: SETTLED
        trigger: "system (automatic when every spawned ASSESSMENT invoice is PAID or VOID)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC only; serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: renewal-offer-create-stale-agreement
    parent_entity: LicenseAgreement
    write_endpoint: "POST /api/renewal-offers"
    occ_field: expected_agreement_version
    description: |
      Creating a RenewalOffer against a LicenseAgreement whose version has advanced
      since the client last observed it is rejected. Creating an offer legitimately
      supersedes the agreement's current OFFERED/REVISED offer and bumps the
      agreement's version, so a second create carrying the pre-supersede version is
      working from a stale view of the agreement.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: catering-order-amend-stale
    parent_entity: CateringOrder
    write_endpoint: "PATCH /api/catering-orders/{id}"
    occ_field: expected_catering_order_version
    description: |
      Amending a CateringOrder whose version has advanced since the client last
      observed it is rejected. Each successful amendment recomputes totals and bumps
      the order's version, so an amendment carrying an older version would silently
      overwrite another writer's line changes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: account-profile-update-stale
    parent_entity: Account
    write_endpoint: "PATCH /api/accounts/{id}"
    occ_field: expected_account_version
    description: |
      Updating an Account profile whose version has advanced since the client last
      observed it is rejected. Status changes and cascade-driven recomputes bump the
      account's version, so a profile edit carrying an older version is working from
      a stale view of the account.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: license_fee_schedule
    trigger: "LicenseAgreement PENDING_EXECUTION -> ACTIVE (execute)"
    algorithm: chronological
    formula: |
      CANONICAL (rounded_step): fee[1] = base_annual_fee_cents;
        fee[k] = round_half_up(fee[k-1] * (1 + escalator_bp / 10000))  for k = 2..term_seasons
      i.e. each season's fee compounds on the PREVIOUS SEASON'S ALREADY-ROUNDED fee.
      result: fee_schedule_cents = [fee[1], ..., fee[term]]
    input_set: "the agreement being executed"
    constants:
      ROUNDING: "round_half_up to whole cents, applied at EVERY season step"
    precision: "integer cents, round_half_up per step"
    variants:
      - name: rounded_step
        when: "canonical - what the server computes and stores"
        difference: "compounds on rounded per-season fees"
      - name: base_indexed
        when: "naive reading: fee[k] = round_half_up(base * (1+esc)^(k-1))"
        difference: "rounds once from base; diverges from rounded_step from season 3 onward for most base/escalator pairs (e.g. base=5001208, esc=625bp: season 3 = 5645896 vs 5645895, season 4 = 5998765 vs 5998763)"

  - name: first_season_proration
    trigger: "LicenseAgreement execute when executed_on > start season's starts_on"
    algorithm: forward_looking
    formula: |
      covered(season) = events of that season with event_type in {REGULAR, RIVALRY}
        and status != CANCELLED (at execute time, forward-looking: SCHEDULED events count)
      remaining = count of covered events with starts_at >= executed_on
      total = count of all covered events in the start season
      prorated_fee = round_half_up(fee_schedule_cents[1] * remaining / total)
      prorated_f_b_minimum = round_half_up(f_b_minimum_cents * remaining / total)
      (same remaining/total ratio drives both; the prorated F&B minimum is what the
       season-settle shortfall compares accruals against for mid-season executions)
    input_set: "events of the agreement's start season"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: forward_looking_at_execute
        when: "canonical at execute time"
        difference: "counts SCHEDULED (not-yet-cancelled) covered events"
      - name: settled_true_up
        when: "at season settle, shortfall uses the same ratio recomputed with CANCELLED events excluded from BOTH numerator and denominator; if an event was cancelled after execution the ratio shifts and the settle shortfall reflects the settled ratio"
        difference: "CANCELLED events drop out of the ratio at settle time; identical when no cancellations occurred"

  - name: f_b_minimum_accrual
    trigger: "CateringOrder confirm/cancel transitions (incremental) and POST /api/seasons/{id}/settle (full sweep)"
    algorithm: aggregation
    formula: |
      accrued(agreement, season) = SUM over CateringOrder where
        order.agreement_id == agreement.id AND order.event_id in events(season) AND
        order.status in {CONFIRMED, FULFILLED}:  order.subtotal_cents          (NET: excludes service_fee_cents)
        order.status == CANCELLED_LATE:          order.cancel_fee_cents
        order.status in {PLACED, DRAFT, CANCELLED}: 0 (excluded)
      prorated_minimum = (agreement.executed_on <= season.starts_on)
        ? agreement.f_b_minimum_cents
        : round_half_up(f_b_minimum_cents * remaining_covered / total_covered)   # per first_season_proration, settled ratio
      shortfall_cents = max(0, prorated_minimum - accrued)
      if shortfall_cents > 0: create F_B_SHORTFALL invoice (ISSUED, due_on = clock + 30d)
    input_set: "agreements covering the settled season with status in {ACTIVE, SUSPENDED, EXPIRING}; their catering orders in the states listed above"
    constants: {}
    precision: "integer cents"
    variants:
      - name: net_of_service_fee
        when: "canonical"
        difference: "accrual = subtotal_cents only; the 18% service fee never counts toward the minimum"
      - name: gross_accrual
        when: "naive reading: the full total_cents (incl. service fee) counts"
        difference: "accrual = total_cents; overstates progress toward the minimum by exactly service_fee_cents per order (e.g. subtotal 9400, fee 1692: net 9400 vs gross 11092)"

  - name: catering_order_total
    trigger: "CateringOrder create and amend (PATCH)"
    algorithm: tiered_pricing
    formula: |
      PINNED ORDER (per-line-then-sum):
        line_cents[i] = round_half_up(quantity[i] * unit_price_cents[i] * (1 - discount_pct[i]))
        subtotal_cents = SUM(line_cents[i])                # sum of already-rounded lines
        service_fee_cents = round_half_up(subtotal_cents * SERVICE_FEE_RATE)
        total_cents = subtotal_cents + service_fee_cents
      The alternative (sum raw fractional line amounts, round once at the end) is the
      trap: it yields different cents (fixture: two lines of qty 3 @ 999 with 15% off:
      pinned 2547+2547 = 5094; sum-then-round = round_half_up(5094.90) = 5095).
    input_set: "the order's lines"
    constants:
      SERVICE_FEE_RATE: 0.18
    precision: "integer cents, round_half_up at each pinned step"

  - name: rental_price_quote
    trigger: "SingleEventRental creation (POST /api/rentals)"
    algorithm: tiered_pricing
    formula: |
      tier_mult = {FOUNDERS: 1.60, PLATINUM: 1.30, GOLD: 1.00, SILVER: 0.80}[suite.tier]
      overage_cents = max(0, guest_count - suite.capacity_seats) * PER_GUEST_OVERAGE_CENTS
      playoff_mult = 1.25 if event.event_type == PLAYOFF else 1.00
      quoted_price_cents = round_half_up((event.rental_base_price_cents * tier_mult + overage_cents) * playoff_mult)
      deposit_cents = round_half_up(quoted_price_cents * DEPOSIT_RATE)
      (single rounding at the end of the quoted formula; deposit rounds separately)
    input_set: "the rental's event, suite, guest_count"
    constants:
      PER_GUEST_OVERAGE_CENTS: 1500
      DEPOSIT_RATE: 0.30
      PLAYOFF_MULT: 1.25
    precision: "integer cents, round_half_up"

  - name: transfer_fee
    trigger: "TransferRequest SUBMITTED -> UNDER_REVIEW (computed once, frozen on the request)"
    algorithm: tiered_pricing
    formula: |
      elapsed_fraction = agreement.current_season_index / agreement.term_seasons
      SALE_TRANSFER:
        pct = 0.10 if elapsed_fraction < 0.25
              0.06 if 0.25 <= elapsed_fraction < 0.75
              0.03 if elapsed_fraction >= 0.75        (boundary: exactly 0.25 -> 0.06; exactly 0.75 -> 0.03)
        remaining_value = SUM(agreement.fee_schedule_cents[k]) for k > current_season_index
        fee = max(FLAT_MIN_CENTS, round_half_up(pct * remaining_value))
      SUBLEASE:
        fee = max(FLAT_MIN_CENTS, round_half_up(0.05 * asking_price_cents))
    input_set: "the transfer request and its agreement (schedule + current season index at review time)"
    constants:
      FLAT_MIN_CENTS: 50000
    precision: "integer cents, round_half_up"

  - name: early_termination_fee
    trigger: "LicenseAgreement ACTIVE/SUSPENDED -> TERMINATED"
    algorithm: constraint_propagation
    formula: |
      cur = fee_schedule_cents[current_season_index]
      remaining_after_current = SUM(fee_schedule_cents[k]) for k > current_season_index
      fee = max(2 * cur, round_half_up(0.5 * remaining_after_current))
      Creates a TERMINATION_FEE invoice (ISSUED, due clock+30d). When current season is
      the last covered season, remaining_after_current = 0 and the fee is 2 * cur.
    input_set: "the agreement being terminated"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: late_fee_accrual
    trigger: "every read of an Invoice in {ISSUED, PARTIALLY_PAID} and the season settle sweep"
    algorithm: threshold
    formula: |
      days_overdue = floor((clock - due_on) / 86400s); negative clamps to 0
      fee_periods = floor(days_overdue / 30); charged only when days_overdue >= 30
        (boundary: day 29 -> 0, day 30 exactly -> 1 period)
      raw = round_half_up(invoice.subtotal_cents * PERIOD_RATE * fee_periods)
      late_fee_cents = fee_periods == 0 ? 0 : max(MIN_FEE_CENTS, min(raw, round_half_up(subtotal_cents * CAP_RATE)))
      amount_due_cents = subtotal_cents + late_fee_cents - amount_paid_cents (floor 0)
    input_set: "the invoice (subtotal, due_on, amount_paid) and the logical clock"
    constants:
      PERIOD_RATE: 0.015
      CAP_RATE: 0.15
      MIN_FEE_CENTS: 2500
      PERIOD_DAYS: 30
    precision: "integer cents, round_half_up"

  - name: waitlist_priority_score
    trigger: "every read of a WaitlistEntry and on WAITING -> OFFERED promotion checks"
    algorithm: weighted_scoring
    formula: |
      waiting_periods = min(floor((clock - entry.created_at) / 30 days), 10)
      spend_points = min(floor(account.lifetime_spend_cents / 100000), 50)
      corporate_flag = 1 if account.account_type == CORPORATE else 0
      priority_score = round(0.5 * waiting_periods + 0.3 * spend_points + 2.0 * corporate_flag, 4)
      PROMOTION SELECTOR (deterministic):
        eligibility: entry.status == WAITING AND entry.desired_tier == candidate suite.tier
          AND (entry.target_season_id IS NULL OR target season.starts_on > clock)
        ranking: priority_score DESC
        tie-break 1: entry.created_at ASC (earlier join wins)
        tie-break 2: account.created_at ASC
        empty pool: ERR_NOT_NEXT_IN_LINE is not raised; promotion is simply impossible
          (a promote call naming a non-top entry fails with ERR_NOT_NEXT_IN_LINE)
    input_set: "the entry, its account, the logical clock"
    constants:
      WAITING_POINTS_PER_30D: 0.5
      WAITING_CAP_PERIODS: 10
      SPEND_POINTS_PER_1000_DOLLARS: 0.3
      SPEND_CAP_POINTS: 50
      CORPORATE_BONUS: 2.0
    precision: "score rounded to 4 decimal places"

  - name: assessment_share_allocation
    trigger: "POST /api/assessments/{id}/levy (Assessment APPROVED -> LEVIED)"
    algorithm: waterfall_allocation
    formula: |
      eligible suites = suites of the venue with status == LICENSED at levy time,
        ordered by suite.created_at ASC (stable order for remainder distribution)
      PER_SUITE_EQUAL:
        share[i] = floor(total_cost_cents / n); remainder = total - n*floor(total/n)
        the first `remainder` suites in created_at order each receive +1 cent
      BY_SEAT:
        raw[i] = total_cost_cents * suite[i].capacity_seats / SUM(capacity_seats over eligible)
        share[i] = floor(raw[i]); leftover cents distributed +1 each by LARGEST
        fractional part (raw[i] - floor(raw[i])) DESC, ties by suite.created_at ASC
      one ASSESSMENT invoice per eligible suite, billed to the account of the suite's
        current agreement (suite.current_agreement_id -> agreement.account_id)
    input_set: "venue's LICENSED suites at levy; their current agreements' accounts"
    constants: {}
    precision: "integer cents; floor for base shares; remainder rules pinned above"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role value is one of the five declared roles", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path template ids resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: auth, check: "AccountHolder scope: X-User-ID must equal the target resource's owning account (agreement.account_id / rental.account_id / payment.account_id / transfer.from_account_id / waitlist.account_id / credential-order-owning account); staff roles are exempt", error_id: ERR_ACCOUNT_SCOPE_VIOLATION, http_status: 403, applies_to: "all endpoints with AccountHolder in roles, on single-resource access and mutations" }
  - { priority: 5, category: existence, check: "Body-supplied FK ids (suite_id, account_id, event_id, season_id, agreement_id, rental_id, allocation invoice_ids, etc.) resolve", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creation endpoints and PATCH" }
  - { priority: 6, category: business_constraint, check: "Request body well-formed: required fields present, enums in domain, integers positive where required, amount_cents == sum(allocations) on payments, exactly one of agreement_id/rental_id on catering-orders and credentials, to_account_id != from_account_id; referential consistency: agreement.suite_id == body suite_id, rental.suite_id == body suite_id and rental.event_id == body event_id, agreement-context catering/credentials require a license-covered event (event_type in {REGULAR, RIVALRY} and event's season among the agreement's covered seasons)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutation endpoints" }
  - { priority: 7, category: state, check: "Target resource is in a valid from-state for the requested transition (set_status target reachable per the entity's state machine)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all set_status/action endpoints" }
  - { priority: 8, category: state, check: "Guard states, evaluated in this fixed sub-order: (i) account must not be SUSPENDED for new commitments (agreement execute, rental HELD, catering place, credential issue, waitlist join) -> ERR_ACCOUNT_SUSPENDED; (ii) event must be SCHEDULED for catering place/confirm and credential issue/activate -> ERR_EVENT_NOT_SCHEDULED; (iii) agreement must be ACTIVE for catering place/confirm (agreement context), credential issue (agreement context) and transfer approve -> ERR_AGREEMENT_NOT_ACTIVE; (iv) rental must be CONFIRMED for catering place and credential issue (rental context) -> ERR_AGREEMENT_NOT_ACTIVE is NOT used here; a non-CONFIRMED rental context fails ERR_INVALID_STATE_TRANSITION", error_id: "ERR_ACCOUNT_SUSPENDED | ERR_EVENT_NOT_SCHEDULED | ERR_AGREEMENT_NOT_ACTIVE | ERR_INVALID_STATE_TRANSITION", http_status: 409, applies_to: "dependent-operation endpoints" }
  - { priority: 9, category: business_temporal, check: "Season not SETTLED for writes scoped to it (agreement execute with settled start season, invoice void with settled season_id)", error_id: ERR_SEASON_LOCKED, http_status: 409, applies_to: "agreement execute, invoice void" }
  - { priority: 10, category: business_temporal, check: "Catering cutoff: clock <= event.starts_at - effective cutoff hours for place/confirm/free-cancel (boundary: exactly at cutoff passes)", error_id: ERR_CATERING_CUTOFF_PASSED, http_status: 409, applies_to: "POST /api/catering-orders, catering set_status CONFIRMED/CANCELLED routing" }
  - { priority: 11, category: business_temporal, check: "Renewal window: clock within [renewal_window_opens_on, renewal_window_closes_on] (both inclusive) of the agreement's last covered season", error_id: ERR_RENEWAL_WINDOW_CLOSED, http_status: 409, applies_to: "POST /api/renewal-offers" }
  - { priority: 12, category: business_temporal, check: "Rental hold: confirm requires clock <= hold_expires_at; expire requires clock > hold_expires_at", error_id: "ERR_HOLD_EXPIRED | ERR_HOLD_NOT_EXPIRED", http_status: 409, applies_to: "POST /api/rentals/{id}/set_status" }
  - { priority: 13, category: business_temporal, check: "Credential activation window: clock within [starts_at - 4h, starts_at + duration_hours]", error_id: ERR_CREDENTIAL_WINDOW, http_status: 409, applies_to: "POST /api/credentials/{id}/set_status ACTIVATED" }
  - { priority: 14, category: business_constraint, check: "Suite availability for rentals (set-membership): no {HELD, CONFIRMED} rental on same (suite,event); REGULAR/RIVALRY events additionally blocked when an agreement in {ACTIVE, SUSPENDED, EXPIRING} covers that season for the suite; suite not OUT_OF_SERVICE", error_id: ERR_SUITE_NOT_AVAILABLE, http_status: 409, applies_to: "POST /api/rentals, rental set_status HELD/CONFIRMED" }
  - { priority: 15, category: business_constraint, check: "Agreement suite exclusivity: no overlapping covered-season agreement in {PENDING_EXECUTION, ACTIVE, SUSPENDED, EXPIRING} on the same suite", error_id: ERR_SUITE_ALREADY_LICENSED, http_status: 409, applies_to: "agreement execute" }
  - { priority: 16, category: business_constraint, check: "Event overlap (half-open intervals): no other SCHEDULED event on the same venue with [starts_at, starts_at+duration_hours) intersecting the new event's interval; adjacency (end == start) is allowed", error_id: ERR_EVENT_OVERLAP, http_status: 409, applies_to: "POST /api/events" }
  - { priority: 17, category: business_constraint, check: "Credential capacity: count of credentials in {ISSUED, ACTIVATED} for (event_id, suite_id) < suite.capacity_seats (issuing credential #capacity succeeds, #capacity+1 fails)", error_id: ERR_CREDENTIAL_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /api/credentials" }
  - { priority: 18, category: business_constraint, check: "Guest uniqueness: guest_email unique per (event_id, suite_id) among credentials not in {REVOKED, EXPIRED}", error_id: ERR_DUPLICATE_GUEST, http_status: 409, applies_to: "POST /api/credentials" }
  - { priority: 19, category: business_constraint, check: "Waitlist uniqueness: no other non-terminal entry (WAITING/OFFERED) for same (account_id, desired_tier, target_season_id)", error_id: ERR_WAITLIST_DUPLICATE, http_status: 409, applies_to: "POST /api/waitlist-entries" }
  - { priority: 20, category: business_constraint, check: "Transfer exclusivity/eligibility: no other transfer for the same agreement in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}; to_account ACTIVE; SUBLEASE target not BROKER", error_id: "ERR_TRANSFER_ALREADY_PENDING | ERR_TRANSFER_TARGET_INELIGIBLE", http_status: 409, applies_to: "POST /api/transfer-requests, transfer set_status APPROVED" }
  - { priority: 21, category: business_constraint, check: "Suite lifecycle guards: OUT_OF_SERVICE blocked while LICENSED; promote/convert require suite AVAILABLE and tier match; no outstanding OFFERED waitlist entry on the suite", error_id: "ERR_SUITE_LICENSED | ERR_SUITE_NOT_AVAILABLE | ERR_SUITE_OFFER_PENDING | ERR_NOT_NEXT_IN_LINE", http_status: 409, applies_to: "suite set_status, waitlist set_status" }
  - { priority: 22, category: business_referential, check: "Invoice void blocked by payments in {INITIATED, CLEARED} allocating to it; rental CONFIRMED cancel blocked unless its RENTAL invoice is ISSUED", error_id: "ERR_INVOICE_HAS_PAYMENTS | ERR_RENTAL_SETTLEMENT_REQUIRED", http_status: 409, applies_to: "invoice void, rental cancel" }
  - { priority: 23, category: business_fiscal, check: "Credit gates: account.credit_standing != HOLD for agreement execute and rental confirm; agreement/account have no past-due invoices for transfer approve and agreement cure/terminate", error_id: "ERR_ACCOUNT_CREDIT_HOLD | ERR_UNSETTLED_BALANCE", http_status: 409, applies_to: "agreement execute/cure/terminate, rental confirm, transfer approve/complete" }
  - { priority: 24, category: business_fiscal, check: "Allocation caps: per-invoice allocation <= amount_due_cents; allocated invoices belong to payment account", error_id: "ERR_ALLOCATION_EXCEEDS_DUE | ERR_ALLOCATION_ACCOUNT_MISMATCH", http_status: 422, applies_to: "POST /api/payments" }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Ops / test-driving ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads that default and never falls back to wall-clock time."
    roles: [StadiumAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All clock-derived computations (late fees, cutoffs, hold expiry, windows) evaluate against this logical clock"]

  # --- Venue ---
  - { method: POST, path: "/api/venues", description: "Create a venue", roles: [StadiumAdmin], code: 201, input: [name, address, "default_catering_cutoff_hours?"], output: Venue, side_effects: [] }
  - { method: GET, path: "/api/venues/{id}", description: "Get a venue", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: [], output: Venue, side_effects: [] }

  # --- Suite ---
  - { method: POST, path: "/api/suites", description: "Create a suite in a venue (status AVAILABLE)", roles: [StadiumAdmin], code: 201, input: [venue_id, suite_code, tier, capacity_seats, base_annual_fee_cents, f_b_minimum_cents], output: Suite, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/api/suites/{id}", description: "Get a suite", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: [], output: Suite, side_effects: [] }
  - { method: GET, path: "/api/suites", description: "List suites (paginated)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["venue_id?", "status?", "tier?", "limit?", "offset?"], output: "Suite[]", side_effects: [] }
  - { method: POST, path: "/api/suites/{id}/set_status", description: "Toggle suite service status (AVAILABLE <-> OUT_OF_SERVICE)", roles: [StadiumAdmin], code: 200, input: [target_status], output: Suite, side_effects: ["status transition per Suite machine; ERR_SUITE_LICENSED when LICENSED"] }

  # --- Season ---
  - { method: POST, path: "/api/seasons", description: "Create a season (DRAFT)", roles: [StadiumAdmin], code: 201, input: [venue_id, label, starts_on, ends_on, renewal_window_opens_on, renewal_window_closes_on], output: Season, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/api/seasons/{id}", description: "Get a season", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: [], output: Season, side_effects: [] }
  - { method: GET, path: "/api/seasons", description: "List seasons (paginated)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["venue_id?", "status?", "limit?", "offset?"], output: "Season[]", side_effects: [] }
  - { method: POST, path: "/api/seasons/{id}/publish", description: "Publish a season (DRAFT -> PUBLISHED)", roles: [StadiumAdmin], code: 200, input: [], output: Season, side_effects: ["status -> PUBLISHED"] }
  - { method: POST, path: "/api/seasons/{id}/settle", description: "Settle a season (PUBLISHED -> SETTLED): F&B shortfall invoices, credit/standing cascade, term bookkeeping, expiry sweep", roles: [FinanceController, StadiumAdmin], code: 200, input: [], output: Season, side_effects: ["see Season machine settle transition and f_b_minimum_accrual calc"] }

  # --- Event ---
  - { method: POST, path: "/api/events", description: "Create an event in a season (SCHEDULED); half-open overlap check per venue", roles: [StadiumAdmin], code: 201, input: [season_id, name, event_type, starts_at, "duration_hours?", rental_base_price_cents, "catering_cutoff_hours?"], output: Event, side_effects: ["status=SCHEDULED"] }
