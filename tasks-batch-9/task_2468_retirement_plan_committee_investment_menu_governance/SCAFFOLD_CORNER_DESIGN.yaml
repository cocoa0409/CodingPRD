            - "ServiceProviderEngagement.${eng_aud_id}: head_cost_bps 30.00 plus asset_based 15 -> gross_cost_bps 45.00, fee_credit_tier TIER_B at its inclusive ceiling, rfp_required false at percentile 74"
            - "ServiceProviderEngagement.${eng_cus_id}: head_cost_bps 60.00 plus 10 -> gross_cost_bps 70.00, fee_credit_tier TIER_C, total_cost_bps 70.00, rfp_required true on the total > 60.00 arm, and status is UNDER_RFP — PENDING -> ACTIVE then the system ACTIVE -> UNDER_RFP hop both happened in the one call"
            - "the ${eng_aud_id} repeat benchmark returned 409 with data.error_id == ERR_BENCHMARK_ALREADY_CURRENT and left benchmark_percentile at 74, gross_cost_bps at 45.00 and rfp_required false — the guard is same-quarter, not same-value"
            - "the ${eng_np_id} benchmark returned 422 with data.error_id == ERR_NO_PLAN_ASSETS: the second plan has no seated funds so total_plan_assets_cents is 0, and the engagement is still PENDING with every cost field null"
            - "the ${eng_rk_id} re-benchmark at fiscal_quarter_index 1 returned 200 with gross_cost_bps still 25.00 and fee_credit_tier still TIER_A, but rfp_required true and status UNDER_RFP — percentile 75 triggers on the inclusive >= arm with no fee change at all"
            - "the filtered list returns exactly ${eng_cus_id} and ${eng_rk_id}, the two rfp_required rows, and neither ${eng_adv_id} nor ${eng_aud_id}"
            - "for all six benchmarks total_cost_bps == gross_cost_bps, because Plan.revenue_credit_balance_cents is 0 and the offset is applied only above zero — the tier is still recorded, exactly as the pass-B rule requires"
            - "STRUCTURAL NOTE recorded, not asserted: no endpoint on this scaffold ever increases Plan.revenue_credit_accrued_cents, so revenue_credit_balance_cents can never exceed 0 and offset_bps is unobservably always 0.00. The pass-order defence (tier from gross, never from total) therefore has no reachable counter-example, and the §1.3 claim that the same engagement can flip rfp_required across quarters through the offset alone is unreachable."
            - "SPEC CONFLICT recorded, not asserted: benchmark_percentile is typed integer 1..100 while §1.3 states the trigger as >= 75.00 and its boundary note uses 74.99 — the sub-integer boundary is unrepresentable, so 74 and 75 are the only adjacent values testable."

      - name: the_capacity_triple_sums_to_six_through_reserve_block_and_exact_restoration
        claim_type: Input Set Filtering
        grounds:
          - calculations.menu_slot_capacity
          - validations.priority_80_ERR_MENU_CAPACITY_EXHAUSTED
          - endpoints.POST_/governance/fund-replacements/{proposalId}/rescind-approval
        distinguishing_aspect: "occupied + reserved + available == menu_slot_capacity holds at all five observation points while the reservation moves the last free slot out of reach: approving a replacement takes available to 0, a seat-fund into a brand-new sixth slot is then refused at priority 80, and rescinding the approval restores the triple bit-for-bit so the identical seat-fund now succeeds. An EMPTY slot proves it is not counted by occupied — creating the slot never moves a counter."
        test_recipe:
          setup:
            - "chain_l3 is replayed: menu_slot_capacity 6 with occupied 5, reserved 0, available 1."
            - "The trigger head replays the chain_l5 calls up to and including the approval, so the large-cap slot is PENDING_REPLACEMENT and one slot is reserved."
            - "A sixth slot in a fresh asset class and a matching CANDIDATE fund are created for the capacity-exhausted attempt; the (plan_id, asset_class_code, designation) triple is new so no duplicate fires."
          setup_api_calls:
            - *chain_l3
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "EMGIX", fund_name: "Granite Emerging Markets Index", asset_class_code: "EMERGING_MKTS", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 42, net_expense_ratio_bps: 42, revenue_share_bps: 0, peer_median_expense_bps: 45, track_record_quarters: 40, manager_tenure_quarters: 22, manager_change_flag: false, style_drift_r2: 0.9100, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_emg_id: $.data.id }
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "EMERGING_MKTS", designation: "SPECIALTY", slot_index: 6 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_emg_id: $.data.id }
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          trigger:
            - *b_plan_v_read
            - *b_prop_lc
            - *b_prop_submit
            - *b_meet3
            - *b_meet3_convene
            - *b_motion_prop
            - *b_vote_prop_chair
            - *b_vote_prop_fin
            - *b_vote_prop_hr
            - *b_motion_prop_close
            - *b_meet3_adjourn
            - *b_meet3_minutes
            - *b_prop_approve
            - call: "POST /governance/asset-class-slots/${slot_emg_id}/seat-fund"
              payload: { fund_id: "${fund_emg_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements/${prop_lc_id}/rescind-approval"
              payload: { reason: "Committee deferred the large-cap change pending a share-class negotiation" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/asset-class-slots/${slot_emg_id}/seat-fund"
              payload: { fund_id: "${fund_emg_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "after the sixth slot was created the plan still reads occupied 5 / reserved 0 / available 1, summing to 6 — an EMPTY slot is outside all three counts, so slot creation is capacity-neutral"
            - "AssetClassSlot.${slot_emg_id} was created with status EMPTY, current_fund_id null and ips_id pinned to the ADOPTED IPS-2026-A"
            - "after the approval: occupied 5 / reserved 1 / available 0, still summing to 6; AssetClassSlot.${slot_lc_id}.status == PENDING_REPLACEMENT with current_fund_id still ${fund_lc_a_id}"
            - "the first seat-fund returned 409 with data.error_id == ERR_MENU_CAPACITY_EXHAUSTED; Fund.${fund_emg_id} is still CANDIDATE, the slot is still EMPTY and no counter moved — the write is refused before any field changes"
            - "the rescind returned 200: FundReplacementProposal.${prop_lc_id}.status == UNDER_REVIEW with approving_motion_id null, and AssetClassSlot.${slot_lc_id}.status == ACTIVE because the seated fund's watch_status is CLEAR"
            - "the triple after the rescind is occupied 5 / reserved 1 - 1 == 0 / available 0 + 1 == 1 — bit-identical to its pre-approve values, which is what 'exact restoration' means"
            - "the second seat-fund returned 200: AssetClassSlot.${slot_emg_id}.status == ACTIVE with current_fund_id ${fund_emg_id}, Fund.${fund_emg_id}.menu_status == ACTIVE and credit_accrual_status == ACCRUING"
            - "final triple occupied 6 / reserved 0 / available 0, still summing to menu_slot_capacity 6, and Plan.${plan_id}.total_plan_assets_cents is still 1200000000 because EMGIX carries no assets"
            - "Motion.${motion_prop_id} is still CARRIED after the rescind — the carried motion is spent, not reopened, so a re-approval needs a fresh motion"

  # =====================================================================
  # 4. VALIDATIONS — the 39-rule priority ladder, its ordering pairs and
  #    the patterns (priority conflict, cross-entity, temporal, aggregate,
  #    conditional, cascading) from the claim-extraction guide.
  # =====================================================================
  - section: validations
    instances:

      - name: the_auth_and_existence_ladder_answers_in_priority_order_not_in_request_order
        claim_type: Priority Ordering
        grounds:
          - validations.priority_10_ERR_MISSING_USER_CONTEXT
          - validations.priority_20_ERR_ROLE_NOT_PERMITTED
          - validations.priority_25_ERR_ACTOR_NOT_COMMITTEE_MEMBER
          - validations.priority_27_ERR_ACTOR_NOT_SELF
          - validations.priority_30_ERR_RESOURCE_NOT_FOUND
          - validations.priority_35_ERR_CROSS_PLAN_REFERENCE
        distinguishing_aspect: "Seven calls each violate two or more rules at once and every one must answer with the numerically lowest priority: a headerless call to a nonexistent motion is 400 not 404; a Recordkeeper hitting the votes endpoint is 403 ERR_ROLE_NOT_PERMITTED not 404; a CommitteeMember header carrying a consultant's user id is 403 ERR_ACTOR_NOT_COMMITTEE_MEMBER; a vote naming a nonexistent member_id is 403 ERR_ACTOR_NOT_SELF not 404; and a seat-fund naming another plan's fund is 422 ERR_CROSS_PLAN_REFERENCE while the same call with a fabricated id is 404."
        test_recipe:
          setup:
            - "chain_l3 is replayed, then a sixth EMPTY slot is added (available_menu_slots is 1, so capacity is not the binding constraint) and a second plan with its own fund is created to supply a foreign reference."
            - "A real quorate meeting with one OPEN motion is left in session so the self-vote rule has a live target."
            - "The chair's seat_class is CHAIR; the finance member's is FINANCE, which is what makes a CommitteeChair header carrying the finance member's id fail rule 25."
          setup_api_calls:
            - *chain_l3
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "EMERGING_MKTS", designation: "SPECIALTY", slot_index: 6 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_emg_id: $.data.id }
            - call: "POST /governance/plans"
              payload: { plan_name: "Foreign Reference Test Plan", plan_sponsor_name: "Elsewhere Holdings", erisa_covered: true, participant_account_count: 300, menu_slot_capacity: 3, quorum_min_voting_members: 3, voting_threshold_pct: 0.6000, max_voting_seats: 5 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { plan_fx_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_fx_id}", ticker: "EMGIX", fund_name: "Elsewhere Emerging Markets Index", asset_class_code: "EMERGING_MKTS", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 42, net_expense_ratio_bps: 42, revenue_share_bps: 0, peer_median_expense_bps: 45, track_record_quarters: 40, manager_tenure_quarters: 22, manager_change_flag: false, style_drift_r2: 0.9100, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_fx_id: $.data.id }
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-22", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet_auth_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet_auth_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet_auth_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_small_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
              captures: { motion_auth_id: $.data.id }
          trigger:
            - call: "POST /governance/motions/m-00000000-0000-0000-0000-000000000000/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: "(X-User-Role header omitted)"
              as_user_id: "(X-User-ID header omitted)"
            - call: "POST /governance/motions/m-00000000-0000-0000-0000-000000000000/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: Recordkeeper
              as_user_id: "rk-1"
            - call: "POST /governance/motions/m-00000000-0000-0000-0000-000000000000/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "ic-1"
            - call: "POST /governance/committee-meetings/${meet_auth_id}/adjourn"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/motions/${motion_auth_id}/votes"
              payload: { member_id: "cm-00000000-0000-0000-0000-000000000000", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/motions/m-00000000-0000-0000-0000-000000000000/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/asset-class-slots/${slot_emg_id}/seat-fund"
              payload: { fund_id: "f-00000000-0000-0000-0000-000000000000" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/asset-class-slots/${slot_emg_id}/seat-fund"
              payload: { fund_id: "${fund_fx_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "call 1 returned 400 with data.error_id == ERR_MISSING_USER_CONTEXT — rule 10 beats the nonexistent motion at 30, the unpermitted role at 20 and everything else"
            - "call 2 returned 403 with data.error_id == ERR_ROLE_NOT_PERMITTED: Recordkeeper is not in the votes endpoint's roles list, and that verdict is reached without ever resolving the motion id"
            - "calls 1 and 2 use the same fabricated motion id, so the only thing separating a 400 from a 403 is which header was wrong"
            - "call 3 returned 403 with data.error_id == ERR_ACTOR_NOT_COMMITTEE_MEMBER: CommitteeMember is a permitted role, so rule 20 passes, but ic-1 resolves to no CommitteeMember row on the plan"
            - "call 4 returned 403 with data.error_id == ERR_ACTOR_NOT_COMMITTEE_MEMBER for the opposite reason: ${mem_fin_id} IS a member of the plan, but a CommitteeChair caller's seat.seat_class must be CHAIR and this seat is FINANCE — the meeting is still IN_SESSION afterwards"
            - "call 5 returned 403 with data.error_id == ERR_ACTOR_NOT_SELF, not 404: rule 27 compares member_id to X-User-ID before rule 30 tries to resolve the body's member_id, and Motion.${motion_auth_id} still has for_count == 0"
            - "call 6 returned 404 with data.error_id == ERR_RESOURCE_NOT_FOUND: role, member identity and self-vote all pass, so the missing path id is finally the lowest surviving rule"
            - "call 7 returned 404 with data.error_id == ERR_RESOURCE_NOT_FOUND — the body fund_id resolves to nothing, and rule 30 runs before the cross-plan check at 35"
            - "call 8 returned 422 with data.error_id == ERR_CROSS_PLAN_REFERENCE: the fund exists and matches the slot's asset_class_code exactly, but Fund.${fund_fx_id}.plan_id is ${plan_fx_id} while the slot's is ${plan_id}"
            - "after all eight calls AssetClassSlot.${slot_emg_id}.status is still EMPTY, Plan.${plan_id} still reads occupied 5 / reserved 0 / available 1, and Plan.${plan_id}.version is unchanged from its post-setup value — no rejected call wrote anything"

      - name: the_state_and_posture_gates_both_outrank_the_optimistic_concurrency_check
        claim_type: Priority Ordering
        grounds:
          - validations.priority_42_ERR_INVALID_STATE_TRANSITION
          - validations.priority_44_ERR_MENU_FROZEN
          - validations.priority_46_ERR_STALE_PLAN_VERSION
        distinguishing_aspect: "Both §1.2.1 concurrency rules sit at priority 46, below the state check at 42 and the posture check at 44, so a doubly-broken request never sees a 412: a stale scorecard aimed at a PENDING_MINUTES review answers 409 ERR_REVIEW_NOT_SCORING, and a stale proposal create against a FROZEN menu answers 409 ERR_MENU_FROZEN. Repeating each call with a perfectly fresh version changes nothing, which proves the 412 was never the reason."
        test_recipe:
          setup:
            - "chain_breach is replayed, which leaves QuarterlyReview ${review_q0_id} in PENDING_MINUTES with five SUBMITTED scorecards and its meeting already MINUTES_APPROVED."
            - "The trigger head then finalizes quarter 0 and retires the TIPS slot, which drives at_risk_slot_ratio to 0.5000 and Plan.menu_posture to FROZEN."
            - "Version 1 is used as the deliberately stale value for both OCC fields; the review and the plan are both far past version 1 by this point."
          setup_api_calls: *chain_breach
          trigger:
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_q0_id}", fund_id: "${fund_tips_id}", expected_review_version: 1, trailing_return_3y_bps: 500, trailing_return_5y_bps: 500, benchmark_return_3y_bps: 500, benchmark_return_5y_bps: 500, peer_rank_pct: 30, style_drift_r2: 0.9600, net_expense_ratio_bps: 12, peer_median_expense_bps: 15, manager_tenure_quarters: 36, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - *b_finalize_q0
            - call: "POST /governance/asset-class-slots/${slot_tips_id}/retire"
              payload: { reason: "TIPS sleeve consolidated into the core bond mandate at the committee's direction." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Challenger share class is eight basis points cheaper with an equivalent mandate and a longer record.", expected_plan_version: 1 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_fresh: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Challenger share class is eight basis points cheaper with an equivalent mandate and a longer record.", expected_plan_version: "${plan_v_fresh}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/quarterly-reviews/${review_q0_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
              captures: { review_v_fresh: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_q0_id}", fund_id: "${fund_tips_id}", expected_review_version: "${review_v_fresh}", trailing_return_3y_bps: 500, trailing_return_5y_bps: 500, benchmark_return_3y_bps: 500, benchmark_return_5y_bps: 500, peer_rank_pct: 30, style_drift_r2: 0.9600, net_expense_ratio_bps: 12, peer_median_expense_bps: 15, manager_tenure_quarters: 36, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/fund-scorecards?review_id=${review_q0_id}&limit=20&offset=0"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "call 1 returned 409 with data.error_id == ERR_REVIEW_NOT_SCORING, NOT 412 ERR_STALE_REVIEW_VERSION — the review is PENDING_MINUTES, which is neither DRAFT, SCORING nor REOPENED, and rule 42 answers before rule 46 ever compares the version"
            - "call 1 wrote nothing: QuarterlyReview.${review_q0_id}.submitted_scorecard_count is still 5 and its version is unchanged"
            - "the finalize returned 200 and the retire returned 200, taking Plan.${plan_id}.menu_posture to FROZEN with at_risk_slot_ratio 0.5000"
            - "call 4 (stale expected_plan_version 1 into a FROZEN menu) returned 409 with data.error_id == ERR_MENU_FROZEN, not 412 — rule 44 outranks rule 46"
            - "call 6 (fresh expected_plan_version) returned the identical 409 ERR_MENU_FROZEN, so satisfying the OCC rule changes nothing: the posture was the reason all along"
            - "Plan.${plan_id}.version == ${plan_v_fresh} after both rejected creates — neither a 409 nor a 412 path bumps the version"
            - "call 8 (fresh expected_review_version on the now COMPLETE review) returned 409 with data.error_id == ERR_REVIEW_NOT_SCORING: finalize moved the review out of the scoreable set for good"
            - "the scorecard list still returns exactly the five rows created by chain_breach — one per seated fund — with no sixth row and no duplicate for ${fund_tips_id}, confirming no partial writes leaked from the three rejections"

      - name: restricted_posture_blocks_only_the_writes_that_touch_an_impaired_slot
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_44_ERR_MENU_FROZEN
          - calculations.menu_posture
          - endpoints.POST_/governance/asset-class-slots/{slotId}/seat-fund
        distinguishing_aspect: "Rule 44 has two different scopes behind one error id: FROZEN blocks every menu-changing write, RESTRICTED blocks only writes touching an AT_RISK or PENDING_REPLACEMENT slot. At ratio 0.4000 the identical create is refused on the AT_RISK international slot and accepted on the ACTIVE large-cap slot in the same breath, and a seat-fund into a brand-new EMPTY slot also goes through — so the posture is neither a global lock nor a no-op."
        test_recipe:
          setup:
            - "chain_breach is replayed and the trigger head finalizes quarter 0: SMLVX and INTDX are impaired, their slots are AT_RISK, three slots stay ACTIVE, at_risk_slot_ratio is 0.4000 and menu_posture is RESTRICTED."
            - "Two CANDIDATE funds are added beforehand so both the blocked and the permitted create have a legal incoming side: INTGX for the international slot and EMGIX for a new emerging-markets slot. LCGRB from chain_l3 serves the large-cap create."
            - "available_menu_slots is 1 after the finalize, so the seat-fund is not capacity-bound."
          setup_api_calls:
            - *chain_breach
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "INTGX", fund_name: "Granite International Developed Index", asset_class_code: "INTL_DEVELOPED", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 28, net_expense_ratio_bps: 28, revenue_share_bps: 0, peer_median_expense_bps: 35, track_record_quarters: 44, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9400, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_intl_b_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "EMGIX", fund_name: "Granite Emerging Markets Index", asset_class_code: "EMERGING_MKTS", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 42, net_expense_ratio_bps: 42, revenue_share_bps: 0, peer_median_expense_bps: 45, track_record_quarters: 40, manager_tenure_quarters: 22, manager_change_flag: false, style_drift_r2: 0.9100, plan_assets_cents: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_emg_id: $.data.id }
            - call: "POST /governance/asset-class-slots"
              payload: { plan_id: "${plan_id}", asset_class_code: "EMERGING_MKTS", designation: "SPECIALTY", slot_index: 6 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { slot_emg_id: $.data.id }
          trigger:
            - *b_finalize_q0
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_restricted: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_intl_id}", outgoing_fund_id: "${fund_intl_id}", incoming_fund_id: "${fund_intl_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "International developed sleeve breached the watch trigger; INTGX is cheaper with a longer record.", expected_plan_version: "${plan_v_restricted}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Challenger share class is eight basis points cheaper with an equivalent mandate and a longer record.", expected_plan_version: "${plan_v_restricted}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_lc_ok_id: $.data.id }
            - call: "POST /governance/fund-replacements/${prop_lc_ok_id}/submit"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/asset-class-slots/${slot_emg_id}/seat-fund"
              payload: { fund_id: "${fund_emg_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
          assert:
            - "the finalize left Plan.${plan_id}.at_risk_slot_ratio == 0.4000 and menu_posture == RESTRICTED, with AssetClassSlot.${slot_intl_id} and ${slot_small_id} AT_RISK and ${slot_lc_id}, ${slot_bond_id}, ${slot_tips_id} ACTIVE"
            - "the create on the AT_RISK international slot returned 409 with data.error_id == ERR_MENU_FROZEN even though the posture is RESTRICTED, not FROZEN — the error id is shared by both scopes of rule 44"
            - "no proposal row exists for ${slot_intl_id} and Plan.${plan_id}.version is still ${plan_v_restricted} after that rejection"
            - "the create on the ACTIVE large-cap slot returned 201 with the same expected_plan_version value — the version was not consumed by the rejected call, which is exactly why the two calls can share it"
            - "FundReplacementProposal.${prop_lc_ok_id} was created DRAFT with revision_round 0, pinned_ips_id == the ADOPTED IPS-2026-A id and notice_lead_days_required 30"
            - "the submit returned 200 and the proposal is UNDER_REVIEW: rule 55 passed because LCGRB clears every IPS criterion (net 38 <= floor(40 * 1.25) == 50, track 32 >= 12, r2 0.9400 >= 0.8000, no manager change), and rule 44 passed because the large-cap slot is ACTIVE"
            - "the seat-fund into the new EMPTY emerging-markets slot returned 200 under the same RESTRICTED posture: an EMPTY slot is neither AT_RISK nor PENDING_REPLACEMENT, so the narrow scope does not reach it"
            - "after all three writes the plan reads occupied 6 / reserved 0 / available 0 and at_risk_slot_ratio == 2 of 6 == 0.3333, still RESTRICTED — seating a healthy fund improved the ratio without changing the rung"
            - "FundReplacementProposal.${prop_small_id} is still BLOCKED throughout: the RESTRICTED posture neither released it nor let a new proposal supersede it"

      - name: interval_algebra_bites_on_engagements_and_is_vacuous_on_seats
        claim_type: Temporal validation
        grounds:
          - validations.priority_66_ERR_SEAT_TERM_OVERLAP
          - validations.priority_67_ERR_ENGAGEMENT_TERM_OVERLAP
          - validations.priority_38_ERR_INVALID_REQUEST
        distinguishing_aspect: "Two closed-interval rules written the same way behave completely differently once the state ladder is layered on top. For engagements the overlap rule is live: a second RECORDKEEPER whose term touches the incumbent's is refused, an abutting term one day later is accepted, and a reversed interval is caught earlier still at priority 38. For seats the overlap rule can never fire — an appointment demands a VACANT seat, and a VACANT seat by construction holds no non-terminal member, so the predecessor is always excluded from the intersection test. The recipe proves it by re-appointing over the exact same dates and getting a 201."
        test_recipe:
          setup:
            - "chain_l3 is replayed: three FILLED voting seats and one PENDING/ACTIVE-capable plan; no engagements exist yet."
            - "An incumbent RECORDKEEPER engagement covering 2026-01-01..2027-12-31 is registered; PENDING status already counts as live for the overlap test."
          setup_api_calls:
            - *chain_l3
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Northgate Retirement Services", provider_role: "RECORDKEEPER", term_start_date: "2026-01-01", term_end_date: "2027-12-31", per_head_fee_cents: 1500, asset_based_bps: 10, benchmark_percentile: 60, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { eng_incumbent_id: $.data.id }
          trigger:
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Lakeview Recordkeeping", provider_role: "RECORDKEEPER", term_start_date: "2027-12-31", term_end_date: "2029-12-31", per_head_fee_cents: 1400, asset_based_bps: 9, benchmark_percentile: 40, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Lakeview Recordkeeping", provider_role: "RECORDKEEPER", term_start_date: "2029-12-31", term_end_date: "2028-01-01", per_head_fee_cents: 1400, asset_based_bps: 9, benchmark_percentile: 40, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Lakeview Recordkeeping", provider_role: "RECORDKEEPER", term_start_date: "2028-01-01", term_end_date: "2029-12-31", per_head_fee_cents: 1400, asset_based_bps: 9, benchmark_percentile: 40, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { eng_successor_id: $.data.id }
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_id}", provider_name: "Lakeview Advisory", provider_role: "ADVISOR", term_start_date: "2026-01-01", term_end_date: "2027-12-31", per_head_fee_cents: 800, asset_based_bps: 5, benchmark_percentile: 40, last_rfp_quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { eng_advisor_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_hr_id}", member_name: "Priya Raghunathan", term_start_date: "2026-07-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members/${mem_hr_id}/end-term"
              payload: { end_term_reason: "RESIGNED", effective_date: "2026-08-15" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_hr_id}", member_name: "Priya Raghunathan", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { mem_hr2_id: $.data.id }
          assert:
            - "call 1 returned 409 with data.error_id == ERR_ENGAGEMENT_TERM_OVERLAP: [2027-12-31, 2029-12-31] intersects the incumbent's closed [2026-01-01, 2027-12-31] at exactly one day, and the incumbent is only PENDING — {PENDING, ACTIVE, UNDER_RFP} all count as live"
            - "call 2 returned 400 with data.error_id == ERR_INVALID_REQUEST, not 409: rule 38's start <= end shape check runs before the overlap comparison, so a reversed interval is never even tested for intersection"
            - "call 3 returned 201: [2028-01-01, 2029-12-31] starts one day after the incumbent's end, and closed intervals that merely abut do not intersect"
            - "call 4 returned 201 for the same 2026-01-01..2027-12-31 window under provider_role ADVISOR — the uniqueness of the window is per (plan_id, provider_role), not per plan"
            - "call 5 returned 409 with data.error_id == ERR_SEAT_NOT_VACANT, NOT ERR_SEAT_TERM_OVERLAP: the seat is FILLED, and the state check at priority 42 answers before the interval check at 66"
            - "the end-term returned 200 with CommitteeMember.${mem_hr_id}.status == RESIGNED, CommitteeSeat.${seat_hr_id}.status == VACANT and Plan.${plan_id}.documented_acceptance_count decremented by one"
            - "call 7 returned 201 even though its term interval is byte-identical to the predecessor's: a RESIGNED member is terminal and therefore outside the {APPOINTED, TRAINING_ASSIGNED, ACCEPTANCE_PENDING, ACTIVE} intersection set"
            - "CommitteeMember.${mem_hr2_id}.status == APPOINTED with fiduciary_training_status PENDING, and CommitteeSeat.${seat_hr_id}.status == FILLED with consecutive_vacant_quarters reset to 0"
            - "STRUCTURAL NOTE recorded, not asserted: ERR_SEAT_TERM_OVERLAP appears to be unreachable on this scaffold. An appointment requires seat.status == VACANT; a seat only reaches VACANT through end-term (member terminal) or the SUSPENDED -> VACANT arm, whose precondition is that no non-terminal appointment exists. So the intersection set is always empty at the moment the rule is evaluated, and ERR_SEAT_NOT_VACANT masks it in every other case."
            - "SPEC CONFLICT recorded, not asserted: §1.6 states ERR_SEAT_TERM_OVERLAP fires when an interval 'overlaps or is adjacent to' another, while the §1.2 precondition permits term_start_date >= prior.term_end_date + 1 day — under the §1.6 wording the abutting successor would also be illegal."

      - name: an_approved_decision_from_the_reviews_own_meeting_locks_the_reopen_until_it_is_rescinded
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_76_ERR_REOPEN_LIMIT_REACHED
          - state_machines.QuarterlyReview.FINALIZED_to_REOPENED
          - endpoints.POST_/governance/fund-replacements/{proposalId}/rescind-approval
        distinguishing_aspect: "The reopen gate reaches into a different entity: it is blocked not by anything on the review, but by the status of a proposal whose approving motion was moved in the review's presenting meeting. The recipe re-pins the review onto a second meeting, carries a FUND_REPLACEMENT motion there, finalizes, approves — and the reopen that worked a moment ago now fails. Rescinding the approval sends the proposal back to UNDER_REVIEW and the identical reopen succeeds, proving the check reads live status and not history. It also exercises the full REOPENED -> SCORING -> PENDING_MINUTES -> FINALIZED lap of the cyclic machine, anchored as chain_refinal for the ceiling test that follows."
        test_recipe:
          setup:
            - "chain_l4 is replayed: review ${review_q0_id} is FINALIZED for quarter 0 with reopen_count 0, meeting_id ${meet2_id} and five SUBMITTED scorecards."
            - "The review is then reopened once, re-scored, re-presented into a NEW meeting ${meet4_id} that also carries the replacement motion, and finalized again — so review.meeting_id is now ${meet4_id}, not ${meet2_id}."
          setup_api_calls: &chain_refinal
            - *chain_l4
            - &b_reopen1
              call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Consultant restated the small-cap peer ranking after a vendor data correction." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - &b_review_v5
              call: "GET /governance/quarterly-reviews/${review_q0_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_v_5: $.data.version }
            - &b_sc_small_v2
              call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_q0_id}", fund_id: "${fund_small_id}", expected_review_version: "${review_v_5}", trailing_return_3y_bps: 500, trailing_return_5y_bps: 480, benchmark_return_3y_bps: 600, benchmark_return_5y_bps: 600, peer_rank_pct: 60, style_drift_r2: 0.8800, net_expense_ratio_bps: 60, peer_median_expense_bps: 55, manager_tenure_quarters: 14, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { sc_small_v2_id: $.data.id }
            - &b_plan_v_read_rf
              call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_rf: $.data.version }
            - &b_prop_rf
              call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Move the large-cap core slot to the cheaper R6 share class following the restated quarterly review.", expected_plan_version: "${plan_v_rf}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { prop_rf_id: $.data.id }
            - &b_prop_rf_submit
              call: "POST /governance/fund-replacements/${prop_rf_id}/submit"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - &b_meet4
              call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-24", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet4_id: $.data.id }
            - &b_meet4_convene
              call: "POST /governance/committee-meetings/${meet4_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_review_present2
              call: "POST /governance/quarterly-reviews/${review_q0_id}/present"
              payload: { meeting_id: "${meet4_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - &b_motion_rf
              call: "POST /governance/motions"
              payload: { meeting_id: "${meet4_id}", subject_type: "FUND_REPLACEMENT", subject_id: "${prop_rf_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
              captures: { motion_rf_id: $.data.id }
            - &b_vote_rf_chair
              call: "POST /governance/motions/${motion_rf_id}/votes"
              payload: { member_id: "${mem_chair_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_vote_rf_fin
              call: "POST /governance/motions/${motion_rf_id}/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - &b_vote_rf_hr
              call: "POST /governance/motions/${motion_rf_id}/votes"
              payload: { member_id: "${mem_hr_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - &b_motion_rf_close
              call: "POST /governance/motions/${motion_rf_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_meet4_adjourn
              call: "POST /governance/committee-meetings/${meet4_id}/adjourn"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_meet4_minutes
              call: "POST /governance/committee-meetings/${meet4_id}/minutes-approve"
              payload: { minutes_doc_ref: "MIN-2026-Q0-004" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - &b_finalize_q0_again
              call: "POST /governance/quarterly-reviews/${review_q0_id}/finalize"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          trigger:
            - call: "POST /governance/fund-replacements/${prop_rf_id}/approve"
              payload: { approving_motion_id: "${motion_rf_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Sponsor wants the restated small-cap scorecard re-examined once more." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/fund-replacements/${prop_rf_id}/rescind-approval"
              payload: { reason: "Sponsor pulled the approval so the review can be reopened before any participant notice." }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Sponsor wants the restated small-cap scorecard re-examined once more." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "the first reopen inside setup returned 200 with reopen_count == 1, status == REOPENED and finalized_at == null; the compensation cascade left every fund at watch_status CLEAR and set Fund.${fund_small_id}.latest_composite_score back to null, because 'the most recent earlier FINALIZED review' means a different review row and none exists"
            - "the superseding scorecard returned 201 with supersedes_scorecard_id == ${sc_small_id}, composite_score == 59.88 (identical inputs, identical arithmetic) and it flipped the review REOPENED -> SCORING, so submitted_scorecard_count is still 5 and coverage over the five seated slots holds"
            - "present with meeting_id ${meet4_id} returned 200 and re-pinned review.meeting_id from ${meet2_id} to ${meet4_id} — the gate that follows is evaluated against the NEW meeting"
            - "the second finalize returned 200 with status == FINALIZED, reopen_count still 1 and finalized_quarter_index == 0"
            - "trigger call 1 returned 200: FundReplacementProposal.${prop_rf_id}.status == APPROVED, AssetClassSlot.${slot_lc_id}.status == PENDING_REPLACEMENT, Plan.${plan_id}.reserved_menu_slots == 1 and available_menu_slots == 0"
            - "trigger call 2 returned 409 with data.error_id == ERR_REVIEW_DECISIONS_EXECUTED even though reopen_count is 1 (< 2) and the quarter window is wide open — the blocking fact lives on a different entity"
            - "trigger call 3 returned 200: proposal back to UNDER_REVIEW, approving_motion_id == null, slot ${slot_lc_id} restored to ACTIVE (its seated fund's watch_status is CLEAR), reserved_menu_slots == 0 and available_menu_slots == 1 — the capacity triple is exactly restored"
            - "trigger call 4, byte-identical to call 2, returned 200 with reopen_count == 2 and status == REOPENED: rescinding did not merely hide the decision, it removed it from the {APPROVED, NOTICE_ISSUED, EXECUTED} set the gate scans"
            - "Motion.${motion_rf_id}.status is still CARRIED with support_pct == 100.0000 — the motion survives the rescission, only the proposal's pointer to it is cleared"
            - "the review's five scorecards are untouched by both reopens: reopen has no scorecard side effect, so nothing goes VOID or SUPERSEDED"

      - name: the_quarter_window_answers_before_the_reopen_ceiling_when_both_are_blown
        claim_type: Priority Ordering
        grounds:
          - validations.priority_75_ERR_QUARTER_CLOSED
          - validations.priority_76_ERR_REOPEN_LIMIT_REACHED
          - endpoints.POST_/governance/plans/{planId}/advance-quarter
        distinguishing_aspect: "Two business rules that both forbid the same call, separated by one priority step. With reopen_count already at the ceiling of 2 and the quarter still open, reopen answers ERR_REOPEN_LIMIT_REACHED; after two ops-run advances the very same request answers ERR_QUARTER_CLOSED instead, because the temporal gate at 75 is consulted before the cycle ceiling at 76. Both are 409, so only the error_id distinguishes them — an implementation that checks the counter first is indistinguishable by status code alone. The instance also proves the third lap of the cyclic review machine is reachable and that advance-quarter leaves a FINALIZED review alone."
        test_recipe:
          setup:
            - "chain_refinal is replayed, then the approve / rescind / reopen sequence from the previous instance drives reopen_count to 2."
            - "A third lap re-scores and re-finalizes through a fresh meeting ${meet5_id}, so the review is FINALIZED at quarter 0 with reopen_count == 2 — the ceiling reached but the window still open."
            - "No proposal is decided in ${meet5_id}, so the ERR_REVIEW_DECISIONS_EXECUTED arm of rule 76 is not in play; ${prop_rf_id} is left UNDER_REVIEW."
          setup_api_calls:
            - *chain_refinal
            - call: "POST /governance/fund-replacements/${prop_rf_id}/approve"
              payload: { approving_motion_id: "${motion_rf_id}" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/fund-replacements/${prop_rf_id}/rescind-approval"
              payload: { reason: "Sponsor pulled the approval so the review can be reopened before any participant notice." }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Second restatement: the consultant corrected the international style-drift input." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "GET /governance/quarterly-reviews/${review_q0_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_v_6: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_q0_id}", fund_id: "${fund_intl_id}", expected_review_version: "${review_v_6}", trailing_return_3y_bps: 700, trailing_return_5y_bps: 700, benchmark_return_3y_bps: 700, benchmark_return_5y_bps: 700, peer_rank_pct: 40, style_drift_r2: 0.9100, net_expense_ratio_bps: 32, peer_median_expense_bps: 35, manager_tenure_quarters: 26, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { sc_intl_v2_id: $.data.id }
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-28", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet5_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet5_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/present"
              payload: { meeting_id: "${meet5_id}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/committee-meetings/${meet5_id}/adjourn"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet5_id}/minutes-approve"
              payload: { minutes_doc_ref: "MIN-2026-Q0-005" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/finalize"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          trigger:
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Third restatement attempt while the quarter is still open." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Third restatement attempt one quarter later." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/quarterly-reviews/${review_q0_id}/reopen"
              payload: { reason: "Third restatement attempt two quarters later." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "setup ended with QuarterlyReview.${review_q0_id}.status == FINALIZED, reopen_count == 2, finalized_quarter_index == 0 and meeting_id == ${meet5_id}"
            - "trigger call 1 returned 409 with data.error_id == ERR_REOPEN_LIMIT_REACHED: Plan.fiscal_quarter_index - review.quarter_index == 0 so rule 75 is satisfied and only rule 76's counter arm fires"
            - "trigger call 2 returned 200 with Plan.${plan_id}.fiscal_quarter_index == 1; the FINALIZED review is NOT voided (only {DRAFT, SCORING} reviews older than one quarter go VOID) and all five scorecards stay SUBMITTED"
            - "trigger call 3 still returned 409 with data.error_id == ERR_REOPEN_LIMIT_REACHED: at delta 1 the window condition (delta <= 1) is exactly satisfied, so priority 75 stays silent on its boundary and 76 answers again"
            - "trigger call 4 returned 200 with fiscal_quarter_index == 2; every FiduciaryTrainingRecord is still CURRENT (validity_quarters 8, completed at quarter 0) so nothing in the training ladder interferes"
            - "trigger call 5 returned 409 with data.error_id == ERR_QUARTER_CLOSED, not ERR_REOPEN_LIMIT_REACHED: delta is now 2 > 1 and rule 75 outranks rule 76 even though the reopen ceiling is equally violated"
            - "across all three rejected reopens QuarterlyReview.${review_q0_id}.reopen_count stayed 2, finalized_at kept its stamp and no fund's watch_status or latest_composite_score moved — rejected reopens run no compensation"
            - "FundReplacementProposal.${prop_rf_id} is still UNDER_REVIEW after both advance-quarters: advance-quarter has no side effect on proposals, so the pinned_plan_version it carries is now two versions stale (an OCC failure waiting for its next write)"
            - "BOUNDARY NOTE: delta == 1 (call 3) and delta == 2 (call 5) straddle the window; the on-threshold reading of 'delta <= 1' is what makes call 3 a 76 and call 5 a 75."

      - name: charter_adoption_counts_seats_two_ways_and_the_shape_check_beats_both
        claim_type: Aggregate validation
        grounds:
          - state_machines.Plan.charter_status.DRAFT_to_ADOPTED
          - validations.priority_38_ERR_INVALID_REQUEST
          - validations.priority_65_ERR_DUPLICATE_RESOURCE
          - errors.ERR_CHARTER_SEATS_INSUFFICIENT
        distinguishing_aspect: "Adoption weighs an aggregate against a number that arrives in the very same request: the plan's voting-seat count must be at least 2 and at most the max_voting_seats being submitted, and both failures answer with the identically-named ERR_CHARTER_SEATS_INSUFFICIENT from opposite directions. A third, cheaper rule — quorum_min <= max within the body — is a request-shape check and wins over both. Non-voting seats are invisible to the aggregate, and the per-plan uniqueness of seat_code is proven not to leak across plans. Run on a purpose-built plan so no anchored chain is disturbed."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A second plan is created with max_voting_seats 3 and quorum_min_voting_members 2, holding exactly ONE voting seat and, later, one non-voting seat."
            - "The plan's stored max_voting_seats is 3, but every adopt attempt below re-supplies the value, so the aggregate is compared against the request body, not the stored column."
