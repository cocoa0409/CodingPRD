              payload: {}
              as: UnderwritingReviewer
            - call: "POST /consumers"
              payload: { email: "c6@example.com", full_name: "Casey Six", date_of_birth: "1994-05-05", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q_id}/re-rate"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q_id}/submit"
