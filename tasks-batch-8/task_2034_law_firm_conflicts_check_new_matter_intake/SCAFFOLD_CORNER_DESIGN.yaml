# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 2034: Law Firm Conflicts Check & New Matter Intake
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===============================================================
  - section: entities
    instances:
      - name: c_party_normalization_on_create
        claim_type: computed_fields
        grounds: [calculations.name_normalization, entities.Party.fields.normalized_name, entities.Party.fields.phonetic_key]
        distinguishing_aspect: "POST /intake/parties with 'Acme & Co., Inc.' computes normalized_name 'acme' (punctuation stripped, suffix tokens co/inc dropped) and soundex phonetic_key 'A250'."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /intake/parties", payload: { legal_name: "Acme & Co., Inc.", party_type: "CORPORATION" }, as: FirmAdmin, captures: { pid: $.data.id, norm: $.data.normalized_name, phon: $.data.phonetic_key, ver: $.data.version } }
          assert:
            - "norm == 'acme'"
            - "phon == 'A250' (American Soundex: A kept, c->2, m->5, e dropped, right-padded to 4)"
            - "ver == 1 and pid is a server-minted UUID"

      - name: c_party_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Party.fields.party_type, "validations[priority=12]"]
        distinguishing_aspect: "Omitting required party_type yields ERR_INVALID_REQUEST (400); legal_name alone is insufficient."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /intake/parties", payload: { legal_name: "No Type Corp" }, as: FirmAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: c_get_matter_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent matter id returns ERR_NOT_FOUND (404), not a state error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /intake/matters/00000000-0000-4000-8000-000000000000", as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND"]

      - name: c_matters_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints: GET /intake/matters"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more: 3 matters with limit=2 gives 2 items + has_more true; offset=2 gives 1 item + has_more false."
        test_recipe:
          setup: ["one client party, one attorney, three matters M1..M3"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Page Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "TAX", matter_title: "M2" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "IP", matter_title: "M3" }, as: IntakeSpecialist }
          trigger:
            - { call: "GET /intake/matters?limit=2&offset=0", as: IntakeSpecialist }
            - { call: "GET /intake/matters?limit=2&offset=2", as: IntakeSpecialist }
          assert:
            - "page 1: total_count == 3, has_more == true, data length == 2"
            - "page 2: total_count == 3, has_more == false, data length == 1"
            - "envelope carries meta.api_request_id and response_type == 'array'"

      - name: c_party_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Party.fields.id, response_envelope]
        distinguishing_aspect: "Client-supplied id/version in a create payload are ignored (not rejected): the response carries a server-minted id and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /intake/parties", payload: { legal_name: "Sys Fields Corp", party_type: "CORPORATION", id: "11111111-2222-4333-8444-555555555555", version: 99 }, as: FirmAdmin, captures: { pid: $.data.id, ver: $.data.version } }
          assert:
            - "pid != '11111111-2222-4333-8444-555555555555'"
            - "ver == 1"

      - name: c_affiliate_tree_and_reverse_lookup
        claim_type: parent_relationships
        grounds: [entities.Party.fields.affiliate_of_id, "endpoints: GET /intake/parties"]
        distinguishing_aspect: "A party created with affiliate_of_id=<parent> is retrievable via the filtered list GET /intake/parties?affiliate_of_id=<parent> (FK reverse reachability)."
        test_recipe:
          setup: ["parent party P exists"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Holdings Parent Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Sub Child LLC", party_type: "CORPORATION", affiliate_of_id: "${p}" }, as: FirmAdmin, captures: { c: $.data.id } }
          trigger:
            - { call: "GET /intake/parties?affiliate_of_id=${p}", as: FirmAdmin, captures: { first: "$.data[0].id" } }
          assert: ["first == ${c} (the affiliate child is found from the parent id)"]

  # ===============================================================
  - section: state_machines
    instances:
      - name: c_matter_initial_states
        claim_type: initial_state
        grounds: [state_machines.Matter]
        distinguishing_aspect: "A new matter starts lifecycle INTAKE, clearance UNCHECKED, matter_number null, opened_at null."
        test_recipe:
          setup: ["client party and attorney exist"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Init Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { lc: $.data.lifecycle_status, cs: $.data.clearance_status, num: $.data.matter_number, ver: $.data.version } }
          assert: ["lc == INTAKE", "cs == UNCHECKED", "num == null", "ver == 1"]

      - name: c_decline_or_close_wrong_state_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Matter.INTAKE_to_DECLINED, state_machines.Matter.OPEN_to_CLOSED, "errors[ERR_MATTER_NOT_INTAKE]", "errors[ERR_MATTER_NOT_OPEN]"]
        distinguishing_aspect: "DECLINE from OPEN fails with ERR_MATTER_NOT_INTAKE; CLOSE from INTAKE fails with ERR_MATTER_NOT_OPEN — the two lifecycle guards are distinct errors."
        test_recipe:
          setup:
            - "Matter MA fully countersigned OPEN (client PA, zero-hit check, PRIME credit, funded retainer 2,000,000)"
            - "Matter MB still INTAKE"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "State Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "MA" }, as: IntakeSpecialist, captures: { ma: $.data.id } }
            - { call: "POST /intake/matters/${ma}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${ma}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${ma}", as: IntakeSpecialist, captures: { ma_v: $.data.version } }
            - { call: "POST /intake/matters/${ma}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${ma_v}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { la: $.data.id } }
            - { call: "POST /intake/engagement-letters/${la}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}" }
            - { call: "GET /intake/matters/${ma}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id" } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 2000000 }, as: BillingClerk }
            - { call: "POST /intake/engagement-letters/${la}/transition", payload: { action: "COUNTERSIGN" }, as: Client, as_user_id: "${p}" }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "TAX", matter_title: "MB" }, as: IntakeSpecialist, captures: { mb: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${ma}/transition", payload: { action: "DECLINE", reason: "too late" }, as: ConflictsPartner, as_user_id: "${cp}", captures: { err1: $.data.error_id } }
            - { call: "POST /intake/matters/${mb}/transition", payload: { action: "CLOSE" }, as: ConflictsPartner, as_user_id: "${cp}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_MATTER_NOT_INTAKE (DECLINE requires INTAKE; MA is OPEN)"
            - "err2 == ERR_MATTER_NOT_OPEN (CLOSE requires OPEN; MB is INTAKE)"

      - name: c_terminal_lockdown_check_on_closed_matter
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Matter, "errors[ERR_MATTER_TERMINAL]"]
        distinguishing_aspect: "A CLOSED matter rejects new conflict checks with ERR_MATTER_TERMINAL — terminal states accept no further business operations."
        test_recipe:
          setup: ["Matter MA countersigned OPEN then CLOSED by the conflicts partner"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Lock Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "MA" }, as: IntakeSpecialist, captures: { ma: $.data.id } }
            - { call: "POST /intake/matters/${ma}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${ma}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${ma}", as: IntakeSpecialist, captures: { ma_v: $.data.version } }
            - { call: "POST /intake/matters/${ma}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${ma_v}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { la: $.data.id } }
            - { call: "POST /intake/engagement-letters/${la}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}" }
            - { call: "GET /intake/matters/${ma}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id" } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 2000000 }, as: BillingClerk }
            - { call: "POST /intake/engagement-letters/${la}/transition", payload: { action: "COUNTERSIGN" }, as: Client, as_user_id: "${p}" }
            - { call: "POST /intake/matters/${ma}/transition", payload: { action: "CLOSE" }, as: ConflictsPartner, as_user_id: "${cp}", captures: { lc: $.data.lifecycle_status } }
          trigger:
            - { call: "POST /intake/matters/${ma}/conflict-checks", payload: { search_variant: "PHONETIC" }, as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert: ["lc == CLOSED", "err == ERR_MATTER_TERMINAL"]

      - name: c_hit_review_not_pending_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ConflictHit.PENDING_to_DISMISSED, "errors[ERR_HIT_NOT_PENDING]"]
        distinguishing_aspect: "Reviewing an already-DISMISSED hit fails with ERR_HIT_NOT_PENDING; the first decision is final (no flip-flop)."
        test_recipe:
          setup: ["Matter M1 has hit H (party X on M0 and ADVERSE on M1), reviewed DISMISSED"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Review Target Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { px: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Review Client Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { py: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${px}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${py}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${px}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "DISMISSED" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { st1: $.data.review_status } }
          trigger:
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { err: $.data.error_id } }
          assert: ["st1 == DISMISSED", "err == ERR_HIT_NOT_PENDING"]

      - name: c_waiver_redraft_cycle
        claim_type: valid_transition
        grounds: [state_machines.WaiverRequest.DECLINED_to_DRAFT]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / waiver_redraft_cycle"
          rationale: "The full DRAFT->SENT->DECLINED->DRAFT->SENT loop with field resets is asserted in the named §1.8 instance."

      - name: c_wall_double_lift_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EthicalWall.ACTIVE_to_LIFTED, "errors[ERR_WALL_INVALID_STATE]"]
        distinguishing_aspect: "LIFTED is terminal for walls: a second LIFT fails ERR_WALL_INVALID_STATE; EXCLUDE on a LIFTED wall also fails."
        test_recipe:
          setup: ["Matter M with an ACTIVE wall excluding attorney A1"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Wall State Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Aaron Alpha", bar_number: "BAR003", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a1: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/ethical-walls", payload: { reason: "CLIENT_REQUEST", excluded_attorney_ids: ["${a1}"] }, as: ConflictsPartner, as_user_id: "${cp}", captures: { w: $.data.id } }
            - { call: "POST /intake/ethical-walls/${w}/transition", payload: { action: "LIFT" }, as: ConflictsPartner, as_user_id: "${cp}", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /intake/ethical-walls/${w}/transition", payload: { action: "LIFT" }, as: ConflictsPartner, as_user_id: "${cp}", captures: { err: $.data.error_id } }
          assert: ["st1 == LIFTED", "err == ERR_WALL_INVALID_STATE"]

      - name: c_countersign_assigns_matter_number_and_opens
        claim_type: side_effect_execution
        grounds: [state_machines.Matter.INTAKE_to_OPEN, state_machines.EngagementLetter.ISSUED_to_COUNTERSIGNED, entities.Matter.fields.matter_number]
        distinguishing_aspect: "The first successful COUNTERSIGN in an empty database assigns matter_number 'M000001', stamps opened_at with the default logical clock 2026-08-01T00:00:00Z, flips lifecycle to OPEN, and the same state is visible on an immediate re-read (immediate consistency)."
        test_recipe:
          setup: ["Matter M cleared (zero-hit check), PRIME credit, letter ISSUED, deposit FUNDED 2,000,000"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Numbered Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { l: $.data.id } }
            - { call: "POST /intake/engagement-letters/${l}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}" }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id" } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 2000000 }, as: BillingClerk }
          trigger:
            - { call: "POST /intake/engagement-letters/${l}/transition", payload: { action: "COUNTERSIGN" }, as: Client, as_user_id: "${p}", captures: { lst: $.data.status, cs_at: $.data.countersigned_at } }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { lc: $.data.lifecycle_status, num: $.data.matter_number, opened: $.data.opened_at } }
          assert:
            - "lst == COUNTERSIGNED and cs_at == '2026-08-01T00:00:00.000Z' (default logical clock, no clock-set call made)"
            - "lc == OPEN and num == 'M000001' and opened == '2026-08-01T00:00:00.000Z'"
            - "the GET immediately after countersign reflects the transition (no eventual-consistency lag)"

      - name: c_lateral_zero_hits_activates_immediately
        claim_type: valid_transition
        grounds: [state_machines.Attorney.LATERAL_PENDING_to_ACTIVE, calculations.conflict_match_score]
        distinguishing_aspect: "A lateral whose prior_client_names match nothing on INTAKE/OPEN matters starts ACTIVE directly in the create response (zero-hit sweep), and no sweep hits exist for existing matters."
        test_recipe:
          setup: ["Matter M0 (INTAKE) client 'Unique Existing Corp'"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Unique Existing Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
          trigger:
            - { call: "POST /intake/attorneys", payload: { full_name: "Lena Lateral", bar_number: "BAR010", practice_group: "LITIGATION", hire_type: "LATERAL", lateral_employed_from: "2024-01-01", lateral_employed_to: "2025-06-30", prior_client_names: ["No Such Name Holdings"] }, as: FirmAdmin, captures: { st: $.data.status } }
            - { call: "GET /intake/conflict-hits?matched_matter_id=${m0}", as: IntakeSpecialist }
          assert:
            - "st == ACTIVE (zero sweep hits -> immediate activation)"
            - "hit list for M0 is empty (total_count == 0)"

  # ===============================================================
  - section: calculations
    instances:
      - name: c_credit_band_standard_boundary_670
        claim_type: correct_result
        grounds: [calculations.credit_band, entities.CreditAssessment.fields.band]
        distinguishing_aspect: "The STANDARD/SUBPRIME boundary is the second inclusive threshold: 670 -> STANDARD, 669 -> SUBPRIME (complements the 740/739 boundary covered in §1.8)."
        test_recipe:
          setup: ["Matter M (INTAKE) exists"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Band Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 670 }, as: BillingClerk, captures: { b670: $.data.band } }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 669 }, as: BillingClerk, captures: { b669: $.data.band } }
          assert: ["b670 == STANDARD", "b669 == SUBPRIME"]

      - name: c_retainer_floor_clamp_default_band
        claim_type: constants_applied
        grounds: [calculations.retainer_required_amount, entities.RetainerDeposit.fields.required_cents]
        distinguishing_aspect: "With NO credit assessment the band defaults to SUBPRIME (x3) and the clamp floor applies: fee 100 x 3 = 300 -> required_cents == 50000 (RETAINER_MIN_CENTS), exercising both the default-band rule and the lower clamp."
        test_recipe:
          setup: ["Matter M (INTAKE), no credit assessment, letter with one line 1.0h x 100c"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Floor Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 1.0, rate_cents: 100 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { l: $.data.id, fee: $.data.fee_estimate_cents } }
          trigger:
            - { call: "POST /intake/engagement-letters/${l}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}" }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { req: "$.data[0].required_cents", st: "$.data[0].status" } }
          assert:
            - "fee == 100"
            - "req == 50000 (raw 300 clamped up to RETAINER_MIN_CENTS; band defaulted to SUBPRIME x3 without any assessment)"
            - "st == PENDING"

      - name: c_match_threshold_inclusive_boundary
        claim_type: precision
        grounds: [calculations.conflict_match_score, entities.ConflictCheck.fields.match_threshold]
        distinguishing_aspect: "Token overlap 4/5 floors to exactly 80; with match_threshold 80 the hit IS produced (>= inclusive) and with 81 it is not — the threshold comparison is precise, not approximate."
        test_recipe:
          setup:
            - "Matter M0 (client 'Orion Client LLC') roster includes party 'Alpha Beta Gamma Delta Eps' (5 tokens)"
            - "Matter M1 client 'Alpha Beta Gamma Delta' (4 shared tokens -> overlap floor(100*4/5) == 80)"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Orion Client LLC", party_type: "CORPORATION" }, as: FirmAdmin, captures: { po: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Alpha Beta Gamma Delta Eps", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p5: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Alpha Beta Gamma Delta", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p4: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${po}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters/${m0}/parties", payload: { party_id: "${p5}", role_in_matter: "RELATED" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p4}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT", match_threshold: 80 }, as: IntakeSpecialist, captures: { hits80: $.data.hit_count } }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT", match_threshold: 81 }, as: IntakeSpecialist, captures: { hits81: $.data.hit_count } }
          assert:
            - "hits80 == 1 (score 80 >= threshold 80, inclusive)"
            - "hits81 == 0 (score 80 < threshold 81)"

      - name: c_letter_fee_rounding
        claim_type: correct_result
        grounds: [calculations.letter_fee_estimate]
        excluded_because:
          difficulty_instance: "combinatorial_formula / combinatorial_per_line_rounding_order"
          rationale: "Per-line-then-sum rounding order with the 102-vs-101 divergence is asserted in the named §1.8 instance."

      - name: c_strict_phonetic_divergence
        claim_type: variant_divergence
        grounds: [calculations.conflict_match_score]
        excluded_because:
          difficulty_instance: "dual_variant_calc / dual_variant_strict_vs_phonetic_hit_set"
          rationale: "STRICT-vs-PHONETIC hit-set divergence on identical data is asserted in the named §1.8 instance."

  # ===============================================================
  - section: validations
    instances:
      - name: c_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails priority 1 with ERR_UNAUTHENTICATED (401) before any role or existence check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /intake/matters"
              captures: { err: $.data.error_id }
          assert: ["err == ERR_UNAUTHENTICATED"]

      - name: c_existence_before_state_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reviewing a nonexistent hit id returns ERR_NOT_FOUND (404, priority 3) rather than ERR_HIT_NOT_PENDING (409, priority 6) — existence always precedes state."
        test_recipe:
          setup: ["an attorney exists to make the call well-formed"]
          setup_api_calls:
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /intake/conflict-hits/00000000-0000-4000-8000-000000000000/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND"]

      - name: c_waiver_active_exists_alone
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_WAIVER_ACTIVE_EXISTS]"]
        distinguishing_aspect: "With the hit's check still COMPLETED (no supersede), a second waiver for the same hit fails solely on the one-active-waiver constraint."
        test_recipe:
          setup: ["Matter M1 has CONFIRMED hit H and an active DRAFT waiver W1 for it"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Active Waiver X Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { px: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Active Waiver Y Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { py: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${px}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M0" }, as: IntakeSpecialist, captures: { m0: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${py}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M1" }, as: IntakeSpecialist, captures: { m1: $.data.id } }
            - { call: "POST /intake/matters/${m1}/parties", payload: { party_id: "${px}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${m1}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id } }
            - { call: "GET /intake/conflict-hits?check_id=${chk}", as: IntakeSpecialist, captures: { h: "$.data[0].id" } }
            - { call: "POST /intake/conflict-hits/${h}/review", payload: { decision: "CONFIRMED" }, as: ResponsibleAttorney, as_user_id: "${a}" }
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "w1" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m1}/waiver-requests", payload: { conflict_hit_id: "${h}", proposed_terms: "w2" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_WAIVER_ACTIVE_EXISTS"]

      - name: c_party_already_on_matter
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PARTY_ALREADY_ON_MATTER]"]
        distinguishing_aspect: "Adding the same party to a matter roster twice fails the second time with ERR_PARTY_ALREADY_ON_MATTER (409)."
        test_recipe:
          setup: ["Matter M with party X already ADVERSE"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Dup Party Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { px: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Dup Client Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { py: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${py}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/parties", payload: { party_id: "${px}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist, captures: { mp: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m}/parties", payload: { party_id: "${px}", role_in_matter: "WITNESS" }, as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert: ["mp != null (first add succeeds)", "err == ERR_PARTY_ALREADY_ON_MATTER"]

      - name: c_refund_exceeds_balance
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_REFUND_EXCEEDS_BALANCE]"]
        distinguishing_aspect: "REFUND of 100001 against a received balance of 100000 fails with ERR_REFUND_EXCEEDS_BALANCE; the balance is unchanged afterwards."
        test_recipe:
          setup: ["Matter M with ISSUED letter (floor-clamped required 50000); deposit FUNDED with 100000"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Refund Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 1.0, rate_cents: 100 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { l: $.data.id } }
            - { call: "POST /intake/engagement-letters/${l}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}" }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id" } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 100000 }, as: BillingClerk, captures: { st1: $.data.status, rc1: $.data.received_cents } }
          trigger:
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "REFUND", amount_cents: 100001 }, as: BillingClerk, captures: { err: $.data.error_id } }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { rc2: "$.data[0].received_cents" } }
          assert:
            - "st1 == FUNDED and rc1 == 100000"
            - "err == ERR_REFUND_EXCEEDS_BALANCE"
            - "rc2 == 100000 (failed refund leaves the balance unchanged)"

      - name: c_match_threshold_out_of_range
        claim_type: type_constraints
        grounds: [entities.ConflictCheck.fields.match_threshold, "validations[priority=12]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "match_threshold 101 is outside 0..100 and rejected with ERR_INVALID_REQUEST before any search runs."
        test_recipe:
          setup: ["Matter M (INTAKE) exists"]
          setup_api_calls:
