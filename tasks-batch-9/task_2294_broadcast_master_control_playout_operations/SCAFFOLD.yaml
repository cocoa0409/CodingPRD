# =============================================================================
# task_2294 — Broadcast Master Control & Playout Operations
# SCAFFOLD.yaml — §1.0 through §1.7
# =============================================================================

scenario: |
  2294. Broadcast Master Control & Playout Operations (television station master control):
  playlist ingest from the traffic system with program, commercial and interstitial elements
  timed to the second, content acquisition and quality control of program feeds with delivery
  deadlines and format verification, live event switching, network feed joins and breakaway
  handling with backtiming, emergency and breaking news override procedures with crawl and
  cut-in authority, automation system monitoring with as-run log generation for reconciliation
  against orders, technical fault response including audio loss, black frames and closed
  caption failures, transmitter monitoring, power reduction and outage notification
  requirements, multicast subchannel programming and playout resource allocation

domain_name: broadcast-master-control
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Channel is self-referential (subchannel -> primary channel); PlaylistItem is
  # self-referential (substitution chain) and carries four outbound FKs into
  # Asset / SpotOrder / NetworkFeedWindow / PlaylistItem; TechnicalFault is a
  # three-way cross-aggregate node (Channel, Transmitter, PlaylistItem).

  state_machine_shape: parallel
  # PlaylistItem carries two independent state dimensions (playout_status x
  # clearance_status). Asset (QC_FAILED -> RECEIVED), Transmitter
  # (OFF_AIR -> REDUCED_POWER -> FULL_POWER) and EmergencyOverride
  # (ACTIVE_CRAWL <-> ACTIVE_CUTIN) are cyclic; Playlist (ARMED -> IMPORTED on
  # revision re-ingest) is cyclic; TechnicalFault and Asset branch.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The QCTechnician operator who submitted the governing QC report may not be
  # the operator who waives it; the operator who requested a BREAKING_NEWS
  # override may not be the operator who authorizes its cut-in.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities, 11 declared state machines (PlaylistItem carries two of them,
  # plus the derived Channel.posture and Channel.allocation_state), 13 calculations,
  # 67 validation rows, 59 endpoints, 96 error codes, 7 roles, 6 OCC rules.
  # Well beyond the Expert band (10-15 entities / 20-32 endpoints / 18-30 errors
  # / 3+ calculation variants / 4+ state machines) on every axis.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Transmitter
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "Licensed facility identifier; unique across transmitters", constraints: "unique, 1-32 chars" }
      - { name: call_sign, type: string, source: input, description: "Station call sign carried by this transmitter" }
      - { name: authorized_erp_kw, type: number, source: input, description: "Licensed effective radiated power in kW", constraints: "> 0" }
      - { name: current_power_pct, type: number, source: system, description: "Current operating power as pct of authorized_erp_kw", default: 100, constraints: "0 <= x <= 100" }
      - { name: operational_state, type: enum, source: system, description: "FULL_POWER | REDUCED_POWER | OFF_AIR", default: "FULL_POWER" }
      - { name: derate_factor, type: number, source: computed, description: "Capacity derate applied to every child Multiplex; see calculations.multiplex_bitrate_allocation step 1. One of 1.00 | 0.75 | 0.50 | 0.00", default: 1.00 }
      - { name: outage_started_utc, type: datetime, source: system, description: "Logical-clock instant the current OFF_AIR epoch began; null when not OFF_AIR" }
      - { name: last_outage_seconds, type: integer, source: system, description: "Duration in seconds of the most recently closed OFF_AIR epoch", default: 0 }
      - { name: cumulative_outage_seconds, type: integer, source: computed, description: "Sum of last_outage_seconds over all closed OFF_AIR epochs on this transmitter", default: 0 }
      - { name: notification_pending_count, type: integer, source: computed, description: "Count of RegulatoryNotification rows for this transmitter with status IN {PENDING, OVERDUE}", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Multiplex
    parent: Transmitter
    common_fields: true
    fields:
      - { name: transmitter_id, type: string, source: input, description: "FK -> Transmitter.id; the RF plant carrying this transport stream" }
      - { name: name, type: string, source: input, description: "Operator-facing transport stream name" }
      - { name: total_capacity_kbps, type: integer, source: input, description: "Nominal transport stream payload capacity in kbps", constraints: ">= 1000" }
      - { name: pilot_reserved_kbps, type: integer, source: input, description: "Kbps permanently reserved for PSIP tables and null padding; never allocatable to channels", default: 500, constraints: ">= 0 and < total_capacity_kbps" }
      - { name: live_encoder_units_total, type: integer, source: input, description: "Count of live-encoder units available on this multiplex for NetworkFeedWindow occupancy", default: 2, constraints: ">= 1" }
      - { name: effective_capacity_kbps, type: integer, source: computed, description: "= floor(total_capacity_kbps * Transmitter.derate_factor) - pilot_reserved_kbps, floored at 0" }
      - { name: assigned_kbps, type: integer, source: computed, description: "Sum of Channel.allocated_bitrate_kbps over channels on this multiplex with allocation_state IN {ACTIVE, STANDBY}" }
      - { name: available_kbps, type: integer, source: computed, description: "= effective_capacity_kbps - assigned_kbps; conserved quantity of calculations.multiplex_capacity_conservation" }
      - { name: starved_channel_count, type: integer, source: computed, description: "Count of channels on this multiplex with allocation_state == STARVED", default: 0 }
      - { name: live_encoder_units_peak, type: integer, source: computed, description: "Peak concurrent live-encoder occupancy over all NetworkFeedWindow rows on this multiplex with state IN {PLANNED, JOINED}; see calculations.live_encoder_concurrency_peak", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Channel
    parent: Multiplex
    common_fields: true
    fields:
      - { name: multiplex_id, type: string, source: input, description: "FK -> Multiplex.id; bit pool this channel draws from" }
      - { name: parent_channel_id, type: string, source: input, description: "FK -> Channel.id; the PRIMARY channel this SUBCHANNEL hangs off; null when service_class == PRIMARY" }
      - { name: call_sign, type: string, source: input, description: "Channel call sign, e.g. WXYZ-DT2" }
      - { name: channel_number, type: string, source: input, description: "Virtual channel number as major.minor, e.g. 12.2", constraints: "unique across all channels; matches ^[0-9]{1,3}\\.[0-9]{1,2}$" }
      - { name: service_class, type: enum, source: input, description: "PRIMARY | SUBCHANNEL" }
      - { name: resolution_class, type: enum, source: input, description: "HD_1080I | HD_720P | SD_480I" }
      - { name: requested_bitrate_kbps, type: integer, source: input, description: "Bitrate this channel asks for", constraints: ">= floor_bitrate_kbps" }
      - { name: floor_bitrate_kbps, type: integer, source: input, description: "Minimum bitrate below which the channel cannot be carried", constraints: ">= 100" }
      - { name: priority_rank, type: integer, source: input, description: "Allocation priority; 1 is highest. Primary sort key of the bitrate waterfall", constraints: ">= 1" }
      - { name: allocated_bitrate_kbps, type: integer, source: computed, description: "Kbps granted by calculations.multiplex_bitrate_allocation", default: 0 }
      - { name: allocation_state, type: enum, source: input, description: "ACTIVE | STANDBY | STARVED. Input accepts ACTIVE or STANDBY only; STARVED is written by calculations.multiplex_bitrate_allocation when the floor cannot be granted", default: "ACTIVE" }
      - { name: air_status, type: enum, source: system, description: "DARK | ON_AIR | BARS_AND_TONE | EAS_OVERRIDE", default: "DARK" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | DEGRADED | DEGRADED_CRITICAL | EMERGENCY | SUSPENDED; see calculations.channel_posture. Gates playlist arming, item cueing and override activation", default: "NORMAL" }
      - { name: open_fault_count, type: integer, source: computed, description: "Count of TechnicalFault rows with channel_id == this channel and state IN {DETECTED, ACKNOWLEDGED, ESCALATED}", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Operator legal name" }
      - { name: role_class, type: enum, source: input, description: "MASTER_CONTROL | QC | PROGRAM_DIRECTOR | ENGINEER; must equal the X-User-Role mapping declared in §1.7" }
      - { name: override_authority, type: enum, source: input, description: "NONE | CRAWL_ONLY | CRAWL_AND_CUTIN | FULL; authority ladder for emergency override activation", default: "NONE" }
      - { name: certification_expires_utc, type: datetime, source: input, description: "Last instant at which this operator's master-control certification is valid (inclusive)" }
      - { name: certification_state, type: enum, source: computed, description: "VALID | EXPIRED; VALID while logical_now <= certification_expires_utc, EXPIRED once logical_now > certification_expires_utc" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: house_number, type: string, source: input, description: "Station house number identifying the media", constraints: "unique across assets" }
      - { name: title, type: string, source: input, description: "Program or spot title" }
      - { name: source, type: enum, source: input, description: "SATELLITE_FEED | FILE_DELIVERY | LIVE_LINE | LOCAL_ARCHIVE" }
      - { name: expected_duration_seconds, type: integer, source: input, description: "Duration the traffic system booked, in whole seconds", constraints: ">= 1" }
      - { name: delivery_deadline_utc, type: datetime, source: input, description: "Contractual instant by which the media must be received" }
      - { name: required_resolution_class, type: enum, source: input, description: "HD_1080I | HD_720P | SD_480I; format the station requires" }
      - { name: captions_required, type: boolean, source: input, description: "Whether closed captions are mandatory for this asset", default: true }
      - { name: received_utc, type: datetime, source: system, description: "Logical-clock instant the delivery was recorded; null while EXPECTED" }
      - { name: measured_duration_seconds, type: integer, source: input, description: "Duration measured at ingest, in whole seconds; null while EXPECTED" }
      - { name: video_codec, type: enum, source: input, description: "MPEG2 | H264 | H265 | XDCAM; null while EXPECTED" }
      - { name: delivered_resolution_class, type: enum, source: input, description: "HD_1080I | HD_720P | SD_480I as actually delivered; null while EXPECTED" }
      - { name: frame_rate, type: number, source: input, description: "One of 23.976 | 29.97 | 59.94; null while EXPECTED" }
      - { name: audio_loudness_lkfs, type: number, source: input, description: "Measured program loudness in LKFS, negative value; null while EXPECTED" }
      - { name: audio_channel_config, type: enum, source: input, description: "MONO | STEREO_2_0 | SURROUND_5_1; null while EXPECTED" }
      - { name: caption_present, type: boolean, source: input, description: "Whether a caption track was found at ingest; null while EXPECTED" }
      - { name: caption_language, type: string, source: input, description: "BCP-47 tag of the caption track, e.g. en-US; null when caption_present is false" }
      - { name: late_delivery, type: boolean, source: computed, description: "True when received_utc > delivery_deadline_utc", default: false }
      - { name: technical_score_ingest, type: integer, source: computed, description: "Score from the INGEST variant of calculations.asset_technical_score; null until a QC report exists" }
      - { name: technical_score_aircheck, type: integer, source: computed, description: "Score from the AIR_CHECK variant of calculations.asset_technical_score; null until an AIR_CHECK report exists" }
      - { name: qc_verdict, type: enum, source: computed, description: "PASS | PASS_WITH_EXCEPTION | FAIL; verdict of the governing (newest non-superseded) QCReport; null until a QC report exists" }
      - { name: status, type: enum, source: system, description: "EXPECTED | RECEIVED | QC_PASSED | QC_FAILED | QC_WAIVED | EXPIRED | RETRACTED", default: "EXPECTED" }
      - { name: waived_by_operator_id, type: string, source: input, description: "FK -> Operator.id; PROGRAM_DIRECTOR operator who waived a FAIL verdict; null unless status == QC_WAIVED" }
      - { name: waiver_justification, type: string, source: input, description: "Free-text justification recorded with the waiver; null unless status == QC_WAIVED" }

  # ---------------------------------------------------------------------------
  - name: QCReport
    parent: Asset
    common_fields: false
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; asset inspected" }
      - { name: inspected_by_operator_id, type: string, source: input, description: "FK -> Operator.id; operator who performed the inspection" }
      - { name: basis, type: enum, source: input, description: "INGEST | AIR_CHECK; selects the variant of calculations.asset_technical_score", default: "INGEST" }
      - { name: defect_codes, type: array, source: input, description: "Zero or more of LOUDNESS_OUT_OF_SPEC | AUDIO_LOSS | BLACK_FRAMES | CAPTION_MISSING | CAPTION_MISTIMED | FORMAT_MISMATCH | VIDEO_ARTIFACT; duplicates are collapsed" }
      - { name: measured_duration_seconds, type: integer, source: input, description: "Duration this inspection measured, in whole seconds", constraints: ">= 0" }
      - { name: defect_penalty_points, type: integer, source: computed, description: "Sum of DEFECT_POINTS over the deduplicated defect_codes" }
      - { name: duration_penalty_points, type: integer, source: computed, description: "Duration deviation penalty, capped at 30; see calculations.asset_technical_score" }
      - { name: loudness_penalty_points, type: integer, source: computed, description: "12 when |audio_loudness_lkfs - TARGET_LKFS| > LOUDNESS_TOLERANCE_LKFS, else 0" }
      - { name: fault_penalty_points, type: integer, source: computed, description: "AIR_CHECK only: capped sum of penalties for TechnicalFault rows linked to the asset's aired items; 0 for INGEST" }
      - { name: technical_score, type: integer, source: computed, description: "= max(0, 100 - defect_penalty_points - duration_penalty_points - loudness_penalty_points - fault_penalty_points)" }
      - { name: verdict, type: enum, source: computed, description: "PASS | PASS_WITH_EXCEPTION | FAIL; threshold rules in calculations.asset_technical_score" }
      - { name: superseded, type: boolean, source: system, description: "True once a newer QCReport with the same basis exists for the asset; superseded reports never govern Asset.qc_verdict", default: false }
      - { name: notes, type: string, source: input, description: "Optional inspector notes" }

  # ---------------------------------------------------------------------------
  - name: Playlist
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel this broadcast-day schedule belongs to" }
      - { name: broadcast_day, type: string, source: input, description: "Broadcast day as YYYY-MM-DD", constraints: "unique per (channel_id, broadcast_day)" }
      - { name: schedule_start_utc, type: datetime, source: input, description: "First instant of the playlist window; item 1 must start exactly here" }
      - { name: window_duration_seconds, type: integer, source: input, description: "Length of the broadcast-day window in whole seconds", default: 86400, constraints: ">= 60" }
      - { name: traffic_revision, type: integer, source: system, description: "Revision counter from the traffic system; 1 on ingest, +1 on every accepted traffic revision", default: 1 }
      - { name: status, type: enum, source: system, description: "IMPORTING | IMPORTED | VALIDATED | ARMED | ON_AIR | CLOSED | ABANDONED", default: "IMPORTING" }
      - { name: item_count, type: integer, source: computed, description: "Count of PlaylistItem rows with this playlist_id", default: 0 }
      - { name: blocked_item_count, type: integer, source: computed, description: "Count of this playlist's items with clearance_status == BLOCKED", default: 0 }
      - { name: scheduled_total_seconds, type: integer, source: computed, description: "Sum of scheduled_duration_seconds over items with playout_status NOT IN {SKIPPED, PREEMPTED}", default: 0 }
      - { name: projected_end_variance_seconds, type: integer, source: computed, description: "PROJECTED variant of calculations.playlist_timing_variance; positive means overrun", default: 0 }
      - { name: asrun_end_variance_seconds, type: integer, source: computed, description: "AS_RUN variant of calculations.playlist_timing_variance; positive means overrun", default: 0 }
      - { name: commercial_seconds_by_hour, type: object, source: computed, description: "Map of clock-hour index (0-based offset from schedule_start_utc, as string keys) to summed scheduled_duration_seconds of COMMERCIAL items whose scheduled_start_utc falls in that hour" }
      - { name: reconciliation_credit_cents, type: integer, source: computed, description: "Total credit in cents produced by the FINAL basis of calculations.spot_credit_settlement; written on the transition to CLOSED", default: 0 }
      - { name: armed_at_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent transition to ARMED; cleared to null on any revert to IMPORTED" }
      - { name: closed_at_utc, type: datetime, source: system, description: "Logical-clock instant of the transition to CLOSED" }

  # ---------------------------------------------------------------------------
  - name: PlaylistItem
    parent: Playlist
    common_fields: true
    fields:
      - { name: playlist_id, type: string, source: system, description: "FK -> Playlist.id; owning schedule" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; media to roll; null when element_kind IN {NETWORK_JOIN, LIVE_EVENT, FILLER}" }
      - { name: spot_order_id, type: string, source: input, description: "FK -> SpotOrder.id; commercial order this spot fulfils; null unless element_kind == COMMERCIAL" }
      - { name: feed_window_id, type: string, source: input, description: "FK -> NetworkFeedWindow.id; feed window this element hands off to; null unless element_kind IN {NETWORK_JOIN, LIVE_EVENT}" }
      - { name: replaces_item_id, type: string, source: system, description: "FK -> PlaylistItem.id; item this substitution replaces; null unless created by a substitute or makegood call" }
      - { name: sequence_number, type: integer, source: input, description: "Play order within the playlist", constraints: ">= 1, unique per playlist_id" }
      - { name: element_kind, type: enum, source: input, description: "PROGRAM | COMMERCIAL | INTERSTITIAL | PROMO | NETWORK_JOIN | LIVE_EVENT | FILLER" }
      - { name: house_number, type: string, source: system, description: "Snapshot of Asset.house_number at item creation; null when asset_id is null" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Second-accurate scheduled start" }
      - { name: scheduled_duration_seconds, type: integer, source: input, description: "Scheduled duration in whole seconds", constraints: ">= 1" }
      - { name: max_trim_seconds, type: integer, source: input, description: "Seconds this element may lose to backtiming trim; 0 means untrimmable", default: 0, constraints: "0 <= x <= scheduled_duration_seconds" }
      - { name: playout_status, type: enum, source: system, description: "Dimension 1 (automation axis): SCHEDULED | CUED | PLAYING | PLAYED | TRUNCATED | SKIPPED | PREEMPTED", default: "SCHEDULED" }
      - { name: clearance_status, type: enum, source: system, description: "Dimension 2 (content axis): UNCLEARED | CLEARED | BLOCKED", default: "UNCLEARED" }
      - { name: actual_start_utc, type: datetime, source: system, description: "Logical-clock instant of the START playout event; null until then" }
      - { name: measured_duration_seconds, type: integer, source: system, description: "Seconds actually aired, written by the END or TRUNCATE playout event" }
      - { name: is_makegood, type: boolean, source: system, description: "True when created by POST /spot-orders/{id}/makegoods", default: false }
      - { name: trim_applied_seconds, type: integer, source: system, description: "Seconds removed from this element by an executed backtiming plan", default: 0 }

  # ---------------------------------------------------------------------------
  - name: SpotOrder
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel the inventory was sold on" }
      - { name: advertiser_name, type: string, source: input, description: "Advertiser of record" }
      - { name: order_reference, type: string, source: input, description: "Traffic system order reference", constraints: "unique across spot orders" }
      - { name: ordered_spots, type: integer, source: input, description: "Number of spots sold", constraints: ">= 1" }
      - { name: unit_duration_seconds, type: integer, source: input, description: "Contracted length of each spot in whole seconds", constraints: ">= 5" }
      - { name: rate_cents_total, type: integer, source: input, description: "Gross order value in cents for all ordered_spots", constraints: ">= 1" }
      - { name: daypart, type: enum, source: input, description: "EARLY_MORNING | DAYTIME | EARLY_FRINGE | PRIME | LATE_NIGHT" }
      - { name: priority_class, type: enum, source: input, description: "GUARANTEED | PREEMPTIBLE | REMNANT; GUARANTEED spots may never be dropped by a backtiming plan" }
      - { name: makegood_deadline_utc, type: datetime, source: input, description: "Last instant (inclusive) at which a makegood spot may be placed for this order" }
      - { name: scheduled_spots, type: integer, source: computed, description: "Count of linked items with playout_status IN {SCHEDULED, CUED, PLAYING}", default: 0 }
      - { name: aired_spots, type: integer, source: computed, description: "Count of linked items classified AIRED_FULL by calculations.spot_credit_settlement", default: 0 }
      - { name: short_aired_spots, type: integer, source: computed, description: "Count of linked items classified SHORT_AIR by calculations.spot_credit_settlement", default: 0 }
      - { name: credited_spots, type: integer, source: computed, description: "Count of linked items classified NOT_AIRED plus unplaced spots credited in full", default: 0 }
      - { name: unplaced_spots, type: integer, source: computed, description: "= ordered_spots - count(all linked items); ordered inventory the traffic system never scheduled", default: 0 }
      - { name: credit_accrued_cents, type: integer, source: computed, description: "Running credit in cents; conserved quantity of calculations.spot_inventory_conservation", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_CREDITED | FULLY_AIRED | CLOSED_WITH_CREDIT", default: "OPEN" }

  # ---------------------------------------------------------------------------
  - name: NetworkFeedWindow
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel that joins the feed" }
      - { name: feed_source, type: enum, source: input, description: "NETWORK_PRIMARY | NETWORK_ALT | SYNDICATED_LIVE | LOCAL_LIVE_EVENT" }
      - { name: anchor_sequence_number, type: integer, source: input, description: "Sequence number of the first local item that must clear before the join", constraints: ">= 1" }
      - { name: join_utc, type: datetime, source: input, description: "Contractual instant the channel must be on the feed" }
      - { name: breakaway_utc, type: datetime, source: input, description: "Contractual instant the channel leaves the feed", constraints: "> join_utc" }
      - { name: guard_seconds, type: integer, source: input, description: "Guard band applied at both ends of the occupied closed interval", default: 2, constraints: "0 <= x <= 30" }
      - { name: live_encoder_units, type: integer, source: input, description: "Live-encoder units this window occupies on the parent multiplex", default: 1, constraints: ">= 1" }
      - { name: backtiming_mode, type: enum, source: input, description: "STRICT | TOLERANT; selects the tolerance term of calculations.backtime_join_plan", default: "TOLERANT" }
      - { name: plan_action, type: enum, source: computed, description: "PAD_WITH_FILLER | TRIM_TAIL | SKIP_ELEMENTS | HARD_CUT | JOIN_IN_PROGRESS; null until a plan is computed" }
      - { name: backtime_pad_seconds, type: integer, source: computed, description: "Filler seconds the plan inserts before the join", default: 0 }
      - { name: backtime_trim_seconds, type: integer, source: computed, description: "Seconds the plan trims from trimmable tail elements", default: 0 }
      - { name: residual_dead_air_seconds, type: integer, source: computed, description: "Seconds of the early-arrival gap the plan could not fill with filler", default: 0 }
      - { name: late_join_seconds, type: integer, source: computed, description: "Seconds of the feed already gone at join time", default: 0 }
      - { name: skipped_item_sequences, type: array, source: computed, description: "Ascending sequence_number list of items the plan drops; empty unless plan_action == SKIP_ELEMENTS" }
      - { name: plan_computed_utc, type: datetime, source: computed, description: "Logical-clock instant the current plan was computed" }
      - { name: state, type: enum, source: system, description: "PLANNED | JOINED | BROKEN_AWAY | ABANDONED", default: "PLANNED" }

  # ---------------------------------------------------------------------------
  - name: EmergencyOverride
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel to be overridden" }
      - { name: requested_by_operator_id, type: string, source: system, description: "FK -> Operator.id; operator whose X-User-ID created the request" }
      - { name: authorized_by_operator_id, type: string, source: system, description: "FK -> Operator.id; operator whose X-User-ID activated the override; null while PENDING or REJECTED" }
      - { name: alert_class, type: enum, source: input, description: "EAS_MANDATORY | SEVERE_WEATHER | BREAKING_NEWS | STATION_MESSAGE" }
      - { name: override_mode, type: enum, source: input, description: "CRAWL | CUT_IN; the mode requested" }
      - { name: active_mode, type: enum, source: system, description: "CRAWL | CUT_IN; the mode currently on air; null unless state IN {ACTIVE_CRAWL, ACTIVE_CUTIN}" }
      - { name: crawl_text, type: string, source: input, description: "Text of the crawl; required when override_mode == CRAWL", constraints: "1-200 chars" }
      - { name: requested_start_utc, type: datetime, source: input, description: "Instant the override is intended to begin" }
      - { name: expected_duration_seconds, type: integer, source: input, description: "Planned on-air duration in whole seconds", constraints: ">= 1" }
      - { name: activated_utc, type: datetime, source: system, description: "Logical-clock instant of the first activation" }
      - { name: released_utc, type: datetime, source: system, description: "Logical-clock instant of release" }
      - { name: truncated_item_count, type: integer, source: computed, description: "Count of PlaylistItem rows this override drove to TRUNCATED", default: 0 }
      - { name: preempted_item_count, type: integer, source: computed, description: "Count of PlaylistItem rows this override drove to PREEMPTED", default: 0 }
      - { name: state, type: enum, source: system, description: "PENDING | ACTIVE_CRAWL | ACTIVE_CUTIN | RELEASED | REJECTED", default: "PENDING" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded when a PENDING request is rejected; null otherwise" }

  # ---------------------------------------------------------------------------
  - name: TechnicalFault
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel affected; null for transmitter-only faults" }
      - { name: transmitter_id, type: string, source: input, description: "FK -> Transmitter.id; transmitter affected; null for channel-only faults" }
      - { name: playlist_item_id, type: string, source: input, description: "FK -> PlaylistItem.id; element on air when the fault was observed; null when not element-scoped" }
      - { name: fault_code, type: enum, source: input, description: "AUDIO_LOSS | BLACK_FRAME | CAPTION_LOSS | LOSS_OF_SIGNAL | ENCODER_FAILURE | RF_POWER_FAULT | AUTOMATION_STALL" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL; from FAULT_SEVERITY map, escalated one step when duration_seconds >= FAULT_ESCALATION_SECONDS" }
      - { name: detected_utc, type: datetime, source: input, description: "Instant the fault was first observed" }
      - { name: cleared_utc, type: datetime, source: system, description: "Logical-clock instant the fault reached RESOLVED or AUTO_CLEARED" }
      - { name: duration_seconds, type: integer, source: computed, description: "= (cleared_utc or logical_now) - detected_utc in whole seconds", default: 0 }
      - { name: state, type: enum, source: system, description: "DETECTED | ACKNOWLEDGED | ESCALATED | MITIGATED | RESOLVED | AUTO_CLEARED", default: "DETECTED" }
      - { name: mitigation_code, type: enum, source: input, description: "SWITCH_TO_BACKUP | RESTART_ENCODER | BARS_AND_TONE | MANUAL_BYPASS; null until MITIGATED" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the actor who acknowledged; not an entity reference" }

  # ---------------------------------------------------------------------------
  - name: AsRunEntry
    parent: Playlist
    common_fields: false
    fields:
      - { name: playlist_id, type: string, source: system, description: "FK -> Playlist.id; broadcast-day log this entry belongs to" }
      - { name: playlist_item_id, type: string, source: system, description: "FK -> PlaylistItem.id; element the entry describes" }
      - { name: sequence_number, type: integer, source: system, description: "Snapshot of PlaylistItem.sequence_number at write time" }
      - { name: house_number, type: string, source: system, description: "Snapshot of PlaylistItem.house_number at write time; null when the element had no asset" }
      - { name: element_kind, type: enum, source: system, description: "Snapshot of PlaylistItem.element_kind: PROGRAM | COMMERCIAL | INTERSTITIAL | PROMO | NETWORK_JOIN | LIVE_EVENT | FILLER" }
      - { name: event_kind, type: enum, source: system, description: "CUE | START | END | TRUNCATION | SKIP | PREEMPTION | OVERRIDE_IN | OVERRIDE_OUT | FILLER_INSERT | JOIN | BREAKAWAY" }
      - { name: event_utc, type: datetime, source: system, description: "Logical-clock instant the event occurred" }
      - { name: measured_duration_seconds, type: integer, source: system, description: "Seconds aired for END and TRUNCATION events; 0 for all other event kinds" }
      - { name: source, type: enum, source: system, description: "AUTOMATION | OPERATOR | SYSTEM; SYSTEM marks entries written by a cascade rather than a direct call" }
      - { name: recorded_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the actor whose call produced the entry; null for SYSTEM entries" }

  # ---------------------------------------------------------------------------
  - name: RegulatoryNotification
    parent: Transmitter
    common_fields: true
    fields:
      - { name: transmitter_id, type: string, source: system, description: "FK -> Transmitter.id; facility the filing concerns" }
      - { name: kind, type: enum, source: system, description: "POWER_REDUCTION | OUTAGE | RESUMPTION" }
      - { name: triggering_utc, type: datetime, source: system, description: "Instant of the triggering RF event" }
      - { name: due_utc, type: datetime, source: system, description: "= triggering_utc + NOTIFY_WINDOW_SECONDS for POWER_REDUCTION and RESUMPTION; = outage detection instant + NOTIFY_WINDOW_SECONDS for OUTAGE" }
      - { name: filed_utc, type: datetime, source: system, description: "Logical-clock instant the filing was recorded; null while PENDING or OVERDUE" }
      - { name: filed_reference, type: string, source: input, description: "Regulator-assigned filing reference; null until filed" }
      - { name: narrative, type: string, source: input, description: "Filing narrative text; null until filed" }
      - { name: observed_power_pct, type: number, source: system, description: "Transmitter.current_power_pct at the triggering event; null for OUTAGE and RESUMPTION kinds" }
      - { name: outage_seconds, type: integer, source: system, description: "Elapsed OFF_AIR seconds at detection; null for POWER_REDUCTION kind" }
      - { name: status, type: enum, source: system, description: "PENDING | OVERDUE | FILED | LATE_FILED", default: "PENDING" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Transmitter — cyclic (FULL <-> REDUCED, REDUCED <-> OFF_AIR). Origin of the
  # deepest cascade in the scaffold (RF -> bit pool -> channel -> items -> orders).
  - entity: Transmitter
    dimension: operational_state
    initial_state: FULL_POWER
    terminal_states: []
    transitions:
      - from: FULL_POWER
        to: REDUCED_POWER
        trigger: "POST /transmitters/{id}/power-state with target_state=REDUCED_POWER"
        actor: BroadcastEngineer
        preconditions:
          - "power_pct present and 1 <= power_pct < 100"
        side_effects:
          - "Sets current_power_pct = power_pct and derate_factor per calculations.multiplex_bitrate_allocation step 1 (0.75 when power_pct >= 50, else 0.50)"
          - "CASCADE A hop 1: when power_pct < POWER_REDUCTION_THRESHOLD_PCT (80) creates RegulatoryNotification(kind=POWER_REDUCTION, status=PENDING, triggering_utc=logical_now, due_utc=logical_now + NOTIFY_WINDOW_SECONDS, observed_power_pct=power_pct) and increments Transmitter.notification_pending_count. At exactly power_pct == 80 no notification is created."
          - "CASCADE A hop 2 (caused by the derate_factor write): every Multiplex with transmitter_id == this transmitter recomputes effective_capacity_kbps"
          - "CASCADE A hop 3 (caused by hop 2): calculations.multiplex_bitrate_allocation reruns on each affected Multiplex, rewriting Channel.allocated_bitrate_kbps and flipping channels that can no longer be granted their floor to allocation_state=STARVED; Multiplex.assigned_kbps / available_kbps / starved_channel_count refresh"
          - "CASCADE A hop 4 (caused by hop 3): every Channel newly STARVED recomputes posture to SUSPENDED via calculations.channel_posture step 1 and its air_status is forced to BARS_AND_TONE when it was ON_AIR"
          - "CASCADE A hop 5 (caused by hop 4): for each such Channel, every item of its ON_AIR playlist with playout_status IN {SCHEDULED, CUED} flips to PREEMPTED and an AsRunEntry(event_kind=PREEMPTION, source=SYSTEM) is appended; the PLAYING item, if any, flips to TRUNCATED with measured_duration_seconds = logical_now - actual_start_utc and an AsRunEntry(event_kind=TRUNCATION, source=SYSTEM)"
          - "CASCADE A hop 6 (caused by hop 5): for each preempted or truncated item with spot_order_id set, calculations.spot_inventory_conservation moves the spot from scheduled_spots to credited_spots (PREEMPTED) or short_aired_spots (TRUNCATED) and adds the per-item credit from calculations.spot_credit_settlement to credit_accrued_cents; SpotOrder.status refreshes"
          - "Recomputes Playlist.asrun_end_variance_seconds and Playlist.projected_end_variance_seconds for every touched playlist"
          - "Increments Transmitter.version by 1"
      - from: REDUCED_POWER
        to: FULL_POWER
        trigger: "POST /transmitters/{id}/power-state with target_state=FULL_POWER"
        actor: BroadcastEngineer
        preconditions:
          - "No TechnicalFault with transmitter_id == this transmitter, fault_code == RF_POWER_FAULT and state IN {DETECTED, ACKNOWLEDGED, ESCALATED} (ERR_RF_FAULT_BLOCKS_RESTORE)"
        side_effects:
          - "Sets current_power_pct = 100 and derate_factor = 1.00"
          - "Reruns calculations.multiplex_bitrate_allocation on every child Multiplex; channels previously STARVED that can now be granted their floor return to allocation_state=ACTIVE (STANDBY channels return to STANDBY) and their posture recomputes"
          - "Channels leaving SUSPENDED posture have air_status restored from BARS_AND_TONE to ON_AIR only when their playlist status == ON_AIR; already PREEMPTED items are NOT resurrected (conditional cascade)"
          - "Increments Transmitter.version by 1"
      - from: FULL_POWER
        to: OFF_AIR
        trigger: "POST /transmitters/{id}/power-state with target_state=OFF_AIR"
        actor: BroadcastEngineer
        preconditions:
          - "reason_code present"
        side_effects:
          - "Sets current_power_pct = 0, derate_factor = 0.00, outage_started_utc = logical_now"
          - "Same CASCADE A hops 2-6 run with derate_factor 0.00: effective_capacity_kbps floors at 0, every channel on every child multiplex becomes STARVED, posture SUSPENDED, air_status DARK, all non-terminal items of ON_AIR playlists PREEMPTED, spot credits accrued"
          - "Increments Transmitter.version by 1"
      - from: REDUCED_POWER
        to: OFF_AIR
        trigger: "POST /transmitters/{id}/power-state with target_state=OFF_AIR"
        actor: BroadcastEngineer
        preconditions:
          - "reason_code present"
        side_effects:
          - "Identical to FULL_POWER -> OFF_AIR"
      - from: OFF_AIR
        to: REDUCED_POWER
        trigger: "POST /transmitters/{id}/power-state with target_state=REDUCED_POWER"
        actor: BroadcastEngineer
        preconditions:
          - "power_pct present and 1 <= power_pct < 100"
        side_effects:
          - "Closes the outage epoch: last_outage_seconds = logical_now - outage_started_utc, cumulative_outage_seconds += last_outage_seconds, outage_started_utc = null"
          - "When last_outage_seconds >= OUTAGE_NOTIFY_AFTER_SECONDS (1800) and no OUTAGE notification exists for this epoch, creates RegulatoryNotification(kind=OUTAGE, status=PENDING, triggering_utc=the epoch's outage_started_utc, due_utc=logical_now + NOTIFY_WINDOW_SECONDS, outage_seconds=last_outage_seconds). At exactly 1800 seconds the notification IS created."
          - "Creates RegulatoryNotification(kind=RESUMPTION, status=PENDING, triggering_utc=logical_now, due_utc=logical_now + NOTIFY_WINDOW_SECONDS)"
          - "Sets derate_factor per power_pct and reruns calculations.multiplex_bitrate_allocation on every child Multiplex"
          - "Increments Transmitter.version by 1"
      - from: OFF_AIR
        to: FULL_POWER
        trigger: "POST /transmitters/{id}/power-state with target_state=FULL_POWER"
        actor: BroadcastEngineer
        preconditions:
          - "No TechnicalFault with transmitter_id == this transmitter, fault_code == RF_POWER_FAULT and state IN {DETECTED, ACKNOWLEDGED, ESCALATED} (ERR_RF_FAULT_BLOCKS_RESTORE)"
        side_effects:
          - "Same outage-epoch closure, OUTAGE and RESUMPTION notification rules as OFF_AIR -> REDUCED_POWER"
          - "derate_factor = 1.00; reruns calculations.multiplex_bitrate_allocation; channels recover per REDUCED_POWER -> FULL_POWER rules"
          - "Increments Transmitter.version by 1"
      - from: OFF_AIR
        to: OFF_AIR
        trigger: "POST /_clock/set_current_utc advancing logical_now past outage_started_utc + OUTAGE_NOTIFY_AFTER_SECONDS"
        actor: system
        preconditions:
          - "operational_state == OFF_AIR and outage_started_utc is not null"
          - "logical_now - outage_started_utc >= OUTAGE_NOTIFY_AFTER_SECONDS (1800)"
          - "No RegulatoryNotification of kind OUTAGE exists whose triggering_utc == outage_started_utc"
        side_effects:
          - "Creates RegulatoryNotification(kind=OUTAGE, status=PENDING, triggering_utc=outage_started_utc, due_utc=logical_now + NOTIFY_WINDOW_SECONDS, outage_seconds=logical_now - outage_started_utc) and increments notification_pending_count"
          - "Increments Transmitter.version by 1"
        note: "Ops-run checkpoint: the clock endpoint is the only epoch advancer; there are no background jobs."

  # ---------------------------------------------------------------------------
  # Channel — cyclic, guarded by posture and by the parent Transmitter's state.
  - entity: Channel
    dimension: air_status
    initial_state: DARK
    terminal_states: []
    transitions:
      - from: DARK
        to: ON_AIR
        trigger: "POST /channels/{id}/air-state with target_air_status=ON_AIR"
        actor: MasterControlOperator
        preconditions:
          - "Channel.allocation_state == ACTIVE (ERR_CHANNEL_ALLOCATION_STARVED)"
          - "Channel.allocated_bitrate_kbps >= Channel.floor_bitrate_kbps (ERR_CHANNEL_ALLOCATION_STARVED)"
          - "Parent Transmitter.operational_state != OFF_AIR (ERR_TRANSMITTER_OFF_AIR) — cross-entity dependency Channel -> Transmitter"
          - "Channel.posture != SUSPENDED (ERR_CHANNEL_SUSPENDED_POSTURE)"
        side_effects:
          - "Recomputes posture via calculations.channel_posture"
          - "Increments Channel.version by 1"
      - from: ON_AIR
        to: BARS_AND_TONE
        trigger: "POST /channels/{id}/air-state with target_air_status=BARS_AND_TONE, or CASCADE A hop 4, or TechnicalFault mitigation with mitigation_code=BARS_AND_TONE"
        actor: MasterControlOperator | system
        preconditions: []
        side_effects:
          - "Every item of the channel's ON_AIR playlist with playout_status == PLAYING flips to TRUNCATED with measured_duration_seconds = logical_now - actual_start_utc; AsRunEntry(event_kind=TRUNCATION) appended"
          - "Recomputes posture; increments Channel.version by 1"
      - from: BARS_AND_TONE
        to: ON_AIR
        trigger: "POST /channels/{id}/air-state with target_air_status=ON_AIR"
        actor: MasterControlOperator
        preconditions:
          - "Same preconditions as DARK -> ON_AIR"
          - "No TechnicalFault on this channel with severity == CRITICAL and state IN {DETECTED, ACKNOWLEDGED, ESCALATED} (ERR_CRITICAL_FAULT_OPEN)"
        side_effects:
          - "Recomputes posture; increments Channel.version by 1"
      - from: ON_AIR
        to: EAS_OVERRIDE
        trigger: "POST /emergency-overrides/{id}/activate (override_mode=CUT_IN)"
        actor: system
        preconditions:
          - "An EmergencyOverride on this channel transitions to ACTIVE_CUTIN"
        side_effects:
          - "Sets posture = EMERGENCY via calculations.channel_posture step 2"
          - "Increments Channel.version by 1"
      - from: EAS_OVERRIDE
        to: ON_AIR
        trigger: "POST /emergency-overrides/{id}/release, or POST /emergency-overrides/{id}/activate with override_mode=CRAWL de-escalating a cut-in"
        actor: system
        preconditions:
          - "No remaining EmergencyOverride on this channel with state == ACTIVE_CUTIN"
        side_effects:
          - "Recomputes posture (falls back to DEGRADED_CRITICAL / DEGRADED / NORMAL per open faults and transmitter state)"
          - "Increments Channel.version by 1"
      - from: ON_AIR
        to: DARK
        trigger: "POST /channels/{id}/air-state with target_air_status=DARK, or CASCADE A hop 4 when Transmitter.operational_state == OFF_AIR"
        actor: MasterControlOperator | system
        preconditions:
          - "No EmergencyOverride on this channel with state IN {ACTIVE_CRAWL, ACTIVE_CUTIN} (ERR_EAS_OVERRIDE_ACTIVE) when the actor is MasterControlOperator; the system cascade bypasses this check"
        side_effects:
          - "All items of the channel's ON_AIR playlist with playout_status IN {SCHEDULED, CUED, PLAYING} flip to PREEMPTED (PLAYING flips to TRUNCATED first) with AsRunEntry rows appended"
          - "Recomputes posture; increments Channel.version by 1"
      - from: BARS_AND_TONE
        to: DARK
        trigger: "POST /channels/{id}/air-state with target_air_status=DARK"
        actor: MasterControlOperator
        preconditions: []
        side_effects:
          - "Recomputes posture; increments Channel.version by 1"

  # ---------------------------------------------------------------------------
  # Asset — branching with a redelivery cycle (QC_FAILED -> RECEIVED).
  - entity: Asset
    dimension: status
    initial_state: EXPECTED
    terminal_states: [EXPIRED, RETRACTED]
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /assets/{id}/delivery"
        actor: QCTechnician | BroadcastEngineer
        preconditions:
          - "logical_now <= delivery_deadline_utc + DELIVERY_GRACE_SECONDS (3600) (ERR_DELIVERY_DEADLINE_PASSED); at exactly deadline + 3600 the delivery is accepted"
          - "measured_duration_seconds >= 1"
        side_effects:
          - "Writes received_utc = logical_now and the delivered format fields"
          - "Sets late_delivery = (received_utc > delivery_deadline_utc)"
          - "Resets technical_score_ingest, technical_score_aircheck and qc_verdict to null"
      - from: EXPECTED
        to: EXPIRED
        trigger: "POST /assets/{id}/delivery rejected for lateness, or POST /_clock/set_current_utc advancing past delivery_deadline_utc + DELIVERY_GRACE_SECONDS"
        actor: system
        preconditions:
          - "logical_now > delivery_deadline_utc + DELIVERY_GRACE_SECONDS (3600)"
        side_effects:
          - "CASCADE B' hop 1: every PlaylistItem with asset_id == this asset and playout_status IN {SCHEDULED, CUED} flips clearance_status to BLOCKED"
          - "CASCADE B' hop 2 (caused by hop 1): each owning Playlist increments blocked_item_count and, when status IN {VALIDATED, ARMED}, reverts to IMPORTED with armed_at_utc cleared"
          - "Increments Asset.version by 1"
      - from: RECEIVED
        to: QC_PASSED
        trigger: "POST /assets/{id}/qc-reports whose computed verdict IN {PASS, PASS_WITH_EXCEPTION}"
        actor: QCTechnician
        preconditions:
          - "expected_asset_version matches Asset.version (ERR_STALE_ASSET_VERSION)"
          - "inspected_by_operator_id resolves to an Operator with role_class == QC and status == ACTIVE"
        side_effects:
          - "Creates QCReport; marks any prior QCReport with the same basis superseded = true"
          - "Writes technical_score_ingest (basis INGEST) or technical_score_aircheck (basis AIR_CHECK) and qc_verdict from the new governing report"
          - "Every PlaylistItem with asset_id == this asset and playout_status IN {SCHEDULED, CUED} flips clearance_status to CLEARED unless captions_required and caption_present == false"
          - "Increments Asset.version by 1"
      - from: RECEIVED
        to: QC_FAILED
        trigger: "POST /assets/{id}/qc-reports whose computed verdict == FAIL"
        actor: QCTechnician
        preconditions:
          - "expected_asset_version matches Asset.version (ERR_STALE_ASSET_VERSION)"
        side_effects:
          - "Creates QCReport with verdict FAIL; supersedes the prior same-basis report"
          - "CASCADE B hop 1 equivalent: items referencing the asset with playout_status IN {SCHEDULED, CUED} flip clearance_status to BLOCKED; owning playlists increment blocked_item_count and revert VALIDATED/ARMED -> IMPORTED"
          - "Increments Asset.version by 1"
      - from: QC_FAILED
        to: RECEIVED
        trigger: "POST /assets/{id}/delivery (redelivery of corrected media)"
        actor: QCTechnician | BroadcastEngineer
        preconditions:
          - "logical_now <= delivery_deadline_utc + DELIVERY_GRACE_SECONDS (3600)"
        side_effects:
          - "Overwrites the delivered format fields and received_utc; qc_verdict and both technical scores reset to null"
          - "Items previously BLOCKED because of this asset stay BLOCKED until a new passing QC report or a waiver is recorded (no optimistic unblocking)"
          - "Increments Asset.version by 1"
        note: "Revision cycle: an asset may loop QC_FAILED -> RECEIVED -> QC_FAILED any number of times while the grace window holds."
      - from: QC_FAILED
        to: QC_WAIVED
        trigger: "POST /assets/{id}/qc-waivers"
        actor: ProgramDirector
        preconditions:
          - "expected_asset_version matches Asset.version (ERR_STALE_ASSET_VERSION)"
          - "X-User-ID != inspected_by_operator_id of the governing (newest non-superseded) QCReport (ERR_SELF_AUTHORIZATION_FORBIDDEN)"
          - "Governing QCReport.technical_score >= WAIVER_MIN_SCORE (40) (ERR_QC_WAIVER_SCORE_TOO_LOW)"
          - "Governing QCReport.defect_codes does not contain AUDIO_LOSS (ERR_CAPTION_REQUIREMENT_UNMET)"
        side_effects:
          - "Writes waived_by_operator_id = X-User-ID and waiver_justification"
          - "Items referencing the asset with clearance_status == BLOCKED and playout_status IN {SCHEDULED, CUED} flip to CLEARED; each owning Playlist decrements blocked_item_count"
          - "Increments Asset.version by 1"
      - from: QC_PASSED
        to: RETRACTED
        trigger: "POST /assets/{id}/retract"
        actor: ProgramDirector
        preconditions:
          - "reason_code present"
        side_effects:
          - "CASCADE B hop 1: every PlaylistItem with asset_id == this asset and playout_status IN {SCHEDULED, CUED} flips clearance_status to BLOCKED"
          - "CASCADE B hop 2 (caused by hop 1): each owning Playlist increments blocked_item_count and, when status IN {VALIDATED, ARMED}, reverts to IMPORTED with armed_at_utc cleared"
          - "CASCADE B hop 3 (caused by hop 1): for each blocked item with spot_order_id set, calculations.spot_inventory_conservation moves the spot from scheduled_spots to credited_spots and adds the full per-spot credit to credit_accrued_cents; SpotOrder.status refreshes to PARTIALLY_CREDITED or CLOSED_WITH_CREDIT"
          - "Increments Asset.version by 1"
      - from: QC_WAIVED
        to: RETRACTED
        trigger: "POST /assets/{id}/retract"
        actor: ProgramDirector
        preconditions:
          - "reason_code present"
        side_effects:
          - "Identical to QC_PASSED -> RETRACTED"

  # ---------------------------------------------------------------------------
  # Playlist — cyclic: ARMED/VALIDATED fall back to IMPORTED on revision ingest
  # or on any content block, and can be re-driven forward.
  - entity: Playlist
    dimension: status
    initial_state: IMPORTING
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: IMPORTING
        to: IMPORTED
        trigger: "POST /playlists (automatic, at the end of the ingest transaction)"
        actor: system
        preconditions:
          - "At least one item was supplied (ERR_PLAYLIST_EMPTY_INGEST)"
        side_effects:
          - "Creates every PlaylistItem row with playout_status=SCHEDULED, clearance_status=UNCLEARED"
          - "Items whose asset_id points at an Asset with status IN {QC_PASSED, QC_WAIVED} are created with clearance_status=CLEARED; items whose asset is RETRACTED, EXPIRED or QC_FAILED are created BLOCKED"
          - "Sets traffic_revision = 1, recomputes item_count, blocked_item_count, scheduled_total_seconds, commercial_seconds_by_hour, projected_end_variance_seconds and asrun_end_variance_seconds"
          - "For every item with spot_order_id set, calculations.spot_inventory_conservation increments SpotOrder.scheduled_spots and recomputes unplaced_spots"
      - from: IMPORTED
        to: VALIDATED
        trigger: "POST /playlists/{id}/state with target_status=VALIDATED"
        actor: TrafficCoordinator | MasterControlOperator
        preconditions:
          - "item_count >= 1 and at least one item has element_kind == PROGRAM (ERR_PLAYLIST_NO_PROGRAM_CONTENT) — empty-set boundary"
          - "Item 1 starts exactly at schedule_start_utc and the timeline is contiguous half-open per calculations.playlist_timeline_integrity (ERR_SCHEDULE_GAP_DETECTED / ERR_SCHEDULE_OVERLAP_DETECTED)"
          - "No clock hour of commercial_seconds_by_hour exceeds MAX_COMMERCIAL_SECONDS_PER_HOUR (960) (ERR_COMMERCIAL_INVENTORY_EXCEEDED)"
          - "blocked_item_count == 0 (ERR_UNCLEARED_CONTENT_ON_AIR)"
        side_effects:
          - "Recomputes projected_end_variance_seconds and asrun_end_variance_seconds via calculations.playlist_timing_variance"
          - "Increments Playlist.version by 1"
      - from: VALIDATED
        to: ARMED
        trigger: "POST /playlists/{id}/state with target_status=ARMED"
        actor: MasterControlOperator
        preconditions:
          - "Channel.posture IN {NORMAL, DEGRADED} (ERR_CHANNEL_SUSPENDED_POSTURE) — cross-entity dependency Playlist -> Channel"
          - "Parent Transmitter.operational_state != OFF_AIR (ERR_TRANSMITTER_OFF_AIR) — cross-entity dependency Playlist -> Transmitter"
          - "Every item with element_kind IN {PROGRAM, COMMERCIAL, INTERSTITIAL, PROMO} has clearance_status == CLEARED (ERR_UNCLEARED_CONTENT_ON_AIR)"
          - "|projected_end_variance_seconds| <= ARM_VARIANCE_TOLERANCE_SECONDS (30) (ERR_ARM_VARIANCE_EXCEEDED); at exactly 30 the arm is permitted"
        side_effects:
          - "Writes armed_at_utc = logical_now"
          - "Increments Playlist.version by 1"
      - from: ARMED
        to: IMPORTED
        trigger: "POST /playlists/{id}/traffic-revisions, or CASCADE B hop 2 / CASCADE B' hop 2 (an item became BLOCKED)"
        actor: TrafficCoordinator | system
        preconditions:
          - "For the traffic-revision trigger: expected_playlist_version matches Playlist.version (ERR_STALE_PLAYLIST_VERSION)"
        side_effects:
          - "Traffic-revision path: increments traffic_revision by 1; every existing item with playout_status == SCHEDULED is deleted and replaced by the supplied revision items; items with playout_status IN {CUED, PLAYING, PLAYED, TRUNCATED, SKIPPED, PREEMPTED} are retained untouched"
          - "Traffic-revision path: SpotOrder.scheduled_spots and unplaced_spots are recomputed for every order referenced by the removed and the added items, preserving calculations.spot_inventory_conservation"
          - "Clears armed_at_utc to null; recomputes every computed field of the playlist"
          - "Increments Playlist.version by 1"
        note: "Cycle: IMPORTED -> VALIDATED -> ARMED -> IMPORTED is the revision loop."
      - from: VALIDATED
        to: IMPORTED
        trigger: "POST /playlists/{id}/traffic-revisions, or CASCADE B hop 2"
        actor: TrafficCoordinator | system
        preconditions:
          - "For the traffic-revision trigger: expected_playlist_version matches Playlist.version (ERR_STALE_PLAYLIST_VERSION)"
        side_effects:
          - "Identical to ARMED -> IMPORTED"
      - from: ARMED
        to: ON_AIR
        trigger: "POST /playlists/{id}/state with target_status=ON_AIR"
        actor: MasterControlOperator
        preconditions:
          - "Channel.air_status == ON_AIR (ERR_CHANNEL_NOT_ON_AIR) — cross-entity dependency Playlist -> Channel"
          - "logical_now >= schedule_start_utc - PREROLL_TOLERANCE_SECONDS (300) (ERR_PLAYLIST_AIR_TOO_EARLY); at exactly schedule_start_utc - 300 the transition is permitted"
          - "No other Playlist on the same channel has status == ON_AIR (ERR_CHANNEL_PLAYLIST_ALREADY_ON_AIR)"
        side_effects:
          - "Increments Playlist.version by 1"
      - from: ON_AIR
        to: CLOSED
        trigger: "POST /playlists/{id}/state with target_status=CLOSED"
        actor: MasterControlOperator | TrafficCoordinator
        preconditions:
          - "No item has playout_status == PLAYING (ERR_PLAYLIST_ITEM_STILL_PLAYING)"
          - "No EmergencyOverride on the channel with state IN {ACTIVE_CRAWL, ACTIVE_CUTIN} (ERR_EAS_OVERRIDE_ACTIVE)"
        side_effects:
          - "Writes closed_at_utc = logical_now"
          - "Every item still in playout_status SCHEDULED or CUED flips to SKIPPED with AsRunEntry(event_kind=SKIP, source=SYSTEM)"
          - "Runs calculations.spot_credit_settlement with basis FINAL over every SpotOrder referenced by this playlist; writes SpotOrder.aired_spots, short_aired_spots, credited_spots, unplaced_spots, credit_accrued_cents and status; writes Playlist.reconciliation_credit_cents"
          - "Recomputes asrun_end_variance_seconds"
          - "Increments Playlist.version by 1"
      - from: IMPORTED
        to: ABANDONED
        trigger: "POST /playlists/{id}/state with target_status=ABANDONED"
        actor: TrafficCoordinator
        preconditions:
          - "No item has playout_status IN {CUED, PLAYING, PLAYED, TRUNCATED} (ERR_PLAYLIST_INVALID_STATE)"
        side_effects:
          - "All items flip to SKIPPED; every referenced SpotOrder has scheduled_spots decremented and unplaced_spots recomputed, preserving calculations.spot_inventory_conservation"
          - "Increments Playlist.version by 1"
      - from: VALIDATED
        to: ABANDONED
        trigger: "POST /playlists/{id}/state with target_status=ABANDONED"
        actor: TrafficCoordinator
        preconditions:
          - "No item has playout_status IN {CUED, PLAYING, PLAYED, TRUNCATED} (ERR_PLAYLIST_INVALID_STATE)"
        side_effects:
          - "Identical to IMPORTED -> ABANDONED"

  # ---------------------------------------------------------------------------
  # PlaylistItem dimension 1 of 2 — automation axis. Evolves independently of
  # the clearance axis below: an item may be CUED while UNCLEARED is impossible,
  # but PLAYED x BLOCKED is reachable (asset retracted after the element aired).
  - entity: PlaylistItem
    dimension: playout_status
    initial_state: SCHEDULED
    terminal_states: [PLAYED, TRUNCATED, SKIPPED, PREEMPTED]
    transitions:
      - from: SCHEDULED
        to: CUED
        trigger: "POST /playlist-items/{id}/playout-events with event_kind=CUE"
        actor: MasterControlOperator
        preconditions:
          - "Owning Playlist.status == ON_AIR (ERR_PLAYLIST_NOT_ON_AIR)"
          - "clearance_status == CLEARED for element_kind IN {PROGRAM, COMMERCIAL, INTERSTITIAL, PROMO} (ERR_UNCLEARED_CONTENT_ON_AIR) — cross-entity dependency PlaylistItem -> Asset"
          - "Channel.posture != SUSPENDED (ERR_CHANNEL_SUSPENDED_POSTURE)"
          - "No other item of the same playlist has playout_status == CUED (ERR_ITEM_INVALID_PLAYOUT_STATE)"
        side_effects:
          - "Appends AsRunEntry(event_kind=CUE, source=AUTOMATION, measured_duration_seconds=0)"
          - "Increments PlaylistItem.version by 1"
      - from: CUED
        to: PLAYING
        trigger: "POST /playlist-items/{id}/playout-events with event_kind=START"
        actor: MasterControlOperator
        preconditions:
          - "No other item of the same playlist has playout_status == PLAYING (ERR_ITEM_INVALID_PLAYOUT_STATE)"
        side_effects:
          - "Writes actual_start_utc = event_utc"
          - "Appends AsRunEntry(event_kind=START, source=AUTOMATION)"
          - "Increments PlaylistItem.version by 1"
      - from: PLAYING
        to: PLAYED
        trigger: "POST /playlist-items/{id}/playout-events with event_kind=END"
        actor: MasterControlOperator
        preconditions:
          - "measured_duration_seconds present and >= 0"
        side_effects:
          - "Writes measured_duration_seconds; appends AsRunEntry(event_kind=END, source=AUTOMATION, measured_duration_seconds=<value>)"
          - "Recomputes Playlist.asrun_end_variance_seconds via calculations.playlist_timing_variance"
          - "When spot_order_id is set, calculations.spot_inventory_conservation moves the spot from scheduled_spots into aired_spots or short_aired_spots per the AIRED_FULL boundary in calculations.spot_credit_settlement and accrues any short-air credit"
          - "Increments PlaylistItem.version by 1"
      - from: PLAYING
        to: TRUNCATED
        trigger: "POST /playlist-items/{id}/playout-events with event_kind=TRUNCATE, or CASCADE C hop 3 (override cut-in), or CASCADE A hop 5, or a backtiming HARD_CUT plan"
        actor: MasterControlOperator | system
        preconditions:
          - "actual_start_utc is not null"
        side_effects:
          - "Writes measured_duration_seconds = event_utc - actual_start_utc (or the supplied value for the direct call)"
          - "Appends AsRunEntry(event_kind=TRUNCATION)"
          - "Recomputes Playlist.asrun_end_variance_seconds"
          - "When spot_order_id is set, moves the spot into short_aired_spots and accrues the pro-rata credit of calculations.spot_credit_settlement"
          - "Increments PlaylistItem.version by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /playlist-items/{id}/playout-events with event_kind=SKIP, a backtiming SKIP_ELEMENTS plan, POST /playlist-items/{id}/substitute, or the Playlist ON_AIR -> CLOSED sweep"
        actor: MasterControlOperator | system
        preconditions:
          - "element_kind != COMMERCIAL when the trigger is a backtiming plan (ERR_TRIM_EXCEEDS_MAX)"
        side_effects:
          - "Appends AsRunEntry(event_kind=SKIP)"
          - "When spot_order_id is set, moves the spot from scheduled_spots to credited_spots and accrues the full per-spot credit"
          - "Recomputes Playlist.projected_end_variance_seconds and asrun_end_variance_seconds"
          - "Increments PlaylistItem.version by 1"
      - from: CUED
        to: SKIPPED
        trigger: "POST /playlist-items/{id}/playout-events with event_kind=SKIP"
        actor: MasterControlOperator
        preconditions: []
        side_effects:
          - "Identical to SCHEDULED -> SKIPPED"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "CASCADE A hop 5, CASCADE C hop 3, or Channel ON_AIR -> DARK"
        actor: system
        preconditions:
          - "The owning Playlist.status == ON_AIR"
        side_effects:
          - "Appends AsRunEntry(event_kind=PREEMPTION, source=SYSTEM)"
          - "When spot_order_id is set, moves the spot from scheduled_spots to credited_spots and accrues the full per-spot credit"
          - "Increments PlaylistItem.version by 1"
      - from: CUED
        to: PREEMPTED
        trigger: "CASCADE A hop 5, CASCADE C hop 3, or Channel ON_AIR -> DARK"
        actor: system
        preconditions:
          - "The owning Playlist.status == ON_AIR"
        side_effects:
          - "Identical to SCHEDULED -> PREEMPTED"

  # ---------------------------------------------------------------------------
  # PlaylistItem dimension 2 of 2 — content-clearance axis. Driven only by Asset
  # lifecycle events and waivers; never by automation events.
  - entity: PlaylistItem
    dimension: clearance_status
    initial_state: UNCLEARED
    terminal_states: []
    transitions:
      - from: UNCLEARED
        to: CLEARED
        trigger: "Asset RECEIVED -> QC_PASSED, Asset QC_FAILED -> QC_WAIVED, or item creation when the referenced Asset is already QC_PASSED / QC_WAIVED"
        actor: system
        preconditions:
          - "Asset.status IN {QC_PASSED, QC_WAIVED}"
          - "NOT (Asset.captions_required AND Asset.caption_present == false) unless Asset.status == QC_WAIVED (ERR_CAPTION_REQUIREMENT_UNMET)"
        side_effects:
          - "Decrements Playlist.blocked_item_count when the previous value was BLOCKED"
          - "Increments PlaylistItem.version by 1"
      - from: UNCLEARED
        to: BLOCKED
        trigger: "Asset RECEIVED -> QC_FAILED, Asset -> EXPIRED, Asset -> RETRACTED, or item creation against an already failed/expired/retracted asset"
        actor: system
        preconditions:
          - "Asset.status IN {QC_FAILED, EXPIRED, RETRACTED}"
        side_effects:
          - "Increments Playlist.blocked_item_count; owning Playlist reverts VALIDATED/ARMED -> IMPORTED"
          - "Increments PlaylistItem.version by 1"
      - from: CLEARED
        to: BLOCKED
        trigger: "Asset QC_PASSED -> RETRACTED (CASCADE B hop 1) or Asset RECEIVED -> QC_FAILED after a passing report was superseded"
        actor: system
        preconditions:
          - "playout_status IN {SCHEDULED, CUED} — items already PLAYING or terminal keep their clearance_status"
        side_effects:
          - "Increments Playlist.blocked_item_count; owning Playlist reverts VALIDATED/ARMED -> IMPORTED; spot credit accrues per CASCADE B hop 3"
          - "Increments PlaylistItem.version by 1"
      - from: BLOCKED
        to: CLEARED
        trigger: "Asset QC_FAILED -> QC_WAIVED, or a later passing QCReport on a redelivered asset"
        actor: system
        preconditions:
          - "Asset.status IN {QC_PASSED, QC_WAIVED}"
          - "playout_status IN {SCHEDULED, CUED}"
        side_effects:
          - "Decrements Playlist.blocked_item_count"
          - "Increments PlaylistItem.version by 1"
        note: "Cycle on the clearance axis: CLEARED -> BLOCKED -> CLEARED across a retraction/redelivery/waiver sequence."

  # ---------------------------------------------------------------------------
  # NetworkFeedWindow — branching on the computed backtiming plan.
  - entity: NetworkFeedWindow
    dimension: state
    initial_state: PLANNED
    terminal_states: [BROKEN_AWAY, ABANDONED]
    transitions:
      - from: PLANNED
        to: JOINED
        trigger: "POST /network-feed-windows/{id}/join"
        actor: MasterControlOperator
        preconditions:
          - "Channel.air_status == ON_AIR (ERR_CHANNEL_NOT_ON_AIR)"
          - "Channel.posture != SUSPENDED (ERR_CHANNEL_SUSPENDED_POSTURE)"
          - "The channel's ON_AIR Playlist exists (ERR_PLAYLIST_NOT_ON_AIR)"
          - "The computed plan_action is not SKIP_ELEMENTS over a GUARANTEED commercial (ERR_TRIM_EXCEEDS_MAX)"
        side_effects:
          - "Runs calculations.backtime_join_plan and writes plan_action, backtime_pad_seconds, backtime_trim_seconds, residual_dead_air_seconds, late_join_seconds, skipped_item_sequences, plan_computed_utc"
          - "Branch PAD_WITH_FILLER: creates one FILLER PlaylistItem with sequence_number = anchor_sequence_number - 1 shifted convention (appended with the next free sequence_number), scheduled_duration_seconds = backtime_pad_seconds, clearance_status=CLEARED, and appends AsRunEntry(event_kind=FILLER_INSERT)"
          - "Branch TRIM_TAIL: reduces scheduled_duration_seconds and sets trim_applied_seconds on trimmable tail items in ascending sequence_number order, never below scheduled_duration_seconds - max_trim_seconds"
          - "Branch SKIP_ELEMENTS: flips the items in skipped_item_sequences to playout_status=SKIPPED (each with its own AsRunEntry and spot-credit accrual per the PlaylistItem SCHEDULED -> SKIPPED rules)"
          - "Branch JOIN_IN_PROGRESS: flips the PLAYING item, if any, to TRUNCATED and records late_join_seconds"
          - "Branch HARD_CUT: no filler, no trim; the PLAYING item is truncated at the join instant"
          - "Appends AsRunEntry(event_kind=JOIN, source=OPERATOR)"
          - "Recomputes Playlist.projected_end_variance_seconds and asrun_end_variance_seconds"
          - "Increments NetworkFeedWindow.version by 1"
      - from: JOINED
        to: BROKEN_AWAY
        trigger: "POST /network-feed-windows/{id}/breakaway"
        actor: MasterControlOperator
        preconditions:
          - "logical_now >= breakaway_utc - guard_seconds (ERR_BREAKAWAY_TOO_EARLY); at exactly breakaway_utc - guard_seconds the breakaway is permitted"
        side_effects:
          - "Appends AsRunEntry(event_kind=BREAKAWAY, source=OPERATOR)"
          - "Releases the window's live_encoder_units, lowering Multiplex.live_encoder_units_peak on the next evaluation of calculations.live_encoder_concurrency_peak"
          - "Increments NetworkFeedWindow.version by 1"
      - from: PLANNED
        to: ABANDONED
        trigger: "Channel ON_AIR -> DARK cascade, or CASCADE A hop 4 driving the channel to SUSPENDED posture"
        actor: system
        preconditions:
          - "Channel.posture == SUSPENDED or Channel.air_status == DARK"
        side_effects:
          - "Releases the window's live_encoder_units"
          - "Increments NetworkFeedWindow.version by 1"

  # ---------------------------------------------------------------------------
  # EmergencyOverride — cyclic: crawl and cut-in escalate and de-escalate.
  - entity: EmergencyOverride
    dimension: state
    initial_state: PENDING
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: PENDING
        to: ACTIVE_CRAWL
        trigger: "POST /emergency-overrides/{id}/activate with activate_mode=CRAWL"
        actor: MasterControlOperator | ProgramDirector
        preconditions:
          - "Acting Operator.override_authority IN {CRAWL_ONLY, CRAWL_AND_CUTIN, FULL} (ERR_OVERRIDE_AUTHORITY_INSUFFICIENT)"
          - "Acting Operator.certification_state == VALID (ERR_OPERATOR_CERTIFICATION_EXPIRED)"
          - "Channel.posture != SUSPENDED (ERR_CHANNEL_SUSPENDED_POSTURE) — cross-entity dependency EmergencyOverride -> Channel"
          - "crawl_text is not null (ERR_CRAWL_TEXT_REQUIRED)"
          - "alert_class != BREAKING_NEWS OR X-User-ID != requested_by_operator_id (ERR_SELF_AUTHORIZATION_FORBIDDEN)"
          - "No other EmergencyOverride on the same channel with state IN {ACTIVE_CRAWL, ACTIVE_CUTIN} whose closed occupancy interval overlaps this one (ERR_OVERRIDE_WINDOW_OVERLAP)"
        side_effects:
          - "Writes authorized_by_operator_id = X-User-ID, activated_utc = logical_now, active_mode = CRAWL"
          - "Channel.posture recomputes to EMERGENCY (calculations.channel_posture step 2); air_status is unchanged because a crawl is an overlay"
          - "Appends AsRunEntry(event_kind=OVERRIDE_IN, source=OPERATOR) against the currently PLAYING item of the channel's ON_AIR playlist when one exists"
          - "Increments EmergencyOverride.version and Channel.version by 1"
      - from: PENDING
        to: ACTIVE_CUTIN
        trigger: "POST /emergency-overrides/{id}/activate with activate_mode=CUT_IN"
        actor: MasterControlOperator | ProgramDirector
        preconditions:
          - "Acting Operator.override_authority IN {CRAWL_AND_CUTIN, FULL} (ERR_OVERRIDE_AUTHORITY_INSUFFICIENT)"
          - "Acting Operator.certification_state == VALID (ERR_OPERATOR_CERTIFICATION_EXPIRED)"
          - "Channel.posture != SUSPENDED (ERR_CHANNEL_SUSPENDED_POSTURE)"
          - "alert_class != BREAKING_NEWS OR X-User-ID != requested_by_operator_id (ERR_SELF_AUTHORIZATION_FORBIDDEN)"
          - "No overlapping active override on the channel (ERR_OVERRIDE_WINDOW_OVERLAP)"
        side_effects:
          - "CASCADE C hop 1: writes authorized_by_operator_id, activated_utc = logical_now, active_mode = CUT_IN"
          - "CASCADE C hop 2 (caused by hop 1): Channel.air_status -> EAS_OVERRIDE and Channel.posture -> EMERGENCY"
          - "CASCADE C hop 3 (caused by hop 2): the PLAYING item of the channel's ON_AIR playlist flips to TRUNCATED with measured_duration_seconds = logical_now - actual_start_utc; every item whose [scheduled_start_utc, scheduled_start_utc + scheduled_duration_seconds) window lies inside [logical_now, logical_now + expected_duration_seconds) and whose playout_status IN {SCHEDULED, CUED} flips to PREEMPTED; truncated_item_count and preempted_item_count are written; one AsRunEntry per affected item plus AsRunEntry(event_kind=OVERRIDE_IN)"
          - "CASCADE C hop 4 (caused by hop 3): for every affected item with spot_order_id set, calculations.spot_inventory_conservation moves the spot to short_aired_spots (truncated) or credited_spots (preempted) and accrues the credit from calculations.spot_credit_settlement; SpotOrder.status refreshes"
          - "CASCADE C hop 5 (caused by hop 3): Playlist.asrun_end_variance_seconds recomputes via calculations.playlist_timing_variance"
          - "Increments EmergencyOverride.version and Channel.version by 1"
      - from: ACTIVE_CRAWL
        to: ACTIVE_CUTIN
        trigger: "POST /emergency-overrides/{id}/activate with activate_mode=CUT_IN (escalation)"
        actor: MasterControlOperator | ProgramDirector
        preconditions:
          - "Acting Operator.override_authority IN {CRAWL_AND_CUTIN, FULL} (ERR_OVERRIDE_AUTHORITY_INSUFFICIENT)"
          - "alert_class != BREAKING_NEWS OR X-User-ID != requested_by_operator_id (ERR_SELF_AUTHORIZATION_FORBIDDEN)"
        side_effects:
          - "Runs the whole of CASCADE C hops 2-5; authorized_by_operator_id is overwritten with the escalating operator"
          - "Increments EmergencyOverride.version and Channel.version by 1"
      - from: ACTIVE_CUTIN
        to: ACTIVE_CRAWL
        trigger: "POST /emergency-overrides/{id}/activate with activate_mode=CRAWL (de-escalation)"
        actor: MasterControlOperator | ProgramDirector
        preconditions:
          - "crawl_text is not null (ERR_CRAWL_TEXT_REQUIRED)"
          - "logical_now - activated_utc >= EAS_MIN_ON_AIR_SECONDS (120) when alert_class == EAS_MANDATORY (ERR_EAS_MINIMUM_DURATION_NOT_MET); at exactly 120 seconds the de-escalation is permitted"
        side_effects:
          - "active_mode = CRAWL; Channel.air_status returns from EAS_OVERRIDE to ON_AIR; posture stays EMERGENCY"
          - "Items already TRUNCATED or PREEMPTED are NOT restored (no compensation on de-escalation)"
          - "Increments EmergencyOverride.version and Channel.version by 1"
        note: "Cycle: ACTIVE_CRAWL -> ACTIVE_CUTIN -> ACTIVE_CRAWL may repeat any number of times."
      - from: ACTIVE_CRAWL
        to: RELEASED
        trigger: "POST /emergency-overrides/{id}/release"
        actor: MasterControlOperator | ProgramDirector
        preconditions:
          - "logical_now - activated_utc >= EAS_MIN_ON_AIR_SECONDS (120) when alert_class == EAS_MANDATORY (ERR_EAS_MINIMUM_DURATION_NOT_MET)"
        side_effects:
          - "Writes released_utc = logical_now, active_mode = null"
          - "Channel.posture recomputes (EMERGENCY clears; DEGRADED_CRITICAL / DEGRADED / NORMAL per open faults and transmitter state)"
          - "Appends AsRunEntry(event_kind=OVERRIDE_OUT, source=OPERATOR)"
          - "Increments EmergencyOverride.version and Channel.version by 1"
      - from: ACTIVE_CUTIN
        to: RELEASED
        trigger: "POST /emergency-overrides/{id}/release"
        actor: MasterControlOperator | ProgramDirector
        preconditions:
          - "logical_now - activated_utc >= EAS_MIN_ON_AIR_SECONDS (120) when alert_class == EAS_MANDATORY (ERR_EAS_MINIMUM_DURATION_NOT_MET)"
        side_effects:
          - "Writes released_utc, active_mode = null; Channel.air_status EAS_OVERRIDE -> ON_AIR; posture recomputes"
          - "COMPENSATION: preempted commercial spots stay credited; calculations.spot_inventory_conservation is not reversed by the release itself — only a makegood placement moves a spot back from credited_spots to scheduled_spots"
          - "Appends AsRunEntry(event_kind=OVERRIDE_OUT, source=OPERATOR)"
          - "Increments EmergencyOverride.version and Channel.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /emergency-overrides/{id}/release on a PENDING request (rejection path) with rejection_reason"
        actor: ProgramDirector
        preconditions:
          - "rejection_reason present (ERR_REJECTION_REASON_REQUIRED)"
        side_effects:
          - "Writes rejection_reason; no channel or item side effects"
          - "Increments EmergencyOverride.version by 1"

  # ---------------------------------------------------------------------------
  # TechnicalFault — branching with an escalation path and a system auto-clear.
  - entity: TechnicalFault
    dimension: state
    initial_state: DETECTED
    terminal_states: [RESOLVED, AUTO_CLEARED]
    transitions:
      - from: DETECTED
        to: ACKNOWLEDGED
        trigger: "POST /technical-faults/{id}/state with target_state=ACKNOWLEDGED"
        actor: MasterControlOperator | BroadcastEngineer
        preconditions: []
        side_effects:
          - "Writes acknowledged_by_user_id = X-User-ID; recomputes duration_seconds and severity"
          - "Recomputes Channel.posture (open-fault counts unchanged, but severity may have escalated with duration)"
          - "Increments TechnicalFault.version by 1"
      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /technical-faults/{id}/state with target_state=ESCALATED"
        actor: MasterControlOperator | BroadcastEngineer
        preconditions:
          - "duration_seconds >= FAULT_ESCALATION_SECONDS (120) (ERR_FAULT_ESCALATION_TOO_EARLY); at exactly 120 the escalation is permitted"
        side_effects:
          - "severity is raised one step (MINOR -> MAJOR -> CRITICAL, CRITICAL stays CRITICAL)"
          - "Recomputes Channel.posture, which may flip the channel to DEGRADED_CRITICAL and thereby block Playlist arming"
          - "Increments TechnicalFault.version and Channel.version by 1"
      - from: ACKNOWLEDGED
        to: MITIGATED
        trigger: "POST /technical-faults/{id}/state with target_state=MITIGATED"
        actor: MasterControlOperator | BroadcastEngineer
        preconditions:
          - "mitigation_code present (ERR_MITIGATION_CODE_REQUIRED)"
        side_effects:
          - "Writes mitigation_code"
          - "When mitigation_code == BARS_AND_TONE and Channel.air_status == ON_AIR, drives Channel ON_AIR -> BARS_AND_TONE with its own cascade (currently PLAYING item truncated)"
          - "Increments TechnicalFault.version by 1"
      - from: ESCALATED
        to: MITIGATED
        trigger: "POST /technical-faults/{id}/state with target_state=MITIGATED"
        actor: MasterControlOperator | BroadcastEngineer
        preconditions:
          - "mitigation_code present (ERR_MITIGATION_CODE_REQUIRED)"
        side_effects:
          - "Identical to ACKNOWLEDGED -> MITIGATED"
      - from: MITIGATED
        to: RESOLVED
        trigger: "POST /technical-faults/{id}/state with target_state=RESOLVED"
        actor: MasterControlOperator | BroadcastEngineer
        preconditions: []
        side_effects:
          - "Writes cleared_utc = logical_now and freezes duration_seconds"
          - "Decrements Channel.open_fault_count and recomputes Channel.posture, which may return the channel from DEGRADED_CRITICAL / DEGRADED to NORMAL"
          - "When the fault has playlist_item_id set, the AIR_CHECK variant of calculations.asset_technical_score becomes recomputable for that item's asset"
          - "Increments TechnicalFault.version and Channel.version by 1"
      - from: DETECTED
        to: AUTO_CLEARED
        trigger: "POST /_clock/set_current_utc advancing logical_now past detected_utc + FAULT_AUTO_CLEAR_SECONDS"
        actor: system
        preconditions:
          - "state == DETECTED (never acknowledged)"
          - "severity == MINOR"
          - "logical_now - detected_utc >= FAULT_AUTO_CLEAR_SECONDS (900)"
        side_effects:
          - "Writes cleared_utc = logical_now; decrements Channel.open_fault_count; recomputes Channel.posture"
          - "Increments TechnicalFault.version and Channel.version by 1"
        note: "Only MINOR, never-acknowledged faults auto-clear; MAJOR and CRITICAL faults must be worked."

  # ---------------------------------------------------------------------------
  # SpotOrder — compound: status is a function of the counters that reconciliation
  # writes, and it can move backwards when a makegood is placed.
  - entity: SpotOrder
    dimension: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PARTIALLY_CREDITED
        trigger: "Any credit accrual (item PREEMPTED / SKIPPED / TRUNCATED, CASCADE A hop 6, CASCADE B hop 3, CASCADE C hop 4) or the Playlist -> CLOSED settlement"
        actor: system
        preconditions:
          - "0 < credited_spots + short_aired_spots < ordered_spots"
        side_effects:
          - "Writes credit_accrued_cents per calculations.spot_credit_settlement; preserves calculations.spot_inventory_conservation"
      - from: OPEN
        to: FULLY_AIRED
        trigger: "Playlist ON_AIR -> CLOSED settlement"
        actor: system
        preconditions:
          - "aired_spots == ordered_spots and credited_spots == 0 and short_aired_spots == 0"
        side_effects:
          - "credit_accrued_cents stays 0"
      - from: PARTIALLY_CREDITED
        to: CLOSED_WITH_CREDIT
        trigger: "Playlist ON_AIR -> CLOSED settlement"
        actor: system
        preconditions:
          - "credited_spots + short_aired_spots + aired_spots + unplaced_spots == ordered_spots and scheduled_spots == 0 and credited_spots + unplaced_spots > 0"
        side_effects:
          - "Writes the FINAL-basis credit into credit_accrued_cents and into Playlist.reconciliation_credit_cents"
      - from: PARTIALLY_CREDITED
        to: OPEN
        trigger: "POST /spot-orders/{id}/makegoods"
        actor: TrafficCoordinator
        preconditions:
          - "credited_spots >= 1 (ERR_NO_CREDITED_SPOT_TO_MAKEGOOD)"
          - "logical_now <= makegood_deadline_utc (ERR_MAKEGOOD_DEADLINE_PASSED); at exactly makegood_deadline_utc the placement is permitted"
          - "Target Playlist.channel_id == SpotOrder.channel_id (ERR_SPOT_ORDER_CHANNEL_MISMATCH)"
          - "expected_playlist_version matches the target Playlist.version (ERR_STALE_PLAYLIST_VERSION)"
        side_effects:
          - "COMPENSATION: creates a PlaylistItem with is_makegood = true, element_kind = COMMERCIAL, replaces_item_id = the credited item, and moves one spot from credited_spots back to scheduled_spots, subtracting exactly the credit that spot had accrued from credit_accrued_cents so that calculations.spot_inventory_conservation holds"
          - "Recomputes the target Playlist's commercial_seconds_by_hour, scheduled_total_seconds and both variance fields; the playlist reverts VALIDATED/ARMED -> IMPORTED"
          - "Increments SpotOrder.version and Playlist.version by 1"
        note: "Backward status move: an order that had been PARTIALLY_CREDITED returns to OPEN once every credited spot has a makegood placed."

  # ---------------------------------------------------------------------------
  # RegulatoryNotification — deadline-driven, with an OVERDUE branch that changes
  # the terminal state of a later filing.
  - entity: RegulatoryNotification
    dimension: status
    initial_state: PENDING
    terminal_states: [FILED, LATE_FILED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /regulatory-notifications/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "logical_now <= due_utc; at exactly due_utc the filing is on time"
          - "filed_reference and narrative present (ERR_FILING_DETAILS_REQUIRED)"
        side_effects:
          - "Writes filed_utc = logical_now, filed_reference, narrative"
          - "Decrements Transmitter.notification_pending_count"
          - "Increments RegulatoryNotification.version by 1"
      - from: PENDING
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc advancing logical_now past due_utc"
        actor: system
        preconditions:
          - "status == PENDING and logical_now > due_utc"
        side_effects:
          - "Increments RegulatoryNotification.version by 1"
      - from: OVERDUE
        to: LATE_FILED
        trigger: "POST /regulatory-notifications/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "filed_reference and narrative present (ERR_FILING_DETAILS_REQUIRED)"
        side_effects:
          - "Writes filed_utc = logical_now; status LATE_FILED records the missed window"
          - "Decrements Transmitter.notification_pending_count"
          - "Increments RegulatoryNotification.version by 1"
      - from: PENDING
        to: LATE_FILED
        trigger: "POST /regulatory-notifications/{id}/file when logical_now > due_utc and the clock checkpoint has not yet run"
        actor: ComplianceOfficer
        preconditions:
          - "logical_now > due_utc"
          - "filed_reference and narrative present"
        side_effects:
          - "Identical to OVERDUE -> LATE_FILED; the filing endpoint evaluates lateness itself rather than depending on the checkpoint having run"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: playlist-revision-stale-playlist
    parent_entity: Playlist
    write_endpoint: "POST /playlists/{id}/traffic-revisions"
    occ_field: "expected_playlist_version"
    description: |
      Ingesting a traffic revision against a Playlist whose version has advanced
      since the client last read it is rejected. A revision legitimately
      supersedes every SCHEDULED item of the prior revision, so a writer holding
      a stale view would silently discard item edits, substitutions or makegood
      placements it never saw.
    error_id: ERR_STALE_PLAYLIST_VERSION
    http_status: 412

  - rule_id: makegood-placement-stale-playlist
    parent_entity: Playlist
    write_endpoint: "POST /spot-orders/{id}/makegoods"
    occ_field: "expected_playlist_version"
    description: |
      Placing a makegood spot into a target Playlist whose version has advanced
      since the client last read it is rejected. Makegood placement is
      position-sensitive (it re-derives commercial_seconds_by_hour and the
      timing variance), so a stale view of the playlist would place the spot
      against a schedule that no longer exists.
    error_id: ERR_STALE_PLAYLIST_VERSION
    http_status: 412

  - rule_id: channel-create-stale-multiplex
    parent_entity: Multiplex
    write_endpoint: "POST /channels"
    occ_field: "expected_multiplex_version"
    description: |
      Creating a Channel on a Multiplex whose version has advanced since the
      client last read it is rejected. Every channel creation re-slices the
      whole bit pool, legitimately superseding the prior allocation set, so a
      writer holding a stale view of the multiplex would compute its bitrate
      expectations against a pool that has already been re-divided.
    error_id: ERR_STALE_MULTIPLEX_VERSION
    http_status: 412

  - rule_id: channel-allocation-stale-multiplex
    parent_entity: Multiplex
    write_endpoint: "PATCH /channels/{id}/allocation"
    occ_field: "expected_multiplex_version"
    description: |
      Changing a channel's requested bitrate, floor, priority rank or allocation
      state against a Multiplex whose version has advanced since the client last
      read it is rejected, because the new allocation set supersedes the one the
      client based its request on.
    error_id: ERR_STALE_MULTIPLEX_VERSION
    http_status: 412

  - rule_id: multiplex-rebalance-stale-multiplex
    parent_entity: Multiplex
    write_endpoint: "POST /multiplexes/{id}/rebalance"
    occ_field: "expected_multiplex_version"
    description: |
      Re-running the bitrate waterfall on a Multiplex whose version has advanced
      since the client last read it is rejected. A rebalance legitimately
      supersedes the standing allocation set, so a stale-view writer would
      confirm an allocation it never observed.
    error_id: ERR_STALE_MULTIPLEX_VERSION
    http_status: 412

  - rule_id: qc-report-stale-asset
    parent_entity: Asset
    write_endpoint: "POST /assets/{id}/qc-reports"
    occ_field: "expected_asset_version"
    description: |
      Submitting a QC report against an Asset whose version has advanced since
      the client last read it is rejected. A new report legitimately supersedes
      the prior same-basis report and rewrites the asset verdict, so a stale
      view would grade media that has since been redelivered, waived or
      retracted.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---------------------------------------------------------------------------
  - name: multiplex_bitrate_allocation
    trigger: "POST /channels (create), PATCH /channels/{id}/allocation, POST /multiplexes/{id}/rebalance, and CASCADE A hop 3 from any POST /transmitters/{id}/power-state"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED 1 -> 5. The value of every later step depends
      # on the completed result of the earlier steps, so the apparent circularity
      # (allocation <- remainder <- floors <- capacity <- derate) is well defined.

      # STEP 1 — derate the pool from the parent transmitter's RF state.
      derate_factor =
          1.00  if Transmitter.operational_state == FULL_POWER
          0.75  if Transmitter.operational_state == REDUCED_POWER and Transmitter.current_power_pct >= 50
          0.50  if Transmitter.operational_state == REDUCED_POWER and Transmitter.current_power_pct <  50
          0.00  if Transmitter.operational_state == OFF_AIR
      effective_capacity_kbps = max(0, floor(Multiplex.total_capacity_kbps * derate_factor)
                                       - Multiplex.pilot_reserved_kbps)

      # STEP 2 — grant floors in strict waterfall order.
      C = [ Channel c : c.multiplex_id == Multiplex.id
                        AND c.allocation_state IN {ACTIVE, STANDBY, STARVED} ]
          ordered by (c.priority_rank ASC, c.created_at ASC)
      running_floor = 0
      granted = []            # channels that keep their floor
      for c in C:
          if running_floor + c.floor_bitrate_kbps <= effective_capacity_kbps:   # NOTE: <=, exact fit is granted
              running_floor += c.floor_bitrate_kbps
              granted.append(c)
              c.allocation_state = (STANDBY if c.allocation_state == STANDBY else ACTIVE)
          else:
              c.allocation_state = STARVED
              c.allocated_bitrate_kbps = 0                # excluded from steps 3-5

      # STEP 3 — weighted distribution of the remainder.
      remainder = effective_capacity_kbps - running_floor
      weight(c) = c.requested_bitrate_kbps - c.floor_bitrate_kbps        # always >= 0
      total_weight = sum(weight(c) for c in granted)
      for c in granted:
          if total_weight == 0:
              share(c) = 0
          else:
              share(c) = min( floor(remainder * weight(c) / total_weight), weight(c) )
          c.allocated_bitrate_kbps = c.floor_bitrate_kbps + share(c)

      # STEP 4 — leftover sweep, 1 kbps at a time, same deterministic order.
      leftover = remainder - sum(share(c) for c in granted)
      while leftover > 0:
          under = [ c in granted : c.allocated_bitrate_kbps < c.requested_bitrate_kbps ]
                  ordered by (c.priority_rank ASC, c.created_at ASC)
          if under is empty: break                # residual stays in available_kbps
          for c in under:
              if leftover == 0: break
              c.allocated_bitrate_kbps += 1
              leftover -= 1

      # STEP 5 — roll up the pool.
      Multiplex.effective_capacity_kbps = effective_capacity_kbps
      Multiplex.assigned_kbps  = sum(c.allocated_bitrate_kbps for c in C if c.allocation_state IN {ACTIVE, STANDBY})
      Multiplex.available_kbps = effective_capacity_kbps - Multiplex.assigned_kbps
      Multiplex.starved_channel_count = count(c in C if c.allocation_state == STARVED)
    input_set: "Every Channel on the multiplex with allocation_state IN {ACTIVE, STANDBY, STARVED} — STARVED channels re-enter the waterfall on every run so that recovery is possible. Channels on other multiplexes never participate."
    constants:
      DERATE_FULL: 1.00
      DERATE_REDUCED_HIGH: 0.75
      DERATE_REDUCED_LOW: 0.50
      DERATE_OFF_AIR: 0.00
      REDUCED_POWER_HIGH_PCT_THRESHOLD: 50
      LEFTOVER_STEP_KBPS: 1
    precision: "Integer kbps throughout; every division is truncated with floor(). No rounding of fractional kbps ever survives a step."
    tie_break: "priority_rank ASC, then created_at ASC. Channel.id is never consulted."
    variants:
      - name: FULL_POOL
        when: "Transmitter.operational_state == FULL_POWER"
        difference: "derate_factor 1.00; the pool is the nominal capacity less pilot reservation."
      - name: DERATED_POOL
        when: "Transmitter.operational_state IN {REDUCED_POWER, OFF_AIR}"
        difference: "derate_factor < 1.00 shrinks effective_capacity_kbps before floors are granted, so the tail of the priority order starves even though no channel changed its own request."

  # ---------------------------------------------------------------------------
  - name: multiplex_capacity_conservation
    trigger: "Asserted after every run of multiplex_bitrate_allocation, i.e. after channel create, allocation patch, rebalance and every transmitter power-state change"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1: transport-stream bandwidth (kbps).
      INVARIANT_KBPS:
        Multiplex.available_kbps
        + Multiplex.assigned_kbps
        == max(0, floor(Multiplex.total_capacity_kbps * Transmitter.derate_factor)
                  - Multiplex.pilot_reserved_kbps)

      # And, equivalently, over the channel rows:
        Multiplex.assigned_kbps
        == sum(Channel.allocated_bitrate_kbps
               for Channel where multiplex_id == Multiplex.id
                             and allocation_state IN {ACTIVE, STANDBY})

      # Compensating-action form: for any forward action F that grants bandwidth
      # (POST /channels with allocation_state=ACTIVE) and its compensating action
      # F' (PATCH /channels/{id}/allocation setting allocation_state=STANDBY then
      # back, or a rebalance after the reverse power-state change), the value of
      # INVARIANT_KBPS is identical before F and after F'. Bandwidth is never
      # created or destroyed by a cascade: STARVED channels contribute exactly 0
      # and their forgone kbps reappears in available_kbps.
    input_set: "All channels of one multiplex with allocation_state IN {ACTIVE, STANDBY, STARVED}; pilot_reserved_kbps is outside the allocatable pool and never enters assigned_kbps."
    constants: {}
    precision: "Exact integer equality; no tolerance."

  # ---------------------------------------------------------------------------
  - name: channel_posture
    trigger: "Recomputed on POST /technical-faults, POST /technical-faults/{id}/state, POST /emergency-overrides/{id}/activate, POST /emergency-overrides/{id}/release, POST /transmitters/{id}/power-state, POST /channels/{id}/air-state, POST /multiplexes/{id}/rebalance, PATCH /channels/{id}/allocation and POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      # First matching clause wins; clauses are evaluated top to bottom.
      open_faults = [ TechnicalFault f : f.channel_id == Channel.id
                                        AND f.state IN {DETECTED, ACKNOWLEDGED, ESCALATED} ]
      major_count = count(f in open_faults where f.severity == MAJOR)
      has_critical = any(f in open_faults where f.severity == CRITICAL)
      has_active_override = exists EmergencyOverride o : o.channel_id == Channel.id
                                                        AND o.state IN {ACTIVE_CRAWL, ACTIVE_CUTIN}

      1. SUSPENDED           if Channel.allocation_state == STARVED
                                OR Transmitter.operational_state == OFF_AIR
      2. EMERGENCY           elif has_active_override
      3. DEGRADED_CRITICAL   elif has_critical
      4. DEGRADED            elif major_count >= 2                     # NOTE: >= 2, exactly 2 degrades
                                OR Transmitter.operational_state == REDUCED_POWER
      5. NORMAL              else

      Channel.open_fault_count = count(open_faults)
    input_set: "Open faults are exactly those with state IN {DETECTED, ACKNOWLEDGED, ESCALATED}; MITIGATED, RESOLVED and AUTO_CLEARED faults never count. Overrides count only in states ACTIVE_CRAWL and ACTIVE_CUTIN — PENDING, RELEASED and REJECTED do not."
    constants:
      MAJOR_FAULT_DEGRADE_THRESHOLD: 2
    precision: "Enum output; no numeric rounding."
    variants:
      - name: SEVERITY_MAP
        when: "TechnicalFault.severity is derived, not supplied"
        difference: "severity = FAULT_SEVERITY[fault_code], raised one step when duration_seconds >= FAULT_ESCALATION_SECONDS (120) or when the fault reached ESCALATED. FAULT_SEVERITY = {AUDIO_LOSS: MAJOR, BLACK_FRAME: MAJOR, CAPTION_LOSS: MINOR, LOSS_OF_SIGNAL: CRITICAL, ENCODER_FAILURE: CRITICAL, RF_POWER_FAULT: MAJOR, AUTOMATION_STALL: MINOR}."

  # ---------------------------------------------------------------------------
  - name: playlist_timeline_integrity
    trigger: "POST /playlists, POST /playlists/{id}/traffic-revisions, POST /spot-orders/{id}/makegoods, POST /playlist-items/{id}/substitute and POST /playlists/{id}/state with target_status=VALIDATED"
    algorithm: interval_merge
    formula: |
      # Interval semantics A of the scaffold: HALF-OPEN [start, end) on a single
      # Channel timeline, and adjacency is MANDATORY (no gaps, no overlaps).
      items = [ PlaylistItem i : i.playlist_id == Playlist.id
                                 AND i.playout_status NOT IN {SKIPPED, PREEMPTED} ]
              ordered by sequence_number ASC
      if items is empty: raise ERR_PLAYLIST_NO_PROGRAM_CONTENT      # empty-set edge
      if items[0].scheduled_start_utc != Playlist.schedule_start_utc:
          raise ERR_SCHEDULE_GAP_DETECTED
      for k in 0 .. len(items) - 2:
          end_k = items[k].scheduled_start_utc + items[k].scheduled_duration_seconds
          nxt   = items[k+1].scheduled_start_utc
          if nxt > end_k: raise ERR_SCHEDULE_GAP_DETECTED          # a 1-second hole is a gap
          if nxt < end_k: raise ERR_SCHEDULE_OVERLAP_DETECTED      # touching (nxt == end_k) is legal
      timeline_end = items[-1].scheduled_start_utc + items[-1].scheduled_duration_seconds
      Playlist.scheduled_total_seconds = sum(i.scheduled_duration_seconds for i in items)
    input_set: "Items with playout_status IN {SKIPPED, PREEMPTED} are removed from the timeline before the contiguity walk, so a skipped element does not create a gap. Items with clearance_status == BLOCKED remain on the timeline."
    constants: {}
    precision: "Whole seconds; datetimes compared at second granularity."

  # ---------------------------------------------------------------------------
  - name: playlist_timing_variance
    trigger: "POST /playlists, POST /playlists/{id}/traffic-revisions, POST /playlists/{id}/state (VALIDATED and CLOSED), every POST /playlist-items/{id}/playout-events, every backtiming plan execution, POST /spot-orders/{id}/makegoods, and every cascade that flips an item to TRUNCATED / SKIPPED / PREEMPTED"
    algorithm: forward_looking
    formula: |
      window = Playlist.window_duration_seconds

      # VARIANT 1 — PROJECTED (forward looking): trust the schedule for
      # everything that has not been dropped.
      projected_sum = sum( i.scheduled_duration_seconds
                           for i in items(Playlist)
                           if i.playout_status NOT IN {SKIPPED, PREEMPTED} )
      Playlist.projected_end_variance_seconds = projected_sum - window

      # VARIANT 2 — AS_RUN (chronological): walk the items in play order and take
      # the measured value wherever one exists.
      asrun_sum = 0
      for i in items(Playlist) ordered by sequence_number ASC:
          if   i.playout_status IN {PLAYED, TRUNCATED}: asrun_sum += i.measured_duration_seconds
          elif i.playout_status IN {SKIPPED, PREEMPTED}: asrun_sum += 0
          else:                                          asrun_sum += i.scheduled_duration_seconds
      Playlist.asrun_end_variance_seconds = asrun_sum - window

      # Positive => overrun (the day runs long), negative => underrun (dead air
      # to be filled). The two variants disagree for identical stored data
      # whenever any item has measured_duration_seconds != scheduled_duration_seconds.
    input_set: "Both variants scan every PlaylistItem of the playlist, including makegood and filler items and items with clearance_status == BLOCKED. Neither variant consults AsRunEntry rows; measured_duration_seconds on the item is the single source of aired length."
    constants:
      ARM_VARIANCE_TOLERANCE_SECONDS: 30
    precision: "Whole seconds, signed integers; no rounding."
    variants:
      - name: PROJECTED
        when: "Written to Playlist.projected_end_variance_seconds; the value gated by the ARM precondition"
        difference: "Uses scheduled_duration_seconds for every non-dropped item, including items that already aired short."
      - name: AS_RUN
        when: "Written to Playlist.asrun_end_variance_seconds; the value reported at CLOSED"
        difference: "Uses measured_duration_seconds for PLAYED and TRUNCATED items, so a truncated element shortens the day while PROJECTED still counts its full booked length."

  # ---------------------------------------------------------------------------
  - name: backtime_join_plan
    trigger: "POST /network-feed-windows/{id}/join (plan computed and executed) and POST /network-feed-windows/{id}/breakaway (plan recomputed against breakaway_utc for the return to local)"
    algorithm: constraint_propagation
    formula: |
      # Five inputs interact non-linearly: remaining time, pending tail length,
      # guard band, tolerance mode and the trimmable/skippable makeup of the tail.
      target_utc   = feed.join_utc                      # breakaway call uses feed.breakaway_utc
      remaining    = target_utc - logical_now                                  # signed seconds
      tail = [ PlaylistItem i : i.playlist_id == on_air_playlist(feed.channel_id).id
                                AND i.sequence_number >= feed.anchor_sequence_number
                                AND i.playout_status IN {SCHEDULED, CUED} ]
             ordered by sequence_number ASC
      pending_tail = sum(i.scheduled_duration_seconds for i in tail)
      slack        = remaining - pending_tail                                  # signed
      tolerance =
          feed.guard_seconds                                     if feed.backtiming_mode == STRICT
          max(feed.guard_seconds,
              min(floor(pending_tail * BACKTIME_TOLERANCE_RATIO),
                  BACKTIME_TOLERANCE_CAP_SECONDS))               if feed.backtiming_mode == TOLERANT

      # Branch selection — first matching clause wins.
      if remaining <= 0:
          plan_action = JOIN_IN_PROGRESS
          late_join_seconds = -remaining ; pad = 0 ; trim = 0 ; skipped = []
      elif abs(slack) <= tolerance:                       # NOTE: <=, exactly at tolerance is a HARD_CUT
          plan_action = HARD_CUT ; pad = 0 ; trim = 0 ; skipped = [] ; late_join_seconds = 0
      elif slack > tolerance:                             # early: local content ends before the feed
          pad = min(slack, MAX_FILLER_SECONDS)
          residual_dead_air = slack - pad
          plan_action = PAD_WITH_FILLER ; trim = 0 ; skipped = []
      else:                                               # slack < -tolerance: running long
          deficit   = -slack
          trimmable = sum( min(i.scheduled_duration_seconds - 1, i.max_trim_seconds) for i in tail
                           if i.element_kind IN {PROMO, INTERSTITIAL, FILLER} )
          if trimmable >= deficit:
              plan_action = TRIM_TAIL ; trim = deficit ; skipped = [] ; pad = 0
              # trim is consumed in ascending sequence_number order, each item
              # giving min(remaining_need, min(dur - 1, max_trim_seconds))
          else:
              trim = trimmable
              need = deficit - trim
              skipped = []
              for i in tail ordered by sequence_number ASC:
                  if need <= 0: break
                  if i.element_kind IN {PROMO, INTERSTITIAL, FILLER}:
                      skipped.append(i.sequence_number)
                      need -= (i.scheduled_duration_seconds - trim_taken_from(i))
              if need > 0:
                  # Commercials are protected: a plan may never drop a COMMERCIAL
                  # element. If the deficit survives the skippable pool, the plan
                  # degrades to a hard cut and the boundary element is truncated.
                  plan_action = HARD_CUT ; late_join_seconds = need
              else:
                  plan_action = SKIP_ELEMENTS ; late_join_seconds = 0
      feed.plan_computed_utc = logical_now
    input_set: "Only items at or after anchor_sequence_number whose playout_status IN {SCHEDULED, CUED} enter pending_tail. PLAYING items are excluded from the tail (they are handled by truncation at the join instant); PLAYED, SKIPPED, PREEMPTED and TRUNCATED items are excluded entirely. COMMERCIAL and PROGRAM elements are never skippable; only PROMO, INTERSTITIAL and FILLER are."
    constants:
      BACKTIME_TOLERANCE_RATIO: 0.02
      BACKTIME_TOLERANCE_CAP_SECONDS: 15
      MAX_FILLER_SECONDS: 120
    precision: "Whole seconds; floor() on the tolerance ratio; no other rounding."
    tie_break: "Trim and skip are consumed in ascending sequence_number order; created_at is the fallback when two items share a sequence number, which the uniqueness rule prevents. Item id is never consulted."

  # ---------------------------------------------------------------------------
  - name: live_encoder_concurrency_peak
    trigger: "POST /network-feed-windows (before insert), POST /network-feed-windows/{id}/join, POST /network-feed-windows/{id}/breakaway and POST /multiplexes/{id}/rebalance"
    algorithm: interval_merge
    formula: |
      # Interval semantics C of the scaffold: AGGREGATE CAPACITY over a shared
      # resource pool. Overlap is legal; only the summed occupancy is bounded.
      # Occupancy interval is HALF-OPEN [join_utc, breakaway_utc): a window that
      # ends at T frees its units for a window starting at T.
      windows = [ NetworkFeedWindow w : channel_of(w).multiplex_id == Multiplex.id
                                        AND w.state IN {PLANNED, JOINED} ]
      events = []
      for w in windows:
          events.append( (w.join_utc,      +w.live_encoder_units) )
          events.append( (w.breakaway_utc, -w.live_encoder_units) )
      sort events by (timestamp ASC, delta ASC)      # releases (-) before claims (+) at the same instant
      running = 0 ; peak = 0
      for (t, d) in events:
          running += d
          peak = max(peak, running)
      Multiplex.live_encoder_units_peak = peak
      REJECT the proposed window with ERR_ENCODER_CAPACITY_EXCEEDED
          when peak > Multiplex.live_encoder_units_total      # NOTE: >, equality is accepted
    input_set: "Windows in state BROKEN_AWAY or ABANDONED are excluded. Windows on sibling channels of the same multiplex ARE included — the encoder pool is a multiplex-level resource, not a channel-level one."
    constants: {}
    precision: "Integer unit counts; timestamps compared at second granularity."
    tie_break: "At an identical timestamp, release events are applied before claim events (delta ASC), which is what makes back-to-back windows feasible at capacity."

  # ---------------------------------------------------------------------------
  - name: asset_technical_score
    trigger: "POST /assets/{id}/qc-reports (basis INGEST writes Asset.technical_score_ingest, basis AIR_CHECK writes Asset.technical_score_aircheck)"
    algorithm: weighted_scoring
    formula: |
      defects = deduplicate(report.defect_codes)
      defect_penalty = sum(DEFECT_POINTS[d] for d in defects)

      delta = abs(report.measured_duration_seconds - Asset.expected_duration_seconds)
      duration_penalty = 0 if delta <= DURATION_TOLERANCE_SECONDS
                         else min(DURATION_PENALTY_CAP, ceil(delta / 2) * 3)

      loudness_penalty = LOUDNESS_PENALTY_POINTS
                         if Asset.audio_loudness_lkfs is not null
                            AND abs(Asset.audio_loudness_lkfs - TARGET_LKFS) > LOUDNESS_TOLERANCE_LKFS
                         else 0

      # AIR_CHECK only — faults observed while the asset's elements were on air.
      linked_faults = [ TechnicalFault f : f.state == RESOLVED
                                           AND f.playlist_item_id IN
                                               ids of PlaylistItem where asset_id == Asset.id
                                                 AND playout_status IN {PLAYED, TRUNCATED} ]
      fault_penalty = 0                                  if report.basis == INGEST
                      else min(FAULT_PENALTY_CAP,
                               sum(FAULT_POINTS[f.fault_code] for f in linked_faults))

      technical_score = max(0, 100 - defect_penalty - duration_penalty
                                   - loudness_penalty - fault_penalty)

      verdict = FAIL                 if technical_score < PASS_WITH_EXCEPTION_MIN     # < 70
                                        OR any(d in defects where d IN CRITICAL_DEFECTS)
                                        OR (Asset.captions_required AND Asset.caption_present == false)
                                        OR (Asset.delivered_resolution_class != Asset.required_resolution_class)
                PASS_WITH_EXCEPTION  elif technical_score < PASS_MIN                  # 70 <= score < 85
                PASS                 else                                            # score >= 85
    input_set: "One report grades one asset. Only the newest non-superseded report of a given basis governs Asset.qc_verdict; superseded reports keep their own stored score but never drive asset status. AIR_CHECK fault linkage counts only RESOLVED faults attached to items that reached PLAYED or TRUNCATED."
    constants:
      DEFECT_POINTS: { LOUDNESS_OUT_OF_SPEC: 12, AUDIO_LOSS: 25, BLACK_FRAMES: 18, CAPTION_MISSING: 20, CAPTION_MISTIMED: 8, FORMAT_MISMATCH: 15, VIDEO_ARTIFACT: 10 }
      FAULT_POINTS: { AUDIO_LOSS: 25, BLACK_FRAME: 18, CAPTION_LOSS: 20, LOSS_OF_SIGNAL: 30, ENCODER_FAILURE: 30, RF_POWER_FAULT: 10, AUTOMATION_STALL: 8 }
      CRITICAL_DEFECTS: [AUDIO_LOSS, FORMAT_MISMATCH]
      DURATION_TOLERANCE_SECONDS: 2
      DURATION_PENALTY_CAP: 30
      FAULT_PENALTY_CAP: 40
      TARGET_LKFS: -24.0
      LOUDNESS_TOLERANCE_LKFS: 2.0
      LOUDNESS_PENALTY_POINTS: 12
      PASS_WITH_EXCEPTION_MIN: 70
      PASS_MIN: 85
      WAIVER_MIN_SCORE: 40
    precision: "Integer points; ceil() on the duration ratio; score floored at 0 and never above 100. Thresholds are >= on the upper side: exactly 70 is PASS_WITH_EXCEPTION, exactly 85 is PASS."
    variants:
      - name: INGEST
        when: "report.basis == INGEST, submitted after POST /assets/{id}/delivery"
        difference: "fault_penalty is forced to 0 and measured_duration_seconds is the ingest measurement; the score written to Asset.technical_score_ingest is the one that decides the RECEIVED -> QC_PASSED / QC_FAILED branch."
      - name: AIR_CHECK
        when: "report.basis == AIR_CHECK, submitted after the elements aired"
        difference: "Adds the capped fault_penalty and uses the post-air measurement, so the same asset with the same defect list scores strictly lower than its INGEST score whenever at least one RESOLVED fault is linked to an aired element. Written to Asset.technical_score_aircheck; it never changes Asset.status."

  # ---------------------------------------------------------------------------
  - name: spot_credit_settlement
    trigger: "GET /playlists/{id}/reconciliation (read-only, either basis), the Playlist ON_AIR -> CLOSED transition (basis FINAL), and every per-item credit accrual in CASCADE A hop 6, CASCADE B hop 3, CASCADE C hop 4 and the PlaylistItem terminal transitions"
    algorithm: chronological
    formula: |
      per_spot_rate_cents = SpotOrder.rate_cents_total / SpotOrder.ordered_spots     # exact rational, NOT rounded here
      linked = [ PlaylistItem i : i.spot_order_id == SpotOrder.id ]
               ordered by (i.scheduled_start_utc ASC, i.sequence_number ASC)

      classify(i):
          AIRED_FULL if i.playout_status == PLAYED
                        AND i.measured_duration_seconds >= SpotOrder.unit_duration_seconds
                                                           - AIR_TOLERANCE_SECONDS      # NOTE: >=, unit-1 counts as full
          SHORT_AIR  elif i.playout_status == TRUNCATED
                        OR (i.playout_status == PLAYED
                            AND i.measured_duration_seconds <  SpotOrder.unit_duration_seconds
                                                                - AIR_TOLERANCE_SECONDS)
          NOT_AIRED  elif i.playout_status IN {SKIPPED, PREEMPTED}
          PENDING    else                                   # SCHEDULED, CUED, PLAYING

      raw_credit(i):
          0                                                                  if AIRED_FULL
          per_spot_rate_cents * (SpotOrder.unit_duration_seconds
                                 - max(0, i.measured_duration_seconds))
                              / SpotOrder.unit_duration_seconds              if SHORT_AIR
          per_spot_rate_cents                                                if NOT_AIRED

      # ROUNDING ORDER IS PINNED: round EACH per-item credit to whole cents with
      # ROUND_HALF_UP first, THEN sum the rounded values. Summing the exact
      # rationals and rounding once at the end is explicitly WRONG and will
      # differ by up to (count(linked) - 1) cents.
      credit_total_cents = sum( round_half_up(raw_credit(i)) for i in linked
                                                            if classify(i) != PENDING )

      # Basis selection.
      if basis == PRELIMINARY:
          # items still PENDING are excluded from both the credit and the counters
          unplaced_credit = 0
      if basis == FINAL:
          unplaced_spots  = max(0, SpotOrder.ordered_spots - count(linked))
          unplaced_credit = unplaced_spots * round_half_up(per_spot_rate_cents)
          credit_total_cents += unplaced_credit
          # every PENDING item has already been swept to SKIPPED by the CLOSED
          # transition before this basis runs, so no PENDING item survives

      SpotOrder.aired_spots       = count(i in linked where classify(i) == AIRED_FULL)
      SpotOrder.short_aired_spots = count(i in linked where classify(i) == SHORT_AIR)
      SpotOrder.credited_spots    = count(i in linked where classify(i) == NOT_AIRED)
                                    + (unplaced_spots if basis == FINAL else 0)
      SpotOrder.scheduled_spots   = count(i in linked where classify(i) == PENDING)
      SpotOrder.unplaced_spots    = max(0, SpotOrder.ordered_spots - count(linked))
      SpotOrder.credit_accrued_cents = credit_total_cents
      Playlist.reconciliation_credit_cents = sum(credit_total_cents over every SpotOrder
                                                 referenced by this playlist's items)
    input_set: "Only PlaylistItem rows whose spot_order_id equals the order participate; makegood items (is_makegood == true) participate exactly like ordinary spots. Items belonging to a different playlist of the same order participate in that order's counters but only the closing playlist's share enters Playlist.reconciliation_credit_cents."
    constants:
      AIR_TOLERANCE_SECONDS: 1
      ROUNDING: round_half_up
    precision: "Whole cents. round_half_up applied PER ITEM, then summed (pinned order). per_spot_rate_cents is kept as an exact rational until that per-item rounding."
    tie_break: "Items are processed in (scheduled_start_utc ASC, sequence_number ASC) order; that order is observable in the reconciliation read. Item id is never consulted."
    variants:
      - name: PRELIMINARY
        when: "GET /playlists/{id}/reconciliation with basis=PRELIMINARY (default), while the playlist is still ON_AIR"
        difference: "Items still SCHEDULED / CUED / PLAYING are excluded from the credit and counted only in scheduled_spots; ordered-but-never-scheduled spots contribute nothing. The total is therefore strictly lower than FINAL whenever unplaced_spots > 0 or any spot is still pending."
      - name: FINAL
        when: "GET /playlists/{id}/reconciliation with basis=FINAL, and the Playlist ON_AIR -> CLOSED transition"
        difference: "Every ordered spot must be accounted for: unplaced spots are credited in full at round_half_up(per_spot_rate_cents) each, and the CLOSED sweep has already turned pending items into SKIPPED (hence NOT_AIRED, credited in full)."

  # ---------------------------------------------------------------------------
  - name: spot_inventory_conservation
    trigger: "Asserted after every transition that touches a spot: item PLAYED / TRUNCATED / SKIPPED / PREEMPTED, CASCADE A hop 6, CASCADE B hop 3, CASCADE C hop 4, POST /spot-orders/{id}/makegoods, playlist revision ingest, playlist ABANDONED and playlist CLOSED settlement"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2: spot COUNT (a unit-inventory ledger, not money).
      INVARIANT_SPOTS:
        SpotOrder.ordered_spots
        == SpotOrder.scheduled_spots
         + SpotOrder.aired_spots
         + SpotOrder.short_aired_spots
         + SpotOrder.credited_spots
         + SpotOrder.unplaced_spots

      # Compensating-action form. Forward action F = an override cut-in or a
      # transmitter derate preempts one scheduled spot:
      #     scheduled_spots -= 1 ; credited_spots += 1
      #     credit_accrued_cents += round_half_up(per_spot_rate_cents)
      # Compensating action F' = POST /spot-orders/{id}/makegoods places that spot
      # again:
      #     credited_spots -= 1 ; scheduled_spots += 1
      #     credit_accrued_cents -= round_half_up(per_spot_rate_cents)
      # INVARIANT_SPOTS holds before F, between F and F', and after F'; and
      # credit_accrued_cents returns to EXACTLY its pre-F value (the same rounded
      # per-spot figure is added and subtracted, so no rounding drift accrues
      # across any number of preempt/makegood cycles).
    input_set: "One SpotOrder and every PlaylistItem referencing it across all playlists of its channel. unplaced_spots absorbs the difference between ordered_spots and the number of linked items, so the identity holds even before any playlist is ingested (scheduled = aired = short = credited = 0, unplaced = ordered)."
    constants: {}
    precision: "Exact integer equality on counts; exact integer equality in cents on the compensation round-trip."

  # ---------------------------------------------------------------------------
  - name: airtime_seconds_conservation
    trigger: "Asserted after every executed backtiming plan (POST /network-feed-windows/{id}/join and POST /network-feed-windows/{id}/breakaway)"
    algorithm: aggregation
    formula: |
      # Conserved quantity #3: SECONDS of the local tail against the feed clock.
      # Let the pre-plan tail be T0 = sum(scheduled_duration_seconds) over items at
      # or after anchor_sequence_number with playout_status IN {SCHEDULED, CUED},
      # and R = feed.join_utc - feed.plan_computed_utc.
      INVARIANT_SECONDS:
        T0
        == (tail seconds still scheduled after the plan)
         + backtime_trim_seconds
         + sum(scheduled_duration_seconds of items whose sequence_number is in skipped_item_sequences)
      AND
        R
        == (tail seconds still scheduled after the plan)
         + backtime_pad_seconds
         + residual_dead_air_seconds
         - late_join_seconds

      # Compensating-action form: a TRIM_TAIL plan followed by a traffic revision
      # that reinstates the trimmed items (each item's scheduled_duration_seconds
      # restored, trim_applied_seconds reset to 0) returns T0 to its original
      # value exactly; the plan never destroys or invents scheduled seconds.
    input_set: "Only items at or after anchor_sequence_number with playout_status IN {SCHEDULED, CUED} at plan time. Items the plan skips keep their scheduled_duration_seconds field intact (they move to playout_status SKIPPED), which is what makes the accounting reversible."
    constants: {}
    precision: "Exact integer equality in whole seconds."

  # ---------------------------------------------------------------------------
  - name: commercial_inventory_by_hour
    trigger: "POST /playlists, POST /playlists/{id}/traffic-revisions, POST /spot-orders/{id}/makegoods, POST /playlist-items/{id}/substitute, and POST /playlists/{id}/state with target_status=VALIDATED"
    algorithm: aggregation
    formula: |
      # Clock hour h is the half-open window
      #   [schedule_start_utc + 3600*h, schedule_start_utc + 3600*(h+1))
      # An element is attributed to exactly one hour, by its scheduled_start_utc,
      # even when it straddles the boundary.
      for each PlaylistItem i with element_kind == COMMERCIAL
                                  AND playout_status NOT IN {SKIPPED, PREEMPTED}:
          h = floor( (i.scheduled_start_utc - Playlist.schedule_start_utc) / 3600 )
          commercial_seconds_by_hour[str(h)] += i.scheduled_duration_seconds
      REJECT with ERR_COMMERCIAL_INVENTORY_EXCEEDED
          when any commercial_seconds_by_hour[h] > MAX_COMMERCIAL_SECONDS_PER_HOUR
      # NOTE: >, so exactly 960 seconds in an hour is legal and 961 is not.
    input_set: "COMMERCIAL elements only; PROMO and INTERSTITIAL elements are not commercial inventory. Items already SKIPPED or PREEMPTED are excluded, so a preemption frees inventory for a makegood in the same hour."
    constants:
      MAX_COMMERCIAL_SECONDS_PER_HOUR: 960
      HOUR_SECONDS: 3600
    precision: "Whole seconds; floor() on the hour index. Keys are decimal strings of the 0-based hour index."

  # ---------------------------------------------------------------------------
  - name: regulatory_notification_deadline
    trigger: "POST /transmitters/{id}/power-state (creation of POWER_REDUCTION / OUTAGE / RESUMPTION rows), POST /_clock/set_current_utc (OUTAGE detection during a running outage and PENDING -> OVERDUE sweep), and POST /regulatory-notifications/{id}/file (on-time vs late determination)"
    algorithm: threshold
    formula: |
      # 1. Power reduction filing requirement.
      requires_power_notification = (target_state == REDUCED_POWER
                                     AND power_pct < POWER_REDUCTION_THRESHOLD_PCT)
      # NOTE: strict <. power_pct == 80 requires NO filing; 79 does.

      # 2. Outage filing requirement.
      elapsed_outage = logical_now - Transmitter.outage_started_utc
      requires_outage_notification = (elapsed_outage >= OUTAGE_NOTIFY_AFTER_SECONDS)
      # NOTE: >=. Exactly 1800 seconds requires a filing; 1799 does not.

      # 3. Deadlines.
      due_utc = triggering_utc + NOTIFY_WINDOW_SECONDS            for POWER_REDUCTION and RESUMPTION
      due_utc = detection_utc  + NOTIFY_WINDOW_SECONDS            for OUTAGE
                                                                  # detection_utc is the instant the
                                                                  # >= 1800 threshold was observed

      # 4. Filing outcome.
      status_after_file = FILED       if logical_now <= due_utc     # NOTE: <=, on the boundary is on time
                          LATE_FILED  else

      # 5. Clock checkpoint sweep (POST /_clock/set_current_utc, in this order):
      #    a. transmitters in OFF_AIR crossing the 1800-second threshold get an
      #       OUTAGE notification (one per outage epoch, keyed on outage_started_utc)
      #    b. every PENDING notification with due_utc < logical_now flips to OVERDUE
      #    c. every EXPECTED asset past delivery_deadline_utc + DELIVERY_GRACE_SECONDS
      #       flips to EXPIRED with its clearance cascade
      #    d. every DETECTED, MINOR, never-acknowledged fault past
      #       detected_utc + FAULT_AUTO_CLEAR_SECONDS flips to AUTO_CLEARED
      #    e. Operator.certification_state is re-derived for every operator
      #    Order a -> e is pinned: (a) can create rows that (b) then evaluates in
      #    the same call when the clock jump is large enough.
    input_set: "One transmitter's notification rows per outage epoch; a second OUTAGE row for the same epoch is never created. The sweep in step 5 considers every transmitter, notification, asset, fault and operator in the system."
    constants:
      POWER_REDUCTION_THRESHOLD_PCT: 80
      OUTAGE_NOTIFY_AFTER_SECONDS: 1800
      NOTIFY_WINDOW_SECONDS: 86400
      DELIVERY_GRACE_SECONDS: 3600
      FAULT_AUTO_CLEAR_SECONDS: 900
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
    precision: "Whole seconds; all comparisons at second granularity."

# =============================================================================
# §1.4 VALIDATION RULES TABLE (evaluated strictly in ascending priority order;
#      the FIRST failing rule is the response, and no later rule is evaluated)
# =============================================================================
validations:

  # --- Authentication (1-4) --------------------------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-Id and X-User-Role headers are present and non-empty on every endpoint except GET requests, which still require them. A request missing either header is rejected before any body parsing, so a malformed body never surfaces."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven §1.7 role names, matched case-sensitively."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "When X-User-Role is one of the four entity_backed roles (MasterControlOperator, QCTechnician, ProgramDirector, BroadcastEngineer), X-User-Id resolves to an existing Operator row. Opaque roles (TrafficCoordinator, ComplianceOfficer, StationAdmin) skip this rule entirely."
    error_id: ERR_OPERATOR_NOT_FOUND
    http_status: 401
    applies_to: "all endpoints called with an entity_backed role"
  - priority: 4
    category: auth
    check: "The resolved Operator.role_class matches the claimed X-User-Role per the §1.7 mapping (MASTER_CONTROL<->MasterControlOperator, QC<->QCTechnician, PROGRAM_DIRECTOR<->ProgramDirector, ENGINEER<->BroadcastEngineer). A real operator claiming a different role class is rejected here, not at authorization."
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints called with an entity_backed role"

  # --- Authorization (5) ----------------------------------------------------
  - priority: 5
    category: auth
    check: "X-User-Role appears in the target endpoint's §1.5 roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  # --- Actor fitness gates (6-7) -------------------------------------------
  - priority: 6
    category: auth
    check: "The resolved Operator.status is ACTIVE. A SUSPENDED operator is refused every mutating endpoint (GET endpoints remain readable). PRIORITY PAIR (a): a suspended operator calling a mutation on a resource that is also in the wrong state gets ERR_OPERATOR_SUSPENDED (6), never the state error (14-24)."
    error_id: ERR_OPERATOR_SUSPENDED
    http_status: 403
    applies_to: "all POST/PATCH endpoints called with an entity_backed role"
  - priority: 7
    category: auth
    check: "Operator.certification_state is VALID, i.e. logical_now <= certification_expires_utc (BOUNDARY: certification_expires_utc exactly equal to logical_now is still VALID; one second later is EXPIRED). Enforced only on the air-critical mutations, and NOT on GETs."
    error_id: ERR_OPERATOR_CERTIFICATION_EXPIRED
    http_status: 403
    applies_to: "POST /channels/{id}/air-state, POST /playlists/{id}/state, POST /playlist-items/{id}/playout-events, POST /playlist-items/{id}/substitute, POST /network-feed-windows/{id}/join, POST /network-feed-windows/{id}/breakaway, POST /emergency-overrides, POST /emergency-overrides/{id}/activate, POST /emergency-overrides/{id}/release, POST /assets/{id}/qc-reports, POST /assets/{id}/qc-waivers, POST /transmitters/{id}/power-state"

  # --- Field shape (8-10) --------------------------------------------------
  - priority: 8
    category: existence
    check: "Every non-optional field in the endpoint's §1.5 input list is present in the body. Fields marked with a trailing '?' are optional."
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 422
    applies_to: "all POST/PATCH endpoints"
  - priority: 9
    category: existence
    check: "Every enum-typed field carries one of the exact §1.1 literals, case-sensitively."
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST/PATCH endpoints"
  - priority: 10
    category: existence
    check: "Type and range checks: integers are integers; durations, bitrates, ordered_spots, rate_cents_total, priority_rank and power_pct are >= 0; power_pct <= 100; expected/scheduled durations >= 1; timestamps parse as RFC3339 UTC with a trailing Z; audio_loudness_lkfs is a number with at most one decimal place; crawl_text is 1..512 characters."
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  # --- Path existence (11) -------------------------------------------------
  - priority: 11
    category: existence
    check: "Each {id} in the path resolves, left to right, to an existing row of the segment's entity: transmitters -> ERR_TRANSMITTER_NOT_FOUND, multiplexes -> ERR_MULTIPLEX_NOT_FOUND, channels -> ERR_CHANNEL_NOT_FOUND, operators -> ERR_OPERATOR_REFERENCE_NOT_FOUND, assets -> ERR_ASSET_NOT_FOUND, qc-reports -> ERR_QC_REPORT_NOT_FOUND, playlists -> ERR_PLAYLIST_NOT_FOUND, playlist-items -> ERR_PLAYLIST_ITEM_NOT_FOUND, spot-orders -> ERR_SPOT_ORDER_NOT_FOUND, network-feed-windows -> ERR_FEED_WINDOW_NOT_FOUND, emergency-overrides -> ERR_OVERRIDE_NOT_FOUND, technical-faults -> ERR_FAULT_NOT_FOUND, regulatory-notifications -> ERR_NOTIFICATION_NOT_FOUND."
    error_id: ERR_CHANNEL_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    note: "error_id above is the representative id; the actual id is selected from the per-segment mapping in check."

  # --- Body FK existence (12) ----------------------------------------------
  - priority: 12
    category: existence
    check: "Every FK supplied in the body resolves to an existing row, checked in declaration order of the endpoint's input list, using the same error ids as rule 11 (an unknown asset_id in POST /playlists/{id}/traffic-revisions yields ERR_ASSET_NOT_FOUND). Body-FK existence is checked AFTER path existence and BEFORE optimistic concurrency."
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    note: "error_id above is the representative id; the actual id is the rule-11 mapping for the referenced entity."
    applies_to: "POST /channels, POST /playlists, POST /playlists/{id}/traffic-revisions, POST /playlist-items/{id}/substitute, POST /network-feed-windows, POST /emergency-overrides, POST /emergency-overrides/{id}/activate, POST /technical-faults, POST /spot-orders, POST /spot-orders/{id}/makegoods, POST /assets/{id}/qc-reports, POST /assets/{id}/qc-waivers"

  # --- Optimistic concurrency (13) -----------------------------------------
  - priority: 13
    category: state
    check: "When the endpoint declares an expected_<parent>_version input, it equals the parent's current version: expected_playlist_version vs Playlist.version (ERR_STALE_PLAYLIST_VERSION), expected_multiplex_version vs Multiplex.version (ERR_STALE_MULTIPLEX_VERSION), expected_asset_version vs Asset.version (ERR_STALE_ASSET_VERSION). See §1.2.1. PRIORITY PAIR (d): a request that carries a stale version AND targets a resource in the wrong state returns the 412 stale-version error, never the 409 state error."
    error_id: ERR_STALE_PLAYLIST_VERSION
    note: "error_id above is the representative id; ERR_STALE_MULTIPLEX_VERSION and ERR_STALE_ASSET_VERSION apply to the multiplex- and asset-parented endpoints listed in check."
    http_status: 412
    applies_to: "POST /playlists/{id}/traffic-revisions, POST /spot-orders/{id}/makegoods, POST /channels, PATCH /channels/{id}/allocation, POST /multiplexes/{id}/rebalance, POST /assets/{id}/qc-reports"

  # --- State preconditions (14-24) -----------------------------------------
  - priority: 14
    category: state
    check: "POST /transmitters/{id}/power-state: target_state is reachable from Transmitter.operational_state per §1.2 (FULL_POWER -> REDUCED_POWER|OFF_AIR, REDUCED_POWER -> FULL_POWER|REDUCED_POWER|OFF_AIR, OFF_AIR -> FULL_POWER|REDUCED_POWER|OFF_AIR). FULL_POWER -> FULL_POWER is NOT a declared transition and is rejected here."
    error_id: ERR_TRANSMITTER_INVALID_STATE
    http_status: 409
    applies_to: "POST /transmitters/{id}/power-state"
  - priority: 15
    category: state
    check: "POST /channels/{id}/air-state: target_air_status is reachable from Channel.air_status per §1.2. EAS_OVERRIDE is never reachable through this endpoint - it is set only by the override cascade - and requesting it is rejected here."
    error_id: ERR_CHANNEL_INVALID_AIR_STATE
    http_status: 409
    applies_to: "POST /channels/{id}/air-state"
  - priority: 16
    category: state
    check: "Asset lifecycle: POST /assets/{id}/delivery requires status EXPECTED or QC_FAILED (redelivery); POST /assets/{id}/qc-reports with basis INGEST requires status RECEIVED, and with basis AIR_CHECK requires status QC_PASSED or QC_WAIVED; POST /assets/{id}/qc-waivers requires status QC_FAILED; POST /assets/{id}/retract requires status NOT IN {EXPIRED, RETRACTED}."
    error_id: ERR_ASSET_INVALID_STATE
    http_status: 409
    applies_to: "POST /assets/{id}/delivery, POST /assets/{id}/qc-reports, POST /assets/{id}/qc-waivers, POST /assets/{id}/retract"
  - priority: 17
    category: state
    check: "Playlist lifecycle: POST /playlists/{id}/state accepts only the §1.2 transitions out of the current status (IMPORTING -> IMPORTED|ABANDONED, IMPORTED -> VALIDATED|IMPORTING|ABANDONED, VALIDATED -> ARMED|IMPORTED|ABANDONED, ARMED -> ON_AIR|IMPORTED|ABANDONED, ON_AIR -> CLOSED). POST /playlists/{id}/traffic-revisions requires status IN {IMPORTING, IMPORTED, VALIDATED, ARMED} - a revision against an ON_AIR, CLOSED or ABANDONED playlist is rejected."
    error_id: ERR_PLAYLIST_INVALID_STATE
    http_status: 409
    applies_to: "POST /playlists/{id}/state, POST /playlists/{id}/traffic-revisions"
  - priority: 18
    category: state
    check: "POST /playlist-items/{id}/playout-events: the event_kind is legal for the item's playout_status - CUE requires SCHEDULED, START requires CUED, END requires PLAYING, TRUNCATION requires PLAYING, SKIP requires SCHEDULED or CUED. An event against a PLAYED, TRUNCATED, SKIPPED or PREEMPTED item is rejected."
    error_id: ERR_ITEM_INVALID_PLAYOUT_STATE
    http_status: 409
    applies_to: "POST /playlist-items/{id}/playout-events"
  - priority: 19
    category: state
    check: "POST /playlist-items/{id}/substitute requires the target item's playout_status IN {SCHEDULED, CUED}; an item already PLAYING or terminal cannot be substituted."
    error_id: ERR_ITEM_INVALID_PLAYOUT_STATE
    http_status: 409
    applies_to: "POST /playlist-items/{id}/substitute"
  - priority: 20
    category: state
    check: "NetworkFeedWindow lifecycle: POST /network-feed-windows/{id}/join requires state PLANNED; POST /network-feed-windows/{id}/breakaway requires state JOINED."
    error_id: ERR_FEED_WINDOW_INVALID_STATE
    http_status: 409
    applies_to: "POST /network-feed-windows/{id}/join, POST /network-feed-windows/{id}/breakaway"
  - priority: 21
    category: state
    check: "EmergencyOverride lifecycle: POST /emergency-overrides/{id}/activate requires state PENDING, ACTIVE_CRAWL or ACTIVE_CUTIN (the two ACTIVE states permit the declared mode-escalation and mode-relaxation transitions, and the requested override_mode must differ from active_mode when already ACTIVE); POST /emergency-overrides/{id}/release requires state ACTIVE_CRAWL or ACTIVE_CUTIN."
    error_id: ERR_OVERRIDE_INVALID_STATE
    http_status: 409
    applies_to: "POST /emergency-overrides/{id}/activate, POST /emergency-overrides/{id}/release"
  - priority: 22
    category: state
    check: "POST /technical-faults/{id}/state: target_state is reachable per §1.2 (DETECTED -> ACKNOWLEDGED|AUTO_CLEARED, ACKNOWLEDGED -> ESCALATED|MITIGATED, ESCALATED -> MITIGATED, MITIGATED -> RESOLVED|DETECTED). RESOLVED and AUTO_CLEARED are terminal. A MITIGATED -> DETECTED move (recurrence) is legal; a RESOLVED -> DETECTED move is not."
    error_id: ERR_FAULT_INVALID_STATE
    http_status: 409
    applies_to: "POST /technical-faults/{id}/state"
  - priority: 23
    category: state
    check: "POST /regulatory-notifications/{id}/file requires status PENDING or OVERDUE; a FILED or LATE_FILED notification cannot be re-filed."
    error_id: ERR_NOTIFICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /regulatory-notifications/{id}/file"
  - priority: 24
    category: state
    check: "POST /spot-orders/{id}/makegoods requires SpotOrder.status IN {OPEN, PARTIALLY_CREDITED}; a FULLY_AIRED or CLOSED_WITH_CREDIT order accepts no further placement."
    error_id: ERR_ORDER_FULLY_SETTLED
    http_status: 409
    applies_to: "POST /spot-orders/{id}/makegoods"

  # --- Business: safety / regulatory (25-34) -------------------------------
  - priority: 25
    category: business_safety
    check: "CROSS-ENTITY: no air-affecting mutation is accepted while the target Channel.posture is SUSPENDED - namely playout events, substitutions, feed joins/breakaways and playlist ARMED -> ON_AIR. The channel must first leave SUSPENDED via fault resolution or a transmitter power restoration. PRIORITY PAIR (b): a request that is both blocked by SUSPENDED posture and over the multiplex capacity returns ERR_CHANNEL_SUSPENDED_POSTURE (25), not ERR_MULTIPLEX_CAPACITY_EXCEEDED (67)."
    error_id: ERR_CHANNEL_SUSPENDED_POSTURE
    http_status: 409
    applies_to: "POST /playlist-items/{id}/playout-events, POST /playlist-items/{id}/substitute, POST /network-feed-windows/{id}/join, POST /network-feed-windows/{id}/breakaway, POST /playlists/{id}/state"
  - priority: 26
    category: business_safety
    check: "CROSS-ENTITY: a channel whose Multiplex-derived allocation_state is STARVED cannot be taken to ON_AIR and cannot accept playout START events - it may only be set to BARS_AND_TONE or DARK. Starvation is cleared by rebalancing the multiplex, never by the channel itself."
    error_id: ERR_CHANNEL_ALLOCATION_STARVED
    http_status: 409
    applies_to: "POST /channels/{id}/air-state, POST /playlist-items/{id}/playout-events, POST /playlists/{id}/state"
  - priority: 27
    category: business_safety
    check: "POST /emergency-overrides/{id}/activate: the authorizing operator's override_authority covers the requested mode - CRAWL requires CRAWL_ONLY, CRAWL_AND_CUTIN or FULL; CUT_IN requires CRAWL_AND_CUTIN or FULL. override_authority NONE authorizes nothing. Alert class EAS_MANDATORY additionally requires FULL."
    error_id: ERR_OVERRIDE_AUTHORITY_INSUFFICIENT
    http_status: 403
    applies_to: "POST /emergency-overrides/{id}/activate"
  - priority: 28
    category: business_safety
    check: "SEGREGATION OF DUTIES: authorized_by_operator_id differs from requested_by_operator_id on override activation, and a QC waiver's waived_by_operator_id differs from the inspected_by_operator_id of the QCReport that produced the failing verdict. An operator never signs off on their own request."
    error_id: ERR_SELF_AUTHORIZATION_FORBIDDEN
    http_status: 409
    applies_to: "POST /emergency-overrides/{id}/activate, POST /assets/{id}/qc-waivers"
  - priority: 29
    category: business_safety
    check: "While a channel's air_status is EAS_OVERRIDE, ordinary programming mutations are refused: playout CUE/START events, substitutions, feed joins and playlist state changes other than the override release path. Only POST /emergency-overrides/{id}/release and fault reporting are accepted."
    error_id: ERR_EAS_OVERRIDE_ACTIVE
    http_status: 409
    applies_to: "POST /playlist-items/{id}/playout-events, POST /playlist-items/{id}/substitute, POST /network-feed-windows/{id}/join, POST /playlists/{id}/state, POST /channels/{id}/air-state"
  - priority: 30
    category: business_safety
    check: "A playlist cannot move VALIDATED -> ARMED or ARMED -> ON_AIR while the channel has any open CRITICAL TechnicalFault (state IN {DETECTED, ACKNOWLEDGED, ESCALATED}). MAJOR and MINOR faults do not block arming; they only change posture."
    error_id: ERR_CRITICAL_FAULT_OPEN
    http_status: 409
    applies_to: "POST /playlists/{id}/state"
  - priority: 31
    category: business_safety
    check: "A playlist cannot move VALIDATED -> ARMED while Playlist.blocked_item_count > 0, i.e. any item with clearance_status IN {UNCLEARED, BLOCKED}. Items are CLEARED only when their asset is QC_PASSED or QC_WAIVED, or when the element_kind needs no asset (NETWORK_JOIN, LIVE_EVENT, FILLER)."
    error_id: ERR_UNCLEARED_CONTENT_ON_AIR
    http_status: 409
    applies_to: "POST /playlists/{id}/state"
  - priority: 32
    category: business_safety
    check: "An asset with captions_required == true cannot reach QC_PASSED or QC_WAIVED while caption_present == false: a missing caption track is a non-waivable defect, so POST /assets/{id}/qc-waivers is refused for it regardless of technical score. PRIORITY PAIR (b) partner: this safety rule outranks the fiscal rules and also outranks the score threshold at 33."
    error_id: ERR_CAPTION_REQUIREMENT_UNMET
    http_status: 409
    applies_to: "POST /assets/{id}/qc-reports, POST /assets/{id}/qc-waivers"
  - priority: 33
    category: business_safety
    check: "POST /assets/{id}/qc-waivers requires the asset's latest non-superseded INGEST technical_score_ingest >= WAIVER_MIN_SCORE (40). BOUNDARY: a score of exactly 40 is waivable; 39 is not."
    error_id: ERR_QC_WAIVER_SCORE_TOO_LOW
    http_status: 409
    applies_to: "POST /assets/{id}/qc-waivers"
  - priority: 34
    category: business_safety
    check: "POST /assets/{id}/qc-waivers requires a waiver_justification of at least 20 characters. BOUNDARY: exactly 20 characters is accepted, 19 is not."
    error_id: ERR_WAIVER_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /assets/{id}/qc-waivers"

  # --- Business: temporal (35-46) ------------------------------------------
  - priority: 35
    category: business_temporal
    check: "POST /playlists/{id}/state target_status=VALIDATED runs playlist_timeline_integrity (§1.3): consecutive items must be contiguous under half-open semantics, item[n].scheduled_start_utc + scheduled_duration_seconds == item[n+1].scheduled_start_utc. A positive difference is a gap. BOUNDARY: a difference of exactly 0 seconds is contiguous and legal."
    error_id: ERR_SCHEDULE_GAP_DETECTED
    http_status: 409
    applies_to: "POST /playlists/{id}/state, POST /playlists/{id}/traffic-revisions"
  - priority: 36
    category: business_temporal
    check: "Same integrity pass: a negative difference (item[n] end after item[n+1] start) is an overlap. Reported only when no gap was found earlier in sequence order, so the FIRST anomaly in sequence order determines which of the two error ids is returned."
    error_id: ERR_SCHEDULE_OVERLAP_DETECTED
    http_status: 409
    applies_to: "POST /playlists/{id}/state, POST /playlists/{id}/traffic-revisions"
  - priority: 37
    category: business_temporal
    check: "RESOURCE-TEMPORAL OVERLAP (closed intervals with guard): a new NetworkFeedWindow's [join_utc - guard_seconds, breakaway_utc + guard_seconds] must not intersect the guarded interval of any other PLANNED or JOINED window on the same channel. BOUNDARY: touching endpoints intersect under closed semantics, so a new join exactly at another window's guarded breakaway instant is rejected; one second later is accepted. PRIORITY PAIR (c): when a request both overlaps an existing window and names a non-existent anchor item, this temporal rule (37) wins over ERR_ANCHOR_ITEM_NOT_FOUND (48)."
    error_id: ERR_FEED_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /network-feed-windows"
  - priority: 38
    category: business_temporal
    check: "POST /network-feed-windows/{id}/join must be issued inside the guard window: logical_now must satisfy join_utc - guard_seconds <= logical_now <= join_utc + LATE_JOIN_LIMIT_SECONDS (30). Earlier is premature, later forfeits the window. BOUNDARY: exactly join_utc + 30 is accepted; +31 is refused."
    error_id: ERR_JOIN_OUTSIDE_GUARD_WINDOW
    http_status: 409
    applies_to: "POST /network-feed-windows/{id}/join"
  - priority: 39
    category: business_temporal
    check: "RESOURCE-TEMPORAL OVERLAP (aggregate capacity over a sweep): live_encoder_concurrency_peak (§1.3) over all PLANNED and JOINED feed windows plus the requested one must not exceed Multiplex.live_encoder_units_total. Releases at an instant are processed before claims at the same instant, so a window ending exactly when another begins does not consume two units. BOUNDARY: peak == total is accepted; peak == total + 1 is refused."
    error_id: ERR_ENCODER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /network-feed-windows"
  - priority: 40
    category: business_temporal
    check: "RESOURCE-TEMPORAL OVERLAP (open-ended interval): a channel accepts at most one non-terminal EmergencyOverride. A PENDING, ACTIVE_CRAWL or ACTIVE_CUTIN override on the channel blocks POST /emergency-overrides, because an override's effective interval runs from activation until release with no predetermined end."
    error_id: ERR_OVERRIDE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /emergency-overrides"
  - priority: 41
    category: business_temporal
    check: "POST /playlist-items/{id}/playout-events: event_utc must be >= the event_utc of the most recent AsRunEntry for the same playlist (the as-run log is append-only in time order) and must be <= logical_now. An event dated in the future of the logical clock is refused with ERR_EVENT_TIMESTAMP_IN_FUTURE; one dated before the previous entry is refused with ERR_PLAYOUT_EVENT_OUT_OF_ORDER, which is evaluated first. BOUNDARY: event_utc exactly equal to logical_now, or exactly equal to the previous entry's event_utc, is accepted."
    error_id: ERR_PLAYOUT_EVENT_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /playlist-items/{id}/playout-events"
  - priority: 42
    category: business_temporal
    check: "Timestamps supplied to mutating endpoints (event_utc, activated_utc, detected_utc, filed_utc, delivery received_utc) must not exceed the logical clock."
    error_id: ERR_EVENT_TIMESTAMP_IN_FUTURE
    http_status: 409
    applies_to: "POST /playlist-items/{id}/playout-events, POST /assets/{id}/delivery, POST /technical-faults, POST /regulatory-notifications/{id}/file, POST /emergency-overrides/{id}/activate"
  - priority: 43
    category: business_temporal
    check: "POST /_clock/set_current_utc: the new current_utc must be strictly greater than the present logical clock value (the clock never moves backwards). BOUNDARY: an equal value is refused."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"
  - priority: 44
    category: business_temporal
    check: "POST /spot-orders/{id}/makegoods requires logical_now <= SpotOrder.makegood_deadline_utc AND the substitute slot's scheduled_start_utc <= makegood_deadline_utc. BOUNDARY: a makegood placed exactly at the deadline instant is accepted; one second later is refused. PRIORITY PAIR partner for the fiscal rules: the deadline is checked before inventory and credit reversal."
    error_id: ERR_MAKEGOOD_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /spot-orders/{id}/makegoods"
  - priority: 45
    category: business_temporal
    check: "POST /assets/{id}/delivery records late_delivery = (received_utc > delivery_deadline_utc) rather than rejecting, but a delivery attempted after delivery_deadline_utc + DELIVERY_GRACE_SECONDS (3600) is refused because the asset has already been swept to EXPIRED by the clock checkpoint - and a delivery whose received_utc is beyond that grace is refused even when the sweep has not yet run. BOUNDARY: received_utc exactly at deadline is on time (late_delivery false); deadline + 1 is late but accepted; deadline + 3600 is the last accepted instant."
    error_id: ERR_DELIVERY_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /assets/{id}/delivery"
  - priority: 46
    category: business_temporal
    check: "A playlist cannot move VALIDATED -> ARMED when abs(projected_end_variance_seconds) > ARM_VARIANCE_TOLERANCE_SECONDS (30) as computed by the PROJECTED variant of playlist_timing_variance (§1.3). BOUNDARY: a variance of exactly +30 or -30 seconds arms successfully; 31 does not."
    error_id: ERR_ARM_VARIANCE_EXCEEDED
    http_status: 409
    applies_to: "POST /playlists/{id}/state"

  # --- Business: constraint (47-58) -----------------------------------------
  - priority: 47
    category: business_constraint
    check: "Channel.channel_number is unique across the whole station (all multiplexes), so two subchannels can never claim 5.2."
    error_id: ERR_DUPLICATE_CHANNEL_NUMBER
    http_status: 409
    applies_to: "POST /channels"
  - priority: 48
    category: business_constraint
    check: "POST /network-feed-windows: anchor_sequence_number must match an existing PlaylistItem sequence_number in the channel's most recently ARMED or ON_AIR playlist, and that item's element_kind must be NETWORK_JOIN. See PRIORITY PAIR (c) at rule 37."
    error_id: ERR_ANCHOR_ITEM_NOT_FOUND
    http_status: 409
    applies_to: "POST /network-feed-windows"
  - priority: 49
    category: business_constraint
    check: "Asset.house_number is unique across all assets, including RETRACTED and EXPIRED ones - a house number is never recycled."
    error_id: ERR_DUPLICATE_HOUSE_NUMBER
    http_status: 409
    applies_to: "POST /assets"
  - priority: 50
    category: business_constraint
    check: "SpotOrder.order_reference is unique across all orders."
    error_id: ERR_DUPLICATE_ORDER_REFERENCE
    http_status: 409
    applies_to: "POST /spot-orders"
  - priority: 51
    category: business_constraint
    check: "SELF-REFERENTIAL SHAPE: service_class SUBCHANNEL requires a non-null parent_channel_id (ERR_SUBCHANNEL_PARENT_REQUIRED), and service_class PRIMARY requires parent_channel_id to be null (ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN). The required error id is selected by the submitted service_class."
    error_id: ERR_SUBCHANNEL_PARENT_REQUIRED
    http_status: 422
    applies_to: "POST /channels"
  - priority: 52
    category: business_constraint
    check: "SELF-REFERENTIAL SHAPE: the parent chain is exactly one level deep - parent_channel_id must reference a channel whose service_class is PRIMARY. A SUBCHANNEL may not parent another SUBCHANNEL, and no channel may reference itself."
    error_id: ERR_INVALID_CHANNEL_PARENT
    http_status: 409
    applies_to: "POST /channels"
  - priority: 53
    category: business_constraint
    check: "parent_channel_id must reference a channel on the SAME multiplex as the multiplex_id supplied in the body - a subchannel cannot hang off a primary carried by another transmitter's multiplex."
    error_id: ERR_CROSS_MULTIPLEX_PARENT
    http_status: 409
    applies_to: "POST /channels"
  - priority: 54
    category: business_constraint
    check: "floor_bitrate_kbps <= requested_bitrate_kbps. BOUNDARY: equality is legal and makes the channel an all-or-nothing claimant in the waterfall."
    error_id: ERR_BITRATE_FLOOR_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /channels, PATCH /channels/{id}/allocation"
  - priority: 55
    category: business_constraint
    check: "floor_bitrate_kbps must be >= the resolution minimum: HD_1080I 8000, HD_720P 5000, SD_480I 2000. BOUNDARY: exactly the minimum is legal, one kbps below is not."
    error_id: ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM
    http_status: 422
    applies_to: "POST /channels, PATCH /channels/{id}/allocation"
  - priority: 56
    category: business_constraint
    check: "Within one playlist, sequence_number is unique and the submitted revision's items form a dense 1..N run with no duplicates and no holes."
    error_id: ERR_SEQUENCE_NUMBER_CONFLICT
    http_status: 409
    applies_to: "POST /playlists/{id}/traffic-revisions, POST /spot-orders/{id}/makegoods"
  - priority: 57
    category: business_constraint
    check: "POST /playlist-items/{id}/substitute: the replacement asset's delivered_resolution_class must equal the outgoing item's asset required_resolution_class, and the replacement's measured_duration_seconds must be within max_trim_seconds of the outgoing scheduled_duration_seconds."
    error_id: ERR_SUBSTITUTE_RESOLUTION_MISMATCH
    http_status: 409
    applies_to: "POST /playlist-items/{id}/substitute"
  - priority: 58
    category: business_constraint
    check: "Any trim a backtiming plan or substitution applies to an item must satisfy trim_applied_seconds <= max_trim_seconds for that item, and COMMERCIAL elements always carry max_trim_seconds == 0 so they are never trimmable. BOUNDARY: a trim exactly equal to max_trim_seconds is accepted."
    error_id: ERR_TRIM_EXCEEDS_MAX
    http_status: 409
    applies_to: "POST /network-feed-windows/{id}/join, POST /network-feed-windows/{id}/breakaway, POST /playlist-items/{id}/substitute"

  # --- Business: referential (59-62) ----------------------------------------
  - priority: 59
    category: business_referential
    check: "A PlaylistItem's spot_order_id must reference a SpotOrder whose channel_id equals the playlist's channel_id."
    error_id: ERR_SPOT_ORDER_CHANNEL_MISMATCH
    http_status: 409
    applies_to: "POST /playlists/{id}/traffic-revisions, POST /spot-orders/{id}/makegoods"
  - priority: 60
    category: business_referential
    check: "POST /spot-orders/{id}/makegoods: the target_playlist_id must belong to the order's channel, and POST /playlist-items/{id}/substitute must name a replacement asset that is not already placed as an unaired item in the same playlist hour."
    error_id: ERR_ITEM_PLAYLIST_MISMATCH
    http_status: 409
    applies_to: "POST /spot-orders/{id}/makegoods, POST /playlist-items/{id}/substitute"
  - priority: 61
    category: business_referential
    check: "POST /technical-faults: when both channel_id and playlist_item_id are supplied, the item must belong to a playlist of that channel; when transmitter_id is supplied, it must be the transmitter carrying that channel's multiplex. Fault codes RF_POWER_FAULT and LOSS_OF_SIGNAL require transmitter_id; AUDIO_LOSS, BLACK_FRAME and CAPTION_LOSS require channel_id."
    error_id: ERR_FAULT_TARGET_MISMATCH
    http_status: 409
    applies_to: "POST /technical-faults"
  - priority: 62
    category: business_referential
    check: "POST /assets/{id}/qc-reports: inspected_by_operator_id must reference an Operator with role_class QC; POST /emergency-overrides/{id}/activate: authorized_by_operator_id must reference an Operator with role_class PROGRAM_DIRECTOR or MASTER_CONTROL."
    error_id: ERR_OPERATOR_ROLE_CLASS_INVALID
    http_status: 409
    applies_to: "POST /assets/{id}/qc-reports, POST /emergency-overrides/{id}/activate"

  # --- Business: fiscal / capacity (63-67) ----------------------------------
  - priority: 63
    category: business_fiscal
    check: "commercial_inventory_by_hour (§1.3): no clock hour of the playlist may carry more than MAX_COMMERCIAL_SECONDS_PER_HOUR (960) seconds of COMMERCIAL elements. BOUNDARY: exactly 960 is accepted, 961 is refused."
    error_id: ERR_COMMERCIAL_INVENTORY_EXCEEDED
    http_status: 409
    applies_to: "POST /playlists/{id}/traffic-revisions, POST /spot-orders/{id}/makegoods, POST /playlists/{id}/state"
  - priority: 64
    category: business_fiscal
    check: "POST /spot-orders/{id}/makegoods requires SpotOrder.credited_spots >= 1 - there must be a credited spot to reverse. BOUNDARY: credited_spots == 0 is refused even when the order is PARTIALLY_CREDITED for other reasons."
    error_id: ERR_NO_CREDITED_SPOT_TO_MAKEGOOD
    http_status: 409
    applies_to: "POST /spot-orders/{id}/makegoods"
  - priority: 65
    category: business_fiscal
    check: "When an emergency cut-in or a capacity derate must preempt spots, only items whose SpotOrder.priority_class is PREEMPTIBLE or REMNANT are eligible; a GUARANTEED spot is preempted only when the request carries force_preempt_guaranteed == true, and then it accrues full credit. Direct attempts to preempt a GUARANTEED spot without the flag are refused."
    error_id: ERR_ORDER_NOT_PREEMPTIBLE
    http_status: 409
    applies_to: "POST /emergency-overrides/{id}/activate, POST /playlist-items/{id}/playout-events"
  - priority: 66
    category: business_fiscal
    check: "multiplex_bitrate_allocation (§1.3): the sum of floor_bitrate_kbps over the channels that would be ACTIVE must not exceed effective_capacity_kbps, otherwise no feasible allocation exists. BOUNDARY: a floor sum exactly equal to effective_capacity_kbps is feasible (every channel gets exactly its floor and the remainder pool is 0)."
    error_id: ERR_BITRATE_FLOOR_UNSATISFIABLE
    http_status: 409
    applies_to: "POST /channels, PATCH /channels/{id}/allocation, POST /multiplexes/{id}/rebalance"
  - priority: 67
    category: business_fiscal
    check: "PATCH /channels/{id}/allocation with pin_allocated_kbps set, and POST /channels for a channel that must be admitted ACTIVE, are refused when the requested pinned total would exceed Multiplex.effective_capacity_kbps. BOUNDARY: a total exactly equal to effective_capacity_kbps is accepted. This is the LAST rule in the ladder - see PRIORITY PAIR (b) at rule 25."
    error_id: ERR_MULTIPLEX_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /channels, PATCH /channels/{id}/allocation"

# =============================================================================
# §1.5 API ENDPOINT TABLE
# =============================================================================
endpoints:

  # --- Logical clock (test-driving endpoint) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which is the ONLY source of 'now' for every deadline, expiry, guard-window and certification check in this domain. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that instant and NEVER falls back to real wall-clock time. Advancing the clock is the ops-run checkpoint: it performs, in this pinned order, (a) OUTAGE notification creation for transmitters whose OFF_AIR duration has reached 1800 s, (b) PENDING -> OVERDUE for notifications past due_utc, (c) EXPECTED -> EXPIRED for assets past delivery_deadline_utc + 3600 s with the CASCADE B' clearance chain, (d) DETECTED -> AUTO_CLEARED for never-acknowledged MINOR faults older than 900 s with posture recomputation, (e) re-derivation of Operator.certification_state. There are no background jobs; nothing expires unless this endpoint is called."
    roles: [StationAdmin, BroadcastEngineer, MasterControlOperator, ComplianceOfficer, ProgramDirector, QCTechnician, TrafficCoordinator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["regulatory_notification_deadline sweep (steps a-b)", "Asset EXPECTED -> EXPIRED + CASCADE B'", "TechnicalFault DETECTED -> AUTO_CLEARED", "channel_posture recomputation for every affected channel", "Operator.certification_state re-derivation", "RegulatoryNotification rows created for outages crossing 1800 s"]

  # --- Transmitters ---------------------------------------------------------
  - method: POST
    path: "/transmitters"
    description: "Register a transmitter. Created in operational_state FULL_POWER with current_power_pct 100, derate_factor 1.00 and all outage counters at 0."
    roles: [BroadcastEngineer, StationAdmin]
    code: 201
    input: [facility_id, call_sign, authorized_erp_kw]
    output: Transmitter
    side_effects: []
  - method: GET
    path: "/transmitters/{id}"
    description: "Read one transmitter with its derived derate_factor, outage counters and notification_pending_count."
    roles: [BroadcastEngineer, MasterControlOperator, ComplianceOfficer, StationAdmin, ProgramDirector]
    code: 200
    input: []
    output: Transmitter
    side_effects: []
  - method: POST
    path: "/transmitters/{id}/power-state"
    description: "Change transmitter power: FULL_POWER, REDUCED_POWER with a power_pct, or OFF_AIR. Entry point of CASCADE A - the derate_factor it publishes re-runs the multiplex waterfall, which can starve channels, suspend postures, preempt items and accrue spot credit."
    roles: [BroadcastEngineer, StationAdmin]
    code: 200
    input: [target_state, "power_pct?", "reason?"]
    output: Transmitter
    side_effects: ["regulatory_notification_deadline (POWER_REDUCTION / RESUMPTION rows)", "CASCADE A hops 1-6", "multiplex_bitrate_allocation rerun", "channel_posture", "spot_credit_settlement per preempted item", "AsRunEntry rows for preemptions and truncations"]
  - method: GET
    path: "/transmitters/{id}/notifications"
    description: "List the regulatory notifications raised for this transmitter, newest triggering_utc first."
    roles: [ComplianceOfficer, BroadcastEngineer, StationAdmin]
    code: 200
    input: ["status?", "kind?"]
    output: RegulatoryNotification[]
    side_effects: []

  # --- Regulatory notifications --------------------------------------------
  - method: GET
    path: "/regulatory-notifications/{id}"
    description: "Read one notification with its due_utc and filing status."
    roles: [ComplianceOfficer, BroadcastEngineer, StationAdmin]
    code: 200
    input: []
    output: RegulatoryNotification
    side_effects: []
  - method: POST
    path: "/regulatory-notifications/{id}/file"
    description: "File the notification with the regulator. Sets status FILED when logical_now <= due_utc, LATE_FILED otherwise (boundary equality is on time)."
    roles: [ComplianceOfficer, StationAdmin]
    code: 200
    input: [filed_reference, narrative, "filed_utc?"]
    output: RegulatoryNotification
    side_effects: ["regulatory_notification_deadline (on-time vs late determination)", "Transmitter.notification_pending_count decrement"]

  # --- Multiplexes ----------------------------------------------------------
  - method: POST
    path: "/multiplexes"
    description: "Create a multiplex on a transmitter. effective_capacity_kbps is derived immediately as floor((total_capacity_kbps - pilot_reserved_kbps) * derate_factor)."
    roles: [BroadcastEngineer, StationAdmin]
    code: 201
    input: [transmitter_id, name, total_capacity_kbps, "pilot_reserved_kbps?", "live_encoder_units_total?"]
    output: Multiplex
    side_effects: ["multiplex_capacity_conservation initialisation"]
  - method: GET
    path: "/multiplexes/{id}"
    description: "Read one multiplex with effective_capacity_kbps, assigned_kbps, available_kbps, starved_channel_count and live_encoder_units_peak."
    roles: [BroadcastEngineer, MasterControlOperator, StationAdmin, ProgramDirector]
    code: 200
    input: []
    output: Multiplex
    side_effects: []
  - method: GET
    path: "/multiplexes"
    description: "List multiplexes, optionally filtered by transmitter."
    roles: [BroadcastEngineer, MasterControlOperator, StationAdmin, ProgramDirector, ComplianceOfficer]
    code: 200
    input: ["transmitter_id?"]
    output: Multiplex[]
    side_effects: []
  - method: POST
    path: "/multiplexes/{id}/rebalance"
    description: "Re-run multiplex_bitrate_allocation across every channel on the multiplex, clearing any pinned allocations. The only way out of STARVED for a channel."
    roles: [BroadcastEngineer, StationAdmin]
    code: 200
    input: [expected_multiplex_version, "clear_pins?"]
    output: Multiplex
    side_effects: ["multiplex_bitrate_allocation", "Channel.allocation_state transitions ACTIVE <-> STARVED <-> STANDBY", "channel_posture recomputation", "multiplex_capacity_conservation assertion"]

  # --- Operators ------------------------------------------------------------
  - method: POST
    path: "/operators"
    description: "Create an operator. role_class fixes which X-User-Role the operator may present; override_authority fixes which emergency modes they may authorize."
    roles: [StationAdmin]
    code: 201
    input: [full_name, role_class, override_authority, certification_expires_utc]
    output: Operator
    side_effects: ["certification_state derivation against the logical clock"]
  - method: GET
    path: "/operators/{id}"
    description: "Read one operator with derived certification_state."
    roles: [StationAdmin, ProgramDirector, MasterControlOperator, ComplianceOfficer, QCTechnician, BroadcastEngineer]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: POST
    path: "/operators/{id}/status"
    description: "Suspend or reinstate an operator, or extend certification."
    roles: [StationAdmin]
    code: 200
    input: ["status?", "certification_expires_utc?", "override_authority?"]
    output: Operator
    side_effects: ["certification_state re-derivation"]

  # --- Channels -------------------------------------------------------------
  - method: POST
    path: "/channels"
    description: "Create a primary channel or a subchannel on a multiplex. Admission runs the waterfall: the channel becomes ACTIVE when its floor fits, STANDBY when it is admitted without remainder, or the request is refused when no feasible allocation exists. Carries expected_multiplex_version because admission mutates the shared capacity pool."
    roles: [BroadcastEngineer, StationAdmin]
    code: 201
    input: [multiplex_id, expected_multiplex_version, call_sign, channel_number, service_class, resolution_class, requested_bitrate_kbps, floor_bitrate_kbps, priority_rank, "parent_channel_id?"]
    output: Channel
    side_effects: ["multiplex_bitrate_allocation", "multiplex_capacity_conservation assertion", "Channel.allocation_state and air_status initialisation (DARK)", "channel_posture NORMAL"]
  - method: GET
    path: "/channels/{id}"
    description: "Read one channel with allocated_bitrate_kbps, allocation_state, air_status, posture and open_fault_count."
    roles: [MasterControlOperator, ProgramDirector, BroadcastEngineer, StationAdmin, TrafficCoordinator, ComplianceOfficer]
    code: 200
    input: []
    output: Channel
    side_effects: []
  - method: GET
    path: "/channels"
    description: "List channels, optionally filtered by multiplex, by parent channel (subchannels of a primary) or by posture."
    roles: [MasterControlOperator, ProgramDirector, BroadcastEngineer, StationAdmin, TrafficCoordinator, ComplianceOfficer]
    code: 200
    input: ["multiplex_id?", "parent_channel_id?", "posture?", "air_status?"]
    output: Channel[]
    side_effects: []
  - method: PATCH
    path: "/channels/{id}/allocation"
    description: "Change a channel's bitrate demand (requested, floor, priority_rank) or pin an explicit allocation. Re-runs the waterfall for the whole multiplex; carries expected_multiplex_version."
    roles: [BroadcastEngineer, StationAdmin]
    code: 200
    input: [expected_multiplex_version, "requested_bitrate_kbps?", "floor_bitrate_kbps?", "priority_rank?", "pin_allocated_kbps?"]
    output: Channel
    side_effects: ["multiplex_bitrate_allocation", "Channel.allocation_state transitions", "channel_posture", "multiplex_capacity_conservation assertion"]
  - method: POST
    path: "/channels/{id}/air-state"
    description: "Take the channel to air, to bars-and-tone, or dark. EAS_OVERRIDE cannot be requested here - it is reached only through the emergency-override cascade."
    roles: [MasterControlOperator, StationAdmin]
    code: 200
    input: [target_air_status, "reason?"]
    output: Channel
    side_effects: ["channel_posture recomputation", "AsRunEntry rows when the change interrupts a playing element"]
  - method: GET
    path: "/channels/{id}/playlists"
    description: "List the playlists ingested for this channel, newest broadcast_day first."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer]
    code: 200
    input: ["broadcast_day?", "status?"]
    output: Playlist[]
    side_effects: []
  - method: GET
    path: "/channels/{id}/feed-windows"
    description: "List the network feed windows planned for this channel, ascending by join_utc."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin, BroadcastEngineer]
    code: 200
    input: ["state?"]
    output: NetworkFeedWindow[]
    side_effects: []

  # --- Assets and QC --------------------------------------------------------
  - method: POST
    path: "/assets"
    description: "Register an expected asset with its house number, delivery deadline and technical requirements. Created in status EXPECTED."
    roles: [TrafficCoordinator, QCTechnician, StationAdmin]
    code: 201
    input: [house_number, title, source, expected_duration_seconds, delivery_deadline_utc, required_resolution_class, captions_required]
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets/{id}"
    description: "Read one asset with delivery measurements, both technical scores, qc_verdict and waiver fields."
    roles: [QCTechnician, MasterControlOperator, TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "List assets, optionally filtered by status, house number or the operator who waived them."
    roles: [QCTechnician, MasterControlOperator, TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "house_number?", "waived_by_operator_id?"]
    output: Asset[]
    side_effects: []
  - method: POST
    path: "/assets/{id}/delivery"
    description: "Record the physical arrival of the file with its measured technical characteristics. Moves EXPECTED -> RECEIVED (or QC_FAILED -> RECEIVED on redelivery) and stamps late_delivery."
    roles: [QCTechnician, TrafficCoordinator, StationAdmin]
    code: 200
    input: [received_utc, measured_duration_seconds, video_codec, delivered_resolution_class, frame_rate, audio_loudness_lkfs, audio_channel_config, caption_present, "caption_language?"]
    output: Asset
    side_effects: ["late_delivery derivation", "Asset.status EXPECTED|QC_FAILED -> RECEIVED"]
  - method: POST
    path: "/assets/{id}/qc-reports"
    description: "Submit a QC inspection. basis INGEST scores the delivered file and drives Asset.status to QC_PASSED or QC_FAILED; basis AIR_CHECK scores what actually aired and never changes Asset.status. Carries expected_asset_version because a report supersedes any earlier report of the same basis."
    roles: [QCTechnician, StationAdmin]
    code: 201
    input: [expected_asset_version, inspected_by_operator_id, basis, defect_codes, measured_duration_seconds, "audio_loudness_lkfs?", "notes?"]
    output: QCReport
    side_effects: ["asset_technical_score (variant by basis)", "earlier report of the same basis marked superseded", "Asset.status RECEIVED -> QC_PASSED|QC_FAILED (INGEST only)", "PlaylistItem.clearance_status UNCLEARED|BLOCKED -> CLEARED on pass", "Playlist.blocked_item_count recomputation"]
  - method: GET
    path: "/qc-reports/{id}"
    description: "Read one QC report with its penalty breakdown and verdict."
    roles: [QCTechnician, MasterControlOperator, ProgramDirector, StationAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: QCReport
    side_effects: []
  - method: GET
    path: "/qc-reports"
    description: "List QC reports, optionally filtered by asset, inspector or basis. Superseded reports are included unless excluded explicitly."
    roles: [QCTechnician, MasterControlOperator, ProgramDirector, StationAdmin, ComplianceOfficer]
    code: 200
    input: ["asset_id?", "inspected_by_operator_id?", "basis?", "include_superseded?"]
    output: QCReport[]
    side_effects: []
  - method: POST
    path: "/assets/{id}/qc-waivers"
    description: "Waive a QC failure so the asset may air anyway. Requires a different operator than the inspector, an ingest score of at least 40, a justification of at least 20 characters, and a present caption track when captions are required."
    roles: [ProgramDirector, StationAdmin]
    code: 200
    input: [waived_by_operator_id, waiver_justification]
    output: Asset
    side_effects: ["Asset.status QC_FAILED -> QC_WAIVED", "PlaylistItem.clearance_status BLOCKED -> CLEARED", "Playlist.blocked_item_count recomputation"]
  - method: POST
    path: "/assets/{id}/retract"
    description: "Withdraw an asset from all use (rights pull, wrong version, legal hold). Entry point of CASCADE B."
    roles: [TrafficCoordinator, ProgramDirector, StationAdmin]
    code: 200
    input: [reason]
    output: Asset
    side_effects: ["CASCADE B hops 1-3: items -> BLOCKED, playlist ARMED|VALIDATED -> IMPORTED, spot credit accrual", "Playlist.blocked_item_count recomputation", "spot_inventory_conservation assertion"]

  # --- Playlists ------------------------------------------------------------
  - method: POST
    path: "/playlists"
    description: "Ingest a broadcast-day playlist from the traffic system. Created in status IMPORTING with traffic_revision 1; the items array carries one object per element (sequence_number, element_kind, house_number?, asset_id?, spot_order_id?, scheduled_start_utc, scheduled_duration_seconds, max_trim_seconds?) and is timed to the second."
    roles: [TrafficCoordinator, StationAdmin]
    code: 201
    input: [channel_id, broadcast_day, schedule_start_utc, items, "window_duration_seconds?"]
    output: Playlist
    side_effects: ["PlaylistItem rows created in playout_status SCHEDULED", "clearance_status derivation per item from asset status", "playlist_timeline_integrity (recorded, not enforced, until VALIDATED)", "commercial_inventory_by_hour", "playlist_timing_variance (PROJECTED)", "SpotOrder.scheduled_spots / unplaced_spots recomputation"]
  - method: POST
    path: "/playlists/{id}/traffic-revisions"
    description: "Apply a revision from traffic: replace, insert or remove elements. Increments traffic_revision and pulls an ARMED or VALIDATED playlist back to IMPORTED. Carries expected_playlist_version."
    roles: [TrafficCoordinator, StationAdmin]
    code: 200
    input: [expected_playlist_version, items, "removed_sequence_numbers?"]
    output: Playlist
    side_effects: ["Playlist.status ARMED|VALIDATED -> IMPORTED", "PlaylistItem create/update/remove", "clearance_status re-derivation", "commercial_inventory_by_hour", "playlist_timing_variance (PROJECTED)", "spot_inventory_conservation assertion", "airtime_seconds_conservation restoration for reinstated trims"]
  - method: GET
    path: "/playlists/{id}"
    description: "Read one playlist with item_count, blocked_item_count, both variance figures, commercial_seconds_by_hour and reconciliation_credit_cents."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Playlist
    side_effects: []
  - method: POST
    path: "/playlists/{id}/state"
    description: "Drive the playlist lifecycle: target_status VALIDATED (runs timeline integrity and inventory checks), ARMED (runs the clearance, fault, arm-variance and starvation gates), ON_AIR (hands the list to automation), CLOSED (final settlement) or ABANDONED."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin]
    code: 200
    input: [target_status, "reason?"]
    output: Playlist
    side_effects: ["playlist_timeline_integrity", "commercial_inventory_by_hour", "playlist_timing_variance (PROJECTED on ARM, AS_RUN on CLOSE)", "pending items swept to SKIPPED on CLOSE with AsRunEntry rows", "spot_credit_settlement (FINAL) on CLOSE", "spot_inventory_conservation assertion", "Channel.air_status DARK|BARS_AND_TONE -> ON_AIR on ON_AIR"]
  - method: GET
    path: "/playlists/{id}/items"
    description: "List the playlist's elements in sequence order with playout and clearance status."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer, QCTechnician]
    code: 200
    input: ["playout_status?", "clearance_status?", "element_kind?"]
    output: PlaylistItem[]
    side_effects: []
  - method: GET
    path: "/playlists/{id}/as-run"
    description: "The as-run log for the playlist in event_utc order - the reconciliation record against which orders are settled. Append-only and immutable."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer]
    code: 200
    input: ["event_kind?", "from_utc?", "to_utc?"]
    output: AsRunEntry[]
    side_effects: []
  - method: GET
    path: "/playlists/{id}/reconciliation"
    description: "Computed read: reconcile the as-run log against the spot orders touched by this playlist. basis=PRELIMINARY (default) excludes still-pending spots; basis=FINAL credits ordered-but-unplaced spots in full. Purely read-only - it never mutates the orders."
    roles: [TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer]
    code: 200
    input: ["basis?"]
    output: Playlist
    side_effects: ["spot_credit_settlement (PRELIMINARY or FINAL variant, computed and returned, not persisted)"]

  # --- Playlist items -------------------------------------------------------
  - method: GET
    path: "/playlist-items/{id}"
    description: "Read one element with its actual start, measured duration and trim."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer, QCTechnician]
    code: 200
    input: []
    output: PlaylistItem
    side_effects: []
  - method: GET
    path: "/playlist-items"
    description: "List elements across playlists, filtered by playlist, by the asset or spot order they carry, by the feed window they belong to, or by the item they replace."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer, QCTechnician]
    code: 200
    input: ["playlist_id?", "asset_id?", "spot_order_id?", "feed_window_id?", "replaces_item_id?", "playout_status?"]
    output: PlaylistItem[]
    side_effects: []
  - method: POST
    path: "/playlist-items/{id}/playout-events"
    description: "Report an automation playout event (CUE, START, END, TRUNCATION, SKIP) against an element. Every accepted event appends exactly one AsRunEntry; the as-run log is the only durable record of what aired."
    roles: [MasterControlOperator, StationAdmin]
    code: 201
    input: [event_kind, event_utc, "measured_duration_seconds?", "source?", "force_preempt_guaranteed?"]
    output: AsRunEntry
    side_effects: ["PlaylistItem.playout_status transition", "AsRunEntry append", "playlist_timing_variance (AS_RUN)", "spot_credit_settlement per terminal item", "spot_inventory_conservation assertion"]
  - method: POST
    path: "/playlist-items/{id}/substitute"
    description: "Replace a scheduled or cued element with a different asset (late delivery, QC failure, rights pull). The new item records replaces_item_id and the old item moves to SKIPPED with an AsRunEntry."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin]
    code: 201
    input: [replacement_asset_id, "scheduled_duration_seconds?", "reason?"]
    output: PlaylistItem
    side_effects: ["outgoing item -> SKIPPED + AsRunEntry", "new PlaylistItem with replaces_item_id", "clearance_status derivation", "playlist_timeline_integrity re-check", "playlist_timing_variance (PROJECTED)", "airtime_seconds_conservation assertion"]
  - method: GET
    path: "/playlist-items/{id}/as-run"
    description: "The as-run entries recorded for this single element, in event_utc order."
    roles: [MasterControlOperator, ProgramDirector, TrafficCoordinator, StationAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: AsRunEntry[]
    side_effects: []

  # --- Network feed windows -------------------------------------------------
  - method: POST
    path: "/network-feed-windows"
    description: "Plan a network join/breakaway against an anchor NETWORK_JOIN element. Computes the backtiming plan immediately (backtime_join_plan) and reserves live encoder units for the guarded interval."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin]
    code: 201
    input: [channel_id, feed_source, anchor_sequence_number, join_utc, breakaway_utc, backtiming_mode, "guard_seconds?", "live_encoder_units?"]
    output: NetworkFeedWindow
    side_effects: ["backtime_join_plan (plan_action, pad, trim, skipped_item_sequences, plan_computed_utc)", "live_encoder_concurrency_peak", "Multiplex.live_encoder_units_peak update"]
  - method: GET
    path: "/network-feed-windows/{id}"
    description: "Read one feed window with its computed plan and residual dead air."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin, BroadcastEngineer, ComplianceOfficer]
    code: 200
    input: []
    output: NetworkFeedWindow
    side_effects: []
  - method: POST
    path: "/network-feed-windows/{id}/join"
    description: "Execute the join at the guard window. Recomputes the plan against the logical clock (a late call converts PAD_WITH_FILLER into JOIN_IN_PROGRESS with late_join_seconds) and applies pads, trims and skips to the local tail."
    roles: [MasterControlOperator, StationAdmin]
    code: 200
    input: ["actual_join_utc?"]
    output: NetworkFeedWindow
    side_effects: ["backtime_join_plan re-evaluation", "PlaylistItem trims and SKIPPED transitions", "FILLER item insertion for pad", "AsRunEntry JOIN / FILLER_INSERT / SKIP rows", "airtime_seconds_conservation assertion", "spot_credit_settlement for skipped commercials"]
  - method: POST
    path: "/network-feed-windows/{id}/breakaway"
    description: "Execute the breakaway back to local programming, recording any residual dead air and re-cueing the local tail."
    roles: [MasterControlOperator, StationAdmin]
    code: 200
    input: ["actual_breakaway_utc?"]
    output: NetworkFeedWindow
    side_effects: ["residual_dead_air_seconds computation", "AsRunEntry BREAKAWAY row", "PlaylistItem re-cue", "Multiplex live encoder unit release", "playlist_timing_variance (AS_RUN)"]

  # --- Emergency overrides --------------------------------------------------
  - method: POST
    path: "/emergency-overrides"
    description: "Request an emergency override (EAS, severe weather, breaking news, station message) as a crawl or a cut-in. Created PENDING; requesting it changes nothing on air."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin]
    code: 201
    input: [channel_id, requested_by_operator_id, alert_class, override_mode, requested_start_utc, expected_duration_seconds, "crawl_text?"]
    output: EmergencyOverride
    side_effects: []
  - method: GET
    path: "/emergency-overrides/{id}"
    description: "Read one override with its authority trail, active mode and preemption counts."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin, ComplianceOfficer, TrafficCoordinator]
    code: 200
    input: []
    output: EmergencyOverride
    side_effects: []
  - method: GET
    path: "/emergency-overrides"
    description: "List overrides, filtered by channel, by requester or by the operator who authorized them."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin, ComplianceOfficer, TrafficCoordinator]
    code: 200
    input: ["channel_id?", "requested_by_operator_id?", "authorized_by_operator_id?", "state?"]
    output: EmergencyOverride[]
    side_effects: []
  - method: POST
    path: "/emergency-overrides/{id}/activate"
    description: "Authorize and put the override on air, or escalate a crawl to a cut-in / relax a cut-in back to a crawl. Entry point of CASCADE C. The authorizer must differ from the requester and must hold sufficient override_authority."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin]
    code: 200
    input: [authorized_by_operator_id, override_mode, "activated_utc?", "crawl_text?", "force_preempt_guaranteed?"]
    output: EmergencyOverride
    side_effects: ["CASCADE C hops 1-5: Channel.air_status -> EAS_OVERRIDE and posture -> EMERGENCY (cut-in only), item TRUNCATED / PREEMPTED transitions, spot credit accrual, variance recomputation", "AsRunEntry OVERRIDE_IN row", "spot_inventory_conservation assertion"]
  - method: POST
    path: "/emergency-overrides/{id}/release"
    description: "Take the override off air and hand the channel back to the playlist. Preempted elements are NOT restored - they remain preempted and credited, which is what a makegood later compensates."
    roles: [MasterControlOperator, ProgramDirector, StationAdmin]
    code: 200
    input: ["released_utc?"]
    output: EmergencyOverride
    side_effects: ["Channel.air_status EAS_OVERRIDE -> ON_AIR", "channel_posture recomputation", "AsRunEntry OVERRIDE_OUT row", "playlist_timing_variance (AS_RUN)"]

  # --- Technical faults -----------------------------------------------------
  - method: POST
    path: "/technical-faults"
    description: "Report a technical fault detected by automation or by an operator: audio loss, black frames, caption loss, loss of signal, encoder failure, RF power fault or automation stall. Created DETECTED and immediately recomputes the channel posture."
    roles: [MasterControlOperator, BroadcastEngineer, StationAdmin]
    code: 201
    input: [fault_code, severity, detected_utc, "channel_id?", "transmitter_id?", "playlist_item_id?", "notes?"]
    output: TechnicalFault
    side_effects: ["channel_posture recomputation (DEGRADED / DEGRADED_CRITICAL / SUSPENDED)", "Channel.open_fault_count increment", "asset_technical_score AIR_CHECK inputs when playlist_item_id is present"]
  - method: GET
    path: "/technical-faults/{id}"
    description: "Read one fault with its duration and mitigation."
    roles: [MasterControlOperator, BroadcastEngineer, StationAdmin, ComplianceOfficer, QCTechnician]
    code: 200
    input: []
    output: TechnicalFault
    side_effects: []
  - method: GET
    path: "/technical-faults"
    description: "List faults, filtered by channel, by transmitter or by the element they were observed against."
    roles: [MasterControlOperator, BroadcastEngineer, StationAdmin, ComplianceOfficer, QCTechnician]
    code: 200
    input: ["channel_id?", "transmitter_id?", "playlist_item_id?", "state?", "severity?"]
    output: TechnicalFault[]
    side_effects: []
  - method: POST
    path: "/technical-faults/{id}/state"
    description: "Advance a fault: acknowledge, escalate, mitigate, resolve, or re-open a mitigated fault that recurred. Every transition recomputes the channel posture and can lift or impose the SUSPENDED gate."
    roles: [MasterControlOperator, BroadcastEngineer, StationAdmin]
    code: 200
    input: [target_state, "mitigation_code?", "cleared_utc?", "notes?"]
    output: TechnicalFault
    side_effects: ["duration_seconds computation on clear", "Channel.open_fault_count recomputation", "channel_posture recomputation", "Channel.air_status BARS_AND_TONE -> ON_AIR eligibility"]

  # --- Spot orders ----------------------------------------------------------
  - method: POST
    path: "/spot-orders"
    description: "Create a commercial order for a channel: ordered spots, unit duration, total rate in cents, daypart, priority class and makegood deadline. Created OPEN with unplaced_spots == ordered_spots."
    roles: [TrafficCoordinator, StationAdmin]
    code: 201
    input: [channel_id, advertiser_name, order_reference, ordered_spots, unit_duration_seconds, rate_cents_total, daypart, priority_class, makegood_deadline_utc]
    output: SpotOrder
    side_effects: ["spot_inventory_conservation initialisation"]
  - method: GET
    path: "/spot-orders/{id}"
    description: "Read one order with its scheduled / aired / short-aired / credited / unplaced counters and credit_accrued_cents."
    roles: [TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer, MasterControlOperator]
    code: 200
    input: []
    output: SpotOrder
    side_effects: []
  - method: GET
    path: "/spot-orders"
    description: "List orders, optionally filtered by channel, status or priority class."
    roles: [TrafficCoordinator, ProgramDirector, StationAdmin, ComplianceOfficer, MasterControlOperator]
    code: 200
    input: ["channel_id?", "status?", "priority_class?"]
    output: SpotOrder[]
    side_effects: []
  - method: POST
    path: "/spot-orders/{id}/makegoods"
    description: "Place a credited spot again inside the makegood deadline. This is the compensating action for spot_inventory_conservation: it moves one spot from credited back to scheduled and reverses exactly the rounded per-spot credit that was accrued, so no rounding drift survives a preempt/makegood round trip. Carries expected_playlist_version for the target playlist."
    roles: [TrafficCoordinator, ProgramDirector, StationAdmin]
    code: 201
    input: [target_playlist_id, expected_playlist_version, sequence_number, scheduled_start_utc, "scheduled_duration_seconds?"]
    output: PlaylistItem
    side_effects: ["new PlaylistItem with is_makegood true in playout_status SCHEDULED", "SpotOrder.credited_spots -1 / scheduled_spots +1 and credit_accrued_cents reversal", "SpotOrder.status PARTIALLY_CREDITED -> OPEN when no credit remains", "commercial_inventory_by_hour", "playlist_timeline_integrity re-check", "spot_inventory_conservation assertion"]

# =============================================================================
# §1.6 ERROR CODE CATALOG (every id is raised by a §1.4 rule or a §1.2 guard)
# =============================================================================
errors:

  # --- Authentication / authorization ---------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Id or X-User-Role absent or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven declared role names."
  - id: ERR_OPERATOR_NOT_FOUND
    http: 401
    condition: "X-User-Id does not resolve to an Operator while an entity_backed role is claimed."
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "The resolved Operator.role_class does not correspond to the claimed X-User-Role."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The role is not listed in the target endpoint's roles."
  - id: ERR_OPERATOR_SUSPENDED
    http: 403
    condition: "The acting operator's status is SUSPENDED and the request mutates state."
  - id: ERR_OPERATOR_CERTIFICATION_EXPIRED
    http: 403
    condition: "The acting operator's certification_expires_utc is before the logical clock on an air-critical mutation."

  # --- Field shape ----------------------------------------------------------
  - id: ERR_MISSING_REQUIRED_FIELD
    http: 422
    condition: "A non-optional input field of the endpoint is absent."
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "An enum field carries a literal outside its declared set."
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "A field violates its type, range or format (negative duration, power_pct > 100, non-RFC3339 timestamp, crawl_text longer than 512 characters)."

  # --- Existence ------------------------------------------------------------
  - id: ERR_TRANSMITTER_NOT_FOUND
    http: 404
    condition: "No Transmitter with the given id."
  - id: ERR_MULTIPLEX_NOT_FOUND
    http: 404
    condition: "No Multiplex with the given id."
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "No Channel with the given id."
  - id: ERR_OPERATOR_REFERENCE_NOT_FOUND
    http: 404
    condition: "An operator id supplied in a path or body (inspector, requester, authorizer, waiver signer) does not exist."
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "No Asset with the given id."
  - id: ERR_QC_REPORT_NOT_FOUND
    http: 404
    condition: "No QCReport with the given id."
  - id: ERR_PLAYLIST_NOT_FOUND
    http: 404
    condition: "No Playlist with the given id."
  - id: ERR_PLAYLIST_ITEM_NOT_FOUND
    http: 404
    condition: "No PlaylistItem with the given id."
  - id: ERR_SPOT_ORDER_NOT_FOUND
    http: 404
    condition: "No SpotOrder with the given id."
  - id: ERR_FEED_WINDOW_NOT_FOUND
    http: 404
    condition: "No NetworkFeedWindow with the given id."
  - id: ERR_OVERRIDE_NOT_FOUND
    http: 404
    condition: "No EmergencyOverride with the given id."
  - id: ERR_FAULT_NOT_FOUND
    http: 404
    condition: "No TechnicalFault with the given id."
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "No RegulatoryNotification with the given id."

  # --- Optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_PLAYLIST_VERSION
    http: 412
    condition: "expected_playlist_version does not equal Playlist.version."
  - id: ERR_STALE_MULTIPLEX_VERSION
    http: 412
    condition: "expected_multiplex_version does not equal Multiplex.version."
  - id: ERR_STALE_ASSET_VERSION
    http: 412
    condition: "expected_asset_version does not equal Asset.version."

  # --- State preconditions --------------------------------------------------
  - id: ERR_TRANSMITTER_INVALID_STATE
    http: 409
    condition: "The requested transmitter power transition is not declared from the current operational_state."
  - id: ERR_CHANNEL_INVALID_AIR_STATE
    http: 409
    condition: "The requested air_status transition is not declared, or EAS_OVERRIDE was requested directly."
  - id: ERR_ASSET_INVALID_STATE
    http: 409
    condition: "Delivery, QC, waiver or retraction attempted from an asset status that does not allow it."
  - id: ERR_PLAYLIST_INVALID_STATE
    http: 409
    condition: "The requested playlist status transition is not declared, or a revision was submitted against an ON_AIR, CLOSED or ABANDONED playlist."
  - id: ERR_ITEM_INVALID_PLAYOUT_STATE
    http: 409
    condition: "The playout event or substitution is not legal for the element's current playout_status."
  - id: ERR_FEED_WINDOW_INVALID_STATE
    http: 409
    condition: "Join attempted on a window that is not PLANNED, or breakaway on a window that is not JOINED."
  - id: ERR_OVERRIDE_INVALID_STATE
    http: 409
    condition: "Activation attempted from a terminal override state, release attempted on a non-active override, or an activation that would not change active_mode."
  - id: ERR_FAULT_INVALID_STATE
    http: 409
    condition: "The requested fault transition is not declared from the current state (for example RESOLVED -> DETECTED)."
  - id: ERR_NOTIFICATION_INVALID_STATE
    http: 409
    condition: "Filing attempted on a notification that is already FILED or LATE_FILED."
  - id: ERR_ORDER_FULLY_SETTLED
    http: 409
    condition: "A makegood was requested on a FULLY_AIRED or CLOSED_WITH_CREDIT order."

  # --- Business: safety / air integrity ------------------------------------
  - id: ERR_CHANNEL_SUSPENDED_POSTURE
    http: 409
    condition: "An air-affecting mutation was attempted while Channel.posture is SUSPENDED."
  - id: ERR_CHANNEL_ALLOCATION_STARVED
    http: 409
    condition: "The channel's allocation_state is STARVED - it received less than its floor bitrate and may not go ON_AIR or accept START events."
  - id: ERR_TRANSMITTER_OFF_AIR
    http: 409
    condition: "The operation requires a radiating transmitter but the carrying transmitter is OFF_AIR."
  - id: ERR_RF_FAULT_BLOCKS_RESTORE
    http: 409
    condition: "A power restoration to FULL_POWER was attempted while an unresolved RF_POWER_FAULT of severity CRITICAL is open on the transmitter."
  - id: ERR_CRITICAL_FAULT_OPEN
    http: 409
    condition: "Arming or airing was attempted while a CRITICAL TechnicalFault is open (DETECTED, ACKNOWLEDGED or ESCALATED) on the channel."
  - id: ERR_UNCLEARED_CONTENT_ON_AIR
    http: 409
    condition: "An arm or cue was attempted while at least one element is UNCLEARED or BLOCKED (asset not QC_PASSED and not QC_WAIVED)."
  - id: ERR_CAPTION_REQUIREMENT_UNMET
    http: 409
    condition: "An asset requiring captions has caption_present false - a non-waivable QC defect."
  - id: ERR_QC_WAIVER_SCORE_TOO_LOW
    http: 409
    condition: "The asset's ingest technical score is below WAIVER_MIN_SCORE (40)."
  - id: ERR_WAIVER_JUSTIFICATION_REQUIRED
    http: 422
    condition: "waiver_justification is shorter than 20 characters."
  - id: ERR_SELF_AUTHORIZATION_FORBIDDEN
    http: 409
    condition: "The authorizing operator equals the requesting operator on an override activation, or the waiver signer equals the QC inspector."
  - id: ERR_OVERRIDE_AUTHORITY_INSUFFICIENT
    http: 403
    condition: "The authorizing operator's override_authority does not cover the requested override mode or alert class."
  - id: ERR_EAS_OVERRIDE_ACTIVE
    http: 409
    condition: "Ordinary programming mutations were attempted while the channel's air_status is EAS_OVERRIDE, or a state change was attempted while a non-terminal override holds the channel."
  - id: ERR_CRAWL_TEXT_REQUIRED
    http: 422
    condition: "A CRAWL override was requested or activated without crawl_text."
  - id: ERR_EAS_MINIMUM_DURATION_NOT_MET
    http: 409
    condition: "An EAS_MANDATORY override was released before its expected_duration_seconds had elapsed, or requested with an expected_duration_seconds below the mandatory minimum."
  - id: ERR_REJECTION_REASON_REQUIRED
    http: 422
    condition: "An override was moved to REJECTED without a rejection_reason."
  - id: ERR_MITIGATION_CODE_REQUIRED
    http: 422
    condition: "A fault was moved to MITIGATED or RESOLVED without a mitigation_code."
  - id: ERR_FAULT_ESCALATION_TOO_EARLY
    http: 409
    condition: "An ACKNOWLEDGED fault was escalated before the mandatory acknowledgement dwell had elapsed on the logical clock."
  - id: ERR_OPERATOR_ROLE_CLASS_INVALID
    http: 409
    condition: "A referenced operator holds the wrong role_class for the duty (a non-QC inspector, or an authorizer who is neither PROGRAM_DIRECTOR nor MASTER_CONTROL)."

  # --- Business: temporal ---------------------------------------------------
  - id: ERR_SCHEDULE_GAP_DETECTED
    http: 409
    condition: "Consecutive elements leave a positive gap under half-open timeline semantics."
  - id: ERR_SCHEDULE_OVERLAP_DETECTED
    http: 409
    condition: "Consecutive elements overlap - an element ends after the next one starts."
  - id: ERR_FEED_WINDOW_OVERLAP
    http: 409
    condition: "The new feed window's guarded closed interval intersects another PLANNED or JOINED window on the same channel."
  - id: ERR_JOIN_OUTSIDE_GUARD_WINDOW
    http: 409
    condition: "The join was executed before join_utc - guard_seconds or after join_utc + 30 s."
  - id: ERR_BREAKAWAY_TOO_EARLY
    http: 409
    condition: "The breakaway was executed before the window's breakaway_utc minus guard_seconds."
  - id: ERR_ENCODER_CAPACITY_EXCEEDED
    http: 409
    condition: "The live encoder concurrency peak over the guarded intervals would exceed Multiplex.live_encoder_units_total."
  - id: ERR_OVERRIDE_WINDOW_OVERLAP
    http: 409
    condition: "The channel already carries a PENDING, ACTIVE_CRAWL or ACTIVE_CUTIN override."
  - id: ERR_PLAYOUT_EVENT_OUT_OF_ORDER
    http: 409
    condition: "event_utc precedes the most recent as-run entry of the same playlist."
  - id: ERR_EVENT_TIMESTAMP_IN_FUTURE
    http: 409
    condition: "A supplied timestamp is after the logical clock."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 409
    condition: "The requested current_utc is not strictly after the present logical clock value."
  - id: ERR_DELIVERY_DEADLINE_PASSED
    http: 409
    condition: "Delivery was attempted more than DELIVERY_GRACE_SECONDS (3600) after delivery_deadline_utc, or against an asset already swept to EXPIRED."
  - id: ERR_MAKEGOOD_DEADLINE_PASSED
    http: 409
    condition: "The makegood, or the slot it would occupy, falls after SpotOrder.makegood_deadline_utc."
  - id: ERR_ARM_VARIANCE_EXCEEDED
    http: 409
    condition: "abs(projected_end_variance_seconds) exceeds ARM_VARIANCE_TOLERANCE_SECONDS (30) at arm time."
  - id: ERR_PLAYLIST_AIR_TOO_EARLY
    http: 409
    condition: "ARMED -> ON_AIR was attempted before the playlist's schedule_start_utc lead window opened."
  - id: ERR_PLAYLIST_NOT_ON_AIR
    http: 409
    condition: "A playout event, join or breakaway was reported while the owning playlist is not ON_AIR, or no playlist is ON_AIR for the channel."
  - id: ERR_CHANNEL_NOT_ON_AIR
    http: 409
    condition: "The operation requires Channel.air_status ON_AIR (or EAS_OVERRIDE for release) and the channel is DARK or BARS_AND_TONE."
  - id: ERR_CHANNEL_PLAYLIST_ALREADY_ON_AIR
    http: 409
    condition: "Another playlist on the same channel is already ON_AIR."
  - id: ERR_PLAYLIST_ITEM_STILL_PLAYING
    http: 409
    condition: "The playlist cannot be closed or abandoned while an element is in playout_status PLAYING."

  # --- Business: constraint --------------------------------------------------
  - id: ERR_DUPLICATE_CHANNEL_NUMBER
    http: 409
    condition: "channel_number is already used by another channel at the station."
  - id: ERR_DUPLICATE_HOUSE_NUMBER
    http: 409
    condition: "house_number is already used by another asset, including retracted and expired ones."
  - id: ERR_DUPLICATE_ORDER_REFERENCE
    http: 409
    condition: "order_reference is already used by another spot order."
  - id: ERR_SUBCHANNEL_PARENT_REQUIRED
    http: 422
    condition: "service_class SUBCHANNEL was submitted without parent_channel_id."
  - id: ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN
    http: 422
    condition: "service_class PRIMARY was submitted with a parent_channel_id."
  - id: ERR_INVALID_CHANNEL_PARENT
    http: 409
    condition: "parent_channel_id references a SUBCHANNEL or the channel itself - the parent chain is exactly one level deep."
  - id: ERR_CROSS_MULTIPLEX_PARENT
    http: 409
    condition: "parent_channel_id references a channel on a different multiplex."
  - id: ERR_BITRATE_FLOOR_EXCEEDS_REQUEST
    http: 422
    condition: "floor_bitrate_kbps is greater than requested_bitrate_kbps."
  - id: ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM
    http: 422
    condition: "floor_bitrate_kbps is below the resolution class minimum (HD_1080I 8000, HD_720P 5000, SD_480I 2000)."
  - id: ERR_SEQUENCE_NUMBER_CONFLICT
    http: 409
    condition: "The submitted items duplicate a sequence_number or leave a hole in the dense 1..N run."
  - id: ERR_ANCHOR_ITEM_NOT_FOUND
    http: 409
    condition: "anchor_sequence_number matches no NETWORK_JOIN element in the channel's armed or on-air playlist."
  - id: ERR_SUBSTITUTE_RESOLUTION_MISMATCH
    http: 409
    condition: "The replacement asset's resolution class or duration does not fit the element it would replace."
  - id: ERR_TRIM_EXCEEDS_MAX
    http: 409
    condition: "A backtiming or substitution trim exceeds the element's max_trim_seconds, including any attempt to trim a COMMERCIAL element (max_trim_seconds 0)."
  - id: ERR_PLAYLIST_EMPTY_INGEST
    http: 422
    condition: "A playlist was ingested, or revised down, to zero elements."
  - id: ERR_PLAYLIST_NO_PROGRAM_CONTENT
    http: 409
    condition: "The playlist contains no PROGRAM, NETWORK_JOIN or LIVE_EVENT element - commercials and promos alone cannot be validated or armed."
  - id: ERR_FILING_DETAILS_REQUIRED
    http: 422
    condition: "A regulatory notification was filed without filed_reference or narrative."

  # --- Business: referential ------------------------------------------------
  - id: ERR_SPOT_ORDER_CHANNEL_MISMATCH
    http: 409
    condition: "The referenced spot order belongs to a different channel than the playlist it would be placed in."
  - id: ERR_ITEM_PLAYLIST_MISMATCH
    http: 409
    condition: "The target playlist or element does not belong to the expected parent (makegood target on the wrong channel, or a replacement already placed in the same hour)."
  - id: ERR_FAULT_TARGET_MISMATCH
    http: 409
    condition: "The fault's channel, transmitter and element do not form a consistent chain, or the fault_code requires a target that was not supplied."

  # --- Business: fiscal / capacity -----------------------------------------
  - id: ERR_COMMERCIAL_INVENTORY_EXCEEDED
    http: 409
    condition: "A clock hour would carry more than MAX_COMMERCIAL_SECONDS_PER_HOUR (960) seconds of commercial elements."
  - id: ERR_NO_CREDITED_SPOT_TO_MAKEGOOD
    http: 409
    condition: "A makegood was requested while SpotOrder.credited_spots is 0 - there is nothing to compensate."
  - id: ERR_ORDER_NOT_PREEMPTIBLE
    http: 409
    condition: "A GUARANTEED spot would be preempted without force_preempt_guaranteed."
  - id: ERR_BITRATE_FLOOR_UNSATISFIABLE
    http: 409
    condition: "The sum of the floors of the channels that must be ACTIVE exceeds effective_capacity_kbps - no feasible allocation exists."
  - id: ERR_MULTIPLEX_CAPACITY_EXCEEDED
    http: 409
    condition: "A pinned or admitted allocation total would exceed Multiplex.effective_capacity_kbps."

# =============================================================================
# §1.7 RBAC MATRIX (segregation of duties: the operator who requests an
#      override never authorizes it, and the QC technician who fails an asset
#      never waives it)
# =============================================================================
roles:

  - name: MasterControlOperator
    description: "Runs the air chain: takes channels to air, drives playlists on air, reports playout events, executes network joins and breakaways, reports and mitigates technical faults, and requests emergency overrides. The default operator on shift."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /playlist-items/{id}/playout-events (with StationAdmin) - only master control writes the as-run log"
      - "POST /network-feed-windows/{id}/join and /breakaway (with StationAdmin)"
      - "POST /channels/{id}/air-state (with StationAdmin)"
    shared_operations:
      - "POST /playlists/{id}/state (with ProgramDirector, StationAdmin)"
      - "POST /playlist-items/{id}/substitute (with ProgramDirector, StationAdmin)"
      - "POST /network-feed-windows (with ProgramDirector, StationAdmin)"
      - "POST /emergency-overrides and /activate and /release (with ProgramDirector, StationAdmin)"
      - "POST /technical-faults and /technical-faults/{id}/state (with BroadcastEngineer, StationAdmin)"
      - "POST /_clock/set_current_utc (all roles)"
      - "read access to transmitters, multiplexes, channels, assets, playlists, items, as-run, feed windows, overrides, faults and spot orders"

  - name: QCTechnician
    description: "Receives delivered files, measures them and issues QC reports on both bases. May fail an asset but may never waive its own failure - the waiver is a ProgramDirector duty."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /assets/{id}/qc-reports (with StationAdmin) - only QC issues inspection reports"
    shared_operations:
      - "POST /assets and POST /assets/{id}/delivery (with TrafficCoordinator, StationAdmin)"
      - "POST /_clock/set_current_utc (all roles)"
      - "read access to assets, QC reports, playlists, items, channels, faults and operators"

  - name: ProgramDirector
    description: "Holds programming authority: authorizes emergency overrides requested by master control, signs QC waivers, approves substitutions and makegoods, and arms playlists. The counter-signature half of every segregation-of-duties pair."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /assets/{id}/qc-waivers (with StationAdmin) - only programming may waive a QC failure"
      - "POST /assets/{id}/retract (with TrafficCoordinator, StationAdmin)"
    shared_operations:
      - "POST /emergency-overrides/{id}/activate and /release (with MasterControlOperator, StationAdmin)"
      - "POST /playlists/{id}/state (with MasterControlOperator, StationAdmin)"
      - "POST /playlist-items/{id}/substitute (with MasterControlOperator, StationAdmin)"
      - "POST /spot-orders/{id}/makegoods (with TrafficCoordinator, StationAdmin)"
      - "POST /network-feed-windows (with MasterControlOperator, StationAdmin)"
      - "POST /_clock/set_current_utc (all roles)"
      - "read access to every entity"

  - name: BroadcastEngineer
    description: "Owns the transmission plant and the multiplex: registers transmitters and multiplexes, changes power state, admits channels, tunes bitrate allocations, rebalances the multiplex, and works technical faults. Has no programming or trafficking authority."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /transmitters and POST /transmitters/{id}/power-state (with StationAdmin)"
      - "POST /multiplexes and POST /multiplexes/{id}/rebalance (with StationAdmin)"
      - "POST /channels and PATCH /channels/{id}/allocation (with StationAdmin)"
    shared_operations:
      - "POST /technical-faults and POST /technical-faults/{id}/state (with MasterControlOperator, StationAdmin)"
      - "POST /_clock/set_current_utc (all roles)"
      - "read access to transmitters, notifications, multiplexes, channels, feed windows, faults and operators"

  - name: TrafficCoordinator
    description: "Owns the traffic system side: creates spot orders, ingests and revises playlists, registers expected assets, and places makegoods. Never touches the air chain and never authorizes anything."
    identity: opaque
    exclusive_operations:
      - "POST /playlists and POST /playlists/{id}/traffic-revisions (with StationAdmin)"
      - "POST /spot-orders (with StationAdmin)"
    shared_operations:
      - "POST /assets and POST /assets/{id}/delivery (with QCTechnician, StationAdmin)"
      - "POST /assets/{id}/retract (with ProgramDirector, StationAdmin)"
      - "POST /spot-orders/{id}/makegoods (with ProgramDirector, StationAdmin)"
      - "POST /_clock/set_current_utc (all roles)"
      - "read access to channels, assets, playlists, items, as-run, reconciliation, spot orders, overrides and faults"

  - name: ComplianceOfficer
    description: "Files regulatory notifications for power reductions, outages and resumptions, and audits the as-run log and reconciliation. Read-only everywhere else - it cannot change power, air state or content."
    identity: opaque
    exclusive_operations:
      - "POST /regulatory-notifications/{id}/file (with StationAdmin) - only compliance files with the regulator"
    shared_operations:
      - "POST /_clock/set_current_utc (all roles)"
      - "read access to transmitters, notifications, multiplexes, channels, assets, QC reports, playlists, items, as-run, reconciliation, feed windows, overrides, faults and spot orders"

  - name: StationAdmin
    description: "Superset operational role used for setup and recovery: creates and suspends operators, and may perform every mutating operation in the domain. Segregation of duties still binds it by identity, not by role - an override still needs two distinct operator ids, and StationAdmin acts with an opaque id that is never one of them."
    identity: opaque
    exclusive_operations:
      - "POST /operators and POST /operators/{id}/status - only the admin manages operator records, authority levels and certification"
    shared_operations:
      - "every mutating endpoint in §1.5, shared with the role that normally owns it"
      - "read access to every entity"
