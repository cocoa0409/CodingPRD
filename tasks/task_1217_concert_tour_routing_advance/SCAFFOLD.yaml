    side_effects: []

  - method: GET
    path: "/tours/advance-packets/{packetId}"
    description: "Flat fetch of an AdvancePacket by id"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: AdvancePacket
    side_effects: []

  - method: GET
    path: "/tours/advance-packets"
    description: "Flat search: advance packets by show_id"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
