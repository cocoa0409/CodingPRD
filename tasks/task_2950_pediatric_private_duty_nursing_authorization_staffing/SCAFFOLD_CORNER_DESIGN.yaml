      - name: returned_plan_resubmission_loops_and_expires_the_pending_grant
        claim_type: Valid Transition
        grounds:
          - state_machines[PlanOfCare] UNDER_REVIEW -> RETURNED
          - state_machines[PlanOfCare] RETURNED -> SUBMITTED
          - entities.PlanOfCare.revision_round
          - complexity_profile.state_machine_shape
        distinguishing_aspect: >-
          The revision loop runs twice: each return increments revision_round (1 then 2) and expires
          the PENDING authorization written in that round, and each resubmission puts the plan back
          into SUBMITTED - the loop has no ceiling and never resurrects an expired grant.
