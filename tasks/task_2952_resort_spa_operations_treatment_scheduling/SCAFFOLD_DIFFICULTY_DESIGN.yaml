          - endpoints.POST_/certifications/{id}/revoke
          - endpoints.POST_/appointments/{id}/confirm
        distinguishing_aspect: |
          The appointment is untouched between the failing and the succeeding
          confirm: what changes is the state of a CertificationGrant hanging off
          a completely different aggregate (Therapist), reached only through
          TreatmentType.required_skill_code. Revoking the grant makes an already
          REQUESTED appointment unconfirmable, and re-granting at BASIC scope is
          still insufficient because SCOPE_RANK BASIC=1 < ADVANCED=2 — so the
          dependency is on the other entity's status AND its scope rank. The
          other instance in this rule depends on a fiscal aggregate instead.
