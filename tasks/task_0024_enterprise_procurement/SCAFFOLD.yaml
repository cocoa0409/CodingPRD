scenario: |
  Enterprise procurement approval system: requirement submission with category classification,
  specification and quantity, expected delivery date, budget account binding, and supporting
  attachment; supplier price comparison with qualified-supplier list filtering, multi-supplier
  quote collection, quote comparison table generation, technical-and-commercial scoring, and
  supplier selection justification; approval workflow with amount-tiered approval levels,
  department head/finance/legal/general manager multi-level routing, parallel and serial
  approval combination, delegation and timeout escalation, and rejection-rework handling;
  contract management with contract drafting, clause-template library, multi-party review,
  electronic signature, contract version control, and execution tracking; goods receipt and
  acceptance with delivery note matching, quantity verification, quality inspection, partial
  receipt handling, and rejection-and-return workflow; payment plan with payment terms
  (advance/on-delivery/net-N-days/installment), payment schedule generation, payment
  application, and payment execution; invoice three-way matching with PO/receipt/invoice
  cross-validation, quantity and amount tolerance rules, mismatch exception handling, and
  tax compliance check; event-driven synchronization with finance, ERP, banking, and
  electronic invoice systems; audit logging for approval actions and contract changes.

domain_name: enterprise-procurement
api_prefix: /procurement

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - version_pinning_on_approval
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: saga

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BudgetAccount
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique budget account code, e.g. BA-2026-IT-CAPEX"
        constraints: "unique; matches /^BA-[0-9]{4}-[A-Z]+-[A-Z]+$/"
      - name: department
        type: string
        source: input
        description: "Owning department name"
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year, e.g. 2026"
      - name: total_amount_cents
        type: integer
        source: input
        description: "Total annual allotment in cents"
        constraints: ">= 0"
      - name: committed_amount_cents
        type: integer
        source: computed
        description: "Sum of committed amounts from approved-but-not-yet-paid PurchaseOrders bound to this account"
        default: 0
      - name: spent_amount_cents
        type: integer
        source: computed
        description: "Sum of executed Payments charged to this account"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Account lifecycle"
        constraints: "values: ACTIVE, FROZEN, CLOSED"
        default: ACTIVE

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Supplier legal name"
        constraints: "unique"
      - name: tax_id
        type: string
        source: input
        description: "Supplier tax registration id"
        constraints: "unique"
      - name: qualification_status
        type: enum
        source: system
        description: "Supplier qualification status"
        constraints: "values: QUALIFIED, PROVISIONAL, BLACKLISTED"
        default: PROVISIONAL
      - name: qualification_categories
        type: array
        source: input
        description: "List of category codes the supplier is qualified to serve, e.g. ['IT_HARDWARE','IT_SOFTWARE']"
      - name: qualification_expires_at
        type: datetime
        source: input
        description: "Date after which qualification lapses; quotes after this date are rejected"
      - name: bank_account_id
        type: string
        source: input
        description: "Identifier returned by bank-system sync used for payment routing"
      - name: rating_avg
        type: number
        source: computed
        description: "Average of accepted-Receipt quality ratings, two decimals"
        default: 0

  - name: Requirement
    parent: null
    common_fields: true
    fields:
      - name: requester_id
        type: string
        source: system
        description: "X-User-ID of the Employee who created the requirement"
      - name: category
        type: enum
        source: input
        description: "Procurement category"
        constraints: "values: IT_HARDWARE, IT_SOFTWARE, OFFICE_SUPPLIES, PROFESSIONAL_SERVICES, MARKETING, CAPEX_EQUIPMENT"
      - name: specification
        type: string
        source: input
        description: "Free-form item specification"
      - name: quantity
        type: integer
        source: input
        description: "Requested quantity"
        constraints: ">= 1"
      - name: unit
        type: string
        source: input
        description: "Unit of measure, e.g. unit, license, hour"
      - name: expected_delivery_date
        type: datetime
        source: input
        description: "Date by which delivery is required"
        constraints: "must be >= created_at + 1 day"
      - name: budget_account_id
        type: string
        source: input
        description: "FK -> BudgetAccount.id"
      - name: estimated_unit_price_cents
        type: integer
        source: input
        description: "Requester-estimated price per unit in cents"
        constraints: ">= 0"
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "quantity * estimated_unit_price_cents"
      - name: attachment_uri
        type: string
        source: input
        description: "URI of supporting attachment (optional spec sheet, etc.)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Requirement lifecycle"
        constraints: "values: DRAFT, SUBMITTED, IN_SOURCING, AWARDED, IN_APPROVAL, APPROVED, REJECTED, CANCELLED"
        default: DRAFT
      - name: justification
        type: string
        source: input
        description: "Buyer's supplier-selection justification, captured at award time"
        default: null

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: requirement_id
        type: string
        source: input
        description: "FK -> Requirement.id"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Quoted price per unit"
        constraints: ">= 1"
      - name: lead_time_days
        type: integer
        source: input
        description: "Promised lead time in days"
        constraints: ">= 0"
      - name: technical_score
        type: number
        source: input
        description: "Technical evaluation score 0..100, two decimals"
        constraints: "0 <= x <= 100"
      - name: commercial_score
        type: number
        source: computed
        description: "Computed commercial score 0..100 derived from price normalization across the quote pool"
        default: 0
      - name: composite_score
        type: number
        source: computed
        description: "Final ranking score, two decimals, computed via weighted_scoring"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle"
        constraints: "values: SUBMITTED, SHORTLISTED, AWARDED, REJECTED, EXPIRED"
        default: SUBMITTED

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: requirement_id
        type: string
        source: system
        description: "FK -> Requirement.id"
      - name: awarded_quote_id
        type: string
        source: system
        description: "FK -> Quote.id; the awarded quote"
      - name: supplier_id
        type: string
        source: system
        description: "FK -> Supplier.id"
      - name: budget_account_id
        type: string
        source: system
        description: "Snapshot of Requirement.budget_account_id at PO creation"
      - name: total_amount_cents
        type: integer
        source: computed
        description: "Quote.unit_price_cents * Requirement.quantity, pinned at PO creation"
      - name: tier
        type: enum
        source: computed
        description: "Approval tier derived from total_amount_cents at PO creation"
        constraints: "values: TIER_1, TIER_2, TIER_3, TIER_4"
      - name: status
        type: enum
        source: system
        description: "PO lifecycle"
        constraints: "values: PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED, CONTRACTED, FULFILLED, CLOSED"
        default: PENDING_APPROVAL
      - name: approval_started_at
        type: datetime
        source: system
        description: "Timestamp when approval workflow was instantiated"
      - name: approved_at
        type: datetime
        source: system
        description: "Timestamp of final approval"
        default: null

  - name: ApprovalStep
    parent: PurchaseOrder
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "Step creation timestamp"
      - name: purchase_order_id
        type: string
        source: system
        description: "FK -> PurchaseOrder.id"
      - name: stage
        type: enum
        source: system
        description: "Approval stage"
        constraints: "values: DEPARTMENT_HEAD, FINANCE, LEGAL, GENERAL_MANAGER"
      - name: mode
        type: enum
        source: system
        description: "Whether this step runs in parallel with siblings or serially"
        constraints: "values: PARALLEL, SERIAL"
      - name: assignee_role
        type: enum
        source: system
        description: "Required role for the approver"
        constraints: "values: DepartmentHead, FinanceApprover, LegalApprover, GeneralManager"
      - name: assignee_user_id
        type: string
        source: system
        description: "Currently active assignee user id (may be a delegate)"
      - name: original_assignee_user_id
        type: string
        source: system
        description: "Original assignee before any delegation"
      - name: status
        type: enum
        source: system
        description: "Step lifecycle"
        constraints: "values: PENDING, APPROVED, REJECTED, ESCALATED, SKIPPED"
        default: PENDING
      - name: deadline_at
        type: datetime
        source: system
        description: "now() + 72h at step activation; used by timeout escalation"
      - name: decided_at
        type: datetime
        source: system
        description: "Timestamp of decision"
        default: null
      - name: decision_comment
        type: string
        source: input
        description: "Optional comment captured on approve/reject"
        default: null

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: "FK -> PurchaseOrder.id; one Contract per approved PO"
        constraints: "unique"
      - name: clause_template_ids
        type: array
        source: input
        description: "Ordered list of ClauseTemplate.id values composing the contract"
      - name: payment_terms_type
        type: enum
        source: input
        description: "Payment terms model"
        constraints: "values: ADVANCE, ON_DELIVERY, NET_N_DAYS, INSTALLMENT"
      - name: payment_terms_params
        type: object
        source: input
        description: "Term-specific params: e.g. {net_days:30} for NET_N_DAYS, {schedule:[{percent:30,offset_days:0},{percent:70,offset_days:30}]} for INSTALLMENT"
      - name: parties_required
        type: array
        source: input
        description: "Roles that must sign, e.g. ['Buyer','Supplier']"
      - name: signatures
        type: array
        source: system
        description: "List of {role, user_id, signed_at, signature_ref} entries"
        default: []
      - name: current_version
        type: integer
        source: system
        description: "Active contract version number"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle"
        constraints: "values: DRAFTING, IN_REVIEW, AWAITING_SIGNATURE, EXECUTED, AMENDED, TERMINATED"
        default: DRAFTING

  - name: ContractVersion
    parent: Contract
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "Version snapshot timestamp"
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id"
      - name: version_number
        type: integer
        source: system
        description: "Sequential version number starting at 1"
      - name: clause_template_ids_snapshot
        type: array
        source: system
        description: "Snapshot of clause_template_ids at this version"
      - name: payment_terms_snapshot
        type: object
        source: system
        description: "Snapshot of payment_terms_type + payment_terms_params at this version"
      - name: change_reason
        type: string
        source: input
        description: "Reason captured when a new version is created"

  - name: ClauseTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Clause code"
        constraints: "unique"
      - name: title
        type: string
        source: input
        description: "Clause title"
      - name: body
        type: string
        source: input
        description: "Clause body text"
      - name: category
        type: enum
        source: input
        description: "Clause category"
        constraints: "values: PAYMENT, DELIVERY, WARRANTY, IP, CONFIDENTIALITY, TERMINATION"
      - name: is_active
        type: boolean
        source: system
        description: "Whether the template is currently selectable"
        default: true

  - name: Receipt
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: "FK -> PurchaseOrder.id"
      - name: delivery_note_no
        type: string
        source: input
        description: "Supplier-provided delivery note number"
      - name: received_quantity
        type: integer
        source: input
        description: "Quantity stated on the delivery note"
        constraints: ">= 1"
      - name: accepted_quantity
        type: integer
        source: input
        description: "Quantity accepted after inspection; <= received_quantity"
        constraints: ">= 0"
      - name: rejected_quantity
        type: integer
        source: computed
        description: "received_quantity - accepted_quantity"
      - name: quality_rating
        type: number
        source: input
        description: "Quality inspection rating 0..100"
        constraints: "0 <= x <= 100"
      - name: status
        type: enum
        source: system
        description: "Receipt lifecycle"
        constraints: "values: DRAFT, INSPECTING, ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, RETURNED"
        default: DRAFT
      - name: cumulative_accepted_after
        type: integer
        source: computed
        description: "Snapshot of sum(Receipt.accepted_quantity) for this PO including this receipt; pinned at ACCEPTED"

  - name: PaymentSchedule
    parent: PurchaseOrder
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "Schedule generation timestamp"
      - name: purchase_order_id
        type: string
        source: system
        description: "FK -> PurchaseOrder.id"
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id"
      - name: installment_no
        type: integer
        source: system
        description: "1-based ordinal of installment (1 for ADVANCE/ON_DELIVERY/NET_N_DAYS)"
      - name: due_date
        type: datetime
        source: system
        description: "Computed due date per payment_terms"
      - name: amount_cents
        type: integer
        source: system
        description: "Computed installment amount; sum across installments equals PO.total_amount_cents"
      - name: status
        type: enum
        source: system
        description: "Schedule entry lifecycle"
        constraints: "values: PENDING, APPLIED, EXECUTED, CANCELLED"
        default: PENDING

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: payment_schedule_id
        type: string
        source: input
        description: "FK -> PaymentSchedule.id"
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; required to execute"
      - name: amount_cents
        type: integer
        source: computed
        description: "Mirrors PaymentSchedule.amount_cents at application; immutable thereafter"
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle"
        constraints: "values: APPLIED, APPROVED, EXECUTED, FAILED, CANCELLED"
        default: APPLIED
      - name: bank_reference
        type: string
        source: system
        description: "Reference returned by bank sync on EXECUTED"
        default: null

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: purchase_order_id
        type: string
        source: input
        description: "FK -> PurchaseOrder.id"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; must match PO.supplier_id"
      - name: invoice_no
        type: string
        source: input
        description: "Supplier invoice number"
        constraints: "unique per supplier_id"
      - name: invoice_date
        type: datetime
        source: input
        description: "Invoice issue date"
      - name: invoiced_quantity
        type: integer
        source: input
        description: "Quantity billed on the invoice"
        constraints: ">= 1"
      - name: invoiced_amount_cents
        type: integer
        source: input
        description: "Amount billed on the invoice"
        constraints: ">= 1"
      - name: tax_amount_cents
        type: integer
        source: input
        description: "Tax amount included; tax_rate = tax_amount_cents / (invoiced_amount_cents - tax_amount_cents)"
        constraints: ">= 0"
      - name: tax_rate_declared
        type: number
        source: input
        description: "Declared tax rate (e.g. 0.13)"
        constraints: "0 <= x <= 1"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle"
        constraints: "values: SUBMITTED, MATCHED, EXCEPTION, REJECTED, APPROVED, PAID"
        default: SUBMITTED
      - name: matching_result
        type: object
        source: computed
        description: "Output of three-way match: {quantity_match,amount_match,tax_compliant,deltas:{...}}"
        default: null

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID"
      - name: created_at
        type: datetime
        source: system
        description: "Append timestamp"
      - name: actor_user_id
        type: string
        source: system
        description: "User id from X-User-ID"
      - name: actor_role
        type: string
        source: system
        description: "Role from X-User-Role"
      - name: action
        type: enum
        source: system
        description: "Audited action"
        constraints: "values: APPROVAL_STEP_APPROVE, APPROVAL_STEP_REJECT, APPROVAL_STEP_DELEGATE, APPROVAL_STEP_ESCALATE, CONTRACT_VERSION_CREATED, CONTRACT_SIGNED, CONTRACT_AMENDED"
      - name: entity_type
        type: string
        source: system
        description: "Audited entity type, e.g. ApprovalStep, Contract"
      - name: entity_id
        type: string
        source: system
        description: "Audited entity id"
      - name: payload
        type: object
        source: system
        description: "Action-specific payload (e.g. {from_user, to_user, reason})"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Requirement
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /requirements/{id}/submit"
        actor: Requester
        preconditions:
          - "Requirement.budget_account_id exists and BudgetAccount.status == ACTIVE"
          - "Requirement.expected_delivery_date >= now() + 1 day"
        side_effects:
          - "AuditLogEntry not created (only approval/contract actions audited)"
      - from: SUBMITTED
        to: IN_SOURCING
        trigger: "POST /requirements/{id}/quotes (first qualifying quote)"
        actor: Buyer
        preconditions:
          - "Supplier.qualification_status == QUALIFIED"
          - "Requirement.category in Supplier.qualification_categories"
          - "Supplier.qualification_expires_at > now()"
        side_effects:
          - "Quote created in SUBMITTED"
      - from: IN_SOURCING
        to: AWARDED
        trigger: "POST /requirements/{id}/award"
        actor: Buyer
        preconditions:
          - "At least 3 Quotes in SHORTLISTED on this Requirement"
          - "Awarded Quote.id is among the SHORTLISTED set"
          - "Requirement.justification is non-empty"
        side_effects:
          - "Awarded Quote -> AWARDED; non-awarded SHORTLISTED quotes -> REJECTED"
          - "PurchaseOrder created in PENDING_APPROVAL with total_amount_cents = quote.unit_price_cents * requirement.quantity"
          - "PurchaseOrder.tier computed from total_amount_cents (calc: po_tier_assignment)"
          - "BudgetAccount.committed_amount_cents += PurchaseOrder.total_amount_cents (calc: budget_commitment)"
          - "ApprovalStep records generated per po_tier_assignment routing"
          - "Requirement -> IN_APPROVAL"
      - from: IN_APPROVAL
        to: APPROVED
        trigger: "Last ApprovalStep transitions to APPROVED"
        actor: system
        preconditions:
          - "All ApprovalStep records on the PO are in {APPROVED, SKIPPED}"
        side_effects:
          - "PurchaseOrder -> APPROVED; PurchaseOrder.approved_at = now()"
      - from: IN_APPROVAL
        to: REJECTED
        trigger: "Any ApprovalStep transitions to REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "PurchaseOrder -> REJECTED"
          - "BudgetAccount.committed_amount_cents -= PurchaseOrder.total_amount_cents (compensating release)"
          - "All other ApprovalStep records on the PO -> SKIPPED"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /requirements/{id}/rework"
        actor: Requester
        preconditions:
          - "Requirement.status == REJECTED"
        side_effects:
          - "Requirement.justification cleared; quotes on this requirement remain in REJECTED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /requirements/{id}/cancel"
        actor: Requester
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /requirements/{id}/cancel"
        actor: Requester
        preconditions: []
        side_effects: []

  - entity: Quote
    initial_state: SUBMITTED
    terminal_states: [AWARDED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /requirements/{id}/shortlist"
        actor: Buyer
        preconditions:
          - "Quote.composite_score has been computed (calc: quote_composite_score)"
          - "Supplier.qualification_status == QUALIFIED at shortlist time"
        side_effects:
          - "Quote.composite_score recomputed across the SUBMITTED pool (commercial scoring is pool-relative)"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /_clock/advance crosses Supplier.qualification_expires_at"
        actor: system
        preconditions:
          - "Supplier.qualification_expires_at <= now()"
        side_effects: []
      - from: SHORTLISTED
        to: AWARDED
        trigger: "POST /requirements/{id}/award"
        actor: Buyer
        preconditions: []
        side_effects:
          - "Triggers PurchaseOrder creation (see Requirement IN_SOURCING -> AWARDED)"
      - from: SHORTLISTED
        to: REJECTED
        trigger: "Sibling Quote awarded on the same Requirement"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PurchaseOrder
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, CANCELLED, CLOSED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "All ApprovalStep records APPROVED/SKIPPED"
        actor: system
        preconditions: []
        side_effects:
          - "Requirement -> APPROVED"
          - "PaymentSchedule[] generated per Contract.payment_terms (deferred until Contract is EXECUTED, but PO is approved)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "Any ApprovalStep REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "BudgetAccount.committed_amount_cents -= total_amount_cents"
          - "Requirement -> REJECTED"
      - from: APPROVED
        to: CONTRACTED
        trigger: "Contract -> EXECUTED"
        actor: system
        preconditions:
          - "Contract.status == EXECUTED for this PO"
        side_effects:
          - "PaymentSchedule[] entries become eligible for payment application"
      - from: CONTRACTED
        to: FULFILLED
        trigger: "Cumulative Receipt.accepted_quantity reaches Requirement.quantity"
        actor: system
        preconditions:
          - "sum(Receipt.accepted_quantity where status in {ACCEPTED,PARTIALLY_ACCEPTED}) == Requirement.quantity"
        side_effects: []
      - from: FULFILLED
        to: CLOSED
        trigger: "All PaymentSchedule entries EXECUTED and all Invoices APPROVED or PAID"
        actor: system
        preconditions:
          - "every PaymentSchedule.status in {EXECUTED,CANCELLED}"
          - "every Invoice for this PO in {APPROVED, PAID}"
        side_effects:
          - "BudgetAccount.spent_amount_cents += sum(executed Payment amounts)"
          - "BudgetAccount.committed_amount_cents -= total_amount_cents (release residual commitment)"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: Buyer
        preconditions:
          - "No ApprovalStep on this PO has decided_at set"
        side_effects:
          - "BudgetAccount.committed_amount_cents -= total_amount_cents"
          - "All ApprovalStep -> SKIPPED"

  - entity: ApprovalStep
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, SKIPPED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /approval-steps/{id}/approve"
        actor: ApproverRole
        preconditions:
          - "step.assignee_user_id == X-User-ID OR delegate chain matches"
          - "step.deadline_at > now()"
          - "If mode == SERIAL: every preceding SERIAL ApprovalStep on the same PO is in {APPROVED,SKIPPED}"
          - "Segregation of duties: no other ApprovalStep on the same PO has been decided by this user_id"
        side_effects:
          - "AuditLogEntry(action=APPROVAL_STEP_APPROVE) appended"
          - "If this is the last PENDING step on the PO -> PurchaseOrder -> APPROVED (cascade)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-steps/{id}/reject"
        actor: ApproverRole
        preconditions:
          - "step.assignee_user_id == X-User-ID OR delegate chain matches"
          - "step.deadline_at > now()"
        side_effects:
          - "AuditLogEntry(action=APPROVAL_STEP_REJECT) appended"
          - "PurchaseOrder -> REJECTED (cascade)"
          - "All other PENDING ApprovalStep on the PO -> SKIPPED"
      - from: PENDING
        to: PENDING
        trigger: "POST /approval-steps/{id}/delegate"
        actor: ApproverRole
        preconditions:
          - "step.assignee_user_id == X-User-ID"
          - "delegate target user has a User record with the same assignee_role"
        side_effects:
          - "step.assignee_user_id := delegate.target_user_id (original_assignee_user_id preserved)"
          - "AuditLogEntry(action=APPROVAL_STEP_DELEGATE) appended"
      - from: PENDING
        to: ESCALATED
        trigger: "POST /_clock/advance crosses step.deadline_at"
        actor: system
        preconditions:
          - "step.deadline_at <= now()"
        side_effects:
          - "step.assignee_user_id := the GeneralManager user (or escalation target by stage routing)"
          - "step.deadline_at := now() + 24h (escalation extension)"
          - "AuditLogEntry(action=APPROVAL_STEP_ESCALATE) appended"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /approval-steps/{id}/approve"
        actor: GeneralManager
        preconditions:
          - "X-User-Role == GeneralManager"
        side_effects:
          - "Same approval cascade as PENDING -> APPROVED"
      - from: ESCALATED
        to: REJECTED
        trigger: "POST /approval-steps/{id}/reject"
        actor: GeneralManager
        preconditions:
          - "X-User-Role == GeneralManager"
        side_effects:
          - "Same rejection cascade as PENDING -> REJECTED"
      - from: PENDING
        to: SKIPPED
        trigger: "Sibling step transitions to REJECTED, or PO cancelled"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: DRAFTING
    terminal_states: [EXECUTED, TERMINATED]
    transitions:
      - from: DRAFTING
        to: IN_REVIEW
        trigger: "POST /contracts/{id}/submit-for-review"
        actor: Buyer
        preconditions:
          - "PurchaseOrder.status == APPROVED"
          - "Contract.clause_template_ids non-empty; every referenced ClauseTemplate.is_active == true"
        side_effects:
          - "ContractVersion snapshot v1 created if none exists"
      - from: IN_REVIEW
        to: AWAITING_SIGNATURE
        trigger: "POST /contracts/{id}/finalize-review"
        actor: LegalApprover
        preconditions:
          - "X-User-Role == LegalApprover"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFTING
        trigger: "POST /contracts/{id}/amend"
        actor: Buyer
        preconditions:
          - "Contract.status == IN_REVIEW"
          - "amend body provides change_reason"
        side_effects:
          - "Contract.current_version += 1; new ContractVersion snapshot appended"
          - "AuditLogEntry(action=CONTRACT_AMENDED) appended"
      - from: AWAITING_SIGNATURE
        to: EXECUTED
        trigger: "POST /contracts/{id}/sign (final required signature)"
        actor: Buyer | Supplier
        preconditions:
          - "All parties_required have a corresponding signature entry after this call"
        side_effects:
          - "AuditLogEntry(action=CONTRACT_SIGNED) appended (one per signature)"
          - "PurchaseOrder -> CONTRACTED (cascade)"
          - "PaymentSchedule[] generated per payment_terms (calc: payment_schedule_generation)"
      - from: AWAITING_SIGNATURE
        to: DRAFTING
        trigger: "POST /contracts/{id}/amend"
        actor: Buyer
        preconditions:
          - "No signatures collected yet OR all collected signatures invalidated by amendment"
        side_effects:
          - "Contract.current_version += 1; signatures cleared"
          - "AuditLogEntry(action=CONTRACT_AMENDED) appended"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: GeneralManager
        preconditions:
          - "PurchaseOrder.status in {CONTRACTED, FULFILLED}"
        side_effects:
          - "All PENDING PaymentSchedule -> CANCELLED"
          - "BudgetAccount.committed_amount_cents -= unpaid_balance"

  - entity: Receipt
    initial_state: DRAFT
    terminal_states: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, RETURNED]
    transitions:
      - from: DRAFT
        to: INSPECTING
        trigger: "POST /receipts/{id}/inspect"
        actor: Inspector
        preconditions:
          - "PurchaseOrder.status == CONTRACTED"
          - "Receipt.delivery_note_no matches a delivery_note_no recorded against this PO via supplier sync"
        side_effects: []
      - from: INSPECTING
        to: ACCEPTED
        trigger: "POST /receipts/{id}/accept"
        actor: Inspector
        preconditions:
          - "Receipt.accepted_quantity == Receipt.received_quantity"
          - "Receipt.quality_rating >= 60"
          - "cumulative_accepted_after <= Requirement.quantity"
        side_effects:
          - "Receipt.cumulative_accepted_after := sum(prior accepted) + accepted_quantity"
          - "If cumulative_accepted_after == Requirement.quantity: PurchaseOrder -> FULFILLED"
          - "Supplier.rating_avg recomputed (calc: supplier_rating_avg)"
      - from: INSPECTING
        to: PARTIALLY_ACCEPTED
        trigger: "POST /receipts/{id}/accept"
        actor: Inspector
        preconditions:
          - "0 < Receipt.accepted_quantity < Receipt.received_quantity"
          - "Receipt.quality_rating >= 60"
        side_effects:
          - "Same cumulative tracking as ACCEPTED"
      - from: INSPECTING
        to: REJECTED
        trigger: "POST /receipts/{id}/reject"
        actor: Inspector
        preconditions:
          - "Receipt.accepted_quantity == 0 OR Receipt.quality_rating < 60"
        side_effects: []
      - from: REJECTED
        to: RETURNED
        trigger: "POST /receipts/{id}/return"
        actor: Inspector
        preconditions:
          - "Receipt.status == REJECTED"
        side_effects: []

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: MATCHED
        trigger: "POST /invoices/{id}/match"
        actor: FinanceApprover
        preconditions:
          - "Invoice.purchase_order_id PO is in {CONTRACTED, FULFILLED}"
          - "Three-way match passes (calc: three_way_match)"
        side_effects:
          - "Invoice.matching_result populated"
      - from: SUBMITTED
        to: EXCEPTION
        trigger: "POST /invoices/{id}/match"
        actor: FinanceApprover
        preconditions:
          - "Three-way match fails (calc: three_way_match)"
        side_effects:
          - "Invoice.matching_result populated with deltas"
      - from: EXCEPTION
        to: REJECTED
        trigger: "POST /invoices/{id}/reject"
        actor: FinanceApprover
        preconditions: []
        side_effects: []
      - from: EXCEPTION
        to: MATCHED
        trigger: "POST /invoices/{id}/override"
        actor: GeneralManager
        preconditions:
          - "X-User-Role == GeneralManager"
          - "override body provides justification"
        side_effects: []
      - from: MATCHED
        to: APPROVED
        trigger: "POST /invoices/{id}/approve"
        actor: FinanceApprover
        preconditions:
          - "Invoice.matching_result.tax_compliant == true"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "All Payment(s) bound to this Invoice are EXECUTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Payment
    initial_state: APPLIED
    terminal_states: [EXECUTED, FAILED, CANCELLED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /payments/{id}/approve"
        actor: FinanceApprover
        preconditions:
          - "Invoice.status == APPROVED"
          - "PaymentSchedule.status == APPLIED"
          - "Segregation of duties: the FinanceApprover that approved this payment must not be the same user who approved any ApprovalStep on the parent PO"
        side_effects:
          - "PaymentSchedule.status -> APPLIED (already)"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /payments/{id}/execute"
        actor: system
        preconditions:
          - "Invoice.status == APPROVED"
        side_effects:
          - "Payment.bank_reference set; PaymentSchedule.status -> EXECUTED"
          - "BudgetAccount.spent_amount_cents += amount_cents"
          - "BudgetAccount.committed_amount_cents -= amount_cents"
      - from: APPLIED
        to: CANCELLED
        trigger: "POST /payments/{id}/cancel"
        actor: FinanceApprover
        preconditions: []
        side_effects:
          - "PaymentSchedule.status -> PENDING"
      - from: APPROVED
        to: FAILED
        trigger: "POST /payments/{id}/execute (bank sync error)"
        actor: system
        preconditions: []
        side_effects:
          - "PaymentSchedule.status -> APPLIED (re-applicable)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two approvers approve the same ApprovalStep simultaneously"
    guarantee: "Exactly one decision is recorded; second loses"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ApprovalStep.status flip from PENDING to APPROVED"

  - scenario: "Approve and reject hit the same ApprovalStep simultaneously"
    guarantee: "Exactly one operation succeeds; loser is rejected as the step is no longer PENDING"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ApprovalStep.status"

  - scenario: "Two awards on the same Requirement at the same instant"
    guarantee: "At most one PurchaseOrder is created per Requirement; second award rejected"
    error_id: ERR_REQUIREMENT_ALREADY_AWARDED
    http_status: 409
    serialization: "First-writer-wins on Requirement.status flip from IN_SOURCING to AWARDED"

  - scenario: "Two contracts attempted on the same PurchaseOrder"
    guarantee: "PurchaseOrder.id is unique on Contract; second creation rejected"
    error_id: ERR_CONTRACT_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique index on Contract.purchase_order_id"

  - scenario: "Two payments applied against the same PaymentSchedule entry"
    guarantee: "At most one Payment per PaymentSchedule; second application rejected"
    error_id: ERR_PAYMENT_ALREADY_APPLIED
    http_status: 409
    serialization: "First-writer-wins on PaymentSchedule.status flip from PENDING to APPLIED"

  - scenario: "Two parallel commitments push BudgetAccount.committed_amount_cents past total_amount_cents"
    guarantee: "Second commitment that would exceed remaining budget is rejected"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 422
    serialization: "Compare-and-swap on BudgetAccount.committed_amount_cents at commitment time"

  - scenario: "Two signatures collected on the same Contract from the same role simultaneously"
    guarantee: "At most one signature per (contract_id, role); second rejected"
    error_id: ERR_SIGNATURE_ALREADY_COLLECTED
    http_status: 409
    serialization: "Unique index on (Contract.id, signature.role)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: po_tier_assignment
    trigger: "Requirement IN_SOURCING -> AWARDED (PO creation)"
    algorithm: threshold
    formula: |
      total = quote.unit_price_cents * requirement.quantity
      if total <  TIER1_MAX_CENTS:                tier = TIER_1
      elif total < TIER2_MAX_CENTS:               tier = TIER_2
      elif total < TIER3_MAX_CENTS:               tier = TIER_3
      else:                                       tier = TIER_4

      # Routing per tier (drives ApprovalStep records, all serial unless noted):
      TIER_1: [DEPARTMENT_HEAD]                                   # serial chain length 1
      TIER_2: [DEPARTMENT_HEAD, FINANCE]                          # serial
      TIER_3: [DEPARTMENT_HEAD, {FINANCE | LEGAL parallel}, GENERAL_MANAGER]
              # FINANCE and LEGAL run in PARALLEL; GM runs after both parallel steps complete
      TIER_4: [DEPARTMENT_HEAD, {FINANCE | LEGAL parallel}, GENERAL_MANAGER]
              # same shape as TIER_3 but GM step requires step.decision_comment non-empty
    input_set: "PO.total_amount_cents using values pinned at award time"
    constants:
      TIER1_MAX_CENTS: 500000        # < $5,000
      TIER2_MAX_CENTS: 5000000       # < $50,000
      TIER3_MAX_CENTS: 50000000      # < $500,000
      # >= TIER3_MAX_CENTS -> TIER_4
    precision: "integer cents"
    variants:
      - name: tier_3_parallel_routing
        when: "tier == TIER_3"
        difference: "FINANCE and LEGAL ApprovalStep records run in PARALLEL; both must approve before GM step activates"
      - name: tier_4_parallel_routing_with_gm_comment
        when: "tier == TIER_4"
        difference: "Same parallel shape as tier_3; GM step.decision_comment is required"

  - name: quote_composite_score
    trigger: "POST /requirements/{id}/shortlist OR POST /quotes (with full pool present)"
    algorithm: weighted_scoring
    formula: |
      # Pool-relative commercial scoring (ALL formula inputs in integer cents):
      let pool = Quotes on this Requirement with status == SUBMITTED
      min_price = min(q.unit_price_cents for q in pool)
      max_price = max(q.unit_price_cents for q in pool)
      for q in pool:
        if max_price == min_price:
          q.commercial_score = 100.00
        else:
          q.commercial_score = round( (max_price - q.unit_price_cents) / (max_price - min_price) * 100, 2 )
      # Composite weighted score (rounding pinned: round AFTER weighted sum, not per term):
      W_TECH = 0.40
      W_COMM = 0.60
      q.composite_score = round( q.technical_score * W_TECH + q.commercial_score * W_COMM, 2 )
    input_set: "All Quotes in SUBMITTED state on the same Requirement (EXPIRED quotes excluded)"
    constants:
      W_TECH: 0.40
      W_COMM: 0.60
    precision: "2 decimal places, round_half_up; rounding applied AFTER the weighted sum, not per term"
    variants:
      - name: pool_relative
        when: "Triggered by /shortlist with full pool present"
        difference: "Uses min/max across the full SUBMITTED pool"
      - name: incremental_recompute
        when: "Triggered by a new Quote submission while the pool already contains SUBMITTED quotes"
        difference: "Recomputed across the pool — previously-stored composite_score values on sibling quotes are overwritten in place"

  - name: payment_schedule_generation
    trigger: "Contract -> EXECUTED"
    algorithm: waterfall_allocation
    formula: |
      total = PurchaseOrder.total_amount_cents
      now = Contract.updated_at_at_execution
      delivery_due = Requirement.expected_delivery_date

      if Contract.payment_terms_type == ADVANCE:
        schedule = [{installment_no:1, amount_cents:total, due_date:now}]
      elif Contract.payment_terms_type == ON_DELIVERY:
        schedule = [{installment_no:1, amount_cents:total, due_date:delivery_due}]
      elif Contract.payment_terms_type == NET_N_DAYS:
        N = payment_terms_params.net_days
        schedule = [{installment_no:1, amount_cents:total, due_date:delivery_due + N days}]
      elif Contract.payment_terms_type == INSTALLMENT:
        # payment_terms_params.schedule = [{percent:30,offset_days:0},...] sum(percent)==100
        # ROUNDING ORDER (PINNED): allocate floor((total*percent)/100) to each installment
        # in declared order, then put the remainder cents into the LAST installment.
        running_alloc = 0
        for i, item in enumerate(params.schedule):
          if i < len(params.schedule)-1:
            amt = (total * item.percent) // 100      # integer floor
          else:
            amt = total - running_alloc              # last gets remainder
          due = now + item.offset_days
          schedule.append({installment_no:i+1, amount_cents:amt, due_date:due})
          running_alloc += amt
      assert sum(s.amount_cents for s in schedule) == total
    input_set: "PurchaseOrder.total_amount_cents pinned at PO creation, Requirement.expected_delivery_date pinned at requirement submission"
    constants: {}
    precision: "integer cents; remainder pinned to LAST installment"
    variants:
      - name: cents_remainder_last
        when: "INSTALLMENT terms and total*percent does not divide cleanly by 100"
        difference: "Floor each installment except the last; LAST installment absorbs the cents remainder so sum equals PO.total_amount_cents"

  - name: three_way_match
    trigger: "POST /invoices/{id}/match"
    algorithm: threshold
    formula: |
      po = PurchaseOrder(invoice.purchase_order_id)
      receipts = Receipts(po) where status in {ACCEPTED, PARTIALLY_ACCEPTED}
      received_qty = sum(r.accepted_quantity for r in receipts)
      received_amt = received_qty * po.total_amount_cents / requirement.quantity   # pro-rata

      qty_delta_pct = abs(invoice.invoiced_quantity - received_qty) / received_qty
      amt_delta_pct = abs(invoice.invoiced_amount_cents - received_amt) / received_amt
      tax_expected = round(invoice.invoiced_amount_cents - invoice.invoiced_amount_cents/(1+invoice.tax_rate_declared))
      tax_delta_cents = abs(invoice.tax_amount_cents - tax_expected)

      quantity_match = qty_delta_pct <= QTY_TOLERANCE_PCT
      amount_match   = amt_delta_pct <= AMT_TOLERANCE_PCT
      tax_compliant  = tax_delta_cents <= TAX_TOLERANCE_CENTS AND invoice.tax_rate_declared in {0.06, 0.09, 0.13}
      pass = quantity_match AND amount_match AND tax_compliant
    input_set: "Receipts on PO with status in {ACCEPTED, PARTIALLY_ACCEPTED}; DRAFT/INSPECTING/REJECTED/RETURNED receipts excluded"
    constants:
      QTY_TOLERANCE_PCT: 0.02         # 2%
      AMT_TOLERANCE_PCT: 0.01         # 1%
      TAX_TOLERANCE_CENTS: 1
      ALLOWED_TAX_RATES: [0.06, 0.09, 0.13]
    precision: "tax_expected rounded round_half_up to integer cents"
    variants:
      - name: strict_match_finance
        when: "Triggered by FinanceApprover via /invoices/{id}/match"
        difference: "Strict thresholds; failure puts invoice in EXCEPTION"
      - name: gm_override_match
        when: "Triggered by GM via /invoices/{id}/override on an EXCEPTION invoice"
        difference: "Bypasses thresholds; sets matching_result.override_by and forces matched=true; GeneralManager justification required"

  - name: budget_commitment
    trigger: "Requirement IN_SOURCING -> AWARDED (PO created); compensating release on PO REJECTED/CANCELLED/CLOSED"
    algorithm: aggregation
    formula: |
      # Forward action:
      BudgetAccount.committed_amount_cents += PurchaseOrder.total_amount_cents
      # Compensating action on REJECTED/CANCELLED:
      BudgetAccount.committed_amount_cents -= PurchaseOrder.total_amount_cents
      # On Payment EXECUTED:
      BudgetAccount.committed_amount_cents -= Payment.amount_cents
      BudgetAccount.spent_amount_cents     += Payment.amount_cents
      # On PO CLOSED:
      BudgetAccount.committed_amount_cents -= residual = total_amount_cents - sum(executed Payment amounts)
      # Invariant (conserved quantity):
      committed_amount_cents == sum(PO.total_amount_cents for PO in {APPROVED, CONTRACTED, FULFILLED})
                              - sum(Payment.amount_cents for Payment in {EXECUTED})
    input_set: "PurchaseOrders bound to this BudgetAccount in non-terminal-financial states; executed Payments"
    constants: {}
    precision: "integer cents"

  - name: supplier_rating_avg
    trigger: "Receipt -> ACCEPTED OR PARTIALLY_ACCEPTED"
    algorithm: aggregation
    formula: |
      Supplier.rating_avg = round(
        sum(r.quality_rating for r in Receipts of this supplier where status in {ACCEPTED, PARTIALLY_ACCEPTED})
        / count(those receipts), 2)
    input_set: "Receipts in {ACCEPTED, PARTIALLY_ACCEPTED}; DRAFT/INSPECTING/REJECTED/RETURNED excluded"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (priority ascending = checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is recognized; user record exists for entity-backed roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-parameter resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "Acting role is allowed by RBAC for this endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "On Quote create: Supplier.qualification_status == QUALIFIED, Requirement.category in Supplier.qualification_categories, Supplier.qualification_expires_at > now()"
    error_id: ERR_SUPPLIER_NOT_QUALIFIED
    http_status: 422
    applies_to: ["POST /requirements/{id}/quotes"]

  - priority: 7
    category: business_safety
    check: "Segregation of duties: same user_id may not appear as decider on more than one ApprovalStep of the same PurchaseOrder"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /approval-steps/{id}/approve", "POST /approval-steps/{id}/reject"]

  - priority: 8
    category: business_safety
    check: "Segregation of duties: a user who decided any ApprovalStep on a PO may not be the FinanceApprover that approves a Payment for that PO"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /payments/{id}/approve"]

  - priority: 9
    category: business_temporal
    check: "Approval step.deadline_at > now()"
    error_id: ERR_APPROVAL_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /approval-steps/{id}/approve", "POST /approval-steps/{id}/reject", "POST /approval-steps/{id}/delegate"]

  - priority: 10
    category: business_constraint
    check: "On serial ApprovalStep approve: every preceding SERIAL step on the same PO is in {APPROVED, SKIPPED}"
    error_id: ERR_PREDECESSOR_NOT_DECIDED
    http_status: 409
    applies_to: ["POST /approval-steps/{id}/approve"]

  - priority: 11
    category: business_constraint
    check: "On Requirement award: at least 3 Quotes on the Requirement are in SHORTLISTED; awarded quote_id is among them; Requirement.justification non-empty"
    error_id: ERR_INSUFFICIENT_QUOTES
    http_status: 422
    applies_to: ["POST /requirements/{id}/award"]

  - priority: 12
    category: business_referential
    check: "On Receipt accept: Receipt.delivery_note_no matches an entry in PO.delivery_notes received via supplier sync; receipt's accepted_quantity <= received_quantity"
    error_id: ERR_DELIVERY_NOTE_MISMATCH
    http_status: 422
    applies_to: ["POST /receipts/{id}/inspect", "POST /receipts/{id}/accept"]

  - priority: 13
    category: business_constraint
    check: "On Receipt accept: cumulative accepted across all Receipts on the PO must not exceed Requirement.quantity"
    error_id: ERR_OVER_RECEIPT
    http_status: 422
    applies_to: ["POST /receipts/{id}/accept"]

  - priority: 14
    category: business_fiscal
    check: "On PO creation (award): BudgetAccount.committed_amount_cents + PO.total_amount_cents <= BudgetAccount.total_amount_cents"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 422
    applies_to: ["POST /requirements/{id}/award"]

  - priority: 15
    category: business_fiscal
    check: "On three-way match: tax_rate_declared in ALLOWED_TAX_RATES; tax_amount_cents within TAX_TOLERANCE_CENTS of computed tax_expected"
    error_id: ERR_TAX_NONCOMPLIANT
    http_status: 422
    applies_to: ["POST /invoices/{id}/match"]

  - priority: 16
    category: business_fiscal
    check: "Invoice three-way match: |invoiced_quantity - received_quantity| / received_quantity <= QTY_TOLERANCE_PCT and |invoiced_amount - pro_rata_received_amount| / pro_rata_received_amount <= AMT_TOLERANCE_PCT"
    error_id: ERR_THREE_WAY_MATCH_FAILED
    http_status: 422
    applies_to: ["POST /invoices/{id}/match"]

  - priority: 17
    category: business_temporal
    check: "Requirement.expected_delivery_date >= created_at + 1 day"
    error_id: ERR_DELIVERY_DATE_TOO_EARLY
    http_status: 422
    applies_to: ["POST /requirements", "PATCH /requirements/{id}"]

  - priority: 18
    category: business_constraint
    check: "Optimistic concurrency: PATCH/mutations supply matching version when supplied"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints accepting version?"

  - priority: 19
    category: business_constraint
    check: "Pagination params within [1,100] for limit, >= 0 for offset"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 20
    category: business_constraint
    check: "Schema/type validation on inputs (required fields present, enum values valid)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving endpoints (required for testability-completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the test clock to the supplied ISO datetime; runs deadline-escalation and quote-expiry sweep"
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: object
    side_effects:
      - "ApprovalStep with deadline_at <= now() and status==PENDING -> ESCALATED"
      - "Quote with Supplier.qualification_expires_at <= now() and status==SUBMITTED -> EXPIRED"

  - method: POST
    path: "/_events/supplier-delivery"
    description: "Simulate supplier delivery-note event; records delivery_note_no against a PO so receipts can match"
    roles: [PlatformAdmin]
    code: 201
    input: [purchase_order_id, delivery_note_no, declared_quantity]
    output: object
    side_effects: []

  # --- BudgetAccount ---
  - method: POST
    path: "/budget-accounts"
    description: "Create a budget account"
    roles: [FinanceApprover]
    code: 201
    input: [code, department, fiscal_year, total_amount_cents]
    output: BudgetAccount
    side_effects: []

  - method: GET
    path: "/budget-accounts/{id}"
    description: "Retrieve a budget account"
    roles: [FinanceApprover, Buyer, Requester, DepartmentHead, GeneralManager]
    code: 200
    input: []
    output: BudgetAccount
    side_effects: []

  - method: GET
    path: "/budget-accounts"
    description: "List budget accounts with filters"
    roles: [FinanceApprover, Buyer, Requester, DepartmentHead, GeneralManager]
    code: 200
    input: ["department?", "fiscal_year?", "status?", "limit?", "offset?"]
    output: BudgetAccount[]
    side_effects: []

  # --- Supplier ---
  - method: POST
    path: "/suppliers"
    description: "Register a supplier (provisional)"
    roles: [Buyer]
    code: 201
    input: [legal_name, tax_id, qualification_categories, qualification_expires_at, bank_account_id]
    output: Supplier
    side_effects: []

  - method: POST
    path: "/suppliers/{id}/qualify"
    description: "Promote supplier to QUALIFIED"
    roles: [LegalApprover]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/suppliers/{id}"
    description: "Get supplier"
    roles: [Buyer, FinanceApprover, LegalApprover, GeneralManager]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/suppliers"
    description: "List suppliers, filterable by qualification_status and category"
    roles: [Buyer, FinanceApprover, LegalApprover]
    code: 200
    input: ["qualification_status?", "category?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  # --- Requirement ---
  - method: POST
    path: "/requirements"
    description: "Submit a requirement (DRAFT). Use /submit to advance."
    roles: [Requester]
    code: 201
    input: [category, specification, quantity, unit, expected_delivery_date, budget_account_id, estimated_unit_price_cents, "attachment_uri?"]
    output: Requirement
    side_effects: []

  - method: POST
    path: "/requirements/{id}/submit"
    description: "Submit a DRAFT requirement"
    roles: [Requester]
    code: 200
    input: []
    output: Requirement
    side_effects:
      - "Requirement -> SUBMITTED"

  - method: POST
    path: "/requirements/{id}/quotes"
    description: "Buyer adds a supplier quote against a SUBMITTED or IN_SOURCING requirement"
    roles: [Buyer]
    code: 201
    input: [supplier_id, unit_price_cents, lead_time_days, technical_score]
    output: Quote
    side_effects:
      - "First valid Quote moves Requirement -> IN_SOURCING"
      - "Triggers quote_composite_score (incremental_recompute) across the SUBMITTED pool"

  - method: POST
    path: "/requirements/{id}/shortlist"
    description: "Buyer designates the SHORTLISTED set; triggers pool-relative scoring"
    roles: [Buyer]
    code: 200
    input: [quote_ids]
    output: object
    side_effects:
      - "Each named Quote -> SHORTLISTED"
      - "Triggers quote_composite_score (pool_relative)"

  - method: POST
    path: "/requirements/{id}/award"
    description: "Award an awarded_quote_id; creates PurchaseOrder and ApprovalStep records per tier"
    roles: [Buyer]
    code: 201
    input: [awarded_quote_id, justification]
    output: PurchaseOrder
    side_effects:
      - "Requirement -> AWARDED -> IN_APPROVAL"
      - "Awarded Quote -> AWARDED; sibling SHORTLISTED -> REJECTED"
      - "PurchaseOrder created in PENDING_APPROVAL with computed tier"
      - "ApprovalStep records generated per tier routing"
      - "BudgetAccount.committed_amount_cents += PO.total_amount_cents"

  - method: POST
    path: "/requirements/{id}/rework"
    description: "Move a REJECTED requirement back to DRAFT for revision"
    roles: [Requester]
    code: 200
    input: []
    output: Requirement
    side_effects: []

  - method: POST
    path: "/requirements/{id}/cancel"
    description: "Cancel a DRAFT or SUBMITTED requirement"
    roles: [Requester]
    code: 200
    input: []
    output: Requirement
    side_effects: []

  - method: GET
    path: "/requirements/{id}"
    description: "Get a requirement (includes computed estimated_total_cents)"
    roles: [Requester, Buyer, FinanceApprover, DepartmentHead, GeneralManager, LegalApprover]
    code: 200
    input: []
    output: Requirement
    side_effects: []

  - method: GET
    path: "/requirements"
    description: "List requirements with filters"
    roles: [Requester, Buyer, FinanceApprover, DepartmentHead, GeneralManager, LegalApprover]
    code: 200
    input: ["status?", "category?", "requester_id?", "budget_account_id?", "limit?", "offset?"]
    output: Requirement[]
    side_effects: []

  # --- Quotes ---
  - method: GET
    path: "/requirements/{id}/quotes/comparison-table"
    description: "Compare-table view: quotes with technical/commercial/composite scores"
    roles: [Buyer, FinanceApprover, GeneralManager]
    code: 200
    input: []
    output: object
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Get a quote"
    roles: [Buyer, FinanceApprover]
    code: 200
    input: []
    output: Quote
    side_effects: []

  # --- PurchaseOrder ---
  - method: GET
    path: "/purchase-orders/{id}"
    description: "Get a PO"
    roles: [Buyer, Requester, FinanceApprover, DepartmentHead, GeneralManager, LegalApprover]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: POST
    path: "/purchase-orders/{id}/cancel"
    description: "Cancel an as-yet-undecided PO"
    roles: [Buyer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "BudgetAccount.committed_amount_cents -= PO.total_amount_cents"
      - "All ApprovalStep -> SKIPPED"

  - method: GET
    path: "/purchase-orders"
    description: "List POs"
    roles: [Buyer, FinanceApprover, GeneralManager]
    code: 200
    input: ["status?", "tier?", "supplier_id?", "limit?", "offset?"]
    output: PurchaseOrder[]
    side_effects: []

  # --- ApprovalStep ---
  - method: GET
    path: "/purchase-orders/{id}/approval-steps"
    description: "List ApprovalSteps for a PO"
    roles: [Buyer, FinanceApprover, DepartmentHead, GeneralManager, LegalApprover]
    code: 200
    input: []
    output: ApprovalStep[]
    side_effects: []

  - method: POST
    path: "/approval-steps/{id}/approve"
    description: "Approver approves a PENDING or ESCALATED step"
    roles: [DepartmentHead, FinanceApprover, LegalApprover, GeneralManager]
    code: 200
    input: ["decision_comment?"]
    output: ApprovalStep
    side_effects:
      - "Cascades PO -> APPROVED if last step"

  - method: POST
    path: "/approval-steps/{id}/reject"
    description: "Approver rejects a PENDING or ESCALATED step"
    roles: [DepartmentHead, FinanceApprover, LegalApprover, GeneralManager]
    code: 200
    input: ["decision_comment?"]
    output: ApprovalStep
    side_effects:
      - "PO -> REJECTED; sibling steps -> SKIPPED; budget commitment released"

  - method: POST
    path: "/approval-steps/{id}/delegate"
    description: "Original approver delegates the step to another user with the same role"
    roles: [DepartmentHead, FinanceApprover, LegalApprover, GeneralManager]
    code: 200
    input: [target_user_id]
    output: ApprovalStep
    side_effects:
      - "AuditLogEntry appended"

  # --- Contract ---
  - method: POST
    path: "/contracts"
    description: "Create a contract draft tied to an APPROVED PO"
    roles: [Buyer]
    code: 201
    input: [purchase_order_id, clause_template_ids, payment_terms_type, payment_terms_params, parties_required]
    output: Contract
    side_effects:
      - "ContractVersion v1 snapshot created"

  - method: POST
    path: "/contracts/{id}/submit-for-review"
    description: "Move contract from DRAFTING to IN_REVIEW"
    roles: [Buyer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{id}/finalize-review"
    description: "Legal finalizes review; contract -> AWAITING_SIGNATURE"
    roles: [LegalApprover]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/contracts/{id}/amend"
    description: "Amend contract; bumps version; clears signatures if AWAITING_SIGNATURE"
    roles: [Buyer]
    code: 200
    input: ["clause_template_ids?", "payment_terms_type?", "payment_terms_params?", change_reason]
    output: Contract
    side_effects:
      - "Contract.current_version += 1; new ContractVersion appended"
      - "AuditLogEntry(action=CONTRACT_AMENDED) appended"

  - method: POST
    path: "/contracts/{id}/sign"
    description: "Record a party signature"
    roles: [Buyer, Supplier]
    code: 200
    input: [role, signature_ref]
    output: Contract
    side_effects:
      - "AuditLogEntry(action=CONTRACT_SIGNED) appended"
      - "On final required signature: Contract -> EXECUTED; PaymentSchedule generated; PO -> CONTRACTED"

  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an executed contract"
    roles: [GeneralManager]
    code: 200
    input: [reason]
    output: Contract
    side_effects:
      - "PENDING PaymentSchedule entries -> CANCELLED"
      - "Budget commitment released for unpaid balance"

  - method: GET
    path: "/contracts/{id}"
    description: "Get a contract"
    roles: [Buyer, Supplier, LegalApprover, FinanceApprover, GeneralManager]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts/{id}/versions"
    description: "List ContractVersions for a contract"
    roles: [Buyer, Supplier, LegalApprover, FinanceApprover, GeneralManager]
    code: 200
    input: []
    output: ContractVersion[]
    side_effects: []

  # --- ClauseTemplate ---
  - method: POST
    path: "/clause-templates"
    description: "Create a clause template"
    roles: [LegalApprover]
    code: 201
    input: [code, title, body, category]
    output: ClauseTemplate
    side_effects: []

  - method: GET
    path: "/clause-templates"
    description: "List clause templates"
    roles: [LegalApprover, Buyer]
    code: 200
    input: ["category?", "is_active?", "limit?", "offset?"]
    output: ClauseTemplate[]
    side_effects: []

  # --- Receipt ---
  - method: POST
    path: "/purchase-orders/{id}/receipts"
    description: "Buyer (or warehouse) records a delivery"
    roles: [Inspector, Buyer]
    code: 201
    input: [delivery_note_no, received_quantity, accepted_quantity, quality_rating]
    output: Receipt
    side_effects: []

  - method: POST
    path: "/receipts/{id}/inspect"
    description: "Move receipt into INSPECTING (delivery-note matching)"
    roles: [Inspector]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: POST
    path: "/receipts/{id}/accept"
    description: "Accept (full or partial) the receipt"
    roles: [Inspector]
    code: 200
    input: []
    output: Receipt
    side_effects:
      - "PO -> FULFILLED if cumulative accepted == Requirement.quantity"
      - "Supplier.rating_avg recomputed"

  - method: POST
    path: "/receipts/{id}/reject"
    description: "Reject the receipt for quality/quantity"
    roles: [Inspector]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: POST
    path: "/receipts/{id}/return"
    description: "Initiate return-to-supplier on a REJECTED receipt"
    roles: [Inspector]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/invoices"
    description: "Supplier submits an invoice"
    roles: [Supplier]
    code: 201
    input: [purchase_order_id, supplier_id, invoice_no, invoice_date, invoiced_quantity, invoiced_amount_cents, tax_amount_cents, tax_rate_declared]
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/match"
    description: "Run three-way match"
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Invoice
    side_effects:
      - "Invoice -> MATCHED or EXCEPTION; matching_result populated"

  - method: POST
    path: "/invoices/{id}/override"
    description: "GM override on EXCEPTION invoice"
    roles: [GeneralManager]
    code: 200
    input: [justification]
    output: Invoice
    side_effects:
      - "Invoice -> MATCHED with matching_result.override_by set"

  - method: POST
    path: "/invoices/{id}/approve"
    description: "Finance approves a MATCHED invoice"
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/reject"
    description: "Finance rejects an EXCEPTION invoice"
    roles: [FinanceApprover]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get invoice (includes matching_result)"
    roles: [Buyer, FinanceApprover, Supplier, GeneralManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # --- PaymentSchedule and Payment ---
  - method: GET
    path: "/purchase-orders/{id}/payment-schedule"
    description: "Get the generated PaymentSchedule for a PO"
    roles: [Buyer, FinanceApprover, GeneralManager, Supplier]
    code: 200
    input: []
    output: PaymentSchedule[]
    side_effects: []

  - method: POST
    path: "/payments"
    description: "Apply a payment against a PaymentSchedule entry and an APPROVED Invoice"
    roles: [FinanceApprover]
    code: 201
    input: [payment_schedule_id, invoice_id]
    output: Payment
    side_effects:
      - "PaymentSchedule -> APPLIED"

  - method: POST
    path: "/payments/{id}/approve"
    description: "Finance approves the applied payment (different user than PO approver)"
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/payments/{id}/execute"
    description: "Execute payment via bank sync"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "Payment -> EXECUTED; bank_reference set"
      - "BudgetAccount.spent_amount_cents += amount_cents; committed_amount_cents -= amount_cents"

  - method: POST
    path: "/payments/{id}/cancel"
    description: "Cancel an APPLIED (not yet executed) payment"
    roles: [FinanceApprover]
    code: 200
    input: []
    output: Payment
    side_effects:
      - "PaymentSchedule -> PENDING"

  # --- Audit log ---
  - method: GET
    path: "/audit-log"
    description: "Query audit log with filters"
    roles: [GeneralManager, FinanceApprover, LegalApprover]
    code: 200
    input: ["entity_type?", "entity_id?", "action?", "limit?", "offset?"]
    output: AuditLogEntry[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-ID/X-User-Role headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint, or unknown role/user"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits this transition"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency version mismatch on PATCH/mutation"

  - id: ERR_VALIDATION
    http: 400
    condition: "Schema/type validation failure (missing required field, bad enum value, malformed payload)"

  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit out of [1,100] or offset < 0"

  - id: ERR_SUPPLIER_NOT_QUALIFIED
    http: 422
    condition: "Quote attempted with non-QUALIFIED supplier, mismatched category, or expired qualification"

  - id: ERR_INSUFFICIENT_QUOTES
    http: 422
    condition: "Award attempted with fewer than 3 SHORTLISTED quotes, or missing justification, or awarded quote not in SHORTLISTED set"

  - id: ERR_REQUIREMENT_ALREADY_AWARDED
    http: 409
    condition: "Award attempted on a Requirement that is no longer IN_SOURCING (race-loser)"

  - id: ERR_BUDGET_WOULD_EXCEED
    http: 422
    condition: "Award would push BudgetAccount.committed + total beyond total_amount_cents"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same user_id attempts two ApprovalSteps on the same PO, or attempts to approve a Payment on a PO they previously approved"

  - id: ERR_PREDECESSOR_NOT_DECIDED
    http: 409
    condition: "Serial ApprovalStep approve attempted before its predecessor is APPROVED/SKIPPED"

  - id: ERR_APPROVAL_DEADLINE_PASSED
    http: 409
    condition: "Approval action on a step whose deadline_at <= now()"

  - id: ERR_DELIVERY_NOTE_MISMATCH
    http: 422
    condition: "Receipt.delivery_note_no does not match any /_events/supplier-delivery record for the PO, or accepted_quantity > received_quantity"

  - id: ERR_OVER_RECEIPT
    http: 422
    condition: "Cumulative accepted_quantity across receipts on a PO would exceed Requirement.quantity"

  - id: ERR_THREE_WAY_MATCH_FAILED
    http: 422
    condition: "Three-way match exceeds quantity or amount tolerance"

  - id: ERR_TAX_NONCOMPLIANT
    http: 422
    condition: "Tax rate not in ALLOWED_TAX_RATES, or tax_amount mismatch outside TAX_TOLERANCE_CENTS"

  - id: ERR_DELIVERY_DATE_TOO_EARLY
    http: 422
    condition: "expected_delivery_date is less than created_at + 1 day"

  - id: ERR_CONTRACT_ALREADY_EXISTS
    http: 409
    condition: "A Contract with the same purchase_order_id already exists"

  - id: ERR_PAYMENT_ALREADY_APPLIED
    http: 409
    condition: "Two Payments attempted against the same PaymentSchedule entry"

  - id: ERR_SIGNATURE_ALREADY_COLLECTED
    http: 409
    condition: "Two signatures from the same role on the same Contract"

  - id: ERR_DELEGATE_INVALID_ROLE
    http: 422
    condition: "Delegation target user does not match the step's required role"

  - id: ERR_CLAUSE_TEMPLATE_INACTIVE
    http: 422
    condition: "Contract references a ClauseTemplate.is_active == false"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Requester
    description: "Employee who submits and reworks Requirements"
    identity: opaque
    exclusive_operations:
      - "POST /requirements"
      - "POST /requirements/{id}/submit"
      - "POST /requirements/{id}/rework"
      - "POST /requirements/{id}/cancel"
    shared_operations:
      - "GET /requirements*"
      - "GET /budget-accounts*"
      - "GET /purchase-orders/{id}"

  - name: Buyer
    description: "Sourcing professional who collects quotes, awards POs, drafts contracts, and may record receipts"
    identity: opaque
    exclusive_operations:
      - "POST /suppliers"
      - "POST /requirements/{id}/quotes"
      - "POST /requirements/{id}/shortlist"
      - "POST /requirements/{id}/award"
      - "POST /purchase-orders/{id}/cancel"
      - "POST /contracts"
      - "POST /contracts/{id}/submit-for-review"
      - "POST /contracts/{id}/amend"
    shared_operations:
      - "POST /purchase-orders/{id}/receipts (with Inspector)"
      - "POST /contracts/{id}/sign (party=Buyer)"
      - "GET /quotes/{id}"
      - "GET /requirements/{id}/quotes/comparison-table"

  - name: DepartmentHead
    description: "First-level approver in the approval chain"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /approval-steps/{id}/approve (when assignee_role=DepartmentHead)"
      - "POST /approval-steps/{id}/reject (same constraint)"
      - "POST /approval-steps/{id}/delegate"
      - "GET /purchase-orders/{id}/approval-steps"

  - name: FinanceApprover
    description: "Finance approver; also manages BudgetAccount and Invoice/Payment workflow"
    identity: opaque
    exclusive_operations:
      - "POST /budget-accounts"
      - "POST /invoices/{id}/match"
      - "POST /invoices/{id}/approve"
      - "POST /invoices/{id}/reject"
      - "POST /payments"
      - "POST /payments/{id}/approve"
      - "POST /payments/{id}/cancel"
    shared_operations:
      - "POST /approval-steps/{id}/approve (when assignee_role=FinanceApprover)"
      - "POST /approval-steps/{id}/reject (same constraint)"
      - "POST /approval-steps/{id}/delegate"

  - name: LegalApprover
    description: "Legal reviewer; manages clause templates and finalizes contract review"
    identity: opaque
    exclusive_operations:
      - "POST /suppliers/{id}/qualify"
      - "POST /clause-templates"
      - "POST /contracts/{id}/finalize-review"
    shared_operations:
      - "POST /approval-steps/{id}/approve (when assignee_role=LegalApprover)"
      - "POST /approval-steps/{id}/reject (same constraint)"
      - "POST /approval-steps/{id}/delegate"

  - name: GeneralManager
    description: "Top-level approver; escalation target; invoice override; contract terminator"
    identity: opaque
    exclusive_operations:
      - "POST /invoices/{id}/override"
      - "POST /contracts/{id}/terminate"
    shared_operations:
      - "POST /approval-steps/{id}/approve (when assignee_role=GeneralManager OR step.status=ESCALATED)"
      - "POST /approval-steps/{id}/reject (same)"
      - "POST /approval-steps/{id}/delegate"
      - "GET /audit-log"

  - name: Inspector
    description: "Warehouse inspector who matches delivery notes and grades quality"
    identity: opaque
    exclusive_operations:
      - "POST /receipts/{id}/inspect"
      - "POST /receipts/{id}/accept"
      - "POST /receipts/{id}/reject"
      - "POST /receipts/{id}/return"
    shared_operations:
      - "POST /purchase-orders/{id}/receipts (with Buyer)"

  - name: Supplier
    description: "External party that signs contracts and submits invoices; entity-backed"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /invoices"
    shared_operations:
      - "POST /contracts/{id}/sign (party=Supplier; signer's X-User-ID must equal Contract.purchase_order.supplier_id)"
      - "GET /contracts/{id}"
      - "GET /invoices/{id}"

  - name: PlatformAdmin
    description: "Operational role that drives test clock, supplier-delivery events, and bank execution"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/advance"
      - "POST /_events/supplier-delivery"
      - "POST /payments/{id}/execute"
    shared_operations: []
