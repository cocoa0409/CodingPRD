          setup:
            - "ApiProduct P6 is PERSONAL (BASE_NOTICE_DAYS 60) with three non-breaking versions 1.0.0, 1.1.0 and 1.2.0, all promoted to GENERAL_AVAILABILITY"
            - "no entitlement is pinned to any of them, so the required notice stays at 60 days for each"
