          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Abandoning an ACTIVE cycle with one ORDERED drug order and one SCHEDULED appointment cancels both children and sets cycle ABANDONED."
        test_recipe:
