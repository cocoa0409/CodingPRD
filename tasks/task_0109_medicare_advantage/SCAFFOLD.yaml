scenario: |
  Medicare Advantage Enrollment: Parts A/B/C/D, Initial Enrollment Period (IEP),
  Annual Enrollment Period (AEP), Late Enrollment Penalty, Medigap guaranteed issue,
  Donut Hole drug tiers, Star Rating.

domain_name: "medicare-advantage-enrollment"
api_prefix: "/beneficiaries"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
    - cascading_side_effects

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Beneficiary legal name.
        constraints: "1..100 chars"
      - name: date_of_birth
        type: datetime
        source: input
        description: Birth date (date-only ISO 8601, e.g. 1960-04-15). Used to derive IEP and 65-year threshold.
      - name: medicare_id
        type: string
        source: input
        description: Externally issued MBI (Medicare Beneficiary Identifier). Globally unique.
        constraints: "11 chars; format [A-Z0-9]; unique across Beneficiary"
      - name: has_esrd
        type: boolean
        source: input
        description: End-stage renal disease flag (alters eligibility windows).
        default: false
      - name: has_disability
        type: boolean
        source: input
        description: Permanent-disability flag (qualifies for Medicare before age 65 after 24 months of SSDI).
        default: false
      - name: ssdi_start_date
        type: datetime
        source: input
        description: Date Social Security Disability Insurance began. Used to compute pre-65 IEP for disabled.
        default: null
      - name: state_code
        type: string
        source: input
        description: USPS 2-letter state code. Used for Medigap guaranteed-issue rules.
        constraints: "exactly 2 uppercase letters"
      - name: lifecycle_status
        type: enum
        source: computed
        description: Derived posture for the beneficiary.
        constraints: "values: PRE_ELIGIBLE, IEP_OPEN, IEP_CLOSED, ENROLLED, COVERAGE_GAP, DECEASED"
        default: PRE_ELIGIBLE
      - name: iep_start_date
        type: datetime
        source: computed
        description: First day of the 7-month IEP window (3 months before eligibility month).
      - name: iep_end_date
        type: datetime
        source: computed
        description: Last day of the 7-month IEP window (3 months after eligibility month, inclusive last day).
      - name: medicare_eligibility_date
        type: datetime
        source: computed
        description: |
          First-of-month at which beneficiary becomes Medicare-eligible: first day of the month containing
          their 65th birthday; or, if has_disability=true and ssdi_start_date set, ssdi_start_date + 24 months
          (first of that month); or, if has_esrd=true, date_of_birth (treated as immediately eligible).
      - name: deceased_at
        type: datetime
        source: system
        description: When marked DECEASED; null otherwise.
        default: null

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: plan_code
        type: string
        source: input
        description: Plan identifier (e.g., "MA-ACE-2026-CA"). Unique.
        constraints: "1..40 chars, unique"
      - name: plan_type
        type: enum
        source: input
        description: Category of plan.
        constraints: "values: PART_A, PART_B, PART_C, PART_D, MEDIGAP"
      - name: plan_year
        type: integer
        source: input
        description: 4-digit calendar year this plan covers.
        constraints: "2020 <= value <= 2030"
      - name: state_code
        type: string
        source: input
        description: USPS state code where the plan is available (MEDIGAP only). Null otherwise.
        default: null
      - name: monthly_premium_cents
        type: integer
        source: input
        description: Plan premium in cents per month.
        constraints: ">= 0"
      - name: annual_deductible_cents
        type: integer
        source: input
        description: Deductible the beneficiary pays before plan starts contributing (PART_D only; 0 otherwise).
        default: 0
        constraints: ">= 0"
      - name: initial_coverage_limit_cents
        type: integer
        source: input
        description: Total drug spend at which the Initial Coverage phase ends and Donut Hole begins (PART_D only; 0 otherwise).
        default: 0
      - name: catastrophic_threshold_cents
        type: integer
        source: input
        description: Beneficiary out-of-pocket TrOOP at which Catastrophic phase begins (PART_D only; 0 otherwise).
        default: 0
      - name: star_rating
        type: number
        source: input
        description: Most recent CMS star rating, in half-star increments 1.0..5.0.
        constraints: "1.0 <= value <= 5.0, step 0.5"
      - name: is_active
        type: boolean
        source: input
        description: Whether the plan is currently offered.
        default: true

  - name: EnrollmentPeriod
    parent: Beneficiary
    common_fields: true
    fields:
      - name: beneficiary_id
        type: string
        source: input
        description: FK -> Beneficiary.id
      - name: period_type
        type: enum
        source: input
        description: Kind of period.
        constraints: "values: IEP, AEP, GEP, SEP_MOVE, SEP_LOSS_OF_COVERAGE, MEDIGAP_GI"
      - name: window_start
        type: datetime
        source: input
        description: First day this period is open (inclusive, 00:00:00 UTC).
      - name: window_end
        type: datetime
        source: input
        description: Last day this period is open (inclusive, 23:59:59 UTC).
      - name: status
        type: enum
        source: computed
        description: Period lifecycle.
        constraints: "values: SCHEDULED, OPEN, CLOSED, CONSUMED"
        default: SCHEDULED
      - name: consumed_by_enrollment_id
        type: string
        source: system
        description: FK -> Enrollment.id that consumed this period; null if not yet consumed.
        default: null

  - name: Enrollment
    parent: Beneficiary
    common_fields: true
    fields:
      - name: beneficiary_id
        type: string
        source: input
        description: FK -> Beneficiary.id
      - name: plan_id
        type: string
        source: input
        description: FK -> Plan.id
      - name: enrollment_period_id
        type: string
        source: input
        description: FK -> EnrollmentPeriod.id used to justify this enrollment. Server validates the period covers the request date.
      - name: part_covered
        type: enum
        source: computed
        description: Mirrors Plan.plan_type at the time of enrollment.
        constraints: "values: PART_A, PART_B, PART_C, PART_D"
      - name: status
        type: enum
        source: computed
        description: Enrollment lifecycle.
        constraints: "values: PENDING, ACTIVE, TERMINATED, REJECTED"
        default: PENDING
      - name: effective_date
        type: datetime
        source: computed
        description: First day of coverage. For AEP-based enrollments effective_date = first day of next plan_year; for IEP it follows the IEP effective-date rules.
      - name: termination_date
        type: datetime
        source: computed
        description: Last day of coverage; null while ACTIVE.
        default: null
      - name: months_late
        type: integer
        source: computed
        description: |
          Whole months between medicare_eligibility_date (or eligibility-for-creditable-Part-D coverage)
          and effective_date, computed at the moment of ACTIVATION. Zero if enrolled during IEP.
        default: 0

  - name: LateEnrollmentPenalty
    parent: Beneficiary
    common_fields: false
    fields:
      - name: beneficiary_id
        type: string
        source: input
        description: FK -> Beneficiary.id
      - name: enrollment_id
        type: string
        source: system
        description: FK -> Enrollment.id that triggered the penalty.
      - name: part
        type: enum
        source: computed
        description: Part to which the penalty attaches.
        constraints: "values: PART_B, PART_D"
      - name: months_late
        type: integer
        source: computed
        description: Whole months between eligibility and activation. Snapshot.
      - name: penalty_rate_decimal
        type: number
        source: computed
        description: Multiplicative penalty rate added to base premium. Computed per §1.3.
        constraints: ">= 0; up to 6 decimal places"
      - name: monthly_penalty_cents
        type: integer
        source: computed
        description: Penalty added to monthly premium in cents (integer, banker-free; see §1.3 rounding).
      - name: snapshot_base_premium_cents
        type: integer
        source: system
        description: Plan.monthly_premium_cents at penalty calculation time. Frozen.

  - name: MedigapPolicy
    parent: Beneficiary
    common_fields: true
    fields:
      - name: beneficiary_id
        type: string
        source: input
        description: FK -> Beneficiary.id
      - name: plan_id
        type: string
        source: input
        description: FK -> Plan.id of plan_type=MEDIGAP
      - name: status
        type: enum
        source: computed
        description: Policy lifecycle.
        constraints: "values: APPLIED, GUARANTEED_ISSUED, UNDERWRITING, ISSUED, DENIED, CANCELLED"
        default: APPLIED
      - name: gi_window_id
        type: string
        source: system
        description: FK -> EnrollmentPeriod.id of period_type=MEDIGAP_GI used; null if underwritten.
        default: null
      - name: applied_at
        type: datetime
        source: system
        description: Server-stamped time at POST application.
      - name: issued_at
        type: datetime
        source: system
        description: When status -> ISSUED.
        default: null
      - name: premium_locked_cents
        type: integer
        source: computed
        description: Premium pinned at issuance. Equals Plan.monthly_premium_cents at GI-issuance; for underwritten policies may be Plan.monthly_premium_cents * underwriting_uplift.
      - name: underwriting_uplift_decimal
        type: number
        source: input
        description: Fractional uplift if not GI. Ignored when status=GUARANTEED_ISSUED.
        default: 0.0

  - name: DrugClaim
    parent: Beneficiary
    common_fields: false
    fields:
      - name: beneficiary_id
        type: string
        source: input
        description: FK -> Beneficiary.id
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id of part=PART_D ACTIVE at fill_date.
      - name: ndc_code
        type: string
        source: input
        description: National Drug Code identifier.
      - name: tier
        type: enum
        source: input
        description: Plan formulary tier.
        constraints: "values: TIER_1, TIER_2, TIER_3, TIER_4, TIER_5"
      - name: fill_date
        type: datetime
        source: input
        description: Date drug was dispensed (date-only UTC).
      - name: gross_cost_cents
        type: integer
        source: input
        description: Total negotiated drug cost in cents.
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Claim lifecycle.
        constraints: "values: SUBMITTED, ADJUDICATED, REVERSED"
        default: SUBMITTED
      - name: phase_at_adjudication
        type: enum
        source: computed
        description: Coverage phase under which this claim was adjudicated.
        constraints: "values: DEDUCTIBLE, INITIAL_COVERAGE, COVERAGE_GAP, CATASTROPHIC"
      - name: beneficiary_cost_cents
        type: integer
        source: computed
        description: Out-of-pocket cost charged to beneficiary for this fill.
      - name: plan_cost_cents
        type: integer
        source: computed
        description: Portion paid by the plan for this fill.
      - name: adjudicated_at
        type: datetime
        source: system
        description: When the claim moved SUBMITTED -> ADJUDICATED.

  - name: DrugPhaseLedger
    parent: Beneficiary
    common_fields: true
    fields:
      - name: beneficiary_id
        type: string
        source: input
        description: FK -> Beneficiary.id
      - name: plan_year
        type: integer
        source: input
        description: Calendar year of accumulation.
      - name: enrollment_id
        type: string
        source: input
        description: FK -> the PART_D Enrollment under which this ledger accumulates.
      - name: deductible_paid_cents
        type: integer
        source: computed
        description: Total beneficiary spend toward the annual deductible.
        default: 0
      - name: total_drug_spend_cents
        type: integer
        source: computed
        description: Cumulative gross drug spend used to determine when initial_coverage_limit is crossed.
        default: 0
      - name: troop_cents
        type: integer
        source: computed
        description: True Out-Of-Pocket — what counts toward catastrophic_threshold.
        default: 0
      - name: current_phase
        type: enum
        source: computed
        description: Phase the next claim will start in (may transition mid-claim).
        constraints: "values: DEDUCTIBLE, INITIAL_COVERAGE, COVERAGE_GAP, CATASTROPHIC"
        default: DEDUCTIBLE
      - name: last_adjudicated_claim_id
        type: string
        source: system
        description: FK -> DrugClaim.id of most recent ADJUDICATED claim contributing to this ledger.
        default: null

  - name: StarRatingSnapshot
    parent: Plan
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> Plan.id
      - name: measurement_year
        type: integer
        source: input
        description: Calendar year measured.
        constraints: "2020 <= value <= 2030"
      - name: clinical_quality_score
        type: number
        source: input
        description: Raw 0..100 clinical-care score.
      - name: member_experience_score
        type: number
        source: input
        description: Raw 0..100 member-experience score.
      - name: customer_service_score
        type: number
        source: input
        description: Raw 0..100 customer-service score.
      - name: weighted_star_rating
        type: number
        source: computed
        description: Weighted composite (see §1.3) in half-star increments 1.0..5.0.
      - name: published_at
        type: datetime
        source: system
        description: When the weighted_star_rating was published to the parent Plan.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Beneficiary
    initial_state: PRE_ELIGIBLE
    terminal_states: [DECEASED]
    transitions:
      - from: PRE_ELIGIBLE
        to: IEP_OPEN
        trigger: "POST /_clock/advance crosses iep_start_date"
        actor: system
        preconditions: ["now() >= iep_start_date", "now() <= iep_end_date"]
        side_effects:
          - "Set EnrollmentPeriod (period_type=IEP) for this beneficiary status SCHEDULED -> OPEN"
          - "lifecycle_status -> IEP_OPEN"
      - from: IEP_OPEN
        to: IEP_CLOSED
        trigger: "POST /_clock/advance crosses iep_end_date+1 with no ACTIVE Enrollment of part PART_A or PART_B"
        actor: system
        preconditions:
          - "now() > iep_end_date"
          - "No Enrollment exists where beneficiary_id=this.id AND status=ACTIVE AND part_covered IN {PART_A, PART_B}"
        side_effects:
          - "EnrollmentPeriod IEP record status OPEN -> CLOSED"
          - "lifecycle_status -> IEP_CLOSED"
          - "Schedule a SEP_LOSS_OF_COVERAGE candidacy review on next AEP"
      - from: IEP_OPEN
        to: ENROLLED
        trigger: "First Enrollment status PENDING -> ACTIVE during IEP window"
        actor: BenefitsCounselor
        preconditions:
          - "An EnrollmentPeriod with period_type=IEP and status=OPEN exists"
          - "Enrollment.effective_date <= iep_end_date+1 month"
        side_effects:
          - "EnrollmentPeriod (IEP) status OPEN -> CONSUMED, consumed_by_enrollment_id = Enrollment.id"
          - "lifecycle_status -> ENROLLED"
      - from: IEP_CLOSED
        to: ENROLLED
        trigger: "Enrollment status PENDING -> ACTIVE during AEP or qualifying SEP"
        actor: BenefitsCounselor
        preconditions:
          - "Referenced EnrollmentPeriod.status = OPEN AND period_type IN {AEP, SEP_MOVE, SEP_LOSS_OF_COVERAGE}"
        side_effects:
          - "lifecycle_status -> ENROLLED"
          - "If period_type IN {AEP, GEP, SEP_LOSS_OF_COVERAGE} and part_covered IN {PART_B, PART_D} and months_late > 0, create LateEnrollmentPenalty record (cascade depth 2: Enrollment.ACTIVE -> create LEP -> recompute Enrollment.snapshot_total_premium_cents on Enrollment row)"
      - from: ENROLLED
        to: COVERAGE_GAP
        trigger: "All Enrollment rows of this beneficiary transitioned to TERMINATED"
        actor: system
        preconditions:
          - "No Enrollment exists where beneficiary_id=this.id AND status=ACTIVE"
        side_effects:
          - "lifecycle_status -> COVERAGE_GAP"
          - "Open a SEP_LOSS_OF_COVERAGE EnrollmentPeriod with window_start = today, window_end = today + 63 days"
      - from: COVERAGE_GAP
        to: ENROLLED
        trigger: "New Enrollment PENDING -> ACTIVE while in COVERAGE_GAP"
        actor: BenefitsCounselor
        preconditions:
          - "Referenced EnrollmentPeriod.status = OPEN"
        side_effects:
          - "lifecycle_status -> ENROLLED"
      - from: ENROLLED
        to: DECEASED
        trigger: "POST /beneficiaries/{id}/mark-deceased"
        actor: PlanAdmin
        preconditions:
          - "lifecycle_status != DECEASED"
        side_effects:
          - "deceased_at = now()"
          - "All ACTIVE Enrollment rows: status ACTIVE -> TERMINATED, termination_date = now()"
          - "All APPLIED/UNDERWRITING/ISSUED MedigapPolicy rows: status -> CANCELLED"
          - "All SUBMITTED DrugClaim rows: status SUBMITTED -> REVERSED"
      - from: IEP_OPEN
        to: DECEASED
        trigger: "POST /beneficiaries/{id}/mark-deceased"
        actor: PlanAdmin
        preconditions: ["lifecycle_status != DECEASED"]
        side_effects:
          - "deceased_at = now(); cascade as in ENROLLED -> DECEASED"

  - entity: Enrollment
    initial_state: PENDING
    terminal_states: [TERMINATED, REJECTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: BenefitsCounselor
        preconditions:
          - "Beneficiary.lifecycle_status != DECEASED"
          - "Plan.is_active = true"
          - "Plan.plan_year == year(effective_date)"
          - "Referenced EnrollmentPeriod.status = OPEN AND covers effective_date (window_start <= effective_date <= window_end)"
          - "No overlapping ACTIVE Enrollment with same part_covered and overlapping coverage interval"
        side_effects:
          - "Compute months_late = max(0, months_between(medicare_eligibility_date, effective_date) - 7 if part IN {PART_B}; max(0, months_uncovered_part_d) if part PART_D)"
          - "If months_late > 0 AND part_covered IN {PART_B, PART_D}: create LateEnrollmentPenalty (cascade hop 1) -> recompute Enrollment effective premium snapshot (cascade hop 2)"
          - "Mark referenced EnrollmentPeriod CONSUMED if period_type IN {IEP, MEDIGAP_GI}"
          - "Bubble-up Beneficiary state transition (IEP_OPEN->ENROLLED, IEP_CLOSED->ENROLLED, or COVERAGE_GAP->ENROLLED)"
          - "If part_covered = PART_D: create DrugPhaseLedger row with current_phase=DEDUCTIBLE"
      - from: PENDING
        to: REJECTED
        trigger: "POST /enrollments/{id}/reject"
        actor: PlanAdmin
        preconditions: []
        side_effects: ["Referenced EnrollmentPeriod stays OPEN (period not consumed)"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate"
        actor: BenefitsCounselor
        preconditions:
          - "termination_date >= effective_date"
          - "termination_date <= last day of Plan.plan_year"
        side_effects:
          - "Cascade: open SEP_LOSS_OF_COVERAGE EnrollmentPeriod (depth 2 from termination -> beneficiary lifecycle re-evaluation -> period creation)"
          - "If part_covered = PART_D: freeze DrugPhaseLedger.current_phase as of termination_date"
          - "If LateEnrollmentPenalty exists for this enrollment_id: mark it inactive (penalty_rate_decimal preserved as snapshot, no further effect)"
          - "Bubble-up: re-evaluate Beneficiary lifecycle_status (ENROLLED -> COVERAGE_GAP if no other ACTIVE rows)"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /enrollments/{id}/transfer (cyclic — terminate then re-enroll into a different Plan during AEP)"
        actor: BenefitsCounselor
        preconditions:
          - "Plan.plan_type matches part_covered"
          - "An OPEN EnrollmentPeriod with period_type=AEP covers now()"
        side_effects:
          - "Old Enrollment status ACTIVE -> TERMINATED with termination_date = Dec 31 of plan_year"
          - "New Enrollment created in PENDING and immediately activated with effective_date = Jan 1 of plan_year+1"
          - "DrugPhaseLedger of new enrollment starts fresh (DEDUCTIBLE phase, all counters 0)"

  - entity: MedigapPolicy
    initial_state: APPLIED
    terminal_states: [ISSUED, DENIED, CANCELLED]
    transitions:
      - from: APPLIED
        to: GUARANTEED_ISSUED
        trigger: "POST /medigap-policies/{id}/evaluate-gi"
        actor: PlanAdmin
        preconditions:
          - "An EnrollmentPeriod with period_type=MEDIGAP_GI and status=OPEN exists for beneficiary_id at applied_at"
          - "Plan.state_code == Beneficiary.state_code"
          - "Plan.plan_type = MEDIGAP"
        side_effects:
          - "gi_window_id set to that EnrollmentPeriod.id; EnrollmentPeriod.status OPEN -> CONSUMED"
          - "premium_locked_cents = Plan.monthly_premium_cents (no underwriting uplift applied)"
      - from: APPLIED
        to: UNDERWRITING
        trigger: "POST /medigap-policies/{id}/begin-underwriting"
        actor: PlanAdmin
        preconditions:
          - "No EnrollmentPeriod with period_type=MEDIGAP_GI AND status=OPEN exists for this beneficiary at applied_at"
        side_effects: []
      - from: UNDERWRITING
        to: APPLIED
        trigger: "POST /medigap-policies/{id}/revise-application (cyclic — beneficiary requests changes during underwriting)"
        actor: BenefitsCounselor
        preconditions:
          - "status = UNDERWRITING"
        side_effects:
          - "Reset underwriting_uplift_decimal to 0.0"
          - "applied_at = now()"
      - from: GUARANTEED_ISSUED
        to: ISSUED
        trigger: "POST /medigap-policies/{id}/issue"
        actor: PlanAdmin
        preconditions: ["premium_locked_cents > 0"]
        side_effects: ["issued_at = now()"]
      - from: UNDERWRITING
        to: ISSUED
        trigger: "POST /medigap-policies/{id}/issue"
        actor: PlanAdmin
        preconditions: ["underwriting_uplift_decimal >= 0"]
        side_effects:
          - "premium_locked_cents = round_half_up(Plan.monthly_premium_cents * (1 + underwriting_uplift_decimal))"
          - "issued_at = now()"
      - from: UNDERWRITING
        to: DENIED
        trigger: "POST /medigap-policies/{id}/deny"
        actor: PlanAdmin
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: CANCELLED
        trigger: "POST /medigap-policies/{id}/cancel"
        actor: BenefitsCounselor
        preconditions: []
        side_effects: []
      - from: UNDERWRITING
        to: CANCELLED
        trigger: "POST /medigap-policies/{id}/cancel"
        actor: BenefitsCounselor
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /medigap-policies/{id}/cancel"
        actor: BenefitsCounselor
        preconditions: []
        side_effects: []

  - entity: DrugClaim
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /drug-claims/{id}/adjudicate"
        actor: PlanAdmin
        preconditions:
          - "Referenced Enrollment.status = ACTIVE"
          - "Referenced Enrollment.part_covered = PART_D"
          - "fill_date >= Enrollment.effective_date AND (Enrollment.termination_date IS NULL OR fill_date <= Enrollment.termination_date)"
          - "year(fill_date) == Plan.plan_year"
        side_effects:
          - "Run donut_hole_phase_calc (§1.3) using DrugPhaseLedger snapshot BEFORE this claim"
          - "Cascade depth 3: DrugClaim.ADJUDICATED -> DrugPhaseLedger.{deductible_paid_cents,total_drug_spend_cents,troop_cents,current_phase} updated -> Beneficiary.lifecycle_status re-evaluated if catastrophic threshold crossed (logs only; no enum change)"
          - "Set phase_at_adjudication, beneficiary_cost_cents, plan_cost_cents on the claim row"
          - "adjudicated_at = now()"
      - from: SUBMITTED
        to: REVERSED
        trigger: "POST /drug-claims/{id}/reverse"
        actor: PlanAdmin
        preconditions: []
        side_effects: []
      - from: ADJUDICATED
        to: REVERSED
        trigger: "POST /drug-claims/{id}/reverse"
        actor: PlanAdmin
        preconditions:
          - "No subsequent ADJUDICATED claim exists for the same DrugPhaseLedger after this claim's adjudicated_at"
        side_effects:
          - "Roll back the four DrugPhaseLedger counters by exactly this claim's contribution (the compensating invariant must hold — see §1.3 and concurrency_rules)"
          - "Recompute DrugPhaseLedger.current_phase from the updated counters"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two ACTIVE enrollments to the same Part requested simultaneously for one beneficiary"
    guarantee: "At most one ACTIVE Enrollment per (beneficiary_id, part_covered) with overlapping coverage interval"
    error_id: ERR_DUPLICATE_PART_ENROLLMENT
    http_status: 409
    serialization: "First-writer-wins on (beneficiary_id, part_covered)"

  - scenario: "Same EnrollmentPeriod referenced by two activations at once"
    guarantee: "An EnrollmentPeriod can only be CONSUMED once; second activation rejected"
    error_id: ERR_PERIOD_ALREADY_CONSUMED
    http_status: 409
    serialization: "First-writer-wins on EnrollmentPeriod.consumed_by_enrollment_id"

  - scenario: "Two DrugClaim adjudications race on the same DrugPhaseLedger"
    guarantee: "Claims are linearized by adjudicated_at; one wins, the other re-evaluates phase against updated ledger or is rejected if the ledger advanced past the claim's expected phase"
    error_id: ERR_LEDGER_VERSION_STALE
    http_status: 409
    serialization: "Compare DrugPhaseLedger.version; loser retries with current version"

  - scenario: "Reverse and adjudicate-next-claim race on the same DrugPhaseLedger"
    guarantee: "Reversal must observe no later ADJUDICATED claim; if a newer claim adjudicated first, the reversal is rejected to preserve the compensating invariant (total ledger counters must equal sum of remaining ADJUDICATED claims)"
    error_id: ERR_REVERSE_BLOCKED_BY_LATER_CLAIM
    http_status: 409
    serialization: "Compare DrugPhaseLedger.last_adjudicated_claim_id"

  - scenario: "Medigap GI evaluation and underwriting begun simultaneously on one application"
    guarantee: "Exactly one resolves; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on MedigapPolicy.status"

  - scenario: "Two transfers during AEP for the same beneficiary's Part C enrollment"
    guarantee: "Only one transfer succeeds; second sees the original ACTIVE row already TERMINATED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Enrollment.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: medicare_eligibility_window_calc
    trigger: "Beneficiary creation or any update to date_of_birth, has_disability, ssdi_start_date, has_esrd"
    algorithm: threshold
    formula: |
      if has_esrd == true:
          medicare_eligibility_date = first_of_month(date_of_birth)   # treated as immediately eligible at birth-month for test reachability
      elif has_disability == true and ssdi_start_date is not null:
          medicare_eligibility_date = first_of_month(ssdi_start_date + 24_months)
      else:
          medicare_eligibility_date = first_of_month(date_of_birth + 65_years)

      iep_start_date = first_of_month(medicare_eligibility_date - 3_months)
      iep_end_date   = last_of_month(medicare_eligibility_date + 3_months)   # inclusive 23:59:59 UTC
    input_set: "Single Beneficiary row; no other rows."
    constants:
      IEP_PRE_MONTHS: 3
      IEP_POST_MONTHS: 3
      MEDICARE_AGE_YEARS: 65
      SSDI_WAIT_MONTHS: 24
    precision: "Day-level boundaries; iep_end_date is the LAST second of the month (23:59:59 UTC)."

  - name: donut_hole_phase_calc
    trigger: "DrugClaim.SUBMITTED -> ADJUDICATED transition"
    algorithm: chronological
    formula: |
      # Inputs from the referencing Plan (PART_D):
      #   D = Plan.annual_deductible_cents
      #   I = Plan.initial_coverage_limit_cents          (drug-spend limit ending INITIAL_COVERAGE)
      #   C = Plan.catastrophic_threshold_cents          (TrOOP limit starting CATASTROPHIC)
      # Ledger state BEFORE this claim:
      #   ded_paid = DrugPhaseLedger.deductible_paid_cents
      #   spend    = DrugPhaseLedger.total_drug_spend_cents
      #   troop    = DrugPhaseLedger.troop_cents
      # New claim:
      #   g = gross_cost_cents
      #
      # Phases process the claim in chronological ledger order (oldest fill_date first; if fill_dates tie,
      # by DrugClaim.id ASC). The single claim may span multiple phases — process bytes left-to-right:
      #
      # Step 1 (DEDUCTIBLE): cover = min(g, max(0, D - ded_paid))
      #   beneficiary += cover; ded_paid += cover; spend += cover; troop += cover; g -= cover
      #
      # Step 2 (INITIAL_COVERAGE): cover = min(g, max(0, I - spend))
      #   beneficiary_share = round_half_up(cover * COPAY_RATE_INITIAL[tier])
      #   plan_share = cover - beneficiary_share
      #   beneficiary += beneficiary_share; plan += plan_share
      #   spend += cover; troop += beneficiary_share; g -= cover
      #
      # Step 3 (COVERAGE_GAP / Donut Hole): cover = min(g, max(0, C_spend_remaining_in_gap_bytes))
      #   beneficiary_share = round_half_up(cover * GAP_RATE)   # GAP_RATE = 0.25 (beneficiary pays 25% in gap)
      #   plan_share = cover - beneficiary_share
      #   beneficiary += beneficiary_share; plan += plan_share
      #   spend += cover; troop += beneficiary_share; g -= cover
      #   # transition to CATASTROPHIC when troop >= C
      #
      # Step 4 (CATASTROPHIC): for remaining g:
      #   beneficiary_share = round_half_up(g * CATASTROPHIC_RATE)  # CATASTROPHIC_RATE = 0.05
      #   plan_share = g - beneficiary_share
      #
      # Rounding pin (per Rule 2 mode (b)): round_half_up is applied ONCE PER PHASE-SHARE inside each
      # phase, NOT once at the end of the claim. The order is: deductible (no rounding — 100% to bene),
      # initial (round), gap (round), catastrophic (round). Summing the four rounded shares gives the
      # claim totals.
      #
      # phase_at_adjudication = the LAST phase any byte of this claim touched.

      # After all four steps, set DrugPhaseLedger.current_phase to the phase that the NEXT byte (if any
      # additional spend occurred) would enter, using the updated counters.

    input_set: "All ADJUDICATED DrugClaim rows for this beneficiary's PART_D Enrollment within the plan_year, processed in chronological order. SUBMITTED and REVERSED claims excluded."
    constants:
      COPAY_RATE_INITIAL_TIER_1: 0.05
      COPAY_RATE_INITIAL_TIER_2: 0.15
      COPAY_RATE_INITIAL_TIER_3: 0.25
      COPAY_RATE_INITIAL_TIER_4: 0.40
      COPAY_RATE_INITIAL_TIER_5: 0.50
      GAP_RATE: 0.25
      CATASTROPHIC_RATE: 0.05
    precision: "Round each per-phase beneficiary_share to integer cents using round_half_up. plan_share = cover - beneficiary_share by subtraction (no second rounding)."
    variants:
      - name: forward_estimate
        when: "Endpoint GET /beneficiaries/{id}/drug-cost-estimate?gross=<g> (projection-only, does not write the ledger)"
        difference: |
          Computes the same phase walk on a SNAPSHOT of the ledger but does NOT mutate state. Forward
          variant projects a hypothetical fill at NOW using current ledger snapshot — chronological
          variant replays ALL ADJUDICATED claims in fill_date order ignoring submission order. For
          fills made out-of-fill-order (a claim with an EARLIER fill_date adjudicated AFTER a later
          fill), the two variants produce DIFFERENT beneficiary_cost_cents and phase_at_adjudication.

  - name: late_enrollment_penalty_calc
    trigger: "Enrollment.PENDING -> ACTIVE transition when months_late > 0 AND part_covered IN {PART_B, PART_D}"
    algorithm: tiered_pricing
    formula: |
      # Two part-specific variants share this calc — see variants[].
      # Common preface:
      months_late = compute_months_late(beneficiary, enrollment.effective_date, part_covered)
      base = Plan.monthly_premium_cents

      if part_covered == PART_B:
          # Part B LEP: 10% of national average Part B premium for each 12 months late.
          # National average is a CONSTANT named NATIONAL_AVG_PART_B_PREMIUM_CENTS.
          full_years = months_late // 12
          penalty_rate_decimal = full_years * 0.10
          monthly_penalty_cents = round_half_up(NATIONAL_AVG_PART_B_PREMIUM_CENTS * penalty_rate_decimal)
      else:  # PART_D
          # Part D LEP: 1% of national base beneficiary premium per uncovered MONTH (not full year).
          penalty_rate_decimal = months_late * 0.01
          monthly_penalty_cents = round_half_up(NATIONAL_AVG_PART_D_BASE_PREMIUM_CENTS * penalty_rate_decimal)
    input_set: "One Enrollment row at activation time. No aggregation over other rows."
    constants:
      NATIONAL_AVG_PART_B_PREMIUM_CENTS: 17490   # $174.90
      NATIONAL_AVG_PART_D_BASE_PREMIUM_CENTS: 3678   # $36.78
      LEP_PARTB_PER_YEAR: 0.10
      LEP_PARTD_PER_MONTH: 0.01
    precision: "round_half_up to integer cents on monthly_penalty_cents."
    variants:
      - name: part_b_variant
        when: "part_covered = PART_B"
        difference: "Computed per full 12-month block (floor division). 11 months late = 0% penalty; 12 months = 10%; 23 months = 10%; 24 months = 20%."
      - name: part_d_variant
        when: "part_covered = PART_D"
        difference: "Computed per uncovered MONTH (no flooring to year). 11 months late = 11%; 12 months = 12%. Same months_late under the same beneficiary therefore yields DIFFERENT penalty_rate_decimal and DIFFERENT monthly_penalty_cents for B vs D — dual-variant on different entity-domain (Part-B premium ledger vs Part-D drug coverage)."

  - name: star_rating_weighted_score
    trigger: "POST /plans/{id}/star-ratings (new StarRatingSnapshot) OR PATCH a StarRatingSnapshot"
    algorithm: weighted_scoring
    formula: |
      # Weighted composite of three raw scores -> half-star band.
      composite_raw = (
          W_CLINICAL * clinical_quality_score
        + W_EXPERIENCE * member_experience_score
        + W_SERVICE * customer_service_score
      )
      # Weights sum to 1.0: 0.50 + 0.30 + 0.20

      # Map composite_raw (0..100) to star_rating in half-stars 1.0..5.0:
      # 90 <= raw -> 5.0
      # 80 <= raw <  90 -> 4.5
      # 70 <= raw <  80 -> 4.0
      # 60 <= raw <  70 -> 3.5
      # 50 <= raw <  60 -> 3.0
      # 40 <= raw <  50 -> 2.5
      # 30 <= raw <  40 -> 2.0
      # 20 <= raw <  30 -> 1.5
      #       raw <  20 -> 1.0
      weighted_star_rating = band(composite_raw)
      # Side effect: Plan.star_rating := weighted_star_rating IF and only IF measurement_year == max(measurement_year across StarRatingSnapshot for this plan_id).
    input_set: "One StarRatingSnapshot row; the latest published snapshot per Plan determines Plan.star_rating."
    constants:
      W_CLINICAL: 0.50
      W_EXPERIENCE: 0.30
      W_SERVICE: 0.20
    precision: "composite_raw kept to 4 decimal places before banding. Banding uses STRICTLY GREATER-THAN-OR-EQUAL boundaries (raw exactly 90.0000 -> 5.0)."

  - name: plan_total_monthly_cost_calc
    trigger: "GET /enrollments/{id}/cost-summary"
    algorithm: aggregation
    formula: |
      # Effective monthly cost the beneficiary owes for a given Enrollment row.
      # Provisional vs final variants (dual-variant on Enrollment, dollar-cost domain).
      base = Plan.monthly_premium_cents
      lep  = LateEnrollmentPenalty.monthly_penalty_cents if exists else 0
      effective_premium_cents = base + lep
    input_set: "One Enrollment row + at most one LateEnrollmentPenalty row."
    constants: {}
    precision: "Integer cents."
    variants:
      - name: provisional
        when: "Enrollment.status = PENDING"
        difference: "Uses Plan.monthly_premium_cents AT QUERY TIME (live) and projects what the LEP WOULD be if activated today (calls late_enrollment_penalty_calc against the current effective_date)."
      - name: final
        when: "Enrollment.status = ACTIVE"
        difference: "Uses LateEnrollmentPenalty.snapshot_base_premium_cents (frozen at activation) plus the stored monthly_penalty_cents. Changing Plan.monthly_premium_cents after activation does NOT change the final value — so identical inputs at PENDING vs ACTIVE produce different effective_premium_cents."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role header value in {PlanAdmin, BenefitsCounselor, Beneficiary, Auditor}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path parameter resources exist; validated left-to-right (beneficiary first, then nested resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Body FK references resolve (plan_id, enrollment_period_id, enrollment_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /enrollments, POST /drug-claims, POST /medigap-policies"

  - priority: 6
    category: state
    check: "Beneficiary.lifecycle_status != DECEASED"
    error_id: ERR_BENEFICIARY_DECEASED
    http_status: 409
    applies_to: "POST /enrollments, POST /drug-claims, POST /medigap-policies, and all action endpoints"

  - priority: 7
    category: state
    check: "Target entity in valid source state for the transition (e.g., Enrollment.status = PENDING for /activate)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "Plan.is_active = true at enrollment creation"
    error_id: ERR_PLAN_INACTIVE
    http_status: 422
    applies_to: "POST /enrollments"

  - priority: 9
    category: business_safety
    check: "Drug claim's referenced Enrollment.part_covered = PART_D"
    error_id: ERR_NON_PART_D_CLAIM
    http_status: 422
    applies_to: "POST /drug-claims, POST /drug-claims/{id}/adjudicate"

  - priority: 10
    category: business_temporal
    check: "Referenced EnrollmentPeriod.status = OPEN at time-of-request"
    error_id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate, POST /medigap-policies, MedigapPolicy /evaluate-gi"

  - priority: 11
    category: business_temporal
    check: "Enrollment.effective_date falls within referenced EnrollmentPeriod's [window_start, window_end] inclusive"
    error_id: ERR_EFFECTIVE_DATE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /enrollments/{id}/activate"

  - priority: 12
    category: business_temporal
    check: "DrugClaim.fill_date within [Enrollment.effective_date, COALESCE(Enrollment.termination_date, end-of-plan-year)]"
    error_id: ERR_FILL_DATE_OUT_OF_COVERAGE
    http_status: 422
    applies_to: "POST /drug-claims, POST /drug-claims/{id}/adjudicate"

  - priority: 13
    category: business_referential
    check: "No overlapping ACTIVE Enrollment for (beneficiary_id, part_covered) — overlap means new [effective_date, termination_date or +infinity) ∩ existing != ∅"
    error_id: ERR_DUPLICATE_PART_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments/{id}/activate"

  - priority: 14
    category: business_referential
    check: "Medigap GI evaluation requires Plan.state_code = Beneficiary.state_code"
    error_id: ERR_MEDIGAP_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /medigap-policies, /evaluate-gi"

  - priority: 15
    category: business_constraint
    check: "DrugPhaseLedger reverse-claim invariant: after reversal, sum of beneficiary_cost_cents/plan_cost_cents/spend/troop across remaining ADJUDICATED claims MUST equal the new ledger counters exactly"
    error_id: ERR_LEDGER_INVARIANT_BREACH
    http_status: 409
    applies_to: "POST /drug-claims/{id}/reverse"

  - priority: 16
    category: business_constraint
    check: "Enrollment.transfer requires AEP period OPEN and Plan.plan_year of the new Plan = old Plan.plan_year + 1"
    error_id: ERR_TRANSFER_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /enrollments/{id}/transfer"

  - priority: 17
    category: business_fiscal
    check: "Plan.monthly_premium_cents > 0 for non-PART_A enrollments at activation"
    error_id: ERR_INVALID_PREMIUM
    http_status: 422
    applies_to: "POST /enrollments/{id}/activate"

  - priority: 18
    category: business_constraint
    check: "Same actor cannot both submit and adjudicate a single DrugClaim (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /drug-claims/{id}/adjudicate"

  - priority: 19
    category: business_constraint
    check: "Optimistic concurrency: client-supplied version (when present) matches stored version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "All PATCH endpoints and action endpoints accepting `version`"

  - priority: 20
    category: business_constraint
    check: "Request body schema/value validation (types, ranges, required fields)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Beneficiaries ----
  - method: POST
    path: "/beneficiaries"
    description: "Create a beneficiary. Server computes medicare_eligibility_date, iep_start_date, iep_end_date."
    roles: [PlanAdmin]
    code: 201
    input: ["full_name", "date_of_birth", "medicare_id", "has_esrd?", "has_disability?", "ssdi_start_date?", "state_code"]
    output: Beneficiary
    side_effects:
      - "Run medicare_eligibility_window_calc"
      - "Create one EnrollmentPeriod row (period_type=IEP, status=SCHEDULED, window_start=iep_start_date, window_end=iep_end_date)"

  - method: GET
    path: "/beneficiaries/{id}"
    description: "Fetch a beneficiary with all computed fields."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: Beneficiary

  - method: GET
    path: "/beneficiaries"
    description: "List beneficiaries with pagination and optional filters (lifecycle_status, state_code)."
    roles: [PlanAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?", "lifecycle_status?", "state_code?"]
    output: Beneficiary[]

  - method: POST
    path: "/beneficiaries/{id}/mark-deceased"
    description: "Mark beneficiary deceased, cascade-terminate all enrollments and Medigap policies."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: Beneficiary
    side_effects:
      - "Beneficiary.lifecycle_status -> DECEASED"
      - "All ACTIVE Enrollment.status -> TERMINATED"
      - "All APPLIED/UNDERWRITING/ISSUED MedigapPolicy.status -> CANCELLED"
      - "All SUBMITTED DrugClaim.status -> REVERSED"

  # ---- Plans ----
  - method: POST
    path: "/plans"
    description: "Create a plan."
    roles: [PlanAdmin]
    code: 201
    input: ["plan_code", "plan_type", "plan_year", "state_code?", "monthly_premium_cents", "annual_deductible_cents?", "initial_coverage_limit_cents?", "catastrophic_threshold_cents?", "star_rating"]
    output: Plan

  - method: GET
    path: "/plans/{id}"
    description: "Fetch a plan."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: Plan

  - method: GET
    path: "/plans"
    description: "List plans; supports filtering by plan_type, plan_year, state_code, min_star_rating."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: ["limit?", "offset?", "plan_type?", "plan_year?", "state_code?", "min_star_rating?"]
    output: Plan[]

  - method: POST
    path: "/plans/{id}/star-ratings"
    description: "Publish a new StarRatingSnapshot; updates Plan.star_rating if latest year."
    roles: [PlanAdmin]
    code: 201
    input: [measurement_year, clinical_quality_score, member_experience_score, customer_service_score]
    output: StarRatingSnapshot
    side_effects:
      - "Run star_rating_weighted_score"
      - "If measurement_year is the latest for this plan_id, Plan.star_rating := weighted_star_rating"

  # ---- EnrollmentPeriods ----
  - method: POST
    path: "/beneficiaries/{beneficiary_id}/enrollment-periods"
    description: "Open a non-IEP period (AEP, GEP, SEP_MOVE, SEP_LOSS_OF_COVERAGE, MEDIGAP_GI). status starts SCHEDULED unless window covers now() in which case OPEN."
    roles: [PlanAdmin]
    code: 201
    input: [period_type, window_start, window_end]
    output: EnrollmentPeriod

  - method: GET
    path: "/beneficiaries/{beneficiary_id}/enrollment-periods"
    description: "List periods for a beneficiary; filter by status, period_type."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "period_type?"]
    output: EnrollmentPeriod[]

  # ---- Enrollments ----
  - method: POST
    path: "/enrollments"
    description: "Create an Enrollment in PENDING state, citing a Plan and EnrollmentPeriod and proposed effective_date."
    roles: [BenefitsCounselor]
    code: 201
    input: [beneficiary_id, plan_id, enrollment_period_id, effective_date]
    output: Enrollment

  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate an Enrollment. Triggers months_late computation, possible LEP creation, possible Beneficiary lifecycle transition, possible DrugPhaseLedger creation."
    roles: [BenefitsCounselor]
    code: 200
    input: ["version?"]
    output: Enrollment
    side_effects:
      - "Enrollment.status PENDING -> ACTIVE"
      - "Mark EnrollmentPeriod CONSUMED if period_type IN {IEP, MEDIGAP_GI}"
      - "Possibly create LateEnrollmentPenalty (run late_enrollment_penalty_calc)"
      - "Bubble Beneficiary.lifecycle_status -> ENROLLED"
      - "If PART_D: create DrugPhaseLedger"

  - method: POST
    path: "/enrollments/{id}/reject"
    description: "Reject a pending Enrollment."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: Enrollment

  - method: POST
    path: "/enrollments/{id}/terminate"
    description: "Terminate an ACTIVE Enrollment. Triggers SEP_LOSS_OF_COVERAGE period creation and Beneficiary lifecycle re-evaluation."
    roles: [BenefitsCounselor]
    code: 200
    input: ["termination_date", "version?"]
    output: Enrollment
    side_effects:
      - "Enrollment.status ACTIVE -> TERMINATED"
      - "Open SEP_LOSS_OF_COVERAGE period (window_start=today, window_end=today+63d)"
      - "Bubble Beneficiary lifecycle_status (ENROLLED -> COVERAGE_GAP if no other ACTIVE)"
      - "Freeze DrugPhaseLedger.current_phase if PART_D"

  - method: POST
    path: "/enrollments/{id}/transfer"
    description: "Transfer a Part C enrollment to a new Plan during AEP. Old terminated Dec 31; new active Jan 1 next year."
    roles: [BenefitsCounselor]
    code: 200
    input: ["new_plan_id", "version?"]
    output: Enrollment
    side_effects:
      - "Old Enrollment.status ACTIVE -> TERMINATED, termination_date = Dec 31 of plan_year"
      - "Create new Enrollment ACTIVE with effective_date = Jan 1 of plan_year+1, fresh DrugPhaseLedger"

  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: Enrollment

  - method: GET
    path: "/beneficiaries/{beneficiary_id}/enrollments"
    description: "List enrollments for a beneficiary."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "part_covered?"]
    output: Enrollment[]

  - method: GET
    path: "/enrollments/{id}/cost-summary"
    description: "Return cost-summary { effective_premium_cents, base_premium_cents, lep_cents } using provisional or final variant per Enrollment.status."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: "{ effective_premium_cents, base_premium_cents, lep_cents, variant }"

  # ---- Late Enrollment Penalty ----
  - method: GET
    path: "/late-enrollment-penalties/{id}"
    description: "Fetch a LateEnrollmentPenalty record."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: LateEnrollmentPenalty

  - method: GET
    path: "/beneficiaries/{beneficiary_id}/late-enrollment-penalties"
    description: "List LEPs for a beneficiary."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: ["limit?", "offset?", "part?"]
    output: LateEnrollmentPenalty[]

  # ---- Medigap ----
  - method: POST
    path: "/medigap-policies"
    description: "Apply for a Medigap policy."
    roles: [BenefitsCounselor]
    code: 201
    input: ["beneficiary_id", "plan_id", "underwriting_uplift_decimal?"]
    output: MedigapPolicy

  - method: POST
    path: "/medigap-policies/{id}/evaluate-gi"
    description: "Attempt to convert APPLIED to GUARANTEED_ISSUED using an OPEN MEDIGAP_GI period."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: MedigapPolicy

  - method: POST
    path: "/medigap-policies/{id}/begin-underwriting"
    description: "Move APPLIED to UNDERWRITING when no GI period covers."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: MedigapPolicy

  - method: POST
    path: "/medigap-policies/{id}/revise-application"
    description: "Cyclic: return UNDERWRITING -> APPLIED so beneficiary may amend the application."
    roles: [BenefitsCounselor]
    code: 200
    input: ["version?"]
    output: MedigapPolicy

  - method: POST
    path: "/medigap-policies/{id}/issue"
    description: "Issue from GUARANTEED_ISSUED or UNDERWRITING. Premium lock differs by branch."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: MedigapPolicy

  - method: POST
    path: "/medigap-policies/{id}/deny"
    description: "Deny from UNDERWRITING."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: MedigapPolicy

  - method: POST
    path: "/medigap-policies/{id}/cancel"
    description: "Cancel from APPLIED/UNDERWRITING/ISSUED."
    roles: [BenefitsCounselor]
    code: 200
    input: ["version?"]
    output: MedigapPolicy

  - method: GET
    path: "/medigap-policies/{id}"
    description: "Fetch a Medigap policy."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: MedigapPolicy

  # ---- DrugClaims & Ledger ----
  - method: POST
    path: "/drug-claims"
    description: "Submit a drug claim under a PART_D Enrollment. Status starts SUBMITTED."
    roles: [BenefitsCounselor]
    code: 201
    input: [beneficiary_id, enrollment_id, ndc_code, tier, fill_date, gross_cost_cents]
    output: DrugClaim

  - method: POST
    path: "/drug-claims/{id}/adjudicate"
    description: "Adjudicate a SUBMITTED claim. Runs donut_hole_phase_calc."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: DrugClaim
    side_effects:
      - "DrugClaim.status SUBMITTED -> ADJUDICATED"
      - "Run donut_hole_phase_calc"
      - "Update DrugPhaseLedger.{deductible_paid_cents, total_drug_spend_cents, troop_cents, current_phase, last_adjudicated_claim_id}"

  - method: POST
    path: "/drug-claims/{id}/reverse"
    description: "Reverse a claim (SUBMITTED or last ADJUDICATED). Restores ledger to pre-claim state if was ADJUDICATED."
    roles: [PlanAdmin]
    code: 200
    input: ["version?"]
    output: DrugClaim
    side_effects:
      - "DrugClaim.status -> REVERSED"
      - "If was ADJUDICATED: roll back DrugPhaseLedger counters"

  - method: GET
    path: "/drug-claims/{id}"
    description: "Fetch a drug claim."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: DrugClaim

  - method: GET
    path: "/beneficiaries/{beneficiary_id}/drug-phase-ledger"
    description: "Fetch current ledger for the beneficiary's active PART_D Enrollment (latest plan_year)."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: ["plan_year?"]
    output: DrugPhaseLedger

  - method: GET
    path: "/beneficiaries/{beneficiary_id}/drug-cost-estimate"
    description: "Run the forward-estimate variant of donut_hole_phase_calc against the current ledger for a hypothetical fill."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary]
    code: 200
    input: [gross_cost_cents, tier]
    output: "{ beneficiary_cost_cents, plan_cost_cents, phase_at_adjudication }"

  # ---- Test clock / system endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the test clock. Triggers SCHEDULED->OPEN, OPEN->CLOSED on EnrollmentPeriods, and Beneficiary lifecycle auto-transitions (PRE_ELIGIBLE -> IEP_OPEN, IEP_OPEN -> IEP_CLOSED)."
    roles: [PlanAdmin, Auditor]
    code: 200
    input: [to]
    output: "{ now: ISO8601, transitions_applied: [{entity_type, entity_id, from, to}] }"
    side_effects:
      - "Recompute EnrollmentPeriod.status for every period: SCHEDULED if now()<window_start; OPEN if window_start<=now()<=window_end; CLOSED if now()>window_end AND not CONSUMED"
      - "Re-evaluate Beneficiary.lifecycle_status (PRE_ELIGIBLE -> IEP_OPEN -> IEP_CLOSED auto-transitions)"

  - method: GET
    path: "/_clock"
    description: "Read the current test-clock time."
    roles: [PlanAdmin, BenefitsCounselor, Beneficiary, Auditor]
    code: 200
    input: []
    output: "{ now: ISO8601 }"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing X-User-Role or X-User-ID header"
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role not one of {PlanAdmin, BenefitsCounselor, Beneficiary, Auditor}"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for the requested endpoint or resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path parameter id does not resolve"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign-key (plan_id, enrollment_period_id, enrollment_id) does not resolve"
  - id: ERR_VALIDATION
    http: 422
    condition: "Body field is missing, wrong type, or outside declared constraints"
  - id: ERR_BENEFICIARY_DECEASED
    http: 409
    condition: "Operation targets a Beneficiary with lifecycle_status=DECEASED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a valid source state for this transition"
  - id: ERR_PLAN_INACTIVE
    http: 422
    condition: "Plan.is_active = false at enrollment activation"
  - id: ERR_NON_PART_D_CLAIM
    http: 422
    condition: "DrugClaim references an Enrollment with part_covered != PART_D"
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "Referenced EnrollmentPeriod.status != OPEN"
  - id: ERR_PERIOD_ALREADY_CONSUMED
    http: 409
    condition: "EnrollmentPeriod.consumed_by_enrollment_id already set"
  - id: ERR_EFFECTIVE_DATE_OUTSIDE_PERIOD
    http: 422
    condition: "Enrollment.effective_date not within referenced EnrollmentPeriod window"
  - id: ERR_FILL_DATE_OUT_OF_COVERAGE
    http: 422
    condition: "DrugClaim.fill_date not within the referenced Enrollment's coverage interval"
  - id: ERR_DUPLICATE_PART_ENROLLMENT
    http: 409
    condition: "Beneficiary already has overlapping ACTIVE Enrollment for the same part_covered"
  - id: ERR_MEDIGAP_STATE_MISMATCH
    http: 422
    condition: "Medigap Plan.state_code != Beneficiary.state_code"
  - id: ERR_LEDGER_INVARIANT_BREACH
    http: 409
    condition: "Reverse would break the ledger compensating invariant (e.g., reversing an older claim with newer ADJUDICATED claims still in place)"
  - id: ERR_REVERSE_BLOCKED_BY_LATER_CLAIM
    http: 409
    condition: "A more recent ADJUDICATED claim exists for the same ledger; reverse must wait"
  - id: ERR_LEDGER_VERSION_STALE
    http: 409
    condition: "Adjudication observed a stale DrugPhaseLedger.version"
  - id: ERR_TRANSFER_WINDOW_INVALID
    http: 422
    condition: "Transfer outside an OPEN AEP period or new plan_year != old plan_year+1"
  - id: ERR_INVALID_PREMIUM
    http: 422
    condition: "Plan.monthly_premium_cents <= 0 at enrollment activation for non-PART_A"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID submitted and is attempting to adjudicate the same DrugClaim"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic-concurrency version mismatch on mutation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdmin
    description: "Plan administrator. Creates plans, adjudicates drug claims, evaluates Medigap GI/underwriting, marks beneficiaries deceased, advances the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /beneficiaries"
      - "POST /beneficiaries/{id}/mark-deceased"
      - "POST /plans"
      - "POST /plans/{id}/star-ratings"
      - "POST /beneficiaries/{beneficiary_id}/enrollment-periods"
      - "POST /enrollments/{id}/reject"
      - "POST /medigap-policies/{id}/evaluate-gi"
      - "POST /medigap-policies/{id}/begin-underwriting"
      - "POST /medigap-policies/{id}/issue"
      - "POST /medigap-policies/{id}/deny"
      - "POST /drug-claims/{id}/adjudicate"
      - "POST /drug-claims/{id}/reverse"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /beneficiaries, GET /beneficiaries/{id}"
      - "GET /plans, GET /plans/{id}"
      - "GET /enrollments/{id}, GET /beneficiaries/{beneficiary_id}/enrollments"
      - "GET /medigap-policies/{id}"
      - "GET /drug-claims/{id}, GET /beneficiaries/{beneficiary_id}/drug-phase-ledger"
      - "GET /enrollments/{id}/cost-summary"

  - name: BenefitsCounselor
    description: "Counsels beneficiaries; creates Enrollments and submits DrugClaims; cannot adjudicate own submissions (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/terminate"
      - "POST /enrollments/{id}/transfer"
      - "POST /medigap-policies"
      - "POST /medigap-policies/{id}/revise-application"
      - "POST /medigap-policies/{id}/cancel"
      - "POST /drug-claims"
    shared_operations:
      - "GET /beneficiaries/{id}, GET /plans, GET /plans/{id}"
      - "GET /enrollments/{id}, GET /beneficiaries/{beneficiary_id}/enrollments"
      - "GET /medigap-policies/{id}"
      - "GET /drug-claims/{id}, GET /beneficiaries/{beneficiary_id}/drug-phase-ledger"
      - "GET /enrollments/{id}/cost-summary"
      - "GET /beneficiaries/{beneficiary_id}/drug-cost-estimate"

  - name: Beneficiary
    description: "End-user. Read-only to own resources only; identity is the Beneficiary.id in X-User-ID."
    identity: "entity_backed:Beneficiary"
    exclusive_operations: []
    shared_operations:
      - "GET /beneficiaries/{id} (only when {id} == X-User-ID)"
      - "GET /plans, GET /plans/{id}"
      - "GET /beneficiaries/{beneficiary_id}/enrollments (only when beneficiary_id == X-User-ID)"
      - "GET /enrollments/{id} (only when Enrollment.beneficiary_id == X-User-ID)"
      - "GET /medigap-policies/{id} (only when MedigapPolicy.beneficiary_id == X-User-ID)"
      - "GET /drug-claims/{id} (only when DrugClaim.beneficiary_id == X-User-ID)"
      - "GET /beneficiaries/{beneficiary_id}/drug-phase-ledger (only when beneficiary_id == X-User-ID)"
      - "GET /enrollments/{id}/cost-summary (only when Enrollment.beneficiary_id == X-User-ID)"
      - "GET /beneficiaries/{beneficiary_id}/drug-cost-estimate (only when beneficiary_id == X-User-ID)"

  - name: Auditor
    description: "Read-only oversight role spanning all beneficiaries; cannot mutate."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /beneficiaries, GET /beneficiaries/{id}"
      - "GET /plans, GET /plans/{id}"
      - "GET /beneficiaries/{beneficiary_id}/enrollment-periods"
      - "GET /enrollments/{id}, GET /beneficiaries/{beneficiary_id}/enrollments"
      - "GET /medigap-policies/{id}"
      - "GET /drug-claims/{id}, GET /beneficiaries/{beneficiary_id}/drug-phase-ledger"
      - "GET /enrollments/{id}/cost-summary"
      - "GET /_clock"
