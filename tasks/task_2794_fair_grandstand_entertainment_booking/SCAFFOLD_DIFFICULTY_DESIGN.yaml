  # ===========================================================================
  # RULE 6 - Boundary precision on two different metrics at two endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: talent_budget_cap_exact_equality_then_one_cent_over
        grounds:
          - validations.priority_46
          - calculations.edition_committed_guarantee_total
          - entities.FairEdition.fields.talent_budget_cap_cents
          - entities.FairEdition.fields.committed_guarantee_total_cents
          - errors.ERR_TALENT_BUDGET_EXCEEDED
        distinguishing_aspect: |
          METRIC: encumbered money in integer cents, at ENDPOINT
          POST /grandstand/offers/{offer_id}/send. The declared endpoint is the inclusive
          upper bound: committed_guarantee_total_cents == talent_budget_cap_cents is
          allowed, cap + 1 cent is not. The pair of sends probes the two adjacent integers
          around the same cap - 12500000 succeeds and 12500001 fails - so an implementation
          using a strict > cap test or a >= cap test is caught in one direction or the other.
        test_recipe:
          setup:
            - "Edition with talent_budget_cap_cents 12500000 and nothing yet committed."
            - "Offer A: guarantee exactly 12500000 for a COUNTRY act on 2026-08-22."
            - "Offer B: guarantee 1 cent for a JAZZ act on 2026-08-25 on the same stage, so after A's send the recomputed total would be 12500001, exactly one cent past the cap."
            - "Both offers sit inside the run, inside curfew and clear of every scheduling rule, so priority 46 is the only rule either send can violate."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Budget Boundary Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 12500000, refund_reserve_cents: 5000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar1: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Marsh Street Quartet", genre: "JAZZ", audience_segment: "ADULT", base_draw_score: 40.00 }
              as: TalentBuyer
              captures: { ar2: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar1}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_at_cap: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar2}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 1, backend_split_pct: 0.8000, backend_breakeven_cents: 0, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-25", load_in_start_utc: "2026-08-25T14:00:00.000Z", load_out_end_utc: "2026-08-25T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
