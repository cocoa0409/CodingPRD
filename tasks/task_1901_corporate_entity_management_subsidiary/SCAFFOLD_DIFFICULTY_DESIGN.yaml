              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r_lo: "$.data.id" }
            - call: "POST /api/resolutions/${r_lo}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${r_lo}/adopt"
              payload: { expected_entity_version: "${e_lo_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e_lo}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e_lo}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "GET /api/filings?entity_id=${e_lo}&filing_type=FRANCHISE_TAX&period_year=2026"
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ft_lo: "$.data[0].id" }
            - call: "POST /api/filings/${ft_lo}/prepare"
