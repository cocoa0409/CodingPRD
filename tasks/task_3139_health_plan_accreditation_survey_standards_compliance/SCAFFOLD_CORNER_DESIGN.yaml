  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_header_returns_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with no X-User-Role header fails at priority 1 with 400 before any role check."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /accreditation/health-plans"
              payload: {}
              as: PublicViewer
          assert:
            - "resending GET /accreditation/health-plans with NO X-User-Role header returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the headerless resend is the actual probe; role priority 1 precedes authorization)"
            - "resending with X-User-Role: NoSuchRole returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: ownership_mismatch_plan_coordinator
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_OWNERSHIP_MISMATCH
        distinguishing_aspect: "A PlanCoordinator whose X-User-ID is plan B cannot create a scope under plan A's path: 403 ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["Two plans exist."]
          setup_api_calls:
            - *k_clock
            - *k_plan
            - call: "POST /accreditation/health-plans"
              payload: { name: "Rio Verde Plan", plan_code: "RVP-03" }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
          trigger:
            - call: "POST /accreditation/health-plans/${plan_id}/product-line-scopes"
              payload: { product_line: "MEDICAID", state_codes: ["WA"], member_count: 500 }
              as: PlanCoordinator
              as_user_id: "${plan_b}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_OWNERSHIP_MISMATCH"

      - name: evidence_create_stale_version_returns_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[evidence-create-stale-application]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on evidence create: after the application's version advances (a second evidence item bumps it), replaying the older expected_application_version yields 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Application SUBMITTED; version observed at 2."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "first", expected_application_version: "${app_v}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
          trigger:
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "stale", expected_application_version: "${app_v}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 412, error_id == ERR_STALE_VERSION (app_v was captured before the first create bumped the version)"
            - "GET /accreditation/applications/${app_id}/evidence-items returns exactly 1 item"

      - name: survey_create_stale_version_returns_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[survey-create-stale-application]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on survey create: a second survey created with the version captured before the first survey create is rejected 412."
        test_recipe:
          setup: ["Application SURVEY_SCHEDULING at version V; first survey created with V."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - *k_begin
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM policy", expected_application_version: "${app_vs}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev1: $.data.id }
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v2h: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM procedure", expected_application_version: "${app_v2h}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev2: $.data.id }
            - call: "POST /accreditation/evidence-items/${ev1}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/evidence-items/${ev2}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/advance-to-survey-scheduling"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v5h: $.data.version }
            - *k_survey
          trigger:
            - call: "POST /accreditation/applications/${app_id}/surveys"
              payload: { survey_type: "FULL", mode: "ONSITE", start_date: "2026-10-12", end_date: "2026-10-16", budgeted_surveyor_hours: 4, expected_application_version: "${app_v5h}" }
              as: AccreditationOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 412, error_id == ERR_STALE_VERSION (the first survey create bumped the application version past app_v5h)"

      - name: existence_checked_before_state
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=7]
        distinguishing_aspect: "A bogus session id on complete returns 404 ERR_SURVEY_SESSION_NOT_FOUND, never a state error — existence (priority 4) precedes state (priority 7)."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /accreditation/survey-sessions/00000000-0000-4000-8000-000000000000/complete"
              payload: {}
              as: Surveyor
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 404, error_id == ERR_SURVEY_SESSION_NOT_FOUND"

      - name: case_create_zero_turnaround_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_INVALID_TURNAROUND_DAYS
        distinguishing_aspect: "required_turnaround_days == 0 violates the >= 1 constraint: 422 ERR_INVALID_TURNAROUND_DAYS."
        test_recipe:
          setup: ["OPEN sample."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - *k_begin
            - call: "POST /accreditation/applications/${app_id}/file-review-samples"
              payload: { sample_type: "DENIAL", required_size: 5, timeliness_basis: "DECISION_DATE" }
              as: AccreditationOfficer
              captures: { smp_t: $.data.id }
          trigger:
            - call: "POST /accreditation/file-review-samples/${smp_t}/cases"
              payload: { case_reference: "T0", service_date: "2025-03-01T00:00:00Z", decision_date: "2025-03-10T00:00:00Z", resolution_date: "2025-03-10T00:00:00Z", required_turnaround_days: 0 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 422, error_id == ERR_INVALID_TURNAROUND_DAYS"

      - name: sample_size_below_edition_minimum
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SAMPLE_SIZE_BELOW_MINIMUM
          - validations[priority=12]
        distinguishing_aspect: "required_size 4 against edition minimum 5 is the business_fiscal check at priority 12: 422 ERR_SAMPLE_SIZE_BELOW_MINIMUM."
        test_recipe:
          setup: ["Application EVIDENCE_REVIEW."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - *k_begin
          trigger:
            - call: "POST /accreditation/applications/${app_id}/file-review-samples"
              payload: { sample_type: "DENIAL", required_size: 4, timeliness_basis: "DECISION_DATE" }
              as: AccreditationOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 422, error_id == ERR_SAMPLE_SIZE_BELOW_MINIMUM"

      - name: duplicate_active_application_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_ACTIVE_APPLICATION
        distinguishing_aspect: "Submitting a second application for the same (scope, edition) while the first is non-terminal is 409 ERR_DUPLICATE_ACTIVE_APPLICATION; after the first is withdrawn, the second submits cleanly."
        test_recipe:
          setup: ["Application A1 SUBMITTED; application A2 DRAFT on the same scope and edition."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - call: "POST /accreditation/health-plans/${plan_id}/applications"
              payload: { product_line_scope_id: "${scope_id}", standards_edition_id: "${edition_id}", review_period_start: "2025-01-01T00:00:00Z", review_period_end: "2025-12-31T23:59:59Z" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { app2: $.data.id, app2_v: $.data.version }
          trigger:
            - call: "POST /accreditation/applications/${app2}/submit"
              payload: { expected_application_version: "${app2_v}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /accreditation/applications/${app_id}/withdraw"
              payload: {}
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - call: "POST /accreditation/applications/${app2}/submit"
              payload: { expected_application_version: "${app2_v}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
          assert:
            - "first submit of A2: 409 ERR_DUPLICATE_ACTIVE_APPLICATION"
            - "after withdrawing A1: A2 submits successfully (A1 is terminal)"
            - "AccreditationApplication.${app2}.status == SUBMITTED"

      - name: onsite_same_date_conflict
        claim_type: Violation → Error
        grounds:
