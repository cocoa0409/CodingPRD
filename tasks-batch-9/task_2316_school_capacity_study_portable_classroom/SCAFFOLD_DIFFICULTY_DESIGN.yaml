            payload: { name: "Hollyhock Middle", grade_configuration: "MIDDLE_68", site_acreage: 8.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1, consecutive_reliance_years: 0 }
