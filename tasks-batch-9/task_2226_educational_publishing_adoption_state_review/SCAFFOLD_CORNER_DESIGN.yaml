          - entities.Title.fields.revision_target_cycle_year
        distinguishing_aspect: |
          PLAN records revision_target_cycle_year 2029 and moves an ACTIVE title to
          REVISION_PLANNED; CANCEL_PLAN moves it back to ACTIVE and resets
          revision_target_cycle_year to null without touching the print-unit ledger.
        test_recipe:
          setup:
            - "Title NH-S-5 is ACTIVE with 300 received print units and no submissions"
          setup_api_calls:
