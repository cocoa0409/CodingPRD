scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation, defaults, computed fields, enums,
  # not-found, parent relationships
  # =====================================================================
  - section: entities
    instances:
      - name: case_creation_assigns_open_status_and_version_1
        claim_type: creation
        grounds:
          - entities.Case
          - endpoints
        distinguishing_aspect: "POST /trustee/cases returns 201 with status OPEN, version 1, estate_cash_on_hand_cents 0, allowed_claims_total_cents 0, claim_bar_date null, bar_date_noticed false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20001", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id, st: $.data.status, v: $.data.version, cash: $.data.estate_cash_on_hand_cents, noticed: $.data.bar_date_noticed }
          trigger: []
          assert:
            - "st == OPEN"
            - "v == 1"
            - "cash == 0"
            - "noticed == false"

      - name: case_creation_duplicate_case_number_rejected
        claim_type: type_constraints
        grounds:
          - entities.Case.fields.case_number
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second POST with the same case_number must fail with ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one case 26-20002 exists"]
          setup_api_calls:
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20002", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
          trigger:
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20002", debtor_name: "D2", filed_on: "2026-01-16T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"

      - name: claim_secured_requires_asset_reference
        claim_type: required_fields
        grounds:
          - entities.Claim.fields.secured_by_asset_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Filing a SECURED claim without secured_by_asset_id is rejected ERR_INVALID_REQUEST (400) — conditional required field."
        test_recipe:
          setup: ["case in CLAIMS_ADMINISTRATION", "creditor exists"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-S-1", contact_email: "s@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20003", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 50000, priority_class: "SECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: claim_secured_with_foreign_case_asset_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - errors[ERR_REFERENTIAL_INTEGRITY]
        distinguishing_aspect: "SECURED claim naming an asset that belongs to a DIFFERENT case fails ERR_REFERENTIAL_INTEGRITY (422)."
        test_recipe:
          setup: ["case A and case B both in CLAIMS_ADMINISTRATION", "asset belongs to case A"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-S-2", contact_email: "s2@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20004", debtor_name: "DA", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_a: $.data.id }
            - call: "POST /trustee/cases/${case_a}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { asset_a: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20005", debtor_name: "DB", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_b: $.data.id }
            - call: "POST /trustee/cases/${case_b}/assets"
              payload: { description: "B", scheduled_value_cents: 50000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_b}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_b}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /trustee/cases/${case_b}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 50000, priority_class: "SECURED", secured_by_asset_id: "${asset_a}" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REFERENTIAL_INTEGRITY"

      - name: creditor_insider_default_false
        claim_type: defaults
        grounds:
          - entities.Creditor.fields.insider
        distinguishing_aspect: "Omitting insider on creditor creation yields insider=false; that drives the 90-day (not 365-day) preference window."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-D-1", contact_email: "d@x.com" }
              as: Clerk
              captures: { cid: $.data.id, insider: $.data.insider }
          trigger: []
          assert:
            - "insider == false"

      - name: get_missing_case_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /trustee/cases/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /trustee/cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: claim_list_filter_by_status_and_late
        claim_type: listing
        grounds:
          - endpoints
          - entities.Claim.fields.status
        distinguishing_aspect: "GET /trustee/cases/{id}/claims?status=ALLOWED&late=false returns only matching claims with pagination fields present."
        test_recipe:
          setup: ["case in CLAIMS_ADMINISTRATION with 2 claims: one ALLOWED timely, one FILED late"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-L-1", contact_email: "l@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20006", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { c1: $.data.id }
            - call: "POST /trustee/claims/${c1}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${c1}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-07-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { c2: $.data.id }
          trigger:
            - call: "GET /trustee/cases/${cid}/claims"
              payload: { status: "ALLOWED", late: "false" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { n: "$.data.length()" }
          assert:
            - "n == 1   # only the ALLOWED timely claim is returned"

      - name: asset_realized_proceeds_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Asset.fields.realized_proceeds_cents
        distinguishing_aspect: "Client-supplied realized_proceeds_cents on asset creation is ignored; field stays 0 until a sale consummates."
        test_recipe:
          setup: ["case exists OPEN"]
          setup_api_calls:
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20007", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000, realized_proceeds_cents: 999 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { rp: $.data.realized_proceeds_cents }
          assert:
            - "rp == 0   # computed field ignores client input"

      - name: final_report_immutable_entity_has_no_version
        claim_type: immutability
        grounds:
          - entities.FinalReport
        distinguishing_aspect: "FinalReport is common_fields:false — its representation carries id and created_at but no version field."
        test_recipe:
          setup: ["case driven to FINAL_REPORT (system creates DRAFT FinalReport)"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-FR-1", contact_email: "fr@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20008", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001", objection_window_days: 1 }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { aid: $.data.id }
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 50000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { cl: $.data.id }
            - call: "POST /trustee/claims/${cl}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${cl}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${cid}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/assets/${aid}/mark_for_sale"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/sales"
              payload: { asset_id: "${aid}", buyer_name: "B", hammer_price_cents: 100000, sale_costs_cents: 0 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { sid: $.data.id }
            - call: "POST /trustee/sales/${sid}/approve"
              payload: {}
              as: Court
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: Court
            - call: "POST /trustee/sales/${sid}/consummate"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_distribution"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/plans"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { pid: $.data.id }
            - call: "GET /trustee/cases/${cid}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { cv: $.data.version }
            - call: "POST /trustee/plans/${pid}/confirm"
              payload: { expected_case_version: "${cv}" }
              as: Court
            - call: "GET /trustee/plans/${pid}/dividends"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { div: "$.data[0].id" }
            - call: "POST /trustee/dividends/${div}/post"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
          trigger:
            - call: "GET /trustee/cases/${cid}/final_report"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { fr_status: "$.data[0].status" }
          assert:
            - "fr_status == DRAFT   # system created it on FINAL_REPORT posture"
            - "FinalReport representation has no version field (common_fields:false)"

  # =====================================================================
  # Section: state_machines — valid transitions, invalid-from rejection,
  # terminal lockdown, initial state, side effects
  # =====================================================================
  - section: state_machines
    instances:
      - name: claim_initial_state_is_filed
        claim_type: initial_state
        grounds:
          - state_machines.Claim
        distinguishing_aspect: "A newly filed claim has status FILED and claim_number 1 in its case register."
        test_recipe:
          setup: ["case in CLAIMS_ADMINISTRATION"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-IS-1", contact_email: "is@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20010", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { st: $.data.status, cn: $.data.claim_number }
          assert:
            - "st == FILED"
            - "cn == 1"

      - name: objection_on_filed_claim_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /trustee/claims/{id}/objections on a FILED (never reviewed) claim fails ERR_INVALID_STATE — objections only from UNDER_REVIEW."
        test_recipe:
          setup: ["case in CLAIMS_ADMINISTRATION with a FILED claim"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-IV-1", contact_email: "iv@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20011", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /trustee/claims/${cl}/objections"
              payload: { grounds: "AMOUNT_DISPUTED", proposed_allowed_amount_cents: 0, proposed_priority_class: "GENERAL_UNSECURED" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: withdraw_of_disallowed_claim_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Claim
          - state_machines.ClaimObjection
        distinguishing_aspect: "A DISALLOWED claim (terminal) rejects withdraw with ERR_INVALID_STATE."
        test_recipe:
          setup: ["claim DISALLOWED via sustained objection"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-TL-1", contact_email: "tl@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20012", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { cl: $.data.id }
            - call: "POST /trustee/claims/${cl}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${cl}/objections"
              payload: { grounds: "NOT_OWED", proposed_allowed_amount_cents: 0, proposed_priority_class: "GENERAL_UNSECURED" }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { obj: $.data.id }
            - call: "POST /trustee/objections/${obj}/sustain"
              payload: {}
              as: Court
          trigger:
            - call: "POST /trustee/claims/${cl}/withdraw"
              payload: {}
              as: Creditor
              as_user_id: "${cred}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: convert_or_dismiss_cascades_children
        claim_type: side_effect_execution
        grounds:
          - state_machines.Case.transitions
        distinguishing_aspect: "convert_or_dismiss on a CLAIMS_ADMINISTRATION case cascades: FILED/UNDER_REVIEW claims -> WITHDRAWN, UNDER_INVESTIGATION assets -> ABANDONED, IDENTIFIED actions -> ABANDONED."
        test_recipe:
          setup: ["case in CLAIMS_ADMINISTRATION with one FILED claim, one asset (UNDER_INVESTIGATION after bar date sweep), one IDENTIFIED avoidance action"]
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "C", creditor_ref: "CR-CD-1", contact_email: "cd@x.com" }
              as: Clerk
              captures: { cred: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-20013", debtor_name: "D", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { cid: $.data.id }
            - call: "POST /trustee/cases/${cid}/assets"
              payload: { description: "A", scheduled_value_cents: 100000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { aid: $.data.id }
            - call: "POST /trustee/cases/${cid}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${cid}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${cid}/claims"
              payload: { creditor_id: "${cred}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred}"
              captures: { cl: $.data.id }
            - call: "POST /trustee/cases/${cid}/avoidance_actions"
              payload: { transferee_creditor_id: "${cred}", transfer_date: "2025-12-01T00:00:00Z", transfer_amount_cents: 50000, action_type: "PREFERENCE_547", demand_amount_cents: 50000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { act: $.data.id }
          trigger:
