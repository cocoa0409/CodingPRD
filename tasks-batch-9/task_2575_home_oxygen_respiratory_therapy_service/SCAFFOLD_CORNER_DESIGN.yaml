              as: BranchManager
              captures: { br2_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0270", full_name: "Jo Vance", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0270", full_name: "Kim Sato", branch_id: "${br2_id}", payer_type: "COMMERCIAL", mobility_profile: "ACTIVE_AMBULATORY" }
              as: IntakeCoordinator
              captures: { e_mrn: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br2_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, next_pm_due_date: "2027-06-01" }
              as: BranchManager
