              captures: { king_id: $.data.id }
            - call: "POST /pms/corporate-accounts"
              payload: { hotel_id: "${hotel_id}", name: "Hooli", credit_limit_cents: 100000 }
              as: RevenueManager
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "CORP", kind: "CORPORATE", corporate_account_id: "${acct_id}", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { corp_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Mo M", email: "mo@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${corp_id}", arrival_date: "2026-07-01", departure_date: "2026-07-03" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "POST /pms/corporate-accounts/${acct_id}/suspend"
              payload: { expected_corporate_account_version: "${acct_v}" }
              as: RevenueManager
          trigger:
            - call: "POST /pms/reservations/${res_id}/confirm"
              payload: {}
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger confirm rejected with error_id == ERR_CORPORATE_SUSPENDED (409)"
            - "Reservation.${res_id}.status == HELD (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_inventory_overlap_half_open_interval_adjacency_allowed
        grounds:
          - calculations.availability_sellable
          - validations[priority=11]
          - errors[ERR_NO_AVAILABILITY]
          - entities.Reservation.fields.arrival_date
          - entities.Reservation.fields.departure_date
        distinguishing_aspect: |
          Half-open [arrival, departure) interval semantics on RoomType inventory:
          a reservation 07-03..07-05 does NOT conflict with an existing 07-01..07-03
          (07-03 is the first room's exclusive checkout day) even on inv 1 — adjacency
          at the shared boundary is allowed, while a true overlap is rejected.
        test_recipe:
          setup:
            - "RoomType inv 1; existing reservation 07-01..07-03; new 07-03..07-05 adjacent (ok), then 07-02..07-04 overlapping (rejected)"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Ov1", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "ONE", tier_rank: 1, physical_inventory: 1, base_rate_cents: 10000 }
              as: RevenueManager
              captures: { one_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "No N", email: "no@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${one_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-03" }
              as: FrontDeskAgent
              captures: { res1_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${one_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-03", departure_date: "2026-07-05" }
              as: FrontDeskAgent
              captures: { res2_id: $.data.id }
          trigger:
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${one_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-02", departure_date: "2026-07-04" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "res2 (07-03..07-05) creates 201 — adjacent at 07-03 boundary, no overlap on the half-open interval"
            - "trigger (07-02..07-04) rejected with error_id == ERR_NO_AVAILABILITY (overlaps night 07-02 and 07-03)"

      - name: group_block_cutoff_temporal_window_vs_business_date
        grounds:
          - validations[priority=9]
          - state_machines.GroupBlock.OPEN_to_WASHED
          - errors[ERR_BLOCK_CUTOFF_PASSED]
          - entities.GroupBlock.fields.cutoff_date
          - entities.Hotel.fields.current_business_date
        distinguishing_aspect: |
          Different interval semantics and different resource (GroupBlock cutoff
          window vs the hotel business date, not a per-night room inventory overlap):
          a pickup is allowed while current_business_date <= cutoff_date and rejected
          with ERR_BLOCK_CUTOFF_PASSED once a night audit advances the date past cutoff.
        test_recipe:
          setup:
            - "GroupBlock cutoff 2026-07-01; hotel current_business_date 2026-07-01 (pickup ok); audit advances to 07-02 (> cutoff) -> WASHED, pickup rejected"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Ov2", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id, hotel_v: $.data.version }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "QUEEN", tier_rank: 1, physical_inventory: 9, base_rate_cents: 15000 }
              as: RevenueManager
              captures: { q_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "GRP", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { grp_plan_id: $.data.id }
            - call: "POST /pms/group-blocks"
              payload: { hotel_id: "${hotel_id}", room_type_id: "${q_id}", rate_plan_id: "${grp_plan_id}", block_name: "Late", arrival_date: "2026-07-08", departure_date: "2026-07-10", cutoff_date: "2026-07-01", blocked_rooms: 4 }
              as: RevenueManager
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Pa P", email: "pa@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${q_id}", rate_plan_id: "${grp_plan_id}", arrival_date: "2026-07-08", departure_date: "2026-07-10", group_block_id: "${block_id}", expected_group_block_version: "${block_v}" }
              as: FrontDeskAgent
              captures: { res1_id: $.data.id }
            - call: "POST /pms/night-audit-runs"
              payload: { hotel_id: "${hotel_id}", expected_hotel_version: "${hotel_v}" }
              as: NightAuditor
              captures: { nar_id: $.data.id }
            - call: "GET /pms/hotels/${hotel_id}"
              payload: {}
              as: NightAuditor
              captures: { hotel_v2: $.data.version }
            - call: "POST /pms/night-audit-runs/${nar_id}/complete"
              payload: { expected_hotel_version: "${hotel_v2}" }
              as: NightAuditor
            - call: "GET /pms/group-blocks/${block_id}"
              payload: {}
              as: FrontDeskAgent
              captures: { block_v3: $.data.version }
          trigger:
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${q_id}", rate_plan_id: "${grp_plan_id}", arrival_date: "2026-07-08", departure_date: "2026-07-10", group_block_id: "${block_id}", expected_group_block_version: "${block_v3}" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "res1 picks up while current_business_date (07-01) <= cutoff (07-01): 201"
            - "after audit, GroupBlock.${block_id}.status == WASHED (07-02 > cutoff 07-01)"
            - "trigger pickup rejected with error_id == ERR_BLOCK_CUTOFF_PASSED (409)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_releases_inventory_sold_count_conserved
        grounds:
          - state_machines.Reservation.HELD_to_CANCELLED
          - calculations.availability_sellable
          - entities.AvailabilityCell.fields.sold_count
        distinguishing_aspect: |
          Conserved quantity #1 = sold_count per (room_type, night). Forward create
          raises sold_count by 1; the compensating cancel lowers it by 1, so after
          create+cancel sold_count returns to its pre-create value (0) with zero drift.
        test_recipe:
          setup:
            - "RoomType inv 3; read availability (sold 0), create reservation (sold 1), cancel (sold back to 0)"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Inv1", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "STD", tier_rank: 1, physical_inventory: 3, base_rate_cents: 10000 }
              as: RevenueManager
              captures: { std_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Qu Q", email: "qu@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${std_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-02" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /pms/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDeskAgent
          assert:
            - "GET /pms/availability(room_type_id=std, 07-01..07-02) sold_count == 1 before cancel"
            - "GET /pms/availability(room_type_id=std, 07-01..07-02) sold_count == 0 after cancel (conserved: back to pre-create value)"

      - name: void_incidental_restores_folio_balance_conserved
        grounds:
          - state_machines.Folio
          - calculations.folio_balance
          - entities.Incidental.fields.status
          - entities.Folio.fields.balance_cents
        distinguishing_aspect: |
          Different conserved quantity (Folio.balance_cents in money, not inventory
          counts): posting a 2500 CHARGE raises balance to 2500; the compensating
          void of that line drops it back to 0 — VOIDED lines leave zero drift in the
          folio balance.
        test_recipe:
          setup:
            - "Reservation with OPEN folio; post a CHARGE 2500 (balance 2500), then void it (balance 0)"
          setup_api_calls:
            - call: "POST /pms/hotels"
              payload: { name: "Inv2", current_business_date: "2026-07-01", overbooking_allowance_pct: 0.0 }
              as: RevenueManager
              captures: { hotel_id: $.data.id }
            - call: "POST /pms/room-types"
              payload: { hotel_id: "${hotel_id}", code: "KING", tier_rank: 1, physical_inventory: 3, base_rate_cents: 20000 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /pms/rate-plans"
              payload: { hotel_id: "${hotel_id}", code: "BAR", kind: "BAR", adjustment_mode: "FLAT", adjustment_value: 0, no_show_policy: "NONE" }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Ra R", email: "ra@x.com" }
              as: FrontDeskAgent
              captures: { guest_id: $.data.id }
            - call: "POST /pms/reservations"
              payload: { hotel_id: "${hotel_id}", guest_id: "${guest_id}", room_type_id: "${king_id}", rate_plan_id: "${bar_id}", arrival_date: "2026-07-01", departure_date: "2026-07-03" }
              as: FrontDeskAgent
              captures: { res_id: $.data.id }
            - call: "GET /pms/folios"
              payload: { hotel_id: "${hotel_id}", reservation_id: "${res_id}" }
              as: FrontDeskAgent
              captures: { folio_id: "$.data[0].id", folio_v0: "$.data[0].version"}
            - call: "POST /pms/incidentals"
              payload: { hotel_id: "${hotel_id}", folio_id: "${folio_id}", kind: "CHARGE", description: "Parking", amount_cents: 2500 }
              as: FrontDeskAgent
              captures: { inc_id: $.data.id }
            - call: "GET /pms/folios/${folio_id}"
              payload: {}
              as: FrontDeskAgent
              captures: { folio_v1: $.data.version }
          trigger:
            - call: "POST /pms/incidentals/${inc_id}/void"
              payload: { expected_folio_version: "${folio_v1}" }
              as: FrontDeskAgent
          assert:
            - "Folio.${folio_id}.balance_cents == 2500 after the charge"
            - "Incidental.${inc_id}.status == VOIDED after the trigger"
            - "Folio.${folio_id}.balance_cents == 0 after void (conserved: restored to pre-charge value)"
