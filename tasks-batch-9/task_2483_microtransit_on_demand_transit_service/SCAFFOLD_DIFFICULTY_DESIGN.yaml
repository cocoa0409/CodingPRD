      - name: transfer_credit_waiver_and_multiplier_order_pinned
        grounds:
          - calculations.trip_fare
          - entities.TransitConnection.fields.transfer_credit_cents
          - entities.TransitConnection.fields.guaranteed_transfer_buffer_minutes
          - entities.Rider.fields.fare_category
          - entities.TripRequest.fields.quoted_fare_cents
        distinguishing_aspect: |
          Mode (c) — order of operations: the guaranteed-transfer waiver is decided at step 2 from
          connection linkage and pickup instant alone (5 min from the 07:05Z rail departure, buffer
          10), the REDUCED multiplier is applied once at step 4 (round_half_up(250 * 0.50) = 125),
          and only then is the 80c transfer credit clamped by that post-multiplier fare at step 5,
          yielding 45c. Applying the credit before the multiplier gives 85c and skipping the waiver
          gives 163c, so the single literal 45 discriminates all three orderings.
