  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: studio_session_half_open_overlap_touch_allowed
        grounds:
          - validations[priority=24]
          - state_machines.Session.BOOKED_to_LIVE
          - entities.Session.fields.scheduled_start_utc
          - entities.Session.fields.scheduled_end_utc
        distinguishing_aspect: |
          Resource = Engineer (STUDIO sessions). Interval semantics = half-open
          [start,end) point-overlap with NO buffer: an interval whose start equals
          an existing interval's end (touching) is ALLOWED, but any positive overlap
          is rejected with ERR_SESSION_OVERLAP. This is geometrically distinct from
          the REMOTE buffer rule (which adds a minimum gap).
        test_recipe:
          setup:
            - "Engineer G active with a BOOKED STUDIO session [10:00,12:00) on 2026-03-05."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Stu S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng G" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep G1", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep1: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep1}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-05T10:00:00Z", scheduled_end_utc: "2026-03-05T12:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { s1: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep G2", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep2: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep G3", planned_track_count: 1 }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep3: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep2}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-05T12:00:00Z", scheduled_end_utc: "2026-03-05T13:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { s2_status: $.data.status }
          trigger:
            - call: "POST /sessions"
              payload: { episode_id: "${ep3}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-05T11:00:00Z", scheduled_end_utc: "2026-03-05T11:30:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The touching booking [12:00,13:00) (start == existing end 12:00) SUCCEEDED in setup with Session.status == BOOKED (half-open touch allowed, no buffer)."
            - "The trigger booking [11:00,11:30) overlapping the existing [10:00,12:00) returns status 409 with data.error_id == 'ERR_SESSION_OVERLAP'."

      - name: retainer_cycle_window_overlap_same_contract
        grounds:
          - validations[priority=28]
          - entities.RetainerCycle.fields.cycle_start_utc
          - entities.RetainerCycle.fields.cycle_end_utc
        distinguishing_aspect: |
          Resource = EngagementContract (RetainerCycle windows), a different
          resource entity than the Engineer session rule. Interval semantics =
          half-open [start,end) overlap across ANY status of the same contract,
          touching endpoints allowed, no buffer — distinct from the engineer
          session overlap (which is scoped to non-CANCELLED sessions of one
          engineer). Overlap is rejected with ERR_CYCLE_OVERLAP.
        test_recipe:
          setup:
            - "RETAINER contract with one OPEN RetainerCycle over [2026-03-01,2026-04-01)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Cyc S", format: "SOLO", billing_model: "RETAINER" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "RETAINER", monthly_included_episodes: 2 }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /retainer-cycles"
              payload: { contract_id: "${contract_id}", cycle_start_utc: "2026-03-01T00:00:00Z", cycle_end_utc: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc1: $.data.id }
            - call: "POST /retainer-cycles"
              payload: { contract_id: "${contract_id}", cycle_start_utc: "2026-04-01T00:00:00Z", cycle_end_utc: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cyc_touch_status: $.data.status }
          trigger:
            - call: "POST /retainer-cycles"
              payload: { contract_id: "${contract_id}", cycle_start_utc: "2026-03-15T00:00:00Z", cycle_end_utc: "2026-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "The touching cycle [2026-04-01,2026-05-01) (start == existing end) SUCCEEDED in setup with RetainerCycle.status == OPEN (touch allowed)."
            - "The trigger window [2026-03-15,2026-04-15) overlapping the existing [2026-03-01,2026-04-01) returns status 409 with data.error_id == 'ERR_CYCLE_OVERLAP'."

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_conserves_show_lifetime_billed
        grounds:
          - state_machines.Invoice.DISPUTED_to_VOID
          - state_machines.Episode.SCHEDULED_to_PUBLISHED
          - entities.Show.fields.lifetime_billed_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity = Show.lifetime_billed_cents. Forward action publish
          adds invoice.total_cents to it; the compensating action void subtracts the
          same total_cents. Pinned invariant: after publish-then-void,
          show.lifetime_billed_cents == its pre-publish value (0 here), i.e. the
          ledger returns with zero drift. (Distinct conserved quantity from the
          ad-revenue split invariant.)
        test_recipe:
          setup:
            - "Show S, STANDARD PER_EPISODE contract; one episode published (Invoice total 15000), lifetime_billed_cents=15000; invoice then DISPUTED."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Inv S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
