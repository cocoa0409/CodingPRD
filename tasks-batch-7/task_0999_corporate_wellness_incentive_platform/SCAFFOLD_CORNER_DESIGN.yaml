              as: Employee
              as_user_id: "${e1_id}"
              captures: { enr_v: $.data.version }
          trigger:
            - call: "POST /wellness/enrollments/${enr_id}/adjustments"
              payload: { points_delta: 100, reason: "first", expected_enrollment_version: "${enr_v}" }
              as: BenefitsAdmin
            - call: "POST /wellness/enrollments/${enr_id}/adjustments"
              payload: { points_delta: 50, reason: "second with stale version", expected_enrollment_version: "${enr_v}" }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First adjustment succeeds (201)"
            - "Second adjustment -> error_id == ERR_STALE_VERSION (http 412)"
            - "Enrollment.${enr_id}.points_balance_settled == 100 (only the first applied)"

      - name: occ_stale_challenge_patch_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[challenge-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential PATCHes carrying the same observed challenge version: the first succeeds (version advances), the second is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["employer + ACTIVE program + DRAFT challenge; version captured at creation"]
          setup_api_calls:
            - call: "POST /wellness/employers"
