scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: holdover_table_vs_rate_adjusted
        grounds:
          - calculations.holdover_time
          - entities.DeiceOperation.fields.holdover_minutes
          - entities.DeiceOperation.fields.holdover_variant
        distinguishing_aspect: |
          Holdover time on a DeiceOperation (aviation-safety domain): identical fluid/concentration/
          precipitation/temperature inputs yield 60 minutes under the TABLE interpretation and 30
          minutes under the RATE_ADJUSTED interpretation; the ACTIVE HEAVY event forces RATE_ADJUSTED.
        test_recipe:
          setup:
            - "Station with an ACTIVE permit, a TYPE_IV/100 tank (on_hand 20000), a LARGE pad, an airline, and an ACTIVE SNOW/HEAVY/LEVEL_1 weather event"
            - "One RESERVED request for TYPE_IV fluid, assigned to the pad, acceptance PASS recorded"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_IV", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 20000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/weather-events", payload: { station_id: "${st}", precip_type: "SNOW", precip_rate: "HEAVY", severity: "LEVEL_1", started_at: "2026-05-01T00:00:00Z" }, as: StationAdmin, captures: { we: $.data.id } }
            - { call: "POST /deice-ops/weather-events/${we}/activate", payload: {}, as: StationAdmin }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "B77W", size_class: "LARGE", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_IV" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: -5 }, as: PadOperator, captures: { hm: $.data.holdover_minutes, hv: $.data.holdover_variant } }
          assert:
            - "DeiceOperation.${op}.holdover_variant == RATE_ADJUSTED"
            - "DeiceOperation.${op}.holdover_minutes == 30  (60 base * 1.0 temp * 0.5 HEAVY)"
            - "TABLE interpretation of identical inputs == 60, i.e. holdover_minutes != 60"

      - name: invoice_marginal_vs_flat_tier
        grounds:
          - calculations.invoice_charges
          - entities.Invoice.fields.fluid_charge_cents
          - entities.Invoice.fields.pricing_variant
        distinguishing_aspect: |
          Invoice fluid charge on an Invoice (billing domain, distinct from holdover's operation
          domain): with monthly_billed_liters base 4900 and a 300 L TYPE_I operation, MARGINAL_TIER
          yields fluid 25560 c / total 45560 c, while the documented FLAT_TIER variant yields
          fluid 24840 c / total 44840 c — same data, divergent results; only MARGINAL_TIER is conformant.
        test_recipe:
          setup:
            - "Station with ACTIVE permit, TYPE_I tank (on_hand 50000), MEDIUM and SMALL pads, airline (credit 10000000)"
            - "Op1 (MEDIUM pad, actual 4900 L) CLEARED and its invoice ISSUED so monthly_billed_liters == 4900"
            - "Op2 (SMALL pad, actual 300 L) CLEARED; no weather event ACTIVE at either completion"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 50000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PM", max_size_class: "MEDIUM", rated_collection_pct: 60 }, as: StationAdmin, captures: { pdm: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PS", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin, captures: { pds: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq1: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq1}/assign", payload: { pad_id: "${pdm}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq1}", as: PadOperator, captures: { op1: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op1}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op1}/complete", payload: { actual_liters: 4900, collected_liters: 2500 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av1: $.data.version } }
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op1}", expected_airline_version: "${av1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
            - { call: "POST /deice-ops/invoices/${inv1}/issue", payload: {}, as: BillingClerk }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA2", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T13:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq2: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq2}/assign", payload: { pad_id: "${pds}", window_start: "2026-05-01T11:00:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq2}", as: PadOperator, captures: { op2: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op2}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op2}/complete", payload: { actual_liters: 300, collected_liters: 200 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av2: $.data.version } }
          trigger:
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op2}", expected_airline_version: "${av2}" }, as: BillingClerk, captures: { fc: $.data.fluid_charge_cents, tc: $.data.total_cents, pv: $.data.pricing_variant } }
          assert:
            - "Invoice fluid_charge_cents == 25560  (100 L @ 90 c + 200 L @ 82.8 c rounded per segment: 9000 + 16560)"
            - "Invoice pad_fee_cents == 20000 and storm_surcharge_cents == 0"
            - "Invoice total_cents == 45560"
            - "FLAT_TIER variant of identical inputs == 44840 total, i.e. total_cents != 44840"
            - "Invoice pricing_variant == MARGINAL_TIER"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: holdover_multi_input_conditional_lookup
        grounds:
          - calculations.holdover_time
        distinguishing_aspect: |
          Mode (a): five inputs (fluid_type, concentration_pct, precip_type, oat temperature band,
          precip_rate) interact through a keyed table plus conditional multipliers and a floor;
          TYPE_IV/75 + SNOW + oat -12 (cold factor 0.8) + HEAVY (rate factor 0.5) = 35*0.8*0.5 = 14.
        test_recipe:
          setup:
            - "Station with ACTIVE permit, TYPE_IV/75 tank, LARGE pad, airline; ACTIVE SNOW/HEAVY/LEVEL_1 event"
            - "RESERVED TYPE_IV request assigned, acceptance PASS recorded"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_IV", concentration_pct: 75, capacity_liters: 50000, on_hand_liters: 20000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/weather-events", payload: { station_id: "${st}", precip_type: "SNOW", precip_rate: "HEAVY", severity: "LEVEL_1", started_at: "2026-05-01T00:00:00Z" }, as: StationAdmin, captures: { we: $.data.id } }
            - { call: "POST /deice-ops/weather-events/${we}/activate", payload: {}, as: StationAdmin }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "B77W", size_class: "LARGE", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_IV" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: -12 }, as: PadOperator, captures: { hm: $.data.holdover_minutes } }
          assert:
            - "DeiceOperation.${op}.holdover_minutes == 14  (35 * 0.8 cold * 0.5 HEAVY, floor 5 not binding)"
            - "DeiceOperation.${op}.holdover_variant == RATE_ADJUSTED"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_charges
          - entities.Invoice.fields.storm_surcharge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each line is rounded half-up to integer cents
          and the total is the sum of rounded lines (20000 + 248 + 5062 = 25310); summing raw
          amounts and rounding once yields 25311, a different and non-conformant cent value.
        test_recipe:
          setup:
            - "Station (storm_surcharge_pct 25) with ACTIVE permit, TYPE_I tank (50000 L), MEDIUM and SMALL pads, airline"
            - "Op1 (MEDIUM pad, actual 5000 L) CLEARED + ISSUED so monthly_billed_liters == 5000 (tier-2 multiplier 0.92 applies to op2)"
            - "ACTIVE SNOW/LIGHT/LEVEL_2 event created AFTER op1 completion and before op2 completion"
            - "Op2 (SMALL pad, actual 3 L, collected 2 L) CLEARED while the LEVEL_2 event is ACTIVE"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 50000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PM", max_size_class: "MEDIUM", rated_collection_pct: 60 }, as: StationAdmin, captures: { pdm: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PS", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin, captures: { pds: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq1: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq1}/assign", payload: { pad_id: "${pdm}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq1}", as: PadOperator, captures: { op1: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op1}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op1}/complete", payload: { actual_liters: 5000, collected_liters: 2600 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av1: $.data.version } }
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op1}", expected_airline_version: "${av1}" }, as: BillingClerk, captures: { inv1: $.data.id } }
            - { call: "POST /deice-ops/invoices/${inv1}/issue", payload: {}, as: BillingClerk }
            - { call: "POST /deice-ops/weather-events", payload: { station_id: "${st}", precip_type: "SNOW", precip_rate: "LIGHT", severity: "LEVEL_2", started_at: "2026-05-01T05:00:00Z" }, as: StationAdmin, captures: { we: $.data.id } }
            - { call: "POST /deice-ops/weather-events/${we}/activate", payload: {}, as: StationAdmin }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA2", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T13:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq2: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq2}/assign", payload: { pad_id: "${pds}", window_start: "2026-05-01T11:00:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq2}", as: PadOperator, captures: { op2: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op2}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op2}/complete", payload: { actual_liters: 3, collected_liters: 2 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av2: $.data.version } }
          trigger:
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op2}", expected_airline_version: "${av2}" }, as: BillingClerk, captures: { fc: $.data.fluid_charge_cents, sc: $.data.storm_surcharge_cents, tc: $.data.total_cents } }
          assert:
            - "Invoice fluid_charge_cents == 248  (3 L * 90 * 0.92 = 248.4, rounded half-up per tier segment)"
            - "Invoice storm_surcharge_cents == 5062  (round_half_up((20000 + 248) * 0.25))"
            - "Invoice total_cents == 25310  (sum of rounded lines; sum-then-round would give 25311)"
            - "Invoice pad_fee_cents == 20000"

  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: request_defer_requeue_cycle
        grounds:
          - state_machines.DeiceRequest.QUEUED_to_DEFERRED
          - state_machines.DeiceRequest.DEFERRED_to_QUEUED
        distinguishing_aspect: |
          DeiceRequest cycles QUEUED → DEFERRED → QUEUED on the same entity instance (an A→B→A
          loop), with defer_count accumulating to 1 while epochs_in_queue stays 0.
        test_recipe:
          setup:
            - "Station with tank and airline; one RESERVED MEDIUM request in QUEUED"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/defer", payload: {}, as: PadOperator, captures: { st1: $.data.status, dc: $.data.defer_count } }
            - { call: "POST /deice-ops/deice-requests/${rq}/requeue", payload: {}, as: PadOperator, captures: { st2: $.data.status } }
          assert:
            - "After defer: DeiceRequest.${rq}.status == DEFERRED and defer_count == 1"
            - "After requeue: DeiceRequest.${rq}.status == QUEUED and defer_count == 1 and epochs_in_queue == 0"
            - "Reservation retained through the cycle: fluid_reservation_status == RESERVED"

      - name: weather_reintensification_cycle
        grounds:
          - state_machines.WeatherEvent.ACTIVE_to_ENDED
          - state_machines.WeatherEvent.ENDED_to_ACTIVE
        distinguishing_aspect: |
          WeatherEvent cycles ACTIVE → ENDED → ACTIVE on the same entity instance
          (re-intensification loop), with ended_at set on end and cleared back to null on reactivation.
        test_recipe:
          setup:
            - "Station with one FORECASTED weather event"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/weather-events", payload: { station_id: "${st}", precip_type: "SNOW", precip_rate: "LIGHT", severity: "LEVEL_1", started_at: "2026-05-01T00:00:00Z" }, as: StationAdmin, captures: { we: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/weather-events/${we}/activate", payload: {}, as: StationAdmin, captures: { s1: $.data.status } }
            - { call: "POST /deice-ops/weather-events/${we}/end", payload: {}, as: StationAdmin, captures: { s2: $.data.status, e2: $.data.ended_at } }
            - { call: "POST /deice-ops/weather-events/${we}/activate", payload: {}, as: StationAdmin, captures: { s3: $.data.status, e3: $.data.ended_at } }
          assert:
            - "First activate: status == ACTIVE"
            - "End: status == ENDED and ended_at == 2026-05-01T00:00:00Z (default logical clock)"
            - "Re-activate: status == ACTIVE and ended_at == null (cycle closed on the same instance)"

  # =================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 3)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_rework_cascade
        grounds:
          - state_machines.DeiceOperation.AWAITING_INSPECTION_to_REWORK_REQUIRED
          - calculations.reserved_liters_calc
          - calculations.station_posture
          - entities.DeiceOperation.fields.parent_operation_id
        distinguishing_aspect: |
          Depth-4 chain from POST /inspections (FAIL): Inspection → parent DeiceOperation
          REWORK_REQUIRED → auto-created rework child DeiceOperation (estimated 300) →
          FluidTank reserved_liters += 300 → DeiceStation posture flips FLUID_CONSTRAINED, proven by
          a subsequent assign rejected with ERR_FLUID_CONSTRAINED. Each link is caused by the previous.
        test_recipe:
          setup:
            - "Station (fluid_ops_minimum_liters 2000) with ACTIVE permit, one TYPE_I tank (on_hand 3500, threshold 300), LARGE pad, airline"
            - "R1 (MEDIUM, reserved 500) assigned; op1 SPRAYING then completed with actual 600 / collected 400"
            - "R2 (SMALL, reserved 200) still QUEUED; tank available 3500-700 = 2800 before completion"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One", fluid_ops_minimum_liters: 2000 }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 5000, on_hand_liters: 3500, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq1: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA2", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T13:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq2: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq1}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq1}", as: PadOperator, captures: { op1: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op1}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op1}/complete", payload: { actual_liters: 600, collected_liters: 400 }, as: PadOperator }
          trigger:
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "POST_TREATMENT", result: "FAIL", findings: "fluid residue on wing" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/deice-operations/${op1}", as: PadOperator, captures: { op1_status: $.data.status } }
            - { call: "GET /deice-ops/deice-operations?parent_operation_id=${op1}", as: PadOperator, captures: { child_id: "$.data[0].id", child_est: "$.data[0].estimated_liters", child_status: "$.data[0].status" } }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: PadOperator, captures: { tk_on: $.data.on_hand_liters, tk_res: $.data.reserved_liters, tk_avail: $.data.available_liters } }
            - { call: "GET /deice-ops/stations/${st}", as: StationAdmin, captures: { posture: $.data.posture } }
            - { call: "POST /deice-ops/deice-requests/${rq2}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T11:00:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PadOperator, captures: { assign_err: $.data.error_id } }
          assert:
            - "DeiceOperation.${op1}.status == REWORK_REQUIRED (link 1)"
            - "Rework child exists with parent_operation_id == ${op1}, status == PLANNED, estimated_liters == 300 (ceil(600*0.5)) (link 2)"
            - "FluidTank.${tk}: on_hand_liters == 2900, reserved_liters == 1000 (500 R1 + 200 R2 + 300 child), available_liters == 1900 (link 3)"
            - "DeiceStation.${st}.posture == FLUID_CONSTRAINED (1900 < 2000) (link 4)"
            - "Assign of ${rq2} fails with error_id == ERR_FLUID_CONSTRAINED (observable consequence of the chain)"

      - name: spill_confirm_tank_threshold_cascade
        grounds:
          - state_machines.SpillReport.REPORTED_to_CONFIRMED
          - calculations.tank_status
          - entities.DeiceStation.fields.active_supply_alert
        distinguishing_aspect: |
          Depth-3 chain from POST /spill-reports/{id}/confirm (a different trigger than the
          inspection cascade): confirm → FluidTank.on_hand_liters 800-350 = 450 → tank crosses below
          reorder_threshold (500) to REORDER_PENDING → DeiceStation.active_supply_alert recomputes to true.
        test_recipe:
          setup:
            - "Station with TYPE_IV tank (on_hand 800, capacity 4000, threshold 500)"
            - "SpillReport of 350 L against that tank, occurred at the default clock instant"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_IV", concentration_pct: 100, capacity_liters: 4000, on_hand_liters: 800, reorder_threshold_liters: 500 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/spill-reports", payload: { station_id: "${st}", tank_id: "${tk}", quantity_liters: 350, occurred_at: "2026-05-01T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "eo-1", captures: { sp: $.data.id, cls: $.data.classification } }
          trigger:
            - { call: "POST /deice-ops/spill-reports/${sp}/confirm", payload: {}, as: EnvironmentalOfficer, as_user_id: "eo-2", captures: { sp_status: $.data.status } }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: EnvironmentalOfficer, captures: { tk_on: $.data.on_hand_liters, tk_status: $.data.status } }
            - { call: "GET /deice-ops/stations/${st}", as: StationAdmin, captures: { alert: $.data.active_supply_alert } }
          assert:
            - "SpillReport.${sp}: classification == REPORTABLE at creation (350 >= 100), status == CONFIRMED after confirm (link 1)"
            - "FluidTank.${tk}: on_hand_liters == 450 and status == REORDER_PENDING (450 < 500) (link 2)"
            - "DeiceStation.${st}.active_supply_alert == true (link 3)"

  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_state_violation_beats_sod_safety
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_SOD_VIOLATION]"
        distinguishing_aspect: |
          Category pair state vs business_safety: recording a POST_TREATMENT inspection while the
          operation is still SPRAYING (wrong from-state, p4) AND by the same inspector who signed
          acceptance (SoD breach, p5) must yield ERR_INVALID_STATE, not ERR_SOD_VIOLATION.
        test_recipe:
          setup:
            - "Full flow through start: op SPRAYING, acceptance PASS recorded by inspector insp-1"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator }
          trigger:
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "POST_TREATMENT", result: "FAIL" }, as: Inspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (state p4 beats business_safety p5), not ERR_SOD_VIOLATION"
            - "DeiceOperation.${op}.status remains SPRAYING and no rework child is created"

      - name: permit_suspension_beats_pad_incompatibility
        grounds:
          - "validations[priority=5]"
          - "validations[priority=6]"
          - "errors[ERR_PERMIT_SUSPENDED]"
          - "errors[ERR_PAD_INCOMPATIBLE]"
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair than the other
          instance): assigning when the station posture is PERMIT_SUSPENDED (p5) and the pad's
          size class is also too small (p6) must yield ERR_PERMIT_SUSPENDED.
        test_recipe:
          setup:
            - "Station with ACTIVE permit (created then SUSPENDED), TYPE_I tank (5000 L), SMALL pad, airline"
            - "One RESERVED LARGE request QUEUED"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin, captures: { pm: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PS", max_size_class: "SMALL", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "B77W", size_class: "LARGE", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/discharge-permits/${pm}/suspend", payload: {}, as: EnvironmentalOfficer }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PERMIT_SUSPENDED (business_safety p5 beats business_constraint p6), not ERR_PAD_INCOMPATIBLE"
            - "DeiceRequest.${rq}.status remains QUEUED and assigned_pad_id remains null"

  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: spill_reportable_at_exactly_100_liters
        grounds:
          - calculations.spill_classification
          - entities.SpillReport.fields.classification
        distinguishing_aspect: |
          Metric quantity_liters on POST /deice-ops/spill-reports: the threshold is inclusive —
          exactly 100.0 L classifies REPORTABLE while 99.99 L classifies MINOR (>= vs > precision).
        test_recipe:
          setup:
            - "Station with a TYPE_I tank"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /deice-ops/spill-reports", payload: { station_id: "${st}", tank_id: "${tk}", quantity_liters: 100.0, occurred_at: "2026-05-01T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "eo-1", captures: { c1: $.data.classification } }
            - { call: "POST /deice-ops/spill-reports", payload: { station_id: "${st}", tank_id: "${tk}", quantity_liters: 99.99, occurred_at: "2026-05-01T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "eo-1", captures: { c2: $.data.classification } }
          assert:
            - "Spill at 100.0 L: classification == REPORTABLE (boundary inclusive)"
            - "Spill at 99.99 L: classification == MINOR"

      - name: collection_pct_at_exactly_minimum_passes
        grounds:
          - calculations.collection_percentage
          - entities.DeiceOperation.fields.collection_flag
          - entities.DeiceStation.fields.min_collection_pct
        distinguishing_aspect: |
          Metric collection_pct (a percentage, distinct from the spill liter metric) on
          POST /deice-ops/deice-operations/{id}/complete (a distinct endpoint): exactly 50.00 ==
          min_collection_pct passes with flag OK; 49.50 is flagged BELOW_MINIMUM (>= semantics).
        test_recipe:
          setup:
            - "Station (default min_collection_pct 50.0) with ACTIVE permit, TYPE_I tank (20000 L), LARGE pad, airline"
            - "Op1 (R1, SMALL) fully CLEARED so the pad is AVAILABLE again; R2 (SMALL) assigned, acceptance PASS, SPRAYING"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 20000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq1: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA2", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T13:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq2: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq1}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq1}", as: PadOperator, captures: { op1: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op1}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op1}/complete", payload: { actual_liters: 200, collected_liters: 100 }, as: PadOperator, captures: { p1: $.data.collection_pct, f1: $.data.collection_flag } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /deice-ops/deice-requests/${rq2}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T11:00:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq2}", as: PadOperator, captures: { op2: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op2}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op2}/start", payload: { oat_celsius: 0 }, as: PadOperator }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op2}/complete", payload: { actual_liters: 200, collected_liters: 99 }, as: PadOperator, captures: { p2: $.data.collection_pct, f2: $.data.collection_flag } }
          assert:
            - "Op1 (completed in setup): collection_pct == 50.0 and collection_flag == OK (at-minimum passes, >= semantics)"
            - "Op2 (trigger): collection_pct == 49.5 and collection_flag == BELOW_MINIMUM"

  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: operation_start_requires_acceptance_pass
        grounds:
          - state_machines.DeiceOperation.PLANNED_to_SPRAYING
          - entities.Inspection.fields.kind
        distinguishing_aspect: |
          Pair DeiceOperation × Inspection: the start transition is gated on the existence of a
          separate Inspection entity (kind ACCEPTANCE, result PASS) for the same operation;
          without it the transition is rejected ERR_ACCEPTANCE_REQUIRED.
        test_recipe:
          setup:
            - "Station with ACTIVE permit, tank, LARGE pad, airline; RESERVED request assigned (op PLANNED)"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator, captures: { err: $.data.error_id } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator, captures: { st2: $.data.status } }
          assert:
            - "Start without acceptance: error_id == ERR_ACCEPTANCE_REQUIRED and operation stays PLANNED"
            - "After ACCEPTANCE PASS by another entity (Inspection), start succeeds: status == SPRAYING"
            - "Request transitions ASSIGNED → IN_PROGRESS as a side effect"

      - name: assign_blocked_when_station_permit_suspended
        grounds:
          - state_machines.DeiceRequest.QUEUED_to_ASSIGNED
          - calculations.station_posture
        distinguishing_aspect: |
          Pair DeiceRequest × DeiceStation (different pair than Operation × Inspection): the assign
          transition is gated on the station's derived posture; while the only permit is SUSPENDED
          the posture is PERMIT_SUSPENDED and assign fails, and it succeeds again after reinstate.
        test_recipe:
          setup:
            - "Station with permit (created ACTIVE), tank (5000 L), LARGE pad, airline; RESERVED MEDIUM request QUEUED"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin, captures: { pm: $.data.id } }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 10000, on_hand_liters: 5000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/discharge-permits/${pm}/suspend", payload: {}, as: EnvironmentalOfficer }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator, captures: { err: $.data.error_id } }
            - { call: "POST /deice-ops/discharge-permits/${pm}/reinstate", payload: {}, as: EnvironmentalOfficer }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator, captures: { st2: $.data.status } }
          assert:
            - "While permit SUSPENDED: assign fails with error_id == ERR_PERMIT_SUSPENDED"
            - "After reinstate (posture NORMAL): assign succeeds, status == ASSIGNED"
            - "DeiceStation.${st}.posture recomputes on each permit transition"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pad_window_half_open_adjacency
        grounds:
          - state_machines.DeiceRequest.QUEUED_to_ASSIGNED
          - "errors[ERR_PAD_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Resource DeicePad with half-open interval semantics [window_start, window_end): a new
          booking whose start equals an existing booking's end is adjacent and allowed, while a
          strictly overlapping one is rejected ERR_PAD_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Station with ACTIVE permit, TYPE_I tank (20000 L), LARGE pad, airline"
            - "R1 assigned [10:00,10:30) and fully CLEARED; R2 (SMALL) QUEUED"
            - "R3 (SMALL) QUEUED"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 20000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq1: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA2", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T13:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq2: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA3", aircraft_type: "E190", size_class: "SMALL", scheduled_departure: "2026-05-01T14:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq3: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq1}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq1}", as: PadOperator, captures: { op1: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op1}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op1}/complete", payload: { actual_liters: 10, collected_liters: 6 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op1}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "POST /deice-ops/deice-requests/${rq2}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:30:00Z", window_end: "2026-05-01T11:00:00Z" }, as: PadOperator, captures: { st_r2: $.data.status } }
          trigger:
            - { call: "POST /deice-ops/deice-requests/${rq3}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:45:00Z", window_end: "2026-05-01T11:15:00Z" }, as: PadOperator, captures: { err: $.data.error_id } }
            - { call: "POST /deice-ops/deice-requests/${rq3}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T11:00:00Z", window_end: "2026-05-01T11:30:00Z" }, as: PadOperator, captures: { st_r3: $.data.status } }
          assert:
            - "R2 [10:30,11:00) adjacent to op1 [10:00,10:30): assign succeeds (half-open adjacency allowed), status ASSIGNED"
            - "R3 [10:45,11:15) overlapping R2's PLANNED op [10:30,11:00): error_id == ERR_PAD_WINDOW_OVERLAP"
            - "R3 retried at [11:00,11:30) adjacent to R2's window: assign succeeds"

      - name: permit_rolling_window_aggregate_capacity
        grounds:
          - calculations.rolling_discharge_window
          - "errors[ERR_PERMIT_VOLUME_EXCEEDED]"
        distinguishing_aspect: |
          Resource DischargePermit with aggregate-capacity semantics (different from the pad's
          pairwise half-open adjacency): any trailing 7-day window whose summed volume plus the new
          reading would exceed 10000 L is rejected; sums of 9900 and exactly 10000 pass (> vs >=).
        test_recipe:
          setup:
            - "Station with ACTIVE permit (window 7 days, cap 10000 L, single-reading limit 100 mg/L)"
            - "Readings of 6000 L (2026-05-01) and 3500 L (2026-05-03) already recorded (window sum 9500)"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 10000, expected_station_version: "${st_v}" }, as: StationAdmin, captures: { pm: $.data.id } }
            - { call: "POST /deice-ops/discharge-permits/${pm}/effluent-readings", payload: { measured_at: "2026-05-01T00:00:00Z", concentration_mg_l: 10, volume_liters: 6000 }, as: EnvironmentalOfficer }
            - { call: "POST /deice-ops/discharge-permits/${pm}/effluent-readings", payload: { measured_at: "2026-05-03T00:00:00Z", concentration_mg_l: 10, volume_liters: 3500 }, as: EnvironmentalOfficer }
          trigger:
            - { call: "POST /deice-ops/discharge-permits/${pm}/effluent-readings", payload: { measured_at: "2026-05-05T00:00:00Z", concentration_mg_l: 10, volume_liters: 600 }, as: EnvironmentalOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /deice-ops/discharge-permits/${pm}/effluent-readings", payload: { measured_at: "2026-05-05T00:00:00Z", concentration_mg_l: 10, volume_liters: 400 }, as: EnvironmentalOfficer, captures: { r3: $.data.id } }
            - { call: "POST /deice-ops/discharge-permits/${pm}/effluent-readings", payload: { measured_at: "2026-05-05T01:00:00Z", concentration_mg_l: 10, volume_liters: 100 }, as: EnvironmentalOfficer, captures: { r4: $.data.id } }
          assert:
            - "600 L reading rejected: error_id == ERR_PERMIT_VOLUME_EXCEEDED (9500+600 = 10100 > 10000)"
            - "400 L reading accepted (9500+400 = 9900 <= 10000)"
            - "Further 100 L accepted: window sum exactly 10000 is NOT > cap, so it passes"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fluid_volume_complete_then_void
        grounds:
          - state_machines.DeiceOperation.SPRAYING_to_AWAITING_INSPECTION
          - state_machines.DeiceOperation.CLEARED_to_VOIDED
          - calculations.collected_pool
        distinguishing_aspect: |
          Conserved quantity: fluid volume (liters). complete (tank -600, pool +400) paired with its
          compensating void (tank +600, pool -400) leaves FluidTank.on_hand_liters and
          DeiceStation.collected_pool_liters exactly at their pre-complete values.
        test_recipe:
          setup:
            - "Station with ACTIVE permit, TYPE_I tank (on_hand 20000), LARGE pad, airline"
            - "Op CLEARED with actual 600 / collected 400 (tank now 19400, pool 400)"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 20000, reorder_threshold_liters: 300 }, as: StationAdmin, captures: { tk: $.data.id } }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "P1", max_size_class: "LARGE", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op}/complete", payload: { actual_liters: 600, collected_liters: 400 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: PadOperator, captures: { on_mid: $.data.on_hand_liters } }
            - { call: "GET /deice-ops/stations/${st}", as: StationAdmin, captures: { pool_mid: $.data.collected_pool_liters } }
          trigger:
            - { call: "POST /deice-ops/deice-operations/${op}/void", payload: {}, as: PadOperator, captures: { stv: $.data.status } }
            - { call: "GET /deice-ops/fluid-tanks/${tk}", as: PadOperator, captures: { on_end: $.data.on_hand_liters } }
            - { call: "GET /deice-ops/stations/${st}", as: StationAdmin, captures: { pool_end: $.data.collected_pool_liters } }
          assert:
            - "Mid-chain: tank on_hand_liters == 19400 and station collected_pool_liters == 400"
            - "After void: DeiceOperation.${op}.status == VOIDED"
            - "Invariant: tank on_hand_liters == 20000 (pre-complete value restored exactly)"
            - "Invariant: station collected_pool_liters == 0 (pre-complete value restored exactly)"

      - name: invoice_issue_then_void_restores_balance
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - entities.Airline.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (cents) and billed liters — different conserved quantity than
          the fluid invariant. issue (+62000 c, +300 L) paired with its compensating void leaves
          Airline.outstanding_balance_cents and monthly_billed_liters exactly at pre-issue values.
        test_recipe:
          setup:
            - "Station with ACTIVE permit, TYPE_I tank (20000 L), MEDIUM pad, airline"
            - "Op CLEARED with actual 300 L; no ACTIVE weather event at completion (no surcharge)"
          setup_api_calls:
            - { call: "POST /deice-ops/stations", payload: { code: "ST1", name: "Station One" }, as: StationAdmin, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /deice-ops/discharge-permits", payload: { station_id: "${st}", permit_number: "P-1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", max_single_reading_mg_l: 100, rolling_window_days: 7, rolling_window_max_liters: 100000, expected_station_version: "${st_v}" }, as: StationAdmin }
            - { call: "POST /deice-ops/fluid-tanks", payload: { station_id: "${st}", fluid_type: "TYPE_I", concentration_pct: 100, capacity_liters: 50000, on_hand_liters: 20000, reorder_threshold_liters: 300 }, as: StationAdmin }
            - { call: "POST /deice-ops/pads", payload: { station_id: "${st}", code: "PM", max_size_class: "MEDIUM", rated_collection_pct: 60 }, as: StationAdmin, captures: { pd: $.data.id } }
            - { call: "POST /deice-ops/airlines", payload: { code: "AA", name: "Air", credit_limit_cents: 10000000 }, as: StationAdmin, captures: { al: $.data.id } }
            - { call: "POST /deice-ops/deice-requests", payload: { airline_id: "${al}", station_id: "${st}", flight_number: "AA1", aircraft_type: "A320", size_class: "MEDIUM", scheduled_departure: "2026-05-01T12:00:00Z", fluid_type: "TYPE_I" }, as: AirlineRep, as_user_id: "${al}", captures: { rq: $.data.id } }
            - { call: "POST /deice-ops/deice-requests/${rq}/assign", payload: { pad_id: "${pd}", window_start: "2026-05-01T10:00:00Z", window_end: "2026-05-01T10:30:00Z" }, as: PadOperator }
            - { call: "GET /deice-ops/deice-operations?request_id=${rq}", as: PadOperator, captures: { op: "$.data[0].id" } }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "ACCEPTANCE", result: "PASS" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /deice-ops/deice-operations/${op}/start", payload: { oat_celsius: 0 }, as: PadOperator }
            - { call: "POST /deice-ops/deice-operations/${op}/complete", payload: { actual_liters: 300, collected_liters: 200 }, as: PadOperator }
            - { call: "POST /deice-ops/inspections", payload: { operation_id: "${op}", kind: "POST_TREATMENT", result: "PASS" }, as: Inspector, as_user_id: "insp-2" }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { av: $.data.version, ob0: $.data.outstanding_balance_cents, mb0: $.data.monthly_billed_liters } }
            - { call: "POST /deice-ops/invoices", payload: { operation_id: "${op}", expected_airline_version: "${av}" }, as: BillingClerk, captures: { inv: $.data.id, tot: $.data.total_cents } }
          trigger:
            - { call: "POST /deice-ops/invoices/${inv}/issue", payload: {}, as: BillingClerk }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { ob1: $.data.outstanding_balance_cents, mb1: $.data.monthly_billed_liters } }
            - { call: "POST /deice-ops/invoices/${inv}/void", payload: {}, as: BillingClerk, captures: { stv: $.data.status } }
            - { call: "GET /deice-ops/airlines/${al}", as: BillingClerk, captures: { ob2: $.data.outstanding_balance_cents, mb2: $.data.monthly_billed_liters } }
          assert:
            - "Invoice total_cents == 62000 (pad 35000 + fluid 300*90=27000, no storm)"
            - "After issue: outstanding_balance_cents == 62000 and monthly_billed_liters == 300"
            - "After void: Invoice status == VOID"
            - "Invariant: outstanding_balance_cents == 0 and monthly_billed_liters == 0 (pre-issue values restored exactly)"
