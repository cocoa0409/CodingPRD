          Error-category pair business_safety-vs-business_constraint (a
          different pair than state-vs-fiscal): approving the O2 band fails
          BOTH the FLSA salary-basis floor (min 3400000 < 3556800 for the
          EXEMPT profile) and the overlap policy (0.8509 > 0.2500); the
