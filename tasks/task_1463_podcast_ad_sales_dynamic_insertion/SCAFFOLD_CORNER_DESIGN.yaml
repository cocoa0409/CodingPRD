        distinguishing_aspect: "PATCH is legal in DRAFT/PAUSED only; on an ACTIVE campaign even a version-correct PATCH fails with ERR_CAMPAIGN_NOT_EDITABLE."
        test_recipe:
          setup: ["Advertiser; campaign with APPROVED copy taken to ACTIVE; fresh version captured"]
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "EditCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CE", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
