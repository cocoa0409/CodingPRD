              as: RiskAnalyst
              captures: { ra1_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/risk-acceptances"
              payload: { exception_ids: ["${x2_id}"], justification: "j", compensating_controls: ["c"], expires_at: "2026-12-01T00:00:00Z" }
