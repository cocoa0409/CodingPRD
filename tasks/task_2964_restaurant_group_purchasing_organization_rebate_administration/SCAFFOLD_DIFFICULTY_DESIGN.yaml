            - call: "POST /authorization-letters"
              payload: { member_id: "${m_pending_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "B Osei", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m_pending_id}"
              captures: { loa_pending_id: $.data.id }
            - call: "POST /authorization-letters/${loa_pending_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
