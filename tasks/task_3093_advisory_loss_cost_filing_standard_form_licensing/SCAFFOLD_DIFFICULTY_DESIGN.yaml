  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure scenarios on
  # DIFFERENT error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: objection_in_wrong_state_and_out_of_window_reports_state_first
        grounds:
          - validations.priority_5_state
          - validations.priority_9_business_temporal
          - errors.ERR_INVALID_STATE
          - errors.ERR_OBJECTION_WINDOW_CLOSED
        distinguishing_aspect: |
          Category pair state vs business_temporal: a filing still in REVIEWED
          (never FILED) objected to by the correct-jurisdiction regulator
          produces ERR_INVALID_STATE (priority 5) even though, with the clock
          far advanced, the temporal check would also fail if it were reached.
        test_recipe:
          setup:
            - "Logical clock at default. TX department (window 30 days); a TX filing in REVIEWED status (never filed)."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
