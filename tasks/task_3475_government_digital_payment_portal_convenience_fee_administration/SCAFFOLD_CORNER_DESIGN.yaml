            - "err_id != ERR_COMPLIANCE_LAPSED (the attestation is fine) and Agency.${ag_id}.status stays ONBOARDING"

      - name: err_chargeback_not_permitted_on_echeck
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CHARGEBACK_NOT_PERMITTED
          - state_machines.ChargebackCase
        distinguishing_aspect: "Chargebacks exist only for CARD rails: an ECHECK transaction in a perfectly chargebackable state (CAPTURED) is rejected 409 ERR_CHARGEBACK_NOT_PERMITTED."
        test_recipe:
          setup:
            - "CF agency base chain; CAPTURED ECHECK transaction."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_echeck
            - *c_echeck_ok
