          The pair is category `state` (priority 30, ERR_PROGRAM_NOT_HELD) versus
          `business_fiscal` (priority 81, ERR_FLOOR_BUDGET_EXCEEDED): one request violates
          both, and the state error must win; holding the event then repeating the identical
          receipts surfaces the fiscal error, proving the fiscal violation was present all along.
