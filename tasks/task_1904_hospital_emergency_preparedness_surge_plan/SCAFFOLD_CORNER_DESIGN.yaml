        as: LiaisonOfficer
        as_user_id: ${u_lo}
        captures:
          rep2: $.data.id
          due2: $.data.due_at
      - call: POST /emergency/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-11T03:36:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /emergency/external-reports/${rep1}/submit
        as: HospitalAdministrator
        as_user_id: ${u_ha}
        captures:
          late1: $.data.submitted_late
          hrs1: $.data.hours_late
      assert:
      - ${due1} == 2026-08-11T00:00:00.000Z (period_end + 24h)
      - ${due2} == 2026-09-09T00:00:00.000Z (period_end + 720h)
      - ${late1} == true and ${hrs1} == 3.6 (3h36m at 2dp round_half_up)
      - ExternalReport.${rep1}.status == SUBMITTED — late filing is accepted and flagged,
        never rejected
  - name: acs_census_capacity_gate_and_release
    claim_type: correct_result
    grounds:
    - calculations.acs_census
    - errors[ERR_ACS_AT_CAPACITY]
    distinguishing_aspect: 'current_census counts only TRANSFERRED patients at the
      site: the third transfer into a 2-bed site fails, and discharging one transferred
      patient frees the slot.'
    test_recipe:
      setup:
