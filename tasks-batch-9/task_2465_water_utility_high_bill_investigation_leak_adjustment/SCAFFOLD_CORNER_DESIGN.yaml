            - "GET /service-accounts/${acct_a_id}/ledger-entries returns total_count 6 (five bill charges and one leak credit) and balance_cents == 38816 == 60569 - 26963 + 5210"

      - name: corner_error_payment_arrangement_fiscal_and_referential_guards_all_fire
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DOWN_PAYMENT_TOO_LOW]
          - errors[ERR_INSTALLMENT_LIMIT_EXCEEDED]
          - errors[ERR_ARRANGEMENT_ACCOUNT_MISMATCH]
          - errors[ERR_ARRANGEMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Five refusals on one endpoint, each isolated so that exactly one rule can be responsible:
          1041 is one cent under the 20 percent floor of 1042, 5211 is one cent over the total, thirteen
          instalments trips the priority-11 limit before any fiscal rule is consulted, a bill belonging
          to the other account trips the priority-12 mismatch, and a total of 5000 against a 5210-cent
          bill trips the priority-13 amount rule. The sixth call, differing only in the offending field,
          succeeds.
        test_recipe:
          setup:
            - "The clock is 2026-08-01T00:00:00Z; RS-STD-2026 and BillingPeriod 2025-06 (SUMMER) exist."
            - "ServiceAccount ACC-5008 has meter MTR-5H-1 with reads 100000 / 104000 and an ISSUED 4000-gallon bill of 5210 cents."
            - "ServiceAccount ACC-5009 has meter MTR-5J-1 with reads 100000 / 104000 and its own ISSUED 5210-cent bill."
            - "The first account's version has been read back for the OCC token."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5008", customer_name: "Yusuf Demir", service_address: "5 Aspen Court", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_x_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_x_id}", meter_serial: "MTR-5H-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_x_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_x_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_x_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_x_id}", period_id: "${p1_id}", meter_id: "${meter_x_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_x_id: $.data.id }
            - call: "POST /bills/${bill_x_id}/issue"
              as: BillingSupervisor
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-5009", customer_name: "Greta Lindqvist", service_address: "9 Aspen Court", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_y_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_y_id}", meter_serial: "MTR-5J-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_y_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_y_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_y_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_y_id}", period_id: "${p1_id}", meter_id: "${meter_y_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_y_id: $.data.id }
            - call: "POST /bills/${bill_y_id}/issue"
              as: BillingSupervisor
            - call: "GET /service-accounts/${acct_x_id}"
              as: CustomerServiceRep
              captures: { acct_x_v: $.data.version }
          trigger:
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_x_id}", bill_id: "${bill_x_id}", total_amount_cents: 5210, down_payment_cents: 1041, installment_count: 4, expected_account_version: "${acct_x_v}" }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_x_id}", bill_id: "${bill_x_id}", total_amount_cents: 5210, down_payment_cents: 5211, installment_count: 4, expected_account_version: "${acct_x_v}" }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_x_id}", bill_id: "${bill_x_id}", total_amount_cents: 5210, down_payment_cents: 1042, installment_count: 13, expected_account_version: "${acct_x_v}" }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_x_id}", bill_id: "${bill_y_id}", total_amount_cents: 5210, down_payment_cents: 1042, installment_count: 4, expected_account_version: "${acct_x_v}" }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_x_id}", bill_id: "${bill_x_id}", total_amount_cents: 5000, down_payment_cents: 1042, installment_count: 4, expected_account_version: "${acct_x_v}" }
              as: CustomerServiceRep
            - call: "POST /payment-arrangements"
              payload: { account_id: "${acct_x_id}", bill_id: "${bill_x_id}", total_amount_cents: 5210, down_payment_cents: 1042, installment_count: 4, expected_account_version: "${acct_x_v}" }
              as: CustomerServiceRep
              captures: { arr_id: $.data.id }
          assert:
            - "DOWN PAYMENT ONE CENT SHORT: HTTP 422 with error_id ERR_DOWN_PAYMENT_TOO_LOW, because round_half_up(5210 * 2000 / 10000) == 1042 and 1041 < 1042"
            - "DOWN PAYMENT ABOVE THE TOTAL: HTTP 422 with error_id ERR_DOWN_PAYMENT_TOO_LOW — the same rule carries the upper bound down_payment_cents <= total_amount_cents"
            - "THIRTEEN INSTALMENTS: HTTP 422 with error_id ERR_INSTALLMENT_LIMIT_EXCEEDED, because MAX_INSTALLMENTS is 12; the down payment in that call is valid, so no fiscal rule competes"
            - "OTHER ACCOUNT'S BILL: HTTP 422 with error_id ERR_ARRANGEMENT_ACCOUNT_MISMATCH — ${bill_y_id} resolves at priority 5 and is rejected at priority 12 for belonging to ACC-5009"
            - "WRONG TOTAL: HTTP 422 with error_id ERR_ARRANGEMENT_AMOUNT_MISMATCH, because Bill.${bill_x_id}.adjusted_total_cents is 5210 and 5000 was supplied; 1042 clears the 20 percent floor of 5000, so ERR_DOWN_PAYMENT_TOO_LOW cannot fire"
            - "GET /payment-arrangements?account_id=${acct_x_id} returns total_count 0 after all five refusals"
            - "None of the refusals consumed the OCC token: the sixth call reuses ${acct_x_v} and returns HTTP 200"
            - "PaymentArrangement.${arr_id}.installment_cents == 1042 and final_installment_cents == 1042, because 5210 - 1042 == 4168 divides evenly by 4"
            - "PaymentArrangement.${arr_id}.status == PROPOSED and ServiceAccount.${acct_x_id}.balance_cents == 5210"

      - name: corner_error_meter_test_intake_deposit_meter_scope_and_result_window_guards
        claim_type: error_triggerable
