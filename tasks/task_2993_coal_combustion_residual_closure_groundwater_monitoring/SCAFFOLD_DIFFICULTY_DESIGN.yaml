  - rule_id: cross_entity_state_dependency
    instances:
      - name: stability_certification_gated_by_the_signing_professionals_license_state
        grounds:
          - validations.priority_14_ERR_LICENSE_NOT_ACTIVE
          - entities.QualifiedProfessional.fields.license_status
          - entities.StabilityAssessment.fields.certifying_professional_id
          - calculations.governing_stability_verdict
        distinguishing_aspect: |
          Whether a stability assessment may be written depends on the state of an entity that is neither
          the request target nor named in the payload: the acting QualifiedProfessional's license_status.
          The identical payload against the identical unit is rejected with 422 ERR_LICENSE_NOT_ACTIVE
          while the license is LAPSED and accepted once it is restored to ACTIVE, so the unit's own state
          cannot explain either outcome.
        test_recipe:
          setup:
            - "One clean unit with no assessments, so governing_stability_verdict starts UNASSESSED"
            - "One GEOTECHNICAL PE whose license has been moved to LAPSED effective 2026-08-01"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0014", unit_name: "Ash Pond 14", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/professionals/${pe_geo_id}/license-status"
              payload: { license_status: "LAPSED", effective_on: "2026-08-01" }
              as: UtilityAdmin
          trigger:
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/professionals/${pe_geo_id}/license-status"
              payload: { license_status: "ACTIVE", effective_on: "2026-08-01" }
              as: UtilityAdmin
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { assessment_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_LICENSE_NOT_ACTIVE"
            - "after trigger call 1 no StabilityAssessment exists for ${unit_id} and DisposalUnit.${unit_id}.governing_stability_verdict == UNASSESSED"
            - "QualifiedProfessional.${pe_geo_id}.license_status == ACTIVE and license_status_effective_on == 2026-08-01 after trigger call 2"
            - "trigger call 3 returns HTTP 201"
            - "StabilityAssessment.${assessment_id}.verdict == ADEQUATE"
            - "StabilityAssessment.${assessment_id}.certifying_professional_id == ${pe_geo_id}"
            - "StabilityAssessment.${assessment_id}.deficient_criteria == []"
            - "DisposalUnit.${unit_id}.governing_stability_verdict == ADEQUATE"
            - "DisposalUnit.${unit_id}.stability_posting_due_date == 2026-08-14"

      - name: in_place_approval_gated_by_the_monitoring_programs_corrective_action_phase
        grounds:
          - validations.priority_33_ERR_REMEDY_REQUIRES_REMOVAL
          - state_machines.MonitoringProgram.ASSESSMENT_to_CORRECTIVE_ACTION
          - state_machines.ClosurePlan.FULLY_CERTIFIED_to_APPROVED
          - calculations.statistical_verdict
        distinguishing_aspect: |
          Approval of a FULLY_CERTIFIED plan depends on the phase of a sibling aggregate — the unit's
          MonitoringProgram — and on the plan's own selected_method together. With the program in
          CORRECTIVE_ACTION the in-place plan is refused with 409 ERR_REMEDY_REQUIRES_REMOVAL while the
          removal plan on the very same unit, in the very same program phase, is approved. Neither the
          plan's own status nor the unit's closure_state distinguishes the two calls.
        test_recipe:
          setup:
            - "Certified network on one unit: BG-01..BG-04 and DG-01..DG-03, window 2025-01-01..2025-12-31"
            - "One VALIDATED BACKGROUND round on 2025-06-01 with arsenic 0.0020/0.0030/0.0025/0.0028 (limit 0.0040) and one VALIDATED DETECTION round on 2026-06-15 with DG-01 arsenic 0.0150, which is above both the limit and the 0.010 arsenic GWPS"
            - "Two evaluations with retest_confirmed true: the first drives DETECTION -> ASSESSMENT, the second drives ASSESSMENT -> CORRECTIVE_ACTION"
            - "An ADEQUATE stability assessment dated 2026-07-15, one FULLY_CERTIFIED CLOSURE_IN_PLACE plan and one FULLY_CERTIFIED CLOSURE_BY_REMOVAL plan carrying a 30+ character justification"
