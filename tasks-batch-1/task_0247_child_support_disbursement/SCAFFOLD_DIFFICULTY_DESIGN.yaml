  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: iwo_half_open_interval_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=18]
          - entities.IncomeWithholdingOrder.fields.effective_start_at
          - entities.IncomeWithholdingOrder.fields.effective_end_at
        distinguishing_aspect: |
          IWO uses HALF-OPEN [start, end) intervals on the IncomeWithholdingOrder resource: a second IWO whose interval [2026-03-01, 2026-06-01) overlaps an existing [2026-01-01, 2026-04-01) is rejected with ERR_IWO_PERIOD_OVERLAP, but an adjacent [2026-04-01, 2026-07-01) starting exactly at the prior end is accepted.
        test_recipe:
          setup:
            - "Order with one ISSUED IWO covering [2026-01-01, 2026-04-01)."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP O1", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
