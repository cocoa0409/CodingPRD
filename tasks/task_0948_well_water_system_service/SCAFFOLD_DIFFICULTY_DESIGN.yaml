              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/quotes"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", inspection_id: "${insp_id}", scope: "REPAIR", estimated_labor_minutes: 60, estimated_start_at: "2026-06-03T12:00:00Z", quoted_technician_tier: "APPRENTICE" }
              as: Estimator
