          trigger:
            # The second read of the final unscored component — the cascade origin.
            - *p3_asg2
            - call: "POST /assignments/${asg_p3_r2}/submit-score"
              payload: { score: 2.00 }
              as: Assessor
              as_user_id: "${as2}"
              captures: { fin_asg_status: $.data.status }
            - call: "GET /submissions/${sub_p3}"
              payload: {}
              as: BoardAdministrator
              captures: { p3_status: $.data.status, p3_final: $.data.final_score }
            - call: "GET /certifications"
              payload: { candidate_id: "${cand_a}", cycle_id: "${cyc_id}" }
              as: BoardAdministrator
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /certifications/${cert_id}/stipends"
              payload: {}
              as: IncentiveAdministrator
              captures: { stip_id: "$.data[0].id", stip_amt: "$.data[0].amount_cents", stip_status: "$.data[0].status" }
          assert:
            - "Hop 1: ScoringAssignment.${asg_p3_r2}.status == FINALIZED (agreement |2.00 - 2.00| <= 0.50 finalizes both reads)"
            - "Hop 2: ComponentSubmission.${sub_p3}.status == SCORED and final_score == 2.00"
            - "Hop 3: Certification.${cert_id}.status == CERTIFIED, weighted_total_final == 2.40, certified_at == 2027-01-20T15:00:00Z, valid_until == 2032-05-30T00:00:00Z"
            - "Hop 4: StipendPayment.${stip_id} exists in PROPOSED with amount_cents == 330000 (round(300000 x 1.0 x 1.10), under budget 500000)"
            - "IncentiveProgram.${prog_id}.budget_remaining_cents == 500000 still (proposal does not encumber)"

      - name: assessor_suspension_cascades_to_reassignment
        grounds:
