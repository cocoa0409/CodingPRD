  # ===========================================================================
  - section: calculations
    instances:
      - name: required_enrollments_uses_ceil_of_pct_times_headcount
        claim_type: correct_result
        grounds: [calculations.required_enrollments, entities.EnrollmentCampaign.fields.required_enrollments]
        distinguishing_aspect: "required_enrollments = max(count_min, ceil(pct * active_employees)): with 5 active employees, pct 0.41 -> ceil(2.05) = 3 > count_min 1, so required is 3; with 2 enrolled policies the close lands FAILED, and a third enrolled policy makes the same group's next close land MET."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GA ACTIVE, participation_minimum_pct 0.41, participation_minimum_count 1, DAILY; 5 ACTIVE employees EA1..EA5; counselor CA2; series SA2 ACTIVE with PUBLISHED schedule (event A2 amount 100, max 1, lifetime 10000; premium 100; wellness 50/0/0)."
            - "Campaign CA2-CAM1 window 2026-09-01..2026-09-10 OPEN guaranteed_issue with policies for EA1 and EA2 applied (2 APPLIED)."
            - "Clock to 2026-09-10; CA2-CAM1 locked; closed -> FAILED (enrolled 2 < required 3)."
            - "Campaign CA2-CAM2 window 2026-09-10..2026-09-20 created and opened (counselor CA2, closed-interval adjacency OK because CAM1 is LOCKED-not-OPEN after first close... note CAM1 is FAILED after close; reopen not used). Policies for EA3, EA4, EA5 applied under CAM2 (3 APPLIED) plus EA1/EA2's DECLINED policies flipped? No — CAM1 FAILED left EA1/EA2 policies DECLINED; CAM2 has 3 APPLIED policies."
            - "Clock to 2026-09-20; CAM2 locked."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GA", group_code: "GA", participation_minimum_pct: 0.41, participation_minimum_count: 1 }, as: CarrierAdmin, captures: { ga: $.data.id, ga_v: $.data.version } }
            - { call: "POST /employer-groups/${ga}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GA", full_name: "CGA", home_state: "TX" }, as: CarrierAdmin, captures: { ca2: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "SA2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sa2: $.data.id, sa2_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sa2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "A2", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 10000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { scha: $.data.id } }
            - { call: "POST /benefit-schedules/${scha}/publish", payload: { expected_series_version: "${sa2_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${sa2}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /employees", payload: { employer_group_id: "${ga}", employee_ref: "EA1", full_name: "EA1", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ea1: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${ga}", employee_ref: "EA2", full_name: "EA2", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ea2: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${ga}", employee_ref: "EA3", full_name: "EA3", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ea3: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${ga}", employee_ref: "EA4", full_name: "EA4", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ea4: $.data.id } }
            - { call: "POST /employees", payload: { employer_group_id: "${ga}", employee_ref: "EA5", full_name: "EA5", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { ea5: $.data.id } }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${ga}", counselor_id: "${ca2}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam_a1: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam_a1}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cam_a1}", employee_id: "${ea1}", policy_series_id: "${sa2}" }, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cam_a1}", employee_id: "${ea2}", policy_series_id: "${sa2}" }, as: BenefitCounselor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns/${cam_a1}/lock", payload: {}, as: BenefitCounselor }
            - { call: "GET /employer-groups/${ga}", payload: {}, as: CarrierAdmin, captures: { ga_v1: $.data.version } }
            - { call: "POST /enrollment-campaigns/${cam_a1}/close", payload: { expected_group_version: "${ga_v1}" }, as: BenefitCounselor }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${ga}", counselor_id: "${ca2}", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam_a2: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam_a2}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cam_a2}", employee_id: "${ea3}", policy_series_id: "${sa2}" }, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cam_a2}", employee_id: "${ea4}", policy_series_id: "${sa2}" }, as: BenefitCounselor }
            - { call: "POST /policies", payload: { campaign_id: "${cam_a2}", employee_id: "${ea5}", policy_series_id: "${sa2}" }, as: BenefitCounselor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns/${cam_a2}/lock", payload: {}, as: BenefitCounselor }
            - { call: "GET /employer-groups/${ga}", payload: {}, as: CarrierAdmin, captures: { ga_v2: $.data.version } }
          trigger:
            - { call: "POST /enrollment-campaigns/${cam_a2}/close", payload: { expected_group_version: "${ga_v2}" }, as: BenefitCounselor }
          assert:
            - "EnrollmentCampaign.${cam_a1}.status == FAILED with required_enrollments == 3 (max(1, ceil(0.41*5)) = max(1, 3) = 3) and participation_met == false; the two APPLIED policies under it are DECLINED"
            - "EnrollmentCampaign.${cam_a2}.status == MET with required_enrollments == 3 and participation_met == true (enrolled_count == 3 >= 3 — the >= boundary)"
            - "The three policies under ${cam_a2} are ISSUED"

