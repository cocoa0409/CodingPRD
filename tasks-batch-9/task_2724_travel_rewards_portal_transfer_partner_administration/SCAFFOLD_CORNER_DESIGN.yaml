              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements"
              payload: { partner_name: "Skyward Miles", partner_program_code: "SKYW", ratio_points_out: 1000, ratio_partner_units_in: 1000, min_transfer_points: 5000, transfer_increment_points: 1000, transfer_latency_hours: 48, reversal_window_hours: 72, settlement_cost_cents_per_1k: 900 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /rewards/partner-agreements/${pa_id}/submit"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /rewards/partner-agreements/${pa_id}/approve"
              as: ProgramApprover
              as_user_id: "approver-1"
            - call: "GET /rewards/accounts/${a_id}"
              as: Cardholder
