              as_user_id: "officer-2"
          assert:
            - "PublicNotification.${notif_id}.drafted_by_user_id == \"officer-1\""
            - "The officer-1 certification returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES"
            - "PublicNotification.${notif_id}.status is still APPROVED after the refusal"
            - "PublicNotification.${notif_id}.certified_by_user_id is still null and distributed_at is still null"
            - "The officer-2 certification returns HTTP 200 with status DISTRIBUTED"
            - "PublicNotification.${notif_id}.certified_by_user_id == \"officer-2\" and late_by_hours == 0"
            - "PublicNotification.${notif_id}.delivery_evidence_ref == \"MAILING-2026-0801\" — the refused attempt stored nothing"

  # ===========================================================================
  # Guide section 8 — Cross-cutting complexity layers
  #
  # Active layers in §1.2.1: optimistic_concurrency (two concurrency_rules),
  # cascading_side_effects, dual_variant_calculation, pagination_with_filtering,
  # rate_threshold_triggers and derived_field_reconciliation. The inactive
  # layers (soft_delete, idempotency, bulk_operations, scheduled_actions,
  # multi_tenancy, conditional_feature_flags) are skipped, as recorded in this
  # file's header.
  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: a_determination_built_on_a_stale_entry_point_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.entry-point-determination-supersede
          - errors[ERR_STALE_ENTRY_POINT_VERSION]
          - validations[priority=10]
          - endpoints[POST /compliance-determinations]
        distinguishing_aspect: "The declared write_endpoint for this rule is the determination creation, not an update, so the guard has to be enforced on a POST that creates a child row while reading a parent version — an implementation that only wires expected-version checks into PATCH handlers has no place to put this one. The retry with the current version must then succeed and produce the same determination it would have produced first time."
        test_recipe:
          setup:
            - "EPTDS-01 has one accepted 2026Q2 PFOA result at 3.00 ng/L, so its LRAA is 3.00, its ratio is 0.7500 and its posture is TRIGGERED."
            - "The entry point version is read after the acceptance, and the stale attempt deliberately submits that value minus one."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_id: "$.data.id" }
            - call: "POST /lab-results/${r_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /entry-points/${ep_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ep_v: "$.data.version" }
          trigger:
            - call: "POST /compliance-determinations"
              payload: { entry_point_id: "${ep_id}", contaminant_id: "${pfoa_id}", period_end: "2026Q2", expected_entry_point_version: "${ep_v} - 1" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /compliance-determinations"
              payload: { entry_point_id: "${ep_id}", contaminant_id: "${pfoa_id}", period_end: "2026Q2", expected_entry_point_version: "${ep_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { det_id: "$.data.id" }
          assert:
            - "The stale attempt returns HTTP 412 with error_id ERR_STALE_ENTRY_POINT_VERSION"
            - "GET /compliance-determinations?entry_point_id=${ep_id} returns total_count == 0 after the refusal"
            - "EntryPoint.${ep_id}.version is unchanged by the refused attempt"
            - "The current-version attempt returns HTTP 201 with status DRAFT"
            - "ComplianceDetermination.${det_id}.lraa_ng_per_l == 3.00 and quarters_used == 1"
            - "ComplianceDetermination.${det_id}.determination == NO_VIOLATION"
            - "EntryPoint.${ep_id}.compliance_posture == TRIGGERED and max_compliance_ratio == 0.7500"

      - name: a_funding_application_against_a_stale_project_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.capital-project-funding-supersede
          - errors[ERR_STALE_CAPITAL_PROJECT_VERSION]
          - validations[priority=11]
          - endpoints[POST /capital-projects/{id}/funding-applications]
        distinguishing_aspect: "The second concurrency rule guards a different parent with a different parameter name and a different error code, so an implementation that hard-codes one expected-version field name cannot satisfy both rules; the version here is bumped by the award of the first application, which is exactly what makes the second application's cached version stale."
        test_recipe:
          setup:
            - "The canonical GAC selection on EPTDS-01 gives a CapitalProject at capital 680,000,000 and rate_impact_pct 7.18."
            - "The project version is read once, an SRF_LOAN application for 100,000,000 is filed with it and awarded in full, which bumps the project version and leaves the originally-read value stale."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 520000000, annual_om_estimate_cents: 28000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 18000.00, spent_media_kg: 300.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "GAC scores highest above the removal floor" }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id", proj_v: "$.data[0].version" }
            - call: "POST /capital-projects/${proj_id}/funding-applications"
              payload: { program: "SRF_LOAN", amount_requested_cents: 100000000, disadvantaged_community: false, expected_capital_project_version: "${proj_v}" }
              as: FinanceOfficer
              captures: { app_id: "$.data.id" }
            - call: "POST /funding-applications/${app_id}/decision"
              payload: { action: "AWARD", awarded_cents: 100000000, decision_note: "First tranche awarded" }
              as: StateRegulator
              as_user_id: "regulator-1"
          trigger:
            - call: "POST /capital-projects/${proj_id}/funding-applications"
              payload: { program: "EC_GRANT", amount_requested_cents: 200000000, disadvantaged_community: false, expected_capital_project_version: "${proj_v}" }
              as: FinanceOfficer
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /capital-projects/${proj_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_v2: "$.data.version" }
            - call: "POST /capital-projects/${proj_id}/funding-applications"
              payload: { program: "EC_GRANT", amount_requested_cents: 200000000, disadvantaged_community: false, expected_capital_project_version: "${proj_v2}" }
              as: FinanceOfficer
              captures: { app2_id: "$.data.id" }
          assert:
            - "The stale attempt returns HTTP 412 with error_id ERR_STALE_CAPITAL_PROJECT_VERSION"
            - "The refusal is NOT ERR_STALE_ENTRY_POINT_VERSION — the two concurrency rules carry distinct codes"
            - "GET /funding-applications?capital_project_id=${proj_id} returns total_count == 1 after the refusal"
            - "CapitalProject.${proj_id}.funding_awarded_cents is still 100000000 after the refusal"
            - "The re-read version differs from the version read before the award"
            - "The retry with the fresh version returns HTTP 201 with status SUBMITTED"
            - "FundingApplication.${app2_id}.program == EC_GRANT and awarded_cents == null"

      - name: sample_filtering_and_paging_compose_without_leaking_rows
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /samples]
          - validations[priority=7]
          - consistency_model.pagination
        distinguishing_aspect: "Three samples on one entry point and two on another are read through the entry-point filter with a limit and a non-zero offset, so total_count must describe the filtered set (3) and not the whole table (5), and has_more must be computed against the filtered count as well — the classic failure is a correct page of rows carrying a total_count of 5."
        test_recipe:
          setup:
            - "EPTDS-01 carries three collected samples for 2026Q2 (2026-05-10, 2026-05-15 and 2026-05-20) and EPTDS-02 carries two (2026-05-11 and 2026-05-16); all five precede the 2026-08-01T00:00:00.000Z clock."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-02", source_type: "SURFACE_WATER", population_served: 30000 }
