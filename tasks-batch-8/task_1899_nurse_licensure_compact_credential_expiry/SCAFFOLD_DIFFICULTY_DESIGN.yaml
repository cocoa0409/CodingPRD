            - { call: "POST /credentialing/primary-source-verifications/${psv_a3}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_a3}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_a3}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
