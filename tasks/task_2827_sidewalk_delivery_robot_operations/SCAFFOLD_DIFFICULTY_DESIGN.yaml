scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: delivery_fee_quote_vs_settlement_diverges
        grounds:
          - "calculations.delivery_fee"
          - "entities.DeliveryOrder.fields.quoted_fee_cents"
          - "entities.DeliveryOrder.fields.settled_fee_cents"
          - "entities.Merchant.fields.settlement_variance_cents"
          - "state_machines.DeliveryOrder.IN_TRANSIT_to_DELIVERED"
        distinguishing_aspect: >-
          The two variants of calculations.delivery_fee read different input sets for the same order:
          quote_at_order uses the zone's planning assumptions (planning_haul_m 800.0, planning_crossings 2)
          while settlement_at_completion uses the mission's chronological accumulators
          (traveled_distance_m 774.0, traversed_crossing_count 1), so the same order carries
          quoted_fee_cents 850 and settled_fee_cents 817 and Merchant.settlement_variance_cents is -33.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with planning_haul_m 800.0 and planning_crossings 2"
            - "segments S1 320.0 m, S2 CROSSING 14.0 m, S3 260.0 m, S5 180.0 m all APPROVED and adjacent in that order"
            - "Merchant M1 ACTIVE with merchant_grade PREFERRED (5% discount)"
            - "Robot R1 AVAILABLE, width 78.0 cm, capacity 60.0 L, max_speed_cm_s 150"
            - "order O1 for 22.0 L (MEDIUM tier) promised 40 minutes out (urgency_flag true), quoted from the planning assumptions"
            - "mission departed on route plan P1 = [S1, S2, S3, S5] whose total_length_m is 774.0 and crossing_count is 1"
            - "clock advanced to 2026-08-03T09:12:00.000Z so active_minutes is 12"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S2", segment_type: "CROSSING", crossing_control: "SIGNALIZED", length_m: 14.0, measured_clearance_cm: 150.0, surface_grade_pct: 1.5, sightline_m: 35.0, pedestrian_flow_per_min: 10.0, curb_ramp_present: true, connected_segment_ids: ["${s1}"] }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S3", segment_type: "WALKWAY", length_m: 260.0, measured_clearance_cm: 104.0, surface_grade_pct: 4.0, sightline_m: 25.0, pedestrian_flow_per_min: 12.0, curb_ramp_present: false, connected_segment_ids: ["${s2}"] }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S5", segment_type: "WALKWAY", length_m: 180.0, measured_clearance_cm: 92.0, surface_grade_pct: 6.5, sightline_m: 30.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true, connected_segment_ids: ["${s3}"] }
              as: PlatformAdmin
              captures: { s5: $.data.id }
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { zone_id: "${z}", name: "Corner Bakery", handoff_sla_seconds: 300, merchant_grade: "PREFERRED" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /merchants/${m}/integration-transitions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "MAKE_AVAILABLE" }
              as: FleetDispatcher
            - call: "POST /delivery-orders"
              payload: { merchant_id: "${m}", dropoff_segment_id: "${s5}", customer_ref: "C-1", payload_liters: 22.0, declared_value_cents: 9000, promised_by_utc: "2026-08-03T09:40:00.000Z" }
              as: MerchantOperator
              as_user_id: "${m}"
              captures: { o: $.data.id, o_v: $.data.version }
            - call: "POST /delivery-missions"
              payload: { order_id: "${o}", robot_id: "${r}", expected_delivery_order_version: "${o_v}" }
              as: FleetDispatcher
              captures: { mi: $.data.id }
            - call: "POST /delivery-missions/${mi}/load"
              payload: { actual_payload_liters: 22.0, lid_seal_confirmed: true }
              as: MerchantOperator
              as_user_id: "${m}"
              captures: { mi_v: $.data.version, lid: $.data.lid_access_code }
            - call: "POST /route-plans"
              payload: { mission_id: "${mi}", segment_sequence: ["${s1}", "${s2}", "${s3}", "${s5}"], expected_delivery_mission_version: "${mi_v}" }
              as: FleetDispatcher
              captures: { p: $.data.id }
            - call: "POST /route-plans/${p}/transitions"
              payload: { action: "VALIDATE" }
              as: FleetDispatcher
            - call: "POST /route-plans/${p}/transitions"
              payload: { action: "ACTIVATE" }
              as: FleetDispatcher
            - call: "POST /delivery-missions/${mi}/transitions"
              payload: { action: "DEPART" }
              as: FleetDispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:12:00.000Z" }
              as: PlatformAdmin
            - call: "POST /delivery-missions/${mi}/transitions"
              payload: { action: "ARRIVE" }
              as: FleetDispatcher
          trigger:
            - call: "POST /delivery-missions/${mi}/transitions"
              payload: { action: "COMPLETE", lid_access_code: "${lid}" }
              as: FleetDispatcher
          assert:
            - "DeliveryOrder.${o}.quoted_fee_cents == 850"
            - "DeliveryOrder.${o}.settled_fee_cents == 817"
            - "DeliveryOrder.${o}.order_state == DELIVERED"
            - "DeliveryOrder.${o}.payload_tier == MEDIUM"
            - "DeliveryOrder.${o}.urgency_flag == true"
            - "DeliveryMission.${mi}.traveled_distance_m == 774.0"
            - "DeliveryMission.${mi}.traversed_crossing_count == 1"
            - "DeliveryMission.${mi}.active_minutes == 12"
            - "Merchant.${m}.recognized_fee_cents == 850"
            - "Merchant.${m}.escrowed_fee_cents == 0"
            - "Merchant.${m}.settlement_variance_cents == -33"
      - name: autonomy_index_rolling_vs_lifetime_diverges
        grounds:
          - "calculations.robot_autonomy_index"
          - "entities.Robot.fields.rolling_autonomy_index"
          - "entities.Robot.fields.lifetime_autonomy_index"
          - "entities.Robot.fields.clean_mission_count"
          - "state_machines.Robot.ON_MISSION_to_AVAILABLE"
        distinguishing_aspect: >-
          The rolling_window variant weights the robot's terminal missions by 0.85 ** i in
          completed_at_utc DESC order while lifetime_cumulative weights every mission by exactly 1,
          so a history of one 2-intervention mission followed by one clean mission yields
          rolling_autonomy_index 92 (100 + 1.0 * 2 - 0.85 * 12 = 91.8) against lifetime_autonomy_index 90
          (100 - 12 + 2) on the same two rows.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "Robot R1 AVAILABLE in PERMITTED zone Z1 with both indices at their initial 100"
            - "mission A for order O1 departs, collects two non-mandatory InterventionEvents that reach RELEASED (intervention_count 2, escalation_count 0), then completes"
            - "mission B for order O2 departs clean (intervention_count 0) and is HANDOFF_READY"
            - "clock advanced to 2026-08-03T10:00:00.000Z before mission B completes so mission B is unambiguously the newest terminal mission"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
