            - "oc2v == FAIL at 179.9 °C; Lot.${lot2}.status == CURE_FAILED"

      - name: purge_cost_constants_applied
        claim_type: constants_applied
        grounds: [calculations.purge_cost_and_allocation]
        distinguishing_aspect: "40.0 L purge → cost 40×450+12000 == 30000 cents and VOC 40×0.880 == 35.200 kg; line color switches and version bumps; with no QUEUED lot of the new color the cost stays unallocated without error."
        test_recipe:
