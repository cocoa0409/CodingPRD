# =============================================================================
# Corporate LMS & Compliance Training — seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 (no scaffold_difficulty_design / scaffold_corner_design keys)
# =============================================================================

scenario: "Corporate LMS & Compliance Training: course/curriculum/path, rule-based role assignment, due date/annual recurrence, completion/quiz score, certification/CEU, manager dashboard, overdue escalation, SCORM/xAPI tracking"

domain_name: corporate-lms-compliance-training
api_prefix: ""   # flat/graph topology: many peer top-level collections (/employees, /courses, /learning-paths, /enrollments, /certificates, ...) — no single resource prefix

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers        # overdue escalation tiers; quiz passing-score boundary
    - cascading_side_effects         # session-complete -> enrollment -> certificate -> path-enrollment
    - dual_variant_calculation       # final grade (Enrollment) + CEU accrual (Certificate)
    - derived_field_reconciliation   # path progress %, employee compliance score / counts
    - optimistic_concurrency         # quiz-attempt submission supersede on Enrollment.version

  entity_topology: graph
  # LearningPath <-> Course is many-to-many via PathStep; Course prerequisites form a
  # self-referential DAG via CoursePrerequisite; Employee.manager_id is self-referential.

  state_machine_shape: cyclic
  # Enrollment has a FAILED -> IN_PROGRESS retry loop (cyclic); PathEnrollment is compound
  # (derived from child Enrollment states); Certificate branches ACTIVE -> EXPIRED/REVOKED.

  relationship_patterns:
    - one_to_many        # Course -> Enrollment, Enrollment -> QuizAttempt
    - many_to_many       # LearningPath <-> Course via PathStep
    - self_referential   # Course prerequisites (CoursePrerequisite); Employee.manager_id
    - cross_aggregate    # TrackingSession terminate mutates Enrollment; Enrollment mutates Certificate

  role_model: hierarchical_override
  # Learner < Manager < ComplianceAdmin for read scope; ComplianceAdmin owns config &
  # waivers; Manager owns dashboard + escalation acks for own reports; Learner owns own
  # enrollments/attempts/sessions.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Unique work email; case-insensitive unique" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: department, type: enum, source: input, description: "ENGINEERING | SALES | FINANCE | HR | OPERATIONS" }
      - { name: job_role, type: enum, source: input, description: "IC | MANAGER | DIRECTOR; drives rule-based assignment matching" }
      - { name: manager_id, type: string, source: input, default: null, description: "FK -> Employee.id; self-referential reporting line; null for top of chain" }
      - { name: total_ceu_earned, type: number, source: computed, default: 0, description: "Sum of ceu_credited over this employee's ACTIVE certificates (see calc ceu_accrual); reconciled on cert issue/revoke/expire" }
      - { name: compliant_required_count, type: integer, source: computed, default: 0, description: "Count of this employee's required Enrollments in COMPLETED whose linked Certificate is ACTIVE (see calc compliance_invariants)" }
      - { name: compliance_score, type: number, source: computed, default: 100, description: "Weighted manager-dashboard score 0-100 (see calc compliance_score)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE; all created employees are ACTIVE and participate in assignment sweeps (single-value enum, reserved for future deactivation)" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique catalog code (e.g. SEC-101); case-sensitive unique" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: content_type, type: enum, source: input, description: "SCORM | XAPI; selects the TrackingSession payload contract" }
      - { name: passing_score, type: integer, source: input, description: "Inclusive pass threshold 0-100; a quiz attempt PASSES when score >= passing_score" }
      - { name: max_attempts, type: integer, source: input, default: 3, description: "Max QuizAttempts per Enrollment cycle; positive integer" }
      - { name: ceu_credits, type: number, source: input, default: 0, description: "Nominal CEU awarded on certification; non-negative, 2-decimal" }
      - { name: grading_policy, type: enum, source: input, default: HIGHEST_SCORE, description: "HIGHEST_SCORE | LATEST_ATTEMPT; selects final_grade variant" }
      - { name: ceu_policy, type: enum, source: input, default: STANDARD, description: "STANDARD | SCORE_WEIGHTED; selects ceu_accrual variant" }
      - { name: is_recurring, type: boolean, source: input, default: false, description: "Whether certification expires and the enrollment must recur" }
      - { name: recurrence_months, type: integer, source: input, default: null, description: "Cert validity / recurrence interval in months; required when is_recurring=true, positive" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED -> ARCHIVED; enrollment only allowed against PUBLISHED" }

  - name: CoursePrerequisite
    parent: Course
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; the dependent course (the one that has the prerequisite)" }
      - { name: prerequisite_course_id, type: string, source: input, description: "FK -> Course.id; the course that must be completed first; cycle creation rejected" }

  - name: LearningPath
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique path code; case-sensitive unique" }
      - { name: title, type: string, source: input, description: "Path / curriculum title" }
      - { name: enforce_sequence, type: boolean, source: input, default: true, description: "When true, step N's enrollment may only start after step N-1's Enrollment is COMPLETED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED -> ARCHIVED; path enrollment only allowed against PUBLISHED" }

  - name: PathStep
    parent: LearningPath
    common_fields: true
    fields:
      - { name: learning_path_id, type: string, source: system, description: "FK -> LearningPath.id; owning path" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course at this step" }
      - { name: sequence_index, type: integer, source: input, description: "1-based ordinal position within the path; unique within the path" }
      - { name: is_mandatory, type: boolean, source: input, default: true, description: "Mandatory steps drive path completion and progress weighting" }
      - { name: weight, type: integer, source: input, default: 1, description: "Positive integer weight for path_progress_pct; ignored when is_mandatory=false" }

  - name: AssignmentRule
    parent: null
    common_fields: true
    fields:
      - { name: target_department, type: enum, source: input, description: "ENGINEERING | SALES | FINANCE | HR | OPERATIONS | ANY" }
      - { name: target_job_role, type: enum, source: input, description: "IC | MANAGER | DIRECTOR | ANY" }
      - { name: course_id, type: string, source: input, default: null, description: "FK -> Course.id; mutually exclusive with learning_path_id (exactly one set)" }
      - { name: learning_path_id, type: string, source: input, default: null, description: "FK -> LearningPath.id; mutually exclusive with course_id" }
      - { name: due_in_days, type: integer, source: input, description: "Days from assignment to due_date; non-negative integer" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the rule's effective window (ISO8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Inclusive end of the rule's effective window; must be >= effective_from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE; all created rules are ACTIVE and participate in sweeps and overlap checks (single-value enum, reserved for future disable)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the learner" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course" }
      - { name: path_enrollment_id, type: string, source: system, default: null, description: "FK -> PathEnrollment.id; set when this enrollment is a step of a path enrollment, else null" }
      - { name: assignment_rule_id, type: string, source: system, default: null, description: "FK -> AssignmentRule.id; set when created by a rule sweep, else null (self-enrolled / path)" }
      - { name: is_required, type: boolean, source: input, default: true, description: "Required enrollments count toward compliance; optional ones do not" }
      - { name: due_date, type: datetime, source: system, description: "When this enrollment is due (ISO8601 UTC)" }
      - { name: best_score, type: integer, source: computed, default: null, description: "Highest QuizAttempt.score over the current cycle; null before any attempt" }
      - { name: latest_score, type: integer, source: computed, default: null, description: "Score of the most recent QuizAttempt by created_at; null before any attempt" }
      - { name: final_grade, type: integer, source: computed, default: null, description: "Recorded grade on COMPLETED/FAILED per course.grading_policy (see calc final_grade)" }
      - { name: attempts_used, type: integer, source: computed, default: 0, description: "Count of QuizAttempts in the current cycle" }
      - { name: cycle_index, type: integer, source: system, default: 1, description: "Recurrence cycle counter; increments by 1 on each recurrence reset" }
      - { name: escalation_tier, type: integer, source: computed, default: 0, description: "0=on-track,1,2,3 per days overdue (see calc escalation_tier)" }
      - { name: certificate_id, type: string, source: system, default: null, description: "1:1 back-pointer to the Certificate issued for the current cycle, else null; the canonical link is Certificate.enrollment_id (queryable via GET /certificates?enrollment_id=)" }
      - { name: status, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED -> IN_PROGRESS -> COMPLETED | FAILED; FAILED -> IN_PROGRESS (retry); -> EXPIRED (clock); -> WAIVED (admin)" }

  - name: QuizAttempt
    parent: Enrollment
    common_fields: false   # immutable append-only record: only id + created_at
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: cycle_index, type: integer, source: system, description: "Enrollment.cycle_index at submission time; partitions attempts per cycle" }
      - { name: attempt_number, type: integer, source: system, description: "1-based ordinal within the cycle (= attempts_used after this attempt)" }
      - { name: score, type: integer, source: input, description: "Raw quiz score 0-100 inclusive" }
      - { name: passed, type: boolean, source: computed, description: "score >= owning course.passing_score" }

  - name: PathEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the learner" }
      - { name: learning_path_id, type: string, source: input, description: "FK -> LearningPath.id; the path" }
      - { name: assignment_rule_id, type: string, source: system, default: null, description: "FK -> AssignmentRule.id; set when created by a rule sweep, else null" }
      - { name: due_date, type: datetime, source: system, description: "Path due date (ISO8601 UTC)" }
      - { name: progress_pct, type: number, source: computed, default: 0, description: "Weighted mandatory-step completion percent 0-100 (see calc path_progress_pct)" }
      - { name: status, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED -> IN_PROGRESS -> COMPLETED | FAILED; compound state derived from child Enrollments" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; holder" }
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; certified course" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the completing enrollment cycle" }
      - { name: ceu_credited, type: number, source: computed, description: "CEU awarded at issue per course.ceu_policy (see calc ceu_accrual); contributes to Employee.total_ceu_earned while ACTIVE" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp (ISO8601 UTC)" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "issued_at + course.recurrence_months when course.is_recurring, else null (never expires)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> EXPIRED (clock) | REVOKED (recurrence reset / waiver compensation)" }

  - name: TrackingSession
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; owning enrollment" }
      - { name: content_type, type: enum, source: system, description: "SCORM | XAPI; copied from the course at session open" }
      - { name: started_at, type: datetime, source: system, description: "Session open timestamp (ISO8601 UTC); interval start (inclusive)" }
      - { name: terminated_at, type: datetime, source: system, default: null, description: "Session close timestamp; interval end (exclusive); null while open" }
      - { name: lesson_status, type: enum, source: input, default: null, description: "SCORM cmi.core.lesson_status / xAPI verb mapped: INCOMPLETE | COMPLETED | PASSED | FAILED; set on commit" }
      - { name: progress_pct, type: integer, source: input, default: 0, description: "0-100 progress measure committed by the runtime" }
      - { name: reported_score, type: integer, source: input, default: null, description: "Score reported by SCORM/xAPI runtime 0-100; promoted to a QuizAttempt on terminating commit when present" }
      - { name: status, type: enum, source: system, default: INITIALIZED, description: "INITIALIZED -> RUNNING -> TERMINATED; only one non-TERMINATED session per enrollment" }

  - name: EscalationEvent
    parent: Enrollment
    common_fields: false   # immutable append-only log: id + created_at only
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the overdue enrollment" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; the learner (denormalized for dashboard queries)" }
      - { name: manager_id, type: string, source: system, default: null, description: "FK -> Employee.id; the learner's manager at escalation time, else null" }
      - { name: tier, type: integer, source: system, description: "Escalation tier reached (1,2,3) that produced this event" }
      - { name: days_overdue, type: integer, source: system, description: "Whole days past due_date at escalation time" }
      - { name: acknowledged, type: boolean, source: system, default: false, description: "Whether the manager has acknowledged this event" }

  - name: ClockState
    parent: null
    common_fields: true
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Deterministic system clock (ISO8601 UTC); advanced only via /_clock/set; singleton" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Course
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /courses/{id}/publish"
        actor: ComplianceAdmin
        preconditions:
          - "Course in DRAFT (else ERR_INVALID_STATE)"
          - "If is_recurring=true then recurrence_months is a positive integer (else ERR_RECURRENCE_CONFIG_INVALID)"
          - "Every prerequisite_course_id in CoursePrerequisite resolves to a PUBLISHED Course (else ERR_PREREQUISITE_NOT_PUBLISHED)"
        side_effects: ["increments Course.version by 1"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /courses/{id}/archive"
        actor: ComplianceAdmin
        preconditions:
          - "Course in PUBLISHED (else ERR_INVALID_STATE)"
          - "No Enrollment for this course in NOT_STARTED or IN_PROGRESS (else ERR_COURSE_HAS_OPEN_ENROLLMENTS)"
        side_effects: ["increments Course.version by 1"]

  - entity: LearningPath
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /learning-paths/{id}/publish"
        actor: ComplianceAdmin
        preconditions:
          - "Path in DRAFT (else ERR_INVALID_STATE)"
          - "Path has >= 1 PathStep (else ERR_PATH_EMPTY)"
          - "Every PathStep.course_id references a PUBLISHED Course (else ERR_PATH_STEP_COURSE_NOT_PUBLISHED)"
          - "sequence_index values are 1..N contiguous with no gaps/dupes (else ERR_PATH_SEQUENCE_INVALID)"
        side_effects: ["increments LearningPath.version by 1"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /learning-paths/{id}/archive"
        actor: ComplianceAdmin
        preconditions:
          - "Path in PUBLISHED (else ERR_INVALID_STATE)"
          - "No PathEnrollment for this path in NOT_STARTED or IN_PROGRESS (else ERR_PATH_HAS_OPEN_ENROLLMENTS)"
        side_effects: ["increments LearningPath.version by 1"]

  - entity: Enrollment
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /enrollments/{id}/start"
        actor: Learner
        preconditions:
          - "Enrollment in NOT_STARTED (else ERR_INVALID_STATE)"
          - "Acting Learner owns the enrollment: X-User-ID == enrollment.employee_id (else ERR_UNAUTHORIZED)"
          - "Course is PUBLISHED (cross-entity; else ERR_COURSE_NOT_PUBLISHED)"
          - "Every prerequisite course for this course has an ACTIVE Certificate for this employee (else ERR_PREREQUISITE_NOT_MET)"
          - "If this enrollment belongs to a path and path.enforce_sequence=true, the prior PathStep's Enrollment is COMPLETED (cross-entity; else ERR_PATH_STEP_LOCKED)"
        side_effects:
          - "sets Enrollment.status=IN_PROGRESS"
          - "if owning PathEnrollment is NOT_STARTED, bubbles up: PathEnrollment.status=IN_PROGRESS"
          - "increments Enrollment.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /enrollments/{id}/quiz-attempts (passing attempt) or terminating TrackingSession commit with passing reported_score"
        actor: Learner
        preconditions:
          - "Enrollment in IN_PROGRESS (else ERR_INVALID_STATE)"
          - "The attempt PASSES: score >= course.passing_score (boundary >=)"
          - "expected_enrollment_version matches Enrollment.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "appends QuizAttempt (attempt_number = attempts_used+1, cycle_index = enrollment.cycle_index)"
          - "recomputes best_score, latest_score, attempts_used"
          - "sets final_grade per calc final_grade"
          - "sets Enrollment.status=COMPLETED"
          - "issues a Certificate (status=ACTIVE) -> computes ceu_credited (calc ceu_accrual) -> sets Enrollment.certificate_id"
          - "credits Employee.total_ceu_earned += ceu_credited and increments Employee.compliant_required_count when is_required (calc compliance_invariants)"
          - "recomputes Employee.compliance_score"
          - "if part of a path, re-evaluates PathEnrollment.progress_pct and may bubble PathEnrollment -> COMPLETED"
          - "increments Enrollment.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /enrollments/{id}/quiz-attempts (failing attempt that exhausts max_attempts) or terminating session commit with failing score at last attempt"
        actor: Learner
        preconditions:
          - "Enrollment in IN_PROGRESS (else ERR_INVALID_STATE)"
          - "The attempt FAILS: score < course.passing_score"
          - "attempts_used+1 == course.max_attempts (final attempt; else stays IN_PROGRESS)"
          - "expected_enrollment_version matches Enrollment.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "appends QuizAttempt"
          - "recomputes best_score, latest_score, attempts_used"
          - "sets final_grade per calc final_grade"
          - "sets Enrollment.status=FAILED"
          - "if part of a mandatory path step, bubbles PathEnrollment -> FAILED"
          - "increments Enrollment.version by 1"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /enrollments/{id}/reopen"
        actor: ComplianceAdmin
        preconditions:
          - "Enrollment in FAILED (else ERR_INVALID_STATE)"
          - "Course is PUBLISHED (else ERR_COURSE_NOT_PUBLISHED)"
        note: "Cyclic retry loop: resets attempts for a fresh try within the same cycle_index."
        side_effects:
          - "sets Enrollment.status=IN_PROGRESS"
          - "resets attempts_used=0, best_score=null, latest_score=null, final_grade=null for the cycle (prior QuizAttempts retain their cycle_index but new attempts start attempt_number=1 again)"
          - "if PathEnrollment was FAILED due to this step, bubbles PathEnrollment -> IN_PROGRESS"
          - "increments Enrollment.version by 1"
      - from: NOT_STARTED
        to: EXPIRED
        trigger: "system: POST /_clock/set advancing past due_date with status NOT_STARTED, then POST /escalations/run"
        actor: system
        preconditions:
          - "ClockState.current_utc strictly after due_date AND enrollment still NOT_STARTED"
        note: "EXPIRED is non-terminal for recurring courses (recurrence reset reopens); terminal otherwise until reopened by admin."
        side_effects:
          - "sets Enrollment.status=EXPIRED"
          - "increments Enrollment.version by 1"
      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "system: clock advances past due_date with status IN_PROGRESS, then POST /escalations/run"
        actor: system
        preconditions:
          - "ClockState.current_utc strictly after due_date AND enrollment still IN_PROGRESS"
        side_effects:
          - "sets Enrollment.status=EXPIRED"
          - "increments Enrollment.version by 1"
      - from: NOT_STARTED
        to: WAIVED
        trigger: "POST /enrollments/{id}/waive"
        actor: ComplianceAdmin
        preconditions:
          - "Enrollment in NOT_STARTED, IN_PROGRESS, FAILED, or EXPIRED (else ERR_INVALID_STATE)"
        side_effects:
          - "sets Enrollment.status=WAIVED"
          - "if part of a path, re-evaluates PathEnrollment.progress_pct treating waived mandatory steps as satisfied"
          - "increments Enrollment.version by 1"
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "POST /enrollments/{id}/waive"
        actor: ComplianceAdmin
        preconditions:
          - "Enrollment in NOT_STARTED, IN_PROGRESS, FAILED, or EXPIRED (else ERR_INVALID_STATE)"
        side_effects:
          - "sets Enrollment.status=WAIVED"
          - "increments Enrollment.version by 1"
      - from: COMPLETED
        to: NOT_STARTED
        trigger: "system: clock advances past linked Certificate.expires_at, then POST /escalations/run (recurrence reset)"
        actor: system
        preconditions:
          - "Enrollment in COMPLETED, course.is_recurring=true, linked Certificate ACTIVE and ClockState.current_utc strictly after Certificate.expires_at"
        note: "Recurrence reset: starts a new compliance cycle."
        side_effects:
          - "REVOKES the linked Certificate (Certificate.status=EXPIRED), compensating: Employee.total_ceu_earned -= ceu_credited, Employee.compliant_required_count -= 1 when is_required"
          - "sets Enrollment.status=NOT_STARTED, cycle_index += 1, certificate_id=null, due_date = current_utc + course.recurrence_months, final_grade=null, attempts_used=0, best_score=null, latest_score=null"
          - "recomputes Employee.compliance_score"
          - "increments Enrollment.version by 1"

  - entity: PathEnrollment
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "bubble-up: any child Enrollment transitions NOT_STARTED -> IN_PROGRESS"
        actor: system
        preconditions: ["PathEnrollment in NOT_STARTED"]
        side_effects: ["sets PathEnrollment.status=IN_PROGRESS", "increments PathEnrollment.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "bubble-up: a child Enrollment reaches COMPLETED making all mandatory steps satisfied"
        actor: system
        preconditions:
          - "Every mandatory PathStep's child Enrollment is COMPLETED or WAIVED (compound; else stays IN_PROGRESS)"
        side_effects:
          - "recomputes PathEnrollment.progress_pct (calc path_progress_pct) -> 100"
          - "sets PathEnrollment.status=COMPLETED"
          - "increments PathEnrollment.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "bubble-up: a mandatory child Enrollment reaches FAILED"
        actor: system
        preconditions: ["a mandatory PathStep's child Enrollment is FAILED"]
        side_effects: ["sets PathEnrollment.status=FAILED", "increments PathEnrollment.version by 1"]
      - from: FAILED
        to: IN_PROGRESS
        trigger: "bubble-up: the failed mandatory child Enrollment is reopened (FAILED -> IN_PROGRESS)"
        actor: system
        preconditions: ["PathEnrollment in FAILED and the offending child Enrollment is no longer FAILED"]
        side_effects: ["sets PathEnrollment.status=IN_PROGRESS", "increments PathEnrollment.version by 1"]

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advances past expires_at, then POST /escalations/run"
        actor: system
        preconditions: ["Certificate ACTIVE, expires_at not null, ClockState.current_utc strictly after expires_at"]
        note: "Drives the recurrence reset of the linked Enrollment (see Enrollment COMPLETED->NOT_STARTED)."
        side_effects:
          - "sets Certificate.status=EXPIRED"
          - "compensates Employee.total_ceu_earned -= ceu_credited; if linked Enrollment is_required, Employee.compliant_required_count -= 1"
          - "increments Certificate.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /certificates/{id}/revoke"
        actor: ComplianceAdmin
        preconditions: ["Certificate ACTIVE (else ERR_INVALID_STATE)"]
        note: "Manual revoke compensates the same conserved quantities as expiry."
        side_effects:
          - "sets Certificate.status=REVOKED"
          - "compensates Employee.total_ceu_earned -= ceu_credited; if linked Enrollment is_required, Employee.compliant_required_count -= 1"
          - "recomputes Employee.compliance_score"
          - "increments Certificate.version by 1"

  - entity: TrackingSession
    initial_state: INITIALIZED
    terminal_states: [TERMINATED]
    transitions:
      - from: INITIALIZED
        to: RUNNING
        trigger: "POST /enrollments/{id}/tracking-sessions (open) then first PATCH commit"
        actor: Learner
        preconditions:
          - "Enrollment in IN_PROGRESS (else ERR_INVALID_STATE)"
          - "No other TrackingSession for this enrollment in INITIALIZED or RUNNING (else ERR_SESSION_ALREADY_OPEN)"
        side_effects: ["sets TrackingSession.status=RUNNING", "increments TrackingSession.version by 1"]
      - from: RUNNING
        to: RUNNING
        trigger: "PATCH /tracking-sessions/{id}/commit"
        actor: Learner
        preconditions:
          - "Session RUNNING (else ERR_INVALID_STATE)"
          - "progress_pct in 0..100; reported_score (if present) in 0..100"
        note: "Cyclic self-loop: multiple commits accumulate runtime data."
        side_effects: ["updates lesson_status, progress_pct, reported_score", "increments TrackingSession.version by 1"]
      - from: RUNNING
        to: TERMINATED
        trigger: "POST /tracking-sessions/{id}/terminate"
        actor: Learner
        preconditions:
          - "Session RUNNING (else ERR_INVALID_STATE)"
          - "terminated_at interval end is strictly after started_at"
        note: "Cross-aggregate cascade: a terminating commit carrying a reported_score promotes to a QuizAttempt and drives the Enrollment forward."
        side_effects:
          - "sets terminated_at = ClockState.current_utc, TrackingSession.status=TERMINATED"
          - "if reported_score present, promotes it to a QuizAttempt on the enrollment and applies the Enrollment IN_PROGRESS->COMPLETED or ->FAILED transition with its full side-effect chain"
          - "increments TrackingSession.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quiz-attempt-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{id}/quiz-attempts"
    occ_field: "expected_enrollment_version"
    description: |
      Submitting a QuizAttempt against an Enrollment whose version has advanced
      since the client last observed it is rejected. This captures the case where
      a recurrence reset (which legitimately supersedes the prior cycle, bumping
      cycle_index and version) or a prior attempt has already advanced the
      enrollment, so the current writer's view is stale and its attempt would
      otherwise be recorded against the wrong cycle.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: final_grade
    trigger: "On Enrollment IN_PROGRESS->COMPLETED and IN_PROGRESS->FAILED"
    algorithm: aggregation
    formula: |
      attempts = QuizAttempts where enrollment_id == E.id AND cycle_index == E.cycle_index
      if course.grading_policy == HIGHEST_SCORE:
          final_grade = max(a.score for a in attempts)        # tie irrelevant (max of equal values)
      else:  # LATEST_ATTEMPT
          final_grade = the score of the attempt with the greatest created_at
                        (tie-break: greatest attempt_number)
    input_set: "QuizAttempts of the current cycle only (cycle_index == enrollment.cycle_index)"
    constants: {}
    precision: "integer score 0-100; no rounding"
    variants:
      - name: highest_score
        when: "course.grading_policy == HIGHEST_SCORE"
        difference: "final_grade is the maximum score across the cycle's attempts"
      - name: latest_attempt
        when: "course.grading_policy == LATEST_ATTEMPT"
        difference: "final_grade is the most recent attempt's score (by created_at, then attempt_number) — diverges from highest_score whenever the last attempt is not the best"

  - name: ceu_accrual
    trigger: "On Certificate issue (Enrollment IN_PROGRESS->COMPLETED side-effect)"
    algorithm: tiered_pricing
    formula: |
      base = course.ceu_credits
      if course.ceu_policy == STANDARD:
          ceu_credited = round(base, 2)
      else:  # SCORE_WEIGHTED — tiered multiplier on the certifying final_grade
          g = enrollment.final_grade
          if   g >= 90: mult = 1.00
          elif g >= 80: mult = 0.75   # tier boundary: 80 inclusive
          else:         mult = 0.50   # passing but < 80
          ceu_credited = round(base * mult, 2)   # round AFTER multiply
    input_set: "Single course's ceu_credits and the certifying enrollment's final_grade"
    constants: { TIER_HIGH: 90, TIER_MID: 80, MULT_HIGH: 1.00, MULT_MID: 0.75, MULT_LOW: 0.50 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_ceu
        when: "course.ceu_policy == STANDARD"
        difference: "Full ceu_credits regardless of score"
      - name: score_weighted_ceu
        when: "course.ceu_policy == SCORE_WEIGHTED"
        difference: "ceu_credits scaled by a score-band multiplier; diverges from standard whenever final_grade < 90"

  - name: path_progress_pct
    trigger: "On any child Enrollment status change; on PathEnrollment read"
    algorithm: weighted_scoring
    formula: |
      mandatory = PathSteps where learning_path_id == path.id AND is_mandatory == true
      total_weight = sum(s.weight for s in mandatory)
      # per-step satisfied fraction is 1 if the child Enrollment is COMPLETED or WAIVED, else 0
      earned_weight = sum(s.weight for s in mandatory
                          if child Enrollment(employee, s.course_id) in {COMPLETED, WAIVED})
      # ROUNDING ORDER PINNED: compute the single ratio, multiply by 100, THEN round once.
      # (Do NOT round each step's contribution then sum — that is the wrong order.)
      if total_weight == 0: progress_pct = 0
      else: progress_pct = round((earned_weight / total_weight) * 100, 2)
    input_set: "Mandatory PathSteps of the path; their per-employee child Enrollments"
    constants: {}
    precision: "2 decimal places, round_half_up; round ONCE after the aggregate ratio (sum-then-round, not round-then-sum)"

  - name: escalation_tier
    trigger: "On POST /escalations/run for each overdue Enrollment"
    algorithm: threshold
    formula: |
      days_overdue = floor((ClockState.current_utc - enrollment.due_date) / 1 day)   # whole days, floor
      if   days_overdue <= 0:  tier = 0      # not overdue (boundary: due_date itself is on-track)
      elif days_overdue <= 7:  tier = 1      # 1..7 days
      elif days_overdue <= 30: tier = 2      # 8..30 days
      else:                    tier = 3      # >30 days
    input_set: "Enrollments in NOT_STARTED or IN_PROGRESS with due_date < current_utc"
    constants: { TIER1_MAX_DAYS: 7, TIER2_MAX_DAYS: 30 }
    precision: "integer days, floor; tier is an integer 0-3"

  - name: compliance_score
    trigger: "On Enrollment completion/expiry/waiver; on Certificate revoke/expire; on GET /employees/{id}/dashboard"
    algorithm: weighted_scoring
    formula: |
      req = this employee's required Enrollments (is_required == true), latest cycle only
      n = count(req)
      if n == 0: compliance_score = 100.00
      else:
        compliant   = count(req where status==COMPLETED AND linked Certificate ACTIVE)
        overdue_pts = sum over req of escalation_tier(e) * TIER_PENALTY   # >=3 inputs, non-linear
        base = (compliant / n) * 100
        compliance_score = round(max(0, min(100, base - overdue_pts)), 2)
    input_set: "Employee's required Enrollments (latest cycle), their statuses, escalation tiers, linked certificate statuses"
    constants: { TIER_PENALTY: 5 }
    precision: "2 decimal places, round_half_up; clamp to [0,100]"

  - name: compliance_invariants
    trigger: "On Certificate issue (forward) and Certificate revoke/expire (compensation)"
    algorithm: aggregation
    formula: |
      # Conserved quantity 1 (CEU): Employee.total_ceu_earned == sum(c.ceu_credited
      #   for c in Certificates where c.employee_id==emp.id AND c.status==ACTIVE)
      # Conserved quantity 2 (compliance count): Employee.compliant_required_count ==
      #   count(e in Enrollments where e.employee_id==emp.id AND e.is_required AND
      #         e.status==COMPLETED AND linked Certificate ACTIVE)
      # Forward (issue): total_ceu_earned += ceu_credited; compliant_required_count += (is_required ? 1 : 0)
      # Compensation (revoke/expire): total_ceu_earned -= ceu_credited; compliant_required_count -= (is_required ? 1 : 0)
    input_set: "Employee's ACTIVE certificates and required completed enrollments"
    constants: {}
    precision: "total_ceu_earned 2 decimals; compliant_required_count integer; both equal their definitional aggregate after any issue/revoke/expire"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-ID header present for entity_backed roles (Learner, Manager)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except /_clock and /courses,/learning-paths GET catalogs"
  - priority: 3
    category: auth
    check: "Acting role is permitted for the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body-referenced FKs (course_id, learning_path_id, employee_id, prerequisite_course_id, manager_id) resolve to existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "create/link endpoints carrying FK fields"
  - priority: 6
    category: business_constraint
    check: "Required input fields present and well-typed (enums in range, scores 0-100, positive integers where required)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: business_constraint
    check: "Ownership: Learner acting on an enrollment/session/attempt must own it (X-User-ID == employee_id); Manager dashboard only for own reports"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "learner-owned and manager-scoped endpoints"
  - priority: 8
    category: state
    check: "Target resource is in a state from which this transition is defined (§1.2). For POST /enrollments/{id}/quiz-attempts this rejects only NOT_STARTED, COMPLETED, EXPIRED, WAIVED (IN_PROGRESS and FAILED pass through to the OCC and attempts checks below)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "OCC: expected_enrollment_version matches Enrollment.version on quiz-attempt submission (checked before the attempts-remaining business check, so a stale version on a FAILED enrollment yields ERR_STALE_VERSION, not ERR_ATTEMPTS_EXHAUSTED)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/quiz-attempts"
  - priority: 10
    category: business_safety
    check: "Enrollment/start: course must be PUBLISHED (compliance gate before content access)"
    error_id: ERR_COURSE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /enrollments, POST /enrollments/{id}/start, POST /enrollments/{id}/reopen"
  - priority: 11
    category: business_referential
    check: "Prerequisite courses all hold an ACTIVE Certificate for the learner before start"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 409
    applies_to: "POST /enrollments/{id}/start"
  - priority: 12
    category: business_temporal
    check: "Path sequence: when enforce_sequence, prior PathStep's enrollment is COMPLETED before starting this step"
    error_id: ERR_PATH_STEP_LOCKED
    http_status: 409
    applies_to: "POST /enrollments/{id}/start (path-step enrollments)"
  - priority: 13
    category: business_constraint
    check: "Quiz attempts remain for the cycle: the enrollment is IN_PROGRESS with attempts_used < course.max_attempts. A FAILED enrollment (cycle attempts already exhausted) submitting another attempt is rejected here with ERR_ATTEMPTS_EXHAUSTED."
    error_id: ERR_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /enrollments/{id}/quiz-attempts"
  - priority: 14
    category: business_constraint
    check: "At most one non-TERMINATED TrackingSession per enrollment (interval occupation)"
    error_id: ERR_SESSION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /enrollments/{id}/tracking-sessions"
  - priority: 15
    category: business_temporal
    check: "AssignmentRule effective window non-overlap: a new ACTIVE rule for the same (target_department, target_job_role, course_id|learning_path_id) target whose [effective_from, effective_to] closed interval intersects an existing ACTIVE rule's window is rejected"
    error_id: ERR_ASSIGNMENT_RULE_OVERLAP
    http_status: 409
    applies_to: "POST /assignment-rules"
  - priority: 16
    category: business_constraint
    check: "Course prerequisite DAG: adding a prerequisite that would create a cycle is rejected"
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 409
    applies_to: "POST /courses/{id}/prerequisites"
  - priority: 17
    category: business_constraint
    check: "Uniqueness: no duplicate ACTIVE-cycle Enrollment for the same (employee_id, course_id); unique Course.code, LearningPath.code, Employee.email, PathStep.sequence_index within path"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints"
  - priority: 18
    category: business_constraint
    check: "AssignmentRule must set exactly one of course_id / learning_path_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /assignment-rules"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Employees -----------------------------------------------------------
  - method: POST
    path: "/employees"
    description: "Create an employee"
    roles: [ComplianceAdmin]
    code: 201
    input: [email, full_name, department, job_role, "manager_id?"]
    output: Employee
    side_effects: ["initializes total_ceu_earned=0, compliant_required_count=0, compliance_score=100"]
  - method: GET
    path: "/employees/{id}"
    description: "Get one employee"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees"
    description: "List employees (filter by manager_id for reverse-reachability of reporting line)"
    roles: [ComplianceAdmin, Manager]
    code: 200
    input: ["manager_id?", "department?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: GET
    path: "/employees/{id}/dashboard"
    description: "Manager dashboard: computed compliance_score, counts, and overdue summary for the employee"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: Employee
    side_effects: ["recomputes compliance_score, total_ceu_earned, compliant_required_count on read"]

  # ---- Courses -------------------------------------------------------------
  - method: POST
    path: "/courses"
    description: "Create a course (DRAFT)"
    roles: [ComplianceAdmin]
    code: 201
    input: [code, title, content_type, passing_score, "max_attempts?", "ceu_credits?", "grading_policy?", "ceu_policy?", "is_recurring?", "recurrence_months?"]
    output: Course
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/courses/{id}"
    description: "Get one course"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/courses"
    description: "List courses (catalog)"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["status?", "content_type?", "limit?", "offset?"]
    output: Course[]
    side_effects: []
  - method: POST
    path: "/courses/{id}/publish"
    description: "Publish a course (DRAFT->PUBLISHED)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Course
    side_effects: ["validates recurrence config and prerequisites; increments Course.version"]
  - method: POST
    path: "/courses/{id}/archive"
    description: "Archive a course (PUBLISHED->ARCHIVED)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Course
    side_effects: ["increments Course.version"]
  - method: POST
    path: "/courses/{id}/prerequisites"
    description: "Add a prerequisite course (DAG edge); rejects cycles"
    roles: [ComplianceAdmin]
    code: 201
    input: [prerequisite_course_id]
    output: CoursePrerequisite
    side_effects: ["cycle check across CoursePrerequisite edges"]
  - method: GET
    path: "/course-prerequisites"
    description: "List course prerequisite edges, filterable by course_id (the dependent) or prerequisite_course_id (the dependency) — reverse-reachability for both CoursePrerequisite FKs"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["course_id?", "prerequisite_course_id?", "limit?", "offset?"]
    output: CoursePrerequisite[]
    side_effects: []
  - method: GET
    path: "/course-prerequisites/{id}"
    description: "Get one prerequisite edge"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: CoursePrerequisite
    side_effects: []

  # ---- Learning paths ------------------------------------------------------
  - method: POST
    path: "/learning-paths"
    description: "Create a learning path / curriculum (DRAFT)"
    roles: [ComplianceAdmin]
    code: 201
    input: [code, title, "enforce_sequence?"]
    output: LearningPath
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/learning-paths/{id}"
    description: "Get one learning path"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: LearningPath
    side_effects: []
  - method: POST
    path: "/learning-paths/{id}/steps"
    description: "Add an ordered step (course) to a path"
    roles: [ComplianceAdmin]
    code: 201
    input: [course_id, sequence_index, "is_mandatory?", "weight?"]
    output: PathStep
    side_effects: []
  - method: GET
    path: "/learning-paths/{id}/steps"
    description: "List a path's steps (reverse-reachability for PathStep.learning_path_id)"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["limit?", "offset?"]
    output: PathStep[]
    side_effects: []
