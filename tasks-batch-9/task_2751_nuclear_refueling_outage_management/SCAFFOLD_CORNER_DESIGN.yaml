              payload: { label: "Long lead rotor work", planned_start_offset_hours: 0, planned_duration_hours: 200 }
              as: OutagePlanner
              captures: { act_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO-D discretionary lagging repair", estimated_hours: 1, estimated_cost_usd: 5000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wod_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO-H feedwater pump overhaul", estimated_hours: 10, estimated_cost_usd: 50000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { woh_id: "$.data.id" }
            - call: "POST /work-orders/${wod_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${woh_id}/plan"
              payload: {}
              as: OutagePlanner
          trigger:
            - call: "POST /work-orders/${wod_id}/approve-scope"
              payload: {}
              as: OutageDirector
              captures: { err_frozen: "$.data.error_id" }
            - call: "POST /work-orders/${woh_id}/approve-scope"
              payload: {}
              as: OutageDirector
              captures: { woh_status: "$.data.status" }
          assert:
            - "Outage.${o_id}.projected_duration_hours == 200.00 and schedule_posture == RECOVERY_REQUIRED before either trigger"
            - "WorkOrder.${wod_id}.priority_score == 23.00 with priority == DISCRETIONARY and WorkOrder.${woh_id}.priority_score == 50.00 with priority == HIGH"
            - "${err_frozen} == ERR_SCOPE_FROZEN with HTTP 409 and WorkOrder.${wod_id}.status is still PLANNED"
            - "${woh_status} == APPROVED — the freeze applies only to the DISCRETIONARY band"
            - "Outage.${o_id}.approved_scope_cost_usd == 50000.00 — only WO-H entered the rollup"

      - name: path_and_role_checks_outrank_body_schema_checks
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "validations[priority=4]", "errors[ERR_UNAUTHORIZED]", "errors[ERR_OUTAGE_NOT_FOUND]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Two ladder rungs are pinned with one deliberately malformed body: an unknown outage id with a missing required field returns 404 (priority 3), not 400 (priority 4); and the same malformed call from a role that cannot use the endpoint at all returns 403 (priority 2), not 404."
        test_recipe:
          setup:
            - "One real outage exists. Every trigger omits the required estimated_hours field, so the priority-4 check would fire if it were ever reached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /outages/00000000-0000-4000-8000-000000000000/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Malformed and orphaned", estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { err_404: "$.data.error_id" }
            - call: "POST /outages/00000000-0000-4000-8000-000000000000/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Malformed and orphaned", estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: RadProtectionManager
              captures: { err_403: "$.data.error_id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Malformed only", estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { err_400: "$.data.error_id" }
          assert:
            - "${err_404} == ERR_OUTAGE_NOT_FOUND with HTTP 404 — priority 3 beats priority 4"
            - "${err_403} == ERR_UNAUTHORIZED with HTTP 403 — priority 2 beats both priority 3 and priority 4"
            - "${err_400} == ERR_INVALID_REQUEST with HTTP 400 — with the path and role clean, the body check finally answers"
            - "GET /work-orders?outage_id=${o_id} returns 0 rows after all three calls"

      - name: cross_entity_state_beats_the_dose_budget_gate
        claim_type: priority_conflict
        grounds: ["validations[priority=7]", "validations[priority=23]"]
        excluded_because:
          difficulty_instance: cross_entity_state_beats_dose_budget_on_rwp_approve
          rationale: "That §1.8 priority-pair instance violates priority 7 and priority 23 in the same request and asserts the priority-7 error surfaces, which is exactly this claim."

      - name: capacity_conflict_beats_the_predecessor_outage_check
        claim_type: priority_conflict
        grounds: ["validations[priority=13]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: safety_function_capacity_beats_predecessor_outage_mismatch
          rationale: "That §1.8 priority-pair instance is built around a single activity create that violates both rules, and asserts the lower-numbered priority-13 error wins."

      - name: permit_and_reservation_gates_read_a_second_entity_state
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_WORK_ORDER_NOT_APPROVED]", "errors[ERR_CORE_LOAD_PATTERN_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: discharge_reservation_requires_approved_core_load_pattern
          rationale: "The §1.8 cross_entity_state_dependency pair covers both halves of priority 7's cross-entity content: the DISCHARGE reservation against an unapproved reload design, and the permit approval against a work order that has not reached APPROVED. Both test the invalid and valid arrangement of the second entity."

      - name: buffered_window_conflict_is_detected_before_the_work_starts
        claim_type: temporal_validation
        grounds: ["validations[priority=15]", "errors[ERR_RAD_AREA_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: rad_area_half_open_buffered_window_admits_exact_adjacency
          rationale: "That §1.8 instance approves a permit whose window is legal today and then shows the next approval attempt rejected purely on the future overlap, including the exact-adjacency admission one hundredth of an hour away from a conflict."

      - name: individually_legal_outages_collectively_exceed_train_capacity
        claim_type: aggregate_validation
        grounds: ["validations[priority=13]", "calculations.safety_function_oos_capacity.input_set"]
        excluded_because:
          difficulty_instance: safety_function_closed_window_aggregates_distinct_trains
          rationale: "That §1.8 resource_temporal_overlap instance aggregates out-of-service windows across two outages sharing one plant safety function, with each individual activity legal on its own — the aggregate claim in full."

  # =========================================================================
  - section: endpoints
    instances:

      - name: rad_area_create_and_read_are_the_whole_crud_surface
        claim_type: standard_crud
        grounds: ["endpoints.POST_/rad-areas", "endpoints.GET_/rad-areas/{id}", "entities.RadArea"]
        distinguishing_aspect: "RadArea is reference data: §1.5 declares exactly one write and one read for it and no update or delete, so the create must persist every field on the first attempt — including survey_buffer_hours 0, the lower bound of its declared range."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_2", area_code: "RB-EL240", dose_rate_mrem_per_hr: 40, occupancy_limit_workers: 4, survey_buffer_hours: 0 }
              as: StationAdmin
              captures: { ra_id: "$.data.id", ra_v: "$.data.version" }
            - call: "GET /rad-areas/${ra_id}"
              payload: {}
              as: RadProtectionPlanner
          assert:
            - "The create returns HTTP 201 and the read returns HTTP 200 with identical field values"
            - "RadArea.${ra_id}.station_unit == UNIT_2, area_code == \"RB-EL240\", dose_rate_mrem_per_hr == 40, occupancy_limit_workers == 4, survey_buffer_hours == 0"
            - "${ra_v} == 1 and the read did not change it"
            - "§1.5 declares no PATCH, PUT or DELETE for /rad-areas/{id} — the dose rate a permit reads at draft time can never be edited underneath it"

      - name: consume_moves_reserved_cells_into_occupied
        claim_type: action_endpoint
        grounds: ["endpoints.POST_/pool-cell-reservations/{id}/consume", "state_machines.PoolCellReservation.transitions[RESERVED->CONSUMED].side_effects", "calculations.pool_cell_ledger"]
        distinguishing_aspect: "consume is a pure ledger transfer: cells_reserved falls by 250 and cells_occupied rises by 250, so cells_available and protected_cells_available are unchanged across the call while the pool version still increments."
        test_recipe:
          setup:
            - "Pool UNIT_1 with cells_total 1200, cells_baseline_occupied 900, full_core_offload_reserve_cells 193 — cells_available 300, protected_cells_available 107."
            - "Outage UNIT_1 / 1R24 is driven to SCOPE_LOCKED (pattern approved, one work order approved) and holds a RESERVED CONTINGENCY reservation for 250 cells, admitted against the NOMINAL headroom of 300."
            - "While RESERVED: occupied 900, reserved 250, available 50, protected -143. After consume: occupied 1150, reserved 0, available 50, protected -143."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Fuel handling machine service", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 250, purpose: "CONTINGENCY", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { pool_v_before: "$.data.version" }
          trigger:
            - call: "POST /pool-cell-reservations/${res_id}/consume"
              payload: {}
              as: ReactorEngineer
              captures: { res_status: "$.data.status" }
            - call: "GET /spent-fuel-pools/${pool_id}"
              payload: {}
              as: ReactorEngineer
              captures: { pool_v_after: "$.data.version" }
          assert:
            - "${res_status} == CONSUMED and PoolCellReservation.${res_id}.availability_variant == NOMINAL"
            - "SpentFuelPool.${pool_id}.cells_occupied == 1150 and cells_reserved == 0"
            - "SpentFuelPool.${pool_id}.cells_available == 50 and protected_cells_available == -143 — unchanged by the transfer, and legitimately negative"
            - "${pool_v_after} == ${pool_v_before} + 1"

