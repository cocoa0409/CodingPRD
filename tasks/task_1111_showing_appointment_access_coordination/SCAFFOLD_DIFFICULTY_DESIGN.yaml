            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Eleven", license_number: "LIC-BA-11", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-11" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB11", contact_email: "sb11@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "70 Cap Way", occupancy_type: "VACANT", max_showings_per_day: 2 }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_st: $.data.status } }
