              as_user_id: "${talent_id}"
            - call: "POST /voice-sessions/${sess_done}/complete"
              payload: { recorded_line_count: 100 }
              as: TalentAgent
              as_user_id: "${talent_id}"
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "${mp_jp}", voice_talent_id: "${talent_id}", recording_booth_id: "${booth_id}", talent_contract_id: "${contract_id}", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-10T14:30:00Z", planned_line_count: 40 }
              as: LocalizationProducer
              captures: { sess_pending: "$.data.id" }
