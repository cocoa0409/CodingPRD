          - entities.NominationCycle.fields.effective_capacity_bbl
          - entities.NominationCycle.fields.derate_pct_applied
        distinguishing_aspect: |
          A line short of its linefill requirement cannot offer that shortfall to shippers: with
          linefill_bbl 5000 against a 20000 bbl requirement the makeup of 15000 and the 1000 bbl
          transmix reserve both come off the 101000 bbl nameplate, leaving exactly 85000 bbl of
          nominatable capacity and derate_pct_applied 0.
