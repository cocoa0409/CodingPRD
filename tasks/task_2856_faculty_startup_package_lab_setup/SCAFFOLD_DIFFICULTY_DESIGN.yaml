          Entity pair EquipmentOrder -> LabSpace. The order itself is perfectly installable - it is
          DELIVERED, its package is SPENDING, its utility demands all fit and the faculty member
          already holds an ACTIVE 100 pct assignment on the room, so priority 22 is satisfied - and
