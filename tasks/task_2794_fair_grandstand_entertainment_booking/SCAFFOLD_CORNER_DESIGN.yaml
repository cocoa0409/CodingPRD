              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag_is: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag_is}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar_is: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_is}", artist_id: "${ar_is}", target_stage_id: "${st_is}", deal_type: "VERSUS", offered_guarantee_cents: 12500000, backend_split_pct: 0.85, backend_breakeven_cents: 6000000, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of_is: "$.data.id" }
            - call: "POST /grandstand/offers/${of_is}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of_is}/accept"
              payload: {}
              as: TalentAgent
              as_user_id: "agent-hollis"
          trigger:
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed_is}", artist_id: "${ar_is}", target_stage_id: "${st_is}", deal_type: "GUARANTEE_PLUS_BACKEND", offered_guarantee_cents: 500000, backend_split_pct: 0.85, target_show_date: "2026-08-26", load_in_start_utc: "2026-08-26T14:00:00.000Z", load_out_end_utc: "2026-08-26T23:00:00.000Z" }
              as: TalentBuyer
              captures: { of_is2: "$.data.id" }
