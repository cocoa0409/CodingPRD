          trigger:
            - call: "POST /sanitation-events/${sev}/submit"
              payload: { disassembled_component_count: 11, atp_rlu: 100, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
              captures: { e_state: "$.data.error_id" }
            - call: "POST /sanitation-events/${sev}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
              captures: { e_state2: "$.data.error_id" }
            - call: "POST /sanitation-events/${sev}/start"
              as: SanitationTech
              as_user_id: "sant-1"
              captures: { st1: "$.data.status" }
            - call: "POST /sanitation-events/${sev}/submit"
              payload: { disassembled_component_count: 11, atp_rlu: 100, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
              captures: { e_count: "$.data.error_id" }
            - call: "POST /sanitation-events/${sev}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 100, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
              captures: { st2: "$.data.status", cnt: "$.data.disassembled_component_count" }
            - call: "POST /sanitation-events/${sev}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "sant-1"
              captures: { e_sod: "$.data.error_id" }
          assert:
            - "${e_state} == ERR_SANITATION_INVALID_STATE with HTTP 409, not ERR_DISASSEMBLY_INCOMPLETE: submit requires IN_PROGRESS and priority 31 precedes priority 47"
            - "${e_state2} == ERR_SANITATION_INVALID_STATE for a validate on an event that has not been submitted"
            - "${st1} == IN_PROGRESS, then ${e_count} == ERR_DISASSEMBLY_INCOMPLETE with HTTP 422 for 11 of the required 12"
            - "${st2} == AWAITING_VALIDATION with ${cnt} == 12: the comparison is >= so the exact requirement passes"
            - "${e_sod} == ERR_SEGREGATION_OF_DUTIES: the QATechnician header carries the same X-User-ID that performed the clean, and the identity check is on X-User-ID rather than on the role"

      - name: corner_run_start_antimicrobial_gates_in_priority_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=43]
          - validations[priority=44]
          - validations[priority=45]
          - calculations.wash_water_load_and_target_ppm.formula
        distinguishing_aspect: "The three wash-water start gates fire in their declared order on the same run: no readings at all, then a reading 61 minutes old, then a reading exactly 60 minutes old that is fresh but one tenth of a ppm under the minimum, and finally a reading exactly at the minimum that starts the run."
        test_recipe:
          setup: ["execute BASE steps 1-14, so RUN1 on L1 is SETUP, L1's posture is OPEN, W1 is IN_SERVICE with no readings at all, and the clock is 2026-08-02T05:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { e_none: "$.data.error_id" }
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T05:59:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.0 }
              as: LineOperator
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T06:00:00Z", free_chlorine_ppm: 19.9, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.0 }
              as: LineOperator
              captures: { below: "$.data.below_target", topup: "$.data.topup_ppm_required" }
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { e_below: "$.data.error_id" }
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
