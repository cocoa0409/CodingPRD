# =============================================================================
# Task 1955: Utility Meter Reading & AMI Field Services (utility metering contractor)
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# =============================================================================

scenario: |
  1955. Utility Meter Reading & AMI Field Services (utility metering contractor): route assignment & handheld/AMI read collection, no-read/estimate rules & re-read dispatch, meter exchange work order & serial swap, tamper/theft indication & investigation, read window & billing cycle alignment, field-safety hazard (dog/access) flag, backlog & meter-reading accuracy SLA, endpoint failure & replacement program

domain_name: utility-meter-reading-ami-field-services
api_prefix: ""            # flat API: every collection is rooted at / (e.g. /meters, /routes)

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FieldTechnician
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Technician display name" }
      - { name: technician_status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE, constraints: "INACTIVE technicians cannot be assigned new routes or work orders" }

  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: input, description: "Utility account number; unique across all accounts", constraints: "unique" }
      - { name: service_address, type: string, source: input, description: "Premise address" }
      - { name: billing_cycle_code, type: string, source: input, description: "Billing cycle membership code, e.g. C03" }
      - { name: estimation_method, type: enum, source: input, description: "TRAILING_AVERAGE | SAME_PERIOD_LAST_YEAR", default: TRAILING_AVERAGE, constraints: "selects estimate_read_value variant" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: ACTIVE }
      - { name: current_meter_id, type: string, source: computed, description: "Derived from the Meter whose installed_service_account_id == this account and meter_status == IN_SERVICE; null when none" }
      - { name: last_validated_read_value, type: integer, source: computed, description: "read_value of the most recent VALIDATED read (by read_at) on this account; null when none" }
      - { name: last_validated_read_at, type: datetime, source: computed, description: "read_at of the most recent VALIDATED read on this account; null when none" }
      - { name: estimated_read_streak, type: integer, source: computed, description: "Consecutive billing periods whose billable read is ESTIMATED; incremented on generate-estimate, decremented when an estimate is superseded by an actual, reset to 0 when an actual read is VALIDATED", default: 0 }

  - name: Meter
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Physical meter serial; unique across all meters", constraints: "unique" }
      - { name: meter_type, type: enum, source: input, description: "HANDHELD | AMI" }
      - { name: meter_status, type: enum, source: system, description: "IN_STOCK | IN_SERVICE | REMOVED | RETIRED", default: IN_STOCK }
      - { name: endpoint_comms_status, type: enum, source: system, description: "COMMUNICATING | DEGRADED | NON_COMMUNICATING | FAILED | NOT_APPLICABLE (HANDHELD meters)", default: "COMMUNICATING for AMI, NOT_APPLICABLE for HANDHELD" }
      - { name: tamper_status, type: enum, source: system, description: "NONE | SUSPECTED | CONFIRMED", default: NONE }
      - { name: installed_service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id; set by install/exchange, cleared by exchange-removal; null when not installed" }
      - { name: consecutive_missed_days, type: integer, source: system, description: "AMI only: consecutive ops-snapshot days with no AMI_REMOTE read in the snapshot window; reset to 0 on any AMI_REMOTE read", default: 0 }
      - { name: non_communicating_since, type: datetime, source: system, description: "AMI only: snapshot_at at which endpoint_comms_status entered NON_COMMUNICATING; null otherwise", default: null }

  - name: BillingCyclePeriod
    parent: null
    common_fields: true
    fields:
      - { name: cycle_code, type: string, source: input, description: "Billing cycle code this period belongs to, e.g. C03" }
      - { name: period_start_date, type: string, source: input, description: "Billing period start date (YYYY-MM-DD)" }
      - { name: period_end_date, type: string, source: input, description: "Billing period end date (YYYY-MM-DD)" }
      - { name: read_window_open_date, type: string, source: input, description: "First date reads count for this period (inclusive)" }
      - { name: read_window_close_date, type: string, source: input, description: "Last date reads count for this period (inclusive)" }
      - { name: bill_run_date, type: string, source: input, description: "Date the bill run executes" }
      - { name: period_status, type: enum, source: system, description: "SCHEDULED | WINDOW_OPEN | WINDOW_CLOSED | BILLED | CLOSED", default: SCHEDULED }
      - { name: unresolved_stop_count, type: integer, source: computed, description: "Count of RouteStops bound to this period with stop_status IN {PENDING, NO_READ_PENDING}", default: 0 }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: billing_cycle_period_id, type: string, source: input, description: "FK -> BillingCyclePeriod.id; period this route reads for" }
      - { name: scheduled_date, type: string, source: input, description: "Planned field date (YYYY-MM-DD); must lie inside the period read window" }
      - { name: route_shift, type: enum, source: input, description: "AM | PM | FULL; AM=[06:00,12:00), PM=[12:00,18:00), FULL=[06:00,18:00)" }
      - { name: two_person_crew, type: boolean, source: input, description: "When true, active hazard flags do not block read capture on this route", default: false }
      - { name: technician_id, type: string, source: system, description: "FK -> FieldTechnician.id; null until assign" }
      - { name: route_status, type: enum, source: system, description: "DRAFT | ASSIGNED | IN_PROGRESS | COMPLETED | RECONCILED | CANCELLED", default: DRAFT }
      - { name: stops_total, type: integer, source: computed, description: "Count of RouteStops generated for this route (excluding CANCELLED)", default: 0 }
      - { name: captured_stop_count, type: integer, source: computed, description: "Stops in {READ_CAPTURED, VALIDATED, ESTIMATED, SUPERSEDED}", default: 0 }
      - { name: read_rate_percent, type: number, source: computed, description: "GROSS read rate: covered / non-CANCELLED stops x 100, 2dp half-up; set at reconcile" }
      - { name: net_read_rate_percent, type: number, source: computed, description: "NET read rate: covered / (non-CANCELLED stops minus SKIPPED_HAZARD) x 100, 2dp half-up; set at reconcile" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; set at route creation" }
      - { name: service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id; set at route creation" }
      - { name: billing_cycle_period_id, type: string, source: system, description: "FK -> BillingCyclePeriod.id; denormalized from route at creation" }
      - { name: sequence_number, type: integer, source: system, description: "1-based stop order: accounts sorted by ServiceAccount.created_at ASC" }
      - { name: stop_status, type: enum, source: system, description: "PENDING | READ_CAPTURED | NO_READ_PENDING | SKIPPED_HAZARD | ESTIMATED | VALIDATED | SUPERSEDED | CANCELLED", default: PENDING }
      - { name: no_read_reason, type: string, source: input, description: "Reason recorded by mark-no-read or by system cascades (WINDOW_EXPIRED, READ_REJECTED)", default: null }
      - { name: hazard_flag_id, type: string, source: system, description: "FK -> HazardFlag.id; the ACTIVE flag cited by skip-hazard", default: null }
      - { name: current_read_id, type: string, source: system, description: "FK -> MeterRead.id; latest non-REJECTED read produced for this stop", default: null }

  - name: MeterRead
    parent: null
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id; null for AMI_REMOTE, EXCHANGE_FINAL, EXCHANGE_INITIAL reads", default: null }
      - { name: service_account_id, type: string, source: system, description: "FK -> ServiceAccount.id" }
      - { name: meter_id, type: string, source: system, description: "FK -> Meter.id; serial attribution is frozen at capture" }
      - { name: read_value, type: integer, source: input, description: "Register reading in kWh (integer >= 0)" }
      - { name: read_at, type: datetime, source: input, description: "Timestamp the register was read (field handheld clock / AMI head-end)" }
      - { name: read_source, type: enum, source: system, description: "HANDHELD | REREAD | AMI_REMOTE | ESTIMATE | EXCHANGE_FINAL | EXCHANGE_INITIAL" }
      - { name: read_status, type: enum, source: system, description: "PROVISIONAL | VALIDATED | REJECTED | ESTIMATED | SUPERSEDED" }
      - { name: estimation_method, type: enum, source: system, description: "TRAILING_AVERAGE | SAME_PERIOD_LAST_YEAR; set only on ESTIMATE reads (records fallback too)", default: null }
      - { name: tamper_indication, type: boolean, source: input, description: "Field tech flagged visible tamper/theft indication at capture", default: false }
      - { name: supersedes_read_id, type: string, source: system, description: "FK -> MeterRead.id; the read this read replaces (self-referential)", default: null }
      - { name: rejection_reason, type: string, source: input, description: "Billing liaison reason when rejecting a PROVISIONAL read", default: null }
      - { name: is_billable, type: boolean, source: computed, description: "true iff read_status == VALIDATED, or read_status == ESTIMATED and the period is not yet BILLED/CLOSED; SUPERSEDED/REJECTED never billable", default: false }

  - name: HazardFlag
    parent: null
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: hazard_type, type: enum, source: input, description: "DOG | ACCESS | LOCKED_GATE | CHEMICAL | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | HIGH" }
      - { name: flag_status, type: enum, source: system, description: "ACTIVE | EXPIRED | CLEARED", default: ACTIVE }
      - { name: reported_by_technician_id, type: string, source: system, description: "FK -> FieldTechnician.id; taken from X-User-ID of the reporting call" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock time when reported (or last renewed report time on merge)" }
      - { name: expires_at, type: datetime, source: computed, description: "reported_at + HAZARD_TTL_DAYS(30); on merge/renew = max(existing expires_at, now + 30d)" }
      - { name: renewed_count, type: integer, source: system, description: "Number of merges/renews applied", default: 0 }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: work_order_type, type: enum, source: input, description: "RE_READ | EXCHANGE | TAMPER_CHECK | ENDPOINT_SWAP" }
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: meter_id, type: string, source: input, description: "FK -> Meter.id; required for EXCHANGE and ENDPOINT_SWAP", default: null }
      - { name: route_stop_id, type: string, source: input, description: "FK -> RouteStop.id; required for RE_READ", default: null }
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id; required for TAMPER_CHECK", default: null }
      - { name: campaign_enrollment_id, type: string, source: system, description: "FK -> CampaignEnrollment.id; set when auto-created by campaign enrollment", default: null }
      - { name: scheduled_date, type: string, source: input, description: "Planned field date (YYYY-MM-DD); auto-created campaign orders use enrollment date + 7 days" }
      - { name: work_shift, type: enum, source: input, description: "AM | PM | FULL; auto-created campaign orders use FULL" }
      - { name: notes, type: string, source: input, description: "Free-text dispatcher notes", default: null }
      - { name: technician_id, type: string, source: system, description: "FK -> FieldTechnician.id; null until dispatch" }
      - { name: work_order_status, type: enum, source: system, description: "OPEN | DISPATCHED | IN_PROGRESS | COMPLETED | REWORK | VERIFIED | CANCELLED", default: OPEN }
      - { name: new_meter_id, type: string, source: input, description: "FK -> Meter.id; EXCHANGE completion: the IN_STOCK replacement meter", default: null }
      - { name: old_final_read_value, type: integer, source: input, description: "EXCHANGE completion: final register read on the removed meter", default: null }
      - { name: new_initial_read_value, type: integer, source: input, description: "EXCHANGE completion: initial register read on the installed meter", default: null }
      - { name: reread_value, type: integer, source: input, description: "RE_READ completion: register value captured in the field", default: null }
      - { name: reread_at, type: datetime, source: input, description: "RE_READ completion: capture timestamp", default: null }
      - { name: evidence_note, type: string, source: input, description: "TAMPER_CHECK completion: evidence text appended to the investigation", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock time of completion", default: null }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: service_account_id, type: string, source: input, description: "FK -> ServiceAccount.id" }
      - { name: meter_id, type: string, source: input, description: "FK -> Meter.id; one non-terminal investigation per meter" }
      - { name: indication_type, type: enum, source: input, description: "TAMPER_FLAG | THEFT_REPORT | USAGE_ANOMALY" }
      - { name: investigation_status, type: enum, source: system, description: "OPEN | EVIDENCE_GATHERING | PENDING_DISPOSITION | CONFIRMED_THEFT | CLEARED | CLOSED", default: OPEN }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that opened the investigation (or 'system' when auto-created by a tamper read)" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID that closed the investigation", default: null }
      - { name: triggering_read_id, type: string, source: system, description: "FK -> MeterRead.id; the tamper-flagged read that auto-created this investigation", default: null }
      - { name: exchange_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; EXCHANGE order auto-created at confirm-theft", default: null }
      - { name: theft_window_months, type: integer, source: input, description: "Number of months of unbilled usage claimed at confirm-theft", default: null }
      - { name: monthly_estimated_kwh, type: array, source: input, description: "Per-month estimated kWh, length must equal theft_window_months", default: null }
      - { name: backbill_cents, type: integer, source: computed, description: "theft_backbill_amount result; null until CONFIRMED_THEFT", default: null }
      - { name: evidence_notes, type: array, source: system, description: "Evidence strings appended by TAMPER_CHECK completions", default: [] }

  - name: ReplacementCampaign
    parent: null
    common_fields: true
    fields:
      - { name: campaign_name, type: string, source: input, description: "Program display name" }
      - { name: quota, type: integer, source: input, description: "Maximum number of meters this campaign may enroll", constraints: ">= 1" }
      - { name: campaign_status, type: enum, source: system, description: "DRAFT | OPEN | COMPLETED | CLOSED", default: DRAFT }
      - { name: enrolled_count, type: integer, source: computed, description: "Enrollments in {ENROLLED, WORK_ORDER_CREATED}", default: 0 }
      - { name: replaced_count, type: integer, source: computed, description: "Enrollments in REPLACED", default: 0 }
      - { name: withdrawn_count, type: integer, source: computed, description: "Enrollments in WITHDRAWN", default: 0 }

  - name: CampaignEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> ReplacementCampaign.id" }
      - { name: meter_id, type: string, source: system, description: "FK -> Meter.id" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | WORK_ORDER_CREATED | REPLACED | WITHDRAWN", default: ENROLLED }
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; the auto-created ENDPOINT_SWAP order", default: null }

  - name: OpsSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: snapshot_at, type: datetime, source: input, description: "Effective business timestamp of the checkpoint; drives hazard expiry, AMI comms evaluation, escalation sweep, aging buckets" }
      - { name: snapshot_status, type: enum, source: system, description: "DRAFT | FINALIZED", default: DRAFT }
      - { name: eligible_stop_count, type: integer, source: computed, description: "RouteStops on non-CANCELLED routes with scheduled_date <= snapshot date, excluding CANCELLED stops", default: 0 }
      - { name: covered_stop_count, type: integer, source: computed, description: "Eligible stops in {VALIDATED, ESTIMATED, SUPERSEDED}", default: 0 }
      - { name: backlog_count, type: integer, source: computed, description: "RouteStops in {PENDING, NO_READ_PENDING} on non-CANCELLED routes", default: 0 }
      - { name: backlog_aged_7plus_count, type: integer, source: computed, description: "backlog stops whose RouteStop.created_at <= snapshot_at - 7 days", default: 0 }
      - { name: estimated_read_count, type: integer, source: computed, description: "MeterReads in ESTIMATED status at snapshot time", default: 0 }
      - { name: validated_read_count, type: integer, source: computed, description: "MeterReads in VALIDATED status at snapshot time", default: 0 }
      - { name: read_rate_percent, type: number, source: computed, description: "GROSS: covered / eligible x 100, 2dp half-up; null when eligible == 0" }
      - { name: net_read_rate_percent, type: number, source: computed, description: "NET: covered / (eligible minus SKIPPED_HAZARD) x 100, 2dp half-up; null when denominator == 0" }
      - { name: sla_breach, type: boolean, source: computed, description: "Set at finalize: covered_stop_count*200 < eligible_stop_count*197 (exact < 98.5% arithmetic, no float rounding); null while DRAFT", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FieldTechnician
    field: technician_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /field-technicians/{id}/deactivate"
        actor: MeterOpsAdmin
        preconditions:
          - "No Route with technician_id == id and route_status IN {ASSIGNED, IN_PROGRESS}"
          - "No WorkOrder with technician_id == id and work_order_status IN {DISPATCHED, IN_PROGRESS}"
        side_effects: []

  - entity: ServiceAccount
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-accounts/{id}/suspend, or cascade from Investigation confirm-theft"
        actor: "MeterOpsAdmin or system"
        preconditions: []
        side_effects:
          - "Every RouteStop for this account with stop_status == PENDING on routes in {DRAFT, ASSIGNED, IN_PROGRESS} transitions to CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /service-accounts/{id}/reactivate"
        actor: MeterOpsAdmin
        preconditions:
          - "No Investigation for this account with investigation_status IN {OPEN, EVIDENCE_GATHERING, PENDING_DISPOSITION, CONFIRMED_THEFT} (ERR_ACCOUNT_HAS_OPEN_INVESTIGATION)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /service-accounts/{id}/close (not exposed; CLOSED reserved)"
        actor: system
        preconditions: []
        side_effects: []
        note: "CLOSED is reachable only via future admin flow; no endpoint in v1 (terminal state declared for lifecycle completeness)"

  - entity: Meter
    field: meter_status
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    note: "Three parallel state dimensions evolve independently on one row: meter_status (lifecycle) x endpoint_comms_status (AMI comms) x tamper_status"
    transitions:
      - from: IN_STOCK
        to: IN_SERVICE
        trigger: "POST /meters/{id}/install"
        actor: MeterOpsAdmin
        preconditions:
          - "Target ServiceAccount.account_status == ACTIVE"
          - "No other Meter with installed_service_account_id == account and meter_status == IN_SERVICE (ERR_ACCOUNT_HAS_INSTALLED_METER)"
        side_effects:
          - "installed_service_account_id = account; ServiceAccount.current_meter_id recomputed to this meter"
      - from: IN_SERVICE
        to: REMOVED
        trigger: "cascade from EXCHANGE WorkOrder completion"
        actor: system
        preconditions: []
        side_effects:
          - "installed_service_account_id = null"
          - "Any CampaignEnrollment for this meter in {ENROLLED, WORK_ORDER_CREATED} transitions to WITHDRAWN; that enrollment's OPEN/DISPATCHED WorkOrder transitions to CANCELLED; owning ReplacementCampaign recomputes counts and auto-completes if all its enrollments are terminal and at least one exists"
      - from: [IN_STOCK, REMOVED]
        to: RETIRED
        trigger: "POST /meters/{id}/retire"
        actor: MeterOpsAdmin
        preconditions: []
        side_effects: []

  - entity: Meter
    field: endpoint_comms_status
    initial_state: "COMMUNICATING (AMI) | NOT_APPLICABLE (HANDHELD)"
    terminal_states: []
    transitions:
      - from: COMMUNICATING
        to: DEGRADED
        trigger: "system (ops snapshot sweep: AMI meter IN_SERVICE with no AMI_REMOTE read in snapshot window, consecutive_missed_days becomes 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEGRADED
        to: NON_COMMUNICATING
        trigger: "system (ops snapshot sweep: consecutive_missed_days reaches AMI_MISS_THRESHOLD=3)"
        actor: system
        preconditions: []
        side_effects:
          - "non_communicating_since = snapshot_at"
      - from: COMMUNICATING
        to: NON_COMMUNICATING
        trigger: "system (ops snapshot sweep: consecutive_missed_days reaches 3 from a COMMUNICATING baseline is impossible; 3 consecutive misses always pass through DEGRADED)"
        actor: system
        preconditions: ["misses 1-2 leave meter in DEGRADED"]
        side_effects: []
        note: "documented for completeness; DEGRADED is the only entry path into NON_COMMUNICATING"
      - from: NON_COMMUNICATING
        to: FAILED
        trigger: "system (ops snapshot sweep: still no AMI_REMOTE read AND snapshot_at - non_communicating_since >= ENDPOINT_FAILURE_DAYS=14 days, boundary inclusive)"
        actor: system
        preconditions: []
        side_effects:
          - "Meter becomes eligible for ReplacementCampaign enrollment"
      - from: [DEGRADED, NON_COMMUNICATING, FAILED]
        to: COMMUNICATING
        trigger: "system (ops snapshot sweep finds >=1 AMI_REMOTE read with read_at in (prev_snapshot_at, snapshot_at], or POST /meters/{id}/ami-reads arrives while meter is IN_SERVICE)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_missed_days = 0; non_communicating_since = null"
      - from: FAILED
        to: COMMUNICATING
        trigger: "cascade from ENDPOINT_SWAP WorkOrder completion"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_missed_days = 0; non_communicating_since = null"
          - "CampaignEnrollment that owns the order transitions to REPLACED; owning campaign recomputes counts and auto-completes when all enrollments terminal"

  - entity: Meter
    field: tamper_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: SUSPECTED
        trigger: "POST /investigations, or cascade from a MeterRead captured with tamper_indication=true"
        actor: "Investigator or system"
        preconditions: []
        side_effects:
          - "Evidence preservation hold: new EXCHANGE/ENDPOINT_SWAP WorkOrders for this meter are rejected (ERR_EVIDENCE_PRESERVATION_HOLD) while any investigation for this meter is non-terminal"
          - "Any CampaignEnrollment for this meter in {ENROLLED, WORK_ORDER_CREATED} transitions to WITHDRAWN; its OPEN/DISPATCHED WorkOrder transitions to CANCELLED; owning campaign recomputes counts (auto-completes when all terminal)"
      - from: SUSPECTED
        to: CONFIRMED
        trigger: "cascade from Investigation confirm-theft"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPECTED
        to: NONE
        trigger: "cascade from Investigation clear"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BillingCyclePeriod
    field: period_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: WINDOW_OPEN
        trigger: "POST /billing-cycle-periods/{id}/open-read-window"
        actor: "BillingLiaison or MeterOpsAdmin"
        preconditions:
          - "Logical clock current date >= read_window_open_date (ERR_READ_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: WINDOW_OPEN
        to: WINDOW_CLOSED
        trigger: "POST /billing-cycle-periods/{id}/close-read-window"
        actor: "BillingLiaison or MeterOpsAdmin"
        preconditions:
          - "Logical clock current date > read_window_close_date (ERR_READ_WINDOW_STILL_OPEN)"
        side_effects:
          - "Every RouteStop bound to this period with stop_status == PENDING transitions to NO_READ_PENDING with no_read_reason WINDOW_EXPIRED"
      - from: WINDOW_CLOSED
        to: BILLED
        trigger: "POST /billing-cycle-periods/{id}/finalize-billing"
        actor: BillingLiaison
        preconditions:
          - "unresolved_stop_count == 0 (ERR_CYCLE_HAS_UNRESOLVED_STOPS)"
          - "Every ServiceAccount with billing_cycle_code == cycle_code and account_status == ACTIVE has a billable read for this period: routed accounts via their resolved stop; non-routed AMI accounts via a VALIDATED AMI_REMOTE read with read_at date inside the read window (ERR_ACCOUNT_MISSING_BILLABLE_READ)"
        side_effects: []
      - from: BILLED
        to: CLOSED
        trigger: "POST /billing-cycle-periods/{id}/close"
        actor: BillingLiaison
        preconditions: []
        side_effects:
          - "Corrections locked: generate-estimate and read capture against this period now fail (ERR_READ_WINDOW_NOT_OPEN)"

  - entity: Route
    field: route_status
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ASSIGNED
        trigger: "POST /routes/{id}/assign"
        actor: Dispatcher
        preconditions:
          - "Technician ACTIVE (ERR_TECHNICIAN_NOT_ACTIVE)"
          - "No overlapping commitment for technician on scheduled_date with overlapping shift (ERR_TECHNICIAN_WINDOW_CONFLICT)"
        side_effects: ["technician_id set"]
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /routes/{id}/reassign"
        actor: Dispatcher
        preconditions:
          - "expected_route_version == Route.version (ERR_STALE_VERSION)"
          - "New technician ACTIVE and conflict-free on scheduled_date/shift"
        side_effects:
          - "technician_id replaced (supersedes prior assignment); increments Route.version by 1"
      - from: ASSIGNED
        to: DRAFT
        trigger: "POST /routes/{id}/unassign"
        actor: Dispatcher
        preconditions: []
        side_effects: ["technician_id = null"]
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /routes/{id}/start"
        actor: FieldTechnician
        preconditions:
          - "X-User-ID == technician_id (ERR_NOT_ASSIGNED_TECHNICIAN)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /routes/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "X-User-ID == technician_id"
          - "No stop in PENDING (ERR_ROUTE_HAS_PENDING_STOPS)"
        side_effects: []
      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /routes/{id}/reconcile"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "route_read_rate computed (GROSS variant pinned for read_rate_percent, NET for net_read_rate_percent)"
      - from: [DRAFT, ASSIGNED]
        to: CANCELLED
        trigger: "POST /routes/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Conditional cascade down: stops in PENDING transition to CANCELLED; stops in any other state are untouched"

  - entity: RouteStop
    field: stop_status
    initial_state: PENDING
    terminal_states: [VALIDATED, ESTIMATED, SUPERSEDED, CANCELLED]
    transitions:
      - from: [PENDING, NO_READ_PENDING, READ_CAPTURED, ESTIMATED]
        to: READ_CAPTURED
        trigger: "POST /route-stops/{id}/reads"
        actor: "FieldTechnician (assigned) or MeterOpsAdmin (correction=true only)"
        preconditions:
          - "expected_route_stop_version == RouteStop.version (ERR_STALE_VERSION)"
          - "Route IN_PROGRESS (ERR_ROUTE_NOT_IN_PROGRESS)"
          - "From ESTIMATED: correction not required (actual supersedes estimate); from READ_CAPTURED: re-capture supersedes the prior PROVISIONAL read"
          - "BillingCyclePeriod.period_status == WINDOW_OPEN (ERR_READ_WINDOW_NOT_OPEN)"
          - "Hazard safety: no ACTIVE HazardFlag on the account unless route.two_person_crew == true (ERR_ACTIVE_HAZARD_BLOCKS_READ)"
          - "read_at date within [read_window_open_date, read_window_close_date] inclusive (ERR_READ_OUTSIDE_WINDOW)"
          - "meter_id == account.current_meter_id (ERR_METER_NOT_INSTALLED_AT_ACCOUNT)"
          - "read_value >= account.last_validated_read_value when set (ERR_READ_ROLLBACK)"
        side_effects:
          - "Creates MeterRead (read_source HANDHELD, read_status PROVISIONAL); increments RouteStop.version by 1"
          - "If stop was READ_CAPTURED: prior PROVISIONAL current read transitions to SUPERSEDED with supersedes_read_id pointing at the new read"
          - "If stop was ESTIMATED: the ESTIMATED read transitions to SUPERSEDED, supersedes_read_id set, and ServiceAccount.estimated_read_streak decremented by 1 (compensation)"
          - "stop.current_read_id = new read"
          - "If tamper_indication == true and no non-terminal Investigation exists for (account, meter): create Investigation OPEN with triggering_read_id = new read, opened_by_user_id 'system'; meter.tamper_status NONE -> SUSPECTED; then tamper cascade (enrollment withdrawal -> work order cancel -> campaign recompute)"
      - from: PENDING
        to: NO_READ_PENDING
        trigger: "POST /route-stops/{id}/mark-no-read, or cascade from close-read-window (WINDOW_EXPIRED), or cascade from MeterRead reject (READ_REJECTED)"
        actor: "FieldTechnician (assigned) or system"
        preconditions:
          - "Manual: Route IN_PROGRESS and X-User-ID == route.technician_id"
        side_effects: ["no_read_reason set"]
      - from: PENDING
        to: SKIPPED_HAZARD
        trigger: "POST /route-stops/{id}/skip-hazard"
        actor: FieldTechnician
        preconditions:
          - "Route IN_PROGRESS and X-User-ID == route.technician_id"
          - "hazard_flag_id references an ACTIVE HazardFlag on this stop's account (ERR_SKIP_REQUIRES_ACTIVE_HAZARD)"
        side_effects: ["hazard_flag_id set"]
      - from: SKIPPED_HAZARD
        to: PENDING
        trigger: "cascade from HazardFlag clear/expire when no other ACTIVE HazardFlag remains on the account"
        actor: system
        preconditions:
          - "Stop's Route in {ASSIGNED, IN_PROGRESS}"
        side_effects: ["hazard_flag_id = null"]
      - from: NO_READ_PENDING
        to: ESTIMATED
        trigger: "POST /route-stops/{id}/generate-estimate"
        actor: BillingLiaison
        preconditions:
          - "BillingCyclePeriod.period_status IN {WINDOW_OPEN, WINDOW_CLOSED} (ERR_READ_WINDOW_NOT_OPEN)"
          - "ServiceAccount.estimated_read_streak < MAX_CONSECUTIVE_ESTIMATES=3 (ERR_ESTIMATE_CAP_REACHED)"
          - ">= 2 VALIDATED reads on the account with read_at within trailing 365 days (ERR_INSUFFICIENT_READ_HISTORY)"
        side_effects:
          - "Creates MeterRead (read_source ESTIMATE, read_status ESTIMATED, value per estimate_read_value using account.estimation_method with pinned fallback); stop.current_read_id = estimate; estimated_read_streak += 1"
      - from: READ_CAPTURED
        to: VALIDATED
        trigger: "cascade from POST /reads/{id}/validate on the stop's current read"
        actor: system
        preconditions: []
        side_effects: []
      - from: READ_CAPTURED
        to: NO_READ_PENDING
        trigger: "cascade from POST /reads/{id}/reject on the stop's current read"
        actor: system
        preconditions: []
        side_effects: ["no_read_reason = READ_REJECTED"]
      - from: [VALIDATED, ESTIMATED]
        to: SUPERSEDED
        trigger: "cascade when a newer actual read for the same stop is VALIDATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "cascade from Route cancel or ServiceAccount suspend"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MeterRead
    field: read_status
    initial_state: "PROVISIONAL (HANDHELD/REREAD) | VALIDATED (AMI_REMOTE/EXCHANGE_FINAL/EXCHANGE_INITIAL auto-validated) | ESTIMATED (ESTIMATE)"
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: VALIDATED
        trigger: "POST /reads/{id}/validate"
        actor: BillingLiaison
        preconditions: []
        side_effects:
          - "ServiceAccount.last_validated_read_value/read_at updated when this read's read_at is the latest"
          - "ServiceAccount.estimated_read_streak = 0"
          - "Owning RouteStop (if current_read_id == this read) transitions READ_CAPTURED -> VALIDATED"
          - "If this read supersedes a VALIDATED read (admin correction), that target is already SUPERSEDED from capture-time; account aggregates recompute"
      - from: PROVISIONAL
        to: REJECTED
        trigger: "POST /reads/{id}/reject"
        actor: BillingLiaison
        preconditions: []
        side_effects:
          - "Owning RouteStop (if current_read_id == this read) transitions READ_CAPTURED -> NO_READ_PENDING with no_read_reason READ_REJECTED; stop.current_read_id cleared to null (a rejected read is never superseded by a later capture)"
      - from: [PROVISIONAL, VALIDATED, ESTIMATED]
        to: SUPERSEDED
        trigger: "system (a superseding read is captured/validated per RouteStop read capture side effects)"
        actor: system
        preconditions: []
        side_effects: ["is_billable recomputed to false"]

  - entity: HazardFlag
    field: flag_status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CLEARED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /hazard-flags with same (service_account_id, hazard_type) (merge), or POST /hazard-flags/{id}/renew"
        actor: FieldTechnician
        preconditions: []
        side_effects:
          - "Interval-merge semantics: expires_at = max(existing expires_at, now + HAZARD_TTL_DAYS); renewed_count += 1; no new row is created on merge (200 with the existing flag)"
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /hazard-flags/{id}/clear"
        actor: "FieldTechnician, Dispatcher, or MeterOpsAdmin"
        preconditions: []
        side_effects:
          - "Conditional cascade: RouteStops for the account in SKIPPED_HAZARD citing this flag revert to PENDING when no other ACTIVE HazardFlag remains on the account and the route is in {ASSIGNED, IN_PROGRESS}"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (ops snapshot sweep: expires_at < snapshot_at, strictly; expires_at == snapshot_at remains ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Same SKIPPED_HAZARD -> PENDING revert cascade as clear, applied when no other ACTIVE flag remains"

  - entity: WorkOrder
    field: work_order_status
    initial_state: OPEN
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: [OPEN, REWORK]
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Technician ACTIVE (ERR_TECHNICIAN_NOT_ACTIVE)"
          - "No overlapping route/work-order commitment for the technician on scheduled_date with overlapping shift (ERR_TECHNICIAN_WINDOW_CONFLICT)"
        side_effects: ["technician_id set"]
      - from: [OPEN, DISPATCHED]
        to: OPEN
        trigger: "POST /work-orders/{id}/reschedule (state unchanged; supersedes prior schedule)"
        actor: Dispatcher
        preconditions:
          - "expected_work_order_version == WorkOrder.version (ERR_STALE_VERSION)"
          - "If DISPATCHED: new schedule must not create a technician window conflict"
        side_effects:
          - "scheduled_date/work_shift replaced; increments WorkOrder.version by 1"
        note: "state self-loop; the version bump is the observable mutation"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: FieldTechnician
        preconditions: ["X-User-ID == technician_id (ERR_NOT_ASSIGNED_TECHNICIAN)"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: FieldTechnician
        preconditions:
          - "X-User-ID == technician_id"
          - "Type-specific payload present (ERR_INVALID_REQUEST): RE_READ needs reread_value+reread_at; EXCHANGE needs new_meter_id+old_final_read_value+new_initial_read_value; TAMPER_CHECK needs evidence_note; ENDPOINT_SWAP needs none"
          - "EXCHANGE: new_meter_id references an IN_STOCK meter != meter_id (ERR_METER_NOT_AVAILABLE_FOR_INSTALL); old_final_read_value >= account.last_validated_read_value when set (ERR_READ_ROLLBACK)"
          - "RE_READ: linked stop is NO_READ_PENDING (ERR_STOP_NOT_ACTIONABLE); reread_value passes rollback check"
          - "TAMPER_CHECK: linked investigation in EVIDENCE_GATHERING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "RE_READ: creates PROVISIONAL MeterRead (source REREAD) on linked stop; stop NO_READ_PENDING -> READ_CAPTURED"
          - "EXCHANGE (serial swap cascade): creates auto-VALIDATED EXCHANGE_FINAL read on old meter and EXCHANGE_INITIAL read on new meter; old meter IN_SERVICE -> REMOVED; new meter IN_STOCK -> IN_SERVICE with installed_service_account_id set; ServiceAccount.current_meter_id recomputed; then REMOVED-meter enrollment cascade (enrollment WITHDRAWN -> its order CANCELLED -> campaign recompute/auto-complete)"
          - "TAMPER_CHECK: evidence_note appended to Investigation.evidence_notes"
          - "ENDPOINT_SWAP: meter endpoint_comms_status -> COMMUNICATING, consecutive_missed_days = 0, non_communicating_since = null; owning CampaignEnrollment -> REPLACED; campaign recompute/auto-complete"
          - "completed_at = logical clock"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /work-orders/{id}/verify"
        actor: MeterOpsAdmin
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: REWORK
        trigger: "POST /work-orders/{id}/request-rework"
        actor: MeterOpsAdmin
        preconditions: []
        side_effects:
          - "EXCHANGE note: meter swap effects persist through rework (rework re-dispatches field verification only; undoing a swap requires a second EXCHANGE order)"
      - from: [OPEN, DISPATCHED, REWORK]
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel, or cascade from enrollment withdrawal / campaign close"
        actor: "Dispatcher or system"
        preconditions: []
        side_effects:
          - "If this order is a campaign order (campaign_enrollment_id set) and the enrollment is WORK_ORDER_CREATED: enrollment reverts to ENROLLED (manual cancel only; cascade cancels keep WITHDRAWN)"

  - entity: Investigation
    field: investigation_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EVIDENCE_GATHERING
        trigger: "POST /investigations/{id}/begin-evidence"
        actor: Investigator
        preconditions: []
        side_effects: []
      - from: EVIDENCE_GATHERING
        to: PENDING_DISPOSITION
        trigger: "POST /investigations/{id}/submit-disposition"
        actor: Investigator
        preconditions: []
        side_effects: []
      - from: PENDING_DISPOSITION
        to: EVIDENCE_GATHERING
        trigger: "POST /investigations/{id}/request-more-evidence"
        actor: Investigator
        preconditions: []
        side_effects: []
        note: "revision loop: dispositions can bounce back for more evidence repeatedly"
      - from: PENDING_DISPOSITION
        to: CONFIRMED_THEFT
        trigger: "POST /investigations/{id}/confirm-theft"
        actor: Investigator
        preconditions:
          - "monthly_estimated_kwh length == theft_window_months (ERR_BACKBILL_INPUT_MISMATCH)"
        side_effects:
          - "backbill_cents computed per theft_backbill_amount (per-month rounding pinned)"
          - "Auto-creates EXCHANGE WorkOrder (OPEN) for (service_account_id, meter_id); exchange_work_order_id set"
          - "Meter.tamper_status SUSPECTED -> CONFIRMED"
          - "ServiceAccount ACTIVE -> SUSPENDED, with its PENDING-stop cancellation cascade"
      - from: PENDING_DISPOSITION
        to: CLEARED
        trigger: "POST /investigations/{id}/clear"
        actor: Investigator
        preconditions: []
        side_effects:
          - "Meter.tamper_status SUSPECTED -> NONE"
      - from: [CONFIRMED_THEFT, CLEARED]
        to: CLOSED
        trigger: "POST /investigations/{id}/close"
        actor: Investigator
        preconditions:
          - "Segregation of duties: X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "From CONFIRMED_THEFT: exchange_work_order_id's WorkOrder.work_order_status == VERIFIED (ERR_EXCHANGE_NOT_VERIFIED)"
        side_effects: ["closed_by_user_id set"]

  - entity: ReplacementCampaign
    field: campaign_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /replacement-campaigns/{id}/open"
        actor: MeterOpsAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "system (auto: after any enrollment status change, all enrollments are in {REPLACED, WITHDRAWN} and at least one enrollment exists)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /replacement-campaigns/{id}/close"
        actor: MeterOpsAdmin
        preconditions: []
        side_effects:
          - "Cascade down: enrollments in {ENROLLED, WORK_ORDER_CREATED} -> WITHDRAWN; their WorkOrders in {OPEN, DISPATCHED, REWORK} -> CANCELLED"

  - entity: CampaignEnrollment
    field: enrollment_status
    initial_state: ENROLLED
    terminal_states: [REPLACED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: WORK_ORDER_CREATED
        trigger: "system (immediately at enrollment: an ENDPOINT_SWAP WorkOrder is auto-created, scheduled_date = enrollment date + 7 days, work_shift FULL)"
        actor: system
        preconditions: []
        side_effects: ["work_order_id set"]
      - from: WORK_ORDER_CREATED
        to: REPLACED
        trigger: "cascade from the enrollment's ENDPOINT_SWAP WorkOrder completion"
        actor: system
        preconditions: []
        side_effects: ["campaign replaced_count recompute; auto-complete check"]
      - from: [ENROLLED, WORK_ORDER_CREATED]
        to: WITHDRAWN
        trigger: "cascade from meter REMOVED via exchange, meter tamper_status -> SUSPECTED, or campaign close"
        actor: system
        preconditions: []
        side_effects: ["linked OPEN/DISPATCHED WorkOrder -> CANCELLED; campaign counts recompute; auto-complete check"]
      - from: WORK_ORDER_CREATED
        to: ENROLLED
        trigger: "cascade from manual cancel of the enrollment's WorkOrder"
        actor: system
        preconditions: []
        side_effects: ["work_order_id = null"]

  - entity: OpsSnapshot
    field: snapshot_status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /ops-snapshots/{id}/finalize"
        actor: MeterOpsAdmin
        preconditions: []
        side_effects:
          - "sla_read_rate_evaluation: sla_breach = (covered_stop_count*200 < eligible_stop_count*197); locked thereafter"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: route-reassign-stale-version
    parent_entity: Route
    write_endpoint: "POST /routes/{id}/reassign"
    occ_field: expected_route_version
    description: |
      Reassigning a Route whose version has advanced since the client last
      observed it is rejected. Reassignment legitimately supersedes the current
      technician assignment while ASSIGNED, so a client holding a stale version
      would otherwise silently overwrite a newer assignment.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stop-read-supersede-stale-version
    parent_entity: RouteStop
    write_endpoint: "POST /route-stops/{id}/reads"
    occ_field: expected_route_stop_version
    description: |
      Capturing a read against a RouteStop whose version has advanced since the
      client last observed it is rejected. Re-capture from READ_CAPTURED and
      actual-supersedes-estimate from ESTIMATED are both legitimate supersede
      operations, so a stale-version capture would otherwise overwrite a newer
      read the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: work-order-reschedule-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/reschedule"
    occ_field: expected_work_order_version
    description: |
      Rescheduling a WorkOrder whose version has advanced since the client last
      observed it is rejected. Reschedule supersedes the prior schedule from
      OPEN or DISPATCHED without a state change, so a stale-version reschedule
      would otherwise silently overwrite a newer schedule.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_read_value
    trigger: "POST /route-stops/{id}/generate-estimate (BillingLiaison)"
    algorithm: forward_looking
    formula: |
      Variant selection: ServiceAccount.estimation_method.
      TRAILING_AVERAGE:
        let L = account.last_validated_read (value V_l at read_at D_l)
        let P = the VALIDATED read with the greatest read_at strictly before D_l (value V_p at D_p)
        avg_daily = (V_l - V_p) / days(D_l - D_p)          # float division, no intermediate rounding
        days_open = days(period.read_window_close_date - D_l)   # estimate targets window close
        estimate = V_l + round_half_up(avg_daily * days_open)   # single final rounding, integer kWh
      SAME_PERIOD_LAST_YEAR:
        estimate month M = calendar month of period.read_window_close_date
        candidate set = VALIDATED reads on the account with read_at date inside the same
          calendar month one year prior (e.g. window close 2026-07-28 -> 2025-07-01..2025-07-31)
        if |candidates| >= 2: estimate = V_l + (max(read_value) - min(read_value)) over candidates
        else: FALLBACK to TRAILING_AVERAGE (pinned); the created read records
          estimation_method == TRAILING_AVERAGE to make the fallback observable
    input_set: "VALIDATED MeterReads of the account (read_status == VALIDATED only; ESTIMATED/PROVISIONAL/REJECTED/SUPERSEDED excluded)"
    constants:
      MAX_CONSECUTIVE_ESTIMATES: 3
      MIN_TRAILING_VALIDATED_READS: 2
      TRAILING_HISTORY_DAYS: 365
    precision: "integer kWh, round_half_up at the final step only"
    variants:
      - name: TRAILING_AVERAGE
        when: "account.estimation_method == TRAILING_AVERAGE"
        difference: "projects usage from the two most recent validated reads; result 10270 for the canonical fixture"
      - name: SAME_PERIOD_LAST_YEAR
        when: "account.estimation_method == SAME_PERIOD_LAST_YEAR"
        difference: "projects usage from the year-prior same-month validated pair; same fixture yields 10310; falls back to TRAILING_AVERAGE when the year-prior set has < 2 reads"

  - name: route_read_rate
    trigger: "POST /routes/{id}/reconcile"
    algorithm: aggregation
    formula: |
      covered = stops in {VALIDATED, ESTIMATED, SUPERSEDED}
      GROSS (pinned for read_rate_percent): denominator = all stops except CANCELLED
        read_rate_percent = round_half_up(100 * covered / gross_denominator, 2)
      NET (pinned for net_read_rate_percent): denominator = gross_denominator minus SKIPPED_HAZARD stops
        net_read_rate_percent = round_half_up(100 * covered / net_denominator, 2)
      division by zero (denominator == 0) -> field set to null
    input_set: "RouteStops of the route, all statuses at reconcile time"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: GROSS
        when: "read_rate_percent (contractual SLA denominator)"
        difference: "SKIPPED_HAZARD stops count against the rate"
      - name: NET
        when: "net_read_rate_percent (operations view)"
        difference: "SKIPPED_HAZARD stops are excluded from the denominator; identical stops data yields a strictly higher rate whenever any SKIPPED_HAZARD stop exists"

  - name: no_read_escalation_score
    trigger: "ops snapshot sweep step 3 (POST /ops-snapshots)"
    algorithm: weighted_scoring
    formula: |
      For each RouteStop with stop_status == NO_READ_PENDING whose period status
      IN {WINDOW_OPEN, WINDOW_CLOSED} (evaluated in pinned order: score DESC,
      days_until_window_close ASC, RouteStop.created_at ASC):
        days_until_window_close = days(period.read_window_close_date - snapshot date)   # may be negative
        score = min(100,
                    ESC_BASE(10)
                    + ESC_STREAK_W(25) * account.estimated_read_streak
                    + ESC_WINDOW_W(5) * max(0, ESC_URGENCY_DAYS(7) - days_until_window_close)
                    + (ESC_HAZARD_BONUS(15) if account has an ACTIVE HazardFlag else 0))
      if score >= ESC_DISPATCH_THRESHOLD(40) (boundary inclusive) AND no WorkOrder of type
      RE_READ in {OPEN, DISPATCHED, IN_PROGRESS, REWORK} exists for this stop:
        auto-create RE_READ WorkOrder (OPEN) linked to the stop, scheduled_date = snapshot date,
        work_shift = FULL
    input_set: "RouteStops NO_READ_PENDING with period in {WINDOW_OPEN, WINDOW_CLOSED}"
    constants:
      ESC_BASE: 10
      ESC_STREAK_W: 25
      ESC_WINDOW_W: 5
      ESC_URGENCY_DAYS: 7
      ESC_HAZARD_BONUS: 15
      ESC_DISPATCH_THRESHOLD: 40
      ESC_SCORE_CAP: 100
    precision: "integer score"
    variants: []

  - name: theft_backbill_amount
    trigger: "POST /investigations/{id}/confirm-theft"
    algorithm: tiered_pricing
    formula: |
      EVALUATION + ROUNDING ORDER (pinned, nested-rounding mode):
        1. for each month m in 1..theft_window_months:
             charge_cents[m] = round_half_up(monthly_estimated_kwh[m] * RATE_CENTS_PER_KWH(11.25))
           # per-month rounding happens BEFORE summation; summing first then rounding
           # is a different result and is rejected (333 kWh x 3 months: 11238 vs 11239)
        2. subtotal_cents = sum(charge_cents[m])
        3. penalty_cents = round_half_up(subtotal_cents * PENALTY_PCT(0.25))
        4. backbill_cents = subtotal_cents + penalty_cents
      Canonical fixture [333, 333, 333]: charges 3746 each -> subtotal 11238,
        penalty 2810, backbill_cents = 14048 (naive sum-then-round gives 14049)
    input_set: "confirm-theft payload monthly_estimated_kwh (length must equal theft_window_months)"
    constants:
      RATE_CENTS_PER_KWH: 11.25
      PENALTY_PCT: 0.25
    precision: "integer cents, round_half_up at each pinned rounding step"
    variants: []

  - name: sla_read_rate_evaluation
    trigger: "POST /ops-snapshots/{id}/finalize"
    algorithm: threshold
    formula: |
      EVALUATION ORDER (pinned; removes the circular look between estimates, backlog, and rate):
        1. eligible = stops on non-CANCELLED routes with scheduled_date <= snapshot date,
           excluding CANCELLED stops
        2. covered = eligible stops in {VALIDATED, ESTIMATED, SUPERSEDED}
           (ESTIMATED counts toward coverage as-of the snapshot; streak changes later do not revise)
        3. backlog_count = eligible stops in {PENDING, NO_READ_PENDING}
        4. breach test uses exact integer arithmetic, never the rounded display rate:
           sla_breach = (covered * 200 < eligible * 197)     # strictly below 98.50%
           boundary: covered*200 == eligible*197 is EXACTLY 98.50% and is NOT a breach (>= passes)
        5. read_rate_percent = round_half_up(100 * covered / eligible, 2)   # display only
    input_set: "RouteStops as of snapshot_at (snapshot-time membership pinned)"
    constants:
      SLA_TARGET_NUM: 197
      SLA_TARGET_DEN: 200
    precision: "breach via integer cross-multiplication; display rate 2dp half-up"
    variants: []

  - name: read_window_alignment
    trigger: "POST /route-stops/{id}/reads and route creation"
    algorithm: interval_merge
    formula: |
      Read window = [read_window_open_date, read_window_close_date], BOTH endpoints inclusive.
      read_at (date part) inside the window -> on-cycle; one day outside in either direction ->
      ERR_READ_OUTSIDE_WINDOW (capture) or ERR_ROUTE_OUTSIDE_READ_WINDOW (route schedule).
      A read is credited to the period whose window contains read_at; reads can only be captured
      while the period is WINDOW_OPEN (separate gate, ERR_READ_WINDOW_NOT_OPEN).
    input_set: "BillingCyclePeriod of the stop/route"
    precision: "date granularity, inclusive/inclusive"
    variants: []

  - name: hazard_ttl_expiry
    trigger: "ops snapshot sweep step 1 (POST /ops-snapshots)"
    algorithm: decay_function
    formula: |
      expires_at = reported_at + HAZARD_TTL_DAYS(30 days) at report; merge/renew sets
        expires_at = max(existing expires_at, clock_now + 30 days)
      At each snapshot, in expires_at ASC order: flag transitions ACTIVE -> EXPIRED iff
        expires_at < snapshot_at (STRICT; expires_at == snapshot_at stays ACTIVE one more instant)
      Re-report of the same (account, hazard_type) while ACTIVE merges (no second row).
    input_set: "HazardFlags in ACTIVE"
    constants:
      HAZARD_TTL_DAYS: 30
    precision: "datetime, strict-greater expiry"
    variants: []

  - name: endpoint_comms_degradation
    trigger: "ops snapshot sweep step 2 (POST /ops-snapshots)"
    algorithm: threshold
    formula: |
      For each AMI Meter with meter_status == IN_SERVICE, ascending Meter.created_at:
        window = (previous snapshot_at, this snapshot_at]; for the first snapshot, (meter.created_at, snapshot_at]
        if any AMI_REMOTE read (any status except REJECTED) has read_at inside window:
          endpoint_comms_status -> COMMUNICATING; consecutive_missed_days = 0; non_communicating_since = null
        else:
          consecutive_missed_days += 1
          if consecutive_missed_days >= AMI_MISS_THRESHOLD(3) and status IN {COMMUNICATING, DEGRADED}:
            -> NON_COMMUNICATING; non_communicating_since = snapshot_at
          elif status == NON_COMMUNICATING and snapshot_at - non_communicating_since >= ENDPOINT_FAILURE_DAYS(14 days):
            -> FAILED   # boundary inclusive: exactly 14 days flips
          misses 1..2 leave the meter in DEGRADED (cumulative consecutive count, reset on any AMI read)
    input_set: "AMI Meters IN_SERVICE; AMI_REMOTE MeterReads by read_at"
    constants:
      AMI_MISS_THRESHOLD: 3
      ENDPOINT_FAILURE_DAYS: 14
    precision: "day granularity; both thresholds use >="
    variants: []

  - name: backlog_aging_buckets
    trigger: "ops snapshot sweep step 4 (POST /ops-snapshots)"
    algorithm: chronological
    formula: |
      backlog_count = stops in {PENDING, NO_READ_PENDING} on non-CANCELLED routes
      backlog_aged_7plus_count = backlog stops with RouteStop.created_at <= snapshot_at - BACKLOG_AGED_DAYS(7 days)
      Boundary inclusive: created_at exactly 7 days before snapshot_at counts as aged.
    input_set: "RouteStops on non-CANCELLED routes"
    constants:
      BACKLOG_AGED_DAYS: 7
    precision: "datetime comparison, inclusive boundary"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed on the endpoint (incl. correction=true restricted to MeterOpsAdmin)", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Request body shape: required fields present, enum membership, type sanity; date-order on period creation; backbill array length", error_id: "ERR_INVALID_REQUEST | ERR_WINDOW_DATE_ORDER | ERR_BACKBILL_INPUT_MISMATCH", http_status: "400 | 422", applies_to: "endpoints with bodies" }
  - { priority: 4, category: auth, check: "Ownership: on field operations X-User-ID must equal the assigned technician_id", error_id: ERR_NOT_ASSIGNED_TECHNICIAN, http_status: 403, applies_to: "route start/complete; stop reads/mark-no-read/skip-hazard; work-order start/complete" }
  - { priority: 5, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all parameterized paths" }
  - { priority: 6, category: existence, check: "Body-referenced entities exist (technician_id, meter_id, hazard_flag_id, period ids, new_meter_id, ...)", error_id: ERR_REFERENCED_ENTITY_NOT_FOUND, http_status: 404, applies_to: "endpoints with FK payloads" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version == current version on the three OCC endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /routes/{id}/reassign; POST /route-stops/{id}/reads; POST /work-orders/{id}/reschedule" }
  - { priority: 8, category: state, check: "Stop actionability for field capture family (stop in a capture-able/markable state); precedes the generic gate so stop-state errors are domain-specific", error_id: ERR_STOP_NOT_ACTIONABLE, http_status: 409, applies_to: "stop reads/mark-no-read/skip-hazard/generate-estimate; RE_READ complete" }
  - { priority: 9, category: state, check: "Generic state-machine gate: transition allowed from current state (incl. ERR_ROUTE_NOT_REASSIGNABLE when reassign from non-ASSIGNED)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 10, category: state, check: "Route must be IN_PROGRESS for stop field operations", error_id: ERR_ROUTE_NOT_IN_PROGRESS, http_status: 409, applies_to: "stop reads/mark-no-read/skip-hazard" }
  - { priority: 11, category: state, check: "Period window gates: WINDOW_OPEN for capture; {WINDOW_OPEN, WINDOW_CLOSED} for estimate; clock gates on open/close transitions", error_id: "ERR_READ_WINDOW_NOT_OPEN | ERR_READ_WINDOW_STILL_OPEN", http_status: 409, applies_to: "stop reads, generate-estimate, open/close-read-window" }
  - { priority: 12, category: business_safety, check: "Active hazard on account blocks read capture unless route.two_person_crew", error_id: ERR_ACTIVE_HAZARD_BLOCKS_READ, http_status: 422, applies_to: "POST /route-stops/{id}/reads" }
  - { priority: 13, category: business_safety, check: "skip-hazard requires the cited flag ACTIVE on this account", error_id: ERR_SKIP_REQUIRES_ACTIVE_HAZARD, http_status: 409, applies_to: "POST /route-stops/{id}/skip-hazard" }
  - { priority: 14, category: business_safety, check: "Evidence preservation: meter with tamper_status == SUSPECTED and a non-terminal investigation rejects new EXCHANGE/ENDPOINT_SWAP orders and campaign enrollment", error_id: ERR_EVIDENCE_PRESERVATION_HOLD, http_status: 409, applies_to: "POST /work-orders, POST /replacement-campaigns/{id}/enroll" }
  - { priority: 15, category: business_temporal, check: "read_at date within the period read window (inclusive both ends)", error_id: ERR_READ_OUTSIDE_WINDOW, http_status: 422, applies_to: "POST /route-stops/{id}/reads" }
  - { priority: 16, category: business_temporal, check: "Route scheduled_date within the period read window", error_id: ERR_ROUTE_OUTSIDE_READ_WINDOW, http_status: 422, applies_to: "POST /routes" }
  - { priority: 17, category: business_temporal, check: "Technician shift-window overlap: same technician, same date, overlapping shift intervals (AM=[06:00,12:00), PM=[12:00,18:00), FULL=[06:00,18:00); AM+PM adjacency allowed)", error_id: ERR_TECHNICIAN_WINDOW_CONFLICT, http_status: 409, applies_to: "route assign/reassign; work-order dispatch/reschedule" }
  - { priority: 18, category: business_constraint, check: "Register rollback: read_value / old_final_read_value / reread_value >= account.last_validated_read_value when set", error_id: ERR_READ_ROLLBACK, http_status: 422, applies_to: "stop reads, ami-reads, RE_READ/EXCHANGE complete" }
  - { priority: 19, category: business_constraint, check: "Meter install/swap rules: account occupancy, new meter IN_STOCK and != old meter, captured meter installed at account, AMI-only ingestion", error_id: "ERR_ACCOUNT_HAS_INSTALLED_METER | ERR_METER_NOT_AVAILABLE_FOR_INSTALL | ERR_METER_NOT_INSTALLED_AT_ACCOUNT | ERR_METER_NOT_AMI", http_status: "409 | 422", applies_to: "install, exchange complete, stop reads, ami-reads" }
  - { priority: 20, category: business_constraint, check: "Uniqueness: account_number, serial_number", error_id: "ERR_DUPLICATE_ACCOUNT_NUMBER | ERR_DUPLICATE_SERIAL_NUMBER", http_status: 409, applies_to: "POST /service-accounts, POST /meters" }
  - { priority: 21, category: business_constraint, check: "Estimate eligibility: streak < 3 and >= 2 trailing validated reads", error_id: "ERR_ESTIMATE_CAP_REACHED | ERR_INSUFFICIENT_READ_HISTORY", http_status: 409, applies_to: "POST /route-stops/{id}/generate-estimate" }
  - { priority: 22, category: business_referential, check: "Account lifecycle gates: new work orders and meter installs require ACTIVE account; reactivate requires no non-terminal investigation; close requires no open work", error_id: "ERR_ACCOUNT_NOT_ACTIVE | ERR_ACCOUNT_HAS_OPEN_INVESTIGATION | ERR_ACCOUNT_HAS_OPEN_WORK", http_status: 409, applies_to: "POST /work-orders, install, reactivate, close" }
  - { priority: 23, category: business_referential, check: "Technician must be ACTIVE for new assignments; deactivate blocked by open commitments", error_id: "ERR_TECHNICIAN_NOT_ACTIVE | ERR_TECHNICIAN_HAS_OPEN_WORK", http_status: 409, applies_to: "assign/reassign/dispatch; deactivate" }
  - { priority: 24, category: business_referential, check: "One non-terminal investigation per meter", error_id: ERR_INVESTIGATION_ALREADY_OPEN, http_status: 409, applies_to: "POST /investigations" }
  - { priority: 25, category: business_quota, check: "Campaign: batch size <= quota - enrolled_count (atomic); meter FAILED and not already enrolled in an OPEN campaign", error_id: "ERR_CAMPAIGN_QUOTA_EXCEEDED | ERR_METER_NOT_ELIGIBLE_FOR_CAMPAIGN | ERR_METER_ALREADY_ENROLLED", http_status: 409, applies_to: "POST /replacement-campaigns/{id}/enroll" }  # intra-row order pinned: batch quota first (atomic), then per-meter eligibility, then already-enrolled
  - { priority: 26, category: business_aggregate, check: "Aggregate gates: finalize-billing requires zero unresolved stops and a billable read per ACTIVE account; route complete requires no PENDING stops", error_id: "ERR_CYCLE_HAS_UNRESOLVED_STOPS | ERR_ACCOUNT_MISSING_BILLABLE_READ | ERR_ROUTE_HAS_PENDING_STOPS", http_status: 409, applies_to: "finalize-billing, route complete" }  # intra-row order pinned: unresolved stops checked before missing billable read
  - { priority: 27, category: business_closure, check: "Closure gates: investigation close requires SoD (closer != opener) and, from CONFIRMED_THEFT, a VERIFIED exchange order", error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_EXCHANGE_NOT_VERIFIED", http_status: "403 | 409", applies_to: "POST /investigations/{id}/close" }

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO8601 UTC). Startup default before any call: 2026-08-01T00:00:00Z; never falls back to wall-clock.", roles: [MeterOpsAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["All server-stamped timestamps (reported_at, completed_at, snapshot sweeps, created_at) read this clock"] }

  # --- FieldTechnician ---
  - { method: POST, path: "/field-technicians", description: "Register a field technician (ACTIVE)", roles: [MeterOpsAdmin], code: 201, input: [display_name], output: FieldTechnician, side_effects: [] }
  - { method: GET, path: "/field-technicians", description: "List technicians", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["technician_status?", "limit?", "offset?"], output: "FieldTechnician[]", side_effects: [] }
  - { method: GET, path: "/field-technicians/{id}", description: "Get a technician", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: FieldTechnician, side_effects: [] }
  - { method: POST, path: "/field-technicians/{id}/deactivate", description: "ACTIVE -> INACTIVE; blocked by open route/WO commitments", roles: [MeterOpsAdmin], code: 200, input: [], output: FieldTechnician, side_effects: ["ERR_TECHNICIAN_HAS_OPEN_WORK when committed"] }

  # --- ServiceAccount ---
  - { method: POST, path: "/service-accounts", description: "Create a service account (ACTIVE)", roles: [MeterOpsAdmin], code: 201, input: [account_number, service_address, billing_cycle_code, "estimation_method?"], output: ServiceAccount, side_effects: ["ERR_DUPLICATE_ACCOUNT_NUMBER"] }
  - { method: GET, path: "/service-accounts", description: "List accounts", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["billing_cycle_code?", "account_status?", "current_meter_id?", "limit?", "offset?"], output: "ServiceAccount[]", side_effects: [] }
  - { method: GET, path: "/service-accounts/{id}", description: "Get an account (computed meter/streak/last-read fields)", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: ServiceAccount, side_effects: [] }
  - { method: POST, path: "/service-accounts/{id}/suspend", description: "ACTIVE -> SUSPENDED; cancels PENDING stops", roles: [MeterOpsAdmin], code: 200, input: [], output: ServiceAccount, side_effects: ["PENDING RouteStops on non-terminal routes -> CANCELLED"] }
  - { method: POST, path: "/service-accounts/{id}/reactivate", description: "SUSPENDED -> ACTIVE", roles: [MeterOpsAdmin], code: 200, input: [], output: ServiceAccount, side_effects: ["ERR_ACCOUNT_HAS_OPEN_INVESTIGATION"] }
  - { method: POST, path: "/service-accounts/{id}/close", description: "{ACTIVE,SUSPENDED} -> CLOSED; requires no open work", roles: [MeterOpsAdmin], code: 200, input: [], output: ServiceAccount, side_effects: ["ERR_ACCOUNT_HAS_OPEN_WORK when open stops/work orders/investigations exist"] }

  # --- Meter ---
  - { method: POST, path: "/meters", description: "Register a meter into IN_STOCK", roles: [MeterOpsAdmin], code: 201, input: [serial_number, meter_type], output: Meter, side_effects: ["ERR_DUPLICATE_SERIAL_NUMBER; comms default COMMUNICATING (AMI) / NOT_APPLICABLE (HANDHELD)"] }
  - { method: GET, path: "/meters", description: "List meters", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["meter_status?", "endpoint_comms_status?", "tamper_status?", "installed_service_account_id?", "limit?", "offset?"], output: "Meter[]", side_effects: [] }
  - { method: GET, path: "/meters/{id}", description: "Get a meter (all three state dimensions)", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: Meter, side_effects: [] }
  - { method: POST, path: "/meters/{id}/install", description: "IN_STOCK -> IN_SERVICE at an account", roles: [MeterOpsAdmin], code: 200, input: [service_account_id], output: Meter, side_effects: ["account.current_meter_id recomputed; ERR_ACCOUNT_HAS_INSTALLED_METER; ERR_ACCOUNT_NOT_ACTIVE"] }
  - { method: POST, path: "/meters/{id}/retire", description: "{IN_STOCK, REMOVED} -> RETIRED", roles: [MeterOpsAdmin], code: 200, input: [], output: Meter, side_effects: [] }
  - { method: POST, path: "/meters/{id}/ami-reads", description: "AMI head-end ingestion: creates an auto-VALIDATED AMI_REMOTE read; ERR_METER_NOT_AMI on handheld; meter must be IN_SERVICE", roles: [MeterOpsAdmin], code: 201, input: [read_value, read_at], output: MeterRead, side_effects: ["account.last_validated_read_* updated when latest; ERR_READ_ROLLBACK"] }

  # --- BillingCyclePeriod ---
  - { method: POST, path: "/billing-cycle-periods", description: "Create a billing cycle period (SCHEDULED)", roles: [MeterOpsAdmin], code: 201, input: [cycle_code, period_start_date, period_end_date, read_window_open_date, read_window_close_date, bill_run_date], output: BillingCyclePeriod, side_effects: ["ERR_WINDOW_DATE_ORDER unless period_start <= window_open <= window_close <= period_end <= bill_run_date"] }
  - { method: GET, path: "/billing-cycle-periods", description: "List periods", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["cycle_code?", "period_status?", "limit?", "offset?"], output: "BillingCyclePeriod[]", side_effects: [] }
  - { method: GET, path: "/billing-cycle-periods/{id}", description: "Get a period", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: BillingCyclePeriod, side_effects: [] }
  - { method: POST, path: "/billing-cycle-periods/{id}/open-read-window", description: "SCHEDULED -> WINDOW_OPEN; clock date must be >= window open date", roles: [BillingLiaison, MeterOpsAdmin], code: 200, input: [], output: BillingCyclePeriod, side_effects: ["ERR_READ_WINDOW_NOT_OPEN"] }
  - { method: POST, path: "/billing-cycle-periods/{id}/close-read-window", description: "WINDOW_OPEN -> WINDOW_CLOSED; clock date must be > window close date; PENDING stops auto-mark NO_READ_PENDING", roles: [BillingLiaison, MeterOpsAdmin], code: 200, input: [], output: BillingCyclePeriod, side_effects: ["cascade: PENDING stops -> NO_READ_PENDING (WINDOW_EXPIRED)"] }
  - { method: POST, path: "/billing-cycle-periods/{id}/finalize-billing", description: "WINDOW_CLOSED -> BILLED; aggregate gates", roles: [BillingLiaison], code: 200, input: [], output: BillingCyclePeriod, side_effects: ["ERR_CYCLE_HAS_UNRESOLVED_STOPS; ERR_ACCOUNT_MISSING_BILLABLE_READ"] }
  - { method: POST, path: "/billing-cycle-periods/{id}/close", description: "BILLED -> CLOSED; locks corrections", roles: [BillingLiaison], code: 200, input: [], output: BillingCyclePeriod, side_effects: [] }

  # --- Route ---
  - { method: POST, path: "/routes", description: "Create a route (DRAFT) and auto-generate RouteStops for eligible accounts of the period's cycle: account_status == ACTIVE AND has IN_SERVICE meter AND (meter_type HANDHELD OR endpoint_comms_status != COMMUNICATING); sequence by ServiceAccount.created_at ASC", roles: [Dispatcher], code: 201, input: [billing_cycle_period_id, scheduled_date, route_shift, "two_person_crew?"], output: Route, side_effects: ["RouteStops created (PENDING); ERR_ROUTE_OUTSIDE_READ_WINDOW unless scheduled_date inside read window; period must be SCHEDULED or WINDOW_OPEN"] }
  - { method: GET, path: "/routes", description: "List routes", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["billing_cycle_period_id?", "technician_id?", "route_status?", "limit?", "offset?"], output: "Route[]", side_effects: [] }
  - { method: GET, path: "/routes/{id}", description: "Get a route (computed stop counters)", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: Route, side_effects: [] }
  - { method: GET, path: "/routes/{id}/stops", description: "List a route's stops in sequence order", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["limit?", "offset?"], output: "RouteStop[]", side_effects: [] }
  - { method: POST, path: "/routes/{id}/assign", description: "DRAFT -> ASSIGNED", roles: [Dispatcher], code: 200, input: [technician_id], output: Route, side_effects: ["ERR_TECHNICIAN_NOT_ACTIVE; ERR_TECHNICIAN_WINDOW_CONFLICT"] }
  - { method: POST, path: "/routes/{id}/reassign", description: "ASSIGNED -> ASSIGNED (supersedes technician); OCC-guarded; increments Route.version by 1", roles: [Dispatcher], code: 200, input: [technician_id, expected_route_version], output: Route, side_effects: ["ERR_STALE_VERSION; ERR_ROUTE_NOT_REASSIGNABLE from non-ASSIGNED"] }
  - { method: POST, path: "/routes/{id}/unassign", description: "ASSIGNED -> DRAFT (technician cleared)", roles: [Dispatcher], code: 200, input: [], output: Route, side_effects: [] }
  - { method: POST, path: "/routes/{id}/start", description: "ASSIGNED -> IN_PROGRESS (assigned technician only)", roles: [FieldTechnician], code: 200, input: [], output: Route, side_effects: ["ERR_NOT_ASSIGNED_TECHNICIAN"] }
  - { method: POST, path: "/routes/{id}/complete", description: "IN_PROGRESS -> COMPLETED; no PENDING stops", roles: [FieldTechnician], code: 200, input: [], output: Route, side_effects: ["ERR_ROUTE_HAS_PENDING_STOPS"] }
  - { method: POST, path: "/routes/{id}/reconcile", description: "COMPLETED -> RECONCILED; computes GROSS/NET read rates", roles: [Dispatcher], code: 200, input: [], output: Route, side_effects: ["route_read_rate calculation"] }
  - { method: POST, path: "/routes/{id}/cancel", description: "{DRAFT,ASSIGNED} -> CANCELLED; PENDING stops cascade to CANCELLED", roles: [Dispatcher], code: 200, input: [], output: Route, side_effects: ["conditional cascade: only PENDING stops"] }

  # --- RouteStop ---
  - { method: GET, path: "/route-stops", description: "List/filter stops", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["route_id?", "service_account_id?", "billing_cycle_period_id?", "stop_status?", "hazard_flag_id?", "current_read_id?", "limit?", "offset?"], output: "RouteStop[]", side_effects: [] }
  - { method: GET, path: "/route-stops/{id}", description: "Get a stop", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: RouteStop, side_effects: [] }
  - { method: POST, path: "/route-stops/{id}/reads", description: "Capture a field read on a stop; supersedes prior provisional/estimated reads; OCC-guarded; increments RouteStop.version by 1", roles: [FieldTechnician, MeterOpsAdmin], code: 201, input: [meter_id, read_value, read_at, expected_route_stop_version, "tamper_indication?", "correction?"], output: MeterRead, side_effects: ["stop -> READ_CAPTURED; tamper cascade when tamper_indication; estimate compensation when stop was ESTIMATED"] }
  - { method: POST, path: "/route-stops/{id}/mark-no-read", description: "PENDING -> NO_READ_PENDING (assigned tech, route IN_PROGRESS)", roles: [FieldTechnician], code: 200, input: [no_read_reason], output: RouteStop, side_effects: [] }
  - { method: POST, path: "/route-stops/{id}/skip-hazard", description: "PENDING -> SKIPPED_HAZARD citing an ACTIVE hazard flag", roles: [FieldTechnician], code: 200, input: [hazard_flag_id], output: RouteStop, side_effects: ["ERR_SKIP_REQUIRES_ACTIVE_HAZARD"] }
  - { method: POST, path: "/route-stops/{id}/generate-estimate", description: "NO_READ_PENDING -> ESTIMATED; creates ESTIMATE read; streak += 1", roles: [BillingLiaison], code: 201, input: [], output: MeterRead, side_effects: ["estimate_read_value calculation; ERR_ESTIMATE_CAP_REACHED; ERR_INSUFFICIENT_READ_HISTORY"] }

  # --- MeterRead ---
  - { method: GET, path: "/reads", description: "List/filter reads", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["service_account_id?", "meter_id?", "route_stop_id?", "read_status?", "supersedes_read_id?", "limit?", "offset?"], output: "MeterRead[]", side_effects: [] }
  - { method: GET, path: "/reads/{id}", description: "Get a read", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: MeterRead, side_effects: [] }
  - { method: POST, path: "/reads/{id}/validate", description: "PROVISIONAL -> VALIDATED; updates account last-validated fields, resets estimate streak", roles: [BillingLiaison], code: 200, input: [], output: MeterRead, side_effects: ["stop -> VALIDATED when this read is the stop's current read"] }
  - { method: POST, path: "/reads/{id}/reject", description: "PROVISIONAL -> REJECTED; stop returns to NO_READ_PENDING", roles: [BillingLiaison], code: 200, input: [rejection_reason], output: MeterRead, side_effects: ["stop READ_CAPTURED -> NO_READ_PENDING (READ_REJECTED)"] }

  # --- HazardFlag ---
  - { method: POST, path: "/hazard-flags", description: "Report a hazard; merges into an existing ACTIVE flag of same (account, hazard_type) instead of creating a duplicate (merge returns 200 with the existing flag; fresh create 201)", roles: [FieldTechnician], code: 201, input: [service_account_id, hazard_type, severity], output: HazardFlag, side_effects: ["merge: expires_at = max(existing, now+30d), renewed_count += 1"] }
  - { method: GET, path: "/hazard-flags", description: "List/filter hazard flags", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["service_account_id?", "reported_by_technician_id?", "flag_status?", "limit?", "offset?"], output: "HazardFlag[]", side_effects: [] }
  - { method: GET, path: "/hazard-flags/{id}", description: "Get a hazard flag", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: HazardFlag, side_effects: [] }
  - { method: POST, path: "/hazard-flags/{id}/clear", description: "ACTIVE -> CLEARED; reverts citing SKIPPED_HAZARD stops when no other ACTIVE flag remains", roles: [FieldTechnician, Dispatcher, MeterOpsAdmin], code: 200, input: [], output: HazardFlag, side_effects: ["conditional stop revert cascade"] }
  - { method: POST, path: "/hazard-flags/{id}/renew", description: "ACTIVE -> ACTIVE; expires_at refreshed to now + 30d", roles: [FieldTechnician], code: 200, input: [], output: HazardFlag, side_effects: ["ERR_HAZARD_FLAG_NOT_ACTIVE from EXPIRED/CLEARED"] }

  # --- WorkOrder ---
  - { method: POST, path: "/work-orders", description: "Create a field work order (OPEN). Type-specific reference requirements: EXCHANGE/ENDPOINT_SWAP need meter_id; RE_READ needs route_stop_id; TAMPER_CHECK needs investigation_id of a non-terminal investigation (the EVIDENCE_GATHERING gate applies at completion, not creation)", roles: [Dispatcher], code: 201, input: [work_order_type, service_account_id, scheduled_date, work_shift, "meter_id?", "route_stop_id?", "investigation_id?", "notes?"], output: WorkOrder, side_effects: ["ERR_ACCOUNT_NOT_ACTIVE; ERR_EVIDENCE_PRESERVATION_HOLD; ERR_STOP_NOT_ACTIONABLE for RE_READ unless stop NO_READ_PENDING"] }
  - { method: GET, path: "/work-orders", description: "List/filter work orders", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["service_account_id?", "meter_id?", "technician_id?", "route_stop_id?", "investigation_id?", "campaign_enrollment_id?", "new_meter_id?", "work_order_status?", "work_order_type?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}", description: "Get a work order", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/dispatch", description: "{OPEN,REWORK} -> DISPATCHED with technician", roles: [Dispatcher], code: 200, input: [technician_id], output: WorkOrder, side_effects: ["ERR_TECHNICIAN_NOT_ACTIVE; ERR_TECHNICIAN_WINDOW_CONFLICT"] }
  - { method: POST, path: "/work-orders/{id}/reschedule", description: "OPEN/DISPATCHED self-loop: supersedes schedule; OCC-guarded; increments WorkOrder.version by 1", roles: [Dispatcher], code: 200, input: [scheduled_date, work_shift, expected_work_order_version], output: WorkOrder, side_effects: ["ERR_STALE_VERSION"] }
  - { method: POST, path: "/work-orders/{id}/start", description: "DISPATCHED -> IN_PROGRESS (assigned technician only)", roles: [FieldTechnician], code: 200, input: [], output: WorkOrder, side_effects: ["ERR_NOT_ASSIGNED_TECHNICIAN"] }
  - { method: POST, path: "/work-orders/{id}/complete", description: "IN_PROGRESS -> COMPLETED with type-specific payload; runs RE_READ/EXCHANGE/TAMPER_CHECK/ENDPOINT_SWAP side effects", roles: [FieldTechnician], code: 200, input: ["new_meter_id?", "old_final_read_value?", "new_initial_read_value?", "reread_value?", "reread_at?", "evidence_note?"], output: WorkOrder, side_effects: ["type-specific cascades per WorkOrder state machine"] }
  - { method: POST, path: "/work-orders/{id}/verify", description: "COMPLETED -> VERIFIED", roles: [MeterOpsAdmin], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/request-rework", description: "COMPLETED -> REWORK", roles: [MeterOpsAdmin], code: 200, input: [rework_reason], output: WorkOrder, side_effects: ["EXCHANGE swap effects persist"] }
  - { method: POST, path: "/work-orders/{id}/cancel", description: "{OPEN,DISPATCHED,REWORK} -> CANCELLED; campaign order cancel returns enrollment to ENROLLED", roles: [Dispatcher], code: 200, input: [], output: WorkOrder, side_effects: ["enrollment WORK_ORDER_CREATED -> ENROLLED when manually cancelled"] }

  # --- Investigation ---
  - { method: POST, path: "/investigations", description: "Open a tamper/theft investigation; one non-terminal per meter; sets meter tamper SUSPECTED", roles: [Investigator], code: 201, input: [service_account_id, meter_id, indication_type], output: Investigation, side_effects: ["meter NONE -> SUSPECTED + enrollment withdrawal cascade; ERR_INVESTIGATION_ALREADY_OPEN"] }
  - { method: GET, path: "/investigations", description: "List/filter investigations", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["service_account_id?", "meter_id?", "investigation_status?", "triggering_read_id?", "exchange_work_order_id?", "limit?", "offset?"], output: "Investigation[]", side_effects: [] }
  - { method: GET, path: "/investigations/{id}", description: "Get an investigation", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: Investigation, side_effects: [] }
  - { method: POST, path: "/investigations/{id}/begin-evidence", description: "OPEN -> EVIDENCE_GATHERING", roles: [Investigator], code: 200, input: [], output: Investigation, side_effects: [] }
  - { method: POST, path: "/investigations/{id}/submit-disposition", description: "EVIDENCE_GATHERING -> PENDING_DISPOSITION", roles: [Investigator], code: 200, input: [], output: Investigation, side_effects: [] }
  - { method: POST, path: "/investigations/{id}/request-more-evidence", description: "PENDING_DISPOSITION -> EVIDENCE_GATHERING (revision loop)", roles: [Investigator], code: 200, input: [], output: Investigation, side_effects: [] }
  - { method: POST, path: "/investigations/{id}/confirm-theft", description: "PENDING_DISPOSITION -> CONFIRMED_THEFT; computes backbill; auto-creates EXCHANGE order; suspends account", roles: [Investigator], code: 200, input: [theft_window_months, monthly_estimated_kwh], output: Investigation, side_effects: ["theft_backbill_amount; EXCHANGE WO created; tamper CONFIRMED; account SUSPENDED cascade"] }
  - { method: POST, path: "/investigations/{id}/clear", description: "PENDING_DISPOSITION -> CLEARED; tamper back to NONE", roles: [Investigator], code: 200, input: [], output: Investigation, side_effects: ["meter SUSPECTED -> NONE"] }
  - { method: POST, path: "/investigations/{id}/close", description: "{CONFIRMED_THEFT, CLEARED} -> CLOSED; SoD + verified-exchange gates", roles: [Investigator], code: 200, input: [], output: Investigation, side_effects: ["ERR_SEGREGATION_OF_DUTIES; ERR_EXCHANGE_NOT_VERIFIED"] }

  # --- ReplacementCampaign / CampaignEnrollment ---
  - { method: POST, path: "/replacement-campaigns", description: "Create a replacement campaign (DRAFT)", roles: [MeterOpsAdmin], code: 201, input: [campaign_name, quota], output: ReplacementCampaign, side_effects: [] }
  - { method: GET, path: "/replacement-campaigns", description: "List campaigns", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["campaign_status?", "limit?", "offset?"], output: "ReplacementCampaign[]", side_effects: [] }
  - { method: GET, path: "/replacement-campaigns/{id}", description: "Get a campaign (computed counts)", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: ReplacementCampaign, side_effects: [] }
  - { method: POST, path: "/replacement-campaigns/{id}/open", description: "DRAFT -> OPEN", roles: [MeterOpsAdmin], code: 200, input: [], output: ReplacementCampaign, side_effects: [] }
  - { method: POST, path: "/replacement-campaigns/{id}/enroll", description: "Atomic batch enrollment of FAILED meters; each enrollment immediately auto-creates an ENDPOINT_SWAP order (ENROLLED -> WORK_ORDER_CREATED)", roles: [MeterOpsAdmin], code: 201, input: [meter_ids], output: "CampaignEnrollment[]", side_effects: ["ERR_CAMPAIGN_QUOTA_EXCEEDED (whole batch rejected); ERR_METER_NOT_ELIGIBLE_FOR_CAMPAIGN; ERR_METER_ALREADY_ENROLLED; ERR_EVIDENCE_PRESERVATION_HOLD"] }
  - { method: POST, path: "/replacement-campaigns/{id}/close", description: "OPEN -> CLOSED; withdraws non-terminal enrollments and cancels their orders", roles: [MeterOpsAdmin], code: 200, input: [], output: ReplacementCampaign, side_effects: ["cascade down per campaign state machine"] }
  - { method: GET, path: "/campaign-enrollments", description: "List/filter enrollments", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["campaign_id?", "meter_id?", "enrollment_status?", "work_order_id?", "limit?", "offset?"], output: "CampaignEnrollment[]", side_effects: [] }
  - { method: GET, path: "/campaign-enrollments/{id}", description: "Get an enrollment", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: CampaignEnrollment, side_effects: [] }

  # --- OpsSnapshot ---
  - { method: POST, path: "/ops-snapshots", description: "Run the ops checkpoint at snapshot_at (DRAFT). Pinned sweep order: (1) hazard expiry, (2) AMI comms evaluation, (3) no-read escalation scoring + auto RE_READ orders, (4) aggregates + aging buckets", roles: [MeterOpsAdmin], code: 201, input: [snapshot_at], output: OpsSnapshot, side_effects: ["hazard_ttl_expiry; endpoint_comms_degradation; no_read_escalation_score; backlog_aging_buckets"] }
  - { method: GET, path: "/ops-snapshots", description: "List snapshots", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: ["snapshot_status?", "limit?", "offset?"], output: "OpsSnapshot[]", side_effects: [] }
  - { method: GET, path: "/ops-snapshots/{id}", description: "Get a snapshot", roles: [MeterOpsAdmin, Dispatcher, BillingLiaison, Investigator, FieldTechnician], code: 200, input: [], output: OpsSnapshot, side_effects: [] }
  - { method: POST, path: "/ops-snapshots/{id}/finalize", description: "DRAFT -> FINALIZED; evaluates and locks sla_breach", roles: [MeterOpsAdmin], code: 200, input: [], output: OpsSnapshot, side_effects: ["sla_read_rate_evaluation"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role headers missing or malformed" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum value invalid, or type sanity failure" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not listed on endpoint; also FieldTechnician sending correction=true" }
  - { id: ERR_NOT_ASSIGNED_TECHNICIAN, http: 403, condition: "Field operation caller is not the assigned technician on the route/work order" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Investigation close attempted by the same X-User-ID that opened it" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 404, condition: "Body-referenced entity id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not allowed from the entity's current state (generic state gate)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_READ_WINDOW_NOT_OPEN, http: 409, condition: "Period not WINDOW_OPEN for capture, not in {WINDOW_OPEN, WINDOW_CLOSED} for estimate, or clock date before window open date on open-read-window" }
  - { id: ERR_READ_WINDOW_STILL_OPEN, http: 409, condition: "close-read-window attempted while clock date <= read_window_close_date" }
  - { id: ERR_READ_OUTSIDE_WINDOW, http: 422, condition: "read_at date outside [read_window_open_date, read_window_close_date]" }
  - { id: ERR_ROUTE_OUTSIDE_READ_WINDOW, http: 422, condition: "Route scheduled_date outside the period read window" }
  - { id: ERR_WINDOW_DATE_ORDER, http: 422, condition: "Period dates fail period_start <= window_open <= window_close <= period_end <= bill_run_date" }
  - { id: ERR_READ_ROLLBACK, http: 422, condition: "read_value / old_final_read_value / reread_value below the account's last validated read value" }
  - { id: ERR_ACTIVE_HAZARD_BLOCKS_READ, http: 422, condition: "ACTIVE hazard flag on account and route.two_person_crew == false at read capture" }
  - { id: ERR_SKIP_REQUIRES_ACTIVE_HAZARD, http: 409, condition: "skip-hazard citing a flag that is not ACTIVE or belongs to another account" }
  - { id: ERR_HAZARD_FLAG_NOT_ACTIVE, http: 409, condition: "renew/clear attempted on an EXPIRED or CLEARED flag (renew only)" }
  - { id: ERR_STOP_NOT_ACTIONABLE, http: 409, condition: "Stop not in a valid state for the requested field/estimate/re-read operation" }
  - { id: ERR_ROUTE_NOT_IN_PROGRESS, http: 409, condition: "Stop field operation attempted while route is not IN_PROGRESS" }
  - { id: ERR_ROUTE_NOT_REASSIGNABLE, http: 409, condition: "reassign attempted from a non-ASSIGNED route" }
  - { id: ERR_ROUTE_HAS_PENDING_STOPS, http: 409, condition: "Route complete attempted with stops still PENDING" }
  - { id: ERR_TECHNICIAN_WINDOW_CONFLICT, http: 409, condition: "Technician already committed to an overlapping shift window on the same date" }
  - { id: ERR_TECHNICIAN_NOT_ACTIVE, http: 409, condition: "Assignment/dispatch to an INACTIVE technician" }
  - { id: ERR_TECHNICIAN_HAS_OPEN_WORK, http: 409, condition: "Deactivate blocked by ASSIGNED/IN_PROGRESS routes or DISPATCHED/IN_PROGRESS work orders" }
  - { id: ERR_ESTIMATE_CAP_REACHED, http: 409, condition: "generate-estimate with estimated_read_streak >= 3" }
  - { id: ERR_INSUFFICIENT_READ_HISTORY, http: 409, condition: "generate-estimate with fewer than 2 trailing-365-day VALIDATED reads" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Work order creation or meter install for a non-ACTIVE account" }
  - { id: ERR_ACCOUNT_HAS_OPEN_INVESTIGATION, http: 409, condition: "Reactivate blocked by a non-terminal investigation on the account" }
  - { id: ERR_ACCOUNT_HAS_OPEN_WORK, http: 409, condition: "Account close blocked by open stops, work orders, or investigations" }
  - { id: ERR_ACCOUNT_HAS_INSTALLED_METER, http: 409, condition: "Install attempted on an account that already has an IN_SERVICE meter" }
  - { id: ERR_DUPLICATE_ACCOUNT_NUMBER, http: 409, condition: "account_number already exists" }
  - { id: ERR_DUPLICATE_SERIAL_NUMBER, http: 409, condition: "serial_number already exists" }
  - { id: ERR_METER_NOT_AVAILABLE_FOR_INSTALL, http: 409, condition: "EXCHANGE new_meter_id not IN_STOCK or equal to the meter being removed" }
  - { id: ERR_METER_NOT_INSTALLED_AT_ACCOUNT, http: 409, condition: "Captured meter_id is not the account's current IN_SERVICE meter" }
  - { id: ERR_METER_NOT_AMI, http: 422, condition: "ami-reads ingestion attempted on a HANDHELD meter" }
  - { id: ERR_INVESTIGATION_ALREADY_OPEN, http: 409, condition: "Manual investigation create while a non-terminal investigation exists for the meter" }
  - { id: ERR_EVIDENCE_PRESERVATION_HOLD, http: 409, condition: "EXCHANGE/ENDPOINT_SWAP creation or campaign enrollment for a SUSPECTED meter with a non-terminal investigation" }
  - { id: ERR_EXCHANGE_NOT_VERIFIED, http: 409, condition: "Investigation close from CONFIRMED_THEFT before the auto-created EXCHANGE order is VERIFIED" }
  - { id: ERR_BACKBILL_INPUT_MISMATCH, http: 422, condition: "monthly_estimated_kwh length != theft_window_months" }
  - { id: ERR_CAMPAIGN_QUOTA_EXCEEDED, http: 409, condition: "Enrollment batch size exceeds remaining quota (batch rejected atomically)" }
  - { id: ERR_METER_NOT_ELIGIBLE_FOR_CAMPAIGN, http: 409, condition: "Enrollment of a meter whose endpoint_comms_status is not FAILED" }
  - { id: ERR_METER_ALREADY_ENROLLED, http: 409, condition: "Enrollment of a meter already enrolled in an OPEN campaign" }
  - { id: ERR_CYCLE_HAS_UNRESOLVED_STOPS, http: 409, condition: "finalize-billing with stops in {PENDING, NO_READ_PENDING} for the period" }
  - { id: ERR_ACCOUNT_MISSING_BILLABLE_READ, http: 409, condition: "finalize-billing with an ACTIVE cycle account lacking a billable read for the period" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MeterOpsAdmin
    description: "Contractor operations administrator: master data (accounts, meters, technicians), billing period setup, campaigns, ops snapshots, work-order verification, read corrections, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /field-technicians, /field-technicians/{id}/deactivate"
      - "POST /service-accounts, suspend, reactivate, close"
      - "POST /meters, install, retire, ami-reads"
      - "POST /billing-cycle-periods"
      - "POST /replacement-campaigns + open/enroll/close"
      - "POST /ops-snapshots + finalize"
      - "POST /work-orders/{id}/verify, request-rework"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "open-read-window, close-read-window (with BillingLiaison)"
      - "POST /route-stops/{id}/reads with correction=true (with FieldTechnician for ordinary captures)"
      - "hazard-flag clear (with FieldTechnician, Dispatcher)"
      - "all GET endpoints"
  - name: Dispatcher
    description: "Field operations dispatcher: builds routes, assigns/reassigns technicians, creates and dispatches work orders, reconciles routes"
    identity: opaque
    exclusive_operations:
      - "POST /routes + assign/reassign/unassign/cancel/reconcile"
      - "POST /work-orders + dispatch/reschedule/cancel"
    shared_operations:
      - "hazard-flag clear (with FieldTechnician, MeterOpsAdmin)"
      - "all GET endpoints"
  - name: FieldTechnician
    description: "Meter reader / field service technician: executes assigned routes and work orders, captures reads, reports hazards"
    identity: entity_backed:FieldTechnician
    exclusive_operations:
      - "POST /routes/{id}/start, complete (as assigned technician)"
      - "POST /route-stops/{id}/mark-no-read, skip-hazard"
      - "POST /hazard-flags, renew"
      - "POST /work-orders/{id}/start, complete (as assigned technician)"
    shared_operations:
      - "POST /route-stops/{id}/reads without correction (with MeterOpsAdmin)"
      - "hazard-flag clear (with Dispatcher, MeterOpsAdmin)"
      - "all GET endpoints"
  - name: BillingLiaison
    description: "Utility billing liaison: validates/rejects reads, generates estimates, runs window and billing finalization"
    identity: opaque
    exclusive_operations:
      - "POST /reads/{id}/validate, reject"
      - "POST /route-stops/{id}/generate-estimate"
      - "POST /billing-cycle-periods/{id}/finalize-billing, close"
    shared_operations:
      - "open-read-window, close-read-window (with MeterOpsAdmin)"
      - "all GET endpoints"
  - name: Investigator
    description: "Revenue-protection investigator: owns tamper/theft investigations end-to-end subject to segregation of duties on close"
    identity: opaque
    exclusive_operations:
      - "POST /investigations + begin-evidence/submit-disposition/request-more-evidence/confirm-theft/clear/close"
    shared_operations:
      - "all GET endpoints"
