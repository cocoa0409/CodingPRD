            - "extend replaying stale version 1 -> 412 ERR_STALE_VERSION; expires_at unchanged"

      - name: preference_verification_recompute
        claim_type: derived_field_reconciliation
        grounds: ["entities.Applicant.fields.preference_verified", "entities.Applicant.fields.preference_points", "endpoints.POST /hiring/documents/{id}/verify"]
        distinguishing_aspect: "Derived fields track document state: FIVE_POINT claim with no documents -> points 0/unverified; unverified DD214 -> still 0; verified DD214 -> verified true, points 5, recomputed immediately on the verify call."
        test_recipe:
          setup: ["Applicant with veteran_preference_claim FIVE_POINT exists; no documents."]
          setup_api_calls:
            - call: "POST /hiring/applicants"
              payload: { full_name: "Vet", email: "vet@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "FIVE_POINT" }
              as: Applicant
              captures: { v1: $.data.id, pv0: $.data.preference_verified, pp0: $.data.preference_points }
            - call: "POST /hiring/applicants/${v1}/documents"
              payload: { doc_type: "DD214" }
              as: Applicant
              as_user_id: "${v1}"
              captures: { d1: $.data.id }
            - call: "GET /hiring/applicants/${v1}"
              payload: {}
              as: HRSpecialist
              captures: { pv1: $.data.preference_verified, pp1: $.data.preference_points }
          trigger:
            - call: "POST /hiring/documents/${d1}/verify"
              payload: {}
              as: OPMDelegate
              captures: { d1_ver: $.data.verified, d1_by: $.data.verified_by }
            - call: "GET /hiring/applicants/${v1}"
              payload: {}
              as: HRSpecialist
              captures: { pv2: $.data.preference_verified, pp2: $.data.preference_points }
          assert:
            - "at claim time (no docs): preference_verified == false, preference_points == 0"
            - "after upload but before verify: still false / 0 (possession is not verification)"
            - "after verify: document verified true with verified_by set; applicant preference_verified == true and preference_points == 5 in the same request's wake (immediate consistency)"

      - name: clock_default_fixed_at_startup
        claim_type: scheduled_actions
        grounds: ["endpoints.POST /_clock/set_current_utc", "validations[error_id=ERR_OUTSIDE_OPEN_PERIOD]"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-09-01T00:00:00Z (never wall-clock): an application submitted to a 2026-09-05-opening announcement with NO clock call is rejected as too early — proving the fixed default."
        test_recipe:
          setup: ["Series S1; GS-9 position CLASSIFIED; announcement OPEN with period starting 2026-09-05; NO clock call ever made."]
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-605", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /hiring/applicants"
              payload: { full_name: "Ann", email: "ann@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { ann: $.data.id }
          trigger:
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${ann}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${ann}"
              captures: { err: $.data.error_id }
          assert:
            - "422 ERR_OUTSIDE_OPEN_PERIOD — the unset clock reads the fixed default 2026-09-01T00:00:00Z, which precedes open_at 2026-09-05; a wall-clock fallback would make this test nondeterministic"

