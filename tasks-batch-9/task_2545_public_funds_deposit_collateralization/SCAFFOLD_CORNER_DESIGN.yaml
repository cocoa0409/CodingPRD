      - name: cascade_down_depository_suspension_chain
        claim_type: cascade_down
        grounds: [state_machines.Depository, state_machines.DepositAccount, "endpoints.POST_/depositories/{id}/suspend"]
        excluded_because:
          difficulty_instance: depository_suspension_depth4_cascade_to_runoff_forecast
          rationale: "The Depository -> DepositAccount -> PublicUnit -> RunoffForecast cascade, including the 'only non-terminal children are affected' rule and the untouched collateral_status dimension, is asserted hop by hop in the §1.8 transitive_cascade instance; a second breadth test would duplicate it exactly."

      - name: parallel_funding_and_collateral_dimensions_move_independently
        claim_type: parallel
        grounds: [state_machines.DepositAccount, entities.DepositAccount.fields.funding_status, entities.DepositAccount.fields.collateral_status, complexity_profile.state_machine_shape]
        excluded_because:
          difficulty_instance: depository_suspension_depth4_cascade_to_runoff_forecast
          rationale: "Independence of the two DepositAccount dimensions (funding_status RESTRICTED while collateral_status keeps moving, and required_collateral_cents surviving restriction) is asserted inside the same §1.8 suspension cascade instance."

      - name: cross_entity_substitution_settlement_adjusts_pool_and_unit
        claim_type: cross_entity
        grounds: [state_machines.SubstitutionRequest, "endpoints.POST_/substitution-requests/{id}/settle", entities.PooledCollateralProgram]
        excluded_because:
          difficulty_instance: substitution_settlement_depth4_cascade_to_public_unit_watch
          rationale: "The settle join point's cross-entity fan-out (allocation minted, agreement totals, account coverage, unit exposure) is covered end-to-end with pinned literals by the §1.8 transitive_cascade instance."

      - name: compensation_release_reverses_allocation_side_effects
        claim_type: compensation
        grounds: [state_machines.PledgeAllocation, "endpoints.POST_/pledge-allocations/{id}/release", entities.CollateralAsset.fields.available_par_cents]
        excluded_because:
          difficulty_instance: asset_par_conservation_through_allocate_and_release
          rationale: "The allocate -> release -> re-pledge round trip and the invariant pledged_par + available_par == par_value at every step is the §1.8 compensating_invariant instance."

      - name: ledger_sync_asset_par_mirrors_on_agreement_and_depository
        claim_type: ledger_sync
        grounds: [entities.PledgeAgreement.fields.total_pledged_par_cents, entities.Depository.fields.total_pledged_par_cents, "endpoints.POST_/pledge-allocations"]
        excluded_because:
          difficulty_instance: allocation_half_open_adjacency_versus_overlap_on_asset_par
          rationale: "The deliberate asymmetry between interval-aware asset/depository par mirrors and interval-blind agreement totals is pinned by that §1.8 resource_temporal_overlap instance; re-testing it here would restate the same literals."

      - name: guarded_transition_allocation_requires_executed_agreement
        claim_type: guarded_transitions
        grounds: [state_machines.PledgeAgreement, "validations[48]", "errors[ERR_AGREEMENT_NOT_EXECUTED]"]
        excluded_because:
          difficulty_instance: allocation_requires_executed_pledge_agreement
          rationale: "The cross-entity guard 'allocation may be created only if the agreement reached EXECUTED' is walked through DRAFT, PENDING_SIGNATURES (2 of 3) and EXECUTED by the §1.8 cross_entity_state_dependency instance."

