          Airframe-reliability domain, not billing. From the same three REVENUE legs
          (two departed, one of them technically delayed 30 minutes, one lessor technical
          cancellation) the DEPARTURE basis reports 50.00 while the SCHEDULED basis reports
          33.33, because only the SCHEDULED denominator admits the cancelled leg and only its
          numerator subtracts the technical cancellation; the lease's reliability_basis
