          setup:
            - "Base fixture: port NLRTM, grade MGO-DMA, quotes 705.00 (2026-08-03) and 745.50 (2026-08-10), customer with credit_limit_usd 5000000.00 and settlement_basis SUPPLIER_FIGURES, barge Alpha"
