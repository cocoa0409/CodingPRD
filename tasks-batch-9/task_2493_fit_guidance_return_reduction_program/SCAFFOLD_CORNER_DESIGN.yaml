  - section: endpoints
    instances:
      - name: savings_report_ignores_a_still_scheduled_deployment
        claim_type: computed_read
        grounds:
          - endpoints[GET /fit-program/interventions/{id}/savings-report]
          - calculations.intervention_savings.input_set
          - entities.Intervention.fields.funding_posture
        distinguishing_aspect: |
          The report is a pure computed read: with the intervention's only deployment still
          SCHEDULED, neither its spend nor any savings are recognised, so the report returns
          gross 0 / spend 0 / net 0 / measured_deployment_count 0 / avoided_return_count 0 with
          funding_posture FUNDED and variant_applied "deployment_attributed" (the default when the
          variant parameter is omitted), and the stored Intervention row holds exactly the same
          numbers while deployment_count is already 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; a DETAIL_IMAGERY intervention with one SCHEDULED deployment for [2026-07-01, 2026-08-01) at spend 4000; no ops-run has been executed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/interventions"
              payload: { name: "Detail imagery refresh", lever: "DETAIL_IMAGERY", unit_cost_cents: 4000 }
              as: MerchOpsAdmin
              captures: { intervention_id: $.data.id }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${intervention_id}", item_id: "${item_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", spend_cents: 4000 }
              as: MerchOpsAdmin
              captures: { deployment_id: $.data.id, dep_status: $.data.status }
          trigger:
            - call: "GET /fit-program/interventions/${intervention_id}/savings-report"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures:
                variant_applied: $.data.variant_applied
                gross: $.data.gross_savings_cents
                spend: $.data.spend_cents
                net: $.data.net_savings_cents
                measured_count: $.data.measured_deployment_count
                avoided: $.data.avoided_return_count
                posture: $.data.funding_posture
            - call: "GET /fit-program/interventions/${intervention_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { stored_gross: $.data.gross_savings_cents, stored_spend: $.data.spend_cents, stored_net: $.data.net_savings_cents, stored_posture: $.data.funding_posture, stored_deployments: $.data.deployment_count }
          assert:
            - "${dep_status} == \"SCHEDULED\""
            - "${variant_applied} == \"deployment_attributed\""
            - "${gross} == 0"
            - "${spend} == 0"
            - "${net} == 0"
            - "${measured_count} == 0"
            - "${avoided} == 0"
            - "${posture} == \"FUNDED\""
            - "${stored_gross} == 0"
            - "${stored_spend} == 0"
            - "${stored_net} == 0"
            - "${stored_posture} == \"FUNDED\""
            - "${stored_deployments} == 1"
            - "InterventionDeployment.${deployment_id}.baseline_units_count == null"
            - "InterventionDeployment.${deployment_id}.window_units_count == null"

      - name: terminate_on_a_scheduled_deployment_returns_invalid_deployment_state
        claim_type: conditional_action
        grounds:
          - endpoints[POST /fit-program/intervention-deployments/{id}/terminate]
          - state_machines.InterventionDeployment.status.ACTIVE_to_TERMINATED
          - validations[priority=10]
          - errors[ERR_INVALID_DEPLOYMENT_STATE]
        distinguishing_aspect: |
          The terminate action is conditional on the deployment being ACTIVE, and a SCHEDULED
          deployment has never been activated by an ops-run, so the call returns 409
          ERR_INVALID_DEPLOYMENT_STATE, terminated_reason_code stays null, and the intervention
          still recognises no spend.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; a PDP_MODEL_MEASUREMENTS intervention with one SCHEDULED deployment for [2026-07-01, 2026-08-01) at spend 3000; no ops-run has run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/interventions"
              payload: { name: "Model measurements rollout", lever: "PDP_MODEL_MEASUREMENTS", unit_cost_cents: 3000 }
              as: MerchOpsAdmin
              captures: { intervention_id: $.data.id }
            - call: "POST /fit-program/intervention-deployments"
              payload: { intervention_id: "${intervention_id}", item_id: "${item_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z", spend_cents: 3000 }
              as: MerchOpsAdmin
              captures: { deployment_id: $.data.id }
          trigger:
            - call: "POST /fit-program/intervention-deployments/${deployment_id}/terminate"
              payload: { terminated_reason_code: "MANUAL_STOP" }
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == \"ERR_INVALID_DEPLOYMENT_STATE\""
            - "http_status == 409"
            - "InterventionDeployment.${deployment_id}.status == \"SCHEDULED\""
            - "InterventionDeployment.${deployment_id}.terminated_reason_code == null"
            - "InterventionDeployment.${deployment_id}.window_end == \"2026-08-01T00:00:00Z\""
            - "Intervention.${intervention_id}.spend_cents == 0"
            - "Intervention.${intervention_id}.funding_posture == \"FUNDED\""

      - name: manual_terminate_rewrites_window_end_and_empty_window_measures_zero
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fit-program/intervention-deployments/{id}/terminate]
          - state_machines.InterventionDeployment.status.ACTIVE_to_TERMINATED
          - state_machines.InterventionDeployment.status.TERMINATED_to_MEASURED
          - calculations.deployment_window_rates.input_set
          - calculations.intervention_savings
        distinguishing_aspect: |
          A manual stop while the clock (2026-07-10) is earlier than window_end (2026-08-01)
          rewrites window_end to the clock and stamps MANUAL_STOP, and it is that rewrite the
          later measurement reads: the window [2026-07-01, 2026-07-10) contains no delivered
          units, so measured_return_rate_bp, avoided_return_count and attributed_savings_cents
          are all 0 instead of a division error, leaving net -3000 - inside
          FUNDING_TOLERANCE_CENTS, hence UNDER_REVIEW rather than DEFUNDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item and no order lines at all."
