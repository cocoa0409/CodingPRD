  # ---------------------------------------------------------------- GrindingRun
  - method: POST
    path: "/tooling/grinding-runs"
    description: "Book a solid-carbide grinding run on a cell for a closed time window; the cell is exclusive and needs a 45-minute setup buffer on either side."
    roles: [ProductionPlanner]
    code: 201
    input: [wheel_id, product_id, cell_id, window_start, window_end, planned_units]
    output: GrindingRun
    side_effects: ["status=SCHEDULED", "consumed_life_units=0", "tolerance_class=null"]

  - method: GET
    path: "/tooling/grinding-runs/{runId}"
    description: "Read one grinding run with its tolerance class and wheel life charge."
    roles: [ProductionPlanner, QualityApprover, GeometryEngineer, ApplicationEngineer]
    code: 200
    output: GrindingRun
    side_effects: []

  - method: GET
    path: "/tooling/grinding-runs"
    description: "List grinding runs, filterable by wheel, product, cell and status; the reverse-reachability channel for GrindingWheel -> GrindingRun and ToolProduct -> GrindingRun."
    roles: [ProductionPlanner, QualityApprover, GeometryEngineer, ApplicationEngineer]
    code: 200
    input: ["wheel_id?", "product_id?", "cell_id?", "status?", "limit?", "offset?"]
    output: GrindingRun[]
    side_effects: []

  - method: POST
    path: "/tooling/grinding-runs/{runId}/complete"
    description: "Close out a grinding run with produced/scrap counts and the measured diameter deviation; charges the wheel and grades the tolerance."
    roles: [ProductionPlanner]
    code: 200
    input: [produced_units, scrap_units, measured_diameter_dev_um]
    output: GrindingRun
    side_effects: ["status=COMPLETED", "grinding_tolerance_class assigns tolerance_class", "wheel_life_consumption charges (produced_units + scrap_units) * product.grind_units_per_tool to the wheel", "wheel drops to DRESSING when remaining_life_units falls below 150", "version bumped"]

  - method: POST
    path: "/tooling/grinding-runs/{runId}/void"
    description: "Void a SCHEDULED or COMPLETED grinding run (metrology dispute or cancelled setup); a completed run's wheel-life charge is reversed exactly."
    roles: [ProductionPlanner, QualityApprover]
    code: 200
    input: [void_reason]
    output: GrindingRun
    side_effects: ["status=VOIDED (terminal)", "the run's stored consumed_life_units is subtracted back from the wheel and then zeroed", "the wheel returns from DRESSING to AVAILABLE without incrementing dress_count when the reversal lifts remaining_life_units back to 150 or above", "the run's cell window is released so a new run may occupy it", "version bumped"]

  # ---------------------------------------------------------------- ToolProduct
  - method: POST
    path: "/tooling/tool-products"
    description: "Create a catalog or special tool product bound to a grade, a geometry and optionally a coating recipe; pins all three revisions and computes the engineering lead time."
