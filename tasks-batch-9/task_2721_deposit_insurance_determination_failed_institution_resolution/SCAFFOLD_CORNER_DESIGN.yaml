              as: ClaimsAgent
              captures: { fa_dep2_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${fa_inst_id}", primary_depositor_id: "${fa_dep1_id}", account_number: "AC-0001", ownership_category: "SINGLE", balance_cents: 30000000, accrued_interest_cents: 0, opened_at: "2024-04-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { fa_acct1_id: $.data.id }
            - call: "POST /deposit-accounts"
