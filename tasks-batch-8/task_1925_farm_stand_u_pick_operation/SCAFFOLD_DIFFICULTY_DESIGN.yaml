            - { call: "POST /farm/harvest-lines", payload: { session_id: "${vs_id}", crop_id: "${crop_id}", gross_weight_oz: 16, container_count: 4 }, as: FieldStaff, captures: { ln_zero: $.data.id, ln_zero_net: $.data.net_oz, ln_zero_charge: $.data.line_charge_cents } }
            - { call: "POST /farm/harvest-lines", payload: { session_id: "${vs_id}", crop_id: "${crop_id}", gross_weight_oz: 15, container_count: 4 }, as: FieldStaff, captures: { err: $.data.error_id } }
          assert:
            - "gross 16 - tare 16 == net_oz 0: line accepted, line_charge_cents == 0"
            - "gross 15 - tare 16 == net_oz -1: rejected with ERR_TARE_EXCEEDS_GROSS, HTTP 422"
            - "GET /farm/harvest-lines?session_id shows exactly 1 line (the zero-net line only)"

      - name: weather_refund_tier_at_noon_boundary
        grounds:
          - calculations.weather_refund
          - entities.SalesDay.fields.closed_at_time
          - state_machines.SalesDay.OPEN_to_CLOSED_WEATHER
        distinguishing_aspect: |
          Metric: clock-time tier via POST /farm/sales-days/{id}/close-weather
          (distinct metric and endpoint from the other two boundary instances).
          closed_at_time exactly '12:00' falls into the 50% tier
          (12:00 <= t < 15:00), NOT the 100% tier (t < 12:00).
        test_recipe:
          setup:
            - "Weekday 2026-08-04; policy A; two sessions (A and B) each party 1 containers 1 -> admission 850, each paid 850 CASH, both CHECKED_IN (on-site set includes CHECKED_IN)"
            - "No harvest lines, no addons for either session"
          setup_api_calls:
