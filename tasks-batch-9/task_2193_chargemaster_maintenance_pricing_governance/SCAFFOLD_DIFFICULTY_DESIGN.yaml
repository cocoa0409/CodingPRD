          quantity: 2
          posted_charge_cents: 480000
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          l1_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-2002
          encounter_id: ENC-1
          payer_code: BCBS_STATE
          service_datetime: '2026-08-06T08:00:00Z'
          quantity: 2
          posted_charge_cents: 256000
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          l2_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-1001
          encounter_id: ENC-2
          payer_code: BCBS_STATE
          service_datetime: '2026-08-05T09:00:00Z'
          quantity: 2
          posted_charge_cents: 480000
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          l3_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/lines
        payload:
          submitted_cdm_number: CDM-2002
          encounter_id: ENC-2
          payer_code: BCBS_STATE
          service_datetime: '2026-08-07T09:00:00Z'
          quantity: 2
          posted_charge_cents: 256000
        as: DepartmentManager
        as_user_id: dept_mgr_1
        captures:
          l4_id: $.data.id
      - call: POST /chargemaster/charge-capture-batches/${batch_id}/reconcile
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
      - call: GET /chargemaster/missing-charge-findings
        payload:
          trigger_captured_charge_id: ${l1_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
          f1_id: $.data[0].id
      - call: GET /chargemaster/missing-charge-findings
        payload:
          trigger_captured_charge_id: ${l3_id}
        as: RevenueIntegrityAnalyst
        as_user_id: analyst_1
        captures:
