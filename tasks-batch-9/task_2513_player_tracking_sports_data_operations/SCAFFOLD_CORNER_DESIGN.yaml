      - name: delivery_mode_gates_read_two_different_collection_states
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - validations[priority=42]
          - entities.FeedSession.fields.delivery_mode
          - errors[ERR_GAME_NOT_COLLECTING]
          - errors[ERR_GAME_NOT_COLLECTED]
        distinguishing_aspect: |
          The same game state answers the two delivery modes with two different errors, and neither mode is
          ever satisfied by the other's state: on a SCHEDULED game REALTIME fails with
          ERR_GAME_NOT_COLLECTING while POST_GAME fails with ERR_GAME_NOT_COLLECTED, and after
          open-collection REALTIME succeeds while POST_GAME still fails - LIVE is not COLLECTED. Event
          tagging shares the REALTIME gate.
