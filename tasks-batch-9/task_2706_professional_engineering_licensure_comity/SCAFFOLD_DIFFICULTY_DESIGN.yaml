      - name: experience_credit_ledger_conservation_survives_recant
        grounds:
          - conserved_invariants.experience_credit_ledger_conservation
          - calculations.experience_credit_evaluation
          - state_machines.Reference.ACCEPTED_to_RECANTED
          - state_machines.ExperienceRecord.VERIFIED_to_RECANTED
          - endpoints[POST /references/{reference_id}/recant]
        distinguishing_aspect: |
          A derived-aggregate conservation law rather than a counter: Application.verified_experience_months
          must always equal the sum of credited_months over that application's non-RECANTED records. The
          compensation therefore has to zero the record's credited_months AND re-derive the parent total in
          the same request, and it must NOT disturb the independently maintained
          provisional_experience_months, which stays at 48 because the self-reported claim itself was never
          retracted. Recomputing the parent by subtracting a remembered delta instead of re-deriving from
          the surviving rows is the drift this catches. The application is only UNDER_REVIEW, so no
          downstream authorization exists to absorb the change.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Bea Marchetti' has an UNDER_REVIEW STANDARD_EXAM application with EABET_ACCREDITED education and a paid 27500-cent assessment."
            - "Its single ExperienceRecord is RESPONSIBLE_CHARGE, post-degree, 2019-01..2022-12 (48 raw months, multiplier 1.00)."
            - "The record's DIRECT_SUPERVISOR reference from 'Otto Vance' (ACTIVE licence) has been ACCEPTED and credit determination has run, so credited_months is 48 and verified_experience_months is 48, matching the ledger sum exactly."
            - "No approve-exam has been issued, so the application has no ExamAuthorization."
