      - name: rerunning_a_parity_test_supersedes_the_prior_computation
        claim_type: Valid Transition
        grounds:
          - state_machines.ParityTest.COMPUTED_to_SUPERSEDED
          - calculations.plan_year_compliance_posture
          - entities.PlanYear.fields.failing_parity_test_count
        distinguishing_aspect: "Re-running the same (classification_id, limitation_type, basis) leaves exactly one COMPUTED test; the superseded FAIL stops counting, so failing_parity_test_count returns from 1 to 0 and the posture leaves VIOLATION."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification with MEDICAL_SURGICAL COPAY rows level 20 -> 2000000 / 400 and level 0 -> 1000000 / 200, plus a MENTAL_HEALTH_SUD COPAY row at level 30 (more restrictive than the predominant level 20)."
            - "A first PLAN_PAYMENTS parity test therefore FAILs and drives the plan year to VIOLATION."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 20, projected_plan_payments_cents: 2000000, projected_claims_count: 400 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_ms_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 0, projected_plan_payments_cents: 1000000, projected_claims_count: 200 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_zero_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MENTAL_HEALTH_SUD", level_value: 30, projected_plan_payments_cents: 900000, projected_claims_count: 120 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_mh_bad_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "PLAN_PAYMENTS" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { pt_first_id: $.data.id }
          trigger:
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MENTAL_HEALTH_SUD", level_value: 30, projected_plan_payments_cents: 0, projected_claims_count: 0 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { tl_mh_new_id: $.data.id }
            - call: "POST /parity/classifications/${cls_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "PLAN_PAYMENTS" }
