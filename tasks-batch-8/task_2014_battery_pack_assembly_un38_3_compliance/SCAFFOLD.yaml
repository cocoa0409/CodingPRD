    side_effects: ["status → APPROVED; approved_by_id set; pack disposition=RETURN_PENDING"]

  - method: POST
    path: "/api/integration-programs/{programId}/return-authorizations/{rmaId}/deny"
    description: "Deny an RMA"
    roles: [SafetyOfficer]
    code: 200
    input: []
