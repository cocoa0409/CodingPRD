            - call: "POST /api/circles"
              payload: { name: "RBACFam", subscription_tier: "PROTECT", billing_anchor_day: 1, owner_display_name: "Rb", owner_birthdate: "1980-01-01T00:00:00Z", owner_email: "rb@example.com" }
              as: Owner
              captures: { cid: $.data.id, oid: $.data.owner_member_id }
            - call: "POST /api/circles/${cid}/members"
