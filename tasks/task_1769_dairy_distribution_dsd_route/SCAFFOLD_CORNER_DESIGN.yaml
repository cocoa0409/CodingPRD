        distinguishing_aspect: "A mutating call with no X-User-Role/X-User-ID headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check runs."
        test_recipe:
          setup: ["Empty DB; clock pinned at default; nothing else needed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
          trigger:
            - { call: "POST /dairy/distributors", payload: { name: "No Auth", license_number: "LIC-NA" }, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (call carries no auth headers at all)"

