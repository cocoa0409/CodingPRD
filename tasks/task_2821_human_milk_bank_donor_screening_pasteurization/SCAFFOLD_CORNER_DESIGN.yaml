            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Other Person", email: "other@example.org", zone_code: "Z1" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 1, uses_dry_ice: false, declared_volume_ml: 600, shipped_on: "2026-08-04" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e2: "$.data.error_id" } }
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C1", expressed_on: "2026-07-11", volume_ml: 600, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv1b}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e3: "$.data.error_id" } }
            - { call: "POST /milk-bank/shipments/${s2}/donations", payload: { container_label: "C1", expressed_on: "2026-07-11", volume_ml: 700, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv2}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dn2: "$.data.id" } }
          assert:
            - "${e1} == ERR_DUPLICATE_CODE with http_status 409"
            - "${e2} == ERR_DUPLICATE_CODE with http_status 409"
            - "${e3} == ERR_DUPLICATE_CODE with http_status 409"
            - "fourth response: http_status == 201 and data.container_label == C1 and data.shipment_id == ${s2}"
            - "Donation.${dn2}.volume_ml == 700 and Donation.${dn2}.remaining_ml == 700 and Donation.${dn2}.status == ELIGIBLE"
            - "GET /milk-bank/donations with shipment_id ${s1} returns total_count == 1"
            - "GET /milk-bank/donors returns total_count == 1"

      - name: clock_may_repeat_an_instant_but_never_moves_backwards
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - endpoints[POST /milk-bank/_clock/set_current_utc]
        distinguishing_aspect: "The monotonicity bound is inclusive: re-setting the clock to the instant it already holds succeeds, one second earlier is refused with ERR_CLOCK_NOT_MONOTONIC, and a later instant is adopted, as proved by the created_at of a donor written afterwards."
        test_recipe:
          setup:
            - "The logical clock is pinned to 2026-08-05T08:00:00Z and no other row exists."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
          trigger:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T07:59:59Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-06T00:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
          assert:
            - "${e1} == ERR_CLOCK_NOT_MONOTONIC with http_status 409"
            - "second response: http_status == 200"
            - "third response: http_status == 200"
            - "Donor.${d1}.created_at == 2026-08-06T00:00:00Z"
            - "Donor.${d1}.updated_at == 2026-08-06T00:00:00Z"

      - name: deferral_day_count_is_coupled_to_the_deferral_type
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_FIELD_OUT_OF_RANGE]
          - entities.DeferralEvent.fields.deferral_days
          - entities.DeferralEvent.fields.lookback_days
        distinguishing_aspect: "deferral_days == 0 is legal only for a PERMANENT deferral and illegal for a TEMPORARY one, and the reverse pairing is equally refused; lookback_days 1096 also exceeds the declared 0..1095 range. All three are ERR_FIELD_OUT_OF_RANGE at priority 11, before any state work happens."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 has an ACCEPTED questionnaire and is in SCREENING, which the deferral transition accepts."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 0, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "PERMANENT", effective_from: "2026-08-05", deferral_days: 5, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { e2: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 5, lookback_days: 1096, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1", captures: { e3: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 1, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${e1} == ERR_FIELD_OUT_OF_RANGE with http_status 422"
            - "${e2} == ERR_FIELD_OUT_OF_RANGE with http_status 422"
            - "${e3} == ERR_FIELD_OUT_OF_RANGE with http_status 422"
            - "fourth response: http_status == 201 and data.deferral_days == 1 and data.status == ACTIVE"
            - "Donor.${d1}.status == TEMPORARILY_DEFERRED"
            - "Donor.${d1}.temporary_deferral_count == 1"
            - "Donor.${d1}.active_deferral_until_date == 2026-08-06"
            - "Donor.${d1}.version == 3"
            - "GET /milk-bank/donors/${d1}/deferrals returns total_count == 1"

      - name: qualification_gate_ladder_serology_then_approval_then_success
        claim_type: cascading_validation
        grounds:
          - validations[priority=41]
          - validations[priority=42]
          - state_machines.Donor.SCREENING_to_QUALIFIED
          - errors[ERR_SEROLOGY_MISSING_OR_EXPIRED]
          - errors[ERR_PHYSICIAN_APPROVAL_MISSING]
        distinguishing_aspect: "The qualification gates are reported one at a time in declared priority order: with an ACCEPTED questionnaire but no serology the call returns ERR_SEROLOGY_MISSING_OR_EXPIRED, after the panel is filed the same call returns ERR_PHYSICIAN_APPROVAL_MISSING, and only once both exist does qualify stamp qualified_at."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 submitted the questionnaire {2 medications, no travel, no tobacco, 3 alcohol units, 15 months postpartum} scoring base 30 and screening 50, so it is ACCEPTED and the donor is in SCREENING."
            - "No SerologyPanel and no PhysicianApproval exist yet."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1", captures: { e1: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1", captures: { e2: "$.data.error_id" } }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${e1} == ERR_SEROLOGY_MISSING_OR_EXPIRED with http_status 409"
            - "second response: data.panel_status == NON_REACTIVE"
            - "${e2} == ERR_PHYSICIAN_APPROVAL_MISSING with http_status 409"
            - "fourth response: data.status == ACTIVE"
            - "Donor.${d1}.status == QUALIFIED"
            - "Donor.${d1}.qualified_at == 2026-08-05T08:00:00Z"
            - "Donor.${d1}.qualified_by_user_id == u-md-1"
            - "Donor.${d1}.surveillance_risk_score == 30"
            - "Donor.${d1}.screening_risk_score == 50"

      - name: qualify_with_an_info_requested_questionnaire_returns_health_history_incomplete
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_HEALTH_HISTORY_INCOMPLETE]
          - state_machines.Donor.TEMPORARILY_DEFERRED_to_SCREENING
        distinguishing_aspect: "Requalification returns the donor to SCREENING without touching the questionnaire history, so the newest questionnaire is still the INFO_REQUESTED one scored at base 47 / screening 67; qualify then reports ERR_HEALTH_HISTORY_INCOMPLETE at priority 40 even though serology and approval exist and the recomputed surveillance score of 62 would also fail the priority-43 gate."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 submitted {4 medications, no travel, no tobacco, 4 alcohol units, 12 months postpartum} = base 4*8 + 15 + 0 = 47, screening 47 + 20 = 67, so the questionnaire is INFO_REQUESTED."
            - "A NON_REACTIVE panel and an ACTIVE approval are then filed, and a 1-day TEMPORARY deferral effective 2026-08-05 moves the donor to TEMPORARILY_DEFERRED with active_deferral_until_date 2026-08-06."
            - "The clock advances to 2026-08-07T08:00:00Z and requalify returns the donor to SCREENING; surveillance is 47 + 15 * 0.5**(2/180) = 61.88 -> 62."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 4, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 4, months_postpartum: 12 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 1, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-07T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors/${d1}/requalify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /milk-bank/donors/${d1}/health-history", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${err} == ERR_HEALTH_HISTORY_INCOMPLETE with http_status 409"
            - "${err} != ERR_RISK_SCORE_TOO_HIGH"
            - "Donor.${d1}.status == SCREENING and Donor.${d1}.qualified_at == null"
            - "Donor.${d1}.screening_risk_score == 67"
            - "Donor.${d1}.surveillance_risk_score == 62"
            - "Donor.${d1}.active_deferral_until_date == null"
            - "Donor.${d1}.temporary_deferral_count == 1"
            - "second response: total_count == 1 and data[0].status == INFO_REQUESTED and data[0].base_risk_points == 47"

      - name: qualify_refused_when_the_decayed_surveillance_score_reaches_70
        claim_type: violation_to_error
        grounds:
          - validations[priority=43]
          - errors[ERR_RISK_SCORE_TOO_HIGH]
          - calculations.donor_risk_score
        distinguishing_aspect: "The questionnaire itself was ACCEPTED at screening 60 (exactly RISK_ACCEPT_MAX), but two TEMPORARY deferrals add 2 * 15 * 0.5**(3/180) = 29.65 to the base 40, so the recomputed surveillance score is 70 and qualify is refused at priority 43 - the screening variant alone would have let the donor through."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 submitted {2 medications, no travel, no tobacco, 4 alcohol units, 15 months postpartum} = base 16 + 15 + 9 = 40, screening 40 + 20 = 60 -> ACCEPTED, donor SCREENING."
            - "A NON_REACTIVE panel and an ACTIVE approval are filed, then two 1-day TEMPORARY deferrals effective 2026-08-05 are recorded (the second via the TEMPORARILY_DEFERRED self-loop)."
            - "The clock advances to 2026-08-08T08:00:00Z and requalify returns the donor to SCREENING with both deferrals EXPIRED; surveillance = round_half_up(40 + 2 * 15 * 0.5**(3/180)) = round_half_up(69.655) = 70."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 4, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 1, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "TRAVEL", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 1, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-08T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors/${d1}/requalify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /milk-bank/donors/${d1}/deferrals", payload: { status: "EXPIRED" }, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${err} == ERR_RISK_SCORE_TOO_HIGH with http_status 409"
            - "Donor.${d1}.status == SCREENING and Donor.${d1}.qualified_at == null"
            - "Donor.${d1}.screening_risk_score == 60"
            - "Donor.${d1}.surveillance_risk_score == 70"
            - "Donor.${d1}.temporary_deferral_count == 2"
            - "Donor.${d1}.active_deferral_until_date == null"
            - "second response: total_count == 2"

      - name: requalify_on_the_last_deferred_day_is_refused_and_the_next_day_succeeds
        claim_type: temporal_validation
        grounds:
          - validations[priority=53]
          - errors[ERR_DEFERRAL_STILL_ACTIVE]
          - state_machines.Donor.TEMPORARILY_DEFERRED_to_SCREENING
        distinguishing_aspect: "The precondition is strict: on 2026-08-08, the exact active_deferral_until_date, requalify returns ERR_DEFERRAL_STILL_ACTIVE, and only on 2026-08-09 does it succeed, clearing active_deferral_until_date to null and re-scoring surveillance to 30 + 15 * 0.5**(4/180) = 44.77 -> 45."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is QUALIFIED via the standard block (base 30)."
            - "A 3-day TEMPORARY deferral effective 2026-08-05 with recall_scope NONE moves the donor to TEMPORARILY_DEFERRED with active_deferral_until_date 2026-08-08."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/deferrals", payload: { reason_code: "ILLNESS", deferral_type: "TEMPORARY", effective_from: "2026-08-05", deferral_days: 3, lookback_days: 0, recall_scope: "NONE" }, as: MedicalDirector, as_user_id: "u-md-1" }
          trigger:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-08T09:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors/${d1}/requalify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-09T09:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors/${d1}/requalify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "GET /milk-bank/donors/${d1}/deferrals", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
          assert:
            - "${err} == ERR_DEFERRAL_STILL_ACTIVE with http_status 409"
            - "after the second trigger call: Donor.${d1}.status == TEMPORARILY_DEFERRED and Donor.${d1}.active_deferral_until_date == 2026-08-08"
            - "fourth response: http_status == 200 and data.status == SCREENING"
            - "Donor.${d1}.active_deferral_until_date == null"
            - "Donor.${d1}.surveillance_risk_score == 45"
            - "Donor.${d1}.temporary_deferral_count == 1"
            - "fifth response: total_count == 1 and data[0].status == EXPIRED"

      - name: pooling_a_donation_expressed_inside_an_active_deferral_lookback_window
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=45]
          - errors[ERR_DONATION_IN_DEFERRAL_WINDOW]
          - state_machines.Donor.TEMPORARILY_DEFERRED_to_SCREENING
          - state_machines.Donor.TEMPORARILY_DEFERRED_to_TEMPORARILY_DEFERRED
        distinguishing_aspect: "A QUALIFIED donor can still carry an ACTIVE long-dated deferral, because active_deferral_until_date follows the most recently CREATED event: a later 1-day deferral shortens the requalification gate while the earlier 30-day / 30-day-lookback event survives. Milk expressed on 2026-07-10 sits inside that event's closed window [2026-07-06, 2026-08-05] and is refused at pooling, while milk expressed on 2026-07-05 - one day outside the window - is accepted."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 is QUALIFIED via the standard block and has an ACCEPTED cooler TRK-0001 holding container C1 expressed 2026-07-10 and container C2 expressed 2026-07-05, each 700 ml TERM at 20.0 kcal/oz."
