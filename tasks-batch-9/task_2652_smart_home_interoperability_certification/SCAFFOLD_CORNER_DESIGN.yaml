          setup:
            - "RATIFIED SB1 specification S with LIGHTING CORE_ONOFF (MANDATORY 20)."
            - "AUTHORIZED laboratory L hosts plugfest PF (min_distinct_vendors 2, window 2026-10-05T09:00Z..17:00Z, registration_deadline 2026-10-01T00:00Z)."
            - "Members M1 and M2 are in good standing and each owns one DRAFT submission against S."
