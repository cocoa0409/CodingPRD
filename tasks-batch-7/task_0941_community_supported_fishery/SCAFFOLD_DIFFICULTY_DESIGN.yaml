  - rule_id: boundary_precision_check
    instances:
      - name: single_excursion_boundary_twenty_inside_twentyone_breaches
        grounds:
          - calculations.cold_chain_budget_evaluation
          - entities.ColdChainEvent.fields.breach_type
          - entities.LandingLot.fields.cold_chain_max_single_minutes
          - state_machines.LandingLot.CLEAR_to_HOLD
        distinguishing_aspect: |
          The metric is minutes on a single custody leg, reached through
          POST /csf/cold-chain-events. Exactly COLD_CHAIN_SINGLE_EXCURSION_MAX_MIN = 20 minutes
          is inside budget and leaves breach_type NONE with the lot CLEAR, while 21 minutes
          breaches on strictly-greater-than and drives the lot to HOLD; the cumulative 41
          minutes is still inside its own 45 minute budget, so the breach is SINGLE_EXCURSION
          and not BOTH.
        test_recipe:
          setup:
            - "an OPEN season with one share plan"
            - "a COMPLIANT vessel with a 500.00 lb SALMON entitlement and a landed 5.00 lb lot in quality_status CLEAR"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 5.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /csf/cold-chain-events"
              payload: { landing_lot_id: "${lot_id}", custody_leg: "DOCK_TO_HUB", minutes_above_threshold: 20, peak_temp_c: 5.0 }
              as: HubOperator
              as_user_id: "hub-op-1"
              captures: { ev1_breach: $.data.breach_type }
            - call: "POST /csf/cold-chain-events"
              payload: { landing_lot_id: "${lot_id}", custody_leg: "HUB_HOLD", minutes_above_threshold: 21, peak_temp_c: 6.5 }
              as: HubOperator
              as_user_id: "hub-op-1"
              captures: { ev2_breach: $.data.breach_type }
          assert:
            - "${ev1_breach} == NONE"
            - "${ev2_breach} == SINGLE_EXCURSION"
            - "LandingLot.${lot_id}.cold_chain_cumulative_minutes == 41"
            - "LandingLot.${lot_id}.cold_chain_max_single_minutes == 21"
            - "LandingLot.${lot_id}.peak_temp_c == 6.5"
            - "LandingLot.${lot_id}.quality_status == HOLD"

      - name: pack_tier_boundary_six_point_zero_one_costs_less_than_six
        grounds:
          - calculations.pack_size_selection
          - calculations.gel_pack_count
          - calculations.member_week_invoice
          - entities.ShareDelivery.fields.pack_size
          - entities.ShareDelivery.fields.delivery_fee_cents
        distinguishing_aspect: |
          A different metric on a different endpoint: box pounds evaluated at
          POST /csf/share-deliveries/{id}/pack. PACK_SMALL_MAX_LB = 6.00 is inclusive, so a
          6.00 lb box is SMALL with 4 gel packs and a 1750 cent fee, while a 6.01 lb box tips
