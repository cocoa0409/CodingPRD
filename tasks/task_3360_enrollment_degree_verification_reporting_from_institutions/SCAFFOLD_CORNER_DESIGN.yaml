            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { vr_ok: "$.data.status" } }
          assert:
            - "captured err_blocked == ERR_PRIVACY_BLOCKED (DIRECTORY_BLOCK active at 2026-11-15 blocks DEGREE creation)"
            - "captured d_status == EXPIRED (now 2026-12-01 >= effective_to)"
            - "captured vr_ok == QUOTED (gate relaxes after expiry)"

      - name: quote_expires_at_ttl_boundary
