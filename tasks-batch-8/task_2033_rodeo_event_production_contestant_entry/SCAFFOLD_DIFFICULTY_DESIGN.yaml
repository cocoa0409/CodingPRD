        grounds: ["validations[priority=10]", "validations[priority=11]", "errors[ERR_ANIMAL_NOT_ELIGIBLE]", "errors[ERR_CONTRACT_NOT_ACTIVE]", "endpoints.POST_/api/draw-assignments/{draw_assignment_id}/reride"]
