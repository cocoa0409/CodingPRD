            - "Case C is ASSIGNED to Dana and carries one abstraction that already survived two full rework cycles, so rework_round == 2."
            - "The abstraction is currently REWORK_REQUIRED after a third REWORK_REQUIRED verdict and the case is IN_ABSTRACTION."
