            - call: "POST /placement-appeals"
              payload: { determination_id: "${det}", requested_course_id: "${c_100}", grounds: "OTHER", statement: "My coursework since the placement shows transfer-level readiness.", expected_determination_version: "${det_v}" }
              as: Student
