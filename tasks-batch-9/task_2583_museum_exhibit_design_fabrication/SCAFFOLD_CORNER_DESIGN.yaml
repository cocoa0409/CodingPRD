      - name: panel_membership_is_a_property_of_the_round_and_is_checked_after_existence
        claim_type: unauthorized_role
        grounds:
          - errors.ERR_VOTER_NOT_ON_PANEL
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_ROUND_NOT_FOUND
        distinguishing_aspect: |
          Voting has two different refusals that both come back as 403 and must not be
          confused: MuseumOperations is not on the endpoint's role list at all, so it
          gets ERR_UNAUTHORIZED before anything is read, while AccessibilitySpecialist
          and FabricationLead ARE legal voters in general and are refused with
          ERR_VOTER_NOT_ON_PANEL only because this round's panel_roles does not name
          them. That second check is therefore ordered AFTER existence - it needs the
          round row to know the panel - so an unknown round id returns 404 even for a
          caller who would fail the panel check. The successful vote is cast by
          ProjectManager under a second user id, showing panel membership is by role
