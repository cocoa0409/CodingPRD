# =============================================================================
# SCAFFOLD.yaml — IV Hydration & Vitamin Drip Bar
# Difficulty tier: Expert
# =============================================================================

scenario: |
  617. IV Hydration & Vitamin Drip Bar (Drip Hydration/The IV Doc style): menu
  (Myers/NAD/immunity) & add-on, good-faith exam & medical-director standing
  order, mobile vs lounge scheduling, RN dispatch & route, intake/contraindication
  screening, membership & package credits, supply/lot & expiration, consent &
  adverse-reaction

domain_name: iv-hydration-drip-bar
api_prefix: ""
# All resources are top-level sibling collections (flat topology); there is no
# common nesting segment, so api_prefix is the empty root.

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: flat
  # Peer entities linked by FKs (Appointment references Patient, Membership,
  # InfusionMenuItem, StandingOrder, Lounge, DispatchRoute, Nurse); no nested
  # ownership tree in the URL paths — every resource is a top-level collection.
  state_machine_shape: branching
  # Appointment forks at clearance: CLEARED → SCHEDULED, REQUIRES_MD_REVIEW →
  # {APPROVED|DECLINED}, plus a revision loop on IntakeScreening (DRAFT→SUBMITTED→
  # DRAFT). Divergent side-effect sets per branch.
  relationship_patterns:
    - one_to_many        # Patient 1—* Appointment; Membership 1—* Appointment
    - cross_aggregate    # Appointment consumes SupplyLot units across the lot pool
  role_model: segregation_of_duties
  # The MedicalDirector who signs a StandingOrder / approves an MD-review
  # appointment MUST NOT be the same identity that performs the infusion as
  # the dispatched Nurse; intake author vs consent witness are also separated.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: InfusionMenuItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name, e.g. 'Myers Cocktail'."
      - name: tier
        type: enum
        source: input
        description: "Menu tier code."
        constraints: "one of MYERS, NAD, IMMUNITY"
      - name: base_price_cents
        type: integer
        source: input
        description: "Cash list price in cents before membership discount/surcharge."
        constraints: ">= 0"
      - name: requires_standing_order
        type: boolean
        source: input
        default: true
        description: "When true, an appointment for this drip needs an ACTIVE StandingOrder covering this tier."
      - name: g6pd_sensitive
        type: boolean
        source: input
        default: false
        description: "When true, an intake flag g6pd_deficiency raises the contraindication score for this drip's appointment."
      - name: active
        type: boolean
        source: input
        default: true
        description: "Whether the item is bookable. Inactive items reject new appointments."

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name, e.g. 'Glutathione Push'."
      - name: code
        type: enum
        source: input
        description: "Add-on code."
        constraints: "one of GLUTATHIONE, B12, ZOFRAN, TORADOL, VITC_HIGH"
      - name: price_cents
        type: integer
        source: input
        description: "Cash list price in cents before membership discount."
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        default: true
        description: "Whether the add-on is bookable."

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "ISO 8601 date; used to derive age_over_70 at screening time."
      - name: membership_id
        type: string
        source: input
        default: null
        description: "FK -> Membership.id; null when the patient has no membership."
      - name: open_adverse_event_count
        type: integer
        source: computed
        default: 0
        description: "Count of this patient's AdverseEvent rows whose status IN {REPORTED, UNDER_REVIEW}; recomputed on adverse-event create and resolve."

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: tier
        type: enum
        source: input
        description: "Membership tier."
        constraints: "one of NONE, GOLD, PLATINUM"
      - name: covered_drip_tier
        type: enum
        source: input
        description: "The single drip tier a drip_credit may be redeemed against."
        constraints: "one of MYERS, NAD, IMMUNITY"
      - name: drip_credits_total
        type: integer
        source: input
        default: 0
        description: "Whole-visit drip credits granted by the package at purchase."
        constraints: ">= 0"
      - name: drip_credits_remaining
        type: integer
        source: computed
        default: 0
        description: "drip_credits_total minus drip credits consumed by COMPLETED redemptions; decremented on redeem, restored on visit cancel/void."
      - name: addon_credits_total
        type: integer
        source: input
        default: 0
        description: "Per-add-on credits granted by the package."
        constraints: ">= 0"
      - name: addon_credits_remaining
        type: integer
        source: computed
        default: 0
        description: "addon_credits_total minus add-on credits consumed; decremented on redeem, restored on cancel/void."
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Membership lifecycle status."
        constraints: "one of ACTIVE, SUSPENDED"

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - name: medical_director_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the MedicalDirector who signed the order."
      - name: covered_tier
        type: enum
        source: input
        description: "Drip tier this standing order authorizes."
        constraints: "one of MYERS, NAD, IMMUNITY"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601; order is not in force before this instant."
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601; order lapses at this instant (half-open: in force for [effective_from, expires_at))."
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Standing-order lifecycle."
        constraints: "one of DRAFT, ACTIVE, EXPIRED, REVOKED"

  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Registered nurse name."
      - name: license_number
        type: string
        source: input
        description: "RN license identifier."
      - name: home_lounge_id
        type: string
        source: input
        default: null
        description: "FK -> Lounge.id; the lounge this RN is rostered to (null for mobile-only RNs)."
      - name: status
        type: enum
        source: input
        default: AVAILABLE
        description: "RN availability."
        constraints: "one of AVAILABLE, OFF_DUTY"

  - name: Lounge
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Lounge location name."
      - name: bay_count
        type: integer
        source: input
        description: "Number of infusion bays available concurrently."
        constraints: ">= 1"
      - name: open_minute_of_day
        type: integer
        source: input
        default: 480
        description: "Minutes after midnight UTC when the lounge opens (default 480 = 08:00)."
        constraints: "0..1439"
      - name: close_minute_of_day
        type: integer
        source: input
        default: 1200
        description: "Minutes after midnight UTC when the lounge closes (default 1200 = 20:00); a slot must fit within [open, close]."
        constraints: "0..1440"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> InfusionMenuItem.id; the drip being booked."
      - name: addon_ids
        type: array
        source: input
        default: []
        description: "Ordered list of AddOn.id values; redemption and rounding follow this exact order."
      - name: location_type
        type: enum
        source: input
        description: "Service modality."
        constraints: "one of LOUNGE, MOBILE"
      - name: lounge_id
        type: string
        source: input
        default: null
        description: "FK -> Lounge.id; required when location_type=LOUNGE, must be null when MOBILE."
      - name: route_id
        type: string
        source: computed
        default: null
        description: "FK -> DispatchRoute.id; set when a MOBILE appointment is assigned to a route stop."
      - name: nurse_id
        type: string
        source: computed
        default: null
        description: "FK -> Nurse.id; the RN dispatched to perform the infusion (set on DISPATCH)."
      - name: standing_order_id
        type: string
        source: computed
        default: null
        description: "FK -> StandingOrder.id; the order under which this drip is authorized (pinned at schedule time)."
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the infusion slot."
      - name: duration_minutes
        type: integer
        source: input
        default: 60
        description: "Slot length in minutes; end_at = start_at + duration_minutes."
        constraints: ">= 15"
      - name: membership_id
        type: string
        source: input
        default: null
        description: "FK -> Membership.id; the membership applying discount/credits to this visit (null for cash visits)."
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: "Appointment lifecycle."
        constraints: "one of REQUESTED, SCREEN_PENDING, REQUIRES_MD_REVIEW, SCHEDULED, DISPATCHED, IN_PROGRESS, COMPLETED, DECLINED, CANCELLED"
      - name: amount_charged_cents
        type: integer
        source: computed
        default: null
        description: "Final cash amount charged for uncovered lines + mobile surcharge; pinned at SCHEDULE (or APPROVE) time."
      - name: drip_credit_used
        type: integer
        source: computed
        default: 0
        description: "0 or 1; drip credits consumed from membership for this visit."
      - name: addon_credits_used
        type: integer
        source: computed
        default: 0
        description: "Count of add-on credits consumed from membership for this visit."

  - name: IntakeScreening
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the appointment this screening clears."
      - name: author_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the IntakeNurse who authored the screening."
      - name: pregnancy
        type: boolean
        source: input
        default: false
        description: "Contraindication flag (weight 40)."
      - name: renal_impairment
        type: boolean
        source: input
        default: false
        description: "Contraindication flag (weight 30)."
      - name: cardiac_history
        type: boolean
        source: input
        default: false
        description: "Contraindication flag (weight 25)."
      - name: g6pd_deficiency
        type: boolean
        source: input
        default: false
        description: "Contraindication flag (weight 35, only counted when the booked drip is g6pd_sensitive)."
      - name: recent_adverse_event
        type: boolean
        source: input
        default: false
        description: "Contraindication flag (weight 20)."
      - name: contraindication_score
        type: integer
        source: computed
        default: 0
        description: "Weighted sum of active flags (+10 when patient age_over_70 at start_at); recomputed on submit."
      - name: outcome
        type: enum
        source: computed
        default: null
        description: "Screening result driving the appointment fork."
        constraints: "one of CLEARED, REQUIRES_MD_REVIEW, BLOCKED"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Screening workflow state; the intake endpoint authors and submits in one step, so persisted rows are SUBMITTED then SUPERSEDED."
        constraints: "one of SUBMITTED, SUPERSEDED"

  - name: Consent
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit being consented to."
      - name: signed_by_patient
        type: boolean
        source: input
        description: "Patient affirmed consent."
        constraints: "must be true"
      - name: witness_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the staff witness; MUST differ from the screening author for the same appointment."
      - name: status
        type: enum
        source: computed
        default: SIGNED
        description: "Consent state."
        constraints: "one of SIGNED, REVOKED"

  - name: SupplyLot
    parent: null
    common_fields: true
    fields:
      - name: item_kind
        type: enum
        source: input
        description: "What the lot supplies."
        constraints: "one of DRIP_BASE, ADDON"
      - name: tier_or_code
        type: string
        source: input
        description: "For DRIP_BASE: the drip tier (MYERS/NAD/IMMUNITY). For ADDON: the AddOn code."
      - name: lot_number
        type: string
        source: input
        description: "Manufacturer lot identifier."
      - name: units_total
        type: integer
        source: input
        description: "Units in the lot at receipt."
        constraints: ">= 1"
      - name: units_reserved
        type: integer
        source: computed
        default: 0
        description: "Units reserved by SCHEDULED/DISPATCHED/IN_PROGRESS appointments; released on cancel, retained on completion."
      - name: units_consumed
        type: integer
        source: computed
        default: 0
        description: "Units permanently drawn down by COMPLETED appointments."
      - name: expires_at
        type: datetime
        source: input
        description: "ISO 8601; lot is unusable for any slot whose start_at >= expires_at."
      - name: status
        type: enum
        source: computed
        default: AVAILABLE
        description: "Lot state."
        constraints: "one of AVAILABLE, EXHAUSTED, EXPIRED, QUARANTINED"

  - name: DispatchRoute
    parent: null
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the RN running this mobile route."
      - name: service_date
        type: datetime
        source: input
        description: "ISO 8601 date (UTC midnight) the route covers; all stops must start on this date."
      - name: turnaround_minutes
        type: integer
        source: input
        default: 30
        description: "Mandatory travel/turnaround buffer enforced BETWEEN consecutive mobile stops on this route."
        constraints: ">= 0"
      - name: stop_count
        type: integer
        source: computed
        default: 0
        description: "Number of appointments currently assigned to this route (non-cancelled)."
      - name: status
        type: enum
        source: computed
        default: PLANNING
        description: "Route state."
        constraints: "one of PLANNING, LOCKED, CLOSED"

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit during which the reaction occurred."
      - name: reported_by_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the reporter (the dispatched Nurse or a MedicalDirector)."
      - name: severity
        type: enum
        source: input
        description: "Reaction severity."
        constraints: "one of MILD, MODERATE, SEVERE"
      - name: description
        type: string
        source: input
        description: "Free-text narrative of the reaction."
      - name: status
        type: enum
        source: computed
        default: REPORTED
        description: "Adverse-event workflow state."
        constraints: "one of REPORTED, UNDER_REVIEW, RESOLVED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StandingOrder
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /standing-orders/{id}/activate"
        actor: MedicalDirector
        preconditions:
          - "caller X-User-ID equals standing_order.medical_director_user_id"
          - "current_clock < expires_at"
          - "effective_from < expires_at"
        side_effects:
          - "set status=ACTIVE"
          - "increments StandingOrder.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /standing-orders/{id}/revoke"
        actor: MedicalDirector
        preconditions:
          - "caller X-User-ID equals standing_order.medical_director_user_id"
        side_effects:
          - "set status=REVOKED"
          - "increments StandingOrder.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advanced to/after expires_at (evaluated on use)"
        actor: system
        preconditions:
          - "current_clock >= expires_at"
        side_effects:
          - "set status=EXPIRED"

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /memberships/{id}/suspend"
        actor: ClinicAdmin
        preconditions: []
        side_effects:
          - "set status=SUSPENDED"
          - "increments Membership.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /memberships/{id}/reinstate"
        actor: ClinicAdmin
        preconditions: []
        side_effects:
          - "set status=ACTIVE"
          - "increments Membership.version by 1"

  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCREEN_PENDING
        trigger: "POST /appointments/{id}/intake (authors + submits an IntakeScreening)"
        actor: IntakeNurse
        preconditions:
          - "appointment.status IN {REQUESTED, SCREEN_PENDING, REQUIRES_MD_REVIEW}"
        side_effects:
          - "mark any prior SUBMITTED IntakeScreening for this appointment as SUPERSEDED"
          - "create a new IntakeScreening (SUBMITTED) linked to this appointment"
          - "set appointment.status=SCREEN_PENDING"
          - "increments Appointment.version by 1"
        note: >
          Revision loop: re-intake is allowed from REQUESTED, SCREEN_PENDING, or
          REQUIRES_MD_REVIEW; each re-submission supersedes the prior screening,
          recomputes contraindication_score + outcome, and returns the appointment
          to SCREEN_PENDING (cyclic). Only the latest SUBMITTED screening is
          authoritative for scheduling/approval.
      - from: SCREEN_PENDING
        to: SCHEDULED
        trigger: "POST /appointments/{id}/schedule"
        actor: ClinicAdmin
        preconditions:
          - "latest SUBMITTED IntakeScreening.outcome == CLEARED"
          - "a Consent with status=SIGNED exists for this appointment"
          - "InfusionMenuItem.active == true"
          - "if menu_item.requires_standing_order: an ACTIVE StandingOrder covering menu_item.tier with effective_from <= start_at < expires_at exists"
          - "for LOUNGE: bay availability holds for [start_at, end_at) within lounge open/close"
          - "SupplyLot units available (reserve) for drip + every add-on, none EXPIRED at start_at"
        side_effects:
          - "pin standing_order_id when required"
          - "reserve 1 unit on the chosen SupplyLot for drip and each add-on (FEFO selection)"
          - "compute amount_charged_cents via Visit Charge waterfall; decrement membership credits"
          - "set appointment.status=SCHEDULED"
          - "increments Appointment.version by 1"
      - from: SCREEN_PENDING
        to: REQUIRES_MD_REVIEW
        trigger: "POST /appointments/{id}/schedule when outcome == REQUIRES_MD_REVIEW"
        actor: ClinicAdmin
        preconditions:
          - "latest SUBMITTED IntakeScreening.outcome == REQUIRES_MD_REVIEW"
        side_effects:
          - "set appointment.status=REQUIRES_MD_REVIEW"
          - "increments Appointment.version by 1"
        note: "fork branch: MD-review required before scheduling."
      - from: REQUIRES_MD_REVIEW
        to: SCHEDULED
        trigger: "POST /appointments/{id}/md-approve"
        actor: MedicalDirector
        preconditions:
          - "caller X-User-ID != latest IntakeScreening.author_user_id (segregation of duties)"
          - "a Consent with status=SIGNED exists for this appointment"
          - "same scheduling preconditions as the CLEARED path (standing order, bay, supply)"
        side_effects:
          - "pin standing_order_id; reserve supply units (FEFO); compute amount_charged_cents; decrement credits"
          - "set appointment.status=SCHEDULED"
          - "increments Appointment.version by 1"
      - from: REQUIRES_MD_REVIEW
        to: DECLINED
        trigger: "POST /appointments/{id}/md-decline"
        actor: MedicalDirector
        preconditions:
          - "caller X-User-ID != latest IntakeScreening.author_user_id"
        side_effects:
          - "set appointment.status=DECLINED"
          - "increments Appointment.version by 1"
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /appointments/{id}/dispatch"
        actor: ClinicAdmin
        preconditions:
          - "appointment.status == SCHEDULED"
          - "nurse.status == AVAILABLE"
          - "for MOBILE: a PLANNING DispatchRoute for nurse on start_at's date with turnaround buffer satisfied vs adjacent stops"
          - "dispatched nurse X-User-ID != standing_order.medical_director_user_id (segregation of duties)"
        side_effects:
          - "set nurse_id; for MOBILE set route_id and increment route.stop_count"
          - "set appointment.status=DISPATCHED"
          - "increments Appointment.version by 1"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /appointments/{id}/start"
        actor: Nurse
        preconditions:
          - "caller X-User-ID == appointment.nurse_id"
          - "current_clock >= start_at"
        side_effects:
          - "set appointment.status=IN_PROGRESS"
          - "increments Appointment.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Nurse
        preconditions:
          - "caller X-User-ID == appointment.nurse_id"
        side_effects:
          - "move reserved SupplyLot units to consumed (units_reserved-=1, units_consumed+=1 per line); set lot EXHAUSTED when units_consumed+units_reserved == units_total"
          - "finalize membership credit consumption (no restore)"
          - "set appointment.status=COMPLETED"
          - "increments Appointment.version by 1"
      - from: SCREEN_PENDING
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "appointment.status IN {REQUESTED, SCREEN_PENDING, REQUIRES_MD_REVIEW, SCHEDULED, DISPATCHED}"
        side_effects:
          - "release any reserved SupplyLot units (units_reserved-=1 per line)"
          - "restore membership credits (drip_credits_remaining += drip_credit_used; addon_credits_remaining += addon_credits_used)"
          - "if route_id set: decrement route.stop_count"
          - "set appointment.status=CANCELLED"
          - "increments Appointment.version by 1"
        note: "single cancel transition reachable from REQUESTED/SCREEN_PENDING/REQUIRES_MD_REVIEW/SCHEDULED/DISPATCHED; from-state listed as SCREEN_PENDING for table anchoring."

  - entity: DispatchRoute
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: LOCKED
        trigger: "POST /dispatch-routes/{id}/lock"
        actor: ClinicAdmin
        preconditions:
          - "route.stop_count >= 1"
        side_effects:
          - "set status=LOCKED (no further stops may be added)"
          - "increments DispatchRoute.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /dispatch-routes/{id}/close"
        actor: ClinicAdmin
        preconditions:
          - "every assigned appointment is COMPLETED or CANCELLED"
        side_effects:
          - "set status=CLOSED"
          - "increments DispatchRoute.version by 1"

  - entity: AdverseEvent
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /adverse-events/{id}/review"
        actor: MedicalDirector
        preconditions:
          - "adverse_event.status == REPORTED"
        side_effects:
          - "set status=UNDER_REVIEW"
          - "increments AdverseEvent.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /adverse-events/{id}/resolve"
        actor: MedicalDirector
        preconditions:
          - "adverse_event.status == UNDER_REVIEW"
        side_effects:
          - "set status=RESOLVED"
          - "recompute Patient.open_adverse_event_count (decrement)"
          - "increments AdverseEvent.version by 1"
      - from: REPORTED
        to: REPORTED
        trigger: "system: on AdverseEvent create"
        actor: system
        preconditions:
          - "appointment.status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "recompute Patient.open_adverse_event_count (increment)"
        note: "creation event; recomputes derived patient counter."

  - entity: IntakeScreening
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer IntakeScreening is created for the same appointment via POST /appointments/{id}/intake"
        actor: system
        preconditions:
          - "a newer IntakeScreening is being created for the same appointment_id"
        side_effects:
          - "set status=SUPERSEDED (the prior screening is no longer authoritative)"
        note: >
          A screening is created already SUBMITTED (the intake endpoint authors and
          submits in one step, computing contraindication_score + outcome). DRAFT is
          the documented pre-submission status but the public surface only ever
          persists SUBMITTED or SUPERSEDED rows.

  - entity: Consent
    initial_state: SIGNED
    terminal_states: [REVOKED]
    transitions:
      - from: SIGNED
        to: REVOKED
        trigger: "POST /consents/{id}/revoke"
        actor: IntakeNurse
        preconditions:
          - "consent.status == SIGNED"
        side_effects:
          - "set status=REVOKED"
        note: >
          A REVOKED consent no longer satisfies the schedule/approve precondition
          'a SIGNED Consent exists', so revoking before scheduling blocks the visit.

  - entity: SupplyLot
    initial_state: AVAILABLE
    terminal_states: [EXPIRED, QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: EXHAUSTED
        trigger: "system: on COMPLETE when units_consumed + units_reserved == units_total"
        actor: system
        preconditions:
          - "units_consumed + units_reserved == units_total after a consume"
        side_effects:
          - "set status=EXHAUSTED"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system: clock reaches/exceeds expires_at (evaluated on read/list and on reservation attempts)"
        actor: system
        preconditions:
          - "current_clock >= expires_at"
          - "units_reserved == 0"
        side_effects:
          - "set status=EXPIRED (no longer selectable by FEFO)"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /supply-lots/{id}/quarantine"
        actor: ClinicAdmin
        preconditions:
          - "units_reserved == 0"
        side_effects:
          - "set status=QUARANTINED"
          - "increments SupplyLot.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# =============================================================================
concurrency_rules:

  - rule_id: schedule-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/schedule"
    occ_field: "expected_appointment_version"
    description: |
      Scheduling an Appointment whose version has advanced since the client last
      observed it is rejected. A prior write (a re-submitted intake that
      superseded the screening, or a cancel) legitimately changed the appointment
      and bumped its version; the current scheduler's view is therefore stale and
      its supply reservation / credit decrement must not apply against an
      out-of-date state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: redeem-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /appointments/{id}/md-approve"
    occ_field: "expected_membership_version"
    description: |
      Approving (and thereby redeeming credits against) a Membership whose version
      has advanced since the client last observed it is rejected. Another approval
      that already drew down credits, or a suspend/reinstate, advanced the
      membership version; redeeming against the stale view would double-spend the
      finite credit pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: visit_charge_waterfall
    trigger: "POST /appointments/{id}/schedule and POST /appointments/{id}/md-approve (SCREEN_PENDING/REQUIRES_MD_REVIEW -> SCHEDULED)"
    algorithm: waterfall_allocation
    formula: |
      # Membership discount fraction by tier:
      #   NONE -> 0.000, GOLD -> 0.150, PLATINUM -> 0.225
      # disc = (membership_id present AND membership.status==ACTIVE) ? DISC[membership.tier] : 0
      #
      # STEP 1 — credit waterfall (pinned order; mobile surcharge never credit-covered):
      #   drip_credit_used = 1 if (membership present AND membership.status==ACTIVE
      #                            AND membership.covered_drip_tier == menu_item.tier
      #                            AND membership.drip_credits_remaining > 0) else 0
      #   addon_credits_used = 0
      #   process addon_ids in their given order; for each addon:
      #       if membership.addon_credits_remaining - addon_credits_used > 0:
      #           mark addon COVERED; addon_credits_used += 1
      #       else: addon stays CASH
      #
      # STEP 2 — cash lines = uncovered drip (if drip not credit-covered) + uncovered addons.
      #   For each CASH line: line_cents = round_half_up(list_price * (1 - disc))   # round PER LINE
      #   cash_subtotal = sum of all CASH line_cents       # PIN: round per line, THEN sum
      #
      # STEP 3 — surcharge:
      #   surcharge = MOBILE_SURCHARGE_CENTS if location_type==MOBILE else 0   # not discounted, not creditable
      #
      # amount_charged_cents = cash_subtotal + surcharge
    input_set: "the appointment's menu_item (drip) + its addon_ids in request order; membership tier/credits when membership.status==ACTIVE."
    constants:
      DISC_NONE: 0.000
      DISC_GOLD: 0.150
      DISC_PLATINUM: 0.225
      MOBILE_SURCHARGE_CENTS: 9500
    precision: "round_half_up to whole cents, applied per line item BEFORE summing (pinned order)."
    variants:
      - name: cash_visit
        when: "membership_id is null or membership.status != ACTIVE"
        difference: "disc=0, no credit consumption; every line charged at full list price; surcharge still applies for MOBILE."
      - name: member_credit_visit
        when: "membership.status == ACTIVE with remaining credits"
        difference: "credits cover drip and/or leading add-ons in order; only uncovered lines incur discounted cash; surcharge always cash."

  - name: contraindication_score
    trigger: "POST /appointments/{id}/intake (IntakeScreening DRAFT -> SUBMITTED)"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if pregnancy:            score += W_PREGNANCY        # 40
      if renal_impairment:     score += W_RENAL            # 30
      if cardiac_history:      score += W_CARDIAC          # 25
      if recent_adverse_event: score += W_ADVERSE          # 20
      if g6pd_deficiency AND menu_item.g6pd_sensitive:
                               score += W_G6PD             # 35  (only when the booked drip is g6pd_sensitive)
      # age_over_70 derived from patient.date_of_birth at appointment.start_at:
      if (start_at - date_of_birth) >= 70 years:
                               score += W_AGE              # 10
      #
      # outcome tiers (boundary precision pinned):
      #   score >= 60            -> BLOCKED
      #   40 <= score < 60       -> REQUIRES_MD_REVIEW
      #   score < 40             -> CLEARED
    input_set: "IntakeScreening flags + the booked InfusionMenuItem.g6pd_sensitive + patient age at start_at."
    constants:
      W_PREGNANCY: 40
      W_RENAL: 30
      W_CARDIAC: 25
      W_G6PD: 35
      W_ADVERSE: 20
      W_AGE: 10
      BLOCK_THRESHOLD: 60
      REVIEW_THRESHOLD: 40
    precision: "integer points; no rounding."
    variants:
      - name: standard_drip
        when: "menu_item.g6pd_sensitive == false"
        difference: "g6pd_deficiency flag does NOT contribute to the score."
      - name: g6pd_sensitive_drip
        when: "menu_item.g6pd_sensitive == true"
        difference: "g6pd_deficiency flag adds W_G6PD (35), able to flip CLEARED->REQUIRES_MD_REVIEW or REVIEW->BLOCKED for identical flags."

  - name: lot_selection_fefo
    trigger: "supply reservation during SCHEDULE / MD_APPROVE; supply consumption during COMPLETE"
    algorithm: chronological
    formula: |
      # For each line (drip tier; each addon code) select the lot to reserve:
      candidates = SupplyLot where
          item_kind matches the line (DRIP_BASE for drip / ADDON for addon),
          tier_or_code == line key,
          status == AVAILABLE,
          expires_at > appointment.start_at,                 # half-open: usable while start_at < expires_at
          (units_total - units_reserved - units_consumed) >= 1
      if candidates empty: raise ERR_SUPPLY_UNAVAILABLE
      # FEFO: First-Expiry-First-Out. Sort by expires_at ASC; tie-break created_at ASC.
      chosen = candidates[0]
    input_set: "AVAILABLE, non-expired lots for the line key with free units."
    constants: {}
    precision: "integer units."
    variants:
      - name: reserve
        when: "SCHEDULE / MD_APPROVE"
        difference: "increments units_reserved by 1 (free units = total - reserved - consumed)."
      - name: consume
        when: "COMPLETE"
        difference: "moves the already-reserved unit: units_reserved-=1, units_consumed+=1; sets status EXHAUSTED when reserved+consumed == total."

  - name: route_buffer_overlap
    trigger: "POST /appointments/{id}/dispatch for a MOBILE appointment"
    algorithm: interval_merge
    formula: |
      # The candidate stop occupies [start_at, end_at) where end_at = start_at + duration_minutes.
      # For every other non-cancelled stop S already on the route, with buffer B = route.turnaround_minutes:
      #   reject if NOT ( candidate.end_at + B <= S.start_at  OR  S.end_at + B <= candidate.start_at )
      # i.e. consecutive stops must be separated by at least B minutes of turnaround on BOTH sides.
    input_set: "non-cancelled appointments already on the DispatchRoute (same nurse, same service_date)."
    constants: {}
    precision: "minute granularity; buffer comparison is inclusive (gap == B is allowed, gap < B rejected)."
    variants:
      - name: buffered_gap
        when: "dispatch onto a mobile route"
        difference: "requires a turnaround buffer of >= B minutes between adjacent stops (non-zero gap)."

  - name: lounge_bay_overlap
    trigger: "POST /appointments/{id}/schedule for a LOUNGE appointment"
    algorithm: interval_merge
    formula: |
      # The candidate slot occupies [start_at, end_at), end_at = start_at + duration_minutes.
      # Two LOUNGE appointments at the same lounge CONFLICT iff their half-open intervals overlap:
      #   overlap iff (candidate.start_at < S.end_at AND S.start_at < candidate.end_at)
      # concurrent_count = number of SCHEDULED/DISPATCHED/IN_PROGRESS lounge appointments at this
      #   lounge whose interval overlaps the candidate's.
      # reject when concurrent_count >= lounge.bay_count  (capacity = bay_count concurrent bays;
      #   adjacency at exactly end==start does NOT overlap — back-to-back allowed, no buffer).
      # Slot must also satisfy: open_minute_of_day <= start_minute AND end_minute <= close_minute_of_day
      #   (minutes computed in UTC; slot must not cross midnight).
    input_set: "SCHEDULED/DISPATCHED/IN_PROGRESS lounge appointments at the same lounge overlapping the candidate interval."
    constants: {}
    precision: "minute granularity; half-open intervals (touching boundaries do NOT conflict)."
    variants:
      - name: capacity_overlap
        when: "schedule onto a lounge"
        difference: "aggregate capacity of bay_count concurrent slots; back-to-back (gap==0) allowed (NO turnaround buffer, unlike mobile routes)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced and FK-referenced resources exist (validated left-to-right)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers in range, lounge_id present iff LOUNGE / absent iff MOBILE."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "OCC: expected_<parent>_version on schedule / md-approve matches the live parent version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/md-approve"

  - priority: 7
    category: business_safety
    check: "Latest SUBMITTED IntakeScreening.outcome != BLOCKED (a BLOCKED screening cannot be scheduled or MD-approved)."
    error_id: ERR_SCREENING_BLOCKED
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/md-approve"

  - priority: 8
    category: business_safety
    check: "A Consent with status=SIGNED exists for the appointment before scheduling/approval."
    error_id: ERR_CONSENT_MISSING
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/md-approve"

  - priority: 9
    category: business_safety
    check: "Segregation of duties — actor X-User-ID must not collide with a conflicting role identity (consent witness != screening author; md-approver != screening author; dispatched nurse != standing_order medical_director)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /consents, POST /appointments/{id}/md-approve, POST /appointments/{id}/dispatch"

  - priority: 10
    category: business_safety
    check: "Drip requiring a standing order has an ACTIVE StandingOrder covering its tier in force at start_at (effective_from <= start_at < expires_at)."
    error_id: ERR_NO_STANDING_ORDER
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/md-approve"

  - priority: 11
    category: business_temporal
    check: "LOUNGE slot fits lounge open/close window and does not exceed bay_count concurrent overlapping slots; MOBILE dispatch respects route turnaround buffer between adjacent stops."
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/dispatch"

  - priority: 12
    category: business_constraint
    check: "Sufficient AVAILABLE, non-expired SupplyLot units exist for the drip and every add-on at start_at."
    error_id: ERR_SUPPLY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/md-approve"

  - priority: 13
    category: business_fiscal
    check: "Membership credit redemption never drives any credit balance below zero; membership.status must be ACTIVE to redeem."
    error_id: ERR_CREDIT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /appointments/{id}/schedule, POST /appointments/{id}/md-approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default (never wall-clock). All deadline/expiry/window/age rules read this clock."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- InfusionMenuItem ----
  - method: POST
    path: "/menu-items"
    description: "Create a drip menu item."
    roles: [ClinicAdmin]
    code: 201
    input: [name, tier, base_price_cents, "requires_standing_order?", "g6pd_sensitive?", "active?"]
    output: InfusionMenuItem
    side_effects: []
  - method: GET
    path: "/menu-items/{id}"
    description: "Read a menu item."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: []
    output: InfusionMenuItem
    side_effects: []
  - method: GET
    path: "/menu-items"
    description: "List menu items."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: InfusionMenuItem[]
    side_effects: []

  # ---- AddOn ----
  - method: POST
    path: "/add-ons"
    description: "Create an add-on."
    roles: [ClinicAdmin]
    code: 201
    input: [name, code, price_cents, "active?"]
    output: AddOn
    side_effects: []
  - method: GET
    path: "/add-ons"
    description: "List add-ons."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient."
    roles: [ClinicAdmin, IntakeNurse]
    code: 201
    input: [full_name, date_of_birth, "membership_id?"]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Read a patient (includes computed open_adverse_event_count)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients; filter by membership_id (reverse lookup of Patient.membership_id -> Membership)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: ["membership_id?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---- Membership ----
  - method: POST
    path: "/memberships"
    description: "Create a membership/package with credits."
    roles: [ClinicAdmin]
    code: 201
    input: [tier, covered_drip_tier, "drip_credits_total?", "addon_credits_total?"]
    output: Membership
    side_effects: ["drip_credits_remaining := drip_credits_total; addon_credits_remaining := addon_credits_total"]
  - method: GET
    path: "/memberships/{id}"
    description: "Read a membership (includes remaining credits and version)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/memberships/{id}/suspend"
    description: "Suspend a membership."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status=SUSPENDED", "increments Membership.version by 1"]
  - method: POST
    path: "/memberships/{id}/reinstate"
    description: "Reinstate a suspended membership."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: ["status=ACTIVE", "increments Membership.version by 1"]
  - method: GET
    path: "/patients/{id}/memberships"
    description: "Reverse lookup: memberships referenced by a patient (0 or 1)."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector]
    code: 200
    input: []
    output: Membership[]
    side_effects: []

  # ---- StandingOrder ----
  - method: POST
    path: "/standing-orders"
    description: "Create a draft standing order signed by a medical director."
    roles: [MedicalDirector]
    code: 201
    input: [medical_director_user_id, covered_tier, effective_from, expires_at]
    output: StandingOrder
    side_effects: []
  - method: GET
    path: "/standing-orders/{id}"
    description: "Read a standing order."
    roles: [ClinicAdmin, MedicalDirector]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []
  - method: GET
    path: "/standing-orders"
    description: "List standing orders (filter by covered_tier/status)."
    roles: [ClinicAdmin, MedicalDirector]
    code: 200
    input: ["covered_tier?", "status?", "limit?", "offset?"]
    output: StandingOrder[]
    side_effects: []
  - method: POST
    path: "/standing-orders/{id}/activate"
    description: "Activate a draft standing order."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status=ACTIVE", "increments StandingOrder.version by 1"]
  - method: POST
    path: "/standing-orders/{id}/revoke"
    description: "Revoke an active standing order."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: StandingOrder
    side_effects: ["status=REVOKED", "increments StandingOrder.version by 1"]

  # ---- Nurse ----
  - method: POST
    path: "/nurses"
    description: "Register an RN."
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, license_number, "home_lounge_id?", "status?"]
    output: Nurse
    side_effects: []
  - method: GET
    path: "/nurses/{id}"
    description: "Read an RN."
    roles: [ClinicAdmin, MedicalDirector, Nurse]
    code: 200
    input: []
    output: Nurse
    side_effects: []
  - method: GET
    path: "/lounges/{id}/nurses"
    description: "Reverse lookup: RNs rostered to a lounge (via home_lounge_id)."
    roles: [ClinicAdmin, MedicalDirector]
    code: 200
    input: []
    output: Nurse[]
    side_effects: []

  # ---- Lounge ----
  - method: POST
    path: "/lounges"
    description: "Create a lounge with bays and hours."
    roles: [ClinicAdmin]
    code: 201
    input: [name, bay_count, "open_minute_of_day?", "close_minute_of_day?"]
    output: Lounge
    side_effects: []
  - method: GET
    path: "/lounges/{id}"
    description: "Read a lounge."
    roles: [ClinicAdmin, IntakeNurse, MedicalDirector, Nurse]
    code: 200
    input: []
    output: Lounge
    side_effects: []

  # ---- SupplyLot ----
  - method: POST
    path: "/supply-lots"
    description: "Receive a supply lot."
    roles: [ClinicAdmin]
    code: 201
    input: [item_kind, tier_or_code, lot_number, units_total, expires_at]
    output: SupplyLot
    side_effects: ["units_reserved:=0; units_consumed:=0; status:=AVAILABLE"]
  - method: GET
    path: "/supply-lots/{id}"
    description: "Read a supply lot (reserved/consumed/status)."
    roles: [ClinicAdmin, MedicalDirector, Nurse]
    code: 200
    input: []
    output: SupplyLot
    side_effects: []
  - method: GET
    path: "/supply-lots"
    description: "List supply lots (filter by item_kind/tier_or_code/status)."
    roles: [ClinicAdmin, MedicalDirector, Nurse]
    code: 200
    input: ["item_kind?", "tier_or_code?", "status?", "limit?", "offset?"]
    output: SupplyLot[]
    side_effects: []
  - method: POST
    path: "/supply-lots/{id}/quarantine"
    description: "Quarantine a lot (e.g. recall); reserved units must be 0."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: SupplyLot
    side_effects: ["status=QUARANTINED", "increments SupplyLot.version by 1"]

  # ---- DispatchRoute ----
  - method: POST
    path: "/dispatch-routes"
    description: "Create a mobile dispatch route for an RN on a service date."
    roles: [ClinicAdmin]
    code: 201
    input: [nurse_id, service_date, "turnaround_minutes?"]
    output: DispatchRoute
    side_effects: ["stop_count:=0; status:=PLANNING"]
  - method: GET
    path: "/dispatch-routes/{id}"
    description: "Read a route (stop_count/status)."
    roles: [ClinicAdmin, MedicalDirector, Nurse]
    code: 200
    input: []
