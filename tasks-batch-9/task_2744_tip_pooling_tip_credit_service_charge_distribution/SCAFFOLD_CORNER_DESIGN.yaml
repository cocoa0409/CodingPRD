            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${server_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z", gross_sales_cents: 100000, charged_sales_cents: 0 }
              as: ShiftManager
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: ShiftManager
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 7000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines?pay_period_id=${period_id}&status=FINAL"
              payload: {}
              as: ComplianceOfficer
              captures: { line_a_id: "$.data[0].id" }
            - call: "POST /pay-periods/${period_id}/reopen"
              payload: { reason: "tip declaration amended" }
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 8000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines?pay_period_id=${period_id}&status=FINAL"
              payload: {}
              as: ComplianceOfficer
              captures: { line_b_id: "$.data[0].id" }
            - call: "POST /pay-periods/${period_id}/reopen"
              payload: { reason: "tip declaration amended again" }
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 7999, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines?pay_period_id=${period_id}&status=FINAL"
              payload: {}
              as: ComplianceOfficer
              captures: { line_c_id: "$.data[0].id" }
          assert:
            - "after trigger 2 GET /pay-periods/${period_id} reports gross_receipts_cents == 100000, reported_tips_cents == 7000 and allocation_shortfall_cents == 1000, the threshold being round_half_up(0.08 * 100000) == 8000"
            - "GET /pay-lines/${line_a_id} reports reported_tips_cents == 7000, allocated_tips_cents == 1000, tips_available_cents == 7000, tip_credit_cents == 4096, topup_cents == 0 and total_gross_cents == 1704: the whole shortfall lands on the only directly tipped line and changes no money field"
            - "trigger 4 returns HTTP 200 with status == OPEN, allocation_shortfall_cents == 0 and reported_tips_cents == 0, and GET /pay-lines/${line_a_id} reports status == SUPERSEDED"
            - "after trigger 7 GET /pay-periods/${period_id} reports reported_tips_cents == 8000 and allocation_shortfall_cents == 0, because the comparison is strictly less than and 8000 is not below 8000"
            - "GET /pay-lines/${line_b_id} reports allocated_tips_cents == 0 with tip_credit_cents == 4096 and total_gross_cents == 1704, and ${line_b_id} differs from ${line_a_id}, each compute inserting a fresh line set"
            - "after trigger 12 GET /pay-periods/${period_id} reports reported_tips_cents == 7999 and allocation_shortfall_cents == 1, one cent below the threshold producing exactly one cent of allocated tips"
            - "GET /pay-lines/${line_c_id} reports allocated_tips_cents == 1, reported_tips_cents == 7999, tip_credit_cents == 4096 and total_gross_cents == 1704"
            - "GET /shifts/${shift_id} reports declaration_status == AMENDED with declaration_count == 3, gross_sales_cents == 100000 unchanged across all three rounds"
            - "GET /pay-lines?pay_period_id=${period_id} reports total_count == 3, exactly one of them FINAL and the other two SUPERSEDED"

      - name: cascading_side_effects_depth_and_ordering
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / pool_reverse_cascade_depth_five"
          rationale: >-
            The §1.8 instance already walks the deepest cascade in the system end to end — pool
            reverse driving contribution_status, the PoolAllocation ledger, every contributing
            Shift, the owning PayPeriod back to OPEN and Location.pending_pool_cents — and asserts
            the hop ordering plus the money invariant at each hop. A §1.9 breadth instance would
            re-walk the same five hops with no new claim, and the partial-failure limb is covered by
            the manager-only and participantless pool rejections, which prove a refused cascade
            writes nothing at hop 1.

      - name: dual_variant_calculation_divergence_and_switch
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / pay_line_tip_credit_weekly_aggregate_versus_per_shift"
          rationale: >-
            Both variants of both dual-variant calculations are already pinned by §1.8: the pay-line
            variant instance computes the same fixture under WEEKLY_AGGREGATE and PER_SHIFT and
            asserts the exact delta that the compute-then-approve switch applies, and the card-fee
            instance does the same for ACTUAL_ONLY versus CAPPED_BPS. The variant-selection claim
            (provisional at compute, final at approve) is asserted there as PayPeriod.compute_variant
            transitions, so a §1.9 instance would duplicate it verbatim.

  - section: consistency_model
    instances:
      - name: distribution_response_already_carries_every_cascaded_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ShiftTipPool.distribution_status
          - calculations.pool_distribution
          - entities.Employee.fields.trailing_pool_receipts_cents
          - entities.Location.fields.pending_pool_cents
        distinguishing_aspect: >-
          The declared consistency model is immediate, so the single most cascade-heavy write in the
          system is used as the proof: the distribute response body itself must already report
          net_pool_cents, participant_count, total_share_weight, distributed_cents and distributed_at,
          and every derived field on four OTHER entities — the ledger rows, both employees' trailing
          receipts and the location's pending balance — must agree on the very next read with no
          settling period, no second write and no re-read tolerance.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T12:00:00Z."
            - "A Texas unit with an ACTIVE TIPPED_ONLY, TIPS_RECEIVED_PCT, POINTS_ONLY policy, cc_fee_pass_through false."
            - "SERVER: 1500 bps, 10 points. BUSSER: 0 bps, 4 points, tip_status TIPPED."
            - "Ana (SERVER) declares 4000 cash and Bea (BUSSER) declares 0 on 2026-08-04; both shifts are CLOSED and neither is pooled yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { server_role_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "BUSSER", title: "Busser", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 0, pool_share_points: 4, side_work_eligible: true }
              as: PayrollAdmin
              captures: { busser_role_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { ana_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bea Lima", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { bea_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${ana_id}", job_role_id: "${server_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${bea_id}", job_role_id: "${busser_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${ana_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: ShiftManager
              captures: { ana_shift_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${bea_id}", location_id: "${loc_id}", job_role_id: "${busser_role_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: ShiftManager
              captures: { bea_shift_id: $.data.id }
            - call: "POST /shifts/${ana_shift_id}/close"
              payload: {}
              as: ShiftManager
            - call: "POST /shifts/${bea_shift_id}/close"
              payload: {}
              as: ShiftManager
            - call: "POST /shifts/${ana_shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${ana_id}"
            - call: "POST /shifts/${bea_shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 0, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${bea_id}"
          trigger:
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_id: $.data.id }
            - call: "POST /shift-tip-pools/${pool_id}/distribute"
              payload: {}
              as: PayrollPreparer
            - call: "GET /pool-allocations?shift_tip_pool_id=${pool_id}"
              payload: {}
              as: PayrollPreparer
          assert:
            - "trigger 1 returns HTTP 201 whose own body already reports total_contributed_cents == 600, contributing_shift_count == 1, contribution_status == CONTRIBUTED and distribution_status == PENDING, with no follow-up read required"
            - "immediately after trigger 1, GET /shifts/${ana_shift_id} reports pool_contribution_cents == 600 and retained_tips_cents == 3400, GET /shifts/${bea_shift_id} reports pool_contribution_cents == 0 with shift_tip_pool_id == ${pool_id}, and GET /locations/${loc_id} reports pending_pool_cents == 600"
            - "trigger 2 returns HTTP 200 whose own body already reports cc_fee_deducted_cents == 0, net_pool_cents == 600, participant_count == 2, total_share_weight == 14, distributed_cents == 600, distribution_status == DISTRIBUTED and distributed_at == 2026-08-10T12:00:00.000Z"
            - "trigger 3 reports total_count == 2 on the very next request: Ana's row allocated_cents == 429 with share_weight == 10, remainder_cent_awarded == true and entry_type == DISTRIBUTION, Bea's row allocated_cents == 171 with share_weight == 4 and remainder_cent_awarded == false, the two summing to net_pool_cents"
            - "GET /employees/${ana_id} reports trailing_pool_receipts_cents == 429 and GET /employees/${bea_id} reports 171 with no intervening write, so the denormalised employee totals do not lag the ledger"
            - "GET /locations/${loc_id} reports pending_pool_cents == 0 immediately, the pool having left the pending set in the same request that distributed it"
            - "every read above returns the same values on a second identical read, and no field changes without a further write: there is no eventual-consistency window anywhere in this cascade"
