  - rule_id: boundary_precision_check
    instances:

      - name: de_minimis_share_exactly_at_ceiling_and_premium_exactly_at_floor
        grounds:
          - calculations.de_minimis_eligibility
          - calculations.de_minimis_premium_floor
          - calculations.oversight_cost_reimbursement
          - validations[priority=36]
          - validations[priority=37]
          - endpoints[POST /sites/{id}/cost-recovery-actions]
          - entities.CostRecoveryAction.fields.premium_floor_cents
        distinguishing_aspect: |
          Boundary metric = the de minimis SHARE CEILING (1.00 pct, inclusive) together with the
          PREMIUM FLOOR EQUALITY (demanded_cents == premium_floor_cents, inclusive), exercised on
          POST /sites/{id}/cost-recovery-actions. A party sitting exactly on the ceiling is eligible,
          and an offer sitting exactly on the floor is accepted; the floor is also derived from the
          ALLOCATED final_pct (0.72) rather than the volumetric share (1.00), so reading the wrong
          percentage yields 92400 instead of 66528.
        test_recipe:
          setup:
            - "Site listed with two PARTICIPATING parties: A 3960 t class II, B 40 t class IV, both VERIFIED."
            - "Site verified total 4000 t, so B's volumetric_share_pct is exactly 1.00 - the inclusive de minimis ceiling."
            - "Round adopted by two ACCEPT ballots: A final_pct 99.28, B final_pct 0.72, orphan 0.00, settled 0.00."
            - "One oversight posting of 4000000 cents: tier 1 (subtotal <= 5000000) at 1550 bp, indirect 620000, billed 4620000, no contracts, so total_response_cost_cents == 4620000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Tanner Creek Solvent Recovery", epa_region: 5, hrs_score: 39.70 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-TCS-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Tanner Solvents Inc", party_type: "OWNER_OPERATOR", viability_score: 88 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Creekside Auto Body LLC", party_type: "GENERATOR", viability_score: 19 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_b: $.data.id }
            - call: "POST /prps/${prp_a}/notice"
              payload: { notice_reference: "GNL-2027-7001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_b}/notice"
              payload: { notice_reference: "GNL-2027-7002" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_a}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /prps/${prp_b}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_b}"
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp_a}", volume_tons: 3960, toxicity_class: "II", evidence_grade: "A", disposal_year: 1976 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w_a: $.data.id }
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp_b}", volume_tons: 40, toxicity_class: "IV", evidence_grade: "B", disposal_year: 1991 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { w_b: $.data.id }
            - call: "POST /waste-in-records/${w_a}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 3960 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /waste-in-records/${w_b}/verification"
              payload: { decision: "VERIFIED", verified_volume_tons: 40 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-1 chlorinated solvent plume", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { site_v: $.data.version }
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 5000, weight_toxicity_bp: 3000, weight_ownership_bp: 2000, expected_site_version: "${site_v}" }
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { round_id: $.data.id }
            - call: "POST /allocation-rounds/${round_id}/balloting"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
            - call: "POST /allocation-rounds/${round_id}/ballots"
              payload: { ballot: "ACCEPT" }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /allocation-rounds/${round_id}/ballots"
              payload: { ballot: "ACCEPT" }
              as: PRPRepresentative
              as_user_id: "${prp_b}"
            - call: "POST /sites/${site_id}/oversight-costs"
              payload: { incurred_cents: 4000000, cost_category: "RI_FS_OVERSIGHT", incurred_on: "2027-02-20" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "GET /prps/${prp_b}"
              payload: {}
              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { prp_b_v: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/cost-recovery-actions"
              payload: { respondent_prp_id: "${prp_b}", action_type: "DE_MINIMIS_SETTLEMENT", demanded_cents: 66528, expected_prp_version: "${prp_b_v}" }
              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { action_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201 (demanded_cents exactly equal to the floor is accepted; the comparison is >=, not >)"
            - "PotentiallyResponsibleParty.${prp_b}.volumetric_share_pct == 1.00 (exactly the DE_MINIMIS_SHARE_CEILING_PCT) and de_minimis_eligible == true"
            - "PotentiallyResponsibleParty.${prp_b}.verified_volume_tons == 40 and max_toxicity_class == IV"
            - "PotentiallyResponsibleParty.${prp_a}.volumetric_share_pct == 99.00 and de_minimis_eligible == false"
            - "Site.${site_id}.oversight_direct_cents == 4000000, oversight_indirect_rate_bp == 1550, oversight_indirect_cents == 620000, oversight_billed_cents == 4620000"
            - "Site.${site_id}.total_response_cost_cents == 4620000 and oversight_cap_utilization_pct == null (no entered decree governs the site)"
            - "AllocationShare of ${prp_b} in ${round_id}: final_pct == 0.72, disposition == ALLOCATED"
            - "CostRecoveryAction.${action_id}.respondent_share_pct_at_offer == 0.72 (the ALLOCATED exposure, not the 1.00 volumetric share)"
            - "CostRecoveryAction.${action_id}.premium_floor_cents == 66528 (4620000 * 0.72 / 100 * 2.0), not 92400 which is what the volumetric 1.00 pct would give"
            - "CostRecoveryAction.${action_id}.status == OFFERED, received_cents == 0, demanded_cents == 66528"
            - "a second identical offer at demanded_cents 66527 would be rejected 422 ERR_DE_MINIMIS_PREMIUM_INSUFFICIENT - one cent below the floor is the first failing value"

      - name: hazard_index_exactly_at_limit_with_empty_valid_set_first_returns_4XX
        grounds:
          - calculations.risk_assessment
          - validations[priority=19]
          - errors[ERR_NO_VALID_SAMPLES]
          - endpoints[POST /remedial-investigations/{id}/submission]
          - entities.RemedialInvestigation.fields.valid_sample_count
          - entities.RemedialInvestigation.fields.hazard_index
          - state_machines.RemedialInvestigation.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Different boundary metrics and a different endpoint from the de minimis instance: here the
          boundaries are the EMPTY VALID SAMPLE SET (valid_sample_count exactly 0 blocks submission on
          POST /remedial-investigations/{id}/submission) and the HAZARD INDEX EXACTLY AT
          HAZARD_INDEX_LIMIT (1.00, inclusive) while rme_risk is four times BELOW ACTION_LEVEL_RISK -
          so action_level_exceeded is true on the hazard limb alone. A 3-decimal half-up EPC
          (2.7225 -> 2.723) rides along on the same submission.
        test_recipe:
          setup:
            - "Site listed; one RI/FS in DRAFT with exposure_medium GROUNDWATER."
            - "Three samples that all fail to enter central_set: SOIL/VALID 700.0 (wrong medium), GROUNDWATER/REJECTED 900.0, GROUNDWATER/ESTIMATED 5.0."
            - "valid_sample_count is therefore exactly 0 at the first submission attempt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Ridgemont Plating Works", epa_region: 2, hrs_score: 36.20 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-RPW-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-1 groundwater chromium plume", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "SOIL", contaminant: "CHROMIUM_VI", concentration_ug_per_l: 700.0, qa_status: "VALID", collected_at: "2027-01-05T10:00:00Z", lab_reference: "LAB-R-0001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { s_soil: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "CHROMIUM_VI", concentration_ug_per_l: 900.0, qa_status: "REJECTED", collected_at: "2027-01-06T10:00:00Z", lab_reference: "LAB-R-0002" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { s_rej: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "CHROMIUM_VI", concentration_ug_per_l: 5.0, qa_status: "ESTIMATED", collected_at: "2027-01-07T10:00:00Z", lab_reference: "LAB-R-0003" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { s_est: $.data.id }
          trigger:
            - call: "POST /remedial-investigations/${ri_id}/submission"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err: $.data.error_id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "CHROMIUM_VI", concentration_ug_per_l: 1.111, qa_status: "VALID", collected_at: "2027-01-08T10:00:00Z", lab_reference: "LAB-R-0004" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { s_v1: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "CHROMIUM_VI", concentration_ug_per_l: 4.334, qa_status: "VALID", collected_at: "2027-01-09T10:00:00Z", lab_reference: "LAB-R-0005" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { s_v2: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/submission"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          assert:
            - "the FIRST submission returns HTTP 409 with $.data.error_id == ERR_NO_VALID_SAMPLES; at that moment valid_sample_count == 0 even though three samples exist"
            - "after the first submission RemedialInvestigation.${ri_id}.status == DRAFT and every risk field is still null"
            - "after the two VALID samples are added, RemedialInvestigation.${ri_id}.valid_sample_count == 2 (the SOIL/VALID and GROUNDWATER/REJECTED rows never count)"
            - "the SECOND submission returns HTTP 200 and RemedialInvestigation.${ri_id}.status == UNDER_REVIEW"
            - "RemedialInvestigation.${ri_id}.central_tendency_epc_ug_per_l == 2.723 (mean of 1.111 and 4.334 is exactly 2.7225, half-up at 3 decimals), NOT 2.722"
            - "RemedialInvestigation.${ri_id}.central_tendency_risk == 0.0000136"
            - "RemedialInvestigation.${ri_id}.rme_epc_ug_per_l == 5.0 - the ESTIMATED sample is the maximum of the VALID+ESTIMATED set, so the two variants diverge from one sample set"
            - "RemedialInvestigation.${ri_id}.rme_risk == 0.0000250, which is strictly BELOW ACTION_LEVEL_RISK 0.0001000"
            - "RemedialInvestigation.${ri_id}.hazard_index == 1.00, exactly HAZARD_INDEX_LIMIT, and the limit is inclusive"
            - "RemedialInvestigation.${ri_id}.action_level_exceeded == true, driven only by the hazard limb (a strict > comparison would report false here)"
            - "the REJECTED 900.0 sample is excluded from both sets: had it counted, rme_risk would be 0.0045000 and hazard_index 180.00"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: rod_comment_period_gated_on_the_cited_rifs_status_not_the_rod_status
        grounds:
          - validations[priority=12]
          - errors[ERR_RIFS_NOT_APPROVED]
          - state_machines.RecordOfDecision.DRAFT_to_PUBLIC_COMMENT
          - state_machines.RemedialInvestigation.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.RemedialInvestigation.UNDER_REVIEW_to_APPROVED
          - entities.RecordOfDecision.fields.comment_period_end
        distinguishing_aspect: |
          Entity pair RecordOfDecision x RemedialInvestigation. The ROD sits in DRAFT the whole time and
          the request body never changes; the same call is refused twice and then succeeds purely because
          a DIFFERENT entity walked UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW -> APPROVED.
        test_recipe:
          setup:
            - "Site listed; RI authored by rpm-001 with one VALID GROUNDWATER sample, submitted so it is UNDER_REVIEW."
            - "A ROD in DRAFT citing that RI with comment_period_days 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Ashwood Landfill", epa_region: 6, hrs_score: 52.10 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-AWL-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/remedial-investigations"
              payload: { scope_summary: "OU-1 landfill leachate plume", exposure_medium: "GROUNDWATER" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { ri_id: $.data.id }
            - call: "POST /remedial-investigations/${ri_id}/samples"
              payload: { medium: "GROUNDWATER", contaminant: "VINYL_CHLORIDE", concentration_ug_per_l: 24.0, qa_status: "VALID", collected_at: "2027-01-12T10:00:00Z", lab_reference: "LAB-A-0001" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /remedial-investigations/${ri_id}/submission"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/records-of-decision"
              payload: { remedial_investigation_id: "${ri_id}", proposed_plan_summary: "Cap, gas collection and long-term groundwater monitoring.", comment_period_days: 30 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { rod_id: $.data.id }
          trigger:
            - call: "POST /records-of-decision/${rod_id}/comment-period"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err1: $.data.error_id }
            - call: "POST /remedial-investigations/${ri_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "Delineate the eastern plume boundary." }
              as: RemedialProjectManager
              as_user_id: "rpm-002"
            - call: "POST /records-of-decision/${rod_id}/comment-period"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { err2: $.data.error_id }
            - call: "POST /remedial-investigations/${ri_id}/submission"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /remedial-investigations/${ri_id}/review"
              payload: { decision: "APPROVE" }
              as: RemedialProjectManager
              as_user_id: "rpm-002"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /records-of-decision/${rod_id}/comment-period"
              payload: {}
              as: RemedialProjectManager
              as_user_id: "rpm-001"
          assert:
            - "the first comment-period call returns HTTP 409 with $.data.error_id == ERR_RIFS_NOT_APPROVED (the RI is UNDER_REVIEW)"
            - "the second comment-period call returns HTTP 409 with $.data.error_id == ERR_RIFS_NOT_APPROVED (the RI is now REVISION_REQUESTED - a different foreign state, the same refusal)"
            - "after both refusals RecordOfDecision.${rod_id}.status == DRAFT, comment_period_start == null, comment_period_end == null and version is unchanged from creation"
            - "RemedialInvestigation.${ri_id}.revision_round_count == 1 and status == APPROVED with approved_by_user_id == rpm-002 after the review chain"
            - "the third comment-period call returns HTTP 200 with RecordOfDecision.${rod_id}.status == PUBLIC_COMMENT"
            - "RecordOfDecision.${rod_id}.comment_period_start == 2027-03-01T09:00:00Z and comment_period_end == 2027-03-31T09:00:00Z (start + 30 days)"
            - "RecordOfDecision.${rod_id}.public_comments_count == 0"

      - name: decree_lodging_gated_on_the_sites_allocation_round_reaching_adopted
        grounds:
          - validations[priority=14]
          - errors[ERR_NO_ADOPTED_ALLOCATION]
          - state_machines.ConsentDecree.NEGOTIATING_to_LODGED
          - state_machines.AllocationRound.BALLOTING_to_FAILED
          - state_machines.AllocationRound.BALLOTING_to_ADOPTED
          - entities.Site.fields.adopted_round_id
          - entities.ConsentDecree.fields.public_comment_close_at
        distinguishing_aspect: |
          A DIFFERENT entity pair - ConsentDecree x AllocationRound (mediated by site.adopted_round_id) -
          and a different flavour of dependency: the gate is not "foreign entity in state X" on a single
          row but "the site has SOME round in ADOPTED", so a FAILED round leaves the decree stuck even
          though a round exists, and the decree becomes lodgeable without any write to the decree itself.
        test_recipe:
          setup:
            - "Site listed with two PARTICIPATING parties A 3960 t class II and B 40 t class IV, both VERIFIED (shares 99.28 / 0.72)."
            - "A NEGOTIATING RD_RA_CONSENT_DECREE naming both parties."
            - "Round 1 balloted A REJECT / B ACCEPT, so accept_share_pct is 0.72 and the round is FAILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
