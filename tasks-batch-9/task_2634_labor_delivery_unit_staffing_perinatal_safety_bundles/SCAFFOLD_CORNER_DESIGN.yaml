              captures: { status_t2: $.data.escalation_status, hw_t2: $.data.escalation_tier_high_water }
            - call: POST /fetal-monitoring-assessments/${assess_id}/escalate
              payload: { target_tier: 3 }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { e_category: $.data.error_id }
            - call: POST /labor-encounters/${enc_id}/advance-phase
              payload: { target_phase: "ACTIVE_FIRST_STAGE" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { e_unresolved: $.data.error_id }
            - call: GET /labor-encounters/${enc_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: GET /care-assignments/${ca_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
          assert: |
            Pre-admission timestamp: the first assessment POST is 400 with
            error_id == "ERR_ASSESSMENT_TIMESTAMP_OUT_OF_RANGE" (assessed_at 05:00 precedes
            encounter.admitted_at 06:00) and no FetalMonitoringAssessment row is created.
            Second POST is 201 with escalation_status == "ESCALATION_DUE",
            escalation_due_at == "2026-08-01T06:20:00Z" (assessed_at 06:00 + 20 for CATEGORY_II),
            escalation_tier_high_water == 0, next_tier_due_at == "2026-08-01T06:20:00Z" and
            supersedes_assessment_id == null.
            Resolve before any escalate: 409 with error_id == "ERR_ESCALATION_NOT_STARTED" - NOT
            ERR_INVALID_STATE_TRANSITION, per carve-out (i); the assessment stays ESCALATION_DUE.
            Tier 1 at the BEDSIDE-slot nurse: 422 with error_id == "ERR_ESCALATION_TARGET_INELIGIBLE";
