          assert:
            - "num_hc == 1 and den_hc == 2 — distinct faculty, not credit hours"
            - "ratio_hc == 0.5000 and data.adequacy_status == AT_RISK — 0.5000 >= 0.60 - 0.15 but < 0.60"
            - "data.basis_applied == HEADCOUNT while Program.${prog_cw_id}.adequacy_basis is still CREDIT_HOUR_COVERAGE"
            - "Program.${prog_cw_id}.adequacy_ratio == 0.3333 and adequacy_status == INSUFFICIENT — the override is read-only and persisted nothing"
            - "FacultyRoster.${roster_cw_id}.adequacy_ratio_snapshot == 0.3333 and version unchanged by the read"

