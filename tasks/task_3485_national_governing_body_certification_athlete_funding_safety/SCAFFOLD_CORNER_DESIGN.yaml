scaffold_corner_design:
  - section: entities
    instances:
      - name: create_governing_body_success
        claim_type: creation
        grounds: [entities.GoverningBody, "endpoints[POST /api/governing-bodies]"]
        distinguishing_aspect: "POST with all required fields returns 201 with status APPLIED, version 1, and computed defaults zeroed."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Swim Federation", sport_code: "SWIM", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id, gb_status: $.data.status, gb_v: $.data.version }
          assert:
            - "response 201; GoverningBody.status == APPLIED, version == 1"
            - "computed defaults: committed_monthly_stipend_cents == 0, allocated_science_hours == 0, substantiated_complaint_count == 0, complaint_posture == NORMAL"
            - "certified_at and interim_manager_id are null; id is a server-minted UUID"

      - name: governing_body_not_found_returns_404
        claim_type: not_found
        grounds: ["endpoints[GET /api/governing-bodies/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns the error envelope with ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/governing-bodies/00000000-0000-0000-0000-000000000000"
              as: CommitteeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 and error_id == ERR_NOT_FOUND"

      - name: athlete_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Athlete.fields.team_sport, entities.Athlete.fields.eligibility_status, entities.Athlete.fields.screening_status]
        distinguishing_aspect: "Omitting the optional team_sport applies the false default; both state dimensions initialize to REGISTERED and SCREENING_PENDING."
        test_recipe:
          setup:
            - "one APPLIED GoverningBody exists"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Swim Federation", sport_code: "SWIM", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Sam Blue", date_of_birth: "2002-02-02" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id, a_team: $.data.team_sport, a_elig: $.data.eligibility_status, a_scr: $.data.screening_status }
          assert:
            - "team_sport == false (default applied)"
            - "eligibility_status == REGISTERED and screening_status == SCREENING_PENDING (initial states)"
            - "training_completed_at is null and screening_expires_at is null"

      - name: create_athlete_missing_required_field
        claim_type: required_fields
        grounds: [entities.Athlete.fields.governing_body_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required governing_body_id yields ERR_INVALID_REQUEST (400) before any existence check can run."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/athletes"
              payload: { full_name: "No Body", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_INVALID_REQUEST"

      - name: athlete_creation_with_unknown_body_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.Athlete.fields.governing_body_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body-supplied FK that does not resolve is a 404 existence failure, not a 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/athletes"
              payload: { governing_body_id: "00000000-0000-0000-0000-000000000000", full_name: "Ghost", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404 and error_id == ERR_NOT_FOUND"

      - name: list_athletes_filter_and_pagination
        claim_type: listing
        grounds: ["endpoints[GET /api/athletes]", response_envelope]
        distinguishing_aspect: "The governing_body_id filter narrows the list; limit/offset paginate with total_count and has_more from the fixed envelope."
        test_recipe:
          setup:
            - "two GoverningBodies; body 1 has two athletes, body 2 has one"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Swim Federation", sport_code: "SWIM", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb1: $.data.id }
            - call: "POST /api/governing-bodies"
              payload: { name: "US Judo", sport_code: "JUDO", funding_budget_cents: 3000000, sport_science_pool_hours: 40 }
              as: CommitteeAdmin
              captures: { gb2: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb1}", full_name: "A One", date_of_birth: "1998-01-01" }
              as: CommitteeAdmin
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb1}", full_name: "A Two", date_of_birth: "1998-01-02" }
              as: CommitteeAdmin
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb2}", full_name: "B One", date_of_birth: "1998-02-01" }
              as: CommitteeAdmin
          trigger:
            - call: "GET /api/athletes"
              payload: { governing_body_id: "${gb1}", limit: 1, offset: 0 }
              as: CommitteeAdmin
              captures: { page1: $.data }
          assert:
            - "filtered page 1: data length 1, total_count == 2, has_more == true (filter applied before pagination)"
            - "every returned athlete has governing_body_id == ${gb1}"
            - "envelope exposes limit/offset/total_count/has_more pagination fields"

      - name: create_result_with_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.PerformanceResult, "endpoints[POST /api/athletes/{id}/results]"]
        distinguishing_aspect: "Client-supplied id/status/version in a create body are ignored; the server mints id, sets status SUBMITTED, version 1."
        test_recipe:
          setup:
            - "APPLIED body with one registered athlete"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Swim Federation", sport_code: "SWIM", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Sys Field", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /api/athletes/${a_id}/results"
              payload: { event_name: "Spring Open", event_grade: "B", placing: 5, event_date: "2026-10-01T00:00:00Z", id: "11111111-1111-1111-1111-111111111111", status: "VERIFIED", version: 9 }
              as: Athlete
              as_user_id: "${a_id}"
              captures: { r_id: $.data.id, r_status: $.data.status, r_v: $.data.version }
          assert:
            - "response id != the supplied 11111111-... value (server-minted)"
            - "status == SUBMITTED (supplied VERIFIED ignored) and version == 1 (supplied 9 ignored)"

  - section: state_machines
    instances:
      - name: complaint_initial_state_filed
        claim_type: initial_state
        grounds:
          - state_machines.Complaint
          - endpoints[POST /api/governing-bodies/{id}/complaints]
        distinguishing_aspect: "A newly filed complaint starts in FILED with version 1 and no triage/resolution stamps."
        test_recipe:
          setup: ["one APPLIED GoverningBody"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Judo", sport_code: "JUDO", funding_budget_cents: 3000000, sport_science_pool_hours: 40 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /api/governing-bodies/${gb_id}/complaints"
              payload: { category: "FINANCIAL", severity: "MINOR", description: "Late expense reimbursements" }
              as: CommitteeAdmin
              captures: { c_status: $.data.status, c_v: $.data.version }
          assert:
            - "status == FILED, version == 1, triaged_by_user_id/resolved_by_user_id/resolved_at all null"

      - name: complaint_resolve_from_filed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Complaint
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "FILED -> SUBSTANTIATED is not a defined transition (TRIAGED -> INVESTIGATING must come first); the attempt fails with ERR_INVALID_STATE and no state change."
        test_recipe:
          setup: ["one APPLIED body with one FILED complaint"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Judo", sport_code: "JUDO", funding_budget_cents: 3000000, sport_science_pool_hours: 40 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/complaints"
              payload: { category: "SELECTION", severity: "MAJOR", description: "Selection criteria changed mid-cycle" }
              as: CommitteeAdmin
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /api/complaints/${comp_id}/transitions"
              payload: { to_state: "SUBSTANTIATED" }
              as: CertificationAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "http 409 and error_id == ERR_INVALID_STATE"
            - "complaint remains FILED (no triaged_by_user_id or resolved_at written)"

      - name: decertified_body_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.GoverningBody
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "DECERTIFIED is terminal: any further transition attempt fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["body driven CERTIFIED -> INTERIM_MANAGED (CRITICAL complaint) -> DECERTIFIED"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Canoe", sport_code: "CANO", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "OPEN" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 90, athlete_rep_score: 88, financial_score: 92 }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "CLOSED_PASSED" }
              as: CertificationAuditor
              as_user_id: "aud-2"
            - call: "POST /api/governing-bodies/${gb_id}/complaints"
              payload: { category: "GOVERNANCE", severity: "CRITICAL", description: "Board falsified election results" }
              as: CommitteeAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /api/complaints/${comp_id}/transitions"
              payload: { to_state: "TRIAGED" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/complaints/${comp_id}/transitions"
              payload: { to_state: "INVESTIGATING" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/complaints/${comp_id}/transitions"
              payload: { to_state: "SUBSTANTIATED" }
              as: CertificationAuditor
              as_user_id: "aud-2"
            - call: "POST /api/governing-bodies/${gb_id}/transitions"
              payload: { to_state: "DECERTIFIED" }
              as: CommitteeAdmin
          trigger:
            - call: "POST /api/governing-bodies/${gb_id}/transitions"
              payload: { to_state: "PROBATION" }
              as: CommitteeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 409 and error_id == ERR_ALREADY_TERMINAL"
            - "body remains DECERTIFIED"

      - name: cycle_remediation_reissue_loop
        claim_type: valid_transition
        grounds:
          - state_machines.CertificationCycle.REMEDIATION_to_FINDINGS_ISSUED
          - calculations.compliance_score
        distinguishing_aspect: "The FINDINGS_ISSUED -> REMEDIATION -> FINDINGS_ISSUED revision loop re-issues findings with new component scores and recomputes provisional_score to 75.2."
        test_recipe:
          setup: ["body APPLIED; cycle OPEN with findings 80/70/60 issued (provisional 71.5); moved to REMEDIATION"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Track", sport_code: "ATHL", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "OPEN" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 80, athlete_rep_score: 70, financial_score: 60 }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "REMEDIATION" }
              as: CertificationAuditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 82, athlete_rep_score: 74, financial_score: 66 }
              as: CertificationAuditor
              as_user_id: "aud-1"
              captures: { prov2: $.data.provisional_score, cyc_status: $.data.status }
          assert:
            - "re-issue succeeds (loop allowed): status == FINDINGS_ISSUED again"
            - "provisional_score recomputed == 75.2 (0.40*82 + 0.35*74 + 0.25*66 = 32.8 + 25.9 + 16.5)"

      - name: result_resubmission_loop
        claim_type: valid_transition
        grounds:
          - state_machines.PerformanceResult.REJECTED_to_SUBMITTED
        distinguishing_aspect: "A REJECTED result returns to SUBMITTED via the owning athlete and can then be verified — REJECTED is not terminal."
        test_recipe:
          setup: ["athlete with one SUBMITTED result"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Track", sport_code: "ATHL", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Re Sub", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/results"
              payload: { event_name: "Spring Open", event_grade: "B", placing: 3, event_date: "2026-10-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${a_id}"
              captures: { r_id: $.data.id }
            - call: "POST /api/results/${r_id}/transitions"
              payload: { to_state: "REJECTED" }
              as: ResultsOfficial
              as_user_id: "off-1"
          trigger:
            - call: "POST /api/results/${r_id}/transitions"
              payload: { to_state: "SUBMITTED" }
              as: Athlete
              as_user_id: "${a_id}"
              captures: { st1: $.data.status }
            - call: "POST /api/results/${r_id}/transitions"
              payload: { to_state: "VERIFIED" }
              as: ResultsOfficial
              as_user_id: "off-1"
              captures: { st2: $.data.status, bp: $.data.base_points }
          assert:
            - "resubmission: status SUBMITTED after REJECTED"
            - "second verification: status VERIFIED with base_points == 32.5 (PLACING_POINTS[3]=26 * EVENT_MULTIPLIER_B 1.25)"

      - name: funding_terminated_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FundingAgreement
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A TERMINATED funding agreement rejects every further transition (activation, insurance, re-termination) with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["athlete with an OFFERED agreement (no verified results -> tier NONE), then TERMINATED"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Track", sport_code: "ATHL", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Term Test", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/funding-agreements"
              payload: { coverage_start: "2026-10-01T00:00:00Z", coverage_end: "2027-04-01T00:00:00Z", points_method: "TRAILING_365" }
              as: CommitteeAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/funding-agreements/${ag_id}/transitions"
              payload: { to_state: "TERMINATED" }
              as: CommitteeAdmin
          trigger:
            - call: "POST /api/funding-agreements/${ag_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: CommitteeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 409 and error_id == ERR_ALREADY_TERMINAL"
            - "agreement remains TERMINATED with insurance_status INS_NONE"

      - name: screening_auto_expiry_on_clock
        claim_type: valid_transition
        grounds:
          - state_machines.Athlete
          - endpoints[POST /_clock/set_current_utc]
          - entities.Athlete.fields.screening_expires_at
        distinguishing_aspect: "Advancing the logical clock past screening_expires_at (clearance + 730 days) flips screening to SCREENING_EXPIRED on read while the eligibility dimension stays ELIGIBLE — the auto-transition touches only the screening dimension."
        test_recipe:
          setup: ["ELIGIBLE athlete cleared at the default clock 2026-09-01T00:00:00Z (expires 2028-08-31T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Track", sport_code: "ATHL", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Exp Test", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "SCREENING_CLEARED" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "TRAINING_CURRENT" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: CommitteeAdmin
            - call: "GET /api/athletes/${a_id}"
              as: CommitteeAdmin
              captures: { scr: $.data.screening_status, elig: $.data.eligibility_status }
          assert:
            - "screening_status == SCREENING_EXPIRED after the clock passes screening_expires_at (2026-09-01 + 730 days == 2028-08-31T00:00:00Z)"
            - "eligibility_status remains ELIGIBLE (expiry gates future operations; it does not suspend)"

  - section: calculations
    instances:
      - name: placing_points_constants_applied
        claim_type: constants_applied
        grounds:
          - calculations.funding_points
          - entities.PerformanceResult.fields.base_points
        distinguishing_aspect: "Verification stamps base_points from the pinned constants: placing 3 -> 26, grade B -> x1.25, so 32.5 — not 26 (multiplier forgotten) and not 39 (grade A multiplier)."
        test_recipe:
          setup: ["athlete with one SUBMITTED result (grade B, placing 3)"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Track", sport_code: "ATHL", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Const Check", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/results"
              payload: { event_name: "Spring Open", event_grade: "B", placing: 3, event_date: "2026-10-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${a_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /api/results/${r_id}/transitions"
              payload: { to_state: "VERIFIED" }
              as: ResultsOfficial
              as_user_id: "off-1"
              captures: { bp: $.data.base_points }
          assert:
            - "base_points == 32.5 (26 * 1.25)"

      - name: funding_points_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.funding_points
          - entities.PerformanceResult.fields.status
        distinguishing_aspect: "Only VERIFIED results count: an identical SUBMITTED result and an identical REJECTED result contribute nothing, so trailing_points == 60.0, not 180.0."
        test_recipe:
          setup: ["ELIGIBLE athlete with three identical 1st/A results dated 2026-08-01: one VERIFIED, one left SUBMITTED, one REJECTED"]
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Track", sport_code: "ATHL", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Filter Test", date_of_birth: "2000-01-01" }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "SCREENING_CLEARED" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "TRAINING_CURRENT" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/results"
              payload: { event_name: "Cup 1", event_grade: "A", placing: 1, event_date: "2026-08-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${a_id}"
              captures: { r1: $.data.id }
            - call: "POST /api/results/${r1}/transitions"
              payload: { to_state: "VERIFIED" }
              as: ResultsOfficial
