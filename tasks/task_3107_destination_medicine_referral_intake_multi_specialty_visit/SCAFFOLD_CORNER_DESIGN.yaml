  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_slot_hold
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[slot-hold-stale-case]", errors.ERR_STALE_VERSION]
        distinguishing_aspect: "A slot hold carrying expected_case_version one behind the current VisitCase.version (stale by one prior hold) is rejected deterministically with 412 ERR_STALE_VERSION; the fresh value succeeds."
        test_recipe:
          setup: ["Case FINANCIAL_CLEARED; version observed, one hold succeeds bumping the version."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_slot2
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - *k_deposit
            - *k_case_v1
            - *k_hold1
          trigger:
            - call: "POST /visit-cases/${k_case_id}/slot-holds"
              payload: { appointment_slot_id: "${k_slot2}", visit_type: "IMAGING", listed_price_cents: 200000, sequencing_priority: 2, expected_case_version: "${k_cv1}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412, error_id == ERR_STALE_VERSION (k_cv1 is stale: hold_1 bumped the version)"
            - "AppointmentSlot.${k_slot2}.status remains OPEN"

      - name: occ_current_version_on_slot_hold_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[slot-hold-stale-case]"]
        distinguishing_aspect: "The happy-path twin: re-reading the case and passing the current version lets the second hold succeed, proving the OCC gate accepts fresh versions."
        test_recipe:
          setup: ["Same as occ_stale_version_on_slot_hold through the first hold."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_slot2
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
            - *k_deposit
            - *k_case_v1
            - *k_hold1
            - *k_case_v2
          trigger:
            - call: "POST /visit-cases/${k_case_id}/slot-holds"
              payload: { appointment_slot_id: "${k_slot2}", visit_type: "IMAGING", listed_price_cents: 200000, sequencing_priority: 2, expected_case_version: "${k_cv2}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "HTTP 201; Visit created PENDING; AppointmentSlot.${k_slot2}.status == HELD"
            - "VisitCase.version incremented by 1 relative to the pre-hold read"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.VisitCase, "concurrency_rules[slot-hold-stale-case]"]
        distinguishing_aspect: "VisitCase.version starts at 1 at creation and increments by exactly 1 per mutation (review approval bumps it; a subsequent slot hold bumps it again) — observable via sequential GETs."
        test_recipe:
          setup: ["Case created (version 1), then approved, then one hold."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_slot1
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
          trigger:
            - *k_case_approve
            - call: "GET /visit-cases/${k_case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { v_after_approve: $.data.version }
            - *k_deposit
          assert:
            - "VisitCase.version == 1 at creation"
            - "v_after_approve == 2 (exactly one bump from the APPROVE review)"

      - name: second_opinion_case_completes_without_itinerary
        claim_type: conditional_feature_flags
        grounds: [entities.VisitCase.fields.case_type, state_machines.VisitCase]
        distinguishing_aspect: "SECOND_OPINION cases skip the entire itinerary/financial-deposit path: a single-specialty care team is valid, approval requires no itinerary creation for scheduling, and completion of the remote consult drives the fatigue decrement — behavior flags change the whole pipeline shape."
        test_recipe:
          setup: ["Referral IN_REVIEW; SECOND_OPINION case with a single-specialty care team on a remote-capable service."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
          trigger:
            - call: "POST /visit-cases"
              payload: { referral_id: "${k_ref_dom_id}", case_type: "SECOND_OPINION", care_team_specialty_ids: ["${k_svc_card_id}"] }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { so_case: $.data.id }
          assert:
            - "HTTP 201; VisitCase.case_type == SECOND_OPINION with exactly one care-team specialty accepted"
            - "VisitCase.status == INTAKE"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: deposit_threshold_crossing_is_immediately_visible
        claim_type: immediate consistency
        grounds: [state_machines.FinancialClearance.PENDING_to_CLEARED]
        distinguishing_aspect: "Immediate consistency: the DEPOSIT response that crosses the threshold already reflects the derived state — a same-request follow-up GET shows FinancialClearance.status == CLEARED and VisitCase.status == FINANCIAL_CLEARED with no delay or reconciliation pass."
        test_recipe:
          setup: ["Case approved, clearance PENDING with required_deposit_cents 60000."]
          setup_api_calls:
            - *k_clock
            - *k_svc_card
            - *k_svc_neur
            - *k_ref_dom
            - *k_rec1
            - *k_rec1_verify
            - *k_ref_submit
            - *k_case_create
            - *k_case_approve
          trigger:
            - call: "POST /visit-cases/${k_case_id}/billing-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 60000 }
