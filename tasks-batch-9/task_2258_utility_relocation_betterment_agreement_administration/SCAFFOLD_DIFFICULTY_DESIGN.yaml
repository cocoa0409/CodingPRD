            - { call: "POST /uro/investigations", payload: { project_id: "${p1}", facility_id: "${fa}", quality_level: "QL_A", method: "VACUUM_TEST_HOLE", measured_depth_in: 54, station_at_investigation: 120.0 }, as: UtilityCoordinator, captures: { inv_a: $.data.id, inv_a_flag: $.data.contradicts_record } }
            - { call: "POST /uro/investigations", payload: { project_id: "${p1}", facility_id: "${fb}", quality_level: "QL_A", method: "VACUUM_TEST_HOLE", measured_depth_in: 55, station_at_investigation: 220.0 }, as: UtilityCoordinator, captures: { inv_b: $.data.id, inv_b_flag: $.data.contradicts_record } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fa}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { ca: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fb}", conflict_station: 220.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { cb: $.data.id } }
