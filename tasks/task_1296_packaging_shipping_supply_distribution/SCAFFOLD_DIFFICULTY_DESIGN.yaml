              as_user_id: "${acct}"
            - call: "POST /packaging-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T18:59:00Z" }
              as: PlatformAdmin
            - call: "POST /packaging-distribution/orders/${ord1}/submit"
              payload: {}
              as: Buyer
