        captures:
          prop_ross_v1: $.data.version
      - call: POST /data-research/properties/${prop_ross}/attributes/${att_feed}/proposals
        payload:
          value: Harborline Logistics Inc
          expected_property_version: ${prop_ross_v1}
        as: ResearchAnalyst
