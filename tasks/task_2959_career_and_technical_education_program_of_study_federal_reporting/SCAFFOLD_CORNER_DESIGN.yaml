          setup:
            - "One STATE_APPROVED ProgramOfStudy and one GrantAward for fiscal_year 2027 with allocation_cents 30000000 and admin_cap_cents 1500000."
            - "Four REQUESTED PROFESSIONAL_DEVELOPMENT Expenditures on that grant with quantity 1 and unit_cost_cents 4999999, 1, 14999999 and 1 respectively."
            - "The logical clock stays at 2026-08-01T00:00:00Z, inside the obligation window."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "11.0201", title: "Computer Programming", cluster: "INFORMATION_TECHNOLOGY", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
