              as: StationAdmin
              captures: { drv8_id: $.data.id, drv8_v: $.data.version }
            - call: "POST /station/pledge-drives/${drv8_id}/breaks"
              payload: { starts_at: "2026-08-02T18:00:00Z", ends_at: "2026-08-02T18:20:00Z", program_title: "Evening Pledge", pitch_level_code: "BASIC", expected_drive_version: "${drv8_v}" }
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv8_id}/schedule"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledge-drives/${drv8_id}/go-live"
              payload: {}
              as: StationAdmin
            - call: "POST /station/pledges"
              payload: { donor_id: "${donor8_id}", membership_id: "${mem8_id}", drive_id: "${drv8_id}", channel: "PHONE", kind: "ONE_TIME", amount_cents: 12000, premium_id: "${prem_mug3_id}" }
              as: PhoneVolunteer
              captures: { plg8_id: $.data.id }
            - call: "POST /station/_clock/set_current_utc"
