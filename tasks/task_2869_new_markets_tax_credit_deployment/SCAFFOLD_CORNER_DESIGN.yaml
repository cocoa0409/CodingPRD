            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${ms_tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { ms_qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${la_tract_id}", legal_name: "Bayou Fabrication LLC", state_code: "LA", naics_code: "332710" }
