            - "FairEdition.${ed}.status == REGISTRATION_CLOSED (unchanged)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: booth_slot_point_occupancy_conflict
        grounds:
          - validations[priority=7]
          - errors[ERR_BOOTH_TAKEN]
          - entities.BoothAssignment.fields.booth_number
        distinguishing_aspect: |
          Interval semantics #1 — point occupancy with NO adjacency tolerance: the
          (hall, booth_number) pair is a discrete slot, so any second assignment of
          the same pair conflicts even when the inspection windows do not overlap at
          all. Resource: BoothAssignment slot.
        test_recipe:
          setup:
            - "Edition REGISTRATION_CLOSED; PA CONFIRMED with booth (A,1) window Aug 1–2; PB CONFIRMED requesting same booth (A,1) with a DISJOINT window Aug 3–4"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Occ Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor O", email: "mo@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PA", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { pa: $.data.id }
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PB", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { pb: $.data.id }
            - call: "POST /science-fair/projects/${pa}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/projects/${pb}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${pa}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-02T00:00:00Z" }
              as: OperationsLead
          trigger:
            - call: "POST /science-fair/projects/${pb}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-03T00:00:00Z", inspection_window_end: "2026-08-04T00:00:00Z" }
              as: OperationsLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOOTH_TAKEN (discrete slot occupancy — disjoint windows do not excuse the same (hall, booth_number))"
            - "http status == 422"
      - name: inspection_window_inclusive_boundary_conflict
        grounds:
          - state_machines.Project
          - errors[ERR_OUTSIDE_WINDOW]
          - entities.BoothAssignment.fields.inspection_window_end
        distinguishing_aspect: |
          Interval semantics #2 — closed-interval boundary precision on a different
          resource (the inspection window, not the booth slot): an inspection result
          recorded at exactly inspection_window_end is INSIDE (inclusive boundary),
          while one tick after end is ERR_OUTSIDE_WINDOW. Adjacency/inclusion
          semantics differ from the point-occupancy booth rule.
        test_recipe:
          setup:
            - "Edition REGISTRATION_CLOSED; project P CONFIRMED with booth window [2026-08-05T10:00:00Z, 2026-08-05T12:00:00Z]; logical clock movable"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Win Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "CHEM", name: "Chem", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor W", email: "mw2@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PW", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/booth-assignments"
              payload: { hall: "C", booth_number: 3, inspection_window_start: "2026-08-05T10:00:00Z", inspection_window_end: "2026-08-05T12:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:01Z" }
              as: FairDirector
          trigger:
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
              captures: { err: $.data.error_id }
            - call: "POST /science-fair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
          assert:
            - "at 12:00:01Z the inspection result is rejected with ERR_OUTSIDE_WINDOW"
            - "at exactly 12:00:00Z (window end, inclusive) the result succeeds"
            - "Project.${p}.inspection_status == PASSED"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: judge_load_invariant_assign_recuse
        grounds:
          - state_machines.JudgingAssignment.ASSIGNED_to_RECUSED
          - entities.Judge.fields.active_assignment_count
        distinguishing_aspect: |
          Conserved quantity: Judge.active_assignment_count. Forward action (create
          JudgingAssignment) increments it; the compensating action (recuse) decrements
          it — after assign-then-recuse the judge's load returns to exactly its prior
          value, and a JudgeConflict row is the audit residue.
        test_recipe:
          setup:
            - "Edition in JUDGING; ACTIVE judge J (max 5, load 0); CONFIRMED+PASSED project P"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Inv1 Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor I", email: "mi@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PI", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/fair-editions/${ed}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JI", max_assignments: 5 }
              as: FairDirector
              captures: { j: $.data.id }
            - call: "POST /science-fair/judges/${j}/activate"
              payload: {}
              as: FairDirector
          trigger:
            - call: "POST /science-fair/projects/${p}/judging-assignments"
              payload: { judge_id: "${j}" }
              as: FairDirector
              captures: { asg: $.data.id }
            - call: "GET /science-fair/judges/${j}"
              payload: {}
              as: FairDirector
              captures: { load_mid: $.data.active_assignment_count }
            - call: "POST /science-fair/judging-assignments/${asg}/recuse"
              payload: {}
              as: Judge
              as_user_id: "${j}"
          assert:
            - "after assign: Judge.${j}.active_assignment_count == 1"
            - "after recuse (compensating action): Judge.${j}.active_assignment_count == 0 (invariant restored)"
            - "JudgingAssignment.${asg}.status == RECUSED"
            - "a JudgeConflict row exists for (${j}, ${p}) via GET /science-fair/judges/${j}/conflicts"
            - "Project.${p}.judging_status == UNASSIGNED (zero remaining ASSIGNED)"
      - name: scholarship_pool_invariant_confer_revoke
        grounds:
          - calculations.scholarship_waterfall
          - entities.ScholarshipPool.fields.remaining_cents
          - state_machines.Award
        distinguishing_aspect: |
          Different conserved quantity: ScholarshipPool cents. The waterfall conserves
          total_cents == remaining_cents + sum(CONFERRED scholarship_amount_cents);
          revoking a PROPOSED award before finalize leaves the pool untouched (no
          confer, no debit), so pool invariants hold across the propose/revoke pair.
          Distinct quantity (money) from instance 1's judge load.
        test_recipe:
          setup:
            - "Edition in JUDGING with project P1; ScholarshipPool total 300000; one PROPOSED award (CATEGORY_FIRST)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Inv2 Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "CHEM", name: "Chem", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor V2", email: "mv2@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "PV2", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/booth-assignments"
              payload: { hall: "A", booth_number: 1, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "PASS" }
              as: SafetyInspector
            - call: "POST /science-fair/fair-editions/${ed}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/scholarship-pools"
              payload: { fair_edition_id: "${ed}", total_cents: 300000 }
              as: FairDirector
              captures: { pool: $.data.id }
            - call: "POST /science-fair/awards"
              payload: { fair_edition_id: "${ed}", project_id: "${p}", award_type: "CATEGORY_FIRST" }
              as: FairDirector
              captures: { aw: $.data.id }
          trigger:
            - call: "POST /science-fair/awards/${aw}/revoke"
              payload: {}
              as: FairDirector
            - call: "GET /science-fair/scholarship-pools/${pool}"
              payload: {}
              as: FairDirector
              captures: { rem: $.data.remaining_cents }
          assert:
            - "Award.${aw}.status == REVOKED"
            - "ScholarshipPool.${pool}.remaining_cents == 300000 (propose+revoke pair conserves the pool: nothing was conferred, nothing debited)"
            - "ScholarshipPool.${pool}.total_cents == 300000"
