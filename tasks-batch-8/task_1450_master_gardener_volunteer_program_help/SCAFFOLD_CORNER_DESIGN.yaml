      - name: entry_validation_and_state_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENTRY_NOT_APPROVED]", "errors[ERR_ACTIVITY_OUTSIDE_CYCLE_WINDOW]", "errors[ERR_MISSING_KIND_FIELDS]"]
