            - "after the fifth: deduction_points_total == 32.50 and performance_score == 67.50"
            - "after the fifth: performance_tier == PROBATION"
            - "after the fifth: Supplier.${sup_a_id}.qualification_status == SUSPENDED"
            - "after the fifth: Supplier.${sup_a_id}.substantiated_complaint_count == 5"
            - "after the fifth: MasterContract.${mc_id}.status == SUSPENDED"
            - "after the fifth: PiggybackAnalysis.${pb_rv_id}.status == VOIDED with voided_reason == CONTRACT_SUSPENDED"
      - name: cross_cutting_cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / usage_retraction_cascades_into_report_resweep_and_ledger_restatement
          rationale: >-
            That SS1.8 instance asserts a three-hop cascade whose middle hop recomputes an aggregate rather than subtracting a delta, which is the sharpest available form of the cascading_side_effects layer claim.
      - name: cross_cutting_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / admin_fee_reported_versus_audited_tier_rebate_divergence
          rationale: >-
            That SS1.8 instance runs both fee variants over the identical usage set and asserts each variant result plus the reconciling true-up, which is the dual_variant_calculation layer claim.

  # =====================================================================================
  # SECTION CONSISTENCY MODEL
  # =====================================================================================
  - section: Consistency Model
    instances:
      - name: every_write_is_immediately_visible_to_the_next_read_with_no_settling_period
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - entities.MemberAgency.fields.committed_spend_cents
          - entities.MasterContract.fields.usage_chargeable_cents_total
          - endpoints.POST_/coop/contract-usages
          - endpoints.GET_/coop/contract-usages
        distinguishing_aspect: >-
          The scaffold declares an immediate consistency model, so the ledger figures a usage writes on its parents are already correct in the very next request with no sweep, job or retry in between: the create response body itself carries the computed totals, and the member, the contract and the list route all agree with it on the first read.
        test_recipe:
          setup:
            - "MasterContract COOP-MC-2026-001 is ACTIVE with line JAN-DISP-500 at 12500 cents and usage_chargeable_cents_total 0."
            - "Member Riverside (CA) is ACTIVE with a DETERMINED / CONDITIONAL analysis and committed_spend_cents 0."
            - "The logical clock reads 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CoopAdministrator
