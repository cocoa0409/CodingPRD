              as: MasterPolicyAdmin
              captures: { servicer_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications"
              payload: { lender_id: "${lender_id}", master_policy_id: "${mp_id}", rate_card_id: "${rc_id}", borrower_reference: "RELIEF-1", loan_amount_cents: 34000000, property_value_cents: 40000000, credit_grade: "B", coverage_percent: 25, premium_plan: "BPM", borrower_paid: true, financed_premium: false, borrower_reserves_months: 6, county_code: "06037", term_months: 360 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { app_id: $.data.id }
            - call: "POST /mortgage-insurance/coverage-applications/${app_id}/delegated-approve"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
            - call: "POST /mortgage-insurance/loans"
              payload: { application_id: "${app_id}", servicer_id: "${servicer_id}", reinsurance_treaty_id: "TREATY-NONE" }
              as: MasterPolicyAdmin
