# =============================================================================
# PRD Benchmark Seed Tables — task_3061
# Cross-Product Member Benefit Bundling & Rate Discount Entitlement (SoFi)
#
# Archetype: pricing_engine (primary) + compliance_audit (secondary)
# =============================================================================

scenario: |
  Cross-Product Member Benefit Bundling & Rate Discount Entitlement (SoFi): member
  status granted at first product adoption unlocking benefits across lending, banking,
  investing and career services, direct deposit qualification unlocking higher deposit
  rates and loan rate discounts with periodic requalification, autopay and member
  discounts stacking rules on loan pricing, cross-sell eligibility checks that avoid
  re-underwriting where prohibited, member events, career coaching and rewards points
  earned and redeemed against loan principal, product-level compliance boundaries
  preventing conditioning credit on other product purchases, churn detection when
  direct deposit stops with rate step-down notices, benefit entitlement reconciliation
  across product systems

domain_name: member-benefit-bundling
api_prefix: /benefits

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: eventual

  entity_count: 12
  state_machine_count: 11
  difficulty_instance_count: 18
  corner_instance_count: 60
  calculation_count: 16
  validation_layer_count: 32
  endpoint_count: 77
  error_code_count: 32
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities, flat topology)
# =============================================================================
entities:

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_number, type: string, source: input, description: "Client-facing member number, unique across the platform" }
      - { name: full_name, type: string, source: input, description: "Legal name of the member" }
      - { name: email, type: string, source: input, description: "Contact email; unique within the platform" }
      - { name: member_status, type: enum, source: system, description: "PROSPECT | MEMBER_ACTIVE | MEMBER_AT_RISK | MEMBER_LAPSED", default: PROSPECT }
      - { name: member_since_at, type: datetime, source: system, description: "Timestamp of first product adoption; null while PROSPECT" }
      - { name: product_adoption_count, type: integer, source: computed, description: "Count of ProductHolding rows whose adoption_status == ADOPTED", }
      - { name: product_line_set, type: array, source: computed, description: "Distinct product_line values among ADOPTED ProductHolding rows, sorted ascending" }
      - { name: member_tier, type: enum, source: computed, description: "NONE | BASE | PLUS | PREMIER, derived by calculations.member_tier" }
      - { name: qualifying_deposit_balance_cents, type: integer, source: computed, description: "Sum of balance_cents over ProductHolding rows with product_line == BANKING and adoption_status == ADOPTED" }
      - { name: benefit_entitlement_state, type: enum, source: computed, description: "NONE | FULL | PARTIAL | SUSPENDED, derived by calculations.benefit_entitlement_reconciliation" }
      - { name: rewards_points_balance, type: integer, source: computed, description: "Non-negative sum of points_delta over RewardsLedgerEntry rows whose entry_status == POSTED" }
      - { name: churn_risk_score, type: integer, source: computed, description: "0..100, derived by calculations.churn_risk_score" }
      - { name: last_qualifying_deposit_at, type: datetime, source: computed, description: "Max posted_at over qualifying deposits; null when none has ever posted" }

  - name: ProductHolding
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member who holds this product" }
      - { name: product_line, type: enum, source: input, description: "LENDING | BANKING | INVESTING | CAREER" }
      - { name: adoption_status, type: enum, source: system, description: "PENDING | ADOPTED | SUSPENDED | CLOSED", default: PENDING }
      - { name: adopted_at, type: datetime, source: system, description: "Stamped when adoption_status first becomes ADOPTED; null before" }
      - { name: closed_at, type: datetime, source: system, description: "Stamped when adoption_status becomes CLOSED; null before" }
      - { name: balance_cents, type: integer, source: input, description: "Held balance for the line (deposit balance, invested value, or outstanding principal)", default: 0 }
      - { name: deposit_rate_eligible, type: boolean, source: computed, description: "True when product_line == BANKING and adoption_status == ADOPTED and the member's DirectDepositEnrollment.status == ACTIVE" }
      - { name: cross_sell_eligible, type: boolean, source: computed, description: "True when adoption_status in {ADOPTED, SUSPENDED} and the latest CrossSellCheck for this member has status == CLEARED" }
      - { name: reunderwriting_permitted, type: boolean, source: computed, description: "True when product_line == LENDING and adoption_status == ADOPTED and a FINAL-priced LoanAccount exists for this holding" }

  - name: LoanAccount
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of the loan account" }
      - { name: holding_id, type: string, source: input, description: "FK -> ProductHolding.id; the LENDING holding this loan prices against" }
      - { name: loan_type, type: enum, source: input, description: "PERSONAL | STUDENT | AUTO | REFINANCE" }
      - { name: principal_cents, type: integer, source: input, description: "Outstanding principal in cents" }
      - { name: base_apr_bps, type: integer, source: input, description: "Undiscounted APR in basis points (100 bps = 1.00%)" }
      - { name: autopay_status, type: enum, source: system, description: "NOT_ENROLLED | ENROLLED | SUSPENDED", default: NOT_ENROLLED }
      - { name: pricing_status, type: enum, source: system, description: "PROVISIONAL | FINAL | STEPPED_DOWN", default: PROVISIONAL }
      - { name: discount_stack_bps, type: integer, source: computed, description: "Capped sum of applied discount basis points, derived by calculations.discount_stack_total_bps" }
      - { name: effective_apr_bps, type: integer, source: computed, description: "Derived by calculations.loan_effective_apr_bps; never below APR_FLOOR_BPS" }
      - { name: last_priced_at, type: datetime, source: system, description: "Timestamp of the most recent repricing of this loan" }

  - name: DirectDepositEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member whose payroll is enrolled" }
      - { name: required_monthly_amount_cents, type: integer, source: input, description: "Minimum posted deposit amount for a month to count as qualifying" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | GRACE | LAPSED", default: PENDING_VERIFICATION }
      - { name: qualified_at, type: datetime, source: system, description: "Stamped when status first becomes ACTIVE; null before" }
      - { name: last_deposit_at, type: datetime, source: system, description: "posted_at of the most recent posted deposit of any amount; null before any deposit" }
      - { name: consecutive_qualifying_months, type: integer, source: computed, description: "Count of trailing months, ending at the current logical month, whose postings each met required_monthly_amount_cents" }
      - { name: requalification_due_at, type: datetime, source: computed, description: "First instant of the third logical month after qualified_at" }
      - { name: grace_deadline_at, type: datetime, source: system, description: "Set when status becomes GRACE; first instant 30 days after the last qualifying month ended" }
      - { name: missed_cycle_count, type: integer, source: computed, description: "Count of completed logical months since qualified_at with no qualifying posting" }

  - name: BenefitEntitlement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member entitled to the benefit" }
      - { name: source_holding_id, type: string, source: input, description: "FK -> ProductHolding.id; the holding whose adoption unlocked this benefit" }
      - { name: benefit_code, type: enum, source: input, description: "LOAN_RATE_DISCOUNT | DIRECT_DEPOSIT | CAREER_COACHING_CREDIT | INVESTING_FEE_WAIVER | REWARDS_MULTIPLIER" }
      - { name: entitlement_status, type: enum, source: system, description: "PENDING | GRANTED | PENDING_REQUALIFICATION | STEPPED_DOWN | REVOKED", default: PENDING }
      - { name: value_bps, type: integer, source: input, description: "Benefit magnitude in basis points for rate benefits; in points for REWARDS_MULTIPLIER" }
      - { name: governing_rule_id, type: string, source: input, description: "FK -> RateDiscountRule.id; the rule whose discount this entitlement unlocks. When the entitlement is revoked, every DiscountApplication on this member's loans whose rule_id equals governing_rule_id is rolled back. Null for benefits that price no rate discount, such as CAREER_COACHING_CREDIT and REWARDS_MULTIPLIER." }
      - { name: granted_at, type: datetime, source: system, description: "Stamped on each transition into GRANTED; null while never granted" }
      - { name: stepped_down_at, type: datetime, source: system, description: "Stamped on each transition into STEPPED_DOWN; null otherwise" }
      - { name: reconciliation_state, type: enum, source: computed, description: "IN_SYNC | DRIFT_REPORTED | RECONCILED, derived by calculations.benefit_entitlement_reconciliation" }
      - { name: override_requested_by, type: string, source: system, description: "X-User-ID of the BenefitsAdmin who queued an override; null when no override is queued" }
      - { name: override_approved_by, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who approved the override; must differ from override_requested_by" }

  - name: RateDiscountRule
    parent: null
    common_fields: true
    fields:
      - { name: rule_code, type: string, source: input, description: "Stable human-readable rule code; unique across all rules regardless of status" }
      - { name: discount_kind, type: enum, source: input, description: "MEMBER_TIER | DIRECT_DEPOSIT | AUTOPAY | PROMOTIONAL | CAREER_SERVICES" }
      - { name: stacking_class, type: enum, source: input, description: "BASE | ADDITIVE | CAP_CONTRIBUTING" }
      - { name: discount_bps, type: integer, source: input, description: "Magnitude of the discount in basis points" }
      - { name: stacks_on_rule_id, type: string, source: input, description: "FK -> RateDiscountRule.id; the rule this rule stacks on top of, or null for a stack root" }
      - { name: requires_direct_deposit, type: boolean, source: input, description: "When true the rule only prices while the member's enrollment status is ACTIVE", default: false }
      - { name: min_member_tier, type: enum, source: input, description: "NONE | BASE | PLUS | PREMIER — lowest member tier at which the rule may price", default: NONE }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the rule's validity window" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the rule's validity window" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED", default: DRAFT }

  - name: DiscountApplication
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id; the loan being discounted" }
      - { name: rule_id, type: string, source: input, description: "FK -> RateDiscountRule.id; the rule applied to the loan" }
      - { name: applied_bps, type: integer, source: system, description: "Snapshot of rule.discount_bps at application time" }
      - { name: application_state, type: enum, source: system, description: "APPLIED | PREEMPTED | ROLLED_BACK", default: APPLIED }
      - { name: applied_at, type: datetime, source: system, description: "Timestamp of the application" }
      - { name: window_from, type: datetime, source: system, description: "Snapshot of rule.effective_from at application time" }
      - { name: window_to, type: datetime, source: system, description: "Snapshot of rule.effective_to at application time" }
      - { name: preempted_by_application_id, type: string, source: system, description: "Id of the DiscountApplication that preempted this one; null unless application_state == PREEMPTED" }

  - name: RewardsLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the account holder the entry belongs to" }
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id; required when entry_type is REDEEM_PRINCIPAL, null otherwise" }
      - { name: entry_type, type: enum, source: input, description: "EARN | REDEEM_PRINCIPAL | REVERSE | ADJUST" }
      - { name: points_delta, type: integer, source: input, description: "Signed points change; positive for EARN/ADJUST-up, negative for REDEEM_PRINCIPAL/REVERSE" }
      - { name: principal_reduction_cents, type: integer, source: computed, description: "Derived by calculations.rewards_principal_reduction_cents; nonzero only for REDEEM_PRINCIPAL" }
      - { name: entry_status, type: enum, source: system, description: "POSTED | REVERSED", default: POSTED }
      - { name: source_event_code, type: string, source: input, description: "Free-form provenance tag for the earning or redemption event" }
      - { name: reversed_by_entry_id, type: string, source: system, description: "Id of the REVERSE entry that undid this entry; null unless entry_status == REVERSED" }

  - name: RequalificationCycle
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member being requalified" }
      - { name: cycle_index, type: integer, source: computed, description: "1-based ordinal of this cycle within the member's cycle history, by opened_at ascending" }
      - { name: opened_at, type: datetime, source: system, description: "Inclusive start of the evaluation window" }
      - { name: due_at, type: datetime, source: system, description: "Exclusive end of the evaluation window" }
      - { name: evaluated_at, type: datetime, source: system, description: "Stamped when the cycle is evaluated; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | PASSED | FAILED | REMEDIATION | CLOSED", default: OPEN }
      - { name: qualifying_month_count, type: integer, source: computed, description: "Count of logical months inside the window with at least one qualifying posting" }
      - { name: qualifying_deposit_total_cents, type: integer, source: computed, description: "Sum of posted deposit amounts inside the window that met required_monthly_amount_cents" }

  - name: ChurnNotice
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member the notice concerns" }
      - { name: notice_type, type: enum, source: input, description: "RATE_STEP_DOWN | RATE_STEP_UP | REQUALIFICATION_REMINDER | BENEFIT_REVOCATION" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | ACKNOWLEDGED | VOIDED", default: QUEUED }
      - { name: issued_at, type: datetime, source: system, description: "Stamped at creation" }
      - { name: effective_at, type: datetime, source: system, description: "Instant the rate change takes effect; stamped at creation" }
      - { name: related_entitlement_id, type: string, source: system, description: "BenefitEntitlement.id whose step-down or revocation prompted this notice; null for reminders" }
      - { name: reason_code, type: string, source: input, description: "Machine-readable reason tag, e.g. DEPOSIT_STOPPED or TIER_DOWNGRADE" }

  - name: CoachingSession
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member attending" }
      - { name: coach_ref, type: string, source: input, description: "Opaque identifier of the career coach or event host whose calendar this session occupies" }
      - { name: session_kind, type: enum, source: input, description: "CAREER_COACHING | MEMBER_EVENT" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive start of the session interval" }
      - { name: ends_at, type: datetime, source: input, description: "Inclusive end of the session interval" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: capacity_total, type: integer, source: input, description: "Seat count of the session; 1 for one-to-one coaching", default: 1 }
      - { name: seats_reserved, type: integer, source: computed, description: "Count of non-CANCELLED CoachingSession rows sharing this member's event key" }

  - name: CrossSellCheck
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member being checked" }
      - { name: target_product_line, type: enum, source: input, description: "LENDING | BANKING | INVESTING | CAREER — the line the member is being offered" }
      - { name: consent_recorded, type: boolean, source: input, description: "True when the member affirmatively consented to the cross-sell contact", default: false }
      - { name: underwriting_reuse_permitted, type: boolean, source: computed, description: "True when an ADOPTED LENDING holding with a FINAL-priced LoanAccount lets the platform reuse underwriting" }
      - { name: conditioning_blocked, type: boolean, source: computed, description: "True when target_product_line in {BANKING, INVESTING} and consent_recorded is false — credit may not be conditioned on the purchase" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | BLOCKED | REUSE_PROHIBITED", default: PENDING }
      - { name: decided_at, type: datetime, source: system, description: "Stamped when the check leaves PENDING" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding ComplianceOfficer" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Member -------------------------------------------------------------
  - entity: Member
    field: member_status
    initial_state: PROSPECT
    terminal_states: []
    note: "Cyclic — a lapsed member can be re-adopted at any time, and the at-risk state reverts on requalification."
    transitions:
      - from: PROSPECT
        to: MEMBER_ACTIVE
        trigger: "system (side effect of POST /holdings/{holding_id}/adopt when this is the member's first adoption)"
        actor: system
        preconditions:
          - "Member.member_since_at IS NULL"
          - "At least one ProductHolding of this member has adoption_status == ADOPTED"
        side_effects:
          - "Member.member_since_at = logical clock now"
          - "Member.product_adoption_count recomputed (calculations.product_adoption_count)"
          - "Member.product_line_set recomputed (calculations.product_line_set)"
          - "Member.member_tier recomputed (calculations.member_tier, variant point_in_time)"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"

      - from: MEMBER_ACTIVE
        to: MEMBER_AT_RISK
        trigger: "POST /members/{member_id}/detect-churn"
        actor: PlatformAdmin
        preconditions:
          - "Member.churn_risk_score >= CHURN_AT_RISK_SCORE (60)"
        side_effects:
          - "Member.member_status = MEMBER_AT_RISK"
          - "A ChurnNotice with notice_type = RATE_STEP_DOWN, status = QUEUED, reason_code = DEPOSIT_STOPPED is created"

      - from: MEMBER_AT_RISK
        to: MEMBER_ACTIVE
        trigger: "system (side effect of POST /deposit-enrollments/{enrollment_id}/activate or POST /requalification-cycles/{cycle_id}/evaluate with outcome PASSED)"
        actor: system
        preconditions:
          - "Member.churn_risk_score < CHURN_AT_RISK_SCORE (60)"
        side_effects:
          - "Member.member_status = MEMBER_ACTIVE"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"
          - "Any ChurnNotice of this member in status QUEUED with notice_type = RATE_STEP_DOWN is VOIDED"

      - from: MEMBER_AT_RISK
        to: MEMBER_LAPSED
        trigger: "POST /members/{member_id}/detect-churn"
        actor: PlatformAdmin
        preconditions:
          - "Member.churn_risk_score >= CHURN_LAPSE_SCORE (85)"
        side_effects:
          - "Member.member_status = MEMBER_LAPSED"
          - "Member.benefit_entitlement_state = SUSPENDED (calculations.benefit_entitlement_reconciliation)"
          - "Every BenefitEntitlement of this member with entitlement_status IN {GRANTED, PENDING_REQUALIFICATION} → STEPPED_DOWN; stepped_down_at stamped"

      - from: MEMBER_ACTIVE
        to: MEMBER_LAPSED
        trigger: "POST /members/{member_id}/detect-churn (a member whose deposits stop and whose tier collapses can cross the lapse band directly from MEMBER_ACTIVE)"
        actor: PlatformAdmin
        preconditions:
          - "Member.churn_risk_score >= CHURN_LAPSE_SCORE (85)"
        side_effects:
          - "Member.member_status = MEMBER_LAPSED"
          - "Member.benefit_entitlement_state = SUSPENDED (calculations.benefit_entitlement_reconciliation)"
          - "Every BenefitEntitlement of this member with entitlement_status IN {GRANTED, PENDING_REQUALIFICATION} → STEPPED_DOWN; stepped_down_at stamped"

      - from: MEMBER_LAPSED
        to: MEMBER_ACTIVE
        trigger: "POST /members/{member_id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Member.product_adoption_count >= REINSTATEMENT_MIN_PRODUCTS (1)"
        side_effects:
          - "Member.member_status = MEMBER_ACTIVE"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"

      - from: MEMBER_LAPSED
        to: PROSPECT
        trigger: "POST /members/{member_id}/reset-to-prospect"
        actor: PlatformAdmin
        preconditions:
          - "Member.product_adoption_count == 0"
        side_effects:
          - "Member.member_since_at = null"
          - "Member.member_tier = NONE (calculations.member_tier)"

  # --- ProductHolding -----------------------------------------------------
  - entity: ProductHolding
    field: adoption_status
    initial_state: PENDING
    terminal_states: [CLOSED]
    note: "Cyclic — SUSPENDED can be re-adopted; CLOSED is the only terminal state."
    transitions:
      - from: PENDING
        to: ADOPTED
        trigger: "POST /holdings/{holding_id}/adopt"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals ProductHolding.member_id"
          - "ProductHolding.adoption_status == PENDING"
        side_effects:
          - "ProductHolding.adopted_at = logical clock now"
          - "Member.product_adoption_count recomputed (calculations.product_adoption_count)"
          - "Member.product_line_set recomputed (calculations.product_line_set)"
          - "Member.member_tier recomputed (calculations.member_tier, variant point_in_time)"
          - "Member.member_status PROSPECT → MEMBER_ACTIVE when this is the first ADOPTED holding (sec.1.2 Member machine)"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"
          - "BenefitEntitlement rows with entitlement_status == PENDING and source_holding_id == this holding → GRANTED (sec.1.2 BenefitEntitlement machine)"

      - from: ADOPTED
        to: SUSPENDED
        trigger: "POST /holdings/{holding_id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "ProductHolding.adoption_status == ADOPTED"
        side_effects:
          - "ProductHolding.deposit_rate_eligible recomputed to false (calculations.deposit_rate_eligible)"
          - "Member.qualifying_deposit_balance_cents recomputed"
          - "Member.product_adoption_count recomputed (calculations.product_adoption_count)"
          - "Every BenefitEntitlement of this member with source_holding_id == this holding and entitlement_status IN {GRANTED, PENDING_REQUALIFICATION} → PENDING_REQUALIFICATION"

      - from: SUSPENDED
        to: ADOPTED
        trigger: "POST /holdings/{holding_id}/adopt"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals ProductHolding.member_id"
          - "ProductHolding.adoption_status == SUSPENDED"
        side_effects:
          - "ProductHolding.adopted_at refreshed to logical clock now"
          - "ProductHolding.deposit_rate_eligible recomputed (calculations.deposit_rate_eligible)"
          - "Member.product_adoption_count recomputed (calculations.product_adoption_count)"
          - "Member.member_tier recomputed (calculations.member_tier, variant point_in_time)"

      - from: [ADOPTED, SUSPENDED]
        to: CLOSED
        trigger: "POST /holdings/{holding_id}/close"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals ProductHolding.member_id"
          - "Holding.balance_cents == 0"
          - "No LoanAccount referencing this holding has pricing_status IN {PROVISIONAL, FINAL}"
        side_effects:
          - "ProductHolding.closed_at = logical clock now"
          - "Member.qualifying_deposit_balance_cents recomputed"
          - "Member.product_adoption_count recomputed (calculations.product_adoption_count)"
          - "Member.product_line_set recomputed (calculations.product_line_set)"
          - "Member.member_tier recomputed (calculations.member_tier, variant point_in_time)"
          - "Every BenefitEntitlement of this member with source_holding_id == this holding and entitlement_status IN {GRANTED, PENDING_REQUALIFICATION} → REVOKED"

  # --- DirectDepositEnrollment --------------------------------------------
  - entity: DirectDepositEnrollment
    field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    note: "Cyclic — LAPSED can be re-activated after a fresh qualifying posting."
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /deposit-enrollments/{enrollment_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "At least one DepositPosting for this enrollment has amount_cents >= required_monthly_amount_cents and posting_status == POSTED"
        side_effects:
          - "DirectDepositEnrollment.qualified_at = logical clock now"
          - "DirectDepositEnrollment.requalification_due_at recomputed (calculations.requalification_due_at)"
          - "DirectDepositEnrollment.consecutive_qualifying_months recomputed (calculations.consecutive_qualifying_months)"
          - "Every BenefitEntitlement of this member with benefit_code == DIRECT_DEPOSIT and entitlement_status IN {PENDING, PENDING_REQUALIFICATION, STEPPED_DOWN} → GRANTED, value_bps reset to the rule's full magnitude, granted_at stamped"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "Each BenefitEntitlement.source_holding_id holding with product_line == BANKING → deposit_rate_eligible recomputed to true (calculations.deposit_rate_eligible)"
          - "Member.qualifying_deposit_balance_cents recomputed"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"

      - from: ACTIVE
        to: GRACE
        trigger: "POST /deposit-enrollments/{enrollment_id}/lapse"
        actor: PlatformAdmin
        preconditions:
          - "DirectDepositEnrollment.status == ACTIVE"
          - "DirectDepositEnrollment.missed_cycle_count >= DEPOSIT_GRACE_MISSED_CYCLES (1)"
        side_effects:
          - "DirectDepositEnrollment.grace_deadline_at = first instant of the month following the earliest missed month, plus GRACE_PERIOD_DAYS (30) days"
          - "Every BenefitEntitlement of this member with benefit_code == DIRECT_DEPOSIT and entitlement_status IN {GRANTED, PENDING_REQUALIFICATION} → PENDING_REQUALIFICATION; a ChurnNotice with notice_type = REQUALIFICATION_REMINDER, status = QUEUED, reason_code = DEPOSIT_STOPPED is created"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"

      - from: GRACE
        to: ACTIVE
        trigger: "system (side effect of POST /members/{member_id}/deposits when the posted amount meets required_monthly_amount_cents and logical clock is < grace_deadline_at)"
        actor: system
        preconditions:
          - "DirectDepositEnrollment.status == GRACE"
          - "logical clock now < DirectDepositEnrollment.grace_deadline_at"
        side_effects:
          - "DirectDepositEnrollment.missed_cycle_count reset to 0"
          - "DirectDepositEnrollment.consecutive_qualifying_months recomputed (calculations.consecutive_qualifying_months)"
          - "Every BenefitEntitlement of this member with benefit_code == DIRECT_DEPOSIT and entitlement_status == PENDING_REQUALIFICATION → GRANTED; granted_at stamped"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"
          - "Any ChurnNotice of this member in status QUEUED with notice_type = RATE_STEP_DOWN is VOIDED"
          - "A ChurnNotice with notice_type = RATE_STEP_UP, status = QUEUED, reason_code = DEPOSIT_RESUMED is created"

      - from: GRACE
        to: LAPSED
        trigger: "POST /deposit-enrollments/{enrollment_id}/lapse"
        actor: PlatformAdmin
        preconditions:
          - "DirectDepositEnrollment.status == GRACE"
          - "logical clock now >= DirectDepositEnrollment.grace_deadline_at"
        side_effects:
          - "DirectDepositEnrollment.status = LAPSED"
          - "Every BenefitEntitlement of this member with benefit_code == DIRECT_DEPOSIT and entitlement_status IN {GRANTED, PENDING_REQUALIFICATION} → STEPPED_DOWN with value_bps = max(0, value_bps - DEPOSIT_STEP_DOWN_BPS); stepped_down_at stamped. This rule references DEPOSIT_STEP_DOWN_BPS, a §1.3 constant declared on calculations.deposit_rate_boost_bps, whose constants are inherited per product line."
          - "Each such BenefitEntitlement.source_holding_id holding with product_line == BANKING → deposit_rate_eligible recomputed to false (calculations.deposit_rate_eligible)"
          - "Member.qualifying_deposit_balance_cents recomputed"
          - "Every LoanAccount of this member with pricing_status IN {PROVISIONAL, FINAL} is repriced: each DiscountApplication whose rule requires_direct_deposit == true and application_state == APPLIED → ROLLED_BACK; discount_stack_bps recomputed (calculations.discount_stack_total_bps); effective_apr_bps recomputed (calculations.loan_effective_apr_bps); pricing_status FINAL → STEPPED_DOWN; last_priced_at refreshed"
          - "A ChurnNotice with notice_type = RATE_STEP_DOWN, status = QUEUED, reason_code = DEPOSIT_STOPPED, related_entitlement_id = the stepped-down DIRECT_DEPOSIT entitlement is created"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"
          - "Member.member_status recomputed via the Member machine (MEMBER_ACTIVE → MEMBER_AT_RISK when churn_risk_score >= 60)"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /deposit-enrollments/{enrollment_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "At least one DepositPosting for this enrollment posted after the retry window opened has amount_cents >= required_monthly_amount_cents and posting_status == POSTED"
        side_effects:
          - "DirectDepositEnrollment.qualified_at refreshed to logical clock now"
          - "DirectDepositEnrollment.missed_cycle_count reset to 0"
          - "Every BenefitEntitlement of this member with benefit_code == DIRECT_DEPOSIT and entitlement_status IN {PENDING, PENDING_REQUALIFICATION, STEPPED_DOWN} → GRANTED; granted_at stamped"
          - "Any ChurnNotice of this member in status QUEUED with notice_type = RATE_STEP_DOWN is VOIDED, and a ChurnNotice with notice_type = RATE_STEP_UP, status = QUEUED, reason_code = DEPOSIT_RESUMED is created"

  # --- BenefitEntitlement -------------------------------------------------
  - entity: BenefitEntitlement
    field: entitlement_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    note: "Cyclic — STEPPED_DOWN and PENDING_REQUALIFICATION both revert to GRANTED."
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "system (side effect of POST /holdings/{holding_id}/adopt or POST /deposit-enrollments/{enrollment_id}/activate)"
        actor: system
        preconditions:
          - "The unlocking condition for benefit_code holds: LOAN_RATE_DISCOUNT / CAREER_COACHING_CREDIT / INVESTING_FEE_WAIVER / REWARDS_MULTIPLIER require the source holding's adoption_status == ADOPTED; DIRECT_DEPOSIT requires DirectDepositEnrollment.status == ACTIVE"
        side_effects:
          - "BenefitEntitlement.granted_at = logical clock now"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "Every LoanAccount of this member with pricing_status IN {PROVISIONAL, FINAL} is repriced; discount_stack_bps and effective_apr_bps recomputed"

      - from: GRANTED
        to: PENDING_REQUALIFICATION
        trigger: "system (side effect of DirectDepositEnrollment ACTIVE → GRACE, or ProductHolding ADOPTED → SUSPENDED)"
        actor: system
        preconditions:
          - "BenefitEntitlement.entitlement_status == GRANTED"
        side_effects:
          - "BenefitEntitlement.reconciliation_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"

      - from: PENDING_REQUALIFICATION
        to: GRANTED
        trigger: "system (side effect of POST /requalification-cycles/{cycle_id}/evaluate with outcome PASSED)"
        actor: system
        preconditions:
          - "The owning RequalificationCycle has status == PASSED"
          - "The unlocking condition for benefit_code holds again"
        side_effects:
          - "BenefitEntitlement.granted_at refreshed to logical clock now"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "Every LoanAccount of this member with pricing_status == STEPPED_DOWN returns to FINAL and is repriced (calculations.loan_effective_apr_bps)"

      - from: GRANTED
        to: STEPPED_DOWN
        trigger: "system (side effect of DirectDepositEnrollment GRACE → LAPSED, or Member MEMBER_AT_RISK → MEMBER_LAPSED, or POST /benefit-entitlements/{entitlement_id}/step-down)"
        actor: "system or PlatformAdmin"
        preconditions:
          - "BenefitEntitlement.entitlement_status == GRANTED"
        side_effects:
          - "BenefitEntitlement.value_bps = max(0, value_bps - DEPOSIT_STEP_DOWN_BPS) when the downgrade is deposit-driven, using the §1.3 DEPOSIT_STEP_DOWN_BPS constant; unchanged when compliance-driven"
          - "BenefitEntitlement.stepped_down_at = logical clock now"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "Every LoanAccount of this member with pricing_status IN {PROVISIONAL, FINAL} is repriced (calculations.discount_stack_total_bps, calculations.loan_effective_apr_bps)"

      - from: STEPPED_DOWN
        to: GRANTED
        trigger: "POST /benefit-entitlements/{entitlement_id}/restore"
        actor: PlatformAdmin
        preconditions:
          - "The unlocking condition for benefit_code holds again"
        side_effects:
          - "BenefitEntitlement.value_bps restored to the full magnitude from the governing RateDiscountRule"
          - "BenefitEntitlement.granted_at refreshed to logical clock now"
          - "Every LoanAccount of this member with pricing_status == STEPPED_DOWN returns to FINAL and is repriced (calculations.loan_effective_apr_bps)"

      - from: [PENDING, GRANTED, PENDING_REQUALIFICATION, STEPPED_DOWN]
        to: REVOKED
        trigger: "system (side effect of POST /holdings/{holding_id}/close on the source holding, or POST /members/{member_id}/detect-churn reaching MEMBER_LAPSED)"
        actor: system
        preconditions:
          - "The source holding's adoption_status == CLOSED, OR the member's member_status == MEMBER_LAPSED"
        side_effects:
          - "BenefitEntitlement.entitlement_status = REVOKED"
          - "A ChurnNotice with notice_type = BENEFIT_REVOCATION, status = QUEUED, related_entitlement_id = this entitlement, reason_code = HOLDING_CLOSED is created"
          - "Member.benefit_entitlement_state recomputed (calculations.benefit_entitlement_reconciliation)"
          - "When BenefitEntitlement.governing_rule_id is non-null: every DiscountApplication on this member's loans whose rule_id == that governing_rule_id and application_state == APPLIED → ROLLED_BACK"
          - "Every LoanAccount of this member of which any DiscountApplication was rolled back by the previous hop: discount_stack_bps recomputed (calculations.discount_stack_total_bps); effective_apr_bps recomputed (calculations.loan_effective_apr_bps); last_priced_at refreshed"

  # --- LoanAccount (parallel dimension 1: autopay) -------------------------
  - entity: LoanAccount
    field: autopay_status
    initial_state: NOT_ENROLLED
    terminal_states: []
    note: "Cyclic — SUSPENDED returns to ENROLLED when a scheduled payment clears."
    transitions:
      - from: NOT_ENROLLED
        to: ENROLLED
        trigger: "POST /loan-accounts/{loan_account_id}/autopay-enrollment"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals LoanAccount.member_id"
        side_effects:
          - "LoanAccount.autopay_status = ENROLLED"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps)"
          - "LoanAccount.last_priced_at refreshed"

      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /loan-accounts/{loan_account_id}/autopay-suspend"
        actor: PlatformAdmin
        preconditions:
          - "LoanAccount.autopay_status == ENROLLED"
          - "LoanAccount.pricing_status != STEPPED_DOWN"
        side_effects:
          - "LoanAccount.autopay_status = SUSPENDED"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps)"
          - "LoanAccount.last_priced_at refreshed"

      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /loan-accounts/{loan_account_id}/autopay-enrollment"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals LoanAccount.member_id"
        side_effects:
          - "LoanAccount.autopay_status = ENROLLED"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps)"

  # --- LoanAccount (parallel dimension 2: pricing) -------------------------
  - entity: LoanAccount
    field: pricing_status
    initial_state: PROVISIONAL
    terminal_states: [STEPPED_DOWN]
    note: "Parallel dimension — evolves independently of autopay_status on the same row."
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /loan-accounts/{loan_account_id}/finalize-pricing"
        actor: Underwriter
        preconditions:
          - "The member's most recent RequalificationCycle has status == PASSED, OR the member has no RequalificationCycle at all"
          - "Member.member_status IN {MEMBER_ACTIVE, MEMBER_AT_RISK}"
        side_effects:
          - "LoanAccount.pricing_status = FINAL"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps, variant final_apr)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps, variant final_apr)"
          - "LoanAccount.last_priced_at refreshed"
          - "ProductHolding.reunderwriting_permitted recomputed to true for LoanAccount.holding_id"

      - from: FINAL
        to: PROVISIONAL
        trigger: "POST /requalification-cycles/{cycle_id}/evaluate with outcome FAILED"
        actor: system
        preconditions:
          - "RequalificationCycle.status == FAILED"
          - "The cycle's member owns this LoanAccount"
        side_effects:
          - "LoanAccount.pricing_status = PROVISIONAL; last_priced_at refreshed"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps, variant provisional_apr)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps, variant provisional_apr)"

      - from: [PROVISIONAL, FINAL]
        to: STEPPED_DOWN
        trigger: "system (side effect of DirectDepositEnrollment GRACE → LAPSED when this loan carried a requires_direct_deposit rule)"
        actor: system
        preconditions:
          - "At least one DiscountApplication on this loan has application_state == ROLLED_BACK caused by the enrollment lapse"
        side_effects:
          - "LoanAccount.pricing_status = STEPPED_DOWN; last_priced_at refreshed"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps)"

      - from: STEPPED_DOWN
        to: FINAL
        trigger: "POST /benefit-entitlements/{entitlement_id}/restore or POST /deposit-enrollments/{enrollment_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Every BenefitEntitlement of the owning member with benefit_code == DIRECT_DEPOSIT has entitlement_status == GRANTED"
        side_effects:
          - "LoanAccount.pricing_status = FINAL; last_priced_at refreshed"
          - "LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps, variant final_apr)"
          - "LoanAccount.effective_apr_bps recomputed (calculations.loan_effective_apr_bps, variant final_apr)"

  # --- RateDiscountRule ---------------------------------------------------
  - entity: RateDiscountRule
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rate-discount-rules/{rule_id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Rule rule_code is unique across all rules regardless of status"
          - "No ACTIVE rule of the same discount_kind has a validity window whose gap to [effective_from, effective_to) is below OVERLAP_MIN_GAP_DAYS (1 day); half-open windows that merely touch have gap 0 and are therefore rejected, while a one-day gap is accepted"
        side_effects:
          - "RateDiscountRule.status = ACTIVE"
          - "Every LoanAccount of every member whose member_tier >= rule.min_member_tier and whose LoanAccount.base_apr_bps is unchanged is repriced (calculations.discount_stack_total_bps)"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /rate-discount-rules/{rule_id}/retire"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "RateDiscountRule.status = RETIRED"
          - "Every DiscountApplication referencing this rule with application_state == APPLIED and applied_at < logical clock now → ROLLED_BACK"
          - "Every affected LoanAccount: discount_stack_bps recomputed (calculations.discount_stack_total_bps); effective_apr_bps recomputed (calculations.loan_effective_apr_bps); last_priced_at refreshed"

  # --- RewardsLedgerEntry -------------------------------------------------
  - entity: RewardsLedgerEntry
    field: entry_status
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /rewards-ledger-entries/{entry_id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "RewardsLedgerEntry.entry_status == POSTED"
          - "RewardsLedgerEntry.entry_type IN {EARN, REDEEM_PRINCIPAL}"
        side_effects:
          - "RewardsLedgerEntry.entry_status = REVERSED"
          - "A compensating RewardsLedgerEntry with entry_type = REVERSE, points_delta = -(original points_delta), entry_status = POSTED is appended; RewardsLedgerEntry.reversed_by_entry_id of the original is set to the compensating entry's id"
          - "Member.rewards_points_balance recomputed (calculations.rewards_points_balance)"
          - "When the original entry_type == REDEEM_PRINCIPAL: the linked LoanAccount.principal_cents is increased by the original's principal_reduction_cents; LoanAccount.discount_stack_bps recomputed (calculations.discount_stack_total_bps) and effective_apr_bps recomputed (calculations.loan_effective_apr_bps); last_priced_at refreshed"

  # --- RequalificationCycle ----------------------------------------------
  - entity: RequalificationCycle
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Cyclic — a FAILED cycle can be remediated and re-passed."
    transitions:
      - from: OPEN
        to: PASSED
        trigger: "POST /requalification-cycles/{cycle_id}/evaluate"
        actor: PlatformAdmin
        preconditions:
          - "RequalificationCycle.status == OPEN"
          - "Requiring entity is a RequalificationCycle whose qualifying_month_count >= CONSECUTIVE_DEPOSIT_MONTHS_REQUIRED (3)"
        side_effects:
          - "RequalificationCycle.status = PASSED; evaluated_at = logical clock now"
          - "DirectDepositEnrollment.status ACTIVE/GRACE → ACTIVE"
          - "Every BenefitEntitlement of this member with entitlement_status == PENDING_REQUALIFICATION → GRANTED; granted_at stamped"
          - "Every LoanAccount of this member with pricing_status == PROVISIONAL → FINAL; discount_stack_bps and effective_apr_bps recomputed (variant final_apr)"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"
          - "Member.member_status MEMBER_AT_RISK → MEMBER_ACTIVE (sec.1.2 Member machine)"

      - from: OPEN
        to: FAILED
        trigger: "POST /requalification-cycles/{cycle_id}/evaluate"
        actor: PlatformAdmin
        preconditions:
          - "RequalificationCycle.status == OPEN"
          - "Requiring entity is a RequalificationCycle whose qualifying_month_count < CONSECUTIVE_DEPOSIT_MONTHS_REQUIRED (3)"
        side_effects:
          - "RequalificationCycle.status = FAILED; evaluated_at = logical clock now"
          - "Every LoanAccount of this member with pricing_status == FINAL → PROVISIONAL; discount_stack_bps and effective_apr_bps recomputed (variant provisional_apr)"
          - "Every BenefitEntitlement of this member with benefit_code == LOAN_RATE_DISCOUNT and entitlement_status == GRANTED → PENDING_REQUALIFICATION"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"

      - from: FAILED
        to: REMEDIATION
        trigger: "POST /requalification-cycles/{cycle_id}/open-remediation"
        actor: PlatformAdmin
        preconditions:
          - "RequalificationCycle.status == FAILED"
        side_effects:
          - "RequalificationCycle.status = REMEDIATION"
          - "RequalificationCycle.due_at extended by REMEDIATION_WINDOW_DAYS (30) days"
          - "A ChurnNotice with notice_type = REQUALIFICATION_REMINDER, status = QUEUED, reason_code = TIER_DOWNGRADE is created"

      - from: REMEDIATION
        to: PASSED
        trigger: "POST /requalification-cycles/{cycle_id}/evaluate"
        actor: PlatformAdmin
        preconditions:
          - "RequalificationCycle.status == REMEDIATION"
          - "RequalificationCycle.qualifying_month_count >= CONSECUTIVE_DEPOSIT_MONTHS_REQUIRED (3)"
        side_effects:
          - "RequalificationCycle.status = PASSED; evaluated_at = logical clock now"
          - "Every BenefitEntitlement of this member with entitlement_status IN {PENDING_REQUALIFICATION, STEPPED_DOWN} → GRANTED; granted_at stamped"
          - "Every LoanAccount of this member with pricing_status IN {PROVISIONAL, STEPPED_DOWN} → FINAL; discount_stack_bps and effective_apr_bps recomputed (variant final_apr)"
          - "Member.member_status MEMBER_AT_RISK → MEMBER_ACTIVE (sec.1.2 Member machine)"

      - from: REMEDIATION
        to: FAILED
        trigger: "POST /requalification-cycles/{cycle_id}/evaluate"
        actor: PlatformAdmin
        preconditions:
          - "RequalificationCycle.status == REMEDIATION"
          - "logical clock now >= RequalificationCycle.due_at"
        side_effects:
          - "RequalificationCycle.status = FAILED; evaluated_at = logical clock now"
          - "Every LoanAccount of this member with pricing_status == FINAL → PROVISIONAL; discount_stack_bps and effective_apr_bps recomputed (variant provisional_apr)"
          - "Every BenefitEntitlement of this member with benefit_code == LOAN_RATE_DISCOUNT and entitlement_status == GRANTED → PENDING_REQUALIFICATION"
          - "Member.churn_risk_score recomputed (calculations.churn_risk_score)"

      - from: [PASSED, FAILED]
        to: CLOSED
        trigger: "POST /requalification-cycles/{cycle_id}/close"
        actor: PlatformAdmin
        preconditions:
          - "RequalificationCycle.status IN {PASSED, FAILED}"
        side_effects:
          - "RequalificationCycle.status = CLOSED; evaluated_at refreshed"
          - "A new RequalificationCycle with cycle_index = previous cycle_index + 1, status = OPEN, opened_at = logical clock now, due_at = logical clock now + REQUALIFICATION_WINDOW_DAYS (90) days is created"

  # --- ChurnNotice --------------------------------------------------------
  - entity: ChurnNotice
    field: status
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, VOIDED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /churn-notices/{notice_id}/send"
        actor: PlatformAdmin
        preconditions:
          - "ChurnNotice.status == QUEUED"
          - "logical clock now >= ChurnNotice.issued_at"
        side_effects:
          - "ChurnNotice.status = SENT"

      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /churn-notices/{notice_id}/acknowledge"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals ChurnNotice.member_id"
          - "ChurnNotice.status == SENT"
        side_effects:
          - "ChurnNotice.status = ACKNOWLEDGED"

      - from: QUEUED
        to: VOIDED
        trigger: "system (rate restored before the notice was sent)"
        actor: system
        preconditions:
          - "ChurnNotice.status == QUEUED"
          - "The member's DIRECT_DEPOSIT entitlement has entitlement_status == GRANTED"
        side_effects:
          - "ChurnNotice.status = VOIDED"

  # --- CrossSellCheck -----------------------------------------------------
  - entity: CrossSellCheck
    field: status
    initial_state: PENDING
    terminal_states: [CLEARED, BLOCKED, REUSE_PROHIBITED]
    note: "Branching fork — the three terminal outcomes carry divergent side-effect sets."
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /cross-sell-checks/{check_id}/decide with outcome=CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "CrossSellCheck.conditioning_blocked == false"
          - "CrossSellCheck.consent_recorded == true OR target_product_line == LENDING"
          - "No existing CrossSellCheck for the same member_id and target_product_line in status CLEARED"
        side_effects:
          - "CrossSellCheck.status = CLEARED; decided_at = logical clock now; decided_by = acting X-User-ID"
          - "Every ProductHolding of this member with product_line == target_product_line → cross_sell_eligible recomputed to true (calculations.cross_sell_eligible)"

      - from: PENDING
        to: BLOCKED
        trigger: "POST /cross-sell-checks/{check_id}/decide with outcome=BLOCKED"
        actor: ComplianceOfficer
        preconditions:
          - "CrossSellCheck.conditioning_blocked == true"
        side_effects:
          - "CrossSellCheck.status = BLOCKED; decided_at = logical clock now; decided_by = acting X-User-ID"
          - "Every ProductHolding of this member with product_line == target_product_line → cross_sell_eligible recomputed to false (calculations.cross_sell_eligible)"

      - from: PENDING
        to: REUSE_PROHIBITED
        trigger: "POST /cross-sell-checks/{check_id}/decide with outcome=REUSE_PROHIBITED"
        actor: ComplianceOfficer
        preconditions:
          - "CrossSellCheck.underwriting_reuse_permitted == false"
          - "CrossSellCheck.target_product_line == LENDING"
        side_effects:
          - "CrossSellCheck.status = REUSE_PROHIBITED; decided_at = logical clock now; decided_by = acting X-User-ID"
          - "ProductHolding.reunderwriting_permitted recomputed to false for every LENDING holding of this member (calculations.reunderwriting_permitted)"

  # --- CoachingSession ----------------------------------------------------
  - entity: CoachingSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /coaching-sessions/{session_id}/confirm"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals CoachingSession.member_id"
          - "CoachingSession.status == SCHEDULED"
          - "The member has a BenefitEntitlement with benefit_code == CAREER_COACHING_CREDIT and entitlement_status == GRANTED, OR session_kind == MEMBER_EVENT"
        side_effects:
          - "CoachingSession.status = CONFIRMED"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /coaching-sessions/{session_id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "CoachingSession.status == CONFIRMED"
          - "logical clock now >= CoachingSession.starts_at"
        side_effects:
          - "CoachingSession.status = COMPLETED"
          - "When session_kind == CAREER_COACHING: a RewardsLedgerEntry with entry_type = EARN, points_delta = CAREER_SESSION_POINTS (250), source_event_code = CAREER_SESSION_COMPLETED is appended; Member.rewards_points_balance recomputed (calculations.rewards_points_balance)"

      - from: [SCHEDULED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /coaching-sessions/{session_id}/cancel"
        actor: Member
        preconditions:
          - "The acting X-User-ID equals CoachingSession.member_id"
        side_effects:
          - "CoachingSession.status = CANCELLED"
          - "CoachingSession.seats_reserved recomputed (calculations.session_seats_reserved)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-open-supersede-stale-member
    parent_entity: Member
    write_endpoint: "POST /benefits/members/{member_id}/requalification-cycles"
    occ_field: "expected_member_version"
    description: |
      Opening a RequalificationCycle against a Member whose version has advanced
      since the client last observed it is rejected. The product spec lets a
      member restart requalification at any time, so a second cycle legitimately
      supersedes the first and the endpoint cannot reject it on state grounds;
      the only observable difference is whether the caller's view of the member
      is still the one it read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: application-create-stale-loan
    parent_entity: LoanAccount
    write_endpoint: "POST /benefits/loan-accounts/{loan_account_id}/applications"
    occ_field: "expected_loan_account_version"
    description: |
      Attaching a DiscountApplication to a LoanAccount whose version has
      advanced since the client last observed it is rejected. A new application
      of the same stacking_class legitimately supersedes the standing one, so the
      endpoint cannot reject the second create on state grounds; it can only
      reject it because the caller priced against a stale view of the loan.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (16 rules)
# =============================================================================
calculations:

  - name: member_tier
    trigger: "ProductHolding adopt, suspend, close; RewardsLedgerEntry principal redemption; Member reinstate"
    algorithm: threshold
    formula: |
      product_count = Member.product_adoption_count
      distinct_lines = |Member.product_line_set|
      PREMIER if product_count >= PREMIER_MIN_PRODUCTS and distinct_lines >= PREMIER_MIN_LINES
      PLUS    elif product_count >= PLUS_MIN_PRODUCTS and distinct_lines >= PLUS_MIN_LINES
      BASE    elif product_count >= BASE_MIN_PRODUCTS
      NONE    otherwise
      Order is top-down; the first satisfied clause wins.
    input_set: "ProductHolding rows of this member with adoption_status == ADOPTED (canonical variant), CLOSED rows excluded"
    constants:
      PREMIER_MIN_PRODUCTS: 3
      PREMIER_MIN_LINES: 3
      PLUS_MIN_PRODUCTS: 2
      PLUS_MIN_LINES: 2
      BASE_MIN_PRODUCTS: 1
    precision: "integer enum, no rounding"
    variants:
      - name: point_in_time
        when: "canonical — evaluated on every ProductHolding state change"
        difference: "counts only ProductHolding rows with adoption_status == ADOPTED"
      - name: forward_looking
        when: "GET /members/{member_id}/tier-projection — what the member would reach once every PENDING holding is adopted"
        difference: "also counts holdings with adoption_status == PENDING; a member with 1 ADOPTED and 2 PENDING holdings across 3 distinct lines is BASE under point_in_time and PREMIER under forward_looking"

  - name: loan_effective_apr_bps
    trigger: "RateDiscountRule activate/retire; DiscountApplication create/rollback; LoanAccount autopay change; DirectDepositEnrollment lapse/activate; ProductHolding adopt/close"
    algorithm: constraint_propagation
    formula: |
      effective_apr_bps = max(APR_FLOOR_BPS, base_apr_bps - discount_stack_bps)
      APR_FLOOR_BPS is a hard floor: the result is never below it, whatever the stack.
    input_set: "the LoanAccount row itself plus its APPLIED DiscountApplication rows"
    constants:
      APR_FLOOR_BPS: 199
    precision: "integer basis points, no rounding"
    variants:
      - name: provisional_apr
        when: "LoanAccount.pricing_status == PROVISIONAL"
        difference: "discount_stack_bps is re-derived on every mutation, so a rule activated or retired after the first pricing flows straight through"
      - name: final_apr
        when: "LoanAccount.pricing_status == FINAL"
        difference: "discount_stack_bps is frozen at the DiscountApplication snapshots taken when the loan was finalized; a rule activated afterwards changes nothing until the loan returns to PROVISIONAL. A loan with base_apr_bps 1200 finalized while discount_stack_bps was 325 prices at 875 under final_apr, and at 825 under provisional_apr once a later 50 bps rule takes effect."

  - name: discount_stack_total_bps
    trigger: "RateDiscountRule activate/retire; DiscountApplication create/rollback; Member tier change; DirectDepositEnrollment status change; ProductHolding adopt/close"
    algorithm: waterfall_allocation
    formula: |
      # 1. CANDIDATE set — explicit predicate over entity fields, no fuzzy adjectives
      candidates = [ r for r in RateDiscountRule
                     if r.status == ACTIVE
                     and r.effective_from <= logical_clock_now < r.effective_to
                     and tier_rank(member.member_tier) >= tier_rank(r.min_member_tier)
                     and (r.requires_direct_deposit == false
                          or enrollment.status == ACTIVE) ]
      # 2. CLASS SELECTION — exactly one survivor per stacking_class
      #    sort key: (discount_bps DESC, effective_from DESC, created_at DESC)
      #    created_at is the final tie-break; id is NEVER consulted
      kept = [ top_1_of(each stacking_class in candidates) ]
      # 3. STORED and CAP
      stored_bps = sum(r.discount_bps for r in kept)
      discount_stack_bps = min(STACK_CAP_BPS, stored_bps)
      # 4. TRANSFER — one DiscountApplication per kept rule
      #    APPLIED for the survivor; PREEMPTED for every other candidate of that class
      # 5. AUTOPAY is a first-class discount_kind in the candidate pool, not a bolted-on bonus:
      #    a loan whose autopay_status != ENROLLED simply has no AUTOPAY rule in `candidates`.
    input_set: "RateDiscountRule rows with status == ACTIVE and an open validity window; LoanAccount rows with pricing_status IN {PROVISIONAL, FINAL}; DiscountApplication rows with application_state == APPLIED"
    constants:
      STACK_CAP_BPS: 400
    precision: "integer basis points, round_half_up if a fractional rate is introduced"
    variants:
      - name: rotb_stored
        when: "canonical — the value written to LoanAccount.discount_stack_bps"
        difference: "returns stored_bps after the STACK_CAP_BPS ceiling is applied"
      - name: uncapped_diagnostic
        when: "GET /loan-accounts/{loan_account_id}/pricing-breakdown"
        difference: "returns stored_bps before the ceiling, so the caller can see the raw sum even when the cap binds"

  - name: rewards_principal_reduction_cents
    trigger: "POST /members/{member_id}/rewards/redeem-principal; POST /members/{member_id}/rewards/reconcile"
    algorithm: chronological
    formula: |
      points_consumed = -1 * points_delta          # positive for REDEEM_PRINCIPAL
      reduction_cents = points_consumed // POINTS_PER_CENT      # floor, pinned order
      The floor is applied per entry, at creation time, in posted_at ascending order.
      ROUNDING ORDER IS PINNED: per-entry floor first, then sum —
      NOT sum-all-points-then-floor. Two 1150-point redemptions yield 11 + 11 = 22 cents,
      never floor(2300 / 100) = 23 cents.
    input_set: "RewardsLedgerEntry rows with entry_type == REDEEM_PRINCIPAL and entry_status == POSTED; REVERSED rows are excluded"
    constants:
      POINTS_PER_CENT: 100
      MIN_REDEEM_POINTS: 1000
      MAX_REDEEM_POINTS_PER_ENTRY: 500000
    precision: "integer cents, floor (truncation toward zero); remainder points are destroyed, not carried"
    variants:
      - name: per_entry
        when: "canonical — applied when a redemption is created"
        difference: "each entry floors its own points independently; remainder points are destroyed"
      - name: cumulative_retroactive
        when: "POST /members/{member_id}/rewards/reconcile — re-derives the member's whole redemption history at once"
        difference: "floors the cumulative sum of all POSTED REDEEM_PRINCIPAL points once and lifts the newest entry by the difference. After two 1150-point redemptions the newest entry reads 11 cents under per_entry and 12 cents under cumulative_retroactive."

  - name: deposit_rate_boost_bps
    trigger: "DirectDepositEnrollment activate/lapse; ProductHolding adopt/close; POST /members/{member_id}/deposits"
    algorithm: tiered_pricing
    formula: |
      if enrollment.status != ACTIVE: deposit_rate_boost_bps = 0
      else:
        balance = Member.qualifying_deposit_balance_cents
        boost = 0
        for band in [BAND_1, BAND_2, BAND_3] in ascending min order:
            if balance >= band.min_balance_cents: boost = band.bps
        deposit_rate_boost_bps = boost
      Highest matching band wins: the lower bound of each band is INCLUSIVE (>= , not >),
      so 100000 cents earns the first band and 99999 earns nothing.
    input_set: "ProductHolding rows with product_line == BANKING and adoption_status == ADOPTED; the member's DirectDepositEnrollment row"
    constants:
      BAND_1_MIN_BALANCE_CENTS: 100000
      BAND_1_BPS: 25
      BAND_2_MIN_BALANCE_CENTS: 500000
      BAND_2_BPS: 50
      BAND_3_MIN_BALANCE_CENTS: 2500000
      BAND_3_BPS: 75
      DEPOSIT_STEP_DOWN_BPS: 50
    precision: "integer basis points"
    variants:
      - name: point_in_time_balance
        when: "canonical — evaluated on every qualifying balance change"
        difference: "uses the current qualifying_deposit_balance_cents"
      - name: trailing_average_balance
        when: "GET /members/{member_id}/deposit-rate-projection"
        difference: "uses the mean qualifying balance across the trailing CONSECUTIVE_DEPOSIT_MONTHS_REQUIRED logical months, so a member who funded a band today but held nothing for two months is still priced at the lower band"

  - name: churn_risk_score
    trigger: "DirectDepositEnrollment status change; DepositPosting create/reverse; Member tier change; ProductHolding close"
    algorithm: weighted_scoring
    formula: |
      f_deposit = 1 if enrollment.status IN {GRACE, LAPSED} else 0
      f_cycles  = min(MISSED_CYCLE_SATURATION, enrollment.missed_cycle_count)
      f_tier    = 1 if member.member_tier IN {NONE, BASE} else 0
      f_balance = 1 if member.qualifying_deposit_balance_cents < BALANCE_DROP_FLOOR_CENTS else 0
      raw = DEPOSIT_STOP_WEIGHT * f_deposit
          + MISSED_CYCLE_WEIGHT * f_cycles
          + TIER_DOWN_WEIGHT   * f_tier
          + BALANCE_DROP_WEIGHT * f_balance
      churn_risk_score = min(100, max(0, raw))
      AT_RISK when churn_risk_score >= CHURN_AT_RISK_SCORE; LAPSED when >= CHURN_LAPSE_SCORE.
    input_set: "the member's enrollment row, its missed-cycle counter, current tier, and current qualifying balance"
    constants:
      DEPOSIT_STOP_WEIGHT: 40
      MISSED_CYCLE_WEIGHT: 20
      MISSED_CYCLE_SATURATION: 2
      TIER_DOWN_WEIGHT: 25
      BALANCE_DROP_WEIGHT: 15
      BALANCE_DROP_FLOOR_CENTS: 500000
      CHURN_AT_RISK_SCORE: 60
      CHURN_LAPSE_SCORE: 85
    precision: "integer 0..100, clamp applied after summation"
    variants:
      - name: clamped_saturating
        when: "canonical — written to Member.churn_risk_score"
        difference: "each factor saturates before the sum, so the raw score tops out at 120 and is clamped to 100"
      - name: unbounded_diagnostic
        when: "GET /members/{member_id}/churn-breakdown"
        difference: "returns the pre-clamp raw score beside each factor's contribution, so 120 is visible where the stored value reads 100"

  - name: consecutive_qualifying_months
    trigger: "DepositPosting create; DepositPosting reverse; logical clock advance; DirectDepositEnrollment activate"
    algorithm: chronological
    formula: |
      Months are UTC calendar months. A month M qualifies when
        sum(amount_cents for postings of this enrollment with posting_status != REVERSED
            and posted_at inside M) >= enrollment.required_monthly_amount_cents
      consecutive_qualifying_months = length of the maximal trailing run of
      consecutive qualifying months ending at the logical month containing the logical clock.
      A non-qualifying month anywhere in the run resets the count to 0 at that point;
      the count restarts from the month after it.
    input_set: "DepositPosting rows of this enrollment with posting_status IN {POSTED, REVERSED}; a reversal is applied at its own posted_at, so reversing an old posting can retroactively break an already-counted month"
    constants:
      CONSECUTIVE_DEPOSIT_MONTHS_REQUIRED: 3
    precision: "integer month count"

  - name: requalification_due_at
    trigger: "DirectDepositEnrollment activate; logical clock advance"
    algorithm: chronological
    formula: |
      month_index(d) = 12 * year(d) + (month(d) - 1)
      requalification_due_at = first instant (00:00:00.000Z on day 1)
                               of the month with index month_index(qualified_at) + REQUALIFICATION_WINDOW_MONTHS
      Day-of-month is discarded; the window is expressed in whole logical months.
    input_set: "DirectDepositEnrollment.qualified_at"
    constants:
      REQUALIFICATION_WINDOW_MONTHS: 3
    precision: "ISO 8601 UTC, three fractional digits"

  - name: benefit_entitlement_reconciliation
    trigger: "any BenefitEntitlement status change; ProductHolding adopt/suspend/close; DirectDepositEnrollment status change; Member.member_status change; POST /members/{member_id}/entitlements/reconcile"
    algorithm: aggregation
    formula: |
      # member-level rollup; evaluated top-down, first clause wins
      counted = BenefitEntitlement rows of this member whose source holding's adoption_status != CLOSED
      if Member.member_status == MEMBER_LAPSED: Member.benefit_entitlement_state = SUSPENDED
      elif |{e in counted : e.entitlement_status == GRANTED}| == |counted| and |counted| > 0: FULL
      elif |{e in counted : e.entitlement_status == GRANTED}| > 0: PARTIAL
      else: NONE

      # row-level guard verdict
      guard_status(e):
        DIRECT_DEPOSIT            -> GRANTED iff enrollment.status == ACTIVE
        LOAN_RATE_DISCOUNT            -> GRANTED iff source holding.adoption_status == ADOPTED
        CAREER_COACHING_CREDIT        -> GRANTED iff source holding.adoption_status == ADOPTED
        INVESTING_FEE_WAIVER          -> GRANTED iff source holding.adoption_status == ADOPTED
        REWARDS_MULTIPLIER            -> GRANTED iff source holding.adoption_status == ADOPTED

      BenefitEntitlement.reconciliation_state =
        RECONCILED     if the row was rewritten by POST /members/{member_id}/entitlements/reconcile
        DRIFT_REPORTED if e.entitlement_status != guard_status(e) and the row has not yet been rewritten
        IN_SYNC        otherwise
    input_set: "every BenefitEntitlement row of the member whose source holding is not CLOSED"
    constants: {}
    precision: "enum, no rounding"
    variants:
      - name: read_side
        when: "every GET that surfaces entitlement state"
        difference: "recomputes the rollup on read and never writes the rows, so a stale entitlement_status shows as DRIFT_REPORTED"
      - name: reconciled
        when: "POST /members/{member_id}/entitlements/reconcile"
        difference: "writes each row's entitlement_status to guard_status(e) and stamps reconciliation_state = RECONCILED, so every later read is IN_SYNC"

  - name: cross_sell_eligibility
    trigger: "CrossSellCheck decide; ProductHolding adopt/suspend/close; Member tier change"
    algorithm: constraint_propagation
    formula: |
      latest = the CrossSellCheck of this member with target_product_line == holding.product_line
               having the greatest created_at; ties broken by greatest decided_at
      cross_sell_eligible(holding) =
        holding.adoption_status IN {ADOPTED, SUSPENDED}
        and latest exists and latest.status == CLEARED
      If no such check exists, cross_sell_eligible is false.
    input_set: "CrossSellCheck rows of the member; ProductHolding rows of the member"
    constants: {}
    precision: "boolean"

  - name: reunderwriting_permitted
    trigger: "LoanAccount finalize-pricing; CrossSellCheck decide REUSE_PROHIBITED; ProductHolding adopt/close"
    algorithm: constraint_propagation
    formula: |
      reunderwriting_permitted(holding) =
        holding.product_line == LENDING
        and holding.adoption_status == ADOPTED
        and exists LoanAccount a where a.holding_id == holding.id
                               and a.pricing_status IN {FINAL, STEPPED_DOWN}
      No ProductHolding row of any other product_line can ever be true.
    input_set: "ProductHolding rows with product_line == LENDING; their LoanAccount rows"
    constants: {}
    precision: "boolean"

  - name: product_adoption_count
    trigger: "ProductHolding adopt, suspend, close"
    algorithm: aggregation
    formula: |
      product_adoption_count = count(ProductHolding rows of this member with adoption_status == ADOPTED)
      SUSPENDED and CLOSED rows are excluded.
    input_set: "ProductHolding rows of the member"
    constants: {}
    precision: "integer count"

  - name: product_line_set
    trigger: "ProductHolding adopt, suspend, close"
    algorithm: aggregation
    formula: |
      product_line_set = sorted distinct { h.product_line : h is a ProductHolding of this member
                                           and h.adoption_status == ADOPTED }
      Sorted ascending by the enum's stable ordering LENDING < BANKING < INVESTING < CAREER.
    input_set: "ProductHolding rows of the member"
    constants: {}
    precision: "array of enum, ascending"

  - name: deposit_rate_eligible
    trigger: "DirectDepositEnrollment status change; ProductHolding adopt/suspend/close"
    algorithm: constraint_propagation
    formula: |
      deposit_rate_eligible =
        holding.product_line == BANKING
        and holding.adoption_status == ADOPTED
        and enrollment.status == ACTIVE
    input_set: "ProductHolding rows with product_line == BANKING; the member's enrollment row"
    constants: {}
    precision: "boolean"

  - name: rewards_points_balance
    trigger: "RewardsLedgerEntry create; RewardsLedgerEntry reverse; CoachingSession complete"
    algorithm: aggregation
    formula: |
      rewards_points_balance = sum(e.points_delta for e in RewardsLedgerEntry
                                   where e.member_id == member.id
                                   and e.entry_status == POSTED)
      Never negative; a redemption is rejected when it would drive the sum below zero.
    input_set: "RewardsLedgerEntry rows with entry_status == POSTED; REVERSED rows are excluded"
    constants: {}
    precision: "integer points"

  - name: session_seats_reserved
    trigger: "CoachingSession create; CoachingSession confirm; CoachingSession cancel"
    algorithm: interval_merge
    formula: |
      seats_reserved = count(s for s in CoachingSession
                             where s.session_kind == MEMBER_EVENT
                             and s.coach_ref == this.coach_ref
                             and s.status != CANCELLED
                             and s.starts_at < this.ends_at
                             and this.starts_at < s.ends_at)
      Interval semantics for a MEMBER_EVENT capacity pool are HALF-OPEN [starts_at, ends_at):
      a session ending exactly when the next begins does NOT collide. This differs from the
      CAREER_COACHING exclusive-slot rule in validations.priority=18, which treats touching
      endpoints as a collision and is scoped to CAREER_COACHING sessions only — the two rules
      sit on the same entity but use different geometry on disjoint session_kind scopes.
    input_set: "CoachingSession rows sharing the coach_ref"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role is a role declared in §1.7 and is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "The Member named by member_id in the path exists"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path carries {member_id}"

  - priority: 4
    category: existence
    check: "Every other resource id in the path exists: holding_id, loan_account_id, enrollment_id, entitlement_id, rule_id, application_id, entry_id, cycle_id, notice_id, check_id, session_id"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose path carries one of those ids"

  - priority: 5
    category: state
    check: "OCC guard: when the request body carries expected_<parent>_version, it must equal the parent's current version field"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "[POST /members/{member_id}/requalification-cycles, POST /loan-accounts/{loan_account_id}/applications]"

  - priority: 6
    category: state
    check: "The target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 7
    category: state
    check: "The memberships referenced by an entitlement or a discount application are adopted; a benefit unlocked by a closed holding cannot be granted"
    error_id: ERR_HOLDING_NOT_ADOPTED
    http_status: 409
    applies_to: "[POST /members/{member_id}/entitlements/reconcile, POST /loan-accounts/{loan_account_id}/applications, POST /benefit-entitlements/{entitlement_id}/restore, POST /benefit-entitlements/{entitlement_id}/step-down]"

  - priority: 8
    category: business_safety
    check: "A cross-sell target in BANKING or INVESTING may not be conditioned on the credit decision; conditioning_blocked must be false"
    error_id: ERR_CREDIT_CONDITIONING_BLOCKED
    http_status: 422
    applies_to: "[POST /cross-sell-checks/{check_id}/decide]"

  - priority: 9
    category: business_safety
    check: "Underwriting may be reused only where a FINAL-priced LENDING holding permits it; reuse on an unpermitted line is refused"
    error_id: ERR_REUSE_UNDERWRITING_PROHIBITED
    http_status: 422
    applies_to: "[POST /cross-sell-checks/{check_id}/decide]"

  - priority: 10
    category: business_safety
    check: "An affirmative member consent record must be on file before a cross-sell contact proceeds"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "[POST /cross-sell-checks/{check_id}/decide]"

  - priority: 11
    category: business_constraint
    check: "A declared stack (stacks_on_rule_id) must join rules of the same stacking_class; stacking across classes is refused"
    error_id: ERR_STACK_CLASS_CONFLICT
    http_status: 409
    applies_to: "[POST /rate-discount-rules]"

  - priority: 12
    category: business_constraint
    check: "No active DiscountApplication may already occupy the same (loan_account_id, rule_id) pair"
    error_id: ERR_DUPLICATE_DISCOUNT_APPLICATION
    http_status: 409
    applies_to: "[POST /loan-accounts/{loan_account_id}/applications]"

  - priority: 13
    category: business_constraint
    check: "A rule's effective window must not overlap another non-RETIRED rule's window, sharing gap < OVERLAP_MIN_GAP_DAYS"
    error_id: ERR_RULE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "[POST /rate-discount-rules, POST /rate-discount-rules/{rule_id}/activate]"

  - priority: 14
    category: business_constraint
    check: "rule_code is unique across all rules regardless of status"
    error_id: ERR_DUPLICATE_RULE_CODE
    http_status: 409
    applies_to: "[POST /rate-discount-rules]"

  - priority: 15
    category: business_constraint
    check: "The stacks_on_rule_id chain must reach a root without revisiting a rule (no cycle in the stacking graph)"
    error_id: ERR_SELF_STACK_CYCLE
    http_status: 422
    applies_to: "[POST /rate-discount-rules]"

  - priority: 16
    category: business_constraint
    check: "A BenefitEntitlement in status GRANTED cannot be granted again"
    error_id: ERR_BENEFIT_ALREADY_GRANTED
    http_status: 409
    applies_to: "[POST /benefit-entitlements/{entitlement_id}/restore]"

  - priority: 17
    category: business_constraint
    check: "Segregation of duties: the X-User-ID approving an entitlement override must differ from the X-User-ID that requested it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "[POST /benefit-entitlements/{entitlement_id}/approve-override]"

  - priority: 18
    category: business_temporal
    check: "A CAREER_COACHING session is a one-to-one exclusive slot: it must not overlap another non-CANCELLED CAREER_COACHING session on the same coach_ref, and its interval is CLOSED on both ends, so a session ending exactly when the next begins collides"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "[POST /coaching-sessions, POST /coaching-sessions/{session_id}/confirm]"

  - priority: 19
    category: business_temporal
    check: "A benefit whose rule sets requires_direct_deposit cannot be priced while the enrollment is not ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "[POST /loan-accounts/{loan_account_id}/applications, POST /loan-accounts/{loan_account_id}/finalize-pricing]"

  - priority: 20
    category: business_temporal
    check: "An enrollment in GRACE may only lapse once its grace_deadline_at has passed"
    error_id: ERR_GRACE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "[POST /deposit-enrollments/{enrollment_id}/lapse]"

  - priority: 21
    category: business_temporal
    check: "A requalification cycle cannot be evaluated before its due_at has passed"
    error_id: ERR_REQUALIFICATION_WINDOW_OPEN
    http_status: 409
    applies_to: "[POST /requalification-cycles/{cycle_id}/evaluate]"

  - priority: 22
    category: business_fiscal
    check: "The redemption's points must not exceed the member's posted rewards_points_balance"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "[POST /members/{member_id}/rewards/redeem-principal]"

  - priority: 23
    category: business_fiscal
    check: "A single redemption must sit between MIN_REDEEM_POINTS and MAX_REDEEM_POINTS_PER_ENTRY"
    error_id: ERR_REDEMPTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "[POST /members/{member_id}/rewards/redeem-principal]"

  - priority: 24
    category: business_fiscal
    check: "A redemption must not drive the loan principal below zero"
    error_id: ERR_PRINCIPAL_BELOW_ZERO
    http_status: 422
    applies_to: "[POST /members/{member_id}/rewards/redeem-principal]"

  - priority: 25
    category: business_fiscal
    check: "The stored discount stack must not silently exceed STACK_CAP_BPS; the cap is applied, not rejected, so only a memo-carrying request is refused"
    error_id: ERR_STACK_CAP_EXCEEDED
    http_status: 422
    applies_to: "[POST /loan-accounts/{loan_account_id}/applications]"

  - priority: 26
    category: business_referential
    check: "A LENDING holding carrying a PROVISIONAL or FINAL LoanAccount cannot be closed"
    error_id: ERR_HOLDING_HAS_ACTIVE_LOAN
    http_status: 409
    applies_to: "[POST /holdings/{holding_id}/close]"

  - priority: 27
    category: business_referential
    check: "A BenefitEntitlement must name a source_holding_id that exists and belongs to the same member"
    error_id: ERR_ENTITLEMENT_NO_SOURCE_HOLDING
    http_status: 422
    applies_to: "[POST /members/{member_id}/entitlements]"

  - priority: 28
    category: business_referential
    check: "A RateDiscountRule cannot be activated while a rule it joins through stacks_on_rule_id does not exist or is itself only DRAFT"
    error_id: ERR_ACTIVE_RULE_ON_UNPRICED_LOAN
    http_status: 422
    applies_to: "[POST /rate-discount-rules/{rule_id}/activate]"

  - priority: 29
    category: business_constraint
    check: "A member-level duplicate check: no two BenefitEntitlement rows may share (member_id, benefit_code, source_holding_id)"
    error_id: ERR_DUPLICATE_ENTITLEMENT
    http_status: 409
    applies_to: "[POST /members/{member_id}/entitlements]"

  - priority: 30
    category: business_safety
    check: "An override on a compliance-driven entitlement downgrade may only be applied when the override window is still open and the requesting role is BenefitsAdmin"
    error_id: ERR_OVERRIDE_NOT_PERMITTED
    http_status: 422
    applies_to: "[POST /benefit-entitlements/{entitlement_id}/request-override]"

  - priority: 31
    category: business_temporal
    check: "A MEMBER_EVENT session is a capacity-pool booking, not an exclusive slot: it is rejected when the number of non-CANCELLED sessions sharing its coach_ref and overlapping it under HALF-OPEN [starts_at, ends_at) semantics — so a session ending exactly when the next begins does NOT collide — has already reached the venue capacity_total declared by the earliest-created overlapping session on that coach_ref"
    error_id: ERR_SESSION_CAPACITY_SATURATED
    http_status: 409
    applies_to: "[POST /coaching-sessions, POST /coaching-sessions/{session_id}/confirm]"

  - priority: 32
    category: business_constraint
    check: "A member-scoped end-state aggregate: no two rows may share (member_id, benefit_code) with entitlement_status == GRANTED across different source holdings"
    error_id: ERR_DUPLICATE_ENTITLEMENT
    http_status: 409
    applies_to: "[POST /members/{member_id}/entitlements]"

# =============================================================================
# §1.5 API Endpoint Table (77 endpoints)
#
# Every collection GET carries the foreign-key filter for every FK declared in
# §1.1, satisfying the reverse-reachability rule.
# =============================================================================
endpoints:

  # --- Clock (test-driving) ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Default on server start is 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["Sets the logical clock; recomputes consecutive_qualifying_months, missed_cycle_count and requalification_due_at for every DirectDepositEnrollment"]

  # --- Member --------------------------------------------------------------
  - method: POST
    path: "/benefits/members"
    description: "Register a new member in PROSPECT status"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [member_number, full_name, email]
    output: Member
    side_effects: ["member_status=PROSPECT; member_since_at=null; member_tier=NONE; benefit_entitlement_state=NONE; rewards_points_balance=0; churn_risk_score=0"]

  - method: GET
    path: "/benefits/members"
    description: "List members, paginated"
    roles: [PlatformAdmin, ComplianceOfficer, BenefitsAdmin]
    code: 200
    input: ["member_status?", "member_tier?", "email?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/benefits/members/{member_id}"
    description: "Get one member"
    roles: [Member, PlatformAdmin, ComplianceOfficer, BenefitsAdmin, Underwriter]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/benefits/members/{member_id}/tier-projection"
    description: "Forward-looking tier: what the member reaches once every PENDING holding is adopted"
    roles: [Member, BenefitsAdmin, PlatformAdmin]
    code: 200
    input: []
    output: { current_tier: string, projected_tier: string, pending_adoption_count: integer }
    side_effects: ["Recomputes calculations.member_tier variant forward_looking"]

  - method: GET
    path: "/benefits/members/{member_id}/churn-breakdown"
    description: "Pre-clamp churn score beside each factor's contribution"
    roles: [Member, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: { stored_score: integer, raw_score: integer, deposit_factor: integer, missed_cycle_factor: integer, tier_factor: integer, balance_factor: integer }
    side_effects: ["Recomputes calculations.churn_risk_score variant unbounded_diagnostic"]

  - method: GET
    path: "/benefits/members/{member_id}/deposit-rate-projection"
    description: "Deposit-rate boost under the trailing-average balance variant"
    roles: [Member, BenefitsAdmin, PlatformAdmin]
    code: 200
    input: []
    output: { current_boost_bps: integer, projected_boost_bps: integer, trailing_average_balance_cents: integer }
    side_effects: ["Recomputes calculations.deposit_rate_boost_bps variant trailing_average_balance"]

  - method: GET
    path: "/benefits/members/{member_id}/benefit-summary"
    description: "Member-level entitlement rollup counts"
    roles: [Member, BenefitsAdmin, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: { entitlement_state: string, granted_count: integer, pending_requalification_count: integer, stepped_down_count: integer, revoked_count: integer }
    side_effects: ["Recomputes calculations.benefit_entitlement_reconciliation variant read_side"]

  - method: GET
    path: "/benefits/members/{member_id}/rewards-balance"
    description: "Posted rewards points balance"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: { points_balance: integer, posted_entry_count: integer, reversed_entry_count: integer }
    side_effects: ["Recomputes calculations.rewards_points_balance"]

  - method: POST
    path: "/benefits/members/{member_id}/deposits"
    description: "Post a payroll deposit against the member's enrollment"
    roles: [PlatformAdmin]
    code: 201
    input: [enrollment_id, amount_cents, posted_at, "holding_id?"]
    output: DirectDepositEnrollment
    side_effects:
      - "Appends a DepositPosting"
      - "Recomputes consecutive_qualifying_months; when the posted amount meets required_monthly_amount_cents updates last_deposit_at and resets missed_cycle_count"
      - "When holding_id is supplied the named BANKING holding's balance_cents is credited by amount_cents, so the member's qualifying_deposit_balance_cents moves with the postings"
      - "GRACE -> ACTIVE when the posting qualifies and logical clock < grace_deadline_at"
      - "Recomputes Member.churn_risk_score and Member.qualifying_deposit_balance_cents"

  - method: POST
    path: "/benefits/members/{member_id}/deposits/reverse"
    description: "Reverse a previously posted payroll deposit"
    roles: [PlatformAdmin]
    code: 200
    input: [posting_id]
    output: DirectDepositEnrollment
    side_effects:
      - "Marks the DepositPosting REVERSED at its original posted_at"
      - "Recomputes consecutive_qualifying_months chronologically, which can retroactively break an already-counted month"
      - "Recomputes Member.churn_risk_score"

  - method: POST
    path: "/benefits/members/{member_id}/requalification-cycles"
    description: "Open a requalification cycle for a member (OCC-guarded against the member's version)"
    roles: [PlatformAdmin]
    code: 201
    input: [expected_member_version]
    output: RequalificationCycle
    side_effects:
      - "Creates a RequalificationCycle with status=OPEN, opened_at=logical clock now, due_at=logical clock now + REQUALIFICATION_WINDOW_DAYS(90) days"
      - "cycle_index = 1 + the greatest existing cycle_index of this member"
      - "increments Member.version by 1"

  - method: POST
    path: "/benefits/members/{member_id}/reinstate"
    description: "Reinstate a lapsed member who still holds at least one adopted product"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["member_status -> MEMBER_ACTIVE", "Recomputes benefit_entitlement_state and churn_risk_score"]

  - method: POST
    path: "/benefits/members/{member_id}/reset-to-prospect"
    description: "Return a lapsed member with no adopted products to PROSPECT"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["member_status -> PROSPECT", "member_since_at -> null", "member_tier -> NONE"]

  - method: POST
    path: "/benefits/members/{member_id}/detect-churn"
    description: "Evaluate the member's churn risk and advance the member machine accordingly"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "Recomputes churn_risk_score"
      - "MEMBER_ACTIVE -> MEMBER_AT_RISK when score >= 60; MEMBER_AT_RISK -> MEMBER_LAPSED when score >= 85"
      - "On entry to MEMBER_AT_RISK creates a QUEUED ChurnNotice notice_type=RATE_STEP_DOWN reason_code=DEPOSIT_STOPPED; on entry to MEMBER_LAPSED steps every GRANTED/PENDING_REQUALIFICATION entitlement down"

  - method: POST
    path: "/benefits/members/{member_id}/entitlements"
    description: "Declare a benefit entitlement unlocked by one of the member's holdings"
    roles: [BenefitsAdmin]
    code: 201
    input: [source_holding_id, benefit_code, value_bps, "governing_rule_id?"]
    output: BenefitEntitlement
    side_effects: ["entitlement_status=PENDING", "Recomputes Member.benefit_entitlement_state"]

  - method: POST
    path: "/benefits/members/{member_id}/entitlements/reconcile"
    description: "Rewrite every entitlement row to its guard verdict and stamp the rollup"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BenefitEntitlement[]
    side_effects: ["Each row's entitlement_status := guard_status(e); reconciliation_state=RECONCILED", "Recomputes Member.benefit_entitlement_state"]

  - method: POST
    path: "/benefits/members/{member_id}/rewards/redeem-principal"
    description: "Spend rewards points against a loan principal"
    roles: [Member]
    code: 201
    input: [loan_account_id, points, "source_event_code?"]
    output: RewardsLedgerEntry
    side_effects:
      - "Appends a RewardsLedgerEntry entry_type=REDEEM_PRINCIPAL, points_delta=-points"
      - "principal_reduction_cents = points // POINTS_PER_CENT (per-entry floor)"
      - "Decrements LoanAccount.principal_cents; refreshes LoanAccount.last_priced_at"

  - method: POST
    path: "/benefits/members/{member_id}/rewards/reconcile"
    description: "Re-derive the member's whole redemption history under the cumulative variant"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: { entries_adjusted: integer, cumulative_reduction_cents: integer }
    side_effects: ["Recomputes calculations.rewards_principal_reduction_cents variant cumulative_retroactive and lifts the newest REDEEM_PRINCIPAL entry by the difference"]

  - method: POST
    path: "/benefits/members/{member_id}/rewards/adjust"
    description: "Post a manual points adjustment"
    roles: [BenefitsAdmin]
    code: 201
    input: [points_delta, source_event_code]
    output: RewardsLedgerEntry
    side_effects: ["Appends a RewardsLedgerEntry entry_type=ADJUST; recomputes Member.rewards_points_balance"]

  # --- ProductHolding ------------------------------------------------------
  - method: POST
    path: "/benefits/holdings"
    description: "Open a product holding in PENDING status"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 201
    input: [member_id, product_line, "balance_cents?"]
    output: ProductHolding
    side_effects: ["adoption_status=PENDING; adopted_at=null; balance defaults to 0", "Recomputes Member.cross_sell_eligibility inputs"]

  - method: GET
    path: "/benefits/holdings"
    description: "List product holdings, filterable by member or line"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer, Underwriter]
    code: 200
    input: ["member_id?", "product_line?", "adoption_status?", "limit?", "offset?"]
    output: ProductHolding[]
    side_effects: []

  - method: GET
    path: "/benefits/holdings/{holding_id}"
    description: "Get one product holding"
    roles: [Member, PlatformAdmin, BenefitsAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: ProductHolding
    side_effects: []

  - method: POST
    path: "/benefits/holdings/{holding_id}/adopt"
    description: "Adopt a pending or suspended product holding"
    roles: [Member]
    code: 200
    input: []
    output: ProductHolding
    side_effects:
      - "adoption_status -> ADOPTED; adopted_at stamped"
      - "Recomputes Member.product_adoption_count, product_line_set, member_tier, churn_risk_score"
      - "PROSPECT -> MEMBER_ACTIVE on the member's first adoption"
      - "PENDING entitlements of this holding -> GRANTED"

  - method: POST
    path: "/benefits/holdings/{holding_id}/suspend"
    description: "Suspend an adopted holding without closing it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductHolding
    side_effects: ["adoption_status -> SUSPENDED", "GRANTED/PENDING_REQUALIFICATION entitlements sourced from this holding -> PENDING_REQUALIFICATION", "Recomputes Member.product_adoption_count and qualifying_deposit_balance_cents"]

  - method: POST
    path: "/benefits/holdings/{holding_id}/close"
    description: "Close a holding permanently"
    roles: [Member]
    code: 200
    input: []
    output: ProductHolding
    side_effects: ["adoption_status -> CLOSED; closed_at stamped", "Entitlements sourced from this holding -> REVOKED", "Recomputes Member.product_adoption_count, product_line_set, member_tier"]

  # --- LoanAccount ---------------------------------------------------------
  - method: POST
    path: "/benefits/loan-accounts"
    description: "Originate a loan account against an adopted LENDING holding"
    roles: [Underwriter, PlatformAdmin]
    code: 201
    input: [member_id, holding_id, loan_type, principal_cents, base_apr_bps]
    output: LoanAccount
    side_effects:
      - "autopay_status=NOT_ENROLLED; pricing_status=PROVISIONAL; discount_stack_bps=0; effective_apr_bps=base_apr_bps; last_priced_at=logical clock now"
      - "ProductHolding.reunderwriting_permitted recomputed for holding_id"

  - method: GET
    path: "/benefits/loan-accounts"
    description: "List loan accounts, filterable by member or holding"
    roles: [PlatformAdmin, BenefitsAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: ["member_id?", "holding_id?", "pricing_status?", "autopay_status?", "limit?", "offset?"]
    output: LoanAccount[]
    side_effects: []

  - method: GET
    path: "/benefits/loan-accounts/{loan_account_id}"
    description: "Get one loan account"
    roles: [Member, PlatformAdmin, Underwriter, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: LoanAccount
    side_effects: []

  - method: POST
    path: "/benefits/loan-accounts/{loan_account_id}/autopay-enrollment"
    description: "Enrol the loan in autopay, or resume a suspended enrolment"
    roles: [Member]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["autopay_status -> ENROLLED", "Recomputes discount_stack_bps and effective_apr_bps; refreshes last_priced_at"]

  - method: POST
    path: "/benefits/loan-accounts/{loan_account_id}/autopay-suspend"
    description: "Suspend autopay on the loan"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["autopay_status -> SUSPENDED", "Recomputes discount_stack_bps and effective_apr_bps; refreshes last_priced_at"]

  - method: POST
    path: "/benefits/loan-accounts/{loan_account_id}/finalize-pricing"
    description: "Promote the loan from PROVISIONAL to FINAL pricing"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["pricing_status -> FINAL", "Freezes discount_stack_bps at the current DiscountApplication snapshots", "Sets ProductHolding.reunderwriting_permitted = true for the linked holding"]

  - method: POST
    path: "/benefits/loan-accounts/{loan_account_id}/applications"
    description: "Attach a rate-discount application to the loan (OCC-guarded against the loan's version)"
    roles: [BenefitsAdmin]
    code: 201
    input: [rule_id, expected_loan_account_version]
    output: DiscountApplication
    side_effects:
      - "Creates a DiscountApplication with applied_bps, window_from and window_to snapshotted from the rule"
      - "Any prior APPLIED application of the same stacking_class -> PREEMPTED with preempted_by_application_id set to the new application"
      - "Recomputes LoanAccount.discount_stack_bps (variant rotb_stored) and effective_apr_bps; refreshes last_priced_at"
      - "increments LoanAccount.version by 1"

  - method: GET
    path: "/benefits/loan-accounts/{loan_account_id}/applications"
    description: "List the discount applications on a loan"
    roles: [PlatformAdmin, BenefitsAdmin, Underwriter, Member]
    code: 200
    input: []
    output: DiscountApplication[]
    side_effects: []

  - method: GET
    path: "/benefits/loan-accounts/{loan_account_id}/pricing-breakdown"
    description: "Loan pricing detail under both the capped and uncapped discount variants"
    roles: [PlatformAdmin, BenefitsAdmin, Underwriter, Member]
    code: 200
    input: []
    output: { stored_bps: integer, uncapped_bps: integer, effective_apr_bps: integer, floor_bps: integer, applied_application_count: integer }
    side_effects: ["Recomputes calculations.discount_stack_total_bps variant uncapped_diagnostic"]

  # --- DiscountApplication -------------------------------------------------
  - method: GET
    path: "/benefits/applications"
    description: "List discount applications, filterable by loan or rule"
    roles: [PlatformAdmin, BenefitsAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: ["loan_account_id?", "rule_id?", "application_state?", "limit?", "offset?"]
    output: DiscountApplication[]
    side_effects: []

  - method: GET
    path: "/benefits/applications/{application_id}"
    description: "Get one discount application"
    roles: [PlatformAdmin, BenefitsAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: DiscountApplication
    side_effects: []

  - method: POST
    path: "/benefits/applications/{application_id}/rollback"
    description: "Roll back an applied discount application"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: DiscountApplication
    side_effects: ["application_state -> ROLLED_BACK", "Recomputes LoanAccount.discount_stack_bps and effective_apr_bps; refreshes last_priced_at"]

  # --- RateDiscountRule ----------------------------------------------------
  - method: GET
    path: "/benefits/rate-discount-rules"
    description: "List discount rules, filterable by kind, status or parent rule"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer, Underwriter]
    code: 200
    input: ["discount_kind?", "status?", "stacks_on_rule_id?", "limit?", "offset?"]
    output: RateDiscountRule[]
    side_effects: []

  - method: GET
    path: "/benefits/rate-discount-rules/{rule_id}"
    description: "Get one discount rule"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer, Underwriter]
    code: 200
    input: []
    output: RateDiscountRule
    side_effects: []

  - method: POST
    path: "/benefits/rate-discount-rules"
    description: "Create a discount rule in DRAFT"
    roles: [BenefitsAdmin]
    code: 201
    input: [rule_code, discount_kind, stacking_class, discount_bps, effective_from, effective_to, "stacks_on_rule_id?", "requires_direct_deposit?", "min_member_tier?"]
    output: RateDiscountRule
    side_effects: ["status=DRAFT"]

  - method: PUT
    path: "/benefits/rate-discount-rules/{rule_id}"
    description: "Edit a draft rule's stacking link, magnitude or end of window"
    roles: [BenefitsAdmin]
    code: 200
    input: ["stacks_on_rule_id?", "discount_bps?", "effective_to?"]
    output: RateDiscountRule
    side_effects: ["Only available while DRAFT", "Re-validates the whole stacks_on_rule_id graph for cycles and for stacking_class agreement"]

  - method: POST
    path: "/benefits/rate-discount-rules/{rule_id}/activate"
    description: "Activate a draft rule"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: RateDiscountRule
    side_effects: ["status -> ACTIVE", "Reprices every affected LoanAccount: discount_stack_bps and effective_apr_bps recomputed"]

  - method: POST
    path: "/benefits/rate-discount-rules/{rule_id}/retire"
    description: "Retire an active rule"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: RateDiscountRule
    side_effects: ["status -> RETIRED", "Every APPLIED DiscountApplication referencing this rule with applied_at < logical clock now -> ROLLED_BACK", "Reprices every affected LoanAccount"]

  # --- DirectDepositEnrollment --------------------------------------------
  - method: POST
    path: "/benefits/deposit-enrollments"
    description: "Open a direct-deposit enrolment in PENDING_VERIFICATION status"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 201
    input: [member_id, required_monthly_amount_cents]
    output: DirectDepositEnrollment
    side_effects: ["status=PENDING_VERIFICATION; qualified_at=null; missed_cycle_count=0; consecutive_qualifying_months=0"]

  - method: GET
    path: "/benefits/deposit-enrollments"
    description: "List deposit enrolments, filterable by member"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: DirectDepositEnrollment[]
    side_effects: []

  - method: GET
    path: "/benefits/deposit-enrollments/{enrollment_id}"
    description: "Get one deposit enrolment"
    roles: [Member, PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: DirectDepositEnrollment
    side_effects: []

  - method: POST
    path: "/benefits/deposit-enrollments/{enrollment_id}/activate"
    description: "Activate a pending or lapsed enrolment once a qualifying posting exists"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DirectDepositEnrollment
    side_effects:
      - "status -> ACTIVE; qualified_at stamped; missed_cycle_count reset to 0"
      - "Recomputes requalification_due_at and consecutive_qualifying_months"
      - "DIRECT_DEPOSIT entitlements -> GRANTED with value_bps restored to the full rule magnitude"
      - "Each BANKING holding of the member -> deposit_rate_eligible recomputed to true"
      - "Reprices every LoanAccount of the member; QUEUED RATE_STEP_DOWN notices VOIDED and a QUEUED RATE_STEP_UP notice created"

  - method: POST
    path: "/benefits/deposit-enrollments/{enrollment_id}/lapse"
    description: "Lapse a failing enrolment, or move an ACTIVE one with a missed cycle into GRACE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DirectDepositEnrollment
    side_effects:
      - "ACTIVE with missed_cycle_count >= 1 -> GRACE; grace_deadline_at stamped; a QUEUED REQUALIFICATION_REMINDER notice is created"
      - "GRACE past grace_deadline_at -> LAPSED; DIRECT_DEPOSIT entitlements -> STEPPED_DOWN with value_bps reduced by DEPOSIT_STEP_DOWN_BPS"
      - "Each BANKING holding -> deposit_rate_eligible recomputed"
      - "Every LoanAccount carrying a requires_direct_deposit rule is repriced; its FINAL pricing_status -> STEPPED_DOWN; a QUEUED RATE_STEP_DOWN notice is created"

  # --- BenefitEntitlement --------------------------------------------------
  - method: GET
    path: "/benefits/benefit-entitlements"
    description: "List entitlements, filterable by member, benefit or source holding"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: ["member_id?", "benefit_code?", "entitlement_status?", "source_holding_id?", "governing_rule_id?", "limit?", "offset?"]
    output: BenefitEntitlement[]
    side_effects: []

  - method: GET
    path: "/benefits/benefit-entitlements/{entitlement_id}"
    description: "Get one entitlement"
    roles: [Member, PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: BenefitEntitlement
    side_effects: []

  - method: POST
    path: "/benefits/benefit-entitlements/{entitlement_id}/step-down"
    description: "Step an entitlement's value down without revoking it"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: BenefitEntitlement
    side_effects: ["entitlement_status -> STEPPED_DOWN; stepped_down_at stamped", "Reprices every LoanAccount of the member"]

  - method: POST
    path: "/benefits/benefit-entitlements/{entitlement_id}/restore"
    description: "Restore a stepped-down entitlement to its full value"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: BenefitEntitlement
    side_effects: ["entitlement_status -> GRANTED; value_bps restored from the governing rule; granted_at stamped", "Every STEPPED_DOWN LoanAccount -> FINAL and repriced"]

  - method: POST
    path: "/benefits/benefit-entitlements/{entitlement_id}/request-override"
    description: "Queue a compliance override on a stepped-down entitlement"
    roles: [BenefitsAdmin]
    code: 200
    input: [override_reason]
    output: BenefitEntitlement
    side_effects: ["override_requested_by := acting X-User-ID"]

  - method: POST
    path: "/benefits/benefit-entitlements/{entitlement_id}/approve-override"
    description: "Approve a queued override; the approver must differ from the requester"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BenefitEntitlement
    side_effects: ["override_approved_by := acting X-User-ID", "When both override fields are set the entitlement restores to GRANTED and priceable rules flow back into the stack"]

  # --- RewardsLedgerEntry --------------------------------------------------
  - method: GET
    path: "/benefits/rewards-ledger-entries"
    description: "List rewards ledger entries, filterable by member or loan"
    roles: [PlatformAdmin, BenefitsAdmin, Member]
    code: 200
    input: ["member_id?", "loan_account_id?", "entry_type?", "entry_status?", "limit?", "offset?"]
    output: RewardsLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/benefits/rewards-ledger-entries/{entry_id}"
    description: "Get one rewards ledger entry"
    roles: [PlatformAdmin, BenefitsAdmin, Member]
    code: 200
    input: []
    output: RewardsLedgerEntry
    side_effects: []

  - method: POST
    path: "/benefits/rewards-ledger-entries/{entry_id}/reverse"
    description: "Reverse a posted earning or principal redemption"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: RewardsLedgerEntry
    side_effects:
      - "entry_status -> REVERSED; a compensating REVERSE entry is appended and linked both ways"
      - "Recomputes Member.rewards_points_balance"
      - "For a REDEEM_PRINCIPAL reversal the linked LoanAccount.principal_cents is increased by the original principal_reduction_cents and the principal band softens, so the member-tier discount band is re-derived"

  # --- RequalificationCycle -----------------------------------------------
  - method: GET
    path: "/benefits/requalification-cycles"
    description: "List requalification cycles, filterable by member"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: RequalificationCycle[]
    side_effects: []

  - method: GET
    path: "/benefits/requalification-cycles/{cycle_id}"
    description: "Get one requalification cycle"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer, Member]
    code: 200
    input: []
    output: RequalificationCycle
    side_effects: []

  - method: POST
    path: "/benefits/requalification-cycles/{cycle_id}/evaluate"
    description: "Evaluate an open cycle; outcome is PASSED or FAILED from the qualifying month count"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RequalificationCycle
    side_effects:
      - "status -> PASSED when qualifying_month_count >= 3, else FAILED; evaluated_at stamped"
      - "On PASSED: entitlements in PENDING_REQUALIFICATION -> GRANTED; PROVISIONAL loans -> FINAL; member MEMBER_AT_RISK -> MEMBER_ACTIVE"
      - "On FAILED: FINAL loans -> PROVISIONAL; GRANTED LOAN_RATE_DISCOUNT entitlements -> PENDING_REQUALIFICATION"

  - method: POST
    path: "/benefits/requalification-cycles/{cycle_id}/open-remediation"
    description: "Open a remediation window on a failed cycle"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RequalificationCycle
    side_effects: ["status -> REMEDIATION; due_at extended by REMEDIATION_WINDOW_DAYS(30) days; a QUEUED REQUALIFICATION_REMINDER notice is created"]

  - method: POST
    path: "/benefits/requalification-cycles/{cycle_id}/close"
    description: "Close a resolved cycle and open the successor"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RequalificationCycle
    side_effects: ["status -> CLOSED; a successor cycle with cycle_index + 1 opens at the logical clock and due_at 90 days out"]

  # --- ChurnNotice ---------------------------------------------------------
  - method: GET
    path: "/benefits/churn-notices"
    description: "List churn notices, filterable by member"
    roles: [PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: ["member_id?", "notice_type?", "status?", "limit?", "offset?"]
    output: ChurnNotice[]
    side_effects: []

  - method: GET
    path: "/benefits/churn-notices/{notice_id}"
    description: "Get one churn notice"
    roles: [Member, PlatformAdmin, BenefitsAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ChurnNotice
    side_effects: []

  - method: POST
    path: "/benefits/churn-notices/{notice_id}/send"
    description: "Dispatch a queued notice"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ChurnNotice
    side_effects: ["status -> SENT"]

  - method: POST
    path: "/benefits/churn-notices/{notice_id}/acknowledge"
    description: "Member acknowledges a sent notice"
    roles: [Member]
    code: 200
    input: []
    output: ChurnNotice
    side_effects: ["status -> ACKNOWLEDGED"]

  # --- CoachingSession ----------------------------------------------------
  - method: GET
    path: "/benefits/coaching-sessions"
    description: "List coaching sessions, filterable by member or coach"
    roles: [PlatformAdmin, BenefitsAdmin, Member]
    code: 200
    input: ["member_id?", "coach_ref?", "session_kind?", "status?", "limit?", "offset?"]
    output: CoachingSession[]
    side_effects: []

  - method: GET
    path: "/benefits/coaching-sessions/{session_id}"
    description: "Get one coaching session"
    roles: [Member, PlatformAdmin, BenefitsAdmin]
    code: 200
    input: []
    output: CoachingSession
    side_effects: []

  - method: POST
    path: "/benefits/coaching-sessions"
    description: "Book a career-coaching session or a member event seat; the FIRST booking on a coach_ref and interval establishes that event's capacity_total"
    roles: [BenefitsAdmin]
    code: 201
    input: [member_id, coach_ref, session_kind, starts_at, ends_at, "capacity_total?"]
    output: CoachingSession
    side_effects: ["status=SCHEDULED; recomputes seats_reserved for every non-CANCELLED session sharing the coach_ref"]

  - method: POST
    path: "/benefits/coaching-sessions/{session_id}/confirm"
    description: "Member confirms attendance"
    roles: [Member]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/benefits/coaching-sessions/{session_id}/complete"
    description: "Mark a confirmed session complete"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["status -> COMPLETED", "For CAREER_COACHING a RewardsLedgerEntry EARN of 250 points is appended; Member.rewards_points_balance recomputed"]

  - method: POST
    path: "/benefits/coaching-sessions/{session_id}/cancel"
    description: "Cancel a session"
    roles: [Member]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["status -> CANCELLED; recomputes seats_reserved"]

  # --- CrossSellCheck ------------------------------------------------------
  - method: GET
    path: "/benefits/cross-sell-checks"
    description: "List cross-sell checks, filterable by member"
    roles: [PlatformAdmin, ComplianceOfficer, BenefitsAdmin]
    code: 200
    input: ["member_id?", "target_product_line?", "status?", "limit?", "offset?"]
    output: CrossSellCheck[]
    side_effects: []

  - method: GET
    path: "/benefits/cross-sell-checks/{check_id}"
    description: "Get one cross-sell check"
    roles: [PlatformAdmin, ComplianceOfficer, BenefitsAdmin]
    code: 200
    input: []
    output: CrossSellCheck
    side_effects: []

  - method: POST
    path: "/benefits/cross-sell-checks"
    description: "Open a cross-sell eligibility check for a member and target line"
    roles: [BenefitsAdmin]
    code: 201
    input: [member_id, target_product_line, "consent_recorded?"]
    output: CrossSellCheck
    side_effects: ["status=PENDING", "Computes underwriting_reuse_permitted and conditioning_blocked"]

  - method: POST
    path: "/benefits/cross-sell-checks/{check_id}/decide"
    description: "Record the compliance decision on a check"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: CrossSellCheck
    side_effects:
      - "status -> CLEARED | BLOCKED | REUSE_PROHIBITED; decided_at and decided_by stamped"
      - "CLEARED sets cross_sell_eligible true for holdings of the target line; BLOCKED sets it false; REUSE_PROHIBITED sets reunderwriting_permitted false for every LENDING holding"

# =============================================================================
# §1.6 Error Code Catalog (32 codes)
# =============================================================================
errors:

  # --- auth ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is undeclared, or declared but not listed on the endpoint, or the acting identity is not the owning member on an ownership-guarded endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ComplianceOfficer approving an override carries the same X-User-ID as the BenefitsAdmin who requested it"

  # --- existence ---
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id in the path does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "holding_id, loan_account_id, enrollment_id, entitlement_id, rule_id, application_id, entry_id, cycle_id, notice_id, check_id or session_id in the path does not resolve"

  # --- state ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version in the body differs from the parent entity's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state that permits the requested transition"
  - id: ERR_HOLDING_NOT_ADOPTED
    http: 409
    condition: "A benefit or discount application is claimed against a holding whose adoption_status is not ADOPTED"

  # --- business_safety / compliance ---
  - id: ERR_CREDIT_CONDITIONING_BLOCKED
    http: 422
    condition: "A cross-sell decision would condition credit on the purchase of a BANKING or INVESTING product without consent"
  - id: ERR_REUSE_UNDERWRITING_PROHIBITED
    http: 422
    condition: "Underwriting reuse is requested for a target line with no FINAL-priced LENDING holding"
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "A cross-sell decision is attempted with consent_recorded false on a non-LENDING target line"
  - id: ERR_OVERRIDE_NOT_PERMITTED
    http: 422
    condition: "An override is requested outside its window or by a role other than BenefitsAdmin"

  # --- business_constraint ---
  - id: ERR_STACK_CLASS_CONFLICT
    http: 409
    condition: "A stacking conflict between two rules of the same stacking_class has not been declared"
  - id: ERR_DUPLICATE_DISCOUNT_APPLICATION
    http: 409
    condition: "An APPLIED DiscountApplication already occupies the same (loan_account_id, rule_id) pair"
  - id: ERR_RULE_WINDOW_OVERLAP
    http: 409
    condition: "A rule's validity window overlaps a non-RETIRED rule's window with a gap below OVERLAP_MIN_GAP_DAYS"
  - id: ERR_DUPLICATE_RULE_CODE
    http: 409
    condition: "rule_code already exists, in any status"
  - id: ERR_SELF_STACK_CYCLE
    http: 422
    condition: "The stacks_on_rule_id chain revisits a rule"
  - id: ERR_BENEFIT_ALREADY_GRANTED
    http: 409
    condition: "A restore is requested on an entitlement already in status GRANTED"
  - id: ERR_DUPLICATE_ENTITLEMENT
    http: 409
    condition: "Two entitlement rows would share (member_id, benefit_code, source_holding_id)"

  # --- business_temporal ---
  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "Two non-CANCELLED sessions on the same coach_ref have closed intervals that overlap"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "A rule carrying requires_direct_deposit is priced while the enrollment status is not ACTIVE"
  - id: ERR_GRACE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "An enrolment is lapsed from GRACE before grace_deadline_at"
  - id: ERR_REQUALIFICATION_WINDOW_OPEN
    http: 409
    condition: "A requalification cycle is evaluated before its due_at"

  # --- business_fiscal ---
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: "The requested redemption exceeds Member.rewards_points_balance"
  - id: ERR_REDEMPTION_LIMIT_EXCEEDED
    http: 422
    condition: "A single redemption sits outside [MIN_REDEEM_POINTS, MAX_REDEEM_POINTS_PER_ENTRY]"
  - id: ERR_PRINCIPAL_BELOW_ZERO
    http: 422
    condition: "A redemption would drive LoanAccount.principal_cents below zero"
  - id: ERR_STACK_CAP_EXCEEDED
    http: 422
    condition: "A discount-application request asks to store an uncapped stack above STACK_CAP_BPS instead of accepting the applied cap"

  # --- business_referential ---
  - id: ERR_HOLDING_HAS_ACTIVE_LOAN
    http: 409
    condition: "A LENDING holding is closed while a LoanAccount on it sits in PROVISIONAL, FINAL or STEPPED_DOWN"
  - id: ERR_ENTITLEMENT_NO_SOURCE_HOLDING
    http: 422
    condition: "An entitlement names a source_holding_id that is missing or belongs to another member"
  - id: ERR_ACTIVE_RULE_ON_UNPRICED_LOAN
    http: 422
    condition: "A rule is activated while some LoanAccount references a holding that does not exist"

  # --- envelope / request ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unknown field, or a value outside its declared type or enum"
  - id: ERR_SESSION_CAPACITY_SATURATED
    http: 409
    condition: "A MEMBER_EVENT session's overlapping non-CANCELLED bookings on the same coach_ref have reached capacity_total"

roles:

  - name: Member
    description: "A consumer holding products. Acts on their own member-scoped resources only."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /benefits/holdings/{holding_id}/adopt"
      - "POST /benefits/holdings/{holding_id}/close"
      - "POST /benefits/members/{member_id}/rewards/redeem-principal"
      - "POST /benefits/loan-accounts/{loan_account_id}/autopay-enrollment"
      - "POST /benefits/churn-notices/{notice_id}/acknowledge"
      - "POST /benefits/coaching-sessions/{session_id}/confirm"
      - "POST /benefits/coaching-sessions/{session_id}/cancel"
    shared_operations:
      - "GET /benefits/members/{member_id}"
      - "GET /benefits/members/{member_id}/tier-projection"
      - "GET /benefits/members/{member_id}/benefit-summary"
      - "GET /benefits/members/{member_id}/rewards-balance"
      - "GET /benefits/holdings/{holding_id}"
      - "GET /benefits/loan-accounts/{loan_account_id}"
      - "GET /benefits/loan-accounts/{loan_account_id}/applications"
      - "GET /benefits/loan-accounts/{loan_account_id}/pricing-breakdown"
      - "GET /benefits/deposit-enrollments/{enrollment_id}"
      - "GET /benefits/benefit-entitlements/{entitlement_id}"
      - "GET /benefits/requalification-cycles/{cycle_id}"
      - "GET /benefits/churn-notices/{notice_id}"
      - "GET /benefits/coaching-sessions/{session_id}"
      - "GET /benefits/rewards-ledger-entries/{entry_id}"

  - name: Underwriter
    description: "Pricing authority for lending products. Owns loan finalization and consumes cross-sell re-underwriting verdicts."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/loan-accounts/{loan_account_id}/finalize-pricing"
    shared_operations:
      - "GET /benefits/members/{member_id}"
      - "GET /benefits/holdings"
      - "GET /benefits/holdings/{holding_id}"
      - "GET /benefits/loan-accounts"
      - "GET /benefits/loan-accounts/{loan_account_id}"
      - "GET /benefits/loan-accounts/{loan_account_id}/applications"
      - "GET /benefits/loan-accounts/{loan_account_id}/pricing-breakdown"
      - "GET /benefits/applications"
      - "GET /benefits/applications/{application_id}"
      - "GET /benefits/rate-discount-rules"
      - "GET /benefits/rate-discount-rules/{rule_id}"

  - name: BenefitsAdmin
    description: "Benefits operations. Configures rate-discount rules, grants and restores entitlements, runs rewards reconciliation, books coaching. May request but never approve a compliance override."
    identity: "opaque"
    exclusive_operations:
      - "POST /benefits/rate-discount-rules"
      - "POST /benefits/rate-discount-rules/{rule_id}/activate"
      - "POST /benefits/rate-discount-rules/{rule_id}/retire"
      - "POST /benefits/members/{member_id}/entitlements"
      - "POST /benefits/loan-accounts/{loan_account_id}/applications"
      - "POST /benefits/applications/{application_id}/rollback"
      - "POST /benefits/benefit-entitlements/{entitlement_id}/step-down"
      - "POST /benefits/benefit-entitlements/{entitlement_id}/restore"
      - "POST /benefits/benefit-entitlements/{entitlement_id}/request-override"
      - "POST /benefits/members/{member_id}/rewards/reconcile"
      - "POST /benefits/members/{member_id}/rewards/adjust"
      - "POST /benefits/rewards-ledger-entries/{entry_id}/reverse"
      - "POST /benefits/coaching-sessions"
      - "POST /benefits/cross-sell-checks"
    shared_operations:
      - "GET /benefits/members"
      - "GET /benefits/members/{member_id}"
      - "GET /benefits/members/{member_id}/tier-projection"
      - "GET /benefits/members/{member_id}/deposit-rate-projection"
      - "GET /benefits/members/{member_id}/benefit-summary"
      - "GET /benefits/holdings"
      - "GET /benefits/holdings/{holding_id}"
      - "GET /benefits/loan-accounts"
      - "GET /benefits/loan-accounts/{loan_account_id}"
      - "GET /benefits/loan-accounts/{loan_account_id}/applications"
      - "GET /benefits/loan-accounts/{loan_account_id}/pricing-breakdown"
      - "GET /benefits/applications"
      - "GET /benefits/applications/{application_id}"
      - "GET /benefits/rate-discount-rules"
      - "GET /benefits/rate-discount-rules/{rule_id}"
      - "GET /benefits/deposit-enrollments"
      - "GET /benefits/deposit-enrollments/{enrollment_id}"
      - "GET /benefits/benefit-entitlements"
      - "GET /benefits/benefit-entitlements/{entitlement_id}"
      - "GET /benefits/requalification-cycles"
      - "GET /benefits/requalification-cycles/{cycle_id}"
      - "GET /benefits/churn-notices"
      - "GET /benefits/churn-notices/{notice_id}"
      - "GET /benefits/rewards-ledger-entries"
      - "GET /benefits/rewards-ledger-entries/{entry_id}"
      - "GET /benefits/coaching-sessions"
      - "GET /benefits/coaching-sessions/{session_id}"
      - "GET /benefits/cross-sell-checks"
