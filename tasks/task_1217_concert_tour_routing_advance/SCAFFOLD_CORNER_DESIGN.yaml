        distinguishing_aspect: "Confirm with expected_tour_version one behind current returns 412 ERR_STALE_TOUR_VERSION."
        test_recipe:
          setup: ["Show in HOLD_PLACED, tour version observed, another show confirmed first (bumps version)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "T", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tid: $.data.id }
