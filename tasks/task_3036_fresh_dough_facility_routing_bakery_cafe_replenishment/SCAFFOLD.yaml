# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role lacks permission for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK reference does not exist, or belongs to a different parent" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in a state that does not permit this transition" }
  - { id: ERR_ORDER_LOCKED, http: 409, condition: "Order is LOCKED or later; amend/cancel no longer allowed" }
  - { id: ERR_PLAN_LOCKED, http: 409, condition: "Production plan is LOCKED or later; new orders cannot attach" }
  - { id: ERR_ORDER_CUTOFF_PASSED, http: 409, condition: "Current cafe-local time is at/after the dough type's order cutoff on the day before production_date" }
  - { id: ERR_SUBSTITUTION_FORBIDDEN, http: 422, condition: "Short shipment cannot be filled by another dough type when substitution_allowed is false" }
  - { id: ERR_SHELF_LIFE_EXCEEDED, http: 422, condition: "Bake start at/after production_date 00:00 local + shelf_life_hours" }
  - { id: ERR_STOP_WINDOW_VIOLATION, http: 422, condition: "Planned or actual arrival falls outside (window_start_local, window_end_local], or two stops on one cafe overlap" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "cafe.credit_balance_cents + provisional invoice total would exceed credit_limit_cents" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Plan lock would exceed effective_capacity_units, or route load exceeds vehicle_capacity_units" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: plan per (facility,date), schedule per (cafe,date), or ACTIVE adjustment per (cafe,date)" }
  - { id: ERR_TOO_EARLY, http: 409, condition: "Proof/bake start attempted before the scheduled instant" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed or out-of-range input field (enum, positive-integer, date format)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FacilityPlanner
    description: "Owns facilities, dough types, production plans, and demand adjustments"
    identity: "opaque"
    exclusive_operations:
      - "POST /dough-ops/facilities"
      - "POST /dough-ops/dough-types"
      - "POST /dough-ops/cafes"
      - "POST /dough-ops/demand-adjustments and rescind"
      - "production plan create/lock/release/close"
    shared_operations:
      - "GET endpoints"
      - "POST /dough-ops/_clock/set_current_utc"

  - name: RouteDispatcher
    description: "Owns routes, stops, and arrival logging"
    identity: "opaque"
    exclusive_operations:
      - "route create/publish/depart/cancel"
      - "route stop create/arrive"
    shared_operations:
      - "GET endpoints"
      - "POST /dough-ops/_clock/set_current_utc"

  - name: CafeManager
    description: "Operates one cafe: orders, schedules, bake entries"
    identity: "entity_backed:Cafe"
    exclusive_operations:
      - "order create/submit/amend/cancel for own cafe"
      - "schedule create/open/close for own cafe"
      - "bake entry create/start-proof/start-bake/complete/discard for own cafe"
    shared_operations:
      - "GET endpoints"
      - "POST /dough-ops/_clock/set_current_utc"

  - name: DonationCoordinator
    description: "Logs and confirms day-end donation pickups"
    identity: "opaque"
    exclusive_operations:
      - "donation pickup create/confirm/void"
    shared_operations:
      - "GET endpoints"
      - "POST /dough-ops/_clock/set_current_utc"

  - name: FinanceAdmin
    description: "Owns billing periods, settlement lines, and payments"
    identity: "opaque"
    exclusive_operations:
      - "billing period create/close/settle"
      - "settlement line create"
      - "POST /dough-ops/cafes/{cafe_id}/payments"
    shared_operations:
      - "GET endpoints"
      - "POST /dough-ops/_clock/set_current_utc"
