  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: success_envelope_shape_on_create
        claim_type: standard_crud
        grounds: ["response_envelope", "endpoints[POST /mi/lenders]"]
        distinguishing_aspect: "A 201 response wraps data in the fixed envelope: meta.api_request_id and meta.api_request_timestamp present, response_type 'object', data holding the Lender."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mi/lenders", payload: { legal_name: "Envelope Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin }
          assert:
            - "response status == 201"
            - "response.meta.api_request_id is present"
            - "response.meta.api_request_timestamp is present"
            - "response.response_type == object"
            - "response.data.legal_name == Envelope Co"

      - name: error_envelope_shape_on_failure
        claim_type: standard_crud
        grounds: ["response_envelope", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A 404 response uses the error envelope: response_type 'error' and data.error_id / data.message populated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mi/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin }
          assert:
            - "response.response_type == error"
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.data.message is present"

      - name: clock_set_endpoint_returns_current_utc
        claim_type: standard_crud
        grounds: ["endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "POST /_clock/set_current_utc returns 200 with data.current_utc echoing the new logical time."
        test_recipe:
          setup: ["empty database; clock at startup default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T12:00:00Z" }, as: PlatformAdmin }
          assert:
            - "response status == 200"
            - "response.data.current_utc == 2026-10-15T12:00:00Z"

      - name: filings_list_reverse_reachable_from_lender
        claim_type: standard_crud
        grounds: ["endpoints[GET /mi/lenders/{lenderId}/financial-filings]", "entities.FinancialFiling.fields.lender_id"]
        distinguishing_aspect: "GET /mi/lenders/{id}/financial-filings returns the lender's filings as an array (reverse reachability for the FinancialFiling.lender_id FK): two created filings both appear."
        test_recipe:
          setup: ["one lender with two SUBMITTED filings"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "List Filing Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2024-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_1: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v2: $.data.version } }
