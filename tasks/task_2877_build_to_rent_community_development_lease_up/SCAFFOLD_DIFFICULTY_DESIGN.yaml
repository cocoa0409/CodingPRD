              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c2}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { c2_v1: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c2}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${c2_v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /phases"
              payload: { community_id: "${c2}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 4, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph2: $.data.id }
            - call: "POST /phases/${ph2}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph2}", lot_number: "L1", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs5: $.data.id }
            - call: "POST /homesites/${hs5}/occupancy-certificates"
              payload: { occupancy_certificate_number: "CO-BC-L1", issued_at: "2026-08-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /phases/${ph2}/section-releases"
              payload: { homesite_ids: ["${hs5}"] }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /households"
              payload: { primary_applicant_name: "Cara Diaz", email: "cara@example.com", household_size: 4, monthly_income_cents: 1200000, credit_tier: "A" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { hh3: $.data.id }
            - call: "POST /leases"
              payload: { homesite_id: "${hs5}", household_id: "${hh3}", term_months: 12, start_date: "2026-08-01T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { l3: $.data.id }
            - call: "POST /leases/${l3}/submissions"
              payload: {}
              as: LeasingAgent
              as_user_id: "u_la_1"
            - call: "POST /leases/${l3}/signature"
              payload: { signed_by_name: "Cara Diaz" }
              as: Household
              as_user_id: "${hh3}"
