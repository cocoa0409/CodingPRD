  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: berth_season_overlap_half_open_reassign_conflict
        grounds:
          - validations[priority=8]
          - errors[ERR_BERTH_SEASON_CONFLICT]
          - state_machines.Permit.OFFERED_to_ACTIVE
        distinguishing_aspect: |
          Berth resource, half-open [season_start,season_end) semantics (adjacency allowed): reassigning permitB
          onto a berth already OCCUPIED by permitA for the same (overlapping) season is rejected — geometric
          overlap on the berth's occupancy interval.
