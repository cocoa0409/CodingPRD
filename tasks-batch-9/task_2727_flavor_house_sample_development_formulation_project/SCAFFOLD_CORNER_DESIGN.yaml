          - errors.ERR_INVALID_INTERVAL
          - errors.ERR_RETENTION_PERIOD_TOO_SHORT
        distinguishing_aspect: "A 90-day interval 2026-08-01 -> 2026-10-30 is admitted (equality), a reversed interval returns ERR_INVALID_INTERVAL from priority 65 rather than the shorter-than-90-days error, and an 89-day interval 2026-08-01 -> 2026-10-29 returns ERR_RETENTION_PERIOD_TOO_SHORT."
