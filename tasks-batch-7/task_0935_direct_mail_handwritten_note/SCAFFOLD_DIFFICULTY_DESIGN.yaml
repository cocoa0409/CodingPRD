  - rule_id: resource_temporal_overlap
    instances:

      - name: machine_day_aggregate_capacity_contention
        grounds:
          - calculations.machine_day_capacity_utilization
          - validations[priority=39]
          - entities.WritingMachine.fields.daily_capacity_minutes
          - entities.ProductionRun.fields.run_date
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY over a discrete machine-day bucket on the resource
          WritingMachine. Two 13-minute reservations on 2026-06-05 sum to 26 and breach a 25-minute
          day, yet the identical second reservation on 2026-06-06 is accepted — the buckets never
          overlap across dates and there is no adjacency rule at all.
