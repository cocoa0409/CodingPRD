  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: quarterly_cap_straddle_across_two_transactions
        claim_type: Constants Applied
        grounds: [calculations.points_earning, entities.QuarterlyCategory.fields.bonus_cap_cents]
        distinguishing_aspect: "Per-quarter bonus_cap_cents 50000 is shared across the account's quarterly spend: first 40000 fully bonused (2000 pts), second 30000 gets only 10000 cap-remaining bonused (700 pts)."
        test_recipe:
          setup: ["Product base 100bps, quarterly GROCERY 500bps cap 50000 in 2026-Q3; account activated; tier 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Q Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 365, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /quarterly-categories"
              payload: { card_product_id: "${prod_id}", code: "GROCERY", quarter_label: "2026-Q3", window_start: "2026-07-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", earn_multiplier_bps: 500, bonus_cap_cents: 50000 }
              as: ProgramAdmin
              captures: { qcat_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /category-activations"
              payload: { card_account_id: "${acct_id}", quarterly_category_id: "${qcat_id}" }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 40000, category_code: "GROCERY", transacted_at: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /transactions/${g1_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 30000, category_code: "GROCERY", transacted_at: "2026-07-06T00:00:00Z" }
              as: ProgramAdmin
              captures: { g2_id: $.data.id }
