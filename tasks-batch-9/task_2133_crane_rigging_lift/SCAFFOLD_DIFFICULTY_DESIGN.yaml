          Interval semantics A, on the Crane resource: the occupied interval is half-open
          [window_start, window_end + 12h). Plan A ends 2026-09-10T16:00Z so the crane is blocked
          through 2026-09-11T04:00Z; a plan starting 2026-09-11T03:00Z is rejected while one
