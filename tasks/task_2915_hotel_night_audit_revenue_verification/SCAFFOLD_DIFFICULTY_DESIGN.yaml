        grounds: "§1.5 POST /night-audit/allowances/{id}/approve side effects; §1.2 Allowance SUBMITTED -> APPROVED -> POSTED and RevenueReport DISTRIBUTED -> SUPERSEDED; §1.3 calculations folio_balance and occupancy_statistics; §1.0 complexity_layers cascading_side_effects."
