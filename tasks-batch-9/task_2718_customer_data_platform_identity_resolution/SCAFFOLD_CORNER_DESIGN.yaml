      - name: dispatch_by_data_engineer_returns_unauthorized
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        excluded_because:
          difficulty_instance: dispatch_conflict_unauthorized_outranks_invalid_state
          rationale: "That §1.8 instance dispatches a TERMINATED activation as DataEngineer and asserts 403 ERR_UNAUTHORIZED rather than the 409 the state would justify, which triggers this error at its own rung."

      - name: dispatch_on_terminated_activation_returns_invalid_state
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_STATE]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: dispatch_conflict_unauthorized_outranks_invalid_state
          rationale: "The same §1.8 instance repeats the dispatch as the authorised SegmentAnalyst and asserts 409 ERR_INVALID_STATE, so the state rung is triggered there with the role rung satisfied."

      - name: propagate_under_active_legal_hold_returns_blocked
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LEGAL_HOLD_ACTIVE]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: deletion_propagate_depends_on_suppression_legal_hold_state
          rationale: "That §1.8 instance propagates a deletion request while a LEGAL_HOLD suppression is ACTIVE and asserts both the 409 ERR_LEGAL_HOLD_ACTIVE answer and the BLOCKED_LEGAL_HOLD audit state."

      - name: dispatch_with_expired_governance_returns_not_approved
        claim_type: error_triggerable
        grounds:
          - errors[ERR_GOVERNANCE_NOT_APPROVED]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: activation_dispatch_depends_on_segment_governance_state
          rationale: "That §1.8 instance dispatches once past governance_expires_at and asserts 409 ERR_GOVERNANCE_NOT_APPROVED, covering the only rung this error has."

      - name: dispatch_below_k_anonymity_floor_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_AUDIENCE_BELOW_K_ANONYMITY]
          - validations[priority=33]
        excluded_because:
          difficulty_instance: dispatch_conflict_k_anonymity_outranks_hash_quota
          rationale: "That §1.8 instance dispatches an audience of 2 against min_audience_size 3 and asserts 422 ERR_AUDIENCE_BELOW_K_ANONYMITY ahead of the quota rung."

      - name: link_below_review_floor_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONFIDENCE_BELOW_FLOOR]
          - validations[priority=40]
        excluded_because:
          difficulty_instance: confidence_exactly_at_review_floor_creates_link
          rationale: "That §1.8 instance pairs the inclusive accept at exactly review_floor with a one-hundredth-lower evidence set that answers 422 ERR_CONFIDENCE_BELOW_FLOOR."

      - name: overlapping_suppression_window_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SUPPRESSION_WINDOW_OVERLAP]
          - validations[priority=45]
        excluded_because:
          difficulty_instance: suppression_half_open_window_touching_is_accepted
          rationale: "That §1.8 instance accepts the touching half-open window and then, one second earlier, asserts 409 ERR_SUPPRESSION_WINDOW_OVERLAP, so both sides of the boundary are covered."

      - name: activation_inside_cooldown_gap_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ACTIVATION_COOLDOWN_VIOLATION]
          - validations[priority=46]
        excluded_because:
          difficulty_instance: destination_cooldown_closed_interval_gap_boundary
          rationale: "That §1.8 instance refuses a disjoint window 30 minutes after the previous end against cooldown_minutes 60 with 409 ERR_ACTIVATION_COOLDOWN_VIOLATION, then accepts the window at exactly +60."

      - name: dispatch_beyond_remaining_hash_quota_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HASH_QUOTA_EXCEEDED]
          - validations[priority=48]
        excluded_because:
          difficulty_instance: dispatch_conflict_k_anonymity_outranks_hash_quota
          rationale: "That §1.8 instance repairs the k-anonymity violation and re-dispatches against an exhausted daily_hash_quota, asserting 409 ERR_HASH_QUOTA_EXCEEDED at its own rung."

  # ===========================================================================
  # SECTION 7 — RBAC (seven peer roles with exclusive operations, a universally
  # shared read surface, an actor-bound platform role and segregation of duties)
  # ===========================================================================
  - section: rbac
    instances:
      - name: data_engineer_cannot_create_segment_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.SegmentAnalyst.exclusive_operations
          - roles.DataEngineer.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Peer roles do not overlap: DataEngineer owns ingestion end to end yet cannot create a segment, and SegmentAnalyst — who owns segments — cannot submit an ingest batch, so neither role is a superset of the other."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One REGISTERED SourceSystem so the second probe has a valid FK to name."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "RB_PEER"
                display_name: "Peer Role Feed"
                channel_type: "WEB"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/segments"
              payload:
                name: "Engineer Segment Attempt"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Analyst Ingest Attempt"
                records:
                  - external_id: "RB1"
                    email_raw: "rb1@example.com"
                    phone_raw: "+1 (555) 690-0001"
                    loyalty_number: "LY00006901"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T10:00:00Z"
                    consent_signals: []
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "both trigger calls return status 403 with error_id ERR_UNAUTHORIZED"
            - "GET /cdp/segments returns total_count 0 and GET /cdp/ingest-batches returns total_count 0"
            - "the same segment payload as SegmentAnalyst returns 201 and the same batch payload as DataEngineer returns 201"

      - name: segment_analyst_cannot_record_governance_decision_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.DataGovernanceOfficer.exclusive_operations
          - endpoints[POST /cdp/segments/{segmentId}/governance-decision]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The approval chain cannot be short-circuited by the requester: the analyst who submitted the segment cannot also record the governance decision, and the refusal is the role rung (403), not the segregation-of-duties rung (409)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Segment submitted for review by u_analyst, so it sits in PENDING_GOVERNANCE_REVIEW."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/segments"
              payload:
                name: "Chain Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          trigger:
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "the response status is 403"
            - "the response body error_id == ERR_UNAUTHORIZED"
            - "Segment.${seg_id}.status is still PENDING_GOVERNANCE_REVIEW with decided_by_user_id null and approved_at null"
            - "the same call as DataGovernanceOfficer u_gov returns 200 and moves the segment to APPROVED"

