          rationale: "That §1.8 instance verifies the four-hop chain loan -> case -> unit -> borrower from a single call, hop by hop, which is the end-to-end cascade claim for this layer."
      - name: dual_variant_calculation_divergence
        claim_type: dual_variant_calculation
