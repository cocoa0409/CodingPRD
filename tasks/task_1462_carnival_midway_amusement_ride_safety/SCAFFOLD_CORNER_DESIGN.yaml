  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: inspector_selector_tie_break_uses_earliest_created
        claim_type: constants_applied
        grounds:
          - 'calculations.inspector_assignment'
        distinguishing_aspect: "With two active inspectors at equal same-date load, the assignment tie-break is inspector.created_at ASC — the first-registered inspector wins the first appointment; the second appointment then goes to the other inspector (load 0 beats load 1) — and never to a random or id-ordered choice."
        test_recipe:
          setup: ["Fair PERMIT_REQUESTED with one verified ride; two active inspectors, inspA registered before inspB"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway CA1", operator_company_name: "ShowCo", location: "Lot 38", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup CA1", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew CA1", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp Early", license_number: "LIC-CA1-1" }, as: StateProgramAdmin, captures: { inspA: "$.data.id" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp Late", license_number: "LIC-CA1-2" }, as: StateProgramAdmin, captures: { inspB: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-CA1-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { a1: "$.data.id", a1_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 14, duration_hours: 1 }, as: FairManager, as_user_id: "${sup_id}", captures: { a2: "$.data.id", a2_insp: "$.data.inspector_id" } }
          assert:
            - "a1_insp == ${inspA} (tie at load 0 broken by earliest created_at, never by id)"
            - "a2_insp == ${inspB} (load 0 outranks load 1; buffer 11 + 2 = 13 <= 14 satisfied for both)"

      - name: bundle_tier_boundary_9_vs_10_credits
        claim_type: correct_result
        grounds:
          - 'calculations.credit_bundle_subtotal'
          - 'calculations.sale_total_with_service_fee'
        distinguishing_aspect: "At exactly 9 credits no discount applies (9*95 = 855, fee 51, total 906); the 10th credit enters tier 2 at the pre-rounded unit 86 (855 + 86 = 941, fee 56, total 997) — the marginal tier boundary sits between 9 and 10, not at 10 discounted in full."
        test_recipe:
          setup: ["Permitted fair; day 2026-08-03 OPEN; CREDIT_BUNDLE product at base 95"]
