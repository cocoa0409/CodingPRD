scenario: |
  1188. Cosmetics & Personal-Care Contract Manufacturing (private-label beauty manufacturer): formula ownership & confidentiality, compounding batch & viscosity/pH in-process check, filling line changeover & component supply, preservative-efficacy & stability testing, fragrance/color lot variation, regulatory (INCI/label) review, customer-supplied component shortfall, minimum run & scale-up

domain_name: cosmetics-contract-manufacturing
api_prefix: /cosmfg

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many        # ComponentAllocation junctions orders/batches to lots
    - self_referential    # Formula.base_formula_id revision chain
    - cross_aggregate     # runs reference orders, lines, batches
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand owner display name" }
      - { name: tier, type: enum, source: input, description: "STANDARD | PRESTIGE — PRESTIGE gets a per-unit filling-fee discount", constraints: "STANDARD | PRESTIGE" }
      - { name: minimum_run_units, type: integer, source: input, description: "Negotiated minimum run size; orders must request >= this many units", constraints: ">= 1" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding exposure across non-terminal orders", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of quote_total_cents over this customer's orders with status IN {CONFIRMED, IN_PRODUCTION, FILLING}" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the brand this formula is contracted for" }
      - { name: base_formula_id, type: string, source: input, description: "FK -> Formula.id; nullable — set when this formula is derived from another formula (scale-up or base re-use); null for original formulas", default: null }
      - { name: name, type: string, source: input, description: "Formula display name" }
      - { name: version_seq, type: integer, source: system, description: "1 for original formulas; parent version_seq + 1 for revisions" }
      - { name: ownership, type: enum, source: input, description: "CUSTOMER_OWNED | MANUFACTURER_OWNED — who owns the IP", constraints: "CUSTOMER_OWNED | MANUFACTURER_OWNED" }
      - { name: confidentiality, type: enum, source: input, description: "STANDARD | EXCLUSIVE — EXCLUSIVE formulas may not be used as base_formula by a different customer", constraints: "STANDARD | EXCLUSIVE" }
      - { name: product_class, type: enum, source: input, description: "SKIN | HAIR | BABY | SUN — drives filling-line changeover matrix", constraints: "SKIN | HAIR | BABY | SUN" }
      - { name: allergen_flag, type: boolean, source: input, description: "true if formula contains declared allergens; forces ALLERGEN_CROSS changeover" }
      - { name: bulk_mass_per_unit_kg, type: number, source: input, description: "kg of bulk product per finished unit", constraints: "> 0" }
      - { name: viscosity_target_cps, type: integer, source: input, description: "Target viscosity in centipoise", constraints: "> 0" }
      - { name: viscosity_tolerance_pct, type: number, source: input, description: "Allowed +/- percent around viscosity_target_cps at IPC", constraints: "> 0 and <= 50" }
      - { name: ph_target, type: number, source: input, description: "Target pH", constraints: ">= 0 and <= 14" }
      - { name: ph_tolerance, type: number, source: input, description: "Allowed absolute +/- around ph_target at IPC", constraints: "> 0" }
      - { name: ingredients, type: array, source: input, description: "Array of {inci_name, component_id?, percentage}; percentages must sum to 100 within +/-0.01" }
      - { name: required_components, type: array, source: input, description: "Array of {component_id, units_per_product} for CUSTOMER_SUPPLIED pack components; may be empty", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | APPROVED | ACTIVE | RETIRED" }
      - { name: cost_estimate_standard_per_kg_cents, type: integer, source: computed, description: "Per-kg bulk cost using Component.standard_cost_per_kg_cents (see formula_cost_estimate)" }
      - { name: cost_estimate_current_lot_per_kg_cents, type: integer, source: computed, description: "Per-kg bulk cost using weighted-average cost of AVAILABLE lots, standard cost as fallback (see formula_cost_estimate)" }

  - name: RegulatoryReview
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; the formula version under review" }
      - { name: review_scope, type: enum, source: input, description: "INCI_LIST | LABEL_ARTWORK", constraints: "INCI_LIST | LABEL_ARTWORK" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | CHANGES_REQUESTED" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the RegulatoryAffairs user who claimed the review; null until claimed", default: null }
      - { name: comment, type: string, source: input, description: "Reviewer comment recorded on request-changes", default: null }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Component display name" }
      - { name: kind, type: enum, source: input, description: "RAW_MATERIAL | BULK_FRAGRANCE | COLORANT | PRIMARY_PACK | SECONDARY_PACK", constraints: "RAW_MATERIAL | BULK_FRAGRANCE | COLORANT | PRIMARY_PACK | SECONDARY_PACK" }
      - { name: supply_mode, type: enum, source: input, description: "MANUFACTURER_SUPPLIED | CUSTOMER_SUPPLIED", constraints: "MANUFACTURER_SUPPLIED | CUSTOMER_SUPPLIED" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; required when supply_mode is CUSTOMER_SUPPLIED, must be null otherwise", default: null }
      - { name: standard_cost_per_kg_cents, type: number, source: input, description: "Standard cost per kg in cents (may be fractional); used by standard-cost variant", constraints: ">= 0" }

  - name: ComponentLot
    parent: null
    common_fields: true
    fields:
      - { name: component_id, type: string, source: input, description: "FK -> Component.id" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot code; unique per component" }
      - { name: quantity_received, type: number, source: input, description: "Quantity received (kg for raw kinds, units for pack kinds)", constraints: "> 0" }
      - { name: quantity_available, type: number, source: computed, description: "quantity_received - quantity_reserved - quantity_consumed" }
      - { name: quantity_reserved, type: number, source: computed, description: "Sum of quantity over RESERVED allocations referencing this lot" }
      - { name: quantity_consumed, type: number, source: computed, description: "Sum of quantity over CONSUMED allocations referencing this lot" }
      - { name: unit_cost_per_kg_cents, type: number, source: input, description: "Actual lot cost per kg in cents; optional, used by current-lot cost variant", default: null }
      - { name: expires_at, type: datetime, source: input, description: "Expiry instant; lot is allocatable only while expires_at > current logical clock" }
      - { name: sensorial_profile, type: enum, source: input, description: "WITHIN_SPEC | MINOR_VARIANT — fragrance/color lot variation flag", default: WITHIN_SPEC, constraints: "WITHIN_SPEC | MINOR_VARIANT" }
      - { name: variant_waiver, type: enum, source: system, description: "NOT_REQUIRED | PENDING | WAIVED | REJECTED — PENDING when sensorial_profile is MINOR_VARIANT" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINED | DEPLETED — DEPLETED when quantity_available reaches 0; QUARANTINED when a variant waiver is REJECTED" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; taken from the acting CustomerRep's X-User-ID" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: formula_version_seq, type: integer, source: system, description: "Formula.version_seq pinned at confirm; null while DRAFT", default: null }
      - { name: requested_units, type: integer, source: input, description: "Units ordered; must be >= customer.minimum_run_units", constraints: ">= 1" }
      - { name: forfeited_units, type: integer, source: system, description: "Units given up by shortfall escalation (REDUCE_ORDER)", default: 0 }
      - { name: filled_units, type: integer, source: system, description: "Good units filled across COMPLETED runs", default: 0 }
      - { name: open_units, type: integer, source: computed, description: "requested_units - filled_units (forfeited units are already removed from requested_units by escalation); invariant: requested_units + forfeited_units is conserved across escalation and filling" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | IN_PRODUCTION | FILLING | COMPLETED | ON_HOLD | CANCELLED" }
      - { name: hold_return_status, type: enum, source: system, description: "Status to restore on resume; set when the order is placed ON_HOLD", default: null }
      - { name: quote_total_cents, type: integer, source: computed, description: "Quoted total per order_quote_total; computed at create, recomputed on PATCH and confirm" }
      - { name: fulfillable_units_conservative, type: integer, source: computed, description: "Fulfillable units counting only AVAILABLE, unexpired, WITHIN_SPEC-or-WAIVED customer-supplied lots" }
      - { name: fulfillable_units_optimistic, type: integer, source: computed, description: "Fulfillable units additionally counting MINOR_VARIANT lots whose waiver is still PENDING" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: system, description: "FK -> ProductionOrder.id (path)" }
      - { name: batch_size_kg, type: number, source: input, description: "Planned bulk mass of the compounding batch", constraints: "> 0" }
      - { name: scale_up_factor, type: number, source: computed, description: "batch_size_kg / LAB_REFERENCE_KG (50)" }
      - { name: scale_up_approved, type: boolean, source: system, description: "true once PlantDirector approves scale-up; required to start mixing when scale_up_factor > 10", default: false }
      - { name: status, type: enum, source: system, description: "PLANNED | MIXING | IPC_FAILED | IPC_PASSED | RELEASED_TO_FILLING | CONSUMED | REJECTED" }
      - { name: failed_check_count, type: integer, source: system, description: "Number of FAILED IPC rounds so far; adjust is blocked once this reaches MAX_IPC_FAILURES (3)", default: 0 }
      - { name: round_viscosity_result, type: enum, source: system, description: "NONE | PASS | FAIL — result of the current round's VISCOSITY check", default: NONE }
      - { name: round_ph_result, type: enum, source: system, description: "NONE | PASS | FAIL — result of the current round's PH check", default: NONE }
      - { name: last_ipc_recorded_by_user_id, type: string, source: system, description: "X-User-ID of the QAManager who recorded the most recent IPC check; release by the same user is forbidden (segregation of duties)", default: null }
      - { name: batch_charge_cents, type: integer, source: computed, description: "Closure charge per batch_closure_charge (actual-lot-cost variant); null until CONSUMED or REJECTED", default: null }
      - { name: batch_charge_standard_cents, type: integer, source: computed, description: "Closure charge per batch_closure_charge (standard-cost variant); null until CONSUMED or REJECTED", default: null }

  - name: IPCCheck
    parent: null
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id (path)" }
      - { name: check_type, type: enum, source: input, description: "VISCOSITY | PH", constraints: "VISCOSITY | PH" }
      - { name: measured_value, type: number, source: input, description: "Measured cps (VISCOSITY) or pH (PH)" }
      - { name: round_index, type: integer, source: system, description: "1 + batch.failed_check_count at record time" }
      - { name: effective_tolerance, type: number, source: computed, description: "Tolerance actually applied after adjustment tightening (see ipc_evaluation)" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per ipc_evaluation" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording QAManager" }

  - name: ComponentAllocation
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: system, description: "FK -> ProductionOrder.id (path)" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; set for raw-material allocations feeding a specific batch, null for order-level pack reservations", default: null }
      - { name: lot_id, type: string, source: input, description: "FK -> ComponentLot.id" }
      - { name: quantity, type: number, source: input, description: "Reserved quantity (kg or units per the lot's component kind)", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "RESERVED | RELEASED | CONSUMED" }

  - name: ShortfallCase
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: system, description: "FK -> ProductionOrder.id (path)" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id; must be CUSTOMER_SUPPLIED and owned by the order's customer" }
      - { name: required_quantity, type: number, source: input, description: "Total quantity the order needs of this component", constraints: "> 0" }
      - { name: allocatable_quantity, type: number, source: computed, description: "Sum of quantity_available over the customer's AVAILABLE, unexpired lots of this component at declaration time" }
      - { name: shortfall_quantity, type: number, source: computed, description: "required_quantity - allocatable_quantity; declaration is rejected with ERR_NO_SHORTFALL when this is <= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | COMMITMENT_RECEIVED | CLOSED_RESOLVED | ESCALATED | CLOSED_VOID" }
      - { name: committed_by_date, type: datetime, source: input, description: "Date the customer commits to deliver the shorted quantity", default: null }
      - { name: resolution, type: enum, source: input, description: "REDUCE_ORDER | CANCEL_ORDER — set on escalate", default: null }

  - name: FillingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line identifier" }
      - { name: status, type: enum, source: system, description: "IDLE | RUNNING | CLEANING" }
      - { name: current_run_id, type: string, source: system, description: "FK -> FillingRun.id of the IN_PROGRESS run; null otherwise", default: null }

  - name: FillingRun
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: system, description: "FK -> ProductionOrder.id (path)" }
      - { name: line_id, type: string, source: input, description: "FK -> FillingLine.id" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; batch must belong to the same order" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start (half-open, inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end (half-open, exclusive); must be after scheduled_start" }
      - { name: planned_units, type: integer, source: input, description: "Planned fill count; must be <= floor(batch_size_kg / bulk_mass_per_unit_kg)", constraints: ">= 1" }
      - { name: filled_units, type: integer, source: system, description: "Good units recorded at complete; null until then", default: null }
      - { name: rejected_units, type: integer, source: system, description: "Scrapped units recorded at complete", default: 0 }
      - { name: changeover_minutes_required, type: integer, source: computed, description: "Required gap after the previous run on the line per changeover_minutes; 0 when no previous run" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED" }

  - name: StabilityChamber
    parent: null
    common_fields: true
    fields:
      - { name: chamber_code, type: string, source: input, description: "Unique chamber identifier" }
      - { name: capacity_studies, type: integer, source: input, description: "Maximum number of IN_PROGRESS studies the chamber may hold", constraints: ">= 1" }
      - { name: active_study_count, type: integer, source: computed, description: "Count of IN_PROGRESS StabilityStudies assigned to this chamber" }

  - name: StabilityStudy
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: system, description: "FK -> Formula.id (path)" }
      - { name: chamber_id, type: string, source: input, description: "FK -> StabilityChamber.id" }
      - { name: study_type, type: enum, source: input, description: "PRESERVATIVE_EFFICACY | ACCELERATED | REAL_TIME", constraints: "PRESERVATIVE_EFFICACY | ACCELERATED | REAL_TIME" }
      - { name: required_intervals, type: array, source: system, description: "Interval day-indices required by study_type: PET [28]; ACCELERATED [30, 60, 90]; REAL_TIME [90, 180, 365]" }
      - { name: recorded_interval_count, type: integer, source: system, description: "Number of readings recorded so far", default: 0 }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED_PASS | COMPLETED_FAIL" }

  - name: StabilityReading
    parent: null
    common_fields: false
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> StabilityStudy.id (path)" }
      - { name: interval_index, type: integer, source: input, description: "Day-index of the pull point; must equal the next required interval in sequence" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "PASS | FAIL" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording QAManager" }

# =============================================================================
# Table 2: State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Formula
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /cosmfg/formulas/{id}/submit"
        actor: FormulationChemist
        preconditions:
          - "Formula.status == DRAFT"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /cosmfg/formulas/{id}/submit"
        actor: FormulationChemist
        preconditions:
          - "Formula.status == CHANGES_REQUESTED"
        side_effects: []
        note: "Revision loop: a formula whose review was sent back can be resubmitted"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "system (an INCI_LIST-scope RegulatoryReview for this formula transitions to APPROVED)"
        actor: system
        preconditions:
          - "The approved review's review_scope == INCI_LIST"
        side_effects:
          - "Formula.status -> APPROVED"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "system (a RegulatoryReview for this formula transitions to CHANGES_REQUESTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 1 -> ProductionOrder: every order with formula_id == this formula and status IN {CONFIRMED, IN_PRODUCTION, FILLING} transitions to ON_HOLD with hold_return_status set to its prior status"
          - "Cascade hop 2 -> FillingRun: every run of each such order with status == SCHEDULED transitions to ABORTED, releasing its line window"
      - from: ACTIVE
        to: CHANGES_REQUESTED
        trigger: "system (a RegulatoryReview for this formula transitions to CHANGES_REQUESTED — post-market re-audit)"
        actor: system
        preconditions: []
        side_effects:
          - "Same ProductionOrder ON_HOLD cascade and FillingRun ABORTED cascade as IN_REVIEW -> CHANGES_REQUESTED"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /cosmfg/formulas/{id}/activate"
        actor: FormulationChemist
        preconditions:
          - "Formula.status == APPROVED"
          - "The latest INCI_LIST-scope RegulatoryReview for this formula has status == APPROVED (ERR_INCI_REVIEW_NOT_APPROVED)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cosmfg/formulas/{id}/retire"
        actor: PlantDirector
        preconditions:
          - "Formula.status == ACTIVE"
        side_effects:
          - "Cascade -> ProductionOrder: orders with formula_id == this formula and status == DRAFT transition to CANCELLED"

  - entity: RegulatoryReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cosmfg/reviews/{id}/claim"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatoryReview.status == SUBMITTED"
        side_effects:
          - "reviewer_user_id set to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cosmfg/reviews/{id}/approve"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatoryReview.status == UNDER_REVIEW"
        side_effects:
          - "If review_scope == INCI_LIST and the referenced Formula.status == IN_REVIEW: Formula -> APPROVED"
          - "If review_scope == LABEL_ARTWORK: every FILLING ProductionOrder of this formula with filled_units >= requested_units -> COMPLETED (and its customer outstanding_balance_cents decreases by quote_total_cents)"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /cosmfg/reviews/{id}/request-changes"
        actor: RegulatoryAffairs
        preconditions:
          - "RegulatoryReview.status == UNDER_REVIEW"
        side_effects:
          - "comment recorded"
          - "Formula (IN_REVIEW or ACTIVE) -> CHANGES_REQUESTED, with the ProductionOrder ON_HOLD and FillingRun ABORTED cascades declared on the Formula machine"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /cosmfg/reviews/{id}/resubmit"
        actor: FormulationChemist
        preconditions:
          - "RegulatoryReview.status == CHANGES_REQUESTED"
          - "The referenced Formula.status == IN_REVIEW (formula must be resubmitted first)"
        side_effects: []
        note: "Cycle: SUBMITTED -> UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED"

  - entity: ProductionOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /cosmfg/production-orders/{id}/confirm"
        actor: CustomerRep
        preconditions:
          - "ProductionOrder.status == DRAFT"
          - "Referenced Formula.status == ACTIVE (ERR_FORMULA_NOT_ACTIVE)"
          - "customer.outstanding_balance_cents + quote_total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "formula_version_seq pinned to the Formula's current version_seq (version-pinning on approval)"
          - "Customer.outstanding_balance_cents increases by quote_total_cents"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "system (the order's first Batch transitions to MIXING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: FILLING
        trigger: "system (the order's first FillingRun transitions to IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILLING
        to: COMPLETED
        trigger: "system (a FillingRun completes and filled_units >= requested_units)"
        actor: system
        preconditions:
          - "The formula's latest LABEL_ARTWORK-scope RegulatoryReview has status == APPROVED (otherwise the order remains FILLING)"
        side_effects:
          - "Customer.outstanding_balance_cents decreases by quote_total_cents"
      - from: CONFIRMED
        to: ON_HOLD
        trigger: "system (Formula -> CHANGES_REQUESTED cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_status set to CONFIRMED; the order's SCHEDULED runs -> ABORTED"
      - from: IN_PRODUCTION
        to: ON_HOLD
        trigger: "system (Formula -> CHANGES_REQUESTED cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_status set to IN_PRODUCTION; the order's SCHEDULED runs -> ABORTED"
      - from: FILLING
        to: ON_HOLD
        trigger: "system (Formula -> CHANGES_REQUESTED cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_status set to FILLING; the order's SCHEDULED runs -> ABORTED"
      - from: ON_HOLD
        to: CONFIRMED
        trigger: "POST /cosmfg/production-orders/{id}/resume when hold_return_status == CONFIRMED"
        actor: ProductionPlanner
        preconditions:
          - "ProductionOrder.status == ON_HOLD"
          - "Referenced Formula.status IN {IN_REVIEW, APPROVED, ACTIVE} (ERR_FORMULA_NOT_ACTIVE)"
        side_effects:
          - "status restored to hold_return_status; hold_return_status cleared"
      - from: ON_HOLD
        to: IN_PRODUCTION
        trigger: "POST /cosmfg/production-orders/{id}/resume when hold_return_status == IN_PRODUCTION"
        actor: ProductionPlanner
        preconditions:
          - "ProductionOrder.status == ON_HOLD"
          - "Referenced Formula.status IN {IN_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "status restored to hold_return_status; hold_return_status cleared"
      - from: ON_HOLD
        to: FILLING
        trigger: "POST /cosmfg/production-orders/{id}/resume when hold_return_status == FILLING"
        actor: ProductionPlanner
        preconditions:
          - "ProductionOrder.status == ON_HOLD"
          - "Referenced Formula.status IN {IN_REVIEW, APPROVED, ACTIVE}"
        side_effects:
          - "status restored to hold_return_status; hold_return_status cleared"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cosmfg/production-orders/{id}/cancel or system (Formula retire cascade)"
        actor: "CustomerRep, ProductionPlanner, or system"
        preconditions: []
        side_effects:
          - "Cascade hop 1 -> ComponentAllocation: the order's RESERVED allocations -> RELEASED"
          - "Cascade hop 2 -> ComponentLot: each released lot's quantity_reserved decreases and quantity_available increases by the released quantity"
          - "SCHEDULED runs -> ABORTED; OPEN / COMMITMENT_RECEIVED shortfalls -> CLOSED_VOID"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /cosmfg/production-orders/{id}/cancel"
        actor: "CustomerRep or ProductionPlanner"
        preconditions: []
        side_effects:
          - "Same allocation-release, run-abort and shortfall-void cascades as DRAFT -> CANCELLED"
          - "Customer.outstanding_balance_cents decreases by quote_total_cents"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /cosmfg/production-orders/{id}/cancel"
        actor: "CustomerRep or ProductionPlanner"
        preconditions: []
        side_effects: ["Same cascades as CONFIRMED -> CANCELLED"]
      - from: FILLING
        to: CANCELLED
        trigger: "POST /cosmfg/production-orders/{id}/cancel"
        actor: "CustomerRep or ProductionPlanner"
        preconditions: []
        side_effects: ["Same cascades as CONFIRMED -> CANCELLED"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /cosmfg/production-orders/{id}/cancel"
        actor: "CustomerRep or ProductionPlanner"
        preconditions: []
        side_effects: ["Same cascades as CONFIRMED -> CANCELLED"]

  - entity: Batch
    initial_state: PLANNED
    terminal_states: [CONSUMED, REJECTED]
    transitions:
      - from: PLANNED
        to: MIXING
        trigger: "POST /cosmfg/batches/{id}/start-mixing"
        actor: ProductionPlanner
        preconditions:
          - "Batch.status == PLANNED"
          - "If scale_up_factor > SCALE_UP_APPROVAL_THRESHOLD (10): scale_up_approved == true (ERR_SCALE_UP_APPROVAL_REQUIRED)"
          - "Sum of quantity over RESERVED allocations with batch_id == this batch whose lot's component kind IN {RAW_MATERIAL, BULK_FRAGRANCE, COLORANT} >= batch_size_kg (ERR_BATCH_UNDER_ALLOCATED)"
          - "Order status IN {CONFIRMED, IN_PRODUCTION}"
        side_effects:
          - "If this is the order's first MIXING batch: ProductionOrder CONFIRMED -> IN_PRODUCTION"
      - from: MIXING
        to: IPC_FAILED
        trigger: "system (POST /cosmfg/batches/{id}/ipc-checks records a FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "failed_check_count increments by 1"
          - "the failing check's round_*_result set to FAIL"
      - from: MIXING
        to: IPC_PASSED
        trigger: "system (in the current round both round_viscosity_result == PASS and round_ph_result == PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IPC_FAILED
        to: MIXING
        trigger: "POST /cosmfg/batches/{id}/adjust"
        actor: QAManager
        preconditions:
          - "Batch.status == IPC_FAILED"
          - "failed_check_count < MAX_IPC_FAILURES (3) (ERR_IPC_ATTEMPTS_EXHAUSTED)"
        side_effects:
          - "round_viscosity_result and round_ph_result reset to NONE (new round begins)"
        note: "Retry loop: MIXING -> IPC_FAILED -> MIXING"
      - from: IPC_PASSED
        to: RELEASED_TO_FILLING
        trigger: "POST /cosmfg/batches/{id}/release"
        actor: QAManager
        preconditions:
          - "Batch.status == IPC_PASSED"
          - "Acting X-User-ID != last_ipc_recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No StabilityStudy for the order's formula has status == COMPLETED_FAIL (ERR_STUDY_FAILED_BLOCKS_RELEASE)"
        side_effects: []
      - from: MIXING
        to: REJECTED
        trigger: "POST /cosmfg/batches/{id}/reject"
        actor: QAManager
        preconditions:
          - "Batch.status == MIXING"
        side_effects:
          - "The batch's RESERVED allocations -> CONSUMED; each lot's quantity_reserved decreases and quantity_consumed increases (product written off)"
      - from: IPC_FAILED
        to: REJECTED
        trigger: "POST /cosmfg/batches/{id}/reject"
        actor: QAManager
        preconditions:
          - "Batch.status == IPC_FAILED"
        side_effects:
          - "Same allocation consumption as MIXING -> REJECTED"
      - from: RELEASED_TO_FILLING
        to: CONSUMED
        trigger: "system (a FillingRun referencing this batch completes)"
        actor: system
        preconditions: []
        side_effects:
          - "The batch's RESERVED allocations -> CONSUMED; lots' quantity_reserved decreases and quantity_consumed increases"

  - entity: ComponentLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED, QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (quantity_available reaches exactly 0 after an allocation reserve or consume)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /cosmfg/lots/{id}/waive-variant with decision == REJECTED"
        actor: CustomerRep
        preconditions:
          - "variant_waiver == PENDING"
        side_effects:
          - "variant_waiver -> REJECTED"
          - "RESERVED allocations referencing this lot -> RELEASED (quantity_reserved restored to quantity_available)"

  - entity: ComponentAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /cosmfg/allocations/{id}/release or system (order cancel, shortfall escalation, lot quarantine)"
        actor: "ProductionPlanner or system"
        preconditions:
          - "ComponentAllocation.status == RESERVED"
        side_effects:
          - "Lot quantity_reserved decreases and quantity_available increases by quantity"
      - from: RESERVED
        to: CONSUMED
        trigger: "system (batch CONSUMED or batch REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot quantity_reserved decreases and quantity_consumed increases by quantity"

  - entity: ShortfallCase
    initial_state: OPEN
    terminal_states: [CLOSED_RESOLVED, ESCALATED, CLOSED_VOID]
    transitions:
      - from: OPEN
        to: COMMITMENT_RECEIVED
        trigger: "POST /cosmfg/shortfalls/{id}/commit"
        actor: CustomerRep
        preconditions:
          - "ShortfallCase.status == OPEN"
        side_effects:
          - "committed_by_date recorded"
      - from: OPEN
        to: CLOSED_RESOLVED
        trigger: "system (receipt of a customer-supplied lot for this component fully covers shortfall_quantity via shortfall_proration)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITMENT_RECEIVED
        to: CLOSED_RESOLVED
        trigger: "system (covering lot receipt, as OPEN -> CLOSED_RESOLVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "POST /cosmfg/shortfalls/{id}/escalate"
        actor: ProductionPlanner
        preconditions:
          - "ShortfallCase.status == OPEN"
        side_effects:
          - "resolution recorded"
          - "REDUCE_ORDER: cascade hop 1 -> ProductionOrder.requested_units reduced to fulfillable_units_conservative and forfeited_units increased by the delta"
          - "REDUCE_ORDER: cascade hop 2 -> for every component in the formula's required_components, excess RESERVED allocations of the order are released newest-first (allocation created_at DESC) until that component's reserved quantity <= new requested_units * units_per_product; cascade hop 3 -> each released allocation restores its lot's quantity_reserved/quantity_available"
          - "CANCEL_ORDER: ProductionOrder -> CANCELLED with its full cancel cascades"
      - from: COMMITMENT_RECEIVED
        to: ESCALATED
        trigger: "POST /cosmfg/shortfalls/{id}/escalate"
        actor: ProductionPlanner
        preconditions:
          - "ShortfallCase.status == COMMITMENT_RECEIVED"
        side_effects: ["Same as OPEN -> ESCALATED"]
      - from: OPEN
        to: CLOSED_VOID
        trigger: "system (parent order cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITMENT_RECEIVED
        to: CLOSED_VOID
        trigger: "system (parent order cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FillingLine
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: RUNNING
        trigger: "system (a FillingRun on this line transitions to IN_PROGRESS)"
        actor: system
        preconditions:
          - "FillingLine.status == IDLE"
        side_effects:
          - "current_run_id set to the run"
      - from: RUNNING
        to: CLEANING
        trigger: "system (the line's IN_PROGRESS run completes or is aborted)"
        actor: system
        preconditions: []
        side_effects:
          - "current_run_id cleared"
      - from: CLEANING
        to: IDLE
        trigger: "POST /cosmfg/filling-lines/{id}/finish-cleaning"
        actor: ProductionPlanner
        preconditions:
          - "FillingLine.status == CLEANING"
        side_effects: []
        note: "Cyclic line lifecycle IDLE -> RUNNING -> CLEANING -> IDLE"

  - entity: FillingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cosmfg/filling-runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "FillingRun.status == SCHEDULED"
          - "Referenced Batch.status == RELEASED_TO_FILLING (ERR_BATCH_NOT_RELEASED)"
          - "Referenced FillingLine.status == IDLE (ERR_INVALID_STATE)"
          - "Order status IN {IN_PRODUCTION, FILLING}"
        side_effects:
          - "FillingLine IDLE -> RUNNING with current_run_id set"
          - "If this is the order's first IN_PROGRESS run: ProductionOrder IN_PRODUCTION -> FILLING"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cosmfg/filling-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "FillingRun.status == IN_PROGRESS"
          - "order.filled_units + filled_units <= order.requested_units (ERR_OVER_DELIVERY; forfeited units were already subtracted from requested_units by escalation)"
        side_effects:
          - "filled_units and rejected_units recorded on the run; order.filled_units increases by filled_units"
          - "Batch RELEASED_TO_FILLING -> CONSUMED with its allocation-consumption cascade"
          - "FillingLine RUNNING -> CLEANING"
          - "If order.filled_units >= requested_units AND the formula's latest LABEL_ARTWORK review is APPROVED: ProductionOrder FILLING -> COMPLETED"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /cosmfg/filling-runs/{id}/abort or system (order hold/cancel cascade)"
        actor: "ProductionPlanner or system"
        preconditions: []
        side_effects: ["Line window released (no line state change)"]
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /cosmfg/filling-runs/{id}/abort"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "FillingLine RUNNING -> CLEANING"
          - "Referenced batch remains RELEASED_TO_FILLING (not consumed)"

  - entity: StabilityStudy
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED_FAIL
        trigger: "system (a StabilityReading with result == FAIL is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "Chamber active_study_count decreases by 1"
          - "Future batch releases for this formula are blocked (ERR_STUDY_FAILED_BLOCKS_RELEASE)"
      - from: IN_PROGRESS
        to: COMPLETED_PASS
        trigger: "system (a PASS reading completes the last required interval)"
        actor: system
        preconditions: []
        side_effects:
          - "Chamber active_study_count decreases by 1"

# =============================================================================
# Concurrency Rules (OCC; see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: formula-revision-stale-parent
    parent_entity: Formula
    write_endpoint: "POST /cosmfg/formulas/{id}/revisions"
    occ_field: expected_formula_version
    description: |
      Creating a revision of a Formula whose version has advanced since the
      client last observed it is rejected. A revision legitimately supersedes
      the parent's current tip, so a writer holding a stale parent version
      must be refused rather than fork an outdated lineage.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-units-update-stale-order
    parent_entity: ProductionOrder
    write_endpoint: "PATCH /cosmfg/production-orders/{id}"
    occ_field: expected_production_order_version
    description: |
      Updating requested_units on a ProductionOrder whose version has advanced
      since the client last observed it is rejected, because an intervening
      write (for example a shortfall escalation that reduced the order) makes
      the writer's view of the order stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: order_quote_total
    trigger: "ProductionOrder create, PATCH requested_units, confirm"
    algorithm: tiered_pricing
    formula: |
      materials_cents = 0
      for each ingredient in formula.ingredients (in array order):
        kg = (ingredient.percentage / 100) * formula.bulk_mass_per_unit_kg * order.requested_units
        line_cents = round_half_up(kg * component(ingredient.component_id).standard_cost_per_kg_cents)  # ROUND PER LINE FIRST
        materials_cents += line_cents
      # PINNED ROUNDING ORDER: round each ingredient line to whole cents with
      # round_half_up, THEN sum. Summing raw values and rounding once at the
      # end is a different, non-conforming algorithm (results differ by cents).
      rate = 50 if requested_units <= 5000 else (40 if requested_units <= 20000 else 30)
      if customer.tier == PRESTIGE: rate = max(0, rate - 5)
      filling_fee_cents = requested_units * rate
      quote_total_cents = materials_cents + filling_fee_cents
    input_set: "The order's formula ingredients (component_id resolvable), the order's requested_units, the customer's tier"
    constants:
      FEE_TIER1_MAX_UNITS: 5000
      FEE_TIER1_RATE_CENTS: 50
      FEE_TIER2_MAX_UNITS: 20000
      FEE_TIER2_RATE_CENTS: 40
      FEE_TIER3_RATE_CENTS: 30
      PRESTIGE_RATE_DISCOUNT_CENTS: 5
    precision: "integer cents; per-line round_half_up before summation"
    variants: []

  - name: formula_cost_estimate
    trigger: "Formula create, revision create, ingredient edit; lot receipt (for the current-lot variant)"
    algorithm: weighted_scoring
    formula: |
      base: per_kg = sum over ingredients of (percentage / 100) * standard_cost_per_kg_cents
      Both variants share the ingredient set; they differ ONLY in the per-component unit cost:
        standard variant:   unit_cost(c) = Component.standard_cost_per_kg_cents
        current_lot variant: unit_cost(c) = weighted average of unit_cost_per_kg_cents over
          lots of c with status == AVAILABLE, weighted by quantity_available;
          lots with unit_cost_per_kg_cents == null are excluded from numerator and denominator;
          if c has no such lots, fall back to Component.standard_cost_per_kg_cents.
      Result rounded round_half_up to integer cents per kg.
    input_set: "Formula ingredients; for current_lot: ComponentLots with status == AVAILABLE"
    constants: {}
    precision: "integer cents per kg, round_half_up"
    variants:
      - name: standard
        when: "cost_estimate_standard_per_kg_cents"
        difference: "Uses Component.standard_cost_per_kg_cents for every ingredient"
      - name: current_lot
        when: "cost_estimate_current_lot_per_kg_cents"
        difference: "Uses quantity-weighted average of AVAILABLE lots' unit_cost_per_kg_cents, falling back to standard cost when no priced lots exist — diverges from standard whenever actual lot costs differ"

  - name: fulfillable_units
    trigger: "ProductionOrder create, PATCH requested_units, lot receipt, allocation release, variant waiver, shortfall escalation"
    algorithm: constraint_propagation
    formula: |
      for each entry in formula.required_components:
        need_per_unit = entry.units_per_product
        eligible(c) = lots of component c where component.supply_mode == CUSTOMER_SUPPLIED,
          component.customer_id == order.customer_id, lot.status == AVAILABLE,
          lot.expires_at > current logical clock
        conservative_pool(c) = sum of quantity_available over eligible(c) lots where
          (sensorial_profile == WITHIN_SPEC OR variant_waiver == WAIVED)
          PLUS sum of quantity over THIS order's RESERVED allocations on eligible(c) lots
          with (sensorial_profile == WITHIN_SPEC OR variant_waiver == WAIVED)
        optimistic_pool(c) = conservative_pool(c) + sum of quantity_available over eligible(c)
          lots where sensorial_profile == MINOR_VARIANT AND variant_waiver == PENDING
      fulfillable_units_conservative = min over required_components of floor(pool_conservative / need_per_unit)
        (requested_units if required_components is empty)
      fulfillable_units_optimistic  = min over required_components of floor(pool_optimistic / need_per_unit)
    input_set: "Formula.required_components; the ordering customer's ComponentLots"
    constants: {}
    precision: "integer units, floor"
    variants:
      - name: conservative
        when: "fulfillable_units_conservative"
        difference: "Excludes MINOR_VARIANT lots whose waiver is PENDING"
      - name: optimistic
        when: "fulfillable_units_optimistic"
        difference: "Counts MINOR_VARIANT PENDING lots as usable (assumes waiver will be granted) — diverges whenever such lots exist"

  - name: ipc_evaluation
    trigger: "POST /cosmfg/batches/{id}/ipc-checks"
    algorithm: threshold
    formula: |
      Tightening: after f failed rounds, effective tolerance = base * max(0.5, 1 - TIGHTENING_PER_FAILURE * f),
      where TIGHTENING_PER_FAILURE = 0.10 (i.e. each failed round shrinks the band by 10% of base, floored at 50%).
      VISCOSITY check: band = viscosity_target_cps * (viscosity_tolerance_pct / 100) * tighten(f)
        PASS iff |measured_value - viscosity_target_cps| <= band   (exactly at the band edge PASSES)
      PH check: band = ph_tolerance * tighten(f)
        PASS iff |measured_value - ph_target| <= band              (exactly at the band edge PASSES)
      Batch moves to IPC_PASSED only when BOTH check types have PASSed in the current round;
      any FAIL immediately moves the batch to IPC_FAILED and increments failed_check_count.
    input_set: "Batch (failed_check_count), order's Formula (targets and tolerances), the measured value"
    constants:
      TIGHTENING_PER_FAILURE: 0.10
      TIGHTENING_FLOOR: 0.5
      MAX_IPC_FAILURES: 3
    precision: "comparison in raw measured units; no rounding"
    variants: []

  - name: changeover_minutes
    trigger: "POST /cosmfg/production-orders/{id}/filling-runs (scheduling a run behind a previous run on the same line)"
    algorithm: constraint_propagation
    formula: |
      previous run = the run on the same line with status IN {SCHEDULED, IN_PROGRESS, COMPLETED}
        having the greatest scheduled_end <= new.scheduled_start; ties broken by earliest created_at;
        if none exists, changeover_minutes_required = 0 and no gap check applies.
      base =
        0    if previous.formula_id == new.formula_id                                   (SAME_FORMULA)
        15   if same product_class and neither formula has allergen_flag                (SAME_CLASS)
        45   if different product_class and neither formula has allergen_flag           (DIFFERENT_CLASS)
        120  if either formula has allergen_flag == true                                (ALLERGEN_CROSS)
      carryover = 30 if the previous run's formula contains an ingredient whose component
        kind == BULK_FRAGRANCE AND previous.formula_id != new.formula_id, else 0
      changeover_minutes_required = min(base + carryover, MAX_CHANGEOVER_MINUTES)
      Reject with ERR_CHANGEOVER_GAP_VIOLATION unless
        new.scheduled_start >= previous.scheduled_end + changeover_minutes_required minutes
      (a gap exactly equal to the requirement is allowed).
    input_set: "Runs on the same FillingLine with status IN {SCHEDULED, IN_PROGRESS, COMPLETED}; both runs' formulas"
    constants:
      SAME_FORMULA_MINUTES: 0
      SAME_CLASS_MINUTES: 15
      DIFFERENT_CLASS_MINUTES: 45
      ALLERGEN_CROSS_MINUTES: 120
      FRAGRANCE_CARRYOVER_MINUTES: 30
      MAX_CHANGEOVER_MINUTES: 180
    precision: "whole minutes"
    variants: []

  - name: shortfall_proration
    trigger: "POST /cosmfg/components/{id}/lots (receipt of a CUSTOMER_SUPPLIED lot)"
    algorithm: waterfall_allocation
    formula: |
      When a lot is received for a CUSTOMER_SUPPLIED component, distribute its
      quantity_available across that customer's ShortfallCases for the component with
      status IN {OPEN, COMMITMENT_RECEIVED}, ordered by shortfall created_at ASC
      (ties: parent order created_at ASC):
        grant = min(shortfall_quantity - already_covered, remaining_lot_quantity)
      Each grant creates a RESERVED ComponentAllocation against the shortfall's parent
      order (batch_id null). A shortfall whose grants reach shortfall_quantity transitions
      to CLOSED_RESOLVED. Remaining lot quantity stays AVAILABLE. Zero-quantity remainders
      create no allocation.
    input_set: "ShortfallCases of the same customer and component with status IN {OPEN, COMMITMENT_RECEIVED}, chronological order"
    constants: {}
    precision: "component quantity units; no rounding"
    variants: []

  - name: batch_closure_charge
    trigger: "Batch -> CONSUMED or REJECTED (charge computation on closure)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is PINNED to break the otherwise circular dependency:
        1. materials_cents = sum over the batch's CONSUMED allocations of
             quantity * lot_effective_cost, where lot_effective_cost =
             lot.unit_cost_per_kg_cents if set else Component.standard_cost_per_kg_cents
             (round per allocation line, round_half_up, then sum)
        2. surcharge bracket is read from materials_cents ALONE (pre-surcharge):
             materials_cents < 1000000 -> SURCHARGE_LOW (0.02)
             else -> SURCHARGE_HIGH (0.05)
        3. surcharge_cents = round_half_up(materials_cents * rate)
        4. batch_charge_cents = materials_cents + surcharge_cents
      The bracket MUST NOT be read from the post-surcharge total.
    input_set: "The batch's CONSUMED allocations and their lots/components"
    constants:
      SURCHARGE_BRACKET_CENTS: 1000000
      SURCHARGE_LOW: 0.02
      SURCHARGE_HIGH: 0.05
    precision: "integer cents; per-line round_half_up before summation"
    variants:
      - name: actual_lot_cost
        when: "default closure charge"
        difference: "Uses lot.unit_cost_per_kg_cents where present"
      - name: standard_cost
        when: "reported alongside as batch_charge_standard_cents for variance analysis"
        difference: "Uses Component.standard_cost_per_kg_cents for every allocation — diverges whenever actual lot costs differ from standard"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Segregation of duties: batch release actor must differ from the user who recorded the batch's most recent IPC check"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cosmfg/batches/{id}/release"
  - priority: 4
    category: existence
    check: "Every id in the path (and body FK references such as formula_id, lot_id, line_id, batch_id, chamber_id, component_id) exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_referential
    check: "Confidentiality/ownership: CustomerRep may only access resources whose customer_id equals their X-User-ID; base_formula_id must not reference another customer's EXCLUSIVE formula"
    error_id: ERR_CONFIDENTIALITY_VIOLATION
    http_status: 403
    applies_to: "CustomerRep-accessible endpoints; POST /cosmfg/formulas"
  - priority: 6
    category: state
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cosmfg/formulas/{id}/revisions; PATCH /cosmfg/production-orders/{id}"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition exists (terminal states reject everything)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: business_safety
    check: "Lot expiry: allocated lots must have expires_at > current logical clock"
    error_id: ERR_LOT_EXPIRED
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/allocations"
  - priority: 9
    category: business_safety
    check: "Scale-up: batch with scale_up_factor > 10 requires scale_up_approved before mixing"
    error_id: ERR_SCALE_UP_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /cosmfg/batches/{id}/start-mixing"
  - priority: 10
    category: business_safety
    check: "IPC retry budget: adjust rejected once failed_check_count == 3"
    error_id: ERR_IPC_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /cosmfg/batches/{id}/adjust"
  - priority: 11
    category: business_safety
    check: "A COMPLETED_FAIL stability study on the order's formula blocks batch release"
    error_id: ERR_STUDY_FAILED_BLOCKS_RELEASE
    http_status: 409
    applies_to: "POST /cosmfg/batches/{id}/release"
  - priority: 12
    category: business_safety
    check: "Batch mass balance: reserved raw-material mass for the batch must cover batch_size_kg"
    error_id: ERR_BATCH_UNDER_ALLOCATED
    http_status: 422
    applies_to: "POST /cosmfg/batches/{id}/start-mixing"
  - priority: 13
    category: business_referential
    check: "Component ownership: CUSTOMER_SUPPLIED lots may only be allocated to orders of the owning customer"
    error_id: ERR_COMPONENT_OWNERSHIP_MISMATCH
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/allocations"
  - priority: 14
    category: business_referential
    check: "MINOR_VARIANT lots require variant_waiver == WAIVED before allocation"
    error_id: ERR_VARIANT_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/allocations"
  - priority: 15
    category: business_referential
    check: "Order's formula must belong to the ordering customer and be ACTIVE at create/confirm"
    error_id: ERR_FORMULA_CUSTOMER_MISMATCH
    http_status: 422
    applies_to: "POST /cosmfg/production-orders"
  - priority: 16
    category: business_referential
    check: "Formula must be ACTIVE for order create/confirm"
    error_id: ERR_FORMULA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cosmfg/production-orders; POST /cosmfg/production-orders/{id}/confirm"
  - priority: 17
    category: business_referential
    check: "INCI_LIST review must be APPROVED before formula activation"
    error_id: ERR_INCI_REVIEW_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cosmfg/formulas/{id}/activate"
  - priority: 18
    category: business_referential
    check: "Only one open (SUBMITTED/UNDER_REVIEW/CHANGES_REQUESTED) review per formula per scope"
    error_id: ERR_REVIEW_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /cosmfg/formulas/{id}/reviews"
  - priority: 19
    category: business_referential
    check: "FillingRun.batch_id must reference a batch of the same production order"
    error_id: ERR_BATCH_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/filling-runs"
  - priority: 20
    category: business_constraint
    check: "Line window overlap: new run's half-open [scheduled_start, scheduled_end) must not intersect any run on the same line with status IN {SCHEDULED, IN_PROGRESS}; touching endpoints (prev.end == new.start) is allowed"
    error_id: ERR_LINE_OCCUPIED
    http_status: 409
    applies_to: "POST /cosmfg/production-orders/{id}/filling-runs"
  - priority: 21
    category: business_constraint
    check: "Changeover gap: gap after the previous run must be >= changeover_minutes_required (equality allowed)"
    error_id: ERR_CHANGEOVER_GAP_VIOLATION
    http_status: 409
    applies_to: "POST /cosmfg/production-orders/{id}/filling-runs"
  - priority: 22
    category: business_constraint
    check: "Chamber capacity: count of IN_PROGRESS studies in the chamber must be < capacity_studies at study creation"
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cosmfg/formulas/{id}/stability-studies"
  - priority: 23
    category: business_constraint
    check: "Stability readings must be recorded in required-interval sequence; the next interval must equal required_intervals[recorded_interval_count]"
    error_id: ERR_READING_INTERVAL_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /cosmfg/stability-studies/{id}/readings"
  - priority: 24
    category: business_constraint
    check: "Shortfall declaration requires shortfall_quantity > 0"
    error_id: ERR_NO_SHORTFALL
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/shortfalls"
  - priority: 25
    category: business_constraint
    check: "Allocation quantity must be <= lot.quantity_available and lot.status must be AVAILABLE"
    error_id: ERR_LOT_INSUFFICIENT_QUANTITY
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/allocations"
  - priority: 26
    category: business_constraint
    check: "Run completion must not push order.filled_units above order.requested_units (post-escalation value)"
    error_id: ERR_OVER_DELIVERY
    http_status: 422
    applies_to: "POST /cosmfg/filling-runs/{id}/complete"
  - priority: 27
    category: business_constraint
    check: "planned_units must be <= floor(batch_size_kg / bulk_mass_per_unit_kg)"
    error_id: ERR_PLANNED_UNITS_EXCEED_BATCH
    http_status: 422
    applies_to: "POST /cosmfg/production-orders/{id}/filling-runs"
  - priority: 28
    category: business_constraint
    check: "Batch must be RELEASED_TO_FILLING to start a run"
    error_id: ERR_BATCH_NOT_RELEASED
    http_status: 409
    applies_to: "POST /cosmfg/filling-runs/{id}/start"
  - priority: 29
    category: business_constraint
    check: "Request shape: missing/invalid required fields, invalid enum members, ingredient percentages not summing to 100 (+/-0.01)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 30
    category: business_fiscal
    check: "Minimum run: requested_units >= customer.minimum_run_units (equality allowed)"
    error_id: ERR_BELOW_MINIMUM_RUN
    http_status: 422
    applies_to: "POST /cosmfg/production-orders; PATCH /cosmfg/production-orders/{id}; POST /cosmfg/production-orders/{id}/confirm"
  - priority: 31
    category: business_fiscal
    check: "Credit: customer.outstanding_balance_cents + order.quote_total_cents <= customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /cosmfg/production-orders/{id}/confirm"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: "/cosmfg/customers"
    description: "Register a brand-owner customer"
    roles: [PlantDirector]
    code: 201
    input: [name, tier, minimum_run_units, credit_limit_cents]
    output: Customer
    side_effects: ["outstanding_balance_cents initialized to 0"]
  - method: GET
    path: "/cosmfg/customers/{id}"
    description: "Get a customer (CustomerRep may only read their own record)"
    roles: [PlantDirector, ProductionPlanner, QAManager, FormulationChemist, RegulatoryAffairs, CustomerRep]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/cosmfg/customers"
    description: "List customers with pagination"
    roles: [PlantDirector, ProductionPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []
  # --- Components & lots ---
  - method: POST
    path: "/cosmfg/components"
    description: "Register a component (raw material or pack)"
    roles: [ProductionPlanner]
    code: 201
    input: [name, kind, supply_mode, standard_cost_per_kg_cents, "customer_id?"]
    output: Component
    side_effects: []
  - method: GET
    path: "/cosmfg/components/{id}"
    description: "Get a component"
    roles: [ProductionPlanner, QAManager, PlantDirector, FormulationChemist, CustomerRep]
    code: 200
    input: []
    output: Component
    side_effects: []
  - method: GET
    path: "/cosmfg/components"
    description: "List components, optionally filtered by owning customer or kind"
    roles: [ProductionPlanner, QAManager, PlantDirector, CustomerRep]
    code: 200
    input: ["customer_id?", "kind?", "limit?", "offset?"]
    output: Component[]
    side_effects: []
  - method: POST
    path: "/cosmfg/components/{id}/lots"
    description: "Receive a component lot; receipt of a CUSTOMER_SUPPLIED lot triggers shortfall_proration auto-allocation"
    roles: [ProductionPlanner]
    code: 201
    input: [lot_code, quantity_received, expires_at, "unit_cost_per_kg_cents?", "sensorial_profile?"]
    output: ComponentLot
    side_effects:
      - "quantity_available initialized to quantity_received; reserved/consumed to 0"
      - "variant_waiver initialized to PENDING when sensorial_profile == MINOR_VARIANT else NOT_REQUIRED"
      - "For CUSTOMER_SUPPLIED components: shortfall_proration runs against the owning customer's OPEN/COMMITMENT_RECEIVED shortfalls"
  - method: GET
    path: "/cosmfg/lots/{id}"
    description: "Get a component lot"
    roles: [ProductionPlanner, QAManager, PlantDirector, CustomerRep]
    code: 200
    input: []
    output: ComponentLot
    side_effects: []
  - method: GET
    path: "/cosmfg/components/{id}/lots"
    description: "List lots of a component"
    roles: [ProductionPlanner, QAManager, PlantDirector, CustomerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComponentLot[]
    side_effects: []
  - method: POST
    path: "/cosmfg/lots/{id}/waive-variant"
    description: "Customer waives (or rejects) a MINOR_VARIANT fragrance/color lot"
    roles: [CustomerRep]
    code: 200
    input: [decision]
    output: ComponentLot
    side_effects:
      - "decision WAIVED: variant_waiver PENDING -> WAIVED"
      - "decision REJECTED: variant_waiver PENDING -> REJECTED and lot -> QUARANTINED, releasing its RESERVED allocations"
  # --- Formulas & regulatory reviews ---
  - method: POST
    path: "/cosmfg/formulas"
    description: "Create a formula (DRAFT); base_formula_id may derive from a non-EXCLUSIVE formula of the same customer or any MANUFACTURER_OWNED STANDARD formula"
    roles: [FormulationChemist]
    code: 201
    input: [customer_id, name, ownership, confidentiality, product_class, allergen_flag, bulk_mass_per_unit_kg, viscosity_target_cps, viscosity_tolerance_pct, ph_target, ph_tolerance, ingredients, "required_components?", "base_formula_id?"]
    output: Formula
    side_effects: ["version_seq = 1 (or base's version_seq unchanged — derivation is not a revision); cost estimates computed"]
  - method: GET
    path: "/cosmfg/formulas/{id}"
    description: "Get a formula (CustomerRep: own customer's formulas only)"
    roles: [FormulationChemist, RegulatoryAffairs, QAManager, ProductionPlanner, PlantDirector, CustomerRep]
    code: 200
    input: []
    output: Formula
    side_effects: []
  - method: GET
    path: "/cosmfg/formulas"
    description: "List formulas; customer_id and base_formula_id filters supported"
    roles: [FormulationChemist, RegulatoryAffairs, QAManager, ProductionPlanner, PlantDirector, CustomerRep]
    code: 200
    input: ["customer_id?", "base_formula_id?", "status?", "limit?", "offset?"]
    output: Formula[]
    side_effects: []
  - method: POST
    path: "/cosmfg/formulas/{id}/submit"
    description: "Submit a DRAFT or CHANGES_REQUESTED formula for regulatory review"
    roles: [FormulationChemist]
    code: 200
    input: []
    output: Formula
    side_effects: ["status -> IN_REVIEW; increments Formula.version by 1"]
  - method: POST
    path: "/cosmfg/formulas/{id}/activate"
    description: "Activate an APPROVED formula (requires APPROVED INCI_LIST review)"
    roles: [FormulationChemist]
    code: 200
    input: []
    output: Formula
    side_effects: ["status -> ACTIVE; increments Formula.version by 1"]
  - method: POST
    path: "/cosmfg/formulas/{id}/retire"
    description: "Retire an ACTIVE formula; DRAFT orders referencing it are cancelled"
    roles: [PlantDirector]
    code: 200
    input: []
    output: Formula
    side_effects: ["status -> RETIRED; referencing DRAFT orders -> CANCELLED; increments Formula.version by 1"]
  - method: POST
    path: "/cosmfg/formulas/{id}/revisions"
    description: "Create a new revision (child formula in DRAFT) of a CHANGES_REQUESTED, APPROVED, or ACTIVE formula; OCC-guarded on the parent's version"
    roles: [FormulationChemist]
    code: 201
    input: [expected_formula_version, "name?", "ingredients?", "required_components?", "viscosity_target_cps?", "viscosity_tolerance_pct?", "ph_target?", "ph_tolerance?", "product_class?", "allergen_flag?"]
    output: Formula
    side_effects:
      - "New Formula created with parent linkage via base_formula_id semantics: version_seq = parent.version_seq + 1, status DRAFT, unspecified fields inherited from parent"
      - "increments Formula.version of the parent by 1"
  - method: GET
    path: "/cosmfg/formulas/{id}/reviews"
    description: "List regulatory reviews of a formula"
    roles: [RegulatoryAffairs, FormulationChemist, PlantDirector]
    code: 200
    input: ["review_scope?", "limit?", "offset?"]
    output: RegulatoryReview[]
    side_effects: []
  - method: GET
    path: "/cosmfg/formulas/{id}/stability-studies"
    description: "List stability studies of a formula"
    roles: [QAManager, PlantDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StabilityStudy[]
    side_effects: []
  - method: POST
    path: "/cosmfg/formulas/{id}/reviews"
    description: "Open a regulatory review (INCI_LIST or LABEL_ARTWORK) for a formula in IN_REVIEW or ACTIVE"
    roles: [FormulationChemist]
    code: 201
    input: [review_scope]
    output: RegulatoryReview
    side_effects: ["Review created SUBMITTED; rejected with ERR_REVIEW_ALREADY_OPEN if an open review of the same scope exists"]
  - method: GET
    path: "/cosmfg/reviews/{id}"
    description: "Get a regulatory review"
    roles: [RegulatoryAffairs, FormulationChemist, PlantDirector]
    code: 200
    input: []
    output: RegulatoryReview
    side_effects: []
  - method: POST
    path: "/cosmfg/reviews/{id}/claim"
    description: "Claim a SUBMITTED review"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: RegulatoryReview
    side_effects: ["status -> UNDER_REVIEW; reviewer_user_id set"]
  - method: POST
    path: "/cosmfg/reviews/{id}/approve"
    description: "Approve an UNDER_REVIEW review; approving an INCI_LIST review auto-approves an IN_REVIEW formula"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: RegulatoryReview
    side_effects: ["status -> APPROVED; INCI_LIST approval moves IN_REVIEW formula -> APPROVED"]
  - method: POST
    path: "/cosmfg/reviews/{id}/request-changes"
    description: "Send an UNDER_REVIEW review back; cascades formula -> CHANGES_REQUESTED, orders -> ON_HOLD, scheduled runs -> ABORTED"
    roles: [RegulatoryAffairs]
    code: 200
    input: ["comment?"]
    output: RegulatoryReview
    side_effects: ["status -> CHANGES_REQUESTED; Formula and ProductionOrder/FillingRun cascades per the Formula state machine"]
  - method: POST
    path: "/cosmfg/reviews/{id}/resubmit"
    description: "Resubmit a CHANGES_REQUESTED review after the formula is back IN_REVIEW"
    roles: [FormulationChemist]
    code: 200
    input: []
    output: RegulatoryReview
    side_effects: ["status -> SUBMITTED"]
  # --- Production orders ---
  - method: POST
    path: "/cosmfg/production-orders"
    description: "Customer places a production order (DRAFT) for an ACTIVE formula they own"
    roles: [CustomerRep]
    code: 201
    input: [formula_id, requested_units]
    output: ProductionOrder
    side_effects: ["customer_id taken from X-User-ID; quote_total_cents and both fulfillable_units variants computed"]
  - method: GET
    path: "/cosmfg/production-orders/{id}"
    description: "Get a production order (CustomerRep: own orders only)"
    roles: [CustomerRep, ProductionPlanner, QAManager, PlantDirector, FormulationChemist]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: GET
    path: "/cosmfg/production-orders"
    description: "List production orders with filters"
    roles: [CustomerRep, ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: ["customer_id?", "formula_id?", "status?", "limit?", "offset?"]
    output: ProductionOrder[]
    side_effects: []
  - method: PATCH
    path: "/cosmfg/production-orders/{id}"
    description: "Update requested_units of a DRAFT order; OCC-guarded on the order's version"
    roles: [CustomerRep]
    code: 200
    input: [requested_units, expected_production_order_version]
    output: ProductionOrder
    side_effects: ["quote_total_cents and fulfillable variants recomputed; increments ProductionOrder.version by 1"]
  - method: POST
    path: "/cosmfg/production-orders/{id}/confirm"
    description: "Confirm a DRAFT order; pins formula_version_seq and debits the customer's credit exposure"
    roles: [CustomerRep]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["status -> CONFIRMED; formula_version_seq pinned; customer.outstanding_balance_cents increases"]
  - method: POST
    path: "/cosmfg/production-orders/{id}/cancel"
    description: "Cancel a non-terminal order; releases allocations, aborts scheduled runs, voids open shortfalls, restores credit"
    roles: [CustomerRep, ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["status -> CANCELLED; allocation/run/shortfall cascades per the ProductionOrder state machine"]
  - method: POST
    path: "/cosmfg/production-orders/{id}/resume"
    description: "Resume an ON_HOLD order once its formula has been resubmitted"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["status restored to hold_return_status"]
  - method: GET
    path: "/cosmfg/production-orders/{id}/batches"
    description: "List batches of an order"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []
  - method: GET
    path: "/cosmfg/production-orders/{id}/allocations"
    description: "List allocations of an order"
    roles: [ProductionPlanner, QAManager, PlantDirector, CustomerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComponentAllocation[]
    side_effects: []
  - method: GET
    path: "/cosmfg/production-orders/{id}/shortfalls"
    description: "List shortfall cases of an order"
    roles: [ProductionPlanner, CustomerRep, PlantDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ShortfallCase[]
    side_effects: []
  - method: GET
    path: "/cosmfg/production-orders/{id}/filling-runs"
    description: "List filling runs of an order"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FillingRun[]
    side_effects: []
  - method: POST
    path: "/cosmfg/production-orders/{id}/allocations"
    description: "Reserve component lots for an order (items: lot_id + quantity, optional batch_id for raw materials); order must be CONFIRMED or IN_PRODUCTION; batch_id, when present, must reference a batch of this order"
    roles: [ProductionPlanner]
    code: 201
    input: [items]
    output: ComponentAllocation[]
    side_effects: ["Each item creates a RESERVED allocation; lot quantity_available decreases and quantity_reserved increases; a lot reaching exactly 0 available -> DEPLETED"]
  # --- Batches & IPC ---
  - method: POST
    path: "/cosmfg/production-orders/{id}/batches"
    description: "Plan a compounding batch for a CONFIRMED or IN_PRODUCTION order"
    roles: [ProductionPlanner]
    code: 201
    input: [batch_size_kg]
    output: Batch
    side_effects: ["status PLANNED; scale_up_factor computed"]
  - method: GET
    path: "/cosmfg/batches/{id}"
    description: "Get a batch"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: GET
    path: "/cosmfg/batches/{id}/filling-runs"
    description: "List filling runs drawing on a batch"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: FillingRun[]
    side_effects: []
  - method: POST
    path: "/cosmfg/batches/{id}/approve-scale-up"
    description: "PlantDirector approves scale-up for a batch whose scale_up_factor exceeds the threshold"
    roles: [PlantDirector]
    code: 200
    input: []
    output: Batch
    side_effects: ["scale_up_approved -> true"]
  - method: POST
    path: "/cosmfg/batches/{id}/start-mixing"
    description: "Start compounding a PLANNED batch (scale-up approval and mass-balance enforced)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> MIXING; first MIXING batch moves order CONFIRMED -> IN_PRODUCTION"]
  - method: POST
    path: "/cosmfg/batches/{id}/ipc-checks"
    description: "Record an in-process viscosity or pH measurement on a MIXING batch"
    roles: [QAManager]
    code: 201
    input: [check_type, measured_value]
    output: IPCCheck
    side_effects:
      - "IPCCheck created with computed effective_tolerance and result; recorded_by_user_id set from X-User-ID"
      - "FAIL: batch -> IPC_FAILED and failed_check_count increments; both types PASS in the round: batch -> IPC_PASSED"
      - "Batch.last_ipc_recorded_by_user_id updated"
  - method: GET
    path: "/cosmfg/batches/{id}/ipc-checks"
    description: "List IPC checks of a batch (append-only log)"
    roles: [QAManager, ProductionPlanner, PlantDirector]
    code: 200
    input: ["check_type?", "limit?", "offset?"]
    output: IPCCheck[]
    side_effects: []
  - method: POST
    path: "/cosmfg/batches/{id}/adjust"
    description: "Send an IPC_FAILED batch back to MIXING for adjustment (max 3 failed rounds)"
    roles: [QAManager]
    code: 200
    input: ["adjustment_note?"]
    output: Batch
    side_effects: ["status -> MIXING; round results reset to NONE"]
  - method: POST
    path: "/cosmfg/batches/{id}/release"
    description: "Release an IPC_PASSED batch to filling; the releasing QA user must differ from the last IPC recorder"
    roles: [QAManager]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> RELEASED_TO_FILLING"]
  - method: POST
    path: "/cosmfg/batches/{id}/reject"
    description: "Reject a MIXING or IPC_FAILED batch; its reserved materials are consumed as waste"
    roles: [QAManager]
    code: 200
    input: ["reason?"]
    output: Batch
    side_effects: ["status -> REJECTED; RESERVED allocations -> CONSUMED (lot quantities updated)"]
  # --- Shortfalls ---
  - method: POST
    path: "/cosmfg/production-orders/{id}/shortfalls"
    description: "Declare a customer-supplied component shortfall against an order"
    roles: [ProductionPlanner]
    code: 201
    input: [component_id, required_quantity]
    output: ShortfallCase
    side_effects: ["allocatable_quantity and shortfall_quantity computed; ERR_NO_SHORTFALL when shortfall_quantity <= 0"]
  - method: GET
    path: "/cosmfg/shortfalls/{id}"
    description: "Get a shortfall case"
    roles: [ProductionPlanner, CustomerRep, PlantDirector]
    code: 200
    input: []
    output: ShortfallCase
    side_effects: []
  - method: GET
    path: "/cosmfg/shortfalls"
    description: "List shortfall cases with filters"
    roles: [ProductionPlanner, CustomerRep, PlantDirector]
    code: 200
    input: ["production_order_id?", "component_id?", "status?", "limit?", "offset?"]
    output: ShortfallCase[]
    side_effects: []
  - method: POST
    path: "/cosmfg/shortfalls/{id}/commit"
    description: "Customer commits to deliver the shorted quantity by a date"
    roles: [CustomerRep]
    code: 200
    input: [committed_by_date]
    output: ShortfallCase
    side_effects: ["status OPEN -> COMMITMENT_RECEIVED"]
  - method: POST
    path: "/cosmfg/shortfalls/{id}/escalate"
    description: "Escalate an unresolved shortfall: reduce the order to fulfillable units or cancel it"
    roles: [ProductionPlanner]
    code: 200
    input: [resolution]
    output: ShortfallCase
    side_effects: ["status -> ESCALATED; REDUCE_ORDER shrinks requested_units and releases excess allocations newest-first; CANCEL_ORDER cancels the order"]
  # --- Allocations (cross references) ---
  - method: GET
    path: "/cosmfg/allocations/{id}"
    description: "Get a component allocation"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: []
    output: ComponentAllocation
    side_effects: []
  - method: GET
    path: "/cosmfg/allocations"
    description: "List allocations filtered by order, batch, or lot"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: ["production_order_id?", "batch_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: ComponentAllocation[]
    side_effects: []
  - method: POST
    path: "/cosmfg/allocations/{id}/release"
    description: "Manually release a RESERVED allocation back to its lot"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ComponentAllocation
    side_effects: ["status -> RELEASED; lot quantity_reserved decreases, quantity_available increases"]
  # --- Stability ---
  - method: POST
    path: "/cosmfg/stability-chambers"
    description: "Register a stability chamber with a study capacity"
    roles: [QAManager]
    code: 201
    input: [chamber_code, capacity_studies]
    output: StabilityChamber
    side_effects: []
  - method: GET
    path: "/cosmfg/stability-chambers/{id}"
    description: "Get a stability chamber"
    roles: [QAManager, PlantDirector, ProductionPlanner]
    code: 200
    input: []
    output: StabilityChamber
    side_effects: []
  - method: GET
    path: "/cosmfg/stability-chambers/{id}/studies"
    description: "List studies occupying a chamber"
    roles: [QAManager, PlantDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StabilityStudy[]
    side_effects: []
  - method: POST
    path: "/cosmfg/formulas/{id}/stability-studies"
    description: "Start a stability study for an APPROVED or ACTIVE formula in a chamber with free capacity"
    roles: [QAManager]
    code: 201
    input: [chamber_id, study_type]
    output: StabilityStudy
    side_effects: ["status IN_PROGRESS; required_intervals set by study_type; chamber active_study_count increments"]
  - method: GET
    path: "/cosmfg/stability-studies/{id}"
    description: "Get a stability study"
    roles: [QAManager, PlantDirector]
    code: 200
    input: []
    output: StabilityStudy
    side_effects: []
  - method: POST
    path: "/cosmfg/stability-studies/{id}/readings"
    description: "Record the next interval reading of a study"
    roles: [QAManager]
    code: 201
    input: [interval_index, result]
    output: StabilityReading
    side_effects:
      - "recorded_interval_count increments; FAIL -> study COMPLETED_FAIL; final interval PASS -> COMPLETED_PASS"
      - "Chamber active_study_count decrements on completion"
  - method: GET
    path: "/cosmfg/stability-studies/{id}/readings"
    description: "List readings of a study"
    roles: [QAManager, PlantDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: StabilityReading[]
    side_effects: []
  # --- Filling lines & runs ---
  - method: POST
    path: "/cosmfg/filling-lines"
    description: "Register a filling line"
    roles: [ProductionPlanner]
    code: 201
    input: [line_code]
    output: FillingLine
    side_effects: ["status IDLE"]
  - method: GET
    path: "/cosmfg/filling-lines"
    description: "List filling lines, optionally filtered by status or current_run_id"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: ["status?", "current_run_id?", "limit?", "offset?"]
    output: FillingLine[]
    side_effects: []
  - method: GET
    path: "/cosmfg/filling-lines/{id}"
    description: "Get a filling line"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: []
    output: FillingLine
    side_effects: []
  - method: GET
    path: "/cosmfg/filling-lines/{id}/runs"
    description: "List runs scheduled on a line"
    roles: [ProductionPlanner, PlantDirector, QAManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FillingRun[]
    side_effects: []
  - method: POST
    path: "/cosmfg/filling-lines/{id}/finish-cleaning"
    description: "Finish cleaning: CLEANING -> IDLE"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: FillingLine
    side_effects: ["status -> IDLE"]
  - method: POST
    path: "/cosmfg/production-orders/{id}/filling-runs"
    description: "Schedule a filling run on a line (overlap and changeover-gap enforced)"
    roles: [ProductionPlanner]
    code: 201
    input: [line_id, batch_id, scheduled_start, scheduled_end, planned_units]
    output: FillingRun
    side_effects: ["status SCHEDULED; changeover_minutes_required computed against the previous run on the line"]
  - method: GET
    path: "/cosmfg/filling-runs/{id}"
    description: "Get a filling run"
    roles: [ProductionPlanner, QAManager, PlantDirector]
    code: 200
    input: []
    output: FillingRun
    side_effects: []
  - method: POST
    path: "/cosmfg/filling-runs/{id}/start"
    description: "Start a SCHEDULED run (requires RELEASED_TO_FILLING batch and IDLE line)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: FillingRun
    side_effects: ["status -> IN_PROGRESS; line -> RUNNING; first run moves order IN_PRODUCTION -> FILLING"]
  - method: POST
    path: "/cosmfg/filling-runs/{id}/complete"
    description: "Complete an IN_PROGRESS run, recording good and rejected units"
    roles: [ProductionPlanner]
    code: 200
    input: [filled_units, "rejected_units?"]
    output: FillingRun
    side_effects: ["status -> COMPLETED; batch -> CONSUMED; line -> CLEANING; order filled_units increases; order may auto-complete"]
  - method: POST
    path: "/cosmfg/filling-runs/{id}/abort"
    description: "Abort a SCHEDULED or IN_PROGRESS run"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: FillingRun
    side_effects: ["status -> ABORTED; IN_PROGRESS abort moves line -> CLEANING; batch not consumed"]
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default before any call is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. Lot-expiry comparisons read this clock."
    roles: [PlantDirector, ProductionPlanner, QAManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; lot expiry checks compare expires_at against this clock"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role is not in the endpoint's allowed roles" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Batch release attempted by the same user who recorded the batch's most recent IPC check" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path or referenced id does not exist" }
  - { id: ERR_CONFIDENTIALITY_VIOLATION, http: 403, condition: "CustomerRep accessing another customer's resource, or deriving from another customer's EXCLUSIVE formula" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits the requested transition" }
  - { id: ERR_LOT_EXPIRED, http: 422, condition: "Allocated lot has expires_at <= current logical clock" }
  - { id: ERR_SCALE_UP_APPROVAL_REQUIRED, http: 422, condition: "Batch scale_up_factor > 10 and scale_up_approved is false" }
  - { id: ERR_IPC_ATTEMPTS_EXHAUSTED, http: 422, condition: "Adjust attempted when failed_check_count has reached 3" }
  - { id: ERR_STUDY_FAILED_BLOCKS_RELEASE, http: 409, condition: "A COMPLETED_FAIL stability study exists for the order's formula" }
  - { id: ERR_BATCH_UNDER_ALLOCATED, http: 422, condition: "Reserved raw-material mass for the batch is below batch_size_kg" }
  - { id: ERR_COMPONENT_OWNERSHIP_MISMATCH, http: 422, condition: "CUSTOMER_SUPPLIED lot allocated to another customer's order" }
  - { id: ERR_VARIANT_WAIVER_REQUIRED, http: 422, condition: "MINOR_VARIANT lot allocated while its variant_waiver is PENDING or REJECTED" }
  - { id: ERR_FORMULA_CUSTOMER_MISMATCH, http: 422, condition: "Order's formula belongs to a different customer" }
  - { id: ERR_FORMULA_NOT_ACTIVE, http: 409, condition: "Referenced formula is not ACTIVE (order create/confirm/resume)" }
  - { id: ERR_INCI_REVIEW_NOT_APPROVED, http: 409, condition: "Latest INCI_LIST review is not APPROVED at formula activation" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "An open review of the same scope already exists for the formula" }
  - { id: ERR_BATCH_ORDER_MISMATCH, http: 422, condition: "FillingRun.batch_id references a batch of a different production order" }
  - { id: ERR_LINE_OCCUPIED, http: 409, condition: "New run's half-open window intersects an existing SCHEDULED/IN_PROGRESS run on the line" }
  - { id: ERR_CHANGEOVER_GAP_VIOLATION, http: 409, condition: "Gap after the previous run is smaller than changeover_minutes_required" }
  - { id: ERR_CHAMBER_CAPACITY_EXCEEDED, http: 409, condition: "Chamber already holds capacity_studies IN_PROGRESS studies" }
  - { id: ERR_READING_INTERVAL_OUT_OF_ORDER, http: 422, condition: "interval_index does not equal the next required interval" }
  - { id: ERR_NO_SHORTFALL, http: 422, condition: "Declared shortfall_quantity computes to <= 0" }
  - { id: ERR_LOT_INSUFFICIENT_QUANTITY, http: 422, condition: "Allocation quantity exceeds lot.quantity_available or lot is not AVAILABLE" }
  - { id: ERR_OVER_DELIVERY, http: 422, condition: "Run completion would push order.filled_units above requested_units - forfeited_units" }
  - { id: ERR_PLANNED_UNITS_EXCEED_BATCH, http: 422, condition: "planned_units exceeds floor(batch_size_kg / bulk_mass_per_unit_kg)" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Run start requires the referenced batch to be RELEASED_TO_FILLING" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum member, or ingredient percentages not summing to 100 (+/-0.01)" }
  - { id: ERR_BELOW_MINIMUM_RUN, http: 422, condition: "requested_units below the customer's minimum_run_units" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm would push the customer's outstanding balance above credit_limit_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CustomerRep
    description: "Brand-owner representative; places and manages their own orders, waives variant lots, commits shortfall resolutions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /cosmfg/production-orders — place order"
      - "PATCH /cosmfg/production-orders/{id} — update requested_units (own orders)"
      - "POST /cosmfg/production-orders/{id}/confirm — confirm order"
      - "POST /cosmfg/lots/{id}/waive-variant — waive/reject variant lot (own components)"
      - "POST /cosmfg/shortfalls/{id}/commit — commit shortfall delivery"
    shared_operations:
      - "GET reads of own customers/orders/lots/components"
      - "POST /cosmfg/production-orders/{id}/cancel (shared with ProductionPlanner)"
  - name: FormulationChemist
    description: "Authors formulas and revisions, submits them for regulatory review, resubmits reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /cosmfg/formulas — create formula"
      - "POST /cosmfg/formulas/{id}/submit — submit for review"
      - "POST /cosmfg/formulas/{id}/activate — activate approved formula"
      - "POST /cosmfg/formulas/{id}/revisions — create revision (OCC)"
      - "POST /cosmfg/formulas/{id}/reviews — open regulatory review"
      - "POST /cosmfg/reviews/{id}/resubmit — resubmit review"
    shared_operations:
      - "GET reads of formulas, components, orders, reviews"
  - name: RegulatoryAffairs
    description: "Performs INCI/label regulatory review: claim, approve, request changes"
    identity: "opaque"
    exclusive_operations:
      - "POST /cosmfg/reviews/{id}/claim"
      - "POST /cosmfg/reviews/{id}/approve"
      - "POST /cosmfg/reviews/{id}/request-changes"
    shared_operations:
      - "GET reads of formulas and reviews"
  - name: QAManager
    description: "Runs IPC checks, adjusts/releases/rejects batches, manages stability chambers, studies, and readings"
    identity: "opaque"
    exclusive_operations:
      - "POST /cosmfg/batches/{id}/ipc-checks"
      - "POST /cosmfg/batches/{id}/adjust"
      - "POST /cosmfg/batches/{id}/release"
      - "POST /cosmfg/batches/{id}/reject"
      - "POST /cosmfg/stability-chambers"
      - "POST /cosmfg/formulas/{id}/stability-studies"
      - "POST /cosmfg/stability-studies/{id}/readings"
    shared_operations:
      - "GET reads of batches, studies, orders, components, lots"
      - "POST /_clock/set_current_utc"
  - name: ProductionPlanner
    description: "Plans components/lots, allocations, batches, filling lines/runs; declares and escalates shortfalls; resumes held orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /cosmfg/components and /cosmfg/components/{id}/lots"
      - "POST /cosmfg/production-orders/{id}/allocations and /cosmfg/allocations/{id}/release"
      - "POST /cosmfg/production-orders/{id}/batches and /cosmfg/batches/{id}/start-mixing"
      - "POST /cosmfg/production-orders/{id}/filling-runs; run start/complete/abort; line create/finish-cleaning"
      - "POST /cosmfg/production-orders/{id}/shortfalls and /cosmfg/shortfalls/{id}/escalate"
      - "POST /cosmfg/production-orders/{id}/resume"
    shared_operations:
      - "GET reads across planning resources"
      - "POST /cosmfg/production-orders/{id}/cancel (shared with CustomerRep)"
      - "POST /_clock/set_current_utc"
  - name: PlantDirector
    description: "Executive override: registers customers, approves scale-up, retires formulas"
    identity: "opaque"
    exclusive_operations:
      - "POST /cosmfg/customers"
      - "POST /cosmfg/batches/{id}/approve-scale-up"
      - "POST /cosmfg/formulas/{id}/retire"
    shared_operations:
      - "GET reads across all resources"
      - "POST /_clock/set_current_utc"

