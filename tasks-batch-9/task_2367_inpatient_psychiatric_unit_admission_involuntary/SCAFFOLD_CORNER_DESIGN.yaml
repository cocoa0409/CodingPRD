            - "the bed edit is HTTP 200 and by itself advances Unit.${u_oc}.version, leaving posture \"OPEN\" (licensed_placement_bed_count 2, raw_available_bed_count 2 > max(1, floor(2 * 0.20)) == 1, effective_available_bed_count 2) - the placement is therefore blocked purely by the version, not by capacity"
            - "the first placement is HTTP 412 with ${occ_unit_err} == \"ERR_STALE_UNIT_VERSION\", and not ERR_ADMISSION_NOT_PLACEABLE or ERR_BED_NOT_ELIGIBLE: priority 10 precedes priorities 16 and 45"
            - "after that rejection Admission.${a_oc}.placement_status is still \"PENDING_PLACEMENT\", Bed.${b_oc1}.status is still \"AVAILABLE\" and Unit.${u_oc}.version is unchanged - a 412 writes nothing at all"
            - "${u_oc_v2} == ${u_oc_v1} + 1, and the retry carrying it is HTTP 200 with placement_status \"PLACED\", Bed.${b_oc1}.status \"OCCUPIED\" and Unit.${u_oc}.version == ${u_oc_v2} + 1 - every write bumps the guarded version"
            - "the first capacity determination is HTTP 201 with CapacityDetermination.${cd_oc1}.status \"ACTIVE\" and mirrors Admission.${a_oc}.capacity_present true"
            - "the second contraband search is HTTP 200 and advances Admission.${a_oc}.version again, so ${a_oc_v2} == ${a_oc_v1} + 2 (one increment from the determination, one from the search)"
            - "the determination carrying ${a_oc_v1} is HTTP 412 with ${occ_adm_err} == \"ERR_STALE_ADMISSION_VERSION\"; CapacityDetermination.${cd_oc1} is still \"ACTIVE\", Admission.${a_oc}.capacity_present is still true and no second determination row exists"
            - "the determination carrying ${a_oc_v2} is HTTP 201: CapacityDetermination.${cd_oc2}.status \"ACTIVE\" with surrogate_name \"Dana Ruiz\" and surrogate_authority_scope \"FULL\", CapacityDetermination.${cd_oc1}.status flips to \"SUPERSEDED\", and Admission.${a_oc}.capacity_present becomes false - the supersede the OCC rule exists to protect finally happens, but only from a fresh read"

      - name: sweep_expires_only_due_episodes_and_never_a_released_one
        claim_type: scheduled_actions
        grounds:
          - state_machines[RestraintEpisode].transitions[ORDERED -> EXPIRED_UNAUTHORIZED]
          - state_machines[RestraintEpisode].transitions[ACTIVE -> EXPIRED_UNAUTHORIZED]
          - endpoints[POST /behavioral-health/_compliance/sweep]
        distinguishing_aspect: "The two sweep-driven expiries use different comparisons and different duration sources - an ACTIVE episode expires at current_utc >= authorized_until_at with actual_duration_minutes = ordered_duration_minutes, an ORDERED one only at current_utc > face_to_face_deadline_at with a fixed actual_duration_minutes of 60 - while an episode released before its window closes is permanently out of the sweep's reach, and a repeated sweep at the same clock is a no-op."
        test_recipe:
          setup:
            - "Roster: intake clinician Nolan, psychiatrists Reyes (orderer) and Fenn (reviewer), charge nurse Kim; one unit with no beds needed; clock 2026-09-03T08:00:00Z."
            - "One adult patient with a signed evaluation scoring 8 (danger to others and grave disability, capacity present) whose recommendation is VOLUNTARY, admitted VOLUNTARY so no hold is involved and the sweep's other three counters stay at zero."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Alma Reyes", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-1" }
              as: ComplianceOfficer
              captures: { c_psa: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Bo Fenn", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-2" }
              as: ComplianceOfficer
              captures: { c_psb: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Rosa Kim", staff_role: "CHARGE_NURSE", license_number: "LIC-RN-2367-1" }
              as: ComplianceOfficer
              captures: { c_rn: $.data.id }
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 40 Schedules", gender_mixing_policy: "MIXED_ALLOWED", seclusion_room_count: 0 }
              as: ComplianceOfficer
              captures: { u_sw: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-SW", legal_name: "Sweep Case", age_years: 49, gender_care_category: "FEMALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_sw: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_sw}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: true, clinical_summary: "Agitation with grave self-neglect; retains capacity and consents to admission." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_sw: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_sw}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_sw}", evaluation_id: "${e_sw}", unit_id: "${u_sw}", requested_legal_status: "VOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_sw: $.data.id }
          trigger:
            - call: "POST /behavioral-health/restraints"
              payload: { admission_id: "${a_sw}", intervention_type: "MECHANICAL_RESTRAINT", ordered_duration_minutes: 30, clinical_justification: "Assaultive behaviour; reviewed episode." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { r_sw_a: $.data.id }
            - call: "POST /behavioral-health/restraints"
              payload: { admission_id: "${a_sw}", intervention_type: "MECHANICAL_RESTRAINT", ordered_duration_minutes: 30, clinical_justification: "Assaultive behaviour; never reviewed." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { r_sw_b: $.data.id }
            - call: "POST /behavioral-health/restraints"
              payload: { admission_id: "${a_sw}", intervention_type: "PHYSICAL_HOLD", ordered_duration_minutes: 30, clinical_justification: "Brief hold during medication administration." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { r_sw_c: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:10:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/restraints/${r_sw_a}/face-to-face"
              payload: { assessment_note: "Independent reviewer; restraint continues." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
            - call: "POST /behavioral-health/restraints/${r_sw_c}/face-to-face"
              payload: { assessment_note: "Orderer may review a physical hold." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:20:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/restraints/${r_sw_c}/release"
              payload: { release_note: "Patient calm; hold ended early." }
              as: ChargeNurse
              as_user_id: "${c_rn}"
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:30:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/_compliance/sweep"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/_compliance/sweep"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00.001Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/_compliance/sweep"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /behavioral-health/_compliance/sweep"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "at order time all three episodes are \"ORDERED\" with authorized_until_at \"2026-09-03T08:30:00.000Z\" and face_to_face_deadline_at \"2026-09-03T09:00:00.000Z\"; monitoring_interval_minutes is 15 for the two mechanical episodes and 5 for the physical hold"
            - "the release of ${r_sw_c} at 08:20 gives status \"RELEASED\", released_at \"2026-09-03T08:20:00.000Z\", actual_duration_minutes 20, required_check_count 4 (ceil(20 / 5)), grid_compliance_pct 0.0 and raw_compliance_pct 0.0, and Admission.${a_sw}.observation_staff_quarter_hours becomes 2 (ceil(20 / 15))"
            - "the sweep at exactly 08:30 returns expired_restraint_count 1 with expired_hold_count, expired_discharge_request_count and expired_consent_count all 0: RestraintEpisode.${r_sw_a} is \"EXPIRED_UNAUTHORIZED\" with released_at \"2026-09-03T08:30:00.000Z\" and actual_duration_minutes 30 (the ordered duration), required_check_count 2, grid_compliance_pct 0.0, raw_compliance_pct 0.0 - the ACTIVE comparison is inclusive"
            - "that sweep leaves RestraintEpisode.${r_sw_b} in \"ORDERED\" (08:30 is not past its 09:00 face-to-face deadline) and RestraintEpisode.${r_sw_c} in \"RELEASED\", and sets Admission.${a_sw}.rights_violation_flag true with Unit.${u_sw}.open_rights_violation_count 1; observation_staff_quarter_hours is now 4"
            - "the sweep at exactly 09:00 returns all four counters 0 - the ORDERED comparison is strict, so ${r_sw_b} survives its own deadline instant"
            - "the sweep one millisecond later returns expired_restraint_count 1: RestraintEpisode.${r_sw_b} is \"EXPIRED_UNAUTHORIZED\" with released_at \"2026-09-03T09:00:00.000Z\" (the deadline, not the sweep clock) and actual_duration_minutes 60 (the branch's fixed value, not the ordered 30), required_check_count 4, grid_compliance_pct 0.0 and raw_compliance_pct 0.0"
            - "Admission.${a_sw}.observation_staff_quarter_hours is 8 == ceil(20/15) + ceil(30/15) + ceil(60/15), and Unit.${u_sw}.open_rights_violation_count is still 1 - the flag is a boolean per admission, not a per-episode tally"
            - "the immediately repeated sweep at the same clock returns all four counters 0 and changes no row: both EXPIRED_UNAUTHORIZED episodes are terminal and the RELEASED one is never a sweep candidate"

      - name: rescission_cascade_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[HoldOrder].transitions[ACTIVE -> RESCINDED]
        excluded_because:
          difficulty_instance: hold_rescission_cascades_to_voluntary_then_grants_discharge_request
          rationale: "That instance walks the full four-link chain in order - closure_reason, Patient.active_hold_count, INVOLUNTARY -> VOLUNTARY, PENDING discharge request -> GRANTED_DISCHARGE and PLACED -> DISCHARGE_READY - and the companion instance discharge_frees_bed_reopens_posture_and_promotes_queued_admission covers the bed/posture/promotion chain, so a corner duplicate would add nothing."

      - name: both_dual_variant_pairs_diverge_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.hold_deadline_pair
          - calculations.monitoring_compliance_pair
        excluded_because:
          difficulty_instance: hold_deadline_calendar_vs_judicial_day_variants_diverge
          rationale: "The calendar-vs-judicial-day variants are asserted with both literals side by side there, and restraint_monitoring_grid_vs_raw_compliance_diverge does the same for the interval-grid vs raw-count compliance pair, including the delta that gates debriefing."

  - section: consistency_model
    instances:
      - name: derived_counters_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Unit.fields.raw_available_bed_count
          - entities.Patient.fields.active_hold_count
          - entities.Admission.fields.observation_staff_quarter_hours
        distinguishing_aspect: "With consistency_model immediate, every denormalized counter touched by a write is already correct in that write's own response body - no follow-up read is needed to see Patient.active_hold_count, the unit posture triple or the admission's observation hours - and a later GET must return byte-identical values."
        test_recipe:
          setup:
            - "Roster: intake clinician Nolan, psychiatrists Reyes and Fenn, charge nurse Kim; one unit with two STANDARD beds; clock 2026-09-03T08:00:00Z."
            - "One adult patient with a signed evaluation scoring 7 (MODERATE) and a certified ACTIVE hold; an INVOLUNTARY admission with a COMPLETED contraband search."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Alma Reyes", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-1" }
              as: ComplianceOfficer
              captures: { c_psa: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Bo Fenn", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-2" }
              as: ComplianceOfficer
              captures: { c_psb: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Rosa Kim", staff_role: "CHARGE_NURSE", license_number: "LIC-RN-2367-1" }
              as: ComplianceOfficer
              captures: { c_rn: $.data.id }
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 41 Counters", gender_mixing_policy: "MIXED_ALLOWED", seclusion_room_count: 0 }
              as: ComplianceOfficer
              captures: { u_im: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u_im}", wing_code: "A", room_number: "4101", bed_label: "4101-A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b_im1: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u_im}", wing_code: "A", room_number: "4102", bed_label: "4102-A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b_im2: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
