      - name: quarantining_a_lot_releases_its_held_reservations_without_a_fee
        claim_type: cross_entity
        grounds:
          - endpoints["POST /implant-lots/{lotId}/quarantine"]
          - state_machines[ImplantReservation.status] HELD -> RELEASED
          - calculations.consignment_liability
        distinguishing_aspect: "A recall is a cross-entity side effect in the opposite direction to the usual case-driven cascade, and it is the ONE release path that waives the tiered restocking fee: the reservation lands RELEASED with restocking_fee_cents 0 (not the 15% tier value of 9000) while the lot keeps every physical unit."
        test_recipe:
          setup:
            - "one owned lot (unit_cost 30000, on hand 5) with a 2-unit HELD reservation against a DRAFT case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
