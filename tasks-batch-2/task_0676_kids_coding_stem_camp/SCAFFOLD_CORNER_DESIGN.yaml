              payload: {}
              as: Guardian
              as_user_id: "${g2}"
          assert:
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "response.status == 403"

      - name: missing_auth_headers_unauthenticated
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/invalid X-User-Role returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB; request carries an unknown role."]
          setup_api_calls: []
          trigger:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: NobodyRole
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.status == 401"

  # =====================================================================
  # Cross-cutting layers — OCC happy-path, version increments
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_enrollment_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enroll-stale-session]", entities.Session.fields.version]
        distinguishing_aspect: "An enrollment carrying the CURRENT expected_session_version succeeds (201) and bumps Session.version by 1 (from 2 after open to 3), the happy path of the OCC rule."
        test_recipe:
          setup: ["OPEN session (version 2 after open); one member."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "OC1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${v0}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id }
            - call: "GET /sessions/${s1}"
              payload: {}
              as: CenterAdmin
              captures: { vafter: $.data.version }
          assert:
            - "response.status == 201"
            - "Session.${s1}.confirmed_seat_count == 1"
            - "Session.${s1}.version == 3"

      - name: occ_stale_session_version_enrollment_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enroll-stale-session]", "errors[ERR_STALE_SESSION_VERSION]"]
        distinguishing_aspect: "After one enrollment bumps Session.version, a second create still carrying the pre-bump expected_session_version is rejected ERR_STALE_SESSION_VERSION (412)."
        test_recipe:
          setup: ["OPEN session; first enrollment succeeds (version bumps); stale version retained from before the bump."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "OC2", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M2", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m2: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { vstale: $.data.version }
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${vstale}" }
              as: Guardian
              as_user_id: "${g1}"
          trigger:
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m2}", coverage: "DROP_IN", sibling_index: 2, expected_session_version: "${vstale}" }
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "response.data.error_id == ERR_STALE_SESSION_VERSION"
            - "response.status == 412"

      - name: occ_stale_showcase_version_accept_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[showcase-entry-accept-stale]", "errors[ERR_STALE_SHOWCASE_VERSION]"]
        distinguishing_aspect: "After one entry accept bumps Showcase.version, a second accept carrying the pre-bump expected_showcase_version is rejected ERR_STALE_SHOWCASE_VERSION (412)."
        test_recipe:
          setup: ["OPEN showcase capacity 5; two SUBMITTED entries; first accept bumps version; stale version retained."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "OC3", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M1", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M2", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m2: $.data.id }
            - call: "POST /showcases"
              payload: { center_id: "${c1}", program_id: "${prog}", min_belt_rank: 1, capacity: 5, starts_at: "2026-05-11T09:00:00Z", entry_deadline_at: "2026-05-10T12:00:00Z" }
              as: CenterAdmin
              captures: { sh1: $.data.id }
            - call: "POST /showcases/${sh1}/open"
              payload: {}
              as: CenterAdmin
              captures: { shstale: $.data.version }
            - call: "POST /showcase-entries"
              payload: { showcase_id: "${sh1}", member_id: "${m1}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e1: $.data.id }
            - call: "POST /showcase-entries"
              payload: { showcase_id: "${sh1}", member_id: "${m2}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { e2: $.data.id }
            - call: "POST /showcase-entries/${e1}/accept"
              payload: { expected_showcase_version: "${shstale}" }
              as: CenterAdmin
          trigger:
            - call: "POST /showcase-entries/${e2}/accept"
              payload: { expected_showcase_version: "${shstale}" }
              as: CenterAdmin
          assert:
            - "response.data.error_id == ERR_STALE_SHOWCASE_VERSION"
            - "response.status == 412"

      - name: showcase_cancel_withdraws_entries_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Showcase.OPEN_to_CANCELLED, entities.ShowcaseEntry.fields.status, entities.Showcase.fields.accepted_entry_count]
        distinguishing_aspect: "Cancelling an OPEN showcase with one ACCEPTED entry cascades the entry to WITHDRAWN and resets accepted_entry_count to 0."
        test_recipe:
          setup: ["OPEN showcase with one ACCEPTED entry (accepted_entry_count 1)."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "SC1", min_age: 4, max_age: 18, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M", birth_date: "2016-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /showcases"
              payload: { center_id: "${c1}", program_id: "${prog}", min_belt_rank: 1, capacity: 5, starts_at: "2026-05-11T09:00:00Z", entry_deadline_at: "2026-05-10T12:00:00Z" }
              as: CenterAdmin
              captures: { sh1: $.data.id }
            - call: "POST /showcases/${sh1}/open"
              payload: {}
              as: CenterAdmin
              captures: { shv0: $.data.version }
            - call: "POST /showcase-entries"
              payload: { showcase_id: "${sh1}", member_id: "${m1}" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { entry1: $.data.id }
            - call: "POST /showcase-entries/${entry1}/accept"
              payload: { expected_showcase_version: "${shv0}" }
              as: CenterAdmin
          trigger:
            - call: "POST /showcases/${sh1}/cancel"
              payload: {}
              as: CenterAdmin
          assert:
            - "ShowcaseEntry.${entry1}.status == WITHDRAWN"
            - "Showcase.${sh1}.accepted_entry_count == 0"

