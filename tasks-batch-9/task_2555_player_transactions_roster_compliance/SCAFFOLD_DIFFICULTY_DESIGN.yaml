              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T14:00:00Z" }
              as: LeagueOfficer
            - call: "GET /teams/${team_a_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { team_a_v5: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "IR_ACTIVATION", expected_team_version: "${team_a_v5}", injury_designation_id: "${inj3_id}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn_act_id: $.data.id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "RETURN_PHYSICAL", window_start_at: "2026-08-31T13:00:00Z", window_end_at: "2026-08-31T20:00:00Z", transaction_id: "${txn_act_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex_ret_id: $.data.id }
            - call: "POST /physical-exams/${ex_ret_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-31T14:00:00Z" }
              as: TeamMedicalOfficer
