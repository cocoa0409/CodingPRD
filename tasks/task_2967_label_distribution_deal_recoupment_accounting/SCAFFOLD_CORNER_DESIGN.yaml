              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000240", title: "Heavyweight", planned_release_date: "2026-02-01", formats: ["VINYL", "DIGITAL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-E2-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          trigger:
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_id}", units_planned: 1500, unit_manufacturing_cost_cents: 250, window_start: "2026-04-01", window_end: "2026-06-30" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_id: $.data.id, run_v: $.data.version, run_status: $.data.status, run_reserve_status: $.data.reserve_status, run_pct: $.data.returns_reserve_pct }
            - call: "POST /physical-runs/${run_id}/manufacture"
              payload: { units_manufactured: 1200 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_cost: $.data.manufacturing_cost_cents, run_status2: $.data.status, run_v2: $.data.version }
            - call: "POST /physical-runs/${run_id}/manufacture"
              payload: { units_manufactured: 100 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_state: $.data.error_id }
            - call: "GET /physical-runs?release_id=${rel1_id}&status=MANUFACTURED&limit=50&offset=0"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "${run_status} == \"PLANNED\", ${run_reserve_status} == \"HELD\" and ${run_v} == 1 immediately after creation, with manufacturing_cost_cents null and units_manufactured null"
            - "${run_pct} is null: the omitted optional input is NOT eagerly copied from the distributor — the fallback happens inside returns_reserve_obligation at ship time"
            - "${run_cost} == 300000 == 1200 * 250, computed from units_manufactured and NOT from units_planned 1500 (which would give 375000)"
            - "${run_status2} == \"MANUFACTURED\" and ${run_v2} == ${run_v} + 1"
            - "${e_state} == \"ERR_INVALID_RUN_STATE\" with HTTP 409 on the second manufacture: PLANNED is the only declared from-state"
            - "manufacturing_cost_cents is still 300000 and units_manufactured still 1200 after the rejection — the 409 did not partially apply the 100-unit body"
            - "the filtered list returns exactly this one run, and its reserve_status is still \"HELD\": manufacture never touches the reserve dimension"

      - name: distributor_active_deal_count_recomputes_on_every_lifecycle_hop
        claim_type: computed_read
        grounds:
          - entities[Distributor].fields[active_deal_count]
          - endpoints[GET /distributors/{id}]
          - state_machines[DistributionDeal.status].transitions[DRAFT->EXECUTED]
          - state_machines[DistributionDeal.status].transitions[EXECUTED->EXPIRED]
        distinguishing_aspect: |
          active_deal_count counts only {EXECUTED, TERMINATION_NOTICE, POST_TERM_COLLECTION}, so one
          distributor carrying three deals walks 0 -> 2 -> 1 -> 2 -> 1 as the deals move: executing two
          raises it to 2, EXPIRING one drops it (EXPIRED is NOT collecting), TERMINATING the other
          keeps it counted (TERMINATION_NOTICE IS), entering post-term collection still counts, and
          CLOSING removes it. A cached counter incremented on execute and decremented on close reports
          2 after the expiry.
