              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "LOCKER" }
              as: PlatformAdmin
              captures: { slot1: $.data.id, slot1_v: $.data.version }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "LOCKER" }
              as: PlatformAdmin
              captures: { slot2: $.data.id, slot2_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "lk1@x.com", full_name: "LK1", home_store_id: "${store_id}" }
              as: Customer
              captures: { c1: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", store_id: "${store_id}", pickup_slot_id: "${slot1}" }
              as: Customer
              as_user_id: "${c1}"
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /orders/${o1}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot1_v}" }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /customers"
              payload: { email: "lk2@x.com", full_name: "LK2", home_store_id: "${store_id}" }
              as: Customer
              captures: { c2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c2}", store_id: "${store_id}", pickup_slot_id: "${slot2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c2}"
          trigger:
            - call: "POST /orders/${o2}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot2_v}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_LOCKER_AVAILABLE"
            - "PickupSlot.${slot2}.reserved_count == 0"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_points_balance_invariant
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - calculations.redemption_value
          - entities.LoyaltyAccount.fields.points_balance
        distinguishing_aspect: >-
          Conserved quantity = LoyaltyAccount.points_balance. Place (redeem 300) then cancel must leave
          points_balance identical to its pre-place value (500): REDEEM -300 then compensating
          ADJUSTMENT +300 net zero, no drift.
        test_recipe:
          setup:
            - "Customer with seeded points_balance 500; a CART order subtotal 2900 (counter) placed with points_redeemed 300 (discount 300)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Inv1", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Bowl", base_price_cents: 1450, base_calories: 600 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "inv1@x.com", full_name: "INV1", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_iv: $.data.id, la_iv: $.data.loyalty_account_id }
            - call: "POST /points-ledger-entries"
              payload: { loyalty_account_id: "${la_iv}", delta_points: 500, reason: "ADJUSTMENT" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_iv}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_iv}"
              captures: { ord_iv: $.data.id }
            - call: "POST /orders/${ord_iv}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_iv}"
            - call: "POST /orders/${ord_iv}/place"
              payload: { points_redeemed: 300, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_iv}"
          trigger:
            - call: "POST /orders/${ord_iv}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: Customer
              as_user_id: "${cust_iv}"
          assert:
            - "LoyaltyAccount.${la_iv}.points_balance == 500"
            - "Order.${ord_iv}.settlement_status == REFUNDED"

      - name: cancel_restores_wallet_credit_invariant
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - calculations.order_total
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: >-
          Conserved quantity = Customer.wallet_credit_cents (a different conserved quantity than points).
          Place applying 500 wallet then cancel must restore wallet_credit_cents to 500 (the pre-place
          value): debit -500 then compensating re-credit +500, no drift.
        test_recipe:
          setup:
            - "Customer with seeded wallet_credit_cents 500; a CART counter order subtotal 2900 placed (wallet_applied 500)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Inv2", state_code: "TX", throughput_capacity_per_slot: 10, locker_count: 0 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${store_id}", name: "Bowl", base_price_cents: 1450, base_calories: 600 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${store_id}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "inv2@x.com", full_name: "INV2", home_store_id: "${store_id}" }
              as: Customer
              captures: { cust_iw: $.data.id }
            - call: "POST /customers/${cust_iw}/wallet/adjustments"
              payload: { delta_cents: 500, reason: "SEED" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_iw}", store_id: "${store_id}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cust_iw}"
              captures: { ord_iw: $.data.id }
            - call: "POST /orders/${ord_iw}/lines"
              payload: { menu_item_id: "${item_id}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_iw}"
            - call: "POST /orders/${ord_iw}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cust_iw}"
          trigger:
            - call: "POST /orders/${ord_iw}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: Customer
              as_user_id: "${cust_iw}"
          assert:
            - "Customer.${cust_iw}.wallet_credit_cents == 500"
            - "Order.${ord_iw}.settlement_status == REFUNDED"
