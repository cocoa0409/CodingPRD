            - "closures_activated == 0 and closures_completed == 0 and dogs_expired == 0 and stations_flagged == 0"

      - name: cascade_layer_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.IncidentReport.UNDER_REVIEW_to_CONFIRMED
        excluded_because:
          difficulty_instance: incident_confirm_suspension_cascade
          rationale: "§1.8 instance asserts the full depth-4 suspension cascade end-to-end."

      - name: threshold_layer_covered
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.strike_score
        excluded_because:
          difficulty_instance: strike_threshold_exact_30
          rationale: "§1.8 instance asserts the >= 30 strike boundary precisely."

