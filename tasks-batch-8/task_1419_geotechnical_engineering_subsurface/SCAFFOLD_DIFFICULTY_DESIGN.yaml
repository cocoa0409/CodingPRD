  - rule_id: priority_pair_validation_conflict
    instances:
      - name: drill_state_error_beats_clearance_expired_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CLEARANCE_EXPIRED]
        distinguishing_aspect: |
          Category pair (state, business_safety): the drill request violates both (boring still
          SCHEDULED, not CLEARED; and its clearance has EXPIRED via clock sweep). Priority 5
          state check wins, so ERR_INVALID_STATE is returned, not ERR_CLEARANCE_EXPIRED.
        test_recipe:
          setup:
            - "Project in FIELDWORK, boring B-1 SCHEDULED with rig MOBILIZED; clearance T-1 was CLEARED but the logical clock is now 2026-08-16, strictly after expires_on 2026-08-15T00:00:00Z (ticket swept to EXPIRED)"
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
