# =============================================================================
# Contract Lifecycle Management (CLM) — benchmark seed tables (Expert tier)
# §1.0 – §1.7  (this file)
# §1.8 -> SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 -> SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Contract Lifecycle Management (CLM): template/clause library, approval routing,
  redline/version, e-signature, obligation/milestone tracking, renewal/auto-renew
  alert, risk scoring, fallback/deviation approval

domain_name: contract-lifecycle-management
# Flat resource topology: each entity has its own top-level collection
# (/organizations, /contracts, /clause-templates, ...), so there is no shared
# URL prefix beyond the root. api_prefix is the empty string accordingly.
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - contagion_risk_propagation
    - scheduled_deferred_actions

  entity_topology: hybrid
  # Contract is the hub. ClauseTemplate / ContractTemplate are configuration
  # libraries (flat, referenced by id). ContractVersion, Obligation,
  # SignatureRequest, DeviationApproval, RenewalAlert, AuditEvent hang off the
  # Contract. ApprovalWorkflow/ApprovalStep model the routing pipeline.

  state_machine_shape: cyclic
  # Contract has a redline/negotiation cycle (UNDER_REVIEW -> REDLINING ->
  # UNDER_REVIEW). SignatureRequest is branching (fork to multiple parties,
  # join when all sign). Obligation runs a parallel completion dimension.

  relationship_patterns:
    - one_to_many        # Contract -> ContractVersion, Obligation, SignatureRequest
    - many_to_many       # ContractTemplate <-> ClauseTemplate via clause_template_ids
    - cross_aggregate    # DeviationApproval references a ClauseTemplate and a ContractVersion

  role_model: segregation_of_duties
  # A user who drafted or authored a version cannot approve their own contract;
  # the deviation approver and the workflow approver are distinct decision seats.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization (tenant) display name" }
      - { name: risk_appetite_threshold, type: integer, source: input, default: 60, description: "Risk score (0-100) at or above which a contract MUST have an approved DeviationApproval before it can be sent for signature; see §1.4 priority 12 and §1.3 risk_score" }
      - { name: auto_renew_lead_days, type: integer, source: input, default: 30, description: "Days before a contract expiry_date at which the renewal alert becomes DUE (used by §1.3 renewal_alert_window and the clock-advance sweep)" }

  - name: ClauseTemplate
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: clause_key, type: string, source: input, description: "Stable business key (e.g. LIABILITY_CAP); unique per organization_id among ClauseTemplate rows whose status IN {ACTIVE} (case-sensitive)" }
      - { name: category, type: enum, source: input, description: "LIABILITY | INDEMNITY | TERMINATION | PAYMENT | CONFIDENTIALITY | OTHER" }
      - { name: standard_text, type: string, source: input, description: "The fallback (preferred / standard) clause text" }
      - { name: risk_weight, type: integer, source: input, description: "Per-clause risk contribution 0-40 used by §1.3 risk_score when this clause is deviated from the standard text" }
      - { name: is_mandatory, type: boolean, source: input, default: false, description: "When true, a ContractVersion that drops this clause (for a contract whose template required it) cannot be approved; see §1.4 priority 9" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED — see ClauseTemplate state machine" }

  - name: ContractTemplate
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: name, type: string, source: input, description: "Template display name" }
      - { name: clause_template_ids, type: array, source: input, description: "Ordered list of ClauseTemplate.id this template composes (the standard clause set); each MUST belong to the same organization_id and have status ACTIVE at template-create time" }
      - { name: default_term_months, type: integer, source: input, default: 12, description: "Default contract term length in months, copied onto a Contract at creation" }
      - { name: auto_renew_default, type: boolean, source: input, default: false, description: "Default value copied onto Contract.auto_renew at creation" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: contract_template_id, type: string, source: input, description: "FK -> ContractTemplate.id" }
      - { name: counterparty_name, type: string, source: input, description: "Name of the other contracting party" }
      - { name: title, type: string, source: input, description: "Contract title" }
      - { name: term_months, type: integer, source: input, description: "Term length in months (defaults from ContractTemplate.default_term_months if omitted)" }
      - { name: auto_renew, type: boolean, source: input, description: "Whether the contract auto-renews at expiry (defaults from ContractTemplate.auto_renew_default if omitted)" }
      - { name: effective_date, type: datetime, source: system, default: null, description: "Set to the clock time at the moment all SignatureRequests reach SIGNED and the contract enters ACTIVE" }
      - { name: expiry_date, type: datetime, source: computed, default: null, description: "= effective_date + term_months months; recomputed on renewal; null until ACTIVE" }
      - { name: current_version_id, type: string, source: system, default: null, description: "FK -> ContractVersion.id — the latest ContractVersion (highest version_number); null until the first version is created" }
      - { name: drafter_user_id, type: string, source: system, description: "X-User-ID of the ContractManager who created the contract; used by §1.7 segregation-of-duties" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Current weighted risk score 0-100 of current_version per §1.3 risk_score; recomputed whenever the current version changes or is approved" }
      - { name: renewal_cycle_index, type: integer, source: system, default: 0, description: "Number of completed auto-renewals; increments on each renewal" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | UNDER_REVIEW | REDLINING | APPROVED | OUT_FOR_SIGNATURE | ACTIVE | EXPIRED | TERMINATED | CANCELLED — see Contract state machine" }

  - name: ContractVersion
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: version_number, type: integer, source: system, description: "Monotonic 1,2,3...; assigned server-side as (max existing version_number for this contract) + 1" }
      - { name: authored_by_party, type: enum, source: input, description: "INTERNAL | COUNTERPARTY — which side produced this redline" }
      - { name: authored_by_user_id, type: string, source: system, default: null, description: "X-User-ID that created the version when authored_by_party=INTERNAL; null for COUNTERPARTY" }
      - { name: clauses, type: array, source: input, description: "Array of { clause_template_id, text, is_deviation } objects; is_deviation=true means text differs from the ClauseTemplate.standard_text" }
      - { name: deviation_count, type: integer, source: computed, default: 0, description: "Count of clauses[] entries with is_deviation=true; see §1.3 risk_score input set" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | SUPERSEDED | ACCEPTED — a version is ACCEPTED once its contract reaches APPROVED on this version; SUPERSEDED when a newer version is created" }

  - name: ApprovalWorkflow
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: pinned_version_id, type: string, source: system, description: "FK -> ContractVersion.id — the ContractVersion.id that was current when the workflow was started; approval is pinned to this version" }
      - { name: required_approver_count, type: integer, source: system, default: 1, description: "Number of distinct ApprovalStep APPROVE decisions required to reach APPROVED (quorum). Copied from the submit request's required_approver_count input (default 1) at workflow-creation time." }
      - { name: approvals_received, type: integer, source: computed, default: 0, description: "Count of ApprovalStep rows with decision=APPROVE on this workflow" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | REJECTED | VOIDED — see ApprovalWorkflow state machine" }

  - name: ApprovalStep
    parent: ApprovalWorkflow
    common_fields: false
    fields:
      - { name: approval_workflow_id, type: string, source: input, description: "FK -> ApprovalWorkflow.id" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the ContractApprover who recorded this decision" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT" }
      - { name: comment, type: string, source: input, default: null, description: "Optional reviewer note" }

  - name: SignatureRequest
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: signer_party, type: enum, source: input, description: "INTERNAL | COUNTERPARTY — which side this signature represents" }
      - { name: signer_name, type: string, source: input, description: "Display name of the signer" }
      - { name: signed_at, type: datetime, source: system, default: null, description: "Clock time the signature was recorded; null until SIGNED" }
      - { name: status, type: enum, source: system, default: "SENT", description: "SENT | SIGNED | DECLINED | VOIDED — see SignatureRequest state machine" }

  - name: Obligation
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: description, type: string, source: input, description: "What must be done" }
      - { name: owner_party, type: enum, source: input, description: "INTERNAL | COUNTERPARTY — who owes this obligation" }
      - { name: due_date, type: datetime, source: input, description: "When the obligation is due (ISO 8601 UTC)" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock time fulfilment was recorded; null until FULFILLED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FULFILLED | BREACHED | WAIVED — see Obligation state machine" }

  - name: DeviationApproval
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: contract_version_id, type: string, source: input, description: "FK -> ContractVersion.id — the version whose deviations this approval clears" }
      - { name: clause_template_id, type: string, source: input, description: "FK -> ClauseTemplate.id — the deviated clause this approval covers" }
      - { name: justification, type: string, source: input, description: "Why the deviation is acceptable" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RiskOfficer who decided; null while PENDING" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | GRANTED | DENIED — see DeviationApproval state machine" }

  - name: RenewalAlert
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: trigger_date, type: datetime, source: computed, description: "= contract.expiry_date - organization.auto_renew_lead_days days; the clock time at or after which the alert becomes DUE" }
      - { name: resolution, type: enum, source: system, default: null, description: "RENEWED | LET_LAPSE | null — how the alert was resolved" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | DUE | RESOLVED | CANCELLED — see RenewalAlert state machine" }

  - name: AuditEvent
    parent: Contract
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: event_type, type: enum, source: system, description: "CONTRACT_CREATED | VERSION_CREATED | SUBMITTED | REDLINE_OPENED | APPROVED | REJECTED | SENT_FOR_SIGNATURE | SIGNED | ACTIVATED | RENEWED | TERMINATED | OBLIGATION_BREACHED | DEVIATION_GRANTED | DEVIATION_DENIED" }
      - { name: actor_user_id, type: string, source: system, default: null, description: "X-User-ID that caused the event; null for system-generated events" }
      - { name: detail, type: string, source: system, default: null, description: "Human-readable summary stamped at write time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ----------------------------------------------------------------------- #
  # ClauseTemplate — simple lifecycle for the library
  # ----------------------------------------------------------------------- #
  - entity: ClauseTemplate
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /clause-templates/{id}/retire"
        actor: ClauseLibrarian
        preconditions:
          - "No Contract whose status IN {DRAFT, UNDER_REVIEW, REDLINING} has a current_version clause referencing this ClauseTemplate.id (else ERR_CLAUSE_IN_USE)"
        side_effects:
          - "Sets status=RETIRED"
          - "increments ClauseTemplate.version by 1"

  # ----------------------------------------------------------------------- #
  # ContractTemplate — simple lifecycle
  # ----------------------------------------------------------------------- #
  - entity: ContractTemplate
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /contract-templates/{id}/retire"
        actor: ClauseLibrarian
        preconditions:
          - "No Contract with status IN {DRAFT, UNDER_REVIEW, REDLINING} references this template (else ERR_TEMPLATE_IN_USE)"
        side_effects:
          - "Sets status=RETIRED"
          - "increments ContractTemplate.version by 1"

  # ----------------------------------------------------------------------- #
  # Contract — CYCLIC: redline negotiation loop UNDER_REVIEW <-> REDLINING
  # ----------------------------------------------------------------------- #
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /contracts/{id}/submit"
        actor: ContractManager
        preconditions:
          - "contract.current_version_id is not null (at least one ContractVersion exists; else ERR_NO_VERSION)"
          - "expected_contract_version supplied and matches Contract.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Creates an ApprovalWorkflow with status=PENDING, pinned_version_id = contract.current_version_id, approvals_received=0"
          - "recomputes Contract.risk_score via §1.3 risk_score over the pinned current version"
          - "appends an AuditEvent { event_type: SUBMITTED }"
          - "increments Contract.version by 1"
        note: "current_version's ContractVersion.status stays PROPOSED until APPROVED."

      - from: UNDER_REVIEW
        to: REDLINING
        trigger: "POST /contracts/{id}/versions  (creating a new ContractVersion while UNDER_REVIEW)"
        actor: ContractManager | system
        preconditions:
          - "The contract's open ApprovalWorkflow has status=PENDING"
        side_effects:
          - "The prior current_version ContractVersion.status -> SUPERSEDED"
          - "the prior open ApprovalWorkflow.status -> VOIDED (its pinned version is no longer current)"
          - "any PENDING DeviationApproval whose contract_version_id is the now-superseded version -> DENIED (stale-version compensation)"
          - "Contract.current_version_id -> new version; Contract.risk_score recomputed via §1.3 risk_score"
          - "appends an AuditEvent { event_type: REDLINE_OPENED }"
          - "increments Contract.version by 1"
        note: "CYCLE entry: a new redline during review bounces the contract back to REDLINING."

      - from: REDLINING
        to: UNDER_REVIEW
        trigger: "POST /contracts/{id}/submit"
        actor: ContractManager
        preconditions:
          - "contract.current_version_id is not null"
          - "expected_contract_version supplied and matches Contract.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Creates a fresh ApprovalWorkflow with status=PENDING, pinned_version_id = contract.current_version_id, approvals_received=0"
          - "recomputes Contract.risk_score via §1.3 risk_score"
          - "appends an AuditEvent { event_type: SUBMITTED }"
          - "increments Contract.version by 1"
        note: "CYCLE close: resubmitting after a redline returns to UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system (automatic when the open ApprovalWorkflow reaches status=APPROVED — its approvals_received >= required_approver_count)"
        actor: system
        preconditions:
          - "The open ApprovalWorkflow.pinned_version_id == Contract.current_version_id (version still current; else the workflow would already be VOIDED)"
        side_effects:
          - "current_version ContractVersion.status -> ACCEPTED"
          - "appends an AuditEvent { event_type: APPROVED }"
          - "increments Contract.version by 1"

      - from: UNDER_REVIEW
        to: REDLINING
        trigger: "system (automatic when the open ApprovalWorkflow reaches status=REJECTED — any ApprovalStep decision=REJECT)"
        actor: system
        preconditions: []
        side_effects:
          - "appends an AuditEvent { event_type: REJECTED }"
          - "increments Contract.version by 1"
        note: "Rejection sends the contract back into the redline loop for a new internal version."

      - from: APPROVED
        to: OUT_FOR_SIGNATURE
        trigger: "POST /contracts/{id}/send-for-signature"
        actor: ContractManager
        preconditions:
          - "Contract.risk_score < organization.risk_appetite_threshold, OR every ClauseTemplate deviated in the current_version has a GRANTED DeviationApproval whose contract_version_id == Contract.current_version_id (else ERR_DEVIATION_REQUIRED)"
          - "expected_contract_version supplied and matches Contract.version (else ERR_STALE_VERSION)"
          - "request body lists >=1 INTERNAL signer and >=1 COUNTERPARTY signer (else ERR_SIGNERS_INCOMPLETE)"
        side_effects:
          - "Creates one SignatureRequest (status=SENT) per signer in the request body"
          - "appends an AuditEvent { event_type: SENT_FOR_SIGNATURE }"
          - "increments Contract.version by 1"

      - from: OUT_FOR_SIGNATURE
        to: ACTIVE
        trigger: "system (automatic when ALL SignatureRequests for the contract reach status=SIGNED)"
        actor: system
        preconditions:
          - "Every SignatureRequest for the contract has status=SIGNED"
        side_effects:
          - "Sets Contract.effective_date = current clock time"
          - "computes Contract.expiry_date = effective_date + term_months months via §1.3 expiry_projection"
          - "Creates a RenewalAlert (status=SCHEDULED) with trigger_date per §1.3 renewal_alert_window"
          - "appends an AuditEvent { event_type: ACTIVATED }"
          - "increments Contract.version by 1"

      - from: OUT_FOR_SIGNATURE
        to: REDLINING
        trigger: "system (automatic when ANY SignatureRequest reaches status=DECLINED)"
        actor: system
        preconditions: []
        side_effects:
          - "All other SignatureRequests for the contract with status=SENT -> VOIDED (cascade)"
          - "appends an AuditEvent { event_type: REJECTED }"
          - "increments Contract.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /contracts/{id}/renew  OR  system (clock-advance sweep when auto_renew=true and a RenewalAlert is DUE)"
        actor: ContractManager | system
        preconditions:
          - "There exists a RenewalAlert with status=DUE for this contract (else ERR_RENEWAL_NOT_DUE)"
          - "No Obligation for this contract has status=BREACHED (else ERR_OPEN_BREACH)"
        side_effects:
          - "Contract.renewal_cycle_index incremented by 1"
          - "Contract.effective_date -> prior expiry_date; Contract.expiry_date recomputed via §1.3 expiry_projection"
          - "the DUE RenewalAlert.status -> RESOLVED, resolution=RENEWED"
          - "a new RenewalAlert (status=SCHEDULED) is created for the new expiry_date"
          - "appends an AuditEvent { event_type: RENEWED }"
          - "increments Contract.version by 1"
        note: "Self-loop: renewal keeps the contract ACTIVE with an extended term."

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock-advance sweep when current clock time >= expiry_date AND auto_renew=false)"
        actor: system
        preconditions: []
        side_effects:
          - "Any RenewalAlert with status IN {SCHEDULED, DUE} -> RESOLVED, resolution=LET_LAPSE"
          - "Every Obligation with status=OPEN -> WAIVED (contract no longer active)"
          - "increments Contract.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: ContractManager
        preconditions:
          - "expected_contract_version supplied and matches Contract.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Every Obligation with status IN {OPEN} -> WAIVED (cascade)"
          - "Any RenewalAlert with status IN {SCHEDULED, DUE} -> CANCELLED"
          - "appends an AuditEvent { event_type: TERMINATED }"
          - "increments Contract.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /contracts/{id}/cancel"
        actor: ContractManager
        preconditions:
          - "expected_contract_version supplied and matches Contract.version (else ERR_STALE_VERSION)"
        side_effects:
          - "increments Contract.version by 1"

      - from: REDLINING
        to: CANCELLED
        trigger: "POST /contracts/{id}/cancel"
        actor: ContractManager
        preconditions:
          - "expected_contract_version supplied and matches Contract.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Any open ApprovalWorkflow with status=PENDING -> VOIDED"
          - "increments Contract.version by 1"

  # ----------------------------------------------------------------------- #
  # ContractVersion — status driven entirely by Contract side-effects
  # (no client-facing transition endpoint of its own)
  # ----------------------------------------------------------------------- #
  - entity: ContractVersion
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (side-effect of Contract POST /contracts/{id}/versions creating a newer ContractVersion)"
        actor: system
        preconditions:
          - "This version is the contract's current_version_id and a newer version is being created"
        side_effects:
          - "Contract.current_version_id moves to the new version"
          - "increments ContractVersion.version by 1"
        note: "Used by the depth-3 redline cascade: supersede -> workflow VOIDED -> deviation DENIED."

      - from: PROPOSED
        to: ACCEPTED
        trigger: "system (side-effect of Contract UNDER_REVIEW -> APPROVED when the workflow pinned to this version reaches quorum)"
        actor: system
        preconditions:
          - "This version is the contract's current_version_id and the open ApprovalWorkflow.pinned_version_id == this version"
        side_effects:
          - "increments ContractVersion.version by 1"
        note: "ACCEPTED is the only non-SUPERSEDED terminal-ish status; an ACCEPTED version is never re-superseded because APPROVED contracts do not accept new versions."

  # ----------------------------------------------------------------------- #
  # ApprovalWorkflow — branching quorum (bubble-up to Contract)
  # ----------------------------------------------------------------------- #
  - entity: ApprovalWorkflow
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "system (automatic when an ApprovalStep APPROVE pushes approvals_received >= required_approver_count)"
        actor: system
        preconditions:
          - "pinned_version_id == Contract.current_version_id (else workflow is VOIDED instead)"
        side_effects:
          - "Bubbles up: parent Contract UNDER_REVIEW -> APPROVED"
          - "increments ApprovalWorkflow.version by 1"

      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-workflows/{id}/steps  with decision=REJECT"
        actor: ContractApprover
        preconditions:
          - "Caller's X-User-ID != Contract.drafter_user_id AND != current_version.authored_by_user_id (segregation of duties; else ERR_SELF_APPROVAL)"
        side_effects:
          - "Bubbles up: parent Contract UNDER_REVIEW -> REDLINING"
          - "increments ApprovalWorkflow.version by 1"

      - from: PENDING
        to: VOIDED
        trigger: "system (when a new ContractVersion supersedes pinned_version_id, or the contract is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ApprovalWorkflow.version by 1"

  # ----------------------------------------------------------------------- #
  # SignatureRequest — branching fork/join (join bubbles to Contract ACTIVE)
  # ----------------------------------------------------------------------- #
  - entity: SignatureRequest
    initial_state: SENT
    terminal_states: [SIGNED, DECLINED, VOIDED]
    transitions:
      - from: SENT
        to: SIGNED
        trigger: "POST /signature-requests/{id}/sign"
        actor: Signer
        preconditions:
          - "parent Contract.status == OUT_FOR_SIGNATURE (else ERR_INVALID_STATE)"
        side_effects:
          - "Sets signed_at = current clock time"
          - "JOIN check: if all sibling SignatureRequests are now SIGNED, parent Contract OUT_FOR_SIGNATURE -> ACTIVE (cascade)"
          - "increments SignatureRequest.version by 1"

      - from: SENT
        to: DECLINED
        trigger: "POST /signature-requests/{id}/decline"
        actor: Signer
        preconditions:
          - "parent Contract.status == OUT_FOR_SIGNATURE (else ERR_INVALID_STATE)"
        side_effects:
          - "Bubbles up: parent Contract OUT_FOR_SIGNATURE -> REDLINING; sibling SENT SignatureRequests -> VOIDED (cascade)"
          - "increments SignatureRequest.version by 1"

      - from: SENT
        to: VOIDED
        trigger: "system (a sibling DECLINED, or contract left OUT_FOR_SIGNATURE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SignatureRequest.version by 1"

  # ----------------------------------------------------------------------- #
  # Obligation — parallel completion dimension; can breach independently
  # ----------------------------------------------------------------------- #
  - entity: Obligation
    initial_state: OPEN
    terminal_states: [FULFILLED, BREACHED, WAIVED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "POST /obligations/{id}/fulfill"
        actor: ContractManager
        preconditions:
          - "parent Contract.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Sets completed_at = current clock time"
          - "increments Obligation.version by 1"

      - from: OPEN
        to: BREACHED
        trigger: "system (clock-advance sweep when current clock time > due_date AND status still OPEN AND parent Contract.status == ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "appends an AuditEvent { event_type: OBLIGATION_BREACHED } on the parent contract"
          - "increments Obligation.version by 1"
        note: "A BREACHED obligation blocks renewal (see Contract ACTIVE->ACTIVE preconditions)."

      - from: OPEN
        to: WAIVED
        trigger: "POST /obligations/{id}/waive  OR  system (cascade when contract TERMINATED or EXPIRED)"
        actor: ContractManager | system
        preconditions: []
        side_effects:
          - "increments Obligation.version by 1"

  # ----------------------------------------------------------------------- #
  # DeviationApproval — fallback/deviation decision seat (RiskOfficer)
  # ----------------------------------------------------------------------- #
  - entity: DeviationApproval
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /deviation-approvals/{id}/decide  with decision=GRANT"
        actor: RiskOfficer
        preconditions:
          - "contract_version_id == parent Contract.current_version_id (else ERR_DEVIATION_STALE)"
          - "Caller's X-User-ID != Contract.drafter_user_id (segregation of duties; else ERR_SELF_APPROVAL)"
        side_effects:
          - "Sets decided_by_user_id = caller X-User-ID"
          - "appends an AuditEvent { event_type: DEVIATION_GRANTED }"
          - "increments DeviationApproval.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /deviation-approvals/{id}/decide  with decision=DENY  OR  system (cascade when the covered version is superseded)"
        actor: RiskOfficer | system
        preconditions: []
        side_effects:
          - "appends an AuditEvent { event_type: DEVIATION_DENIED }"
          - "increments DeviationApproval.version by 1"

  # ----------------------------------------------------------------------- #
  # RenewalAlert — scheduled/deferred action surfaced by the clock sweep
  # ----------------------------------------------------------------------- #
  - entity: RenewalAlert
    initial_state: SCHEDULED
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (clock-advance sweep when current clock time >= trigger_date AND parent Contract.status == ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RenewalAlert.version by 1"

      - from: DUE
        to: RESOLVED
        trigger: "system (when parent contract renews, lets lapse to EXPIRED, or is terminated)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets resolution = RENEWED (on renew) or LET_LAPSE (on expiry)"
          - "increments RenewalAlert.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (when parent contract is TERMINATED before the alert fires)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RenewalAlert.version by 1"

      - from: DUE
        to: CANCELLED
        trigger: "system (when parent contract is TERMINATED while the alert is DUE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RenewalAlert.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version only)
# =============================================================================
concurrency_rules:
  - rule_id: workflow-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/submit"
    occ_field: "expected_contract_version"
    description: |
      Submitting a Contract for review against a Contract whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has already created a new ContractVersion (which
      legitimately becomes the current version and supersedes the prior one),
      so the submitting client's view of the contract — and of which version it
      believes it is sending to approval — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: version-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/versions"
    occ_field: "expected_contract_version"
    description: |
      Creating a new ContractVersion against a Contract whose version has
      advanced since the client last observed it is rejected. A new version
      legitimately supersedes whatever was current; a second writer working
      from a stale view of the contract would otherwise branch the redline
      history off a version that is no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: risk_score
    trigger: "On Contract submit, on new ContractVersion creation, and on workflow APPROVED — recompute Contract.risk_score over the current_version's clauses[]"
    algorithm: weighted_scoring
    formula: |
      # Inputs: current_version.clauses[] (the array on Contract.current_version_id),
      # each clause references a ClauseTemplate by clause_template_id with a risk_weight.
      #
      # raw = sum over clauses where is_deviation == true of:
      #         ClauseTemplate(clause_template_id).risk_weight
      # mandatory_penalty = MANDATORY_MISS_PENALTY for EACH mandatory ClauseTemplate
      #   that the contract's ContractTemplate.clause_template_ids requires but that
      #   is ABSENT from current_version.clauses[] (no entry with that clause_template_id)
      # risk_score = min(100, raw + mandatory_penalty)
      #
      # PROVISIONAL vs FINAL differ ONLY in the input set (see variants), never in
      # the arithmetic above. Cap at 100; floor at 0.
    input_set: "current_version.clauses[] joined to ClauseTemplate.risk_weight; only is_deviation==true clauses contribute raw weight; mandatory-miss penalty added per missing mandatory clause"
    constants:
      MANDATORY_MISS_PENALTY: 25
      SCORE_CEILING: 100
      SCORE_FLOOR: 0
    precision: "integer; no fractional component; clamp to [0,100] AFTER summation (sum first, then clamp)"
    variants:
      - name: provisional
        when: "Computed at submit / version-create time, while the workflow is still PENDING."
        difference: "Input set includes ALL clauses currently marked is_deviation==true, even those with a PENDING (not yet decided) DeviationApproval."
      - name: final
        when: "Recomputed at workflow APPROVED time."
        difference: "Input set EXCLUDES the risk_weight of any deviated clause that has a GRANTED DeviationApproval for the current version — those deviations are considered cleared, so they no longer add weight. Mandatory-miss penalty is unaffected."

  - name: clause_deviation_cost
    trigger: "Read endpoint GET /contracts/{id}/cost-estimate; recomputed on demand"
    algorithm: tiered_pricing
    formula: |
      # A *separate* monetary estimate of legal-review cost for the current_version,
      # operating on the DEVIATION COUNT (not risk weight). Tiered by deviation_count:
      #   tier boundaries on n = current_version.deviation_count:
      #     n in [0,0]        -> base only
      #     n in [1,3]        -> base + n * TIER1_RATE_CENTS
      #     n in [4,8]        -> base + 3*TIER1_RATE_CENTS + (n-3) * TIER2_RATE_CENTS
      #     n >= 9            -> base + 3*TIER1_RATE_CENTS + 5*TIER2_RATE_CENTS
      #                                + (n-8) * TIER3_RATE_CENTS
      # MARGINAL tiering: each deviation is priced at the rate of the tier it falls in,
      # NOT the whole count at the top tier's rate.
      # review_cost_cents = base + marginal_sum  (integer cents)
    input_set: "current_version.deviation_count only; independent of risk_weight and of DeviationApproval status"
    constants:
      BASE_CENTS: 50000
      TIER1_RATE_CENTS: 10000
      TIER2_RATE_CENTS: 7500
      TIER3_RATE_CENTS: 5000
    precision: "integer cents; marginal tiering (price each unit at its own tier's rate); no rounding needed (all integer)"
    variants:
      - name: marginal
        when: "Always — this is the pinned interpretation."
        difference: "Marginal (per-tier) pricing, NOT average/flat — a contract with deviation_count=5 costs base + 3*TIER1 + 2*TIER2, not 5*TIER2."

  - name: expiry_projection
    trigger: "On Contract activation (OUT_FOR_SIGNATURE -> ACTIVE) and on each renewal (ACTIVE -> ACTIVE)"
    algorithm: forward_looking
    formula: |
      # At activation: expiry_date = effective_date + term_months calendar months.
      # On renewal:    new_effective = prior expiry_date
      #                new_expiry    = new_effective + term_months calendar months
      # Month addition is CALENDAR-MONTH addition: add term_months to the month field,
      # carrying years; if the resulting day-of-month does not exist in the target
      # month, CLAMP to the last day of that month (e.g. Jan 31 + 1 month -> Feb 28/29).
      # All times are UTC; the time-of-day component is preserved.
    input_set: "Contract.effective_date (or prior expiry_date on renewal) and Contract.term_months"
    constants: {}
    precision: "ISO 8601 UTC datetime, milliseconds preserved; calendar-month arithmetic with end-of-month clamping"
    variants:
      - name: initial
        when: "First activation."
        difference: "Anchor = effective_date (clock time at full signature)."
      - name: renewal
        when: "Each auto/manual renewal."
        difference: "Anchor = prior expiry_date (contiguous, no gap), NOT the renewal clock time — so renewed terms are gap-free and order-independent."

  - name: renewal_alert_window
    trigger: "On Contract activation and on each renewal — set the new RenewalAlert.trigger_date"
    algorithm: threshold
    formula: |
      # trigger_date = contract.expiry_date - organization.auto_renew_lead_days days
      # The alert becomes DUE when the clock sweep observes current_time >= trigger_date
      # (BOUNDARY: >=, so exactly at trigger_date the alert is DUE, not one tick later).
    input_set: "Contract.expiry_date and Organization.auto_renew_lead_days"
    constants: {}
    precision: "datetime subtraction in whole days; comparison is >= (inclusive at the boundary)"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "A {id} in a /contracts/{id}... path does not exist (validated left-to-right, contract id first)"
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all /contracts/{id} path-parameterised endpoints"

  - priority: 3
    category: existence
    check: "A {id} in a non-contract resource path (/clause-templates/{id}, /contract-templates/{id}, /organizations/{id}, /approval-workflows/{id}, /signature-requests/{id}, /obligations/{id}, /deviation-approvals/{id}, /contract-versions/{id}) does not exist"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all non-contract path-parameterised endpoints"

  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing resource of the right type and same organization_id"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "Required input fields present and well-typed; enum fields hold a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create / action endpoints"

  - priority: 5
    category: business_constraint
    check: "Numeric inputs within declared range: ClauseTemplate.risk_weight in [0,40]; term_months > 0; Organization.risk_appetite_threshold in [0,100]; auto_renew_lead_days > 0; ApprovalWorkflow.required_approver_count >= 1; pagination limit in [1,100]"
    error_id: ERR_VALIDATION_RANGE
    http_status: 422
    applies_to: "POST /clause-templates, POST /contracts, POST /organizations, POST /contract-templates, list endpoints"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action / transition endpoints"

  - priority: 7
    category: business_referential
    check: "On POST /contracts/{id}/versions, every clause's clause_template_id references a ClauseTemplate of the contract's organization whose status==ACTIVE"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /contracts/{id}/versions"

  - priority: 8
    category: business_safety
    check: "Segregation of duties — on an APPROVE/REJECT ApprovalStep, caller X-User-ID must differ from Contract.drafter_user_id and from current_version.authored_by_user_id; on a DeviationApproval decide, caller must differ from Contract.drafter_user_id"
    error_id: ERR_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /approval-workflows/{id}/steps, POST /deviation-approvals/{id}/decide"

  - priority: 9
    category: business_safety
    check: "A ContractVersion cannot be carried to APPROVED if it omits any mandatory ClauseTemplate required by the contract's template (mandatory clause missing)"
    error_id: ERR_MANDATORY_CLAUSE_MISSING
    http_status: 409
    applies_to: "POST /approval-workflows/{id}/steps (the APPROVE that would reach quorum)"

  - priority: 10
    category: business_referential
    check: "A DeviationApproval decide is rejected if its contract_version_id is no longer the contract's current_version_id (the version was superseded)"
    error_id: ERR_DEVIATION_STALE
    http_status: 409
    applies_to: "POST /deviation-approvals/{id}/decide"

  - priority: 11
    category: business_temporal
    check: "On POST /contracts/{id}/renew, a RenewalAlert with status==DUE must exist for the contract (renewal not yet in window)"
    error_id: ERR_RENEWAL_NOT_DUE
    http_status: 409
    applies_to: "POST /contracts/{id}/renew"

  - priority: 12
    category: business_safety
    check: "On send-for-signature, if Contract.risk_score >= organization.risk_appetite_threshold, every deviated clause in current_version must have a GRANTED DeviationApproval pinned to current_version_id"
    error_id: ERR_DEVIATION_REQUIRED
    http_status: 409
    applies_to: "POST /contracts/{id}/send-for-signature"

  - priority: 13
    category: business_constraint
    check: "On send-for-signature, the signer list must contain at least one INTERNAL and at least one COUNTERPARTY signer"
    error_id: ERR_SIGNERS_INCOMPLETE
    http_status: 409
    applies_to: "POST /contracts/{id}/send-for-signature"

  - priority: 14
    category: business_constraint
    check: "On POST /contracts/{id}/renew, no Obligation of the contract may have status==BREACHED"
    error_id: ERR_OPEN_BREACH
    http_status: 409
    applies_to: "POST /contracts/{id}/renew"

  - priority: 15
    category: business_constraint
    check: "clause_key uniqueness among ACTIVE ClauseTemplate rows of the same organization_id on clause-template create"
    error_id: ERR_DUPLICATE_CLAUSE_KEY
    http_status: 409
    applies_to: "POST /clause-templates"

  - priority: 16
    category: state
    check: "OCC: expected_contract_version (or expected_<parent>_version) must equal the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /contracts/{id}/submit, POST /contracts/{id}/versions, POST /contracts/{id}/send-for-signature, POST /contracts/{id}/terminate, POST /contracts/{id}/cancel"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Organization ---------------------------------------------------------
  - method: POST
    path: "/organizations"
    description: "Create an organization (tenant)."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "risk_appetite_threshold?", "auto_renew_lead_days?"]
    output: Organization
    side_effects: []

  - method: GET
    path: "/organizations/{id}"
    description: "Fetch an organization."
    roles: [PlatformAdmin, ClauseLibrarian, ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: []
    output: Organization
    side_effects: []

  # --- ClauseTemplate library ----------------------------------------------
  - method: POST
    path: "/clause-templates"
    description: "Add a clause to the library."
    roles: [ClauseLibrarian]
    code: 201
    input: ["organization_id", "clause_key", "category", "standard_text", "risk_weight", "is_mandatory?"]
    output: ClauseTemplate
    side_effects: ["Enforces clause_key uniqueness among ACTIVE clauses of organization_id (§1.4 priority 15)"]

  - method: GET
    path: "/clause-templates/{id}"
    description: "Fetch a clause template."
    roles: [ClauseLibrarian, ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: []
    output: ClauseTemplate
    side_effects: []

  - method: GET
    path: "/clause-templates"
    description: "List clause templates; filter by organization_id."
    roles: [ClauseLibrarian, ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["organization_id?", "status?", "limit?", "offset?"]
    output: ClauseTemplate[]
    side_effects: []

  - method: POST
    path: "/clause-templates/{id}/retire"
    description: "Retire a clause template (ACTIVE -> RETIRED)."
    roles: [ClauseLibrarian]
    code: 200
    input: []
    output: ClauseTemplate
    side_effects: ["status -> RETIRED", "increments ClauseTemplate.version by 1"]

  # --- ContractTemplate -----------------------------------------------------
  - method: POST
    path: "/contract-templates"
    description: "Create a contract template composing clause templates."
    roles: [ClauseLibrarian]
    code: 201
    input: ["organization_id", "name", "clause_template_ids", "default_term_months?", "auto_renew_default?"]
    output: ContractTemplate
    side_effects: []

  - method: GET
    path: "/contract-templates/{id}"
    description: "Fetch a contract template."
    roles: [ClauseLibrarian, ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: []
    output: ContractTemplate
    side_effects: []

  - method: GET
    path: "/contract-templates"
    description: "List contract templates; filter by organization_id."
    roles: [ClauseLibrarian, ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["organization_id?", "status?", "limit?", "offset?"]
    output: ContractTemplate[]
    side_effects: []

  - method: POST
    path: "/contract-templates/{id}/retire"
    description: "Retire a contract template."
    roles: [ClauseLibrarian]
    code: 200
    input: []
    output: ContractTemplate
    side_effects: ["status -> RETIRED", "increments ContractTemplate.version by 1"]

  # --- Contract -------------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Create a contract in DRAFT from a contract template."
    roles: [ContractManager]
    code: 201
    input: ["organization_id", "contract_template_id", "counterparty_name", "title", "term_months?", "auto_renew?"]
    output: Contract
    side_effects: ["drafter_user_id stamped from X-User-ID", "term_months/auto_renew defaulted from template if omitted", "appends AuditEvent { CONTRACT_CREATED }"]

  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract."
    roles: [ContractManager, ContractApprover, RiskOfficer, ClauseLibrarian]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts; filter by organization_id / contract_template_id / current_version_id / status (current_version_id is the reverse-reachability filter for Contract.current_version_id -> ContractVersion)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["organization_id?", "contract_template_id?", "current_version_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/versions"
    description: "Create a new ContractVersion (redline). While UNDER_REVIEW this bounces the contract to REDLINING."
    roles: [ContractManager]
    code: 201
    input: [contract_id, authored_by_party, clauses, expected_contract_version]
    output: ContractVersion
    side_effects: ["version_number assigned server-side", "deviation_count computed", "prior version SUPERSEDED & prior workflow VOIDED if UNDER_REVIEW", "PENDING DeviationApprovals on superseded version -> DENIED", "Contract.current_version_id updated; risk_score recomputed (provisional)", "appends AuditEvent { VERSION_CREATED } (+ REDLINE_OPENED if was UNDER_REVIEW)", "increments Contract.version by 1"]

  - method: GET
    path: "/contracts/{id}/versions"
    description: "List a contract's versions (reverse-reachability for ContractVersion.contract_id)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContractVersion[]
    side_effects: []

  - method: GET
    path: "/contract-versions/{id}"
    description: "Fetch a single ContractVersion by id (gives the ContractVersion collection a single-resource read)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: []
    output: ContractVersion
    side_effects: []

  - method: POST
    path: "/contracts/{id}/submit"
    description: "Submit current version for approval (DRAFT/REDLINING -> UNDER_REVIEW). Optional required_approver_count sets the new workflow's quorum (default 1)."
    roles: [ContractManager]
    code: 200
    input: ["expected_contract_version", "required_approver_count?"]
    output: Contract
    side_effects: ["creates ApprovalWorkflow PENDING pinned to current_version with required_approver_count = request value or default 1", "risk_score recomputed (provisional)", "appends AuditEvent { SUBMITTED }", "increments Contract.version by 1"]

  - method: POST
    path: "/contracts/{id}/send-for-signature"
    description: "Send an APPROVED contract for signature (APPROVED -> OUT_FOR_SIGNATURE)."
    roles: [ContractManager]
    code: 200
    input: [expected_contract_version, signers]
    output: Contract
    side_effects: ["creates one SignatureRequest per signer (status SENT)", "appends AuditEvent { SENT_FOR_SIGNATURE }", "increments Contract.version by 1"]

  - method: POST
    path: "/contracts/{id}/renew"
    description: "Manually renew an ACTIVE contract whose RenewalAlert is DUE (ACTIVE self-loop)."
    roles: [ContractManager]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects: ["renewal_cycle_index incremented", "effective_date/expiry_date recomputed via expiry_projection(renewal)", "DUE RenewalAlert RESOLVED(RENEWED); new SCHEDULED RenewalAlert", "appends AuditEvent { RENEWED }", "increments Contract.version by 1"]

  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract (ACTIVE -> TERMINATED)."
    roles: [ContractManager]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects: ["OPEN Obligations -> WAIVED", "SCHEDULED/DUE RenewalAlerts -> CANCELLED", "appends AuditEvent { TERMINATED }", "increments Contract.version by 1"]

  - method: POST
    path: "/contracts/{id}/cancel"
    description: "Cancel a DRAFT or REDLINING contract (-> CANCELLED)."
    roles: [ContractManager]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects: ["open PENDING ApprovalWorkflow -> VOIDED", "increments Contract.version by 1"]

  - method: GET
    path: "/contracts/{id}/cost-estimate"
    description: "Computed read — marginal legal-review cost estimate for the current version (§1.3 clause_deviation_cost)."
    roles: [ContractManager, RiskOfficer]
    code: 200
    input: []
    output: "{ contract_id: string, deviation_count: integer, review_cost_cents: integer }"
    side_effects: []

  # --- ApprovalWorkflow / ApprovalStep --------------------------------------
  - method: GET
    path: "/contracts/{id}/approval-workflows"
    description: "List approval workflows of a contract (reverse-reachability for ApprovalWorkflow.contract_id)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ApprovalWorkflow[]
    side_effects: []

  - method: GET
    path: "/approval-workflows/{id}"
    description: "Fetch an approval workflow."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: []
    output: ApprovalWorkflow
    side_effects: []

  - method: GET
    path: "/approval-workflows"
    description: "List approval workflows; filter by contract_id / pinned_version_id / status (pinned_version_id is the reverse-reachability filter for ApprovalWorkflow.pinned_version_id -> ContractVersion)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["contract_id?", "pinned_version_id?", "status?", "limit?", "offset?"]
    output: ApprovalWorkflow[]
    side_effects: []

  - method: POST
    path: "/approval-workflows/{id}/steps"
    description: "Record an approval decision (APPROVE/REJECT). Reaching quorum bubbles the contract to APPROVED; a REJECT bubbles to REDLINING."
    roles: [ContractApprover]
    code: 201
    input: ["approval_workflow_id", "decision", "comment?"]
    output: ApprovalStep
    side_effects: ["increments approvals_received on APPROVE", "segregation-of-duties enforced (§1.4 priority 8)", "mandatory-clause check on quorum-reaching APPROVE (§1.4 priority 9)", "workflow -> APPROVED/REJECTED; contract bubbles up; on APPROVED current_version -> ACCEPTED and risk_score recomputed (final)", "appends AuditEvent { APPROVED | REJECTED }", "increments ApprovalWorkflow.version by 1"]

  - method: GET
    path: "/approval-workflows/{id}/steps"
    description: "List the decision steps of a workflow (reverse-reachability for ApprovalStep.approval_workflow_id)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ApprovalStep[]
    side_effects: []

  # --- SignatureRequest -----------------------------------------------------
  - method: GET
    path: "/contracts/{id}/signature-requests"
    description: "List signature requests of a contract (reverse-reachability for SignatureRequest.contract_id)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SignatureRequest[]
    side_effects: []

  - method: POST
    path: "/signature-requests/{id}/sign"
    description: "Record a signature (SENT -> SIGNED). Last signature activates the contract."
    roles: [Signer]
    code: 200
    input: []
    output: SignatureRequest
    side_effects: ["signed_at set", "JOIN: if all siblings SIGNED, contract -> ACTIVE (sets effective_date/expiry_date, creates RenewalAlert)", "increments SignatureRequest.version by 1"]

  - method: POST
    path: "/signature-requests/{id}/decline"
    description: "Decline a signature (SENT -> DECLINED). Bounces the contract to REDLINING and voids siblings."
    roles: [Signer]
    code: 200
    input: []
    output: SignatureRequest
    side_effects: ["sibling SENT requests -> VOIDED", "contract OUT_FOR_SIGNATURE -> REDLINING", "increments SignatureRequest.version by 1"]

  # --- Obligation -----------------------------------------------------------
  - method: POST
    path: "/contracts/{id}/obligations"
    description: "Create an obligation on a contract."
    roles: [ContractManager]
    code: 201
    input: [contract_id, description, owner_party, due_date]
    output: Obligation
    side_effects: []

  - method: GET
    path: "/contracts/{id}/obligations"
    description: "List obligations of a contract (reverse-reachability for Obligation.contract_id)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["status?", "owner_party?", "limit?", "offset?"]
    output: Obligation[]
    side_effects: []

  - method: POST
    path: "/obligations/{id}/fulfill"
    description: "Mark an obligation FULFILLED (OPEN -> FULFILLED)."
    roles: [ContractManager]
    code: 200
    input: []
    output: Obligation
    side_effects: ["completed_at set", "increments Obligation.version by 1"]

  - method: POST
    path: "/obligations/{id}/waive"
    description: "Waive an obligation (OPEN -> WAIVED)."
    roles: [ContractManager]
    code: 200
    input: []
    output: Obligation
    side_effects: ["increments Obligation.version by 1"]

  # --- DeviationApproval ----------------------------------------------------
  - method: POST
    path: "/contracts/{id}/deviation-approvals"
    description: "Request a deviation approval for a deviated clause on the current version."
    roles: [ContractManager]
    code: 201
    input: [contract_id, contract_version_id, clause_template_id, justification]
    output: DeviationApproval
    side_effects: []

  - method: GET
    path: "/contracts/{id}/deviation-approvals"
    description: "List deviation approvals of a contract (reverse-reachability for DeviationApproval.contract_id)."
    roles: [ContractManager, RiskOfficer]
    code: 200
    input: ["status?", "contract_version_id?", "limit?", "offset?"]
    output: DeviationApproval[]
    side_effects: []

  - method: POST
    path: "/deviation-approvals/{id}/decide"
    description: "RiskOfficer grants or denies a deviation (PENDING -> GRANTED/DENIED)."
    roles: [RiskOfficer]
    code: 200
    input: [decision]
    output: DeviationApproval
    side_effects: ["decided_by_user_id stamped", "segregation-of-duties enforced (§1.4 priority 8)", "ERR_DEVIATION_STALE if version superseded (§1.4 priority 10)", "appends AuditEvent { DEVIATION_GRANTED | DEVIATION_DENIED }", "increments DeviationApproval.version by 1"]

  - method: GET
    path: "/deviation-approvals/{id}"
    description: "Fetch a single DeviationApproval by id (gives the DeviationApproval collection a single-resource read)."
    roles: [ContractManager, RiskOfficer]
    code: 200
    input: []
    output: DeviationApproval
    side_effects: []

  - method: GET
    path: "/deviation-approvals"
    description: "List deviation approvals; filter by contract_id / contract_version_id / clause_template_id / status. These are the reverse-reachability filters for DeviationApproval.contract_version_id -> ContractVersion and DeviationApproval.clause_template_id -> ClauseTemplate (and contract_id -> Contract)."
    roles: [ContractManager, RiskOfficer]
    code: 200
    input: ["contract_id?", "contract_version_id?", "clause_template_id?", "status?", "limit?", "offset?"]
    output: DeviationApproval[]
    side_effects: []

  # --- RenewalAlert ---------------------------------------------------------
  - method: GET
    path: "/contracts/{id}/renewal-alerts"
    description: "List renewal alerts of a contract (reverse-reachability for RenewalAlert.contract_id)."
    roles: [ContractManager, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RenewalAlert[]
    side_effects: []

  # --- AuditEvent -----------------------------------------------------------
  - method: GET
    path: "/contracts/{id}/audit-events"
    description: "List the audit trail of a contract (reverse-reachability for AuditEvent.contract_id)."
    roles: [ContractManager, ContractApprover, RiskOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # --- Clock (test-driving) -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server clock and run the sweep (RenewalAlert SCHEDULED->DUE; ACTIVE contract auto-renew or EXPIRE; Obligation OPEN->BREACHED)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: string, swept_contract_ids: string[] }"
    side_effects: ["advances clock", "RenewalAlert SCHEDULED->DUE where now>=trigger_date", "ACTIVE+auto_renew & DUE -> renew (self-loop); ACTIVE & now>=expiry & !auto_renew -> EXPIRED (Obligations WAIVED, alerts RESOLVED/LET_LAPSE)", "Obligation OPEN & now>due_date & contract ACTIVE -> BREACHED (+ AuditEvent)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint per §1.7" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "Contract id in path does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Non-contract path resource (clause-template, workflow, signature-request, obligation, deviation-approval, contract-template, organization) does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "A FK in the request body references a missing resource, a resource of the wrong organization, or a non-ACTIVE clause where ACTIVE is required" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or enum value not a declared member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_NO_VERSION, http: 409, condition: "submit called on a contract that has no ContractVersion yet" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "Segregation of duties: caller is the drafter or the version author and is approving, or the drafter is deciding their own deviation" }
  - { id: ERR_MANDATORY_CLAUSE_MISSING, http: 409, condition: "Quorum-reaching APPROVE on a version that omits a mandatory clause required by the contract template" }
  - { id: ERR_DEVIATION_REQUIRED, http: 409, condition: "send-for-signature blocked: risk_score >= org threshold and a deviated clause lacks a GRANTED DeviationApproval for the current version" }
  - { id: ERR_DEVIATION_STALE, http: 409, condition: "DeviationApproval decide whose contract_version_id is no longer the contract's current version" }
  - { id: ERR_SIGNERS_INCOMPLETE, http: 409, condition: "send-for-signature without at least one INTERNAL and one COUNTERPARTY signer" }
  - { id: ERR_RENEWAL_NOT_DUE, http: 409, condition: "renew called when no RenewalAlert with status DUE exists for the contract" }
  - { id: ERR_OPEN_BREACH, http: 409, condition: "renew blocked because an Obligation is BREACHED" }
  - { id: ERR_DUPLICATE_CLAUSE_KEY, http: 409, condition: "clause-template create with a clause_key already used by an ACTIVE clause of the same organization" }
  - { id: ERR_CLAUSE_IN_USE, http: 409, condition: "retire a clause template still referenced by a non-terminal contract's current version" }
  - { id: ERR_TEMPLATE_IN_USE, http: 409, condition: "retire a contract template still referenced by a non-terminal contract" }
  - { id: ERR_VALIDATION_RANGE, http: 422, condition: "Numeric input out of declared range (e.g. risk_weight outside 0-40, term_months <= 0, pagination limit outside 1-100)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Tenant/clock operator; creates organizations and drives the test clock."
    identity: opaque
    exclusive_operations:
      - "POST /organizations"
      - "POST /_clock/set_current_utc"
    shared_operations: []

  - name: ClauseLibrarian
    description: "Owns the clause/template library: clause templates and contract templates."
    identity: opaque
    exclusive_operations:
      - "POST /clause-templates"
      - "POST /clause-templates/{id}/retire"
      - "POST /contract-templates"
      - "POST /contract-templates/{id}/retire"
    shared_operations:
      - "GET reads on clause-templates, contract-templates, organizations, contracts"

  - name: ContractManager
    description: "Drafts and drives contracts: creates contracts/versions, submits, sends for signature, renews, terminates, cancels, manages obligations and requests deviations. Acts as drafter; segregation of duties forbids approving own contract."
    identity: opaque
    exclusive_operations:
      - "POST /contracts"
      - "POST /contracts/{id}/versions"
      - "POST /contracts/{id}/submit"
      - "POST /contracts/{id}/send-for-signature"
      - "POST /contracts/{id}/renew"
      - "POST /contracts/{id}/terminate"
      - "POST /contracts/{id}/cancel"
      - "POST /contracts/{id}/obligations"
      - "POST /obligations/{id}/fulfill"
      - "POST /obligations/{id}/waive"
      - "POST /contracts/{id}/deviation-approvals"
    shared_operations:
      - "GET reads on contracts and all contract sub-resources, cost-estimate"

  - name: ContractApprover
    description: "Records APPROVE/REJECT decisions on approval workflows. Cannot be the drafter or version author of the contract under review (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /approval-workflows/{id}/steps"
    shared_operations:
      - "GET reads on contracts, approval-workflows, versions, audit-events"

  - name: RiskOfficer
    description: "Grants/denies deviation approvals for above-threshold-risk contracts. Distinct decision seat from approver and drafter."
    identity: opaque
    exclusive_operations:
      - "POST /deviation-approvals/{id}/decide"
    shared_operations:
      - "GET reads on contracts, deviation-approvals, renewal-alerts, cost-estimate, versions"

  - name: Signer
    description: "Signs or declines signature requests. Represents an INTERNAL or COUNTERPARTY signatory."
    identity: opaque
    exclusive_operations:
      - "POST /signature-requests/{id}/sign"
      - "POST /signature-requests/{id}/decline"
    shared_operations: []
