  - section: cross_cutting_layers
    instances:
      - name: equipment_posture_derived_reconciliation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Site.fields.equipment_posture
          - complexity_profile.complexity_layers
        distinguishing_aspect: "equipment_posture recomputes on every asset transition: 0 CRITICAL down -> OPERATIONAL; exactly 1 -> RESTRICTED; >= 2 -> HALTED; decommission excludes the asset from the posture set."
        test_recipe:
          setup: ["Site S with three CRITICAL assets A1 A2 A3."]
          setup_api_calls:
            - call: "POST /kitchen/sites"
              payload: { name: "Posture Site", dine_in_capacity: 30, togo_capacity_per_window: 15, delivery_radius_km: 5 }
