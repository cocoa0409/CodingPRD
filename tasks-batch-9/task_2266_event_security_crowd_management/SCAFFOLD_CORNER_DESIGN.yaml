          base_hourly_rate_cents: 2200
        as: StaffingCoordinator
        captures:
          g1_id: $.data.id
      trigger:
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: VERIFY
        as: StaffingCoordinator
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: REJECT
        as: StaffingCoordinator
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: DISQUALIFY
        as: StaffingCoordinator
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: SUBMIT_FOR_REVIEW
        as: StaffingCoordinator
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: VERIFY
        as: CredentialAuditor
      - call: GET /event-security/guards/${g1_id}
        payload: {}
        as: CredentialAuditor
      assert:
      - VERIFY as StaffingCoordinator returns 403 with data.error_id == "ERR_ACTION_NOT_PERMITTED_FOR_ROLE", not ERR_ROLE_NOT_PERMITTED — the coordinator is declared on this endpoint for SUBMIT_FOR_REVIEW
      - REJECT as StaffingCoordinator returns 403 with data.error_id == "ERR_ACTION_NOT_PERMITTED_FOR_ROLE"
      - DISQUALIFY as StaffingCoordinator returns 403 with data.error_id == "ERR_ACTION_NOT_PERMITTED_FOR_ROLE"
      - SUBMIT_FOR_REVIEW as StaffingCoordinator returns 200 with Guard.${g1_id}.verification_status == PENDING_REVIEW — the shared verb on the same endpoint is accepted for the same caller
      - VERIFY as CredentialAuditor returns 200 with Guard.${g1_id}.verification_status == VERIFIED, verified_at set to the logical clock 2026-09-01T00:00:00Z and is_supervisor_qualified == false (credential_level
