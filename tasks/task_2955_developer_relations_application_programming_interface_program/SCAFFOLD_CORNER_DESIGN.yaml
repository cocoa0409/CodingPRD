          - complexity_profile.entity_topology
          - errors.ERR_API_PRODUCT_NOT_FOUND
        distinguishing_aspect: >-
          In a flat topology the association travels in the body rather than the path, and the
          declared field order (developer_id, then api_product_id) fixes which 404 surfaces
          when both are wrong: developer_id is validated first, so an unknown developer with an
          unknown product yields ERR_DEVELOPER_NOT_FOUND, while a valid developer with an
          unknown product yields ERR_API_PRODUCT_NOT_FOUND.
        test_recipe:
          setup:
            - "Developer D1 exists and has acknowledged docs 2 / terms 1; ApiProduct P1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
