  # ---------------------------------------------------------------
  # Rule 4 — transitive_cascade (two instances, different triggers)
  # ---------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: finalize_exception_expiry_cascades_distribution_revert_and_posture_depth3
        grounds:
          - state_machines.UnitValuation.PRELIMINARY_to_FINAL
          - state_machines.PolicyException.APPROVED_to_EXPIRED
          - state_machines.SpendingDistribution.APPROVED_to_PROPOSED
          - state_machines.Fund.EXCEPTION_ACTIVE_to_SPENDING_SUSPENDED
          - calculations.quarter_close_pipeline
        distinguishing_aspect: |
          Depth-3 chain fired by the finalize trigger: the Q4 finalize (link 0) expires the
          unused APPROVED exception because its fiscal year's last quarter closed (link 1:
          PolicyException APPROVED -> EXPIRED); the expiry itself reverts the distribution
          that cited it (link 2: SpendingDistribution APPROVED -> PROPOSED, final_amount 0);
          the exception leaving APPROVED flips the fund's posture (link 3: EXCEPTION_ACTIVE
          -> SPENDING_SUSPENDED). Each link is caused by the previous one, not by the
          finalize directly. Different trigger from the sibling rescind cascade.
        test_recipe:
          setup:
            - "Pool EC3 (FY2026) with allocation, policy (500/4/0/10000/2026) ADOPTED, engaged manager, ACTIVE fund FEC3 with 100000000000 micro-units, HGV 10000000"
            - "Q2 crash to MV 4000000 (price 40000) made the fund underwater and SPENDING_SUSPENDED"
            - "Exception (fund, FY2026, 300000) REQUESTED -> ENDORSED -> APPROVED (posture EXCEPTION_ACTIVE); FY2026 distribution proposed and APPROVED with final_amount 300000 citing the exception"
            - "Q3 finalized flat at MV 4000000; the Q4 report is filed and the Q4 valuation is PRELIMINARY"
