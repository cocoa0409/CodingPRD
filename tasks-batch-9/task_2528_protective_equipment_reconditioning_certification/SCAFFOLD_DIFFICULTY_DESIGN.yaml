            - "CustomerAccount.${acct_id}.billing_hold_reason == season invoice past due"
            - "GET /equipment-units/${u1_id}/certification-labels returns 0 records"
            - "EquipmentUnit.${u1_id}.recon_status == TEST_PASSED"
            - "EquipmentUnit.${u1_id}.certified_at == null"
            - "IntakeShipment.${ship_id}.units_certified == 0"
            - "IntakeShipment.${ship_id}.status == IN_PROCESS"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bench_sessions_collide_across_closed_cooldown_padded_windows
        grounds:
          - validations.v-bench-window-conflict
          - entities.TestBench.fields.cooldown_minutes
          - entities.ShellTest.fields.window_start
          - entities.ShellTest.fields.window_end
          - errors.ERR_BENCH_WINDOW_CONFLICT
        distinguishing_aspect: |
          The shared resource is a TestBench and the intervals are CLOSED and
          padded by cooldown_minutes 45 on both sides. Against an existing
          09:00-10:00 session: 10:30-11:30 collides (padded to 09:45-12:15),
          10:45-11:45 also collides because the padded start 10:00 touches the
          existing end 10:00 and closed intervals include their endpoints, and
          only 11:00-12:00 (padded start 10:15, a clear 60-minute gap) is
          accepted. Half-open comparison logic wrongly accepts the 10:45 case.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z"
            - "one TestBench RIG-1 with cooldown_minutes 45 and daily_session_quota 6, calibrated through 2026-12-31"
            - "two units of ModelSpec SF-2026 in recon_status INSPECTED under the same shipment"
            - "one existing ShellTest on RIG-1 for unit 1 over 2026-08-01T09:00:00Z..10:00:00Z"
          setup_api_calls:
            - *c_clock
            - *c_model
            - *c_acct
