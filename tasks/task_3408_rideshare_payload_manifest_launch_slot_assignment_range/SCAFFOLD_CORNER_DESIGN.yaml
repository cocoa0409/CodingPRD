            - "the ANOMALOUS outcome created AnomalyReport.${an1} with status OPEN, category SEPARATION, severity HIGH, mission_id == ${m_id}"
            - "after resolution AnomalyReport.${an1}.status == RESOLVED and disposition == NOMINAL"
            - "the retry returns 200, SeparationEvent.${ev1}.status == EXECUTED, and Mission.${m_id}.status == COMPLETED"

      - name: deployment_success_bubbles_contract_fulfilled_and_mission_completed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SeparationEvent.PLANNED_to_EXECUTED
          - state_machines.ManifestAssignment.INTEGRATED_to_DEPLOYED
          - state_machines.Payload.MANIFESTED_to_DEPLOYED
          - state_machines.LaunchContract.MANIFESTED_to_FULFILLED
          - state_machines.Mission.LAUNCHED_to_COMPLETED
        distinguishing_aspect: "One report-outcome EXECUTED bubbles four levels: event EXECUTED -> assignment DEPLOYED -> payload DEPLOYED -> contract FULFILLED (all payloads deployed) -> mission COMPLETED (all events executed); and the EXECUTED event is then terminally locked against re-reporting."
