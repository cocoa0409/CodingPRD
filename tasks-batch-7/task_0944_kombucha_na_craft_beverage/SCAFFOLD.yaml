    roles: [SalesRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts/{id}/recall-notices"
    description: "Recall notices addressed to this account"
    roles: [SalesRep, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RecallNotice[]"
    side_effects: []

  # ------------------------------------------------------------ Shipment
