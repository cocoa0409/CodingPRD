  # ===========================================================================
  - section: validations
    instances:
      - name: clock_set_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or payload logic runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              captures: { err: $.data.error_id }
          assert:
            - "the response is 401 with data.error_id == ERR_UNAUTHENTICATED"

      - name: state_dot_engineer_cannot_create_stip_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
          - roles.StateDOTPlanner
        distinguishing_aspect: "STIP creation is exclusive to StateDOTPlanner; a StateDOTEngineer caller gets 403 ERR_FORBIDDEN and nothing is persisted."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /federal-aid/stips"
              payload: { state_code: "AZ", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "Forbidden STIP" }
              as: StateDOTEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with data.error_id == ERR_FORBIDDEN"

      - name: fhwa_reviewer_cannot_record_apportionment_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - roles.FHWADivisionAdmin
        distinguishing_aspect: "Apportionment recording is exclusive to FHWADivisionAdmin; FHWAReviewer is denied with 403 even though both are federal roles."
        test_recipe:
          setup: ["NHPP program exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "NHPP", name: "NHPP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /federal-aid/apportionments"
              payload: { funding_program_id: "${prog_id}", state_code: "AZ", federal_fiscal_year: 2027, apportioned_cents: 100 }
              as: FHWAReviewer
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with data.error_id == ERR_FORBIDDEN"

      - name: project_patch_with_stale_version_returns_stale_version
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[project-patch-stale-version]
          - validations[priority=5]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After determine-eligibility bumps the project from version 1 to 2, a PATCH carrying the previously observed expected_project_version (1) is rejected 412 ERR_STALE_VERSION and no fields change."
        test_recipe:
          setup: ["STIP approved; project created (version 1) and determined ELIGIBLE (version 2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
