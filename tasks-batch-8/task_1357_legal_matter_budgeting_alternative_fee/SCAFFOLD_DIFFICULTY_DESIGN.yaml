  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_arrangement_single_active_per_matter_per_fiscal_year
        grounds:
          - state_machines.FeeArrangement
          - validations[priority=10]
        distinguishing_aspect: |
          Interval semantic A: a Matter may have at most one ACTIVE or
          PENDING_APPROVAL FeeArrangement at any point in time (point-in-time
          exclusion on the (matter_id, status) resource axis). Adjacent
          non-overlapping arrangements ARE allowed via supersedes chain.
          Endpoint: POST .../fee_arrangements/{id}/submit.
        test_recipe:
          setup:
            - "Matter M1 with arrangement A1 already in PENDING_APPROVAL"
            - "Second arrangement A2 created (DRAFT) for the same matter"
