              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_pr_id: $.data.id }
          assert:
            - "ProductFamily.${fam_pr_id}.history_maturity_status == MATURE (12 months, 5500 units)"
            - "The trigger call returns 201"
            - "WarrantyAccrual.${acc_pr_id}.expected_claim_rate_ppm == 3666 — the sum of the per-mode 2333 and 1333, NOT 3667"
            - "WarrantyAccrual.${acc_pr_id}.paid_to_date_cents == 180000"
            - "WarrantyAccrual.${acc_pr_id}.cost_per_claim_basis_cents == 25556 (690000 / 27 ult claims, round_half_up)"
            - "WarrantyAccrual.${acc_pr_id}.accrued_amount_cents == 510000 (gross 690000 == 17*20000 + 10*35000, less 180000 paid)"

      - name: corner_historical_rate_ignores_other_vintages_of_the_same_family
        claim_type: Input Set Filtering
