              as: StaffingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id \"ERR_NO_ELIGIBLE_REVIEWER\""
            - "Reviewer.${ra_id}.active_assignment_count == 2 and max_concurrent_batches == 2"
            - "Batch.${b3_id}.status == \"CREATED\" and version == 1 — the failed selection wrote nothing"
            - "Matter.${m_id}.committed_spend_cents == 117150 (85200 + 31950), unchanged by the refusal"
            - "GET /assignments?batch_id=${b3_id} returns an empty list"

      - name: contract_rate_rounds_half_up_at_the_half_cent
        claim_type: precision
        grounds:
          - calculations.matter_spend_projection
          - endpoints[GET /matters/{id}/spend-projection]
        distinguishing_aspect: "The STANDARD tier lands exactly on a half cent: 150 * 1.15 == 172.5, which round_half_up turns into 173, so a 100-document projection is 17300 and not the 17200 that truncation or round-half-even would produce."
        test_recipe:
          setup:
            - "a STANDARD-tier matter of 100 documents at 150 c/doc with a 400000 budget cap, English only"
            - "its protocol is APPROVED and all 100 documents sit in one CREATED batch"
          setup_api_calls:
            - *c_clock
            - *c_client
            - call: "POST /matters"
              payload:
                client_id: "${cl_id}"
                name: "Northwind — Standard Tier Rounding"
                document_count: 100
                deadline_utc: "2026-09-30T00:00:00Z"
                complexity_tier: "STANDARD"
                required_languages: ["EN"]
                required_bar_states: ["NY"]
                subject_matter_tags: ["ANTITRUST"]
                pricing_model: "PER_DOCUMENT"
                per_document_rate_cents: 150
                budget_cap_cents: 400000
                min_staffed_reviewers: 1
                onsite_seat_count: 1
                remote_work_permitted: false
              as: EngagementManager
              captures: { mstd_id: $.data.id, mstd_v1: $.data.version }
            - call: "POST /matters/${mstd_id}/protocols"
              payload:
                expected_matter_version: "${mstd_v1}"
                issue_codes: ["RESPONSIVE", "NOT_RESPONSIVE", "PRIVILEGED"]
                privilege_criteria: ["ATTORNEY_CLIENT"]
                qc_sample_pct: 0.10
                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: false
              as: EngagementManager
              captures: { pstd_id: $.data.id }
            - call: "POST /protocols/${pstd_id}/submit"
              payload: {}
              as: EngagementManager
            - call: "POST /protocols/${pstd_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientCounsel
              as_user_id: "${cl_id}"
            - call: "POST /matters/${mstd_id}/batches"
              payload: { document_count: 100, priority_rank: 5 }
              as: EngagementManager
              captures: { bstd_id: $.data.id }
          trigger:
            - call: "GET /matters/${mstd_id}/spend-projection"
              payload: {}
              as: EngagementManager
              captures: { basis: $.data.basis_applied }
          assert:
            - "HTTP 200 with response.data.basis_applied == \"REMAINING_WORK_BASIS\" (matter status STAFFING)"
            - "response.data.remaining_work_basis_cents == 17300 — contract_rate 173 * 100 documents, NOT 17200"
            - "response.data.ledger_replay_basis_cents == 0 and variance_cents == 17300"
            - "response.data.budget_headroom_cents == 382700 (400000 - 17300)"
            - "Batch.${bstd_id}.qc_sample_target_size == 10 — max(10, ceil(100 * 0.10)) is a tie at 10"

      - name: strike_running_total_floors_at_zero_at_every_step
        claim_type: aggregation
        grounds:
          - calculations.reviewer_scorecard_strikes
          - endpoints[GET /reviewers/{id}/scorecard-events]
          - entities.ScorecardEvent.fields.strike_delta
        distinguishing_aspect: "The event stream (+1, -1, -1, +1) settles at 1 because the floor is applied AFTER EVERY event: the second credit cannot bank negative headroom. A naive end-of-stream sum would report 0 and would also mis-report the reviewer as strike-free."
        test_recipe:
          setup:
            - "the core matter with an APPROVED protocol and Reviewer A onboarded with an ACTIVE onsite session"
            - "three batches are carved: 400, 150 and 50 documents"
            - "Reviewer A submits batch 1 slowly (48.00 dph), batch 2 quickly (60.00 dph), then batch 3 slowly (50.00 dph)"
            - "both submitted batches are sampled clean by Reviewer C, who holds no assignment"
          setup_api_calls:
            - *c_clock
            - *c_client
            - *c_matter
            - *c_proto
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - *c_batch1
            - *c_assign_a1
            - *c_batch2
            - *c_assign_a2
            - *c_batch3
            - *c_start_a1
            - call: "POST /assignments/${a1_id}/progress"
              payload: { documents_coded: 400, minutes_logged: 500, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - *c_submit_a1
            - call: "POST /assignments/${a2_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a2_id}/progress"
              payload: { documents_coded: 150, minutes_logged: 150, privilege_hits_logged: 0 }
              as: Reviewer
              as_user_id: "${ra_id}"
            - call: "POST /assignments/${a2_id}/submit"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
            - *c_rev_c
            - call: "POST /batches/${b1_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { sc1_id: $.data.id }
            - call: "POST /qc-samples/${sc1_id}/validate"
              payload: { coding_error_count: 0, privilege_error_count: 0 }
              as: QCLead
            - call: "POST /batches/${b2_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { sc2_id: $.data.id }
            - call: "POST /qc-samples/${sc2_id}/validate"
              payload: { coding_error_count: 0, privilege_error_count: 0 }
              as: QCLead
            - call: "POST /batches/${b3_id}/assignments"
              payload: { expected_batch_version: "${b3_v}", reviewer_id: "${ra_id}", pass_type: "FIRST_PASS" }
              as: StaffingCoordinator
              captures: { a3_id: $.data.id }
            - call: "POST /assignments/${a3_id}/start"
