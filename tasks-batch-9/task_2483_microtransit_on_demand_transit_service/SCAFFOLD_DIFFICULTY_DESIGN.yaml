  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: block_cancel_cascade_four_hops_to_no_service
        grounds:
          - state_machines.VehicleBlock.state.OPEN_to_CANCELLED
          - state_machines.PoolAssignment.state.OFFERED_to_RELEASED
          - state_machines.TripRequest.status.OFFERED_to_NO_SERVICE
          - state_machines.TripRequest.fare_status.QUOTED_to_UNPRICED
          - entities.ServiceZone.fields.unserved_trip_count
        distinguishing_aspect: |
          Four causally chained hops from one call: HOP 1 zeroes the block's committed capacity,
          HOP 2 releases the OFFERED assignment, HOP 3 detaches the trip and voids its fare axis,
          and HOP 4 — reached only because match_attempt_count already equals MAX_MATCH_ATTEMPTS (2)
          — pushes the trip to NO_SERVICE with reason MAX_ATTEMPTS_EXHAUSTED and recomputes the
          zone's unserved_trip_count. A three-hop implementation leaves the trip in MATCHING.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0 and S4 approved; block B1 (V1/D1) OPEN 06:00-10:00Z."
            - "Trip T1 (R1 FULL, S0->S4, requested 07:00Z, party_size 1) was auto-matched onto B1 (match_attempt_count 1) and the driver declined, returning it to MATCHING."
            - "T1 was then manually dispatched back onto B1, so match_attempt_count is 2, status OFFERED, fare_status QUOTED with quoted_fare_cents 325."
            - "ServiceZone.unserved_trip_count is 0 before the trigger."
