  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: artist_cannot_certify_project_unauthorized
        claim_type: role_denied
        grounds:
          - roles.Artist
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "An Artist calling POST /projects/{id}/certify (a ProgramAdmin exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "A DRAFT project and a registered artist acting as the caller."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Rbacpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Qi Vale", email: "qi@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 190000000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_UNAUTHORIZED"

      - name: panelist_scoring_with_wrong_user_id_not_owner
        claim_type: ownership_denied
        grounds:
          - validations[priority=25]
          - roles.Panelist
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "A Panelist scoring with X-User-ID that is not their own panelist_id returns ERR_NOT_OWNER (403)."
        test_recipe:
          setup:
            - "A certified project, commission, OPEN call, artist with a SUBMITTED submission, and two panelists P1 and P2."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Ownpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Rob Ash", email: "rob@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P2" }
              as: ProgramAdmin
              captures: { pan2: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 800000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan2}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_NOT_OWNER"

      - name: missing_auth_headers_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A create call with no X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "Empty DB; the request omits authentication headers (role Anonymous is not a declared role)."
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "NoAuth", address: "1 Void" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_UNAUTHENTICATED when the X-User-Role header is absent"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_project_version_on_commission_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[commission-create-stale-project]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one commission create advances the project version, a second create still carrying the previously observed version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "A certified project (art_budget 2000000); the client observed version ${pv1} at certify, then created one commission which advanced the version."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Occpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "First", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm1_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Stale", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_STALE_VERSION"
            - "trigger[0] response http_status == 412"

      - name: occ_stale_contract_version_on_milestone_schedule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[milestone-schedule-stale-contract]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one milestone-schedule advances the contract version, a second schedule carrying the previously observed version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "A DRAFT contract whose version ${ctv0} was observed at creation, then one milestone-schedule advanced the version."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Occcon", construction_budget_cents: 400000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 400000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 1000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Sol Bay", email: "sol@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 1000000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/award"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/contracts"
              payload: { submission_id: "${sub_id}", contract_amount_cents: 1000000 }
              as: ProgramAdmin
              captures: { contract_id: $.data.id, ctv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestone-schedule"
              payload: { milestones: [{ sequence: 1, title: "Full", pct: 1.0 }], expected_contract_version: "${ctv0}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/milestone-schedule"
              payload: { milestones: [{ sequence: 1, title: "Redo", pct: 1.0 }], expected_contract_version: "${ctv0}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_STALE_VERSION"

      - name: committed_cents_reconciled_after_commission_create
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.budget_ledger
          - entities.CapitalProject.fields.committed_cents
        distinguishing_aspect: "After creating a commission with allocation 500000, project.committed_cents==500000 and uncommitted_cents==1500000 (art_budget 2000000)."
        test_recipe:
          setup:
            - "A certified project (art_budget 2000000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Reconpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Recon", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          assert:
            - "CapitalProject.${proj_id}.committed_cents == 500000"
            - "CapitalProject.${proj_id}.uncommitted_cents == 1500000"

      - name: fabrication_cascade_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Milestone.SUBMITTED_to_PAID
        excluded_because:
          difficulty_instance: transitive_cascade / milestone_pay_fabrication_fulfillment_cascade
          rationale: "The end-to-end milestone->contract->artwork->commission cascade is asserted in the named §1.8 instance."

