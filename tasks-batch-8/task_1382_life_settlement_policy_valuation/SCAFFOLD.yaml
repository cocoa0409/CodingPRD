scenario: |
  Life Settlement & Policy Valuation (life settlement provider): policy eligibility screening & life expectancy underwriting, provider bidding & offer negotiation, closing package & change of ownership/beneficiary, escrow & funding disbursement, ongoing premium optimization on acquired policies, insured tracking & death verification, portfolio valuation & investor reporting, state licensing & disclosure requirements

domain_name: life-settlement-policy-valuation
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Broker display name" }
      - { name: license_number, type: string, source: input, description: "Broker license number" }
      - { name: state_code, type: string, source: input, description: "Broker resident state (2-letter)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (single-state registry record)", constraints: "ACTIVE" }

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Investor display name" }
      - { name: investor_type, type: enum, source: input, description: "INDIVIDUAL | FUND", constraints: "INDIVIDUAL | FUND" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (single-state registry record)", constraints: "ACTIVE" }

  - name: Insured
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Insured legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: state_code, type: string, source: input, description: "Insured residence state (2-letter)" }
      - { name: gender, type: enum, source: input, description: "M | F", constraints: "M | F" }
      - { name: smoker_status, type: enum, source: input, description: "TOBACCO | NON_TOBACCO | UNKNOWN", constraints: "TOBACCO | NON_TOBACCO | UNKNOWN" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 of SSN" }
      - { name: created_by_broker_id, type: string, source: system, description: "FK -> Broker.id; set from X-User-ID when created by Broker, null when created by CaseManager", default: null }
      - { name: age_years, type: integer, source: computed, description: "Whole years from date_of_birth to current logical clock date (birthday reached = increment)" }
      - { name: status, type: enum, source: system, default: LIVING, description: "LIVING | DECEASED", constraints: "LIVING | DECEASED" }

  - name: StateLicense
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Licensed state (2-letter)" }
      - { name: license_number, type: string, source: input, description: "State license number" }
      - { name: effective_date, type: string, source: input, description: "Window start, ISO date, inclusive" }
      - { name: expiry_date, type: string, source: input, description: "Window end, ISO date, inclusive (closed interval)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | EXPIRED", constraints: "ACTIVE | SUSPENDED | EXPIRED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: insured_id, type: string, source: input, description: "FK -> Insured.id" }
      - { name: carrier_name, type: string, source: input, description: "Issuing carrier" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number" }
      - { name: face_amount_cents, type: integer, source: input, description: "Death benefit face amount in cents" }
      - { name: policy_type, type: enum, source: input, description: "WHOLE_LIFE | UNIVERSAL_LIFE | VARIABLE | TERM_CONVERTIBLE | TERM_NONCONVERTIBLE", constraints: "WHOLE_LIFE | UNIVERSAL_LIFE | VARIABLE | TERM_CONVERTIBLE | TERM_NONCONVERTIBLE" }
      - { name: issue_date, type: string, source: input, description: "Policy issue date ISO" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Current scheduled annual premium" }
      - { name: cash_value_cents, type: integer, source: input, default: 0, description: "Current cash surrender value" }
      - { name: policy_loan_cents, type: integer, source: input, default: 0, description: "Outstanding policy loan balance" }
      - { name: in_contestability, type: boolean, source: computed, description: "true iff current clock date < issue_date + 24 months" }
      - { name: status, type: enum, source: system, default: IN_FORCE, description: "IN_FORCE | LAPSED | MATURED", constraints: "IN_FORCE | LAPSED | MATURED" }

  - name: PolicyCase
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; set from X-User-ID of creating Broker" }
      - { name: portfolio_id, type: string, source: system, default: null, description: "FK -> Portfolio.id; nullable, set by assign-portfolio" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SCREENING | SCREEN_FAILED | UNDERWRITING | UW_DECLINED | MARKETED | IN_CLOSING | ACQUIRED | RESCINDED | WITHDRAWN | EXPIRED | MATURED | LAPSED", constraints: "see state machine" }
      - { name: hold_status, type: enum, source: system, default: CLEAR, description: "CLEAR | COMPLIANCE_HOLD (parallel axis, driven by governing StateLicense suspension cascade)", constraints: "CLEAR | COMPLIANCE_HOLD" }
      - { name: screening_failure_reasons, type: array, source: system, default: [], description: "Ordered failed check codes from latest screening" }
      - { name: blended_le_months, type: integer, source: computed, default: null, description: "Blended life expectancy in months (calc_le_adjust_blend), null until underwriting" }
      - { name: reserve_price_cents, type: integer, source: computed, default: null, description: "Max supportable offer computed at UW approval (calc_reserve_price)" }
      - { name: accepted_offer_id, type: string, source: system, default: null, description: "FK -> Offer.id once an offer is accepted" }
      - { name: broker_commission_bps, type: integer, source: system, default: null, description: "Commission basis points captured at offer acceptance (accept payload, or respond ACCEPT_COUNTER payload; default 0 for ACCEPT_COUNTER when omitted)" }
      - { name: disclosures_delivered, type: boolean, source: system, default: false, description: "True after deliver-disclosures" }
      - { name: disclosures_delivered_at, type: datetime, source: system, default: null, description: "Clock timestamp of disclosure delivery" }
      - { name: marketed_at, type: datetime, source: system, default: null, description: "Timestamp case entered MARKETED" }
      - { name: marketing_deadline, type: datetime, source: computed, default: null, description: "marketed_at + 90 days; case auto-EXPIRED past this with no live offers" }
      - { name: acquired_at, type: datetime, source: system, default: null, description: "Timestamp case entered ACQUIRED" }
      - { name: purchase_price_cents, type: integer, source: system, default: null, description: "Effective price of the accepted offer" }
      - { name: matured_at, type: datetime, source: system, default: null, description: "Timestamp case entered MATURED" }

  - name: EligibilityScreening
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: run_at, type: datetime, source: system, description: "Clock timestamp of the screening run" }
      - { name: result, type: enum, source: computed, description: "PASSED | FAILED", constraints: "PASSED | FAILED" }
      - { name: checks, type: object, source: computed, description: "Per-check booleans: { license_ok, face_ok, age_ok, contestability_ok, type_ok }" }
      - { name: failure_reasons, type: array, source: computed, description: "Failed check codes in fixed order [LICENSE, FACE, AGE, CONTESTABILITY, TYPE]" }
    note: "Immutable record entity (common_fields: false): no update endpoints, no version field; rerun creates a new row."

  - name: LifeExpectancyReport
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: underwriter_tier, type: enum, source: input, description: "A | B", constraints: "A | B" }
      - { name: base_le_months, type: integer, source: input, default: null, description: "Raw LE in months, supplied at deliver" }
      - { name: impairment_debits, type: array, source: input, default: [], description: "Array of decimal debits in [0, 0.9], supplied at deliver" }
      - { name: adjusted_le_months, type: integer, source: computed, default: null, description: "floor(base_le_months * product(1 - d_i)), floor 1" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED | DELIVERED | SUPERSEDED | EXPIRED", constraints: "ORDERED | DELIVERED | SUPERSEDED | EXPIRED" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Clock timestamp of delivery" }
      - { name: valid_through, type: datetime, source: computed, default: null, description: "delivered_at + 180 days; EXPIRED when clock > valid_through" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: amount_cents, type: integer, source: input, description: "Provider offer price in cents" }
      - { name: counter_amount_cents, type: integer, source: system, default: null, description: "Broker counter amount, set by counter" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; +1 on each counter and each RE_OFFER" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + expires_in_days (default 10, max 30)" }
      - { name: effective_price_cents, type: integer, source: computed, default: null, description: "counter_amount_cents if accepted from COUNTERED else amount_cents; null until ACCEPTED" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | EXPIRED", constraints: "PENDING | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | EXPIRED" }

  - name: ClosingPackage
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id (the accepted offer)" }
      - { name: status, type: enum, source: system, default: ASSEMBLED, description: "ASSEMBLED | OUT_FOR_SIGNATURE | COMPLIANCE_REVIEW | APPROVED | CARRIER_SUBMITTED | OWNERSHIP_CONFIRMED | CLOSED | CANCELLED", constraints: "see state machine" }
      - { name: documents, type: array, source: system, description: "Checklist rows { doc_type, required, signed, signed_at }; STATE_SUPPLEMENT required iff insured state_code in {CA, NY}" }
      - { name: deficiency_notes, type: string, source: input, default: null, description: "Reason text supplied on return-deficiency" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving ComplianceOfficer (SoD anchor)" }
      - { name: ownership_confirmed_at, type: datetime, source: system, default: null, description: "Carrier confirmation timestamp" }

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FUNDED | RELEASED | REVERSED | CLOSED", constraints: "OPEN | FUNDED | RELEASED | REVERSED | CLOSED" }
      - { name: expected_funding_cents, type: integer, source: computed, description: "offer effective_price_cents + ESCROW_FEE_CENTS(75000) + servicing fee bucket round_half_up(price * 25/10000)" }
      - { name: funded_amount_cents, type: integer, source: system, default: null, description: "Amount actually deposited at fund" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "funded_amount_cents minus settled disbursements minus rescission refund" }
      - { name: funded_at, type: datetime, source: system, default: null, description: "Clock timestamp of funding" }
      - { name: releasable_at, type: datetime, source: computed, default: null, description: "funded_at + 15 days (rescission window end, release allowed at clock >= releasable_at)" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Clock timestamp of release" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID of releasing FinanceOfficer" }
      - { name: refund_cents, type: integer, source: computed, default: null, description: "Rescission refund returned to provider funding source (calc_rescission_refund)" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: escrow_id, type: string, source: system, description: "FK -> EscrowAccount.id" }
      - { name: bucket, type: enum, source: computed, description: "ESCROW_FEE | SERVICING_FEE | BROKER_COMMISSION | SELLER_NET", constraints: "ESCROW_FEE | SERVICING_FEE | BROKER_COMMISSION | SELLER_NET" }
      - { name: amount_cents, type: integer, source: computed, description: "Waterfall bucket amount (calc_escrow_waterfall)" }
      - { name: payee_broker_id, type: string, source: system, default: null, description: "FK -> Broker.id for BROKER_COMMISSION rows, else null" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | SETTLED", constraints: "PENDING | SETTLED" }

  - name: PremiumSchedule
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: strategy, type: enum, source: computed, description: "PAY_AS_DUE | REDUCED_PAID_UP | MINIMUM_FUNDING (calc_premium_optimization)", constraints: "PAY_AS_DUE | REDUCED_PAID_UP | MINIMUM_FUNDING" }
      - { name: optimized_monthly_premium_cents, type: integer, source: computed, description: "Level monthly premium per strategy" }
      - { name: planned_months, type: integer, source: computed, description: "remaining_le_months at creation" }
      - { name: reduced_face_cents, type: integer, source: computed, default: null, description: "Reduced face for REDUCED_PAID_UP, else null" }
      - { name: expected_net_value_cents, type: integer, source: computed, description: "ENV of the chosen strategy" }
      - { name: missed_payment_count, type: integer, source: system, default: 0, description: "Count of MISSED payments on this schedule" }
      - { name: total_paid_cents, type: integer, source: system, default: 0, description: "Sum of PAID payment amounts" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | TERMINATED", constraints: "ACTIVE | SUPERSEDED | TERMINATED" }

  - name: PremiumPayment
    parent: null
    common_fields: true
    fields:
      - { name: schedule_id, type: string, source: system, description: "FK -> PremiumSchedule.id" }
      - { name: due_date, type: datetime, source: system, description: "Scheduled due timestamp; first = schedule created clock + 30 days, then +30 days per row" }
      - { name: amount_cents, type: integer, source: computed, description: "optimized_monthly_premium_cents (0 rows are never generated)" }
      - { name: grace_deadline, type: datetime, source: computed, description: "due_date + 31 days" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PAID | MISSED", constraints: "SCHEDULED | PAID | MISSED" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Clock timestamp when paid" }

  - name: TrackingEvent
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: event_type, type: enum, source: input, description: "WELLNESS_CALL | OBIT_SEARCH | DMF_MATCH | FAMILY_REPORT | MEDICAL_RECORDS", constraints: "WELLNESS_CALL | OBIT_SEARCH | DMF_MATCH | FAMILY_REPORT | MEDICAL_RECORDS" }
      - { name: outcome, type: enum, source: input, description: "ALIVE_CONFIRMED | DEATH_INDICATED | UNREACHABLE", constraints: "ALIVE_CONFIRMED | DEATH_INDICATED | UNREACHABLE" }
      - { name: source_channel, type: enum, source: input, description: "CALL | OBIT | DMF | MEDICAL | FAMILY", constraints: "CALL | OBIT | DMF | MEDICAL | FAMILY" }
      - { name: event_date, type: string, source: input, description: "ISO date of the observation" }
      - { name: coverage_through, type: datetime, source: computed, description: "event_date + 90 days (verification currency window)" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VERIFIED | REJECTED", constraints: "RECORDED | VERIFIED | REJECTED" }

  - name: DeathClaim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> PolicyCase.id" }
      - { name: date_of_death, type: string, source: input, description: "ISO date of death" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | VERIFIED | FILED | CONTESTED | PAID | DENIED", constraints: "REPORTED | VERIFIED | FILED | CONTESTED | PAID | DENIED" }
      - { name: verification_source_count, type: integer, source: system, default: 0, description: "Distinct source_channels among VERIFIED DEATH_INDICATED TrackingEvents on the case" }
      - { name: certificate_received, type: boolean, source: system, default: false, description: "Set at claim verify" }
      - { name: in_contestability, type: boolean, source: computed, description: "true iff date_of_death < case.acquired_at + 24 months (carrier contest window on the ownership transfer)" }
      - { name: gross_proceeds_cents, type: integer, source: input, default: null, description: "Carrier gross proceeds, supplied at settle when outcome=PAID" }
      - { name: net_proceeds_cents, type: integer, source: computed, default: null, description: "calc_death_claim_net" }

  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Portfolio name" }
      - { name: discount_rate_bps, type: integer, source: input, default: 1200, description: "Annual valuation discount rate in basis points" }
      - { name: valuation_method, type: enum, source: input, description: "PROSPECTIVE | INVESTMENT", constraints: "PROSPECTIVE | INVESTMENT" }
      - { name: allocations, type: array, source: input, default: [], description: "Array of { investor_id (references Investor.id), units integer > 0 }" }
      - { name: holding_count, type: integer, source: computed, default: 0, description: "Count of cases with portfolio_id == this and status in {IN_CLOSING with funded escrow, ACQUIRED}" }
      - { name: invested_capital_cents, type: integer, source: computed, default: 0, description: "Sum of purchase_price_cents over funded-and-not-rescinded cases plus PAID premiums on their schedules" }
      - { name: cached_nav_cents, type: integer, source: system, default: null, description: "NAV from latest FINALIZED ValuationSnapshot; null until first finalize" }
      - { name: nav_stale, type: boolean, source: system, default: false, description: "True when a holdings/cash-flow mutation occurred after latest FINALIZED snapshot" }

  - name: ValuationSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive (half-open window start)" }
      - { name: period_end, type: string, source: input, description: "ISO date, exclusive (half-open window end)" }
      - { name: method_used, type: enum, source: computed, description: "Portfolio.valuation_method captured at creation", constraints: "PROSPECTIVE | INVESTMENT" }
      - { name: nav_cents, type: integer, source: computed, description: "Sum of policy_valuations value_cents" }
      - { name: money_weighted_return_bps, type: integer, source: computed, description: "XIRR via bisection, 64 iterations (calc_portfolio_performance)" }
      - { name: time_weighted_return_bps, type: integer, source: computed, description: "Modified Dietz (calc_portfolio_performance)" }
      - { name: policy_valuations, type: array, source: computed, description: "Rows { case_id, remaining_le_months, value_cents }" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | SUPERSEDED", constraints: "DRAFT | FINALIZED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PolicyCase
    initial_state: DRAFT
    terminal_states: [UW_DECLINED, RESCINDED, WITHDRAWN, EXPIRED, MATURED, LAPSED]
    note: "Parallel axis hold_status (CLEAR | COMPLIANCE_HOLD) evolves independently of status; closing approve / escrow fund / escrow release additionally require hold_status == CLEAR."
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /api/cases/{caseId}/submit"
        actor: Broker
        preconditions:
          - "Caller Broker owns the case (case.broker_id == X-User-ID, else ERR_NOT_CASE_OWNER)"
        side_effects: []
      - from: SCREENING
        to: UNDERWRITING
        trigger: "system (POST /api/cases/{caseId}/screenings result PASSED)"
        actor: system
        preconditions: ["Latest EligibilityScreening.result == PASSED"]
        side_effects: ["screening_failure_reasons = []"]
      - from: SCREENING
        to: SCREEN_FAILED
        trigger: "system (POST /api/cases/{caseId}/screenings result FAILED)"
        actor: system
        preconditions: ["Latest EligibilityScreening.result == FAILED"]
        side_effects: ["screening_failure_reasons = screening.failure_reasons"]
      - from: SCREEN_FAILED
        to: SCREENING
        trigger: "POST /api/cases/{caseId}/screenings (rerun after broker amends policy data)"
        actor: CaseManager
        preconditions: []
        side_effects: ["New EligibilityScreening row created and evaluated"]
      - from: UNDERWRITING
        to: MARKETED
        trigger: "POST /api/cases/{caseId}/uw-decision with decision=APPROVE"
        actor: Underwriter
        preconditions:
          - "At least one LifeExpectancyReport for the case with status DELIVERED and valid_through >= clock (none ever delivered: ERR_LE_REPORT_REQUIRED; all delivered ones expired: ERR_LE_REPORT_EXPIRED)"
        side_effects:
          - "blended_le_months = calc_le_adjust_blend over eligible reports"
          - "reserve_price_cents = calc_reserve_price"
          - "marketed_at = clock; marketing_deadline = marketed_at + 90 days"
      - from: UNDERWRITING
        to: UW_DECLINED
        trigger: "POST /api/cases/{caseId}/uw-decision with decision=DECLINE"
        actor: Underwriter
        preconditions: []
        side_effects: ["All non-terminal Offers on the case -> EXPIRED; non-terminal LifeExpectancyReports unchanged"]
      - from: MARKETED
        to: IN_CLOSING
        trigger: "system (POST /api/offers/{offerId}/accept side effect)"
        actor: system
        preconditions: ["hold_status == CLEAR (else ERR_CASE_ON_COMPLIANCE_HOLD)"]
        side_effects: ["accepted_offer_id set; purchase_price_cents = offer.effective_price_cents"]
      - from: MARKETED
        to: UNDERWRITING
        trigger: "POST /api/cases/{caseId}/reunderwrite"
        actor: Underwriter
        preconditions:
          - "No Offer in PENDING or COUNTERED on the case (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["blended_le_months = null; reserve_price_cents = null; marketed_at = null; marketing_deadline = null"]
      - from: MARKETED
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advance)"
        actor: system
        preconditions: ["clock > marketing_deadline", "no Offer in PENDING or COUNTERED on the case"]
        side_effects: []
      - from: IN_CLOSING
        to: MARKETED
        trigger: "system (POST /api/closing-packages/{packageId}/cancel side effect)"
        actor: system
        preconditions: []
        side_effects: ["accepted_offer_id = null; purchase_price_cents = null; accepted Offer -> WITHDRAWN"]
      - from: IN_CLOSING
        to: ACQUIRED
        trigger: "system (POST /api/escrow-accounts/{escrowId}/release side effect)"
        actor: system
        preconditions: []
        side_effects: ["acquired_at = clock"]
      - from: IN_CLOSING
        to: RESCINDED
        trigger: "system (POST /api/escrow-accounts/{escrowId}/rescind side effect)"
        actor: system
        preconditions: []
        side_effects: ["purchase_price_cents = null; accepted_offer_id kept for audit"]
      - from: ACQUIRED
        to: MATURED
        trigger: "system (POST /api/death-claims/{claimId}/settle outcome=PAID side effect)"
        actor: system
        preconditions: []
        side_effects: ["matured_at = clock", "Insured.status = DECEASED", "Policy.status = MATURED"]
      - from: ACQUIRED
        to: LAPSED
        trigger: "system (second PremiumPayment auto-MISSED cascade)"
        actor: system
        preconditions: ["PremiumSchedule.missed_payment_count reaches 2"]
        side_effects: ["Policy.status = LAPSED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/cases/{caseId}/withdraw"
        actor: Broker
        preconditions: ["Caller owns case (ERR_NOT_CASE_OWNER)"]
        side_effects: []
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /api/cases/{caseId}/withdraw"
        actor: Broker
        preconditions: ["Caller owns case"]
        side_effects: []
      - from: SCREEN_FAILED
        to: WITHDRAWN
        trigger: "POST /api/cases/{caseId}/withdraw"
        actor: Broker
        preconditions: ["Caller owns case"]
        side_effects: []
      - from: UNDERWRITING
        to: WITHDRAWN
        trigger: "POST /api/cases/{caseId}/withdraw"
        actor: Broker
        preconditions: ["Caller owns case"]
        side_effects: ["ORDERED LifeExpectancyReports -> SUPERSEDED"]
      - from: MARKETED
        to: WITHDRAWN
        trigger: "POST /api/cases/{caseId}/withdraw"
        actor: Broker
        preconditions: ["Caller owns case"]
        side_effects: ["All PENDING | COUNTERED Offers -> WITHDRAWN"]
      - from: IN_CLOSING
        to: WITHDRAWN
        trigger: "POST /api/cases/{caseId}/withdraw"
        actor: Broker
        preconditions: ["ALWAYS REJECTED: ERR_CASE_HAS_ACTIVE_CLOSING"]
        side_effects: []
  # hold_status parallel axis
  - entity: PolicyCase
    initial_state: CLEAR
    terminal_states: []
    note: "hold_status axis. Governing license = StateLicense row with state_code == insured.state_code, status ACTIVE, effective_date <= clock date <= expiry_date."
    transitions:
      - from: CLEAR
        to: COMPLIANCE_HOLD
        trigger: "system (governing StateLicense for the case's insured.state_code transitions ACTIVE -> SUSPENDED while case status in {MARKETED, IN_CLOSING})"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLIANCE_HOLD
        to: CLEAR
        trigger: "system (that StateLicense transitions SUSPENDED -> ACTIVE via reinstate)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LifeExpectancyReport
    initial_state: ORDERED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /api/le-reports/{reportId}/deliver"
        actor: Underwriter
        preconditions: ["Case status in {UNDERWRITING, MARKETED, ACQUIRED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "delivered_at = clock; valid_through = delivered_at + 180 days"
          - "adjusted_le_months = floor(base_le_months * product(1 - d_i)), floored at 1"
          - "Any other DELIVERED report on the same case with the same underwriter_tier -> SUPERSEDED"
      - from: DELIVERED
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advance)"
        actor: system
        preconditions: ["clock > valid_through"]
        side_effects: []
      - from: DELIVERED
        to: SUPERSEDED
        trigger: "system (deliver side effect of a newer same-tier report on the same case)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Offer
    initial_state: PENDING
    terminal_states: [REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /api/offers/{offerId}/counter"
        actor: Broker
        preconditions:
          - "Case status == MARKETED (else ERR_CASE_NOT_MARKETED)"
          - "Caller Broker owns the case (ERR_NOT_CASE_OWNER)"
          - "OCC: expected_offer_version matches (ERR_STALE_VERSION)"
          - "round_number < 4 (else ERR_MAX_NEGOTIATION_ROUNDS_REACHED)"
          - "counter_amount_cents >= round_half_up(amount_cents * 101 / 100) (else ERR_COUNTER_INCREMENT_TOO_SMALL)"
        side_effects: ["counter_amount_cents set; round_number += 1"]
      - from: COUNTERED
        to: PENDING
        trigger: "POST /api/offers/{offerId}/respond with action=RE_OFFER"
        actor: Underwriter
        preconditions:
          - "round_number < 4 (else ERR_MAX_NEGOTIATION_ROUNDS_REACHED)"
          - "amount_cents > previous amount_cents and amount_cents <= counter_amount_cents (else ERR_INVALID_REQUEST)"
        side_effects: ["amount_cents = payload amount; counter_amount_cents = null; round_number += 1"]
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/offers/{offerId}/respond with action=ACCEPT_COUNTER"
        actor: Underwriter
        preconditions:
          - "Case status == MARKETED (ERR_CASE_NOT_MARKETED)"
          - "Case disclosures_delivered == true (ERR_DISCLOSURES_INCOMPLETE)"
          - "Case hold_status == CLEAR (ERR_CASE_ON_COMPLIANCE_HOLD)"
        side_effects:
          - "effective_price_cents = counter_amount_cents"
          - "Case -> IN_CLOSING (purchase_price_cents set)"
          - "Every other Offer on the same case in PENDING | COUNTERED -> REJECTED"
          - "ClosingPackage created (ASSEMBLED) with document checklist"
          - "ClosingPackage creation cascades: EscrowAccount created (OPEN) with expected_funding_cents computed"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /api/offers/{offerId}/accept"
        actor: Broker
        preconditions:
          - "Case status == MARKETED (ERR_CASE_NOT_MARKETED)"
          - "Caller Broker owns the case (ERR_NOT_CASE_OWNER)"
          - "Case disclosures_delivered == true (ERR_DISCLOSURES_INCOMPLETE, priority business_safety)"
          - "Case hold_status == CLEAR (ERR_CASE_ON_COMPLIANCE_HOLD, priority business_safety)"
          - "broker_commission_bps <= 600 (ERR_COMMISSION_CAP_EXCEEDED, priority business_fiscal)"
        side_effects:
          - "effective_price_cents = amount_cents"
          - "Case -> IN_CLOSING (accepted_offer_id, purchase_price_cents set)"
          - "Every other Offer on the same case in PENDING | COUNTERED -> REJECTED"
          - "ClosingPackage created (ASSEMBLED) with documents checklist; its creation cascades EscrowAccount (OPEN) whose creation pre-computes expected_funding_cents"
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/offers/{offerId}/reject OR system (sibling offer accepted)"
        actor: Broker | system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /api/offers/{offerId}/reject OR system (sibling offer accepted)"
        actor: Broker | system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /api/offers/{offerId}/withdraw OR system (case withdrawn / closing cancelled / case UW_DECLINED)"
        actor: Underwriter | system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /api/offers/{offerId}/withdraw OR system (case withdrawn)"
        actor: Underwriter | system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system (closing package cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advance; clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advance; clock > expires_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClosingPackage
    initial_state: ASSEMBLED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: ASSEMBLED
        to: OUT_FOR_SIGNATURE
        trigger: "POST /api/closing-packages/{packageId}/send-for-signature"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: OUT_FOR_SIGNATURE
        to: COMPLIANCE_REVIEW
        trigger: "POST /api/closing-packages/{packageId}/submit-review"
        actor: CaseManager
        preconditions: ["At least one document signed (else ERR_INVALID_STATE_TRANSITION); completeness is NOT required here"]
        side_effects: []
      - from: COMPLIANCE_REVIEW
        to: OUT_FOR_SIGNATURE
        trigger: "POST /api/closing-packages/{packageId}/return-deficiency"
        actor: ComplianceOfficer
        preconditions: ["Every doc_type in deficient_doc_types names a documents[] row (else ERR_INVALID_REQUEST)"]
        side_effects: ["Named docs reset signed=false, signed_at=null; deficiency_notes stored"]
      - from: COMPLIANCE_REVIEW
        to: APPROVED
        trigger: "POST /api/closing-packages/{packageId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Case hold_status == CLEAR (ERR_CASE_ON_COMPLIANCE_HOLD, business_safety)"
          - "Governing StateLicense for insured.state_code exists, status ACTIVE, and expiry_date >= clock date + 30 days (missing/suspended: ERR_STATE_LICENSE_NOT_ACTIVE; expiring inside 30 days: ERR_LICENSE_EXPIRING_SOON)"
          - "All required documents signed (ERR_CLOSING_DOCS_INCOMPLETE, business_constraint)"
        side_effects: ["approved_by_user_id = caller X-User-ID"]
      - from: APPROVED
        to: CARRIER_SUBMITTED
        trigger: "POST /api/closing-packages/{packageId}/submit-carrier"
        actor: CaseManager
        preconditions: ["EscrowAccount for the case has status FUNDED (else ERR_ESCROW_NOT_FUNDED)"]
        side_effects: []
      - from: CARRIER_SUBMITTED
        to: OWNERSHIP_CONFIRMED
        trigger: "POST /api/closing-packages/{packageId}/confirm-ownership"
        actor: CaseManager
        preconditions: []
        side_effects: ["ownership_confirmed_at = clock"]
      - from: OWNERSHIP_CONFIRMED
        to: CLOSED
        trigger: "system (POST /api/escrow-accounts/{escrowId}/release side effect)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSEMBLED
        to: CANCELLED
        trigger: "POST /api/closing-packages/{packageId}/cancel OR system (escrow rescind)"
        actor: CaseManager | system
        preconditions: ["Manual cancel: EscrowAccount status == OPEN (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["Manual cancel: Case -> MARKETED; accepted Offer -> WITHDRAWN; EscrowAccount OPEN -> CLOSED"]
      - from: OUT_FOR_SIGNATURE
        to: CANCELLED
        trigger: "POST /api/closing-packages/{packageId}/cancel OR system (escrow rescind)"
        actor: CaseManager | system
        preconditions: ["Manual cancel: EscrowAccount status == OPEN"]
        side_effects: ["Manual cancel: same as ASSEMBLED cancel"]
      - from: COMPLIANCE_REVIEW
        to: CANCELLED
        trigger: "POST /api/closing-packages/{packageId}/cancel OR system (escrow rescind)"
        actor: CaseManager | system
        preconditions: ["Manual cancel: EscrowAccount status == OPEN"]
        side_effects: ["Manual cancel: same as ASSEMBLED cancel"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system (escrow rescind side effect)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CARRIER_SUBMITTED
        to: CANCELLED
        trigger: "system (escrow rescind side effect)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OWNERSHIP_CONFIRMED
        to: CANCELLED
        trigger: "system (escrow rescind side effect)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EscrowAccount
    initial_state: OPEN
    terminal_states: [CLOSED, REVERSED]
    transitions:
      - from: OPEN
        to: FUNDED
        trigger: "POST /api/escrow-accounts/{escrowId}/fund"
        actor: FinanceOfficer
        preconditions:
          - "ClosingPackage status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"
          - "Case hold_status == CLEAR (ERR_CASE_ON_COMPLIANCE_HOLD)"
          - "Case portfolio_id != null (ERR_PORTFOLIO_NOT_ASSIGNED)"
          - "amount_cents == expected_funding_cents (ERR_ESCROW_FUNDS_MISMATCH, business_fiscal)"
        side_effects:
          - "funded_amount_cents = amount_cents; funded_at = clock; releasable_at = funded_at + 15 days; balance_cents = funded_amount_cents"
          - "Portfolio.invested_capital_cents += case.purchase_price_cents; Portfolio.holding_count += 1; Portfolio.nav_stale = true; Portfolio.version += 1"
      - from: FUNDED
        to: RELEASED
        trigger: "POST /api/escrow-accounts/{escrowId}/release"
        actor: FinanceOfficer
        preconditions:
          - "clock >= releasable_at (else ERR_RESCISSION_WINDOW_ACTIVE, business_temporal)"
          - "Case hold_status == CLEAR (ERR_CASE_ON_COMPLIANCE_HOLD, business_safety)"
          - "Governing StateLicense ACTIVE (ERR_STATE_LICENSE_NOT_ACTIVE, business_safety)"
          - "X-User-ID != ClosingPackage.approved_by_user_id (ERR_SEGREGATION_OF_DUTIES, business_safety)"
          - "ClosingPackage status == OWNERSHIP_CONFIRMED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "calc_escrow_waterfall: create 4 Disbursement rows (PENDING) in bucket order ESCROW_FEE, SERVICING_FEE, BROKER_COMMISSION, SELLER_NET"
          - "balance_cents = funded_amount_cents - sum(disbursements) == 0"
          - "released_at = clock; released_by_user_id = caller"
          - "ClosingPackage -> CLOSED (caused by release)"
          - "Case -> ACQUIRED with acquired_at = clock (caused by release)"
      - from: FUNDED
        to: REVERSED
        trigger: "POST /api/escrow-accounts/{escrowId}/rescind"
        actor: ComplianceOfficer
        preconditions: ["clock < releasable_at (else ERR_RESCISSION_WINDOW_EXPIRED)"]
        side_effects:
          - "refund_cents = funded_amount_cents (calc_rescission_refund); balance_cents = 0"
          - "ClosingPackage -> CANCELLED (caused by rescind)"
          - "Case -> RESCINDED (caused by package cancellation)"
          - "Portfolio.invested_capital_cents -= case purchase price at funding; Portfolio.holding_count -= 1; Portfolio.nav_stale = true; Portfolio.version += 1 (caused by case rescission)"
      - from: OPEN
        to: CLOSED
        trigger: "system (closing package manual cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: CLOSED
        trigger: "system (POST /api/disbursements/{disbursementId}/mark-paid when the last PENDING disbursement settles)"
        actor: system
        preconditions: ["All Disbursement rows SETTLED"]
        side_effects: []

  - entity: Disbursement
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /api/disbursements/{disbursementId}/mark-paid"
        actor: FinanceOfficer
        preconditions: ["EscrowAccount status == RELEASED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["EscrowAccount.balance_cents unchanged (already debited at release); if last PENDING row, escrow -> CLOSED"]

  - entity: PremiumSchedule
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /api/cases/{caseId}/premium-schedules creates a newer schedule)"
        actor: system
        preconditions: []
        side_effects: ["Its SCHEDULED PremiumPayments are left in place but no longer payable (pay on them -> ERR_INVALID_STATE_TRANSITION)"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (case -> MATURED or case -> LAPSED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PremiumPayment
    initial_state: SCHEDULED
    terminal_states: [PAID, MISSED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /api/premium-payments/{paymentId}/pay"
        actor: FinanceOfficer
        preconditions:
          - "Parent PremiumSchedule status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"
          - "amount_cents == payment.amount_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_at = clock; PremiumSchedule.total_paid_cents += amount_cents"
          - "Portfolio.invested_capital_cents += amount_cents; Portfolio.nav_stale = true; Portfolio.version += 1 (via case's portfolio)"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (POST /api/_clock/set_current_utc advance; clock > grace_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "PremiumSchedule.missed_payment_count += 1"
          - "If missed_payment_count reaches 2: schedule -> TERMINATED (caused by miss counter), case -> LAPSED with Policy.status = LAPSED (caused by schedule termination), Portfolio.nav_stale = true (caused by case lapse)"

  - entity: TrackingEvent
    initial_state: RECORDED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /api/tracking-events/{eventId}/verify"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Recompute verification_source_count on any REPORTED DeathClaim of the case"]
      - from: RECORDED
        to: REJECTED
        trigger: "POST /api/tracking-events/{eventId}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: DeathClaim
    initial_state: REPORTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /api/death-claims/{claimId}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "certificate_received == true in payload (else ERR_INVALID_REQUEST)"
          - ">= 2 VERIFIED TrackingEvents on the case with outcome DEATH_INDICATED and pairwise distinct source_channel (else ERR_VERIFICATION_SOURCES_INSUFFICIENT)"
        side_effects: ["certificate_received = true; verification_source_count recomputed"]
      - from: VERIFIED
        to: FILED
        trigger: "POST /api/death-claims/{claimId}/file"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: FILED
        to: PAID
        trigger: "POST /api/death-claims/{claimId}/settle with outcome=PAID"
        actor: ComplianceOfficer
        preconditions:
          - "gross_proceeds_cents present and > 0 (else ERR_INVALID_REQUEST)"
          - "If in_contestability == true and contest_review_acknowledged != true: transition to CONTESTED instead (not an error)"
        side_effects:
          - "net_proceeds_cents = calc_death_claim_net"
          - "Case -> MATURED (caused by settle); that case transition sets Insured.status = DECEASED and Policy.status = MATURED"
          - "ACTIVE PremiumSchedule on the case -> TERMINATED (caused by case maturity)"
          - "Portfolio.nav_stale = true; Portfolio.version += 1; Portfolio.invested_capital_cents unchanged (caused by schedule termination -> portfolio dirtying)"
          - "DRAFT ValuationSnapshots on the portfolio -> SUPERSEDED (caused by portfolio dirtying)"
      - from: FILED
        to: CONTESTED
        trigger: "POST /api/death-claims/{claimId}/settle with outcome=PAID while in_contestability and no acknowledgement"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: CONTESTED
        to: PAID
        trigger: "POST /api/death-claims/{claimId}/settle with outcome=PAID and contest_review_acknowledged=true"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Same cascade as FILED -> PAID"]
      - from: FILED
        to: DENIED
        trigger: "POST /api/death-claims/{claimId}/settle with outcome=DENIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: CONTESTED
        to: DENIED
        trigger: "POST /api/death-claims/{claimId}/settle with outcome=DENIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: StateLicense
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/licenses/{licenseId}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Every PolicyCase whose insured.state_code == license.state_code with status in {MARKETED, IN_CLOSING}: hold_status CLEAR -> COMPLIANCE_HOLD (caused by suspension)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/licenses/{licenseId}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Cases held by this license's suspension: hold_status -> CLEAR (caused by reinstatement)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /api/_clock/set_current_utc advance; clock date > expiry_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (clock date > expiry_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ValuationSnapshot
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/valuation-snapshots/{snapshotId}/finalize"
        actor: PortfolioManager
        preconditions: ["No other FINALIZED snapshot on the same portfolio with overlapping [period_start, period_end) (else ERR_SNAPSHOT_PERIOD_OVERLAP)"]
        side_effects:
          - "Any prior FINALIZED snapshot on the same portfolio -> SUPERSEDED"
          - "Portfolio.cached_nav_cents = nav_cents; Portfolio.nav_stale = false; Portfolio.version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer DRAFT created on the same portfolio, or portfolio dirtied by death-claim settle)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer snapshot on the same portfolio is finalized)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: offer-counter-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /api/offers/{offerId}/counter"
    occ_field: expected_offer_version
    description: |
      Countering an Offer whose version has advanced since the client last
      observed it is rejected: a prior RE_OFFER response has already rewritten
      amount_cents and round_number, so the client's counter would be computed
      against superseded terms. Rejected as a stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: premium-schedule-create-stale-case
    parent_entity: PolicyCase
    write_endpoint: "POST /api/cases/{caseId}/premium-schedules"
    occ_field: expected_case_version
    description: |
      Creating a PremiumSchedule against a PolicyCase whose version has advanced
      since the client last observed it is rejected: creation supersedes the
      currently ACTIVE schedule, and a supersede decision made against a stale
      case view (e.g. premiums paid or a schedule just replaced) must not
      silently succeed. Rejected as a stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: snapshot-create-stale-portfolio
    parent_entity: Portfolio
    write_endpoint: "POST /api/portfolios/{portfolioId}/valuation-snapshots"
    occ_field: expected_portfolio_version
    description: |
      Creating a ValuationSnapshot against a Portfolio whose version has
      advanced since the client last observed it is rejected: creation
      supersedes the current DRAFT snapshot and must price against the latest
      holdings/invested-capital state, not a stale one. Rejected as a
      stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_age_years
    trigger: "On every read/compute that references Insured.age_years or screening age check"
    algorithm: chronological
    formula: |
      age = clock_date.year - dob.year
      if (clock_date.month, clock_date.day) < (dob.month, dob.day): age -= 1
    input_set: "Insured.date_of_birth, logical clock date"
    constants: {}
    precision: "integer years"

  - name: calc_eligibility_screening
    trigger: "POST /api/cases/{caseId}/screenings"
    algorithm: threshold
    formula: |
      license_ok = exists StateLicense L with L.state_code == insured.state_code,
                   L.status == ACTIVE, L.effective_date <= clock_date <= L.expiry_date
      face_ok = policy.face_amount_cents >= MIN_FACE_CENTS            # >= inclusive
      age_ok = calc_age_years(insured) >= MIN_AGE_YEARS               # >= inclusive
      contestability_ok = clock_date >= add_months(policy.issue_date, CONTESTABILITY_MONTHS)  # inclusive
      type_ok = policy.policy_type != TERM_NONCONVERTIBLE
      result = PASSED iff all five true else FAILED
      failure_reasons = failed codes in fixed order [LICENSE, FACE, AGE, CONTESTABILITY, TYPE]
    input_set: "PolicyCase + its Policy + its Insured + StateLicense rows for insured.state_code"
    constants:
      MIN_FACE_CENTS: 10000000
      MIN_AGE_YEARS: 65
      CONTESTABILITY_MONTHS: 24
    precision: "booleans; no rounding"

  - name: calc_le_adjust_blend
    trigger: "LifeExpectancyReport deliver (per-report adjust) and PolicyCase uw-decision APPROVE / valuation (blend)"
    algorithm: weighted_scoring
    formula: |
      Per report: adjusted_i = max(1, floor(base_le_months_i * product over d in impairment_debits_i of (1 - d)))
      Blend over eligible set E = { reports on the case with status DELIVERED and valid_through >= clock }:
        if |E| == 0: not computable (uw-decision blocked)
        if |E| == 1: blended = adjusted of the single report
        else: weight w_i = TIER_WEIGHT[tier_i]; blended = round_half_up( sum(w_i * adjusted_i) / sum(w_i) )
    input_set: "LifeExpectancyReports on the case with status DELIVERED and valid_through >= clock; SUPERSEDED/EXPIRED/ORDERED excluded"
    constants:
      TIER_WEIGHT: { A: 3, B: 1 }
    precision: "integer months; floor for adjust, round_half_up for blend"

  - name: calc_reserve_price
    trigger: "POST /api/cases/{caseId}/uw-decision decision=APPROVE"
    algorithm: forward_looking
    formula: |
      k = case.blended_le_months
      i = PRICING_RATE_BPS / 10000 / 12          # monthly pricing rate
      v = 1 / (1 + i)
      pv_benefit = face_amount_cents * v^k
      a_k = (1 - v^k) / i                        # annuity-immediate factor over k months
      pv_premiums = (annual_premium_cents / 12) * a_k
      expense_load = EXPENSE_FLAT_CENTS + round_half_up(face_amount_cents * EXPENSE_FACE_BPS / 10000)
      raw = pv_benefit - pv_premiums - expense_load
      reserve_price_cents = min(round_half_up(face_amount_cents * PRICE_CAP_FACE_BPS / 10000),
                                max(0, round_half_up(raw)))
    input_set: "The case's Policy (face_amount_cents, annual_premium_cents) and blended_le_months"
    constants:
      PRICING_RATE_BPS: 1300
      EXPENSE_FLAT_CENTS: 250000
      EXPENSE_FACE_BPS: 150
      PRICE_CAP_FACE_BPS: 8000
    precision: "cents integer; final round_half_up; intermediate values unrounded until final round"

  - name: calc_policy_value
    trigger: "ValuationSnapshot creation (per acquired/matured/lapsed case in the portfolio)"
    algorithm: forward_looking
    formula: |
      valuation_date = snapshot.period_end (the exclusive end date is the as-of date)
      months_elapsed = floor(days_between(latest eligible LE report delivered_at, valuation_date) / 30)
      remaining_le = max(1, case.blended_le_months - months_elapsed)
      i = portfolio.discount_rate_bps / 10000 / 12; v = 1 / (1 + i); k = remaining_le
      monthly_premium = (ACTIVE PremiumSchedule on the case).optimized_monthly_premium_cents
                        if one exists, else policy.annual_premium_cents / 12 (unrounded)
      Case status filter: ACQUIRED -> value per variant; MATURED -> net_proceeds_cents; LAPSED -> 0
      Variant PROSPECTIVE (fair value):
        value = round_half_up(face * v^k - monthly_premium * (1 - v^k)/i)
      Variant INVESTMENT (cost accretion):
        years_held = days_between(case.acquired_at, valuation_date) / 365
        cost = case.purchase_price_cents + total PAID premium cents on the case's schedules
        value = min(face, round_half_up(cost * (1 + portfolio.discount_rate_bps/10000)^years_held))
      Values floored at 0.
    input_set: "Cases with portfolio_id == portfolio and status in {ACQUIRED, MATURED, LAPSED}; latest eligible LE report per case"
    constants: {}
    precision: "cents integer, round_half_up at the final step of each variant"
    variants:
      - name: PROSPECTIVE
        when: "Portfolio.valuation_method == PROSPECTIVE"
        difference: "Discounts future death benefit net of future premiums at the portfolio rate"
      - name: INVESTMENT
        when: "Portfolio.valuation_method == INVESTMENT"
        difference: "Accretes historical cost (purchase + paid premiums) forward at the portfolio rate, capped at face; ignores LE except via status"

  - name: calc_portfolio_performance
    trigger: "ValuationSnapshot creation"
    algorithm: chronological
    formula: |
      Cash flows CF over [period_start, period_end), dated at event timestamps:
        escrow fund:  -purchase_price_cents at funded_at (fee overage is NOT a portfolio flow)
        premium pay:  -amount_cents at paid_at
        (death-claim proceeds are NOT cash flows here; they enter through terminal NAV,
         since a MATURED case is valued at net_proceeds_cents)
      V0 = invested capital strictly before period_start (sum of funded purchase prices and paid premiums with timestamp < period_start)
      V1 = snapshot nav_cents computed at period_end
      Terminal flow: +V1 at period_end; initial flow: -V0 at period_start (if V0 > 0)
      MONEY_WEIGHTED (XIRR): solve r such that sum over all flows CF_j / (1+r)^(d_j/365) = 0,
        d_j = days from period_start to flow date. Bisection on r in [-0.9999, 10.0],
        exactly 64 iterations; report round_half_up(r * 10000) bps.
      TIME_WEIGHTED (Modified Dietz):
        D = days_between(period_start, period_end); F = sum of external flows (excl. initial/terminal)
        R = (V1 - V0 - F) / (V0 + sum( w_j * F_j )) with w_j = (D - d_j) / D
        if denominator == 0: R = 0; report round_half_up(R * 10000) bps.
    input_set: "Funded escrows, PAID premium payments, PAID death claims for cases in the portfolio"
    constants:
      XIRR_ITERATIONS: 64
      XIRR_LOW: -0.9999
      XIRR_HIGH: 10.0
    precision: "integer basis points, round_half_up"
    variants:
      - name: MONEY_WEIGHTED
        when: "Always computed (money_weighted_return_bps)"
        difference: "Cash-flow-timing-sensitive internal rate solved by fixed-iteration bisection"
      - name: TIME_WEIGHTED
        when: "Always computed (time_weighted_return_bps)"
        difference: "Modified Dietz; ignores intra-period timing beyond day weights; algebraically different result for the same flows"

  - name: calc_escrow_waterfall
    trigger: "POST /api/escrow-accounts/{escrowId}/release"
    algorithm: waterfall_allocation
    formula: |
      P = case.purchase_price_cents (accepted offer effective price)
      Bucket order is fixed; each bucket rounded to cents IMMEDIATELY (round_half_up) before the next:
        1. fee_escrow = ESCROW_FEE_CENTS                                  (flat integer, provider-funded)
        2. fee_servicing = round_half_up(P * SERVICING_FEE_BPS / 10000)   (provider-funded)
        3. commission = min(round_half_up(P * case.broker_commission_bps / 10000),
                            round_half_up(face_amount_cents * COMMISSION_CAP_FACE_BPS / 10000))
        4. seller_net = P - commission                                    (seller receives price net of commission)
      funded_amount_cents must equal expected_funding_cents = P + fee_escrow + fee_servicing,
      so sum(disbursements) == funded_amount_cents exactly and balance_cents lands at 0.
      (seller_net >= 0.94 * P always, since commission <= 600 bps of P enforced at accept,
      so the bucket can never go negative.)
      Disbursement rows created in the above order.
    input_set: "Accepted offer effective price, accepted-time broker_commission_bps (stored on case as part of accept), policy face"
    constants:
      ESCROW_FEE_CENTS: 75000
      SERVICING_FEE_BPS: 25
      COMMISSION_CAP_FACE_BPS: 600
    precision: "cents integer; per-bucket round_half_up; remainder to SELLER_NET"
    note: "Rounding order is pinned: per-bucket rounding (NOT round of the sum). With P chosen so the fractional parts of servicing and commission cross an integer boundary jointly, per-bucket and sum-then-round differ."

  - name: calc_premium_optimization
    trigger: "POST /api/cases/{caseId}/premium-schedules"
    algorithm: constraint_propagation
    formula: |
      k = remaining_le = max(1, blended_le_months - floor(days_between(latest eligible LE delivered_at, clock)/30))
      i = portfolio.discount_rate_bps/10000/12; v = 1/(1+i); a_k = (1 - v^k)/i
      F = face_amount_cents; CV = cash_value_cents; AP12 = annual_premium_cents / 12 (unrounded)
      Strategy PAY_AS_DUE:      m_due = round_half_up(AP12); ENV_due = F*v^k - AP12 * a_k
      Strategy REDUCED_PAID_UP: pv_prem = AP12 * a_k
                                reduced_face = round_half_up(F * CV / (CV + pv_prem)) if CV + pv_prem > 0 else 0
                                ENV_rpu = reduced_face * v^k
      Strategy MINIMUM_FUNDING: monthly m solves project(CV, m, k) == 0 where the projection is
        iterated month-by-month IN ORDER n = 1..k (evaluation order pinned):
          COI_n = round_half_up(max(0, F - CV_{n-1}) * COI_MONTHLY_RATE)
          CV_n  = round_half_up(CV_{n-1} * (1 + CREDITING_MONTHLY)) + m - COI_n
        m found by bisection on [0, AP12 * 4], exactly 40 iterations, then m_mf = round_half_up(m)
        If m_mf == 0 (cash value fully self-funds the coverage), MINIMUM_FUNDING is INFEASIBLE
        (carriers require a positive modal premium) and is excluded from the argmax.
        ENV_mf = F * v^k - m_mf * a_k
      Choose strategy = argmax ENV; ties broken by fixed priority PAY_AS_DUE > REDUCED_PAID_UP > MINIMUM_FUNDING.
      optimized_monthly_premium_cents = m_due | 0 | m_mf per chosen strategy.
      expected_net_value_cents = round_half_up(ENV of chosen strategy).
    input_set: "Case in ACQUIRED with blended_le_months; its Policy fields; its Portfolio.discount_rate_bps"
    constants:
      CREDITING_MONTHLY: 0.0033333333333333335
      COI_MONTHLY_RATE: 0.006
      MF_BISECTION_ITERATIONS: 40
    precision: "cents integer; per-month round_half_up inside the projection; final round_half_up"
    note: "MINIMUM_FUNDING is the pinned circular-dependency resolution: COI depends on CV which depends on m; the month-ordered projection + fixed-iteration bisection makes the value well-defined."

  - name: calc_death_claim_net
    trigger: "POST /api/death-claims/{claimId}/settle outcome=PAID"
    algorithm: aggregation
    formula: |
      unpaid = sum of PremiumPayment.amount_cents on the case's ACTIVE schedule with
               status in {SCHEDULED, MISSED} and due_date <= date_of_death 23:59:59Z
      net_proceeds_cents = max(0, gross_proceeds_cents - policy.policy_loan_cents - unpaid)
    input_set: "Claim, its case's ACTIVE PremiumSchedule payments, policy loan"
    constants: {}
    precision: "cents integer"

  - name: calc_rescission_refund
    trigger: "POST /api/escrow-accounts/{escrowId}/rescind"
    algorithm: aggregation
    formula: |
      refund_cents = funded_amount_cents (full refund inside the rescission window; no fee retained)
      escrow.balance_cents = 0
      Portfolio.invested_capital_cents -= purchase_price_cents that was added at fund
    input_set: "The FUNDED EscrowAccount and its case"
    constants: {}
    precision: "cents integer"

  - name: calc_investor_share
    trigger: "Investor report derivation from a FINALIZED ValuationSnapshot (GET snapshot detail includes per-investor shares)"
    algorithm: waterfall_allocation
    formula: |
      total_units = sum(allocations[].units)
      For each allocation a in allocations order (array order as stored):
        share_a = round_half_up(nav_cents * a.units / total_units)
      rounding_drift = nav_cents - sum(share_a)
      The drift (a small integer, possibly negative) is added to the share of the allocation with
      the largest units; tie on units -> the allocation whose Investor.created_at is earliest.
    input_set: "Portfolio.allocations, snapshot.nav_cents"
    constants: {}
    precision: "cents integer; drift remainder pinned to largest unitholder with created_at tie-break"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role recognized", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role appears in the endpoint's roles list", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Resource ownership: Broker caller must own the case chain (case.broker_id == X-User-ID) for submit/withdraw/counter/accept/reject; Investor caller must hold an allocation in the portfolio for portfolio/snapshot reads", error_id: ERR_NOT_CASE_OWNER, http_status: 403, applies_to: "Broker-owned case actions; investor ownership variant returns ERR_INVESTOR_NOT_ALLOCATED" }
  - { priority: 3, category: auth, check: "Investor allocation ownership on portfolio and snapshot reads", error_id: ERR_INVESTOR_NOT_ALLOCATED, http_status: 403, applies_to: "GET /api/portfolios/{id}, GET /api/portfolios/{id}/valuation-snapshots, GET /api/valuation-snapshots/{id}, GET /api/portfolios" }
  - { priority: 4, category: existence, check: "Malformed body, missing required field, invalid enum member, negative amount, invalid date", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "Every id in the path exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Body-supplied FK references exist (policy_id, insured_id, portfolio_id, allocation investor_ids)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creation endpoints with FK inputs" }
  - { priority: 6, category: state, check: "Target resource not in a terminal state for this trigger", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "State machine from-state valid for the trigger", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "Case is MARKETED for offer create/counter/accept", error_id: ERR_CASE_NOT_MARKETED, http_status: 409, applies_to: "POST /api/cases/{id}/offers, POST /api/offers/{id}/counter, POST /api/offers/{id}/accept, POST /api/offers/{id}/respond" }
  - { priority: 7, category: state, check: "Withdraw forbidden while case IN_CLOSING", error_id: ERR_CASE_HAS_ACTIVE_CLOSING, http_status: 409, applies_to: "POST /api/cases/{id}/withdraw" }
  - { priority: 7, category: state, check: "Escrow FUNDED before submit-carrier", error_id: ERR_ESCROW_NOT_FUNDED, http_status: 409, applies_to: "POST /api/closing-packages/{id}/submit-carrier" }
  - { priority: 7, category: state, check: "Case ACQUIRED before tracking events, premium schedules, death claims", error_id: ERR_POLICY_NOT_ACQUIRED, http_status: 409, applies_to: "POST /api/cases/{id}/tracking-events, POST /api/cases/{id}/premium-schedules, POST /api/cases/{id}/death-claims" }
  - { priority: 8, category: business_safety, check: "Disclosures delivered before offer acceptance", error_id: ERR_DISCLOSURES_INCOMPLETE, http_status: 422, applies_to: "POST /api/offers/{id}/accept, POST /api/offers/{id}/respond(ACCEPT_COUNTER)" }
  - { priority: 8, category: business_safety, check: "Case not on compliance hold for market/closing/fund/release actions", error_id: ERR_CASE_ON_COMPLIANCE_HOLD, http_status: 409, applies_to: "offer accept/respond, closing approve, escrow fund, escrow release" }
  - { priority: 8, category: business_safety, check: "Governing StateLicense exists and ACTIVE at closing approve and escrow release", error_id: ERR_STATE_LICENSE_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/closing-packages/{id}/approve, POST /api/escrow-accounts/{id}/release" }
  - { priority: 8, category: business_safety, check: "Governing license expiry_date >= clock date + 30 days at closing approve", error_id: ERR_LICENSE_EXPIRING_SOON, http_status: 409, applies_to: "POST /api/closing-packages/{id}/approve" }
  - { priority: 8, category: business_safety, check: "Escrow release caller differs from closing-package approver (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/escrow-accounts/{id}/release" }
  - { priority: 9, category: business_temporal, check: "clock >= escrow.releasable_at for release", error_id: ERR_RESCISSION_WINDOW_ACTIVE, http_status: 409, applies_to: "POST /api/escrow-accounts/{id}/release" }
  - { priority: 9, category: business_temporal, check: "Rescind attempted at/after releasable_at", error_id: ERR_RESCISSION_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /api/escrow-accounts/{id}/rescind" }
  - { priority: 9, category: business_temporal, check: "All delivered LE reports expired at uw-decision (none delivered at all -> ERR_LE_REPORT_REQUIRED)", error_id: ERR_LE_REPORT_EXPIRED, http_status: 409, applies_to: "POST /api/cases/{id}/uw-decision" }
  - { priority: 9, category: business_temporal, check: "No LE report ever delivered at uw-decision", error_id: ERR_LE_REPORT_REQUIRED, http_status: 422, applies_to: "POST /api/cases/{id}/uw-decision" }
  - { priority: 9, category: business_temporal, check: "Valuation snapshot period_end > period_start", error_id: ERR_INVALID_PERIOD, http_status: 422, applies_to: "POST /api/portfolios/{id}/valuation-snapshots" }
  - { priority: 9, category: business_temporal, check: "Every ACQUIRED case in the portfolio has at least one DELIVERED unexpired LE report at snapshot creation", error_id: ERR_VALUATION_INPUT_STALE, http_status: 422, applies_to: "POST /api/portfolios/{id}/valuation-snapshots" }
  - { priority: 10, category: business_constraint, check: "No other PolicyCase for the same policy in a non-terminal status", error_id: ERR_DUPLICATE_ACTIVE_CASE, http_status: 409, applies_to: "POST /api/cases" }
  - { priority: 10, category: business_constraint, check: "Policy not mutable while a case is in {UNDERWRITING, MARKETED, IN_CLOSING, ACQUIRED}", error_id: ERR_POLICY_LOCKED_BY_ACTIVE_CASE, http_status: 409, applies_to: "PATCH /api/policies/{id}" }
  - { priority: 10, category: business_constraint, check: "Offer round_number < 4 for counter and RE_OFFER", error_id: ERR_MAX_NEGOTIATION_ROUNDS_REACHED, http_status: 409, applies_to: "POST /api/offers/{id}/counter, POST /api/offers/{id}/respond" }
  - { priority: 10, category: business_constraint, check: "counter_amount_cents >= round_half_up(amount_cents * 101/100)", error_id: ERR_COUNTER_INCREMENT_TOO_SMALL, http_status: 422, applies_to: "POST /api/offers/{id}/counter" }
  - { priority: 10, category: business_constraint, check: "All required closing documents signed at approve", error_id: ERR_CLOSING_DOCS_INCOMPLETE, http_status: 422, applies_to: "POST /api/closing-packages/{id}/approve" }
  - { priority: 10, category: business_constraint, check: "Claim create requires >= 1 VERIFIED DEATH_INDICATED tracking event; claim verify requires >= 2 with distinct source_channel plus certificate_received", error_id: ERR_VERIFICATION_SOURCES_INSUFFICIENT, http_status: 422, applies_to: "POST /api/cases/{id}/death-claims, POST /api/death-claims/{id}/verify" }
  - { priority: 10, category: business_constraint, check: "New StateLicense [effective_date, expiry_date] closed window must not touch or overlap an existing row for the same state (new.effective_date must be > existing.expiry_date strictly)", error_id: ERR_LICENSE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/licenses" }
  - { priority: 10, category: business_constraint, check: "New snapshot [period_start, period_end) half-open window must not overlap an existing FINALIZED snapshot for the portfolio; adjacency (start == other.end) is allowed", error_id: ERR_SNAPSHOT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /api/portfolios/{id}/valuation-snapshots, POST /api/valuation-snapshots/{id}/finalize" }
  - { priority: 11, category: business_referential, check: "portfolio_id set on case before escrow fund", error_id: ERR_PORTFOLIO_NOT_ASSIGNED, http_status: 422, applies_to: "POST /api/escrow-accounts/{id}/fund" }
  - { priority: 12, category: business_fiscal, check: "Escrow fund amount equals expected_funding_cents", error_id: ERR_ESCROW_FUNDS_MISMATCH, http_status: 422, applies_to: "POST /api/escrow-accounts/{id}/fund" }
  - { priority: 12, category: business_fiscal, check: "broker_commission_bps <= 600 at accept", error_id: ERR_COMMISSION_CAP_EXCEEDED, http_status: 422, applies_to: "POST /api/offers/{id}/accept" }
  - { priority: 12, category: business_fiscal, check: "Premium pay amount equals scheduled amount", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /api/premium-payments/{id}/pay" }
  - { priority: 13, category: state, check: "OCC expected_<parent>_version matches current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/offers/{id}/counter, POST /api/cases/{id}/premium-schedules, POST /api/portfolios/{id}/valuation-snapshots" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (§1.5 last-resort; default clock pinned) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; never falls back to wall-clock. Setting the clock evaluates all automatic transitions: Offer PENDING|COUNTERED with expires_at < new clock -> EXPIRED; LifeExpectancyReport DELIVERED with valid_through < new clock -> EXPIRED; StateLicense ACTIVE|SUSPENDED with expiry_date < new clock date -> EXPIRED; PremiumPayment SCHEDULED with grace_deadline < new clock -> MISSED (with lapse cascade); MARKETED cases past marketing_deadline with no PENDING|COUNTERED offers -> EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Automatic transitions listed in description"]

  # --- Brokers / Investors / Insureds / Policies / Licenses ---
  - method: POST
    path: "/api/brokers"
    description: "Register a broker"
    roles: [PlatformAdmin]
    code: 201
    input: [name, license_number, state_code]
    output: Broker
    side_effects: []
  - method: GET
    path: "/api/brokers/{id}"
    description: "Get a broker"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: Broker
    side_effects: []
  - method: GET
    path: "/api/brokers/{id}/cases"
    description: "List cases owned by a broker (FK reverse: PolicyCase.broker_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PolicyCase[]
    side_effects: []
  - method: GET
    path: "/api/brokers/{id}/insureds"
    description: "List insureds created by a broker (FK reverse: Insured.created_by_broker_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Insured[]
    side_effects: []
  - method: GET
    path: "/api/brokers/{id}/disbursements"
    description: "List commission disbursements payable to a broker (FK reverse: Disbursement.payee_broker_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Disbursement[]
    side_effects: []
  - method: POST
    path: "/api/investors"
    description: "Register an investor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, investor_type]
    output: Investor
    side_effects: []
  - method: GET
    path: "/api/investors/{id}"
    description: "Get an investor"
    roles: [PlatformAdmin, PortfolioManager, ComplianceOfficer, FinanceOfficer, Investor]
    code: 200
    input: []
    output: Investor
    side_effects: []
  - method: POST
    path: "/api/insureds"
    description: "Create an insured individual"
    roles: [Broker, CaseManager]
    code: 201
    input: [full_name, date_of_birth, state_code, gender, smoker_status, ssn_last4]
    output: Insured
    side_effects: ["created_by_broker_id = caller X-User-ID when caller role is Broker, else null"]
  - method: GET
    path: "/api/insureds/{id}"
    description: "Get an insured (includes computed age_years at current clock)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: Insured
    side_effects: []
  - method: GET
    path: "/api/insureds/{id}/policies"
    description: "List policies of an insured (FK reverse: Policy.insured_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: POST
    path: "/api/policies"
    description: "Create a life insurance policy for an insured"
    roles: [Broker, CaseManager]
    code: 201
    input: [insured_id, carrier_name, policy_number, face_amount_cents, policy_type, issue_date, annual_premium_cents, "cash_value_cents?", "policy_loan_cents?"]
    output: Policy
    side_effects: ["If caller is Broker, insured must have been created by that broker (ERR_NOT_CASE_OWNER)"]
  - method: GET
    path: "/api/policies/{id}"
    description: "Get a policy (includes computed in_contestability at current clock)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: PATCH
    path: "/api/policies/{id}"
    description: "Amend policy financial fields; blocked while an active case locks it"
    roles: [Broker, CaseManager]
    code: 200
    input: ["face_amount_cents?", "annual_premium_cents?", "cash_value_cents?", "policy_loan_cents?"]
    output: Policy
    side_effects: ["ERR_POLICY_LOCKED_BY_ACTIVE_CASE when any case of this policy is in UNDERWRITING|MARKETED|IN_CLOSING|ACQUIRED", "Broker caller must own the insured chain (insured.created_by_broker_id == X-User-ID, else ERR_NOT_CASE_OWNER)"]
  - method: GET
    path: "/api/policies/{id}/cases"
    description: "List cases for a policy (FK reverse: PolicyCase.policy_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PolicyCase[]
    side_effects: []
  - method: POST
    path: "/api/licenses"
    description: "Create a state license window; closed-interval overlap with existing same-state rows rejected"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [state_code, license_number, effective_date, expiry_date]
    output: StateLicense
    side_effects: ["ERR_LICENSE_WINDOW_OVERLAP when new.effective_date <= existing.expiry_date for same state_code"]
  - method: GET
    path: "/api/licenses"
    description: "List licenses, optional state filter"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: StateLicense[]
    side_effects: []
  - method: GET
    path: "/api/licenses/{id}"
    description: "Get a license"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: StateLicense
    side_effects: []
  - method: POST
    path: "/api/licenses/{id}/suspend"
    description: "Suspend a license; cascades COMPLIANCE_HOLD to in-flight cases in that state"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StateLicense
    side_effects: ["PolicyCase hold cascade per state machine", "increments StateLicense.version by 1"]
  - method: POST
    path: "/api/licenses/{id}/reinstate"
    description: "Reinstate a suspended license; clears cascading holds"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StateLicense
    side_effects: ["PolicyCase hold cascade cleared", "increments StateLicense.version by 1"]

  # --- Cases / screening / underwriting ---
  - method: POST
    path: "/api/cases"
    description: "Create a PolicyCase for a policy (DRAFT); broker_id set from caller"
    roles: [Broker]
    code: 201
    input: [policy_id]
    output: PolicyCase
    side_effects: ["ERR_DUPLICATE_ACTIVE_CASE when the policy already has a non-terminal case"]
  - method: GET
    path: "/api/cases"
    description: "List cases with filters and pagination"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["status?", "broker_id?", "portfolio_id?", "accepted_offer_id?", "limit?", "offset?"]
    output: PolicyCase[]
    side_effects: []
  - method: GET
    path: "/api/cases/{id}"
    description: "Get a case"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: PolicyCase
    side_effects: []
  - method: POST
    path: "/api/cases/{id}/submit"
    description: "DRAFT -> SCREENING"
    roles: [Broker]
    code: 200
    input: []
    output: PolicyCase
    side_effects: ["increments PolicyCase.version by 1"]
  - method: POST
    path: "/api/cases/{id}/withdraw"
    description: "Withdraw a case from any pre-closing status"
    roles: [Broker]
    code: 200
    input: []
    output: PolicyCase
    side_effects: ["Offer/LE-report cascade per state machine", "ERR_CASE_HAS_ACTIVE_CLOSING when IN_CLOSING"]
  - method: POST
    path: "/api/cases/{id}/screenings"
    description: "Run eligibility screening; valid only while case in SCREENING (first run) or SCREEN_FAILED (rerun), else ERR_INVALID_STATE_TRANSITION"
    roles: [CaseManager]
    code: 201
    input: []
    output: EligibilityScreening
    side_effects: ["calc_eligibility_screening", "Case SCREENING -> UNDERWRITING | SCREEN_FAILED; rerun from SCREEN_FAILED re-enters SCREENING and resolves in the same request"]
  - method: GET
    path: "/api/cases/{id}/screenings"
    description: "List screening records for a case (FK reverse: EligibilityScreening.case_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityScreening[]
    side_effects: []
  - method: POST
    path: "/api/cases/{id}/le-reports"
    description: "Order a life expectancy report (ORDERED)"
    roles: [Underwriter]
    code: 201
    input: [underwriter_tier]
    output: LifeExpectancyReport
    side_effects: ["Allowed only while case in UNDERWRITING | MARKETED | ACQUIRED"]
  - method: GET
    path: "/api/cases/{id}/le-reports"
    description: "List LE reports for a case (FK reverse: LifeExpectancyReport.case_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: LifeExpectancyReport[]
    side_effects: []
  - method: POST
    path: "/api/le-reports/{id}/deliver"
    description: "Deliver an LE report with medical underwriting inputs"
    roles: [Underwriter]
    code: 200
    input: [base_le_months, impairment_debits]
    output: LifeExpectancyReport
    side_effects: ["calc_le_adjust_blend per-report adjust", "Same-tier DELIVERED siblings -> SUPERSEDED", "increments LifeExpectancyReport.version by 1"]
  - method: GET
    path: "/api/le-reports/{id}"
    description: "Get an LE report"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: LifeExpectancyReport
    side_effects: []
  - method: POST
    path: "/api/cases/{id}/uw-decision"
    description: "Underwriting decision; APPROVE computes blended LE and reserve price, moves to MARKETED"
    roles: [Underwriter]
    code: 200
    input: [decision]
    output: PolicyCase
    side_effects: ["calc_le_adjust_blend + calc_reserve_price on APPROVE", "marketed_at/marketing_deadline set"]
  - method: POST
    path: "/api/cases/{id}/reunderwrite"
    description: "MARKETED -> UNDERWRITING when all LE reports expired"
    roles: [Underwriter]
    code: 200
    input: []
    output: PolicyCase
    side_effects: ["Clears blended_le_months, reserve_price_cents, marketed_at, marketing_deadline"]
  - method: POST
    path: "/api/cases/{id}/deliver-disclosures"
    description: "Record delivery of the required disclosure packet to the seller; valid only while case in UNDERWRITING or MARKETED (else ERR_INVALID_STATE_TRANSITION)"
    roles: [CaseManager]
    code: 200
    input: [packet_types]
    output: PolicyCase
    side_effects: ["disclosures_delivered = true; disclosures_delivered_at = clock; packet_types must include COMPENSATION, ALTERNATIVES, TAX, PRIVACY, RESCISSION_RIGHTS (else ERR_INVALID_REQUEST)"]

  # --- Offers / negotiation ---
  - method: POST
    path: "/api/cases/{id}/offers"
    description: "Create a provider offer on a MARKETED case"
    roles: [Underwriter]
    code: 201
    input: [amount_cents, "expires_in_days?"]
    output: Offer
    side_effects: ["expires_at = clock + expires_in_days (default 10, max 30; >30 -> ERR_INVALID_REQUEST)"]
  - method: GET
    path: "/api/cases/{id}/offers"
    description: "List offers on a case (FK reverse: Offer.case_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []
  - method: GET
    path: "/api/offers/{id}"
    description: "Get an offer"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: POST
    path: "/api/offers/{id}/counter"
    description: "Broker counters a PENDING offer (OCC on offer version)"
    roles: [Broker]
    code: 200
    input: [counter_amount_cents, expected_offer_version]
    output: Offer
    side_effects: ["round_number += 1", "increments Offer.version by 1", "ERR_STALE_VERSION on version mismatch"]
  - method: POST
    path: "/api/offers/{id}/respond"
    description: "Underwriter responds to a COUNTERED offer: RE_OFFER | ACCEPT_COUNTER | REJECT"
    roles: [Underwriter]
    code: 200
    input: [action, "amount_cents?", "broker_commission_bps?"]
    output: Offer
    side_effects: ["RE_OFFER: round_number += 1, amount replaced; ACCEPT_COUNTER: acceptance cascade identical to offer accept (package + escrow created, siblings REJECTED, case IN_CLOSING); case.broker_commission_bps = payload broker_commission_bps (default 0)"]
  - method: POST
    path: "/api/offers/{id}/accept"
    description: "Broker accepts a PENDING offer"
    roles: [Broker]
    code: 200
    input: [broker_commission_bps]
    output: Offer
    side_effects: ["Case -> IN_CLOSING; case.broker_commission_bps = payload broker_commission_bps; sibling offers -> REJECTED; ClosingPackage ASSEMBLED created; EscrowAccount OPEN created; increments Offer.version by 1"]
  - method: POST
    path: "/api/offers/{id}/reject"
    description: "Broker rejects an offer"
    roles: [Broker]
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: POST
    path: "/api/offers/{id}/withdraw"
    description: "Underwriter withdraws an offer"
    roles: [Underwriter]
    code: 200
    input: []
    output: Offer
    side_effects: []

  # --- Closing packages / escrow / disbursements ---
  - method: GET
    path: "/api/cases/{id}/closing-package"
    description: "Get the closing package for a case (0 or 1) (FK reverse: ClosingPackage.case_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: ClosingPackage[]
    side_effects: []
  - method: GET
    path: "/api/closing-packages"
    description: "List closing packages, optional offer filter (FK reverse: ClosingPackage.offer_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["offer_id?", "limit?", "offset?"]
    output: ClosingPackage[]
    side_effects: []
  - method: GET
    path: "/api/closing-packages/{id}"
    description: "Get a closing package"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: []
  - method: POST
    path: "/api/closing-packages/{id}/send-for-signature"
    description: "ASSEMBLED -> OUT_FOR_SIGNATURE"
    roles: [CaseManager]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: []
  - method: POST
    path: "/api/closing-packages/{id}/record-signature"
    description: "Mark one document signed (doc_type must name a documents[] row; signing an already-signed row -> ERR_INVALID_REQUEST)"
    roles: [CaseManager]
    code: 200
    input: [doc_type]
    output: ClosingPackage
    side_effects: []
  - method: POST
    path: "/api/closing-packages/{id}/submit-review"
    description: "OUT_FOR_SIGNATURE -> COMPLIANCE_REVIEW; allowed with incomplete docs (completeness is enforced at approve)"
    roles: [CaseManager]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: []
  - method: POST
    path: "/api/closing-packages/{id}/return-deficiency"
    description: "COMPLIANCE_REVIEW -> OUT_FOR_SIGNATURE, resetting named docs"
    roles: [ComplianceOfficer]
    code: 200
    input: [deficient_doc_types, "deficiency_notes?"]
    output: ClosingPackage
    side_effects: ["Named docs reset signed=false"]
  - method: POST
    path: "/api/closing-packages/{id}/approve"
    description: "Compliance approval of the closing package"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: ["approved_by_user_id = caller"]
  - method: POST
    path: "/api/closing-packages/{id}/submit-carrier"
    description: "APPROVED -> CARRIER_SUBMITTED (requires escrow FUNDED)"
    roles: [CaseManager]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: []
  - method: POST
    path: "/api/closing-packages/{id}/confirm-ownership"
    description: "CARRIER_SUBMITTED -> OWNERSHIP_CONFIRMED (carrier confirmed change of ownership/beneficiary)"
    roles: [CaseManager]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: ["ownership_confirmed_at = clock"]
  - method: POST
    path: "/api/closing-packages/{id}/cancel"
    description: "Cancel a closing package pre-funding; case returns to MARKETED"
    roles: [CaseManager]
    code: 200
    input: []
    output: ClosingPackage
    side_effects: ["Case -> MARKETED; accepted Offer -> WITHDRAWN; EscrowAccount OPEN -> CLOSED"]
  - method: GET
    path: "/api/cases/{id}/escrow-account"
    description: "Get the escrow account for a case (0 or 1) (FK reverse: EscrowAccount.case_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: EscrowAccount[]
    side_effects: []
  - method: GET
    path: "/api/escrow-accounts/{id}"
    description: "Get an escrow account"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: []
  - method: POST
    path: "/api/escrow-accounts/{id}/fund"
    description: "Fund escrow at the exact expected amount"
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents]
    output: EscrowAccount
    side_effects: ["funded_at/releasable_at set", "Portfolio invested_capital/holding_count/nav_stale updated", "increments EscrowAccount.version by 1"]
  - method: POST
    path: "/api/escrow-accounts/{id}/release"
    description: "Release escrow after rescission window; runs the disbursement waterfall"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: ["calc_escrow_waterfall creates 4 Disbursements", "Case -> ACQUIRED", "ClosingPackage -> CLOSED", "increments EscrowAccount.version by 1"]
  - method: POST
    path: "/api/escrow-accounts/{id}/rescind"
    description: "Seller rescission inside the window; full refund, case RESCINDED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: ["calc_rescission_refund", "Case -> RESCINDED", "ClosingPackage -> CANCELLED", "Portfolio capital reversed"]
  - method: GET
    path: "/api/escrow-accounts/{id}/disbursements"
    description: "List disbursements of an escrow, ordered by created_at ASC (= waterfall bucket order) (FK reverse: Disbursement.escrow_id)"
    roles: [PlatformAdmin, Broker, Underwriter, CaseManager, ComplianceOfficer, FinanceOfficer, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Disbursement[]
    side_effects: []
  - method: POST
    path: "/api/disbursements/{id}/mark-paid"
    description: "Settle a disbursement"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Escrow auto-CLOSED when last PENDING settles"]

