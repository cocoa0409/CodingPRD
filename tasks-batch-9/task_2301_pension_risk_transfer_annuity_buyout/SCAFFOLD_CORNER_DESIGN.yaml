      - name: no_eligible_quote_pool_emptied_by_a_downgrade
        claim_type: triggerable
        grounds:
          - errors.ERR_NO_ELIGIBLE_QUOTE
        excluded_because:
          difficulty_instance: rating_downgrade_cascades_quote_tranche_and_empties_pool
          rationale: |
            That §1.8 instance already drives ERR_NO_ELIGIBLE_QUOTE by downgrading the
            only carrier below the rating floor, which pushes its SUBMITTED quote to
            INELIGIBLE and leaves the candidate pool empty on re-selection. Re-testing
            it here would only duplicate the weaker half of that scenario.

      - name: transfer_value_shortfall_on_an_in_kind_delivery
        claim_type: triggerable
        grounds:
          - errors.ERR_TRANSFER_VALUE_SHORTFALL
        excluded_because:
          difficulty_instance: settled_tranche_state_beats_transfer_shortfall_fiscal
          rationale: |
            ERR_TRANSFER_VALUE_SHORTFALL is triggered there by an in-kind delivery whose
            credited value, net of haircut and custody fees, falls below the locked
            premium, and that instance additionally pins the precedence between the
            tranche-state check and the shortfall check.

  - section: rbac
    instances:
      - name: each_exclusive_operation_rejects_the_other_roles_before_any_state_check
        claim_type: exclusive_operations
        grounds:
          - roles.PlanSponsor
          - roles.PlanFiduciary
          - roles.Actuary
          - roles.PlanAdministrator
          - roles.Regulator
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          Role authorization sits at priority 2, ahead of every state and body check,
          so the sponsor's attempt at the regulator's filing review returns 403 rather
          than the 409 the plan's ONGOING status would otherwise earn, and the TPA's
          attempt at the shared valuation update is a 403 even though its body is
          perfect. Each refused call is then repeated by the owning role and succeeds.
        test_recipe:
          setup:
            - "one PensionPlan created by the sponsor at clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
