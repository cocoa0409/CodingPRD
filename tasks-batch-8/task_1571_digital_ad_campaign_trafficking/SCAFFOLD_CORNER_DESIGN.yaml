  # ============================================================= calculations
  - section: calculations
    instances:
      - name: discrepancy_exactly_at_tolerance_stays_agency
        claim_type: correct_result
        grounds: [calculations.billing_impressions]
        distinguishing_aspect: "Tolerance boundary: discrepancy +0.10 exactly (tp 44000 vs agency 40000) is NOT > 0.10, so LOWER_OF keeps billing at the agency figure 40000."
        test_recipe:
          setup: ["LOWER_OF IO; LIVE line item with one POSTED snapshot Aug5 40000/200; reconciliation [2026-08-01, 2026-08-10) tp 44000"]
