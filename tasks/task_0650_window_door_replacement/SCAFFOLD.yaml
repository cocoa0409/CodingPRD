# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Consultation
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: MEASURED
        trigger: "POST /projects/{id}/consultations/{cid}/complete-measure"
        actor: SalesConsultant
        preconditions:
          - "consultation.status == BOOKED"
          - "total_opening_count >= 1 (at least one Opening was added)"
        side_effects:
          - "consultation.status -> MEASURED"
          - "recompute parent Project.status via compound rule"
        note: "An empty measure (zero openings) cannot be marked MEASURED."
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /projects/{id}/consultations/{cid}/cancel"
        actor: SalesConsultant
        preconditions:
          - "consultation.status == BOOKED"
        side_effects:
          - "consultation.status -> CANCELLED"
          - "recompute parent Project.status"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /projects/{id}/quotes/{qid}/send"
        actor: SalesConsultant
        preconditions:
          - "quote.status == DRAFT"
          - "linked Consultation.status == MEASURED"
        side_effects:
          - "compute openings_subtotal_cents, discount_tier, estimate_total_cents (calculation quote_estimate_total)"
          - "compute provisional_rebate_cents (calculation rebate_25c, estimate variant)"
          - "set expires_at = current_clock + 30 logical days"
          - "quote.status -> SENT"
          - "recompute parent Project.status -> QUOTING"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /projects/{id}/quotes/{qid}/accept"
        actor: Homeowner
        preconditions:
          - "quote.status == SENT"
          - "current_clock < quote.expires_at"
          - "request expected_quote_version matches quote.version (OCC)"
          - "no other Quote on the same Project is already ACCEPTED"
        side_effects:
          - "increments Quote.version by 1"
          - "quote.status -> ACCEPTED"
          - "set Project.accepted_quote_id = quote.id; recompute Project.status -> CONTRACTED (cascade hop 1)"
          - "auto-create ManufactureOrder {status: QUEUED, quote_id, project_id}; compute lead_time_days and ready_at (cascade hop 2)"
          - "set every other SENT Quote on this Project to SUPERSEDED (cascade hop 3)"
          - "settle any PENDING Referral whose referred_project_id == this Project: Referral.status -> SETTLED, compute reward_amount_cents, bump referrer Homeowner.referral_credit_cents (cascade hop 4)"
        note: "Branch point: ACCEPTED forks the production cascade; REJECTED loops back to a new DRAFT revision."
      - from: SENT
        to: REJECTED
        trigger: "POST /projects/{id}/quotes/{qid}/reject"
        actor: Homeowner
        preconditions:
          - "quote.status == SENT"
        side_effects:
          - "quote.status -> REJECTED"
          - "DECLINE any SUBMITTED FinancingApplication on this quote (cascade): FinancingApplication.status -> CANCELLED"
          - "recompute parent Project.status (back to QUOTING if other quotes exist, else CONSULTING)"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /projects/{id}/quotes (revision: new DRAFT off a rejected quote via supersede_quote_id)"
        actor: SalesConsultant
        preconditions:
          - "prior quote.status == REJECTED"
        side_effects:
          - "creates a NEW Quote row in DRAFT (revision loop); prior REJECTED quote unchanged"
        note: "Cyclic revision: REJECTED -> (new) DRAFT lets sales re-quote without losing history."
      - from: SENT
        to: EXPIRED
        trigger: "system: current_clock >= quote.expires_at, evaluated on read or on POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "quote.status == SENT"
          - "current_clock >= quote.expires_at"
        side_effects:
          - "quote.status -> EXPIRED"
          - "recompute parent Project.status"
      - from: SENT
        to: SUPERSEDED
        trigger: "system: another Quote on the same Project is ACCEPTED"
        actor: system
        preconditions:
          - "quote.status == SENT"
          - "a sibling Quote on the same Project just transitioned to ACCEPTED"
        side_effects:
          - "quote.status -> SUPERSEDED"

  - entity: FinancingApplication
    initial_state: SUBMITTED
    terminal_states: [DECLINED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /projects/{id}/quotes/{qid}/financing/{fid}/decide (decision: APPROVE)"
        actor: OperationsCoordinator
        preconditions:
          - "financing.status == SUBMITTED"
          - "requested_amount_cents <= linked Quote.estimate_total_cents"
        side_effects:
          - "compute approved_apr_bps (keyed on Homeowner.agi_band x term_months)"
          - "compute monthly_payment_cents (calculation financing_monthly_payment)"
          - "financing.status -> APPROVED"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /projects/{id}/quotes/{qid}/financing/{fid}/decide (decision: DECLINE)"
        actor: OperationsCoordinator
        preconditions:
          - "financing.status == SUBMITTED"
        side_effects:
          - "financing.status -> DECLINED"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system: linked Quote transitions to REJECTED"
        actor: system
        preconditions:
          - "financing.status == SUBMITTED"
        side_effects:
          - "financing.status -> CANCELLED"

  - entity: ManufactureOrder
    initial_state: QUEUED
    terminal_states: [CANCELLED]
    transitions:
      - from: QUEUED
        to: IN_BUILD
        trigger: "POST /projects/{id}/manufacture/{mid}/start-build"
        actor: OperationsCoordinator
        preconditions:
          - "order.status == QUEUED"
          - "parent Project.status == CONTRACTED"
        side_effects:
          - "order.status -> IN_BUILD"
          - "recompute Project.status -> IN_PRODUCTION"
      - from: IN_BUILD
        to: READY
        trigger: "POST /projects/{id}/manufacture/{mid}/mark-ready"
        actor: OperationsCoordinator
        preconditions:
          - "order.status == IN_BUILD"
          - "current_clock >= order.ready_at (lead time elapsed)"
        side_effects:
          - "order.status -> READY"
      - from: QUEUED
        to: CANCELLED
        trigger: "system: parent Project cancelled"
        actor: system
        preconditions:
          - "order.status IN {QUEUED, IN_BUILD}"
        side_effects:
          - "order.status -> CANCELLED"
      - from: IN_BUILD
        to: CANCELLED
        trigger: "system: parent Project cancelled"
        actor: system
        preconditions:
          - "order.status IN {QUEUED, IN_BUILD}"
        side_effects:
          - "order.status -> CANCELLED"

  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /projects/{id}/install-jobs/{jid}/depart"
        actor: OperationsCoordinator
        preconditions:
          - "job.status == SCHEDULED"
          - "linked ManufactureOrder.status == READY (cross-entity: cannot install before goods are built)"
          - "current_clock >= job.window_start"
        side_effects:
          - "job.status -> EN_ROUTE"
          - "recompute Project.status -> INSTALLING"
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /projects/{id}/install-jobs/{jid}/complete"
        actor: OperationsCoordinator
        preconditions:
          - "job.status == EN_ROUTE"
          - "Project has an APPROVED Permit (cross-entity guard)"
        side_effects:
          - "job.status -> COMPLETED"
          - "recompute Project.status -> INSPECTION"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /projects/{id}/install-jobs/{jid}/cancel"
        actor: OperationsCoordinator
        preconditions:
          - "job.status == SCHEDULED"
        side_effects:
          - "job.status -> CANCELLED"
          - "release the crew-day capacity this job consumed"

  - entity: Permit
    initial_state: FILED
    terminal_states: [INSPECTION_PASSED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /projects/{id}/permits/{pid}/approve"
        actor: OperationsCoordinator
        preconditions:
          - "permit.status == FILED"
        side_effects:
          - "permit.status -> APPROVED"
          - "set inspection_due_at = current_clock + jurisdiction inspection_window_days"
      - from: APPROVED
        to: INSPECTION_PASSED
        trigger: "POST /projects/{id}/permits/{pid}/record-inspection (result: PASS)"
        actor: OperationsCoordinator
        preconditions:
          - "permit.status == APPROVED"
          - "Project has a COMPLETED InstallJob (cross-entity: inspection only after install)"
        side_effects:
          - "permit.status -> INSPECTION_PASSED"
          - "recompute Project.status -> COMPLETED (cascade: enables Referral creation & ServiceTickets)"
      - from: APPROVED
        to: INSPECTION_FAILED
        trigger: "POST /projects/{id}/permits/{pid}/record-inspection (result: FAIL)"
        actor: OperationsCoordinator
        preconditions:
          - "permit.status == APPROVED"
          - "Project has a COMPLETED InstallJob"
        side_effects:
          - "permit.status -> INSPECTION_FAILED"
      - from: INSPECTION_FAILED
        to: APPROVED
        trigger: "POST /projects/{id}/permits/{pid}/approve (re-approve for re-inspection)"
        actor: OperationsCoordinator
        preconditions:
          - "permit.status == INSPECTION_FAILED"
        side_effects:
          - "permit.status -> APPROVED"
          - "reset inspection_due_at = current_clock + jurisdiction inspection_window_days"
        note: "Cyclic: a failed inspection loops back to APPROVED for a re-inspection."

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /projects/{id}/service-tickets/{sid}/dispatch"
        actor: ServiceTech
        preconditions:
          - "ticket.status == OPEN"
        side_effects:
          - "ticket.status -> DISPATCHED"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "POST /projects/{id}/service-tickets/{sid}/resolve"
        actor: ServiceTech
        preconditions:
          - "ticket.status == DISPATCHED"
        side_effects:
          - "compute charge_cents (calculation service_charge)"
          - "ticket.status -> RESOLVED"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /projects/{id}/service-tickets/{sid}/close"
        actor: ServiceTech
        preconditions:
          - "ticket.status == RESOLVED"
        side_effects:
          - "ticket.status -> CLOSED"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /projects/{id}/service-tickets/{sid}/reopen"
        actor: Homeowner
        preconditions:
          - "ticket.status == RESOLVED"
        side_effects:
          - "ticket.status -> REOPENED"
        note: "Cyclic: homeowner can reopen if the fix did not hold."
      - from: REOPENED
        to: DISPATCHED
        trigger: "POST /projects/{id}/service-tickets/{sid}/dispatch"
        actor: ServiceTech
        preconditions:
          - "ticket.status == REOPENED"
        side_effects:
          - "ticket.status -> DISPATCHED"

  - entity: Referral
    initial_state: PENDING
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "system: referred Project reaches CONTRACTED (a quote on it is ACCEPTED)"
        actor: system
        preconditions:
          - "referral.status == PENDING"
          - "referred Project.status == CONTRACTED"
        side_effects:
          - "compute reward_amount_cents (calculation referral_reward)"
          - "referral.status -> SETTLED"
          - "recompute referrer Homeowner.referral_credit_cents"
      - from: PENDING
        to: VOID
        trigger: "system: referred Project is CANCELLED before reaching CONTRACTED"
        actor: system
        preconditions:
          - "referral.status == PENDING"
          - "referred Project.status == CANCELLED"
        side_effects:
          - "referral.status -> VOID"

  - entity: Project
    initial_state: LEAD
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: LEAD
        to: CONSULTING
        trigger: "system: first Consultation created on the project"
        actor: system
        preconditions:
          - "project.status == LEAD"
        side_effects:
          - "project.status -> CONSULTING (compound: derived from child stages)"
      - from: CONSULTING
        to: QUOTING
        trigger: "system: first Quote reaches SENT"
        actor: system
        preconditions: []
        side_effects:
          - "project.status -> QUOTING"
      - from: QUOTING
        to: CONTRACTED
        trigger: "system: a Quote is ACCEPTED (see Quote.ACCEPTED side_effects)"
        actor: system
        preconditions: []
        side_effects:
          - "project.status -> CONTRACTED"
      - from: CONTRACTED
        to: IN_PRODUCTION
        trigger: "system: ManufactureOrder reaches IN_BUILD"
        actor: system
        preconditions: []
        side_effects:
          - "project.status -> IN_PRODUCTION"
      - from: IN_PRODUCTION
        to: INSTALLING
        trigger: "system: an InstallJob reaches EN_ROUTE"
        actor: system
        preconditions: []
        side_effects:
          - "project.status -> INSTALLING"
      - from: INSTALLING
        to: INSPECTION
        trigger: "system: an InstallJob reaches COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "project.status -> INSPECTION"
      - from: INSPECTION
        to: COMPLETED
        trigger: "system: Permit reaches INSPECTION_PASSED"
        actor: system
        preconditions: []
        side_effects:
          - "project.status -> COMPLETED"
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: OperationsCoordinator
        preconditions:
          - "project.status IN {LEAD, CONSULTING, QUOTING, CONTRACTED, IN_PRODUCTION}"
          - "no InstallJob has reached COMPLETED"
        side_effects:
          - "project.status -> CANCELLED (cascade hop 1)"
          - "CANCEL any non-terminal ManufactureOrder {QUEUED, IN_BUILD} -> CANCELLED (cascade hop 2)"
          - "CANCEL any SCHEDULED InstallJob -> CANCELLED, releasing its crew-day capacity (cascade hop 3)"
          - "VOID any PENDING Referral whose referred_project_id == this Project (cascade hop 4)"
        note: "Conditional cascade only touches non-terminal children."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-version
    parent_entity: Quote
    write_endpoint: "POST /projects/{id}/quotes/{qid}/accept"
    occ_field: "expected_quote_version"
    description: |
      Accepting a Quote whose version has advanced since the client last
      observed it is rejected. A SENT quote's version is bumped by any prior
      mutation (a re-send refresh, a financing decision recorded against it,
      or its own acceptance); a client carrying a stale expected_quote_version
      is observing an out-of-date quote and the accept is refused on the
      stale-version check rather than acting on outdated terms.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: opening_unit_price
    trigger: "on POST /projects/{id}/consultations/{cid}/openings (opening create) and on glass_package change"
    algorithm: tiered_pricing
    formula: |
      area_sqft = (width_in * height_in) / 144        # exact, not rounded yet
      base_rate_cents_per_sqft = {
        DOUBLE_HUNG: 4200, CASEMENT: 4800, PICTURE: 3600,
        SLIDING_PATIO_DOOR: 5200, ENTRY_DOOR: 6000
      }[product_type]
      glass_uplift_cents_per_sqft = { STANDARD: 0, LOWE_DUAL: 900, LOWE_TRIPLE: 1800 }[glass_package]
      raw_cents = area_sqft * (base_rate_cents_per_sqft + glass_uplift_cents_per_sqft)
      unit_price_cents = round_half_up(raw_cents)      # round ONCE, per opening, to whole cents
      u_factor = { STANDARD: 0.40, LOWE_DUAL: 0.27, LOWE_TRIPLE: 0.20 }[glass_package]
      energy_qualified = (u_factor <= 0.30)
    input_set: "single Opening row being created/updated"
    constants:
      DOUBLE_HUNG_RATE: 4200
      CASEMENT_RATE: 4800
      PICTURE_RATE: 3600
      SLIDING_PATIO_DOOR_RATE: 5200
      ENTRY_DOOR_RATE: 6000
      LOWE_DUAL_UPLIFT: 900
      LOWE_TRIPLE_UPLIFT: 1800
      ENERGY_STAR_U_MAX: 0.30
    precision: "round_half_up to whole cents, exactly once per opening"

  - name: quote_estimate_total
    trigger: "on POST /projects/{id}/quotes/{qid}/send (Quote DRAFT->SENT side_effects)"
    algorithm: tiered_pricing
    formula: |
      # Mode (b)/(c) combinatorial: subtotal is a SUM of per-opening prices already
      # rounded once (opening_unit_price). The discount keyed on the total tier feeds
      # back into the grand total, so evaluation order is pinned:
      #   1. openings_subtotal_cents = sum over openings of unit_price_cents  (sum of already-rounded values)
      #   2. discount_tier from openings_subtotal_cents:
      #        subtotal < 2_000_000           -> NONE  (0%)
      #        2_000_000 <= subtotal < 4_000_000 -> TIER1 (5%)
      #        subtotal >= 4_000_000          -> TIER2 (10%)
      #   3. discount_cents = round_half_up(openings_subtotal_cents * tier_pct)
      #   4. install_fee_cents = 35000 + 1500 * total_opening_count   (flat + per-opening labor)
      #   5. estimate_total_cents = openings_subtotal_cents - discount_cents + install_fee_cents
      # ROUNDING ORDER PINNED: per-opening prices are each rounded in opening_unit_price,
      # then summed (NOT summed-then-rounded). discount rounded once on the subtotal.
    input_set: "all Openings on the quote's MEASURED consultation"
    constants:
      TIER1_THRESHOLD_CENTS: 2000000
      TIER2_THRESHOLD_CENTS: 4000000
      TIER1_PCT: 0.05
      TIER2_PCT: 0.10
      INSTALL_FLAT_CENTS: 35000
      INSTALL_PER_OPENING_CENTS: 1500
    precision: "discount rounded once (round_half_up); all other terms are integer cents"
    variants:
      - name: estimate_at_send
        when: "Quote DRAFT->SENT"
        difference: "uses the live opening prices and total_opening_count at SEND time; stored as estimate_total_cents (provisional)."

  - name: rebate_25c
    trigger: "estimate variant on Quote SENT; final variant on Quote ACCEPTED"
    algorithm: threshold
    formula: |
      # 25C Energy Efficient Home Improvement Credit: 30% of the energy-qualified
      # portion of the project, capped. Cap is the lesser of an annual exterior-
      # window/door cap and a per-door sub-cap.
      qualified_subtotal_cents = sum over openings WHERE energy_qualified == true of unit_price_cents
      raw_credit_cents = round_half_up(qualified_subtotal_cents * 0.30)
      WINDOW_ANNUAL_CAP_CENTS = 60000     # $600 aggregate exterior windows
      DOOR_PER_UNIT_CAP_CENTS = 25000     # $250 per exterior door, max $500 total doors
      DOOR_TOTAL_CAP_CENTS    = 50000
      # doors are ENTRY_DOOR / SLIDING_PATIO_DOOR; windows are the rest
      window_qualified = sum unit_price_cents WHERE energy_qualified AND product_type IN {DOUBLE_HUNG,CASEMENT,PICTURE}
      door_qualified   = sum unit_price_cents WHERE energy_qualified AND product_type IN {ENTRY_DOOR,SLIDING_PATIO_DOOR}
      window_credit = min( round_half_up(window_qualified * 0.30), WINDOW_ANNUAL_CAP_CENTS )
      door_credit_raw = round_half_up(door_qualified * 0.30)
      door_credit = min( door_credit_raw, DOOR_TOTAL_CAP_CENTS )
      rebate_cents = window_credit + door_credit
    input_set: "energy-qualified Openings on the quote's consultation"
    constants:
      CREDIT_RATE: 0.30
      WINDOW_ANNUAL_CAP_CENTS: 60000
      DOOR_PER_UNIT_CAP_CENTS: 25000
      DOOR_TOTAL_CAP_CENTS: 50000
      ENERGY_STAR_U_MAX: 0.30
    precision: "round_half_up to whole cents on each 30% multiply, before applying caps"
    variants:
      - name: provisional_estimate
        when: "Quote DRAFT->SENT; stored as Quote.provisional_rebate_cents"
        difference: "computed over ALL energy_qualified openings present at SEND time, regardless of AGI band; an optimistic ceiling shown to the homeowner."
      - name: final_confirmed
        when: "Quote SENT->ACCEPTED"
        difference: "if Homeowner.agi_band == HIGH the credit is zeroed (phase-out), and only openings whose energy_qualified is still true at ACCEPT time count; result is the binding figure. For LOW/STANDARD bands equals provisional unless openings changed."

  - name: lead_time_days
    trigger: "on ManufactureOrder auto-create (Quote ACCEPTED cascade hop 2)"
    algorithm: threshold
    formula: |
      # >=3 inputs with non-linear interaction (max selection + conditional surcharge):
      base_by_type_days = {
        DOUBLE_HUNG: 28, CASEMENT: 35, PICTURE: 21,
        SLIDING_PATIO_DOOR: 49, ENTRY_DOOR: 42
      }
      slowest = max over openings of base_by_type_days[opening.product_type]
      triple_glaze_present = any opening has glass_package == LOWE_TRIPLE
      rush_surcharge_days = 14 if triple_glaze_present else 0
      lead_time_days = slowest + rush_surcharge_days
      ready_at = manufacture_order.created_clock + lead_time_days (logical days)
    input_set: "all Openings on the accepted quote's consultation"
    constants:
      DOUBLE_HUNG_DAYS: 28
      CASEMENT_DAYS: 35
      PICTURE_DAYS: 21
      SLIDING_PATIO_DOOR_DAYS: 49
      ENTRY_DOOR_DAYS: 42
      TRIPLE_GLAZE_SURCHARGE_DAYS: 14
    precision: "integer days"

  - name: financing_monthly_payment
    trigger: "on FinancingApplication SUBMITTED->APPROVED"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs, non-linear (APR table lookup + amortization with nested rounding):
      apr_bps = APR_TABLE[Homeowner.agi_band][term_months]   # basis points
      APR_TABLE = {
        LOW:      {12: 0,    24: 0,    36: 599,  60: 899},
        STANDARD: {12: 0,    24: 499,  36: 899,  60: 1299},
        HIGH:     {12: 299,  24: 799,  36: 1199, 60: 1599}
      }
      P = requested_amount_cents
      if apr_bps == 0:
        monthly_payment_cents = ceil(P / term_months)        # 0% promo, ceil so sum >= P
      else:
        r = (apr_bps / 10000) / 12                            # monthly rate, full precision
        factor = (r * (1+r)**term_months) / ((1+r)**term_months - 1)
        monthly_payment_cents = round_half_up(P * factor)     # round ONCE at the end
    input_set: "the single FinancingApplication being approved"
    constants:
      APR_TABLE: "see formula (agi_band x term_months -> bps)"
    precision: "0% promo uses ceil; interest-bearing uses round_half_up once at the end"

  - name: service_charge
    trigger: "on ServiceTicket DISPATCHED->RESOLVED"
    algorithm: threshold
    formula: |
      if ticket.category == WARRANTY:
        charge_cents = 0
      else:  # BILLABLE
        base_trip_cents = 9500
        # surcharge if resolved past the warranty window: 2 logical years from Project COMPLETED
        project_completed_at = Project.updated_at at the time Project reached COMPLETED
        out_of_warranty = current_clock >= project_completed_at + 730 logical days
        charge_cents = base_trip_cents + (5000 if out_of_warranty else 0)
    input_set: "the single ServiceTicket being resolved"
    constants:
      BASE_TRIP_CENTS: 9500
      OUT_OF_WARRANTY_SURCHARGE_CENTS: 5000
      WARRANTY_WINDOW_DAYS: 730
    precision: "integer cents"

  - name: referral_reward
    trigger: "on Referral PENDING->SETTLED (referred Project reaches CONTRACTED)"
    algorithm: threshold
    formula: |
      # reward is 2% of the referred project's accepted quote estimate, capped:
      accepted = referred Project.accepted_quote_id -> Quote
      raw_reward_cents = round_half_up(accepted.estimate_total_cents * 0.02)
      REWARD_CAP_CENTS = 50000     # $500 cap
      reward_amount_cents = min(raw_reward_cents, REWARD_CAP_CENTS)
    input_set: "the referred Project's accepted Quote"
    constants:
      REWARD_RATE: 0.02
      REWARD_CAP_CENTS: 50000
    precision: "round_half_up once before applying cap"

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires headers"
  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right (project, then nested child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all parameterized paths"
  - priority: 4
    category: auth
    check: "an entity_backed Homeowner acting on a Project must be the Project.homeowner_id owner"
    error_id: ERR_NOT_PROJECT_OWNER
    http_status: 403
    applies_to: "Homeowner actions: quote accept/reject, service-ticket reopen"
  - priority: 5
    category: existence
    check: "referenced FK bodies resolve (homeowner_id, consultation_id, crew_id, opening_id, referrer/referred project ids exist)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all create endpoints with FK body fields"
  - priority: 6
    category: state
    check: "target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_quote_version equals current Quote.version on quote accept"
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412
    applies_to: "POST /projects/{id}/quotes/{qid}/accept"
  - priority: 8
    category: business_constraint
    check: "a quote may be SENT only if its linked Consultation.status == MEASURED"
    error_id: ERR_CONSULTATION_NOT_MEASURED
    http_status: 409
    applies_to: "POST /projects/{id}/quotes/{qid}/send"
  - priority: 9
    category: business_constraint
    check: "a MEASURED consultation transition requires total_opening_count >= 1 (no empty measure)"
    error_id: ERR_NO_OPENINGS
    http_status: 422
    applies_to: "POST /projects/{id}/consultations/{cid}/complete-measure"
  - priority: 10
    category: business_temporal
    check: "quote accept requires current_clock < quote.expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /projects/{id}/quotes/{qid}/accept"
  - priority: 11
    category: business_constraint
    check: "at most one ACCEPTED Quote per Project; accepting a second is rejected"
    error_id: ERR_PROJECT_ALREADY_CONTRACTED
    http_status: 409
    applies_to: "POST /projects/{id}/quotes/{qid}/accept"
  - priority: 12
    category: business_safety
    check: "an InstallJob may complete only if the Project has an APPROVED (or later) Permit"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs/{jid}/complete"
  - priority: 13
    category: business_constraint
    check: "an InstallJob may depart only if its linked ManufactureOrder.status == READY"
    error_id: ERR_GOODS_NOT_READY
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs/{jid}/depart"
  - priority: 14
    category: business_constraint
    check: "an assigned Crew's home_jurisdiction must equal the Project.jurisdiction_code"
    error_id: ERR_CREW_JURISDICTION_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/install-jobs (create)"
  - priority: 15
    category: business_temporal
    check: "an install window [window_start, window_end) must not overlap another non-terminal InstallJob window on the SAME crew; abutment (end == start) is allowed (half-open)"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs (create)"
  - priority: 16
    category: business_constraint
    check: "the sum of opening_count over all non-terminal InstallJobs on a crew that share any calendar day with the new window must not exceed crew.daily_capacity_openings; equality is allowed (<=)"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /projects/{id}/install-jobs (create)"
  - priority: 17
    category: business_fiscal
    check: "FinancingApplication.requested_amount_cents must be <= linked Quote.estimate_total_cents at approval"
    error_id: ERR_FINANCING_OVER_QUOTE
    http_status: 422
    applies_to: "POST /projects/{id}/quotes/{qid}/financing/{fid}/decide"
  - priority: 18
    category: business_referential
    check: "a Referral requires referrer Project.status == COMPLETED; referrer and referred must be different projects"
    error_id: ERR_REFERRER_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /referrals"
  - priority: 19
    category: business_referential
    check: "a ServiceTicket may be created only on a COMPLETED Project, and opening_id must belong to that Project"
    error_id: ERR_PROJECT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /projects/{id}/service-tickets"
  - priority: 20
    category: business_constraint
    check: "request body field types/enums valid and required fields present (e.g., width_in > 0, term_months in {12,24,36,60})"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create endpoints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Homeowner ----
  - method: POST
    path: "/homeowners"
    description: "Register a homeowner."
    roles: [SalesConsultant, PlatformAdmin]
    code: 201
    input: [full_name, email, property_zip, "agi_band?"]
    output: Homeowner
    side_effects: []
  - method: GET
    path: "/homeowners/{id}"
    description: "Fetch a homeowner (includes computed referral_credit_cents)."
    roles: [SalesConsultant, OperationsCoordinator, ServiceTech, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Homeowner
    side_effects: []

  # ---- Project (aggregate root) ----
  - method: POST
    path: "/projects"
    description: "Create a project for a homeowner; derives jurisdiction_code from property_zip; status LEAD."
    roles: [SalesConsultant, PlatformAdmin]
    code: 201
    input: [homeowner_id]
    output: Project
    side_effects: ["derive jurisdiction_code", "status=LEAD"]
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project; status is the live compound aggregate; evaluates quote auto-expiry on read."
    roles: [SalesConsultant, OperationsCoordinator, ServiceTech, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["lazily EXPIRE any SENT quote past expires_at"]
  - method: GET
    path: "/projects"
    description: "List projects, filterable by homeowner_id or accepted_quote_id (reverse-reachability for Project.homeowner_id and Project.accepted_quote_id); paginated."
    roles: [SalesConsultant, OperationsCoordinator, ServiceTech, PlatformAdmin]
    code: 200
    input: ["homeowner_id?", "accepted_quote_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project; cascades to manufacture, install, referrals."
    roles: [OperationsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: ["status=CANCELLED", "cancel non-terminal ManufactureOrder", "cancel SCHEDULED InstallJob + release capacity", "VOID pending Referral"]

  # ---- Consultation ----
  - method: POST
    path: "/projects/{id}/consultations"
    description: "Book an in-home consultation/measure visit on a project."
    roles: [SalesConsultant, PlatformAdmin]
    code: 201
    input: [project_id, consultant_id, scheduled_at]
    output: Consultation
    side_effects: ["status=BOOKED", "if first consultation: Project.status LEAD->CONSULTING"]
  - method: GET
    path: "/projects/{id}/consultations"
    description: "List consultations on a project (reverse-reachability for Consultation.project_id)."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Consultation[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/consultations/{cid}"
    description: "Fetch a single consultation."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Consultation
    side_effects: []
  - method: POST
    path: "/projects/{id}/consultations/{cid}/complete-measure"
    description: "Mark the measure visit complete (BOOKED->MEASURED); requires >=1 opening."
    roles: [SalesConsultant]
    code: 200
    input: []
    output: Consultation
    side_effects: ["status=MEASURED"]
  - method: POST
    path: "/projects/{id}/consultations/{cid}/cancel"
    description: "Cancel a booked consultation."
    roles: [SalesConsultant]
    code: 200
    input: []
    output: Consultation
    side_effects: ["status=CANCELLED"]

  # ---- Opening ----
  - method: POST
    path: "/projects/{id}/consultations/{cid}/openings"
    description: "Add a configured opening to a consultation; computes u_factor, energy_qualified, unit_price_cents."
    roles: [SalesConsultant]
    code: 201
    input: [consultation_id, product_type, width_in, height_in, glass_package]
    output: Opening
    side_effects: ["compute opening_unit_price", "bump Consultation.total_opening_count"]
  - method: GET
    path: "/projects/{id}/consultations/{cid}/openings"
    description: "List openings on a consultation (reverse-reachability for Opening.consultation_id)."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Opening[]
    side_effects: []
  - method: GET
    path: "/openings/{id}"
    description: "Fetch a single opening."
    roles: [SalesConsultant, OperationsCoordinator, ServiceTech, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Opening
    side_effects: []
  - method: PATCH
    path: "/openings/{id}"
    description: "Update an opening's glass_package; recomputes u_factor, energy_qualified, unit_price_cents."
    roles: [SalesConsultant]
    code: 200
    input: [glass_package]
    output: Opening
    side_effects: ["recompute opening_unit_price"]

  # ---- Quote ----
  - method: POST
    path: "/projects/{id}/quotes"
    description: "Create a DRAFT quote for a MEASURED consultation; optional supersede_quote_id for a REJECTED-quote revision."
    roles: [SalesConsultant]
    code: 201
    input: [project_id, consultation_id, "supersede_quote_id?"]
    output: Quote
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/projects/{id}/quotes"
    description: "List quotes on a project (reverse-reachability for Quote.project_id); lazily expires SENT quotes."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Quote[]
    side_effects: ["lazily EXPIRE SENT quotes past expires_at"]
  - method: GET
    path: "/projects/{id}/quotes/{qid}"
    description: "Fetch a single quote; lazily expires if past expires_at."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazily EXPIRE if past expires_at"]
  - method: POST
    path: "/projects/{id}/quotes/{qid}/send"
    description: "Send a DRAFT quote (DRAFT->SENT); computes estimate_total_cents, provisional_rebate_cents, expires_at."
    roles: [SalesConsultant]
    code: 200
    input: []
    output: Quote
    side_effects: ["compute quote_estimate_total", "compute rebate_25c estimate", "set expires_at", "status=SENT", "Project.status->QUOTING"]
  - method: POST
    path: "/projects/{id}/quotes/{qid}/accept"
    description: "Accept a SENT quote (OCC on version); cascades manufacture create, supersede siblings, settle referral."
    roles: [Homeowner]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["increments Quote.version by 1", "status=ACCEPTED", "Project.accepted_quote_id set, status->CONTRACTED", "auto-create ManufactureOrder", "SUPERSEDE sibling SENT quotes", "SETTLE pending Referral on this project"]
  - method: POST
    path: "/projects/{id}/quotes/{qid}/reject"
    description: "Reject a SENT quote; cancels its SUBMITTED financing."
    roles: [Homeowner]
    code: 200
    input: []
    output: Quote
    side_effects: ["status=REJECTED", "CANCEL SUBMITTED FinancingApplication", "recompute Project.status"]

  # ---- Financing ----
  - method: POST
    path: "/projects/{id}/quotes/{qid}/financing"
    description: "Submit a financing application against a quote."
    roles: [Homeowner, SalesConsultant]
    code: 201
    input: [quote_id, requested_amount_cents, term_months]
    output: FinancingApplication
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/projects/{id}/quotes/{qid}/financing"
    description: "List financing applications on a quote (reverse-reachability for FinancingApplication.quote_id)."
    roles: [Homeowner, SalesConsultant, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/quotes/{qid}/financing/{fid}/decide"
    description: "Approve or decline a financing application; on APPROVE computes APR and monthly payment."
    roles: [OperationsCoordinator]
    code: 200
    input: [decision]
    output: FinancingApplication
    side_effects: ["compute approved_apr_bps + financing_monthly_payment on APPROVE", "status=APPROVED|DECLINED"]

  # ---- Manufacture ----
  - method: GET
    path: "/projects/{id}/manufacture"
    description: "List manufacture orders on a project (reverse-reachability for ManufactureOrder.project_id and .quote_id)."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: ManufactureOrder[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/manufacture/{mid}"
    description: "Fetch a single manufacture order (includes lead_time_days, ready_at)."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: []
  - method: POST
    path: "/projects/{id}/manufacture/{mid}/start-build"
    description: "Move a QUEUED order to IN_BUILD; Project->IN_PRODUCTION."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: ["status=IN_BUILD", "Project.status->IN_PRODUCTION"]
  - method: POST
    path: "/projects/{id}/manufacture/{mid}/mark-ready"
    description: "Move an IN_BUILD order to READY; requires current_clock >= ready_at."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: ["status=READY"]

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Register an install crew."
    roles: [OperationsCoordinator, PlatformAdmin]
    code: 201
    input: [name, home_jurisdiction, daily_capacity_openings]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew."
    roles: [OperationsCoordinator, SalesConsultant, PlatformAdmin]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- InstallJob ----
  - method: POST
    path: "/projects/{id}/install-jobs"
    description: "Schedule an install job; validates crew jurisdiction, window overlap, daily capacity; copies opening_count."
    roles: [OperationsCoordinator]
    code: 201
    input: [project_id, crew_id, window_start, window_end]
    output: InstallJob
    side_effects: ["status=SCHEDULED", "copy opening_count from accepted quote's consultation", "consume crew-day capacity"]
  - method: GET
    path: "/projects/{id}/install-jobs"
    description: "List install jobs on a project (reverse-reachability for InstallJob.project_id)."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: InstallJob[]
    side_effects: []
  - method: GET
    path: "/install-jobs"
    description: "List install jobs filtered by crew_id or project_id (reverse-reachability for InstallJob.crew_id and InstallJob.project_id); paginated."
    roles: [OperationsCoordinator, PlatformAdmin]
    code: 200
    input: ["crew_id?", "project_id?", "limit?", "offset?"]
    output: InstallJob[]
    side_effects: []
  - method: GET
    path: "/install-jobs/{id}"
    description: "Fetch a single install job (flat); resolves the InstallJob collection segment."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: InstallJob
    side_effects: []
  - method: POST
    path: "/projects/{id}/install-jobs/{jid}/depart"
    description: "Move a SCHEDULED job to EN_ROUTE; requires manufacture READY and window started."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status=EN_ROUTE", "Project.status->INSTALLING"]
  - method: POST
    path: "/projects/{id}/install-jobs/{jid}/complete"
    description: "Complete an EN_ROUTE job; requires APPROVED permit; Project->INSPECTION."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status=COMPLETED", "Project.status->INSPECTION"]
  - method: POST
    path: "/projects/{id}/install-jobs/{jid}/cancel"
    description: "Cancel a SCHEDULED job; releases crew-day capacity."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: InstallJob
    side_effects: ["status=CANCELLED", "release crew-day capacity"]

  # ---- Permit ----
  - method: POST
    path: "/projects/{id}/permits"
    description: "File a permit on a project (status FILED)."
    roles: [OperationsCoordinator]
    code: 201
    input: [project_id]
    output: Permit
    side_effects: ["status=FILED"]
  - method: GET
    path: "/projects/{id}/permits"
    description: "List permits on a project (reverse-reachability for Permit.project_id)."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/permits/{pid}/approve"
    description: "Approve a FILED permit (or re-approve an INSPECTION_FAILED one); sets inspection_due_at."
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status=APPROVED", "set inspection_due_at"]
  - method: POST
    path: "/projects/{id}/permits/{pid}/record-inspection"
    description: "Record inspection PASS/FAIL on an APPROVED permit; requires a COMPLETED install job. PASS->Project COMPLETED."
    roles: [OperationsCoordinator]
    code: 200
    input: [result]
    output: Permit
    side_effects: ["status=INSPECTION_PASSED|INSPECTION_FAILED", "on PASS: Project.status->COMPLETED"]

  # ---- ServiceTicket ----
  - method: POST
    path: "/projects/{id}/service-tickets"
    description: "Open a callback/warranty ticket on a COMPLETED project for a specific opening."
    roles: [Homeowner, ServiceTech, PlatformAdmin]
    code: 201
    input: [project_id, opening_id, category]
    output: ServiceTicket
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/projects/{id}/service-tickets"
    description: "List service tickets on a project (reverse-reachability for ServiceTicket.project_id)."
    roles: [Homeowner, ServiceTech, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ServiceTicket[]
    side_effects: []
  - method: GET
    path: "/openings/{id}/service-tickets"
    description: "List service tickets for a specific opening (reverse-reachability for ServiceTicket.opening_id)."
    roles: [Homeowner, ServiceTech, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/service-tickets/{sid}/dispatch"
    description: "Dispatch a tech (OPEN|REOPENED -> DISPATCHED)."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=DISPATCHED"]
  - method: POST
    path: "/projects/{id}/service-tickets/{sid}/resolve"
    description: "Resolve a DISPATCHED ticket; computes charge_cents."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["compute service_charge", "status=RESOLVED"]
  - method: POST
    path: "/projects/{id}/service-tickets/{sid}/close"
    description: "Close a RESOLVED ticket."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=CLOSED"]
  - method: POST
    path: "/projects/{id}/service-tickets/{sid}/reopen"
    description: "Homeowner reopens a RESOLVED ticket (cyclic)."
    roles: [Homeowner]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=REOPENED"]

  # ---- Referral ----
  - method: POST
    path: "/referrals"
    description: "Create a referral from a COMPLETED referrer project to a referred project."
    roles: [SalesConsultant, PlatformAdmin]
    code: 201
    input: [referrer_project_id, referred_project_id]
    output: Referral
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/referrals"
    description: "List referrals filtered by referrer_project_id or referred_project_id (reverse-reachability for both Referral FKs); paginated."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: ["referrer_project_id?", "referred_project_id?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a single referral."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  # ---- Flat read surface (single-resource GET + filtered list per child entity;
  #      provides FK reverse-reachability for nested children that lack a flat parent) ----
  - method: GET
    path: "/consultations/{id}"
    description: "Fetch a single consultation (flat)."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Consultation
    side_effects: []
  - method: GET
    path: "/consultations"
    description: "List consultations filtered by project_id (reverse-reachability for Consultation.project_id); paginated."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: Consultation[]
    side_effects: []
  - method: GET
    path: "/openings"
    description: "List openings filtered by consultation_id (reverse-reachability for Opening.consultation_id); paginated."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: ["consultation_id?", "limit?", "offset?"]
    output: Opening[]
    side_effects: []
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a single quote (flat); lazily expires if past expires_at."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazily EXPIRE if past expires_at"]
  - method: GET
    path: "/quotes"
    description: "List quotes filtered by project_id or consultation_id (reverse-reachability for Quote.project_id and Quote.consultation_id); paginated."
    roles: [SalesConsultant, OperationsCoordinator, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "consultation_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/financing-applications/{id}"
    description: "Fetch a single financing application (flat)."
    roles: [Homeowner, SalesConsultant, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []
  - method: GET
    path: "/financing-applications"
    description: "List financing applications filtered by quote_id (reverse-reachability for FinancingApplication.quote_id); paginated."
    roles: [Homeowner, SalesConsultant, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: ["quote_id?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []
  - method: GET
    path: "/manufacture-orders/{id}"
    description: "Fetch a single manufacture order (flat)."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: ManufactureOrder
    side_effects: []
  - method: GET
    path: "/manufacture-orders"
    description: "List manufacture orders filtered by project_id or quote_id (reverse-reachability for ManufactureOrder.project_id and ManufactureOrder.quote_id); paginated."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "quote_id?", "limit?", "offset?"]
    output: ManufactureOrder[]
    side_effects: []
  - method: GET
    path: "/permits/{id}"
    description: "Fetch a single permit (flat)."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List permits filtered by project_id (reverse-reachability for Permit.project_id); paginated."
    roles: [OperationsCoordinator, SalesConsultant, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: GET
    path: "/service-tickets/{id}"
    description: "Fetch a single service ticket (flat)."
    roles: [Homeowner, ServiceTech, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/service-tickets"
    description: "List service tickets filtered by project_id or opening_id (reverse-reachability for ServiceTicket.project_id and ServiceTicket.opening_id); paginated."
    roles: [Homeowner, ServiceTech, OperationsCoordinator, PlatformAdmin]
    code: 200
    input: ["project_id?", "opening_id?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []

  # ---- Test-driving (logical clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an explicit ISO 8601 UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Setting the clock lazily EXPIRES any SENT quote now past expires_at."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock", "lazily EXPIRE SENT quotes past expires_at"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_NOT_PROJECT_OWNER
    http: 403
    condition: "Homeowner acting on a project they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "a FK body field references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum, or out-of-range numeric (e.g., width_in <= 0, bad term_months)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a valid state for the requested transition"
  - id: ERR_STALE_QUOTE_VERSION
    http: 412
    condition: "expected_quote_version does not match current Quote.version on accept"
  - id: ERR_CONSULTATION_NOT_MEASURED
    http: 409
    condition: "sending a quote whose consultation is not MEASURED"
  - id: ERR_NO_OPENINGS
    http: 422
    condition: "completing a measure with zero openings"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "accepting a quote at/after its expires_at instant"
  - id: ERR_PROJECT_ALREADY_CONTRACTED
    http: 409
    condition: "accepting a second quote when the project already has an ACCEPTED quote"
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "completing an install job without an APPROVED (or later) permit on the project"
  - id: ERR_GOODS_NOT_READY
    http: 409
    condition: "departing an install job whose manufacture order is not READY"
  - id: ERR_CREW_JURISDICTION_MISMATCH
    http: 422
    condition: "assigned crew home_jurisdiction differs from project jurisdiction_code"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "install window overlaps an existing non-terminal window on the same crew (half-open; abutment allowed)"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 409
    condition: "crew daily opening capacity would be exceeded on a shared calendar day"
  - id: ERR_FINANCING_OVER_QUOTE
    http: 422
    condition: "financing requested_amount_cents exceeds the linked quote estimate_total_cents at approval"
  - id: ERR_REFERRER_NOT_COMPLETED
    http: 409
    condition: "referrer project is not COMPLETED, or referrer == referred"
  - id: ERR_PROJECT_NOT_COMPLETED
    http: 409
    condition: "opening a service ticket on a non-COMPLETED project"
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "pagination limit outside [1,100] or offset negative"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Homeowner
    description: "The customer; accepts/rejects quotes, submits financing, reopens service tickets, opens callbacks."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /projects/{id}/quotes/{qid}/accept"
      - "POST /projects/{id}/quotes/{qid}/reject"
      - "POST /projects/{id}/service-tickets/{sid}/reopen"
    shared_operations:
      - "POST /projects/{id}/quotes/{qid}/financing (with SalesConsultant)"
      - "POST /projects/{id}/service-tickets (with ServiceTech, PlatformAdmin)"
      - "GET reads on own projects/quotes/consultations/openings/manufacture/install-jobs/permits/referrals/homeowner"
  - name: SalesConsultant
    description: "Runs consultations and measures, configures openings, drafts and sends quotes, creates referrals."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/consultations"
      - "POST /projects/{id}/consultations/{cid}/complete-measure"
      - "POST /projects/{id}/consultations/{cid}/cancel"
      - "POST /projects/{id}/consultations/{cid}/openings"
      - "PATCH /openings/{id}"
      - "POST /projects/{id}/quotes"
