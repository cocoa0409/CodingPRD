            - "WarrantyClaim.${clm1}.net_payout_cents == 353338 - 0 - 17667 == 335671, and after this approval ProductModel.${pm}.warranty_reserve_cents == 664329 with warranty_paid_cents == 335671"
            - "WarrantyClaim.${clm2}.months_in_service == 30 and pre_fee_gross_cents == 200010: coverage_pct = round((60 - 30) / 60 * 100, 2) = 50.00 and round_half_up(400020 * 50.00 / 100 * 1.00) = 200010"
            - "WarrantyClaim.${clm2}.admin_fee_cents == 10001, not 16001: the gross 200010 is TEN CENTS above the 200000 tier ceiling, so the 8.00 pct band does not match and the 5.00 pct top rate applies; round_half_up(200010 * 5.00 / 100) = round_half_up(10000.50) = 10001, where banker's rounding would give 10000"
            - "WarrantyClaim.${clm2}.net_payout_cents == 200010 - 0 - 10001 == 190009"
            - "WarrantyClaim.${clm3}.claim_type == COSMETIC with months_in_service == 30 and pre_fee_gross_cents == 60003: the same 50.00 pct coverage is multiplied by CLAIM_TYPE_FACTOR[COSMETIC] 0.30, round_half_up(400020 * 50.00 / 100 * 0.30) = round_half_up(60003.00) = 60003"
            - "WarrantyClaim.${clm3}.admin_fee_cents == 4800 at the 8.00 pct band: 60003 fails the 50000 row but satisfies max_gross_cents 200000, and round_half_up(60003 * 8.00 / 100) = round_half_up(4800.24) = 4800; net_payout_cents == 60003 - 0 - 4800 == 55203"
            - "the claim-type factor is applied to the gross BEFORE the fee tier is chosen: the COSMETIC claim on the same hull at the same age pays the 8.00 pct band while its HULL_DEFORMATION sibling at 30 months pays 5.00 pct — a design that applied the factor after the tier selection would charge ${clm3} 5.00 pct and yield 3000 / 57003"
            - "the final GET /product-models/${pm} reads warranty_reserve_cents == 1000000 - 335671 - 190009 - 55203 == 419117 and warranty_paid_cents == 580883, so reserve + paid == 1000000 == initial_warranty_reserve_cents after three approvals"
            - "ProductModel.${pm}.version advanced by exactly 3 across the three approvals, which is why each approve had to re-read the version: replaying ${pm_v1} into the second approve would fail the OCC guard"

      # -----------------------------------------------------------------------
      # C18 — warranty_payout FLAT_SCHEDULE: the band is a step function, so 12
      # months and 30 days still pays 80.00 pct and month 13 drops to 50.00.
      # The whole cvW physical chain is reused with a FLAT_SCHEDULE model.
      # -----------------------------------------------------------------------
      - name: calc_tiered_pricing_warranty_flat_schedule_band_boundary
        claim_type: tiered_pricing
        grounds:
          - calculations.warranty_payout
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/approve
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/start-review
        distinguishing_aspect: "On a FLAT_SCHEDULE model with msrp_cents 180000 a claim reviewed at exactly 12 months and a claim reviewed at 12 months and 30 days must both pay net 132480, while one reviewed at 13 months pays 82800 — the band is chosen by the FIRST max_months >= months_in_service and months are floored, never rounded up."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The same physical plant as C17 (mould MLD-CVW-1, oven OV-CVW, bay CB-CVW, site WH-CVA, resin lot LOT-CVW, trailer SHP-CVW on zone Z2 with capacity 2.4000 m3, Customer CUS-CVW) but the hull model is PM-CVX with warranty_basis FLAT_SCHEDULE, msrp_cents 180000 and initial_warranty_reserve_cents 500000."
            - "Two PM-CVX hulls were moulded, inspected SELLABLE, stored, sealed on the trailer, departed and DELIVERED at 2026-08-01T12:00:00Z; CUS-CVW acknowledged the storage guidance at exactly that instant, so every storage review can verify."
            - "PM-CVX reads warranty_reserve_cents 500000 and warranty_paid_cents 0, and no claim exists."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
