# =============================================================================
# §1.9 Scaffold Corner Design — Industrial Gearbox Remanufacturing
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered
# by §1.8. Names are unique across both design files.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_success_returns_201_and_defaults
        claim_type: creation
        grounds: ["entities.Customer", "endpoints[POST /reman/customers]"]
        distinguishing_aspect: "POST with all required fields returns 201; computed defaults outstanding_approved_cents=0 and credit_hold=false applied; system fields id/created_at/version present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reman/customers"
              payload: { legal_name: "Default Co", credit_limit_cents: 1000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
          assert:
            - "http status == 201"
            - "Customer.${cust_id}.outstanding_approved_cents == 0"
            - "Customer.${cust_id}.credit_hold == false"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.id is a UUID with no type prefix"

      - name: create_customer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Customer.fields.legal_name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required legal_name yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /reman/customers"
              payload: { credit_limit_cents: 1000000 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: get_customer_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Customer", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /reman/customers/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: gear_unit_serial_number_uniqueness_enforced
        claim_type: type_constraints
        grounds: ["entities.GearUnit.fields.serial_number", "errors[ERR_SERIAL_EXISTS]", "validations[priority=7]"]
        distinguishing_aspect: "Second GearUnit with identical serial_number (even under a different customer) is rejected with ERR_SERIAL_EXISTS 409."
        test_recipe:
          setup: ["Customer C1 with unit GBX-DUP; second customer C2"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Dup One", credit_limit_cents: 1000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-DUP", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
            - call: "POST /reman/customers"
              payload: { legal_name: "Dup Two", credit_limit_cents: 1000000 }
              as: IntakeCoordinator
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /reman/customers/${c2}/units"
              payload: { serial_number: "GBX-DUP", model: "HZ-900", rated_torque_nm: 20000 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SERIAL_EXISTS"
            - "http status == 409"

      - name: record_service_hours_is_forward_only
        claim_type: computed_fields
        grounds: ["entities.GearUnit.fields.cumulative_service_hours", "endpoints[POST /reman/units/{unitId}/record-service-hours]"]
        distinguishing_aspect: "Odometer takes max(current, reported): reporting 500 then 300 leaves 500; reporting 900 advances to 900."
        test_recipe:
          setup: ["Unit U with cumulative_service_hours 500"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Odo Co", credit_limit_cents: 1000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-ODO", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 500 }
              as: IntakeCoordinator
          trigger:
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 300 }
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 900 }
              as: IntakeCoordinator
            - call: "GET /reman/units/${unit_id}"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "GearUnit.${unit_id}.cumulative_service_hours == 900"

      - name: teardown_finding_immutable_append_only
        claim_type: immutability
        grounds: ["entities.TeardownFinding"]
        distinguishing_aspect: "TeardownFinding has common_fields:false (id+created_at only, no version) and no update endpoint exists in §1.5 — the entity is an append-only log."
        test_recipe:
          setup: ["Order in TEARDOWN with one finding"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Log Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-LOG", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
          trigger:
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "BRG_3", condition: "REUSABLE", severity: 1, notes: "ok" }
              as: RemanEngineer
              captures: { finding_id: $.data.id }
          assert:
            - "TeardownFinding.${finding_id} response carries id and created_at and carries no version field"
            - "No PUT/PATCH/DELETE endpoint for findings exists in §1.5 (structural assertion over the endpoint table)"

      - name: list_orders_for_unit_returns_array_envelope
        claim_type: listing
        grounds: ["endpoints[GET /reman/units/{id}/orders]", "response_envelope"]
        distinguishing_aspect: "List endpoint returns response_type array with pagination fields limit/offset/total_count/has_more present in meta-envelope per §1.0."
        test_recipe:
          setup: ["Customer with unit U and one order"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "List Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-LST", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
          trigger:
            - call: "GET /reman/units/${unit_id}/orders"
              payload: {}
              as: RemanEngineer
          assert:
            - "response envelope response_type == array"
            - "data is a list of length 1"
            - "pagination fields limit, offset, total_count, has_more are present"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_terminal_completed_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RemanOrder", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From COMPLETED no further transition exists: start-teardown on a COMPLETED order returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Fully completed order O (walked through the whole pipeline)"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Term Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-T1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.10, radial_clearance_mm: 0.02, axial_clearance_mm: 0.02 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 80.0, vibration_mm_s: 2.0, oil_particle_count: 1500 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 400, rigging_bay_date: "2026-08-07", rigging_bay_hours: 2 }
              as: IntakeCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/ship"
              payload: {}
              as: ServiceManager
            - call: "POST /reman/shipments/${ship_id}/deliver"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/orders/${order_id}/complete"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http status == 409"
            - "RemanOrder.${order_id}.status == COMPLETED (unchanged)"

      - name: second_order_on_same_unit_rejected
        claim_type: precondition_enforcement
        grounds: ["entities.RemanOrder", "errors[ERR_UNIT_BUSY]", "validations[priority=7]"]
        distinguishing_aspect: "Creating a second RemanOrder for a unit whose first order is non-terminal returns ERR_UNIT_BUSY 409."
        test_recipe:
          setup: ["Unit U AT_SHOP with order O1 in INTAKE"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Busy Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-BUSY", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 200000 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIT_BUSY"
            - "http status == 409"

      - name: intake_hours_must_match_unit_odometer
        claim_type: precondition_enforcement
        grounds: ["endpoints[POST /reman/units/{unitId}/orders]", "errors[ERR_INTAKE_HOURS_MISMATCH]"]
        distinguishing_aspect: "intake_hours != GearUnit.cumulative_service_hours at creation returns ERR_INTAKE_HOURS_MISMATCH 422."
        test_recipe:
          setup: ["Unit AT_SHOP with cumulative_service_hours 700"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Mismatch Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-MM", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 700 }
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 650, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INTAKE_HOURS_MISMATCH"
            - "http status == 422"

      - name: submit_scope_without_findings_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.RemanOrder.TEARDOWN_to_SCOPE_APPROVAL", "errors[ERR_NO_FINDINGS]"]
        distinguishing_aspect: "submit-scope with zero TeardownFindings returns ERR_NO_FINDINGS 422."
        test_recipe:
          setup: ["Order in TEARDOWN, no findings posted"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Empty Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-NF", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
          trigger:
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_FINDINGS"
            - "http status == 422"

      - name: submit_scope_with_undecided_finding_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.RemanOrder.TEARDOWN_to_SCOPE_APPROVAL", "errors[ERR_DECISIONS_INCOMPLETE]"]
        distinguishing_aspect: "A finding whose component_code lacks a PENDING ComponentDecision blocks submit-scope with ERR_DECISIONS_INCOMPLETE 422."
        test_recipe:
          setup: ["Order in TEARDOWN with finding GEAR_9 but decision only for PINION_1... concretely: one finding GEAR_9, no decision for it"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Undecided Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reman/customers/${c1}/units"
              payload: { serial_number: "GBX-UD", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000 }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "GEAR_9", condition: "BEYOND_REPAIR", severity: 5, notes: "cracked" }
              as: RemanEngineer
          trigger:
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DECISIONS_INCOMPLETE"
            - "http status == 422"

      - name: ship_blocked_while_loaner_checked_out
        claim_type: precondition_enforcement
        grounds: ["state_machines.RemanOrder.READY_TO_SHIP_to_SHIPPED", "errors[ERR_LOANER_OUTSTANDING]"]
        distinguishing_aspect: "ship with a CHECKED_OUT LoanerAssignment for the order returns ERR_LOANER_OUTSTANDING 409 — the cross-entity gate is the assignment's status, not the order's."
        test_recipe:
          setup: ["Order in READY_TO_SHIP; OUTBOUND shipment BOOKED; loaner assignment for the order CHECKED_OUT"]
          setup_api_calls:
            - call: "POST /reman/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ServiceManager
            - call: "POST /reman/customers"
              payload: { legal_name: "Loan Ship Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-LS", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.10, radial_clearance_mm: 0.02, axial_clearance_mm: 0.02 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 80.0, vibration_mm_s: 2.0, oil_particle_count: 1500 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 400, rigging_bay_date: "2026-08-04", rigging_bay_hours: 2 }
              as: IntakeCoordinator
            - call: "POST /reman/loaner-units"
              payload: { serial_number: "LN-SHIP", model: "HZ-450" }
              as: ServiceManager
              captures: { loaner_id: $.data.id }
            - call: "POST /reman/loaner-units/${loaner_id}/assignments"
              payload: { reman_order_id: "${order_id}", start_date: "2026-08-01", end_date: "2026-08-15" }
              as: IntakeCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /reman/loaner-assignments/${asg_id}/checkout"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /reman/orders/${order_id}/ship"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOANER_OUTSTANDING"
            - "http status == 409"
            - "RemanOrder.${order_id}.status == READY_TO_SHIP (unchanged)"

      - name: run_in_wrong_duration_fails
        claim_type: valid_transition
        grounds: ["calculations.run_in_result"]
        distinguishing_aspect: "duration_minutes 119 != RUN_IN_REQUIRED_MINUTES 120 forces result FAIL even with all other metrics clean — equality (not >=) is required."
        test_recipe:
          setup: ["Order in RUN_IN"]
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Duration Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-DUR", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
