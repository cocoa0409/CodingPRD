# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: alert-assess-stale-version
    parent_entity: WatchAlert
    write_endpoint: "POST /brand/watch-alerts/{id}/assess"
    occ_field: expected_watch_alert_version
    description: |
      Recording an assessment against a WatchAlert whose version has advanced
      since the caller last observed it is rejected. Each accepted assessment
      legitimately supersedes the current final_score/final_tier, so a caller
      working from a stale read of the alert would silently overwrite a newer
      attorney's assessment; the stale expected version surfaces that.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-propose-stale-version
    parent_entity: CoexistenceAgreement
    write_endpoint: "POST /brand/coexistence-agreements/{id}/propose"
    occ_field: expected_agreement_version
    description: |
      Proposing new terms against a CoexistenceAgreement whose version has
      advanced since the caller last observed it is rejected. Each accepted
      proposal legitimately supersedes the outstanding terms (a fresh counter
      bumps the version), so a proposal built on a stale view would discard
      the counterparty's latest position; the stale expected version surfaces
      that.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: confusion_score
    trigger: "provisional variant: on WatchAlert intake (POST /brand/watch-alerts); assessed variant: on POST /brand/watch-alerts/{id}/assess"
    algorithm: weighted_scoring
    formula: |
      raw = weight_mark * similarity_mark + weight_goods * similarity_goods + weight_channels * similarity_channels
      score = round_half_up(raw, 2) + fame_adjustment          # assessed variant only; provisional fame_adjustment = 0
      score = min(100, max(0, score))
      if similarity_mark >= 90 AND similarity_goods >= 90:     # identical-presumption floor
          score = max(score, 85)
      tier = HIGH if score >= 70 else MEDIUM if score >= 40 else LOW
    input_set: "The single WatchAlert being created or assessed"
    constants:
      PROVISIONAL_WEIGHT_MARK: 0.5
      PROVISIONAL_WEIGHT_GOODS: 0.3
      PROVISIONAL_WEIGHT_CHANNELS: 0.2
      FLOOR_MIN_SCORE: 85
      TIER_HIGH_MIN: 70
      TIER_MEDIUM_MIN: 40
    precision: "2 decimal places, round_half_up, before floor/tier"
    variants:
      - name: provisional
        when: "Intake; weights fixed to 0.5/0.3/0.2; fame_adjustment = 0; result stored on provisional_score/provisional_tier"
        difference: "Uses fixed equal-ish weights and no fame adjustment, so identical similarity triples yield a different score than the assessed variant"
      - name: assessed
        when: "Attorney assessment; weights supplied in payload (must sum to 1.0 within 0.0001) plus integer fame_adjustment in [-20, 20]; result stored on final_score/final_tier"
        difference: "Attorney weights and fame adjustment replace the fixed weights; identical inputs therefore produce a different number than provisional"

  - name: deadline_due_at
    trigger: "On Deadline docketing and on each extend (recompute from current computed_due_at)"
    algorithm: chronological
    formula: |
      CALENDAR_ROLL_FORWARD (deadline_type IN {OPPOSITION_WINDOW, RENEWAL}):
        due = basis + offset_days calendar days, preserving time-of-day
        while due falls on Saturday or Sunday: due += 1 calendar day
      BUSINESS_DAY_COUNT (deadline_type IN {RESPONSE_DUE, OFFICE_ACTION, CUSTOM}):
        due = basis; counted = 0
        repeat: due += 1 calendar day; if due is Mon..Fri: counted += 1
        until counted == offset_days   (basis day itself is never counted; time-of-day preserved)
      Also used for TrademarkRecord.opposition_due_at with offset 30 (CALENDAR_ROLL_FORWARD),
      CeaseDesistLetter.response_due_at (BUSINESS_DAY_COUNT), and extend recomputation.
    input_set: "The single Deadline (or record/letter) being computed"
    constants:
      OPPOSITION_WINDOW_DAYS: 30
    precision: "datetime, second precision; weekend = Saturday/Sunday in UTC"
    variants:
      - name: calendar_roll_forward
        when: "OPPOSITION_WINDOW and RENEWAL deadlines and record opposition_due_at"
        difference: "Counts calendar days then rolls forward over weekends — a Friday basis + 5 days lands Wednesday (no roll needed), whereas business-count lands on the next Friday"
      - name: business_day_count
        when: "RESPONSE_DUE, OFFICE_ACTION, CUSTOM deadlines and letter response_due_at"
        difference: "Counts only business days excluding the basis day; identical basis_date and offset_days produce a later due date than calendar counting whenever a weekend intervenes"

  - name: maintenance_filing_fee
    trigger: "On MaintenanceFiling creation (PREPARED) and re-finalized on each submit"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (circular-looking dependency resolved by ordering):
      # (1) base, (2) band from BASE ONLY (never from total), (3) surcharge, (4) late fee, (5) total.
      base_cents      = record.nice_classes.length * PER_CLASS_FEE_CENTS
      band            = HIGH if base_cents >= BAND_HIGH_MIN_CENTS else STANDARD
      surcharge_cents = round_half_up(base_cents * (0.25 if band == HIGH else 0.10), 0)
      late_cents      = (record.nice_classes.length * LATE_PER_CLASS_CENTS) if submitted in grace window else 0
      total_cents     = base_cents + surcharge_cents + late_cents
      # The band is deliberately NOT recomputed from total_cents — doing so would be circular.
    input_set: "The MaintenanceFiling's record (nice_classes) and the submission timing"
    constants:
      PER_CLASS_FEE_CENTS: 40000
      BAND_HIGH_MIN_CENTS: 240000
      SURCHARGE_RATE_HIGH: 0.25
      SURCHARGE_RATE_STANDARD: 0.10
      LATE_PER_CLASS_CENTS: 10000
    precision: "integer cents; surcharge rounded half-up to whole cents"
    variants: []

  - name: counterfeit_damages
    trigger: "On CounterfeitReferral creation (manual or auto)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each seizure line to whole cents FIRST, then sum.
      # (Summing raw values then rounding once is the forbidden alternative order and
      #  yields a different total whenever two half-cent lines coexist.)
      total = 0
      for each line in seizure_lines:
          line_value = round_half_up(line.units * line.unit_value_cents * STATUTORY_MULTIPLIER, 0)
          total += line_value
      estimated_damages_cents = total
    input_set: "The referral's seizure_lines"
    constants:
      STATUTORY_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up per line"
    variants: []

  - name: settlement_installments
    trigger: "On CeaseDesistLetter reaching COMPLIED with settlement_amount_cents set"
    algorithm: waterfall_allocation
    formula: |
      base = floor(settlement_amount_cents / installment_count)
      remainder = settlement_amount_cents - base * installment_count
      installments[1..n-1] = base
      installments[n] = base + remainder     # remainder always lands on the FINAL installment
    input_set: "The letter's settlement_amount_cents and installment_count"
    constants: {}
    precision: "integer cents; floor division; sum of schedule always equals settlement_amount_cents"
    variants: []

  - name: portfolio_exposure_index
    trigger: "On matter create (escalate), resolve, reopen, and on any linked Deadline flipping MISSED or being late-satisfied"
    algorithm: aggregation
    formula: |
      index = round_half_up( SUM over EnforcementMatter m of client
                             WHERE m.status == ACTIVE
                             OF MATTER_WEIGHT[m.matter_type] * (1.5 if m.posture == JEOPARDY else 1.0), 0 )
      watch_posture = ELEVATED if index >= ELEVATED_THRESHOLD else STANDARD
      # Rounding is applied ONCE to the final sum, never per matter.
    input_set: "All EnforcementMatter of the Client with status == ACTIVE (RESOLVED matters excluded)"
    constants:
      MATTER_WEIGHT: { OPPOSITION: 10, CANCELLATION: 15, INFRINGEMENT: 20, COUNTERFEIT: 25 }
      JEOPARDY_MULTIPLIER: 1.5
      ELEVATED_THRESHOLD: 100
    precision: "integer index, round_half_up of the raw sum"
    variants: []

  - name: fee_accrual_ledger
    trigger: "On letter issue, reissue (manual or breach cascade), void-from-ISSUED, and takedown file"
    algorithm: aggregation
    formula: |
      client.budget_spent_cents =
          SUM over CeaseDesistLetter l of client WHERE l.status != VOID
            OF (ISSUE_FEE_CENTS if l was ever issued else 0) + REISSUE_FEE_CENTS * l.reissue_count
        + SUM over TakedownFiling f of client WHERE f.status != DRAFT OF f.fee_cents
      client.budget_remaining_cents = client.enforcement_budget_cents - client.budget_spent_cents
      matter.accrued_fees_cents = the letter-fee portion attributable to that matter
      # INVARIANT: budget_spent_cents + budget_remaining_cents == enforcement_budget_cents
      # after every forward action (issue/file) and every compensating action (void-from-ISSUED).
    input_set: "All CeaseDesistLetter and TakedownFiling reachable from the client's matters/alerts"
    constants:
      ISSUE_FEE_CENTS: 75000
      REISSUE_FEE_CENTS: 25000
      PLATFORM_FEE_CENTS: { AMAZON: 15000, EBAY: 12000, ALIBABA: 18000, META: 9000, DOMAIN_REGISTRAR: 25000 }
    precision: "integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Request body satisfies the endpoint input schema: required fields present, no unknown fields, enum values valid, weights sum to 1.0 (assess), hit_index in range (dispose-hit), seizure_lines entries positive integers", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "Caller role is in the endpoint's roles list; ClientContact may only access resources whose client_id == X-User-ID; satisfy from MISSED requires role PartnerAttorney", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path identifiers exist, validated left-to-right (client, record, alert, matter, deadline, letter, filing, agreement, evidence, search, recordation, referral); body FK references exist (client_id, enforcement_matter_id, evidence_item_ids elements, supersedes_recordation_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target entity is in a state from which the requested transition is declared (per state machine from-states, including terminal lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_watch_alert_version == alert.version (assess); expected_agreement_version == agreement.version (propose)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /brand/watch-alerts/{id}/assess", "POST /brand/coexistence-agreements/{id}/propose"] }
  - { priority: 7, category: business_safety, check: "Segregation of duties: letter approve/SENT_BACK caller != drafted_by_user_id; deadline verify caller != docketed_by_user_id; evidence verify caller != collected_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /brand/cease-desist-letters/{id}/approve", "POST /brand/deadlines/{id}/verify", "POST /brand/evidence-items/{id}/verify"] }
  - { priority: 8, category: business_safety, check: "Enforcement bar: no CoexistenceAgreement on the matter's record with status IN {EXECUTED, MONITORING, BREACH_ALLEGED, CURE_PERIOD} when issuing a cease-and-desist", error_id: ERR_ENFORCEMENT_BARRED, http_status: 409, applies_to: ["POST /brand/cease-desist-letters/{id}/issue"] }
  - { priority: 9, category: business_temporal, check: "Opposition window: escalate matter_type OPPOSITION requires current_utc <= record.opposition_due_at", error_id: ERR_OPPOSITION_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /brand/watch-alerts/{id}/escalate"] }
  - { priority: 10, category: business_temporal, check: "Maintenance window: submit requires current_utc within [maintenance_window_open, maintenance_window_close] (timely) or (window_close, grace_close] (late); outside both is rejected", error_id: ERR_OUTSIDE_FILING_WINDOW, http_status: 422, applies_to: ["POST /brand/maintenance-filings/{id}/submit"] }
  - { priority: 11, category: business_temporal, check: "Litigation escalation from ISSUED requires current_utc > response_due_at", error_id: ERR_RESPONSE_WINDOW_OPEN, http_status: 422, applies_to: ["POST /brand/cease-desist-letters/{id}/escalate-litigation"] }
  - { priority: 12, category: business_constraint, check: "Escalation threshold: final_score >= 70; monitor band 40 <= final_score < 70; dismiss requires final_score < 40", error_id: ERR_SCORE_BELOW_THRESHOLD, http_status: 422, applies_to: ["POST /brand/watch-alerts/{id}/escalate"] }
  - { priority: 13, category: business_constraint, check: "Dismiss cap: final_score >= 40 cannot be dismissed", error_id: ERR_SCORE_ABOVE_DISMISS_CAP, http_status: 422, applies_to: ["POST /brand/watch-alerts/{id}/dismiss"] }
  - { priority: 14, category: business_constraint, check: "Agreement overlap: on execute, no non-terminal agreement on the same record with intersecting territory_codes and overlapping half-open [effective_start, effective_end)", error_id: ERR_AGREEMENT_OVERLAP, http_status: 409, applies_to: ["POST /brand/coexistence-agreements/{id}/execute"] }
  - { priority: 15, category: business_constraint, check: "Recordation buffer gap: for same record and customs_authority, new.term_start must be strictly greater than every existing non-superseded recordation's term_end + 30 days (adjacency forbidden); waived when supersedes_recordation_id is given", error_id: ERR_RECORDATION_GAP_VIOLATION, http_status: 409, applies_to: ["POST /brand/trademark-records/{id}/customs-recordations"] }
  - { priority: 16, category: business_constraint, check: "Caps: agreement propose from COUNTERED requires round_count < 8; takedown appeal requires appeal_count < 2; deadline extend requires extension_count < max_extensions", error_id: ERR_ROUND_CAP_REACHED, http_status: 422, applies_to: ["POST /brand/coexistence-agreements/{id}/propose"], note: "same row family — appeal cap -> ERR_APPEAL_CAP_REACHED, extension cap -> ERR_EXTENSION_CAP_REACHED, same priority" }
  - { priority: 17, category: business_constraint, check: "Clearance finalize requires unresolved_hit_count == 0", error_id: ERR_UNRESOLVED_HITS, http_status: 422, applies_to: ["POST /brand/clearance-searches/{id}/finalize"] }
  - { priority: 18, category: business_constraint, check: "Matter resolve requires open_deadline_count == 0; docket/letter-draft require matter ACTIVE", error_id: ERR_PENDING_DEADLINES, http_status: 409, applies_to: ["POST /brand/enforcement-matters/{id}/resolve"], note: "ERR_MATTER_NOT_ACTIVE at the same priority for docket/draft on a non-ACTIVE matter" }
  - { priority: 19, category: business_constraint, check: "Manual counterfeit referral requires alert.confirmed_counterfeit_count >= 3", error_id: ERR_REFERRAL_THRESHOLD_NOT_MET, http_status: 422, applies_to: ["POST /brand/watch-alerts/{id}/counterfeit-referrals"] }
  - { priority: 20, category: business_referential, check: "Maintenance/customs cross-record preconditions: record REGISTERED or MAINTENANCE_DUE for maintenance submit and customs recordation create", error_id: ERR_RECORD_NOT_REGISTERED, http_status: 409, applies_to: ["POST /brand/maintenance-filings/{id}/submit", "POST /brand/trademark-records/{id}/customs-recordations"] }
  - { priority: 21, category: business_referential, check: "Evidence integrity: nice_class in record.nice_classes; filing evidence items belong to the same record, are VERIFIED, are not stale (specimen_date >= window_close - 36 months), and cover every record class", error_id: ERR_CLASS_NOT_ON_RECORD, http_status: 422, applies_to: ["POST /brand/trademark-records/{id}/evidence-items"], note: "same priority family — ERR_EVIDENCE_RECORD_MISMATCH, ERR_EVIDENCE_NOT_VERIFIED, ERR_EVIDENCE_STALE, ERR_INCOMPLETE_CLASS_COVERAGE on maintenance submit" }
  - { priority: 22, category: business_referential, check: "CUSTOMS_SEIZE referral requires an ACTIVE CustomsRecordation on the alert's record", error_id: ERR_CUSTOMS_RECORDATION_REQUIRED, http_status: 422, applies_to: ["POST /brand/counterfeit-referrals/{id}/refer"] }
  - { priority: 23, category: business_fiscal, check: "Budget: letter issue requires budget_remaining_cents >= ISSUE_FEE_CENTS; reissue >= REISSUE_FEE_CENTS; takedown file >= fee_cents (cascade-driven reissues bypass this check)", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /brand/cease-desist-letters/{id}/issue", "POST /brand/cease-desist-letters/{id}/reissue", "POST /brand/takedown-filings/{id}/file"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Client ---
  - { method: POST, path: "/brand/clients", description: "Create a brand-owner client", roles: [PlatformAdmin], code: 201, input: [name, industry, enforcement_budget_cents], output: Client, side_effects: ["budget_spent_cents=0, budget_remaining_cents=enforcement_budget_cents, exposure_index=0, watch_posture=STANDARD"] }
  - { method: GET, path: "/brand/clients/{id}", description: "Read a client incl. budget and exposure fields", roles: [PlatformAdmin, Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: Client, side_effects: [] }

  # --- TrademarkRecord ---
  - { method: POST, path: "/brand/trademark-records", description: "Register a portfolio mark (ClientContact may only use own client_id)", roles: [Paralegal, ClientContact], code: 201, input: [client_id, mark_text, mark_type, jurisdiction, nice_classes, application_number], output: TrademarkRecord, side_effects: ["status=APPLICATION_PENDING, verified_evidence_count=0"] }
  - { method: GET, path: "/brand/trademark-records", description: "List/filter records", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "TrademarkRecord[]", side_effects: [] }
  - { method: GET, path: "/brand/trademark-records/{id}", description: "Read a record", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: TrademarkRecord, side_effects: [] }
  - { method: POST, path: "/brand/trademark-records/{id}/publish", description: "APPLICATION_PENDING -> PUBLISHED; computes opposition_due_at", roles: [Paralegal], code: 200, input: [publication_date], output: TrademarkRecord, side_effects: ["opposition_due_at computed (CALENDAR_ROLL_FORWARD, 30 days)"] }
  - { method: POST, path: "/brand/trademark-records/{id}/register", description: "PUBLISHED -> REGISTERED; computes maintenance windows", roles: [Paralegal], code: 200, input: [registration_date], output: TrademarkRecord, side_effects: ["maintenance_window_open/close/grace_close computed"] }

  # --- WatchAlert ---
  - { method: POST, path: "/brand/watch-alerts", description: "Watch-service/manual alert intake; computes provisional score and tier", roles: [WatchService, Paralegal], code: 201, input: [trademark_record_id, source, conflicting_mark_text, conflicting_owner, conflicting_classes, similarity_mark, similarity_goods, similarity_channels], output: WatchAlert, side_effects: ["provisional_score/provisional_tier computed; status=NEW"] }
  - { method: GET, path: "/brand/watch-alerts", description: "List/filter alerts", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["trademark_record_id?", "status?", "final_tier?", "limit?", "offset?"], output: "WatchAlert[]", side_effects: [] }
  - { method: GET, path: "/brand/watch-alerts/{id}", description: "Read an alert", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: WatchAlert, side_effects: [] }
  - { method: POST, path: "/brand/watch-alerts/{id}/triage", description: "NEW -> TRIAGED", roles: [Paralegal], code: 200, input: [], output: WatchAlert, side_effects: [] }
  - { method: POST, path: "/brand/watch-alerts/{id}/assess", description: "Record attorney assessment (OCC; supersedes final_score); TRIAGED/MONITORING -> UNDER_ASSESSMENT", roles: [AssociateAttorney], code: 200, input: [weight_mark, weight_goods, weight_channels, fame_adjustment, rationale, expected_watch_alert_version], output: WatchAlert, side_effects: ["assessment_round += 1; final_score/final_tier recomputed; increments WatchAlert.version by 1"] }
  - { method: POST, path: "/brand/watch-alerts/{id}/escalate", description: "UNDER_ASSESSMENT -> ESCALATED; creates the EnforcementMatter (response is the matter)", roles: [AssociateAttorney], code: 201, input: [matter_type], output: EnforcementMatter, side_effects: ["matter created ACTIVE; record challenge cascade for OPPOSITION/CANCELLATION; exposure recomputed"] }
  - { method: POST, path: "/brand/watch-alerts/{id}/monitor", description: "UNDER_ASSESSMENT -> MONITORING (40 <= final_score < 70)", roles: [AssociateAttorney], code: 200, input: [], output: WatchAlert, side_effects: [] }
  - { method: POST, path: "/brand/watch-alerts/{id}/dismiss", description: "UNDER_ASSESSMENT -> DISMISSED (final_score < 40)", roles: [AssociateAttorney], code: 200, input: [dismiss_reason], output: WatchAlert, side_effects: [] }

  # --- EnforcementMatter ---
  - { method: GET, path: "/brand/enforcement-matters", description: "List/filter matters", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["client_id?", "trademark_record_id?", "watch_alert_id?", "status?", "limit?", "offset?"], output: "EnforcementMatter[]", side_effects: [] }
  - { method: GET, path: "/brand/enforcement-matters/{id}", description: "Read a matter", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: EnforcementMatter, side_effects: [] }
  - { method: POST, path: "/brand/enforcement-matters/{id}/resolve", description: "ACTIVE -> RESOLVED with outcome; record outcome cascade", roles: [PartnerAttorney], code: 200, input: [outcome], output: EnforcementMatter, side_effects: ["record UNDER_CHALLENGE resolution cascade; exposure recomputed"] }
  - { method: POST, path: "/brand/enforcement-matters/{id}/reopen", description: "RESOLVED -> ACTIVE (manual; breach cascade uses the same transition)", roles: [PartnerAttorney], code: 200, input: [], output: EnforcementMatter, side_effects: ["resolution_outcome=null; COMPLIED letters reissued; response deadlines auto-docketed; exposure recomputed"] }

  # --- Deadline ---
  - { method: POST, path: "/brand/enforcement-matters/{id}/deadlines", description: "Docket a deadline on an ACTIVE matter", roles: [Paralegal, AssociateAttorney], code: 201, input: [deadline_type, statutory_basis, basis_date, offset_days, "max_extensions?"], output: Deadline, side_effects: ["computation_variant derived; computed_due_at per deadline_due_at; status=DOCKETED; docketed_by_user_id := X-User-ID"] }
  - { method: GET, path: "/brand/deadlines", description: "List/filter deadlines", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["enforcement_matter_id?", "status?", "limit?", "offset?"], output: "Deadline[]", side_effects: [] }
  - { method: GET, path: "/brand/deadlines/{id}", description: "Read a deadline", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: Deadline, side_effects: [] }
  - { method: POST, path: "/brand/deadlines/{id}/verify", description: "DOCKETED -> PENDING; verifier must differ from docketed_by_user_id", roles: [AssociateAttorney, PartnerAttorney], code: 200, input: [], output: Deadline, side_effects: ["verified_by_user_id := X-User-ID"] }
  - { method: POST, path: "/brand/deadlines/{id}/extend", description: "PENDING/EXTENDED -> EXTENDED; recomputes computed_due_at", roles: [Paralegal], code: 200, input: [additional_days], output: Deadline, side_effects: ["extension_count += 1; computed_due_at recomputed"] }
  - { method: POST, path: "/brand/deadlines/{id}/satisfy", description: "PENDING/EXTENDED -> SATISFIED (timely); MISSED -> SATISFIED only with allow_late and PartnerAttorney", roles: [Paralegal, PartnerAttorney], code: 200, input: ["allow_late?"], output: Deadline, side_effects: ["satisfied_at, satisfied_late set; posture/exposure recomputed on late satisfy"] }

  # --- CeaseDesistLetter ---
  - { method: POST, path: "/brand/enforcement-matters/{id}/cease-desist-letters", description: "Draft a letter on an ACTIVE matter", roles: [AssociateAttorney, PartnerAttorney], code: 201, input: [demand_type, recipient_name, recipient_address, "response_due_days?", "settlement_amount_cents?", "installment_count?"], output: CeaseDesistLetter, side_effects: ["status=DRAFT; drafted_by_user_id := X-User-ID"] }
  - { method: GET, path: "/brand/cease-desist-letters", description: "List/filter letters", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["enforcement_matter_id?", "status?", "limit?", "offset?"], output: "CeaseDesistLetter[]", side_effects: [] }
  - { method: GET, path: "/brand/cease-desist-letters/{id}", description: "Read a letter", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: CeaseDesistLetter, side_effects: [] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/submit-review", description: "DRAFT -> PENDING_REVIEW", roles: [AssociateAttorney, PartnerAttorney], code: 200, input: [], output: CeaseDesistLetter, side_effects: [] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/approve", description: "PENDING_REVIEW -> APPROVED (decision APPROVED) or -> DRAFT (decision SENT_BACK); approver != drafter", roles: [PartnerAttorney], code: 200, input: [decision], output: CeaseDesistLetter, side_effects: ["approved_by_user_id set on APPROVED"] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/issue", description: "APPROVED -> ISSUED; accrues ISSUE_FEE_CENTS; auto-dockets response deadline", roles: [AssociateAttorney], code: 200, input: [], output: CeaseDesistLetter, side_effects: ["issued_at/response_due_at set; fee accrual; Deadline auto-docketed"] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/record-response", description: "ISSUED/NEGOTIATING -> COMPLIED | REFUSED | NEGOTIATING by response_outcome", roles: [Paralegal], code: 200, input: [response_outcome], output: CeaseDesistLetter, side_effects: ["installment_schedule computed on COMPLIED with settlement"] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/reissue", description: "NEGOTIATING -> ISSUED; accrues REISSUE_FEE_CENTS", roles: [AssociateAttorney], code: 200, input: ["response_due_days?"], output: CeaseDesistLetter, side_effects: ["reissue_count += 1; response_due_at recomputed; fee accrual"] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/escalate-litigation", description: "ISSUED (after response_due_at) or REFUSED -> ESCALATED_LITIGATION", roles: [PartnerAttorney], code: 200, input: [], output: CeaseDesistLetter, side_effects: [] }
  - { method: POST, path: "/brand/cease-desist-letters/{id}/void", description: "DRAFT/PENDING_REVIEW/APPROVED/ISSUED -> VOID; void from ISSUED reverses all accrued letter fees", roles: [AssociateAttorney, PartnerAttorney], code: 200, input: [], output: CeaseDesistLetter, side_effects: ["fee reversal on rescind from ISSUED"] }

  # --- TakedownFiling ---
  - { method: POST, path: "/brand/watch-alerts/{id}/takedown-filings", description: "Create a takedown draft against an alert listing", roles: [Paralegal], code: 201, input: [platform, listing_url, basis], output: TakedownFiling, side_effects: ["fee_cents computed from PLATFORM_FEE_CENTS; status=DRAFT"] }
  - { method: GET, path: "/brand/takedown-filings", description: "List/filter filings", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["watch_alert_id?", "status?", "basis?", "limit?", "offset?"], output: "TakedownFiling[]", side_effects: [] }
  - { method: GET, path: "/brand/takedown-filings/{id}", description: "Read a filing", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: TakedownFiling, side_effects: [] }
  - { method: POST, path: "/brand/takedown-filings/{id}/file", description: "DRAFT -> FILED; accrues platform fee", roles: [Paralegal], code: 200, input: [], output: TakedownFiling, side_effects: ["fee accrual to client budget"] }
  - { method: POST, path: "/brand/takedown-filings/{id}/platform-response", description: "FILED/APPEALED -> REMOVED|REJECTED; REMOVED -> REINSTATED; counterfeit counter and referral threshold cascade", roles: [Paralegal], code: 200, input: [outcome], output: TakedownFiling, side_effects: ["confirmed_counterfeit_count increment/decrement; auto-referral at threshold"] }
  - { method: POST, path: "/brand/takedown-filings/{id}/appeal", description: "REJECTED -> APPEALED; cap 2 appeals", roles: [Paralegal], code: 200, input: [], output: TakedownFiling, side_effects: ["appeal_count += 1"] }

  # --- CoexistenceAgreement ---
  - { method: POST, path: "/brand/trademark-records/{id}/coexistence-agreements", description: "Draft a coexistence agreement on a record", roles: [AssociateAttorney], code: 201, input: [counterparty_name, territory_codes, effective_start, effective_end, "cure_period_days?", "enforcement_matter_id?"], output: CoexistenceAgreement, side_effects: ["status=DRAFT; round_count=0"] }
  - { method: GET, path: "/brand/coexistence-agreements", description: "List/filter agreements", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["trademark_record_id?", "enforcement_matter_id?", "status?", "limit?", "offset?"], output: "CoexistenceAgreement[]", side_effects: [] }
  - { method: GET, path: "/brand/coexistence-agreements/{id}", description: "Read an agreement", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: CoexistenceAgreement, side_effects: [] }
  - { method: POST, path: "/brand/coexistence-agreements/{id}/propose", description: "DRAFT/COUNTERED -> PROPOSED (OCC); round cap 8", roles: [AssociateAttorney], code: 200, input: [terms_text, expected_agreement_version], output: CoexistenceAgreement, side_effects: ["round_count += 1 (:= 1 from DRAFT); current_terms_text updated; increments CoexistenceAgreement.version by 1"] }
  - { method: POST, path: "/brand/coexistence-agreements/{id}/counter", description: "PROPOSED -> COUNTERED", roles: [AssociateAttorney], code: 200, input: [counter_terms_text], output: CoexistenceAgreement, side_effects: ["round_count += 1; current_terms_text updated"] }
  - { method: POST, path: "/brand/coexistence-agreements/{id}/execute", description: "PROPOSED/COUNTERED -> EXECUTED; overlap check", roles: [PartnerAttorney], code: 200, input: [], output: CoexistenceAgreement, side_effects: ["enforcement bar engages"] }
  - { method: POST, path: "/brand/coexistence-agreements/{id}/breach", description: "MONITORING -> BREACH_ALLEGED; depth-3 cascade (matter reopen -> letter reissue -> auto-docket)", roles: [Paralegal], code: 200, input: [breach_notes], output: CoexistenceAgreement, side_effects: ["breach cascade per state machine"] }
  - { method: POST, path: "/brand/coexistence-agreements/{id}/cure", description: "BREACH_ALLEGED -> CURE_PERIOD (cure_action GRANT); CURE_PERIOD -> MONITORING (cure_action CONFIRM_CURED)", roles: [PartnerAttorney], code: 200, input: [cure_action], output: CoexistenceAgreement, side_effects: ["cure_deadline set on GRANT, cleared on CONFIRM_CURED"] }

  # --- UseEvidenceItem ---
  - { method: POST, path: "/brand/trademark-records/{id}/evidence-items", description: "Collect a use specimen for a record", roles: [Paralegal, AssociateAttorney], code: 201, input: [nice_class, specimen_type, specimen_date], output: UseEvidenceItem, side_effects: ["status=COLLECTED; collected_by_user_id := X-User-ID"] }
  - { method: GET, path: "/brand/evidence-items", description: "List/filter evidence", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["trademark_record_id?", "status?", "limit?", "offset?"], output: "UseEvidenceItem[]", side_effects: [] }
  - { method: GET, path: "/brand/evidence-items/{id}", description: "Read an evidence item", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: UseEvidenceItem, side_effects: [] }
  - { method: POST, path: "/brand/evidence-items/{id}/verify", description: "COLLECTED -> VERIFIED; verifier != collector", roles: [AssociateAttorney, PartnerAttorney], code: 200, input: [], output: UseEvidenceItem, side_effects: ["record.verified_evidence_count recomputed"] }
  - { method: POST, path: "/brand/evidence-items/{id}/reject", description: "COLLECTED/VERIFIED -> REJECTED", roles: [AssociateAttorney, PartnerAttorney], code: 200, input: [reason], output: UseEvidenceItem, side_effects: ["record.verified_evidence_count recomputed"] }

  # --- MaintenanceFiling ---
  - { method: POST, path: "/brand/trademark-records/{id}/maintenance-filings", description: "Prepare a maintenance/renewal filing", roles: [Paralegal], code: 201, input: [filing_type, evidence_item_ids], output: MaintenanceFiling, side_effects: ["status=PREPARED; fees computed"] }
  - { method: GET, path: "/brand/maintenance-filings", description: "List/filter filings", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["trademark_record_id?", "status?", "limit?", "offset?"], output: "MaintenanceFiling[]", side_effects: [] }
  - { method: GET, path: "/brand/maintenance-filings/{id}", description: "Read a filing", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: MaintenanceFiling, side_effects: [] }
  - { method: POST, path: "/brand/maintenance-filings/{id}/submit", description: "PREPARED/REJECTED_OFFICE -> SUBMITTED (in window) or LATE_FILED (grace window)", roles: [Paralegal], code: 200, input: [], output: MaintenanceFiling, side_effects: ["fees finalized incl. late fee when LATE_FILED"] }
  - { method: POST, path: "/brand/maintenance-filings/{id}/office-decision", description: "SUBMITTED/LATE_FILED -> ACCEPTED (decision ACCEPTED) or REJECTED_OFFICE (decision REJECTED)", roles: [PartnerAttorney], code: 200, input: [decision], output: MaintenanceFiling, side_effects: ["ACCEPTED advances record windows +10 years and returns record to REGISTERED"] }

  # --- ClearanceSearch ---
  - { method: POST, path: "/brand/clearance-searches", description: "Open a clearance search for a candidate mark", roles: [ClientContact, Paralegal], code: 201, input: [client_id, proposed_mark, proposed_classes, "conflict_hits?"], output: ClearanceSearch, side_effects: ["status=OPEN; unresolved_hit_count/risk_rating computed"] }
  - { method: GET, path: "/brand/clearance-searches", description: "List/filter searches", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "ClearanceSearch[]", side_effects: [] }
  - { method: GET, path: "/brand/clearance-searches/{id}", description: "Read a search", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: ClearanceSearch, side_effects: [] }
  - { method: POST, path: "/brand/clearance-searches/{id}/conflict-hits", description: "Append a conflict hit (disposition OPEN) to an OPEN search", roles: [AssociateAttorney], code: 201, input: [conflicting_mark, severity], output: ClearanceSearch, side_effects: ["unresolved_hit_count/risk_rating recomputed"] }
  - { method: POST, path: "/brand/clearance-searches/{id}/dispose-hit", description: "Set a hit's disposition to WAIVED or BLOCKING by 0-based hit_index", roles: [AssociateAttorney], code: 200, input: [hit_index, disposition], output: ClearanceSearch, side_effects: ["unresolved_hit_count/risk_rating recomputed"] }
  - { method: POST, path: "/brand/clearance-searches/{id}/finalize", description: "OPEN -> CLEARED (no BLOCKING hits) or BLOCKED (any BLOCKING hit); requires unresolved_hit_count == 0", roles: [PartnerAttorney], code: 200, input: [], output: ClearanceSearch, side_effects: [] }

  # --- CustomsRecordation ---
  - { method: POST, path: "/brand/trademark-records/{id}/customs-recordations", description: "Record a mark with a customs authority; buffer-gap rule; optional supersede renewal", roles: [Paralegal], code: 201, input: [customs_authority, recordation_number, term_start, term_end, "supersedes_recordation_id?"], output: CustomsRecordation, side_effects: ["status=ACTIVE; superseded recordation -> RENEWED"] }
  - { method: GET, path: "/brand/customs-recordations", description: "List/filter recordations (supersedes_recordation_id filter finds renewals superseding a given recordation)", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["trademark_record_id?", "customs_authority?", "status?", "supersedes_recordation_id?", "limit?", "offset?"], output: "CustomsRecordation[]", side_effects: [] }
  - { method: GET, path: "/brand/customs-recordations/{id}", description: "Read a recordation", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: CustomsRecordation, side_effects: [] }

  # --- CounterfeitReferral ---
  - { method: POST, path: "/brand/watch-alerts/{id}/counterfeit-referrals", description: "Manual referral; requires confirmed_counterfeit_count >= 3", roles: [AssociateAttorney], code: 201, input: [referral_channel, seizure_lines], output: CounterfeitReferral, side_effects: ["estimated_damages_cents computed; auto_created=false; status=DRAFT"] }
  - { method: GET, path: "/brand/counterfeit-referrals", description: "List/filter referrals", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: ["watch_alert_id?", "enforcement_matter_id?", "status?", "auto_created?", "limit?", "offset?"], output: "CounterfeitReferral[]", side_effects: [] }
  - { method: GET, path: "/brand/counterfeit-referrals/{id}", description: "Read a referral", roles: [Paralegal, AssociateAttorney, PartnerAttorney, ClientContact], code: 200, input: [], output: CounterfeitReferral, side_effects: [] }
  - { method: POST, path: "/brand/counterfeit-referrals/{id}/refer", description: "DRAFT -> REFERRED; CUSTOMS_SEIZE requires an ACTIVE recordation on the record", roles: [PartnerAttorney], code: 200, input: [], output: CounterfeitReferral, side_effects: [] }
  - { method: POST, path: "/brand/counterfeit-referrals/{id}/acknowledge", description: "REFERRED -> ACKNOWLEDGED", roles: [PartnerAttorney], code: 200, input: [], output: CounterfeitReferral, side_effects: [] }

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/brand/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Every set runs the time-based sweep: deadline MISSED transitions, record MAINTENANCE_DUE/CANCELLED, agreement MONITORING/EXPIRED/TERMINATED, recordation EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["runs all time-based auto-transitions at the new clock value"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_VALIDATION, http: 400, condition: "Schema violation: missing required field, unknown field, bad enum/range, assess weights not summing to 1.0, hit_index out of range, allow_late missing on late satisfy, non-positive seizure line entries" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint; ClientContact accessing another client's resource; non-PartnerAttorney attempting late satisfy from MISSED" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not declared from the entity's current state; terminal-state lockdown; cross-entity state precondition failure (record CANCELLED, alert not TRIAGED+, escalate type vs record status mismatch)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version (assess, propose)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver == drafter (letter), verifier == docketed_by (deadline), or verifier == collector (evidence)" }
  - { id: ERR_ENFORCEMENT_BARRED, http: 409, condition: "A non-terminal CoexistenceAgreement on the matter's record bars cease-and-desist issuance" }
  - { id: ERR_OPPOSITION_WINDOW_CLOSED, http: 422, condition: "Escalating an OPPOSITION matter when current_utc > record.opposition_due_at" }
  - { id: ERR_OUTSIDE_FILING_WINDOW, http: 422, condition: "Maintenance submit outside [window_open, window_close] and outside (window_close, grace_close]" }
  - { id: ERR_RESPONSE_WINDOW_OPEN, http: 422, condition: "escalate-litigation from ISSUED while current_utc <= response_due_at" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 422, condition: "escalate with final_score < 70" }
  - { id: ERR_SCORE_ABOVE_DISMISS_CAP, http: 422, condition: "dismiss with final_score >= 40" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "execute would create a territory-and-term overlap (half-open intervals) with a non-terminal agreement on the same record" }
  - { id: ERR_RECORDATION_GAP_VIOLATION, http: 409, condition: "New recordation term_start <= existing recordation term_end + 30 days for the same record and authority (mandatory buffer; adjacency forbidden)" }
  - { id: ERR_ROUND_CAP_REACHED, http: 422, condition: "propose from COUNTERED when round_count >= 8" }
  - { id: ERR_APPEAL_CAP_REACHED, http: 422, condition: "appeal when appeal_count >= 2" }
  - { id: ERR_EXTENSION_CAP_REACHED, http: 422, condition: "extend when extension_count >= max_extensions" }
  - { id: ERR_UNRESOLVED_HITS, http: 422, condition: "finalize with any conflict hit still disposition == OPEN" }
  - { id: ERR_INCOMPLETE_CLASS_COVERAGE, http: 422, condition: "Maintenance submit where the listed VERIFIED evidence does not cover every nice_class of the record" }
  - { id: ERR_EVIDENCE_RECORD_MISMATCH, http: 422, condition: "Maintenance filing lists an evidence item belonging to a different record" }
  - { id: ERR_EVIDENCE_NOT_VERIFIED, http: 422, condition: "Maintenance filing lists an evidence item not in VERIFIED status" }
  - { id: ERR_EVIDENCE_STALE, http: 422, condition: "Maintenance filing lists a specimen dated before maintenance_window_close - 36 months" }
  - { id: ERR_CLASS_NOT_ON_RECORD, http: 422, condition: "Evidence item nice_class not in the record's nice_classes" }
  - { id: ERR_RECORD_NOT_REGISTERED, http: 409, condition: "Maintenance submit or customs recordation on a record not in {REGISTERED, MAINTENANCE_DUE}" }
  - { id: ERR_MATTER_NOT_ACTIVE, http: 409, condition: "Docketing a deadline or drafting a letter on a matter that is not ACTIVE; issuing a letter whose matter is not ACTIVE" }
  - { id: ERR_PENDING_DEADLINES, http: 409, condition: "Resolving a matter with open_deadline_count > 0" }
  - { id: ERR_REFERRAL_THRESHOLD_NOT_MET, http: 422, condition: "Manual counterfeit referral with confirmed_counterfeit_count < 3" }
  - { id: ERR_CUSTOMS_RECORDATION_REQUIRED, http: 422, condition: "refer with channel CUSTOMS_SEIZE and no ACTIVE CustomsRecordation on the alert's record" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Fee accrual would exceed client.enforcement_budget_cents (issue, reissue, takedown file)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations administrator; manages clients and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /brand/clients", "POST /brand/_clock/set_current_utc"]
    shared_operations: ["GET /brand/clients/{id}"]
  - name: Paralegal
    description: "Docketing and intake staff; triages alerts, dockets deadlines, collects evidence, files takedowns, records responses, files breach claims"
    identity: opaque
    exclusive_operations: ["record publish/register", "alert triage", "deadline docket/extend", "takedown create/file/platform-response/appeal", "evidence collection", "maintenance filing create/submit", "agreement breach", "customs recordation create", "letter record-response"]
    shared_operations: ["deadline satisfy (timely only)", "clearance search create", "all GET endpoints", "alert intake"]
  - name: AssociateAttorney
    description: "Junior counsel; assesses alerts, escalates matters, drafts letters, negotiates agreements, disposes clearance hits, creates manual referrals"
    identity: opaque
    exclusive_operations: ["alert assess/monitor/dismiss/escalate", "letter draft/issue/reissue", "agreement create/propose/counter", "conflict-hit record/dispose", "manual referral create"]
    shared_operations: ["deadline docket/verify", "evidence collection/verify/reject", "letter submit-review/void", "all GET endpoints"]
  - name: PartnerAttorney
    description: "Senior counsel; approves letters (never own-drafted), verifies deadlines and evidence (never own work), resolves/reopens matters, executes agreements, decides office actions, finalizes clearances, refers referrals, late-satisfies deadlines"
    identity: opaque
    exclusive_operations: ["letter approve/escalate-litigation", "matter resolve/reopen", "agreement execute/cure", "maintenance office-decision", "clearance finalize", "referral refer/acknowledge", "late satisfy from MISSED"]
    shared_operations: ["deadline verify", "evidence verify/reject", "letter draft/submit-review/void", "all GET endpoints"]
  - name: ClientContact
    description: "Brand-owner contact; X-User-ID equals the Client id; scoped to own client's resources"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations: ["trademark record create (own client_id)", "clearance search create (own client_id)", "all GET endpoints (own client scope)"]
  - name: WatchService
    description: "External watch-service integration; submits alert intake batches"
    identity: opaque
    exclusive_operations: ["POST /brand/watch-alerts"]
    shared_operations: []
