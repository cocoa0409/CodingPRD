              as: Dispatcher
              captures: { w1: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "HEAD_REPAIR", estimated_minutes: 60, estimated_cost_cents: 2000 }
              as: Dispatcher
              captures: { w2: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-04" }
              as: Dispatcher
              captures: { route_id: $.data.id, rv0: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${w1}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${rv0}" }
              as: Dispatcher
