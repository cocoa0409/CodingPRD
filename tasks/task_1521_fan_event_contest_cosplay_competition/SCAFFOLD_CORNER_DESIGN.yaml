  # ================================================== cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_category_update_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[category-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential PATCHes carrying the same observed category version: the first succeeds (version 1 -> 2), the second is rejected 412 ERR_STALE_VERSION because its expected_category_version is stale."
        test_recipe:
          setup: ["Contest SETUP (no transition — cascades would bump versions); category created, version captured from the create response"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id, cat_v: $.data.version } }
          trigger:
            - { call: "PATCH /categories/${cat}", payload: { max_entries: 9, expected_category_version: "${cat_v}" }, as: ContestLead, captures: { cat_v2: $.data.version } }
            - { call: "PATCH /categories/${cat}", payload: { max_entries: 7, expected_category_version: "${cat_v}" }, as: ContestLead, captures: { err: $.data.error_id } }
          assert:
            - "First PATCH: 200, version advanced from 1 to 2, max_entries == 9"
            - "Second PATCH with the stale captured version: 412 ERR_STALE_VERSION; max_entries stays 9"

      - name: occ_entry_update_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[entry-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on a different parent entity (Entry): an edit based on a pre-mutation version is rejected; the second writer must re-read."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; entry SUBMITTED, version captured at creation"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id, e_v: $.data.version } }
          trigger:
            - { call: "PATCH /entries/${e}", payload: { title: "Renamed", expected_entry_version: "${e_v}" }, as: Contestant, as_user_id: "${c1}", captures: { e_v2: $.data.version, e_t2: $.data.title } }
            - { call: "PATCH /entries/${e}", payload: { title: "Hijack", expected_entry_version: "${e_v}" }, as: Contestant, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "First PATCH: 200, title == Renamed, version == 2"
            - "Second PATCH replaying version 1: 412 ERR_STALE_VERSION; title stays Renamed"

      - name: category_entry_count_reconciles_on_withdraw
        claim_type: derived_field_reconciliation
        grounds: [entities.Category.fields.entry_count, state_machines.Entry.SUBMITTED_to_WITHDRAWN]
        distinguishing_aspect: "The denormalized Category.entry_count tracks only non-terminal entries: 2 after two creates, 1 after one withdraw — recompute happens as part of the withdraw cascade, visible immediately."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; category with entries from c1 and c2"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [] }, as: Contestant, as_user_id: "${c2}" }
            - { call: "GET /categories/${cat}", payload: {}, as: ContestLead, captures: { n_before: $.data.entry_count } }
          trigger:
            - { call: "POST /entries/${e1}/withdraw", payload: {}, as: Contestant, as_user_id: "${c1}" }
            - { call: "GET /categories/${cat}", payload: {}, as: ContestLead, captures: { n_after: $.data.entry_count } }
          assert:
            - "entry_count == 2 before withdraw, == 1 after (WITHDRAWN excluded from the count)"

  # ================================================== rbac
  - section: rbac
    instances:
      - name: rbac_contestant_cannot_create_category
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "ContestLead-only endpoint invoked as Contestant: 403 ERR_FORBIDDEN before any payload or existence check."
        test_recipe:
          setup: ["Contest and contestant exist"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Sneaky", skill_division: "NOVICE", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 1000 }, as: Contestant, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "403 ERR_FORBIDDEN"

      - name: rbac_judge_cannot_perform_safety_check
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "Peer-role isolation: Judge (entity-backed) touching the SafetyOfficer-exclusive check-in endpoint is denied even for a valid entry."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; entry SUBMITTED; judge exists"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
          trigger:
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: Judge, as_user_id: "${j1}", captures: { err: $.data.error_id } }
          assert:
            - "403 ERR_FORBIDDEN; entry safety_status remains PENDING"

  # ================================================== errors (catalog sweep for codes not asserted elsewhere)
  - section: errors
    instances:
      - name: error_not_found_on_entry_create_covered
