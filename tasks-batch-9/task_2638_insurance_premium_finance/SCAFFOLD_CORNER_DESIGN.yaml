            - "STILL ACTIVE BUT NO LONGER RESTRUCTURABLE: ${dw_e_restructure} == 'ERR_RESTRUCTURE_NOT_ELIGIBLE' at HTTP 422 and NOT ERR_AGREEMENT_STATE_INVALID — status is ACTIVE so priority 11 passes, and it is delinquency_stage == CANCELLATION_REQUESTED that priority 41 refuses"
            - "${dw_req_status} == 'REQUESTED', ${dw_req_computed} == 516164, ${dw_req_method} == 'PRO_RATA' and ${dw_req_eff} == '2026-10-22'; five installments were voided, so GET /agreements/${dw_agr}/installments?status=VOIDED returns total_count == 5 while installment 1 stays PAST_DUE"
            - "the short return posts and reports its shortfall: ${dw_req_status2} == 'RETURN_POSTED' and ${dw_variance} == -216164 == 300000 - 516164"
            - "REPORTING TWICE IS REFUSED: ${dw_e_request_state} == 'ERR_CANCEL_REQUEST_STATE_INVALID' at HTTP 409, and ${dw_pol_ret} == 300000 — the second attempt credited nothing"
            - "the credit ran in the pinned post-cancellation order: ${dw_pr} == 202000 == 502000 - 300000, ${dw_ufc} == 0 (already rebated to zero), ${dw_lf} == 4497 untouched and ${dw_credit} == 0, with ${dw_recv} == 300000"
            - "the deficiency closes the note: deficiency_before_fee == 202000 + 0 + 4497 - 0 == 206497, which exceeds DEFICIENCY_FEE_TIER1_MAX_CENTS 25000 so the fee is 5000, giving ${dw_def} == 211497 and ${dw_status} == 'CANCELLED_DEFICIENT'"
            - "the chargeback is commission-capped: commission == round_half_up(600000 * 1200 / 10000) == 72000, so ${dw_cb_amount} == ${dw_cb_amt} == 72000 == min(211497, 72000), ${dw_cb_basis} == 'COMMISSION_CAPPED' and ${dw_cb_status} == 'PENDING'"
            - "SETTLEMENT RESIDUAL IS ZERO: (539650 + 4497) - (0 + 37650 + 300000 + 206497 + 0) == 0, so every cent of the note is paid, rebated, returned by the carrier or still owed"
            - "OVER THE RESERVE: ${dw_e_reserve} == 'ERR_OFFSET_EXCEEDS_RESERVE' at HTTP 422 for 100001 against a reserve of ${dw_reserve0} == 100000"
            - "OVER THE REMAINDER: ${dw_e_remainder} == 'ERR_OFFSET_EXCEEDS_RESERVE' at HTTP 422 for 80000, which the reserve could fund but which exceeds the unsettled 72000 — both clauses of priority 40 report the same code"
            - "a legal partial offset lands: ${dw_cb_status2} == 'PARTIALLY_OFFSET', ${dw_cb_applied1} == 50000 and ${dw_cb_v2} == ${dw_cb_v1} + 1"
            - "STALE TOKEN BETWEEN TWO LEGAL OFFSETS: replaying ${dw_cb_v1} gives ${dw_e_stale} == 'ERR_STALE_CHARGEBACK_VERSION' at HTTP 412, and retrying with ${dw_cb_v2} succeeds with ${dw_cb_status3} == 'OFFSET', ${dw_cb_applied2} == 72000 and ${dw_cb_v3} == ${dw_cb_v2} + 1"
            - "SETTLED MEANS CLOSED: ${dw_e_cb_state} == 'ERR_CHARGEBACK_STATE_INVALID' at HTTP 409 on a further 100"
            - "the agency's books agree: ${dw_reserve_end} == 28000 == 100000 - 72000, ${dw_outstanding_end} == 0 and ${dw_agent_status} == 'ACTIVE' (72000 never reached the 500000 liability cap)"
            - "${dw_pol_status} == 'CANCELLED', and the producing agency can read its own chargeback: ${dw_cb_final_status} == 'OFFSET' with ${dw_cb_final_applied} == 72000"
            - "CODES CLOSED HERE: ERR_NOTICE_WINDOW_OPEN, ERR_NOTICE_PERIOD_NOT_ELAPSED, ERR_RESTRUCTURE_NOT_ELIGIBLE, ERR_CANCEL_REQUEST_STATE_INVALID, ERR_OFFSET_EXCEEDS_RESERVE, ERR_STALE_CHARGEBACK_VERSION, ERR_CHARGEBACK_STATE_INVALID"

      - name: error_triggerable_statutory_ceiling_and_incoherent_filter_pair
        claim_type: error_triggerable
        grounds:
          - validations.priority_28_ERR_RATE_ABOVE_STATE_MAXIMUM
          - validations.priority_20_ERR_POLICY_AGREEMENT_MISMATCH
        distinguishing_aspect: |
          Two codes that nothing else reaches. The first is the ceiling ABOVE the exception: compliance
          may grant a rate exception, but never one that breaks the state's statutory maximum, so an
          override of one basis point over the ceiling is refused while an override exactly AT the
          ceiling is granted — the exception mechanism is bounded by the same number it is meant to
          bend. The second is referential coherence on a read: an agreement_id and a policy_id that
          name different notes are refused rather than answered with a misleadingly empty page, and the
          coherent pair on the same data returns 200.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime caps the annual rate at 1800 bps"
            - "note A and note B each carry one policy, so a policy of B can be paired with A"
            - "the agreement was originated by analyst-origin and every approval below is performed by compliance-approver, so the segregation-of-duties rule at priority 8 is satisfied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { rc_rule: "$.data.id", rc_max_rate: "$.data.max_annual_rate_bps" }
            - call: "POST /state-rate-rules/${rc_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { rc_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { rc_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { rc_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${rc_insured}", producer_agent_id: "${rc_agent}", state_rule_id: "${rc_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { rc_a: "$.data.id", rc_a_flag0: "$.data.rate_exception_approved" }
            - call: "POST /agreements/${rc_a}/policies"
              payload: { insurer_id: "${rc_insurer}", policy_number: "MC-RC-A", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { rc_pol_a: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${rc_insured}", producer_agent_id: "${rc_agent}", state_rule_id: "${rc_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { rc_b: "$.data.id" }
            - call: "POST /agreements/${rc_b}/policies"
              payload: { insurer_id: "${rc_insurer}", policy_number: "MC-RC-B", gross_premium_cents: 400000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { rc_pol_b: "$.data.id" }
          trigger:
            - call: "POST /agreements/${rc_a}/rate-exception-approvals"
              payload: { override_annual_rate_bps: 1801, justification: "national account concession, one basis point over" }
              as: ComplianceOfficer
              as_user_id: "compliance-approver"
              captures: { rc_e_rate: "$.data.error_id" }
            - call: "POST /agreements/${rc_a}/rate-exception-approvals"
              payload: { override_annual_rate_bps: 3000, justification: "aggressive override well past the ceiling" }
              as: ComplianceOfficer
              as_user_id: "compliance-approver"
              captures: { rc_e_rate_far: "$.data.error_id" }
            - call: "POST /agreements/${rc_a}/rate-exception-approvals"
              payload: { override_annual_rate_bps: 1800, justification: "priced at the statutory ceiling" }
              as: ComplianceOfficer
              as_user_id: "compliance-approver"
              captures: { rc_ok_flag: "$.data.rate_exception_approved", rc_ok_rate: "$.data.approved_annual_rate_bps", rc_ok_by: "$.data.rate_exception_approved_by_user_id", rc_ok_ver: "$.data.version" }
            - call: "GET /carrier-cancellation-requests"
              payload: { agreement_id: "${rc_a}", policy_id: "${rc_pol_b}", limit: 50 }
              as: ComplianceOfficer
              captures: { rc_e_mismatch: "$.data.error_id" }
            - call: "GET /carrier-cancellation-requests"
              payload: { agreement_id: "${rc_a}", policy_id: "${rc_pol_a}", limit: 50 }
              as: ComplianceOfficer
            - call: "GET /carrier-cancellation-requests"
              payload: { agreement_id: "${rc_b}", limit: 50 }
              as: ComplianceOfficer
            - call: "GET /agreements/${rc_a}"
              payload: {}
              as: FinanceAnalyst
              captures: { rc_a_flag: "$.data.rate_exception_approved", rc_a_rate: "$.data.approved_annual_rate_bps", rc_a_cap: "$.data.approved_service_fee_cap_cents" }
          assert:
            - "${rc_max_rate} == 1800 and ${rc_a_flag0} == false at creation"
            - "ONE BASIS POINT OVER IS STILL OVER: ${rc_e_rate} == 'ERR_RATE_ABOVE_STATE_MAXIMUM' at HTTP 422 for 1801, and ${rc_e_rate_far} == 'ERR_RATE_ABOVE_STATE_MAXIMUM' for 3000 — the exception cannot exceed the number it exists to bend"
            - "EXACTLY AT THE CEILING IS GRANTED: the 1800 approval returns 200 with ${rc_ok_flag} == true, ${rc_ok_rate} == 1800 and ${rc_ok_by} == 'compliance-approver'"
            - "the refusals wrote nothing: ${rc_ok_ver} == 2, meaning exactly one of the three approval attempts incremented version"
            - "${rc_a_flag} == true, ${rc_a_rate} == 1800 and ${rc_a_cap} is null — omitting override_service_fee_cents left the service-fee cap alone"
            - "INCOHERENT FILTER PAIR IS REFUSED: GET /carrier-cancellation-requests?agreement_id=${rc_a}&policy_id=${rc_pol_b} returns ${rc_e_mismatch} == 'ERR_POLICY_AGREEMENT_MISMATCH' at HTTP 409, because ${rc_pol_b} hangs off note B"
            - "the coherent pair is answered normally: GET /carrier-cancellation-requests?agreement_id=${rc_a}&policy_id=${rc_pol_a} returns 200 with total_count == 0 and has_more == false, as does GET /carrier-cancellation-requests?agreement_id=${rc_b} — an empty page and a refusal are different answers"
            - "CODES CLOSED HERE: ERR_RATE_ABOVE_STATE_MAXIMUM, ERR_POLICY_AGREEMENT_MISMATCH"

  # ---------------------------------------------------------------------------
  # §1.9 — Table 7 (RBAC). role_model == segregation_of_duties, and three of the
  # five roles are entity_backed, so the section covers the endpoint-level role
  # matrix, row-level ownership for the backed roles, and the two same-user
  # separation rules at priorities 8 and 9.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: exclusive_operations_role_matrix_and_authorization_before_existence
        claim_type: exclusive_operations
        grounds:
          - roles.FinanceAnalyst.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED_ROLE
          - validations.priority_1_ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The two operating roles are deliberately disjoint: compliance owns the rate regimes, licences,
          agencies, waivers, sweeps and offsets, and may NEVER originate or activate a note, while the
          analyst owns origination and servicing and may never write a rate rule. The whole happy path
          in the setup is therefore already a positive proof that each role can perform its own
          exclusive operations. The refusals then pin two orderings that implementations routinely get
          backwards: priority 1 before priority 2 (a request with no headers is 401, not 403) and
          priority 2 before priority 3 (a wrong role addressing a non-existent id is 403, not 404 — the
          server must not disclose whether the row exists to a caller who may not touch it).
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15"
            - "the full origination path is walked with each call made by the role that exclusively owns it"
            - "the note is activated so that servicing endpoints are addressable"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
