      - name: protest_reopen_cycle_then_second_reopen_rejected
        grounds:
          - state_machines.Protest.status.DECIDED_to_REOPENED
          - state_machines.Protest.status.REOPENED_to_HEARING_SCHEDULED
          - entities.Protest.fields.reopen_count
          - entities.Race.fields.rescore_count
          - validations.priority_41
        distinguishing_aspect: |
          The Protest machine is a different entity from the Race and its cycle is bounded rather than
          unbounded: DECIDED -> REOPENED -> HEARING_SCHEDULED -> HEARD -> DECIDED closes one lap and
          leaves reopen_count 1, and the very same reopen trigger that succeeded on lap one is refused
          on lap two with ERR_REOPEN_LIMIT_REACHED (409). Race.rescore_count is the non-resetting
          witness that the lap really happened - it reads 3 after decide, reopen and decide again -
          while the points themselves return exactly to the pre-decision tie of 1.5 / 1.5 with pool 3.0,
          so the loop is lossless in the ledger and lossy only in the reopen budget.
        test_recipe:
          setup:
            - "Nine club members and two ISSUED TOD_PHRF certificates: A 171.3 and B 218.8."
            - "A LOW_POINT / NONE-discard regatta racing on 2026-08-05, division A CONFIRMED with both entries ACCEPTED, a SEATED jury panel, status RACING, three CONFIRMED whole-regatta duties."
            - "Race 1 at 14:00 over 6.0 nm is STARTED and scored FINAL on a dead heat: both boats correct to 4000.0, so the tie group over slots 1 and 2 gives 1.5 points each and points_pool_total 3.0."
            - "B protests A over the 14:20 incident, files one piece of evidence, the hearing is held at 19:00 and the jury has already decided PENALTY_DSQ against A: A now holds a DSQ result with points 3.0 and discardable false, B holds 1.0, points_pool_total is 4.0 and rescore_count is 1."
            - "The logical clock sits at 2026-08-05T19:00:00Z."
