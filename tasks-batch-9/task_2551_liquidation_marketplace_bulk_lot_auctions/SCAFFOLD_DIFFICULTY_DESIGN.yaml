            - "Listing.${lstn}.listing_status == OPEN and no SaleOrder exists for ${lstn} (nothing was accepted)"

  # ===========================================================================
  # Rule 4 - transitive cascades (each link caused by the previous one)
  #   instance 1: depth 6, triggered by a claim decision
  #   instance 2: depth 4, triggered by the pickup-deadline sweep
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: claim_approval_cascades_through_lot_score_to_seller_probation_tier
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.SaleOrder.PAID_to_REFUND_ISSUED
          - state_machines.SellerAccount.ACTIVE_to_MANIFEST_PROBATION
          - calculations.claim_refund
          - calculations.manifest_accuracy_score
          - calculations.seller_probation_evaluation
          - calculations.commission_tier_assignment
          - entities.SellerAccount.fields.manifest_accuracy_avg
        distinguishing_aspect: |
          One POST of a claim decision propagates six levels deep, and every level is caused strictly
          by the previous one: refund_cents 950400 (1) credits the order and the buyer wallet (2),
          which recomputes Lot.manifest_accuracy_score to 0.830 (3), which recomputes
          SellerAccount.manifest_accuracy_avg to 0.830 (4), which trips ACTIVE -> MANIFEST_PROBATION
          because 0.830 < 0.850 (5), which overrides commission_tier to TIER_PROBATION at 2500 bps
          (6) even though the seller's gross_recovery_rate of 0.2700 would otherwise earn
          TIER_PREFERRED. Stopping the cascade at any level leaves an observably different state.
        test_recipe:
          setup:
            - "Seller, 1-door warehouse, carrier, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Lot S1 is CUSTOMER_RETURNS with lines 100 x 40000 (line 1) and 300 x 20000: declared_unit_count 400, declared_retail_value_cents 10000000."
            - "S1 sells at auction for 2700000, the buyer pays 2987000 in full, and pickup completes at 2026-08-18T14:00:00Z with actual_freight_cents 17000, so the order settles FINAL with total_due_cents 2987000, balance 0, seller_commission_rate_bps 1500 and seller_net_proceeds_cents 2295000; the seller is ACTIVE / TIER_PREFERRED with gross_recovery_rate 0.2700 and manifest_accuracy_avg 1.000 over 0 scored lots."
            - "At 2026-08-19T00:00:00Z (inside the 5-day claim window that closes 2026-08-23T14:00:00Z) the buyer files a UNIT_SHORTAGE claim on line 1 for 80 units with two evidence URLs, so the claim is already UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 1, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/carriers"
              payload: { name: "Keystone Freight", scac_code: "KEYF", daily_pickup_capacity: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { c1: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Gulf Resale Co", tax_id: "B-2001", state_code: "TX", contact_email: "buy@gulf.example", resale_certificate_number: "TX-RC-77", resale_certificate_expires_on: "2027-01-31", requested_credit_limit_cents: 10000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ba: "$.data.id" }
            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
