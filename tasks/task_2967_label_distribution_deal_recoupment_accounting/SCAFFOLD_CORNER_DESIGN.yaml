      - name: physical_run_two_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines[PhysicalRun.status]
          - state_machines[PhysicalRun.reserve_status]
          - state_machines[PhysicalRun.status].transitions[SHIPPED->SHIPPED]
          - state_machines[PhysicalRun.status].transitions[SHIPPED->RECONCILED]
          - state_machines[PhysicalRun.reserve_status].transitions[LIQUIDATED->HELD]
          - calculations.returns_reserve_obligation
        distinguishing_aspect: |
          One row carries two dimensions that must be observed as separate coordinates: recording
          returns is a self-loop that rewrites the whole reserve computation while leaving
          reserve_status at HELD, and a partial liquidation moves the reserve axis to
          PARTIALLY_LIQUIDATED while leaving the fulfilment axis at SHIPPED. Only ONE coupling is
          declared — reaching LIQUIDATED drags the fulfilment axis to RECONCILED, and voiding it
          drags the axis back to SHIPPED. Falsified if a single status field is used for both axes,
          if the self-loop is rejected as a no-op transition, or if partial liquidation prematurely
          reconciles the run.
        test_recipe:
          setup:
            - "one executed deal with a CD release and one physical run: units_planned 1200, unit_manufacturing_cost_cents 250, returns_reserve_pct 0.1000"
            - "the run is manufactured at 1200 units and shipped at 1000 units for 900 cents wholesale, so manufacturing_cost_cents is 300000 and the gross shipped value is 900000"
