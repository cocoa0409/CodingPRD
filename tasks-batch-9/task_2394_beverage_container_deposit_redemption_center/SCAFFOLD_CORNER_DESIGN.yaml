              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /retailers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: UnknownRole
              captures: { err_unauth: $.data.error_id }
            - call: "GET /retailers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: CenterOperator
              as_user_id: "00000000-0000-4000-8000-0000000000ee"
              captures: { err_role: $.data.error_id }
            - call: "GET /retailers/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ProgramAdmin
              captures: { err_missing: $.data.error_id }
          assert:
            - "the first trigger, whose X-User-Role names a role that §1.7 does not declare, has status 401 and $.data.error_id == ERR_UNAUTHENTICATED"
            - "the second trigger has status 403 and $.data.error_id == ERR_UNAUTHORIZED because CenterOperator is not among the roles of GET /retailers/{id}"
            - "the third trigger, repeated with the X-User-ID header omitted, has status 401 and $.data.error_id == ERR_UNAUTHENTICATED"
