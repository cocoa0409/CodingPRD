            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${stu}" }, as: BandDirector, captures: { ent: $.data.id } }
            - { call: "POST /band/audition-entries/${ent}/scores", payload: { judge_id: "J1", musicianship: 80, marching: 80, leadership: 80 }, as: BandDirector }
          trigger:
            - { call: "POST /band/audition-entries/${ent}/scores", payload: { judge_id: "J1", musicianship: 90, marching: 90, leadership: 90 }, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "POST /band/audition-entries/${ent}/scores", payload: { judge_id: "J2", musicianship: 90, marching: 90, leadership: 90 }, as: BandDirector }
          assert:
            - "err == ERR_DUPLICATE_SCORE for repeated judge_id"
