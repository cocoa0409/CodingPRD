              payload: { rationale: "no pipeline fit" }
              as: ResourceManager
              as_user_id: "rm-user-1"
          trigger:
            - call: "POST /bench-spells/${bs_id}/separation-decision"
              payload: { decision: "REJECTED", note: "retain and reskill" }
              as: PracticePartner
              as_user_id: "pp-user-2"
            - call: "POST /bench-spells/${bs_id}/internal-project"
              payload: { internal_project_code: "IP-KM-01" }
              as: ResourceManager
          assert:
            - "after the REJECTED decision: BenchSpell.${bs_id}.state == \"ESCALATED_L2\", separation_decision == \"REJECTED\", separation_decided_by_user_id == \"pp-user-2\", ended_on is still null, escalation_count is still 2"
            - "Consultant.${c1_id}.availability_status == \"BENCH\" and separated_on is null — nothing about the rejection separates anyone"
            - "after the internal-project call: state == \"INTERNAL_PROJECT\", internal_project_code == \"IP-KM-01\", investment_started_on == 2026-09-02"
            - "Consultant.${c1_id}.availability_status == \"INTERNAL_PROJECT\""
            - "PracticeGroup.${pg_id}.bench_headcount == 0 and own_bench_ratio == 0.0000 with posture == \"OPEN\" — an internal project takes the head out of the bench ratio while total_headcount stays 1"
            - "PracticeGroup.${pg_id}.escalated_l2_count == 0 — leaving ESCALATED_L2 decrements the counter"

      - name: terminal_pipeline_state_accepts_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DemandOpportunity.pipeline_status.QUALIFYING_to_CLOSED_LOST
          - validations[priority=8]
          - errors[ERR_OPPORTUNITY_STATE_INVALID]
          - endpoints[POST /demand-opportunities/{id}/close]
        distinguishing_aspect: "A demand abandoned straight from QUALIFYING lands in the CLOSED_LOST terminal state, after which qualify, staffing-mode and a second close are all refused — the row is frozen on both dimensions."
        test_recipe:
          setup:
            - "One QUALIFYING demand, closed LOST without ever being qualified."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
