            - *d1_advance
          trigger:
            - call: "POST /mi/lenders/${d1_lender_id}/status-change"
              payload: { action: "APPROVE" }
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { d12_status: $.data.status }
          assert:
            - "captured ${d12_status} == APPROVED"
            - "FinancialFiling.${d12_filing_id}.adjusted_net_worth_cents == 100000000"
            - "Lender.${d1_lender_id}.required_net_worth_cents == 100000000 (equality passes: >=, not >)"

      - name: mip_cancel_at_exactly_78_percent_balance
        grounds:
          - calculations.annual_mip_and_cancellation
          - errors[ERR_MIP_CANCELLATION_INELIGIBLE]
          - endpoints."POST /mi/loan-cases/{loanCaseId}/mip-events"
        distinguishing_aspect: "Balance-ratio boundary on the mip-events CANCEL endpoint (a different metric and endpoint than the net-worth floor): a PRE_CUTOFF case cancels at current_balance exactly == 78% of the original appraised value (24960000 == round(32000000*0.78)) after 61 months; one cent more (24960001) is rejected."
        test_recipe:
          setup:
            - "Lender APPROVED; case endorsed 2023-06-01 (PRE_CUTOFF), appraised_value_cents 32000000, base 30000000; year-1 ANNUAL billed at 30000000 balance."
            - "Clock advanced to 2028-08-01 (62 complete months: >= 60)."
          setup_api_calls:
            - *d1_clock_2023
            - *d1_lender
            - *d1_filing
            - *d1_filing_accept
            - *d1_advance
            - *d1_approve
            - call: "POST /mi/loan-cases"
              payload: { lender_id: "${d1_lender_id}", borrower_reference: "BOR-PRE", base_loan_amount_cents: 30000000, appraised_value_cents: 32000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 199591 }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d13_case: $.data.id }
            - call: "POST /mi/loan-cases/${d13_case}/appraisals"
              payload: { appraised_value_cents: 32000000, effective_date: "2023-05-15" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d13_app: $.data.id }
            - call: "POST /mi/appraisals/${d13_app}/decide"
              payload: { decision: "ACCEPT" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/loan-cases/${d13_case}/submit-underwriting"
              payload: {}
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
            - call: "POST /mi/loan-cases/${d13_case}/endorsement-review"
              payload: { decision: "ENDORSE" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/loan-cases/${d13_case}/mip-events"
              payload: { event_type: "ANNUAL_BILL", current_balance_cents: 30000000 }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mi/loan-cases/${d13_case}/mip-events"
              payload: { event_type: "CANCEL", current_balance_cents: 24960001 }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d13_over_error: $.data.error_id }
            - call: "POST /mi/loan-cases/${d13_case}/mip-events"
              payload: { event_type: "CANCEL", current_balance_cents: 24960000 }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d13_refund_amount: $.data.amount_cents, d13_refund_type: $.data.entry_type }
          assert:
            - "captured ${d13_over_error} == ERR_MIP_CANCELLATION_INELIGIBLE (24960001 > 78% threshold)"
            - "captured ${d13_refund_type} == REFUND"
            - "captured ${d13_refund_amount} == 0 (no BILLED entry exists for period_index 6, so the REFUND row carries 0; mip_retained_cents stays 200000 = 35000 UFMIP + 165000 period-1 ANNUAL)"
            - "LoanCase.${d13_case}.mip_cancelled == true"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: endorsement_gated_by_lender_approval
        grounds:
          - state_machines.LoanCase.UNDERWRITE_SUBMITTED_to_ENDORSED
          - errors[ERR_LENDER_NOT_APPROVED]
          - entities.LoanCase.fields.lender_id
        distinguishing_aspect: "LoanCase endorsement validity depends on the linked Lender's status (LoanCase -> Lender pair): an endorsement-review ENDORSE while the lender is RETURNED (not APPROVED) fails with ERR_LENDER_NOT_APPROVED even though the case itself and its appraisal are fully valid."
        test_recipe:
          setup:
            - "Lender in FIELD_REVIEW (never approved)."
            - "LoanCase creation requires APPROVED lender, so the case is created against an APPROVED lender that is then RETURNED? RETURN only from DESK/FIELD review — use a second lender in FIELD_REVIEW and attempt case creation directly (create also gates), plus attempt endorsement on a case whose lender was SUSPENDED... pinned flow: lender approved, case created+submitted with ACCEPTED appraisal, then lender suspended, endorsement attempted on the BLOCKED case -> ERR_CASE_BLOCKED vs ERR_LENDER_NOT_APPROVED. To isolate the referential gate, use case CREATE against the un-approved lender for ERR_LENDER_NOT_APPROVED, and endorsement against the suspended lender's BLOCKED case for ERR_CASE_BLOCKED."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d14_filing_id: $.data.id }
            - call: "POST /mi/financial-filings/${d14_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - call: "POST /mi/lenders"
              payload: { legal_name: "Never Approved Lending", institution_type: "MORTGAGEE_SUPERVISED", home_state: "OH", qc_plan_on_file: true }
              as: PlatformAdmin
              captures: { d14_lender2: $.data.id }
          trigger:
            - call: "POST /mi/loan-cases"
              payload: { lender_id: "${d14_lender2}", borrower_reference: "BOR-X", base_loan_amount_cents: 10000000, appraised_value_cents: 12000000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 60000 }
              as: LenderOfficer
              as_user_id: "${d14_lender2}"
              captures: { d14_error: $.data.error_id }
          assert:
            - "captured ${d14_error} == ERR_LENDER_NOT_APPROVED"
            - "no LoanCase row exists for lender ${d14_lender2}"

      - name: claim_gated_by_loss_mitigation_waterfall_exhaustion
        grounds:
          - state_machines.LoanCase.IN_DEFAULT_to_CLAIM_FILED
          - errors[ERR_WATERFALL_NOT_EXHAUSTED]
          - entities.InsuranceClaim.fields.loan_case_id
        distinguishing_aspect: "InsuranceClaim creation depends on the states of the case's LossMitigationAction rows (InsuranceClaim -> LossMitigationAction pair — different entity pair than LoanCase -> Lender): with only tiers 1-5 INFEASIBLE and tier 6 missing, claim filing fails ERR_WATERFALL_NOT_EXHAUSTED; after tier 6 is evaluated FAILED, the identical claim payload succeeds."
        test_recipe:
          setup:
            - "Lender APPROVED; case endorsed 2026-09-01, defaulted 2026-10-01; tiers 1-5 evaluated INFEASIBLE; tier 6 absent."
            - "Clock at 2026-10-02."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d15_filing_id: $.data.id }
            - call: "POST /mi/financial-filings/${d15_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - *d1_approve
            - *c_case
            - *c_appraisal
            - *c_appraisal_accept
            - *c_submit
            - *c_endorse
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_default
            - *c_lm1
            - *c_lm1_eval
            - *c_lm2
            - *c_lm2_eval
            - *c_lm3
            - *c_lm3_eval
            - *c_lm4
            - *c_lm4_eval
            - *c_lm5
            - *c_lm5_eval
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mi/loan-cases/${c_case_id}/claims"
              payload: { claim_type: "CONVEYANCE", unpaid_principal_balance_cents: 19000000, expense_items: [] }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d15_error: $.data.error_id }
            - *c_lm6
            - *c_lm6_eval
            - call: "POST /mi/loan-cases/${c_case_id}/claims"
              payload: { claim_type: "CONVEYANCE", unpaid_principal_balance_cents: 19000000, expense_items: [] }
              as: ServicerOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d15_claim_id: $.data.id, d15_claim_status: $.data.status, d15_claim_total: $.data.total_claim_cents }
          assert:
            - "captured ${d15_error} == ERR_WATERFALL_NOT_EXHAUSTED (tier 6 unevaluated)"
            - "after tier 6 FAILED: captured ${d15_claim_status} == UNDER_REVIEW"
            - "captured ${d15_claim_total} == 16150000 (round_half_up(19000000 * 0.85))"
            - "LoanCase.${c_case_id}.status == CLAIM_FILED"
