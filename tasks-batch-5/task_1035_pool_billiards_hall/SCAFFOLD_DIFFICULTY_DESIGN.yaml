              payload: { email: "ov2@x.com", full_name: "OV Two", plan_id: "${o2p}" }
              as: Manager
              captures: { o2m: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 12, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
              captures: { o2t1: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 13, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
              captures: { o2t2: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${o2m}", table_id: "${o2t1}", start_at: "2026-07-08T10:00:00Z", end_at: "2026-07-08T12:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { o2r: "$.data.id" }
            - call: "POST /v1/reservations/${o2r}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/events"
              payload: { host_member_id: "${o2m}", table_count: 2, start_at: "2026-07-08T10:00:00Z", end_at: "2026-07-08T12:00:00Z" }
              as: Member
              as_user_id: "${o2m}"
              captures: { o2e: "$.data.id" }
          trigger:
            - call: "POST /v1/events/${o2e}/quote"
              payload: {}
              as: Manager
              captures: { erro2: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_EVENT_CAPACITY_UNAVAILABLE"
            - "Event.${o2e}.booking_status == INQUIRY"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: entry_withdraw_conserves_wallet_plus_prizepool
