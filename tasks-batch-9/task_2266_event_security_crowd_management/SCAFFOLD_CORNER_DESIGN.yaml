  - name: duplicate_license_number_is_rejected_across_guards_and_subcontractors
    claim_type: violation_to_error
    grounds:
    - validations[priority=26]
    - errors.ERR_DUPLICATE_LICENSE_NUMBER
    - entities.Guard.fields.license_number
    - entities.Subcontractor.fields.license_number
    distinguishing_aspect: |
      This is the only uniqueness constraint in §1.4 that spans TWO entities, so all four cross-products have to be probed: guard-vs-guard, guard-vs-vendor, vendor-vs-vendor and vendor-vs-guard. An implementation with a per-table unique index passes half of them and fails the other half, which no single-entity claim would reveal.
