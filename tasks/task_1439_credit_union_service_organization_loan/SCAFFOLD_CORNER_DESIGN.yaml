            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BA", legal_name: "Buyer A", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { ba_id: "$.data.id" } }
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-BB", legal_name: "Buyer B", cu_type: "BUYER", total_assets_cents: 20000000000, net_worth_cents: 2000000000 }, as: NetworkAdmin, captures: { bb_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "POST /network/offerings", payload: { servicing_agreement_id: "${ag_id}", pool_name: "Pool A", pool_principal_cents: 100000000, min_share_pct: 0.01, yield_rate_bps: 600, open_at: "2026-08-01T00:00:00Z", close_at: "2026-12-01T00:00:00Z" }, as: OriginatorUser, as_user_id: "${orig_id}", captures: { off_id: "$.data.id" } }
            - { call: "POST /network/offerings/${off_id}/open", payload: {}, as: OriginatorUser, as_user_id: "${orig_id}" }
            - { call: "POST /network/commitments", payload: { offering_id: "${off_id}", committed_amount_cents: 10000000 }, as: BuyerUser, as_user_id: "${ba_id}", captures: { cert_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/commitments/${cert_id}/approve-diligence", payload: {}, as: BuyerUser, as_user_id: "${bb_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER"

      - name: finding_verify_same_recorder_segregation
        claim_type: segregation_of_duties
        grounds: ["state_machines.ExamFinding.VERIFYING_to_CLOSED", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The RegulatorUser whose X-User-ID recorded the finding cannot verify its remediation -> ERR_SEGREGATION_OF_DUTIES; a different regulator succeeds."
        test_recipe:
          setup: ["Exam IN_PROGRESS; finding recorded by reg-1; remediation submitted (VERIFYING)"]
          setup_api_calls:
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/exams", payload: { cuso_id: "${cuso_id}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }, as: RegulatorUser, captures: { exam_id: "$.data.id" } }
            - { call: "POST /network/findings", payload: { exam_id: "${exam_id}", severity: "HIGH", description: "Late remittance postings", remediation_due_date: "2026-10-01T00:00:00Z" }, as: RegulatorUser, as_user_id: "reg-1", captures: { find_id: "$.data.id" } }
            - { call: "POST /network/findings/${find_id}/submit-remediation", payload: { remediation_notes: "Fixed posting job" }, as: CUSOOfficer, as_user_id: "${cuso_id}" }
          trigger:
            - { call: "POST /network/findings/${find_id}/verify", payload: { verification_passed: true }, as: RegulatorUser, as_user_id: "reg-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /network/findings/${find_id}/verify", payload: { verification_passed: true }, as: RegulatorUser, as_user_id: "reg-2", captures: { ok_status: "$.data.status" } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (verifier == recorder)"
            - "ok_status == CLOSED (different regulator verifies)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: surveillance_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[surveillance-report-stale-agreement]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a surveillance report with a stale expected_servicing_agreement_version (captured before a prior successful report create bumped it) -> ERR_STALE_VERSION (412); the correct current version succeeds."
        test_recipe:
          setup: ["CUSO with ACTIVE agreement; agreement version captured after activation"]
          setup_api_calls:
            - { call: "POST /network/credit-unions", payload: { charter_number: "CU-ORIG", legal_name: "Originator CU", cu_type: "ORIGINATOR", total_assets_cents: 50000000000, net_worth_cents: 5000000000 }, as: NetworkAdmin, captures: { orig_id: "$.data.id" } }
            - { call: "POST /network/cusos", payload: { legal_name: "CUSO One", service_line: "LENDING" }, as: NetworkAdmin, captures: { cuso_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements", payload: { cuso_id: "${cuso_id}", originator_id: "${orig_id}", servicing_fee_bps: 25, remittance_due_day: 15, day_count_convention: "THIRTY_360" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_id: "$.data.id" } }
            - { call: "POST /network/servicing-agreements/${ag_id}/activate", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}" }
            - { call: "GET /network/servicing-agreements/${ag_id}", payload: {}, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { ag_v: "$.data.version" } }
          trigger:
            - { call: "POST /network/surveillance-reports", payload: { servicing_agreement_id: "${ag_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", expected_servicing_agreement_version: "${ag_v}" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { rep1_id: "$.data.id" } }
            - { call: "POST /network/surveillance-reports", payload: { servicing_agreement_id: "${ag_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z", expected_servicing_agreement_version: "${ag_v}" }, as: CUSOOfficer, as_user_id: "${cuso_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "First create succeeds with the captured version (agreement version then increments by 1)"
            - "err == ERR_STALE_VERSION (second create replays the now-stale version)"
            - "GET /network/surveillance-reports/${rep1_id} status == CURRENT (still the only report)"

      - name: sweep_with_nothing_due_returns_zeros
        claim_type: ops_run_checkpoint
        grounds: ["endpoints"]
        distinguishing_aspect: "A sweep over a network with no due remittances, no expired cure windows, and no past-close offerings changes nothing and reports zeros."
        test_recipe:
          setup: ["One CUSO and one credit union registered; nothing else"]
          setup_api_calls:
