            - call: "POST /nurseries/${nid}/accounts"
              payload: { account_type: "RETAIL", display_name: "Walk-in", ship_to_hardiness_zone: 6 }
              as: SalesClerk
              captures: { aid: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-RB", name: "Wire", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 400 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/inventory-lots"
              payload: { received_qty: 5, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { lot: $.data.id }
            - call: "POST /inventory-lots/${lot}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oid: $.data.id, ov0: $.data.version }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: SalesClerk
            - call: "POST /orders/${oid}/confirm"
              payload: { expected_order_version: "${ov0}" }
              as: SalesClerk
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /orders/${oid}/allocate"
              payload: { expected_order_version: "${ov1}" }
              as: SalesClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: inventory_manager_cannot_create_account
        claim_type: peer_roles
        grounds: ["roles", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "InventoryManager calling POST /nurseries/{id}/accounts (a SalesClerk-exclusive op) returns ERR_INSUFFICIENT_PERMISSIONS (403)."
