            - call: "POST /scan-sessions/${s1_id}/close"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err2: $.data.error_id }
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g_status: $.data.status, g_closed_at: $.data.last_session_closed_at }
          assert:
