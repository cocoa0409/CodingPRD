      - name: stale_case_version_blocks_a_replacement_evaluation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[evaluation-create-stale-case]
          - errors[ERR_STALE_CASE_VERSION]
        distinguishing_aspect: "Creating an evaluation supersedes any earlier one and resets clearance_status, so the case version it consumed is spent; a second creation quoting the original version is refused before it can silently discard the evaluation it never saw."
        test_recipe:
          setup:
            - "one DRAFT case with a single DRAFT evaluation already created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
