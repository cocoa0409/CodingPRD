      - name: retest_limit_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETEST_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / review_field_work_remediation_cycle_third_retest_rejected
          rationale: "That instance walks the bounded FIELD_WORK / FINDINGS_ISSUED / REMEDIATION cycle twice and asserts the third retest is refused with this error id."

      - name: critical_findings_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CRITICAL_FINDINGS_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / review_retest_rejected_while_critical_finding_open
          rationale: "The open-CRITICAL-finding block on retest and close is asserted there, including the pass after the finding is waived."

      - name: term_out_of_range_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TERM_OUT_OF_RANGE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / term_out_of_range_beats_insufficient_capacity_rejected
          rationale: "The term-range violation is the winning error of that priority pair, so the error id already has a dedicated trigger."

      - name: insufficient_capacity_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_BORROWING_CAPACITY]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_eligible_assets_capacity_boundary_rejects_advance
          rationale: "That instance drives capacity to exactly 0 and asserts the capacity error on a 1-cent-over request, which is the tightest possible trigger for this error id."

      - name: member_scope_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_SCOPE_VIOLATION]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / member_scope_beats_stale_version_returns_4XX
          rationale: "The cross-member scope violation is triggered there on POST /fhlb/advances and asserted to win over the stale-version rule."

      - name: posture_frozen_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_COLLATERAL_POSTURE_FROZEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / advance_fund_rejected_when_member_posture_restricted
          rationale: "That instance asserts the funding-side posture gate (fund requires posture exactly OPEN) with the member in a non-OPEN posture."

      - name: asset_not_eligible_for_safekeeping_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSET_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / safekeeping_receipt_rejected_for_substituted_asset
          rationale: "Booking a receipt against a SUBSTITUTED asset is exactly that instance's trigger."

      - name: review_window_overlap_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVIEW_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / review_window_adjacent_allowed_overlap_rejected
          rationale: "Half-open interval semantics, the legality of adjacency and the rejection of a one-day overlap are all asserted there."

      - name: custody_window_conflict_error_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTODY_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / custody_window_buffer_boundary_conflict_rejected
          rationale: "The closed-window-plus-two-day-buffer semantics on safekeeping receipts are asserted there against a different resource entity."

  # =========================================================================
  # SECTION 7 — RBAC (segregation-of-duties role model)
  # =========================================================================
  - section: rbac
    instances:
      - name: custodian_performs_all_of_its_exclusive_operations
        claim_type: role_can_perform_own_operations
        grounds: ["roles.CollateralCustodian.exclusive_operations", "roles.CollateralCustodian.shared_operations"]
        distinguishing_aspect: "The custodian is the only role that may touch loan-file documentation and safekeeping, and it must be able to run its whole exclusive set end to end (documentation PATCH, receipt creation, receipt confirmation) without any credit authority."
        test_recipe:
          setup: ["Harbor Savings tier 1 with an executed BLANKET_LIEN pledge and one submitted SF_MORTGAGE (still UNDER_REVIEW)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "PATCH /fhlb/collateral-assets/${asset_sf}/documentation"
              payload: { documentation_status: "COMPLETE", custody_location: "FHLB_SAFEKEEPING" }
              as: CollateralCustodian
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
              payload: { file_count: 1, delivery_date: "2026-08-01T00:00:00Z", return_date: "2026-09-01T00:00:00Z" }
              as: CollateralCustodian
              captures: { receipt_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/safekeeping-receipts/${receipt_id}/confirm"
            payload: { outcome: "RECEIVED" }
            as: CollateralCustodian
          assert:
            - "every custodian call above returns 2XX: the documentation PATCH, the receipt creation and the confirmation"
            - "the receipt is RECEIVED and the asset's effective_listing_mode is \"DELIVERED\" with discount_factor_bps 9200 and lendable_value_cents 18400000"
            - "GET /fhlb/safekeeping-receipts/{receipt_id} and GET /fhlb/collateral-assets/{asset_sf} both succeed for the custodian (its shared read set)"
            - "GET /fhlb/advances/{any advance id} is refused for the custodian with ERR_UNAUTHORIZED, since advances are outside its shared read set"

