            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:30:00Z" }
              as: Receptionist
              captures: { appt_touch: $.data.id }
            - call: "POST /appointments"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", barber_id: "${b_id}", chair_id: "${chair_id}", service_item_id: "${svc_id}", start_utc: "2026-06-10T10:15:00Z" }
