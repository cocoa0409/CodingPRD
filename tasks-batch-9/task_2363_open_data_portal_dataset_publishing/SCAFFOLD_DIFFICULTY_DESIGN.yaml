        distinguishing_aspect: |
          engagement_index 33.90 gives 0.45 * 33.90 + 0.35 * 96 = 48.8550 exactly, so round_half_up must
          return 48.86; truncation or banker's rounding returns 48.85, and the assertion distinguishes the
          two at the third decimal.
