      - name: conditional_validation_share_purpose_without_vendor_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=29]", "errors[ERR_VENDOR_REQUIRED_FOR_DISCLOSURE]", "entities.ProcessingPurpose.fields.third_party_disclosure_required"]
        distinguishing_aspect: "The rule fires only for purposes whose third_party_disclosure_required is true: a mapping on a SHARE purpose with vendor_id omitted is refused, while the same call on a COLLECT purpose is created as PROPOSED."
        test_recipe:
          setup: ["logical clock at 2026-08-05T00:00:00Z", "one AppProduct with one DIAGNOSIS element, one COLLECT purpose and one SHARE purpose"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
