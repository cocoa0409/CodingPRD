# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Flight Dispatch & Release Management — 9 rules x >=2 instances (20 total)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: trip_fuel_forecast_vs_worst_case_divergence
        grounds:
          - calculations.trip_fuel
          - entities.FlightPlan.fields.wind_assumption
          - entities.FlightPlan.fields.trip_fuel_kg
        distinguishing_aspect: |
          Dual-variant on the FlightPlan domain: identical leg, aircraft and
          inputs except wind_assumption; FORECAST (wind +30 -> ground speed 480)
          yields trip_fuel_kg 6825 / required 9077, WORST_CASE (forced -50 ->
          ground speed 400) yields 8190 / 10511 — same data, two valid
          algorithms, different numbers.
        test_recipe:
          setup:
            - "Stations KAAA (dep), KBBB (arr), KAL1 (alternate, 90nm, runway 2500); Aircraft AC1 (tas 450, burn 2600, oew 42000)"
            - "Dispatcher D1, Captain C1 (qualified A320); two identical legs L1/L2, distance 1200nm"
            - "Logical clock at default 2026-05-01T00:00:00Z (unused by plan create)"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD100", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD200", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg2: $.data.id, leg2_v: $.data.version } }
          trigger:
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan_f: $.data.id } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg2}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "WORST_CASE", expected_leg_version: "${leg2_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan_w: $.data.id } }
          assert:
            - "FlightPlan.${plan_f}.ground_speed_kts == 480 and FlightPlan.${plan_f}.trip_fuel_kg == 6825"
            - "FlightPlan.${plan_f}.contingency_kg == 341 and FlightPlan.${plan_f}.alternate_fuel_kg == 546 and FlightPlan.${plan_f}.final_reserve_kg == 1365 and FlightPlan.${plan_f}.required_fuel_kg == 9077"
            - "FlightPlan.${plan_w}.ground_speed_kts == 400 and FlightPlan.${plan_w}.trip_fuel_kg == 8190 and FlightPlan.${plan_w}.required_fuel_kg == 10511"
            - "FlightPlan.${plan_f}.alternate_station_id == ${alt1} and FlightPlan.${plan_w}.alternate_station_id == ${alt1}"
            - "6825 != 8190 — identical inputs, two variants, different results"

      - name: dispatcher_workload_flat_vs_departure_weighted
        grounds:
          - calculations.dispatcher_workload
          - entities.Dispatcher.fields.workload_leg_count
          - entities.Dispatcher.fields.weighted_load_score
        distinguishing_aspect: |
          Dual-variant on the Dispatcher domain (different entity domain from
          trip_fuel): the same leg set (departures at +1h and +10h from the
          clock) yields flat workload_leg_count 2 but departure-weighted
          weighted_load_score 4 (tier 3 + tier 1).
        test_recipe:
          setup:
            - "Logical clock at default 2026-05-01T00:00:00Z"
            - "Dispatcher D1 (max_active_legs 6), Captain C1, Aircraft AC1, Stations KAAA/KBBB/KAL1"
            - "Leg L_a dep 2026-05-01T01:00:00Z (1h out), leg L_b dep 2026-05-01T10:00:00Z (10h out), both assigned to D1, ops_status SCHEDULED"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD300", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 400, sched_dep_utc: "2026-05-01T01:00:00Z", sched_arr_utc: "2026-05-01T02:00:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg_a: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD301", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 400, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T11:00:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg_b: $.data.id } }
          trigger:
            - { call: "GET /dispatch/dispatchers/${d1}", as: DispatchSupervisor, captures: { flat_v: $.data.workload_leg_count, weighted_v: $.data.weighted_load_score } }
          assert:
            - "Dispatcher.${d1}.workload_leg_count == 2 (flat variant counts both legs equally)"
            - "Dispatcher.${d1}.weighted_load_score == 4 (tier 3 for the +1h leg + tier 1 for the +10h leg)"
            - "2 != 4 — identical leg set, two valid workload algorithms, different scalars"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: required_fuel_multi_input_branching_mode_a
        grounds:
          - calculations.required_fuel
          - calculations.trip_fuel
          - entities.FlightPlan.fields.mel_fuel_penalty_kg
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (wind assumption, OPEN MEL
          penalty %, alternate distance) with a nested max() contingency and a
          conditional MEL branch; WORST_CASE + 3% OPEN MEL penalty yields
          trip 8190, penalty 246, contingency 422 (on the PENALIZED trip),
          required_fuel_kg 10768 — a single final rounding.
        test_recipe:
          setup:
            - "Stations KAAA/KBBB/KAL1; Aircraft AC1; Dispatcher D1; Captain C1"
            - "OPEN MEL item on AC1 with fuel_penalty_pct = 3, deferral_category C, deadline 2026-05-10T00:00:00Z (within 10 days of clock default 2026-05-01T00:00:00Z)"
            - "Leg L1 distance 1200nm assigned to D1"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/mel-items", payload: { aircraft_id: "${ac1}", item_code: "25-1", category: "MEL", deferral_category: "C", repair_deadline_utc: "2026-05-10T00:00:00Z", fuel_penalty_pct: 3 }, as: DispatchSupervisor, captures: { mel1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD110", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
          trigger:
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "WORST_CASE", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
          assert:
            - "FlightPlan.${plan1}.trip_fuel_kg == 8190 (unpenalized)"
            - "FlightPlan.${plan1}.mel_fuel_penalty_kg == 246 (round_half_up(8190 * 3/100))"
            - "FlightPlan.${plan1}.contingency_kg == 422 (max(0.05 * 8435.7, 100) = 421.785 -> 422; contingency is on the PENALIZED trip)"
            - "FlightPlan.${plan1}.alternate_fuel_kg == 546 and FlightPlan.${plan1}.final_reserve_kg == 1365"
            - "FlightPlan.${plan1}.required_fuel_kg == 10768 (single final rounding of 8435.7 + 421.785 + 546 + 1365 = 10768.485)"

      - name: manifest_component_rounding_order_mode_b
        grounds:
          - calculations.manifest_weight_rollup
          - entities.PayloadManifest.fields.total_payload_kg
        distinguishing_aspect: |
          Mode (b) nested rounding: components are rounded half-up FIRST then
          summed — pax 1 x 87.5 -> 88, bags 1 x 12.5 -> 13, cargo 0.4 -> 0,
          total_payload_kg == 101; the sum-then-round order would give
          round_half_up(100.4) == 100. The scaffold pins component-first.
        test_recipe:
          setup:
            - "Stations KAAA/KBBB/KAL1; Aircraft AC1; Dispatcher D1; Captain C1; clock at 2026-05-01T08:00:00Z"
            - "Weather for KBBB [09:00,13:00] ceiling 1000 / vis 5000"
            - "Leg S1 distance 200nm dep 10:00 arr 10:45; plan FORECAST wind +30 computed and LOCKED (required_fuel_kg 3149, contingency floored at 100)"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD120", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T10:45:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT", cruise_altitude_ft: 10000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 1, bags_count: 1, cargo_kg: 0.4 }, as: Dispatcher, as_user_id: "${d1}", captures: { man1: $.data.id } }
          assert:
            - "PayloadManifest.${man1}.pax_weight_kg == 88"
            - "PayloadManifest.${man1}.baggage_kg == 13"
            - "PayloadManifest.${man1}.cargo_billed_kg == 0"
            - "PayloadManifest.${man1}.total_payload_kg == 101 (component-first; sum-then-round would be 100)"
            - "FlightPlan.${plan1}.contingency_kg == 100 (MIN_CONTINGENCY_KG floor branch: 0.05 * 1137.5 = 56.875 < 100) and FlightPlan.${plan1}.required_fuel_kg == 3149"

      - name: max_payload_single_pass_order_mode_c
        grounds:
          - calculations.max_payload_envelope
          - calculations.manifest_weight_rollup
          - entities.PayloadManifest.fields.plan_id
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order:
          manifest weights use the pinned LOCKED plan's frozen fuel figures;
          manifest changes NEVER re-derive fuel. After plan recompute (manifest
          now present -> burn 2782 -> required 9164) and re-lock, the same
          manifest yields takeoff_weight_kg 69250 (was 69077); a further
          manifest PUT leaves FlightPlan.required_fuel_kg at 9250 until an
          explicit recompute.
        test_recipe:
          setup:
            - "Standard chain: KAAA/KBBB/KAL1, AC1, D1, C1, clock 08:00, weather KBBB [09:00,13:00]"
            - "Leg L1 1200nm; plan FORECAST wind +30 computed with NO manifest (zfw_ref 42000 -> burn_eff 2730 -> required 9077) and LOCKED"
            - "Manifest pax 150 / bags 150 / cargo 3000 -> payload 18000, zfw 60000, tow 69077, max_payload 19000, cg 24.57"
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stb}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wxb: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD130", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id, plan1_req_v1: $.data.required_fuel_kg } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
            - { call: "POST /dispatch/manifests", payload: { leg_id: "${leg1}", pax_count: 150, bags_count: 150, cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}", captures: { man1: $.data.id, man1_tow_v1: $.data.takeoff_weight_kg, man1_maxpay_v1: $.data.max_payload_kg } }
            - { call: "POST /dispatch/plans/${plan1}/recompute", as: Dispatcher, as_user_id: "${d1}", captures: { plan1_req_v2: $.data.required_fuel_kg } }
            - { call: "POST /dispatch/plans/${plan1}/lock", as: Dispatcher, as_user_id: "${d1}" }
          trigger:
            - { call: "PUT /dispatch/manifests/${man1}", payload: { cargo_kg: 3000 }, as: Dispatcher, as_user_id: "${d1}", captures: { man1_tow_v2: $.data.takeoff_weight_kg } }
            - { call: "PUT /dispatch/manifests/${man1}", payload: { cargo_kg: 2000 }, as: Dispatcher, as_user_id: "${d1}", captures: { man1_pay_v3: $.data.total_payload_kg } }
            - { call: "GET /dispatch/plans/${plan1}", as: Dispatcher, as_user_id: "${d1}", captures: { plan1_req_after_puts: $.data.required_fuel_kg } }
          assert:
            - "plan1_req_v1 == 9077 (computed with no manifest: zfw_ref 42000 -> burn_eff 2730)"
            - "man1_tow_v1 == 69077 and man1_maxpay_v1 == 19000 (min(19000, 22423, 20248); MZFW term binds)"
            - "plan1_req_v2 == 9164 (recompute sees manifest payload 18000: zfw_ref 60000 -> ceil(6.0)=6 steps -> burn_eff 2756; trip 6890, contingency 345, alternate 551, reserve 1378)"
            - "man1_tow_v2 == 69164 (60000 + frozen 9164) and max_payload_kg still 19000"
            - "man1_pay_v3 == 17000 after cargo 2000"
            - "plan1_req_after_puts == 9164 — manifest PUTs never re-derive plan fuel (single-pass order pinned)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: release_signature_amendment_cycle
        grounds:
          - state_machines.FlightRelease.RELEASED_to_UNDER_AMENDMENT
          - state_machines.FlightRelease.UNDER_AMENDMENT_to_PENDING_SIGNATURES
          - state_machines.FlightRelease.PENDING_SIGNATURES_to_RELEASED
          - entities.FlightRelease.fields.cycle_seq
        distinguishing_aspect: |
          Cyclic machine on FlightRelease: RELEASED -> UNDER_AMENDMENT ->
          PENDING_SIGNATURES -> RELEASED. cycle_seq 1 -> 2 invalidates both
          first-cycle signatures; the release reaches RELEASED a second time
          only after BOTH slots re-sign under cycle 2.
        test_recipe:
          setup:
            - "Standard chain: KAAA/KBBB/KAL1, AC1, D1 (license D001), C1 (license C001), desk K1, shift 06:00-14:00, clock 08:00, weather KBBB [09:00,13:00]"
            - "Leg L1 1200nm; plan FORECAST LOCKED; manifest 150/150/3000; release submitted and signed by both slots -> RELEASED with cycle_seq 1"
          setup_api_calls:
