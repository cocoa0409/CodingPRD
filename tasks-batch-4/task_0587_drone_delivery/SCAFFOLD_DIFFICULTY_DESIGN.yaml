            - "Drone.${drone_id}.status == RESERVED and Battery.${bat_id}.state == READY"

      - name: maintenance_completion_gated_by_installed_battery_readiness
        grounds:
          - state_machines.MaintenanceLog.SCHEDULED_to_COMPLETED
          - state_machines.Drone.GROUNDED_to_IDLE
          - "validations[priority=23]"
          - "errors[ERR_BATTERY_NOT_READY]"
