  - rule_id: priority_pair_validation_conflict
    instances:

      - name: normalize_on_failed_filing_prefers_state_over_zero_field_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_EXTRACTED_FIELDS]
          - state_machines.Filing.RECEIVED_to_EXTRACTION_FAILED
        distinguishing_aspect: |
          A different error-category pair from the license instance: state (priority 5) vs
          business_constraint (priority 7). The filing is in EXTRACTION_FAILED so normalize
          has no declared transition AND the filing has zero ExtractedField rows; the answer
          is the priority-5 ERR_INVALID_STATE, never the priority-7 ERR_NO_EXTRACTED_FIELDS.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust is ACTIVE with one filing in EXTRACTION_FAILED and zero ExtractedField rows, because the only raw line supplied carried the unparseable raw_value \"NOT_A_NUMBER\"."
          setup_api_calls:
            - *clock
            - *cy_org
            - *cy_prog
            - *cy_l1
            - *cy_l2
            - *cy_l3
            - *cy_verify
            - *cy_filing
            - call: "POST /nonprofits/filings/${cy_filing_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "NOT_A_NUMBER", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "POST /nonprofits/filings/${cy_filing_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_state: $.data.error_id }
            - call: "POST /nonprofits/filings/${cy_filing_id}/extract"
              payload: { raw_lines: [] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_zero: $.data.error_id }
          assert:
            - "the first trigger returns 409 and err_state == ERR_INVALID_STATE"
            - "err_state != ERR_NO_EXTRACTED_FIELDS"
            - "Filing.${cy_filing_id}.status is still EXTRACTION_FAILED and extracted_field_count == 0"
            - "the second trigger returns 422 and err_zero == ERR_NO_EXTRACTED_FIELDS, so the priority-7 constraint is real — it is simply outranked"
            - "Filing.${cy_filing_id}.status is still EXTRACTION_FAILED after the empty extract"

