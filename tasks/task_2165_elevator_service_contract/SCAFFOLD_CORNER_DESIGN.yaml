            - "ElevatorCar.${car_e2a}.scheduled_downtime_minutes == 3120"
            - "ElevatorCar.${car_e2b}.scheduled_downtime_minutes == 2880"

  # ===========================================================================
  - section: errors
    instances:

      - name: uptime_report_for_an_unknown_car_returns_car_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CAR_NOT_FOUND]
          - endpoints[GET /elevator-program/cars/{carId}/uptime-report]
        distinguishing_aspect: "The computed-read endpoint performs the same priority-30 existence check as the plain reads and returns 404 ERR_CAR_NOT_FOUND rather than an empty report."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /elevator-program/cars/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/uptime-report"
              payload: { period_month: "2026-08" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_er1: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${e_er1} == \"ERR_CAR_NOT_FOUND\""
            - "response_type == \"error\""

      - name: unknown_renegotiation_round_returns_resource_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints[GET /elevator-program/renegotiations/{roundId}]
        distinguishing_aspect: "Entities without a dedicated 404 code (visits, callbacks, inspections, projects, windows, orders, penalties, rounds) share ERR_RESOURCE_NOT_FOUND, distinct from ERR_CONTRACT_NOT_FOUND and ERR_CAR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /elevator-program/renegotiations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BuildingManager
              as_user_id: "bm-any"
              captures: { e_er2: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${e_er2} == \"ERR_RESOURCE_NOT_FOUND\""

      - name: error_car_red_tagged_trigger_is_already_asserted_by_difficulty_design
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAR_RED_TAGGED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_temporal_downtime_window_on_red_tagged_car
          rationale: "That instance triggers ERR_CAR_RED_TAGGED as the winning error of a dual-failure request, which fully exercises the code."

      - name: error_downtime_window_conflict_trigger_is_already_asserted
        claim_type: violation_to_error
        grounds: ["errors[ERR_DOWNTIME_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / car_downtime_half_open_adjacency_allowed_but_inter_type_buffer_enforced
          rationale: "The buffer-violation trigger in that instance returns ERR_DOWNTIME_WINDOW_CONFLICT directly."

      - name: error_contract_modernization_capacity_trigger_is_already_asserted
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_MODERNIZATION_CAPACITY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / contract_modernization_capacity_uses_closed_calendar_dates_across_cars
          rationale: "That instance's first trigger returns ERR_CONTRACT_MODERNIZATION_CAPACITY."

      - name: error_renegotiation_not_warranted_trigger_is_already_asserted
        claim_type: violation_to_error
        grounds: ["errors[ERR_RENEGOTIATION_NOT_WARRANTED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / performance_score_exactly_at_trigger_threshold_blocks_renegotiation
          rationale: "The exact-boundary instance is the canonical trigger for this error."

      - name: error_part_discontinued_trigger_is_already_asserted
        claim_type: violation_to_error
        grounds: ["errors[ERR_PART_DISCONTINUED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / part_order_blocked_by_discontinued_catalog_part_state
          rationale: "That instance is a direct ERR_PART_DISCONTINUED trigger."

      - name: error_contract_not_active_trigger_is_already_asserted
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONTRACT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_penalty_on_draft_contract_with_no_cars
          rationale: "That instance returns ERR_CONTRACT_NOT_ACTIVE as the winning error."

      - name: assessing_an_active_contract_with_no_cars_returns_no_cars_in_scope
        claim_type: violation_to_error
        grounds:
          - validations[priority=120]
          - errors[ERR_NO_CARS_IN_SCOPE]
          - calculations.penalty_assessment_amount
        distinguishing_aspect: "Once the priority-72 state gate is satisfied (contract ACTIVE) and the period is closed, an empty car_set makes uptime and credit undefined, so the assessment returns 422 ERR_NO_CARS_IN_SCOPE and writes no PenaltyAssessment."
        test_recipe:
          setup:
            - "One ACTIVE contract carrying zero ElevatorCar rows."
            - "Logical clock at 2026-09-01T00:00:00Z, so 2026-08 is closed."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Er Three", building_address: "3 Er St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-e3", contractor_user_id: "sc-e3", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { er3_id: $.data.id }
            - call: "POST /elevator-program/contracts/${er3_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /elevator-program/contracts/${er3_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { er3_v: $.data.version }
          trigger:
            - call: "POST /elevator-program/penalties"
              payload: { contract_id: "${er3_id}", period_month: "2026-08", expected_contract_version: "${er3_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_er3: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${e_er3} == \"ERR_NO_CARS_IN_SCOPE\""
            - "ServiceContract.${er3_id}.status == \"ACTIVE\""
            - "ServiceContract.${er3_id}.penalty_balance_cents == 0"
            - "GET /elevator-program/penalties?contract_id=${er3_id} returns an empty array with total_count == 0"

  # ===========================================================================
  - section: rbac
