            - "GET /app-records/${app_id}/commerce-settlement?period_label=2026-Q1 reports line_count 0 (no revenue has been reported)"

      - name: thirty_two_hours_of_deadline_pressure_lands_the_score_on_exactly_seventy
        claim_type: Constants Applied
        grounds:
          - calculations.review_priority_score.formula
          - calculations.review_priority_score.constants.HIGH_BAND_FLOOR
          - calculations.review_priority_score.constants.SLA_HOURS_BY_BAND
        distinguishing_aspect: "At queued_at + 32h the pressure is 32/48, so 0.30 * 100 * (32/48) == 20.00 exactly and the score moves 50.00 -> 70.00, crossing the inclusive HIGH floor; the band promotion then shortens sla_hours to 24 and rewrites effective_review_deadline_at to queued_at + 24h == 2026-08-02T00:00:00Z, a moment already in the past."
        test_recipe:
          setup:
            - "Build 100 WAITING_FOR_REVIEW, queued_at 2026-08-01T00:00:00Z, standing_score_lifetime 100.00, provisional disclosure score 1.0000, priority_score 50.00 / NORMAL / deadline 2026-08-03T00:00:00Z."
          setup_api_calls: *CH_WAIT
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the response status is 200 and data.current_utc == 2026-08-02T08:00:00Z"
            - "Submission.${sub_id}.priority_score == 70.00 and Submission.${sub_id}.priority_band == HIGH"
            - "Submission.${sub_id}.effective_review_deadline_at == 2026-08-02T00:00:00Z"
            - "Submission.${sub_id}.provisional_deadline_at == 2026-08-03T00:00:00Z (frozen at queue entry, never recomputed)"

      - name: one_hour_short_of_the_boundary_the_band_is_still_normal
        claim_type: Constants Applied
        grounds:
