# =============================================================================
# Scaffold: Exclusive Independent Dealer Distribution & Color System Licensing
# task_3313 — channel-gated dealer network with licensed color formulation,
# equipment calibration gating, territory approval, contractor rewards tiers,
# co-op funds, and formulation-change rematch waves.
# =============================================================================

scenario: |
  Exclusive Independent Dealer Distribution & Color System Licensing (Benjamin
  Moore): independent retailer network with exclusivity commitments restricting
  sales through big-box channels, dealer onboarding with tinting equipment,
  colorant systems and minimum inventory requirements, color formulation
  database licensing with proprietary colorants and machine calibration, dealer
  territory considerations and new dealer approval near existing accounts,
  contractor rewards programs administered through dealers with pricing tiers,
  product line segmentation across dealer-exclusive and specialty lines,
  marketing co-op funds and store branding requirements, product formulation
  changes requiring color rematching and dealer notification.

domain_name: dealer-color-licensing
api_prefix: /dealer-network

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance/audit
  secondary_archetype: pricing engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Region code; unique per region" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: territory_radius_miles, type: number, source: input, description: "Protection radius used by territory conflict checks", constraints: "> 0" }
      - { name: exclusivity_block_threshold_pct, type: number, source: input, description: "Percent of annual net dealer purchase value routed through big-box at which REGION_DIRECTOR override is mandatory (>= blocks, > triggers override-only)", constraints: "0..100" }
      - { name: active_dealer_count, type: integer, source: computed, default: 0, description: "Dealers in this region with status in {ACTIVE, SUSPENDED}" }
      - { name: pending_application_count, type: integer, source: computed, default: 0, description: "DealerApplications in this region with status SUBMITTED" }

  - name: Dealer
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; owning region" }
      - { name: legal_name, type: string, source: input, description: "Legal business name" }
      - { name: latitude, type: number, source: input, description: "Store latitude, degrees" }
      - { name: longitude, type: number, source: input, description: "Store longitude, degrees" }
      - { name: status, type: enum, source: system, description: "APPLIED | ONBOARDING | ACTIVE | SUSPENDED | TERMINATED", constraints: "initial APPLIED" }
      - { name: channel_posture, type: enum, source: computed, default: "INDEPENDENT_ONLY", description: "INDEPENDENT_ONLY | OVERRIDE_REQUIRED | BLOCKED; rederived on every DealerChannelEvent" }
      - { name: bigbox_share_pct, type: number, source: computed, default: 0, description: "100 * confirmed big-box sales cents / total confirmed sales cents over the trailing 12 full calendar months; 0 when denominator is 0" }
      - { name: exclusivity_attested_on, type: datetime, source: input, description: "Date of latest exclusivity attestation; must be within 366 days of now at approve/re-attest" }
      - { name: branding_compliant, type: boolean, source: input, default: false, description: "Store signage / branding requirement met" }
      - { name: coop_accrual_rate, type: number, source: input, description: "Co-op accrual fraction of net invoice value (e.g. 0.02)", constraints: "0..0.10" }
      - { name: coop_balance_cents, type: integer, source: computed, default: 0, description: "Available co-op balance; accrued on paid DealerOrders, drained by approved CoopClaims" }
      - { name: coop_pending_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents on CoopClaims in status SUBMITTED for this dealer" }
      - { name: annual_net_purchase_cents, type: integer, source: computed, default: 0, description: "Net invoiced DealerOrder value in the trailing 12 full calendar months (paid orders only, channel-independent)" }
      - { name: inventory_minimum_met, type: boolean, source: system, default: false, description: "True once an INITIAL_STOCK DealerOrder reaches INVOICED; reset false on terminate" }

  - name: DealerApplication
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; region the applicant wants to join" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; applicant dealer record created at DRAFT" }
      - { name: latitude, type: number, source: input, description: "Proposed store latitude" }
      - { name: longitude, type: number, source: input, description: "Proposed store longitude" }
      - { name: legal_name, type: string, source: input, description: "Applicant legal name" }
      - { name: distance_to_nearest_miles, type: number, source: computed, description: "Haversine miles to nearest dealer with status in {ONBOARDING, ACTIVE, SUSPENDED} in this region; null when none exist" }
      - { name: territory_conflict, type: boolean, source: computed, description: "True iff distance_to_nearest_miles < region.territory_radius_miles" }
      - { name: nearest_dealer_id, type: string, source: computed, description: "FK -> Dealer.id; nearest protected dealer used for the distance check; null when none. Tie-break: smaller distance, then older created_at" }
      - { name: nearest_dealer_notified, type: boolean, source: computed, default: false, description: "Set true by POST /dealer-network/applications/{id}/notify-neighbor; required before override approval when territory_conflict is true" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | WITHDRAWN", constraints: "initial DRAFT" }

  - name: EquipmentUnit
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; installing dealer" }
      - { name: serial_no, type: string, source: input, description: "Unit serial; unique across all equipment" }
      - { name: model, type: string, source: input, description: "Tinting machine model" }
      - { name: colorant_system_id, type: string, source: input, description: "FK -> ColorantSystem.id; colorant system this unit tints for" }
      - { name: installed_on, type: datetime, source: input, description: "Install date" }
      - { name: last_calibrated_on, type: datetime, source: system, description: "Date of latest RECORDED calibration; null until first calibration" }
      - { name: calibration_due_on, type: datetime, source: computed, description: "= last_calibrated_on + 90 days; null until first calibration" }
      - { name: consecutive_failed_calibrations, type: integer, source: system, default: 0, description: "Reset to 0 on PASS calibration; incremented on FAIL" }
      - { name: status, type: enum, source: system, description: "INSTALLED | CALIBRATED | CALIBRATION_OVERDUE | DECOMMISSIONED", constraints: "initial INSTALLED" }

  - name: ColorantSystem
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Colorant system code; unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: generation, type: integer, source: input, description: "Colorant generation number" }
      - { name: annual_license_fee_cents, type: integer, source: input, description: "Annual license fee for this system", constraints: ">= 0" }
      - { name: min_initial_inventory_units, type: integer, source: input, description: "Minimum INITIAL_STOCK order units required for onboarding with this system", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "initial ACTIVE" }

  - name: ProductLine
    parent: ColorantSystem
    common_fields: true
    fields:
      - { name: colorant_system_id, type: string, source: input, description: "FK -> ColorantSystem.id; formulas of this line are pinned to this system" }
      - { name: code, type: string, source: input, description: "Line code; unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: channel_class, type: enum, source: input, description: "DEALER_EXCLUSIVE | SPECIALTY" }
      - { name: base_price_cents, type: integer, source: input, description: "List price per unit in cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", constraints: "initial ACTIVE" }

  - name: ColorFormula
    parent: ProductLine
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; owning line" }
      - { name: code, type: string, source: input, description: "Formula code; unique per product_line_id" }
      - { name: display_name, type: string, source: input, description: "Color name" }
      - { name: formulation_version, type: integer, source: system, default: 1, description: "Incremented by 1 on every FormulationChange that covers this formula" }
      - { name: effective_from, type: datetime, source: input, description: "Formula effective date; must be <= now at creation and at replace" }
      - { name: rematch_pending, type: boolean, source: system, default: false, description: "True while an EFFECTIVE FormulationChange covering this formula has at least one RematchTask still PENDING" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", constraints: "initial ACTIVE" }

  - name: FormulationChange
    parent: ProductLine
    common_fields: true
    fields:
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; affected line" }
      - { name: title, type: string, source: input, description: "Change title" }
      - { name: reason, type: string, source: input, description: "Free-text reason (e.g. raw material substitution)" }
      - { name: effective_date, type: datetime, source: input, description: "Date the change takes effect; must be strictly after now at ANNOUNCED->EFFECTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ANNOUNCED | EFFECTIVE | COMPLETED | CANCELLED", constraints: "initial DRAFT" }

  - name: RematchTask
    parent: FormulationChange
    common_fields: false
    fields:
      - { name: formulation_change_id, type: string, source: system, description: "FK -> FormulationChange.id; parent change" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; dealer holding a license covering the affected line" }
      - { name: color_formula_id, type: string, source: system, description: "FK -> ColorFormula.id; formula to rematch" }
      - { name: old_formulation_version, type: integer, source: system, description: "Formula version before the change" }
      - { name: new_formulation_version, type: integer, source: system, description: "Formula version after the change (= old + 1)" }
      - { name: status, type: enum, source: system, description: "PENDING | DONE", constraints: "initial PENDING" }

  - name: ColorLicense
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; licensee" }
      - { name: colorant_system_id, type: string, source: input, description: "FK -> ColorantSystem.id; licensed system" }
      - { name: started_on, type: datetime, source: system, description: "Grant timestamp" }
      - { name: expires_on, type: datetime, source: system, description: "= started_on + 365 days; renewal resets to renewal date + 365" }
      - { name: fee_basis, type: enum, source: system, description: "FULL | PRORATED; basis of the most recent fee charge" }
      - { name: fee_charged_cents, type: integer, source: system, description: "Fee of the most recent grant/renewal; 0 for EXPIRED-revived prorated renewals" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | SUSPENDED | REVOKED", constraints: "initial PENDING" }

  - name: ContractorAccount
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; sponsoring dealer" }
      - { name: company_name, type: string, source: input, description: "Contractor company" }
      - { name: enrolled_on, type: datetime, source: system, description: "Enrollment timestamp" }
      - { name: rolling_net_spend_cents, type: integer, source: computed, default: 0, description: "Net spend cents (invoice_cents - refund_cents - reward_points_redemption_cents) over non-VOIDED ContractorPurchases in the trailing 12 full calendar months" }
      - { name: tier, type: enum, source: computed, default: "STANDARD", description: "STANDARD | SILVER | GOLD | PLATINUM; derived from rolling_net_spend_cents at every purchase post/void and at read" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", constraints: "initial ACTIVE" }

  - name: ContractorPurchase
    parent: ContractorAccount
    common_fields: false
    fields:
      - { name: contractor_account_id, type: string, source: input, description: "FK -> ContractorAccount.id; buying account" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; purchased line" }
      - { name: units, type: integer, source: input, description: "Units purchased", constraints: "> 0" }
      - { name: reward_points_redeemed, type: integer, source: input, default: 0, description: "Reward points redeemed on this purchase; 1 point = 1 cent", constraints: ">= 0" }
      - { name: unit_price_cents, type: integer, source: system, description: "Per-unit price after tier discount, rounded half-up before multiplication" }
      - { name: invoice_cents, type: integer, source: system, description: "units * unit_price_cents (gross, before point redemption)" }
      - { name: reward_points_redemption_cents, type: integer, source: system, default: 0, description: "= min(reward_points_redeemed, invoice_cents); net charge is invoice_cents - this" }
      - { name: refund_cents, type: integer, source: input, default: 0, description: "Refunded amount recorded on the purchase", constraints: "0..invoice_cents" }
      - { name: tier_at_post, type: enum, source: system, description: "Contractor tier applied to THIS purchase's unit price (STANDARD|SILVER|GOLD|PLATINUM)" }
      - { name: status, type: enum, source: system, description: "POSTED | VOIDED", constraints: "initial POSTED" }

  - name: DealerOrder
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; ordering dealer" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; ordered line" }
      - { name: units, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: purpose, type: enum, source: input, description: "INITIAL_STOCK | RESTOCK" }
      - { name: unit_price_cents, type: integer, source: system, description: "= product_line.base_price_cents at submission (no tier discount for dealer orders)" }
      - { name: invoice_cents, type: integer, source: system, description: "= units * unit_price_cents" }
      - { name: coop_accrued_cents, type: integer, source: system, default: 0, description: "Co-op accrual booked at PAID (= round_half_up(invoice_cents * dealer.coop_accrual_rate))" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | FULFILLED | INVOICED | PAID | CANCELLED", constraints: "initial SUBMITTED" }

  - name: CoopClaim
    parent: Dealer
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; claiming dealer" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed reimbursement", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "Marketing activity description" }
      - { name: activity_date, type: datetime, source: input, description: "Date of marketing activity; must be <= now" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | PAID", constraints: "initial SUBMITTED" }

  - name: DealerChannelEvent
    parent: Dealer
    common_fields: false
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; dealer whose channel activity is reported" }
      - { name: period_start, type: datetime, source: input, description: "Reported period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reported period end (exclusive); must be > period_start" }
      - { name: channel, type: enum, source: input, description: "INDEPENDENT | BIGBOX" }
      - { name: sales_cents, type: integer, source: input, description: "Net sales routed through this channel in the period", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | SUPERSEDED", constraints: "initial CONFIRMED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: DealerApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dealer-network/applications/{id}/submit"
        actor: RegionManager
        preconditions:
          - "Region exists"
        side_effects:
          - "compute distance_to_nearest_miles, nearest_dealer_id, territory_conflict"
          - "Region.pending_application_count += 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dealer-network/applications/{id}/approve"
        actor: RegionManager | ChannelDirector
        preconditions:
          - "if territory_conflict is true: actor must be ChannelDirector AND nearest_dealer_notified == true"
          - "applicant Dealer.exclusivity_attested_on is within 366 days of now"
        side_effects:
          - "Dealer.status APPLIED -> ONBOARDING"
          - "Region.pending_application_count -= 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /dealer-network/applications/{id}/reject"
        actor: RegionManager
        preconditions: []
        side_effects:
          - "Dealer.status APPLIED -> TERMINATED (rejected applicant never onboards)"
          - "Region.pending_application_count -= 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /dealer-network/applications/{id}/withdraw"
        actor: RegionManager
        preconditions: []
        side_effects: []

  - entity: Dealer
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLIED
        to: ONBOARDING
        trigger: "POST /dealer-network/dealers/{id}/begin-onboarding or system (cascade of DealerApplication approve)"
        actor: RegionManager | system
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: TERMINATED
        trigger: "system (cascade of DealerApplication reject)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /dealer-network/dealers/{id}/activate"
        actor: RegionManager
        preconditions:
          - "dealer has >= 1 EquipmentUnit with status CALIBRATED"
          - "dealer has >= 1 ColorLicense with status ACTIVE"
          - "dealer.inventory_minimum_met == true"
        side_effects:
          - "Region.active_dealer_count += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dealer-network/dealers/{id}/suspend"
        actor: ChannelDirector
        preconditions:
          - "either dealer.channel_posture == BLOCKED, or >= 1 EquipmentUnit with status CALIBRATION_OVERDUE, or exclusivity attestation older than 366 days"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dealer-network/dealers/{id}/reinstate"
        actor: ChannelDirector
        preconditions:
          - "dealer.channel_posture != BLOCKED"
          - "no EquipmentUnit with status CALIBRATION_OVERDUE"
          - "exclusivity attestation within 366 days of now"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dealer-network/dealers/{id}/terminate"
        actor: ChannelDirector
        preconditions: []
        side_effects:
          - "all ColorLicenses of dealer in {PENDING, ACTIVE, EXPIRED, SUSPENDED} -> REVOKED"
          - "all EquipmentUnits of dealer not DECOMMISSIONED -> DECOMMISSIONED"
          - "all DealerOrders of dealer in {SUBMITTED, APPROVED} -> CANCELLED"
          - "all ContractorAccounts of dealer ACTIVE -> CLOSED"
          - "dealer.coop_balance_cents and coop_pending_cents set to 0 (forfeit)"
          - "dealer.inventory_minimum_met = false"
          - "Region.active_dealer_count -= 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /dealer-network/dealers/{id}/terminate"
        actor: ChannelDirector
        preconditions: []
        side_effects:
          - "same cascade as ACTIVE->TERMINATED (Region.active_dealer_count -= 1 applies because SUSPENDED counts as active)"

  - entity: EquipmentUnit
    initial_state: INSTALLED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: INSTALLED
        to: CALIBRATED
        trigger: "POST /dealer-network/equipment/{id}/calibrations with result PASS"
        actor: EquipmentTech
        preconditions:
          - "dealer of unit has status in {ONBOARDING, ACTIVE, SUSPENDED}"
        side_effects:
          - "last_calibrated_on = performed_on; calibration_due_on = performed_on + 90d; consecutive_failed_calibrations = 0"
      - from: CALIBRATED
        to: CALIBRATED
        trigger: "POST /dealer-network/equipment/{id}/calibrations with result PASS"
        actor: EquipmentTech
        preconditions: []
        side_effects:
          - "last_calibrated_on / calibration_due_on refreshed; consecutive_failed_calibrations = 0"
      - from: CALIBRATION_OVERDUE
        to: CALIBRATED
        trigger: "POST /dealer-network/equipment/{id}/calibrations with result PASS"
        actor: EquipmentTech
        preconditions: []
        side_effects:
          - "last_calibrated_on / calibration_due_on refreshed; consecutive_failed_calibrations = 0"
      - from: INSTALLED
        to: INSTALLED
        trigger: "POST /dealer-network/equipment/{id}/calibrations with result FAIL"
        actor: EquipmentTech
        preconditions: []
        side_effects:
          - "consecutive_failed_calibrations += 1"
      - from: CALIBRATED
        to: INSTALLED
        trigger: "POST /dealer-network/equipment/{id}/calibrations with result FAIL"
        actor: EquipmentTech
        preconditions: []
        side_effects:
          - "consecutive_failed_calibrations += 1 (status drops back to INSTALLED; unit no longer counts as calibrated)"
      - from: CALIBRATION_OVERDUE
        to: INSTALLED
        trigger: "POST /dealer-network/equipment/{id}/calibrations with result FAIL"
        actor: EquipmentTech
        preconditions: []
        side_effects:
          - "consecutive_failed_calibrations += 1"
      - from: CALIBRATED
        to: CALIBRATION_OVERDUE
        trigger: "system (lazy sweep: any read of the unit, or POST /dealer-network/ops/run, when now > calibration_due_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /dealer-network/equipment/{id}/decommission or system cascade of dealer terminate"
        actor: EquipmentTech | system
        preconditions: []
        side_effects: []
      - from: CALIBRATED
        to: DECOMMISSIONED
        trigger: "POST /dealer-network/equipment/{id}/decommission or system cascade of dealer terminate"
        actor: EquipmentTech | system
        preconditions: []
        side_effects: []
      - from: CALIBRATION_OVERDUE
        to: DECOMMISSIONED
        trigger: "POST /dealer-network/equipment/{id}/decommission or system cascade of dealer terminate"
        actor: EquipmentTech | system
        preconditions: []
        side_effects: []

  - entity: ColorLicense
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (cascade of first PASS calibration on any of the dealer's units whose colorant_system_id == license.colorant_system_id)"
        actor: system
        preconditions: []
        side_effects:
          - "started_on = now; expires_on = now + 365d; fee_basis = FULL; fee_charged_cents = colorant_system.annual_license_fee_cents"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /dealer-network/licenses/{id}/renew"
        actor: RegionManager
        preconditions:
          - "dealer.status in {ONBOARDING, ACTIVE, SUSPENDED}"
        side_effects:
          - "expires_on = now + 365d; fee_basis = FULL; fee_charged_cents = annual fee"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy sweep: any read of the license, or POST /dealer-network/ops/run, when now >= expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /dealer-network/licenses/{id}/renew"
        actor: RegionManager
        preconditions:
          - "dealer.status in {ONBOARDING, ACTIVE, SUSPENDED}"
        side_effects:
          - "expires_on = now + 365d; fee_basis = PRORATED; fee_charged_cents = round_half_up(annual_fee_cents * max(0, expires_on_before_renewal - now) days / 365) computed BEFORE expiry reset; 0 when renewal happens after expiry"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade: after a FAIL calibration or overdue sweep, no unit with colorant_system_id == license.colorant_system_id remains CALIBRATED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade of a PASS calibration on any unit of the dealer whose colorant_system_id == license.colorant_system_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REVOKED
        trigger: "system (cascade of dealer terminate) or POST /dealer-network/licenses/{id}/revoke"
        actor: ChannelDirector | system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system (cascade of dealer terminate) or POST /dealer-network/licenses/{id}/revoke"
        actor: ChannelDirector | system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: REVOKED
        trigger: "system (cascade of dealer terminate) or POST /dealer-network/licenses/{id}/revoke"
        actor: ChannelDirector | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (cascade of dealer terminate) or POST /dealer-network/licenses/{id}/revoke"
        actor: ChannelDirector | system
        preconditions: []
        side_effects: []

  - entity: DealerOrder
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dealer-network/orders/{id}/approve"
        actor: RegionManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /dealer-network/orders/{id}/reject"
        actor: RegionManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /dealer-network/orders/{id}/fulfill"
        actor: RegionManager
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: INVOICED
        trigger: "POST /dealer-network/orders/{id}/invoice"
        actor: RegionManager
        preconditions: []
        side_effects:
          - "if purpose == INITIAL_STOCK: dealer.inventory_minimum_met = true"
          - "dealer.annual_net_purchase_cents recomputed"
      - from: INVOICED
        to: PAID
        trigger: "POST /dealer-network/orders/{id}/pay"
        actor: DealerPrincipal
        preconditions:
          - "actor DealerPrincipal's X-User-ID == order.dealer_id (dealer pays own invoice)"
        side_effects:
          - "coop_accrued_cents = round_half_up(invoice_cents * dealer.coop_accrual_rate)"
          - "dealer.coop_balance_cents += coop_accrued_cents"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /dealer-network/orders/{id}/cancel or system cascade of dealer terminate"
        actor: DealerPrincipal | system
        preconditions:
          - "when actor is DealerPrincipal: X-User-ID == order.dealer_id"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /dealer-network/orders/{id}/cancel or system cascade of dealer terminate"
        actor: DealerPrincipal | system
        preconditions:
          - "when actor is DealerPrincipal: X-User-ID == order.dealer_id"
        side_effects: []

  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /dealer-network/contractors/{id}/close or system cascade of dealer terminate"
        actor: DealerPrincipal | system
        preconditions:
          - "when actor is DealerPrincipal: X-User-ID == account.dealer_id"
        side_effects: []

  - entity: ContractorPurchase
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /dealer-network/purchases/{id}/void"
        actor: DealerPrincipal
        preconditions:
          - "actor DealerPrincipal's X-User-ID == purchase.contractor_account.dealer_id"
        side_effects:
          - "contractor.rolling_net_spend_cents recomputed (purchase excluded); contractor.tier re-derived"

  - entity: CoopClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dealer-network/coop-claims/{id}/approve"
        actor: ChannelDirector
        preconditions:
          - "dealer.branding_compliant == true"
          - "dealer.coop_balance_cents >= amount_cents (pending reservations do NOT reduce the approvable balance)"
          - "dealer.status == ACTIVE"
        side_effects:
          - "dealer.coop_pending_cents += amount_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /dealer-network/coop-claims/{id}/reject"
        actor: ChannelDirector
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /dealer-network/coop-claims/{id}/pay"
        actor: ChannelDirector
        preconditions: []
        side_effects:
          - "dealer.coop_pending_cents -= amount_cents"
          - "dealer.coop_balance_cents -= amount_cents"

  - entity: FormulationChange
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /dealer-network/formulation-changes/{id}/announce"
        actor: ColorLabAdmin
        preconditions: []
        side_effects: []
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "POST /dealer-network/formulation-changes/{id}/make-effective"
        actor: ColorLabAdmin
        preconditions:
          - "effective_date <= now (change may only take effect on or after its declared date)"
        side_effects:
          - "every ColorFormula with product_line_id == change.product_line_id and status ACTIVE: formulation_version += 1, rematch_pending = true"
          - "for each such formula and each dealer holding a ColorLicense in {ACTIVE, SUSPENDED} whose colorant_system_id == product_line.colorant_system_id: create RematchTask (PENDING, old/new versions)"
      - from: EFFECTIVE
        to: COMPLETED
        trigger: "system (automatic when the last PENDING RematchTask of this change becomes DONE)"
        actor: system
        preconditions: []
        side_effects:
          - "formulas whose tasks are all DONE: rematch_pending = false"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /dealer-network/formulation-changes/{id}/cancel"
        actor: ColorLabAdmin
        preconditions: []
        side_effects: []
      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /dealer-network/formulation-changes/{id}/cancel"
        actor: ColorLabAdmin
        preconditions: []
        side_effects: []

  - entity: RematchTask
    initial_state: PENDING
    terminal_states: [DONE]
    transitions:
      - from: PENDING
        to: DONE
        trigger: "POST /dealer-network/rematch-tasks/{id}/complete"
        actor: DealerPrincipal
        preconditions:
          - "actor DealerPrincipal's X-User-ID == task.dealer_id"
          - "task dealer has >= 1 EquipmentUnit with status CALIBRATED and colorant_system_id == formula.product_line.colorant_system_id"
        side_effects:
          - "if this was the last PENDING task for the formulation change: change EFFECTIVE -> COMPLETED"
          - "recompute rematch_pending on the task's formula"

  - entity: DealerChannelEvent
    initial_state: CONFIRMED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system (posting a new event for the same dealer_id + channel whose period overlaps the existing event's period)"
        actor: system
        preconditions: []
        side_effects:
          - "dealer.bigbox_share_pct and channel_posture recomputed from remaining CONFIRMED events"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: application-approve-stale-version
    parent_entity: DealerApplication
    write_endpoint: "POST /dealer-network/applications/{id}/approve"
    occ_field: "expected_application_version"
    description: |
      Approving a DealerApplication whose version has advanced since the
      client last observed it is rejected. This captures the case where
      another writer has just withdrawn the application or submitted a
      neighbor notification (both of which bump the version) and the current
      approver's view of the application is therefore stale. The
      expected-version check is evaluated BEFORE the transition's state
      preconditions, so a stale version always yields ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: formulation-announce-stale-version
    parent_entity: FormulationChange
    write_endpoint: "POST /dealer-network/formulation-changes/{id}/announce"
    occ_field: "expected_change_version"
    description: |
      Announcing a FormulationChange whose version has advanced since the
      client last observed it is rejected. This captures the case where
      another writer has just cancelled the draft and the current announcer's
      view of the change is therefore stale. The expected-version check is
      evaluated BEFORE the transition's state preconditions, so a stale
      version always yields ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: contractor_tier_assignment
    trigger: "on ContractorPurchase post, on ContractorPurchase void, and on every read of ContractorAccount"
    algorithm: threshold
    formula: |
      spend = rolling_net_spend_cents (see rolling_net_spend)
      tier = PLATINUM if spend >= 10000000
             GOLD     if spend >=  4000000
             SILVER   if spend >=  1000000
             STANDARD otherwise
      Boundaries are INCLUSIVE: exactly 1000000 cents is SILVER,
      999999 cents is STANDARD.
    input_set: "ContractorAccount whose status == ACTIVE or CLOSED (tier remains readable after close)"
    constants:
      SILVER_MIN_CENTS: 1000000
      GOLD_MIN_CENTS: 4000000
      PLATINUM_MIN_CENTS: 10000000
    precision: "integer cents; no rounding"

  - name: rolling_net_spend
    trigger: "recomputed whenever contractor_tier_assignment runs"
    algorithm: aggregation
    formula: |
      window = trailing 12 full calendar months ending at the end of the
               month preceding the current logical month
      rolling_net_spend_cents = sum over ContractorPurchase p where
        p.contractor_account_id == account.id
        AND p.status != VOIDED
        AND p.created_at within window
        of (p.invoice_cents - p.refund_cents - p.reward_points_redemption_cents)
    input_set: "POSTED ContractorPurchases of the account inside the trailing-12-full-calendar-month window (inclusive of both window endpoints)"
    constants:
      WINDOW_MONTHS: 12
    precision: "integer cents; no rounding"

  - name: contractor_unit_price
    trigger: "on ContractorPurchase creation"
    algorithm: tiered_pricing
    formula: |
      discount = {STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15}[tier_at_post]
      unit_price_cents = round_half_up(product_line.base_price_cents * (1 - discount))
      invoice_cents    = units * unit_price_cents
      ROUNDING ORDER IS PINNED: the discount is applied and rounded to the
      cent PER UNIT FIRST; only then is the per-unit price multiplied by
      units. (Sum-then-round is a different, wrong answer: 3 units at
      base 999 cents with GOLD gives unit 899 cents -> invoice 2697 cents,
      not round(3 * 899.1) = 2697 by coincidence — but 7 units at 333 cents
      GOLD gives unit 300, invoice 2100 vs sum-then-round round(7*299.7)=2098.)
    input_set: "single ContractorPurchase being created; tier_at_post = contractor.tier evaluated BEFORE this purchase is added to rolling spend"
    constants:
      SILVER_DISCOUNT: 0.05
      GOLD_DISCOUNT: 0.10
      PLATINUM_DISCOUNT: 0.15
    precision: "round_half_up to integer cents at per-unit step"

  - name: reward_points_redemption
    trigger: "on ContractorPurchase creation, immediately after contractor_unit_price"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER IS PINNED (this formula has a circular-looking
      dependency — tier points earned depend on net spend, and net charge
      depends on points redeemed — so the order is normative):
        1. invoice_cents = units * unit_price_cents           (gross)
        2. reward_points_redemption_cents = min(reward_points_redeemed, invoice_cents)
        3. net_charge_cents = invoice_cents - reward_points_redemption_cents
        4. rolling_net_spend (and therefore NEXT tier) uses net values:
           invoice_cents - refund_cents - reward_points_redemption_cents
      Points are NOT a balance held by the contractor; redemption is capped
      per purchase at the invoice value and the excess is silently dropped.
    input_set: "single ContractorPurchase being created"
    constants: {}
    precision: "integer cents"

  - name: bigbox_share_pct
    trigger: "on every DealerChannelEvent post or supersede; read on Dealer"
    algorithm: aggregation
    formula: |
      window = trailing 12 full calendar months (same definition as
               rolling_net_spend)
      bigbox = sum of sales_cents over DealerChannelEvent where
               dealer_id == dealer.id AND channel == BIGBOX
               AND status == CONFIRMED AND period_start within window
      total  = bigbox + same sum for channel == INDEPENDENT
      bigbox_share_pct = (total == 0) ? 0 : round_half_up(100 * bigbox / total, 2)
    input_set: "CONFIRMED DealerChannelEvents of the dealer with period_start inside the trailing-12-full-calendar-month window"
    constants:
      WINDOW_MONTHS: 12
    precision: "2 decimal places, round_half_up"

  - name: channel_posture_derivation
    trigger: "recomputed whenever bigbox_share_pct is recomputed"
    algorithm: threshold
    formula: |
      T = dealer.region.exclusivity_block_threshold_pct
      posture = BLOCKED           if bigbox_share_pct >= T
                OVERRIDE_REQUIRED if bigbox_share_pct >  T / 2
                INDEPENDENT_ONLY  otherwise
      Boundaries: share EXACTLY == T is BLOCKED; share EXACTLY == T/2 stays
      INDEPENDENT_ONLY (the OVERRIDE_REQUIRED lower boundary is exclusive).
      OVERRIDE_REQUIRED is advisory: BIGBOX events remain postable until the
      posture reaches BLOCKED (posting them is precisely what pushes the
      share over T).
    input_set: "single Dealer and its Region"
    constants: {}
    precision: "comparison against bigbox_share_pct at 2-decimal precision"

  - name: license_fee
    trigger: "on ColorLicense PENDING->ACTIVE activation, and on every renew"
    algorithm: tiered_pricing
    formula: |
      if license.status_before == PENDING:            # initial activation
          fee_basis = FULL;  fee = annual_license_fee_cents
      elif license.status_before == ACTIVE:           # early/on-time renewal
          fee_basis = FULL;  fee = annual_license_fee_cents
      else:                                           # EXPIRED revival
          days_remaining = max(0, whole days between now and old expires_on)
          fee_basis = PRORATED
          fee = round_half_up(annual_license_fee_cents * days_remaining / 365)
      VARIANT DIVERGENCE: an ACTIVE renewal charges the full annual fee even
      with 364 days left; an EXPIRED renewal with the same gap charges the
      prorated remainder (0 once expired).
    input_set: "single ColorLicense + its ColorantSystem"
    constants:
      LICENSE_TERM_DAYS: 365
    precision: "integer cents, round_half_up"
    variants:
      - name: full_fee
        when: "activation from PENDING or renewal from ACTIVE"
        difference: "charges annual_license_fee_cents regardless of remaining days"
      - name: prorated_fee
        when: "renewal from EXPIRED"
        difference: "charges round_half_up(annual * max(0, days_until_old_expiry) / 365); 0 when now >= old expires_on"

  - name: coop_accrual
    trigger: "on DealerOrder INVOICED->PAID"
    algorithm: aggregation
    formula: |
      coop_accrued_cents = round_half_up(order.invoice_cents * dealer.coop_accrual_rate)
      dealer.coop_balance_cents += coop_accrued_cents
    input_set: "single DealerOrder transitioning to PAID"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: coop_claim_window
    trigger: "on CoopClaim creation and on every approve"
    algorithm: chronological
    formula: |
      activity_window_ok = (now - claim.activity_date) <= 90 days
      available_balance  = dealer.coop_balance_cents   # pending reservations do NOT reduce approvable balance
      claim_approvable   = activity_window_ok
                           AND dealer.branding_compliant
                           AND available_balance >= claim.amount_cents
    input_set: "single CoopClaim"
    constants:
      ACTIVITY_WINDOW_DAYS: 90
    precision: "integer cents; day-precision comparison on activity_date"

  - name: territory_distance
    trigger: "on DealerApplication DRAFT->SUBMITTED"
    algorithm: aggregation
    formula: |
      candidates = dealers d where d.region_id == application.region_id
                   AND d.status in {ONBOARDING, ACTIVE, SUSPENDED}
      distance(a, b) = haversine miles between (lat, lon) pairs
      distance_to_nearest_miles = min over candidates of distance(application, d),
                                  null when candidates is empty
      nearest_dealer_id = argmin; tie-break: smaller distance first,
                          then older dealer.created_at
      territory_conflict = distance_to_nearest_miles < region.territory_radius_miles
      Boundary: distance EXACTLY == radius is NOT a conflict (strictly-less).
    input_set: "dealers in the same region with status in {APPROVED, ACTIVE, SUSPENDED}"
    constants:
      EARTH_RADIUS_MILES: 3958.8
    precision: "2 decimal places, round_half_up"

  - name: rematch_wave_fanout
    trigger: "on FormulationChange ANNOUNCED->EFFECTIVE"
    algorithm: aggregation
    formula: |
      affected_formulas = ColorFormula f where f.product_line_id == change.product_line_id
                          AND f.status == ACTIVE
      eligible_dealers  = dealers d holding a ColorLicense l where
                          l.colorant_system_id == product_line.colorant_system_id
                          AND l.status in {ACTIVE, SUSPENDED}
      for each (f, d): create RematchTask(PENDING, old_formulation_version = f.formulation_version,
                                          new_formulation_version = f.formulation_version + 1)
      for each f: f.formulation_version += 1; f.rematch_pending = true
      A formula with zero eligible dealers still bumps formulation_version but
      keeps rematch_pending = false (no outstanding work).
    input_set: "ACTIVE formulas of the change's line x dealers licensed on the line's colorant system in {ACTIVE, SUSPENDED}"
    constants: {}
    precision: "integer versions"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present for entity_backed roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles; entity_backed ownership checks (DealerPrincipal acts on own dealer's resources)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "body-referenced foreign keys exist (region_id, dealer_id, colorant_system_id, product_line_id, contractor_account_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all create endpoints" }
  - { priority: 5, category: state, check: "target resource is in a state from which the requested transition exists", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "dealer aggregate status permits the operation: POST /orders requires dealer.status in {ONBOARDING, ACTIVE} (the initial-stock order is placed during onboarding); POST /purchases, /coop-claims, /contractors require ACTIVE; POST /equipment requires dealer.status in {ONBOARDING, ACTIVE, SUSPENDED} (install during onboarding is what makes activation reachable)", error_id: ERR_DEALER_NOT_ACTIVE, http_status: 409, applies_to: "POST /dealer-network/orders, POST /dealer-network/purchases, POST /dealer-network/coop-claims, POST /dealer-network/contractors, POST /dealer-network/equipment" }
  - { priority: 7, category: state, check: "license for the purchased product line's colorant system is ACTIVE (not PENDING/EXPIRED/SUSPENDED/REVOKED)", error_id: ERR_LICENSE_NOT_ACTIVE, http_status: 409, applies_to: "POST /dealer-network/purchases" }
  - { priority: 8, category: business_safety, check: "DEALER_EXCLUSIVE product line purchases require >= 1 CALIBRATED EquipmentUnit with colorant_system_id == line.colorant_system_id at the dealer", error_id: ERR_EQUIPMENT_NOT_CALIBRATED, http_status: 422, applies_to: "POST /dealer-network/purchases" }
  - { priority: 9, category: business_safety, check: "contractor purchase of a line whose formulas include rematch_pending == true under an EFFECTIVE formulation change is refused until the dealer's RematchTask for that formula is DONE", error_id: ERR_REMATCH_REQUIRED, http_status: 422, applies_to: "POST /dealer-network/purchases" }
  - { priority: 10, category: business_constraint, check: "uniqueness: region.code, equipment serial_no, colorant system code, product line code, formula code per line", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "create endpoints for Region, EquipmentUnit, ColorantSystem, ProductLine, ColorFormula" }
  - { priority: 11, category: business_constraint, check: "dealer-channel exclusivity: DealerChannelEvent with channel BIGBOX rejected when dealer.channel_posture == BLOCKED", error_id: ERR_CHANNEL_EXCLUSIVITY_VIOLATION, http_status: 422, applies_to: "POST /dealer-network/dealers/{id}/channel-events" }
  - { priority: 12, category: business_constraint, check: "DealerChannelEvent period overlap for same dealer+channel: partial overlap supersedes overlapped CONFIRMED events; an EXACT duplicate period (same dealer, channel, period_start, period_end as a CONFIRMED event) is rejected to prevent double counting", error_id: ERR_CHANNEL_EVENT_OVERLAP, http_status: 422, applies_to: "POST /dealer-network/dealers/{id}/channel-events" }
  - { priority: 13, category: business_temporal, check: "exclusivity attestation freshness: approve/re-attest requires exclusivity_attested_on within 366 days of now", error_id: ERR_ATTESTATION_STALE, http_status: 422, applies_to: "POST /dealer-network/applications/{id}/approve" }
  - { priority: 14, category: business_temporal, check: "coop claim activity_date within 90 days of now and not in the future", error_id: ERR_CLAIM_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /dealer-network/coop-claims, POST /dealer-network/coop-claims/{id}/approve" }
  - { priority: 15, category: business_temporal, check: "formulation change effective_date must be strictly after now at announce, and <= now at make-effective", error_id: ERR_EFFECTIVE_DATE_INVALID, http_status: 422, applies_to: "POST /dealer-network/formulation-changes/{id}/announce, POST /dealer-network/formulation-changes/{id}/make-effective" }
  - { priority: 16, category: business_temporal, check: "DealerChannelEvent period_end > period_start; period_start not in the future", error_id: ERR_INVALID_PERIOD, http_status: 422, applies_to: "POST /dealer-network/dealers/{id}/channel-events" }
  - { priority: 17, category: business_referential, check: "retire/decommission guards: ColorantSystem RETIRED blocks new licenses; ProductLine DISCONTINUED blocks new orders/purchases; terminated/rejected dealer referenced only by reads", error_id: ERR_REFERENCE_INACTIVE, http_status: 422, applies_to: "POST /dealer-network/licenses, POST /dealer-network/orders, POST /dealer-network/purchases" }
  - { priority: 18, category: business_referential, check: "territory guard: SUBMITTED application with territory_conflict == true may be approved only by ChannelDirector and only after nearest_dealer_notified == true", error_id: ERR_TERRITORY_CONFLICT, http_status: 422, applies_to: "POST /dealer-network/applications/{id}/approve" }
  - { priority: 19, category: business_fiscal, check: "minimum initial inventory: INITIAL_STOCK order units >= colorant_system.min_initial_inventory_units for the dealer's licensed system", error_id: ERR_MIN_INVENTORY_UNMET, http_status: 422, applies_to: "POST /dealer-network/orders with purpose INITIAL_STOCK" }
  - { priority: 20, category: business_fiscal, check: "coop funds: claim approve requires branding_compliant and coop_balance_cents >= amount_cents (pending claims do not reduce the approvable balance)", error_id: ERR_COOP_FUNDS_INSUFFICIENT, http_status: 422, applies_to: "POST /dealer-network/coop-claims/{id}/approve" }
  - { priority: 21, category: business_fiscal, check: "reward points: reward_points_redeemed >= 0; redemption silently capped at invoice_cents (never an error)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /dealer-network/purchases" }
  - { priority: 22, category: business_fiscal, check: "request shape: required fields present, types valid, enum members valid, numeric ranges respected (units > 0, amount_cents > 0, refund_cents within [0, invoice_cents])", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- clock (test-driving) ---
  - method: POST
    path: "/dealer-network/_clock/set_current_utc"
