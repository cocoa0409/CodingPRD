      - name: ignition_risk_per_term_rounding_order_pinned
        grounds:
          - calculations.ignition_risk_avoided_score
          - entities.EventScope.fields.ignition_risk_term
          - entities.PSPSEvent.fields.ignition_risk_avoided_score
          - calculations.psps_scope_determination
        distinguishing_aspect: |
          Rounding each of the three per-circuit terms to 2 dp BEFORE summing yields 6.02 + 5.16 + 4.30 =
          15.48, whereas summing at full precision and rounding once yields 15.47 — the pinned order is the
          per-term one, so the event's ignition_risk_avoided_score must read exactly 15.48 and never 15.47.
        test_recipe:
          setup:
            - "The ALPHA -> BRAVO -> CHARLIE chain with overhead_miles 7.0 / 6.0 / 5.0, all hardened_fraction 0.0000."
            - "ALPHA carries a FORECAST index for 2026-08-15 with fpi_score 85.93 (tier R5); BRAVO and CHARLIE have no index of their own and inherit ALPHA's score as downstream dependencies."
