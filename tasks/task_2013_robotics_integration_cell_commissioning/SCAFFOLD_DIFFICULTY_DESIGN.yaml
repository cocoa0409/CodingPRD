  - rule_id: resource_temporal_overlap
    instances:
      - name: trainer_double_booking_half_open_adjacency
        grounds:
          - validations[priority=12]
          - errors[ERR_TRAINER_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics [start, end) on the trainer resource:
          a session 08:00-16:00 and a back-to-back session starting at exactly
          16:00 are allowed (adjacency, no overlap), while 15:59:59 overlaps
          and is rejected.
        test_recipe:
          setup:
            - "Project in TRAINING; trainer T already owns session S1 2026-08-10T08:00-16:00Z"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "FANUC", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { eng_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Trainer One", user_role: "TRAINER" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { trn_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/customer-sites"
              payload: { site_name: "Plant O", plant_tz: "UTC", shift_windows_per_day: 2 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { site_id: $.data.id }
            - call: "POST /robotics/customer-sites/${site_id}/cell-projects"
              payload: { project_code: "P-TO1", contracted_cycle_time_s: 10.0, contract_value_cents: 1000000, guaranteed_oee_pct: 80.0 }
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /robotics/cell-projects/${proj_id}/training-sessions"
              payload: { audience: "OPERATOR", scheduled_start_utc: "2026-08-10T08:00:00Z", scheduled_end_utc: "2026-08-10T16:00:00Z", trainer_user_id: "${trn_id}", attendee_count: 6 }
              as: Trainer
              as_user_id: "${trn_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /robotics/cell-projects/${proj_id}/training-sessions"
              payload: { audience: "TECHNICIAN", scheduled_start_utc: "2026-08-10T16:00:00Z", scheduled_end_utc: "2026-08-10T20:00:00Z", trainer_user_id: "${trn_id}", attendee_count: 4 }
              as: Trainer
              as_user_id: "${trn_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /robotics/cell-projects/${proj_id}/training-sessions"
              payload: { audience: "TECHNICIAN", scheduled_start_utc: "2026-08-10T15:59:59Z", scheduled_end_utc: "2026-08-10T18:00:00Z", trainer_user_id: "${trn_id}", attendee_count: 4 }
              as: Trainer
              as_user_id: "${trn_id}"
          assert:
            - "Second call (start exactly at 16:00, adjacent) succeeds with 201 (half-open adjacency allowed)"
            - "Third call (start 15:59:59, overlap by one second) fails with ERR_TRAINER_SCHEDULE_CONFLICT (422)"

      - name: maintenance_window_meter_vs_interval_aggregate_capacity
        grounds:
          - calculations: "MaintenancePlan.hours_until_due derivation"
          - validations[priority=17]
          - errors[ERR_MAINTENANCE_WINDOW_INVALID]
        distinguishing_aspect: |
          Different interval semantics than the half-open trainer case: an
          aggregate-capacity treatment over a numeric (not temporal) resource —
          the operating-hours meter. first_due_at_hours exactly equal to the
          current meter reading is accepted (>=), while one hour below is
          rejected, and hours_until_due rolls forward in whole interval
          multiples (k*interval) so a meter at 2100 with first_due 2000 and
          interval 2000 yields hours_until_due == 1900 (next due at 4000).
        test_recipe:
          setup:
            - "Project in SAT with spare package ordered; MaintenancePlan interval 2000, first_due 2000 activated at meter 0; meter then read at 2100"
          setup_api_calls:
            - call: "POST /robotics/integrator-orgs"
              payload: { legal_name: "IntegCo", brand_specialization: "ABB", retention_rate_bps: 1000, default_pl_category_target: "PLd" }
              as: FinanceAdmin
              as_user_id: "00000000-0000-0000-0000-0000000000fa"
              captures: { org_id: $.data.id }
            - call: "POST /robotics/integrator-orgs/${org_id}/users"
              payload: { display_name: "Eng One", user_role: "PROJECT_ENGINEER" }
