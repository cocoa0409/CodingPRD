            - { call: "POST /recycle-routes/manifests/${man_id}/approve-amendment", payload: {}, as: Regulator, captures: { st2: "$.data.status" } }
            - { call: "POST /recycle-routes/manifests/${man_id}/submit", payload: {}, as: RoutePlanner, captures: { st3: "$.data.status" } }
          assert:
            - "Manifest.${man_id} transitioned DELIVERED -> AMENDMENT_PENDING (status after request-amendment)"
            - "Manifest.${man_id} transitioned AMENDMENT_PENDING -> AMENDED (after approve)"
            - "Manifest.${man_id} re-entered SUBMITTED (cyclic return)"
            - "Manifest.${man_id}.total_gallons_manifested == 100 (recomputed on approve-amendment)"

      - name: tank_parallel_ownership_x_quarantine_dimensions
        grounds:
          - state_machines.Tank
          - entities.Tank.fields.ownership_status
          - entities.Tank.fields.quarantine_status
        distinguishing_aspect: |
          Tank has PARALLEL state dimensions: ownership_status (PENDING_INSTALL,
          INSTALLED, DECOMMISSION_PENDING, DECOMMISSIONED) evolves independently
          from quarantine_status (CLEAR, QUARANTINED). A halogen-fail quarantines
          the tank without changing its ownership_status; decommission still
          requires the ownership dimension, not quarantine.
        test_recipe:
          setup:
            - "Tank INSTALLED (ownership dim), CLEAR (quarantine dim)"
            - "Halogen-fail screen drives quarantine_status to QUARANTINED; ownership_status stays INSTALLED"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Par Dim", epa_generator_id: "EPAGEN000031", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "5 Dim Rd", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller, captures: { tank_own_after_install: "$.data.ownership_status", tank_q_after_install: "$.data.quarantine_status" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 100 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Par", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "PAR", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id", r_v: "$.data.version" } }
            - { call: "POST /recycle-routes/routes/${r_id}/route-stops", payload: { tank_site_id: "${site_id}", tank_id: "${tank_id}", scheduled_window_start: "08:00", scheduled_window_end: "09:00", sequence: 1, estimated_volume_gallons: 100, expected_route_version: "${r_v}" }, as: RoutePlanner, captures: { s_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes/${r_id}/dispatch", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/route-stops/${s_id}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s_id}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
          trigger:
            - { call: "POST /recycle-routes/route-stops/${s_id}/sample-screenings", payload: { halogen_ppm: 9999, water_pct: 1.0, ph_level: 7.0 }, as: LabTech }
            - { call: "GET /recycle-routes/tanks/${tank_id}", payload: {}, as: EHSOfficer, captures: { tank_own_after: "$.data.ownership_status", tank_q_after: "$.data.quarantine_status" } }
          assert:
            - "ownership dimension: Tank.${tank_id}.ownership_status == INSTALLED (unchanged by halogen event)"
            - "quarantine dimension: Tank.${tank_id}.quarantine_status == QUARANTINED"
            - "dimensions evolve independently: ownership_status did NOT advance"

