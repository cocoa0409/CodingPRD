# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances.
# Every grounds ref resolves to SCAFFOLD.yaml §1.1–§1.6. Every setup_api_calls /
# trigger call resolves to a §1.5 endpoint; all formula-derived asserts are
# literals computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tradein_cash_vs_store_credit_offers
        grounds:
          - calculations.tradein_offers
          - entities.TradeIn.fields.cash_offer_cents
          - entities.TradeIn.fields.store_credit_offer_cents
          - state_machines.TradeIn.RECEIVED_to_APPRAISED
        distinguishing_aspect: "On TradeIn (entity domain #1), one appraised_value_cents yields two different payouts — cash 50% (10000) vs store credit 70% (14000)."
        test_recipe:
          setup:
            - "A Customer exists; a TradeIn in RECEIVED status with mode=TRADE_IN."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ti1@x.com", full_name: "Trade One" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", item_description: "Used deck", mode: "TRADE_IN" }
              as: SalesAssociate
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/appraise"
              payload: { appraised_value_cents: 20000 }
              as: ShopManager
              captures: { cash: $.data.cash_offer_cents, credit: $.data.store_credit_offer_cents }
          assert:
            - "TradeIn.${ti_id}.cash_offer_cents == 10000"
            - "TradeIn.${ti_id}.store_credit_offer_cents == 14000"
            - "TradeIn.${ti_id}.store_credit_offer_cents != TradeIn.${ti_id}.cash_offer_cents"

      - name: board_build_provisional_vs_final_cost
        grounds:
          - calculations.board_build_cost
          - entities.BoardBuild.fields.provisional_cost_cents
          - entities.BoardBuild.fields.final_cost_cents
          - state_machines.BoardBuild.DRAFT_to_RESERVED
          - state_machines.BoardBuild.RESERVED_to_COMPLETED
        distinguishing_aspect: "On BoardBuild (entity domain #2, distinct from TradeIn), provisional (list sum + labor = 13494) diverges from final (10% per-line discount rounded per line + labor = 12395) for identical components."
        test_recipe:
          setup:
            - "Deck product @7999 and Wheels product @2995, each on_hand 10; a Customer; a DRAFT BoardBuild with one of each component."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "DECK-1", name: "Deck", category: "DECK", unit_price_cents: 7999 }
              as: ShopManager
              captures: { deck_id: $.data.id }
            - call: "POST /products/${deck_id}/inventory-adjustments"
              payload: { delta_on_hand: 10 }
              as: ShopManager
            - call: "POST /products"
              payload: { sku: "WHL-1", name: "Wheels", category: "WHEELS", unit_price_cents: 2995 }
              as: ShopManager
              captures: { whl_id: $.data.id }
            - call: "POST /products/${whl_id}/inventory-adjustments"
              payload: { delta_on_hand: 10 }
              as: ShopManager
            - call: "POST /customers"
              payload: { email: "bb1@x.com", full_name: "Build One" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${deck_id}", qty: 1 }, { product_id: "${whl_id}", qty: 1 } ] }
              as: BenchTech
              captures: { bb_id: $.data.id }
          trigger:
            - call: "POST /board-builds/${bb_id}/reserve"
              payload: {}
              as: BenchTech
              captures: { prov: $.data.provisional_cost_cents }
            - call: "POST /board-builds/${bb_id}/complete"
              payload: {}
              as: BenchTech
              captures: { fin: $.data.final_cost_cents }
          assert:
            - "BoardBuild.${bb_id}.provisional_cost_cents == 13494"
            - "BoardBuild.${bb_id}.final_cost_cents == 12395"
            - "BoardBuild.${bb_id}.provisional_cost_cents != BoardBuild.${bb_id}.final_cost_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: loyalty_accrual_tiered_event_multiplier_mode_a
        grounds:
          - calculations.loyalty_accrual
          - entities.Customer.fields.loyalty_points
          - entities.Customer.fields.tier
        distinguishing_aspect: "Mode (a): points = floor(floor(amount/100) * TIER_MULTIPLIER[tier] * event_mult) — >=3 inputs with tier selection and conditional multiplier interacting non-linearly; a SILVER earn of 12345 adds floor(123*1.25)=153 points."
        test_recipe:
          setup:
            - "A Customer already promoted to SILVER by an initial EARN of 60000 (600 base points; lifetime 60000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "loy@x.com", full_name: "Loyal Sam" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { kind: "EARN", spend_cents: 60000 }
              as: SalesAssociate
          trigger:
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { kind: "EARN", spend_cents: 12345 }
              as: SalesAssociate
              captures: { pts: $.data.loyalty_points, tier: $.data.tier }
          assert:
            - "Customer.${cust_id}.loyalty_points == 753"
            - "Customer.${cust_id}.tier == SILVER"
            - "Customer.${cust_id}.lifetime_spend_cents == 72345"

      - name: service_ticket_total_per_line_rounding_mode_b
        grounds:
          - calculations.service_ticket_total
          - entities.ServiceTicket.fields.total_cents
          - state_machines.ServiceTicket.INTAKE_to_READY
        distinguishing_aspect: "Mode (b): nested rounding — round_half_up per taxed line THEN sum (2786+964+4290=8040) differs from sum-then-round (8041); scaffold pins per-line order."
        test_recipe:
          setup:
            - "Two part products exist; a Customer; a ServiceTicket in INTAKE with two part lines (1299×2, 899×1) and labor 4000."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GRIP-1", name: "Grip Tape", category: "GRIP", unit_price_cents: 1299 }
              as: ShopManager
              captures: { p1_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "WAX-1", name: "Surf Wax", category: "WAX", unit_price_cents: 899 }
              as: ShopManager
              captures: { p2_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "svc@x.com", full_name: "Svc Sue" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { customer_id: "${cust_id}", board_description: "Regrip + wax", parts: [ { product_id: "${p1_id}", qty: 2, unit_price_cents: 1299 }, { product_id: "${p2_id}", qty: 1, unit_price_cents: 899 } ], labor_cents: 4000 }
              as: BenchTech
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /service-tickets/${st_id}/ready"
              payload: {}
              as: BenchTech
              captures: { total: $.data.total_cents }
          assert:
            - "ServiceTicket.${st_id}.total_cents == 8040"
            - "ServiceTicket.${st_id}.status == READY"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: special_order_quote_revise_cycle
        grounds:
          - state_machines.SpecialOrder.QUOTED_to_CUSTOMER_REVIEW
          - state_machines.SpecialOrder.CUSTOMER_REVIEW_to_QUOTED
          - entities.SpecialOrder.fields.revision_count
          - concurrency_rules[revise-supersede-stale-order]
        distinguishing_aspect: "SpecialOrder exhibits a cycle QUOTED→CUSTOMER_REVIEW→QUOTED (revise then re-quote), returning to QUOTED with revision_count incremented — a true loop, on a different entity than the Rental parallel machine."
        test_recipe:
          setup:
            - "A Customer, a Product, and a SpecialOrder that has been quoted once (status QUOTED, version captured)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "so@x.com", full_name: "Order Ora" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COMP-9", name: "Custom Complete", category: "COMPLETE", unit_price_cents: 15000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 15000 }
              as: ShopManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/revise"
              payload: { expected_special_order_version: "${v1}" }
              as: SalesAssociate
              captures: { mid_status: $.data.status, rc: $.data.revision_count }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 14000 }
              as: ShopManager
              captures: { final_status: $.data.status }
          assert:
            - "after revise SpecialOrder.${so_id}.status == CUSTOMER_REVIEW"
            - "after re-quote SpecialOrder.${so_id}.status == QUOTED"
            - "SpecialOrder.${so_id}.revision_count == 1"

      - name: rental_parallel_fulfillment_payment_dimensions
        grounds:
          - state_machines.Rental.RESERVED_to_PICKED_UP
          - state_machines.Rental.PICKED_UP_to_RETURNED
          - entities.Rental.fields.fulfillment_status
          - entities.Rental.fields.payment_status
        distinguishing_aspect: "Rental (distinct entity from SpecialOrder) carries two independent status axes — fulfillment RESERVED→PICKED_UP→RETURNED and payment DEPOSIT_HELD→DEPOSIT_REFUNDED — that advance on different transitions."
        test_recipe:
          setup:
            - "A rentable product (@rental_day_rate 2000), a RentalAsset, a Customer, and a Rental RESERVED for 07-02→07-05 then checked out. Clock stays at default 2026-07-01 so return is on-time."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SB-1", name: "Softtop", category: "SURFBOARD", unit_price_cents: 50000, rental_day_rate_cents: 2000, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "SB-A1" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rent@x.com", full_name: "Rent Rex" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", start_at: "2026-07-02T00:00:00Z", end_at: "2026-07-05T00:00:00Z", deposit_cents: 5000 }
              as: SalesAssociate
              captures: { rent_id: $.data.id, ff0: $.data.fulfillment_status, pay0: $.data.payment_status }
            - call: "POST /rentals/${rent_id}/checkout"
              payload: {}
              as: SalesAssociate
              captures: { ff1: $.data.fulfillment_status, pay1: $.data.payment_status }
          trigger:
            - call: "POST /rentals/${rent_id}/return"
              payload: {}
              as: SalesAssociate
              captures: { ff2: $.data.fulfillment_status, pay2: $.data.payment_status, late: $.data.late_fee_cents }
          assert:
            - "after checkout Rental.${rent_id}.fulfillment_status == PICKED_UP while payment_status stayed DEPOSIT_HELD (dimensions independent)"
            - "Rental.${rent_id}.fulfillment_status == RETURNED"
            - "Rental.${rent_id}.payment_status == DEPOSIT_REFUNDED"
            - "Rental.${rent_id}.late_fee_cents == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: lesson_cancel_releases_rental_frees_asset_depth3
        grounds:
          - state_machines.Lesson.SCHEDULED_to_CANCELLED
          - state_machines.Rental.RESERVED_to_RELEASED
          - state_machines.RentalAsset.RESERVED_to_AVAILABLE
        distinguishing_aspect: "Depth-3 cascade from Lesson.cancel: Lesson→CANCELLED causes Rental→RELEASED which itself causes RentalAsset→AVAILABLE and Rental.payment→DEPOSIT_REFUNDED; each hop caused by the prior."
        test_recipe:
          setup:
            - "A Coach, a Customer, a SCHEDULED Lesson, a rentable product+asset, and a RESERVED Rental linked to that lesson."
          setup_api_calls:
            - call: "POST /coaches"
              payload: { name: "Coach A", discipline: "SURF" }
              as: ShopManager
              captures: { coach_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "casc@x.com", full_name: "Cass Cade" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SURF", start_at: "2026-07-03T10:00:00Z", end_at: "2026-07-03T11:00:00Z" }
              as: SalesAssociate
              captures: { les_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "WS-1", name: "Wetsuit", category: "WETSUIT", unit_price_cents: 12000, rental_day_rate_cents: 1500, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "WS-A1" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", lesson_id: "${les_id}", start_at: "2026-07-03T00:00:00Z", end_at: "2026-07-04T00:00:00Z", deposit_cents: 3000 }
              as: SalesAssociate
              captures: { rent_id: $.data.id }
          trigger:
            - call: "POST /lessons/${les_id}/cancel"
              payload: {}
              as: SalesAssociate
              captures: { les_status: $.data.status }
          assert:
            - "Lesson.${les_id}.status == CANCELLED"
            - "Rental.${rent_id}.fulfillment_status == RELEASED"
            - "Rental.${rent_id}.payment_status == DEPOSIT_REFUNDED"
            - "RentalAsset.${asset_id}.status == AVAILABLE"

      - name: event_cancel_cancels_entries_reverses_loyalty_depth3
        grounds:
          - state_machines.Event.PUBLISHED_to_CANCELLED
          - state_machines.EventEntry.REGISTERED_to_CANCELLED
          - entities.Customer.fields.loyalty_points
          - entities.Event.fields.entry_count
        distinguishing_aspect: "Depth-3 cascade from a different trigger (Event.cancel): Event→CANCELLED causes each EventEntry→CANCELLED which itself reverses that entry's points_awarded from Customer.loyalty_points and decrements Event.entry_count."
        test_recipe:
          setup:
            - "A Customer, a PUBLISHED Event (entry_fee 5000), and one REGISTERED team-rider entry that accrued 100 loyalty points."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ev@x.com", full_name: "Eve Entrant" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Summer Demo", sponsor: "BrandX", venue: "North Beach", start_at: "2026-07-10T00:00:00Z", capacity: 10, entry_fee_cents: 5000 }
              as: ShopManager
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/publish"
              payload: {}
              as: ShopManager
            - call: "POST /event-entries"
              payload: { event_id: "${ev_id}", customer_id: "${cust_id}", role: "TEAM_RIDER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ee_id: $.data.id, pa: $.data.points_awarded }
          trigger:
            - call: "POST /events/${ev_id}/cancel"
              payload: {}
              as: ShopManager
              captures: { ev_status: $.data.status }
          assert:
            - "Event.${ev_id}.status == CANCELLED"
            - "EventEntry.${ee_id}.status == CANCELLED"
            - "EventEntry.${ee_id}.points_awarded == 100"
            - "Customer.${cust_id}.loyalty_points == 0"
            - "Event.${ev_id}.entry_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_fulfill_state_beats_stock_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: "Category pair state(5) vs business_fiscal(13): fulfilling a QUOTED (not APPROVED) order whose product has zero stock returns ERR_ORDER_INVALID_STATE (state wins), not ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup:
            - "A Customer, a Product with on_hand 0, and a SpecialOrder in QUOTED status (quantity 5)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pv1@x.com", full_name: "Prio One" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COMP-Z", name: "Complete Z", category: "COMPLETE", unit_price_cents: 9000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 5 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 45000 }
              as: ShopManager
          trigger:
            - call: "POST /special-orders/${so_id}/fulfill"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "fulfill response data.error_id == ERR_ORDER_INVALID_STATE"
            - "SpecialOrder.${so_id}.status == QUOTED"

      - name: build_reserve_safety_beats_stock_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_COMPONENT_INCOMPATIBLE]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: "Category pair business_safety(6) vs business_fiscal(13): reserving a build whose lone component is DISCONTINUED and out of stock returns ERR_COMPONENT_INCOMPATIBLE (safety wins), not ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup:
            - "A Customer, a DISCONTINUED Product with on_hand 0, and a DRAFT BoardBuild using that product as its component."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pv2@x.com", full_name: "Prio Two" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "DECK-D", name: "Deck D", category: "DECK", unit_price_cents: 8000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/discontinue"
              payload: {}
              as: ShopManager
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: BenchTech
              captures: { bb_id: $.data.id }
          trigger:
            - call: "POST /board-builds/${bb_id}/reserve"
              payload: {}
              as: BenchTech
              captures: { err: $.data.error_id }
          assert:
            - "reserve response data.error_id == ERR_COMPONENT_INCOMPATIBLE"
            - "BoardBuild.${bb_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_gold_threshold_inclusive
        grounds:
          - calculations.loyalty_tier
          - entities.Customer.fields.tier
          - entities.Customer.fields.lifetime_spend_cents
        distinguishing_aspect: "Metric = lifetime_spend_cents on the loyalty-adjustments endpoint; an EARN of exactly 100000 lands tier GOLD (>= is inclusive at the boundary)."
        test_recipe:
          setup:
            - "A fresh BRONZE Customer with lifetime_spend 0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "gold@x.com", full_name: "Goldie" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { kind: "EARN", spend_cents: 100000 }
              as: SalesAssociate
              captures: { tier: $.data.tier, ls: $.data.lifetime_spend_cents }
          assert:
            - "Customer.${cust_id}.lifetime_spend_cents == 100000"
            - "Customer.${cust_id}.tier == GOLD"
            - "Customer.${cust_id}.loyalty_points == 1000"

      - name: build_reserve_stock_boundary_exact
        grounds:
          - validations[priority=13]
          - calculations.product_availability
          - entities.Product.fields.available_qty
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: "Metric = component available_qty vs requested qty on the build-reserve endpoint (a different metric/endpoint than the tier threshold): qty == available_qty (5==5) succeeds driving available to 0; a subsequent qty 1 (> available 0) is rejected — inclusive >=."
        test_recipe:
          setup:
            - "A Customer, a Product with on_hand 5, and two DRAFT BoardBuilds against it — build A qty 5, build B qty 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "bnd@x.com", full_name: "Boundary Bo" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "WHL-B", name: "Wheels B", category: "WHEELS", unit_price_cents: 3000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/inventory-adjustments"
              payload: { delta_on_hand: 5 }
              as: ShopManager
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${prod_id}", qty: 5 } ] }
              as: BenchTech
              captures: { bbA_id: $.data.id }
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: BenchTech
              captures: { bbB_id: $.data.id }
          trigger:
            - call: "POST /board-builds/${bbA_id}/reserve"
              payload: {}
              as: BenchTech
              captures: { a_status: $.data.status }
            - call: "POST /board-builds/${bbB_id}/reserve"
              payload: {}
              as: BenchTech
              captures: { err: $.data.error_id }
          assert:
            - "after A reserve (qty 5 == available 5) Product.${prod_id}.available_qty == 0 and Product.${prod_id}.reserved_qty == 5"
            - "B reserve (qty 1 > available 0) response data.error_id == ERR_INSUFFICIENT_STOCK"
            - "BoardBuild.${bbB_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rental_checkout_requires_linked_lesson_scheduled
        grounds:
          - validations[priority=10]
          - state_machines.Rental.RESERVED_to_PICKED_UP
          - errors[ERR_LESSON_NOT_SCHEDULED]
        distinguishing_aspect: "Entity pair Rental→Lesson: checkout of a rental whose linked Lesson is COMPLETED (not SCHEDULED) is rejected ERR_LESSON_NOT_SCHEDULED while the rental stays RESERVED."
        test_recipe:
          setup:
            - "A Coach, Customer, a RESERVED Rental linked to a Lesson that has since been COMPLETED (completing a lesson does not cascade the rental)."
          setup_api_calls:
            - call: "POST /coaches"
              payload: { name: "Coach B", discipline: "SKATE" }
              as: ShopManager
              captures: { coach_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ce1@x.com", full_name: "Cross One" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SKATE", start_at: "2026-07-06T10:00:00Z", end_at: "2026-07-06T11:00:00Z" }
              as: SalesAssociate
              captures: { les_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "DECK-R", name: "Deck R", category: "COMPLETE", unit_price_cents: 12000, rental_day_rate_cents: 1000, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "DECK-RA1" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", lesson_id: "${les_id}", start_at: "2026-07-06T00:00:00Z", end_at: "2026-07-07T00:00:00Z", deposit_cents: 2000 }
