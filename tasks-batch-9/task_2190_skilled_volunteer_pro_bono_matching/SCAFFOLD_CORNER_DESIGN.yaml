            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1"}
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 2, years_experience: 1.0}, captures: {err: "$.data.error_id"}}
