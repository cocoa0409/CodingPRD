              captures: { prop_id: $.data.id }
            - call: "POST /fair-plan/applications"
              payload: { property_id: "${prop_id}", applicant_id: "${appl_id}", requested_dwelling_limit_cents: 54000000, requested_peril_package: "BASIC_FIRE_EO" }
