            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-02T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}" }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-03T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}" }
            - { call: "GET /portfolio/plants", payload: {}, as: SupplyChainPlanner }
          assert:
            - "before execution: S committed 10000 (utilization 10.00), T committed 0 — item counted at source while PLANNED/QUALIFYING"
            - "after second PASS: plant S committed_units_per_quarter == 0 and utilization_pct == 0.00"
            - "plant T committed_units_per_quarter == 10000 and utilization_pct == 50.00"
      - name: scheduled_actions_negotiation_ttl_expiry
        claim_type: scheduled_actions
        grounds:
          - state_machines.CombinedNegotiation.TERMS_PROPOSED_to_EXPIRED
          - errors[ERR_NEGOTIATION_EXPIRED]
        distinguishing_aspect: "A respond attempted strictly after expires_at (created 2026-09-01, expires 2026-10-01; clock 2026-10-02) flips the negotiation to EXPIRED and fails with ERR_NEGOTIATION_EXPIRED; at exactly expires_at it would still succeed."
        test_recipe:
          setup: ["Negotiation N TERMS_PROPOSED created at default clock; clock advanced to 2026-10-02T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /portfolio/retailers", payload: { name: "R-CC3", risk_rating: "LOW" }, as: PortfolioManager, captures: { r_id: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-CC3-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-CC3-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 90 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 50 } ], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }, as: PortfolioManager, captures: { n_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/combined-negotiations/${n_id}/respond", payload: { response: "ACCEPT" }, as: RetailerBuyer, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /portfolio/combined-negotiations/${n_id}", payload: {}, as: PortfolioManager, captures: { n_st: $.data.negotiation_status } }
          assert:
            - "err == ERR_NEGOTIATION_EXPIRED and http status 409"
            - "negotiation_status == EXPIRED (the failed respond still fires the auto-transition)"
      - name: tsa_terminate_cascade_layer
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TransitionServiceAgreement.ACTIVE_to_TERMINATED
        excluded_because:
          difficulty_instance: transitive_cascade / tsa_terminate_depth3_cascade
          rationale: "The depth-3 cascade (items -> cases -> plants) is asserted end-to-end there."
      - name: obsolescence_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.obsolescence_charge
        excluded_because:
          difficulty_instance: dual_variant_calc / obsolescence_standard_vs_salvage_variant
          rationale: "Both variants and their 50000/40000 divergence asserted there."
      - name: priority_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.innovation_priority_score
        excluded_because:
          difficulty_instance: dual_variant_calc / innovation_priority_standard_vs_core_brand_variant
          rationale: "STANDARD 68.00 vs CORE_BRAND 78.00 asserted there."

  - section: consistency_model
    instances:
      - name: post_then_get_immediately_reflects_mutation
        claim_type: immediate_consistency
        grounds:
          - complexity_profile
        distinguishing_aspect: "Immediate consistency: a brand created by POST is visible in the very next GET list with version 1 and created_at stamped from the logical clock (2026-09-01T00:00:00.000Z default)."
        test_recipe:
          setup: ["empty DB at default clock"]
          setup_api_calls: []
          trigger:
            - { call: "POST /portfolio/brands", payload: { name: "B-CM1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "GET /portfolio/brands", payload: {}, as: PortfolioManager, captures: { g_id: "$.data[0].id", g_v: "$.data[0].version", g_cat: "$.data[0].created_at" } }
          assert:
            - "g_id == ${b_id} (mutation visible immediately, same request cycle)"
            - "g_v == 1 and g_cat == 2026-09-01T00:00:00.000Z"
