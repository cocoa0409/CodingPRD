          assert:
            - "${issued_a} == 3.00 and ${insp_a_status} == DEFICIENCIES_ISSUED"
            - "${w1} == 3.00 and ${posture1} == OPEN"
            - "${w2} == 6.00 and ${posture2} == RESTRICTED (6.00 is at the RESTRICT threshold, not above it)"
            - "${w3} == 16.00 and ${posture3} == SUSPENDED (16.00 is at the SUSPEND threshold, not above it)"
            - "${readiness3} == 60.00 (deficiency_penalty 40.00)"
            - "Inspection.${insp_c_id}.issued_weight_total == 10.00"
            - "TestSite.${site_id}.manual_entry_blocked == true"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: access_reinstatement_blocked_by_site_posture_then_allowed_after_recoverage
        grounds:
          - validations[priority=42].ERR_SITE_OVERSIGHT_SUSPENDED
          - state_machines.Operator.access_LOCKED_OUT_to_ACTIVE
          - calculations.site_oversight_posture
        distinguishing_aspect: |
          Every precondition local to the Operator row is satisfied
          (access_status == LOCKED_OUT, competency_status == PROVISIONAL), yet
          reinstatement is refused because a different entity - the TestSite -
          has oversight_posture == SUSPENDED; once a fresh non-overlapping
          coverage restores the site to RESTRICTED the identical request
          succeeds, so the outcome is decided purely by the other entity's
          state.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-09-05T00:00:00Z."
            - "cert1 is a certificate of waiver effective 2026-01-01 and expiring 2026-12-31; its coverage of the site runs 2026-01-01..2026-08-31."
            - "One trained operator op_a (PROVISIONAL x ACTIVE)."
            - "cert1 is suspended, so CASCADE-B locks op_a out with lockout_reason SITE_SUSPENDED and drives the site to oversight_posture SUSPENDED (no in-window ACTIVE coverage)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243018", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ProgramAdmin
              captures: { cert1_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Reinstatement POCT", department_code: "DEPT-270", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert1_id}", coverage_start: "2026-01-01", coverage_end: "2026-08-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_a_id: $.data.id }
            - call: "POST /poct/operators/${op_a_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/certificates/${cert1_id}/suspend"
              payload: { reason: "Complaint survey sanction" }
              as: ProgramAdmin
            - call: "GET /poct/operators/${op_a_id}"
              as: ProgramAdmin
              captures: { pre_access: $.data.access_status, pre_reason: $.data.lockout_reason, pre_competency: $.data.competency_status }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { pre_posture: $.data.oversight_posture }
          trigger:
            - call: "POST /poct/operators/${op_a_id}/access-reinstatement"
              payload: { justification: "Retraining verified, operator returning to duty" }
              as: ProgramAdmin
              captures: { error_id: $.data.error_id, message: $.data.message }
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243019", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-09-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert2_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert2_id}", coverage_start: "2026-09-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
              captures: { mid_snapshot: $.data.permitted_complexity_snapshot }
            - call: "GET /poct/sites/${site_id}"
              as: ProgramAdmin
              captures: { mid_posture: $.data.oversight_posture }
            - call: "POST /poct/operators/${op_a_id}/access-reinstatement"
              payload: { justification: "Retraining verified, operator returning to duty" }
              as: ProgramAdmin
              captures: { post_access: $.data.access_status, post_reason: $.data.lockout_reason }
          assert:
            - "${pre_access} == LOCKED_OUT, ${pre_reason} == SITE_SUSPENDED, ${pre_competency} == PROVISIONAL and ${pre_posture} == SUSPENDED"
            - "the first reinstatement returns HTTP 409 with ${error_id} == ERR_SITE_OVERSIGHT_SUSPENDED"
            - "${mid_snapshot} == WAIVED and ${mid_posture} == RESTRICTED (in-window ACTIVE coverage exists again, but 1 locked-out operator of 1 total still trips the strict-majority test)"
            - "the second reinstatement returns HTTP 200 with ${post_access} == ACTIVE and ${post_reason} == null"
            - "Operator.${op_a_id}.competency_status == PROVISIONAL throughout (reinstatement touches only the access dimension)"
            - "TestSite.${site_id}.oversight_posture == OPEN and TestSite.${site_id}.locked_out_operator_count == 0 after the second reinstatement"
            - "CliaCertificate.${cert1_id}.status == SUSPENDED and CliaCertificate.${cert2_id}.status == ACTIVE"

      - name: qc_unlock_requires_verified_lot_on_the_confirming_run
        grounds:
          - validations[priority=44].ERR_LOT_NOT_VERIFIED
          - state_machines.Device.QC_LOCKED_to_ACTIVE
          - state_machines.ReagentLot.UNVERIFIED_to_VERIFIED
        distinguishing_aspect: |
          The confirming QcRun is itself a PASS on the right device, so every
          Device-local precondition holds; the unlock is nevertheless refused
          because the ReagentLot that run was measured against is still
          UNVERIFIED. After the same lot is verified with a LEVEL_1/LEVEL_2
          pair the identical unlock request succeeds, proving the gate lives on
          the lot rather than on the run.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained operator."
            - "One INTERFACED device with qc_frequency_days 30."
            - "One reagent lot left UNVERIFIED, with LEVEL_1 range 80.0..120.0 and LEVEL_2 range 250.0..350.0."
            - "A LEVEL_1 run at 140.0 fails and locks the device with qc_lock_reason QC_FAILURE; a LEVEL_1 run at 100.0 then passes but the lot is still UNVERIFIED."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243020", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Unlock POCT", department_code: "DEPT-280", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op1_id: $.data.id }
            - call: "POST /poct/operators/${op1_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-0901", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-H1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 140.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { fail_result: $.data.result }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc_l1_id: $.data.id, l1_result: $.data.result }
          trigger:
            - call: "POST /poct/devices/${dev1_id}/qc-unlock"
              payload: { confirming_qc_run_id: "${qc_l1_id}", note: "Repeat control in range" }
              as: QualityCoordinator
              captures: { error_id: $.data.error_id, message: $.data.message }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev1_id}", reagent_lot_id: "${lot1_id}", operator_id: "${op1_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op1_id}"
              captures: { qc_l2_id: $.data.id }
            - call: "POST /poct/reagent-lots/${lot1_id}/verify"
              payload: { level_1_qc_run_id: "${qc_l1_id}", level_2_qc_run_id: "${qc_l2_id}" }
              as: QualityCoordinator
              captures: { lot_status: $.data.verification_status }
            - call: "POST /poct/devices/${dev1_id}/qc-unlock"
              payload: { confirming_qc_run_id: "${qc_l1_id}", note: "Repeat control in range" }
              as: QualityCoordinator
              captures: { dev_status: $.data.status, dev_reason: $.data.qc_lock_reason, next_due: $.data.qc_next_due_at, pass_on: $.data.last_two_level_qc_pass_on }
          assert:
            - "${fail_result} == FAIL and ${l1_result} == PASS"
            - "the first qc-unlock returns HTTP 409 with ${error_id} == ERR_LOT_NOT_VERIFIED"
            - "${lot_status} == VERIFIED"
            - "the second qc-unlock returns HTTP 200 with ${dev_status} == ACTIVE and ${dev_reason} == null"
            - "${pass_on} == 2026-08-01 and ${next_due} == 2026-08-31"
            - "ReagentLot.${lot1_id}.verified_at == 2026-08-01T00:00:00Z"
            - "TestSite.${site_id}.oversight_posture == OPEN and TestSite.${site_id}.held_result_count == 0"

      - name: posting_blocked_by_device_locked_through_proficiency_failure
        grounds:
          - validations[priority=41].ERR_DEVICE_QC_LOCKED
          - state_machines.ProficiencyEvent.PENDING_to_UNSUCCESSFUL_LOCKED
          - state_machines.TestResult.PENDING_REVIEW_to_POSTED
        distinguishing_aspect: |
          The TestResult is validly PENDING_REVIEW and the acting operator is
          fully qualified, but posting is refused because a proficiency-testing
          failure on a completely different entity chain (enrollment -> event)
          locked the Device with qc_lock_reason PT_UNSUCCESSFUL; the result is
          neither HELD nor REJECTED, only unpostable.
