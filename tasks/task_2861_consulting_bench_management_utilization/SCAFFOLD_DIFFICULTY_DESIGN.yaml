  - rule_id: non_linear_state_machine
    instances:

      - name: bench_spell_reskilling_cycle_returns_to_monitoring
        grounds:
          - state_machines.BenchSpell.MONITORING_to_ESCALATED_L1
          - state_machines.BenchSpell.ESCALATED_L1_to_RESKILLING
          - state_machines.BenchSpell.RESKILLING_to_MONITORING
          - state_machines.ReskillingProgram.PLANNED_to_RUNNING
          - state_machines.ReskillingProgram.RUNNING_to_COMPLETED
          - calculations.bench_aging_escalation
          - entities.BenchSpell.fields.age_reset_on
          - entities.BenchSpell.fields.escalation_count
          - endpoints[POST /reskilling-programs/{id}/enrollments]
          - endpoints[POST /reskilling-programs/{id}/complete]
        distinguishing_aspect: |
          The cycle lives on BenchSpell: MONITORING -> ESCALATED_L1 -> RESKILLING ->
          MONITORING returns the row to a state it already occupied, and the loop is
          terminating rather than infinite only because RESKILLING -> MONITORING stamps
          age_reset_on, restarting age_days at 0 while escalation_count keeps its history.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group with default level_targets (CONSULTANT L1 = 14 days, L2 = 30 days) and one CLOUD_ARCH skill."
            - "One CONSULTANT-level consultant, never staffed, so creating them opened BenchSpell #1 in MONITORING with started_on 2026-08-03."
            - "That consultant holds an ACTIVE proficiency-4 assertion on CLOUD_ARCH, so the programme's graduation raise (target 5) is observable as an upgrade, not an insert."
            - "Clock advanced to 2026-08-17 and one bench-run executed, so the spell is ESCALATED_L1 with age_days 14 and escalation_count 1."
            - "One ReskillingProgram on the same skill, target proficiency 5, cohort 2026-08-18..2026-08-28, seat_capacity 2, still PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
              captures: { sa1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "POST /reskilling-programs"
              payload: { skill_id: "${sk_id}", target_proficiency_level: 5, cohort_start_on: "2026-08-18", cohort_end_on: "2026-08-28", seat_capacity: 2 }
              as: ResourceManager
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /reskilling-programs/${rp_id}/enrollments"
              payload: { consultant_id: "${c1_id}" }
              as: ResourceManager
              captures: { spell_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-18T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T00:00:00Z" }
              as: ResourceManager
            - call: "POST /reskilling-programs/${rp_id}/complete"
              payload: {}
              as: ResourceManager
          assert:
            - "on the enrollment response: BenchSpell.${spell_id}.state == RESKILLING, reskilling_program_id == ${rp_id}, investment_started_on == 2026-08-17, escalation_count == 1"
            - "after the enrollment: Consultant.${c1_id}.availability_status == RESKILLING and ReskillingProgram.${rp_id}.seats_taken == 1"
            - "after the 2026-08-18 bench-run: ReskillingProgram.${rp_id}.status == RUNNING (the spell did NOT age while RESKILLING)"
            - "after complete: ReskillingProgram.${rp_id}.status == COMPLETED and seats_taken == 0"
            - "after complete: BenchSpell.${spell_id}.state == MONITORING — the row is back in a state it already occupied"
            - "BenchSpell.${spell_id}.age_reset_on == 2026-08-28 and age_days == 0"
            - "BenchSpell.${spell_id}.escalation_count == 1 — the cycle resets the aging clock but never the escalation history"
            - "BenchSpell.${spell_id}.investment_ended_on == 2026-08-28 and ended_on is null"
            - "Consultant.${c1_id}.availability_status == BENCH"
            - "GET /skill-assertions?consultant_id=${c1_id}&skill_id=${sk_id} returns exactly 1 row and SkillAssertion.${sa1_id}.proficiency_level == 5 (raised from 4, not duplicated)"

