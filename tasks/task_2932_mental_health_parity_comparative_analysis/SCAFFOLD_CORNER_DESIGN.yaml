          - calculations.regulator_response_completeness_score
        distinguishing_aspect: "ACCEPTED adjudication drives the plan year to the terminal CLOSED, after which every child mutation — even inventorying a new NQTL, which is otherwise allowed under REMEDIATION — returns ERR_PLAN_YEAR_CLOSED."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one PRIOR_AUTHORIZATION NqtlItem with no analysis."
            - "One RegulatorRequest demanding PRIOR_AUTHORIZATION, opened at the default clock 2026-08-01T00:00:00Z (response_due_at 2026-08-31T00:00:00.000Z), answered by the sponsor while the window is open."
