            - call: "POST /dispatch-assignments"
              payload: { order_id: "${ord_a}", inspector_id: "${insp_id}", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", dispatch_miles: 10, expected_order_version: "${ord_a_v1}" }
              as: OpsAdmin
              captures: { asg_a: $.data.id }
            - call: "POST /dispatch-assignments/${asg_a}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /dispatch-assignments/${asg_a}/release"
              payload: {}
