              as: ProgramCoordinator
            - call: "POST /watch/watch-groups/${wg}/certification-suspend"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/watch-groups/${wg}/freeze"
              payload: {}
              as: ProgramCoordinator
