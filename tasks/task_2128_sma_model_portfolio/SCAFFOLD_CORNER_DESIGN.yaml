              as: PortfolioManager
          trigger:
            - call: "POST /sma/accounts"
              payload: { sponsor_id: "${sp1}", model_id: "${m1}", account_number: "ACC-001" }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409 with error_id ERR_MODEL_NOT_PUBLISHED"
            - "Model.${m1}.published_model_version_id == null and Sponsor.${sp1}.account_count == 0"
            - "GET /sma/accounts?sponsor_id=${sp1} returns exactly 0 rows"

