      - name: segregation_of_duties_error_outranks_unconsented_method_error
        grounds:
          - validations.priority_10_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_36_ERR_DONOR_METHOD_NOT_CONSENTED
          - endpoints.POST_registry_workup_cases_id_collection_method
