            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 850000.00, afs_fair_value: 850000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { qual_asset_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 150000.00, afs_fair_value: 150000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cash_asset_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "GET /qof/penalty-assessments?fund_id=${fund_id}"
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { pa_id: "$.data[0].id" }
          trigger:
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-requests"
              payload: { cure_basis: "REASONABLE_CAUSE", narrative_reference: "MEMO-CYCLE-01" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-decisions"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { status_after_first_denial: $.data.status, attempts_after_first_denial: $.data.cure_attempt_count }
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-requests"
              payload: { cure_basis: "TREATED_AS_FAILURE", narrative_reference: "MEMO-CYCLE-02" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/penalty-assessments/${pa_id}/cure-decisions"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
          assert:
            - "${status_after_first_denial} == ASSESSED (a denied REASONABLE_CAUSE cure returns the row to a non-terminal state)"
            - "${attempts_after_first_denial} == 1"
            - "PenaltyAssessment.${pa_id}.status == UPHELD (the denied TREATED_AS_FAILURE basis is terminal)"
            - "PenaltyAssessment.${pa_id}.cure_attempt_count == 2"
            - "PenaltyAssessment.${pa_id}.cure_basis == TREATED_AS_FAILURE"
            - "PenaltyAssessment.${pa_id}.cure_credit_amount == 0.00"
            - "PenaltyAssessment.${pa_id}.net_penalty_amount == 1999.98"
            - "PenaltyAssessment.${pa_id}.decided_by_user_id == co-certifier-1"
            - "Fund.${fund_id}.compliance_posture == DEFICIENT"
            - "Fund.${fund_id}.cumulative_penalty_months == 6 (an UPHELD assessment still counts)"

      - name: business_test_fork_divergent_side_effects
        grounds:
          - state_machines.BusinessTest.MEASURED_to_PASSED
          - state_machines.BusinessTest.MEASURED_to_FAILED
          - state_machines.QOZBusiness.UNTESTED_to_QUALIFIED
          - state_machines.QOZBusiness.UNTESTED_to_DISQUALIFIED
          - calculations.qozb_prong_evaluation
        distinguishing_aspect: |
          Non-linearity on the BUSINESSTEST entity, branching shape: the single
          MEASURED state forks on prong content into PASSED (promoting the
          QOZB_EQUITY FundAsset to QUALIFIED) or FAILED-with-nqfp-FAIL
          (disqualifying the business and demoting its asset), and the two
          branches fire disjoint side-effect sets on the same fund.
