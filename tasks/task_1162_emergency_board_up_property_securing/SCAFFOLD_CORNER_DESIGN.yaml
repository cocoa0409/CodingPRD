        grounds: ["errors[ERR_HAZARD_NOT_MITIGATED]"]
        excluded_because:
          difficulty_instance: securing_gated_by_cleared_assessment
          rationale: "ERR_HAZARD_NOT_MITIGATED is asserted as the blocking error there."
      - name: error_docs_incomplete_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DOCS_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: invoice_submit_gated_by_package_and_permit
