# =============================================================================
# PRD Benchmark Scaffold — Inclusionary Zoning Compliance & Affordable Unit
# Monitoring (city housing department)
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2741. Inclusionary Zoning Compliance & Affordable Unit Monitoring (city housing
  department): ordinance applicability by project size, zoning district and approval
  date with alternative compliance options, in-lieu fee calculation, payment timing
  and fund use restrictions, affordability level assignment, unit mix, bedroom
  distribution and comparability standards, marketing plan approval, lottery
  administration and buyer/renter income certification, deed restriction or
  regulatory agreement recording with resale formula and refinance limits, annual
  monitoring of rents, incomes and occupancy with cure for violations, resale
  approval, right of first refusal and shared appreciation calculation, program
  compliance reporting to funders

domain_name: inclusionary-zoning-compliance
api_prefix: /iz-compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every collection is a
  # top-level path under /iz-compliance (no nested id-in-path ownership chains).

  state_machine_shape: cyclic
  # MarketingPlan (REVISION_REQUESTED -> SUBMITTED), LotteryEvent (DRAWN ->
  # PENDING on redraw) and MonitoringReview (ESCALATED -> CURE_SUBMITTED) all
  # loop; AffordableUnit additionally carries two independent state dimensions
  # (occupancy_status x compliance_status); ResaleTransaction forks at the
  # right-of-first-refusal decision and joins at two distinct terminal states.

  relationship_patterns:
    - one_to_many          # Project -> AffordableUnit, Project -> InLieuFee
    - self_referential     # ResaleTransaction.prior_transaction_id -> ResaleTransaction.id
    - cross_aggregate      # IncomeCertification links Household and AffordableUnit
    - polymorphic: false

  role_model: segregation_of_duties
  # The officer who issues a monitoring finding may not clear its cure; the
  # officer who approves a resale price may not certify that resale's buyer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Ordinance
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Ordinance citation code"
        constraints: "unique across all Ordinance rows; 1..40 chars"
      - name: effective_date
        type: string
        source: input
        description: "Earliest project approval_date this ordinance governs"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: min_project_units_threshold
        type: integer
        source: input
        description: "A project is SUBJECT only when total_units >= this value"
        constraints: ">= 1"
      - name: set_aside_bps_by_district
        type: object
        source: input
        description: "Map zoning district code -> set-aside basis points (10000 = 100%)"
        constraints: "keys subset of {R-2, R-4, C-2}; values integers 1..10000; a district absent from this map is EXEMPT"
      - name: gap_basis_cents_by_level
        type: object
        source: input
        description: "Map affordability level bps (as string key) -> affordability gap per unit in cents, the in-lieu fee base rate"
        constraints: "keys subset of {\"5000\", \"8000\", \"12000\"}; values integers >= 1"
      - name: fee_gap_level_bps
        type: integer
        source: input
        description: "Affordability level whose gap basis prices every in-lieu fee under this ordinance"
        constraints: "must be a key of gap_basis_cents_by_level"
      - name: surcharge_bps
        type: integer
        source: input
        description: "Administrative surcharge rate applied to the fee base"
        constraints: "0..10000"
      - name: surcharge_cap_cents
        type: integer
        source: input
        description: "Hard ceiling on the administrative surcharge in cents"
        constraints: ">= 0"
      - name: discount_tiers
        type: array
        source: input
        description: "Ordered scale discount tiers, each {min_pre_discount_cents, discount_bps}"
        constraints: "ascending by min_pre_discount_cents; first element MUST have min_pre_discount_cents == 0; discount_bps 0..10000"
      - name: fee_due_days
        type: integer
        source: input
        description: "Days from assessment instant to InLieuFee.due_date"
        constraints: ">= 1"
      - name: alternative_paths_allowed
        type: array
        source: input
        description: "Compliance paths other than ONSITE this ordinance permits"
        constraints: "subset of {OFFSITE, IN_LIEU_FEE, LAND_DEDICATION}; may be empty"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while no later-dated ordinance exists; SUPERSEDED once one does"
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: AmiSchedule
    parent: null
    common_fields: true
    fields:
      - name: effective_year
        type: integer
        source: input
        description: "Calendar year this area-median-income schedule governs"
        constraints: "unique across all AmiSchedule rows; 2000..2100"
      - name: median_income_cents_by_size
        type: object
        source: input
        description: "Map household size (string key) -> 100% AMI annual income in cents"
        constraints: "keys \"1\"..\"5\" all required; values integers >= 1"
      - name: utility_allowance_cents_by_bedrooms
        type: object
        source: input
        description: "Map bedroom count (string key) -> monthly utility allowance in cents"
        constraints: "keys \"0\"..\"3\" all required; values integers >= 0"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while no later effective_year schedule exists; SUPERSEDED once one does"
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Development name"
        constraints: "1..120 chars"
      - name: developer_user_id
        type: string
        source: system
        description: "X-User-ID of the Developer that created the project; ownership key for Developer-scoped writes"
      - name: zoning_district
        type: enum
        source: input
        description: "Zoning district the parcel sits in"
        constraints: "R-2 | R-4 | C-2"
      - name: total_units
        type: integer
        source: input
        description: "Total residential units in the development"
        constraints: ">= 1"
      - name: approval_date
        type: string
        source: input
        description: "Date the planning approval was granted; selects the governing ordinance vintage"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: ordinance_id
        type: string
        source: computed
        description: "FK -> Ordinance.id; pinned at screening to the Ordinance with the greatest effective_date <= approval_date (see calculations.ordinance_vintage_selection); null before first screening"
      - name: state
        type: enum
        source: system
        description: "Entitlement/compliance lifecycle state"
        default: DRAFT
        constraints: "DRAFT | SCREENED_SUBJECT | SCREENED_EXEMPT | PATH_ELECTED | AGREEMENT_RECORDED | MONITORING | CLOSED_OUT"
      - name: applicability
        type: enum
        source: computed
        description: "Ordinance applicability verdict produced by screening"
        default: PENDING
        constraints: "PENDING | SUBJECT | EXEMPT"
      - name: required_affordable_units
        type: integer
        source: computed
        description: "Whole affordable units owed on site (calculations.required_units_and_fraction)"
        default: 0
      - name: fractional_obligation_bps
        type: integer
        source: computed
        description: "Residual fractional obligation in basis points of one unit (calculations.required_units_and_fraction)"
        default: 0
      - name: compliance_path
        type: enum
        source: input
        description: "Elected compliance path; null until elect-path succeeds"
        constraints: "ONSITE | OFFSITE | IN_LIEU_FEE | LAND_DEDICATION"
      - name: onsite_unit_equivalents_bps
        type: integer
        source: computed
        description: "10000 * count(AffordableUnit rows of this project whose occupancy_status != WITHDRAWN)"
        default: 0
      - name: fee_covered_equivalents_bps
        type: integer
        source: computed
        description: "Sum of unit_equivalent_bps over this project's InLieuFee rows in state ASSESSED, PARTIALLY_PAID, DELINQUENT or PAID"
        default: 0
      - name: total_obligation_bps
        type: integer
        source: computed
        description: "required_affordable_units * 10000 + fractional_obligation_bps"
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate over child operations (calculations.project_compliance_posture)"
        default: PENDING
        constraints: "PENDING | NOT_APPLICABLE | COMPLIANT_ONSITE | COMPLIANT_BY_FEE | DEFICIENT | UNDER_ENFORCEMENT"
      - name: screened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent screening; null before first screening"
      - name: screen_count
        type: integer
        source: system
        description: "Number of times this project has been screened"
        default: 0

  - name: AffordableUnit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the development this restricted unit belongs to"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> RegulatoryAgreement.id; the agreement whose resale formula and refinance ceiling govern this unit"
      - name: unit_number
        type: string
        source: input
        description: "Unit designation; also the deterministic pairing key at lottery draw"
        constraints: "unique per project_id; 1..16 chars"
      - name: bedrooms
        type: integer
        source: input
        description: "Bedroom count; 0 denotes a studio"
        constraints: "0..3"
      - name: sqft
        type: integer
        source: input
        description: "Net livable square feet"
        constraints: ">= 200"
      - name: tenure
        type: enum
        source: input
        description: "Rental units are rent-and-income monitored annually; ownership units are deed-restricted and resale-controlled"
        constraints: "RENTAL | OWNERSHIP"
      - name: affordability_level_bps
        type: integer
        source: input
        description: "Assigned affordability level in basis points of AMI"
        constraints: "one of 5000, 8000, 12000"
      - name: market_comparable_sqft
        type: integer
        source: input
        description: "Square feet of the market-rate comparable unit used for the comparability standard"
        constraints: ">= 200"
      - name: occupancy_status
        type: enum
        source: system
        description: "Occupancy dimension; evolves independently of compliance_status"
        default: PLANNED
        constraints: "PLANNED | MARKETING | RESERVED | OCCUPIED | VACANT | WITHDRAWN"
      - name: compliance_status
        type: enum
        source: system
        description: "Monitoring dimension; evolves independently of occupancy_status"
        default: COMPLIANT
        constraints: "COMPLIANT | FINDING_OPEN | CURE_PENDING | OUT_OF_COMPLIANCE"
      - name: restriction_state
        type: enum
        source: system
        description: "Deed-restriction recording dimension; only OWNERSHIP units are ever RECORDED"
        default: NOT_RECORDED
        constraints: "NOT_RECORDED | RECORDED | RELEASED"
      - name: occupant_household_id
        type: string
        source: system
        description: "FK -> Household.id; lottery-selected household at RESERVED, certified tenant/owner at OCCUPIED, buyer after resale close; null when unoccupied"
      - name: current_rent_cents
        type: integer
        source: system
        description: "contract_rent_cents of the governing CERTIFIED IncomeCertification for this unit; 0 when none"
        default: 0
      - name: max_allowed_rent_cents
        type: integer
        source: computed
        description: "Rent ceiling from calculations.max_allowed_rent, refreshed whenever a certification is recorded against this unit"
        default: 0
      - name: original_purchase_price_cents
        type: integer
        source: system
        description: "Restricted purchase price basis; set at record-restriction and reset to the sale price at resale close"
        default: 0
      - name: ami_income_at_purchase_cents
        type: integer
        source: system
        description: "100% AMI annual income for household size (bedrooms + 1) captured from the ACTIVE AmiSchedule at record-restriction, re-captured at resale close"
        default: 0
      - name: restriction_recorded_at
        type: string
        source: system
        description: "Recording date of the deed restriction; null while NOT_RECORDED"
      - name: last_refinance_balance_cents
        type: integer
        source: system
        description: "Most recently approved refinance loan balance"
        default: 0
      - name: approved_refinance_cap_cents
        type: integer
        source: computed
        description: "Refinance ceiling from calculations.refinance_capacity, refreshed on every refinance-review"
        default: 0
      - name: withdrawn_reason
        type: string
        source: system
        description: "Reason captured at withdraw; cleared to null on reinstate"

  - name: MarketingPlan
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the development being marketed"
      - name: lottery_open_at
        type: datetime
        source: input
        description: "Inclusive start of the application window"
        constraints: "ISO 8601 UTC; strictly before lottery_close_at"
      - name: lottery_close_at
        type: datetime
        source: input
        description: "Exclusive end of the application window"
        constraints: "ISO 8601 UTC"
      - name: preference_categories
        type: array
        source: input
        description: "Ordered preference categories this plan awards"
        constraints: "subset of {LIVE_WORK, DISPLACED, PUBLIC_EMPLOYEE}; no duplicates; may be empty"
      - name: state
        type: enum
        source: system
        description: "Review lifecycle; REVISION_REQUESTED loops back to SUBMITTED via resubmit"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | REVISION_REQUESTED | CLOSED"
      - name: revision_round
        type: integer
        source: system
        description: "Incremented on every resubmit"
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer that last reviewed this plan"
      - name: review_note
        type: string
        source: system
        description: "Reviewer note recorded at the last review"

  - name: LotteryEvent
    parent: null
    common_fields: true
    fields:
      - name: marketing_plan_id
        type: string
        source: input
        description: "FK -> MarketingPlan.id; the approved plan whose window governs applications"
      - name: units_offered
        type: integer
        source: input
        description: "Number of units this round places"
        constraints: ">= 1"
      - name: eligibility_level_bps
        type: integer
        source: input
        description: "Affordability level whose income limit defines the eligible applicant pool"
        constraints: "one of 5000, 8000, 12000"
      - name: state
        type: enum
        source: system
        description: "PENDING before the draw, DRAWN after, COMPLETED once every selected household holds a CERTIFIED certification"
        default: PENDING
        constraints: "PENDING | DRAWN | COMPLETED"
      - name: round_seq
        type: integer
        source: system
        description: "Draw round; incremented by redraw"
        default: 1
      - name: drawn_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent draw"
      - name: drawn_by_user_id
        type: string
        source: system
        description: "X-User-ID of the administrator that ran the most recent draw"
      - name: selected_household_ids
        type: array
        source: computed
        description: "Household ids selected this round, in rank order (calculations.lottery_ranking)"
        default: []
      - name: waitlisted_household_ids
        type: array
        source: computed
        description: "Eligible-but-unplaced Household ids in rank order"
        default: []
      - name: redraw_reason
        type: string
        source: system
        description: "Reason captured at the most recent redraw"

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: applicant_name
        type: string
        source: input
        description: "Head-of-household name"
        constraints: "1..120 chars"
      - name: household_size
        type: integer
        source: input
        description: "Persons in the household; drives the income limit lookup"
        constraints: "1..5"
      - name: gross_annual_income_cents
        type: integer
        source: input
        description: "Self-reported gross annual household income in cents"
        constraints: ">= 0"
      - name: preference_claims
        type: array
        source: input
        description: "Preference categories claimed at apply time"
        default: []
        constraints: "subset of {LIVE_WORK, DISPLACED, PUBLIC_EMPLOYEE}; no duplicates"
      - name: lottery_event_id
        type: string
        source: system
        description: "FK -> LotteryEvent.id; the round this household applied to; null while REGISTERED"
      - name: state
        type: enum
        source: system
        description: "Applicant lifecycle"
        default: REGISTERED
        constraints: "REGISTERED | APPLIED | SELECTED | WAITLISTED | CERTIFIED"
      - name: preference_score
        type: integer
        source: computed
        description: "100 points per preference_claim that the plan's preference_categories also lists (calculations.lottery_ranking)"
        default: 0
      - name: rank_position
        type: integer
        source: computed
        description: "1-based position in the most recent draw's ranked eligible pool; null when not ranked"

  - name: IncomeCertification
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the certified household"
      - name: unit_id
        type: string
        source: input
        description: "FK -> AffordableUnit.id; the unit this certification qualifies the household for"
      - name: ami_schedule_year
        type: integer
        source: computed
        description: "effective_year of the AmiSchedule applied (calculations.ami_schedule_selection)"
      - name: certified_income_cents
        type: integer
        source: input
        description: "Verified gross annual household income in cents"
        constraints: ">= 0"
      - name: contract_rent_cents
        type: integer
        source: input
        description: "Monthly contract rent to be charged; MUST be 0 for OWNERSHIP units"
        constraints: ">= 0"
      - name: income_limit_cents
        type: integer
        source: computed
        description: "Annual income ceiling for household_size at the unit's affordability_level_bps (calculations.income_limit)"
      - name: max_rent_cents
        type: integer
        source: computed
        description: "Monthly rent ceiling for the unit (calculations.max_allowed_rent); 0 for OWNERSHIP units"
      - name: ami_pct_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * certified_income_cents / median_income_cents_by_size[household_size])"
      - name: effective_date
        type: string
        source: input
        description: "First day of the certification period"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: expires_at
        type: string
        source: computed
        description: "effective_date + 365 days for RENTAL units; null for OWNERSHIP units (no annual recertification)"
      - name: state
        type: enum
        source: system
        description: "Certification lifecycle"
        default: CERTIFIED
        constraints: "CERTIFIED | EXPIRED | SUPERSEDED"
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer that recorded this certification"
      - name: is_recertification
        type: boolean
        source: system
        description: "True when produced by the recertify endpoint"
        default: false

  - name: RegulatoryAgreement
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the development this agreement encumbers"
      - name: term_years
        type: integer
        source: input
        description: "Affordability term in years"
        constraints: ">= 30 and <= 99"
      - name: resale_formula
        type: enum
        source: input
        description: "Formula variant selected for every OWNERSHIP unit under this agreement"
        constraints: "AMI_INDEXED | SHARED_APPRECIATION"
      - name: owner_appreciation_share_bps
        type: integer
        source: input
        description: "Seller's share of appreciation in basis points; the city recaptures the remainder"
        constraints: "0..10000"
      - name: max_refinance_ltv_bps
        type: integer
        source: input
        description: "Maximum loan-to-restricted-value ratio permitted on refinance"
        constraints: "0..10000"
      - name: doc_number
        type: string
        source: system
        description: "Recorder's document number captured at recording"
        constraints: "unique across all RegulatoryAgreement rows once set"
      - name: recorded_at
        type: string
        source: system
        description: "Recording date; null while DRAFT"
      - name: state
        type: enum
        source: system
        description: "Recording lifecycle; RELEASED is cascaded by project close-out"
        default: DRAFT
        constraints: "DRAFT | RECORDED | RELEASED"

  - name: MonitoringReview
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> AffordableUnit.id; the unit reviewed"
      - name: review_year
        type: integer
        source: input
        description: "Monitoring year"
        constraints: "unique per unit_id; 2000..2100"
      - name: reported_rent_cents
        type: integer
        source: input
        description: "Monthly rent the owner reports charging"
        constraints: ">= 0"
      - name: reported_income_cents
        type: integer
        source: input
        description: "Recertified gross annual household income the owner reports"
        constraints: ">= 0"
      - name: occupancy_verified
        type: boolean
        source: input
        description: "Whether owner-occupancy / tenancy documentation was produced"
      - name: state
        type: enum
        source: system
        description: "Review lifecycle; ESCALATED loops back to CURE_SUBMITTED"
        default: RECORDED
        constraints: "RECORDED | COMPLIANT | FINDING_ISSUED | CURE_SUBMITTED | CURED | ESCALATED"
      - name: finding_types
        type: array
        source: computed
        description: "Findings detected at creation (calculations.monitoring_findings)"
        default: []
        constraints: "subset of {RENT_OVERCHARGE, INCOME_OVER_LIMIT, OCCUPANCY_UNVERIFIED}"
      - name: overcharge_monthly_cents
        type: integer
        source: computed
        description: "max(0, reported_rent_cents - unit.max_allowed_rent_cents)"
        default: 0
      - name: penalty_at_base_cents
        type: integer
        source: computed
        description: "Penalty evaluated as of the base cure deadline; the sole input to cure_extension_days (calculations.cure_penalty_and_deadline)"
        default: 0
      - name: cure_extension_days
        type: integer
        source: computed
        description: "0 or CURE_EXTENSION_DAYS, decided once from penalty_at_base_cents and never re-derived"
        default: 0
      - name: cure_deadline
        type: datetime
        source: computed
        description: "finding_issued_at + CURE_BASE_DAYS + cure_extension_days; null unless a finding was issued"
      - name: penalty_final_cents
        type: integer
        source: computed
        description: "Penalty frozen at the cure submission instant; null until a cure is submitted"
      - name: finding_issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the finding was issued"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer that created the review; blocked from clearing its cure"
      - name: cure_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent cure submission"
      - name: cleared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer that cleared the cure"
      - name: corrected_rent_cents
        type: integer
        source: system
        description: "Rent the owner reports after correction, captured at submit-cure"

  - name: ResaleTransaction
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> AffordableUnit.id; the deed-restricted unit being resold"
      - name: prior_transaction_id
        type: string
        source: input
        description: "FK -> ResaleTransaction.id; the immediately preceding CLOSED resale of the same unit, forming the resale chain; null for a first resale"
      - name: seller_household_id
        type: string
        source: system
        description: "FK -> Household.id; copied from unit.occupant_household_id at submission"
      - name: buyer_household_id
        type: string
        source: system
        description: "FK -> Household.id; set at certify-buyer; null on the ROFR-exercised branch"
      - name: buyer_certification_id
        type: string
        source: system
        description: "FK -> IncomeCertification.id; the buyer's CERTIFIED certification for this unit; null on the ROFR-exercised branch"
      - name: proposed_price_cents
        type: integer
        source: input
        description: "Price the seller proposes"
        constraints: ">= 1"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Unrestricted market appraisal in cents"
        constraints: ">= 1"
      - name: capital_improvements_cents
        type: integer
        source: input
        description: "Documented capital improvements submitted for credit"
        constraints: ">= 0"
      - name: deferred_maintenance_cents
        type: integer
        source: input
        description: "Deferred-maintenance deduction assessed against the seller"
        constraints: ">= 0"
      - name: broker_fee_cents
        type: integer
        source: input
        description: "Closing/broker cost deducted from the sale price to reach net proceeds"
        constraints: ">= 0"
      - name: resale_formula_applied
        type: enum
        source: computed
        description: "Copied from the unit's agreement at submission; pins which max_resale_price variant runs"
        constraints: "AMI_INDEXED | SHARED_APPRECIATION"
      - name: indexed_base_cents
        type: integer
        source: computed
        description: "Formula base before credits (calculations.max_resale_price)"
        default: 0
      - name: improvement_credit_cents
        type: integer
        source: computed
        description: "min(capital_improvements_cents, round_half_up(original_purchase_price_cents * IMPROVEMENT_CAP_BPS / 10000))"
        default: 0
      - name: max_resale_price_cents
        type: integer
        source: computed
        description: "Maximum lawful resale price (calculations.max_resale_price)"
        default: 0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "proposed_price_cents - broker_fee_cents, computed at close"
        default: 0
      - name: seller_equity_cents
        type: integer
        source: computed
        description: "Waterfall bucket 1 paid at close (calculations.resale_proceeds_waterfall)"
        default: 0
      - name: seller_improvement_credit_cents
        type: integer
        source: computed
        description: "Waterfall bucket 2 paid at close"
        default: 0
      - name: seller_appreciation_share_cents
        type: integer
        source: computed
        description: "Waterfall bucket 3 paid at close"
        default: 0
      - name: city_recapture_cents
        type: integer
        source: computed
        description: "Waterfall bucket 4; credited to the housing trust fund at close; 0 on the ROFR-exercised branch"
        default: 0
      - name: state
        type: enum
        source: system
        description: "Resale lifecycle; forks at rofr-decision and joins at two terminal states"
        default: SUBMITTED
        constraints: "SUBMITTED | PRICE_APPROVED | ROFR_WAIVED | ROFR_EXERCISED | BUYER_CERTIFIED | CLOSED | CITY_PURCHASE_CLOSED | SUPERSEDED"
      - name: price_approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of price approval"
      - name: price_approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the officer that approved the price; blocked from certifying the buyer"
      - name: rofr_deadline
        type: datetime
        source: computed
        description: "price_approved_at + ROFR_WINDOW_DAYS; null before price approval"
      - name: rofr_auto_waived
        type: boolean
        source: system
        description: "True when the clock swept past rofr_deadline without a decision"
        default: false
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of close"

  - name: InLieuFee
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the assessed development"
      - name: ordinance_id
        type: string
        source: computed
        description: "FK -> Ordinance.id; copied from project.ordinance_id at assessment so later ordinance vintages never re-price this fee"
      - name: superseded_by_fee_id
        type: string
        source: system
        description: "FK -> InLieuFee.id; the assessment that replaced this one; null unless state == SUPERSEDED"
      - name: basis
        type: enum
        source: input
        description: "FULL prices the entire obligation, FRACTIONAL only the residual fraction, SUBSTITUTION one withdrawn unit"
        constraints: "FULL | FRACTIONAL | SUBSTITUTION"
      - name: unit_equivalent_bps
        type: integer
        source: computed
        description: "Unit equivalents this assessment covers, in basis points (calculations.in_lieu_fee_assessment)"
      - name: base_amount_cents
        type: integer
        source: computed
        description: "unit_equivalent_bps / 10000 * ordinance.gap_basis_cents_by_level[fee_gap_level_bps], rounded half up to the cent"
      - name: surcharge_cents
        type: integer
        source: computed
        description: "min(surcharge_cap_cents, round_half_up(base_amount_cents * surcharge_bps / 10000))"
      - name: pre_discount_total_cents
        type: integer
        source: computed
        description: "base_amount_cents + surcharge_cents; the sole tier-selection input"
      - name: discount_bps_applied
        type: integer
        source: computed
        description: "discount_bps of the tier selected on pre_discount_total_cents"
      - name: discount_cents
        type: integer
        source: computed
        description: "round_half_up(pre_discount_total_cents * discount_bps_applied / 10000)"
      - name: assessed_amount_cents
        type: integer
        source: computed
        description: "pre_discount_total_cents - discount_cents"
      - name: paid_amount_cents
        type: integer
        source: system
        description: "Cumulative payments recorded against this assessment"
        default: 0
      - name: due_date
        type: string
        source: computed
        description: "Assessment date (logical clock) + ordinance.fee_due_days, as a calendar date"
      - name: state
        type: enum
        source: system
        description: "Payment lifecycle"
        default: ASSESSED
        constraints: "ASSESSED | PARTIALLY_PAID | PAID | DELINQUENT | SUPERSEDED"
      - name: last_payment_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent payment"

  - name: TrustFundDisbursement
    parent: null
    common_fields: true
    fields:
      - name: source_fee_id
        type: string
        source: input
        description: "FK -> InLieuFee.id; the paid assessment this draw is earmarked against"
      - name: eligible_use
        type: enum
        source: input
        description: "Fund use restriction category"
        constraints: "AFFORDABLE_HOUSING_PRODUCTION | RENTAL_SUBSIDY | HOMEBUYER_ASSISTANCE | ADMIN"
      - name: amount_cents
        type: integer
        source: input
        description: "Draw amount in cents"
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        description: "Draw lifecycle; VOIDED is the compensating action for DISBURSED"
        default: REQUESTED
        constraints: "REQUESTED | DISBURSED | VOIDED"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the administrator that requested the draw"
      - name: disbursed_at
        type: datetime
        source: system
        description: "Logical-clock instant funds left the fund"
      - name: void_reason
        type: string
        source: system
        description: "Reason captured at void"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ordinance
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /iz-compliance/ordinances (system side effect of creating a later-dated ordinance)"
        actor: system
        preconditions: ["existing.effective_date < new.effective_date", "existing.status == ACTIVE"]
        side_effects:
          - "existing.status = SUPERSEDED"
          - "existing.version += 1"
        note: "Superseding never re-prices an already-assessed InLieuFee because InLieuFee.ordinance_id is pinned at assessment."

  - entity: AmiSchedule
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /iz-compliance/ami-schedules (system side effect of creating a later-year schedule)"
        actor: system
        preconditions: ["existing.effective_year < new.effective_year", "existing.status == ACTIVE"]
        side_effects:
          - "existing.status = SUPERSEDED"
          - "existing.version += 1"

  - entity: Project
    state_field: state
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT]
    transitions:
      - from: DRAFT
        to: SCREENED_SUBJECT
        trigger: "POST /iz-compliance/projects/{project_id}/screen"
        actor: HousingComplianceOfficer
        preconditions:
          - "project.state == DRAFT"
          - "an Ordinance exists with effective_date <= project.approval_date (else ERR_NO_GOVERNING_ORDINANCE)"
          - "calculations.required_units_and_fraction yields applicability SUBJECT"
        side_effects:
          - "project.ordinance_id = calculations.ordinance_vintage_selection result"
          - "project.applicability = SUBJECT"
          - "project.required_affordable_units and project.fractional_obligation_bps = calculations.required_units_and_fraction"
          - "project.total_obligation_bps = required_affordable_units * 10000 + fractional_obligation_bps"
          - "project.screened_at = logical clock now; project.screen_count += 1"
          - "project.compliance_posture recomputed via calculations.project_compliance_posture (DEFICIENT while onsite + fee coverage < total_obligation_bps)"
          - "project.version += 1"
      - from: DRAFT
        to: SCREENED_EXEMPT
        trigger: "POST /iz-compliance/projects/{project_id}/screen"
        actor: HousingComplianceOfficer
        preconditions:
          - "project.state == DRAFT"
          - "an Ordinance exists with effective_date <= project.approval_date"
          - "calculations.required_units_and_fraction yields applicability EXEMPT"
        side_effects:
          - "project.ordinance_id pinned as in the SUBJECT branch"
          - "project.applicability = EXEMPT; required_affordable_units = 0; fractional_obligation_bps = 0; total_obligation_bps = 0"
          - "project.compliance_posture = NOT_APPLICABLE"
          - "project.screened_at = logical clock now; project.screen_count += 1; project.version += 1"
        note: "Fork point: the same trigger lands in one of two states with disjoint side-effect sets."
      - from: SCREENED_SUBJECT
        to: PATH_ELECTED
        trigger: "POST /iz-compliance/projects/{project_id}/elect-path"
        actor: Developer
        preconditions:
          - "project.state == SCREENED_SUBJECT"
          - "X-User-ID == project.developer_user_id"
          - "compliance_path == ONSITE OR compliance_path IN ordinance.alternative_paths_allowed"
        side_effects:
          - "project.compliance_path = requested path"
          - "project.version += 1"
      - from: PATH_ELECTED
        to: AGREEMENT_RECORDED
        trigger: "POST /iz-compliance/regulatory-agreements/{agreement_id}/record (cascade)"
        actor: system
        preconditions: ["project.state == PATH_ELECTED", "the recorded agreement's project_id == project.id"]
        side_effects:
          - "project.state = AGREEMENT_RECORDED"
          - "project.version += 1"
      - from: AGREEMENT_RECORDED
        to: MONITORING
        trigger: "POST /iz-compliance/income-certifications (cascade on the first certification against any unit of this project)"
        actor: system
        preconditions: ["project.state == AGREEMENT_RECORDED"]
        side_effects:
          - "project.state = MONITORING"
          - "project.version += 1"
      - from: MONITORING
        to: CLOSED_OUT
        trigger: "POST /iz-compliance/projects/{project_id}/close-out"
        actor: HousingComplianceOfficer
        preconditions:
          - "project.state == MONITORING"
          - "project.compliance_posture IN {COMPLIANT_ONSITE, COMPLIANT_BY_FEE}"
          - "every InLieuFee of this project has state IN {PAID, SUPERSEDED} (else ERR_FEE_OUTSTANDING)"
          - "no MonitoringReview on any unit of this project has state IN {FINDING_ISSUED, CURE_SUBMITTED, ESCALATED} (else ERR_OPEN_FINDING_BLOCKS_CLOSEOUT)"
        side_effects:
          - "project.state = CLOSED_OUT"
          - "every RegulatoryAgreement of this project with state == RECORDED -> RELEASED (each bumps its own version)"
          - "project.version += 1"
      - from: SCREENED_SUBJECT
        to: DRAFT
        trigger: "PATCH /iz-compliance/projects/{project_id}"
        actor: Developer
        preconditions:
          - "project.state IN {DRAFT, SCREENED_SUBJECT, SCREENED_EXEMPT, PATH_ELECTED, AGREEMENT_RECORDED}"
          - "X-User-ID == project.developer_user_id"
        side_effects:
          - "project.total_units and/or project.approval_date updated"
          - "project.applicability = PENDING; required_affordable_units = 0; fractional_obligation_bps = 0; total_obligation_bps = 0; compliance_path = null; ordinance_id = null"
          - "project.compliance_posture = PENDING"
          - "project.version += 1"
        note: "Revision loop: amending the entitlement re-opens screening. Existing InLieuFee rows are NOT superseded here; re-assessment is an explicit POST /iz-compliance/in-lieu-fees carrying the fresh expected_project_version."
      - from: PATH_ELECTED
        to: DRAFT
        trigger: "PATCH /iz-compliance/projects/{project_id}"
        actor: Developer
        preconditions: ["same as SCREENED_SUBJECT -> DRAFT"]
        side_effects: ["same as SCREENED_SUBJECT -> DRAFT"]
      - from: AGREEMENT_RECORDED
        to: DRAFT
        trigger: "PATCH /iz-compliance/projects/{project_id}"
        actor: Developer
        preconditions: ["same as SCREENED_SUBJECT -> DRAFT"]
        side_effects: ["same as SCREENED_SUBJECT -> DRAFT"]
      - from: SCREENED_EXEMPT
        to: DRAFT
        trigger: "PATCH /iz-compliance/projects/{project_id}"
        actor: Developer
        preconditions: ["same as SCREENED_SUBJECT -> DRAFT"]
        side_effects: ["same as SCREENED_SUBJECT -> DRAFT"]
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /iz-compliance/projects/{project_id}"
        actor: Developer
        preconditions: ["same as SCREENED_SUBJECT -> DRAFT"]
        side_effects: ["same as SCREENED_SUBJECT -> DRAFT (the clears are no-ops on a project that was never screened); project.version += 1"]
        note: "Self-transition: amending a project that has not been screened yet is legal and still bumps version, which is what a re-screen after PATCH relies on."

  - entity: AffordableUnit
    state_field: occupancy_status
    initial_state: PLANNED
    terminal_states: []
    note: |
      Dimension 1 of two independent dimensions on the same row; occupancy_status and
      compliance_status never gate each other's transitions. There is no OCCUPIED ->
      OCCUPIED transition: creating an IncomeCertification for a unit that is ALREADY
      OCCUPIED (the incoming buyer of a pending resale) performs no occupancy transition
      and leaves occupant_household_id untouched; that buyer is moved in by the
      POST /iz-compliance/resale-transactions/{resale_transaction_id}/close cascade.
    transitions:
      - from: PLANNED
        to: MARKETING
        trigger: "POST /iz-compliance/marketing-plans/{marketing_plan_id}/review with decision APPROVE (cascade)"
        actor: system
        preconditions: ["unit.project_id == plan.project_id", "unit.occupancy_status == PLANNED"]
        side_effects: ["unit.occupancy_status = MARKETING", "unit.version += 1"]
      - from: MARKETING
        to: RESERVED
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw (cascade)"
        actor: system
        preconditions:
          - "unit.occupancy_status == MARKETING"
          - "unit is among the first units_offered units of the project ordered by unit_number ASC"
        side_effects:
          - "unit.occupancy_status = RESERVED"
          - "unit.occupant_household_id = the selected Household at the matching rank_position"
          - "unit.version += 1"
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /iz-compliance/income-certifications (cascade)"
        actor: system
        preconditions: ["certification.unit_id == unit.id", "certification.household_id == unit.occupant_household_id"]
        side_effects:
          - "unit.occupancy_status = OCCUPIED"
          - "unit.current_rent_cents = certification.contract_rent_cents"
          - "unit.max_allowed_rent_cents = certification.max_rent_cents"
          - "unit.version += 1"
      - from: PLANNED
        to: OCCUPIED
        trigger: "POST /iz-compliance/income-certifications (cascade; direct placement without a lottery, e.g. OWNERSHIP units)"
        actor: system
        preconditions: ["certification.unit_id == unit.id", "unit.occupancy_status == PLANNED"]
        side_effects:
          - "unit.occupancy_status = OCCUPIED"
          - "unit.occupant_household_id = certification.household_id"
          - "unit.current_rent_cents = certification.contract_rent_cents"
          - "unit.max_allowed_rent_cents = certification.max_rent_cents"
          - "unit.version += 1"
      - from: VACANT
        to: OCCUPIED
        trigger: "POST /iz-compliance/income-certifications (cascade)"
        actor: system
        preconditions: ["certification.unit_id == unit.id", "unit.occupancy_status == VACANT"]
        side_effects: ["same as PLANNED -> OCCUPIED"]
      - from: OCCUPIED
        to: VACANT
        trigger: "POST /_clock/set_current_utc (sweep step 2: the governing certification expires)"
        actor: system
        preconditions:
          - "unit.tenure == RENTAL"
          - "the unit's CERTIFIED IncomeCertification has expires_at < new logical now"
        side_effects:
          - "certification.state = EXPIRED (certification.version += 1)"
          - "unit.occupancy_status = VACANT; unit.current_rent_cents = 0; unit.occupant_household_id = null"
          - "unit.version += 1"
      - from: PLANNED
        to: WITHDRAWN
        trigger: "POST /iz-compliance/affordable-units/{unit_id}/withdraw"
        actor: Developer
        preconditions:
          - "unit.occupancy_status IN {PLANNED, MARKETING}"
          - "X-User-ID == project.developer_user_id"
          - "unit.project.state != CLOSED_OUT"
        side_effects:
          - "unit.occupancy_status = WITHDRAWN; unit.withdrawn_reason = payload reason; unit.version += 1"
          - "CASCADE L2 — project.onsite_unit_equivalents_bps recomputed (drops by 10000) and project.compliance_posture recomputed -> DEFICIENT; project.version += 1"
          - "CASCADE L3 — because the posture became DEFICIENT while project.compliance_path == ONSITE, the system assesses a SUBSTITUTION InLieuFee (unit_equivalent_bps = 10000, ordinance_id = project.ordinance_id, due_date = clock now + ordinance.fee_due_days, state ASSESSED)"
          - "CASCADE L4 — because that fee now exists, project.fee_covered_equivalents_bps recomputed (rises by 10000) and project.compliance_posture recomputed -> COMPLIANT_BY_FEE; project.version += 1"
      - from: MARKETING
        to: WITHDRAWN
        trigger: "POST /iz-compliance/affordable-units/{unit_id}/withdraw"
        actor: Developer
        preconditions: ["same as PLANNED -> WITHDRAWN"]
        side_effects: ["same cascade chain as PLANNED -> WITHDRAWN"]
      - from: WITHDRAWN
        to: PLANNED
        trigger: "POST /iz-compliance/affordable-units/{unit_id}/reinstate"
        actor: Developer
        preconditions:
          - "unit.occupancy_status == WITHDRAWN"
          - "X-User-ID == project.developer_user_id"
          - "the substitution fee selected by calculations.substitution_fee_selection has paid_amount_cents == 0 (else ERR_SUBSTITUTION_FEE_PAID)"
        side_effects:
          - "unit.occupancy_status = PLANNED; unit.withdrawn_reason = null; unit.version += 1"
          - "the selected SUBSTITUTION InLieuFee -> SUPERSEDED with superseded_by_fee_id = null (compensating action; fee.version += 1)"
          - "project.onsite_unit_equivalents_bps and project.fee_covered_equivalents_bps recomputed; project.compliance_posture recomputed; project.version += 1"
          - "INVARIANT preserved: project.onsite_unit_equivalents_bps + project.fee_covered_equivalents_bps == project.total_obligation_bps"

  - entity: AffordableUnit
    state_field: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    note: "Dimension 2 of two independent dimensions on the same row; a unit can be OCCUPIED x OUT_OF_COMPLIANCE or VACANT x COMPLIANT."
    transitions:
      - from: COMPLIANT
        to: FINDING_OPEN
        trigger: "POST /iz-compliance/monitoring-reviews (cascade when finding_types is non-empty)"
        actor: system
        preconditions: ["review.unit_id == unit.id", "review.finding_types != []"]
        side_effects: ["unit.compliance_status = FINDING_OPEN", "unit.version += 1"]
      - from: FINDING_OPEN
        to: CURE_PENDING
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure at or before cure_deadline (cascade)"
        actor: system
        preconditions: ["review.state == FINDING_ISSUED", "logical now <= review.cure_deadline"]
        side_effects: ["unit.compliance_status = CURE_PENDING", "unit.current_rent_cents = review.corrected_rent_cents", "unit.version += 1"]
      - from: FINDING_OPEN
        to: OUT_OF_COMPLIANCE
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure after cure_deadline (cascade)"
        actor: system
        preconditions: ["review.state == FINDING_ISSUED", "logical now > review.cure_deadline"]
        side_effects:
          - "unit.compliance_status = OUT_OF_COMPLIANCE; unit.version += 1"
          - "project.compliance_posture recomputed -> UNDER_ENFORCEMENT; project.version += 1"
      - from: CURE_PENDING
        to: COMPLIANT
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/clear-cure (cascade)"
        actor: system
        preconditions: ["review.state == CURE_SUBMITTED"]
        side_effects: ["unit.compliance_status = COMPLIANT", "unit.version += 1", "project.compliance_posture recomputed"]
      - from: CURE_PENDING
        to: OUT_OF_COMPLIANCE
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/escalate (cascade)"
        actor: system
        preconditions: ["review.state == CURE_SUBMITTED"]
        side_effects:
          - "unit.compliance_status = OUT_OF_COMPLIANCE; unit.version += 1"
          - "project.compliance_posture recomputed -> UNDER_ENFORCEMENT; project.version += 1"
      - from: OUT_OF_COMPLIANCE
        to: CURE_PENDING
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure on an ESCALATED review (cascade)"
        actor: system
        preconditions: ["review.state == ESCALATED"]
        side_effects:
          - "unit.compliance_status = CURE_PENDING; unit.current_rent_cents = review.corrected_rent_cents; unit.version += 1"
          - "project.compliance_posture recomputed"
        note: "Revision loop on the compliance dimension: an escalated finding can be cured on a later attempt."

  - entity: AffordableUnit
    state_field: restriction_state
    initial_state: NOT_RECORDED
    terminal_states: [RELEASED]
    transitions:
      - from: NOT_RECORDED
        to: RECORDED
        trigger: "POST /iz-compliance/affordable-units/{unit_id}/record-restriction"
        actor: HousingComplianceOfficer
        preconditions:
          - "unit.tenure == OWNERSHIP (else ERR_RESTRICTION_TENURE_MISMATCH)"
          - "unit.agreement.state == RECORDED (else ERR_AGREEMENT_NOT_RECORDED)"
          - "unit.occupancy_status != WITHDRAWN"
        side_effects:
          - "unit.restriction_state = RECORDED; unit.restriction_recorded_at = payload recorded_at"
          - "unit.original_purchase_price_cents = payload original_purchase_price_cents"
          - "unit.ami_income_at_purchase_cents = ACTIVE AmiSchedule median_income_cents_by_size[bedrooms + 1]"
          - "unit.version += 1"
      - from: RECORDED
        to: RELEASED
        trigger: "POST /iz-compliance/affordable-units/{unit_id}/release-restriction"
        actor: HousingComplianceOfficer
        preconditions:
          - "unit.restriction_state == RECORDED"
          - "no ResaleTransaction of this unit is in state IN {SUBMITTED, PRICE_APPROVED, ROFR_WAIVED, ROFR_EXERCISED, BUYER_CERTIFIED} (else ERR_RESALE_IN_PROGRESS)"
        side_effects: ["unit.restriction_state = RELEASED", "unit.version += 1"]

  - entity: MarketingPlan
    state_field: state
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /iz-compliance/marketing-plans/{marketing_plan_id}/review with decision == APPROVE"
        actor: HousingComplianceOfficer
        preconditions:
          - "plan.state == SUBMITTED"
          - "plan.project.state == AGREEMENT_RECORDED (else ERR_PROJECT_NOT_READY_FOR_MARKETING)"
          - "plan.project.compliance_posture != UNDER_ENFORCEMENT"
        side_effects:
          - "plan.state = APPROVED; plan.reviewed_by_user_id = X-User-ID; plan.review_note = payload review_note; plan.version += 1"
          - "every AffordableUnit of the project with occupancy_status == PLANNED -> MARKETING (each bumps its own version)"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /iz-compliance/marketing-plans/{marketing_plan_id}/review with decision == REQUEST_REVISION"
        actor: HousingComplianceOfficer
        preconditions: ["plan.state == SUBMITTED"]
        side_effects:
          - "plan.state = REVISION_REQUESTED; plan.reviewed_by_user_id = X-User-ID; plan.review_note = payload review_note; plan.version += 1"
          - "no unit occupancy changes (branch with a disjoint side-effect set from the APPROVE branch)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit"
        actor: Developer
        preconditions:
          - "plan.state == REVISION_REQUESTED"
          - "X-User-ID == plan.project.developer_user_id"
          - "the new window does not overlap any other MarketingPlan of the project in state IN {SUBMITTED, APPROVED} (see validations priority 33)"
        side_effects:
          - "plan.lottery_open_at / lottery_close_at / preference_categories replaced by payload"
          - "plan.revision_round += 1; plan.state = SUBMITTED; plan.version += 1"
        note: "Revision cycle; revision_round is the loop counter."
      - from: APPROVED
        to: CLOSED
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw (cascade)"
        actor: system
        preconditions: ["plan.state == APPROVED", "the drawn event's marketing_plan_id == plan.id"]
        side_effects: ["plan.state = CLOSED", "plan.version += 1"]

  - entity: LotteryEvent
    state_field: state
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: DRAWN
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw"
        actor: ProgramAdministrator
        preconditions:
          - "event.state == PENDING"
          - "event.marketing_plan.state == APPROVED"
          - "logical now >= plan.lottery_close_at (the window must be closed before drawing, else ERR_APPLICATION_WINDOW_OPEN)"
          - "the eligible pool computed by calculations.lottery_ranking is non-empty (else ERR_EMPTY_ELIGIBLE_POOL)"
        side_effects:
          - "event.selected_household_ids / waitlisted_household_ids = calculations.lottery_ranking output; event.state = DRAWN; event.round_seq unchanged; event.drawn_at = clock now; event.drawn_by_user_id = X-User-ID; event.version += 1"
          - "each selected Household -> SELECTED with rank_position set; each waitlisted Household -> WAITLISTED with rank_position set (each bumps its own version)"
          - "the project's MARKETING units ordered by unit_number ASC are paired rank-for-rank with the selected households: unit.occupancy_status = RESERVED, unit.occupant_household_id = that household"
          - "event.marketing_plan -> CLOSED"
      - from: DRAWN
        to: PENDING
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/redraw"
        actor: ProgramAdministrator
        preconditions:
          - "event.state == DRAWN"
          - "no Household in event.selected_household_ids has state == CERTIFIED (else ERR_REDRAW_AFTER_CERTIFICATION)"
        side_effects:
          - "event.round_seq += 1; event.state = PENDING; event.selected_household_ids = []; event.waitlisted_household_ids = []; event.redraw_reason = payload reason; event.version += 1"
          - "every Household with state IN {SELECTED, WAITLISTED} and lottery_event_id == event.id -> APPLIED with rank_position = null"
          - "every AffordableUnit with occupancy_status == RESERVED whose occupant_household_id was in the cleared selection -> MARKETING with occupant_household_id = null"
        note: "Negotiation-style loop: the round counter advances and every downstream reservation is rolled back."
      - from: DRAWN
        to: COMPLETED
        trigger: "POST /iz-compliance/income-certifications (cascade when the last selected household becomes CERTIFIED)"
        actor: system
        preconditions: ["event.state == DRAWN", "every id in event.selected_household_ids belongs to a Household with state == CERTIFIED"]
        side_effects: ["event.state = COMPLETED", "event.version += 1"]

  - entity: Household
    state_field: state
    initial_state: REGISTERED
    terminal_states: [CERTIFIED]
    transitions:
      - from: REGISTERED
        to: APPLIED
        trigger: "POST /iz-compliance/households/{household_id}/apply"
        actor: Resident
        preconditions:
          - "household.state == REGISTERED"
          - "X-User-ID == household.id"
          - "event.state == PENDING and event.marketing_plan.state == APPROVED"
          - "plan.lottery_open_at <= logical now < plan.lottery_close_at (else ERR_APPLICATION_WINDOW_CLOSED)"
        side_effects:
          - "household.lottery_event_id = payload lottery_event_id; household.preference_claims = payload preference_claims"
          - "household.preference_score = 100 * count(preference_claims that appear in plan.preference_categories)"
          - "household.state = APPLIED; household.version += 1"
      - from: APPLIED
        to: SELECTED
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw (cascade)"
        actor: system
        preconditions: ["household is within the first units_offered entries of the ranked eligible pool"]
        side_effects: ["household.state = SELECTED; household.rank_position = 1-based rank; household.version += 1"]
      - from: APPLIED
        to: WAITLISTED
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw (cascade)"
        actor: system
        preconditions: ["household is eligible but ranked beyond units_offered"]
        side_effects: ["household.state = WAITLISTED; household.rank_position = 1-based rank; household.version += 1"]
      - from: SELECTED
        to: CERTIFIED
        trigger: "POST /iz-compliance/income-certifications (cascade)"
        actor: system
        preconditions: ["certification.household_id == household.id", "certification.state == CERTIFIED"]
        side_effects: ["household.state = CERTIFIED; household.version += 1"]
      - from: REGISTERED
        to: CERTIFIED
        trigger: "POST /iz-compliance/income-certifications (cascade; direct placement or resale buyer, no lottery)"
        actor: system
        preconditions: ["certification.household_id == household.id", "household.state == REGISTERED"]
        side_effects: ["household.state = CERTIFIED; household.version += 1"]
      - from: SELECTED
        to: APPLIED
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/redraw (cascade)"
        actor: system
        preconditions: ["household.lottery_event_id == event.id", "household.state IN {SELECTED, WAITLISTED}"]
        side_effects: ["household.state = APPLIED; household.rank_position = null; household.version += 1"]
      - from: WAITLISTED
        to: APPLIED
        trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/redraw (cascade)"
        actor: system
        preconditions: ["household.lottery_event_id == event.id", "household.state IN {SELECTED, WAITLISTED}"]
        side_effects: ["household.state = APPLIED; household.rank_position = null; household.version += 1"]

  - entity: IncomeCertification
    state_field: state
    initial_state: CERTIFIED
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc (sweep step 2)"
        actor: system
        preconditions: ["certification.state == CERTIFIED", "certification.expires_at != null", "certification.expires_at < new logical now"]
        side_effects:
          - "certification.state = EXPIRED; certification.version += 1"
          - "CASCADE — unit.occupancy_status OCCUPIED -> VACANT, unit.current_rent_cents = 0, unit.occupant_household_id = null"
          - "CASCADE — project.compliance_posture recomputed"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /iz-compliance/income-certifications/{certification_id}/recertify"
        actor: HousingComplianceOfficer
        preconditions:
          - "certification.state == CERTIFIED"
          - "certification.expires_at != null (OWNERSHIP certifications never recertify, else ERR_RECERT_NOT_APPLICABLE)"
          - "logical now >= certification.expires_at - RECERT_WINDOW_DAYS (else ERR_RECERT_WINDOW_NOT_OPEN)"
        side_effects:
          - "old certification.state = SUPERSEDED; old.version += 1"
          - "a new IncomeCertification is created with is_recertification = true, state CERTIFIED, same household_id/unit_id, effective_date = old.expires_at + 1 day (calculations.certification_period_overlap), and recomputed income_limit_cents / max_rent_cents / ami_pct_bps / expires_at from the ACTIVE AmiSchedule at the recertification instant"
          - "unit.current_rent_cents = new certification.contract_rent_cents; unit.max_allowed_rent_cents = new certification.max_rent_cents; unit.version += 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/close (cascade: the seller's certification is retired)"
        actor: system
        preconditions: ["certification.unit_id == transaction.unit_id", "certification.household_id == transaction.seller_household_id"]
        side_effects: ["certification.state = SUPERSEDED; certification.version += 1"]

  - entity: RegulatoryAgreement
    state_field: state
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: RECORDED
        trigger: "POST /iz-compliance/regulatory-agreements/{agreement_id}/record"
        actor: HousingComplianceOfficer
        preconditions:
          - "agreement.state == DRAFT"
          - "agreement.project.state == PATH_ELECTED (else ERR_INVALID_PROJECT_STATE)"
          - "agreement.project.compliance_path IN {ONSITE, OFFSITE} (fee-only and land-dedication projects record no agreement, else ERR_AGREEMENT_NOT_REQUIRED)"
          - "payload doc_number is unique across all RegulatoryAgreement rows (else ERR_DUPLICATE_RESOURCE)"
          - "payload recorded_at >= project.approval_date (else ERR_RECORDING_PREDATES_APPROVAL)"
        side_effects:
          - "agreement.state = RECORDED; agreement.doc_number / recorded_at set; agreement.version += 1"
          - "CASCADE — project.state PATH_ELECTED -> AGREEMENT_RECORDED; project.version += 1"
      - from: RECORDED
        to: RELEASED
        trigger: "POST /iz-compliance/projects/{project_id}/close-out (cascade)"
        actor: system
        preconditions: ["agreement.state == RECORDED", "agreement.project_id == project.id"]
        side_effects: ["agreement.state = RELEASED", "agreement.version += 1"]

  - entity: MonitoringReview
    state_field: state
    initial_state: RECORDED
    terminal_states: [COMPLIANT, CURED]
    transitions:
      - from: RECORDED
        to: COMPLIANT
        trigger: "POST /iz-compliance/monitoring-reviews (auto-evaluated at creation)"
        actor: system
        preconditions: ["calculations.monitoring_findings yields an empty finding_types list"]
        side_effects:
          - "review.state = COMPLIANT; review.cure_deadline = null; review.penalty_at_base_cents = 0"
          - "no change to unit.compliance_status"
      - from: RECORDED
        to: FINDING_ISSUED
        trigger: "POST /iz-compliance/monitoring-reviews (auto-evaluated at creation)"
        actor: system
        preconditions: ["calculations.monitoring_findings yields a non-empty finding_types list"]
        side_effects:
          - "review.state = FINDING_ISSUED; review.finding_issued_at = clock now; review.issued_by_user_id = X-User-ID"
          - "review.overcharge_monthly_cents / penalty_at_base_cents / cure_extension_days / cure_deadline = calculations.cure_penalty_and_deadline"
          - "CASCADE — unit.compliance_status COMPLIANT -> FINDING_OPEN; unit.version += 1"
      - from: FINDING_ISSUED
        to: CURE_SUBMITTED
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure"
        actor: Developer
        preconditions:
          - "review.state == FINDING_ISSUED"
          - "X-User-ID == unit.project.developer_user_id"
          - "logical now <= review.cure_deadline"
        side_effects:
          - "review.state = CURE_SUBMITTED; review.cure_submitted_at = clock now; review.corrected_rent_cents = payload corrected_rent_cents"
          - "review.penalty_final_cents = calculations.cure_penalty_and_deadline final-penalty branch evaluated at cure_submitted_at"
          - "CASCADE — unit.compliance_status FINDING_OPEN -> CURE_PENDING; unit.current_rent_cents = corrected_rent_cents"
      - from: FINDING_ISSUED
        to: ESCALATED
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure"
        actor: Developer
        preconditions:
          - "review.state == FINDING_ISSUED"
          - "X-User-ID == unit.project.developer_user_id"
          - "logical now > review.cure_deadline"
        side_effects:
          - "review.state = ESCALATED; review.cure_submitted_at = clock now; review.corrected_rent_cents = payload corrected_rent_cents"
          - "review.penalty_final_cents = calculations.cure_penalty_and_deadline final-penalty branch evaluated at cure_submitted_at"
          - "CASCADE — unit.compliance_status FINDING_OPEN -> OUT_OF_COMPLIANCE; project.compliance_posture -> UNDER_ENFORCEMENT"
        note: "Same trigger, two branches decided purely by the clock against the pinned cure_deadline; the branches have disjoint cascade sets."
      - from: CURE_SUBMITTED
        to: CURED
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/clear-cure"
        actor: HousingComplianceOfficer
        preconditions:
          - "review.state == CURE_SUBMITTED"
          - "X-User-ID != review.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "review.corrected_rent_cents <= unit.max_allowed_rent_cents (else ERR_CURE_INSUFFICIENT)"
        side_effects:
          - "review.state = CURED; review.cleared_by_user_id = X-User-ID; review.version += 1"
          - "CASCADE — unit.compliance_status CURE_PENDING -> COMPLIANT; project.compliance_posture recomputed"
      - from: CURE_SUBMITTED
        to: ESCALATED
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/escalate"
        actor: HousingComplianceOfficer
        preconditions: ["review.state == CURE_SUBMITTED"]
        side_effects:
          - "review.state = ESCALATED; review.version += 1"
          - "CASCADE — unit.compliance_status CURE_PENDING -> OUT_OF_COMPLIANCE; project.compliance_posture -> UNDER_ENFORCEMENT"
      - from: ESCALATED
        to: CURE_SUBMITTED
        trigger: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure"
        actor: Developer
        preconditions:
          - "review.state == ESCALATED"
          - "X-User-ID == unit.project.developer_user_id"
        side_effects:
          - "review.state = CURE_SUBMITTED; review.cure_submitted_at = clock now; review.corrected_rent_cents = payload corrected_rent_cents"
          - "review.penalty_final_cents recomputed at the new cure_submitted_at; review.cure_deadline is NEVER re-derived"
          - "CASCADE — unit.compliance_status OUT_OF_COMPLIANCE -> CURE_PENDING; project.compliance_posture recomputed"
        note: "Cycle: an escalated finding re-enters the cure pipeline without resetting the deadline."

  - entity: ResaleTransaction
    state_field: state
    initial_state: SUBMITTED
    terminal_states: [CLOSED, CITY_PURCHASE_CLOSED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: PRICE_APPROVED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/approve-price"
        actor: HousingComplianceOfficer
        preconditions:
          - "transaction.state == SUBMITTED"
          - "unit.restriction_state == RECORDED"
          - "unit.compliance_status != OUT_OF_COMPLIANCE (else ERR_UNIT_OUT_OF_COMPLIANCE)"
          - "transaction.proposed_price_cents <= transaction.max_resale_price_cents (else ERR_RESALE_PRICE_EXCEEDS_MAX)"
        side_effects:
          - "transaction.state = PRICE_APPROVED; price_approved_at = clock now; price_approved_by_user_id = X-User-ID"
          - "transaction.rofr_deadline = price_approved_at + ROFR_WINDOW_DAYS; transaction.version += 1"
      - from: PRICE_APPROVED
        to: ROFR_WAIVED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision with decision == WAIVE"
        actor: ProgramAdministrator
        preconditions: ["transaction.state == PRICE_APPROVED", "logical now <= transaction.rofr_deadline (else ERR_ROFR_WINDOW_EXPIRED)"]
        side_effects: ["transaction.state = ROFR_WAIVED; transaction.version += 1"]
      - from: PRICE_APPROVED
        to: ROFR_WAIVED
        trigger: "POST /_clock/set_current_utc (sweep step 4: the ROFR window lapses undecided)"
        actor: system
        preconditions: ["transaction.state == PRICE_APPROVED", "date(transaction.rofr_deadline) < date(new logical now) — the sweep is a daily batch and only acts once the deadline's calendar day has fully elapsed"]
        side_effects: ["transaction.state = ROFR_WAIVED; transaction.rofr_auto_waived = true; transaction.version += 1"]
      - from: PRICE_APPROVED
        to: ROFR_EXERCISED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision with decision == EXERCISE"
        actor: ProgramAdministrator
        preconditions:
          - "transaction.state == PRICE_APPROVED"
          - "logical now <= transaction.rofr_deadline"
          - "GET /iz-compliance/trust-fund-summary unencumbered_balance_cents >= transaction.proposed_price_cents (else ERR_INSUFFICIENT_FUND_BALANCE)"
        side_effects:
          - "transaction.state = ROFR_EXERCISED; transaction.version += 1"
        note: "Fork point: EXERCISE and WAIVE lead to two different terminal states with different waterfall outcomes."
      - from: ROFR_WAIVED
        to: BUYER_CERTIFIED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/certify-buyer"
        actor: HousingComplianceOfficer
        preconditions:
          - "transaction.state == ROFR_WAIVED"
          - "X-User-ID != transaction.price_approved_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the referenced IncomeCertification has state == CERTIFIED, unit_id == transaction.unit_id and household_id == payload buyer_household_id (else ERR_BUYER_CERTIFICATION_MISMATCH)"
        side_effects:
          - "transaction.buyer_household_id / buyer_certification_id set; transaction.state = BUYER_CERTIFIED; transaction.version += 1"
      - from: BUYER_CERTIFIED
        to: CLOSED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/close"
        actor: HousingComplianceOfficer
        preconditions: ["transaction.state == BUYER_CERTIFIED"]
        side_effects:
          - "transaction.net_proceeds_cents / seller_equity_cents / seller_improvement_credit_cents / seller_appreciation_share_cents / city_recapture_cents = calculations.resale_proceeds_waterfall; transaction.state = CLOSED; closed_at = clock now; transaction.version += 1"
          - "CASCADE L2 — because the transaction closed, unit.occupant_household_id = buyer_household_id, unit.original_purchase_price_cents = proposed_price_cents, unit.ami_income_at_purchase_cents = ACTIVE AmiSchedule median for (bedrooms + 1), unit.occupancy_status = OCCUPIED; unit.version += 1"
          - "CASCADE L3 — because the unit's price basis changed, the seller's CERTIFIED IncomeCertification for this unit -> SUPERSEDED; certification.version += 1"
          - "CASCADE L4 — because city_recapture_cents was booked, the trust fund's total_recapture_cents rises, raising unencumbered_balance_cents and admin_cap_cents reported by GET /iz-compliance/trust-fund-summary"
      - from: ROFR_EXERCISED
        to: CITY_PURCHASE_CLOSED
        trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/close"
        actor: HousingComplianceOfficer
        preconditions: ["transaction.state == ROFR_EXERCISED"]
        side_effects:
          - "transaction.net_proceeds_cents = proposed_price_cents - broker_fee_cents; seller buckets computed by calculations.resale_proceeds_waterfall; transaction.city_recapture_cents = 0 (the city is the buyer, so nothing is recaptured); transaction.state = CITY_PURCHASE_CLOSED; closed_at = clock now"
          - "CASCADE — unit.occupant_household_id = null; unit.occupancy_status = VACANT; unit.original_purchase_price_cents = proposed_price_cents; unit.ami_income_at_purchase_cents re-captured; unit.version += 1"
          - "CASCADE — the seller's CERTIFIED IncomeCertification for this unit -> SUPERSEDED"
        note: "Join point: both branches terminate, but the recapture and occupancy side effects differ."
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /iz-compliance/resale-transactions (system side effect: a fresh submission for the same unit supersedes the open one)"
        actor: system
        preconditions: ["prior.state == SUBMITTED", "prior.unit_id == new.unit_id"]
        side_effects: ["prior.state = SUPERSEDED; prior.version += 1"]

  - entity: InLieuFee
    state_field: state
    initial_state: ASSESSED
    terminal_states: [PAID, SUPERSEDED]
    transitions:
      - from: ASSESSED
        to: PARTIALLY_PAID
        trigger: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
        actor: Developer
        preconditions:
          - "fee.state IN {ASSESSED, PARTIALLY_PAID, DELINQUENT}"
          - "X-User-ID == fee.project.developer_user_id"
          - "payload amount_cents <= fee.assessed_amount_cents - fee.paid_amount_cents (else ERR_PAYMENT_EXCEEDS_BALANCE)"
          - "payload amount_cents < fee.assessed_amount_cents - fee.paid_amount_cents"
        side_effects:
          - "fee.paid_amount_cents += amount_cents; fee.last_payment_at = clock now; fee.state = PARTIALLY_PAID; fee.version += 1"
      - from: ASSESSED
        to: PAID
        trigger: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
        actor: Developer
        preconditions:
          - "fee.state IN {ASSESSED, PARTIALLY_PAID, DELINQUENT}"
          - "payload amount_cents == fee.assessed_amount_cents - fee.paid_amount_cents"
        side_effects:
          - "fee.paid_amount_cents = fee.assessed_amount_cents; fee.state = PAID; fee.last_payment_at = clock now; fee.version += 1"
          - "CASCADE — the trust fund's total_paid_fees_cents rises, raising unencumbered_balance_cents and admin_cap_cents reported by GET /iz-compliance/trust-fund-summary"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
        actor: Developer
        preconditions: ["payload amount_cents == fee.assessed_amount_cents - fee.paid_amount_cents"]
        side_effects: ["same as ASSESSED -> PAID"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
        actor: Developer
        preconditions: ["payload amount_cents < fee.assessed_amount_cents - fee.paid_amount_cents"]
        side_effects: ["fee.paid_amount_cents += amount_cents; fee.last_payment_at = clock now; fee.version += 1"]
      - from: ASSESSED
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc (sweep step 3)"
        actor: system
        preconditions: ["fee.state IN {ASSESSED, PARTIALLY_PAID}", "fee.due_date < date(new logical now)"]
        side_effects: ["fee.state = DELINQUENT; fee.version += 1"]
      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc (sweep step 3)"
        actor: system
        preconditions: ["fee.due_date < date(new logical now)"]
        side_effects: ["fee.state = DELINQUENT; fee.version += 1"]
      - from: DELINQUENT
        to: PAID
        trigger: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
        actor: Developer
        preconditions: ["payload amount_cents == fee.assessed_amount_cents - fee.paid_amount_cents"]
        side_effects: ["same as ASSESSED -> PAID"]
      - from: ASSESSED
        to: SUPERSEDED
        trigger: "POST /iz-compliance/in-lieu-fees (a new assessment for the same project replaces the open one)"
        actor: system
        preconditions: ["prior.project_id == new.project_id", "prior.state IN {ASSESSED, PARTIALLY_PAID, DELINQUENT}"]
        side_effects:
          - "prior.state = SUPERSEDED; prior.superseded_by_fee_id = new fee id; prior.version += 1"
          - "CASCADE — project.fee_covered_equivalents_bps and compliance_posture recomputed"
      - from: DELINQUENT
        to: SUPERSEDED
        trigger: "POST /iz-compliance/in-lieu-fees (a new assessment for the same project replaces the open one)"
        actor: system
        preconditions: ["prior.state IN {ASSESSED, PARTIALLY_PAID, DELINQUENT}"]
        side_effects: ["same as ASSESSED -> SUPERSEDED"]
      - from: ASSESSED
        to: SUPERSEDED
        trigger: "POST /iz-compliance/affordable-units/{unit_id}/reinstate (compensating action)"
        actor: system
        preconditions: ["fee.basis == SUBSTITUTION", "fee.paid_amount_cents == 0", "fee is the row selected by calculations.substitution_fee_selection"]
        side_effects: ["fee.state = SUPERSEDED; fee.superseded_by_fee_id = null; fee.version += 1", "CASCADE — project.fee_covered_equivalents_bps and compliance_posture recomputed"]

  - entity: TrustFundDisbursement
    state_field: state
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    transitions:
      - from: REQUESTED
        to: DISBURSED
        trigger: "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/disburse"
        actor: ProgramAdministrator
        preconditions:
          - "disbursement.state == REQUESTED"
          - "disbursement.source_fee.state == PAID (else ERR_SOURCE_FEE_NOT_PAID)"
        side_effects:
          - "disbursement.state = DISBURSED; disbursed_at = clock now; disbursement.version += 1"
          - "the draw moves from the encumbered bucket to the disbursed bucket; unencumbered_balance_cents is unchanged by this transition"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/void"
        actor: ProgramAdministrator
        preconditions: ["disbursement.state == REQUESTED"]
        side_effects:
          - "disbursement.state = VOIDED; void_reason set; disbursement.version += 1"
          - "the encumbrance is released: unencumbered_balance_cents returns to exactly its pre-request value"
      - from: DISBURSED
        to: VOIDED
        trigger: "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/void"
        actor: ProgramAdministrator
        preconditions: ["disbursement.state == DISBURSED"]
        side_effects:
          - "disbursement.state = VOIDED; void_reason set; disbursement.version += 1"
          - "the disbursed amount is returned: unencumbered_balance_cents and admin_disbursed_cents return to exactly their pre-request values (compensating action for the request+disburse pair)"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: fee-assess-stale-project
    parent_entity: Project
    write_endpoint: "POST /iz-compliance/in-lieu-fees"
    occ_field: "expected_project_version"
    description: |
      Assessing an in-lieu fee against a Project whose version has advanced since
      the client last read it is rejected. A new assessment legitimately supersedes
      the project's open assessment, so a writer holding a stale view of the project
      (its obligation may have been re-screened, or a substitution fee may already
      have been booked) must re-read before assessing.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: resale-create-stale-unit
    parent_entity: AffordableUnit
    write_endpoint: "POST /iz-compliance/resale-transactions"
    occ_field: "expected_unit_version"
    description: |
      Submitting a resale transaction against an AffordableUnit whose version has
      advanced since the client last read it is rejected. A fresh submission
      legitimately supersedes the unit's open SUBMITTED transaction, so a writer
      whose view of the unit predates the superseding submission (or predates a
      monitoring cascade that changed compliance_status) must re-read first.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ordinance_vintage_selection
    trigger: "POST /iz-compliance/projects/{project_id}/screen (every screening, including re-screens after PATCH)"
    algorithm: chronological
    formula: |
      candidates = [o for o in Ordinance if o.effective_date <= project.approval_date]
      if candidates is empty:
          reject ERR_NO_GOVERNING_ORDINANCE
      # latest vintage that was already in force on the approval date
      winner = candidates ordered by (effective_date DESC, created_at ASC)[0]
      project.ordinance_id = winner.id
    input_set: "All Ordinance rows regardless of status; a SUPERSEDED ordinance still governs projects approved during its vintage."
    constants: {}
    precision: "calendar-date comparison only; no time-of-day component"
    note: |
      Ties on effective_date are broken by created_at ASC (the earliest-created of two
      same-dated ordinances wins). Ordinance.id is never a decision input.

  - name: ami_schedule_selection
    trigger: "POST /iz-compliance/income-certifications, POST .../recertify, POST /iz-compliance/affordable-units/{unit_id}/record-restriction, POST /iz-compliance/affordable-units/{unit_id}/refinance-review, POST /iz-compliance/resale-transactions, GET /iz-compliance/funder-reports"
    algorithm: chronological
    formula: |
      candidates = [s for s in AmiSchedule]
      if candidates is empty:
          reject ERR_NO_AMI_SCHEDULE
      active = candidates ordered by (effective_year DESC, created_at ASC)[0]   # status == ACTIVE
      applied_schedule = active
      IncomeCertification.ami_schedule_year = applied_schedule.effective_year   # pinned at creation, never re-derived
    input_set: "All AmiSchedule rows; exactly one is ACTIVE (the greatest effective_year) and the rest are SUPERSEDED."
    constants: {}
    precision: "integer cents throughout"
    note: |
      Publishing a later schedule re-prices every FUTURE certification, recertification,
      resale and refinance review, but never rewrites an IncomeCertification's pinned
      ami_schedule_year, income_limit_cents or max_rent_cents.

  - name: required_units_and_fraction
    trigger: "POST /iz-compliance/projects/{project_id}/screen"
    algorithm: threshold
    formula: |
      ordinance = calculations.ordinance_vintage_selection
      set_aside_bps = ordinance.set_aside_bps_by_district.get(project.zoning_district)
      if set_aside_bps is None or project.total_units < ordinance.min_project_units_threshold:
          project.applicability = EXEMPT
          project.required_affordable_units = 0
          project.fractional_obligation_bps = 0
          project.total_obligation_bps = 0
          return
      project.applicability = SUBJECT
      raw_bps = project.total_units * set_aside_bps          # basis points of one unit
      whole   = raw_bps // 10000
      frac_bps = raw_bps - whole * 10000
      if frac_bps >= 5000:                                    # round half UP to a whole unit
          project.required_affordable_units = whole + 1
          project.fractional_obligation_bps = 0
      else:
          project.required_affordable_units = whole
          project.fractional_obligation_bps = frac_bps
      project.total_obligation_bps = project.required_affordable_units * 10000 + project.fractional_obligation_bps
    input_set: "The single Project being screened plus its selected Ordinance vintage."
    constants:
      HALF_UNIT_BPS: 5000
    precision: "integer basis points of one unit; the 0.5-unit rounding boundary is inclusive (>= 5000 rounds up)"
    note: |
      Two independent thresholds interact: the size threshold
      (total_units >= min_project_units_threshold, inclusive) decides SUBJECT vs EXEMPT,
      and the half-unit threshold (frac_bps >= 5000, inclusive) decides whether the
      residual becomes a whole onsite unit or a priceable fractional obligation.

  - name: in_lieu_fee_assessment
    trigger: "POST /iz-compliance/in-lieu-fees, and the automatic SUBSTITUTION assessment cascaded by POST /iz-compliance/affordable-units/{unit_id}/withdraw"
    algorithm: tiered_pricing
    formula: |
      ordinance = Ordinance[project.ordinance_id]          # copied to fee.ordinance_id, never re-selected
      # STEP 1 — the basis branch decides WHAT quantity is priced
      if basis == FULL:
          unit_equivalent_bps = project.total_obligation_bps
                                - project.onsite_unit_equivalents_bps
                                - project.fee_covered_equivalents_bps
      elif basis == FRACTIONAL:
          unit_equivalent_bps = project.fractional_obligation_bps
      else:  # SUBSTITUTION — exactly one withdrawn unit
          unit_equivalent_bps = 10000
      if unit_equivalent_bps <= 0:
          reject ERR_NO_REMAINING_OBLIGATION
      # STEP 2 — base rate
      gap = ordinance.gap_basis_cents_by_level[str(ordinance.fee_gap_level_bps)]
      base_amount_cents = round_half_up(unit_equivalent_bps * gap / 10000)
      # STEP 3 — surcharge, clamped by a hard cap (min())
      surcharge_cents = min(ordinance.surcharge_cap_cents,
                            round_half_up(base_amount_cents * ordinance.surcharge_bps / 10000))
      pre_discount_total_cents = base_amount_cents + surcharge_cents
      # STEP 4 — tier selected on the POST-surcharge total, not on base_amount_cents
      discount_bps_applied = 0
      for tier in ordinance.discount_tiers ordered by min_pre_discount_cents ASC:
          if pre_discount_total_cents >= tier.min_pre_discount_cents:
              discount_bps_applied = tier.discount_bps
      discount_cents = round_half_up(pre_discount_total_cents * discount_bps_applied / 10000)
      assessed_amount_cents = pre_discount_total_cents - discount_cents
      due_date = date(logical_now) + ordinance.fee_due_days days
    input_set: "The Project's pinned Ordinance vintage; the project's live onsite_unit_equivalents_bps and fee_covered_equivalents_bps (from calculations.project_obligation_equivalents)."
    constants: {}
    precision: "integer cents, round_half_up at each of base_amount_cents, surcharge_cents and discount_cents"
    note: |
      Three inputs interact and none can be dropped: the basis branch, the surcharge
      cap clamp, and the tier scan over pre_discount_total_cents. Clamping the
      surcharge can pull the total below a tier boundary, so a capped surcharge and an
      uncapped one may select DIFFERENT discount tiers from the same base amount.

  - name: income_limit
    trigger: "POST /iz-compliance/income-certifications, POST .../recertify, POST /iz-compliance/lottery-events/{lottery_event_id}/draw and /redraw, POST /iz-compliance/monitoring-reviews"
    algorithm: threshold
    formula: |
      median = ami.median_income_cents_by_size[str(household_size)]
      raw = median * level_bps / 10000
      income_limit_cents = round_half_up(raw / 100) * 100      # published to the whole dollar
    input_set: "The ACTIVE AmiSchedule (calculations.ami_schedule_selection); household_size 1..5; level_bps in {5000, 8000, 12000}."
    constants:
      WHOLE_DOLLAR_CENTS: 100
    precision: "integer cents, rounded half up to the nearest whole dollar (multiple of 100 cents)"
    note: "Eligibility is inclusive: income == income_limit_cents qualifies; income_limit_cents + 1 does not."

  - name: max_allowed_rent
    trigger: "POST /iz-compliance/income-certifications and POST .../recertify (writes AffordableUnit.max_allowed_rent_cents); read again by calculations.monitoring_findings"
    algorithm: weighted_scoring
    formula: |
      # The order of the four steps is PINNED; each step's rounding feeds the next.
      size    = unit.bedrooms + 1
      annual  = income_limit(size, unit.affordability_level_bps)                  # STEP 1: whole-dollar rounding
      monthly = floor(annual / 12)                                                # STEP 2: truncate to the cent
      gross   = round_half_up(monthly * RENT_BURDEN_BPS / 10000)                   # STEP 3: half-up to the cent
      max_allowed_rent_cents = max(0, gross - ami.utility_allowance_cents_by_bedrooms[str(unit.bedrooms)])
    input_set: "The unit's affordability_level_bps and bedrooms; the ACTIVE AmiSchedule's median table and utility allowance table."
    constants:
      RENT_BURDEN_BPS: 3000
    precision: "integer cents; STEP 1 rounds half up to whole dollars, STEP 2 truncates, STEP 3 rounds half up, then the utility allowance is subtracted and the result floored at 0"
    note: |
      Collapsing the pipeline into one expression
      (round_half_up(median * level / 10000 / 12 * 0.30) - allowance) yields a cent MORE
      than the pinned order for the fixture data, so the intermediate roundings are
      observable and the step order cannot be reassociated.

  - name: unit_mix_compliance
    trigger: "POST /iz-compliance/affordable-units (comparability leg) and POST /iz-compliance/projects/{project_id}/close-out (distribution leg)"
    algorithm: aggregation
    formula: |
      # leg A — per-unit comparability standard, checked at unit creation
      min_sqft = round_half_up(unit.market_comparable_sqft * COMPARABILITY_MIN_BPS / 10000)
      if unit.sqft < min_sqft:
          reject ERR_COMPARABILITY_STANDARD_FAILED
      # leg B — project-wide bedroom distribution, checked only at close-out
      family_units = count(u in project's AffordableUnit rows
                           where u.occupancy_status != WITHDRAWN and u.bedrooms >= 2)
      if family_units * 10000 < project.required_affordable_units * MIN_FAMILY_UNIT_BPS:
          reject ERR_BEDROOM_DISTRIBUTION_FAILED
    input_set: "Leg A: the single unit being created. Leg B: every non-WITHDRAWN AffordableUnit of the project."
    constants:
      COMPARABILITY_MIN_BPS: 8000
      MIN_FAMILY_UNIT_BPS: 5000
    precision: "integer square feet; round_half_up on the comparability floor"
    note: |
      Leg B is an aggregate rule: every unit can pass leg A individually while the
      collection still fails the distribution floor, and withdrawing a 2-bedroom unit
      can flip a previously passing project to failing.

  - name: lottery_ranking
    trigger: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw and POST .../redraw"
    algorithm: chronological
    formula: |
      plan = MarketingPlan[event.marketing_plan_id]
      pool = [h for h in Household
              if h.lottery_event_id == event.id
              and h.state in {APPLIED, SELECTED, WAITLISTED}
              and h.gross_annual_income_cents <= income_limit(h.household_size, event.eligibility_level_bps)]
      if pool is empty:
          reject ERR_EMPTY_ELIGIBLE_POOL
      for h in pool:
          h.preference_score = PREFERENCE_POINTS * len(set(h.preference_claims) & set(plan.preference_categories))
      ranked = pool ordered by (preference_score DESC, created_at ASC)
      for i, h in enumerate(ranked): h.rank_position = i + 1
      event.selected_household_ids    = [h.id for h in ranked[:event.units_offered]]
      event.waitlisted_household_ids  = [h.id for h in ranked[event.units_offered:]]
    input_set: "Households attached to this lottery_event_id in state APPLIED, SELECTED or WAITLISTED; a redraw re-ranks the same pool plus anyone who applied since."
    constants:
      PREFERENCE_POINTS: 100
    precision: "integer points; ranking is total and deterministic"
    note: |
      A preference_claim the plan does not list scores zero points. The only tie-break
      after preference_score is created_at ASC; Household.id never participates.

  - name: max_resale_price
    trigger: "POST /iz-compliance/resale-transactions (computed at submission and frozen on the row)"
    algorithm: threshold
    formula: |
      unit      = AffordableUnit[transaction.unit_id]
      agreement = RegulatoryAgreement[unit.agreement_id]
      improvement_credit_cents = min(transaction.capital_improvements_cents,
                                     round_half_up(unit.original_purchase_price_cents
                                                   * IMPROVEMENT_CAP_BPS / 10000))
      resale_formula_applied = agreement.resale_formula
      # variant-specific base (see variants below)
      indexed_base_cents = <variant base>
      max_resale_price_cents = indexed_base_cents
                             + improvement_credit_cents
                             - transaction.deferred_maintenance_cents
    input_set: "The unit's frozen original_purchase_price_cents and ami_income_at_purchase_cents; the ACTIVE AmiSchedule; the governing RegulatoryAgreement."
    constants:
      IMPROVEMENT_CAP_BPS: 1000
    precision: "integer cents, round_half_up on the indexed base, on the improvement cap and on the appreciation share"
    variants:
      - name: AMI_INDEXED
        when: "agreement.resale_formula == AMI_INDEXED"
        difference: |
          indexed_base_cents = round_half_up(unit.original_purchase_price_cents
                                             * current_median / unit.ami_income_at_purchase_cents)
          where current_median = ACTIVE AmiSchedule.median_income_cents_by_size[str(unit.bedrooms + 1)].
          The price tracks AMI growth and ignores appraised_value_cents entirely.
      - name: SHARED_APPRECIATION
        when: "agreement.resale_formula == SHARED_APPRECIATION"
        difference: |
          appreciation = max(0, transaction.appraised_value_cents - unit.original_purchase_price_cents)
          indexed_base_cents = unit.original_purchase_price_cents
                             + round_half_up(appreciation * agreement.owner_appreciation_share_bps / 10000)
          The price tracks the market appraisal and ignores the AMI schedule entirely.
    note: |
      Identical unit, identical transaction inputs, two agreements: the two variants
      return different max_resale_price_cents values, and the improvement-credit cap
      (a min() at exactly IMPROVEMENT_CAP_BPS of the purchase basis) is shared by both.

  - name: resale_proceeds_waterfall
    trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/close"
    algorithm: waterfall_allocation
    formula: |
      net_proceeds_cents = transaction.proposed_price_cents - transaction.broker_fee_cents
      remaining = net_proceeds_cents
      # bucket 1 — return of the seller's restricted equity basis
      seller_equity_cents = min(remaining, unit.original_purchase_price_cents)
      remaining -= seller_equity_cents
      # bucket 2 — documented capital improvements, already capped at submission
      seller_improvement_credit_cents = min(remaining, transaction.improvement_credit_cents)
      remaining -= seller_improvement_credit_cents
      # buckets 3 and 4 — split the residual appreciation
      if transaction came through ROFR_EXERCISED:
          seller_appreciation_share_cents = remaining        # the city is the buyer
          city_recapture_cents = 0
      else:
          seller_appreciation_share_cents = round_half_up(remaining
                                              * agreement.owner_appreciation_share_bps / 10000)
          city_recapture_cents = remaining - seller_appreciation_share_cents
    input_set: "The single ResaleTransaction being closed plus its unit and agreement."
    constants: {}
    precision: "integer cents; bucket 3 rounds half up and bucket 4 takes the exact remainder so no cent is created or destroyed"
    note: |
      CONSERVATION INVARIANT: seller_equity_cents + seller_improvement_credit_cents
      + seller_appreciation_share_cents + city_recapture_cents == net_proceeds_cents,
      for every input including underwater sales where buckets 2..4 all collapse to 0.
      Bucket 4 is a subtraction, never an independent round, so rounding never drifts.

  - name: cure_penalty_and_deadline
    trigger: "POST /iz-compliance/monitoring-reviews (steps 1-2, at finding issue) and POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure (step 3, at cure submission)"
    algorithm: threshold
    formula: |
      overcharge_monthly_cents = max(0, review.reported_rent_cents - unit.max_allowed_rent_cents)
      # STEP 1 — penalty evaluated AS IF the cure landed inside the first month
      penalty_at_base_cents = overcharge_monthly_cents * OVERCHARGE_MULTIPLIER
                            + FLAT_MONTHLY_PENALTY_CENTS * 1
      # STEP 2 — the extension is decided ONCE, from penalty_at_base_cents only
      cure_extension_days = CURE_EXTENSION_DAYS if penalty_at_base_cents >= PENALTY_EXTENSION_THRESHOLD_CENTS else 0
      cure_deadline = review.finding_issued_at + (CURE_BASE_DAYS + cure_extension_days) days
      # STEP 3 — final penalty at the cure instant; NEVER re-derives step 2
      elapsed_days = day_diff(review.cure_submitted_at, review.finding_issued_at)
      months = max(1, ceil(elapsed_days / DAYS_PER_PENALTY_MONTH))
      penalty_final_cents = overcharge_monthly_cents * OVERCHARGE_MULTIPLIER
                          + FLAT_MONTHLY_PENALTY_CENTS * months
    input_set: "The single MonitoringReview plus its unit's max_allowed_rent_cents as frozen by the last certification."
    constants:
      OVERCHARGE_MULTIPLIER: 3
      FLAT_MONTHLY_PENALTY_CENTS: 25000
      PENALTY_EXTENSION_THRESHOLD_CENTS: 100000
      CURE_BASE_DAYS: 30
      CURE_EXTENSION_DAYS: 15
      DAYS_PER_PENALTY_MONTH: 30
    precision: "integer cents; integer days; months uses ceiling so day 31 is already the second month"
    note: |
      The penalty depends on how long the cure takes, and how long the owner is ALLOWED
      to take depends on the penalty — a circular dependency. It is broken by pinning
      step 1 at months == 1: cure_extension_days and cure_deadline are functions of
      penalty_at_base_cents alone and are frozen at issue time, while
      penalty_final_cents grows with the actual elapsed months. Re-deriving the
      extension from penalty_final_cents would move the deadline the lateness test is
      measured against, so it is forbidden.

  - name: monitoring_findings
    trigger: "POST /iz-compliance/monitoring-reviews"
    algorithm: threshold
    formula: |
      findings = []
      # emitted in this fixed order, so the array is deterministic
      if unit.tenure == RENTAL and review.reported_rent_cents > unit.max_allowed_rent_cents:
          findings.append(RENT_OVERCHARGE)
      recert_ceiling = round_half_up(income_limit(occupant.household_size, unit.affordability_level_bps)
                                     * OVER_INCOME_TOLERANCE_BPS / 10000)
      if review.reported_income_cents > recert_ceiling:
          findings.append(INCOME_OVER_LIMIT)
      if review.occupancy_verified is false:
          findings.append(OCCUPANCY_UNVERIFIED)
      review.finding_types = findings
    input_set: "The unit, its occupant Household's household_size, and the ACTIVE AmiSchedule."
    constants:
      OVER_INCOME_TOLERANCE_BPS: 14000
    precision: "integer cents; both comparisons are strict (>) so a value exactly at the ceiling is compliant"
    note: |
      A sitting household is allowed to grow to 140% of its entry income limit before an
      over-income finding is issued; OWNERSHIP units are never rent-monitored, so a
      RENT_OVERCHARGE finding is structurally impossible for them.

  - name: refinance_capacity
    trigger: "POST /iz-compliance/affordable-units/{unit_id}/refinance-review"
    algorithm: threshold
    formula: |
      current_median = ACTIVE AmiSchedule.median_income_cents_by_size[str(unit.bedrooms + 1)]
      restricted_value_cents = round_half_up(unit.original_purchase_price_cents
                                             * current_median / unit.ami_income_at_purchase_cents)
      approved_refinance_cap_cents = round_half_up(restricted_value_cents
                                                   * agreement.max_refinance_ltv_bps / 10000)
      if payload.requested_balance_cents > approved_refinance_cap_cents:
          reject ERR_REFINANCE_EXCEEDS_CAP
      unit.last_refinance_balance_cents = payload.requested_balance_cents
    input_set: "The single unit, its agreement's max_refinance_ltv_bps, and the ACTIVE AmiSchedule."
    constants: {}
    precision: "integer cents, round_half_up on the restricted value and again on the cap"
    note: |
      The cap is inclusive: requested_balance_cents == approved_refinance_cap_cents is
      approved and cap + 1 is rejected. Publishing a newer AmiSchedule raises the
      restricted value and therefore raises the cap for the same unit.

  - name: project_obligation_equivalents
    trigger: "Recomputed on POST /iz-compliance/affordable-units, POST .../withdraw, POST .../reinstate, POST /iz-compliance/in-lieu-fees and any InLieuFee state change"
    algorithm: aggregation
    formula: |
      project.onsite_unit_equivalents_bps = 10000 * count(u in AffordableUnit
                                                          where u.project_id == project.id
                                                          and u.occupancy_status != WITHDRAWN)
      project.fee_covered_equivalents_bps = sum(f.unit_equivalent_bps for f in InLieuFee
                                                where f.project_id == project.id
                                                and f.state in {ASSESSED, PARTIALLY_PAID, DELINQUENT, PAID})
    input_set: "Non-WITHDRAWN AffordableUnit rows and non-SUPERSEDED InLieuFee rows of the project."
    constants: {}
    precision: "integer basis points of one unit; every term is a multiple of 1 bps and no rounding occurs"
    note: |
      CONSERVATION INVARIANT: for a SUBJECT project that has reached
      compliance_posture COMPLIANT_ONSITE or COMPLIANT_BY_FEE,
      onsite_unit_equivalents_bps + fee_covered_equivalents_bps == total_obligation_bps.
      withdraw removes 10000 bps from the onsite term and the cascaded SUBSTITUTION fee
      adds exactly 10000 bps to the fee term; reinstate adds 10000 back and supersedes
      that fee, removing 10000. Each compensating pair restores the sum EXACTLY, so the
      quantity is conserved across withdraw/reinstate cycles of any length.

  - name: project_compliance_posture
    trigger: "Recomputed after every screening, unit create/withdraw/reinstate, fee assessment or supersession, monitoring cascade and close-out"
    algorithm: constraint_propagation
    formula: |
      # evaluated top to bottom; the FIRST matching clause wins
      if project.state == DRAFT:                                   -> PENDING
      elif project.applicability == EXEMPT:                        -> NOT_APPLICABLE
      elif any(u.compliance_status == OUT_OF_COMPLIANCE
               for u in project's non-WITHDRAWN units):            -> UNDER_ENFORCEMENT
      elif project.onsite_unit_equivalents_bps
           + project.fee_covered_equivalents_bps
           < project.total_obligation_bps:                         -> DEFICIENT
      elif project.fee_covered_equivalents_bps > 0:                -> COMPLIANT_BY_FEE
      else:                                                        -> COMPLIANT_ONSITE
    input_set: "The project's own screening outputs plus its live unit and fee aggregates."
    constants: {}
    precision: "enumeration; clause order is normative"
    note: |
      Enforcement outranks deficiency: a project that is both short of its obligation
      and holding an OUT_OF_COMPLIANCE unit reports UNDER_ENFORCEMENT, not DEFICIENT.
      The recomputation reaches a fixed point in one pass because every input is a
      stored aggregate, never the posture itself.

  - name: trust_fund_ledger
    trigger: "GET /iz-compliance/trust-fund-summary; also evaluated as a precondition by POST /iz-compliance/trust-fund-disbursements and POST /iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision"
    algorithm: aggregation
    formula: |
      total_paid_fees_cents = sum(f.paid_amount_cents for f in InLieuFee)      # all states
      total_recapture_cents = sum(t.city_recapture_cents for t in ResaleTransaction
                                 where t.state == CLOSED)
      total_inflow_cents    = total_paid_fees_cents + total_recapture_cents
      encumbered_cents      = sum(d.amount_cents for d in TrustFundDisbursement where d.state == REQUESTED)
      disbursed_cents       = sum(d.amount_cents for d in TrustFundDisbursement where d.state == DISBURSED)
      unencumbered_balance_cents = total_inflow_cents - encumbered_cents - disbursed_cents
      admin_cap_cents       = round_half_up(total_inflow_cents * ADMIN_USE_CAP_BPS / 10000)
      admin_committed_cents = sum(d.amount_cents for d in TrustFundDisbursement
                                 where d.state in {REQUESTED, DISBURSED} and d.eligible_use == ADMIN)
    input_set: "Every InLieuFee row's paid_amount_cents; CLOSED ResaleTransaction recaptures; REQUESTED and DISBURSED draws. VOIDED draws contribute nothing."
    constants:
      ADMIN_USE_CAP_BPS: 1000
    precision: "integer cents; round_half_up on the admin cap only"
    note: |
      CONSERVATION INVARIANT: unencumbered_balance_cents + encumbered_cents
      + disbursed_cents == total_inflow_cents at every observable instant. A request
      moves cents from unencumbered to encumbered; a disburse moves the same cents from
      encumbered to disbursed and leaves unencumbered untouched; a void from either
      state returns them, so unencumbered_balance_cents comes back to EXACTLY its
      pre-request value. This conserved quantity is money, and it is unrelated to the
      unit-equivalents quantity conserved by calculations.project_obligation_equivalents.

  - name: substitution_fee_selection
    trigger: "POST /iz-compliance/affordable-units/{unit_id}/reinstate"
    algorithm: chronological
    formula: |
      candidates = [f for f in InLieuFee
                    if f.project_id == unit.project_id
                    and f.basis == SUBSTITUTION
                    and f.state in {ASSESSED, PARTIALLY_PAID, DELINQUENT}]
      if candidates is empty:
          reject ERR_NO_SUBSTITUTION_FEE
      target = candidates ordered by created_at ASC[0]
      if target.paid_amount_cents > 0:
          reject ERR_SUBSTITUTION_FEE_PAID
      target.state = SUPERSEDED
    input_set: "Open SUBSTITUTION assessments of the same project."
    constants: {}
    precision: "ordering only"
    note: |
      Oldest-first (created_at ASC) is the sole selector; InLieuFee.id is never
      consulted. Once any payment has landed on the selected assessment the reinstate
      is refused rather than silently leaving the money stranded, which is what keeps
      calculations.project_obligation_equivalents conserved.

  - name: funder_report_metrics
    trigger: "GET /iz-compliance/funder-reports"
    algorithm: aggregation
    formula: |
      project = Project[project_id]
      delivered_equivalents_bps = project.onsite_unit_equivalents_bps + project.fee_covered_equivalents_bps
      occupied_equivalents_bps  = 10000 * count(u in project's AffordableUnit rows
                                                where u.occupancy_status == OCCUPIED
                                                and u.compliance_status == COMPLIANT)
      compliance_ratio_bps = <variant numerator> as defined below
      open_findings_count  = count(MonitoringReview of this project's units
                                   where state in {FINDING_ISSUED, CURE_SUBMITTED, ESCALATED})
      total_fees_assessed_cents = sum(f.assessed_amount_cents for f in project's InLieuFee
                                      where f.state != SUPERSEDED)
      total_fees_paid_cents     = sum(f.paid_amount_cents for f in project's InLieuFee)
    input_set: "One project's units, fees and monitoring reviews. WITHDRAWN units and SUPERSEDED fees are excluded from every metric."
    constants: {}
    precision: "integer basis points, round_half_up; a project with total_obligation_bps == 0 reports compliance_ratio_bps == 10000"
    variants:
      - name: ENTITLEMENT
        when: "query parameter basis == ENTITLEMENT (the funder credits obligations discharged on paper)"
        difference: |
          compliance_ratio_bps = round_half_up(10000 * delivered_equivalents_bps
                                               / project.total_obligation_bps)
          An assessed in-lieu fee counts fully, and a unit counts the moment it exists,
          occupied or not.
      - name: OCCUPANCY
        when: "query parameter basis == OCCUPANCY (the funder credits only households actually housed)"
        difference: |
          compliance_ratio_bps = round_half_up(10000 * occupied_equivalents_bps
                                               / project.total_obligation_bps)
          In-lieu fees contribute nothing, and a unit counts only while it is both
          OCCUPIED and COMPLIANT — a finding on an occupied unit lowers this ratio
          without moving the ENTITLEMENT ratio at all.
    note: |
      Same project, same instant, two bases, two different compliance_ratio_bps values.
      This dual variant lives in program reporting, a different domain from the
      resale-pricing dual variant in calculations.max_resale_price.

  - name: certification_period_overlap
    trigger: "POST /iz-compliance/income-certifications and POST /iz-compliance/income-certifications/{certification_id}/recertify"
    algorithm: interval_merge
    formula: |
      # A RENTAL certification period is a CLOSED interval [effective_date, expires_at].
      # An OWNERSHIP certification is a point-in-time qualification with no term, so it
      # is never scanned and never collides — that is what lets the incoming buyer of a
      # pending resale be certified while the seller's certification is still CERTIFIED.
      if unit.tenure == OWNERSHIP:
          skip the overlap scan entirely
      new_start = payload.effective_date
      new_end   = new_start + CERTIFICATION_TERM_DAYS
      for existing in IncomeCertification where unit_id == payload.unit_id
                                            and state == CERTIFIED
                                            and expires_at is not null:
          e_start = existing.effective_date
          e_end   = existing.expires_at
          overlap = new_start <= e_end and e_start <= new_end
          if overlap:
              reject ERR_CERTIFICATION_PERIOD_OVERLAP
      # recertify additionally requires the renewal window to be open
      if is_recertification and logical_now < predecessor.expires_at - RECERT_WINDOW_DAYS:
          reject ERR_RECERT_WINDOW_NOT_OPEN
      # the successor abuts the predecessor without touching it
      successor.effective_date = predecessor.expires_at + 1 day
    input_set: "CERTIFIED certifications of the same RENTAL AffordableUnit (expires_at non-null). EXPIRED and SUPERSEDED rows, and every OWNERSHIP certification, are ignored."
    constants:
      CERTIFICATION_TERM_DAYS: 365
      RECERT_WINDOW_DAYS: 30
    precision: "calendar-date arithmetic; both endpoints are INCLUSIVE, so touching endpoints collide"
    note: |
      Closed-interval semantics on the AffordableUnit resource (RENTAL terms only): a
      new period starting exactly on an existing period's expires_at IS a collision, which is why recertify
      places the successor at expires_at + 1 day. Contrast
      calculations.marketing_window_overlap, which is half-open on the Project resource
      and therefore permits exact adjacency.

  - name: marketing_window_overlap
    trigger: "POST /iz-compliance/marketing-plans and POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit"
    algorithm: interval_merge
    formula: |
      # A marketing window is a HALF-OPEN interval [lottery_open_at, lottery_close_at).
      if payload.lottery_open_at >= payload.lottery_close_at:
          reject ERR_INVALID_MARKETING_WINDOW
      for existing in MarketingPlan where project_id == payload.project_id
                                      and state in {SUBMITTED, APPROVED, REVISION_REQUESTED}:
          if payload.lottery_open_at < existing.lottery_close_at
             and existing.lottery_open_at < payload.lottery_close_at:
              reject ERR_MARKETING_WINDOW_OVERLAP
    input_set: "MarketingPlan rows of the same Project in state SUBMITTED, APPROVED or REVISION_REQUESTED. CLOSED plans free their window."
    constants: {}
    precision: "instant comparison on ISO 8601 UTC datetimes; the upper endpoint is EXCLUSIVE"
    note: |
      Half-open semantics on the Project resource: new.lottery_open_at ==
      existing.lottery_close_at is exact adjacency and is ACCEPTED, whereas the same
      touching-endpoint arrangement is rejected by
      calculations.certification_period_overlap. Two different resources, two different
      interval conventions.

  - name: rofr_window
    trigger: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/approve-price (sets the deadline) and the step-4 sweep of POST /_clock/set_current_utc (enforces it)"
    algorithm: threshold
    formula: |
      transaction.rofr_deadline = transaction.price_approved_at + ROFR_WINDOW_DAYS days
      # enforced at decision time
      if logical_now > transaction.rofr_deadline:
          reject ERR_ROFR_WINDOW_EXPIRED
      # enforced by the clock sweep, which is a DAILY batch: it only acts once the
      # deadline's own calendar day has fully elapsed
      if transaction.state == PRICE_APPROVED
         and date(transaction.rofr_deadline) < date(logical_now):
          transaction.state = ROFR_WAIVED; transaction.rofr_auto_waived = true
    input_set: "The single ResaleTransaction; the sweep scans every PRICE_APPROVED transaction."
    constants:
      ROFR_WINDOW_DAYS: 30
    precision: "the decision check is an INSTANT comparison and the deadline instant itself is inclusive, so a decision at exactly rofr_deadline is accepted; the sweep check is a CALENDAR-DATE comparison"
    note: |
      The window closes in two different ways with two different observable outcomes, and
      the two use different granularities on purpose. Between the deadline instant and the
      end of the deadline's calendar day the transaction is still PRICE_APPROVED, yet an
      explicit decision arriving in that gap is refused with ERR_ROFR_WINDOW_EXPIRED. Once
      the calendar day has fully elapsed the daily sweep auto-waives the transaction and
      records rofr_auto_waived = true, after which a decision fails the priority-18 state
      guard instead. An implementation that swept instant-for-instant would make
      ERR_ROFR_WINDOW_EXPIRED unreachable.

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "request payload shape: required fields present, types correct, enums within their declared domains, integer cent and bps fields within their declared ranges, pagination limit in 1..100 and offset >= 0, IncomeCertification.contract_rent_cents == 0 when the unit is OWNERSHIP, Ordinance.discount_tiers ascending with a leading min_pre_discount_cents == 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_ORDINANCE_NOT_FOUND | ERR_AMI_SCHEDULE_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_MARKETING_PLAN_NOT_FOUND | ERR_LOTTERY_EVENT_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_MONITORING_REVIEW_NOT_FOUND | ERR_RESALE_TRANSACTION_NOT_FOUND | ERR_FEE_NOT_FOUND | ERR_DISBURSEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (project_id, agreement_id, marketing_plan_id, lottery_event_id, household_id, unit_id, prior_transaction_id, source_fee_id, buyer_household_id, certification_id)"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_MARKETING_PLAN_NOT_FOUND | ERR_LOTTERY_EVENT_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_RESALE_TRANSACTION_NOT_FOUND | ERR_FEE_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "all creation and link endpoints"
  - priority: 7
    category: auth
    check: "a Developer acting on a Project, AffordableUnit, MarketingPlan, InLieuFee or MonitoringReview must match that resource's owning Project.developer_user_id; a Resident acting on a Household must match that Household.id; a Resident submitting a ResaleTransaction must match the unit's occupant_household_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "PATCH /iz-compliance/projects/{project_id}, POST /iz-compliance/projects/{project_id}/elect-path, POST /iz-compliance/affordable-units, POST /iz-compliance/marketing-plans, POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit, POST /iz-compliance/in-lieu-fees/{fee_id}/payments, POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure, POST /iz-compliance/households/{household_id}/apply, POST /iz-compliance/affordable-units/{unit_id}/refinance-review, POST /iz-compliance/resale-transactions"
  - priority: 8
    category: state
    check: "the OCC guard declared in §1.2.1: expected_project_version equals the live Project.version; expected_unit_version equals the live AffordableUnit.version"
    error_id: "ERR_STALE_PROJECT_VERSION | ERR_STALE_UNIT_VERSION"
    http_status: 412
    applies_to: "POST /iz-compliance/in-lieu-fees, POST /iz-compliance/resale-transactions"
  - priority: 9
    category: state
    check: "Project.state permits the operation (screen only from DRAFT — a re-screen requires a PATCH back to DRAFT first, which is what makes screen_count observable; PATCH only from DRAFT, SCREENED_SUBJECT, SCREENED_EXEMPT, PATH_ELECTED or AGREEMENT_RECORDED; elect-path only from SCREENED_SUBJECT; agreement recording only from PATH_ELECTED; unit creation only from PATH_ELECTED or AGREEMENT_RECORDED or MONITORING; close-out only from MONITORING)"
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /iz-compliance/projects/{project_id}/screen, PATCH /iz-compliance/projects/{project_id}, POST /iz-compliance/projects/{project_id}/elect-path, POST /iz-compliance/projects/{project_id}/close-out, POST /iz-compliance/affordable-units, POST /iz-compliance/regulatory-agreements/{agreement_id}/record"
  - priority: 10
    category: state
    check: "RegulatoryAgreement.state is DRAFT for record and RECORDED for any unit restriction recording"
    error_id: ERR_AGREEMENT_NOT_RECORDED
    http_status: 409
    applies_to: "POST /iz-compliance/regulatory-agreements/{agreement_id}/record, POST /iz-compliance/affordable-units/{unit_id}/record-restriction"
  - priority: 11
    category: state
    check: "AffordableUnit.restriction_state is NOT_RECORDED for record-restriction, and RECORDED for release-restriction, refinance-review and resale submission"
    error_id: ERR_UNIT_NOT_RESTRICTED
    http_status: 409
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/record-restriction, POST .../release-restriction, POST .../refinance-review, POST /iz-compliance/resale-transactions"
  - priority: 12
    category: state
    check: "AffordableUnit.occupancy_status permits the operation (withdraw only from PLANNED or MARKETING; reinstate only from WITHDRAWN)"
    error_id: ERR_UNIT_OCCUPANCY_STATE_INVALID
    http_status: 409
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/withdraw, POST /iz-compliance/affordable-units/{unit_id}/reinstate"
  - priority: 13
    category: state
    check: "MarketingPlan.state permits the operation (review only from SUBMITTED; resubmit only from REVISION_REQUESTED; lottery creation requires APPROVED)"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /iz-compliance/marketing-plans/{marketing_plan_id}/review, POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit, POST /iz-compliance/lottery-events"
  - priority: 14
    category: state
    check: "LotteryEvent.state permits the operation (draw only from PENDING; redraw only from DRAWN; apply requires PENDING)"
    error_id: ERR_LOTTERY_STATE_INVALID
    http_status: 409
    applies_to: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw, POST .../redraw, POST /iz-compliance/households/{household_id}/apply"
  - priority: 15
    category: state
    check: "Household.state permits the operation (apply only from REGISTERED; certification only from REGISTERED or SELECTED — an already CERTIFIED household holds a live placement and is not certified again)"
    error_id: ERR_HOUSEHOLD_STATE_INVALID
    http_status: 409
    applies_to: "POST /iz-compliance/households/{household_id}/apply, POST /iz-compliance/income-certifications"
  - priority: 16
    category: state
    check: "IncomeCertification.state is CERTIFIED for recertify and for any downstream reference"
    error_id: ERR_CERTIFICATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /iz-compliance/income-certifications/{certification_id}/recertify"
  - priority: 17
    category: state
    check: "MonitoringReview.state permits the operation (submit-cure only from FINDING_ISSUED or ESCALATED; clear-cure and escalate only from CURE_SUBMITTED)"
    error_id: ERR_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/submit-cure, POST .../clear-cure, POST .../escalate"
  - priority: 18
    category: state
    check: "ResaleTransaction.state permits the operation (approve-price from SUBMITTED; rofr-decision from PRICE_APPROVED; certify-buyer from ROFR_WAIVED; close from BUYER_CERTIFIED or ROFR_EXERCISED)"
    error_id: ERR_RESALE_STATE_INVALID
    http_status: 409
    applies_to: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/approve-price, POST .../rofr-decision, POST .../certify-buyer, POST .../close"
  - priority: 19
    category: state
    check: "InLieuFee.state is ASSESSED, PARTIALLY_PAID or DELINQUENT — a PAID or SUPERSEDED assessment accepts no further payment"
    error_id: ERR_FEE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /iz-compliance/in-lieu-fees/{fee_id}/payments"
  - priority: 20
    category: state
    check: "TrustFundDisbursement.state permits the operation (disburse only from REQUESTED; void from REQUESTED or DISBURSED)"
    error_id: ERR_DISBURSEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /iz-compliance/trust-fund-disbursements/{disbursement_id}/disburse, POST .../void"
  - priority: 21
    category: business_safety
    check: "the acting X-User-ID is not the one already recorded on the conflicting step: the officer who created a MonitoringReview may not clear its cure, and the officer who approved a resale price may not certify that resale's buyer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/clear-cure, POST /iz-compliance/resale-transactions/{resale_transaction_id}/certify-buyer"
  - priority: 22
    category: business_safety
    check: "the AffordableUnit is not under enforcement: compliance_status != OUT_OF_COMPLIANCE"
    error_id: ERR_UNIT_OUT_OF_COMPLIANCE
    http_status: 422
    applies_to: "POST /iz-compliance/resale-transactions, POST /iz-compliance/resale-transactions/{resale_transaction_id}/approve-price, POST /iz-compliance/affordable-units/{unit_id}/refinance-review, POST /iz-compliance/affordable-units/{unit_id}/release-restriction"
  - priority: 23
    category: business_safety
    check: "the submitted cure actually fixes the violation: corrected_rent_cents <= unit.max_allowed_rent_cents"
    error_id: ERR_CURE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /iz-compliance/monitoring-reviews/{monitoring_review_id}/clear-cure"
  - priority: 24
    category: business_safety
    check: "the comparability standard in calculations.unit_mix_compliance leg A holds for the unit being created"
    error_id: ERR_COMPARABILITY_STANDARD_FAILED
    http_status: 422
    applies_to: "POST /iz-compliance/affordable-units"
  - priority: 25
    category: business_safety
    check: "the bedroom distribution floor in calculations.unit_mix_compliance leg B holds for the whole project"
    error_id: ERR_BEDROOM_DISTRIBUTION_FAILED
    http_status: 422
    applies_to: "POST /iz-compliance/projects/{project_id}/close-out"
  - priority: 26
    category: business_constraint
    check: "an Ordinance vintage exists for the project's approval_date (calculations.ordinance_vintage_selection)"
    error_id: ERR_NO_GOVERNING_ORDINANCE
    http_status: 422
    applies_to: "POST /iz-compliance/projects/{project_id}/screen"
  - priority: 27
    category: business_constraint
    check: "at least one AmiSchedule exists (calculations.ami_schedule_selection)"
    error_id: ERR_NO_AMI_SCHEDULE
    http_status: 422
    applies_to: "POST /iz-compliance/income-certifications, POST /iz-compliance/income-certifications/{certification_id}/recertify, POST /iz-compliance/affordable-units/{unit_id}/record-restriction, POST /iz-compliance/affordable-units/{unit_id}/refinance-review, POST /iz-compliance/resale-transactions, POST /iz-compliance/lottery-events/{lottery_event_id}/draw"
  - priority: 28
    category: business_constraint
    check: "the elected compliance_path is ONSITE, or is listed in the governing ordinance's alternative_paths_allowed"
    error_id: ERR_PATH_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /iz-compliance/projects/{project_id}/elect-path"
  - priority: 29
    category: business_constraint
    check: "uniqueness: Ordinance.code, AmiSchedule.effective_year, AffordableUnit.unit_number per project_id, MonitoringReview.review_year per unit_id, RegulatoryAgreement.doc_number"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /iz-compliance/ordinances, POST /iz-compliance/ami-schedules, POST /iz-compliance/affordable-units, POST /iz-compliance/monitoring-reviews, POST /iz-compliance/regulatory-agreements/{agreement_id}/record"
  - priority: 30
    category: business_constraint
    check: "the eligible applicant pool for the draw is non-empty (calculations.lottery_ranking)"
    error_id: ERR_EMPTY_ELIGIBLE_POOL
    http_status: 422
    applies_to: "POST /iz-compliance/lottery-events/{lottery_event_id}/draw, POST /iz-compliance/lottery-events/{lottery_event_id}/redraw"
  - priority: 31
    category: business_constraint
    check: "a reinstate finds an open SUBSTITUTION assessment to supersede (calculations.substitution_fee_selection)"
    error_id: ERR_NO_SUBSTITUTION_FEE
    http_status: 422
    applies_to: "POST /iz-compliance/affordable-units/{unit_id}/reinstate"
  - priority: 32
    category: business_temporal
    check: "lottery_open_at is strictly before lottery_close_at"
    error_id: ERR_INVALID_MARKETING_WINDOW
    http_status: 422
    applies_to: "POST /iz-compliance/marketing-plans, POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit"
  - priority: 33
    category: business_temporal
    check: "the half-open marketing window does not overlap another live plan of the same project (calculations.marketing_window_overlap)"
    error_id: ERR_MARKETING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /iz-compliance/marketing-plans, POST /iz-compliance/marketing-plans/{marketing_plan_id}/resubmit"
  - priority: 34
    category: business_temporal
    check: "the logical clock sits inside the plan's half-open window: lottery_open_at <= now < lottery_close_at"
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /iz-compliance/households/{household_id}/apply"
  - priority: 35
    category: business_temporal
    check: "for a RENTAL unit, the closed certification period does not overlap a CERTIFIED period for the same unit (calculations.certification_period_overlap); OWNERSHIP certifications carry no term and are never scanned"
    error_id: ERR_CERTIFICATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /iz-compliance/income-certifications, POST /iz-compliance/income-certifications/{certification_id}/recertify"
  - priority: 36
    category: business_temporal
    check: "the recertification window is open: now >= predecessor.expires_at - RECERT_WINDOW_DAYS. Scoped to predecessors with a non-null expires_at (RENTAL): an OWNERSHIP predecessor has no term, is skipped by this rule and is caught by priority 57 instead"
    error_id: ERR_RECERT_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /iz-compliance/income-certifications/{certification_id}/recertify"
  - priority: 37
