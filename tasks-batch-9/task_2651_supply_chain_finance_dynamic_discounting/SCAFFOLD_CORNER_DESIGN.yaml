            - "first call: data[0].line_tax_cents == 2917 and data[0].line_total_cents == 36250"
            - "first call: data[1].line_tax_cents == 0 and data[1].line_total_cents == 66667"
            - "second call: exactly 1 row with invoice_id == ${invoice_b}, line_no == 1, line_tax_cents == 5000, line_total_cents == 55000"
            - "Invoice.${invoice_a}.face_amount_cents == 102917 and Invoice.${invoice_b}.face_amount_cents == 55000"

      - name: payable_file_row_with_unknown_supplier_is_row_rejected
        claim_type: foreign_key_references_validated
        grounds:
          - complexity_profile.entity_topology
          - entities.ApprovedPayableFile.fields.rejection_reasons
          - "validations[priority=6]"
          - "errors[ERR_SUPPLIER_NOT_FOUND]"
        distinguishing_aspect: |
          A supplier_id nested inside a payable-file ROW is deliberately not covered by the
          priority-6 body-FK rule: the file still returns 201 PARTIALLY_ACCEPTED with the offending
          row recorded as { row_index 1, reason SUPPLIER_UNKNOWN }, whereas an unresolvable top-level
          program_id on the same endpoint would be a 404.
        test_recipe:
          setup:
