      - name: cross_entity_foreign_keys_are_validated_not_trusted
        claim_type: foreign_key_validated
        grounds:
          - errors[ERR_VEHICLE_APPLICANT_MISMATCH]
          - errors[ERR_PRODUCER_NOT_FOUND]
          - validations[priority=9][error_id=ERR_VEHICLE_APPLICANT_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so Application carries three independent foreign keys and each one is
          checked on its own axis: a vehicle that exists but belongs to the other applicant is a
          referential-integrity failure (422), while an unresolvable producer_id is an existence
          failure (404) - and existence outranks integrity, so the 404 wins when both are wrong.
        test_recipe:
          setup:
            - "Clock at 2026-09-01; two applicants each own one vehicle: Owen Pike owns VIN ...4360 and Nadia Frost owns VIN ...4361."
            - "One ACTIVE producer appointed in T01, T02 and T03 exists."
