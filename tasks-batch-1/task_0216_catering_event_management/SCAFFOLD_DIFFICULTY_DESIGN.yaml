  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_overbook_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.Venue.fields.max_overlapping_events
          - errors[ERR_VENUE_OVERBOOKED]
        distinguishing_aspect: "Venue overlap uses HALF-OPEN [event_start,event_end) interval arithmetic with aggregate capacity: with max_overlapping_events=1, a second order whose window starts exactly when the first ends (adjacency, no overlap) confirms fine, but one whose window truly overlaps is rejected ERR_VENUE_OVERBOOKED."
