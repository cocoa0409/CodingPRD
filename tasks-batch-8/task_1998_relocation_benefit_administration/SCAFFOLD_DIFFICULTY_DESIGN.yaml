            - "MoveAssignment.${ma_id}.status == CANCELLED (hop 1)"
            - "RelocationCase.${case_id}.total_committed_cents == 0 and total_released_cents == 80000 (hop 2: release caused by the assignment's cancellation)"
            - "RelocationCase.${case_id}.total_paid_cents == 0"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_claim_approve
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: approving a REJECTED claim
          whose amount (250000) also exceeds the misc cap (200000) must return
