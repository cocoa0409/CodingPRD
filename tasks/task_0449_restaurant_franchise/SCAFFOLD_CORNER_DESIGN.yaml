# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Restaurant Franchise Management & Royalty — Expert tier
# Breadth probe: every testable §1.1–§1.7 claim not already covered by §1.8.
# section: / claim_type: values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_brand_returns_201_with_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Brand.fields.royalty_tier_1_rate
          - entities.Brand.fields.current_period_index
          - entities.Brand.fields.current_utc
        distinguishing_aspect: |
          POST /franchise/brands with only name applies defaults (royalty rates 0.06/0.05/0.04, ad_fund 0.02,
          late_fee 0.015) and system fields (current_period_index=0, version=1, current_utc default).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /franchise/brands"
              payload: { name: "FreshCo" }
              as: Franchisor
              captures: { brand_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Brand.${brand_id}.royalty_tier_1_rate == 0.06"
            - "Brand.${brand_id}.ad_fund_rate == 0.02"
            - "Brand.${brand_id}.late_fee_monthly_rate == 0.015"
            - "Brand.${brand_id}.current_period_index == 0"
            - "Brand.${brand_id}.version == 1"
            - "Brand.${brand_id}.current_utc == 2026-01-01T00:00:00Z"

      - name: get_brand_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints
          - entities.Brand.fields.name
        distinguishing_aspect: "GET /franchise/brands/{id} returns the stored Brand with matching name and id."
        test_recipe:
          setup:
            - "One Brand created."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "FreshCo" }
              as: Franchisor
              captures: { brand_id: $.data.id }
          trigger:
            - call: "GET /franchise/brands/${brand_id}"
              payload: {}
              as: Franchisor
          assert:
            - "response.status == 200"
            - "response.data.id == ${brand_id}"
            - "response.data.name == FreshCo"

      - name: list_units_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints
          - entities.Unit.fields.franchisee_id
        distinguishing_aspect: "GET /franchise/units?franchisee_id= returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup:
            - "Brand; one APPROVED franchisee with one PLANNED unit."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
          trigger:
            - call: "GET /franchise/units?franchisee_id=${fz_id}"
              payload: {}
              as: Franchisor
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.data has length 1"
            - "response envelope includes total_count and has_more"

      - name: get_franchisee_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /franchise/franchisees/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no franchisee with this id)."
          setup_api_calls: []
          trigger:
            - call: "GET /franchise/franchisees/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_territory_missing_required_code
        claim_type: Required Fields
        grounds:
          - entities.Territory.fields.code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /franchise/territories without code (required input) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "One Brand."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", name: "North" }
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_franchisee_default_is_existing_operator_false
        claim_type: Defaults
        grounds:
          - entities.Franchisee.fields.is_existing_operator
          - entities.Franchisee.fields.status
          - entities.Franchisee.fields.open_compliance_strikes
        distinguishing_aspect: "Omitting is_existing_operator defaults it to false; status=APPLICANT, open_compliance_strikes=0."
        test_recipe:
          setup:
            - "One Brand."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
          assert:
            - "Franchisee.${fz_id}.is_existing_operator == false"
            - "Franchisee.${fz_id}.status == APPLICANT"
            - "Franchisee.${fz_id}.open_compliance_strikes == 0"

      - name: sales_report_net_sales_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - calculations.net_sales
          - entities.SalesReport.fields.net_sales_cents
        distinguishing_aspect: |
          net_sales_cents is computed as gross - discounts (900000 - 100000 = 800000); a client-supplied
          net_sales_cents is not an accepted input and is ignored.
        test_recipe:
          setup:
            - "Brand; OPEN unit at period 0."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
          trigger:
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 900000, discounts_cents: 100000 }
              as: Franchisor
              captures: { sr_id: $.data.id }
          assert:
            - "SalesReport.${sr_id}.net_sales_cents == 800000"
            - "SalesReport.${sr_id}.status == POLLED"

      - name: invalid_enum_vendor_category_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Vendor.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /franchise/vendors with category outside {FOOD,PACKAGING,EQUIPMENT,SERVICES} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One Brand."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /franchise/vendors"
              payload: { brand_id: "${brand_id}", name: "X", category: "WIDGETS" }
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: unit_open_with_wrong_franchisee_parent_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Unit.fields.franchisee_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /franchise/units with a non-existent franchisee_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Brand and a territory exist, but franchisee_id refers to nothing."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
          trigger:
            - call: "POST /franchise/units"
              payload: { franchisee_id: "00000000-0000-0000-0000-000000000000", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_already_approved_franchisee_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Franchisee.APPLICANT_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a franchisee already in APPROVED returns ERR_INVALID_STATE; not idempotent."
        test_recipe:
          setup:
            - "Brand; one franchisee already APPROVED."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
          trigger:
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: issue_royalty_statement_without_accepted_sales_basis
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
          - validations[priority=13]
          - errors[ERR_NO_SALES_BASIS]
        distinguishing_aspect: "Issuing a DRAFT statement with no ACCEPTED SalesReport for its unit+period returns ERR_NO_SALES_BASIS."
        test_recipe:
          setup:
            - "Brand; OPEN unit; a DRAFT RoyaltyStatement for period 0 but NO accepted sales report (a POLLED-only report exists)."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 500000, discounts_cents: 0 }
              as: Franchisor
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_SALES_BASIS"
            - "RoyaltyStatement.${rs_id}.status == DRAFT"

      - name: newly_created_unit_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.Unit.transitions
          - entities.Unit.fields.operational_status
          - entities.Unit.fields.compliance_status
        distinguishing_aspect: "A newly created Unit starts operational_status=PLANNED and compliance_status=GOOD_STANDING."
        test_recipe:
          setup:
            - "Brand; APPROVED franchisee; territory."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
          trigger:
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
          assert:
            - "Unit.${unit_id}.operational_status == PLANNED"
            - "Unit.${unit_id}.compliance_status == GOOD_STANDING"

      - name: write_off_from_terminal_written_off_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RoyaltyStatement.OVERDUE_to_WRITTEN_OFF
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second write-off on an already WRITTEN_OFF (terminal) statement returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Brand; OPEN unit; ISSUED statement (basis 1000000) driven OVERDUE then WRITTEN_OFF."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/sales-reports"
              payload: { unit_id: "${unit_id}", period_index: 0, gross_sales_cents: 1000000, discounts_cents: 0 }
              as: Franchisor
              captures: { sr_id: $.data.id }
            - call: "POST /franchise/sales-reports/${sr_id}/accept"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/royalty-statements"
              payload: { unit_id: "${unit_id}", period_index: 0 }
              as: FinanceClerk
              captures: { rs_id: $.data.id }
            - call: "POST /franchise/royalty-statements/${rs_id}/issue"
              payload: {}
              as: FinanceClerk
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/brands/${brand_id}/close-period"
              payload: {}
              as: Franchisor
              captures: { brand_v: $.data.version }
            - call: "POST /franchise/royalty-statements/${rs_id}/write-off"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
              captures: { brand_v2: $.data.id }
          trigger:
            - call: "POST /franchise/royalty-statements/${rs_id}/write-off"
              payload: { expected_brand_version: "${brand_v}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE   # already WRITTEN_OFF; state check precedes OCC"

      - name: open_remediation_on_pass_audit_no_remediation_needed
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BrandAudit.FINALIZED_to_REMEDIATION
          - errors[ERR_NO_REMEDIATION_NEEDED]
        distinguishing_aspect: "open-remediation on a FINALIZED audit whose grade is PASS returns ERR_NO_REMEDIATION_NEEDED."
        test_recipe:
          setup:
            - "Brand; OPEN unit; a FINALIZED audit with all section scores 95 (grade PASS)."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /franchise/audits/${audit_id}/start"
              payload: {}
              as: ComplianceAuditor
            - call: "POST /franchise/audits/${audit_id}/finalize"
              payload: { food_safety_score: 95, cleanliness_score: 95, service_score: 95, brand_compliance_score: 95 }
              as: ComplianceAuditor
          trigger:
            - call: "POST /franchise/audits/${audit_id}/open-remediation"
              payload: {}
              as: ComplianceAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_REMEDIATION_NEEDED"

      - name: conditional_audit_drives_unit_probation_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BrandAudit.IN_PROGRESS_to_FINALIZED
          - state_machines.Unit.GOOD_STANDING_to_PROBATION
          - entities.Unit.fields.latest_audit_score
        distinguishing_aspect: |
          Finalizing an audit with a CONDITIONAL grade (scores giving overall in [70,90)) sets
          Unit.compliance_status=PROBATION and Unit.latest_audit_score to the overall score, while
          operational_status stays OPEN.
        test_recipe:
          setup:
            - "Brand; OPEN unit in GOOD_STANDING; an IN_PROGRESS audit."
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { name: "B" }
              as: Franchisor
              captures: { brand_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { brand_id: "${brand_id}", code: "T", name: "T" }
              as: Franchisor
              captures: { terr_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { brand_id: "${brand_id}", legal_name: "FZ", owner_user_id: "u_fz" }
              as: Franchisor
              captures: { fz_id: $.data.id }
            - call: "POST /franchise/franchisees/${fz_id}/approve"
              payload: {}
              as: Franchisor
            - call: "POST /franchise/territories/${terr_id}/assign"
              payload: { franchisee_id: "${fz_id}" }
              as: Franchisor
            - call: "POST /franchise/units"
              payload: { franchisee_id: "${fz_id}", territory_id: "${terr_id}", address: "U1" }
              as: Franchisor
              captures: { unit_id: $.data.id }
            - call: "POST /franchise/units/${unit_id}/open"
              payload: {}
              as: Franchisee
              as_user_id: "u_fz"
            - call: "POST /franchise/audits"
              payload: { unit_id: "${unit_id}" }
              as: ComplianceAuditor
              captures: { audit_id: $.data.id }
            - call: "POST /franchise/audits/${audit_id}/start"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /franchise/audits/${audit_id}/finalize"
              payload: { food_safety_score: 80, cleanliness_score: 80, service_score: 80, brand_compliance_score: 80 }
              as: ComplianceAuditor
          assert:
            - "BrandAudit.${audit_id}.overall_score == 80.0"
            - "BrandAudit.${audit_id}.grade == CONDITIONAL"
            - "Unit.${unit_id}.compliance_status == PROBATION"
            - "Unit.${unit_id}.operational_status == OPEN"
            - "Unit.${unit_id}.latest_audit_score == 80.0"

      - name: audit_finalize_critical_food_safety_cap_to_59
        claim_type: Side Effect Execution
        grounds:
          - calculations.audit_score
          - entities.BrandAudit.fields.weighted_score
