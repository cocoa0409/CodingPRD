      - "Recomputes rotation_seed_index for EVERY BallotStyle of the election with status != SUPERSEDED as the 0-based rank of style_code ASC, so inserting a style with a lower style_code shifts the rotation seed of the styles already created."
      - "When supersedes_style_id is present the referenced style transitions to SUPERSEDED, every PrintJob of that style in PROOF_PENDING is REJECTED with its committed cost released, and every DRAFT or SEALED TestDeck of that style is VOIDED."
