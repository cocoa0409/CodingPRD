# =============================================================================
# §1.9 Scaffold Corner Design - breadth probe over the §1.1-§1.7 surface of
# SCAFFOLD.yaml (task 2537, Bridge Inspection & Load Rating Program).
#
# Sections and claim_type values are taken verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe; corners it already
# asserts appear here only as `excluded_because:` stubs.
#
# Logical clock: every chain starts by pinning POST /_clock/set_current_utc, so
# no assertion depends on the mandatory startup default 2026-08-01T00:00:00Z.
#
# Recurring fixture vocabulary (re-derived from scratch in every chain):
#   Personnel  Ivy Inspector (team_leader_certified), Quinn Qa (team_leader_certified),
#              Rita Rating (PE-11021, licensed), Dana District (PE-20044, licensed)
#   Bridge     STR-000001 "Cedar Creek Bridge", STEEL_GIRDER, 1000 sqm, 1972, adt 12000
#   Elements   DECK 1000 (600/200/150/50), GIRDER 300 (0/100/100/100),
#              BEARING 4 (0/2/1/1), ABUTMENT 4 (3/1/0/0)
#              -> element indices 82.00 / 40.00 / 50.00 / 95.00, BHI 65.47,
#                 NBI 7 / 3 / 8, min_nbi_rating 3, reported total 1308, deficient 402
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: bridge_create_returns_declared_envelope_and_seeded_ratings
        claim_type: creation
        grounds:
          - entities.Bridge
          - endpoints.POST_bridges
          - calculations.inspection_interval_months
          - calculations.next_inspection_due_date
        distinguishing_aspect: "POST /bridges with every required field plus explicit initial_* seeds returns 201 and a Bridge whose 8 input fields echo, whose seeded ratings give min_nbi_rating 6, and whose interval/due-date pair is 24 months / 2028-09-01."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-09-01T00:00:00Z so created_at and the due-date base are deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false, initial_deck_rating: 6, initial_superstructure_rating: 7, initial_substructure_rating: 8 }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
          assert:
            - "HTTP 201; the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Bridge.${br_id} echoes nbi_structure_number STR-000001, name Cedar Creek Bridge, owner_agency STATE_DOT, structure_type STEEL_GIRDER, deck_area_sqm 1000, year_built 1972, adt 12000, detour_length_km 8.5, spans_water true"
            - "Bridge.${br_id}.version == 1 and created_at == updated_at == 2026-09-01T00:00:00Z"
            - "Bridge.${br_id}.deck_rating == 6, superstructure_rating == 7, substructure_rating == 8, min_nbi_rating == 6"
            - "Bridge.${br_id}.inspection_interval_months == 24 (min_nbi 6 is above the poor floor of 4 but below the extended floor of 7) and next_inspection_due_date == 2028-09-01"
            - "Bridge.${br_id}.underwater_interval_months == null and next_underwater_due_date == null because underwater_elements is false"
            - "Bridge.${br_id}.service_posture == OPEN, scour_status == NOT_EVALUATED, poa_compliant == true, posting_required == false, posted_limit_tons == null, governing_load_rating_id == null"
            - "Bridge.${br_id}.bridge_health_index == null, inventoried_quantity_total == 0, deficiency_pct == 0, open_critical_finding_count == 0"

      - name: personnel_get_by_id_returns_stored_fields_and_derived_qualification
        claim_type: retrieval
        grounds:
          - entities.Personnel
          - endpoints.GET_personnel_id
          - calculations.personnel_qualification_status
        distinguishing_aspect: "GET /personnel/{id} returns the stored input fields unchanged and recomputes qualification_status from the logical clock, so an expiry date equal to the clock's calendar date still reads CURRENT."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one Personnel whose nbis_refresher_expiry_date is exactly 2026-09-01, the inclusive boundary of the qualification rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2026-09-01", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
          trigger:
            - call: "GET /personnel/${insp_id}"
              payload: {}
              as: BridgeInspector
              as_user_id: "${insp_id}"
          assert:
            - "HTTP 200 with response_type == object"
            - "Personnel.${insp_id}.full_name == Ivy Inspector, agency == STATE_DOT, nbis_refresher_expiry_date == 2026-09-01, team_leader_certified == true"
            - "Personnel.${insp_id}.underwater_diver_certified == false, fracture_critical_certified == false, load_rating_engineer_licensed == false, pe_license_number == null"
            - "Personnel.${insp_id}.qualification_status == CURRENT - the expiry date equals the clock date and the comparison is inclusive"
            - "Personnel.${insp_id}.version == 1 and the GET does not bump it"
            - "After POST /_clock/set_current_utc to 2026-09-02T00:00:00Z the same GET reports qualification_status == EXPIRED with every stored field byte-identical"

      - name: bridges_list_pagination_and_filter_report_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_bridges
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /bridges paginates over three rows with limit 2: the first page returns 2 rows with total_count 3 and has_more true, the second returns 1 row with has_more false, and adding structure_type=CONCRETE_BOX narrows total_count to 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; exactly three bridges, one of them the only CONCRETE_BOX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5 }
              as: ProgramAdmin
              captures: { br1_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1988, adt: 3000, detour_length_km: 2.0 }
              as: ProgramAdmin
              captures: { br2_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000003", name: "Granite Ridge Overpass", owner_agency: "COUNTY", structure_type: "PRESTRESSED_GIRDER", deck_area_sqm: 800, year_built: 1995, adt: 7000, detour_length_km: 5.0 }
              as: ProgramAdmin
              captures: { br3_id: $.data.id }
          trigger:
            - call: "GET /bridges?limit=2&offset=0"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /bridges?limit=2&offset=2"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /bridges?structure_type=CONCRETE_BOX"
              payload: { structure_type: "CONCRETE_BOX" }
              as: ProgramAdmin
          assert:
            - "First page: HTTP 200, response_type == array, 2 rows in data, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: 1 row in data, total_count == 3, offset == 2, has_more == false"
            - "The union of the two pages is exactly {${br1_id}, ${br2_id}, ${br3_id}} with no row repeated across pages"
            - "Filtered read: 1 row whose id == ${br2_id}, total_count == 1, has_more == false"
            - "GET /bridges with no query parameters applies the declared defaults limit 10 / offset 0 and returns all 3 rows with has_more == false"

      - name: bridge_get_unknown_id_not_found_returns_error_envelope
        claim_type: not_found
        grounds:
          - errors.ERR_BRIDGE_NOT_FOUND
          - validations.priority_5_existence
          - response_envelope.error
        distinguishing_aspect: "GET /bridges/{unknown uuid} returns 404 ERR_BRIDGE_NOT_FOUND in the error envelope shape (response_type error, data.error_id, data.message) and no partial Bridge body."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one real bridge exists so the failure is id resolution, not an empty table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5 }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "GET /bridges/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_BRIDGE_NOT_FOUND"
            - "data.message is a non-empty string and data carries no Bridge fields"
            - "GET /bridges still reports total_count == 1 - the failed read created nothing"

      - name: bridge_create_missing_required_adt_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - endpoints.POST_bridges
          - entities.Bridge.fields.adt
        distinguishing_aspect: "adt has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST rather than defaulting to 0 and silently qualifying the structure for the extended 48-month interval."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; empty bridge inventory."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1995, detour_length_km: 8.5 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /bridges returns an empty list with total_count == 0 - no partially populated Bridge was written"
            - "The identical payload plus adt 4000 returns 201 with inspection_interval_months 48 and next_inspection_due_date 2030-09-01, proving the omitted field really was load-bearing"

      - name: bridge_create_optional_flags_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Bridge.fields.spans_water
          - entities.Bridge.fields.initial_deck_rating
          - entities.Bridge.fields.inspection_interval_months
          - calculations.inspection_interval_months
        distinguishing_aspect: "Omitting every optional flag applies spans_water/underwater_elements/fracture_critical false and initial ratings 7/7/7, so min_nbi_rating is 7 and the extended-interval test then turns on year_built alone: 1972 yields 24 months, 1995 yields 48."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; two bridges created with only the eight required fields, differing solely in year_built and adt."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5 }
              as: ProgramAdmin
              captures: { br_old_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Granite Ridge Overpass", owner_agency: "STATE_DOT", structure_type: "PRESTRESSED_GIRDER", deck_area_sqm: 800, year_built: 1995, adt: 4000, detour_length_km: 5.0 }
              as: ProgramAdmin
              captures: { br_new_id: $.data.id }
          assert:
            - "Bridge.${br_old_id}.spans_water == false, underwater_elements == false, fracture_critical == false"
            - "Bridge.${br_old_id}.deck_rating == 7, superstructure_rating == 7, substructure_rating == 8 is FALSE - all three seeds default to 7, so deck_rating == superstructure_rating == substructure_rating == 7 and min_nbi_rating == 7"
            - "Bridge.${br_old_id}.inspection_interval_months == 24 and next_inspection_due_date == 2028-09-01 - year_built 1972 fails the >= 1990 extension test"
            - "Bridge.${br_new_id}.inspection_interval_months == 48 and next_inspection_due_date == 2030-09-01 - min_nbi 7, year_built 1995 and adt 4000 all pass the extension test"
            - "Both bridges report service_posture OPEN, scour_status NOT_EVALUATED, poa_compliant true, underwater_interval_months null, deficiency_pct 0 and inventoried_quantity_total 0"

      - name: element_condition_computed_fields_derived_from_condition_quantities
        claim_type: computed_fields
        grounds:
          - entities.ElementCondition.fields.reported_sum
          - entities.ElementCondition.fields.balanced
          - entities.ElementCondition.fields.deficient_quantity
          - calculations.element_health_index
          - entities.Inspection.fields.element_count
        distinguishing_aspect: "One POST of a GIRDER row with 0/100/100/100 derives reported_sum 300, balanced true, deficient_quantity 200, element_group SUPERSTRUCTURE and element_health_index 40.00, and rolls the parent Inspection's element_count / reported_quantity_total / deficient_quantity_total / photo_count_total forward in the same request."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector; Cedar Creek Bridge; one DRAFT ROUTINE inspection with no element rows yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_id: $.data.id }
          assert:
            - "HTTP 201; ElementCondition.${ec_id}.inspection_id == ${ins_id} and version == 1"
            - "ElementCondition.${ec_id}.reported_sum == 300, balanced == true, deficient_quantity == 200"
            - "ElementCondition.${ec_id}.element_health_index == 40.00 (100*(1.00*0 + 0.80*100 + 0.40*100 + 0.00*100)/300)"
            - "ElementCondition.${ec_id}.element_group == SUPERSTRUCTURE, consistent with the GROUP_MEMBERS map for GIRDER"
            - "Inspection.${ins_id}.element_count == 1, reported_quantity_total == 300, deficient_quantity_total == 200, photo_count_total == 8, quantity_balanced == true"
            - "Inspection.${ins_id}.bridge_health_index == null and Bridge.${br_id}.bridge_health_index == null - element writes alone do not publish to the Bridge before acceptance"

      - name: inspection_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Inspection.fields.status
          - entities.Inspection.fields.bridge_id
          - entities.Inspection.fields.submitted_at
          - state_machines.Inspection.null_to_DRAFT
        distinguishing_aspect: "Client-supplied values for the system fields status, bridge_id, submitted_at and returned_count are ignored: the created Inspection reads status DRAFT, bridge_id taken from the creation path, submitted_at null and returned_count 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector; two bridges, so a smuggled bridge_id could measurably point at the wrong one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br1_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1988, adt: 3000, detour_length_km: 2.0 }
              as: ProgramAdmin
              captures: { br2_id: $.data.id }
          trigger:
            - call: "POST /bridges/${br1_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z", status: "ACCEPTED", bridge_id: "${br2_id}", submitted_at: "2026-01-01T00:00:00Z", returned_count: 5 }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
          assert:
            - "HTTP 201 with Inspection.${ins_id}.status == DRAFT, not the requested ACCEPTED"
            - "Inspection.${ins_id}.bridge_id == ${br1_id} (from the path), not the ${br2_id} smuggled in the body"
            - "Inspection.${ins_id}.submitted_at == null, qa_claimed_at == null, accepted_at == null, returned_count == 0"
            - "Inspection.${ins_id}.created_at == 2026-09-01T00:00:00Z and version == 1"
            - "GET /inspections?bridge_id=${br2_id} returns an empty list with total_count == 0"

      - name: permit_application_invalid_enum_speed_category_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_3_ERR_INVALID_REQUEST
          - entities.PermitApplication.fields.speed_category
          - entities.PermitApplication.fields.axle_loads_tons
        distinguishing_aspect: "speed_category accepts only NORMAL or CRAWL, and axle_loads_tons requires at least two strictly positive entries, so SLOW and a single-axle array are both 400 ERR_INVALID_REQUEST rather than being coerced to defaults."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; one bridge to route over."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /permit-applications"
              payload: { permit_number: "OW-2026-0009", carrier_name: "Northline Heavy Haul", axle_loads_tons: [10.0, 10.0, 10.0, 6.0], route_bridge_ids: ["${br_id}"], speed_category: "SLOW" }
              as: PermitOfficer
              captures: { err_enum: $.data.error_id }
            - call: "POST /permit-applications"
              payload: { permit_number: "OW-2026-0010", carrier_name: "Northline Heavy Haul", axle_loads_tons: [36.0], route_bridge_ids: ["${br_id}"], speed_category: "NORMAL" }
              as: PermitOfficer
              captures: { err_axles: $.data.error_id }
          assert:
            - "Both calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /permit-applications returns an empty list with total_count == 0"
            - "The same payload with speed_category NORMAL and four axles returns 201 with gross_weight_tons 36.0, axle_count 4, status RECEIVED and recommended_decision PENDING"

      - name: notification_log_immutability_no_version_and_no_mutator
        claim_type: immutability
        grounds:
          - entities.NotificationLog
          - endpoints.GET_notification_logs_id
          - endpoints.POST_critical_findings_id_notify
        distinguishing_aspect: "NotificationLog is declared common_fields false: the created row carries no version field, §1.5 exposes only POST notify plus the two reads, and the audit row's sent_at / late stay frozen after later state changes on its parent finding."
        test_recipe:
          setup:
            - "Logical clock 2026-09-02T12:00:00Z at finding creation; Ivy Inspector as team leader, Dana District as the notifying district engineer."
            - "Cedar Creek Bridge with a SUBMITTED ROUTINE inspection (findings may be raised from SUBMITTED) and one URGENT CriticalFinding with no element_condition_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Dana District", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true, load_rating_engineer_licensed: true, pe_license_number: "PE-20044" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
