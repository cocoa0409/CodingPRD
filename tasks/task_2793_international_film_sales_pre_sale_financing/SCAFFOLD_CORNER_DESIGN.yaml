      - name: expenses_may_be_logged_to_twice_the_cap_and_not_one_cent_further
        claim_type: aggregate_validation
        grounds:
          - validations[priority=106]
          - errors.ERR_EXPENSE_LOG_LIMIT
          - entities.SalesAgencyAgreement.fields.expenses_incurred_usd
        distinguishing_aspect: |
          EXPENSE_LOG_TOLERANCE 2.00 makes the LOGGING ceiling 150000.00 on a 75000.00 cap, so a single
          100000.00 entry above the cap is accepted, a second 50000.00 lands exactly on the ceiling and
          is accepted, and a further 0.01 is refused — while the recoupable figure remains
          min(150000.00, 75000.00) = 75000.00, i.e. logging above the cap never increases recovery.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; PACKAGING film with an EXECUTED agreement whose expense_cap_usd is 75000.00 and expenses_incurred_usd 0.00."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/agency-agreements/${agr_id}/expenses"
              payload: { amount_usd: 100000.00, memo: "AFM booth and print ads" }
              as: SalesAgent
            - call: "POST /film-sales/agency-agreements/${agr_id}/expenses"
              payload: { amount_usd: 50000.00, memo: "trailer and key art" }
              as: HeadOfSales
            - call: "POST /film-sales/agency-agreements/${agr_id}/expenses"
              payload: { amount_usd: 0.01, memo: "one cent too far" }
              as: SalesAgent
              captures: { err_exp: $.data.error_id }
          assert:
            - "the 100000.00 entry returns HTTP 200 even though it exceeds the 75000.00 cap"
            - "the 50000.00 entry returns HTTP 200 at exactly 150000.00 == 75000.00 * 2.00"
            - "${err_exp} == ERR_EXPENSE_LOG_LIMIT at HTTP 422"
            - "SalesAgencyAgreement.${agr_id}.expenses_incurred_usd == 150000.00, not 150000.01"
            - "the recoupable expense figure used for the SALES_EXPENSES tier cap is min(150000.00, 75000.00) == 75000.00"

      - name: market_item_windows_must_sit_inside_the_market_dates
        claim_type: temporal_validation
        grounds:
          - validations[priority=82]
          - errors.ERR_OUTSIDE_MARKET_WINDOW
        distinguishing_aspect: |
          The containment test is inclusive on both edges of the MARKET and applies to the slot's own
          end_at: a window starting a day before start_date fails, a window ending one hour after
          end_date fails, and a window starting exactly at start_date 2027-02-11T00:00:00Z is accepted.
        test_recipe:
          setup:
            - "PACKAGING film; OPEN market EFM Berlin 2027-02-11T00:00:00Z -> 2027-02-17T00:00:00Z with 3 rooms."
          setup_api_calls:
