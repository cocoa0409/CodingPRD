          - entities.RetailerListing.fields.open_blocking_error_count
        distinguishing_aspect: "One REJECTED response runs four ordered hops — rows created and slots released, listing to ERROR_HOLD with penalty tier 12, health recomputed to 20.00 which is under the 60.00 threshold so a HEALTH_DEGRADED alert appears, then the product rollup — and the three BLOCKING rows land in request order."
