      - name: certification_date_order_violation
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_CERTIFICATION_DATE_ORDER]"]
        distinguishing_aspect: "expires_on == obtained_on (not strictly greater) returns ERR_CERTIFICATION_DATE_ORDER."
