      - name: firmware_campaign_half_open_windows_allow_touching_but_cap_intersecting_at_two
        grounds:
          - validations[priority=35]
          - constants.MAX_CONCURRENT_CAMPAIGNS_PER_MODEL
          - constants.COHORT_SIZE
          - state_machines.FirmwareCampaign.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Aggregate temporal CAPACITY rather than exclusivity, on HALF-OPEN unpadded windows: up to
          MAX_CONCURRENT_CAMPAIGNS_PER_MODEL == 2 campaigns may intersect the same instant, and the
          third intersecting window is rejected, yet a campaign whose window_start equals another's
          window_end does not intersect at all and is accepted. That touching-is-allowed convention
