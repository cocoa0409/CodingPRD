    output: Customer
    side_effects: []

  # --- Song catalog ---
  - method: POST
    path: "/songs"
    description: "Add a song to the venue catalog"
    roles: [VenueManager, FrontDesk]
    code: 201
    input: [venue_id, title, artist, duration_seconds, language]
    output: Song
    side_effects: []

  - method: GET
    path: "/songs"
    description: "List/search the song catalog, filter by venue_id and/or language, paginate"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: ["venue_id?", "language?", "limit?", "offset?"]
    output: Song[]
    side_effects: []

  - method: GET
    path: "/songs/{song_id}"
    description: "Get a song"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: []
    output: Song
    side_effects: []

  # --- Reservation ---
  - method: POST
    path: "/reservations"
    description: "Create a HELD reservation for a time block on a room (OCC on room version, overlap-checked)"
    roles: [Customer, FrontDesk]
    code: 201
    input: [venue_id, room_id, customer_id, party_size, slot_start_utc, slot_end_utc, expected_room_version, "group_package_id?"]
    output: Reservation
    side_effects:
      - "status=HELD, version=1"
      - "Denormalize room_type_id from room"
      - "Overlap check vs active reservations on the room (ERR_ROOM_DOUBLE_BOOKED)"
      - "OCC vs Room.version (ERR_STALE_ROOM_VERSION)"
      - "Compute quoted_room_subtotal_cents and deposit_cents (preview)"

  - method: GET
    path: "/reservations"
    description: "List reservations, optionally filtered by venue_id, room_id, customer_id, group_package_id, room_type_id, or status"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: ["venue_id?", "room_id?", "customer_id?", "group_package_id?", "room_type_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/reservations/{reservation_id}"
    description: "Get a reservation (read version for OCC, computed totals)"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/reservations/{reservation_id}/confirm"
    description: "Confirm a HELD reservation; collect deposit"
    roles: [Customer, FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status HELD -> CONFIRMED"
      - "Recompute quoted_room_subtotal_cents, deposit_cents"
      - "Append Payment{DEPOSIT}"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{reservation_id}/check-in"
    description: "Check in a CONFIRMED reservation within grace window; occupy the room"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status CONFIRMED -> CHECKED_IN"
      - "Set checked_in_at = current_utc"
      - "Room AVAILABLE -> OCCUPIED"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{reservation_id}/close"
    description: "Close a CHECKED_IN session; settle room, F&B minimum, overage"
    roles: [FrontDesk]
    code: 200
    input: [actual_end_utc]
    output: Reservation
    side_effects:
      - "status CHECKED_IN -> CLOSED"
      - "Compute settled_room_subtotal_cents, fb_consumed_cents, fb_shortfall_cents, final_total_cents"
      - "Append Payment{SETTLEMENT}"
      - "PENDING QueueEntry -> SKIPPED"
      - "Room OCCUPIED -> AVAILABLE"
      - "increments Reservation.version by 1"

  - method: POST
    path: "/reservations/{reservation_id}/cancel"
    description: "Cancel a HELD or CONFIRMED reservation; refund or forfeit deposit per cutoff"
    roles: [Customer, FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status -> CANCELLED"
      - "CONFIRMED: append Payment{REFUND} if outside cutoff else Payment{FORFEIT}"
      - "PENDING QueueEntry -> CANCELLED"
      - "increments Reservation.version by 1"

  # --- Extension ---
  - method: POST
    path: "/reservations/{reservation_id}/extensions"
    description: "Extend a reservation's slot_end_utc (OCC on reservation version, overlap re-checked)"
    roles: [Customer, FrontDesk]
    code: 201
    input: [new_slot_end_utc, expected_reservation_version]
    output: Extension
    side_effects:
      - "status=APPLIED, version=1"
      - "Overlap re-check on the room over [old_end, new_end) (ERR_EXTENSION_CONFLICT)"
      - "OCC vs Reservation.version (ERR_STALE_RESERVATION_VERSION)"
      - "Set Reservation.slot_end_utc = new_slot_end_utc; recompute quoted_room_subtotal_cents/deposit_cents preview"
      - "increments Reservation.version by 1"

  - method: GET
    path: "/extensions"
    description: "List extensions, filtered by reservation_id"
    roles: [VenueManager, FrontDesk, Customer]
    code: 200
