# Task 2787 — Advertising Policy Review & Ad Approval
# Scaffold seed tables (§1.0–§1.7). Difficulty band: Expert (upper edge).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  2787. Advertising Policy Review & Ad Approval (advertising platform policy operations):
  policy framework across prohibited, restricted and regulated categories with country-level
  variation, automated pre-approval screening with classifier decisions and confidence
  thresholds, human review queues for restricted categories with certification requirements
  such as licenses and disclaimers, advertiser verification for identity, business standing
  and industry authorization, landing page and destination review with mismatch and cloaking
  detection, disapproval notification with reason codes and appeal workflow, account-level
  enforcement with warnings, restrictions and suspension for repeated violations, political
  and social issue advertising with disclosure, archive and eligibility requirements.

domain_name: advertising-policy-review
api_prefix: "/ad-policy"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys carried in request bodies.
  # Only three nesting relationships survive in URLs (country-overrides under a
  # policy rule, screening-runs / destination-checks under a creative) because
  # those children are strictly owned; everything else is flat with FK filters.

  state_machine_shape: parallel
  # AdCreative carries two independent state axes (review_status x destination_status)
  # that advance on different triggers and are read together by a derived gate.
  # ReviewTask is cyclic (CLAIMED -> ESCALATED -> QUEUED -> CLAIMED, cycle_count++).
  # Appeal is branching (SUBMITTED -> {GRANTED, DENIED}) with divergent side-effect sets.
  # Advertiser.account_status is compound (derived from its EnforcementAction rows).

  relationship_patterns:
    - one_to_many          # Advertiser -> AdCreative, AdCreative -> ScreeningRun
    - self_referential     # EnforcementAction.prior_action_id -> EnforcementAction.id
    - cross_aggregate      # AdCreative.approved_under_certification_id -> Certification.id
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The reviewer who issued a DisapprovalNotice may not decide the Appeal against it.
  # PolicyAdmin cannot claim or decide review tasks; PolicyReviewer cannot mint policy
  # rules or enforcement actions; IntegrityAnalyst owns destination evidence only.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PolicyRule
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Stable policy code referenced by AdCreative.declared_category_codes"
        constraints: "1-40 chars, uppercase A-Z, digits and underscore; globally unique"
      - name: title
        type: string
        source: input
        description: "Human-readable policy title shown on notices"
        constraints: "1-160 chars"
      - name: category_class
        type: enum
        source: input
        description: "Policy framework tier"
        constraints: "PROHIBITED | RESTRICTED | REGULATED"
      - name: base_severity_weight
        type: number
        source: input
        description: "Points weight before country multiplier and reason factor"
        constraints: "0.01-20.00, exactly 2 decimals"
      - name: requires_certification
        type: boolean
        source: input
        description: "When true, approval of a matched creative demands a covering Certification"
        default: false
      - name: requires_disclaimer
        type: boolean
        source: input
        description: "When true, approval demands non-empty AdCreative.disclaimer_text"
        default: false
      - name: confidence_auto_disapprove_threshold
        type: number
        source: input
        description: "Classifier confidence at or above which a decision is AUTO_DISAPPROVE"
        default: 0.90
        constraints: "0.01-1.00, exactly 2 decimals; the cross-field ordering against confidence_manual_threshold is NOT part of this type check — it is enforced by validations[priority=92] so that ERR_INVALID_THRESHOLD_ORDER stays reachable"
      - name: confidence_manual_threshold
        type: number
        source: input
        description: "Classifier confidence at or above which a decision routes to human review"
        default: 0.55
        constraints: "0.01-1.00, exactly 2 decimals"
      - name: review_sla_hours
        type: integer
        source: input
        description: "Hours from ReviewTask creation to sla_deadline_at for this rule"
        default: 48
        constraints: "1-336"
      - name: default_queue
        type: enum
        source: input
        description: "Queue a routed ReviewTask lands in when this rule is primary"
        default: STANDARD
        constraints: "STANDARD | REGULATED_CERT | POLITICAL"
      - name: country_override_count
        type: integer
        source: computed
        description: "Count of CountryPolicyOverride rows referencing this rule (denormalized)"
        default: 0

  - name: CountryPolicyOverride
    parent: PolicyRule
    common_fields: true
    fields:
      - name: policy_rule_id
        type: string
        source: input
        description: "FK -> PolicyRule.id; the rule this country variation refines"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country the override applies to"
        constraints: "exactly 2 uppercase letters; unique per (policy_rule_id, country_code)"
      - name: disposition
        type: enum
        source: input
        description: "Country-level treatment of the rule"
        constraints: "BLOCKED | RESTRICTED_CERT_REQUIRED | ALLOWED_WITH_DISCLAIMER | ALLOWED"
      - name: requires_license
        type: boolean
        source: input
        description: "When true, a Certification with issuing_country_code = country_code is demanded"
        default: false
      - name: requires_disclaimer
        type: boolean
        source: input
        description: "When true, approval in this country demands non-empty disclaimer_text"
        default: false
      - name: severity_multiplier
        type: number
        source: input
        description: "Multiplier applied to base_severity_weight for this country"
        default: 1.00
        constraints: "0.50-3.00, exactly 2 decimals"

  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered business name; copied into PoliticalArchiveEntry.payer_name"
        constraints: "1-200 chars"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of incorporation"
        constraints: "exactly 2 uppercase letters"
      - name: industry_code
        type: string
        source: input
        description: "Self-declared industry code used by industry-authorization verification"
        constraints: "1-40 chars"
      - name: identity_status
        type: enum
        source: system
        description: "Identity verification axis; advanced only by the verifications endpoint"
        default: PENDING
        constraints: "PENDING | VERIFIED | FAILED"
      - name: business_standing_status
        type: enum
        source: system
        description: "Business-standing verification axis; advanced only by the verifications endpoint"
        default: PENDING
        constraints: "PENDING | VERIFIED | FAILED"
      - name: industry_authorization_status
        type: enum
        source: system
        description: "Industry authorization axis for regulated industries"
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING | GRANTED | DENIED"
      - name: political_eligibility_status
        type: enum
        source: system
        description: "Political / social-issue advertising eligibility axis"
        default: NOT_REQUESTED
        constraints: "NOT_REQUESTED | PENDING | ELIGIBLE | INELIGIBLE"
      - name: account_status
        type: enum
        source: computed
        description: "Derived from this advertiser's EnforcementAction rows with status = ACTIVE"
        default: ACTIVE
        constraints: "ACTIVE | WARNED | RESTRICTED | SUSPENDED"
      - name: violation_points_raw
        type: number
        source: computed
        description: "Undecayed sum of ViolationLedgerEntry.delta_points (calculations.advertiser_violation_points variant raw_cumulative)"
        default: 0.00
        constraints: "2 decimals, >= 0.00"
      - name: violation_points_decayed
        type: number
        source: computed
        description: "Age-decayed sum of ViolationLedgerEntry.delta_points (variant decayed_enforcement)"
        default: 0.00
        constraints: "2 decimals, >= 0.00"
      - name: severity_index
        type: number
        source: computed
        description: "Output of calculations.enforcement_severity_index at last evaluation"
        default: 0.00
        constraints: "2 decimals, >= 0.00"
      - name: ledger_entry_count
        type: integer
        source: computed
        description: "Count of ViolationLedgerEntry rows for this advertiser (denormalized)"
        default: 0

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Reviewer display name on notices and audit trails"
        constraints: "1-120 chars"
      - name: queue_specialties
        type: array
        source: input
        description: "Queues this reviewer may claim from"
        constraints: "non-empty array, values from {STANDARD, REGULATED_CERT, POLITICAL}, no duplicates"
      - name: country_authorizations
        type: array
        source: input
        description: "ISO 3166-1 alpha-2 countries this reviewer is authorized to adjudicate"
        constraints: "non-empty array of 2-letter uppercase codes, no duplicates"
      - name: max_concurrent_claims
        type: integer
        source: input
        description: "Ceiling on ReviewTask rows this reviewer may hold in status CLAIMED"
        default: 3
        constraints: "1-10"
      - name: claimed_task_count
        type: integer
        source: computed
        description: "Count of ReviewTask rows with assigned_reviewer_id = this id AND status = CLAIMED"
        default: 0
      - name: status
        type: enum
        source: input
        description: "Reviewer availability"
        default: ACTIVE
        constraints: "ACTIVE | OFFLINE"

  - name: AdCreative
    parent: null
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; owning advertiser"
      - name: headline
        type: string
        source: input
        description: "Ad headline text screened by the classifier"
        constraints: "1-200 chars"
      - name: body_text
        type: string
        source: input
        description: "Ad body text screened by the classifier"
        constraints: "1-2000 chars"
      - name: declared_category_codes
        type: array
        source: input
        description: "PolicyRule.code values the advertiser self-declares"
        constraints: "non-empty array; every element must match an existing PolicyRule.code"
      - name: target_country_codes
        type: array
        source: input
        description: "ISO 3166-1 alpha-2 countries the creative is meant to serve in"
        constraints: "non-empty array of 2-letter uppercase codes, no duplicates"
      - name: landing_page_url
        type: string
        source: input
        description: "Destination URL the click resolves to"
        constraints: "must start with https:// and contain a host segment"
      - name: display_url
        type: string
        source: input
        description: "URL shown in the ad; its host is the mismatch reference host"
        constraints: "must start with https:// and contain a host segment"
      - name: political_flag
        type: boolean
        source: input
        description: "Advertiser-declared political / social-issue advertising flag"
        default: false
      - name: disclaimer_text
        type: string
        source: input
        description: "Paid-for-by disclosure text; required to approve political or disclaimer-bearing rules"
        default: null
        constraints: "null or 1-300 chars"
      - name: review_status
        type: enum
        source: system
        description: "Policy-review axis of the creative lifecycle"
        default: DRAFT
        constraints: "DRAFT | SCREENING | AUTO_APPROVED | PENDING_MANUAL_REVIEW | APPROVED_LIMITED | DISAPPROVED | SUSPENDED_HOLD | WITHDRAWN"
      - name: destination_status
        type: enum
        source: system
        description: "Landing-page / destination axis of the creative lifecycle, advanced independently of review_status"
        default: NOT_CHECKED
        constraints: "NOT_CHECKED | DESTINATION_PENDING | DESTINATION_CLEARED | MISMATCH_FLAGGED | CLOAKING_CONFIRMED"
      - name: risk_score_provisional
        type: number
        source: computed
        description: "calculations.creative_risk_score variant provisional_screening"
        default: 0.00
        constraints: "0.00-100.00, 2 decimals"
      - name: risk_score_final
        type: number
        source: computed
        description: "calculations.creative_risk_score variant post_destination_final"
        default: 0.00
        constraints: "0.00-100.00, 2 decimals"
      - name: serving_eligible
        type: boolean
        source: computed
        description: "Derived gate over both state axes plus advertiser posture (calculations.serving_eligibility_gate)"
        default: false
      - name: blocking_reason_codes
        type: array
        source: computed
        description: "Ordered failed conjuncts of calculations.serving_eligibility_gate"
        default: []
      - name: limited_country_codes
        type: array
        source: system
        description: "Countries the creative may serve in after an APPROVE_WITH_LIMITS resolution"
        default: []
      - name: approved_under_certification_id
        type: string
        source: system
        description: "FK -> Certification.id; certification relied on by APPROVE_WITH_LIMITS; null otherwise"
        default: null
      - name: screening_run_count
        type: integer
        source: computed
        description: "Count of ScreeningRun rows for this creative (denormalized)"
        default: 0

  - name: ScreeningRun
    parent: null
    common_fields: false
    fields:
      - name: ad_creative_id
        type: string
        source: input
        description: "FK -> AdCreative.id; creative that was screened"
      - name: classifier_version
        type: string
        source: input
        description: "Classifier build identifier recorded for audit"
        constraints: "1-40 chars"
      - name: sequence_index
        type: integer
        source: system
        description: "1-based run counter per creative; the highest value is the latest run"
        constraints: ">= 1, contiguous per ad_creative_id"
      - name: outcome
        type: enum
        source: computed
        description: "Run verdict from calculations.screening_disposition"
        constraints: "AUTO_APPROVED | ROUTED_MANUAL | AUTO_DISAPPROVED"
      - name: decision_count
        type: integer
        source: computed
        description: "Count of ClassifierDecision rows created by this run"
      - name: max_confidence
        type: number
        source: computed
        description: "Highest ClassifierDecision.confidence in this run; 0.00 when the run has no decisions"
        default: 0.00
        constraints: "0.00-1.00, 2 decimals"
      - name: provisional_risk_score
        type: number
        source: computed
        description: "Snapshot of calculations.creative_risk_score variant provisional_screening at run time"
        default: 0.00
        constraints: "0.00-100.00, 2 decimals"
      - name: creative_version_at_run
        type: integer
        source: system
        description: "AdCreative.version observed when the run was accepted"

  - name: ClassifierDecision
    parent: ScreeningRun
    common_fields: false
    fields:
      - name: screening_run_id
        type: string
        source: system
        description: "FK -> ScreeningRun.id; run that emitted this decision"
      - name: policy_rule_id
        type: string
        source: input
        description: "FK -> PolicyRule.id; rule the classifier matched"
      - name: confidence
        type: number
        source: input
        description: "Classifier confidence for this rule match"
        constraints: "0.01-1.00, exactly 2 decimals"
      - name: matched_snippet
        type: string
        source: input
        description: "Creative text fragment that triggered the match"
        constraints: "1-300 chars"
      - name: disposition
        type: enum
        source: computed
        description: "Per-decision verdict from calculations.screening_disposition step 1"
        constraints: "AUTO_DISAPPROVE | ROUTE_MANUAL | BELOW_THRESHOLD"
      - name: country_multiplier_applied
        type: number
        source: computed
        description: "country_multiplier(rule, creative) used for this decision"
        constraints: "0.50-3.00, 2 decimals"
      - name: assessed_points
        type: number
        source: computed
        description: "round(rule.base_severity_weight * country_multiplier_applied * confidence, 2) for this decision"
        constraints: "2 decimals, >= 0.00"

  - name: ReviewTask
    parent: null
    common_fields: true
    fields:
      - name: ad_creative_id
        type: string
        source: system
        description: "FK -> AdCreative.id; creative awaiting human review"
      - name: primary_policy_rule_id
        type: string
        source: system
        description: "FK -> PolicyRule.id; highest-confidence matched rule; null when the creative routed with no qualifying finding"
        default: null
      - name: assigned_reviewer_id
        type: string
        source: system
        description: "FK -> Reviewer.id; reviewer holding the task; null while QUEUED, ESCALATED, EXPIRED or after release"
        default: null
      - name: queue
        type: enum
        source: system
        description: "Queue the task was routed into"
        constraints: "STANDARD | REGULATED_CERT | POLITICAL"
      - name: status
        type: enum
        source: system
        description: "Task lifecycle state"
        default: QUEUED
        constraints: "QUEUED | CLAIMED | RESOLVED | ESCALATED | EXPIRED"
      - name: resolution
        type: enum
        source: system
        description: "Reviewer verdict recorded on the task"
        default: PENDING
        constraints: "PENDING | APPROVE | APPROVE_WITH_LIMITS | DISAPPROVE | ESCALATE"
      - name: priority_score
        type: number
        source: computed
        description: "Output of calculations.review_task_priority_score at task creation"
        default: 0.00
        constraints: "0.00-100.00, 2 decimals"
      - name: sla_deadline_at
        type: datetime
        source: computed
        description: "created_at + primary rule review_sla_hours (DEFAULT_SLA_HOURS when primary_policy_rule_id is null)"
      - name: cycle_count
        type: integer
        source: system
        description: "Number of times this task has been re-queued after escalation or SLA expiry"
        default: 0
      - name: claimed_at
        type: datetime
        source: system
        description: "Logical clock at the last successful claim; null while never claimed"
        default: null
      - name: escalation_note
        type: string
        source: system
        description: "Note recorded by the ESCALATE resolution; null otherwise"
        default: null

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; holder of the license"
      - name: policy_rule_id
        type: string
        source: input
        description: "FK -> PolicyRule.id; rule this license certifies against"
      - name: license_number
        type: string
        source: input
        description: "Issuing authority license identifier"
        constraints: "1-60 chars"
      - name: issuing_country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country whose authority issued the license"
        constraints: "exactly 2 uppercase letters"
      - name: valid_from
        type: datetime
        source: input
        description: "Inclusive start of the validity interval"
      - name: valid_until
        type: datetime
        source: input
        description: "Exclusive end of the validity interval (half-open [valid_from, valid_until))"
        constraints: "must be strictly after valid_from"
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | ACTIVE | EXPIRED | REVOKED"
      - name: revocation_reason
        type: string
        source: system
        description: "Reason recorded by the revoke endpoint; null otherwise"
        default: null

  - name: DestinationCheck
    parent: AdCreative
    common_fields: false
    fields:
      - name: ad_creative_id
        type: string
        source: input
        description: "FK -> AdCreative.id; creative whose destination was fetched"
      - name: check_type
        type: enum
        source: input
        description: "Whether this is the first pass or a later re-check"
        constraints: "INITIAL | RECHECK"
      - name: user_agent_variant
        type: enum
        source: input
        description: "Which crawler identity performed the fetch; CRAWLER vs USER divergence is the cloaking signal"
        constraints: "CRAWLER | USER"
      - name: fetched_final_url
        type: string
        source: input
        description: "URL the fetch finally resolved to after redirects"
        constraints: "must start with https:// and contain a host segment"
      - name: fetched_content_category
        type: string
        source: input
        description: "PolicyRule.code classified from the fetched page, or the literal GENERAL"
        constraints: "1-40 chars"
      - name: http_status
        type: integer
        source: input
        description: "HTTP status of the final response"
        constraints: "100-599"
      - name: result
        type: enum
        source: computed
        description: "Verdict from calculations.destination_check_result"
        constraints: "CLEARED | MISMATCH | CLOAKING"
      - name: mismatch_detail
        type: string
        source: computed
        description: "Which clause produced a non-CLEARED result; null when CLEARED"
        default: null
        constraints: "null | DEST_UNREACHABLE | HOST_MISMATCH | CATEGORY_MISMATCH | UA_DIVERGENCE"

  - name: DisapprovalNotice
    parent: null
    common_fields: true
    fields:
      - name: ad_creative_id
        type: string
        source: system
        description: "FK -> AdCreative.id; disapproved creative"
      - name: decided_by_reviewer_id
        type: string
        source: system
        description: "FK -> Reviewer.id; reviewer who disapproved; null for system-issued notices"
        default: null
      - name: reason_codes
        type: array
        source: system
        description: "Reason codes carried on the notice"
        constraints: "non-empty; values from {AUTO_SCREENING, MANUAL_REVIEW, DESTINATION_MISMATCH, CLOAKING, CERT_MISSING, POLITICAL_DISCLOSURE}; no duplicates"
      - name: policy_rule_codes
        type: array
        source: system
        description: "PolicyRule.code values of the findings carried into the notice, sorted ascending"
        default: []
      - name: assessment_lines
        type: array
        source: computed
        description: "Ordered line items from calculations.disapproval_points_assessment; each element { policy_rule_code, reason_code, line_points }"
        default: []
      - name: assessed_points
        type: number
        source: computed
        description: "Sum of assessment_lines[].line_points, capped at 100.00"
        default: 0.00
        constraints: "0.00-100.00, 2 decimals"
      - name: disclosed_points_total
        type: number
        source: computed
        description: "Advertiser.violation_points_raw immediately after this notice's ledger entry landed"
        default: 0.00
        constraints: "2 decimals"
      - name: appeal_window_hours
        type: integer
        source: computed
        description: "APPEAL_WINDOW_HOURS_POLITICAL when political_at_issue else APPEAL_WINDOW_HOURS_STANDARD"
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "created_at + appeal_window_hours; appeals are accepted strictly before this instant"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle state"
        default: ISSUED
        constraints: "ISSUED | APPEALED | APPEAL_GRANTED | APPEAL_UPHELD | EXPIRED"
      - name: political_at_issue
        type: boolean
        source: system
        description: "Snapshot of AdCreative.political_flag when the notice was issued"
        default: false

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: disapproval_notice_id
        type: string
        source: input
        description: "FK -> DisapprovalNotice.id; notice being appealed"
      - name: evidence_certification_id
        type: string
        source: input
        description: "FK -> Certification.id; certification offered as evidence; null when none"
        default: null
      - name: decided_by_reviewer_id
        type: string
        source: system
        description: "FK -> Reviewer.id; reviewer who decided the appeal; null while SUBMITTED"
        default: null
      - name: justification
        type: string
        source: input
        description: "Advertiser's written appeal justification"
        constraints: "10-2000 chars"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle state"
        default: SUBMITTED
        constraints: "SUBMITTED | GRANTED | DENIED"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical clock when the appeal was decided; null while SUBMITTED"
        default: null
      - name: reinstated_review_status
        type: string
        source: system
        description: "AdCreative.review_status written by a GRANTED outcome; null otherwise"
        default: null

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; account under enforcement"
      - name: prior_action_id
        type: string
        source: input
        description: "FK -> EnforcementAction.id; action this one supersedes; null for the first action on the account"
        default: null
      - name: source_notice_id
        type: string
        source: system
        description: "FK -> DisapprovalNotice.id; notice whose ledger entry triggered this action; null for manual actions"
        default: null
      - name: action_type
        type: enum
        source: input
        description: "Enforcement severity applied to the account"
        constraints: "WARNING | RESTRICTION | SUSPENSION"
      - name: origin
        type: enum
        source: system
        description: "Whether the action was raised by cascade or minted by an operator"
        constraints: "SYSTEM_CASCADE | MANUAL"
      - name: trigger_reason
        type: string
        source: input
        description: "Free-text reason recorded on the action"
        constraints: "1-300 chars"
      - name: severity_index_at_issue
        type: number
        source: computed
        description: "calculations.enforcement_severity_index output at the moment the action was created"
        default: 0.00
        constraints: "2 decimals"
      - name: effective_from
        type: datetime
        source: system
        description: "Logical clock when the action was created"
      - name: effective_until
        type: datetime
        source: input
        description: "End of the action window; defaults to effective_from + ENFORCEMENT_DURATION_DAYS[action_type]"
      - name: status
        type: enum
        source: system
        description: "Action lifecycle state"
        default: ACTIVE
        constraints: "ACTIVE | LIFTED | SUPERSEDED | EXPIRED"

  - name: PoliticalArchiveEntry
    parent: null
    common_fields: false
    fields:
      - name: ad_creative_id
        type: string
        source: system
        description: "FK -> AdCreative.id; archived political creative"
      - name: advertiser_id
        type: string
        source: system
        description: "FK -> Advertiser.id; payer of record"
      - name: disclosure_text
        type: string
        source: system
        description: "Snapshot of AdCreative.disclaimer_text at approval"
      - name: payer_name
        type: string
        source: system
        description: "Snapshot of Advertiser.legal_name at approval"
      - name: headline_snapshot
        type: string
        source: system
        description: "Snapshot of AdCreative.headline at approval"
      - name: target_country_codes_snapshot
        type: array
        source: system
        description: "Snapshot of the countries the creative was cleared for at approval"
      - name: archived_at
        type: datetime
        source: system
        description: "Logical clock when the entry was written"
      - name: retention_until
        type: datetime
        source: system
        description: "archived_at + ARCHIVE_RETENTION_DAYS; entries are never deleted before this instant"
      - name: searchable
        type: boolean
        source: system
        description: "Archive entries stay searchable after withdrawal or disapproval of the creative"
        default: true

  - name: ViolationLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: advertiser_id
        type: string
        source: system
        description: "FK -> Advertiser.id; account whose points balance moved"
      - name: source_notice_id
        type: string
        source: system
        description: "FK -> DisapprovalNotice.id; notice that produced this delta"
      - name: delta_points
        type: number
        source: system
        description: "Signed points movement; positive on assessment, negative on appeal reversal"
        constraints: "2 decimals, non-zero"
      - name: reason
        type: enum
        source: system
        description: "Why the delta was written"
        constraints: "DISAPPROVAL_ASSESSED | APPEAL_REVERSAL"
      - name: balance_after
        type: number
        source: system
        description: "Advertiser.violation_points_raw immediately after applying this delta"
        constraints: "2 decimals, >= 0.00"
      - name: entry_index
        type: integer
        source: system
        description: "1-based per-advertiser insertion counter; defines chronological replay order"
        constraints: ">= 1, contiguous per advertiser_id"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
# AdCreative carries TWO independent state dimensions on the same row:
#   review_status      — advanced by submit / screening / review decisions / appeals / enforcement
#   destination_status — advanced by destination checks and by appeal reinstatement
# They advance on different triggers and are read together by
# calculations.serving_eligibility_gate.
state_machines:
  - entity: AdCreative
    dimension: review_status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SCREENING
        trigger: "POST /ad-policy/ad-creatives/{id}/submit"
        actor: Advertiser
        preconditions:
          - "review_status == DRAFT"
          - "acting X-User-ID == AdCreative.advertiser_id"
          - "Advertiser.account_status != SUSPENDED"
          - "every element of declared_category_codes resolves to an existing PolicyRule.code"
        side_effects:
          - "sets destination_status to DESTINATION_PENDING when destination_status == NOT_CHECKED"
          - "increments AdCreative.version by 1 and refreshes updated_at"
        note: "Screening itself is driven by the separate screening-runs endpoint."

      - from: SCREENING
        to: AUTO_APPROVED
        trigger: "POST /ad-policy/ad-creatives/{id}/screening-runs when calculations.screening_disposition yields outcome AUTO_APPROVED"
        actor: PolicyAdmin
        preconditions:
          - "review_status == SCREENING"
          - "expected_ad_creative_version == AdCreative.version"
          - "Advertiser.identity_status == VERIFIED AND Advertiser.business_standing_status == VERIFIED"
          - "political_flag == false"
          - "no ClassifierDecision in this run has disposition in {AUTO_DISAPPROVE, ROUTE_MANUAL}"
        side_effects:
          - "writes risk_score_provisional and risk_score_final from calculations.creative_risk_score"
          - "recomputes serving_eligible and blocking_reason_codes"
          - "when political_flag == true this transition is unreachable; see SCREENING -> PENDING_MANUAL_REVIEW"
          - "increments AdCreative.version by 1"

      - from: SCREENING
        to: PENDING_MANUAL_REVIEW
        trigger: "POST /ad-policy/ad-creatives/{id}/screening-runs when calculations.screening_disposition yields outcome ROUTED_MANUAL"
        actor: PolicyAdmin
        preconditions:
          - "review_status == SCREENING"
          - "expected_ad_creative_version == AdCreative.version"
        side_effects:
          - "creates one ReviewTask in status QUEUED with queue, primary_policy_rule_id, priority_score and sla_deadline_at per calculations.screening_disposition step 3 and calculations.review_task_priority_score"
          - "writes risk_score_provisional and risk_score_final from calculations.creative_risk_score"
          - "increments AdCreative.version by 1"

      - from: SCREENING
        to: DISAPPROVED
        trigger: "POST /ad-policy/ad-creatives/{id}/screening-runs when calculations.screening_disposition yields outcome AUTO_DISAPPROVED"
        actor: PolicyAdmin
        preconditions:
          - "review_status == SCREENING"
          - "expected_ad_creative_version == AdCreative.version"
          - "at least one ClassifierDecision has disposition AUTO_DISAPPROVE AND its strictest country disposition == BLOCKED"
        side_effects:
          - "cascade hop 1: creates a DisapprovalNotice in status ISSUED with decided_by_reviewer_id = null and reason_codes = [AUTO_SCREENING]"
          - "cascade hop 2: that notice creation writes a ViolationLedgerEntry (reason DISAPPROVAL_ASSESSED, delta_points = notice.assessed_points)"
          - "cascade hop 3: that ledger entry recomputes Advertiser.violation_points_raw, violation_points_decayed and severity_index"
          - "cascade hop 4: the recomputed severity_index may create an EnforcementAction (see EnforcementAction machine) which re-derives Advertiser.account_status"
          - "writes risk_score_provisional and risk_score_final; recomputes serving_eligible"
          - "increments AdCreative.version by 1"

      - from: PENDING_MANUAL_REVIEW
        to: AUTO_APPROVED
        trigger: "POST /ad-policy/review-tasks/{id}/decision with resolution APPROVE"
        actor: PolicyReviewer
        preconditions:
          - "ReviewTask.status == CLAIMED AND ReviewTask.assigned_reviewer_id == acting X-User-ID"
          - "review_status == PENDING_MANUAL_REVIEW"
          - "when political_flag == true: disclaimer_text is non-empty AND Advertiser.political_eligibility_status == ELIGIBLE"
          - "when any matched PolicyRule.requires_disclaimer == true or any applicable CountryPolicyOverride.requires_disclaimer == true: disclaimer_text is non-empty"
        side_effects:
          - "ReviewTask.status -> RESOLVED with resolution APPROVE; Reviewer.claimed_task_count decremented by 1"
          - "when political_flag == true: creates one PoliticalArchiveEntry (append-only)"
          - "recomputes risk_score_final, serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"

      - from: PENDING_MANUAL_REVIEW
        to: APPROVED_LIMITED
        trigger: "POST /ad-policy/review-tasks/{id}/decision with resolution APPROVE_WITH_LIMITS"
        actor: PolicyReviewer
        preconditions:
          - "ReviewTask.status == CLAIMED AND ReviewTask.assigned_reviewer_id == acting X-User-ID"
          - "review_status == PENDING_MANUAL_REVIEW"
          - "limited_country_codes is a non-empty subset of target_country_codes and contains no country whose strictest disposition == BLOCKED"
          - "calculations.certification_coverage returns a non-empty candidate set for every country in limited_country_codes that demands a license"
          - "when political_flag == true: disclaimer_text is non-empty AND Advertiser.political_eligibility_status == ELIGIBLE"
        side_effects:
          - "writes AdCreative.limited_country_codes from the request, sorted ascending"
          - "writes approved_under_certification_id from calculations.certification_coverage selection"
          - "ReviewTask.status -> RESOLVED with resolution APPROVE_WITH_LIMITS; Reviewer.claimed_task_count decremented by 1"
          - "when political_flag == true: creates one PoliticalArchiveEntry"
          - "recomputes risk_score_final, serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"

      - from: PENDING_MANUAL_REVIEW
        to: DISAPPROVED
        trigger: "POST /ad-policy/review-tasks/{id}/decision with resolution DISAPPROVE"
        actor: PolicyReviewer
        preconditions:
          - "ReviewTask.status == CLAIMED AND ReviewTask.assigned_reviewer_id == acting X-User-ID"
          - "review_status == PENDING_MANUAL_REVIEW"
          - "every supplied reason_code is consistent with current state per validations[priority=86]"
        side_effects:
          - "cascade hop 1: ReviewTask.status -> RESOLVED with resolution DISAPPROVE; Reviewer.claimed_task_count decremented by 1"
          - "cascade hop 2: creates a DisapprovalNotice in status ISSUED with decided_by_reviewer_id = acting reviewer and the supplied reason_codes"
          - "cascade hop 3: the notice writes a ViolationLedgerEntry (reason DISAPPROVAL_ASSESSED, delta_points = notice.assessed_points, balance_after = new raw balance)"
          - "cascade hop 4: the ledger entry recomputes Advertiser.violation_points_raw, violation_points_decayed and severity_index"
          - "cascade hop 5: the recomputed severity_index may create an EnforcementAction, supersede the prior ACTIVE action, and re-derive Advertiser.account_status"
          - "cascade hop 6: an account_status of SUSPENDED sweeps sibling creatives to SUSPENDED_HOLD, which expires their QUEUED/CLAIMED ReviewTasks and decrements the holding Reviewers' claimed_task_count"
          - "increments AdCreative.version by 1"

      - from: PENDING_MANUAL_REVIEW
        to: PENDING_MANUAL_REVIEW
        trigger: "POST /ad-policy/review-tasks/{id}/decision with resolution ESCALATE"
        actor: PolicyReviewer
        preconditions:
          - "ReviewTask.status == CLAIMED AND ReviewTask.assigned_reviewer_id == acting X-User-ID"
        side_effects:
          - "ReviewTask.status -> ESCALATED, assigned_reviewer_id -> null, escalation_note written; Reviewer.claimed_task_count decremented by 1"
          - "AdCreative fields are unchanged; version is NOT incremented"
        note: "The creative holds its review_status while the task cycles."

      - from: AUTO_APPROVED
        to: PENDING_MANUAL_REVIEW
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result MISMATCH, or POST /ad-policy/_policy-sweeps/run expiring the relied-on Certification"
        actor: IntegrityAnalyst | system
        preconditions:
          - "review_status in {AUTO_APPROVED, APPROVED_LIMITED}"
        side_effects:
          - "creates one ReviewTask in status QUEUED, queue STANDARD for a destination mismatch and REGULATED_CERT for a certification expiry, cycle_count 0"
          - "clears approved_under_certification_id on a certification-expiry re-route"
          - "recomputes serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"

      - from: APPROVED_LIMITED
        to: PENDING_MANUAL_REVIEW
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result MISMATCH, POST /ad-policy/certifications/{id}/revoke, or POST /ad-policy/_policy-sweeps/run expiring the relied-on Certification"
        actor: IntegrityAnalyst | PolicyAdmin | system
        preconditions:
          - "review_status == APPROVED_LIMITED"
        side_effects:
          - "creates one ReviewTask in status QUEUED (queue REGULATED_CERT for certification loss, STANDARD for destination mismatch)"
          - "clears approved_under_certification_id and limited_country_codes on certification loss"
          - "recomputes serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"

      - from: AUTO_APPROVED
        to: DISAPPROVED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result CLOAKING"
        actor: IntegrityAnalyst
        preconditions:
          - "review_status in {AUTO_APPROVED, APPROVED_LIMITED, PENDING_MANUAL_REVIEW}"
        side_effects:
          - "cascade hop 1: destination_status -> CLOAKING_CONFIRMED"
          - "cascade hop 2: that destination_status write forces review_status -> DISAPPROVED and creates a DisapprovalNotice with reason_codes = [CLOAKING], decided_by_reviewer_id = null"
          - "cascade hop 3: the notice writes a ViolationLedgerEntry (reason DISAPPROVAL_ASSESSED)"
          - "cascade hop 4: the ledger entry recomputes Advertiser.violation_points_raw / violation_points_decayed / severity_index"
          - "cascade hop 5: the recomputed severity_index may create an EnforcementAction and re-derive Advertiser.account_status"
          - "expires any QUEUED or CLAIMED ReviewTask on this creative and decrements the holding Reviewer's claimed_task_count"
          - "increments AdCreative.version by 1"

      - from: APPROVED_LIMITED
        to: DISAPPROVED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result CLOAKING"
        actor: IntegrityAnalyst
        preconditions:
          - "review_status == APPROVED_LIMITED"
        side_effects:
          - "identical cascade to AUTO_APPROVED -> DISAPPROVED"
          - "increments AdCreative.version by 1"

      - from: DISAPPROVED
        to: PENDING_MANUAL_REVIEW
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome GRANTED"
        actor: PolicyReviewer
        preconditions:
          - "review_status == DISAPPROVED"
          - "Appeal.status == SUBMITTED and its DisapprovalNotice.status == APPEALED"
          - "acting reviewer id != DisapprovalNotice.decided_by_reviewer_id"
        side_effects:
          - "cascade hop 1: Appeal.status -> GRANTED, DisapprovalNotice.status -> APPEAL_GRANTED"
          - "cascade hop 2: creates a compensating ViolationLedgerEntry (reason APPEAL_REVERSAL, delta_points = -1 * notice.assessed_points)"
          - "cascade hop 3: the reversal recomputes Advertiser.violation_points_raw / violation_points_decayed / severity_index"
          - "cascade hop 4: any ACTIVE EnforcementAction whose action_type threshold now exceeds severity_index moves to LIFTED, re-deriving Advertiser.account_status"
          - "destination_status is reset to DESTINATION_PENDING when it was MISMATCH_FLAGGED or CLOAKING_CONFIRMED"
          - "creates one ReviewTask in status QUEUED with cycle_count 0, copying queue and primary_policy_rule_id from the creative's most recently created ReviewTask whatever its status (ranked created_at DESC), or defaulting to queue STANDARD with primary_policy_rule_id null when the creative has no ReviewTask at all; sla_deadline_at = logical clock + the primary rule's review_sla_hours (DEFAULT_SLA_HOURS when primary_policy_rule_id is null) and priority_score from calculations.review_task_priority_score"
          - "writes Appeal.reinstated_review_status = PENDING_MANUAL_REVIEW"
          - "increments AdCreative.version by 1"

      - from: DISAPPROVED
        to: DRAFT
        trigger: "PATCH /ad-policy/ad-creatives/{id}"
        actor: Advertiser
        preconditions:
          - "review_status in {DRAFT, DISAPPROVED}"
          - "acting X-User-ID == AdCreative.advertiser_id"
          - "Advertiser.account_status != SUSPENDED"
        side_effects:
          - "resets destination_status to NOT_CHECKED, risk_score_provisional and risk_score_final to 0.00, limited_country_codes to [] and approved_under_certification_id to null"
          - "expires any QUEUED ReviewTask on this creative"
          - "increments AdCreative.version by 1"
        note: "Revision loop: a disapproved creative can be edited back to DRAFT and re-submitted, so review_status is cyclic as well as two-dimensional."

      - from: PENDING_MANUAL_REVIEW
        to: SUSPENDED_HOLD
        trigger: "system cascade from EnforcementAction creation with action_type SUSPENSION"
        actor: system
        preconditions:
          - "Advertiser.account_status transitioned to SUSPENDED"
          - "review_status in {SCREENING, AUTO_APPROVED, PENDING_MANUAL_REVIEW, APPROVED_LIMITED}"
        side_effects:
          - "expires every QUEUED or CLAIMED ReviewTask on this creative and decrements each holding Reviewer's claimed_task_count"
          - "recomputes serving_eligible to false with blocking_reason_codes including ACCOUNT_ENFORCEMENT"
          - "increments AdCreative.version by 1"

      - from: SUSPENDED_HOLD
        to: PENDING_MANUAL_REVIEW
        trigger: "POST /ad-policy/_policy-sweeps/run after every SUSPENSION on the advertiser has left status ACTIVE"
        actor: system
        preconditions:
          - "Advertiser.account_status != SUSPENDED"
          - "review_status == SUSPENDED_HOLD"
        side_effects:
          - "creates one ReviewTask in status QUEUED with cycle_count 0, copying queue and primary_policy_rule_id from this creative's most recently created ReviewTask whatever its status (ranked created_at DESC), or defaulting to queue STANDARD with primary_policy_rule_id null when the creative has no ReviewTask at all"
          - "sets the new task's sla_deadline_at to the logical clock plus the primary rule's review_sla_hours, or plus DEFAULT_SLA_HOURS when primary_policy_rule_id is null, and scores priority_score with calculations.review_task_priority_score"
          - "increments AdCreative.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ad-policy/ad-creatives/{id}/withdraw"
        actor: Advertiser
        preconditions:
          - "review_status in {DRAFT, SCREENING, PENDING_MANUAL_REVIEW, AUTO_APPROVED, APPROVED_LIMITED, DISAPPROVED, SUSPENDED_HOLD}"
          - "acting X-User-ID == AdCreative.advertiser_id"
        side_effects:
          - "expires every QUEUED or CLAIMED ReviewTask on this creative and decrements each holding Reviewer's claimed_task_count"
          - "any PoliticalArchiveEntry already written stays with searchable = true"
          - "recomputes serving_eligible to false"
          - "increments AdCreative.version by 1"
        note: "WITHDRAWN is terminal for review_status; the same transition exists from every non-terminal review_status."

  - entity: AdCreative
    dimension: destination_status
    initial_state: NOT_CHECKED
    terminal_states: []
    transitions:
      - from: NOT_CHECKED
        to: DESTINATION_PENDING
        trigger: "POST /ad-policy/ad-creatives/{id}/submit"
        actor: Advertiser
        preconditions:
          - "destination_status == NOT_CHECKED"
        side_effects:
          - "no other field changes on this axis"

      - from: DESTINATION_PENDING
        to: DESTINATION_CLEARED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result CLEARED"
        actor: IntegrityAnalyst
        preconditions:
          - "review_status not in {DRAFT, WITHDRAWN}"
        side_effects:
          - "recomputes risk_score_final (destination_penalty 0.00), serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"

      - from: DESTINATION_PENDING
        to: MISMATCH_FLAGGED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result MISMATCH"
        actor: IntegrityAnalyst
        preconditions:
          - "review_status not in {DRAFT, WITHDRAWN}"
        side_effects:
          - "recomputes risk_score_final with destination_penalty DESTINATION_PENALTY_MISMATCH"
          - "re-routes review_status to PENDING_MANUAL_REVIEW only when review_status was AUTO_APPROVED or APPROVED_LIMITED"
          - "increments AdCreative.version by 1"

      - from: DESTINATION_CLEARED
        to: CLOAKING_CONFIRMED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result CLOAKING"
        actor: IntegrityAnalyst
        preconditions:
          - "review_status not in {DRAFT, WITHDRAWN}"
          - "a prior DestinationCheck with user_agent_variant CRAWLER exists on this creative"
        side_effects:
          - "recomputes risk_score_final with destination_penalty DESTINATION_PENALTY_CLOAKING"
          - "forces review_status -> DISAPPROVED and runs that transition's cascade"
          - "increments AdCreative.version by 1"

      - from: MISMATCH_FLAGGED
        to: DESTINATION_CLEARED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks with check_type RECHECK yielding result CLEARED"
        actor: IntegrityAnalyst
        preconditions:
          - "destination_status == MISMATCH_FLAGGED"
        side_effects:
          - "recomputes risk_score_final, serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"
        note: "Destination axis is cyclic: MISMATCH_FLAGGED -> DESTINATION_CLEARED -> MISMATCH_FLAGGED is legal, while review_status is untouched."

      - from: DESTINATION_CLEARED
        to: MISMATCH_FLAGGED
        trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks yielding result MISMATCH"
        actor: IntegrityAnalyst
        preconditions:
          - "review_status not in {DRAFT, WITHDRAWN}"
        side_effects:
          - "recomputes risk_score_final with destination_penalty DESTINATION_PENALTY_MISMATCH"
          - "recomputes serving_eligible and blocking_reason_codes"
          - "increments AdCreative.version by 1"
        note: "Closes the destination cycle: a destination that was cleared can be caught mismatching later. The review axis is moved only by the AUTO_APPROVED / APPROVED_LIMITED -> PENDING_MANUAL_REVIEW transition; a creative already in PENDING_MANUAL_REVIEW keeps its existing ReviewTask."

      - from: CLOAKING_CONFIRMED
        to: DESTINATION_PENDING
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome GRANTED"
        actor: PolicyReviewer
        preconditions:
          - "destination_status in {MISMATCH_FLAGGED, CLOAKING_CONFIRMED}"
        side_effects:
          - "recomputes risk_score_final with destination_penalty 0.00"
          - "increments AdCreative.version by 1"

  - entity: ReviewTask
    dimension: status
    initial_state: QUEUED
    terminal_states: [RESOLVED, EXPIRED]
    transitions:
      - from: QUEUED
        to: CLAIMED
        trigger: "POST /ad-policy/review-tasks/{id}/claim"
        actor: PolicyReviewer
        preconditions:
          - "status == QUEUED"
          - "Reviewer.status == ACTIVE"
          - "ReviewTask.queue is an element of Reviewer.queue_specialties"
          - "every element of AdCreative.target_country_codes is an element of Reviewer.country_authorizations"
          - "Reviewer.claimed_task_count < Reviewer.max_concurrent_claims"
        side_effects:
          - "writes assigned_reviewer_id = acting X-User-ID and claimed_at = logical clock"
          - "increments Reviewer.claimed_task_count by 1 and Reviewer.version by 1"
          - "increments ReviewTask.version by 1"

      - from: CLAIMED
        to: QUEUED
        trigger: "POST /ad-policy/review-tasks/{id}/release"
        actor: PolicyReviewer
        preconditions:
          - "status == CLAIMED"
          - "assigned_reviewer_id == acting X-User-ID"
        side_effects:
          - "clears assigned_reviewer_id and claimed_at"
          - "decrements Reviewer.claimed_task_count by 1 and increments Reviewer.version by 1"
          - "priority_score and sla_deadline_at are NOT recomputed"
          - "increments ReviewTask.version by 1"
        note: "Release is the compensating action for claim; the pair conserves Reviewer.claimed_task_count."

      - from: CLAIMED
        to: RESOLVED
        trigger: "POST /ad-policy/review-tasks/{id}/decision with resolution in {APPROVE, APPROVE_WITH_LIMITS, DISAPPROVE}"
        actor: PolicyReviewer
        preconditions:
          - "status == CLAIMED"
          - "assigned_reviewer_id == acting X-User-ID"
          - "AdCreative.review_status == PENDING_MANUAL_REVIEW"
        side_effects:
          - "writes resolution from the request"
          - "decrements Reviewer.claimed_task_count by 1 and increments Reviewer.version by 1"
          - "drives the matching AdCreative.review_status transition and its cascade"
          - "increments ReviewTask.version by 1"

      - from: CLAIMED
        to: ESCALATED
        trigger: "POST /ad-policy/review-tasks/{id}/decision with resolution ESCALATE"
        actor: PolicyReviewer
        preconditions:
          - "status == CLAIMED"
          - "assigned_reviewer_id == acting X-User-ID"
        side_effects:
          - "writes resolution ESCALATE and escalation_note; clears assigned_reviewer_id and claimed_at"
          - "decrements Reviewer.claimed_task_count by 1 and increments Reviewer.version by 1"
          - "AdCreative is untouched"
          - "increments ReviewTask.version by 1"

      - from: ESCALATED
        to: QUEUED
        trigger: "POST /ad-policy/review-tasks/{id}/requeue"
        actor: PolicyAdmin
        preconditions:
          - "status == ESCALATED"
          - "AdCreative.review_status == PENDING_MANUAL_REVIEW"
        side_effects:
          - "increments cycle_count by 1, resets resolution to PENDING"
          - "recomputes priority_score from calculations.review_task_priority_score against current advertiser state"
          - "recomputes sla_deadline_at = logical clock + review_sla_hours"
          - "increments ReviewTask.version by 1"
        note: "Cycle: QUEUED -> CLAIMED -> ESCALATED -> QUEUED. cycle_count is the loop counter and is never reset."

      - from: QUEUED
        to: EXPIRED
        trigger: "POST /ad-policy/_policy-sweeps/run when sla_deadline_at <= logical clock, or a cascade from creative withdrawal / suspension / PATCH"
        actor: system
        preconditions:
          - "status in {QUEUED, CLAIMED}"
        side_effects:
          - "clears assigned_reviewer_id; when the task was CLAIMED, decrements the holding Reviewer.claimed_task_count by 1"
          - "on an SLA sweep expiry only: creates a replacement ReviewTask in status QUEUED with cycle_count = expired.cycle_count + 1 and the same queue and primary_policy_rule_id"
          - "increments ReviewTask.version by 1"

      - from: CLAIMED
        to: EXPIRED
        trigger: "POST /ad-policy/_policy-sweeps/run when sla_deadline_at <= logical clock, or a cascade from creative withdrawal / suspension"
        actor: system
        preconditions:
          - "status == CLAIMED"
        side_effects:
          - "decrements the holding Reviewer.claimed_task_count by 1 and increments Reviewer.version by 1"
          - "on an SLA sweep expiry only: creates a replacement ReviewTask in status QUEUED with cycle_count = expired.cycle_count + 1"
          - "increments ReviewTask.version by 1"

  - entity: Certification
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /ad-policy/certifications when valid_from <= logical clock < valid_until, or POST /ad-policy/_policy-sweeps/run reaching a future-dated certification"
        actor: Advertiser | system
        preconditions:
          - "valid_from <= logical clock AND logical clock < valid_until"
          - "no other Certification with status in {SUBMITTED, ACTIVE} for the same (advertiser_id, policy_rule_id, issuing_country_code) has an interval intersecting [valid_from, valid_until)"
        side_effects:
          - "increments Certification.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /ad-policy/_policy-sweeps/run when valid_until <= logical clock"
        actor: system
        preconditions:
          - "status in {SUBMITTED, ACTIVE}"
          - "valid_until <= logical clock"
        side_effects:
          - "every AdCreative with approved_under_certification_id == this id and review_status in {AUTO_APPROVED, APPROVED_LIMITED} is re-routed to PENDING_MANUAL_REVIEW with a new REGULATED_CERT ReviewTask"
          - "increments Certification.version by 1"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /ad-policy/certifications/{id}/revoke"
        actor: PolicyAdmin
        preconditions:
          - "status in {SUBMITTED, ACTIVE}"
        side_effects:
          - "writes revocation_reason"
          - "every AdCreative with approved_under_certification_id == this id and review_status == APPROVED_LIMITED is re-routed to PENDING_MANUAL_REVIEW with a new REGULATED_CERT ReviewTask, clearing approved_under_certification_id and limited_country_codes"
          - "increments Certification.version by 1"

  - entity: DisapprovalNotice
    dimension: status
    initial_state: ISSUED
    terminal_states: [APPEAL_GRANTED, APPEAL_UPHELD, EXPIRED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /ad-policy/appeals"
        actor: Advertiser
        preconditions:
          - "status == ISSUED"
          - "logical clock < appeal_deadline_at"
          - "acting X-User-ID == AdCreative.advertiser_id of the notice's creative"
        side_effects:
          - "creates the Appeal in status SUBMITTED"
          - "increments DisapprovalNotice.version by 1"

      - from: APPEALED
        to: APPEAL_GRANTED
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome GRANTED"
        actor: PolicyReviewer
        preconditions:
          - "status == APPEALED"
          - "acting reviewer id != decided_by_reviewer_id"
        side_effects:
          - "runs the AdCreative DISAPPROVED -> PENDING_MANUAL_REVIEW cascade including the compensating ViolationLedgerEntry"
          - "increments DisapprovalNotice.version by 1"

      - from: APPEALED
        to: APPEAL_UPHELD
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome DENIED"
        actor: PolicyReviewer
        preconditions:
          - "status == APPEALED"
          - "acting reviewer id != decided_by_reviewer_id"
        side_effects:
          - "Appeal.status -> DENIED; AdCreative.review_status stays DISAPPROVED"
          - "NO ledger entry is written and Advertiser.violation_points_raw is unchanged"
          - "increments DisapprovalNotice.version by 1"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /ad-policy/_policy-sweeps/run when appeal_deadline_at <= logical clock"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "appeal_deadline_at <= logical clock"
        side_effects:
          - "no ledger or advertiser changes; the disapproval becomes final"
          - "increments DisapprovalNotice.version by 1"

  - entity: Appeal
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome GRANTED"
        actor: PolicyReviewer
        preconditions:
          - "status == SUBMITTED"
          - "DisapprovalNotice.status == APPEALED"
          - "acting reviewer id != DisapprovalNotice.decided_by_reviewer_id"
          - "when evidence_certification_id is non-null: that Certification.advertiser_id == the notice creative's advertiser_id"
        side_effects:
          - "writes decided_by_reviewer_id, decided_at and reinstated_review_status"
          - "branch-specific: compensating ViolationLedgerEntry, notice -> APPEAL_GRANTED, creative reinstated to PENDING_MANUAL_REVIEW with a fresh ReviewTask, destination axis reset, enforcement possibly LIFTED"
          - "increments Appeal.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome DENIED"
        actor: PolicyReviewer
        preconditions:
          - "status == SUBMITTED"
          - "DisapprovalNotice.status == APPEALED"
          - "acting reviewer id != DisapprovalNotice.decided_by_reviewer_id"
        side_effects:
          - "writes decided_by_reviewer_id and decided_at; reinstated_review_status stays null"
          - "branch-specific: notice -> APPEAL_UPHELD, NO ledger entry, creative stays DISAPPROVED, enforcement untouched"
          - "increments Appeal.version by 1"
        note: "Branching fork with divergent side-effect sets: GRANTED compensates the ledger, DENIED deliberately does not."

  - entity: EnforcementAction
    dimension: status
    initial_state: ACTIVE
    terminal_states: [LIFTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "system cascade from a ViolationLedgerEntry insert, or POST /ad-policy/advertisers/{id}/enforcement-actions"
        actor: system | PolicyAdmin
        preconditions:
          - "for a cascade: calculations.enforcement_severity_index selects an action_type AND (no ACTIVE action exists OR the selected action_type is strictly more severe than the ACTIVE action's action_type, ordered WARNING < RESTRICTION < SUSPENSION)"
          - "for a manual action: expected_advertiser_version == Advertiser.version AND the new effective_from is outside every existing blackout window per validations[priority=78]"
        side_effects:
          - "writes severity_index_at_issue, effective_from = logical clock, effective_until, origin"
          - "any existing ACTIVE action on the advertiser moves to SUPERSEDED and the new action's prior_action_id points at it"
          - "re-derives Advertiser.account_status and increments Advertiser.version by 1"
          - "an action_type of SUSPENSION additionally sweeps the advertiser's creatives to SUSPENDED_HOLD and expires their ReviewTasks"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "creation of a strictly more severe EnforcementAction on the same advertiser"
        actor: system | PolicyAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "counts toward closed_action_count in calculations.enforcement_severity_index from now on"
          - "increments EnforcementAction.version by 1"

      - from: ACTIVE
        to: LIFTED
        trigger: "POST /ad-policy/appeals/{id}/decision with outcome GRANTED, or POST /ad-policy/_policy-sweeps/run after decay"
        actor: PolicyReviewer | system
        preconditions:
          - "status == ACTIVE"
          - "calculations.enforcement_severity_index output < ACTION_THRESHOLDS[action_type]"
        side_effects:
          - "re-derives Advertiser.account_status and increments Advertiser.version by 1"
          - "a lifted SUSPENSION allows the sweep to return SUSPENDED_HOLD creatives to PENDING_MANUAL_REVIEW"
          - "increments EnforcementAction.version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /ad-policy/_policy-sweeps/run when effective_until <= logical clock"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "effective_until <= logical clock"
        side_effects:
          - "re-derives Advertiser.account_status and increments Advertiser.version by 1"
          - "counts toward closed_action_count in calculations.enforcement_severity_index from now on"
          - "increments EnforcementAction.version by 1"

  - entity: Advertiser
    dimension: account_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: WARNED
        trigger: "system re-derivation after any EnforcementAction status change"
        actor: system
        preconditions:
          - "the most severe ACTIVE EnforcementAction on the advertiser has action_type WARNING"
        side_effects:
          - "increments Advertiser.version by 1"

      - from: WARNED
        to: RESTRICTED
        trigger: "system re-derivation after any EnforcementAction status change"
        actor: system
        preconditions:
          - "the most severe ACTIVE EnforcementAction has action_type RESTRICTION"
        side_effects:
          - "new AdCreative creation in PROHIBITED or RESTRICTED categories, and any political creative, is rejected per validations[priority=82]"
          - "increments Advertiser.version by 1"

      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system re-derivation after any EnforcementAction status change"
        actor: system
        preconditions:
          - "the most severe ACTIVE EnforcementAction has action_type SUSPENSION"
        side_effects:
          - "sweeps every non-terminal AdCreative of this advertiser to SUSPENDED_HOLD and expires their ReviewTasks"
          - "increments Advertiser.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system re-derivation after every EnforcementAction leaves status ACTIVE"
        actor: system
        preconditions:
          - "no EnforcementAction on the advertiser has status ACTIVE"
        side_effects:
          - "SUSPENDED_HOLD creatives are returned to PENDING_MANUAL_REVIEW by the next policy sweep"
          - "increments Advertiser.version by 1"
        note: "Compound state: account_status is a pure function of the advertiser's EnforcementAction rows, so it can jump any distance in either direction in one re-derivation."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: screening-run-stale-creative
    parent_entity: AdCreative
    write_endpoint: "POST /ad-policy/ad-creatives/{id}/screening-runs"
    occ_field: "expected_ad_creative_version"
    description: |
      Ingesting a ScreeningRun against an AdCreative whose version has advanced
      since the classifier read it is rejected with a stale-version error. Re-screening
      is legitimately repeatable — a later run supersedes the earlier one and the
      creative's routing is recomputed from the newest run — so the only sound
      discriminator is the version the classifier observed when it fetched the
      creative text. A run ingested against a stale version would classify text
      the advertiser has already edited.
    error_id: ERR_STALE_CREATIVE_VERSION
    http_status: 412

  - rule_id: manual-enforcement-stale-advertiser
    parent_entity: Advertiser
    write_endpoint: "POST /ad-policy/advertisers/{id}/enforcement-actions"
    occ_field: "expected_advertiser_version"
    description: |
      Minting a manual EnforcementAction against an Advertiser whose version has
      advanced since the operator read the account is rejected with a stale-version
      error. A new action legitimately supersedes the prior ACTIVE one, so the write
      is repeatable by product design; the version check is what stops an operator
      from stacking an action on a posture that a cascade has already changed
      underneath them.
    error_id: ERR_STALE_ADVERTISER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
# Shared helper definitions used by several formulas (all deterministic, all over
# entity fields only — no random identifier ever participates in a decision):
#
#   host(url)                  = lowercase substring between "://" and the next "/"
#                                (or end of string when no further "/" exists)
#   rules(creative)            = PolicyRule rows whose code is an element of
#                                creative.declared_category_codes
#   override(rule, country)    = the CountryPolicyOverride row with that
#                                (policy_rule_id, country_code), or absent
#   country_multiplier(rule, creative)
#                              = max over c in creative.target_country_codes of
#                                override(rule, c).severity_multiplier, using 1.00 for
#                                each country with no override row; 1.00 when
#                                target_country_codes is empty (unreachable: the field
#                                is constrained non-empty)
#   strictest_multiplier(creative)
#                              = max over r in rules(creative), c in
#                                creative.target_country_codes of
#                                override(r, c).severity_multiplier, using 1.00 for
#                                absent rows; 1.00 when rules(creative) is empty
#   disposition(rule, country) = override(rule, country).disposition when the row
#                                exists, else BLOCKED for category_class PROHIBITED,
#                                RESTRICTED_CERT_REQUIRED for RESTRICTED and
#                                ALLOWED for REGULATED
#   strictest_disposition(rule, creative)
#                              = the strictest disposition(rule, c) over
#                                c in creative.target_country_codes, ordered
#                                BLOCKED > RESTRICTED_CERT_REQUIRED >
#                                ALLOWED_WITH_DISCLAIMER > ALLOWED
#   latest_run(creative)       = the ScreeningRun for the creative with the greatest
#                                sequence_index (never ties: sequence_index is
#                                contiguous and unique per creative)
calculations:
  - name: creative_risk_score
    trigger: "On every accepted ScreeningRun (both variants), on every accepted DestinationCheck (final variant), and on every ReviewTask decision that changes AdCreative.review_status (final variant)"
    algorithm: weighted_scoring
    formula: |
      findings = ClassifierDecision rows of latest_run(creative)
                 whose confidence >= rule.confidence_manual_threshold
      # variant provisional_screening -> AdCreative.risk_score_provisional
      raw_sum = SUM over d in findings of
                  ( rule(d).base_severity_weight
                    * country_multiplier(rule(d), creative)
                    * d.confidence )                       # products kept UNROUNDED
      risk_score_provisional = min(100.00, round(raw_sum, 2))   # sum first, round ONCE

      # variant post_destination_final -> AdCreative.risk_score_final
      destination_penalty =
          DESTINATION_PENALTY_CLOAKING  when creative.destination_status == CLOAKING_CONFIRMED
          DESTINATION_PENALTY_MISMATCH  when creative.destination_status == MISMATCH_FLAGGED
          0.00                          otherwise (NOT_CHECKED, DESTINATION_PENDING, DESTINATION_CLEARED)
      covered_rule_count = number of DISTINCT rule(d).id among findings for which
          calculations.certification_coverage returns a non-empty candidate set at the
          logical clock for at least one c in creative.target_country_codes
      certification_credit = min(CERT_CREDIT_CAP,
                                 CERT_CREDIT_PER_RULE * covered_rule_count)
      risk_score_final = min(100.00, max(0.00,
          round(risk_score_provisional + destination_penalty - certification_credit, 2)))
      # ClassifierDecision.assessed_points is a per-row audit field and is rounded
      # independently: round(base_severity_weight * country_multiplier_applied * confidence, 2).
      # It is NOT an input to either variant — summing assessed_points would be the
      # round-then-sum order, which this calculation does not use.
    input_set: "Only ClassifierDecision rows of latest_run(creative) with confidence >= that rule's confidence_manual_threshold. Rows below the manual threshold are excluded from both variants; earlier runs are excluded entirely."
    constants:
      DESTINATION_PENALTY_MISMATCH: 15.00
      DESTINATION_PENALTY_CLOAKING: 40.00
      CERT_CREDIT_PER_RULE: 8.00
      CERT_CREDIT_CAP: 24.00
    precision: "2 decimal places, round_half_up; the two variants round at different points and MAY disagree by more than rounding — that divergence is intended"
    variants:
      - name: provisional_screening
        when: "Written at every accepted ScreeningRun; the score the screening layer publishes before any destination evidence or certification credit exists"
        difference: "Ignores destination_penalty and certification_credit entirely; equals min(100.00, round(raw_sum, 2))"
      - name: post_destination_final
        when: "Written alongside the provisional score and rewritten on every DestinationCheck and every review decision"
        difference: "Adds destination_penalty and subtracts certification_credit, then floors at 0.00; for the same creative at the same instant it can be lower (credit dominates) or higher (penalty dominates) than the provisional score"

  - name: advertiser_violation_points
    trigger: "On every ViolationLedgerEntry insert (both variants) and on every POST /ad-policy/_policy-sweeps/run (decayed variant refresh)"
    algorithm: decay_function
    formula: |
      entries = ViolationLedgerEntry rows with advertiser_id == advertiser.id,
                replayed in ascending entry_index order
      # variant raw_cumulative -> Advertiser.violation_points_raw
      violation_points_raw = max(0.00, round(SUM over e in entries of e.delta_points, 2))

      # variant decayed_enforcement -> Advertiser.violation_points_decayed
      age_days(e) = floor((logical_clock - e.created_at) / 86400 seconds)
      decay_factor(e) = 1.00 when age_days(e) <  DECAY_HALF_AT_DAYS
                        0.50 when DECAY_HALF_AT_DAYS <= age_days(e) < DECAY_ZERO_AT_DAYS
                        0.00 when age_days(e) >= DECAY_ZERO_AT_DAYS
      violation_points_decayed = max(0.00, round(
          SUM over e in entries of (e.delta_points * decay_factor(e)), 2))
      # Each entry keeps its own age; a compensating APPEAL_REVERSAL entry created today
      # carries decay_factor 1.00 even when the DISAPPROVAL_ASSESSED entry it reverses
      # has already decayed, so a late reversal can drive the decayed balance to 0.00
      # via the max(0.00, ...) floor while the raw balance stays positive.
    input_set: "All ViolationLedgerEntry rows of the advertiser regardless of reason; no status filter exists on ledger rows because they are append-only"
    constants:
      DECAY_HALF_AT_DAYS: 90
      DECAY_ZERO_AT_DAYS: 180
    precision: "2 decimal places, round_half_up; each variant sums unrounded terms and rounds once"
    variants:
      - name: raw_cumulative
        when: "Displayed to the advertiser on DisapprovalNotice.disclosed_points_total and stored as Advertiser.violation_points_raw"
        difference: "No decay factor; every entry counts at full weight forever"
      - name: decayed_enforcement
        when: "The only input to calculations.enforcement_severity_index, and therefore the only variant that can create or lift an EnforcementAction"
        difference: "Applies decay_factor per entry by age at the logical clock; for identical ledger rows it is <= the raw variant and reaches 0.00 once every entry is at least DECAY_ZERO_AT_DAYS old"

  - name: review_task_priority_score
    trigger: "On ReviewTask creation (screening routing, destination re-route, certification loss, appeal reinstatement, sweep replacement) and on POST /ad-policy/review-tasks/{id}/requeue"
    algorithm: weighted_scoring
    formula: |
      base = QUEUE_BASE[task.queue]                        # tiered selection on queue
      rule = PolicyRule with id == task.primary_policy_rule_id, absent when null
      severity_component = 0.00 when rule is absent, else
          min(SEVERITY_COMPONENT_CAP,
              round(rule.base_severity_weight
                    * strictest_multiplier(creative)
                    * SEVERITY_COMPONENT_FACTOR, 2))
      history_component = min(HISTORY_COMPONENT_CAP,
          floor(advertiser.violation_points_decayed / HISTORY_STEP_POINTS)
          * HISTORY_STEP_VALUE)
      verification_gap = VERIFICATION_GAP when
          (advertiser.identity_status != VERIFIED
           OR advertiser.business_standing_status != VERIFIED) else 0.00
      disclosure_gap = DISCLOSURE_GAP when
          (creative.political_flag == true
           AND (creative.disclaimer_text is null OR creative.disclaimer_text == "")) else 0.00
      priority_score = min(100.00, round(
          base
          + max(severity_component, history_component)   # nested max, not a sum
          + verification_gap
          + disclosure_gap, 2))
      # Queue ordering for GET /ad-policy/review-tasks: priority_score DESC,
      # then created_at ASC. No identifier participates in the ordering.
    input_set: "The task's own queue and primary rule, the creative's political/disclaimer fields and country set, and the advertiser's two verification axes plus violation_points_decayed as of the moment the task is created or re-queued"
    constants:
      QUEUE_BASE: { STANDARD: 30.00, REGULATED_CERT: 45.00, POLITICAL: 60.00 }
      SEVERITY_COMPONENT_FACTOR: 2.00
      SEVERITY_COMPONENT_CAP: 30.00
      HISTORY_STEP_POINTS: 10.00
      HISTORY_STEP_VALUE: 5.00
      HISTORY_COMPONENT_CAP: 15.00
      VERIFICATION_GAP: 10.00
      DISCLOSURE_GAP: 12.00
    precision: "2 decimal places, round_half_up; severity_component rounds before the max, the total rounds once after the sum"

  - name: disapproval_points_assessment
    trigger: "On DisapprovalNotice creation (system auto-disapproval, destination cloaking cascade, or a DISAPPROVE review resolution)"
    algorithm: aggregation
    formula: |
      source_reason = AUTO_SCREENING when notice.decided_by_reviewer_id is null
                      else MANUAL_REVIEW
      # Phase 1 — one finding line per qualifying classifier decision, ordered by
      # rule code ASC (deterministic; codes are unique):
      phase_1 = for each d in ClassifierDecision rows of latest_run(creative)
                with disposition in {AUTO_DISAPPROVE, ROUTE_MANUAL},
                ordered by rule(d).code ASC:
          { policy_rule_code: rule(d).code,
            reason_code: source_reason,
            line_points: round( rule(d).base_severity_weight
                                * country_multiplier(rule(d), creative)
                                * REASON_FACTOR[source_reason], 2) }
          # NOTE: confidence does NOT enter the assessment; it only enters
          # calculations.creative_risk_score.
      # Phase 2 — one integrity line per non-finding reason code present on the
      # notice, ordered by the fixed sequence
      # [CERT_MISSING, CLOAKING, DESTINATION_MISMATCH, POLITICAL_DISCLOSURE]:
      phase_2 = for each r in notice.reason_codes intersected with that sequence,
                in that sequence order:
          { policy_rule_code: null,
            reason_code: r,
            line_points: round( INTEGRITY_BASE_WEIGHT
                                * strictest_multiplier(creative)
                                * REASON_FACTOR[r], 2) }
      assessment_lines = phase_1 followed by phase_2
      assessed_points = min(ASSESSED_POINTS_CAP,
                           SUM over l in assessment_lines of l.line_points)
      # ROUNDING ORDER IS PINNED: each line is rounded to 2 decimals with
      # round_half_up BEFORE the sum. The alternative order — summing the
      # unrounded products and rounding once — is NOT used and can differ by
      # 0.01 (e.g. lines 6.9230 and 4.6230 give 6.92 + 4.62 = 11.54 here,
      # whereas sum-then-round would give 11.55).
      ledger_delta = assessed_points          # written as ViolationLedgerEntry.delta_points
    input_set: "Qualifying ClassifierDecision rows of the creative's latest ScreeningRun only (AUTO_DISAPPROVE or ROUTE_MANUAL; BELOW_THRESHOLD rows are excluded and earlier runs are ignored), plus the notice's own reason_codes for phase 2"
    constants:
      REASON_FACTOR: { AUTO_SCREENING: 0.80, MANUAL_REVIEW: 1.00, CERT_MISSING: 0.60, CLOAKING: 2.00, DESTINATION_MISMATCH: 1.25, POLITICAL_DISCLOSURE: 1.50 }
      INTEGRITY_BASE_WEIGHT: 10.00
      ASSESSED_POINTS_CAP: 100.00
    precision: "2 decimal places per line, round_half_up, rounded per line then summed; the sum itself needs no further rounding"

  - name: enforcement_severity_index
    trigger: "On every ViolationLedgerEntry insert, on POST /ad-policy/advertisers/{id}/enforcement-actions, and on every POST /ad-policy/_policy-sweeps/run after the decay refresh"
    algorithm: threshold
    formula: |
      # Step 1 — base index (evaluated FIRST and never revised):
      closed_action_count = count of EnforcementAction rows on the advertiser with
                            status in {SUPERSEDED, LIFTED, EXPIRED}
                            # ACTIVE actions are excluded so the currently effective
                            # action never inflates its own successor's index
      base_index = round(advertiser.violation_points_decayed
                         + REPEAT_ACTION_POINTS * closed_action_count, 2)
      # Step 2 — surcharge tier keyed on base_index ONLY:
      escalation_surcharge = 0.00 when base_index <  SURCHARGE_TIER_1_AT
                             3.50 when SURCHARGE_TIER_1_AT <= base_index < SURCHARGE_TIER_2_AT
                             9.00 when base_index >= SURCHARGE_TIER_2_AT
      # Step 3 — final index:
      severity_index = round(base_index + escalation_surcharge, 2)
      # Step 4 — action selection keyed on severity_index (the post-surcharge value):
      action_type = SUSPENSION  when severity_index >= ACTION_THRESHOLDS.SUSPENSION
                    RESTRICTION when severity_index >= ACTION_THRESHOLDS.RESTRICTION
                    WARNING     when severity_index >= ACTION_THRESHOLDS.WARNING
                    none        otherwise
      # EVALUATION ORDER IS PINNED AND NON-ITERATIVE: the tier in step 2 is chosen
      # from base_index and is NEVER re-chosen after the surcharge is added, even
      # though severity_index can land in a higher tier. Example: base_index 32.55
      # picks 3.50 -> severity_index 36.05 -> RESTRICTION. Re-evaluating the tier on
      # 36.05 would pick 9.00 -> 41.55 -> SUSPENSION, which this scaffold does NOT do.
      # An EnforcementAction is created only when action_type is not none AND
      # (no ACTIVE action exists OR action_type is strictly more severe than the
      # ACTIVE action's type, ordered WARNING < RESTRICTION < SUSPENSION).
      # A sweep LIFTS an ACTIVE action when severity_index < ACTION_THRESHOLDS[its type].
    input_set: "advertiser.violation_points_decayed (decayed_enforcement variant only) plus EnforcementAction rows with status in {SUPERSEDED, LIFTED, EXPIRED}; ACTIVE rows are excluded from closed_action_count"
    constants:
      REPEAT_ACTION_POINTS: 5.00
      SURCHARGE_TIER_1_AT: 20.00
      SURCHARGE_TIER_2_AT: 35.00
      ACTION_THRESHOLDS: { WARNING: 10.00, RESTRICTION: 25.00, SUSPENSION: 40.00 }
      ENFORCEMENT_DURATION_DAYS: { WARNING: 30, RESTRICTION: 60, SUSPENSION: 180 }
      ENFORCEMENT_COOLDOWN_HOURS: 72
    precision: "2 decimal places, round_half_up at step 1 and step 3; thresholds are inclusive lower bounds (>=)"

  - name: screening_disposition
    trigger: "POST /ad-policy/ad-creatives/{id}/screening-runs"
    algorithm: threshold
    formula: |
      # Step 1 — per-decision disposition (inclusive lower bounds):
      for each submitted decision d with rule = PolicyRule(d.policy_rule_id):
        disposition(d) = AUTO_DISAPPROVE when d.confidence >= rule.confidence_auto_disapprove_threshold
                         ROUTE_MANUAL    when d.confidence >= rule.confidence_manual_threshold
                         BELOW_THRESHOLD otherwise
        country_multiplier_applied(d) = country_multiplier(rule, creative)
        assessed_points(d) = round(rule.base_severity_weight
                                   * country_multiplier_applied(d) * d.confidence, 2)
      # Step 2 — run outcome, evaluated in this exact order (first match wins):
      2a. AUTO_DISAPPROVED  when some d has disposition AUTO_DISAPPROVE
                            AND strictest_disposition(rule(d), creative) == BLOCKED
      2b. ROUTED_MANUAL     when creative.political_flag == true
      2c. ROUTED_MANUAL     when some d has disposition in {AUTO_DISAPPROVE, ROUTE_MANUAL}
      2d. ROUTED_MANUAL     when advertiser.identity_status != VERIFIED
                            OR advertiser.business_standing_status != VERIFIED
      2e. ROUTED_MANUAL     when advertiser.account_status in {RESTRICTED, WARNED}
                            AND some r in rules(creative) has
                            category_class in {PROHIBITED, RESTRICTED}
      2f. AUTO_APPROVED     otherwise (including a run with zero decisions)
      # Step 3 — routing of a ROUTED_MANUAL outcome into exactly one ReviewTask:
      queue = POLITICAL       when creative.political_flag == true
              REGULATED_CERT  when some d with disposition in {AUTO_DISAPPROVE, ROUTE_MANUAL}
                              has rule.requires_certification == true
                              OR some override(rule(d), c) with
                              c in creative.target_country_codes has requires_license == true
              STANDARD        otherwise
      primary_policy_rule_id =
              null when no d has disposition in {AUTO_DISAPPROVE, ROUTE_MANUAL}, else
              the rule of the qualifying d ranked by confidence DESC,
              tie-break rule.code ASC   # codes are unique, so the rank is total
      sla_deadline_at = task.created_at + (rule.review_sla_hours of
              primary_policy_rule_id, or DEFAULT_SLA_HOURS when it is null)
    input_set: "Only the decisions submitted in this run; ClassifierDecision rows of earlier runs never re-enter routing. Every submitted policy_rule_id must exist or the whole run is rejected."
    constants:
      DEFAULT_SLA_HOURS: 48
    precision: "confidence comparisons use exact 2-decimal equality semantics; a confidence exactly equal to a threshold satisfies the >= branch"

  - name: certification_coverage
    trigger: "Evaluated by review decisions with resolution APPROVE_WITH_LIMITS, by calculations.creative_risk_score for certification_credit, and by validations[priority=70]"
    algorithm: interval_merge
    formula: |
      # Candidate set for (advertiser, rule, country, at_instant):
      candidates = Certification rows where
          advertiser_id == advertiser.id
          AND policy_rule_id == rule.id
          AND issuing_country_code == country
          AND status == ACTIVE
          AND valid_from <= at_instant
          AND at_instant < valid_until          # HALF-OPEN: valid_until is exclusive
      # Selection when a single certification must be pinned (APPROVE_WITH_LIMITS):
      #   eligibility filter : the candidate set above
      #   ranking            : valid_until DESC (longest remaining coverage wins)
      #   tie-break          : created_at ASC (never id)
      #   empty-set fallback : reject the operation with ERR_CERTIFICATION_MISSING
      selected = first of candidates ordered by valid_until DESC, created_at ASC
      # Overlap admission rule on POST /ad-policy/certifications, same triple:
      # a new interval [valid_from, valid_until) is rejected when there exists a row
      # with status in {SUBMITTED, ACTIVE} and
      #     new.valid_from < existing.valid_until AND existing.valid_from < new.valid_until
      # Adjacency is therefore legal: new.valid_from == existing.valid_until does NOT
      # intersect, and neither does new.valid_until == existing.valid_from.
      # requires_license countries: a country c in limited_country_codes demands a
      # candidate set when rule.requires_certification == true
      # OR override(rule, c).requires_license == true.
    input_set: "Certification rows with status ACTIVE for coverage questions; status in {SUBMITTED, ACTIVE} for the overlap admission check. EXPIRED and REVOKED rows are excluded from both."
    constants: {}
    precision: "instants compared at whole-second ISO 8601 UTC resolution; boundaries are inclusive at valid_from and exclusive at valid_until"

  - name: destination_check_result
    trigger: "POST /ad-policy/ad-creatives/{id}/destination-checks"
    algorithm: projection
    formula: |
      declared_host = host(creative.display_url)
      final_host    = host(check.fetched_final_url)
      last_crawler  = the DestinationCheck row on this creative with
                      user_agent_variant == CRAWLER ranked by created_at DESC,
                      tie-break by the greater http_status, then the lexicographically
                      greater fetched_final_url (never id); absent when none exists
      # First matching clause wins:
      1. MISMATCH with mismatch_detail DEST_UNREACHABLE when check.http_status >= 400
      2. CLOAKING with mismatch_detail UA_DIVERGENCE when
           check.user_agent_variant == USER AND last_crawler exists
           AND host(last_crawler.fetched_final_url) != final_host
      3. MISMATCH with mismatch_detail HOST_MISMATCH when final_host != declared_host
      4. MISMATCH with mismatch_detail CATEGORY_MISMATCH when
           check.fetched_content_category != "GENERAL"
           AND check.fetched_content_category is not an element of
               creative.declared_category_codes
      5. CLEARED with mismatch_detail null otherwise
    input_set: "This check plus all earlier DestinationCheck rows on the same creative (needed for clause 2); checks on other creatives never participate"
    constants: {}
    precision: "host comparison is exact after lowercasing; no substring or suffix matching"

  - name: serving_eligibility_gate
    trigger: "Recomputed on every write to AdCreative.review_status, AdCreative.destination_status, or the owning Advertiser.account_status"
    algorithm: constraint_propagation
    formula: |
      # Conjuncts are evaluated in this fixed order and every failing conjunct
      # appends its code to blocking_reason_codes in this same order:
      c1 REVIEW_NOT_APPROVED       : review_status in {AUTO_APPROVED, APPROVED_LIMITED}
      c2 DESTINATION_NOT_CLEARED   : destination_status == DESTINATION_CLEARED
      c3 ACCOUNT_ENFORCEMENT       : advertiser.account_status in {ACTIVE, WARNED}
      c4 POLITICAL_ARCHIVE_MISSING : political_flag == false
                                     OR (a PoliticalArchiveEntry exists for this creative
                                         AND advertiser.political_eligibility_status == ELIGIBLE)
      serving_eligible = c1 AND c2 AND c3 AND c4
      blocking_reason_codes = ordered codes of the failing conjuncts ([] when eligible)
    input_set: "The creative's two state axes, the owning advertiser's account_status and political_eligibility_status, and the existence of a PoliticalArchiveEntry for this creative"
    constants: {}
    precision: "boolean; blocking_reason_codes order is fixed by conjunct index, never sorted"

  - name: appeal_window_deadline
    trigger: "On DisapprovalNotice creation"
    algorithm: threshold
    formula: |
      appeal_window_hours = APPEAL_WINDOW_HOURS_POLITICAL
                            when notice.political_at_issue == true
                            else APPEAL_WINDOW_HOURS_STANDARD
      appeal_deadline_at  = notice.created_at + appeal_window_hours
      # An appeal is admissible only while logical_clock < appeal_deadline_at
      # (STRICT less-than: at the deadline instant the window is already closed).
    input_set: "The notice's own created_at and political_at_issue snapshot"
    constants:
      APPEAL_WINDOW_HOURS_STANDARD: 72
      APPEAL_WINDOW_HOURS_POLITICAL: 168
    precision: "whole hours added to an ISO 8601 UTC instant"

  - name: political_archive_retention
    trigger: "On PoliticalArchiveEntry creation (approval of a creative with political_flag == true)"
    algorithm: threshold
    formula: |
      archived_at     = logical clock
      retention_until = archived_at + ARCHIVE_RETENTION_DAYS days
      searchable      = true and stays true through later withdrawal or disapproval
      # Archive entries are append-only: no endpoint deletes or mutates them, so a
      # political creative that is approved, withdrawn and re-approved accumulates
      # one entry per approval.
    input_set: "The creative and advertiser snapshots at the approving decision"
    constants:
      ARCHIVE_RETENTION_DAYS: 2555
    precision: "whole days added to an ISO 8601 UTC instant"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Lower priority number wins. When one request violates several rules, the
# server returns the error of the lowest-numbered violated rule and performs
# no side effect. Business-rule ordering for this domain is:
#   safety / compliance (50-58)  ->  authorization-of-the-reviewer (58-66)
#   ->  certification & interval constraints (70-79)  ->  referential and
#   duplicate constraints (80-88). Compliance precedes capacity because a
#   prohibited-category ad must be refused even when the queue is full.
validations:
  - priority: 10
    category: auth
    check: "X-User-Role header present and equal to one of the roles declared in §1.7; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 12
    category: auth
    check: "The role in X-User-Role is listed in the target endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 14
    category: auth
    check: "When X-User-Role is Advertiser, X-User-ID equals the advertiser_id of the addressed AdCreative / Certification / DisapprovalNotice's creative / Appeal's notice's creative; when X-User-Role is PolicyReviewer, X-User-ID equals an existing Reviewer.id"
    error_id: ERR_ADVERTISER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /ad-policy/ad-creatives, PATCH /ad-policy/ad-creatives/{id}, POST /ad-policy/ad-creatives/{id}/submit, POST /ad-policy/ad-creatives/{id}/withdraw, POST /ad-policy/certifications, POST /ad-policy/appeals, all PolicyReviewer task and appeal actions"

  - priority: 20
    category: existence
    check: "Request body parses as JSON, contains no unknown fields, every required field of the endpoint's input: is present, and every value satisfies its §1.1 type and constraints (enum membership, string length, 2-decimal numerics, non-empty arrays, no duplicate array elements, https:// URL prefix)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH"

  - priority: 22
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 30
    category: existence
    check: "Every path id resolves, validated left to right: advertiser_id -> ERR_ADVERTISER_NOT_FOUND, ad_creative_id -> ERR_AD_CREATIVE_NOT_FOUND, policy_rule_id -> ERR_POLICY_RULE_NOT_FOUND, reviewer_id -> ERR_REVIEWER_NOT_FOUND, screening_run_id -> ERR_SCREENING_RUN_NOT_FOUND, review_task_id -> ERR_REVIEW_TASK_NOT_FOUND, certification_id -> ERR_CERTIFICATION_NOT_FOUND, disapproval_notice_id -> ERR_DISAPPROVAL_NOTICE_NOT_FOUND, appeal_id -> ERR_APPEAL_NOT_FOUND, enforcement_action_id -> ERR_ENFORCEMENT_ACTION_NOT_FOUND"
    error_id: ERR_AD_CREATIVE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 32
    category: existence
    check: "Every FK supplied in the body resolves: advertiser_id, policy_rule_id, prior_action_id, disapproval_notice_id, evidence_certification_id, and every element of declared_category_codes matching an existing PolicyRule.code (ERR_POLICY_RULE_NOT_FOUND). ClassifierDecision policy_rule_id values are validated in submitted order and the whole run is rejected on the first miss."
    error_id: ERR_POLICY_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /ad-policy/ad-creatives, POST /ad-policy/policy-rules/{id}/country-overrides, POST /ad-policy/ad-creatives/{id}/screening-runs, POST /ad-policy/certifications, POST /ad-policy/appeals, POST /ad-policy/advertisers/{id}/enforcement-actions"

  - priority: 38
    category: business_referential
    check: "No Appeal already exists for this disapproval_notice_id (one appeal per notice). This duplicate check deliberately runs ahead of the priority 40 notice-state rule, because filing the first appeal moves the notice to APPEALED: a second attempt must be reported as a duplicate, not as an un-appealable notice."
    error_id: ERR_APPEAL_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /ad-policy/appeals"

  - priority: 40
    category: state
    check: "The addressed AdCreative is in a review_status / destination_status from which the requested transition exists in §1.2"
    error_id: ERR_INVALID_CREATIVE_STATE
    http_status: 409
    applies_to: "POST /ad-policy/ad-creatives/{id}/submit, PATCH /ad-policy/ad-creatives/{id}, POST /ad-policy/ad-creatives/{id}/screening-runs, POST /ad-policy/ad-creatives/{id}/destination-checks, POST /ad-policy/ad-creatives/{id}/withdraw"

  - priority: 40
    category: state
    check: "The addressed ReviewTask is in a status from which the requested action exists: claim requires QUEUED, release/decision require CLAIMED, requeue requires ESCALATED"
    error_id: ERR_INVALID_TASK_STATE
    http_status: 409
    applies_to: "POST /ad-policy/review-tasks/{id}/claim, /release, /decision, /requeue"

  - priority: 40
    category: state
    check: "The addressed DisapprovalNotice has status ISSUED (an APPEALED, APPEAL_GRANTED, APPEAL_UPHELD or EXPIRED notice can no longer be appealed)"
    error_id: ERR_NOTICE_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /ad-policy/appeals"

  - priority: 40
    category: state
    check: "The addressed Appeal has status SUBMITTED and its notice has status APPEALED"
    error_id: ERR_APPEAL_NOT_PENDING
    http_status: 409
    applies_to: "POST /ad-policy/appeals/{id}/decision"

  - priority: 40
    category: state
    check: "The addressed Certification has status in {SUBMITTED, ACTIVE}"
    error_id: ERR_INVALID_CERTIFICATION_STATE
    http_status: 409
    applies_to: "POST /ad-policy/certifications/{id}/revoke"

  - priority: 45
    category: state
    check: "expected_ad_creative_version equals the current AdCreative.version (§1.2.1 rule screening-run-stale-creative)"
    error_id: ERR_STALE_CREATIVE_VERSION
    http_status: 412
    applies_to: "POST /ad-policy/ad-creatives/{id}/screening-runs"

  - priority: 45
    category: state
    check: "expected_advertiser_version equals the current Advertiser.version (§1.2.1 rule manual-enforcement-stale-advertiser)"
    error_id: ERR_STALE_ADVERTISER_VERSION
    http_status: 412
    applies_to: "POST /ad-policy/advertisers/{id}/enforcement-actions"

  - priority: 50
    category: business_safety
    check: "A review decision with resolution APPROVE or APPROVE_WITH_LIMITS is refused when any rule matched by a qualifying ClassifierDecision of the creative's latest ScreeningRun has category_class PROHIBITED, or when strictest_disposition of any matched rule is BLOCKED for a country retained by the decision (all of target_country_codes for APPROVE, limited_country_codes for APPROVE_WITH_LIMITS)"
    error_id: ERR_PROHIBITED_CATEGORY_BLOCKED
    http_status: 422
    applies_to: "POST /ad-policy/review-tasks/{id}/decision"

  - priority: 52
    category: business_safety
    check: "The owning Advertiser.account_status is not SUSPENDED"
    error_id: ERR_ADVERTISER_SUSPENDED
    http_status: 409
    applies_to: "POST /ad-policy/ad-creatives, PATCH /ad-policy/ad-creatives/{id}, POST /ad-policy/ad-creatives/{id}/submit, POST /ad-policy/certifications"

  - priority: 54
    category: business_safety
    check: "Approving a creative with political_flag == true requires Advertiser.political_eligibility_status == ELIGIBLE"
    error_id: ERR_POLITICAL_ELIGIBILITY_MISSING
    http_status: 422
    applies_to: "POST /ad-policy/review-tasks/{id}/decision"

  - priority: 56
    category: business_safety
    check: "Approving requires non-empty AdCreative.disclaimer_text whenever political_flag == true, or any matched PolicyRule.requires_disclaimer == true, or any CountryPolicyOverride.requires_disclaimer == true for a retained country"
    error_id: ERR_POLITICAL_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /ad-policy/review-tasks/{id}/decision"

  - priority: 58
    category: business_safety
    check: "Segregation of duties: the acting reviewer id must differ from DisapprovalNotice.decided_by_reviewer_id (no reviewer adjudicates an appeal against their own disapproval)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ad-policy/appeals/{id}/decision"

  - priority: 60
    category: business_constraint
    check: "Every element of the creative's target_country_codes is an element of the acting Reviewer.country_authorizations"
    error_id: ERR_REVIEWER_NOT_AUTHORIZED_COUNTRY
    http_status: 403
    applies_to: "POST /ad-policy/review-tasks/{id}/claim"

  - priority: 62
    category: business_constraint
    check: "The acting Reviewer.status is ACTIVE"
    error_id: ERR_REVIEWER_OFFLINE
    http_status: 409
    applies_to: "POST /ad-policy/review-tasks/{id}/claim"

  - priority: 64
    category: business_constraint
    check: "ReviewTask.queue is an element of the acting Reviewer.queue_specialties"
    error_id: ERR_REVIEWER_QUEUE_MISMATCH
    http_status: 403
    applies_to: "POST /ad-policy/review-tasks/{id}/claim"

  - priority: 66
    category: business_constraint
    check: "Reviewer.claimed_task_count < Reviewer.max_concurrent_claims (aggregate check: each held task is individually legal but the collection may not exceed the ceiling)"
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ad-policy/review-tasks/{id}/claim"

  - priority: 70
    category: business_constraint
    check: "A decision with resolution APPROVE_WITH_LIMITS requires a non-empty calculations.certification_coverage candidate set for every retained country that demands a license (matched rule.requires_certification == true or that country's override.requires_license == true)"
    error_id: ERR_CERTIFICATION_MISSING
    http_status: 422
    applies_to: "POST /ad-policy/review-tasks/{id}/decision"

  - priority: 71
    category: business_constraint
    check: "limited_country_codes is non-empty, a subset of the creative's target_country_codes, and contains no duplicates"
    error_id: ERR_INVALID_LIMITED_COUNTRIES
    http_status: 422
    applies_to: "POST /ad-policy/review-tasks/{id}/decision"

  - priority: 72
    category: business_temporal
    check: "valid_until is strictly after valid_from"
    error_id: ERR_INVALID_VALIDITY_WINDOW
    http_status: 422
    applies_to: "POST /ad-policy/certifications"

  - priority: 74
    category: business_temporal
    check: "The logical clock is strictly before DisapprovalNotice.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /ad-policy/appeals"

  - priority: 76
    category: business_temporal
    check: "The new Certification interval [valid_from, valid_until) does not intersect any existing interval with status in {SUBMITTED, ACTIVE} for the same (advertiser_id, policy_rule_id, issuing_country_code); adjacency at an endpoint is legal"
    error_id: ERR_CERTIFICATION_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /ad-policy/certifications"

  - priority: 78
    category: business_temporal
    check: "A manual EnforcementAction's effective_from (the logical clock) is not inside the blackout window of any existing action on the advertiser, defined as [effective_from, effective_until + ENFORCEMENT_COOLDOWN_HOURS] inclusive at both ends, over rows with status in {ACTIVE, LIFTED, EXPIRED, SUPERSEDED}"
    error_id: ERR_ENFORCEMENT_COOLDOWN_CONFLICT
    http_status: 409
    applies_to: "POST /ad-policy/advertisers/{id}/enforcement-actions"

  - priority: 79
    category: business_temporal
    check: "to_iso8601 is a valid ISO 8601 UTC instant not earlier than the current logical clock (the clock never runs backwards)"
    error_id: ERR_CLOCK_REWIND
    http_status: 409
    applies_to: "POST /ad-policy/_clock/set_current_utc"

  - priority: 82
    category: business_referential
    check: "An Advertiser whose account_status is RESTRICTED may not create a creative whose declared_category_codes include a PROHIBITED or RESTRICTED rule, and may not create a creative with political_flag == true"
    error_id: ERR_ADVERTISER_RESTRICTED_CATEGORY
    http_status: 409
    applies_to: "POST /ad-policy/ad-creatives"

  - priority: 84
    category: business_referential
    check: "fetched_content_category is either the literal GENERAL or an existing PolicyRule.code"
    error_id: ERR_UNKNOWN_POLICY_CATEGORY
    http_status: 422
    applies_to: "POST /ad-policy/ad-creatives/{id}/destination-checks"

  - priority: 86
    category: business_referential
    check: "Every reason_code on a DISAPPROVE decision is consistent with current state: CLOAKING requires destination_status == CLOAKING_CONFIRMED, DESTINATION_MISMATCH requires destination_status == MISMATCH_FLAGGED, POLITICAL_DISCLOSURE requires political_flag == true, CERT_MISSING requires a matched rule with requires_certification == true, MANUAL_REVIEW is always allowed, AUTO_SCREENING is never allowed on a reviewer decision"
    error_id: ERR_INVALID_REASON_CODE
    http_status: 422
    applies_to: "POST /ad-policy/review-tasks/{id}/decision"

  - priority: 88
    category: business_referential
    check: "When evidence_certification_id is supplied, that Certification.advertiser_id equals the advertiser_id of the appealed notice's creative"
    error_id: ERR_CERTIFICATION_OWNER_MISMATCH
    http_status: 422
    applies_to: "POST /ad-policy/appeals, POST /ad-policy/appeals/{id}/decision"

  - priority: 90
    category: business_constraint
    check: "code is globally unique among PolicyRule rows; (policy_rule_id, country_code) is unique among CountryPolicyOverride rows"
    error_id: ERR_DUPLICATE_POLICY_CODE
    http_status: 409
    applies_to: "POST /ad-policy/policy-rules, POST /ad-policy/policy-rules/{id}/country-overrides"

  - priority: 92
    category: business_constraint
    check: "confidence_auto_disapprove_threshold is strictly greater than confidence_manual_threshold"
    error_id: ERR_INVALID_THRESHOLD_ORDER
    http_status: 422
    applies_to: "POST /ad-policy/policy-rules"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# All paths are prefixed with /ad-policy. Every request carries X-User-Role and
# X-User-ID. Trailing `?` in input: marks an optional field; list endpoints
# additionally accept limit and offset.
endpoints:
  # --- PolicyRule and country variation -------------------------------------
  - method: POST
    path: "/ad-policy/policy-rules"
    description: "Register a policy rule in the prohibited / restricted / regulated framework"
    roles: [PolicyAdmin]
    code: 201
    input: [code, title, category_class, base_severity_weight, "requires_certification?", "requires_disclaimer?", "confidence_auto_disapprove_threshold?", "confidence_manual_threshold?", "review_sla_hours?", "default_queue?"]
    output: PolicyRule
    side_effects: ["sets country_override_count to 0"]

  - method: GET
    path: "/ad-policy/policy-rules"
    description: "List the policy framework, ordered by code ASC"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
    input: ["category_class?", "limit?", "offset?"]
    output: PolicyRule[]
    side_effects: []

  - method: GET
    path: "/ad-policy/policy-rules/{id}"
    description: "Read one policy rule"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
    input: []
    output: PolicyRule
    side_effects: []

  - method: POST
    path: "/ad-policy/policy-rules/{id}/country-overrides"
    description: "Attach a country-level variation (disposition, license demand, severity multiplier) to a rule"
    roles: [PolicyAdmin]
