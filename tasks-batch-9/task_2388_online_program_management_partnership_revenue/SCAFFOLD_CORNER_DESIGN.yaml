      - name: partner_lead_cannot_approve_a_course_design
        claim_type: deny
        grounds:
          - validations[priority 5 ERR_ACTION_ROLE_NOT_PERMITTED]
          - rbac.FacultyChair.exclusive_operations
        distinguishing_aspect: "The partner is allowed on POST /courses/{id}/design-actions — it is a shared endpoint — but only for START_DESIGN and SUBMIT_FOR_FACULTY_REVIEW, so the APPROVE action is refused at priority 5 with ERR_ACTION_ROLE_NOT_PERMITTED rather than the priority 3 endpoint-level error."
        test_recipe:
          setup:
            - "MBA-501 sitting in FACULTY_REVIEW after the partner submitted it."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
          trigger:
            - call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "APPROVE", faculty_reviewer_note: "Self-approval attempt." }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { r2: $.data.error_id }
          assert:
            - "response status == 403"
            - "${r2} == ERR_ACTION_ROLE_NOT_PERMITTED"
            - "Course.${c1_id}.design_status == FACULTY_REVIEW"

      - name: compliance_auditor_cannot_reach_the_statement_action_endpoint
        claim_type: deny
        grounds:
