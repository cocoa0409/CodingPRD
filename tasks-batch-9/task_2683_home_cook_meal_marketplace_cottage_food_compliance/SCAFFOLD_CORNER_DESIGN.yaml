              captures: { oa_ful: "$.data.fulfillment_status" }
            - call: POST /orders/${oa_id}/cancel
              payload: { reason: "diner changed plans" }
              as: Diner
              as_user_id: diner-a
              captures: { oa_ful_2: "$.data.fulfillment_status", oa_reason: "$.data.cancelled_reason", oa_pay: "$.data.payment_status" }
            - call: GET /pickup-hubs/${hub_id}
              payload: {}
              as: PlatformAdmin
              captures: { hub_count_2: "$.data.assigned_order_count", hub_status_2: "$.data.status" }
            - call: GET /production-windows/${w_id}
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
              captures: { committed_3: "$.data.committed_meals", reserve_3: "$.data.spoilage_reserve_meals", eff_3: "$.data.effective_capacity_meals" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: FinanceOperator
              as_user_id: fin-1
              captures: { ytd_c: "$.data.ytd_cottage_revenue_cents", pending_c: "$.data.pending_payout_cents" }
          assert:
            - "${oa_hub} == ${hub_id}: the HUB_PICKUP zone forces hub selection at routing"
            - "${hub_count_1} == 1 and ${hub_status_1} == CLOSED: the hub auto-closes the instant assigned_order_count reaches slot_capacity_orders"
            - "${committed_1} == 5, ${reserve_1} == 1 (ceil(5 * 0.10)), ${eff_1} == 19"
            - "${committed_2} == 3: the IN_PRODUCTION sweep decremented only Order B's 2 meals"
            - "${ob_ful} == CANCELLED, ${ob_reason} == WINDOW_CANCELLED, ${ob_pay} == VOIDED"
            - "${oa_ful} == ROUTED: the conditional cascade did not touch the routed order"
            - "${oa_ful_2} == CANCELLED, ${oa_reason} == DINER_REQUEST (the free-text reason input never becomes cancelled_reason), ${oa_pay} == VOIDED"
            - "${hub_count_2} == 0 and ${hub_status_2} == OPEN: releasing the slot re-opened the hub"
            - "${committed_3} == 0, ${reserve_3} == 0 (ceil(0) == 0), ${eff_3} == 20 - identical to the pre-placement values"
