# =============================================================================
# Shellfish Aquaculture & Harvest Area Classification — benchmark seed tables
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Shellfish Aquaculture & Harvest Area Classification API for a shellfish farm
  operation and the shellfish control authority that regulates it. The system
  covers lease/permit acquisition for a growing area with siting, navigation and
  environmental review; seed acquisition from hatcheries with disease
  certification and nursery grow-out; grow-out operations across bottom,
  rack-and-bag and floating gear with husbandry cycles and predator control;
  harvest area classification monitoring by the shellfish control authority with
  rainfall closures and reopening criteria; time-to-temperature control after
  harvest with vibrio management plans by season; tagging requirements carrying
  harvest date, harvest location and dealer information for traceability; dealer
  certification, shipping and interstate shipper listing compliance; and recall
  and illness investigation cooperation with traceback documentation.

domain_name: shellfish-harvest-classification
api_prefix: /shellfish

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity declares `parent: null` and links to peers through explicit
  # foreign-key fields. Append-only event children (WaterSample, RainfallEvent,
  # HusbandryLog, IllnessInvestigation) are additionally exposed as sub-resource
  # collections purely so each FK has a reverse-reachability GET.

  state_machine_shape: parallel
  additional_state_machine_shapes: [cyclic, branching, compound, guarded]
  # parallel : GrowingArea carries two independent status dimensions
  #            (`classification` × `harvest_status`).
  # cyclic   : Lease REVISION_REQUESTED -> UNDER_REVIEW; Dealer LISTED ->
  #            SUSPENDED -> LISTED; GrowoutUnit DEPLOYED -> HARVESTING -> DEPLOYED.
  # branching: Lease UNDER_REVIEW forks into two independent clearances and
  #            joins at PENDING_DECISION, or diverges to REVISION_REQUESTED with
  #            branch-specific side effects.
  # compound : SeedLot auto-transitions to PLANTED once its surviving seed is
  #            fully allocated to GrowoutUnits.
  # guarded  : HarvestAuthorization activation is gated on GrowingArea state.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic_scope   # IllnessInvestigation.traced_lot_ids spans lots from any lease/area

  role_model: segregation_of_duties
  # SitingReviewer records both lease clearances, but a single X-User-ID may
  # record only one of the two on a given lease. Beyond that the roles are
  # peers: ShellfishControlAuthority owns regulatory objects, FarmOperator owns
  # lease-scoped production objects, HatcheryOperator owns seed shipments,
  # SeafoodDealer owns shipments.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GrowingArea
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Growing-area code assigned by the shellfish control authority", constraints: "unique across all growing areas; 3-32 chars" }
      - { name: water_body, type: string, source: input, description: "Named water body the area sits in" }
      - { name: classification, type: enum, source: system, default: APPROVED, description: "Sanitary classification dimension", constraints: "APPROVED | CONDITIONALLY_APPROVED | RESTRICTED | PROHIBITED" }
      - { name: harvest_status, type: enum, source: system, default: OPEN, description: "Harvest availability dimension, independent of classification", constraints: "OPEN | CLOSED_RAINFALL | CLOSED_SAMPLE_FAILURE" }
      - { name: rainfall_closure_threshold_in, type: number, source: input, default: 1.00, description: "Inches of rain in 24h at or above which the area closes", constraints: "> 0; 2 decimals" }
      - { name: rainfall_closure_hours, type: integer, source: input, default: 96, description: "Minimum closure duration in hours after a qualifying rainfall event", constraints: ">= 1" }
      - { name: reopen_sample_count_required, type: integer, source: input, default: 3, description: "Consecutive clean samples required before reopening", constraints: ">= 1" }
      - { name: clean_sample_mpn_limit, type: number, source: input, default: 14.0, description: "A post-closure WaterSample counts as clean when fecal_coliform_mpn <= this value" }
      - { name: conditional_management_plan_on_file, type: boolean, source: input, default: false, description: "True when a conditional-area management plan is on file; required for CONDITIONALLY_APPROVED" }
      - { name: last_closure_started_at, type: datetime, source: system, description: "Instant the current (or most recent) closure began; null when the area has never closed" }
      - { name: closure_reopen_eligible_at, type: datetime, source: computed, description: "= last_closure_started_at + rainfall_closure_hours; null when never closed" }
      - { name: consecutive_clean_samples, type: integer, source: computed, default: 0, description: "Count of consecutive clean ACCEPTED samples collected strictly after last_closure_started_at" }
      - { name: accepted_sample_count, type: integer, source: computed, default: 0, description: "Number of WaterSamples for this area with sample_status = ACCEPTED" }
      - { name: geometric_mean_mpn, type: number, source: computed, description: "SYSTEMATIC_RANDOM geometric mean per calculations.area_water_quality_statistics; null when accepted_sample_count = 0" }
      - { name: p90_mpn, type: number, source: computed, description: "SYSTEMATIC_RANDOM estimated 90th percentile; null when accepted_sample_count = 0" }
      - { name: eligible_classification, type: enum, source: computed, description: "Most permissive classification the SYSTEMATIC_RANDOM statistics support", constraints: "INSUFFICIENT_DATA | APPROVED | RESTRICTED | PROHIBITED" }
      - { name: open_authorization_count, type: integer, source: computed, default: 0, description: "HarvestAuthorizations with status IN {ISSUED, ACTIVE} whose lease sits in this area" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: growing_area_id, type: string, source: input, description: "FK -> GrowingArea.id; the growing area this lease occupies" }
      - { name: operator_user_id, type: string, source: system, description: "X-User-ID of the FarmOperator that created the lease; ownership anchor for every lease-scoped operation" }
      - { name: lease_code, type: string, source: input, description: "Operator-facing lease identifier", constraints: "unique across all leases" }
      - { name: requested_acreage, type: number, source: input, description: "Acreage requested in the application", constraints: "> 0" }
      - { name: plot_codes, type: array, source: input, description: "Plot codes inside the lease footprint, e.g. [\"P1\",\"P2\"]", constraints: "1-12 unique non-empty strings" }
      - { name: gear_types_permitted, type: array, source: input, description: "Permitted gear types", constraints: "non-empty subset of BOTTOM | RACK_AND_BAG | FLOATING_BAG" }
      - { name: authorized_gear_units, type: integer, source: input, description: "Ceiling on concurrently deployed gear units across all plots", constraints: ">= 1" }
      - { name: deployed_gear_units, type: integer, source: computed, default: 0, description: "= sum of GrowoutUnit.gear_units where status IN {DEPLOYED, HARVESTING}" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lease application / tenure state", constraints: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | PENDING_DECISION | APPROVED | DENIED" }
      - { name: navigation_clearance, type: enum, source: system, default: PENDING, description: "Navigation review outcome for the current review round", constraints: "PENDING | CLEARED | OBJECTION" }
      - { name: environmental_clearance, type: enum, source: system, default: PENDING, description: "Environmental review outcome for the current review round", constraints: "PENDING | CLEARED | OBJECTION" }
      - { name: navigation_reviewer_user_id, type: string, source: system, description: "X-User-ID of the SitingReviewer that recorded the navigation clearance in the current round; null when PENDING" }
      - { name: environmental_reviewer_user_id, type: string, source: system, description: "X-User-ID of the SitingReviewer that recorded the environmental clearance in the current round; null when PENDING" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Number of completed revision cycles; incremented when the lease re-enters UNDER_REVIEW from REVISION_REQUESTED" }
      - { name: rent_paid_through_date, type: string, source: system, description: "Calendar date (YYYY-MM-DD) through which annual rent is paid; null until the approval decision stamps it" }
      - { name: royalty_accrued_cents, type: integer, source: computed, default: 0, description: "= sum of HarvestLot.lot_settlement_cents over lots of this lease whose status != VOIDED" }
      - { name: decided_at, type: datetime, source: system, description: "Instant the authority recorded APPROVE or DENY; null before the decision" }

  - name: Hatchery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hatchery business name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the hatchery", constraints: "exactly 2 uppercase letters" }
      - { name: ncsp_certificate_no, type: string, source: input, description: "National Shellfish Sanitation Program hatchery certificate number", constraints: "unique across hatcheries" }
      - { name: certificate_expires_on, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the hatchery certificate expires" }
      - { name: pathogen_free_species, type: array, source: input, description: "Species this hatchery is certified pathogen-free for", constraints: "non-empty subset of CRASSOSTREA_VIRGINICA | MERCENARIA_MERCENARIA | MYTILUS_EDULIS" }

  - name: SeedLot
    parent: null
    common_fields: true
    fields:
      - { name: hatchery_id, type: string, source: input, description: "FK -> Hatchery.id; hatchery that shipped the seed" }
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; destination lease for the seed" }
      - { name: species, type: enum, source: input, description: "Species shipped", constraints: "CRASSOSTREA_VIRGINICA | MERCENARIA_MERCENARIA | MYTILUS_EDULIS" }
      - { name: received_seed_count, type: integer, source: input, description: "Seed animals received from the hatchery", constraints: ">= 1" }
      - { name: disease_certificate_no, type: string, source: input, description: "Disease-free certificate number accompanying the shipment" }
      - { name: disease_cert_issued_on, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the disease certificate was issued" }
      - { name: shipped_on, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the seed shipped from the hatchery" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Seed-lot lifecycle state", constraints: "RECEIVED | SCREENED | NURSERY | READY_FOR_PLANTING | PLANTED | REJECTED" }
      - { name: screening_result, type: enum, source: system, description: "Authority pathogen screening outcome; null before screening", constraints: "NEGATIVE | POSITIVE" }
      - { name: screened_on, type: string, source: system, description: "Calendar date (YYYY-MM-DD) the authority screening was performed; null before screening" }
      - { name: nursery_started_on, type: string, source: system, description: "Calendar date nursery grow-out began; null before nursery-start" }
      - { name: nursery_system, type: enum, source: system, description: "Nursery system in use; null before nursery-start", constraints: "UPWELLER | FLOAT_UPWELLER | RACK" }
      - { name: nursery_completed_on, type: string, source: system, description: "Calendar date nursery grow-out completed; null before nursery-complete" }
      - { name: surviving_seed_count, type: integer, source: system, description: "Seed animals surviving nursery grow-out; null before nursery-complete" }
      - { name: survival_rate_pct, type: number, source: computed, description: "= round(100 * surviving_seed_count / received_seed_count, 2); null before nursery-complete" }
      - { name: allocated_seed_count, type: integer, source: computed, default: 0, description: "= sum of GrowoutUnit.seed_count_planted where status IN {DEPLOYED, HARVESTING, RETRIEVED}" }
      - { name: unallocated_seed_count, type: integer, source: computed, default: 0, description: "= surviving_seed_count - allocated_seed_count; 0 before nursery-complete" }

  - name: GrowoutUnit
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease the gear is deployed on" }
      - { name: seed_lot_id, type: string, source: input, description: "FK -> SeedLot.id; seed planted into this gear" }
      - { name: plot_code, type: string, source: input, description: "Plot inside the lease footprint", constraints: "must be a member of Lease.plot_codes" }
      - { name: gear_type, type: enum, source: input, description: "Grow-out gear", constraints: "BOTTOM | RACK_AND_BAG | FLOATING_BAG; must be a member of Lease.gear_types_permitted" }
      - { name: gear_units, type: integer, source: input, description: "Countable gear units (bags, cages or bottom-acre units) occupied by this deployment", constraints: ">= 1" }
      - { name: seed_count_planted, type: integer, source: input, description: "Seed animals drawn from the seed lot for this deployment", constraints: ">= 1" }
      - { name: deployed_on, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the gear went into the water" }
      - { name: planned_retrieval_on, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the gear is planned to come out; exclusive end of the plot occupation interval" }
      - { name: status, type: enum, source: system, default: DEPLOYED, description: "Grow-out gear state", constraints: "DEPLOYED | HARVESTING | RETRIEVED | VOIDED" }
      - { name: retrieved_on, type: string, source: system, description: "Calendar date gear was retrieved; null until retrieval" }
      - { name: void_reason, type: enum, source: system, description: "Why the deployment was voided; null unless status = VOIDED", constraints: "OPERATOR_CORRECTION | SEED_LOT_REJECTED" }
      - { name: last_inspection_at, type: datetime, source: computed, description: "performed_at of the newest HusbandryLog with log_type = INSPECTION; null when none exists" }
      - { name: last_predator_control_at, type: datetime, source: computed, description: "performed_at of the newest HusbandryLog with log_type = PREDATOR_CONTROL; null when none exists" }
      - { name: husbandry_current, type: boolean, source: computed, description: "Per calculations.growout_husbandry_currency, evaluated against the logical clock" }
      - { name: mortality_count_total, type: integer, source: computed, default: 0, description: "= sum of HusbandryLog.mortality_count over this unit's logs" }

  - name: HusbandryLog
    parent: null
    common_fields: false
    fields:
      - { name: growout_unit_id, type: string, source: input, description: "FK -> GrowoutUnit.id; unit the husbandry work was performed on" }
      - { name: log_type, type: enum, source: input, description: "Husbandry activity recorded", constraints: "INSPECTION | PREDATOR_CONTROL | DENSITY_THINNING | GEAR_MAINTENANCE" }
      - { name: performed_at, type: datetime, source: input, description: "Instant the work was performed; must be <= the logical clock" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the FarmOperator that recorded the log" }
      - { name: predator_species, type: enum, source: input, description: "Predator addressed; required when log_type = PREDATOR_CONTROL", constraints: "OYSTER_DRILL | BLUE_CRAB | COWNOSE_RAY | SEA_STAR" }
      - { name: control_method, type: enum, source: input, description: "Predator control method; required when log_type = PREDATOR_CONTROL", constraints: "NETTING | TRAPPING | MANUAL_REMOVAL | FENCING" }
      - { name: mortality_count, type: integer, source: input, default: 0, description: "Dead animals counted during the activity", constraints: ">= 0" }
      - { name: notes, type: string, source: input, description: "Free-text observation" }

  - name: WaterSample
    parent: null
    common_fields: false
    fields:
      - { name: growing_area_id, type: string, source: input, description: "FK -> GrowingArea.id; area the sample was drawn from" }
      - { name: station_code, type: string, source: input, description: "Sampling station inside the area" }
      - { name: collected_at, type: datetime, source: input, description: "Instant the sample was collected; must be <= the logical clock" }
      - { name: fecal_coliform_mpn, type: number, source: input, description: "Fecal coliform most-probable-number per 100 mL", constraints: ">= 1" }
      - { name: water_temp_c, type: number, source: input, description: "Water temperature in Celsius at collection" }
      - { name: salinity_ppt, type: number, source: input, description: "Salinity in parts per thousand" }
      - { name: sample_status, type: enum, source: system, default: ACCEPTED, description: "ACCEPTED samples enter the statistics; a sample is SUPERSEDED when a later sample shares its station_code and its collected_at calendar date", constraints: "ACCEPTED | SUPERSEDED" }
      - { name: is_adverse_condition, type: boolean, source: computed, description: "True when collected_at falls within ADVERSE_WINDOW_HOURS after the observed_at of a qualifying RainfallEvent for the same area" }
      - { name: counted_clean, type: boolean, source: computed, description: "True when sample_status = ACCEPTED, collected_at > GrowingArea.last_closure_started_at and fecal_coliform_mpn <= GrowingArea.clean_sample_mpn_limit" }

  - name: RainfallEvent
    parent: null
    common_fields: false
    fields:
      - { name: growing_area_id, type: string, source: input, description: "FK -> GrowingArea.id; area the gauge serves" }
      - { name: gauge_code, type: string, source: input, description: "Rain gauge identifier" }
      - { name: observed_at, type: datetime, source: input, description: "End instant of the 24-hour accumulation window; must be <= the logical clock" }
      - { name: inches_24h, type: number, source: input, description: "Rainfall accumulation in inches over the 24 hours ending at observed_at", constraints: ">= 0; 2 decimals" }
      - { name: triggered_closure, type: boolean, source: computed, description: "True when inches_24h >= GrowingArea.rainfall_closure_threshold_in at ingest time" }
      - { name: voided_authorization_count, type: integer, source: computed, default: 0, description: "HarvestAuthorizations voided by the cascade this event started" }

  - name: HarvestVessel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vessel name" }
      - { name: registration_no, type: string, source: input, description: "State vessel registration number", constraints: "unique across vessels" }
      - { name: refrigeration_type, type: enum, source: input, description: "On-board temperature control", constraints: "NONE | ICE_SLURRY | MECHANICAL" }
      - { name: concurrent_authorization_capacity, type: integer, source: input, default: 2, description: "Maximum HarvestAuthorizations in status IN {ISSUED, ACTIVE} whose windows may overlap on this vessel", constraints: ">= 1" }
      - { name: active_authorization_count, type: integer, source: computed, default: 0, description: "HarvestAuthorizations on this vessel with status IN {ISSUED, ACTIVE}" }

  - name: HarvestAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease being harvested" }
      - { name: growout_unit_id, type: string, source: input, description: "FK -> GrowoutUnit.id; gear being harvested" }
      - { name: vessel_id, type: string, source: input, description: "FK -> HarvestVessel.id; vessel that will carry the shellstock" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; certified dealer that will receive the shellstock" }
      - { name: growing_area_id, type: string, source: computed, description: "Denormalised copy of Lease.growing_area_id captured at issue time; not an independent reference — reconciled per calculations.authorization_area_denormalisation" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the permitted harvest window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the permitted harvest window" }
      - { name: projected_bushels, type: integer, source: input, description: "Bushels the operator projects to land under this authorization", constraints: ">= 1" }
      - { name: harvested_bushels, type: integer, source: computed, default: 0, description: "= sum of HarvestLot.bushels over this authorization's lots whose status != VOIDED" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "Authorization state", constraints: "ISSUED | ACTIVE | CLOSED | VOIDED" }
      - { name: harvest_start_at, type: datetime, source: system, description: "Instant harvesting began; null before activation" }
      - { name: harvest_end_at, type: datetime, source: system, description: "Instant harvesting closed; null before close" }
      - { name: void_reason, type: enum, source: system, description: "Why the authorization was voided; null unless status = VOIDED", constraints: "AREA_CLOSURE | SEED_LOT_REJECTED" }

  - name: HarvestLot
    parent: null
    common_fields: true
    fields:
      - { name: harvest_authorization_id, type: string, source: input, description: "FK -> HarvestAuthorization.id; authorization the shellstock was landed under" }
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; copied from the authorization's dealer at landing" }
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; set when the lot is placed on a shipment, null otherwise" }
      - { name: lot_code, type: string, source: input, description: "Operator lot code printed on the tag", constraints: "unique across harvest lots" }
      - { name: bushels, type: integer, source: input, description: "Bushels landed in this lot", constraints: ">= 1" }
      - { name: first_out_of_water_at, type: datetime, source: input, description: "Instant the first shellstock in this lot left the water; starts the regulatory time-to-temperature clock" }
      - { name: last_out_of_water_at, type: datetime, source: input, description: "Instant the last shellstock in this lot left the water" }
      - { name: placed_in_temperature_control_at, type: datetime, source: input, description: "Instant the lot entered mechanical refrigeration or ice" }
      - { name: water_temp_c, type: number, source: input, description: "Water temperature in Celsius at harvest" }
      - { name: ttt_minutes_first_basis, type: integer, source: computed, description: "Time-to-temperature minutes on the FIRST_HARVEST_BASIS variant" }
      - { name: ttt_minutes_last_basis, type: integer, source: computed, description: "Time-to-temperature minutes on the LAST_HARVEST_BASIS variant" }
      - { name: ttt_basis_variant, type: enum, source: computed, description: "Which basis governs compliance for this lot, selected from GrowingArea.classification at landing per calculations.harvest_lot_time_to_temperature", constraints: "FIRST_HARVEST_BASIS | LAST_HARVEST_BASIS" }
      - { name: governing_ttt_minutes, type: integer, source: computed, description: "= ttt_minutes_first_basis when ttt_basis_variant = FIRST_HARVEST_BASIS, else ttt_minutes_last_basis" }
      - { name: allowed_ttt_minutes, type: integer, source: computed, description: "Per calculations.vibrio_allowed_time_to_temperature_minutes" }
      - { name: vibrio_control_plan_id, type: string, source: computed, description: "FK -> VibrioControlPlan.id; the ACTIVE plan selected for vibrio_plan_month at landing" }
      - { name: vibrio_plan_month, type: integer, source: computed, description: "Calendar month (1-12, UTC) of first_out_of_water_at used to select the vibrio plan" }
      - { name: compliance_status, type: enum, source: computed, description: "COMPLIANT when governing_ttt_minutes <= allowed_ttt_minutes, else NONCOMPLIANT", constraints: "COMPLIANT | NONCOMPLIANT" }
      - { name: status, type: enum, source: system, default: HARVESTED, description: "Lot lifecycle state", constraints: "HARVESTED | TAGGED | SHIPPED | EMBARGOED | RECALLED | VOIDED" }
      - { name: tag_harvest_date, type: string, source: system, description: "Harvest date printed on the tag; null before tagging" }
      - { name: tag_area_code, type: string, source: system, description: "GrowingArea.code stamped onto the tag at tagging; null before tagging" }
      - { name: tag_lease_code, type: string, source: system, description: "Lease.lease_code stamped onto the tag at tagging; null before tagging" }
      - { name: tag_dealer_certification_no, type: string, source: system, description: "Dealer certification number printed on the tag; null before tagging" }
      - { name: season_total_bushels_at_creation, type: integer, source: computed, description: "Season-to-date bushels on the lease including this lot, per calculations.lease_harvest_settlement step 1" }
      - { name: royalty_rate_cents_per_bushel, type: integer, source: computed, description: "Tier rate selected in calculations.lease_harvest_settlement step 2" }
      - { name: royalty_cents, type: integer, source: computed, description: "= royalty_rate_cents_per_bushel * bushels" }
      - { name: inspection_fee_cents, type: integer, source: computed, description: "Flat inspection fee, waived to 0 when royalty_cents >= INSPECTION_FEE_WAIVER_CENTS" }
      - { name: conservation_surcharge_cents, type: integer, source: computed, description: "Surcharge rounded once per lot, per calculations.lease_harvest_settlement step 4" }
      - { name: lot_settlement_cents, type: integer, source: computed, description: "= royalty_cents + inspection_fee_cents + conservation_surcharge_cents" }
      - { name: embargo_reason, type: enum, source: system, description: "Why the lot was embargoed; null unless status = EMBARGOED", constraints: "AREA_CLOSURE" }
      - { name: void_reason, type: enum, source: system, description: "Why the lot was voided; null unless status = VOIDED", constraints: "OPERATOR_CORRECTION" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealer business name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the dealer's certified facility", constraints: "exactly 2 uppercase letters" }
      - { name: certification_category, type: enum, source: input, description: "Dealer certification category", constraints: "SHELLSTOCK_SHIPPER | SHUCKER_PACKER | REPACKER | DEPURATION_PROCESSOR" }
      - { name: certification_no, type: string, source: input, description: "State dealer certification number printed on tags", constraints: "unique across dealers" }
      - { name: certified_through, type: string, source: input, description: "Calendar date (YYYY-MM-DD) the dealer certification lapses" }
      - { name: icssl_listed_through, type: string, source: system, description: "Calendar date the Interstate Certified Shellfish Shippers List entry lapses; null when never listed" }
      - { name: listing_status, type: enum, source: system, default: NOT_LISTED, description: "Interstate shipper listing dimension", constraints: "NOT_LISTED | LISTED | SUSPENDED" }
      - { name: recall_strike_count, type: integer, source: computed, default: 0, description: "Shipments of this dealer recalled by a confirmed illness investigation" }
      - { name: suspension_reason, type: enum, source: system, description: "Why the listing was suspended; null unless listing_status = SUSPENDED", constraints: "RECALL_STRIKES | AUTHORITY_ACTION" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; shipping dealer" }
      - { name: destination_state, type: string, source: input, description: "Two-letter destination state code", constraints: "exactly 2 uppercase letters" }
      - { name: carrier, type: string, source: input, description: "Carrier moving the shellstock" }
      - { name: lot_ids, type: array, source: input, description: "HarvestLot ids consigned on this shipment", constraints: "1-25 ids, all TAGGED and COMPLIANT at creation" }
      - { name: lot_count, type: integer, source: computed, description: "= length of lot_ids" }
      - { name: total_bushels, type: integer, source: computed, description: "= sum of HarvestLot.bushels over lot_ids" }
      - { name: is_interstate, type: boolean, source: computed, description: "= destination_state != Dealer.state_code" }
      - { name: status, type: enum, source: system, default: CREATED, description: "Shipment state", constraints: "CREATED | SHIPPED | HELD | RECALLED" }
      - { name: shipped_at, type: datetime, source: system, description: "Instant the shipment left the dealer; null before shipping" }
      - { name: held_reason, type: enum, source: system, description: "Why the shipment is held; null unless status = HELD", constraints: "LOT_EMBARGO | DEALER_SUSPENSION" }
      - { name: recall_reason, type: enum, source: system, description: "Why the shipment was recalled; null unless status = RECALLED", constraints: "ILLNESS_TRACEBACK" }

  - name: IllnessInvestigation
    parent: null
    common_fields: true
    fields:
      - { name: source_shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment named in the illness report" }
      - { name: reported_at, type: datetime, source: input, description: "Instant the illness cluster was reported; must be <= the logical clock" }
      - { name: illness_count, type: integer, source: input, description: "Reported illnesses in the cluster", constraints: ">= 1" }
      - { name: pathogen, type: enum, source: input, description: "Suspected pathogen", constraints: "VIBRIO_PARAHAEMOLYTICUS | VIBRIO_VULNIFICUS | NOROVIRUS | SALMONELLA" }
      - { name: scope_variant, type: enum, source: system, description: "Traceback scope selected by the authority; null before traceback", constraints: "NARROW | BROAD" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Investigation state", constraints: "OPEN | TRACEBACK | CONFIRMED | CLOSED_UNSUBSTANTIATED" }
      - { name: traced_lot_ids, type: array, source: computed, description: "HarvestLot ids inside the traceback scope, ordered by HarvestLot.created_at ASC; empty before traceback" }
      - { name: traced_lot_count, type: integer, source: computed, default: 0, description: "= length of traced_lot_ids" }
      - { name: recalled_shipment_count, type: integer, source: computed, default: 0, description: "Distinct shipments moved to RECALLED by this investigation's confirmation" }
      - { name: confirmed_at, type: datetime, source: system, description: "Instant the authority confirmed the traceback; null before confirmation" }

  - name: VibrioControlPlan
    parent: null
    common_fields: true
    fields:
      - { name: season_month, type: integer, source: input, description: "Calendar month the plan governs", constraints: "1-12" }
      - { name: max_time_to_temperature_minutes, type: integer, source: input, description: "Baseline minutes allowed from first shellstock out of water to temperature control", constraints: ">= 60" }
      - { name: high_water_temp_c, type: number, source: input, description: "Water temperature at or above which the high-temperature reduction applies" }
      - { name: high_temp_reduction_minutes, type: integer, source: input, description: "Minutes subtracted when water_temp_c >= high_water_temp_c", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Plan state; creating a plan for a month that already has an ACTIVE plan supersedes the incumbent", constraints: "ACTIVE | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # GrowingArea carries TWO independent status dimensions. `classification` is
  # the sanitary classification; `harvest_status` is harvest availability. They
  # advance through different triggers and are stored on the same row.
  # ---------------------------------------------------------------------------
  - entity: GrowingArea
    state_field: classification
    initial_state: APPROVED
    terminal_states: []
    restrictiveness_rank: "APPROVED=0 < CONDITIONALLY_APPROVED=1 < RESTRICTED=2 < PROHIBITED=3"
    transitions:
      - from: APPROVED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=CONDITIONALLY_APPROVED"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
          - "conditional_management_plan_on_file == true"
          - "eligible_classification IN {APPROVED, RESTRICTED}"
        side_effects:
          - "classification = CONDITIONALLY_APPROVED"
          - "harvest_status is NOT touched by this transition"
          - "increments GrowingArea.version by 1"
      - from: APPROVED
        to: RESTRICTED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=RESTRICTED (downgrade)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
        side_effects:
          - "classification = RESTRICTED"
          - "harvest_status is NOT touched by this transition"
          - "increments GrowingArea.version by 1"
        note: "Downgrades (rank increases) never require data support; upgrades do."
      - from: APPROVED
        to: PROHIBITED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=PROHIBITED (downgrade, may skip ranks)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
        side_effects:
          - "classification = PROHIBITED"
          - "PROHIBITED coupling: harvest_status = CLOSED_SAMPLE_FAILURE, last_closure_started_at = logical clock, consecutive_clean_samples = 0"
          - "cascade hop 1: every HarvestAuthorization with status IN {ISSUED, ACTIVE} whose lease.growing_area_id == this area -> VOIDED (void_reason = AREA_CLOSURE)"
          - "cascade hop 2: each authorization voided in hop 1 releases its vessel (active_authorization_count - 1) and returns its GrowoutUnit from HARVESTING to DEPLOYED"
          - "cascade hop 3: each authorization voided in hop 1 embargoes its HarvestLots with status IN {HARVESTED, TAGGED} -> EMBARGOED (embargo_reason = AREA_CLOSURE)"
          - "cascade hop 4: each lot embargoed in hop 3 whose shipment_id is set and whose Shipment.status == CREATED -> Shipment.status = HELD (held_reason = LOT_EMBARGO)"
          - "increments GrowingArea.version by 1"
      - from: CONDITIONALLY_APPROVED
        to: RESTRICTED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=RESTRICTED (downgrade)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
        side_effects:
          - "classification = RESTRICTED"
          - "increments GrowingArea.version by 1"
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=APPROVED (one-rank upgrade)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
          - "eligible_classification == APPROVED"
        side_effects:
          - "classification = APPROVED"
          - "increments GrowingArea.version by 1"
      - from: RESTRICTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=CONDITIONALLY_APPROVED (one-rank upgrade)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
          - "conditional_management_plan_on_file == true"
          - "eligible_classification IN {APPROVED, RESTRICTED}"
        side_effects:
          - "classification = CONDITIONALLY_APPROVED"
          - "increments GrowingArea.version by 1"
      - from: RESTRICTED
        to: PROHIBITED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=PROHIBITED (downgrade)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
        side_effects:
          - "classification = PROHIBITED"
          - "PROHIBITED coupling and the four cascade hops declared on APPROVED -> PROHIBITED fire identically"
          - "increments GrowingArea.version by 1"
      - from: PROHIBITED
        to: RESTRICTED
        trigger: "POST /shellfish/growing-areas/{id}/classification-decisions with classification=RESTRICTED (one-rank upgrade)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_area_version == GrowingArea.version"
          - "accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
          - "eligible_classification IN {APPROVED, RESTRICTED}"
        side_effects:
          - "classification = RESTRICTED"
          - "harvest_status stays CLOSED_SAMPLE_FAILURE — reopening is a separate transition on the other dimension"
          - "increments GrowingArea.version by 1"
        note: "PROHIBITED -> APPROVED and PROHIBITED -> CONDITIONALLY_APPROVED are rejected with ERR_CLASSIFICATION_STEP_SKIPPED; upgrades move one rank per decision."
      - from: APPROVED
        to: RESTRICTED
        trigger: "system sample sweep on POST /shellfish/growing-areas/{id}/water-samples"
        actor: system
        preconditions:
          - "after ingest, accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
          - "recomputed SYSTEMATIC_RANDOM geometric_mean_mpn > GEOMEAN_APPROVED_LIMIT (14.0)"
          - "restrictiveness_rank(eligible_classification) == 2 (RESTRICTED)"
        side_effects:
          - "classification = RESTRICTED"
          - "harvest_status = CLOSED_SAMPLE_FAILURE, last_closure_started_at = logical clock, consecutive_clean_samples = 0"
          - "the same four cascade hops declared on APPROVED -> PROHIBITED fire"
          - "increments GrowingArea.version by 1"
        note: "The sweep trigger is the geometric mean alone. p90 exceedance changes eligible_classification but never auto-closes the area."
      - from: APPROVED
        to: PROHIBITED
        trigger: "system sample sweep on POST /shellfish/growing-areas/{id}/water-samples"
        actor: system
        preconditions:
          - "after ingest, accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
          - "recomputed SYSTEMATIC_RANDOM geometric_mean_mpn > GEOMEAN_APPROVED_LIMIT (14.0)"
          - "restrictiveness_rank(eligible_classification) == 3 (PROHIBITED)"
        side_effects:
          - "classification = PROHIBITED"
          - "harvest_status = CLOSED_SAMPLE_FAILURE, last_closure_started_at = logical clock, consecutive_clean_samples = 0"
          - "the same four cascade hops declared on APPROVED -> PROHIBITED fire"
          - "increments GrowingArea.version by 1"

  - entity: GrowingArea
    state_field: harvest_status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED_RAINFALL
        trigger: "POST /shellfish/growing-areas/{id}/rainfall-events with inches_24h >= rainfall_closure_threshold_in"
        actor: ShellfishControlAuthority
        preconditions:
          - "observed_at <= logical clock"
          - "inches_24h >= GrowingArea.rainfall_closure_threshold_in (>= is inclusive; exactly equal closes)"
        side_effects:
          - "RainfallEvent.triggered_closure = true"
          - "harvest_status = CLOSED_RAINFALL"
          - "last_closure_started_at = RainfallEvent.observed_at; closure_reopen_eligible_at = observed_at + rainfall_closure_hours; consecutive_clean_samples = 0"
          - "classification is NOT touched by this transition"
          - "cascade hop 1: every HarvestAuthorization with status IN {ISSUED, ACTIVE} whose lease.growing_area_id == this area -> VOIDED (void_reason = AREA_CLOSURE); RainfallEvent.voided_authorization_count records the count"
          - "cascade hop 2: each authorization voided in hop 1 embargoes its HarvestLots with status IN {HARVESTED, TAGGED} -> EMBARGOED (embargo_reason = AREA_CLOSURE)"
          - "cascade hop 3: each lot embargoed in hop 2 whose shipment_id is set and whose Shipment.status == CREATED -> Shipment.status = HELD (held_reason = LOT_EMBARGO)"
          - "cascade hop 2b (same hop as hop 2, on the authorization itself): the voided authorization releases its vessel (active_authorization_count - 1) and returns its GrowoutUnit from HARVESTING to DEPLOYED"
          - "increments GrowingArea.version by 1"
      - from: CLOSED_RAINFALL
        to: CLOSED_RAINFALL
        trigger: "POST /shellfish/growing-areas/{id}/rainfall-events with inches_24h >= rainfall_closure_threshold_in while already closed for rainfall"
        actor: ShellfishControlAuthority
        preconditions:
          - "observed_at <= logical clock"
          - "observed_at > last_closure_started_at"
        side_effects:
          - "closure restarts: last_closure_started_at = new observed_at; closure_reopen_eligible_at = observed_at + rainfall_closure_hours; consecutive_clean_samples = 0"
          - "the three cascade hops above fire again against whatever is still open"
          - "increments GrowingArea.version by 1"
      - from: CLOSED_RAINFALL
        to: CLOSED_SAMPLE_FAILURE
        trigger: "system sample sweep on POST /shellfish/growing-areas/{id}/water-samples"
        actor: system
        preconditions:
          - "the classification sample-sweep preconditions hold (geometric_mean_mpn > 14.0 and accepted_sample_count >= 5)"
        side_effects:
          - "harvest_status = CLOSED_SAMPLE_FAILURE; last_closure_started_at = logical clock; consecutive_clean_samples = 0"
          - "closure_reopen_eligible_at = logical clock + rainfall_closure_hours"
      - from: OPEN
        to: CLOSED_SAMPLE_FAILURE
        trigger: "system: classification downgrade into PROHIBITED, or the sample sweep"
        actor: system
        preconditions:
          - "the triggering classification transition's preconditions hold"
        side_effects:
          - "harvest_status = CLOSED_SAMPLE_FAILURE; last_closure_started_at = logical clock; closure_reopen_eligible_at = logical clock + rainfall_closure_hours; consecutive_clean_samples = 0"
      - from: CLOSED_RAINFALL
        to: OPEN
        trigger: "POST /shellfish/growing-areas/{id}/reopen"
        actor: ShellfishControlAuthority
        preconditions:
          - "classification != PROHIBITED"
          - "logical clock >= closure_reopen_eligible_at (>= is inclusive)"
          - "consecutive_clean_samples >= reopen_sample_count_required"
        side_effects:
          - "harvest_status = OPEN; consecutive_clean_samples = 0; closure_reopen_eligible_at = null; last_closure_started_at is retained for the audit trail"
          - "classification is NOT touched by this transition"
          - "increments GrowingArea.version by 1"
      - from: CLOSED_SAMPLE_FAILURE
        to: OPEN
        trigger: "POST /shellfish/growing-areas/{id}/reopen"
        actor: ShellfishControlAuthority
        preconditions:
          - "classification != PROHIBITED"
          - "logical clock >= closure_reopen_eligible_at (>= is inclusive)"
          - "consecutive_clean_samples >= reopen_sample_count_required"
        side_effects:
          - "harvest_status = OPEN; consecutive_clean_samples = 0; closure_reopen_eligible_at = null"
          - "increments GrowingArea.version by 1"

  - entity: Lease
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /shellfish/leases/{id}/submit"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "GrowingArea.classification != PROHIBITED"
        side_effects:
          - "navigation_clearance = PENDING; environmental_clearance = PENDING; both reviewer ids = null"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /shellfish/leases/{id}/navigation-review or /environmental-review with decision=CLEARED while the sibling clearance is still PENDING (fork leg 1)"
        actor: SitingReviewer
        preconditions:
          - "the addressed clearance field == PENDING"
          - "acting X-User-ID != the sibling clearance's reviewer id (segregation of duties)"
        side_effects:
          - "the addressed clearance field = CLEARED and its reviewer id = acting X-User-ID"
          - "status stays UNDER_REVIEW because the join condition is not yet met"
      - from: UNDER_REVIEW
        to: PENDING_DECISION
        trigger: "POST /shellfish/leases/{id}/navigation-review or /environmental-review with decision=CLEARED completing the join"
        actor: SitingReviewer
        preconditions:
          - "the addressed clearance field == PENDING"
          - "the sibling clearance field == CLEARED"
          - "acting X-User-ID != the sibling clearance's reviewer id (segregation of duties)"
        side_effects:
          - "the addressed clearance field = CLEARED and its reviewer id = acting X-User-ID"
          - "status = PENDING_DECISION (join of both review legs)"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /shellfish/leases/{id}/navigation-review with decision=OBJECTION (navigation branch)"
        actor: SitingReviewer
        preconditions:
          - "navigation_clearance == PENDING"
          - "acting X-User-ID != environmental_reviewer_user_id"
        side_effects:
          - "navigation_clearance = OBJECTION; navigation_reviewer_user_id = acting X-User-ID"
          - "environmental_clearance is LEFT AS IS (a recorded CLEARED survives a navigation objection)"
          - "status = REVISION_REQUESTED"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /shellfish/leases/{id}/environmental-review with decision=OBJECTION (environmental branch)"
        actor: SitingReviewer
        preconditions:
          - "environmental_clearance == PENDING"
          - "acting X-User-ID != navigation_reviewer_user_id"
        side_effects:
          - "environmental_clearance = OBJECTION; environmental_reviewer_user_id = acting X-User-ID"
          - "navigation_clearance is RESET to PENDING and navigation_reviewer_user_id = null (an environmental objection invalidates the navigation finding because the footprint will move)"
          - "status = REVISION_REQUESTED"
        note: "The two objection branches diverge in their side-effect sets — this is the branch asymmetry the benchmark tests."
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /shellfish/leases/{id}/submit (resubmission, cycle)"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "revision_round < MAX_REVISION_ROUNDS (3)"
          - "GrowingArea.classification != PROHIBITED"
        side_effects:
          - "revision_round = revision_round + 1"
          - "navigation_clearance = PENDING; environmental_clearance = PENDING; both reviewer ids = null"
          - "status = UNDER_REVIEW"
      - from: PENDING_DECISION
        to: APPROVED
        trigger: "POST /shellfish/leases/{id}/decision with decision=APPROVE"
        actor: ShellfishControlAuthority
        preconditions:
          - "navigation_clearance == CLEARED and environmental_clearance == CLEARED"
          - "GrowingArea.classification != PROHIBITED"
        side_effects:
          - "status = APPROVED; decided_at = logical clock"
          - "rent_paid_through_date = payload rent_paid_through_date when supplied, else the logical clock's calendar date"
      - from: PENDING_DECISION
        to: DENIED
        trigger: "POST /shellfish/leases/{id}/decision with decision=DENY"
        actor: ShellfishControlAuthority
        preconditions:
          - "navigation_clearance == CLEARED and environmental_clearance == CLEARED"
        side_effects:
          - "status = DENIED; decided_at = logical clock"

  - entity: SeedLot
    state_field: status
    initial_state: RECEIVED
    terminal_states: [REJECTED]
    transitions:
      - from: RECEIVED
        to: SCREENED
        trigger: "POST /shellfish/seed-lots/{id}/screening with result=NEGATIVE"
        actor: ShellfishControlAuthority
        preconditions:
          - "screened_on >= shipped_on and screened_on <= logical clock calendar date"
        side_effects:
          - "screening_result = NEGATIVE; status = SCREENED"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /shellfish/seed-lots/{id}/screening with result=POSITIVE"
        actor: ShellfishControlAuthority
        preconditions:
          - "screened_on >= shipped_on and screened_on <= logical clock calendar date"
        side_effects:
          - "screening_result = POSITIVE; status = REJECTED"
          - "cascade hop 1: every GrowoutUnit of this seed lot with status IN {DEPLOYED, HARVESTING} -> VOIDED (void_reason = SEED_LOT_REJECTED)"
          - "cascade hop 2: each unit voided in hop 1 releases its gear from Lease.deployed_gear_units and its seed from SeedLot.allocated_seed_count"
          - "cascade hop 3: each unit voided in hop 1 voids its HarvestAuthorizations with status IN {ISSUED, ACTIVE} -> VOIDED (void_reason = SEED_LOT_REJECTED), releasing vessel capacity"
      - from: SCREENED
        to: NURSERY
        trigger: "POST /shellfish/seed-lots/{id}/nursery-start"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id of SeedLot.lease_id"
          - "nursery_started_on >= shipped_on and <= logical clock calendar date"
        side_effects:
          - "nursery_started_on and nursery_system stamped; status = NURSERY"
      - from: NURSERY
        to: READY_FOR_PLANTING
        trigger: "POST /shellfish/seed-lots/{id}/nursery-complete"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id of SeedLot.lease_id"
          - "nursery_completed_on >= nursery_started_on + MIN_NURSERY_DAYS (21)"
          - "nursery_completed_on <= logical clock calendar date"
          - "surviving_seed_count <= received_seed_count"
          - "survival_rate_pct >= SURVIVAL_FLOOR_PCT (40.00)"
        side_effects:
          - "surviving_seed_count, nursery_completed_on stamped; survival_rate_pct computed"
          - "unallocated_seed_count = surviving_seed_count; allocated_seed_count = 0; status = READY_FOR_PLANTING"
      - from: READY_FOR_PLANTING
        to: PLANTED
        trigger: "system: POST /shellfish/growout-units allocates the last unallocated seed"
        actor: system
        preconditions:
          - "after the deployment, unallocated_seed_count == 0"
        side_effects:
          - "status = PLANTED (compound bubble-up from the seed lot's GrowoutUnits)"
      - from: PLANTED
        to: READY_FOR_PLANTING
        trigger: "system: POST /shellfish/growout-units/{id}/void releases seed back to the lot"
        actor: system
        preconditions:
          - "after the void, unallocated_seed_count > 0"
        side_effects:
          - "status = READY_FOR_PLANTING"

  - entity: GrowoutUnit
    state_field: status
    initial_state: DEPLOYED
    terminal_states: [RETRIEVED, VOIDED]
    transitions:
      - from: DEPLOYED
        to: HARVESTING
        trigger: "POST /shellfish/harvest-authorizations/{id}/activate"
        actor: FarmOperator
        preconditions:
          - "the activating authorization references this unit"
        side_effects:
          - "status = HARVESTING"
      - from: HARVESTING
        to: DEPLOYED
        trigger: "POST /shellfish/harvest-authorizations/{id}/close, or a cascade that voids the active authorization"
        actor: FarmOperator | system
        preconditions:
          - "the closing or voided authorization references this unit"
        side_effects:
          - "status = DEPLOYED (the gear stays in the water between harvest windows — this is the grow-out cycle)"
      - from: DEPLOYED
        to: RETRIEVED
        trigger: "POST /shellfish/growout-units/{id}/retrieve"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "no HarvestAuthorization of this unit has status IN {ISSUED, ACTIVE}"
          - "retrieved_on <= logical clock calendar date"
        side_effects:
          - "status = RETRIEVED; retrieved_on stamped"
          - "Lease.deployed_gear_units - gear_units"
          - "SeedLot.allocated_seed_count is NOT released (the animals were harvested, not returned)"
      - from: DEPLOYED
        to: VOIDED
        trigger: "POST /shellfish/growout-units/{id}/void (operator correction)"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "no HarvestAuthorization of this unit has status IN {ISSUED, ACTIVE, CLOSED}"
          - "no HarvestLot exists under any authorization of this unit"
        side_effects:
          - "status = VOIDED; void_reason = OPERATOR_CORRECTION"
          - "compensation: Lease.deployed_gear_units - gear_units (exactly the amount the deployment added)"
          - "compensation: SeedLot.allocated_seed_count - seed_count_planted and SeedLot.unallocated_seed_count + seed_count_planted"
          - "compensation: the plot occupation interval is released, so the plot fallow window no longer considers this unit"
          - "bubble-up: SeedLot PLANTED -> READY_FOR_PLANTING when unallocated_seed_count becomes > 0"
      - from: DEPLOYED
        to: VOIDED
        trigger: "system: cascade from POST /shellfish/seed-lots/{id}/screening with result=POSITIVE"
        actor: system
        preconditions:
          - "the unit's seed lot moved to REJECTED"
        side_effects:
          - "status = VOIDED; void_reason = SEED_LOT_REJECTED"
          - "Lease.deployed_gear_units - gear_units; SeedLot.allocated_seed_count - seed_count_planted"
      - from: HARVESTING
        to: VOIDED
        trigger: "system: cascade from POST /shellfish/seed-lots/{id}/screening with result=POSITIVE"
        actor: system
        preconditions:
          - "the unit's seed lot moved to REJECTED"
        side_effects:
          - "status = VOIDED; void_reason = SEED_LOT_REJECTED"
          - "the unit's ISSUED/ACTIVE authorizations are voided with void_reason = SEED_LOT_REJECTED"

  - entity: HarvestAuthorization
    state_field: status
    initial_state: ISSUED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /shellfish/harvest-authorizations/{id}/activate"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "GrowingArea.harvest_status == OPEN"
          - "GrowingArea.classification IN {APPROVED, CONDITIONALLY_APPROVED}"
          - "window_start <= harvest_start_at < window_end and harvest_start_at == logical clock"
          - "GrowoutUnit.status == DEPLOYED"
        side_effects:
          - "status = ACTIVE; harvest_start_at stamped"
          - "GrowoutUnit -> HARVESTING"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /shellfish/harvest-authorizations/{id}/close"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "harvest_start_at < harvest_end_at <= logical clock"
        side_effects:
          - "status = CLOSED; harvest_end_at stamped"
          - "GrowoutUnit HARVESTING -> DEPLOYED"
          - "HarvestVessel.active_authorization_count - 1"
      - from: ISSUED
        to: VOIDED
        trigger: "system: area closure cascade (rainfall event, sample sweep, or PROHIBITED decision) or seed-lot rejection cascade"
        actor: system
        preconditions:
          - "the triggering area/seed-lot transition completed"
        side_effects:
          - "status = VOIDED; void_reason = AREA_CLOSURE or SEED_LOT_REJECTED"
          - "HarvestVessel.active_authorization_count - 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "system: area closure cascade or seed-lot rejection cascade"
        actor: system
        preconditions:
          - "the triggering area/seed-lot transition completed"
        side_effects:
          - "status = VOIDED; void_reason = AREA_CLOSURE or SEED_LOT_REJECTED"
          - "GrowoutUnit HARVESTING -> DEPLOYED; HarvestVessel.active_authorization_count - 1"
          - "next hop: this authorization's HarvestLots in {HARVESTED, TAGGED} -> EMBARGOED"

  - entity: HarvestLot
    state_field: status
    initial_state: HARVESTED
    terminal_states: [RECALLED, VOIDED]
    transitions:
      - from: HARVESTED
        to: TAGGED
        trigger: "POST /shellfish/harvest-lots/{id}/tag"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "compliance_status == COMPLIANT"
          - "payload harvest_date == calendar date (UTC) of first_out_of_water_at"
          - "payload dealer_certification_no == Dealer.certification_no of HarvestLot.dealer_id"
          - "Dealer.listing_status != SUSPENDED"
        side_effects:
          - "status = TAGGED; tag_harvest_date, tag_area_code (GrowingArea.code), tag_lease_code (Lease.lease_code), tag_dealer_certification_no stamped"
      - from: TAGGED
        to: SHIPPED
        trigger: "POST /shellfish/shipments/{id}/ship (every lot on the shipment)"
        actor: SeafoodDealer
        preconditions:
          - "the lot is listed in Shipment.lot_ids and the shipment transition's preconditions hold"
        side_effects:
          - "status = SHIPPED"
      - from: HARVESTED
        to: EMBARGOED
        trigger: "system: area closure cascade hop"
        actor: system
        preconditions:
          - "the lot's authorization was voided with void_reason = AREA_CLOSURE"
        side_effects:
          - "status = EMBARGOED; embargo_reason = AREA_CLOSURE"
      - from: TAGGED
        to: EMBARGOED
        trigger: "system: area closure cascade hop"
        actor: system
        preconditions:
          - "the lot's authorization was voided with void_reason = AREA_CLOSURE"
        side_effects:
          - "status = EMBARGOED; embargo_reason = AREA_CLOSURE"
          - "next hop: if shipment_id is set and that Shipment.status == CREATED -> HELD (held_reason = LOT_EMBARGO)"
      - from: HARVESTED
        to: VOIDED
        trigger: "POST /shellfish/harvest-lots/{id}/void"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "shipment_id is null"
        side_effects:
          - "status = VOIDED; void_reason = OPERATOR_CORRECTION"
          - "compensation: Lease.royalty_accrued_cents - lot_settlement_cents, restoring the pre-landing value exactly"
          - "compensation: HarvestAuthorization.harvested_bushels - bushels"
          - "no re-tiering: the royalty_rate_cents_per_bushel already stamped on the surviving lots of the lease is never recomputed"
      - from: TAGGED
        to: VOIDED
        trigger: "POST /shellfish/harvest-lots/{id}/void"
        actor: FarmOperator
        preconditions:
          - "acting X-User-ID == Lease.operator_user_id"
          - "shipment_id is null"
        side_effects:
          - "status = VOIDED; void_reason = OPERATOR_CORRECTION; tag fields retained for the audit trail"
          - "compensation: Lease.royalty_accrued_cents - lot_settlement_cents; HarvestAuthorization.harvested_bushels - bushels"
      - from: SHIPPED
        to: RECALLED
        trigger: "system: POST /shellfish/illness-investigations/{id}/confirm cascade hop 1"
        actor: system
        preconditions:
          - "the lot id is a member of IllnessInvestigation.traced_lot_ids"
        side_effects:
          - "status = RECALLED"
          - "next hop: the lot's Shipment (status IN {CREATED, SHIPPED}) -> RECALLED"
      - from: TAGGED
        to: RECALLED
        trigger: "system: POST /shellfish/illness-investigations/{id}/confirm cascade hop 1"
        actor: system
        preconditions:
          - "the lot id is a member of IllnessInvestigation.traced_lot_ids"
        side_effects:
          - "status = RECALLED"
          - "next hop: if shipment_id is set, that Shipment -> RECALLED"

  - entity: Dealer
    state_field: listing_status
    initial_state: NOT_LISTED
    terminal_states: []
    transitions:
      - from: NOT_LISTED
        to: LISTED
        trigger: "POST /shellfish/dealers/{id}/certification-renewals with icssl_listed_through supplied"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_dealer_version == Dealer.version"
          - "certified_through > logical clock calendar date"
          - "icssl_listed_through <= certified_through"
        side_effects:
          - "certified_through and icssl_listed_through stamped; listing_status = LISTED"
          - "increments Dealer.version by 1"
      - from: LISTED
        to: LISTED
        trigger: "POST /shellfish/dealers/{id}/certification-renewals (renewal supersedes the incumbent certification period)"
        actor: ShellfishControlAuthority
        preconditions:
          - "payload expected_dealer_version == Dealer.version"
          - "certified_through > logical clock calendar date"
        side_effects:
          - "certified_through and (when supplied) icssl_listed_through replaced"
          - "increments Dealer.version by 1"
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /shellfish/dealers/{id}/suspend"
        actor: ShellfishControlAuthority
        preconditions:
          - "listing_status == LISTED"
        side_effects:
          - "listing_status = SUSPENDED; suspension_reason = AUTHORITY_ACTION"
          - "cascade: every Shipment of this dealer with status == CREATED -> HELD (held_reason = DEALER_SUSPENSION)"
      - from: LISTED
        to: SUSPENDED
        trigger: "system: POST /shellfish/illness-investigations/{id}/confirm cascade hop 3"
        actor: system
        preconditions:
          - "recall_strike_count after the confirmation >= DEALER_SUSPENSION_STRIKE_THRESHOLD (2)"
        side_effects:
          - "listing_status = SUSPENDED; suspension_reason = RECALL_STRIKES"
          - "cascade hop 4: every Shipment of this dealer with status == CREATED -> HELD (held_reason = DEALER_SUSPENSION)"
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /shellfish/dealers/{id}/reinstate"
        actor: ShellfishControlAuthority
        preconditions:
          - "listing_status == SUSPENDED"
          - "certified_through > logical clock calendar date"
        side_effects:
          - "listing_status = LISTED; suspension_reason = null; icssl_listed_through replaced when supplied"
          - "recall_strike_count is NOT reset — strikes are permanent, so a second confirmed recall re-suspends immediately"

  - entity: Shipment
    state_field: status
    initial_state: CREATED
    terminal_states: [RECALLED]
    transitions:
      - from: CREATED
        to: SHIPPED
        trigger: "POST /shellfish/shipments/{id}/ship"
        actor: SeafoodDealer
        preconditions:
          - "acting X-User-ID == Shipment.dealer_id"
          - "Dealer.listing_status == LISTED"
          - "Dealer.certified_through >= logical clock calendar date"
          - "when is_interstate == true: Dealer.icssl_listed_through >= logical clock calendar date"
          - "every lot in lot_ids has status == TAGGED"
          - "shipped_at <= logical clock and shipped_at >= max(HarvestLot.placed_in_temperature_control_at over lot_ids)"
        side_effects:
          - "status = SHIPPED; shipped_at stamped"
          - "every lot in lot_ids TAGGED -> SHIPPED"
      - from: CREATED
        to: HELD
        trigger: "system: lot embargo cascade hop, or dealer suspension cascade hop"
        actor: system
        preconditions:
          - "an embargoed lot on this shipment, or the shipping dealer being suspended"
        side_effects:
          - "status = HELD; held_reason = LOT_EMBARGO or DEALER_SUSPENSION"
      - from: SHIPPED
        to: RECALLED
        trigger: "system: POST /shellfish/illness-investigations/{id}/confirm cascade hop 2"
        actor: system
        preconditions:
          - "at least one lot on this shipment is in IllnessInvestigation.traced_lot_ids"
        side_effects:
          - "status = RECALLED; recall_reason = ILLNESS_TRACEBACK"
          - "next hop: Dealer.recall_strike_count + 1 and, at the threshold, Dealer -> SUSPENDED"
      - from: CREATED
        to: RECALLED
        trigger: "system: POST /shellfish/illness-investigations/{id}/confirm cascade hop 2"
        actor: system
        preconditions:
          - "at least one lot on this shipment is in IllnessInvestigation.traced_lot_ids"
        side_effects:
          - "status = RECALLED; recall_reason = ILLNESS_TRACEBACK"
          - "next hop: Dealer.recall_strike_count + 1 and, at the threshold, Dealer -> SUSPENDED"
      - from: HELD
        to: RECALLED
        trigger: "system: POST /shellfish/illness-investigations/{id}/confirm cascade hop 2"
        actor: system
        preconditions:
          - "at least one lot on this shipment is in IllnessInvestigation.traced_lot_ids"
        side_effects:
          - "status = RECALLED; recall_reason = ILLNESS_TRACEBACK"
          - "next hop: Dealer.recall_strike_count + 1 and, at the threshold, Dealer -> SUSPENDED"

  - entity: IllnessInvestigation
    state_field: status
    initial_state: OPEN
    terminal_states: [CONFIRMED, CLOSED_UNSUBSTANTIATED]
    transitions:
      - from: OPEN
        to: TRACEBACK
        trigger: "POST /shellfish/illness-investigations/{id}/traceback"
        actor: ShellfishControlAuthority
        preconditions:
          - "source shipment has status IN {SHIPPED, HELD, CREATED}"
        side_effects:
          - "scope_variant stamped; traced_lot_ids and traced_lot_count computed per calculations.illness_traceback_scope"
          - "status = TRACEBACK"
      - from: TRACEBACK
        to: TRACEBACK
        trigger: "POST /shellfish/illness-investigations/{id}/traceback re-run with a different scope_variant"
        actor: ShellfishControlAuthority
        preconditions:
          - "status == TRACEBACK"
        side_effects:
          - "scope_variant replaced; traced_lot_ids and traced_lot_count recomputed"
      - from: TRACEBACK
        to: CONFIRMED
        trigger: "POST /shellfish/illness-investigations/{id}/confirm"
        actor: ShellfishControlAuthority
        preconditions:
          - "traced_lot_count >= 1"
        side_effects:
          - "status = CONFIRMED; confirmed_at = payload confirmed_at when supplied else logical clock"
          - "cascade hop 1: every lot in traced_lot_ids with status IN {TAGGED, SHIPPED} -> RECALLED"
          - "cascade hop 2: each lot recalled in hop 1 moves its Shipment (status IN {CREATED, SHIPPED, HELD}) -> RECALLED; recalled_shipment_count records the distinct count"
          - "cascade hop 3: each shipment recalled in hop 2 increments its Dealer.recall_strike_count by 1; a dealer reaching DEALER_SUSPENSION_STRIKE_THRESHOLD (2) moves LISTED -> SUSPENDED (suspension_reason = RECALL_STRIKES)"
          - "cascade hop 4: each dealer suspended in hop 3 moves its remaining Shipments with status == CREATED -> HELD (held_reason = DEALER_SUSPENSION)"
      - from: OPEN
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /shellfish/illness-investigations/{id}/close"
        actor: ShellfishControlAuthority
        preconditions:
          - "status == OPEN"
        side_effects:
          - "status = CLOSED_UNSUBSTANTIATED; no lot or shipment is touched"
      - from: TRACEBACK
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /shellfish/illness-investigations/{id}/close"
        actor: ShellfishControlAuthority
        preconditions:
          - "status == TRACEBACK"
        side_effects:
          - "status = CLOSED_UNSUBSTANTIATED; traced_lot_ids retained as traceback documentation; no lot or shipment is touched"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: classification-decision-stale-area
    parent_entity: GrowingArea
    write_endpoint: "POST /shellfish/growing-areas/{id}/classification-decisions"
    occ_field: "expected_area_version"
    description: |
      Recording a classification decision against a GrowingArea whose version
      has advanced since the client last read it is rejected. A later decision
      legitimately supersedes the incumbent classification, so a writer holding
      a stale view of the area could otherwise overwrite a decision (or a
      system sample-sweep downgrade) it never saw.
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412

  - rule_id: certification-renewal-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /shellfish/dealers/{id}/certification-renewals"
    occ_field: "expected_dealer_version"
    description: |
      Recording a certification renewal against a Dealer whose version has
      advanced since the client last read it is rejected. Each renewal
      legitimately supersedes the incumbent certification and listing period,
      so a stale writer would silently roll an already-extended listing back.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: area_water_quality_statistics
    trigger: |
      Recomputed on POST /shellfish/growing-areas/{id}/water-samples (which may
      also supersede an earlier sample) and read on GET
      /shellfish/growing-areas/{id}/classification-summary. Writes
      GrowingArea.accepted_sample_count, GrowingArea.geometric_mean_mpn and
      GrowingArea.p90_mpn (SYSTEMATIC_RANDOM variant only).
    algorithm: aggregation
    input_set: |
      WaterSample rows with growing_area_id == this area AND
      sample_status == ACCEPTED (SUPERSEDED rows are excluded entirely).
      Ordered by collected_at ASC, then created_at ASC as the only tie-break.
      The window is the LAST SAMPLE_WINDOW_SIZE (15) rows of that ordering
      (i.e. the 15 most recent); when fewer than 15 ACCEPTED rows exist, all of
      them are used. Boundary: the window is inclusive of both endpoints.
    formula: |
      # Step 1 — select and order the window (see input_set).
      window = last 15 ACCEPTED samples ordered by (collected_at ASC, created_at ASC)
      # Step 2 — per-sample log
      for each sample s in window:
          log_s = round_half_up(log10(s.fecal_coliform_mpn), 4)
      n = count(window)
      # Step 3 — mean of logs
      mean_log = round_half_up(sum(log_s) / n, 4)
      # Step 4 — geometric mean
      geometric_mean_mpn = round_half_up(10 ** mean_log, 1)
      # Step 5 — sample standard deviation of logs (n-1 denominator; 0 when n < 2)
      if n < 2: sd_log = 0.0000
      else:     sd_log = round_half_up(sqrt(sum((log_s - mean_log)^2) / (n - 1)), 4)
      # Step 6 — estimated 90th percentile
      p90_mpn = round_half_up(10 ** (mean_log + P90_Z * sd_log), 1)
      # Rounding order is fixed: per-sample log (4dp) -> mean_log (4dp) ->
      # sd_log (4dp) -> geometric_mean/p90 (1dp). No other intermediate rounding.
    constants:
      SAMPLE_WINDOW_SIZE: 15
      P90_Z: 1.28
      MIN_SAMPLES_FOR_DECISION: 5
      ADVERSE_WINDOW_HOURS: 120
    precision: "logs and sd to 4 decimal places; geometric_mean_mpn and p90_mpn to 1 decimal place; round_half_up throughout"
    variants:
      - name: SYSTEMATIC_RANDOM
        when: "The default. Used for the persisted GrowingArea.geometric_mean_mpn / p90_mpn / eligible_classification and by the system sample sweep."
        difference: "The window admits every ACCEPTED sample regardless of WaterSample.is_adverse_condition."
      - name: ADVERSE_CONDITION
        when: "Requested explicitly via GET /shellfish/growing-areas/{id}/classification-summary with variant=ADVERSE_CONDITION. Never persisted on the entity."
        difference: |
          The window is restricted to ACCEPTED samples with
          is_adverse_condition == true, i.e. samples collected within
          ADVERSE_WINDOW_HOURS (120) after the observed_at of a RainfallEvent
          for the same area with triggered_closure == true. Same six formula steps over the smaller
          window, so identical stored data yields a materially higher
          geometric mean and a different eligible_classification.

  - name: area_eligible_classification
    trigger: |
      Recomputed with area_water_quality_statistics on POST
      /shellfish/growing-areas/{id}/water-samples; writes
      GrowingArea.eligible_classification. Also returned per-variant by GET
      /shellfish/growing-areas/{id}/classification-summary.
    algorithm: threshold
    input_set: "The geometric_mean_mpn / p90_mpn / n produced by area_water_quality_statistics for the requested variant."
    formula: |
      if n < MIN_SAMPLES_FOR_DECISION:                      -> INSUFFICIENT_DATA
      elif geometric_mean_mpn <= GEOMEAN_APPROVED_LIMIT
           and p90_mpn <= P90_APPROVED_LIMIT:               -> APPROVED
      elif geometric_mean_mpn <= GEOMEAN_RESTRICTED_LIMIT
           and p90_mpn <= P90_RESTRICTED_LIMIT:             -> RESTRICTED
      else:                                                 -> PROHIBITED
      # Both comparisons are <= (inclusive): a geometric mean of exactly 14.0
      # with a p90 of exactly 43.0 is APPROVED. Both conditions must hold; a
      # passing geometric mean with a failing p90 falls through to the next tier.
      # CONDITIONALLY_APPROVED is never produced here — it is an administrative
      # classification that requires conditional_management_plan_on_file.
    constants:
      GEOMEAN_APPROVED_LIMIT: 14.0
      P90_APPROVED_LIMIT: 43.0
      GEOMEAN_RESTRICTED_LIMIT: 88.0
      P90_RESTRICTED_LIMIT: 260.0
      MIN_SAMPLES_FOR_DECISION: 5
    precision: "comparisons against the 1-decimal-place statistics; no further rounding"

  - name: area_reopen_eligibility
    trigger: |
      closure_reopen_eligible_at is written by every transition that sets
      last_closure_started_at; consecutive_clean_samples is recomputed on POST
      /shellfish/growing-areas/{id}/water-samples. Both are read as
      preconditions by POST /shellfish/growing-areas/{id}/reopen.
    algorithm: threshold
    input_set: |
      For consecutive_clean_samples: WaterSample rows with growing_area_id ==
      this area AND sample_status == ACCEPTED AND collected_at >
      last_closure_started_at (strictly after), ordered by collected_at ASC
      then created_at ASC. Rows collected at exactly last_closure_started_at
      are excluded.
    formula: |
      closure_reopen_eligible_at = last_closure_started_at + rainfall_closure_hours hours
      # consecutive run measured from the END of the post-closure ordering:
      run = 0
      for s in reversed(post_closure_samples_ordered):
          if s.fecal_coliform_mpn <= clean_sample_mpn_limit: run = run + 1
          else: break
      consecutive_clean_samples = run
      # reopen is permitted when BOTH hold (both comparisons inclusive):
      reopen_ok = (current_utc >= closure_reopen_eligible_at)
                  and (consecutive_clean_samples >= reopen_sample_count_required)
      # A single dirty sample resets the run to 0 without extending the clock.
    constants:
      DEFAULT_RAINFALL_CLOSURE_HOURS: 96
      DEFAULT_REOPEN_SAMPLE_COUNT: 3
    precision: "whole hours; instants compared at second resolution"

  - name: harvest_lot_time_to_temperature
    trigger: |
      Computed on POST /shellfish/harvest-authorizations/{id}/harvest-lots;
      writes HarvestLot.ttt_minutes_first_basis,
      HarvestLot.ttt_minutes_last_basis, HarvestLot.ttt_basis_variant,
      HarvestLot.governing_ttt_minutes and HarvestLot.compliance_status.
    algorithm: threshold
    input_set: "The single HarvestLot being landed, plus its allowed_ttt_minutes from vibrio_allowed_time_to_temperature_minutes and GrowingArea.classification read at landing time."
    formula: |
      ttt_minutes_first_basis = (placed_in_temperature_control_at - first_out_of_water_at) in whole minutes
      ttt_minutes_last_basis  = (placed_in_temperature_control_at - last_out_of_water_at)  in whole minutes
      # Both bases are always persisted; the variant only decides which one gates compliance.
      ttt_basis_variant = FIRST_HARVEST_BASIS when GrowingArea.classification == APPROVED
                          LAST_HARVEST_BASIS  when GrowingArea.classification IN
                                                   {CONDITIONALLY_APPROVED, RESTRICTED}
      governing_ttt_minutes = ttt_minutes_first_basis for FIRST_HARVEST_BASIS,
                              ttt_minutes_last_basis  for LAST_HARVEST_BASIS
      compliance_status = COMPLIANT    when governing_ttt_minutes <= allowed_ttt_minutes
                          NONCOMPLIANT otherwise
      # <= is inclusive: exactly at the allowance is COMPLIANT. A NONCOMPLIANT
      # lot is still recorded; it is the tag step that refuses it
      # (ERR_TIME_TEMPERATURE_EXCEEDED).
    constants: {}
    precision: "whole minutes, truncated toward zero (inputs are second-resolution instants; fixtures use whole minutes)"
    variants:
      - name: FIRST_HARVEST_BASIS
        when: "GrowingArea.classification == APPROVED at the moment the lot is landed. This is the default basis."
        difference: "The clock starts when the FIRST animal in the lot leaves the water, so the whole harvest window counts against the allowance."
      - name: LAST_HARVEST_BASIS
        when: "GrowingArea.classification IN {CONDITIONALLY_APPROVED, RESTRICTED} at the moment the lot is landed."
        difference: |
          The clock starts when the LAST animal leaves the water, ignoring the
          time the earlier animals spent on deck. For identical instants this
          yields a strictly smaller elapsed time whenever
          last_out_of_water_at > first_out_of_water_at, so the same lot can be
          NONCOMPLIANT on one basis and COMPLIANT on the other.

  - name: vibrio_allowed_time_to_temperature_minutes
    trigger: |
      Computed on POST /shellfish/harvest-authorizations/{id}/harvest-lots;
      writes HarvestLot.allowed_ttt_minutes,
      HarvestLot.vibrio_control_plan_id and HarvestLot.vibrio_plan_month.
    algorithm: constraint_propagation
    input_set: |
      Exactly one VibrioControlPlan: the row with status == ACTIVE and
      season_month == UTC month of HarvestLot.first_out_of_water_at. When no
      such row exists the landing is rejected (ERR_NO_VIBRIO_PLAN_FOR_SEASON);
      there is no default allowance. SUPERSEDED plans are never selected.
      Also reads GrowoutUnit.gear_type and HarvestVessel.refrigeration_type of
      the landing authorization, and the payload water_temp_c.
    formula: |
      plan = ACTIVE VibrioControlPlan with season_month == month(first_out_of_water_at)
      minutes = plan.max_time_to_temperature_minutes
      # (1) elevated water temperature tightens the allowance
      if water_temp_c >= plan.high_water_temp_c:
          minutes = minutes - plan.high_temp_reduction_minutes
      # (2) gear that leaves animals exposed at low tide tightens it further
      if gear_type IN {BOTTOM, RACK_AND_BAG}:
          minutes = minutes - INTERTIDAL_PENALTY_MINUTES
      # (3) mechanical refrigeration aboard the vessel relaxes it
      if refrigeration_type == MECHANICAL:
          minutes = minutes + REFRIGERATION_CREDIT_MINUTES
      # ICE_SLURRY and NONE add nothing.
      # (4) a hard floor applies last
      allowed_ttt_minutes = max(minutes, MIN_FLOOR_MINUTES)
      # The four steps are applied in exactly this order. The result is not a
      # product of independent factors: the same water temperature yields a
      # different allowance for each gear/refrigeration pairing, and the floor
      # can absorb the whole reduction.
    constants:
      INTERTIDAL_PENALTY_MINUTES: 30
      REFRIGERATION_CREDIT_MINUTES: 60
      MIN_FLOOR_MINUTES: 60
    precision: "whole minutes; the >= water-temperature comparison is inclusive at 1 decimal place"

  - name: lease_harvest_settlement
    trigger: |
      Computed on POST /shellfish/harvest-authorizations/{id}/harvest-lots;
      writes HarvestLot.royalty_rate_cents_per_bushel,
      HarvestLot.royalty_cents, HarvestLot.inspection_fee_cents,
      HarvestLot.conservation_surcharge_cents, HarvestLot.lot_settlement_cents
      and increments Lease.royalty_accrued_cents. Reversed by POST
      /shellfish/harvest-lots/{id}/void.
    algorithm: tiered_pricing
    input_set: |
      season_bushels_including_current = payload bushels + SUM(HarvestLot.bushels)
      over HarvestLots whose authorization's lease_id == this lease AND whose
      status IN {HARVESTED, TAGGED, SHIPPED, EMBARGOED, RECALLED} (VOIDED lots
      are excluded) AND whose first_out_of_water_at falls in the same calendar
      year (UTC) as the landing lot.
    formula: |
      # Step 1 — season volume INCLUDING the lot being landed
      total = season_bushels_including_current
      # Step 2 — tier selection on that total (whole-total rate, not marginal)
      if   total <= TIER1_MAX_BUSHELS: rate = TIER1_RATE_CENTS   # <= inclusive
      elif total <= TIER2_MAX_BUSHELS: rate = TIER2_RATE_CENTS
      else:                            rate = TIER3_RATE_CENTS
      royalty_rate_cents_per_bushel = rate
      # Step 3 — royalty for this lot only
      royalty_cents = rate * bushels
      # Step 4 — inspection fee, waived for large-royalty lots (>= inclusive)
      inspection_fee_cents = 0 if royalty_cents >= INSPECTION_FEE_WAIVER_CENTS
                               else INSPECTION_FEE_CENTS
      # Step 5 — surcharge on royalty + fee, rounded ONCE, HALF_UP, to whole cents
      conservation_surcharge_cents = round_half_up(
          SURCHARGE_RATE * (royalty_cents + inspection_fee_cents), 0)
      # Step 6 — lot total, then accrual
      lot_settlement_cents = royalty_cents + inspection_fee_cents + conservation_surcharge_cents
      Lease.royalty_accrued_cents = Lease.royalty_accrued_cents + lot_settlement_cents
      # The six steps run in this exact order. The surcharge is rounded PER LOT
      # before it enters the accrual — never by rounding a summed base once.
    constants:
      TIER1_MAX_BUSHELS: 500
      TIER1_RATE_CENTS: 115
      TIER2_MAX_BUSHELS: 2000
      TIER2_RATE_CENTS: 95
      TIER3_RATE_CENTS: 70
      INSPECTION_FEE_CENTS: 2500
      INSPECTION_FEE_WAIVER_CENTS: 50000
      SURCHARGE_RATE: 0.03
    precision: "integer cents; the single surcharge rounding is round_half_up to 0 decimal places"

  - name: seed_lot_allocation_and_survival
    trigger: |
      survival_rate_pct is computed on POST
      /shellfish/seed-lots/{id}/nursery-complete. allocated_seed_count and
      unallocated_seed_count are recomputed on POST /shellfish/growout-units
      and on POST /shellfish/growout-units/{id}/void.
    algorithm: aggregation
    input_set: |
      GrowoutUnit rows with seed_lot_id == this lot AND status IN {DEPLOYED,
      HARVESTING, RETRIEVED} (VOIDED units are excluded).
    formula: |
      survival_rate_pct = round_half_up(
          100 * surviving_seed_count / received_seed_count, 2)
      allocated_seed_count   = SUM(GrowoutUnit.seed_count_planted over the input set)
      unallocated_seed_count = surviving_seed_count - allocated_seed_count
      # Deployment guard (>= would over-allocate):
      #   seed_count_planted <= unallocated_seed_count, else ERR_SEED_ALLOCATION_EXCEEDED
      # Nursery guard: survival_rate_pct >= SURVIVAL_FLOOR_PCT, else
      #   ERR_SEED_SURVIVAL_BELOW_FLOOR (>= inclusive: exactly 40.00 passes).
    constants:
      SURVIVAL_FLOOR_PCT: 40.00
      MIN_NURSERY_DAYS: 21
    precision: "survival_rate_pct to 2 decimal places, round_half_up; counts are integers"

  - name: lease_gear_utilisation
    trigger: |
      Recomputed on POST /shellfish/growout-units, POST
      /shellfish/growout-units/{id}/retrieve and POST
      /shellfish/growout-units/{id}/void; writes Lease.deployed_gear_units.
    algorithm: aggregation
    input_set: "GrowoutUnit rows with lease_id == this lease AND status IN {DEPLOYED, HARVESTING}. RETRIEVED and VOIDED units are excluded."
    formula: |
      deployed_gear_units = SUM(GrowoutUnit.gear_units over the input set)
      # Deployment guard (strictly greater rejects):
      #   deployed_gear_units + new gear_units <= Lease.authorized_gear_units,
      #   else ERR_LEASE_GEAR_CAPACITY_EXCEEDED. Landing exactly on the
      #   authorized total is permitted.
    constants: {}
    precision: "integer gear units"

  - name: growout_husbandry_currency
    trigger: |
      Recomputed on POST /shellfish/growout-units/{id}/husbandry-logs; writes
      GrowoutUnit.last_inspection_at, GrowoutUnit.last_predator_control_at and
      GrowoutUnit.husbandry_current. Read as a precondition of POST
      /shellfish/harvest-authorizations.
    algorithm: decay_function
    input_set: |
      HusbandryLog rows with growout_unit_id == this unit, split by log_type:
      last_inspection_at = MAX(performed_at) over rows with log_type ==
      INSPECTION; last_predator_control_at = MAX(performed_at) over rows with
      log_type == PREDATOR_CONTROL. mortality_count_total = SUM(mortality_count)
      over ALL of this unit's logs regardless of log_type. Ties on performed_at are broken by
      created_at ASC (the later-created row wins, but the instant is identical
      so the field value is unaffected). Null when no such row exists.
    formula: |
      inspection_ok = last_inspection_at is not null
                      and (current_utc - last_inspection_at) <= INSPECTION_MAX_AGE_DAYS days
      predator_ok   = (gear_type != BOTTOM)
                      or (last_predator_control_at is not null
                          and (current_utc - last_predator_control_at) <= PREDATOR_CONTROL_MAX_AGE_DAYS days)
      husbandry_current = inspection_ok and predator_ok
      # <= is inclusive: a log exactly INSPECTION_MAX_AGE_DAYS old is still
      # current. BOTTOM gear is the only gear type carrying the predator-control
      # obligation (RACK_AND_BAG and FLOATING_BAG are enclosed).
      # Authorization refuses to issue when inspection_ok is false
      # (ERR_HUSBANDRY_LAPSED) or predator_ok is false
      # (ERR_PREDATOR_CONTROL_LAPSED); the inspection check runs first.
    constants:
      INSPECTION_MAX_AGE_DAYS: 30
      PREDATOR_CONTROL_MAX_AGE_DAYS: 60
    precision: "whole days measured as exact 24-hour multiples between second-resolution instants"

  - name: vessel_concurrent_authorization_load
    trigger: |
      Evaluated on POST /shellfish/harvest-authorizations; maintains
      HarvestVessel.active_authorization_count (incremented on issue,
      decremented on close and on every void).
    algorithm: interval_merge
    input_set: |
      HarvestAuthorization rows with vessel_id == this vessel AND status IN
      {ISSUED, ACTIVE}. CLOSED and VOIDED authorizations release capacity and
      are excluded.
    formula: |
      # Each authorization occupies the half-open interval
      #   [window_start, window_end)
      overlapping = count of input-set rows where
          existing.window_start < new.window_end
          and new.window_start < existing.window_end
      # Adjacency is free: existing.window_end == new.window_start does not
      # overlap. Containment and partial straddles do.
      if overlapping + 1 > vessel.concurrent_authorization_capacity:
          reject ERR_VESSEL_CAPACITY_CONFLICT
      # The check is aggregate, not pairwise: with capacity 2, two mutually
      # overlapping authorizations are fine and the third is rejected.
    constants:
      DEFAULT_VESSEL_CAPACITY: 2
    precision: "instants compared at second resolution"

  - name: plot_fallow_window
    trigger: "Evaluated on POST /shellfish/growout-units, before the gear-capacity check."
    algorithm: interval_merge
    input_set: |
      GrowoutUnit rows with lease_id == the new unit's lease_id AND plot_code ==
      the new unit's plot_code AND status IN {DEPLOYED, HARVESTING, RETRIEVED}.
      VOIDED units are excluded, which is what makes the void a true
      compensation for plot occupancy.
    formula: |
      # Occupation interval of an existing unit (half-open, calendar dates):
      #   [deployed_on, effective_end)  where
      #   effective_end = retrieved_on if status == RETRIEVED else planned_retrieval_on
      # Fallow interval extends that by a buffer:
      #   [deployed_on, effective_end + FALLOW_DAYS)
      # The new unit occupies [new.deployed_on, new.planned_retrieval_on).
      if any existing unit where
             existing.deployed_on < new.planned_retrieval_on
             and new.deployed_on < existing.effective_end:
          reject ERR_PLOT_OCCUPIED
      elif any existing unit where
             new.deployed_on < existing.effective_end + FALLOW_DAYS days:
          reject ERR_PLOT_FALLOW_CONFLICT
      # ERR_PLOT_OCCUPIED (true overlap) is checked before
      # ERR_PLOT_FALLOW_CONFLICT (buffer-only overlap). Both boundaries are
      # exclusive on the right: deploying exactly on
      # effective_end + FALLOW_DAYS is permitted.
    constants:
      FALLOW_DAYS: 14
    precision: "whole calendar dates (UTC)"

  - name: illness_traceback_scope
    trigger: |
      Computed on POST /shellfish/illness-investigations/{id}/traceback; writes
      IllnessInvestigation.traced_lot_ids and
      IllnessInvestigation.traced_lot_count. Read by POST
      /shellfish/illness-investigations/{id}/confirm.
    algorithm: projection
    input_set: |
      Starts from the source shipment's lots: HarvestLot rows with
      shipment_id == IllnessInvestigation.source_shipment_id and status IN
      {TAGGED, SHIPPED, EMBARGOED}. VOIDED and already-RECALLED lots are
      excluded from the seed set and from the expansion.
    formula: |
      seed = lots of source_shipment_id with status IN {TAGGED, SHIPPED, EMBARGOED}
      NARROW: traced = seed
      BROAD:  traced = seed
                 UNION { HarvestLot L with status IN {TAGGED, SHIPPED, EMBARGOED}
                         where L.tag_area_code == S.tag_area_code
                           and abs(L.tag_harvest_date - S.tag_harvest_date) <= TRACEBACK_DAY_WINDOW days
                         for some S in seed }
      traced_lot_ids   = the traced set ordered by
                         (tag_harvest_date ASC, created_at ASC)
      traced_lot_count = count(traced)
      # The day window is inclusive on both sides (+/- 1 day). Lots without a
      # tag_area_code (never tagged) can never be pulled in by BROAD.
    constants:
      TRACEBACK_DAY_WINDOW: 1
    precision: "whole calendar dates (UTC)"
    variants:
      - name: NARROW
        when: "payload scope_variant == NARROW"
        difference: "Only the lots physically on the source shipment are traced."
      - name: BROAD
        when: "payload scope_variant == BROAD"
        difference: |
          Expands to every lot tagged with the same growing-area code within
          one day of a seed lot's harvest date, crossing lease and shipment
          boundaries. For identical stored data BROAD returns a strictly larger
          traced_lot_count than NARROW whenever a sibling lot exists, so the
          confirm cascade recalls a different set of shipments.

  - name: dealer_recall_strike_accumulation
    trigger: |
      Recomputed inside the POST /shellfish/illness-investigations/{id}/confirm
      cascade; writes Dealer.recall_strike_count and can drive
      Dealer.listing_status to SUSPENDED.
    algorithm: threshold
    input_set: "The distinct Shipments moved to RECALLED by the confirm cascade, grouped by Shipment.dealer_id."
    formula: |
      for each dealer with k >= 1 shipments recalled by this confirmation:
          recall_strike_count = recall_strike_count + k
          if recall_strike_count >= DEALER_SUSPENSION_STRIKE_THRESHOLD
             and listing_status == LISTED:
                 listing_status = SUSPENDED, suspension_reason = RECALL_STRIKES
      # >= is inclusive: the second strike suspends. Strikes are never reset,
      # not even by reinstatement, so a reinstated dealer is re-suspended by
      # the next confirmed recall.
    constants:
      DEALER_SUSPENSION_STRIKE_THRESHOLD: 2
    precision: "integer counts"

  - name: authorization_area_denormalisation
    trigger: |
      Computed on POST /shellfish/harvest-authorizations and re-read by every
      area cascade; writes HarvestAuthorization.growing_area_id and
      GrowingArea.open_authorization_count.
    algorithm: aggregation
    input_set: "HarvestAuthorization rows with status IN {ISSUED, ACTIVE} whose denormalised growing_area_id == this area."
    formula: |
      HarvestAuthorization.growing_area_id = Lease.growing_area_id of
          HarvestAuthorization.lease_id, snapshotted at issue time and never
          re-derived afterwards.
      GrowingArea.open_authorization_count = count(input set)
      # The snapshot is what the area-closure cascade matches on, so the
      # denormalised value and the count must reconcile after every issue,
      # close, void and cascade.
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  # ---- 1-2 authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are both present and non-empty strings"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-Role is one of the roles listed on the addressed endpoint in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- 3 existence (path ids left-to-right, then body references) -----------
  - priority: 3
    category: existence
    check: "The addressed GrowingArea exists; also validates growing_area_id in bodies"
    error_id: ERR_GROWING_AREA_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/growing-areas/{id}/**, POST /shellfish/leases"
  - priority: 3
    category: existence
    check: "The addressed Lease exists; also validates lease_id in bodies"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/leases/{id}/**, POST /shellfish/seed-lots, POST /shellfish/growout-units, POST /shellfish/harvest-authorizations"
  - priority: 3
    category: existence
    check: "The addressed Hatchery exists; also validates hatchery_id in bodies"
    error_id: ERR_HATCHERY_NOT_FOUND
    http_status: 404
    applies_to: "GET /shellfish/hatcheries/{id}, POST /shellfish/seed-lots"
  - priority: 3
    category: existence
    check: "The addressed SeedLot exists; also validates seed_lot_id in bodies"
    error_id: ERR_SEED_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/seed-lots/{id}/**, POST /shellfish/growout-units"
  - priority: 3
    category: existence
    check: "The addressed GrowoutUnit exists; also validates growout_unit_id in bodies"
    error_id: ERR_GROWOUT_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/growout-units/{id}/**, POST /shellfish/harvest-authorizations"
  - priority: 3
    category: existence
    check: "The addressed HarvestVessel exists; also validates vessel_id in bodies"
    error_id: ERR_VESSEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /shellfish/harvest-vessels/{id}, POST /shellfish/harvest-authorizations"
  - priority: 3
    category: existence
    check: "The addressed HarvestAuthorization exists"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/harvest-authorizations/{id}/**"
  - priority: 3
    category: existence
    check: "The addressed HarvestLot exists; also validates every member of Shipment.lot_ids"
    error_id: ERR_HARVEST_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/harvest-lots/{id}/**, POST /shellfish/shipments"
  - priority: 3
    category: existence
    check: "The addressed Dealer exists; also validates dealer_id in bodies"
    error_id: ERR_DEALER_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/dealers/{id}/**, POST /shellfish/harvest-authorizations, POST /shellfish/shipments"
  - priority: 3
    category: existence
    check: "The addressed Shipment exists"
    error_id: ERR_SHIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/shipments/{id}/**"
  - priority: 3
    category: existence
    check: "The addressed IllnessInvestigation exists"
    error_id: ERR_INVESTIGATION_NOT_FOUND
    http_status: 404
    applies_to: "GET|POST /shellfish/illness-investigations/{id}/**"
  - priority: 3
    category: existence
    check: "The addressed VibrioControlPlan exists"
    error_id: ERR_VIBRIO_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /shellfish/vibrio-control-plans/{id}"

  # ---- 4 ownership --------------------------------------------------------
  - priority: 4
    category: auth
    check: "For FarmOperator writes on lease-scoped objects, X-User-ID == Lease.operator_user_id of the addressed object's lease"
    error_id: ERR_LEASE_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /shellfish/leases/{id}/submit, POST /shellfish/seed-lots/{id}/nursery-start, POST /shellfish/seed-lots/{id}/nursery-complete, POST /shellfish/growout-units, POST /shellfish/growout-units/{id}/husbandry-logs, POST /shellfish/growout-units/{id}/retrieve, POST /shellfish/growout-units/{id}/void, POST /shellfish/harvest-authorizations, POST /shellfish/harvest-authorizations/{id}/activate, POST /shellfish/harvest-authorizations/{id}/close, POST /shellfish/harvest-authorizations/{id}/harvest-lots, POST /shellfish/harvest-lots/{id}/tag, POST /shellfish/harvest-lots/{id}/void"
  - priority: 4
    category: auth
    check: "For HatcheryOperator writes, X-User-ID == the addressed SeedLot's hatchery_id (the HatcheryOperator role is entity_backed by Hatchery)"
    error_id: ERR_HATCHERY_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /shellfish/seed-lots"
  - priority: 4
    category: auth
    check: "For SeafoodDealer writes, X-User-ID == Shipment.dealer_id (the SeafoodDealer role is entity_backed by Dealer)"
    error_id: ERR_DEALER_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /shellfish/shipments, POST /shellfish/shipments/{id}/ship"

  # ---- 5 request shape ----------------------------------------------------
  - priority: 5
    category: state
    check: "Body/query conforms to the endpoint's input schema: required fields present, types and enum members valid, numbers within declared ranges, dates YYYY-MM-DD, instants ISO-8601 UTC, limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # ---- 6 optimistic concurrency ------------------------------------------
  - priority: 6
    category: state
    check: "expected_area_version == GrowingArea.version"
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412
    applies_to: "POST /shellfish/growing-areas/{id}/classification-decisions"
  - priority: 6
    category: state
    check: "expected_dealer_version == Dealer.version"
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
    applies_to: "POST /shellfish/dealers/{id}/certification-renewals"

  # ---- 30s state preconditions -------------------------------------------
  - priority: 31
    category: state
    check: "Lease.status is a declared `from:` state of the requested transition, and is APPROVED for every production operation that consumes the lease"
    error_id: ERR_INVALID_LEASE_STATE
    http_status: 409
    applies_to: "POST /shellfish/leases/{id}/submit, POST /shellfish/leases/{id}/navigation-review, POST /shellfish/leases/{id}/environmental-review, POST /shellfish/leases/{id}/decision, POST /shellfish/seed-lots, POST /shellfish/growout-units, POST /shellfish/harvest-authorizations"
  - priority: 32
    category: state
    check: "SeedLot.status is a declared `from:` state of the requested transition"
    error_id: ERR_INVALID_SEED_LOT_STATE
    http_status: 409
    applies_to: "POST /shellfish/seed-lots/{id}/screening, POST /shellfish/seed-lots/{id}/nursery-start, POST /shellfish/seed-lots/{id}/nursery-complete"
  - priority: 33
    category: state
    check: "GrowoutUnit.status is a declared `from:` state of the requested transition"
    error_id: ERR_INVALID_GROWOUT_UNIT_STATE
    http_status: 409
    applies_to: "POST /shellfish/growout-units/{id}/husbandry-logs, POST /shellfish/growout-units/{id}/retrieve, POST /shellfish/growout-units/{id}/void, POST /shellfish/harvest-authorizations"
  - priority: 34
    category: state
    check: "HarvestAuthorization.status is a declared `from:` state of the requested transition (activate needs ISSUED; close and landing need ACTIVE)"
    error_id: ERR_INVALID_AUTHORIZATION_STATE
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations/{id}/activate, POST /shellfish/harvest-authorizations/{id}/close, POST /shellfish/harvest-authorizations/{id}/harvest-lots"
  - priority: 35
    category: state
    check: "HarvestLot.status is a declared `from:` state of the requested transition (tag needs HARVESTED; void needs HARVESTED or TAGGED with shipment_id null)"
    error_id: ERR_INVALID_LOT_STATE
    http_status: 409
    applies_to: "POST /shellfish/harvest-lots/{id}/tag, POST /shellfish/harvest-lots/{id}/void, POST /shellfish/shipments"
  - priority: 36
    category: state
    check: "Shipment.status == CREATED for ship; IN {CREATED, SHIPPED, HELD} for opening an investigation"
    error_id: ERR_INVALID_SHIPMENT_STATE
    http_status: 409
    applies_to: "POST /shellfish/shipments/{id}/ship, POST /shellfish/shipments/{id}/illness-investigations"
  - priority: 37
    category: state
    check: "IllnessInvestigation.status is a declared `from:` state (traceback needs OPEN or TRACEBACK; confirm needs TRACEBACK; close needs OPEN or TRACEBACK)"
    error_id: ERR_INVALID_INVESTIGATION_STATE
    http_status: 409
    applies_to: "POST /shellfish/illness-investigations/{id}/traceback, POST /shellfish/illness-investigations/{id}/confirm, POST /shellfish/illness-investigations/{id}/close"
  - priority: 38
    category: state
    check: "Dealer.listing_status is a declared `from:` state (suspend needs LISTED; reinstate needs SUSPENDED)"
    error_id: ERR_INVALID_DEALER_LISTING_STATE
    http_status: 409
    applies_to: "POST /shellfish/dealers/{id}/suspend, POST /shellfish/dealers/{id}/reinstate"
  - priority: 39
    category: state
    check: "GrowingArea.harvest_status != OPEN when a reopen is requested"
    error_id: ERR_AREA_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/reopen"

  # ---- 40s business_safety (sanitary and public-health gates) -------------
  # 48-50 and 59 are referential coherence checks on POST /shellfish/growout-units
  # that MUST precede the 68-75 capacity/interval checks: a request naming a plot
  # the lease does not hold, or seed that is not plantable, is answered on that
  # ground rather than on a downstream capacity ground.
  - priority: 40
    category: business_safety
    check: "GrowingArea.classification IN {APPROVED, CONDITIONALLY_APPROVED} for any harvest operation on the area"
    error_id: ERR_AREA_CLASSIFICATION_NOT_HARVESTABLE
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations, POST /shellfish/harvest-authorizations/{id}/activate"
  - priority: 41
    category: business_safety
    check: "GrowingArea.classification != PROHIBITED"
    error_id: ERR_AREA_PROHIBITED
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/reopen, POST /shellfish/leases/{id}/submit, POST /shellfish/leases/{id}/decision, POST /shellfish/growout-units"
  - priority: 42
    category: business_safety
    check: "GrowingArea.harvest_status == OPEN for the area behind the lease"
    error_id: ERR_AREA_HARVEST_CLOSED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations, POST /shellfish/harvest-authorizations/{id}/activate, POST /shellfish/harvest-authorizations/{id}/harvest-lots"
  - priority: 43
    category: business_safety
    check: "Hatchery.certificate_expires_on >= SeedLot.shipped_on"
    error_id: ERR_HATCHERY_CERTIFICATE_EXPIRED
    http_status: 409
    applies_to: "POST /shellfish/seed-lots"
  - priority: 44
    category: business_safety
    check: "SeedLot.species is a member of Hatchery.pathogen_free_species"
    error_id: ERR_SPECIES_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /shellfish/seed-lots"
  - priority: 45
    category: business_safety
    check: "shipped_on - disease_cert_issued_on <= DISEASE_CERT_MAX_AGE_DAYS (30)"
    error_id: ERR_DISEASE_CERTIFICATE_STALE
    http_status: 409
    applies_to: "POST /shellfish/seed-lots"
  - priority: 46
    category: business_safety
    check: "HarvestLot.compliance_status == COMPLIANT before a tag may be issued"
    error_id: ERR_TIME_TEMPERATURE_EXCEEDED
    http_status: 409
    applies_to: "POST /shellfish/harvest-lots/{id}/tag"
  - priority: 47
    category: business_safety
    check: "An ACTIVE VibrioControlPlan exists for the UTC month of first_out_of_water_at"
    error_id: ERR_NO_VIBRIO_PLAN_FOR_SEASON
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations/{id}/harvest-lots"

  # ---- 50s business_temporal ---------------------------------------------
  - priority: 48
    category: business_referential
    check: "plot_code is a member of Lease.plot_codes"
    error_id: ERR_PLOT_NOT_IN_LEASE
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 49
    category: business_referential
    check: "gear_type is a member of Lease.gear_types_permitted"
    error_id: ERR_GEAR_TYPE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 50
    category: business_referential
    check: "SeedLot.lease_id == the new GrowoutUnit's lease_id"
    error_id: ERR_SEED_LOT_LEASE_MISMATCH
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 51
    category: business_temporal
    check: "current_utc >= GrowingArea.closure_reopen_eligible_at"
    error_id: ERR_REOPEN_TOO_EARLY
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/reopen"
  - priority: 52
    category: business_temporal
    check: "nursery_completed_on >= nursery_started_on + MIN_NURSERY_DAYS (21)"
    error_id: ERR_NURSERY_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /shellfish/seed-lots/{id}/nursery-complete"
  - priority: 53
    category: business_temporal
    check: "Every client-supplied instant or calendar date describing something that already happened is <= the logical clock (collected_at, observed_at, performed_at, deployed_on, retrieved_on, shipped_on, screened_on, nursery dates, harvest instants, shipped_at, reported_at)"
    error_id: ERR_FUTURE_DATED_EVENT
    http_status: 422
    applies_to: "POST /shellfish/growing-areas/{id}/water-samples, POST /shellfish/growing-areas/{id}/rainfall-events, POST /shellfish/seed-lots, POST /shellfish/seed-lots/{id}/screening, POST /shellfish/seed-lots/{id}/nursery-start, POST /shellfish/seed-lots/{id}/nursery-complete, POST /shellfish/growout-units, POST /shellfish/growout-units/{id}/husbandry-logs, POST /shellfish/growout-units/{id}/retrieve, POST /shellfish/harvest-authorizations/{id}/close, POST /shellfish/harvest-authorizations/{id}/harvest-lots, POST /shellfish/shipments/{id}/ship, POST /shellfish/shipments/{id}/illness-investigations"
  - priority: 54
    category: business_temporal
    check: "planned_retrieval_on > deployed_on"
    error_id: ERR_INVALID_DEPLOYMENT_WINDOW
    http_status: 422
    applies_to: "POST /shellfish/growout-units"
  - priority: 55
    category: business_temporal
    check: "window_end > window_start and window_end - window_start <= MAX_AUTHORIZATION_WINDOW_HOURS (24)"
    error_id: ERR_AUTHORIZATION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 56
    category: business_temporal
    check: "The logical clock (activation) or first_out_of_water_at (landing) falls inside the half-open window [window_start, window_end)"
    error_id: ERR_OUTSIDE_AUTHORIZATION_WINDOW
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations/{id}/activate, POST /shellfish/harvest-authorizations/{id}/harvest-lots"
  - priority: 57
    category: business_temporal
    check: "screened_on >= SeedLot.shipped_on"
    error_id: ERR_SCREENING_DATE_INVALID
    http_status: 422
    applies_to: "POST /shellfish/seed-lots/{id}/screening"
  - priority: 58
    category: business_temporal
    check: "last_out_of_water_at >= first_out_of_water_at and placed_in_temperature_control_at >= last_out_of_water_at"
    error_id: ERR_INVALID_HARVEST_INSTANTS
    http_status: 422
    applies_to: "POST /shellfish/harvest-authorizations/{id}/harvest-lots"

  # ---- 60s business_constraint -------------------------------------------
  - priority: 59
    category: business_referential
    check: "SeedLot.status IN {READY_FOR_PLANTING, PLANTED} when planting into new gear"
    error_id: ERR_SEED_LOT_NOT_PLANTABLE
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 61
    category: business_constraint
    check: "GrowingArea.consecutive_clean_samples >= GrowingArea.reopen_sample_count_required"
    error_id: ERR_INSUFFICIENT_CLEAN_SAMPLES
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/reopen"
  - priority: 62
    category: business_constraint
    check: "GrowingArea.accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
    error_id: ERR_INSUFFICIENT_SAMPLE_DATA
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/classification-decisions"
  - priority: 63
    category: business_constraint
    check: "For an upgrade (restrictiveness rank decreases), eligible_classification must be at least as permissive as the requested classification"
    error_id: ERR_CLASSIFICATION_NOT_SUPPORTED_BY_DATA
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/classification-decisions"
  - priority: 64
    category: business_constraint
    check: "An upgrade improves the restrictiveness rank by exactly 1"
    error_id: ERR_CLASSIFICATION_STEP_SKIPPED
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/classification-decisions"
  - priority: 65
    category: business_constraint
    check: "conditional_management_plan_on_file == true when the requested classification is CONDITIONALLY_APPROVED"
    error_id: ERR_CONDITIONAL_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST /shellfish/growing-areas/{id}/classification-decisions"
  - priority: 66
    category: business_constraint
    check: "The acting X-User-ID has not already recorded the sibling clearance on this lease"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /shellfish/leases/{id}/navigation-review, POST /shellfish/leases/{id}/environmental-review"
  - priority: 67
    category: business_constraint
    check: "Lease.revision_round < MAX_REVISION_ROUNDS (3) on resubmission from REVISION_REQUESTED"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /shellfish/leases/{id}/submit"
  - priority: 68
    category: business_constraint
    check: "The requested plot_code has no truly overlapping occupation interval per calculations.plot_fallow_window"
    error_id: ERR_PLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 69
    category: business_constraint
    check: "deployed_on >= the plot's last effective_end + FALLOW_DAYS (14)"
    error_id: ERR_PLOT_FALLOW_CONFLICT
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 70
    category: business_constraint
    check: "Overlapping ISSUED/ACTIVE authorizations on the vessel + 1 <= HarvestVessel.concurrent_authorization_capacity"
    error_id: ERR_VESSEL_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 71
    category: business_constraint
    check: "The GrowoutUnit has no other authorization with status IN {ISSUED, ACTIVE}"
    error_id: ERR_UNIT_ALREADY_AUTHORIZED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 72
    category: business_constraint
    check: "GrowoutUnit.last_inspection_at is within INSPECTION_MAX_AGE_DAYS (30) of the logical clock"
    error_id: ERR_HUSBANDRY_LAPSED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 73
    category: business_constraint
    check: "For BOTTOM gear, GrowoutUnit.last_predator_control_at is within PREDATOR_CONTROL_MAX_AGE_DAYS (60) of the logical clock"
    error_id: ERR_PREDATOR_CONTROL_LAPSED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 74
    category: business_constraint
    check: "Lease.deployed_gear_units + gear_units <= Lease.authorized_gear_units"
    error_id: ERR_LEASE_GEAR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 75
    category: business_constraint
    check: "seed_count_planted <= SeedLot.unallocated_seed_count"
    error_id: ERR_SEED_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: "POST /shellfish/growout-units"
  - priority: 76
    category: business_constraint
    check: "survival_rate_pct >= SURVIVAL_FLOOR_PCT (40.00), and surviving_seed_count <= received_seed_count"
    error_id: ERR_SEED_SURVIVAL_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /shellfish/seed-lots/{id}/nursery-complete"
  - priority: 77
    category: business_constraint
    check: "HarvestAuthorization.harvested_bushels + bushels <= HarvestAuthorization.projected_bushels"
    error_id: ERR_HARVEST_EXCEEDS_PROJECTION
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations/{id}/harvest-lots"
  - priority: 78
    category: business_constraint
    check: "GrowingArea.code is unique across growing areas"
    error_id: ERR_DUPLICATE_AREA_CODE
    http_status: 409
    applies_to: "POST /shellfish/growing-areas"
  - priority: 79
    category: business_constraint
    check: "HarvestLot.lot_code is unique across harvest lots"
    error_id: ERR_DUPLICATE_LOT_CODE
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations/{id}/harvest-lots"

  # ---- 80s business_referential ------------------------------------------
  - priority: 82
    category: business_referential
    check: "Dealer.certification_category IN {SHELLSTOCK_SHIPPER, SHUCKER_PACKER} to receive shellstock directly from a harvest"
    error_id: ERR_DEALER_CATEGORY_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 83
    category: business_referential
    check: "Dealer.icssl_listed_through >= the logical clock's calendar date when Shipment.is_interstate == true"
    error_id: ERR_DEALER_NOT_LISTED_FOR_INTERSTATE
    http_status: 409
    applies_to: "POST /shellfish/shipments/{id}/ship"
  - priority: 84
    category: business_referential
    check: "Dealer.certified_through >= the logical clock's calendar date"
    error_id: ERR_DEALER_CERTIFICATION_EXPIRED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations, POST /shellfish/shipments, POST /shellfish/shipments/{id}/ship, POST /shellfish/dealers/{id}/reinstate"
  - priority: 85
    category: business_referential
    check: "Every lot in Shipment.lot_ids has status == TAGGED"
    error_id: ERR_LOT_NOT_TAGGED
    http_status: 409
    applies_to: "POST /shellfish/shipments, POST /shellfish/shipments/{id}/ship"
  - priority: 86
    category: business_referential
    check: "Every lot in Shipment.lot_ids has dealer_id == Shipment.dealer_id and shipment_id null"
    error_id: ERR_LOT_DEALER_MISMATCH
    http_status: 409
    applies_to: "POST /shellfish/shipments"
  - priority: 87
    category: business_referential
    check: "payload harvest_date == the UTC calendar date of HarvestLot.first_out_of_water_at"
    error_id: ERR_TAG_HARVEST_DATE_MISMATCH
    http_status: 409
    applies_to: "POST /shellfish/harvest-lots/{id}/tag"
  - priority: 88
    category: business_referential
    check: "payload dealer_certification_no == Dealer.certification_no of HarvestLot.dealer_id"
    error_id: ERR_TAG_DEALER_CERT_MISMATCH
    http_status: 409
    applies_to: "POST /shellfish/harvest-lots/{id}/tag"
  - priority: 89
    category: business_referential
    check: "GrowoutUnit.lease_id == the requested lease_id"
    error_id: ERR_UNIT_LEASE_MISMATCH
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations"
  - priority: 93
    category: business_referential
    check: "Dealer.listing_status != SUSPENDED"
    error_id: ERR_DEALER_SUSPENDED
    http_status: 409
    applies_to: "POST /shellfish/harvest-authorizations, POST /shellfish/harvest-lots/{id}/tag, POST /shellfish/shipments, POST /shellfish/shipments/{id}/ship"
  - priority: 94
    category: business_referential
    check: "Dealer.listing_status == LISTED when a shipment leaves the dock"
    error_id: ERR_DEALER_NOT_LISTED
    http_status: 409
    applies_to: "POST /shellfish/shipments/{id}/ship"

  # ---- 95 business_fiscal (last) -----------------------------------------
  - priority: 95
    category: business_fiscal
    check: "Lease.rent_paid_through_date >= the logical clock's calendar date"
    error_id: ERR_LEASE_RENT_DELINQUENT
    http_status: 402
    applies_to: "POST /shellfish/harvest-authorizations"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix /shellfish; every path parameter is {id})
# =============================================================================
endpoints:
  # ---------------- GrowingArea + monitoring events -------------------------
  - method: POST
    path: "/shellfish/growing-areas"
    description: "Register a growing area with its rainfall-closure and reopening configuration."
    roles: [ShellfishControlAuthority]
    code: 201
    input: ["code", "water_body", "rainfall_closure_threshold_in?", "rainfall_closure_hours?", "reopen_sample_count_required?", "clean_sample_mpn_limit?", "conditional_management_plan_on_file?"]
    output: GrowingArea
    side_effects:
      - "classification = APPROVED, harvest_status = OPEN, version = 1"
      - "accepted_sample_count = 0, consecutive_clean_samples = 0, open_authorization_count = 0"
      - "geometric_mean_mpn, p90_mpn, last_closure_started_at and closure_reopen_eligible_at are null; eligible_classification = INSUFFICIENT_DATA"

  - method: GET
    path: "/shellfish/growing-areas/{id}"
    description: "Read a growing area including both status dimensions and the persisted SYSTEMATIC_RANDOM statistics."
    roles: [ShellfishControlAuthority, SitingReviewer, FarmOperator, HatcheryOperator, SeafoodDealer]
    code: 200
    input: []
    output: GrowingArea
    side_effects: []

  - method: GET
    path: "/shellfish/growing-areas"
    description: "List growing areas, optionally filtered by water body or either status dimension."
    roles: [ShellfishControlAuthority, SitingReviewer, FarmOperator, HatcheryOperator, SeafoodDealer]
    code: 200
    input: ["water_body?", "classification?", "harvest_status?", "limit?", "offset?"]
    output: GrowingArea[]
    side_effects: []

  - method: POST
    path: "/shellfish/growing-areas/{id}/classification-decisions"
    description: "Record a sanitary classification decision on the area. Requires the version of the area the decision was based on."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["classification", "expected_area_version", "decision_note?"]
    output: GrowingArea
    side_effects:
      - "state_machines.GrowingArea.classification transition per the requested classification"
      - "increments GrowingArea.version by 1"
      - "a decision into PROHIBITED also sets harvest_status = CLOSED_SAMPLE_FAILURE and runs the four-hop area-closure cascade (authorizations -> vessel/unit release -> lot embargo -> shipment hold)"
      - "recomputes GrowingArea.open_authorization_count"

  - method: POST
    path: "/shellfish/growing-areas/{id}/reopen"
    description: "Reopen a closed area once the closure duration has elapsed and the required consecutive clean samples are on file."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["reopen_note?"]
    output: GrowingArea
    side_effects:
      - "harvest_status = OPEN; consecutive_clean_samples = 0; closure_reopen_eligible_at = null"
      - "classification is unchanged"
      - "increments GrowingArea.version by 1"

  - method: GET
    path: "/shellfish/growing-areas/{id}/classification-summary"
    description: "Computed read of calculations.area_water_quality_statistics and calculations.area_eligible_classification for the requested variant. Defaults to SYSTEMATIC_RANDOM."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, sample_count: integer, mean_log10: number, geometric_mean_mpn: number, p90_mpn: number, eligible_classification: string, window_start_at: string, window_end_at: string }"
    side_effects: []

  - method: POST
    path: "/shellfish/growing-areas/{id}/water-samples"
    description: "Ingest a fecal-coliform water sample for the area. Recomputes the area statistics and may auto-downgrade and close the area."
    roles: [ShellfishControlAuthority]
    code: 201
    input: ["station_code", "collected_at", "fecal_coliform_mpn", "water_temp_c", "salinity_ppt?"]
    output: WaterSample
    side_effects:
      - "sample_status = ACCEPTED; any earlier ACCEPTED sample with the same station_code and the same collected_at calendar date becomes SUPERSEDED"
      - "is_adverse_condition and counted_clean computed for the new row"
      - "recomputes GrowingArea.accepted_sample_count, geometric_mean_mpn, p90_mpn, eligible_classification and consecutive_clean_samples"
      - "system sample sweep: when accepted_sample_count >= 5 and geometric_mean_mpn > 14.0 and eligible_classification is more restrictive than the current classification, the area is downgraded to eligible_classification, harvest_status = CLOSED_SAMPLE_FAILURE, and the four-hop area-closure cascade runs"
      - "increments GrowingArea.version by 1 whenever any GrowingArea field changes"

  - method: GET
    path: "/shellfish/growing-areas/{id}/water-samples"
    description: "List the area's water samples, newest collected_at first."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["sample_status?", "limit?", "offset?"]
    output: WaterSample[]
    side_effects: []

  - method: POST
    path: "/shellfish/growing-areas/{id}/rainfall-events"
    description: "Record a 24-hour rainfall accumulation for the area's gauge. A qualifying accumulation closes the area and cascades."
    roles: [ShellfishControlAuthority]
    code: 201
    input: [gauge_code, observed_at, inches_24h]
    output: RainfallEvent
    side_effects:
      - "triggered_closure = (inches_24h >= GrowingArea.rainfall_closure_threshold_in)"
      - "on closure: harvest_status = CLOSED_RAINFALL, last_closure_started_at = observed_at, closure_reopen_eligible_at = observed_at + rainfall_closure_hours, consecutive_clean_samples = 0"
      - "on closure: the four-hop area-closure cascade runs and voided_authorization_count records the authorizations voided by this event"
      - "classification is never changed by a rainfall event"
      - "increments GrowingArea.version by 1 on closure"

  - method: GET
    path: "/shellfish/growing-areas/{id}/rainfall-events"
    description: "List the area's rainfall events, newest observed_at first."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["triggered_closure?", "limit?", "offset?"]
    output: RainfallEvent[]
    side_effects: []

  # ---------------- Lease / permit acquisition -----------------------------
  - method: POST
    path: "/shellfish/leases"
    description: "Draft a lease application over a growing area, naming the plots and gear the operator intends to use."
    roles: [FarmOperator]
    code: 201
    input: [growing_area_id, lease_code, requested_acreage, plot_codes, gear_types_permitted, authorized_gear_units]
    output: Lease
    side_effects:
      - "operator_user_id = acting X-User-ID; status = DRAFT"
      - "navigation_clearance = NOT_STARTED, environmental_clearance = NOT_STARTED, revision_round = 0, deployed_gear_units = 0, royalty_accrued_cents = 0"

  - method: GET
    path: "/shellfish/leases/{id}"
    description: "Read a lease including both clearance legs, revision round and accrued royalty."
    roles: [ShellfishControlAuthority, SitingReviewer, FarmOperator]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/shellfish/leases"
    description: "List leases, optionally filtered by growing area, operator or status."
    roles: [ShellfishControlAuthority, SitingReviewer, FarmOperator]
    code: 200
    input: ["growing_area_id?", "operator_user_id?", "status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/shellfish/leases/{id}/submit"
    description: "Submit a DRAFT lease for siting review, or resubmit one that came back REVISION_REQUESTED."
    roles: [FarmOperator]
    code: 200
    input: ["submission_note?"]
    output: Lease
    side_effects:
      - "status = UNDER_REVIEW; navigation_clearance = PENDING; environmental_clearance = PENDING; both reviewer ids = null"
      - "on resubmission from REVISION_REQUESTED: revision_round + 1"

  - method: POST
    path: "/shellfish/leases/{id}/navigation-review"
    description: "Record the navigation clearance leg. A single reviewer may record only one of the two legs on a lease."
    roles: [SitingReviewer]
    code: 200
    input: ["decision", "review_note?"]
    output: Lease
    side_effects:
      - "navigation_clearance = CLEARED or OBJECTION; navigation_reviewer_user_id = acting X-User-ID"
      - "CLEARED completing the join -> status = PENDING_DECISION; CLEARED while the sibling is PENDING leaves status UNDER_REVIEW"
      - "OBJECTION -> status = REVISION_REQUESTED and environmental_clearance is left as it stands"

  - method: POST
    path: "/shellfish/leases/{id}/environmental-review"
    description: "Record the environmental clearance leg. An objection here invalidates any recorded navigation finding."
    roles: [SitingReviewer]
    code: 200
    input: ["decision", "review_note?"]
    output: Lease
    side_effects:
      - "environmental_clearance = CLEARED or OBJECTION; environmental_reviewer_user_id = acting X-User-ID"
      - "CLEARED completing the join -> status = PENDING_DECISION; CLEARED while the sibling is PENDING leaves status UNDER_REVIEW"
      - "OBJECTION -> status = REVISION_REQUESTED, navigation_clearance reset to PENDING and navigation_reviewer_user_id = null"

  - method: POST
    path: "/shellfish/leases/{id}/decision"
    description: "Approve or deny a lease that has cleared both review legs, stamping the rent-paid-through date."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["decision", "rent_paid_through_date?", "decision_note?"]
    output: Lease
    side_effects:
      - "status = APPROVED or DENIED; decided_at = logical clock"
      - "on APPROVE: rent_paid_through_date = payload value when supplied, else the logical clock's calendar date"

  # ---------------- Hatchery + seed acquisition ----------------------------
  - method: POST
    path: "/shellfish/hatcheries"
    description: "Register a hatchery with its shellfish-health certificate and pathogen-free species list."
    roles: [ShellfishControlAuthority]
    code: 201
    input: [name, state_code, ncsp_certificate_no, certificate_expires_on, pathogen_free_species]
    output: Hatchery
    side_effects: []

  - method: GET
    path: "/shellfish/hatcheries/{id}"
    description: "Read a hatchery and its certificate window."
    roles: [ShellfishControlAuthority, HatcheryOperator, FarmOperator]
    code: 200
    input: []
    output: Hatchery
    side_effects: []

  - method: POST
    path: "/shellfish/seed-lots"
    description: "Record a seed shipment from a hatchery to a lease, with its disease-free certificate."
    roles: [HatcheryOperator]
    code: 201
    input: [hatchery_id, lease_id, species, received_seed_count, disease_certificate_no, disease_cert_issued_on, shipped_on]
    output: SeedLot
    side_effects:
      - "status = RECEIVED; screening_result, screened_on and all nursery fields null"
      - "allocated_seed_count = 0, unallocated_seed_count = 0, survival_rate_pct null"

  - method: GET
    path: "/shellfish/seed-lots/{id}"
    description: "Read a seed lot including screening outcome, nursery dates and seed allocation counters."
    roles: [ShellfishControlAuthority, HatcheryOperator, FarmOperator]
    code: 200
    input: []
    output: SeedLot
    side_effects: []

  - method: GET
    path: "/shellfish/seed-lots"
    description: "List seed lots, optionally filtered by hatchery, destination lease or status."
    roles: [ShellfishControlAuthority, HatcheryOperator, FarmOperator]
    code: 200
    input: ["hatchery_id?", "lease_id?", "status?", "limit?", "offset?"]
    output: SeedLot[]
    side_effects: []

  - method: POST
    path: "/shellfish/seed-lots/{id}/screening"
    description: "Record the authority's pathogen screening for a received seed lot. A positive result rejects the lot and cascades."
    roles: [ShellfishControlAuthority]
    code: 200
    input: [result, screened_on]
    output: SeedLot
    side_effects:
      - "screening_result and screened_on stamped"
      - "NEGATIVE -> status = SCREENED"
      - "POSITIVE -> status = REJECTED plus the three-hop rejection cascade: DEPLOYED/HARVESTING GrowoutUnits -> VOIDED (SEED_LOT_REJECTED), releasing Lease.deployed_gear_units and SeedLot.allocated_seed_count, then their ISSUED/ACTIVE authorizations -> VOIDED, releasing HarvestVessel.active_authorization_count"

  - method: POST
    path: "/shellfish/seed-lots/{id}/nursery-start"
    description: "Start nursery grow-out for a screened seed lot."
    roles: [FarmOperator]
    code: 200
    input: [nursery_started_on, nursery_system]
    output: SeedLot
    side_effects:
      - "nursery_started_on and nursery_system stamped; status = NURSERY"

  - method: POST
    path: "/shellfish/seed-lots/{id}/nursery-complete"
    description: "Close nursery grow-out, reporting survivors. Sets the plantable seed pool."
    roles: [FarmOperator]
    code: 200
    input: [nursery_completed_on, surviving_seed_count]
    output: SeedLot
    side_effects:
      - "surviving_seed_count and nursery_completed_on stamped; survival_rate_pct computed per calculations.seed_lot_allocation_and_survival"
      - "unallocated_seed_count = surviving_seed_count; allocated_seed_count = 0; status = READY_FOR_PLANTING"

  # ---------------- Grow-out operations ------------------------------------
  - method: POST
    path: "/shellfish/growout-units"
    description: "Deploy gear on a lease plot and plant seed from a plantable seed lot."
    roles: [FarmOperator]
    code: 201
    input: [lease_id, seed_lot_id, plot_code, gear_type, gear_units, seed_count_planted, deployed_on, planned_retrieval_on]
    output: GrowoutUnit
    side_effects:
      - "status = DEPLOYED; husbandry_current = false; mortality_count_total = 0; last_inspection_at and last_predator_control_at null"
      - "Lease.deployed_gear_units + gear_units per calculations.lease_gear_utilisation"
      - "SeedLot.allocated_seed_count + seed_count_planted and unallocated_seed_count - seed_count_planted"
      - "SeedLot READY_FOR_PLANTING -> PLANTED when unallocated_seed_count reaches 0"

  - method: GET
    path: "/shellfish/growout-units/{id}"
    description: "Read a deployment including husbandry currency and mortality total."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: []
    output: GrowoutUnit
    side_effects: []

  - method: GET
    path: "/shellfish/growout-units"
    description: "List deployments, optionally filtered by lease, seed lot, plot or status."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["lease_id?", "seed_lot_id?", "plot_code?", "status?", "limit?", "offset?"]
    output: GrowoutUnit[]
    side_effects: []

  - method: POST
    path: "/shellfish/growout-units/{id}/husbandry-logs"
    description: "Record husbandry work (inspection, predator control, thinning or gear maintenance) on a deployment."
    roles: [FarmOperator]
    code: 201
    input: ["log_type", "performed_at", "predator_species?", "control_method?", "mortality_count?", "notes?"]
    output: HusbandryLog
    side_effects:
      - "performed_by_user_id = acting X-User-ID"
      - "recomputes GrowoutUnit.last_inspection_at, last_predator_control_at, husbandry_current and mortality_count_total per calculations.growout_husbandry_currency"

  - method: GET
    path: "/shellfish/growout-units/{id}/husbandry-logs"
    description: "List husbandry logs for a deployment, newest performed_at first."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["log_type?", "limit?", "offset?"]
    output: HusbandryLog[]
    side_effects: []

  - method: POST
    path: "/shellfish/growout-units/{id}/retrieve"
    description: "Retrieve gear at the end of a grow-out cycle, releasing lease gear capacity but not the planted seed."
    roles: [FarmOperator]
    code: 200
    input: [retrieved_on]
    output: GrowoutUnit
    side_effects:
      - "status = RETRIEVED; retrieved_on stamped"
      - "Lease.deployed_gear_units - gear_units"
      - "SeedLot.allocated_seed_count is NOT released"

  - method: POST
    path: "/shellfish/growout-units/{id}/void"
    description: "Void a deployment recorded in error, reversing every counter the deployment moved."
    roles: [FarmOperator]
    code: 200
    input: ["void_note?"]
    output: GrowoutUnit
    side_effects:
      - "status = VOIDED; void_reason = OPERATOR_CORRECTION"
      - "Lease.deployed_gear_units - gear_units"
      - "SeedLot.allocated_seed_count - seed_count_planted; unallocated_seed_count + seed_count_planted"
      - "SeedLot PLANTED -> READY_FOR_PLANTING when unallocated_seed_count becomes > 0"
      - "the plot's occupation interval is released for calculations.plot_fallow_window"

  # ---------------- Vessels ------------------------------------------------
  - method: POST
    path: "/shellfish/harvest-vessels"
    description: "Register a harvest vessel, its onboard refrigeration and how many overlapping authorizations it may carry."
    roles: [FarmOperator]
    code: 201
    input: ["name", "registration_no", "refrigeration_type", "concurrent_authorization_capacity?"]
    output: HarvestVessel
    side_effects:
      - "active_authorization_count = 0"

  - method: GET
    path: "/shellfish/harvest-vessels/{id}"
    description: "Read a vessel including its current authorization load."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: []
    output: HarvestVessel
    side_effects: []

  # ---------------- Harvest authorizations --------------------------------
  - method: POST
    path: "/shellfish/harvest-authorizations"
    description: "Issue a harvest authorization for a window over one deployment, one vessel and one receiving dealer."
    roles: [FarmOperator]
    code: 201
    input: [lease_id, growout_unit_id, vessel_id, dealer_id, window_start, window_end, projected_bushels]
    output: HarvestAuthorization
    side_effects:
      - "status = ISSUED; harvested_bushels = 0; harvest_start_at and harvest_end_at null"
      - "growing_area_id snapshotted from Lease.growing_area_id per calculations.authorization_area_denormalisation"
      - "HarvestVessel.active_authorization_count + 1"
      - "recomputes GrowingArea.open_authorization_count"

  - method: GET
    path: "/shellfish/harvest-authorizations/{id}"
    description: "Read an authorization including its window, snapshotted area and harvested volume."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: []
    output: HarvestAuthorization
    side_effects: []

  - method: GET
    path: "/shellfish/harvest-authorizations"
    description: "List authorizations, optionally filtered by lease, deployment, vessel, dealer or status."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["lease_id?", "growout_unit_id?", "vessel_id?", "dealer_id?", "status?", "limit?", "offset?"]
    output: HarvestAuthorization[]
    side_effects: []

  - method: POST
    path: "/shellfish/harvest-authorizations/{id}/activate"
    description: "Start harvesting under an issued authorization. Gated on the growing area being open and appropriately classified."
    roles: [FarmOperator]
    code: 200
    input: []
    output: HarvestAuthorization
    side_effects:
      - "status = ACTIVE; harvest_start_at = logical clock"
      - "GrowoutUnit DEPLOYED -> HARVESTING"

  - method: POST
    path: "/shellfish/harvest-authorizations/{id}/close"
    description: "Close an active authorization, returning the gear to grow-out and releasing vessel capacity."
    roles: [FarmOperator]
    code: 200
    input: []
    output: HarvestAuthorization
    side_effects:
      - "status = CLOSED; harvest_end_at = logical clock"
      - "GrowoutUnit HARVESTING -> DEPLOYED; HarvestVessel.active_authorization_count - 1"
      - "recomputes GrowingArea.open_authorization_count"

  - method: POST
    path: "/shellfish/harvest-authorizations/{id}/harvest-lots"
    description: "Land a harvest lot under an active authorization. Computes both time-to-temperature bases, the vibrio allowance and the full settlement."
    roles: [FarmOperator]
    code: 201
    input: [lot_code, bushels, first_out_of_water_at, last_out_of_water_at, placed_in_temperature_control_at, water_temp_c]
    output: HarvestLot
    side_effects:
      - "status = HARVESTED; dealer_id copied from the authorization; shipment_id null"
      - "vibrio_plan_month, vibrio_control_plan_id and allowed_ttt_minutes per calculations.vibrio_allowed_time_to_temperature_minutes"
      - "ttt_minutes_first_basis, ttt_minutes_last_basis, ttt_basis_variant, governing_ttt_minutes and compliance_status per calculations.harvest_lot_time_to_temperature"
      - "season_total_bushels_at_creation, royalty_rate_cents_per_bushel, royalty_cents, inspection_fee_cents, conservation_surcharge_cents and lot_settlement_cents per calculations.lease_harvest_settlement"
      - "Lease.royalty_accrued_cents + lot_settlement_cents; HarvestAuthorization.harvested_bushels + bushels"

  - method: GET
    path: "/shellfish/harvest-authorizations/{id}/harvest-lots"
    description: "List the lots landed under an authorization, oldest first_out_of_water_at first."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HarvestLot[]
    side_effects: []

  # ---------------- Harvest lots and tagging ------------------------------
  - method: GET
    path: "/shellfish/harvest-lots/{id}"
    description: "Read a harvest lot including both time-to-temperature bases, the tag fields and the settlement breakdown."
    roles: [ShellfishControlAuthority, FarmOperator, SeafoodDealer]
    code: 200
    input: []
    output: HarvestLot
    side_effects: []

  - method: GET
    path: "/shellfish/harvest-lots"
    description: "List harvest lots, optionally filtered by authorization, dealer, shipment, vibrio plan or status."
    roles: [ShellfishControlAuthority, FarmOperator, SeafoodDealer]
    code: 200
    input: ["harvest_authorization_id?", "dealer_id?", "shipment_id?", "vibrio_control_plan_id?", "status?", "limit?", "offset?"]
    output: HarvestLot[]
    side_effects: []

  - method: POST
    path: "/shellfish/harvest-lots/{id}/tag"
    description: "Issue the shellstock tag, stamping harvest date, harvest location and dealer certification onto the lot."
    roles: [FarmOperator]
    code: 200
    input: [harvest_date, dealer_certification_no]
    output: HarvestLot
    side_effects:
      - "status = TAGGED"
      - "tag_harvest_date = payload harvest_date; tag_area_code = GrowingArea.code; tag_lease_code = Lease.lease_code; tag_dealer_certification_no = payload dealer_certification_no"

  - method: POST
    path: "/shellfish/harvest-lots/{id}/void"
    description: "Void a lot recorded in error, reversing the lease accrual and the authorization volume exactly."
    roles: [FarmOperator]
    code: 200
    input: ["void_note?"]
    output: HarvestLot
    side_effects:
      - "status = VOIDED; void_reason = OPERATOR_CORRECTION; tag fields retained"
      - "Lease.royalty_accrued_cents - lot_settlement_cents"
      - "HarvestAuthorization.harvested_bushels - bushels"
      - "no surviving lot's royalty_rate_cents_per_bushel is recomputed"

  # ---------------- Dealer certification and listing ----------------------
  - method: POST
    path: "/shellfish/dealers"
    description: "Certify a seafood dealer in a certification category. New dealers are not yet interstate-listed."
    roles: [ShellfishControlAuthority]
    code: 201
    input: [name, state_code, certification_category, certification_no, certified_through]
    output: Dealer
    side_effects:
      - "listing_status = NOT_LISTED; icssl_listed_through null; recall_strike_count = 0; version = 1"

  - method: GET
    path: "/shellfish/dealers/{id}"
    description: "Read a dealer including certification window, interstate listing window and recall strikes."
    roles: [ShellfishControlAuthority, SeafoodDealer, FarmOperator]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/shellfish/dealers/{id}/certification-renewals"
    description: "Renew a dealer's certification and interstate shipper listing. Requires the version of the dealer the renewal was based on."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["expected_dealer_version", "certified_through", "icssl_listed_through?"]
    output: Dealer
    side_effects:
      - "certified_through replaced; icssl_listed_through replaced when supplied"
      - "listing_status NOT_LISTED -> LISTED when icssl_listed_through is supplied"
      - "increments Dealer.version by 1"

  - method: POST
    path: "/shellfish/dealers/{id}/suspend"
    description: "Suspend a listed dealer by authority action, holding its unshipped shipments."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["suspension_note?"]
    output: Dealer
    side_effects:
      - "listing_status = SUSPENDED; suspension_reason = AUTHORITY_ACTION"
      - "every Shipment of this dealer with status == CREATED -> HELD (held_reason = DEALER_SUSPENSION)"

  - method: POST
    path: "/shellfish/dealers/{id}/reinstate"
    description: "Reinstate a suspended dealer. Recall strikes are never cleared."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["icssl_listed_through?"]
    output: Dealer
    side_effects:
      - "listing_status = LISTED; suspension_reason = null; icssl_listed_through replaced when supplied"
      - "recall_strike_count unchanged"

  # ---------------- Shipping ----------------------------------------------
  - method: POST
    path: "/shellfish/shipments"
    description: "Assemble a shipment of tagged lots for a destination state."
    roles: [SeafoodDealer]
    code: 201
    input: [dealer_id, destination_state, carrier, lot_ids]
    output: Shipment
    side_effects:
      - "status = CREATED; lot_count and total_bushels computed from lot_ids; is_interstate = (destination_state != Dealer.state_code)"
      - "every lot in lot_ids has shipment_id set to this shipment"

  - method: GET
    path: "/shellfish/shipments/{id}"
    description: "Read a shipment including its lot roster and interstate flag."
    roles: [ShellfishControlAuthority, SeafoodDealer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shellfish/shipments"
    description: "List shipments, optionally filtered by dealer or status."
    roles: [ShellfishControlAuthority, SeafoodDealer]
    code: 200
    input: ["dealer_id?", "status?", "is_interstate?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shellfish/shipments/{id}/ship"
    description: "Release the shipment. Interstate shipments additionally require a current interstate shipper listing."
    roles: [SeafoodDealer]
    code: 200
    input: [shipped_at]
    output: Shipment
    side_effects:
      - "status = SHIPPED; shipped_at stamped"
      - "every lot in lot_ids TAGGED -> SHIPPED"

  - method: POST
    path: "/shellfish/shipments/{id}/illness-investigations"
    description: "Open an illness investigation naming this shipment as the reported source."
    roles: [ShellfishControlAuthority]
    code: 201
    input: [reported_at, illness_count, pathogen]
    output: IllnessInvestigation
    side_effects:
      - "status = OPEN; scope_variant, traced_lot_ids, traced_lot_count and confirmed_at null/empty; recalled_shipment_count = 0"

  - method: GET
    path: "/shellfish/shipments/{id}/illness-investigations"
    description: "List investigations naming this shipment as source, newest reported_at first."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IllnessInvestigation[]
    side_effects: []

  # ---------------- Illness investigation and recall ---------------------
  - method: GET
    path: "/shellfish/illness-investigations/{id}"
    description: "Read an investigation including its traceback documentation."
    roles: [ShellfishControlAuthority]
    code: 200
    input: []
    output: IllnessInvestigation
    side_effects: []

  - method: POST
    path: "/shellfish/illness-investigations/{id}/traceback"
    description: "Run the traceback at the requested scope, producing the traced-lot documentation. Re-runnable with a different scope."
    roles: [ShellfishControlAuthority]
    code: 200
    input: [scope_variant]
    output: IllnessInvestigation
    side_effects:
      - "status = TRACEBACK; scope_variant stamped"
      - "traced_lot_ids and traced_lot_count per calculations.illness_traceback_scope"

  - method: POST
    path: "/shellfish/illness-investigations/{id}/confirm"
    description: "Confirm the illness link and run the four-hop recall cascade over the traced lots."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["confirmed_at?"]
    output: IllnessInvestigation
    side_effects:
      - "status = CONFIRMED; confirmed_at = payload value when supplied else the logical clock"
      - "hop 1: traced lots with status IN {TAGGED, SHIPPED} -> RECALLED"
      - "hop 2: their shipments with status IN {CREATED, SHIPPED, HELD} -> RECALLED (recall_reason = ILLNESS_TRACEBACK); recalled_shipment_count records the distinct count"
      - "hop 3: Dealer.recall_strike_count + 1 per recalled shipment; LISTED -> SUSPENDED at >= 2 strikes (suspension_reason = RECALL_STRIKES)"
      - "hop 4: each newly suspended dealer's remaining CREATED shipments -> HELD (held_reason = DEALER_SUSPENSION)"

  - method: POST
    path: "/shellfish/illness-investigations/{id}/close"
    description: "Close an investigation as unsubstantiated, retaining any traceback documentation already produced."
    roles: [ShellfishControlAuthority]
    code: 200
    input: ["close_note?"]
    output: IllnessInvestigation
    side_effects:
      - "status = CLOSED_UNSUBSTANTIATED; no lot, shipment or dealer is touched"

  # ---------------- Vibrio control plans ---------------------------------
  - method: POST
    path: "/shellfish/vibrio-control-plans"
    description: "Publish the vibrio management plan for one season month. Supersedes the incumbent ACTIVE plan for that month."
    roles: [ShellfishControlAuthority]
    code: 201
    input: [season_month, max_time_to_temperature_minutes, high_water_temp_c, high_temp_reduction_minutes]
    output: VibrioControlPlan
    side_effects:
      - "status = ACTIVE"
      - "any existing ACTIVE plan with the same season_month -> SUPERSEDED"

  - method: GET
    path: "/shellfish/vibrio-control-plans/{id}"
    description: "Read a vibrio control plan."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: []
    output: VibrioControlPlan
    side_effects: []

  - method: GET
    path: "/shellfish/vibrio-control-plans"
    description: "List vibrio control plans, optionally filtered by season month or status."
    roles: [ShellfishControlAuthority, FarmOperator]
    code: 200
    input: ["season_month?", "status?", "limit?", "offset?"]
    output: VibrioControlPlan[]
    side_effects: []

  # ---------------- Test-driving endpoint (logical clock) ----------------
  - method: POST
    path: "/shellfish/_clock/set_current_utc"
    description: "Set the server's logical clock, which every temporal rule in this API reads instead of wall-clock time. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ShellfishControlAuthority, SitingReviewer, FarmOperator, HatcheryOperator, SeafoodDealer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock is set to to_iso8601; no entity is mutated and no recomputation is triggered"

# =============================================================================
# §1.6 Error Code Catalog  (every id is triggered by a §1.4 row or a §1.2 transition)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Raised when this does not hold: X-User-ID and X-Role headers are both present and non-empty strings"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Raised when this does not hold: X-Role is one of the roles listed on the addressed endpoint in §1.5"
  - id: ERR_GROWING_AREA_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed GrowingArea exists; also validates growing_area_id in bodies"
  - id: ERR_LEASE_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed Lease exists; also validates lease_id in bodies"
  - id: ERR_HATCHERY_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed Hatchery exists; also validates hatchery_id in bodies"
  - id: ERR_SEED_LOT_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed SeedLot exists; also validates seed_lot_id in bodies"
  - id: ERR_GROWOUT_UNIT_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed GrowoutUnit exists; also validates growout_unit_id in bodies"
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed HarvestVessel exists; also validates vessel_id in bodies"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed HarvestAuthorization exists"
  - id: ERR_HARVEST_LOT_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed HarvestLot exists; also validates every member of Shipment.lot_ids"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed Dealer exists; also validates dealer_id in bodies"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed Shipment exists"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed IllnessInvestigation exists"
  - id: ERR_VIBRIO_PLAN_NOT_FOUND
    http: 404
    condition: "Raised when this does not hold: The addressed VibrioControlPlan exists"
  - id: ERR_LEASE_OWNERSHIP_VIOLATION
    http: 403
    condition: "Raised when this does not hold: For FarmOperator writes on lease-scoped objects, X-User-ID == Lease.operator_user_id of the addressed object's lease"
  - id: ERR_HATCHERY_OWNERSHIP_VIOLATION
    http: 403
    condition: "Raised when this does not hold: For HatcheryOperator writes, X-User-ID == the addressed SeedLot's hatchery_id (the HatcheryOperator role is entity_backed by Hatchery)"
  - id: ERR_DEALER_OWNERSHIP_VIOLATION
    http: 403
    condition: "Raised when this does not hold: For SeafoodDealer writes, X-User-ID == Shipment.dealer_id (the SeafoodDealer role is entity_backed by Dealer)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Raised when this does not hold: Body/query conforms to the endpoint's input schema: required fields present, types and enum members valid, numbers within declared ranges, dates YYYY-MM-DD, instants ISO-8601 UTC, limit in [1,100], offset >= 0"
  - id: ERR_STALE_AREA_VERSION
    http: 412
    condition: "Raised when this does not hold: expected_area_version == GrowingArea.version"
  - id: ERR_STALE_DEALER_VERSION
    http: 412
    condition: "Raised when this does not hold: expected_dealer_version == Dealer.version"
  - id: ERR_INVALID_LEASE_STATE
    http: 409
    condition: "Raised when this does not hold: Lease.status is a declared `from:` state of the requested transition, and is APPROVED for every production operation that consumes the lease"
  - id: ERR_INVALID_SEED_LOT_STATE
    http: 409
    condition: "Raised when this does not hold: SeedLot.status is a declared `from:` state of the requested transition"
  - id: ERR_INVALID_GROWOUT_UNIT_STATE
    http: 409
    condition: "Raised when this does not hold: GrowoutUnit.status is a declared `from:` state of the requested transition"
  - id: ERR_INVALID_AUTHORIZATION_STATE
    http: 409
    condition: "Raised when this does not hold: HarvestAuthorization.status is a declared `from:` state of the requested transition (activate needs ISSUED; close and landing need ACTIVE)"
  - id: ERR_INVALID_LOT_STATE
    http: 409
    condition: "Raised when this does not hold: HarvestLot.status is a declared `from:` state of the requested transition (tag needs HARVESTED; void needs HARVESTED or TAGGED with shipment_id null)"
  - id: ERR_INVALID_SHIPMENT_STATE
    http: 409
    condition: "Raised when this does not hold: Shipment.status == CREATED for ship; IN {CREATED, SHIPPED, HELD} for opening an investigation"
  - id: ERR_INVALID_INVESTIGATION_STATE
    http: 409
    condition: "Raised when this does not hold: IllnessInvestigation.status is a declared `from:` state (traceback needs OPEN or TRACEBACK; confirm needs TRACEBACK; close needs OPEN or TRACEBACK)"
  - id: ERR_INVALID_DEALER_LISTING_STATE
    http: 409
    condition: "Raised when this does not hold: Dealer.listing_status is a declared `from:` state (suspend needs LISTED; reinstate needs SUSPENDED)"
  - id: ERR_AREA_ALREADY_OPEN
    http: 409
    condition: "Raised when this does not hold: GrowingArea.harvest_status != OPEN when a reopen is requested"
  - id: ERR_AREA_CLASSIFICATION_NOT_HARVESTABLE
    http: 409
    condition: "Raised when this does not hold: GrowingArea.classification IN {APPROVED, CONDITIONALLY_APPROVED} for any harvest operation on the area"
  - id: ERR_AREA_PROHIBITED
    http: 409
    condition: "Raised when this does not hold: GrowingArea.classification != PROHIBITED"
  - id: ERR_AREA_HARVEST_CLOSED
    http: 409
    condition: "Raised when this does not hold: GrowingArea.harvest_status == OPEN for the area behind the lease"
  - id: ERR_HATCHERY_CERTIFICATE_EXPIRED
    http: 409
    condition: "Raised when this does not hold: Hatchery.certificate_expires_on >= SeedLot.shipped_on"
  - id: ERR_SPECIES_NOT_CERTIFIED
    http: 409
    condition: "Raised when this does not hold: SeedLot.species is a member of Hatchery.pathogen_free_species"
  - id: ERR_DISEASE_CERTIFICATE_STALE
    http: 409
    condition: "Raised when this does not hold: shipped_on - disease_cert_issued_on <= DISEASE_CERT_MAX_AGE_DAYS (30)"
  - id: ERR_TIME_TEMPERATURE_EXCEEDED
    http: 409
    condition: "Raised when this does not hold: HarvestLot.compliance_status == COMPLIANT before a tag may be issued"
  - id: ERR_NO_VIBRIO_PLAN_FOR_SEASON
    http: 409
    condition: "Raised when this does not hold: An ACTIVE VibrioControlPlan exists for the UTC month of first_out_of_water_at"
  - id: ERR_REOPEN_TOO_EARLY
    http: 409
    condition: "Raised when this does not hold: current_utc >= GrowingArea.closure_reopen_eligible_at"
  - id: ERR_NURSERY_PERIOD_TOO_SHORT
    http: 422
    condition: "Raised when this does not hold: nursery_completed_on >= nursery_started_on + MIN_NURSERY_DAYS (21)"
  - id: ERR_FUTURE_DATED_EVENT
    http: 422
    condition: "Raised when this does not hold: Every client-supplied instant or calendar date describing something that already happened is <= the logical clock (collected_at, observed_at, performed_at, deployed_on, retrieved_on, shipped_on, screened_on, nursery dates, harvest instants, shipped_at, reported_at)"
  - id: ERR_INVALID_DEPLOYMENT_WINDOW
    http: 422
    condition: "Raised when this does not hold: planned_retrieval_on > deployed_on"
  - id: ERR_AUTHORIZATION_WINDOW_INVALID
    http: 422
    condition: "Raised when this does not hold: window_end > window_start and window_end - window_start <= MAX_AUTHORIZATION_WINDOW_HOURS (24)"
  - id: ERR_OUTSIDE_AUTHORIZATION_WINDOW
    http: 409
    condition: "Raised when this does not hold: The logical clock (activation) or first_out_of_water_at (landing) falls inside the half-open window [window_start, window_end)"
  - id: ERR_SCREENING_DATE_INVALID
    http: 422
    condition: "Raised when this does not hold: screened_on >= SeedLot.shipped_on"
  - id: ERR_INVALID_HARVEST_INSTANTS
    http: 422
    condition: "Raised when this does not hold: last_out_of_water_at >= first_out_of_water_at and placed_in_temperature_control_at >= last_out_of_water_at"
  - id: ERR_INSUFFICIENT_CLEAN_SAMPLES
    http: 409
    condition: "Raised when this does not hold: GrowingArea.consecutive_clean_samples >= GrowingArea.reopen_sample_count_required"
  - id: ERR_INSUFFICIENT_SAMPLE_DATA
    http: 409
    condition: "Raised when this does not hold: GrowingArea.accepted_sample_count >= MIN_SAMPLES_FOR_DECISION (5)"
  - id: ERR_CLASSIFICATION_NOT_SUPPORTED_BY_DATA
    http: 409
    condition: "Raised when this does not hold: For an upgrade (restrictiveness rank decreases), eligible_classification must be at least as permissive as the requested classification"
  - id: ERR_CLASSIFICATION_STEP_SKIPPED
    http: 409
    condition: "Raised when this does not hold: An upgrade improves the restrictiveness rank by exactly 1"
  - id: ERR_CONDITIONAL_PLAN_REQUIRED
    http: 409
    condition: "Raised when this does not hold: conditional_management_plan_on_file == true when the requested classification is CONDITIONALLY_APPROVED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Raised when this does not hold: The acting X-User-ID has not already recorded the sibling clearance on this lease"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "Raised when this does not hold: Lease.revision_round < MAX_REVISION_ROUNDS (3) on resubmission from REVISION_REQUESTED"
  - id: ERR_PLOT_OCCUPIED
    http: 409
    condition: "Raised when this does not hold: The requested plot_code has no truly overlapping occupation interval per calculations.plot_fallow_window"
  - id: ERR_PLOT_FALLOW_CONFLICT
    http: 409
    condition: "Raised when this does not hold: deployed_on >= the plot's last effective_end + FALLOW_DAYS (14)"
  - id: ERR_VESSEL_CAPACITY_CONFLICT
    http: 409
    condition: "Raised when this does not hold: Overlapping ISSUED/ACTIVE authorizations on the vessel + 1 <= HarvestVessel.concurrent_authorization_capacity"
  - id: ERR_UNIT_ALREADY_AUTHORIZED
    http: 409
    condition: "Raised when this does not hold: The GrowoutUnit has no other authorization with status IN {ISSUED, ACTIVE}"
  - id: ERR_HUSBANDRY_LAPSED
    http: 409
    condition: "Raised when this does not hold: GrowoutUnit.last_inspection_at is within INSPECTION_MAX_AGE_DAYS (30) of the logical clock"
  - id: ERR_PREDATOR_CONTROL_LAPSED
    http: 409
    condition: "Raised when this does not hold: For BOTTOM gear, GrowoutUnit.last_predator_control_at is within PREDATOR_CONTROL_MAX_AGE_DAYS (60) of the logical clock"
  - id: ERR_LEASE_GEAR_CAPACITY_EXCEEDED
    http: 409
    condition: "Raised when this does not hold: Lease.deployed_gear_units + gear_units <= Lease.authorized_gear_units"
  - id: ERR_SEED_ALLOCATION_EXCEEDED
    http: 409
    condition: "Raised when this does not hold: seed_count_planted <= SeedLot.unallocated_seed_count"
  - id: ERR_SEED_SURVIVAL_BELOW_FLOOR
    http: 409
    condition: "Raised when this does not hold: survival_rate_pct >= SURVIVAL_FLOOR_PCT (40.00), and surviving_seed_count <= received_seed_count"
  - id: ERR_HARVEST_EXCEEDS_PROJECTION
    http: 409
    condition: "Raised when this does not hold: HarvestAuthorization.harvested_bushels + bushels <= HarvestAuthorization.projected_bushels"
  - id: ERR_DUPLICATE_AREA_CODE
    http: 409
    condition: "Raised when this does not hold: GrowingArea.code is unique across growing areas"
  - id: ERR_DUPLICATE_LOT_CODE
    http: 409
    condition: "Raised when this does not hold: HarvestLot.lot_code is unique across harvest lots"
  - id: ERR_SEED_LOT_NOT_PLANTABLE
    http: 409
    condition: "Raised when this does not hold: SeedLot.status IN {READY_FOR_PLANTING, PLANTED} when planting into new gear"
  - id: ERR_DEALER_CATEGORY_NOT_PERMITTED
    http: 409
    condition: "Raised when this does not hold: Dealer.certification_category IN {SHELLSTOCK_SHIPPER, SHUCKER_PACKER} to receive shellstock directly from a harvest"
  - id: ERR_DEALER_NOT_LISTED_FOR_INTERSTATE
    http: 409
    condition: "Raised when this does not hold: Dealer.icssl_listed_through >= the logical clock's calendar date when Shipment.is_interstate == true"
  - id: ERR_DEALER_CERTIFICATION_EXPIRED
    http: 409
    condition: "Raised when this does not hold: Dealer.certified_through >= the logical clock's calendar date"
  - id: ERR_LOT_NOT_TAGGED
    http: 409
    condition: "Raised when this does not hold: Every lot in Shipment.lot_ids has status == TAGGED"
  - id: ERR_LOT_DEALER_MISMATCH
    http: 409
    condition: "Raised when this does not hold: Every lot in Shipment.lot_ids has dealer_id == Shipment.dealer_id and shipment_id null"
  - id: ERR_TAG_HARVEST_DATE_MISMATCH
    http: 409
    condition: "Raised when this does not hold: payload harvest_date == the UTC calendar date of HarvestLot.first_out_of_water_at"
  - id: ERR_TAG_DEALER_CERT_MISMATCH
    http: 409
    condition: "Raised when this does not hold: payload dealer_certification_no == Dealer.certification_no of HarvestLot.dealer_id"
  - id: ERR_UNIT_LEASE_MISMATCH
    http: 409
    condition: "Raised when this does not hold: GrowoutUnit.lease_id == the requested lease_id"
  - id: ERR_PLOT_NOT_IN_LEASE
    http: 409
    condition: "Raised when this does not hold: plot_code is a member of Lease.plot_codes"
  - id: ERR_GEAR_TYPE_NOT_PERMITTED
    http: 409
    condition: "Raised when this does not hold: gear_type is a member of Lease.gear_types_permitted"
  - id: ERR_SEED_LOT_LEASE_MISMATCH
    http: 409
    condition: "Raised when this does not hold: SeedLot.lease_id == the new GrowoutUnit's lease_id"
  - id: ERR_DEALER_SUSPENDED
    http: 409
    condition: "Raised when this does not hold: Dealer.listing_status != SUSPENDED"
  - id: ERR_DEALER_NOT_LISTED
    http: 409
    condition: "Raised when this does not hold: Dealer.listing_status == LISTED when a shipment leaves the dock"
  - id: ERR_LEASE_RENT_DELINQUENT
    http: 402
    condition: "Raised when this does not hold: Lease.rent_paid_through_date >= the logical clock's calendar date"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShellfishControlAuthority
    description: "The state shellfish control authority. Owns growing-area classification, monitoring data, seed screening, lease decisions, dealer certification and illness investigations."
    identity: opaque
    exclusive_operations:
      - "POST /shellfish/growing-areas"
      - "POST /shellfish/growing-areas/{id}/classification-decisions"
      - "POST /shellfish/growing-areas/{id}/reopen"
      - "POST /shellfish/growing-areas/{id}/water-samples"
      - "POST /shellfish/growing-areas/{id}/rainfall-events"
      - "POST /shellfish/leases/{id}/decision"
      - "POST /shellfish/hatcheries"
      - "POST /shellfish/seed-lots/{id}/screening"
      - "POST /shellfish/dealers"
      - "POST /shellfish/dealers/{id}/certification-renewals"
      - "POST /shellfish/dealers/{id}/suspend"
      - "POST /shellfish/dealers/{id}/reinstate"
      - "POST /shellfish/shipments/{id}/illness-investigations"
      - "GET /shellfish/shipments/{id}/illness-investigations"
      - "GET /shellfish/illness-investigations/{id}"
      - "POST /shellfish/illness-investigations/{id}/traceback"
      - "POST /shellfish/illness-investigations/{id}/confirm"
      - "POST /shellfish/illness-investigations/{id}/close"
      - "POST /shellfish/vibrio-control-plans"
    shared_operations:
      - "GET /shellfish/growing-areas/{id} and GET /shellfish/growing-areas (all roles)"
      - "GET /shellfish/growing-areas/{id}/classification-summary (with FarmOperator)"
      - "GET /shellfish/growing-areas/{id}/water-samples and .../rainfall-events (with FarmOperator)"
      - "GET /shellfish/leases/{id} and GET /shellfish/leases (with SitingReviewer, FarmOperator)"
      - "GET /shellfish/hatcheries/{id} (with HatcheryOperator, FarmOperator)"
      - "GET /shellfish/seed-lots/{id} and GET /shellfish/seed-lots (with HatcheryOperator, FarmOperator)"
      - "GET /shellfish/growout-units/{id}, GET /shellfish/growout-units, GET /shellfish/growout-units/{id}/husbandry-logs (with FarmOperator)"
      - "GET /shellfish/harvest-vessels/{id} (with FarmOperator)"
      - "GET /shellfish/harvest-authorizations/{id}, GET /shellfish/harvest-authorizations, GET /shellfish/harvest-authorizations/{id}/harvest-lots (with FarmOperator)"
      - "GET /shellfish/harvest-lots/{id} and GET /shellfish/harvest-lots (with FarmOperator, SeafoodDealer)"
      - "GET /shellfish/dealers/{id} (with SeafoodDealer, FarmOperator)"
      - "GET /shellfish/shipments/{id} and GET /shellfish/shipments (with SeafoodDealer)"
      - "GET /shellfish/vibrio-control-plans/{id} and GET /shellfish/vibrio-control-plans (with FarmOperator)"
      - "POST /shellfish/_clock/set_current_utc (all roles)"

  - name: SitingReviewer
    description: "Siting reviewer who records the navigation and environmental clearance legs of a lease application. A single reviewer id may record only one of the two legs on a given lease."
    identity: opaque
    exclusive_operations:
      - "POST /shellfish/leases/{id}/navigation-review"
      - "POST /shellfish/leases/{id}/environmental-review"
    shared_operations:
      - "GET /shellfish/growing-areas/{id} and GET /shellfish/growing-areas (all roles)"
      - "GET /shellfish/leases/{id} and GET /shellfish/leases (with ShellfishControlAuthority, FarmOperator)"
      - "POST /shellfish/_clock/set_current_utc (all roles)"

  - name: FarmOperator
    description: "Shellfish farm operator. Applies for leases, runs nursery and grow-out, records husbandry, registers vessels, issues harvest authorizations, lands and tags lots. Identified by an opaque operator id stored on the lease as operator_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /shellfish/leases"
      - "POST /shellfish/leases/{id}/submit"
      - "POST /shellfish/seed-lots/{id}/nursery-start"
      - "POST /shellfish/seed-lots/{id}/nursery-complete"
      - "POST /shellfish/growout-units"
      - "POST /shellfish/growout-units/{id}/husbandry-logs"
      - "POST /shellfish/growout-units/{id}/retrieve"
      - "POST /shellfish/growout-units/{id}/void"
      - "POST /shellfish/harvest-vessels"
      - "POST /shellfish/harvest-authorizations"
      - "POST /shellfish/harvest-authorizations/{id}/activate"
      - "POST /shellfish/harvest-authorizations/{id}/close"
      - "POST /shellfish/harvest-authorizations/{id}/harvest-lots"
      - "POST /shellfish/harvest-lots/{id}/tag"
      - "POST /shellfish/harvest-lots/{id}/void"
    shared_operations:
      - "GET /shellfish/growing-areas/{id} and GET /shellfish/growing-areas (all roles)"
      - "GET /shellfish/growing-areas/{id}/classification-summary, .../water-samples, .../rainfall-events (with ShellfishControlAuthority)"
      - "GET /shellfish/leases/{id} and GET /shellfish/leases (with ShellfishControlAuthority, SitingReviewer)"
      - "GET /shellfish/hatcheries/{id} (with ShellfishControlAuthority, HatcheryOperator)"
      - "GET /shellfish/seed-lots/{id} and GET /shellfish/seed-lots (with ShellfishControlAuthority, HatcheryOperator)"
      - "GET /shellfish/growout-units/{id}, GET /shellfish/growout-units, GET /shellfish/growout-units/{id}/husbandry-logs (with ShellfishControlAuthority)"
      - "GET /shellfish/harvest-vessels/{id} (with ShellfishControlAuthority)"
      - "GET /shellfish/harvest-authorizations/{id}, GET /shellfish/harvest-authorizations, GET /shellfish/harvest-authorizations/{id}/harvest-lots (with ShellfishControlAuthority)"
      - "GET /shellfish/harvest-lots/{id} and GET /shellfish/harvest-lots (with ShellfishControlAuthority, SeafoodDealer)"
      - "GET /shellfish/dealers/{id} (with ShellfishControlAuthority, SeafoodDealer)"
      - "GET /shellfish/vibrio-control-plans/{id} and GET /shellfish/vibrio-control-plans (with ShellfishControlAuthority)"
      - "POST /shellfish/_clock/set_current_utc (all roles)"

  - name: HatcheryOperator
    description: "Hatchery operator who records seed shipments. X-User-ID is the id of the Hatchery the operator acts as, so a shipment may only be recorded against that hatchery."
    identity: "entity_backed:Hatchery"
    exclusive_operations:
      - "POST /shellfish/seed-lots"
    shared_operations:
      - "GET /shellfish/growing-areas/{id} and GET /shellfish/growing-areas (all roles)"
      - "GET /shellfish/hatcheries/{id} (with ShellfishControlAuthority, FarmOperator)"
      - "GET /shellfish/seed-lots/{id} and GET /shellfish/seed-lots (with ShellfishControlAuthority, FarmOperator)"
      - "POST /shellfish/_clock/set_current_utc (all roles)"

  - name: SeafoodDealer
    description: "Certified seafood dealer. X-User-ID is the id of the Dealer the user acts as, so shipments may only be assembled and released for that dealer."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /shellfish/shipments"
      - "POST /shellfish/shipments/{id}/ship"
    shared_operations:
      - "GET /shellfish/growing-areas/{id} and GET /shellfish/growing-areas (all roles)"
      - "GET /shellfish/harvest-lots/{id} and GET /shellfish/harvest-lots (with ShellfishControlAuthority, FarmOperator)"
      - "GET /shellfish/dealers/{id} (with ShellfishControlAuthority, FarmOperator)"
      - "GET /shellfish/shipments/{id} and GET /shellfish/shipments (with ShellfishControlAuthority)"
      - "POST /shellfish/_clock/set_current_utc (all roles)"
