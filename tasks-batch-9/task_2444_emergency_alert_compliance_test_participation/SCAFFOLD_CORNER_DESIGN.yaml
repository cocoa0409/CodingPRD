        excluded_because:
          difficulty_instance: receipt_coverage_priority_9_beats_segregation_of_duties_priority_11
          rationale: "The named §1.8 instance already violates both rules on one POST /filing-records and asserts the priority-9 error, then fixes coverage and asserts the priority-11 error on the retry."

      - name: filing_deadline_check_precedes_the_penalty_ceiling
        claim_type: priority_conflict
        grounds:
          - "§1.4 priority 10 -> ERR_FILING_DEADLINE_PASSED (422); priority 12 -> ERR_PENALTY_CEILING_EXCEEDED (422)"
        excluded_because:
          difficulty_instance: filing_deadline_priority_10_beats_penalty_ceiling_priority_12
          rationale: "The named §1.8 instance files past filing_deadline_at + 10 days with a penalty that would also breach the 5.00 ceiling and asserts the priority-10 error."

  # ===========================================================================
  # SECTION 5 — Endpoints (claim-extraction-guide "From Table 5")
  # ===========================================================================
  - section: endpoints
    instances:

      - name: compliance_summary_computed_read_exposes_every_score_input
        claim_type: computed_read
        grounds:
          - "§1.5 GET /stations/{id}/compliance-summary description 'Computed read that exposes every input the station_compliance_score formula consumed for the current compliance_score', side_effects []"
          - "§1.5 that endpoint's inline output schema of 14 fields (station_id, compliance_posture, compliance_score, compliance_variant_applied, required_source_count, accessible_source_count, missing_source_count, silent_assignment_count, outage_breach_count, unfiled_test_count, penalty_points_total, plan_revalidation_required, public_file_document_count, last_log_review_at)"
          - "§1.3 calculations.station_compliance_score deductions d1 25.00 per missing source and d2 10.00 per SILENT row"
        distinguishing_aspect: "Every field of the summary is reconcilable with the stored score in one read: 30.00 == 100.00 - 2*25.00 - 2*10.00, and the read is pure — calling it twice does not change last_log_review_at or the posture."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP', 'SATELLITE'] (required_source_count 2) activated; station KWEA; dev1 READY."
            - "ma_pep PEP/WXPEP and ma_lp1 LP1/WXLP1 created 2026-08-01, never refreshed. Two public-file documents uploaded."
            - "Clock 2026-08-10T00:00:00Z; run-log-review: both assignments' coalesce(last_receipt_at, created_at) == 2026-08-01T00:00:00Z < 2026-08-02T00:00:00Z, so both go SILENT -> accessible 0, missing 2, silent 2 -> 100.00 - 50.00 - 20.00 = 30.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "SATELLITE"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma_pep: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "LP1", source_call_sign: "WXLP1", expected_station_version: "${sv2}" }
              captures: { ma_lp1: "$.data.id" }
            - call: "POST /stations/${station_id}/public-file-documents"
              as: StationEngineer
              as_user_id: eng-1
              payload: { document_kind: "STATION_LOG", reference_label: "2026-Q3 station log" }
            - call: "POST /stations/${station_id}/public-file-documents"
              as: StationEngineer
              as_user_id: eng-1
              payload: { document_kind: "PLAN_COPY", reference_label: "KS 2026-R1 plan copy" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
            - call: "POST /stations/${station_id}/run-log-review"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
          trigger:
            - call: "GET /stations/${station_id}/compliance-summary"
              as: FieldInspector
              as_user_id: insp-1
            - call: "GET /stations/${station_id}/compliance-summary"
              as: CertifyingOfficer
              as_user_id: cert-1
            - call: "GET /stations/${station_id}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "the summary returns exactly the 14 declared fields: station_id == ${station_id}, compliance_posture == 'SUSPENDED_FILINGS', compliance_score == 30.00, compliance_variant_applied == 'PROVISIONAL'"
            - "required_source_count == 2, accessible_source_count == 0, missing_source_count == 2, silent_assignment_count == 2, outage_breach_count == 0, unfiled_test_count == 0"
            - "penalty_points_total == 0.00, plan_revalidation_required == false, public_file_document_count == 2, last_log_review_at == '2026-08-10T00:00:00Z'"
            - "30.00 == 100.00 - 2 * 25.00 - 2 * 10.00 reconciles the exposed inputs with the stored score"
            - "the second read (different role) is byte-identical to the first, and GET /stations/${station_id} reports the same compliance_score and compliance_posture — the computed read has no side effects"

      - name: public_file_document_action_increments_the_counter_without_recomputing
        claim_type: action_endpoint
        grounds:
          - "§1.5 POST /stations/{id}/public-file-documents roles [StationEngineer], code 201, input [document_kind, reference_label], output Station, side_effects ['public_file_document_count += 1']"
          - "§1.2 state_machines.Station.recompute_events — the eleven events that recompute the score; this endpoint is not one of them"
          - "§1.1 Station.compliance_posture initial PROVISIONING with compliance_score null at create"
        distinguishing_aspect: "The upload endpoint returns the Station with public_file_document_count raised by exactly one per call, yet compliance_score stays null and compliance_posture stays PROVISIONING — proving the counter write is not routed through the score recompute path."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated; station KWEA freshly created with no devices, assignments, tests or filings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            - call: "POST /stations/${station_id}/public-file-documents"
              as: StationEngineer
              as_user_id: eng-1
              payload: { document_kind: "STATION_LOG", reference_label: "log-1" }
            - call: "POST /stations/${station_id}/public-file-documents"
              as: StationEngineer
              as_user_id: eng-1
              payload: { document_kind: "STATION_LOG", reference_label: "log-2" }
            - call: "POST /stations/${station_id}/public-file-documents"
              as: StationEngineer
              as_user_id: eng-1
              payload: { document_kind: "TEST_LOGS", reference_label: "weekly-tests" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "each call returns 201 with the Station body; public_file_document_count reads 1, then 2, then 3 — the same document_kind twice is allowed, the counter has no uniqueness rule"
            - "compliance_score is null and compliance_posture == 'PROVISIONING' in every response — no recompute event fired"
            - "Station.version is not incremented by these calls (only POST /monitoring-assignments declares that side effect)"
            - "compliance-summary.public_file_document_count == 3 with compliance_score null and last_log_review_at null"

      - name: monitoring_assignment_is_the_cross_reference_link_between_station_and_device
        claim_type: cross_reference_link
        grounds:
          - "§1.5 POST /monitoring-assignments input [station_id, device_id, source_type, source_call_sign, expected_station_version] and side effects 'Station.accessible_source_count recomputed', 'Station recompute event'"
          - "§1.5 GET /monitoring-assignments description 'the station_id and device_id filters are the reverse-reachability channels for both FKs'"
          - "§1.6 ERR_DEVICE_NOT_FOUND (404) and ERR_STATION_NOT_FOUND (404) from §1.4 priority 4"
        distinguishing_aspect: "The link requires both endpoints of the association to exist and to belong together: a good station with a bad device id is 404 ERR_DEVICE_NOT_FOUND, and once created the row is reachable from either side's list filter with the association fields intact."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 requiring ['PEP'] activated; station KWEA; dev1 READY; sv1 captured fresh."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
          trigger:
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "00000000-0000-4000-8000-000000000000", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { err_device: "$.data.error_id" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "GET /monitoring-assignments"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}" }
            - call: "GET /monitoring-assignments"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { device_id: "${dev1}" }
            - call: "GET /monitoring-assignments/${ma1}"
              as: FieldInspector
              as_user_id: insp-1
          assert:
            - "${err_device} == 'ERR_DEVICE_NOT_FOUND' with HTTP 404 and Station.version is unchanged — a half-resolvable link is never created"
            - "the successful create returns 201 with station_id == ${station_id}, device_id == ${dev1}, source_type == 'PEP', source_call_sign == 'WXPEP', status == 'ACTIVE', superseded_assignment_id == null"
            - "GET /monitoring-assignments filtered by station_id returns total_count == 1 containing ${ma1}; the same holds for the device_id filter — both FK directions are reachable"
            - "GET /monitoring-assignments/${ma1} echoes the stored association for a read-only role"
            - "the create fired a Station recompute: accessible_source_count == 1 and compliance_score == 100.00 with posture COMPLIANT"

      - name: evaluate_readiness_is_a_conditional_action_bounded_by_the_preflight_window
        claim_type: conditional_action
        grounds:
          - "§1.6 ERR_READINESS_WINDOW_NOT_OPEN (422): 'evaluate-readiness before window_start_at - 24 hours or after window_end_at'"
          - "§1.3 calculations.test_event_readiness_score constant PREFLIGHT_HOURS 24 and READINESS_PASS_MIN 80.00"
          - "§1.5 POST /test-events/{id}/evaluate-readiness side effects ['readiness_score + readiness_evaluated_at written', 'status per state_machines.TestEvent']"
