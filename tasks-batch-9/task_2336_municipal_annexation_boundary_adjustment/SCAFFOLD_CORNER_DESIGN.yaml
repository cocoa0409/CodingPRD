            - call: "POST /annexation-cases/${case_r4}/parcels"
              payload: { primary_owner_id: "${ow_r4}", parcel_apn: "R4-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_r4}"
            - call: "POST /annexation-cases/${case_r4}/certify-territory"
