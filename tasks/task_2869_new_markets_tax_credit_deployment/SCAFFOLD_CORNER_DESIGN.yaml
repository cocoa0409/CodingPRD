            - "compliance_years_completed == 3 is assigned BEFORE the recapture arithmetic, so the year-3 cumulative rate of 1500bps applies"
            - "recapture_exposure_cents == 81750000 exactly: claimed = round(500000000 x 1500 / 10000) = 75000000; interest = round(75000000 x 300 x 3 / 10000) = 6750000. A single fused expression (500000000 x 1500 x (10000 + 900) / 100000000 = 81750000) coincidentally agrees here, but the two-step rounding is what the rule mandates"
