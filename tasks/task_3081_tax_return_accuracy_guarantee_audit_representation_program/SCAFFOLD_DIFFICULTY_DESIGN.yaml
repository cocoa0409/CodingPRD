              payload: { period_month: "2026-09", returns_examined: 10, returns_with_defects: 1 }
              as: OfficeManager
          trigger:
            - call: "POST /tax/offices/${off1}/quality-close"
              payload: { period_month: "2026-09", returns_examined: 10, returns_with_defects: 1 }
              as: OfficeManager
              captures: { err1: $.data.error_id }
            - call: "POST /tax/offices/${off1}/quality-close"
              payload: { period_month: "2026-08", returns_examined: 10, returns_with_defects: 1 }
              as: OfficeManager
              captures: { err2: $.data.error_id }
            - call: "POST /tax/offices/${off1}/quality-close"
              payload: { period_month: "2026-10", returns_examined: 10, returns_with_defects: 1 }
              as: OfficeManager
              captures: { snap: $.data.id }
          assert:
            - "err1 == ERR_CLOSE_PERIOD_REGRESSION (equal period rejected: strictly-greater semantics)"
            - "err2 == ERR_CLOSE_PERIOD_REGRESSION (earlier period rejected)"
            - "OfficeQualitySnapshot.${snap}.period_month == 2026-10 (next month accepted)"
            - "Office.${off1}.last_close_period == 2026-10"
