scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: Dual-variant calculations across different entity domains (≥2)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: slot_fee_provisional_vs_final_on_application
        grounds:
          - calculations.calc_slot_fee
          - entities.ScheduleApplication.fields.provisional_fee_cents
          - entities.ScheduleApplication.fields.final_fee_cents
          - entities.ScheduleApplication.fields.pinned_streamer_tier
          - state_machines.ScheduleApplication.review_status.DRAFT_to_OPS_PENDING
          - state_machines.ScheduleApplication.review_status.COMPLIANCE_PENDING_to_APPROVED
        distinguishing_aspect: |
          Operates on the cost-accounting domain of ScheduleApplication: provisional is
          computed at submit using Streamer.tier as-of-submit, final is recomputed at
          compliance approval using the pinned_streamer_tier snapshot — for identical
          base inputs, the two cents values diverge whenever the streamer's tier escalated
          between submit and approve.
        test_recipe:
          setup:
            - "Create Streamer S with tier=BRONZE (lifetime_gmv_cents=0, violation_score=0)"
            - "Create Studio with slot_tier=A, base_hour_price_cents=10000"
            - "Create AVAILABLE TimeSlotConfig covering 2026-06-01T18:00Z..2026-06-02T00:00Z"
            - "Advance clock to 2026-05-15T09:00Z"
          trigger:
            - "POST /live-schedule/applications {streamer_id:S, studio_id, starts_at:2026-06-01T20:00Z, ends_at:2026-06-01T22:00Z, declared_product_categories:[FOOD], package_code:STANDARD}"
            - "POST /live-schedule/applications/{id}/submit"
            - "Inject high-GMV history to escalate Streamer.tier to SILVER (e.g., run a completed application and payout that pushes lifetime_gmv >= 1_000_000)"
            - "POST /live-schedule/applications/{id}/ops-approve {decision:APPROVE}"
            - "POST /live-schedule/applications/{id}/compliance-approve {decision:APPROVE}"
          assert:
            - "ScheduleApplication.provisional_fee_cents == 30000"
            - "ScheduleApplication.pinned_streamer_tier == SILVER"
            - "ScheduleApplication.final_fee_cents == 28500"
            - "SlotFeeInvoice.total_cents == 28500"
            - "SlotFeeInvoice.deposit_due_cents == 8550"

      - name: commission_provisional_vs_final_on_settlement
        grounds:
          - calculations.calc_commission
          - entities.CommissionSettlement.fields.provisional_payout_cents
          - entities.CommissionSettlement.fields.final_payout_cents
          - entities.CommissionSettlement.fields.gross_sales_cents
          - entities.CommissionSettlement.fields.returned_sales_cents
          - state_machines.CommissionSettlement.status.PENDING_to_WINDOW_OPEN
          - state_machines.CommissionSettlement.status.WINDOW_OPEN_to_READY_FOR_PAYOUT
        distinguishing_aspect: |
          Operates on the revenue-settlement domain of CommissionSettlement — a different
          entity domain from calc_slot_fee. Provisional uses gross sales only (no returns,
          no tax); final subtracts return-reversed commission, recomputes the tier bonus
          on effective sales, and applies withholding tax — yielding divergent integer
          cents for the same Settlement when returns > 0.
        test_recipe:
          setup:
            - "Run an application owned by a GOLD streamer to operational_status=LIVE"
            - "POST /live-schedule/_events/emit {source:ECOMMERCE, kind:BROADCAST_GMV, application_id, amount_cents:6000000, occurred_at:within-broadcast}"
            - "POST /live-schedule/applications/{id}/end-live"
          trigger:
            - "GET /live-schedule/applications/{id}/settlement (read provisional_payout_cents)"
            - "POST /live-schedule/_events/emit {source:ECOMMERCE, kind:RETURN_REPORTED, application_id, amount_cents:1000000, occurred_at:within-window}"
            - "POST /live-schedule/_clock/advance to return_window_ends_at + 1 minute"
            - "POST /live-schedule/_sweep/run"
            - "GET /live-schedule/applications/{id}/settlement (read final_payout_cents)"
          assert:
            - "CommissionSettlement.provisional_payout_cents == 1110000"
            - "CommissionSettlement.final_payout_cents == 832500"
            - "CommissionSettlement.status == READY_FOR_PAYOUT"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes (≥2)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: slot_fee_pinned_rounding_order_mode_b
        grounds:
          - calculations.calc_slot_fee
          - calculations.calc_slot_fee.precision
          - entities.SlotFeeInvoice.fields.total_cents
          - entities.SlotFeeInvoice.fields.deposit_due_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. calc_slot_fee pins ONE rounding
          at the end on (subtotal_unrounded * (1 - tier_pct/100) * (1 - package_pct/100));
          alternative orders (round per-step, or round before package discount) yield
          different cents. Deposit is then computed as round_half_up(total*0.30) with a
          second rounding — the order (compute total first, then round deposit) is pinned.
        test_recipe:
          setup:
            - "Create Streamer at SILVER tier (5% discount)"
            - "Create Studio base_hour_price_cents=10000, slot_tier=A"
            - "AVAILABLE window covers 2026-06-01T20:00Z..22:00Z"
          trigger:
            - "POST /live-schedule/applications {..., starts_at:2026-06-01T20:00Z, ends_at:2026-06-01T22:00Z, package_code:COMBO_HALF_DAY}"
            - "POST /live-schedule/applications/{id}/submit"
            - "POST /live-schedule/applications/{id}/ops-approve {decision:APPROVE}"
            - "POST /live-schedule/applications/{id}/compliance-approve {decision:APPROVE}"
          assert:
            - "SlotFeeInvoice.total_cents == 26220   # = round_half_up(30000 * 0.95 * 0.92) == round_half_up(26220.0)"
            - "SlotFeeInvoice.deposit_due_cents == 7866   # = round_half_up(26220 * 0.30)"

      - name: commission_circular_dependency_mode_c
        grounds:
          - calculations.calc_commission
          - calculations.calc_commission.formula
          - entities.CommissionSettlement.fields.tier_bonus_cents
          - entities.CommissionSettlement.fields.tax_withholding_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order. The tier
          bonus uses an effective-sales threshold (gross - returns >= 5_000_000) so it
          depends on returns; tax depends on (gross_commission - reversed_commission +
          adjusted_bonus). The scaffold pins evaluation order: compute reversed_commission
          first, then effective_sales for bonus eligibility, then sum pre_tax, then tax.
          A different order (e.g., apply tax before bonus) yields different cents.
        test_recipe:
          setup:
            - "GOLD streamer; settlement initialized with gross_sales_cents=5000000"
          trigger:
            - "POST /live-schedule/_events/emit {kind:RETURN_REPORTED, amount_cents:1, occurred_at:within-window}"
            - "POST /live-schedule/_clock/advance past return_window_ends_at"
            - "POST /live-schedule/_sweep/run"
          assert:
            - "CommissionSettlement.provisional_payout_cents == 925000"
            - "CommissionSettlement.final_payout_cents == 810000   # bonus drops to 0 because effective 4_999_999 < 5_000_000"

  # =========================================================================
  # Rule 3: Non-linear state-machine shape on different entities (≥2)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: schedule_application_review_branching
        grounds:
          - state_machines.ScheduleApplication.review_status
          - state_machines.ScheduleApplication.review_status.OPS_PENDING_to_REJECTED
          - state_machines.ScheduleApplication.review_status.OPS_PENDING_to_COMPLIANCE_PENDING
          - state_machines.ScheduleApplication.review_status.OPS_PENDING_to_WITHDRAWN
        distinguishing_aspect: |
          ScheduleApplication.review_status is a branching fork-join: from OPS_PENDING
          it can fan out to {COMPLIANCE_PENDING, REJECTED, WITHDRAWN} each with divergent
          side-effect sets (only REJECT/WITHDRAW release product stock and zero the fee).
          Plus parallel-dimension shape: review_status and operational_status evolve
          independently on the same row.
        test_recipe:
          setup:
            - "Create approved-on-ops-pending application with two ProductAssociations reserving stock"
          trigger:
            - "POST /live-schedule/applications/{id}/ops-approve {decision:REJECT, reason:'unfit'}"
          assert:
            - "ScheduleApplication.review_status == REJECTED"
            - "ProductAssociation[*].status == RELEASED for all associations"
            - "Product.reserved_stock decreased by sum of reserved_quantities"
            - "ScheduleApplication.provisional_fee_cents == 0"
            - "No SlotFeeInvoice exists for this application"

      - name: violation_cyclic_with_revert
        grounds:
          - state_machines.Violation.status
          - state_machines.Violation.status.OPEN_to_APPEAL_PENDING
          - state_machines.Violation.status.APPEAL_PENDING_to_OVERTURNED
          - state_machines.Violation.status.APPEAL_PENDING_to_UPHELD
          - state_machines.Violation.status.UPHELD_to_ENFORCED
        distinguishing_aspect: |
          Violation belongs to a different entity than ScheduleApplication. Its lifecycle
          forks at APPEAL_PENDING into {OVERTURNED, UPHELD}, then converges into ENFORCED
          (or terminates at OVERTURNED). The OVERTURNED branch reverts streamer status
          and violation_score — a compensation arc that linear pipelines cannot model.
        test_recipe:
          setup:
            - "Create Streamer S; emit DATA_FRAUD violation with 3 evidences -> Streamer pre-blacklist"
            - "POST /live-schedule/violations/{id}/appeal"
          trigger:
            - "POST /live-schedule/appeals/{id}/decide {decision:OVERTURN}"
          assert:
            - "Violation.status == OVERTURNED"
            - "Streamer.status == ACTIVE   # reverted from BLACKLISTED"
            - "Streamer.violation_score decreased by Violation.severity (5)"

  # =========================================================================
  # Rule 4: Transitive cascade chains from different triggers (≥2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: end_live_triple_cascade
        grounds:
          - state_machines.ScheduleApplication.operational_status.LIVE_to_COMPLETED
          - calculations.calc_performance_tier
          - state_machines.CommissionSettlement.status.PENDING_to_WINDOW_OPEN
          - entities.Streamer.fields.tier
          - entities.Streamer.fields.suspension_until
        distinguishing_aspect: |
          Depth ≥ 3 cascade originating from end-live: (1) Application LIVE→COMPLETED
          triggers Settlement transition to WINDOW_OPEN; (2) that completion increments
          Streamer.completed_broadcast_count and (3) recomputes Streamer.tier; (4) the
          tier change may reconcile suspension_until. Each step is CAUSED BY the prior
          mutation, not by the original end-live call directly.
        test_recipe:
          setup:
            - "Streamer just above SILVER GMV threshold (lifetime_gmv_cents=999000)"
            - "Active application in LIVE state with GMV event yielding effective_sales+lifetime_gmv >= 1_000_000 after payout"
          trigger:
            - "POST /live-schedule/applications/{id}/end-live"
            - "POST /live-schedule/_clock/advance past return_window_ends_at"
            - "POST /live-schedule/_sweep/run"
            - "POST /live-schedule/settlements/{id}/payout"
          assert:
            - "ScheduleApplication.operational_status == COMPLETED"
            - "CommissionSettlement was created with status==READY_FOR_PAYOUT then PAID"
            - "Streamer.lifetime_gmv_cents updated upward"
            - "Streamer.tier == SILVER  # auto-recomputed from BRONZE after payout"

      - name: violation_enforcement_triple_cascade
        grounds:
          - state_machines.Violation.status.OPEN_to_ENFORCED
          - entities.Streamer.fields.status
          - state_machines.ScheduleApplication.operational_status.SCHEDULED_to_CANCELLED
          - state_machines.SlotFeeInvoice.status.DEPOSIT_PAID_to_REFUNDED_PARTIAL
        distinguishing_aspect: |
          Triggered from a different action than the first cascade — sweep-driven
          violation enforcement. Depth ≥ 3: (1) Violation transitions OPEN→ENFORCED via
          /_sweep/run; (2) Streamer.status flips to SUSPENDED/BLACKLISTED; (3) auto-cancel
          future SCHEDULED applications cascades; (4) each cancelled application's
          invoice transitions to REFUNDED_FULL/REFUNDED_PARTIAL. Each link is caused by
          the preceding state change, not by the sweep call directly.
        test_recipe:
          setup:
            - "Streamer with one SCHEDULED application, deposit paid, starts_at far in the future"
            - "Create Violation type=DATA_FRAUD with 3 evidence_refs (severity=5)"
            - "No appeal filed"
          trigger:
            - "POST /live-schedule/_clock/advance to violation.created_at + 7 days + 1 minute"
            - "POST /live-schedule/_sweep/run"
          assert:
            - "Violation.status == ENFORCED"
            - "Streamer.status == BLACKLISTED"
            - "ScheduleApplication.operational_status == CANCELLED  # auto-cancelled"
            - "SlotFeeInvoice.status in {REFUNDED_FULL, REFUNDED_PARTIAL}"

  # =========================================================================
  # Rule 5: Validation priority conflicts (different error-category pairs, ≥2)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_submit
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          State (ERR_INVALID_STATE, priority 6) vs business_temporal
          (ERR_OUT_OF_AVAILABLE_WINDOW / ERR_STUDIO_INTERVAL_CONFLICT, priority 12/13).
          Submitting an already-OPS_PENDING application that ALSO falls outside the
          AVAILABLE window MUST return ERR_INVALID_STATE, not the temporal error.
          This is a state-vs-business_temporal pair.
        test_recipe:
          setup:
            - "Create draft application and submit once -> review_status=OPS_PENDING"
            - "Clock at 2026-05-15T09:00Z"
          trigger:
            - "POST /live-schedule/applications/{id}/submit  (second submit, while interval falls outside any AVAILABLE TimeSlotConfig)"
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE   # NOT ERR_OUT_OF_AVAILABLE_WINDOW"

      - name: business_safety_vs_business_fiscal_on_product_association
        grounds:
          - validations[priority=9]
          - validations[priority=15]
        distinguishing_aspect: |
          business_safety (ERR_PRODUCT_CERT_MISSING, priority 9) vs business_fiscal
          (ERR_STOCK_INSUFFICIENT, priority 15). A streamer associating a product that
          (a) requires a cert they lack AND (b) requests more stock than available MUST
          receive ERR_PRODUCT_CERT_MISSING, not the stock error — a different
          error-category pair than instance 1.
        test_recipe:
          setup:
            - "Streamer with professional_cert_categories=[FOOD]"
            - "Product category=COSMETICS, requires_professional_cert=true, available_stock=2"
            - "Application declared_product_categories=[COSMETICS]"
          trigger:
            - "POST /live-schedule/applications/{id}/products {product_id, reserved_quantity:100}"
          assert:
            - "HTTP 422"
            - "error_id == ERR_PRODUCT_CERT_MISSING   # NOT ERR_STOCK_INSUFFICIENT"

  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints (≥2)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refund_lead_time_72h_boundary
        grounds:
          - calculations.calc_refund
          - state_machines.ScheduleApplication.operational_status.SCHEDULED_to_CANCELLED
          - state_machines.SlotFeeInvoice.status.DEPOSIT_PAID_to_REFUNDED_PARTIAL
        distinguishing_aspect: |
          Numeric-threshold boundary on lead_hours metric, reachable via the cancel
          endpoint: lead_hours == 72.0 hits the >= 72 branch -> full deposit refund;
          lead_hours == 71.999... must hit the partial branch (50%).
        test_recipe:
          setup:
            - "Approved app with deposit paid, starts_at=2026-06-04T20:00Z, deposit_due_cents=8550"
            - "Clock at 2026-06-01T20:00Z   # exactly 72 hours before start"
          trigger:
            - "POST /live-schedule/applications/{id}/cancel {reason:'change'}"
          assert:
            - "SlotFeeInvoice.refund_cents == 8550   # full deposit because lead_hours >= 72"
            - "SlotFeeInvoice.status == REFUNDED_FULL"

      - name: empty_product_association_on_ops_approve
        grounds:
          - validations[priority=6]
          - state_machines.ScheduleApplication.review_status.OPS_PENDING_to_COMPLIANCE_PENDING
          - entities.ProductAssociation
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (count of ProductAssociations)
          reachable through a different endpoint (/ops-approve, not /cancel). An
          application with zero APPROVED associations cannot pass ops-approve — the
          precondition "All ProductAssociation rows have status APPROVED" is vacuously
          true on the empty set, so the scaffold MUST pin: at least 1 APPROVED
          association required. Approving an application with zero associations returns
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Application in OPS_PENDING with no product associations attached"
          trigger:
            - "POST /live-schedule/applications/{id}/ops-approve {decision:APPROVE}"
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE   # empty set is treated as invalid for approval"
            - "ScheduleApplication.review_status == OPS_PENDING   # unchanged"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs (≥2)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_submit_requires_studio_open_pair_application_studio
        grounds:
          - state_machines.ScheduleApplication.review_status.DRAFT_to_OPS_PENDING
          - entities.Studio.fields.status
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair: ScheduleApplication × Studio. Submit transition is gated on
          Studio.status == OPEN. When the studio is UNDER_MAINTENANCE, submit fails
          even if everything else is valid.
        test_recipe:
          setup:
            - "Streamer S, qualified"
            - "Studio with status=UNDER_MAINTENANCE (set via PATCH)"
            - "Draft application referencing that studio"
          trigger:
            - "POST /live-schedule/applications/{id}/submit"
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"
            - "ScheduleApplication.review_status == DRAFT   # unchanged"

      - name: start_live_requires_invoice_deposit_paid_pair_application_invoice
        grounds:
          - state_machines.ScheduleApplication.operational_status.SCHEDULED_to_LIVE
          - entities.SlotFeeInvoice.fields.status
          - validations[priority=18]
        distinguishing_aspect: |
          Different entity pair: ScheduleApplication × SlotFeeInvoice. /start-live
          succeeds only when the linked invoice's status is in {DEPOSIT_PAID, SETTLED}
          (i.e., application.deposit_paid == true). The same application cannot start
          while its sibling invoice is still ISSUED.
        test_recipe:
          setup:
            - "Application in SCHEDULED state; invoice issued but no DEPOSIT_PAID event emitted"
            - "Clock at application.starts_at"
          trigger:
            - "POST /live-schedule/applications/{id}/start-live"
          assert:
            - "HTTP 422"
            - "error_id == ERR_DEPOSIT_UNPAID"
            - "ScheduleApplication.operational_status == SCHEDULED   # unchanged"

  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts (different interval semantics, ≥2)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: studio_half_open_overlap_between_applications
        grounds:
          - validations[priority=13]
          - state_machines.ScheduleApplication.review_status.DRAFT_to_OPS_PENDING
          - state_machines.ScheduleApplication.review_status.COMPLIANCE_PENDING_to_APPROVED
          - concurrency_rules[Two streamers submit overlapping applications]
        distinguishing_aspect: |
          Resource: Studio. Interval semantics: half-open [starts_at, ends_at) on
          two competing applications — two applications whose intervals touch but do not
          overlap (one ends exactly when the next starts) MUST both succeed; one second
          of overlap MUST fail. No buffers, no aggregate capacity (capacity dimension
          doesn't apply here — concurrent applications on the same studio are forbidden
          outright).
        test_recipe:
          setup:
            - "Studio with AVAILABLE window covering 2026-06-01T18:00Z..00:00Z next day"
            - "App A by Streamer S1 already APPROVED for 2026-06-01T20:00Z..22:00Z"
          trigger:
            - "POST /live-schedule/applications by S2 for 2026-06-01T22:00Z..23:00Z, then submit -> should SUCCEED (touch-not-overlap)"
            - "POST /live-schedule/applications by S2 for 2026-06-01T21:59:59Z..23:00Z, then submit -> should FAIL"
          assert:
            - "First submit returns 200 with review_status==OPS_PENDING"
            - "Second submit returns HTTP 409 with error_id == ERR_STUDIO_INTERVAL_CONFLICT"

      - name: studio_maintenance_window_blocks_overlap
        grounds:
          - validations[priority=12]
          - entities.TimeSlotConfig.fields.kind
          - state_machines.ScheduleApplication.review_status.DRAFT_to_OPS_PENDING
        distinguishing_aspect: |
          Different interval semantics on a different resource configuration: the
          application interval must be FULLY CONTAINED in AVAILABLE TimeSlotConfig
          unions AND DISJOINT from any MAINTENANCE window. Where rule-8 instance 1
          rejects on overlap-between-applications, this one rejects on partial-coverage:
          any single minute of the requested interval that is uncovered by AVAILABLE or
          intersects MAINTENANCE rejects the whole request. The geometric treatment
          (containment + disjointness vs overlap-or-touch) is materially different.
        test_recipe:
          setup:
            - "Studio AVAILABLE 2026-06-01T18:00Z..22:00Z"
            - "MAINTENANCE 2026-06-01T20:30Z..21:00Z"
          trigger:
            - "POST /live-schedule/applications for 2026-06-01T20:00Z..22:00Z, then submit"
          assert:
            - "HTTP 409"
            - "error_id == ERR_OUT_OF_AVAILABLE_WINDOW   # intersects MAINTENANCE despite being inside AVAILABLE"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities (≥2)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: product_stock_conserved_on_release
        grounds:
          - entities.Product.fields.available_stock
          - entities.Product.fields.reserved_stock
          - state_machines.ScheduleApplication.review_status.OPS_PENDING_to_REJECTED
          - state_machines.ScheduleApplication.review_status.DRAFT_to_WITHDRAWN
          - endpoints[POST /live-schedule/applications/{id}/products]
        distinguishing_aspect: |
          Conserved quantity: Product.available_stock + Product.reserved_stock. Forward
          action (create ProductAssociation with reserved_quantity Q) MUST decrement
          available_stock by Q and increment reserved_stock by Q. Compensating action
          (reject/withdraw/cancel that releases the association) MUST do the inverse.
          Invariant pinned: for any Product, (available_stock + reserved_stock) is
          unchanged across any create + release pair.
        test_recipe:
          setup:
            - "Product P with available_stock=100, reserved_stock=0"
            - "Application A in DRAFT"
          trigger:
            - "POST /live-schedule/applications/{A.id}/products {product_id:P, reserved_quantity:25}"
            - "POST /live-schedule/applications/{A.id}/withdraw"
          assert:
            - "After create: Product.available_stock == 75, Product.reserved_stock == 25"
            - "After withdraw: Product.available_stock == 100, Product.reserved_stock == 0"
            - "Invariant Product.available_stock + Product.reserved_stock == 100 at every step"

      - name: streamer_violation_score_conserved_on_appeal_overturn
        grounds:
          - entities.Streamer.fields.violation_score
          - entities.Violation.fields.severity
          - state_machines.Violation.status.OPEN_to_APPEAL_PENDING
          - state_machines.Violation.status.APPEAL_PENDING_to_OVERTURNED
          - endpoints[POST /live-schedule/violations]
          - endpoints[POST /live-schedule/appeals/{id}/decide]
        distinguishing_aspect: |
          Different conserved quantity: Streamer.violation_score (an accumulating
          reputation metric, not inventory). Forward action (violation enforced via
          sweep) increments score by severity; compensating action (appeal OVERTURNED)
          must decrement by exactly the same severity. Invariant: across an enforce +
          overturn pair, Streamer.violation_score returns to its pre-violation value.
        test_recipe:
          setup:
            - "Streamer S with violation_score=10"
            - "POST /live-schedule/violations {type:FALSE_ADVERTISING, evidence_refs:[a,b,c]}  -> severity=3"
            - "Advance clock past appeal window cutoff, run /_sweep/run -> violation enforced, score = 13"
          trigger:
            - "POST /live-schedule/violations/{id}/appeal (only legal before sweep, so do appeal BEFORE clock advance in alt run)"
            - "POST /live-schedule/appeals/{id}/decide {decision:OVERTURN}"
          assert:
            - "Before appeal: Streamer.violation_score == 13"
            - "After OVERTURN: Streamer.violation_score == 10   # restored to pre-violation"
            - "Invariant: enforce + overturn leaves violation_score unchanged"
