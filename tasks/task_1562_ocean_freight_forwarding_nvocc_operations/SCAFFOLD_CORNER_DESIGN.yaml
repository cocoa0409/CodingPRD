            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b1: $.data.id } }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 6.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /freight/bookings/${b1}/confirm", payload: {}, as: BookingCoordinator, captures: { st1: $.data.status } }
            - { call: "POST /freight/bookings/${b2}/confirm", payload: {}, as: BookingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "first confirm succeeds at exact equality: Booking.${b1}.status == CONFIRMED (0 + 77400 <= 77400)"
            - "second confirm rejected: error_id == ERR_CREDIT_LIMIT_EXCEEDED (77400 + 77400 = 154800 > 77400)"

