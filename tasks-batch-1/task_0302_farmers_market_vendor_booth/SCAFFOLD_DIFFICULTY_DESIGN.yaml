  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: season_overlap_whole_window_waitlists  # interval semantics: whole season window occupation
        grounds:
          - state_machines.BoothAssignment.REQUESTED_to_WAITLISTED
          - entities.Booth.fields.status
          - validations[priority=10]
        distinguishing_aspect: |
          Season interval semantics: a SEASON occupation holds the booth across the ENTIRE season window,
          so any second SEASON request on the same booth collides regardless of date and is auto-WAITLISTED
          (or ERR_BOOTH_OCCUPIED with allow_waitlist=false). Whole-window aggregate occupation on Booth.
        test_recipe:
          setup:
            - "Standard market; CORNER booth; V1 holds a RESERVED SEASON assignment (booth SEASON_HELD); V2 is ACTIVE/APPROVED."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
