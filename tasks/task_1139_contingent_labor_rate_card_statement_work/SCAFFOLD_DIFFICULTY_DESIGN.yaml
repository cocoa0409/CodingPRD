      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_consolidation
          - calculations.timesheet_billing
        distinguishing_aspect: |
          Mode (b) combinatorial — nested rounding where order matters: each
          timesheet final is round_half_up'ed per line at approval
          (22502.5 -> 22503 and 40504.5 -> 40505) and the invoice subtotal is
          the integer sum 63008; the forbidden sum-then-round order yields
          63007. Distinct mode from tier_score (mode a) and processing fee
          (mode c).
        test_recipe:
          setup:
            - "Rate card ACTIVE: ceiling 12000, floor 5000, markup 0.25; supplier S1 APPROVED (tier cap 0.20)"
            - "REQUISITION engagement ACTIVE (budget 1000000), worker W1 with ACTIVE assignment bill 9001 pay 8000 [2026-05-01, 2026-08-31]"
            - "Two APPROVED timesheets: T1 2.5 hours [2026-05-04..2026-05-10], T2 4.5 hours [2026-05-11..2026-05-17]; both lines auto-attached to S1's OPEN invoice"
          setup_api_calls:
