      - name: three_consecutive_failed_runs_trip_remediation_and_resuming_resets_the_counter
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.conformance_pass_rate.constants.CONSECUTIVE_FAILURE_LIMIT
          - state_machines.Participant.CONFORMANCE_TESTING_to_REMEDIATION
          - state_machines.Participant.REMEDIATION_to_CONFORMANCE_TESTING
          - entities.Participant.fields.consecutive_failed_attempts
          - entities.Participant.fields.remediation_count
        distinguishing_aspect: |
          The cumulative trigger is a counter with a boundary, not a per-result reaction: the first and
          second FAILED results leave onboarding_status at CONFORMANCE_TESTING with remediation_count 0,
          and only the third - the one that makes consecutive_failed_attempts equal CONSECUTIVE_FAILURE_LIMIT
          exactly - fires the system transition into REMEDIATION. RESUME_CONFORMANCE then resets the counter
          to 0 while explicitly preserving conformance_attempt_count at 3, so the reset is a reset of the
          streak and not of the history.
        test_recipe:
          setup:
            - "One participant is at CONFORMANCE_TESTING with no results recorded (consecutive_failed_attempts 0, remediation_count 0)."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Elmshade Community Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 48000, primary_contact_email: "hie@elmshade.example" }
