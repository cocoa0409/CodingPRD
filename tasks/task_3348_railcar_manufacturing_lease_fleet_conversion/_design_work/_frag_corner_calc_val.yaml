              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 5, planned_shop_days: 150, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-12-01" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
              captures: { price_committed: $.data.unit_price_cents }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po_v: $.data.version }
          trigger:
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws210_id}", substitute_component_id: "${ws220_id}", substitute_qty_per_car: 3, decides_material: true, expected_production_order_version: "${po_v}" }
              as: ProductionPlanner
              as_user_id: "planner_1"
