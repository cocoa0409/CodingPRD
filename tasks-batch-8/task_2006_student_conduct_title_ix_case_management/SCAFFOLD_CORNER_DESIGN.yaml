            - { call: "POST /api/cross-exam-questions/${q1_id}/rule", payload: { ruling: "DISALLOWED" }, as: DecisionMaker, as_user_id: "${dm_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /api/cross-exam-questions/${q1_id}/rule", payload: { ruling: "DISALLOWED", ruling_reason: "not relevant" }, as: DecisionMaker, as_user_id: "${dm_id}", captures: { q1_ruling: $.data.ruling } }
            - { call: "POST /api/hearings/${hr_id}/close-cross-exam", as: DecisionMaker, as_user_id: "${dm_id}", captures: { err2: $.data.error_id } }
