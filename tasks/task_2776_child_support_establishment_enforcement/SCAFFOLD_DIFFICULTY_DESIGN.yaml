          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 150000, NCP income 330000, both VERIFIED_WAGE_RECORD; NCP LOCATED; PRESUMED_MARITAL paternity."
