            - { call: "PUT /millwork/shop-drawings/${drw_a}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_a}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_a}", order_id: "${ord_a}", estimated_minutes: 30 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-V8", supported_species: ["OAK"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-B8", species: "MAPLE", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_b: $.data.id } }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-V8" }, as: PlantManager, captures: { booth_id: $.data.id } }
