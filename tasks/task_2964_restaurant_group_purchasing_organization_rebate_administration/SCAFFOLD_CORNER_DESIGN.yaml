              captures: { cl2_id: $.data.id }
          assert:
            - "before the trigger: ManufacturerClaim.${cl1_id}.status == RECONCILED with accrued_amount_cents == 4500, variance_bps == 0 and a non-null reconciled_at"
            - "call 1: 409 with error_id == ERR_CLAIM_PERIOD_ALREADY_RECONCILED — a restatement of a settled period is refused, it does not supersede"
            - "call 1 left ${cl1_id} RECONCILED and left ManufacturerDeal.${deal_id}.version == ${deal_v2}: a rejected claim create bumps nothing"
            - "call 2: 201 with status == SUBMITTED — a different period is unaffected by the reconciled one"
            - "after call 2, ManufacturerDeal.${deal_id}.version == ${deal_v2} + 1, confirming a successful claim create bumps the deal by exactly 1"
            - "GET /manufacturer-claims with deal_id == ${deal_id} returns total_count == 2, and no row has status == SUPERSEDED"

      - name: enrollment_gate_outranks_the_case_quantity_gate
