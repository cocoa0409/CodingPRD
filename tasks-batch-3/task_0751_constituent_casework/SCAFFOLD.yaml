scenario: "Legislative-Office Constituent Casework: inquiry/casework intake & routing, agency referral & status, district/representative & constituent record, response SLA & template, recurring-issue & analytics, event/townhall, mailing/newsletter, privacy"
domain_name: constituent-casework
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (constituent_id, representative_id,
  # case_id, agency_id, venue_id, event_id). Only two nested sub-resource reads
  # exist (case referrals/events, event registrations, representative newsletters);
  # every other relationship is a flat FK with a filtered-list reverse GET.

  state_machine_shape: cyclic
  # Case is the flagship machine: it loops IN_PROGRESS <-> AWAITING_CONSTITUENT and
  # IN_PROGRESS <-> AWAITING_AGENCY (SLA clock pauses/resumes each hop). AgencyReferral
  # adds a branching SENT -> {RESOLVED | REJECTED} fork with divergent side effects.

  relationship_patterns:
    - one_to_many          # Representative -> Constituents/Cases/Events/Campaigns; Case -> Referrals
    - cross_aggregate      # Case transitions gated by Constituent state; Referral gated by Case+Agency

  role_model: hierarchical_override
  # OfficeAdmin is a superset of Caseworker for casework operations and additionally
  # owns configuration (representatives, agencies, templates, venues, events, campaigns,
  # purge). Constituent is an entity-backed peer that owns only its own records.
  # Anonymous exists solely for self-registration.

  consistency_model: immediate
  # Every cascade (purge, event-cancel, referral-recall, ledger counters) is applied
  # atomically inside the triggering request; the response reflects the final state.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Representative
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the elected official."
      - name: chamber
        type: enum
        source: input
        description: "Legislative chamber."
        constraints: "one of {HOUSE, SENATE}"
      - name: district_name
        type: string
        source: input
        description: "District the representative serves (e.g., 'CA-12')."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code."
      - name: office_email
        type: string
        source: input
        description: "Contact email of the legislative office."

  - name: Constituent
    parent: null
    common_fields: true
    fields:
      - name: representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the representative whose district this constituent belongs to."
      - name: full_name
        type: string
        source: input
        description: "Constituent full name; overwritten with 'REDACTED' on purge."
      - name: email
        type: string
        source: input
        description: "Contact email; overwritten with 'REDACTED' on purge."
      - name: address
        type: string
        source: input
        description: "Mailing address; overwritten with 'REDACTED' on purge."
      - name: phone
        type: string
        source: input
        description: "Optional phone; overwritten with 'REDACTED' on purge when present."
        default: null
      - name: contact_consent
        type: boolean
        source: input
        description: "Consent to receive newsletters/mailings; gates newsletter recipient inclusion."
        default: false
      - name: data_sharing_consent
        type: boolean
        source: input
        description: "Consent to share case data with external agencies; gates agency referral."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: ACTIVE
        constraints: "one of {ACTIVE, PURGED}"
      - name: upcoming_event_count
        type: integer
        source: computed
        description: "Ledger counter: number of EventRegistration rows for this constituent with status=REGISTERED. Incremented on register, decremented on cancel."
        default: 0

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "External agency name (e.g., 'State DMV')."
      - name: jurisdiction
        type: string
        source: input
        description: "Jurisdiction served by the agency."
      - name: status
        type: enum
        source: input
        description: "Whether the agency currently accepts referrals."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: open_referral_count
        type: integer
        source: computed
        description: "Ledger counter: number of AgencyReferral rows for this agency with status=SENT. Incremented on send, decremented on resolve/reject/recall/close-from-SENT."
        default: 0

  - name: ResponseTemplate
    parent: null
    common_fields: true
    fields:
      - name: category
        type: enum
        source: input
        description: "Case category this template applies to."
        constraints: "one of {IMMIGRATION, HEALTHCARE, HOUSING, TAX, BENEFITS, OTHER}"
      - name: body_template
        type: string
        source: input
        description: "Boilerplate response text used when a case is resolved with this template."
      - name: response_window_hours
        type: integer
        source: input
        description: "Base SLA window in hours used by the final-deadline calculation at triage."
        constraints: "> 0"
      - name: active
        type: boolean
        source: input
        description: "Only active templates may be selected at triage."
        default: true

  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: constituent_id
        type: string
        source: input
        description: "FK -> Constituent.id; the constituent who filed the inquiry."
      - name: representative_id
        type: string
        source: computed
        description: "FK -> Representative.id; copied from the constituent's representative_id at intake."
      - name: subject
        type: string
        source: input
        description: "Short subject line of the inquiry."
      - name: description
        type: string
        source: input
        description: "Free-text description of the casework request."
      - name: category
        type: enum
        source: input
        description: "Issue category."
        constraints: "one of {IMMIGRATION, HEALTHCARE, HOUSING, TAX, BENEFITS, OTHER}"
      - name: priority
        type: enum
        source: system
        description: "Priority; NORMAL at intake, set at triage."
        default: NORMAL
        constraints: "one of {LOW, NORMAL, HIGH, URGENT}"
      - name: status
        type: enum
        source: system
        description: "Casework lifecycle state."
        default: NEW
        constraints: "one of {NEW, IN_PROGRESS, AWAITING_CONSTITUENT, AWAITING_AGENCY, RESOLVED, CLOSED, WITHDRAWN}"
      - name: assigned_template_id
        type: string
        source: system
        description: "Id of the ResponseTemplate chosen at triage (not a persisted FK relationship; recorded for audit). Null before triage."
        default: null
      - name: assignee_staff_id
        type: string
        source: input
        description: "Opaque X-User-ID of the caseworker assigned at triage. Null before triage."
        default: null
      - name: response_window_hours
        type: integer
        source: computed
        description: "Base window copied from the assigned template at triage. Null before triage."
        default: null
      - name: effective_window_hours
        type: number
        source: computed
        description: "Output of case_response_deadline final variant: min(response_window_hours * PRIORITY_MULTIPLIER + CATEGORY_SURCHARGE_HOURS, MAX_WINDOW_HOURS). Null before triage."
        default: null
      - name: provisional_due_at
        type: datetime
        source: computed
        description: "case_response_deadline provisional variant: created_at + DEFAULT_WINDOW_HOURS[category]. Set at intake."
      - name: final_due_at
        type: datetime
        source: computed
        description: "case_response_deadline final variant: triaged_at + effective_window_hours. Null before triage."
        default: null
      - name: cumulative_paused_hours
        type: number
        source: computed
        description: "Running accumulator of hours the case has spent in AWAITING_CONSTITUENT/AWAITING_AGENCY, added each time the case resumes to IN_PROGRESS."
        default: 0
      - name: paused_since
        type: datetime
        source: system
        description: "Logical-clock timestamp of the current pause; set on entering an AWAITING state, cleared on resume. Null while IN_PROGRESS."
        default: null
      - name: gross_elapsed_hours
        type: number
        source: computed
        description: "case_net_response_time gross variant: (reference_end - triaged_at) in hours. Computed on read."
        default: 0
      - name: net_elapsed_hours
        type: number
        source: computed
        description: "case_net_response_time net variant: gross_elapsed_hours - cumulative_paused_hours - current_open_pause. Computed on read."
        default: 0
      - name: breached
        type: boolean
        source: computed
        description: "True when net_elapsed_hours > effective_window_hours (strict). Computed on read; false before triage."
        default: false
      - name: last_agency_outcome
        type: enum
        source: system
        description: "Outcome of the most recent referral that returned control to the case."
        default: null
        constraints: "one of {RESOLVED, REJECTED} or null"
      - name: reject_count
        type: integer
        source: system
        description: "Number of referrals on this case that were REJECTED."
        default: 0
      - name: triaged_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at triage. Null before triage."
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the response was sent. Null until RESOLVED."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the case was closed. Null until CLOSED."
        default: null
      - name: withdrawn_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the case was withdrawn/purged. Null unless WITHDRAWN."
        default: null

  - name: AgencyReferral
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this referral belongs to."
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the external agency the case was referred to."
      - name: referral_notes
        type: string
        source: input
        description: "Notes to the agency."
        default: null
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle state."
        default: DRAFT
        constraints: "one of {DRAFT, SENT, RESOLVED, REJECTED, RECALLED, CLOSED}"
      - name: response_summary
        type: string
        source: input
        description: "Summary supplied by the agency when the referral is resolved."
        default: null
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when referral was sent. Null until SENT."
        default: null
      - name: closed_reason
        type: enum
        source: system
        description: "Why the referral left the active set."
        default: null
        constraints: "one of {RESOLVED, REJECTED, RECALLED, CASE_CLOSED} or null"

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Venue name."
      - name: capacity
        type: integer
        source: input
        description: "Physical seating capacity of the venue (upper bound for any event held here)."
        constraints: ">= 0"
      - name: address
        type: string
        source: input
        description: "Venue address."
        default: null

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the representative hosting the town-hall."
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; where the event is held."
      - name: title
        type: string
        source: input
        description: "Event title."
      - name: start_at
        type: datetime
        source: input
        description: "Event start (inclusive)."
      - name: end_at
        type: datetime
        source: input
        description: "Event end (exclusive)."
      - name: capacity
        type: integer
        source: input
        description: "Registration capacity for this event; must not exceed the venue capacity at creation/reschedule."
        constraints: ">= 0"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Event lifecycle dimension."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CANCELLED}"
      - name: registration_status
        type: enum
        source: system
        description: "Registration dimension, independent of lifecycle_status."
        default: CLOSED
        constraints: "one of {CLOSED, OPEN, FULL}"
      - name: registered_count
        type: integer
        source: computed
        description: "Ledger counter: number of EventRegistration rows for this event with status=REGISTERED."
        default: 0

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event registered for."
      - name: constituent_id
        type: string
        source: input
        description: "FK -> Constituent.id; the registrant."
      - name: status
        type: enum
        source: system
        description: "Registration state."
        default: REGISTERED
        constraints: "one of {REGISTERED, CANCELLED}"
      - name: registered_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of registration."

  - name: NewsletterCampaign
    parent: null
    common_fields: true
    fields:
      - name: representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the office sending the mailing."
      - name: subject
        type: string
        source: input
        description: "Newsletter subject line."
      - name: body
        type: string
        source: input
        description: "Newsletter body."
      - name: page_count
        type: integer
        source: input
        description: "Number of printed pages; drives per-piece print cost."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Campaign state (created already sent)."
        default: SENT
        constraints: "one of {SENT}"
      - name: recipient_count
        type: integer
        source: computed
        description: "Count of Constituents with representative_id=this representative, status=ACTIVE, contact_consent=true at send time."
      - name: send_cost_cents
        type: integer
        source: computed
        description: "recipient_count * (BASE_POSTAGE_CENTS + PRINT_CENTS_PER_PAGE * page_count)."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Constituent
    initial_state: ACTIVE
    terminal_states: [PURGED]
    transitions:
      - from: ACTIVE
        to: PURGED
        trigger: "POST /constituents/{id}/purge"
        actor: OfficeAdmin | Constituent
        preconditions:
          - "status == ACTIVE"
          - "if actor is Constituent, X-User-ID == this Constituent.id"
        side_effects:
          - "overwrite full_name, email, address, and phone (when present) with the literal 'REDACTED'"
          - "set status = PURGED"
          - "CASCADE (hop 1): every Case for this constituent whose status in {NEW, IN_PROGRESS, AWAITING_CONSTITUENT, AWAITING_AGENCY} transitions to WITHDRAWN (withdrawn_at = clock now)"
          - "CASCADE (hop 2, caused by each Case->WITHDRAWN): every AgencyReferral of that case whose status in {DRAFT, SENT} transitions to RECALLED (closed_reason=RECALLED)"
          - "CASCADE (hop 3, caused by each SENT->RECALLED referral): decrement its Agency.open_referral_count by 1"
          - "CASCADE (parallel to hop1): every EventRegistration for this constituent with status=REGISTERED transitions to CANCELLED, decrementing its Event.registered_count and this constituent's upcoming_event_count"
        note: "Depth-3 transitive cascade (purge -> case withdrawn -> referral recalled -> agency counter)."

  - entity: Case
    initial_state: NEW
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: NEW
        to: IN_PROGRESS
        trigger: "POST /cases/{id}/triage"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == NEW"
          - "referenced ResponseTemplate exists, active == true, and its category == this Case.category (else ERR_TEMPLATE_MISMATCH)"
          - "the case's Constituent.status == ACTIVE"
        side_effects:
          - "set assigned_template_id, assignee_staff_id, priority (from body)"
          - "set response_window_hours = template.response_window_hours"
          - "compute effective_window_hours and final_due_at via case_response_deadline (final variant)"
          - "set triaged_at = clock now"
      - from: IN_PROGRESS
        to: AWAITING_CONSTITUENT
        trigger: "POST /cases/{id}/request-info"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "set paused_since = clock now (SLA clock pauses)"
      - from: AWAITING_CONSTITUENT
        to: IN_PROGRESS
        trigger: "POST /cases/{id}/constituent-reply"
        actor: Constituent
        preconditions:
          - "status == AWAITING_CONSTITUENT"
          - "X-User-ID == this Case.constituent_id"
        side_effects:
          - "cumulative_paused_hours += (clock now - paused_since) in hours; set paused_since = null (SLA clock resumes)"
        note: "Cycle: IN_PROGRESS <-> AWAITING_CONSTITUENT."
      - from: IN_PROGRESS
        to: AWAITING_AGENCY
        trigger: "POST /cases/{id}/referrals"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == IN_PROGRESS"
          - "the case's Constituent.data_sharing_consent == true (else ERR_CONSENT_REQUIRED)"
          - "referenced Agency.status == ACTIVE (else ERR_AGENCY_INACTIVE)"
        side_effects:
          - "create AgencyReferral (status=DRAFT) linked to this case and agency"
          - "set paused_since = clock now (SLA clock pauses)"
      - from: AWAITING_AGENCY
        to: IN_PROGRESS
        trigger: "system: AgencyReferral resolve or reject"
        actor: system
        preconditions:
          - "status == AWAITING_AGENCY"
        side_effects:
          - "cumulative_paused_hours += (clock now - paused_since) in hours; set paused_since = null"
          - "set last_agency_outcome to the referral outcome; on REJECTED also increment reject_count"
        note: "Cycle: IN_PROGRESS <-> AWAITING_AGENCY."
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /cases/{id}/respond"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "set resolved_at = clock now"
          - "freeze gross_elapsed_hours / net_elapsed_hours against resolved_at"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: OfficeAdmin
        preconditions:
          - "status == RESOLVED"
        side_effects:
          - "set closed_at = clock now"
          - "CASCADE: every AgencyReferral of this case whose status in {DRAFT, SENT} transitions to CLOSED (closed_reason=CASE_CLOSED), decrementing its Agency.open_referral_count by 1 when the prior status was SENT"
      - from: NEW
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Constituent
        preconditions:
          - "status in {NEW, IN_PROGRESS, AWAITING_CONSTITUENT, AWAITING_AGENCY}"
          - "X-User-ID == this Case.constituent_id"
        side_effects:
          - "set withdrawn_at = clock now"
          - "CASCADE: every AgencyReferral of this case whose status in {DRAFT, SENT} transitions to RECALLED (closed_reason=RECALLED), decrementing its Agency.open_referral_count by 1 when the prior status was SENT"
        note: "Also reachable from IN_PROGRESS/AWAITING_CONSTITUENT/AWAITING_AGENCY (same transition semantics)."
      - from: IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Constituent
        preconditions:
          - "status in {NEW, IN_PROGRESS, AWAITING_CONSTITUENT, AWAITING_AGENCY}"
          - "X-User-ID == this Case.constituent_id"
        side_effects:
          - "set withdrawn_at = clock now"
          - "CASCADE: recall open referrals as above"
      - from: AWAITING_AGENCY
        to: WITHDRAWN
        trigger: "POST /cases/{id}/withdraw"
        actor: Constituent
        preconditions:
          - "status in {NEW, IN_PROGRESS, AWAITING_CONSTITUENT, AWAITING_AGENCY}"
          - "X-User-ID == this Case.constituent_id"
        side_effects:
          - "set withdrawn_at = clock now"
          - "CASCADE: recall open referrals as above"

  - entity: AgencyReferral
    initial_state: DRAFT
    terminal_states: [RESOLVED, REJECTED, RECALLED, CLOSED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /agency-referrals/{id}/send"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == DRAFT"
          - "the parent Case.status == AWAITING_AGENCY"
          - "the referenced Agency.status == ACTIVE (else ERR_AGENCY_INACTIVE)"
        side_effects:
          - "set sent_at = clock now"
          - "increment Agency.open_referral_count by 1"
      - from: SENT
        to: RESOLVED
        trigger: "POST /agency-referrals/{id}/resolve"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == SENT"
        side_effects:
          - "set closed_reason = RESOLVED, response_summary from body"
          - "decrement Agency.open_referral_count by 1"
          - "CASCADE: parent Case AWAITING_AGENCY -> IN_PROGRESS with last_agency_outcome=RESOLVED (resumes SLA clock)"
        note: "Branch A of the SENT fork."
      - from: SENT
        to: REJECTED
        trigger: "POST /agency-referrals/{id}/reject"
        actor: Caseworker | OfficeAdmin
        preconditions:
          - "status == SENT"
        side_effects:
          - "set closed_reason = REJECTED"
          - "decrement Agency.open_referral_count by 1"
          - "CASCADE: parent Case AWAITING_AGENCY -> IN_PROGRESS with last_agency_outcome=REJECTED AND reject_count += 1 (resumes SLA clock)"
        note: "Branch B of the SENT fork; divergent side-effect set from Branch A (increments reject_count, sets a different last_agency_outcome)."
      - from: DRAFT
        to: RECALLED
        trigger: "system: case withdraw or constituent purge"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "set closed_reason = RECALLED (no counter change; DRAFT was never counted)"
      - from: SENT
        to: RECALLED
        trigger: "system: case withdraw or constituent purge"
        actor: system
        preconditions:
          - "status == SENT"
        side_effects:
          - "set closed_reason = RECALLED"
          - "decrement Agency.open_referral_count by 1"
      - from: DRAFT
        to: CLOSED
        trigger: "system: case close"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "set closed_reason = CASE_CLOSED (no counter change)"
      - from: SENT
        to: CLOSED
        trigger: "system: case close"
        actor: system
        preconditions:
          - "status == SENT"
        side_effects:
          - "set closed_reason = CASE_CLOSED"
          - "decrement Agency.open_referral_count by 1"

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: OfficeAdmin
        preconditions:
          - "lifecycle_status == SCHEDULED"
        side_effects:
          - "set registration_status = CLOSED"
          - "CASCADE (hop 1): every EventRegistration for this event with status=REGISTERED transitions to CANCELLED"
          - "CASCADE (hop 2, caused by each registration cancel): decrement registered_count by 1 AND decrement that constituent's upcoming_event_count by 1"
        note: "Depth-2 transitive cascade (event cancel -> registration cancel -> constituent counter)."
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /events/{id}/open-registration"
        actor: OfficeAdmin
        preconditions:
          - "lifecycle_status == SCHEDULED"
          - "registration_status == CLOSED"
        side_effects:
          - "set registration_status = OPEN, or FULL if registered_count >= capacity (covers the capacity==0 edge)"
        note: "registration_status dimension evolves independently of lifecycle_status."
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /events/{id}/reschedule"
        actor: OfficeAdmin
        preconditions:
          - "lifecycle_status == SCHEDULED"
          - "expected_event_version == current version (else ERR_STALE_VERSION)"
          - "new [start_at, end_at) passes venue and representative overlap checks"
          - "start_at < end_at"
        side_effects:
          - "update start_at, end_at, and venue_id (when supplied)"
          - "increment Event.version by 1"

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    transitions:
      - from: REGISTERED
        to: REGISTERED
        trigger: "POST /events/{id}/registrations (creation)"
        actor: Constituent | OfficeAdmin
        preconditions:
          - "Event.lifecycle_status == SCHEDULED AND Event.registration_status == OPEN"
          - "the Constituent.status == ACTIVE"
          - "no existing EventRegistration for (event_id, constituent_id) with status=REGISTERED (else ERR_DUPLICATE_REGISTRATION)"
          - "Event.registered_count < Event.capacity (else ERR_EVENT_FULL)"
        side_effects:
          - "increment Event.registered_count by 1; if it reaches capacity set Event.registration_status = FULL"
          - "increment the constituent's upcoming_event_count by 1"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /event-registrations/{id}/cancel"
        actor: Constituent | OfficeAdmin
        preconditions:
          - "status == REGISTERED"
          - "if actor is Constituent, X-User-ID == this EventRegistration.constituent_id"
        side_effects:
          - "decrement Event.registered_count by 1; if Event.registration_status was FULL and lifecycle_status==SCHEDULED set it to OPEN"
          - "decrement the constituent's upcoming_event_count by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: event-reschedule-stale-version
    parent_entity: Event
    write_endpoint: "POST /events/{id}/reschedule"
    occ_field: "expected_event_version"
    description: |
      Rescheduling an Event whose version has advanced since the client last
      observed it is rejected. Rescheduling is a legitimate repeat operation from
      SCHEDULED (a new time simply supersedes the prior one), so a stale view of
      the event cannot be caught by a state precondition; OCC on the parent
      Event.version reduces it to a stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: case_response_deadline
    trigger: "POST /cases (provisional variant) and POST /cases/{id}/triage (final variant)"
    algorithm: threshold
    formula: |
      # provisional variant (at intake):
      provisional_due_at = created_at + hours(DEFAULT_WINDOW_HOURS[category])

      # final variant (at triage):
      effective_window_hours = min(
        response_window_hours * PRIORITY_MULTIPLIER[priority] + CATEGORY_SURCHARGE_HOURS[category],
        MAX_WINDOW_HOURS
      )
      final_due_at = triaged_at + hours(effective_window_hours)
    input_set: "response_window_hours comes from the active ResponseTemplate selected at triage; priority and category from the Case."
    constants:
      DEFAULT_WINDOW_HOURS: { IMMIGRATION: 168, HEALTHCARE: 120, HOUSING: 120, TAX: 72, BENEFITS: 96, OTHER: 168 }
      PRIORITY_MULTIPLIER: { LOW: 1.5, NORMAL: 1.0, HIGH: 0.5, URGENT: 0.25 }
      CATEGORY_SURCHARGE_HOURS: { IMMIGRATION: 24, HEALTHCARE: 12, HOUSING: 12, TAX: 0, BENEFITS: 0, OTHER: 0 }
      MAX_WINDOW_HOURS: 720
    precision: "datetime arithmetic in whole hours; timestamps serialized ISO 8601 UTC with three fractional digits; effective_window_hours to 2 decimals, round_half_up"
    variants:
      - name: provisional
        when: "at intake, before triage"
        difference: "uses DEFAULT_WINDOW_HOURS[category] from created_at; ignores template, priority, and surcharge"
      - name: final
        when: "at triage"
        difference: "uses template window scaled by PRIORITY_MULTIPLIER plus CATEGORY_SURCHARGE_HOURS, capped by MAX_WINDOW_HOURS, measured from triaged_at"

  - name: case_net_response_time
    trigger: "computed on read (GET /cases/{id}); frozen at POST /cases/{id}/respond"
    algorithm: aggregation
    formula: |
      reference_end = resolved_at if status in {RESOLVED, CLOSED} else clock_now
      gross_elapsed_hours = (reference_end - triaged_at) in hours
      current_open_pause = (clock_now - paused_since) in hours if status in {AWAITING_CONSTITUENT, AWAITING_AGENCY} else 0
      net_elapsed_hours = gross_elapsed_hours - cumulative_paused_hours - current_open_pause
      breached = (net_elapsed_hours > effective_window_hours)   # strict greater-than
    input_set: "pause intervals are the periods the case spent in AWAITING_CONSTITUENT or AWAITING_AGENCY, accumulated into cumulative_paused_hours on each resume plus any still-open pause."
    constants: {}
    precision: "hours to 2 decimals, round_half_up; breach comparison uses the rounded net value"
    variants:
      - name: gross
        when: "wall-clock elapsed since triage"
        difference: "does not subtract any paused intervals"
      - name: net
        when: "SLA compliance evaluation"
        difference: "subtracts cumulative_paused_hours and any currently-open pause"

  - name: recurring_issue_index
    trigger: "GET /analytics/recurring-issues"
    algorithm: weighted_scoring
    formula: |
      # RAW variant (all-time):
      pool_raw   = Case where representative_id == R and (category == C if C given) and status != WITHDRAWN
      raw_index  = round( sum over pool_raw of round(PRIORITY_WEIGHT[priority], 2), 2 )

      # TREND variant (trailing window):
      cutoff     = clock_now - days(window_days)
      pool_trend = pool_raw filtered to created_at >= cutoff
      # round EACH case contribution to 2 decimals, THEN sum, THEN round the total (pinned order):
      trend_index = round( sum over pool_trend of round(PRIORITY_WEIGHT[priority] * RECENCY_BONUS, 2), 2 )

      case_count = size of the pool used by the selected variant
    input_set: "cases are grouped by representative_id and optional category; WITHDRAWN cases are always excluded; TREND additionally filters by created_at >= cutoff."
    constants:
      PRIORITY_WEIGHT: { LOW: 0.5, NORMAL: 1.0, HIGH: 2.0, URGENT: 3.5 }
      RECENCY_BONUS: 1.25
      DEFAULT_WINDOW_DAYS: 30
    precision: "2 decimals, round_half_up; per-case contribution rounded BEFORE summation (round-then-sum), then the total rounded again"
    variants:
      - name: RAW
        when: "variant=RAW (default)"
        difference: "all-time pool, weight only, no recency bonus, no window"
      - name: TREND
        when: "variant=TREND"
        difference: "trailing window_days pool, each weight multiplied by RECENCY_BONUS"

  - name: newsletter_reach_and_cost
    trigger: "POST /representatives/{id}/newsletters"
    algorithm: aggregation
    formula: |
      recipient_count = count(Constituent where representative_id == R and status == ACTIVE and contact_consent == true)
      send_cost_cents = recipient_count * (BASE_POSTAGE_CENTS + PRINT_CENTS_PER_PAGE * page_count)
    input_set: "recipients are ACTIVE, consenting constituents of the sending representative at send time."
    constants:
      BASE_POSTAGE_CENTS: 55
      PRINT_CENTS_PER_PAGE: 8
    precision: "integer cents"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /constituents when acting as Anonymous"
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity-backed Constituent actions on an owned resource, X-User-ID equals the resource owner's constituent id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /cases (as Constituent), constituent-reply, withdraw, purge, POST /events/{id}/registrations (as Constituent), registration cancel, PATCH /constituents/{id}, GET own constituent/case"
  - priority: 4
    category: business_constraint
    check: "request body has all required fields with valid types and enum values"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: business_temporal
    check: "start_at < end_at"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /events, POST /events/{id}/reschedule"
  - priority: 6
    category: existence
    check: "every referenced resource (path id and body FK) exists, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: "all endpoints referencing an id"
  - priority: 7
    category: state
    check: "target resource is in a state permitting this transition (see §1.2 preconditions)"
    error_id: "ERR_CASE_INVALID_STATE | ERR_REFERRAL_INVALID_STATE | ERR_EVENT_INVALID_STATE | ERR_REGISTRATION_INVALID_STATE"
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 8
    category: business_safety
    check: "the case's Constituent.data_sharing_consent == true when creating an agency referral"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /cases/{id}/referrals"
  - priority: 9
    category: business_safety
    check: "the referenced Constituent.status == ACTIVE (not PURGED)"
    error_id: ERR_CONSTITUENT_PURGED
    http_status: 409
    applies_to: "POST /cases, POST /events/{id}/registrations"
  - priority: 10
    category: business_referential
    check: "the referenced Agency.status == ACTIVE"
    error_id: ERR_AGENCY_INACTIVE
    http_status: 409
    applies_to: "POST /cases/{id}/referrals, POST /agency-referrals/{id}/send"
  - priority: 11
    category: business_referential
    check: "selected ResponseTemplate is active and its category matches the case category"
    error_id: ERR_TEMPLATE_MISMATCH
    http_status: 422
    applies_to: "POST /cases/{id}/triage"
  - priority: 12
    category: business_referential
    check: "no existing REGISTERED EventRegistration for (event_id, constituent_id)"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /events/{id}/registrations"
  - priority: 13
    category: business_temporal
    check: "the [start_at, end_at) interval, expanded by VENUE_BUFFER_MINUTES on both sides, does not overlap any other SCHEDULED event on the same venue"
    error_id: ERR_VENUE_CONFLICT
    http_status: 409
    applies_to: "POST /events, POST /events/{id}/reschedule"
  - priority: 14
    category: business_temporal
    check: "the half-open [start_at, end_at) interval does not overlap any other SCHEDULED event for the same representative (back-to-back end==start is allowed; no buffer)"
    error_id: ERR_REPRESENTATIVE_CONFLICT
    http_status: 409
    applies_to: "POST /events, POST /events/{id}/reschedule"
  - priority: 15
    category: business_constraint
    check: "Event.registered_count < Event.capacity; and event.capacity <= venue.capacity at create/reschedule"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /events/{id}/registrations"
  - priority: 16
    category: business_constraint
    check: "expected_event_version equals the current Event.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /events/{id}/reschedule"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (used for created_at/updated_at, SLA math, analytics windows). Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [OfficeAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  - method: POST
    path: "/representatives"
    description: "Create a representative record."
    roles: [OfficeAdmin]
    code: 201
