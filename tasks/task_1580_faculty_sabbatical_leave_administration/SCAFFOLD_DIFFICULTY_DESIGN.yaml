# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN - section 1.8 Test Targeting Index
# Faculty Sabbatical & Leave Administration - 9 rules x 2 instances = 18.
# Every recipe replays from empty-DB using only SCAFFOLD.yaml section-1.5 endpoints.
# Logical clock default: 2026-08-01T00:00:00Z (no set call needed unless noted).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 - dual_variant_calc (two different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: certified_vs_provisional_eligibility_diverge
        grounds:
          - calculations.service_credit_accrual
          - entities.FacultyMember.fields.lifetime_service_months
          - endpoints."GET /faculty-members/{id}/eligibility"
        distinguishing_aspect: |
          Entity domain = FacultyMember/LeaveApplication eligibility. Two valid algorithms over the
          same ledger: certified (chronological actuals) = 71 months -> eligible_certified false;
          provisional (forward-looking projection to the proposed start) = 76 months ->
          eligible_provisional true. The authoritative submit gate uses certified and fails.
        test_recipe:
          setup:
            - "Department D; faculty F hired 2020-09-01 (watermark 2020-08), salary 120000.00"
            - "Default clock 2026-08-01; one accrual run earns 2020-09..2026-07 = 71 EARN entries"
            - "Cycle created and OPEN; F holds a DRAFT 1-semester sabbatical application"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-09-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /accrual-runs"
              payload: {}
              as: LeaveAdministrator
            - call: "POST /leave-cycles"
              payload: { name: "AY2027 Sabbaticals", academic_year: "2027-2028", award_quota: 2 }
              as: ProvostOffice
              captures: { cy_id: $.data.id }
            - call: "POST /leave-cycles/${cy_id}/open"
              payload: {}
              as: ProvostOffice
            - call: "POST /leave-applications"
              payload: { leave_type: "SABBATICAL", cycle_id: "${cy_id}", requested_duration_semesters: 1, requested_salary_pct: 100, proposed_start_date: "2027-01-01T00:00:00Z", proposed_end_date: "2027-07-01T00:00:00Z" }
              as: Faculty
              as_user_id: "${f_id}"
              captures: { ap_id: $.data.id }
            - call: "GET /faculty-members/${f_id}/eligibility"
              payload: { proposed_start_date: "2027-01-01T00:00:00Z" }
              as: LeaveAdministrator
              captures: { e_cert: $.data.certified_service_months, e_prov: $.data.provisional_service_months, e_elig_c: $.data.eligible_certified, e_elig_p: $.data.eligible_provisional }
          trigger:
            - call: "POST /leave-applications/${ap_id}/submit"
              payload: {}
              as: Faculty
              as_user_id: "${f_id}"
              captures: { err: $.data.error_id }
          assert:
            - "eligibility read: certified_service_months == 71"
            - "eligibility read: provisional_service_months == 76 (71 + projected 2026-08..2026-12)"
            - "eligibility read: eligible_certified == false AND eligible_provisional == true (identical data, divergent verdicts)"
            - "submit rejected: err == ERR_INSUFFICIENT_SERVICE_MONTHS (certified variant is authoritative)"
      - name: repayment_chronological_vs_proportional_diverge
        grounds:
          - calculations.repayment_amortization
          - entities.ServiceObligation.fields.projected_liability
          - entities.RepaymentObligation.fields.amount_owed
        distinguishing_aspect: |
          Entity domain = ServiceObligation/RepaymentObligation money (different from Rule-1
          instance 1's eligibility domain). Base 100000.00 over 6 required months with 2 fulfilled:
          chronological amortization (canonical at breach) = 66666.66; proportional projection
          (read-time liability) = 66666.67. Same obligation data, one cent apart.
        test_recipe:
          setup:
            - "Full award pipeline: dept pool 160000.00, chair CH, faculty F hired 2020-08-01 (72 credits after one run), cycle quota 2, 1-semester 100% application window 2027-01-01..2027-07-01, 3 cross-department reviews (80/90/70, 90/85/95, 70/60/80), 5-course coverage plan approved, cycle allocated"
            - "Grant activated at 2027-01-01 (gross 60000.00, no fellowships, net 60000.00), completed at 2027-07-01 (plan final 40000.00; obligation required_months=6)"
            - "Clock 2027-09-15; accrual run credits obligation months 2027-07 and 2027-08 -> fulfilled_months == 2"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", replacement_pool: 160000.00 }
              as: LeaveAdministrator
              captures: { d_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "C100", full_name: "Chair Eng", department_id: "${d_id}", academic_rank: "FULL_PROFESSOR", hire_date: "2010-01-01T00:00:00Z", annual_base_salary: 150000.00 }
              as: LeaveAdministrator
              captures: { ch_id: $.data.id }
            - call: "PATCH /departments/${d_id}"
              payload: { chair_faculty_id: "${ch_id}" }
              as: LeaveAdministrator
            - call: "POST /faculty-members"
              payload: { employee_number: "F100", full_name: "Fac Uno", department_id: "${d_id}", academic_rank: "ASSOCIATE_PROFESSOR", hire_date: "2020-08-01T00:00:00Z", annual_base_salary: 120000.00 }
              as: LeaveAdministrator
              captures: { f_id: $.data.id }
            - call: "POST /departments"
              payload: { name: "Humanities", replacement_pool: 50000.00 }
              as: LeaveAdministrator
              captures: { d2_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "R101", full_name: "Rev One", department_id: "${d2_id}", academic_rank: "FULL_PROFESSOR", hire_date: "2012-01-01T00:00:00Z", annual_base_salary: 110000.00 }
              as: LeaveAdministrator
              captures: { r1_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { employee_number: "R102", full_name: "Rev Two", department_id: "${d2_id}", academic_rank: "FULL_PROFESSOR", hire_date: "2012-01-01T00:00:00Z", annual_base_salary: 110000.00 }
