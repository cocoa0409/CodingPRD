      - name: finding_resolution_and_rule_retirement_gates
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_RESOLUTION_BELOW_THRESHOLD
          - errors.ERR_RULE_HAS_OPEN_FINDINGS
          - errors.ERR_FINDING_ALREADY_CLOSED
        distinguishing_aspect: "Three gates in one lifecycle: a resolve below the rule's threshold is refused, a rule carrying that still-open finding cannot retire, and once the finding is genuinely resolved the same plan-remediation call becomes an already-closed error while the retirement now succeeds."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with rule QR1 (40 pts, threshold 90.00, HIGH); one PROVISIONAL run at 45.00 opened one OPEN finding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [{ rule_code: "QR1", measured_pct: 45.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run_id: $.data.id }
            - call: "GET /mdm/quality-findings?scorecard_run_id=${run_id}&quality_rule_id=${qr1_id}"
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { f_id: "$.data[0].id" }
          trigger:
            - call: "POST /mdm/quality-findings/${f_id}/resolve"
              payload: { verified_measured_pct: 89.99 }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_below: $.data.error_id }
            - call: "PATCH /mdm/quality-rules/${qr1_id}"
              payload: { status: "RETIRED" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_open: $.data.error_id }
            - call: "POST /mdm/quality-findings/${f_id}/resolve"
              payload: { verified_measured_pct: 90.00, resolution_note: "Backfill completed" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { r_status: $.data.status, r_measured: $.data.measured_pct, r_gap: $.data.gap_pct, r_resolved_at: $.data.resolved_at }
            - call: "POST /mdm/quality-findings/${f_id}/plan-remediation"
              payload: { assigned_steward_id: "${std_id}", due_at: "2026-08-20T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { e_closed: $.data.error_id }
            - call: "PATCH /mdm/quality-rules/${qr1_id}"
              payload: { status: "RETIRED" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { retire_status: $.data.status }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_weight: $.data.open_finding_weight }
          assert:
            - "${e_below} == ERR_RESOLUTION_BELOW_THRESHOLD (422) - 89.99 is below the 90.00 threshold"
            - "${e_open} == ERR_RULE_HAS_OPEN_FINDINGS (409)"
            - "third trigger -> HTTP 200, ${r_status} == RESOLVED, ${r_measured} == 90.00, ${r_gap} == 0.00, ${r_resolved_at} == 2026-08-01T00:00:00Z (exactly at threshold passes)"
            - "${e_closed} == ERR_FINDING_ALREADY_CLOSED (409)"
            - "${retire_status} == RETIRED - the retirement gate opened once the finding left the open set"
            - "${dom_weight} == 0.00"

