            - call: "POST /labeling/lab-tests/${t1_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 57.0 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.0 }, { fiber_generic_name: "ELASTANE", measured_pct: 3.0 }] }
              as: AccreditedLab
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "CARE_PERFORMANCE", lab_code: "LAB-ATL-1", method: "AATCC_135", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z", wash_temp_c: 30 }
              as: AccreditedLab
              captures: { c1_id: $.data.id }
            - call: "POST /labeling/lab-tests/${c1_id}/results"
              payload: { cycles_run: 5, dimensional_change_pct: 2.0, colorfastness_grade: 4.0, legibility_cycles: 40 }
              as: AccreditedLab
            - call: "POST /labeling/label-specs"
              payload: { style_id: "${style_id}", market_codes: ["US", "CA"], languages: ["en", "fr"], placement_code: "NECK_CENTER_INSIDE", durability_cycles_rating: 30, wash_temp_c: 30, bleach_code: "NO_BLEACH", dry_code: "TUMBLE_LOW", iron_code: "IRON_LOW", dryclean_code: "DO_NOT_DRYCLEAN", identity_display_mode: "RN", fiber_content_text: "60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER", origin_text: "Made in VN", origin_determination_id: "${od_id}", care_test_id: "${c1_id}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /labeling/label-specs/${l1_id}/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-appr-1"
              captures: { err_p45: $.data.error_id }
            - call: "POST /labeling/label-specs/${l1_id}/submit"
              payload: {}
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
            - call: "POST /labeling/label-specs/${l1_id}/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-spec-1"
              captures: { err_p50: $.data.error_id }
            - call: "POST /labeling/label-specs/${l1_id}/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-appr-1"
              captures: { err_p95: $.data.error_id }
          assert:
            - "${err_p45} == \"ERR_LABEL_STATE_INVALID\" with HTTP 409"
            - "${err_p50} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403"
            - "${err_p95} == \"ERR_DURABILITY_INSUFFICIENT\" with HTTP 422"
            - "LabelSpec.${l1_id}.state == \"PENDING_APPROVAL\" after all three rejections"
            - "LabelSpec.${l1_id}.approved_by_user_id == null"
            - "GET /labeling/styles/${style_id}/compliance-summary returns required_durability_cycles == 32"

      - name: role_gate_answers_before_path_existence
        grounds:
          - validations[priority=15]
          - validations[priority=20]
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_LABEL_SPEC_NOT_FOUND
          - roles.LabelingApprover.exclusive_operations
        distinguishing_aspect: |
          The same request path carries two violations - a role that is not on the endpoint's list (priority 15) and a label id that does not exist (priority 20) - so the answer must be ERR_ROLE_NOT_PERMITTED 403 and must not leak the fact that the id is unknown; only when the caller switches to LabelingApprover does the response become ERR_LABEL_SPEC_NOT_FOUND 404.
        test_recipe:
          setup:
            - "No fixtures at all are required; the label id 00000000-0000-0000-0000-0000000009ff is deliberately absent from the store."
          setup_api_calls: []
          trigger:
            - call: "POST /labeling/label-specs/00000000-0000-0000-0000-0000000009ff/approve"
              payload: {}
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { err_role: $.data.error_id }
            - call: "POST /labeling/label-specs/00000000-0000-0000-0000-0000000009ff/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-appr-1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "${err_role} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403"
            - "${err_missing} == \"ERR_LABEL_SPEC_NOT_FOUND\" with HTTP 404"

      - name: request_shape_answers_before_the_licensor_rule
        grounds:
          - validations[priority=35]
          - validations[priority=38]
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_LICENSOR_REQUIRED
          - entities.Brand.fields.responsibility_mode
          - entities.Brand.fields.licensor_brand_id
        distinguishing_aspect: |
          A brand registration can be malformed and legally incoherent in the same body - party_type is not a declared enum member (priority 35) and responsibility_mode LICENSOR_OF_RECORD is missing its licensor_brand_id (priority 38) - so the shape gate answers ERR_INVALID_REQUEST 400 first and the licensor rule only surfaces as ERR_LICENSOR_REQUIRED 422 after the enum is corrected; the third call, which supplies the licensor, succeeds and shows responsible_brand_id resolving to the licensor rather than to the new row.
        test_recipe:
          setup:
            - "One brand exists to act as the licensor of record."
          setup_api_calls:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Harborline Group", party_type: "BRAND_OWNER", rn_number: "RN99001", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { licensor_id: $.data.id }
          trigger:
            - call: "POST /labeling/brands"
              payload: { legal_name: "Southgate Licensee LLC", party_type: "SUBLICENSEE", responsibility_mode: "LICENSOR_OF_RECORD" }
              as: ComplianceAdmin
              captures: { err_shape: $.data.error_id }
            - call: "POST /labeling/brands"
              payload: { legal_name: "Southgate Licensee LLC", party_type: "LICENSEE", responsibility_mode: "LICENSOR_OF_RECORD" }
              as: ComplianceAdmin
              captures: { err_licensor: $.data.error_id }
            - call: "POST /labeling/brands"
              payload: { legal_name: "Southgate Licensee LLC", party_type: "LICENSEE", licensor_brand_id: "${licensor_id}", responsibility_mode: "LICENSOR_OF_RECORD" }
              as: ComplianceAdmin
              captures: { licensee_id: $.data.id, resolved_owner: $.data.responsible_brand_id }
          assert:
            - "${err_shape} == \"ERR_INVALID_REQUEST\" with HTTP 400"
            - "${err_licensor} == \"ERR_LICENSOR_REQUIRED\" with HTTP 422"
            - "${resolved_owner} == ${licensor_id}"
            - "Brand.${licensee_id}.posture == \"OPEN\" and Brand.${licensee_id}.outstanding_penalty_usd == 0.00"

  - rule_id: boundary_precision_check
    instances:
      - name: fiber_tolerance_comparison_is_inclusive_at_the_exact_market_tolerance
        grounds:
          - calculations.fiber_tolerance_evaluation
          - entities.MarketRequirement.fields.fiber_tolerance_pp
          - entities.MarketRequirement.fields.absolute_claim_tolerance_pp
          - entities.LabTest.fields.result_delta_pp_max
          - state_machines[entity=Style, dimension=substantiation_state]
        distinguishing_aspect: |
          The verdict turns on a single tenth of a percentage point: a maximum deviation of exactly 3.0 pp against a 3.0 pp market tolerance is a PASS because the comparison is inclusive, 3.1 pp is a FAIL, and on an absolute 100.0% claim the tolerance collapses to 0.0 pp so a deviation of exactly 0.0 passes while 0.3 pp fails - four styles that differ only in the first decimal of one measured line.
