# ===========================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2981 — Building Trades Hiring Hall Dispatch
#
# Nine rule_id blocks x 2 instances = 18 instances. Every instance grounds in
# elements already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file
# leaves the scaffold's declared behavior identical.
#
# Every numeric assertion below was executed against the §1.3 formulas and
# their constants before being written down (weekday counts, per-entry
# round_half_up, floor/min/max allowances, retention arithmetic).
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dispatch_order_variant_diverges_on_short_call
        grounds:
          - calculations.dispatch_order_ranking
          - entities.JobRequest.fields.duration_type
          - entities.OutOfWorkList.fields.ordering_policy
          - entities.Registration.fields.credited_seniority_hours
          - endpoints["GET /hiring-hall/job-requests/{id}/dispatch-order"]
        distinguishing_aspect: |
          This instance's dual variant decides WHICH REGISTRATION IS RANK 1 on the
          out-of-work lists (subject domain: Registration ordering), because
          strict_group_order sorts on OutOfWorkList.priority_rank first while
          short_call_interfiled ignores the list group entirely and sorts on
          registered_at — so identical registration data yields two different
          top_registration_id values.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00.000Z, advanced to 2026-09-02T00:00:00.000Z between the two registrations."
            - "Home Local 512 (reciprocity_factor_bp 0) and sister Local 46 (reciprocity_factor_bp 5000)."
            - "GROUP_1: priority_rank 1, SENIORITY, requires_local_hours 4000, accepts_travelers false. GROUP_4: priority_rank 4, SENIORITY, requires_local_hours 0, accepts_travelers true."
            - "Ana Reyes: local journeyworker, 9000 local hours, registered on GROUP_1 on 2026-09-02 (credited_seniority_hours 9000)."
            - "Bo Chen: traveler journeyworker out of Local 46, 0 local hours, registered on GROUP_4 on 2026-09-01 with one reciprocity credit of 1000 raw hours (credited_seniority_hours 500)."
            - "One signatory contractor with two OPEN journeyworker requests that differ ONLY in expected_duration_days: 20 days (LONG_CALL) and 3 days (SHORT_CALL)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 46, name: "Local 46 (sister)", kind: "SISTER", reciprocity_factor_bp: 5000 }
              as: HallAdmin
              captures: { sister46_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_4", priority_rank: 4, ordering_policy: "SENIORITY", requires_local_hours: 0, accepts_travelers: true }
              as: HallAdmin
              captures: { g4_id: $.data.id }
            - call: "POST /hiring-hall/ratio-policies"
              payload: { policy_code: "STD-2026", first_apprentice_at_jw_count: 1, then_every_n_jw: 4, effective_from: "2026-01-01T00:00:00.000Z" }
              as: HallAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Ana Reyes", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_ana_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Bo Chen", home_local_id: "${sister46_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 0 }
              as: HallAdmin
              captures: { m_bo_id: $.data.id, bo_is_traveler: $.data.is_traveler }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_bo_id}", list_id: "${g4_id}", reciprocity_credits: [{ sister_local_id: "${sister46_id}", raw_hours: 1000 }] }
              as: Dispatcher
              captures: { reg_bo_id: $.data.id, bo_credited: $.data.credited_seniority_hours }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_ana_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_ana_id: $.data.id, ana_credited: $.data.credited_seniority_hours }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Acme Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { acme_id: $.data.id }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${acme_id}", job_site: "Riverbend Hospital", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 20, report_at: "2026-09-25T14:00:00.000Z", hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${acme_id}"
              captures: { jr_long_id: $.data.id, long_duration_type: $.data.duration_type }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${acme_id}", job_site: "Riverbend Hospital shutdown", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 3, report_at: "2026-09-25T14:00:00.000Z", hourly_rate_cents: 5000 }
              as: ContractorRep
              as_user_id: "${acme_id}"
              captures: { jr_short_id: $.data.id, short_duration_type: $.data.duration_type }
          trigger:
            - call: "GET /hiring-hall/job-requests/${jr_long_id}/dispatch-order"
              payload: { slot_kind: "JOURNEYWORKER" }
              as: Dispatcher
              captures: { long_top: $.data.top_registration_id, long_variant: $.data.variant, long_count: $.data.candidate_count, long_hours: $.data.top_credited_seniority_hours }
            - call: "GET /hiring-hall/job-requests/${jr_short_id}/dispatch-order"
              payload: { slot_kind: "JOURNEYWORKER" }
              as: Dispatcher
              captures: { short_top: $.data.top_registration_id, short_variant: $.data.variant, short_count: $.data.candidate_count, short_hours: $.data.top_credited_seniority_hours }
          assert:
            - "${long_duration_type} == LONG_CALL and ${short_duration_type} == SHORT_CALL"
            - "${bo_is_traveler} == true and ${bo_credited} == 500 and ${ana_credited} == 9000"
            - "${long_variant} == STRICT_GROUP_ORDER and ${long_top} == ${reg_ana_id} and ${long_hours} == 9000"
            - "${short_variant} == SHORT_CALL_INTERFILED and ${short_top} == ${reg_bo_id} and ${short_hours} == 500"
            - "${long_top} != ${short_top} — the same two registrations yield different rank-1 rows under the two variants"
            - "${long_count} == 2 and ${short_count} == 2 — the candidate set is identical; only the ranking key differs"
      - name: back_pay_variant_diverges_on_dispatch_status
        grounds:
          - calculations.back_pay_make_whole
          - state_machines.Grievance.UNDER_REVIEW_to_SUSTAINED
          - state_machines.Dispatch.WORKING_to_LAID_OFF
          - entities.Grievance.fields.back_pay_variant
          - entities.Grievance.fields.back_pay_amount_cents
        distinguishing_aspect: |
          This instance's dual variant decides HOW MANY CENTS A GRIEVANCE AWARD IS
          (subject domain: Grievance/Dispatch money, not Registration ordering), and
          the two variants differ in BOTH the hour source (projected weekdays vs
          contractor-reported hours_worked) and the rounding site (per scheduled day
          vs once over the whole award): 40 h / 208120 cents versus 37 h / 192511 cents
          from the same hourly_rate_cents 5203 and the same 2026-09-08T14:00:00.000Z start.
        test_recipe:
          setup:
            - "Clock 2026-09-01 for the books, 2026-09-05 for intake and referrals, 2026-09-10 for filing, 2026-09-14 for the layoff, 2026-09-15 for adjudication."
            - "GROUP_1 (SENIORITY) holds three journeyworkers: Mia Ford 9000 h (rank 1, the bypassed grievant), Nate Ruiz 8000 h, Omar Diaz 7000 h."
            - "Two identical LONG_CALL requests from one signatory contractor, hourly_rate_cents 5203, report_at 2026-09-08T14:00:00.000Z."
            - "Dispatcher user disp-01 issues both referrals out of list order with an override_reason (Nate on request A, Omar on request B); both accept, producing two WORKING dispatches."
            - "Mia files an OUT_OF_ORDER_DISPATCH grievance against each referral; both are moved UNDER_REVIEW by business manager bm-01."
            - "Only Omar's dispatch is laid off (hours_worked 37) before adjudication, so grievance A meets the SCHEDULED_HOURS variant and grievance B the ACTUAL_HOURS variant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/ratio-policies"
              payload: { policy_code: "STD-2026", first_apprentice_at_jw_count: 1, then_every_n_jw: 4, effective_from: "2026-01-01T00:00:00.000Z" }
              as: HallAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Mia Ford", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_mia_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Nate Ruiz", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 8000 }
              as: HallAdmin
              captures: { m_nate_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Omar Diaz", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 7000 }
              as: HallAdmin
              captures: { m_omar_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_mia_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_mia_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_nate_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_nate_id: $.data.id }
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_omar_id}", list_id: "${g1_id}" }
              as: Dispatcher
              captures: { reg_omar_id: $.data.id }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Acme Mechanical", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { acme_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${acme_id}", job_site: "Cell 4 Boiler A", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 20, report_at: "2026-09-08T14:00:00.000Z", hourly_rate_cents: 5203 }
              as: ContractorRep
              as_user_id: "${acme_id}"
              captures: { jr_a_id: $.data.id, jr_a_v: $.data.version }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${acme_id}", job_site: "Cell 4 Boiler B", journeyworkers_requested: 1, apprentices_requested: 0, expected_duration_days: 20, report_at: "2026-09-08T14:00:00.000Z", hourly_rate_cents: 5203 }
              as: ContractorRep
              as_user_id: "${acme_id}"
              captures: { jr_b_id: $.data.id, jr_b_v: $.data.version }
            - call: "POST /hiring-hall/job-requests/${jr_a_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", member_id: "${m_nate_id}", override_reason: "dispatcher bypassed the rank-1 registrant", expected_job_request_version: "${jr_a_v}" }
              as: Dispatcher
              as_user_id: "disp-01"
              captures: { ref_a_id: $.data.id, ref_a_override: $.data.out_of_order_override }
            - call: "POST /hiring-hall/referrals/${ref_a_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m_nate_id}"
              captures: { disp_a_id: $.data.id, disp_a_start: $.data.start_at }
            - call: "POST /hiring-hall/job-requests/${jr_b_id}/referrals"
              payload: { slot_kind: "JOURNEYWORKER", referral_kind: "LIST_ORDER", member_id: "${m_omar_id}", override_reason: "dispatcher bypassed the rank-1 registrant", expected_job_request_version: "${jr_b_v}" }
              as: Dispatcher
              as_user_id: "disp-01"
              captures: { ref_b_id: $.data.id }
            - call: "POST /hiring-hall/referrals/${ref_b_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${m_omar_id}"
              captures: { disp_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/grievances"
              payload: { referral_id: "${ref_a_id}", claim_type: "OUT_OF_ORDER_DISPATCH", narrative: "I stood first on GROUP_1 and was passed over on Boiler A." }
              as: Member
              as_user_id: "${m_mia_id}"
              captures: { grv_a_id: $.data.id }
            - call: "POST /hiring-hall/grievances"
              payload: { referral_id: "${ref_b_id}", claim_type: "OUT_OF_ORDER_DISPATCH", narrative: "I stood first on GROUP_1 and was passed over on Boiler B." }
              as: Member
              as_user_id: "${m_mia_id}"
              captures: { grv_b_id: $.data.id }
            - call: "POST /hiring-hall/grievances/${grv_a_id}/review"
              payload: {}
              as: BusinessManager
              as_user_id: "bm-01"
            - call: "POST /hiring-hall/grievances/${grv_b_id}/review"
              payload: {}
              as: BusinessManager
              as_user_id: "bm-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/dispatches/${disp_b_id}/layoff"
              payload: { hours_worked: 37, layoff_reason: "REDUCTION_IN_FORCE" }
              as: ContractorRep
              as_user_id: "${acme_id}"
              captures: { disp_b_status: $.data.status, disp_b_hours: $.data.hours_worked }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00.000Z" }
              as: HallAdmin
          trigger:
            - call: "POST /hiring-hall/grievances/${grv_a_id}/adjudicate"
              payload: { decision: "SUSTAINED", remedy: "MAKE_WHOLE_HOURS", note: "Out-of-order dispatch sustained; worker still on the job." }
              as: BusinessManager
              as_user_id: "bm-01"
              captures: { a_variant: $.data.back_pay_variant, a_hours: $.data.back_pay_hours, a_cents: $.data.back_pay_amount_cents, a_status: $.data.status }
            - call: "POST /hiring-hall/grievances/${grv_b_id}/adjudicate"
              payload: { decision: "SUSTAINED", remedy: "MAKE_WHOLE_HOURS", note: "Out-of-order dispatch sustained; worker already laid off." }
              as: BusinessManager
              as_user_id: "bm-01"
              captures: { b_variant: $.data.back_pay_variant, b_hours: $.data.back_pay_hours, b_cents: $.data.back_pay_amount_cents, b_status: $.data.status }
          assert:
            - "${ref_a_override} == true and ${disp_b_status} == LAID_OFF and ${disp_b_hours} == 37 and ${disp_a_start} == 2026-09-08T14:00:00.000Z"
            - "${a_status} == SUSTAINED and ${a_variant} == SCHEDULED_HOURS"
            - "${a_hours} == 40 — the five weekdays 2026-09-08, 09-09, 09-10, 09-11 and 09-14 in the half-open window [2026-09-08, 2026-09-15) times STANDARD_DAY_HOURS 8"
            - "${a_cents} == 208120 — round_half_up(8 * 5203 * 10000/10000) == 41624 cents per scheduled day, times 5 days"
            - "${b_status} == SUSTAINED and ${b_variant} == ACTUAL_HOURS"
            - "${b_hours} == 37 and ${b_cents} == 192511 — round_half_up(37 * 5203) applied exactly once over the whole award"
            - "${a_cents} != ${b_cents} and ${a_hours} != ${b_hours} on identical hourly_rate_cents and identical dispatch start_at"
            - "GET /hiring-hall/ledger-entries?member_id=${m_mia_id}&event_code=MAKE_WHOLE_CREDITED returns two entries with hours_delta 40 and 37"
  - rule_id: combinatorial_formula
    instances:
      - name: named_call_and_skill_allowance_nested_min_max
        grounds:
          - calculations.named_call_and_skill_allowance
          - entities.JobRequest.fields.named_call_allowance
          - entities.JobRequest.fields.special_skill_allowance
          - validations[priority=33]
          - validations[priority=34]
        distinguishing_aspect: |
          MODE (a): a >=3-input non-linear formula — named_call_allowance is
          min(NAMED_CALL_HARD_CAP, max(1, floor(total_requested / NAMED_CALL_DIVISOR)))
          gated by a branch on duration_type, and special_skill_allowance is
          min(journeyworkers_requested, floor(jw * SPECIAL_SKILL_SHARE_BP / 10000) + jw MOD 2),
          so nested min/max plus a state branch — NOT the rounding-order mode of the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; home Local 512; one signatory contractor."
            - "Five journeyworker members exist on the books so named_call_member_ids resolve (no registrations needed — intake never consults the lists)."
            - "Every request below asks for 25 journeyworkers + 5 apprentices (total_requested 30) with required_skill_code WELDING_6G; only expected_duration_days and the two declared counts vary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/contractors"
              payload: { name: "Keystone Industrial", agreement_expires_at: "2027-06-30T00:00:00.000Z", signatory_status: "SIGNATORY" }
              as: HallAdmin
              captures: { key_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Named One", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { n1_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Named Two", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { n2_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Named Three", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { n3_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Named Four", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { n4_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Named Five", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { n5_id: $.data.id }
          trigger:
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${key_id}", job_site: "Unit 7 turnaround", journeyworkers_requested: 25, apprentices_requested: 5, expected_duration_days: 30, report_at: "2026-09-20T07:00:00.000Z", hourly_rate_cents: 5100, required_skill_code: "WELDING_6G", special_skill_slots_requested: 13, named_call_member_ids: ["${n1_id}", "${n2_id}", "${n3_id}", "${n4_id}"] }
              as: ContractorRep
              as_user_id: "${key_id}"
              captures: { ok_jr_id: $.data.id, ok_named: $.data.named_call_allowance, ok_special: $.data.special_skill_allowance, ok_duration: $.data.duration_type }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${key_id}", job_site: "Unit 7 turnaround (five named)", journeyworkers_requested: 25, apprentices_requested: 5, expected_duration_days: 30, report_at: "2026-09-20T07:00:00.000Z", hourly_rate_cents: 5100, required_skill_code: "WELDING_6G", special_skill_slots_requested: 13, named_call_member_ids: ["${n1_id}", "${n2_id}", "${n3_id}", "${n4_id}", "${n5_id}"] }
              as: ContractorRep
              as_user_id: "${key_id}"
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${key_id}", job_site: "Unit 7 turnaround (fourteen skill slots)", journeyworkers_requested: 25, apprentices_requested: 5, expected_duration_days: 30, report_at: "2026-09-20T07:00:00.000Z", hourly_rate_cents: 5100, required_skill_code: "WELDING_6G", special_skill_slots_requested: 14, named_call_member_ids: ["${n1_id}", "${n2_id}", "${n3_id}", "${n4_id}"] }
              as: ContractorRep
              as_user_id: "${key_id}"
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${key_id}", job_site: "Unit 7 four-day outage", journeyworkers_requested: 25, apprentices_requested: 5, expected_duration_days: 4, report_at: "2026-09-20T07:00:00.000Z", hourly_rate_cents: 5100, required_skill_code: "WELDING_6G", special_skill_slots_requested: 13, named_call_member_ids: ["${n1_id}"] }
              as: ContractorRep
              as_user_id: "${key_id}"
          assert:
            - "First call returns 201 with ${ok_duration} == LONG_CALL"
            - "${ok_named} == 4 — min(NAMED_CALL_HARD_CAP 4, max(1, floor(30 / NAMED_CALL_DIVISOR 5) == 6)) == 4, i.e. the hard cap binds, not the divisor"
            - "${ok_special} == 13 — min(25, floor(25 * 5000 / 10000) == 12, plus 25 MOD 2 == 1) == 13, i.e. the odd-count correction adds the thirteenth slot"
            - "Second call returns 409 ERR_NAMED_CALL_ALLOWANCE_EXCEEDED — five named calls against an allowance of 4"
            - "Third call returns 409 ERR_SPECIAL_SKILL_ALLOWANCE_EXCEEDED — 14 special-skill slots against an allowance of 13"
            - "Fourth call returns 409 ERR_NAMED_CALL_ALLOWANCE_EXCEEDED — expected_duration_days 4 makes duration_type SHORT_CALL, whose named_call_allowance is 0, so even one named call is rejected on data that is otherwise identical to the accepted first call"
      - name: traveler_credit_rounds_per_entry_then_sums
        grounds:
          - calculations.traveler_credited_seniority_hours
          - entities.Registration.fields.reciprocity_credits
          - entities.Registration.fields.credited_seniority_hours
          - entities.Local.fields.reciprocity_factor_bp
        distinguishing_aspect: |
          MODE (b): nested rounding where the ORDER decides the integer — the scaffold
          pins round_half_up per reciprocity entry BEFORE summation, so two entries that
          each land on a .5 boundary (1003 h and 1005 h at 5000 bp) yield 502 + 503 == 1005,
          whereas the forbidden sum-then-round order yields 1004; no min/max nesting is
          involved, unlike the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00.000Z; home Local 512 (bp 0); sister Local 46 and sister Local 9, both reciprocity_factor_bp 5000."
            - "GROUP_4: priority_rank 4, SENIORITY, requires_local_hours 0, accepts_travelers true."
            - "Traveler journeyworker Val Ortiz out of Local 46 with local_hours_in_trade 0, so the whole credited figure comes from the two reciprocity entries."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 46, name: "Local 46 (sister)", kind: "SISTER", reciprocity_factor_bp: 5000 }
              as: HallAdmin
              captures: { sister46_id: $.data.id }
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 9, name: "Local 9 (sister)", kind: "SISTER", reciprocity_factor_bp: 5000 }
              as: HallAdmin
              captures: { sister9_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_4", priority_rank: 4, ordering_policy: "SENIORITY", requires_local_hours: 0, accepts_travelers: true }
              as: HallAdmin
              captures: { g4_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Val Ortiz", home_local_id: "${sister46_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 0 }
              as: HallAdmin
              captures: { m_val_id: $.data.id, val_traveler: $.data.is_traveler }
          trigger:
            - call: "POST /hiring-hall/registrations"
              payload: { member_id: "${m_val_id}", list_id: "${g4_id}", reciprocity_credits: [{ sister_local_id: "${sister46_id}", raw_hours: 1003 }, { sister_local_id: "${sister9_id}", raw_hours: 1005 }] }
              as: Member
              as_user_id: "${m_val_id}"
              captures: { reg_val_id: $.data.id, val_credited: $.data.credited_seniority_hours, val_pos: $.data.position_number }
          assert:
            - "${val_traveler} == true and ${val_pos} == 1"
            - "${val_credited} == 1005 — round_half_up(1003 * 0.5) == 502 plus round_half_up(1005 * 0.5) == 503, added to local_hours_in_trade 0"
            - "${val_credited} != 1004 — 1004 is exactly what the forbidden sum-then-round order (501.5 + 502.5 == 1004.0) would produce, so the assertion falsifies the wrong rounding order"
