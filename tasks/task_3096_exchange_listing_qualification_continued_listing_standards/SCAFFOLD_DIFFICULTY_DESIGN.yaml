  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: panel_reversal_conserves_open_deficiency_count
        grounds:
          - state_machines.Deficiency.PANEL_REVIEW_to_DELIST_REVERSED
          - entities.Deficiency.fields.status
        distinguishing_aspect: "Conserved quantity — the issuer's count of Deficiency rows with status == OPEN: a panel REVERSE closes the PANEL_REVIEW row as DELIST_REVERSED and mints a fresh OPEN row in the same request, so count(OPEN) after == count(OPEN) before (1 == 1) even though no row's id survives the transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP18 LISTED on CAPITAL with exactly one deficiency (BID_PRICE) in PANEL_REVIEW — appeal FILED and under panel review; zero other OPEN deficiencies exist."
