            - { call: "GET /uro/utility-owners/${o1}", payload: {}, as: ProgramAdmin, captures: { own_days_after_cancel: "$.data.open_commitment_days" } }
          assert:
            - "${s0_liability} == 0, ${s0_ledger} == 0 and ${s0_remaining} == 100000000 before any conflict exists"
            - "${own_days_after_create} == 15 (2027-04-05 inclusive to 2027-04-20 exclusive)"
            - "${s1_liability} == 25600000, ${s1_ledger} == 29070000 and ${s1_remaining} == 70930000"
            - "${own_days_after_cancel} == 0, exactly the pre-creation value"
            - "${s2_ledger} == 0 and ${s2_remaining} == 100000000, so voiding restored the ledger to the cent"
            - "${s2_liability} == 25600000, unchanged by the cancel and the void, because the governing plan is still APPROVED and the conflict is not CLEARED"
            - "${s2_open} == 1 and ${s2_posture} == CLEARANCE_PENDING once the AT_RISK commitment window is gone"
            - "each figure in the summary equals a recomputation from the source rows; none of them is only updated on the write path"

      - name: corner_the_full_breach_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers", "state_machines.ScheduleCommitment", "state_machines.UtilityOwner"]
        excluded_because:
          difficulty_instance: "transitive_cascade / second_breach_cascades_commitment_to_owner_to_agreement_to_cost_document"
          rationale: "That instance walks the four-level cascade from the breached commitment to the owner hold, to the HELD agreement and to its HELD cost documents, asserting the ordering and the threshold, which is exactly this layer's claim."

      - name: corner_both_prior_rights_variants_are_computed_and_compared
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers", "calculations.prior_rights_state_share"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / prior_rights_record_basis_versus_field_basis_share"
          rationale: "That instance drives the same conflict through both the RECORD_BASIS and the FIELD_BASIS variant, asserts 100 versus 55 and pins the delta that flows into the project's liability, which covers the layer's variant-divergence claim."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_figure_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.agreement_state_share_settlement", "calculations.project_clearance_posture", "endpoints.POST_/uro/agreements", "endpoints.POST_/uro/agreements/{id}/execute"]
        distinguishing_aspect: "Nothing in this domain is deferred: the agreement create response already carries all nine settlement figures computed from the plan, and the execute response's own body plus a project read taken immediately afterwards already show the new ledger and the recomputed posture. There is no background job and no read-your-writes lag, so any solution that recomputes projections lazily on the next read fails the equality between the write response and the following read."
        test_recipe:
          setup: ["A conflict with an approved plan, on a project whose authority is exactly 29070000 so the execution consumes it completely."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 29070000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: "$.data.id" } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: "$.data.id" } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { share_in_issue_response: "$.data.final_state_share_pct" } }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: "$.data.version" } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: "$.data.id", ratio_in_create_response: "$.data.betterment_ratio", amount_in_create_response: "$.data.betterment_amount_cents" } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: "$.data.id" } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT" }, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/relocation-plans/${pl1}", payload: {}, as: AgreementOfficer, captures: { pl1v: "$.data.version" } }
          trigger:
            - { call: "POST /uro/agreements", payload: { plan_id: "${pl1}", expected_plan_version: "${pl1v}", not_to_exceed_cents: 45000000 }, as: AgreementOfficer, as_user_id: "officer-1", captures: { ag1: "$.data.id", a_basis: "$.data.cost_basis", a_eligible: "$.data.eligible_cost_cents", a_indirect: "$.data.indirect_cost_cents", a_betterment: "$.data.betterment_credit_cents", a_net: "$.data.net_allowable_cents", a_tier: "$.data.participation_tier_pct", a_state: "$.data.state_share_cents", a_owner: "$.data.owner_share_cents" } }
            - { call: "POST /uro/agreements/${ag1}/circulate", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/agreements/${ag1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1", captures: { e_exec: "$.data.execution_status", e_state_share: "$.data.state_share_cents" } }
            - { call: "GET /uro/projects/${p1}/clearance-summary", payload: {}, as: ProgramAdmin, captures: { post_ledger: "$.data.total_committed_reimbursement_cents", post_remaining: "$.data.remaining_authority_cents", post_posture: "$.data.clearance_posture" } }
          assert:
            - "${share_in_issue_response} == 100 in the issue response itself, not only on a later read of the determination"
            - "${ratio_in_create_response} == 0.360000 and ${amount_in_create_response} == 14400000 in the plan create response"
            - "the agreement create response already carries every stored settlement field: ${a_basis} == ESTIMATE_BASIS, ${a_eligible} == 40000000, ${a_indirect} == 5000000, ${a_betterment} == 14400000, ${a_net} == 30600000, ${a_tier} == 95, ${a_state} == 29070000, ${a_owner} == 1530000 (the gross figure G = 45000000 is an unstored intermediate equal to eligible + indirect)"
            - "${e_exec} == EXECUTED and ${e_state_share} == 29070000, identical to the create response"
            - "${post_ledger} == 29070000 and ${post_remaining} == 0 on the very next read, with no delay or retry"
            - "${post_posture} == CLEARANCE_PENDING, because rule 1 needs the ledger to EXCEED the authority and 29070000 is exactly equal to it"
            - "a second read of the same summary returns byte-identical figures, so nothing converges after the fact"
