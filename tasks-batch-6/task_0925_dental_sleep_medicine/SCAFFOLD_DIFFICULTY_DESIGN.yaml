  - rule_id: transitive_cascade
    instances:

      - name: lot_recall_cascade_depth_five
        grounds:
          - state_machines.ApplianceLot.ACTIVE_to_RECALL_ISSUED
          - state_machines.Appliance.device_hold_status.NONE_to_RECALL_HOLD
          - state_machines.TitrationVisit.SCHEDULED_to_VOIDED_BY_HOLD
          - state_machines.Appliance.lifecycle_status.IN_TITRATION_to_TITRATION_SUSPENDED
          - state_machines.EfficacyReport.DISPUTED_to_WITHDRAWN
          - state_machines.Claim.DRAFT_to_VOIDED
          - calculations.lot_remediation_progress
        distinguishing_aspect: |
          Five chained links from ONE trigger, each caused by the previous one and not by the lot
          recall directly: recall -> device hold on the appliance -> the hold voids the open titration
          visit -> the disappearance of the last open visit suspends the appliance's titration ->
          the suspension withdraws the disputed efficacy report -> the withdrawal voids the draft
          continued-use claim.
        test_recipe:
          setup:
            - "An appliance mid-titration (three applied visits, then plateau, then a PARTIAL efficacy report the physician disputed, which returned the appliance to IN_TITRATION)."
            - "One SCHEDULED titration visit and one DRAFT CONTINUED_USE claim outstanding on that appliance."
            - "The appliance's lot is ACTIVE and holds exactly one non-retired device."
