            - "${monv7} == 75000 and ${p_pre} == 75000  # one unpaid arrears charge"
            - "${r_pre} == 375  # aggregate_month_end: the single month-end 2026-08-31 sits strictly before 2026-09-20 with a balance of 75000, so round_half_up(75000 * 0.005) == 375"
