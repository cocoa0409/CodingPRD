    http_status: 422
    condition: "RECOURSE posted while the current logical date is still on or before remedy_deadline_on"
    applies_to: ["POST /pace/complaints/{id}/adjudicate"]
  - id: ERR_LICENSE_EXPIRED
    http_status: 422
    condition: "Contractor.license_expires_on <= the current logical date at enroll or reinstate"
    applies_to: ["POST /pace/contractors/{id}/enroll", "POST /pace/contractors/{id}/reinstate"]
  - id: ERR_TAX_YEAR_IN_PAST
    http_status: 422
    condition: "first_tax_year is before the tax year of the current logical date"
    applies_to: ["POST /pace/assessments"]
  - id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    condition: "Another application on the parcel has status NOT IN {DECLINED, WITHDRAWN, ASSESSED}"
    applies_to: ["POST /pace/applications"]
  - id: ERR_DUPLICATE_MEASURE_PRODUCT
    http_status: 409
    condition: "The application already has a measure for that product_id"
    applies_to: ["POST /pace/applications/{id}/measures"]
  - id: ERR_MEASURE_LIMIT_EXCEEDED
    http_status: 422
    condition: "The application already has 5 measures"
    applies_to: ["POST /pace/applications/{id}/measures"]
  - id: ERR_COMPLAINT_LIMIT_EXCEEDED
    http_status: 422
    condition: "The application already has 3 complaints"
