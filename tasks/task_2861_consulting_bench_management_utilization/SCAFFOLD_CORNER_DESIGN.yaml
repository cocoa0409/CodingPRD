        distinguishing_aspect: "On all five endpoints in priority 6's applies_to list, a Consultant caller authenticated as c1 is refused c2's data with 403 ERR_NOT_RESOURCE_OWNER — including the nested period detail read and the PATCH of a foreign assertion, which are refused even though the rows exist and the role is on the endpoint."
        test_recipe:
