              as: Merchandiser
              captures: { price: $.data.base_price_cents_per_cwt, ver: $.data.version }
          assert:
            - "captured err == ERR_STALE_CONTRACT_VERSION (412) for the stale amend"
            - "captured price == 1550 and captured ver == 3 after the fresh amend"

      - name: contract_amend_blocked_after_fulfillment
        claim_type: conditional_feature_flags
        grounds: ["errors[ERR_CONTRACT_HAS_DELIVERIES]", "state_machines.DeliveryContract"]
        distinguishing_aspect: "Once any linked lot is graded (fulfilled_cwt > 0), both cancel and amend are blocked with ERR_CONTRACT_HAS_DELIVERIES even with the correct OCC version."
        test_recipe:
          setup: ["season INTAKE_OPEN; contract 400.00; contract lot graded dry 100.00 (fulfilled 100.00)"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
              as: MillAdmin
              captures: { s_id: $.data.id }
