      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; apprentice AX advanced ENROLLED -> QUALIFIED via 50 logged trips; O1 BOOKED
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
