# =============================================================================
# Flight School & Pilot Training — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Flight School & Pilot Training: student enrollment & medical/TSA clearance,
  aircraft & instructor scheduling, lesson/syllabus & flight-hour logging,
  Hobbs/Tach billing & block-time deposit, checkride/stage-check milestones,
  maintenance squawk grounding, rental dispatch, endorsement

domain_name: flight-school-pilot-training
api_prefix: /flight-school

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Flat: peer entities linked by foreign keys (no nested URL ownership). Every
  # business entity is a top-level collection under /flight-school; relationships
  # are expressed via FK body fields and resolved by filtered-list GETs.

  state_machine_shape: parallel
  # The package spans multiple non-linear shapes: Aircraft is cyclic
  # (AVAILABLE<->GROUNDED), StageCheck is cyclic (FAILED->SCHEDULED retry loop),
  # Enrollment carries two parallel independent clearance dimensions
  # (medical_status x tsa_status) layered over its lifecycle status, and Booking
  # is branching-with-revert.

  relationship_patterns:
    - one_to_many        # Student 1—* Enrollment, Aircraft 1—* Squawk, etc.
    - cross_aggregate    # Booking references Aircraft + Instructor + Enrollment
    - self_referential   # StageCheck.retry_of_stage_check_id -> StageCheck.id

  role_model: peer_roles
  # Student / Instructor own different resource surfaces; Dispatcher, Mechanic,
  # and SchoolAdmin are operational roles. SchoolAdmin has the widest surface but
  # the model is peer-oriented, not a strict superset hierarchy.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Student
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Student email (unique)" }
      - { name: deposit_balance_cents, type: integer, source: computed, default: 0, description: "Available block-time deposit funds in cents = sum(deposits) - sum(held) - sum(consumed)" }
      - { name: deposit_held_cents, type: integer, source: computed, default: 0, description: "Provisional holds placed against in-flight DISPATCHED bookings, in cents" }
      - { name: deposit_consumed_cents, type: integer, source: computed, default: 0, description: "Funds finalized against POSTED flight logs, in cents" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of bookings transitioned to NO_SHOW for this student" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED when no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD", constraints: "ACTIVE, SUSPENDED" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Certified Flight Instructor full name" }
      - { name: email, type: string, source: input, description: "Instructor email (unique)" }
      - { name: cfi_rate_cents_per_hour, type: integer, source: input, description: "Instructor billing rate in cents per logged Hobbs hour" }
      - { name: authorized_endorsement_codes, type: array, source: input, description: "Endorsement codes this CFI is authorized to issue (e.g. SOLO, XC, COMPLEX, TAILWHEEL)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "ACTIVE, INACTIVE" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Registration / tail number (unique)" }
      - { name: model, type: string, source: input, description: "Aircraft model (e.g. C172, PA28)" }
      - { name: is_complex, type: boolean, source: input, default: false, description: "Complex aircraft flag — drives surcharge tier in booking_cost_estimate" }
      - { name: rental_rate_cents_per_hour, type: integer, source: input, description: "Wet rental rate in cents per billed hour" }
      - { name: billing_basis, type: enum, source: input, description: "HOBBS | TACH — which meter is used to bill flight time", constraints: "HOBBS, TACH" }
      - { name: current_hobbs, type: number, source: computed, description: "Current Hobbs meter reading; advances only on flight-log POST. Initialized from initial_hobbs at creation." }
      - { name: current_tach, type: number, source: computed, description: "Current Tach meter reading; advances only on flight-log POST. Initialized from initial_tach at creation." }
      - { name: initial_hobbs, type: number, source: input, description: "Hobbs meter at aircraft onboarding" }
      - { name: initial_tach, type: number, source: input, description: "Tach meter at aircraft onboarding" }
      - { name: open_squawk_count, type: integer, source: computed, default: 0, description: "Number of Squawks in OPEN status for this aircraft" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | GROUNDED | RETIRED — GROUNDED while any grounding squawk is OPEN", constraints: "AVAILABLE, GROUNDED, RETIRED" }

  - name: Syllabus
    parent: null
    common_fields: false   # configuration entity: id + created_at only, immutable
    fields:
      - { name: name, type: string, source: input, description: "Syllabus / program name (e.g. PRIVATE_PILOT)" }
      - { name: required_dual_hours, type: number, source: input, description: "Total dual-instruction Hobbs hours required to complete" }
      - { name: required_solo_hours, type: number, source: input, description: "Total solo Hobbs hours required to complete" }
      - { name: stage_count, type: integer, source: input, description: "Number of ordered stage checks in this syllabus" }
      - { name: min_deposit_cents, type: integer, source: input, description: "Minimum block-time deposit (cents) required before an enrollment may be ACTIVE" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: syllabus_id, type: string, source: input, description: "FK -> Syllabus.id" }
      - { name: medical_status, type: enum, source: system, default: PENDING, description: "Parallel clearance axis: PENDING | CLEARED | EXPIRED", constraints: "PENDING, CLEARED, EXPIRED" }
      - { name: medical_expiry_date, type: datetime, source: computed, required: false, description: "ISO date the FAA medical clearance lapses; set when medical is recorded CLEARED" }
      - { name: tsa_status, type: enum, source: system, default: PENDING, description: "Parallel clearance axis: PENDING | CLEARED | DENIED", constraints: "PENDING, CLEARED, DENIED" }
      - { name: logged_dual_hours, type: number, source: computed, default: 0, description: "Sum of POSTED dual flight-log billed hours for this enrollment" }
      - { name: logged_solo_hours, type: number, source: computed, default: 0, description: "Sum of POSTED solo flight-log billed hours for this enrollment" }
      - { name: current_stage_index, type: integer, source: computed, default: 1, description: "1-based index of the next stage check to attempt" }
      - { name: status, type: enum, source: system, description: "PENDING_CLEARANCE | ACTIVE | SUSPENDED | COMPLETED | WITHDRAWN", constraints: "PENDING_CLEARANCE, ACTIVE, SUSPENDED, COMPLETED, WITHDRAWN" }

  - name: DepositTransaction
    parent: null
    common_fields: false   # append-only ledger event: id + created_at only
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: txn_type, type: enum, source: system, description: "DEPOSIT | HOLD | RELEASE | CONSUME — ledger entry kind", constraints: "DEPOSIT, HOLD, RELEASE, CONSUME" }
      - { name: amount_cents, type: integer, source: input, description: "Signed-magnitude amount in cents (always positive; txn_type fixes the sign convention)" }
      - { name: booking_id, type: string, source: system, required: false, description: "FK -> Booking.id; set on HOLD/RELEASE/CONSUME entries that originate from a booking" }
      - { name: flight_log_id, type: string, source: system, required: false, description: "FK -> FlightLog.id; set on CONSUME entries that finalize a posted flight" }
      - { name: memo, type: string, source: input, required: false, description: "Optional memo for DEPOSIT entries" }

  - name: Squawk
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: description, type: string, source: input, description: "Maintenance defect description" }
      - { name: is_grounding, type: boolean, source: input, description: "True if this defect grounds the aircraft until resolved" }
      - { name: reported_by_instructor_id, type: string, source: input, required: false, description: "FK -> Instructor.id; instructor who reported it (omitted when reported by mechanic)" }
      - { name: status, type: enum, source: system, description: "OPEN | DEFERRED | RESOLVED — DEFERRED is a non-grounding hold; RESOLVED can reopen", constraints: "OPEN, DEFERRED, RESOLVED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: instructor_id, type: string, source: input, required: false, description: "FK -> Instructor.id; null for a SOLO rental dispatch" }
      - { name: lesson_type, type: enum, source: input, description: "DUAL | SOLO — DUAL requires an instructor; SOLO requires a valid SOLO endorsement", constraints: "DUAL, SOLO" }
      - { name: start_at, type: datetime, source: input, description: "Reservation window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Reservation window end (ISO 8601 UTC); window is half-open [start_at, end_at)" }
      - { name: estimated_hours, type: number, source: input, description: "Planned billable hours used to size the provisional deposit hold" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Output of booking_cost_estimate; the provisional hold amount" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | DISPATCHED | COMPLETED | CANCELLED | NO_SHOW", constraints: "REQUESTED, CONFIRMED, DISPATCHED, COMPLETED, CANCELLED, NO_SHOW" }

  - name: FlightLog
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; copied from the booking" }
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; copied from the booking" }
      - { name: instructor_id, type: string, source: system, required: false, description: "FK -> Instructor.id; copied from the booking (null for SOLO)" }
      - { name: hobbs_start, type: number, source: input, description: "Hobbs reading at engine start; MUST equal aircraft.current_hobbs at POST" }
      - { name: hobbs_end, type: number, source: input, description: "Hobbs reading at shutdown; MUST be strictly > hobbs_start" }
      - { name: tach_start, type: number, source: input, description: "Tach reading at engine start; MUST equal aircraft.current_tach at POST" }
      - { name: tach_end, type: number, source: input, description: "Tach reading at shutdown; MUST be strictly > tach_start" }
      - { name: landings, type: integer, source: input, description: "Number of landings (>= 1)" }
      - { name: billed_hours, type: number, source: computed, description: "Meter delta rounded to tenths per flight_charge; basis chosen by aircraft.billing_basis" }
      - { name: aircraft_charge_cents, type: integer, source: computed, description: "Aircraft rental portion of the flight charge in cents" }
      - { name: instructor_charge_cents, type: integer, source: computed, default: 0, description: "Instructor portion of the flight charge in cents (0 for SOLO)" }
      - { name: total_charge_cents, type: integer, source: computed, description: "aircraft_charge_cents + instructor_charge_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | VOID — POSTED finalizes billing and advances meters", constraints: "DRAFT, POSTED, VOID" }

  - name: StageCheck
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: examiner_instructor_id, type: string, source: input, description: "FK -> Instructor.id; the CFI conducting the stage check" }
      - { name: stage_index, type: integer, source: input, description: "1-based stage number within the syllabus" }
      - { name: retry_of_stage_check_id, type: string, source: input, required: false, description: "FK -> StageCheck.id; set when this is a retry of a FAILED stage check" }
      - { name: result_note, type: string, source: input, required: false, description: "Examiner note recorded on PASS/FAIL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | PASSED | FAILED — FAILED reschedules into a new SCHEDULED retry", constraints: "SCHEDULED, IN_PROGRESS, PASSED, FAILED" }

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; issuing CFI" }
      - { name: endorsement_code, type: enum, source: input, description: "SOLO | XC | COMPLEX | TAILWHEEL", constraints: "SOLO, XC, COMPLEX, TAILWHEEL" }
      - { name: status, type: enum, source: system, description: "VALID | REVOKED", constraints: "VALID, REVOKED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Aircraft: CYCLIC (AVAILABLE <-> GROUNDED) -----------------------------
  - entity: Aircraft
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: GROUNDED
        trigger: "system (automatic when a grounding Squawk transitions to OPEN on this aircraft)"
        actor: system
        preconditions:
          - "open_squawk_count of grounding squawks becomes >= 1"
        side_effects:
          - "increments Aircraft.version by 1"
          - "CASCADE: every Booking on this aircraft in REQUESTED or CONFIRMED -> CANCELLED (drives Booking cancel side-effects, including deposit hold release for CONFIRMED bookings)"
        note: "Grounding is automatic; see Squawk OPEN transition trigger."

      - from: GROUNDED
        to: AVAILABLE
        trigger: "system (automatic when the last OPEN grounding Squawk transitions to RESOLVED or DEFERRED)"
        actor: system
        preconditions:
          - "open_squawk_count of grounding squawks returns to 0"
        side_effects:
          - "increments Aircraft.version by 1"
        note: "Completes the AVAILABLE<->GROUNDED cycle."

      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /flight-school/aircraft/{aircraftId}/retire"
        actor: SchoolAdmin
        preconditions:
          - "Aircraft must be AVAILABLE; a GROUNDED or already-RETIRED aircraft cannot be retired (ERR_AIRCRAFT_NOT_AVAILABLE)"
          - "No Booking on this aircraft in REQUESTED, CONFIRMED, or DISPATCHED (ERR_AIRCRAFT_HAS_ACTIVE_BOOKINGS)"
        side_effects:
          - "increments Aircraft.version by 1"

  # ---- Squawk: drives the aircraft cycle -------------------------------------
  - entity: Squawk
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /flight-school/squawks/{squawkId}/resolve"
        actor: Mechanic
        preconditions:
          - "Squawk must be OPEN or DEFERRED (ERR_SQUAWK_NOT_RESOLVABLE)"
        side_effects:
          - "decrements Aircraft.open_squawk_count if was grounding and OPEN"
          - "CASCADE: if this was the last OPEN grounding squawk, Aircraft GROUNDED -> AVAILABLE"

      - from: OPEN
        to: DEFERRED
        trigger: "POST /flight-school/squawks/{squawkId}/defer"
        actor: Mechanic
        preconditions:
          - "Squawk must be OPEN (ERR_SQUAWK_NOT_OPEN)"
          - "Squawk must not be grounding (ERR_GROUNDING_SQUAWK_NOT_DEFERRABLE)"
        side_effects: []

      - from: RESOLVED
        to: OPEN
        trigger: "POST /flight-school/squawks/{squawkId}/reopen"
        actor: Mechanic
        preconditions:
          - "Squawk must be RESOLVED (ERR_SQUAWK_NOT_REOPENABLE)"
        side_effects:
          - "increments Aircraft.open_squawk_count if grounding"
          - "CASCADE: if grounding and aircraft AVAILABLE, Aircraft AVAILABLE -> GROUNDED (which itself cascades booking cancellations)"
        note: "Reopen closes the OPEN->RESOLVED->OPEN cycle on Squawk."

      - from: DEFERRED
        to: OPEN
        trigger: "POST /flight-school/squawks/{squawkId}/reopen"
        actor: Mechanic
        preconditions:
          - "Squawk must be DEFERRED (ERR_SQUAWK_NOT_REOPENABLE)"
        side_effects: []

  # ---- Enrollment: PARALLEL clearance dimensions over a lifecycle ------------
  - entity: Enrollment
    initial_state: PENDING_CLEARANCE
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: PENDING_CLEARANCE
        to: ACTIVE
        trigger: "POST /flight-school/enrollments/{enrollmentId}/activate"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment must be PENDING_CLEARANCE or SUSPENDED (ERR_ENROLLMENT_NOT_PENDING_OR_SUSPENDED)"
          - "medical_status == CLEARED (ERR_MEDICAL_NOT_CLEARED)"
          - "tsa_status == CLEARED (ERR_TSA_NOT_CLEARED)"
          - "Student.deposit_balance_cents >= syllabus.min_deposit_cents (ERR_DEPOSIT_BELOW_MINIMUM)"
        side_effects: []
        note: "Lifecycle gate requires BOTH parallel clearance axes CLEARED."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /flight-school/enrollments/{enrollmentId}/suspend  OR  system (no_show_strikes cascade, medical EXPIRED)"
        actor: SchoolAdmin | system
        preconditions:
          - "For the explicit suspend endpoint: Enrollment must be ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE_FOR_SUSPEND)"
        side_effects:
          - "CASCADE: every Booking on this enrollment in REQUESTED or CONFIRMED -> CANCELLED (releasing deposit holds for CONFIRMED bookings)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /flight-school/enrollments/{enrollmentId}/activate"
        actor: SchoolAdmin
        preconditions:
          - "medical_status == CLEARED (ERR_MEDICAL_NOT_CLEARED)"
          - "tsa_status == CLEARED (ERR_TSA_NOT_CLEARED)"
          - "Student.no_show_strikes < NO_SHOW_SUSPEND_THRESHOLD (ERR_STUDENT_SUSPENDED)"
          - "Student.deposit_balance_cents >= syllabus.min_deposit_cents (ERR_DEPOSIT_BELOW_MINIMUM)"
        side_effects: []

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /flight-school/enrollments/{enrollmentId}/complete"
        actor: SchoolAdmin
        preconditions:
          - "logged_dual_hours >= syllabus.required_dual_hours (ERR_HOURS_NOT_MET)"
          - "logged_solo_hours >= syllabus.required_solo_hours (ERR_HOURS_NOT_MET)"
          - "current_stage_index > syllabus.stage_count, i.e. all stage checks PASSED (ERR_STAGES_NOT_PASSED)"
          - "No Booking on this enrollment in REQUESTED, CONFIRMED, or DISPATCHED (ERR_ENROLLMENT_HAS_ACTIVE_BOOKINGS)"
        side_effects: []

      - from: PENDING_CLEARANCE
        to: WITHDRAWN
        trigger: "POST /flight-school/enrollments/{enrollmentId}/withdraw"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "CASCADE: every Booking on this enrollment in REQUESTED or CONFIRMED -> CANCELLED"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /flight-school/enrollments/{enrollmentId}/withdraw"
        actor: SchoolAdmin
        preconditions: []
        side_effects:
          - "CASCADE: every Booking on this enrollment in REQUESTED or CONFIRMED -> CANCELLED"

      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /flight-school/enrollments/{enrollmentId}/withdraw"
        actor: SchoolAdmin
        preconditions: []
        side_effects: []

  # ---- Booking: BRANCHING with revert ---------------------------------------
  - entity: Booking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /flight-school/bookings/{bookingId}/confirm"
        actor: Dispatcher
        preconditions:
          - "Booking must be REQUESTED (ERR_BOOKING_NOT_REQUESTED)"
          - "Aircraft.status == AVAILABLE (ERR_AIRCRAFT_GROUNDED)"
          - "No half-open [start_at, end_at) overlap with another REQUESTED/CONFIRMED/DISPATCHED booking on the same aircraft (ERR_AIRCRAFT_TIME_CONFLICT)"
          - "If DUAL: no instructor booking within INSTRUCTOR_BUFFER_MINUTES of [start_at, end_at] on the same instructor (ERR_INSTRUCTOR_TIME_CONFLICT)"
          - "Student.deposit_balance_cents >= estimated_cost_cents (ERR_INSUFFICIENT_DEPOSIT)"
        side_effects:
          - "DepositTransaction HOLD for estimated_cost_cents -> Student.deposit_held_cents += estimated_cost_cents, deposit_balance_cents -= estimated_cost_cents"

      - from: CONFIRMED
        to: DISPATCHED
        trigger: "POST /flight-school/bookings/{bookingId}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Booking must be CONFIRMED (ERR_BOOKING_NOT_CONFIRMED)"
          - "Aircraft.status == AVAILABLE (ERR_AIRCRAFT_GROUNDED)"
          - "Enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "Enrollment.medical_status == CLEARED (ERR_MEDICAL_NOT_CLEARED)"
          - "If lesson_type == SOLO: a VALID SOLO Endorsement exists for the enrollment (ERR_SOLO_ENDORSEMENT_MISSING)"
        side_effects: []
        note: "Hold already placed at confirm; dispatch just releases the aircraft for the flight."

      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (automatic when a FlightLog for this booking transitions to POSTED)"
        actor: system
        preconditions:
          - "Booking must be DISPATCHED (ERR_BOOKING_NOT_DISPATCHED)"
        side_effects:
          - "CASCADE: hold reconciled -> RELEASE the estimated hold, CONSUME total_charge_cents (see deposit_settlement)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /flight-school/bookings/{bookingId}/cancel  OR  system cascade (aircraft grounded, enrollment suspended/withdrawn)"
        actor: Student | Dispatcher | system
        preconditions:
          - "For the explicit cancel endpoint: Booking must be REQUESTED or CONFIRMED; a terminal booking (COMPLETED/CANCELLED/NO_SHOW) cannot be cancelled (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /flight-school/bookings/{bookingId}/cancel  OR  system cascade (aircraft grounded, enrollment suspended/withdrawn)"
        actor: Student | Dispatcher | system
        preconditions: []
        side_effects:
          - "DepositTransaction RELEASE for estimated_cost_cents -> Student.deposit_held_cents -= estimated_cost_cents, deposit_balance_cents += estimated_cost_cents"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /flight-school/bookings/{bookingId}/no-show"
        actor: Dispatcher
        preconditions:
          - "Booking must be CONFIRMED (ERR_BOOKING_NOT_CONFIRMED)"
        side_effects:
          - "DepositTransaction RELEASE for estimated_cost_cents -> hold released back to balance"
          - "Student.no_show_strikes += 1"
          - "CASCADE: if Student.no_show_strikes >= NO_SHOW_SUSPEND_THRESHOLD and Enrollment.status == ACTIVE -> Enrollment ACTIVE -> SUSPENDED (which itself cancels other open bookings)"

  # ---- FlightLog: DRAFT -> POSTED / VOID ------------------------------------
  - entity: FlightLog
    initial_state: DRAFT
    terminal_states: [POSTED, VOID]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /flight-school/flight-logs/{flightLogId}/post"
        actor: Instructor | Dispatcher
        preconditions:
          - "FlightLog must be DRAFT (ERR_FLIGHT_LOG_NOT_DRAFT)"
          - "Booking.status == DISPATCHED (ERR_BOOKING_NOT_DISPATCHED)"
          - "hobbs_end > hobbs_start and tach_end > tach_start (ERR_INVALID_METER_READING)"
          - "hobbs_start == aircraft.current_hobbs and tach_start == aircraft.current_tach (ERR_METER_DISCONTINUITY)"
          - "Student.deposit_balance_cents + Booking.estimated_cost_cents >= total_charge_cents (ERR_INSUFFICIENT_DEPOSIT)"
        side_effects:
          - "compute billed_hours, aircraft_charge_cents, instructor_charge_cents, total_charge_cents (flight_charge)"
          - "deposit_settlement: RELEASE estimated_cost_cents hold, CONSUME total_charge_cents -> deposit_held_cents -= estimated, deposit_consumed_cents += total, deposit_balance_cents += (estimated - total)"
          - "advance Aircraft.current_hobbs = hobbs_end, current_tach = tach_end (increments Aircraft.version by 1)"
          - "Enrollment.logged_dual_hours or logged_solo_hours += billed_hours per lesson_type"
          - "CASCADE: Booking DISPATCHED -> COMPLETED"

      - from: DRAFT
        to: VOID
        trigger: "POST /flight-school/flight-logs/{flightLogId}/void"
        actor: Dispatcher
        preconditions:
          - "FlightLog must be DRAFT (ERR_FLIGHT_LOG_NOT_DRAFT)"
        side_effects: []

  # ---- StageCheck: CYCLIC (FAILED -> SCHEDULED retry loop) -------------------
  - entity: StageCheck
    initial_state: SCHEDULED
    terminal_states: [PASSED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /flight-school/stage-checks/{stageCheckId}/begin"
        actor: Instructor
        preconditions:
          - "StageCheck must be SCHEDULED (ERR_STAGE_CHECK_NOT_SCHEDULED)"
          - "Enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "stage_index == enrollment.current_stage_index (ERR_STAGE_OUT_OF_ORDER)"
        side_effects: []

      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /flight-school/stage-checks/{stageCheckId}/pass"
        actor: Instructor
        preconditions:
          - "StageCheck must be IN_PROGRESS (ERR_STAGE_CHECK_NOT_IN_PROGRESS)"
        side_effects:
          - "Enrollment.current_stage_index += 1"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /flight-school/stage-checks/{stageCheckId}/fail"
        actor: Instructor
        preconditions:
          - "StageCheck must be IN_PROGRESS (ERR_STAGE_CHECK_NOT_IN_PROGRESS)"
        side_effects:
          - "current_stage_index unchanged; a retry StageCheck may be created with retry_of_stage_check_id pointing here"
        note: "FAILED is non-terminal; the loop closes when a retry SCHEDULED is created against this FAILED check."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-aircraft
    parent_entity: Aircraft
    write_endpoint: "POST /flight-school/bookings"
    occ_field: "expected_aircraft_version"
    description: |
      Each successful Booking create claims a slice of the aircraft's schedule and
      advances Aircraft.version by 1. Creating a Booking against an Aircraft whose
      version has advanced since the client last observed it is rejected: the
      client carries expected_aircraft_version equal to the version it last read,
      and if another writer has already created a booking on that aircraft (or the
      aircraft was grounded, both of which advanced the version), the current
      writer's view is stale. The loser's create is rejected so two strictly
      sequential creates carrying the same observed version cannot both succeed.
    error_id: ERR_STALE_AIRCRAFT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_cost_estimate
    trigger: "Booking creation (POST /flight-school/bookings); recomputed never after create"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial: >=3 inputs (aircraft rate, instructor rate, estimated_hours,
      # is_complex, lesson_type) with conditional branches and a tiered surcharge.
      # 1. base_hours = estimated_hours
      # 2. aircraft_portion_cents = round_half_up(aircraft.rental_rate_cents_per_hour * base_hours)
      # 3. if lesson_type == DUAL: instructor_portion_cents =
      #        round_half_up(instructor.cfi_rate_cents_per_hour * base_hours)
      #    else (SOLO): instructor_portion_cents = 0
      # 4. complexity surcharge tier (applied only to the aircraft portion):
      #        if aircraft.is_complex == false: surcharge_pct = 0.00
      #        elif base_hours <= COMPLEX_TIER1_HOURS (2.0): surcharge_pct = 0.10
      #        else: surcharge_pct = 0.15
      #    surcharge_cents = round_half_up(aircraft_portion_cents * surcharge_pct)
      # 5. estimated_cost_cents = aircraft_portion_cents + surcharge_cents + instructor_portion_cents
    input_set: "The single Booking being created plus its referenced Aircraft and (for DUAL) Instructor."
    constants:
      COMPLEX_TIER1_HOURS: 2.0
      COMPLEX_TIER1_PCT: 0.10
      COMPLEX_TIER2_PCT: 0.15
    precision: "Each round_half_up rounds a (rate * hours) product to whole cents BEFORE summing portions; portions are summed last (round-then-sum). 2 decimal hours."
    variants: []

  - name: flight_charge
    trigger: "FlightLog POST (POST /flight-school/flight-logs/{flightLogId}/post)"
    algorithm: tiered_pricing
    formula: |
      # billed_hours depends on the aircraft's billing_basis (dual-variant).
      # Rounding order is PINNED: round the meter delta to tenths FIRST, then
      # multiply by the rate, then round the product to whole cents.
      # 1. if aircraft.billing_basis == HOBBS:
      #        raw_delta = hobbs_end - hobbs_start
      #    else (TACH):
      #        raw_delta = tach_end - tach_start
      # 2. billed_hours = round_half_up(raw_delta, 1)            # tenths first
      # 3. aircraft_charge_cents = round_half_up(aircraft.rental_rate_cents_per_hour * billed_hours)   # then to cents
      # 4. if booking.lesson_type == DUAL:
      #        instructor_charge_cents = round_half_up(instructor.cfi_rate_cents_per_hour * billed_hours)
      #    else: instructor_charge_cents = 0
      # 5. total_charge_cents = aircraft_charge_cents + instructor_charge_cents
    input_set: "The single FlightLog being posted plus its Aircraft and (for DUAL) Instructor."
    constants:
      HOURS_ROUNDING_PLACES: 1
    precision: "round_half_up; meter delta -> tenths, then cents (round-then-multiply-then-round; NOT round at the cent level on the raw product)."
    variants:
      - name: hobbs_basis
        when: "aircraft.billing_basis == HOBBS"
        difference: "billed_hours derived from hobbs_end - hobbs_start (engine-running clock; larger delta than tach)."
      - name: tach_basis
        when: "aircraft.billing_basis == TACH"
        difference: "billed_hours derived from tach_end - tach_start (rpm-scaled clock; smaller delta), producing a different charge for the identical flight."

  - name: deposit_settlement
    trigger: "Booking confirm (HOLD), Booking cancel/no-show (RELEASE), FlightLog POST (RELEASE estimate + CONSUME actual)"
    algorithm: waterfall_allocation
    formula: |
      # Dual-variant settlement on the Student deposit ledger (DIFFERENT entity
      # domain than flight_charge, which is on FlightLog/Aircraft).
      # PROVISIONAL variant (at booking confirm): hold the ESTIMATE.
      #   HOLD amount = booking.estimated_cost_cents
      #   deposit_held_cents += amount; deposit_balance_cents -= amount
      # FINAL variant (at flight-log POST): release the estimate, consume the actual.
      #   RELEASE = booking.estimated_cost_cents -> deposit_held_cents -= RELEASE
      #   CONSUME = flight_log.total_charge_cents -> deposit_consumed_cents += CONSUME
      #   deposit_balance_cents += (RELEASE - CONSUME)   # net adjustment, may be +/-
      # CONSERVATION INVARIANT (always, after any settlement):
      #   deposit_balance_cents
      #     = sum(DEPOSIT.amount) - sum(HOLD.amount) + sum(RELEASE.amount) - sum(CONSUME.amount)
      #   deposit_held_cents     = sum(HOLD.amount) - sum(RELEASE.amount)
      #   deposit_consumed_cents = sum(CONSUME.amount)
    input_set: "All DepositTransaction rows for the student (txn_type in {DEPOSIT, HOLD, RELEASE, CONSUME})."
    constants: {}
    precision: "Integer cents; no rounding (all ledger amounts already in whole cents)."
    variants:
      - name: provisional_hold
        when: "Booking REQUESTED -> CONFIRMED"
        difference: "Holds booking.estimated_cost_cents (the estimate), not the actual flight charge."
      - name: final_consume
        when: "FlightLog DRAFT -> POSTED"
        difference: "Releases the held estimate and consumes flight_log.total_charge_cents (the actual), reconciling the estimate/actual delta against deposit_balance_cents."

  - name: hobbs_meter_conservation
    trigger: "FlightLog POST"
    algorithm: aggregation
    formula: |
      # Aircraft hour ledger (conserved physical quantity, distinct from money).
      # On every POST: aircraft.current_hobbs := hobbs_end, aircraft.current_tach := tach_end.
      # INVARIANT: aircraft.current_hobbs
      #   = aircraft.initial_hobbs + sum(hobbs_end - hobbs_start) over POSTED flight logs for the aircraft (chronological by created_at ASC, tie-break created_at ASC).
      # A DRAFT or VOID flight log contributes 0. Meter never moves backward
      # (guaranteed by the ERR_METER_DISCONTINUITY precondition on POST).
    input_set: "All FlightLog rows for the aircraft with status == POSTED, ordered by created_at ASC."
    constants: {}
    precision: "Meter values carried to 1 decimal; deltas summed exactly."
    variants: []

  - name: enrollment_hours_rollup
    trigger: "FlightLog POST (recompute logged hours), enrollment completion check"
    algorithm: aggregation
    formula: |
      logged_dual_hours = sum(billed_hours for POSTED FlightLogs where booking.lesson_type == DUAL and flight_log.enrollment_id == enrollment.id)
      logged_solo_hours = sum(billed_hours for POSTED FlightLogs where booking.lesson_type == SOLO and flight_log.enrollment_id == enrollment.id)
    input_set: "POSTED FlightLogs for the enrollment, partitioned by booking.lesson_type."
    constants: {}
    precision: "Hours carried to 1 decimal; summed exactly."
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers in range (landings >= 1, hours > 0, amount_cents > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: concurrency
    check: "On booking create, the required expected_aircraft_version must equal Aircraft.version"
    error_id: ERR_STALE_AIRCRAFT_VERSION
    http_status: 412
    applies_to: "POST /flight-school/bookings"
    note: "OCC check runs after existence (priority 3) and request-shape (priority 4) but before business validation; see §1.2.1. A successful create bumps Aircraft.version."

  - priority: 6
    category: state
    check: "Target resource in the correct state for the requested transition"
    error_id: "ERR_*_NOT_* (e.g. ERR_BOOKING_NOT_REQUESTED, ERR_FLIGHT_LOG_NOT_DRAFT, ERR_STAGE_CHECK_NOT_SCHEDULED)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Aircraft must be AVAILABLE for booking confirm and dispatch; a GROUNDED aircraft blocks both"
    error_id: ERR_AIRCRAFT_GROUNDED
    http_status: 409
    applies_to: "POST .../bookings/{id}/confirm, POST .../bookings/{id}/dispatch"

  - priority: 8
    category: business_safety
    check: "Enrollment must be ACTIVE with medical CLEARED to dispatch; SOLO requires a VALID SOLO endorsement"
    error_id: "ERR_ENROLLMENT_NOT_ACTIVE / ERR_MEDICAL_NOT_CLEARED / ERR_SOLO_ENDORSEMENT_MISSING"
    http_status: 409
    applies_to: "POST .../bookings/{id}/dispatch"

  - priority: 9
    category: business_temporal
    check: "No half-open [start_at, end_at) overlap with another live booking on the same aircraft"
    error_id: ERR_AIRCRAFT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST .../bookings/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "For DUAL, no instructor booking within INSTRUCTOR_BUFFER_MINUTES of the requested window (closed interval + buffer)"
    error_id: ERR_INSTRUCTOR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST .../bookings/{id}/confirm"

  - priority: 11
    category: business_referential
    check: "An instructor may only issue an Endorsement whose endorsement_code is in their authorized_endorsement_codes"
    error_id: ERR_ENDORSEMENT_NOT_AUTHORIZED
    http_status: 403
    applies_to: "POST /flight-school/endorsements"

  - priority: 12
    category: business_fiscal
    check: "Sufficient deposit: balance >= estimated_cost_cents at confirm; balance + held estimate >= total_charge_cents at flight-log post; balance >= syllabus.min_deposit_cents at enrollment activate"
    error_id: "ERR_INSUFFICIENT_DEPOSIT / ERR_DEPOSIT_BELOW_MINIMUM"
    http_status: 402
    applies_to: "POST .../bookings/{id}/confirm, POST .../flight-logs/{id}/post, POST .../enrollments/{id}/activate"

