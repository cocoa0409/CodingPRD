# =============================================================================
# Task 2304 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules × 2-3 instances each = 23 instances.
# Every `grounds` ref resolves into SCAFFOLD.yaml §1.1–§1.7. Every test_recipe is
# a transcribable prototype: literal payloads, ${var} only for ids produced by an
# earlier call, and asserts pre-computed to literal values.
# Logical clock default at startup: 2026-08-01T00:00:00Z (all fixtures move it forward).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: penalty_projection_accrued_vs_statutory_maximum
        grounds:
          - calculations.penalty_exposure_projection
          - calculations.penalty_accrual_posting
          - calculations.penalty_ledger_balance
          - endpoints["GET /compliance/plan-years/{id}/penalty-projection"]
          - state_machines.ServiceProviderContract.IN_REVIEW_to_NON_COMPLIANT
        distinguishing_aspect: |
          Both variants read the identical open-deficiency set and identical size_multiplier and
          differ ONLY in the day-count endpoint: accrued_to_date counts onset..as_of_date (11 days
          -> 330000) while statutory_maximum counts onset..PlanYear.end_date (175 days -> 5250000).
          Neither equals the posted ledger balance (30000), so an implementation that reuses the
          ledger figure, or reuses one variant for the other, is detected by three distinct numbers
          from one request.
        test_recipe:
          setup:
            - "Logical clock at 2027-07-10T08:00:00Z."
            - "PlanYear PY2027 (2027-01-01..2027-12-31), covered_lives 6000 -> size_multiplier 2.0, attestation deadline 2028-01-31, RxDC deadline 2028-06-01, lifecycle ACTIVE."
            - "One TPA ServiceProviderContract, reviewed and escalated on 2027-07-10, so gag_review_status is NON_COMPLIANT with gag_non_compliant_since 2027-07-10."
            - "Exactly one PenaltyLedgerEntry exists: a GAG_CLAUSE ACCRUAL of 30000 cents (15000 * 1 day * 2.0) posted by the escalation."
            - "PlanYear.deficiency_points is 6 and compliance_posture is DEFICIENT."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-07-10T08:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 2 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/escalate-gag"
              payload: { escalation_note: "Vendor refuses to strike the quality-data redisclosure bar." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /compliance/plan-years/${py}/penalty-projection"
              payload: { as_of_date: "2027-07-20" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response data.accrued_to_date_cents == 330000"
            - "response data.statutory_maximum_cents == 5250000"
            - "response data.open_deficiency_count == 1"
            - "response data.size_multiplier == 2.0"
            - "GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 30000 (the ledger is unchanged by the projection)"
            - "GET /compliance/plan-years/${py} -> data.compliance_posture == \"DEFICIENT\" and data.deficiency_points == 6"

      - name: compensation_variant_broker_total_vs_consultant_direct
        grounds:
          - calculations.compensation_reasonableness_score
          - entities.CompensationDisclosure.fields.variant_applied
          - entities.ServiceProviderContract.fields.compensation_disclosure_required
          - state_machines.CompensationDisclosure.RECEIVED_to_REASONABLE
          - state_machines.CompensationDisclosure.RECEIVED_to_UNREASONABLE
        distinguishing_aspect: |
          Two disclosures carry byte-identical inputs (direct 1000000, indirect 400000, benchmark
          1000000, scope 5, completeness 4); the parent contract_type alone selects the variant, and
          the divergence is large enough to flip the terminal state: BROKER -> TOTAL_WITH_INDIRECT ->
          67.67 -> UNREASONABLE, CONSULTANT -> DIRECT_ONLY -> 51.67 -> REASONABLE. An implementation
          that always includes (or always drops) indirect compensation fails one of the two.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-02T09:00:00Z."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000."
            - "One BROKER contract and one CONSULTANT contract, each with compensation_disclosure_required true."
            - "One CompensationDisclosure in status RECEIVED per contract, with identical amounts and scores."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-03-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Northwind Benefit Advisors", vendor_type: "BROKER", contact_email: "team@northwind.example" }
              as: PlanSponsorAdmin
              captures: { v_broker: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_broker}", contract_type: "BROKER", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 1000000 }
              as: PlanSponsorAdmin
              captures: { c_broker: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Pinehurst Benefits Consulting", vendor_type: "CONSULTANT", contact_email: "advisors@pinehurst.example" }
              as: PlanSponsorAdmin
              captures: { v_consult: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_consult}", contract_type: "CONSULTANT", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 1000000 }
              as: PlanSponsorAdmin
              captures: { c_consult: "$.data.id" }
            - call: "POST /compliance/compensation-disclosures"
              payload: { contract_id: "${c_broker}", direct_comp_cents: 1000000, indirect_comp_cents: 400000, benchmark_median_cents: 1000000, services_scope_score: 5, disclosure_completeness_score: 4 }
              as: PlanSponsorAdmin
              captures: { d_broker: "$.data.id" }
            - call: "POST /compliance/compensation-disclosures"
              payload: { contract_id: "${c_consult}", direct_comp_cents: 1000000, indirect_comp_cents: 400000, benchmark_median_cents: 1000000, services_scope_score: 5, disclosure_completeness_score: 4 }
              as: PlanSponsorAdmin
              captures: { d_consult: "$.data.id" }
          trigger:
            - call: "POST /compliance/compensation-disclosures/${d_broker}/assess"
              payload: { assessment_note: "Annual reasonableness review." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/compensation-disclosures/${d_consult}/assess"
              payload: { assessment_note: "Annual reasonableness review." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "GET /compliance/compensation-disclosures/${d_broker} -> data.variant_applied == \"TOTAL_WITH_INDIRECT\""
            - "GET /compliance/compensation-disclosures/${d_broker} -> data.component_price_score == 56.00 and data.component_scope_score == 0.00 and data.component_disclosure_score == 11.67"
            - "GET /compliance/compensation-disclosures/${d_broker} -> data.unreasonableness_score == 67.67 and data.status == \"UNREASONABLE\""
            - "GET /compliance/compensation-disclosures/${d_consult} -> data.variant_applied == \"DIRECT_ONLY\""
            - "GET /compliance/compensation-disclosures/${d_consult} -> data.component_price_score == 40.00 and data.unreasonableness_score == 51.67 and data.status == \"REASONABLE\""
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 3 and data.compliance_posture == \"AT_RISK\" (only the broker disclosure scores as unreasonable)"
            - "GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 0 (an unreasonable disclosure adds points, never a ledger accrual)"

  - rule_id: combinatorial_formula
    instances:
      - name: reasonableness_per_component_rounding_before_summation
        grounds:
          - calculations.compensation_reasonableness_score
          - entities.CompensationDisclosure.fields.component_price_score
          - entities.CompensationDisclosure.fields.unreasonableness_score
        distinguishing_aspect: |
          The pinned order rounds each weighted component to 2dp BEFORE summation (mode b): price
          40 * 0.5416 = 21.664 -> 21.66, scope 25 * 1/3 = 8.3333 -> 8.33, disclosure 35 * 3/3 =
          35.00, total 64.99. Summing the exact components first and rounding once (mode a) yields
          64.9973 -> 65.00. The single stored value 64.99 vs 65.00 separates the two orders, and the
          same fixture also proves DIRECT_ONLY drops the 900000 indirect amount entirely.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-02T09:00:00Z."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000 and a CONSULTANT contract."
            - "One RECEIVED CompensationDisclosure with direct 541600, indirect 900000, benchmark 1000000, services_scope_score 4, disclosure_completeness_score 2."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-03-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Pinehurst Benefits Consulting", vendor_type: "CONSULTANT", contact_email: "advisors@pinehurst.example" }
              as: PlanSponsorAdmin
              captures: { v_consult: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_consult}", contract_type: "CONSULTANT", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 541600 }
              as: PlanSponsorAdmin
              captures: { c_consult: "$.data.id" }
            - call: "POST /compliance/compensation-disclosures"
              payload: { contract_id: "${c_consult}", direct_comp_cents: 541600, indirect_comp_cents: 900000, benchmark_median_cents: 1000000, services_scope_score: 4, disclosure_completeness_score: 2 }
              as: PlanSponsorAdmin
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /compliance/compensation-disclosures/${d1}/assess"
              payload: { assessment_note: "Rounding-order regression fixture." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response data.component_price_score == 21.66"
            - "response data.component_scope_score == 8.33"
            - "response data.component_disclosure_score == 35.00"
            - "response data.unreasonableness_score == 64.99 (NOT 65.00)"
            - "response data.status == \"UNREASONABLE\" and response data.variant_applied == \"DIRECT_ONLY\""

      - name: rxdc_rebate_cap_tier_keyed_on_gross_before_deduction
        grounds:
          - calculations.rxdc_reconciliation_totals
          - state_machines.RxDataSubmission.ASSEMBLING_to_RECONCILED
          - state_machines.VendorDataPackage.RECEIVED_to_VALIDATED
          - entities.RxDataSubmission.fields.rebate_cap_pct
        distinguishing_aspect: |
          The cap tier must be selected from gross_spend_cents (10500000 -> 0.20 -> cap 2100000 ->
          credit 2100000 -> net 8400000). Selecting the tier from a rebate-net figure
          (10500000 - 3000000 = 7500000 -> 0.25 -> cap 1875000 -> credit 1875000 -> net 8625000)
          changes both the stored rebate_cap_pct and the net, so the ordering of tier selection
          versus rebate deduction is observable in two fields at once.
        test_recipe:
          setup:
            - "Logical clock at 2028-05-20T09:00:00Z (before the 2028-06-01 RxDC deadline)."
            - "ACTIVE PlanYear PY2027 (2027-01-01..2027-12-31), covered_lives 6000, attestation deadline 2028-12-31, RxDC deadline 2028-06-01."
            - "A PBM contract whose data_rights_status is SECURED through an EXECUTED DATA_RIGHTS amendment."
            - "An RxDataSubmission for reference_year 2027 in status ASSEMBLING with two VALIDATED packages: D6 (plan 6000000, member 1000000, rebate 1800000, 1200 records) and D7 (plan 3000000, member 500000, rebate 1200000, 800 records)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2028-05-20T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-12-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Alpine Script Benefit Managers", vendor_type: "PBM", contact_email: "data@alpinescript.example" }
              as: PlanSponsorAdmin
              captures: { v_pbm: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_pbm}", contract_type: "PBM", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 12000000 }
              as: PlanSponsorAdmin
              captures: { c_pbm: "$.data.id" }
            - call: "GET /compliance/contracts/${c_pbm}"
              payload: {}
              as: PlanSponsorAdmin
              captures: { c_pbm_v: "$.data.version" }
            - call: "POST /compliance/contract-amendments"
              payload: { contract_id: "${c_pbm}", amendment_type: "DATA_RIGHTS", proposed_terms_summary: "PBM grants the plan sponsor rights to claim-level rebate data and cooperation with RxDC assembly.", data_rights_granted: true, expires_at: "2028-06-30T00:00:00Z", expected_contract_version: "${c_pbm_v}" }
              as: PlanSponsorAdmin
              captures: { am1: "$.data.id" }
            - call: "POST /compliance/contract-amendments/${am1}/execute"
              payload: { executed_terms_note: "Countersigned rider 12-A." }
              as: PlanSponsorAdmin
            - call: "POST /compliance/rx-data-submissions"
              payload: { plan_year_id: "${py}", reference_year: 2027 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rx: "$.data.id" }
            - call: "POST /compliance/vendor-data-packages"
              payload: { rx_submission_id: "${rx}", vendor_id: "${v_pbm}", data_section: "D6_RX_TOTALS", expected_record_count: 1200 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pk_d6: "$.data.id" }
            - call: "POST /compliance/vendor-data-packages/${pk_d6}/deliver"
              payload: { record_count: 1200, plan_paid_cents: 6000000, member_paid_cents: 1000000, rebate_cents: 1800000 }
              as: VendorContact
              as_user_id: "${v_pbm}"
            - call: "POST /compliance/vendor-data-packages/${pk_d6}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/vendor-data-packages"
              payload: { rx_submission_id: "${rx}", vendor_id: "${v_pbm}", data_section: "D7_RX_REBATES", expected_record_count: 800 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pk_d7: "$.data.id" }
            - call: "POST /compliance/vendor-data-packages/${pk_d7}/deliver"
              payload: { record_count: 800, plan_paid_cents: 3000000, member_paid_cents: 500000, rebate_cents: 1200000 }
              as: VendorContact
              as_user_id: "${v_pbm}"
            - call: "POST /compliance/vendor-data-packages/${pk_d7}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /compliance/rx-data-submissions/${rx}/reconcile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response data.status == \"RECONCILED\""
            - "response data.gross_spend_cents == 10500000"
            - "response data.rebate_reported_cents == 3000000"
            - "response data.rebate_cap_pct == 0.20 (NOT 0.25)"
            - "response data.rebate_credit_cents == 2100000"
            - "response data.net_plan_spend_cents == 8400000 (NOT 8625000)"
            - "response data.assembled_record_count == 2000"

  - rule_id: non_linear_state_machine
    instances:
      - name: gag_remediation_cycle_third_request_rejected
        grounds:
          - state_machines.ServiceProviderContract.IN_REVIEW_to_REMEDIATION_REQUESTED
          - state_machines.ServiceProviderContract.REMEDIATION_REQUESTED_to_IN_REVIEW
          - validations[priority=28]
          - entities.ServiceProviderContract.fields.remediation_round
        distinguishing_aspect: |
          IN_REVIEW is re-entered twice by the same contract along the cycle edge
          REMEDIATION_REQUESTED -> IN_REVIEW, so the state alone cannot tell the implementation how
          many rounds have elapsed: remediation_round (0 -> 1 -> 2) is what closes the loop, and the
          third request-remediation is refused with ERR_REMEDIATION_ROUNDS_EXHAUSTED while the
          contract legitimately sits in IN_REVIEW — a state a naive linear machine treats as always
          eligible.
        test_recipe:
          setup:
            - "Logical clock at 2027-02-08T09:00:00Z."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000 and one TPA contract."
            - "The contract has traversed NOT_REVIEWED -> IN_REVIEW -> REMEDIATION_REQUESTED -> IN_REVIEW -> REMEDIATION_REQUESTED -> IN_REVIEW, so remediation_round == 2 (MAX_REMEDIATION_ROUNDS) and prohibited_clause_count == 1."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-02-08T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 3 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/request-remediation"
              payload: { remediation_request_note: "Strike sections 8.3, 8.4 and 11.2." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/submit-remediation"
              payload: { prohibited_clause_count: 2, remediation_note: "Section 8.3 removed." }
              as: VendorContact
              as_user_id: "${v_tpa}"
            - call: "POST /compliance/contracts/${c_tpa}/request-remediation"
              payload: { remediation_request_note: "Sections 8.4 and 11.2 still bar cost-data disclosure." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/submit-remediation"
              payload: { prohibited_clause_count: 1, remediation_note: "Section 8.4 removed." }
              as: VendorContact
              as_user_id: "${v_tpa}"
          trigger:
            - call: "POST /compliance/contracts/${c_tpa}/request-remediation"
              payload: { remediation_request_note: "Section 11.2 must go." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response HTTP status == 409 and response data.error_id == \"ERR_REMEDIATION_ROUNDS_EXHAUSTED\""
            - "GET /compliance/contracts/${c_tpa} -> data.gag_review_status == \"IN_REVIEW\" (unchanged)"
            - "GET /compliance/contracts/${c_tpa} -> data.remediation_round == 2 and data.prohibited_clause_count == 1"
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 0 and data.compliance_posture == \"COMPLIANT\" (an unresolved review is not yet a deficiency)"

      - name: attestation_reject_and_accept_branch_side_effect_divergence
        grounds:
          - state_machines.Attestation.SUBMITTED_to_REJECTED
          - state_machines.Attestation.SUBMITTED_to_ACCEPTED
          - state_machines.Attestation.REJECTED_to_DRAFT
          - calculations.penalty_accrual_posting
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: |
          The two edges out of SUBMITTED are shape-identical but effect-divergent: REJECTED posts an
          ATTESTATION_LATE ACCRUAL of 24000 and lifts deficiency_points to 5, while ACCEPTED posts
          NOTHING and drops points back to 0 — and the re-entry edge REJECTED -> DRAFT rewrites
          prepared_by_user_id, so the same attestation row passes through DRAFT twice with different
          segregation-of-duties identities. The ledger count stays at exactly 1 across the whole
          traversal, which a symmetric implementation that "reverses on accept" would break.
        test_recipe:
          setup:
            - "Logical clock at 2027-04-10T10:00:00Z (before the 2028-01-31 attestation deadline)."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000; its single TPA contract is gag_review_status COMPLIANT."
            - "One Attestation prepared by officer-prep-1 with contract_terms_doc_count 3 and submitted by officer-sub-1, so status is SUBMITTED."
            - "Ledger empty, deficiency_points 0, compliance_posture COMPLIANT."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-04-10T10:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/clear-gag"
              payload: { clearance_note: "No prohibited cost or quality data clauses found." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/plan-years/${py}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-prep-1"
              captures: { py_v: "$.data.version" }
            - call: "POST /compliance/attestations"
              payload: { plan_year_id: "${py}", attestation_type: "GAG_CLAUSE_CEE", contract_terms_doc_count: 3, expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-prep-1"
              captures: { at1: "$.data.id" }
            - call: "POST /compliance/attestations/${at1}/submit"
              payload: { signature_statement: "The plan sponsor attests that no service provider contract contains a prohibited gag clause." }
              as: ComplianceOfficer
              as_user_id: "officer-sub-1"
          trigger:
            - call: "POST /compliance/attestations/${at1}/reject"
              payload: { rejection_reason: "Contract terms documentation omits the PBM rider." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
            - call: "POST /compliance/attestations/${at1}/revise"
              payload: { contract_terms_doc_count: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-prep-1"
            - call: "POST /compliance/attestations/${at1}/submit"
              payload: { signature_statement: "Resubmitted with the PBM rider attached." }
              as: ComplianceOfficer
              as_user_id: "officer-sub-1"
            - call: "POST /compliance/attestations/${at1}/accept"
              payload: { acceptance_note: "Documentation complete." }
              as: ExternalAuditor
              as_user_id: "auditor-1"
          assert:
            - "immediately after the reject call: GET /compliance/attestations/${at1} -> data.status == \"REJECTED\" and data.rejection_reason == \"Contract terms documentation omits the PBM rider.\""
            - "immediately after the reject call: GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> exactly 1 entry with entry_type \"ACCRUAL\", deficiency_type \"ATTESTATION_LATE\", daily_rate_cents 12000, days_open 1, size_multiplier 2.0, onset_date \"2027-04-10\", signed_amount_cents 24000"
            - "immediately after the reject call: GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 24000 and data.deficiency_points == 5 and data.compliance_posture == \"AT_RISK\""
            - "after the revise call: GET /compliance/attestations/${at1} -> data.status == \"DRAFT\", data.revision_round == 1, data.contract_terms_doc_count == 4, data.submitted_at == null"
            - "after the accept call: GET /compliance/attestations/${at1} -> data.status == \"ACCEPTED\""
            - "after the accept call: GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> still exactly 1 entry (acceptance posts no ledger row and reverses nothing)"
            - "after the accept call: GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 24000, data.deficiency_points == 0, data.compliance_posture == \"COMPLIANT\", data.attestation_status == \"ACCEPTED\""

      - name: mrf_validating_fork_reject_revise_publish_supersede
        grounds:
          - state_machines.MachineReadableFile.DRAFT_to_VALIDATING
          - state_machines.MachineReadableFile.VALIDATING_to_REJECTED
          - state_machines.MachineReadableFile.REJECTED_to_DRAFT
          - state_machines.MachineReadableFile.VALIDATING_to_PUBLISHED
          - state_machines.MachineReadableFile.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          One endpoint (validate) forks on a payload value rather than on the entity's state:
          validation_error_count 3 lands REJECTED, 0 lands PUBLISHED, and the same row re-enters
          DRAFT through revise before publishing. Publishing a second file for the same
          (plan_year_id, file_type, posting_month) additionally drives a sibling row PUBLISHED ->
          SUPERSEDED, so the transition target depends on request data plus sibling state, never on
          the source state alone.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T09:00:00Z."
            - "ACTIVE PlanYear PY2027 with covered_lives 6000 and one TPA contract."
            - "File A (IN_NETWORK_RATES, posting_month 2027-06) has been validated with 3 errors -> REJECTED, revised -> DRAFT, then validated with 0 errors -> PUBLISHED."
            - "File B (IN_NETWORK_RATES, posting_month 2027-06) exists in DRAFT."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "IN_NETWORK_RATES", posting_month: "2027-06", public_url: "https://transparency.meridian.example/2027-06/in-network-rates-v1.json", row_count: 812004, schema_version: "1.2.0" }
              as: PlanSponsorAdmin
              captures: { mrf_a: "$.data.id" }
            - call: "POST /compliance/machine-readable-files/${mrf_a}/validate"
              payload: { validation_error_count: 3 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files/${mrf_a}/revise"
              payload: { public_url: "https://transparency.meridian.example/2027-06/in-network-rates-v2.json", row_count: 812101 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files/${mrf_a}/validate"
              payload: { validation_error_count: 0 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "IN_NETWORK_RATES", posting_month: "2027-06", public_url: "https://transparency.meridian.example/2027-06/in-network-rates-v3.json", row_count: 812640, schema_version: "1.2.0" }
              as: PlanSponsorAdmin
              captures: { mrf_b: "$.data.id" }
          trigger:
            - call: "POST /compliance/machine-readable-files/${mrf_b}/validate"
              payload: { validation_error_count: 0 }
              as: PlanSponsorAdmin
          assert:
            - "response data.status == \"PUBLISHED\" and response data.published_at == \"2027-01-05T09:00:00Z\""
            - "GET /compliance/machine-readable-files/${mrf_a} -> data.status == \"SUPERSEDED\" and data.superseded_at == \"2027-01-05T09:00:00Z\""
            - "GET /compliance/machine-readable-files/${mrf_a} -> data.public_url == \"https://transparency.meridian.example/2027-06/in-network-rates-v2.json\" and data.validation_error_count == 0 (the revision survived the supersede)"
            - "GET /compliance/machine-readable-files?plan_year_id=${py}&file_type=IN_NETWORK_RATES&posting_month=2027-06&status=PUBLISHED -> exactly 1 element, whose id == ${mrf_b}"

  - rule_id: transitive_cascade
    instances:
      - name: gag_escalation_cascade_five_links_to_voided_attestation
        grounds:
          - state_machines.ServiceProviderContract.IN_REVIEW_to_NON_COMPLIANT
          - calculations.penalty_accrual_posting
          - calculations.penalty_ledger_balance
          - calculations.plan_year_compliance_posture
          - state_machines.PlanYear.COMPLIANT_to_DEFICIENT
          - state_machines.Attestation.DRAFT_to_VOIDED
        distinguishing_aspect: |
          A single escalate-gag call propagates five links deep across four entities:
          contract -> new PenaltyLedgerEntry (30000) -> PlanYear.penalty_exposure_cents and
          deficiency_points (6) -> compliance_posture DEFICIENT -> the plan year's DRAFT Attestation
          VOIDED with void_reason POSTURE_DEFICIENT -> PlanYear.attestation_status VOIDED. Link 5 is
          reachable only through the posture flip produced by links 2-4, so an implementation that
          stops at "post the accrual" leaves an attestation that is still submittable.
        test_recipe:
          setup:
            - "Logical clock at 2027-05-04T09:00:00Z."
            - "ACTIVE PlanYear PY2027, covered_lives 6000 (multiplier 2.0), attestation deadline 2028-01-31."
            - "One TPA contract in gag_review_status IN_REVIEW with clause_inventory_count 40 and prohibited_clause_count 4."
            - "One Attestation in DRAFT prepared by officer-prep-1 with contract_terms_doc_count 2."
            - "Ledger empty; deficiency_points 0; compliance_posture COMPLIANT; attestation_status DRAFT."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-04T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/plan-years/${py}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-prep-1"
              captures: { py_v: "$.data.version" }
            - call: "POST /compliance/attestations"
              payload: { plan_year_id: "${py}", attestation_type: "GAG_CLAUSE_CEE", contract_terms_doc_count: 2, expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-prep-1"
              captures: { at1: "$.data.id" }
          trigger:
            - call: "POST /compliance/contracts/${c_tpa}/escalate-gag"
              payload: { escalation_note: "Vendor refuses to strike sections 8.3, 8.4, 11.2 and 11.5." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response data.gag_review_status == \"NON_COMPLIANT\" and response data.gag_non_compliant_since == \"2027-05-04\""
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> exactly 1 entry with entry_type \"ACCRUAL\", deficiency_type \"GAG_CLAUSE\", daily_rate_cents 15000, days_open 1, size_multiplier 2.0, onset_date \"2027-05-04\", signed_amount_cents 30000"
            - "GET /compliance/plan-years/${py} -> data.penalty_exposure_cents == 30000"
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 6 and data.compliance_posture == \"DEFICIENT\""
            - "GET /compliance/attestations/${at1} -> data.status == \"VOIDED\" and data.void_reason == \"POSTURE_DEFICIENT\""
            - "GET /compliance/plan-years/${py} -> data.attestation_status == \"VOIDED\""

      - name: validated_package_rejection_cascade_to_rxdc_accrual
        grounds:
          - state_machines.VendorDataPackage.VALIDATED_to_REJECTED
          - state_machines.RxDataSubmission.RECONCILED_to_ASSEMBLING
          - calculations.rxdc_reconciliation_totals
          - calculations.penalty_accrual_posting
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: |
          Rejecting one VALIDATED package cascades four links: package REJECTED -> submission
          assembled_record_count 2000 -> 1200 -> submission RECONCILED -> ASSEMBLING with every
          reconciliation total nulled -> an RXDC_LATE ACCRUAL of 560000 (20000 * 14 days * 2.0,
          onset 2028-06-02) because the clock has passed the RxDC deadline, lifting deficiency_points
          to 5. The accrual is a consequence of the demotion, not of the rejection itself, so an
          implementation that only flips the package status leaves stale totals and zero exposure.
