# =============================================================================
# Task 1185: Opera & Ballet Production Management — §1.9 Scaffold Corner Design
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities — creation, defaults, computed/system fields, not-found,
  # listing/pagination, enum constraints
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: production_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Production.fields.build_budget_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /opera/productions without build_budget_cents -> 400 ERR_VALIDATION; no entity persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /opera/productions"
              payload: { title: "No Budget Ballet", work_type: "BALLET", default_surtitle_language: "en" }
              as: ProductionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status == 400"

      - name: production_create_computed_and_system_fields
        claim_type: computed_fields
        grounds: [entities.Production.fields.build_cost_balance_cents, entities.Production.fields.season_revenue_cents, entities.Production.fields.status]
        distinguishing_aspect: "On create, build_cost_balance_cents equals build_budget_cents, season_revenue_cents is 0, status is DESIGN, version is 1, and id/created_at are server-minted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, bal: $.data.build_cost_balance_cents, rev: $.data.season_revenue_cents, st: $.data.status, v: $.data.version }
          assert:
            - "Production.${prod}.build_cost_balance_cents == 100000000"
            - "Production.${prod}.season_revenue_cents == 0"
            - "Production.${prod}.status == DESIGN"
            - "Production.${prod}.version == 1 and id is a server-minted UUID"

      - name: contract_create_rest_floor_default_applied
        claim_type: defaults
        grounds: [entities.Contract.fields.rest_floor_hours]
        distinguishing_aspect: "Omitting rest_floor_hours on contract creation applies the default 12."
        test_recipe:
          setup: ["production exists (DESIGN)"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
          trigger:
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr: $.data.id, floor: $.data.rest_floor_hours, st: $.data.status }
          assert:
            - "Contract.${ctr}.rest_floor_hours == 12  (default applied)"
            - "Contract.${ctr}.status == DRAFT  (initial state)"

      - name: partner_company_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.PartnerCompany.fields.partner_kind, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "partner_kind outside {CO_PRODUCER, RENTER} is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /opera/partner-companies"
              payload: { name: "BadKindCo", partner_kind: "BOTH" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and HTTP status == 400"

      - name: production_get_not_found_returns_404
        claim_type: not_found
        grounds: [ "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404) with the standard error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /opera/productions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: artists_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["two artists registered"]
          setup_api_calls:
            - call: "POST /opera/artists"
              payload: { full_name: "Artist One", discipline: "SOPRANO", union_code: "AGMA" }
              as: ContractsOfficer
            - call: "POST /opera/artists"
              payload: { full_name: "Artist Two", discipline: "TENOR", union_code: "AFM" }
              as: ContractsOfficer
          trigger:
            - call: "GET /opera/artists?limit=1&offset=0"
              payload: { limit: 1, offset: 0 }
              as: Any
          assert:
            - "response_type == array and exactly 1 item returned (limit=1)"
            - "total_count == 2 and has_more == true"
            - "meta.api_request_id present on the envelope"

  # ---------------------------------------------------------------------------
  # Section: state_machines — initial state, invalid transitions, terminal
  # lockdown, precondition enforcement, side effects, selector determinism
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: production_design_to_rehearsal_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Production, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "DESIGN -> REHEARSAL skips BUILD; rejected with ERR_INVALID_STATE_TRANSITION (409)."
        test_recipe:
          setup: ["production in DESIGN"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and status remains DESIGN"

      - name: build_to_rehearsal_blocked_by_undelivered_item_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Production.BUILD_to_REHEARSAL, "errors[ERR_BUILD_ITEMS_NOT_DELIVERED]"]
        distinguishing_aspect: "BUILD -> REHEARSAL with an ORDERED (not yet delivered) build item fails with ERR_BUILD_ITEMS_NOT_DELIVERED."
        test_recipe:
          setup: ["production in BUILD with one ORDERED build item"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/build-items"
              payload: { production_id: "${prod}", item_kind: "SET", name: "Palace flat", quoted_cost_cents: 1000000 }
              as: ProductionManager
              captures: { bi: $.data.id }
          trigger:
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BUILD_ITEMS_NOT_DELIVERED and production remains BUILD"

      - name: declined_offer_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RentalOffer, "errors[ERR_OFFER_NOT_ACTIONABLE]"]
        distinguishing_aspect: "A DECLINED (terminal) offer cannot be re-sent: POST /send returns ERR_OFFER_NOT_ACTIONABLE."
        test_recipe:
          setup: ["renter company; production; offer created and SENT, then DECLINED by the renter"]
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 4, per_performance_fee_cents: 500000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer: $.data.id }
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
            - call: "POST /opera/rental-offers/${offer}/decline"
              payload: {}
              as: PartnerRepresentative
              as_user_id: ${renter}
          trigger:
            - call: "POST /opera/rental-offers/${offer}/send"
              payload: {}
              as: ProductionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OFFER_NOT_ACTIONABLE and offer status remains DECLINED"

      - name: rehearsal_call_double_publish_rejected
        claim_type: idempotency
        grounds: [state_machines.RehearsalCall.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED call is rejected; the second trigger is not a silent no-op."
        test_recipe:
          setup: ["production in REHEARSAL; room; call created and PUBLISHED"]
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-08T09:00:00Z", ends_at: "2026-06-08T12:00:00Z" }
              as: TechnicalDirector
              captures: { call1: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call1}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
          trigger:
            - call: "POST /opera/rehearsal-calls/${call1}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION and status remains PUBLISHED"

      - name: new_offer_supersedes_prior_sent_offer
        claim_type: side_effect_execution
        grounds: [state_machines.RentalOffer.SENT_to_SUPERSEDED, "concurrency_rules[rental-offer-create-stale-production]"]
        distinguishing_aspect: "Creating a new offer for the same (production, renter) with the current production version moves the prior SENT offer to SUPERSEDED and bumps Production.version by 1."
        test_recipe:
          setup: ["renter company; production; offer A created and SENT"]
          setup_api_calls:
            - call: "POST /opera/partner-companies"
              payload: { name: "TourCo", partner_kind: "RENTER" }
              as: PlatformAdmin
              captures: { renter: $.data.id }
            - call: "POST /opera/productions"
              payload: { title: "Nutcracker", work_type: "BALLET", build_budget_cents: 40000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id, prod_v: $.data.version }
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", performances_count: 4, per_performance_fee_cents: 500000, expected_production_version: "${prod_v}" }
              as: ProductionManager
              captures: { offer_a: $.data.id }
            - call: "POST /opera/rental-offers/${offer_a}/send"
              payload: {}
              as: ProductionManager
            - call: "GET /opera/productions/${prod}"
              payload: {}
              as: Any
              captures: { prod_v2: $.data.version }
          trigger:
            - call: "POST /opera/rental-offers"
              payload: { production_id: "${prod}", renter_company_id: "${renter}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z", performances_count: 6, per_performance_fee_cents: 600000, expected_production_version: "${prod_v2}" }
              as: ProductionManager
              captures: { offer_b: $.data.id }
            - call: "GET /opera/rental-offers/${offer_a}"
              payload: {}
              as: Any
              captures: { a_status: $.data.status }
          assert:
            - "RentalOffer.${offer_a}.status == SUPERSEDED  (system side effect of creating offer B)"
            - "RentalOffer.${offer_b}.status == DRAFT"
            - "Production.${prod}.version advanced by exactly 1 per offer create"

      - name: cover_promotion_selector_determinism
        claim_type: side_effect_execution
        grounds: [state_machines.CastAssignment.CONFIRMED_to_RELEASED, calculations.casting_completeness]
        distinguishing_aspect: "With COVER_1 and COVER_2 both CONFIRMED, releasing the principal promotes COVER_1 (slot rank order) and re-points COVER_2's covers_assignment_id to the promoted assignment; role stays FULLY_CAST."
        test_recipe:
          setup:
            - "Production in BUILD; role Odette; principal P CONFIRMED (contract A ACTIVE); covers C1 (COVER_1, contract B ACTIVE) and C2 (COVER_2, contract C ACTIVE) both CONFIRMED and linked to P"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Swan Lake", work_type: "BALLET", build_budget_cents: 100000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/roles"
              payload: { production_id: "${prod}", role_name: "Odette/Odile", voice_type: "DANCER_F", is_title_role: true }
              as: CastingDirector
              captures: { role: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_a: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_a}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr_a: $.data.id }
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_a}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_a}", slot: "PRINCIPAL" }
              as: CastingDirector
              captures: { asg_p: $.data.id }
            - call: "POST /opera/cast-assignments/${asg_p}/confirm"
              payload: {}
              as: CastingDirector
            - call: "POST /opera/artists"
              payload: { full_name: "Bella Cover", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_b: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_b}", engagement_type: "COVER", hourly_rate_cents: 6000, weekly_hours_cap: 25 }
              as: ContractsOfficer
              captures: { ctr_b: $.data.id }
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_b}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_b}", slot: "COVER_1", covers_assignment_id: "${asg_p}" }
              as: CastingDirector
              captures: { asg_c1: $.data.id }
            - call: "POST /opera/cast-assignments/${asg_c1}/confirm"
              payload: {}
              as: CastingDirector
            - call: "POST /opera/artists"
              payload: { full_name: "Carla Cover", discipline: "CORPS_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist_c: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist_c}", engagement_type: "COVER", hourly_rate_cents: 5500, weekly_hours_cap: 25 }
              as: ContractsOfficer
              captures: { ctr_c: $.data.id }
            - call: "POST /opera/contracts/${ctr_c}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_c}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr_c}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/cast-assignments"
              payload: { role_id: "${role}", contract_id: "${ctr_c}", slot: "COVER_2", covers_assignment_id: "${asg_p}" }
              as: CastingDirector
              captures: { asg_c2: $.data.id }
            - call: "POST /opera/cast-assignments/${asg_c2}/confirm"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /opera/cast-assignments/${asg_p}/release"
              payload: {}
              as: CastingDirector
            - call: "GET /opera/cast-assignments/${asg_c1}"
              payload: {}
              as: Any
              captures: { c1_slot: $.data.slot }
            - call: "GET /opera/cast-assignments/${asg_c2}"
              payload: {}
              as: Any
              captures: { c2_slot: $.data.slot, c2_covers: $.data.covers_assignment_id }
            - call: "GET /opera/roles/${role}"
              payload: {}
              as: Any
              captures: { casting: $.data.casting_status }
          assert:
            - "CastAssignment.${asg_c1}.slot == PRINCIPAL  (COVER_1 promoted before COVER_2 — slot rank order)"
            - "CastAssignment.${asg_c2}.slot == COVER_2 and covers_assignment_id == ${asg_c1}  (re-pointed to the promoted principal)"
            - "Role.${role}.casting_status == FULLY_CAST  (promoted principal + remaining confirmed cover)"

  # ---------------------------------------------------------------------------
  # Section: calculations — input-set filtering, constants, boundary tiers
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: pay_quote_input_set_excludes_draft_calls
        claim_type: input_set_filtering
        grounds: [calculations.artist_weekly_pay_cents]
        distinguishing_aspect: "A DRAFT call is excluded from BOTH variants: week with 12h COMPLETED + 12h PUBLISHED + 12h DRAFT yields projected 24h / final 12h (DRAFT hours invisible)."
        test_recipe:
          setup:
            - "Production in REHEARSAL; contract ACTIVE (8,000 cents/h, cap 30); three calls Mon/Tue/Wed 08:00-20:00 (12h each): call X COMPLETED, call Y PUBLISHED, call Z left in DRAFT; contract CONFIRMED on all three"
          setup_api_calls:
            - call: "POST /opera/productions"
              payload: { title: "Giselle", work_type: "BALLET", build_budget_cents: 50000000, default_surtitle_language: "en" }
              as: ProductionManager
              captures: { prod: $.data.id }
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "BUILD" }
              as: ProductionManager
            - call: "POST /opera/productions/${prod}/transition"
              payload: { to_state: "REHEARSAL" }
              as: ProductionManager
            - call: "POST /opera/rehearsal-rooms"
              payload: { name: "Studio 1", kind: "STUDIO", capacity: 40, hourly_rate_cents: 5000 }
              as: TechnicalDirector
              captures: { room: $.data.id }
            - call: "POST /opera/artists"
              payload: { full_name: "Anna Principal", discipline: "PRINCIPAL_DANCER", union_code: "AGMA" }
              as: ContractsOfficer
              captures: { artist: $.data.id }
            - call: "POST /opera/contracts"
              payload: { production_id: "${prod}", artist_id: "${artist}", engagement_type: "PRINCIPAL", hourly_rate_cents: 8000, weekly_hours_cap: 30 }
              as: ContractsOfficer
              captures: { ctr: $.data.id }
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "OFFERED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "SIGNED" }
              as: ContractsOfficer
            - call: "POST /opera/contracts/${ctr}/transition"
              payload: { to_state: "ACTIVE" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "DANCE_CALL", starts_at: "2026-06-01T08:00:00Z", ends_at: "2026-06-01T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_x: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_x}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_x}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_x: $.data.id }
            - call: "POST /opera/call-participants/${pa_x}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls/${call_x}/transition"
              payload: { to_state: "COMPLETED" }
              as: TechnicalDirector
            - call: "POST /opera/rehearsal-calls"
              payload: { production_id: "${prod}", room_id: "${room}", call_type: "BLOCKING", starts_at: "2026-06-02T08:00:00Z", ends_at: "2026-06-02T20:00:00Z" }
              as: TechnicalDirector
              captures: { call_y: $.data.id }
            - call: "POST /opera/rehearsal-calls/${call_y}/transition"
              payload: { to_state: "PUBLISHED" }
              as: TechnicalDirector
            - call: "POST /opera/call-participants"
              payload: { call_id: "${call_y}", contract_id: "${ctr}" }
              as: ContractsOfficer
              captures: { pa_y: $.data.id }
            - call: "POST /opera/call-participants/${pa_y}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ContractsOfficer
            - call: "POST /opera/rehearsal-calls"
