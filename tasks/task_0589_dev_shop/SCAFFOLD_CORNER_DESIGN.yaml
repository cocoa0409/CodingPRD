              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
          trigger:
            - call: "POST /invoices"
              payload: { engagement_id: "${eng_id}", kind: "TIME_AND_MATERIALS", expected_engagement_version: "${e_v}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_ENGAGEMENT_VERSION   (the time-entry approval cascade bumped Engagement.version after the FinanceOfficer's read)"
            - "GET /invoices?engagement_id=${eng_id} returns 0 invoices"

      - name: budget_posture_overburned_at_ratio_exactly_one
        claim_type: rate_threshold_triggers
        grounds: ["calculations.budget_posture", "entities.Engagement.fields.budget_posture"]
        distinguishing_aspect: "The second threshold of the same ladder: burn_ratio exactly 1.0000 (10.0h * 200.00 = 2000.00 against a 2000.00 contract) yields OVERBURNED, not AT_RISK — OVERBURNED_THRESHOLD is inclusive."
        test_recipe:
          setup:
            - "T&M engagement ACTIVE, contract_value 2000.00, budget_hours_cap 10, rate 200.00; ACTIVE sprint; ticket IN_PROGRESS."
            - "One SUBMITTED billable entry of 10.0h (exactly the hour cap)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Overco", billing_email: "ap@overco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Overco App", source_channel: "OUTBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 2000.00, budget_hours_cap: 10, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Fox Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Everything", estimated_hours: 10, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-05", hours: 10.0 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_id: $.data.id }
          trigger:
            - call: "POST /time-entries/${te_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
          assert:
            - "HTTP 200 — 10.0h is exactly the budget_hours_cap, so ERR_BUDGET_HOURS_EXCEEDED is NOT raised (the check is `>` cap)"
            - "Engagement.${eng_id}.burn_ratio == 1.0"
            - "Engagement.${eng_id}.budget_posture == OVERBURNED   (NOT AT_RISK)"
            - "Sprint.${sprint_id}.spend_frozen == true"

      - name: change_request_approval_unfreezes_sprints_via_new_contract_value
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChangeRequest.SUBMITTED_to_APPROVED
          - calculations.budget_posture
          - entities.Sprint.fields.spend_frozen
        distinguishing_aspect: "Reverse of the freeze cascade: approving a 30h/6384.00 CR raises contract_value from 2000.00 to 8384.00, which drops burn_ratio from 0.9 to 0.2147, which returns the posture to HEALTHY, which unfreezes every ACTIVE sprint."
        test_recipe:
          setup:
            - "T&M engagement (contract 2000.00, cap 10, rate 200.00) ACTIVE with 9.0h approved -> burn_ratio 0.9, AT_RISK, sprint frozen."
            - "A SUBMITTED ChangeRequest for 30h, rush false, quoted at 6384.00."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Thawco", billing_email: "ap@thawco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Thawco App", source_channel: "REFERRAL" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "TIME_AND_MATERIALS", contract_value: 2000.00, budget_hours_cap: 10, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Gil Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /sprints"
              payload: { engagement_id: "${eng_id}", name: "Sprint 1", start_date: "2026-05-04", end_date: "2026-05-18" }
              as: DeliveryLead
              captures: { sprint_id: $.data.id }
            - call: "POST /sprints/${sprint_id}/transition"
              payload: { target_status: "ACTIVE" }
              as: DeliveryLead
            - call: "POST /tickets"
              payload: { sprint_id: "${sprint_id}", title: "Core work", estimated_hours: 8, assignee_user_id: "eng-001" }
              as: DeliveryLead
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/transition"
              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-05", hours: 9.0 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: DeliveryLead
              captures: { e_v: $.data.version }
            - call: "POST /change-requests"
              payload: { engagement_id: "${eng_id}", title: "Extra scope", delta_hours: 30, rush: false, expected_engagement_version: "${e_v}" }
              as: DeliveryLead
              captures: { cr_id: $.data.id }
            - call: "POST /change-requests/${cr_id}/submit"
              payload: {}
              as: DeliveryLead
          trigger:
            - call: "POST /change-requests/${cr_id}/decision"
              payload: { action: "APPROVE" }
              as: ClientContact
              as_user_id: "${client_id}"
          assert:
            - "ChangeRequest.${cr_id}.quoted_amount == 6384.00"
            - "Engagement.${eng_id}.contract_value == 8384.00"
            - "Engagement.${eng_id}.budget_hours_cap == 40"
            - "Engagement.${eng_id}.burn_ratio == 0.2147   (1800.00 / 8384.00, 4dp)"
            - "Engagement.${eng_id}.budget_posture == HEALTHY"
            - "Sprint.${sprint_id}.spend_frozen == false"
            - "Engagement.${eng_id}.approved_hours == 9.0   (the CR changes the denominator, never the burned hours)"

      - name: engagement_billing_status_reaches_fully_billed_on_issue
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Engagement.billing_status.UNBILLED_to_FULLY_BILLED
          - calculations.money_ledger_invariant
          - entities.Engagement.fields.invoiced_amount
        distinguishing_aspect: "Parallel state dimension: issuing a single milestone invoice whose subtotal equals the whole 5000.00 contract sets billing_status to FULLY_BILLED while the status dimension stays ACTIVE — the two dimensions move independently."
        test_recipe:
          setup:
            - "FIXED engagement ACTIVE with contract_value 5000.00 and one milestone of 5000.00, COMPLETED via an accepted release; cascade DRAFT invoice present."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Fullco", billing_email: "ap@fullco.test", country_code: "US" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Fullco Landing", source_channel: "INBOUND" }
              as: AccountManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/qualify"
              payload: { outcome: "QUALIFY" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sow"
              payload: { billing_model: "FIXED", contract_value: 5000.00, budget_hours_cap: 40, standard_hourly_rate: 200.00, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: AccountManager
            - call: "POST /engagements/${eng_id}/sign"
              payload: { signed_by_name: "Hux Client" }
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /milestones"
              payload: { engagement_id: "${eng_id}", sequence: 1, title: "Whole project", amount: 5000.00, due_date: "2026-06-01" }
              as: DeliveryLead
              captures: { m1_id: $.data.id }
            - call: "POST /releases"
              payload: { engagement_id: "${eng_id}", milestone_id: "${m1_id}", version_label: "v1.0.0" }
              as: Engineer
              as_user_id: "eng-001"
              captures: { rel_id: $.data.id }
            - call: "POST /releases/${rel_id}/qa-result"
              payload: { outcome: "PASS", defect_count: 0 }
              as: Engineer
              as_user_id: "eng-002"
            - call: "POST /releases/${rel_id}/acceptance"
              payload: { action: "ACCEPT" }
              as: ClientContact
