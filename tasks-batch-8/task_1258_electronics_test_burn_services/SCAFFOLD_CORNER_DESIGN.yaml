# =============================================================================
# Task 1258: Electronics Test & Burn-In Services — §1.9 Scaffold Corner Design
# Breadth coverage of every testable claim §1.1–§1.7 declares that §1.8 does
# not already cover. Sections/claim_types follow the claim-extraction guide.
# Names are unique across BOTH design files.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds:
          - entities.Customer.fields.requires_esd_certification
          - entities.Customer.fields.account_status
        distinguishing_aspect: "Omitting requires_esd_certification stores false; a new customer starts with account_status ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "DefaultCo", tier: "STANDARD" }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
          trigger:
            - { call: "GET /api/customers/${cust}", as: OperationsManager, as_user_id: "ops-1", captures: { esd: $.data.requires_esd_certification, acct: $.data.account_status, ver: $.data.version } }
          assert:
            - "${esd} == false (declared default applied)"
            - "${acct} == ACTIVE (initial state)"
            - "${ver} == 1 (common_fields version starts at 1)"

      - name: customer_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /api/customers without the required name field is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { tier: "STANDARD" }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: unit_duplicate_serial_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_SERIAL]
        distinguishing_aspect: "serial_number uniqueness is scoped per lot: the second SN-1 on the same lot fails with ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["Customer + RELEASED program; lot quantity 2 in RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "DupCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-201", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-D", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-201", quantity: 2, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "SN-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_SERIAL"
            - "Lot.${lot}.units_registered == 1 (rejected insert persisted nothing)"

      - name: unit_registration_at_quantity_boundary
        claim_type: type_constraints
        grounds:
          - validations[priority=9]
          - errors[ERR_QUANTITY_EXCEEDED]
          - entities.Lot.fields.quantity
        distinguishing_aspect: "Registering unit number exactly == quantity succeeds; unit number quantity+1 fails with ERR_QUANTITY_EXCEEDED."
        test_recipe:
          setup: ["Customer + RELEASED program; lot quantity 2 in RECEIVED with 1 unit registered"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "QtyCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-202", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-Q", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-202", quantity: 2, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "Q-1" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "Q-2" }, as: OperationsManager, as_user_id: "ops-1", captures: { u2: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "Q-3" }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "Unit 2 of 2 accepted: ${u2} is a created id (boundary == quantity is allowed)"
            - "${err} == ERR_QUANTITY_EXCEEDED on unit 3 of 2"

      - name: test_result_immutability_no_version_field
        claim_type: immutability
        grounds:
          - entities.TestResult.fields.voided
          - entities.TestResult.fields.insertion_index
        distinguishing_aspect: "TestResult is append-only (common_fields false): its create response carries id and created_at but no version or updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Lot of 1 IN_TEST with AVAILABLE fixture and RELEASED program"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ImmCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-203", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-I", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-203", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "I-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { res: $.data.id, ins: $.data.insertion_index, passed: $.data.passed } }
          assert:
            - "${ins} == 1 AND ${passed} == true (computed fields populated at creation)"
            - "Response data contains id and created_at but NO version and NO updated_at (common_fields: false)"
            - "Result ${res}.recorded_by_user_id == eng-1 (system-stamped from X-User-ID)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: unit_initial_state_untested
        claim_type: initial_state
        grounds:
          - state_machines.Unit
        distinguishing_aspect: "A freshly registered unit starts UNTESTED with current_bin null and retest_count 0."
        test_recipe:
          setup: ["Customer + RELEASED program; lot quantity 1 RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "InitCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-204", bin_map: { "1": "PASS", "9": "HARD_FAIL" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-N", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-204", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "N-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { st: $.data.test_status, bin: $.data.current_bin, rc: $.data.retest_count } }
          assert:
            - "${st} == UNTESTED AND ${bin} == null AND ${rc} == 0"

      - name: program_validate_requires_available_fixture
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TestProgram.DRAFT_to_VALIDATED
          - errors[ERR_NO_AVAILABLE_FIXTURE]
        distinguishing_aspect: "Validate with the program's only fixture still COMMISSIONING fails with ERR_NO_AVAILABLE_FIXTURE."
        test_recipe:
          setup: ["Customer; DRAFT program; one fixture never commissioned"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ValCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-205", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-V", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NO_AVAILABLE_FIXTURE"
            - "Program.${prog}.status remains DRAFT"

      - name: program_release_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TestProgram
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RELEASE is not a valid successor of DRAFT (must pass through VALIDATED); rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Customer; DRAFT program (never validated)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "DraftCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-206", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Program.${prog}.status remains DRAFT"

      - name: reservation_complete_from_reserved_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ChamberReservation
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "COMPLETE is only valid from IN_PROGRESS; a RESERVED reservation cannot be completed."
        test_recipe:
          setup: ["QUEUED lot; chamber; RESERVED reservation with a future window"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ResCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-207", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-C2", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-207", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "R-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-C", area_code: "AREA-C", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-02T10:00:00Z", end_at: "2026-06-02T11:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/chamber-reservations/${r1}/complete", payload: {}, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Reservation.${r1}.status remains RESERVED and chamber available_slots unchanged at 3"

      - name: lot_ship_from_in_test_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Lot
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SHIP is only valid from AWAITING_DISPOSITION; an IN_TEST lot rejects ship with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Lot of 1 IN_TEST, unit untested"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ShipCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-208", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-H", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-208", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "H-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/lots/${lot}/ship", payload: {}, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Lot.${lot}.status remains IN_TEST"

      - name: retest_authorization_on_passed_unit_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Unit
          - calculations.retest_policy_gate
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Retest authorization requires test_status FAILED; a PASSED unit rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Lot of 1 IN_TEST; unit passed on first insertion"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "PassCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-209", bin_map: { "1": "PASS", "2": "SOFT_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-P", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-209", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "P-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "not needed" }, as: TestEngineer, as_user_id: "eng-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (unit is PASSED, not FAILED)"

      - name: rma_close_before_fa_complete_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.RmaCase
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSE is only valid from FA_COMPLETE; an RMA in FA_IN_PROGRESS rejects close."
        test_recipe:
          setup: ["SHIPPED lot of 1 (passed); RMA created and moved to FA_IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "RmaCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-210", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-RM", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-210", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "RM-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots/${lot}/complete-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/ship", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/rma-cases", payload: { lot_id: "${lot}", unit_id: "${u1}", failure_mode: "dead on arrival" }, as: CustomerRep, as_user_id: "${cust}", captures: { rma: $.data.id } }
            - { call: "POST /api/rma-cases/${rma}/start-fa", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
          trigger:
            - { call: "POST /api/rma-cases/${rma}/close", payload: {}, as: QualityEngineer, as_user_id: "qe-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "RmaCase.${rma}.fa_status remains FA_IN_PROGRESS"

      - name: esd_audit_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EsdAudit
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CLOSED audit is terminal; a second close is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Audit with zero findings closed cleanly (outcome PASS)"]
          setup_api_calls:
            - { call: "POST /api/esd-audits", payload: { area_code: "AREA-Z", findings: [] }, as: QualityEngineer, as_user_id: "qe-1", captures: { audit: $.data.id } }
            - { call: "POST /api/esd-audits/${audit}/close", payload: { corrective_actions: [] }, as: QualityEngineer, as_user_id: "qe-1", captures: { outcome: $.data.outcome } }
          trigger:
            - { call: "POST /api/esd-audits/${audit}/close", payload: { corrective_actions: [] }, as: QualityEngineer, as_user_id: "qe-1", captures: { err: $.data.error_id } }
          assert:
            - "First close: ${outcome} == PASS (no findings)"
            - "${err} == ERR_INVALID_STATE on the second close"

      - name: chamber_offline_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Chamber
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "OFFLINE is terminal for chambers; PATCH back to ONLINE is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Chamber taken OFFLINE"]
          setup_api_calls:
            - { call: "POST /api/chambers", payload: { name: "CH-OFF", area_code: "AREA-F", slot_count: 2, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "PATCH /api/chambers/${ch}", payload: { status: "OFFLINE" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "PATCH /api/chambers/${ch}", payload: { status: "ONLINE" }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Chamber.${ch}.status remains OFFLINE"

      - name: fixture_maintenance_cascades_cancel_future_reservations
        claim_type: side_effect_execution
        grounds:
          - state_machines.Fixture.AVAILABLE_to_UNDER_MAINTENANCE
          - calculations.chamber_slot_ledger
        distinguishing_aspect: "Taking a fixture into maintenance cancels its future RESERVED reservations and frees the chamber slot ledger in the same request."
        test_recipe:
          setup: ["QUEUED lot; chamber slots 4; RESERVED reservation (2 slots, future window) referencing fixture FX-M"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "FixCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-211", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-M", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-211", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "M-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-FX", area_code: "AREA-FX", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-02T10:00:00Z", end_at: "2026-06-02T11:00:00Z", slot_count: 2 }, as: OperationsManager, as_user_id: "ops-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/fixtures/${fix}/maintenance", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "GET /api/chamber-reservations/${r1}", as: TestEngineer, as_user_id: "eng-1", captures: { r1_status: $.data.status } }
            - { call: "GET /api/chambers/${ch}", as: TestEngineer, as_user_id: "eng-1", captures: { avail: $.data.available_slots } }
          assert:
            - "${r1_status} == CANCELLED (cascade from fixture maintenance)"
            - "${avail} == 4 (2 slots freed)"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: yield_report_excludes_voided_results
        claim_type: input_set_filtering
        grounds:
          - calculations.lot_yield_metrics
          - calculations.unit_tally_projection
        distinguishing_aspect: "Voided results leave the yield input set: after voiding a pass and re-recording a soft-fail, first_pass_yield is 0.0 and bin_counts counts only the effective result."
        test_recipe:
          setup: ["Lot of 1 IN_TEST; unit passed (bin 1), that result voided, then soft-fail (bin 2) recorded as the new first insertion"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "VoidCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-212", bin_map: { "1": "PASS", "2": "SOFT_FAIL", "9": "HARD_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-VO", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-212", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "V-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { r_pass: $.data.id } }
            - { call: "POST /api/test-results/${r_pass}/void", payload: { reason: "wrong unit scanned" }, as: QualityEngineer, as_user_id: "qe-1" }
          trigger:
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { ins: $.data.insertion_index } }
            - { call: "GET /api/lots/${lot}/yield-report", as: QualityEngineer, as_user_id: "qe-1", captures: { fpy: $.data.first_pass_yield, bins: $.data.bin_counts } }
          assert:
            - "${ins} == 1 (the voided pass left the replay set, so the soft-fail is insertion 1)"
            - "${fpy} == 0.0 (first effective insertion failed) AND ${bins} == {\"2\": 1} (voided pass excluded)"
            - "Unit.${u1}.test_status == FAILED AND retest_count == 0 (void does not manufacture a retest)"

      - name: unit_projection_replay_after_retest_void
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.unit_tally_projection
          - state_machines.Unit
        distinguishing_aspect: "Voiding a passing retest replays the unit back to FAILED with its earlier bin; retest_count is preserved (history is not rewritten)."
        test_recipe:
          setup: ["Lot of 1 IN_TEST; unit soft-fail (bin 2), authorized retest passed (bin 1)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ReplayCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-213", bin_map: { "1": "PASS", "2": "SOFT_FAIL" }, max_retests_per_unit: 2, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-RP", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-213", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "RP-1" }, as: OperationsManager, as_user_id: "ops-1", captures: { u1: $.data.id } }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/start-test", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 2 }, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/retest-authorizations", payload: { unit_id: "${u1}", reason: "retry" }, as: TestEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/test-results", payload: { unit_id: "${u1}", fixture_id: "${fix}", bin_code: 1 }, as: TestEngineer, as_user_id: "eng-1", captures: { r_pass: $.data.id } }
          trigger:
            - { call: "POST /api/test-results/${r_pass}/void", payload: { reason: "operator misread" }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /api/units/${u1}", as: QualityEngineer, as_user_id: "qe-1", captures: { st: $.data.test_status, bin: $.data.current_bin, rc: $.data.retest_count } }
          assert:
            - "${st} == FAILED AND ${bin} == 2 (replay over remaining results lands on the soft-fail)"
            - "${rc} == 1 (retest history preserved even though its result was voided)"

      - name: calibration_due_inclusive_boundary
        claim_type: constants_applied
        grounds:
          - calculations.equipment_calibration_status
        excluded_because:
          difficulty_instance: result_requires_equipment_in_service
          rationale: "The >= boundary at exactly next_calibration_due is asserted there (eq_due == 2026-05-01T00:00:00Z with status CALIBRATION_DUE)."

      - name: profile_duration_pinned_rounding
        claim_type: precision
        grounds:
          - calculations.burn_in_profile_duration
        excluded_because:
          difficulty_instance: burn_in_profile_duration_segment_rounding
          rationale: "Pinned per-segment-then-sum rounding order is the subject of that instance (92 vs 93)."

      - name: utilization_basis_variants
        claim_type: variant_divergence
        grounds:
          - calculations.chamber_utilization
        excluded_because:
          difficulty_instance: chamber_utilization_scheduled_vs_actual_diverge
          rationale: "Both variants computed and asserted with literal ratios there."

      - name: disposition_suggestion_branch_coverage
        claim_type: variant_selection
        grounds:
          - calculations.disposition_suggestion
        excluded_because:
          difficulty_instance: disposition_suggestion_three_branch_nested
          rationale: "SHIP / MRB_REVIEW / SCRAP_REVIEW branches all asserted with literal FPY inputs there."

      - name: lot_yield_dual_variants
        claim_type: variant_divergence
        grounds:
          - calculations.lot_yield_metrics
        excluded_because:
          difficulty_instance: lot_yield_first_pass_vs_final_diverge
          rationale: "FIRST_PASS 0.5 vs FINAL 0.75 asserted on identical data there."

      - name: slot_ledger_compensation
        claim_type: correct_result
        grounds:
          - calculations.chamber_slot_ledger
        excluded_because:
          difficulty_instance: chamber_slot_ledger_reserve_cancel_invariant
          rationale: "Reserve/cancel ledger conservation asserted step-by-step there."

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: get_nonexistent_lot_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A well-formed but absent lot id returns ERR_NOT_FOUND (404), not a state or request error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without the X-User-Role / X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "Sent with auth headers stripped in code: ${err} == ERR_UNAUTHENTICATED (p1 fires before existence p3, so no 404 leaks)"

      - name: foreign_customer_scope_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_OWNERSHIP]
        distinguishing_aspect: "CustomerRep of customer A passing customer_id of customer B is rejected ERR_FORBIDDEN_OWNERSHIP (403)."
        test_recipe:
          setup: ["Customers A and B exist; program released for B"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "CustA", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { custA: $.data.id } }
            - { call: "POST /api/customers", payload: { name: "CustB", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { custB: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${custB}", part_number: "PN-214", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-FO", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
          trigger:
            - { call: "POST /api/lots", payload: { customer_id: "${custB}", part_number: "PN-214", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${custA}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_OWNERSHIP (X-User-ID custA cannot create lots under custB)"

      - name: reservation_window_inverted_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "end_at <= start_at is malformed input (ERR_INVALID_REQUEST 400), checked before any overlap scan."
        test_recipe:
          setup: ["QUEUED lot; chamber ONLINE class A; clock 2026-06-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "WinCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-215", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-W2", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/release", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/lots", payload: { customer_id: "${cust}", part_number: "PN-215", quantity: 1, program_id: "${prog}" }, as: CustomerRep, as_user_id: "${cust}", captures: { lot: $.data.id } }
            - { call: "POST /api/units", payload: { lot_id: "${lot}", serial_number: "W-1" }, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/lots/${lot}/enqueue", payload: {}, as: OperationsManager, as_user_id: "ops-1" }
            - { call: "POST /api/chambers", payload: { name: "CH-W", area_code: "AREA-W", slot_count: 4, supported_profile_classes: ["A"] }, as: OperationsManager, as_user_id: "ops-1", captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsManager, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /api/chamber-reservations", payload: { chamber_id: "${ch}", lot_id: "${lot}", fixture_id: "${fix}", profile_class: "A", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T10:00:00Z", slot_count: 1 }, as: OperationsManager, as_user_id: "ops-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (end before start)"

      - name: profile_not_supported_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_PROFILE_NOT_SUPPORTED]
        distinguishing_aspect: "profile_class C on a chamber supporting only [A] fails ERR_PROFILE_NOT_SUPPORTED after temporal and referential checks pass."
        test_recipe:
          setup: ["QUEUED lot; chamber supporting only class A; clock 2026-06-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "ProfCo", tier: "STANDARD", requires_esd_certification: false }, as: OperationsManager, as_user_id: "ops-1", captures: { cust: $.data.id } }
            - { call: "POST /api/test-programs", payload: { customer_id: "${cust}", part_number: "PN-216", bin_map: { "1": "PASS" }, max_retests_per_unit: 1, burn_profile: [ { target_temp_c: 55, ramp_rate_c_per_min: 7, soak_minutes: 30 } ] }, as: TestEngineer, as_user_id: "eng-1", captures: { prog: $.data.id } }
            - { call: "POST /api/fixtures", payload: { program_id: "${prog}", serial_number: "FX-PR", site_count: 2 }, as: TestEngineer, as_user_id: "eng-1", captures: { fix: $.data.id } }
            - { call: "POST /api/fixtures/${fix}/commission", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
            - { call: "POST /api/test-programs/${prog}/validate", payload: {}, as: TestEngineer, as_user_id: "eng-1" }
