# =============================================================================
# Tree Service & Arborist — PRD Benchmark Scaffold (Expert)
# Sections §1.0–§1.7 (+ complexity_profile, concurrency_rules).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Tree Service & Arborist: estimate & hazard assessment, permit (protected/heritage tree),
  crew & equipment scheduling (crane/chipper), per-job vs hourly pricing, stump-grinding &
  haul-off add-on, utility-line clearance, storm emergency, debris disposal.

domain_name: tree-service-arborist
api_prefix: ""
# Top-level resource collections are flat (each entity has /<collection> and /<collection>/{id}).
# WorkOrder's sub-resources (trees/estimates/permits/disposal-tickets) are addressed under
# /work-orders/{id}/... for natural reading; LineItem and Booking are flat top-level collections
# carrying FK fields in the body. An empty api_prefix lets every entity own a top-level segment.

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation        # per-job (lump bid) vs hourly (metered actuals)
    - optimistic_concurrency          # OCC on WorkOrder.version for booking/quote supersede
    - cascading_side_effects          # cancel/decline cascades across trees, bookings, disposal, ledger
    - rate_threshold_triggers         # utility-clearance surcharge, hazard tier surcharge, overtime tier

  entity_topology: hybrid
  # WorkOrder owns nested sub-resources (TreeAsset, Estimate, Permit, DisposalTicket) addressed
  # under /work-orders/{id}/...; LineItem (child of Estimate) and Booking (cross-aggregate) are
  # flat top-level collections carrying FK fields in the body; Crew/Equipment/ServiceArea are flat
  # peers referenced by FK.

  state_machine_shape: branching
  # WorkOrder forks SCHEDULED → {COMPLETED, CANCELLED} with divergent side-effect sets;
  # Permit has a revision cycle (UNDER_REVIEW → CHANGES_REQUESTED → UNDER_REVIEW);
  # Estimate supports decline→redraft loop.

  relationship_patterns:
    - one_to_many        # WorkOrder → TreeAsset / Estimate / Permit / DisposalTicket; Estimate → LineItem
    - cross_aggregate    # Booking references WorkOrder + (Crew | Equipment) across aggregate boundaries
    - polymorphic        # Booking.resource_kind selects Crew vs Equipment target

  role_model: peer_roles
  # Dispatcher owns scheduling/bookings; Arborist owns hazard assessment + estimates + permits;
  # FinanceClerk owns disposal finalization + invoicing; Client owns acceptance/decline of estimates.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ServiceArea
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Region display name" }
      - { name: region_code, type: string, source: input, description: "Short region code, e.g. 'NW-01'" }
      - { name: disposal_fee_cents_per_ton, type: integer, source: input, description: "Landfill/recycling tipping fee per ton of debris, in integer cents", constraints: ">= 0" }
      - { name: requires_permit_authority, type: boolean, source: input, default: true, description: "Whether protected/heritage trees in this area require a municipal permit before removal" }
      - { name: heritage_surcharge_pct, type: number, source: input, default: 0.15, description: "Fractional surcharge applied to per-job estimates that include any heritage tree removal (e.g. 0.15 = 15%)", constraints: ">= 0" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: service_area_id, type: string, source: input, description: "FK -> ServiceArea.id; home region of the crew" }
      - { name: name, type: string, source: input, description: "Crew display name" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Billable labor rate per crew-hour, integer cents", constraints: "> 0" }
      - { name: certified_utility_clearance, type: boolean, source: input, default: false, description: "True if crew is line-clearance-certified and may work within the utility buffer" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RETIRED; managed by state machine", constraints: "AVAILABLE, RETIRED" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: service_area_id, type: string, source: input, description: "FK -> ServiceArea.id; home region of the equipment" }
      - { name: kind, type: enum, source: input, description: "CRANE | CHIPPER | STUMP_GRINDER", constraints: "CRANE, CHIPPER, STUMP_GRINDER" }
      - { name: name, type: string, source: input, description: "Equipment display/asset tag" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Billable equipment rate per hour, integer cents", constraints: "> 0" }
      - { name: mobilization_buffer_minutes, type: integer, source: input, default: 30, description: "Setup/teardown buffer that must separate two bookings of this equipment unit (CRANE units carry a non-zero buffer; others may be 0)", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RETIRED; managed by state machine", constraints: "AVAILABLE, RETIRED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_area_id, type: string, source: input, description: "FK -> ServiceArea.id; region governing permits and disposal fees" }
      - { name: client_user_id, type: string, source: input, description: "Opaque Client identifier (X-User-ID of the Client who owns this work order); used for ownership checks" }
      - { name: site_address, type: string, source: input, description: "Free-text job site address" }
      - { name: pricing_mode, type: enum, source: input, description: "PER_JOB (accepted lump-sum bid) | HOURLY (metered crew+equipment actuals)", constraints: "PER_JOB, HOURLY" }
      - { name: is_emergency, type: boolean, source: input, default: false, description: "True for storm-emergency dispatch; raises priority and applies emergency multiplier to the estimate" }
      - { name: hazard_level, type: enum, source: computed, description: "LOW | MODERATE | SEVERE — max hazard tier over the work order's TreeAsset children; recomputed on tree add/remove", constraints: "LOW, MODERATE, SEVERE" }
      - { name: requires_permit, type: boolean, source: computed, description: "True iff any child TreeAsset is protected or heritage AND ServiceArea.requires_permit_authority is true" }
      - { name: accepted_estimate_id, type: string, source: computed, description: "FK -> Estimate.id; the Estimate the Client accepted (null until acceptance); pins the contracted price for PER_JOB" }
      - { name: labor_cost_accrued_cents, type: integer, source: computed, description: "Running sum of finalized Booking.billed_cost_cents for this work order (HOURLY actuals ledger); starts 0" }
      - { name: disposal_cost_accrued_cents, type: integer, source: computed, description: "Running sum of finalized DisposalTicket.fee_cents for this work order; starts 0" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Total billed to client on completion; PER_JOB vs HOURLY computed differently — see calculations.final_invoice", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSESSED | QUOTED | SCHEDULED | COMPLETED | CANCELLED; managed by state machine", constraints: "DRAFT, ASSESSED, QUOTED, SCHEDULED, COMPLETED, CANCELLED" }

  - name: TreeAsset
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent work order" }
      - { name: species, type: string, source: input, description: "Tree species common name" }
      - { name: dbh_inches, type: number, source: input, description: "Diameter at breast height, inches; drives removal base cost and hazard tier", constraints: "> 0" }
      - { name: is_protected, type: boolean, source: input, default: false, description: "Municipally protected species/specimen requiring a permit before removal" }
      - { name: is_heritage, type: boolean, source: input, default: false, description: "Designated heritage tree; implies protected and triggers heritage surcharge on per-job pricing" }
      - { name: near_utility_line, type: boolean, source: input, default: false, description: "Crown/trunk within the utility-clearance buffer; bookings on this work order then require a line-clearance-certified crew" }
      - { name: lean_degrees, type: number, source: input, default: 0, description: "Lean from vertical in degrees; combines with dbh and decay to set hazard tier", constraints: ">= 0" }
      - { name: has_visible_decay, type: boolean, source: input, default: false, description: "Visible structural decay; bumps hazard tier" }
      - { name: hazard_score, type: number, source: computed, description: "Per-tree hazard score; see calculations.tree_hazard_score" }
      - { name: hazard_tier, type: enum, source: computed, description: "LOW | MODERATE | SEVERE for this tree from hazard_score thresholds", constraints: "LOW, MODERATE, SEVERE" }

  - name: Estimate
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent work order" }
      - { name: pricing_mode, type: enum, source: system, description: "Copied from WorkOrder.pricing_mode at draft time", constraints: "PER_JOB, HOURLY" }
      - { name: line_items_subtotal_cents, type: integer, source: computed, description: "Sum of child LineItem.extended_cost_cents" }
      - { name: hazard_surcharge_cents, type: integer, source: computed, description: "Hazard-tier surcharge applied over the subtotal; see calculations.estimate_total" }
      - { name: heritage_surcharge_cents, type: integer, source: computed, description: "Heritage surcharge applied when any heritage tree removal line is present (PER_JOB only)" }
      - { name: utility_surcharge_cents, type: integer, source: computed, description: "Flat per-tree utility-clearance surcharge for trees near utility lines" }
      - { name: emergency_multiplier_applied, type: boolean, source: computed, description: "True when WorkOrder.is_emergency caused the emergency multiplier to be applied to this estimate" }
      - { name: total_cents, type: integer, source: computed, description: "Final estimate amount the client sees; see calculations.estimate_total" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACCEPTED | DECLINED | SUPERSEDED; managed by state machine", constraints: "DRAFT, ISSUED, ACCEPTED, DECLINED, SUPERSEDED" }

  - name: LineItem
    parent: Estimate
    common_fields: true
    fields:
      - { name: estimate_id, type: string, source: input, description: "FK -> Estimate.id; parent estimate (supplied in POST /line-items body)" }
      - { name: tree_asset_id, type: string, source: input, description: "FK -> TreeAsset.id; the tree this line applies to (required for REMOVAL/STUMP_GRINDING; null for HAUL_OFF/UTILITY_CLEARANCE)", default: null }
      - { name: service_type, type: enum, source: input, description: "REMOVAL | STUMP_GRINDING | HAUL_OFF | UTILITY_CLEARANCE", constraints: "REMOVAL, STUMP_GRINDING, HAUL_OFF, UTILITY_CLEARANCE" }
      - { name: quantity, type: number, source: input, description: "Units: tree-count for REMOVAL/UTILITY_CLEARANCE (1), stump-diameter inches for STUMP_GRINDING, debris tons for HAUL_OFF", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: computed, description: "Per-unit cost resolved from service_type and (for REMOVAL) the tree's dbh tier" }
      - { name: extended_cost_cents, type: integer, source: computed, description: "Rounded line cost; see calculations.line_item_cost (rounding order pinned there)" }

  - name: Permit
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent work order" }
      - { name: authority_ref, type: string, source: input, description: "Municipal permit reference/number" }
      - { name: covers_heritage, type: boolean, source: input, default: false, description: "True if this permit application covers at least one heritage tree" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times the permit cycled back through CHANGES_REQUESTED; starts 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | CHANGES_REQUESTED | APPROVED | DENIED; managed by state machine", constraints: "DRAFT, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED, DENIED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; work order this booking serves" }
      - { name: resource_kind, type: enum, source: input, description: "CREW | EQUIPMENT — selects which resource type this booking occupies", constraints: "CREW, EQUIPMENT" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; required when resource_kind=CREW, else null", default: null }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; required when resource_kind=EQUIPMENT, else null", default: null }
      - { name: start_at, type: datetime, source: input, description: "Booking window start, ISO 8601 UTC" }
      - { name: end_at, type: datetime, source: input, description: "Booking window end, ISO 8601 UTC; must be strictly after start_at" }
      - { name: expected_work_order_version, type: integer, source: input, description: "OCC: WorkOrder.version the client last observed; rejected if stale" }
      - { name: actual_hours, type: number, source: input, description: "Metered hours recorded at finalization (HOURLY); set via finalize endpoint", default: null }
      - { name: billed_cost_cents, type: integer, source: computed, description: "Finalized labor/equipment cost = round(rate_cents_per_hour * actual_hours); folded into WorkOrder.labor_cost_accrued_cents" }
      - { name: status, type: enum, source: system, description: "RESERVED | FINALIZED | RELEASED; managed by state machine", constraints: "RESERVED, FINALIZED, RELEASED" }

  - name: DisposalTicket
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent work order" }
      - { name: debris_tons, type: number, source: input, description: "Weight of debris hauled off, tons", constraints: "> 0" }
      - { name: fee_cents, type: integer, source: computed, description: "round(debris_tons * ServiceArea.disposal_fee_cents_per_ton); folded into WorkOrder.disposal_cost_accrued_cents on finalize" }
      - { name: status, type: enum, source: system, description: "RECORDED | FINALIZED | VOIDED; managed by state machine", constraints: "RECORDED, FINALIZED, VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- WorkOrder: branching fork-join (SCHEDULED → {COMPLETED, CANCELLED}) ----
  - entity: WorkOrder
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ASSESSED
        trigger: "POST /work-orders/{id}/assess"
        actor: Arborist
        preconditions:
          - "At least one TreeAsset child exists (ERR_NO_TREES_ASSESSED)"
        side_effects:
          - "Recompute hazard_score + hazard_tier for every child TreeAsset (calculations.tree_hazard_score)"
          - "Set WorkOrder.hazard_level = max child hazard_tier"
          - "Set WorkOrder.requires_permit per calculations rule"
          - "increments WorkOrder.version by 1"

      - from: ASSESSED
        to: QUOTED
        trigger: "POST /work-orders/{id}/estimates/{estimateId}/issue"
        actor: Arborist
        preconditions:
          - "Estimate is in DRAFT (ERR_ESTIMATE_NOT_DRAFT)"
          - "Estimate has at least one LineItem (ERR_ESTIMATE_EMPTY)"
        side_effects:
          - "Estimate.status DRAFT → ISSUED"
          - "WorkOrder.status ASSESSED → QUOTED"
          - "increments WorkOrder.version by 1"

      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/estimates/{estimateId}/accept"
        actor: Client
        preconditions:
          - "Estimate is in ISSUED (ERR_ESTIMATE_NOT_ISSUED)"
          - "If WorkOrder.requires_permit, an APPROVED Permit exists on this work order (ERR_PERMIT_REQUIRED) — checked at priority 10, BEFORE the ownership check"
          - "Acting Client is WorkOrder.client_user_id owner (ERR_NOT_RESOURCE_OWNER) — checked at priority 11"
        side_effects:
          - "Estimate.status ISSUED → ACCEPTED"
          - "WorkOrder.accepted_estimate_id = this estimate id"
          - "All other ISSUED estimates on this work order → SUPERSEDED"
          - "WorkOrder.status QUOTED → SCHEDULED"
          - "increments WorkOrder.version by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "No Booking on this work order is still RESERVED (all must be FINALIZED or RELEASED) (ERR_OPEN_BOOKINGS)"
          - "No DisposalTicket on this work order is still RECORDED (ERR_OPEN_DISPOSAL)"
        side_effects:
          - "Compute WorkOrder.final_invoice_cents (calculations.final_invoice — PER_JOB vs HOURLY)"
          - "WorkOrder.status SCHEDULED → COMPLETED"
          - "increments WorkOrder.version by 1"
        note: "Fork branch A of SCHEDULED. Diverges from CANCELLED: COMPLETED bills the client and leaves bookings/tickets finalized; CANCELLED reverses everything."

      - from: [DRAFT, ASSESSED, QUOTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "WorkOrder not already terminal (ERR_WORK_ORDER_TERMINAL)"
        side_effects:
          - "Every RESERVED Booking on this work order → RELEASED (frees that resource's calendar window)"
          - "Every RECORDED DisposalTicket on this work order → VOIDED"
          - "Every ISSUED/DRAFT Estimate on this work order → SUPERSEDED"
          - "WorkOrder.final_invoice_cents set to 0"
          - "WorkOrder.status → CANCELLED"
          - "increments WorkOrder.version by 1"
        note: "Fork branch B of SCHEDULED (also reachable from earlier states). Compensating branch: nothing is billed; the cancel→release→free-calendar chain must leave each resource's reserved-minutes total unchanged vs before the work order existed."

  # ---- Permit: revision cycle (UNDER_REVIEW ⇄ CHANGES_REQUESTED) ----
  - entity: Permit
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /work-orders/{id}/permits/{permitId}/submit"
        actor: Arborist
        preconditions:
          - "WorkOrder.requires_permit is true (ERR_PERMIT_NOT_REQUIRED)"
        side_effects:
          - "Permit.status DRAFT → UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /work-orders/{id}/permits/{permitId}/request-changes"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "Permit.status UNDER_REVIEW → CHANGES_REQUESTED"
          - "Permit.revision_count += 1"
        note: "Revision loop back-edge: a permit may cycle UNDER_REVIEW → CHANGES_REQUESTED → UNDER_REVIEW any number of times; each round bumps revision_count."

      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /work-orders/{id}/permits/{permitId}/submit"
        actor: Arborist
        preconditions:
          - "WorkOrder.requires_permit is true (ERR_PERMIT_NOT_REQUIRED)"
        side_effects:
          - "Permit.status CHANGES_REQUESTED → UNDER_REVIEW"
        note: "Forward edge of the revision cycle (resubmit after changes)."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /work-orders/{id}/permits/{permitId}/decide"
        actor: Dispatcher
        preconditions:
          - "decision == APPROVE"
        side_effects:
          - "Permit.status UNDER_REVIEW → APPROVED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /work-orders/{id}/permits/{permitId}/decide"
        actor: Dispatcher
        preconditions:
          - "decision == DENY"
        side_effects:
          - "Permit.status UNDER_REVIEW → DENIED"

  # ---- Estimate: decline→redraft loop (ISSUED → DECLINED, supersede) ----
  - entity: Estimate
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /work-orders/{id}/estimates/{estimateId}/issue"
        actor: Arborist
        preconditions:
          - "Estimate has at least one LineItem (ERR_ESTIMATE_EMPTY)"
        side_effects:
          - "Recompute all surcharges and total_cents (calculations.estimate_total)"
          - "Estimate.status DRAFT → ISSUED"

      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /work-orders/{id}/estimates/{estimateId}/accept"
        actor: Client
        preconditions:
          - "Estimate is ISSUED (ERR_ESTIMATE_NOT_ISSUED)"
          - "If WorkOrder.requires_permit, an APPROVED Permit exists (ERR_PERMIT_REQUIRED) — priority 10"
          - "Acting Client owns the work order (ERR_NOT_RESOURCE_OWNER) — priority 11"
        side_effects:
          - "Sibling ISSUED estimates → SUPERSEDED"
          - "WorkOrder transition QUOTED → SCHEDULED"

      - from: ISSUED
        to: DECLINED
        trigger: "POST /work-orders/{id}/estimates/{estimateId}/decline"
        actor: Client
        preconditions:
          - "Acting Client owns the work order (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Estimate.status ISSUED → DECLINED"
        note: "Redraft loop: after a decline the Arborist may POST a fresh DRAFT estimate and issue it again while WorkOrder stays in QUOTED; the work order is not forced backward."

      - from: [DRAFT, ISSUED]
        to: SUPERSEDED
        trigger: "system (sibling estimate accepted, or work order cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Booking: linear with release compensation ----
  - entity: Booking
    field: status
    initial_state: RESERVED
    terminal_states: [FINALIZED, RELEASED]
    transitions:
      - from: RESERVED
        to: FINALIZED
        trigger: "POST /bookings/{id}/finalize"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.status == SCHEDULED (ERR_WORK_ORDER_NOT_SCHEDULED)"
          - "actual_hours > 0 (ERR_INVALID_ACTUAL_HOURS)"
        side_effects:
          - "Set Booking.billed_cost_cents = round(resource hourly_rate_cents * actual_hours) (calculations.booking_billed_cost)"
          - "WorkOrder.labor_cost_accrued_cents += Booking.billed_cost_cents"
          - "increments WorkOrder.version by 1"
        note: "Cross-entity: the resource's per-hour rate (Crew.hourly_rate_cents or Equipment.hourly_rate_cents per resource_kind) flows into the WorkOrder ledger."

      - from: RESERVED
        to: RELEASED
        trigger: "POST /bookings/{id}/release  OR  system (work order cancelled)"
        actor: Dispatcher
        preconditions:
          - "Booking is RESERVED (ERR_BOOKING_NOT_RESERVED)"
        side_effects:
          - "Frees the resource's occupied window (the booking no longer participates in overlap checks)"
        note: "Compensation: a RESERVED→RELEASED restores the resource's reserved-window total to exactly its pre-booking value (no ledger touched because RESERVED was never billed)."

  # ---- DisposalTicket: linear with void compensation ----
  - entity: DisposalTicket
    field: status
    initial_state: RECORDED
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: RECORDED
        to: FINALIZED
        trigger: "POST /work-orders/{id}/disposal-tickets/{ticketId}/finalize"
        actor: FinanceClerk
        preconditions:
          - "WorkOrder.status == SCHEDULED (ERR_WORK_ORDER_NOT_SCHEDULED)"
        side_effects:
          - "Set DisposalTicket.fee_cents = round(debris_tons * ServiceArea.disposal_fee_cents_per_ton)"
          - "WorkOrder.disposal_cost_accrued_cents += DisposalTicket.fee_cents"
          - "increments WorkOrder.version by 1"

      - from: RECORDED
        to: VOIDED
        trigger: "POST /work-orders/{id}/disposal-tickets/{ticketId}/void  OR  system (work order cancelled)"
        actor: FinanceClerk
        preconditions:
          - "Ticket is RECORDED (ERR_TICKET_NOT_RECORDED)"
        side_effects: []
        note: "Compensation: voiding a RECORDED (never-finalized) ticket leaves WorkOrder.disposal_cost_accrued_cents unchanged."

  # ---- Crew / Equipment: retire lifecycle ----
  - entity: Crew
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /crews/{id}/retire"
        actor: Dispatcher
        preconditions:
          - "Crew has no RESERVED Booking (ERR_RESOURCE_HAS_RESERVATIONS)"
        side_effects: []

  - entity: Equipment
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /equipment/{id}/retire"
        actor: Dispatcher
        preconditions:
          - "Equipment has no RESERVED Booking (ERR_RESOURCE_HAS_RESERVATIONS)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on WorkOrder.version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /bookings"
    occ_field: "expected_work_order_version"
    description: |
      Creating a Booking against a WorkOrder whose version has advanced since the
      client last observed it is rejected. A booking finalize, a sibling booking
      create, a disposal-ticket finalize, or an estimate acceptance each legitimately
      bump WorkOrder.version; a client whose carried expected_work_order_version is
      below the current version holds a stale view of the schedule and budget context,
      so the create is refused on stale version.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- (Rule 2 mode a: ≥3 inputs, non-linear interaction; Rule 6 boundary) ----
  - name: tree_hazard_score
    trigger: "POST /work-orders/{id}/assess (per child TreeAsset); also on TreeAsset create while WorkOrder is DRAFT"
    algorithm: weighted_scoring
    formula: |
      # Three inputs interact non-linearly via tiered dbh contribution + additive flags,
      # then the score is bucketed into a tier with strict thresholds.
      dbh_component =
          if dbh_inches >= 36: 50
          elif dbh_inches >= 18: 30      # 18.0 lands here (>=), 17.999 lands below
          else: 10
      lean_component = min(30, floor(lean_degrees / 5) * 10)   # 0,10,20,30 capped
      decay_component = 20 if has_visible_decay else 0
      hazard_score = dbh_component + lean_component + decay_component
      # Tier thresholds (strict boundaries):
      hazard_tier =
          SEVERE   if hazard_score >= 70
          MODERATE if hazard_score >= 40      # exactly 40 → MODERATE
          else LOW
    input_set: "Single TreeAsset row; dbh_inches, lean_degrees, has_visible_decay."
    constants:
      DBH_TIER_LARGE_IN: 36
      DBH_TIER_MED_IN: 18
      LEAN_STEP_DEG: 5
      LEAN_CAP: 30
      DECAY_POINTS: 20
      TIER_SEVERE_MIN: 70
      TIER_MODERATE_MIN: 40
    precision: "integer score; tiers by >= thresholds"
    note: "Rule-6 boundary metric A: dbh_inches at exactly 18.0 vs 17.999 flips dbh_component 30↔10; hazard_score 40 boundary flips tier MODERATE↔LOW."

  # ---- (Rule 1 dual-variant #1: LineItem unit cost — REMOVAL tiered by dbh) ----
  - name: line_item_cost
    trigger: "On LineItem create/update while parent Estimate is DRAFT; recomputed on estimate issue"
    algorithm: tiered_pricing
    formula: |
      # unit_cost_cents resolved by service_type:
      if service_type == REMOVAL:
          # tiered by the referenced TreeAsset.dbh_inches (marginal NOT applied —
          # whole tree billed at the tier its dbh falls in):
          unit_cost_cents =
              REMOVAL_LARGE_CENTS  if tree.dbh_inches >= 36
              REMOVAL_MED_CENTS    if tree.dbh_inches >= 18
              REMOVAL_SMALL_CENTS  otherwise
          # quantity is always 1 for REMOVAL
      elif service_type == STUMP_GRINDING:
          unit_cost_cents = STUMP_CENTS_PER_INCH      # quantity = stump diameter inches
      elif service_type == HAUL_OFF:
          unit_cost_cents = HAUL_OFF_CENTS_PER_TON     # quantity = debris tons
      elif service_type == UTILITY_CLEARANCE:
          unit_cost_cents = UTILITY_LINE_ITEM_CENTS    # quantity = 1
      # extended_cost_cents: PIN ROUNDING ORDER — round each line independently here,
      # then the estimate subtotal sums these already-rounded integers (see estimate_total).
      raw = unit_cost_cents * quantity
      extended_cost_cents = round_half_up(raw)   # raw is integer-cents * possibly-fractional qty
    input_set: "Single LineItem; for REMOVAL also its referenced TreeAsset.dbh_inches."
    constants:
      REMOVAL_SMALL_CENTS: 45000
      REMOVAL_MED_CENTS: 95000
      REMOVAL_LARGE_CENTS: 180000
      STUMP_CENTS_PER_INCH: 1200
      HAUL_OFF_CENTS_PER_TON: 8500
      UTILITY_LINE_ITEM_CENTS: 60000
    precision: "integer cents, round_half_up, per-line"
    note: "Dual-variant #1 lives at estimate level (see estimate_total variants); this rule pins per-line rounding."

  # ---- (Rule 2 mode b: nested rounding order pinned; Rule 1 dual-variant on Estimate) ----
  - name: estimate_total
    trigger: "POST /work-orders/{id}/estimates/{estimateId}/issue (and on LineItem mutation while DRAFT)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER (pinned): round PER LINE first (line_item_cost), SUM the rounded
      # integers into the subtotal, THEN apply surcharge percentages to the integer
      # subtotal and round each surcharge once. "Round-per-line-then-sum", NOT "sum-then-round".
      line_items_subtotal_cents = sum(li.extended_cost_cents for li in line_items)   # already-rounded ints

      # hazard surcharge: tier of the WHOLE work order (WorkOrder.hazard_level)
      hazard_pct =
          0.20 if work_order.hazard_level == SEVERE
          0.10 if work_order.hazard_level == MODERATE
          0.00 otherwise
      hazard_surcharge_cents = round_half_up(line_items_subtotal_cents * hazard_pct)

      # utility surcharge: flat per tree that is near_utility_line AND has a REMOVAL/UTILITY line
      utility_surcharge_cents = UTILITY_PER_TREE_CENTS * (count of distinct near_utility_line trees referenced by line items)

      # heritage surcharge: PER_JOB only, when any REMOVAL line references a heritage tree
      heritage_surcharge_cents =
          round_half_up(line_items_subtotal_cents * service_area.heritage_surcharge_pct)
            if pricing_mode == PER_JOB and any heritage-tree REMOVAL line
          else 0

      pre_emergency = line_items_subtotal_cents + hazard_surcharge_cents
                      + utility_surcharge_cents + heritage_surcharge_cents

      # emergency multiplier applied LAST, over the already-surcharged + rounded subtotal:
      if work_order.is_emergency:
          total_cents = round_half_up(pre_emergency * EMERGENCY_MULTIPLIER)
          emergency_multiplier_applied = true
      else:
          total_cents = pre_emergency
          emergency_multiplier_applied = false
    input_set: "All LineItem children of the Estimate (already-rounded extended_cost_cents); WorkOrder.hazard_level, is_emergency, pricing_mode; ServiceArea.heritage_surcharge_pct."
    constants:
      HAZARD_PCT_SEVERE: 0.20
      HAZARD_PCT_MODERATE: 0.10
      UTILITY_PER_TREE_CENTS: 25000
      EMERGENCY_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up; round-per-line-then-sum, surcharges rounded individually, emergency applied last"
    variants:
      - name: per_job_estimate
        when: "pricing_mode == PER_JOB"
        difference: "heritage_surcharge_cents may be non-zero; total_cents is the binding contract price the client accepts and is what final_invoice_cents uses verbatim on completion (actual booking/disposal costs do NOT change the invoice)."
      - name: hourly_estimate
        when: "pricing_mode == HOURLY"
        difference: "heritage_surcharge_cents is forced to 0 (heritage premium is folded into metered hours, not the quote); total_cents is a non-binding planning figure — the real invoice is metered actuals (labor_cost_accrued + disposal_cost_accrued + surcharges) at completion, NOT this total."

  # ---- (Rule 1 dual-variant #2 — different entity domain: WorkOrder invoice) ----
  - name: final_invoice
    trigger: "POST /work-orders/{id}/complete"
    algorithm: dual_variant
    formula: |
      if pricing_mode == PER_JOB:
          # Forward-looking: the accepted estimate's contract price stands, regardless of
          # what labor/disposal actually cost.
          final_invoice_cents = accepted_estimate.total_cents
      else:  # HOURLY
          # Chronological actuals: bill what was metered + recorded.
          final_invoice_cents = labor_cost_accrued_cents
                              + disposal_cost_accrued_cents
                              + hazard_surcharge_on_accrued
          where hazard_surcharge_on_accrued =
              round_half_up( (labor_cost_accrued_cents + disposal_cost_accrued_cents) * hazard_pct )
              and hazard_pct = 0.20 SEVERE / 0.10 MODERATE / 0.00 otherwise (WorkOrder.hazard_level)
    input_set: "PER_JOB: WorkOrder.accepted_estimate_id → Estimate.total_cents. HOURLY: WorkOrder.labor_cost_accrued_cents + disposal_cost_accrued_cents + hazard surcharge over those accruals."
    constants:
      HAZARD_PCT_SEVERE: 0.20
      HAZARD_PCT_MODERATE: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: per_job_invoice
        when: "pricing_mode == PER_JOB"
        difference: "Uses the frozen accepted estimate price; ignores actual labor/disposal accruals entirely."
      - name: hourly_invoice
        when: "pricing_mode == HOURLY"
        difference: "Ignores any estimate; sums finalized booking + disposal ledgers and applies hazard surcharge over the accruals — same inputs, opposite algorithm to PER_JOB."

  # ---- (Rule 2 mode c: circular-looking dependency; eval order pinned) ----
  - name: booking_billed_cost
    trigger: "POST /bookings/{bookingId}/finalize"
    algorithm: aggregation
    formula: |
      # rate depends on resource_kind selection (circular-looking: which rate? resolve first):
      rate_cents_per_hour =
          crew.hourly_rate_cents       if resource_kind == CREW
          equipment.hourly_rate_cents  if resource_kind == EQUIPMENT
      base = round_half_up(rate_cents_per_hour * actual_hours)

      # Overtime tier: hours beyond OT_THRESHOLD_HOURS in the SAME booking bill at 1.5x.
      # EVAL ORDER PINNED: compute regular portion and overtime portion separately,
      # round the COMBINED total once (not each portion), to avoid double-rounding drift.
      reg_hours = min(actual_hours, OT_THRESHOLD_HOURS)
      ot_hours  = max(0, actual_hours - OT_THRESHOLD_HOURS)
      billed_cost_cents = round_half_up(
          rate_cents_per_hour * reg_hours + rate_cents_per_hour * OT_MULTIPLIER * ot_hours )
    input_set: "Single Booking; resolved resource rate; actual_hours."
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up, single final rounding"
    note: "Rule-6 boundary metric B: actual_hours at exactly 8.0 (no OT) vs 8.001 (OT begins). Distinct endpoint from tree_hazard_score's dbh boundary."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (work_order, then estimate/permit/tree/disposal-ticket; booking/crew/equipment for their paths)"
    error_id: "ERR_WORK_ORDER_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_PERMIT_NOT_FOUND / ERR_TREE_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_DISPOSAL_TICKET_NOT_FOUND / ERR_CREW_NOT_FOUND / ERR_EQUIPMENT_NOT_FOUND / ERR_SERVICE_AREA_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "FK fields in the request body reference existing resources (service_area_id, work_order_id, crew_id, equipment_id, estimate_id, tree_asset_id)"
    error_id: "ERR_SERVICE_AREA_NOT_FOUND / ERR_WORK_ORDER_NOT_FOUND / ERR_CREW_NOT_FOUND / ERR_EQUIPMENT_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_TREE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /crews, POST /equipment, POST /work-orders, POST /bookings, POST /line-items"

  - priority: 5
    category: business_constraint
    check: "Request body shape valid: required fields present, enum values legal, end_at strictly after start_at, quantity/dbh/hours positive, resource_kind matches which of crew_id/equipment_id is supplied"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_ENUM / ERR_INVALID_TIME_WINDOW / ERR_RESOURCE_KIND_MISMATCH"
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_work_order_version matches current WorkOrder.version (booking create)"
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
    applies_to: "POST /bookings"

  - priority: 7
    category: state
    check: "Target resource is in the correct state for the requested transition (work order / estimate / permit / booking / disposal-ticket / crew / equipment)"
    error_id: "ERR_WORK_ORDER_TERMINAL / ERR_WORK_ORDER_NOT_SCHEDULED / ERR_ESTIMATE_NOT_DRAFT / ERR_ESTIMATE_NOT_ISSUED / ERR_PERMIT_NOT_REQUIRED / ERR_BOOKING_NOT_RESERVED / ERR_TICKET_NOT_RECORDED / ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: state
    check: "Assess requires at least one TreeAsset; issue requires the estimate to be non-empty"
    error_id: "ERR_NO_TREES_ASSESSED / ERR_ESTIMATE_EMPTY"
    http_status: 409
    applies_to: "POST /work-orders/{id}/assess, POST /work-orders/{id}/estimates/{eid}/issue"

  # business priority within domain: SAFETY (utility/permit) before SCHEDULING (overlap) before FISCAL
  - priority: 9
    category: business_safety
    check: "Utility-line clearance: if any TreeAsset on the work order is near_utility_line, a CREW booking must use a crew with certified_utility_clearance=true"
    error_id: ERR_UTILITY_CLEARANCE_REQUIRED
    http_status: 422
    applies_to: "POST /bookings (resource_kind=CREW)"

  - priority: 10
    category: business_safety
    check: "Permit gate: accepting an estimate when WorkOrder.requires_permit is true and no APPROVED Permit exists on the work order"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/estimates/{eid}/accept"

  - priority: 11
    category: business_referential
    check: "Ownership: the acting Client on accept/decline must equal WorkOrder.client_user_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /work-orders/{id}/estimates/{eid}/accept, POST /work-orders/{id}/estimates/{eid}/decline"

  - priority: 12
    category: business_temporal
    check: "Crew booking overlap: a new CREW booking whose [start_at, end_at) half-open window intersects another RESERVED/FINALIZED booking of the SAME crew is rejected (adjacency at the shared endpoint is allowed: end==start does NOT overlap)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings (resource_kind=CREW)"

  - priority: 13
    category: business_temporal
    check: "Equipment booking overlap with mobilization buffer: a new EQUIPMENT booking is rejected if its window comes within Equipment.mobilization_buffer_minutes of another RESERVED/FINALIZED booking of the same unit (the buffer is added to BOTH sides; adjacency that would be legal for a crew is rejected for a buffered unit)"
    error_id: ERR_EQUIPMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings (resource_kind=EQUIPMENT)"

  - priority: 14
    category: business_referential
    check: "Resource region match: Booking's crew/equipment service_area_id must equal WorkOrder.service_area_id"
    error_id: ERR_RESOURCE_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 15
    category: business_constraint
    check: "Retire guard: a Crew/Equipment with any RESERVED booking cannot be retired"
    error_id: ERR_RESOURCE_HAS_RESERVATIONS
    http_status: 409
    applies_to: "POST /crews/{id}/retire, POST /equipment/{id}/retire"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- ServiceArea ----
  - method: POST
    path: "/service-areas"
    description: "Create a service area (region config)"
    roles: [Dispatcher]
    code: 201
    input: [name, region_code, disposal_fee_cents_per_ton, "requires_permit_authority?", "heritage_surcharge_pct?"]
    output: ServiceArea
    side_effects: []

  - method: GET
    path: "/service-areas"
    description: "List service areas"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceArea[]"
    side_effects: []

  - method: GET
    path: "/service-areas/{id}"
    description: "Get a service area"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: ServiceArea
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Register a crew"
    roles: [Dispatcher]
    code: 201
    input: [service_area_id, name, hourly_rate_cents, "certified_utility_clearance?"]
    output: Crew
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/crews"
    description: "List crews; reverse-reachability for Crew.service_area_id via service_area_id filter"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["service_area_id?", "limit?", "offset?"]
    output: "Crew[]"
    side_effects: []

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: POST
    path: "/crews/{id}/retire"
    description: "Retire a crew"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Crew
    side_effects: ["status → RETIRED (guarded by no RESERVED bookings)"]

  # ---- Equipment ----
  - method: POST
    path: "/equipment"
    description: "Register an equipment unit (crane/chipper/stump grinder)"
    roles: [Dispatcher]
    code: 201
    input: [service_area_id, kind, name, hourly_rate_cents, "mobilization_buffer_minutes?"]
    output: Equipment
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/equipment"
    description: "List equipment; reverse-reachability for Equipment.service_area_id via service_area_id filter"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["service_area_id?", "limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  - method: GET
    path: "/equipment/{id}"
    description: "Get an equipment unit"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: POST
    path: "/equipment/{id}/retire"
    description: "Retire an equipment unit"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Equipment
    side_effects: ["status → RETIRED (guarded by no RESERVED bookings)"]

  # ---- WorkOrder ----
  - method: POST
    path: "/work-orders"
    description: "Create a work order (DRAFT)"
    roles: [Dispatcher, Client]
    code: 201
    input: [service_area_id, client_user_id, site_address, pricing_mode, "is_emergency?"]
    output: WorkOrder
    side_effects: ["status=DRAFT, hazard_level=LOW, requires_permit=false, ledgers=0, version=1"]

  - method: GET
    path: "/work-orders"
    description: "List work orders; filters provide reverse-reachability for WorkOrder.service_area_id and WorkOrder.accepted_estimate_id"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["service_area_id?", "client_user_id?", "accepted_estimate_id?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order (includes computed ledgers and hazard_level)"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/assess"
    description: "Run hazard assessment; DRAFT → ASSESSED"
    roles: [Arborist]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["recompute every tree hazard_score/tier", "set hazard_level + requires_permit", "status → ASSESSED", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete the job; SCHEDULED → COMPLETED (fork branch A)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["compute final_invoice_cents (calculations.final_invoice)", "status → COMPLETED", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel the job (fork branch B); cascades release/void/supersede"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["RESERVED bookings → RELEASED", "RECORDED disposal tickets → VOIDED", "DRAFT/ISSUED estimates → SUPERSEDED", "final_invoice_cents=0", "status → CANCELLED", "increments WorkOrder.version by 1"]

  # ---- TreeAsset (sub-resource of WorkOrder) ----
  - method: POST
    path: "/work-orders/{id}/trees"
    description: "Add a tree to a DRAFT work order"
    roles: [Arborist, Dispatcher]
    code: 201
    input: [species, dbh_inches, "is_protected?", "is_heritage?", "near_utility_line?", "lean_degrees?", "has_visible_decay?"]
    output: TreeAsset
    side_effects: ["hazard_score/hazard_tier computed for the tree"]

  - method: GET
    path: "/work-orders/{id}/trees"
    description: "List trees on a work order (reverse-reachability for TreeAsset.work_order_id, sub-resource form)"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "TreeAsset[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/trees/{treeId}"
    description: "Get a tree"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: TreeAsset
    side_effects: []

  # ---- Estimate (sub-resource of WorkOrder) ----
  - method: POST
    path: "/work-orders/{id}/estimates"
    description: "Create a DRAFT estimate (requires WorkOrder in ASSESSED or QUOTED)"
    roles: [Arborist]
    code: 201
    input: []
    output: Estimate
    side_effects: ["status=DRAFT, pricing_mode copied from work order, totals=0"]

  - method: GET
    path: "/work-orders/{id}/estimates"
    description: "List estimates on a work order (reverse-reachability for Estimate.work_order_id, sub-resource form)"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/estimates/{estimateId}"
    description: "Get an estimate (includes all surcharge fields and total_cents)"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: Estimate
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/estimates/{estimateId}/issue"
    description: "Issue estimate; Estimate DRAFT → ISSUED and WorkOrder ASSESSED → QUOTED (first issue)"
    roles: [Arborist]
    code: 200
    input: []
    output: Estimate
    side_effects: ["recompute total_cents", "Estimate → ISSUED", "WorkOrder ASSESSED → QUOTED on first issue", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/work-orders/{id}/estimates/{estimateId}/accept"
    description: "Client accepts estimate; Estimate ISSUED → ACCEPTED, WorkOrder QUOTED → SCHEDULED"
    roles: [Client]
    code: 200
    input: []
    output: Estimate
    side_effects: ["sibling ISSUED estimates → SUPERSEDED", "WorkOrder.accepted_estimate_id set", "WorkOrder → SCHEDULED", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/work-orders/{id}/estimates/{estimateId}/decline"
    description: "Client declines estimate; ISSUED → DECLINED (work order stays QUOTED for redraft)"
    roles: [Client]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate → DECLINED"]

  # ---- LineItem (flat collection, FK estimate_id in body) ----
  - method: POST
    path: "/line-items"
    description: "Add a line item to a DRAFT estimate (estimate_id in body)"
    roles: [Arborist]
    code: 201
    input: [estimate_id, service_type, quantity, "tree_asset_id?"]
    output: LineItem
    side_effects: ["unit_cost_cents + extended_cost_cents computed (calculations.line_item_cost)", "parent estimate totals recomputed"]

  - method: GET
    path: "/line-items"
    description: "List line items; reverse-reachability for LineItem.estimate_id and LineItem.tree_asset_id via filters"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["estimate_id?", "tree_asset_id?", "limit?", "offset?"]
    output: "LineItem[]"
    side_effects: []

  - method: GET
    path: "/line-items/{id}"
    description: "Get a line item"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: LineItem
    side_effects: []

  # ---- Permit (sub-resource of WorkOrder) ----
  - method: POST
    path: "/work-orders/{id}/permits"
    description: "Create a DRAFT permit application"
    roles: [Arborist]
    code: 201
    input: ["authority_ref", "covers_heritage?"]
    output: Permit
    side_effects: ["status=DRAFT, revision_count=0"]

  - method: GET
    path: "/work-orders/{id}/permits"
    description: "List permits on a work order (reverse-reachability for Permit.work_order_id, sub-resource form)"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/permits/{permitId}"
    description: "Get a permit"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/permits/{permitId}/submit"
    description: "Submit/resubmit permit; DRAFT|CHANGES_REQUESTED → UNDER_REVIEW"
    roles: [Arborist]
    code: 200
    input: []
    output: Permit
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/work-orders/{id}/permits/{permitId}/request-changes"
    description: "Request changes; UNDER_REVIEW → CHANGES_REQUESTED (revision loop)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Permit
    side_effects: ["status → CHANGES_REQUESTED", "revision_count += 1"]

  - method: POST
    path: "/work-orders/{id}/permits/{permitId}/decide"
    description: "Decide permit; UNDER_REVIEW → APPROVED or DENIED"
    roles: [Dispatcher]
    code: 200
    input: [decision]
    output: Permit
    side_effects: ["status → APPROVED or DENIED per decision"]

  # ---- Booking (flat, cross-aggregate) ----
  - method: POST
    path: "/bookings"
    description: "Reserve a crew or equipment window for a work order (OCC on WorkOrder.version)"
    roles: [Dispatcher]
    code: 201
    input: [work_order_id, resource_kind, start_at, end_at, expected_work_order_version, "crew_id?", "equipment_id?"]
    output: Booking
    side_effects: ["status=RESERVED", "overlap + utility-clearance + region checks", "occupies the resource window", "increments WorkOrder.version by 1 (OCC: a subsequent create still carrying the prior version is then stale)"]

  - method: GET
    path: "/bookings"
    description: "List bookings; reverse-reachability for Booking.work_order_id, Booking.crew_id, Booking.equipment_id via filters"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["work_order_id?", "crew_id?", "equipment_id?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/bookings/{id}/finalize"
    description: "Finalize a booking with metered hours; RESERVED → FINALIZED"
    roles: [Dispatcher]
    code: 200
    input: [actual_hours]
    output: Booking
    side_effects: ["compute billed_cost_cents (calculations.booking_billed_cost)", "WorkOrder.labor_cost_accrued_cents += billed_cost_cents", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/bookings/{id}/release"
    description: "Release a reserved booking; RESERVED → RELEASED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects: ["status → RELEASED", "frees the resource window"]

  # ---- DisposalTicket (sub-resource of WorkOrder) ----
  - method: POST
    path: "/work-orders/{id}/disposal-tickets"
    description: "Record a debris haul-off disposal ticket"
    roles: [Dispatcher, FinanceClerk]
    code: 201
    input: [debris_tons]
    output: DisposalTicket
    side_effects: ["status=RECORDED, fee_cents=0 until finalize"]

  - method: GET
    path: "/work-orders/{id}/disposal-tickets"
    description: "List disposal tickets (reverse-reachability for DisposalTicket.work_order_id, sub-resource form)"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "DisposalTicket[]"
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/disposal-tickets/{ticketId}"
    description: "Get a disposal ticket"
    roles: [Dispatcher, Arborist, FinanceClerk, Client]
    code: 200
    input: []
    output: DisposalTicket
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/disposal-tickets/{ticketId}/finalize"
    description: "Finalize disposal ticket; RECORDED → FINALIZED"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: DisposalTicket
    side_effects: ["compute fee_cents", "WorkOrder.disposal_cost_accrued_cents += fee_cents", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/work-orders/{id}/disposal-tickets/{ticketId}/void"
    description: "Void a recorded disposal ticket; RECORDED → VOIDED"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: DisposalTicket
    side_effects: ["status → VOIDED (no ledger change)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_AUTH, http: 401, condition: "X-User-ID / X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Client is not the work order's client_user_id owner (accept/decline)" }

  # --- not found ---
  - { id: ERR_SERVICE_AREA_NOT_FOUND, http: 404, condition: "service_area_id does not resolve to a ServiceArea" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "crew id/crew_id does not resolve to a Crew" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "equipment id/equipment_id does not resolve to an Equipment" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "work order id/work_order_id does not resolve to a WorkOrder" }
  - { id: ERR_TREE_NOT_FOUND, http: 404, condition: "tree id/tree_asset_id does not resolve to a TreeAsset on the work order" }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "estimate id does not resolve to an Estimate on the work order" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permit id does not resolve to a Permit on the work order" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id does not resolve to a Booking" }
  - { id: ERR_DISPOSAL_TICKET_NOT_FOUND, http: 404, condition: "disposal-ticket id does not resolve to a DisposalTicket on the work order" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or wrong type" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an illegal value (pricing_mode, kind, resource_kind, service_type, decision)" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "Booking end_at not strictly after start_at" }
  - { id: ERR_RESOURCE_KIND_MISMATCH, http: 400, condition: "resource_kind=CREW but crew_id absent / equipment_id present (or vice versa)" }
  - { id: ERR_INVALID_ACTUAL_HOURS, http: 400, condition: "Booking finalize actual_hours missing or <= 0" }

  # --- OCC ---
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version != current WorkOrder.version on booking create" }

  # --- state ---
  - { id: ERR_WORK_ORDER_TERMINAL, http: 409, condition: "WorkOrder already COMPLETED or CANCELLED" }
  - { id: ERR_WORK_ORDER_NOT_SCHEDULED, http: 409, condition: "Operation requires WorkOrder in SCHEDULED (booking/disposal finalize)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition not legal from the resource's current state" }
  - { id: ERR_NO_TREES_ASSESSED, http: 409, condition: "Assess attempted with no TreeAsset children" }
  - { id: ERR_ESTIMATE_NOT_DRAFT, http: 409, condition: "Line-item add or issue on an estimate not in DRAFT" }
  - { id: ERR_ESTIMATE_NOT_ISSUED, http: 409, condition: "Accept/decline on an estimate not in ISSUED" }
  - { id: ERR_ESTIMATE_EMPTY, http: 409, condition: "Issue attempted on an estimate with no line items" }
  - { id: ERR_PERMIT_NOT_REQUIRED, http: 409, condition: "Permit submit on a work order whose requires_permit is false" }
  - { id: ERR_BOOKING_NOT_RESERVED, http: 409, condition: "Finalize/release on a booking not in RESERVED" }
  - { id: ERR_TICKET_NOT_RECORDED, http: 409, condition: "Finalize/void on a disposal ticket not in RECORDED" }
  - { id: ERR_OPEN_BOOKINGS, http: 409, condition: "Complete attempted while a RESERVED booking remains" }
  - { id: ERR_OPEN_DISPOSAL, http: 409, condition: "Complete attempted while a RECORDED disposal ticket remains" }
  - { id: ERR_RESOURCE_HAS_RESERVATIONS, http: 409, condition: "Retire attempted on a crew/equipment with a RESERVED booking" }

  # --- business safety / scheduling / fiscal ---
  - { id: ERR_UTILITY_CLEARANCE_REQUIRED, http: 422, condition: "Crew booking on a work order with a near-utility-line tree, using a non-line-clearance-certified crew" }
  - { id: ERR_PERMIT_REQUIRED, http: 422, condition: "Estimate acceptance while requires_permit is true and no APPROVED permit exists" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "New crew booking window overlaps an existing RESERVED/FINALIZED booking of the same crew (half-open)" }
  - { id: ERR_EQUIPMENT_DOUBLE_BOOKED, http: 409, condition: "New equipment booking violates the unit's mobilization buffer against another RESERVED/FINALIZED booking" }
  - { id: ERR_RESOURCE_REGION_MISMATCH, http: 422, condition: "Booked crew/equipment service_area_id differs from the work order's service_area_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Operations role: provisions service areas/crews/equipment, owns scheduling (bookings) and the work-order lifecycle (assess is Arborist's; complete/cancel are Dispatcher's), runs permit review decisions."
    identity: opaque
    exclusive_operations:
      - "POST /service-areas — create service area"
      - "POST /crews — register crew"
      - "POST /crews/{id}/retire — retire crew"
      - "POST /equipment — register equipment"
      - "POST /equipment/{id}/retire — retire equipment"
      - "POST /work-orders/{id}/complete — complete work order"
      - "POST /work-orders/{id}/cancel — cancel work order"
      - "POST /bookings — reserve a resource"
      - "POST /bookings/{id}/finalize — finalize a booking"
      - "POST /bookings/{id}/release — release a booking"
      - "POST /work-orders/{id}/permits/{pid}/request-changes — request permit changes"
      - "POST /work-orders/{id}/permits/{pid}/decide — approve/deny permit"
    shared_operations:
      - "POST /work-orders — create work order (shared with Client)"
      - "POST /work-orders/{id}/trees — add tree (shared with Arborist)"
      - "POST /work-orders/{id}/disposal-tickets — record disposal ticket (shared with FinanceClerk)"
      - "all GET endpoints"

  - name: Arborist
    description: "Field expert: adds trees, runs hazard assessment, drafts/issues estimates and line items, files and resubmits permits."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/assess — run hazard assessment"
      - "POST /work-orders/{id}/estimates — create estimate"
      - "POST /line-items — add line item"
      - "POST /work-orders/{id}/estimates/{eid}/issue — issue estimate"
      - "POST /work-orders/{id}/permits — create permit"
      - "POST /work-orders/{id}/permits/{pid}/submit — submit/resubmit permit"
    shared_operations:
      - "POST /work-orders/{id}/trees — add tree (shared with Dispatcher)"
      - "all GET endpoints"

  - name: FinanceClerk
    description: "Billing role: records and finalizes/voids debris disposal tickets feeding the disposal ledger."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/disposal-tickets/{tid}/finalize — finalize disposal ticket"
      - "POST /work-orders/{id}/disposal-tickets/{tid}/void — void disposal ticket"
    shared_operations:
      - "POST /work-orders/{id}/disposal-tickets — record disposal ticket (shared with Dispatcher)"
      - "all GET endpoints"

  - name: Client
    description: "Customer: owns a work order via client_user_id; creates work orders and accepts/declines issued estimates. X-User-ID equals WorkOrder.client_user_id for ownership checks."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/estimates/{eid}/accept — accept estimate"
      - "POST /work-orders/{id}/estimates/{eid}/decline — decline estimate"
    shared_operations:
      - "POST /work-orders — create work order (shared with Dispatcher)"
      - "all GET endpoints"
