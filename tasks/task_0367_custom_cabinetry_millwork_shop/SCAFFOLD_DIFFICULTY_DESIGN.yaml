  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: draw_issue_void_conserves_billed_to_date
        grounds:
          - state_machines.Draw.PENDING_to_ISSUED
          - state_machines.Draw.ISSUED_to_VOIDED
          - entities.Project.fields.billed_to_date_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (billed_to_date_cents). Issue adds amount_cents; void of an
          ISSUED draw subtracts the same amount, leaving Project.billed_to_date_cents back at its
          pre-issue value (0). Invariant: billed_to_date_cents unchanged across issue+void.
        test_recipe:
          setup:
            - "Project CONTRACTED with a PENDING deposit draw of 87480 (contract_total tax0 STAIN qty2)."
            - "billed_to_date starts 0; issue -> 87480; void -> back to 0."
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "Mill Q", tax_rate_bps: 0, deposit_pct_bps: 3000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
