              payload: { customer_id: "${cust_p5a}", property_address: "P5a St" }
              as: OperationsAdmin
              captures: { proj_p5a: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_p5a}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_p5a: $.data.id, tx_p5a_v0: $.data.version }
            - call: "POST /projects/${proj_p5a}/zones"
              payload: { transformer_id: "${tx_p5a}", label: "Full" }
              as: LightingDesigner
              captures: { zone_p5a: $.data.id }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_p5a}", model_code: "F80", category: "SPOT", wattage_w: 80, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { fxa: $.data.id }
            - call: "POST /fixtures/${fxa}/assign-zone"
              payload: { zone_id: "${zone_p5a}", expected_transformer_version: "${tx_p5a_v0}" }
              as: LightingDesigner
              captures: { tx_p5a_v1: $.data.version }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_p5a}", model_code: "F80", category: "SPOT", wattage_w: 80, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { fxb: $.data.id }
            - call: "POST /fixtures/${fxb}/assign-zone"
              payload: { zone_id: "${zone_p5a}", expected_transformer_version: "${tx_p5a_v1}" }
              as: LightingDesigner
              captures: { tx_p5a_v2: $.data.version }
            - call: "POST /fixtures"
              payload: { project_id: "${proj_p5a}", model_code: "F80", category: "SPOT", wattage_w: 80, purchase_price_cents: 1000 }
              as: LightingDesigner
              captures: { fxc: $.data.id }
            - call: "POST /fixtures/${fxc}/assign-zone"
              payload: { zone_id: "${zone_p5a}", expected_transformer_version: "${tx_p5a_v2}" }
              as: LightingDesigner
              captures: { tx_p5a_v3: $.data.version }
            - call: "POST /quotes"
              payload: { project_id: "${proj_p5a}" }
              as: LightingDesigner
              captures: { q_p5a: $.data.id }
            - call: "POST /quotes/${q_p5a}/lines"
              payload: { model_code: "F80", quantity: 3, unit_price_cents: 1000 }
              as: LightingDesigner
            - call: "POST /projects/${proj_p5a}/lock-design"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_p5a}/send"
              payload: {}
              as: LightingDesigner
            - call: "POST /quotes/${q_p5a}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_p5a}"
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_p5a}", quote_id: "${q_p5a}" }
              as: InstallTech
              captures: { job_p5a: $.data.id }
            - call: "POST /install-jobs/${job_p5a}/start"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_p5a}/complete-wiring"
              payload: {}
              as: InstallTech
            - call: "POST /install-jobs/${job_p5a}/complete-fixtures"
              payload: {}
              as: InstallTech
            - call: "GET /transformers/${tx_p5a}"
              payload: {}
              as: LightingDesigner
              captures: { tx_p5a_vnow: $.data.version }
          trigger:
            - call: "POST /fixtures/${fxc}/assign-zone"
              payload: { zone_id: "${zone_p5a}", expected_transformer_version: "${tx_p5a_vnow}" }
              as: LightingDesigner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (fxc is INSTALLED, so the state precondition fixture.status==PLANNED fails at priority 6 before the priority-12 fiscal capacity check)"
            - "Transformer.${tx_p5a}.committed_load_va == 240"

      - name: existence_beats_referential_on_zone_create
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - state_machines.LightingProject.DRAFT_to_ZONED
        distinguishing_aspect: |
          Category pair existence(3) vs business_referential(5): creating a zone that references a
          non-existent transformer returns ERR_RESOURCE_NOT_FOUND (existence) rather than
          ERR_CROSS_PROJECT_REFERENCE (referential), proving existence is checked first.
        test_recipe:
          setup:
            - "A DRAFT project; the body references a transformer id that does not exist."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner P5b", email: "p5b@x.com" }
              as: OperationsAdmin
              captures: { cust_p5b: $.data.id }
