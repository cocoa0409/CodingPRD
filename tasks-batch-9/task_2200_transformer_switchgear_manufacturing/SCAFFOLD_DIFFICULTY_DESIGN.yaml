      - name: allocation_create_four_rung_ladder_p13_then_p33_then_p71_then_p75_on_one_payload_shape
        grounds:
          - validations[priority=13]
          - validations[priority=33]
          - validations[priority=71]
          - validations[priority=75]
          - calculations.component_availability
          - concurrency_rules[allocation-create-stale-component]
        distinguishing_aspect: |
          Four calls carry the SAME three defects (unknown component, stale component version, past
          need_by_date, over-quantity) and are peeled one rung at a time, so the observed error_id must
          walk 404 ERR_COMPONENT_NOT_FOUND -> 412 ERR_STALE_COMPONENT_VERSION -> 422
          ERR_NEED_BY_DATE_PASSED -> 409 ERR_COMPONENT_INSUFFICIENT. Because none of the rejected calls
          may mutate anything, the version captured before the ladder is still accepted by the fifth
          call.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "Order TX-PRI-0011 in PLANNING (no drawing is needed because a RESERVED allocation does not require a released design)."
            - "One supplier SUP-P11 with one component CORE-P11: quantity_on_hand 2, so component_availability gives quantity_available 2 and quantity 3 is the first failing request."
            - "comp_v0 is the component version captured at creation; rungs 3-5 reuse it verbatim while the two stale rungs send ${comp_v0} + 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-PRI-0011", customer_name: "Foothill Substation LLC", product_family: "MV_SWITCHGEAR", rated_kv: 15, contract_value_cents: 800000, sold_at: "2026-03-01T00:00:00Z", promised_ship_at: "2026-12-01T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-P11", legal_name: "Foothill Steel", region: "NA" }
              as: PlantAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/long-lead-components"
              payload: { part_number: "CORE-P11", category: "CORE_STEEL", lead_time_days: 35, quantity_on_hand: 2, allocation_policy: "DEDICATED" }
              as: MaterialsPlanner
              captures: { comp_id: $.data.id, comp_v0: $.data.version }
          trigger:
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "00000000-0000-0000-0000-000000000000", engineered_order_id: "${ord_id}", quantity: 999, priority_class: 3, need_by_date: "2026-01-15T00:00:00Z", expected_component_version: "${comp_v0} + 1" }
              as: MaterialsPlanner
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 999, priority_class: 3, need_by_date: "2026-01-15T00:00:00Z", expected_component_version: "${comp_v0} + 1" }
              as: MaterialsPlanner
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 999, priority_class: 3, need_by_date: "2026-01-15T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 3, priority_class: 3, need_by_date: "2026-09-01T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
            - call: "POST /component-allocations"
              payload: { long_lead_component_id: "${comp_id}", engineered_order_id: "${ord_id}", quantity: 2, priority_class: 3, need_by_date: "2026-09-01T00:00:00Z", expected_component_version: "${comp_v0}" }
              as: MaterialsPlanner
              captures: { alloc_ok: $.data.id }
          assert:
            - "trigger call 1 returns 404 with error_id ERR_COMPONENT_NOT_FOUND (P13 wins over P33, P71 and P75, all of which also hold)"
            - "trigger call 2 returns 412 with error_id ERR_STALE_COMPONENT_VERSION (P33 wins over P71 and P75)"
            - "trigger call 3 returns 422 with error_id ERR_NEED_BY_DATE_PASSED (P71 wins over P75; need_by_date 2026-01-15 is earlier than the clock at 2026-03-01)"
            - "trigger call 4 returns 409 with error_id ERR_COMPONENT_INSUFFICIENT (quantity 3 == quantity_available 2 + 1 is the first failing quantity)"
            - "trigger call 5 returns 201 and ComponentAllocation.${alloc_ok}.status == RESERVED with quantity 2 and release_penalty_cents == 0"
            - "LongLeadComponent.${comp_id}.version is unchanged by trigger calls 1-4 -- the fact that call 5 still accepts expected_component_version ${comp_v0} proves no rejected call bumped it"
            - "after the ladder LongLeadComponent.${comp_id}.quantity_reserved == 2, quantity_available == 0, quantity_on_hand == 2"
            - "exactly one ComponentAllocation row exists for component ${comp_id} (GET /component-allocations filtered by that component returns 1 item), so no partial row survived calls 1-4"

  - rule_id: boundary_precision_check
    instances:
      - name: escalation_round_before_sum_plus_collar_equality_and_cap_equality_one_basis_point_apart
        grounds:
          - calculations.material_escalation_amount
          - entities.EscalationAdjustment.fields.raw_movement_cents
          - entities.EscalationAdjustment.fields.collar_absorbed
          - entities.EscalationAdjustment.fields.cap_applied
          - entities.EscalationClause.fields.collar_bp
        distinguishing_aspect: |
          Five clauses read the SAME two index prints (160.0000 -> 170.0000, ratio exactly 1/16) and
          separate three one-unit boundaries: rounding each commodity component before summing gives
          8126 where summing first and rounding once gives 8125; collar_bp 625 produces collar_cents
          exactly equal to the 10000-cent movement and does NOT absorb while collar_bp 626 does; and
          cap_bp 625 produces cap_cents exactly equal to the movement with cap_applied false while
          cap_bp 600 clamps to 9600 with cap_applied true.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z; both prints are published before it."
            - "Global CommodityIndexPoint prints for COPPER, ALUMINUM and CORE_STEEL: 2026-01 = 160.0000 and 2026-02 = 170.0000, all is_provisional false. (cur - base) / base = 10 / 160 = 0.0625 exactly for every commodity."
            - "Five orders, each with exactly one ACTIVE clause weighted copper 5000 bp / aluminum 5000 bp / core_steel 0 bp, base_index_month 2026-01, final_window_end_month 2026-02, de_escalation_enabled false, and one PROVISIONAL EscalationAdjustment:"
            - "  A escalatable_base_cents 130000, collar_bp 0, cap_bp 5000 -> per-commodity raw 4062.50 each, rounded to 4063 each, raw_movement 8126."
            - "  B escalatable_base_cents 160000, collar_bp 625, cap_bp 5000 -> raw 5000 each, raw_movement 10000, collar_cents 10000 (equality does not absorb)."
            - "  C escalatable_base_cents 160000, collar_bp 626, cap_bp 5000 -> collar_cents 10016 > 10000, absorbed."
            - "  D escalatable_base_cents 160000, collar_bp 0, cap_bp 600 -> cap_cents 9600 < 10000, clamped."
