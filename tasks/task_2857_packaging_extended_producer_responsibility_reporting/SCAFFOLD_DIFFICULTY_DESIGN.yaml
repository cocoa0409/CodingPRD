# §1.8 Scaffold Difficulty Design — task_2857 packaging extended producer responsibility reporting
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Every numeric assert literal was produced by
# executing the §1.3 formulas with their declared constants.
#
# Shared fixture vocabulary used by the chains below (all literals, never invented downstream):
#   CA program : obligation_basis GROUP_LEVEL, eco_mod_policy BONUS_MALUS,
#                fee_rounding_order PER_LINE_THEN_SUM, revenue threshold 5000000,
#                tonnage threshold 1000 kg, exempt_product_categories [MEDICAL_DEVICE],
#                verification_required_threshold_kg 3000, registration_deadline 2026-12-31T23:59:59Z
#   OR program : obligation_basis ENTITY_LEVEL, eco_mod_policy DISCOUNT_ONLY,
#                fee_rounding_order SUM_THEN_ROUND, same thresholds,
#                exempt_product_categories [], verification_required_threshold_kg 100000
#   rate bands : PLASTIC [0,1000)=42 [1000,5000)=33 [5000,-)=25 ; PAPER [0,1000)=18 [1000,-)=12 ;
#                GLASS [0,-)=9 ; METAL [0,-)=15 ; membership_fee_cents 250000 ;
#                admin_fee_bps_low 500, admin_fee_bps_high 300 (ADMIN_TIER_BREAK_CENTS 40000)
#   logical clock is set to 2026-09-01T00:00:00Z in every chain (server default is 2026-08-01T00:00:00Z)

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: exemption_variant_divergence_entity_level_vs_group_level
        grounds:
          - calculations.exemption_determination
          - entities.Registration.fields.exemption_status
          - entities.Registration.fields.assessed_group_revenue_usd
          - entities.Producer.fields.parent_producer_id
          - state_machines.Registration.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The dual variant lives on the Registration/Producer domain (eligibility, not money): the
          same affiliate producer submitting identical data is EXEMPT_SMALL_PRODUCER in the
          ENTITY_LEVEL state (assessed revenue 4000000) and OBLIGATED in the GROUP_LEVEL state
          (assessed revenue 7000000), because only GROUP_LEVEL adds the parent's revenue.
        test_recipe:
          setup:
            - "Two state programs differing only in obligation_basis: CA is GROUP_LEVEL, OR is ENTITY_LEVEL; both use revenue threshold 5000000 USD and tonnage threshold 1000 kg."
            - "Parent producer P_par with annual_gross_revenue_usd 3000000 and one ACTIVE GLASS SKU of 5.500 kg."
            - "Affiliate producer P_sub with parent_producer_id = P_par and annual_gross_revenue_usd 4000000 and one ACTIVE GLASS SKU of 10.500 kg."
            - "P_sub holds a DRAFT registration in each of the two programs; the logical clock is 2026-09-01T00:00:00Z, before both registration deadlines."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/state-programs"
              payload: { state_code: "OR", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "DISCOUNT_ONLY", fee_rounding_order: "SUM_THEN_ROUND", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: [], verification_required_threshold_kg: 100000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_or_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "Parent Brands Inc", parent_producer_id: null, brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 3000000, contact_email: "par@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { p_par_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "Sub Brands LLC", parent_producer_id: "${p_par_id}", brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 4000000, contact_email: "sub@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { p_sub_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p_par_id}", gtin: "0001", name: "Par Jar", product_category: "HOUSEHOLD_CHEM", units_sold_annual_estimate: 110 }
              as: ProducerComplianceOfficer
              as_user_id: "${p_par_id}"
              captures: { sku_par_id: $.data.id }
            - call: "POST /epr/skus/${sku_par_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p_par_id}"
            - call: "POST /epr/skus/${sku_par_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_par_id}"
            - call: "POST /epr/producers/${p_par_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/skus"
              payload: { producer_id: "${p_sub_id}", gtin: "0002", name: "Sub Jar", product_category: "HOUSEHOLD_CHEM", units_sold_annual_estimate: 210 }
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
              captures: { sku_sub_id: $.data.id }
            - call: "POST /epr/skus/${sku_sub_id}/components"
              payload: { material_type: "GLASS", unit_weight_grams: 50, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
            - call: "POST /epr/skus/${sku_sub_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
            - call: "POST /epr/producers/${p_sub_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/registrations"
              payload: { producer_id: "${p_sub_id}", state_program_id: "${sp_ca_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
              captures: { reg_ca_id: $.data.id }
            - call: "POST /epr/registrations"
              payload: { producer_id: "${p_sub_id}", state_program_id: "${sp_or_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
              captures: { reg_or_id: $.data.id }
          trigger:
            - call: "POST /epr/registrations/${reg_ca_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
            - call: "POST /epr/registrations/${reg_or_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p_sub_id}"
          assert:
            - "Registration.${reg_ca_id}.exemption_basis_applied == GROUP_LEVEL"
            - "Registration.${reg_ca_id}.assessed_group_revenue_usd == 7000000"
            - "Registration.${reg_ca_id}.assessed_group_weight_kg == 16.000"
            - "Registration.${reg_ca_id}.exemption_status == OBLIGATED"
            - "Registration.${reg_or_id}.exemption_basis_applied == ENTITY_LEVEL"
            - "Registration.${reg_or_id}.assessed_group_revenue_usd == 4000000"
            - "Registration.${reg_or_id}.assessed_group_weight_kg == 10.500"
            - "Registration.${reg_or_id}.exemption_status == EXEMPT_SMALL_PRODUCER"
            - "Both registrations belong to the same Producer ${p_sub_id}, so the divergence is caused only by obligation_basis"

      - name: report_fee_variant_divergence_provisional_vs_final
        grounds:
          - calculations.report_fee_assessment
          - calculations.report_fee_total
          - entities.PackagingReport.fields.tier_basis_kg
          - entities.PackagingReport.fields.fee_variant_applied
          - state_machines.PackagingReport_fee_status.UNASSESSED_to_PROVISIONAL
          - state_machines.PackagingReport_fee_status.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          The second dual variant lives on the PackagingReport money domain, not on eligibility: the
          identical single line (2500.000 kg PLASTIC + 800.000 kg PAPER) is priced at
          fee_subtotal_cents 106530 under PROVISIONAL (tier_basis_kg 0.000, rates 42 and 18) and at
          81645 under FINAL (tier_basis_kg 3300.000, rates 33 and 12), because only FINAL counts the
          report's own tonnage in the tier basis.
        test_recipe:
          setup:
            - "CA program with the full four-material rate table; one reporting period CA-2026-H2 open from 2026-08-15 to 2026-09-30."
            - "Producer P1 (revenue 40000000, brand owner) with one ACTIVE SKU whose ACTIVE components are PLASTIC 25 g READILY_RECYCLABLE pcr 30 and PAPER 8 g LIMITED pcr 0; units_sold_annual_estimate 100000 so annual_packaging_weight_kg is 3300.000."
            - "P1 holds an ACTIVE CA registration and an ACTIVE membership on the published CA fee schedule with the 400000-cent membership fee PAID."
            - "One report for CA-2026-H2 carries a single line of 100000 units and has been submitted (total_weight_kg 3300.000, verification_required true, Registration.reported_weight_kg_ytd 3300.000)."
            - "Because verification is required, an UNQUALIFIED opinion moves the report to VERIFIED before the FINAL assessment is legal."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/state-programs/${sp_ca_id}/reporting-periods"
              payload: { period_label: "CA-2026-H2", data_start: "2026-07-01", data_end: "2027-01-01", submission_open: "2026-08-15T00:00:00Z", submission_deadline: "2026-09-30T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { per_ca_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "PRO West", contact_email: "pro@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { pro_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "Big Brand Co", parent_producer_id: null, brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 40000000, contact_email: "p1@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { p1_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p1_id}", gtin: "1001", name: "Bottle 500ml", product_category: "BEVERAGE", units_sold_annual_estimate: 100000 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { sku_a_id: $.data.id }
            - call: "POST /epr/skus/${sku_a_id}/components"
              payload: { material_type: "PLASTIC", unit_weight_grams: 25, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 30, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_a_id}/components"
              payload: { material_type: "PAPER", unit_weight_grams: 8, recyclability_class: "LIMITED", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/skus/${sku_a_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/producers/${p1_id}/determine-obligation"
              payload: {}
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2026-07-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "PLASTIC", tier_min_kg: 0, tier_max_kg: 1000, rate_cents_per_kg: 42 }, { material_type: "PLASTIC", tier_min_kg: 1000, tier_max_kg: 5000, rate_cents_per_kg: 33 }, { material_type: "PLASTIC", tier_min_kg: 5000, tier_max_kg: null, rate_cents_per_kg: 25 }, { material_type: "PAPER", tier_min_kg: 0, tier_max_kg: 1000, rate_cents_per_kg: 18 }, { material_type: "PAPER", tier_min_kg: 1000, tier_max_kg: null, rate_cents_per_kg: 12 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_ca_id: $.data.id }
            - call: "GET /epr/pros/${pro_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { pro_ver: $.data.version }
            - call: "POST /epr/fee-schedules/${fs_ca_id}/publish"
              payload: { expected_pro_version: "${pro_ver}" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
            - call: "POST /epr/registrations"
              payload: { producer_id: "${p1_id}", state_program_id: "${sp_ca_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /epr/registrations/${reg_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
            - call: "POST /epr/registrations/${reg_id}/decide"
              payload: { decision: "ACCEPT" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { reg_ver: $.data.version }
            - call: "POST /epr/memberships"
              payload: { registration_id: "${reg_id}", pro_id: "${pro_id}", fee_schedule_id: "${fs_ca_id}", expected_registration_version: "${reg_ver}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /epr/memberships/${mem_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
            - call: "POST /epr/memberships/${mem_id}/record-fee-payment"
              payload: { amount_cents: 400000 }
              as: ProAdministrator
              as_user_id: "${pro_id}"
            - call: "POST /epr/reports"
              payload: { registration_id: "${reg_id}", reporting_period_id: "${per_ca_id}" }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /epr/reports/${rep_id}/lines"
              payload: { sku_id: "${sku_a_id}", units_sold: 100000 }
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
              captures: { line_id: $.data.id }
            - call: "POST /epr/reports/${rep_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /epr/reports/${rep_id}/assess"
              payload: { variant: "PROVISIONAL" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
            - call: "POST /epr/verification-engagements"
              payload: { packaging_report_id: "${rep_id}", verifier_user_id: "ver-1", fieldwork_start: "2026-09-10", fieldwork_end: "2026-09-12" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { eng_id: $.data.id }
            - call: "POST /epr/verification-engagements/${eng_id}/start"
              payload: {}
              as: IndependentVerifier
              as_user_id: "ver-1"
            - call: "POST /epr/verification-engagements/${eng_id}/issue-opinion"
              payload: { opinion: "UNQUALIFIED" }
              as: IndependentVerifier
              as_user_id: "ver-1"
            - call: "POST /epr/reports/${rep_id}/assess"
              payload: { variant: "FINAL" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
          assert:
            - "After the PROVISIONAL assess: PackagingReport.${rep_id}.tier_basis_kg == 0.000"
            - "After the PROVISIONAL assess: PackagingReport.${rep_id}.fee_subtotal_cents == 106530"
            - "After the PROVISIONAL assess: PackagingReport.${rep_id}.fee_variant_applied == PROVISIONAL and fee_status == PROVISIONAL"
            - "After the PROVISIONAL assess: ReportLine.${line_id}.line_fee_cents == 106530"
            - "After the FINAL assess: PackagingReport.${rep_id}.tier_basis_kg == 3300.000"
            - "After the FINAL assess: PackagingReport.${rep_id}.fee_subtotal_cents == 81645"
            - "After the FINAL assess: PackagingReport.${rep_id}.fee_variant_applied == FINAL and fee_status == FINAL"
            - "After the FINAL assess: ReportLine.${line_id}.line_fee_cents == 81645"
            - "PackagingReport.${rep_id}.submission_status == VERIFIED throughout both assessments (the fee dimension moved alone)"

      - name: redesign_projection_baseline_units_vs_projected_units
        grounds:
          - calculations.redesign_fee_projection
          - calculations.eco_modulation_adjustment
          - endpoints[POST /epr/skus/{id}/redesign-projection]
          - entities.Sku.fields.components
        distinguishing_aspect: |
          The third dual variant sits on the Sku domain and is non-mutating: BASELINE_UNITS prices the
          candidate component set at units_sold_annual_estimate 10000 while PROJECTED_UNITS prices the
          same set at the body's projected_units 20000, so the projected fee doubles from 23100 to
          46200 while Sku.revision_count stays 0.
        test_recipe:
          setup:
            - "CA program and a published CA fee schedule carrying the PLASTIC bands 42/33/25."
            - "Producer P7 with one ACTIVE SKU whose single ACTIVE component is PLASTIC 100 g NOT_RECYCLABLE pcr 0, units_sold_annual_estimate 10000 (1000.000 kg)."
            - "The caller supplies tier_basis_kg 1000 so the [1000,5000) band at 33 cents is selected on both sides of the comparison."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "PRO West", contact_email: "pro@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { pro_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "Redesign Co", parent_producer_id: null, brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 9000000, contact_email: "p7@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { p7_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p7_id}", gtin: "7001", name: "Tub 1L", product_category: "PERSONAL_CARE", units_sold_annual_estimate: 10000 }
              as: ProducerComplianceOfficer
              as_user_id: "${p7_id}"
              captures: { sku_f_id: $.data.id }
            - call: "POST /epr/skus/${sku_f_id}/components"
              payload: { material_type: "PLASTIC", unit_weight_grams: 100, recyclability_class: "NOT_RECYCLABLE", pcr_content_pct: 0, is_reusable: false }
              as: ProducerComplianceOfficer
              as_user_id: "${p7_id}"
            - call: "POST /epr/skus/${sku_f_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p7_id}"
            - call: "POST /epr/fee-schedules"
              payload: { pro_id: "${pro_id}", state_program_id: "${sp_ca_id}", effective_from: "2026-07-01", effective_to: null, membership_fee_cents: 250000, admin_fee_bps_low: 500, admin_fee_bps_high: 300, material_rates: [{ material_type: "PLASTIC", tier_min_kg: 0, tier_max_kg: 1000, rate_cents_per_kg: 42 }, { material_type: "PLASTIC", tier_min_kg: 1000, tier_max_kg: 5000, rate_cents_per_kg: 33 }, { material_type: "PLASTIC", tier_min_kg: 5000, tier_max_kg: null, rate_cents_per_kg: 25 }] }
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { fs_ca_id: $.data.id }
            - call: "GET /epr/pros/${pro_id}"
              payload: {}
              as: ProAdministrator
              as_user_id: "${pro_id}"
              captures: { pro_ver: $.data.version }
            - call: "POST /epr/fee-schedules/${fs_ca_id}/publish"
              payload: { expected_pro_version: "${pro_ver}" }
              as: ProAdministrator
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /epr/skus/${sku_f_id}/redesign-projection"
              payload: { state_program_id: "${sp_ca_id}", fee_schedule_id: "${fs_ca_id}", tier_basis_kg: 1000, units_basis: "BASELINE_UNITS", candidate_components: [{ material_type: "PLASTIC", unit_weight_grams: 100, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 100, is_reusable: true }] }
              as: ProducerComplianceOfficer
              as_user_id: "${p7_id}"
            - call: "POST /epr/skus/${sku_f_id}/redesign-projection"
              payload: { state_program_id: "${sp_ca_id}", fee_schedule_id: "${fs_ca_id}", tier_basis_kg: 1000, units_basis: "PROJECTED_UNITS", projected_units: 20000, candidate_components: [{ material_type: "PLASTIC", unit_weight_grams: 100, recyclability_class: "READILY_RECYCLABLE", pcr_content_pct: 100, is_reusable: true }] }
              as: ProducerComplianceOfficer
              as_user_id: "${p7_id}"
          assert:
            - "BASELINE_UNITS response: projected_units == 10000, projected_line_weight_kg == 1000.000, baseline_line_fee_cents == 52800, projected_line_fee_cents == 23100, fee_delta_cents == -29700"
            - "PROJECTED_UNITS response: projected_units == 20000, projected_line_weight_kg == 2000.000, baseline_line_fee_cents == 105600, projected_line_fee_cents == 46200, fee_delta_cents == -59400"
            - "Sku.${sku_f_id}.revision_count == 0 and Sku.${sku_f_id}.unit_packaging_weight_grams == 100.00 after both calls (the projection wrote nothing)"
            - "Producer.${p7_id}.annual_packaging_weight_kg == 1000.000 after both calls"

  - rule_id: combinatorial_formula
    instances:
      - name: eco_modulation_mode_a_nested_min_max_clamp
        grounds:
          - calculations.eco_modulation_adjustment
          - calculations.report_fee_assessment
          - entities.ReportLine.fields.eco_mod_detail
          - entities.StateProgram.fields.eco_mod_policy
        distinguishing_aspect: |
          Mode (a): the per-component fee depends non-linearly on four inputs (recyclability_class,
          pcr_content_pct, is_reusable, tier-selected rate) through a floored-then-capped PCR bonus
          added to a reuse bonus, subtracted from a malus and clamped to [-30,+60] — a 100% PCR
          reusable READILY_RECYCLABLE component computes net -40 and must be clamped to -30
          (23100 cents, not 19800), while a 62% PCR reusable NOT_RECYCLABLE component computes
          net +20 (39600 cents) rather than the naive 60 - 31 or 60 - 45.
        test_recipe:
          setup:
            - "CA program (BONUS_MALUS) with the PLASTIC bands 42/33/25 and verification_required_threshold_kg 3000."
            - "Producer P4 with two ACTIVE single-component PLASTIC SKUs of 100 g each and units_sold_annual_estimate 10000, so annual_packaging_weight_kg is 2000.000 and the membership fee is 350000 cents."
            - "SKU_E component: NOT_RECYCLABLE, pcr_content_pct 62, is_reusable true. SKU_F component: READILY_RECYCLABLE, pcr_content_pct 100, is_reusable true."
            - "One submitted CA report carries both SKUs at 10000 units each: total_weight_kg 2000.000, verification_required false (2000 < 3000), so a FINAL assessment is legal straight from SUBMITTED with tier_basis_kg 2000.000 selecting the 33-cent PLASTIC band for both lines."
          setup_api_calls:
            - call: "POST /epr/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "GROUP_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 5000000, small_producer_tonnage_threshold_kg: 1000, exempt_product_categories: ["MEDICAL_DEVICE"], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { sp_ca_id: $.data.id }
            - call: "POST /epr/state-programs/${sp_ca_id}/reporting-periods"
              payload: { period_label: "CA-2026-H2", data_start: "2026-07-01", data_end: "2027-01-01", submission_open: "2026-08-15T00:00:00Z", submission_deadline: "2026-09-30T23:59:59Z", correction_window_days: 30 }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { per_ca_id: $.data.id }
            - call: "POST /epr/pros"
              payload: { name: "PRO West", contact_email: "pro@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { pro_id: $.data.id }
            - call: "POST /epr/producers"
              payload: { legal_name: "EcoMod Co", parent_producer_id: null, brand_owner_flag: true, importer_of_record_flag: false, domestic_licensor_flag: false, annual_gross_revenue_usd: 20000000, contact_email: "p4@x.com" }
              as: ProgramRegulator
              as_user_id: "reg-1"
              captures: { p4_id: $.data.id }
            - call: "POST /epr/skus"
              payload: { producer_id: "${p4_id}", gtin: "4001", name: "Pouch E", product_category: "FOOD_DRY", units_sold_annual_estimate: 10000 }
              as: ProducerComplianceOfficer
              as_user_id: "${p4_id}"
              captures: { sku_e_id: $.data.id }
            - call: "POST /epr/skus/${sku_e_id}/components"
              payload: { material_type: "PLASTIC", unit_weight_grams: 100, recyclability_class: "NOT_RECYCLABLE", pcr_content_pct: 62, is_reusable: true }
              as: ProducerComplianceOfficer
              as_user_id: "${p4_id}"
            - call: "POST /epr/skus/${sku_e_id}/activate"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${p4_id}"
            - call: "POST /epr/skus"
              payload: { producer_id: "${p4_id}", gtin: "4002", name: "Pouch F", product_category: "FOOD_DRY", units_sold_annual_estimate: 10000 }
              as: ProducerComplianceOfficer
              as_user_id: "${p4_id}"
