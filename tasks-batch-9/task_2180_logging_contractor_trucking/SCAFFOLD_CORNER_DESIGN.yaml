            - "Load.${rehaul_id}.scheduled_arrive_at == 2026-08-01T00:54:00Z"
            - "MillContract.${mc_b_id}.reserved_tons == 28.32"
            - "MillContract.${mc_b_id}.available_tons == 171.68"
            - "MillContract.${mc_c_id}.reserved_tons == 0.00"
            - "MillContract.${mc_a_id}.reserved_tons == 0.00"
            - "MillContract.${mc_a_id}.available_tons == 500.00"

      - name: rehaul_selector_tie_break_uses_created_at_and_never_the_row_id
        claim_type: selector_policy
        grounds:
          - calculations.rehaul_alternate_selection
          - entities.MillContract.fields.base_rate_cents_per_ton
          - entities.HaulRoute.fields.distance_miles
          - entities.Load.fields.rehaul_of_load_id
        distinguishing_aspect: |
          When two candidates tie on net yield (both 121208 cents) and then tie again on
          distance (both 40 miles), the pinned fallback is the earlier MillContract.created_at,
          never the UUID. Mill B's contract was created first, so the rehaul must land on it in
          every run regardless of how the random ids happen to sort.
        test_recipe:
          setup:
            - "Mill A rejects the load; Mill B and Mill C both buy DOUGLAS_FIR/SAWLOG_1 at 4400 cents per ton with 200-ton OPEN quotas"
            - "Both alternate routes run exactly 40 miles from the tract, so the ranking expression and the distance tie-break both tie"
            - "Mill B's contract is created strictly before Mill C's, giving it the earlier created_at"
            - "Load 1 was scaled at Mill A at 90000 lbs with a 0.04 defect deduction, i.e. 28.32 net tons"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_a_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 500, base_rate_cents_per_ton: 4200, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_a_id: $.data.id }
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cert_gl_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/trucks"
              payload: { unit_number: "T-18", axle_config: "SIX_AXLE", tare_weight_lbs: 31000, permit_class: "STANDARD" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { truck_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Alpha", crew_type: "MECHANIZED_GROUND", equipment_pieces: 4, daily_rate_cents: 480000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { crew_id: $.data.id }
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 600, plan_horizon_weeks: 8, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /production-plans/${plan_id}/approve"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", move_in_miles: 40, window_start: "2026-08-01", window_end: "2026-10-15" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { ca_id: $.data.id }
            - call: "POST /haul-routes"
              payload: { tract_id: "${tract_id}", mill_id: "${mill_a_id}", distance_miles: 52, legal_gross_weight_lbs: 98000, permit_class_required: "STANDARD", status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { route_a_id: $.data.id }
            - call: "POST /tracts/${tract_id}/mobilize"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /tracts/${tract_id}/activate"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
            - call: "POST /mills"
              payload: { name: "Basin Mill B", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_b_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_b_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 200, base_rate_cents_per_ton: 4400, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_b_id: $.data.id }
            - call: "POST /haul-routes"
              payload: { tract_id: "${tract_id}", mill_id: "${mill_b_id}", distance_miles: 40, legal_gross_weight_lbs: 98000, permit_class_required: "STANDARD", status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { route_b_id: $.data.id }
            - call: "POST /mills"
              payload: { name: "Divide Mill C", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_c_id: $.data.id }
            - call: "POST /mill-contracts"
              payload: { mill_id: "${mill_c_id}", species: "DOUGLAS_FIR", grade: "SAWLOG_1", quota_tons: 200, base_rate_cents_per_ton: 4400, period_start: "2026-07-01", period_end: "2026-09-30", overrun_tolerance_pct: 0.05 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mc_c_id: $.data.id }
            - call: "POST /haul-routes"
              payload: { tract_id: "${tract_id}", mill_id: "${mill_c_id}", distance_miles: 40, legal_gross_weight_lbs: 98000, permit_class_required: "STANDARD", status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { route_c_id: $.data.id }
            - call: "POST /loads"
              payload: { tract_id: "${tract_id}", mill_contract_id: "${mc_a_id}", haul_route_id: "${route_a_id}", truck_id: "${truck_id}", declared_species: "DOUGLAS_FIR", declared_grade: "SAWLOG_1", estimated_net_tons: 26.5, scheduled_depart_at: "2026-08-03T08:00:00Z", scheduled_arrive_at: "2026-08-03T10:00:00Z" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { l1_id: $.data.id, l1_prov: $.data.provisional_haul_pay_cents }
            - call: "POST /loads/${l1_id}/depart"
              payload: {}
              as: HaulContractor
              as_user_id: "${hc_id}"
            - call: "POST /loads/${l1_id}/arrive"
              payload: {}
              as: HaulContractor
              as_user_id: "${hc_id}"
            - call: "POST /loads/${l1_id}/delivery-tickets"
              payload: { gross_weight_lbs: 90000, defect_deduction_pct: 0.04, scaled_species: "DOUGLAS_FIR", scaled_grade: "SAWLOG_1" }
              as: MillScaler
              as_user_id: "${mill_a_id}"
              captures: { t1_id: $.data.id, t1_tons: $.data.net_tons }
          trigger:
            - call: "POST /delivery-tickets/${t1_id}/reject"
              payload: { reject_reason: "SPECIES_MISMATCH" }
              as: MillScaler
              as_user_id: "${mill_a_id}"
            - call: "GET /loads"
              payload: { rehaul_of_load_id: "${l1_id}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { rehaul_id: "$.data[0].id", rehaul_mc_id: "$.data[0].mill_contract_id" }
          assert:
            - "Load.${l1_id}.rehaul_status == REHAULED"
            - "${rehaul_mc_id} == ${mc_b_id}"
            - "${rehaul_mc_id} != ${mc_c_id}"
            - "Load.${rehaul_id}.estimated_net_tons == 28.32"
            - "MillContract.${mc_b_id}.reserved_tons == 28.32"
            - "MillContract.${mc_c_id}.reserved_tons == 0.00"

      - name: insurance_revocation_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.HaulContractor.COMPLIANT_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / insurance_revocation_cascade_carrier_truck_load_contract
          rationale: "The §1.8 cascade instance verifies all four hops from certificate revocation to the released quota tons."

      - name: haul_pay_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.load_haul_pay
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_dispatch_pay_versus_final_certified_pay_on_one_load
          rationale: "The §1.8 instance is exactly this layer's claim: both variants computed on one load with different results."

  - section: consistency_model
    instances:

      - name: dispatch_reflects_the_quota_debit_inside_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.mill_contract_quota_position
          - endpoints[POST /loads]
          - entities.Load.fields.provisional_haul_pay_cents
        distinguishing_aspect: |
          The consistency model is immediate, not eventual: the POST /loads response itself
          already carries the computed provisional_haul_pay_cents, and a read of the mill
          contract taken straight afterwards - with no intervening call of any kind - already
          shows reserved_tons 26.50 and available_tons 473.50. No reconciliation pass exists.
