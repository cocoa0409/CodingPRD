              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-05", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-06", hours: 8.00 }
