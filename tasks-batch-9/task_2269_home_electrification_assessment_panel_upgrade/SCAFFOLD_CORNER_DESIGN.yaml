      - name: upward_final_variant_is_capped_by_the_initial_reservation_on_payment
        claim_type: reconciliation
        grounds:
          - calculations.disbursement_reconciliation
          - calculations.measure_incentive_allocation.variants
          - state_machines.RebateProject.VERIFIED_to_PAID
        distinguishing_aspect: |
          The provisional -> final switch is reconciled ASYMMETRICALLY. Here the
          final total (800000) is LARGER than the provisional reservation
          (500000) because the job cost more than estimated, and
          disbursed = min(basis, initial_reserved_amount_cents) clamps the
          payment to 500000 with release_delta 0 — the opposite direction from
          the downward reconciliation, and the program never over-disburses
          against an under-sized reservation.
        test_recipe:
          setup:
            - "One OPEN program (budget 50000000) with catalog item HP-HVAC-01: unit_incentive_cents 800000, measure_cap_cents 800000, HVAC_GROUP, required 200 A, anchor."
            - "A LOW-tier household (share 1.00, cap 1400000)."
            - "A project whose PLANNED estimated_cost_cents is only 500000, so the cost-share cap makes the provisional line 500000; the reservation is therefore 500000."
            - "Installation reports actual_cost_cents 900000, so the final line is min(800000, 800000, 900000) == 800000."
          setup_api_calls:
