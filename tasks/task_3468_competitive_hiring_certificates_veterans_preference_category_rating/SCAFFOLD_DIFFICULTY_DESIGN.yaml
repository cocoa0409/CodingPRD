  - rule_id: resource_temporal_overlap
    instances:
      - name: announcement_period_half_open_adjacency
        grounds:
          - validations[error_id=ERR_ANNOUNCEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource: Position announcement book; interval semantics HALF-OPEN [open_at, close_at) —
          a new period starting exactly at the previous close_at is LEGAL (adjacency allowed), while
          starting one day earlier conflicts. The sibling rule uses closed-interval semantics on a
          different resource (Certificate windows).
        test_recipe:
          setup:
            - "Series S1; GS-9 position CLASSIFIED; announcement A1 with period [2026-09-05, 2026-09-20)."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
