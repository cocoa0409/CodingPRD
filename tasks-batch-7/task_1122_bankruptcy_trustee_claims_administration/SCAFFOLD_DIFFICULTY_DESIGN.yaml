      - name: avoidance_lookback_exact_window_edge
        grounds:
          - calculations.avoidance_lookback_window
          - errors[ERR_TRANSFER_NOT_AVOIDABLE]
        distinguishing_aspect: |
          Metric = transfer date vs lookback window edge in whole days (a
          different metric — calendar days vs cents — and a different endpoint,
          POST /trustee/avoidance_actions/{id}/analyze). Filed 2026-01-15;
          non-insider 90-day window edge = 2025-10-17. A transfer exactly on
          2025-10-17 is avoidable (>=); one on 2025-10-16 is not.
        test_recipe:
          setup:
            - "Case in CLAIMS_ADMINISTRATION, filed_on 2026-01-15; two IDENTIFIED avoidance actions against a non-insider creditor: transfer on 2025-10-17 (edge) and 2025-10-16 (one day outside)"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor K", creditor_ref: "CR-K-1", insider: false, contact_email: "k@x.com" }
