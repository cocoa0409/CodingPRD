        distinguishing_aspect: "The Leg/Booking dispatch transition depends on Permit.status==APPROVED (entity pair Booking<->Permit): dispatch fails ERR_PERMIT_REQUIRED while permit is REQUESTED and succeeds after approval."
        test_recipe:
