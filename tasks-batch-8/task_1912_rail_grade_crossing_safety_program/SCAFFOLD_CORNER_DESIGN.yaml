              as: ProgramAdministrator
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SURFACE", window_start: "2026-09-05T08:00:00Z", window_end: "2026-09-05T12:00:00Z", fouls_track: false }
              as: RailroadMaintainer
              as_user_id: "BNSF"
              captures: { err2: $.data.error_id }
            - call: "POST /maintenance-work-orders"
              payload: { crossing_id: "${cx_id}", category: "SURFACE", window_start: "2026-09-05T08:00:00Z", window_end: "2026-09-05T12:00:00Z", fouls_track: false }
              as: LocalAuthority
