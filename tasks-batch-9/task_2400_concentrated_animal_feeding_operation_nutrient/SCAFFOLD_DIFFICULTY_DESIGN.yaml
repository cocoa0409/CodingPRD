              captures: { op_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_a_id: $.data.id }
            - call: "POST /cafo/permits/${pm_a_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_a_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2030-06-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_b_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2031-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_c_id: $.data.id }
          trigger:
            - call: "POST /cafo/permits/${pm_b_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
            - call: "POST /cafo/permits/${pm_c_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "Permit.${pm_a_id}.coverage_status == COVERED with effective_on 2026-01-01T00:00:00Z and expiration_on 2031-01-01T00:00:00Z"
            - "first trigger call returns status 409 with data.error_id == ERR_PERMIT_COVERAGE_OVERLAP"
            - "Permit.${pm_b_id}.coverage_status is STILL DRAFT_APPLICATION"
            - "second trigger call returns 200 and Permit.${pm_c_id}.coverage_status == SUBMITTED"
            - "Permit.${pm_c_id}.expiration_on == null until coverage is issued"
            - "Permit.${pm_a_id}.coverage_status is unchanged at COVERED after both trigger calls"

  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_application_restores_budget_and_storage_ledgers
        grounds:
          - state_machines.LandApplicationEvent.RECORDED_to_VOIDED
          - endpoints.POST /cafo/application-events/{id}/void
          - entities.FieldNutrientBudget.fields.remaining_gallons
          - entities.ManureStorage.fields.cumulative_outflow_gallons
          - entities.Field.fields.last_application_on
        distinguishing_aspect: |
          Voiding one event must reverse every forward side effect of its creation on THREE ancestors
          at once — budget ledger, structure volume ledger and the field's last_application_on stamp —
          returning each to its exact pre-event literal with no residue.
        test_recipe:
          setup:
            - "Canonical Willow Creek Dairy operation with a COVERED permit, an APPROVED 2026 plan and one ACTIVE budget of 414396 allowable gallons"
            - "One lagoon with 1000000 gallons of intake and no prior outflow"
            - "Field North 40 with last_application_on null before the event"
            - "One RECORDED application event of 300000 gallons on 2026-07-20 that draws the ledgers down"
            - "Logical clock at its default 2026-08-01T00:00:00Z"
