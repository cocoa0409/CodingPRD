          SETUP -> SCHEDULED requires EVERY phase to be at least PARTIALLY_STAFFED, so an
          engagement whose PH1 is staffed but whose PH2 has no bookings is rejected with
          ERR_PHASE_INVALID_STATE — one unstaffed phase is enough, staffing_completion_pct
          is irrelevant.
