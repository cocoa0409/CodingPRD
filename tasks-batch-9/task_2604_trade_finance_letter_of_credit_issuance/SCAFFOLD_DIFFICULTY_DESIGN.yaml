  # =======================================================================
  # RULE 5 - priority_pair_validation_conflict
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_priority4_beats_fiscal_priority26_on_unapproved_over_limit_issue
        grounds:
          - validations[priority=4][category=state]
          - validations[priority=26][category=business_fiscal]
          - errors.ERR_CREDIT_NOT_APPROVED
          - errors.ERR_FACILITY_LIMIT_EXCEEDED
          - state_machines.DocumentaryCredit.APPROVED_to_ISSUED
          - calculations.issuance_charges
        distinguishing_aspect: |
          The conflicting pair here is state (priority 4, 409) versus business_fiscal
          (priority 26, 422): a DRAFT credit whose chargeable_utilisation_cents 20025000
          also blows through a 5000000 facility must return ERR_CREDIT_NOT_APPROVED, and
          the very same request returns ERR_FACILITY_LIMIT_EXCEEDED only once the state
          violation is repaired by approving the credit.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 5000000, collateral_required_pct 0."
            - "One credit of amount_cents 20000000 on that facility, left in status DRAFT (never submitted for approval), expiry_date 2026-10-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Kepler Instruments Oy", country_code: "FI", industry_code: "4652", internal_risk_grade: "BB", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 5000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Suomi Kauppapankki", swift_bic: "SUKPFIHH", country_code: "FI", country_risk_score: 9, credit_rating: "AA", confirmation_appetite_cents: 50000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Shenzhen Optics Works", country_code: "SG", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 20000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Singapore", latest_shipment_date: "2026-09-15", expiry_date: "2026-10-05", expiry_place: "Helsinki", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_id: $.data.id }
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
          trigger:
            - call: "POST /credits/${credit_id}/issue"
              payload: { issue_note: "both a state violation and a fiscal violation are live" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/submit-for-approval"
              payload: { submission_note: "repair the state violation only" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/approve"
              payload: { decision: "APPROVE", approval_note: "approved on relationship grounds" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${credit_id}/issue"
              payload: { issue_note: "only the fiscal violation remains" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_CREDIT_NOT_APPROVED"
            - "trigger call 1 does NOT return error_id == ERR_FACILITY_LIMIT_EXCEEDED"
            - "trigger call 4 returns HTTP 422 with error_id == ERR_FACILITY_LIMIT_EXCEEDED"
            - "DocumentaryCredit.${credit_id}.status == APPROVED"
            - "DocumentaryCredit.${credit_id}.committed_allocation_cents == 0"
            - "CreditFacility.${fac_id}.allocated_cents == 0"
            - "CreditFacility.${fac_id}.available_cents == 5000000"
            - "CreditFacility.${fac_id}.status == ACTIVE"

      - name: safety_priority20_beats_referential_priority24_on_blocked_screening_claim
        grounds:
          - validations[priority=20][category=business_safety]
          - validations[priority=24][category=business_referential]
          - errors.ERR_SANCTIONS_BLOCK
          - errors.ERR_CLAIM_TYPE_MISMATCH
          - state_machines.ScreeningCheck.HIT_PENDING_REVIEW_to_BLOCKED
          - state_machines.Presentation.UNSETTLED_to_CLAIM_LODGED
          - calculations.sanctions_dual_use_score
          - entities.ScreeningCheck.fields.dual_use_hits
