        distinguishing_aspect: |
          Conserved quantity = listing AVAILABILITY COUNT (not money): booking create raises
          active_booking_count 0->1 (forward hold) and cancel from APPROVED lowers it 1->0 (compensating),
          restoring active_booking_count to exactly 0.
        test_recipe:
          setup:
            - "Verified renter; quantity-1 listing; a booking created and APPROVED so active_booking_count == 1 and Deposit HELD=50000."
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_ci2@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
            - call: "POST /users"
              payload: { email: "renter_ci2@x.com", full_name: "Renter", phone: "222" }
              as: Anonymous
              captures: { renter_id: $.data.id }
            - call: "POST /users/${renter_id}/verifications"
              payload: { document_type: "PASSPORT", document_ref: "D1" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { ver_id: $.data.id }
            - call: "POST /verifications/${ver_id}/decide"
              payload: { decision: "APPROVE" }
              as: Platform
            - call: "POST /listings"
              payload: { owner_id: "${owner_id}", title: "Camera", category: "camera", declared_value_cents: 90000, base_daily_rate_cents: 10000, deposit_cents: 50000, quantity: 1 }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
              captures: { lv: $.data.version }
            - call: "POST /bookings"
              payload: { listing_id: "${listing_id}", renter_id: "${renter_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-08T00:00:00Z", expected_listing_version: "${lv}" }
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: Renter
              as_user_id: "${renter_id}"
              captures: { st: $.data.status }
          assert:
            - "Booking.${booking_id}.status == CANCELLED"
            - "Listing.${listing_id}.active_booking_count == 0"
            - "Deposit(booking=${booking_id}).released_cents == 50000"
            - "Deposit(booking=${booking_id}).held_cents == 0"
