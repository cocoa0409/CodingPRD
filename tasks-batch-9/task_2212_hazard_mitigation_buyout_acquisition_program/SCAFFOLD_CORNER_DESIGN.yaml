      - name: declining_a_holdout_parcel_raises_the_viability_ratio_by_shrinking_the_denominator
        claim_type: topological
        grounds:
          - calculations.neighborhood_viability_ratio
          - global_constants.VIABILITY_VIABLE_MIN
          - global_constants.VIABILITY_AT_RISK_MIN
          - entities.MitigationProject.fields.holdout_parcel_count
        distinguishing_aspect: |
          Two adjacent parcels where only one is acquired: the adjacency contributes no edge because
          the holdout severs it, so contiguous_open_space_parcel_count is 1 while the denominator
          counts both still-participating parcels - ratio 0.5 and AT_RISK. DECLINING the holdout does
          not change the numerator but removes it from the participating denominator, so the ratio
          rises to 1.0 and the project becomes VIABLE; re-interesting the same parcel drops it back to
          0.5. The ratio is therefore not monotone in the number of parcels.
        test_recipe:
          setup:
            - "The golden path on parcel P1 (0.34 acres) through a FUNDED closing so P1 reaches CLOSED, plus an untouched parcel P2 (0.41 acres) and a ParcelAdjacency P1-P2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
