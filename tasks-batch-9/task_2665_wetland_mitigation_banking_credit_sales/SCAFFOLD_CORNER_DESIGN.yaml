      # -- corners already asserted as failure paths of §1.8 instances --------
      - name: error_segregation_of_duties_on_release_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: transitive_cascade / cleared_remedial_action_cascades_three_hops_restoring_availability
          rationale: "That instance clears a remedial action with one member and then has the SAME member attempt the restored milestone's release, asserting the 403."

      - name: error_milestone_state_invalid_on_release_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_MILESTONE_STATE_INVALID]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / milestone_state_error_outranks_stewardship_funding_gate
          rationale: "Asserted as the winning error of the priority-40 vs priority-82 pair on a PENDING milestone."

      - name: error_bank_sales_sold_out_on_quote_creation
        claim_type: violation_to_error
        grounds: ["errors[ERR_BANK_SALES_SOLD_OUT]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / quote_for_exactly_available_credits_accepted_then_sold_out
          rationale: "That instance drains credits_available to exactly 0.00 and asserts the next quote's 409 ERR_BANK_SALES_SOLD_OUT."

      - name: error_insufficient_credits_on_quote_creation
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_CREDITS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / quote_for_exactly_available_credits_accepted_then_sold_out
          rationale: "The same instance asserts the <= boundary: exactly credits_available is accepted and one hundredth more returns 422 ERR_INSUFFICIENT_CREDITS."

      - name: error_outside_service_area_on_quote_creation
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTSIDE_SERVICE_AREA]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / outside_service_area_outranks_assignment_requirement_ceiling
          rationale: "Asserted as the winning error of the priority-51 vs priority-74 pair for an impact watershed outside the service area."

      - name: error_monitoring_window_overlap_on_report_creation
        claim_type: violation_to_error
        grounds: ["errors[ERR_MONITORING_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / monitoring_windows_are_half_open_so_adjacency_is_legal
          rationale: "That instance accepts the adjacent window and asserts the 409 for the one-day intersection."

      - name: error_duplicate_monitoring_year_on_report_creation
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_MONITORING_YEAR]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / monitoring_window_overlap_outranks_duplicate_year
          rationale: "Asserted as the loser AND then as the winner of the priority-55 vs priority-60 pair once the windows are made disjoint."

      - name: error_reservation_hold_conflict_on_reserve
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESERVATION_HOLD_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reservation_holds_are_closed_so_touching_endpoints_collide
          rationale: "That instance asserts the 409 for a hold starting exactly at an existing hold's expiry instant."

      - name: error_predecessor_not_released_on_milestone_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREDECESSOR_NOT_RELEASED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / milestone_claim_requires_predecessor_milestone_released
          rationale: "Asserted as the failure path before the predecessor is approved, then as the success path after."

      - name: error_work_plan_missing_on_finalize_review
        claim_type: violation_to_error
        grounds: ["errors[ERR_WORK_PLAN_MISSING]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prospectus_approval_requires_a_submitted_work_plan
          rationale: "Asserted as the 422 raised when the quorum is satisfied but no SUBMITTED work plan exists."

      - name: error_irt_quorum_not_met_on_finalize_review
        claim_type: violation_to_error
        grounds: ["errors[ERR_IRT_QUORUM_NOT_MET]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / irt_quorum_exactly_three_votes_finalizes_review
          rationale: "That instance asserts the 422 at two votes and the success at exactly three."

      - name: error_no_accepted_monitoring_report_on_release_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_ACCEPTED_MONITORING_REPORT]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / perf_milestone_release_requires_accepted_monitoring_report
          rationale: "Asserted as the failure path of a PERF_* release with no ACCEPTED report on the bank."

      - name: error_stewardship_underfunded_on_release_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_STEWARDSHIP_UNDERFUNDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / milestone_state_error_outranks_stewardship_funding_gate
          rationale: "The same instance then fixes the milestone state and asserts the 402 that the funding gate raises on its own."

