      - name: create_lab_order_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=7]
          - errors[ERR_VALIDATION]
          - endpoints[POST /lab-orders]
        distinguishing_aspect: |
          max_protrusive_mm has no default and is required on POST /lab-orders; omitting it is
          ERR_VALIDATION at rung 7 with HTTP 400, not ERR_INVALID_ENUM and not a silent default.
        test_recipe:
          setup:
            - "An ACCEPTED referral and a registered dental lab."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
            - call: "POST /providers"
