  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cabana_overlap_with_turnover_buffer
        grounds:
          - calculations.cabana_rental_overlap_charge
          - entities.Cabana.fields.turnover_buffer_minutes
          - validations[priority=10]
        distinguishing_aspect: |
          Cabana interval semantics include a turnover_buffer expansion on the
          END of each prior rental: a new rental starting at 14:15 against a
          prior rental ending 14:00 (buffer 30) collides because 14:15 < 14:30,
          while a start at exactly 14:30 is allowed. Buffer-expanded half-open.
        test_recipe:
          setup:
            - "A cabana (buffer 30); one HELD rental 10:00-14:00 on it; a PAID order to bill a second rental."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Cab Park", total_gate_capacity: 1000, resident_zip_prefixes: [] }
              as: ParkManager
