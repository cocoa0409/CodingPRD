            - call: "POST /trial-series/${series_id}/analyses"
              payload: { variant: "BALANCED_CORE", expected_series_version: "${sv1}" }
              as: DataAnalyst
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 4, min_locations: 1 }
              as: TrialAgronomist
              captures: { series2_id: $.data.id }
            - call: "POST /trial-series/${series2_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site_id}", plot_count: 12, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a2: $.data.id }
            - call: "POST /nursery-blocks"
              payload: { block_code: "NB-CV1", nursery_type: "WINTER", location_code: "PR_ISABELA", plot_count: 200, fallow_buffer_days: 14 }
              as: BreedingScientist
              captures: { block_id: $.data.id }
            - call: "POST /nursery-plantings"
              payload: { nursery_block_id: "${block_id}", line_id: "${line_a_id}", sow_date: "2026-10-05", expected_harvest_date: "2027-02-10", plot_count: 50 }
              as: BreedingScientist
              captures: { p1_id: $.data.id }
            - call: "POST /nursery-plantings/${p1_id}/plant"
              payload: {}
              as: BreedingScientist
            - call: "GET /breeding-lines/${line_a_id}"
              payload: {}
              as: PipelineDirector
              captures: { la_v1: $.data.version }
            - call: "POST /advancement-decisions"
              payload: { line_id: "${line_a_id}", trial_series_id: "${series_id}", decision: "ADVANCE", granted_plots: 40, expected_line_version: "${la_v1}", rationale: "stage 1 allocation" }
              as: PipelineDirector
              captures: { dec1_id: $.data.id }
            - call: "GET /breeding-programs/${prog_id}"
              payload: {}
              as: PipelineDirector
            - call: "GET /breeding-lines/${line_a_id}"
              payload: {}
              as: PipelineDirector
              captures: { la_v2: $.data.version }
          trigger:
            - call: "POST /advancement-decisions"
              payload: { line_id: "${line_a_id}", trial_series_id: "${series_id}", decision: "HOLD", granted_plots: 0, expected_line_version: "${la_v2}", rationale: "allocation pulled back pending quality data" }
              as: PipelineDirector
              captures: { dec2_id: $.data.id }
            - call: "POST /trial-entries/${e_a2}/withdraw"
              payload: { withdrawal_reason: "SITE_REALLOCATION" }
              as: TrialAgronomist
            - call: "POST /nursery-plantings/${p1_id}/harvest"
              payload: { actual_harvest_date: "2027-02-12", harvested_seed_g: 5000 }
              as: BreedingScientist
          assert:
            - "before the trigger BreedingProgram.${prog_id}.committed_plot_count == 118 and plot_budget_remaining == 4882"
            - "after the HOLD: AdvancementDecision.${dec1_id}.is_superseded == true, AdvancementDecision.${dec2_id}.is_superseded == false, committed_plot_count == 78, plot_budget_remaining == 4922"
            - "the supersession released plots without reverting the stage: BreedingLine.${line_a_id}.pipeline_stage == STAGE_1 and AdvancementDecision.${dec2_id}.from_stage == STAGE_1 and to_stage == STAGE_1"
            - "after the withdrawal: TrialEntry.${e_a2}.status == WITHDRAWN, committed_plot_count == 66, TrialSite.${site_id}.peak_committed_plot_count == 16"
            - "after the harvest: NurseryPlanting.${p1_id}.status == HARVESTED, generation_advanced_to == 7, committed_plot_count == 16 and plot_budget_remaining == 4984"
            - "the invariant closes at every step: 16 entry plots (the two HARVESTED entries) + 0 nursery plots + 0 granted plots == 16"
            - "no double release: a second POST /trial-entries/${e_a2}/withdraw -> 409 ERR_ENTRY_INVALID_STATE and committed_plot_count stays 16"

      - name: seed_mass_conservation_across_lot_completion_and_cancellation
        grounds:
          - entities.BreedingLine.fields.seed_inventory_g
          - entities.BreedingLine.fields.reserved_seed_g
          - entities.BreedingLine.fields.consumed_seed_g
          - entities.BreedingLine.fields.cumulative_seed_produced_g
          - state_machines.SeedIncreaseLot.IN_PRODUCTION_to_COMPLETED
          - state_machines.SeedIncreaseLot.CANCELLED
        distinguishing_aspect: |
          A conservation law over a different ledger, with a completion that is
          deliberately NOT a compensation: seed_inventory_g + reserved_seed_g +
          consumed_seed_g == cumulative_seed_produced_g must hold both after a
          COMPLETED lot moves 386875 g permanently from reserved to consumed while
          crediting 15475000 g of multiplied harvest, and after a CANCELLED lot
          refunds its 35625 g outright. An implementation that refunds on
          completion, or forgets consumed_seed_g, breaks the identity by exactly
          386875 g.
        test_recipe:
          setup:
            - "One program, one objective, line SX-1301 registered with seed_inventory_g 500000 (so cumulative_seed_produced_g starts at 500000)."
            - "The line has an APPROVED stewardship agreement covering US_CORNBELT, CA_PRAIRIE and MX_BAJIO."
            - "Lot 1 covers all three markets (4000 / 9000 / 1300 kg -> 619 bags -> 386875 g) and has been moved to IN_PRODUCTION."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Ledger", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1301", generation_number: 6, seed_inventory_g: 500000, disease_resistance_scores: { RUST: 8, SDS: 7 }, quality_trait_values: { PROTEIN_PCT: 13.4 } }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /breeding-lines/${line_id}/stewardship-agreements"
              payload: { approved_markets: ["US_CORNBELT", "CA_PRAIRIE", "MX_BAJIO"], regulatory_dossier_ref: "DOS-2852-07", grower_agreement_ref: "GA-2852-07", effective_from: "2026-09-01", effective_to: "2029-09-01" }
              as: RegulatoryOfficer
              as_user_id: "ro-1"
              captures: { agr_id: $.data.id }
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "APPROVE" }
              as: RegulatoryOfficer
              as_user_id: "ro-2"
            - call: "POST /seed-increase-lots"
              payload: { line_id: "${line_id}", target_market: "US_CORNBELT", market_allocations: [{ market_code: "US_CORNBELT", demand_kg: 4000 }, { market_code: "CA_PRAIRIE", demand_kg: 9000 }, { market_code: "MX_BAJIO", demand_kg: 1300 }], launch_year: 2028 }
              as: SupplyPlanner
              captures: { lot1_id: $.data.id }
            - call: "POST /seed-increase-lots/${lot1_id}/start-production"
              payload: {}
              as: SupplyPlanner
            - call: "GET /breeding-lines/${line_id}"
              payload: {}
              as: SupplyPlanner
          trigger:
            - call: "POST /seed-increase-lots/${lot1_id}/complete"
              payload: {}
              as: SupplyPlanner
            - call: "POST /seed-increase-lots"
              payload: { line_id: "${line_id}", target_market: "MX_BAJIO", market_allocations: [{ market_code: "MX_BAJIO", demand_kg: 1300 }], launch_year: 2029 }
              as: SupplyPlanner
              captures: { lot2_id: $.data.id }
            - call: "POST /seed-increase-lots/${lot2_id}/cancel"
              payload: { hold_reason: "launch deferred to 2030" }
              as: SupplyPlanner
          assert:
            - "before the trigger: seed_inventory_g == 113125, reserved_seed_g == 386875, consumed_seed_g == 0, cumulative_seed_produced_g == 500000 and the three-term sum equals 500000"
            - "after the completion: SeedIncreaseLot.${lot1_id}.status == COMPLETED, BreedingLine.${line_id}.reserved_seed_g == 0 and consumed_seed_g == 386875"
            - "after the completion: BreedingLine.${line_id}.seed_inventory_g == 15588125 and cumulative_seed_produced_g == 15975000, so 15588125 + 0 + 386875 == 15975000"
            - "the completion is not a refund: seed_inventory_g != 15975000"
            - "after lot 2 is created: SeedIncreaseLot.${lot2_id}.planned_units_bags == 57, allocated_seed_g == 35625, seed_inventory_g == 15552500, reserved_seed_g == 35625 and the sum still equals 15975000"
            - "after the cancellation: SeedIncreaseLot.${lot2_id}.status == CANCELLED, seed_inventory_g == 15588125, reserved_seed_g == 0, consumed_seed_g == 386875 and the sum still equals 15975000"
            - "BreedingLine.${line_id}.planned_launch_units_bags == 619 and BreedingProgram.${prog_id}.pre_commercial_units_bags == 619 (COMPLETED counts, CANCELLED does not)"
