            - "ADCPocket.${pk_id}.on_hand_units == 10 (both rejections side-effect free)"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: hood_session_half_open_adjacency
        grounds:
          - validations[priority=18]
          - entities.HoodSession.fields.start_at
          - entities.HoodSession.fields.end_at
          - errors[ERR_HOOD_OVERLAP]
        distinguishing_aspect: |
          Half-open pairwise interval semantics on resource CompoundingHood: an existing
          session [08:00, 10:00) permits a new session starting exactly at 10:00 (adjacency,
          gap = 0, allowed) but rejects one starting at 09:59:59 (one-second overlap) with
          ERR_HOOD_OVERLAP.
        test_recipe:
          setup:
            - "Hood H; existing session 2026-08-01T08:00:00Z - 2026-08-01T10:00:00Z (SCHEDULED)"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech HO", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-O", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T10:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess1: $.data.id }
          trigger:
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T11:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess2: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T09:59:59Z", end_at: "2026-08-01T10:30:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent session [10:00, 11:00) created successfully (HTTP 201): half-open adjacency with gap 0 is allowed"
            - "overlapping session [09:59:59, 10:30) rejected with error_id == ERR_HOOD_OVERLAP (HTTP 409)"
            - "GET /pharmacy/hood-sessions?hood_id=${hood_id} returns exactly 2 rows"
      - name: coverage_shift_aggregate_capacity_cap
        grounds:
          - validations[priority=19]
          - entities.CoverageShift.fields.zone
          - errors[ERR_COVERAGE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Different interval semantics (aggregate capacity, not pairwise adjacency) on a
          different resource entity (CoverageShift zone vs CompoundingHood): up to 2 shifts
          may overlap in zone CENTRAL at any instant; a third shift overlapping the
          intersection window is rejected ERR_COVERAGE_CAP_EXCEEDED, while a third shift
          abutting the second shift's end (touching at 20:00, half-open) is allowed.
        test_recipe:
          setup:
            - "Three pharmacist staff members; zone CENTRAL"
            - "Shift A 08:00-16:00, shift B 12:00-20:00 (overlap 12:00-16:00 => 2 concurrent, at cap)"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Pharm A", staff_role: "PHARMACIST" }
              as: PharmacyAdmin
              captures: { pharm_a: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Pharm B", staff_role: "PHARMACIST" }
              as: PharmacyAdmin
              captures: { pharm_b: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Pharm C", staff_role: "PHARMACIST" }
              as: PharmacyAdmin
              captures: { pharm_c: $.data.id }
            - call: "POST /pharmacy/coverage-shifts"
              payload: { staff_id: "${pharm_a}", zone: "CENTRAL", start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T16:00:00Z" }
              as: PharmacyAdmin
              captures: { shift_a: $.data.id }
            - call: "POST /pharmacy/coverage-shifts"
              payload: { staff_id: "${pharm_b}", zone: "CENTRAL", start_at: "2026-08-01T12:00:00Z", end_at: "2026-08-01T20:00:00Z" }
              as: PharmacyAdmin
              captures: { shift_b: $.data.id }
          trigger:
            - call: "POST /pharmacy/coverage-shifts"
              payload: { staff_id: "${pharm_c}", zone: "CENTRAL", start_at: "2026-08-01T14:00:00Z", end_at: "2026-08-01T18:00:00Z" }
              as: PharmacyAdmin
              captures: { err: $.data.error_id }
            - call: "POST /pharmacy/coverage-shifts"
              payload: { staff_id: "${pharm_c}", zone: "CENTRAL", start_at: "2026-08-01T20:00:00Z", end_at: "2026-08-01T23:00:00Z" }
              as: PharmacyAdmin
              captures: { shift_c: $.data.id }
          assert:
            - "third shift [14:00, 18:00) rejected: error_id == ERR_COVERAGE_CAP_EXCEEDED (HTTP 409) — it creates a 3-way overlap over [14:00,16:00)"
            - "third shift [20:00, 23:00) accepted (HTTP 201): half-open touch at 20:00 means at most 2 concurrent at every instant"
            - "GET /pharmacy/coverage-shifts?zone=CENTRAL returns exactly 3 rows"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adc_pocket_inventory_conservation
        grounds:
          - calculations.adc_expected_on_hand
          - entities.ADCPocket.fields.on_hand_units
          - entities.InventoryEvent.fields.units_delta
        distinguishing_aspect: |
          Conserved quantity = pocket unit inventory: on_hand_units must always equal the
          chronological replay of InventoryEvent.units_delta; the forward action DISPENSE 3
          paired with its compensating action RETURN 3 leaves on_hand_units unchanged at 50,
          and the count endpoint's expected_on_hand_units confirms replay == stored field.
        test_recipe:
          setup:
            - "Station + pocket (NON_CONTROLLED drug) restocked to 50; verified PO order for 3 units of the drug"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Inv", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech Inv", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Nurse Inv", staff_role: "NURSE" }
              as: PharmacyAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Inv", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugInv", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-I", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_id}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 50, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_id}/dispense"
              payload: { order_id: "${ord_id}", units: 3 }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { after_disp: $.data.on_hand_units }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/return"
              payload: { order_id: "${ord_id}", units: 3 }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { after_ret: $.data.on_hand_units }
            - call: "POST /pharmacy/adc-pockets/${pk_id}/count"
              payload: { physical_count_units: 50 }
              as: Pharmacist
              captures: { var0: $.data.variance_units, exp0: $.data.expected_on_hand_units }
            - call: "GET /pharmacy/adc-pockets/${pk_id}/events"
              payload: {}
              as: Pharmacist
          assert:
            - "after dispense on_hand_units == 47; after compensating return on_hand_units == 50 (dispense + return leave the conserved quantity unchanged)"
            - "count response: expected_on_hand_units == 50 and variance_units == 0 (ledger replay equals stored field; no discrepancy case opened)"
            - "GET events returns 3 rows with units_delta [+50, -3, +3] (RESTOCK, DISPENSE, RETURN) summing to 50"
      - name: batch_mass_conservation_across_rework
        grounds:
          - calculations.batch_yield_and_waste
          - entities.CompoundingBatch.fields.total_drawn_ml
          - entities.CompoundingBatch.fields.delivered_ml
          - entities.CompoundingBatch.fields.waste_ml
        distinguishing_aspect: |
          Conserved quantity = compounded volume (mL), a different quantity type from ADC
          unit inventory: across a full rework cycle (complete -> reject -> rework ->
          complete -> release) the invariant total_drawn_ml == delivered_ml + waste_ml holds
          at every read; final literals: drawn 20.0 == delivered 2.3 + waste 17.7 (7.7 first
          run + 2.3 rejected doses + 7.7 second run).
        test_recipe:
          setup:
            - "Clock at default; four healthy patients; Drug R concentration 10, vial 10"
            - "Four verified IV orders 2.6/2.4/2.5/12.5 mg (demand 2.3 mL, vials 1, drawn 10 mL per run)"
            - "Hood session IN_USE; batch with the four orders, started"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr MC", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech MC", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Pharm MC", staff_role: "PHARMACIST" }
              as: PharmacyAdmin
              captures: { pharm_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat M1", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p1: $.data.id, p1v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat M2", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p2: $.data.id, p2v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat M3", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p3: $.data.id, p3v: $.data.version }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat M4", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { p4: $.data.id, p4v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugMC", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_r: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p1}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 2.6, frequency_per_day: 1, expected_patient_version: "${p1v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o1: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p2}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 2.4, frequency_per_day: 1, expected_patient_version: "${p2v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o2: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p3}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 2.5, frequency_per_day: 1, expected_patient_version: "${p3v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o3: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${p4}", drug_product_id: "${drug_r}", route: "IV", ordered_dose_mg: 12.5, frequency_per_day: 1, expected_patient_version: "${p4v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { o4: $.data.id }
            - call: "POST /pharmacy/medication-orders/${o1}/verify"
              payload: {}
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/medication-orders/${o2}/verify"
              payload: {}
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/medication-orders/${o3}/verify"
              payload: {}
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/medication-orders/${o4}/verify"
              payload: {}
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/hoods"
              payload: { name: "HOOD-MC", iso_class: "ISO_5" }
              as: PharmacyAdmin
              captures: { hood_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions"
              payload: { hood_id: "${hood_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /pharmacy/hood-sessions/${sess_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
