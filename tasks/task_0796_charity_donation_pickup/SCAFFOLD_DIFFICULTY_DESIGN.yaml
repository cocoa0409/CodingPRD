scaffold_difficulty_design:
  # ================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: haul_fee_estimate_vs_final
        grounds:
          - calculations.haul_fee
          - entities.HaulInvoice.fields.estimate_cents
          - entities.HaulInvoice.fields.amount_due_cents
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          On one HAUL request the forward-looking estimate (declared volume, zero diversion) is 10700
          while the chronological final (measured volume + capped diversion credit) yields amount_due 9200 —
          dual-variant on the HaulInvoice/haul-fee domain (distinct from the receipt valuation domain).
        test_recipe:
          setup:
            - "Partner accepts FURNITURE; ACTIVE vehicle capacity 300; route created then OPENED."
            - "Donor creates a HAUL, ATTENDED request; one FURNITURE item volume 120, weight 300."
            - "Request scheduled onto the open route; driver appraises the item stream=RECYCLE."
            - "estimated_haul_fee_cents = 3500 base + tiered(120)=5200 + attended 2000 = 10700."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "GreenDrop", region_code: "CA-BAY", tax_id: "EIN-1", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "T1", capacity_cf: 300, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d1@x.com", full_name: "D One", address: "1 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "HAUL", address: "1 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 120, weight_lbs: 300, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { item_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "PATCH /donation-items/${item_id}"
              payload: { weight_lbs: 300, stream: "RECYCLE" }
              as: Driver
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 120 }
              as: Driver
          assert:
            - "GET /pickup-requests/${req_id}/haul-invoices returns data length 1"
            - "data[0].estimate_cents == 10700"
            - "data[0].final_cents == 10700"
            - "data[0].diversion_credit_cents == 1500"
            - "data[0].amount_due_cents == 9200"

      - name: tax_receipt_provisional_vs_final
        grounds:
          - calculations.tax_receipt_value
          - entities.DonationReceipt.fields.provisional_value_cents
          - entities.DonationReceipt.fields.final_value_cents
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          On one DONATION request the provisional value (declared 1005 @ GOOD 0.70, per item) is 1408 while the
          final value (appraised 2000 @ FAIR 0.40) is 1600 — dual-variant on the DonationReceipt domain,
          a different entity domain than the haul-fee dual variant.
        test_recipe:
          setup:
            - "Partner accepts HOUSEHOLD; vehicle capacity 200; route OPENED."
            - "Donor creates a DONATION, ATTENDED request; two HOUSEHOLD items each volume 25, declared_value 1005, GOOD."
            - "Scheduled; driver appraises both items to value 2000, condition FAIR, stream REUSE."
            - "provisional = round(1005*0.70)=704 per item summed = 1408; final = round(2000*0.40)=800 per item = 1600."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "Habitat", region_code: "CA-BAY", tax_id: "EIN-2", accepted_categories: ["HOUSEHOLD"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "T2", capacity_cf: 200, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d2@x.com", full_name: "D Two", address: "2 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "2 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "HOUSEHOLD", volume_cf: 25, weight_lbs: 10, declared_value_cents: 1005, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { item1_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "HOUSEHOLD", volume_cf: 25, weight_lbs: 10, declared_value_cents: 1005, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { item2_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "PATCH /donation-items/${item1_id}"
              payload: { appraised_value_cents: 2000, appraised_condition: "FAIR", stream: "REUSE" }
              as: Driver
            - call: "PATCH /donation-items/${item2_id}"
              payload: { appraised_value_cents: 2000, appraised_condition: "FAIR", stream: "REUSE" }
              as: Driver
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 50 }
              as: Driver
          assert:
            - "GET /donation-receipts?request_id=${req_id} returns data length 1"
            - "data[0].provisional_value_cents == 1408"
            - "data[0].final_value_cents == 1600"
            - "data[0].status == ISSUED"

  # ================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: haul_fee_tiered_surcharge_credit_mode_a
        grounds:
          - calculations.haul_fee
          - entities.HaulInvoice.fields.final_cents
          - entities.HaulInvoice.fields.diversion_credit_cents
        distinguishing_aspect: |
          Mode (a): haul_fee combines >=3 inputs (tiered volume, attended/unattended surcharge, capped diversion
          credit) via nested min/max; with volume 50 and diverted weight 5000 the 30%-of-subtotal cap binds at 1650
          (not 25000), giving amount_due 3850 — non-linear interaction, distinct from the round-order mode (b).
        test_recipe:
          setup:
            - "Partner accepts FURNITURE; vehicle capacity 100; route OPENED."
            - "Donor creates a HAUL, UNATTENDED request with porch photo + attestation; one FURNITURE item volume 50, weight 5000."
            - "Scheduled; driver appraises stream=RECYCLE, weight 5000."
            - "subtotal = 3500 + tiered(50)=2000 + 0 surcharge = 5500; credit = min(5*5000=25000, round(0.30*5500)=1650)=1650; amount_due = 3850."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "ReuseCo", region_code: "CA-BAY", tax_id: "EIN-3", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "T3", capacity_cf: 100, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d3@x.com", full_name: "D Three", address: "3 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "UNATTENDED", disposition: "HAUL", address: "3 A St", porch_photo_url: "https://x/p3.jpg", safety_attestation: true }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "FURNITURE", volume_cf: 50, weight_lbs: 5000, declared_value_cents: 100, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { item_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "PATCH /donation-items/${item_id}"
              payload: { weight_lbs: 5000, stream: "RECYCLE" }
              as: Driver
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 50 }
              as: Driver
          assert:
            - "GET /pickup-requests/${req_id}/haul-invoices returns data length 1"
            - "data[0].final_cents == 5500"
            - "data[0].diversion_credit_cents == 1650"
            - "data[0].amount_due_cents == 3850"

      - name: tax_receipt_round_per_item_then_sum_mode_b
        grounds:
          - calculations.tax_receipt_value
          - entities.DonationReceipt.fields.provisional_value_cents
        distinguishing_aspect: |
          Mode (b): the pinned round-per-item-then-sum order gives provisional 1408 (704+704) whereas the
          sum-then-round order would give 1407 — rounding-order combinatorial axis, distinct from the tiered mode (a).
        test_recipe:
          setup:
            - "Partner accepts HOUSEHOLD; vehicle capacity 100; route OPENED."
            - "Donor creates a DONATION request; two HOUSEHOLD items each declared_value 1005, GOOD, volume 25."
            - "Completed with no appraisal so final mirrors declared; provisional/final = round(703.5)=704 per item summed = 1408 (NOT 1407)."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "RoundCo", region_code: "CA-BAY", tax_id: "EIN-4", accepted_categories: ["HOUSEHOLD"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "T4", capacity_cf: 100, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d4@x.com", full_name: "D Four", address: "4 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "4 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "HOUSEHOLD", volume_cf: 25, weight_lbs: 10, declared_value_cents: 1005, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "HOUSEHOLD", volume_cf: 25, weight_lbs: 10, declared_value_cents: 1005, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 50 }
              as: Driver
          assert:
            - "GET /donation-receipts?request_id=${req_id} data[0].provisional_value_cents == 1408"
            - "data[0].final_value_cents == 1408"

  # ================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pickup_request_complete_branch_donation_vs_haul
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
          - entities.DonationReceipt
          - entities.HaulInvoice
        distinguishing_aspect: |
          Branching fork on PickupRequest: from SCHEDULED, complete on a DONATION request creates a DonationReceipt
          and zero HaulInvoices, while complete on a HAUL request creates a HaulInvoice and zero DonationReceipts —
          divergent side-effect sets on the same trigger.
        test_recipe:
          setup:
            - "Partner accepts FURNITURE; vehicle capacity 200; route OPENED."
            - "Two requests on one route: reqD (DONATION, item volume 20) and reqH (HAUL, item volume 30)."
            - "Both scheduled at non-overlapping slots (route version re-read between schedules)."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "ForkCo", region_code: "CA-BAY", tax_id: "EIN-5", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "T5", capacity_cf: 200, home_depot_code: "D1" }
              as: PlatformAdmin
              captures: { vehicle_id: $.data.id }
            - call: "POST /routes"
              payload: { vehicle_id: "${vehicle_id}", partner_id: "${partner_id}", service_date: "2026-03-15", window_start: "2026-03-15T09:00:00Z", window_end: "2026-03-15T17:00:00Z" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d5@x.com", full_name: "D Five", address: "5 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "5 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { reqD_id: $.data.id }
            - call: "POST /pickup-requests/${reqD_id}/items"
              payload: { category: "FURNITURE", volume_cf: 20, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${reqD_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { route_v2: $.data.version }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "HAUL", address: "5 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { reqH_id: $.data.id }
            - call: "POST /pickup-requests/${reqH_id}/items"
              payload: { category: "FURNITURE", volume_cf: 30, weight_lbs: 5, declared_value_cents: 1000, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${reqH_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T11:00:00Z", slot_end: "2026-03-15T11:30:00Z", expected_route_version: "${route_v2}" }
              as: Dispatcher
          trigger:
            - call: "POST /pickup-requests/${reqD_id}/complete"
              payload: { measured_volume_cf: 20 }
              as: Driver
            - call: "POST /pickup-requests/${reqH_id}/complete"
              payload: { measured_volume_cf: 30 }
              as: Driver
          assert:
            - "GET /donation-receipts?request_id=${reqD_id} returns data length 1 with data[0].status == ISSUED"
            - "GET /pickup-requests/${reqD_id}/haul-invoices returns data length 0"
            - "GET /pickup-requests/${reqH_id}/haul-invoices returns data length 1 with data[0].status == INVOICED"
            - "GET /donation-receipts?request_id=${reqH_id} returns data length 0"

      - name: recurring_plan_pause_resume_cycle
        grounds:
          - state_machines.RecurringPlan.ACTIVE_to_PAUSED
          - state_machines.RecurringPlan.PAUSED_to_ACTIVE
          - entities.RecurringPlan.fields.status
        distinguishing_aspect: |
          RecurringPlan is a cyclic machine on a different entity than PickupRequest: ACTIVE -> PAUSED (pause) ->
          ACTIVE (resume) returns to the ACTIVE state, a genuine A->B->A loop.
        test_recipe:
          setup:
            - "Partner ACTIVE; donor; plan created ACTIVE then paused to PAUSED."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "CycleCo", region_code: "CA-BAY", tax_id: "EIN-6", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /donors"
              payload: { email: "d6@x.com", full_name: "D Six", address: "6 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /recurring-plans"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", address: "6 A St", default_disposition: "DONATION", frequency: "WEEKLY" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          trigger:
            - call: "POST /recurring-plans/${plan_id}/resume"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
          assert:
            - "GET /recurring-plans/${plan_id} data.status == ACTIVE"
            - "GET /recurring-plans/${plan_id} data.version == 3"

  # ================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_donation_request_to_receipt_to_partner_ytd
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
          - state_machines.DonationReceipt.ISSUED_to_VOIDED
          - calculations.partner_ytd_donation_value
          - entities.CharityPartner.fields.ytd_donation_value_cents
        distinguishing_aspect: |
          Depth-3 chain from the complete trigger: completing a DONATION (link1) causes DonationReceipt issuance
          (link2), whose issuance causes CharityPartner.ytd_donation_value_cents to recompute to 1408 (link3);
          each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Partner accepts HOUSEHOLD, ytd starts 0; vehicle capacity 100; route OPENED."
            - "DONATION request with two HOUSEHOLD items each declared 1005 GOOD, volume 25; scheduled; no appraisal (final==declared)."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "YtdCo", region_code: "CA-BAY", tax_id: "EIN-7", accepted_categories: ["HOUSEHOLD"] }
