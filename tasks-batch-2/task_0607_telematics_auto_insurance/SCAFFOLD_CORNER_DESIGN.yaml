      - name: crash_auto_fnol_claim_created_on_accept
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Trip.OPEN_to_ACCEPTED
          - entities.Trip.fields.crash_detected
          - entities.Claim.fields.origin
        distinguishing_aspect: "Accepting a policy trip carrying a CRASH event of severity>=4 auto-creates an AUTO_FNOL Claim linked by trip_id, discoverable via GET /claims?trip_id=."
