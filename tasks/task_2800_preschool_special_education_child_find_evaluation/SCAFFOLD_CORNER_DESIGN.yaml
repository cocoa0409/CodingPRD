      - name: an_event_cannot_complete_while_a_slot_is_still_booked
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=33]
          - errors[ERR_SCREENING_SLOTS_UNRESOLVED]
          - state_machines.ScreeningEvent.CLOSED_to_COMPLETED
        distinguishing_aspect: |
          The CLOSED -> COMPLETED edge carries an aggregate precondition over the
          event's children: with one slot still BOOKED the transition is
          ERR_SCREENING_SLOTS_UNRESOLVED, and it succeeds only after every slot has
          reached a terminal outcome - resolving them as ATTENDED and NO_SHOW both
          count.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An OPEN event at S1 with two BOOKED slots for two 36-month-old children, then moved to CLOSED."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Kid", last_name: "Alpha", date_of_birth: "2023-08-01", guardian_full_name: "G Alpha", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_a_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Kid", last_name: "Bravo", date_of_birth: "2023-08-01", guardian_full_name: "G Bravo", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_b_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "August Child Find", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 4, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "OPEN" }
              as: ChildFindCoordinator
              captures: { event_v1: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${child_a_id}", slot_start_utc: "2026-08-20T09:00:00Z", expected_screening_event_version: "${event_v1}" }
              as: ChildFindCoordinator
              captures: { slot_a_id: "$.data.id" }
            - call: "GET /child-find/screening-events/${event_id}"
              payload: {}
              as: ChildFindCoordinator
              captures: { event_v2: "$.data.version" }
            - call: "POST /child-find/screening-events/${event_id}/slots"
              payload: { child_id: "${child_b_id}", slot_start_utc: "2026-08-20T09:30:00Z", expected_screening_event_version: "${event_v2}" }
              as: ChildFindCoordinator
              captures: { slot_b_id: "$.data.id" }
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "CLOSED" }
              as: ChildFindCoordinator
          trigger:
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "COMPLETED" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-slots/${slot_a_id}/outcome"
              payload: { attendance: "ATTENDED", screening_result: "PASS" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "COMPLETED" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-slots/${slot_b_id}/outcome"
              payload: { attendance: "NO_SHOW" }
              as: ChildFindCoordinator
            - call: "POST /child-find/screening-events/${event_id}/status"
              payload: { target_status: "COMPLETED" }
              as: ChildFindCoordinator
          assert:
            - "first response.status_code == 409"
            - "first response.data.error_id == \"ERR_SCREENING_SLOTS_UNRESOLVED\""
            - "third response.status_code == 409"
            - "third response.data.error_id == \"ERR_SCREENING_SLOTS_UNRESOLVED\""
            - "ScreeningEvent.${event_id}.status == \"CLOSED\""
            - "fifth response.status_code == 200"
            - "ScreeningEvent.${event_id}.status == \"COMPLETED\""
            - "ScreeningSlot.${slot_a_id}.status == \"ATTENDED\""
            - "ScreeningSlot.${slot_b_id}.status == \"NO_SHOW\""
            - "ScreeningEvent.${event_id}.booked_slot_count == 2"

