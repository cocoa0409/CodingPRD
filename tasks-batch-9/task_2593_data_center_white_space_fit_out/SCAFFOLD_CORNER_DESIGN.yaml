            - "execute_l4_script_without_load_bank_rejected -> 409, error_id == ERR_LOADBANK_PREREQ_MISSING (the L4 script is SCRIPT_APPROVED and the hall is NOMINAL, so only the load-bank prerequisite can fire)"
            - "load_bank_run_on_unapproved_l1_script_rejected -> 409, error_id == ERR_SCRIPT_NOT_APPROVED"
            - "approve_l2_script_while_l1_is_draft_rejected -> 409, error_id == ERR_LEVEL_PREREQ_NOT_MET"
            - "approve_l1_script_succeeds -> 200, script_status == SCRIPT_APPROVED, script_revision == 1, package_state == SCRIPT_APPROVED"
            - "approve_l2_script_still_rejected_after_l1_script_approval -> 409, error_id == ERR_LEVEL_PREREQ_NOT_MET (script approval of L1 is not certification of L1)"
            - "execute_l1_script_as_agent -> 200, script_status == EXECUTED, executed_by_user_id == u-ca-1 (L1 needs no load bank run)"
            - "witness_l1_by_the_executor_rejected -> 422, error_id == ERR_WITNESS_SAME_AS_EXECUTOR"
            - "GET /commissioning-packages/${pkg_l1} as FacilityPlanner -> 200, witness_status == PENDING (the rejected witnessing left no trace)"
            - "witness_l1_by_independent_authority_succeeds -> 200, witness_status == WITNESSED, package_state == CERTIFIED, witnessed_by_user_id == u-wa-1"
            - "GET /halls/${hall_id} as FacilityPlanner -> 200, status == COMMISSIONING (L2 and L4 are not certified and the level set lacks L5, so no bubble-up to LIVE)"

      - name: mop_approval_identity_and_role_distinctness_errors
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_APPROVER_IS_AUTHOR] (422, the approving X-User-ID equals the MOP's author_user_id)"
          - "errors[ERR_DUPLICATE_APPROVER] (409, the same approver_user_id issues a second APPROVE in the same review round)"
          - "errors[ERR_APPROVAL_ROLE_NOT_DISTINCT] (422, the second APPROVE on a HIGH risk MOP comes from the same approver_role as the first)"
          - "§1.2 MethodOfProcedure UNDER_REVIEW self-loop while approval_count < required quorum; HIGH risk requires two approvals from distinct roles"
        distinguishing_aspect: "Three different ways a HIGH-risk approval can be illegitimate, each with its own code and its own precedence: acting as the author is 422 ERR_APPROVER_IS_AUTHOR even though the acting ROLE is a valid approver role; re-approving as the same user is 409 ERR_DUPLICATE_APPROVER (checked before role distinctness at priority 29 vs 30); and a second, different user wearing the same role is 422 ERR_APPROVAL_ROLE_NOT_DISTINCT. Only the fourth, role-distinct approval closes the quorum, so an implementation that merely counts approvals reaches APPROVED two calls too early."
        test_recipe:
          setup: "Hall CX74 in PLANNING with PDU-A1 and BW-A1. One HIGH-risk MOP on BW-A1 authored by u-elec-1 and submitted, so it sits in UNDER_REVIEW with approval_count 0 and a two-approval, two-role quorum."
          setup_api_calls:
            - name: set_clock
              call: "POST /_clock/set_current_utc"
              as: FacilityPlanner
              payload: { current_utc: "2026-08-01T00:00:00Z" }
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "MOP Approval Hall", code: "CX74", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_id: "$.data.id" }
            - name: create_pdu_a
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              captures: { pdu_a: "$.data.id" }
            - name: create_busway_a
              call: "POST /busways"
              as: ElectricalContractor
              payload: { pdu_id: "${pdu_a}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              captures: { bw_a: "$.data.id" }
            - name: create_mop
              call: "POST /mops"
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a}", title: "Busway tap addition", risk_class: "HIGH", backout_plan: "re-terminate tap, re-energize BW-A1", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T06:00:00Z" }
              captures: { mop_id: "$.data.id" }
            - name: submit_mop
              call: "POST /mops/${mop_id}/submit"
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              payload: {}
          trigger:
            - name: author_approving_own_mop_rejected
              call: "POST /mops/${mop_id}/approvals"
              as: ChangeManager
              as_user_id: "u-elec-1"
              payload: { decision: "APPROVE", comment: "self approval" }
              captures: { e_author: "$.data.error_id" }
            - name: first_change_manager_approval_succeeds
              call: "POST /mops/${mop_id}/approvals"
              as: ChangeManager
              as_user_id: "u-cm-1"
              payload: { decision: "APPROVE", comment: "change board ok" }
            - name: same_change_manager_approving_twice_rejected
              call: "POST /mops/${mop_id}/approvals"
              as: ChangeManager
              as_user_id: "u-cm-1"
              payload: { decision: "APPROVE", comment: "again" }
              captures: { e_dup: "$.data.error_id" }
            - name: second_change_manager_same_role_rejected
              call: "POST /mops/${mop_id}/approvals"
              as: ChangeManager
              as_user_id: "u-cm-2"
              payload: { decision: "APPROVE", comment: "colleague from the same board" }
              captures: { e_role: "$.data.error_id" }
            - name: operations_manager_approval_closes_quorum
              call: "POST /mops/${mop_id}/approvals"
              as: OperationsManager
              as_user_id: "u-om-1"
              payload: { decision: "APPROVE", comment: "operations concurs" }
          assert:
            - "author_approving_own_mop_rejected -> 422, error_id == ERR_APPROVER_IS_AUTHOR"
            - "first_change_manager_approval_succeeds -> 200, status == UNDER_REVIEW, approval_count == 1 (self-loop: quorum of 2 not yet met)"
            - "same_change_manager_approving_twice_rejected -> 409, error_id == ERR_DUPLICATE_APPROVER"
            - "second_change_manager_same_role_rejected -> 422, error_id == ERR_APPROVAL_ROLE_NOT_DISTINCT"
            - "GET /mops/${mop_id} as FacilityPlanner -> 200, approval_count == 1 (neither rejected approval was recorded)"
            - "operations_manager_approval_closes_quorum -> 200, status == APPROVED, approval_count == 2"

      - name: mop_execution_authority_and_one_executing_mop_per_hall
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MOP_EXECUTOR_NOT_AUTHOR] (403, revise, execute, close or back-out is attempted by a user other than the MOP author)"
          - "errors[ERR_HALL_MOP_ALREADY_EXECUTING] (409, another MethodOfProcedure of the same hall is already IN_EXECUTION)"
          - "validations[31] author-only execution and validations[24] one IN_EXECUTION MOP per hall"
        distinguishing_aspect: "Execution authority is per USER (author) and not per role — u-mech-1 holds MechanicalContractor, a role that may author MOPs, yet cannot execute someone else's MOP (403, not 409). The concurrency rule is per HALL and not per target resource: two MOPs on two different busways with identical windows both schedule cleanly (no window conflict), but the second execution is refused while the first is IN_EXECUTION."
