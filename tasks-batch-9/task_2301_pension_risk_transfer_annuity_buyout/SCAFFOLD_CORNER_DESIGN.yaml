        grounds:
          - state_machines.LumpSumWindow.PLANNED_to_OPEN
          - errors.ERR_WINDOW_STATE_INVALID
          - constants.NOTICE_PERIOD_DAYS
        distinguishing_aspect: |
          The opening window guard is a half-open interval: the clock must be at or
          after opens_at and strictly before closes_at. At 2026-08-01 with opens_at
          2026-09-01 the attempt is a 409 on the window's own state; advancing the
          clock to exactly 2026-09-01 admits it and the fan-out reports notice_count
          0 because the plan has no cleansed participants. An implementation using
          strict `>` on opens_at fails the second call.
