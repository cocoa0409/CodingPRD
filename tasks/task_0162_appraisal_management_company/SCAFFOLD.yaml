scenario: "Appraisal Management Company (AMC): order intake/assignment, appraiser panel rotation, turnaround SLA, USPAP/UAD compliance check, revision request, fee split, reconsideration of value, AIR independence firewall"
domain_name: appraisal-management-company
api_prefix: "/amc"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Lender
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Lending institution name"
      - name: approved_panel_appraiser_ids
        type: array
        source: input
        description: "List of Appraiser ids this lender has approved onto its panel; assignment is restricted to this set. May be empty."
        default: []
      - name: monthly_fee_budget_cents
        type: integer
        source: input
        description: "Maximum cumulative order_fee_cents the lender authorizes for orders placed in the current calendar month (UTC). Used by the fiscal budget check."
        constraints: ">= 0"
      - name: committed_fee_cents
        type: integer
        source: computed
        description: "Sum of order_fee_cents over this lender's Orders whose status IS NOT in {CANCELLED} and whose placed_at falls in the current calendar month (UTC). Recomputed on order create, order cancel, and fee-split recompute."
        default: 0

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Appraiser legal name"
      - name: license_state
        type: string
        source: input
        description: "Two-letter US state code in which the appraiser is licensed; must equal the subject Property.state_code for eligibility."
        constraints: "2-letter uppercase"
      - name: status
        type: enum
        source: system
        description: "Panel membership state."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, RETIRED}"
      - name: base_fee_share_pct
        type: number
        source: input
        description: "Fraction (0.0–1.0) of order_fee_cents that this appraiser earns under a clean (revision-free, on-time) order, before penalties."
        constraints: "0.0 < value <= 1.0"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of this appraiser's Assignments whose status IS NOT in {DECLINED, CANCELLED, COMPLETED}. Conserved quantity; decremented on cascade cancel and on completion, incremented on accepted assignment."
        default: 0
      - name: completed_count
        type: integer
        source: computed
        description: "Count of this appraiser's Assignments in status COMPLETED. Feeds the panel score."
        default: 0
      - name: on_time_count
        type: integer
        source: computed
        description: "Count of this appraiser's COMPLETED Assignments whose actual_turnaround_hours <= sla_hours. Feeds the panel score."
        default: 0
      - name: last_assigned_at
        type: datetime
        source: computed
        description: "created_at of the most recent Assignment accepted by this appraiser; null if none. Tie-break key for rotation (oldest first)."
        default: null
      - name: panel_score
        type: number
        source: computed
        description: "Weighted rotation-ranking score in [0,1], see calculations.appraiser_panel_score. Recomputed on every Assignment completion and on status change."
        default: 0

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: street_address
        type: string
        source: input
        description: "Subject property street address"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the subject property; must match an appraiser's license_state for assignment eligibility."
        constraints: "2-letter uppercase"
      - name: prior_appraised_value_cents
        type: integer
        source: input
        description: "Optional prior appraised value for the subject; null if none."
        default: null

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: lender_id
        type: string
        source: input
        description: "FK -> Lender.id; the loan-production client that placed this order."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the subject property."
      - name: order_fee_cents
        type: integer
        source: input
        description: "Total fee the lender pays the AMC for this appraisal order (borrower-paid). Drives the fee split and the lender budget check."
        constraints: "> 0"
      - name: product_type
        type: enum
        source: input
        description: "Appraisal product form."
        constraints: "one of {URAR_1004, CONDO_1073, EXTERIOR_2055}"
      - name: rush
        type: boolean
        source: input
        description: "Whether the lender requested rush handling; shortens the SLA and adds a rush premium to the appraiser share."
        default: false
      - name: sla_hours
        type: integer
        source: computed
        description: "Turnaround SLA in hours, derived from product_type and rush at placement: see calculations.turnaround_sla. Fixed once placed."
        default: 0
      - name: placed_at
        type: datetime
        source: computed
        description: "Server clock time when the order transitioned PLACED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state."
        default: PLACED
        constraints: "one of {PLACED, ASSIGNED, IN_PROGRESS, IN_QC, DELIVERED, COMPLETED, CANCELLED}"
      - name: appraised_value_cents
        type: integer
        source: computed
        description: "Mirror of the value on the latest accepted Report once delivered; updated when an ROV changes value. Null until first delivery."
        default: null

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this assignment fulfills."
      - name: appraiser_id
        type: string
        source: computed
        description: "FK -> Appraiser.id; the appraiser the rotation selector picked. Set by the server, not supplied by the caller."
      - name: sla_hours
        type: integer
        source: computed
        description: "Copied from Order.sla_hours at assignment creation; the SLA clock the assignment is measured against."
        default: 0
      - name: accepted_at
        type: datetime
        source: computed
        description: "Server clock time the appraiser accepted; null until ACCEPTED."
        default: null
      - name: inspection_start
        type: datetime
        source: input
        description: "Scheduled start of the on-site inspection window; supplied when the appraiser accepts."
        default: null
      - name: inspection_end
        type: datetime
        source: input
        description: "Scheduled end of the on-site inspection window; must be strictly after inspection_start."
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: "Number of revision cycles this assignment has gone through; 0 at creation, +1 on each REVISION re-open."
        default: 0
      - name: actual_turnaround_hours
        type: number
        source: computed
        description: "Whole-hours elapsed from accepted_at to the COMPLETED transition, see calculations.turnaround_sla (chronological variant). Null until completion."
        default: null
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state."
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, REVISION, COMPLETED, DECLINED, CANCELLED}"
      - name: supersedes_assignment_id
        type: string
        source: computed
        description: "FK -> Assignment.id; when this assignment was created to replace a prior DECLINED/CANCELLED one on the same order, points to it; null for the first assignment."
        default: null

  - name: Report
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; the assignment whose work this report submits. Exactly one Report per Assignment: the first POST creates it; a resubmission supersedes the same Report in place (same id, version increments) rather than creating a new row."
      - name: opinion_of_value_cents
        type: integer
        source: input
        description: "Appraiser's opinion of value for the subject property."
        constraints: "> 0"
      - name: uad_condition_rating
        type: enum
        source: input
        description: "UAD property condition rating C1..C6."
        constraints: "one of {C1, C2, C3, C4, C5, C6}"
      - name: uad_quality_rating
        type: enum
        source: input
        description: "UAD construction quality rating Q1..Q6."
        constraints: "one of {Q1, Q2, Q3, Q4, Q5, Q6}"
      - name: comparable_count
        type: integer
        source: input
        description: "Number of comparable sales included; USPAP minimum is 3."
        constraints: ">= 0"
      - name: submitted_at
        type: datetime
        source: computed
        description: "Server clock time the report was submitted or resubmitted."
        default: null
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, RESUBMITTED, ACCEPTED, REJECTED}"

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> Report.id; the report under USPAP/UAD compliance review."
      - name: uspap_comp_minimum_met
        type: boolean
        source: computed
        description: "True iff the report's comparable_count >= USPAP_MIN_COMPARABLES (3). Computed at review creation from the report snapshot."
        default: false
      - name: uad_ratings_valid
        type: boolean
        source: computed
        description: "True iff both uad_condition_rating and uad_quality_rating are within the allowed UAD enum sets. Computed at review creation."
        default: false
      - name: outcome
        type: enum
        source: system
        description: "Compliance disposition; PENDING until the reviewer finalizes."
        default: PENDING
        constraints: "one of {PENDING, PASS, CONDITIONAL, FAIL}"
      - name: finding_codes
        type: array
        source: input
        description: "Reviewer-supplied USPAP/UAD finding codes captured on a FAIL or CONDITIONAL outcome; empty on PASS."
        default: []

  - name: RevisionRequest
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> Report.id; the report being sent back for revision."
      - name: reason_category
        type: enum
        source: input
        description: "Why the revision is requested. VALUE_DISPUTE is firewall-protected (see RBAC)."
        constraints: "one of {USPAP_DEFICIENCY, UAD_DEFICIENCY, DATA_CORRECTION, VALUE_DISPUTE}"
      - name: origin
        type: enum
        source: system
        description: "What produced this revision: COMPLIANCE (cascaded from a FAIL review) or MANUAL (coordinator-initiated)."
        constraints: "one of {COMPLIANCE, MANUAL}"
      - name: status
        type: enum
        source: system
        description: "Revision lifecycle."
        default: OPEN
        constraints: "one of {OPEN, RESOLVED}"

  - name: ReconsiderationOfValue
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the delivered order whose value is being reconsidered."
      - name: requested_value_cents
        type: integer
        source: input
        description: "The value the requester contends is supportable."
        constraints: "> 0"
      - name: value_delta_pct
        type: number
        source: computed
        description: "Absolute percentage difference between requested_value_cents and the order's delivered appraised_value_cents at ROV creation, see calculations.rov_value_delta."
        default: 0
      - name: requires_second_review
        type: boolean
        source: computed
        description: "True iff value_delta_pct strictly exceeds ROV_DELTA_THRESHOLD_PCT; gates whether a CONDITIONAL resolution is permitted."
        default: false
      - name: resolution
        type: enum
        source: system
        description: "ROV outcome."
        default: REQUESTED
        constraints: "one of {REQUESTED, UNDER_REVIEW, VALUE_CHANGED, VALUE_UPHELD}"
      - name: new_value_cents
        type: integer
        source: input
        description: "Final reconsidered value supplied on a VALUE_CHANGED resolution; null otherwise."
        default: null

  - name: FeeSplit
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this split allocates fee for. Exactly one FeeSplit per order, created when the order is placed."
      - name: variant
        type: enum
        source: system
        description: "Which calculation variant produced the current numbers: PROVISIONAL (at placement) or FINAL (at completion)."
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: appraiser_fee_cents
        type: integer
        source: computed
        description: "Appraiser's share of order_fee_cents, see calculations.fee_split_computation. Recomputed on revision penalty and on finalization."
        default: 0
      - name: amc_fee_cents
        type: integer
        source: computed
        description: "AMC's residual share; always equals Order.order_fee_cents - appraiser_fee_cents (fee-conservation invariant)."
        default: 0
      - name: revision_penalty_cents
        type: integer
        source: computed
        description: "Cumulative penalty shifted from the appraiser share to the AMC share due to revision rounds."
        default: 0

  - name: FirewallEvent
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order whose AIR independence firewall an operation touched."
      - name: actor_role
        type: string
        source: system
        description: "The X-User-Role of the actor whose attempt was blocked or logged."
      - name: blocked_operation
        type: string
        source: system
        description: "Short label of the attempted operation that the firewall denied (e.g., SELECT_APPRAISER, OPEN_VALUE_DISPUTE)."
      - name: error_id
        type: string
        source: system
        description: "The error_id returned to the blocked actor."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: PLACED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLACED
        to: ASSIGNED
        trigger: "POST /amc/orders/{id}/assignments"
        actor: AMCCoordinator
        preconditions:
          - "Order.status == PLACED"
          - "expected_order_version matches Order.version"
          - "at least one eligible Appraiser exists (see calculations.appraiser_panel_score selector)"
        side_effects:
          - "creates an Assignment in OFFERED with appraiser_id chosen by the rotation selector"
          - "sets Assignment.sla_hours = Order.sla_hours"
          - "increments Order.version by 1"
        note: "Initial assignment."
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /amc/orders/{id}/assignments"
        actor: AMCCoordinator
        preconditions:
          - "Order.status == ASSIGNED"
          - "the order's current latest Assignment is in {DECLINED, CANCELLED}"
          - "expected_order_version matches Order.version"
          - "at least one eligible Appraiser exists excluding appraisers already DECLINED on this order"
        side_effects:
          - "creates a superseding Assignment in OFFERED, supersedes_assignment_id = prior assignment id"
          - "increments Order.version by 1"
        note: "Reassignment after decline/cancel; the new assignment legitimately supersedes the prior. See concurrency_rules.assignment-create-stale-order."
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /amc/assignments/{id}/accept (cascade)"
        actor: Appraiser
        preconditions:
          - "the accepting Assignment belongs to this Order and is OFFERED"
        side_effects:
          - "Order advances to IN_PROGRESS"
          - "increments Order.version by 1"
        note: "Bubble-up from Assignment acceptance."
      - from: IN_PROGRESS
        to: IN_QC
        trigger: "POST /amc/assignments/{id}/reports (cascade)"
        actor: Appraiser
        preconditions:
          - "a Report is submitted against this order's accepted Assignment"
        side_effects:
          - "Order advances to IN_QC"
          - "increments Order.version by 1"
      - from: IN_QC
        to: IN_PROGRESS
        trigger: "POST /amc/compliance-reviews/{id}/finalize with outcome FAIL (cascade)"
        actor: ComplianceReviewer
        preconditions:
          - "compliance review on the order's report finalized FAIL"
        side_effects:
          - "Order reverts to IN_PROGRESS"
          - "increments Order.version by 1"
        note: "Tail of the compliance-fail cascade (depth-3): ComplianceReview FAIL -> Report REVISION_REQUESTED -> Assignment REVISION -> Order IN_PROGRESS."
      - from: IN_QC
        to: DELIVERED
        trigger: "POST /amc/compliance-reviews/{id}/finalize with outcome PASS or CONDITIONAL (cascade)"
        actor: ComplianceReviewer
        preconditions:
          - "compliance review on the order's report finalized PASS or CONDITIONAL"
        side_effects:
          - "Report advances to ACCEPTED"
          - "Order advances to DELIVERED, sets Order.appraised_value_cents = Report.opinion_of_value_cents"
          - "increments Order.version by 1"
      - from: DELIVERED
        to: COMPLETED
        trigger: "POST /amc/orders/{id}/complete"
        actor: AMCCoordinator
        preconditions:
          - "Order.status == DELIVERED"
          - "no ReconsiderationOfValue on this order is in {REQUESTED, UNDER_REVIEW}"
          - "expected_order_version matches Order.version"
        side_effects:
          - "Order advances to COMPLETED"
          - "the order's accepted Assignment advances to COMPLETED; sets actual_turnaround_hours (chronological variant)"
          - "Appraiser.active_assignment_count decremented; completed_count, on_time_count, panel_score, last_assigned_at recomputed"
          - "FeeSplit finalized (variant FINAL, see calculations.fee_split_computation)"
          - "increments Order.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /amc/orders/{id}/cancel"
        actor: AMCCoordinator
        preconditions:
          - "Order.status in {PLACED, ASSIGNED, IN_PROGRESS, IN_QC}"
          - "expected_order_version matches Order.version"
        side_effects:
          - "Order advances to CANCELLED"
          - "the order's non-terminal Assignment (if any) cascades to CANCELLED; Appraiser.active_assignment_count decremented"
          - "FeeSplit zeroed (appraiser_fee_cents=0, amc_fee_cents=0)"
          - "Lender.committed_fee_cents recomputed (this order drops out)"
          - "increments Order.version by 1"
        note: "from-state is any of {PLACED, ASSIGNED, IN_PROGRESS, IN_QC}; modeled as one transition."

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /amc/assignments/{id}/accept"
        actor: Appraiser
        preconditions:
          - "Assignment.status == OFFERED"
          - "the acting Appraiser is this assignment's appraiser_id"
          - "inspection_end strictly after inspection_start"
          - "no inspection-window overlap on the same Appraiser (half-open + travel buffer; see validations)"
          - "no inspection-window overlap on the same Property (closed interval, no buffer; see validations)"
        side_effects:
          - "sets accepted_at, inspection_start, inspection_end"
          - "Appraiser.active_assignment_count incremented; Appraiser.last_assigned_at = Assignment.created_at"
          - "cascades Order PLACED/ASSIGNED -> IN_PROGRESS"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /amc/assignments/{id}/decline"
        actor: Appraiser
        preconditions:
          - "Assignment.status == OFFERED"
          - "the acting Appraiser is this assignment's appraiser_id"
        side_effects:
          - "Assignment -> DECLINED"
          - "Order stays ASSIGNED, awaiting reassignment"
      - from: ACCEPTED
        to: REVISION
        trigger: "compliance FAIL cascade or MANUAL revision request"
        actor: system
        preconditions:
          - "a RevisionRequest OPEN exists for the assignment's report"
        side_effects:
          - "Assignment.revision_round incremented by 1"
          - "Report set to REVISION_REQUESTED"
          - "FeeSplit.revision_penalty_cents recomputed; appraiser_fee_cents/amc_fee_cents re-split (fee conservation preserved)"
          - "cascades Order IN_QC -> IN_PROGRESS"
        note: "Middle of the compliance-fail cascade."
      - from: REVISION
        to: ACCEPTED
        trigger: "POST /amc/assignments/{id}/reports (resubmission cascade)"
        actor: Appraiser
        preconditions:
          - "a resubmitted Report exists for this assignment"
        side_effects:
          - "Assignment returns to ACCEPTED"
          - "cascades Order IN_PROGRESS -> IN_QC"
        note: "Revision loop close (cyclic)."
      - from: ACCEPTED
        to: COMPLETED
        trigger: "Order complete cascade"
        actor: system
        preconditions:
          - "owning Order transitioned to COMPLETED"
        side_effects:
          - "sets actual_turnaround_hours; Appraiser counters recomputed"
      - from: OFFERED
        to: CANCELLED
        trigger: "Order cancel cascade"
        actor: system
        preconditions:
          - "owning Order transitioned to CANCELLED"
        side_effects:
          - "Assignment -> CANCELLED"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "Order cancel cascade"
        actor: system
        preconditions:
          - "owning Order transitioned to CANCELLED"
        side_effects:
          - "Assignment -> CANCELLED; Appraiser.active_assignment_count decremented (conservation)"

  - entity: Report
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /amc/reports/{id}/compliance-reviews"
        actor: ComplianceReviewer
        preconditions:
          - "Report.status in {SUBMITTED, RESUBMITTED}"
        side_effects:
          - "creates a ComplianceReview in PENDING; snapshots uspap_comp_minimum_met and uad_ratings_valid"
      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /amc/reports/{id}/compliance-reviews"
        actor: ComplianceReviewer
        preconditions:
          - "Report.status == RESUBMITTED"
        side_effects:
          - "creates a new ComplianceReview in PENDING"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /amc/compliance-reviews/{id}/finalize FAIL (cascade) or POST /amc/reports/{id}/revision-requests"
        actor: ComplianceReviewer
        preconditions:
          - "an OPEN RevisionRequest exists for this report"
        side_effects:
          - "Report -> REVISION_REQUESTED"
          - "cascades Assignment ACCEPTED -> REVISION (see Assignment machine), which itself cascades Order IN_QC -> IN_PROGRESS"
        note: "Head of the compliance-fail cascade (depth-3)."
      - from: REVISION_REQUESTED
        to: RESUBMITTED
        trigger: "POST /amc/assignments/{id}/reports"
        actor: Appraiser
        preconditions:
          - "Report.status == REVISION_REQUESTED"
          - "the open RevisionRequest is resolved by this resubmission"
        side_effects:
          - "the new submission supersedes; RevisionRequest -> RESOLVED"
          - "cascades Assignment REVISION -> ACCEPTED -> Order IN_PROGRESS -> IN_QC"
        note: "Cyclic revision loop."
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /amc/compliance-reviews/{id}/finalize PASS or CONDITIONAL (cascade)"
        actor: ComplianceReviewer
        preconditions:
          - "ComplianceReview finalized PASS or CONDITIONAL"
        side_effects:
          - "Report -> ACCEPTED; cascades Order IN_QC -> DELIVERED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "Order cancel cascade"
        actor: system
        preconditions:
          - "owning Order CANCELLED"
        side_effects:
          - "Report -> REJECTED"

  - entity: ComplianceReview
    initial_state: PENDING
    terminal_states: [PASS, CONDITIONAL, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /amc/compliance-reviews/{id}/finalize"
        actor: ComplianceReviewer
        preconditions:
          - "ComplianceReview.outcome == PENDING"
          - "uspap_comp_minimum_met == true AND uad_ratings_valid == true"
          - "finding_codes is empty"
        side_effects:
          - "outcome -> PASS; cascades Report -> ACCEPTED -> Order DELIVERED"
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /amc/compliance-reviews/{id}/finalize"
        actor: ComplianceReviewer
        preconditions:
          - "ComplianceReview.outcome == PENDING"
          - "uspap_comp_minimum_met == true AND uad_ratings_valid == true"
          - "finding_codes is non-empty AND all are non-USPAP advisory codes"
        side_effects:
          - "outcome -> CONDITIONAL; cascades Report -> ACCEPTED -> Order DELIVERED"
      - from: PENDING
        to: FAIL
        trigger: "POST /amc/compliance-reviews/{id}/finalize"
        actor: ComplianceReviewer
        preconditions:
          - "ComplianceReview.outcome == PENDING"
          - "uspap_comp_minimum_met == false OR uad_ratings_valid == false OR finding_codes contains a USPAP code"
        side_effects:
          - "outcome -> FAIL"
          - "creates a RevisionRequest (origin COMPLIANCE, status OPEN); cascades Report REVISION_REQUESTED -> Assignment REVISION -> Order IN_PROGRESS"

  - entity: ReconsiderationOfValue
    initial_state: REQUESTED
    terminal_states: [VALUE_CHANGED, VALUE_UPHELD]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /amc/reconsiderations/{id}/start-review"
        actor: AMCCoordinator
        preconditions:
          - "ReconsiderationOfValue.resolution == REQUESTED"
          - "owning Order.status == DELIVERED"
        side_effects:
          - "resolution -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: VALUE_CHANGED
        trigger: "POST /amc/reconsiderations/{id}/resolve with new_value_cents"
        actor: AMCCoordinator
        preconditions:
          - "ReconsiderationOfValue.resolution == UNDER_REVIEW"
          - "new_value_cents present and > 0"
          - "if requires_second_review == true, a second ComplianceReview on the report must be PASS or CONDITIONAL"
        side_effects:
          - "resolution -> VALUE_CHANGED"
          - "Order.appraised_value_cents = new_value_cents (cascades FeeSplit recompute, depth-2)"
      - from: UNDER_REVIEW
        to: VALUE_UPHELD
        trigger: "POST /amc/reconsiderations/{id}/resolve without new_value_cents"
        actor: AMCCoordinator
        preconditions:
          - "ReconsiderationOfValue.resolution == UNDER_REVIEW"
          - "new_value_cents absent"
        side_effects:
          - "resolution -> VALUE_UPHELD; no value change; no FeeSplit recompute"
        note: "Branching fork (VALUE_CHANGED vs VALUE_UPHELD) with divergent side-effect sets."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /amc/orders/{id}/assignments"
    occ_field: "expected_order_version"
    description: |
      Creating a superseding Assignment against an Order whose version has
      advanced since the coordinator last observed it is rejected. This
      captures the reassignment case where another writer has already created
      a new Assignment (which legitimately supersedes the prior declined one)
      and the current coordinator's view of the order is therefore stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_split_computation
    trigger: "FeeSplit creation at order placement (PROVISIONAL); on Assignment REVISION (penalty recompute); on Order COMPLETED (FINAL)."
    algorithm: waterfall_allocation
    formula: |
      # All money in integer cents. Rounding order is PINNED: compute each
      # named component with its own round_half_up to whole cents FIRST,
      # THEN sum. (Per-component-then-sum, NOT sum-then-round.)
      base = round_half_up(order_fee_cents * appraiser.base_fee_share_pct)      # component 1
      rush_premium = round_half_up(order_fee_cents * RUSH_PREMIUM_PCT) if Order.rush else 0   # component 2
      gross_appraiser = base + rush_premium
      # revision penalty: each completed revision round shifts a flat fraction
      # of order_fee_cents from appraiser to AMC, computed per-round then summed.
      penalty = 0
      for r in range(Assignment.revision_round):
          penalty += round_half_up(order_fee_cents * REVISION_PENALTY_PCT)      # component 3 (per-round)
      revision_penalty_cents = penalty
      appraiser_fee_cents = max(gross_appraiser - penalty, APPRAISER_FLOOR_CENTS)
      # AMC residual is the conserved complement:
      amc_fee_cents = order_fee_cents - appraiser_fee_cents
    input_set: "Single Order + its Assignment + the assigned Appraiser. Penalty depends on Assignment.revision_round."
    constants:
      RUSH_PREMIUM_PCT: 0.10
      REVISION_PENALTY_PCT: 0.05
      APPRAISER_FLOOR_CENTS: 5000
    precision: "whole cents, round_half_up, per-component then sum"
    variants:
      - name: provisional
        when: "FeeSplit created at order placement, before any revision; revision_round == 0."
        difference: "penalty = 0; variant field set to PROVISIONAL. gross_appraiser only."
      - name: final
        when: "Order COMPLETED."
        difference: "penalty reflects the final Assignment.revision_round; variant field set to FINAL. Different cents from provisional whenever revision_round > 0."

  - name: appraiser_panel_score
    trigger: "Recomputed on every Assignment COMPLETED and on Appraiser status change; read by the rotation selector at assignment creation."
    algorithm: weighted_scoring
    formula: |
      # 3+ inputs, non-linear: nested min, conditional branch on status.
      if appraiser.status != ACTIVE: panel_score = 0.0   # conditional branch
      else:
          completion_rate = (completed_count / max(completed_count + active_assignment_count, 1))
          on_time_rate    = (on_time_count / max(completed_count, 1))
          load_factor     = 1.0 - min(active_assignment_count / MAX_ACTIVE_LOAD, 1.0)   # nested min, capacity-aware
          panel_score = round_half_up_4(
              W_COMPLETION * completion_rate
            + W_ON_TIME    * on_time_rate
            + W_LOAD       * load_factor
          )
    input_set: "Single Appraiser's own counters; no cross-appraiser data."
    constants:
      W_COMPLETION: 0.4
      W_ON_TIME: 0.3
      W_LOAD: 0.3
      MAX_ACTIVE_LOAD: 5
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: rotation_selector
    trigger: "Assignment creation (POST /amc/orders/{id}/assignments)."
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter (candidate set):
      candidates = Appraisers where status == ACTIVE
                   AND license_state == Property.state_code
                   AND id IN Lender.approved_panel_appraiser_ids
                   AND id NOT IN {appraiser_ids of this order's DECLINED assignments}
                   AND active_assignment_count < MAX_ACTIVE_LOAD
      if candidates is empty: FAIL with ERR_NO_ELIGIBLE_APPRAISER
      # Ranking expression (highest first):
      sort_key = panel_score DESC
      # Tie-break 1: fewest active_assignment_count ASC (load balancing)
      # Tie-break 2: oldest last_assigned_at ASC (nulls first = never assigned)
      # Tie-break 3: created_at ASC  (NEVER id)
      selected = first candidate under (panel_score DESC, active_assignment_count ASC,
                 last_assigned_at ASC NULLS FIRST, created_at ASC)
    input_set: "All Appraisers, filtered to the candidate set above; Property.state_code; Lender.approved_panel_appraiser_ids."
    constants:
      MAX_ACTIVE_LOAD: 5
    precision: "n/a (selection)"
    variants: []

  - name: turnaround_sla
    trigger: "sla_hours computed at order placement (forward/projected); actual_turnaround_hours computed at Assignment COMPLETED (chronological)."
    algorithm: forward_looking
    formula: |
      # PROJECTED (forward_looking), at placement — sets Order.sla_hours:
      base_sla = SLA_BASE_HOURS[product_type]      # table lookup
      sla_hours = base_sla - RUSH_SHORTEN_HOURS if Order.rush else base_sla
      # ACTUAL (chronological), at completion — sets Assignment.actual_turnaround_hours:
      actual_turnaround_hours = floor_to_whole_hours(COMPLETED_clock - Assignment.accepted_at)
      # SLA breach (threshold, boundary precision PINNED): breach iff
      #   actual_turnaround_hours > sla_hours      (strictly greater; equal is ON-TIME)
      on_time = actual_turnaround_hours <= sla_hours
    input_set: "PROJECTED: Order.product_type, Order.rush. ACTUAL: Assignment.accepted_at, Order COMPLETED clock time."
    constants:
      SLA_BASE_HOURS: { URAR_1004: 120, CONDO_1073: 96, EXTERIOR_2055: 72 }
      RUSH_SHORTEN_HOURS: 48
    precision: "whole hours; actual floored to whole hours"
    variants:
      - name: projected
        when: "Order placement."
        difference: "forward-looking lookup over product_type + rush; sets the SLA target."
      - name: actual
        when: "Assignment completion."
        difference: "chronological elapsed wall-clock from accepted_at; compared against the projected target with strict-greater breach."

  - name: rov_value_delta
    trigger: "ReconsiderationOfValue creation (POST /amc/orders/{id}/reconsiderations)."
    algorithm: threshold
    formula: |
      delivered = Order.appraised_value_cents     # set at DELIVERED
      value_delta_pct = round_half_up_2(
          abs(requested_value_cents - delivered) / delivered * 100.0
      )
      # threshold, boundary precision PINNED: strictly greater triggers.
      requires_second_review = value_delta_pct > ROV_DELTA_THRESHOLD_PCT
    input_set: "Single ROV + its Order's delivered appraised_value_cents."
    constants:
      ROV_DELTA_THRESHOLD_PCT: 10.0
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: business_safety
    check: "AIR independence firewall (checked BEFORE generic authorization, because it is compliance-critical and must be logged): when the acting role is LenderUser (loan-production side), the firewalled operations — appraiser selection (POST assignments), compliance finalize, and opening a VALUE_DISPUTE revision — are denied with ERR_AIR_FIREWALL_VIOLATION and a FirewallEvent is recorded. This specialization supersedes the generic authorization error for LenderUser on these endpoints; non-LenderUser unauthorized actors fall through to priority 3."
    error_id: ERR_AIR_FIREWALL_VIOLATION
    http_status: 403
    applies_to: "POST /amc/orders/{id}/assignments, POST /amc/compliance-reviews/{id}/finalize, POST /amc/reports/{id}/revision-requests"

  - priority: 3
    category: auth
    check: "Acting role is permitted for the endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (Order before Assignment before Report, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "On assignment creation the rotation selector's candidate set is non-empty after the eligibility filter (status ACTIVE, license_state == Property.state_code, in Lender.approved_panel_appraiser_ids, not previously DECLINED on this order, active_assignment_count < MAX_ACTIVE_LOAD)"
    error_id: ERR_NO_ELIGIBLE_APPRAISER
    http_status: 422
    applies_to: "POST /amc/orders/{id}/assignments"

  - priority: 6
    category: business_referential
    check: "A Report's assignment_id must reference an Assignment whose status is ACCEPTED or REVISION and which belongs to the acting appraiser"
    error_id: ERR_ASSIGNMENT_NOT_REVISABLE
    http_status: 409
    applies_to: "POST /amc/assignments/{id}/reports"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined (Order/Assignment/Report/ComplianceReview/ROV state machines)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_constraint
    check: "Optimistic concurrency: expected_order_version equals Order.version on assignment-create, order-cancel, order-complete"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /amc/orders/{id}/assignments, POST /amc/orders/{id}/cancel, POST /amc/orders/{id}/complete"

  - priority: 9
    category: business_temporal
    check: "On assignment accept, the inspection window must not overlap another ACCEPTED/REVISION assignment of the SAME APPRAISER, treating windows as half-open [start,end) and applying a TRAVEL_BUFFER_MINUTES = 60 gap (two windows collide when the later one starts strictly less than 60 minutes after the earlier one ends, i.e. earlier.end + 60min > later.start)"
    error_id: ERR_APPRAISER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /amc/assignments/{id}/accept"

  - priority: 10
    category: business_temporal
    check: "On assignment accept, the inspection window must not overlap another ACCEPTED/REVISION assignment on the SAME PROPERTY, treating windows as CLOSED [start,end] with NO buffer (boundary touch is a conflict)"
    error_id: ERR_PROPERTY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /amc/assignments/{id}/accept"

  - priority: 11
    category: business_temporal
    check: "inspection_end must be strictly after inspection_start on accept"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /amc/assignments/{id}/accept"

  - priority: 12
    category: business_constraint
    check: "ROV resolve to VALUE_CHANGED when requires_second_review is true requires that a second (post-delivery) ComplianceReview on the order's report be PASS or CONDITIONAL"
    error_id: ERR_SECOND_REVIEW_REQUIRED
    http_status: 409
    applies_to: "POST /amc/reconsiderations/{id}/resolve"

  - priority: 13
    category: business_fiscal
    check: "On order placement, Lender.committed_fee_cents + order_fee_cents must not exceed Lender.monthly_fee_budget_cents for the current calendar month"
    error_id: ERR_LENDER_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /amc/orders"

  - priority: 14
    category: business_constraint
    check: "Field-shape validation: required fields present, enums in range, integers/percents within declared constraints, value_cents > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Lenders ----
  - method: POST
    path: "/amc/lenders"
    description: "Register a lender (loan-production client)."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 201
    input: [name, "approved_panel_appraiser_ids?", monthly_fee_budget_cents]
    output: Lender
    side_effects: []
  - method: GET
    path: "/amc/lenders/{id}"
    description: "Fetch a lender; committed_fee_cents reflects current-month commitments."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 200
    input: []
    output: Lender
    side_effects: []
  - method: PATCH
    path: "/amc/lenders/{id}/panel"
    description: "Set the lender's approved appraiser panel."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: [approved_panel_appraiser_ids]
    output: Lender
    side_effects: ["replaces Lender.approved_panel_appraiser_ids"]

  # ---- Appraisers ----
  - method: POST
    path: "/amc/appraisers"
    description: "Add an appraiser to the AMC roster."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 201
    input: [full_name, license_state, base_fee_share_pct]
    output: Appraiser
    side_effects: ["panel_score initialized to 0"]
  - method: GET
    path: "/amc/appraisers/{id}"
    description: "Fetch an appraiser with computed counters and panel_score."
    roles: [AMCCoordinator, PlatformAdmin, ComplianceReviewer, Appraiser]
    code: 200
    input: []
    output: Appraiser
    side_effects: []
  - method: POST
    path: "/amc/appraisers/{id}/status"
    description: "Change an appraiser's panel status (ACTIVE/SUSPENDED/RETIRED)."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: [status]
    output: Appraiser
    side_effects: ["recomputes panel_score (SUSPENDED/RETIRED -> 0)"]

  # ---- Properties ----
  - method: POST
    path: "/amc/properties"
    description: "Create a subject property."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 201
    input: [street_address, state_code, "prior_appraised_value_cents?"]
    output: Property
    side_effects: []
  - method: GET
    path: "/amc/properties/{id}"
    description: "Fetch a property."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 200
    input: []
    output: Property
    side_effects: []

  # ---- Orders ----
  - method: POST
    path: "/amc/orders"
    description: "Place an appraisal order. Loan-production lender side allowed; assignment is firewalled to coordinators."
    roles: [LenderUser, AMCCoordinator, PlatformAdmin]
    code: 201
    input: [lender_id, property_id, order_fee_cents, product_type, "rush?"]
    output: Order
    side_effects:
      - "computes sla_hours (turnaround_sla projected); sets placed_at; status PLACED"
      - "creates a FeeSplit (PROVISIONAL) for the order"
      - "increments Lender.committed_fee_cents by order_fee_cents"
  - method: GET
    path: "/amc/orders"
    description: "List orders, filterable."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 200
    input: ["lender_id?", "property_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/amc/orders/{id}"
    description: "Fetch an order."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: POST
    path: "/amc/orders/{id}/assignments"
    description: "Coordinator assigns/reassigns the order; server runs the rotation selector to pick the appraiser. Firewalled from LenderUser."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 201
    input: [expected_order_version]
    output: Assignment
    side_effects:
      - "runs rotation_selector; creates Assignment in OFFERED with chosen appraiser_id"
      - "Order PLACED->ASSIGNED (or ASSIGNED->ASSIGNED superseding)"
      - "increments Order.version by 1"
  - method: GET
    path: "/amc/orders/{id}/assignments"
    description: "List a given order's assignments (reverse-reachability for Assignment.order_id)."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: Assignment[]
    side_effects: []
  - method: GET
    path: "/amc/orders/{id}/fee-split"
    description: "Fetch the order's FeeSplit (reverse-reachability for FeeSplit.order_id; array of length 1)."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: FeeSplit[]
    side_effects: []
  - method: GET
    path: "/amc/orders/{id}/reconsiderations"
    description: "List the order's ROVs (reverse-reachability for ROV.order_id)."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 200
    input: []
    output: ReconsiderationOfValue[]
    side_effects: []
  - method: GET
    path: "/amc/orders/{id}/firewall-events"
    description: "List AIR firewall events recorded for the order (reverse-reachability for FirewallEvent.order_id)."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: FirewallEvent[]
    side_effects: []
  - method: POST
    path: "/amc/orders/{id}/complete"
    description: "Coordinator completes a delivered order; finalizes fee split and appraiser counters."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "Order DELIVERED->COMPLETED; Assignment->COMPLETED with actual_turnaround_hours"
      - "Appraiser counters & panel_score recomputed"
      - "FeeSplit finalized (FINAL); increments Order.version by 1"
  - method: POST
    path: "/amc/orders/{id}/cancel"
    description: "Coordinator cancels a non-terminal order; cascades."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "Order->CANCELLED; cascades Assignment->CANCELLED, Report->REJECTED"
      - "FeeSplit zeroed; Lender.committed_fee_cents recomputed; increments Order.version by 1"

  # ---- Assignments ----
  - method: GET
    path: "/amc/assignments"
    description: "List assignments, filterable by appraiser, order, or superseded assignment (reverse-reachability for Assignment.appraiser_id and Assignment.supersedes_assignment_id)."
    roles: [AMCCoordinator, PlatformAdmin, Appraiser]
    code: 200
    input: ["appraiser_id?", "order_id?", "supersedes_assignment_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: GET
    path: "/amc/assignments/{id}"
    description: "Fetch an assignment."
    roles: [AMCCoordinator, PlatformAdmin, Appraiser]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/amc/assignments/{id}/accept"
    description: "Assigned appraiser accepts and schedules the inspection window."
    roles: [Appraiser]
    code: 200
    input: [inspection_start, inspection_end]
    output: Assignment
    side_effects:
      - "Assignment OFFERED->ACCEPTED; sets accepted_at; increments Appraiser.active_assignment_count; last_assigned_at"
      - "cascades Order ASSIGNED->IN_PROGRESS"
  - method: POST
    path: "/amc/assignments/{id}/decline"
    description: "Assigned appraiser declines."
    roles: [Appraiser]
    code: 200
    input: []
    output: Assignment
    side_effects: ["Assignment OFFERED->DECLINED; Order stays ASSIGNED"]
  - method: POST
    path: "/amc/assignments/{id}/reports"
    description: "Appraiser submits or resubmits the appraisal report for the assignment. One Report per assignment: first call creates it (status SUBMITTED); a later call on a REVISION_REQUESTED report supersedes the same Report in place (status RESUBMITTED, same id, version increments)."
    roles: [Appraiser]
    code: 201
    input: [opinion_of_value_cents, uad_condition_rating, uad_quality_rating, comparable_count]
    output: Report
    side_effects:
      - "creates the Report (SUBMITTED) on first call, or supersedes the existing one in place (RESUBMITTED, same id); sets submitted_at"
      - "first submission cascades Order IN_PROGRESS->IN_QC; resubmission closes the open RevisionRequest and cascades REVISION->ACCEPTED->IN_PROGRESS->IN_QC"
  - method: GET
    path: "/amc/assignments/{id}/reports"
    description: "List the assignment's reports (reverse-reachability for Report.assignment_id)."
    roles: [AMCCoordinator, PlatformAdmin, ComplianceReviewer, Appraiser]
    code: 200
    input: []
    output: Report[]
    side_effects: []

  # ---- Reports ----
  - method: GET
    path: "/amc/reports/{id}"
    description: "Fetch a report."
    roles: [AMCCoordinator, PlatformAdmin, ComplianceReviewer, Appraiser]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: POST
    path: "/amc/reports/{id}/compliance-reviews"
    description: "Open a USPAP/UAD compliance review on a submitted/resubmitted report."
    roles: [ComplianceReviewer, PlatformAdmin]
    code: 201
    input: []
    output: ComplianceReview
    side_effects:
      - "creates ComplianceReview PENDING; snapshots uspap_comp_minimum_met, uad_ratings_valid"
      - "Report SUBMITTED/RESUBMITTED->UNDER_REVIEW"
  - method: GET
    path: "/amc/reports/{id}/compliance-reviews"
    description: "List the report's compliance reviews (reverse-reachability for ComplianceReview.report_id)."
    roles: [AMCCoordinator, PlatformAdmin, ComplianceReviewer]
    code: 200
    input: []
    output: ComplianceReview[]
    side_effects: []
  - method: POST
    path: "/amc/reports/{id}/revision-requests"
    description: "Coordinator/compliance manually opens a revision request on a report. VALUE_DISPUTE category is firewalled from LenderUser."
    roles: [AMCCoordinator, ComplianceReviewer, PlatformAdmin]
    code: 201
    input: [reason_category]
    output: RevisionRequest
    side_effects:
      - "creates RevisionRequest (origin MANUAL, OPEN)"
      - "cascades Report UNDER_REVIEW/ACCEPTED-not-applicable -> REVISION_REQUESTED -> Assignment REVISION -> Order IN_PROGRESS"
  - method: GET
    path: "/amc/reports/{id}/revision-requests"
    description: "List the report's revision requests (reverse-reachability for RevisionRequest.report_id)."
    roles: [AMCCoordinator, PlatformAdmin, ComplianceReviewer, Appraiser]
    code: 200
    input: []
    output: RevisionRequest[]
    side_effects: []

  # ---- Compliance reviews ----
  - method: GET
    path: "/amc/compliance-reviews/{id}"
    description: "Fetch a compliance review."
    roles: [AMCCoordinator, PlatformAdmin, ComplianceReviewer]
    code: 200
    input: []
    output: ComplianceReview
    side_effects: []
  - method: POST
    path: "/amc/compliance-reviews/{id}/finalize"
    description: "Reviewer finalizes the review (PASS/CONDITIONAL/FAIL); drives the delivery vs revision cascade. Firewalled from LenderUser."
    roles: [ComplianceReviewer, PlatformAdmin]
    code: 200
    input: ["finding_codes?"]
    output: ComplianceReview
    side_effects:
      - "outcome computed from snapshot + finding_codes"
      - "PASS/CONDITIONAL: Report->ACCEPTED, Order IN_QC->DELIVERED (sets appraised_value_cents)"
      - "FAIL: creates RevisionRequest (COMPLIANCE), Report->REVISION_REQUESTED->Assignment REVISION->Order IN_PROGRESS (FeeSplit penalty recompute)"

  # ---- Reconsideration of Value ----
  - method: POST
    path: "/amc/orders/{id}/reconsiderations"
    description: "Open a reconsideration of value on a delivered order."
    roles: [LenderUser, AMCCoordinator, PlatformAdmin]
    code: 201
    input: [requested_value_cents]
    output: ReconsiderationOfValue
    side_effects:
      - "computes value_delta_pct and requires_second_review (rov_value_delta); resolution REQUESTED"
  - method: GET
    path: "/amc/reconsiderations/{id}"
    description: "Fetch an ROV."
    roles: [AMCCoordinator, PlatformAdmin, LenderUser]
    code: 200
    input: []
    output: ReconsiderationOfValue
    side_effects: []
  - method: POST
    path: "/amc/reconsiderations/{id}/start-review"
    description: "Coordinator moves an ROV into review."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ReconsiderationOfValue
    side_effects: ["resolution REQUESTED->UNDER_REVIEW"]
  - method: POST
    path: "/amc/reconsiderations/{id}/resolve"
    description: "Coordinator resolves an ROV: VALUE_CHANGED (with new_value_cents) or VALUE_UPHELD (without)."
    roles: [AMCCoordinator, PlatformAdmin]
    code: 200
    input: ["new_value_cents?"]
    output: ReconsiderationOfValue
    side_effects:
      - "VALUE_CHANGED: sets Order.appraised_value_cents=new_value_cents (cascades FeeSplit recompute)"
      - "VALUE_UPHELD: no value change"

  # ---- Test-driving (clock) ----
  - method: POST
    path: "/amc/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the server clock to a fixed UTC instant for deterministic SLA/turnaround math."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock now returns the pinned instant for all subsequent placed_at/accepted_at/completion timestamps"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted for this endpoint per RBAC."
  - id: ERR_AIR_FIREWALL_VIOLATION
    http: 403
    condition: "Loan-production (LenderUser) attempted a firewalled operation (appraiser selection, compliance finalize, or VALUE_DISPUTE revision); a FirewallEvent is recorded."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist."
  - id: ERR_NO_ELIGIBLE_APPRAISER
    http: 422
    condition: "Rotation selector's candidate set is empty after eligibility filtering."
  - id: ERR_ASSIGNMENT_NOT_REVISABLE
    http: 409
    condition: "Report submission targets an assignment not in ACCEPTED/REVISION or not owned by the acting appraiser."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match Order.version (OCC)."
  - id: ERR_APPRAISER_WINDOW_CONFLICT
    http: 409
    condition: "Inspection window overlaps another window of the same appraiser within the travel buffer (half-open + buffer)."
  - id: ERR_PROPERTY_WINDOW_CONFLICT
    http: 409
    condition: "Inspection window overlaps another window on the same property (closed interval, no buffer)."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "inspection_end is not strictly after inspection_start."
  - id: ERR_SECOND_REVIEW_REQUIRED
    http: 409
    condition: "ROV VALUE_CHANGED requested where requires_second_review is true but no passing post-delivery compliance review exists."
  - id: ERR_LENDER_BUDGET_EXCEEDED
    http: 422
    condition: "Order placement would push lender's current-month committed_fee_cents over monthly_fee_budget_cents."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, enum out of range, or numeric constraint violated."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AMCCoordinator
    description: "AMC operations staff: order intake, appraiser assignment/rotation, panel management, fee config, ROV handling, completion/cancel."
    identity: opaque
    exclusive_operations:
      - "POST /amc/orders/{id}/assignments (appraiser selection — firewalled from lender side)"
      - "POST /amc/orders/{id}/complete"
      - "POST /amc/orders/{id}/cancel"
      - "POST /amc/reconsiderations/{id}/start-review"
      - "POST /amc/reconsiderations/{id}/resolve"
      - "PATCH /amc/lenders/{id}/panel"
      - "POST /amc/appraisers/{id}/status"
    shared_operations:
      - "POST /amc/lenders"
      - "POST /amc/appraisers"
      - "POST /amc/properties"
      - "POST /amc/orders"
      - "POST /amc/orders/{id}/reconsiderations"
      - "POST /amc/reports/{id}/revision-requests"
      - "GET reads"
  - name: ComplianceReviewer
    description: "USPAP/UAD compliance reviewer; independent of loan production and of order assignment (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /amc/reports/{id}/compliance-reviews"
      - "POST /amc/compliance-reviews/{id}/finalize"
    shared_operations:
      - "POST /amc/reports/{id}/revision-requests"
      - "GET reads on appraisers/reports/compliance-reviews/revision-requests"
  - name: Appraiser
    description: "Panel appraiser; accepts/declines assignments, schedules inspection, submits/resubmits reports. Cannot self-assign."
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /amc/assignments/{id}/accept"
      - "POST /amc/assignments/{id}/decline"
      - "POST /amc/assignments/{id}/reports"
    shared_operations:
      - "GET reads on own assignments/reports/appraiser record"
  - name: LenderUser
    description: "Loan-production client user; places orders and requests ROV. AIR firewall: cannot select appraisers, finalize compliance, or open VALUE_DISPUTE revisions."
    identity: "entity_backed:Lender"
    exclusive_operations: []
    shared_operations:
      - "POST /amc/orders"
      - "POST /amc/properties"
      - "POST /amc/orders/{id}/reconsiderations"
      - "GET reads on own lender/orders/properties/reconsiderations"
  - name: PlatformAdmin
    description: "Superuser/operator: all operations plus the test-driving clock endpoint. Hierarchical override."
    identity: opaque
    exclusive_operations:
      - "POST /amc/_clock/set_current_utc"
    shared_operations:
      - "all business operations (override)"
