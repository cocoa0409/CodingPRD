        test_recipe:
          setup:
            - "Auto cash-out case: notice delivered 2026-08-01, window expired by sweep at 2026-08-31T00:00:01Z, batch EXECUTED, check ISSUED (gross 100000, net 75000); clock advanced past stale_after and ESCHEAT_WARNING delivered >= 90 days before the void"
