scenario: 'Media Rights & Broadcast Deal Administration (sports league media rights

  office): rights package definition by territory/platform/window, bidding

  process & exclusivity terms, rights fee payment schedule & escalators,

  production obligations (number of games/programs) & make-goods,

  sublicensing approval & blackout rules, audience delivery guarantee &

  rating shortfall remedy, contract renewal & matching rights, rights

  conflict monitoring

  '
domain_name: media-rights-broadcast-deals
api_prefix: /
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate
entities:
- name: RightsAsset
  parent: null
  common_fields: true
  fields:
  - name: asset_code
    type: string
    source: input
    description: Unique league code for the underlying competition (e.g. LEAGUE-PL-2026)
  - name: competition_name
    type: string
    source: input
    description: Human name of competition (Premier League, NBA, etc.)
  - name: season_label
    type: string
    source: input
    description: Season identifier (e.g. 2026-27)
  - name: season_start_date
    type: datetime
    source: input
    description: First day of competition season (ISO 8601 UTC)
  - name: season_end_date
    type: datetime
    source: input
    description: Last day of competition season (ISO 8601 UTC; MUST be > season_start_date)
  - name: total_package_pool
    type: integer
    source: input
    description: Maximum number of RightsPackage rows allowed under this asset (>=
      1)
  - name: guaranteed_rating_basis_points
    type: integer
    source: input
    description: League-wide audience delivery guarantee expressed in basis points
      (10000 = 100%); each Deal's audience commitment is measured against this
  - name: status
    type: enum
    source: system
    default: OPEN
    description: OPEN | PACKAGES_LOCKED | AWARD_CLOSED | RETIRED
    constraints: Drives package/deal lifecycle gates
  - name: active_package_count
    type: integer
    source: computed
    default: 0
    description: Count of child RightsPackage rows whose status is in {DRAFT, OPEN_FOR_BIDS,
      UNDER_NEGOTIATION, AWARDED}
- name: Broadcaster
  parent: null
  common_fields: true
  fields:
  - name: legal_name
    type: string
    source: input
    description: Registered legal entity name of bidder/broadcaster
  - name: home_territory
    type: string
    source: input
    description: ISO 3166-1 alpha-2 code of home territory
  - name: platform_classes
    type: array
    source: input
    description: Subset of {LINEAR_TV, SVOD, AVOD, MOBILE, RADIO, SOCIAL_CLIP} this
      broadcaster operates
  - name: credit_rating
    type: enum
    source: input
    description: INVESTMENT_GRADE | SPECULATIVE | UNRATED; gates exclusive-rights
      bids
  - name: status
    type: enum
    source: system
    default: REGISTERED
    description: REGISTERED | ACCREDITED | SUSPENDED | BARRED
- name: RightsPackage
  parent: RightsAsset
  common_fields: true
  fields:
  - name: asset_id
    type: string
    source: system
    description: FK -> RightsAsset.id; owning asset
  - name: package_code
    type: string
    source: input
    description: League-assigned code (e.g. PL-DOM-LIVE-A); unique within asset
  - name: territory_code
    type: string
    source: input
    description: ISO 3166-1 alpha-2 or multi-territory code (e.g. UK, EMEA)
  - name: platform_class
    type: enum
    source: input
    description: LINEAR_TV | SVOD | AVOD | MOBILE | RADIO | SOCIAL_CLIP
  - name: window_start
    type: datetime
    source: input
    description: Inclusive start of exclusive broadcast window
  - name: window_end
    type: datetime
    source: input
    description: Exclusive end of broadcast window (MUST be > window_start); half-open
      interval [window_start, window_end)
  - name: exclusivity_class
    type: enum
    source: input
    description: EXCLUSIVE | CO_EXCLUSIVE | NON_EXCLUSIVE
  - name: minimum_bid_cents
    type: integer
    source: input
    description: Floor for accepted bids (>= 0)
  - name: games_committed
    type: integer
    source: input
    description: Number of live games the winning bidder must produce (>= 0)
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | OPEN_FOR_BIDS | UNDER_NEGOTIATION | AWARDED | WITHDRAWN
  - name: awarded_bid_id
    type: string
    source: system
    description: FK -> Bid.id; populated only when status becomes AWARDED
  - name: awarded_deal_id
    type: string
    source: system
    description: FK -> Deal.id; populated on award
- name: Bid
  parent: RightsPackage
  common_fields: true
  fields:
  - name: package_id
    type: string
    source: system
    description: FK -> RightsPackage.id
  - name: bidder_id
    type: string
    source: input
    description: FK -> Broadcaster.id; the bidder submitting
  - name: round_number
    type: integer
    source: computed
    default: 1
    description: Monotonic per (package_id, bidder_id); incremented on each REBID
  - name: offered_fee_cents
    type: integer
    source: input
    description: Total rights fee offered over full deal term (cents; >= 0)
  - name: upfront_pct
    type: number
    source: input
    description: Fraction of fee due as signing payment, [0.0, 1.0]
  - name: escalator_rate_pct
    type: number
    source: input
    description: Compound annual escalator applied per season (e.g. 0.03 = 3%); [0.0,
      0.25]
  - name: minimum_growth_pct
    type: number
    source: input
    default: 0.0
    description: Minimum season-over-season growth regardless of escalator compounding
      (e.g. 0.02)
  - name: fee_cap_cents
    type: integer
    source: input
    description: Absolute per-season fee ceiling (>= minimum_bid_cents of the package)
  - name: production_commitment_games
    type: integer
    source: input
    description: Games bidder commits to produce per season (>= package.games_committed)
  - name: audience_commitment_pct
    type: number
    source: input
    description: Fraction of RightsAsset.guaranteed_rating_basis_points the bidder
      commits to deliver (0.0, 1.5]
  - name: exclusivity_request
    type: enum
    source: input
    description: MATCH_PACKAGE | NARROWER | BROADER; BROADER only valid when bidder.credit_rating
      == INVESTMENT_GRADE
  - name: parent_bid_id
    type: string
    source: system
    description: FK -> Bid.id; self-referential — set when this Bid is a counter-offer
      round >= 2
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | SUBMITTED | UNDER_REVIEW | SHORTLISTED | COUNTERED | ACCEPTED
      | REJECTED | WITHDRAWN | EXPIRED
- name: Deal
  parent: RightsAsset
  common_fields: true
  fields:
  - name: asset_id
    type: string
    source: system
    description: FK -> RightsAsset.id
  - name: package_id
    type: string
    source: system
    description: FK -> RightsPackage.id; unique
  - name: winning_bid_id
    type: string
    source: system
    description: FK -> Bid.id (the ACCEPTED bid)
  - name: broadcaster_id
    type: string
    source: system
    description: FK -> Broadcaster.id; denormalized from winning bid
  - name: executed_at
    type: datetime
    source: system
    description: Timestamp of execution; system-set
  - name: term_start
    type: datetime
    source: input
    description: First day of deal term
  - name: term_end
    type: datetime
    source: input
    description: Last day of deal term; MUST be > term_start and MUST cover at least
      one full season
  - name: base_fee_cents
    type: integer
    source: system
    description: Season-1 rights fee captured from winning bid; escalators compound
      from this
  - name: escalator_rate_pct
    type: number
    source: system
    description: Copied from winning bid
  - name: minimum_growth_pct
    type: number
    source: system
    description: Copied from winning bid
  - name: fee_cap_cents
    type: integer
    source: system
    description: Copied from winning bid
  - name: total_contracted_fee_cents
    type: integer
    source: computed
    description: Sum over seasons of escalated_rights_fee; computed at execution and
      refreshed on amendment
  - name: audience_commitment_basis_points
    type: integer
    source: system
    description: = RightsAsset.guaranteed_rating_basis_points * winning_bid.audience_commitment_pct,
      rounded to integer basis points
  - name: cumulative_rating_basis_points
    type: integer
    source: computed
    default: 0
    description: Sum of delivered ratings from AudienceMeasurement rows in CONFIRMED
      state
  - name: accrued_shortfall_liability_cents
    type: integer
    source: computed
    default: 0
    description: Running remedy liability owed by broadcaster to league
  - name: accrued_make_good_credit_cents
    type: integer
    source: computed
    default: 0
    description: Running credit owed by league back to broadcaster for unmet production
      obligations
  - name: payment_delinquency_count
    type: integer
    source: computed
    default: 0
    description: Count of PaymentMilestone rows currently in OVERDUE state
  - name: posture
    type: enum
    source: computed
    default: CLEAN
    description: CLEAN | WARNING | FROZEN — derived per deal_posture_rule
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | EXECUTED | ACTIVE | RENEWAL_OPEN | RENEWED | LAPSED | TERMINATED_BREACH
      | TERMINATED_CONVENIENCE
- name: PaymentMilestone
  parent: Deal
  common_fields: true
  fields:
  - name: deal_id
    type: string
    source: system
    description: FK -> Deal.id
  - name: season_index
    type: integer
    source: input
    description: 1-based season number within the deal term (>= 1)
  - name: sequence_in_season
    type: integer
    source: input
    description: 1-based installment number within the season (>= 1)
  - name: due_date
    type: datetime
    source: input
    description: Calendar due date (UTC)
  - name: base_amount_cents
    type: integer
    source: computed
    description: Escalated season fee apportioned by milestone_weight; see payment_schedule_allocation
  - name: milestone_weight
    type: number
    source: input
    description: Fraction of season fee carried by this milestone; weights across
      one season MUST sum to 1.0 exactly
  - name: escalated_amount_cents
    type: integer
    source: computed
    description: Final amount after escalator and late-fee adjustments
  - name: late_fee_cents
    type: integer
    source: computed
    default: 0
    description: Late payment penalty accrued at 0.05% per day past due_date
  - name: paid_at
    type: datetime
    source: system
    description: Timestamp payment was recorded; null until PAID
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED | INVOICED | PAID | OVERDUE | CURED | DEFAULTED
- name: ProductionObligation
  parent: Deal
  common_fields: true
  fields:
  - name: deal_id
    type: string
    source: system
    description: FK -> Deal.id
  - name: season_index
    type: integer
    source: input
    description: 1-based season number this obligation covers
  - name: games_required
    type: integer
    source: system
    description: Copied from winning bid's production_commitment_games
  - name: games_delivered
    type: integer
    source: computed
    default: 0
    description: Count of BroadcastEvent rows linked to this obligation with status
      == DELIVERED
  - name: shortfall_games
    type: integer
    source: computed
    default: 0
    description: games_required - games_delivered, evaluated at season close
  - name: make_good_credit_cents
    type: integer
    source: computed
    default: 0
    description: Credit owed to league; see make_good_credit calculation
  - name: credit_settled_cents
    type: integer
    source: computed
    default: 0
    description: Portion of make_good_credit_cents already applied against PaymentMilestone
      offsets
  - name: status
    type: enum
    source: system
    default: TRACKING
    description: TRACKING | MET | SHORTFALL_DECLARED | REMEDIED | CREDITED
- name: BroadcastEvent
  parent: Deal
  common_fields: true
  fields:
  - name: deal_id
    type: string
    source: system
    description: FK -> Deal.id
  - name: obligation_id
    type: string
    source: system
    description: FK -> ProductionObligation.id; which season obligation this event
      satisfies
  - name: event_code
    type: string
    source: input
    description: Unique event identifier within deal (e.g. PL-2026-WK01-MUN-LIV)
  - name: scheduled_kickoff_utc
    type: datetime
    source: input
    description: Scheduled start (UTC)
  - name: actual_air_start_utc
    type: datetime
    source: system
    description: Timestamp broadcaster actually went to air; null until marked DELIVERED
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED | DELIVERED | CANCELLED_BY_LEAGUE | CANCELLED_BY_BROADCASTER
      | NO_SHOW
- name: AudienceMeasurement
  parent: Deal
  common_fields: true
  fields:
  - name: deal_id
    type: string
    source: system
    description: FK -> Deal.id
  - name: broadcast_event_id
    type: string
    source: input
    description: FK -> BroadcastEvent.id; measurement attaches to a delivered event
  - name: reporting_period_end
    type: datetime
    source: input
    description: End of the audience reporting period covered (UTC)
  - name: rating_basis_points
    type: integer
    source: input
    description: Delivered audience rating for the event (basis points; 0..20000)
  - name: source
    type: enum
    source: input
    description: PANEL | CENSUS | HYBRID
  - name: status
    type: enum
    source: system
    default: PROVISIONAL
    description: PROVISIONAL | CONFIRMED | DISPUTED | EXCLUDED
- name: SublicenseRequest
  parent: Deal
  common_fields: true
  fields:
  - name: deal_id
    type: string
    source: system
    description: FK -> Deal.id
  - name: sublicensee_name
    type: string
    source: input
    description: Third party receiving the sublicense
  - name: sublicensee_territory
    type: string
    source: input
    description: ISO 3166-1 alpha-2 territory of sublicense
  - name: sublicensee_platform_class
    type: enum
    source: input
    description: LINEAR_TV | SVOD | AVOD | MOBILE | RADIO | SOCIAL_CLIP
  - name: requested_window_start
    type: datetime
    source: input
    description: Inclusive start of sublicense window (UTC)
  - name: requested_window_end
    type: datetime
    source: input
    description: Exclusive end of sublicense window (UTC); half-open [start, end)
  - name: proposed_fee_cents
    type: integer
    source: input
    description: Fee sublicensee pays to broadcaster (>= 0)
  - name: league_share_pct
    type: number
    source: input
    default: 0.15
    description: Fraction of proposed_fee owed to league; [0.0, 0.5]
  - name: status
    type: enum
    source: system
    default: PENDING
    description: PENDING | APPROVED | REJECTED | REVOKED
  - name: revoked_reason
    type: string
    source: system
    description: Set when status transitions to REVOKED
- name: BlackoutWindow
  parent: RightsAsset
  common_fields: true
  fields:
  - name: asset_id
    type: string
    source: system
    description: FK -> RightsAsset.id
  - name: territory_code
    type: string
    source: input
    description: Territory where blackout applies
  - name: platform_class
    type: enum
    source: input
    description: Platform class subject to blackout
  - name: blackout_start
    type: datetime
    source: input
    description: Inclusive start (UTC); closed interval start
  - name: blackout_end
    type: datetime
    source: input
    description: Inclusive end (UTC); CLOSED interval [blackout_start, blackout_end]
  - name: applies_to_sublicense_only
    type: boolean
    source: input
    default: false
    description: When true, blackout restricts only sublicensees, not the primary
      broadcaster
  - name: reason
    type: string
    source: input
    description: Human-readable justification (e.g. stadium attendance protection)
- name: RenewalOffer
  parent: Deal
  common_fields: true
  fields:
  - name: deal_id
    type: string
    source: system
    description: FK -> Deal.id being renewed
  - name: offer_source
    type: enum
    source: input
    description: INCUMBENT_BROADCASTER | THIRD_PARTY_BIDDER
  - name: offeror_broadcaster_id
    type: string
    source: input
    description: FK -> Broadcaster.id; who is making the offer
  - name: offered_fee_cents
    type: integer
    source: input
    description: Total fee for renewal term
  - name: escalator_rate_pct
    type: number
    source: input
    description: Renewal escalator (0.0, 0.25]
  - name: matching_window_end
    type: datetime
    source: system
    description: Deadline by which incumbent must match a third-party offer; computed
      as offer submitted_at + MATCHING_WINDOW_DAYS
  - name: matched_by_incumbent
    type: boolean
    source: computed
    default: false
    description: True when incumbent submits a matching offer before matching_window_end
  - name: status
    type: enum
    source: system
    default: OPEN
    description: OPEN | MATCHED | SUPERSEDED | EXERCISED | LAPSED | WITHDRAWN
- name: RightsConflict
  parent: RightsAsset
  common_fields: false
  fields:
  - name: asset_id
    type: string
    source: system
    description: FK -> RightsAsset.id
  - name: conflict_type
    type: enum
    source: system
    description: EXCLUSIVITY_OVERLAP | BLACKOUT_VIOLATION | TERRITORY_COLLISION |
      PLATFORM_COLLISION
  - name: left_entity_kind
    type: enum
    source: system
    description: PACKAGE | SUBLICENSE_REQUEST | DEAL
  - name: left_entity_id
    type: string
    source: system
    description: Id of left-side conflicting entity
  - name: right_entity_kind
    type: enum
    source: system
    description: PACKAGE | SUBLICENSE_REQUEST | DEAL | BLACKOUT_WINDOW
  - name: right_entity_id
    type: string
    source: system
    description: Id of right-side conflicting entity
  - name: detected_at
    type: datetime
    source: system
    description: When the conflict monitor logged this
  - name: detail
    type: string
    source: system
    description: Human-readable diagnostic
state_machines:
- entity: RightsAsset
  initial_state: OPEN
  terminal_states:
  - RETIRED
  transitions:
  - from: OPEN
    to: PACKAGES_LOCKED
    trigger: POST /lock-packages
    actor: RightsManager
    preconditions:
    - RightsAsset.status == OPEN (ERR_ASSET_NOT_OPEN)
    - 'Every child RightsPackage with status == DRAFT has been validated: window within
      season bounds, territory non-empty, games_committed >= 0 (ERR_PACKAGE_DEFINITION_INVALID)'
    side_effects:
    - All DRAFT packages → OPEN_FOR_BIDS
    - Bidding acceptance enabled on all child packages
  - from: PACKAGES_LOCKED
    to: AWARD_CLOSED
    trigger: POST /close-awards
    actor: RightsManager
    preconditions:
    - RightsAsset.status == PACKAGES_LOCKED (ERR_ASSET_NOT_LOCKED)
    - Every child RightsPackage has status in {AWARDED, WITHDRAWN} (ERR_UNRESOLVED_PACKAGES_EXIST)
    side_effects:
    - No new Bid submissions accepted on any child package
  - from: AWARD_CLOSED
    to: RETIRED
    trigger: POST /retire
    actor: RightsManager
    preconditions:
    - RightsAsset.status == AWARD_CLOSED (ERR_ASSET_NOT_AWARD_CLOSED)
    - Every Deal under the asset has status in {RENEWED, LAPSED, TERMINATED_BREACH,
      TERMINATED_CONVENIENCE} (ERR_DEALS_STILL_ACTIVE)
    side_effects: []
- entity: Broadcaster
  initial_state: REGISTERED
  terminal_states:
  - BARRED
  transitions:
  - from: REGISTERED
    to: ACCREDITED
    trigger: POST /broadcasters/{broadcasterId}/accredit
    actor: RightsManager
    preconditions:
    - Broadcaster.status == REGISTERED (ERR_BROADCASTER_NOT_REGISTERED)
    - credit_rating != UNRATED (ERR_BROADCASTER_UNRATED)
    side_effects: []
  - from: ACCREDITED
    to: SUSPENDED
    trigger: POST /broadcasters/{broadcasterId}/suspend
    actor: ComplianceOfficer
    preconditions:
    - Broadcaster.status == ACCREDITED (ERR_BROADCASTER_NOT_ACCREDITED)
    side_effects:
    - All OPEN Bid rows from this bidder on packages still in OPEN_FOR_BIDS → WITHDRAWN
    - All PENDING SublicenseRequest rows tied to deals where broadcaster_id == this
      → REJECTED
  - from: SUSPENDED
    to: ACCREDITED
    trigger: POST /broadcasters/{broadcasterId}/reinstate
    actor: ComplianceOfficer
    preconditions:
    - Broadcaster.status == SUSPENDED (ERR_BROADCASTER_NOT_SUSPENDED)
    side_effects: []
  - from: SUSPENDED
    to: BARRED
    trigger: POST /broadcasters/{broadcasterId}/bar
    actor: ComplianceOfficer
    preconditions:
    - Broadcaster.status == SUSPENDED (ERR_BROADCASTER_NOT_SUSPENDED)
    - At least one Deal where this broadcaster is broadcaster_id has status == TERMINATED_BREACH
      (ERR_NO_BREACH_DEAL)
    side_effects:
    - All non-terminal Deals with this broadcaster → TERMINATED_BREACH
    - 'Cascade: each such deal''s posture → FROZEN, outstanding PaymentMilestones
      → DEFAULTED'
- entity: RightsPackage
  initial_state: DRAFT
  terminal_states:
  - AWARDED
  - WITHDRAWN
  transitions:
  - from: DRAFT
    to: OPEN_FOR_BIDS
    trigger: system (cascade from RightsAsset lock-packages)
    actor: system
    preconditions: []
    side_effects: []
  - from: OPEN_FOR_BIDS
    to: UNDER_NEGOTIATION
    trigger: system (first SUBMITTED bid transitions package to negotiation)
    actor: system
    preconditions: []
    side_effects: []
  - from: UNDER_NEGOTIATION
    to: AWARDED
    trigger: POST /packages/{packageId}/bids/{bidId}/accept
    actor: RightsManager
    preconditions:
    - RightsPackage.status == UNDER_NEGOTIATION (ERR_PACKAGE_NOT_NEGOTIATING)
    - Bid.status == SHORTLISTED (ERR_BID_NOT_SHORTLISTED)
    - No other Bid on this package already ACCEPTED (ERR_PACKAGE_ALREADY_AWARDED)
    side_effects:
    - Bid.status → ACCEPTED
    - All other non-terminal Bid rows on this package → REJECTED
    - Deal is auto-created with status DRAFT and winning_bid_id = this bid
    - RightsPackage.awarded_bid_id and awarded_deal_id populated
    - Exclusivity conflict scan runs against sibling packages (writes RightsConflict
      rows)
  - from: OPEN_FOR_BIDS
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/withdraw
    actor: RightsManager
    preconditions:
    - RightsPackage.status in {OPEN_FOR_BIDS, UNDER_NEGOTIATION} (ERR_PACKAGE_NOT_WITHDRAWABLE)
    side_effects:
    - All non-terminal Bid rows on this package → WITHDRAWN
  - from: UNDER_NEGOTIATION
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/withdraw
    actor: RightsManager
    preconditions:
    - RightsPackage.status in {OPEN_FOR_BIDS, UNDER_NEGOTIATION}
    side_effects:
    - All non-terminal Bid rows on this package → WITHDRAWN
- entity: Bid
  initial_state: DRAFT
  terminal_states:
  - ACCEPTED
  - REJECTED
  - WITHDRAWN
  - EXPIRED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /packages/{packageId}/bids/{bidId}/submit
    actor: BidCoordinator
    preconditions:
    - Bid.status == DRAFT (ERR_BID_NOT_DRAFT)
    - RightsPackage.status in {OPEN_FOR_BIDS, UNDER_NEGOTIATION} (ERR_PACKAGE_NOT_ACCEPTING_BIDS)
    - Bidder Broadcaster.status == ACCREDITED (ERR_BROADCASTER_NOT_ACCREDITED)
    - offered_fee_cents >= package.minimum_bid_cents (ERR_BID_BELOW_FLOOR)
    - production_commitment_games >= package.games_committed (ERR_COMMITMENT_BELOW_PACKAGE)
    side_effects:
    - If package.status == OPEN_FOR_BIDS → package becomes UNDER_NEGOTIATION
  - from: SUBMITTED
    to: UNDER_REVIEW
    trigger: POST /packages/{packageId}/bids/{bidId}/start-review
    actor: RightsManager
    preconditions:
    - Bid.status == SUBMITTED (ERR_BID_NOT_SUBMITTED)
    side_effects: []
  - from: UNDER_REVIEW
    to: SHORTLISTED
    trigger: POST /packages/{packageId}/bids/{bidId}/shortlist
    actor: RightsManager
    preconditions:
    - Bid.status == UNDER_REVIEW (ERR_BID_NOT_UNDER_REVIEW)
    side_effects: []
  - from: UNDER_REVIEW
    to: REJECTED
    trigger: POST /packages/{packageId}/bids/{bidId}/reject
    actor: RightsManager
    preconditions:
    - Bid.status in {UNDER_REVIEW, SHORTLISTED, COUNTERED} (ERR_BID_NOT_REJECTABLE)
    side_effects: []
  - from: SHORTLISTED
    to: COUNTERED
    trigger: POST /packages/{packageId}/bids/{bidId}/counter
    actor: RightsManager
    preconditions:
    - Bid.status == SHORTLISTED (ERR_BID_NOT_SHORTLISTED)
    side_effects:
    - Original bid moves to COUNTERED; the BidCoordinator is expected to file a new
      Bid with parent_bid_id = this bid and round_number incremented
  - from: COUNTERED
    to: SUBMITTED
    trigger: system (when successor Bid with parent_bid_id == this bid is submitted)
    actor: system
    preconditions:
    - Successor Bid.round_number == this.round_number + 1
    side_effects:
    - This Bid's lifecycle effectively ends; successor proceeds through DRAFT → SUBMITTED
  - from: SHORTLISTED
    to: REJECTED
    trigger: POST /packages/{packageId}/bids/{bidId}/reject
    actor: RightsManager
    preconditions:
    - Bid.status in {UNDER_REVIEW, SHORTLISTED, COUNTERED}
    side_effects: []
  - from: COUNTERED
    to: REJECTED
    trigger: POST /packages/{packageId}/bids/{bidId}/reject
    actor: RightsManager
    preconditions:
    - Bid.status in {UNDER_REVIEW, SHORTLISTED, COUNTERED}
    side_effects: []
  - from: SHORTLISTED
    to: ACCEPTED
    trigger: POST /packages/{packageId}/bids/{bidId}/accept
    actor: RightsManager
    preconditions:
    - Bid.status == SHORTLISTED
    - RightsPackage.status == UNDER_NEGOTIATION
    side_effects:
    - Cascade per RightsPackage.UNDER_NEGOTIATION → AWARDED transition
  - from: DRAFT
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/bids/{bidId}/withdraw
    actor: BidCoordinator
    preconditions:
    - Bid.status in {DRAFT, SUBMITTED, UNDER_REVIEW, SHORTLISTED, COUNTERED} (ERR_BID_NOT_WITHDRAWABLE)
    side_effects: []
  - from: SUBMITTED
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/bids/{bidId}/withdraw
    actor: BidCoordinator
    preconditions:
    - Bid.status in {DRAFT, SUBMITTED, UNDER_REVIEW, SHORTLISTED, COUNTERED}
    side_effects: []
  - from: UNDER_REVIEW
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/bids/{bidId}/withdraw
    actor: BidCoordinator
    preconditions:
    - Bid.status in {DRAFT, SUBMITTED, UNDER_REVIEW, SHORTLISTED, COUNTERED}
    side_effects: []
  - from: SHORTLISTED
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/bids/{bidId}/withdraw
    actor: BidCoordinator
    preconditions:
    - Bid.status in {DRAFT, SUBMITTED, UNDER_REVIEW, SHORTLISTED, COUNTERED}
    side_effects: []
  - from: COUNTERED
    to: WITHDRAWN
    trigger: POST /packages/{packageId}/bids/{bidId}/withdraw
    actor: BidCoordinator
    preconditions:
    - Bid.status in {DRAFT, SUBMITTED, UNDER_REVIEW, SHORTLISTED, COUNTERED}
    side_effects: []
- entity: Deal
  initial_state: DRAFT
  terminal_states:
  - RENEWED
  - LAPSED
  - TERMINATED_BREACH
  - TERMINATED_CONVENIENCE
  transitions:
  - from: DRAFT
    to: EXECUTED
    trigger: POST /deals/{dealId}/execute
    actor: RightsManager
    preconditions:
    - Deal.status == DRAFT (ERR_DEAL_NOT_DRAFT)
    - term_start < term_end (ERR_INVALID_TERM)
    - At least one PaymentMilestone row exists for the deal (ERR_NO_PAYMENT_SCHEDULE)
    - At least one ProductionObligation row exists for the deal (ERR_NO_PRODUCTION_OBLIGATION)
    - No UNRESOLVED RightsConflict rows with left_entity_id == this deal (ERR_UNRESOLVED_RIGHTS_CONFLICT)
    side_effects:
    - Deal.executed_at = current logical clock
    - total_contracted_fee_cents recomputed from escalated_rights_fee over all seasons
    - audience_commitment_basis_points computed from RightsAsset.guaranteed_rating_basis_points
      * winning_bid.audience_commitment_pct
  - from: EXECUTED
    to: ACTIVE
    trigger: system (automatic on first PaymentMilestone transition to PAID)
    actor: system
    preconditions:
    - Deal.status == EXECUTED
    - Some PaymentMilestone on this deal has status == PAID
    side_effects:
    - Deal.posture re-evaluated
  - from: ACTIVE
    to: RENEWAL_OPEN
    trigger: POST /deals/{dealId}/open-renewal
    actor: RightsManager
    preconditions:
    - Deal.status == ACTIVE (ERR_DEAL_NOT_ACTIVE)
    - Current logical clock >= term_end - RENEWAL_WINDOW_DAYS (ERR_RENEWAL_WINDOW_NOT_OPEN)
    - Current logical clock < term_end (ERR_DEAL_ALREADY_EXPIRED)
    - Deal.posture != FROZEN (ERR_DEAL_FROZEN)
    side_effects:
    - RenewalOffer rows may now be filed against this deal
  - from: RENEWAL_OPEN
    to: RENEWED
    trigger: POST /deals/{dealId}/renewal-offers/{offerId}/exercise
    actor: RightsManager
    preconditions:
    - Deal.status == RENEWAL_OPEN
    - RenewalOffer.status == MATCHED (incumbent matched) OR (RenewalOffer.status ==
      OPEN AND offer_source == INCUMBENT_BROADCASTER)
    side_effects:
    - Deal.term_end extended by RENEWAL_TERM_YEARS
    - Deal.base_fee_cents reset to winning renewal offer offered_fee_cents
    - New PaymentMilestone + ProductionObligation rows auto-created for the new term
    - All other OPEN RenewalOffer rows on this deal → SUPERSEDED
  - from: RENEWAL_OPEN
    to: LAPSED
    trigger: system (automatic when current logical clock >= term_end and no renewal
      EXERCISED)
    actor: system
    preconditions:
    - Deal.status == RENEWAL_OPEN
    side_effects:
    - All OPEN RenewalOffer rows → LAPSED
  - from: ACTIVE
    to: TERMINATED_BREACH
    trigger: POST /deals/{dealId}/terminate-breach
    actor: ComplianceOfficer
    preconditions:
    - Deal.status == ACTIVE
    - payment_delinquency_count >= BREACH_THRESHOLD OR posture == FROZEN for FROZEN_GRACE_DAYS
      (ERR_BREACH_CONDITION_NOT_MET)
    side_effects:
    - All PaymentMilestones in {SCHEDULED, INVOICED, OVERDUE} → DEFAULTED
    - All ProductionObligations in {TRACKING} → SHORTFALL_DECLARED with shortfall_games
      = games_required - games_delivered
    - All PENDING SublicenseRequests → REJECTED; all APPROVED → REVOKED with reason
      TERMINATION
    - Broadcaster (deal.broadcaster_id) → SUSPENDED
  - from: ACTIVE
    to: TERMINATED_CONVENIENCE
    trigger: POST /deals/{dealId}/terminate-convenience
    actor: RightsManager
    preconditions:
    - Deal.status == ACTIVE
    - payment_delinquency_count == 0 (ERR_OUTSTANDING_DELINQUENCY)
    side_effects:
    - All PaymentMilestones in {SCHEDULED, INVOICED} remain collectible; OVERDUE remain
      CURED-eligible
    - All ProductionObligations freeze with current delivered counts
- entity: PaymentMilestone
  initial_state: SCHEDULED
  terminal_states:
  - PAID
  - CURED
  - DEFAULTED
  transitions:
  - from: SCHEDULED
    to: INVOICED
    trigger: POST /deals/{dealId}/payment-milestones/{milestoneId}/invoice
    actor: FinanceController
    preconditions:
    - PaymentMilestone.status == SCHEDULED (ERR_MILESTONE_NOT_SCHEDULED)
    - Deal.status in {EXECUTED, ACTIVE} (ERR_DEAL_NOT_LIVE)
    side_effects: []
  - from: INVOICED
    to: PAID
    trigger: POST /deals/{dealId}/payment-milestones/{milestoneId}/record-payment
    actor: FinanceController
    preconditions:
    - PaymentMilestone.status == INVOICED
    - Current logical clock <= due_date (otherwise transitions to OVERDUE path)
    side_effects:
    - PaymentMilestone.paid_at = current logical clock
    - If this is the first PAID milestone on the deal and Deal.status == EXECUTED,
      deal → ACTIVE
    - Deal.posture re-evaluated
  - from: INVOICED
    to: OVERDUE
    trigger: system (automatic when current logical clock > due_date and status still
      INVOICED)
    actor: system
    preconditions: []
    side_effects:
    - Deal.payment_delinquency_count += 1
    - late_fee_cents begins accruing at LATE_FEE_DAILY_RATE per day past due
    - Deal.posture re-evaluated (may → WARNING)
  - from: OVERDUE
    to: CURED
    trigger: POST /deals/{dealId}/payment-milestones/{milestoneId}/record-payment
    actor: FinanceController
    preconditions:
    - PaymentMilestone.status == OVERDUE
    side_effects:
    - paid_at = current logical clock
    - late_fee_cents finalized at (current_time - due_date days) * escalated_amount_cents
      * LATE_FEE_DAILY_RATE
    - Deal.payment_delinquency_count -= 1
    - Deal.posture re-evaluated
  - from: OVERDUE
    to: DEFAULTED
    trigger: POST /deals/{dealId}/payment-milestones/{milestoneId}/declare-default
    actor: FinanceController
    preconditions:
    - PaymentMilestone.status == OVERDUE
    - Current logical clock >= due_date + DEFAULT_GRACE_DAYS (ERR_DEFAULT_GRACE_NOT_ELAPSED)
    side_effects:
    - Deal.payment_delinquency_count -= 1
    - Deal.accrued_shortfall_liability_cents += escalated_amount_cents + late_fee_cents
    - Deal.posture → FROZEN
- entity: ProductionObligation
  initial_state: TRACKING
  terminal_states:
  - MET
  - REMEDIED
  - CREDITED
  transitions:
  - from: TRACKING
    to: MET
    trigger: system (automatic when games_delivered == games_required at or before
      season close)
    actor: system
    preconditions: []
    side_effects:
    - Deal.posture re-evaluated
  - from: TRACKING
    to: SHORTFALL_DECLARED
    trigger: POST /deals/{dealId}/production-obligations/{obligationId}/declare-shortfall
    actor: ProductionAuditor
    preconditions:
    - ProductionObligation.status == TRACKING
    - Current logical clock > season end for this season_index
    - games_delivered < games_required (ERR_NO_SHORTFALL)
    side_effects:
    - shortfall_games = games_required - games_delivered
    - make_good_credit_cents computed via make_good_credit calculation
    - Deal.accrued_make_good_credit_cents += make_good_credit_cents
    - Deal.posture re-evaluated
  - from: SHORTFALL_DECLARED
    to: REMEDIED
    trigger: POST /deals/{dealId}/production-obligations/{obligationId}/apply-remedy
    actor: ProductionAuditor
    preconditions:
    - ProductionObligation.status == SHORTFALL_DECLARED
    - credit_settled_cents == make_good_credit_cents (full credit offset against PaymentMilestones)
    side_effects:
    - Deal.accrued_make_good_credit_cents -= make_good_credit_cents
    - Deal.posture re-evaluated
  - from: SHORTFALL_DECLARED
    to: CREDITED
    trigger: POST /deals/{dealId}/production-obligations/{obligationId}/forgive-credit
    actor: RightsManager
    preconditions:
    - ProductionObligation.status == SHORTFALL_DECLARED
    - credit_settled_cents == 0 (no partial offsets yet)
    side_effects:
    - Deal.accrued_make_good_credit_cents -= make_good_credit_cents
    - make_good_credit_cents zeroed
    - Deal.posture re-evaluated
- entity: BroadcastEvent
  initial_state: SCHEDULED
  terminal_states:
  - DELIVERED
  - CANCELLED_BY_LEAGUE
  - CANCELLED_BY_BROADCASTER
  - NO_SHOW
  transitions:
  - from: SCHEDULED
    to: DELIVERED
    trigger: POST /deals/{dealId}/broadcast-events/{eventId}/mark-delivered
    actor: ProductionAuditor
    preconditions:
    - BroadcastEvent.status == SCHEDULED
    - actual_air_start_utc is provided
    side_effects:
    - ProductionObligation.games_delivered += 1 (linked obligation)
    - If games_delivered == games_required and obligation still TRACKING, obligation
      → MET
  - from: SCHEDULED
    to: NO_SHOW
    trigger: POST /deals/{dealId}/broadcast-events/{eventId}/mark-no-show
    actor: ProductionAuditor
    preconditions:
    - BroadcastEvent.status == SCHEDULED
    - Current logical clock > scheduled_kickoff_utc + NO_SHOW_GRACE_HOURS
    side_effects: []
  - from: SCHEDULED
    to: CANCELLED_BY_LEAGUE
    trigger: POST /deals/{dealId}/broadcast-events/{eventId}/cancel-by-league
    actor: RightsManager
    preconditions:
    - BroadcastEvent.status == SCHEDULED
    side_effects:
    - Linked ProductionObligation.games_required -= 1 (league absorbs the shortfall)
  - from: SCHEDULED
    to: CANCELLED_BY_BROADCASTER
    trigger: POST /deals/{dealId}/broadcast-events/{eventId}/cancel-by-broadcaster
    actor: ProductionAuditor
    preconditions:
    - BroadcastEvent.status == SCHEDULED
    side_effects: []
- entity: AudienceMeasurement
  initial_state: PROVISIONAL
  terminal_states:
  - CONFIRMED
  - EXCLUDED
  transitions:
  - from: PROVISIONAL
    to: CONFIRMED
    trigger: POST /deals/{dealId}/audience-measurements/{measurementId}/confirm
    actor: ProductionAuditor
    preconditions:
    - AudienceMeasurement.status == PROVISIONAL
    - Linked BroadcastEvent.status == DELIVERED (ERR_EVENT_NOT_DELIVERED)
    side_effects:
    - Deal.cumulative_rating_basis_points += rating_basis_points
    - Deal.posture re-evaluated
  - from: PROVISIONAL
    to: DISPUTED
    trigger: POST /deals/{dealId}/audience-measurements/{measurementId}/dispute
    actor: BidCoordinator
    preconditions:
    - AudienceMeasurement.status == PROVISIONAL
    side_effects: []
  - from: DISPUTED
    to: CONFIRMED
    trigger: POST /deals/{dealId}/audience-measurements/{measurementId}/confirm
    actor: ProductionAuditor
    preconditions:
    - AudienceMeasurement.status in {PROVISIONAL, DISPUTED}
    side_effects:
    - Deal.cumulative_rating_basis_points += rating_basis_points
  - from: DISPUTED
    to: EXCLUDED
    trigger: POST /deals/{dealId}/audience-measurements/{measurementId}/exclude
    actor: ComplianceOfficer
    preconditions:
    - AudienceMeasurement.status == DISPUTED
    side_effects: []
- entity: SublicenseRequest
  initial_state: PENDING
  terminal_states:
  - APPROVED
  - REJECTED
  - REVOKED
  transitions:
  - from: PENDING
    to: APPROVED
    trigger: POST /deals/{dealId}/sublicense-requests/{requestId}/approve
    actor: RightsManager
    preconditions:
    - SublicenseRequest.status == PENDING
    - Deal.status == ACTIVE (ERR_DEAL_NOT_ACTIVE)
    - Deal.posture != FROZEN (ERR_DEAL_FROZEN)
    - Requested window does not overlap any BlackoutWindow matching territory & platform
      (closed-interval check) — ERR_BLACKOUT_VIOLATION
    - Requested window is a strict subset of parent package window [window_start,
      window_end) — ERR_SUBLICENSE_WINDOW_OUTSIDE_PACKAGE
    - No APPROVED sublicense on same deal with overlapping (territory, platform, window)
      — ERR_SUBLICENSE_OVERLAP
    side_effects:
    - 'League share fee accrues: league_share_accrued = proposed_fee_cents * league_share_pct'
  - from: PENDING
    to: REJECTED
    trigger: POST /deals/{dealId}/sublicense-requests/{requestId}/reject
    actor: RightsManager
    preconditions:
    - SublicenseRequest.status == PENDING
    side_effects: []
  - from: APPROVED
    to: REVOKED
    trigger: POST /deals/{dealId}/sublicense-requests/{requestId}/revoke
    actor: ComplianceOfficer
    preconditions:
    - SublicenseRequest.status == APPROVED
    - Either parent Deal.status transitioned to TERMINATED_*, or a new BlackoutWindow
      has been created that covers this sublicense's (territory, platform, window)
      (ERR_REVOKE_CONDITION_NOT_MET)
    side_effects:
    - revoked_reason populated
    - If revoke is due to blackout, a RightsConflict row is created with conflict_type
      = BLACKOUT_VIOLATION
- entity: RenewalOffer
  initial_state: OPEN
  terminal_states:
  - MATCHED
  - SUPERSEDED
  - EXERCISED
  - LAPSED
  - WITHDRAWN
  transitions:
  - from: OPEN
    to: MATCHED
    trigger: POST /deals/{dealId}/renewal-offers/{offerId}/match
    actor: BidCoordinator
    preconditions:
    - RenewalOffer.status == OPEN
    - RenewalOffer.offer_source == THIRD_PARTY_BIDDER
    - Caller is the incumbent broadcaster (as_user_id == deal.broadcaster_id)
    - Current logical clock <= matching_window_end (ERR_MATCHING_WINDOW_EXPIRED)
    side_effects:
    - matched_by_incumbent = true
  - from: OPEN
    to: EXERCISED
    trigger: POST /deals/{dealId}/renewal-offers/{offerId}/exercise
    actor: RightsManager
    preconditions:
    - RenewalOffer.status in {OPEN, MATCHED}
    - 'If offer_source == THIRD_PARTY_BIDDER: status must be MATCHED first OR matching_window_end
      must have passed (ERR_MATCHING_WINDOW_ACTIVE)'
    - Deal.status == RENEWAL_OPEN
    side_effects:
    - Cascade to Deal.RENEWAL_OPEN → RENEWED
    - All other OPEN/MATCHED RenewalOffer rows on this deal → SUPERSEDED
  - from: MATCHED
    to: EXERCISED
    trigger: POST /deals/{dealId}/renewal-offers/{offerId}/exercise
    actor: RightsManager
    preconditions:
    - RenewalOffer.status == MATCHED
    side_effects:
    - Cascade to Deal.RENEWED
  - from: OPEN
    to: LAPSED
    trigger: system (automatic when parent Deal transitions to LAPSED or when matching_window_end
      passes with no match)
    actor: system
    preconditions: []
    side_effects: []
  - from: OPEN
    to: WITHDRAWN
    trigger: POST /deals/{dealId}/renewal-offers/{offerId}/withdraw
    actor: BidCoordinator
    preconditions:
    - RenewalOffer.status == OPEN
    - Caller is the offeror (as_user_id == offeror_broadcaster_id)
    side_effects: []
concurrency_rules:
- rule_id: deal-execute-stale-version
  parent_entity: Deal
  write_endpoint: POST /deals/{dealId}/execute
  occ_field: expected_deal_version
  description: 'Executing a Deal against a Deal whose version has advanced since the

    client last observed it is rejected with ERR_STALE_DEAL_VERSION. This

    captures the case where another writer has just amended the deal (e.g.

    added payment milestones, changed obligations) and the current writer''s

    view of the deal is therefore stale.

    '
  error_id: ERR_STALE_DEAL_VERSION
  http_status: 412
- rule_id: package-award-stale-version
  parent_entity: RightsPackage
  write_endpoint: POST /packages/{packageId}/bids/{bidId}/accept
  occ_field: expected_package_version
  description: 'Accepting a bid against a RightsPackage whose version has advanced
    since

    the client last observed it is rejected with ERR_STALE_PACKAGE_VERSION.

    Another writer may have awarded the package or withdrawn it, and the

    current writer''s view of the package is therefore stale.

    '
  error_id: ERR_STALE_PACKAGE_VERSION
  http_status: 412
calculations:
- name: escalated_rights_fee
  trigger: Deal execution, Deal amendment, and whenever a PaymentMilestone's escalated_amount_cents
    is recomputed
  algorithm: tiered_pricing
  formula: "Inputs: base_fee_cents, escalator_rate_pct (r), minimum_growth_pct (g),\n\
    \        fee_cap_cents (cap), season_index (n, 1-based), prior_season_fee_cents.\n\
    \nStep 1 (compounded):  comp = base_fee_cents * (1 + r)^(n-1)\nStep 2 (growth\
    \ floor): floor_val = (n == 1) ? comp : prior_season_fee_cents * (1 + g)\nStep\
    \ 3 (pre-cap):     pre_cap = max(comp, floor_val)\nStep 4 (cap):         fee_n\
    \ = min(pre_cap, cap)\nStep 5 (rounding):    Round fee_n to integer cents, HALF_UP.\n\
    \nSeason-1 invariant: fee_1 = min(base_fee_cents, cap).\n"
  input_set: Deal fields + prior season's PaymentMilestone escalated_amount_cents
    rows
  constants:
    MAX_ESCALATOR_RATE: 0.25
    DEFAULT_MIN_GROWTH: 0.0
  precision: 0 decimal places, round_half_up to integer cents
- name: payment_schedule_allocation
  trigger: Deal execution and when a PaymentMilestone is created or its milestone_weight
    is changed
  algorithm: waterfall_allocation
  formula: "Inputs: season escalated_rights_fee (fee_n, integer cents), and the set\
    \ of\nmilestones for that season indexed by sequence_in_season (1..k), each with\n\
    milestone_weight w_i (sum of w_i == 1.0).\n\nStep 1 (per-milestone pre-round):\
    \ pre_i = fee_n * w_i\nStep 2 (rounding — ORDER PINNED): round each pre_i to integer\
    \ cents HALF_UP\n        to obtain base_i.\nStep 3 (remainder reconciliation):\
    \ remainder = fee_n - sum(base_i).\n        Distribute remainder one cent at a\
    \ time to milestones in order of\n        sequence_in_season ASC (tie-break: created_at\
    \ ASC, then id is\n        FORBIDDEN). remainder is always in {-k+1..k-1} so this\
    \ loop\n        terminates.\nStep 4 (final): base_amount_cents_i = base_i + distributed_i.\n\
    \nescalated_amount_cents = base_amount_cents + late_fee_cents.\n"
  input_set: PaymentMilestone rows for one (deal_id, season_index), status != DEFAULTED
  constants:
    LATE_FEE_DAILY_RATE: 0.0005
  precision: 0 decimal places, round_half_up per milestone then reconcile
- name: rating_shortfall_remedy
  trigger: ProductionObligation declare-shortfall AND at season close for audience
    guarantee evaluation
  algorithm: threshold
  formula: "Inputs: deal.audience_commitment_basis_points (commit_bp),\n        deal.cumulative_rating_basis_points\
    \ (delivered_bp),\n        deal.total_contracted_fee_cents.\n\nIf delivered_bp\
    \ >= commit_bp: remedy_cents = 0.\nElse:\n  shortfall_bp = commit_bp - delivered_bp\n\
    \  shortfall_ratio = shortfall_bp / commit_bp\n  remedy_cents = round_half_up(total_contracted_fee_cents\
    \ * shortfall_ratio * REMEDY_RATE)\n\nREMEDY_RATE = 0.25.\n"
  input_set: AudienceMeasurement rows for the deal, filtered by variant
  constants:
    REMEDY_RATE: 0.25
  precision: 0 decimal places, round_half_up
  variants:
  - name: provisional_remedy
    when: Computed at quarter-end review
    difference: Input set = AudienceMeasurement rows with status == CONFIRMED AND
      reporting_period_end <= quarter_end
  - name: final_remedy
    when: Computed at season close
    difference: Input set = AudienceMeasurement rows with status == CONFIRMED (no
      period filter) + late-arriving PROVISIONAL rows that get CONFIRMED before season_close
      + LATE_GRACE_DAYS
- name: make_good_credit
  trigger: ProductionObligation SHORTFALL_DECLARED transition
  algorithm: waterfall_allocation
  formula: 'Inputs: shortfall_games (sg), games_required (gr), season escalated fee

    for the obligation''s season (fee_n).


    Step 1 (per-game rate): per_game_cents = round_half_up(fee_n / gr). If gr == 0,
    per_game_cents = 0.

    Step 2 (base credit): base_credit = sg * per_game_cents.

    Step 3 (aggravation multiplier): If sg / gr > 0.20 (strictly greater), multiply
    base_credit by AGGRAVATION_MULTIPLIER = 1.5; else multiplier = 1.0.

    Step 4 (cap): credit = min(round_half_up(base_credit * multiplier), fee_n).

    Step 5: credit_settled_cents starts at 0; offsets applied later via apply-remedy.


    Distinct from rating_shortfall_remedy: this one credits the league for

    UNDELIVERED GAMES; rating_shortfall_remedy compensates the league for

    UNDERDELIVERED AUDIENCE on delivered games.

    '
  input_set: ProductionObligation + Deal escalated fee
  constants:
    AGGRAVATION_MULTIPLIER: 1.5
    AGGRAVATION_THRESHOLD: 0.2
  precision: 0 decimal places, round_half_up
- name: exclusivity_conflict_check
  trigger: RightsPackage award and Package creation/update
  algorithm: interval_merge
  formula: "Two packages P1, P2 on the same RightsAsset conflict when ALL of:\n  (a)\
    \ P1.territory_code == P2.territory_code (exact match), AND\n  (b) P1.platform_class\
    \ == P2.platform_class, AND\n  (c) their [window_start, window_end) intervals\
    \ overlap (half-open semantics):\n      P1.window_start < P2.window_end AND P2.window_start\
    \ < P1.window_end\nAND at least one of P1.exclusivity_class, P2.exclusivity_class\
    \ is EXCLUSIVE.\n\nAdjacent-but-not-overlapping windows (P1.window_end == P2.window_start)\n\
    do NOT conflict under half-open semantics.\n\nOn detect: write a RightsConflict\
    \ row with conflict_type = EXCLUSIVITY_OVERLAP.\n"
  input_set: All RightsPackage rows on the asset with status in {OPEN_FOR_BIDS, UNDER_NEGOTIATION,
    AWARDED}
  precision: datetime, second resolution
- name: sublicense_blackout_overlap
  trigger: SublicenseRequest approval and BlackoutWindow creation
  algorithm: interval_merge
  formula: "SublicenseRequest S conflicts with BlackoutWindow B when ALL of:\n  (a)\
    \ S.sublicensee_territory == B.territory_code, AND\n  (b) S.sublicensee_platform_class\
    \ == B.platform_class, AND\n  (c) the sublicense's HALF-OPEN interval [requested_window_start,\
    \ requested_window_end)\n      intersects B's CLOSED interval [blackout_start,\
    \ blackout_end].\n\nIntersection rule (half-open ∩ closed):\n  intersects = (S.requested_window_start\
    \ <= B.blackout_end)\n               AND (S.requested_window_end > B.blackout_start)\n\
    \nNote the asymmetry vs exclusivity_conflict_check: blackout intervals are\nclosed\
    \ on both ends, sublicense windows are half-open. This makes two\nadjacent windows\
    \ (S.end == B.start) intersect when S.end > B.start is\nfalse — i.e. they do NOT\
    \ intersect — but S.start == B.end DOES intersect.\n"
  input_set: BlackoutWindow rows for the asset
  precision: datetime, second resolution
- name: deal_posture_rule
  trigger: Any change to PaymentMilestone status, ProductionObligation status, AudienceMeasurement
    confirmation, or unresolved RightsConflict creation
  algorithm: weighted_scoring
  formula: "posture =\n  FROZEN   if any PaymentMilestone is DEFAULTED\n         \
    \  OR payment_delinquency_count >= BREACH_THRESHOLD\n           OR any ProductionObligation\
    \ in SHORTFALL_DECLARED for more than SHORTFALL_GRACE_DAYS\n  WARNING  if payment_delinquency_count\
    \ in {1, 2}\n           OR any ProductionObligation in SHORTFALL_DECLARED\n  \
    \         OR cumulative_rating_basis_points < 0.7 * audience_commitment_basis_points\
    \ at season close\n  CLEAN    otherwise\n"
  constants:
    BREACH_THRESHOLD: 3
    SHORTFALL_GRACE_DAYS: 30
    WARNING_RATING_RATIO: 0.7
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and well-formed
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: Role permitted to invoke the endpoint per §1.7
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Path resource ids exist (RightsAsset, Broadcaster, RightsPackage, Bid, Deal,
    PaymentMilestone, ProductionObligation, BroadcastEvent, AudienceMeasurement, SublicenseRequest,
    RenewalOffer, BlackoutWindow), validated left-to-right
  error_id: ERR_{RESOURCE}_NOT_FOUND
  http_status: 404
  applies_to: all nested endpoints
- priority: 4
  category: state
  check: Target entity's state machine permits the requested transition
  error_id: ERR_{ENTITY}_INVALID_STATE (per-state variants)
  http_status: 409
  applies_to: all state-transition endpoints
- priority: 5
  category: business_safety
  check: 'Bid submission: exclusivity_request == BROADER requires bidder.credit_rating
    == INVESTMENT_GRADE'
  error_id: ERR_BIDDER_NOT_GRADE_FOR_BROADER
  http_status: 422
  applies_to: POST /packages/{packageId}/bids
- priority: 6
  category: business_safety
  check: 'Sublicense approval: requested window does not intersect any BlackoutWindow
    for matching (territory, platform_class) under sublicense_blackout_overlap'
  error_id: ERR_BLACKOUT_VIOLATION
  http_status: 409
  applies_to: POST /deals/{dealId}/sublicense-requests/{requestId}/approve
- priority: 7
  category: business_safety
  check: 'Sublicense approval: requested window is a strict subset of the parent package''s
    [window_start, window_end)'
  error_id: ERR_SUBLICENSE_WINDOW_OUTSIDE_PACKAGE
  http_status: 422
  applies_to: POST /deals/{dealId}/sublicense-requests/{requestId}/approve
- priority: 8
  category: business_constraint
  check: 'Sublicense approval: no other APPROVED SublicenseRequest on the same deal
    with overlapping (territory, platform_class, window)'
  error_id: ERR_SUBLICENSE_OVERLAP
  http_status: 409
  applies_to: POST /deals/{dealId}/sublicense-requests/{requestId}/approve
- priority: 9
  category: business_constraint
  check: 'Bid submission: offered_fee_cents >= package.minimum_bid_cents'
  error_id: ERR_BID_BELOW_FLOOR
  http_status: 422
  applies_to: POST /packages/{packageId}/bids
- priority: 10
  category: business_constraint
  check: 'Bid submission: production_commitment_games >= package.games_committed'
  error_id: ERR_COMMITMENT_BELOW_PACKAGE
  http_status: 422
  applies_to: POST /packages/{packageId}/bids
- priority: 11
  category: business_constraint
  check: 'Deal execute: no unresolved RightsConflict rows with left_entity_id == this
    deal'
  error_id: ERR_UNRESOLVED_RIGHTS_CONFLICT
  http_status: 409
  applies_to: POST /deals/{dealId}/execute
- priority: 12
  category: business_temporal
  check: 'Deal open-renewal: current logical clock within [term_end - RENEWAL_WINDOW_DAYS,
    term_end)'
  error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
  http_status: 409
  applies_to: POST /deals/{dealId}/open-renewal
- priority: 13
  category: business_temporal
  check: 'RenewalOffer match: current logical clock <= matching_window_end'
  error_id: ERR_MATCHING_WINDOW_EXPIRED
  http_status: 409
  applies_to: POST /deals/{dealId}/renewal-offers/{offerId}/match
- priority: 14
  category: business_temporal
  check: 'PaymentMilestone declare-default: current logical clock >= due_date + DEFAULT_GRACE_DAYS'
  error_id: ERR_DEFAULT_GRACE_NOT_ELAPSED
  http_status: 409
  applies_to: POST /deals/{dealId}/payment-milestones/{milestoneId}/declare-default
- priority: 15
  category: business_temporal
  check: 'ProductionObligation declare-shortfall: current logical clock > season end
    and games_delivered < games_required'
  error_id: ERR_NO_SHORTFALL
  http_status: 422
  applies_to: POST /deals/{dealId}/production-obligations/{obligationId}/declare-shortfall
- priority: 16
  category: business_referential
  check: 'BroadcastEvent mark-delivered: linked obligation must be in TRACKING (else
    event over-counts a MET obligation)'
  error_id: ERR_OBLIGATION_NOT_TRACKING
  http_status: 409
  applies_to: POST /deals/{dealId}/broadcast-events/{eventId}/mark-delivered
- priority: 17
  category: business_referential
  check: 'AudienceMeasurement confirm: linked BroadcastEvent must be DELIVERED'
  error_id: ERR_EVENT_NOT_DELIVERED
  http_status: 409
  applies_to: POST /deals/{dealId}/audience-measurements/{measurementId}/confirm
- priority: 18
  category: business_fiscal
  check: 'Deal execute: at least one PaymentMilestone and one ProductionObligation
    exist'
  error_id: ERR_NO_PAYMENT_SCHEDULE | ERR_NO_PRODUCTION_OBLIGATION
  http_status: 422
  applies_to: POST /deals/{dealId}/execute
- priority: 19
  category: business_fiscal
  check: 'Deal terminate-convenience: payment_delinquency_count == 0'
  error_id: ERR_OUTSTANDING_DELINQUENCY
  http_status: 409
  applies_to: POST /deals/{dealId}/terminate-convenience
- priority: 20
  category: business_fiscal
  check: 'Deal terminate-breach: payment_delinquency_count >= BREACH_THRESHOLD or
    posture == FROZEN'
  error_id: ERR_BREACH_CONDITION_NOT_MET
  http_status: 409
  applies_to: POST /deals/{dealId}/terminate-breach
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\"\
    : \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\"\
    : \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: Advance the logical clock. Default startup time is 2026-08-01T00:00:00Z;
    before any set_current_utc call the logical clock reads exactly this default and
    MUST NOT fall back to wall-clock time.
  roles:
  - RightsManager
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: datetime
  side_effects:
  - 'Triggers system transitions sensitive to clock: PaymentMilestone INVOICED→OVERDUE
    when past due_date; Deal RENEWAL_OPEN→LAPSED when past term_end without exercise;
    RenewalOffer OPEN→LAPSED when matching_window_end passes without match'
- method: POST
  path: /rights-assets
  description: Create a new rights asset
  roles:
  - RightsManager
  code: 201
  input:
