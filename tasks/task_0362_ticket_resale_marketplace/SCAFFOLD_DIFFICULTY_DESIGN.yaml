# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Ticket Resale Marketplace — EXPERT
# 9 rule_ids × 2 instances = 18 instances
# All formula-derived asserts are pre-computed literals (contract item 7).
# Canonical FIXED listing reused: Section face_value_cents=10000,
# Event price_cap_multiplier=3.0 (cap=30000), Listing ask_price_cents=20000,
# pricing_mode=FIXED → effective_price_cents=20000, locked_unit_price_cents=20000.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buyer_charge_estimate_vs_final_diverge_on_wallet_change
        grounds:
          - calculations.buyer_charge
          - entities.Order.fields.estimated_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.PENDING_to_CHARGED
        distinguishing_aspect: |
          On the Order domain: estimated_total_cents is computed against the wallet AS OF
          reservation (22400 credit available → estimate 22400) but final_total_cents is
          recomputed against the wallet AS OF charge after the credit was revoked (0 available
          → final 44800), so the two variants differ by exactly 22400 on the same order.
        test_recipe:
          setup:
            - "Buyer earns a genuine 22400 EventCredit from a qty1 CHARGED order on a then-CANCELLED event1; a fresh FIXED listing ask=20000 with 2 seats is ACTIVE on event2."
            - "Buyer reserves qty2 on event2 applying the full 22400 credit (estimate reflects it); the credit is REVOKED before charge, so final reflects 0 credit."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Arena", timezone: "UTC" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${venue_id}", name: "FLOOR-A", price_zone: "STANDARD", face_value_cents: 10000, row_count: 2, seats_per_row: 2 }
              as: PlatformAdmin
              captures: { section_id: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "Show1", doors_open_at: "2026-09-01T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event1_id: $.data.id }
            - call: "POST /events/${event1_id}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S1", payout_account_ref: "acct_s1" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B1" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event1_id}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing1_id: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${listing1_id}", row_label: "1", seat_number: 1, barcode_token: "BC-A1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${listing1_id}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing1_v: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${listing1_id}", buyer_id: "${buyer_id}", quantity: 1, expected_listing_version: "${listing1_v}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { credit_order_id: $.data.id }
            - call: "POST /orders/${credit_order_id}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /events/${event1_id}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /event-credits?source_order_id=${credit_order_id}"
              payload: {}
              as: PlatformAdmin
              captures: { credit_id: $.data.0.id, credit_amt: $.data.0.amount_cents }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "Show2", doors_open_at: "2026-09-02T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event2_id: $.data.id }
            - call: "POST /events/${event2_id}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { event_id: "${event2_id}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing2_id: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${listing2_id}", row_label: "1", seat_number: 1, barcode_token: "BC2-A1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${listing2_id}", row_label: "1", seat_number: 2, barcode_token: "BC2-A2" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${listing2_id}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing2_v: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { listing_id: "${listing2_id}", buyer_id: "${buyer_id}", quantity: 2, expected_listing_version: "${listing2_v}", applied_credit_cents: 22400 }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id, est: $.data.estimated_total_cents }
            - call: "POST /event-credits/${credit_id}/revoke"
              payload: {}
              as: TrustSafety
            - call: "POST /orders/${order_id}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { final_total: $.data.final_total_cents }
          assert:
            - "Order.${order_id}.estimated_total_cents == 22400"
            - "Order.${order_id}.final_total_cents == 44800"
            - "Order.${order_id}.final_total_cents - Order.${order_id}.estimated_total_cents == 22400"
            - "Order.${order_id}.payment_status == CHARGED"

      - name: event_credit_goodwill_bonus_vs_face_diverge_on_loyalty
        grounds:
          - calculations.event_credit_amount
          - entities.EventCredit.fields.amount_cents
          - entities.EventCredit.fields.bonus_applied
          - entities.Buyer.fields.lifetime_orders_count
          - state_machines.Event.ON_SALE_to_CANCELLED
        distinguishing_aspect: |
          On the EventCredit/Buyer domain (different entity domain than buyer_charge): a loyal
          buyer (lifetime_orders_count>=3) gets floor(paid*1.10)=49280 with bonus_applied=true,
          while a non-loyal buyer on an identical 44800 order gets 44800 with bonus_applied=false.
        test_recipe:
          setup:
            - "A loyal buyer (3 prior CHARGED orders) and a fresh buyer each hold one CHARGED order of final_total 44800 on the same ON_SALE event, which is then CANCELLED."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome", timezone: "UTC" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${venue_id}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 4, seats_per_row: 4 }
              as: PlatformAdmin
              captures: { section_id: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "Big", doors_open_at: "2026-10-01T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "acct" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "Loyal" }
              as: PlatformAdmin
              captures: { loyal_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "Fresh" }
              as: PlatformAdmin
              captures: { fresh_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "L-1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 2, barcode_token: "L-2" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 3, barcode_token: "L-3" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 4, barcode_token: "L-4" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 5, barcode_token: "L-5" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 6, barcode_token: "L-6" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 7, barcode_token: "L-7" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 8, barcode_token: "L-8" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 9, barcode_token: "L-9" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 10, barcode_token: "L-10" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lv0: $.data.version }
            # Loyal buyer makes 3 prior CHARGED orders (qty1 each) to reach lifetime_orders_count==3
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${loyal_id}", quantity: 1, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
            - call: "GET /listings/${lid}"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { lv1: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${loyal_id}", quantity: 1, expected_listing_version: "${lv1}" }
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
            - call: "GET /listings/${lid}"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { lv2: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${loyal_id}", quantity: 1, expected_listing_version: "${lv2}" }
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { o3: $.data.id }
            - call: "POST /orders/${o3}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
            # Loyal buyer's measured order (qty2 → 44800)
            - call: "GET /listings/${lid}"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { lv3: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${loyal_id}", quantity: 2, expected_listing_version: "${lv3}" }
              as: Buyer
              as_user_id: "${loyal_id}"
              captures: { loyal_order: $.data.id }
            - call: "POST /orders/${loyal_order}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${loyal_id}"
            # Fresh buyer's measured order (qty2 → 44800), lifetime_orders_count==0 before this
            - call: "GET /listings/${lid}"
              payload: {}
              as: Buyer
              as_user_id: "${fresh_id}"
              captures: { lv4: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${fresh_id}", quantity: 2, expected_listing_version: "${lv4}" }
              as: Buyer
              as_user_id: "${fresh_id}"
              captures: { fresh_order: $.data.id }
            - call: "POST /orders/${fresh_order}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${fresh_id}"
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /event-credits?source_order_id=${loyal_order}"
              payload: {}
              as: PlatformAdmin
              captures: { loyal_credit: $.data.0.amount_cents, loyal_bonus: $.data.0.bonus_applied }
            - call: "GET /event-credits?source_order_id=${fresh_order}"
              payload: {}
              as: PlatformAdmin
              captures: { fresh_credit: $.data.0.amount_cents }
          assert:
            - "EventCredit for ${loyal_order}: amount_cents == 49280 and bonus_applied == true"
            - "EventCredit for ${fresh_order}: amount_cents == 44800 and bonus_applied == false"
            - "Buyer.${loyal_id}.lifetime_orders_count == 4 at cancel time"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dynamic_price_scarcity_floor_cap_ordering_mode_a
        grounds:
          - calculations.effective_listing_price
          - entities.Listing.fields.effective_price_cents
          - entities.Listing.fields.dynamic_floor_cents
          - entities.Listing.fields.available_seat_count
        distinguishing_aspect: |
          MODE (a) non-linear ≥3-input formula: effective_price = min(max(dynamic_floor,
          floor(ask*(1+0.5*sold_ratio))), cap) over inputs {ask, sold_ratio, floor, cap}; with
          ask=20000, 2 of 4 seats sold (sold_ratio 0.5 → demand 1.25 → raw 25000), floor=12000,
          cap=30000, the read recomputes effective_price_cents to exactly 25000.
        test_recipe:
          setup:
            - "DYNAMIC listing ask=20000, dynamic_floor=12000, 4 seats, on event cap_mult=3 (cap=30000); 2 seats already SOLD so sold_ratio=0.5 on the next read."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${venue_id}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 2, seats_per_row: 2 }
              as: PlatformAdmin
              captures: { section_id: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "E", doors_open_at: "2026-11-01T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "DYNAMIC", split_rule: "ANY", dynamic_floor_cents: 12000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "D-1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 2, barcode_token: "D-2" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "2", seat_number: 1, barcode_token: "D-3" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "2", seat_number: 2, barcode_token: "D-4" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lv0: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${buyer_id}", quantity: 2, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
          trigger:
            - call: "GET /listings/${lid}"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { eff: $.data.effective_price_cents, avail: $.data.available_seat_count }
          assert:
            - "Listing.${lid}.available_seat_count == 2"
            - "Listing.${lid}.effective_price_cents == 25000"

      - name: buyer_charge_per_line_fee_floor_then_sum_ordering_mode_b
        grounds:
          - calculations.buyer_charge
          - entities.Order.fields.buyer_fee_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.PENDING_to_CHARGED
        distinguishing_aspect: |
          MODE (b) nested rounding order pinned: buyer_fee_cents = floor(base*0.12) is rounded
          BEFORE being summed into gross (round-per-fee-then-sum). With base=40000 the fee floors
          to 4800 and final_total=44800; a sum-then-round reading would not change here but the
          scaffold pins floor-per-fee-first so the credit subtraction lands on the rounded gross.
        test_recipe:
          setup:
            - "Canonical FIXED listing ask=20000 ACTIVE with 2 seats; buyer charges qty=2 with no credit."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${venue_id}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 2 }
              as: PlatformAdmin
              captures: { section_id: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "E", doors_open_at: "2026-11-05T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", seller_id: "${seller_id}", section_id: "${section_id}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "F-1" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 2, barcode_token: "F-2" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { lv0: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${buyer_id}", quantity: 2, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { fee: $.data.buyer_fee_cents, total: $.data.final_total_cents }
          assert:
            - "Order.${order_id}.buyer_fee_cents == 4800"
            - "Order.${order_id}.final_total_cents == 44800"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: guarantee_claim_cyclic_offer_reject_round_increment
        grounds:
          - state_machines.GuaranteeClaim.REPLACEMENT_OFFERED_to_INVESTIGATING
          - state_machines.GuaranteeClaim.INVESTIGATING_to_REPLACEMENT_OFFERED
          - entities.GuaranteeClaim.fields.round_number
        distinguishing_aspect: |
          On the GuaranteeClaim entity: a cycle INVESTIGATING→REPLACEMENT_OFFERED→INVESTIGATING
          (reject-offer back-edge) increments round_number; after two reject cycles round_number==2,
          proving a non-linear (cyclic) shape rather than a one-way pipeline.
        test_recipe:
          setup:
            - "A CHARGED order with delivery FAILED has a FILED→INVESTIGATING guarantee claim; a separate ACTIVE replacement listing on the same event has seats."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${venue_id}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 4, seats_per_row: 2 }
              as: PlatformAdmin
              captures: { section_id: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${venue_id}", title: "E", doors_open_at: "2026-12-01T19:00:00.000Z", price_cap_multiplier: 3.0 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
