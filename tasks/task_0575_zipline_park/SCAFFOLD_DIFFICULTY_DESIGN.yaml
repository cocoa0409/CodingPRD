# =============================================================================
# task_0575_zipline_park — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >=2 instances = 18 instances.
# All chains drive from empty-DB using only §1.5 endpoints. Clock default is
# 2026-05-01T00:00:00Z. Weekday slot 2026-06-03T10:00Z (Wed); weekend slot
# 2026-06-06T10:00Z (Sat). base_price 5000, weekend_pct 0.15, INSURANCE_RATE
# 0.0745, group tiers {1-3:0.00, 4-7:0.10, 8+:0.20}.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: raincheck_credit_weather_full_vs_voluntary_late_half
        grounds:
          - calculations.cancellation_credit
          - state_machines.Booking.CONFIRMED_to_RAINCHECKED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.raincheck_credit_cents
        distinguishing_aspect: |
          The same 5000-cent booking yields credit 5000 via the WEATHER variant (slot
          close -> RAINCHECKED, full) but 2500 via the VOLUNTARY_late variant (customer
          cancel <24h -> CANCELLED, 50%); two variants, different results, Booking domain.
        test_recipe:
          setup:
            - "Course (base 5000, min_weight 30, max_weight 120, min_age 8, difficulty 2), weekday slot, guide assigned"
            - "Two participants p_a, p_b (weight 70) each with a CONFIRMED booking (price 5000) in the slot"
            - "Clock advanced to 2026-06-03T00:00:00Z (10h before slot start -> voluntary lead < 24h)"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_a_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P B", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_b_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_a_id}" }
              as: Operator
              captures: { b_a_id: $.data.id, b_a_price: $.data.price_cents }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_b_id}" }
              as: Operator
              captures: { b_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /bookings/${b_b_id}/cancel"
              payload: {}
              as: Operator
            - call: "POST /time-slots/${ts_id}/close"
              payload: { reason: "storm" }
              as: Operator
          assert:
            - "Booking.${b_a_id}.status == RAINCHECKED"
            - "Booking.${b_a_id}.raincheck_credit_cents == 5000"
            - "Booking.${b_b_id}.status == CANCELLED"
            - "Booking.${b_b_id}.raincheck_credit_cents == 2500"

      - name: season_pass_usage_provisional_vs_settled
        grounds:
          - calculations.season_pass_usage
          - entities.SeasonPass.fields.uses_committed
          - entities.SeasonPass.fields.uses_settled
          - entities.SeasonPass.fields.uses_remaining
        distinguishing_aspect: |
          For one pass (total_uses 5) with one COMPLETED and one CONFIRMED booking, the
          provisional variant reports uses_remaining 3 (5 - committed 1 - settled 1) while a
          settled-only view (5 - settled 1) would be 4; two variants, SeasonPass domain.
        test_recipe:
          setup:
            - "Course, weekday slot, guide assigned, slot OPEN"
            - "Participant p with SIGNED waiver and an ACTIVE SeasonPass total_uses=5"
            - "Booking b1 (pass) driven to COMPLETED; booking b2 (pass) left CONFIRMED"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P P", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/waiver"
              payload: { signature_name: "P P" }
              as: Operator
              captures: { p_v: $.data.version }
            - call: "POST /participants/${p_id}/season-passes"
              payload: { tier: "STANDARD", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z", total_uses: 5, expected_participant_version: "${p_v}" }
              as: Operator
              captures: { sp_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}", use_season_pass: true }
              as: Operator
              captures: { b1_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}", use_season_pass: true }
              as: Operator
              captures: { b2_id: $.data.id }
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
            - call: "POST /bookings/${b1_id}/check-in"
              payload: {}
              as: Operator
            - call: "POST /bookings/${b1_id}/brief"
              payload: {}
              as: Operator
            - call: "POST /bookings/${b1_id}/complete"
              payload: {}
              as: Operator
          trigger:
            - call: "GET /participants/${p_id}/season-passes"
              payload: {}
              as: Operator
              captures: { rem: "$.data[0].uses_remaining" }
          assert:
            - "SeasonPass.${sp_id}.uses_committed == 1"
            - "SeasonPass.${sp_id}.uses_settled == 1"
            - "SeasonPass.${sp_id}.uses_remaining == 3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_price_tiered_group_weekend_pass_mode_a
        grounds:
          - calculations.booking_price
          - entities.Booking.fields.price_cents
          - entities.Group.fields.expected_size
        distinguishing_aspect: |
          price_cents is a non-linear function of >=3 inputs with tier selection and
          conditional branches (mode a): group-8 weekday = 4000, weekend single = 5750,
          pass-covered = 0 — three code paths from the same base 5000.
        test_recipe:
          setup:
            - "Course base 5000, weekend_pct 0.15; weekday slot ts_w and weekend slot ts_e, each guide-assigned"
            - "Group G8 (expected_size 8) on ts_w; participants pg, py, pz; pz holds a 1-use pass"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_w: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-06T10:00:00Z" }
              as: Operator
              captures: { ts_e: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_w}" }
              as: Operator
            - call: "POST /groups"
              payload: { name: "Team8", time_slot_id: "${ts_w}", expected_size: 8, organizer_name: "Org" }
              as: Operator
              captures: { g8_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "PG", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { pg_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "PY", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "PZ", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { pz_id: $.data.id, pz_v: $.data.version }
            - call: "POST /participants/${pz_id}/season-passes"
              payload: { tier: "PREMIUM", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z", total_uses: 1, expected_participant_version: "${pz_v}" }
              as: Operator
              captures: { pz_sp: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_w}", participant_id: "${pg_id}", group_id: "${g8_id}" }
              as: Operator
              captures: { bx_id: $.data.id, bx_price: $.data.price_cents }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_e}", participant_id: "${py_id}" }
              as: Operator
              captures: { by_id: $.data.id, by_price: $.data.price_cents }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_w}", participant_id: "${pz_id}", use_season_pass: true }
              as: Operator
              captures: { bz_id: $.data.id, bz_price: $.data.price_cents, bz_sp: $.data.season_pass_id }
          assert:
            - "Booking.${bx_id}.price_cents == 4000"
            - "Booking.${by_id}.price_cents == 5750"
            - "Booking.${bz_id}.price_cents == 0"
            - "Booking.${bz_id}.season_pass_id == ${pz_sp}"

      - name: group_insurance_round_per_member_then_sum_mode_b
        grounds:
          - calculations.group_insurance_total
          - entities.Group.fields.insurance_total_cents
          - entities.Group.fields.member_count
        distinguishing_aspect: |
          Insurance total pins round-per-member-then-sum: 3 members * round_half_up(5000*0.0745=372.5)=373
          gives 1119, whereas sum-then-round round_half_up(5000*0.0745*3=1117.5)=1118 differs (mode b).
        test_recipe:
          setup:
            - "Course base 5000, weekday slot, guide assigned, Group G3 (expected_size 3) on slot"
            - "Three participants each with a CONFIRMED booking pinned to G3"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /groups"
              payload: { name: "Team3", time_slot_id: "${ts_id}", expected_size: 3, organizer_name: "Org" }
              as: Operator
              captures: { g3_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "M1", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { m1_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "M2", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { m2_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "M3", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { m3_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${m1_id}", group_id: "${g3_id}" }
              as: Operator
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${m2_id}", group_id: "${g3_id}" }
              as: Operator
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${m3_id}", group_id: "${g3_id}" }
              as: Operator
          trigger:
            - call: "GET /groups/${g3_id}"
              payload: {}
              as: Operator
              captures: { ins: $.data.insurance_total_cents }
          assert:
            - "Group.${g3_id}.member_count == 3"
            - "Group.${g3_id}.insurance_total_cents == 1119"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: timeslot_close_reopen_cycle
        grounds:
          - state_machines.TimeSlot.OPEN_to_CLOSED
          - state_machines.TimeSlot.CLOSED_to_OPEN
          - entities.TimeSlot.fields.status
          - entities.TimeSlot.fields.closure_reason
        distinguishing_aspect: |
          TimeSlot supports the cycle edge CLOSED->OPEN (reopen): after OPEN->CLOSED->OPEN the
          status returns to OPEN and closure_reason clears to null — a non-linear cyclic shape.
        test_recipe:
          setup:
            - "Course, weekday slot, guide assigned, slot OPEN"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /time-slots/${ts_id}/close"
              payload: { reason: "storm" }
              as: Operator
              captures: { st_closed: $.data.status }
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
              captures: { st_reopened: $.data.status }
          assert:
            - "st_closed == CLOSED"
            - "TimeSlot.${ts_id}.status == OPEN"
            - "TimeSlot.${ts_id}.closure_reason == null"

      - name: booking_branch_checkin_vs_cancel_divergent_effects
        grounds:
          - state_machines.Booking.CONFIRMED_to_CHECKED_IN
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.status
          - entities.TimeSlot.fields.remaining_capacity
        distinguishing_aspect: |
          From CONFIRMED the Booking machine forks: the check-in branch keeps the seat held
          (remaining stays 3), while the cancel branch releases it (remaining returns to 4) —
          divergent side-effect sets on the same Booking entity (branching, non-linear).
        test_recipe:
          setup:
            - "Course, weekday slot (capacity 4), guide assigned, slot OPEN"
            - "Two participants with SIGNED waivers, each a CONFIRMED booking (remaining 2)"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_a_id: $.data.id }
            - call: "POST /participants/${p_a_id}/waiver"
              payload: { signature_name: "P A" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P B", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_b_id: $.data.id }
            - call: "POST /participants/${p_b_id}/waiver"
              payload: { signature_name: "P B" }
              as: Operator
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_a_id}" }
              as: Operator
              captures: { b_a_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_b_id}" }
              as: Operator
              captures: { b_b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_a_id}/check-in"
              payload: {}
              as: Guide
              as_user_id: "${g1_id}"
            - call: "POST /bookings/${b_b_id}/cancel"
              payload: {}
              as: Operator
          assert:
            - "Booking.${b_a_id}.status == CHECKED_IN"
            - "Booking.${b_b_id}.status == CANCELLED"
            - "TimeSlot.${ts_id}.remaining_capacity == 3"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: weather_close_cascade_slot_booking_gearcheckout_gearitem_depth3
        grounds:
          - state_machines.TimeSlot.OPEN_to_CLOSED
          - state_machines.Booking.CONFIRMED_to_RAINCHECKED
          - state_machines.GearCheckout.OUT_to_RETURNED
          - entities.GearItem.fields.status
        distinguishing_aspect: |
          Weather close propagates depth-3, each link caused by the prior: slot CLOSE -> booking
          RAINCHECKED -> that booking's GearCheckout RETURNED -> its GearItem status AVAILABLE.
        test_recipe:
          setup:
            - "Course, weekday slot, guide assigned, slot OPEN"
            - "Participant with a CONFIRMED booking; one harness checked out to it (GearItem CHECKED_OUT)"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_a_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_a_id}" }
              as: Operator
              captures: { b_a_id: $.data.id }
            - call: "POST /gear-items"
              payload: { gear_type: "HARNESS", size: "M" }
              as: Operator
              captures: { gi_id: $.data.id }
            - call: "POST /gear-checkouts"
              payload: { gear_item_id: "${gi_id}", booking_id: "${b_a_id}" }
              as: Operator
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /time-slots/${ts_id}/close"
              payload: { reason: "storm" }
              as: Operator
          assert:
            - "Booking.${b_a_id}.status == RAINCHECKED"
            - "Booking.${b_a_id}.raincheck_credit_cents == 5000"
            - "GearCheckout.${co_id}.status == RETURNED"
            - "GearItem.${gi_id}.status == AVAILABLE"
            - "TimeSlot.${ts_id}.remaining_capacity == 4"

      - name: group_cancel_cascade_booking_gearcheckout_gearitem
        grounds:
          - state_machines.Group.OPEN_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.GearCheckout.OUT_to_RETURNED
          - entities.GearItem.fields.status
        distinguishing_aspect: |
          Group cancel (a different trigger than weather close) propagates group CANCEL -> member
          bookings CANCELLED -> their GearCheckouts RETURNED -> those GearItems AVAILABLE.
        test_recipe:
          setup:
            - "Course, weekday slot, guide assigned, Group G2 on slot, two CONFIRMED member bookings"
            - "One harness checked out to member booking b_a"
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
