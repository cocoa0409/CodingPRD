# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task 2879 — Essential Air Service Subsidy Program
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented.
# Instances whose corner is already asserted by a §1.8 instance carry
# excluded_because: and no test_recipe.
scaffold_corner_design:
  - section: entities
    instances:
      - name: community_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Community
          - endpoints.POST_/eas/communities
          - response_envelope.success
        distinguishing_aspect: "A create with all seven input fields returns 201 and echoes them alongside the system/computed fields at their declared defaults; nothing is computed before a determination exists."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and the payload under data"
            - "Community.${comm_id}.code == HYS, name == Hays, state_code == KS"
            - "Community.${comm_id}.driving_miles_to_nearest_hub == 165.0 and enplanements_prior_year == 6200"
            - "Community.${comm_id}.min_required_weekly_round_trips == 12 and min_required_weekly_seats == 400"
            - "Community.${comm_id}.status == REGISTERED, distance_band is null, subsidy_per_passenger_cap_usd is null, latest_determination_outcome is null, active_agreement_count == 0"
            - "Community.${comm_id}.id, created_at, updated_at and version are all present"

      - name: carrier_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Carrier
          - endpoints.GET_/eas/carriers/{id}
        distinguishing_aspect: "GET by id returns exactly the stored row including the computed performance fields at their creation defaults; no field is recomputed on read."
        test_recipe:
          setup:
            - "One Carrier exists and has never been reviewed."
          setup_api_calls:
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
          trigger:
            - call: "GET /eas/carriers/${car1_id}"
              payload: {}
              as: SelectionOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 200 with response_type == object"
            - "Carrier.${car1_id}.name == Prairie Air and certificate_number == CERT-1001"
            - "Carrier.${car1_id}.status == ACTIVE and consecutive_watch_count == 0"
            - "Carrier.${car1_id}.latest_completion_factor, latest_quality_score and latest_performance_tier are all null"

      - name: community_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/eas/communities
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list endpoint composes a status filter, a state filter and limit/offset, and reports total_count against the filtered set rather than the whole table."
        test_recipe:
          setup:
            - "Three communities: two in KS (one still REGISTERED, one ELIGIBLE) and one in MT (REGISTERED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities"
              payload: { code: "DDC", name: "Dodge City", state_code: "KS", driving_miles_to_nearest_hub: 152.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { commd_id: $.data.id }
            - call: "POST /eas/communities"
              payload: { code: "GDV", name: "Glendive", state_code: "MT", driving_miles_to_nearest_hub: 221.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { commg_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /eas/communities"
              payload: { state_code: "KS" }
              as: ProgramAdmin
            - call: "GET /eas/communities"
              payload: { status: "REGISTERED" }
              as: ProgramAdmin
            - call: "GET /eas/communities"
              payload: { state_code: "KS", limit: 1, offset: 0 }
              as: ProgramAdmin
            - call: "GET /eas/communities"
              payload: { state_code: "KS", limit: 1, offset: 1 }
              as: ProgramAdmin
          assert:
            - "HTTP 200 with response_type == array on every call"
            - "state_code KS returns 2 rows (${comm_id} and ${commd_id}) with total_count == 2 and has_more == false"
            - "status REGISTERED returns 2 rows (${commd_id} and ${commg_id}) with total_count == 2, so the determination removed ${comm_id} from that filter"
            - "state_code KS with limit 1 offset 0 returns 1 row with limit == 1, offset == 0, total_count == 2 and has_more == true"
            - "state_code KS with limit 1 offset 1 returns 1 row with has_more == false, and the two pages are disjoint"

      - name: community_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4
          - errors.ERR_COMMUNITY_NOT_FOUND
          - endpoints.GET_/eas/communities/{id}
        distinguishing_aspect: "A well-formed UUID that matches no stored row yields the entity-specific 404, not a generic error, and the read has no side effects."
        test_recipe:
          setup:
            - "One unrelated community exists so the table is not empty."
          setup_api_calls:
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "GET /eas/communities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { nf_error_id: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and ${nf_error_id} == ERR_COMMUNITY_NOT_FOUND"
            - "data.message is a non-empty string"
            - "Community.${comm_id} is unchanged and still retrievable"

      - name: proposal_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/eas/proposals
        distinguishing_aspect: "Every input field of POST /eas/proposals except none is required — omitting term_months alone is rejected at priority 3 with 400 before any FK existence check runs, so no Proposal row is created."
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE with an OPEN solicitation, one carrier and one aircraft type."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { missing_error_id: $.data.error_id }
          assert:
            - "HTTP 400 with ${missing_error_id} == ERR_INVALID_REQUEST"
            - "GET /eas/proposals filtered by solicitation_id ${sol_id} returns 0 rows with total_count == 0"
            - "Solicitation.${sol_id}.status is still OPEN and preference_filing_count is still 0"

      - name: community_and_carrier_defaults_applied_on_create
        claim_type: defaults
        grounds:
          - entities.Community.fields.status
          - entities.Community.fields.active_agreement_count
          - entities.Carrier.fields.status
          - entities.Carrier.fields.consecutive_watch_count
          - entities.AircraftType.fields.is_retired
          - entities.EligibilityDetermination.fields.waiver_requested
        distinguishing_aspect: "Declared defaults appear without being sent: Community.status REGISTERED, Carrier.status ACTIVE, AircraftType.is_retired false, and the optional waiver_requested defaults to false when the determination body omits it entirely."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { det_id: $.data.id }
          assert:
            - "Community.${comm_id}.status == REGISTERED and active_agreement_count == 0 without either being sent"
            - "Carrier.${car1_id}.status == ACTIVE and consecutive_watch_count == 0"
            - "AircraftType.${ac_b190_id}.is_retired == false"
            - "EligibilityDetermination.${det_id}.waiver_requested == false although the body was empty"
            - "EligibilityDetermination.${det_id}.outcome == ELIGIBLE, so the omitted flag did not change the outcome"

      - name: proposal_computed_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.Proposal.fields.projected_annual_passengers
          - entities.Proposal.fields.subsidy_per_passenger_usd
          - calculations.proposal_subsidy_per_passenger
          - endpoints.POST_/eas/proposals
        distinguishing_aspect: "projected_annual_passengers and subsidy_per_passenger_usd are computed from the nine inputs at create time; a client value for either is not an accepted input, and the stored figures are floor(12*2*19*52*0.375) == 8892 and round(1600000/8892, 2) == 179.94."
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE with an OPEN solicitation, one carrier and one 19-seat aircraft type."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
          assert:
            - "Proposal.${p1_id}.projected_annual_passengers == 8892"
            - "Proposal.${p1_id}.subsidy_per_passenger_usd == 179.94"
            - "Proposal.${p1_id}.composite_score is null before any ranking has run"
            - "Proposal.${p1_id}.submission_state == DRAFT and evaluation_state == NOT_EVALUATED"

      - name: carrier_system_fields_are_server_minted_and_versioned
        claim_type: system_fields
        grounds:
          - entities.Carrier
          - state_machines.Carrier.ACTIVE_to_PROBATION
          - response_envelope.success
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at and updated_at are ISO-8601 UTC with three fractional digits, version starts at 1, and a standing change increments version and refreshes updated_at while created_at stays fixed."
        test_recipe:
          setup:
            - "One newly created Carrier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id, car1_v: $.data.version }
          trigger:
            - call: "POST /eas/carriers/${car1_id}/standing"
              payload: { action: "PLACE_ON_PROBATION", note: "watch list" }
              as: ProgramAdmin
            - call: "GET /eas/carriers/${car1_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Carrier.${car1_id}.id is a bare UUID string with no prefix such as car_"
            - "${car1_v} == 1 immediately after creation"
            - "Carrier.${car1_id}.created_at and updated_at are ISO-8601 UTC with three fractional digits"
            - "After the standing change Carrier.${car1_id}.version == 2 and status == PROBATION"
            - "created_at is unchanged by the standing change while updated_at is refreshed"

      - name: aircraft_type_invalid_enum_and_range_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
          - entities.Proposal.fields.service_level
          - entities.Proposal.fields.term_months
          - entities.FuelIndex.fields.index_month
        distinguishing_aspect: "Priority 3 covers three distinct shape failures with one error id: an enum value outside the declared set, an integer outside the declared member list, and a YYYY-MM string that does not match the month pattern."
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE with an OPEN solicitation, one carrier and one aircraft type."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "PREMIUM_JET", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { bad_enum_error_id: $.data.error_id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 18, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { bad_term_error_id: $.data.error_id }
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2026-8", price_per_gallon_usd: 2.4000 }
              as: ProgramAdmin
              captures: { bad_month_error_id: $.data.error_id }
          assert:
            - "service_level PREMIUM_JET returns 400 with ${bad_enum_error_id} == ERR_INVALID_REQUEST"
            - "term_months 18 returns 400 with ${bad_term_error_id} == ERR_INVALID_REQUEST because the declared set is 12 | 24 | 36 | 48"
            - "index_month 2026-8 returns 400 with ${bad_month_error_id} == ERR_INVALID_REQUEST because it is not a YYYY-MM string"
            - "GET /eas/proposals filtered by solicitation_id ${sol_id} returns 0 rows and GET /eas/fuel-indices returns 0 rows"

      - name: fuel_index_is_immutable_with_no_update_path
        claim_type: immutability
        grounds:
          - entities.FuelIndex
          - validations.priority_22
          - errors.ERR_DUPLICATE_RESOURCE
          - endpoints.POST_/eas/fuel-indices
          - endpoints.GET_/eas/fuel-indices
        distinguishing_aspect: "FuelIndex declares common_fields false, so its rows carry only id and created_at — no version and no updated_at — and §1.5 offers no update or delete path; a correction can only be attempted as a second row for the same month, which the uniqueness rule refuses."
        test_recipe:
          setup:
            - "One published fuel index for 2026-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2026-08", price_per_gallon_usd: 2.4000 }
              as: ProgramAdmin
              captures: { fi_id: $.data.id }
          trigger:
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2026-08", price_per_gallon_usd: 3.1000 }
              as: ProgramAdmin
              captures: { dup_error_id: $.data.error_id }
            - call: "GET /eas/fuel-indices"
              payload: { index_month: "2026-08" }
              as: ProgramAdmin
          assert:
            - "The republish returns 409 with ${dup_error_id} == ERR_DUPLICATE_RESOURCE"
            - "GET /eas/fuel-indices for 2026-08 returns exactly 1 row with total_count == 1 and price_per_gallon_usd == 2.4000"
            - "FuelIndex.${fi_id} exposes id and created_at but no version and no updated_at field"
            - "§1.5 declares no PUT, PATCH or DELETE on /eas/fuel-indices or /eas/fuel-indices/{id}"

      - name: proposal_parent_references_must_resolve_in_declaration_order
        claim_type: parent_relationships
        grounds:
          - validations.priority_4
          - errors.ERR_CARRIER_NOT_FOUND
          - errors.ERR_SOLICITATION_NOT_FOUND
          - errors.ERR_AIRCRAFT_TYPE_NOT_FOUND
          - endpoints.POST_/eas/proposals
        distinguishing_aspect: "Proposal reaches its Community only through solicitation_id, and priority 4 validates body FKs left-to-right in the declared order carrier_id, aircraft_type_id, solicitation_id — so a body with three bad FKs reports the carrier error, which pins the order rather than leaving it to the implementation."
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE with an OPEN solicitation, one carrier and one aircraft type, all valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /eas/proposals"
