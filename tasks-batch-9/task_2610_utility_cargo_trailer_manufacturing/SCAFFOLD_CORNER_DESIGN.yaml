          rationale: "That instance violates both rules on one request and pins ERR_ORDER_STATE_INVALID as the response."
      - name: validation_priority_conflict_occ_beats_temporal
        claim_type: Priority conflict
        grounds:
          - validations[priority=46]
          - validations[priority=80]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_jig_version_beats_jig_window_conflict
          rationale: "That instance sends a stale jig version AND an overlapping window, expecting the 412 and no reservation row."
