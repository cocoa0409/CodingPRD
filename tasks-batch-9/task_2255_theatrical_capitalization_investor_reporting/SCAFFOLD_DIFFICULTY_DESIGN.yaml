  - name: settle_closing_notice_four_hop_cascade_releases_reserve_and_closes
    grounds:
    - §1.2 ClosingNotice ISSUED -> SETTLED side effects (4-hop cascade)
    - §1.3 closing_reserve_settlement
    - §1.1 BudgetLine.status PLANNED -> COMMITTED -> SPENT
    - §1.1 Production.operating_status CLOSING_NOTICE -> CLOSED, .released_capital_cents
    distinguishing_aspect: |
      Settling a closing notice must release the reserve net of closing costs, mark the
      RESERVE budget line SPENT, credit the released remainder to recoupment, and only
      then close the production. With a 2,000,000 reserve line and 300,000 of closing
      costs the released amount is 1,700,000 and the target of 20,000,000 is crossed at
      20,062,500 (recoupment_pct 1.0031), so recoupment_status flips to RECOUPED in the
      same call that sets operating_status CLOSED. An implementation that releases the
      gross reserve credits 2,000,000; one that closes before settling the reserve
      leaves the budget line COMMITTED; one that skips hop 3 leaves the production
      UNRECOUPED at close.
