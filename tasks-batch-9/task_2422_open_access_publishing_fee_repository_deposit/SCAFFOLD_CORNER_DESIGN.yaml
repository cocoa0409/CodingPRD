          One endpoint, two divergent side-effect sets: with entitled_discount_pct 0.20 from the
          agreement and a claimed 0.10, the outcome is DISCOUNT_SHORTFALL, so validation takes
          branch B — status DISPUTED, dispute_reason DISCOUNT_SHORTFALL — and no payment path
          exists out of DISPUTED, so payment-approval then returns ERR_INVOICE_INVALID_STATE 409.
          Pre-computed: net 304000, vat 18240 on the rounded net, expected 322240, variance 19760.
        test_recipe:
          setup:
            - "logical clock at 2026-08-12T00:00:00Z"
            - "publisher MERID with ACTIVE agreement (discount 0.20, quota 5) and FULL_APC coverage on the HYBRID journal at list_apc_cents 380000"
