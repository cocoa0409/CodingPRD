scenario: "850. Urban Forestry & Tree Permit: public-tree inventory & GIS canopy, planting & species/site selection, removal/pruning permit (protected tree), work-order & contractor, storm-damage & emergency, mitigation/replacement fee, condition inspection & risk rating, 811 coordination"
domain_name: "urban-forestry-tree-permit"
api_prefix: "/forestry"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys (zone_id, species_id, tree_id,
  # permit_id, contractor_id, work_order_id). No deep URL nesting except the two
  # reverse-reachability sub-resources (/trees/{id}/inspections,
  # /work-orders/{id}/dig-tickets). Canopy/risk aggregates cross FK boundaries.

  state_machine_shape: cyclic
  # Permit revision loop (INFO_REQUESTED <-> UNDER_REVIEW) and Inspection dispute
  # loop (FINALIZED <-> DISPUTED) are cyclic; Tree carries a branch-with-revert
  # health lifecycle; WorkOrder forks CREATED -> {COMPLETED, ABORTED}.

  relationship_patterns:
    - one_to_many        # Zone -> Tree, Tree -> Inspection, Permit -> ReplacementPlanting, WorkOrder -> DigTicket
    - cross_aggregate    # Permit gates on Tree's Inspection; WorkOrder gates on DigTicket + Contractor + StormEvent

  role_model: peer_roles
  # Six non-overlapping operational roles; Contractor is entity_backed and owns
  # its own WorkOrders; Applicant owns permits it filed (requested_by_user_id).

  consistency_model: immediate
  # All mutations and their cascades (canopy recompute, high-risk count,
  # mitigation obligation, tree removal) are atomic within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Management zone / neighborhood name"
      - name: target_canopy_pct
        type: number
        source: input
        description: "Canopy coverage goal as a percentage of zone land area (e.g., 30.0)"
        constraints: "0 <= target_canopy_pct <= 100"
      - name: area_sqm
        type: number
        source: input
        description: "Total land area of the zone in square metres; denominator for current_canopy_pct"
        constraints: "> 0"
      - name: live_canopy_sqm
        type: number
        source: computed
        description: "Maintained aggregate: SUM(species.mature_canopy_sqm) over Trees in this zone with health_status IN {HEALTHY, DECLINING, HAZARD}, PLUS SUM(species.mature_canopy_sqm) over ReplacementPlantings with target_zone_id == this zone AND status == ESTABLISHED. Recomputed on tree create, work-order complete (removal), and replacement establish."
        default: 0
      - name: current_canopy_pct
        type: number
        source: computed
        description: "round_half_up(live_canopy_sqm / area_sqm * 100, 2)"
        default: 0
      - name: canopy_status
        type: enum
        source: computed
        description: "MEETS if current_canopy_pct >= target_canopy_pct else DEFICIT"
        constraints: "one of {MEETS, DEFICIT}"
        default: DEFICIT
      - name: high_risk_tree_count
        type: integer
        source: computed
        description: "COUNT of Trees in this zone whose risk_rating IN {HIGH, SEVERE}; maintained on inspection finalize/dispute and on tree removal"
        default: 0
      - name: tree_count
        type: integer
        source: computed
        description: "COUNT of Trees in this zone whose health_status != REMOVED"
        default: 0

  - name: Species
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Common species name"
      - name: is_protected_species
        type: boolean
        source: input
        description: "True for heritage/protected species that require a permit to remove regardless of trunk size"
      - name: is_native
        type: boolean
        source: input
        description: "Whether the species is native to the region"
      - name: mature_canopy_sqm
        type: number
        source: input
        description: "Canopy area contributed by one mature tree of this species (square metres)"
        constraints: ">= 0"
      - name: base_replacement_value_dollars
        type: number
        source: input
        description: "Nominal per-tree replacement nursery value in dollars, used by the REPLACEMENT_COST mitigation method"
        constraints: ">= 0"
      - name: base_appraisal_value_per_sqin
        type: number
        source: input
        description: "Trunk-formula unit appraisal value in dollars per square inch of basal area, used by the APPRAISED_VALUE mitigation method"
        constraints: ">= 0"
      - name: min_spacing_m
        type: number
        source: input
        description: "Minimum planting spacing in metres for this species"
        constraints: ">= 0"

  - name: Tree
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the management zone this tree stands in"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; the tree's species"
      - name: dbh_inches
        type: number
        source: input
        description: "Diameter at breast height in inches; drives protected classification, replacement-count tier, and appraised value"
        constraints: "> 0"
      - name: canopy_radius_m
        type: number
        source: input
        description: "Observed canopy radius in metres (inventory attribute)"
        constraints: ">= 0"
      - name: latitude
        type: number
        source: input
        description: "GIS latitude of the tree point"
      - name: longitude
        type: number
        source: input
        description: "GIS longitude of the tree point"
      - name: condition_class
        type: enum
        source: input
        description: "Field condition grade at inventory; feeds APPRAISED_VALUE condition_factor"
        constraints: "one of {GOOD, FAIR, POOR, DEAD}"
      - name: is_protected
        type: boolean
        source: computed
        description: "dbh_inches >= 8.0 OR species.is_protected_species == true. Boundary is inclusive at exactly 8.0 inches. Immutable snapshot recomputed on any dbh update path (none in this API, so effectively fixed at create)."
      - name: health_status
        type: enum
        source: computed
        description: "Lifecycle state (see §1.2). Initial HEALTHY at create. Driven to DECLINING/HAZARD by inspection finalize, back by dispute, to REMOVED by work-order complete."
        constraints: "one of {HEALTHY, DECLINING, HAZARD, REMOVED}"
        default: HEALTHY
      - name: risk_rating
        type: enum
        source: computed
        description: "Latest finalized risk rating. NONE until a first inspection is finalized. Reverted by dispute to the value held before the disputed finalize."
        constraints: "one of {NONE, LOW, MODERATE, HIGH, SEVERE}"
        default: NONE
      - name: prior_risk_rating
        type: enum
        source: system
        description: "Snapshot of risk_rating captured immediately before the last finalize, so dispute can restore it deterministically"
        constraints: "one of {NONE, LOW, MODERATE, HIGH, SEVERE}"
        default: NONE
      - name: prior_health_status
        type: enum
        source: system
        description: "Snapshot of health_status captured immediately before the last finalize, so dispute can restore it deterministically"
        constraints: "one of {HEALTHY, DECLINING, HAZARD, REMOVED}"
        default: HEALTHY
      - name: current_inspection_id
        type: string
        source: system
        description: "Id of the most recently created Inspection for this tree; nullable until the first inspection exists"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: tree_id
        type: string
        source: input
        description: "FK -> Tree.id; the inspected tree"
      - name: inspection_type
        type: enum
        source: input
        description: "Purpose of inspection"
        constraints: "one of {ROUTINE, RISK, POST_STORM}"
      - name: likelihood_score
        type: integer
        source: input
        description: "Likelihood of failure, 1 (improbable) .. 4 (probable)"
        constraints: "1 <= likelihood_score <= 4"
      - name: consequence_score
        type: integer
        source: input
        description: "Consequence of failure, 1 (negligible) .. 4 (severe)"
        constraints: "1 <= consequence_score <= 4"
      - name: target_rating
        type: integer
        source: input
        description: "Target/occupancy rating of the failure zone, 1 (rare) .. 4 (constant); >=3 adds TARGET_BONUS to the final score"
        constraints: "1 <= target_rating <= 4"
      - name: provisional_risk_score
        type: integer
        source: computed
        description: "Field-visual variant computed at create: likelihood_score * consequence_score (no target bonus, no cap)"
      - name: provisional_risk_rating
        type: enum
        source: computed
        description: "Band of provisional_risk_score by the shared band table (see calculations.risk_rating)"
        constraints: "one of {LOW, MODERATE, HIGH, SEVERE}"
      - name: final_risk_score
        type: integer
        source: computed
        description: "Detailed variant computed at finalize: min(likelihood_score*consequence_score + (TARGET_BONUS if target_rating>=3 else 0), SCORE_CAP). Null until FINALIZED."
      - name: final_risk_rating
        type: enum
        source: computed
        description: "Band of final_risk_score. Null until FINALIZED."
        constraints: "one of {LOW, MODERATE, HIGH, SEVERE}"
      - name: status
        type: enum
        source: computed
        description: "State machine (see §1.2)"
        constraints: "one of {DRAFT, FINALIZED, DISPUTED}"
        default: DRAFT

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: tree_id
        type: string
        source: input
        description: "FK -> Tree.id; the tree the permit governs"
      - name: permit_type
        type: enum
        source: input
        description: "REMOVAL incurs mitigation; PRUNING never incurs mitigation"
        constraints: "one of {REMOVAL, PRUNING}"
      - name: reason
        type: string
        source: input
        description: "Applicant's stated reason"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Applicant who created the permit; ownership key for submit/provide-info/pay-fee"
      - name: status
        type: enum
        source: computed
        description: "State machine (see §1.2)"
        constraints: "one of {DRAFT, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED, ISSUED, CLOSED, REVOKED}"
        default: DRAFT
      - name: mitigation_method
        type: enum
        source: input
        description: "Chosen at review APPROVE for REMOVAL permits; selects the mitigation_fee_cents formula variant. Ignored/forced null for PRUNING."
        constraints: "one of {REPLACEMENT_COST, APPRAISED_VALUE}"
      - name: required_replacement_count
        type: integer
        source: computed
        description: "Number of replacement trees required, tiered by the tree's dbh_inches (see calculations.required_replacement_count). Set at APPROVE; 0 for PRUNING."
        default: 0
      - name: mitigation_fee_cents
        type: integer
        source: computed
        description: "Mitigation fee in integer cents computed at APPROVE per the selected mitigation_method (see calculations.mitigation_fee). 0 for PRUNING."
        default: 0
      - name: fee_paid
        type: boolean
        source: system
        description: "True once pay-fee records a payment equal to mitigation_fee_cents"
        default: false
      - name: fee_paid_cents
        type: integer
        source: system
        description: "Amount recorded by pay-fee, in cents"
        default: 0
      - name: review_notes
        type: string
        source: input
        description: "Arborist notes captured on the review transition"

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Contractor / tree-service company name"
      - name: license_number
        type: string
        source: input
        description: "Municipal tree-work license number"
      - name: license_expiry
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the license expires; work-order start requires logical clock < license_expiry"
      - name: is_certified_arborist
        type: boolean
        source: input
        description: "Whether the contractor holds an ISA arborist certification"
      - name: status
        type: enum
        source: input
        description: "Operational status; SUSPENDED contractors cannot be assigned to work orders. Settable at create (system initialization may produce SUSPENDED)."
        constraints: "one of {ACTIVE, SUSPENDED}"
        default: ACTIVE

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: tree_id
        type: string
        source: input
        description: "FK -> Tree.id; the subject tree (always present, denormalized from the permit for normal work or supplied directly for emergency work)"
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the issued permit authorizing this work. Null for EMERGENCY_REMOVAL work orders, which are authorized by an ACTIVE StormEvent instead."
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the assigned contractor"
      - name: work_type
        type: enum
        source: input
        description: "REMOVAL/PRUNING require an ISSUED permit_id; EMERGENCY_REMOVAL requires permit_id null and an ACTIVE StormEvent covering the tree's zone"
        constraints: "one of {REMOVAL, PRUNING, EMERGENCY_REMOVAL}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the scheduled work window; used for contractor double-booking overlap"
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the scheduled work window (exclusive)"
        constraints: "scheduled_end > scheduled_start"
      - name: status
        type: enum
        source: computed
        description: "State machine (see §1.2)"
        constraints: "one of {CREATED, IN_PROGRESS, COMPLETED, ABORTED}"
        default: CREATED

  - name: DigTicket
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this 811 locate ticket clears"
      - name: ticket_number
        type: string
        source: input
        description: "811 one-call center ticket number"
      - name: valid_from
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the lawful dig window (inclusive)"
      - name: valid_to
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the lawful dig window (exclusive); must be strictly after valid_from"
        constraints: "valid_to > valid_from"
      - name: status
        type: enum
        source: computed
        description: "State machine (see §1.2). REQUESTED at create; VALID after utility clearance; EXPIRED once the logical clock reaches valid_to."
        constraints: "one of {REQUESTED, VALID, EXPIRED}"
        default: REQUESTED

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - name: affected_zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the zone under emergency declaration"
      - name: severity
        type: enum
        source: input
        description: "Declared storm severity"
        constraints: "one of {MINOR, MAJOR, SEVERE}"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the emergency window (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the emergency window (inclusive); closed-interval overlap semantics on the zone"
        constraints: "window_end > window_start"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at declaration; CLOSED after close (see §1.2)"
        constraints: "one of {ACTIVE, CLOSED}"
        default: ACTIVE

  - name: ReplacementPlanting
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the removal permit whose mitigation obligation this planting satisfies (created by cascade at APPROVE)"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; species to plant (defaults to the removed tree's species)"
      - name: target_zone_id
        type: string
        source: input
        description: "FK -> Zone.id; zone where the replacement is to be planted (defaults to the removed tree's zone)"
      - name: sequence_index
        type: integer
        source: system
        description: "1-based ordinal of this planting within the permit's required set"
      - name: status
        type: enum
        source: computed
        description: "State machine (see §1.2)"
        constraints: "one of {REQUIRED, PLANTED, ESTABLISHED}"
        default: REQUIRED

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [DENIED, CLOSED, REVOKED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /forestry/permits/{id}/submit"
        actor: Applicant
        preconditions:
          - "acting Applicant's X-User-ID == permit.requested_by_user_id"
          - "tree.is_protected == true (a protected tree is required to file a permit)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /forestry/permits/{id}/review (decision=APPROVE)"
        actor: Arborist
        preconditions:
          - "for REMOVAL permits: the tree's current_inspection_id references an Inspection whose status == FINALIZED (cross-entity gate)"
          - "for REMOVAL permits: mitigation_method is present in the request body"
        side_effects:
          - "compute required_replacement_count (calculations.required_replacement_count)"
          - "compute mitigation_fee_cents (calculations.mitigation_fee) using mitigation_method"
          - "create required_replacement_count ReplacementPlanting rows in status REQUIRED (species_id = tree.species_id, target_zone_id = tree.zone_id, sequence_index 1..count)"
          - "add mitigation_fee_cents to total_outstanding_mitigation_cents (conserved quantity)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /forestry/permits/{id}/review (decision=DENY)"
        actor: Arborist
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /forestry/permits/{id}/review (decision=REQUEST_INFO)"
        actor: Arborist
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /forestry/permits/{id}/provide-info"
        actor: Applicant
        preconditions:
          - "acting Applicant's X-User-ID == permit.requested_by_user_id"
        side_effects: []
        note: "Revision loop — a permit may cycle UNDER_REVIEW <-> INFO_REQUESTED any number of times."
      - from: APPROVED
        to: ISSUED
        trigger: "POST /forestry/permits/{id}/issue"
        actor: Arborist
        preconditions:
          - "permit.status == APPROVED (state precondition — ERR_PERMIT_NOT_APPROVED)"
          - "permit.fee_paid == true (fiscal precondition — ERR_FEE_UNPAID)"
        side_effects: []
        note: "Priority conflict target: state check (ERR_PERMIT_NOT_APPROVED) outranks fiscal check (ERR_FEE_UNPAID)."
      - from: ISSUED
        to: CLOSED
        trigger: "system: WorkOrder.complete on a REMOVAL/PRUNING work order that references this permit"
        actor: system
        preconditions:
          - "work_order.permit_id == permit.id"
        side_effects:
          - "subtract mitigation_fee_cents from total_outstanding_mitigation_cents"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /forestry/permits/{id}/revoke"
        actor: ForestryAdmin
        preconditions: []
        side_effects:
          - "subtract mitigation_fee_cents from total_outstanding_mitigation_cents (compensating action for the APPROVE debit)"
          - "no ReplacementPlanting rows are deleted, but they no longer count toward outstanding mitigation because the permit is REVOKED"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /forestry/permits/{id}/revoke"
        actor: ForestryAdmin
        preconditions: []
        side_effects:
          - "subtract mitigation_fee_cents from total_outstanding_mitigation_cents if it had not already been subtracted by CLOSE"

  - entity: Inspection
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /forestry/inspections/{id}/finalize"
        actor: Inspector
        preconditions:
          - "inspection.status == DRAFT"
        side_effects:
          - "compute final_risk_score and final_risk_rating (calculations.risk_rating final variant)"
          - "snapshot tree.risk_rating -> tree.prior_risk_rating and tree.health_status -> tree.prior_health_status"
          - "set tree.risk_rating = final_risk_rating"
          - "set tree.health_status = HAZARD if final_risk_rating==SEVERE, DECLINING if final_risk_rating==HIGH, else HEALTHY (cascade B)"
          - "recompute zone.high_risk_tree_count for the tree's zone (cascade C)"
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /forestry/inspections/{id}/finalize"
        actor: Inspector
        preconditions:
          - "inspection.status == DISPUTED"
        side_effects:
          - "same finalize side effects as from DRAFT (re-finalization after dispute)"
        note: "Dispute loop — FINALIZED <-> DISPUTED is cyclic."
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /forestry/inspections/{id}/dispute"
        actor: ForestryAdmin
        preconditions:
          - "inspection.status == FINALIZED"
          - "tree.current_inspection_id == inspection.id (only the latest finalized inspection may be disputed)"
        side_effects:
          - "restore tree.risk_rating = tree.prior_risk_rating (compensation)"
          - "restore tree.health_status = tree.prior_health_status"
          - "recompute zone.high_risk_tree_count for the tree's zone (compensating cascade — count returns to pre-finalize value)"

  - entity: Tree
    initial_state: HEALTHY
    terminal_states: [REMOVED]
    transitions:
      - from: HEALTHY
        to: DECLINING
        trigger: "system: Inspection.finalize with final_risk_rating==HIGH"
        actor: system
        preconditions: []
        side_effects: ["zone.high_risk_tree_count += 1 (HIGH enters the high-risk set)"]
      - from: HEALTHY
        to: HAZARD
        trigger: "system: Inspection.finalize with final_risk_rating==SEVERE"
        actor: system
        preconditions: []
        side_effects: ["zone.high_risk_tree_count += 1 (SEVERE enters the high-risk set)"]
      - from: DECLINING
        to: HAZARD
        trigger: "system: Inspection.finalize with final_risk_rating==SEVERE"
        actor: system
        preconditions: []
        side_effects: []
      - from: HAZARD
        to: DECLINING
        trigger: "system: Inspection.dispute restoring prior_health_status==DECLINING"
        actor: system
        preconditions: []
        side_effects: ["zone.high_risk_tree_count recomputed"]
        note: "Branch-with-revert: finalize pushes toward HAZARD, dispute reverts to the snapshotted prior status."
      - from: HAZARD
        to: HEALTHY
        trigger: "system: Inspection.dispute restoring prior_health_status==HEALTHY"
        actor: system
        preconditions: []
        side_effects: ["zone.high_risk_tree_count recomputed"]
      - from: HEALTHY
        to: REMOVED
        trigger: "system: WorkOrder.complete (removal / emergency removal)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute zone.live_canopy_sqm, zone.current_canopy_pct, zone.canopy_status (cascade)"
          - "recompute zone.tree_count and zone.high_risk_tree_count"
      - from: DECLINING
        to: REMOVED
        trigger: "system: WorkOrder.complete (removal / emergency removal)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute zone.live_canopy_sqm, zone.current_canopy_pct, zone.canopy_status"
          - "recompute zone.tree_count and zone.high_risk_tree_count"
      - from: HAZARD
        to: REMOVED
        trigger: "system: WorkOrder.complete (removal / emergency removal)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute zone.live_canopy_sqm, zone.current_canopy_pct, zone.canopy_status"
          - "recompute zone.tree_count and zone.high_risk_tree_count"

  - entity: WorkOrder
    initial_state: CREATED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: CREATED
        to: IN_PROGRESS
        trigger: "POST /forestry/work-orders/{id}/start"
        actor: Contractor
        preconditions:
          - "acting Contractor's X-User-ID == work_order.contractor_id"
          - "there exists a DigTicket for this work order in status VALID whose window contains the logical clock: valid_from <= now < valid_to (business_safety — ERR_DIG_TICKET_INVALID)"
          - "contractor.status == ACTIVE"
          - "logical clock < contractor.license_expiry (business_referential — ERR_CONTRACTOR_LICENSE_EXPIRED)"
        side_effects: []
        note: "Priority conflict target: safety (dig ticket) outranks referential (license)."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /forestry/work-orders/{id}/complete"
        actor: Contractor
        preconditions:
          - "acting Contractor's X-User-ID == work_order.contractor_id"
        side_effects:
          - "if work_type IN {REMOVAL, EMERGENCY_REMOVAL}: set tree.health_status = REMOVED (cascade B) which triggers zone canopy + count recompute (cascade C/D)"
          - "if permit_id is not null: transition the permit ISSUED -> CLOSED and subtract its mitigation_fee_cents from total_outstanding_mitigation_cents"
      - from: CREATED
        to: ABORTED
        trigger: "POST /forestry/work-orders/{id}/abort"
        actor: ForestryStaff
        preconditions: []
        side_effects: ["no tree/canopy changes; the assigned contractor's schedule window frees up"]
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /forestry/work-orders/{id}/abort"
        actor: ForestryStaff
        preconditions: []
        side_effects: ["no tree/canopy changes; work halted with no removal side effects (branch divergence vs COMPLETED)"]

  - entity: DigTicket
    initial_state: REQUESTED
    terminal_states: [EXPIRED]
    transitions:
      - from: REQUESTED
        to: VALID
        trigger: "POST /forestry/dig-tickets/{id}/mark-valid"
        actor: ForestryAdmin
        preconditions:
          - "dig_ticket.status == REQUESTED"
        side_effects: []
      - from: VALID
        to: EXPIRED
        trigger: "system: logical clock reaches valid_to (evaluated lazily on read/start)"
        actor: system
        preconditions:
          - "now >= valid_to"
        side_effects: []
      - from: REQUESTED
        to: EXPIRED
        trigger: "system: logical clock reaches valid_to before clearance"
        actor: system
        preconditions:
          - "now >= valid_to"
        side_effects: []

  - entity: StormEvent
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /forestry/storm-events/{id}/close"
        actor: ForestryAdmin
        preconditions:
          - "storm_event.status == ACTIVE"
        side_effects: ["zone no longer authorizes new EMERGENCY_REMOVAL work orders"]

  - entity: ReplacementPlanting
    initial_state: REQUIRED
    terminal_states: [ESTABLISHED]
    transitions:
      - from: REQUIRED
        to: PLANTED
        trigger: "POST /forestry/replacement-plantings/{id}/plant"
        actor: ForestryStaff
        preconditions:
          - "replacement.status == REQUIRED"
          - "the parent Permit.status IN {APPROVED, ISSUED, CLOSED} (not REVOKED/DENIED)"
        side_effects: []
      - from: PLANTED
        to: ESTABLISHED
        trigger: "POST /forestry/replacement-plantings/{id}/establish"
        actor: Inspector
        preconditions:
          - "replacement.status == PLANTED"
        side_effects:
          - "add species.mature_canopy_sqm to zone.live_canopy_sqm for target_zone_id and recompute current_canopy_pct + canopy_status"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: inspection-create-stale-tree
    parent_entity: Tree
    write_endpoint: "POST /forestry/trees/{id}/inspections"
    occ_field: "expected_tree_version"
    description: |
      Creating a new Inspection against a Tree whose version has advanced since
      the client last observed it is rejected. Inspections are periodic, so a
      second create observing identical state would itself legitimately succeed;
      this is the CREATE-with-supersede case where another writer has already
      created an inspection (which becomes the tree's current_inspection_id and
      bumps tree.version), leaving this writer's view of the tree stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: required_replacement_count
    trigger: "Permit review APPROVE (transition UNDER_REVIEW -> APPROVED)"
    algorithm: threshold
    formula: |
      # Tiered by the governed tree's dbh_inches; lower bounds inclusive.
      if permit_type == PRUNING: return 0
      dbh = tree.dbh_inches
      if dbh < 8.0:            count = 0    # protected only by species; no size-based replacement
      elif dbh < 18.0:         count = 1
      elif dbh < 30.0:         count = 2
      else:                    count = 3    # dbh >= 30.0
      return count
    input_set: "The single Tree referenced by permit.tree_id at APPROVE time."
    constants:
      DBH_TIER_1: 8.0
      DBH_TIER_2: 18.0
      DBH_TIER_3: 30.0
    precision: "integer count; no rounding"
    variants: []

  - name: mitigation_fee
    trigger: "Permit review APPROVE (transition UNDER_REVIEW -> APPROVED)"
    algorithm: tiered_pricing
    formula: |
      # Two mutually exclusive variants selected by permit.mitigation_method.
      if permit_type == PRUNING: return 0
      count = required_replacement_count   # from the sibling calculation
      # ---- Variant REPLACEMENT_COST (mode-b nested rounding; order pinned) ----
      # Round each replacement tree's cost to whole cents FIRST, then sum across
      # the `count` trees. Do NOT sum the unrounded per-tree dollars then round.
      per_tree_cents = round_half_up(species.base_replacement_value_dollars
                                     * REPLACEMENT_SITE_FACTOR * 100)
      fee_replacement = per_tree_cents * count
      # ---- Variant APPRAISED_VALUE (trunk formula) ----
      trunk_area_sqin = BASAL_AREA_FACTOR * (tree.dbh_inches ** 2)
      condition_factor = { GOOD: 1.0, FAIR: 0.75, POOR: 0.5, DEAD: 0.25 }[tree.condition_class]
      fee_appraised = round_half_up(species.base_appraisal_value_per_sqin
                                    * trunk_area_sqin * condition_factor * 100)
      return fee_replacement if mitigation_method == REPLACEMENT_COST else fee_appraised
    input_set: "The single Tree referenced by permit.tree_id and its Species, at APPROVE time."
    constants:
      REPLACEMENT_SITE_FACTOR: 1.075
      BASAL_AREA_FACTOR: 0.5454
      CONDITION_FACTOR_GOOD: 1.0
      CONDITION_FACTOR_FAIR: 0.75
      CONDITION_FACTOR_POOR: 0.5
      CONDITION_FACTOR_DEAD: 0.25
    precision: "integer cents, round_half_up applied per-tree BEFORE summation for REPLACEMENT_COST; single final round for APPRAISED_VALUE"
    variants:
      - name: REPLACEMENT_COST
        when: "permit.mitigation_method == REPLACEMENT_COST"
        difference: "fee = (round_half_up(base_replacement_value_dollars * 1.075 * 100)) * required_replacement_count; per-tree rounding then multiply"
      - name: APPRAISED_VALUE
        when: "permit.mitigation_method == APPRAISED_VALUE"
        difference: "fee = round_half_up(base_appraisal_value_per_sqin * (0.5454*dbh^2) * condition_factor * 100); trunk-formula appraisal independent of replacement count"

  - name: risk_rating
    trigger: "Inspection create (provisional variant) and Inspection finalize (final variant)"
    algorithm: weighted_scoring
    formula: |
      # Shared band table maps an integer score to a rating:
      #   score <= 3  -> LOW
      #   4 <= score <= 7  -> MODERATE
      #   8 <= score <= 11 -> HIGH
      #   score >= 12 -> SEVERE
      # Provisional (at create): score_p = likelihood_score * consequence_score
      # Final (at finalize):     score_f = min(likelihood_score*consequence_score
      #                                        + (TARGET_BONUS if target_rating>=3 else 0),
      #                                        SCORE_CAP)
      def band(s):
        if s <= 3: return LOW
        if s <= 7: return MODERATE
        if s <= 11: return HIGH
        return SEVERE
    input_set: "The single Inspection's own likelihood_score, consequence_score, target_rating."
    constants:
      TARGET_BONUS: 3
      SCORE_CAP: 16
      BAND_MODERATE_MIN: 4
      BAND_HIGH_MIN: 8
      BAND_SEVERE_MIN: 12
    precision: "integer scores; band boundaries inclusive on the lower edge (>= 12 is SEVERE)"
    variants:
      - name: provisional
        when: "computed at Inspection create; stored in provisional_risk_score / provisional_risk_rating"
        difference: "no target bonus and no cap: score = likelihood*consequence only"
      - name: final
        when: "computed at Inspection finalize; stored in final_risk_score / final_risk_rating and pushed to tree.risk_rating"
        difference: "adds TARGET_BONUS when target_rating>=3 and clamps to SCORE_CAP=16; can raise the band above the provisional band"

  - name: zone_canopy
    trigger: "Tree create; WorkOrder complete (removal); ReplacementPlanting establish"
    algorithm: aggregation
    formula: |
      live_canopy_sqm = ( SUM(species.mature_canopy_sqm)
                            over Trees t where t.zone_id == zone.id
                            AND t.health_status IN {HEALTHY, DECLINING, HAZARD} )
                        + ( SUM(species.mature_canopy_sqm)
                            over ReplacementPlantings r where r.target_zone_id == zone.id
                            AND r.status == ESTABLISHED )
      current_canopy_pct = round_half_up(live_canopy_sqm / zone.area_sqm * 100, 2)
      canopy_status = MEETS if current_canopy_pct >= zone.target_canopy_pct else DEFICIT
    input_set: "Trees (excluding REMOVED) and ESTABLISHED ReplacementPlantings scoped to the zone."
    constants: {}
    precision: "current_canopy_pct to 2 decimals, round_half_up; canopy_status threshold inclusive at target"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named by a path segment exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: business_referential
    check: "ownership: Applicant acting on permit submit/provide-info/pay-fee must have X-User-ID == permit.requested_by_user_id; Contractor acting on work-order start/complete or dig-ticket create must have X-User-ID == work_order.contractor_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "permit submit/provide-info/pay-fee; work-order start/complete; dig-ticket create"
  - priority: 5
    category: business_constraint
    check: "request body shape: required fields present and correctly typed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH"
  - priority: 6
    category: business_constraint
    check: "enum-valued fields carry a value in the declared set"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all endpoints accepting enum inputs"
  - priority: 7
    category: business_referential
    check: "referenced foreign keys in the body resolve to existing rows (zone_id, species_id, tree_id, permit_id, contractor_id, affected_zone_id, work_order_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all creates carrying FK bodies"
  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: state
    check: "OCC: expected_tree_version equals the current Tree.version on inspection create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /forestry/trees/{id}/inspections"
  - priority: 10
    category: state
    check: "permit issue requires status == APPROVED (state precondition; outranks the fiscal fee check)"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /forestry/permits/{id}/issue"
  - priority: 11
    category: business_safety
    check: "permit for a non-protected tree is rejected (tree.is_protected must be true to submit)"
    error_id: ERR_TREE_NOT_PROTECTED
    http_status: 422
    applies_to: "POST /forestry/permits/{id}/submit"
  - priority: 12
    category: business_safety
    check: "REMOVAL permit APPROVE requires the tree's current_inspection_id to point to a FINALIZED Inspection"
    error_id: ERR_INSPECTION_REQUIRED
    http_status: 422
    applies_to: "POST /forestry/permits/{id}/review (decision=APPROVE)"
  - priority: 13
    category: business_safety
    check: "work-order start requires a VALID DigTicket whose window contains the clock (valid_from <= now < valid_to); else the dig ticket is invalid/expired"
    error_id: ERR_DIG_TICKET_INVALID
    http_status: 409
    applies_to: "POST /forestry/work-orders/{id}/start"
  - priority: 14
    category: business_safety
    check: "EMERGENCY_REMOVAL work-order create requires an ACTIVE StormEvent on the tree's zone whose window contains the clock; normal REMOVAL/PRUNING require permit_id to reference an ISSUED permit"
    error_id: ERR_EMERGENCY_NOT_DECLARED
    http_status: 422
    applies_to: "POST /forestry/work-orders"
  - priority: 15
    category: state
    check: "REMOVAL/PRUNING work-order create requires the referenced permit to be ISSUED"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /forestry/work-orders"
  - priority: 16
    category: business_temporal
    check: "dig-ticket window well-formed: valid_to strictly after valid_from"
    error_id: ERR_DIG_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /forestry/work-orders/{id}/dig-tickets"
  - priority: 17
    category: business_temporal
    check: "contractor double-booking: the new work order's [scheduled_start, scheduled_end) must not overlap any other work order for the same contractor in status IN {CREATED, IN_PROGRESS}. Half-open intervals — touching at an endpoint (end == start) does NOT overlap."
    error_id: ERR_CONTRACTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /forestry/work-orders"
  - priority: 18
    category: business_temporal
    check: "storm-event overlap: the new event's [window_start, window_end] must not overlap any other ACTIVE StormEvent on the same zone. Closed intervals — touching at an endpoint DOES overlap."
    error_id: ERR_STORM_OVERLAP
    http_status: 409
    applies_to: "POST /forestry/storm-events"
  - priority: 19
    category: business_referential
    check: "assigned contractor must be ACTIVE and, at work-order start, license unexpired (logical clock < license_expiry)"
    error_id: ERR_CONTRACTOR_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /forestry/work-orders (SUSPENDED at create); POST /forestry/work-orders/{id}/start (expired license)"
  - priority: 20
    category: business_fiscal
    check: "pay-fee amount_cents must equal permit.mitigation_fee_cents exactly"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /forestry/permits/{id}/pay-fee"
  - priority: 21
    category: business_fiscal
    check: "permit issue requires fee_paid == true (fiscal precondition; ranked below the APPROVED state check at priority 10)"
    error_id: ERR_FEE_UNPAID
    http_status: 402
    applies_to: "POST /forestry/permits/{id}/issue"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Zones ----
  - method: POST
    path: "/forestry/zones"
    description: "Create a management zone"
    roles: [ForestryAdmin]
    code: 201
    input: [name, target_canopy_pct, area_sqm]
    output: Zone
    side_effects: ["initialize live_canopy_sqm=0, current_canopy_pct=0, canopy_status=DEFICIT, counts=0"]
  - method: GET
    path: "/forestry/zones/{id}"
    description: "Fetch a zone with its derived canopy fields"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: Zone
    side_effects: []

  # ---- Species ----
  - method: POST
    path: "/forestry/species"
    description: "Create a species record (configuration)"
    roles: [ForestryAdmin]
    code: 201
    input: [name, is_protected_species, is_native, mature_canopy_sqm, base_replacement_value_dollars, base_appraisal_value_per_sqin, min_spacing_m]
    output: Species
    side_effects: []
  - method: GET
    path: "/forestry/species/{id}"
    description: "Fetch a species"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: Species
    side_effects: []

  # ---- Trees (inventory + GIS) ----
  - method: POST
    path: "/forestry/trees"
    description: "Add a public tree to the inventory; computes is_protected at create"
    roles: [ForestryStaff]
    code: 201
    input: [zone_id, species_id, dbh_inches, canopy_radius_m, latitude, longitude, condition_class]
    output: Tree
    side_effects: ["compute is_protected (dbh_inches>=8.0 OR species.is_protected_species)", "recompute zone.live_canopy_sqm/current_canopy_pct/canopy_status/tree_count"]
  - method: GET
    path: "/forestry/trees/{id}"
    description: "Fetch a tree"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: Tree
    side_effects: []
  - method: GET
    path: "/forestry/trees"
    description: "List/filter trees (reverse-reachability for Tree.zone_id and Tree.species_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["zone_id?", "species_id?", "health_status?", "is_protected?", "limit?", "offset?"]
    output: Tree[]
    side_effects: []
  - method: POST
    path: "/forestry/trees/{id}/inspections"
    description: "Create a condition inspection for a tree (OCC-guarded on tree.version); computes the provisional risk variant"
    roles: [Inspector]
    code: 201
    input: [expected_tree_version, inspection_type, likelihood_score, consequence_score, target_rating]
    output: Inspection
    side_effects: ["create Inspection in DRAFT with provisional_risk_score/rating", "set tree.current_inspection_id = new inspection id", "increments Tree.version by 1"]
  - method: GET
    path: "/forestry/trees/{id}/inspections"
    description: "List inspections for a tree (reverse-reachability for Inspection.tree_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  # ---- Inspections (condition & risk rating) ----
  - method: GET
    path: "/forestry/inspections/{id}"
    description: "Fetch an inspection"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/forestry/inspections/{id}/finalize"
    description: "Finalize an inspection; computes the final risk variant and cascades to the tree and zone"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["compute final_risk_score/rating", "snapshot then set tree.risk_rating and tree.health_status", "recompute zone.high_risk_tree_count"]
  - method: POST
    path: "/forestry/inspections/{id}/dispute"
    description: "Dispute the latest finalized inspection; compensates the tree and zone changes"
    roles: [ForestryAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: ["restore tree.risk_rating/health_status from snapshots", "recompute zone.high_risk_tree_count"]

  # ---- Permits (removal / pruning, protected tree) ----
  - method: POST
    path: "/forestry/permits"
    description: "File a permit for a protected tree (Applicant); stores requested_by_user_id from X-User-ID"
    roles: [Applicant]
    code: 201
    input: [tree_id, permit_type, reason]
    output: Permit
    side_effects: ["set requested_by_user_id from X-User-ID", "status=DRAFT"]
  - method: GET
    path: "/forestry/permits/{id}"
    description: "Fetch a permit"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/forestry/permits"
    description: "List/filter permits (reverse-reachability for Permit.tree_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["tree_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/forestry/permits/{id}/submit"
    description: "Submit a DRAFT permit for review (owner Applicant); rejects non-protected trees"
    roles: [Applicant]
    code: 200
    input: []
    output: Permit
    side_effects: ["status DRAFT -> UNDER_REVIEW"]
  - method: POST
    path: "/forestry/permits/{id}/review"
    description: "Arborist decision on an UNDER_REVIEW permit: APPROVE / DENY / REQUEST_INFO"
    roles: [Arborist]
    code: 200
    input: [decision, "mitigation_method?", "review_notes?"]
    output: Permit
    side_effects: ["APPROVE: compute required_replacement_count + mitigation_fee_cents, create ReplacementPlanting rows, add to total_outstanding_mitigation_cents", "REQUEST_INFO: -> INFO_REQUESTED", "DENY: -> DENIED"]
  - method: POST
    path: "/forestry/permits/{id}/provide-info"
    description: "Applicant responds to an info request, returning the permit to review (revision loop)"
    roles: [Applicant]
    code: 200
    input: ["response_note?"]
    output: Permit
    side_effects: ["status INFO_REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/forestry/permits/{id}/pay-fee"
    description: "Applicant pays the mitigation fee; amount must equal mitigation_fee_cents"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: Permit
    side_effects: ["set fee_paid=true, fee_paid_cents=amount_cents"]
  - method: POST
    path: "/forestry/permits/{id}/issue"
    description: "Arborist issues an APPROVED, fee-paid permit"
    roles: [Arborist]
    code: 200
    input: []
    output: Permit
    side_effects: ["status APPROVED -> ISSUED"]
  - method: POST
    path: "/forestry/permits/{id}/revoke"
    description: "Admin revokes an APPROVED or ISSUED permit; compensates the outstanding mitigation debit"
    roles: [ForestryAdmin]
    code: 200
    input: ["reason?"]
    output: Permit
    side_effects: ["status -> REVOKED", "subtract mitigation_fee_cents from total_outstanding_mitigation_cents"]
  - method: GET
    path: "/forestry/permits/{id}/replacement-plantings"
    description: "List a permit's replacement plantings (reverse-reachability for ReplacementPlanting.permit_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: ReplacementPlanting[]
    side_effects: []

  # ---- Replacement plantings (mitigation fulfilment) ----
  - method: GET
    path: "/forestry/replacement-plantings/{id}"
    description: "Fetch a replacement planting"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: ReplacementPlanting
    side_effects: []
  - method: GET
    path: "/forestry/replacement-plantings"
    description: "List/filter replacement plantings (reverse-reachability for species_id and target_zone_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["permit_id?", "species_id?", "target_zone_id?", "status?", "limit?", "offset?"]
    output: ReplacementPlanting[]
    side_effects: []
  - method: POST
    path: "/forestry/replacement-plantings/{id}/plant"
    description: "Mark a required replacement as planted"
    roles: [ForestryStaff]
    code: 200
    input: []
    output: ReplacementPlanting
    side_effects: ["status REQUIRED -> PLANTED"]
  - method: POST
    path: "/forestry/replacement-plantings/{id}/establish"
    description: "Confirm a planted replacement has established; adds species canopy to the target zone"
    roles: [Inspector]
    code: 200
    input: []
    output: ReplacementPlanting
    side_effects: ["status PLANTED -> ESTABLISHED", "add species.mature_canopy_sqm to target zone live_canopy_sqm and recompute canopy fields"]

  # ---- Contractors ----
  - method: POST
    path: "/forestry/contractors"
    description: "Register a licensed tree-work contractor"
    roles: [ForestryAdmin]
    code: 201
    input: [name, license_number, license_expiry, is_certified_arborist, "status?"]
    output: Contractor
    side_effects: []
  - method: GET
    path: "/forestry/contractors/{id}"
    description: "Fetch a contractor"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: Contractor
    side_effects: []

  # ---- Work orders ----
  - method: POST
    path: "/forestry/work-orders"
    description: "Create a work order; normal work needs an ISSUED permit, EMERGENCY_REMOVAL needs an ACTIVE StormEvent on the tree's zone"
    roles: [ForestryStaff]
    code: 201
    input: [tree_id, "permit_id?", contractor_id, work_type, scheduled_start, scheduled_end]
    output: WorkOrder
    side_effects: ["status=CREATED"]
  - method: GET
    path: "/forestry/work-orders/{id}"
    description: "Fetch a work order"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/forestry/work-orders"
    description: "List/filter work orders (reverse-reachability for tree_id, permit_id, contractor_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["tree_id?", "permit_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/forestry/work-orders/{id}/start"
    description: "Contractor starts work; requires a VALID dig ticket in-window and an unexpired license"
    roles: [Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status CREATED -> IN_PROGRESS"]
  - method: POST
    path: "/forestry/work-orders/{id}/complete"
    description: "Contractor completes work; removal work cascades tree removal and closes the permit"
    roles: [Contractor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status IN_PROGRESS -> COMPLETED", "removal cascades: tree.health_status=REMOVED -> zone canopy/count recompute; permit ISSUED->CLOSED"]
  - method: POST
    path: "/forestry/work-orders/{id}/abort"
    description: "Staff aborts a work order (branch that fires no removal side effects)"
    roles: [ForestryStaff]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["status -> ABORTED"]

  # ---- 811 dig tickets ----
  - method: POST
    path: "/forestry/work-orders/{id}/dig-tickets"
    description: "Contractor requests an 811 locate ticket for a work order"
    roles: [Contractor]
    code: 201
    input: [ticket_number, valid_from, valid_to]
    output: DigTicket
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/forestry/work-orders/{id}/dig-tickets"
    description: "List dig tickets for a work order (reverse-reachability for DigTicket.work_order_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: DigTicket[]
    side_effects: []
  - method: GET
    path: "/forestry/dig-tickets/{id}"
    description: "Fetch a dig ticket (lazily marks EXPIRED if the clock has passed valid_to)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: DigTicket
    side_effects: ["if now >= valid_to: status -> EXPIRED"]
  - method: POST
    path: "/forestry/dig-tickets/{id}/mark-valid"
    description: "Admin records 811 utility clearance, moving the ticket to VALID"
    roles: [ForestryAdmin]
    code: 200
    input: []
    output: DigTicket
    side_effects: ["status REQUESTED -> VALID"]

  # ---- Storm events (emergency) ----
  - method: POST
    path: "/forestry/storm-events"
    description: "Declare a storm emergency over a zone (non-overlapping active windows per zone)"
    roles: [ForestryAdmin]
    code: 201
    input: [affected_zone_id, severity, window_start, window_end]
    output: StormEvent
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/forestry/storm-events/{id}"
    description: "Fetch a storm event"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: []
    output: StormEvent
    side_effects: []
  - method: GET
    path: "/forestry/storm-events"
    description: "List/filter storm events (reverse-reachability for StormEvent.affected_zone_id)"
    roles: [ForestryAdmin, ForestryStaff, Arborist, Inspector, Applicant, Contractor]
    code: 200
    input: ["affected_zone_id?", "status?", "limit?", "offset?"]
    output: StormEvent[]
    side_effects: []
  - method: POST
    path: "/forestry/storm-events/{id}/close"
    description: "Close an active storm event"
    roles: [ForestryAdmin]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["status ACTIVE -> CLOSED"]

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/forestry/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-03-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time. Governs dig-window, license-expiry, and storm-window evaluation."
    roles: [ForestryAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Applicant/Contractor acting on a resource they do not own"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field or wrong type in body"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum field carries a value outside its declared set"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "Referenced zone id does not exist"
  - id: ERR_SPECIES_NOT_FOUND
    http: 404
    condition: "Referenced species id does not exist"
  - id: ERR_TREE_NOT_FOUND
    http: 404
    condition: "Referenced tree id does not exist"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "Referenced permit id does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "Referenced inspection id does not exist"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "Referenced contractor id does not exist"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced work order id does not exist"
  - id: ERR_DIG_TICKET_NOT_FOUND
    http: 404
    condition: "Referenced dig ticket id does not exist"
  - id: ERR_STORM_EVENT_NOT_FOUND
    http: 404
    condition: "Referenced storm event id does not exist"
  - id: ERR_REPLACEMENT_NOT_FOUND
    http: 404
    condition: "Referenced replacement planting id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_tree_version does not match the tree's current version on inspection create (OCC)"
  - id: ERR_PERMIT_NOT_APPROVED
    http: 409
    condition: "Permit issue attempted while status != APPROVED"
  - id: ERR_TREE_NOT_PROTECTED
    http: 422
    condition: "Permit submit for a tree whose is_protected == false"
  - id: ERR_INSPECTION_REQUIRED
    http: 422
    condition: "REMOVAL permit APPROVE without a FINALIZED current inspection on the tree"
  - id: ERR_PERMIT_NOT_ISSUED
    http: 409
    condition: "REMOVAL/PRUNING work-order create with a permit not in ISSUED"
  - id: ERR_EMERGENCY_NOT_DECLARED
    http: 422
    condition: "EMERGENCY_REMOVAL work-order create without an ACTIVE StormEvent covering the tree's zone at the current clock"
  - id: ERR_DIG_TICKET_INVALID
    http: 409
    condition: "Work-order start without a VALID dig ticket whose window contains the clock"
  - id: ERR_DIG_WINDOW_INVALID
    http: 422
    condition: "Dig ticket create with valid_to <= valid_from"
  - id: ERR_CONTRACTOR_DOUBLE_BOOKED
    http: 409
    condition: "Work order overlaps an existing CREATED/IN_PROGRESS work order for the same contractor (half-open intervals)"
  - id: ERR_CONTRACTOR_LICENSE_EXPIRED
    http: 422
    condition: "Assigned contractor is SUSPENDED at create, or license expired at work-order start"
  - id: ERR_STORM_OVERLAP
    http: 409
    condition: "Storm event overlaps an existing ACTIVE storm event on the same zone (closed intervals)"
  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "pay-fee amount_cents != permit.mitigation_fee_cents"
  - id: ERR_FEE_UNPAID
    http: 402
    condition: "Permit issue attempted while fee_paid == false"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ForestryAdmin
    description: "Municipal forestry administrator: reference data, storm declarations, 811 clearance, permit revocation, inspection disputes, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /forestry/zones"
      - "POST /forestry/species"
      - "POST /forestry/contractors"
      - "POST /forestry/storm-events"
      - "POST /forestry/storm-events/{id}/close"
      - "POST /forestry/dig-tickets/{id}/mark-valid"
      - "POST /forestry/permits/{id}/revoke"
      - "POST /forestry/inspections/{id}/dispute"
      - "POST /forestry/_clock/set_current_utc"
    shared_operations: ["all GET reads"]
  - name: ForestryStaff
    description: "Field operations staff: tree inventory, work-order scheduling, replacement planting"
    identity: "opaque"
    exclusive_operations:
      - "POST /forestry/trees"
      - "POST /forestry/work-orders"
      - "POST /forestry/work-orders/{id}/abort"
      - "POST /forestry/replacement-plantings/{id}/plant"
    shared_operations: ["all GET reads"]
  - name: Arborist
    description: "City arborist / reviewing officer: permit review, issuance"
    identity: "opaque"
    exclusive_operations:
      - "POST /forestry/permits/{id}/review"
      - "POST /forestry/permits/{id}/issue"
    shared_operations: ["all GET reads"]
  - name: Inspector
    description: "Certified inspector: condition inspections, risk finalization, replacement establishment"
    identity: "opaque"
    exclusive_operations:
      - "POST /forestry/trees/{id}/inspections"
      - "POST /forestry/inspections/{id}/finalize"
      - "POST /forestry/replacement-plantings/{id}/establish"
    shared_operations: ["all GET reads"]
  - name: Applicant
    description: "Member of the public / owner filing a tree permit; owns the permits they create"
    identity: "opaque"
    exclusive_operations:
      - "POST /forestry/permits"
      - "POST /forestry/permits/{id}/submit"
      - "POST /forestry/permits/{id}/provide-info"
      - "POST /forestry/permits/{id}/pay-fee"
    shared_operations: ["all GET reads"]
    note: "Ownership enforced by comparing X-User-ID to permit.requested_by_user_id (an opaque id stored on the permit, not an entity id)."
  - name: Contractor
    description: "Licensed tree-service contractor; acts only on work orders assigned to their own Contractor id"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /forestry/work-orders/{id}/start"
      - "POST /forestry/work-orders/{id}/complete"
      - "POST /forestry/work-orders/{id}/dig-tickets"
    shared_operations: ["all GET reads"]
    note: "X-User-ID for a Contractor call equals a Contractor.id; ownership check compares it to work_order.contractor_id."
