scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: postage_provisional_vs_final_diverge_on_household_collapse
        grounds:
          - calculations.postage_estimate
          - calculations.presort_tier_selection
          - calculations.dedupe_screen
          - entities.MailJob.fields.provisional_postage_cents
          - entities.MailJob.fields.final_postage_cents
        distinguishing_aspect: |
          Entity domain MailJob: PROVISIONAL counts every CASS-mailable record and quotes 243 cents,
          while FINAL drops the household duplicate, falls from PRESORT_MIXED_AADC to NO_PRESORT and
          charges 307 cents — fewer pieces at a strictly higher total on identical source data.
        test_recipe:
          setup:
            - "One account with a 500000-cent permit balance and one campaign in DRAFT/CLEAR/OPEN."
            - "A seven-record mailing list: six DPV 'Y' records (two of which share the household key Smith|100 Main St|60601) and one DPV 'D' record."
            - "The list has been CASS-run, deduped in HOUSEHOLD mode and locked, so automation_count is 5, retail_count is 1 and duplicate_count is 1."
            - "One ADDRESSED MARKETING_MAIL job on that list with an approved, live proof."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-100" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/accounts/${acct_id}/postage-topups"
              payload: { amount_cents: 500000, reason: "seed escrow" }
              as: PlatformAdmin
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly", character_count: 400 }
              as: CampaignManager
              captures: { tpl_id: $.data.id, tpl_v: $.data.version }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Spring List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "John", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_john_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Jane", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_jane_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Carl", last_name: "Lee", address_line1: "300 Pine Rd", city: "Chicago", state_code: "IL", zip5: "60603", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Dana", last_name: "Fox", address_line1: "400 Elm St", city: "Chicago", state_code: "IL", zip5: "60604", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Eve", last_name: "Ray", address_line1: "500 Ash Ln", city: "Chicago", state_code: "IL", zip5: "60605", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Frank", last_name: "Ash", address_line1: "600 Bay Dr", city: "Chicago", state_code: "IL", zip5: "60606", dpv_confirmation_code: "D" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "HOUSEHOLD" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}", target_in_home_date: "2026-06-15" }
              as: CampaignManager
              captures: { job_id: $.data.id }
            - call: "POST /mail/proofs"
              payload: { mail_job_id: "${job_id}", template_id: "${tpl_id}" }
              as: CampaignManager
              captures: { proof_id: $.data.id }
            - call: "POST /mail/proofs/${proof_id}/submit"
              payload: {}
              as: CampaignManager
              as_user_id: "cm-1"
            - call: "POST /mail/proofs/${proof_id}/approve"
              payload: { expected_template_version: "${tpl_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /mail/mail-jobs/${job_id}/estimate"
              payload: {}
              as: CampaignManager
              captures: { prov_cents: $.data.provisional_postage_cents }
            - call: "POST /mail/mail-jobs/${job_id}/schedule"
              payload: { target_in_home_date: "2026-06-15" }
              as: CampaignManager
            - call: "POST /mail/mail-jobs/${job_id}/commit"
              payload: {}
              as: CampaignManager
              captures: { final_cents: $.data.final_postage_cents }
          assert:
            - "MailJob.${job_id}.provisional_postage_cents == 243"
            - "MailJob.${job_id}.final_postage_cents == 307"
            - "MailJob.${job_id}.automation_piece_count == 5"
            - "MailJob.${job_id}.retail_piece_count == 1"
            - "MailJob.${job_id}.presort_tier == NO_PRESORT"
            - "MailJob.${job_id}.final_postage_cents > MailJob.${job_id}.provisional_postage_cents"

      - name: production_capacity_single_pass_vs_split_run_slot_minutes
        grounds:
          - calculations.production_capacity_plan
          - entities.ProductionRun.fields.planned_slot_minutes
          - entities.ProductionRun.fields.capacity_variant
          - validations[priority=39]
        distinguishing_aspect: |
          Entity domain ProductionRun (not MailJob): the identical 1-piece, 400-character run costs
          13 slot-minutes under SINGLE_PASS and 25 under SPLIT_RUN, so on a machine whose
          daily_capacity_minutes is 20 the variant alone decides success versus
          ERR_MACHINE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "A committed ADDRESSED MARKETING_MAIL job with billable_piece_count 1."
            - "Two machines: SLOT-BIG with daily_capacity_minutes 480 and SLOT-TIGHT with daily_capacity_minutes 20."
            - "One OPEN-able INK_BLUE_A lot of 20000 microlitres."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-101" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/accounts/${acct_id}/postage-topups"
              payload: { amount_cents: 500000, reason: "seed escrow" }
              as: PlatformAdmin
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
            - call: "POST /mail/machines"
              payload: { machine_code: "SLOT-BIG", daily_capacity_minutes: 480 }
              as: ProductionOperator
              captures: { mach_big_id: $.data.id }
            - call: "POST /mail/machines"
              payload: { machine_code: "SLOT-TIGHT", daily_capacity_minutes: 20 }
              as: ProductionOperator
              captures: { mach_tight_id: $.data.id }
            - call: "POST /mail/ink-lots"
              payload: { lot_code: "LOT-A", ink_type: "INK_BLUE_A", initial_volume_ul: 20000 }
              as: ProductionOperator
              captures: { lot_id: $.data.id }
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly", character_count: 400 }
              as: CampaignManager
              captures: { tpl_id: $.data.id, tpl_v: $.data.version }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Mini List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_bob_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}", target_in_home_date: "2026-06-15" }
              as: CampaignManager
              captures: { job_id: $.data.id }
            - call: "POST /mail/proofs"
              payload: { mail_job_id: "${job_id}", template_id: "${tpl_id}" }
              as: CampaignManager
              captures: { proof_id: $.data.id }
            - call: "POST /mail/proofs/${proof_id}/submit"
              payload: {}
              as: CampaignManager
              as_user_id: "cm-1"
            - call: "POST /mail/proofs/${proof_id}/approve"
              payload: { expected_template_version: "${tpl_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /mail/mail-jobs/${job_id}/schedule"
              payload: { target_in_home_date: "2026-06-15" }
              as: CampaignManager
            - call: "POST /mail/mail-jobs/${job_id}/commit"
              payload: {}
              as: CampaignManager
              captures: { job_v: $.data.version }
          trigger:
            - call: "POST /mail/mail-jobs/${job_id}/production-runs"
              payload: { machine_id: "${mach_big_id}", ink_lot_id: "${lot_id}", run_date: "2026-06-05", piece_count: 1, capacity_variant: "SINGLE_PASS", expected_mail_job_version: "${job_v}" }
              as: ProductionOperator
              captures: { run_single_id: $.data.id, run_single_minutes: $.data.planned_slot_minutes }
            - call: "GET /mail/mail-jobs/${job_id}"
              payload: {}
              as: ProductionOperator
              captures: { job_v2: $.data.version }
            - call: "POST /mail/production-runs/${run_single_id}/void"
              payload: { reason: "re-plan as split run" }
              as: ProductionOperator
            - call: "GET /mail/mail-jobs/${job_id}"
              payload: {}
              as: ProductionOperator
              captures: { job_v3: $.data.version }
            - call: "POST /mail/mail-jobs/${job_id}/production-runs"
              payload: { machine_id: "${mach_big_id}", ink_lot_id: "${lot_id}", run_date: "2026-06-05", piece_count: 1, capacity_variant: "SPLIT_RUN", expected_mail_job_version: "${job_v3}" }
              as: ProductionOperator
              captures: { run_split_id: $.data.id, run_split_minutes: $.data.planned_slot_minutes }
          assert:
            - "ProductionRun.${run_single_id}.planned_slot_minutes == 13"
            - "ProductionRun.${run_single_id}.planned_write_minutes == 1"
            - "ProductionRun.${run_split_id}.planned_slot_minutes == 25"
            - "ProductionRun.${run_split_id}.planned_ink_ul == 2"
            - "ProductionRun.${run_single_id}.planned_ink_ul == ProductionRun.${run_split_id}.planned_ink_ul"

      - name: dedupe_exact_vs_household_mailable_counts
        grounds:
          - calculations.dedupe_screen
          - state_machines.ListRecord.dedupe_status.UNSCREENED_to_DUP_HOUSEHOLD
          - entities.MailingList.fields.mailable_count
          - entities.MailingList.fields.duplicate_count
        distinguishing_aspect: |
          Entity domain MailingList (not MailJob, not ProductionRun): the same seven records yield
          mailable_count 7 / duplicate_count 0 under EXACT and mailable_count 6 / duplicate_count 1
          under HOUSEHOLD, because Jane Smith shares John Smith's household_key but not his exact_key.
        test_recipe:
          setup:
            - "A seven-record list, CASS-run, with the Smith pair sharing address 100 Main St and zip 60601."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-102" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Spring List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "John", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_john_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Jane", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_jane_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Carl", last_name: "Lee", address_line1: "300 Pine Rd", city: "Chicago", state_code: "IL", zip5: "60603", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Dana", last_name: "Fox", address_line1: "400 Elm St", city: "Chicago", state_code: "IL", zip5: "60604", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Eve", last_name: "Ray", address_line1: "500 Ash Ln", city: "Chicago", state_code: "IL", zip5: "60605", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Frank", last_name: "Ash", address_line1: "600 Bay Dr", city: "Chicago", state_code: "IL", zip5: "60606", dpv_confirmation_code: "D" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
          trigger:
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
              captures: { exact_mailable: $.data.mailable_count }
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "HOUSEHOLD" }
              as: ListOperator
              captures: { hh_mailable: $.data.mailable_count }
          assert:
            - "MailingList.${list_id}.mailable_count == 6"
            - "MailingList.${list_id}.duplicate_count == 1"
            - "MailingList.${list_id}.automation_count == 5"
            - "MailingList.${list_id}.retail_count == 1"
            - "MailingList.${list_id}.dedupe_mode == HOUSEHOLD"
            - "ListRecord.${rec_john_id}.dedupe_status == HOUSEHOLD_HEAD"
            - "ListRecord.${rec_jane_id}.dedupe_status == DUP_HOUSEHOLD"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: marketing_postage_round_per_tier_then_sum
        grounds:
          - calculations.postage_estimate
          - calculations.presort_tier_selection
          - entities.MailJob.fields.provisional_postage_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: 6 automation pieces at 31.8 cents (190.8) and 1 retail piece at
          51.6 cents (51.6) round per tier to 191 + 52 = 243, whereas summing first and rounding once
          gives 242 — the scaffold pins round-per-tier-then-sum, so 243 is the only correct answer.
        test_recipe:
          setup:
            - "A seven-record list CASS-run and deduped in EXACT mode, so all seven records survive: six AUTOMATION and one RETAIL."
            - "One ADDRESSED MARKETING_MAIL job on the locked list, still in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-103" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly", character_count: 400 }
              as: CampaignManager
              captures: { tpl_id: $.data.id }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Spring List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "John", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Jane", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Carl", last_name: "Lee", address_line1: "300 Pine Rd", city: "Chicago", state_code: "IL", zip5: "60603", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Dana", last_name: "Fox", address_line1: "400 Elm St", city: "Chicago", state_code: "IL", zip5: "60604", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Eve", last_name: "Ray", address_line1: "500 Ash Ln", city: "Chicago", state_code: "IL", zip5: "60605", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Frank", last_name: "Ash", address_line1: "600 Bay Dr", city: "Chicago", state_code: "IL", zip5: "60606", dpv_confirmation_code: "D" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}", target_in_home_date: "2026-06-15" }
              as: CampaignManager
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /mail/mail-jobs/${job_id}/estimate"
              payload: {}
              as: CampaignManager
              captures: { prov_cents: $.data.provisional_postage_cents }
          assert:
            - "MailJob.${job_id}.provisional_postage_cents == 243"
            - "MailJob.${job_id}.provisional_postage_cents != 242"
            - "MailJob.${job_id}.presort_tier == PRESORT_MIXED_AADC"
            - "MailJob.${job_id}.automation_piece_count == 6"
            - "MailJob.${job_id}.retail_piece_count == 1"
            - "MailJob.${job_id}.billable_piece_count == 7"

      - name: commit_settlement_pinned_evaluation_order
        grounds:
          - calculations.commit_settlement
          - entities.MailJob.fields.handling_fee_cents
          - entities.MailJob.fields.volume_credit_cents
          - entities.MailJob.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the volume credit is 5% of a subtotal that already
          contains a handling fee derived from postage, so the evaluation order is pinned —
          307 postage gives handling 275, subtotal 582, credit 29 and total_due 553; recomputing the
          credit against total_due would loop and produce a different number.
        test_recipe:
          setup:
            - "The seven-record list deduped in HOUSEHOLD mode and locked, giving a FINAL postage of 307 cents over 6 billable pieces."
            - "An approved live proof on the ADDRESSED MARKETING_MAIL job, which has been scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-104" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/accounts/${acct_id}/postage-topups"
              payload: { amount_cents: 500000, reason: "seed escrow" }
