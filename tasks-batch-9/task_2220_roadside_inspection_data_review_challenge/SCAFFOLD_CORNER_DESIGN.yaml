      - name: oos_violation_removal_without_adjudication_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 10]
          - errors.ERR_OOS_REMOVAL_REQUIRES_ADJUDICATION
          - state_machines.DataChallenge.UNDER_REVIEW_to_RESOLVED_ACCEPTED
        distinguishing_aspect: |
          Acceptance of a VIOLATION_NOT_SUPPORTED challenge is gated on a different entity: while the
          out-of-service violation carries no non-superseded adjudication with DISMISSED or NOT_GUILTY
          the review is refused, and the identical review call succeeds once such an adjudication
          exists — the same request, two outcomes, decided by the adjudication row.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM); code 396.3A1 (VEHICLE_MAINTENANCE weight 4, oos_add_on 2); VEHICLE_MAINTENANCE/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "SCORED report r1 of c1 with one out_of_service violation v1 (weight 4 + oos 2, time_weight 3 -> tws 18.0)."
            - "Challenge ch (VIOLATION_NOT_SUPPORTED on v1) with one COURT_DOCUMENT evidence row, SUBMITTED then UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /violation-codes"
              payload: { code: "396.3A1", description: "Brakes out of adjustment", basic_category: "VEHICLE_MAINTENANCE", severity_weight: 4, oos_add_on: 2 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { vc_vm4_id: $.data.id }
