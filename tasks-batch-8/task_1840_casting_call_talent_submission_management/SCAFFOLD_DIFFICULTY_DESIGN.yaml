  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (two DIFFERENT interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_overlap_onesided_buffer_semantics
        grounds:
          - calculations.appointment_overlap_conflict
          - validations[priority=11]
          - errors[ERR_TALENT_CONFLICT]
        distinguishing_aspect: |
          Interval semantic A: half-open intervals with a ONE-SIDED buffer
          applied only to the NEW appointment's tail (slot_end + buffer). An
          existing CONFIRMED appointment 09:00-09:30 conflicts with a new
          09:20-09:50 (buffer 15) because 09:00 < 09:50+15min and 09:20 < 09:30;
          but a new appointment starting exactly at the existing slot_end
          (adjacency) does NOT conflict. Resource = the talent's appointment
          diary.
        test_recipe:
          setup:
            - "Talent T with one CONFIRMED appointment 09:00-09:30; a second PROPOSED appointment for T at 09:20-09:50 buffer 15 (overlapping) and a third at 09:30-10:00 (adjacent)"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "OP", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/roles"
              payload: { character_name: "OR", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-20T00:00:00Z", engagement_end: "2026-08-22T00:00:00Z" }
              as: CastingDirector
              captures: { role_id: $.data.id }
            - call: "POST /casting/productions/${prod_id}/breakdowns"
              payload: { role_id: "${role_id}", distribution: "OPEN_CALL", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { br_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/release"
              payload: { distribution: "OPEN_CALL" }
              as: CastingDirector
              captures: { br_v: $.data.version }
            - call: "POST /casting/talents"
              payload: { full_name: "OT", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tal_id: $.data.id }
            - call: "POST /casting/breakdowns/${br_id}/submissions"
              payload: { talent_id: "${tal_id}", expected_breakdown_version: "${br_v}" }
              as: CastingAssociate
              captures: { sub_id: $.data.id }
            - call: "POST /casting/submissions/${sub_id}/start-review"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/submissions/${sub_id}/shortlist"
              payload: {}
              as: CastingAssociate
            - call: "POST /casting/breakdowns/${br_id}/sessions"
              payload: { session_start: "2026-08-04T09:00:00Z", session_end: "2026-08-04T12:00:00Z", capacity: 10, location: "S1" }
              as: CastingAssociate
              captures: { sess_id: $.data.id }
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:00:00Z", slot_end: "2026-08-04T09:30:00Z" }
              as: CastingAssociate
              captures: { a1: $.data.id }
            - call: "POST /casting/appointments/${a1}/confirm"
              payload: {}
              as: CastingAssociate
            # overlapping appointment (09:20-09:50, buffer 15)
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:20:00Z", slot_end: "2026-08-04T09:50:00Z", buffer_minutes: 15 }
              as: CastingAssociate
              captures: { a2: $.data.id }
            # adjacent appointment (starts exactly at a1.slot_end)
            - call: "POST /casting/sessions/${sess_id}/appointments"
              payload: { submission_id: "${sub_id}", slot_start: "2026-08-04T09:30:00Z", slot_end: "2026-08-04T10:00:00Z" }
              as: CastingAssociate
              captures: { a3: $.data.id }
          trigger:
            # overlapping confirm should fail
            - call: "POST /casting/appointments/${a2}/confirm"
              payload: {}
              as: CastingAssociate
              captures: { err_overlap: $.data.error_id }
            # adjacent confirm should succeed (adjacency is not a conflict)
            - call: "POST /casting/appointments/${a3}/confirm"
              payload: {}
              as: CastingAssociate
              captures: { adj_status: $.data.status }
          assert:
            - "err_overlap == ERR_TALENT_CONFLICT (09:20-09:50 overlaps CONFIRMED 09:00-09:30 under one-sided buffer semantics)"
            - "adj_status == CONFIRMED (adjacent 09:30-10:00 does NOT conflict — half-open boundary, a1.slot_end == a3.slot_start)"

      - name: engagement_overlap_closed_interval_booking_semantics
        grounds:
          - validations[priority=23]
          - state_machines.Booking.PENDING_to_CONFIRMED
          - errors[ERR_ENGAGEMENT_OVERLAP]
        distinguishing_aspect: |
          Different interval semantic on a different resource: engagement-window
          overlap between two Bookings of the same talent uses CLOSED
          day-intervals (A.start <= B.end AND B.start <= A.end) with NO buffer
          and NO capacity concept, so a shared boundary day counts as overlap.
          A second engagement 08-12..08-14 collides with a CONFIRMED
          08-10..08-12 because both include the date 08-12. Differs from
          appointment semantics (half-open + one-sided buffer, minute
