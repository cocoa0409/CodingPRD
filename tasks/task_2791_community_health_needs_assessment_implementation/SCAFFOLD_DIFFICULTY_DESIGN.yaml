              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
          trigger:
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T15:00:00Z", ends_at: "2026-04-06T16:00:00Z" }
