    side_effects: []
  - method: GET
    path: "/cpap-resupply-orders"
    description: "List CPAP resupply orders; filter by order_id (FK reverse-reachability)"
    roles: [SupplierUser, PayerReviewer]
    code: 200
    input: ["order_id?", "supply_kind?", "status?", "limit?", "offset?"]
