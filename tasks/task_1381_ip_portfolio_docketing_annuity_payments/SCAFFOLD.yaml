# =============================================================================
# Task 1381: IP Portfolio Docketing & Annuity Payments — benchmark seed tables
# Patent firm docketing department. Difficulty: beyond-expert (max tier).
# =============================================================================

scenario: |
  IP Portfolio Docketing & Annuity Payments (patent firm docketing department):
  docket calendar for office actions/responses & statutory deadlines,
  annuity/maintenance fee schedule by jurisdiction & payment authorization,
  abandonment decision review & portfolio pruning, foreign filing deadline
  (Paris/PCT) tracking, inventor & assignment recordation, docket audit against
  official registers, outside counsel instruction & confirmation, budget
  forecast by family

domain_name: ip-portfolio-docketing
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  difficulty_tier: expert_plus
  tier_note: "Deliberately pushed past the Expert band ceiling on every axis per user directive: 15 entities, 8 state machines, 11 calculations, 24 validation rows, 50 endpoints, 30 error codes, 6 roles."
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid   # tree (Client>Family>Application>children) + config + peer (CounselFirm) + self-referential Application chain
  state_machine_shape: cyclic   # multiple machines with revision/re-instruction loops; posture gating on Client/Family
  relationship_patterns:
    - one_to_many
    - self_referential        # Application.parent_application_id continuation chain (cycle-checked)
    - cross_aggregate         # Instruction -> CounselFirm; AssignmentRecord -> Inventor[]
  role_model: segregation_of_duties   # approver != submitter; executor != recorder
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: JurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction, type: enum, source: input, description: "Jurisdiction code", constraints: "one of US | EP | JP | CN | KR | PCT; unique across JurisdictionRule" }
      - { name: oa_response_months, type: integer, source: input, description: "Statutory office-action response period in months" }
      - { name: max_extensions, type: integer, source: input, description: "Maximum extensions of time per office-action-response docket entry" }
      - { name: extension_months, type: integer, source: input, description: "Months added to current_due_date per extension" }
      - { name: extension_fee_cents, type: integer, source: input, description: "Official fee per extension, charged per request in local-currency cents" }
      - { name: annuity_start_year, type: integer, source: input, description: "First period_year that carries an annuity obligation" }
      - { name: term_years, type: integer, source: input, description: "Last period_year that carries an annuity obligation (statutory term)" }
      - { name: surcharge_window_months, type: integer, source: input, description: "Months after due_date during which payment with surcharge is still accepted" }
      - { name: surcharge_bps_month_1, type: integer, source: input, description: "Surcharge in basis points of base fee when months_late == 1" }
      - { name: surcharge_bps_late, type: integer, source: input, description: "Surcharge in basis points of base fee when months_late >= 2" }
      - { name: small_entity_multiplier_bps, type: integer, source: input, description: "Fee multiplier in basis points applied when application entity_size == SMALL" }
      - { name: fee_tier_bounds, type: string, source: input, description: "Pipe-separated period_year ranges for tiers 1..4, e.g. '1-3|4-7|8-12|13-20'" }
      - { name: fee_tier_1_cents, type: integer, source: input, description: "Base annuity fee (local currency cents) for tier 1 period years" }
      - { name: fee_tier_2_cents, type: integer, source: input, description: "Base annuity fee for tier 2" }
      - { name: fee_tier_3_cents, type: integer, source: input, description: "Base annuity fee for tier 3" }
      - { name: fee_tier_4_cents, type: integer, source: input, description: "Base annuity fee for tier 4" }
      - { name: paris_window_months, type: integer, source: input, description: "Paris Convention priority window in months" }
      - { name: pct_window_months, type: integer, source: input, description: "PCT national-phase window in months from priority date" }
      - { name: fx_to_usd_cents_bps, type: integer, source: input, description: "Exchange rate: USD cents per 10000 units of local-currency-cent basis weight; converted = round_half_up(local_cents * fx_to_usd_cents_bps / 10000)" }
      - { name: requires_recorded_assignment_for_grant, type: boolean, source: input, default: false, description: "Whether a RECORDED AssignmentRecord is a precondition to grant" }
      - { name: requires_recorded_assignment_for_payment, type: boolean, source: input, default: false, description: "Whether a RECORDED AssignmentRecord is a precondition to instruct-payment" }
      - { name: requires_confirmed_instruction_for_payment, type: boolean, source: input, default: false, description: "Whether a CONFIRMED ANNUITY_PAYMENT OutsideCounselInstruction is a precondition to instruct-payment" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Client display name" }
      - { name: default_currency, type: string, source: input, default: "USD", description: "Reporting currency; only USD supported by calculations" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "initial ACTIVE" }

  - name: ClientContact
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client (path-bound)" }
      - { name: full_name, type: string, source: input, description: "Contact full name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: CounselFirm
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Outside counsel firm name" }
      - { name: accredited_jurisdictions, type: array, source: input, description: "Array of jurisdiction codes the firm is accredited for" }

  - name: Inventor
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client (path-bound)" }
      - { name: full_name, type: string, source: input, description: "Inventor full name" }
      - { name: email, type: string, source: input, description: "Inventor email" }

  - name: PatentFamily
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client (path-bound)" }
      - { name: title, type: string, source: input, description: "Family title" }
      - { name: first_priority_date, type: string, source: input, description: "Earliest priority date (YYYY-MM-DD) anchoring Paris/PCT windows" }
      - { name: budget_cap_cents, type: integer, source: input, description: "Hard cap on committed annuity spend for the family, USD cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PRUNING_REVIEW | CLOSED", constraints: "initial ACTIVE" }
      - { name: committed_forecast_cents, type: integer, source: computed, description: "USD cents committed across all family applications' annuities: sum(authorized_amount_cents for obligations in AUTHORIZED, PAYMENT_INSTRUCTED, CONFIRMATION_QUERY) + sum(paid_amount_cents for PAID_CONFIRMED); maintained on every obligation transition (derived field reconciliation)" }

  - name: Application
    parent: PatentFamily
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> PatentFamily.id; owning family (path-bound)" }
      - { name: jurisdiction, type: enum, source: input, description: "Jurisdiction code; must have a JurisdictionRule", constraints: "one of US | EP | JP | CN | KR | PCT" }
      - { name: application_type, type: enum, source: input, description: "Filing type", constraints: "one of ORIGINAL | PARIS_CONVENTION | PCT_INTERNATIONAL | PCT_NATIONAL_PHASE | CONTINUATION | DIVISIONAL" }
      - { name: filing_date, type: string, source: input, description: "Filing date YYYY-MM-DD" }
      - { name: application_number, type: string, source: input, description: "Application number; unique per family among non-WITHDRAWN applications" }
      - { name: entity_size, type: enum, source: input, description: "Fee entity size", constraints: "one of LARGE | SMALL" }
      - { name: parent_application_id, type: string, source: input, description: "FK -> Application.id; parent for CONTINUATION | DIVISIONAL | PCT_NATIONAL_PHASE types (self-referential, cycle-checked); omit otherwise" , constraints: "optional" }
      - { name: grant_date, type: string, source: system, description: "Grant date YYYY-MM-DD, set by /grant transition" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING | GRANTED | ABANDONED | LAPSED | WITHDRAWN", constraints: "initial DRAFT" }
      - { name: open_docket_count, type: integer, source: computed, description: "Count of DocketEntry under this application in status PENDING or IN_PROGRESS; maintained on entry create/complete/cancel/lapse" }

  - name: DocketEntry
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; owning application (path-bound)" }
      - { name: entry_type, type: enum, source: input, description: "Deadline type", constraints: "one of OFFICE_ACTION_RESPONSE | STATUTORY | PARIS_PRIORITY | PCT_PHASE | ANNUITY | RECORDATION" }
      - { name: title, type: string, source: input, description: "Entry title" }
      - { name: base_due_date, type: string, source: input, description: "Original due date YYYY-MM-DD" }
      - { name: extension_count, type: integer, source: computed, description: "Number of granted extensions; starts 0" }
      - { name: extension_fees_total_cents, type: integer, source: computed, description: "Sum of extension fees charged, local currency cents; starts 0" }
      - { name: current_due_date, type: string, source: computed, description: "= base_due_date shifted by extension_count * rule.extension_months; reset to new base on record-rejection" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | RESPONSE_FILED | COMPLETED | CANCELLED | LAPSED", constraints: "initial PENDING" }

  - name: OfficeAction
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; owning application (path-bound)" }
      - { name: action_type, type: enum, source: input, description: "Office action type", constraints: "one of NON_FINAL_REJECTION | FINAL_REJECTION | NOTICE_OF_ALLOWANCE | INFORMATIONAL" }
      - { name: mail_date, type: string, source: input, description: "Office action mail date YYYY-MM-DD" }
      - { name: docket_entry_id, type: string, source: system, description: "FK -> DocketEntry.id; response-tracking entry auto-created for NON_FINAL_REJECTION | FINAL_REJECTION (null otherwise)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_RESPONSE | CLOSED", constraints: "initial RECEIVED" }

  - name: AnnuityObligation
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; owning application (system-generated at grant)" }
      - { name: period_year, type: integer, source: computed, description: "Annuity period year (rule.annuity_start_year .. rule.term_years)" }
      - { name: due_date, type: string, source: computed, description: "= add_months(application.grant_date, period_year * 12 - 6)" }
      - { name: surcharge_window_end, type: string, source: computed, description: "= add_months(due_date, rule.surcharge_window_months)" }
      - { name: base_fee_local_cents, type: integer, source: computed, description: "Tiered base fee in local currency cents per annuity_fee_amount (on-time, entity_size applied)" }
      - { name: estimated_amount_usd_cents, type: integer, source: computed, description: "= round_half_up(base_fee_local_cents * rule.fx_to_usd_cents_bps / 10000); per-line rounded" }
      - { name: authorized_amount_cents, type: integer, source: system, description: "USD cents authorized by the current approved PaymentAuthorization; null unless AUTHORIZED or beyond" }
      - { name: paid_amount_cents, type: integer, source: system, description: "USD cents actually confirmed at confirm-payment (includes surcharge); null unless PAID_CONFIRMED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PENDING_AUTHORIZATION | AUTHORIZED | PAYMENT_INSTRUCTED | CONFIRMATION_QUERY | PAID_CONFIRMED | LAPSED | CANCELLED", constraints: "initial SCHEDULED" }

  - name: PaymentAuthorization
    parent: AnnuityObligation
    common_fields: true
    fields:
      - { name: annuity_obligation_id, type: string, source: system, description: "FK -> AnnuityObligation.id; obligation this authorization pays (path-bound)" }
      - { name: amount_cents, type: integer, source: input, description: "USD cents requested for authorization" }
      - { name: requested_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the staff creator" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ClientApprover who approved/rejected; null until decided" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | RELEASED | REJECTED | SUPERSEDED", constraints: "initial REQUESTED" }

  - name: OutsideCounselInstruction
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; owning application (path-bound)" }
      - { name: counsel_firm_id, type: string, source: input, description: "FK -> CounselFirm.id; instructed firm (must be accredited for the application jurisdiction)" }
      - { name: docket_entry_id, type: string, source: input, description: "FK -> DocketEntry.id; optional linked docket entry the instruction services", constraints: "optional" }
      - { name: instruction_type, type: enum, source: input, description: "Instruction type", constraints: "one of FILING | OA_RESPONSE | ANNUITY_PAYMENT | RECORDATION" }
      - { name: due_date, type: string, source: input, description: "Instruction due date YYYY-MM-DD; with created date forms the closed exclusivity window" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACKNOWLEDGED | CONFIRMED | COMPLETED | DECLINED | CANCELLED", constraints: "initial DRAFT" }

  - name: AbandonmentReview
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; application under pruning review (path-bound)" }
      - { name: rationale, type: string, source: input, description: "Business rationale for abandonment" }
      - { name: estimated_savings_usd_cents, type: integer, source: computed, description: "Net pruning savings at creation per pruning_savings_estimate (gross future SCHEDULED annuity estimates minus PRUNE_ADMIN_FEE_CENTS)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID recorded at submit; segregation-of-duties anchor" }
      - { name: status, type: enum, source: system, description: "PROPOSED | UNDER_REVIEW | APPROVED | REJECTED | EXECUTED", constraints: "initial PROPOSED" }

  - name: AssignmentRecord
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; owning application (path-bound)" }
      - { name: assignee_name, type: string, source: input, description: "Assignee legal name" }
      - { name: inventor_ids, type: array, source: input, description: "FK -> Inventor.id; array element-wise: each element must reference an existing Inventor of the same client" }
      - { name: execution_date, type: string, source: input, description: "Assignment execution date YYYY-MM-DD" }
      - { name: executed_by_user_id, type: string, source: system, description: "Opaque X-User-ID recorded at execute; segregation-of-duties anchor" }
      - { name: register_recordation_number, type: string, source: system, description: "Official register recordation number set at record" }
      - { name: status, type: enum, source: system, description: "DRAFT | EXECUTED | RECORDATION_REJECTED | RECORDED", constraints: "initial DRAFT" }

  - name: DocketAudit
    parent: Application
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; audited application (path-bound)" }
      - { name: window_start, type: string, source: input, description: "Audit window start date YYYY-MM-DD (inclusive) — half-open interval [window_start, window_end)" }
      - { name: window_end, type: string, source: input, description: "Audit window end date YYYY-MM-DD (exclusive)" }
      - { name: register_entries, type: array, source: input, description: "Official register snapshot: array of { entry_type, due_date }" }
      - { name: variances, type: array, source: computed, description: "Variance list computed at creation per docket_audit_variance: elements { kind, entry_type, internal_due_date?, register_due_date? } with kind in MISSING_INTERNAL | MISSING_REGISTER | DATE_MISMATCH" }
      - { name: resolution_note, type: string, source: system, description: "Resolution note set at resolve" }
      - { name: status, type: enum, source: system, description: "OPEN | VARIANCE_FOUND | RESOLVED | CLOSED_CLEAN", constraints: "initial OPEN; auto-advances to VARIANCE_FOUND at creation when variances is non-empty" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{clientId}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "While SUSPENDED: creation of PatentFamily, Application, DocketEntry, OfficeAction, AnnuityObligation authorizations, OutsideCounselInstruction, AbandonmentReview, AssignmentRecord, DocketAudit under this client is rejected with ERR_CLIENT_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{clientId}/reactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: PatentFamily
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: PRUNING_REVIEW
        trigger: "POST /families/{familyId}/enter-pruning-review"
        actor: DocketingManager
        preconditions: []
        side_effects: []
      - from: PRUNING_REVIEW
        to: ACTIVE
        trigger: "POST /families/{familyId}/exit-pruning-review"
        actor: DocketingManager
        preconditions:
          - "No AbandonmentReview under any application of this family in status APPROVED (ERR_FAMILY_HAS_APPROVED_REVIEWS)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /families/{familyId}/close"
        actor: DocketingManager
        preconditions:
          - "Every Application of the family is in a terminal state (ABANDONED | LAPSED | WITHDRAWN) (ERR_FAMILY_HAS_OPEN_APPLICATIONS)"
        side_effects: []
      - from: PRUNING_REVIEW
        to: CLOSED
        trigger: "POST /families/{familyId}/close"
        actor: DocketingManager
        preconditions:
          - "Every Application of the family is in a terminal state (ERR_FAMILY_HAS_OPEN_APPLICATIONS)"
        side_effects: []

  - entity: Application
    initial_state: DRAFT
    terminal_states: [ABANDONED, LAPSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "POST /applications/{applicationId}/file"
        actor: DocketingClerk
        preconditions:
          - "Family status in {ACTIVE, PRUNING_REVIEW}"
          - "Client status == ACTIVE (ERR_CLIENT_SUSPENDED)"
        side_effects: []
      - from: PENDING
        to: GRANTED
        trigger: "POST /applications/{applicationId}/grant"
        actor: DocketingClerk
        preconditions:
          - "If rule.requires_recorded_assignment_for_grant: an AssignmentRecord of this application is RECORDED (ERR_ASSIGNMENT_RECORDATION_REQUIRED)"
        side_effects:
          - "grant_date set from request"
          - "Generate AnnuityObligation rows for period_year in rule.annuity_start_year..rule.term_years, each status SCHEDULED with due_date, surcharge_window_end, base_fee_local_cents, estimated_amount_usd_cents computed per annuity_fee_amount and annuity_due_schedule"
      - from: PENDING
        to: ABANDONED
        trigger: "system (cascade of AbandonmentReview execute)"
        actor: system
        preconditions: []
        side_effects:
          - "Every non-terminal DocketEntry of this application (PENDING | IN_PROGRESS | RESPONSE_FILED) -> CANCELLED; each cancellation decrements open_docket_count"
          - "Each DocketEntry cancellation cascades: any linked OutsideCounselInstruction in {DRAFT, SENT, ACKNOWLEDGED, CONFIRMED} -> CANCELLED, and any OfficeAction referencing the entry (RECEIVED or UNDER_RESPONSE) -> CLOSED"
          - "Every non-terminal AnnuityObligation of this application (SCHEDULED | PENDING_AUTHORIZATION | AUTHORIZED | PAYMENT_INSTRUCTED | CONFIRMATION_QUERY) -> CANCELLED; for AUTHORIZED/PAYMENT_INSTRUCTED/CONFIRMATION_QUERY, committed_forecast_cents of the family is decremented by authorized_amount_cents and the current PaymentAuthorization -> SUPERSEDED"
          - "Unlinked non-terminal OutsideCounselInstruction rows of this application -> CANCELLED"
      - from: GRANTED
        to: ABANDONED
        trigger: "system (cascade of AbandonmentReview execute)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade set as PENDING -> ABANDONED"
      - from: PENDING
        to: LAPSED
        trigger: "system (docket sweep: a STATUTORY DocketEntry of this application lapsed past current_due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Every non-terminal DocketEntry -> CANCELLED (open_docket_count decremented per entry)"
          - "Each entry cancellation cascades to linked non-terminal OutsideCounselInstruction -> CANCELLED and to a referencing OfficeAction (RECEIVED or UNDER_RESPONSE) -> CLOSED"
          - "Every non-terminal AnnuityObligation -> CANCELLED (none can be past SCHEDULED while PENDING, but rule applies uniformly)"
      - from: GRANTED
        to: LAPSED
        trigger: "POST /applications/{applicationId}/record-lapse OR system (docket sweep: an AnnuityObligation lapsed past surcharge_window_end)"
        actor: DocketingClerk | system
        preconditions: []
        side_effects:
          - "Every non-terminal AnnuityObligation -> CANCELLED; AUTHORIZED/PAYMENT_INSTRUCTED/CONFIRMATION_QUERY rows decrement family committed_forecast_cents by authorized_amount_cents and their current PaymentAuthorization -> SUPERSEDED"
          - "Every non-terminal DocketEntry -> CANCELLED with linked-instruction and office-action closure cascade"
          - "Unlinked non-terminal OutsideCounselInstruction rows -> CANCELLED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{applicationId}/withdraw"
        actor: DocketingClerk
        preconditions: []
        side_effects: []

  - entity: DocketEntry
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, LAPSED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /docket-entries/{entryId}/start"
        actor: DocketingClerk
        preconditions:
          - "Application.status in {PENDING, GRANTED} (ERR_APPLICATION_NOT_OPEN)"
        side_effects: []
      - from: PENDING
        to: PENDING
        trigger: "POST /docket-entries/{entryId}/request-extension"
        actor: DocketingClerk
        preconditions:
          - "entry_type == OFFICE_ACTION_RESPONSE (ERR_EXTENSION_NOT_ALLOWED_TYPE)"
          - "extension_count < rule.max_extensions (ERR_EXTENSION_LIMIT_REACHED; the request that would make extension_count == max_extensions is allowed, the next one fails)"
          - "current_due_date >= today (ERR_DEADLINE_PASSED)"
          - "Application.status in {PENDING, GRANTED} (ERR_APPLICATION_NOT_OPEN)"
        side_effects:
          - "extension_count += 1"
          - "current_due_date = add_months(base_due_date, extension_count * rule.extension_months)"
          - "extension_fees_total_cents += rule.extension_fee_cents"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /docket-entries/{entryId}/request-extension"
        actor: DocketingClerk
        preconditions:
          - "Same as PENDING -> PENDING extension"
        side_effects:
          - "Same as PENDING -> PENDING extension"
      - from: IN_PROGRESS
        to: RESPONSE_FILED
        trigger: "POST /docket-entries/{entryId}/record-response"
        actor: DocketingClerk
        preconditions:
          - "Application.status == PENDING (ERR_APPLICATION_NOT_OPEN)"
          - "response_filed_date <= current_due_date (ERR_DEADLINE_PASSED)"
        side_effects: []
      - from: RESPONSE_FILED
        to: IN_PROGRESS
        trigger: "POST /docket-entries/{entryId}/record-rejection"
        actor: DocketingClerk
        preconditions: []
        side_effects:
          - "base_due_date = new_base_due_date; current_due_date = new_base_due_date; extension_count resets to 0"
          - "Revision loop: the entry may cycle RESPONSE_FILED -> IN_PROGRESS repeatedly"
      - from: RESPONSE_FILED
        to: COMPLETED
        trigger: "POST /docket-entries/{entryId}/complete"
        actor: DocketingClerk
        preconditions: []
        side_effects:
          - "open_docket_count -= 1 on the parent Application"
          - "If an OfficeAction references this entry via docket_entry_id and is UNDER_RESPONSE: that OfficeAction -> CLOSED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /docket-entries/{entryId}/cancel"
        actor: DocketingManager
        preconditions:
          - "No linked OutsideCounselInstruction (docket_entry_id == this entry) in {DRAFT, SENT, ACKNOWLEDGED, CONFIRMED} (ERR_ENTRY_NOT_CANCELLABLE)"
        side_effects:
          - "open_docket_count -= 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /docket-entries/{entryId}/cancel"
        actor: DocketingManager
        preconditions:
          - "No linked non-terminal OutsideCounselInstruction (ERR_ENTRY_NOT_CANCELLABLE)"
        side_effects:
          - "open_docket_count -= 1"
      - from: PENDING
        to: LAPSED
        trigger: "system (docket sweep: today > current_due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "open_docket_count -= 1"
          - "If entry_type == STATUTORY: parent Application -> LAPSED (statutory lapse cascade)"
      - from: IN_PROGRESS
        to: LAPSED
        trigger: "system (docket sweep: today > current_due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "open_docket_count -= 1"
          - "If entry_type == STATUTORY: parent Application -> LAPSED"

  - entity: OfficeAction
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: UNDER_RESPONSE
        trigger: "system (auto when the linked DocketEntry PENDING -> IN_PROGRESS)"
        actor: system
        preconditions:
          - "action_type in {NON_FINAL_REJECTION, FINAL_REJECTION}"
        side_effects: []
      - from: RECEIVED
        to: CLOSED
        trigger: "POST /office-actions/{officeActionId}/close-informational"
        actor: DocketingClerk
        preconditions:
          - "action_type == INFORMATIONAL or NOTICE_OF_ALLOWANCE (ERR_INVALID_STATE otherwise)"
        side_effects: []
      - from: UNDER_RESPONSE
        to: CLOSED
        trigger: "system (auto when the linked DocketEntry RESPONSE_FILED -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AnnuityObligation
    initial_state: SCHEDULED
    terminal_states: [PAID_CONFIRMED, LAPSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PENDING_AUTHORIZATION
        trigger: "POST /annuity-obligations/{obligationId}/authorizations"
        actor: DocketingManager | FinanceOfficer
        preconditions:
          - "Client status == ACTIVE (ERR_CLIENT_SUSPENDED)"
          - "OCC: expected_annuity_obligation_version == obligation.version (ERR_STALE_VERSION)"
        note: "Application.status == GRANTED is implied and needs no separate gate: obligations are generated only at grant and are CANCELLED by the lapse/abandonment cascades, so a SCHEDULED obligation always sits under a GRANTED application"
        side_effects:
          - "Create PaymentAuthorization REQUESTED with requested_by_user_id = X-User-ID"
          - "increments AnnuityObligation.version by 1"
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "system (cascade of POST /authorizations/{authorizationId}/approve)"
        actor: system
        preconditions: []
        side_effects:
          - "authorized_amount_cents = authorization.amount_cents"
          - "Family.committed_forecast_cents += amount_cents"
      - from: PENDING_AUTHORIZATION
        to: SCHEDULED
        trigger: "system (cascade of POST /authorizations/{authorizationId}/reject)"
        actor: system
        preconditions: []
        side_effects:
          - "Obligation returns to SCHEDULED; authorization -> REJECTED (revision loop: a fresh authorization may be requested afterwards)"
      - from: AUTHORIZED
        to: SCHEDULED
        trigger: "POST /annuity-obligations/{obligationId}/deauthorize"
        actor: DocketingManager
        preconditions: []
        side_effects:
          - "Family.committed_forecast_cents -= authorized_amount_cents"
          - "authorized_amount_cents = null"
          - "Current PaymentAuthorization (APPROVED or RELEASED) -> SUPERSEDED"
      - from: AUTHORIZED
        to: PAYMENT_INSTRUCTED
        trigger: "POST /annuity-obligations/{obligationId}/instruct-payment"
        actor: FinanceOfficer
        preconditions:
          - "Current PaymentAuthorization status == RELEASED (ERR_AUTHORIZATION_NOT_RELEASED)"
          - "If rule.requires_recorded_assignment_for_payment: an AssignmentRecord of this application is RECORDED (ERR_ASSIGNMENT_RECORDATION_REQUIRED)"
          - "If rule.requires_confirmed_instruction_for_payment: an OutsideCounselInstruction of this application with instruction_type == ANNUITY_PAYMENT is CONFIRMED or COMPLETED (ERR_COUNSEL_INSTRUCTION_REQUIRED)"
        side_effects: []
      - from: PAYMENT_INSTRUCTED
        to: CONFIRMATION_QUERY
        trigger: "POST /annuity-obligations/{obligationId}/raise-confirmation-query"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: CONFIRMATION_QUERY
        to: PAYMENT_INSTRUCTED
        trigger: "POST /annuity-obligations/{obligationId}/reinstruct"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "Re-instruction loop: obligation may cycle PAYMENT_INSTRUCTED -> CONFIRMATION_QUERY -> PAYMENT_INSTRUCTED repeatedly"
      - from: PAYMENT_INSTRUCTED
        to: PAID_CONFIRMED
        trigger: "POST /annuity-obligations/{obligationId}/confirm-payment"
        actor: FinanceOfficer
        preconditions:
          - "paid_date <= surcharge_window_end (ERR_SURCHARGE_WINDOW_CLOSED)"
        side_effects:
          - "paid_amount_cents = annuity_fee_amount(base_fee_local_cents, entity_size, paid_date vs due_date, rule) converted to USD and rounded per-line"
          - "Family.committed_forecast_cents += (paid_amount_cents - authorized_amount_cents)"
          - "authorized_amount_cents = null"
      - from: SCHEDULED
        to: LAPSED
        trigger: "system (docket sweep: today > surcharge_window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "No budget effect (nothing committed)"
      - from: PENDING_AUTHORIZATION
        to: LAPSED
        trigger: "system (docket sweep: today > surcharge_window_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Current PaymentAuthorization (REQUESTED) -> SUPERSEDED"

  - entity: PaymentAuthorization
    initial_state: REQUESTED
    terminal_states: [RELEASED, REJECTED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /authorizations/{authorizationId}/approve"
        actor: ClientApprover
        preconditions:
          - "Scope: acting ClientContact.client_id == family client of the obligation (ERR_SCOPE_VIOLATION)"
          - "Obligation status == PENDING_AUTHORIZATION (ERR_INVALID_STATE)"
          - "Budget: family.committed_forecast_cents + amount_cents <= family.budget_cap_cents (ERR_FAMILY_BUDGET_EXCEEDED; equality is allowed)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "Obligation -> AUTHORIZED (cascade; sets authorized_amount_cents and family rollup)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /authorizations/{authorizationId}/reject"
        actor: ClientApprover
        preconditions:
          - "Scope: acting ClientContact.client_id == family client (ERR_SCOPE_VIOLATION)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "Obligation -> SCHEDULED (cascade)"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /authorizations/{authorizationId}/release"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system (obligation lapsed while awaiting decision)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (obligation deauthorized, abandoned, or lapsed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: SUPERSEDED
        trigger: "system (obligation deauthorized, abandoned, or lapsed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OutsideCounselInstruction
    initial_state: DRAFT
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /instructions/{instructionId}/send"
        actor: DocketingClerk
        preconditions:
          - "Application.status in {DRAFT, PENDING, GRANTED} (ERR_APPLICATION_NOT_OPEN)"
        side_effects: []
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /instructions/{instructionId}/acknowledge"
        actor: OutsideCounsel
        preconditions:
          - "Scope: acting CounselFirm id == instruction.counsel_firm_id (ERR_SCOPE_VIOLATION)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: CONFIRMED
        trigger: "POST /instructions/{instructionId}/confirm"
        actor: OutsideCounsel
        preconditions:
          - "Scope: acting CounselFirm id == instruction.counsel_firm_id (ERR_SCOPE_VIOLATION)"
        side_effects: []
      - from: SENT
        to: DECLINED
        trigger: "POST /instructions/{instructionId}/decline"
        actor: OutsideCounsel
        preconditions:
          - "Scope: acting CounselFirm id == instruction.counsel_firm_id (ERR_SCOPE_VIOLATION)"
        side_effects: []
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /instructions/{instructionId}/complete"
        actor: DocketingClerk
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /instructions/{instructionId}/cancel OR system (application abandonment/lapse cascade)"
        actor: DocketingManager | DocketingClerk | system
        preconditions: []
        side_effects: []
      - from: SENT
        to: CANCELLED
        trigger: "POST /instructions/{instructionId}/cancel OR system (linked DocketEntry cancellation cascade, or application abandonment/lapse cascade)"
        actor: DocketingManager | DocketingClerk | system
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "system (linked DocketEntry cancellation cascade, or application abandonment/lapse cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (linked DocketEntry cancellation cascade, or application abandonment/lapse cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AbandonmentReview
    initial_state: PROPOSED
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /abandonment-reviews/{reviewId}/submit"
        actor: DocketingManager
        preconditions: []
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /abandonment-reviews/{reviewId}/approve"
        actor: DocketingManager
        preconditions:
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /abandonment-reviews/{reviewId}/reject"
        actor: DocketingManager
        preconditions:
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /abandonment-reviews/{reviewId}/execute"
        actor: DocketingManager
        preconditions:
          - "PatentFamily.status == PRUNING_REVIEW (ERR_FAMILY_NOT_IN_PRUNING_REVIEW)"
        side_effects:
          - "Hop 1: Application -> ABANDONED"
          - "Hop 2 (caused by application abandonment): every non-terminal DocketEntry -> CANCELLED (open_docket_count decremented per entry) AND every non-terminal AnnuityObligation -> CANCELLED (committed_forecast_cents decremented by authorized_amount_cents where applicable; current PaymentAuthorization -> SUPERSEDED)"
          - "Hop 3 (caused by each DocketEntry cancellation): linked OutsideCounselInstruction in {DRAFT, SENT, ACKNOWLEDGED, CONFIRMED} -> CANCELLED"
          - "Unlinked non-terminal OutsideCounselInstruction rows of the application -> CANCELLED"

  - entity: AssignmentRecord
    initial_state: DRAFT
    terminal_states: [RECORDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /assignments/{assignmentId}/execute"
        actor: RecordsSpecialist
        preconditions: []
        side_effects:
          - "executed_by_user_id = X-User-ID"
      - from: RECORDATION_REJECTED
        to: EXECUTED
        trigger: "POST /assignments/{assignmentId}/execute"
        actor: RecordsSpecialist
        preconditions: []
        side_effects:
          - "executed_by_user_id = X-User-ID (re-execution loop after register rejection)"
      - from: EXECUTED
        to: RECORDED
        trigger: "POST /assignments/{assignmentId}/record"
        actor: RecordsSpecialist
        preconditions:
          - "Segregation of duties: X-User-ID != executed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "register_recordation_number set from request"
      - from: EXECUTED
        to: RECORDATION_REJECTED
        trigger: "POST /assignments/{assignmentId}/record-rejection"
        actor: RecordsSpecialist
        preconditions: []
        side_effects: []

  - entity: DocketAudit
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED_CLEAN]
    transitions:
      - from: OPEN
        to: VARIANCE_FOUND
        trigger: "system (auto at creation when computed variances list is non-empty)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VARIANCE_FOUND
        to: RESOLVED
        trigger: "POST /audits/{auditId}/resolve"
        actor: DocketingManager
        preconditions: []
        side_effects:
          - "resolution_note set from request"
      - from: OPEN
        to: CLOSED_CLEAN
        trigger: "POST /audits/{auditId}/close"
        actor: DocketingManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serially observable only)
# =============================================================================
concurrency_rules:
  - rule_id: authorization-create-stale-annuity
    parent_entity: AnnuityObligation
    write_endpoint: "POST /annuity-obligations/{obligationId}/authorizations"
    occ_field: expected_annuity_obligation_version
    description: |
      Creating a PaymentAuthorization against an AnnuityObligation whose
      version has advanced since the client last observed it is rejected.
      This captures the case where another writer has just created an
      authorization (which moves the obligation to PENDING_AUTHORIZATION and
      bumps its version) or a fee recalculation has bumped the version, so the
      current writer's view of the obligation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: abandonment-review-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{applicationId}/abandonment-reviews"
    occ_field: expected_application_version
    description: |
      Creating an AbandonmentReview against an Application whose version has
      advanced since the client last observed it is rejected. A prior review
      creation legitimately opened review state on the application and bumped
      its version, so a creator holding an older version is working from a
      stale read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: office_action_response_due
    trigger: "OfficeAction creation for action_type in {NON_FINAL_REJECTION, FINAL_REJECTION}"
    algorithm: chronological
    formula: |
      base_due_date = add_months(office_action.mail_date, rule.oa_response_months)
      add_months preserves day-of-month; if the target month is shorter, clamp to its last day.
    input_set: "The creating OfficeAction plus the JurisdictionRule for the application's jurisdiction"
    constants:
      CLAMP: "last day of target month when day-of-month overflows"
    precision: "date granularity; no time component"

  - name: annuity_due_schedule
    trigger: "Application grant transition"
    algorithm: chronological
    formula: |
      for period_year in rule.annuity_start_year .. rule.term_years inclusive:
        due_date = add_months(application.grant_date, period_year * 12 - 6)
        surcharge_window_end = add_months(due_date, rule.surcharge_window_months)
      Rows are generated in ascending period_year order.
    input_set: "The granted Application plus its JurisdictionRule"
    precision: "date granularity"

  - name: annuity_fee_amount
    trigger: "Obligation generation at grant (paid_date == null -> on-time estimate); confirm-payment (paid_date supplied)"
    algorithm: tiered_pricing
    formula: |
      tier(period_year) = index i in 1..4 such that period_year falls inside the i-th
        pipe-separated range of rule.fee_tier_bounds (ranges are inclusive on both ends)
      base = rule.fee_tier_<i>_cents
      if application.entity_size == SMALL:
        base = round_half_up(base * rule.small_entity_multiplier_bps / 10000)
      if paid_date is null or paid_date <= due_date:
        surcharge = 0
      else:
        months_late = number of calendar months begun after due_date up to paid_date:
          full = whole calendar months between due_date and paid_date;
          months_late = full + 1 if any day remainder exists else full;
          a paid_date strictly after due_date always yields months_late >= 1
        if months_late == 1: surcharge_bps = rule.surcharge_bps_month_1
        else:                surcharge_bps = rule.surcharge_bps_late
        surcharge = round_half_up(base * surcharge_bps / 10000)
      total_local_cents = base + surcharge
      amount_usd_cents = round_half_up(total_local_cents * rule.fx_to_usd_cents_bps / 10000)
      Rounding order is pinned: entity-size multiplier rounds first, surcharge is computed
      on the rounded base and rounds itself, FX conversion rounds last; each step emits
      whole cents before the next step consumes it.
    input_set: "One AnnuityObligation, its Application (entity_size, grant_date), its JurisdictionRule"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up at each pinned step"

  - name: budget_forecast
    trigger: "GET /families/{familyId}/budget-forecast (computed on read; no caching)"
    algorithm: aggregation
    formula: |
      candidate applications = family.applications with status in {PENDING, GRANTED}
      (ABANDONED | LAPSED | WITHDRAWN excluded; DRAFT excluded — no obligations exist)
      candidate obligations per application:
        variant COMMITTED: status in {AUTHORIZED, PAYMENT_INSTRUCTED, CONFIRMATION_QUERY}
          contribute authorized_amount_cents; PAID_CONFIRMED contribute paid_amount_cents
        variant PROJECTED: status in {SCHEDULED, PENDING_AUTHORIZATION} contribute
          estimated_amount_usd_cents; {AUTHORIZED, PAYMENT_INSTRUCTED, CONFIRMATION_QUERY}
          contribute authorized_amount_cents; PAID_CONFIRMED contribute paid_amount_cents
      total_usd_cents = sum of contributed per-obligation amounts.
      Rounding order is pinned: each obligation amount is already an integer-cent value
      rounded at its own computation step (see annuity_fee_amount); the forecast NEVER
      re-rounds — it sums per-line rounded integers. (Contrast: converting the summed
      local-currency amounts once would produce a different total whenever per-line
      fractional parts accumulate past a cent boundary.)
      per_application = per-application subtotals in ascending Application.created_at order.
    input_set: "PatentFamily, its Applications (status-filtered), their AnnuityObligations (status-filtered per variant)"
    precision: "integer cents; sum of pre-rounded per-line integers"
    variants:
      - name: COMMITTED
        when: "variant=COMMITTED query value"
        difference: "Only obligations whose spend is locked (AUTHORIZED and beyond) contribute, at authorized/paid actuals; SCHEDULED and PENDING_AUTHORIZATION contribute nothing"
      - name: PROJECTED
        when: "variant=PROJECTED query value"
        difference: "SCHEDULED and PENDING_AUTHORIZATION obligations additionally contribute at estimated_amount_usd_cents"

  - name: authorization_cap_evaluation
    trigger: "POST /authorizations/{authorizationId}/approve"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency, evaluation order pinned:
      (1) read family.committed_forecast_cents as committed_before — this rollup already
          includes every currently AUTHORIZED-or-later obligation;
      (2) candidate committed_after = committed_before + authorization.amount_cents;
      (3) gate: if committed_after > family.budget_cap_cents -> ERR_FAMILY_BUDGET_EXCEEDED
          and NOTHING changes (committed_before is not mutated);
      (4) otherwise approve: obligation -> AUTHORIZED, and the obligation's cascade adds
          amount_cents into committed_forecast_cents so committed_after becomes the new
          stored value.
      Whether an obligation appears in the COMMITTED forecast therefore depends on a check
      that itself reads the COMMITTED forecast; steps (1)-(4) fix the evaluation order so
      the value is well-defined and the check never observes a half-updated rollup.
    input_set: "PaymentAuthorization being approved, its AnnuityObligation, the PatentFamily"
    precision: "integer cents"

  - name: priority_window_deadline
    trigger: "Application creation with application_type in {PARIS_CONVENTION, PCT_NATIONAL_PHASE}"
    algorithm: threshold
    formula: |
      PARIS_CONVENTION: deadline = add_months(family.first_priority_date, rule.paris_window_months)
      PCT_NATIONAL_PHASE: deadline = add_months(family.first_priority_date, rule.pct_window_months)
      Filing is permitted iff filing_date <= deadline (inclusive boundary).
      rule = JurisdictionRule of the NEW application's jurisdiction.
    input_set: "New Application draft fields, parent PatentFamily, JurisdictionRule"
    precision: "date granularity; <= inclusive comparison"

  - name: continuation_chain_check
    trigger: "Application creation with parent_application_id present; PATCH /applications/{id} re-parenting"
    algorithm: topological
    formula: |
      Walk parent_application_id links from the proposed parent upward.
      Reject when: any link does not resolve (ERR_NOT_FOUND, existence stage);
      the proposed parent is in status LAPSED (ERR_PARENT_APPLICATION_LAPSED);
      the chain would reach the new application again (cycle) — for creation this means
      the proposed parent chain must be finite and acyclic, which holds by induction since
      every existing chain was validated at its own creation;
      the proposed parent belongs to a different PatentFamily (ERR_PARENT_FAMILY_MISMATCH);
      type-specific gate: PCT_NATIONAL_PHASE requires parent.application_type ==
      PCT_INTERNATIONAL (ERR_PARENT_NOT_PCT).
    input_set: "New Application draft, proposed parent Application and its ancestors"
    precision: "n/a"

  - name: client_risk_score
    trigger: "GET /clients/{clientId}/risk-score (computed on read)"
    algorithm: weighted_scoring
    formula: |
      open entries = all DocketEntry with status in {PENDING, IN_PROGRESS} whose parent
        Application is non-terminal and belongs to a family of this client
      weight(entry_type): STATUTORY=10, OFFICE_ACTION_RESPONSE=4, PARIS_PRIORITY=8,
        PCT_PHASE=8, ANNUITY=6, RECORDATION=2
      days_to_due = entry.current_due_date - today (calendar days; may be negative)
      urgency: days_to_due < 0 -> x8; 0..7 -> x4; 8..30 -> x2; 31..90 -> x1; >90 -> x0.5
      score = sum over included entries of weight * urgency
      variant STATUTORY_ONLY: include only entry_type == STATUTORY
      variant ALL_DEADLINES: include all six entry types
      tier: score >= 50 -> CRITICAL; 20 <= score < 50 -> ELEVATED; score < 20 -> NORMAL
      per_family = per-family subtotal scores keyed by family id, in ascending
        PatentFamily.created_at order.
    input_set: "Client, its families, their non-terminal applications, open docket entries (status filter above), logical clock"
    precision: "score kept as exact rational; x0.5 may produce .5 steps — report with 2 decimal places, round_half_up only at final presentation"
    variants:
      - name: STATUTORY_ONLY
        when: "variant=STATUTORY_ONLY query value"
        difference: "Only STATUTORY entries contribute"
      - name: ALL_DEADLINES
        when: "variant=ALL_DEADLINES query value"
        difference: "All six entry types contribute"

  - name: pruning_savings_estimate
    trigger: "AbandonmentReview creation"
    algorithm: forward_looking
    formula: |
      gross = sum(estimated_amount_usd_cents over the application's AnnuityObligations
        with status == SCHEDULED)
      net = gross - PRUNE_ADMIN_FEE_CENTS
      estimated_savings_usd_cents = max(net, 0)
      PENDING_AUTHORIZATION / AUTHORIZED obligations are NOT counted as savings
      (their spend is already committed); the estimate is frozen at creation.
    input_set: "Application's AnnuityObligations filtered to status SCHEDULED at creation time"
    constants:
      PRUNE_ADMIN_FEE_CENTS: 15000
    precision: "integer cents"

  - name: docket_audit_variance
    trigger: "DocketAudit creation"
    algorithm: interval_merge
    formula: |
      internal = DocketEntry of the application with status in {PENDING, IN_PROGRESS,
        RESPONSE_FILED, COMPLETED} and current_due_date in [window_start, window_end)
        (half-open: start inclusive, end exclusive)
      register = register_entries whose due_date falls in [window_start, window_end)
      match key = (entry_type, due_date)
      variances:
        register row with no internal row of same (entry_type, due_date):
          if an internal row with same entry_type but different due_date exists ->
            DATE_MISMATCH against that internal row (tie-break: internal row with the
            smallest absolute due_date difference; then earliest DocketEntry.created_at)
          else -> MISSING_INTERNAL
        internal row with no register row of same (entry_type, due_date) after the above
          matching -> MISSING_REGISTER
      variances sorted by (entry_type asc, sort_due asc) where sort_due =
        internal_due_date when present else register_due_date.
    input_set: "Application's docket entries (status/date filtered) and the register_entries snapshot array"
    precision: "date granularity"

  - name: committed_forecast_rollup
    trigger: "every AnnuityObligation transition into or out of {AUTHORIZED, PAYMENT_INSTRUCTED, CONFIRMATION_QUERY, PAID_CONFIRMED} and every confirm-payment"
    algorithm: aggregation
    formula: |
      family.committed_forecast_cents =
        sum(authorized_amount_cents over all obligations of the family's applications in
            status {AUTHORIZED, PAYMENT_INSTRUCTED, CONFIRMATION_QUERY})
      + sum(paid_amount_cents over obligations in status PAID_CONFIRMED)
      Maintained incrementally by the transitions that change membership or amounts;
      deauthorize subtracts authorized_amount_cents; confirm-payment replaces
      authorized_amount_cents with paid_amount_cents (delta adjustment);
      abandonment/lapse cascades subtract authorized_amount_cents of cancelled
      committed obligations.
    input_set: "PatentFamily's applications' AnnuityObligations (status-filtered)"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role; for entity_backed roles X-User-ID must reference an existing instance of the backing entity"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed scope: ClientApprover's ClientContact.client_id must equal the target resource's family client; OutsideCounsel's CounselFirm id must equal instruction.counsel_firm_id"
    error_id: ERR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /authorizations/{id}/approve, POST /authorizations/{id}/reject, POST /instructions/{id}/acknowledge, POST /instructions/{id}/confirm, POST /instructions/{id}/decline"
  - priority: 4
    category: existence
    check: "Path and body resource ids exist, validated left-to-right in the path then body; body FK ids (parent_application_id, counsel_firm_id, docket_entry_id, inventor_ids elements) must resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /annuity-obligations/{id}/authorizations, POST /applications/{id}/abandonment-reviews"
  - priority: 6
    category: business_constraint
    check: "Request body shape: required fields present, no undeclared fields, enum values within declared sets, date fields ISO YYYY-MM-DD, integers where declared; window_start < window_end on audits"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 7
    category: state
    check: "Target resource is in a from-state that defines the requested transition; terminal entities reject every transition with ERR_ALREADY_TERMINAL"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: on AbandonmentReview approve/reject, X-User-ID != submitted_by_user_id; on AssignmentRecord record, X-User-ID != executed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /abandonment-reviews/{id}/approve, POST /abandonment-reviews/{id}/reject, POST /assignments/{id}/record"
  - priority: 9
    category: business_safety
    check: "Counsel firm must be accredited for the application's jurisdiction"
    error_id: ERR_COUNSEL_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /applications/{id}/instructions"
  - priority: 10
    category: business_temporal
    check: "Foreign-filing windows: PARIS_CONVENTION filing_date <= first_priority_date + paris_window_months; PCT_NATIONAL_PHASE filing_date <= first_priority_date + pct_window_months (inclusive)"
    error_id: ERR_PRIORITY_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /families/{id}/applications"
  - priority: 11
    category: business_temporal
    check: "Deadline discipline: extension requests require current_due_date >= today; record-response requires response_filed_date <= current_due_date"
    error_id: ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /docket-entries/{id}/request-extension, POST /docket-entries/{id}/record-response"
  - priority: 12
    category: business_temporal
    check: "confirm-payment requires paid_date <= surcharge_window_end"
    error_id: ERR_SURCHARGE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /annuity-obligations/{id}/confirm-payment"
  - priority: 13
    category: business_temporal
    check: "Audit window overlap: a new DocketAudit's half-open [window_start, window_end) must not intersect any non-terminal DocketAudit's window on the same application; adjacency (new.window_start == existing.window_end) is allowed"
    error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /applications/{id}/audits"
  - priority: 14
    category: business_temporal
    check: "Instruction exclusivity: for the same application_id + instruction_type, the closed window [created date, due_date] of a new instruction must not share any date with the closed window of an existing instruction in {DRAFT, SENT, ACKNOWLEDGED, CONFIRMED}; touching endpoints conflict"
    error_id: ERR_INSTRUCTION_EXCLUSIVE_CONFLICT
    http_status: 409
    applies_to: "POST /applications/{id}/instructions"
  - priority: 15
    category: business_constraint
    check: "Extension policy: entry_type must be OFFICE_ACTION_RESPONSE; extension_count < rule.max_extensions (request reaching exactly max_extensions succeeds; the one beyond fails)"
    error_id: "ERR_EXTENSION_NOT_ALLOWED_TYPE / ERR_EXTENSION_LIMIT_REACHED"
    http_status: 422
    applies_to: "POST /docket-entries/{id}/request-extension"
  - priority: 16
    category: business_constraint
    check: "application_number unique per family among applications not in WITHDRAWN"
    error_id: ERR_DUPLICATE_APPLICATION_NUMBER
    http_status: 409
    applies_to: "POST /families/{id}/applications"
  - priority: 17
    category: business_constraint
    check: "Continuation-chain integrity: proposed parent must not be LAPSED, must belong to the same family, chain must be acyclic; PCT_NATIONAL_PHASE requires parent application_type == PCT_INTERNATIONAL"
    error_id: "ERR_PARENT_APPLICATION_LAPSED / ERR_PARENT_FAMILY_MISMATCH / ERR_PRIORITY_CHAIN_CYCLE / ERR_PARENT_NOT_PCT"
    http_status: 422
    applies_to: "POST /families/{id}/applications, PATCH /applications/{id}"
  - priority: 18
    category: business_constraint
    check: "At most one non-terminal (non-REJECTED, non-EXECUTED) AbandonmentReview per application"
    error_id: ERR_REVIEW_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /applications/{id}/abandonment-reviews"
  - priority: 19
    category: business_referential
    check: "DocketEntry cancel requires no linked non-terminal OutsideCounselInstruction"
    error_id: ERR_ENTRY_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /docket-entries/{id}/cancel"
  - priority: 20
    category: business_referential
    check: "AssignmentRecord inventor_ids elements must belong to the application's client"
    error_id: ERR_INVENTOR_CLIENT_MISMATCH
    http_status: 422
    applies_to: "POST /applications/{id}/assignments"
  - priority: 21
    category: business_referential
    check: "instruct-payment requires the current PaymentAuthorization in RELEASED"
    error_id: ERR_AUTHORIZATION_NOT_RELEASED
    http_status: 409
    applies_to: "POST /annuity-obligations/{id}/instruct-payment"
  - priority: 22
    category: business_referential
    check: "Jurisdiction-conditional gates: requires_recorded_assignment_for_grant blocks grant without a RECORDED assignment; requires_recorded_assignment_for_payment / requires_confirmed_instruction_for_payment block instruct-payment without a RECORDED assignment / CONFIRMED-or-COMPLETED ANNUITY_PAYMENT instruction"
    error_id: "ERR_ASSIGNMENT_RECORDATION_REQUIRED / ERR_COUNSEL_INSTRUCTION_REQUIRED"
    http_status: 409
    applies_to: "POST /applications/{id}/grant, POST /annuity-obligations/{id}/instruct-payment"
  - priority: 23
    category: business_fiscal
    check: "Approval budget gate per authorization_cap_evaluation: committed_forecast_cents + amount_cents <= budget_cap_cents (equality allowed)"
    error_id: ERR_FAMILY_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /authorizations/{id}/approve"
  - priority: 24
    category: state
    check: "Cross-entity client gate: writes under a SUSPENDED client are rejected (creation of families, applications, docket entries, office actions, authorizations, instructions, reviews, assignments, audits)"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 409
    applies_to: "creation endpoints scoped under a Client"
  - priority: 25
    category: business_referential
    check: "Family lifecycle gates: exit-pruning-review blocked while an APPROVED review exists; family close blocked while any application is non-terminal; review execute requires family PRUNING_REVIEW"
    error_id: "ERR_FAMILY_HAS_APPROVED_REVIEWS / ERR_FAMILY_HAS_OPEN_APPLICATIONS / ERR_FAMILY_NOT_IN_PRUNING_REVIEW"
    http_status: 409
    applies_to: "POST /families/{id}/exit-pruning-review, POST /families/{id}/close, POST /abandonment-reviews/{id}/execute"
  - priority: 26
    category: state
    check: "Cross-entity application gates: docket entry create/start/extend/record-response and instruction send require the parent Application non-terminal and in the pinned status set"
    error_id: "ERR_APPLICATION_NOT_OPEN"
    http_status: 409
    applies_to: "POST /applications/{id}/docket-entries, POST /docket-entries/{id}/start, POST /docket-entries/{id}/request-extension, POST /docket-entries/{id}/record-response, POST /instructions/{id}/send"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (server startup default; never falls back to wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Sets logical clock used by every date-dependent rule (deadlines, sweeps, risk urgency, windows)"]

  # --- Docket sweep (ops-run checkpoint) ---
  - method: POST
    path: "/docket-sweeps"
    description: "Run the docket sweep batch against the current logical clock: lapses overdue docket entries and annuity obligations and fires their cascades"
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: { entries_lapsed: integer, obligations_lapsed: integer, applications_lapsed: integer, obligations_superseded_authorizations: integer }
    side_effects:
      - "DocketEntry in {PENDING, IN_PROGRESS} with current_due_date < today -> LAPSED, processed in ascending (current_due_date ASC, created_at ASC); cascade mutations take effect immediately, so an entry CANCELLED by an application-lapse cascade before its turn is skipped and counted as cancelled, not lapsed"
      - "STATUTORY entry lapse cascades parent Application (PENDING) -> LAPSED"
      - "AnnuityObligation in {SCHEDULED, PENDING_AUTHORIZATION} with surcharge_window_end < today -> LAPSED; PENDING_AUTHORIZATION lapse supersedes its REQUESTED authorization"
      - "Application (GRANTED) -> LAPSED when any of its obligations lapsed in this sweep; application lapse cascade applies"

  # --- JurisdictionRule ---
  - method: POST
    path: "/jurisdiction-rules"
    description: "Create a jurisdiction rule (config)"
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction, oa_response_months, max_extensions, extension_months, extension_fee_cents, annuity_start_year, term_years, surcharge_window_months, surcharge_bps_month_1, surcharge_bps_late, small_entity_multiplier_bps, fee_tier_bounds, fee_tier_1_cents, fee_tier_2_cents, fee_tier_3_cents, fee_tier_4_cents, paris_window_months, pct_window_months, fx_to_usd_cents_bps, "requires_recorded_assignment_for_grant?", "requires_recorded_assignment_for_payment?", "requires_confirmed_instruction_for_payment?"]
    output: JurisdictionRule
    side_effects: []
  - method: GET
    path: "/jurisdiction-rules"
    description: "List jurisdiction rules"
    roles: [Any]
    code: 200
    input: ["jurisdiction?", "limit?", "offset?"]
    output: JurisdictionRule[]
    side_effects: []
  - method: GET
    path: "/jurisdiction-rules/{ruleId}"
    description: "Get a jurisdiction rule"
    roles: [Any]
    code: 200
    input: []
    output: JurisdictionRule
    side_effects: []
  - method: PATCH
    path: "/jurisdiction-rules/{ruleId}"
    description: "Update a jurisdiction rule (used to toggle requires_* gates)"
    roles: [PlatformAdmin]
    code: 200
    input: ["oa_response_months?", "max_extensions?", "extension_months?", "extension_fee_cents?", "surcharge_window_months?", "surcharge_bps_month_1?", "surcharge_bps_late?", "small_entity_multiplier_bps?", "fee_tier_1_cents?", "fee_tier_2_cents?", "fee_tier_3_cents?", "fee_tier_4_cents?", "fx_to_usd_cents_bps?", "requires_recorded_assignment_for_grant?", "requires_recorded_assignment_for_payment?", "requires_confirmed_instruction_for_payment?"]
    output: JurisdictionRule
    side_effects: ["Does not retroactively change generated obligations"]

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Create a client"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, "default_currency?"]
    output: Client
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/clients/{clientId}"
    description: "Get a client"
    roles: [Any]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{clientId}/suspend"
    description: "Suspend a client (gates all descendant writes)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/clients/{clientId}/reactivate"
    description: "Reactivate a suspended client"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["status -> ACTIVE"]
  - method: GET
    path: "/clients/{clientId}/risk-score"
    description: "Computed client docket risk score per client_risk_score"
    roles: [Any]
    code: 200
    input: [variant]
    output: { variant: string, score: number, tier: string, per_family: array }
    side_effects: []

  # --- ClientContact ---
  - method: POST
    path: "/clients/{clientId}/contacts"
    description: "Create a client contact (ClientApprover identity)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email]
    output: ClientContact
    side_effects: []
  - method: GET
    path: "/clients/{clientId}/contacts"
    description: "List contacts of a client"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: ClientContact[]
    side_effects: []
  - method: GET
    path: "/contacts/{contactId}"
    description: "Get a contact"
    roles: [Any]
    code: 200
    input: []
    output: ClientContact
    side_effects: []

  # --- CounselFirm ---
  - method: POST
    path: "/counsel-firms"
    description: "Register an outside counsel firm"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, accredited_jurisdictions]
    output: CounselFirm
    side_effects: []
  - method: GET
    path: "/counsel-firms/{firmId}"
    description: "Get a counsel firm"
    roles: [Any]
    code: 200
    input: []
    output: CounselFirm
    side_effects: []
  - method: GET
    path: "/counsel-firms/{firmId}/instructions"
    description: "List instructions assigned to a firm"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: OutsideCounselInstruction[]
    side_effects: []

  # --- Inventor ---
  - method: POST
    path: "/clients/{clientId}/inventors"
    description: "Register an inventor"
    roles: [RecordsSpecialist]
    code: 201
    input: [full_name, email]
    output: Inventor
    side_effects: []
  - method: GET
    path: "/clients/{clientId}/inventors"
    description: "List inventors of a client"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: Inventor[]
    side_effects: []
  - method: GET
    path: "/inventors/{inventorId}"
    description: "Get an inventor"
    roles: [Any]
    code: 200
    input: []
    output: Inventor
    side_effects: []
  - method: GET
    path: "/inventors/{inventorId}/assignments"
    description: "List assignment records referencing an inventor"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: AssignmentRecord[]
    side_effects: []

  # --- PatentFamily ---
  - method: POST
    path: "/clients/{clientId}/families"
    description: "Create a patent family"
    roles: [DocketingManager]
    code: 201
    input: [title, first_priority_date, budget_cap_cents]
    output: PatentFamily
    side_effects: ["status=ACTIVE, committed_forecast_cents=0; client must be ACTIVE (ERR_CLIENT_SUSPENDED)"]
  - method: GET
    path: "/clients/{clientId}/families"
    description: "List families of a client"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: PatentFamily[]
    side_effects: []
  - method: GET
    path: "/families/{familyId}"
    description: "Get a family"
    roles: [Any]
    code: 200
    input: []
    output: PatentFamily
    side_effects: []
  - method: POST
    path: "/families/{familyId}/enter-pruning-review"
    description: "Move family into pruning review"
    roles: [DocketingManager]
    code: 200
    input: []
    output: PatentFamily
    side_effects: ["status -> PRUNING_REVIEW"]
  - method: POST
    path: "/families/{familyId}/exit-pruning-review"
    description: "Move family out of pruning review"
    roles: [DocketingManager]
    code: 200
    input: []
    output: PatentFamily
    side_effects: ["status -> ACTIVE; blocked while an APPROVED review exists (ERR_FAMILY_HAS_APPROVED_REVIEWS)"]
  - method: POST
    path: "/families/{familyId}/close"
    description: "Close a family"
    roles: [DocketingManager]
    code: 200
    input: []
    output: PatentFamily
    side_effects: ["status -> CLOSED; requires all applications terminal (ERR_FAMILY_HAS_OPEN_APPLICATIONS)"]
  - method: GET
    path: "/families/{familyId}/budget-forecast"
    description: "Computed family budget forecast per budget_forecast; variant query field required"
    roles: [Any]
    code: 200
    input: [variant]
    output: { variant: string, total_usd_cents: integer, per_application: array }
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/families/{familyId}/applications"
    description: "Create an application (window, cycle, duplicate, and client gates apply)"
    roles: [DocketingClerk]
    code: 201
    input: [jurisdiction, application_type, filing_date, application_number, entity_size, "parent_application_id?"]
    output: Application
    side_effects: ["status=DRAFT, open_docket_count=0"]
  - method: GET
    path: "/families/{familyId}/applications"
    description: "List applications of a family; ordered by created_at ASC"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/applications"
    description: "Filtered list of applications"
    roles: [Any]
    code: 200
    input: ["family_id?", "parent_application_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/applications/{applicationId}"
    description: "Get an application"
    roles: [Any]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: PATCH
    path: "/applications/{applicationId}"
    description: "Re-parent a DRAFT application (continuation-chain correction); cycle check applies"
    roles: [DocketingClerk]
    code: 200
    input: ["parent_application_id?"]
    output: Application
    side_effects: ["Only while DRAFT (ERR_INVALID_STATE otherwise); re-runs continuation_chain_check including cycle detection (ERR_PRIORITY_CHAIN_CYCLE when the new parent chain reaches this application)"]
  - method: POST
    path: "/applications/{applicationId}/file"
    description: "File a draft application (DRAFT -> PENDING)"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> PENDING"]
  - method: POST
    path: "/applications/{applicationId}/grant"
    description: "Grant a pending application; generates the annuity schedule"
    roles: [DocketingClerk]
    code: 200
    input: [grant_date]
    output: Application
    side_effects: ["status -> GRANTED; grant_date set; generates AnnuityObligation rows per annuity_due_schedule + annuity_fee_amount"]
  - method: POST
    path: "/applications/{applicationId}/record-lapse"
    description: "Record official-register lapse of a granted application"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> LAPSED; obligation/entry/instruction cancellation cascade"]
  - method: POST
    path: "/applications/{applicationId}/withdraw"
    description: "Withdraw a draft application"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN"]

  # --- DocketEntry ---
  - method: POST
    path: "/applications/{applicationId}/docket-entries"
    description: "Create a docket entry"
    roles: [DocketingClerk]
    code: 201
    input: [entry_type, title, base_due_date]
    output: DocketEntry
    side_effects: ["status=PENDING, extension_count=0, current_due_date=base_due_date; application.open_docket_count += 1; client must be ACTIVE (ERR_CLIENT_SUSPENDED); application must be non-terminal (ERR_APPLICATION_NOT_OPEN)"]
  - method: GET
    path: "/applications/{applicationId}/docket-entries"
    description: "List docket entries of an application; ordered by created_at ASC"
    roles: [Any]
    code: 200
    input: ["status?", "entry_type?", "limit?", "offset?"]
    output: DocketEntry[]
    side_effects: []
  - method: GET
    path: "/docket-entries/{entryId}"
    description: "Get a docket entry"
    roles: [Any]
    code: 200
    input: []
    output: DocketEntry
    side_effects: []
  - method: POST
    path: "/docket-entries/{entryId}/start"
    description: "Start work on an entry (PENDING -> IN_PROGRESS)"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: DocketEntry
    side_effects: ["status -> IN_PROGRESS; linked OfficeAction (if any) -> UNDER_RESPONSE"]
  - method: POST
    path: "/docket-entries/{entryId}/request-extension"
    description: "Request an extension of time (OFFICE_ACTION_RESPONSE only)"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: DocketEntry
    side_effects: ["extension_count += 1; current_due_date extended by rule.extension_months; extension_fees_total_cents += rule.extension_fee_cents"]
  - method: POST
    path: "/docket-entries/{entryId}/record-response"
    description: "Record a filed response (IN_PROGRESS -> RESPONSE_FILED)"
    roles: [DocketingClerk]
    code: 200
    input: [response_filed_date]
    output: DocketEntry
    side_effects: ["status -> RESPONSE_FILED"]
  - method: POST
    path: "/docket-entries/{entryId}/record-rejection"
    description: "Record an office rejection of the filed response (RESPONSE_FILED -> IN_PROGRESS revision loop)"
    roles: [DocketingClerk]
    code: 200
    input: [new_base_due_date]
    output: DocketEntry
    side_effects: ["status -> IN_PROGRESS; base_due_date and current_due_date reset to new_base_due_date; extension_count reset to 0"]
  - method: POST
    path: "/docket-entries/{entryId}/complete"
    description: "Complete an entry (RESPONSE_FILED -> COMPLETED)"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: DocketEntry
    side_effects: ["status -> COMPLETED; open_docket_count -= 1; linked OfficeAction (UNDER_RESPONSE) -> CLOSED"]
  - method: POST
    path: "/docket-entries/{entryId}/cancel"
    description: "Cancel an open entry (PENDING|IN_PROGRESS -> CANCELLED)"
    roles: [DocketingManager]
    code: 200
    input: []
    output: DocketEntry
    side_effects: ["status -> CANCELLED; open_docket_count -= 1; blocked while a linked instruction is non-terminal (ERR_ENTRY_NOT_CANCELLABLE)"]
  - method: GET
    path: "/docket-entries/{entryId}/office-actions"
    description: "List office actions tracked by this entry (0 or 1)"
    roles: [Any]
    code: 200
    input: []
    output: OfficeAction[]
    side_effects: []
  - method: GET
    path: "/docket-entries/{entryId}/instructions"
    description: "List instructions linked to this entry"
    roles: [Any]
    code: 200
    input: []
    output: OutsideCounselInstruction[]
    side_effects: []

  # --- OfficeAction ---
  - method: POST
    path: "/applications/{applicationId}/office-actions"
    description: "Record a received office action; rejection types auto-create the response docket entry"
    roles: [DocketingClerk]
    code: 201
    input: [action_type, mail_date]
    output: OfficeAction
    side_effects: ["status=RECEIVED; for NON_FINAL_REJECTION | FINAL_REJECTION: auto-create DocketEntry(OFFICE_ACTION_RESPONSE, base_due_date = office_action_response_due(mail_date)), open_docket_count += 1, docket_entry_id set"]
  - method: GET
    path: "/applications/{applicationId}/office-actions"
    description: "List office actions of an application"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: OfficeAction[]
    side_effects: []
  - method: GET
    path: "/office-actions/{officeActionId}"
    description: "Get an office action"
    roles: [Any]
    code: 200
    input: []
    output: OfficeAction
    side_effects: []
  - method: POST
    path: "/office-actions/{officeActionId}/close-informational"
    description: "Close an INFORMATIONAL or NOTICE_OF_ALLOWANCE action without response"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: OfficeAction
    side_effects: ["status -> CLOSED"]

  # --- AnnuityObligation / PaymentAuthorization ---
  - method: GET
    path: "/applications/{applicationId}/annuity-obligations"
    description: "List annuity obligations of an application; ordered by period_year ASC"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AnnuityObligation[]
    side_effects: []
  - method: GET
    path: "/annuity-obligations/{obligationId}"
    description: "Get an annuity obligation"
    roles: [Any]
    code: 200
    input: []
    output: AnnuityObligation
    side_effects: []
  - method: POST
    path: "/annuity-obligations/{obligationId}/authorizations"
    description: "Request payment authorization for a SCHEDULED obligation (OCC on obligation version)"
    roles: [DocketingManager, FinanceOfficer]
    code: 201
    input: [amount_cents, expected_annuity_obligation_version]
    output: PaymentAuthorization
    side_effects: ["PaymentAuthorization created REQUESTED with requested_by_user_id; obligation -> PENDING_AUTHORIZATION; increments AnnuityObligation.version by 1"]
  - method: GET
    path: "/annuity-obligations/{obligationId}/authorizations"
    description: "List authorizations of an obligation"
    roles: [Any]
    code: 200
    input: []
    output: PaymentAuthorization[]
    side_effects: []
  - method: GET
    path: "/authorizations/{authorizationId}"
    description: "Get a payment authorization"
    roles: [Any]
    code: 200
    input: []
    output: PaymentAuthorization
    side_effects: []
  - method: POST
    path: "/authorizations/{authorizationId}/approve"
    description: "Client approves an authorization (budget gate; scope-gated to family client)"
    roles: [ClientApprover]
    code: 200
    input: []
    output: PaymentAuthorization
    side_effects: ["status -> APPROVED; obligation -> AUTHORIZED with authorized_amount_cents = amount_cents; family.committed_forecast_cents += amount_cents"]
  - method: POST
    path: "/authorizations/{authorizationId}/reject"
    description: "Client rejects an authorization"
    roles: [ClientApprover]
    code: 200
    input: []
    output: PaymentAuthorization
    side_effects: ["status -> REJECTED; obligation -> SCHEDULED"]
  - method: POST
    path: "/authorizations/{authorizationId}/release"
    description: "Finance releases funds for an approved authorization"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PaymentAuthorization
    side_effects: ["status -> RELEASED"]
  - method: POST
    path: "/annuity-obligations/{obligationId}/deauthorize"
    description: "Withdraw authorization (AUTHORIZED -> SCHEDULED), compensating the committed rollup"
    roles: [DocketingManager]
    code: 200
    input: []
    output: AnnuityObligation
    side_effects: ["family.committed_forecast_cents -= authorized_amount_cents; authorized_amount_cents = null; current authorization (APPROVED | RELEASED) -> SUPERSEDED"]
  - method: POST
    path: "/annuity-obligations/{obligationId}/instruct-payment"
    description: "Instruct payment of an authorized obligation"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AnnuityObligation
    side_effects: ["status -> PAYMENT_INSTRUCTED"]
  - method: POST
    path: "/annuity-obligations/{obligationId}/raise-confirmation-query"
    description: "Raise a confirmation query on an instructed payment"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AnnuityObligation
    side_effects: ["status -> CONFIRMATION_QUERY"]
  - method: POST
    path: "/annuity-obligations/{obligationId}/reinstruct"
    description: "Re-instruct after a confirmation query (cycle back to PAYMENT_INSTRUCTED)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: AnnuityObligation
    side_effects: ["status -> PAYMENT_INSTRUCTED"]
  - method: POST
    path: "/annuity-obligations/{obligationId}/confirm-payment"
    description: "Confirm payment with the actual paid date (surcharge computed per annuity_fee_amount)"
    roles: [FinanceOfficer]
    code: 200
    input: [paid_date]
    output: AnnuityObligation
    side_effects: ["status -> PAID_CONFIRMED; paid_amount_cents computed; family.committed_forecast_cents += (paid_amount_cents - authorized_amount_cents); authorized_amount_cents = null"]

  # --- OutsideCounselInstruction ---
  - method: POST
    path: "/applications/{applicationId}/instructions"
    description: "Create an outside counsel instruction (accreditation + closed-window exclusivity apply)"
    roles: [DocketingClerk, DocketingManager]
    code: 201
    input: [counsel_firm_id, instruction_type, due_date, "docket_entry_id?"]
    output: OutsideCounselInstruction
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/applications/{applicationId}/instructions"
    description: "List instructions of an application"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutsideCounselInstruction[]
    side_effects: []
  - method: GET
    path: "/instructions/{instructionId}"
    description: "Get an instruction"
    roles: [Any]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: []
  - method: POST
    path: "/instructions/{instructionId}/send"
    description: "Send an instruction (DRAFT -> SENT)"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: ["status -> SENT"]
  - method: POST
    path: "/instructions/{instructionId}/acknowledge"
    description: "Counsel acknowledges (SENT -> ACKNOWLEDGED)"
    roles: [OutsideCounsel]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: ["status -> ACKNOWLEDGED"]
  - method: POST
    path: "/instructions/{instructionId}/confirm"
    description: "Counsel confirms execution readiness (ACKNOWLEDGED -> CONFIRMED)"
    roles: [OutsideCounsel]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/instructions/{instructionId}/decline"
    description: "Counsel declines (SENT -> DECLINED)"
    roles: [OutsideCounsel]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: ["status -> DECLINED"]
  - method: POST
    path: "/instructions/{instructionId}/complete"
    description: "Mark a confirmed instruction completed (CONFIRMED -> COMPLETED)"
    roles: [DocketingClerk]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: ["status -> COMPLETED"]
  - method: POST
    path: "/instructions/{instructionId}/cancel"
    description: "Cancel an unsent or sent instruction"
    roles: [DocketingClerk, DocketingManager]
    code: 200
    input: []
    output: OutsideCounselInstruction
    side_effects: ["status -> CANCELLED"]

  # --- AbandonmentReview ---
  - method: POST
    path: "/applications/{applicationId}/abandonment-reviews"
    description: "Propose an abandonment review (OCC on application version); computes pruning savings estimate"
    roles: [DocketingManager]
    code: 201
    input: [rationale, expected_application_version]
    output: AbandonmentReview
    side_effects: ["status=PROPOSED; estimated_savings_usd_cents computed per pruning_savings_estimate; increments Application.version by 1"]
  - method: GET
    path: "/applications/{applicationId}/abandonment-reviews"
    description: "List abandonment reviews of an application"
    roles: [Any]
    code: 200
    input: []
    output: AbandonmentReview[]
    side_effects: []
  - method: GET
    path: "/abandonment-reviews/{reviewId}"
    description: "Get an abandonment review"
    roles: [Any]
    code: 200
    input: []
    output: AbandonmentReview
    side_effects: []
  - method: POST
    path: "/abandonment-reviews/{reviewId}/submit"
    description: "Submit a proposed review (records submitted_by_user_id)"
    roles: [DocketingManager]
    code: 200
    input: []
    output: AbandonmentReview
    side_effects: ["status -> UNDER_REVIEW; submitted_by_user_id = X-User-ID"]
  - method: POST
    path: "/abandonment-reviews/{reviewId}/approve"
    description: "Approve a submitted review (segregation of duties vs submitted_by_user_id)"
    roles: [DocketingManager]
    code: 200
    input: []
    output: AbandonmentReview
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/abandonment-reviews/{reviewId}/reject"
    description: "Reject a submitted review (segregation of duties vs submitted_by_user_id)"
    roles: [DocketingManager]
    code: 200
    input: []
    output: AbandonmentReview
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/abandonment-reviews/{reviewId}/execute"
    description: "Execute an approved review: application abandonment cascade (entries, obligations, instructions)"
    roles: [DocketingManager]
    code: 200
    input: []
    output: AbandonmentReview
    side_effects: ["status -> EXECUTED; Application -> ABANDONED with the full hop-2/hop-3 cascade per the state machine"]

  # --- AssignmentRecord ---
  - method: POST
    path: "/applications/{applicationId}/assignments"
    description: "Create an assignment record (inventor ids must belong to the application's client)"
    roles: [RecordsSpecialist]
    code: 201
    input: [assignee_name, inventor_ids, execution_date]
    output: AssignmentRecord
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/applications/{applicationId}/assignments"
    description: "List assignment records of an application"
    roles: [Any]
    code: 200
    input: []
    output: AssignmentRecord[]
    side_effects: []
  - method: GET
    path: "/assignments/{assignmentId}"
    description: "Get an assignment record"
    roles: [Any]
    code: 200
    input: []
    output: AssignmentRecord
    side_effects: []
  - method: POST
    path: "/assignments/{assignmentId}/execute"
    description: "Execute an assignment (DRAFT or RECORDATION_REJECTED -> EXECUTED)"
    roles: [RecordsSpecialist]
    code: 200
    input: []
    output: AssignmentRecord
    side_effects: ["status -> EXECUTED; executed_by_user_id = X-User-ID"]
  - method: POST
    path: "/assignments/{assignmentId}/record"
    description: "Record an executed assignment against the official register (segregation of duties vs executed_by_user_id)"
    roles: [RecordsSpecialist]
    code: 200
    input: [register_recordation_number]
    output: AssignmentRecord
    side_effects: ["status -> RECORDED; register_recordation_number set"]
  - method: POST
    path: "/assignments/{assignmentId}/record-rejection"
    description: "Record a register rejection (EXECUTED -> RECORDATION_REJECTED)"
    roles: [RecordsSpecialist]
    code: 200
    input: []
    output: AssignmentRecord
    side_effects: ["status -> RECORDATION_REJECTED"]

  # --- DocketAudit ---
  - method: POST
    path: "/applications/{applicationId}/audits"
    description: "Open a docket audit against an official register snapshot (half-open window overlap applies; variances computed at creation)"
    roles: [DocketingClerk, DocketingManager]
    code: 201
    input: [window_start, window_end, register_entries]
    output: DocketAudit
    side_effects: ["variances computed per docket_audit_variance; status = OPEN when no variances else VARIANCE_FOUND"]
  - method: GET
    path: "/applications/{applicationId}/audits"
    description: "List audits of an application"
    roles: [Any]
    code: 200
    input: []
    output: DocketAudit[]
    side_effects: []
  - method: GET
    path: "/audits/{auditId}"
    description: "Get an audit"
    roles: [Any]
    code: 200
    input: []
    output: DocketAudit
    side_effects: []
  - method: POST
    path: "/audits/{auditId}/resolve"
    description: "Resolve a variance-found audit"
    roles: [DocketingManager]
    code: 200
    input: [resolution_note]
    output: DocketAudit
    side_effects: ["status -> RESOLVED; resolution_note set"]
  - method: POST
    path: "/audits/{auditId}/close"
    description: "Close a clean audit"
    roles: [DocketingManager]
    code: 200
    input: []
    output: DocketAudit
    side_effects: ["status -> CLOSED_CLEAN"]

  # --- Flat filtered-list GETs (FK reverse-reachability, filtered-list form) ---
  - method: GET
    path: "/contacts"
    description: "List client contacts, optionally filtered by client"
    roles: [Any]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: ClientContact[]
    side_effects: []
  - method: GET
    path: "/inventors"
    description: "List inventors, optionally filtered by client"
    roles: [Any]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: Inventor[]
    side_effects: []
  - method: GET
    path: "/families"
    description: "List patent families, optionally filtered by client or status"
    roles: [Any]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: PatentFamily[]
    side_effects: []
  - method: GET
    path: "/docket-entries"
    description: "List docket entries, optionally filtered by application, status, or type; ordered by created_at ASC"
    roles: [Any]
    code: 200
    input: ["application_id?", "status?", "entry_type?", "limit?", "offset?"]
    output: DocketEntry[]
    side_effects: []
  - method: GET
    path: "/office-actions"
    description: "List office actions, optionally filtered by application or tracking entry"
    roles: [Any]
    code: 200
    input: ["application_id?", "docket_entry_id?", "limit?", "offset?"]
    output: OfficeAction[]
    side_effects: []
  - method: GET
    path: "/annuity-obligations"
    description: "List annuity obligations, optionally filtered by application or status; ordered by (application created_at ASC, period_year ASC)"
    roles: [Any]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: AnnuityObligation[]
    side_effects: []
  - method: GET
    path: "/authorizations"
    description: "List payment authorizations, optionally filtered by obligation or status"
    roles: [Any]
    code: 200
    input: ["annuity_obligation_id?", "status?", "limit?", "offset?"]
    output: PaymentAuthorization[]
    side_effects: []
  - method: GET
    path: "/instructions"
    description: "List outside counsel instructions, optionally filtered by application, firm, linked entry, or status"
    roles: [Any]
    code: 200
    input: ["application_id?", "counsel_firm_id?", "docket_entry_id?", "status?", "limit?", "offset?"]
    output: OutsideCounselInstruction[]
    side_effects: []
  - method: GET
    path: "/abandonment-reviews"
    description: "List abandonment reviews, optionally filtered by application or status"
    roles: [Any]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: AbandonmentReview[]
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List assignment records, optionally filtered by application or inventor membership (inventor_ids filter matches records containing the inventor)"
    roles: [Any]
    code: 200
    input: ["application_id?", "inventor_ids?", "limit?", "offset?"]
    output: AssignmentRecord[]
    side_effects: []
  - method: GET
    path: "/audits"
    description: "List docket audits, optionally filtered by application or status"
    roles: [Any]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: DocketAudit[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing, role undeclared, or entity-backed id does not resolve" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_SCOPE_VIOLATION, http: 403, condition: "Entity-backed actor outside resource scope (wrong client contact or wrong counsel firm)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, undeclared field, bad enum/date/type, or window_start >= window_end" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; all transitions rejected" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same user attempts both steps of a controlled pair (submit/approve, execute/record)" }
  - { id: ERR_COUNSEL_NOT_ACCREDITED, http: 422, condition: "Counsel firm lacks accreditation for the application's jurisdiction" }
  - { id: ERR_PRIORITY_WINDOW_EXPIRED, http: 422, condition: "Filing date beyond the Paris/PCT priority window (inclusive deadline exceeded)" }
  - { id: ERR_DEADLINE_PASSED, http: 422, condition: "Extension requested after current_due_date, or response filed after current_due_date" }
  - { id: ERR_SURCHARGE_WINDOW_CLOSED, http: 422, condition: "confirm-payment with paid_date beyond surcharge_window_end" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 409, condition: "New audit's half-open window intersects a non-terminal audit's window on the same application" }
  - { id: ERR_INSTRUCTION_EXCLUSIVE_CONFLICT, http: 409, condition: "Closed exclusivity window collides with a non-terminal instruction of same application+type (touching endpoints conflict)" }
  - { id: ERR_EXTENSION_NOT_ALLOWED_TYPE, http: 422, condition: "Extension requested on a non-OFFICE_ACTION_RESPONSE entry" }
  - { id: ERR_EXTENSION_LIMIT_REACHED, http: 422, condition: "extension_count already equals rule.max_extensions" }
  - { id: ERR_DUPLICATE_APPLICATION_NUMBER, http: 409, condition: "application_number already used by a non-WITHDRAWN application of the family" }
  - { id: ERR_PARENT_APPLICATION_LAPSED, http: 422, condition: "Proposed parent application is LAPSED" }
  - { id: ERR_PARENT_FAMILY_MISMATCH, http: 422, condition: "Proposed parent application belongs to a different family" }
  - { id: ERR_PRIORITY_CHAIN_CYCLE, http: 422, condition: "Continuation/divisional chain would be cyclic (defensive; existing chains are validated at creation)" }
  - { id: ERR_PARENT_NOT_PCT, http: 422, condition: "PCT_NATIONAL_PHASE requires parent application_type == PCT_INTERNATIONAL" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "A non-terminal AbandonmentReview already exists for the application" }
  - { id: ERR_ENTRY_NOT_CANCELLABLE, http: 409, condition: "Docket entry has a linked non-terminal outside counsel instruction" }
  - { id: ERR_INVENTOR_CLIENT_MISMATCH, http: 422, condition: "An inventor id belongs to a different client than the application" }
  - { id: ERR_AUTHORIZATION_NOT_RELEASED, http: 409, condition: "instruct-payment requires the current authorization in RELEASED" }
  - { id: ERR_ASSIGNMENT_RECORDATION_REQUIRED, http: 409, condition: "Jurisdiction rule requires a RECORDED assignment for grant or payment instruction" }
  - { id: ERR_COUNSEL_INSTRUCTION_REQUIRED, http: 409, condition: "Jurisdiction rule requires a CONFIRMED/COMPLETED ANNUITY_PAYMENT instruction before payment instruction" }
  - { id: ERR_FAMILY_BUDGET_EXCEEDED, http: 422, condition: "Approval would push committed_forecast_cents above budget_cap_cents (strictly greater than cap)" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "Write under a SUSPENDED client" }
  - { id: ERR_FAMILY_HAS_APPROVED_REVIEWS, http: 409, condition: "exit-pruning-review blocked while an APPROVED abandonment review exists in the family" }
  - { id: ERR_FAMILY_HAS_OPEN_APPLICATIONS, http: 409, condition: "Family close blocked while any application is non-terminal" }
  - { id: ERR_FAMILY_NOT_IN_PRUNING_REVIEW, http: 409, condition: "Abandonment review execute requires the family in PRUNING_REVIEW" }
  - { id: ERR_APPLICATION_NOT_OPEN, http: 409, condition: "Operation requires the application in a non-terminal, operation-specific status set" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Firm operations administrator; owns configuration, clock, clients, counsel registry, and the docket sweep"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /docket-sweeps"
      - "POST /jurisdiction-rules, PATCH /jurisdiction-rules/{id}"
      - "POST /clients, POST /clients/{id}/suspend, POST /clients/{id}/reactivate"
      - "POST /clients/{id}/contacts"
      - "POST /counsel-firms"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: DocketingClerk
    description: "Docketing staff; manages applications, docket entries, office actions, instructions, audits"
    identity: opaque
    exclusive_operations:
      - "POST /families/{id}/applications and application transitions (file, grant, record-lapse, withdraw)"
      - "POST /applications/{id}/docket-entries and entry transitions (start, request-extension, record-response, record-rejection, complete)"
      - "POST /applications/{id}/office-actions, POST /office-actions/{id}/close-informational"
      - "POST /instructions/{id}/send, POST /instructions/{id}/complete"
    shared_operations:
      - "POST /applications/{id}/instructions, POST /instructions/{id}/cancel (shared with DocketingManager)"
      - "POST /applications/{id}/audits (shared with DocketingManager)"
      - "all GET endpoints (via Any)"
  - name: DocketingManager
    description: "Docketing manager; owns families, pruning reviews, entry cancellation; segregation-of-duties enforced on review approve/reject"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/families and family transitions (enter/exit-pruning-review, close)"
      - "POST /docket-entries/{id}/cancel"
      - "POST /applications/{id}/abandonment-reviews and review transitions (submit, approve, reject, execute)"
      - "POST /annuity-obligations/{id}/deauthorize"
      - "POST /audits/{id}/resolve, POST /audits/{id}/close"
    shared_operations:
      - "POST /annuity-obligations/{id}/authorizations (shared with FinanceOfficer)"
      - "POST /applications/{id}/instructions, POST /instructions/{id}/cancel (shared with DocketingClerk)"
      - "POST /applications/{id}/audits (shared with DocketingClerk)"
      - "all GET endpoints (via Any)"
  - name: RecordsSpecialist
    description: "Records/recordation specialist; owns inventors and assignment recordation; execute and record must be different users"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/inventors"
      - "POST /applications/{id}/assignments and assignment transitions (execute, record, record-rejection)"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: FinanceOfficer
    description: "Finance staff; requests authorizations, releases funds, instructs and confirms annuity payments"
    identity: opaque
    exclusive_operations:
      - "POST /authorizations/{id}/release"
      - "POST /annuity-obligations/{id}/instruct-payment, raise-confirmation-query, reinstruct, confirm-payment"
    shared_operations:
      - "POST /annuity-obligations/{id}/authorizations (shared with DocketingManager)"
      - "all GET endpoints (via Any)"
  - name: ClientApprover
    description: "Client-side approver; X-User-ID must be a ClientContact id whose client matches the resource's family client"
    identity: "entity_backed:ClientContact"
    exclusive_operations:
      - "POST /authorizations/{id}/approve"
      - "POST /authorizations/{id}/reject"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: OutsideCounsel
    description: "Outside counsel firm user; X-User-ID must be the CounselFirm id of the instructed firm"
    identity: "entity_backed:CounselFirm"
    exclusive_operations:
      - "POST /instructions/{id}/acknowledge"
      - "POST /instructions/{id}/confirm"
      - "POST /instructions/{id}/decline"
    shared_operations: ["all GET endpoints (via Any)"]
  - name: Any
    description: "Any authenticated user; read-only shared surface"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
