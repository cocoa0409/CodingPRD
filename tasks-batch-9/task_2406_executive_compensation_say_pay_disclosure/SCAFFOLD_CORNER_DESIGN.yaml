      - name: a_peer_inside_both_declared_size_bands_is_accepted_under_size_match
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_42_ERR_PEER_OUTSIDE_SIZE_BAND
          - calculations.peer_size_band_fit
          - entities.PeerGroupMember.fields.in_size_band
          - endpoints[POST /exec-comp/peer-groups/{id}/members]
        distinguishing_aspect: |
          The size-band rule is satisfied rather than violated: CHRL's revenue ratio 1.2000 and market-cap ratio
          1.5000 both sit inside the declared bands, so the plain SIZE_MATCH reason is accepted with no waiver, the
          row is stored with in_size_band true, and the group's accepted_member_count reaches 1.
        test_recipe:
          setup:
            - "ACME issuer (revenue 10,000,000,000, market cap 20,000,000,000) and CHRL peer (revenue 12,000,000,000, market cap 30,000,000,000)."
            - "A DRAFT RAW_MEDIAN peer group with no members."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
              captures: { mem_c: $.data.id }
          assert:
            - "HTTP status == 201"
            - "PeerGroupMember.${mem_c}.status == ACCEPTED and inclusion_reason == SIZE_MATCH"
            - "PeerGroupMember.${mem_c}.revenue_ratio == 1.2000 and market_cap_ratio == 1.5000"
            - "PeerGroupMember.${mem_c}.in_size_band == true"
            - "PeerGroup.${pg_id}.accepted_member_count == 1 and version == 2"

      - name: program_approval_requires_the_metric_weights_to_total_exactly_one_hundred
        claim_type: aggregate_validation
        grounds:
          - validations.priority_41_ERR_METRIC_WEIGHTS_NOT_100
          - errors[ERR_METRIC_WEIGHTS_NOT_100]
          - state_machines.PayProgram.design_status_DRAFT_to_COMMITTEE_APPROVED
        distinguishing_aspect: |
          Each metric passes its own field validation (every weight is a legal positive percentage) but the
          collective sum is what gates approval: 60.00 + 30.00 = 90.00 is rejected with ERR_METRIC_WEIGHTS_NOT_100
          (422) and leaves both metrics DRAFT, then adding a 10.00-weight metric makes the same approval call succeed
          and locks all three.
        test_recipe:
          setup:
            - "MINI fixture with DRAFT PayProgram P1."
            - "Two DRAFT ANNUAL_INCENTIVE metrics: ADJ_EPS weight 60.00 and REVENUE_GROWTH weight 30.00 (curves 4/5/6 LINEAR)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
