# =============================================================================
# SCAFFOLD.yaml — Correspondent Banking & Respondent Due Diligence
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# (§1.8 / §1.9 live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2499. Correspondent Banking & Respondent Due Diligence (correspondent bank financial institutions group): respondent bank onboarding with ownership, licensing and regulatory standing verification, questionnaire collection and control assessment of the respondent's compliance program, nested/downstream correspondent relationship discovery and prohibition rules, transaction monitoring calibrated to expected activity and corridor risk, periodic refresh cadence by risk rating with adverse media triggers, request-for-information response times and unresponsive respondent escalation, relationship termination and orderly account closure planning, sanctioned jurisdiction restrictions and payment screening

domain_name: correspondent-banking-due-diligence
api_prefix: /correspondent-banking

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - contagion_risk_propagation
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # RespondentBank rows reference each other through NestedRelationship
  # (downstream_respondent_bank_id), BeneficialOwner rows form ownership trees
  # through parent_owner_id, and JurisdictionProfile is referenced by natural key
  # from five entities. Nesting in URL paths exists only for creation
  # convenience; every entity is addressable as a flat collection.

  state_machine_shape: parallel
  # RespondentBank carries two independent state dimensions on the same row
  # (dd_state x payment_posture). DueDiligenceQuestionnaire, InformationRequest,
  # TransactionMonitoringProfile, BeneficialOwner and NestedRelationship each
  # contain at least one cycle. ClosurePlan and MonitoringAlert branch.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # The ComplianceAnalyst who records the control assessment / risk assessment
  # may never be the CommitteeApprover who approves the respondent or the
  # closure plan; the SanctionsOfficer owns payment screening exclusively.

  consistency_model: immediate
  # Every cascade in §1.2 completes inside the triggering request. The only
  # deferred work is the operator-driven sweep (POST /correspondent-banking/refresh-sweeps), which is
  # an explicit epoch-advancing endpoint, not background reconciliation.

  difficulty_level: expert_plus
  # 14 entities · 69 endpoints · 20 calculations (4 carrying
  # divergent variants, 2 of them true dual-variant calculations over the same
  # stored data) · 12 state machines across 12 dimensions and 98 declared
  # transitions · 36 priority-ordered validations
  # spanning priority bands 1..43 · 74 error codes · 2 OCC rules.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- config ---
  - name: JurisdictionProfile
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 uppercase code; natural key used by RespondentBank.home_jurisdiction_code, NestedRelationship.downstream_jurisdiction_code, ActivityObservation.corridor_jurisdiction_code, PaymentInstruction.ordering_jurisdiction_code and PaymentInstruction.beneficiary_jurisdiction_code"
        constraints: "exactly 2 uppercase ASCII letters; unique across all JurisdictionProfile rows"
      - name: name
        type: string
        source: input
        description: "human-readable jurisdiction name"
        constraints: "1..120 chars"
      - name: sanctions_status
        type: enum
        source: input
        description: "sanctions posture of the jurisdiction"
        default: PERMITTED
        constraints: "one of {PERMITTED, RESTRICTED, COMPREHENSIVELY_SANCTIONED}"
      - name: fatf_listing
        type: enum
        source: input
        description: "FATF list membership"
        default: NONE
        constraints: "one of {NONE, INCREASED_MONITORING, CALL_FOR_ACTION}"
      - name: basel_aml_index
        type: number
        source: input
        description: "Basel AML index score for the jurisdiction"
        constraints: "0.00 <= basel_aml_index <= 10.00, 2 decimals"
      - name: secrecy_flag
        type: boolean
        source: input
        description: "true when the jurisdiction is designated a bank-secrecy haven"
        default: false
      - name: corridor_risk_weight
        type: number
        source: input
        description: "divisor applied to expected corridor activity when calibrating monitoring thresholds; higher weight means tighter threshold"
        constraints: "0.50 <= corridor_risk_weight <= 2.50, 2 decimals"
      - name: nested_correspondent_prohibited
        type: boolean
        source: input
        description: "true when downstream/nested correspondent service into this jurisdiction is prohibited by policy"
        default: false
      - name: max_permitted_risk_rating
        type: enum
        source: input
        description: "worst respondent risk_rating that may still be approved for a respondent domiciled in this jurisdiction; ordered LOW < MEDIUM < HIGH < PROHIBITED"
        default: HIGH
        constraints: "one of {LOW, MEDIUM, HIGH, PROHIBITED}"
      - name: jurisdiction_risk_points
        type: number
        source: computed
        description: "0.00..40.00 risk contribution of this jurisdiction; recomputed by calculations.jurisdiction_risk_points on create and on PATCH"
        constraints: "2 decimals, round_half_up"

  # ------------------------------------------------------------- respondent --
  - name: RespondentBank
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "registered legal name of the respondent financial institution"
        constraints: "1..160 chars"
      - name: swift_bic
        type: string
        source: input
        description: "SWIFT BIC of the respondent"
        constraints: "8 or 11 uppercase alphanumerics; unique across RespondentBank rows"
      - name: home_jurisdiction_code
        type: string
        source: input
        description: "natural-key reference to JurisdictionProfile.jurisdiction_code of the respondent's licensing jurisdiction"
        constraints: "a JurisdictionProfile with this jurisdiction_code must exist"
      - name: relationship_manager_user_id
        type: string
        source: input
        description: "opaque X-User-ID of the FIGRelationshipManager who owns the relationship"
      - name: dd_state
        type: enum
        source: system
        description: "due-diligence lifecycle dimension; see state_machines[entity=RespondentBank, dimension=dd_state]"
        default: PROSPECT
        constraints: "one of {PROSPECT, DD_IN_PROGRESS, PENDING_COMMITTEE, APPROVED, DECLINED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE, RESTRICTED, EXITING, TERMINATED}"
      - name: payment_posture
        type: enum
        source: system
        description: "payment-handling dimension, evolving independently of dd_state; see state_machines[entity=RespondentBank, dimension=payment_posture]"
        default: BLOCKED
        constraints: "one of {OPEN, SCREEN_ONLY, WIND_DOWN_ONLY, BLOCKED}"
      - name: license_status
        type: enum
        source: input
        description: "licensing standing recorded by the last licensing verification"
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, ACTIVE, CONDITIONAL, SUSPENDED, REVOKED}"
      - name: regulator_name
        type: string
        source: input
        description: "primary prudential regulator name recorded by licensing verification"
      - name: regulator_standing
        type: enum
        source: input
        description: "regulatory standing recorded by the last licensing verification"
        default: UNVERIFIED
        constraints: "one of {UNVERIFIED, GOOD_STANDING, UNDER_ENFORCEMENT, DEREGISTERED}"
      - name: license_verified_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent successful licensing verification; null until first verification"
      - name: expected_monthly_volume_usd
        type: number
        source: input
        description: "respondent-declared expected aggregate monthly USD flow across all corridors"
        default: 0
        constraints: ">= 0, 2 decimals"
      - name: expected_monthly_count
        type: integer
        source: input
        description: "respondent-declared expected monthly payment count across all corridors"
        default: 0
        constraints: ">= 0"
      - name: nested_activity_permitted
        type: boolean
        source: input
        description: "true when the respondent is contractually permitted to serve downstream correspondents through the account"
        default: false
      - name: verified_ownership_pct
        type: number
        source: computed
        description: "sum of ownership_pct over direct BeneficialOwner rows (parent_owner_id IS NULL) with verification_status == VERIFIED; recomputed by calculations.ownership_verification_rollup"
        default: 0
        constraints: "0.00..100.00, 2 decimals"
      - name: control_chain_complete
        type: boolean
        source: computed
        description: "true when every VERIFIED direct owner with owner_type == LEGAL_ENTITY and ownership_pct >= 25.00 has at least one VERIFIED child BeneficialOwner; recomputed by calculations.ownership_verification_rollup"
        default: false
      - name: ownership_verified
        type: boolean
        source: computed
        description: "verified_ownership_pct >= 75.00 AND control_chain_complete == true; recomputed by calculations.ownership_verification_rollup"
        default: false
      - name: disclosed_nested_count
        type: integer
        source: computed
        description: "count of NestedRelationship rows for this respondent in states {DISCLOSED, CONFIRMED}; recomputed by calculations.nested_exposure_rollup"
        default: 0
      - name: undisclosed_nested_count
        type: integer
        source: computed
        description: "count of NestedRelationship rows for this respondent in state UNDISCLOSED_DETECTED; recomputed by calculations.nested_exposure_rollup"
        default: 0
      - name: max_nested_depth
        type: integer
        source: computed
        description: "maximum depth over NestedRelationship rows of this respondent in states {DISCLOSED, UNDISCLOSED_DETECTED, CONFIRMED, SUSPENDED}; 0 when there are none"
        default: 0
      - name: nested_exposure_units
        type: integer
        source: computed
        description: "conserved exposure quantity; sum over NestedRelationship rows of state_weight * depth per calculations.nested_exposure_rollup"
        default: 0
      - name: inherent_risk_score
        type: number
        source: computed
        description: "0.00..100.00 pre-control risk; written by calculations.inherent_risk_score"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: control_score
        type: number
        source: computed
        description: "20.00..100.00 weighted control-effectiveness score written by calculations.control_score; 0 until the first control assessment run"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: control_credit
        type: number
        source: computed
        description: "fractional risk reduction derived from control_score by calculations.residual_risk_score"
        default: 0
        constraints: "0.0000..0.4500, 4 decimals"
      - name: adverse_media_uplift
        type: number
        source: computed
        description: "0.00..20.00 uplift from CONFIRMED AdverseMediaEvent rows inside the current lookback window; written by calculations.adverse_media_uplift"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: residual_risk_score
        type: number
        source: computed
        description: "post-control risk written by calculations.residual_risk_score"
        default: 0
        constraints: "0.00..120.00, 2 decimals, round_half_up"
      - name: risk_rating
        type: enum
        source: computed
        description: "live rating derived from residual_risk_score by calculations.risk_rating_assignment"
        default: UNRATED
        constraints: "one of {UNRATED, LOW, MEDIUM, HIGH, PROHIBITED}"
      - name: risk_assessment_variant
        type: enum
        source: system
        description: "which variant produced the current scores; set by POST /correspondent-banking/respondents/{respondentId}/risk-assessment"
        default: NONE
        constraints: "one of {NONE, ONBOARDING_PROVISIONAL, REFRESH_FINAL}"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who ran the most recent risk assessment; segregation-of-duties comparand"
      - name: approved_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the CommitteeApprover who recorded the most recent approval decision"
      - name: approved_risk_rating
        type: enum
        source: system
        description: "risk_rating frozen at the moment of the most recent APPROVE decision; drives the base refresh cadence and is deliberately NOT refreshed when risk_rating moves"
        default: UNRATED
        constraints: "one of {UNRATED, LOW, MEDIUM, HIGH, PROHIBITED}"
      - name: last_approved_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent APPROVE decision or refresh completion; null before first approval"
      - name: refresh_due_date
        type: datetime
        source: computed
        description: "next periodic-refresh deadline written by calculations.refresh_due_date; null while last_approved_at is null"
      - name: unresponsive_strikes
        type: integer
        source: computed
        description: "count of InformationRequest overdue events not retro-credited; see calculations.unresponsive_strike_ledger"
        default: 0
        constraints: ">= 0"
      - name: escalation_units
        type: integer
        source: computed
        description: "conserved escalation quantity; sum of escalation_level over InformationRequest rows of this respondent in states {SENT, OVERDUE, ESCALATED}"
        default: 0
        constraints: ">= 0"
      - name: restriction_reason
        type: enum
        source: system
        description: "why the respondent is RESTRICTED; null when dd_state != RESTRICTED"
        constraints: "one of {UNRESPONSIVE_STRIKES, ADVERSE_MEDIA, SANCTIONS_EXPOSURE, PROHIBITED_NESTING, REFRESH_LAPSED, LICENSE_LAPSE, OFFICER_ACTION}"
      - name: last_risk_assessed_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent POST /correspondent-banking/respondents/{respondentId}/risk-assessment; compared against PeriodicRefresh.started_at when a refresh cycle completes"

  # -------------------------------------------------------------- ownership --
  - name: BeneficialOwner
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent whose ownership tree this node belongs to"
      - name: parent_owner_id
        type: string
        source: input
        description: "FK -> BeneficialOwner.id; null for a direct owner of the respondent, otherwise the owner one level up the chain (self-referential ownership tree)"
        default: null
        constraints: "when present must belong to the same respondent_bank_id; chain must stay acyclic and at most 4 levels deep"
      - name: owner_name
        type: string
        source: input
        description: "name of the owning person or entity"
        constraints: "1..160 chars"
      - name: owner_type
        type: enum
        source: input
        description: "nature of the owner"
        constraints: "one of {NATURAL_PERSON, LEGAL_ENTITY, STATE}"
      - name: ownership_pct
        type: number
        source: input
        description: "percentage this node holds of its immediate parent (of the respondent when parent_owner_id is null)"
        constraints: "0.01 <= ownership_pct <= 100.00, 2 decimals"
      - name: country_of_residence
        type: string
        source: input
        description: "natural-key reference to JurisdictionProfile.jurisdiction_code for the owner's residence or incorporation"
        constraints: "a JurisdictionProfile with this jurisdiction_code must exist"
      - name: is_pep
        type: boolean
        source: input
        description: "true when the owner is a politically exposed person or an immediate associate"
        default: false
      - name: chain_depth
        type: integer
        source: computed
        description: "1 for a direct owner, parent.chain_depth + 1 otherwise; written at creation"
        constraints: "1..4"
      - name: effective_ownership_pct
        type: number
        source: computed
        description: "look-through stake in the respondent per calculations.effective_ownership_pct; single rounding at the end of the chain product"
        constraints: "0.00..100.00, 2 decimals, round_half_up"
      - name: verification_status
        type: enum
        source: system
        description: "verification lifecycle; see state_machines[entity=BeneficialOwner]"
        default: PENDING
        constraints: "one of {PENDING, VERIFIED, REJECTED}"
      - name: verified_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who set verification_status; null while PENDING"
      - name: rejection_reason
        type: enum
        source: system
        description: "why verification was refused; null unless verification_status == REJECTED"
        constraints: "one of {DOCUMENT_MISSING, IDENTITY_MISMATCH, SANCTIONS_HIT, REFUSED_DISCLOSURE}"

  # ---------------------------------------------------- questionnaire block --
  - name: DueDiligenceQuestionnaire
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent that owns this questionnaire"
      - name: questionnaire_version
        type: string
        source: input
        description: "issuer's CDDQ template version label, e.g. WOLFSBERG_V1_4"
        constraints: "1..40 chars"
      - name: state
        type: enum
        source: system
        description: "questionnaire lifecycle; see state_machines[entity=DueDiligenceQuestionnaire]"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_ASSESSMENT, RETURNED_FOR_CLARIFICATION, ASSESSED, SUPERSEDED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent submission (overwritten on each resubmission after a clarification return)"
      - name: assessed_at
        type: datetime
        source: system
        description: "logical-clock instant the questionnaire reached ASSESSED"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who recorded the assessment decision"
      - name: clarification_rounds
        type: integer
        source: computed
        description: "number of times this questionnaire went UNDER_ASSESSMENT -> RETURNED_FOR_CLARIFICATION"
        default: 0
        constraints: "0..3; a 4th return attempt is refused"
      - name: declared_nested_activity
        type: boolean
        source: input
        description: "respondent's own declaration that it provides downstream correspondent services"
        default: false
      - name: declared_downstream_count
        type: integer
        source: input
        description: "respondent's declared number of downstream correspondents"
        default: 0
        constraints: ">= 0"
      - name: computed_control_score
        type: number
        source: computed
        description: "control score produced by calculations.control_score at the moment this questionnaire reached ASSESSED; 0 before that"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: control_score_variant
        type: enum
        source: system
        description: "which control_score variant produced computed_control_score"
        default: NONE
        constraints: "one of {NONE, ONBOARDING_PROVISIONAL, REFRESH_FINAL}"

  - name: ControlAssessment
    parent: DueDiligenceQuestionnaire
    common_fields: true
    fields:
      - name: questionnaire_id
        type: string
        source: input
        description: "FK -> DueDiligenceQuestionnaire.id; the questionnaire this control-domain assessment belongs to"
      - name: control_domain
        type: enum
        source: input
        description: "which control domain of the respondent's compliance program is assessed"
        constraints: "one of {GOVERNANCE, KYC_ONBOARDING, TRANSACTION_MONITORING, SANCTIONS_SCREENING, PEP_HANDLING, TRAINING, AUDIT, NESTED_CONTROLS}; at most one row per (questionnaire_id, control_domain)"
      - name: self_rating
        type: integer
        source: input
        description: "respondent's own 1..5 rating of the domain, transcribed from the questionnaire"
        constraints: "1..5"
      - name: assessed_rating
        type: integer
        source: input
        description: "analyst's 1..5 rating of the domain; null when the analyst recorded the row without an independent rating"
        default: null
        constraints: "1..5 when present"
      - name: domain_weight
        type: number
        source: computed
        description: "fixed weight of control_domain taken from calculations.control_score constants; stamped at creation"
        constraints: "4 decimals"
      - name: gap_severity
        type: enum
        source: input
        description: "severity of the control gap the analyst identified in this domain"
        default: NONE
        constraints: "one of {NONE, MINOR, MAJOR, CRITICAL}"
      - name: remediation_required
        type: boolean
        source: computed
        description: "true when gap_severity IN {MAJOR, CRITICAL}"
        default: false
      - name: evidence_note
        type: string
        source: input
        description: "free-text evidence reference recorded by the analyst"
        default: ""
        constraints: "0..500 chars"

  # ------------------------------------------------------------ nesting graph -
  - name: NestedRelationship
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent that provides the downstream correspondent service"
      - name: downstream_respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; set when the downstream institution is itself an onboarded respondent, enabling multi-hop chain traversal; null for an off-book downstream institution"
        default: null
      - name: downstream_institution_name
        type: string
        source: input
        description: "name of the downstream institution served through the respondent"
        constraints: "1..160 chars"
      - name: downstream_jurisdiction_code
        type: string
        source: input
        description: "natural-key reference to JurisdictionProfile.jurisdiction_code of the downstream institution"
        constraints: "a JurisdictionProfile with this jurisdiction_code must exist"
      - name: relationship_type
        type: enum
        source: input
        description: "nature of the nested arrangement"
        constraints: "one of {DOWNSTREAM_CORRESPONDENT, PAYABLE_THROUGH, NESTED_PSP}"
      - name: discovery_source
        type: enum
        source: input
        description: "how the relationship came to light; QUESTIONNAIRE means voluntarily disclosed, anything else means detected"
        constraints: "one of {QUESTIONNAIRE, TRANSACTION_MONITORING, RFI, ADVERSE_MEDIA}"
      - name: state
        type: enum
        source: system
        description: "disclosure/adjudication lifecycle; see state_machines[entity=NestedRelationship]"
        default: DISCLOSED
        constraints: "one of {DISCLOSED, UNDISCLOSED_DETECTED, CONFIRMED, PROHIBITED, SUSPENDED, TERMINATED}"
      - name: depth
        type: integer
        source: computed
        description: "hop count from the respondent to the downstream institution per calculations.nested_chain_depth; 1 for a direct downstream"
        constraints: "1..4"
      - name: prohibition_reason
        type: enum
        source: system
        description: "single winning reason the relationship is PROHIBITED, chosen by the precedence ladder in calculations.nested_prohibition_precedence; null unless state == PROHIBITED"
        constraints: "one of {CYCLE, SANCTIONED_JURISDICTION, JURISDICTION_PROHIBITS_NESTING, DEPTH_EXCEEDED, PAYABLE_THROUGH_NOT_PERMITTED}"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the analyst or officer who last adjudicated this relationship"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "logical-clock instant of the last adjudication"

  # --------------------------------------------------------- monitoring block -
  - name: TransactionMonitoringProfile
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent whose expected activity this profile calibrates"
      - name: effective_from
        type: datetime
        source: input
        description: "first instant the profile governs monitoring; CLOSED interval start"
      - name: effective_to
        type: datetime
        source: input
        description: "last instant the profile governs monitoring; CLOSED interval end, so a profile ending exactly when another starts is an overlap"
        constraints: "effective_to > effective_from"
      - name: tolerance_pct
        type: number
        source: input
        description: "fractional headroom added to expected activity before a corridor threshold is set"
        default: 0.15
        constraints: "0.00 <= tolerance_pct <= 0.50, 2 decimals"
      - name: expected_corridors
        type: array
        source: input
        description: "array of {jurisdiction_code, expected_monthly_usd, expected_monthly_count} objects declaring the expected corridor footprint"
        constraints: "1..8 entries; jurisdiction_code unique within the array and each must have a JurisdictionProfile; expected_monthly_usd >= 0.00; expected_monthly_count >= 0"
      - name: calibration_state
        type: enum
        source: system
        description: "calibration lifecycle; see state_machines[entity=TransactionMonitoringProfile]"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, CALIBRATED, RECALIBRATION_REQUIRED, SUPERSEDED}"
      - name: corridor_thresholds
        type: array
        source: computed
        description: "array of {jurisdiction_code, usd_threshold, count_threshold} written by calculations.monitoring_threshold_calibration; empty while PROVISIONAL"
        default: []
      - name: aggregate_usd_threshold
        type: number
        source: computed
        description: "aggregate monthly USD alerting threshold written by calculations.monitoring_threshold_calibration"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: hold_threshold_usd
        type: number
        source: computed
        description: "single-payment hold threshold; round(aggregate_usd_threshold / 10, 2) written by calculations.monitoring_threshold_calibration"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: calibrated_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent successful calibration; null while never calibrated"
      - name: calibrated_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who calibrated the profile"
      - name: recalibration_reason
        type: enum
        source: system
        description: "why the profile fell back to RECALIBRATION_REQUIRED; null otherwise"
        constraints: "one of {ALERT_ESCALATION, NESTED_DISCOVERY, REFRESH_COMPLETION, OFFICER_ACTION}"

  - name: ActivityObservation
    parent: TransactionMonitoringProfile
    common_fields: true
    fields:
      - name: monitoring_profile_id
        type: string
        source: input
        description: "FK -> TransactionMonitoringProfile.id; the profile the observation is evaluated against"
      - name: period_month
        type: string
        source: input
        description: "calendar month of the observed activity"
        constraints: "YYYY-MM format; at most one row per (monitoring_profile_id, period_month, corridor_jurisdiction_code)"
      - name: corridor_jurisdiction_code
        type: string
        source: input
        description: "natural-key reference to JurisdictionProfile.jurisdiction_code identifying the observed corridor"
        constraints: "a JurisdictionProfile with this jurisdiction_code must exist"
      - name: aggregate_usd
        type: number
        source: input
        description: "observed aggregate USD flow for the corridor in period_month"
        constraints: ">= 0.00, 2 decimals"
      - name: txn_count
        type: integer
        source: input
        description: "observed payment count for the corridor in period_month"
        constraints: ">= 0"
      - name: distinct_downstream_count
        type: integer
        source: input
        description: "number of distinct downstream institutions observed behind the respondent in this corridor"
        default: 0
        constraints: ">= 0"
      - name: usd_threshold_applied
        type: number
        source: computed
        description: "corridor usd_threshold in force when the observation was evaluated; 0.00 when the corridor was unexpected"
        constraints: "2 decimals"
      - name: count_threshold_applied
        type: integer
        source: computed
        description: "corridor count_threshold in force when the observation was evaluated; 0 when the corridor was unexpected"
      - name: breach_ratio
        type: number
        source: computed
        description: "round(aggregate_usd / usd_threshold_applied, 4) when usd_threshold_applied > 0, else 0.0000"
        constraints: "4 decimals, round_half_up"
      - name: alerts_created_count
        type: integer
        source: computed
        description: "how many MonitoringAlert rows this observation produced"
        default: 0

  - name: MonitoringAlert
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent the alert concerns"
      - name: activity_observation_id
        type: string
        source: input
        description: "FK -> ActivityObservation.id; the observation that produced the alert; null for an officer-raised alert"
        default: null
      - name: alert_type
        type: enum
        source: system
        description: "why the alert fired"
        constraints: "one of {CORRIDOR_UNEXPECTED, VOLUME_BREACH, COUNT_BREACH, NESTED_ACTIVITY_UNDISCLOSED}"
      - name: severity
        type: enum
        source: computed
        description: "alert severity assigned by calculations.alert_generation; drives InformationRequest SLA"
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: state
        type: enum
        source: system
        description: "alert lifecycle; see state_machines[entity=MonitoringAlert]"
        default: OPEN
        constraints: "one of {OPEN, UNDER_INVESTIGATION, ESCALATED, CLOSED_FALSE_POSITIVE, CLOSED_CONFIRMED}"
      - name: breach_ratio
        type: number
        source: computed
        description: "copy of ActivityObservation.breach_ratio at alert creation; 0.0000 for officer-raised alerts"
        constraints: "4 decimals"
      - name: investigated_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who opened the investigation"
      - name: disposition_reason
        type: enum
        source: system
        description: "reason recorded with the terminal disposition; null while non-terminal"
        constraints: "one of {DATA_QUALITY, EXPECTED_SEASONALITY, RESPONDENT_EXPLAINED, UNRESOLVED_RISK, PROHIBITED_NESTING}"
      - name: escalated_at
        type: datetime
        source: system
        description: "logical-clock instant the alert reached ESCALATED"

  # --------------------------------------------------------------- RFI block --
  - name: InformationRequest
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent being asked"
      - name: monitoring_alert_id
        type: string
        source: input
        description: "FK -> MonitoringAlert.id; the alert that motivated the request; null for a due-diligence RFI"
        default: null
      - name: request_topic
        type: enum
        source: input
        description: "subject of the request"
        constraints: "one of {OWNERSHIP_EVIDENCE, LICENSING_EVIDENCE, NESTED_DISCLOSURE, ACTIVITY_EXPLANATION, CONTROL_REMEDIATION}"
      - name: severity
        type: enum
        source: input
        description: "urgency driving the response SLA; when monitoring_alert_id is set it must equal that alert's severity"
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: state
        type: enum
        source: system
        description: "request lifecycle; see state_machines[entity=InformationRequest]"
        default: DRAFT
        constraints: "one of {DRAFT, SENT, RESPONDED, ACCEPTED, OVERDUE, ESCALATED, ABANDONED}"
      - name: dispatched_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent dispatch (re-dispatch overwrites)"
      - name: sla_hours
        type: integer
        source: computed
        description: "response window in whole hours written by calculations.rfi_response_sla at each dispatch"
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: "dispatched_at + sla_hours; the instant at which the request becomes OVERDUE (>= comparison)"
      - name: escalation_level
        type: integer
        source: computed
        description: "0..3 escalation ladder position; contributes to RespondentBank.escalation_units while state IN {SENT, OVERDUE, ESCALATED}"
        default: 0
        constraints: "0..3"
      - name: reminder_count
        type: integer
        source: computed
        description: "how many times a sweep marked this request OVERDUE"
        default: 0
      - name: insufficiency_rounds
        type: integer
        source: computed
        description: "how many times the analyst judged a response insufficient and re-opened the request"
        default: 0
        constraints: "0..2; a 3rd insufficiency is refused"
      - name: responded_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent respondent response"
      - name: response_note
        type: string
        source: input
        description: "respondent's narrative response, overwritten on each response"
        default: ""
        constraints: "0..1000 chars"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who last adjudicated the response"
      - name: retro_credited
        type: boolean
        source: system
        description: "true when acceptance retro-credited the unresponsive strikes this request accrued"
        default: false

  # ----------------------------------------------------- adverse media block --
  - name: AdverseMediaEvent
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent the media item concerns"
      - name: headline
        type: string
        source: input
        description: "short description of the media item"
        constraints: "1..200 chars"
      - name: category
        type: enum
        source: input
        description: "nature of the allegation"
        constraints: "one of {SANCTIONS_EVASION, MONEY_LAUNDERING, FRAUD, REGULATORY_ACTION, LITIGATION, OTHER}"
      - name: severity_tier
        type: enum
        source: input
        description: "severity tier of the item; TIER_1 is the gravest"
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: source_reliability
        type: enum
        source: input
        description: "reliability grade of the source; discounts the uplift points"
        constraints: "one of {A, B, C}"
      - name: event_date
        type: datetime
        source: input
        description: "instant the underlying event was published; compared against the refresh lookback window"
      - name: adjudication_state
        type: enum
        source: system
        description: "triage lifecycle; see state_machines[entity=AdverseMediaEvent]"
        default: NEW
        constraints: "one of {NEW, CONFIRMED, DISMISSED}"
      - name: uplift_points
        type: number
        source: computed
        description: "per-event uplift written by calculations.adverse_media_uplift when the item is CONFIRMED; 0.00 while NEW or DISMISSED"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: triaged_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the ComplianceAnalyst who triaged the item"
      - name: triaged_at
        type: datetime
        source: system
        description: "logical-clock instant of triage"

  # ---------------------------------------------------------- refresh block ---
  - name: PeriodicRefresh
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent being refreshed"
      - name: trigger_reason
        type: enum
        source: input
        description: "why this refresh cycle exists"
        constraints: "one of {CADENCE, ADVERSE_MEDIA, ALERT_ESCALATION, NESTED_DISCOVERY, REGULATOR_ACTION}"
      - name: window_start
        type: datetime
        source: input
        description: "HALF-OPEN interval start of the refresh window; a window starting exactly when another ends does NOT overlap"
      - name: scheduled_due_date
        type: datetime
        source: input
        description: "HALF-OPEN interval end of the refresh window and the deadline for completion"
        constraints: "scheduled_due_date > window_start"
      - name: state
        type: enum
        source: system
        description: "refresh lifecycle; see state_machines[entity=PeriodicRefresh]"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, LAPSED, CANCELLED}"
      - name: cadence_months_applied
        type: integer
        source: computed
        description: "base cadence in months used when this cycle was scheduled, taken from calculations.refresh_due_date constants"
        default: 0
      - name: rating_at_schedule
        type: enum
        source: system
        description: "RespondentBank.risk_rating captured when the cycle was created"
        constraints: "one of {UNRATED, LOW, MEDIUM, HIGH, PROHIBITED}"
      - name: started_at
        type: datetime
        source: system
        description: "logical-clock instant the cycle moved to IN_PROGRESS"
      - name: completed_at
        type: datetime
        source: system
        description: "logical-clock instant the cycle reached COMPLETED"
      - name: lapsed_at
        type: datetime
        source: system
        description: "logical-clock instant a sweep marked the cycle LAPSED"
      - name: completed_control_score
        type: number
        source: computed
        description: "RespondentBank.control_score at completion, copied for audit"
        default: 0
        constraints: "2 decimals"
      - name: completion_risk_rating
        type: enum
        source: system
        description: "RespondentBank.risk_rating at completion, copied for audit"
        constraints: "one of {UNRATED, LOW, MEDIUM, HIGH, PROHIBITED}"
      - name: cancelled_reason
        type: enum
        source: system
        description: "why a SCHEDULED cycle was cancelled; null otherwise"
        constraints: "one of {SUPERSEDED_BY_ACCELERATION, RELATIONSHIP_EXITING}"

  # ---------------------------------------------------------- payment block ---
  - name: PaymentInstruction
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent that submitted the instruction"
      - name: nested_relationship_id
        type: string
        source: input
        description: "FK -> NestedRelationship.id; the nested arrangement the payment flows through; null when involves_nested_party is false"
        default: null
      - name: ordering_jurisdiction_code
        type: string
        source: input
        description: "natural-key reference to JurisdictionProfile.jurisdiction_code of the ordering party"
        constraints: "a JurisdictionProfile with this jurisdiction_code must exist"
      - name: beneficiary_jurisdiction_code
        type: string
        source: input
        description: "natural-key reference to JurisdictionProfile.jurisdiction_code of the beneficiary"
        constraints: "a JurisdictionProfile with this jurisdiction_code must exist"
      - name: amount_usd
        type: number
        source: input
        description: "USD-equivalent amount of the instruction"
        constraints: "> 0.00, 2 decimals"
      - name: purpose_code
        type: enum
        source: input
        description: "payment purpose; constrains what may be released during wind-down"
        constraints: "one of {TRADE_SETTLEMENT, REMITTANCE, INTERBANK_PLACEMENT, RETURN_OF_FUNDS, SETTLEMENT}"
      - name: involves_nested_party
        type: boolean
        source: input
        description: "true when the payment is for a downstream institution rather than the respondent itself"
        default: false
      - name: screening_state
        type: enum
        source: system
        description: "screening lifecycle; see state_machines[entity=PaymentInstruction]"
        default: RECEIVED
        constraints: "one of {RECEIVED, SCREENED_CLEAR, HELD_FOR_REVIEW, BLOCKED_SANCTIONS, RELEASED, REJECTED}"
      - name: hold_reason
        type: enum
        source: computed
        description: "single winning hold reason chosen by the precedence ladder in calculations.payment_screening_decision; null unless screening_state == HELD_FOR_REVIEW"
        constraints: "one of {SANCTIONS_RESTRICTED_JURISDICTION, POSTURE_SCREEN_ONLY, UNDISCLOSED_NESTED_PARTY, AMOUNT_THRESHOLD}"
      - name: hold_threshold_applied
        type: number
        source: computed
        description: "TransactionMonitoringProfile.hold_threshold_usd in force at screening time; 0.00 when the respondent has no CALIBRATED profile"
        constraints: "2 decimals"
      - name: decided_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the SanctionsOfficer who released, rejected or blocked the instruction"
      - name: decided_at
        type: datetime
        source: system
        description: "logical-clock instant of the officer decision"
      - name: decision_reason
        type: enum
        source: input
        description: "officer's rationale recorded with the screening decision; null before a decision"
        constraints: "one of {CLEARED_AFTER_REVIEW, WIND_DOWN_PERMITTED, SANCTIONS_MATCH, UNRESOLVED_NESTED_RISK, RESPONDENT_RESTRICTED}"

  # ---------------------------------------------------------- closure block ---
  - name: ClosurePlan
    parent: RespondentBank
    common_fields: true
    fields:
      - name: respondent_bank_id
        type: string
        source: input
        description: "FK -> RespondentBank.id; the respondent being exited"
      - name: termination_reason
        type: enum
        source: input
        description: "why the relationship is being terminated; drives the base notice period"
        constraints: "one of {UNRESPONSIVE, SANCTIONS_EXPOSURE, PROHIBITED_NESTING, RISK_APPETITE, COMMERCIAL, REGULATORY_ACTION}"
      - name: state
        type: enum
        source: system
        description: "closure lifecycle; see state_machines[entity=ClosurePlan]"
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, APPROVED, NOTICE_SERVED, WIND_DOWN, CLOSED, ABORTED}"
      - name: cap_basis
        type: enum
        source: input
        description: "which wind-down cap variant to use; supplied on the APPROVE action"
        default: NONE
        constraints: "one of {NONE, FORWARD_PROJECTED, CHRONOLOGICAL_ACTUAL}"
      - name: notice_period_days
        type: integer
        source: computed
        description: "notice period written by calculations.notice_period_days at APPROVE"
        default: 0
        constraints: ">= 0"
      - name: notice_served_at
        type: datetime
        source: system
        description: "logical-clock instant the closure notice was served to the respondent"
      - name: wind_down_end_at
        type: datetime
        source: computed
        description: "notice_served_at + notice_period_days * 24h; the last instant wind-down payments may be released"
      - name: wind_down_cap_usd
        type: number
        source: computed
        description: "total USD that may be released during wind-down, written by calculations.wind_down_cap at APPROVE"
        default: 0
        constraints: "2 decimals, round_half_up"
      - name: wind_down_released_usd
        type: number
        source: computed
        description: "running sum of amount_usd over PaymentInstruction rows of this respondent in state RELEASED with decided_at >= notice_served_at"
        default: 0
        constraints: "2 decimals"
      - name: original_obligation_cents
        type: integer
        source: input
        description: "total settlement obligation in cents recorded when the plan is drafted; the conserved total"
        constraints: ">= 0"
      - name: outstanding_obligation_cents
        type: integer
        source: computed
        description: "unallocated portion of original_obligation_cents; invariant outstanding_obligation_cents + settled_cents == original_obligation_cents"
        constraints: ">= 0"
      - name: settled_cents
        type: integer
        source: computed
        description: "cumulative allocated portion of original_obligation_cents"
        default: 0
        constraints: ">= 0"
      - name: last_allocated_cents
        type: integer
        source: system
        description: "amount_cents of the most recent ALLOCATE action; the only amount a REVERSE action may unwind"
        default: 0
      - name: allocation_round
        type: integer
        source: computed
        description: "number of ALLOCATE actions minus number of REVERSE actions"
        default: 0
        constraints: ">= 0"
      - name: allocation_lines
        type: array
        source: computed
        description: "array of {jurisdiction_code, line_cents} from the most recent ALLOCATE, written by calculations.settlement_allocation; empty after a REVERSE"
        default: []
      - name: return_rounds
        type: integer
        source: computed
        description: "how many times the committee returned the plan from PENDING_APPROVAL to DRAFT"
        default: 0
        constraints: "0..2; a 3rd return is refused"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the FIGRelationshipManager who drafted the plan"
      - name: approved_by_user_id
        type: string
        source: system
        description: "opaque X-User-ID of the CommitteeApprover who approved the plan; must differ from RespondentBank.assessed_by_user_id"
      - name: closed_at
        type: datetime
        source: system
        description: "logical-clock instant the plan reached CLOSED"
      - name: abort_reason
        type: enum
        source: system
        description: "why the plan was aborted; null unless state == ABORTED"
        constraints: "one of {RISK_RESOLVED, COMMERCIAL_DECISION, SUPERSEDED_PLAN}"

# =============================================================================
# §1.2 State Machine Table
# RespondentBank carries TWO independent state dimensions on the same row:
# dd_state (due-diligence lifecycle, cyclic) and payment_posture (payment
# handling). Either dimension can move while the other stands still.
# =============================================================================
state_machines:

  - entity: RespondentBank
    dimension: dd_state
    initial_state: PROSPECT
    terminal_states: [DECLINED, TERMINATED]
    transitions:
      - from: PROSPECT
        to: DD_IN_PROGRESS
        trigger: "POST /correspondent-banking/respondents/{respondentId}/licensing-verification"
        actor: ComplianceAnalyst
        preconditions:
          - "payload license_status IN {ACTIVE, CONDITIONAL}"
          - "payload regulator_standing IN {GOOD_STANDING, UNDER_ENFORCEMENT}"
          - "JurisdictionProfile[home_jurisdiction_code].sanctions_status != COMPREHENSIVELY_SANCTIONED"
        side_effects:
          - "writes license_status, regulator_name, regulator_standing from the payload"
          - "sets license_verified_at = logical clock"
        note: "A verification recording license_status IN {SUSPENDED, REVOKED} or regulator_standing == DEREGISTERED from PROSPECT is refused with ERR_LICENSE_NOT_IN_GOOD_STANDING; the same payload against an APPROVED-family respondent instead drives the RESTRICTED transition below."
      - from: DD_IN_PROGRESS
        to: PENDING_COMMITTEE
        trigger: "POST /correspondent-banking/respondents/{respondentId}/risk-assessment with variant=ONBOARDING_PROVISIONAL"
        actor: ComplianceAnalyst
        preconditions:
          - "ownership_verified == true"
          - "at least one DueDiligenceQuestionnaire of this respondent is in state ASSESSED"
          - "license_verified_at IS NOT NULL and license_status IN {ACTIVE, CONDITIONAL}"
          - "no NestedRelationship of this respondent is in state UNDISCLOSED_DETECTED"
        side_effects:
          - "runs calculations.inherent_risk_score, calculations.control_score (ONBOARDING_PROVISIONAL variant over the latest ASSESSED questionnaire by created_at DESC), calculations.adverse_media_uplift, calculations.residual_risk_score, calculations.risk_rating_assignment"
          - "writes inherent_risk_score, control_score, control_credit, adverse_media_uplift, residual_risk_score, risk_rating"
          - "sets risk_assessment_variant = ONBOARDING_PROVISIONAL, assessed_by_user_id = X-User-ID, last_risk_assessed_at = logical clock"
      - from: PENDING_COMMITTEE
        to: APPROVED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/approval with decision=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "X-User-ID != assessed_by_user_id (segregation of duties)"
          - "effective_rating (risk_rating, improved one notch when override_risk_rating is supplied) != PROHIBITED"
          - "rank(effective_rating) <= rank(JurisdictionProfile[home_jurisdiction_code].max_permitted_risk_rating) using LOW=1 < MEDIUM=2 < HIGH=3 < PROHIBITED=4"
          - "ownership_verified == true"
          - "no NestedRelationship of this respondent is in state PROHIBITED"
          - "no InformationRequest of this respondent is in state OVERDUE or ESCALATED"
        side_effects:
          - "sets approved_risk_rating = effective_rating, approved_by_user_id = X-User-ID, last_approved_at = logical clock"
          - "runs calculations.refresh_due_date and writes refresh_due_date"
          - "moves payment_posture BLOCKED -> OPEN when effective_rating IN {LOW, MEDIUM}, or BLOCKED -> SCREEN_ONLY when effective_rating == HIGH"
      - from: PENDING_COMMITTEE
        to: DECLINED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/approval with decision=DECLINE"
        actor: CommitteeApprover
        preconditions:
          - "X-User-ID != assessed_by_user_id (segregation of duties)"
        side_effects:
          - "payment_posture stays BLOCKED"
          - "every NestedRelationship of this respondent in states {DISCLOSED, UNDISCLOSED_DETECTED, CONFIRMED, SUSPENDED} moves to TERMINATED, processed created_at ASC; nested_exposure_units, disclosed_nested_count, undisclosed_nested_count and max_nested_depth are recomputed"
          - "every InformationRequest of this respondent in states {DRAFT, SENT, RESPONDED, OVERDUE, ESCALATED} moves to ABANDONED, processed created_at ASC; escalation_units recomputed"
      - from: PENDING_COMMITTEE
        to: DD_IN_PROGRESS
        trigger: "POST /correspondent-banking/respondents/{respondentId}/approval with decision=RETURN"
        actor: CommitteeApprover
        preconditions:
          - "X-User-ID != assessed_by_user_id (segregation of duties)"
        side_effects:
          - "scores and risk_rating are retained unchanged; approved_risk_rating and last_approved_at are untouched"
        note: "Cyclic edge — the respondent can be re-assessed and re-submitted to committee any number of times."
      - from: APPROVED
        to: REFRESH_DUE
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "last_approved_at IS NOT NULL"
          - "logical clock >= refresh_due_date"
        side_effects:
          - "when no PeriodicRefresh of this respondent is in state SCHEDULED or IN_PROGRESS, creates one with trigger_reason=CADENCE, window_start = refresh_due_date, scheduled_due_date = refresh_due_date + REFRESH_GRACE_DAYS(90) * 24h, rating_at_schedule = risk_rating, cadence_months_applied = base cadence of approved_risk_rating"
      - from: REFRESH_DUE
        to: UNDER_REFRESH
        trigger: "POST /correspondent-banking/periodic-refreshes/{periodicRefreshId}/progression with action=START"
        actor: ComplianceAnalyst
        preconditions:
          - "the PeriodicRefresh is in state SCHEDULED and belongs to this respondent"
          - "logical clock >= PeriodicRefresh.window_start"
        side_effects:
          - "PeriodicRefresh.state SCHEDULED -> IN_PROGRESS, started_at = logical clock"
      - from: UNDER_REFRESH
        to: APPROVED
        trigger: "POST /correspondent-banking/periodic-refreshes/{periodicRefreshId}/progression with action=COMPLETE"
        actor: ComplianceAnalyst
        preconditions:
          - "the PeriodicRefresh is in state IN_PROGRESS and belongs to this respondent"
          - "a DueDiligenceQuestionnaire of this respondent is in state ASSESSED with assessed_at >= PeriodicRefresh.started_at"
          - "risk_assessment_variant == REFRESH_FINAL and last_risk_assessed_at >= PeriodicRefresh.started_at"
          - "ownership_verified == true"
          - "risk_rating != PROHIBITED"
        side_effects:
          - "PeriodicRefresh.state IN_PROGRESS -> COMPLETED, completed_at = logical clock, completed_control_score = control_score, completion_risk_rating = risk_rating"
          - "sets last_approved_at = logical clock, approved_risk_rating = risk_rating"
          - "runs calculations.refresh_due_date and writes refresh_due_date"
          - "cascade hop 1: because the cycle reached COMPLETED, the respondent's TransactionMonitoringProfile in state CALIBRATED moves to RECALIBRATION_REQUIRED with recalibration_reason = REFRESH_COMPLETION"
        note: "Cyclic edge — APPROVED -> REFRESH_DUE -> UNDER_REFRESH -> APPROVED repeats for the life of the relationship."
      - from: REFRESH_DUE
        to: REFRESH_OVERDUE
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "a PeriodicRefresh of this respondent is in state SCHEDULED"
          - "logical clock >= that PeriodicRefresh.scheduled_due_date"
        side_effects:
          - "cascade hop 1: that PeriodicRefresh moves SCHEDULED -> LAPSED, lapsed_at = logical clock"
          - "cascade hop 2: because a cycle lapsed, payment_posture OPEN -> SCREEN_ONLY (a posture already SCREEN_ONLY, WIND_DOWN_ONLY or BLOCKED is left untouched)"
      - from: REFRESH_OVERDUE
        to: RESTRICTED
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "the most recent LAPSED PeriodicRefresh of this respondent (by scheduled_due_date DESC, tie-break created_at DESC) has scheduled_due_date + RESTRICTION_GRACE_DAYS(30) * 24h <= logical clock"
        side_effects:
          - "sets restriction_reason = REFRESH_LAPSED"
          - "cascade hop: payment_posture -> BLOCKED"
          - "every NestedRelationship of this respondent in state CONFIRMED moves to SUSPENDED, processed created_at ASC"
      - from: UNDER_REFRESH
        to: RESTRICTED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/restriction with action=RESTRICT"
        actor: SanctionsOfficer
        preconditions:
          - "dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE}"
        side_effects:
          - "sets restriction_reason = OFFICER_ACTION"
          - "cascade hop 1: payment_posture -> BLOCKED"
          - "cascade hop 2: because the respondent became RESTRICTED, every NestedRelationship in state CONFIRMED moves to SUSPENDED (created_at ASC)"
          - "cascade hop 3: because at least one nested relationship was suspended, the respondent's TransactionMonitoringProfile in state CALIBRATED moves to RECALIBRATION_REQUIRED with recalibration_reason = OFFICER_ACTION"
      - from: APPROVED
        to: RESTRICTED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/restriction with action=RESTRICT, POST /correspondent-banking/adverse-media-events/{adverseMediaEventId}/triage with action=CONFIRM, POST /correspondent-banking/respondents/{respondentId}/licensing-verification recording bad standing, POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=PROHIBIT, or POST /correspondent-banking/refresh-sweeps raising unresponsive_strikes to 3"
        actor: SanctionsOfficer | ComplianceAnalyst | system
        preconditions:
          - "at least one of: officer RESTRICT action; a triaged AdverseMediaEvent reaching CONFIRMED whose category == SANCTIONS_EVASION or severity_tier == TIER_1; a licensing verification recording license_status IN {SUSPENDED, REVOKED} or regulator_standing == DEREGISTERED; a NestedRelationship reaching PROHIBITED; unresponsive_strikes >= 3"
        side_effects:
          - "sets restriction_reason = OFFICER_ACTION | ADVERSE_MEDIA | LICENSE_LAPSE | PROHIBITED_NESTING | UNRESPONSIVE_STRIKES matching the trigger, in that precedence order when more than one holds"
          - "cascade hop: payment_posture -> BLOCKED"
          - "every NestedRelationship of this respondent in state CONFIRMED moves to SUSPENDED, processed created_at ASC"
      - from: RESTRICTED
        to: APPROVED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/restriction with action=LIFT"
        actor: SanctionsOfficer
        preconditions:
          - "unresponsive_strikes == 0"
          - "no AdverseMediaEvent of this respondent is in state NEW"
          - "no NestedRelationship of this respondent is in state PROHIBITED or UNDISCLOSED_DETECTED"
          - "license_status IN {ACTIVE, CONDITIONAL} and regulator_standing IN {GOOD_STANDING, UNDER_ENFORCEMENT}"
          - "JurisdictionProfile[home_jurisdiction_code].sanctions_status != COMPREHENSIVELY_SANCTIONED"
          - "last_approved_at IS NOT NULL"
        side_effects:
          - "clears restriction_reason to null"
          - "cascade hop 1: payment_posture BLOCKED -> SCREEN_ONLY"
          - "cascade hop 2: because the respondent left RESTRICTED, every NestedRelationship in state SUSPENDED moves back to CONFIRMED (created_at ASC); nested_exposure_units recomputed"
        note: "Cyclic edge — APPROVED -> RESTRICTED -> APPROVED may repeat."
      - from: APPROVED
        to: EXITING
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE, RESTRICTED}"
          - "the ClosurePlan belongs to this respondent and is in state PENDING_APPROVAL"
        side_effects:
          - "cascade hop 1: ClosurePlan.state PENDING_APPROVAL -> APPROVED, notice_period_days and wind_down_cap_usd computed"
          - "cascade hop 2: because the plan was approved, dd_state -> EXITING"
          - "cascade hop 3: because dd_state became EXITING, every PeriodicRefresh of this respondent in states {SCHEDULED, IN_PROGRESS} moves to CANCELLED with cancelled_reason = RELATIONSHIP_EXITING (created_at ASC)"
          - "payment_posture -> WIND_DOWN_ONLY"
      - from: RESTRICTED
        to: EXITING
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "the ClosurePlan belongs to this respondent and is in state PENDING_APPROVAL"
        side_effects:
          - "same cascade as APPROVED -> EXITING; restriction_reason is retained for audit"
      - from: EXITING
        to: TERMINATED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=CLOSE"
        actor: FIGRelationshipManager
        preconditions:
          - "the ClosurePlan is in state WIND_DOWN"
          - "logical clock >= ClosurePlan.wind_down_end_at"
          - "every NestedRelationship of this respondent is in state TERMINATED or PROHIBITED"
          - "no PaymentInstruction of this respondent is in state RECEIVED, SCREENED_CLEAR or HELD_FOR_REVIEW"
          - "ClosurePlan.outstanding_obligation_cents == 0"
        side_effects:
          - "ClosurePlan.state WIND_DOWN -> CLOSED, closed_at = logical clock"
          - "payment_posture -> BLOCKED"
          - "every InformationRequest of this respondent in states {DRAFT, SENT, RESPONDED, OVERDUE, ESCALATED} moves to ABANDONED (created_at ASC); escalation_units recomputed to 0"
      - from: EXITING
        to: APPROVED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=ABORT"
        actor: CommitteeApprover
        preconditions:
          - "the ClosurePlan is in state APPROVED (an aborted plan that already served notice cannot restore the relationship)"
          - "no PaymentInstruction of this respondent is in state HELD_FOR_REVIEW"
        side_effects:
          - "ClosurePlan.state APPROVED -> ABORTED with abort_reason from the payload"
          - "cascade hop: because the plan was aborted, payment_posture WIND_DOWN_ONLY -> SCREEN_ONLY"
        note: "Cyclic edge — a relationship can re-enter EXITING with a fresh plan later."

  - entity: RespondentBank
    dimension: payment_posture
    initial_state: BLOCKED
    terminal_states: []
    transitions:
      - from: BLOCKED
        to: OPEN
        trigger: "POST /correspondent-banking/respondents/{respondentId}/approval with decision=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "the dd_state dimension moves PENDING_COMMITTEE -> APPROVED in the same request"
          - "effective_rating IN {LOW, MEDIUM}"
        side_effects: ["none beyond the posture change"]
      - from: BLOCKED
        to: SCREEN_ONLY
        trigger: "POST /correspondent-banking/respondents/{respondentId}/approval with decision=APPROVE, or POST /correspondent-banking/respondents/{respondentId}/restriction with action=LIFT"
        actor: CommitteeApprover | SanctionsOfficer
        preconditions:
          - "on approval: effective_rating == HIGH; on lift: the dd_state dimension moves RESTRICTED -> APPROVED in the same request"
        side_effects: ["none beyond the posture change"]
      - from: OPEN
        to: SCREEN_ONLY
        trigger: "cascade from an InformationRequest reaching SENT with severity == CRITICAL, or from a PeriodicRefresh lapsing during POST /correspondent-banking/refresh-sweeps"
        actor: system
        preconditions:
          - "dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE}"
        side_effects:
          - "cascade hop: because the posture left OPEN, every PaymentInstruction of this respondent in state SCREENED_CLEAR moves to HELD_FOR_REVIEW with hold_reason = POSTURE_SCREEN_ONLY, processed created_at ASC"
        note: "This posture move is independent of dd_state — a respondent can sit in dd_state APPROVED with payment_posture SCREEN_ONLY indefinitely."
      - from: SCREEN_ONLY
        to: OPEN
        trigger: "POST /correspondent-banking/respondents/{respondentId}/restriction with action=CLEAR_SCREENING"
        actor: SanctionsOfficer
        preconditions:
          - "dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH}"
          - "no InformationRequest of this respondent is in state SENT, OVERDUE or ESCALATED with severity == CRITICAL"
          - "no PeriodicRefresh of this respondent is in state LAPSED with scheduled_due_date >= last_approved_at"
        side_effects:
          - "PaymentInstruction rows already in HELD_FOR_REVIEW are NOT auto-released; they still need an officer decision"
        note: "Cyclic edge on the posture dimension — OPEN -> SCREEN_ONLY -> OPEN with dd_state unchanged throughout."
      - from: OPEN
        to: BLOCKED
        trigger: "cascade from dd_state entering RESTRICTED, or PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} setting sanctions_status = COMPREHENSIVELY_SANCTIONED on the respondent's home jurisdiction"
        actor: system | SanctionsOfficer
        preconditions:
          - "dd_state entered RESTRICTED in the same request, or the home jurisdiction became COMPREHENSIVELY_SANCTIONED"
        side_effects:
          - "cascade hop: every PaymentInstruction of this respondent in states {RECEIVED, SCREENED_CLEAR, HELD_FOR_REVIEW} moves to BLOCKED_SANCTIONS when the trigger was a jurisdiction sanctions change, processed created_at ASC"
      - from: SCREEN_ONLY
        to: BLOCKED
        trigger: "cascade from dd_state entering RESTRICTED, or PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} setting sanctions_status = COMPREHENSIVELY_SANCTIONED"
        actor: system | SanctionsOfficer
        preconditions:
          - "dd_state entered RESTRICTED in the same request, or the home jurisdiction became COMPREHENSIVELY_SANCTIONED"
        side_effects:
          - "same PaymentInstruction cascade as OPEN -> BLOCKED"
      - from: OPEN
        to: WIND_DOWN_ONLY
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "dd_state moves to EXITING in the same request"
        side_effects:
          - "PaymentInstruction rows in state SCREENED_CLEAR move to HELD_FOR_REVIEW with hold_reason = POSTURE_SCREEN_ONLY (created_at ASC)"
      - from: SCREEN_ONLY
        to: WIND_DOWN_ONLY
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "dd_state moves to EXITING in the same request"
        side_effects: ["none beyond the posture change"]
      - from: WIND_DOWN_ONLY
        to: SCREEN_ONLY
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=ABORT"
        actor: CommitteeApprover
        preconditions:
          - "the ClosurePlan is in state APPROVED"
        side_effects: ["none beyond the posture change"]
      - from: WIND_DOWN_ONLY
        to: BLOCKED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=CLOSE"
        actor: FIGRelationshipManager
        preconditions:
          - "dd_state moves EXITING -> TERMINATED in the same request"
        side_effects: ["the respondent can no longer submit payment instructions"]

  - entity: BeneficialOwner
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification with action=VERIFY"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.dd_state NOT IN {DECLINED, TERMINATED}"
          - "when parent_owner_id IS NOT NULL the parent BeneficialOwner is already in state VERIFIED"
          - "JurisdictionProfile[country_of_residence].sanctions_status != COMPREHENSIVELY_SANCTIONED"
        side_effects:
          - "sets verified_by_user_id = X-User-ID, clears rejection_reason"
          - "runs calculations.effective_ownership_pct for this node"
          - "runs calculations.ownership_verification_rollup on the respondent, rewriting verified_ownership_pct, control_chain_complete and ownership_verified"
      - from: PENDING
        to: REJECTED
        trigger: "POST /correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification with action=REJECT"
        actor: ComplianceAnalyst
        preconditions:
          - "payload rejection_reason is present"
        side_effects:
          - "sets rejection_reason and verified_by_user_id"
          - "runs calculations.ownership_verification_rollup on the respondent"
          - "every descendant BeneficialOwner in state VERIFIED reverts to PENDING, processed created_at ASC, because a rejected ancestor invalidates the look-through chain"
      - from: VERIFIED
        to: PENDING
        trigger: "cascade from POST /correspondent-banking/adverse-media-events/{adverseMediaEventId}/triage with action=CONFIRM where category == SANCTIONS_EVASION or severity_tier == TIER_1"
        actor: system
        preconditions:
          - "the AdverseMediaEvent belongs to the same respondent"
        side_effects:
          - "clears verified_by_user_id"
          - "runs calculations.ownership_verification_rollup, which drops verified_ownership_pct and can flip ownership_verified to false"
        note: "Cyclic edge — ownership can be re-verified afterwards, restoring ownership_verified."
      - from: REJECTED
        to: PENDING
        trigger: "POST /correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification with action=RESET"
        actor: ComplianceAnalyst
        preconditions:
          - "rejection_reason != SANCTIONS_HIT (a sanctions hit is never reset, the owner record must be replaced)"
        side_effects:
          - "clears rejection_reason and verified_by_user_id"

  - entity: DueDiligenceQuestionnaire
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /correspondent-banking/questionnaires/{questionnaireId}/submission"
        actor: RespondentContact
        preconditions:
          - "X-User-ID == respondent_bank_id"
          - "RespondentBank.dd_state IN {PROSPECT, DD_IN_PROGRESS, PENDING_COMMITTEE, APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE, RESTRICTED}"
          - "declared_downstream_count == 0 OR declared_nested_activity == true"
        side_effects:
          - "sets submitted_at = logical clock"
      - from: SUBMITTED
        to: UNDER_ASSESSMENT
        trigger: "POST /correspondent-banking/questionnaires/{questionnaireId}/control-assessments (first ControlAssessment row)"
        actor: ComplianceAnalyst
        preconditions:
          - "the questionnaire is in state SUBMITTED"
        side_effects:
          - "creates the ControlAssessment row with domain_weight stamped from calculations.control_score constants"
      - from: UNDER_ASSESSMENT
        to: ASSESSED
        trigger: "POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision with action=ASSESS"
        actor: ComplianceAnalyst
        preconditions:
          - "ControlAssessment rows exist for all 8 control_domain values"
          - "no ControlAssessment row of this questionnaire has assessed_rating IS NULL"
          - "when declared_nested_activity == true, the NESTED_CONTROLS row has assessed_rating >= 2"
        side_effects:
          - "sets assessed_at = logical clock, assessed_by_user_id = X-User-ID"
          - "runs calculations.control_score with the variant named in the payload and writes computed_control_score and control_score_variant"
          - "writes RespondentBank.control_score = computed_control_score"
          - "when declared_nested_activity == true and this respondent has no NestedRelationship row in states {DISCLOSED, CONFIRMED}, creates nothing but leaves the ERR_NESTED_DISCLOSURE_MISSING guard to the risk assessment"
      - from: UNDER_ASSESSMENT
        to: RETURNED_FOR_CLARIFICATION
        trigger: "POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision with action=RETURN"
        actor: ComplianceAnalyst
        preconditions:
          - "clarification_rounds <= 2"
          - "at least one ControlAssessment row of this questionnaire has gap_severity IN {MAJOR, CRITICAL} or assessed_rating IS NULL"
        side_effects:
          - "increments clarification_rounds by 1"
      - from: RETURNED_FOR_CLARIFICATION
        to: SUBMITTED
        trigger: "POST /correspondent-banking/questionnaires/{questionnaireId}/submission"
        actor: RespondentContact
        preconditions:
          - "X-User-ID == respondent_bank_id"
        side_effects:
          - "overwrites submitted_at with the logical clock; existing ControlAssessment rows are retained so the analyst can revise assessed_rating"
        note: "Cyclic edge — SUBMITTED -> UNDER_ASSESSMENT -> RETURNED_FOR_CLARIFICATION -> SUBMITTED, at most 3 clarification rounds."
      - from: ASSESSED
        to: SUPERSEDED
        trigger: "cascade from POST /correspondent-banking/respondents/{respondentId}/questionnaires creating a newer questionnaire"
        actor: system
        preconditions:
          - "a new DueDiligenceQuestionnaire is created for the same respondent"
        side_effects:
          - "computed_control_score and control_score_variant are frozen for audit; RespondentBank.control_score is left untouched until the new questionnaire is ASSESSED"

  - entity: NestedRelationship
    initial_state: DISCLOSED
    terminal_states: [PROHIBITED, TERMINATED]
    transitions:
      - from: DISCLOSED
        to: UNDISCLOSED_DETECTED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/nested-relationships with discovery_source IN {TRANSACTION_MONITORING, RFI, ADVERSE_MEDIA} (creation seeds this state directly)"
        actor: ComplianceAnalyst
        preconditions:
          - "no NestedRelationship of this respondent already has the same (downstream_institution_name, downstream_jurisdiction_code) pair in a non-terminal state"
        side_effects:
          - "runs calculations.nested_chain_depth and writes depth"
          - "runs calculations.nested_exposure_rollup, updating RespondentBank.undisclosed_nested_count, nested_exposure_units and max_nested_depth"
        note: "Rows created with discovery_source == QUESTIONNAIRE start in DISCLOSED; every other discovery_source starts in UNDISCLOSED_DETECTED. This edge documents the alternative creation state, not a post-creation move."
      - from: DISCLOSED
        to: CONFIRMED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=CONFIRM"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.nested_activity_permitted == true"
          - "calculations.nested_prohibition_precedence returns no prohibition reason for this row"
          - "RespondentBank.dd_state NOT IN {DECLINED, EXITING, TERMINATED}"
        side_effects:
          - "sets adjudicated_by_user_id, adjudicated_at"
          - "runs calculations.nested_exposure_rollup: the row's state weight moves 1 -> 3 so nested_exposure_units increases by 2 * depth"
          - "cascade hop: because a nested relationship reached CONFIRMED, the respondent's TransactionMonitoringProfile in state CALIBRATED moves to RECALIBRATION_REQUIRED with recalibration_reason = NESTED_DISCOVERY"
      - from: UNDISCLOSED_DETECTED
        to: CONFIRMED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=CONFIRM"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.nested_activity_permitted == true"
          - "calculations.nested_prohibition_precedence returns no prohibition reason for this row"
          - "an InformationRequest of this respondent with request_topic == NESTED_DISCLOSURE is in state ACCEPTED"
        side_effects:
          - "sets adjudicated_by_user_id, adjudicated_at"
          - "runs calculations.nested_exposure_rollup: the row's state weight moves 5 -> 3 so nested_exposure_units decreases by 2 * depth; undisclosed_nested_count decreases and disclosed_nested_count increases by 1"
          - "cascade hop: the respondent's TransactionMonitoringProfile in state CALIBRATED moves to RECALIBRATION_REQUIRED with recalibration_reason = NESTED_DISCOVERY"
      - from: CONFIRMED
        to: DISCLOSED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=REVERT"
        actor: ComplianceAnalyst
        preconditions:
          - "no PaymentInstruction references this row via nested_relationship_id in states {RELEASED, HELD_FOR_REVIEW}"
          - "RespondentBank.dd_state NOT IN {EXITING, TERMINATED}"
        side_effects:
          - "sets adjudicated_by_user_id, adjudicated_at"
          - "runs calculations.nested_exposure_rollup: the row's state weight moves 3 -> 1 so nested_exposure_units decreases by 2 * depth, exactly compensating the CONFIRM edge"
        note: "Compensating edge for the CONFIRM action; CONFIRM followed by REVERT restores nested_exposure_units, disclosed_nested_count and max_nested_depth to their pre-CONFIRM values."
      - from: DISCLOSED
        to: PROHIBITED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=PROHIBIT, or cascade from PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions:
          - "calculations.nested_prohibition_precedence returns a non-null reason for this row"
        side_effects:
          - "writes prohibition_reason = the single winning reason from the precedence ladder"
          - "runs calculations.nested_exposure_rollup: state weight drops to 0"
          - "cascade hop: because a nested relationship reached PROHIBITED, the respondent's dd_state moves to RESTRICTED with restriction_reason = PROHIBITED_NESTING when dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE}"
      - from: UNDISCLOSED_DETECTED
        to: PROHIBITED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=PROHIBIT, or cascade from PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions:
          - "calculations.nested_prohibition_precedence returns a non-null reason for this row"
        side_effects:
          - "same as DISCLOSED -> PROHIBITED"
      - from: CONFIRMED
        to: PROHIBITED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=PROHIBIT, or cascade from PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} setting sanctions_status = COMPREHENSIVELY_SANCTIONED or nested_correspondent_prohibited = true on downstream_jurisdiction_code"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions:
          - "calculations.nested_prohibition_precedence returns a non-null reason for this row"
        side_effects:
          - "same as DISCLOSED -> PROHIBITED, plus every PaymentInstruction referencing this row in states {RECEIVED, SCREENED_CLEAR, HELD_FOR_REVIEW} moves to BLOCKED_SANCTIONS when prohibition_reason == SANCTIONED_JURISDICTION (created_at ASC)"
      - from: CONFIRMED
        to: SUSPENDED
        trigger: "cascade from RespondentBank.dd_state entering RESTRICTED"
        actor: system
        preconditions:
          - "the respondent entered RESTRICTED in the same request"
        side_effects:
          - "state weight stays 3, so nested_exposure_units is unchanged by suspension"
      - from: SUSPENDED
        to: CONFIRMED
        trigger: "cascade from POST /correspondent-banking/respondents/{respondentId}/restriction with action=LIFT"
        actor: system
        preconditions:
          - "the respondent moved RESTRICTED -> APPROVED in the same request"
          - "calculations.nested_prohibition_precedence returns no prohibition reason for this row"
        side_effects:
          - "nested_exposure_units unchanged"
        note: "Cyclic edge — CONFIRMED -> SUSPENDED -> CONFIRMED tracks the respondent's restriction cycle."
      - from: CONFIRMED
        to: TERMINATED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=TERMINATE, or cascade from a ClosurePlan reaching NOTICE_SERVED or a respondent reaching DECLINED"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions:
          - "no PaymentInstruction referencing this row is in state HELD_FOR_REVIEW"
        side_effects:
          - "state weight drops to 0; nested_exposure_units, disclosed_nested_count and max_nested_depth recomputed"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=TERMINATE, or cascade from a ClosurePlan reaching NOTICE_SERVED"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions:
          - "no PaymentInstruction referencing this row is in state HELD_FOR_REVIEW"
        side_effects:
          - "state weight drops to 0; rollups recomputed"
      - from: DISCLOSED
        to: TERMINATED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=TERMINATE, or cascade from a ClosurePlan reaching NOTICE_SERVED or a respondent reaching DECLINED"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions: ["none beyond role and existence"]
        side_effects:
          - "state weight drops to 0; rollups recomputed"
      - from: UNDISCLOSED_DETECTED
        to: TERMINATED
        trigger: "POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=TERMINATE, or cascade from a ClosurePlan reaching NOTICE_SERVED or a respondent reaching DECLINED"
        actor: ComplianceAnalyst | SanctionsOfficer | system
        preconditions: ["none beyond role and existence"]
        side_effects:
          - "state weight drops from 5 to 0; undisclosed_nested_count and nested_exposure_units recomputed"

  - entity: TransactionMonitoringProfile
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: CALIBRATED
        trigger: "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.risk_rating != UNRATED"
          - "RespondentBank.dd_state NOT IN {PROSPECT, DECLINED, TERMINATED}"
          - "every jurisdiction_code inside expected_corridors has a JurisdictionProfile"
          - "no other TransactionMonitoringProfile of this respondent in state CALIBRATED has an interval that overlaps this one under CLOSED-interval semantics"
        side_effects:
          - "runs calculations.monitoring_threshold_calibration and writes corridor_thresholds, aggregate_usd_threshold, hold_threshold_usd"
          - "sets calibrated_at = logical clock, calibrated_by_user_id = X-User-ID, clears recalibration_reason"
      - from: CALIBRATED
        to: RECALIBRATION_REQUIRED
        trigger: "cascade from a MonitoringAlert escalation holding payments, a NestedRelationship reaching CONFIRMED, a PeriodicRefresh reaching COMPLETED, or POST /correspondent-banking/respondents/{respondentId}/restriction with action=RESTRICT"
        actor: system
        preconditions:
          - "the profile belongs to the respondent affected by the cascade"
        side_effects:
          - "writes recalibration_reason = ALERT_ESCALATION | NESTED_DISCOVERY | REFRESH_COMPLETION | OFFICER_ACTION matching the trigger"
          - "corridor_thresholds and aggregate_usd_threshold are retained but no VOLUME_BREACH or COUNT_BREACH alert may fire while in this state"
      - from: RECALIBRATION_REQUIRED
        to: CALIBRATED
        trigger: "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.risk_rating != UNRATED"
          - "RespondentBank.dd_state NOT IN {DECLINED, TERMINATED}"
        side_effects:
          - "recomputes every threshold with the respondent's CURRENT risk_rating, so a rating that worsened since the previous calibration tightens the thresholds"
          - "sets calibrated_at = logical clock, clears recalibration_reason"
        note: "Cyclic edge — CALIBRATED -> RECALIBRATION_REQUIRED -> CALIBRATED repeats over the relationship's life."
      - from: CALIBRATED
        to: SUPERSEDED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles with supersede=true"
        actor: ComplianceAnalyst
        preconditions:
          - "the new profile's CLOSED interval overlaps this profile's CLOSED interval"
          - "the request carries a non-stale expected_respondent_version"
        side_effects:
          - "corridor_thresholds are frozen for audit; the new profile starts in PROVISIONAL"
      - from: RECALIBRATION_REQUIRED
        to: SUPERSEDED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles with supersede=true"
        actor: ComplianceAnalyst
        preconditions:
          - "the new profile's CLOSED interval overlaps this profile's CLOSED interval"
        side_effects:
          - "same as CALIBRATED -> SUPERSEDED"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles with supersede=true"
        actor: ComplianceAnalyst
        preconditions:
          - "the new profile's CLOSED interval overlaps this profile's CLOSED interval"
        side_effects:
          - "same as CALIBRATED -> SUPERSEDED"

  - entity: MonitoringAlert
    initial_state: OPEN
    terminal_states: [CLOSED_FALSE_POSITIVE, CLOSED_CONFIRMED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /correspondent-banking/monitoring-alerts/{monitoringAlertId}/disposition with action=INVESTIGATE"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.dd_state NOT IN {DECLINED, TERMINATED}"
        side_effects:
          - "sets investigated_by_user_id = X-User-ID"
      - from: UNDER_INVESTIGATION
        to: CLOSED_FALSE_POSITIVE
        trigger: "POST /correspondent-banking/monitoring-alerts/{monitoringAlertId}/disposition with action=CLOSE_FALSE_POSITIVE"
        actor: ComplianceAnalyst
        preconditions:
          - "payload disposition_reason IN {DATA_QUALITY, EXPECTED_SEASONALITY, RESPONDENT_EXPLAINED}"
          - "alert_type != NESTED_ACTIVITY_UNDISCLOSED (an undisclosed-nesting alert can never be dismissed as a false positive)"
        side_effects:
          - "writes disposition_reason"
      - from: UNDER_INVESTIGATION
        to: ESCALATED
        trigger: "POST /correspondent-banking/monitoring-alerts/{monitoringAlertId}/disposition with action=ESCALATE"
        actor: ComplianceAnalyst
        preconditions:
          - "no InformationRequest of this respondent with monitoring_alert_id == this alert is in states {SENT, OVERDUE, ESCALATED}"
          - "RespondentBank.dd_state NOT IN {DECLINED, EXITING, TERMINATED}"
        side_effects:
          - "sets escalated_at = logical clock"
          - "cascade hop 2: because the alert entered ESCALATED, a new InformationRequest is created for the respondent with monitoring_alert_id = this alert, request_topic = ACTIVITY_EXPLANATION when alert_type IN {VOLUME_BREACH, COUNT_BREACH, CORRIDOR_UNEXPECTED} else NESTED_DISCLOSURE, severity = this alert's severity, and it is dispatched immediately (state SENT, sla_hours and due_at from calculations.rfi_response_sla)"
          - "cascade hop 3: because that InformationRequest is SENT with severity == CRITICAL, RespondentBank.payment_posture moves OPEN -> SCREEN_ONLY"
          - "cascade hop 4: because the posture left OPEN, every PaymentInstruction of the respondent in state SCREENED_CLEAR moves to HELD_FOR_REVIEW with hold_reason = POSTURE_SCREEN_ONLY (created_at ASC)"
          - "cascade hop 5: because at least one PaymentInstruction was held by that posture move, the respondent's TransactionMonitoringProfile in state CALIBRATED moves to RECALIBRATION_REQUIRED with recalibration_reason = ALERT_ESCALATION"
          - "RespondentBank.escalation_units recomputed"
        note: "This is the depth-5 cascade: alert -> RFI -> posture -> held payments -> profile recalibration. Hops 3-5 fire only when the chain's own precondition holds (severity CRITICAL for hop 3, at least one SCREENED_CLEAR payment for hop 5)."
      - from: ESCALATED
        to: CLOSED_CONFIRMED
        trigger: "cascade from POST /correspondent-banking/information-requests/{informationRequestId}/adjudication with action=ACCEPT or action=ABANDON on the linked request"
        actor: system
        preconditions:
          - "the InformationRequest whose monitoring_alert_id == this alert reached ACCEPTED or ABANDONED"
        side_effects:
          - "writes disposition_reason = RESPONDENT_EXPLAINED when the linked request was ACCEPTED, else UNRESOLVED_RISK"
      - from: OPEN
        to: CLOSED_CONFIRMED
        trigger: "cascade from POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=PROHIBIT"
        actor: system
        preconditions:
          - "alert_type == NESTED_ACTIVITY_UNDISCLOSED and the prohibited relationship belongs to the same respondent"
        side_effects:
          - "writes disposition_reason = PROHIBITED_NESTING"

  - entity: InformationRequest
    initial_state: DRAFT
    terminal_states: [ACCEPTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/dispatch"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.dd_state NOT IN {PROSPECT, DECLINED, TERMINATED}"
          - "when monitoring_alert_id IS NOT NULL that alert is in state ESCALATED or UNDER_INVESTIGATION"
        side_effects:
          - "sets dispatched_at = logical clock, runs calculations.rfi_response_sla and writes sla_hours and due_at"
          - "sets escalation_level = max(escalation_level, 1) and recomputes RespondentBank.escalation_units"
          - "when severity == CRITICAL, RespondentBank.payment_posture moves OPEN -> SCREEN_ONLY with the held-payment cascade"
      - from: SENT
        to: RESPONDED
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/response"
        actor: RespondentContact
        preconditions:
          - "X-User-ID == respondent_bank_id"
          - "RespondentBank.dd_state != TERMINATED"
        side_effects:
          - "sets responded_at = logical clock, overwrites response_note"
      - from: OVERDUE
        to: RESPONDED
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/response"
        actor: RespondentContact
        preconditions:
          - "X-User-ID == respondent_bank_id"
        side_effects:
          - "sets responded_at = logical clock; unresponsive_strikes are NOT credited yet, acceptance decides that"
      - from: RESPONDED
        to: ACCEPTED
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/adjudication with action=ACCEPT"
        actor: ComplianceAnalyst
        preconditions:
          - "X-User-ID != respondent_bank_id"
        side_effects:
          - "sets adjudicated_by_user_id, escalation_level -> 0"
          - "when the payload sets retro_credit = true and reminder_count > 0, sets retro_credited = true and decrements RespondentBank.unresponsive_strikes by reminder_count, floored at 0, per calculations.unresponsive_strike_ledger"
          - "recomputes RespondentBank.escalation_units"
          - "cascade hop: when monitoring_alert_id IS NOT NULL and that alert is ESCALATED, the alert moves to CLOSED_CONFIRMED with disposition_reason = RESPONDENT_EXPLAINED"
      - from: RESPONDED
        to: SENT
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/adjudication with action=INSUFFICIENT"
        actor: ComplianceAnalyst
        preconditions:
          - "insufficiency_rounds <= 1"
        side_effects:
          - "increments insufficiency_rounds by 1 and escalation_level by 1 (capped at 3)"
          - "sets dispatched_at = logical clock and recomputes sla_hours and due_at from calculations.rfi_response_sla with the CURRENT unresponsive_strikes, so a re-issued request usually has a shorter window than the original"
          - "recomputes RespondentBank.escalation_units"
        note: "Cyclic edge — SENT -> RESPONDED -> SENT, at most 2 insufficiency rounds."
      - from: SENT
        to: OVERDUE
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "logical clock >= due_at"
        side_effects:
          - "cascade hop 1: increments reminder_count by 1 and escalation_level by 1 (capped at 3)"
          - "cascade hop 2: because the request became OVERDUE, RespondentBank.unresponsive_strikes increases by 1 per calculations.unresponsive_strike_ledger"
          - "cascade hop 3: because unresponsive_strikes reached 3 (>= comparison), RespondentBank.dd_state moves to RESTRICTED with restriction_reason = UNRESPONSIVE_STRIKES and payment_posture -> BLOCKED"
          - "cascade hop 4: because the respondent became RESTRICTED, every NestedRelationship in state CONFIRMED moves to SUSPENDED (created_at ASC)"
          - "recomputes RespondentBank.escalation_units"
        note: "This is the depth-4 sweep cascade: RFI overdue -> strike ledger -> respondent restriction -> nested suspension."
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "logical clock >= due_at + ESCALATION_WINDOW_HOURS(72)"
          - "state == OVERDUE"
        side_effects:
          - "sets escalation_level = 3 and recomputes RespondentBank.escalation_units"
          - "RespondentBank.payment_posture OPEN -> SCREEN_ONLY when still OPEN"
      - from: ESCALATED
        to: SENT
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/dispatch"
        actor: ComplianceAnalyst
        preconditions:
          - "reminder_count <= 2"
          - "RespondentBank.dd_state != TERMINATED"
        side_effects:
          - "sets dispatched_at = logical clock and recomputes sla_hours and due_at"
        note: "Cyclic edge — an escalated request may be re-issued once more before abandonment."
      - from: ESCALATED
        to: ABANDONED
        trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/adjudication with action=ABANDON"
        actor: ComplianceAnalyst
        preconditions:
          - "escalation_level == 3"
        side_effects:
          - "escalation_level -> 0 and RespondentBank.escalation_units recomputed; unresponsive_strikes are retained"
          - "cascade hop: when monitoring_alert_id IS NOT NULL and that alert is ESCALATED, the alert moves to CLOSED_CONFIRMED with disposition_reason = UNRESOLVED_RISK"

  - entity: AdverseMediaEvent
    initial_state: NEW
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: NEW
        to: CONFIRMED
        trigger: "POST /correspondent-banking/adverse-media-events/{adverseMediaEventId}/triage with action=CONFIRM"
        actor: ComplianceAnalyst
        preconditions:
          - "RespondentBank.dd_state NOT IN {DECLINED, TERMINATED}"
          - "event_date <= logical clock"
        side_effects:
          - "sets triaged_by_user_id, triaged_at, and uplift_points from calculations.adverse_media_uplift"
          - "cascade hop 2: because the item is CONFIRMED, RespondentBank.adverse_media_uplift, residual_risk_score and risk_rating are recomputed"
          - "cascade hop 3: because risk_rating may have worsened, refresh_due_date is recomputed; when the new refresh_due_date is strictly earlier than the scheduled_due_date of the respondent's SCHEDULED PeriodicRefresh, that cycle moves to CANCELLED with cancelled_reason = SUPERSEDED_BY_ACCELERATION and a new PeriodicRefresh is created with trigger_reason = ADVERSE_MEDIA, window_start = logical clock, scheduled_due_date = the new refresh_due_date"
          - "cascade hop 4: because the item is CONFIRMED with category == SANCTIONS_EVASION or severity_tier == TIER_1, every BeneficialOwner of the respondent in state VERIFIED reverts to PENDING (created_at ASC) and ownership_verified is recomputed to false"
          - "cascade hop 5: because ownership_verified became false while dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE}, dd_state moves to RESTRICTED with restriction_reason = ADVERSE_MEDIA and payment_posture -> BLOCKED"
        note: "This is the depth-5 adverse-media cascade: confirm -> score recompute -> refresh acceleration -> ownership de-verification -> restriction."
      - from: NEW
        to: DISMISSED
        trigger: "POST /correspondent-banking/adverse-media-events/{adverseMediaEventId}/triage with action=DISMISS"
        actor: ComplianceAnalyst
        preconditions:
          - "severity_tier != TIER_1 OR source_reliability == C"
        side_effects:
          - "uplift_points stays 0.00 and the item never enters any risk-scoring window"

  - entity: PeriodicRefresh
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, LAPSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /correspondent-banking/periodic-refreshes/{periodicRefreshId}/progression with action=START"
        actor: ComplianceAnalyst
        preconditions:
          - "logical clock >= window_start"
          - "RespondentBank.dd_state IN {APPROVED, REFRESH_DUE, REFRESH_OVERDUE}"
          - "no other PeriodicRefresh of this respondent is in state IN_PROGRESS"
        side_effects:
          - "sets started_at = logical clock"
          - "RespondentBank.dd_state -> UNDER_REFRESH"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /correspondent-banking/periodic-refreshes/{periodicRefreshId}/progression with action=COMPLETE"
        actor: ComplianceAnalyst
        preconditions:
          - "the respondent satisfies every precondition of RespondentBank dd_state UNDER_REFRESH -> APPROVED"
        side_effects:
          - "sets completed_at, completed_control_score, completion_risk_rating"
          - "drives the RespondentBank UNDER_REFRESH -> APPROVED transition and its profile-recalibration cascade"
      - from: SCHEDULED
        to: LAPSED
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "logical clock >= scheduled_due_date"
        side_effects:
          - "sets lapsed_at = logical clock"
          - "drives RespondentBank dd_state REFRESH_DUE -> REFRESH_OVERDUE and payment_posture OPEN -> SCREEN_ONLY"
      - from: IN_PROGRESS
        to: LAPSED
        trigger: "POST /correspondent-banking/refresh-sweeps (system epoch advance)"
        actor: system
        preconditions:
          - "logical clock >= scheduled_due_date + REFRESH_GRACE_DAYS(90) * 24h"
        side_effects:
          - "sets lapsed_at; RespondentBank.dd_state UNDER_REFRESH -> REFRESH_OVERDUE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "cascade from POST /correspondent-banking/adverse-media-events/{adverseMediaEventId}/triage with action=CONFIRM (acceleration) or from a ClosurePlan reaching APPROVED"
        actor: system
        preconditions:
          - "an accelerated refresh_due_date is strictly earlier than this cycle's scheduled_due_date, or the respondent entered EXITING"
        side_effects:
          - "writes cancelled_reason = SUPERSEDED_BY_ACCELERATION | RELATIONSHIP_EXITING"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "cascade from a ClosurePlan reaching APPROVED"
        actor: system
        preconditions:
          - "the respondent entered EXITING in the same request"
        side_effects:
          - "writes cancelled_reason = RELATIONSHIP_EXITING"

  - entity: PaymentInstruction
    initial_state: RECEIVED
    terminal_states: [RELEASED, REJECTED]
    transitions:
      - from: RECEIVED
        to: SCREENED_CLEAR
        trigger: "POST /correspondent-banking/respondents/{respondentId}/payment-instructions (screening runs inside the creating request)"
        actor: system
        preconditions:
          - "calculations.payment_screening_decision returns SCREENED_CLEAR"
        side_effects:
          - "writes hold_threshold_applied from the respondent's CALIBRATED TransactionMonitoringProfile"
      - from: RECEIVED
        to: HELD_FOR_REVIEW
        trigger: "POST /correspondent-banking/respondents/{respondentId}/payment-instructions, or POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision with action=HOLD"
        actor: system | SanctionsOfficer
        preconditions:
          - "calculations.payment_screening_decision returns HELD_FOR_REVIEW, or an officer holds an instruction parked in RECEIVED"
        side_effects:
          - "writes the single winning hold_reason from the precedence ladder in calculations.payment_screening_decision"
      - from: RECEIVED
        to: BLOCKED_SANCTIONS
        trigger: "POST /correspondent-banking/respondents/{respondentId}/payment-instructions, or cascade from PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} setting sanctions_status = COMPREHENSIVELY_SANCTIONED"
        actor: system | SanctionsOfficer
        preconditions:
          - "ordering_jurisdiction_code or beneficiary_jurisdiction_code resolves to a JurisdictionProfile with sanctions_status == COMPREHENSIVELY_SANCTIONED"
        side_effects:
          - "hold_reason stays null; a blocked instruction is never a hold"
        note: "An instruction stays in RECEIVED after creation only when the respondent has no CALIBRATED TransactionMonitoringProfile covering the logical clock, so no hold threshold can be evaluated."
      - from: SCREENED_CLEAR
        to: HELD_FOR_REVIEW
        trigger: "cascade from RespondentBank.payment_posture leaving OPEN"
        actor: system
        preconditions:
          - "the respondent's posture moved OPEN -> SCREEN_ONLY or OPEN -> WIND_DOWN_ONLY in the same request"
        side_effects:
          - "writes hold_reason = POSTURE_SCREEN_ONLY"
      - from: SCREENED_CLEAR
        to: BLOCKED_SANCTIONS
        trigger: "cascade from PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} or from a NestedRelationship reaching PROHIBITED with prohibition_reason == SANCTIONED_JURISDICTION"
        actor: system
        preconditions:
          - "one of the instruction's jurisdictions became COMPREHENSIVELY_SANCTIONED, or the referenced nested relationship became PROHIBITED for sanctions"
        side_effects:
          - "clears hold_reason"
      - from: HELD_FOR_REVIEW
        to: BLOCKED_SANCTIONS
        trigger: "cascade from PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId} or from a NestedRelationship reaching PROHIBITED with prohibition_reason == SANCTIONED_JURISDICTION"
        actor: system
        preconditions:
          - "same as SCREENED_CLEAR -> BLOCKED_SANCTIONS"
        side_effects:
          - "clears hold_reason"
      - from: SCREENED_CLEAR
        to: RELEASED
        trigger: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision with action=RELEASE"
        actor: SanctionsOfficer
        preconditions:
          - "RespondentBank.payment_posture IN {OPEN, SCREEN_ONLY, WIND_DOWN_ONLY}"
          - "when payment_posture == WIND_DOWN_ONLY: purpose_code IN {RETURN_OF_FUNDS, SETTLEMENT}, logical clock <= ClosurePlan.wind_down_end_at, and ClosurePlan.wind_down_released_usd + amount_usd <= ClosurePlan.wind_down_cap_usd"
        side_effects:
          - "sets decided_by_user_id, decided_at, decision_reason"
          - "when the respondent has an open ClosurePlan in states {NOTICE_SERVED, WIND_DOWN}, increases ClosurePlan.wind_down_released_usd by amount_usd"
      - from: HELD_FOR_REVIEW
        to: RELEASED
        trigger: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision with action=RELEASE"
        actor: SanctionsOfficer
        preconditions:
          - "hold_reason != UNDISCLOSED_NESTED_PARTY, or the referenced NestedRelationship has since reached CONFIRMED"
          - "RespondentBank.payment_posture != BLOCKED"
          - "the wind-down constraints above when payment_posture == WIND_DOWN_ONLY"
        side_effects:
          - "same as SCREENED_CLEAR -> RELEASED, and clears hold_reason"
      - from: HELD_FOR_REVIEW
        to: REJECTED
        trigger: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision with action=REJECT"
        actor: SanctionsOfficer
        preconditions:
          - "payload decision_reason IN {SANCTIONS_MATCH, UNRESOLVED_NESTED_RISK, RESPONDENT_RESTRICTED}"
        side_effects:
          - "sets decided_by_user_id, decided_at, decision_reason"
      - from: BLOCKED_SANCTIONS
        to: REJECTED
        trigger: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision with action=REJECT"
        actor: SanctionsOfficer
        preconditions:
          - "payload decision_reason == SANCTIONS_MATCH"
        side_effects:
          - "sets decided_by_user_id, decided_at, decision_reason"
        note: "A BLOCKED_SANCTIONS instruction can only ever be REJECTED; RELEASE is refused with ERR_SANCTIONED_PAYMENT_RELEASE_FORBIDDEN."
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision with action=REJECT"
        actor: SanctionsOfficer
        preconditions:
          - "payload decision_reason IN {RESPONDENT_RESTRICTED, UNRESOLVED_NESTED_RISK, SANCTIONS_MATCH}"
        side_effects:
          - "sets decided_by_user_id, decided_at, decision_reason"

  - entity: ClosurePlan
    initial_state: DRAFT
    terminal_states: [CLOSED, ABORTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=SUBMIT"
        actor: FIGRelationshipManager
        preconditions:
          - "X-User-ID == drafted_by_user_id"
          - "RespondentBank.dd_state NOT IN {PROSPECT, DECLINED, TERMINATED}"
          - "original_obligation_cents == outstanding_obligation_cents + settled_cents"
        side_effects: ["none beyond the state change"]
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=RETURN"
        actor: CommitteeApprover
        preconditions:
          - "return_rounds <= 1"
        side_effects:
          - "increments return_rounds by 1"
        note: "Cyclic edge — DRAFT -> PENDING_APPROVAL -> DRAFT, at most 2 returns."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=APPROVE"
        actor: CommitteeApprover
        preconditions:
          - "X-User-ID != RespondentBank.assessed_by_user_id (segregation of duties)"
          - "X-User-ID != drafted_by_user_id"
          - "payload cap_basis IN {FORWARD_PROJECTED, CHRONOLOGICAL_ACTUAL}"
          - "when cap_basis == CHRONOLOGICAL_ACTUAL, at least one ActivityObservation exists under a TransactionMonitoringProfile of this respondent"
        side_effects:
          - "runs calculations.notice_period_days and writes notice_period_days"
          - "runs calculations.wind_down_cap with the chosen variant and writes wind_down_cap_usd, cap_basis"
          - "drives RespondentBank dd_state -> EXITING, payment_posture -> WIND_DOWN_ONLY and the PeriodicRefresh cancellation cascade"
      - from: APPROVED
        to: NOTICE_SERVED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=SERVE_NOTICE"
        actor: FIGRelationshipManager
        preconditions:
          - "notice_period_days IS NOT NULL"
          - "no InformationRequest of this respondent is in state RESPONDED awaiting adjudication"
        side_effects:
          - "sets notice_served_at = logical clock and wind_down_end_at = notice_served_at + notice_period_days * 24h"
          - "every NestedRelationship of this respondent in states {DISCLOSED, UNDISCLOSED_DETECTED, CONFIRMED, SUSPENDED} moves to TERMINATED (created_at ASC); nested_exposure_units drops to 0"
      - from: NOTICE_SERVED
        to: WIND_DOWN
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=START_WIND_DOWN"
        actor: FIGRelationshipManager
        preconditions:
          - "logical clock >= notice_served_at"
          - "every NestedRelationship of this respondent is in state TERMINATED or PROHIBITED"
        side_effects: ["none beyond the state change"]
      - from: WIND_DOWN
        to: CLOSED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=CLOSE"
        actor: FIGRelationshipManager
        preconditions:
          - "logical clock >= wind_down_end_at"
          - "outstanding_obligation_cents == 0"
          - "no PaymentInstruction of this respondent is in state RECEIVED, SCREENED_CLEAR or HELD_FOR_REVIEW"
        side_effects:
          - "sets closed_at = logical clock"
          - "drives RespondentBank dd_state EXITING -> TERMINATED, payment_posture -> BLOCKED and the RFI abandonment cascade"
      - from: DRAFT
        to: ABORTED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=ABORT"
        actor: FIGRelationshipManager
        preconditions:
          - "payload abort_reason is present"
        side_effects:
          - "writes abort_reason; the respondent's dd_state is untouched because it never entered EXITING"
      - from: PENDING_APPROVAL
        to: ABORTED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=ABORT"
        actor: CommitteeApprover
        preconditions:
          - "payload abort_reason is present"
        side_effects:
          - "writes abort_reason"
      - from: APPROVED
        to: ABORTED
        trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/progression with action=ABORT"
        actor: CommitteeApprover
        preconditions:
          - "payload abort_reason is present"
          - "no PaymentInstruction of this respondent is in state HELD_FOR_REVIEW"
        side_effects:
          - "writes abort_reason"
          - "drives RespondentBank dd_state EXITING -> APPROVED and payment_posture WIND_DOWN_ONLY -> SCREEN_ONLY"
        note: "Once NOTICE_SERVED is reached the plan can no longer be aborted; the relationship must run to CLOSED."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent RespondentBank.version only
# =============================================================================
concurrency_rules:
  - rule_id: questionnaire-create-stale-respondent
    parent_entity: RespondentBank
    write_endpoint: "POST /correspondent-banking/respondents/{respondentId}/questionnaires"
    occ_field: "expected_respondent_version"
    description: |
      Creating a DueDiligenceQuestionnaire against a RespondentBank whose
      version has advanced since the client last read it is rejected with a
      stale-version error. Questionnaire creation legitimately supersedes the
      respondent's prior ASSESSED questionnaire and rewrites the control-score
      basis, so a writer working from an outdated view of the respondent
      (its scores, dd_state, or an already-superseded questionnaire) must
      re-read before creating.
    error_id: ERR_STALE_RESPONDENT_VERSION
    http_status: 412
  - rule_id: monitoring-profile-create-stale-respondent
    parent_entity: RespondentBank
    write_endpoint: "POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles"
    occ_field: "expected_respondent_version"
    description: |
      Creating a TransactionMonitoringProfile with supersede=true against a
      RespondentBank whose version has advanced since the client last read it
      is rejected with a stale-version error. The new profile supersedes any
      overlapping profile and recalibrates every corridor threshold from the
      respondent's current risk_rating, so a writer holding a stale version
      would silently calibrate against an outdated rating.
    error_id: ERR_STALE_RESPONDENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Global conventions: every monetary or score rounding is round_half_up unless
# stated otherwise; "logical clock" means the value maintained by
# POST /_clock/set_current_utc, which reads 2026-08-01T00:00:00Z until set.
# Month arithmetic: adding N months preserves day-of-month and time-of-day; if
# the target month has fewer days the day is clamped to that month's last day.
# =============================================================================
calculations:

  - name: jurisdiction_risk_points
    trigger: "POST /correspondent-banking/jurisdiction-profiles and PATCH /correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}"
    algorithm: weighted_scoring
    formula: |
      sanctions_points = { PERMITTED: 0, RESTRICTED: 8, COMPREHENSIVELY_SANCTIONED: 20 }[sanctions_status]
      fatf_points      = { NONE: 0, INCREASED_MONITORING: 5, CALL_FOR_ACTION: 12 }[fatf_listing]
      secrecy_points   = 3 if secrecy_flag else 0
      raw = basel_aml_index * BASEL_MULTIPLIER + sanctions_points + fatf_points + secrecy_points
      jurisdiction_risk_points = round(min(POINTS_CAP, raw), 2)
    input_set: "the single JurisdictionProfile row being written; no cross-entity inputs"
    constants:
      BASEL_MULTIPLIER: 2.0
      POINTS_CAP: 40.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: effective_ownership_pct
    trigger: "POST /correspondent-banking/respondents/{respondentId}/beneficial-owners (creation) and POST /correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification with action=VERIFY"
    algorithm: topological
    formula: |
      # Walk from this node up to its root through parent_owner_id.
      chain = [node]
      cur = node
      while cur.parent_owner_id is not null:
          cur = BeneficialOwner[cur.parent_owner_id]
          chain.append(cur)          # chain length == node.chain_depth, max 4
      product = 1.0
      for n in chain:
          product = product * n.ownership_pct        # NO intermediate rounding
      effective_ownership_pct = round(product / (100.0 ** (len(chain) - 1)), 2)
      # A cycle in the parent chain is impossible by construction: creation
      # rejects a parent_owner_id whose own ancestor set already contains the
      # node being created (ERR_OWNERSHIP_CYCLE_DETECTED), and a chain longer
      # than OWNERSHIP_MAX_DEPTH is rejected with ERR_OWNERSHIP_DEPTH_EXCEEDED.
    input_set: "the node and every ancestor BeneficialOwner regardless of verification_status; verification only gates the rollup, not the look-through arithmetic"
    constants:
      OWNERSHIP_MAX_DEPTH: 4
    precision: "single rounding to 2 decimals, round_half_up, applied ONLY to the final quotient — deliberately contrasted with settlement_allocation, which rounds per line before summing"
    variants: []

  - name: ownership_verification_rollup
    trigger: "POST /correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification (all actions) and the BeneficialOwner VERIFIED -> PENDING cascade from adverse-media confirmation"
    algorithm: aggregation
    formula: |
      direct = [o for o in BeneficialOwner
                if o.respondent_bank_id == respondent.id and o.parent_owner_id is null]
      verified_direct = [o for o in direct if o.verification_status == 'VERIFIED']
      verified_ownership_pct = round(sum(o.ownership_pct for o in verified_direct), 2)

      # control_chain_complete: every VERIFIED direct LEGAL_ENTITY owner holding
      # >= CONTROL_LOOKTHROUGH_PCT must expose at least one VERIFIED child.
      control_chain_complete = True
      for o in verified_direct:
          if o.owner_type == 'LEGAL_ENTITY' and o.ownership_pct >= CONTROL_LOOKTHROUGH_PCT:
              children = [c for c in BeneficialOwner if c.parent_owner_id == o.id]
              if not any(c.verification_status == 'VERIFIED' for c in children):
                  control_chain_complete = False
      ownership_verified = (verified_ownership_pct >= OWNERSHIP_VERIFIED_PCT) and control_chain_complete
    input_set: "all BeneficialOwner rows of the respondent; direct owners are exactly those with parent_owner_id IS NULL"
    constants:
      OWNERSHIP_VERIFIED_PCT: 75.00
      CONTROL_LOOKTHROUGH_PCT: 25.00
    precision: "2 decimal places, round_half_up; the OWNERSHIP_VERIFIED_PCT comparison is inclusive (>=), so exactly 75.00 verifies and 74.99 does not"
    variants: []

  - name: control_score
    trigger: "POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision with action=ASSESS (writes DueDiligenceQuestionnaire.computed_control_score and RespondentBank.control_score)"
    algorithm: weighted_scoring
    formula: |
      weights = { GOVERNANCE: 0.10, KYC_ONBOARDING: 0.18, TRANSACTION_MONITORING: 0.20,
                  SANCTIONS_SCREENING: 0.22, PEP_HANDLING: 0.10, TRAINING: 0.05,
                  AUDIT: 0.08, NESTED_CONTROLS: 0.07 }          # sums to exactly 1.00
      total = 0.0
      for d in weights:                                          # fixed domain order above
          row = ControlAssessment[questionnaire_id == q.id and control_domain == d]
          rating = rating_for(row, variant)                      # see variants below
          total = total + weights[d] * rating                    # NO intermediate rounding
      raw_score = round(total * SCALE, 2)                        # 20.00 .. 100.00
      # Gap caps are applied AFTER rounding, in this order; the first match wins.
      critical_count = count(rows with gap_severity == 'CRITICAL')
      major_count    = count(rows with gap_severity == 'MAJOR')
      if critical_count >= 1:   control_score = min(raw_score, CAP_CRITICAL)
      elif major_count >= 2:    control_score = min(raw_score, CAP_TWO_MAJOR)
      elif major_count == 1:    control_score = min(raw_score, CAP_ONE_MAJOR)
      else:                     control_score = raw_score
    input_set: "the ControlAssessment rows of the questionnaire being assessed; rows belonging to any other questionnaire (including a SUPERSEDED one) are excluded"
    constants:
      SCALE: 20.0
      CAP_CRITICAL: 40.00
      CAP_TWO_MAJOR: 60.00
      CAP_ONE_MAJOR: 75.00
      MISSING_ASSESSMENT_RATING_REFRESH: 1
      NEUTRAL_DEFAULT_RATING: 3
    precision: "sum at full precision, multiply by SCALE, round to 2 decimals round_half_up, THEN apply the cap — this order is pinned and capping before rounding is wrong"
    variants:
      - name: ONBOARDING_PROVISIONAL
        when: "the payload variant is ONBOARDING_PROVISIONAL; the only variant accepted while RespondentBank.dd_state IN {PROSPECT, DD_IN_PROGRESS, PENDING_COMMITTEE}"
        difference: "rating_for(row) = row.assessed_rating when present, else row.self_rating; a domain with no ControlAssessment row at all contributes NEUTRAL_DEFAULT_RATING (3). The respondent's own self-assessment is therefore credited."
      - name: REFRESH_FINAL
        when: "the payload variant is REFRESH_FINAL; the only variant accepted while RespondentBank.dd_state IN {APPROVED, REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE, RESTRICTED}"
        difference: "rating_for(row) = row.assessed_rating when present, else MISSING_ASSESSMENT_RATING_REFRESH (1); self_rating is ignored entirely and a missing domain row also contributes 1. Identical ControlAssessment data therefore yields a strictly lower score than ONBOARDING_PROVISIONAL whenever any assessed_rating is null or any domain row is absent."

  - name: inherent_risk_score
    trigger: "POST /correspondent-banking/respondents/{respondentId}/risk-assessment (both variants)"
    algorithm: weighted_scoring
    formula: |
      J = JurisdictionProfile[respondent.home_jurisdiction_code].jurisdiction_risk_points   # 0..40

      # Ownership component O, capped at OWNERSHIP_CAP.
      verified = [o for o in BeneficialOwner
                  if o.respondent_bank_id == r.id and o.verification_status == 'VERIFIED']
      o_points = 0.0
      if any(o.is_pep for o in verified):                                  o_points += 10
      if any(o.owner_type == 'STATE' and o.effective_ownership_pct >= 10.00
             for o in verified):                                          o_points += 8
      if r.verified_ownership_pct < 75.00:                                 o_points += 6
      risky_countries = distinct(o.country_of_residence for o in verified
          if JurisdictionProfile[o.country_of_residence].sanctions_status != 'PERMITTED')
      o_points += min(12, 4 * len(risky_countries))
      O = min(OWNERSHIP_CAP, o_points)

      # Nested component N, capped at NESTED_CAP.
      live = [n for n in NestedRelationship if n.respondent_bank_id == r.id
              and n.state in ('DISCLOSED','UNDISCLOSED_DETECTED','CONFIRMED','SUSPENDED')]
      confirmed_count = count(n for n in live if n.state in ('CONFIRMED','UNDISCLOSED_DETECTED'))
      N = min(NESTED_CAP, 5 * confirmed_count + (8 if r.max_nested_depth >= 2 else 0))

      # Activity component A, tiered on declared expected volume.
      if   r.expected_monthly_volume_usd >= 100000000.00: a = 14
      elif r.expected_monthly_volume_usd >=  10000000.00: a = 10
      elif r.expected_monthly_volume_usd >=   1000000.00: a = 6
      else:                                              a = 2
      A = min(ACTIVITY_CAP, a + (2 if r.nested_activity_permitted else 0))

      inherent_risk_score = round(min(SCORE_CAP, J + O + N + A), 2)
    input_set: "JurisdictionProfile of the home jurisdiction; BeneficialOwner rows with verification_status == VERIFIED only; NestedRelationship rows in states {DISCLOSED, UNDISCLOSED_DETECTED, CONFIRMED, SUSPENDED} (PROHIBITED and TERMINATED rows are excluded); the respondent's own declared activity fields"
    constants:
      OWNERSHIP_CAP: 24.0
      NESTED_CAP: 20.0
      ACTIVITY_CAP: 16.0
      SCORE_CAP: 100.00
    precision: "2 decimal places, round_half_up; tier boundaries are inclusive at the lower edge (exactly 1000000.00 scores 6, not 2)"
    variants: []

  - name: adverse_media_uplift
    trigger: "POST /correspondent-banking/respondents/{respondentId}/risk-assessment, and the AdverseMediaEvent NEW -> CONFIRMED cascade"
    algorithm: aggregation
    formula: |
      tier_points  = { TIER_1: 12.0, TIER_2: 7.0, TIER_3: 3.0 }
      reliability  = { A: 1.00, B: 0.75, C: 0.50 }

      window_start, window_end = lookback_window(variant)      # see variants
      events = [e for e in AdverseMediaEvent
                if e.respondent_bank_id == r.id
                and e.adjudication_state == 'CONFIRMED'
                and window_start <= e.event_date < window_end]   # half-open window
      # Per-event rounding FIRST, then sum, then cap. This order is pinned.
      total = 0.00
      for e in sorted(events, key=lambda e: (e.event_date, e.created_at)):
          e.uplift_points = round(tier_points[e.severity_tier] * reliability[e.source_reliability], 2)
          total = round(total + e.uplift_points, 2)
      adverse_media_uplift = round(min(UPLIFT_CAP, total), 2)
    input_set: "AdverseMediaEvent rows of the respondent with adjudication_state == CONFIRMED whose event_date falls inside the half-open lookback window; NEW and DISMISSED rows never contribute"
    constants:
      UPLIFT_CAP: 20.00
      ONBOARDING_LOOKBACK_DAYS: 730
    precision: "each event's uplift_points rounded to 2 decimals before it enters the running sum; the running sum is re-rounded after each addition, then capped — summing at full precision and rounding once is wrong"
    variants:
      - name: ONBOARDING_LOOKBACK
        when: "the risk assessment variant is ONBOARDING_PROVISIONAL, or last_approved_at IS NULL"
        difference: "window is [logical_clock - ONBOARDING_LOOKBACK_DAYS * 24h, logical_clock)"
      - name: SINCE_LAST_APPROVAL
        when: "the risk assessment variant is REFRESH_FINAL and last_approved_at IS NOT NULL"
        difference: "window is [last_approved_at, min(logical_clock, base_window_end)) where base_window_end comes from step 1 of refresh_due_date — events published after the base cadence window closed do not inflate the uplift used to accelerate that same window"

  - name: residual_risk_score
    trigger: "POST /correspondent-banking/respondents/{respondentId}/risk-assessment, and the AdverseMediaEvent NEW -> CONFIRMED cascade"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned: control_credit depends only on control_score,
      # never on residual_risk_score or risk_rating.
      if r.control_score <= 20.00:
          control_credit = 0.0000
      else:
          control_credit = round((r.control_score - 20.00) / 80.00 * MAX_CREDIT, 4)
      residual_risk_score = round(
          round(r.inherent_risk_score * (1.0 - control_credit), 2) + r.adverse_media_uplift, 2)
    input_set: "the respondent's own inherent_risk_score, control_score and adverse_media_uplift, each written earlier in the same request"
    constants:
      MAX_CREDIT: 0.4500
    precision: "control_credit to 4 decimals; the credited inherent score rounded to 2 decimals BEFORE the uplift is added, then the sum rounded to 2 decimals"
    variants: []

  - name: risk_rating_assignment
    trigger: "immediately after residual_risk_score inside the same request"
    algorithm: threshold
    formula: |
      jp = JurisdictionProfile[r.home_jurisdiction_code]
      if jp.sanctions_status == 'COMPREHENSIVELY_SANCTIONED':
          risk_rating = 'PROHIBITED'                        # hard override, wins over thresholds
      elif r.residual_risk_score >= PROHIBITED_AT: risk_rating = 'PROHIBITED'
      elif r.residual_risk_score >= HIGH_AT:       risk_rating = 'HIGH'
      elif r.residual_risk_score >= MEDIUM_AT:     risk_rating = 'MEDIUM'
      else:                                        risk_rating = 'LOW'
    input_set: "the respondent's residual_risk_score written in the same request plus the home JurisdictionProfile"
    constants:
      PROHIBITED_AT: 70.00
      HIGH_AT: 50.00
      MEDIUM_AT: 30.00
    precision: "all comparisons are inclusive (>=): exactly 50.00 is HIGH, 49.99 is MEDIUM"
    variants: []

  - name: refresh_due_date
    trigger: "RespondentBank PENDING_COMMITTEE -> APPROVED, UNDER_REFRESH -> APPROVED, and the AdverseMediaEvent NEW -> CONFIRMED cascade"
    algorithm: constraint_propagation
    formula: |
      # The naive statement of this rule is circular: the cadence depends on the
      # rating, the rating depends on the adverse-media uplift, and the uplift
      # window depends on the cadence. The evaluation order below breaks the
      # cycle and is PINNED; implementations must not iterate to a fixed point.
      cadence = { LOW: 36, MEDIUM: 24, HIGH: 12, PROHIBITED: 0 }

      # step 1 — base window from the rating FROZEN at the last approval.
      base_window_end = add_months(r.last_approved_at, cadence[r.approved_risk_rating])

      # step 2 — uplift over the half-open window [last_approved_at, min(clock, base_window_end)).
      uplift = adverse_media_uplift(variant='SINCE_LAST_APPROVAL', base_window_end=base_window_end)

      # step 3 — live scores from that uplift (residual_risk_score, risk_rating).
      live_rating = risk_rating_assignment(residual_risk_score(uplift))

      # step 4 — accelerated candidate from the LIVE rating; step 3's output must
      #          never be fed back into steps 1 or 2.
      accelerated = add_months(r.last_approved_at, cadence[live_rating])
      tier1 = [e for e in AdverseMediaEvent
               if e.respondent_bank_id == r.id and e.adjudication_state == 'CONFIRMED'
               and e.severity_tier == 'TIER_1'
               and r.last_approved_at <= e.event_date < min(clock, base_window_end)]
      if tier1:
          earliest_triage = min(e.triaged_at for e in tier1)
          accelerated = min(accelerated, earliest_triage + TIER1_ACCEL_DAYS * 24h)

      # step 5 — final due date, floored so a refresh is never instantly overdue.
      refresh_due_date = max(r.last_approved_at + MIN_CADENCE_DAYS * 24h,
                             min(base_window_end, accelerated))
    input_set: "the respondent's last_approved_at and approved_risk_rating (frozen at approval), its CONFIRMED AdverseMediaEvent rows inside the base window, and the live rating derived in step 3"
    constants:
      TIER1_ACCEL_DAYS: 30
      MIN_CADENCE_DAYS: 30
    precision: "whole-instant arithmetic; add_months preserves day-of-month and clamps to the target month's last day"
    variants:
      - name: AT_APPROVAL
        when: "called from PENDING_COMMITTEE -> APPROVED or UNDER_REFRESH -> APPROVED"
        difference: "last_approved_at and approved_risk_rating are the values just written in this request, so steps 1 and 4 initially agree and refresh_due_date equals base_window_end unless a TIER_1 item already sits inside the window"
      - name: ON_ADVERSE_MEDIA
        when: "called from the AdverseMediaEvent NEW -> CONFIRMED cascade"
        difference: "last_approved_at and approved_risk_rating are unchanged historical values, so the live rating in step 3 can be worse than approved_risk_rating and refresh_due_date moves strictly earlier"

  - name: nested_chain_depth
    trigger: "POST /correspondent-banking/respondents/{respondentId}/nested-relationships and POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication"
    algorithm: topological
    formula: |
      # depth 1 = the respondent's own downstream institution. When that
      # downstream is itself a known RespondentBank (downstream_respondent_bank_id
      # is set), its own live nested rows extend the chain transitively.
      def chain_depth(row):
          d = 1
          cur = row
          seen = { row.respondent_bank_id }
          while cur.downstream_respondent_bank_id is not null:
              if cur.downstream_respondent_bank_id in seen:
                  raise ERR_NESTED_CYCLE_DETECTED                # prohibition_reason CYCLE
              seen.add(cur.downstream_respondent_bank_id)
              nxt = first(n for n in NestedRelationship
                          if n.respondent_bank_id == cur.downstream_respondent_bank_id
                          and n.state in ('DISCLOSED','UNDISCLOSED_DETECTED','CONFIRMED','SUSPENDED')
                          order by n.depth DESC, n.created_at ASC)
              if nxt is null: break
              d = d + 1
              cur = nxt
          return d
      row.depth = chain_depth(row)
      respondent.max_nested_depth = max(n.depth for n in live rows of respondent, default 0)
    input_set: "NestedRelationship rows in states {DISCLOSED, UNDISCLOSED_DETECTED, CONFIRMED, SUSPENDED} across every respondent reachable through downstream_respondent_bank_id; PROHIBITED and TERMINATED rows do not extend a chain"
    constants:
      NESTED_MAX_DEPTH: 4
    precision: "integer depth; a depth above NESTED_MAX_DEPTH is rejected with ERR_NESTED_DEPTH_EXCEEDED rather than clamped"
    variants: []

  - name: nested_prohibition_precedence
    trigger: "POST /correspondent-banking/respondents/{respondentId}/nested-relationships and POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication with action=PROHIBIT"
    algorithm: threshold
    formula: |
      # Exactly one prohibition_reason is recorded. When several conditions hold
      # the FIRST match in this ladder wins and its paired error is the one
      # returned; later conditions are not evaluated for the response.
      jp = JurisdictionProfile[row.downstream_jurisdiction_code]
      if chain revisits a respondent already in the chain:
          reason = 'CYCLE'                              -> ERR_NESTED_CYCLE_DETECTED
      elif jp.sanctions_status == 'COMPREHENSIVELY_SANCTIONED':
          reason = 'SANCTIONED_JURISDICTION'            -> ERR_NESTED_SANCTIONED_JURISDICTION
      elif jp.nested_correspondent_prohibited:
          reason = 'JURISDICTION_PROHIBITS_NESTING'     -> ERR_NESTED_JURISDICTION_PROHIBITS_NESTING
      elif row.depth >= PROHIBIT_DEPTH_AT:
          reason = 'DEPTH_EXCEEDED'                     -> ERR_NESTED_DEPTH_EXCEEDED
      elif row.relationship_type == 'PAYABLE_THROUGH' and not respondent.nested_activity_permitted:
          reason = 'PAYABLE_THROUGH_NOT_PERMITTED'      -> ERR_PAYABLE_THROUGH_NOT_PERMITTED
      else:
          reason = null                                 # relationship may be CONFIRMED
    input_set: "the NestedRelationship row, the JurisdictionProfile of its downstream_jurisdiction_code, the computed depth, and the parent respondent's nested_activity_permitted flag"
    constants:
      PROHIBIT_DEPTH_AT: 3
    precision: "depth comparison inclusive (>=): depth 3 is prohibited, depth 2 is not"
    variants: []

  - name: nested_exposure_rollup
    trigger: "every NestedRelationship creation and every adjudication transition"
    algorithm: aggregation
    formula: |
      state_weight = { DISCLOSED: 1, UNDISCLOSED_DETECTED: 5, CONFIRMED: 3,
                       SUSPENDED: 3, PROHIBITED: 0, TERMINATED: 0 }
      rows = [n for n in NestedRelationship if n.respondent_bank_id == r.id]
      r.nested_exposure_units   = sum(state_weight[n.state] * n.depth for n in rows)
      r.disclosed_nested_count  = count(n for n in rows if n.state in ('DISCLOSED','CONFIRMED'))
      r.undisclosed_nested_count= count(n for n in rows if n.state == 'UNDISCLOSED_DETECTED')
      r.max_nested_depth        = max((n.depth for n in rows
                                      if n.state in ('DISCLOSED','UNDISCLOSED_DETECTED',
                                                     'CONFIRMED','SUSPENDED')), default=0)
    input_set: "all NestedRelationship rows of the respondent, including PROHIBITED and TERMINATED rows (which contribute weight 0)"
    constants: {}
    precision: "integer units; CONFIRMED and SUSPENDED share weight 3 on purpose, so suspending a confirmed relationship and reverting it leaves nested_exposure_units unchanged"
    variants: []

  - name: monitoring_threshold_calibration
    trigger: "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration with action=CALIBRATE"
    algorithm: proration
    formula: |
      rating_factor = { UNRATED: 1.30, LOW: 1.30, MEDIUM: 1.15, HIGH: 1.00, PROHIBITED: 0.85 }
      f = rating_factor[respondent.risk_rating]
      t = profile.tolerance_pct

      corridor_thresholds = []
      for c in profile.expected_corridors:            # payload order is preserved
          w = JurisdictionProfile[c.jurisdiction_code].corridor_risk_weight     # 0.50 .. 2.50
          usd_raw   = c.expected_monthly_usd * (1.0 + t) * f / w
          usd_thr   = round(max(USD_FLOOR, min(USD_CEILING, usd_raw)), 2)
          count_raw = c.expected_monthly_count * (1.0 + t) * f / w
          count_thr = max(COUNT_FLOOR, ceil(count_raw))
          corridor_thresholds.append({ jurisdiction_code: c.jurisdiction_code,
                                       usd_threshold: usd_thr,
                                       count_threshold: count_thr })

      # Rounding order is PINNED: round each corridor first, sum the ROUNDED
      # values, then apply the aggregate buffer, then round once more.
      aggregate_usd_threshold = round(sum(x.usd_threshold for x in corridor_thresholds)
                                     * AGGREGATE_BUFFER, 2)
      hold_threshold_usd      = round(aggregate_usd_threshold / HOLD_DIVISOR, 2)
    input_set: "the TransactionMonitoringProfile row and its expected_corridors array, the JurisdictionProfile.corridor_risk_weight of each corridor, and the respondent's current risk_rating"
    constants:
      USD_FLOOR: 10000.00
      USD_CEILING: 500000000.00
      COUNT_FLOOR: 5
      AGGREGATE_BUFFER: 1.10
      HOLD_DIVISOR: 10.0
    precision: "USD thresholds 2 decimals round_half_up after clamping; count thresholds ceil (always round UP) then floored at COUNT_FLOOR; summing unrounded corridor values before the buffer is wrong"
    variants: []

  - name: alert_generation
    trigger: "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations"
    algorithm: threshold
    formula: |
      # Alerts are created in this PINNED order, so created_at ordering and the
      # ActivityObservation.alerts_created_count are deterministic:
      #   1 CORRIDOR_UNEXPECTED  2 VOLUME_BREACH  3 COUNT_BREACH
      #   4 NESTED_ACTIVITY_UNDISCLOSED
      corridor = find(profile.expected_corridors, jurisdiction_code == obs.corridor_jurisdiction_code)

      if corridor is null:
          # unexpected corridor: severity from the corridor jurisdiction's standing
          jp = JurisdictionProfile[obs.corridor_jurisdiction_code]
          sev = { COMPREHENSIVELY_SANCTIONED: 'CRITICAL',
                  RESTRICTED: 'HIGH' }.get(jp.sanctions_status, 'MEDIUM')
          create MonitoringAlert(alert_type='CORRIDOR_UNEXPECTED', severity=sev, breach_ratio=null)
          obs.usd_threshold_applied = 0.00; obs.count_threshold_applied = 0
          obs.breach_ratio = 0.0000
      else:
          thr = profile.corridor_thresholds[corridor.jurisdiction_code]
          obs.usd_threshold_applied   = thr.usd_threshold
          obs.count_threshold_applied = thr.count_threshold
          obs.breach_ratio = round(obs.aggregate_usd / thr.usd_threshold, 4)
          # VOLUME/COUNT alerts are suppressed unless the profile is CALIBRATED;
          # a PROVISIONAL or RECALIBRATION_REQUIRED profile still records the
          # observation and still raises CORRIDOR_UNEXPECTED and NESTED alerts.
          if profile.calibration_state == 'CALIBRATED':
              if obs.aggregate_usd >= thr.usd_threshold:
                  if   obs.breach_ratio >= 3.0000: sev = 'CRITICAL'
                  elif obs.breach_ratio >= 2.0000: sev = 'HIGH'
                  elif obs.breach_ratio >= 1.5000: sev = 'MEDIUM'
                  else:                            sev = 'LOW'
                  create MonitoringAlert(alert_type='VOLUME_BREACH', severity=sev,
                                         breach_ratio=obs.breach_ratio)
              if obs.txn_count >= thr.count_threshold:
                  create MonitoringAlert(alert_type='COUNT_BREACH',
                                         severity=('HIGH' if obs.txn_count >= 2 * thr.count_threshold
                                                   else 'MEDIUM'),
                                         breach_ratio=null)

      known_nested = count(n for n in NestedRelationship
                           if n.respondent_bank_id == r.id and n.state in ('DISCLOSED','CONFIRMED'))
      if obs.distinct_downstream_count > known_nested:        # strict >, unlike the breach tests
          create MonitoringAlert(alert_type='NESTED_ACTIVITY_UNDISCLOSED',
                                 severity=('CRITICAL' if not r.nested_activity_permitted else 'HIGH'),
                                 breach_ratio=null)
      obs.alerts_created_count = number of MonitoringAlert rows created above
    input_set: "the ActivityObservation payload, the parent TransactionMonitoringProfile's expected_corridors / corridor_thresholds / calibration_state, the JurisdictionProfile of the observed corridor, and the respondent's NestedRelationship rows in states {DISCLOSED, CONFIRMED}"
    constants:
      CRITICAL_RATIO_AT: 3.0000
      HIGH_RATIO_AT: 2.0000
      MEDIUM_RATIO_AT: 1.5000
    precision: "breach_ratio 4 decimals round_half_up; volume and count breaches use inclusive >= (aggregate_usd exactly equal to the threshold breaches) while the nested-activity test uses strict > (distinct_downstream_count equal to the known count does NOT alert)"
    variants: []

  - name: rfi_response_sla
    trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/dispatch"
    algorithm: proration
    formula: |
      base = { CRITICAL: 24, HIGH: 72, MEDIUM: 168, LOW: 336 }[request.severity]
      hours = base
      if respondent.risk_rating in ('HIGH','PROHIBITED'): hours = hours * RISK_COMPRESSION
      if respondent.unresponsive_strikes >= STRIKE_COMPRESSION_AT: hours = hours * STRIKE_COMPRESSION
      sla_hours = max(SLA_FLOOR_HOURS, ceil(hours))
      due_at    = dispatched_at + sla_hours * 1h
      # OVERDUE is reachable once logical_clock >= due_at; the escalation ladder
      # advances one level per ESCALATION_WINDOW_HOURS elapsed past due_at,
      # capped at escalation_level 3.
    input_set: "the InformationRequest severity and dispatched_at, plus the respondent's risk_rating and unresponsive_strikes as they stand at dispatch"
    constants:
      RISK_COMPRESSION: 0.5
      STRIKE_COMPRESSION: 0.5
      STRIKE_COMPRESSION_AT: 2
      SLA_FLOOR_HOURS: 12
      ESCALATION_WINDOW_HOURS: 72
    precision: "both compressions multiply (a HIGH-rated respondent with 2 strikes gets base * 0.25), ceil to whole hours, then floor at SLA_FLOOR_HOURS; the due_at comparison is inclusive (clock exactly equal to due_at is overdue)"
    variants: []

  - name: unresponsive_strike_ledger
    trigger: "POST /correspondent-banking/information-requests/{informationRequestId}/overdue-marking and POST /correspondent-banking/information-requests/{informationRequestId}/adjudication"
    algorithm: aggregation
    formula: |
      # OVERDUE marking adds one strike; a late-but-accepted response can hand
      # part of it back. The credit is bounded so the ledger never goes negative.
      on SENT -> OVERDUE:            r.unresponsive_strikes += 1
      on RESPONDED -> ACCEPTED with retro_credit == true:
                                     r.unresponsive_strikes = max(0,
                                         r.unresponsive_strikes - request.reminder_count)
      on RESPONDED -> SENT (INSUFFICIENT, insufficiency_rounds < 2): unchanged
      on OVERDUE/ESCALATED -> ABANDONED: r.unresponsive_strikes += 1
      r.escalation_units = sum(request.escalation_level for every InformationRequest of r)
      if r.unresponsive_strikes >= RESTRICTION_AT and r.dd_state not in ('EXITING','TERMINATED'):
          r.dd_state = 'RESTRICTED'; r.restriction_reason = 'UNRESPONSIVE_STRIKES'
          r.payment_posture = 'SCREEN_ONLY' if r.payment_posture == 'OPEN' else r.payment_posture
    input_set: "the InformationRequest being transitioned plus every InformationRequest of the respondent for the escalation_units rollup"
    constants:
      RESTRICTION_AT: 3
    precision: "integer counters, floored at 0; the restriction threshold is inclusive (>=)"
    variants: []

  - name: payment_screening_decision
    trigger: "POST /correspondent-banking/respondents/{respondentId}/payment-instructions"
    algorithm: threshold
    formula: |
      # Exactly one outcome. The FIRST matching branch wins; nothing below it is
      # evaluated for the recorded screening_state / hold_reason.
      oj = JurisdictionProfile[instruction.ordering_jurisdiction_code]
      bj = JurisdictionProfile[instruction.beneficiary_jurisdiction_code]

      if oj.sanctions_status == 'COMPREHENSIVELY_SANCTIONED'
         or bj.sanctions_status == 'COMPREHENSIVELY_SANCTIONED':
          screening_state = 'BLOCKED_SANCTIONS'; hold_reason = null
      elif no TransactionMonitoringProfile of r with calibration_state == 'CALIBRATED'
           whose [effective_from, effective_to] closed interval contains logical_clock:
          screening_state = 'RECEIVED'; hold_reason = null       # cannot be screened yet
      else:
          profile = that CALIBRATED profile
          if oj.sanctions_status == 'RESTRICTED' or bj.sanctions_status == 'RESTRICTED':
              screening_state = 'HELD_FOR_REVIEW'; hold_reason = 'SANCTIONS_RESTRICTED_JURISDICTION'
          elif r.payment_posture in ('SCREEN_ONLY','WIND_DOWN_ONLY'):
              screening_state = 'HELD_FOR_REVIEW'; hold_reason = 'POSTURE_SCREEN_ONLY'
          elif instruction.involves_nested_party and (
                   instruction.nested_relationship_id is null
                   or NestedRelationship[instruction.nested_relationship_id].state
                      not in ('DISCLOSED','CONFIRMED')):
              screening_state = 'HELD_FOR_REVIEW'; hold_reason = 'UNDISCLOSED_NESTED_PARTY'
          elif instruction.amount_usd >= profile.hold_threshold_usd:
              screening_state = 'HELD_FOR_REVIEW'; hold_reason = 'AMOUNT_THRESHOLD'
              instruction.hold_threshold_applied = profile.hold_threshold_usd
          else:
              screening_state = 'SCREENED_CLEAR'; hold_reason = null
      # payment_posture == 'BLOCKED' is refused before this calculation runs
      # (ERR_RESPONDENT_PAYMENT_POSTURE_BLOCKED), so it never reaches a branch here.
    input_set: "the PaymentInstruction payload, the JurisdictionProfile of both jurisdictions, the respondent's payment_posture, the CALIBRATED TransactionMonitoringProfile covering the logical clock, and the referenced NestedRelationship when involves_nested_party is true"
    constants: {}
    precision: "the amount test is inclusive (>=): amount_usd exactly equal to hold_threshold_usd is held"
    variants: []

  - name: notice_period_days
    trigger: "POST /correspondent-banking/respondents/{respondentId}/closure-plans and POST /correspondent-banking/closure-plans/{closurePlanId}/approval with action=APPROVE"
    algorithm: threshold
    formula: |
      base = { UNRESPONSIVE: 30, SANCTIONS_EXPOSURE: 0, PROHIBITED_NESTING: 15,
               REGULATORY_ACTION: 15, RISK_APPETITE: 60, COMMERCIAL: 90 }[termination_reason]
      days = base
      if r.outstanding_obligation_source > 0: days = days + OBLIGATION_EXTENSION_DAYS
      if r.risk_rating == 'PROHIBITED':       days = days - PROHIBITED_REDUCTION_DAYS
      days = max(0, days)
      if JurisdictionProfile[r.home_jurisdiction_code].sanctions_status
         == 'COMPREHENSIVELY_SANCTIONED':
          days = 0                             # hard override, applied LAST
      notice_period_days = days
      # outstanding_obligation_source is plan.original_obligation_cents from the
      # creation payload, so the extension is decided from the obligation the
      # plan is opened with, not from the running outstanding balance.
    input_set: "the ClosurePlan termination_reason and original_obligation_cents, the respondent's risk_rating, and the home JurisdictionProfile"
    constants:
      OBLIGATION_EXTENSION_DAYS: 15
      PROHIBITED_REDUCTION_DAYS: 15
    precision: "integer days, floored at 0; the sanctioned-home-jurisdiction override is applied after the floor and wins over every adjustment"
    variants: []

  - name: wind_down_cap
    trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/approval with action=APPROVE"
    algorithm: proration
    formula: |
      months = notice_period_days / DAYS_PER_MONTH
      base   = base_monthly_usd(cap_basis)                      # see variants
      wind_down_cap_usd = round(base * months * RELEASE_FRACTION, 2)
      wind_down_end_at  = notice_served_at + notice_period_days * 24h   # set at NOTICE_SERVED
      # Every PaymentInstruction released while payment_posture == 'WIND_DOWN_ONLY'
      # adds its amount_usd to wind_down_released_usd; a release that would push
      # wind_down_released_usd above wind_down_cap_usd is refused with
      # ERR_WIND_DOWN_CAP_EXCEEDED.
    input_set: "the approved notice_period_days, the requested cap_basis, and either the respondent's declared expected_monthly_volume_usd or its ActivityObservation history"
    constants:
      DAYS_PER_MONTH: 30.0
      RELEASE_FRACTION: 0.60
      ACTUAL_LOOKBACK_PERIODS: 3
      PERIOD_CAP_FACTOR: 1.25
    precision: "single rounding to 2 decimals round_half_up at the end of the FORWARD_PROJECTED formula; CHRONOLOGICAL_ACTUAL rounds each capped period to 2 decimals before averaging, so the two bases can differ by cents on identical inputs"
    variants:
      - name: FORWARD_PROJECTED
        when: "cap_basis == FORWARD_PROJECTED, the only basis permitted when the respondent has no ActivityObservation rows"
        difference: "base = respondent.expected_monthly_volume_usd — the declared figure, ignoring what actually flowed"
      - name: CHRONOLOGICAL_ACTUAL
        when: "cap_basis == CHRONOLOGICAL_ACTUAL"
        difference: |
          Walk the respondent's ActivityObservation rows (across all of its
          monitoring profiles) ordered period_month ASC, then created_at ASC, and
          take the last ACTUAL_LOOKBACK_PERIODS distinct period_month values. For
          each period sum aggregate_usd across corridors, then cap that period at
          round(PERIOD_CAP_FACTOR * aggregate_usd_threshold, 2) using the
          threshold of the profile that owns the period's rows. base = the mean of
          the capped period totals, rounded to 2 decimals. With no observation
          rows at all the request fails with ERR_INSUFFICIENT_ACTIVITY_HISTORY
          rather than falling back to the declared volume.

  - name: settlement_allocation
    trigger: "POST /correspondent-banking/closure-plans/{closurePlanId}/settlement-allocation"
    algorithm: allocation
    formula: |
      # ALLOCATE distributes amount_cents across the respondent's expected
      # corridors, largest expected volume first.
      corridors = expected_corridors of the CALIBRATED (else most recent) profile,
                  sorted by expected_monthly_usd DESC, then jurisdiction_code ASC
      total_expected = sum(c.expected_monthly_usd for c in corridors)

      lines = []
      for c in corridors:
          line_cents = round_half_up(amount_cents * c.expected_monthly_usd / total_expected)
          lines.append({ jurisdiction_code: c.jurisdiction_code, cents: line_cents })
      # Per-line rounding FIRST, then the whole residue lands on the first line in
      # sort order. Distributing the residue across lines is wrong.
      residue = amount_cents - sum(l.cents for l in lines)
      lines[0].cents = lines[0].cents + residue

      plan.allocation_lines        = lines
      plan.settled_cents           = plan.settled_cents + amount_cents
      plan.outstanding_obligation_cents = plan.outstanding_obligation_cents - amount_cents
      plan.last_allocated_cents    = amount_cents
      plan.allocation_round        = plan.allocation_round + 1
      # INVARIANT, checked after every ALLOCATE and REVERSE:
      #   outstanding_obligation_cents + settled_cents == original_obligation_cents
      #   and 0 <= outstanding_obligation_cents <= original_obligation_cents
      # REVERSE is the exact inverse: it requires allocation_round >= 1 and
      # amount_cents == last_allocated_cents, subtracts from settled_cents, adds
      # back to outstanding_obligation_cents, decrements allocation_round, clears
      # allocation_lines when allocation_round reaches 0 and sets
      # last_allocated_cents to 0. Two REVERSEs in a row are refused.
    input_set: "the ClosurePlan's obligation counters and the expected_corridors of the respondent's monitoring profile"
    constants: {}
    precision: "integer cents throughout; round_half_up per line, then the residue (which may be negative) is absorbed entirely by the first line"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# A single request that fails several checks returns the error of the LOWEST
# priority number. The four dual-failure pairs the domain deliberately builds
# are called out inline as "PRECEDENCE PAIR Pn".
# =============================================================================
validations:

  # --- 1..3 authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when the acting role is RespondentContact, X-User-ID equals the RespondentBank.id that owns the addressed resource (directly, or through the resource's respondent_bank_id / questionnaire / monitoring profile / alert / request chain)"
    error_id: ERR_RESPONDENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include RespondentContact"

  # --- 4 existence of path resources, left to right ------------------------
  - priority: 4
    category: existence
    check: "each path id resolves, evaluated strictly left-to-right so the leftmost missing segment decides the error: respondentId -> ERR_RESPONDENT_NOT_FOUND, jurisdictionProfileId -> ERR_JURISDICTION_PROFILE_NOT_FOUND, beneficialOwnerId -> ERR_BENEFICIAL_OWNER_NOT_FOUND, questionnaireId -> ERR_QUESTIONNAIRE_NOT_FOUND, controlAssessmentId -> ERR_CONTROL_ASSESSMENT_NOT_FOUND, nestedRelationshipId -> ERR_NESTED_RELATIONSHIP_NOT_FOUND, monitoringProfileId -> ERR_MONITORING_PROFILE_NOT_FOUND, activityObservationId -> ERR_ACTIVITY_OBSERVATION_NOT_FOUND, monitoringAlertId -> ERR_MONITORING_ALERT_NOT_FOUND, informationRequestId -> ERR_INFORMATION_REQUEST_NOT_FOUND, adverseMediaEventId -> ERR_ADVERSE_MEDIA_EVENT_NOT_FOUND, periodicRefreshId -> ERR_PERIODIC_REFRESH_NOT_FOUND, paymentInstructionId -> ERR_PAYMENT_INSTRUCTION_NOT_FOUND, closurePlanId -> ERR_CLOSURE_PLAN_NOT_FOUND"
    error_id: ERR_RESPONDENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  # --- 5..9 request-body shape and query validation ------------------------
  - priority: 5
    category: business_constraint
    check: "every required field named in the endpoint's input is present and of the declared type; unknown fields are ignored"
    error_id: ERR_INVALID_REQUEST_BODY
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 6
    category: business_constraint
    check: "every enum-typed field carries one of the values enumerated for it in §1.1 (including action discriminators such as VERIFY/REJECT, ASSESS/RETURN, CONFIRM/PROHIBIT/SUSPEND/REVERT/TERMINATE, ALLOCATE/REVERSE)"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 400
    applies_to: "all POST and PATCH endpoints"

  - priority: 7
    category: business_constraint
    check: "numeric fields sit inside their declared domain: ownership_pct in (0.00, 100.00]; self_rating and assessed_rating in 1..5; domain_weight in (0.00, 1.00]; tolerance_pct in [0.00, 0.50]; basel_aml_index in [0.00, 10.00]; corridor_risk_weight in [0.50, 2.50]; amount_usd > 0; amount_cents > 0; expected_corridors length in 1..8; depth in 1..4"
    error_id: ERR_FIELD_OUT_OF_RANGE
    http_status: 400
    applies_to: "all POST and PATCH endpoints carrying numeric fields"

  - priority: 8
    category: business_constraint
    check: "pagination query parameters parse as integers with limit in 1..100 and offset >= 0 (defaults limit=10, offset=0)"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"

  - priority: 9
    category: business_constraint
    check: "date and month formats parse: event_date and period_month as ISO-8601 date / YYYY-MM, effective_from and effective_to as ISO-8601 instants"
    error_id: ERR_INVALID_DATE_FORMAT
    http_status: 400
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/adverse-media-events, POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles, POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations, POST /_clock/set_current_utc"

  # --- 10 optimistic concurrency ------------------------------------------
  - priority: 10
    category: state
    check: "expected_respondent_version equals the addressed RespondentBank's current version; checked BEFORE any state precondition so a stale writer learns its view is out of date rather than being told the respondent is in the wrong state"
    error_id: ERR_STALE_RESPONDENT_VERSION
    http_status: 412
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/questionnaires, POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles"

  # --- 11..14 state preconditions -----------------------------------------
  - priority: 11
    category: state
    check: "the addressed RespondentBank's dd_state permits the requested operation per §1.2 (e.g. approval requires PENDING_COMMITTEE; licensing-verification is refused once dd_state is TERMINATED; risk-assessment requires dd_state NOT IN {DECLINED, TERMINATED})"
    error_id: ERR_INVALID_RESPONDENT_STATE
    http_status: 409
    applies_to: "every respondent-scoped write endpoint"

  - priority: 12
    category: state
    check: "the addressed child resource is in a state from which the requested transition is declared in §1.2: questionnaire (ERR_INVALID_QUESTIONNAIRE_STATE), nested relationship (ERR_INVALID_NESTED_STATE), monitoring profile (ERR_INVALID_MONITORING_PROFILE_STATE), alert (ERR_INVALID_ALERT_STATE), information request (ERR_INVALID_RFI_STATE), adverse media event (ERR_INVALID_MEDIA_STATE), periodic refresh (ERR_INVALID_REFRESH_STATE), payment instruction (ERR_INVALID_PAYMENT_STATE), closure plan (ERR_INVALID_CLOSURE_STATE), beneficial owner (ERR_INVALID_OWNER_STATE)"
    error_id: ERR_INVALID_QUESTIONNAIRE_STATE
    http_status: 409
    applies_to: "every child-resource transition endpoint"

  - priority: 13
    category: state
    check: "clarification_rounds < 3 before a questionnaire may be RETURNED_FOR_CLARIFICATION again, and insufficiency_rounds < 2 before an information request may be pushed RESPONDED -> SENT again"
    error_id: ERR_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision, POST /correspondent-banking/information-requests/{informationRequestId}/adjudication"

  - priority: 14
    category: state
    check: "payment_posture is not BLOCKED when submitting a PaymentInstruction, and not BLOCKED or SCREEN_ONLY when releasing one. PRECEDENCE PAIR P1: a release attempt against a respondent whose posture is BLOCKED and whose closure plan would also breach its wind-down cap returns this 403, never the fiscal ERR_WIND_DOWN_CAP_EXCEEDED at priority 41."
    error_id: ERR_RESPONDENT_PAYMENT_POSTURE_BLOCKED
    http_status: 403
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/payment-instructions, POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision"

  # --- 20..27 business safety / regulatory --------------------------------
  - priority: 20
    category: business_safety
    check: "a respondent whose dd_state is TERMINATED accepts no write at all except reads; a respondent whose dd_state is EXITING accepts only closure-plan progression, payment screening decisions and information-request handling"
    error_id: ERR_RESPONDENT_RELATIONSHIP_CLOSED
    http_status: 403
    applies_to: "every respondent-scoped write endpoint"

  - priority: 21
    category: business_safety
    check: "releasing a PaymentInstruction whose screening_state is BLOCKED_SANCTIONS is forbidden to every role including SanctionsOfficer; the only permitted exit is REJECTED. PRECEDENCE PAIR P2 (part 1): when the instruction is BLOCKED_SANCTIONS and also references an undisclosed nested party, this 403 wins over the referential ERR_NESTED_DISCLOSURE_MISSING at priority 30."
    error_id: ERR_SANCTIONED_PAYMENT_RELEASE_FORBIDDEN
    http_status: 403
    applies_to: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision"

  - priority: 22
    category: business_safety
    check: "approval requires license_status IN {ACTIVE, CONDITIONAL} AND regulator_standing == GOOD_STANDING AND license_verified_at IS NOT NULL"
    error_id: ERR_LICENSE_NOT_IN_GOOD_STANDING
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/approval"

  - priority: 23
    category: business_safety
    check: "approval requires ownership_verified == true (verified_ownership_pct >= 75.00 and control_chain_complete)"
    error_id: ERR_OWNERSHIP_CHAIN_INCOMPLETE
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/approval"

  - priority: 24
    category: business_safety
    check: "approval requires rank(risk_rating) <= rank(JurisdictionProfile.max_permitted_risk_rating) of the home jurisdiction, where rank is LOW<MEDIUM<HIGH<PROHIBITED; a risk_rating of PROHIBITED or UNRATED is never approvable"
    error_id: ERR_RATING_EXCEEDS_JURISDICTION_CEILING
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/approval"

  - priority: 25
    category: business_safety
    check: "a NestedRelationship may not be CONFIRMED when nested_prohibition_precedence yields a non-null reason; the reason's paired error is returned (ERR_NESTED_CYCLE_DETECTED, ERR_NESTED_SANCTIONED_JURISDICTION, ERR_NESTED_JURISDICTION_PROHIBITS_NESTING, ERR_NESTED_DEPTH_EXCEEDED, ERR_PAYABLE_THROUGH_NOT_PERMITTED) in exactly that ladder order"
    error_id: ERR_NESTED_SANCTIONED_JURISDICTION
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/nested-relationships, POST /correspondent-banking/nested-relationships/{nestedRelationshipId}/adjudication"

  - priority: 26
    category: business_safety
    check: "a respondent with undisclosed_nested_count > 0 cannot be approved and cannot have its payment_posture widened to OPEN"
    error_id: ERR_UNDISCLOSED_NESTING_OUTSTANDING
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/approval, PATCH /correspondent-banking/respondents/{respondentId}"

  - priority: 27
    category: business_safety
    check: "a respondent whose home jurisdiction is COMPREHENSIVELY_SANCTIONED cannot be created in any state past PROSPECT and cannot be approved; its payment_posture is forced to BLOCKED"
    error_id: ERR_HOME_JURISDICTION_SANCTIONED
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents, PATCH /correspondent-banking/respondents/{respondentId}, POST /correspondent-banking/respondents/{respondentId}/approval"

  # --- 30..34 business referential ----------------------------------------
  - priority: 30
    category: business_referential
    check: "when involves_nested_party is true the payload's nested_relationship_id must be present, belong to the same respondent, and be in state DISCLOSED or CONFIRMED. PRECEDENCE PAIR P2 (part 2): the same instruction can also sit in a sanctioned corridor — the safety check at priority 21 wins."
    error_id: ERR_NESTED_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/payment-instructions, POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision"

  - priority: 31
    category: business_referential
    check: "every jurisdiction_code in the payload (home_jurisdiction_code, downstream_jurisdiction_code, ordering_jurisdiction_code, beneficiary_jurisdiction_code, corridor_jurisdiction_code, country_of_residence, expected_corridors[].jurisdiction_code) resolves to an existing JurisdictionProfile"
    error_id: ERR_JURISDICTION_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "every POST or PATCH carrying a jurisdiction code"

  - priority: 32
    category: business_referential
    check: "a body-supplied parent id belongs to the addressed parent: parent_owner_id belongs to the same respondent_bank_id; monitoring_alert_id belongs to the respondent the request is filed against; nested_relationship_id belongs to the addressed respondent; activity_observation_id belongs to a monitoring profile of that respondent"
    error_id: ERR_CROSS_RESPONDENT_REFERENCE
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/beneficial-owners, POST /correspondent-banking/respondents/{respondentId}/information-requests, POST /correspondent-banking/respondents/{respondentId}/payment-instructions"

  - priority: 33
    category: business_referential
    check: "a questionnaire may only be SUBMITTED when all eight control domains have a ControlAssessment row, and may only be ASSESSED when every row of a REFRESH_FINAL assessment carries an assessed_rating"
    error_id: ERR_CONTROL_DOMAINS_INCOMPLETE
    http_status: 422
    applies_to: "POST /correspondent-banking/questionnaires/{questionnaireId}/submission, POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision"

  - priority: 34
    category: business_referential
    check: "an observation may only be posted against a TransactionMonitoringProfile whose calibration_state is not SUPERSEDED, and a wind-down cap on CHRONOLOGICAL_ACTUAL basis requires at least one ActivityObservation for the respondent"
    error_id: ERR_MONITORING_PROFILE_SUPERSEDED
    http_status: 422
    applies_to: "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations"

  # --- 35..39 business constraint (graph, uniqueness, overlap, SoD) --------
  - priority: 35
    category: business_constraint
    check: "the beneficial-ownership graph stays acyclic and shallow: a parent_owner_id whose ancestor set already contains the node is ERR_OWNERSHIP_CYCLE_DETECTED; a resulting chain_depth > 4 is ERR_OWNERSHIP_DEPTH_EXCEEDED; the sum of ownership_pct across siblings sharing the same parent_owner_id (or across direct owners) may not exceed 100.00, which is ERR_OWNERSHIP_PCT_EXCEEDS_100"
    error_id: ERR_OWNERSHIP_CYCLE_DETECTED
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/beneficial-owners"

  - priority: 36
    category: business_constraint
    check: "uniqueness: swift_bic is unique across RespondentBank; jurisdiction_code is unique across JurisdictionProfile; (questionnaire_id, control_domain) is unique across ControlAssessment; expected_corridors[].jurisdiction_code is unique inside one profile; (monitoring_profile_id, period_month, corridor_jurisdiction_code) is unique across ActivityObservation; at most one questionnaire per respondent may sit in {DRAFT, SUBMITTED, UNDER_ASSESSMENT, RETURNED_FOR_CLARIFICATION}; at most one ClosurePlan per respondent may sit in {DRAFT, PENDING_APPROVAL, APPROVED, NOTICE_SERVED, WIND_DOWN}"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /correspondent-banking/respondents, POST /correspondent-banking/jurisdiction-profiles, POST /correspondent-banking/questionnaires/{questionnaireId}/control-assessments, POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles, POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations, POST /correspondent-banking/respondents/{respondentId}/questionnaires, POST /correspondent-banking/respondents/{respondentId}/closure-plans"

  - priority: 37
    category: business_constraint
    check: "TransactionMonitoringProfile effective intervals are CLOSED [effective_from, effective_to] per respondent: adjacency IS an overlap (a new profile starting exactly at an existing profile's effective_to conflicts), and at most one profile may be CALIBRATED over any instant. PRECEDENCE PAIR P3: a create whose interval overlaps AND whose corridor totals would exceed the aggregate ceiling returns this 409, not the fiscal error at priority 42."
    error_id: ERR_MONITORING_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles"

  - priority: 38
    category: business_constraint
    check: "PeriodicRefresh windows are HALF-OPEN [window_start, scheduled_due_date) per respondent: adjacency is allowed (a new cycle may start exactly at the previous cycle's scheduled_due_date) but any true interior overlap with a cycle in {SCHEDULED, IN_PROGRESS} is rejected. PRECEDENCE PAIR P4: an overlapping window that also violates the post-completion buffer returns this 409, not the temporal ERR_REFRESH_BUFFER_VIOLATION at priority 40."
    error_id: ERR_REFRESH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/periodic-refreshes"

  - priority: 39
    category: business_constraint
    check: "segregation of duties: the X-User-ID approving a respondent may not equal its assessed_by_user_id; the X-User-ID assessing a questionnaire may not equal the RespondentContact id that submitted it; the X-User-ID approving a closure plan may not equal its drafted_by_user_id; the X-User-ID disposing of an alert may not equal the X-User-ID that adjudicated the information request raised from it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/approval, POST /correspondent-banking/questionnaires/{questionnaireId}/assessment-decision, POST /correspondent-banking/closure-plans/{closurePlanId}/approval, POST /correspondent-banking/monitoring-alerts/{monitoringAlertId}/disposition"

  # --- 40 business temporal ------------------------------------------------
  - priority: 40
    category: business_temporal
    check: "temporal admissibility against the logical clock: a new PeriodicRefresh whose window_start falls within 30 days after a COMPLETED cycle's scheduled_due_date is ERR_REFRESH_BUFFER_VIOLATION; effective_to <= effective_from is ERR_EFFECTIVE_INTERVAL_INVALID; an AdverseMediaEvent event_date after the clock is ERR_EVENT_DATE_IN_FUTURE; an observation period_month beyond the clock's month is ERR_OBSERVATION_PERIOD_IN_FUTURE; marking an InformationRequest OVERDUE before clock >= due_at is ERR_RFI_NOT_YET_OVERDUE; closing a ClosurePlan before clock >= wind_down_end_at is ERR_NOTICE_PERIOD_NOT_ELAPSED"
    error_id: ERR_REFRESH_BUFFER_VIOLATION
    http_status: 422
    applies_to: "POST /correspondent-banking/respondents/{respondentId}/periodic-refreshes, POST /correspondent-banking/respondents/{respondentId}/monitoring-profiles, POST /correspondent-banking/respondents/{respondentId}/adverse-media-events, POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/observations, POST /correspondent-banking/information-requests/{informationRequestId}/overdue-marking, POST /correspondent-banking/closure-plans/{closurePlanId}/progression"

  # --- 41..43 business fiscal (last) --------------------------------------
  - priority: 41
    category: business_fiscal
    check: "releasing a PaymentInstruction while payment_posture is WIND_DOWN_ONLY requires wind_down_released_usd + amount_usd <= wind_down_cap_usd of the respondent's live ClosurePlan; a release that would exceed it is refused (see PRECEDENCE PAIR P1 at priority 14)"
    error_id: ERR_WIND_DOWN_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /correspondent-banking/payment-instructions/{paymentInstructionId}/screening-decision"

  - priority: 42
    category: business_fiscal
    check: "calibration requires the summed rounded corridor thresholds to stay within the aggregate ceiling: aggregate_usd_threshold <= 500000000.00 after the 1.10 buffer (see PRECEDENCE PAIR P3 at priority 37)"
    error_id: ERR_AGGREGATE_THRESHOLD_EXCEEDED
    http_status: 422
    applies_to: "POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration"

  - priority: 43
    category: business_fiscal
    check: "settlement arithmetic preserves the obligation invariant: ALLOCATE requires amount_cents <= outstanding_obligation_cents (ERR_SETTLEMENT_EXCEEDS_OUTSTANDING); REVERSE requires allocation_round >= 1 (ERR_NO_ALLOCATION_TO_REVERSE) and amount_cents == last_allocated_cents (ERR_REVERSAL_AMOUNT_MISMATCH); a CHRONOLOGICAL_ACTUAL cap with no ActivityObservation history is ERR_INSUFFICIENT_ACTIVITY_HISTORY"
    error_id: ERR_SETTLEMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /correspondent-banking/closure-plans/{closurePlanId}/settlement-allocation, POST /correspondent-banking/closure-plans/{closurePlanId}/approval"

# =============================================================================
# §1.5 API Endpoint Table
# Every path is namespaced under api_prefix /correspondent-banking except the
# single test-driving clock endpoint. All list endpoints accept limit? and
# offset? (defaults limit=10, offset=0, max limit=100) and return results
# ordered created_at ASC unless the description states another order.
# =============================================================================
endpoints:

  # ---------------- JurisdictionProfile ------------------------------------
  - method: POST
    path: "/correspondent-banking/jurisdiction-profiles"
    description: "Register a jurisdiction's sanctions, FATF, secrecy and corridor-weight profile. Computes jurisdiction_risk_points immediately."
    roles: [PlatformAdmin, SanctionsOfficer]
    code: 201
    input: ["jurisdiction_code", "name", "basel_aml_index", "corridor_risk_weight", "sanctions_status?", "fatf_listing?", "secrecy_flag?", "nested_correspondent_prohibited?", "max_permitted_risk_rating?"]
    output: JurisdictionProfile
    side_effects: ["calculations.jurisdiction_risk_points", "rejects a duplicate jurisdiction_code with ERR_DUPLICATE_RESOURCE"]

  - method: GET
    path: "/correspondent-banking/jurisdiction-profiles"
    description: "List jurisdiction profiles, optionally filtered by sanctions posture or FATF listing."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover]
    code: 200
    input: ["sanctions_status?", "fatf_listing?", "nested_correspondent_prohibited?", "limit?", "offset?"]
    output: JurisdictionProfile[]
    side_effects: []

  - method: GET
    path: "/correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}"
    description: "Read one jurisdiction profile including its computed jurisdiction_risk_points."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover]
    code: 200
    input: []
    output: JurisdictionProfile
    side_effects: []

  - method: PATCH
    path: "/correspondent-banking/jurisdiction-profiles/{jurisdictionProfileId}"
    description: "Amend a jurisdiction's standing. Tightening sanctions_status to COMPREHENSIVELY_SANCTIONED cascades to every respondent domiciled there and to every nested relationship pointing into it."
    roles: [PlatformAdmin, SanctionsOfficer]
    code: 200
    input: ["sanctions_status?", "fatf_listing?", "basel_aml_index?", "secrecy_flag?", "corridor_risk_weight?", "nested_correspondent_prohibited?", "max_permitted_risk_rating?", "name?"]
    output: JurisdictionProfile
    side_effects: ["calculations.jurisdiction_risk_points", "on a move to COMPREHENSIVELY_SANCTIONED: every RespondentBank whose home_jurisdiction_code matches and whose dd_state is not TERMINATED moves to RESTRICTED with restriction_reason SANCTIONS_EXPOSURE and payment_posture BLOCKED; every live NestedRelationship whose downstream_jurisdiction_code matches moves to PROHIBITED with prohibition_reason SANCTIONED_JURISDICTION", "calculations.nested_exposure_rollup for every respondent touched by that cascade"]

  # ---------------- RespondentBank ----------------------------------------
  - method: POST
    path: "/correspondent-banking/respondents"
    description: "Onboard a respondent bank as a PROSPECT with payment_posture BLOCKED and risk_rating UNRATED."
    roles: [FIGRelationshipManager, PlatformAdmin]
    code: 201
    input: ["legal_name", "swift_bic", "home_jurisdiction_code", "relationship_manager_user_id", "expected_monthly_volume_usd", "expected_monthly_count", "license_status?", "regulator_name?", "regulator_standing?", "nested_activity_permitted?"]
    output: RespondentBank
    side_effects: ["rejects an unknown home_jurisdiction_code with ERR_JURISDICTION_PROFILE_NOT_FOUND and a duplicate swift_bic with ERR_DUPLICATE_RESOURCE", "rejects a COMPREHENSIVELY_SANCTIONED home jurisdiction with ERR_HOME_JURISDICTION_SANCTIONED", "initialises dd_state PROSPECT, payment_posture BLOCKED, risk_rating UNRATED, version 1"]

  - method: GET
    path: "/correspondent-banking/respondents"
    description: "List respondent banks, filterable across the due-diligence and payment dimensions."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover]
    code: 200
    input: ["dd_state?", "payment_posture?", "risk_rating?", "home_jurisdiction_code?", "license_status?", "limit?", "offset?"]
    output: RespondentBank[]
    side_effects: []

  - method: GET
    path: "/correspondent-banking/respondents/{respondentId}"
    description: "Read one respondent bank including every computed score, counter and its current version (the value an OCC writer must echo back)."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: []
    output: RespondentBank
    side_effects: []

  - method: PATCH
    path: "/correspondent-banking/respondents/{respondentId}"
    description: "Amend commercial expectations, the relationship manager, the nested-activity permission or the payment posture. Widening payment_posture to OPEN is gated on approval and on there being no undisclosed nesting."
    roles: [FIGRelationshipManager, PlatformAdmin]
    code: 200
    input: ["legal_name?", "expected_monthly_volume_usd?", "expected_monthly_count?", "nested_activity_permitted?", "relationship_manager_user_id?", "payment_posture?"]
    output: RespondentBank
    side_effects: ["a payment_posture widening to OPEN requires dd_state APPROVED and undisclosed_nested_count == 0, else ERR_UNDISCLOSED_NESTING_OUTSTANDING", "changing expected_monthly_volume_usd or expected_monthly_count while a CALIBRATED TransactionMonitoringProfile exists sets that profile to RECALIBRATION_REQUIRED with recalibration_reason OFFICER_ACTION", "increments RespondentBank.version by 1"]

  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/licensing-verification"
    description: "Record the outcome of licensing and regulatory-standing verification against the home regulator."
    roles: [ComplianceAnalyst, PlatformAdmin]
    code: 200
    input: ["license_status", "regulator_standing", "regulator_name?"]
    output: RespondentBank
    side_effects: ["stamps license_verified_at with the logical clock", "moves dd_state PROSPECT -> DD_IN_PROGRESS on the first verification", "a move to license_status SUSPENDED or REVOKED, or regulator_standing UNDER_ENFORCEMENT or DEREGISTERED, sets dd_state RESTRICTED with restriction_reason LICENSE_LAPSE and payment_posture SCREEN_ONLY", "increments RespondentBank.version by 1"]

  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/risk-assessment"
    description: "Score the respondent. The variant decides how missing control ratings are treated and which adverse-media lookback window applies, so the same stored data yields different scores under ONBOARDING_PROVISIONAL and REFRESH_FINAL."
    roles: [ComplianceAnalyst]
    code: 200
    input: [variant]
    output: RespondentBank
    side_effects: ["calculations.ownership_verification_rollup", "calculations.inherent_risk_score", "calculations.control_score (variant-matched)", "calculations.adverse_media_uplift", "calculations.residual_risk_score", "calculations.risk_rating_assignment", "sets risk_assessment_variant, assessed_by_user_id = X-User-ID and last_risk_assessed_at = the logical clock", "moves dd_state DD_IN_PROGRESS -> PENDING_COMMITTEE when the variant is ONBOARDING_PROVISIONAL and ownership_verified is true", "increments RespondentBank.version by 1"]

  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/approval"
    description: "Committee decision on a PENDING_COMMITTEE respondent. Approval freezes approved_risk_rating and derives the refresh cadence; the approver may not be the analyst who scored the respondent."
    roles: [CommitteeApprover]
    code: 200
    input: ["action", "decision_note?"]
    output: RespondentBank
    side_effects: ["APPROVE requires license and regulator standing, ownership_verified, no undisclosed nesting and a rating within the jurisdiction ceiling", "APPROVE sets dd_state APPROVED, approved_by_user_id = X-User-ID, approved_risk_rating = risk_rating, last_approved_at = the logical clock, payment_posture SCREEN_ONLY", "calculations.refresh_due_date (variant AT_APPROVAL)", "DECLINE sets dd_state DECLINED and leaves payment_posture BLOCKED", "ERR_SEGREGATION_OF_DUTIES when X-User-ID equals assessed_by_user_id", "increments RespondentBank.version by 1"]

  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/restriction"
    description: "Restrict or un-restrict a respondent outside the committee flow — the officer lever behind unresponsiveness, adverse media and sanctions exposure."
    roles: [SanctionsOfficer, ComplianceAnalyst]
    code: 200
    input: ["action", "restriction_reason?", "payment_posture?"]
    output: RespondentBank
    side_effects: ["RESTRICT sets dd_state RESTRICTED with the supplied restriction_reason (required) and narrows payment_posture to SCREEN_ONLY or BLOCKED", "LIFT requires dd_state RESTRICTED, undisclosed_nested_count == 0 and unresponsive_strikes < 3, and returns dd_state to APPROVED with payment_posture SCREEN_ONLY, clearing restriction_reason", "increments RespondentBank.version by 1"]

  # ---------------- BeneficialOwner ---------------------------------------
  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/beneficial-owners"
    description: "Declare a beneficial owner, optionally under an existing owner to model a look-through chain. Rejects cycles, chains deeper than four and sibling percentages summing past 100."
    roles: [ComplianceAnalyst, RespondentContact]
    code: 201
    input: ["owner_name", "owner_type", "ownership_pct", "country_of_residence", "parent_owner_id?", "is_pep?"]
    output: BeneficialOwner
    side_effects: ["computes chain_depth from the parent chain", "calculations.effective_ownership_pct", "sets verification_status PENDING", "ERR_OWNERSHIP_CYCLE_DETECTED, ERR_OWNERSHIP_DEPTH_EXCEEDED and ERR_OWNERSHIP_PCT_EXCEEDS_100 are evaluated in that order"]

  - method: GET
    path: "/correspondent-banking/beneficial-owners"
    description: "List beneficial owners across the ownership graph; filter by respondent, by immediate parent (to walk one level down a chain) or by verification status."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: ["respondent_bank_id?", "parent_owner_id?", "verification_status?", "owner_type?", "limit?", "offset?"]
    output: BeneficialOwner[]
    side_effects: []

  - method: GET
    path: "/correspondent-banking/beneficial-owners/{beneficialOwnerId}"
    description: "Read one beneficial owner including chain_depth and effective_ownership_pct."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: []
    output: BeneficialOwner
    side_effects: []

  - method: POST
    path: "/correspondent-banking/beneficial-owners/{beneficialOwnerId}/verification"
    description: "Verify or reject a declared owner. Every decision re-derives the respondent's ownership rollup, which in turn gates approval."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["action", "rejection_reason?"]
    output: BeneficialOwner
    side_effects: ["VERIFY sets verification_status VERIFIED and verified_by_user_id = X-User-ID; REJECT sets REJECTED and requires rejection_reason", "calculations.effective_ownership_pct", "calculations.ownership_verification_rollup on the parent RespondentBank", "increments RespondentBank.version by 1"]

  # ---------------- DueDiligenceQuestionnaire + ControlAssessment ----------
  - method: POST
    path: "/correspondent-banking/respondents/{respondentId}/questionnaires"
    description: "Open a new CDDQ version for the respondent. Any earlier questionnaire not yet ASSESSED is SUPERSEDED by this create, so the caller must echo the respondent version it last observed."
    roles: [RespondentContact, ComplianceAnalyst]
    code: 201
    input: ["questionnaire_version", "expected_respondent_version", "declared_nested_activity?", "declared_downstream_count?"]
    output: DueDiligenceQuestionnaire
    side_effects: ["ERR_STALE_RESPONDENT_VERSION (412) when expected_respondent_version does not equal the respondent's current version", "supersedes any questionnaire of this respondent in DRAFT, SUBMITTED, UNDER_ASSESSMENT or RETURNED_FOR_CLARIFICATION", "creates the row in DRAFT with clarification_rounds 0", "increments RespondentBank.version by 1"]

  - method: GET
    path: "/correspondent-banking/questionnaires"
    description: "List questionnaires, filtered by respondent_bank_id to see one respondent's CDDQ versions, ordered questionnaire_version DESC then created_at ASC."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: ["respondent_bank_id?", "state?", "limit?", "offset?"]
    output: DueDiligenceQuestionnaire[]
    side_effects: []

  - method: GET
    path: "/correspondent-banking/questionnaires/{questionnaireId}"
    description: "Read one questionnaire including computed_control_score and the variant that produced it."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: []
    output: DueDiligenceQuestionnaire
    side_effects: []

  - method: POST
    path: "/correspondent-banking/questionnaires/{questionnaireId}/submission"
    description: "Respondent submits the questionnaire for assessment. Requires a ControlAssessment row for all eight control domains."
    roles: [RespondentContact]
    code: 200
    input: []
    output: DueDiligenceQuestionnaire
    side_effects: ["requires state DRAFT or RETURNED_FOR_CLARIFICATION, else ERR_INVALID_QUESTIONNAIRE_STATE", "ERR_CONTROL_DOMAINS_INCOMPLETE when any of the eight control domains has no row", "sets state SUBMITTED and submitted_at = the logical clock"]

  - method: POST
    path: "/correspondent-banking/questionnaires/{questionnaireId}/assessment-decision"
    description: "Analyst assesses the questionnaire or returns it for clarification. ASSESS computes the control score under the supplied variant; the permitted variant depends on the respondent's dd_state."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["action", "variant?", "clarification_note?"]
    output: DueDiligenceQuestionnaire
    side_effects: ["ASSESS requires state SUBMITTED or UNDER_ASSESSMENT and a variant; calculations.control_score writes computed_control_score, control_score_variant, assessed_at, assessed_by_user_id and mirrors control_score onto the RespondentBank", "RETURN requires clarification_rounds < 3, increments clarification_rounds and sets state RETURNED_FOR_CLARIFICATION, else ERR_ROUNDS_EXHAUSTED", "ERR_SEGREGATION_OF_DUTIES when X-User-ID equals the respondent's id (the submitting RespondentContact identity)", "increments RespondentBank.version by 1 on ASSESS"]

  - method: POST
    path: "/correspondent-banking/questionnaires/{questionnaireId}/control-assessments"
    description: "Add the respondent's self-rating for one control domain. One row per (questionnaire, control_domain)."
    roles: [RespondentContact, ComplianceAnalyst]
    code: 201
    input: ["control_domain", "self_rating", "evidence_note?"]
    output: ControlAssessment
    side_effects: ["requires the questionnaire in DRAFT or RETURNED_FOR_CLARIFICATION", "sets domain_weight from the fixed weight table in calculations.control_score, gap_severity NONE and remediation_required false", "ERR_DUPLICATE_RESOURCE on a repeated control_domain"]

  - method: GET
    path: "/correspondent-banking/control-assessments"
    description: "List control-domain assessment rows, filtered by questionnaire_id to see one questionnaire's eight domains, ordered by the fixed domain weight table declared in calculations.control_score."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: ["questionnaire_id?", "control_domain?", "gap_severity?", "limit?", "offset?"]
    output: ControlAssessment[]
    side_effects: []

  - method: GET
    path: "/correspondent-banking/control-assessments/{controlAssessmentId}"
    description: "Read one control-domain assessment row."
    roles: [PlatformAdmin, SanctionsOfficer, ComplianceAnalyst, FIGRelationshipManager, CommitteeApprover, RespondentContact]
    code: 200
    input: []
    output: ControlAssessment
    side_effects: []

  - method: PATCH
    path: "/correspondent-banking/control-assessments/{controlAssessmentId}"
    description: "Analyst overlays its own assessed_rating and gap severity on a self-rated control domain. Whether the assessed_rating or the self_rating is credited is decided later by the control_score variant."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["assessed_rating?", "gap_severity?", "remediation_required?", "evidence_note?"]
    output: ControlAssessment
