      - name: serial_reuse_closed_buffer_blocks_within_30_days
        grounds:
          - calculations.serial_reuse_window
          - validations[priority=22]
          - entities.EquipmentUnit.fields.disposed_clock_utc
          - state_machines.EquipmentUnit.transitions.RETURNED_to_DISPOSED
        distinguishing_aspect: |
          CLOSED-BUFFER interval semantics on EquipmentUnit serials: a serial DISPOSED at 2026-03-01 is
          blocked for reuse through 2026-03-31 inclusive; re-attaching the same serial at 2026-03-15
          (inside [D, D+30d]) returns ERR_SERIAL_REUSE_TOO_SOON — different interval arithmetic
          (inclusive buffer) from the UCC half-open window, on a different resource entity.
        test_recipe:
          setup:
            - "A unit with serial DUP-1 disposed at clock 2026-03-01 on an end-of-term/returned lease; clock then 2026-03-15"
            - "A second ACTIVE lease ready to attach equipment"
          setup_api_calls:
