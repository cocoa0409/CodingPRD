            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: Treasurer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE — role check (priority 2) precedes any state or OCC evaluation"

      - name: store_manager_cannot_count_drawer
        claim_type: rbac_denial
        grounds: ["roles[Treasurer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Drawer counting is Treasurer-exclusive; even the StoreManager who scheduled the event cannot count it."
        test_recipe:
          setup: ["Program ACTIVE; event OPEN (float 10000)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game", register_location: "GYM-M", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
          trigger:
            - { call: "POST /spirit-store/event-sales/${ev}/close-count", payload: { closing_counted_cents: 10000 }, as: StoreManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE"

      - name: customer_cannot_exchange_others_order
        claim_type: rbac_denial
        grounds: ["roles[Customer]", "validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Customer ownership is enforced via X-User-ID == order.customer_user_id; cust-B opening an exchange on cust-A's order is a 403, not a 404."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0; variants M and L stocked 25 each; event OPEN; POS CARD order qty 1 of M recorded for customer_user_id cust-A"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500 }, as: StoreManager, captures: { vm: $.data.id } }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "L", unit_price_cents: 2500 }, as: StoreManager, captures: { vl: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${vm}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po1: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po1}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po1}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/event-sales", payload: { program_id: "${prog}", name: "Game", register_location: "GYM-N", starts_at: "2026-09-05T14:00:00Z", ends_at: "2026-09-05T16:00:00Z" }, as: StoreManager, captures: { ev: $.data.id } }
            - { call: "POST /spirit-store/event-sales/${ev}/open-drawer", payload: { opening_float_cents: 10000 }, as: StudentCashier, as_user_id: "cashier-01" }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: EVENT_POS, event_id: "${ev}", customer_user_id: "cust-A", payment_method: CARD, lines: [ { variant_id: "${vm}", qty: 1 } ] }, as: StudentCashier, as_user_id: "cashier-01", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /spirit-store/exchanges", payload: { program_id: "${prog}", order_id: "${ord}", original_variant_id: "${vm}", new_variant_id: "${vl}" }, as: Customer, as_user_id: "cust-B", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (cust-B does not own order ${ord})"

  # ============================================================ 8. Cross-cutting complexity layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_program_version_on_drop_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drop-create-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential drop creates carrying the same observed program version: the first succeeds and bumps MerchProgram.version; the second is rejected 412 — no parallelism involved."
        test_recipe:
          setup: ["Program ACTIVE; client observed version 2 (post-activation)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Fall", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", expected_program_version: "${pv}" }, as: StoreManager, captures: { d1: $.data.id } }
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Winter", opens_at: "2026-11-01T00:00:00Z", closes_at: "2026-12-01T00:00:00Z", expected_program_version: "${pv}" }, as: StoreManager, captures: { err: $.data.error_id } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: StoreManager, captures: { pv_now: $.data.version } }
          assert:
            - "d1 created; the create bumped MerchProgram.version from ${pv} to ${pv} + 1"
            - "err == ERR_STALE_VERSION (412) — the Winter create replayed a stale observed version"
            - "pv_now == ${pv} + 1 (failed OCC write did not advance the version)"

      - name: occ_stale_design_version_on_resubmit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[design-resubmit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a rejection advanced the design to v3, a resubmission replaying the pre-rejection v2 is rejected 412; replaying the current v3 succeeds — deterministic two-sequential-request OCC."
        test_recipe:
          setup: ["Program ACTIVE; design DRAFT v1 -> SUBMITTED v2 -> REJECTED v3"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: REJECTED, expected_design_version: "${v2}", note: "colors" }, as: LicensingCoordinator, captures: { v3: $.data.version } }
          trigger:
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v2}" }, as: LicensingCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v3}" }, as: LicensingCoordinator, captures: { st: $.data.status, rev: $.data.revision_count } }
          assert:
            - "err == ERR_STALE_VERSION for the stale ${v2} replay"
            - "st == SUBMITTED AND rev == 1 for the current ${v3}"

      - name: run_ops_expires_pickup_and_closes_drop
        claim_type: ops_run_checkpoint
        grounds: [endpoints: "POST /spirit-store/programs/{programId}/run-ops", state_machines.Order.READY_FOR_PICKUP_to_EXPIRED_RELEASED, state_machines.SeasonalDrop.OPEN_to_CLOSED, entities.MerchProgram.fields.ops_run_index]
        distinguishing_aspect: "One ops run at clock 2026-09-13 processes two epoch rules atomically: the drop whose closes_at passed is CLOSED, and the READY_FOR_PICKUP order whose 7-day window lapsed is EXPIRED_RELEASED with full refund and reservation release."
        test_recipe:
          setup: ["Program ACTIVE; design APPROVED fee 0 royalty 0; drop [2026-08-01, 2026-09-10) OPEN; variant M attached to the drop, price 2500, stocked 25 (landed 500); clock 2026-09-05; ONLINE CARD order qty 1 marked READY_FOR_PICKUP (ready 09-05, expires 09-12); reserved_online_qty 1; undistributed profit 2000"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector, captures: { pv: $.data.version } }
            - { call: "POST /spirit-store/designs", payload: { program_id: "${prog}", name: "Eagle", artwork_ref: "e.png", royalty_pct: 0, licensing_fee_cents: 0 }, as: StoreManager, captures: { des: $.data.id, v1: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: SUBMITTED, expected_design_version: "${v1}" }, as: LicensingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /spirit-store/designs/${des}/licensing-transition", payload: { to_state: APPROVED, expected_design_version: "${v2}" }, as: LicensingCoordinator }
            - { call: "POST /spirit-store/seasonal-drops", payload: { program_id: "${prog}", name: "Fall", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-09-10T00:00:00Z", expected_program_version: "${pv}" }, as: StoreManager, captures: { drop: $.data.id } }
            - { call: "POST /spirit-store/product-variants", payload: { program_id: "${prog}", design_id: "${des}", size: "M", unit_price_cents: 2500, drop_id: "${drop}" }, as: StoreManager, captures: { var: $.data.id } }
            - { call: "POST /spirit-store/vendors", payload: { program_id: "${prog}", name: "PrintCo", contact_email: "p@co.com", quotes: [ { design_id: "${des}", unit_cost_cents: 500, min_order_qty: 25, production_days: 10, status: ACTIVE } ] }, as: StoreManager, captures: { ven: $.data.id } }
            - { call: "PATCH /spirit-store/vendors/${ven}", payload: { status: APPROVED }, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders", payload: { program_id: "${prog}", variant_id: "${var}", vendor_id: "${ven}", qty_ordered: 25 }, as: StoreManager, captures: { po: $.data.id } }
            - { call: "POST /spirit-store/purchase-orders/${po}/submit", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/purchase-orders/${po}/receive", payload: { qty: 25 }, as: StoreManager }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: ActivitiesDirector }
            - { call: "POST /spirit-store/seasonal-drops/${drop}/transition", payload: { to_state: OPEN }, as: StoreManager }
            - { call: "POST /spirit-store/orders", payload: { program_id: "${prog}", channel: ONLINE, customer_user_id: "cust-90", payment_method: CARD, lines: [ { variant_id: "${var}", qty: 1 } ] }, as: Customer, as_user_id: "cust-90", captures: { ord: $.data.id } }
            - { call: "POST /spirit-store/orders/${ord}/fulfillment-transition", payload: { to_state: READY_FOR_PICKUP }, as: StoreManager, captures: { exp: $.data.expires_at } }
            - { call: "POST /spirit-store/_clock/set_current_utc", payload: { to_iso8601: "2026-09-13T00:00:00Z" }, as: ActivitiesDirector }
          trigger:
            - { call: "POST /spirit-store/programs/${prog}/run-ops", payload: {}, as: ActivitiesDirector, captures: { ops_idx: $.data.ops_run_index } }
            - { call: "GET /spirit-store/orders/${ord}", payload: {}, as: Treasurer, captures: { ful: $.data.fulfillment_status, pay: $.data.payment_status, ref: $.data.refunded_cents } }
            - { call: "GET /spirit-store/seasonal-drops/${drop}", payload: {}, as: Treasurer, captures: { drop_st: $.data.status } }
            - { call: "GET /spirit-store/product-variants/${var}", payload: {}, as: Treasurer, captures: { oh: $.data.on_hand_qty, rs: $.data.reserved_online_qty, se: $.data.sellable } }
            - { call: "GET /spirit-store/programs/${prog}", payload: {}, as: Treasurer, captures: { prof: $.data.undistributed_profit_cents } }
          assert:
            - "exp == 2026-09-12T12:00:00Z (ready 2026-09-05T12:00:00Z + 7 days)"
            - "ops_idx == 1"
            - "ful == EXPIRED_RELEASED AND pay == REFUNDED AND ref == 2500"
            - "drop_st == CLOSED (closes_at 2026-09-10 <= clock)"
            - "oh == 25 AND rs == 0 AND se == false (stock released; drop-closed variant unsellable)"
            - "prof == 0 (margin 2000 recognized at sale, fully reversed at expiry)"

      - name: cascade_revoke_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Design.APPROVED_to_REVOKED]
        excluded_because:
          difficulty_instance: design_revoke_cascade_depth3
          rationale: "The 3-link cascade is asserted hop-by-hop there."

      - name: cascade_receipt_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.PurchaseOrder.SUBMITTED_to_RECEIVED]
        excluded_because:
          difficulty_instance: po_receipt_triggers_campaign_fulfillment
          rationale: "The receipt -> stock -> campaign-advance chain is asserted there."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: campaign_units_provisional_vs_final
          rationale: "Both layered dual-variant calculations are exercised by the two Rule-1 instances."

  # ============================================================ 9. Consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_covered
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: order_total_per_line_rounding
          rationale: "That instance asserts computed total_cents on the POST response itself and the cascaded event counter on the immediate follow-up GET — same-request and immediate-read visibility both proven."
