            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z", organizing_meeting_at: "2026-09-05T18:30:00Z", organizing_meeting_attendees: 9 }
