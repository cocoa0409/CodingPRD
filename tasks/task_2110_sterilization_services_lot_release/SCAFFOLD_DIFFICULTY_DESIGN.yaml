scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: delivered_dose_routine_mean_vs_min_zone_flips_conformance
        grounds:
          - calculations.delivered_dose_kgy
          - calculations.dose_conformance_verdict
          - entities.CycleRecipe.fields.dose_basis
          - state_machines.Cycle.DOSIMETRY_REVIEW_to_DOSE_CONFORMING
          - state_machines.Cycle.DOSIMETRY_REVIEW_to_DOSE_DEVIATION
        distinguishing_aspect: |
          This dual variant lives in the Cycle dosimetry domain: two recipes that
          differ ONLY in dose_basis, fed byte-identical dosimeter readings
          (MIN_DOSE 26.85; ROUTINE 28.40 and 31.78), yield delivered_dose_kgy
          30.09 under ROUTINE_MEAN and 26.85 under MIN_ZONE, which flips
          dose_conformance_verdict from CONFORMING to UNDERDOSE against the same
          min_dose_kgy of 27.0.
        test_recipe:
          setup:
            - "Two GAMMA chambers under one permit, two approved recipes RM (dose_basis ROUTINE_MEAN) and MZ (dose_basis MIN_ZONE) identical in every other field, each with a QUALIFIED ProductQualification for product P1."
            - "Two lots of P1, one loaded into cycle CRM (recipe RM) and one into cycle CMZ (recipe MZ); both cycles carry exactly three dosimeters with the identical serial-to-reading mapping (MIN_DOSE 26.85, ROUTINE 28.40, ROUTINE 31.78) and zero biological indicators."
            - "Both cycles are COMPLETED with every indicator READ; CRM has already been closed and sits in DOSE_CONFORMING with delivered_dose_kgy 30.09."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-G1", modality: "GAMMA", pallet_capacity: 8, turnaround_minutes: 30, abatement_efficiency_pct: 0.0 }
              as: RegulatoryAdmin
              captures: { chg1_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-G2", modality: "GAMMA", pallet_capacity: 8, turnaround_minutes: 30, abatement_efficiency_pct: 0.0 }
              as: RegulatoryAdmin
              captures: { chg2_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RM", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 2, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rm_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rm_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "MZ", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "MIN_ZONE", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 2, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { mz_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${mz_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${rm_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { qrm_id: $.data.id }
            - call: "POST /sterilization/qualifications/${qrm_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${mz_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { qmz_id: $.data.id }
            - call: "POST /sterilization/qualifications/${qmz_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-RM", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_rm_id: $.data.id }
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-MZ", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_mz_id: $.data.id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rm_id}", cycle_code: "C-RM", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { crm_id: $.data.id, crm_v: $.data.version }
            - call: "POST /sterilization/cycles/${crm_id}/load-positions"
              payload: { lot_id: "${lot_rm_id}", position_index: 1, zone: "MIN_DOSE", pallet_count: 2, expected_cycle_version: "${crm_v}" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { pos_rm_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos_rm_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "MIN_DOSE", serial_code: "RM-MIN" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { rm_min_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos_rm_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "ROUTINE", serial_code: "RM-RT1" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { rm_rt1_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos_rm_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "ROUTINE", serial_code: "RM-RT2" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { rm_rt2_id: $.data.id }
            - call: "POST /sterilization/cycles/${crm_id}/ready"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/cycles/${crm_id}/start"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/cycles/${crm_id}/complete"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/indicators/${rm_min_id}/reading"
              payload: { measured_dose_kgy: 26.85 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/indicators/${rm_rt1_id}/reading"
              payload: { measured_dose_kgy: 28.40 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/indicators/${rm_rt2_id}/reading"
              payload: { measured_dose_kgy: 31.78 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/cycles/${crm_id}/dosimetry-close"
              payload: {}
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg2_id}", recipe_id: "${mz_id}", cycle_code: "C-MZ", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cmz_id: $.data.id, cmz_v: $.data.version }
            - call: "POST /sterilization/cycles/${cmz_id}/load-positions"
              payload: { lot_id: "${lot_mz_id}", position_index: 1, zone: "MIN_DOSE", pallet_count: 2, expected_cycle_version: "${cmz_v}" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { pos_mz_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos_mz_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "MIN_DOSE", serial_code: "MZ-MIN" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { mz_min_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos_mz_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "ROUTINE", serial_code: "MZ-RT1" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { mz_rt1_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos_mz_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "ROUTINE", serial_code: "MZ-RT2" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { mz_rt2_id: $.data.id }
            - call: "POST /sterilization/cycles/${cmz_id}/ready"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/cycles/${cmz_id}/start"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/cycles/${cmz_id}/complete"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/indicators/${mz_min_id}/reading"
              payload: { measured_dose_kgy: 26.85 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/indicators/${mz_rt1_id}/reading"
              payload: { measured_dose_kgy: 28.40 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/indicators/${mz_rt2_id}/reading"
              payload: { measured_dose_kgy: 31.78 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
          trigger:
            - call: "POST /sterilization/cycles/${cmz_id}/dosimetry-close"
              payload: {}
              as: DosimetryAnalyst
              as_user_id: "ana-1"
          assert:
            - "Cycle.${crm_id}.delivered_dose_kgy == 30.09"
            - "Cycle.${crm_id}.max_observed_dose_kgy == 31.78"
            - "Cycle.${crm_id}.status == DOSE_CONFORMING"
            - "Cycle.${crm_id}.deviation_code == NONE"
            - "Cycle.${cmz_id}.delivered_dose_kgy == 26.85"
            - "Cycle.${cmz_id}.max_observed_dose_kgy == 31.78"
            - "Cycle.${cmz_id}.status == DOSE_DEVIATION"
            - "Cycle.${cmz_id}.deviation_code == UNDERDOSE"
            - "Lot.${lot_rm_id}.cumulative_dose_kgy == 30.09 and Lot.${lot_mz_id}.cumulative_dose_kgy == 0"
            - "Lot.${lot_rm_id}.quarantine_reason == ROUTINE and Lot.${lot_mz_id}.quarantine_reason == DOSE_DEVIATION"

      - name: aeration_target_end_standard_anchor_vs_extended_retest_anchor
        grounds:
          - calculations.aeration_required_hours
          - calculations.residual_verdict
          - entities.AerationRecord.fields.variant_applied
          - entities.AerationRecord.fields.target_end_at
          - state_machines.AerationRecord.IN_PROGRESS_to_RETEST_REQUIRED
        distinguishing_aspect: |
          This dual variant lives in the AerationRecord residual domain, not the
          Cycle dosimetry domain: on identical base_hours (12) and density_factor
          (1.25) the STANDARD variant yields required_hours 15 anchored on
          aeration_start_at 2026-08-12T08:00:00Z (target 2026-08-12T23:00:00Z),
          while EXTENDED_RETEST after one failure yields required_hours 23
          anchored on last_failed_sample_at 2026-08-12T23:30:00Z (target
          2026-08-13T22:30:00Z) - the multiplier AND the anchor both move.
        test_recipe:
          setup:
            - "An ETO cycle on product P1 (requires_aeration true, eto_residual_limit_ppm 4.0, ech_residual_limit_ppm 9.0) has completed and closed CONFORMING; the lot is in QUARANTINE with residual_status PENDING_AERATION."
            - "The cycle's load_density_g_per_cm3 is exactly 0.1000, which selects density_factor 1.25 on the lower-inclusive breakpoint."
            - "An AerationRecord was opened at logical clock 2026-08-12T08:00:00Z with base_hours 12, required_hours 15 and target_end_at 2026-08-12T23:00:00Z under variant STANDARD."
            - "The logical clock has been moved to 2026-08-12T23:30:00Z so the first residual sample is legal."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: true }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-E1", modality: "ETO", pallet_capacity: 8, turnaround_minutes: 60, abatement_efficiency_pct: 96.0 }
              as: RegulatoryAdmin
              captures: { che1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RE", modality: "ETO", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 12, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { re_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${re_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${re_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { qe_id: $.data.id }
            - call: "POST /sterilization/qualifications/${qe_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-001", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${che1_id}", recipe_id: "${re_id}", cycle_code: "C-001", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z", raw_eto_charge_kg: 100.0 }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc1_id: $.data.id, cyc1_v: $.data.version }
            - call: "POST /sterilization/cycles/${cyc1_id}/load-positions"
              payload: { lot_id: "${lot1_id}", position_index: 1, zone: "MIN_DOSE", pallet_count: 2, expected_cycle_version: "${cyc1_v}" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { pos1_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos1_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "MIN_DOSE", serial_code: "D-MIN" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { d_min_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos1_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "ROUTINE", serial_code: "D-RT" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { d_rt_id: $.data.id }
            - call: "POST /sterilization/cycles/${cyc1_id}/ready"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/cycles/${cyc1_id}/start"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/cycles/${cyc1_id}/complete"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
            - call: "POST /sterilization/indicators/${d_min_id}/reading"
              payload: { measured_dose_kgy: 28.50 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/indicators/${d_rt_id}/reading"
              payload: { measured_dose_kgy: 30.00 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/cycles/${cyc1_id}/dosimetry-close"
              payload: {}
              as: DosimetryAnalyst
              as_user_id: "ana-1"
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots/${lot1_id}/aeration-records"
              payload: {}
              as: CycleOperator
              as_user_id: "op-1"
              captures: { aer_id: $.data.id, aer_target_std: $.data.target_end_at, aer_hours_std: $.data.required_hours }
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T23:30:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "POST /sterilization/aeration-records/${aer_id}/residual-test"
              payload: { eto_residual_ppm: 6.0, ech_residual_ppm: 2.0 }
              as: DosimetryAnalyst
              as_user_id: "ana-1"
          assert:
            - "${aer_hours_std} == 15 and ${aer_target_std} == 2026-08-12T23:00:00Z (the STANDARD variant snapshot taken at record creation)"
            - "AerationRecord.${aer_id}.variant_applied == EXTENDED_RETEST"
            - "AerationRecord.${aer_id}.required_hours == 23"
            - "AerationRecord.${aer_id}.target_end_at == 2026-08-13T22:30:00Z"
            - "AerationRecord.${aer_id}.retest_count == 1"
            - "AerationRecord.${aer_id}.last_failed_sample_at == 2026-08-12T23:30:00Z"
            - "AerationRecord.${aer_id}.status == RETEST_REQUIRED"
            - "AerationRecord.${aer_id}.density_factor == 1.25"
            - "Lot.${lot1_id}.residual_status == AERATING and Lot.${lot1_id}.status == QUARANTINE"

  # ===========================================================================
  # Rule 2 - Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: load_density_sum_then_round_not_per_position_round_then_average
        grounds:
          - calculations.cycle_load_density
          - entities.Cycle.fields.load_density_g_per_cm3
          - validations[priority=86]
          - state_machines.Cycle.LOADING_to_READY
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order changes the answer. A load of
          one pallet of P1 (120 kg / 1.2 m3) plus one pallet of P2 (90 kg / 0.8 m3)
          gives 0.1050 under the pinned aggregate-then-round-once order and 0.1063
          under the rejected round-each-position-then-average order; the recipe
          band [0.1000, 0.1060) accepts the first and rejects the second, so the
          READY sign-off succeeds only for the pinned order.
        test_recipe:
          setup:
            - "One GAMMA chamber, one approved recipe RG with band [0.1000, 0.1060)."
            - "Two products under one customer: P1 at 120.0 kg / 1.2 m3 and P2 at 90.0 kg / 0.8 m3, each with a QUALIFIED ProductQualification against RG."
            - "One PLANNED cycle with two load positions, one pallet of a P1 lot and one pallet of a P2 lot, and the recipe's one MIN_DOSE and one ROUTINE dosimeter already placed."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P2", pallet_mass_kg: 90.0, pallet_volume_m3: 0.8, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
