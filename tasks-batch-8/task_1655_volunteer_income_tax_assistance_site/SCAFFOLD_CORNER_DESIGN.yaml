      - name: response_envelope_shape
        claim_type: retrieval
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id + meta.api_request_timestamp with response_type object/array; error responses carry response_type error and data.error_id — verified on one GET and one 404."
        test_recipe:
          setup: ["one site exists"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
          trigger:
            - { call: "GET /sites/${site_id}", as: SponsorAdmin, captures: { nm: $.data.name } }
            - { call: "GET /tax-returns/00000000-0000-4000-8000-000000000000", as: SponsorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Success envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == object, data.name == Library VITA"
            - "Error envelope: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

