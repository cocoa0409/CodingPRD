            - "After booking one InterpreterSession for ${eval1} (2026-09-10T09:00:00Z-10:00:00Z, as IntakeCoordinator) the identical testing-start call returns HTTP 200 with assessment_status == IN_TESTING and protocol_stock_count == 3"

