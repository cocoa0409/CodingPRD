      - name: pair_b_mandatory_unwind_beats_over_cap_allowance_rejected
        grounds:
          - validations[priority=42]
          - validations[priority=47]
          - errors.ERR_UNWIND_MANDATORY
          - errors.ERR_ALLOWANCE_EXCEEDS_CAP
          - entities.ArbitrationCase.fields.seller_conceded
        distinguishing_aspect: |
          Conflict pair B, and unlike pair A the two members differ in HTTP status as well
          as id (409 vs 422), so a wrong ordering is visible twice over. The higher-priority
          member is a compliance rule that needs only a boolean already on the case
          (seller_conceded), while the loser needs the sale price and the policy bps —
          the natural implementation order is exactly backwards.
        test_recipe:
          setup:
            - "the FRAME_DAMAGE registry with max_allowance_bps 3000 and one AuctionSale at sale_price_cents 1450000, so the allowance cap is round_half_up(1450000 * 3000 / 10000) = 435000"
            - "one FRAME_DAMAGE case with a verified INSPECTION_REPORT (repair_estimate_cents 285000) and a verified THIRD_PARTY_VERIFICATION, reviewed by arb-intake-01"
            - "the seller answered ACCEPT_UNWIND, so seller_conceded is true and the case sits in ARBITRATOR_REVIEW with a CLOSED round"
            - "the decision then asks for REPAIR_ALLOWANCE with requested_allowance_cents 500000, which is 65000 above the cap — both priority 42 and priority 47 are violated"
