              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_b_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_c_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
