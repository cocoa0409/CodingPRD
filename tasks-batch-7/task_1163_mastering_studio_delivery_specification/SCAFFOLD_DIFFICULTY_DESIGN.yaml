              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /studio/engineers"
              payload: { display_name: "E", tier: "STAFF", hourly_rate_cents: 80000, capacity_minutes_per_day: 60 }
              as: StudioManager
              captures: { eng_id: $.data.id }
            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/session-slots"
              payload: { engineer_id: "${eng_id}", slot_start_at: "2026-05-11T10:00:00Z", slot_end_at: "2026-05-11T11:00:00Z" }
              as: StudioManager
              captures: { s1_id: $.data.id }
            - call: "POST /studio/session-slots/${s1_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/platform-profiles"
              payload: { platform_code: "SPOTIFY", integrated_lufs: -14.0, true_peak_dbtp: -1.0, loudness_range_lu: 12.0, required_sample_rate_hz: 44100, required_bit_depth: 24, container_format: "WAV" }
              as: StudioManager
              captures: { prof_id: $.data.id }
            - call: "POST /studio/rush-tier-rules"
              payload: { tier: "STANDARD", multiplier_bp: 10000, sla_hours: 72, surcharge_breach_cents: 0, included_revision_rounds: 1, per_round_cents: 10000 }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", upc: "012345678901", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T11:00:00Z", scheduled_duration_minutes: 60, rush_tier: "STANDARD" }
              as: Client
