              payload: { code: "M174", category: "MATERIAL", base_price_cents: 20000, material_index: 1.74 }
              as: PlatformAdmin
              captures: { m174_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "AR", category: "COATING", base_price_cents: 4000 }
              as: PlatformAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Cap Ped", email: "cap@x.com", dob: "1990-02-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -12.00, od_cylinder: -2.00, os_sphere: -11.00, os_cylinder: -1.00, pd_mm: 62.0, prism_diopters: 0.25, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m174_id}", coating_option_ids: ["${ar_id}"], delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.lens_upcharge_cents == 30000"
            - "Order.${ord_id}.subtotal_cents == 39500"
            - "Order.${ord_id}.discount_cents == 3950"
            - "Order.${ord_id}.customer_due_cents == 35550"

      - name: discount_tier_fires_at_exactly_twenty_five_thousand
        claim_type: tiered_pricing
        grounds: [calculations.order_price_quote, entities.Order.fields.discount_cents]
        distinguishing_aspect: "DISCOUNT_TIER_1_CENTS uses >= : a subtotal of exactly 25000 (frame 19000 + M160 6000) attracts the 10% tier, giving discount_cents 2500 — an implementation using > would produce 0."
        test_recipe:
          setup: ["Self-pay customer, VERIFIED low-power Rx, frame priced 19000, M160 priced 6000, no coatings."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C10", name: "Percey", brand: "WP", price_cents: 19000, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Tia Er", email: "tia@x.com", dob: "1990-03-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -2.00, od_cylinder: 0.00, os_sphere: -2.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
          trigger:
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.subtotal_cents == 25000"
            - "Order.${ord_id}.discount_cents == 2500"
            - "Order.${ord_id}.customer_due_cents == 22500"

      - name: kit_late_fee_clamps_at_its_cap
        claim_type: threshold
        grounds: [calculations.kit_late_fee, entities.HomeTryOnKit.fields.late_fee_cents]
        distinguishing_aspect: "LATE_FEE_CAP_CENTS 5000 clamps the fee: a kit returned 20 days after its due_date would accrue 20*500 == 10000, so late_fee_cents must read 5000."
        test_recipe:
          setup: ["Clock at 2026-05-01 default; a kit with due_date 2026-05-10, shipped, then the clock pushed to 2026-05-30 (20 days late) which also flips it OVERDUE."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C11", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Lay Tee", email: "late@x.com", dob: "1990-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-02T00:00:00Z", due_date: "2026-05-10T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_id: $.data.id }
            - call: "POST /optical/home-try-on-kits/${kit_id}/ship"
              payload: {}
              as: StoreAssociate
