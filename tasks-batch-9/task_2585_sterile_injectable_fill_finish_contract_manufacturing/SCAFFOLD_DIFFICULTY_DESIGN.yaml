      - name: lead_operator_closed_interval_touching_endpoints_conflict_across_suites
        grounds:
          - validations[priority=77]
          - validations[priority=76]
          - calculations.changeover_minutes_applied
          - calculations.suite_committed_minutes
          - entities.PersonnelQualification.fields.operator_name
          - entities.BatchOrder.fields.lead_operator_qualification_id
        distinguishing_aspect: |
          The OPPOSITE adjacency treatment from the suite rule, on a resource that is resolved
          indirectly and is not suite-scoped. Operator occupancy uses CLOSED intervals with NO
          buffer and spans every suite, and the resource key is
          PersonnelQualification[lead_operator_qualification_id].operator_name — so OP-A holding
          one qualification row in FS-1 and a second, distinct qualification row in FS-2 is still
          ONE operator. A B-002 in FS-2 starting at EXACTLY 2026-09-10T16:00:00Z, the instant
          B-001 in FS-1 ends, is rejected with ERR_OPERATOR_DOUBLE_BOOKED because both
