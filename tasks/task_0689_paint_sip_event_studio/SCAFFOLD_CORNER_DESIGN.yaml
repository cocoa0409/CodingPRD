        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-event]", endpoints]
        distinguishing_aspect: "Reservation create with expected_event_version equal to the event's current version succeeds (201) and bumps StudioEvent.version by 1."
        test_recipe:
          setup: ["OPEN event with a known current version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "OCC1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "O1", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "OCC1 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "occ1@x.com", full_name: "OCC1", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 1, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id, new_v: $.data.version }
          assert:
            - "Reservation create returns 201; StudioEvent.${eid}.version == (previous version + 1)."

      - name: occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-event]", "errors[ERR_STALE_EVENT_VERSION]"]
        distinguishing_aspect: "A reservation create carrying a stale expected_event_version (one less than current, after a prior booking advanced the event) is rejected 412 ERR_STALE_EVENT_VERSION."
        test_recipe:
          setup: ["OPEN event; a first reservation has already advanced the event's version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "OCC2", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "O2", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "OCC2 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "occ2@x.com", full_name: "OCC2", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 1, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 1, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "The second create still carrying the original ${ev_v} (now stale after r1 bumped the version) returns 412 data.error_id == ERR_STALE_EVENT_VERSION."

      - name: walkin_cancel_releases_seats_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [calculations.event_seat_ledger, state_machines.StudioEvent.FULL_to_OPEN, entities.WalkIn.fields.status]
        distinguishing_aspect: "Registering a walk-in then cancelling it reconciles walk_in_seats back to 0 and seats_available back to capacity (derived seat fields stay consistent with WalkIn status)."
        test_recipe:
          setup: ["OPEN event capacity 4; a walk-in of 4 makes it FULL."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "WK1", room_capacity_seats: 4 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "W1", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "WK1 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 4, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/walk-ins"
              payload: { event_id: "${eid}", party_name: "Walkers", party_size: 4 }
              as: FrontDesk
              captures: { wid: $.data.id }
          trigger:
            - call: "GET /studio-ops/events/${eid}"
              payload: {}
              as: FrontDesk
              captures: { st_full: $.data.status }
            - call: "POST /studio-ops/walk-ins/${wid}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "After the walk-in: StudioEvent.${eid}.walk_in_seats == 4, seats_available == 0, status == FULL."
            - "After cancelling the walk-in: walk_in_seats == 0, seats_available == 4, status == OPEN."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_pricing_on_create
        claim_type: immediate
        grounds: [calculations.reservation_pricing, entities.Reservation.fields.total_cents]
        distinguishing_aspect: "Computed total_cents is present and correct in the same reservation-create response (immediate consistency), not on a later read."
        test_recipe:
          setup: ["OPEN event price 4500, kit_fee 1000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "IM1", room_capacity_seats: 10 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "I1", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "IM1 Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 10, price_cents_per_seat: 4500, kit_fee_cents: 1000 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "im1@x.com", full_name: "IM1", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 2, include_supply_kit: true, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { total: $.data.total_cents }
          assert:
            - "The create response itself has Reservation total_cents == 11000 (base 9000, no discount at 2 seats, + kit 2000)."

  # ===========================================================================
  # excluded_because stubs — corners already covered by a §1.8 instance
  # ===========================================================================
  - section: calculations
    instances:
      - name: pricing_large_tier_15pct_stub
        claim_type: Constants Applied
        grounds: [calculations.reservation_pricing]
        excluded_because:
          difficulty_instance: combinatorial_formula / cf_tiered_group_discount_then_kit_add
          rationale: "The seats>=8 15% tier with kit add is asserted as the trigger of the named §1.8 instance (total 40200)."

      - name: credit_ladder_zero_tier_stub
        claim_type: Correct Result
        grounds: [calculations.cancellation_credit_ladder]
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_cancellation_credit_ladder_vs_studio_override
          rationale: "The <24h 0% credit tier is asserted by the named §1.8 dual-variant instance (credit_granted_cents == 0)."

      - name: fundraiser_settled_close_stub
        claim_type: Input Set Filtering
        grounds: [calculations.fundraiser_donation]
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_fundraiser_pledged_vs_settled
          rationale: "settled_donation over CHECKED_IN only is asserted by the named §1.8 instance (16980)."

  - section: state_machines
    instances:
      - name: event_open_to_full_cycle_stub
        claim_type: Valid Transition
        grounds: [state_machines.StudioEvent.OPEN_to_FULL]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_event_open_full_open_cycle
          rationale: "OPEN->FULL->OPEN cycle is the subject of the named §1.8 instance."

      - name: reservation_noshow_on_close_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.HELD_to_NO_SHOW]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_event_close_noshow_seat_release
          rationale: "HELD->NO_SHOW on close and seat release is asserted by the named §1.8 cascade instance."

  - section: validations
    instances:
      - name: booking_mode_mismatch_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_BOOKING_MODE_MISMATCH]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_bookingmode_before_seats
          rationale: "ERR_BOOKING_MODE_MISMATCH is the winning error asserted by the named §1.8 priority-conflict instance."

      - name: insufficient_seats_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_INSUFFICIENT_SEATS]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / bpc_last_seat_zero_available
          rationale: "ERR_INSUFFICIENT_SEATS at seats_available==0 is asserted by the named §1.8 boundary instance."

      - name: studio_time_conflict_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_STUDIO_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_studio_halfopen_overlap
          rationale: "ERR_STUDIO_TIME_CONFLICT half-open overlap is the subject of the named §1.8 overlap instance."

      - name: artist_double_booked_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_ARTIST_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_artist_buffered_gap
          rationale: "ERR_ARTIST_DOUBLE_BOOKED buffered overlap is the subject of the named §1.8 overlap instance."

      - name: artist_inactive_stub
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_ARTIST_INACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cesd_assignment_requires_active_artist
          rationale: "ERR_ARTIST_INACTIVE is asserted by the named §1.8 cross-entity instance."
