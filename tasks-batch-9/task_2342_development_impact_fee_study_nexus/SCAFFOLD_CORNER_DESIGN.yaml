      - name: fee_study_create_without_methodology_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=12]
          - entities.FeeStudy.fields.methodology
          - endpoints[POST /fee-studies]
        distinguishing_aspect: |
          methodology has source: input and no default, so omitting it is a shape error
          (priority 12) and not a silent fallback to PLAN_BASED. The rest of the body is
          valid - including a correct expected_fee_program_version - which proves the
          shape check runs before the optimistic-concurrency check at priority 16.
        test_recipe:
          setup:
            - "FeeProgram HARBOR exists with version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${prog_id}", title: "2026 Impact Fee Study", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST and data null."
            - "message names the missing field methodology."
            - "No FeeStudy row was created: GET /fee-studies?fee_program_id=<prog> returns total_count 0."
            - "The FeeProgram version is still 1 - a rejected create must not bump the parent version."

      - name: fee_program_rejects_invalid_los_policy_enum
        claim_type: type_constraints
        grounds:
          - validations[priority=12]
          - entities.FeeProgram.fields.los_policy
          - entities.FeeProgram.fields.admin_charge_bp
        distinguishing_aspect: |
          Enum and numeric-range constraints are enforced on creation. Sends a los_policy
          value outside the declared two-member set together with an admin_charge_bp above
          its declared 0..2000 ceiling; either violation alone must produce
          ERR_INVALID_REQUEST, so an implementation that only validates one of them still
          fails the follow-up call that fixes the enum and keeps the out-of-range integer.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR", los_policy: "PLANNED_STANDARD_FORCED", admin_charge_bp: 4000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR", los_policy: "PLANNED_STANDARD_ALLOWED", admin_charge_bp: 4000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "harbor-1", admin_charge_bp: 300 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "All three calls return HTTP 422 with error_id ERR_INVALID_REQUEST."
            - "Call 1 fails on the unknown los_policy member; call 2 proves admin_charge_bp 4000 is rejected on its own (declared range 0..2000); call 3 proves jurisdiction_code must be uppercase A-Z0-9."
            - "No FeeProgram row exists afterwards - the enum error is not partially applied."

      - name: nexus_component_rejects_category_from_another_program
        claim_type: parent_relationships
        grounds:
          - validations[priority=14]
          - validations[priority=13]
          - entities.NexusComponent.fields.facility_category_id
          - errors.ERR_PROGRAM_SCOPE_MISMATCH
        distinguishing_aspect: |
          A NexusComponent has two parents that must agree: its FeeStudy and its
          FacilityCategory have to belong to the same FeeProgram. Both ids resolve here, so
          the reference check at priority 13 is satisfied and the distinct scope rule at
          priority 14 must fire with 422 ERR_PROGRAM_SCOPE_MISMATCH - not a 404.
        test_recipe:
          setup:
            - "Program HARBOR with FacilityCategory PARKS."
            - "A second program SEAGATE with its own DRAFT study B."
            - "No PARKS category exists in SEAGATE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /facility-categories"
              payload: { fee_program_id: "${prog_id}", code: "PARKS", name: "Neighborhood Parks", demand_unit_label: "resident", existing_los_per_demand_unit: 0.0030, planned_los_per_demand_unit: 0.0040, unit_cost_cents: 45000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cat_parks_id: $.data.id }
            - call: "POST /fee-programs"
              payload: { name: "City of Seagate Impact Fee Program", jurisdiction_code: "SEAGATE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { progb_id: $.data.id, progb_v: $.data.version }
            - call: "POST /fee-studies"
              payload: { fee_program_id: "${progb_id}", title: "Seagate 2026 Study", methodology: "PLAN_BASED", expected_fee_program_version: "${progb_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { studyb_id: $.data.id }
          trigger:
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${studyb_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500.0000 }
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 422 with error_id ERR_PROGRAM_SCOPE_MISMATCH."
            - "NOT 404 / ERR_INVALID_REFERENCE: both the fee_study_id and the facility_category_id exist, they simply live in different programs."
            - "GET /nexus-components?fee_study_id=<study B> returns total_count 0."

      - name: fee_study_create_with_unknown_program_id_returns_invalid_reference
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=13]
          - validations[priority=16]
          - errors.ERR_INVALID_REFERENCE
        distinguishing_aspect: |
          The topology is flat, so parents arrive as body foreign keys rather than URL
          segments and must be validated as references. An unresolvable fee_program_id in
          the BODY yields 404 ERR_INVALID_REFERENCE (priority 13) - distinct from the
          path-id rule at priority 3 - and it outranks the optimistic-concurrency check at
          priority 16 even though the supplied expected_fee_program_version belongs to a
          different program.
        test_recipe:
          setup:
            - "FeeProgram HARBOR exists at version 1; its version is captured."
            - "The id used in the body belongs to no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /fee-studies"
              payload: { fee_program_id: "00000000-0000-4000-8000-000000000011", title: "Phantom Study", methodology: "STANDARD_BASED", expected_fee_program_version: "${prog_v}" }
              as: NexusAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 404 with error_id ERR_INVALID_REFERENCE."
            - "NOT ERR_STALE_PROGRAM_VERSION (412) and NOT ERR_FEE_PROGRAM_NOT_FOUND - priority 13 owns unresolvable BODY references."
            - "The HARBOR program's version is still 1 and it has no studies."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_fee_study_starts_in_draft_with_empty_protest_tallies
        claim_type: initial_state
        grounds:
          - state_machines.FeeStudy.initial_state
          - entities.FeeStudy.fields.status
          - entities.FeeStudy.fields.revision_round
          - endpoints[POST /fee-studies]
        distinguishing_aspect: |
          A freshly created FeeStudy must occupy the declared initial_state DRAFT with all
