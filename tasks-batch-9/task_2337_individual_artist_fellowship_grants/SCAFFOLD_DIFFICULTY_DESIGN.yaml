            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: CouncilBoardMember, as_user_id: "board-1", captures: { cyc_v3: "$.data.version" } }
            - { call: "POST /grants/recommendation-slots/${slot1}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_v3}" }, as: CouncilBoardMember, as_user_id: "board-1", captures: { err_slot: "$.data.error_id" } }
