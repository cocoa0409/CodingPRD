            - call: "POST /tenants/${tid}/audit_campaigns"
              payload: { name: "A1", population_state_filter: ["CA"], sampling_method: "FIXED_FLOOR", floor_sample_size: 1 }
              as: Auditor
              as_user_id: "u_aud1"
              captures: { camp: $.data.id }
            - call: "POST /tenants/${tid}/audit_campaigns/${camp}/open"
              payload: {}
              as: Auditor
              as_user_id: "u_aud1"
            - call: "POST /tenants/${tid}/audit_campaigns/${camp}/sample"
              payload: {}
