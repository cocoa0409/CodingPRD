              as: Patient
              as_user_id: "${pat}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/start"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/encounters/${enc}/audio-captures"
              payload: { planned_retention_days: 30 }
              as: Physician
              as_user_id: "${phy}"
              captures: { cap: "$.data.id" }
            - call: "POST /ambient-clinical-documentation/audio-captures/${cap}/stop"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/_audio/simulate-transcription"
              payload: { audio_capture_id: "${cap}" }
              as: PlatformAdmin
            - call: "GET /ambient-clinical-documentation/encounters/${enc}"
              payload: {}
