  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: booking_quote_four_axis_blend_where_the_discount_cap_binds
        grounds:
          - calculations.booking_price_quote
          - entities.Booking.fields.per_guest_price_cents
          - entities.Booking.fields.quoted_total_cents
          - entities.Booking.fields.service_fee_cents
          - entities.Booking.fields.charge_total_cents
          - entities.Excursion.fields.price_tier
          - entities.Guest.fields.loyalty_tier
        distinguishing_aspect: |
          Mode (a): a four-input non-linear formula — price_tier multiplier, channel adjustment,
          nested min/max over the loyalty and group discounts, and a min() service-fee cap — where the
          uncapped discount 1400 bps is clamped to DISCOUNT_CAP_BPS 1200 and the uncapped fee 4448 is
          clamped to SERVICE_FEE_CAP_CENTS 1500, so both clamps bind in one quote.
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port; one APPROVED operator owns one PUBLISHED SIGNATURE excursion at base_price_cents 20000."
            - "Port call V2609 is OPEN_FOR_SALE; one SELLING departure meets 09:00Z with capacity 40 split 20 pre-cruise / 20 onboard."
            - "One PLATINUM guest on voyage V2609, mobility FULL, no medical flags."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
