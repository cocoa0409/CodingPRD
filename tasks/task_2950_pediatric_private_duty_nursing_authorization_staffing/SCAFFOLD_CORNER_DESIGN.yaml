            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01", ordering_physician_npi: "1234567893" }
              as: CaseManager
