scaffold_corner_design:
  - section: entities
    instances:
      - name: retailer_computed_defaults_on_create
        claim_type: computed_field
        grounds: [entities.Retailer.fields.ar_balance_cents, entities.Retailer.fields.exposure_forward_cents, entities.Retailer.fields.credit_status]
        distinguishing_aspect: "Freshly created retailer has all computed credit fields at their zero/GOOD_STANDING defaults and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id, ar: $.data.ar_balance_cents, fwd: $.data.exposure_forward_cents, cs: $.data.credit_status, ver: $.data.version } }
          trigger: []
          assert:
            - "captured ar == 0 and fwd == 0"
            - "captured cs == GOOD_STANDING"
            - "captured ver == 1"
      - name: product_system_fields_on_create
        claim_type: system_field
        grounds: [entities.Product.fields.status]
        distinguishing_aspect: "Product creation response carries system-minted id, created_at, version == 1, and default status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { pid: $.data.id, ver: $.data.version, st: $.data.status, ts: $.data.created_at } }
          trigger: []
          assert:
            - "captured pid is a non-empty UUID string without type prefix"
            - "captured ver == 1"
            - "captured st == ACTIVE (default applied; is_tobacco omitted defaults false)"
            - "captured ts is present (ISO8601 with 3 fractional digits)"
      - name: order_line_immutability_no_version
        claim_type: immutability
        grounds: [entities.OrderLine]
        distinguishing_aspect: "OrderLine has common_fields false: line rows expose id and created_at but no version field."
        test_recipe:
          setup: ["Retailer, guide, and a DRAFT order with one P1 line"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 1, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id } }
          trigger:
            - { call: "GET /purchase-orders/${po_id}/lines", payload: {}, as: WholesaleAdmin, captures: { line0: "$.data[0]" } }
          assert:
            - "captured line0.id is present"
            - "captured line0 has no version key (common_fields false)"

  - section: state_machines
    instances:
      - name: cancel_already_cancelled_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PurchaseOrder.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on a terminal CANCELLED order fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["DRAFT order exists"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 1, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id } }
            - { call: "POST /purchase-orders/${po_id}/cancel", payload: {}, as: StoreManager, as_user_id: "${ret_id}", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/cancel", payload: {}, as: StoreManager, as_user_id: "${ret_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured st1 == CANCELLED"
            - "captured err == ERR_INVALID_STATE (terminal state lockdown)"
      - name: void_draft_memo_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CreditMemo.POSTED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Void is only legal from POSTED; voiding a DRAFT memo fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Invoice of 60600 exists; DRAFT manual memo of 100 against it"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders/${po_id}/confirm-delivery", payload: {}, as: RouteDriver, captures: { inv_id: $.data.id } }
            - { call: "POST /invoices/${inv_id}/credit-memos", payload: { origin: "MANUAL", amount_cents: 100 }, as: CreditManager, captures: { memo_id: $.data.id } }
          trigger:
            - { call: "POST /credit-memos/${memo_id}/void", payload: {}, as: CreditManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE (DRAFT -> VOIDED not in transition table)"
      - name: authorize_from_revision_requested_rejected
        claim_type: invalid_transition
        grounds: [state_machines.NewItemRequest.UNDER_REVIEW_to_AUTHORIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "authorize is only legal from UNDER_REVIEW; from REVISION_REQUESTED it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["New-item request moved to REVISION_REQUESTED"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "PX", description: "candidate", case_pack_units: 12, case_cost_cents: 900, unit_cost_cents: 90, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 6 }, as: WholesaleAdmin, captures: { px: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [] }, as: SalesRep }
            - { call: "POST /new-item-requests", payload: { retailer_id: "${ret_id}", product_id: "${px}", proposed_shelf_price_cents: 999 }, as: SalesRep, captures: { nir: $.data.id } }
            - { call: "POST /new-item-requests/${nir}/start-review", payload: {}, as: WholesaleAdmin }
            - { call: "POST /new-item-requests/${nir}/request-revision", payload: { revision_notes: "reprice" }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /new-item-requests/${nir}/authorize", payload: {}, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: past_due_auto_transition_on_clock_advance
        claim_type: auto_transition
        grounds: [state_machines.Invoice.OPEN_to_PAST_DUE, entities.Invoice.fields.due_date]
        distinguishing_aspect: "NET7 invoice delivered 2026-05-25 has due_date 2026-06-01; advancing the logical clock to 2026-06-05 flips invoice to PAST_DUE and retailer to CREDIT_HOLD with no direct invoice call."
        test_recipe:
          setup: ["Unpaid NET7 invoice of 60600 with due_date 2026-06-01"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders/${po_id}/confirm-delivery", payload: {}, as: RouteDriver, captures: { inv_id: $.data.id, due: $.data.due_date } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "GET /invoices/${inv_id}", payload: {}, as: CreditManager, captures: { inv_st: $.data.status } }
            - { call: "GET /retailers/${ret_id}", payload: {}, as: CreditManager, captures: { cs: $.data.credit_status } }
          assert:
            - "captured due == 2026-06-01"
            - "captured inv_st == PAST_DUE (auto-transition on clock advance)"
            - "captured cs == CREDIT_HOLD (side effect of PAST_DUE)"
      - name: manifest_auto_completes_when_all_orders_invoiced
        claim_type: auto_transition
        grounds: [state_machines.DeliveryManifest.CLOSED_to_COMPLETED]
        distinguishing_aspect: "Compound/bubble-up: after the manifest's only order reaches INVOICED via confirm-delivery, the manifest auto-transitions CLOSED -> COMPLETED."
        test_recipe:
          setup: ["Manifest with a single assigned order, closed, ready for delivery"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}" }
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/assign-order", payload: { order_id: "${po_id}", expected_manifest_version: "${m_ver}" }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/confirm-delivery", payload: {}, as: RouteDriver }
            - { call: "GET /delivery-manifests/${m_id}", payload: {}, as: WholesaleAdmin, captures: { m_st: $.data.status } }
          assert:
            - "captured m_st == COMPLETED (auto-transition after last order left CLOSED)"

  - section: calculations
    instances:
      - name: pick_fee_constants_exact
        claim_type: constants_applied
        grounds: [calculations.pick_fee_calc, calculations.min_drop_fee_calc]
        distinguishing_aspect: "1 case + 1 split unit exercise both pick-fee constants: 12 + 45 = 57; tiny order also incurs the 2500 min-drop fee."
        test_recipe:
          setup: ["Guide with P1 and Q1; order of 1 case P1 + 1 split unit Q1"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "Q1", description: "q1", case_pack_units: 24, case_cost_cents: 2400, unit_cost_cents: 150, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 8 }, as: WholesaleAdmin, captures: { q1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 }, { product_id: "${q1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 1, split_units_qty: 0 }, { product_id: "${q1}", cases_qty: 0, split_units_qty: 1 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { pick: $.data.pick_fee_cents, minfee: $.data.min_drop_fee_cents, prov: $.data.provisional_total_cents } }
          assert:
            - "captured pick == 57 (1*12 + 1*45)"
            - "captured minfee == 2500 (1350 < 50000)"
            - "captured prov == 3907 (1350 + 57 + 2500)"
      - name: scan_back_promo_never_reduces_invoice
        claim_type: input_set_filtering
        grounds: [calculations.promo_allowance_calc, entities.PromoEvent.fields.promo_type]
        distinguishing_aspect: "Input-set filter: SCAN_BACK promos are excluded from invoice allowance even when their window covers the delivery date; allowance stays 0."
        test_recipe:
          setup: ["SCAN_BACK promo 1000 bps on P1 covering 2026-05-25; order of 50 cases P1"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /promo-events", payload: { product_id: "${p1}", promo_type: "SCAN_BACK", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { promo: $.data.promo_allowance_cents, prov: $.data.provisional_total_cents } }
          assert:
            - "captured promo == 0 (SCAN_BACK excluded from invoice allowance)"
            - "captured prov == 60600 (60000 merch + 600 pick + 0 min-drop)"
      - name: slotting_fee_cap_applied
        claim_type: calculation_boundary
        grounds: [calculations.slotting_fee_calc]
        distinguishing_aspect: "Raw fee 50000 + 500*250 = 175000 exceeds the 150000 cap; min(raw, cap) binds at exactly 150000."
        test_recipe:
          setup: ["Product PBIG with case_pack_units 500; new-item request filed"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "PBIG", description: "big", case_pack_units: 500, case_cost_cents: 9000, unit_cost_cents: 50, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 40 }, as: WholesaleAdmin, captures: { pbig: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [] }, as: SalesRep }
            - { call: "POST /new-item-requests", payload: { retailer_id: "${ret_id}", product_id: "${pbig}", proposed_shelf_price_cents: 199 }, as: SalesRep, captures: { nir: $.data.id } }
          trigger:
            - { call: "POST /new-item-requests/${nir}/start-review", payload: {}, as: WholesaleAdmin, captures: { fee: $.data.slotting_fee_cents } }
          assert:
            - "captured fee == 150000 (cap binds over raw 175000)"
      - name: cod_due_date_equals_delivery_date
        claim_type: correct_result
        grounds: [entities.Invoice.fields.due_date, entities.Retailer.fields.credit_terms]
        distinguishing_aspect: "Terms-driven due_date: COD invoice due on the delivery date itself (2026-05-25), unlike NET7 (+7) exercised elsewhere."
        test_recipe:
          setup: ["COD retailer; order of 50 cases P1 delivered on 2026-05-25"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "RC", jurisdiction_code: "CA_NORTH", credit_terms: "COD", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
