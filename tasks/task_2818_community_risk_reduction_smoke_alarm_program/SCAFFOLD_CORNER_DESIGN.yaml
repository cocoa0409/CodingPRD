      - name: validated_basis_on_an_unsurveyed_zone_returns_insufficient_field_data
        claim_type: error_triggerability
        grounds:
          - errors.ERR_INSUFFICIENT_FIELD_DATA
          - validations[priority 35 - data sufficiency]
          - calculations.zone_risk_score
        distinguishing_aspect: "The VALIDATED variant divides by zone.surveyed_units, so it is undefined before any crew has arrived anywhere in the zone: the request carries the correct expected_zone_version and a valid basis enum member, and still returns 422 - the zone must stay UNASSESSED with risk_score null rather than silently falling back to the PROVISIONAL variant."
        test_recipe:
          setup:
            - "A brand-new zone with surveyed_units 0 and no assessment yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
          trigger:
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "VALIDATED", expected_zone_version: "${z_v0}", analyst_note: "Attempting a field-validated score before any survey" }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INSUFFICIENT_FIELD_DATA"
            - "RiskZone.${z_id}.assessment_status == UNASSESSED"
            - "RiskZone.${z_id}.risk_score == null and RiskZone.${z_id}.risk_tier == null"
            - "RiskZone.${z_id}.assessment_basis == null"
            - "RiskZone.${z_id}.surveyed_units == 0"
            - "RiskZone.${z_id}.version == ${z_v0} (the refused write did not bump the OCC counter)"
            - "GET /crr/zones/${z_id}/assessments returns total_count 0"

      - name: all_four_remaining_uniqueness_families_are_rejected
        claim_type: error_triggerability
        grounds:
          - errors.ERR_CREW_CODE_TAKEN
          - errors.ERR_GRANT_CODE_TAKEN
          - errors.ERR_INCIDENT_NUMBER_TAKEN
          - errors.ERR_DUPLICATE_HOUSEHOLD_ADDRESS
          - validations[priority 27 - business_constraint]
        distinguishing_aspect: "Four uniqueness scopes in one instance, each with its own error_id: crew_code, grant_code and incident_number are global, while address_line is unique only WITHIN a zone - so the same address is accepted in a second zone in the control leg. The duplicate grant is created against the same partner while the first grant is still DRAFT, which keeps the period-overlap rule (activate-only) out of the way."
        test_recipe:
          setup:
            - "Zone Z-B54 (assessed) and Z-C77; household 12 Birch Row in Z-B54; crew CREW-B1; DRAFT grant G-UNIT-1 of partner P; incident INC-2026-0001 in Z-B54."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
