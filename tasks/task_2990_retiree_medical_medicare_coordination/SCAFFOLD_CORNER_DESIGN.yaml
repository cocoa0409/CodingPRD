  - section: consistency_model
    instances:
      - name: election_approval_side_effects_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /retiree-benefits/election-events/{election_event_id}/decision]
          - endpoints[POST /retiree-benefits/hra-accounts]
        distinguishing_aspect: |
          Consistency is immediate, so no denormalised counter is allowed to lag
          behind the write that moved it. The approval response already carries
          resulting_enrollment_id, and the very next read shows the Enrollment
          with its computed premium and payer order plus the option's
          enrolled_count already incremented - no second daily run, no refresh
          hop. The same holds for the HRA ledger: the funding figures are final
          in the creation response itself.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN, PRE65-CORE ACTIVE at 74500 cents with enrolled_count 0."
            - "R1 Rosa Alvarez (GRANDFATHERED_A, 12 service years, PRE_MEDICARE) CERTIFIED ELIGIBLE for 2027."
            - "One SUBMITTED ANNUAL_OPEN election on PRE65-CORE created by counselor-01, already moved to UNDER_REVIEW."
            - "Logical clock at 2026-10-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
