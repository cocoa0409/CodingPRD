            - "both lines resolve gross from the same 15000-cent rate row, so the gross difference of 15000 cents is caused solely by the inclusion filter"
            - "PayoutBatch.${batch_b1}.total_net_cents == 30000 while PayoutBatch.${batch_b2}.total_net_cents == 15000, so the net figures differ by exactly the 15000-cent denial that only the scheduled basis counted"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: resolved_rate_geography_differential_is_order_sensitive_after_flooring
        grounds:
          - calculations.resolved_session_rate_cents
          - calculations.resolved_session_rate_cents.variants.patient_state_fallback_rate
          - calculations.patient_cost_share_cents
          - endpoints.POST_/network/claims
          - validations[priority=6]
        distinguishing_aspect: "The rate formula applies a floored new-clinician step and then a branch that tests the floored value; because the branch reads the post-floor value rather than the raw rate, swapping the two steps yields 13500 instead of the pinned 13400 — a 100-cent difference produced by evaluation order alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z, so Clinician.onboarded_at is 2026-03-01T00:00:00Z."
            - "Payer PAX is ACTIVE with timely_filing_days 90 and allowed_cpt_codes [90837]."
            - "Two PayerRate rows: version 1 for (PAX, LCSW, CA, 90837) at 15000 cents effective 2026-01-01T00:00:00Z with no end, and version 2 for (PAX, LCSW, TX, 90837) at 16000 cents effective 2026-01-01T00:00:00Z with no end."
            - "Clinician Dana Reyes is LCSW with primary_state TX, so the CA rate row is reached only through the patient-state fallback. License issuing_state TX is VERIFIED, malpractice is ACTIVE, and one enrollment with PAX is EFFECTIVE from 2026-02-01T00:00:00Z, so posture is BILLABLE."
            - "Patient Priya Anand has payer PAX, state_code CA, deductible_cents 0, coinsurance_rate 0.20, oop_max_cents 500000."
            - "The VERIFIED snapshot reports deductible_remaining_cents 0, coinsurance_rate 0.20, copay_cents 2000, oop_remaining_cents 500000."
