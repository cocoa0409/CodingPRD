              captures: { la1_id: "$.data.id" }
            - call: "POST /loss-assessments/${la1_id}/resolve"
              payload: { resolution: "UPHELD", resolution_notes: "Tag last read at the yard; no fills on this asset." }
              as: AssetRecoveryAnalyst
