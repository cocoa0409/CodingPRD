              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "cas@x.com", full_name: "CAS", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc_id}", display_name: "P1", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { p1_id: $.data.profile_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc_id}", display_name: "P2", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { p2_id: $.data.profile_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f1", notes: "" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f2", notes: "" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f3", notes: "" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f4", notes: "" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f5", notes: "" }
              as: PlatformAdmin
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Subscription.${sub_id}.subscription_status == EXPIRED"
            - "Account.${acc_id}.account_status == SUSPENDED"
            - "Profile.${p1_id}.profile_status == DEACTIVATED"
            - "Profile.${p2_id}.profile_status == DEACTIVATED"

      - name: scheduled_deferred_action_price_change
        claim_type: scheduled_actions
        grounds:
          - "state_machines.PriceChangeNotice.ANNOUNCED_to_EFFECTIVE"
        distinguishing_aspect: "Price change notice takes effect at a future timestamp; cancellable before that."
        test_recipe:
          setup: ["Notice ANNOUNCED with effective_at in future"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
            - call: "POST /v1/price-change-notices"
              payload: { plan_id: "${plan_id}", old_price_cents: 3000, new_price_cents: 4000, effective_at_utc: "2026-09-15T00:00:00Z", grandfather_period_months: 0 }
              as: PlatformAdmin
              captures: { notice_id: $.data.price_change_notice_id }
          trigger:
            - call: "POST /v1/price-change-notices/${notice_id}/cancel"
              payload: {}
              as: PlatformAdmin
          assert:
            - "PriceChangeNotice.${notice_id}.notice_status == CANCELLED"
            - "Plan.${plan_id}.monthly_price_cents == 3000 (cancel prevented price change)"

  # ==========================================================================
  # §9 — Consistency model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_cancel
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "All changes from cancel are visible in the same response."
        test_recipe:
          setup: ["Subscription ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "ic@x.com", full_name: "IC", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
          assert:
            - "Cancel response data.subscription_status == CANCELLED (immediate)"
            - "Follow-up GET /v1/accounts/${acc_id} shows active_subscription_id == null (no lag)"
