              as: AgencyAdmin
              as_user_id: "aa-county"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc2_id}", amount_cents: 1000000, method: "ECHECK" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { qx2: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${qx2}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { tx2: $.data.id }
            - call: "POST /portal/payment-transactions/${tx2}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-county"
          trigger:
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-09" }
              as: TreasuryOfficer
              captures: { entry_id: $.data.id }
          assert:
            - "the close succeeds (201): cumulative volume 2000000 == volume_max_cents of band 2 is INCLUSIVE — no ERR_TIER_COVERAGE_GAP"
            - "SelfFundingLedgerEntry.${entry_id}.absorbed_billed_cents == 41035 (line 1: 22020 straddling 500000; line 2: 19015 entirely in band 2)"
            - "SelfFundingLedgerEntry.${entry_id}.cash_portal_recovery_cents == 40735 (41035 billed - 300 processing costs, all pool-available)"

      - name: statutory_cap_exact_allowed_over_rejected
        grounds:
          - calculations.convenience_fee
          - entities.StatutoryAuthorization.fields.fee_cap_cents
          - errors.ERR_FEE_EXCEEDS_STATUTORY_CAP
        distinguishing_aspect: |
          Metric: computed fee in cents; endpoint: POST /portal/fee-quotes. A
          CARD 100000 quote computes 2281: under cap 2281 it is accepted
          (cap is inclusive); under cap 2280 the identical request fails
          ERR_FEE_EXCEEDS_STATUTORY_CAP — the fee is never clamped to the cap.
        test_recipe:
          setup:
            - "CF agency base chain plus a second CF service (code DL-RENEW-B) whose APPROVED authorization caps the fee at 2280 instead of 2281."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "DL-RENEW-B", name: "Driver License Renewal Express", fee_model: "CONVENIENCE_FEE", allowed_methods: ["CARD", "ECHECK", "WALLET"], min_amount_cents: 100, max_amount_cents: 1000000, gl_code: "4111" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { svc_b: $.data.id }
            - call: "POST /portal/statutory-authorizations"
              payload: { service_id: "${svc_b}", statute_citation: "62 O.S. 34.9", disclosure_text_version: "D1", fee_cap_cents: 2280, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { authz_b: $.data.id }
            - call: "POST /portal/statutory-authorizations/${authz_b}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/services/${svc_b}/activate"
              payload: {}
              as: PlatformAdmin
            - *k_payer
          trigger:
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 100000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_ok: $.data.id }
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_b}", amount_cents: 100000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "first quote: 201, quoted_fee_cents == 2281 == fee_cap_cents 5000? no — cap of service A is 5000; the point is fee 2281 <= cap succeeds"
            - "second quote: 422 and err_id == ERR_FEE_EXCEEDS_STATUTORY_CAP because 2281 > cap 2280"
            - "the failed quote was NOT clamped to 2280: GET /portal/fee-quotes?service_id=${svc_b} returns 0 rows"

      - name: refund_exact_remaining_allowed_one_cent_over_rejected
        grounds:
          - entities.PaymentTransaction.fields.remaining_refundable_cents
          - errors.ERR_REFUND_EXCEEDS_REMAINING
          - state_machines.Refund.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Metric: refund amount vs remaining_refundable_cents; endpoint:
          POST /portal/refunds. A refund equal to the exact remaining balance
          (60000) is approved; a further 1-cent refund crosses the boundary and
          is rejected — >= vs > on the money axis.
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 transaction captured; an OPEN batch exists; refund of 40000 already requested by aa-lead and approved by aa-peer."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - *k_txn_card
            - *k_cap_card
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-02" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_card}", amount_cents: 40000, reason: "partial overpayment" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref1: $.data.id }
            - call: "POST /portal/refunds/${ref1}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
          trigger:
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_card}", amount_cents: 60000, reason: "remainder" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref2: $.data.id }
            - call: "POST /portal/refunds/${ref2}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_card}", amount_cents: 1, reason: "one cent too far" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the 60000-cent refund (== remaining exactly) is REQUESTED then APPROVED"
            - "PaymentTransaction.${txn_card}.refunded_cents == 100000 and remaining_refundable_cents == 0"
            - "the 1-cent refund returns 422 and err_id == ERR_REFUND_EXCEEDS_REMAINING"
            - "SettlementBatch.${batch_id}.refund_debits_cents == 100000 (both approvals debited the OPEN batch)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorize_blocked_when_agency_suspended
        grounds:
          - state_machines.Agency.ACTIVE_to_SUSPENDED
          - validations[priority=5]
          - errors.ERR_AGENCY_NOT_ACTIVE
        distinguishing_aspect: |
          Pair PaymentTransaction x Agency: authorizing against a quote whose
          agency is SUSPENDED fails ERR_AGENCY_NOT_ACTIVE even though the quote
          itself was also cascade-voided — the agency gate ranks first inside
          priority 5, proving the transaction's validity depends on a different
          entity's live state.
        test_recipe:
          setup:
            - "CF agency base chain; one OPEN CARD quote; the agency is then suspended (cascade voids the quote)."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - call: "POST /portal/agencies/${ag_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_id}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_AGENCY_NOT_ACTIVE"
            - "err_id != ERR_INVALID_STATE although the quote is now VOIDED — the agency-state gate preempts the quote-state check inside priority 5"
            - "GET /portal/payment-transactions?quote_id=${quote_id} returns 0 rows"

      - name: service_activate_blocked_when_attestation_expired
        grounds:
          - state_machines.ServiceCatalogItem.DRAFT_to_ACTIVE
          - entities.ComplianceAttestation.fields.status
          - errors.ERR_COMPLIANCE_LAPSED
        distinguishing_aspect: |
          Pair ServiceCatalogItem x ComplianceAttestation: a service cannot
          activate when its agency's PCI_DSS_AOC attestation has slipped to
          EXPIRED — the service machine's valid next-state set depends on a
          computed field of a sibling entity under the same agency.
        test_recipe:
          setup:
            - "Agency activated with an attestation expiring 2026-09-10T00:00:00Z; logical clock then advanced to 2026-09-11; a DRAFT CF service with an APPROVED authorization waits to activate."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - call: "POST /portal/attestations"
              payload: { agency_id: "${ag_id}", attestation_type: "PCI_DSS_AOC", issued_at: "2026-08-01T00:00:00Z", expires_at: "2026-09-10T00:00:00Z" }
              as: ComplianceAuditor
            - *k_agency_on
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - *k_service
            - *k_authz
            - *k_authz_ok
          trigger:
            - call: "POST /portal/services/${svc_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_COMPLIANCE_LAPSED"
            - "ServiceCatalogItem.${svc_id}.status is still DRAFT"
            - "err_id != ERR_NO_STATUTORY_COVERAGE (authorization coverage is fine — only the attestation lapsed)"

      - name: refund_decide_blocked_without_open_batch
        grounds:
          - state_machines.Refund.REQUESTED_to_APPROVED
          - errors.ERR_NO_OPEN_BATCH
          - entities.SettlementBatch.fields.status
        distinguishing_aspect: |
          Pair Refund x SettlementBatch: a refund can only be APPROVED while an
          OPEN settlement batch exists for the agency to absorb the debit; with
          none, decide fails ERR_NO_OPEN_BATCH and the refund stays REQUESTED
          until a batch is opened — recovery through the same endpoint succeeds.
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 transaction captured; NO settlement batch exists yet; a refund of 40000 is REQUESTED."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - *k_txn_card
            - *k_cap_card
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_card}", amount_cents: 40000, reason: "overpayment" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref1: $.data.id }
          trigger:
            - call: "POST /portal/refunds/${ref1}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-02" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/refunds/${ref1}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
          assert:
            - "first decide: 409 and err_id == ERR_NO_OPEN_BATCH (no OPEN batch for the agency)"
            - "Refund.${ref1}.status is still REQUESTED after the failure"
            - "after opening batch ${batch_id}, the retried decide succeeds: status APPROVED, decided_by_user_id == \"aa-peer\""
            - "SettlementBatch.${batch_id}.refund_debits_cents == 40000 and PaymentTransaction.${txn_card}.refunded_cents == 40000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_account_half_open_adjacency_vs_overlap
        grounds:
          - entities.AgencySettlementAccount.fields.effective_from
          - entities.AgencySettlementAccount.fields.effective_to
          - errors.ERR_ACCOUNT_WINDOW_OVERLAP
          - concurrency_rules[settlement-account-create-stale-agency]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on
          AgencySettlementAccount. A bare create at 2026-06-01 colliding with
          the live [2026-01-01, null) window is rejected; the same instant
          accepted via supersedes_account_id produces the adjacent windows
          [2026-01-01, 2026-06-01) and [2026-06-01, null) — touching endpoints
          are legal precisely because the left edge is inclusive and the right
          exclusive.
        test_recipe:
          setup:
            - "Agency with one VERIFIED account effective_from 2026-01-01 (open-ended); agency version re-read after the create (now 2)."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - call: "GET /portal/agencies/${ag_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ag_v2: $.data.version }
          trigger:
            - call: "POST /portal/settlement-accounts"
              payload: { agency_id: "${ag_id}", routing_number: "103000648", account_number_last4: "8888", effective_from: "2026-06-01T00:00:00Z", expected_agency_version: "${ag_v2}" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/settlement-accounts"
              payload: { agency_id: "${ag_id}", routing_number: "103000648", account_number_last4: "8888", effective_from: "2026-06-01T00:00:00Z", supersedes_account_id: "${acct_id}", expected_agency_version: "${ag_v2}" }
              as: PlatformAdmin
              captures: { acct2_id: $.data.id }
          assert:
            - "bare create: 409 and err_id == ERR_ACCOUNT_WINDOW_OVERLAP (the live half-open window swallows 2026-06-01)"
            - "supersede create with the same effective_from: 201 — adjacency at a half-open boundary is legal"
            - "AgencySettlementAccount.${acct_id}.status == RETIRED and effective_to == 2026-06-01T00:00:00Z"
            - "AgencySettlementAccount.${acct2_id}.status == PENDING_VERIFICATION with effective_from 2026-06-01 and effective_to null"
            - "GET /portal/agencies/${ag_id} shows version == 3 (the failed create did not bump it, the successful one did)"

      - name: authorization_closed_interval_touching_is_overlap
        grounds:
          - state_machines.StatutoryAuthorization.DRAFT_to_APPROVED
          - entities.StatutoryAuthorization.fields.effective_to
          - errors.ERR_AUTHORIZATION_WINDOW_OVERLAP
        distinguishing_aspect: |
          Interval semantics: CLOSED [effective_from, effective_to] on
          StatutoryAuthorization — the exact opposite of the settlement-account
          rule. A second APPROVED window whose effective_from equals the first
          window's effective_to IS an overlap; only a strictly later start date
          (next day) approves cleanly.
        test_recipe:
          setup:
            - "CF agency base chain; the service already holds APPROVED authorization ${authz_id} covering [2026-01-01, 2027-12-31]."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
          trigger:
            - call: "POST /portal/statutory-authorizations"
              payload: { service_id: "${svc_id}", statute_citation: "62 O.S. 34.9 (amended)", disclosure_text_version: "D2", fee_cap_cents: 6000, effective_from: "2027-12-31T00:00:00Z", effective_to: "2028-06-30T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { authz2: $.data.id }
            - call: "POST /portal/statutory-authorizations/${authz2}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/statutory-authorizations"
              payload: { service_id: "${svc_id}", statute_citation: "62 O.S. 34.9 (amended)", disclosure_text_version: "D2", fee_cap_cents: 6000, effective_from: "2028-01-01T00:00:00Z", effective_to: "2028-06-30T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { authz3: $.data.id }
            - call: "POST /portal/statutory-authorizations/${authz3}/approve"
              payload: {}
              as: PlatformAdmin
          assert:
            - "approving the window starting 2027-12-31 (== existing effective_to) returns 409 ERR_AUTHORIZATION_WINDOW_OVERLAP — closed intervals share that endpoint"
            - "StatutoryAuthorization.${authz2}.status remains DRAFT"
            - "the 2028-01-01 window approves cleanly: StatutoryAuthorization.${authz3}.status == APPROVED"

      - name: tier_band_shared_boundary_cent_is_overlap
        grounds:
          - entities.ContractPricingTier.fields.volume_min_cents
          - entities.ContractPricingTier.fields.volume_max_cents
          - errors.ERR_TIER_BAND_OVERLAP
        distinguishing_aspect: |
          Interval semantics: CLOSED bands on the cumulative-VOLUME axis (not
          time) for ContractPricingTier. [0,500000] then [500000,900000] share
          the single cent 500000 and collide; [500001,900000] is accepted.
          Different axis and different resource than the two window rules.
        test_recipe:
          setup:
            - "Absorbed agency activated; one band [0,500000] for 2026-09 exists."
          setup_api_calls:
            - *k_clock
            - *b_agency
            - *b_account
            - *b_verify
            - *b_attest
            - *b_agency_on
            - *b_tier1
          trigger:
            - call: "POST /portal/pricing-tiers"
              payload: { agency_id: "${ag2_id}", volume_min_cents: 500000, volume_max_cents: 900000, rate_bp: 200, per_txn_cents: 18, effective_month: "2026-09" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /portal/pricing-tiers"
              payload: { agency_id: "${ag2_id}", volume_min_cents: 500001, volume_max_cents: 900000, rate_bp: 200, per_txn_cents: 18, effective_month: "2026-09" }
              as: PlatformAdmin
              captures: { tier2_id: $.data.id }
          assert:
            - "the [500000,900000] create returns 409 and err_id == ERR_TIER_BAND_OVERLAP (one shared cent is enough)"
            - "the [500001,900000] create returns 201"
            - "GET /portal/agencies/${ag2_id}/pricing-tiers?effective_month=2026-09 returns exactly 2 rows"
            - "a band for a DIFFERENT month would not collide: the overlap scope is (agency_id, effective_month)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transaction_money_conservation_refund_plus_chargeback
        grounds:
          - entities.PaymentTransaction.fields.remaining_refundable_cents
          - state_machines.ChargebackCase.OPENED_to_ACCEPTED
          - state_machines.Refund.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity: per-transaction principal. For every transaction,
          refunded_cents + charged_back_cents + remaining_refundable_cents ==
          amount_cents at all times. A 40000 refund followed by a chargeback
          acceptance nets the chargeback to 60000 (amount minus already
          refunded), keeping the invariant exact with zero drift.
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 transaction captured; OPEN batch exists; refund 40000 approved."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - *k_txn_card
            - *k_cap_card
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-02" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_card}", amount_cents: 40000, reason: "partial" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { ref1: $.data.id }
            - call: "POST /portal/refunds/${ref1}/decide"
              payload: { decision: "APPROVE" }
              as: AgencyAdmin
              as_user_id: "aa-peer"
          trigger:
            - call: "POST /portal/chargebacks"
              payload: { transaction_id: "${txn_card}", reason_code: "FRAUD" }
              as: PlatformAdmin
              captures: { case_id: $.data.id }
            - call: "POST /portal/chargebacks/${case_id}/accept"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          assert:
            - "ChargebackCase.${case_id}.network_debit_cents == 60000 (100000 amount minus 40000 already refunded — the compensation nets)"
            - "PaymentTransaction.${txn_card}: refunded_cents == 40000, charged_back_cents == 60000, remaining_refundable_cents == 0"
            - "40000 + 60000 + 0 == 100000 == PaymentTransaction.${txn_card}.amount_cents (invariant holds)"
            - "SettlementBatch.${batch_id}: refund_debits_cents == 40000 and chargeback_debits_cents == 60000 — the batch absorbs exactly the same 100000 total"

      - name: net_remittance_return_represent_zero_drift
        grounds:
          - state_machines.PaymentTransaction.SETTLED_to_RETURNED
          - state_machines.PaymentTransaction.RE_PRESENTED_to_SETTLED
          - calculations.settlement_batch_totals
        distinguishing_aspect: |
          Conserved quantity: net agency remittance across batches. Settle
          50000 (batch A +50000), ACH-return it (batch B -50000), re-present
          and re-settle (batch C +50000): the three deposit_cents sum to
          exactly 50000 — the return/re-present compensation pair leaves zero
          drift in lifetime deposits.
        test_recipe:
          setup:
            - "CF agency base chain; ECHECK 50000 transaction captured 2026-09-10 and settled by batch 2026-09-12; clock at 2026-09-15 for the return."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_echeck
            - *k_echeck_ok
            - *k_clock_sep10
            - *k_quote_ech50k
            - *k_txn_ech
            - *k_cap_ech
            - *k_batch_0912
            - *k_close_batch1
            - *k_clock_sep15
            - call: "POST /portal/payment-transactions/${txn_ech}/ach-return"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/payment-transactions/${txn_ech}/re-present"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          trigger:
            - call: "GET /portal/agencies/${ag_id}/settlement-batches"
              payload: {}
              as: PlatformAdmin
              captures: { batch_auto: "$.data[1].id" }
            - call: "POST /portal/settlement-batches/${batch_auto}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-17" }
              as: PlatformAdmin
              captures: { batch3: $.data.id }
            - call: "POST /portal/settlement-batches/${batch3}/close"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SettlementBatch.${batch1_id}.deposit_cents == 50000 (original settle)"
            - "SettlementBatch.${batch_auto}.deposit_cents == -50000 (empty close carrying only the return debit: member_count 0, return_debits_cents 50000)"
            - "SettlementBatch.${batch3}.deposit_cents == 50000 (re-presented settle; value_date 2026-09-17 <= business_date)"
            - "50000 - 50000 + 50000 == 50000 == PaymentTransaction.${txn_ech}.amount_cents — the compensating pair nets to exactly one settlement"
            - "PaymentTransaction.${txn_ech}.funds_status == SETTLED and current_batch_id == ${batch3}"

      - name: pool_sweep_zero_remainder_conservation
        grounds:
          - calculations.portal_pool_sweep
          - entities.SelfFundingLedgerEntry.fields.pool_balance_after_cents
          - errors.ERR_PERIOD_ALREADY_CLOSED
        distinguishing_aspect: |
          Conserved quantity: the self-funding pool. Every cent entering the
          sweep lands in exactly one bucket: fees_collected + absorbed_billed -
          processing_costs - cash_recovery - surplus == change in pool balance,
          with zero remainder. The same period cannot be closed twice.
        test_recipe:
          setup:
            - "The full two-agency September fixture: CF agency (CARD 100000 DEBIT, ECHECK 50000, WALLET 20000) plus absorbed agency (3 x 300000 ECHECK) all captured 2026-09-10."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_echeck
            - *k_echeck_ok
            - *k_wallet
            - *k_clock_sep10
            - *k_quote_card100k
            - *k_txn_card
            - *k_cap_card
            - *k_quote_ech50k
            - *k_txn_ech
            - *k_cap_ech
            - *k_quote_wal20k
            - *k_txn_wal
            - *k_cap_wal
            - *b_agency
            - *b_account
            - *b_verify
            - *b_attest
            - *b_agency_on
            - *b_tier1
            - *b_tier2
            - *b_tier3
            - *b_service
            - *b_service_on
            - *b_quote1
            - *b_txn1
            - *b_cap1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - *b_quote2
            - *b_txn2
            - *b_cap2
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - *b_quote3
            - *b_txn3
            - *b_cap3
          trigger:
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-09" }
              as: TreasuryOfficer
              captures: { entry_id: $.data.id }
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-09" }
              as: TreasuryOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "SelfFundingLedgerEntry.${entry_id}: fees_collected_cents == 2824, absorbed_billed_cents == 20155, processing_costs_cents == 2542"
            - "cash_portal_recovery_cents == 20437 and surplus_remitted_cents == 0 and pool_balance_after_cents == 0"
            - "2824 + 20155 - 2542 - 20437 - 0 == 0 — the waterfall conserves every cent with no remainder"
            - "the second close of 2026-09 returns 409 and err_id == ERR_PERIOD_ALREADY_CLOSED"
