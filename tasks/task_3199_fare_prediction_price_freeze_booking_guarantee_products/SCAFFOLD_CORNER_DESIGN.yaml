            - "the 1-cent over-refund is rejected with ERR_PAYMENT_OVER_ALLOCATED at priority 28"
            - "Payment.${pay_id}.refundable_remaining_cents is still 625 and the allocation array gained nothing"
            - "a further refund of exactly 625 would succeed and leave status == REFUNDED"

      - name: corner_protection_activation_is_refused_on_a_restricted_route
        claim_type: Precondition Enforcement
        grounds:
