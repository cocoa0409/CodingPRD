          Pair = priority 16 (business_referential, 409) against priority 41
          (business_fiscal, 409) on POST /accruals/{accrual_id}/validate. Both
          share HTTP 409, so only the error_id distinguishes them and a wrong
          ordering cannot hide behind a status code. The validated accrual is a
