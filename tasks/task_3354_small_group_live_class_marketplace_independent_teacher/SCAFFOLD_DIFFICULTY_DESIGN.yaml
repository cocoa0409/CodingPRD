              captures: { app_ada_s1: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/submit-sample"
              payload: { teaching_sample_url: "https://samples.example.com/ada.mp4", teaching_sample_minutes: 10 }
              as: TeacherApplicant
              as_user_id: "u_ada"
              captures: { app_ada_s2: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/review"
              payload: { stage: "SAMPLE", verdict: "PASS" }
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { app_ada_s3: $.data.status }
            - call: "POST /outschool/teacher-applications/${app_ada}/approve"
              payload: {}
              as: TeacherReviewer
              as_user_id: "rev_1"
              captures: { t_ada: $.data.id }
            - call: "POST /outschool/teachers/${t_ada}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { t_ada_status: $.data.status }
            - call: "POST /outschool/class-listings"
              payload: { teacher_id: "${t_ada}", title: "Algebra Club", format: "ONE_TIME", min_age: 8, max_age: 12, max_learners: 6, list_price_cents: 2000 }
              as: Teacher
              as_user_id: "${t_ada}"
              captures: { l_1: $.data.id }
            - call: "POST /outschool/class-listings/${l_1}/policy-review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { l_1_review: $.data.content_review_state }
            - call: "POST /outschool/class-listings/${l_1}/publish"
              payload: {}
              as: Teacher
              as_user_id: "${t_ada}"
            - call: "POST /outschool/class-reports"
              payload: { teacher_id: "${t_ada}", class_listing_id: "${l_1}", reported_by_user_id: "p_1", severity: "LOW", category: "TECHNICAL" }
              as: Parent
              as_user_id: "p_1"
              captures: { r_1: $.data.id, r_1_weight: $.data.severity_weight }
            - call: "POST /outschool/class-reports/${r_1}/disposition"
              payload: { action: "START_REVIEW" }
