            - "data.generated_work_order_count == 0 and data.open_work_order_count == 0 and data.verified_work_order_count == 0 and data.void_work_order_count == 0"
            - "data.urgent_work_order_count == 0"
            - "data.closure_verified_rate == 100.00"
            - "data.version == 1"

      - name: start_an_abandoned_sweep_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SelfAssessmentSweep.PLANNED_to_ABANDONED
          - state_machines.SelfAssessmentSweep.terminal_states
          - errors[ERR_SWEEP_INVALID_STATE]
        distinguishing_aspect: |
          Closing a sweep that never started lands on ABANDONED, which is terminal: the same close
          endpoint therefore has two destinations, and no transition leaves ABANDONED, so a
          subsequent start must fail rather than resurrect the sweep into IN_PROGRESS.
        test_recipe:
          setup:
            - "Property Cedar Walk with one unit and a PLANNED sweep that is closed without ever being started, landing on ABANDONED."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/close"
              payload: { closed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_status: $.data.status, sw_closed: $.data.closed_at }
          trigger:
