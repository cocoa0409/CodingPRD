          - errors[ERR_FILINGS_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair BillOfLading x ComplianceFiling: a SEAWAY B/L in ISSUED
          with SoD satisfied and no fiscal block still cannot release while the
          booking's AMS filing is merely SUBMITTED (not ACCEPTED). The
          dependency is on a sibling aggregate's state, not on B/L fields.
        test_recipe:
          setup:
            - "COLLECT FCL booking CONFIRMED; bond ACTIVE; B/L ISSUED by doc_1; ISF filing ACCEPTED; AMS filing SUBMITTED but not yet answered"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME XG1", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-FCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "FCL", container_type: "40HC", rate_per_unit_cents: 185000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
