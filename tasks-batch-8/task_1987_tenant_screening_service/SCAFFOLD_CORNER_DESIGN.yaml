            - call: "POST /api/criteria"
              payload: { name: "C1", disclosure_summary: "H1 criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z" }
