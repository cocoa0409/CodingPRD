            - "data.block_id == ${blk} and data.block_name == BLK-C13 and data.variety == STRAWBERRY"
            - "data.lot_count == 3 and data.pick_date_count == 2 and data.total_packed_lbs == 150.00 and data.shipped_lbs == 0.00"
            - "data.held_lot_count == 1 and data.rejected_lot_count == 1"
            - "data.earliest_pick_date == 2026-08-03 and data.latest_pick_date == 2026-08-04"
            - "data.water_status == PROVISIONAL and data.food_safety_posture == CLEARED"

      - name: payroll_settlement_variant_divergence_on_identical_tallies
        claim_type: variant_divergence
        grounds:
          - calculations.session_pay_per_session
          - calculations.payroll_period_averaged_settlement
        excluded_because:
          difficulty_instance: dual_variant_calc / payroll_period_average_diverges_from_per_session_guarantee
          rationale: "The variant-divergence claim (both variants computed from the same tallies and shown to disagree by reconciliation_delta_cents -4050) is exactly the named §1.8 instance."

      - name: lot_shelf_life_variant_selection_between_forecast_and_verified
        claim_type: variant_selection
        grounds:
          - calculations.lot_shelf_life
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_forecast_shelf_life_diverges_from_verified_shelf_life
          rationale: "The variant-selection claim (start-cooling picks the forecast variant with the planned end instant, complete-cooling picks the verified variant with the actual one) is the named §1.8 instance's whole assert set."

      - name: commitment_line_level_rounding_precision
        claim_type: precision
        grounds:
          - calculations.commitment_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / commitment_settlement_rounds_each_shipped_line_before_summing
          rationale: "The one-cent per-line rounding claim is the named §1.8 instance, which pins settled_revenue_cents at 76098 and calls out 76099 as the aggregate-rounding error."

      - name: tunnel_capacity_aggregate_interval_admission
        claim_type: interval_merge
        grounds:
          - calculations.tunnel_occupancy
          - validations[priority=61]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tunnel_slot_capacity_aggregate_over_half_open_intervals_admits_adjacency
          rationale: "The aggregate-over-overlapping-intervals claim, including the half-open adjacency case, is the named §1.8 instance."

      - name: block_reentry_buffer_chronological_adjacency
        claim_type: chronological
        grounds:
          - calculations.block_window_separation
          - validations[priority=57]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / block_reentry_buffer_rejects_adjacent_harvest_window
          rationale: "The buffer-makes-adjacency-a-conflict claim is the named §1.8 instance, which rejects a window starting exactly at another's end_at."

      - name: session_dispute_wage_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.crew_wage_ledger
          - calculations.picker_productivity
        excluded_because:
          difficulty_instance: compensating_invariant / session_dispute_reverses_only_the_disputed_session_wage_accrual
          rationale: "The reconciliation claim (the ledger equals the sum over APPROVED sessions again after the reversal, with the sibling session untouched) is the named §1.8 instance."

      - name: empty_payroll_run_aggregation_boundary
        claim_type: aggregation
        grounds:
          - calculations.payroll_period_averaged_settlement
        excluded_because:
          difficulty_instance: boundary_precision_check / payroll_settle_with_empty_bound_session_set_succeeds_with_zero_totals
          rationale: "The empty-input-set aggregation boundary (settle succeeds with every figure 0 rather than erroring) is the named §1.8 instance."

      - name: crew_requirement_ceiling_combination
        claim_type: correct_result
        grounds:
          - calculations.window_crew_requirement
        excluded_because:
          difficulty_instance: combinatorial_formula / window_crew_requirement_ceiling_over_maturity_adjusted_capacity
          rationale: "The multi-step combination (maturity multiplier, window hours, then CEILING of the quotient) is asserted end to end by the named §1.8 instance."

      - name: housing_deduction_waterfall_ordering
        claim_type: waterfall_allocation
        grounds:
          - calculations.session_pay_per_session
        excluded_because:
          difficulty_instance: combinatorial_formula / session_housing_deduction_capped_after_minimum_wage_makeup
          rationale: "The load-bearing step order (guarantee make-up first, then the 10%-of-gross deduction cap with FLOOR) is the named §1.8 instance."

  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: role_check_precedes_path_existence_and_returns_forbidden_role
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          A Picker reading a block id that does not exist gets 403
          ERR_FORBIDDEN_ROLE, not 404 ERR_BLOCK_NOT_FOUND and not the Picker
          identity error: priority 3 excludes Picker from
          GET /berry-ops/blocks/{block_id} before priority 4 resolves the caller
          and before priority 5 resolves the path id, so an unauthorised caller
          learns nothing about which ids exist.
        test_recipe:
          setup:
            - "Empty database; the clock is pinned at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "GET /berry-ops/blocks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Picker
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and response_type == error"
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "the response is NOT ERR_BLOCK_NOT_FOUND and NOT ERR_UNAUTHENTICATED"

      - name: body_range_check_precedes_body_foreign_key_existence_rejected
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=16]
          - errors[ERR_VALUE_OUT_OF_RANGE]
        distinguishing_aspect: |
          A water test that is doubly wrong — generic_ecoli_mpn 0 (below the
          declared minimum of 1) against a block_id that does not exist — reports
          the cheap body-range failure ERR_VALUE_OUT_OF_RANGE (priority 12), not
          the referential ERR_BLOCK_NOT_FOUND (priority 16), and stores nothing.
        test_recipe:
          setup:
            - "Empty database; the clock is pinned at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /berry-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "00000000-0000-0000-0000-000000000000", sample_date: "2026-07-20", generic_ecoli_mpn: 0 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and response_type == error"
            - "${err} == ERR_VALUE_OUT_OF_RANGE"
            - "the response is NOT ERR_BLOCK_NOT_FOUND"
            - "GET /berry-ops/water-tests returns total_count == 0"

      - name: window_confirm_below_variety_brix_minimum_returns_brix_below_minimum
        claim_type: violation_to_error
        grounds:
          - validations[priority=66]
          - errors[ERR_BRIX_BELOW_MINIMUM]
          - state_machines.HarvestWindow.PLANNED_to_CONFIRMED
        distinguishing_aspect: |
          BRIX_MIN for STRAWBERRY is 7.0, so a window forecast at 6.9 brix is
          refused at confirm with 422 ERR_BRIX_BELOW_MINIMUM and keeps status
          PLANNED with both staffing projections still null — the maturity gate
          is what stops immature fruit being scheduled.
        test_recipe:
          setup:
            - "One STRAWBERRY block, one crew, one PLANNED window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z with forecast_brix 6.9."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V3", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V3" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V3", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 6.9, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and response_type == error"
            - "${err} == ERR_BRIX_BELOW_MINIMUM"
            - "HarvestWindow.${win}.status == PLANNED and HarvestWindow.${win}.version == 1"
            - "HarvestWindow.${win}.effective_pick_rate_lbs_per_hour == null and HarvestWindow.${win}.required_picker_count == null"

      - name: window_confirm_at_exactly_the_brix_minimum_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=66]
          - calculations.window_crew_requirement
        distinguishing_aspect: |
          The maturity gate is inclusive: forecast_brix exactly 7.0 on a
          STRAWBERRY block confirms with 200 and mints
          effective_pick_rate_lbs_per_hour 22.00 (the multiplier stays 1.00
          because 7.0 is far below the 9.0 target) and required_picker_count 1 —
          the same input one tenth lower is a hard 422.
        test_recipe:
          setup:
            - "One STRAWBERRY block, one crew, one PLANNED window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z with forecast_brix 7.0 and planned_volume_lbs 150.00."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V4", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V4" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V4", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 7.0, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          assert:
            - "HTTP status is 200 and response_type == object"
            - "HarvestWindow.${win}.status == CONFIRMED and HarvestWindow.${win}.version == 2"
            - "HarvestWindow.${win}.effective_pick_rate_lbs_per_hour == 22.00 and HarvestWindow.${win}.required_picker_count == 1"

      - name: pick_session_create_with_expired_hygiene_training_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - errors[ERR_HYGIENE_TRAINING_INVALID]
        distinguishing_aspect: |
          The two hygiene rules read different reference dates: training expiring
          2026-08-04 is still valid at certification (priority 42 compares
          against the logical clock date 2026-08-01) but invalid for a session
          whose work_date is 2026-08-04, because priority 43 requires the expiry
          to be STRICTLY after the work_date — so the crew certifies and opens
          normally and only the session create is refused with 422.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block; one DOMESTIC crew whose single picker was trained 2025-08-04, so hygiene_training_expires_on is 2026-08-04."
            - "The crew is certified at clock 2026-08-01 and its window 2026-08-04T06:00:00Z -> 2026-08-04T14:00:00Z is OPEN."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V5", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V5" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-V5", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker V5", hygiene_training_on: "2025-08-04" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-V5", beds_confirmed: 1, transport_route_code: "R-V5", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-04T06:00:00Z", end_at: "2026-08-04T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /berry-ops/pick-sessions"
              payload: { harvest_window_id: "${win}", picker_id: "${pk}", work_date: "2026-08-04" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and response_type == error"
            - "${err} == ERR_HYGIENE_TRAINING_INVALID"
            - "Picker.${pk}.hygiene_training_expires_on == 2026-08-04"
            - "Crew.${crew}.status == ACTIVE and HarvestWindow.${win}.status == OPEN"
            - "GET /berry-ops/pick-sessions with harvest_window_id ${win} returns total_count == 0"

      - name: fruit_lot_create_against_a_quarantined_block_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=38]
          - errors[ERR_BLOCK_QUARANTINED]
          - calculations.block_food_safety_posture
        distinguishing_aspect: |
          The pack record is refused by the state of a DIFFERENT entity: once the
