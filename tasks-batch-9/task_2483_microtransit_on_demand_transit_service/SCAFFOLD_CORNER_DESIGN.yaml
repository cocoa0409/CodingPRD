              payload: {}
              as: ZoneAdmin
              captures: { z_v1: $.data.version }
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T06:00:00Z", window_end_utc: "2026-08-03T10:00:00Z", forecast_trips: 40, peak_factor: 1.20, expected_service_zone_version: "${z_v1}" }
              as: ZoneAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "GET /service-zones/${z_id}"
              payload: {}
              as: ZoneAdmin
              captures: { z_v2: $.data.version }
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T09:00:00Z", window_end_utc: "2026-08-03T13:00:00Z", forecast_trips: 40, peak_factor: 1.20, expected_service_zone_version: "${z_v2}" }
              as: ZoneAdmin
              captures: { f2_id: $.data.id }
            - call: "GET /service-zones/${z_id}"
              payload: {}
              as: ZoneAdmin
              captures: { z_v3: $.data.version }
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T17:00:00Z", forecast_trips: 40, peak_factor: 1.20, expected_service_zone_version: "${z_v3}" }
              as: ZoneAdmin
              captures: { f3_id: $.data.id }
          assert:
            - "DemandForecast.${f1_id}.state == SUPERSEDED after F2 is published (windows [06:00,10:00) and [09:00,13:00) overlap)"
            - "DemandForecast.${f2_id}.state == PUBLISHED"
            - "DemandForecast.${f3_id}.state == PUBLISHED and DemandForecast.${f2_id}.state == PUBLISHED (half-open windows touching at 13:00 do not overlap)"
            - "DemandForecast.${f1_id}.required_base_blocks == 3 and required_surge_blocks == 0 (unchanged by supersession)"
            - "GET /demand-forecasts?zone_id=${z_id}&state=PUBLISHED returns total_count == 2"
            - "§1.5 declares no client endpoint that supersedes a forecast directly"

      - name: cyclic_shape_report_loop_is_covered_by_the_difficulty_probe
        claim_type: cyclic
        grounds: [state_machines.SubsidyReport.state, complexity_profile.state_machine_shape]
        excluded_because:
          difficulty_instance: subsidy_report_certify_amend_resubmit_recertify_cycle
          rationale: "The cyclic-shape claims (entity loops back; loop counter respected) are exercised in depth there: SubsidyReport walks DRAFT->SUBMITTED->CERTIFIED->AMENDED->SUBMITTED->CERTIFIED and the instance asserts amendment_count increments on each lap while the certifier identity constraint is re-evaluated per lap. A shallower duplicate would add no coverage."

      - name: trip_matching_self_loop_is_covered_by_the_difficulty_probe
        claim_type: cyclic
        grounds: [state_machines.TripRequest.status, endpoints.POST_trip-requests_id_match]
        excluded_because:
          difficulty_instance: trip_matching_self_loop_then_offer_with_parallel_fare_axis
          rationale: "MATCHING->MATCHING is the scaffold's only self-loop and its termination condition (MAX_MATCH_ATTEMPTS 2 then NO_SERVICE) plus the independent UNPRICED/QUOTED fare axis are asserted there end to end."

      - name: guarded_transition_on_certification_is_covered_by_the_difficulty_probe
        claim_type: guarded_transitions
        grounds: [state_machines.SubsidyReport.state, validations.priority_58]
        excluded_because:
          difficulty_instance: certification_gated_on_block_finalization_with_totals_frozen_at_submit
          rationale: "The guarded-transition claim (A->B only if entity C is in state X) is the certify guard requiring every in-period VehicleBlock to be CLOSED or CANCELLED; that instance tests both the blocked and the unblocked side after closing the last block."

      - name: cascade_down_from_block_cancel_is_covered_by_the_difficulty_probe
        claim_type: cascade_down
        grounds: [state_machines.VehicleBlock.state, endpoints.POST_vehicle-blocks_id_cancel]
        excluded_because:
          difficulty_instance: block_cancel_cascade_four_hops_to_no_service
          rationale: "The cascade-down claim (parent change reaches children; only non-terminal children affected) is asserted there across four hops — block CANCELLED, assignment RELEASED, trip axis QUOTED->UNPRICED, status ASSIGNED->MATCHING then NO_SERVICE — including that an already COMPLETED sibling assignment is left untouched."

      - name: cross_entity_side_effect_on_decline_streak_is_covered_by_the_difficulty_probe
        claim_type: cross_entity
        grounds: [state_machines.PoolAssignment.state, state_machines.Driver.status]
        excluded_because:
          difficulty_instance: decline_streak_suspends_driver_and_cancels_their_scheduled_block
          rationale: "The cross-entity claim (A changes, B adjusts, verify B's state and fields) is asserted there: the third decline suspends the Driver and cancels that driver's future SCHEDULED block, with both rows' states and counters checked."

      - name: conditional_cascade_on_settlement_is_covered_by_the_difficulty_probe
        claim_type: conditional_cascade
        grounds: [state_machines.PoolAssignment.state, state_machines.TripRequest.fare_status]
        excluded_because:
          difficulty_instance: settlement_cascade_caps_a_second_quoted_trip_of_the_same_rider
          rationale: "The conditional-cascade claim (side effect applied only when the sibling is in a specific state) is asserted there: settling one trip re-caps only the same rider's still-QUOTED trips and leaves UNPRICED and CHARGED siblings alone."

      - name: compensation_on_decline_is_covered_by_the_difficulty_probe
        claim_type: compensation
        grounds: [state_machines.PoolAssignment.state, endpoints.POST_pool-assignments_id_decline]
        excluded_because:
          difficulty_instance: seat_and_securement_capacity_returns_to_zero_after_decline
          rationale: "The compensation claim (undo transition reverses every original side effect with no drift) is asserted there against seats_committed, wav_positions_committed and committed_index_min/max returning to their pre-offer values."

      - name: ledger_sync_after_refund_is_covered_by_the_difficulty_probe
        claim_type: ledger_sync
        grounds: [state_machines.TripRequest.fare_status, endpoints.POST_trip-requests_id_refund, entities.FareTransaction]
        excluded_because:
          difficulty_instance: fare_ledger_nets_to_zero_after_capped_charge_is_refunded
          rationale: "The ledger-sync claim (state change updates the derived ledger and reconciles before/after) is asserted there across CHARGE, CAP_REBATE and REFUND rows summing to zero with the rider's daily and weekly counters returning to 0."

      - name: vehicle_maintenance_precondition_on_block_open_is_covered_by_the_difficulty_probe
        claim_type: precondition_enforcement
        grounds: [state_machines.VehicleBlock.state, state_machines.Vehicle.status, validations.priority_12]
        excluded_because:
          difficulty_instance: block_open_gated_on_vehicle_status_then_released_by_maintenance_return
