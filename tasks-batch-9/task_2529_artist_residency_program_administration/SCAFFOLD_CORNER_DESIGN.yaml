              as_user_id: "admin-01"
              captures: { disc_none: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "ETCH", name: "Etching", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: true,
                         cohort_min_slots: 1, cohort_max_slots: 5, required_capability_tags: ["KILN"],
                         required_ventilation_class: "FUME_HOOD" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc_hood: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc_none}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r_none: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc_hood}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { r_hood: "$.data.id" }
            - call: "POST /residencies/${r_none}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v_none: "$.data.version" }
            - call: "POST /residencies/${r_hood}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v_hood: "$.data.version" }
            - call: "POST /studios"
              payload: { code: "S-N", capability_tags: ["KILN"], ventilation_class: "NONE", max_concurrent_residents: 2, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_n: "$.data.id" }
          trigger:
            - call: "POST /studio-assignments"
              payload: { residency_id: "${r_hood}", start_date: "2026-11-02", end_date: "2026-12-27", expected_residency_version: "${v_hood}", studio_id: "${s_n}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the ETCH residency is refused on the NONE studio: 422 ERR_VENTILATION_INSUFFICIENT, because VENTILATION_RANK['NONE'] 0 < VENTILATION_RANK['FUME_HOOD'] 2"
            - "the SAME studio accepts the CLAYWORK residency: the identical call for ${r_none} with studio_id ${s_n} returns 201, since 0 >= 0 - the Discipline default NONE is a real floor and not an 'unset' sentinel"
            - "the comparison is by rank and not by equality: after PATCH /studios/${s_n} sets ventilation_class 'FUME_HOOD', the CLAYWORK residency is still accepted (2 >= 0) and the ETCH residency is now accepted too (2 >= 2)"
            - "one rank short still fails: with ventilation_class 'LOCAL' the ETCH residency returns 422 ERR_VENTILATION_INSUFFICIENT (1 < 2) while CLAYWORK succeeds (1 >= 0)"
            - "capability is a separate, earlier check: a studio with capability_tags ['WELDING'] and ventilation_class 'FUME_HOOD' returns 422 ERR_STUDIO_CAPABILITY_MISMATCH for the ETCH residency (P36 precedes P37), so the two facility errors are not interchangeable"
            - "the rejected call wrote nothing: GET /studios/${s_n} reads reserved_resident_days 0 and active_assignment_count 0 immediately after the 422, and Residency.version is still ${v_hood}"

      - name: portfolio_media_coverage_and_item_count_map_to_distinct_errors
        claim_type: violation_to_error
        grounds: ["validations[priority 51]", "validations[priority 52]", "errors[ERR_PORTFOLIO_MEDIA_MISSING]", "errors[ERR_PORTFOLIO_ITEM_COUNT]"]
        distinguishing_aspect: "Two neighbouring rules guard the same submit call from opposite directions - a count band (P51) and a media-type coverage set (P52) - and each must surface its OWN error. A portfolio can satisfy the count while missing a required media type, which is the only configuration that isolates P52; P51 additionally fires on the CREATE path when an item would exceed portfolio_max_items."
        test_recipe:
          setup: ["An OPEN cycle whose SCULPT discipline requires 2..3 portfolio items covering media types IMAGE and VIDEO. One applicant with a fee-WAIVED DRAFT application carrying two IMAGE items - count satisfied, coverage not."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 2,
                         portfolio_max_items: 3, required_media_types: ["IMAGE", "VIDEO"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art}"
              captures: { app: "$.data.id" }
            - call: "POST /applications/${app}/fee-resolution"
              payload: { action: "WAIVE", reason: "income below ceiling" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate I", file_size_mb: 12.5 }
              as: Applicant
              as_user_id: "${art}"
              captures: { pi1: "$.data.id" }
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate II", file_size_mb: 9.0 }
              as: Applicant
              as_user_id: "${art}"
              captures: { pi2: "$.data.id" }
          trigger:
            - call: "POST /applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${art}"
              captures: { err: "$.data.error_id" }
          assert:
            - "count satisfied but coverage missing yields the coverage error: 422 ERR_PORTFOLIO_MEDIA_MISSING, with portfolio_item_count == 2 (inside [2,3]) and portfolio_media_types == ['IMAGE']"
            - "the application stays DRAFT and its version does not move on the rejected submit"
            - "adding the missing type fixes exactly that: a VIDEO item takes portfolio_media_types to ['IMAGE','VIDEO'] and the same submit then returns 200 with status 'SUBMITTED'"
            - "the count rule surfaces its own code: deleting both IMAGE items (leaving 1) makes the submit return 422 ERR_PORTFOLIO_ITEM_COUNT, not the media error"
            - "P51 also guards the create path: with 3 items attached (the max), a fourth POST /portfolio-items returns 422 ERR_PORTFOLIO_ITEM_COUNT and Application.portfolio_item_count stays at 3"
            - "coverage is by SET membership, not by count: three IMAGE items still fail with ERR_PORTFOLIO_MEDIA_MISSING, and one IMAGE plus one VIDEO passes - so duplicates never substitute for a missing type"
            - "the earlier fee rule outranks both: on a fresh application with fee_status 'PENDING' and an empty portfolio, the submit returns 422 ERR_FEE_UNSETTLED (P53) rather than either portfolio error, since P51 and P52 sit above it only in number and the ladder is evaluated in ascending priority"

      - name: fee_waiver_requires_both_the_request_flag_and_the_income_ceiling
        claim_type: conditional
        grounds: ["validations[priority 54]", "errors[ERR_FEE_WAIVER_NOT_ELIGIBLE]", "constants.FEE_WAIVER_INCOME_CEILING_CENTS", "entities.Application.fee_waiver_requested"]
        distinguishing_aspect: "P54 is a CONJUNCTION of a per-application opt-in flag and a per-applicant income test, so it has three distinct failing configurations and one passing one. The ceiling is inclusive, so income exactly 3500000 must be granted while 3500001 is refused - one cent apart - and a waiver may not be granted to an applicant who never asked, no matter how low their income."
        test_recipe:
          setup: ["An OPEN cycle and three applicants: A at exactly the ceiling (3500000) requesting a waiver, B one cent above it (3500001) requesting a waiver, C well below it (1000000) NOT requesting a waiver. Each holds a DRAFT application with fee_status PENDING."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 3500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_a: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 3500001 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_b: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Tomas Bek", email: "tomas.bek@example.org",
                         affiliation_org: "Foundry Lane", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 1000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_c: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_a}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "At the ceiling",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_b}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "One cent over",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art_b}"
              captures: { app_b: "$.data.id" }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_c}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Never asked",
                         fee_waiver_requested: false }
              as: Applicant
              as_user_id: "${art_c}"
              captures: { app_c: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_b}/fee-resolution"
              payload: { action: "WAIVE", reason: "hardship" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "one cent above the ceiling is refused: 422 ERR_FEE_WAIVER_NOT_ELIGIBLE, with Application ${app_b} left at fee_status 'PENDING'"
            - "exactly at the ceiling is granted: the same call on ${app_a} returns 200 with fee_status 'WAIVED' and fee_waiver_reason recorded - 3500000 <= FEE_WAIVER_INCOME_CEILING_CENTS is inclusive"
            - "the opt-in flag is independently necessary: the same call on ${app_c} (income 1000000 but fee_waiver_requested false) also returns 422 ERR_FEE_WAIVER_NOT_ELIGIBLE"
            - "the flag can be turned on afterwards: PATCH /applications/${app_c} with fee_waiver_requested true, then the WAIVE call returns 200 with fee_status 'WAIVED'"
            - "the income test reads the APPLICANT live, not a copy taken at application time: PATCH /applicants/${art_b} lowering declared_annual_income_cents to 3400000 makes the previously refused WAIVE on ${app_b} succeed with no change to the application"
            - "the other two actions are unconditioned by P54: PAY on ${app_b} returns 200 with fee_status 'PAID' while the waiver is still ineligible, and DENY_WAIVER is likewise accepted"
            - "the settlement guard is a different rule: repeating any fee-resolution on an application whose fee_status is already 'PAID' or 'WAIVED' returns 409 ERR_FEE_ALREADY_SETTLED (P55), not the eligibility error"

      - name: offer_state_outranks_the_budget_check
        claim_type: priority_ordering
        grounds: ["validations[priority 22]", "validations[priority 71]"]
        excluded_because:
          difficulty_instance: offer_state_check_beats_stipend_pool_exhausted
          rationale: "Two-rules-violated-at-once ordering is the entire subject of the three §1.8 priority_pair_validation_conflict instances, which each construct a state where both rules are genuinely violated and assert that the lower-numbered priority wins (P22 over P71, P35 over P46, P26 over P57). Adding a fourth pair here would duplicate the pattern without probing new surface."

