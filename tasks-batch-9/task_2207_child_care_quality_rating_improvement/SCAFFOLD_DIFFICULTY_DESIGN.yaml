      - name: improvement_grant_orthogonal_compliance_axis
        grounds:
          - state_machines.ImprovementGrant.OFFERED_to_ACCEPTED
          - state_machines.ImprovementGrant.ACCEPTED_to_OPEN
          - state_machines.ImprovementGrant.parallel_dimension.COMPLIANT_to_UNDER_REVIEW
          - state_machines.ImprovementGrant.parallel_dimension.UNDER_REVIEW_to_FINDING_ISSUED
          - state_machines.ImprovementGrant.parallel_dimension.FINDING_ISSUED_to_REMEDIATED
          - state_machines.ImprovementGrant.parallel_dimension.REMEDIATED_to_UNDER_REVIEW
          - validations[priority=25]
          - concurrency_rules[expenditure-create-stale-grant]
          - entities.ImprovementGrant.fields.compliance_status
        distinguishing_aspect: |
          ImprovementGrant carries two state dimensions on the same row that evolve
          independently: across every trigger step below grant.status stays exactly OPEN
          while compliance_status walks COMPLIANT -> UNDER_REVIEW -> FINDING_ISSUED ->
          REMEDIATED -> UNDER_REVIEW, and the compliance axis alone (not the status axis)
