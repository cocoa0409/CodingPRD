  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: synthetic_moisture_ceiling_exact_vs_one_hundredth_over
        grounds:
          - calculations.lot_assay_disposition
          - entities.Plant.fields.synthetic_free_moisture_ceiling_pct
          - entities.GypsumLot.fields.quarantine_reason
          - endpoints[POST /plant-ops/gypsum-lots/{lotId}/assay]
        distinguishing_aspect: |
          Metric free_moisture_pct at POST /plant-ops/gypsum-lots/{lotId}/assay: the comparison is
          strictly greater, so 12.00 % (exactly the default synthetic ceiling) yields APPROVED with
          quarantine_reason null while 12.01 % — one hundredth over — yields QUARANTINED with
          quarantine_reason MOISTURE_CEILING.
        test_recipe:
          setup:
            - "Plant GYP-1 created without synthetic_free_moisture_ceiling_pct so the default 12.0 applies."
            - "Two SYNTHETIC lots of 100.000 t each received and unassayed."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 100.000, declared_free_moisture_pct: 11.90, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_edge_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Comanche FGD", received_tons: 100.000, declared_free_moisture_pct: 11.90, declared_purity_pct: 94.0 }
              as: MaterialsController
              captures: { lot_over_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/gypsum-lots/${lot_edge_id}/assay"
              payload: { free_moisture_pct: 12.00, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
            - call: "POST /plant-ops/gypsum-lots/${lot_over_id}/assay"
              payload: { free_moisture_pct: 12.01, purity_pct: 94.0, chloride_ppm: 120 }
              as: MaterialsController
          assert:
            - "Plant.${plant_id}.synthetic_free_moisture_ceiling_pct == 12.0"
            - "GypsumLot.${lot_edge_id}.status == APPROVED"
            - "GypsumLot.${lot_edge_id}.quarantine_reason == null"
            - "GypsumLot.${lot_edge_id}.free_moisture_pct == 12.00 and GypsumLot.${lot_edge_id}.assay_count == 1"
            - "GypsumLot.${lot_over_id}.status == QUARANTINED"
            - "GypsumLot.${lot_over_id}.quarantine_reason == MOISTURE_CEILING"
            - "GypsumLot.${lot_over_id}.free_moisture_pct == 12.01 and GypsumLot.${lot_over_id}.assay_count == 1"
            - "both lots have version == 2 and remaining_tons == 100.000"

