      - name: occ_stale_variant_version_on_order
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-order-variant-stock]", "errors[ERR_STALE_VARIANT_VERSION]"]
        distinguishing_aspect: "After a first order bumps ProductVariant.version to 2, a second order still carrying expected_variant_version 1 is rejected 412 ERR_STALE_VARIANT_VERSION."
        test_recipe:
          setup: ["A variant at version 1; one BUY order already placed against it (version now 2)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ov@x.com", full_name: "OV" }
              as: Guest
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { name: "OCC Item", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 10 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order1: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP status == 412"
            - "response.data.error_id == ERR_STALE_VARIANT_VERSION"

      - name: occ_stale_customer_version_on_pay
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[occ-pay-loyalty-redeem]", "errors[ERR_STALE_CUSTOMER_VERSION]"]
        distinguishing_aspect: "A loyalty-adjustment bumps Customer.version from 1 to 2 after the client captured 1; paying with expected_customer_version 1 is rejected 412 ERR_STALE_CUSTOMER_VERSION."
        test_recipe:
          setup: ["A customer (version 1) with a placed BUY order; a loyalty adjustment then bumps the customer to version 2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "oc@x.com", full_name: "OC" }
              as: Guest
              captures: { cust_id: "$.data.id", cust_v: "$.data.version" }
            - call: "POST /products"
              payload: { name: "OCC Pay Item", category: "NURSING", buy_price_cents: 5000 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_label: "M", trimester_fit: [1], inventory_on_hand: 5 }
              as: PlatformAdmin
              captures: { var_id: "$.data.id", var_v: "$.data.version" }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", variant_id: "${var_id}", order_type: "BUY", expected_variant_version: "${var_v}", quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 100 }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: { expected_customer_version: "${cust_v}", redeemed_points: 0 }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
