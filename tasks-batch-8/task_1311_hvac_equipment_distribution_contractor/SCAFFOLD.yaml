    input: []
    output: RefrigerantCylinder
    side_effects: ["lazy overdue check: ISSUED and clock > issued_at + 30 days -> RETURN_PENDING with compliance cascade"]
  - method: GET
    path: /api/v1/refrigerant-cylinders
    description: "List cylinders (reverse-reachability for holder_contractor_id FK)"
    roles: [DistributorAdmin, ContractorUser, ComplianceOfficer]
    code: 200
    input: ["holder_contractor_id?", "status?", "limit?", "offset?"]
    output: RefrigerantCylinder[]
    side_effects: []
  - method: POST
    path: /api/v1/refrigerant-cylinders/{id}/issue
    description: "Issue a cylinder to a contractor (compliance gate)"
    roles: [DistributorAdmin]
    code: 200
    input: [contractor_id]
    output: RefrigerantCylinder
    side_effects: ["IN_STOCK -> ISSUED; append ISSUE RefrigerantEvent; holder set; increments version by 1"]
  - method: POST
    path: /api/v1/refrigerant-cylinders/{id}/return
    description: "Return a cylinder with gross weight; heel shortfall detection and compliance cascade"
    roles: [DistributorAdmin]
    code: 200
    input: [returned_weight_lbs]
    output: RefrigerantCylinder
    side_effects: ["ISSUED/RETURN_PENDING -> RETURNED; append RETURN event; heel check per refrigerant_net_balance; holder cleared; increments version by 1"]
  - method: POST
    path: /api/v1/refrigerant-cylinders/{id}/reclaim
    description: "Reclaim residual gas; cylinder terminal"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: RefrigerantCylinder
    side_effects: ["RETURNED -> RECLAIMED; append RECLAIM event; increments version by 1"]
  - method: POST
    path: /api/v1/refrigerant-cylinders/{id}/refill
    description: "Refill a RETURNED cylinder to full weight (appends ADJUSTMENT event; completes the IN_STOCK cycle)"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: RefrigerantCylinder
    side_effects: ["append RefrigerantEvent(event_type=ADJUSTMENT, weight_delta_lbs = full_weight_lbs - current_weight_lbs); current_weight_lbs := full_weight_lbs; RETURNED -> IN_STOCK; increments version by 1"]
  - method: GET
    path: /api/v1/refrigerant-cylinders/{id}/events
    description: "Append-only event ledger for the cylinder (reverse-reachability for RefrigerantEvent.cylinder_id)"
    roles: [DistributorAdmin, ContractorUser, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RefrigerantEvent[]
    side_effects: []

  # --- rebates ---
  - method: POST
    path: /api/v1/rebate-submissions
    description: "Create a rebate/tax-credit dossier in DRAFT"
    roles: [ContractorUser]
    code: 201
    input: [contractor_id, order_id, ahri_rating_id, program_type, homeowner_name, install_address, install_date, "docs?"]
    output: RebateSubmission
    side_effects: []
  - method: GET
    path: /api/v1/rebate-submissions/{id}
    description: "Fetch one submission"
    roles: [DistributorAdmin, ContractorUser, ComplianceOfficer]
    code: 200
    input: []
    output: RebateSubmission
    side_effects: ["lazy expiry check: QUALIFIED and clock > decision_deadline -> EXPIRED"]
  - method: GET
    path: /api/v1/rebate-submissions
    description: "List submissions (reverse-reachability for contractor_id, order_id, ahri_rating_id FKs)"
    roles: [DistributorAdmin, ContractorUser, ComplianceOfficer]
    code: 200
    input: ["contractor_id?", "order_id?", "ahri_rating_id?", "status?", "limit?", "offset?"]
    output: RebateSubmission[]
    side_effects: []
  - method: PATCH
    path: /api/v1/rebate-submissions/{id}
    description: "Attach documents to a DRAFT or SUBMITTED dossier; OCC-guarded"
    roles: [ContractorUser]
    code: 200
    input: [expected_rebate_version, docs]
    output: RebateSubmission
    side_effects: ["docs union-replaced with payload list; SUBMITTED -> DOCS_COMPLETE when all four docs present; increments version by 1"]
  - method: POST
    path: /api/v1/rebate-submissions/{id}/submit
    description: "Submit the dossier (cross-entity gates: order DELIVERED, rating ACTIVE, tax-credit eligibility)"
    roles: [ContractorUser]
    code: 200
    input: []
    output: RebateSubmission
    side_effects: ["DRAFT -> SUBMITTED; submitted_at + decision_deadline set; increments version by 1"]
  - method: POST
    path: /api/v1/rebate-submissions/{id}/decision
    description: "QUALIFY/REJECT (ComplianceOfficer); PAY (DistributorAdmin)"
    roles: [ComplianceOfficer, DistributorAdmin]
    code: 200
    input: [action]
    output: RebateSubmission
    side_effects: ["QUALIFY finalizes rebate_qualification_calculation; PAY requires clock <= decision_deadline; increments version by 1"]

  # --- training ---
  - method: POST
    path: /api/v1/training-courses
    description: "Schedule a training course (instructor closed-interval + 1-day buffer conflict check)"
    roles: [TrainingCoordinator]
    code: 201
    input: [course_code, title, credit_hours, session_start, session_end, instructor_name, max_seats]
    output: TrainingCourse
    side_effects: []
  - method: GET
    path: /api/v1/training-courses/{id}
    description: "Fetch one course"
    roles: [DistributorAdmin, ContractorUser, TrainingCoordinator]
    code: 200
    input: []
    output: TrainingCourse
    side_effects: []
  - method: GET
    path: /api/v1/training-courses
    description: "List courses"
    roles: [DistributorAdmin, ContractorUser, TrainingCoordinator]
    code: 200
    input: ["status?", "instructor_name?", "limit?", "offset?"]
    output: TrainingCourse[]
    side_effects: []
  - method: PATCH
    path: /api/v1/training-courses/{id}
    description: "Cancel a SCHEDULED course via {action: CANCEL}"
    roles: [DistributorAdmin, TrainingCoordinator]
    code: 200
    input: [action]
    output: TrainingCourse
    side_effects: ["SCHEDULED -> CANCELLED; increments version by 1"]
  - method: POST
    path: /api/v1/training-courses/{id}/complete
    description: "Complete a course and grant credits to attendees"
    roles: [TrainingCoordinator]
    code: 200
    input: [attendee_contractor_ids]
    output: TrainingCourse
    side_effects: ["SCHEDULED -> COMPLETED; create one TrainingCredit per attendee; recompute training_credit_balance_hours; increments version by 1"]
  - method: GET
    path: /api/v1/training-credits/{id}
    description: "Fetch one training credit"
    roles: [DistributorAdmin, ContractorUser, TrainingCoordinator]
    code: 200
    input: []
    output: TrainingCredit
    side_effects: ["lazy expiry: status EXPIRED when clock >= expires_at"]
  - method: GET
    path: /api/v1/training-credits
    description: "List credits (reverse-reachability for contractor_id and course_id FKs)"
    roles: [DistributorAdmin, ContractorUser, TrainingCoordinator]
    code: 200
    input: ["contractor_id?", "course_id?", "status?", "limit?", "offset?"]
    output: TrainingCredit[]
    side_effects: []

  # --- co-op claims ---
  - method: POST
    path: /api/v1/coop-claims
    description: "Submit a co-op advertising claim"
    roles: [ContractorUser]
    code: 201
    input: [contractor_id, invoice_reference, period, spend_cents]
    output: CoopClaim
    side_effects: []
  - method: GET
    path: /api/v1/coop-claims/{id}
    description: "Fetch one claim"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: []
    output: CoopClaim
    side_effects: []
  - method: GET
    path: /api/v1/coop-claims
    description: "List claims (reverse-reachability for contractor_id FK)"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: ["contractor_id?", "status?", "period?", "limit?", "offset?"]
    output: CoopClaim[]
    side_effects: []
  - method: POST
    path: /api/v1/coop-claims/{id}/decision
    description: "VERIFY/APPROVE/REJECT/DISPUTE/PAY (DistributorAdmin); RESUBMIT (ContractorUser)"
    roles: [DistributorAdmin, ContractorUser]
    code: 200
    input: [action, "approved_amount_cents?", "spend_cents?"]
    output: CoopClaim
    side_effects: ["state transition per CoopClaim machine; VERIFY computes eligible_amount_cents; PAY debits contractor.coop_accrual_final_cents; increments version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role lacks permission for this endpoint or action (e.g. ContractorUser attempting QUALIFY)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "body-referenced FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, malformed type, or unknown field in payload" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a legal from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "resource is in a terminal state; no further transitions" }
  - { id: ERR_COMPLIANCE_HOLD, http: 422, condition: "contractor.compliance_standing == HOLD blocks order submit or cylinder issue" }
  - { id: ERR_INVALID_CYLINDER_WEIGHT, http: 422, condition: "returned_weight_lbs below tare or above full weight" }
  - { id: ERR_WINDOW_EXPIRED, http: 422, condition: "logical clock outside the required window (pre-buy order window, ship_by_date, registration deadline, rebate pay deadline)" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "PreBuyProgram window overlaps an existing window for the same family_code (half-open semantics)" }
  - { id: ERR_INSTRUCTOR_CONFLICT, http: 422, condition: "instructor has another session overlapping under closed-interval semantics or within the 1-day buffer" }
  - { id: ERR_POOL_CAPACITY_EXCEEDED, http: 422, condition: "aggregate overlapping-pool capacity for a family exceeds 2x the largest single pool at some instant" }
  - { id: ERR_INVALID_SYSTEM_PAIRING, http: 422, condition: "AHRI pairing violates component-type or refrigerant-compatibility rules" }
  - { id: ERR_DUPLICATE, http: 409, condition: "unique constraint violation (license_number, model_number, ahri_reference_number, cylinder_tag, course_code, serial_number, invoice_reference per contractor)" }
  - { id: ERR_INVALID_LINE, http: 422, condition: "OrderLine has both/neither of ahri_rating_id and equipment_model_id, or quantity < 1" }
  - { id: ERR_MODEL_NOT_ORDERABLE, http: 422, condition: "referenced model DISCONTINUED, ALLOCATED_ONLY without covering pool, or rating WITHDRAWN" }
  - { id: ERR_REBATE_MISMATCH, http: 422, condition: "rebate references an ahri_rating_id absent from the order's lines, or install_date before order submission" }
  - { id: ERR_WARRANTY_NOT_ACTIVE, http: 422, condition: "claim contractor mismatch with registration, or registration not REGISTERED at review time" }
  - { id: ERR_CREDIT_HOLD, http: 422, condition: "contractor.credit_hold is true at order submit" }
  - { id: ERR_ACCRUAL_EXCEEDED, http: 422, condition: "approved_amount_cents exceeds eligible_amount_cents or current final accrual balance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_REVISION_LIMIT, http: 422, condition: "PartsClaim resubmit attempted after 3 revision cycles" }
  - { id: ERR_SEAT_CAPACITY, http: 422, condition: "training course completion with more attendees than max_seats" }

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: DistributorAdmin
    description: "Distributor operations staff: catalog, programs, pools, fulfillment, payouts"
    identity: opaque
    exclusive_operations:
      - "POST /equipment-models, /ahri-ratings, /prebuy-programs, /allocation-pools"
      - "POST /orders/{id}/ship, /orders/{id}/deliver"
      - "POST /warranty-registrations/{id}/void"
      - "POST /refrigerant-cylinders* (create/issue/return/reclaim)"
      - "POST /coop-claims/{id}/decision (VERIFY/APPROVE/REJECT/DISPUTE/PAY)"
      - "POST /parts-claims/{id}/decision PAY action"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across resources"
      - "POST /orders/{id}/billing-events (INVOICE_* events)"
      - "PATCH /training-courses/{id} (CANCEL)"
  - name: ContractorUser
    description: "Dealer user acting as a persisted Contractor; X-User-ID equals Contractor.id"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /orders, /orders/{id}/lines, /orders/{id}/submit, /orders/{id}/cancel"
      - "PATCH /orders/{id}"
      - "POST /warranty-registrations, /warranty-registrations/{id}/register"
      - "POST /parts-claims, /parts-claims/{id}/resubmit"
      - "POST /rebate-submissions, /rebate-submissions/{id}/submit, PATCH /rebate-submissions/{id}"
      - "POST /coop-claims, /coop-claims/{id}/decision RESUBMIT"
    shared_operations:
      - "GET reads of own resources and catalog"
      - "POST /orders/{id}/billing-events (PAY_* events)"
  - name: WarrantyProcessor
    description: "Claims adjuster: reviews and adjudicates parts claims; may not pay them (segregation of duties vs DistributorAdmin)"
    identity: opaque
    exclusive_operations:
      - "POST /parts-claims/{id}/decision BEGIN_REVIEW / APPROVE / DENY / REQUEST_INFO"
    shared_operations:
      - "GET reads of claims, registrations, orders"
  - name: ComplianceOfficer
    description: "Rebate/compliance reviewer: qualifies rebate dossiers; may not pay them (segregation of duties vs DistributorAdmin)"
    identity: opaque
    exclusive_operations:
      - "POST /rebate-submissions/{id}/decision QUALIFY / REJECT"
    shared_operations:
      - "GET reads of submissions, cylinders, contractors"
  - name: TrainingCoordinator
    description: "Training administrator: schedules and completes courses"
    identity: opaque
    exclusive_operations:
      - "POST /training-courses, /training-courses/{id}/complete"
    shared_operations:
      - "GET reads of courses, credits, contractors"
      - "PATCH /training-courses/{id} (CANCEL)"
