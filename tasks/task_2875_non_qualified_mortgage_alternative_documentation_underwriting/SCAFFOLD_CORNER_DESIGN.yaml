              as: LoanOfficer
              as_user_id: "lo-1"
              payload: { loan_file_id: "${lf_id}", fee_code: "F-ORIG", fee_category: "ORIGINATION_POINTS", amount_cents: 300000, prepaid_finance_charge_flag: true }
            - call: "POST /loan-files/${lf_id}/submit-to-underwriting"
              as: LoanOfficer
              as_user_id: "lo-1"
              payload: {}
            - call: "GET /loan-files/${lf_id}"
              as: Underwriter
              as_user_id: "uw-1"
              captures: { lf_version: "$.data.version" }
            - call: "POST /income-worksheets"
              as: Underwriter
              as_user_id: "uw-1"
              payload: { loan_file_id: "${lf_id}", method: "ASSET_DEPLETION", expected_loan_file_version: "${lf_version}", asset_bucket_checking_cents: 15000000, asset_bucket_brokerage_cents: 22222225, asset_bucket_retirement_cents: 30000001 }
              captures: { ws_id: "$.data.id" }
            - call: "POST /income-worksheets/${ws_id}/calculate"
              as: Underwriter
              as_user_id: "uw-1"
              payload: {}
          trigger:
            - call: "POST /income-worksheets/${ws_id}/accept"
