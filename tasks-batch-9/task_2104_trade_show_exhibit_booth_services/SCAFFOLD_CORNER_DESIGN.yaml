    distinguishing_aspect: 'The asset cycles IN_STORAGE to IN_REFURB and back: completing the work order at 550000 against a 500000 estimate writes variance_cents 50000, lifts refurb_cycles_count from 0 to 1 and returns the asset to IN_STORAGE at the same
      warehouse.'
