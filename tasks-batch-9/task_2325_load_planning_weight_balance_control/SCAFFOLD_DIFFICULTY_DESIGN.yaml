            - "LoadPlan.${lp1}.status == SHEET_ISSUED and LoadPlan.${lp1}.base_payload_kg == 6100.00 (unchanged)"

      - name: flight_creation_blocked_by_grounded_aircraft
        entity_pair: "Flight depends on Aircraft"
        dependency: "POST /flights is refused when the referenced Aircraft.status is GROUNDED rather than IN_SERVICE"
        grounds:
          - validations.priority_7
          - state_machines.Aircraft.transitions.IN_SERVICE_to_GROUNDED
          - entities.Aircraft.fields.status
        distinguishing_aspect: |
          A different entity pair and a different direction of dependency: here the
          child's creation is gated on a configuration parent's posture, not on a
          sibling document's approval. Grounding is retroactive only for NEW
          flights - the airframe's already-planned flight keeps running and its
          derived weight limits are untouched - so an implementation that
          re-validates existing flights against Aircraft.status, or that forgets
          the check on creation, is caught by the same fixture.
