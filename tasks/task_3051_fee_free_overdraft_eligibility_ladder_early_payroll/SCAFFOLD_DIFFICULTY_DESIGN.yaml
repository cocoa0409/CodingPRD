scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two calculations on DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: available_balance_optimistic_vs_conservative
        grounds:
          - calculations.calc_available_balance
          - entities.DepositAccount.fields.available_optimistic_cents
          - entities.DepositAccount.fields.available_conservative_cents
        distinguishing_aspect: |
          Dual variant on the DepositAccount domain: identical account state yields
          available_optimistic_cents = posted + provisional_early - holds + usable_cushion
          while available_conservative_cents = posted - holds, so the two readings
          differ by exactly (provisional_early_cents + usable_cushion_cents).
        test_recipe:
          setup:
            - "clock pinned at 2026-09-01T00:00:00Z (default)"
            - "Member m1 enrolled 2026-01-01 (tenure 243d), 2 qualifying payroll deposits settled, then evaluated to ELIGIBLE with limit 2000"
            - "DepositAccount SPENDING; posted_balance 15000 after settles"
            - "a third qualifying deposit of 20000 posted early (provisional_early_cents == 20000)"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m1", full_name: "M One", enrolled_at: "2026-01-01T00:00:00Z" }
              as: ProgramOps
              captures: { m1: $.data.id, m1_v0: $.data.version }
            - call: "POST /banking/members/${m1}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a1: $.data.id }
            - call: "POST /banking/accounts/${a1}/deposits"
              payload: { originator_id: "EMP1", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-20T00:00:00Z", trace_id: "t1" }
              as: SponsorBankOps
              captures: { d1: $.data.id }
            - call: "POST /banking/accounts/${a1}/deposits"
              payload: { originator_id: "EMP1", originator_type: "PAYROLL", amount_cents: 5000, settlement_date: "2026-08-28T00:00:00Z", trace_id: "t2" }
              as: SponsorBankOps
              captures: { d2: $.data.id }
            - call: "POST /banking/deposits/${d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m1}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m1_v0}" }
              as: ProgramOps
            - call: "POST /banking/accounts/${a1}/deposits"
              payload: { originator_id: "EMP1", originator_type: "PAYROLL", amount_cents: 20000, settlement_date: "2026-09-05T00:00:00Z", trace_id: "t3" }
              as: SponsorBankOps
              captures: { d3: $.data.id }
            - call: "POST /banking/deposits/${d3}/post-early"
              payload: {}
              as: ProgramOps
          trigger:
            - call: "GET /banking/accounts/${a1}"
              payload: {}
              as: ProgramOps
          assert:
            - "DepositAccount.${a1}.posted_balance_cents == 15000"
            - "DepositAccount.${a1}.provisional_early_cents == 20000"
            - "DepositAccount.${a1}.usable_cushion_cents == 2000"
            - "DepositAccount.${a1}.available_optimistic_cents == 37000"
            - "DepositAccount.${a1}.available_conservative_cents == 15000"
            - "available_optimistic_cents - available_conservative_cents == 22000 == provisional_early_cents + usable_cushion_cents"

      - name: eligibility_score_batch_vs_realtime
        grounds:
          - calculations.calc_eligibility_score
          - entities.EligibilityProfile.fields.evaluation_mode
        distinguishing_aspect: |
          Dual variant on the Member/EligibilityProfile domain (different entity
          domain from the available-balance instance): identical deposit history
          yields BATCH score counting only SETTLED deposits while REALTIME also
          counts in-flight RECEIVED_FILE deposits, so REALTIME crosses the
          n >= 4 bucket boundary and scores exactly 150 points higher.
        test_recipe:
          setup:
            - "clock at 2026-09-01T00:00:00Z; member m2 enrolled 2025-09-01 (tenure 365d)"
            - "3 qualifying payroll deposits SETTLED (n_batch = 3 -> bucket 150)"
            - "1 qualifying payroll deposit still in RECEIVED_FILE (settlement in future); REALTIME counts it (n_rt = 4 -> bucket 300)"
            - "0 repayments, 0 abuse events"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m2", full_name: "M Two", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m2: $.data.id, m2_v0: $.data.version }
            - call: "POST /banking/members/${m2}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a2: $.data.id }
            - call: "POST /banking/accounts/${a2}/deposits"
              payload: { originator_id: "EMP2", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m2-t1" }
              as: SponsorBankOps
              captures: { m2d1: $.data.id }
            - call: "POST /banking/accounts/${a2}/deposits"
              payload: { originator_id: "EMP2", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-21T00:00:00Z", trace_id: "m2-t2" }
              as: SponsorBankOps
              captures: { m2d2: $.data.id }
            - call: "POST /banking/accounts/${a2}/deposits"
              payload: { originator_id: "EMP2", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-28T00:00:00Z", trace_id: "m2-t3" }
              as: SponsorBankOps
              captures: { m2d3: $.data.id }
            - call: "POST /banking/deposits/${m2d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m2d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m2d3}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/accounts/${a2}/deposits"
              payload: { originator_id: "EMP2", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-04T00:00:00Z", trace_id: "m2-t4" }
              as: SponsorBankOps
          trigger:
            - call: "POST /banking/members/${m2}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m2_v0}" }
              as: ProgramOps
              captures: { m2_batch_score: $.data.score, m2_v1: $.data.version }
            - call: "POST /banking/members/${m2}/eligibility-evaluations"
              payload: { evaluation_mode: "REALTIME", expected_member_version: "${m2_v1}" }
              as: ProgramOps
              captures: { m2_rt_score: $.data.score }
          assert:
            - "EligibilityProfile BATCH.score == 400 (bucket 150 + tenure 250)"
            - "EligibilityProfile REALTIME.score == 550 (bucket 300 + tenure 250)"
            - "REALTIME score - BATCH score == 150"
            - "the BATCH profile remains status == CURRENT for mode BATCH; the REALTIME evaluation creates no CushionLimitAdjustment (member current_limit_cents unchanged at the BATCH-computed value 2000)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: different modes (a) and (b)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ladder_min_of_three_caps
        grounds:
          - calculations.calc_ladder_limit
          - entities.EligibilityProfile.fields.computed_limit_cents
        distinguishing_aspect: |
          Mode (a): the limit is min(score_cap, repay_cap, tenure_cap) — three
          tiered bands over three independent inputs with non-linear interaction;
          here score_cap 5000 (score 329) and tenure_cap 5000 (43 days) would
          allow 5000, but repay_cap (0 repayments) binds at 2000.
        test_recipe:
          setup:
            - "clock 2026-09-01; member m3 enrolled 2026-07-20 (tenure 43d -> tenure_points round_half_up(43/365*250)=29, tenure_cap 5000)"
            - "4 qualifying payroll deposits settled (bucket 300); score = 300 + 29 + 0 = 329 -> score_cap 5000"
            - "0 consecutive repayments -> repay_cap 2000 (binds)"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m3", full_name: "M Three", enrolled_at: "2026-07-20T00:00:00Z" }
              as: ProgramOps
              captures: { m3: $.data.id, m3_v0: $.data.version }
            - call: "POST /banking/members/${m3}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a3: $.data.id }
            - call: "POST /banking/accounts/${a3}/deposits"
              payload: { originator_id: "EMP3", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-05T00:00:00Z", trace_id: "m3-t1" }
              as: SponsorBankOps
              captures: { m3d1: $.data.id }
            - call: "POST /banking/accounts/${a3}/deposits"
              payload: { originator_id: "EMP3", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-12T00:00:00Z", trace_id: "m3-t2" }
              as: SponsorBankOps
              captures: { m3d2: $.data.id }
            - call: "POST /banking/accounts/${a3}/deposits"
              payload: { originator_id: "EMP3", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-19T00:00:00Z", trace_id: "m3-t3" }
              as: SponsorBankOps
              captures: { m3d3: $.data.id }
            - call: "POST /banking/accounts/${a3}/deposits"
              payload: { originator_id: "EMP3", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-26T00:00:00Z", trace_id: "m3-t4" }
              as: SponsorBankOps
              captures: { m3d4: $.data.id }
            - call: "POST /banking/deposits/${m3d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m3d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m3d3}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m3d4}/settle"
              payload: {}
              as: SponsorBankOps
          trigger:
            - call: "POST /banking/members/${m3}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m3_v0}" }
              as: ProgramOps
              captures: { m3_score: $.data.score, m3_limit: $.data.computed_limit_cents }
          assert:
            - "EligibilityProfile.score == 329 (bucket 300 + tenure_points 29 + 0)"
            - "EligibilityProfile.computed_limit_cents == 2000 (min(score_cap 5000, repay_cap 2000, tenure_cap 5000) — repay_cap binds)"
            - "Member.${m3}.status == ELIGIBLE and Member.current_limit_cents == 2000 (INCREASE adjustment EFFECTIVE immediately)"

      - name: pro_rata_rounding_remainder_to_oldest
        grounds:
          - calculations.calc_repayment_waterfall
          - entities.RepaymentAllocation.fields.allocation_mode
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — a non-qualifying deposit
          repays pro-rata with per-line round_half_up and the -1 cent remainder
          reconciled to the OLDEST advance; sum-then-round would allocate
          1667/1667/1667 (total 5001) instead. Advances of 3333/3333/3334 repaid
          by a 5000 OTHER deposit yield exactly 1666/1667/1667.
        test_recipe:
          setup:
            - "clock 2026-09-01; member m4 ELIGIBLE: 6 settled qualifying deposits (bucket 400) + tenure 365d (250) = score 650 -> score_cap 10000; repay_cap 2000 -> limit 2000"
            - "to hold three advances of 3333/3333/3334 the limit must reach 10000: member repays one 2000 advance on-time via a qualifying deposit (consecutive 1 -> repay_cap 5000), then re-evaluation still binds repay_cap 5000 < 10000; the chain therefore uses TWO on-time cycles then a second eval — repay_cap 5000 at 1 repayment, 5000 at 2 (band >=1); three advances are drawn as 1666+1667+1667=5000 within limit 5000 and the OTHER deposit is 2500 so shares are 833.25->833, 833.5->834, 833.5->834, sum 2501, remainder -1 to oldest => 832/834/834"
            - "three MEMBER_INITIATED advances: 1666, 1667, 1667 (total 5000, equals limit)"
            - "one OTHER (non-qualifying) deposit of 2500 settles"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m4", full_name: "M Four", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m4: $.data.id, m4_v0: $.data.version }
            - call: "POST /banking/members/${m4}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a4: $.data.id }
            - call: "POST /banking/accounts/${a4}/deposits"
              payload: { originator_id: "EMP4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-05T00:00:00Z", trace_id: "m4-t1" }
              as: SponsorBankOps
              captures: { m4d1: $.data.id }
            - call: "POST /banking/accounts/${a4}/deposits"
              payload: { originator_id: "EMP4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-12T00:00:00Z", trace_id: "m4-t2" }
              as: SponsorBankOps
              captures: { m4d2: $.data.id }
            - call: "POST /banking/accounts/${a4}/deposits"
              payload: { originator_id: "EMP4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-19T00:00:00Z", trace_id: "m4-t3" }
              as: SponsorBankOps
              captures: { m4d3: $.data.id }
            - call: "POST /banking/accounts/${a4}/deposits"
              payload: { originator_id: "EMP4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-26T00:00:00Z", trace_id: "m4-t4" }
              as: SponsorBankOps
              captures: { m4d4: $.data.id }
            - call: "POST /banking/deposits/${m4d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m4d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m4d3}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m4d4}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m4}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m4_v0}" }
              as: ProgramOps
              captures: { m4_v1: $.data.version }
            - call: "GET /banking/accounts/${a4}"
              payload: {}
              as: ProgramOps
              captures: { a4_v1: $.data.version }
            - call: "POST /banking/accounts/${a4}/advances"
              payload: { amount_cents: 2000, idempotency_key: "m4-seed-adv", expected_account_version: "${a4_v1}" }
              as: Member
              as_user_id: "${m4}"
              captures: { m4_seed_adv: $.data.id }
            - call: "POST /banking/accounts/${a4}/deposits"
              payload: { originator_id: "EMP4", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-09-01T00:00:00Z", trace_id: "m4-t5" }
              as: SponsorBankOps
              captures: { m4d5: $.data.id }
            - call: "POST /banking/deposits/${m4d5}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "GET /banking/members/${m4}"
              payload: {}
              as: ProgramOps
              captures: { m4_v2: $.data.version }
            - call: "POST /banking/members/${m4}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m4_v2}" }
              as: ProgramOps
              captures: { m4_limit2: $.data.computed_limit_cents }
            - call: "GET /banking/accounts/${a4}"
              payload: {}
              as: ProgramOps
              captures: { a4_v2: $.data.version }
            - call: "POST /banking/accounts/${a4}/advances"
              payload: { amount_cents: 1666, idempotency_key: "m4-adv1", expected_account_version: "${a4_v2}" }
              as: Member
              as_user_id: "${m4}"
              captures: { adv1: $.data.id }
            - call: "GET /banking/accounts/${a4}"
              payload: {}
              as: ProgramOps
              captures: { a4_v3: $.data.version }
            - call: "POST /banking/accounts/${a4}/advances"
              payload: { amount_cents: 1667, idempotency_key: "m4-adv2", expected_account_version: "${a4_v3}" }
              as: Member
              as_user_id: "${m4}"
              captures: { adv2: $.data.id }
            - call: "GET /banking/accounts/${a4}"
              payload: {}
              as: ProgramOps
              captures: { a4_v4: $.data.version }
            - call: "POST /banking/accounts/${a4}/advances"
              payload: { amount_cents: 1667, idempotency_key: "m4-adv3", expected_account_version: "${a4_v4}" }
              as: Member
              as_user_id: "${m4}"
              captures: { adv3: $.data.id }
            - call: "POST /banking/accounts/${a4}/deposits"
              payload: { originator_id: "VENMO", originator_type: "OTHER", amount_cents: 2500, settlement_date: "2026-09-01T00:00:00Z", trace_id: "m4-other1" }
              as: SponsorBankOps
              captures: { m4od: $.data.id }
          trigger:
            - call: "POST /banking/deposits/${m4od}/settle"
              payload: {}
              as: SponsorBankOps
          assert:
            - "after the seed cycle Member.${m4}.consecutive_on_time_repayments == 1 and second eval computed_limit_cents == 5000 (repay_cap band >=1 binds under score_cap 10000)"
            - "RepaymentAllocation for advance ${adv1} (oldest) amount_cents == 832 (round_half_up(2500*1666/5000)=833 minus 1-cent remainder reconciled to oldest)"
            - "RepaymentAllocation for advance ${adv2} amount_cents == 834 (round_half_up(2500*1667/5000)=834)"
            - "RepaymentAllocation for advance ${adv3} amount_cents == 834"
            - "sum of allocations == 2500 exactly (no cent drift vs the sum-then-round value 2501)"
            - "all three advances PARTIALLY_REPAID with outstanding 834/833/833"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: member_posture_cycle_restricted_to_eligible
        grounds:
          - state_machines.Member.ELIGIBLE_to_RESTRICTED
          - state_machines.Member.RESTRICTED_to_ELIGIBLE
        distinguishing_aspect: |
          Cyclic machine on Member: ELIGIBLE -> RESTRICTED (abuse event) ->
          ELIGIBLE (rehabilitation at exactly 3 on-time repayments of advances
          drawn BEFORE the restriction); the cycle closes only through the
          restricted_consecutive_repayments >= 3 boundary, and the
          deposit_reroute_flag clears on the same transition.
        test_recipe:
          setup:
            - "member m5 ELIGIBLE with limit 2000 (2 settled qualifying deposits, tenure 365d, score 400)"
            - "THREE advances of 600 each drawn while ELIGIBLE (before restriction)"
            - "one DEPOSIT_REROUTE abuse event -> RESTRICTED, deposit_reroute_flag == true, restricted_consecutive_repayments = 0"
          setup_api_calls:
            - call: "POST /banking/members"
              payload: { external_ref: "m5", full_name: "M Five", enrolled_at: "2025-09-01T00:00:00Z" }
              as: ProgramOps
              captures: { m5: $.data.id, m5_v0: $.data.version }
            - call: "POST /banking/members/${m5}/accounts"
              payload: { account_type: "SPENDING" }
              as: SponsorBankOps
              captures: { a5: $.data.id }
            - call: "POST /banking/accounts/${a5}/deposits"
              payload: { originator_id: "EMP5", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-07T00:00:00Z", trace_id: "m5-t1" }
              as: SponsorBankOps
              captures: { m5d1: $.data.id }
            - call: "POST /banking/accounts/${a5}/deposits"
              payload: { originator_id: "EMP5", originator_type: "PAYROLL", amount_cents: 10000, settlement_date: "2026-08-14T00:00:00Z", trace_id: "m5-t2" }
              as: SponsorBankOps
              captures: { m5d2: $.data.id }
            - call: "POST /banking/deposits/${m5d1}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/deposits/${m5d2}/settle"
              payload: {}
              as: SponsorBankOps
            - call: "POST /banking/members/${m5}/eligibility-evaluations"
              payload: { evaluation_mode: "BATCH", expected_member_version: "${m5_v0}" }
              as: ProgramOps
              captures: { m5_v1: $.data.version }
            - call: "GET /banking/accounts/${a5}"
              payload: {}
              as: ProgramOps
              captures: { a5_v1: $.data.version }
            - call: "POST /banking/accounts/${a5}/advances"
              payload: { amount_cents: 600, idempotency_key: "m5-adv1", expected_account_version: "${a5_v1}" }
              as: Member
              as_user_id: "${m5}"
              captures: { m5adv1: $.data.id }
            - call: "GET /banking/accounts/${a5}"
              payload: {}
              as: ProgramOps
              captures: { a5_v2: $.data.version }
            - call: "POST /banking/accounts/${a5}/advances"
              payload: { amount_cents: 600, idempotency_key: "m5-adv2", expected_account_version: "${a5_v2}" }
              as: Member
              as_user_id: "${m5}"
              captures: { m5adv2: $.data.id }
            - call: "GET /banking/accounts/${a5}"
              payload: {}
              as: ProgramOps
              captures: { a5_v3: $.data.version }
            - call: "POST /banking/accounts/${a5}/advances"
              payload: { amount_cents: 600, idempotency_key: "m5-adv3", expected_account_version: "${a5_v3}" }
              as: Member
              as_user_id: "${m5}"
              captures: { m5adv3: $.data.id }
            - call: "POST /banking/members/${m5}/abuse-events"
              payload: { event_type: "DEPOSIT_REROUTE", expected_member_version: "${m5_v1}" }
              as: ProgramOps
          trigger:
            - call: "POST /banking/accounts/${a5}/deposits"
              payload: { originator_id: "EMP5", originator_type: "PAYROLL", amount_cents: 1800, settlement_date: "2026-09-01T00:00:00Z", trace_id: "m5-r1" }
              as: SponsorBankOps
              captures: { m5rd1: $.data.id }
            - call: "POST /banking/deposits/${m5rd1}/settle"
              payload: {}
              as: SponsorBankOps
          assert:
            - "after the abuse event Member.${m5}.status == RESTRICTED and deposit_reroute_flag == true"
            - "the 1800 qualifying deposit waterfall-repays all three 600 advances oldest-first (all REPAID, on_time == true)"
            - "Member.${m5}.status == ELIGIBLE (restricted_consecutive_repayments reached exactly 3)"
            - "Member.${m5}.deposit_reroute_flag == false after rehabilitation"
            - "Member.${m5}.consecutive_on_time_repayments == 3"

      - name: dispute_parallel_dimensions
        grounds:
          - state_machines.Dispute
          - entities.Dispute.fields.case_status
          - entities.Dispute.fields.provisional_status
        distinguishing_aspect: |
          Parallel dimensions on Dispute (different entity from Member): case_status
          (FILED->UNDER_REVIEW->RESOLVED_*) evolves independently of
          provisional_status (NONE->PROVISIONAL_ISSUED->PROVISIONAL_MADE_FINAL/
          PROVISIONAL_RECLAIMED); resolving for the BANK after a provisional
          credit yields RESOLVED_BANK x PROVISIONAL_RECLAIMED — a combined state
          no linear pipeline could express.
        test_recipe:
          setup:
