  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_start_gated_on_parent_roster_being_clocked_in
        grounds:
          - validations[priority=10]
          - errors[ERR_ROSTER_NOT_CLOCKED_IN]
          - state_machines.RoomAssignment.ASSIGNED_to_IN_PROGRESS
          - state_machines.ShiftRoster.PLANNED_to_CLOCKED_IN
        distinguishing_aspect: |
          The gate lives on a DIFFERENT entity from the one being transitioned: the assignment is a
          perfectly valid ASSIGNED row, but ShiftRoster.status is PLANNED, so the start is refused with
          ERR_ROSTER_NOT_CLOCKED_IN; the identical start then succeeds once the parent roster - and
          nothing about the assignment - has moved to CLOCKED_IN.
