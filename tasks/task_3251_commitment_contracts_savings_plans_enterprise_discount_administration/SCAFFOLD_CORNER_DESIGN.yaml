              as: OrgAdmin
              captures: { tu_err: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_TERM_NOT_ENDED"

      - name: usage_ingest_with_nonzero_minute_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "usage_hour_start of 2026-09-01T00:30:00Z violates the whole-hour rule and is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock at default. Org; account."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Hr Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { hr_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${hr_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
