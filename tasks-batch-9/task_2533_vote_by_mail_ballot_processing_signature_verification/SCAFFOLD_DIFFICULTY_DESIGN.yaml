          - calculations.ballot_accountability_reconciliation
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /mailing-batches/{id}/dispatch: the batch mutation causes the
          packet to become MAILED (link 1); the packet becoming MAILED is what drives its BallotRequest
          APPROVED -> MAILED (link 2); the request reaching MAILED is what recomputes the election's
          packet counters and auto-advances posture PRE_MAIL -> MAILING (link 3). Each link is caused by
          the previous one, not by the dispatch call itself.
