# =============================================================================
# PRD Benchmark Scaffold — Boat & Watercraft Dry-Stack Storage Marina
# Difficulty: Expert
# =============================================================================

scenario: "Boat & Watercraft Dry-Stack Storage Marina: dry-stack rack & vessel dimensions, launch request & forklift scheduling, valet splash & fuel, monthly storage tier & seasonal, haul-out/winterization, waitlist & rack rotation, insurance/COI, billing"

domain_name: boat-dry-stack-marina
api_prefix: /marina

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by FK references (Vessel, Rack, StorageAgreement,
  # LaunchRequest, Forklift, ForkliftSlot, ServiceOrder, WaitlistEntry,
  # InsurancePolicy, StorageInvoice). No nesting in URL paths; all relationships
  # are foreign keys carried in request bodies.

  state_machine_shape: cyclic
  # LaunchRequest is cyclic (SCHEDULED -> REQUESTED revert loop on reschedule;
  # SPLASHED -> RACKED return loop on haul-back). StorageAgreement is
  # branching-with-revert (ACTIVE -> WINTERIZED -> ACTIVE seasonal cycle, plus
  # ACTIVE/WINTERIZED -> TERMINATED). Vessel carries parallel state dimensions
  # (location_status x billing_status evolve independently on one row).

  relationship_patterns:
    - one_to_many        # Marina -> Rack ; Vessel -> LaunchRequest ; Vessel -> ServiceOrder
    - cross_aggregate    # LaunchRequest -> ForkliftSlot ; StorageAgreement -> Rack ; Vessel -> InsurancePolicy
    - polymorphic        # StorageInvoice.source_kind references StorageAgreement | LaunchRequest | ServiceOrder

  role_model: peer_roles
  # BoatOwner owns Vessels/LaunchRequests/ServiceOrders; DockMaster operates
  # racks/forklift slots/rotation; BillingClerk owns invoices/policies/waitlist
  # admin. Non-overlapping resource ownership with a few shared read operations.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Marina
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Marina display name."
      - name: timezone
        type: string
        source: input
        description: "IANA timezone; informational only. All persisted timestamps are UTC."
        default: "UTC"
      - name: forklift_service_minutes
        type: integer
        source: input
        description: "Length in minutes of a single forklift launch/haul slot (the service window)."
        default: 30
        constraints: "integer >= 1"
      - name: forklift_buffer_minutes
        type: integer
        source: input
        description: "Turnaround buffer minutes appended to every forklift slot's busy interval for overlap detection on the same forklift."
        default: 15
        constraints: "integer >= 0"
      - name: total_rack_count
        type: integer
        source: computed
        description: "Count of Rack rows whose marina_id == this Marina.id."

  - name: Forklift
    parent: null
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id"
      - name: label
        type: string
        source: input
        description: "Operator-facing forklift identifier (e.g., 'Wiggins-01')."
      - name: max_lift_weight_lbs
        type: integer
        source: input
        description: "Maximum vessel dry weight (pounds) this forklift can lift."
        constraints: "integer > 0"
      - name: status
        type: enum
        source: system
        description: "Forklift availability state. Set to AVAILABLE at creation; only AVAILABLE forklifts are candidates for slot booking."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE}"

  - name: Rack
    parent: null
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id"
      - name: bay_label
        type: string
        source: input
        description: "Physical rack bay label (e.g., 'A-12')."
        constraints: "unique among Rack rows with the same marina_id"
      - name: size_class
        type: enum
        source: input
        description: "Rack size class driving the monthly storage base rate."
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: max_loa_ft
        type: number
        source: input
        description: "Maximum vessel length-overall in feet this rack accepts."
        constraints: "number > 0, two decimals"
      - name: max_beam_ft
        type: number
        source: input
        description: "Maximum vessel beam (width) in feet this rack accepts."
        constraints: "number > 0, two decimals"
      - name: max_weight_lbs
        type: integer
        source: input
        description: "Maximum vessel dry weight in pounds this rack accepts."
        constraints: "integer > 0"
      - name: status
        type: enum
        source: system
        description: "Rack occupancy state. OCCUPIED when an ACTIVE StorageAgreement holds it."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, OCCUPIED}"
      - name: current_agreement_id
        type: string
        source: computed
        description: "FK -> StorageAgreement.id; the id of the ACTIVE/WINTERIZED StorageAgreement occupying this rack, else null."
        default: null

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id"
      - name: owner_id
        type: string
        source: input
        description: "FK -> BoatOwnerAccount.id; the owning BoatOwner."
      - name: name
        type: string
        source: input
        description: "Vessel name."
      - name: loa_ft
        type: number
        source: input
        description: "Length overall in feet."
        constraints: "number > 0, two decimals"
      - name: beam_ft
        type: number
        source: input
        description: "Beam (width) in feet."
        constraints: "number > 0, two decimals"
      - name: dry_weight_lbs
        type: integer
        source: input
        description: "Dry weight in pounds."
        constraints: "integer > 0"
      - name: location_status
        type: enum
        source: system
        description: "Parallel state dimension A: physical whereabouts of the vessel. Evolves independently of billing_status. OFF_SITE (initial / after terminate), RACKED (after agreement activate or haul-back), IN_WATER (after splash)."
        default: "OFF_SITE"
        constraints: "one of {OFF_SITE, RACKED, IN_WATER}"
      - name: billing_status
        type: enum
        source: system
        description: "Parallel state dimension B: billing posture of the vessel. Evolves independently of location_status."
        default: "UNBILLED"
        constraints: "one of {UNBILLED, ACTIVE_STORAGE, WINTER_HOLD, DELINQUENT, CLOSED}"
      - name: active_policy_id
        type: string
        source: computed
        description: "FK -> InsurancePolicy.id; id of the vessel's InsurancePolicy whose status == VERIFIED and effective window covers the logical clock, else null."
        default: null

  - name: BoatOwnerAccount
    parent: null
    common_fields: true
    fields:
      - name: marina_id
        type: string
        source: input
        description: "FK -> Marina.id"
      - name: full_name
        type: string
        source: input
        description: "Owner full name."
      - name: email
        type: string
        source: input
        description: "Owner contact email."
      - name: account_balance_cents
        type: integer
        source: computed
        description: "Sum of StorageInvoice.amount_cents for invoices with owner_id == this account and status == ISSUED minus sum of those with status == PAID's settled amounts; the outstanding amount owed (>= 0)."
        default: 0

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: carrier_name
        type: string
        source: input
        description: "Insurance carrier name."
      - name: liability_limit_cents
        type: integer
        source: input
        description: "Liability coverage limit in cents."
        constraints: "integer > 0"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC; inclusive start of coverage."
      - name: effective_to
        type: datetime
        source: input
        description: "ISO 8601 UTC; exclusive end of coverage."
      - name: status
        type: enum
        source: system
        description: "COI verification state."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, VERIFIED, REJECTED, EXPIRED}"

  - name: StorageAgreement
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: rack_id
        type: string
        source: input
        description: "FK -> Rack.id"
      - name: tier_size_class
        type: enum
        source: computed
        description: "Copied from the assigned Rack.size_class at activation; pins the storage base rate even if the rack is later reclassified."
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: monthly_base_cents
        type: integer
        source: computed
        description: "Storage base rate for tier_size_class with oversize surcharge applied (see calc compute_monthly_storage). Excludes seasonal multiplier."
        default: 0
      - name: oversize_surcharge_applied
        type: boolean
        source: computed
        description: "True when vessel.loa_ft is within OVERSIZE_BAND_FT of rack.max_loa_ft at activation."
        default: false
      - name: activated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; logical-clock instant the agreement transitioned PENDING_COI -> ACTIVE."
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; logical-clock instant the agreement transitioned to TERMINATED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle state."
        default: "PENDING_COI"
        constraints: "one of {PENDING_COI, ACTIVE, WINTERIZED, TERMINATED}"

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: requested_size_class
        type: enum
        source: input
        description: "Size class of rack the owner wants."
        constraints: "one of {SMALL, MEDIUM, LARGE}"
      - name: deposit_paid
        type: boolean
        source: input
        description: "Whether a priority deposit was paid (raises priority score)."
        default: false
      - name: joined_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; logical-clock instant the entry was created (basis of days_waiting)."
      - name: priority_score
        type: integer
        source: computed
        description: "Waitlist ranking score (see calc compute_waitlist_priority). Recomputed on read/promotion sweep."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Waitlist entry state."
        default: "WAITING"
        constraints: "one of {WAITING, OFFERED, PLACED, EXPIRED, WITHDRAWN}"
      - name: offered_rack_id
        type: string
        source: computed
        description: "FK -> Rack.id; the rack reserved for this entry while status == OFFERED, else null."
        default: null
      - name: offer_expires_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC; logical-clock deadline by which an OFFERED entry must accept before the offer lapses."
        default: null

  - name: LaunchRequest
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: forklift_slot_id
        type: string
        source: computed
        description: "FK -> ForkliftSlot.id; the slot booked for this launch while SCHEDULED/SPLASHED, else null."
        default: null
      - name: requested_window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC; desired launch start instant."
      - name: with_valet_splash
        type: boolean
        source: input
        description: "Whether a valet splash service is bundled (adds the splash fee)."
        default: false
      - name: launch_fee_cents
        type: integer
        source: computed
        description: "Launch fee for this request (see calc compute_launch_fee)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Launch request lifecycle state (cyclic)."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, SCHEDULED, SPLASHED, RACKED, CANCELLED}"

  - name: ForkliftSlot
    parent: null
    common_fields: true
    fields:
      - name: forklift_id
        type: string
        source: input
        description: "FK -> Forklift.id"
      - name: launch_request_id
        type: string
        source: computed
        description: "FK -> LaunchRequest.id; the launch occupying this slot, else null when released."
        default: null
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC; service start instant of the slot."
      - name: window_end
        type: datetime
        source: computed
        description: "ISO 8601 UTC; window_start + Marina.forklift_service_minutes."
      - name: busy_until
        type: datetime
        source: computed
        description: "ISO 8601 UTC; window_start + forklift_service_minutes + forklift_buffer_minutes; the exclusive end of the forklift's busy interval used for overlap detection."
      - name: status
        type: enum
        source: system
        description: "Slot state."
        default: "BOOKED"
        constraints: "one of {BOOKED, COMPLETED, RELEASED}"

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id"
      - name: service_kind
        type: enum
        source: input
        description: "Type of valet/fuel/haul service ordered."
        constraints: "one of {FUEL, VALET_SPLASH, WINTERIZATION, HAUL_OUT}"
      - name: fuel_gallons
        type: number
        source: input
        description: "Gallons of fuel (only for service_kind == FUEL; ignored otherwise)."
        default: 0
        constraints: "number >= 0, three decimals"
      - name: fuel_price_cents_per_gal
        type: integer
        source: input
        description: "Fuel price in cents per gallon at time of order (only for FUEL)."
        default: 0
        constraints: "integer >= 0"
      - name: total_cents
        type: integer
        source: computed
        description: "Computed service total (see calc compute_service_total)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Service order state."
        default: "ORDERED"
        constraints: "one of {ORDERED, FULFILLED, CANCELLED}"

  - name: StorageInvoice
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> BoatOwnerAccount.id"
      - name: source_kind
        type: enum
        source: input
        description: "Polymorphic source type the invoice bills for."
        constraints: "one of {STORAGE_AGREEMENT, LAUNCH_REQUEST, SERVICE_ORDER}"
      - name: source_id
        type: string
        source: input
        description: "Id of the source row (StorageAgreement | LaunchRequest | ServiceOrder) named by source_kind. Validated to exist."
      - name: variant
        type: enum
        source: input
        description: "For STORAGE_AGREEMENT sources: PROVISIONAL (forward-looking full-month estimate at issue) vs FINAL (chronological prorated actual at close). Ignored for other source kinds (treated as FINAL)."
        default: "FINAL"
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: period_start
        type: datetime
        source: input
        description: "ISO 8601 UTC; inclusive start of the billing period (storage invoices only)."
        default: null
      - name: period_end
        type: datetime
        source: input
        description: "ISO 8601 UTC; exclusive end of the billing period (storage invoices only)."
        default: null
      - name: amount_cents
        type: integer
        source: computed
        description: "Invoice amount (see calc compute_invoice_amount). Depends on source_kind and variant."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle state."
        default: "ISSUED"
        constraints: "one of {ISSUED, PAID, VOIDED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- InsurancePolicy: linear-with-revert COI lifecycle ----
  - entity: InsurancePolicy
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /marina/insurance-policies/{id}/verify"
        actor: BillingClerk
        preconditions:
          - "policy.status == SUBMITTED"
          - "policy.effective_to > policy.effective_from"
          - "policy.liability_limit_cents >= MIN_LIABILITY_CENTS"
        side_effects:
          - "policy.status = VERIFIED"
          - "if vessel has no other VERIFIED policy covering the clock, set Vessel.active_policy_id = policy.id"
          - "increments InsurancePolicy.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /marina/insurance-policies/{id}/reject"
        actor: BillingClerk
        preconditions:
          - "policy.status == SUBMITTED"
        side_effects:
          - "policy.status = REJECTED"
          - "increments InsurancePolicy.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /marina/insurance-policies/{id}/expire (system/clerk sweep when clock >= effective_to)"
        actor: BillingClerk
        preconditions:
          - "policy.status == VERIFIED"
          - "logical clock >= policy.effective_to"
        side_effects:
          - "policy.status = EXPIRED"
          - "if this was the vessel's active_policy_id, set Vessel.active_policy_id = null"
          - "increments InsurancePolicy.version by 1"

  # ---- StorageAgreement: branching-with-revert (seasonal cycle + terminate) ----
  - entity: StorageAgreement
    initial_state: PENDING_COI
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_COI
        to: ACTIVE
        trigger: "POST /marina/storage-agreements/{id}/activate"
        actor: DockMaster
        preconditions:
          - "agreement.status == PENDING_COI"
          - "Vessel.active_policy_id is not null (a VERIFIED, in-window InsurancePolicy exists) — CROSS-ENTITY"
          - "Rack.status == AVAILABLE — CROSS-ENTITY"
          - "vessel.loa_ft <= rack.max_loa_ft AND vessel.beam_ft <= rack.max_beam_ft AND vessel.dry_weight_lbs <= rack.max_weight_lbs"
        side_effects:
          - "agreement.tier_size_class = rack.size_class (snapshot)"
          - "agreement.oversize_surcharge_applied / agreement.monthly_base_cents set via compute_monthly_storage"
          - "agreement.activated_at = logical clock"
          - "Rack.status = OCCUPIED ; Rack.current_agreement_id = agreement.id (CASCADE hop 1)"
          - "Vessel.location_status = RACKED ; Vessel.billing_status = ACTIVE_STORAGE (CASCADE hop 2, caused by rack becoming OCCUPIED)"
          - "increments StorageAgreement.version by 1"
      - from: ACTIVE
        to: WINTERIZED
        trigger: "POST /marina/storage-agreements/{id}/winterize"
        actor: DockMaster
        preconditions:
          - "agreement.status == ACTIVE"
          - "Vessel.location_status == RACKED (the vessel is in its rack) — CROSS-ENTITY"
        side_effects:
          - "agreement.status = WINTERIZED"
          - "Vessel.billing_status = WINTER_HOLD"
          - "increments StorageAgreement.version by 1"
      - from: WINTERIZED
        to: ACTIVE
        trigger: "POST /marina/storage-agreements/{id}/reactivate"
        actor: DockMaster
        preconditions:
          - "agreement.status == WINTERIZED"
          - "Vessel.active_policy_id is not null — CROSS-ENTITY"
        side_effects:
          - "agreement.status = ACTIVE"
          - "Vessel.billing_status = ACTIVE_STORAGE"
          - "increments StorageAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /marina/storage-agreements/{id}/terminate"
        actor: DockMaster
        preconditions:
          - "agreement.status == ACTIVE"
          - "Vessel.location_status != IN_WATER (no open launch in the water) — CROSS-ENTITY"
        side_effects:
          - "agreement.status = TERMINATED ; agreement.terminated_at = logical clock"
          - "Rack.status = AVAILABLE ; Rack.current_agreement_id = null (COMPENSATION: undo activation's rack occupation)"
          - "Vessel.location_status = OFF_SITE ; Vessel.billing_status = CLOSED"
          - "any WaitlistEntry with status == OFFERED holding this rack as offered_rack_id is unaffected; freed rack triggers waitlist promotion sweep eligibility"
          - "increments StorageAgreement.version by 1"
      - from: WINTERIZED
        to: TERMINATED
        trigger: "POST /marina/storage-agreements/{id}/terminate"
        actor: DockMaster
        preconditions:
          - "agreement.status == WINTERIZED"
        side_effects:
          - "agreement.status = TERMINATED ; agreement.terminated_at = logical clock"
          - "Rack.status = AVAILABLE ; Rack.current_agreement_id = null (COMPENSATION)"
          - "Vessel.location_status = OFF_SITE ; Vessel.billing_status = CLOSED"
          - "increments StorageAgreement.version by 1"

  # ---- LaunchRequest: CYCLIC (reschedule revert + haul-back return loop) ----
  - entity: LaunchRequest
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /marina/launch-requests/{id}/schedule"
        actor: DockMaster
        preconditions:
          - "launch.status == REQUESTED"
          - "Vessel.location_status == RACKED (vessel must be in its rack to launch) — CROSS-ENTITY"
          - "a ForkliftSlot can be booked at requested_window_start on some AVAILABLE Forklift whose max_lift_weight_lbs >= vessel.dry_weight_lbs without an overlapping busy interval"
        side_effects:
          - "create ForkliftSlot (status=BOOKED) on the selected forklift; set its launch_request_id"
          - "launch.forklift_slot_id = new slot id ; launch.launch_fee_cents set via compute_launch_fee"
          - "launch.status = SCHEDULED"
          - "increments LaunchRequest.version by 1"
      - from: SCHEDULED
        to: REQUESTED
        trigger: "POST /marina/launch-requests/{id}/unschedule"
        actor: DockMaster
        preconditions:
          - "launch.status == SCHEDULED"
        side_effects:
          - "the booked ForkliftSlot.status = RELEASED ; ForkliftSlot.launch_request_id = null (frees the slot interval) — CASCADE hop 1"
          - "launch.forklift_slot_id = null ; launch.status = REQUESTED (cyclic revert)"
          - "increments LaunchRequest.version by 1"
      - from: SCHEDULED
        to: SPLASHED
        trigger: "POST /marina/launch-requests/{id}/splash"
        actor: DockMaster
        preconditions:
          - "launch.status == SCHEDULED"
          - "logical clock >= booked ForkliftSlot.window_start — CROSS-ENTITY"
        side_effects:
          - "booked ForkliftSlot.status = COMPLETED — CASCADE hop 1"
          - "Vessel.location_status = IN_WATER (CASCADE hop 2, caused by the slot completing); the Rack stays OCCUPIED (the agreement still holds it) — the vessel is merely absent"
          - "increments LaunchRequest.version by 1"
      - from: SPLASHED
        to: RACKED
        trigger: "POST /marina/launch-requests/{id}/haul-back"
        actor: DockMaster
        preconditions:
          - "launch.status == SPLASHED"
        side_effects:
          - "Vessel.location_status = RACKED (return loop)"
          - "launch.status = RACKED"
          - "increments LaunchRequest.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /marina/launch-requests/{id}/cancel"
        actor: BoatOwner
        preconditions:
          - "launch.status == REQUESTED"
        side_effects:
          - "launch.status = CANCELLED"
          - "increments LaunchRequest.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /marina/launch-requests/{id}/cancel"
        actor: BoatOwner
        preconditions:
          - "launch.status == SCHEDULED"
        side_effects:
          - "the booked ForkliftSlot.status = RELEASED ; ForkliftSlot.launch_request_id = null (COMPENSATION: undo schedule's slot booking) — CASCADE hop 1"
          - "launch.forklift_slot_id = null ; launch.launch_fee_cents = 0 ; launch.status = CANCELLED"
          - "increments LaunchRequest.version by 1"

  # ---- WaitlistEntry: branching with offer/expiry ----
  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [PLACED, EXPIRED, WITHDRAWN]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /marina/waitlist/promote (DockMaster sweep selects highest-priority WAITING entry for a freed AVAILABLE rack)"
        actor: DockMaster
        preconditions:
          - "entry.status == WAITING"
          - "an AVAILABLE Rack with size_class == entry.requested_size_class exists — CROSS-ENTITY"
          - "this entry is the selected winner per compute_waitlist_priority over all WAITING entries with the same requested_size_class"
        side_effects:
          - "entry.status = OFFERED"
          - "entry.offered_rack_id = selected rack id ; selected Rack.status = OCCUPIED (held, current_agreement_id stays null) — CASCADE hop 1"
          - "entry.offer_expires_at = logical clock + OFFER_TTL_HOURS hours"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: PLACED
        trigger: "POST /marina/waitlist/{id}/accept"
        actor: BoatOwner
        preconditions:
          - "entry.status == OFFERED"
          - "logical clock < entry.offer_expires_at"
          - "Vessel.active_policy_id is not null — CROSS-ENTITY"
        side_effects:
          - "create a StorageAgreement (PENDING_COI) binding entry.vessel_id to entry.offered_rack_id — CASCADE hop 1"
          - "entry.status = PLACED"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /marina/waitlist/{id}/lapse (clerk/system sweep when clock >= offer_expires_at)"
        actor: BillingClerk
        preconditions:
          - "entry.status == OFFERED"
          - "logical clock >= entry.offer_expires_at"
        side_effects:
          - "entry.status = EXPIRED"
          - "offered Rack.status = AVAILABLE (COMPENSATION: release the held rack) ; entry.offered_rack_id = null — CASCADE hop 1"
          - "increments WaitlistEntry.version by 1"
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /marina/waitlist/{id}/withdraw"
        actor: BoatOwner
        preconditions:
          - "entry.status == WAITING"
        side_effects:
          - "entry.status = WITHDRAWN"
          - "increments WaitlistEntry.version by 1"

  # ---- ServiceOrder: linear with cancel ----
  - entity: ServiceOrder
    initial_state: ORDERED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: ORDERED
        to: FULFILLED
        trigger: "POST /marina/service-orders/{id}/fulfill"
        actor: DockMaster
        preconditions:
          - "order.status == ORDERED"
        side_effects:
          - "order.status = FULFILLED"
          - "increments ServiceOrder.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /marina/service-orders/{id}/cancel"
        actor: BoatOwner
        preconditions:
          - "order.status == ORDERED"
        side_effects:
          - "order.status = CANCELLED"
          - "increments ServiceOrder.version by 1"

  # ---- StorageInvoice: linear settlement ----
  - entity: StorageInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /marina/invoices/{id}/pay"
        actor: BoatOwner
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "invoice.status = PAID"
          - "if owner had only this invoice outstanding and Vessel.billing_status == DELINQUENT, set Vessel.billing_status = ACTIVE_STORAGE — CROSS-ENTITY"
          - "increments StorageInvoice.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /marina/invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "invoice.status = VOIDED"
          - "increments StorageInvoice.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: waitlist-accept-stale-rack
    parent_entity: Rack
    write_endpoint: "POST /marina/waitlist/{id}/accept"
    occ_field: "expected_rack_version"
    description: |
      Accepting an OFFERED waitlist entry binds a new StorageAgreement to the
      offered Rack. If that Rack's version has advanced since the client last
      observed it — because another waitlist promotion sweep re-held it, or a
      lapse released and re-offered it — the accept is rejected as stale. The
      offered rack is a legitimately reusable slot, so a second sequential
      accept on a re-held rack would otherwise succeed against an outdated view.
    error_id: ERR_STALE_RACK_VERSION
    http_status: 412

  - rule_id: agreement-activate-stale-rack
    parent_entity: Rack
    write_endpoint: "POST /marina/storage-agreements/{id}/activate"
    occ_field: "expected_rack_version"
    description: |
      Activating a PENDING_COI StorageAgreement occupies its Rack. If the Rack's
      version has advanced since the client last observed it — because a waitlist
      promotion sweep just held it for a different vessel — the activation is
      rejected as stale. The rack may legitimately have been claimed by the
      promotion path, so the activation works from an outdated rack view.
    error_id: ERR_STALE_RACK_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: compute_monthly_storage
    trigger: "On StorageAgreement PENDING_COI -> ACTIVE (activation); pins monthly_base_cents and oversize_surcharge_applied"
    algorithm: tiered_pricing
    formula: |
      base = TIER_BASE_CENTS[agreement.tier_size_class]   # snapshot of rack.size_class
      oversize = (rack.max_loa_ft - vessel.loa_ft) <= OVERSIZE_BAND_FT      # within band => surcharge
      # PIN evaluation order: oversize surcharge is applied to the BASE first,
      # producing monthly_base_cents; the seasonal multiplier (compute_seasonal_factor)
      # is applied later at invoice time, NOT folded into monthly_base_cents.
      if oversize:
          monthly_base_cents = round_half_up(base * (1 + OVERSIZE_SURCHARGE_PCT))
          oversize_surcharge_applied = true
      else:
          monthly_base_cents = base
          oversize_surcharge_applied = false
    input_set: "Single StorageAgreement at activation; reads its snapshot tier_size_class plus the bound Vessel.loa_ft and Rack.max_loa_ft."
    constants:
      TIER_BASE_CENTS: { SMALL: 20000, MEDIUM: 35000, LARGE: 52500 }
      OVERSIZE_BAND_FT: 0.5
      OVERSIZE_SURCHARGE_PCT: 0.15
    precision: "integer cents, round_half_up"
    variants: []

  - name: compute_seasonal_factor
    trigger: "On STORAGE_AGREEMENT-source StorageInvoice creation; multiplies monthly_base_cents into the period amount"
    algorithm: threshold
    formula: |
      # Season is determined by the MONTH of period_start (UTC).
      # PEAK months are May(5) through Sep(9) inclusive; OFF otherwise.
      m = month_of(period_start)
      factor = PEAK_MULTIPLIER if (PEAK_START_MONTH <= m <= PEAK_END_MONTH) else OFF_MULTIPLIER
      seasonal_monthly_cents = round_half_up(monthly_base_cents * factor)
    input_set: "Single invoice; reads source StorageAgreement.monthly_base_cents and the invoice period_start month."
    constants:
      PEAK_START_MONTH: 5
      PEAK_END_MONTH: 9
      PEAK_MULTIPLIER: 1.20
      OFF_MULTIPLIER: 1.00
    precision: "integer cents, round_half_up"
    variants: []

  - name: compute_invoice_amount
    trigger: "On POST /marina/invoices (StorageInvoice creation)"
    algorithm: forward_looking
    formula: |
      if source_kind == STORAGE_AGREEMENT:
          seasonal_monthly = compute_seasonal_factor(agreement.monthly_base_cents, period_start)
          if variant == PROVISIONAL:
              # forward-looking: assume the vessel stays the WHOLE month; bill full seasonal monthly.
              amount_cents = seasonal_monthly
          else:  # FINAL — chronological proration over actual occupancy days
              days_in_month = days_in_month_of(period_start)
              billable_days = day_count_inclusive(period_start, period_end)   # [period_start, period_end) day span
              amount_cents = round_half_up(seasonal_monthly * billable_days / days_in_month)
      elif source_kind == LAUNCH_REQUEST:
          amount_cents = launch.launch_fee_cents
      elif source_kind == SERVICE_ORDER:
          amount_cents = service_order.total_cents
    input_set: "Single invoice plus its polymorphic source row (StorageAgreement | LaunchRequest | ServiceOrder)."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "variant == PROVISIONAL on a STORAGE_AGREEMENT source (forward-looking, issued at period open)"
        difference: "Bills the full seasonal monthly amount assuming whole-month occupancy; ignores period_end."
      - name: final
        when: "variant == FINAL on a STORAGE_AGREEMENT source (chronological, issued at period close)"
        difference: "Prorates the seasonal monthly amount by actual occupancy days / days_in_month; PROVISIONAL minus FINAL is the proration credit delta."

  - name: compute_launch_fee
    trigger: "On LaunchRequest REQUESTED -> SCHEDULED (schedule)"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial: base + per-foot of rounded-up LOA + optional valet splash,
      # with a non-linear weight surcharge branch.
      per_foot_component = LAUNCH_PER_FOOT_CENTS * ceil(vessel.loa_ft)
      weight_surcharge = LAUNCH_HEAVY_SURCHARGE_CENTS if vessel.dry_weight_lbs > HEAVY_WEIGHT_LBS else 0
      splash = SPLASH_FEE_CENTS if launch.with_valet_splash else 0
      launch_fee_cents = LAUNCH_BASE_CENTS + per_foot_component + weight_surcharge + splash
    input_set: "Single LaunchRequest plus its bound Vessel (loa_ft, dry_weight_lbs)."
    constants:
      LAUNCH_BASE_CENTS: 4500
      LAUNCH_PER_FOOT_CENTS: 250
      LAUNCH_HEAVY_SURCHARGE_CENTS: 3000
      HEAVY_WEIGHT_LBS: 8000
      SPLASH_FEE_CENTS: 6000
    precision: "integer cents (no fractional cents; ceil is on feet)"
    variants: []

  - name: compute_service_total
    trigger: "On POST /marina/service-orders (ServiceOrder creation)"
    algorithm: aggregation
    formula: |
      # PIN ROUNDING ORDER: round EACH line item to whole cents, THEN sum.
      # (round-per-line-then-sum, NOT sum-then-round — they differ by up to a cent.)
      if service_kind == FUEL:
          fuel_line_cents = round_half_up(fuel_gallons * fuel_price_cents_per_gal)  # per-line round
          total_cents = fuel_line_cents
      elif service_kind == VALET_SPLASH:
          total_cents = SPLASH_FEE_CENTS
      elif service_kind == WINTERIZATION:
          total_cents = WINTERIZATION_FEE_CENTS
      elif service_kind == HAUL_OUT:
          total_cents = HAUL_OUT_FEE_CENTS
    input_set: "Single ServiceOrder; reads service_kind and (for FUEL) fuel_gallons, fuel_price_cents_per_gal."
    constants:
      SPLASH_FEE_CENTS: 6000
      WINTERIZATION_FEE_CENTS: 25000
      HAUL_OUT_FEE_CENTS: 18000
    precision: "integer cents, round_half_up per line then sum"
    variants: []

  - name: compute_waitlist_priority
    trigger: "On GET /marina/waitlist read and on POST /marina/waitlist/promote sweep; ranks WAITING entries"
    algorithm: weighted_scoring
    formula: |
      days_waiting = floor((logical_clock - entry.joined_at) / 86400 seconds)
      priority_score = (DEPOSIT_WEIGHT if entry.deposit_paid else 0) + days_waiting
      # Selection for promotion: among WAITING entries with the same requested_size_class,
      # pick MAX priority_score; tie-break by joined_at ASC (earliest first); final
      # tie-break by created_at ASC. id is NEVER used in the decision.
    input_set: "All WaitlistEntry rows with status == WAITING and requested_size_class == target class."
    constants:
      DEPOSIT_WEIGHT: 100000
    precision: "integer score; days floored"
    variants:
      - name: read_basis
        when: "GET /marina/waitlist/{id} or GET /marina/waitlist — days_waiting measured against the logical clock AT READ TIME"
        difference: "priority_score reflects waiting time as of the read instant; a later read yields a higher score for the same entry."
      - name: promotion_basis
        when: "POST /marina/waitlist/promote — days_waiting measured against the logical clock AT THE PROMOTION SWEEP INSTANT, and the score is frozen into the selection decision"
        difference: "The selection ranking uses the clock at sweep time; two sweeps at different clock positions can rank the same two entries differently when one crosses a whole-day boundary the other has not. Same entity fields, two clock bases -> different ranking outcomes."

  - name: compute_account_balance
    trigger: "On GET /marina/owners/{id} and on invoice pay/void/issue side effects"
    algorithm: aggregation
    formula: |
      # Sum of all ISSUED invoices for this owner. PAID and VOIDED invoices are excluded.
      account_balance_cents = sum(inv.amount_cents
                                   for inv in StorageInvoice
                                   if inv.owner_id == owner.id and inv.status == ISSUED)
      # Delinquency threshold drives Vessel.billing_status flips (see validation/state).
    input_set: "All StorageInvoice rows for the owner with status == ISSUED (PAID/VOIDED excluded)."
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 50000
    precision: "integer cents"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires headers"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed BoatOwner acting on a Vessel/LaunchRequest/ServiceOrder/Invoice it must own (X-User-ID == resource owner_id chain), else forbidden"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "BoatOwner-owned resource mutations"

  - priority: 4
    category: existence
    check: "Every path/body-referenced resource id resolves to an existing row, validated left-to-right (Marina, then Vessel/Rack/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with id references"

  - priority: 5
    category: existence
    check: "Polymorphic StorageInvoice.source_id resolves to an existing row of the type named by source_kind"
    error_id: ERR_SOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /marina/invoices"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_rack_version matches current Rack.version on rack-occupying writes"
    error_id: ERR_STALE_RACK_VERSION
    http_status: 412
    applies_to: "POST /marina/waitlist/{id}/accept, POST /marina/storage-agreements/{id}/activate"

  - priority: 8
    category: business_safety
    check: "Activation/reactivation requires the Vessel to have a non-null active_policy_id (VERIFIED, in-window InsurancePolicy). COI gate — CROSS-ENTITY (Vessel depends on InsurancePolicy)."
    error_id: ERR_COI_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /marina/storage-agreements/{id}/activate, POST /marina/storage-agreements/{id}/reactivate, POST /marina/waitlist/{id}/accept"

  - priority: 9
    category: business_safety
    check: "Forklift selected for a launch must have max_lift_weight_lbs >= vessel.dry_weight_lbs (lift-capacity safety)"
    error_id: ERR_FORKLIFT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /marina/launch-requests/{id}/schedule"

  - priority: 10
    category: business_constraint
    check: "Vessel must physically fit the rack: vessel.loa_ft <= rack.max_loa_ft AND vessel.beam_ft <= rack.max_beam_ft AND vessel.dry_weight_lbs <= rack.max_weight_lbs"
    error_id: ERR_VESSEL_DIMENSIONS_EXCEED_RACK
    http_status: 422
    applies_to: "POST /marina/storage-agreements (create), POST /marina/storage-agreements/{id}/activate"

  - priority: 11
    category: business_constraint
    check: "Rack must be AVAILABLE to activate an agreement onto it (CROSS-ENTITY: StorageAgreement transition depends on Rack.status)"
    error_id: ERR_RACK_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /marina/storage-agreements/{id}/activate, POST /marina/waitlist/promote"

  - priority: 12
    category: business_temporal
    check: "Forklift slot busy interval [window_start, window_start + service_min + buffer_min) must not overlap any non-RELEASED slot on the same forklift. Adjacency at busy_until is allowed (half-open)."
    error_id: ERR_FORKLIFT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /marina/launch-requests/{id}/schedule"

  - priority: 13
    category: business_temporal
    check: "Rack occupancy intervals [activated_at, terminated_at) for a rack must not overlap; adjacency (one starts exactly when another ended) is allowed (half-open, no buffer)."
    error_id: ERR_RACK_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /marina/storage-agreements/{id}/activate"

  - priority: 14
    category: business_temporal
    check: "Splash may only occur once logical clock >= booked ForkliftSlot.window_start"
    error_id: ERR_SLOT_NOT_YET_OPEN
    http_status: 409
    applies_to: "POST /marina/launch-requests/{id}/splash"

  - priority: 15
    category: business_temporal
    check: "Waitlist accept rejected when logical clock >= offer_expires_at (offer lapsed)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /marina/waitlist/{id}/accept"

  - priority: 16
    category: business_referential
    check: "Bay label uniqueness: a Rack's bay_label must be unique among racks of the same marina_id"
    error_id: ERR_DUPLICATE_BAY_LABEL
    http_status: 409
    applies_to: "POST /marina/racks"

  - priority: 17
    category: business_referential
    check: "A Vessel may hold at most one StorageAgreement in status ACTIVE or WINTERIZED at a time"
    error_id: ERR_VESSEL_ALREADY_STORED
    http_status: 409
    applies_to: "POST /marina/storage-agreements/{id}/activate, POST /marina/waitlist/{id}/accept"

  - priority: 18
    category: business_fiscal
    check: "Invoice period_end must be strictly after period_start for STORAGE_AGREEMENT FINAL invoices; missing period for storage invoices is rejected"
    error_id: ERR_INVALID_PERIOD
    http_status: 422
    applies_to: "POST /marina/invoices"

  - priority: 19
    category: business_fiscal
    check: "Cannot void or pay an invoice that is not ISSUED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /marina/invoices/{id}/pay, POST /marina/invoices/{id}/void"

  - priority: 20
    category: business_constraint
    check: "Pagination params within bounds: limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 21
    category: business_constraint
    check: "Required body fields present and well-typed; enum values within declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Default startup value is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [DockMaster, BillingClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  # ---- Marina ----
  - method: POST
    path: "/marina/marinas"
    description: "Create a marina."
    roles: [DockMaster]
    code: 201
    input: ["name", "timezone?", "forklift_service_minutes?", "forklift_buffer_minutes?"]
    output: Marina
    side_effects: []
  - method: GET
    path: "/marina/marinas/{id}"
    description: "Fetch a marina."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: Marina
    side_effects: []
  - method: GET
    path: "/marina/marinas"
    description: "List marinas."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: Marina[]
    side_effects: []

  # ---- Forklift ----
  - method: POST
    path: "/marina/forklifts"
    description: "Create a forklift for a marina."
    roles: [DockMaster]
    code: 201
    input: [marina_id, label, max_lift_weight_lbs]
    output: Forklift
    side_effects: []
  - method: GET
    path: "/marina/forklifts/{id}"
    description: "Fetch a forklift."
    roles: [DockMaster, BillingClerk]
    code: 200
    input: []
    output: Forklift
    side_effects: []
  - method: GET
    path: "/marina/forklifts"
    description: "List forklifts; filter by marina_id."
    roles: [DockMaster, BillingClerk]
    code: 200
    input: ["marina_id?", "limit?", "offset?"]
    output: Forklift[]
    side_effects: []

  # ---- Rack ----
  - method: POST
    path: "/marina/racks"
    description: "Create a rack bay."
    roles: [DockMaster]
    code: 201
    input: [marina_id, bay_label, size_class, max_loa_ft, max_beam_ft, max_weight_lbs]
    output: Rack
    side_effects: ["validates bay_label uniqueness among racks of marina_id"]
  - method: GET
    path: "/marina/racks/{id}"
    description: "Fetch a rack (includes version for OCC)."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: Rack
    side_effects: []
  - method: GET
    path: "/marina/racks"
    description: "List racks; filter by marina_id, size_class, status, current_agreement_id."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["marina_id?", "size_class?", "status?", "current_agreement_id?", "limit?", "offset?"]
    output: Rack[]
    side_effects: []

  # ---- BoatOwnerAccount ----
  - method: POST
    path: "/marina/owners"
    description: "Create a boat owner account."
    roles: [DockMaster, BillingClerk]
    code: 201
    input: [marina_id, full_name, email]
    output: BoatOwnerAccount
    side_effects: []
  - method: GET
    path: "/marina/owners/{id}"
    description: "Fetch a boat owner account including computed account_balance_cents."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: BoatOwnerAccount
    side_effects: ["recompute account_balance_cents"]
  - method: GET
    path: "/marina/owners"
    description: "List owner accounts; filter by marina_id."
    roles: [DockMaster, BillingClerk]
    code: 200
    input: ["marina_id?", "limit?", "offset?"]
    output: BoatOwnerAccount[]
    side_effects: []

  # ---- Vessel ----
  - method: POST
    path: "/marina/vessels"
    description: "Register a vessel under an owner."
    roles: [DockMaster, BoatOwner]
    code: 201
    input: [marina_id, owner_id, name, loa_ft, beam_ft, dry_weight_lbs]
    output: Vessel
    side_effects: ["location_status=OFF_SITE, billing_status=UNBILLED"]
  - method: GET
    path: "/marina/vessels/{id}"
    description: "Fetch a vessel (both parallel state dimensions + active_policy_id)."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: Vessel
    side_effects: []
  - method: GET
    path: "/marina/vessels"
    description: "List vessels; filter by marina_id, owner_id, location_status, billing_status, active_policy_id."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["marina_id?", "owner_id?", "location_status?", "billing_status?", "active_policy_id?", "limit?", "offset?"]
    output: Vessel[]
    side_effects: []

  # ---- InsurancePolicy ----
  - method: POST
    path: "/marina/insurance-policies"
    description: "Submit a COI / insurance policy for a vessel."
    roles: [BillingClerk, BoatOwner]
    code: 201
    input: [vessel_id, carrier_name, liability_limit_cents, effective_from, effective_to]
    output: InsurancePolicy
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/marina/insurance-policies/{id}"
    description: "Fetch an insurance policy."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/marina/insurance-policies"
    description: "List insurance policies; filter by vessel_id, status."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["vessel_id?", "status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: POST
    path: "/marina/insurance-policies/{id}/verify"
    description: "Verify a submitted COI."
    roles: [BillingClerk]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status->VERIFIED", "may set Vessel.active_policy_id", "bumps version"]
  - method: POST
    path: "/marina/insurance-policies/{id}/reject"
    description: "Reject a submitted COI."
    roles: [BillingClerk]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status->REJECTED", "bumps version"]
  - method: POST
    path: "/marina/insurance-policies/{id}/expire"
    description: "Expire a verified COI once the clock passes effective_to."
    roles: [BillingClerk]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status->EXPIRED", "may clear Vessel.active_policy_id", "bumps version"]

  # ---- StorageAgreement ----
  - method: POST
    path: "/marina/storage-agreements"
    description: "Create a PENDING_COI storage agreement binding a vessel to a rack."
    roles: [DockMaster]
    code: 201
    input: [vessel_id, rack_id]
    output: StorageAgreement
    side_effects: ["status=PENDING_COI", "validates vessel fits rack dimensions"]
  - method: GET
    path: "/marina/storage-agreements/{id}"
    description: "Fetch a storage agreement."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: []
  - method: GET
    path: "/marina/storage-agreements"
    description: "List storage agreements; filter by vessel_id, rack_id, status."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["vessel_id?", "rack_id?", "status?", "limit?", "offset?"]
    output: StorageAgreement[]
    side_effects: []
  - method: POST
    path: "/marina/storage-agreements/{id}/activate"
    description: "Activate a PENDING_COI agreement; occupies the rack. Requires OCC on rack version."
    roles: [DockMaster]
    code: 200
    input: [expected_rack_version]
    output: StorageAgreement
    side_effects: ["status->ACTIVE", "compute_monthly_storage", "Rack OCCUPIED (CASCADE)", "Vessel RACKED+ACTIVE_STORAGE (CASCADE)", "increments Rack.version by 1", "bumps StorageAgreement.version"]
  - method: POST
    path: "/marina/storage-agreements/{id}/winterize"
    description: "Winterize an active agreement (seasonal hold)."
    roles: [DockMaster]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["status->WINTERIZED", "Vessel.billing_status=WINTER_HOLD", "bumps version"]
  - method: POST
    path: "/marina/storage-agreements/{id}/reactivate"
    description: "Reactivate a winterized agreement."
    roles: [DockMaster]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["status->ACTIVE", "Vessel.billing_status=ACTIVE_STORAGE", "bumps version"]
  - method: POST
    path: "/marina/storage-agreements/{id}/terminate"
    description: "Terminate an agreement; releases the rack (compensation)."
    roles: [DockMaster]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: ["status->TERMINATED", "Rack AVAILABLE (COMPENSATION)", "increments Rack.version by 1", "Vessel OFF_SITE+CLOSED", "bumps StorageAgreement.version"]

  # ---- WaitlistEntry ----
  - method: POST
    path: "/marina/waitlist"
    description: "Join the waitlist for a rack size class."
    roles: [DockMaster, BoatOwner]
    code: 201
    input: ["vessel_id", "requested_size_class", "deposit_paid?"]
    output: WaitlistEntry
    side_effects: ["status=WAITING", "joined_at=clock"]
  - method: GET
    path: "/marina/waitlist/{id}"
    description: "Fetch a waitlist entry including computed priority_score."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["recompute priority_score"]
  - method: GET
    path: "/marina/waitlist"
    description: "List waitlist entries; filter by vessel_id, requested_size_class, status, offered_rack_id; ordered by priority_score desc then joined_at asc."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["vessel_id?", "requested_size_class?", "status?", "offered_rack_id?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: ["recompute priority_score for each"]
  - method: POST
    path: "/marina/waitlist/promote"
    description: "Promotion sweep: for a given size class with an AVAILABLE rack, select the highest-priority WAITING entry and OFFER it the rack."
    roles: [DockMaster]
    code: 200
    input: [marina_id, requested_size_class]
    output: WaitlistEntry
    side_effects: ["winner WAITING->OFFERED", "selected Rack OCCUPIED held (CASCADE)", "increments Rack.version by 1", "offer_expires_at set", "bumps WaitlistEntry.version"]
  - method: POST
    path: "/marina/waitlist/{id}/accept"
    description: "Accept an offered rack; creates a PENDING_COI agreement. Requires OCC on rack version."
    roles: [BoatOwner]
    code: 200
    input: [expected_rack_version]
    output: WaitlistEntry
    side_effects: ["status->PLACED", "create StorageAgreement PENDING_COI (CASCADE)", "bumps WaitlistEntry.version"]
  - method: POST
    path: "/marina/waitlist/{id}/lapse"
    description: "Lapse an expired offer; releases the held rack (compensation)."
    roles: [BillingClerk]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status->EXPIRED", "offered Rack AVAILABLE (COMPENSATION)", "increments Rack.version by 1", "bumps WaitlistEntry.version"]
  - method: POST
    path: "/marina/waitlist/{id}/withdraw"
    description: "Withdraw a waiting entry."
    roles: [BoatOwner]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status->WITHDRAWN", "bumps version"]

  # ---- LaunchRequest ----
  - method: POST
    path: "/marina/launch-requests"
    description: "Create a launch request for a racked vessel."
    roles: [DockMaster, BoatOwner]
    code: 201
    input: ["vessel_id", "requested_window_start", "with_valet_splash?"]
    output: LaunchRequest
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/marina/launch-requests/{id}"
    description: "Fetch a launch request."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: LaunchRequest
    side_effects: []
  - method: GET
    path: "/marina/launch-requests"
    description: "List launch requests; filter by vessel_id, forklift_slot_id, status."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["vessel_id?", "forklift_slot_id?", "status?", "limit?", "offset?"]
    output: LaunchRequest[]
    side_effects: []
  - method: POST
    path: "/marina/launch-requests/{id}/schedule"
    description: "Schedule a launch: books a forklift slot and computes the launch fee."
    roles: [DockMaster]
    code: 200
    input: []
    output: LaunchRequest
    side_effects: ["create ForkliftSlot", "compute_launch_fee", "status->SCHEDULED", "bumps version"]
  - method: POST
    path: "/marina/launch-requests/{id}/unschedule"
    description: "Unschedule (cyclic revert to REQUESTED); releases the booked slot."
    roles: [DockMaster]
    code: 200
    input: []
    output: LaunchRequest
    side_effects: ["ForkliftSlot RELEASED (CASCADE)", "status->REQUESTED", "bumps version"]
  - method: POST
    path: "/marina/launch-requests/{id}/splash"
    description: "Splash the vessel (slot opens); marks slot COMPLETED."
    roles: [DockMaster]
    code: 200
    input: []
    output: LaunchRequest
    side_effects: ["ForkliftSlot COMPLETED (CASCADE)", "Vessel IN_WATER (CASCADE)", "status->SPLASHED", "bumps version"]
  - method: POST
    path: "/marina/launch-requests/{id}/haul-back"
    description: "Haul the vessel back to its rack (cyclic return loop)."
    roles: [DockMaster]
    code: 200
    input: []
    output: LaunchRequest
    side_effects: ["Vessel RACKED", "status->RACKED", "bumps version"]
  - method: POST
    path: "/marina/launch-requests/{id}/cancel"
    description: "Cancel a launch request; releases any booked slot (compensation)."
    roles: [BoatOwner]
    code: 200
    input: []
    output: LaunchRequest
    side_effects: ["ForkliftSlot RELEASED if booked (COMPENSATION)", "launch_fee_cents=0", "status->CANCELLED", "bumps version"]

  # ---- ForkliftSlot (reverse-reachability + reads) ----
  - method: GET
    path: "/marina/forklift-slots/{id}"
    description: "Fetch a forklift slot (window_start, window_end, busy_until, status)."
    roles: [DockMaster, BillingClerk]
    code: 200
    input: []
    output: ForkliftSlot
    side_effects: []
  - method: GET
    path: "/marina/forklift-slots"
    description: "List forklift slots; filter by forklift_id, launch_request_id, status."
    roles: [DockMaster, BillingClerk]
    code: 200
    input: ["forklift_id?", "launch_request_id?", "status?", "limit?", "offset?"]
    output: ForkliftSlot[]
    side_effects: []

  # ---- ServiceOrder ----
  - method: POST
    path: "/marina/service-orders"
    description: "Order a fuel/valet/winterization/haul service for a vessel; computes total."
    roles: [DockMaster, BoatOwner]
    code: 201
    input: ["vessel_id", "service_kind", "fuel_gallons?", "fuel_price_cents_per_gal?"]
    output: ServiceOrder
    side_effects: ["compute_service_total", "status=ORDERED"]
  - method: GET
    path: "/marina/service-orders/{id}"
    description: "Fetch a service order."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []
  - method: GET
    path: "/marina/service-orders"
    description: "List service orders; filter by vessel_id, service_kind, status."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["vessel_id?", "service_kind?", "status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []
  - method: POST
    path: "/marina/service-orders/{id}/fulfill"
    description: "Mark a service order fulfilled."
    roles: [DockMaster]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status->FULFILLED", "bumps version"]
  - method: POST
    path: "/marina/service-orders/{id}/cancel"
    description: "Cancel a service order."
    roles: [BoatOwner]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status->CANCELLED", "bumps version"]

  # ---- StorageInvoice ----
  - method: POST
    path: "/marina/invoices"
    description: "Issue an invoice against a polymorphic source (storage agreement / launch / service). Computes amount per variant."
    roles: [BillingClerk]
    code: 201
    input: ["owner_id", "source_kind", "source_id", "variant?", "period_start?", "period_end?"]
    output: StorageInvoice
    side_effects: ["compute_invoice_amount", "status=ISSUED", "may flip Vessel.billing_status to DELINQUENT if owner balance crosses threshold"]
  - method: GET
    path: "/marina/invoices/{id}"
    description: "Fetch an invoice."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: []
    output: StorageInvoice
    side_effects: []
  - method: GET
    path: "/marina/invoices"
    description: "List invoices; filter by owner_id, source_kind, source_id, status."
    roles: [DockMaster, BillingClerk, BoatOwner]
    code: 200
    input: ["owner_id?", "source_kind?", "source_id?", "status?", "limit?", "offset?"]
    output: StorageInvoice[]
    side_effects: []
  - method: POST
    path: "/marina/invoices/{id}/pay"
    description: "Pay an issued invoice."
    roles: [BoatOwner]
    code: 200
    input: []
    output: StorageInvoice
    side_effects: ["status->PAID", "recompute owner balance", "may clear Vessel DELINQUENT (CROSS-ENTITY)", "bumps version"]
  - method: POST
    path: "/marina/invoices/{id}/void"
    description: "Void an issued invoice."
    roles: [BillingClerk]
    code: 200
    input: []
    output: StorageInvoice
    side_effects: ["status->VOIDED", "recompute owner balance", "bumps version"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unrecognized X-User-Role or missing X-User-ID header."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation per RBAC."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "BoatOwner acting on a resource it does not own (X-User-ID mismatch with owner chain)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not resolve to an existing row."
  - id: ERR_SOURCE_NOT_FOUND
    http: 404
    condition: "Polymorphic invoice source_id does not resolve to a row of the declared source_kind."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state (incl. invoice pay/void on non-ISSUED)."
  - id: ERR_STALE_RACK_VERSION
    http: 412
    condition: "expected_rack_version does not match current Rack.version on a rack-occupying write (OCC)."
  - id: ERR_COI_NOT_VERIFIED
    http: 422
    condition: "Operation requires the vessel to have a non-null active_policy_id (VERIFIED in-window COI) and it does not."
  - id: ERR_FORKLIFT_CAPACITY_EXCEEDED
    http: 422
    condition: "No AVAILABLE forklift with max_lift_weight_lbs >= vessel.dry_weight_lbs exists for the launch."
  - id: ERR_VESSEL_DIMENSIONS_EXCEED_RACK
    http: 422
    condition: "Vessel loa_ft/beam_ft/dry_weight_lbs exceeds the rack's max in any dimension."
  - id: ERR_RACK_NOT_AVAILABLE
    http: 409
    condition: "Target rack is not AVAILABLE (it is OCCUPIED) for activation or promotion."
  - id: ERR_FORKLIFT_SLOT_CONFLICT
    http: 409
    condition: "Requested forklift slot busy interval overlaps an existing non-RELEASED slot on every capacity-eligible forklift."
  - id: ERR_RACK_OCCUPANCY_CONFLICT
    http: 409
    condition: "Rack occupancy interval would overlap an existing occupancy interval on the same rack."
  - id: ERR_SLOT_NOT_YET_OPEN
    http: 409
    condition: "Splash attempted before logical clock reaches the booked slot's window_start."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Waitlist accept attempted at/after offer_expires_at."
  - id: ERR_DUPLICATE_BAY_LABEL
    http: 409
    condition: "Rack bay_label already used by another rack in the same marina."
  - id: ERR_VESSEL_ALREADY_STORED
    http: 409
    condition: "Vessel already has a StorageAgreement in ACTIVE or WINTERIZED status."
  - id: ERR_INVALID_PERIOD
    http: 422
    condition: "Storage invoice period_end not strictly after period_start, or period missing for a storage invoice."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit out of [1,100] or offset < 0."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, or out-of-set enum value."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DockMaster
    description: "Operates physical marina infrastructure: marinas, forklifts, racks, agreement lifecycle, launch scheduling, waitlist promotion."
    identity: "opaque"
    exclusive_operations:
      - "POST /marina/marinas"
      - "POST /marina/forklifts"
      - "POST /marina/racks"
      - "POST /marina/storage-agreements"
      - "POST /marina/storage-agreements/{id}/activate"
      - "POST /marina/storage-agreements/{id}/winterize"
      - "POST /marina/storage-agreements/{id}/reactivate"
      - "POST /marina/storage-agreements/{id}/terminate"
      - "POST /marina/launch-requests/{id}/schedule"
      - "POST /marina/launch-requests/{id}/unschedule"
      - "POST /marina/launch-requests/{id}/splash"
      - "POST /marina/launch-requests/{id}/haul-back"
      - "POST /marina/waitlist/promote"
      - "POST /marina/service-orders/{id}/fulfill"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /marina/owners"
      - "POST /marina/vessels"
      - "POST /marina/waitlist"
      - "POST /marina/launch-requests"
      - "POST /marina/service-orders"
      - "GET (most read endpoints)"

  - name: BoatOwner
    description: "Owns vessels and the requests/orders/invoices attached to them; accepts waitlist offers, pays invoices, launches/cancels their own boats."
    identity: "entity_backed:BoatOwnerAccount"
    exclusive_operations:
      - "POST /marina/waitlist/{id}/accept"
      - "POST /marina/waitlist/{id}/withdraw"
      - "POST /marina/launch-requests/{id}/cancel"
      - "POST /marina/service-orders/{id}/cancel"
      - "POST /marina/invoices/{id}/pay"
    shared_operations:
      - "POST /marina/vessels"
      - "POST /marina/insurance-policies"
      - "POST /marina/waitlist"
      - "POST /marina/launch-requests"
      - "POST /marina/service-orders"
      - "GET (own resources + public reads)"

  - name: BillingClerk
    description: "Owns COI verification, the waitlist offer-lapse/expiry sweeps, and invoice issuance/void."
    identity: "opaque"
    exclusive_operations:
      - "POST /marina/insurance-policies/{id}/verify"
      - "POST /marina/insurance-policies/{id}/reject"
      - "POST /marina/insurance-policies/{id}/expire"
      - "POST /marina/waitlist/{id}/lapse"
      - "POST /marina/invoices"
      - "POST /marina/invoices/{id}/void"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /marina/owners"
      - "POST /marina/insurance-policies"
      - "GET (most read endpoints)"
