      - name: referential_beats_fiscal_on_slot_booking
        grounds:
          - validations[priority=18]
          - validations[priority=33]
          - errors.ERR_ROUTE_MISMATCH
          - errors.ERR_MINIMUM_ORDER_NOT_MET
          - entities.CustomerAccount.fields.home_route_id
        distinguishing_aspect: |
          One booking call violates both the referential rule (the slot sits on route R2 while the
          customer's home_route_id is R1, priority 18) and the fiscal rule (merchandise_subtotal_cents
          500 < MINIMUM_ORDER_CENTS 1000, priority 33). The scaffold pins referential integrity
          ahead of fiscal capacity, so ERR_ROUTE_MISMATCH (409) must win over
          ERR_MINIMUM_ORDER_NOT_MET (422) — the opposite ordering is a common and detectable error.
        test_recipe:
          setup:
            - "Two routes R1 and R2; the customer's home_route_id is R1."
