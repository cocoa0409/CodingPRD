      - name: consummation_with_an_objected_filing_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AG_APPROVAL_MISSING
          - errors.ERR_INVALID_FILING_STATE
          - validations.priority_35_ERR_AG_APPROVAL_MISSING
          - validations.priority_20_ERR_INVALID_FILING_STATE
          - state_machines.AGFiling
