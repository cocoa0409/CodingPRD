            - call: "POST /aquatics/installs"
              payload: { contract_id: "${contract_id}", system_id: "${system_id}", labor_estimate_cents: 40000, equipment_estimate_cents: 120000 }
              as: AccountManager
              captures: { install_id: $.data.id }
          trigger:
            - call: "POST /aquatics/installs/${install_id}/approve"
              payload: {}
              as: CustomerOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "ServiceContract.${contract_id}.status == DRAFT"
            - "trigger response error_id == ERR_CONTRACT_NOT_ACTIVE"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_tech_double_book_half_open_no_adjacency
        grounds:
          - validations[priority=9]
          - entities.ServiceVisit.fields.scheduled_start
          - entities.ServiceVisit.fields.scheduled_end
        distinguishing_aspect: |
          ServiceVisit windows on a Technician use HALF-OPEN [start,end) semantics: a new visit
          starting exactly at a prior visit's end (10:00) does NOT conflict, but a new visit
          overlapping the interior DOES. Tested by booking [10:00,11:00) after [09:00,10:00)
          (allowed) and [09:30,10:30) (rejected).
        test_recipe:
          setup:
            - "ACTIVE contract; one tech; one ACTIVE system; an existing SCHEDULED visit [09:00,10:00) for the tech."
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "Tia" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Pi", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${system_id}/commission"
              payload: {}
              as: AccountManager
              captures: { v1: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-13T09:00:00Z", scheduled_end: "2026-02-13T10:00:00Z", expected_system_version: "${v1}" }
              as: Dispatcher
              captures: { v_after1: $.data.id }
            - call: "GET /aquatics/systems/${system_id}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-13T10:00:00Z", scheduled_end: "2026-02-13T11:00:00Z", expected_system_version: "${v2}" }
              as: Dispatcher
              captures: { adjacent_visit: $.data.id }
            - call: "GET /aquatics/systems/${system_id}"
              payload: {}
              as: Dispatcher
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /aquatics/visits"
              payload: { system_id: "${system_id}", technician_id: "${tech_id}", scheduled_start: "2026-02-13T09:30:00Z", scheduled_end: "2026-02-13T10:30:00Z", expected_system_version: "${v3}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent visit [10:00,11:00) was created (201) — half-open touch is NOT a conflict"
            - "trigger response error_id == ERR_TECH_DOUBLE_BOOKED — [09:30,10:30) overlaps interior of [09:00,10:00)"

      - name: quarantine_tank_closed_interval_adjacency_conflicts
        grounds:
          - validations[priority=10]
          - entities.QuarantineRecord.fields.window_start
          - entities.QuarantineRecord.fields.window_end
        distinguishing_aspect: |
          QuarantineRecord windows on a tank use CLOSED [start,end] semantics — the OPPOSITE
          interval geometry from visits: a new quarantine starting exactly at a prior one's end
          (shared endpoint) IS a conflict (ERR_QT_TANK_OCCUPIED), because a physical tank can't
          be handed over with zero gap. Different resource entity (SystemProfile-as-QT-tank) and
          different adjacency rule than the half-open visit overlap.
        test_recipe:
          setup:
            - "A FRESHWATER QT tank system; two source systems each with an ALIVE livestock; an ACTIVE quarantine on the QT tank for [day1,day3]."
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Rho", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "QT", system_kind: "FRESHWATER", nominal_volume_l: 80 }
              as: AccountManager
              captures: { qt_tank_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Home", system_kind: "FRESHWATER", nominal_volume_l: 300 }
              as: AccountManager
              captures: { home_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${qt_tank_id}/commission"
              payload: {}
              as: AccountManager
              captures: { qt_v: $.data.version }
            - call: "POST /aquatics/systems/${home_id}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${home_id}", common_name: "Guppy A", species_class: "COMMUNITY", adult_length_cm: 3 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { fish_a: $.data.id }
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${home_id}", common_name: "Guppy B", species_class: "COMMUNITY", adult_length_cm: 3 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { fish_b: $.data.id }
            - call: "POST /aquatics/quarantines"
              payload: { livestock_id: "${fish_a}", quarantine_tank_id: "${qt_tank_id}", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-03T00:00:00Z", expected_tank_version: "${qt_v}" }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { q1_id: $.data.id }
            - call: "GET /aquatics/systems/${qt_tank_id}"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
              captures: { qt_v2: $.data.version }
          trigger:
            - call: "POST /aquatics/quarantines"
              payload: { livestock_id: "${fish_b}", quarantine_tank_id: "${qt_tank_id}", window_start: "2026-03-03T00:00:00Z", window_end: "2026-03-05T00:00:00Z", expected_tank_version: "${qt_v2}" }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_QT_TANK_OCCUPIED — shared endpoint 2026-03-03 is a conflict under closed-interval semantics"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: install_approve_then_cancel_preserves_account_balance
        grounds:
          - state_machines.InstallProject.QUOTED_to_APPROVED
          - state_machines.InstallProject.APPROVED_to_CANCELLED
          - calculations.account_balance
          - entities.ServiceContract.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity = ServiceContract.account_balance_cents. Approving an install issues
          a 48000-cent deposit invoice (+48000); cancelling the APPROVED install voids that
          invoice (-48000). The forward action plus its compensation leave account_balance_cents
          exactly equal to its pre-approve value (0), with zero drift.
        test_recipe:
          setup:
            - "ACTIVE contract owned by owner-1 (account_balance 0); PROVISIONING system; a QUOTED install (estimates 40000+120000)."
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Sigma", customer_user_id: "owner-1", service_tier: "PLUS", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Build", system_kind: "FRESHWATER", nominal_volume_l: 400 }
              as: AccountManager
              captures: { system_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/installs"
              payload: { contract_id: "${contract_id}", system_id: "${system_id}", labor_estimate_cents: 40000, equipment_estimate_cents: 120000 }
              as: AccountManager
              captures: { install_id: $.data.id }
            - call: "POST /aquatics/installs/${install_id}/approve"
              payload: {}
              as: CustomerOwner
              as_user_id: "owner-1"
            - call: "GET /aquatics/contracts/${contract_id}"
              payload: {}
              as: AccountManager
              captures: { bal_after_approve: $.data.account_balance_cents }
          trigger:
            - call: "POST /aquatics/installs/${install_id}/cancel"
              payload: {}
              as: AccountManager
            - call: "GET /aquatics/contracts/${contract_id}"
              payload: {}
              as: AccountManager
              captures: { bal_after_cancel: $.data.account_balance_cents }
          assert:
            - "bal_after_approve == 48000 (deposit invoice issued)"
            - "ServiceContract.${contract_id}.account_balance_cents == 0 after cancel (deposit invoice voided, no drift)"

      - name: quarantine_abort_preserves_alive_livestock_count
        grounds:
          - state_machines.QuarantineRecord.ACTIVE_to_ABORTED
          - calculations.alive_livestock_count
          - entities.ServiceContract.fields.alive_livestock_count
        distinguishing_aspect: |
          Conserved quantity = ServiceContract.alive_livestock_count (a different conserved
          quantity than account_balance). Opening a quarantine moved the animal ALIVE->QUARANTINED
          (count already decremented by 1); aborting it moves QUARANTINED->DECEASED. Because the
          animal was already excluded while QUARANTINED, the abort leaves alive_livestock_count
          unchanged (no double-decrement, no resurrection).
        test_recipe:
          setup:
            - "ACTIVE contract; one home FRESHWATER system with two ALIVE livestock (count 2); a FRESHWATER QT tank; one animal moved into an ACTIVE quarantine (count drops to 1)."
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Tau", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "Home", system_kind: "FRESHWATER", nominal_volume_l: 300 }
              as: AccountManager
              captures: { home_id: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${contract_id}", label: "QT", system_kind: "FRESHWATER", nominal_volume_l: 80 }
              as: AccountManager
              captures: { qt_id: $.data.id }
            - call: "POST /aquatics/contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${home_id}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${qt_id}/commission"
              payload: {}
              as: AccountManager
              captures: { qt_v: $.data.version }
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${home_id}", common_name: "A", species_class: "COMMUNITY", adult_length_cm: 4 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { fish_a: $.data.id }
            - call: "POST /aquatics/livestock"
              payload: { system_id: "${home_id}", common_name: "B", species_class: "COMMUNITY", adult_length_cm: 4 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { fish_b: $.data.id }
            - call: "POST /aquatics/quarantines"
              payload: { livestock_id: "${fish_a}", quarantine_tank_id: "${qt_id}", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-03T00:00:00Z", expected_tank_version: "${qt_v}" }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { q_id: $.data.id }
            - call: "GET /aquatics/contracts/${contract_id}"
              payload: {}
              as: AccountManager
              captures: { count_during_quarantine: $.data.alive_livestock_count }
          trigger:
            - call: "POST /aquatics/quarantines/${q_id}/abort"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "GET /aquatics/contracts/${contract_id}"
              payload: {}
              as: AccountManager
              captures: { count_after_abort: $.data.alive_livestock_count }
          assert:
            - "count_during_quarantine == 1 (one alive, one quarantined)"
            - "ServiceContract.${contract_id}.alive_livestock_count == 1 after abort (no change; quarantined animal was already excluded)"
            - "Livestock.${fish_a}.status == DECEASED"
