scaffold_corner_design:
  - section: entities
    instances:
      - name: member_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Member.fields.tier, entities.Member.fields.wallet_balance_cents, entities.Member.fields.status]
        distinguishing_aspect: "Registering with only required fields yields tier BASIC, wallet 0, strikes 0, status ACTIVE, version 1, and created_at stamped from the default logical clock 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["empty DB; logical clock untouched (startup default 2026-05-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "def@x.com", full_name: "Default Member", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id, tier: $.data.tier, wallet: $.data.wallet_balance_cents, created: $.data.created_at, ver: $.data.version }
          assert:
            - "Member.tier == BASIC, wallet_balance_cents == 0, safety_strikes == 0, status == ACTIVE, version == 1"
            - "Member.created_at == 2026-05-01T00:00:00.000Z (default logical clock, ISO8601 UTC three fractional digits)"
      - name: member_server_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Member.fields.wallet_balance_cents]
        distinguishing_aspect: "Client-supplied id, version, and wallet_balance_cents on registration are ignored: server mints a UUID id, version 1, wallet 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "sneaky@x.com", full_name: "Sneaky Member", date_of_birth: "1990-01-01", id: "11111111-1111-1111-1111-111111111111", version: 99, wallet_balance_cents: 9999 }
              as: Anonymous
              captures: { m_id: $.data.id, ver: $.data.version, wallet: $.data.wallet_balance_cents }
          assert:
            - "Member.id != 11111111-1111-1111-1111-111111111111 (server-minted UUID)"
            - "Member.version == 1 and wallet_balance_cents == 0 (inputs ignored)"
      - name: member_minor_registration_without_guardian_rejected
        claim_type: required_fields
        grounds: [entities.Member.fields.guardian_id, "errors[ERR_MINOR_GUARDIAN_REQUIRED]"]
        distinguishing_aspect: "At clock 2026-05-01 a member with date_of_birth 2012-06-15 is a minor: registration without guardian_id fails ERR_MINOR_GUARDIAN_REQUIRED; with an adult guardian_id it succeeds and stores the FK."
        test_recipe:
          setup: ["clock 2026-05-01; adult guardian member exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "guard@x.com", full_name: "Guard Ian", date_of_birth: "1985-03-20" }
              as: Anonymous
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { email: "kid@x.com", full_name: "Kid Archer", date_of_birth: "2012-06-15" }
              as: Anonymous
              captures: { err: $.data.error_id }
            - call: "POST /members"
              payload: { email: "kid@x.com", full_name: "Kid Archer", date_of_birth: "2012-06-15", guardian_id: "${g_id}" }
              as: Anonymous
              captures: { k_id: $.data.id, minor: $.data.is_minor, guard: $.data.guardian_id }
          assert:
            - "first attempt: error_id == ERR_MINOR_GUARDIAN_REQUIRED (422), no member created"
            - "second attempt: 201, is_minor == true, guardian_id == ${g_id}"
      - name: member_18th_birthday_boundary_is_adult
        claim_type: computed_field
        grounds: [entities.Member.fields.is_minor]
        distinguishing_aspect: "Age boundary: date_of_birth 2008-05-01 is still a minor at clock 2026-04-30 (registration rejected) but an adult at clock 2026-05-01 — the 18th birthday itself counts as adult (current_date >= dob + 18y)."
        test_recipe:
          setup: ["clock starts at 2026-04-30, then advances to 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-30T12:00:00Z" }, as: Admin }
          trigger:
            - call: "POST /members"
              payload: { email: "bday@x.com", full_name: "Birthday Archer", date_of_birth: "2008-05-01" }
              as: Anonymous
              captures: { err: $.data.error_id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "bday@x.com", full_name: "Birthday Archer", date_of_birth: "2008-05-01" }
              as: Anonymous
              captures: { m_id: $.data.id, minor: $.data.is_minor }
            - call: "POST /members/${m_id}/waivers"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { w_id: $.data.id, valid_until: $.data.valid_until }
          assert:
            - "at 2026-04-30: registration rejected error_id == ERR_MINOR_GUARDIAN_REQUIRED"
            - "at 2026-05-01 (18th birthday): registration succeeds, is_minor == false"
            - "adult self-signs waiver: 201, signed_by_member_id == ${m_id}, valid_until == 2027-05-01"
      - name: member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_MEMBER_NOT_FOUND (404), not a 500 or empty body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/9b9b9b9b-1111-4222-8333-444444444444"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND with http 404"
      - name: punch_card_invalid_pack_size_rejected
        claim_type: type_constraint
        grounds: [entities.PunchCard.fields.punches_total, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "punches_total outside the {5,10} pack enum is a shape error (priority 4) that fires before any fiscal check — even with a funded wallet."
        test_recipe:
          setup: ["member with wallet 10000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "pack@x.com", full_name: "Pack Buyer", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
          trigger:
            - call: "POST /members/${m_id}/punch-cards"
              payload: { punches_total: 7 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); wallet stays 10000; no card created"
  - section: state_machines
    instances:
      - name: session_second_checkin_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RangeSession.BOOKED_to_CHECKED_IN, "errors[ERR_SESSION_NOT_BOOKED]"]
        distinguishing_aspect: "CHECKED_IN is not a valid from-state for check-in: the second call inside the window fails ERR_SESSION_NOT_BOOKED; idempotency is not offered for action endpoints."
        test_recipe:
          setup: ["BOOKED session 2026-05-01T10:00-11:00Z with one paid WALLET participant; clock at 10:00; already checked in once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "ci@x.com", full_name: "Check In", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "CIL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${m_id}", payment_method: "WALLET" }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: Admin }
            - { call: "POST /range-sessions/${s_id}/check-in", payload: {}, as: RangeOfficer }
          trigger:
            - call: "POST /range-sessions/${s_id}/check-in"
              payload: {}
              as: RangeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SESSION_NOT_BOOKED (409); session remains CHECKED_IN; checked_in_at unchanged"
      - name: session_cancel_after_close_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RangeSession, "errors[ERR_SESSION_ALREADY_CLOSED]"]
        distinguishing_aspect: "CLOSED is terminal: cancel on a CLOSED session fails ERR_SESSION_ALREADY_CLOSED and no refund is issued."
        test_recipe:
          setup: ["session checked in at 10:00 and closed at 10:30 (60 booked min -> final 2400x0.9=2160 PLUS member; wallet settled)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "term@x.com", full_name: "Terminal Tester", date_of_birth: "1990-01-01", tier: "PLUS" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "TL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${m_id}", payment_method: "WALLET" }, as: Member, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: Admin }
            - { call: "POST /range-sessions/${s_id}/check-in", payload: {}, as: RangeOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:30:00Z" }, as: Admin }
            - { call: "POST /range-sessions/${s_id}/close", payload: {}, as: RangeOfficer }
          trigger:
            - call: "POST /range-sessions/${s_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SESSION_ALREADY_CLOSED (409)"
            - "RangeSession.${s_id}.session_status remains CLOSED; cancellation_refund_cents remains null"
      - name: waiver_second_revoke_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Waiver, "errors[ERR_WAIVER_NOT_REVOKABLE]"]
        distinguishing_aspect: "REVOKED is terminal: a second revoke fails ERR_WAIVER_NOT_REVOKABLE; the first revoke from ACTIVE succeeds."
        test_recipe:
          setup: ["adult member with ACTIVE waiver; waiver already revoked once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "rev@x.com", full_name: "Revoke Tester", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/waivers"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { w_id: $.data.id }
            - { call: "POST /waivers/${w_id}/revoke", payload: {}, as: Admin }
          trigger:
            - call: "POST /waivers/${w_id}/revoke"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WAIVER_NOT_REVOKABLE (409); waiver status remains REVOKED"
      - name: scorecard_put_from_verified_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScoreCard, "errors[ERR_SCORECARD_NOT_EDITABLE]"]
        distinguishing_aspect: "PUT is only legal from SUBMITTED or DISPUTED: from VERIFIED the edit fails ERR_SCORECARD_NOT_EDITABLE even with a correct OCC version."
        test_recipe:
          setup: ["league CLOSED with one CONFIRMED entry; scorecard SUBMITTED then VERIFIED (version 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /leagues"
              payload: { name: "Edit Cup", entry_fee_cents: 5000, max_entries: 10 }
              as: LeagueDirector
              captures: { lg_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ed@x.com", full_name: "Editor", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 5000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /leagues/${lg_id}/entries"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id: $.data.id }
            - { call: "POST /leagues/${lg_id}/close", payload: {}, as: LeagueDirector }
            - call: "POST /league-entries/${e_id}/scorecards"
              payload: { ends: [[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10],[10,10,10]], x_hits: 30 }
              as: Member
              as_user_id: "${m_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /scorecards/${sc_id}/verify"
              payload: {}
              as: LeagueDirector
              captures: { sc_v: $.data.version }
          trigger:
            - call: "PUT /scorecards/${sc_id}"
              payload: { ends: [[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9],[9,9,9]], x_hits: 0, expected_scorecard_version: "${sc_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCORECARD_NOT_EDITABLE (409); status remains VERIFIED; total_points remains 300"
      - name: rental_settle_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RentalAgreement, "errors[ERR_RENTAL_INVALID_STATE]"]
        distinguishing_aspect: "settle requires RETURNED: settling an OPEN agreement fails ERR_RENTAL_INVALID_STATE and no settlement is computed."
        test_recipe:
          setup: ["AVAILABLE bow; member with waiver; OPEN rental agreement"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "rs@x.com", full_name: "Rent Settler", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /rental-items"
              payload: { name: "Bow X", item_type: "BOW", daily_rate_cents: 2500 }
              as: ShopClerk
              captures: { ri_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_item_id: "${ri_id}", member_id: "${m_id}", draw_length_in: 28.0, draw_weight_lb: 40, due_date: "2026-05-02" }
              as: RangeOfficer
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${ra_id}/settle"
              payload: {}
              as: RangeOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RENTAL_INVALID_STATE (409); settlement_total_cents remains null; status OPEN"
      - name: no_show_sweep_forfeits_fees
        claim_type: precondition_enforcement
        grounds: [state_machines.RangeSession.BOOKED_to_NO_SHOW, state_machines.SessionParticipant]
        distinguishing_aspect: "System auto-transition: advancing the clock past start_at+15min without check-in flips the session NO_SHOW, marks participants FORFEITED, and keeps the quoted debit — zero refund."
        test_recipe:
          setup: ["PLUS member wallet 10000 waiver; RESERVED session 2026-05-01T10:00-11:00Z; participant quoted 2160 debited (wallet 7840); no check-in"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "ns@x.com", full_name: "No Show", date_of_birth: "1990-01-01", tier: "PLUS" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lanes"
              payload: { name: "NL", lane_type: "INDOOR", max_archers: 4 }
              as: Admin
              captures: { lane_id: $.data.id }
            - call: "POST /range-sessions"
              payload: { lane_id: "${lane_id}", booking_type: "RESERVATION", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T11:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - { call: "POST /range-sessions/${s_id}/participants", payload: { member_id: "${m_id}", payment_method: "WALLET" }, as: Member, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:16:00Z" }, as: Admin }
            - call: "GET /range-sessions/${s_id}"
              payload: {}
              as: RangeOfficer
              captures: { st: $.data.session_status, pay: $.data.payment_status }
          assert:
            - "RangeSession.${s_id}.session_status == NO_SHOW (sweep fired at start+15min boundary passed)"
            - "SessionParticipant of ${m_id} on ${s_id}.status == FORFEITED"
            - "Member.${m_id}.wallet_balance_cents == 7840 (forfeit: quoted fee NOT refunded) and payment_status == PAID"
      - name: lesson_complete_before_start_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Lesson.CONFIRMED_to_COMPLETED, "errors[ERR_LESSON_NOT_ACTIONABLE]"]
        distinguishing_aspect: "complete requires clock >= proposed_start_at: completing a CONFIRMED future lesson fails ERR_LESSON_NOT_ACTIONABLE even though the from-state is correct."
        test_recipe:
          setup: ["CONFIRMED lesson at 2026-05-02T10:00Z; clock still 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /coaches"
              payload: { full_name: "Coach Early", disciplines: ["COMPOUND"] }
              as: Admin
              captures: { c_id: $.data.id }
            - call: "POST /members"
              payload: { email: "early@x.com", full_name: "Early Bird", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /lessons"
              payload: { coach_id: "${c_id}", discipline: "COMPOUND", proposed_start_at: "2026-05-02T10:00:00Z", duration_minutes: 60 }
              as: Member
              as_user_id: "${m_id}"
              captures: { l_id: $.data.id }
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: Coach, as_user_id: "${c_id}" }
          trigger:
            - call: "POST /lessons/${l_id}/complete"
              payload: {}
              as: Coach
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LESSON_NOT_ACTIONABLE (409); status remains CONFIRMED"
  - section: calculations
    instances:
      - name: rental_settlement_late_days_and_damage
        claim_type: correct_result
        grounds: [calculations.rental_settlement]
        distinguishing_aspect: "rental_settlement with all three components: 3 billable days x 2500 = 7500, 2 late days x 500 = 1000, damage 1200 -> settlement_total 9700 debited from wallet."
        test_recipe:
          setup: ["bow daily 2500; member wallet 20000 waiver; agreement checked out 2026-05-01 due 2026-05-02; returned 2026-05-04 DAMAGED fee 1200"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: Admin }
            - call: "POST /members"
              payload: { email: "rent@x.com", full_name: "Renter", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - { call: "POST /members/${m_id}/wallet/adjustments", payload: { amount_cents: 20000 }, as: Admin }
            - { call: "POST /members/${m_id}/waivers", payload: {}, as: Member, as_user_id: "${m_id}" }
            - call: "POST /rental-items"
              payload: { name: "Bow Y", item_type: "BOW", daily_rate_cents: 2500 }
              as: ShopClerk
              captures: { ri_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { rental_item_id: "${ri_id}", member_id: "${m_id}", draw_length_in: 28.0, draw_weight_lb: 40, due_date: "2026-05-02" }
              as: RangeOfficer
              captures: { ra_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T10:00:00Z" }, as: Admin }
            - { call: "POST /rental-agreements/${ra_id}/return", payload: { returned_condition: "DAMAGED", damage_fee_cents: 1200 }, as: RangeOfficer }
          trigger:
            - call: "POST /rental-agreements/${ra_id}/settle"
              payload: {}
              as: RangeOfficer
              captures: { total: $.data.settlement_total_cents }
          assert:
            - "RentalAgreement.${ra_id}.settlement_total_cents == 9700 (7500 rental + 1000 late + 1200 damage)"
            - "Member.${m_id}.wallet_balance_cents == 10300"
