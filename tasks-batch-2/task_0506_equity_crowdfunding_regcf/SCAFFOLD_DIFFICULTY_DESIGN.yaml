            - "response.http_status == 409"
            - "Offering.${b_id}.status == DRAFT"

      - name: update_quiet_period_point_buffer_on_investor_update
        grounds:
          - calculations.update_quiet_period
          - validations[priority=9.2]
          - errors[ERR_UPDATE_QUIET_PERIOD]
          - entities.InvestorUpdate.fields.published_at
        distinguishing_aspect: |
          POINT-EVENT-WITH-BUFFER on a DIFFERENT resource (InvestorUpdate): a prior update published at
          2026-03-01 imposes a strict-greater-than-24h quiet period; a second non-superseding update
          published at EXACTLY 2026-03-02T00:00:00Z (24h later, not strictly >) is rejected — distinct
          interval geometry from the closed-interval campaign overlap.
        test_recipe:
          setup:
