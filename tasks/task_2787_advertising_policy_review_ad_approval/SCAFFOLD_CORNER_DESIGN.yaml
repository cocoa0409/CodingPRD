          assert:
            - "The first sweep returns HTTP 200 with all nine counters 0, and ReviewTask.${task_a}.version is unchanged at ${task_a_v} — a no-op sweep bumps nothing"
            - "The clock call returns current_utc 2026-08-06T00:00:00Z and previous_utc 2026-08-01T00:00:00Z"
            - "The second sweep returns activated_certifications 1, expired_certifications 0, expired_notices 1, expired_review_tasks 1, requeued_review_tasks 1, expired_enforcement_actions 0, lifted_enforcement_actions 0, released_hold_creatives 0 and decay_refreshed_advertisers 0 (the only ledger entry is 5 days old, so its decayed value did not change)"
