              payload: { name: "TW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
