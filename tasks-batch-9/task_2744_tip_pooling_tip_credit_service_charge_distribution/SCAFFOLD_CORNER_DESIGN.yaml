              captures: { charge_id: $.data.id }
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
          trigger:
            - call: "POST /service-charges/${charge_id}/void"
              payload: { reason: "billed to the wrong unit" }
              as: PayrollPreparer
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
          assert:
            - "before the trigger calls GET /service-charges/${charge_id} reports treatment == WAGES, status == ALLOCATED, allocated_pay_period_id == ${period_id}, allocated_pool_id == null"
            - "before the trigger calls the single PayLine has service_charge_wages_cents == 6000, straight_cash_cents == 1704, regular_rate_cents_per_hour == 963, minimum_wage_obligation_cents == 5800, tip_credit_cents == 0, topup_cents == 0, total_gross_cents == 7704"
            - "the first trigger call returns HTTP 200 with status == VOIDED"
            - "after the first trigger call GET /pay-periods/${period_id} reports status == OPEN and compute_variant == null, and the earlier PayLine has status == SUPERSEDED"
            - "the second trigger call returns HTTP 200 and the new non-SUPERSEDED PayLine has service_charge_wages_cents == 0, straight_cash_cents == 1704, regular_rate_cents_per_hour == 213, minimum_wage_obligation_cents == 5800, tips_available_cents == 5000, tip_credit_cents == 4096, topup_cents == 0, total_gross_cents == 1704"
            - "GET /shifts/${shift_id} still reports time_status == CLOSED, declaration_status == DECLARED and retained_tips_cents == 5000: the cascade touched the period and the line, not the shift"

      - name: close_shift_side_effects_write_credited_minutes_and_period_rollups
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shift.time_status.OPEN_to_CLOSED
          - calculations.side_work_classification
          - entities.PayPeriod.fields.total_credited_minutes
        excluded_because:
          difficulty_instance: boundary_precision_check / side_work_at_exact_twenty_percent_and_thirty_minute_limits_yields_no_overage
          rationale: "That §1.8 instance closes two shifts at the 20%/30-minute boundaries and asserts non_tip_credit_minutes, tip_credit_eligible_minutes and the period's total_credited_minutes rollup, which is exactly this transition's side-effect list."

      - name: pay_period_cycles_back_to_open_and_forward_again
        claim_type: valid_transition
        grounds:
          - state_machines.PayPeriod.APPROVED_to_OPEN
          - state_machines.PayPeriod.OPEN_to_COMPUTED
          - complexity_profile.state_machine_shape.cyclic
        excluded_because:
          difficulty_instance: non_linear_state_machine / pay_period_cycle_open_computed_approved_reopen_open
          rationale: "That §1.8 instance drives the full OPEN -> COMPUTED -> APPROVED -> OPEN -> COMPUTED cycle and asserts the variant flip and rollup re-derivation at every hop."

  - section: calculations
    instances:
      - name: service_charge_as_wages_lifts_the_regular_rate_and_squeezes_the_tip_credit
        claim_type: correct_result
        grounds:
          - calculations.service_charge_wages_allocation
          - calculations.pay_line_wage_computation
          - entities.PayLine.fields.service_charge_wages_cents
          - entities.PayLine.fields.regular_rate_cents_per_hour
          - entities.Location.fields.service_charge_treatment
        distinguishing_aspect: >-
          The whole WAGES-versus-TIPS fork in one fixture, on a deliberately indivisible 6001-cent
          charge. The 480/300 minute split gives bases 3692 and 2308 with one leftover cent that
          largest-remainder awards to the 480-minute shift, so the shares are 3693 and 2308. The
          server's charge share then does two things at once: it raises the regular rate from 213
          to 675 and it eats the residual cap, leaving tip_credit_cents 403 rather than the
          max_credit 4096 or the tips_available 4000. The manager is INCLUDED here — the opposite
          of the pool rule — and takes 2308 on top of straight cash at the full minimum wage.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit treating service charges as WAGES with no ACTIVE pool policy."
            - "One SERVER employee (Ana, notice acknowledged 2026-07-01) and one MANAGER employee (Bo, is_management true, NON_TIPPED)."
            - "Ana worked a CLOSED 480-minute shift on 2026-08-04 declaring 4000 cash tips; Bo worked a CLOSED 300-minute shift the same day declaring nothing."
            - "One RECORDED service charge of 6001 cents on 2026-08-04 with no treatment_override."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "MANAGER", title: "Shift Manager", tip_status: "NON_TIPPED", is_management: true, pool_contribution_pct_bps: 0, pool_share_points: 0, side_work_eligible: false }
              as: PayrollAdmin
              captures: { role_mgr_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bo Nkemdi", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${mgr_id}", job_role_id: "${role_mgr_id}", effective_from: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_srv_id: $.data.id }
            - call: "POST /shifts/${shift_srv_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_srv_id}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${mgr_id}", location_id: "${loc_id}", job_role_id: "${role_mgr_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T12:00:00Z", end_at: "2026-08-04T17:00:00Z" }
              as: PayrollPreparer
              captures: { shift_mgr_id: $.data.id }
            - call: "POST /shifts/${shift_mgr_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_mgr_id}/declare-tips"
              payload: { declared_cash_tips_cents: 0, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${mgr_id}"
            - call: "POST /service-charges"
              payload: { location_id: "${loc_id}", business_date: "2026-08-04T00:00:00Z", amount_cents: 6001, description: "Banquet 14 gratuity" }
              as: PayrollPreparer
              captures: { charge_id: $.data.id }
          trigger:
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
          assert:
            - "HTTP 200; GET /service-charges/${charge_id} reports treatment == WAGES (inherited from the location, treatment_override null), status == ALLOCATED, allocated_pay_period_id == ${period_id}, allocated_pool_id == null"
            - "the server's PayLine has total_minutes == 480, tip_credit_eligible_minutes == 480, overtime_minutes == 0, straight_cash_cents == 1704, service_charge_wages_cents == 3693, regular_rate_cents_per_hour == 675, minimum_wage_obligation_cents == 5800, retained_tips_cents == 4000, pool_tips_cents == 0, tips_available_cents == 4000, tipped_employee_qualified == true, tip_credit_cents == 403, topup_cents == 0, total_gross_cents == 5397, reported_tips_cents == 4000"
            - "tip_credit_cents is 403 and not 4096: the residual cap minimum_wage_obligation - straight_cash - service_charge_wages is the binding one of the three"
            - "the manager's PayLine has total_minutes == 300, tip_credit_eligible_minutes == 0, non_tip_credit_minutes == 300, straight_cash_cents == 3625, service_charge_wages_cents == 2308, regular_rate_cents_per_hour == 1187, minimum_wage_obligation_cents == 3625, tipped_employee_qualified == false, tip_credit_cents == 0, topup_cents == 0, total_gross_cents == 5933, reported_tips_cents == 0"
            - "3693 + 2308 == 6001 exactly: the largest-remainder cent went to the 480-minute shift, so the charge is neither over- nor under-distributed"
            - "GET /pay-periods/${period_id} reports total_credited_minutes == 780, total_tip_credit_cents == 403, total_topup_cents == 0, gross_receipts_cents == 0, reported_tips_cents == 4000, allocation_shortfall_cents == 0"

      - name: pool_computation_includes_only_same_unit_same_date_non_voided_shifts
        claim_type: input_set_filtering
        grounds:
          - calculations.shift_pool_contribution
          - calculations.pool_distribution
          - endpoints.POST_/shift-tip-pools
          - entities.ShiftTipPool.fields.contributing_shift_count
        distinguishing_aspect: >-
          Three decoys surround the one qualifying shift: a same-unit same-date shift that was
          VOIDED after declaring 5000, a same-unit shift on the next business date declaring 6000,
          and a same-date shift at a different unit declaring 7000. A pool that swept any of them
          in would show total_contributed_cents 900, 1350 or 1650 instead of 600, so the arithmetic
          itself names which shift was wrongly included.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; two Texas units, Dallas with an ACTIVE TIPPED_ONLY / TIPS_RECEIVED_PCT / POINTS_ONLY policy (cc_fee_pass_through false) and Plano with none."
            - "Ana and Bea are Dallas SERVERs and Cal is a Plano SERVER, all with notices acknowledged 2026-07-01."
            - "Ana: CLOSED 480-minute shift on 2026-08-04 declaring 4000, plus a CLOSED 480-minute shift on 2026-08-05 declaring 6000."
            - "Bea: a 2026-08-04 shift that was closed, declared 5000 and then VOIDED. Cal: a CLOSED Plano shift on 2026-08-04 declaring 7000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /locations"
              payload: { name: "Plano Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc2_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bea Olsen", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc2_id}", full_name: "Cal Ruiz", external_payroll_ref: "E3", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp3_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp2_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp3_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /tip-pool-policies/${policy_id}/activate"
              payload: { expected_location_version: "${loc_version}" }
              as: ComplianceOfficer
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc2_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period2_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { keep_id: $.data.id }
            - call: "POST /shifts/${keep_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${keep_id}/declare-tips"
              payload: { declared_cash_tips_cents: 4000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-05T00:00:00Z", start_at: "2026-08-05T16:00:00Z", end_at: "2026-08-06T00:00:00Z" }
              as: PayrollPreparer
              captures: { nextday_id: $.data.id }
            - call: "POST /shifts/${nextday_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${nextday_id}/declare-tips"
              payload: { declared_cash_tips_cents: 6000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp2_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { voided_id: $.data.id }
            - call: "POST /shifts/${voided_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${voided_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp2_id}"
            - call: "POST /shifts/${voided_id}/void"
              payload: { reason: "logged against the wrong employee" }
              as: PayrollPreparer
            - call: "POST /shifts"
              payload: { employee_id: "${emp3_id}", location_id: "${loc2_id}", job_role_id: "${role_server_id}", pay_period_id: "${period2_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { other_unit_id: $.data.id }
            - call: "POST /shifts/${other_unit_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${other_unit_id}/declare-tips"
              payload: { declared_cash_tips_cents: 7000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp3_id}"
          trigger:
            - call: "POST /shift-tip-pools"
              payload: { location_id: "${loc_id}", business_date: "2026-08-04T00:00:00Z" }
              as: PayrollPreparer
              captures: { pool_id: $.data.id }
            - call: "POST /shift-tip-pools/${pool_id}/distribute"
              payload: {}
              as: PayrollPreparer
          assert:
            - "the first trigger call returns HTTP 201 with contributing_shift_count == 1, participant_count == 1, total_contributed_cents == 600, service_charge_tips_cents == 0, cc_fee_deducted_cents == 0, net_pool_cents == 600, total_share_weight == 10"
            - "total_contributed_cents is 600 and not 900, 1350 or 1650: none of the three decoy shifts entered the input set"
            - "GET /shifts/${keep_id} reports shift_tip_pool_id == ${pool_id}, pool_contribution_cents == 600, retained_tips_cents == 3400"
            - "GET /shifts/${nextday_id} reports shift_tip_pool_id == null, pool_contribution_cents == 0, retained_tips_cents == 6000 — a wrong business_date is not a near miss, it is simply out"
            - "GET /shifts/${voided_id} reports time_status == VOIDED with shift_tip_pool_id null and declared_cash_tips_cents 0, the void having already zeroed its tip figures"
            - "GET /shifts/${other_unit_id} reports shift_tip_pool_id == null and retained_tips_cents == 7000"
            - "the second trigger call returns HTTP 200 with distribution_status == DISTRIBUTED, distributed_cents == 600 == net_pool_cents"
            - "GET /pool-allocations?shift_tip_pool_id=${pool_id} reports total_count == 1 with employee_id == ${emp_id}, shift_id == ${keep_id}, entry_type == DISTRIBUTION, share_weight == 10, allocated_cents == 600, remainder_cent_awarded == false"
            - "GET /locations/${loc_id} reports pending_pool_cents == 0 once the pool is DISTRIBUTED, and GET /employees/${emp_id} reports trailing_pool_receipts_cents == 600 while Bea's and Cal's stay 0"

      - name: california_configuration_zeroes_the_card_fee_and_routes_charges_into_the_pool
        claim_type: constants_applied
        grounds:
          - calculations.pool_cc_fee_deduction
          - calculations.pool_distribution
          - calculations.pay_line_wage_computation
          - calculations.allocated_tips_reporting
          - entities.Location.fields.cc_fee_policy
          - entities.Location.fields.applicable_min_wage_cents
        distinguishing_aspect: >-
          The same code path under the opposite jurisdictional configuration: California takes no
          tip credit, forbids card-fee deductions and treats service charges as TIPS, so the
          1650-cent state wage overrides the 725 federal floor, the 300-bps fee that would have
          taken 360 cents takes 0, the 8000-cent charge joins the pool instead of the regular rate,
          and a back-of-house COOK lawfully shares the pool because pool_type is
          ALL_NON_MANAGEMENT — which §1.4 priority 26 permits only where tip_credit_enabled is
          false. Contribution is 15% of GROSS SALES (15000), not 15% of tips.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one California unit with state_min_wage_cents 1650, cash_wage_cents 1650, tip_credit_enabled false, cc_fee_policy PROHIBITED and service_charge_treatment TIPS."
            - "An ACTIVE ALL_NON_MANAGEMENT / GROSS_SALES_PCT / POINTS_ONLY policy with cc_fee_pass_through false."
            - "Dee is a SERVER (15% contribution, 10 points) and Eli is a COOK (0% contribution, 4 points), both with notices acknowledged 2026-07-01."
            - "Dee worked a CLOSED 480-minute shift on 2026-08-04 with gross_sales 100000, charged_sales 50000 and cc_processing_fee_bps 300, declaring 8000 cash and 12000 charged tips; Eli worked a CLOSED 480-minute shift the same day with no sales, declaring nothing."
            - "One RECORDED service charge of 8000 cents on 2026-08-04 with no treatment_override."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Oakland Unit", state_code: "CA", state_min_wage_cents: 1650, cash_wage_cents: 1650, tip_credit_enabled: false, cc_fee_policy: "PROHIBITED", service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_version: $.data.version }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "COOK", title: "Line Cook", tip_status: "NON_TIPPED", is_management: false, pool_contribution_pct_bps: 0, pool_share_points: 4, side_work_eligible: false }
              as: PayrollAdmin
              captures: { role_cook_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Dee Marino", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_srv_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Eli Osei", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_cook_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_srv_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_cook_id}", job_role_id: "${role_cook_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /tip-pool-policies"
