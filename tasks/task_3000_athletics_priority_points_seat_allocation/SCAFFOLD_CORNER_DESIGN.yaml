      - name: release_conserves_the_section_seat_inventory_quadruple
        claim_type: compensation
        grounds:
          - state_machines.SeatAssignment.occupancy_status.transitions.HELD_to_RELEASED
          - calculations.section_seat_inventory
        excluded_because:
          difficulty_instance: compensating_invariant / pick_then_release_conserves_section_seat_inventory
          rationale: "The §1.8 instance already asserts the full before/after quadruple (seat_row_count, seats_available, seats_committed_count, decommissioned_seat_count) across pick then release, including the CONSUMED -> FORFEITED slot walk, so a §1.9 restatement would add no discrimination."

      - name: certify_marks_a_rank_mismatched_scheduled_slot_stale
        claim_type: cascade_down
        grounds:
          - state_machines.SelectionSlot.slot_status.transitions.SCHEDULED_to_STALE
          - state_machines.SelectionEvent.status.transitions.SLOTS_PUBLISHED_to_SLOTS_STALE
        excluded_because:
          difficulty_instance: transitive_cascade / certify_recalculation_cascades_rank_slot_event_relocation
          rationale: "The §1.8 instance asserts the four-level certify cascade end to end (rank rewrite -> slot STALE -> event SLOTS_STALE -> relocation request BLOCKED with pending_request_count 0); the corner file exercises only the recovery half of that loop in republishing_a_stale_event_returns_blocked_relocation_requests_to_awaiting."

      - name: dispute_info_request_cycle_is_bounded_by_the_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.PointDispute.status.transitions.INFO_REQUESTED_to_UNDER_REVIEW
          - errors[ERR_INFO_REQUEST_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispute_info_request_cycle_returns_to_under_review
          rationale: "The §1.8 instance walks UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW twice, asserts info_request_rounds == 2, and asserts the third request-info is refused with ERR_INFO_REQUEST_LIMIT_REACHED — the loop-count termination condition this row calls for."

      - name: a_new_pick_supersedes_an_expired_hold_and_the_seat_stays_held
        claim_type: cross_entity
        grounds:
          - state_machines.SeatAssignment.occupancy_status.transitions.HELD_to_RELEASED
          - entities.SeatAssignment.fields.release_reason
        excluded_because:
          difficulty_instance: resource_temporal_overlap / seat_hold_windows_closed_interval_touching_rejected
          rationale: "The §1.8 instance asserts both halves of the supersede edge: refusal at exactly hold_end and, one millisecond later, success with release_reason SUPERSEDED_BY_NEW_HOLD while Seat.seat_status stays HELD rather than returning to AVAILABLE."

      - name: payment_axis_advances_while_the_occupancy_axis_stands_still
        claim_type: parallel
        grounds:
          - state_machines.SeatAssignment.payment_status
          - state_machines.SeatAssignment.occupancy_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / seat_assignment_parallel_occupancy_and_payment_dimensions
          rationale: "The §1.8 instance drives payment to PAID while occupancy is still HELD and then to RELEASED while payment stays PAID, asserting the combined state after each hop — exactly the independent-dimension claim for the parallel shape."

      - name: picking_is_refused_while_the_target_section_is_under_renovation
        claim_type: guarded_transitions
        grounds:
          - state_machines.SelectionSlot.slot_status.transitions.SCHEDULED_to_CONSUMED
          - validations[priority=11]
          - errors[ERR_SECTION_UNDER_RENOVATION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pick_blocked_when_section_under_renovation
          rationale: "The §1.8 instance is the guarded-transition claim for pick: an otherwise valid slot consumption is refused solely because the Section holding the seat is UNDER_RENOVATION, and it succeeds once the renovation completes."

  # ---------------------------------------------------------------------------
  # Table 3 (Calculations) — claim-extraction-guide.md §3.
  # 12 calculation rules. Claims cover correct_result, input_set_filtering,
  # constants_applied and precision, the per-algorithm boundary rows for
  # weighted_scoring / aggregation / threshold / chronological / interval_merge /
  # tiered_pricing, and the dual-variant rows (divergence, selection,
  # reconciliation). Every literal below is pre-computed from the §1.3 formulas.
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: certified_points_floor_clamps_a_net_negative_ledger_to_zero
        claim_type: correct_result
        grounds:
          - calculations.certified_points_derivation
          - calculations.priority_point_score
        distinguishing_aspect: |
          certified_points is floored at 0.00 AFTER netting transfers, and
          certified_base_points is never re-derived outside a run. Refunding the
          donor's only qualifying gift and re-running therefore drops the base to
          0.00 while transferred_points_out stays at 10.00, so the unclamped sum
          is -10.00 and must surface as exactly 0.00 — never a negative balance
          and never a silent revert of the transfer. The explanatory
          NET_TRANSFER ledger row must still carry -10.00, proving the floor is
          applied to the total and not to each component.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor A, NON_ALUMNUS, INDIVIDUAL, with one RECEIVED ATHLETICS_ANNUAL gift of 1000000 cents dated 2026-03-01; Donor B with no gifts."
            - "PointRecalculation R for cycle 2026 (cutoff 2026-06-30T23:59:59.999Z) has been run once, putting A at certified_base_points 15.00."
            - "A has been moved to DECEASED, an APPROVED basis-DEATH transfer has moved 10.00 points from A to B, and A's gift has then been REFUNDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Fern Floor", email: "fern.floor@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ff_id: "$.data.id" }
            - call: "POST /athletics/donors/${ff_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 1000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ff_gift_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Gus Grantee", email: "gus.grantee@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { gg_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { fr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${fr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors/${ff_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { ff_v3: "$.data.version" }
            - call: "POST /athletics/donors/${ff_id}/status-change"
              payload: { new_status: "DECEASED", effective_date: "2026-03-25T00:00:00.000Z", reason: "Estate notification received", expected_donor_version: "${ff_v3}" }
              as: DevelopmentOfficer
