  - rule_id: resource_temporal_overlap
    instances:
      - name: hangar_slot_half_open_overlap
        grounds:
          - validations[priority=6]
          - entities.HangarSlot.fields.starts_at
        distinguishing_aspect: |
          HangarSlot resource uses HALF-OPEN [start, end) semantics: interior
          overlap rejected, adjacency allowed. Resource = hangar bay.
        test_recipe:
          setup:
            - "Existing slot in H18 [08:00, 17:00)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner Z", email: "oz@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
              captures: { oz: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${oz}", tail_number: "N160ZZ", make_model: "C172", total_time_hours: 110.0 }
              as: ShopManager
              captures: { az: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H18", aircraft_id: "${az}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 10000 }
              as: ShopManager
              captures: { sz1: $.data.id }
          trigger:
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H18", aircraft_id: "${az}", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T13:00:00Z", daily_rate_cents: 10000 }
              as: ShopManager
          assert:
            - "Interior-overlap slot rejected with 409 ERR_SLOT_OVERLAP"
      - name: mechanic_daily_capacity_buffer_overlap
        grounds:
          - validations[priority=7]
          - entities.LaborEntry.fields.duration_tenths
        distinguishing_aspect: |
          Mechanic resource uses AGGREGATE-CAPACITY semantics (different
          interval semantics from half-open): not interval intersection but
          cumulative same-day billable tenths + 30-min buffer must not exceed
          10.0h. A labor entry pushing the cumulative over the threshold is
          rejected with ERR_MECHANIC_OVERBOOKED.
        test_recipe:
          setup:
            - "Mechanic M has posted 97 tenths (9.7h) on 2026-08-10; buffer rule means next entry of 3 tenths (0.3h) would push cumulative to 10.0h which is the boundary — scaffold rejects only EXCEEDING 10h, so posting 3 tenths lands exactly at 10.0h and succeeds; posting a further 3 tenths (cumulative 10.3h > 10h) fails"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner M", email: "om@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
              captures: { om: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${om}", tail_number: "N170MM", make_model: "C172", total_time_hours: 120.0 }
              as: ShopManager
              captures: { am: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "IA M", certificate_number: "IA-M", certificate_class: "IA", hourly_rate_cents: 9000 }
              as: ShopManager
              captures: { mm: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H19", aircraft_id: "${am}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 10000 }
              as: ShopManager
              captures: { sm: $.data.id, smv: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${am}", hangar_slot_id: "${sm}", opened_by_mechanic_id: "${mm}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${smv}" }
              as: ShopManager
              captures: { wom: $.data.id }
            - call: "POST /api/work-orders/${wom}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wom}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${mm}"
            - call: "POST /api/work-orders/${wom}/labor-entries"
              payload: { mechanic_id: "${mm}", duration_tenths: 97, notes: "long day" }
              as: Mechanic
              as_user_id: "${mm}"
          trigger:
            - call: "POST /api/work-orders/${wom}/labor-entries"
              payload: { mechanic_id: "${mm}", duration_tenths: 3, notes: "boundary fill to 100" }
              as: Mechanic
              as_user_id: "${mm}"
            - call: "POST /api/work-orders/${wom}/labor-entries"
              payload: { mechanic_id: "${mm}", duration_tenths: 3, notes: "would exceed" }
              as: Mechanic
              as_user_id: "${mm}"
          assert:
            - "First trigger call succeeds (cumulative exactly 100 tenths == 10.0h, at the >= boundary but NOT exceeding)"
            - "Second trigger call rejected with 409 ERR_MECHANIC_OVERBOOKED (cumulative would become 103 tenths > 100)"

  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_and_regenerate_conserves_work_order_billing
        grounds:
          - state_machines.Invoice.DRAFT_to_VOIDED
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Conserved quantity: ACTIVE-INVOICE-COUNT per WorkOrder (0 or 1).
          Forward action: Invoice auto-created on RTS (count 0 -> 1).
          Compensating action: POST /api/invoices/{id}/void (count 1 -> 0),
          then a fresh DRAFT may be regenerated (0 -> 1). Invariant: at most
          one non-VOIDED invoice per WO at all times; sum of non-VOIDED
          invoice totals per WO equals the WO's current billing snapshot.
        test_recipe:
          setup:
            - "WO driven to RETURNED_TO_SERVICE; Invoice I1 auto-created DRAFT with total T1"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner I", email: "oi@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
              captures: { oi: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${oi}", tail_number: "N180II", make_model: "C172", total_time_hours: 130.0 }
