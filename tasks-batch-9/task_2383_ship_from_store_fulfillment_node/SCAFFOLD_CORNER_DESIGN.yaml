scaffold_corner_design:
  - section: entities
    instances:
      - name: store_creation_returns_eligible_node_with_cold_start_score
        claim_type: creation
        grounds:
          - endpoints.POST /fulfillment-network/stores
          - calculations.store_eligibility_score
          - entities.Store
        distinguishing_aspect: "A brand-new node comes back ELIGIBLE with a cold-start eligibility_score of 72.00, zero committed units and reserved minutes, and an OPEN performance window at epoch 1 created in the same request."
        test_recipe:
          setup:
            - "Empty database; the logical clock is set to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "GET /fulfillment-network/performance-windows"
              payload: { store_id: "${s1}" }
              as: NetworkPlanner
              captures: { w1: "$.data[0].id" }
          assert:
            - "HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "Store.${s1}.node_status == ELIGIBLE"
            - "Store.${s1}.eligibility_score == 72.00 (40 * min(1, 120/200) = 24.0000 capacity, 30 * min(1, 480/480) = 30.0000 labour, 30 * 0.60 = 18.0000 cold-start performance)"
            - "Store.${s1}.eligibility_score_basis == COLD_START"
            - "Store.${s1}.units_committed_epoch == 0 and reserved_labor_minutes == 0.00"
            - "Store.${s1}.consecutive_breach_windows == 0, deactivated_at_epoch == null, reactivation_count == 0, review_score == 0.00"
            - "Store.${s1}.version == 1 with id, created_at and updated_at all present"
            - "NodePerformanceWindow.${w1}.status == OPEN, epoch == 1, store_id == ${s1}, opened_at_utc == 2026-08-03T09:00:00Z, closed_at_utc == null"
            - "GET /performance-windows?store_id=${s1} reports total_count 1 and has_more false"

      - name: order_detail_read_returns_stored_inputs_and_derived_totals
        claim_type: retrieval
        grounds:
          - endpoints.GET /fulfillment-network/orders/{order_id}
          - entities.CustomerOrder
          - entities.OrderLine
        distinguishing_aspect: "A two-line order that has never been routed reads back its inputs verbatim plus total_units 4, unassigned_units 4, routing_status UNROUTED, provisional_cost_cents 0, final_cost_cents null and version 3 (one bump per line)."
        test_recipe:
          setup:
            - "Clock 09:00; SKU-A and SKU-B exist; order O1 (destination zone 4, GROUND) has two lines: SKU-A x3 and SKU-B x1."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-B", unit_weight_grams: 250, unit_price_cents: 1900, package_class: "SMALL", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_b: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-9001", customer_ref: "C-101", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 3, unit_price_cents: 4500 }
              as: CustomerCare
              captures: { ol1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_b}", quantity: 1, unit_price_cents: 1900 }
              as: CustomerCare
              captures: { ol2: "$.data.id" }
          trigger:
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: CustomerCare
            - call: "GET /fulfillment-network/order-lines"
              payload: { order_id: "${o1}" }
              as: CustomerCare
          assert:
            - "HTTP 200 with response_type object"
            - "CustomerOrder.${o1} echoes order_code O-9001, customer_ref C-101, destination_zone 4, service_level GROUND, promised_ship_by_utc 2026-08-03T15:00:00Z"
            - "CustomerOrder.${o1}.total_units == 4 and unassigned_units == 4"
            - "CustomerOrder.${o1}.routing_status == UNROUTED and fulfillment_status == PENDING"
            - "CustomerOrder.${o1}.shipped_units == 0, dc_fallback_units == 0, split_count == 0, reroute_attempt_count == 0"
            - "CustomerOrder.${o1}.provisional_cost_cents == 0, dc_baseline_cost_cents == 0, cost_index_bps == 0, final_cost_cents == null, cost_variance_cents == null"
            - "CustomerOrder.${o1}.version == 3: creation minted version 1 and each of the two line creations bumped it"
            - "OrderLine.${ol1} reads quantity 3, open_units 3, assigned_units 0, shipped_units 0, cancelled_units 0, dc_fallback_units 0, line_status OPEN"
            - "OrderLine.${ol2} reads quantity 1, open_units 1, line_status OPEN"
            - "GET /order-lines?order_id=${o1} returns 2 rows with total_count 2 and has_more false"

      - name: store_listing_honours_limit_offset_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints.GET /fulfillment-network/stores
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With four nodes registered the list endpoint pages at limit 2 (has_more true then false), filters on region_code and node_status, and defaults to limit 10 / offset 0 with total_count 4."
        test_recipe:
          setup:
            - "Clock 09:00; four nodes exist: S1-DOWNTOWN (WEST), S2-HARBOR (EAST), S3-SUBURB (WEST), S5-ANNEX (EAST), all ELIGIBLE."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S2-HARBOR", region_code: "EAST", origin_zone: 5, daily_unit_capacity: 60, staffed_labor_minutes: 300, labor_standard_minutes_per_order: 15, pick_labor_minutes_per_unit: 4, labor_rate_cents_per_minute: 38, cutoff_utc_minutes: 1080, hazmat_certified: true }
              as: NetworkPlanner
              captures: { s2: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S3-SUBURB", region_code: "WEST", origin_zone: 2, daily_unit_capacity: 200, staffed_labor_minutes: 600, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 20, cutoff_utc_minutes: 960, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s3: "$.data.id" }
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S5-ANNEX", region_code: "EAST", origin_zone: 3, daily_unit_capacity: 100, staffed_labor_minutes: 400, labor_standard_minutes_per_order: 10, pick_labor_minutes_per_unit: 2, labor_rate_cents_per_minute: 25, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s5: "$.data.id" }
          trigger:
            - call: "GET /fulfillment-network/stores"
              payload: { limit: 2, offset: 0 }
              as: CarrierCoordinator
            - call: "GET /fulfillment-network/stores"
              payload: { limit: 2, offset: 2 }
              as: CarrierCoordinator
            - call: "GET /fulfillment-network/stores"
              payload: { region_code: "EAST" }
              as: CarrierCoordinator
            - call: "GET /fulfillment-network/stores"
              payload: { node_status: "DEACTIVATED" }
              as: CarrierCoordinator
            - call: "GET /fulfillment-network/stores"
              payload: {}
              as: CarrierCoordinator
          assert:
            - "limit 2 / offset 0 returns 2 rows with total_count 4 and has_more true"
            - "limit 2 / offset 2 returns 2 rows with total_count 4 and has_more false"
            - "region_code EAST returns exactly the 2 rows ${s2} and ${s5} with total_count 2"
            - "node_status DEACTIVATED returns 0 rows with total_count 0 and has_more false"
            - "the unparameterised list applies limit 10 / offset 0 and returns all 4 rows with response_type array and has_more false"

      - name: store_detail_read_with_unknown_id_returns_store_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET /fulfillment-network/stores/{store_id}
          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown store id resolves to nothing and returns 404 ERR_STORE_NOT_FOUND in the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "Clock 09:00; exactly one node S1 exists, whose id differs from the probed id."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
          trigger:
            - call: "GET /fulfillment-network/stores/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: NetworkPlanner
              captures: { err_nf: "$.data.error_id", msg_nf: "$.data.message" }
          assert:
            - "HTTP 404 with ${err_nf} == ERR_STORE_NOT_FOUND"
            - "the body follows the error envelope: response_type error and data carrying only error_id and message, with ${msg_nf} non-empty"
            - "GET /stores still reports total_count 1, so the probe created nothing"

      - name: store_creation_missing_staffed_labor_minutes_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST /fulfillment-network/stores
          - validations.ERR_INVALID_REQUEST
        distinguishing_aspect: "staffed_labor_minutes has source input and no default, so omitting it fails with 400 ERR_INVALID_REQUEST before any node row is written."
        test_recipe:
          setup:
            - "Clock 09:00; empty store registry."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020 }
              as: NetworkPlanner
              captures: { err_req: "$.data.error_id" }
          assert:
            - "HTTP 400 with ${err_req} == ERR_INVALID_REQUEST"
            - "GET /stores returns 0 rows with total_count 0"

      - name: omitted_hazmat_flags_default_to_false_on_store_and_sku
        claim_type: defaults
        grounds:
          - entities.Store.fields.hazmat_certified
          - entities.Sku.fields.hazmat_flag
        distinguishing_aspect: "hazmat_certified and hazmat_flag are the only optional inputs on their creates; omitting both yields false rather than null, which keeps the waterfall's hazmat clause decidable."
        test_recipe:
          setup:
            - "Clock 09:00; empty registries."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020 }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM" }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
          assert:
            - "Store.${s1}.hazmat_certified == false"
            - "Sku.${sku_a}.hazmat_flag == false"
            - "Store.${s1}.eligibility_score == 72.00, unaffected by the omitted flag"

      - name: available_to_promise_is_computed_from_on_hand_minus_reserved_and_safety
        claim_type: computed_fields
        grounds:
          - calculations.store_available_to_promise
          - endpoints.POST /fulfillment-network/store-inventories
          - endpoints.POST /fulfillment-network/store-inventories/{inventory_id}/adjustments
        distinguishing_aspect: "available_to_promise_units and reserved_units are computed columns: creation with on_hand 12 / safety 2 yields 10 with reserved 0, and a counted adjustment to 9 / safety 3 re-derives 6 without any client-supplied value."
        test_recipe:
          setup:
            - "Clock 09:00; node S1 and SKU-A exist with no inventory row yet."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 12, safety_stock_units: 2 }
              as: NetworkPlanner
              captures: { inv1: "$.data.id", inv1_v: "$.data.version" }
            - call: "POST /fulfillment-network/store-inventories/${inv1}/adjustments"
              payload: { expected_inventory_version: "${inv1_v}", counted_on_hand_units: 9, reason: "CYCLE_COUNT", safety_stock_units: 3 }
              as: NetworkPlanner
          assert:
            - "on creation StoreInventory.${inv1}.reserved_units == 0, available_to_promise_units == 10, last_adjustment_reason == null, version == 1"
            - "after the adjustment on_hand_units == 9, safety_stock_units == 3, reserved_units == 0, available_to_promise_units == 6"
            - "StoreInventory.${inv1}.last_adjustment_reason == CYCLE_COUNT and version == 2"
            - "Store.${s1}.eligibility_score == 72.00: the adjustment re-scores the node but inventory is not one of the score's inputs"

      - name: system_fields_are_minted_by_the_server_on_sku_creation
        claim_type: system_fields
        grounds:
          - entities.Sku
          - endpoints.POST /fulfillment-network/skus
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted on a common_fields entity: the create response already carries all four and a detail read returns byte-identical values."
        test_recipe:
          setup:
            - "Clock 09:00; empty SKU registry."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id", sku_a_v: "$.data.version" }
            - call: "GET /fulfillment-network/skus/${sku_a}"
              payload: {}
              as: StoreAssociate
              as_user_id: "00000000-0000-4000-8000-000000000009"
          assert:
            - "the create response carries a non-null id, created_at, updated_at and ${sku_a_v} == 1"
            - "the detail read returns the same id, created_at and version 1 with sku_code SKU-A, unit_weight_grams 800, unit_price_cents 4500, package_class MEDIUM"
            - "reads are network-wide, so a StoreAssociate whose X-User-ID is not a node id still receives HTTP 200"

      - name: unknown_enum_members_and_out_of_range_pagination_return_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.ERR_INVALID_REQUEST
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Type constraints are enforced on both bodies and query strings: an unknown package_class, an unknown service_level and a pagination limit of 0 or 101 all return 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 09:00; empty registries."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-X", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "HUGE", hazmat_flag: false }
              as: NetworkPlanner
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-9101", customer_ref: "C-111", destination_zone: 4, service_level: "TELEPORT", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { err_service: "$.data.error_id" }
            - call: "GET /fulfillment-network/stores"
              payload: { limit: 101 }
              as: NetworkPlanner
              captures: { err_limit_high: "$.data.error_id" }
            - call: "GET /fulfillment-network/stores"
              payload: { limit: 0 }
              as: NetworkPlanner
              captures: { err_limit_low: "$.data.error_id" }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400 and no Sku row is created"
            - "${err_service} == ERR_INVALID_REQUEST with HTTP 400 and no CustomerOrder row is created"
            - "${err_limit_high} == ERR_INVALID_REQUEST because limit 101 exceeds the maximum of 100"
            - "${err_limit_low} == ERR_INVALID_REQUEST because limit 0 is below the minimum of 1"

      - name: immutable_child_rows_expose_no_version_and_no_write_route
        claim_type: immutability
        grounds:
          - entities.AssignmentLine
          - entities.RoutingCandidate
          - entities.CustomerNotification
        distinguishing_aspect: "AssignmentLine, RoutingCandidate and CustomerNotification are declared common_fields false: their read bodies carry no version field and §1.5 exposes only list and detail GETs for them, so a client can never mutate an audit row."
        test_recipe:
          setup:
            - "Clock 09:00; node S1 with SKU-A on_hand 20 / safety 2; order O1 (SKU-A x2) has been committed to S1, so one AssignmentLine, four RoutingCandidate rows are absent and one assignment exists."
            - "The commit produced exactly one RoutingCandidate (one store, one iteration) and no notification; the notification is produced by cancelling the order."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 20, safety_stock_units: 2 }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-9201", customer_ref: "C-121", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2, unit_price_cents: 4500 }
              as: CustomerCare
            - call: "GET /fulfillment-network/orders/${o1}"
              payload: {}
              as: NetworkPlanner
              captures: { o1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders/${o1}/routing-runs"
              payload: { mode: "COMMIT", expected_order_version: "${o1_v}" }
              as: NetworkPlanner
              captures: { run1: "$.data.id" }
            - call: "GET /fulfillment-network/assignments"
              payload: { order_id: "${o1}", store_id: "${s1}" }
              as: NetworkPlanner
              captures: { a1: "$.data[0].id" }
            - call: "POST /fulfillment-network/orders/${o1}/cancel"
              payload: { cancel_reason_code: "CUSTOMER_REQUEST" }
              as: CustomerCare
          trigger:
            - call: "GET /fulfillment-network/assignment-lines"
              payload: { assignment_id: "${a1}" }
              as: NetworkPlanner
              captures: { al1: "$.data[0].id" }
            - call: "GET /fulfillment-network/routing-candidates"
              payload: { routing_run_id: "${run1}" }
              as: NetworkPlanner
              captures: { cand1: "$.data[0].id" }
            - call: "GET /fulfillment-network/notifications"
              payload: { order_id: "${o1}" }
              as: NetworkPlanner
              captures: { n1: "$.data[0].id" }
            - call: "GET /fulfillment-network/assignment-lines/${al1}"
              payload: {}
              as: NetworkPlanner
            - call: "GET /fulfillment-network/routing-candidates/${cand1}"
              payload: {}
              as: NetworkPlanner
            - call: "GET /fulfillment-network/notifications/${n1}"
              payload: {}
              as: NetworkPlanner
          assert:
            - "AssignmentLine.${al1} body carries assignment_id, order_line_id, units_assigned 2, units_picked 0, units_cancelled 2 and NO version field"
            - "RoutingCandidate.${cand1} body carries routing_run_id ${run1}, store_id ${s1}, iteration 1, eligible true, coverage_units 2, coverage_ratio 1.0000, selected true, assigned_units 2 and NO version field"
            - "CustomerNotification.${n1} body carries order_id ${o1}, notification_type CANCELLATION_FULL, units_affected 2, channel EMAIL and NO version field"
