  # ===========================================================================
  - section: errors
    instances:
      - name: if_match_cross_territory_staging_rejected
        claim_type: Violation to Error
        grounds:
          - errors[ERR_CROSS_TERRITORY]
          - state_machines.Vehicle.transitions.DRAFT_to_AT_DEPOT
        distinguishing_aspect: "Staging a vehicle at a depot that belongs to a different territory is rejected with ERR_CROSS_TERRITORY, while the same depot in the vehicle's own territory succeeds."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. Two ACTIVE territories, a depot under the second, and a DRAFT vehicle under the first."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - call: "POST /fleet/territories"
              payload: { name: "Tucson", region_code: "TUC-METRO", mapped_pct: 100, validation_hours: 120, road_type_risk: "LOW" }
              as: TerritoryPlanner
              captures: { t2_id: $.data.id }
            - call: "POST /fleet/territories/${t2_id}/depots"
              payload: { name: "Depot B", charge_positions: 2, cleaning_positions: 2, calib_positions: 2, software_positions: 2 }
              as: TerritoryPlanner
              captures: { d2_id: $.data.id }
            - *c_v1
          trigger:
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d2_id}" }
              as: FleetOperations
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id == ERR_CROSS_TERRITORY and http == 409"
            - "Vehicle.${v1_id}.status == DRAFT and current_depot_id == null"

      - name: if_match_match_ride_stale_vehicle_version_rejected
        claim_type: Violation to Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[match-ride-stale-vehicle]
        distinguishing_aspect: "OCC on the vehicle: matching a ride while carrying an expected_vehicle_version one below the vehicle's current version is rejected with ERR_STALE_VERSION 412, and the ride stays REQUESTED."
        test_recipe:
          setup: ["Logical clock at 2026-06-01T00:00:00Z. One ACTIVE territory with one IN_SERVICE vehicle, a SAFE curb with an ACTIVE STANDARD curb rule, and a REQUESTED ride. The client holds ${occ_token}, one below the vehicle's live version."]
          setup_api_calls:
            - *c_clock
            - *c_t
            - *c_d
            - *c_v1
            - call: "POST /fleet/vehicles/${v1_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - *c_cy1
            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
            - *c_rts1
            - *c_getv1
            - *c_safe
            - *c_curb_ok
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-occ-veh" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token} - 1" }
              as: FleetOperations
              captures: { stale_err: $.data.error_id }
          assert:
            - "the response error_id == ERR_STALE_VERSION and http == 412"
            - "RideRequest.${r1_id}.status == REQUESTED and vehicle_id == null"
            - "Vehicle.${v1_id}.service_status == DISPATCHED and version == ${occ_token}"
      - name: if_match_err_team_capacity_stub
        claim_type: Violation to Error
        grounds:
          - errors[ERR_TEAM_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / if_match_roadside_team_capacity_boundary
          rationale: "Asserted as the failure path of the named §1.8 boundary instance."

