  # =====================================================================
  # Rule 4: transitive_cascade — depth >= 3 and >= 2, different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: no_show_strike_to_suspension_cascade
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - calculations.no_show_suspension_ladder
        distinguishing_aspect: |
          Depth 3 chain triggered by the clock sweep: Reservation CONFIRMED ->
          NO_SHOW inserts NoShowStrike (link 1); the strike insert recomputes
          Member.no_show_strikes_active to 3 which fires Member ACTIVE ->
          SUSPENDED (link 2); the suspension cascades the member's other still-
          future CONFIRMED reservation to CANCELLED and force-pauses the
          subscription (link 3). Different trigger from the subscription-cancel
          cascade. Weekly quota is 4 so three no-show showtimes can be held
          alongside the fourth future one.
