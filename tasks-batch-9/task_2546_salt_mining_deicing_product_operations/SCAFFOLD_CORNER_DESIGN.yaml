      - name: same_lab_user_cannot_create_and_pass_the_same_batch
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - "validations[priority=3]"
          - entities.TreatmentBatch.fields.created_by_user_id
        distinguishing_aspect: |
          The role is sufficient but the identity is not: the same QualityLab X-User-ID that created
          the batch is refused with 403 ERR_SEGREGATION_OF_DUTIES, while a second QualityLab user
          passes the identical batch. Priority 3 also outranks every business check, so the refusal
          happens even though the batch would otherwise pass QC cleanly.
        test_recipe:
          setup:
            - "A PENDING HIGHWAY_DEICING batch created by X-User-ID 'ql-maker-1' on a hoisted run at Syracuse Depot."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id", maker: "$.data.created_by_user_id" }
          trigger:
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-maker-1"
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
              captures: { qc: "$.data.qc_state", decider: "$.data.qc_decided_by_user_id" }
          assert:
            - "${maker} == 'ql-maker-1'"
            - "call 1 -> HTTP 403 with error code ERR_SEGREGATION_OF_DUTIES, and the batch is still PENDING with version 1"
            - "no StockpileLot exists after call 1 and Depot.${depot_a}.covered_stored_tons == 0"
            - "call 2 -> HTTP 200 with ${qc} == PASSED and ${decider} == 'ql-checker-1'"
            - "the minted lot has tons_on_hand == 940.00"

      - name: compliance_officer_cannot_cite_on_its_own_inspection
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - "validations[priority=3]"
          - entities.GroundControlInspection.fields.inspector_user_id
        distinguishing_aspect: |
          The second, structurally different segregation pair: the evidence author and the enforcement
          author must differ, and the identity being compared lives on a *different* entity
          (GroundControlInspection.inspector_user_id) than the one being written (Mine). An
          implementation that only guards the QC pair passes the previous instance and fails this one.
        test_recipe:
          setup:
            - "Mine with a PRODUCING panel and a CLEAR inspection recorded by inspector 'gce-dual', who also holds the ComplianceOfficer role."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/ground-control-inspections"
              payload: { panel_id: "${panel_id}", roof_span_ft: 40, convergence_rate_in_per_day: 0.010, finding: "CLEAR" }
              as: GroundControlEngineer
              as_user_id: "gce-dual"
              captures: { insp_id: "$.data.id", inspector: "$.data.inspector_user_id" }
          trigger:
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "CITE", inspection_id: "${insp_id}", note: "self-citation attempt" }
              as: ComplianceOfficer
              as_user_id: "gce-dual"
            - call: "POST /salt/mines/${mine_id}/compliance-action"
              payload: { action: "CITE", inspection_id: "${insp_id}", note: "MSHA 104(a) citation on a colleague's inspection" }
              as: ComplianceOfficer
              as_user_id: "co-independent"
              captures: { cstate: "$.data.compliance_state", eff: "$.data.effective_hoist_tons_per_day" }
          assert:
            - "${inspector} == 'gce-dual'"
            - "call 1 -> HTTP 403 with error code ERR_SEGREGATION_OF_DUTIES and Mine.${mine_id}.compliance_state is still COMPLIANT"
            - "call 2 -> HTTP 200 with ${cstate} == CITED and ${eff} == 19200.00 (24000 * 1.00 * 0.80)"
            - "Mine.${mine_id}.last_compliance_action_at == '2026-08-01T00:00:00Z' (the default logical clock)"
            - "the CLEAR inspection never opened a defect, so the panel is still PRODUCING"

  # ===========================================================================
  # 8. From Cross-Cutting Complexity Layers
  #    complexity_profile.complexity_layers = [optimistic_concurrency,
  #    cascading_side_effects, dual_variant_calculation, rate_threshold_triggers].
  #    One instance per layer; the three OCC rules of §1.2.1 each get their own
  #    stale-version probe.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: run_create_with_a_stale_mine_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[run_scheduling_against_mine]
          - errors[ERR_STALE_MINE_VERSION]
          - "validations[priority=10]"
        distinguishing_aspect: |
          The version read before an interleaved hoist-status write must be refused with 412
          ERR_STALE_MINE_VERSION, and the freshly re-read version must then succeed — proving the
          token is compared against live Mine.version rather than merely being present. The
          interleaving write is on the *other* state dimension, so the OCC token protects the whole
          Mine row, not just the field being scheduled against.
        test_recipe:
          setup:
            - "Mine with a PRODUCING panel; the planner captures Mine.version and then a hoist derate bumps it."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { stale_v: "$.data.version" }
            - call: "POST /salt/mines/${mine_id}/hoist-status"
              payload: { hoist_state: "HOIST_DERATED", note: "one skip out of service" }
              as: MinePlanner
              captures: { fresh_v: "$.data.version" }
          trigger:
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${stale_v}" }
              as: MinePlanner
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${fresh_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
          assert:
            - "${fresh_v} == ${stale_v} + 1"
            - "call 1 -> HTTP 412 with error code ERR_STALE_MINE_VERSION and no run row is created"
            - "call 2 -> HTTP 201 with status SCHEDULED"
            - "Mine.${mine_id}.version == ${fresh_v} + 1 — the successful create bumped it again"
            - "Mine.${mine_id}.scheduled_hoist_tons_open == 1000.00 and effective_hoist_tons_per_day == 13200.00"
            - "ProductionRun.${run_id}.planned_tons_per_hour == 41.6667, inside the derated 550.00 t/h ceiling"

      - name: order_create_with_a_stale_bid_contract_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order_placement_against_contract]
          - errors[ERR_STALE_BID_CONTRACT_VERSION]
          - "validations[priority=10]"
        distinguishing_aspect: |
          Two orders placed back to back against one contract: the second must not reuse the version
          the first consumed. The 412 arrives even though the take band has plenty of room, which
          separates the OCC token from every fiscal check on the same endpoint.
        test_recipe:
          setup:
            - "An ACTIVE 1000 t NY contract (min_take 0 so no stockpile is required) and one order already placed with the activation-time version."
          setup_api_calls:
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 5000, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
