              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { imp: $.data.total_import_kwh, energy: $.data.energy_charge_cents, due: $.data.total_due_cents }
          assert:
            - "Bill.${bill_id}.total_import_kwh == 0"
            - "Bill.${bill_id}.energy_charge_cents == 0"
            - "Bill.${bill_id}.demand_charge_cents == 0"
            - "Bill.${bill_id}.total_due_cents == 1000"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disconnect_notice_depends_on_assistance_grant_state
        grounds:
          - state_machines.Account.ACTIVE_to_DISCONNECT_PENDING
          - validations[priority=11]
          - entities.AssistanceGrant.fields.status
          - errors[ERR_ASSISTANCE_SHIELD]
        distinguishing_aspect: |
          Entity pair Account->AssistanceGrant: the Account's ACTIVE->DISCONNECT_PENDING transition is
          blocked while a PLEDGED/APPLIED AssistanceGrant exists. Cancelling the grant (grant->CANCELLED)
          then permits the same disconnect-notice. Distinct pair from Bill->Tariff below.
        test_recipe:
          setup:
            - "Account L IN_ARREARS with a PLEDGED grant; disconnect blocked, then grant cancelled, disconnect succeeds"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-XEN-L", name: "CrossEnt L", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
