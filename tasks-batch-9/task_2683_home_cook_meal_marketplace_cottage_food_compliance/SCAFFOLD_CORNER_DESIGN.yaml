            - "${sum_ytd} == 700, ${sum_remaining} == 4999300 == 5000000 - 700, ${sum_score} == 88, ${sum_prov} == 88 and ${sum_open} == 0 - with nothing left in INTAKE or TRIAGED the two variants coincide"
            - "re-reading any of these endpoints a second time returns identical values: there is no lag to observe and no read-repair step"
