  - rule_id: compensating_invariant
    instances:
      - name: intake_outcome_count_conservation_across_adoption_return
        grounds:
          - calculations.intake_outcome_conservation
          - state_machines.IntakeRecord.CLOSED_to_VOIDED
          - state_machines.Animal.OUTCOME_CLOSED_to_IN_CUSTODY
          - conservation_invariants[intake_outcome_count_conservation]
        distinguishing_aspect: |
          The conserved quantity is a COUNT of custody episodes: before the return the animal has
          1 non-VOIDED IntakeRecord, 1 standing OutcomeRecord and 0 in-custody animals (1 == 1 +
          0); after the return it has 1 non-VOIDED IntakeRecord, 0 standing OutcomeRecords and 1
          in-custody animal (1 == 0 + 1). The forward action and its compensation leave the
          identity untouched, with zero drift.
        test_recipe:
          setup:
            - "Clock at 2026-06-10T00:00:00Z."
            - "One altered senior DOG, OWNER_SURRENDER intaken 2026-05-01, adopted on 2026-06-01 with adopter_charged_cents 25000 and no sponsorship."
            - "The adoption's OutcomeRecord stands unreversed and the original IntakeRecord is CLOSED."
