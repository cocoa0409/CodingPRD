# =============================================================================
# Brokerage Account & Options Approval — scaffold seed tables (Expert band)
# =============================================================================

scenario: "74. Brokerage Account & Options Approval: account opening (KYC/W-9), Options Level 1-4 approval, margin (Reg T/PMA), limit/stop/take-profit orders, Pattern Day Trader rule, ACAT transfer"

domain_name: brokerage-options-approval
api_prefix: ""   # flat topology: Account, Order, OptionsApproval, MarginUpgrade, Position, DayTrade, AcatTransfer are peer top-level collections

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # Reg T buying power vs Portfolio Margin buying power
    - cascading_side_effects        # account restriction cascades to open orders + approvals
    - rate_threshold_triggers       # Pattern-Day-Trader 4-day-trade / 5-day-window / $25k equity boundary
    - optimistic_concurrency        # OCC on Account.version for level-grant and margin-upgrade races

  entity_topology: flat
  # Account is the hub; OptionsApproval, MarginUpgrade, Order, DayTrade, AcatTransfer,
  # Position are peer entities linked by FK to Account (and to each other), addressed
  # by their own top-level collections — no deep URL nesting.

  state_machine_shape: branching
  # OptionsApproval and MarginUpgrade are approve/reject fork-join with divergent
  # side-effects; AcatTransfer has a cancellable branch; Order has a cyclic
  # fill/partial path. Account is compound (status derived-gated).

  relationship_patterns:
    - one_to_many        # Account -> {Order, OptionsApproval, MarginUpgrade, AcatTransfer, Position, DayTrade}
    - cross_aggregate    # Order references Position; DayTrade references Order

  role_model: segregation_of_duties
  # A ComplianceOfficer who SUBMITTED an options-level or margin application cannot
  # also APPROVE it (same X-User-ID barred from both steps). AccountHolder opens
  # accounts and places orders; Custodian executes ACAT transfers.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: account_holder_user_id, type: string, source: input, description: "Opaque X-User-ID of the AccountHolder who owns this account; ownership is compared against this field" }
      - { name: legal_name, type: string, source: input, description: "Account holder legal name (KYC)" }
      - { name: tax_id, type: string, source: input, description: "SSN/EIN supplied on the W-9 (KYC)" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used for the 18-years-of-age KYC gate" }
      - { name: w9_certified, type: boolean, source: input, description: "True if the W-9 backup-withholding certification box was signed at submission", default: false }
      - { name: liquid_net_worth_cents, type: integer, source: input, description: "Self-reported liquid net worth in cents; feeds the options-level suitability gate" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported annual income in cents" }
      - { name: investment_experience, type: enum, source: input, description: "NONE | LIMITED | GOOD | EXTENSIVE — suitability input for options level" }
      - { name: status, type: enum, source: system, description: "PENDING_KYC | ACTIVE | RESTRICTED | CLOSED", constraints: "PENDING_KYC|ACTIVE|RESTRICTED|CLOSED" }
      - { name: options_level, type: integer, source: system, description: "Approved options trading level 0-4; 0 means no options permitted", default: 0, constraints: "0..4" }
      - { name: margin_type, type: enum, source: system, description: "CASH | REG_T | PMA — current margin agreement on the account", default: CASH, constraints: "CASH|REG_T|PMA" }
      - { name: cash_balance_cents, type: integer, source: input, description: "Settled cash on deposit in cents", default: 0 }
      - { name: maintenance_margin_cents, type: integer, source: computed, description: "Sum of per-position maintenance requirements; see calc maintenance_margin_requirement" }
      - { name: buying_power_cents, type: integer, source: computed, description: "Available buying power under the account's margin_type; see calc buying_power (dual-variant Reg T vs PMA)" }
      - { name: equity_cents, type: integer, source: computed, description: "cash_balance_cents + sum(Position.market_value_cents) over OPEN positions" }
      - { name: day_trade_count, type: integer, source: computed, description: "Count of DayTrade rows for this account whose trade_date is within the trailing 5-business-day window anchored at the account's most recent DayTrade.trade_date (0 when the account has no DayTrade rows); see calc pattern_day_trader_status", default: 0 }
      - { name: pdt_flagged, type: boolean, source: computed, description: "True once the account is marked a Pattern Day Trader; see calc pattern_day_trader_status", default: false }

  - name: OptionsApproval
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account requesting an options-level grant" }
      - { name: requested_level, type: integer, source: input, description: "Requested options level 1-4", constraints: "1..4" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ComplianceOfficer who SUBMITTED the application; segregation-of-duties bars this user from approving" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ComplianceOfficer who APPROVED or REJECTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED", constraints: "DRAFT|SUBMITTED|APPROVED|REJECTED" }
      - { name: rejection_reason, type: string, source: input, description: "Free-text reason supplied on REJECTED transition", default: null }

  - name: MarginUpgrade
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account requesting a margin-agreement upgrade" }
      - { name: requested_margin_type, type: enum, source: input, description: "REG_T | PMA — the margin agreement requested", constraints: "REG_T|PMA" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ComplianceOfficer who SUBMITTED; segregation-of-duties bars this user from approving" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the ComplianceOfficer who APPROVED or REJECTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED", constraints: "DRAFT|SUBMITTED|APPROVED|REJECTED" }
      - { name: expected_account_version, type: integer, source: input, description: "OCC: Account.version the client last observed; APPROVE rejects if stale" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account holding this position" }
      - { name: symbol, type: string, source: input, description: "Ticker symbol of the held security" }
      - { name: instrument_type, type: enum, source: input, description: "EQUITY | OPTION — drives the maintenance-margin rate", constraints: "EQUITY|OPTION" }
      - { name: quantity, type: integer, source: input, description: "Signed share/contract count; positive long, negative short" }
      - { name: market_value_cents, type: integer, source: input, description: "Current marked market value of the position in cents (signed)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "OPEN|CLOSED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account placing this order" }
      - { name: symbol, type: string, source: input, description: "Ticker symbol being traded" }
      - { name: instrument_type, type: enum, source: input, description: "EQUITY | OPTION — OPTION orders gated by options_level", constraints: "EQUITY|OPTION" }
      - { name: side, type: enum, source: input, description: "BUY | SELL", constraints: "BUY|SELL" }
      - { name: order_type, type: enum, source: input, description: "LIMIT | STOP | TAKE_PROFIT — see calc trigger_eligibility", constraints: "LIMIT|STOP|TAKE_PROFIT" }
      - { name: quantity, type: integer, source: input, description: "Order quantity in shares/contracts; must be > 0", constraints: "> 0" }
      - { name: limit_price_cents, type: integer, source: input, description: "Limit price in cents; required for LIMIT and TAKE_PROFIT orders", default: null }
      - { name: stop_price_cents, type: integer, source: input, description: "Stop trigger price in cents; required for STOP and TAKE_PROFIT orders", default: null }
      - { name: notional_cents, type: integer, source: computed, description: "Worst-case cash impact reserved at acceptance; see calc order_notional" }
      - { name: opened_position_same_day, type: boolean, source: input, description: "True if this order opens (or adds to) a position the account also closed the same trade_date — used to mark the order as the closing leg of a day trade", default: false }
      - { name: trade_date, type: string, source: input, description: "Business date YYYY-MM-DD on which the order executes; feeds the trailing PDT window" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACCEPTED | FILLED | PARTIALLY_FILLED | CANCELLED | REJECTED", constraints: "DRAFT|ACCEPTED|FILLED|PARTIALLY_FILLED|CANCELLED|REJECTED" }
      - { name: filled_quantity, type: integer, source: system, description: "Cumulative filled quantity across fills", default: 0 }

  - name: DayTrade
    parent: null
    common_fields: false   # append-only event row: id + created_at only
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account that executed the day trade" }
      - { name: closing_order_id, type: string, source: input, description: "FK -> Order.id; the order whose same-day close completed this round trip" }
      - { name: symbol, type: string, source: input, description: "Ticker symbol of the round trip" }
      - { name: trade_date, type: string, source: input, description: "Business date YYYY-MM-DD of the round trip; the trailing-window membership key" }

  - name: AcatTransfer
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the receiving (transfer-in) or delivering (transfer-out) account" }
      - { name: direction, type: enum, source: input, description: "IN | OUT — ACAT transfer direction relative to this account", constraints: "IN|OUT" }
      - { name: counterparty_dtc, type: string, source: input, description: "DTC clearing number of the contra brokerage" }
      - { name: transfer_value_cents, type: integer, source: input, description: "Total marked value of the assets being transferred in cents" }
      - { name: status, type: enum, source: system, description: "REQUESTED | VALIDATED | SETTLED | REJECTED | CANCELLED", constraints: "REQUESTED|VALIDATED|SETTLED|REJECTED|CANCELLED" }
      - { name: reject_code, type: enum, source: input, description: "ACAT reject reason supplied on REJECTED transition: SSN_MISMATCH | TITLE_MISMATCH | ACCT_FROZEN", default: null, constraints: "SSN_MISMATCH|TITLE_MISMATCH|ACCT_FROZEN" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: PENDING_KYC
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_KYC
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "w9_certified == true (ERR_W9_NOT_CERTIFIED)"
          - "account holder is at least 18 years old on created_at date (ERR_KYC_AGE)"
          - "tax_id is present and non-empty (ERR_KYC_INCOMPLETE)"
        side_effects:
          - "status = ACTIVE"
          - "increments Account.version by 1"

      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /accounts/{accountId}/restrict  OR  cascade from pattern_day_trader_status when pdt_flagged becomes true and equity_cents < PDT_MIN_EQUITY_CENTS"
        actor: ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "status = RESTRICTED"
          - "every Order on this account in {DRAFT, ACCEPTED, PARTIALLY_FILLED} transitions to CANCELLED (cascade)"
          - "every OptionsApproval on this account in {DRAFT, SUBMITTED} transitions to REJECTED with rejection_reason = 'ACCOUNT_RESTRICTED' (cascade)"
          - "increments Account.version by 1"

      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "equity_cents >= PDT_MIN_EQUITY_CENTS when pdt_flagged == true (ERR_PDT_EQUITY_CALL)"
        side_effects:
          - "status = ACTIVE"
          - "increments Account.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{accountId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "no Position on this account in status OPEN (ERR_OPEN_POSITIONS)"
          - "no AcatTransfer on this account in {REQUESTED, VALIDATED} (ERR_PENDING_TRANSFER)"
        side_effects:
          - "status = CLOSED"
          - "increments Account.version by 1"

      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /accounts/{accountId}/close"
        actor: ComplianceOfficer
        preconditions:
          - "no Position on this account in status OPEN (ERR_OPEN_POSITIONS)"
          - "no AcatTransfer on this account in {REQUESTED, VALIDATED} (ERR_PENDING_TRANSFER)"
        side_effects:
          - "status = CLOSED"
          - "increments Account.version by 1"

  - entity: OptionsApproval
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /options-approvals/{approvalId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "parent Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "requested_level == Account.options_level + 1 (ERR_LEVEL_SKIP) — levels are granted one rung at a time"
        side_effects:
          - "status = SUBMITTED"
          - "submitted_by_user_id = X-User-ID"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /options-approvals/{approvalId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "suitability gate passes for requested_level (ERR_SUITABILITY_NOT_MET) — see calc options_suitability_gate"
        side_effects:
          - "status = APPROVED"
          - "decided_by_user_id = X-User-ID"
          - "Account.options_level = requested_level (cross-entity)"
          - "increments Account.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /options-approvals/{approvalId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = REJECTED"
          - "decided_by_user_id = X-User-ID"
          - "rejection_reason set from request body"

  - entity: MarginUpgrade
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /margin-upgrades/{upgradeId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "parent Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "requested_margin_type != Account.margin_type (ERR_MARGIN_NOOP)"
          - "if requested_margin_type == PMA then Account.equity_cents >= PMA_MIN_EQUITY_CENTS (ERR_PMA_EQUITY_MINIMUM)"
        side_effects:
          - "status = SUBMITTED"
          - "submitted_by_user_id = X-User-ID"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /margin-upgrades/{upgradeId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_account_version matches current Account.version (ERR_STALE_ACCOUNT_VERSION) — OCC"
        side_effects:
          - "status = APPROVED"
          - "decided_by_user_id = X-User-ID"
          - "Account.margin_type = requested_margin_type (cross-entity)"
          - "Account.buying_power_cents recomputed under the new margin_type (cascade; see calc buying_power)"
          - "increments Account.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /margin-upgrades/{upgradeId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status = REJECTED"
          - "decided_by_user_id = X-User-ID"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [FILLED, CANCELLED, REJECTED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /orders/{orderId}/accept"
        actor: AccountHolder
        preconditions:
          - "parent Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "if instrument_type == OPTION then Account.options_level >= 1 (ERR_OPTIONS_NOT_APPROVED)"
          - "order required-price fields present per order_type (ERR_MISSING_PRICE) — see calc trigger_eligibility"
          - "notional_cents <= Account.buying_power_cents (ERR_INSUFFICIENT_BUYING_POWER)"
          - "if this is a same-day closing leg and Account.pdt_flagged == false and Account.equity_cents < PDT_MIN_EQUITY_CENTS and resulting day_trade_count would reach PDT_DAYTRADE_THRESHOLD (ERR_PDT_RULE_BLOCK)"
        side_effects:
          - "status = ACCEPTED"
          - "notional_cents reserved against Account.buying_power_cents (cascade; buying_power recomputed)"

      - from: ACCEPTED
        to: PARTIALLY_FILLED
        trigger: "POST /orders/{orderId}/fill"
        actor: system
        preconditions:
          - "0 < fill_quantity < quantity (ERR_FILL_QUANTITY)"
        side_effects:
          - "filled_quantity += fill_quantity"
          - "status = PARTIALLY_FILLED"

      - from: PARTIALLY_FILLED
        to: PARTIALLY_FILLED
        trigger: "POST /orders/{orderId}/fill"
        actor: system
        preconditions:
          - "0 < filled_quantity + fill_quantity < quantity (ERR_FILL_QUANTITY)"
        side_effects:
          - "filled_quantity += fill_quantity"

      - from: ACCEPTED
        to: FILLED
        trigger: "POST /orders/{orderId}/fill"
        actor: system
        preconditions:
          - "filled_quantity + fill_quantity == quantity (ERR_FILL_QUANTITY)"
        side_effects:
          - "filled_quantity = quantity"
          - "status = FILLED"
          - "if opened_position_same_day == true: a DayTrade row is created for (account_id, this order id, symbol, trade_date) (cascade)"
          - "recompute pattern_day_trader_status on the account; if it newly flags PDT under PDT_MIN_EQUITY_CENTS the account cascades ACTIVE -> RESTRICTED (cascade)"

      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /orders/{orderId}/fill"
        actor: system
        preconditions:
          - "filled_quantity + fill_quantity == quantity (ERR_FILL_QUANTITY)"
        side_effects:
          - "filled_quantity = quantity"
          - "status = FILLED"
          - "if opened_position_same_day == true: a DayTrade row is created (cascade)"
          - "recompute pattern_day_trader_status; PDT flip may cascade account to RESTRICTED (cascade)"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /orders/{orderId}/reject"
        actor: AccountHolder
        preconditions: []
        side_effects:
          - "status = REJECTED"

      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel  OR  cascade from Account ACTIVE -> RESTRICTED"
        actor: AccountHolder | system
        preconditions: []
        side_effects:
          - "status = CANCELLED"
          - "reserved notional_cents released back to Account.buying_power_cents (compensation; buying_power recomputed)"

      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel  OR  cascade from Account ACTIVE -> RESTRICTED"
        actor: AccountHolder | system
        preconditions: []
        side_effects:
          - "status = CANCELLED"
          - "reserved notional on the UNFILLED remainder released back to Account.buying_power_cents (compensation; buying_power recomputed)"

  - entity: AcatTransfer
    initial_state: REQUESTED
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: VALIDATED
        trigger: "POST /acat-transfers/{transferId}/validate"
        actor: Custodian
        preconditions:
          - "parent Account.status in {ACTIVE, RESTRICTED} (ERR_ACCOUNT_NOT_ACTIVE) — frozen/closed accounts cannot validate"
        side_effects:
          - "status = VALIDATED"

      - from: VALIDATED
        to: SETTLED
        trigger: "POST /acat-transfers/{transferId}/settle"
        actor: Custodian
        preconditions:
          - "parent Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "status = SETTLED"
          - "if direction == IN: Account.cash_balance_cents += transfer_value_cents and buying_power recomputed (cross-entity cascade)"
          - "if direction == OUT: Account.cash_balance_cents -= transfer_value_cents and buying_power recomputed (cross-entity cascade)"
          - "increments Account.version by 1"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /acat-transfers/{transferId}/reject"
        actor: Custodian
        preconditions:
          - "reject_code present in request body (ERR_MISSING_REJECT_CODE)"
        side_effects:
          - "status = REJECTED"

      - from: VALIDATED
        to: REJECTED
        trigger: "POST /acat-transfers/{transferId}/reject"
        actor: Custodian
        preconditions:
          - "reject_code present in request body (ERR_MISSING_REJECT_CODE)"
        side_effects:
          - "status = REJECTED"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /acat-transfers/{transferId}/cancel"
        actor: AccountHolder
        preconditions: []
        side_effects:
          - "status = CANCELLED"

  - entity: Position
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /positions/{positionId}/close"
        actor: AccountHolder
        preconditions:
          - "parent Account.status in {ACTIVE, RESTRICTED} (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "status = CLOSED"
          - "Account.maintenance_margin_cents recomputed excluding this position (cross-entity cascade)"
          - "Account.equity_cents and buying_power_cents recomputed (cascade)"

# ---------------------------------------------------------------------------
# Table 1.2.1: Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: margin-upgrade-approve-stale-account
    parent_entity: Account
    write_endpoint: "POST /margin-upgrades/{upgradeId}/approve"
    occ_field: "expected_account_version"
    description: |
      Approving a MarginUpgrade against an Account whose version has advanced
      since the ComplianceOfficer last observed it is rejected. This captures the
      case where another writer has already changed the account's margin_type or
      buying-power-affecting fields (e.g. a settled ACAT transfer-in or a prior
      margin upgrade) so the approver's view of the account is stale and the new
      buying-power recomputation would be based on out-of-date inputs.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: buying_power
    trigger: "Account read; recomputed on margin_type change, position open/close, order accept/cancel, ACAT settle"
    algorithm: dual_variant
    formula: |
      excess_equity_cents = equity_cents - maintenance_margin_cents - reserved_order_notional_cents
      where reserved_order_notional_cents = sum(Order.notional_cents for Orders on this account
            in status {ACCEPTED, PARTIALLY_FILLED}, counting only the UNFILLED remainder for
            PARTIALLY_FILLED: notional_cents * (quantity - filled_quantity) / quantity, integer-floored)

      CASH:  buying_power_cents = max(0, cash_balance_cents - reserved_order_notional_cents)
      REG_T: buying_power_cents = max(0, 2 * excess_equity_cents)        # Reg-T initial 50% -> 2x
      PMA:   buying_power_cents = max(0, floor(equity_cents / PMA_INITIAL_MARGIN_RATE) - maintenance_margin_cents - reserved_order_notional_cents)
    input_set: "Positions in status OPEN; Orders in status {ACCEPTED, PARTIALLY_FILLED}"
    constants:
      PMA_INITIAL_MARGIN_RATE: 0.15      # PMA uses a 15% risk-based initial requirement
      PMA_MIN_EQUITY_CENTS: 15000000     # $150,000.00 equity floor to qualify for Portfolio Margin
    precision: "integer cents, floor on every division"
    variants:
      - name: reg_t_buying_power
        when: "Account.margin_type == REG_T"
        difference: "Reg-T grants 2x excess equity (50% initial); maintenance and reserved notional already netted into excess_equity_cents"
      - name: pma_buying_power
        when: "Account.margin_type == PMA"
        difference: "PMA divides total equity by the 15% risk-based initial rate, then subtracts maintenance and reserved notional — a strictly larger pool than Reg-T for the same equity"

  - name: maintenance_margin_requirement
    trigger: "position open/close; ACAT settle; recomputed before any order accept buying-power check"
    algorithm: aggregation
    formula: |
      maintenance_margin_cents = sum over OPEN Positions of:
        if instrument_type == EQUITY: floor(abs(market_value_cents) * EQUITY_MAINT_RATE)
        if instrument_type == OPTION: floor(abs(market_value_cents) * OPTION_MAINT_RATE)
      Positions are summed in created_at ASC order; floor is applied PER POSITION
      then summed (round-per-line-item-then-sum, NOT sum-then-round).
    input_set: "Positions in status OPEN only; CLOSED positions excluded"
    constants:
      EQUITY_MAINT_RATE: 0.25
      OPTION_MAINT_RATE: 1.00
    precision: "integer cents, floor per position then sum"

  - name: pattern_day_trader_status
    trigger: "Order FILLED transition where opened_position_same_day == true"
    algorithm: threshold
    formula: |
      anchor_date = max(DayTrade.trade_date over the account's DayTrade rows); if none, day_trade_count = 0.
      window_start = anchor_date - PDT_WINDOW_BUSINESS_DAYS calendar days (rolling trailing window, inclusive of anchor_date)
      day_trade_count = count(DayTrade rows for this account whose trade_date is within
                              [window_start, anchor_date] inclusive)
      if day_trade_count >= PDT_DAYTRADE_THRESHOLD:
        pdt_flagged = true
      A newly-flagged account whose equity_cents < PDT_MIN_EQUITY_CENTS is moved
      ACTIVE -> RESTRICTED (the equity call). At exactly PDT_DAYTRADE_THRESHOLD-1
      day trades the account is NOT flagged; the 4th day trade flips it.

      Accept-time preventive block (POST /orders/{id}/accept on a same-day closing
      leg): let prospective = day_trade_count over existing DayTrade rows whose
      trade_date == the order's trade_date, PLUS 1 for this order. If the account
      is not yet pdt_flagged, equity_cents < PDT_MIN_EQUITY_CENTS, and prospective
      >= PDT_DAYTRADE_THRESHOLD, reject with ERR_PDT_RULE_BLOCK.
    input_set: "DayTrade rows for the account within the trailing 5-business-day window"
    constants:
      PDT_DAYTRADE_THRESHOLD: 4          # 4 or more day trades in the window
      PDT_WINDOW_BUSINESS_DAYS: 5
      PDT_MIN_EQUITY_CENTS: 2500000      # $25,000.00 equity floor for pattern day traders

  - name: order_notional
    trigger: "Order accept (computed before the buying-power precondition)"
    algorithm: threshold
    formula: |
      base = quantity * price_per_unit_cents
      where price_per_unit_cents is selected by order_type:
        LIMIT:        limit_price_cents
        TAKE_PROFIT:  max(limit_price_cents, stop_price_cents)   # worst-case of the two legs
        STOP:         stop_price_cents
      OPTION instrument multiplies contract size:
        notional_cents = base * (OPTION_CONTRACT_MULTIPLIER if instrument_type == OPTION else 1)
      SELL orders against an existing OPEN long position reserve 0 (closing a long frees, not consumes):
        if side == SELL and account has an OPEN Position with same symbol and quantity > 0: notional_cents = 0
    input_set: "single Order plus the account's OPEN Positions for the same symbol"
    constants:
      OPTION_CONTRACT_MULTIPLIER: 100
    precision: "integer cents"

  - name: options_suitability_gate
    trigger: "OptionsApproval SUBMITTED -> APPROVED"
    algorithm: threshold
    formula: |
      Let combined_cents = liquid_net_worth_cents + annual_income_cents.
      exp_rank = {NONE:0, LIMITED:1, GOOD:2, EXTENSIVE:3}[investment_experience]
      Approve requested_level only if BOTH hold:
        combined_cents >= LEVEL_MIN_COMBINED_CENTS[requested_level]
        exp_rank       >= LEVEL_MIN_EXP_RANK[requested_level]
      Otherwise ERR_SUITABILITY_NOT_MET. The thresholds are evaluated against the
      requested_level (not the current level); level 4 demands the strictest pair.
    input_set: "the parent Account suitability fields at approval time"
    constants:
      LEVEL_MIN_COMBINED_CENTS: { 1: 0, 2: 5000000, 3: 10000000, 4: 25000000 }   # $0 / $50k / $100k / $250k
      LEVEL_MIN_EXP_RANK:       { 1: 0, 2: 1, 3: 2, 4: 3 }

  - name: trigger_eligibility
    trigger: "Order accept — required-price validation per order_type"
    algorithm: matching
    formula: |
      LIMIT:        limit_price_cents required (non-null, > 0); stop_price_cents ignored
      STOP:         stop_price_cents required (non-null, > 0); limit_price_cents ignored
      TAKE_PROFIT:  BOTH limit_price_cents AND stop_price_cents required (non-null, > 0)
      A missing required field for the declared order_type -> ERR_MISSING_PRICE.
    input_set: "single Order"
    precision: "n/a"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "Segregation of duties: approver/rejecter X-User-ID differs from submitter on options-approval and margin-upgrade decisions"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /options-approvals/{id}/approve, /reject; POST /margin-upgrades/{id}/approve, /reject"

  - priority: 6
    category: business_safety
    check: "KYC completeness on activation: W-9 certified, tax_id present, holder >= 18 on created_at"
    error_id: "ERR_W9_NOT_CERTIFIED / ERR_KYC_AGE / ERR_KYC_INCOMPLETE"
    http_status: 422
    applies_to: "POST /accounts/{id}/activate from PENDING_KYC"

  - priority: 7
    category: business_safety
    check: "Options-level suitability gate must pass for requested_level on approval"
    error_id: ERR_SUITABILITY_NOT_MET
    http_status: 422
    applies_to: "POST /options-approvals/{id}/approve"

  - priority: 8
    category: business_safety
    check: "OPTION orders require Account.options_level >= 1"
    error_id: ERR_OPTIONS_NOT_APPROVED
    http_status: 422
    applies_to: "POST /orders/{id}/accept"

  - priority: 9
    category: business_constraint
    check: "Options levels are granted one rung at a time: requested_level == options_level + 1"
    error_id: ERR_LEVEL_SKIP
    http_status: 422
    applies_to: "POST /options-approvals/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "Order required-price fields present for the declared order_type"
    error_id: ERR_MISSING_PRICE
    http_status: 422
    applies_to: "POST /orders/{id}/accept"

  - priority: 11
    category: business_constraint
    check: "PMA upgrade requires equity_cents >= PMA_MIN_EQUITY_CENTS"
    error_id: ERR_PMA_EQUITY_MINIMUM
    http_status: 422
    applies_to: "POST /margin-upgrades/{id}/submit"

  - priority: 12
    category: business_safety
    check: "Pattern-Day-Trader block: a same-day closing leg that would reach the 4-day-trade threshold while equity_cents < $25,000 and not yet flagged is blocked at accept"
    error_id: ERR_PDT_RULE_BLOCK
    http_status: 409
    applies_to: "POST /orders/{id}/accept"

  - priority: 13
    category: business_fiscal
    check: "Order notional must not exceed Account.buying_power_cents under the active margin_type"
    error_id: ERR_INSUFFICIENT_BUYING_POWER
    http_status: 409
    applies_to: "POST /orders/{id}/accept"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_account_version must equal current Account.version on margin-upgrade approval"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /margin-upgrades/{id}/approve"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Account ---
  - method: POST
    path: "/accounts"
    description: "Open a brokerage account (KYC/W-9 intake)"
    roles: [AccountHolder]
    code: 201
    input: [account_holder_user_id, legal_name, tax_id, date_of_birth, w9_certified, liquid_net_worth_cents, annual_income_cents, investment_experience, "cash_balance_cents?"]
    output: Account
    side_effects: ["status=PENDING_KYC, options_level=0, margin_type=CASH"]

  - method: GET
    path: "/accounts/{accountId}"
    description: "Get an account with computed buying_power, equity, day_trade_count"
    roles: [AccountHolder, ComplianceOfficer, Custodian]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts (paginated), optionally filtered by holder"
    roles: [ComplianceOfficer]
    code: 200
    input: ["account_holder_user_id?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/accounts/{accountId}/activate"
    description: "Activate a PENDING_KYC or restore a RESTRICTED account"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status->ACTIVE per state machine; increments Account.version by 1"]

  - method: POST
    path: "/accounts/{accountId}/restrict"
    description: "Restrict an ACTIVE account; cascades order cancellation and pending-approval rejection"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status->RESTRICTED; cancels open orders; rejects pending OptionsApprovals; increments Account.version by 1"]

  - method: POST
    path: "/accounts/{accountId}/close"
    description: "Close an account with no open positions or pending transfers"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status->CLOSED; increments Account.version by 1"]

  # --- OptionsApproval ---
  - method: POST
    path: "/options-approvals"
    description: "Create a DRAFT options-level approval application"
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, requested_level]
    output: OptionsApproval
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/options-approvals/{approvalId}"
    description: "Get an options approval"
    roles: [ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: OptionsApproval
    side_effects: []

  - method: GET
    path: "/options-approvals"
    description: "List options approvals, filterable by account_id (FK reverse-reachability)"
    roles: [ComplianceOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: OptionsApproval[]
    side_effects: []

  - method: POST
    path: "/options-approvals/{approvalId}/submit"
    description: "Submit a DRAFT options approval for decision"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OptionsApproval
    side_effects: ["status=SUBMITTED; submitted_by_user_id=X-User-ID"]

  - method: POST
    path: "/options-approvals/{approvalId}/approve"
    description: "Approve a SUBMITTED options approval (segregation-of-duties + suitability gate)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OptionsApproval
    side_effects: ["status=APPROVED; Account.options_level=requested_level; increments Account.version by 1"]

  - method: POST
    path: "/options-approvals/{approvalId}/reject"
    description: "Reject a SUBMITTED options approval"
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: OptionsApproval
    side_effects: ["status=REJECTED; decided_by_user_id=X-User-ID"]

  # --- MarginUpgrade ---
  - method: POST
    path: "/margin-upgrades"
    description: "Create a DRAFT margin-agreement upgrade application"
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, requested_margin_type]
    output: MarginUpgrade
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/margin-upgrades/{upgradeId}"
    description: "Get a margin upgrade"
    roles: [ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: MarginUpgrade
    side_effects: []

  - method: GET
    path: "/margin-upgrades"
    description: "List margin upgrades, filterable by account_id (FK reverse-reachability)"
    roles: [ComplianceOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: MarginUpgrade[]
    side_effects: []

  - method: POST
    path: "/margin-upgrades/{upgradeId}/submit"
    description: "Submit a DRAFT margin upgrade for decision"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MarginUpgrade
    side_effects: ["status=SUBMITTED; submitted_by_user_id=X-User-ID"]

  - method: POST
    path: "/margin-upgrades/{upgradeId}/approve"
    description: "Approve a SUBMITTED margin upgrade (OCC on Account.version + segregation-of-duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_account_version]
    output: MarginUpgrade
    side_effects: ["status=APPROVED; Account.margin_type=requested_margin_type; buying_power recomputed; increments Account.version by 1"]

  - method: POST
    path: "/margin-upgrades/{upgradeId}/reject"
    description: "Reject a SUBMITTED margin upgrade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MarginUpgrade
    side_effects: ["status=REJECTED; decided_by_user_id=X-User-ID"]

  # --- Position ---
  - method: POST
    path: "/positions"
    description: "Record an OPEN position on an account (drives maintenance margin and equity)"
    roles: [AccountHolder, ComplianceOfficer]
    code: 201
    input: [account_id, symbol, instrument_type, quantity, market_value_cents]
    output: Position
    side_effects: ["status=OPEN; Account.maintenance_margin_cents, equity_cents, buying_power_cents recomputed"]

  - method: GET
    path: "/positions/{positionId}"
    description: "Get a position"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: []
    output: Position
    side_effects: []

  - method: GET
    path: "/positions"
    description: "List positions, filterable by account_id (FK reverse-reachability)"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Position[]
    side_effects: []

  - method: POST
    path: "/positions/{positionId}/close"
    description: "Close an OPEN position; recomputes maintenance margin, equity, buying power"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: []
    output: Position
    side_effects: ["status=CLOSED; Account margin/equity/buying-power recomputed"]

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Create a DRAFT order (LIMIT / STOP / TAKE_PROFIT)"
    roles: [AccountHolder]
    code: 201
    input: [account_id, symbol, instrument_type, side, order_type, quantity, "limit_price_cents?", "stop_price_cents?", "opened_position_same_day?", trade_date]
    output: Order
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/orders/{orderId}"
    description: "Get an order with computed notional_cents and filled_quantity"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders, filterable by account_id (FK reverse-reachability)"
    roles: [AccountHolder, ComplianceOfficer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/accept"
    description: "Accept a DRAFT order: validates options level, prices, PDT, buying power; reserves notional"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Order
    side_effects: ["status=ACCEPTED; notional_cents reserved; buying_power recomputed"]

  - method: POST
    path: "/orders/{orderId}/fill"
    description: "Apply a (partial or full) fill; on full fill may create a DayTrade and trip the PDT cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: [fill_quantity]
    output: Order
    side_effects: ["filled_quantity updated; status->PARTIALLY_FILLED/FILLED; DayTrade + PDT cascade on full fill"]

  - method: POST
    path: "/orders/{orderId}/cancel"
    description: "Cancel an ACCEPTED or PARTIALLY_FILLED order; releases reserved notional"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Order
    side_effects: ["status=CANCELLED; reserved notional released; buying_power recomputed"]

  - method: POST
    path: "/orders/{orderId}/reject"
    description: "Reject a DRAFT order"
    roles: [AccountHolder]
    code: 200
    input: []
    output: Order
    side_effects: ["status=REJECTED"]

  # --- DayTrade (read-only discovery for the append-only PDT log) ---
  - method: POST
    path: "/_day-trades/seed"
    description: "Test-driving endpoint: inject N synthetic DayTrade rows for an account on a trade_date, then recompute pattern_day_trader_status (and apply the ACTIVE->RESTRICTED equity-call cascade if it newly flags under PDT_MIN_EQUITY_CENTS). Exists because the accept-time PDT block makes a 4th same-day round trip unreachable through POST /orders under sub-$25k equity, so a flagged+RESTRICTED state cannot be produced by composing business endpoints."
    roles: [ComplianceOfficer]
    code: 201
    input: [account_id, trade_date, count]
    output: Account
    side_effects: ["creates `count` DayTrade rows; recomputes pattern_day_trader_status; may cascade Account ACTIVE->RESTRICTED; increments Account.version by 1 if status changes"]

  - method: GET
    path: "/day-trades/{dayTradeId}"
    description: "Get a single day-trade row"
    roles: [ComplianceOfficer, AccountHolder]
    code: 200
    input: []
    output: DayTrade
    side_effects: []

  - method: GET
    path: "/day-trades"
    description: "List day-trade rows, filterable by account_id (FK reverse-reachability for DayTrade.account_id and closing_order_id discovery)"
    roles: [ComplianceOfficer, AccountHolder]
    code: 200
    input: ["account_id?", "closing_order_id?", "limit?", "offset?"]
    output: DayTrade[]
    side_effects: []

  # --- AcatTransfer ---
  - method: POST
    path: "/acat-transfers"
    description: "Request an ACAT transfer (IN or OUT)"
    roles: [AccountHolder, Custodian]
    code: 201
    input: [account_id, direction, counterparty_dtc, transfer_value_cents]
    output: AcatTransfer
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/acat-transfers/{transferId}"
    description: "Get an ACAT transfer"
    roles: [AccountHolder, Custodian, ComplianceOfficer]
    code: 200
    input: []
    output: AcatTransfer
    side_effects: []

  - method: GET
    path: "/acat-transfers"
    description: "List ACAT transfers, filterable by account_id (FK reverse-reachability)"
    roles: [AccountHolder, Custodian, ComplianceOfficer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: AcatTransfer[]
    side_effects: []

  - method: POST
    path: "/acat-transfers/{transferId}/validate"
    description: "Custodian validates a REQUESTED transfer"
    roles: [Custodian]
    code: 200
    input: []
    output: AcatTransfer
    side_effects: ["status=VALIDATED"]

  - method: POST
    path: "/acat-transfers/{transferId}/settle"
    description: "Settle a VALIDATED transfer; adjusts Account.cash_balance_cents and recomputes buying power"
    roles: [Custodian]
    code: 200
    input: []
    output: AcatTransfer
    side_effects: ["status=SETTLED; Account.cash_balance_cents adjusted; buying_power recomputed; increments Account.version by 1"]

  - method: POST
    path: "/acat-transfers/{transferId}/reject"
    description: "Custodian rejects a REQUESTED or VALIDATED transfer with a reject_code"
    roles: [Custodian]
    code: 200
    input: [reject_code]
    output: AcatTransfer
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/acat-transfers/{transferId}/cancel"
    description: "Account holder cancels a still-REQUESTED transfer"
    roles: [AccountHolder]
    code: 200
    input: []
    output: AcatTransfer
    side_effects: ["status=CANCELLED"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body or missing required input field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/rejecter X-User-ID equals the submitter on an approval decision" }
  - { id: ERR_W9_NOT_CERTIFIED, http: 422, condition: "Activation attempted while w9_certified == false" }
  - { id: ERR_KYC_AGE, http: 422, condition: "Account holder is under 18 on the created_at date" }
  - { id: ERR_KYC_INCOMPLETE, http: 422, condition: "tax_id missing/empty at activation" }
  - { id: ERR_SUITABILITY_NOT_MET, http: 422, condition: "Suitability gate fails for requested options level" }
  - { id: ERR_OPTIONS_NOT_APPROVED, http: 422, condition: "OPTION order on an account with options_level < 1" }
  - { id: ERR_LEVEL_SKIP, http: 422, condition: "requested_level != options_level + 1 on options-approval submit" }
  - { id: ERR_MISSING_PRICE, http: 422, condition: "Required price field absent for the declared order_type" }
  - { id: ERR_MARGIN_NOOP, http: 422, condition: "requested_margin_type equals current Account.margin_type" }
  - { id: ERR_PMA_EQUITY_MINIMUM, http: 422, condition: "PMA upgrade with equity_cents below PMA_MIN_EQUITY_CENTS" }
  - { id: ERR_PDT_RULE_BLOCK, http: 409, condition: "Same-day closing leg would breach the 4-day-trade PDT threshold under $25k equity" }
  - { id: ERR_PDT_EQUITY_CALL, http: 409, condition: "Restore-to-ACTIVE attempted while a flagged PDT account is below the $25k equity minimum" }
  - { id: ERR_INSUFFICIENT_BUYING_POWER, http: 409, condition: "Order notional exceeds available buying power" }
  - { id: ERR_FILL_QUANTITY, http: 422, condition: "fill_quantity is non-positive or would exceed remaining order quantity" }
  - { id: ERR_OPEN_POSITIONS, http: 409, condition: "Account close attempted with OPEN positions" }
  - { id: ERR_PENDING_TRANSFER, http: 409, condition: "Account close attempted with REQUESTED/VALIDATED ACAT transfers" }
  - { id: ERR_MISSING_REJECT_CODE, http: 422, condition: "ACAT reject without a reject_code" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Operation requires the parent account in ACTIVE (or the allowed set) and it is not" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match current Account.version on margin-upgrade approval" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AccountHolder
    description: "The retail customer who owns the account: opens it, manages positions, places/cancels orders, requests and cancels ACAT transfers."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts — open account"
      - "POST /orders — create order"
      - "POST /orders/{id}/accept — accept order"
      - "POST /orders/{id}/cancel — cancel order"
      - "POST /orders/{id}/reject — reject order"
      - "POST /acat-transfers/{id}/cancel — cancel own transfer"
    shared_operations:
      - "GET /accounts/{id}"
      - "POST /positions, POST /positions/{id}/close, GET /positions, GET /positions/{id}"
      - "GET /orders, GET /orders/{id}"
