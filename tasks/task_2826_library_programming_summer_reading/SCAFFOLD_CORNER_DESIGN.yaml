            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /library/programs/${p1}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${p1_v}" }
              as: ProgramCoordinator
            - call: "POST /library/programs/${p1}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Lego Drop In", age_group: "ALL_AGES", delivery_mode: "IN_BRANCH", registration_policy: "DROP_IN", start_utc: "2026-08-12T16:00:00.000Z", end_utc: "2026-08-12T17:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /library/programs/${p2}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T16:00:00.000Z", end_utc: "2026-08-12T17:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${p2_v}" }
              as: ProgramCoordinator
            - call: "POST /library/programs/${p2}/schedule"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/programs/${p1}/registrations"
              payload: { registrant_reference: "card-0001", seats: 2 }
              as: ProgramCoordinator
              captures: { rc: $.data.registered_count }
            - call: "POST /library/programs/${p2}/registrations"
              payload: { registrant_reference: "card-0001", seats: 2 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "The first call returns HTTP 200 with ${rc} == 2 and registrant_references == [\"card-0001\"]"
            - "The second call returns HTTP 422 with ${err} == ERR_DROP_IN_NO_REGISTRATION"
            - "Program.${p2}.registered_count == 0 and registrant_references == [] — the same reference is not shared across programs"

      - name: reservation_confirm_publishes_the_effective_capacity_onto_the_program
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /library/reservations/{reservation_id}/confirm]
          - entities.Program.fields.confirmed_room_capacity
          - state_machines[RoomReservation]
        distinguishing_aspect: "The confirm action is what publishes effective_capacity_seats onto Program.confirmed_room_capacity: the field is null while the reservation is merely HELD and 51 once it is CONFIRMED for a wheelchair-layout program in a 61-seat room."
        test_recipe:
          setup:
            - "A 61-seat WHEELCHAIR_ACCESSIBLE room and a DRAFT program requesting WHEELCHAIR_LAYOUT with a HELD reservation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Wide Room", capacity_seats: 61, min_setup_minutes: 15, min_teardown_minutes: 15, accessibility_features: ["WHEELCHAIR_ACCESSIBLE"] }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Accessible Craft Hour", age_group: "ALL_AGES", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 80, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000, accessibility_accommodations: ["WHEELCHAIR_LAYOUT"] }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 30, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "GET /library/programs/${prog}"
              payload: {}
              as: ProgramCoordinator
              captures: { cap_before: $.data.confirmed_room_capacity }
          trigger:
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
              captures: { st: $.data.status, eff: $.data.effective_capacity_seats }
            - call: "GET /library/programs/${prog}"
              payload: {}
              as: ProgramCoordinator
              captures: { cap_after: $.data.confirmed_room_capacity }
          assert:
            - "${cap_before} is null while the reservation was HELD"
            - "${st} == CONFIRMED and ${eff} == 51 (floor(61 x 0.85))"
            - "${cap_after} == 51 even though attendance_cap is 80 — the room ceiling is now the binding one"
            - "RoomReservation.${resv}.occupancy_start_utc == 2026-08-12T13:30:00.000Z and occupancy_end_utc == 2026-08-12T15:15:00.000Z"

  # ================================================================== §1.6 ERRORS
  # Coverage note: the remaining §1.6 ids are triggered elsewhere — the validation
  # ladder ids by the validations section above, ERR_ROOM_DOUBLE_BOOKED /
  # ERR_NO_CONFIRMED_ROOM / ERR_PRESENTER_SCREENING_REQUIRED /
  # ERR_NEGOTIATION_ROUNDS_EXHAUSTED / ERR_PRESENTER_DOUBLE_BOOKED by their §1.8
  # instances, the two 412 ids by the cross-cutting complexity layers section, and
  # the four authorisation ids by the rbac section.
  - section: errors
    instances:

      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_PRESENTER_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_CHALLENGE_NOT_FOUND]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_LOG_ENTRY_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_AWARD_NOT_FOUND]
        distinguishing_aspect: "Each retrieval endpoint returns its own entity-specific 404 id rather than one shared generic not-found code."
        test_recipe:
          setup:
            - "An empty database with the clock pinned; no entity of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "GET /library/rooms/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: ProgramCoordinator
              captures: { e_room: $.data.error_id }
            - call: "GET /library/programs/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: ProgramCoordinator
              captures: { e_prog: $.data.error_id }
            - call: "GET /library/reservations/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: ProgramCoordinator
              captures: { e_resv: $.data.error_id }
            - call: "GET /library/presenters/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: ProgramCoordinator
              captures: { e_pres: $.data.error_id }
            - call: "GET /library/contracts/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: ProgramCoordinator
              captures: { e_con: $.data.error_id }
            - call: "GET /library/reading-challenges/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: ProgramCoordinator
              captures: { e_chal: $.data.error_id }
            - call: "GET /library/participants/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: ProgramCoordinator
              captures: { e_part: $.data.error_id }
            - call: "GET /library/log-entries/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: ProgramCoordinator
              captures: { e_entry: $.data.error_id }
            - call: "GET /library/inventory-lots/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: ProgramCoordinator
              captures: { e_lot: $.data.error_id }
            - call: "GET /library/tier-awards/00000000-0000-0000-0000-00000000000a"
              payload: {}
              as: ProgramCoordinator
              captures: { e_award: $.data.error_id }
          assert:
            - "Every call returns HTTP 404"
            - "${e_room} == ERR_ROOM_NOT_FOUND, ${e_prog} == ERR_PROGRAM_NOT_FOUND, ${e_resv} == ERR_RESERVATION_NOT_FOUND, ${e_pres} == ERR_PRESENTER_NOT_FOUND, ${e_con} == ERR_CONTRACT_NOT_FOUND"
            - "${e_chal} == ERR_CHALLENGE_NOT_FOUND, ${e_part} == ERR_PARTICIPANT_NOT_FOUND, ${e_entry} == ERR_LOG_ENTRY_NOT_FOUND, ${e_lot} == ERR_LOT_NOT_FOUND, ${e_award} == ERR_AWARD_NOT_FOUND"
            - "Every response body carries only error_id and message under data"

      - name: pagination_outside_the_declared_bounds_returns_400
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit 0, limit 101 and offset -1 each return ERR_INVALID_PAGINATION (400) while limit 100 with offset 0 succeeds, pinning the inclusive [1, 100] bound."
        test_recipe:
          setup:
            - "One branch and one room exist so the listing has something to return."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
          trigger:
            - call: "GET /library/rooms"
              payload: { limit: 0, offset: 0 }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /library/rooms"
              payload: { limit: 101, offset: 0 }
              as: ProgramCoordinator
              captures: { e2: $.data.error_id }
            - call: "GET /library/rooms"
              payload: { limit: 10, offset: -1 }
              as: ProgramCoordinator
              captures: { e3: $.data.error_id }
            - call: "GET /library/rooms"
              payload: { limit: 100, offset: 0 }
              as: ProgramCoordinator
              captures: { ok_first: "$.data[0].id" }
          assert:
            - "${e1} == ERR_INVALID_PAGINATION, ${e2} == ERR_INVALID_PAGINATION and ${e3} == ERR_INVALID_PAGINATION, each HTTP 400"
            - "The fourth call returns HTTP 200 with total_count == 1 and ${ok_first} == ${room}"

      - name: unknown_body_foreign_keys_return_404_after_the_path_id_resolves
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_LOG_ENTRY_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys are resolved only once the path id has resolved: a real program with a fabricated room_id yields ERR_ROOM_NOT_FOUND, and a real participant with a fabricated corrected_entry_id yields ERR_LOG_ENTRY_NOT_FOUND — both 404, neither 422."
        test_recipe:
          setup:
            - "One DRAFT program and one participant of an OPEN challenge, both real."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
            - call: "POST /library/reading-challenges/${chal}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 5000, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${chal}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ada L.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { part: $.data.id, part_v: $.data.version }
          trigger:
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "00000000-0000-0000-0000-0000000000aa", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { e_room: $.data.error_id }
            - call: "POST /library/participants/${part}/log-corrections"
              payload: { corrected_entry_id: "00000000-0000-0000-0000-0000000000bb", units_delta: -5, expected_participant_version: "${part_v}" }
              as: ProgramCoordinator
              captures: { e_entry: $.data.error_id }
          assert:
            - "${e_room} == ERR_ROOM_NOT_FOUND with HTTP 404 — the version echo was current, so the 412 gate at priority 9 was never reached"
            - "${e_entry} == ERR_LOG_ENTRY_NOT_FOUND with HTTP 404, ahead of the priority-39 target check"
            - "Program.${prog}.version == ${prog_v} and Participant.${part}.version == ${part_v} — rejected calls consume no version"

  # ==================================================================== §1.7 RBAC
  - section: rbac
    instances:

      - name: screening_officer_cannot_create_a_program
        claim_type: cross_role_denial
        grounds:
          - roles.ScreeningOfficer
          - endpoints[POST /library/programs]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The ScreeningOfficer touches nothing outside the screening workflow, so POST /library/programs returns ERR_UNAUTHORIZED (403) and creates nothing."
        test_recipe:
          setup:
            - "One branch exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ScreeningOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${err} == ERR_UNAUTHORIZED"
            - "GET /library/programs as ProgramCoordinator returns total_count == 0"
            - "The role check at priority 2 fires before the body is validated at all"

      - name: coordinator_cannot_execute_a_contract_or_confirm_a_program
        claim_type: cross_role_denial
        grounds:
          - roles.ProgramCoordinator
          - roles.ProgramManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The ProgramCoordinator may negotiate and book but not commit: both execute and confirm return ERR_UNAUTHORIZED (403) while the same coordinator's own offer succeeded moments earlier."
        test_recipe:
          setup:
            - "A SCHEDULED ADULT program with a CONFIRMED reservation and an OFFERED contract offered by the coordinator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PROGRAM_SUPPLY", sku: "CRAFT-KIT", unit_cost_cents: 250, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Adult Book Club", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T18:00:00.000Z", end_utc: "2026-08-12T19:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T18:00:00.000Z", end_utc: "2026-08-12T19:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/presenters"
              payload: { legal_name: "Adult Speaker", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-01-01", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${prog}", round_trip_miles: 20 }
              as: ProgramCoordinator
              captures: { con: $.data.id }
            - call: "POST /library/contracts/${con}/offer"
              payload: { offered_fee_cents: 50000 }
              as: ProgramCoordinator
              as_user_id: "coord-001"
          trigger:
            - call: "POST /library/contracts/${con}/execute"
              payload: {}
              as: ProgramCoordinator
              as_user_id: "coord-002"
              captures: { e_exec: $.data.error_id }
            - call: "POST /library/programs/${prog}/confirm"
              payload: {}
              as: ProgramCoordinator
              captures: { e_conf: $.data.error_id }
          assert:
            - "Both calls return HTTP 403 with ${e_exec} == ERR_UNAUTHORIZED and ${e_conf} == ERR_UNAUTHORIZED"
            - "PresenterContract.${con}.status is still OFFERED with offered_by_user_id == coord-001 and total_fee_cents == 0"
            - "Program.${prog}.operational_status is still SCHEDULED with materials_committed_cents == 0"

      - name: reader_cannot_list_participants_or_read_another_participant
        claim_type: cross_role_denial
        grounds:
          - roles.Reader
          - endpoints[GET /library/participants]
          - endpoints[GET /library/participants/{participant_id}]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "A Reader is barred from the collection with ERR_UNAUTHORIZED (403) and from a peer's record with ERR_NOT_RESOURCE_OWNER (403), yet may read their own record."
        test_recipe:
          setup:
            - "An OPEN challenge with two participants, A and B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
            - call: "POST /library/reading-challenges/${chal}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 5000, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${chal}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ada L.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { part_a: $.data.id }
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ben M.", age_band: "AGE_12_17" }
              as: ProgramCoordinator
              captures: { part_b: $.data.id }
          trigger:
            - call: "GET /library/participants"
              payload: { challenge_id: "${chal}", limit: 10 }
              as: Reader
              as_user_id: "${part_a}"
              captures: { e_list: $.data.error_id }
            - call: "GET /library/participants/${part_b}"
              payload: {}
              as: Reader
              as_user_id: "${part_a}"
              captures: { e_peer: $.data.error_id }
            - call: "GET /library/participants/${part_a}"
              payload: {}
              as: Reader
              as_user_id: "${part_a}"
              captures: { own_units: $.data.cumulative_units }
          assert:
            - "${e_list} == ERR_UNAUTHORIZED (403) — the Reader role is not listed on the collection endpoint"
            - "${e_peer} == ERR_NOT_RESOURCE_OWNER (403) at priority 7, after the role check has passed"
            - "The own-record read returns HTTP 200 with ${own_units} == 0"

      - name: reader_cannot_log_units_for_another_participant
        claim_type: cross_role_denial
        grounds:
          - roles.Reader.identity
          - validations[priority=7]
          - errors[ERR_NOT_RESOURCE_OWNER]
