  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: leak_event_verification_failure_cycles_back_to_verification_pending
        grounds:
          - state_machines.LeakEvent.VERIFICATION_PENDING_to_VERIFICATION_FAILED
          - state_machines.LeakEvent.VERIFICATION_FAILED_to_VERIFICATION_PENDING
          - entities.LeakEvent.fields.failed_verification_count
          - entities.LeakEvent.fields.repair_attempt_count
          - entities.RepairAttempt.fields.outcome
        distinguishing_aspect: |
          Cyclic shape on the LeakEvent machine: the event re-enters
          VERIFICATION_PENDING it has already occupied, and the loop is not a
          reset - failed_verification_count and repair_attempt_count are
          monotone across the cycle and are exactly what selects the branch out
          of the next FAIL (VERIFICATION_FAILED at count 1 versus
          RETROFIT_MANDATED at count 2). The re-entered state is therefore
          distinguishable from the first visit by its counters and by the
          superseding of the earlier attempt.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0, threshold 20.0)."
            - "Two technicians: T1 (TYPE_II) does repairs, T2 (UNIVERSAL) verifies, satisfying segregation of duties."
            - "A 20.0 lb ADD_REFRIGERANT record at 2026-08-01T00:00:00Z opens LeakEvent E1 (OPEN, initial_repair_deadline 2026-08-31T00:00:00Z)."
            - "Clock advances to 2026-08-08T00:00:00Z so all repair and test timestamps are in the past."
            - "First RepairAttempt A1 at 2026-08-05T09:00:00Z moves E1 to VERIFICATION_PENDING with verification_deadline 2026-08-15T09:00:00Z."
            - "VerificationTest V1 by T2 at 2026-08-06T09:00:00Z with result FAIL moves E1 to VERIFICATION_FAILED (failed_verification_count 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ira Okonkwo", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2028-06-30T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
