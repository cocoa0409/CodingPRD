            - "GET /turf/fields/${f_sy} returns data.rest_debt_hours == 0.32"

      - name: late_cancellation_applies_half_wear_and_opens_no_rest_window
        claim_type: constants_applied
        grounds:
          - calculations.wear_load_units
          - calculations.rest_requirement_hours
          - state_machines.UsageBooking
          - entities.UsageLedgerEntry
        distinguishing_aspect: "Closes a booking out as CANCELLED_LATE with actual_duration_hours 0.00 and actual_participant_count 0, so the calculation must ignore the actuals and substitute the scheduled window span and expected_participant_count, then halve the result via LATE_CANCEL_WEAR_FRACTION = 0.5. Honouring the actuals yields 0.00; forgetting the fraction yields 8.64; the rest obligation must be suppressed entirely rather than derived from 4.32 units (which would be 2.16 hours)."
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its mandatory default 2026-08-01T00:00:00Z unless a POST /_clock/set_current_utc call below moves it forward."
            - "The setup_api_calls chain below is the authoritative, executable statement of this precondition - every fixture value is a literal and every id is captured from a prior response."
