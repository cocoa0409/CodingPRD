      - name: cascading_side_effects_traverse_four_hops_from_a_single_review
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.ExamScopeArea
          - state_machines.Examination
          - state_machines.MultistateCollaboration
        distinguishing_aspect: |
          The deepest cascade in the domain starts at a single file review and ends four hops away in a
          multistate panel, with each hop carrying its own recomputation rather than merely a status change.
        excluded_because:
          difficulty_instance: final_sample_review_cascades_area_exam_and_collaboration
          rationale: "That difficulty instance reviews the last outstanding sample and asserts each hop in order - the area's rates and tested_at, the examination's move into the criticism phase and its criticism_phase_opened_at, and the collaboration's move from LEAD_ASSIGNED to ACTIVE - which is exactly this layer's claim."

      - name: dual_variant_calculation_is_computed_twice_and_persisted_once
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.penalty_determination
          - endpoints[GET /examinations/{id}/exposure-summary]
        distinguishing_aspect: |
          Both penalty variants are computed for every examination and exposed side by side before either is
          chosen, and only the selected one is frozen onto the consent order - so the summary read and the
          persisted order must agree on the chosen variant and differ on the other.
        excluded_because:
          difficulty_instance: penalty_variant_divergence_flips_cooperation_credit_tier
          rationale: "That difficulty instance drafts both variants over one exposure and asserts that the gross figures diverge, that the cooperation credit tier flips between them because the subtotal crosses the boundary, and that the summary read reports both - which is this layer's claim in full."
  - section: consistency_model
    instances:

      - name: a_write_response_already_carries_its_own_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /data-calls/{id}/bulk-review]
          - state_machines.ExamScopeArea
          - state_machines.Examination
        distinguishing_aspect: |
          The declared model is immediate, and the bulk review endpoint is where that is observable in a single
          response: its body reports the scope area's post-cascade status and its recomputed rates, not the
          values that held when the request arrived. No second call is needed to see the transition, and the
          reads that follow must agree with the write's own body exactly rather than converge on it.
