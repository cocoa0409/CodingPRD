          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one publisher with two FULLY_OA journals: J_A at list_apc_cents 196000, J_B at 195999"
            - "GOLD_OA funder with apc_allowable true; one ACTIVE grant per author"
            - "author AU_A is ELIGIBLE_FACULTY, author AU_B is ELIGIBLE_POSTDOC, both with annual cap 500000"
            - "fund F_A: budget 200000, priority 1, per-article cap 196000, eligible [ELIGIBLE_FACULTY]"
            - "fund F_B: budget 200000, priority 2, per-article cap 196000, eligible [ELIGIBLE_POSTDOC]"
