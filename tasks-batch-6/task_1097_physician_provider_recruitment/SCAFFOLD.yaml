# =============================================================================
# Physician & Provider Recruitment (permanent placement) — Scaffold
# Difficulty: Expert
# =============================================================================

scenario: |
  Physician & Provider Recruitment (permanent): search & specialty/geography,
  sourcing & pipeline, site-visit & interview, offer & contract/sign-on,
  licensing/credentialing coordination, guarantee/relocation, placement fee,
  onboarding

domain_name: physician-provider-recruitment
api_prefix: ""   # flat topology: peer top-level collections, no shared parent path

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys (client_id, opening_id, candidate_id,
  # application_id, offer_id, placement_id). URLs are top-level collections with
  # FK fields in the body / query, not deep nesting.

  state_machine_shape: cyclic
  # Offer runs a cyclic negotiation loop (EXTENDED <-> COUNTERED). Placement
  # carries two independent parallel state axes (placement_status x fee_status).
  # CredentialingFile is compound (overall_status derived from CredentialItem
  # children). JobOpening auto-transitions on placement fill / fallout.

  relationship_patterns:
    - one_to_many          # Client -> JobOpening -> Application; Placement -> RelocationExpense
    - cross_aggregate      # Application.stage gates Offer; CredentialingFile gates Placement onboard

  role_model: segregation_of_duties
  # Peer staff roles (Recruiter, AccountManager, CredentialingCoordinator) plus
  # a client-side ClientContact and an opaque PlatformAdmin. Four-eyes rule: the
  # AccountManager who extended an Offer may not later WAIVE that placement's fee.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffUser
    parent: null
    common_fields: true
    fields:
      - { name: role, type: enum, source: input, description: "RECRUITER | ACCOUNT_MANAGER | CREDENTIALING_COORDINATOR", constraints: "one of RECRUITER, ACCOUNT_MANAGER, CREDENTIALING_COORDINATOR" }
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: email, type: string, source: input, description: "Staff member email" }
      - { name: covered_specialties, type: array, source: input, description: "List of specialty enums this staff (recruiter) sources for; used by the recruiter selector. May be empty for non-recruiters.", default: "[]" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE", constraints: "one of ACTIVE, INACTIVE" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Healthcare organization name" }
      - { name: region, type: string, source: input, description: "Client home region label (geography)" }
      - { name: account_manager_id, type: string, source: input, description: "FK -> StaffUser.id; the ACCOUNT_MANAGER who owns this client relationship" }
      - { name: contingency_pct, type: number, source: input, description: "Placement fee rate as a fraction of first-year comp (e.g. 0.20)", constraints: "0 < contingency_pct <= 1" }
      - { name: min_fee_cents, type: integer, source: input, description: "Fee floor in cents applied after the percentage computation", constraints: ">= 0" }
      - { name: guarantee_days, type: integer, source: input, description: "Length of the placement guarantee window in days", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE", constraints: "one of ACTIVE, INACTIVE" }
      - { name: net_placement_fee_cents, type: integer, source: computed, description: "Sum of recognized placement fees (fee_status in INVOICED,PAID) for this client's placements minus sum of resolved guarantee credit_cents. Conserved-quantity ledger (invariant net_client_fee_ledger).", default: 0 }

  - name: JobOpening
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the hiring organization" }
      - { name: specialty, type: enum, source: input, description: "FAMILY_MEDICINE | CARDIOLOGY | PSYCHIATRY | ORTHOPEDIC_SURGERY | EMERGENCY_MEDICINE", constraints: "one of FAMILY_MEDICINE, CARDIOLOGY, PSYCHIATRY, ORTHOPEDIC_SURGERY, EMERGENCY_MEDICINE" }
      - { name: region, type: string, source: input, description: "Opening geographic region label" }
      - { name: region_state, type: string, source: input, description: "Two-letter US state code of the opening; used for candidate license-state matching" }
      - { name: comp_min_cents, type: integer, source: input, description: "Minimum first-year base comp offered in cents", constraints: ">= 0" }
      - { name: comp_max_cents, type: integer, source: input, description: "Maximum first-year base comp offered in cents", constraints: ">= comp_min_cents" }
      - { name: is_hard_to_fill, type: boolean, source: input, description: "Scarcity flag; applies HARD_TO_FILL_MULTIPLIER to the placement fee", default: false }
      - { name: positions_total, type: integer, source: input, description: "Total headcount to fill on this opening", default: 1, constraints: ">= 1" }
      - { name: positions_filled, type: integer, source: computed, description: "Count of live (non FELL_OUT / non CANCELLED) Placements on this opening. Conserved quantity (invariant opening_positions_ledger).", default: 0 }
      - { name: recruiter_id, type: string, source: computed, description: "FK -> StaffUser.id; RECRUITER assigned by the selector on publish (DRAFT->OPEN). Null while DRAFT.", default: "null" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | ON_HOLD | FILLED | CLOSED", default: "DRAFT", constraints: "one of DRAFT, OPEN, ON_HOLD, FILLED, CLOSED" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: recruiter_id, type: string, source: input, description: "FK -> StaffUser.id; owning RECRUITER" }
      - { name: full_name, type: string, source: input, description: "Provider full name" }
      - { name: specialty, type: enum, source: input, description: "Same enum as JobOpening.specialty", constraints: "one of FAMILY_MEDICINE, CARDIOLOGY, PSYCHIATRY, ORTHOPEDIC_SURGERY, EMERGENCY_MEDICINE" }
      - { name: home_region, type: string, source: input, description: "Candidate home region label" }
      - { name: license_states, type: array, source: input, description: "List of two-letter US state codes the candidate is licensed in", default: "[]" }
      - { name: desired_comp_cents, type: integer, source: input, description: "Candidate desired first-year comp in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PLACED | DO_NOT_CONTACT", default: "ACTIVE", constraints: "one of ACTIVE, PLACED, DO_NOT_CONTACT" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id" }
      - { name: opening_id, type: string, source: input, description: "FK -> JobOpening.id" }
      - { name: recruiter_id, type: string, source: system, description: "FK -> StaffUser.id; copied from Candidate.recruiter_id at creation" }
      - { name: match_score, type: integer, source: computed, description: "0-100 weighted match score (specialty/geo/license). Informational; never a business selector.", default: 0 }
      - { name: stage, type: enum, source: system, description: "SOURCED | SCREENED | SUBMITTED | INTERVIEWING | OFFER_STAGE | PLACED | REJECTED | WITHDRAWN", default: "SOURCED", constraints: "one of SOURCED, SCREENED, SUBMITTED, INTERVIEWING, OFFER_STAGE, PLACED, REJECTED, WITHDRAWN" }
      - { name: reject_reason, type: enum, source: system, description: "Set when moved to REJECTED: CLIENT_PASS | OPENING_FILLED | WITHDRAWN_BY_CANDIDATE", default: "null", constraints: "one of CLIENT_PASS, OPENING_FILLED, WITHDRAWN_BY_CANDIDATE" }
  - name: SiteVisit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: interviewer_user_id, type: string, source: input, description: "FK -> StaffUser.id; interviewing staff member (any ACTIVE StaffUser)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview/site-visit start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview/site-visit end (ISO 8601 UTC)", constraints: "scheduled_end > scheduled_start" }
      - { name: location, type: string, source: input, description: "Site-visit location label" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW", default: "SCHEDULED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED, NO_SHOW" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: base_salary_cents, type: integer, source: input, description: "Offered first-year base salary in cents", constraints: ">= 0" }
      - { name: sign_on_bonus_cents, type: integer, source: input, description: "Sign-on bonus in cents", default: 0, constraints: ">= 0" }
      - { name: start_date, type: datetime, source: input, description: "Proposed employment start date (ISO 8601 UTC)" }
      - { name: relocation_cap_cents, type: integer, source: input, description: "Relocation reimbursement cap in cents offered in this contract; copied to Placement on ACCEPT", default: 0, constraints: ">= 0" }
      - { name: expires_at, type: datetime, source: input, description: "Offer expiry instant (ISO 8601 UTC); EXPIRE transition legal only at/after this instant" }
      - { name: round_number, type: integer, source: computed, description: "Negotiation round; starts at 1 on creation, increments on each COUNTERED->EXTENDED revise", default: 1 }
      - { name: extended_by_user_id, type: string, source: system, description: "StaffUser id (ACCOUNT_MANAGER) who extended the current round. Audit/actor field, not a discovery FK. Used by the fee-waiver segregation-of-duties check." }
      - { name: offered_first_year_comp_cents, type: integer, source: computed, description: "= base_salary_cents + sign_on_bonus_cents; input to the estimate-variant placement fee", default: 0 }
      - { name: status, type: enum, source: system, description: "EXTENDED | COUNTERED | ACCEPTED | DECLINED | RESCINDED | EXPIRED", default: "EXTENDED", constraints: "one of EXTENDED, COUNTERED, ACCEPTED, DECLINED, RESCINDED, EXPIRED" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; the accepted offer" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id" }
      - { name: opening_id, type: string, source: system, description: "FK -> JobOpening.id" }
      - { name: start_date, type: datetime, source: system, description: "Employment start date copied from the accepted Offer" }
      - { name: fee_estimate_cents, type: integer, source: computed, description: "Estimate-variant placement fee computed at offer ACCEPTED from Offer.offered_first_year_comp_cents", default: 0 }
      - { name: final_first_year_comp_cents, type: integer, source: input, description: "Final signed first-year comp in cents, supplied on the INVOICE fee-transition; input to the final-variant fee", default: "null" }
      - { name: placement_fee_cents, type: integer, source: computed, description: "Final-variant placement fee; set when fee_status becomes INVOICED", default: 0 }
      - { name: relocation_cap_cents, type: integer, source: system, description: "Maximum reimbursable relocation total in cents; copied from the accepted Offer.relocation_cap_cents", default: 0 }
      - { name: relocation_reimbursed_cents, type: integer, source: computed, description: "Reimbursed relocation total; capped by relocation_cap_cents. Set on relocation REIMBURSE.", default: 0 }
      - { name: relocation_status, type: enum, source: system, description: "NONE | APPROVED | REIMBURSED", default: "NONE", constraints: "one of NONE, APPROVED, REIMBURSED" }
      - { name: guarantee_end_date, type: datetime, source: computed, description: "= start_date + Client.guarantee_days; set on ONBOARD (PRE_START->ACTIVE)", default: "null" }
      - { name: placement_status, type: enum, source: system, description: "PRE_START | ACTIVE | GUARANTEE_MET | FELL_OUT | CANCELLED (placement lifecycle axis)", default: "PRE_START", constraints: "one of PRE_START, ACTIVE, GUARANTEE_MET, FELL_OUT, CANCELLED" }
      - { name: fee_status, type: enum, source: system, description: "PENDING | INVOICED | PAID | CREDITED | WAIVED (billing axis, independent of placement_status)", default: "PENDING", constraints: "one of PENDING, INVOICED, PAID, CREDITED, WAIVED" }

  - name: CredentialingFile
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: system, description: "FK -> Placement.id" }
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id" }
      - { name: overall_status, type: enum, source: computed, description: "NOT_STARTED | IN_PROGRESS | CLEARED | FLAGGED — derived from child CredentialItem statuses (compound).", default: "NOT_STARTED", constraints: "one of NOT_STARTED, IN_PROGRESS, CLEARED, FLAGGED" }

  - name: CredentialItem
    parent: null
    common_fields: true
    fields:
      - { name: credentialing_file_id, type: string, source: input, description: "FK -> CredentialingFile.id" }
      - { name: item_type, type: enum, source: input, description: "STATE_LICENSE | DEA_REGISTRATION | BOARD_CERTIFICATION | MALPRACTICE_HISTORY | REFERENCE", constraints: "one of STATE_LICENSE, DEA_REGISTRATION, BOARD_CERTIFICATION, MALPRACTICE_HISTORY, REFERENCE" }
      - { name: is_required, type: boolean, source: input, description: "Whether this item must be VERIFIED for the file to reach CLEARED", default: true }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | VERIFIED | FLAGGED", default: "PENDING", constraints: "one of PENDING, SUBMITTED, VERIFIED, FLAGGED" }

  - name: RelocationExpense
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id" }
      - { name: category, type: enum, source: input, description: "MOVERS | TEMP_HOUSING | FLIGHTS | LICENSING_FEES | OTHER", constraints: "one of MOVERS, TEMP_HOUSING, FLIGHTS, LICENSING_FEES, OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Raw expense amount in cents (pre gross-up)", constraints: ">= 0" }
      - { name: is_taxable, type: boolean, source: input, description: "If true, grossed up by TAX_GROSS_UP_FACTOR per line before summing", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED (only APPROVED lines enter reimbursement)", default: "SUBMITTED", constraints: "one of SUBMITTED, APPROVED, REJECTED" }

  - name: GuaranteeClaim
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id; the placement that fell out" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the placement" }
      - { name: fell_out_date, type: datetime, source: input, description: "Date the provider left (ISO 8601 UTC)" }
      - { name: reason, type: string, source: input, description: "Free-text fallout reason" }
      - { name: replacement_placement_id, type: string, source: input, description: "Placement id of the replacement placement for a REPLACEMENT resolution; audit reference, not a discovery FK. Null for REFUND.", default: "null" }
      - { name: days_worked, type: integer, source: computed, description: "= floor(fell_out_date - placement.start_date) in days; used by the guarantee credit calc", default: 0 }
      - { name: credit_cents, type: integer, source: computed, description: "Guarantee credit; computed at resolution. Refund variant = pro-rata; replacement variant = full-fee credit capped at replacement fee.", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | DENIED | RESOLVED_REFUND | RESOLVED_REPLACEMENT", default: "FILED", constraints: "one of FILED, APPROVED, DENIED, RESOLVED_REFUND, RESOLVED_REPLACEMENT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: StaffUser
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /staff-users/{id}/transition {action: DEACTIVATE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["INACTIVE recruiters are excluded from the recruiter selector; INACTIVE interviewers fail SiteVisit referential check"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /staff-users/{id}/transition {action: ACTIVATE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: JobOpening
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /job-openings/{id}/transition {action: PUBLISH}"
        actor: AccountManager
        preconditions:
          - "At least one ACTIVE StaffUser with role RECRUITER whose covered_specialties includes this opening.specialty exists, else ERR_NO_ELIGIBLE_RECRUITER"
        side_effects:
          - "recruiter_id assigned by the recruiter selector calc (eligibility=ACTIVE RECRUITER covering specialty; rank by open pipeline load ASC; tie-break created_at ASC)"
      - from: OPEN
        to: ON_HOLD
        trigger: "POST /job-openings/{id}/transition {action: HOLD}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: OPEN
        trigger: "POST /job-openings/{id}/transition {action: RESUME}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: FILLED
        trigger: "system: Placement created and positions_filled reaches positions_total"
        actor: system
        preconditions:
          - "positions_filled == positions_total after the placement increment"
        side_effects:
          - "CASCADE: every Application on this opening with stage in {SOURCED,SCREENED,SUBMITTED,INTERVIEWING,OFFER_STAGE} -> REJECTED (reject_reason=OPENING_FILLED)"
          - "CASCADE: for each such Application that had an Offer in {EXTENDED,COUNTERED} -> that Offer RESCINDED"
      - from: FILLED
        to: OPEN
        trigger: "system: a live Placement on this opening falls out (guarantee claim APPROVED) dropping positions_filled below positions_total"
        actor: system
        preconditions:
          - "positions_filled < positions_total after the decrement"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /job-openings/{id}/transition {action: CLOSE}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: CLOSED
        trigger: "POST /job-openings/{id}/transition {action: CLOSE}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: FILLED
        to: CLOSED
        trigger: "POST /job-openings/{id}/transition {action: CLOSE}"
        actor: AccountManager
        preconditions: []
        side_effects: []

  - entity: Application
    initial_state: SOURCED
    terminal_states: [PLACED, REJECTED, WITHDRAWN]
    transitions:
      - from: SOURCED
        to: SCREENED
        trigger: "POST /applications/{id}/advance {action: SCREEN}"
        actor: Recruiter
        preconditions: []
        side_effects: ["match_score recomputed"]
      - from: SCREENED
        to: SUBMITTED
        trigger: "POST /applications/{id}/advance {action: SUBMIT}"
        actor: Recruiter
        preconditions:
          - "Referenced JobOpening.status == OPEN, else ERR_OPENING_NOT_OPEN (cross-entity: Application depends on JobOpening)"
          - "Candidate.specialty == JobOpening.specialty, else ERR_SPECIALTY_MISMATCH"
        side_effects: []
      - from: SUBMITTED
        to: INTERVIEWING
        trigger: "POST /applications/{id}/advance {action: ADVANCE_TO_INTERVIEW}"
        actor: ClientContact
        preconditions:
          - "Acting ClientContact owns the opening's client (X-User-ID == opening.client_id)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /applications/{id}/advance {action: CLIENT_PASS}"
        actor: ClientContact
        preconditions:
          - "Acting ClientContact owns the opening's client"
        side_effects: ["reject_reason=CLIENT_PASS"]
      - from: INTERVIEWING
        to: OFFER_STAGE
        trigger: "system: Offer created for this application"
        actor: system
        preconditions:
          - "At least one SiteVisit on this application in status COMPLETED, else ERR_NO_COMPLETED_SITE_VISIT"
        side_effects: []
      - from: OFFER_STAGE
        to: PLACED
        trigger: "system: Offer ACCEPTED"
        actor: system
        preconditions: []
        side_effects:
          - "Placement created; Candidate.status -> PLACED"
      - from: SOURCED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/advance {action: WITHDRAW}"
        actor: Recruiter
        preconditions: []
        side_effects: ["reject_reason=WITHDRAWN_BY_CANDIDATE"]
      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/advance {action: WITHDRAW}"
        actor: Recruiter
        preconditions: []
        side_effects: ["reject_reason=WITHDRAWN_BY_CANDIDATE"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/advance {action: WITHDRAW}"
        actor: Recruiter
        preconditions: []
        side_effects: ["reject_reason=WITHDRAWN_BY_CANDIDATE"]
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "POST /applications/{id}/advance {action: WITHDRAW}"
        actor: Recruiter
        preconditions: []
        side_effects: ["reject_reason=WITHDRAWN_BY_CANDIDATE"]
      - from: INTERVIEWING
        to: REJECTED
        trigger: "system: JobOpening reaches FILLED via a sibling placement"
        actor: system
        preconditions: []
        side_effects: ["reject_reason=OPENING_FILLED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: JobOpening reaches FILLED via a sibling placement"
        actor: system
        preconditions: []
        side_effects: ["reject_reason=OPENING_FILLED"]
      - from: OFFER_STAGE
        to: REJECTED
        trigger: "system: JobOpening reaches FILLED via a sibling placement"
        actor: system
        preconditions: []
        side_effects: ["reject_reason=OPENING_FILLED; the application's EXTENDED/COUNTERED Offer -> RESCINDED"]

  - entity: SiteVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /site-visits/{id}/transition {action: COMPLETE}"
        actor: Recruiter
        preconditions: []
        side_effects: ["Application becomes eligible for Offer creation"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /site-visits/{id}/transition {action: CANCEL}"
        actor: Recruiter
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /site-visits/{id}/transition {action: NO_SHOW}"
        actor: Recruiter
        preconditions: []
        side_effects: []

  - entity: Offer
    initial_state: EXTENDED
    terminal_states: [ACCEPTED, DECLINED, RESCINDED, EXPIRED]
    transitions:
      - from: EXTENDED
        to: COUNTERED
        trigger: "POST /offers/{id}/transition {action: COUNTER}"
        actor: ClientContact
        preconditions:
          - "Acting ClientContact owns the opening's client"
        side_effects: []
      - from: COUNTERED
        to: EXTENDED
        trigger: "POST /offers/{id}/revise {expected_offer_version, base_salary_cents?, sign_on_bonus_cents?, start_date?, expires_at?}"
        actor: AccountManager
        preconditions:
          - "expected_offer_version matches current Offer.version, else ERR_STALE_VERSION (OCC)"
          - "Revised base_salary_cents (if provided) within [opening.comp_min_cents, opening.comp_max_cents], else ERR_COMP_OUT_OF_RANGE"
        side_effects:
          - "round_number += 1"
          - "offered_first_year_comp_cents recomputed"
          - "extended_by_user_id set to the acting AccountManager"
          - "increments Offer.version by 1"
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /offers/{id}/transition {action: ACCEPT}"
        actor: Recruiter
        preconditions:
          - "Offer not past expires_at"
        side_effects:
          - "CASCADE root: Application OFFER_STAGE->PLACED; Candidate->PLACED"
          - "Placement created (PRE_START, fee PENDING); fee_estimate_cents computed from offered_first_year_comp_cents"
          - "CredentialingFile created (NOT_STARTED) for the placement"
          - "JobOpening.positions_filled += 1; if it reaches positions_total, JobOpening OPEN->FILLED (which cascades sibling Application REJECTED and their Offers RESCINDED)"
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /offers/{id}/transition {action: DECLINE}"
        actor: Recruiter
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /offers/{id}/transition {action: DECLINE}"
        actor: Recruiter
        preconditions: []
        side_effects: []
      - from: EXTENDED
        to: RESCINDED
        trigger: "POST /offers/{id}/transition {action: RESCIND}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: RESCINDED
        trigger: "POST /offers/{id}/transition {action: RESCIND}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /offers/{id}/transition {action: EXPIRE}"
        actor: AccountManager
        preconditions:
          - "current clock >= expires_at, else ERR_INVALID_STATE"
        side_effects: []

  - entity: Placement
    initial_state: PRE_START
    terminal_states: []   # GUARANTEE_MET / FELL_OUT / CANCELLED are effectively terminal for placement_status; fee_status evolves independently
    transitions:
      # --- placement_status axis ---
      - from: PRE_START
        to: ACTIVE
        trigger: "POST /placements/{id}/transition {action: ONBOARD}"
        actor: CredentialingCoordinator
        preconditions:
          - "CredentialingFile.overall_status == CLEARED, else ERR_CREDENTIALING_NOT_CLEARED (cross-entity: Placement depends on CredentialingFile)"
          - "current clock >= start_date, else ERR_INVALID_STATE"
        side_effects:
          - "guarantee_end_date = start_date + Client.guarantee_days"
      - from: ACTIVE
        to: GUARANTEE_MET
        trigger: "POST /placements/{id}/transition {action: MARK_GUARANTEE_MET}"
        actor: AccountManager
        preconditions:
          - "current clock > guarantee_end_date, else ERR_INVALID_STATE"
        side_effects: []
      - from: ACTIVE
        to: FELL_OUT
        trigger: "system: GuaranteeClaim on this placement APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "fee_status -> CREDITED (billing axis)"
          - "JobOpening.positions_filled -= 1; if opening was FILLED, opening FILLED->OPEN"
      - from: PRE_START
        to: CANCELLED
        trigger: "POST /placements/{id}/transition {action: CANCEL}"
        actor: AccountManager
        preconditions:
          - "placement_status == PRE_START"
        side_effects:
          - "JobOpening.positions_filled -= 1; if opening was FILLED, opening FILLED->OPEN"
          - "Candidate.status -> ACTIVE"
      # --- fee_status axis (independent of placement_status) ---
      - from: PENDING
        to: INVOICED
        trigger: "POST /placements/{id}/transition {action: INVOICE, final_first_year_comp_cents}"
        actor: AccountManager
        preconditions:
          - "placement_status == ACTIVE, else ERR_INVALID_STATE"
          - "final_first_year_comp_cents present, else ERR_FINAL_COMP_REQUIRED"
        side_effects:
          - "placement_fee_cents computed (final variant) from final_first_year_comp_cents"
          - "Client.net_placement_fee_cents recomputed"
        note: "fee_status axis transition; placement_status unchanged"
      - from: INVOICED
        to: PAID
        trigger: "POST /placements/{id}/transition {action: MARK_PAID}"
        actor: AccountManager
        preconditions: []
        side_effects: ["Client.net_placement_fee_cents recomputed"]
        note: "fee_status axis"
      - from: PENDING
        to: WAIVED
        trigger: "POST /placements/{id}/transition {action: WAIVE}"
        actor: AccountManager
        preconditions:
          - "acting AccountManager id != Placement's Offer.extended_by_user_id, else ERR_SEGREGATION_OF_DUTIES (four-eyes)"
        side_effects: []
        note: "fee_status axis"
      # --- relocation axis (relocation_status; independent of the other two axes) ---
      - from: APPROVED
        to: REIMBURSED
        trigger: "POST /placements/{id}/transition {action: RELOCATION_REIMBURSE}"
        actor: AccountManager
        preconditions:
          - "relocation_status == APPROVED, else ERR_INVALID_STATE"
        side_effects:
          - "relocation_reimbursed_cents computed by relocation_reimbursement calc (per-line gross-up, summed, capped at relocation_cap_cents)"
        note: "relocation axis; relocation_status was set APPROVED by a prior RelocationExpense RELOCATION_APPROVE"

  - entity: CredentialingFile
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "system: a child CredentialItem moves to SUBMITTED or VERIFIED"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "system: recomputed when a child CredentialItem changes and all required items are VERIFIED with none FLAGGED"
        actor: system
        preconditions:
          - "Every CredentialItem with is_required=true is VERIFIED; no item is FLAGGED"
        side_effects: []
      - from: IN_PROGRESS
        to: FLAGGED
        trigger: "system: a child CredentialItem moves to FLAGGED"
        actor: system
        preconditions: []
        side_effects: []
      - from: FLAGGED
        to: IN_PROGRESS
        trigger: "system: the FLAGGED item is resubmitted (FLAGGED->SUBMITTED) and no item remains FLAGGED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: FLAGGED
        trigger: "system: a VERIFIED item is later FLAGGED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CredentialItem
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /credential-items/{id}/transition {action: SUBMIT}"
        actor: CredentialingCoordinator
        preconditions: []
        side_effects: ["BUBBLE UP: parent CredentialingFile.overall_status recomputed"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /credential-items/{id}/transition {action: VERIFY}"
        actor: CredentialingCoordinator
        preconditions: []
        side_effects: ["BUBBLE UP: parent CredentialingFile.overall_status recomputed (may become CLEARED)"]
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /credential-items/{id}/transition {action: FLAG}"
        actor: CredentialingCoordinator
        preconditions: []
        side_effects: ["BUBBLE UP: parent CredentialingFile.overall_status -> FLAGGED"]
      - from: VERIFIED
        to: FLAGGED
        trigger: "POST /credential-items/{id}/transition {action: FLAG}"
        actor: CredentialingCoordinator
        preconditions: []
        side_effects: ["BUBBLE UP: parent CredentialingFile.overall_status -> FLAGGED (revokes CLEARED)"]
      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /credential-items/{id}/transition {action: RESUBMIT}"
        actor: CredentialingCoordinator
        preconditions: []
        side_effects: ["BUBBLE UP: parent CredentialingFile.overall_status recomputed"]

  - entity: RelocationExpense
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /placements/{id}/transition {action: RELOCATION_APPROVE, expense_id}"
        actor: AccountManager
        preconditions: []
        side_effects: ["Placement.relocation_status -> APPROVED (if not already REIMBURSED)"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /placements/{id}/transition {action: RELOCATION_REJECT, expense_id}"
        actor: AccountManager
        preconditions: []
        side_effects: []

  - entity: GuaranteeClaim
    initial_state: FILED
    terminal_states: [DENIED, RESOLVED_REFUND, RESOLVED_REPLACEMENT]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /guarantee-claims/{id}/transition {action: APPROVE}"
        actor: AccountManager
        preconditions:
          - "Placement.placement_status == ACTIVE, else ERR_INVALID_STATE"
          - "fell_out_date <= Placement.guarantee_end_date (inclusive boundary), else ERR_GUARANTEE_WINDOW_EXPIRED"
        side_effects:
          - "CASCADE root: Placement ACTIVE->FELL_OUT; Placement.fee_status->CREDITED; JobOpening.positions_filled -= 1; if opening FILLED, opening FILLED->OPEN"
      - from: FILED
        to: DENIED
        trigger: "POST /guarantee-claims/{id}/transition {action: DENY}"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RESOLVED_REFUND
        trigger: "POST /guarantee-claims/{id}/transition {action: RESOLVE_REFUND}"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "credit_cents = guarantee_credit REFUND variant (pro-rata by unworked fraction)"
          - "Client.net_placement_fee_cents recomputed (subtracts credit_cents)"
      - from: APPROVED
        to: RESOLVED_REPLACEMENT
        trigger: "POST /guarantee-claims/{id}/transition {action: RESOLVE_REPLACEMENT, replacement_placement_id}"
        actor: AccountManager
        preconditions:
          - "replacement_placement_id references a Placement on the same opening in PRE_START or ACTIVE, else ERR_INVALID_STATE"
        side_effects:
          - "credit_cents = guarantee_credit REPLACEMENT variant (full original fee capped at replacement placement's fee_estimate_cents)"
          - "Client.net_placement_fee_cents recomputed (subtracts credit_cents)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: offer-revise-stale-version
    parent_entity: Offer
    write_endpoint: "POST /offers/{offerId}/revise"
    occ_field: "expected_offer_version"
    description: |
      Revising an Offer (COUNTERED->EXTENDED with new terms) whose version has
      advanced since the AccountManager last read it is rejected. This is a true
      CREATE-with-supersede case: a revise legitimately supersedes the prior
      terms, so a revise from a reachable state would otherwise succeed. But a
      client COUNTER (EXTENDED->COUNTERED) or a prior revise silently bumps
      Offer.version between the AM's read and this call, so the AM's view is
      stale. OCC reduces it to a version check triggerable by two strictly
      sequential requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: placement_fee
    trigger: "estimate variant on Offer ACCEPTED (fee_estimate_cents); final variant on fee INVOICE (placement_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      first_year_comp = (estimate) Offer.offered_first_year_comp_cents
                      = (final)    Placement.final_first_year_comp_cents
      multiplier = HARD_TO_FILL_MULTIPLIER if JobOpening.is_hard_to_fill else 1.0
      raw_fee = round_half_up(first_year_comp * Client.contingency_pct * multiplier)
      fee = max(raw_fee, Client.min_fee_cents)
    input_set: "Single placement; uses the placement's Client (contingency_pct, min_fee_cents) and JobOpening (is_hard_to_fill)."
    constants:
      HARD_TO_FILL_MULTIPLIER: 1.20
    precision: "integer cents, round_half_up on the percentage product before the max() floor"
    variants:
      - name: estimate
        when: "computed at Offer ACCEPTED using offered_first_year_comp_cents (base+sign-on at acceptance)"
        difference: "uses the offered comp snapshot; stored in Placement.fee_estimate_cents"
      - name: final
        when: "computed at fee INVOICE using final_first_year_comp_cents (signed comp, may differ from offered)"
        difference: "uses the finalized comp; stored in Placement.placement_fee_cents; the value the client is billed"

  - name: guarantee_credit
    trigger: "GuaranteeClaim resolution (APPROVED->RESOLVED_REFUND or RESOLVED_REPLACEMENT)"
    algorithm: threshold
    formula: |
      days_worked = floor((fell_out_date - Placement.start_date) in whole days)
      unworked_fraction = max(0, (Client.guarantee_days - days_worked) / Client.guarantee_days)
      REFUND variant:
        credit_cents = round_half_up(Placement.placement_fee_cents * unworked_fraction)
      REPLACEMENT variant:
        credit_cents = min(Placement.placement_fee_cents, replacement_placement.fee_estimate_cents)
    input_set: "The fell-out Placement and (for REPLACEMENT) the linked replacement Placement's fee_estimate_cents."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: refund
        when: "no replacement provider; agency returns cash pro-rata to unworked guarantee days"
        difference: "time-prorated: placement_fee_cents * unworked_fraction"
      - name: replacement
        when: "agency supplies a replacement provider; the original fee is credited toward the replacement"
        difference: "full original fee credited, capped at the replacement placement's estimated fee; NOT time-prorated"

  - name: relocation_reimbursement
    trigger: "relocation REIMBURSE transition on a Placement"
    algorithm: aggregation
    formula: |
      # Round EACH line to whole cents BEFORE summing (per-line rounding order is pinned).
      for each RelocationExpense e on the placement with status == APPROVED:
        line_reimbursable = round_half_up(e.amount_cents * TAX_GROSS_UP_FACTOR) if e.is_taxable
                            else e.amount_cents
      reimbursable_total = sum(line_reimbursable over APPROVED lines)   # summed AFTER per-line rounding
      relocation_reimbursed_cents = min(reimbursable_total, Placement.relocation_cap_cents)
    input_set: "RelocationExpense rows for the placement in status APPROVED only (SUBMITTED/REJECTED excluded)."
    constants:
      TAX_GROSS_UP_FACTOR: 1.25
    precision: "integer cents, round_half_up applied PER LINE (taxable lines) then summed; NOT sum-then-round"

  - name: match_score
    trigger: "Application SCREEN (SOURCED->SCREENED); recomputed on screen"
    algorithm: weighted_scoring
    formula: |
      s = 0
      if Candidate.specialty == JobOpening.specialty: s += W_SPECIALTY
      if Candidate.home_region == JobOpening.region:   s += W_GEO
      if JobOpening.region_state in Candidate.license_states: s += W_LICENSE
      match_score = s
    input_set: "Single Application's Candidate and JobOpening."
    constants:
      W_SPECIALTY: 50
      W_GEO: 30
      W_LICENSE: 20
    precision: "integer 0-100"

  - name: guarantee_end_date
    trigger: "Placement ONBOARD (PRE_START->ACTIVE)"
    algorithm: projection
    formula: |
      guarantee_end_date = Placement.start_date + Client.guarantee_days (whole days)
    input_set: "The placement's start_date and its Client.guarantee_days."
    constants: {}
    precision: "ISO 8601 datetime; date arithmetic in whole days"

  - name: recruiter_selector
    trigger: "JobOpening PUBLISH (DRAFT->OPEN)"
    algorithm: weighted_scoring
    formula: |
      candidates = StaffUser where role == RECRUITER
                     and status == ACTIVE
                     and opening.specialty in covered_specialties
      if candidates is empty: reject with ERR_NO_ELIGIBLE_RECRUITER
      rank each candidate by open_pipeline_load ASC
        where open_pipeline_load = count(Application with recruiter_id == staff.id
              and stage in {SOURCED,SCREENED,SUBMITTED,INTERVIEWING,OFFER_STAGE})
      tie-break: created_at ASC (never id)
      assign opening.recruiter_id = first ranked staff.id
    input_set: "All ACTIVE RECRUITER StaffUsers covering the opening.specialty; their non-terminal Application counts."
    constants: {}
    precision: "exact integer load comparison; deterministic created_at ASC tie-break"

  - name: client_net_placement_fee
    trigger: "fee INVOICE, MARK_PAID, and GuaranteeClaim RESOLVE_REFUND / RESOLVE_REPLACEMENT"
    algorithm: aggregation
    formula: |
      recognized = sum(Placement.placement_fee_cents for placements of this client
                       where fee_status in {INVOICED, PAID, CREDITED})
      credited   = sum(GuaranteeClaim.credit_cents for this client's placements
                       where status in {RESOLVED_REFUND, RESOLVED_REPLACEMENT})
      net_placement_fee_cents = recognized - credited
    input_set: "All Placements for the client with fee_status in {INVOICED, PAID, CREDITED} (WAIVED and PENDING excluded); all resolved GuaranteeClaims for those placements. A CREDITED placement stays in `recognized` so the paired (invoice, credit) leaves net = billed - credit with no drift."
    constants: {}
    precision: "integer cents; invariant: net == recognized - credited (no drift)"

  - name: opening_positions_filled
    trigger: "Placement created (ACCEPT), CANCEL, and FELL_OUT"
    algorithm: aggregation
    formula: |
      positions_filled = count(Placement with opening_id == opening.id
                               and placement_status in {PRE_START, ACTIVE, GUARANTEE_MET})
    input_set: "All Placements on the opening excluding FELL_OUT and CANCELLED."
    constants: {}
    precision: "exact integer; invariant: positions_filled == count(live placements) at all times"

  - name: site_visit_overlap_rules
    trigger: "POST /site-visits (before persisting a SCHEDULED visit)"
    algorithm: interval_merge
    formula: |
      Let [s, e) be the new visit's [scheduled_start, scheduled_end).
      INTERVIEWER rule (half-open, adjacency allowed):
        reject with ERR_INTERVIEWER_DOUBLE_BOOKED if there exists a SCHEDULED
        SiteVisit x on the same interviewer_user_id with s < x.scheduled_end
        AND x.scheduled_start < e   (touching endpoints e==x.start or s==x.end are allowed).
      CANDIDATE rule (buffered, closed):
        the candidate is the application's candidate. Reject with
        ERR_CANDIDATE_TRAVEL_CONFLICT if there exists a SCHEDULED SiteVisit y on
        any application of the SAME candidate whose interval, expanded by
        CANDIDATE_TRAVEL_BUFFER_MINUTES on both sides, intersects [s, e];
        i.e. gap between the two visits < CANDIDATE_TRAVEL_BUFFER_MINUTES is rejected
        (a gap exactly == the buffer is allowed).
    input_set: "All SCHEDULED SiteVisits sharing the interviewer (interviewer rule) or the candidate (candidate rule); CANCELLED/COMPLETED/NO_SHOW excluded."
    constants:
      CANDIDATE_TRAVEL_BUFFER_MINUTES: 120
    precision: "minute-granular interval arithmetic; interviewer=half-open, candidate=closed+buffer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: all required input fields present and correctly typed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Every path id and body FK references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing resources"

  - priority: 5
    category: business_referential
    check: "Ownership: entity_backed role acts only on resources it owns (Recruiter on own Candidate/Application; ClientContact on own Client's openings/applications/offers)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Recruiter-owned and ClientContact-owned mutations"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: fee WAIVE approver AccountManager id != the placement's Offer.extended_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /placements/{id}/transition {action: WAIVE}"

  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_offer_version equals current Offer.version on revise"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /offers/{id}/revise"

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_referential
    check: "Referential integrity of business links: SiteVisit.interviewer_user_id is an ACTIVE StaffUser; Candidate.specialty == JobOpening.specialty on SUBMIT"
    error_id: "ERR_INTERVIEWER_INVALID / ERR_SPECIALTY_MISMATCH"
    http_status: 422
    applies_to: "POST /site-visits; POST /applications/{id}/advance {action: SUBMIT}"

  - priority: 10
    category: business_temporal
    check: "SiteVisit does not temporally overlap another SCHEDULED visit on the same interviewer (half-open, adjacency allowed) or the same candidate within CANDIDATE_TRAVEL_BUFFER_MINUTES (buffered closed)"
    error_id: "ERR_INTERVIEWER_DOUBLE_BOOKED / ERR_CANDIDATE_TRAVEL_CONFLICT"
    http_status: 409
    applies_to: "POST /site-visits"

  - priority: 11
    category: business_constraint
    check: "Domain constraints: opening OPEN on SUBMIT; offered comp within opening range; completed site visit before offer; credentialing CLEARED before onboard; guarantee window not expired; eligible recruiter exists on publish; opening not already filled"
    error_id: "ERR_OPENING_NOT_OPEN / ERR_COMP_OUT_OF_RANGE / ERR_NO_COMPLETED_SITE_VISIT / ERR_CREDENTIALING_NOT_CLEARED / ERR_GUARANTEE_WINDOW_EXPIRED / ERR_NO_ELIGIBLE_RECRUITER / ERR_OPENING_FILLED"
    http_status: "409/422"
    applies_to: "various domain endpoints"

  - priority: 12
    category: business_fiscal
    check: "Fiscal preconditions: final_first_year_comp_cents present on INVOICE"
    error_id: ERR_FINAL_COMP_REQUIRED
    http_status: 422
    applies_to: "POST /placements/{id}/transition {action: INVOICE}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- StaffUser ----
  - method: POST
    path: "/staff-users"
    description: "Create a staff user (recruiter / account manager / credentialing coordinator)"
    roles: [PlatformAdmin]
    code: 201
    input: [role, full_name, email, "covered_specialties?"]
    output: StaffUser
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/staff-users/{staffUserId}"
    description: "Get a staff user"
    roles: [PlatformAdmin, Recruiter, AccountManager, CredentialingCoordinator]
    code: 200
    input: []
    output: StaffUser
    side_effects: []

  - method: POST
    path: "/staff-users/{staffUserId}/transition"
    description: "Activate/deactivate a staff user: DEACTIVATE / ACTIVATE"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: StaffUser
    side_effects: ["status transition per StaffUser machine"]

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a client (healthcare organization) with fee terms"
    roles: [AccountManager]
    code: 201
    input: [name, region, account_manager_id, contingency_pct, min_fee_cents, guarantee_days]
    output: Client
    side_effects: ["status=ACTIVE, net_placement_fee_cents=0"]

  - method: GET
    path: "/clients/{clientId}"
    description: "Get a client including net_placement_fee_cents"
    roles: [PlatformAdmin, AccountManager, ClientContact]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients; filter by account_manager_id (FK reverse for Client.account_manager_id)"
    roles: [PlatformAdmin, AccountManager]
    code: 200
    input: ["account_manager_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  # ---- JobOpening ----
  - method: POST
    path: "/job-openings"
    description: "Create a job opening (DRAFT)"
    roles: [AccountManager]
    code: 201
    input: [client_id, specialty, region, region_state, comp_min_cents, comp_max_cents, "is_hard_to_fill?", "positions_total?"]
    output: JobOpening
    side_effects: ["status=DRAFT, positions_filled=0, recruiter_id=null"]

  - method: GET
    path: "/job-openings/{openingId}"
    description: "Get a job opening"
    roles: [PlatformAdmin, AccountManager, Recruiter, ClientContact]
    code: 200
    input: []
    output: JobOpening
    side_effects: []

  - method: GET
    path: "/job-openings"
    description: "List openings; filter by client_id (FK reverse for JobOpening.client_id), recruiter_id (FK reverse for JobOpening.recruiter_id), specialty"
    roles: [PlatformAdmin, AccountManager, Recruiter]
    code: 200
    input: ["client_id?", "recruiter_id?", "specialty?", "limit?", "offset?"]
    output: JobOpening[]
    side_effects: []

  - method: POST
    path: "/job-openings/{openingId}/transition"
    description: "Transition opening: PUBLISH / HOLD / RESUME / CLOSE"
    roles: [AccountManager]
    code: 200
    input: [action]
    output: JobOpening
    side_effects: ["PUBLISH assigns recruiter_id via recruiter_selector; state transition per JobOpening machine"]

  # ---- Candidate ----
  - method: POST
    path: "/candidates"
    description: "Create a candidate (provider); recruiter_id must be the acting Recruiter"
    roles: [Recruiter]
    code: 201
    input: [recruiter_id, full_name, specialty, home_region, "license_states?", desired_comp_cents]
    output: Candidate
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/candidates/{candidateId}"
    description: "Get a candidate"
    roles: [PlatformAdmin, Recruiter, AccountManager]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates"
    description: "List candidates; filter by recruiter_id (FK reverse for Candidate.recruiter_id), specialty"
    roles: [PlatformAdmin, Recruiter, AccountManager]
    code: 200
    input: ["recruiter_id?", "specialty?", "limit?", "offset?"]
    output: Candidate[]
    side_effects: []

  # ---- Application ----
  - method: POST
    path: "/applications"
    description: "Source a candidate onto an opening (SOURCED); recruiter_id copied from candidate"
    roles: [Recruiter]
    code: 201
    input: [candidate_id, opening_id]
    output: Application
    side_effects: ["stage=SOURCED, match_score computed on SCREEN"]

  - method: GET
    path: "/applications/{applicationId}"
    description: "Get an application"
    roles: [PlatformAdmin, Recruiter, AccountManager, ClientContact]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications; filter by opening_id (FK reverse for Application.opening_id), candidate_id (FK reverse for Application.candidate_id), recruiter_id (FK reverse for Application.recruiter_id), stage"
    roles: [PlatformAdmin, Recruiter, AccountManager, ClientContact]
    code: 200
    input: ["opening_id?", "candidate_id?", "recruiter_id?", "stage?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/advance"
    description: "Advance pipeline: SCREEN / SUBMIT / ADVANCE_TO_INTERVIEW / CLIENT_PASS / WITHDRAW"
    roles: [Recruiter, ClientContact]
    code: 200
    input: [action]
    output: Application
    side_effects: ["state transition per Application machine; SCREEN recomputes match_score"]

  # ---- SiteVisit ----
  - method: POST
    path: "/site-visits"
    description: "Schedule a site visit / interview for an application"
    roles: [Recruiter]
    code: 201
    input: [application_id, interviewer_user_id, scheduled_start, scheduled_end, location]
    output: SiteVisit
    side_effects: ["status=SCHEDULED after interviewer/candidate overlap checks"]

  - method: GET
    path: "/site-visits/{siteVisitId}"
    description: "Get a site visit"
    roles: [PlatformAdmin, Recruiter, AccountManager]
    code: 200
    input: []
    output: SiteVisit
    side_effects: []

  - method: GET
    path: "/site-visits"
    description: "List site visits; filter by application_id (FK reverse for SiteVisit.application_id), interviewer_user_id (FK reverse for SiteVisit.interviewer_user_id)"
    roles: [PlatformAdmin, Recruiter, AccountManager]
    code: 200
    input: ["application_id?", "interviewer_user_id?", "limit?", "offset?"]
    output: SiteVisit[]
    side_effects: []

  - method: POST
    path: "/site-visits/{siteVisitId}/transition"
    description: "Transition site visit: COMPLETE / CANCEL / NO_SHOW"
    roles: [Recruiter]
    code: 200
    input: [action]
    output: SiteVisit
    side_effects: ["state transition per SiteVisit machine"]

  # ---- Offer ----
  - method: POST
    path: "/offers"
    description: "Extend an offer (EXTENDED); moves Application INTERVIEWING->OFFER_STAGE"
    roles: [AccountManager]
    code: 201
    input: [application_id, base_salary_cents, "sign_on_bonus_cents?", start_date, expires_at, "relocation_cap_cents?"]
    output: Offer
    side_effects: ["status=EXTENDED, round_number=1, extended_by_user_id=acting AM, offered_first_year_comp_cents computed; Application->OFFER_STAGE"]

  - method: GET
    path: "/offers/{offerId}"
    description: "Get an offer"
    roles: [PlatformAdmin, AccountManager, Recruiter, ClientContact]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers; filter by application_id (FK reverse for Offer.application_id)"
    roles: [PlatformAdmin, AccountManager, Recruiter, ClientContact]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/offers/{offerId}/transition"
    description: "Transition offer: COUNTER / ACCEPT / DECLINE / RESCIND / EXPIRE"
    roles: [AccountManager, Recruiter, ClientContact]
    code: 200
    input: [action]
    output: Offer
    side_effects: ["state transition per Offer machine; ACCEPT creates Placement + CredentialingFile and cascades opening fill"]

  - method: POST
    path: "/offers/{offerId}/revise"
    description: "Revise a COUNTERED offer with new terms (OCC on expected_offer_version); COUNTERED->EXTENDED"
    roles: [AccountManager]
    code: 200
    input: [expected_offer_version, "base_salary_cents?", "sign_on_bonus_cents?", "start_date?", "expires_at?"]
    output: Offer
    side_effects: ["COUNTERED->EXTENDED; round_number+=1; offered_first_year_comp_cents recomputed; extended_by_user_id updated; increments Offer.version by 1"]

  # ---- Placement ----
  - method: GET
    path: "/placements/{placementId}"
    description: "Get a placement (both status axes, fee fields, guarantee_end_date)"
    roles: [PlatformAdmin, AccountManager, Recruiter, CredentialingCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/placements"
    description: "List placements; filter by opening_id (FK reverse for Placement.opening_id), client_id (FK reverse for Placement.client_id), candidate_id (FK reverse for Placement.candidate_id), application_id (FK reverse for Placement.application_id), offer_id (FK reverse for Placement.offer_id)"
    roles: [PlatformAdmin, AccountManager, Recruiter, CredentialingCoordinator]
    code: 200
    input: ["opening_id?", "client_id?", "candidate_id?", "application_id?", "offer_id?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/placements/{placementId}/transition"
    description: "Placement actions across both axes: ONBOARD / MARK_GUARANTEE_MET / CANCEL (placement_status) and INVOICE / MARK_PAID / WAIVE (fee_status) and RELOCATION_APPROVE / RELOCATION_REJECT / RELOCATION_REIMBURSE (relocation)"
    roles: [AccountManager, CredentialingCoordinator]
    code: 200
    input: [action, "final_first_year_comp_cents?", "expense_id?"]
    output: Placement
    side_effects: ["state transition per Placement machine; INVOICE computes placement_fee_cents; RELOCATION_REIMBURSE computes relocation_reimbursed_cents; fee changes recompute Client.net_placement_fee_cents"]

  - method: POST
    path: "/placements/{id}/relocation-expenses"
    description: "Add a relocation expense line to a placement"
    roles: [Recruiter, AccountManager]
    code: 201
    input: [category, amount_cents, "is_taxable?"]
    output: RelocationExpense
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/placements/{id}/relocation-expenses"
    description: "List a placement's relocation expenses (FK reverse for RelocationExpense.placement_id)"
    roles: [PlatformAdmin, AccountManager, Recruiter]
    code: 200
    input: ["limit?", "offset?"]
    output: RelocationExpense[]
    side_effects: []

  # ---- CredentialingFile / CredentialItem ----
  - method: GET
    path: "/credentialing-files/{credentialingFileId}"
    description: "Get a credentialing file (overall_status derived from items)"
    roles: [PlatformAdmin, CredentialingCoordinator, AccountManager]
    code: 200
    input: []
    output: CredentialingFile
    side_effects: []

  - method: GET
    path: "/credentialing-files"
    description: "List credentialing files; filter by placement_id (FK reverse for CredentialingFile.placement_id) and candidate_id (FK reverse for CredentialingFile.candidate_id)"
    roles: [PlatformAdmin, CredentialingCoordinator, AccountManager]
    code: 200
    input: ["placement_id?", "candidate_id?", "limit?", "offset?"]
    output: CredentialingFile[]
    side_effects: []

  - method: POST
    path: "/credentialing-files/{id}/items"
    description: "Add a credential item to a file"
    roles: [CredentialingCoordinator]
    code: 201
    input: [item_type, "is_required?"]
    output: CredentialItem
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/credentialing-files/{id}/items"
    description: "List a file's credential items (FK reverse for CredentialItem.credentialing_file_id)"
    roles: [PlatformAdmin, CredentialingCoordinator, AccountManager]
    code: 200
    input: ["limit?", "offset?"]
    output: CredentialItem[]
    side_effects: []

  - method: POST
    path: "/credential-items/{credentialItemId}/transition"
    description: "Transition a credential item: SUBMIT / VERIFY / FLAG / RESUBMIT"
    roles: [CredentialingCoordinator]
    code: 200
    input: [action]
    output: CredentialItem
    side_effects: ["bubble up: parent CredentialingFile.overall_status recomputed"]

  # ---- GuaranteeClaim ----
  - method: POST
    path: "/guarantee-claims"
    description: "File a guarantee claim (fallout) against a placement"
    roles: [Recruiter, AccountManager]
    code: 201
    input: [placement_id, fell_out_date, reason]
    output: GuaranteeClaim
    side_effects: ["status=FILED; client_id copied; days_worked computed"]

  - method: GET
    path: "/guarantee-claims/{guaranteeClaimId}"
    description: "Get a guarantee claim"
    roles: [PlatformAdmin, AccountManager, Recruiter]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []

  - method: GET
    path: "/guarantee-claims"
    description: "List guarantee claims; filter by placement_id (FK reverse for GuaranteeClaim.placement_id) and client_id (FK reverse for GuaranteeClaim.client_id)"
    roles: [PlatformAdmin, AccountManager, Recruiter]
    code: 200
    input: ["placement_id?", "client_id?", "limit?", "offset?"]
    output: GuaranteeClaim[]
    side_effects: []

  - method: POST
    path: "/guarantee-claims/{guaranteeClaimId}/transition"
    description: "Transition a claim: APPROVE / DENY / RESOLVE_REFUND / RESOLVE_REPLACEMENT"
    roles: [AccountManager]
    code: 200
    input: [action, "replacement_placement_id?"]
    output: GuaranteeClaim
    side_effects: ["APPROVE cascades placement FELL_OUT + opening reopen; RESOLVE_* computes guarantee_credit and recomputes Client.net_placement_fee_cents"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field or wrong type" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed role acted on a resource it does not own" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Fee-waive approver is the same AccountManager who extended the offer (four-eyes)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_offer_version does not match current Offer.version on revise (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_INTERVIEWER_INVALID, http: 422, condition: "SiteVisit interviewer_user_id is not an ACTIVE StaffUser" }
  - { id: ERR_SPECIALTY_MISMATCH, http: 422, condition: "Candidate.specialty != JobOpening.specialty on SUBMIT" }
  - { id: ERR_INTERVIEWER_DOUBLE_BOOKED, http: 409, condition: "Site visit overlaps another SCHEDULED visit on the same interviewer (half-open intervals)" }
  - { id: ERR_CANDIDATE_TRAVEL_CONFLICT, http: 409, condition: "Site visit is within CANDIDATE_TRAVEL_BUFFER_MINUTES of another SCHEDULED visit for the same candidate" }
  - { id: ERR_OPENING_NOT_OPEN, http: 409, condition: "SUBMIT attempted while JobOpening.status != OPEN" }
  - { id: ERR_COMP_OUT_OF_RANGE, http: 422, condition: "Offer/revise base_salary_cents outside [opening.comp_min_cents, opening.comp_max_cents]" }
  - { id: ERR_NO_COMPLETED_SITE_VISIT, http: 409, condition: "Offer creation attempted with no COMPLETED SiteVisit on the application" }
  - { id: ERR_CREDENTIALING_NOT_CLEARED, http: 409, condition: "ONBOARD attempted while CredentialingFile.overall_status != CLEARED" }
  - { id: ERR_GUARANTEE_WINDOW_EXPIRED, http: 422, condition: "Guarantee claim fell_out_date is after placement.guarantee_end_date" }
  - { id: ERR_NO_ELIGIBLE_RECRUITER, http: 409, condition: "PUBLISH found no ACTIVE RECRUITER covering the opening.specialty" }
  - { id: ERR_OPENING_FILLED, http: 409, condition: "Operation blocked because the opening is already FILLED" }
  - { id: ERR_FINAL_COMP_REQUIRED, http: 422, condition: "INVOICE attempted without final_first_year_comp_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Recruiter
    description: "Sources candidates, builds the pipeline, schedules site visits, records candidate-side offer decisions, files guarantee claims."
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /candidates — create own candidate"
      - "POST /applications — source candidate onto opening"
      - "POST /site-visits — schedule interview"
      - "POST /site-visits/{id}/transition — complete/cancel/no-show"
      - "POST /applications/{id}/advance {SCREEN,SUBMIT,WITHDRAW}"
      - "POST /offers/{id}/transition {ACCEPT,DECLINE}"
    shared_operations:
      - "POST /placements/{id}/relocation-expenses (with AccountManager)"
      - "POST /guarantee-claims (with AccountManager)"
      - "GET reads of staff/openings/candidates/applications/site-visits/offers/placements"

  - name: AccountManager
    description: "Owns clients and openings, extends/revises offers, manages placement billing and guarantee resolution. Subject to four-eyes on fee waiver."
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /job-openings and /job-openings/{id}/transition"
      - "POST /offers — extend offer"
      - "POST /offers/{id}/revise — OCC revise"
      - "POST /offers/{id}/transition {RESCIND,EXPIRE}"
      - "POST /placements/{id}/transition (fee + placement_status + relocation actions)"
      - "POST /guarantee-claims/{id}/transition — approve/deny/resolve"
    shared_operations:
      - "POST /placements/{id}/relocation-expenses (with Recruiter)"
      - "POST /guarantee-claims (with Recruiter)"
      - "GET reads"

  - name: CredentialingCoordinator
    description: "Manages credentialing files and items and onboards placements once credentialing is CLEARED."
    identity: "entity_backed:StaffUser"
    exclusive_operations:
      - "POST /credentialing-files/{id}/items — add credential item"
      - "POST /credential-items/{id}/transition — submit/verify/flag/resubmit"
    shared_operations:
      - "POST /placements/{id}/transition {ONBOARD} (with AccountManager surface)"
      - "GET reads of credentialing files/items and placements"

  - name: ClientContact
    description: "Client-side hiring contact. Reviews submitted candidates, counters offers. X-User-ID equals the Client.id they represent."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /applications/{id}/advance {ADVANCE_TO_INTERVIEW,CLIENT_PASS} — client review decisions on own openings"
      - "POST /offers/{id}/transition {COUNTER} — counter an offer on own opening"
    shared_operations:
      - "GET reads of own clients/openings/applications/offers"

  - name: PlatformAdmin
    description: "Operational role. Provisions staff users and controls the logical clock. Not tied to any persisted business entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /staff-users — provision staff"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads across resources"




