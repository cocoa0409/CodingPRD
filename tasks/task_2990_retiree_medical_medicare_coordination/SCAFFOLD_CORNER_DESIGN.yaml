          setup:
            - "PlanYear 2027 OPEN, PlanOption PRE65-CORE ACTIVE, R1 CERTIFIED ELIGIBLE."
            - "Logical clock advanced to 2027-03-08T00:00:00Z, exactly the window_deadline for event_date 2027-02-05."
