# =============================================================================
# Task 1996: Demolition Contracting & Salvage — §1.8 Scaffold Difficulty Design
# 26 instances across the nine Difficulty Rules (harder-than-expert scaling:
# 3 instances each for combinatorial_formula / non_linear_state_machine /
# transitive_cascade / priority_pair_validation_conflict; 4 each for
# boundary_precision_check / cross_entity_state_dependency).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: salvage_optimistic_vs_conservative_divergence
        grounds:
          - calculations.salvage_valuation
          - entities.SalvageManifest.fields.optimistic_total_cents
          - entities.SalvageManifest.fields.conservative_total_cents
        distinguishing_aspect: |
          Same two salvage lines produce optimistic_total_cents == 1528000 and
          conservative_total_cents == 1180000 (delta 348000); FINALIZE under
          CONSERVATIVE policy nets 1130000 — this dual variant lives on the
          SalvageManifest cost domain, not on any safety or scoring metric.
        test_recipe:
          setup:
            - "Project exists; manifest with valuation_policy CONSERVATIVE and fee 50000 has items STEEL qty 4 (low 20000, high 32000) and COPPER qty 2 (low 550000, high 700000)."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Salvage Lot", address: "1 Pine St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/salvage-manifests", payload: { valuation_policy: "CONSERVATIVE", processing_fee_cents: 50000 }, as: SalvageEstimator, captures: { m_id: $.data.id } }
            - { call: "POST /demolition/salvage-manifests/${m_id}/items", payload: { material: "STEEL", description: "beams", quantity: 4, unit: "TON", low_unit_value_cents: 20000, high_unit_value_cents: 32000 }, as: SalvageEstimator }
            - { call: "POST /demolition/salvage-manifests/${m_id}/items", payload: { material: "COPPER", description: "wire", quantity: 2, unit: "TON", low_unit_value_cents: 550000, high_unit_value_cents: 700000 }, as: SalvageEstimator }
          trigger:
            - { call: "POST /demolition/salvage-manifests/${m_id}/transition", payload: { action: "FINALIZE" }, as: SalvageEstimator, captures: { m_opt: $.data.optimistic_total_cents, m_con: $.data.conservative_total_cents, m_net: $.data.net_credit_cents } }
          assert:
            - "SalvageManifest.${m_id}.optimistic_total_cents == 1528000"
            - "SalvageManifest.${m_id}.conservative_total_cents == 1180000"
            - "SalvageManifest.${m_id}.net_credit_cents == 1130000 (1180000 - 50000; the OPTIMISTIC net would be 1478000)"
            - "SalvageManifest.${m_id}.status == FINALIZED"

      - name: erosion_provisional_vs_final_divergence
        grounds:
          - calculations.erosion_coverage
          - state_machines.BackfillPlan.DRAFT_to_APPROVED
          - state_machines.BackfillPlan.COMPACTION_VERIFIED_to_EROSION_VERIFIED
        distinguishing_aspect: |
          Same BackfillPlan yields provisional_coverage_ratio 0.9500 (design
          areas 9500/10000) but final_coverage_ratio 0.8800 (as-built
          8976/10200): provisional passes 0.9000, final fails — a dual variant
          on the BackfillPlan compliance domain, distinct from SalvageManifest
          cost accounting.
        test_recipe:
          setup:
            - "Project exists; BackfillPlan with design_disturbed 10000, planned_protected 9500, fill 500, required compaction 95.0 is APPROVED then COMPACTION_VERIFIED."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Erosion Lot", address: "2 Oak St", lot_area_sqft: 30000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/backfill-plans", payload: { design_disturbed_area_sqft: 10000, planned_protected_area_sqft: 9500, fill_volume_cu_yd: 500, required_compaction_pct: 95.0 }, as: SiteSupervisor, captures: { bp_id: $.data.id } }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "APPROVE" }, as: StructuralEngineer, captures: { prov: $.data.provisional_coverage_ratio } }
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "RECORD_COMPACTION", compaction_pct: 96.0 }, as: SiteSupervisor }
          trigger:
            - { call: "POST /demolition/backfill-plans/${bp_id}/transition", payload: { action: "VERIFY_EROSION", measured_protected_area_sqft: 8976, measured_disturbed_area_sqft: 10200 }, as: MunicipalInspector, captures: { err: $.data.error_id } }
          assert:
            - "provisional variant: BackfillPlan.${bp_id}.provisional_coverage_ratio == 0.95 (>= 0.9000, would pass)"
            - "final variant: round_half_up(8976/10200, 4) == 0.88 < 0.9000, so trigger is rejected with ${err} == ERR_EROSION_COVERAGE_INSUFFICIENT"
            - "BackfillPlan.${bp_id}.status remains COMPACTION_VERIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: dust_exposure_multi_input_tiered_formula
        grounds:
          - calculations.dust_exposure_score
          - entities.DustNoiseLog.fields.exposure_score
        distinguishing_aspect: |
          Mode (a): score = min(measured * tiered_wind_factor * duration, 1000)/10
          with 4 wind tiers — (100, wind 15, 5h) = 80.0 exceedance vs
          (100, wind 10, 5h) = 50.0 non-exceedance; identical measured_value and
          duration diverge purely through the tiered wind factor branch.
        test_recipe:
          setup:
            - "Project in DEMOLITION_ACTIVE with WORKABLE posture (release gate fully satisfied; see chain)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Dust Lot", address: "3 Birch St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "du-rep-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "du-ver-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "du-conf-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "HIGH_REACH_ARM", structural_stability_rating: "CONDITIONALLY_STABLE", max_structure_height_ft: 60, adjacent_structure_distance_ft: 25 }, as: StructuralEngineer, as_user_id: "de-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "de-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "de-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "5 Birch St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/dust-noise-logs", payload: { reading_type: "PM25", measured_value: 100, wind_speed_mph: 10, duration_hours: 5 }, as: EnvironmentalMonitor, captures: { lg1_score: $.data.exposure_score, lg1_exc: $.data.is_exceedance } }
            - { call: "POST /demolition/projects/${p_id}/dust-noise-logs", payload: { reading_type: "PM25", measured_value: 100, wind_speed_mph: 15, duration_hours: 5 }, as: EnvironmentalMonitor, captures: { lg2_score: $.data.exposure_score, lg2_exc: $.data.is_exceedance } }
          assert:
            - "log 1: wind tier [5,12] -> factor 1.0; ${lg1_score} == 50.0 and ${lg1_exc} == false; project stays WORKABLE"
            - "log 2: wind tier (12,20] -> factor 1.6; ${lg2_score} == 80.0 and ${lg2_exc} == true"
            - "Project.${p_id}.work_posture == STOPPED after log 2 (cascade fires)"
            - "Project.${p_id}.cumulative_exposure_score == 130.0 (50.0 + 80.0)"

      - name: diversion_rate_sum_then_divide_rounding
        grounds:
          - calculations.diversion_rate
          - entities.Project.fields.diversion_rate
          - entities.Project.fields.diversion_tier
        distinguishing_aspect: |
          Mode (b): pinned order is sum-then-divide with a single final rounding —
          tickets (10.000g/4.000d) and (1.000g/0.900d) give aggregate
          round_half_up(4.9/11, 4) == 0.4455 -> STANDARD, whereas the rejected
          average-of-per-ticket-rates order yields (0.4+0.9)/2 == 0.65 -> SILVER.
        test_recipe:
          setup:
            - "Project in DEMOLITION_ACTIVE (same release chain as dust_exposure_multi_input_tiered_formula with clean survey, one confirmed ELECTRIC disconnect, ACTIVE permit area 20000, pinned CERTIFIED engineering survey, one DELIVERED notification at 2026-08-02T09:00:00Z, release at 2026-08-05T09:00:00Z)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects", payload: { name: "Diversion Lot", address: "7 Cedar St", lot_area_sqft: 30000, required_diversion_rate: 0.5 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/structure-surveys", payload: { structure_label: "Main" }, as: Surveyor, captures: { sv_id: $.data.id } }
            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "du-rep-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "du-ver-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "du-conf-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "MECHANICAL", structural_stability_rating: "STABLE", max_structure_height_ft: 30, adjacent_structure_distance_ft: 40 }, as: StructuralEngineer, as_user_id: "de-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "de-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "de-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "9 Cedar St", notice_method: "DOOR_HANGER", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn_id}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/projects/${p_id}/release", payload: {}, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/transition", payload: { action: "START_DEMOLITION" }, as: SiteSupervisor }
          trigger:
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-1", facility_type: "LANDFILL", material_class: "MIXED_CD", gross_tons: 10.0 }, as: HaulingDispatcher, captures: { tk1: $.data.id } }
            - { call: "POST /demolition/debris-tickets/${tk1}/transition", payload: { action: "RECEIVE", diverted_tons: 4.0 }, as: HaulingDispatcher }
            - { call: "POST /demolition/projects/${p_id}/debris-tickets", payload: { ticket_number: "T-2", facility_type: "RECYCLING", material_class: "CONCRETE", gross_tons: 1.0 }, as: HaulingDispatcher, captures: { tk2: $.data.id } }
            - { call: "POST /demolition/debris-tickets/${tk2}/transition", payload: { action: "RECEIVE", diverted_tons: 0.9 }, as: HaulingDispatcher }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_rate: $.data.diversion_rate, p_tier: $.data.diversion_tier } }
          assert:
            - "Project.${p_id}.diversion_rate == 0.4455 (round_half_up(4.9/11, 4)) — NOT 0.65 from averaging per-ticket rates"
            - "Project.${p_id}.diversion_tier == STANDARD (0.4455 < 0.5000; averaging would wrongly yield SILVER)"
            - "Project.${p_id}.landfill_tons == 6.1 and diverted_tons == 4.9"

      - name: permit_fee_tier_evaluation_order
        grounds:
          - calculations.permit_fee
          - entities.DemolitionPermit.fields.fee_cents
        distinguishing_aspect: |
          Mode (c): tier selection is keyed on the provisional subtotal at the
          BASE rate, never on the final fee — area 30000 gives provisional
          510000 >= 500000 so TIER2 applies (fee 715000), while area 29166 gives
          provisional 499992 < 500000 so TIER1 (fee 499992) even though a naive
          final-fee check would behave differently; the scaffold pins the order.
        test_recipe:
          setup:
            - "Four empty projects, each gets one permit application with a different gross floor area."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Fee A", address: "1 A St", lot_area_sqft: 90000 }, as: ContractorAdmin, captures: { pa: $.data.id } }
            - { call: "POST /demolition/projects", payload: { name: "Fee B", address: "2 B St", lot_area_sqft: 90000 }, as: ContractorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /demolition/projects", payload: { name: "Fee C", address: "3 C St", lot_area_sqft: 90000 }, as: ContractorAdmin, captures: { pc: $.data.id } }
            - { call: "POST /demolition/projects", payload: { name: "Fee D", address: "4 D St", lot_area_sqft: 90000 }, as: ContractorAdmin, captures: { pd: $.data.id } }
          trigger:
            - { call: "POST /demolition/projects/${pa}/permits", payload: { permit_number: "P-A", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { fee_a: $.data.fee_cents } }
            - { call: "POST /demolition/projects/${pb}/permits", payload: { permit_number: "P-B", gross_floor_area_sqft: 30000 }, as: PermitCoordinator, captures: { fee_b: $.data.fee_cents } }
            - { call: "POST /demolition/projects/${pc}/permits", payload: { permit_number: "P-C", gross_floor_area_sqft: 29166 }, as: PermitCoordinator, captures: { fee_c: $.data.fee_cents } }
            - { call: "POST /demolition/projects/${pd}/permits", payload: { permit_number: "P-D", gross_floor_area_sqft: 29167 }, as: PermitCoordinator, captures: { fee_d: $.data.fee_cents } }
          assert:
            - "${fee_a} == 390000 (150000 + 20000*12; provisional 390000 < 500000 -> TIER1)"
            - "${fee_b} == 715000 (provisional 510000 >= 500000 -> TIER2: 150000 + 30000*18 + 25000)"
            - "${fee_c} == 499992 (provisional 499992 < 500000 -> TIER1)"
            - "${fee_d} == 700006 (provisional 500004 >= 500000 -> TIER2: 150000 + 29167*18 + 25000)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: engineering_survey_certified_revision_cycle
        grounds:
          - state_machines.EngineeringSurvey.CERTIFIED_to_DRAFT
          - state_machines.EngineeringSurvey.DRAFT_to_SUBMITTED
          - state_machines.EngineeringSurvey.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          EngineeringSurvey is cyclic: CERTIFIED -> DRAFT via REQUEST_REVISION
          bumps revision_number 1 -> 2 and clears certified_by_user_id, then the
          survey loops DRAFT -> SUBMITTED -> CERTIFIED again — not a linear
          pipeline — on the EngineeringSurvey entity.
        test_recipe:
          setup:
            - "Project exists with a CERTIFIED engineering survey at revision_number 1."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Cycle Lot", address: "8 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "IMPLOSION", structural_stability_rating: "UNSTABLE", max_structure_height_ft: 120, adjacent_structure_distance_ft: 200 }, as: StructuralEngineer, as_user_id: "cy-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "cy-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "cy-p-1" }
          trigger:
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "REQUEST_REVISION" }, as: PeerReviewEngineer, as_user_id: "cy-p-1", captures: { es_rev: $.data.revision_number, es_st: $.data.status, es_cert: $.data.certified_by_user_id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "cy-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "cy-p-1", captures: { es_rev2: $.data.revision_number, es_st2: $.data.status } }
          assert:
            - "after REQUEST_REVISION: ${es_st} == DRAFT, ${es_rev} == 2, ${es_cert} == null"
            - "after loop-back: ${es_st2} == CERTIFIED and ${es_rev2} == 2 (revision never resets)"

      - name: utility_disconnect_parallel_dimensions_with_reject_cycle
        grounds:
          - state_machines.UtilityDisconnect
          - entities.UtilityDisconnect.fields.disconnect_status
          - entities.UtilityDisconnect.fields.verification_status
        distinguishing_aspect: |
          UtilityDisconnect carries two independent state dimensions on one row:
          REPORT_DISCONNECTED flips only disconnect_status; the verification
          dimension cycles FIELD_VERIFIED -> VERIFICATION_REJECTED ->
          FIELD_VERIFIED -> CONFIRMED while disconnect_status stays
          REPORTED_DISCONNECTED throughout — parallel dimensions, not linear.
        test_recipe:
          setup:
            - "Project exists with one ELECTRIC UtilityDisconnect scheduled."
          setup_api_calls:
            - { call: "POST /demolition/projects", payload: { name: "Util Lot", address: "9 Elm St", lot_area_sqft: 20000 }, as: ContractorAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "ELECTRIC", provider_name: "City Power", disconnect_window_start: "2026-08-03T08:00:00Z", disconnect_window_end: "2026-08-03T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
          trigger:
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "uu-x-1", captures: { err0: $.data.error_id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "uu-r-1", captures: { d1: $.data.disconnect_status, v1: $.data.verification_status } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "uu-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REJECT_VERIFICATION" }, as: UtilityCoordinator, as_user_id: "uu-v-2", captures: { d2: $.data.disconnect_status, v2: $.data.verification_status } }
