  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /slate/studios"
              payload: { name: "No Role Studio", ad_budget_cents: 1 }
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED and http status == 401"

      - name: forbidden_role_returns_forbidden_not_unauthenticated
        claim_type: Priority Ordering
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "An authenticated-but-wrong role (SlatePlanner creating a studio) gets 403 ERR_FORBIDDEN, never 401 — priority 1 passes, priority 2 fires."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /slate/studios"
              payload: { name: "Wrong Role", ad_budget_cents: 1 }
              as: SlatePlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN and http status == 403"

      - name: existence_beats_state_on_unknown_title_approve
        claim_type: Priority Ordering
        grounds:
          - validations.priority_3
          - validations.priority_6
        distinguishing_aspect: "Approving a non-existent title id returns 404 ERR_NOT_FOUND, not ERR_INVALID_STATE — existence (priority 3) precedes state (priority 6)."
        test_recipe:
          setup:
            - "Empty database (no titles)."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id, studio_v: $.data.version }
            - call: "POST /slate/seasons"
              payload: { studio_id: "00000000-0000-0000-0000-000000000000", year: 2027, label: "Ghost", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 10 }
              as: PlatformAdmin
              captures: { err_season: $.data.error_id }
          trigger:
            - call: "POST /slate/titles/00000000-0000-0000-0000-000000000000/approve"
              payload: { expected_season_version: "${studio_v}" }
              as: SlatePlanner
              captures: { err: $.data.error_id }
          assert:
            - "err_season == ERR_NOT_FOUND (unknown body FK) and http status == 404"
            - "err == ERR_NOT_FOUND and http status == 404 (unknown path id; existence beats state and beats the OCC check — the version value is irrelevant once the title does not exist)"

      - name: body_fk_out_of_scope_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations.priority_4
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Creating a casting whose talent_id belongs to a DIFFERENT studio than the title's season returns 404 ERR_NOT_FOUND (studio-scope isolation), not a brand or availability error."
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studios A and B. Season under A (LOCKED), title approved under A. Talent created under B."
          setup_api_calls:
