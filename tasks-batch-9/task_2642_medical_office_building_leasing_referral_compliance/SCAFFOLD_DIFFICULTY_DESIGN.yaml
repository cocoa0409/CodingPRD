            - call: "POST /tenants"
              payload: { legal_name: "Second Street Radiology LLC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "RADIOLOGY", is_physician_owned: false, npi: "1234567942" }
              as: PortfolioAdmin
              captures: { t10w_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Orthopedics LLC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "ORTHOPEDICS", is_physician_owned: false, npi: "1234567943" }
              as: PortfolioAdmin
              captures: { t10z_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b10_id}", suite_id: "${s10y_id}", tenant_id: "${t10y_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 36.50 }
              as: LeasingAgent
              captures: { l10y_id: $.data.id }
            - call: "POST /leases/${l10y_id}/submit-fmv-review"
              payload: { submission_note: "Imaging suite, corporate tenant" }
              as: LeasingAgent
