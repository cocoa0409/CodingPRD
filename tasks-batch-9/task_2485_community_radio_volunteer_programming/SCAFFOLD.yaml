scenario: |
  Generate task harder than expert level!

  2485. Community Radio Volunteer Programming (community radio station): volunteer programmer training and certification on board operation, station policies and broadcast regulations, program proposal review with a programming committee against format, diversity and quality criteria, schedule construction with time slot assignment, seniority policies and periodic review of underperforming shows, underwriting versus advertising distinction with copy review for noncommercial compliance, music reporting for royalty payments and playlist logging requirements, indecency, political content and public file compliance with the broadcast regulator, membership drive operations with volunteer phone banks and premium fulfillment, conflict resolution among volunteers and program cancellation procedures
domain_name: community-radio-volunteer-programming
api_prefix: ""   # flat topology: every entity collection is a peer at the URL root (/volunteers, /program-proposals, /schedule-grids, ...)

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is addressed at its own root collection and linked by explicit FK fields
  # (volunteer_id, grid_id, program_id, episode_id, drive_id ...). Only three sub-resource
  # paths exist and they are creation/reverse-lookup conveniences, never ownership nesting.

  state_machine_shape: cyclic
  # ProgramProposal (REVISION_REQUESTED -> SUBMITTED), CertificationRecord (FAILED ->
  # PENDING_EXAM), SlotAssignment (PREEMPTED -> CONFIRMED) are true cycles; Program and
  # Pledge additionally carry two independent parallel state dimensions each.

  relationship_patterns:
    - one_to_many          # ScheduleGrid -> SlotAssignment, MembershipDrive -> Pledge
    - many_to_many         # Volunteer <-> ProgramProposal via CommitteeVote (junction with payload)
    - polymorphic          # ComplianceIncident targets Program | Episode | UnderwritingSpot | Volunteer
    - cross_aggregate      # SlotAssignment couples ScheduleGrid to Program; Pledge couples MembershipDrive to PremiumItem

  role_model: segregation_of_duties
  # A CommitteeMember may not vote on a proposal they authored; the ComplianceOfficer who
  # cleared an UnderwritingSpot may not adjudicate the incident raised against that same spot.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Volunteer's legal name as it appears on the station roster.
      - name: email
        type: string
        source: input
        description: Contact address; unique across Volunteer rows.
        constraints: "unique; non-empty"
      - name: role_track
        type: enum
        source: input
        description: Which volunteer track the person is enrolled in.
        constraints: "PROGRAMMER | ENGINEER | DEVELOPMENT"
      - name: seniority_start_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the volunteer's continuous service began; the base of every seniority computation."
        constraints: "YYYY-MM-DD; must be <= current logical clock date"
      - name: committee_seat
        type: boolean
        source: input
        description: True when the volunteer currently holds a programming-committee seat and may cast CommitteeVote rows.
        default: false
      - name: status
        type: enum
        source: computed
        description: "Roster standing; driven only by the Volunteer state machine (never accepted as input)."
        default: PROSPECT
        constraints: "PROSPECT | IN_TRAINING | CERTIFIED | PROBATION | SUSPENDED | RESIGNED"
      - name: continuous_service_months
        type: integer
        source: computed
        description: "Whole months from seniority_start_date to the current logical clock (floor; a partial month does not count)."
      - name: current_certification_count
        type: integer
        source: computed
        description: "Count of this volunteer's CertificationRecord rows with status == PASSED and expires_on > current logical clock."
      - name: strike_count
        type: integer
        source: computed
        description: "Disciplinary strikes: +1 per PhoneBankShift closed NO_SHOW and +1 per ComplianceIncident adjudicated SUBSTANTIATED with sanction WARNING against this volunteer."
        default: 0
      - name: seniority_score
        type: number
        source: computed
        description: "Ranking value used by slot-preemption decisions; see calculations.volunteer_seniority_score. 2 decimal places."
        default: 0.00
      - name: needs_core_renewal
        type: boolean
        source: computed
        description: True when at least one of the three core certification types is absent, EXPIRED or REVOKED for this volunteer.
        default: true

  - name: CertificationRecord
    parent: Volunteer
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the trainee this record belongs to."
      - name: cert_type
        type: enum
        source: input
        description: Which station curriculum this record certifies.
        constraints: "BOARD_OPERATION | STATION_POLICY | BROADCAST_REGULATION | UNDERWRITING_COPY"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state of the certification attempt.
        default: PENDING_EXAM
        constraints: "PENDING_EXAM | PASSED | FAILED | EXPIRED | REVOKED"
      - name: exam_score
        type: integer
        source: input
        description: "Proctored score 0-100 recorded by the TrainingCoordinator; null until an attempt is graded."
        constraints: "integer 0..100"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of graded attempts on this record; starts at 0 and increments on every grading."
        default: 0
      - name: issued_on
        type: datetime
        source: computed
        description: Logical-clock instant at which the record reached PASSED; null otherwise.
      - name: expires_on
        type: datetime
        source: computed
        description: "issued_on + 24 calendar months; null until PASSED. The daily sweep expires the record at expires_on."
      - name: last_attempt_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent grading; the base of the retake cooling-off window.
      - name: revocation_reason
        type: string
        source: input
        description: Free text recorded when a ComplianceOfficer revokes the certification; null otherwise.

  - name: ProgramProposal
    parent: null
    common_fields: true
    fields:
      - name: proposer_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the programmer who authored the proposal and who is barred from voting on it."
      - name: title
        type: string
        source: input
        description: Working title of the proposed show.
      - name: format_code
        type: enum
        source: input
        description: Programming format the proposal is judged against.
        constraints: "MUSIC | PUBLIC_AFFAIRS | TALK | NEWS | CULTURAL"
      - name: language_code
        type: string
        source: input
        description: "Primary broadcast language as a two-letter lowercase-insensitive code; any value other than \"EN\" earns the language bonus."
        constraints: "2 uppercase letters"
      - name: requested_daypart
        type: enum
        source: input
        description: Daypart the proposer is asking for; advisory only, the grid may place the show elsewhere.
        constraints: "MORNING_DRIVE | MIDDAY | AFTERNOON_DRIVE | EVENING | OVERNIGHT"
      - name: requested_duration_minutes
        type: integer
        source: input
        description: Requested episode length in minutes; becomes the default slot duration.
        constraints: "integer 15..720"
      - name: diversity_tags
        type: array
        source: input
        description: "List of station diversity descriptors (e.g. [\"LOCAL_ARTIST_FOCUS\", \"IMMIGRANT_COMMUNITY\"]); may be empty."
      - name: status
        type: enum
        source: computed
        description: Committee review lifecycle state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | IN_COMMITTEE | REVISION_REQUESTED | APPROVED | DECLINED | WITHDRAWN"
      - name: review_round
        type: integer
        source: computed
        description: "Current committee round; 1 on first submit, incremented on every re-submit out of REVISION_REQUESTED. Only votes whose review_round equals this value are tallied."
        default: 1
      - name: composite_score
        type: number
        source: computed
        description: "Latest tally result from calculations.proposal_composite_score, 2 decimal places; null before the first decide."
      - name: decline_majority
        type: boolean
        source: computed
        description: True when the tallied round's DECLINE recommendations satisfied 2 * decline_count > vote_count.
        default: false
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent decide call.

  - name: CommitteeVote
    parent: ProgramProposal
    common_fields: false
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> ProgramProposal.id; the proposal being scored."
      - name: member_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the seated committee member casting the vote."
      - name: review_round
        type: integer
        source: computed
        description: Copied from the proposal's review_round at cast time; freezes the vote to that round.
      - name: format_fit_score
        type: integer
        source: input
        description: Format-fit criterion, 1..5.
        constraints: "integer 1..5"
      - name: diversity_score
        type: integer
        source: input
        description: Diversity criterion, 1..5.
        constraints: "integer 1..5"
      - name: quality_score
        type: integer
        source: input
        description: Production-quality criterion, 1..5.
        constraints: "integer 1..5"
      - name: recommendation
        type: enum
        source: input
        description: The member's overall recommendation; DECLINE votes drive the decline-majority override.
        constraints: "APPROVE | REVISE | DECLINE"
      - name: rationale
        type: string
        source: input
        description: Written justification retained in the committee minutes.

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> ProgramProposal.id; the approved proposal this show was created from."
      - name: host_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the programmer of record, copied from the proposal's proposer."
      - name: title
        type: string
        source: computed
        description: Copied from the proposal at creation.
      - name: format_code
        type: enum
        source: computed
        description: Copied from the proposal at creation; drives the grid diversity quota and the local-artist term of the performance score.
        constraints: "MUSIC | PUBLIC_AFFAIRS | TALK | NEWS | CULTURAL"
      - name: programming_status
        type: enum
        source: computed
        description: "First of the two independent state dimensions: where the show sits in the programming lifecycle."
        default: APPROVED_UNSCHEDULED
        constraints: "APPROVED_UNSCHEDULED | SCHEDULED | ON_AIR_ACTIVE | UNDER_REVIEW | PROBATION | CANCELLED"
      - name: compliance_standing
        type: enum
        source: computed
        description: "Second, independent state dimension: regulator-facing standing driven only by ComplianceIncident adjudication and remediation."
        default: CLEAR
        constraints: "CLEAR | WATCH | RESTRICTED"
      - name: compliance_penalty_points
        type: integer
        source: computed
        description: "Running sum of penalty_points over this program's SUBSTANTIATED ComplianceIncident rows; remediation subtracts the incident's points back out."
        default: 0
      - name: performance_score
        type: number
        source: computed
        description: "Latest value from calculations.program_performance_score, 2 decimal places; null until the first review or sweep evaluation."
      - name: performance_score_method
        type: enum
        source: computed
        description: Which variant produced performance_score.
        constraints: "TRAILING_SIX | QUARTER_TO_DATE"
      - name: last_evaluated_at
        type: datetime
        source: computed
        description: Logical-clock instant performance_score was last recomputed.
      - name: cancellation_reason
        type: string
        source: input
        description: Reason recorded by the ProgramDirector when the show is cancelled; null otherwise.

  - name: ScheduleGrid
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: string
        source: input
        description: "Station season label, e.g. \"2026-SPRING\"; unique across grids."
        constraints: "unique; non-empty"
      - name: effective_from
        type: datetime
        source: input
        description: First instant the grid governs the air schedule.
      - name: effective_to
        type: datetime
        source: input
        description: Last instant the grid governs the air schedule; must be strictly after effective_from.
      - name: status
        type: enum
        source: computed
        description: Grid construction lifecycle.
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | PUBLISHED | SUPERSEDED"
      - name: total_assigned_minutes
        type: integer
        source: computed
        description: "Sum of duration_minutes over this grid's SlotAssignment rows whose status is in {TENTATIVE, CONFIRMED}."
        default: 0
      - name: public_affairs_minutes_pct
        type: number
        source: computed
        description: "See calculations.grid_public_affairs_share; 2 decimal places, 0.00 when total_assigned_minutes == 0."
        default: 0.00
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant the grid reached PUBLISHED; null otherwise.
  - name: SlotAssignment
    parent: ScheduleGrid
    common_fields: true
    fields:
      - name: grid_id
        type: string
        source: input
        description: "FK -> ScheduleGrid.id; the grid this occupation belongs to."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the show occupying the slot."
      - name: day_of_week
        type: integer
        source: input
        description: "Recurring weekday of the slot, 0 = Sunday .. 6 = Saturday, station-local time (station local == UTC)."
        constraints: "integer 0..6"
      - name: start_minute
        type: integer
        source: input
        description: Minutes after station-local midnight at which the slot opens.
        constraints: "integer 0..1425"
      - name: duration_minutes
        type: integer
        source: input
        description: Slot length in minutes.
        constraints: "integer 15..720; start_minute + duration_minutes <= 1440"
      - name: status
        type: enum
        source: computed
        description: Occupation lifecycle.
        default: TENTATIVE
        constraints: "TENTATIVE | CONFIRMED | RELEASED | PREEMPTED"
      - name: preempted_by_program_id
        type: string
        source: computed
        description: "FK -> Program.id; set when this occupation lost the slot to a senior challenger, else null."
      - name: release_reason
        type: string
        source: input
        description: Reason recorded on release; null while the assignment is live.

  - name: Episode
    parent: Program
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the show this airing belongs to."
      - name: slot_assignment_id
        type: string
        source: input
        description: "FK -> SlotAssignment.id; the recurring occupation this airing instantiates. Its weekday and start minute must match scheduled_start_utc."
      - name: board_operator_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; whoever runs the board for this airing. Null means the airing still needs a substitute."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Exact instant the airing is scheduled to begin.
      - name: air_status
        type: enum
        source: computed
        description: "First state dimension: what actually happened on air."
        default: SCHEDULED
        constraints: "SCHEDULED | AIRED | SUBSTITUTE_AIRED | MISSED | CANCELLED"
      - name: log_status
        type: enum
        source: computed
        description: "Second, independent state dimension: where the playlist log sits. NOT_REQUIRED for non-MUSIC formats that aired without music."
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | PENDING | SUBMITTED | CERTIFIED | DELINQUENT"
      - name: needs_substitute
        type: boolean
        source: computed
        description: True when the assigned board operator lost eligibility and no replacement has been recorded.
        default: false
      - name: featured_performance_count
        type: integer
        source: computed
        description: "Count of this episode's PlaylistEntry rows whose royalty_class == FEATURED."
        default: 0
      - name: local_featured_count
        type: integer
        source: computed
        description: "Count of this episode's FEATURED PlaylistEntry rows with is_local_artist == true."
        default: 0
      - name: provisional_royalty_cents
        type: integer
        source: computed
        description: "SURVEY-variant estimate written when the log reaches SUBMITTED; see calculations.episode_royalty_liability_cents."
      - name: final_royalty_cents
        type: integer
        source: computed
        description: "CENSUS-variant liability written when the log reaches CERTIFIED; see calculations.episode_royalty_liability_cents."
      - name: log_due_at
        type: datetime
        source: computed
        description: "scheduled_start_utc + 72 hours; the sweep marks a still-PENDING log DELINQUENT at or after this instant."

  - name: PlaylistEntry
    parent: Episode
    common_fields: false
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the airing this spin belongs to."
      - name: sequence_number
        type: integer
        source: input
        description: Position of the spin inside the episode log; unique per episode.
        constraints: "integer >= 1; unique per episode_id"
      - name: artist
        type: string
        source: input
        description: Performer credited in the royalty report.
      - name: title
        type: string
        source: input
        description: Track title credited in the royalty report.
      - name: album
        type: string
        source: input
        description: Album or release the spin came from; optional.
      - name: label
        type: string
        source: input
        description: Label credited in the royalty report; optional.
      - name: is_local_artist
        type: boolean
        source: input
        description: True when the performer qualifies under the station's local-artist policy.
        default: false
      - name: is_new_release
        type: boolean
        source: input
        description: True when the release is inside the station's new-release window; reported but not priced.
        default: false
      - name: duration_seconds
        type: integer
        source: input
        description: Length of the spin in seconds; the sole basis of royalty pricing.
        constraints: "integer >= 1"
      - name: play_source
        type: enum
        source: input
        description: Where the spin came from; decides royalty_class.
        constraints: "LIBRARY_CD | LIBRARY_VINYL | DIGITAL | LIVE_PERFORMANCE | PRODUCTION_MUSIC"
      - name: royalty_class
        type: enum
        source: computed
        description: "FEATURED when play_source in {LIBRARY_CD, LIBRARY_VINYL, DIGITAL} and duration_seconds >= 30; EXEMPT when play_source == PRODUCTION_MUSIC; INCIDENTAL otherwise."
        constraints: "FEATURED | INCIDENTAL | EXEMPT"

  - name: UnderwritingSpot
    parent: null
    common_fields: true
    fields:
      - name: underwriter_name
        type: string
        source: input
        description: Sponsor of record; the copy must name it or the missing-sponsor-identification flag fires.
      - name: spot_class
        type: enum
        source: input
        description: Regulatory class of the announcement; POLITICAL_CANDIDATE copy may not be censored and ISSUE_ADVOCACY plus POLITICAL_CANDIDATE both create a public-file obligation.
        constraints: "UNDERWRITING | POLITICAL_CANDIDATE | ISSUE_ADVOCACY | PSA"
      - name: copy_text
        type: string
        source: input
        description: Submitted announcement copy that the noncommercial screen reads.
      - name: approved_copy_text
        type: string
        source: computed
        description: The copy actually cleared for air; equals copy_text on a clean approval, or the reviewer's edited_copy_text on APPROVED_WITH_EDITS.
      - name: assigned_program_id
        type: string
        source: input
        description: "FK -> Program.id; the show the spot rotates in. Optional, but required for POLITICAL_CANDIDATE and ISSUE_ADVOCACY because the public-file cascade charges the carrying program."
      - name: flight_start
        type: datetime
        source: input
        description: First instant the spot may air.
      - name: flight_end
        type: datetime
        source: input
        description: Last instant the spot may air; must be strictly after flight_start.
      - name: status
        type: enum
        source: computed
        description: Copy-review lifecycle.
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | APPROVED | APPROVED_WITH_EDITS | REJECTED | SUSPENDED"
      - name: noncommercial_risk_score
        type: integer
        source: computed
        description: "0..100 from calculations.underwriting_risk_score; forced to 0 for POLITICAL_CANDIDATE."
        default: 0
      - name: compliance_flags
        type: array
        source: computed
        description: "Sorted list of the flags the screen matched, drawn from [CALL_TO_ACTION, COMPARATIVE_CLAIM, MISSING_SPONSOR_ID, PRICE_INFO]."
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceOfficer who ran the copy review; the segregation-of-duties check compares incident adjudicators against it."
      - name: public_file_status
        type: enum
        source: computed
        description: Public-file obligation state for this spot.
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | REQUIRED | POSTED | LATE_POSTED | MISSING"
      - name: public_file_due_at
        type: datetime
        source: computed
        description: "Clearance instant + 7 days for POLITICAL_CANDIDATE and ISSUE_ADVOCACY spots; null otherwise."
      - name: public_file_posted_at
        type: datetime
        source: computed
        description: Logical-clock instant the political-file entry was recorded; null until posted.
      - name: public_file_reference
        type: string
        source: input
        description: Regulator-facing reference string recorded with the posting; null until posted.

  - name: ComplianceIncident
    parent: null
    common_fields: true
    fields:
      - name: category
        type: enum
        source: input
        description: Which rulebook the incident sits under.
        constraints: "INDECENCY | POLITICAL_CONTENT | PUBLIC_FILE | SPONSOR_ID | VOLUNTEER_CONFLICT"
      - name: severity
        type: enum
        source: input
        description: Station triage severity; combined with category to price penalty_points.
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the show charged with the incident. Optional only for VOLUNTEER_CONFLICT."
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the airing at issue, required for INDECENCY. Optional otherwise."
      - name: underwriting_spot_id
        type: string
        source: input
        description: "FK -> UnderwritingSpot.id; the announcement at issue, required for SPONSOR_ID and PUBLIC_FILE. Optional otherwise."
      - name: respondent_volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the volunteer answering the complaint, required for VOLUNTEER_CONFLICT. Optional otherwise."
      - name: complainant_note
        type: string
        source: input
        description: Narrative filed with the incident.
      - name: occurred_at
        type: datetime
        source: input
        description: Instant of the conduct at issue; its station-local hour decides the safe-harbour test.
      - name: status
        type: enum
        source: computed
        description: Adjudication lifecycle.
        default: OPEN
        constraints: "OPEN | SUBSTANTIATED | UNFOUNDED | REMEDIATED"
      - name: safe_harbor_violation
        type: boolean
        source: computed
        description: "True only for INDECENCY incidents whose occurred_at station-local hour is in the half-open window [06:00, 22:00); doubles penalty_points."
        default: false
      - name: penalty_points
        type: integer
        source: computed
        description: "See calculations.incident_penalty_points; frozen at creation and charged to the program on SUBSTANTIATED, refunded on REMEDIATED."
        default: 0
      - name: sanction
        type: enum
        source: input
        description: Volunteer sanction imposed when the incident is substantiated.
        default: NONE
        constraints: "NONE | WARNING | SUSPENSION | TERMINATION"
      - name: adjudicated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who adjudicated; null while OPEN.
      - name: remediation_note
        type: string
        source: input
        description: Corrective action recorded when the incident is remediated; null otherwise.

  - name: MembershipDrive
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Public name of the drive.
      - name: goal_cents
        type: integer
        source: input
        description: Fundraising goal in cents.
        constraints: "integer >= 1"
      - name: start_at
        type: datetime
        source: input
        description: First instant the drive accepts pledges and phone-bank shifts.
      - name: end_at
        type: datetime
        source: input
        description: Last instant the drive accepts pledges and phone-bank shifts; must be strictly after start_at.
      - name: phone_line_count
        type: integer
        source: input
        description: Number of physical phone lines; caps the number of shifts whose half-open windows overlap.
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: computed
        description: Drive lifecycle.
        default: PLANNED
        constraints: "PLANNED | ACTIVE | CLOSED"
      - name: gross_pledged_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over every Pledge on this drive regardless of payment_status; the conserved total."
        default: 0
      - name: pledged_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this drive's Pledge rows with payment_status in {PENDING, PAID}."
        default: 0
      - name: fulfilled_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this drive's Pledge rows with payment_status == PAID."
        default: 0
      - name: refunded_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this drive's Pledge rows with payment_status == REFUNDED."
        default: 0
      - name: lapsed_total_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this drive's Pledge rows with payment_status == LAPSED."
        default: 0
      - name: attainment_pct
        type: number
        source: computed
        description: "round_half_up(100 * pledged_total_cents / goal_cents, 2)."
        default: 0.00

  - name: PhoneBankShift
    parent: MembershipDrive
    common_fields: true
    fields:
      - name: drive_id
        type: string
        source: input
        description: "FK -> MembershipDrive.id; the drive being staffed."
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the volunteer working the phones."
      - name: start_at
        type: datetime
        source: input
        description: Shift start instant; must fall inside the drive window.
      - name: end_at
        type: datetime
        source: input
        description: Shift end instant; must be strictly after start_at and inside the drive window.
      - name: status
        type: enum
        source: computed
        description: Shift lifecycle.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED"
      - name: pledges_taken_count
        type: integer
        source: computed
        description: "Count of Pledge rows whose shift_id is this shift."
        default: 0

  - name: PremiumItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Stock-keeping code; unique across premium items.
        constraints: "unique; non-empty"
      - name: name
        type: string
        source: input
        description: Thank-you gift name announced on air.
      - name: tier_threshold_cents
        type: integer
        source: input
        description: Minimum gross pledge amount that makes this premium eligible.
        constraints: "integer >= 1"
      - name: fair_market_value_cents
        type: integer
        source: input
        description: Declared fair market value subtracted from the pledge to obtain the donor's deductible amount.
        constraints: "integer >= 0"
      - name: units_received_qty
        type: integer
        source: input
        description: Units the station received from the vendor; the conserved unit total.
        constraints: "integer >= 0"
      - name: on_hand_qty
        type: integer
        source: computed
        description: "Units physically in the fulfilment room; initialised to units_received_qty, decremented on ship, incremented on return."
      - name: reserved_qty
        type: integer
        source: computed
        description: Units earmarked for RESERVED pledges; incremented on reservation, decremented on ship, release or waive.
        default: 0
      - name: shipped_qty
        type: integer
        source: computed
        description: Units shipped to donors; incremented on ship, decremented on return.
        default: 0
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE while on_hand_qty - reserved_qty > 0, otherwise DEPLETED."
        default: AVAILABLE
        constraints: "AVAILABLE | DEPLETED"

  - name: Pledge
    parent: MembershipDrive
    common_fields: true
    fields:
      - name: drive_id
        type: string
        source: input
        description: "FK -> MembershipDrive.id; the drive the pledge counts toward."
      - name: shift_id
        type: string
        source: input
        description: "FK -> PhoneBankShift.id; the phone-bank shift that took the call. Optional; when present it must belong to drive_id."
      - name: premium_item_id
        type: string
        source: computed
        description: "FK -> PremiumItem.id; the premium selected by the allocation waterfall, or null when no tier qualifies."
      - name: donor_name
        type: string
        source: input
        description: Donor of record.
      - name: amount_cents
        type: integer
        source: input
        description: Gross pledged amount; the sole input to premium tier selection.
        constraints: "integer >= 1"
      - name: wants_premium
        type: boolean
        source: input
        description: False when the donor declines the thank-you gift, which sets premium_status to WAIVED without touching inventory.
        default: true
      - name: payment_status
        type: enum
        source: computed
        description: "First state dimension: money."
        default: PENDING
        constraints: "PENDING | PAID | LAPSED | REFUNDED"
      - name: premium_status
        type: enum
        source: computed
        description: "Second, independent state dimension: fulfilment."
        default: NOT_ELIGIBLE
        constraints: "NOT_ELIGIBLE | WAIVED | RESERVED | BACKORDERED | SHIPPED | RELEASED | RETURNED"
      - name: tax_deductible_cents
        type: integer
        source: computed
        description: "max(0, amount_cents - fair_market_value_cents of the premium chosen in step 1 of the allocation); equals amount_cents when no premium was chosen."
        default: 0
state_machines:
  - entity: Volunteer
    initial_state: PROSPECT
    terminal_states: [RESIGNED]
    transitions:
      - from: PROSPECT
        to: IN_TRAINING
        trigger: "system, on the first CertificationRecord created for this volunteer (POST /volunteers/{volunteerId}/certifications)"
        actor: system
        preconditions: ["volunteer.status == PROSPECT"]
        side_effects: ["recompute Volunteer.seniority_score", "refresh Volunteer.updated_at and increment Volunteer.version by 1"]
      - from: IN_TRAINING
        to: CERTIFIED
        trigger: "system, when the third core CertificationRecord reaches PASSED (POST /volunteers/{volunteerId}/certifications with exam_score, or POST /certifications/{certificationId}/exam-results)"
        actor: system
        preconditions: ["for every cert_type in {BOARD_OPERATION, STATION_POLICY, BROADCAST_REGULATION} the volunteer holds a CertificationRecord with status == PASSED and expires_on > current logical clock"]
        side_effects: ["set Volunteer.needs_core_renewal = false", "recompute Volunteer.current_certification_count and Volunteer.seniority_score", "increment Volunteer.version by 1"]
      - from: CERTIFIED
        to: PROBATION
        trigger: "system, on daily sweep expiry of a core certification (POST /operations/daily-sweep), OR on ComplianceIncident adjudicated SUBSTANTIATED with sanction == WARNING, OR when strike_count reaches 2 after a PhoneBankShift closes NO_SHOW"
        actor: system
        preconditions: ["volunteer.status == CERTIFIED"]
        side_effects: ["set Volunteer.needs_core_renewal = true when the cause was a core certification expiry", "recompute Volunteer.seniority_score (strike penalty and certification points both move)", "increment Volunteer.version by 1"]
        note: "PROBATION keeps air privileges; it only lowers seniority_score and blocks nothing by itself."
      - from: PROBATION
        to: CERTIFIED
        trigger: "system, when a replacement core CertificationRecord reaches PASSED (POST /volunteers/{volunteerId}/certifications with exam_score)"
        actor: system
        preconditions: ["all three core cert_types PASSED with expires_on > current logical clock", "volunteer.strike_count < 2"]
        side_effects: ["set Volunteer.needs_core_renewal = false", "recompute Volunteer.seniority_score", "increment Volunteer.version by 1"]
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED and sanction SUSPENSION, or POST /certifications/{certificationId}/revoke"
        actor: ComplianceOfficer
        preconditions: ["volunteer.status in {CERTIFIED, PROBATION}"]
        side_effects: ["cascade link 2: every Program whose host_volunteer_id is this volunteer and whose programming_status is in {SCHEDULED, ON_AIR_ACTIVE} moves to UNDER_REVIEW", "recompute Volunteer.seniority_score", "increment Volunteer.version by 1"]
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED and sanction SUSPENSION, or POST /certifications/{certificationId}/revoke"
        actor: ComplianceOfficer
        preconditions: ["volunteer.status in {CERTIFIED, PROBATION}"]
        side_effects: ["cascade link 2: every Program hosted by this volunteer with programming_status in {SCHEDULED, ON_AIR_ACTIVE} moves to UNDER_REVIEW", "increment Volunteer.version by 1"]
      - from: SUSPENDED
        to: PROBATION
        trigger: "POST /compliance-incidents/{incidentId}/remediate on the SUBSTANTIATED incident that carried the SUSPENSION sanction"
        actor: ComplianceOfficer
        preconditions: ["incident.status == SUBSTANTIATED", "incident.sanction == SUSPENSION", "incident.respondent_volunteer_id == this volunteer"]
        side_effects: ["recompute Volunteer.seniority_score", "increment Volunteer.version by 1"]
        note: "Reinstatement stops at PROBATION; Programs left in UNDER_REVIEW are not auto-restored and must clear a performance review."
      - from: CERTIFIED
        to: RESIGNED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED and sanction TERMINATION"
        actor: ComplianceOfficer
        preconditions: ["volunteer.status in {CERTIFIED, PROBATION, SUSPENDED}"]
        side_effects: ["every Program hosted by this volunteer whose programming_status != CANCELLED moves to CANCELLED with cancellation_reason \"HOST_TERMINATED\"", "each such cancellation releases that program's TENTATIVE and CONFIRMED SlotAssignment rows and recomputes the owning ScheduleGrid.total_assigned_minutes and public_affairs_minutes_pct", "increment Volunteer.version by 1"]
      - from: PROBATION
        to: RESIGNED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED and sanction TERMINATION"
        actor: ComplianceOfficer
        preconditions: ["volunteer.status in {CERTIFIED, PROBATION, SUSPENDED}"]
        side_effects: ["same program cancellation and slot release cascade as CERTIFIED -> RESIGNED", "increment Volunteer.version by 1"]
      - from: SUSPENDED
        to: RESIGNED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED and sanction TERMINATION"
        actor: ComplianceOfficer
        preconditions: ["volunteer.status in {CERTIFIED, PROBATION, SUSPENDED}"]
        side_effects: ["same program cancellation and slot release cascade as CERTIFIED -> RESIGNED", "increment Volunteer.version by 1"]

  - entity: CertificationRecord
    initial_state: PENDING_EXAM
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING_EXAM
        to: PASSED
        trigger: "POST /certifications/{certificationId}/exam-results with exam_score >= 80, or POST /volunteers/{volunteerId}/certifications carrying exam_score >= 80 (graded in the same request)"
        actor: TrainingCoordinator
        preconditions: ["certification.status == PENDING_EXAM", "0 <= exam_score <= 100"]
        side_effects: ["set issued_on = current logical clock", "set expires_on = issued_on + 24 calendar months", "set last_attempt_at = current logical clock", "increment attempt_count by 1", "recompute Volunteer.current_certification_count, needs_core_renewal and seniority_score", "when all three core types are now PASSED and unexpired, move Volunteer IN_TRAINING -> CERTIFIED or PROBATION -> CERTIFIED"]
      - from: PENDING_EXAM
        to: FAILED
        trigger: "POST /certifications/{certificationId}/exam-results with exam_score < 80, or POST /volunteers/{volunteerId}/certifications carrying exam_score < 80"
        actor: TrainingCoordinator
        preconditions: ["certification.status == PENDING_EXAM", "0 <= exam_score <= 100"]
        side_effects: ["set last_attempt_at = current logical clock", "increment attempt_count by 1", "leave issued_on and expires_on null"]
      - from: FAILED
        to: PENDING_EXAM
        trigger: "POST /certifications/{certificationId}/retake"
        actor: TrainingCoordinator
        preconditions: ["certification.status == FAILED", "attempt_count < 3", "current logical clock >= last_attempt_at + 14 days"]
        side_effects: ["clear exam_score to null", "keep attempt_count", "increment CertificationRecord.version by 1"]
        note: "The cycle FAILED -> PENDING_EXAM -> FAILED may run until attempt_count reaches 3, after which the record is stuck in FAILED."
      - from: PASSED
        to: EXPIRED
        trigger: "system, POST /operations/daily-sweep when current logical clock >= expires_on"
        actor: system
        preconditions: ["certification.status == PASSED", "current logical clock >= expires_on"]
        side_effects: ["recompute Volunteer.current_certification_count and seniority_score", "when cert_type is one of the three core types, move Volunteer CERTIFIED -> PROBATION and set needs_core_renewal = true", "every Episode with air_status == SCHEDULED whose board_operator_volunteer_id is this volunteer loses the operator: board_operator_volunteer_id = null and needs_substitute = true"]
      - from: PASSED
        to: REVOKED
        trigger: "POST /certifications/{certificationId}/revoke"
        actor: ComplianceOfficer
        preconditions: ["certification.status == PASSED", "the incident_id in the request body names a ComplianceIncident with status == SUBSTANTIATED whose respondent_volunteer_id == certification.volunteer_id"]
        side_effects: ["cascade link 1 -> 2: recompute Volunteer.current_certification_count, set needs_core_renewal = true and move the Volunteer to SUSPENDED", "cascade link 3: every Program hosted by that volunteer with programming_status in {SCHEDULED, ON_AIR_ACTIVE} moves to UNDER_REVIEW", "cascade link 4: every Episode with air_status == SCHEDULED belonging to those UNDER_REVIEW programs whose board_operator_volunteer_id is that volunteer has board_operator_volunteer_id cleared to null and needs_substitute set to true"]

  - entity: ProgramProposal
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /program-proposals/{proposalId}/submit"
        actor: Volunteer
        preconditions: ["proposal.status == DRAFT", "X-User-ID == proposal.proposer_volunteer_id", "proposer Volunteer.status == CERTIFIED"]
        side_effects: ["set review_round = 1", "increment ProgramProposal.version by 1"]
      - from: SUBMITTED
        to: IN_COMMITTEE
        trigger: "POST /program-proposals/{proposalId}/open-review"
        actor: ProgramDirector
        preconditions: ["proposal.status == SUBMITTED", "count of Volunteer rows with committee_seat == true and status not in {SUSPENDED, RESIGNED} >= 3"]
        side_effects: ["increment ProgramProposal.version by 1"]
      - from: IN_COMMITTEE
        to: APPROVED
        trigger: "POST /program-proposals/{proposalId}/decide"
        actor: ProgramDirector
        preconditions: ["proposal.status == IN_COMMITTEE", "expected_proposal_version == proposal.version", "tallied vote count >= required_quorum", "decline_majority == false", "composite_score >= 4.00"]
        side_effects: ["write composite_score and decided_at", "create one Program with programming_status APPROVED_UNSCHEDULED, compliance_standing CLEAR, proposal_id and host_volunteer_id copied from the proposal, title and format_code copied from the proposal", "increment ProgramProposal.version by 1"]
      - from: IN_COMMITTEE
        to: REVISION_REQUESTED
        trigger: "POST /program-proposals/{proposalId}/decide"
        actor: ProgramDirector
        preconditions: ["proposal.status == IN_COMMITTEE", "expected_proposal_version == proposal.version", "tallied vote count >= required_quorum", "decline_majority == false", "3.00 <= composite_score < 4.00", "review_round < 2"]
        side_effects: ["write composite_score and decided_at", "increment ProgramProposal.version by 1"]
      - from: IN_COMMITTEE
        to: DECLINED
        trigger: "POST /program-proposals/{proposalId}/decide"
        actor: ProgramDirector
        preconditions: ["proposal.status == IN_COMMITTEE", "expected_proposal_version == proposal.version", "tallied vote count >= required_quorum", "decline_majority == true OR composite_score < 3.00 OR (3.00 <= composite_score < 4.00 AND review_round == 2)"]
        side_effects: ["write composite_score, decline_majority and decided_at", "increment ProgramProposal.version by 1"]
        note: "The third disjunct is the round cap: a proposal that would earn a second revision is declined instead because MAX_REVIEW_ROUNDS == 2."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /program-proposals/{proposalId}/submit"
        actor: Volunteer
        preconditions: ["proposal.status == REVISION_REQUESTED", "X-User-ID == proposal.proposer_volunteer_id", "proposer Volunteer.status == CERTIFIED"]
        side_effects: ["increment review_round by 1", "clear composite_score to null and decline_majority to false", "votes from earlier rounds stay on file but are excluded from the next tally", "increment ProgramProposal.version by 1"]
        note: "This is the revision cycle; a proposal may traverse it once because MAX_REVIEW_ROUNDS == 2."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /program-proposals/{proposalId}/withdraw"
        actor: Volunteer
        preconditions: ["proposal.status in {DRAFT, SUBMITTED, IN_COMMITTEE, REVISION_REQUESTED}", "X-User-ID == proposal.proposer_volunteer_id"]
        side_effects: ["increment ProgramProposal.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /program-proposals/{proposalId}/withdraw"
        actor: Volunteer
        preconditions: ["proposal.status in {DRAFT, SUBMITTED, IN_COMMITTEE, REVISION_REQUESTED}", "X-User-ID == proposal.proposer_volunteer_id"]
        side_effects: ["increment ProgramProposal.version by 1"]
      - from: IN_COMMITTEE
        to: WITHDRAWN
        trigger: "POST /program-proposals/{proposalId}/withdraw"
        actor: Volunteer
        preconditions: ["proposal.status in {DRAFT, SUBMITTED, IN_COMMITTEE, REVISION_REQUESTED}", "X-User-ID == proposal.proposer_volunteer_id"]
        side_effects: ["increment ProgramProposal.version by 1"]
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /program-proposals/{proposalId}/withdraw"
        actor: Volunteer
        preconditions: ["proposal.status in {DRAFT, SUBMITTED, IN_COMMITTEE, REVISION_REQUESTED}", "X-User-ID == proposal.proposer_volunteer_id"]
        side_effects: ["increment ProgramProposal.version by 1"]

  - entity: Program
    initial_state: APPROVED_UNSCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: APPROVED_UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /slot-assignments/{assignmentId}/confirm (system side effect of the first confirmation)"
        actor: system
        preconditions: ["program.programming_status == APPROVED_UNSCHEDULED", "the confirmed SlotAssignment.program_id == program.id"]
        side_effects: ["increment Program.version by 1"]
        note: "Dimension 1 (programming_status). compliance_standing is untouched by every transition in this dimension."
      - from: SCHEDULED
        to: ON_AIR_ACTIVE
        trigger: "POST /schedule-grids/{gridId}/publish (system side effect for every program holding a CONFIRMED assignment on the published grid)"
        actor: system
        preconditions: ["program.programming_status == SCHEDULED", "the program holds at least one CONFIRMED SlotAssignment on the grid being published"]
        side_effects: ["increment Program.version by 1"]
      - from: SCHEDULED
        to: UNDER_REVIEW
        trigger: "system, the host Volunteer moving to SUSPENDED (POST /certifications/{certificationId}/revoke, or POST /compliance-incidents/{incidentId}/adjudicate with sanction SUSPENSION)"
        actor: system
        preconditions: ["program.programming_status == SCHEDULED", "the host Volunteer's status has just become SUSPENDED"]
        side_effects: ["performance_score is NOT recomputed by this path and stays as it was", "every Episode of this program with air_status == SCHEDULED whose board_operator_volunteer_id is the suspended volunteer loses the operator: board_operator_volunteer_id = null and needs_substitute = true", "increment Program.version by 1"]
      - from: ON_AIR_ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /programs/{programId}/performance-reviews or POST /operations/daily-sweep when the recomputed performance_score < 60.00, or the host Volunteer moving to SUSPENDED"
        actor: system
        preconditions: ["program.programming_status == ON_AIR_ACTIVE"]
        side_effects: ["write performance_score, performance_score_method and last_evaluated_at", "increment Program.version by 1"]
      - from: UNDER_REVIEW
        to: PROBATION
        trigger: "POST /programs/{programId}/performance-reviews when the recomputed performance_score < 45.00"
        actor: ProgramDirector
        preconditions: ["program.programming_status == UNDER_REVIEW"]
        side_effects: ["write performance_score, performance_score_method and last_evaluated_at", "increment Program.version by 1"]
      - from: UNDER_REVIEW
        to: ON_AIR_ACTIVE
        trigger: "POST /programs/{programId}/performance-reviews when the recomputed performance_score >= 60.00 and the host Volunteer.status is in {CERTIFIED, PROBATION}"
        actor: ProgramDirector
        preconditions: ["program.programming_status == UNDER_REVIEW", "recomputed performance_score >= 60.00", "host Volunteer.status in {CERTIFIED, PROBATION}"]
        side_effects: ["write performance_score, performance_score_method and last_evaluated_at", "increment Program.version by 1"]
        note: "Recovery cycle: ON_AIR_ACTIVE -> UNDER_REVIEW -> ON_AIR_ACTIVE."
      - from: PROBATION
        to: ON_AIR_ACTIVE
        trigger: "POST /programs/{programId}/performance-reviews when the recomputed performance_score >= 60.00 and the host Volunteer.status is in {CERTIFIED, PROBATION}"
        actor: ProgramDirector
        preconditions: ["program.programming_status == PROBATION", "recomputed performance_score >= 60.00", "host Volunteer.status in {CERTIFIED, PROBATION}"]
        side_effects: ["write performance_score, performance_score_method and last_evaluated_at", "increment Program.version by 1"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /programs/{programId}/cancel"
        actor: ProgramDirector
        preconditions: ["program.programming_status in {UNDER_REVIEW, PROBATION}", "expected_program_version == program.version"]
        side_effects: ["set cancellation_reason", "every SlotAssignment of this program with status in {TENTATIVE, CONFIRMED} moves to RELEASED with release_reason \"PROGRAM_CANCELLED\"", "each release recomputes the owning ScheduleGrid.total_assigned_minutes and public_affairs_minutes_pct and increments that grid's version", "every Episode of this program with air_status == SCHEDULED moves to CANCELLED", "increment Program.version by 1"]
      - from: PROBATION
        to: CANCELLED
        trigger: "POST /programs/{programId}/cancel"
        actor: ProgramDirector
        preconditions: ["program.programming_status in {UNDER_REVIEW, PROBATION}", "expected_program_version == program.version"]
        side_effects: ["same release and episode cascade as UNDER_REVIEW -> CANCELLED", "increment Program.version by 1"]
      - from: CLEAR
        to: WATCH
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: ["1 <= program.compliance_penalty_points after charging < 6"]
        side_effects: ["add incident.penalty_points to Program.compliance_penalty_points", "increment Program.version by 1"]
        note: "Dimension 2 (compliance_standing). Independent of programming_status: a WATCH program keeps airing."
      - from: WATCH
        to: RESTRICTED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED, or POST /operations/daily-sweep creating a substantiated PUBLIC_FILE incident"
        actor: ComplianceOfficer
        preconditions: ["program.compliance_penalty_points after charging >= 6"]
        side_effects: ["cascade: every SlotAssignment of this program with status in {TENTATIVE, CONFIRMED} moves to PREEMPTED", "each preemption recomputes the owning ScheduleGrid.total_assigned_minutes and public_affairs_minutes_pct and increments that grid's version", "every Episode of this program with air_status == SCHEDULED moves to CANCELLED", "increment Program.version by 1"]
      - from: CLEAR
        to: RESTRICTED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED whose penalty_points alone reach the restriction threshold"
        actor: ComplianceOfficer
        preconditions: ["program.compliance_penalty_points after charging >= 6"]
        side_effects: ["same preemption and episode cascade as WATCH -> RESTRICTED", "increment Program.version by 1"]
      - from: RESTRICTED
        to: WATCH
        trigger: "POST /compliance-incidents/{incidentId}/remediate"
        actor: ComplianceOfficer
        preconditions: ["1 <= program.compliance_penalty_points after refunding the remediated incident's points < 6"]
        side_effects: ["subtract incident.penalty_points from Program.compliance_penalty_points", "PREEMPTED SlotAssignment rows are NOT restored automatically; the ProgramDirector must call reinstate", "increment Program.version by 1"]
      - from: WATCH
        to: CLEAR
        trigger: "POST /compliance-incidents/{incidentId}/remediate"
        actor: ComplianceOfficer
        preconditions: ["program.compliance_penalty_points after refunding == 0"]
        side_effects: ["subtract incident.penalty_points from Program.compliance_penalty_points", "increment Program.version by 1"]
      - from: RESTRICTED
        to: CLEAR
        trigger: "POST /compliance-incidents/{incidentId}/remediate"
        actor: ComplianceOfficer
        preconditions: ["program.compliance_penalty_points after refunding == 0"]
        side_effects: ["subtract incident.penalty_points from Program.compliance_penalty_points", "increment Program.version by 1"]

  - entity: ScheduleGrid
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /schedule-grids/{gridId}/slot-assignments (system side effect of the first assignment created on the grid)"
        actor: system
        preconditions: ["grid.status == DRAFT"]
        side_effects: ["recompute total_assigned_minutes and public_affairs_minutes_pct", "increment ScheduleGrid.version by 1"]
        note: "DRAFT and IN_REVIEW are both mutable; PUBLISHED and SUPERSEDED are not."
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /schedule-grids/{gridId}/publish"
        actor: ProgramDirector
        preconditions: ["grid.status == IN_REVIEW", "expected_grid_version == grid.version", "no SlotAssignment on the grid has status == TENTATIVE", "total_assigned_minutes >= 1", "public_affairs_minutes_pct >= 8.00", "total_assigned_minutes <= 10080"]
        side_effects: ["set published_at = current logical clock", "every Program holding a CONFIRMED assignment on this grid moves SCHEDULED -> ON_AIR_ACTIVE", "cascade link 1: any other ScheduleGrid with status == PUBLISHED moves to SUPERSEDED", "cascade link 2: every CONFIRMED SlotAssignment on that superseded grid moves to RELEASED with release_reason \"GRID_SUPERSEDED\" and the superseded grid's total_assigned_minutes and public_affairs_minutes_pct are recomputed", "cascade link 3: every Program left with zero SlotAssignment rows in {TENTATIVE, CONFIRMED} across all non-SUPERSEDED grids moves back to APPROVED_UNSCHEDULED", "increment ScheduleGrid.version by 1"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, POST /schedule-grids/{gridId}/publish on a different grid"
        actor: system
        preconditions: ["grid.status == PUBLISHED"]
        side_effects: ["release this grid's CONFIRMED assignments and recompute its derived minute fields", "increment ScheduleGrid.version by 1"]

  - entity: SlotAssignment
    initial_state: TENTATIVE
    terminal_states: [RELEASED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /slot-assignments/{assignmentId}/confirm"
        actor: ProgramDirector
        preconditions: ["assignment.status == TENTATIVE", "owning grid.status in {DRAFT, IN_REVIEW}", "the assignment's Program.compliance_standing != RESTRICTED", "the assignment's Program.programming_status in {APPROVED_UNSCHEDULED, SCHEDULED, ON_AIR_ACTIVE, UNDER_REVIEW, PROBATION}"]
        side_effects: ["move the Program APPROVED_UNSCHEDULED -> SCHEDULED when this is its first confirmation", "recompute grid.total_assigned_minutes and public_affairs_minutes_pct", "increment ScheduleGrid.version by 1"]
      - from: TENTATIVE
        to: RELEASED
        trigger: "POST /slot-assignments/{assignmentId}/release, or a cascade from Program cancellation or grid supersession"
        actor: ProgramDirector
        preconditions: ["assignment.status in {TENTATIVE, CONFIRMED}"]
        side_effects: ["set release_reason", "recompute grid.total_assigned_minutes and public_affairs_minutes_pct", "increment ScheduleGrid.version by 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /slot-assignments/{assignmentId}/release, or a cascade from Program cancellation or grid supersession"
        actor: ProgramDirector
        preconditions: ["assignment.status in {TENTATIVE, CONFIRMED}"]
        side_effects: ["set release_reason", "recompute grid.total_assigned_minutes and public_affairs_minutes_pct", "when the Program is left with zero assignments in {TENTATIVE, CONFIRMED} it moves back to APPROVED_UNSCHEDULED", "increment ScheduleGrid.version by 1"]
      - from: CONFIRMED
        to: PREEMPTED
        trigger: "POST /schedule-grids/{gridId}/slot-assignments with conflict_policy == SENIORITY_PREEMPT, or a cascade from the incumbent Program entering compliance_standing RESTRICTED"
        actor: ProgramDirector
        preconditions: ["assignment.status in {TENTATIVE, CONFIRMED}", "for the seniority path only: challenger host seniority_score - incumbent host seniority_score >= 5.00"]
        side_effects: ["set preempted_by_program_id to the challenger program (null on the compliance path)", "recompute grid.total_assigned_minutes and public_affairs_minutes_pct", "increment ScheduleGrid.version by 1"]
      - from: TENTATIVE
        to: PREEMPTED
        trigger: "POST /schedule-grids/{gridId}/slot-assignments with conflict_policy == SENIORITY_PREEMPT, or a cascade from the incumbent Program entering compliance_standing RESTRICTED"
        actor: ProgramDirector
        preconditions: ["assignment.status in {TENTATIVE, CONFIRMED}", "for the seniority path only: challenger host seniority_score - incumbent host seniority_score >= 5.00"]
        side_effects: ["set preempted_by_program_id", "recompute grid.total_assigned_minutes and public_affairs_minutes_pct", "increment ScheduleGrid.version by 1"]
      - from: PREEMPTED
        to: CONFIRMED
        trigger: "POST /slot-assignments/{assignmentId}/reinstate"
        actor: ProgramDirector
        preconditions: ["assignment.status == PREEMPTED", "owning grid.status in {DRAFT, IN_REVIEW}", "the assignment's Program.compliance_standing != RESTRICTED", "no other SlotAssignment in {TENTATIVE, CONFIRMED} on the same grid and day_of_week collides with this window under the 2-minute station-identification rule"]
        side_effects: ["clear preempted_by_program_id to null", "recompute grid.total_assigned_minutes and public_affairs_minutes_pct back to their pre-preemption values", "increment ScheduleGrid.version by 1"]
        note: "Compensating action for PREEMPTED; the airtime-minutes invariant is asserted across the preempt/reinstate pair."

  - entity: Episode
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /episodes/{episodeId}/air-result with air_status AIRED"
        actor: ProgramDirector
        preconditions: ["episode.air_status == SCHEDULED", "episode.board_operator_volunteer_id is not null", "the board operator holds a CertificationRecord of cert_type BOARD_OPERATION with status PASSED and expires_on > current logical clock", "the Program.compliance_standing != RESTRICTED"]
        side_effects: ["set log_status = PENDING when the Program.format_code == MUSIC, otherwise leave NOT_REQUIRED", "set log_due_at = scheduled_start_utc + 72 hours when log_status becomes PENDING", "increment Episode.version by 1"]
        note: "Dimension 1 (air_status)."
      - from: SCHEDULED
        to: SUBSTITUTE_AIRED
        trigger: "POST /episodes/{episodeId}/air-result with air_status SUBSTITUTE_AIRED and substitute_board_operator_volunteer_id"
        actor: ProgramDirector
        preconditions: ["episode.air_status == SCHEDULED", "the substitute holds a PASSED unexpired BOARD_OPERATION certification", "the Program.compliance_standing != RESTRICTED"]
        side_effects: ["set board_operator_volunteer_id = substitute_board_operator_volunteer_id and needs_substitute = false", "set log_status = PENDING for MUSIC programs and log_due_at = scheduled_start_utc + 72 hours", "increment Episode.version by 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /episodes/{episodeId}/air-result with air_status MISSED"
        actor: ProgramDirector
        preconditions: ["episode.air_status == SCHEDULED"]
        side_effects: ["leave log_status NOT_REQUIRED", "increment Episode.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from Program cancellation or from the Program entering compliance_standing RESTRICTED"
        actor: system
        preconditions: ["episode.air_status == SCHEDULED"]
        side_effects: ["increment Episode.version by 1"]
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /episodes/{episodeId}/submit-log"
        actor: Volunteer
        preconditions: ["episode.log_status == PENDING", "X-User-ID == episode.board_operator_volunteer_id", "the episode has at least one PlaylistEntry when the Program.format_code == MUSIC"]
        side_effects: ["recompute featured_performance_count and local_featured_count", "write provisional_royalty_cents from the SURVEY variant", "increment Episode.version by 1"]
        note: "Dimension 2 (log_status), independent of air_status."
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /episodes/{episodeId}/log-decision with decision CERTIFY"
        actor: ComplianceOfficer
        preconditions: ["episode.log_status == SUBMITTED"]
        side_effects: ["write final_royalty_cents from the CENSUS variant", "increment Episode.version by 1"]
      - from: SUBMITTED
        to: PENDING
        trigger: "POST /episodes/{episodeId}/log-decision with decision RETURN"
        actor: ComplianceOfficer
        preconditions: ["episode.log_status == SUBMITTED"]
        side_effects: ["clear provisional_royalty_cents to null", "increment Episode.version by 1"]
        note: "Log-correction cycle: PENDING -> SUBMITTED -> PENDING."
      - from: PENDING
        to: DELINQUENT
        trigger: "system, POST /operations/daily-sweep when current logical clock >= log_due_at"
        actor: system
        preconditions: ["episode.log_status == PENDING", "current logical clock >= log_due_at"]
        side_effects: ["the episode counts as delinquent in every later program_performance_score evaluation", "increment Episode.version by 1"]

  - entity: UnderwritingSpot
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /underwriting-spots/{spotId}/submit-for-review"
        actor: DevelopmentCoordinator
        preconditions: ["spot.status == DRAFT", "flight_end > flight_start", "assigned_program_id is not null when spot_class in {POLITICAL_CANDIDATE, ISSUE_ADVOCACY}"]
        side_effects: ["increment UnderwritingSpot.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /underwriting-spots/{spotId}/review"
        actor: ComplianceOfficer
        preconditions: ["spot.status == UNDER_REVIEW", "the screened copy scores noncommercial_risk_score < 25, or spot_class == POLITICAL_CANDIDATE (no-censorship rule forces score 0)"]
        side_effects: ["write noncommercial_risk_score, compliance_flags, approved_copy_text and reviewed_by_user_id", "when spot_class in {POLITICAL_CANDIDATE, ISSUE_ADVOCACY} set public_file_status = REQUIRED and public_file_due_at = current logical clock + 7 days, otherwise leave public_file_status NOT_REQUIRED", "increment UnderwritingSpot.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED_WITH_EDITS
        trigger: "POST /underwriting-spots/{spotId}/review carrying edited_copy_text"
        actor: ComplianceOfficer
        preconditions: ["spot.status == UNDER_REVIEW", "25 <= screened noncommercial_risk_score < 60", "edited_copy_text is present and its own screen scores < 25"]
        side_effects: ["write noncommercial_risk_score from the ORIGINAL copy_text, compliance_flags from the original copy, approved_copy_text = edited_copy_text and reviewed_by_user_id", "apply the same public-file obligation rule as APPROVED", "increment UnderwritingSpot.version by 1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /underwriting-spots/{spotId}/review"
        actor: ComplianceOfficer
        preconditions: ["spot.status == UNDER_REVIEW", "screened noncommercial_risk_score >= 60, or (25 <= score < 60 and no edited_copy_text was supplied)"]
        side_effects: ["write noncommercial_risk_score, compliance_flags and reviewed_by_user_id", "leave approved_copy_text null and public_file_status NOT_REQUIRED", "increment UnderwritingSpot.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED on an incident whose underwriting_spot_id is this spot"
        actor: ComplianceOfficer
        preconditions: ["spot.status in {APPROVED, APPROVED_WITH_EDITS}"]
        side_effects: ["the spot may no longer air", "increment UnderwritingSpot.version by 1"]
      - from: APPROVED_WITH_EDITS
        to: SUSPENDED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED on an incident whose underwriting_spot_id is this spot"
        actor: ComplianceOfficer
        preconditions: ["spot.status in {APPROVED, APPROVED_WITH_EDITS}"]
        side_effects: ["increment UnderwritingSpot.version by 1"]
      - from: REQUIRED
        to: POSTED
        trigger: "POST /underwriting-spots/{spotId}/public-file-posting"
        actor: ComplianceOfficer
        preconditions: ["spot.public_file_status == REQUIRED", "current logical clock < spot.public_file_due_at"]
        side_effects: ["set public_file_posted_at = current logical clock and public_file_reference", "increment UnderwritingSpot.version by 1"]
        note: "public_file_status is an independent dimension on the spot; NOT_REQUIRED spots reject the posting call."
      - from: REQUIRED
        to: MISSING
        trigger: "system, POST /operations/daily-sweep when current logical clock >= public_file_due_at"
        actor: system
        preconditions: ["spot.public_file_status == REQUIRED", "current logical clock >= public_file_due_at"]
        side_effects: ["cascade link 1 -> 2: create one ComplianceIncident with category PUBLIC_FILE, severity MAJOR, status SUBSTANTIATED, penalty_points 3, program_id = spot.assigned_program_id, underwriting_spot_id = spot.id, occurred_at = public_file_due_at", "cascade link 3: that substantiated incident charges 3 points to the program, which crosses the restriction threshold when the running total reaches 6 and moves compliance_standing to RESTRICTED", "cascade link 4: the RESTRICTED standing preempts every {TENTATIVE, CONFIRMED} SlotAssignment of that program, recomputes the owning grid's minute fields, and cancels the program's SCHEDULED episodes", "increment UnderwritingSpot.version by 1"]
      - from: MISSING
        to: LATE_POSTED
        trigger: "POST /underwriting-spots/{spotId}/public-file-posting"
        actor: ComplianceOfficer
        preconditions: ["spot.public_file_status == MISSING"]
        side_effects: ["set public_file_posted_at = current logical clock and public_file_reference", "the PUBLIC_FILE incident is NOT auto-remediated; the officer must remediate it explicitly", "increment UnderwritingSpot.version by 1"]

  - entity: ComplianceIncident
    initial_state: OPEN
    terminal_states: [UNFOUNDED, REMEDIATED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions: ["incident.status == OPEN", "X-User-ID != the reviewed_by_user_id of incident.underwriting_spot_id when that spot is set", "sanction is NONE unless respondent_volunteer_id is set"]
        side_effects: ["set adjudicated_by_user_id", "charge penalty_points to Program.compliance_penalty_points and move compliance_standing CLEAR -> WATCH or -> RESTRICTED per the threshold", "when underwriting_spot_id is set and that spot is APPROVED or APPROVED_WITH_EDITS, move the spot to SUSPENDED", "apply the sanction to respondent_volunteer_id: WARNING increments strike_count and moves CERTIFIED -> PROBATION, SUSPENSION moves the volunteer to SUSPENDED, TERMINATION moves the volunteer to RESIGNED", "increment ComplianceIncident.version by 1"]
      - from: OPEN
        to: UNFOUNDED
        trigger: "POST /compliance-incidents/{incidentId}/adjudicate with finding UNFOUNDED"
        actor: ComplianceOfficer
        preconditions: ["incident.status == OPEN", "X-User-ID != the reviewed_by_user_id of incident.underwriting_spot_id when that spot is set"]
        side_effects: ["set adjudicated_by_user_id", "charge nothing: Program.compliance_penalty_points and compliance_standing are untouched", "increment ComplianceIncident.version by 1"]
      - from: SUBSTANTIATED
        to: REMEDIATED
        trigger: "POST /compliance-incidents/{incidentId}/remediate"
        actor: ComplianceOfficer
        preconditions: ["incident.status == SUBSTANTIATED"]
        side_effects: ["set remediation_note", "subtract penalty_points from Program.compliance_penalty_points and recompute compliance_standing (RESTRICTED -> WATCH -> CLEAR as the total falls)", "when sanction == SUSPENSION move the respondent Volunteer SUSPENDED -> PROBATION", "PREEMPTED SlotAssignment rows stay preempted and must be reinstated explicitly", "increment ComplianceIncident.version by 1"]

  - entity: MembershipDrive
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /membership-drives/{driveId}/activate"
        actor: DevelopmentCoordinator
        preconditions: ["drive.status == PLANNED"]
        side_effects: ["pledges and phone-bank shifts become writable", "increment MembershipDrive.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /membership-drives/{driveId}/close"
        actor: DevelopmentCoordinator
        preconditions: ["drive.status == ACTIVE", "no Pledge on the drive has payment_status == PENDING"]
        side_effects: ["every SCHEDULED PhoneBankShift on the drive moves to CANCELLED", "recompute all five money aggregates and attainment_pct", "increment MembershipDrive.version by 1"]

  - entity: PhoneBankShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /phone-bank-shifts/{shiftId}/close with outcome COMPLETED"
        actor: DevelopmentCoordinator
        preconditions: ["shift.status == SCHEDULED"]
        side_effects: ["recompute pledges_taken_count", "increment PhoneBankShift.version by 1"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /phone-bank-shifts/{shiftId}/close with outcome NO_SHOW"
        actor: DevelopmentCoordinator
        preconditions: ["shift.status == SCHEDULED"]
        side_effects: ["increment Volunteer.strike_count by 1", "recompute Volunteer.seniority_score (each strike costs 15.00 points)", "move the Volunteer CERTIFIED -> PROBATION when strike_count reaches 2", "the window stops counting against the drive's phone-line capacity and against the volunteer's own shift conflicts", "increment PhoneBankShift.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from POST /membership-drives/{driveId}/close"
        actor: system
        preconditions: ["shift.status == SCHEDULED"]
        side_effects: ["the window stops counting against capacity and conflicts", "increment PhoneBankShift.version by 1"]

  - entity: Pledge
    initial_state: PENDING
    terminal_states: [LAPSED, REFUNDED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /pledges/{pledgeId}/payment with outcome PAID"
        actor: DevelopmentCoordinator
        preconditions: ["pledge.payment_status == PENDING"]
        side_effects: ["recompute the drive's pledged_total_cents, fulfilled_total_cents and attainment_pct", "premium_status is untouched", "increment Pledge.version by 1"]
        note: "Dimension 1 (payment_status)."
      - from: PENDING
        to: LAPSED
        trigger: "POST /pledges/{pledgeId}/payment with outcome LAPSED"
        actor: DevelopmentCoordinator
        preconditions: ["pledge.payment_status == PENDING"]
        side_effects: ["recompute the drive's pledged_total_cents, lapsed_total_cents and attainment_pct", "when premium_status == RESERVED it moves to RELEASED and the PremiumItem.reserved_qty is decremented", "increment Pledge.version by 1"]
      - from: PAID
        to: REFUNDED
        trigger: "POST /pledges/{pledgeId}/refund"
        actor: DevelopmentCoordinator
        preconditions: ["pledge.payment_status == PAID"]
        side_effects: ["recompute the drive's pledged_total_cents, fulfilled_total_cents, refunded_total_cents and attainment_pct", "when premium_status == SHIPPED it moves to RETURNED, PremiumItem.shipped_qty is decremented and on_hand_qty is incremented", "when premium_status == RESERVED it moves to RELEASED and PremiumItem.reserved_qty is decremented", "increment Pledge.version by 1"]
        note: "Compensating action for the payment plus shipment pair; the premium unit invariant is asserted across it."
      - from: NOT_ELIGIBLE
        to: RESERVED
        trigger: "POST /pledges (system, when the allocation waterfall finds an in-stock candidate)"
        actor: system
        preconditions: ["wants_premium == true", "at least one PremiumItem has tier_threshold_cents <= amount_cents and on_hand_qty - reserved_qty >= 1"]
        side_effects: ["set premium_item_id to the selected item", "increment that PremiumItem.reserved_qty by 1 and recompute its status", "write tax_deductible_cents from the selected item's fair_market_value_cents"]
        note: "Dimension 2 (premium_status), evaluated once at creation and never re-selected afterwards."
      - from: NOT_ELIGIBLE
        to: BACKORDERED
        trigger: "POST /pledges (system, when every qualifying candidate is out of stock)"
        actor: system
        preconditions: ["wants_premium == true", "at least one PremiumItem has tier_threshold_cents <= amount_cents", "no qualifying PremiumItem has on_hand_qty - reserved_qty >= 1"]
        side_effects: ["set premium_item_id to the top-ranked qualifying item without reserving a unit", "write tax_deductible_cents from that item's fair_market_value_cents"]
      - from: NOT_ELIGIBLE
        to: WAIVED
        trigger: "POST /pledges with wants_premium == false, or POST /pledges/{pledgeId}/premium-fulfillment with action WAIVE"
        actor: DevelopmentCoordinator
        preconditions: ["wants_premium == false at creation, or premium_status == RESERVED for the explicit waive"]
        side_effects: ["set tax_deductible_cents = amount_cents at creation", "on the explicit waive path decrement PremiumItem.reserved_qty by 1 and recompute its status", "increment Pledge.version by 1"]
      - from: RESERVED
        to: WAIVED
        trigger: "POST /pledges/{pledgeId}/premium-fulfillment with action WAIVE"
        actor: DevelopmentCoordinator
        preconditions: ["premium_status == RESERVED"]
        side_effects: ["decrement PremiumItem.reserved_qty by 1 and recompute its status", "increment Pledge.version by 1"]
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /pledges/{pledgeId}/premium-fulfillment with action SHIP"
        actor: DevelopmentCoordinator
        preconditions: ["premium_status == RESERVED", "payment_status == PAID"]
        side_effects: ["decrement PremiumItem.reserved_qty by 1, decrement on_hand_qty by 1, increment shipped_qty by 1 and recompute its status", "increment Pledge.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "system cascade from POST /pledges/{pledgeId}/payment with outcome LAPSED or POST /pledges/{pledgeId}/refund"
        actor: system
        preconditions: ["premium_status == RESERVED"]
        side_effects: ["decrement PremiumItem.reserved_qty by 1 and recompute its status"]
      - from: SHIPPED
        to: RETURNED
        trigger: "system cascade from POST /pledges/{pledgeId}/refund"
        actor: system
        preconditions: ["premium_status == SHIPPED"]
        side_effects: ["decrement PremiumItem.shipped_qty by 1, increment on_hand_qty by 1 and recompute its status"]

concurrency_rules:
  - rule_id: slot-assignment-create-stale-grid
    parent_entity: ScheduleGrid
    write_endpoint: "POST /schedule-grids/{gridId}/slot-assignments"
    occ_field: "expected_grid_version"
    description: |
      Creating a SlotAssignment against a ScheduleGrid whose version has advanced
      since the client last observed it is rejected. This captures the case where the
      grid's occupation set has already changed - another writer added an occupation, or
      a SENIORITY_PREEMPT create legitimately superseded an incumbent occupation under
      the seniority policy - so the current writer's picture of which minutes are free
      is stale and its own placement decision can no longer be trusted.
    error_id: ERR_STALE_GRID_VERSION
    http_status: 412
  - rule_id: grid-publish-stale-grid
    parent_entity: ScheduleGrid
    write_endpoint: "POST /schedule-grids/{gridId}/publish"
    occ_field: "expected_grid_version"
    description: |
      Publishing a ScheduleGrid whose version has advanced since the client last
      observed it is rejected. Publication freezes the diversity quota and flips every
      confirmed program to air, so a grid that gained or lost an occupation after the
      director's last read must be re-read before it can be published.
    error_id: ERR_STALE_GRID_VERSION
    http_status: 412
  - rule_id: proposal-decide-stale-proposal
    parent_entity: ProgramProposal
    write_endpoint: "POST /program-proposals/{proposalId}/decide"
    occ_field: "expected_proposal_version"
    description: |
      Tallying a ProgramProposal whose version has advanced since the client last
      observed it is rejected. A CommitteeVote cast after the director's read changes
      both the composite score and the decline-majority test, so a decision computed
      from a stale view of the ballot set is refused.
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412
  - rule_id: program-cancel-stale-program
    parent_entity: Program
    write_endpoint: "POST /programs/{programId}/cancel"
    occ_field: "expected_program_version"
    description: |
      Cancelling a Program whose version has advanced since the client last observed it
      is rejected. Cancellation is justified by the program's review standing, and an
      intervening adjudication, remediation or performance review rewrites exactly that
      standing, so the justification must be re-established against a fresh read.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
calculations:
  - rule_id: volunteer_seniority_score
    name: Volunteer seniority score
    applies_to: "Volunteer.seniority_score"
    algorithm: weighted_scoring
    trigger: "Recomputed whenever the volunteer's status changes, a CertificationRecord of theirs reaches PASSED / EXPIRED / REVOKED, strike_count changes, or a hosted Program's performance_score is rewritten."
    formula: |
      service_term  = min(60, Volunteer.continuous_service_months)          # months, capped at 60
      cert_term     = 10 * Volunteer.current_certification_count
      hosted        = Program rows with host_volunteer_id == volunteer.id
                      AND programming_status != CANCELLED
                      AND performance_score IS NOT NULL
      perf_term     = 0.00 when hosted is empty,
                      else round_half_up(0.20 * mean(hosted.performance_score), 2)
      strike_term   = 15 * Volunteer.strike_count
      seniority_score = max(0.00, round_half_up(service_term + cert_term + perf_term - strike_term, 2))
    constants:
      SERVICE_MONTHS_CAP: 60
      POINTS_PER_CERTIFICATION: 10
      PERFORMANCE_WEIGHT: 0.20
      STRIKE_PENALTY: 15
    precision: "2 decimal places, round half up; floored at 0.00"
    input_set: "Only PASSED and unexpired CertificationRecord rows count toward cert_term; only non-CANCELLED hosted Programs with a non-null performance_score enter perf_term."
    edge_cases:
      - "continuous_service_months is a floor of whole months: seniority_start_date 2024-01-15 with the clock at 2026-01-14 yields 23, not 24."
      - "A volunteer with 3 core certifications, 24 whole months of service, no strikes and no hosted programs scores exactly 54.00; with 29 months exactly 59.00 - a 5.00 margin, which is the exact SENIORITY_PREEMPT_MARGIN boundary."
      - "Two strikes on a 90.00 base fall to 60.00; the floor keeps a heavily struck newcomer at 0.00 rather than negative."

  - rule_id: proposal_composite_score
    name: Programming committee composite score
    applies_to: "ProgramProposal.composite_score, ProgramProposal.decline_majority"
    algorithm: weighted_scoring
    trigger: "POST /program-proposals/{proposalId}/decide"
    formula: |
      ballots      = CommitteeVote rows with proposal_id == proposal.id
                     AND review_round == proposal.review_round
      vote_count   = count(ballots)
      seated_count = count(Volunteer rows with committee_seat == true
                           AND status NOT IN {SUSPENDED, RESIGNED}
                           AND id != proposal.proposer_volunteer_id)
      required_quorum = max(3, ceil(seated_count * 0.60))
      # quorum is a precondition, not part of the score: vote_count < required_quorum -> ERR_QUORUM_NOT_MET

      mean_format  = mean(ballots.format_fit_score)     # full precision, never rounded here
      mean_div     = mean(ballots.diversity_score)      # full precision
      mean_quality = mean(ballots.quality_score)        # full precision
      weighted     = 0.40 * mean_format + 0.35 * mean_div + 0.25 * mean_quality

      diversity_bonus = 0.50 when proposal.format_code IN {PUBLIC_AFFAIRS, CULTURAL}
                        AND current_published_pa_share < 8.00, else 0.00
                        # current_published_pa_share = public_affairs_minutes_pct of the single
                        # ScheduleGrid with status == PUBLISHED, or 0.00 when no grid is PUBLISHED
      language_bonus  = 0.25 when proposal.language_code != "EN", else 0.00

      composite_score = min(5.00, round_half_up(weighted + diversity_bonus + language_bonus, 2))
      decline_majority = (2 * count(ballots with recommendation == DECLINE)) > vote_count
    constants:
      QUORUM_MIN: 3
      QUORUM_FRACTION: 0.60
      WEIGHT_FORMAT_FIT: 0.40
      WEIGHT_DIVERSITY: 0.35
      WEIGHT_QUALITY: 0.25
      DIVERSITY_BONUS: 0.50
      LANGUAGE_BONUS: 0.25
      PA_SHARE_BONUS_CEILING: 8.00
      COMPOSITE_CAP: 5.00
      APPROVE_THRESHOLD: 4.00
      REVISE_THRESHOLD: 3.00
      MAX_REVIEW_ROUNDS: 2
    precision: "The three criterion means stay at full precision; only the final composite is rounded half up to 2 decimals, then capped at 5.00."
    input_set: "Only ballots whose review_round equals the proposal's current review_round are tallied; ballots from an earlier round remain stored and are ignored."
    edge_cases:
      - "Three ballots each (4,4,4) score exactly 4.00 with no bonuses - the APPROVE_THRESHOLD boundary, so the proposal is APPROVED."
      - "Three ballots (4,4,*) with quality 3,4,4 score 3.92 (mean_quality 11/3 kept unrounded) - just under the threshold, so REVISION_REQUESTED."
      - "Three ballots (3,4,3)/(5,5,4)/(3,3,4) weight to 3.80 and both bonuses lift the result to 4.55."
      - "Three uniform (3,4,3) ballots score exactly 3.35 - a revise on round 1 and, because MAX_REVIEW_ROUNDS is 2, a DECLINE on round 2 with the identical ballots."
      - "Perfect (5,5,5) ballots plus both bonuses would reach 5.75 but the cap pins composite_score at 5.00; if 2 of 3 ballots recommend DECLINE the decline-majority override declines the proposal anyway."
      - "Rounding the means before weighting instead of after changes the 3.92 case to 4.00 and flips the outcome from REVISION_REQUESTED to APPROVED."

  - rule_id: grid_public_affairs_share
    name: Grid public-affairs airtime share
    applies_to: "ScheduleGrid.total_assigned_minutes, ScheduleGrid.public_affairs_minutes_pct"
    algorithm: aggregation
    trigger: "Recomputed on every SlotAssignment create, confirm, release, preempt and reinstate on the grid."
    formula: |
      live_slots  = SlotAssignment rows with grid_id == grid.id AND status IN {TENTATIVE, CONFIRMED}
      total_assigned_minutes = sum(live_slots.duration_minutes)
      pa_slots    = live_slots whose Program.format_code IN {PUBLIC_AFFAIRS, NEWS}
      pa_minutes  = sum(pa_slots.duration_minutes)
      public_affairs_minutes_pct =
          0.00 when total_assigned_minutes == 0,
          else round_half_up(100 * pa_minutes / total_assigned_minutes, 2)
    constants:
      WEEK_MINUTES: 10080
      PUBLIC_AFFAIRS_MIN_PCT: 8.00
      PUBLIC_AFFAIRS_FORMATS: "[PUBLIC_AFFAIRS, NEWS]"
    precision: "2 decimal places, round half up; the ratio is computed on exact integer minutes, never on the rounded percentage."
    input_set: "RELEASED and PREEMPTED assignments are excluded from both sums, so releasing a music slot raises the public-affairs share without any public-affairs slot being added."
    edge_cases:
      - "60 public-affairs minutes out of 750 assigned minutes is exactly 8.00 - the publish quota boundary, which passes."
      - "The same 60 minutes out of 780 assigned minutes is 7.69 and publication fails with ERR_DIVERSITY_QUOTA_UNMET."
      - "An empty grid reports 0.00 rather than dividing by zero, and publication fails on the empty-grid check first."
      - "total_assigned_minutes may never exceed 10080, the number of minutes in a broadcast week."

  - rule_id: episode_royalty_liability_cents
    name: Episode music royalty liability
    applies_to: "Episode.provisional_royalty_cents, Episode.final_royalty_cents"
    algorithm: tiered_pricing
    trigger: "SURVEY on POST /episodes/{episodeId}/submit-log; CENSUS on POST /episodes/{episodeId}/log-decision with decision CERTIFY."
    formula: |
      featured = PlaylistEntry rows of the episode with royalty_class == FEATURED
                 (play_source IN {LIBRARY_CD, LIBRARY_VINYL, DIGITAL} AND duration_seconds >= 30)
      per_entry_cents(e) = round_half_up(e.duration_seconds / 60 * 65, 0)
    variants:
      - name: SURVEY
        applies_when: "Written to provisional_royalty_cents when the log is submitted, before the compliance officer certifies it."
        formula: |
          total_seconds = sum(featured.duration_seconds)
          raw_cents     = total_seconds / 60 * 65            # single exact rational, no intermediate rounding
          SURVEY_cents  = round_half_up(raw_cents * 1.10, 0) # survey-sample uplift, one rounding at the very end
      - name: CENSUS
        applies_when: "Written to final_royalty_cents when the compliance officer certifies the log."
        formula: |
          CENSUS_cents = sum over featured of per_entry_cents(e)
          # each spin is priced and rounded on its own, then the rounded cents are summed;
          # no uplift factor is applied because the census reports every spin
    constants:
      ROYALTY_RATE_CENTS_PER_MINUTE: 65
      SURVEY_UPLIFT_FACTOR: 1.10
      FEATURED_MIN_SECONDS: 30
      LOG_DUE_HOURS: 72
    precision: "Integer cents. CENSUS rounds half up once per playlist entry and then sums; SURVEY sums exact seconds, applies the uplift and rounds half up exactly once."
    input_set: "INCIDENTAL and EXEMPT entries are excluded from both variants; a PRODUCTION_MUSIC spin is EXEMPT no matter how long it runs, and a 29-second library spin is INCIDENTAL."
    edge_cases:
      - "FEATURED durations 185, 212 and 47 seconds price to 200 + 230 + 51 = 481 cents under CENSUS and to 529 cents under SURVEY (481.0 x 1.10 = 529.1)."
      - "Three 30-second FEATURED spins price to 33 + 33 + 33 = 99 cents under CENSUS but only 98 cents if the implementation sums the seconds first and rounds once (90/60 x 65 = 97.5); the rounding order is observable."
      - "A 30-second spin is FEATURED (the boundary is inclusive) while a 29-second spin is INCIDENTAL and priced at zero."
      - "An episode whose FEATURED set is empty prices to 0 cents under both variants."

  - rule_id: underwriting_risk_score
    name: Noncommercial copy risk score
    applies_to: "UnderwritingSpot.noncommercial_risk_score, UnderwritingSpot.compliance_flags"
    algorithm: threshold
    trigger: "POST /underwriting-spots/{spotId}/review, on copy_text and again on edited_copy_text when one is supplied."
    formula: |
      normalized = copy_text lowercased, every run of whitespace collapsed to one space, trimmed
      flags = []
      CALL_TO_ACTION      when normalized contains any of
                          ["call now", "act now", "visit us today", "stop by today",
                           "shop now", "limited time offer"]                       -> 40 points
      PRICE_INFO          when normalized matches a currency amount ("$" followed by a digit)
                          or contains any of ["% off", "percent off", "save $"]     -> 35 points
      COMPARATIVE_CLAIM   when normalized contains any of
                          ["best", "lowest prices", "number one", "unbeatable"]     -> 25 points
      MISSING_SPONSOR_ID  when normalized does NOT contain the identically normalized
                          underwriter_name                                          -> 10 points
      noncommercial_risk_score = min(100, sum of the matched weights)
      compliance_flags        = the matched flag names sorted ascending
      # spot_class == POLITICAL_CANDIDATE bypasses the whole screen: the no-censorship rule
      # forces noncommercial_risk_score = 0 and compliance_flags = [] regardless of the copy
    constants:
      WEIGHT_CALL_TO_ACTION: 40
      WEIGHT_PRICE_INFO: 35
      WEIGHT_COMPARATIVE_CLAIM: 25
      WEIGHT_MISSING_SPONSOR_ID: 10
      REJECT_THRESHOLD: 60
      EDIT_THRESHOLD: 25
      SCORE_CAP: 100
      PUBLIC_FILE_DEADLINE_DAYS: 7
    precision: "Integer 0..100; each flag contributes its weight at most once no matter how many phrases of that flag's list appear."
    input_set: "Only copy_text is screened for the stored noncommercial_risk_score; edited_copy_text is screened separately and must itself fall below EDIT_THRESHOLD, but it never overwrites the recorded score or flags."
    edge_cases:
      - "Copy that both urges a call and quotes a price scores 40 + 35 = 75, at or above REJECT_THRESHOLD, so the spot is REJECTED even if edited copy is offered."
      - "Copy whose only match is a comparative claim scores exactly 25 - the EDIT_THRESHOLD boundary - so it cannot be cleanly approved and needs edited copy."
      - "Copy that omits the underwriter's name and nothing else scores 10 and is APPROVED outright."
      - "A call to action plus a comparative claim scores 65 and is rejected; a call to action plus a missing sponsor identification scores 50 and is editable."
      - "POLITICAL_CANDIDATE copy containing \"call now\" and \"$5\" still scores 0 with empty flags and is APPROVED."

  - rule_id: incident_penalty_points
    name: Compliance incident penalty points
    applies_to: "ComplianceIncident.penalty_points, ComplianceIncident.safe_harbor_violation, Program.compliance_penalty_points, Program.compliance_standing"
    algorithm: threshold
    trigger: "Frozen at POST /compliance-incidents (and at sweep-created incidents); charged to the program on adjudicate SUBSTANTIATED and refunded on remediate."
    formula: |
      base_points by (category, severity):
        INDECENCY          MINOR 2  MAJOR 5  CRITICAL 9
        POLITICAL_CONTENT  MINOR 1  MAJOR 3  CRITICAL 6
        PUBLIC_FILE        MINOR 1  MAJOR 3  CRITICAL 5
        SPONSOR_ID         MINOR 1  MAJOR 2  CRITICAL 4
        VOLUNTEER_CONFLICT MINOR 1  MAJOR 2  CRITICAL 4
      safe_harbor_violation = (category == INDECENCY
                               AND station-local hour-of-day of occurred_at is in [06:00, 22:00))
      penalty_points = base_points * 2 when safe_harbor_violation else base_points

      # charged on SUBSTANTIATED, refunded on REMEDIATED
      Program.compliance_penalty_points = sum of penalty_points over the program's
                                          SUBSTANTIATED incidents
      compliance_standing = CLEAR      when points == 0
                            WATCH      when 1 <= points <= 5
                            RESTRICTED when points >= 6
    constants:
      SAFE_HARBOR_START_HOUR: 6
      SAFE_HARBOR_END_HOUR: 22
      SAFE_HARBOR_MULTIPLIER: 2
      WATCH_THRESHOLD: 1
      RESTRICTED_THRESHOLD: 6
    precision: "Integer points; the doubling is applied before the incident is stored, so remediation refunds exactly the doubled amount."
    input_set: "Only SUBSTANTIATED incidents are counted; OPEN, UNFOUNDED and REMEDIATED incidents contribute nothing, which is what makes remediation an exact reversal."
    edge_cases:
      - "A MINOR indecency complaint at 21:59 station-local doubles to 4 points; the same complaint at 22:00 stays at 2 because the window is half-open."
      - "Two safe-harbour MINOR indecency incidents total exactly 8 points, which is the penalty that pulls a perfect program performance score down to exactly 60.00."
      - "Two MAJOR public-file incidents total exactly 6 points and tip the program from WATCH straight to RESTRICTED."
      - "A CRITICAL indecency incident inside safe harbour is worth 18 points and lands the program on RESTRICTED from CLEAR in a single adjudication."
      - "Remediating one of two charged incidents walks the standing back RESTRICTED -> WATCH; remediating both returns it to CLEAR with 0 points."

  - rule_id: program_performance_score
    name: Program performance score
    applies_to: "Program.performance_score, Program.performance_score_method, Program.programming_status"
    algorithm: forward_looking
    trigger: "POST /programs/{programId}/performance-reviews, and the periodic evaluation inside POST /operations/daily-sweep."
    formula: |
      window       = the Episode rows of the program selected by the chosen variant
      aired        = count(window with air_status IN {AIRED, SUBSTITUTE_AIRED})
      missed       = count(window with air_status == MISSED)
      reliability  = 1.0 when aired + missed == 0, else aired / (aired + missed)

      logged       = count(window with log_status IN {SUBMITTED, CERTIFIED})
      log_required = count(window with log_status IN {PENDING, SUBMITTED, CERTIFIED, DELINQUENT})
      log_compliance = 1.0 when log_required == 0, else logged / log_required

      featured_total = sum over window of featured_performance_count
      local_total    = sum over window of local_featured_count
      local_share    = 1.0 when featured_total == 0, else local_total / featured_total

      base  = 100 * (0.55 * reliability + 0.30 * log_compliance + 0.15 * local_share)
      score = round_half_up(max(0, min(100, base - 5 * Program.compliance_penalty_points)), 2)

      # programming_status consequences, applied after the score is written
      score <  45.00                     -> PROBATION      (from UNDER_REVIEW)
      score <  60.00                     -> UNDER_REVIEW   (from ON_AIR_ACTIVE)
      score >= 60.00                     -> recovery to ON_AIR_ACTIVE
    variants:
      - name: TRAILING_SIX
        applies_when: "review_window == TRAILING_SIX on the review request, and the default the daily sweep uses."
        formula: |
          window = the 6 most recent Episode rows of the program with scheduled_start_utc <= now,
                   ordered by scheduled_start_utc descending, air_status != CANCELLED
      - name: QUARTER_TO_DATE
        applies_when: "review_window == QUARTER_TO_DATE on the review request."
        formula: |
          quarter_start = first instant of the calendar quarter containing the current logical clock
          window = every Episode row of the program with
                   quarter_start <= scheduled_start_utc <= now AND air_status != CANCELLED
                   (no count limit, so an older MISSED airing inside the quarter still counts)
    constants:
      WEIGHT_RELIABILITY: 0.55
      WEIGHT_LOG_COMPLIANCE: 0.30
      WEIGHT_LOCAL_ARTIST: 0.15
      COMPLIANCE_POINT_PENALTY: 5
      UNDERPERFORM_THRESHOLD: 60.00
      PROBATION_THRESHOLD: 45.00
      TRAILING_WINDOW_SIZE: 6
    precision: "2 decimal places, round half up, applied once after the clamp; the three ratios stay at full precision."
    input_set: "CANCELLED episodes never enter either window. Episodes whose scheduled_start_utc is in the future are excluded from both variants."
    edge_cases:
      - "A program with 6 aired episodes, all logs certified and no compliance points scores exactly 100.00 under TRAILING_SIX; adding one older MISSED airing inside the same quarter drops QUARTER_TO_DATE to 92.14 while TRAILING_SIX stays 100.00."
      - "4 aired, 2 missed, 1 certified log and 3 delinquent logs scores 59.17 - just under UNDERPERFORM_THRESHOLD - and moves the program to UNDER_REVIEW."
      - "A perfect 100.00 base carrying 8 substantiated penalty points lands on exactly 60.00, which is the recovery boundary and therefore NOT underperforming."
      - "A program with 20 penalty points and no aired episodes clamps at 0.00 rather than going negative."

  - rule_id: pledge_premium_allocation
    name: Pledge premium allocation waterfall
    applies_to: "Pledge.premium_item_id, Pledge.premium_status, Pledge.tax_deductible_cents, PremiumItem.reserved_qty, PremiumItem.status"
    algorithm: waterfall_allocation
    trigger: "POST /pledges, evaluated exactly once at creation."
    formula: |
      step 1 - candidate set:
        candidates = PremiumItem rows with tier_threshold_cents <= pledge.amount_cents
      step 2 - rank the candidate set (this ordering is fixed and observable):
        order by tier_threshold_cents DESC,
                 then fair_market_value_cents ASC,
                 then sku ASC
      step 3 - walk the ranked list once:
        selected = the first candidate with (on_hand_qty - reserved_qty) >= 1
                   -> premium_status = RESERVED, selected.reserved_qty += 1
        when no candidate is in stock:
        selected = the top-ranked candidate
                   -> premium_status = BACKORDERED, no unit is reserved
        when candidates is empty:
        selected = none -> premium_item_id = null, premium_status = NOT_ELIGIBLE
      step 4 - donor deductible:
        tax_deductible_cents = pledge.amount_cents when selected is none,
                               else max(0, pledge.amount_cents - selected.fair_market_value_cents)
      # wants_premium == false short-circuits the whole waterfall:
      # premium_item_id = null, premium_status = WAIVED, tax_deductible_cents = amount_cents
      # PremiumItem.status = AVAILABLE while (on_hand_qty - reserved_qty) > 0, else DEPLETED
      # invariant: on_hand_qty + shipped_qty == units_received_qty at all times
    constants:
      RESERVE_UNITS_PER_PLEDGE: 1
    precision: "Integer cents and integer units; the deductible is floored at 0 when a premium's fair market value exceeds the pledge."
    input_set: "Every PremiumItem is a candidate purely on tier_threshold_cents; stock only decides which candidate the walk stops on, never which items qualify."
    edge_cases:
      - "With MUG (threshold 10000, fmv 1500) and VINYL (threshold 10000, fmv 3500) both in stock, a 12000-cent pledge reserves the MUG and deducts 12000 - 1500 = 10500; ranking by fair market value before threshold would pick a cheaper low-tier item instead and yield 10800, so the step order is observable."
      - "Once the MUG is depleted the same 12000-cent pledge falls through to the VINYL and deducts 8500."
      - "With both 10000-tier items depleted the pledge falls all the way through to the 5000-tier TOTE (fmv 1200) and deducts 10800."
      - "A pledge of exactly 5000 cents qualifies for the 5000-tier TOTE (the threshold is inclusive) and deducts 3800."
      - "The selection is pinned at creation: restocking a higher-ranked premium afterwards does not re-select the pledge's premium_item_id."
      - "A 12000-cent pledge with wants_premium false is WAIVED with the full 12000 cents deductible and no unit reserved."
validations:
  # ---------------------------------------------------------------- authorization
  - rule_id: v_role_authorized
    priority: 10
    category: auth
    condition: "X-User-ID header absent, or the caller's role is not listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint except POST /_clock/set_current_utc"
  - rule_id: v_proposal_owner_only
    priority: 12
    category: auth
    condition: "POST /program-proposals/{proposalId}/submit, /withdraw or PATCH /program-proposals/{proposalId} where X-User-ID != proposal.proposer_volunteer_id."
    error_id: ERR_NOT_PROPOSAL_OWNER
    http_status: 403
    applies_to: "POST /program-proposals/{proposalId}/submit, POST /program-proposals/{proposalId}/withdraw, PATCH /program-proposals/{proposalId}"
  - rule_id: v_board_operator_only
    priority: 13
    category: auth
    condition: "POST /episodes/{episodeId}/submit-log or POST /episodes/{episodeId}/playlist-entries where X-User-ID != episode.board_operator_volunteer_id."
    error_id: ERR_NOT_BOARD_OPERATOR
    http_status: 403
    applies_to: "POST /episodes/{episodeId}/playlist-entries, POST /episodes/{episodeId}/submit-log"
  - rule_id: v_committee_seat_required
    priority: 14
    category: auth
    condition: "POST /program-proposals/{proposalId}/votes where the casting Volunteer has committee_seat == false."
    error_id: ERR_NOT_COMMITTEE_MEMBER
    http_status: 403
    applies_to: "POST /program-proposals/{proposalId}/votes"

  # ---------------------------------------------------------------- structural
  - rule_id: v_required_fields
    priority: 20
    category: structural
    condition: "A required input field is absent or null."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every write endpoint"
  - rule_id: v_enum_domain
    priority: 21
    category: structural
    condition: "An enum-typed input carries a value outside its declared domain (role_track, cert_type, format_code, requested_daypart, recommendation, play_source, spot_class, category, severity, sanction, conflict_policy, review_window, decision, outcome, action)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every write endpoint carrying an enum input"
  - rule_id: v_numeric_domain
    priority: 22
    category: structural
    condition: "exam_score outside 0..100; a criterion score outside 1..5; day_of_week outside 0..6; start_minute outside 0..1425; duration_minutes outside 15..720; start_minute + duration_minutes > 1440; requested_duration_minutes outside 15..720; amount_cents, goal_cents, phone_line_count, tier_threshold_cents or duration_seconds < 1; fair_market_value_cents or units_received_qty < 0; sequence_number < 1."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /volunteers/{volunteerId}/certifications, POST /certifications/{certificationId}/exam-results, POST /program-proposals, POST /program-proposals/{proposalId}/votes, POST /schedule-grids/{gridId}/slot-assignments, POST /episodes/{episodeId}/playlist-entries, POST /membership-drives, POST /premium-items, POST /premium-items/{premiumItemId}/receipts, POST /pledges"
  - rule_id: v_pagination_bounds
    priority: 23
    category: structural
    condition: "limit < 1, limit > 100 or offset < 0 on any list endpoint."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every list endpoint"
  - rule_id: v_interval_order
    priority: 24
    category: structural
    condition: "effective_to <= effective_from on a ScheduleGrid; flight_end <= flight_start on an UnderwritingSpot; end_at <= start_at on a MembershipDrive or a PhoneBankShift."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /schedule-grids, POST /underwriting-spots, PATCH /underwriting-spots/{spotId}, POST /membership-drives, POST /phone-bank-shifts"
  - rule_id: v_unique_natural_key
    priority: 26
    category: structural
    condition: "Volunteer.email, ScheduleGrid.season_code or PremiumItem.sku duplicates an existing row; PlaylistEntry.sequence_number duplicates another entry on the same episode."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /volunteers, PATCH /volunteers/{volunteerId}, POST /schedule-grids, POST /premium-items, POST /episodes/{episodeId}/playlist-entries"
  - rule_id: v_one_vote_per_round
    priority: 27
    category: structural
    condition: "POST /program-proposals/{proposalId}/votes where the member already has a CommitteeVote on this proposal with review_round == proposal.review_round."
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /program-proposals/{proposalId}/votes"
  - rule_id: v_one_program_per_proposal
    priority: 28
    category: structural
    condition: "POST /program-proposals/{proposalId}/decide would approve a proposal that already has a Program."
    error_id: ERR_PROGRAM_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /program-proposals/{proposalId}/decide"

  # ---------------------------------------------------------------- referential
  - rule_id: v_path_resource_exists
    priority: 30
    category: referential
    condition: "The id in the URL path names no row of the addressed collection."
    error_id: "ERR_VOLUNTEER_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_GRID_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_PLAYLIST_ENTRY_NOT_FOUND | ERR_SPOT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_DRIVE_NOT_FOUND | ERR_SHIFT_NOT_FOUND | ERR_PREMIUM_NOT_FOUND | ERR_PLEDGE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - rule_id: v_body_fk_exists
    priority: 32
    category: referential
    condition: "A foreign key supplied in the request body names no existing row (proposer_volunteer_id, member_volunteer_id, program_id, grid_id, slot_assignment_id, board_operator_volunteer_id, substitute_board_operator_volunteer_id, assigned_program_id, episode_id, underwriting_spot_id, respondent_volunteer_id, incident_id, drive_id, volunteer_id, shift_id)."
    error_id: "ERR_VOLUNTEER_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_SPOT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_DRIVE_NOT_FOUND | ERR_SHIFT_NOT_FOUND"
    http_status: 404
    applies_to: "every write endpoint carrying a foreign key in its body"
  - rule_id: v_slot_program_match
    priority: 35
    category: referential
    condition: "POST /episodes where the SlotAssignment named by slot_assignment_id has a program_id different from the request's program_id."
    error_id: ERR_SLOT_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /episodes"
    note: "Outranks v_program_not_restricted (priority 46): a request that names the wrong slot is malformed regardless of the program's compliance standing."
  - rule_id: v_episode_start_matches_slot
    priority: 36
    category: referential
    condition: "POST /episodes where scheduled_start_utc's weekday does not equal the slot's day_of_week, or its minute-of-day does not equal the slot's start_minute."
    error_id: ERR_EPISODE_SLOT_MISMATCH
    http_status: 422
    applies_to: "POST /episodes"
  - rule_id: v_shift_belongs_to_drive
    priority: 37
    category: referential
    condition: "POST /pledges where the PhoneBankShift named by shift_id has a drive_id different from the request's drive_id."
    error_id: ERR_SHIFT_DRIVE_MISMATCH
    http_status: 422
    applies_to: "POST /pledges"
  - rule_id: v_incident_target_present
    priority: 38
    category: referential
    condition: "POST /compliance-incidents missing the target its category requires: episode_id for INDECENCY; underwriting_spot_id for SPONSOR_ID and PUBLIC_FILE; respondent_volunteer_id for VOLUNTEER_CONFLICT; program_id for every category except VOLUNTEER_CONFLICT. Also fires when sanction != NONE while respondent_volunteer_id is absent."
    error_id: ERR_INCIDENT_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /compliance-incidents"

  # ---------------------------------------------------------------- concurrency
  - rule_id: v_occ_grid_version
    priority: 40
    category: concurrency
    condition: "expected_grid_version != ScheduleGrid.version."
    error_id: ERR_STALE_GRID_VERSION
    http_status: 412
    applies_to: "POST /schedule-grids/{gridId}/slot-assignments, POST /schedule-grids/{gridId}/publish"
  - rule_id: v_occ_proposal_version
    priority: 40
    category: concurrency
    condition: "expected_proposal_version != ProgramProposal.version."
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412
    applies_to: "POST /program-proposals/{proposalId}/decide"
  - rule_id: v_occ_program_version
    priority: 40
    category: concurrency
    condition: "expected_program_version != Program.version."
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /programs/{programId}/cancel"

  # ---------------------------------------------------------------- business_safety
  - rule_id: v_segregation_of_duties
    priority: 45
    category: business_safety
    condition: "POST /compliance-incidents/{incidentId}/adjudicate where the incident names an underwriting_spot_id and X-User-ID equals that spot's reviewed_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance-incidents/{incidentId}/adjudicate"
    note: "Deliberately outranks v_incident_state (priority 50): an officer who cleared the copy is turned away before the incident's own status is inspected, so an already-SUBSTANTIATED incident still answers ERR_SEGREGATION_OF_DUTIES rather than ERR_INVALID_STATE."
  - rule_id: v_program_not_restricted
    priority: 46
    category: business_safety
    condition: "POST /slot-assignments/{assignmentId}/confirm, /reinstate, POST /episodes or POST /episodes/{episodeId}/air-result where the governing Program.compliance_standing == RESTRICTED."
    error_id: ERR_PROGRAM_RESTRICTED
    http_status: 409
    applies_to: "POST /slot-assignments/{assignmentId}/confirm, POST /slot-assignments/{assignmentId}/reinstate, POST /episodes, POST /episodes/{episodeId}/air-result"
  - rule_id: v_no_self_vote
    priority: 47
    category: business_safety
    condition: "POST /program-proposals/{proposalId}/votes where member_volunteer_id == proposal.proposer_volunteer_id."
    error_id: ERR_SELF_VOTE_FORBIDDEN
    http_status: 403
    applies_to: "POST /program-proposals/{proposalId}/votes"
  - rule_id: v_revocation_needs_substantiated_incident
    priority: 48
    category: business_safety
    condition: "POST /certifications/{certificationId}/revoke where the incident named by incident_id is not SUBSTANTIATED, or its respondent_volunteer_id differs from the certification's volunteer_id."
    error_id: ERR_REVOCATION_UNSUPPORTED
    http_status: 422
    applies_to: "POST /certifications/{certificationId}/revoke"

  # ---------------------------------------------------------------- state
  - rule_id: v_invalid_state_transition
    priority: 50
    category: state
    condition: "The requested transition is not declared for the entity's current state in §1.2 (for example grading an exam on a PASSED record, confirming a RELEASED assignment, activating an ACTIVE drive, or acting on any terminal state)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every transition endpoint"
  - rule_id: v_grid_mutable
    priority: 50
    category: state
    condition: "POST /schedule-grids/{gridId}/slot-assignments, /publish, or a confirm / release / reinstate touching a grid whose status is PUBLISHED or SUPERSEDED."
    error_id: ERR_GRID_NOT_MUTABLE
    http_status: 409
    applies_to: "POST /schedule-grids/{gridId}/slot-assignments, POST /slot-assignments/{assignmentId}/confirm, POST /slot-assignments/{assignmentId}/release, POST /slot-assignments/{assignmentId}/reinstate"
    note: "Deliberately outranks v_slot_window_conflict (priority 66): a slot create aimed at a PUBLISHED grid whose window also collides answers ERR_GRID_NOT_MUTABLE, never ERR_SLOT_CONFLICT."
  - rule_id: v_proposal_in_committee
    priority: 51
    category: state
    condition: "POST /program-proposals/{proposalId}/votes or /decide where proposal.status != IN_COMMITTEE."
    error_id: ERR_PROPOSAL_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /program-proposals/{proposalId}/votes, POST /program-proposals/{proposalId}/decide"
  - rule_id: v_drive_active
    priority: 52
    category: state
    condition: "POST /pledges or POST /phone-bank-shifts where the MembershipDrive.status != ACTIVE."
    error_id: ERR_DRIVE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pledges, POST /phone-bank-shifts"
  - rule_id: v_log_pending
    priority: 53
    category: state
    condition: "POST /episodes/{episodeId}/submit-log where log_status != PENDING, or POST /episodes/{episodeId}/playlist-entries where log_status is not PENDING."
    error_id: ERR_LOG_NOT_PENDING
    http_status: 409
    applies_to: "POST /episodes/{episodeId}/playlist-entries, POST /episodes/{episodeId}/submit-log"
  - rule_id: v_public_file_obligation_exists
    priority: 54
    category: state
    condition: "POST /underwriting-spots/{spotId}/public-file-posting where public_file_status is NOT_REQUIRED, POSTED or LATE_POSTED."
    error_id: ERR_PUBLIC_FILE_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /underwriting-spots/{spotId}/public-file-posting"
  - rule_id: v_drive_close_requires_settled_pledges
    priority: 55
    category: state
    condition: "POST /membership-drives/{driveId}/close where any Pledge on the drive still has payment_status == PENDING."
    error_id: ERR_PLEDGES_PENDING
    http_status: 409
    applies_to: "POST /membership-drives/{driveId}/close"
  - rule_id: v_premium_reserved
    priority: 56
    category: state
    condition: "POST /pledges/{pledgeId}/premium-fulfillment where premium_status != RESERVED."
    error_id: ERR_PREMIUM_NOT_RESERVED
    http_status: 409
    applies_to: "POST /pledges/{pledgeId}/premium-fulfillment"
  - rule_id: v_ship_requires_paid_pledge
    priority: 57
    category: state
    condition: "POST /pledges/{pledgeId}/premium-fulfillment with action SHIP where payment_status != PAID."
    error_id: ERR_PLEDGE_NOT_PAID
    http_status: 409
    applies_to: "POST /pledges/{pledgeId}/premium-fulfillment"
  - rule_id: v_proposal_mutable
    priority: 58
    category: state
    condition: "PATCH /program-proposals/{proposalId} where status is not DRAFT or REVISION_REQUESTED; PATCH /underwriting-spots/{spotId} where status != DRAFT; PATCH /volunteers/{volunteerId} where status == RESIGNED."
    error_id: ERR_NOT_EDITABLE
    http_status: 409
    applies_to: "PATCH /program-proposals/{proposalId}, PATCH /underwriting-spots/{spotId}, PATCH /volunteers/{volunteerId}"

  # ---------------------------------------------------------------- cross-entity state
  - rule_id: v_proposer_certified
    priority: 60
    category: business_cross_entity
    condition: "POST /program-proposals/{proposalId}/submit where the proposer Volunteer.status != CERTIFIED."
    error_id: ERR_PROPOSER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /program-proposals/{proposalId}/submit"
  - rule_id: v_voter_eligible
    priority: 61
    category: business_cross_entity
    condition: "POST /program-proposals/{proposalId}/votes where the member Volunteer.status is SUSPENDED or RESIGNED."
    error_id: ERR_VOTER_INELIGIBLE
    http_status: 422
    applies_to: "POST /program-proposals/{proposalId}/votes"
  - rule_id: v_board_operator_certified
    priority: 62
    category: business_cross_entity
    condition: "POST /episodes or POST /episodes/{episodeId}/air-result where the named board operator (or substitute) holds no CertificationRecord of cert_type BOARD_OPERATION with status PASSED and expires_on > the current logical clock, or whose Volunteer.status is SUSPENDED or RESIGNED."
    error_id: ERR_OPERATOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /episodes, POST /episodes/{episodeId}/air-result"
  - rule_id: v_shift_volunteer_eligible
    priority: 63
    category: business_cross_entity
    condition: "POST /phone-bank-shifts where the named Volunteer.status is SUSPENDED or RESIGNED."
    error_id: ERR_VOLUNTEER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /phone-bank-shifts"

  # ---------------------------------------------------------------- temporal
  - rule_id: v_shift_inside_drive_window
    priority: 65
    category: business_temporal
    condition: "POST /phone-bank-shifts where start_at < drive.start_at or end_at > drive.end_at."
    error_id: ERR_SHIFT_OUTSIDE_DRIVE_WINDOW
    http_status: 422
    applies_to: "POST /phone-bank-shifts"
  - rule_id: v_slot_window_conflict
    priority: 66
    category: business_temporal
    condition: "POST /schedule-grids/{gridId}/slot-assignments or POST /slot-assignments/{assignmentId}/reinstate where another SlotAssignment on the same grid and day_of_week with status in {TENTATIVE, CONFIRMED} satisfies new_start < existing_end + 2 AND existing_start < new_end + 2 (half-open minute windows plus the 2-minute station-identification buffer on each side), and conflict_policy is not SENIORITY_PREEMPT."
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /schedule-grids/{gridId}/slot-assignments, POST /slot-assignments/{assignmentId}/reinstate"
  - rule_id: v_volunteer_shift_conflict
    priority: 67
    category: business_temporal
    condition: "POST /phone-bank-shifts where the same volunteer already holds a shift with status in {SCHEDULED, COMPLETED} whose CLOSED interval [start_at, end_at] intersects the new closed interval - back-to-back shifts that merely touch at an endpoint DO conflict."
    error_id: ERR_SHIFT_CONFLICT
    http_status: 409
    applies_to: "POST /phone-bank-shifts"
  - rule_id: v_retake_cooling_off
    priority: 68
    category: business_temporal
    condition: "POST /certifications/{certificationId}/retake where the current logical clock is earlier than last_attempt_at + 14 days."
    error_id: ERR_RETAKE_TOO_SOON
    http_status: 409
    applies_to: "POST /certifications/{certificationId}/retake"
  - rule_id: v_attempt_cap
    priority: 69
    category: business_temporal
    condition: "POST /certifications/{certificationId}/retake where attempt_count >= 3."
    error_id: ERR_MAX_ATTEMPTS_REACHED
    http_status: 409
    applies_to: "POST /certifications/{certificationId}/retake"

  # ---------------------------------------------------------------- capacity and quota
  - rule_id: v_phone_line_capacity
    priority: 70
    category: business_capacity
    condition: "POST /phone-bank-shifts where at some instant inside the new HALF-OPEN window [start_at, end_at) the count of existing shifts on the drive with status in {SCHEDULED, COMPLETED} whose half-open windows cover that instant already equals drive.phone_line_count - shifts that only touch at an endpoint do NOT consume a line."
    error_id: ERR_PHONE_LINE_CAPACITY
    http_status: 409
    applies_to: "POST /phone-bank-shifts"
  - rule_id: v_quorum_met
    priority: 71
    category: business_capacity
    condition: "POST /program-proposals/{proposalId}/decide where the count of CommitteeVote rows in the current review_round is below max(3, ceil(eligible_seats * 0.60))."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /program-proposals/{proposalId}/decide"
  - rule_id: v_grid_not_empty_on_publish
    priority: 72
    category: business_capacity
    condition: "POST /schedule-grids/{gridId}/publish where total_assigned_minutes == 0."
    error_id: ERR_GRID_EMPTY
    http_status: 422
    applies_to: "POST /schedule-grids/{gridId}/publish"
  - rule_id: v_no_tentative_slots_on_publish
    priority: 73
    category: business_capacity
    condition: "POST /schedule-grids/{gridId}/publish where any SlotAssignment on the grid still has status == TENTATIVE."
    error_id: ERR_TENTATIVE_SLOTS_PRESENT
    http_status: 409
    applies_to: "POST /schedule-grids/{gridId}/publish"
  - rule_id: v_diversity_quota
    priority: 74
    category: business_capacity
    condition: "POST /schedule-grids/{gridId}/publish where public_affairs_minutes_pct < 8.00."
    error_id: ERR_DIVERSITY_QUOTA_UNMET
    http_status: 422
    applies_to: "POST /schedule-grids/{gridId}/publish"
  - rule_id: v_week_minutes_cap
    priority: 75
    category: business_capacity
    condition: "POST /schedule-grids/{gridId}/slot-assignments where the grid's total_assigned_minutes would exceed 10080."
    error_id: ERR_WEEK_MINUTES_EXCEEDED
    http_status: 422
    applies_to: "POST /schedule-grids/{gridId}/slot-assignments"
  - rule_id: v_playlist_required_for_music
    priority: 76
    category: business_capacity
    condition: "POST /episodes/{episodeId}/submit-log where the Program.format_code == MUSIC and the episode has zero PlaylistEntry rows."
    error_id: ERR_PLAYLIST_EMPTY
    http_status: 422
    applies_to: "POST /episodes/{episodeId}/submit-log"
  - rule_id: v_seniority_preempt_margin
    priority: 77
    category: business_capacity
    condition: "POST /schedule-grids/{gridId}/slot-assignments with conflict_policy == SENIORITY_PREEMPT where the challenger host's seniority_score minus the incumbent host's seniority_score is less than 5.00."
    error_id: ERR_SENIORITY_MARGIN_UNMET
    http_status: 409
    applies_to: "POST /schedule-grids/{gridId}/slot-assignments"
  - rule_id: v_committee_staffed
    priority: 78
    category: business_capacity
    condition: "POST /program-proposals/{proposalId}/open-review where fewer than 3 Volunteers hold committee_seat == true with status not in {SUSPENDED, RESIGNED}."
    error_id: ERR_COMMITTEE_UNDERSTAFFED
    http_status: 422
    applies_to: "POST /program-proposals/{proposalId}/open-review"
  - rule_id: v_edited_copy_clean
    priority: 79
    category: business_capacity
    condition: "POST /underwriting-spots/{spotId}/review supplying edited_copy_text whose own screened risk score is >= 25."
    error_id: ERR_EDITED_COPY_STILL_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /underwriting-spots/{spotId}/review"
  - rule_id: v_political_copy_uncensorable
    priority: 80
    category: business_capacity
    condition: "POST /underwriting-spots/{spotId}/review supplying edited_copy_text for a spot whose spot_class == POLITICAL_CANDIDATE."
    error_id: ERR_POLITICAL_COPY_UNCENSORABLE
    http_status: 422
    applies_to: "POST /underwriting-spots/{spotId}/review"
  - rule_id: v_premium_stock_available
    priority: 81
    category: business_capacity
    condition: "POST /pledges/{pledgeId}/premium-fulfillment with action SHIP where the reserved PremiumItem has on_hand_qty < 1."
    error_id: ERR_PREMIUM_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /pledges/{pledgeId}/premium-fulfillment"
endpoints:
  # ---------------------------------------------------------------- logical clock and sweep
  - method: POST
    path: "/_clock/set_current_utc"
    entity: null
    purpose: "Set the server's logical clock. The default logical clock is 2026-08-01T00:00:00Z; every certification expiry, retake cooling-off window, log deadline, public-file deadline, quarter boundary and drive window is evaluated against this clock and never against wall-clock time."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer, TrainingCoordinator, DevelopmentCoordinator]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    status: 200
    errors: [ERR_VALIDATION]
  - method: POST
    path: "/operations/daily-sweep"
    entity: null
    purpose: "Advance every clock-driven obligation exactly once: expire PASSED certifications whose expires_on has arrived (demoting CERTIFIED volunteers to PROBATION and stripping ineligible board operators off SCHEDULED episodes), mark still-PENDING episode logs DELINQUENT at log_due_at, flip REQUIRED public-file obligations to MISSING at public_file_due_at and raise the substantiated PUBLIC_FILE incident that charges the carrying program, and re-evaluate every ON_AIR_ACTIVE program's TRAILING_SIX performance score."
    roles: [ProgramDirector, ComplianceOfficer]
    input: []
    output: "{ expired_certification_ids: string[], delinquent_episode_ids: string[], missing_public_file_spot_ids: string[], created_incident_ids: string[], reviewed_program_ids: string[] }"
    status: 200
    errors: [ERR_UNAUTHORIZED]

  # ---------------------------------------------------------------- volunteers
  - method: POST
    path: "/volunteers"
    entity: Volunteer
    purpose: "Enrol a volunteer on the roster in status PROSPECT."
    roles: [TrainingCoordinator]
    input: [legal_name, email, role_track, seniority_start_date, "committee_seat?"]
    output: Volunteer
    status: 201
    errors: [ERR_VALIDATION, ERR_DUPLICATE_KEY, ERR_UNAUTHORIZED]
  - method: GET
    path: "/volunteers/{volunteerId}"
    entity: Volunteer
    purpose: "Read one volunteer with the recomputed continuous_service_months, current_certification_count and seniority_score."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer, TrainingCoordinator, DevelopmentCoordinator]
    input: []
    output: Volunteer
    status: 200
    errors: [ERR_VOLUNTEER_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/volunteers"
    entity: Volunteer
    purpose: "List volunteers, filterable by roster standing, track and committee seat."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer, TrainingCoordinator, DevelopmentCoordinator]
    input: ["status?", "role_track?", "committee_seat?", "limit?", "offset?"]
    output: "Volunteer[]"
    status: 200
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: PATCH
    path: "/volunteers/{volunteerId}"
    entity: Volunteer
    purpose: "Amend roster details and seat the volunteer on (or unseat them from) the programming committee. status, strike_count and every derived field are computed and ignore input."
    roles: [TrainingCoordinator, ProgramDirector]
    input: ["legal_name?", "email?", "committee_seat?"]
    output: Volunteer
    status: 200
    errors: [ERR_VALIDATION, ERR_DUPLICATE_KEY, ERR_NOT_EDITABLE, ERR_VOLUNTEER_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/volunteers/{volunteerId}/certifications"
    entity: CertificationRecord
    purpose: "Open a certification record for a curriculum. Supplying exam_score grades the attempt in the same request, so the record lands directly on PASSED or FAILED; omitting it leaves the record on PENDING_EXAM for later grading."
    roles: [TrainingCoordinator]
    input: [cert_type, "exam_score?"]
    output: CertificationRecord
    status: 201
    errors: [ERR_VALIDATION, ERR_VOLUNTEER_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/volunteers/{volunteerId}/certifications"
    entity: CertificationRecord
    purpose: "List one volunteer's certification records."
    roles: [ProgramDirector, ComplianceOfficer, TrainingCoordinator, Volunteer]
    input: ["cert_type?", "status?", "limit?", "offset?"]
    output: "CertificationRecord[]"
    status: 200
    errors: [ERR_VALIDATION, ERR_VOLUNTEER_NOT_FOUND, ERR_UNAUTHORIZED]

  # ---------------------------------------------------------------- certifications
  - method: GET
    path: "/certifications/{certificationId}"
    entity: CertificationRecord
    purpose: "Read one certification record."
    roles: [ProgramDirector, ComplianceOfficer, TrainingCoordinator, Volunteer]
    input: []
    output: CertificationRecord
    status: 200
    errors: [ERR_CERTIFICATION_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/certifications"
    entity: CertificationRecord
    purpose: "List certification records across the roster, filterable by volunteer, curriculum and lifecycle state."
    roles: [ProgramDirector, ComplianceOfficer, TrainingCoordinator]
    input: ["volunteer_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: "CertificationRecord[]"
    status: 200
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: "/certifications/{certificationId}/exam-results"
    entity: CertificationRecord
    purpose: "Grade a PENDING_EXAM attempt. A score of 80 or more passes, stamps issued_on and sets expires_on 24 months later; anything less fails."
    roles: [TrainingCoordinator]
    input: [exam_score]
    output: CertificationRecord
    status: 200
    errors: [ERR_VALIDATION, ERR_INVALID_STATE, ERR_CERTIFICATION_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/certifications/{certificationId}/retake"
    entity: CertificationRecord
    purpose: "Reopen a FAILED record for another attempt once the 14-day cooling-off window has elapsed and fewer than 3 attempts have been graded."
    roles: [TrainingCoordinator]
    input: []
    output: CertificationRecord
    status: 200
    errors: [ERR_INVALID_STATE, ERR_RETAKE_TOO_SOON, ERR_MAX_ATTEMPTS_REACHED, ERR_CERTIFICATION_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/certifications/{certificationId}/revoke"
    entity: CertificationRecord
    purpose: "Revoke a PASSED certification on the strength of a substantiated incident against its holder. Head of the four-link cascade: certification REVOKED -> volunteer SUSPENDED -> hosted programs UNDER_REVIEW -> their scheduled episodes lose the board operator."
    roles: [ComplianceOfficer]
    input: [incident_id, revocation_reason]
    output: CertificationRecord
    status: 200
    errors: [ERR_VALIDATION, ERR_INVALID_STATE, ERR_REVOCATION_UNSUPPORTED, ERR_INCIDENT_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_UNAUTHORIZED]

  # ---------------------------------------------------------------- program proposals
  - method: POST
    path: "/program-proposals"
    entity: ProgramProposal
    purpose: "Draft a program proposal."
    roles: [Volunteer, ProgramDirector]
    input: [proposer_volunteer_id, title, format_code, language_code, requested_daypart, requested_duration_minutes, "diversity_tags?"]
    output: ProgramProposal
    status: 201
    errors: [ERR_VALIDATION, ERR_VOLUNTEER_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/program-proposals/{proposalId}"
    entity: ProgramProposal
    purpose: "Read one proposal with its latest composite_score, review_round and decline_majority."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer]
    input: []
    output: ProgramProposal
    status: 200
    errors: [ERR_PROPOSAL_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: "/program-proposals"
    entity: ProgramProposal
    purpose: "List proposals, filterable by author, review state and format."
    roles: [ProgramDirector, CommitteeMember, Volunteer, ComplianceOfficer]
    input: ["proposer_volunteer_id?", "status?", "format_code?", "limit?", "offset?"]
    output: "ProgramProposal[]"
    status: 200
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: PATCH
    path: "/program-proposals/{proposalId}"
    entity: ProgramProposal
    purpose: "Revise a proposal while it is DRAFT or REVISION_REQUESTED. Only the author may revise it."
    roles: [Volunteer]
    input: ["title?", "format_code?", "language_code?", "requested_daypart?", "requested_duration_minutes?", "diversity_tags?"]
    output: ProgramProposal
    status: 200
    errors: [ERR_VALIDATION, ERR_NOT_PROPOSAL_OWNER, ERR_NOT_EDITABLE, ERR_PROPOSAL_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/program-proposals/{proposalId}/submit"
    entity: ProgramProposal
    purpose: "Submit a DRAFT proposal, or re-submit one out of REVISION_REQUESTED, which advances review_round and voids the previous round's tally."
    roles: [Volunteer]
    input: []
    output: ProgramProposal
    status: 200
    errors: [ERR_INVALID_STATE, ERR_NOT_PROPOSAL_OWNER, ERR_PROPOSER_NOT_CERTIFIED, ERR_PROPOSAL_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/program-proposals/{proposalId}/withdraw"
    entity: ProgramProposal
    purpose: "Withdraw a proposal at any point before decision."
    roles: [Volunteer]
    input: []
    output: ProgramProposal
    status: 200
    errors: [ERR_INVALID_STATE, ERR_NOT_PROPOSAL_OWNER, ERR_PROPOSAL_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: "/program-proposals/{proposalId}/open-review"
    entity: ProgramProposal
    purpose: "Move a SUBMITTED proposal into committee review, which requires at least 3 seated, unsuspended committee members."
    roles: [ProgramDirector]
    input: []
    output: ProgramProposal
    status: 200
