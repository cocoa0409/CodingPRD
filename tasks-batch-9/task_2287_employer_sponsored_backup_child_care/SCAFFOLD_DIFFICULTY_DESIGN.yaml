      - name: invoice_rounds_each_line_then_sums_never_5143
        grounds:
          - calculations.employer_invoice_totals
          - calculations.reservation_charge_money
          - calculations.reservation_billable_hours
          - state_machines.Reservation.NOT_BILLABLE_to_ACCRUED
          - state_machines.Reservation.ACCRUED_to_INVOICED
          - entities.InvoiceLine.fields.amount_cents
          - entities.EmployerInvoice.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order is observable: two identical in-home copay
          lines of 4.25h x 605c round to 2571 each and sum to subtotal_cents 5142, whereas summing
          the unrounded products first and rounding once gives round_half_up(5142.5) == 5143; the
          admin fee then rounds a SECOND time off the integer subtotal (437, total 5579), so the
          two rounding steps are nested rather than parallel.
