  # =====================================================================
  # SECTION: validations
  # =====================================================================
  - section: validations
    instances:

      - name: corner_val_member_cannot_act_on_another_members_pause
        claim_type: Violation -> Error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles.Member"]
        distinguishing_aspect: "Rung 4 compares X-User-ID against the addressed member: member A requesting a pause on member B's account returns ERR_NOT_RESOURCE_OWNER with HTTP 403 and creates no PauseRequest."
        test_recipe:
          setup: ["Two ACTIVE members on one plan."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { v1_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${v1_plan}", email: "v1a@kidswear.test", display_name: "Val A", child_size_code: "5" }
              as: PlatformAdmin
              captures: { v1_a: $.data.id }
            - call: "POST /kidswear/members/${v1_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members"
              payload: { plan_id: "${v1_plan}", email: "v1b@kidswear.test", display_name: "Val B", child_size_code: "5" }
              as: PlatformAdmin
              captures: { v1_b: $.data.id }
            - call: "POST /kidswear/members/${v1_b}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/members/${v1_b}/pause-requests"
              payload: { start_at: "2026-05-05T00:00:00Z", days_requested: 10 }
              as: Member
              as_user_id: "${v1_a}"
              captures: { err_v1: $.data.error_id }
          assert:
            - "the trigger returns HTTP 403"
            - "the captured err_v1 equals ERR_NOT_RESOURCE_OWNER"
            - "GET /kidswear/pause-requests returns total_count 0"

      - name: corner_val_pending_member_cannot_open_a_cycle
        claim_type: Violation -> Error
        grounds: ["validations[priority=15]", "errors[ERR_MEMBER_NOT_ACTIVATED]"]
        distinguishing_aspect: "Rung 15 blocks cycle creation for a PENDING member with ERR_MEMBER_NOT_ACTIVATED, before any window or entitlement rung is consulted."
        test_recipe:
          setup: ["One PENDING member who has never been activated."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { v2_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${v2_plan}", email: "v2@kidswear.test", display_name: "Val Two", child_size_code: "5" }
              as: PlatformAdmin
              captures: { v2_m: $.data.id }
          trigger:
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${v2_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_v2: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_v2 equals ERR_MEMBER_NOT_ACTIVATED"
            - "Member.${v2_m}.status == PENDING"

      - name: corner_val_cancelled_member_cannot_start_a_new_cycle
        claim_type: Violation -> Error
        grounds: ["validations[priority=14]", "errors[ERR_MEMBER_CANCELLED]", "state_machines.Member.ACTIVE_to_CANCELLED"]
        distinguishing_aspect: "Rung 14 sits above every other standing rung: a CANCELLED member's cycle creation returns ERR_MEMBER_CANCELLED, and cancellation has already revoked the member's credit."
        test_recipe:
          setup: ["One ACTIVE member holding 2500 cents of credit who then cancels."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { v3_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${v3_plan}", email: "v3@kidswear.test", display_name: "Val Three", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { v3_m: $.data.id }
            - call: "POST /kidswear/members/${v3_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members/${v3_m}/credit-adjustments"
              payload: { amount_cents: 2500, reason: "goodwill" }
              as: BillingAgent
              captures: { v3_cre: $.data.id }
            - call: "POST /kidswear/members/${v3_m}/cancel"
              payload: {}
              as: Member
              as_user_id: "${v3_m}"
          trigger:
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${v3_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_v3: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_v3 equals ERR_MEMBER_CANCELLED"
            - "Member.${v3_m}.status == CANCELLED"
            - "CreditLedgerEntry.${v3_cre}.status == REVOKED"
            - "Member.${v3_m}.credit_balance_cents == 0"

      - name: corner_val_paused_member_cannot_open_a_box
        claim_type: Violation -> Error
        grounds: ["validations[priority=17]", "errors[ERR_MEMBER_PAUSED]", "state_machines.Member.ACTIVE_to_PAUSED"]
        distinguishing_aspect: "Rung 17 stops Pipeline R circulation while PAUSED: box creation on an OPEN cycle returns ERR_MEMBER_PAUSED even though the cycle itself is in a legal state."
        test_recipe:
          setup: ["One member with an OPEN cycle who is then paused for 10 days from 2026-05-05."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { v4_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${v4_plan}", email: "v4@kidswear.test", display_name: "Val Four", child_size_code: "5" }
              as: PlatformAdmin
              captures: { v4_m: $.data.id }
            - call: "POST /kidswear/members/${v4_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${v4_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { v4_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${v4_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members/${v4_m}/pause-requests"
              payload: { start_at: "2026-05-05T00:00:00Z", days_requested: 10 }
              as: Member
              as_user_id: "${v4_m}"
              captures: { v4_pr: $.data.id }
            - call: "POST /kidswear/pause-requests/${v4_pr}/activate"
              payload: {}
              as: BillingAgent
          trigger:
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${v4_cyc}" }
              as: WarehouseOperator
              captures: { err_v4: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_v4 equals ERR_MEMBER_PAUSED"
            - "Member.${v4_m}.status == PAUSED"
            - "Cycle.${v4_cyc}.status == OPEN"

      - name: corner_val_paused_member_cannot_start_a_trade_in_intake
        claim_type: Violation -> Error
        grounds: ["validations[priority=18]", "errors[ERR_INTAKE_BLOCKED_WHILE_PAUSED]"]
