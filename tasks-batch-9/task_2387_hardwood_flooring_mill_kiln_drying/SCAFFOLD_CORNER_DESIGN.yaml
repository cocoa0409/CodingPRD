  - section: validations
    instances:
      - name: mc_plan_deviation_blocks_load_then_passes_within_tolerance
        claim_type: violation_to_error
        grounds: ["validations[priority 25]", "calculations.moisture_plan_deviation_check"]
        distinguishing_aspect: "A weighted 38.6 pct against a 45.0 pct schedule design is 6.4 points out and blocks the load with 422; swapping to a 46.0 pct receipt gives a 1.0-point deviation and the load succeeds."
        test_recipe:
          setup: ["A SCHEDULED RED_OAK charge on a 12000 bf chamber under a schedule designed for 45.0 pct green stock, with one 5000 bf receipt at 38.6 pct and one 5800 bf receipt at 46.0 pct accepted."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Valley Sawmill", received_board_feet: 5000, receipt_grade: "SELECT", moisture_pct_at_receipt: 38.6 }, as: ProcurementClerk, captures: { r_dry: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r_dry}/accept", payload: { accepted_board_feet: 5000 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r_green: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r_green}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r_dry}" }, as: KilnOperator }
          trigger:
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/deallocate_receipt", payload: { green_receipt_id: "${r_dry}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r_green}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
          assert:
            - "First load: status 422 with data.error_id == \"ERR_MC_PLAN_DEVIATION\" (weighted 38.6 versus design 45.0 is 6.4 > 3.0)."
            - "GET /mill/kiln-charges/{charge_a} after the failed load still shows status \"SCHEDULED\" and GET /mill/kiln-chambers/{chamber_id} shows \"AVAILABLE\"."
            - "After the swap the charge shows weighted_initial_moisture_pct == 46.0 and charged_green_bf == 5800."
            - "Second load: status 200 with data.status == \"LOADED\"; the chamber is \"OCCUPIED\" and the 46.0 pct receipt is \"CONSUMED\"."
            - "The 38.6 pct receipt is back to \"ACCEPTED\" with kiln_charge_id == null and was never consumed."

      - name: chamber_capacity_exceeded_on_allocate_and_exact_fit_passes
        claim_type: violation_to_error
        grounds: ["validations[priority 39]", "entities.KilnChamber.capacity_board_feet"]
        distinguishing_aspect: "On a 9000 bf chamber a second allocation taking the total to 9700 is refused with 422, while a 3200 bf allocation landing on exactly 9000 is accepted."
        test_recipe:
