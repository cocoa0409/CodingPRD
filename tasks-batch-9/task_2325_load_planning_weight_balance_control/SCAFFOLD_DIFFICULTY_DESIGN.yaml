  - rule_id: non_linear_state_machine
    instances:

      - name: flight_dg_hold_cycle_parallel_to_status
        entity: Flight
        shape: "parallel dimensions plus a cycle on the load_release_state dimension"
        grounds:
          - state_machines.Flight.dimension_load_release_state
          - state_machines.Flight.dimension_status
          - entities.Flight.fields.dg_hold_count
        distinguishing_aspect: |
          Flight carries two independent state dimensions on one row. The
          load_release_state dimension runs OPEN -> HELD_FOR_DG -> HELD_FOR_DG ->
          OPEN -> RELEASED, a genuine cycle, while the status dimension sits at
          LOAD_CONTROLLED throughout and is untouched by every dangerous-goods
          event. dg_hold_count rises to 2, falls to 1, then to 0, and only the
          transition that brings it to 0 returns the release dimension to OPEN.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and holds H1, H4; runway LSGG/04 with the [15,30) band; STANDARD program; one flight 10:00-12:30 UTC."
            - "Plan with OC 50 male / 6 child / 4 infant = 4650.00 kg, H1 1450.00 kg of bags, and two dangerous-goods consignments DG1 400.00 kg and DG2 200.00 kg both assigned to H4 (both created and assigned BEFORE the compute, so the plan reaches COMPUTED and the flight LOAD_CONTROLLED)."
            - "Both DG consignments are explicitly accepted by the ramp agent after their declarations are accepted."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
