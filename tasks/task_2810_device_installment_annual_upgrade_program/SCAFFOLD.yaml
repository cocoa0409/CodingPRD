# =============================================================================
# PRD Benchmark Seed Tables — Device Installment & Annual Upgrade Program
# §1.0 - §1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  2810. Device Installment & Annual Upgrade Program (Apple iPhone Upgrade
  Program): credit application & installment loan origination at point of sale,
  bundled device protection premium inside the monthly payment, upgrade
  eligibility at payment threshold with trade-in condition grading, loan payoff
  and remaining-balance rollover on upgrade, device return diagnostic failure
  and downgraded credit, carrier activation and unlock status dependency,
  delinquency handling and device financing lock, program cancellation with
  early payoff quote

domain_name: device-installment-upgrade-program
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; URL paths are top-level
  # collections plus action sub-paths. No nested ownership paths.

  state_machine_shape: parallel
  # InstallmentLoan carries two independent dimensions (`status` x
  # `delinquency_state`); `delinquency_state` is itself cyclic
  # (CURRENT -> GRACE -> DELINQUENT -> DEFAULT -> CURRENT via cure); TradeIn is
  # cyclic (GRADED -> DISPUTED -> GRADED); CreditApplication is branching
  # (SUBMITTED -> {APPROVED | CONDITIONAL_APPROVED | DECLINED}); DeviceUnit
  # carries three independent dimensions (activation x unlock x possession).

  relationship_patterns:
    - one_to_many          # Customer -> CreditApplication/InstallmentLoan
    - self_referential     # InstallmentLoan.predecessor_loan_id, PaymentPosting.reverses_posting_id
    - cross_aggregate      # DeviceUnit -> CarrierAccount, UpgradeRequest -> PayoffQuote

  role_model: segregation_of_duties
  # The RetailAssociate who originates a loan must not be the CreditUnderwriter
  # who decided its application; the ProgramAdmin who approves a trade-in
  # regrade must not be the ServiceTechnician who filed the graded report.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 40 endpoints / 52 error codes / 62 ordered validations /
  # 12 state-machine dimensions / 10 calculations with 6 variants / 6 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the program participant
      - name: email
        type: string
        source: input
        description: contact email; unique across customers
        constraints: "unique; non-empty"
      - name: mobile_number
        type: string
        source: input
        description: contact mobile number
      - name: status
        type: enum
        source: computed
        description: "financing posture of the customer; gates every new financing operation"
        default: ACTIVE
        constraints: "status IN {ACTIVE, FINANCING_LOCKED, CLOSED}"
      - name: financing_lock_reason
        type: enum
        source: computed
        description: "why financing is locked; null when status != FINANCING_LOCKED"
        default: null
        constraints: "financing_lock_reason IN {DEFAULTED_LOAN, DEVICE_RETURN_DIAGNOSTIC_FAILURE, null}"
      - name: financing_locked_at
        type: datetime
        source: computed
        description: "logical-clock instant status became FINANCING_LOCKED; null while ACTIVE"
        default: null
      - name: credit_score_band
        type: enum
        source: computed
        description: "band recorded by the most recent credit decision; null before the first decision"
        default: null
        constraints: "credit_score_band IN {PRIME, NEAR_PRIME, SUBPRIME, null}"
      - name: credit_limit_cents
        type: integer
        source: computed
        description: "program credit limit implied by credit_score_band; 0 before the first decision"
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "SUM(InstallmentLoan.principal_cents - InstallmentLoan.paid_principal_cents) over this customer's loans with status == ACTIVE"
        default: 0
      - name: open_loan_count
        type: integer
        source: computed
        description: "COUNT of this customer's loans with status == ACTIVE"
        default: 0
      - name: completed_upgrade_count
        type: integer
        source: computed
        description: "COUNT of this customer's UpgradeRequest rows with status == COMPLETED"
        default: 0
      - name: last_upgrade_completed_at
        type: datetime
        source: computed
        description: "logical-clock instant of the most recent UpgradeRequest COMPLETED transition; null when completed_upgrade_count == 0"
        default: null
      - name: default_strike_count
        type: integer
        source: computed
        description: "cumulative count of DEFAULT_DECLARED DelinquencyEvent rows across this customer's loans; never decremented"
        default: 0

  - name: DeviceModel
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: catalog stock-keeping unit
        constraints: "unique; non-empty"
      - name: display_name
        type: string
        source: input
        description: marketing name of the model
      - name: retail_price_cents
        type: integer
        source: input
        description: cash price financed by the program
        constraints: "> 0"
      - name: monthly_protection_premium_cents
        type: integer
        source: input
        description: device-protection premium bundled into each monthly installment
        constraints: ">= 0"
      - name: trade_in_base_credit_cents
        type: integer
        source: input
        description: base trade-in credit before condition multiplier and diagnostic deductions
        constraints: ">= 0"
      - name: concurrent_reservation_capacity
        type: integer
        source: input
        description: "maximum number of UpgradeRequest fulfillment windows that may overlap on this model at once"
        default: 2
        constraints: ">= 0"
      - name: reserved_slot_count
        type: integer
        source: computed
        description: "COUNT of UpgradeRequest rows with target_device_model_id == this model AND status IN {ELIGIBILITY_PASSED, TRADE_IN_DECLARED, TRADE_IN_GRADED}"
        default: 0
      - name: generation_year
        type: integer
        source: input
        description: model generation year
      - name: active
        type: boolean
        source: input
        description: "false retires the model from the catalog: no new application and no upgrade may target it"
        default: true

  - name: CarrierAccount
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer"
      - name: carrier_code
        type: enum
        source: input
        description: mobile carrier the device is activated on
        constraints: "carrier_code IN {VERIZON, ATT, TMOBILE, ESIM_MVNO}"
      - name: account_number
        type: string
        source: input
        description: carrier-side account identifier
      - name: unlock_policy_days
        type: integer
        source: input
        description: "carrier-specific minimum days between device activation and an accepted unlock request"
        default: 60
        constraints: ">= 0"
      - name: activation_state
        type: enum
        source: computed
        description: carrier-side state of the account
        default: PENDING
        constraints: "activation_state IN {PENDING, ACTIVATED, PORT_ELIGIBLE}"
      - name: activated_at
        type: datetime
        source: computed
        description: "logical-clock instant of the PENDING -> ACTIVATED transition; null while PENDING"
        default: null
      - name: port_freeze_flag
        type: boolean
        source: input
        description: "carrier-side port freeze; while true no DeviceUnit may be activated on this account"
        default: false
      - name: active_device_imei
        type: string
        source: computed
        description: "imei of the DeviceUnit currently activated on this account (plain value, NOT a foreign key); null when no device is activated"
        default: null

  - name: CreditApplication
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; applicant"
      - name: device_model_id
        type: string
        source: input
        description: "FK -> DeviceModel.id; model being financed"
      - name: requested_term_months
        type: integer
        source: input
        description: requested installment term
        constraints: "requested_term_months IN {12, 24}"
      - name: declared_down_payment_cents
        type: integer
        source: input
        description: down payment the applicant declares at application time
        default: 0
        constraints: ">= 0 AND <= DeviceModel.retail_price_cents"
      - name: requested_principal_cents
        type: integer
        source: computed
        description: "DeviceModel.retail_price_cents - declared_down_payment_cents, snapshotted at submission"
      - name: credit_score_band
        type: enum
        source: computed
        description: "band supplied by the underwriter on the decision call; null while SUBMITTED"
        default: null
        constraints: "credit_score_band IN {PRIME, NEAR_PRIME, SUBPRIME, null}"
      - name: credit_limit_cents
        type: integer
        source: computed
        description: "CREDIT_LIMITS[credit_score_band] resolved at decision time"
        default: 0
      - name: exposure_at_decision_cents
        type: integer
        source: computed
        description: "customer outstanding principal over loans with status == ACTIVE plus requested_principal_cents, evaluated at decision time"
        default: 0
      - name: approved_principal_cents
        type: integer
        source: computed
        description: "principal the program is willing to finance after any conditional down payment"
        default: 0
      - name: conditional_down_payment_required_cents
        type: integer
        source: computed
        description: "extra cash required at origination when the decision is CONDITIONAL_APPROVED; 0 otherwise"
        default: 0
      - name: status
        type: enum
        source: computed
        description: decision lifecycle of the application
        default: SUBMITTED
        constraints: "status IN {SUBMITTED, APPROVED, CONDITIONAL_APPROVED, DECLINED, VOIDED_BY_LOCK, ORIGINATED}"
      - name: decision_reason
        type: string
        source: computed
        description: "machine-readable reason token recorded with the decision; null while SUBMITTED"
        default: null
      - name: underwriter_user_id
        type: string
        source: computed
        description: "X-User-ID of the CreditUnderwriter that decided this application; null while SUBMITTED"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "logical-clock instant of the decision; null while SUBMITTED"
        default: null

  - name: InstallmentLoan
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; borrower"
      - name: credit_application_id
        type: string
        source: input
        description: "FK -> CreditApplication.id; the approved application this loan originates from"
      - name: device_model_id
        type: string
        source: input
        description: "FK -> DeviceModel.id; financed model, copied from the application"
      - name: predecessor_loan_id
        type: string
        source: computed
        description: "FK -> InstallmentLoan.id; the loan rolled over into this one; null for a first-generation loan"
        default: null
      - name: down_payment_cents
        type: integer
        source: input
        description: cash collected at point of sale
        default: 0
        constraints: ">= 0"
      - name: origination_fee_cents
        type: integer
        source: computed
        description: "tiered fee selected from ORIGINATION_FEE_TIERS keyed on the pre-fee principal base; 0 for a first-generation loan"
        default: 0
      - name: rolled_over_balance_cents
        type: integer
        source: computed
        description: "net rollover balance carried from predecessor_loan_id; 0 for a first-generation loan"
        default: 0
      - name: principal_cents
        type: integer
        source: computed
        description: "financed principal after down payment, rollover and origination fee"
      - name: term_months
        type: integer
        source: computed
        description: "term copied from CreditApplication.requested_term_months"
        constraints: "term_months IN {12, 24}"
      - name: monthly_protection_premium_cents
        type: integer
        source: computed
        description: "snapshot of DeviceModel.monthly_protection_premium_cents taken at origination; later catalog edits never change it"
      - name: premium_total_cents
        type: integer
        source: computed
        description: "monthly_protection_premium_cents * term_months"
      - name: monthly_installment_cents
        type: integer
        source: computed
        description: "base principal component (see calculations.installment_schedule_generation) + monthly_protection_premium_cents; the last installment may differ by the principal residual"
      - name: paid_principal_cents
        type: integer
        source: computed
        description: "SUM(Installment.paid_principal_cents) over this loan's installments"
        default: 0
      - name: paid_premium_cents
        type: integer
        source: computed
        description: "SUM(Installment.paid_premium_cents) over this loan's installments"
        default: 0
      - name: outstanding_late_fee_cents
        type: integer
        source: computed
        description: "SUM(Installment.late_fee_cents - Installment.late_fee_paid_cents) over this loan's installments with status != VOIDED"
        default: 0
      - name: paid_installment_count
        type: integer
        source: computed
        description: "COUNT of this loan's installments with status == PAID; a PARTIALLY_PAID installment never counts"
        default: 0
      - name: obligation_balance_cents
        type: integer
        source: computed
        description: "(principal_cents - paid_principal_cents) + (premium_total_cents - paid_premium_cents) + outstanding_late_fee_cents"
      - name: status
        type: enum
        source: computed
        description: "servicing dimension of the loan; evolves independently of delinquency_state"
        default: ACTIVE
        constraints: "status IN {ACTIVE, PAID_OFF, ROLLED_OVER}"
      - name: closure_reason
        type: enum
        source: computed
        description: "why the loan left ACTIVE; null while ACTIVE"
        default: null
        constraints: "closure_reason IN {PROGRAM_CANCELLATION, UPGRADE_ROLLOVER, null}"
      - name: delinquency_state
        type: enum
        source: computed
        description: "collections dimension of the loan; written only by POST /loans/{id}/payments and POST /servicing/daily-run"
        default: CURRENT
        constraints: "delinquency_state IN {CURRENT, GRACE, DELINQUENT, DEFAULT}"
      - name: days_past_due
        type: integer
        source: computed
        description: "whole days between the oldest not-fully-paid past-due installment's due_date and the logical clock; 0 when none"
        default: 0
      - name: protection_coverage_status
        type: enum
        source: computed
        description: "state of the bundled device-protection cover riding inside the installment"
        default: ACTIVE
        constraints: "protection_coverage_status IN {ACTIVE, SUSPENDED, TERMINATED}"
      - name: upgrade_hold_flag
        type: boolean
        source: computed
        description: "true while a non-terminal UpgradeRequest reserves this loan's device for return"
        default: false
      - name: origination_date
        type: datetime
        source: system
        description: "logical-clock instant at origination; anchors the installment due-date ladder"
      - name: upgrade_window_opens_at
        type: datetime
        source: computed
        description: "origination_date + UPGRADE_MIN_LOAN_AGE_DAYS days; an upgrade request before this instant is rejected"

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> InstallmentLoan.id; owning loan"
      - name: installment_number
        type: integer
        source: computed
        description: "1-based ordinal within the loan's schedule"
        constraints: "1 <= installment_number <= InstallmentLoan.term_months"
      - name: due_date
        type: datetime
        source: computed
        description: "origination_date plus installment_number calendar months at 00:00:00.000Z; day-of-month clamped to the last day of the target month"
      - name: principal_component_cents
        type: integer
        source: computed
        description: "principal share of this installment; the final installment absorbs the rounding residual"
      - name: premium_component_cents
        type: integer
        source: computed
        description: "bundled protection premium share; equals InstallmentLoan.monthly_protection_premium_cents for every installment"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "principal_component_cents + premium_component_cents"
      - name: paid_principal_cents
        type: integer
        source: computed
        description: principal applied to this installment by payment postings
        default: 0
      - name: paid_premium_cents
        type: integer
        source: computed
        description: premium applied to this installment by payment postings
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "paid_principal_cents + paid_premium_cents; the late fee is tracked separately in late_fee_paid_cents"
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "LATE_FEE_CENTS once this installment's own days-past-due exceeds GRACE_PERIOD_DAYS; assessed at most once"
        default: 0
      - name: late_fee_paid_cents
        type: integer
        source: computed
        description: late-fee amount already collected by payment postings
        default: 0
      - name: late_fee_assessed
        type: boolean
        source: computed
        description: "true once the servicing run has assessed this installment's late fee; blocks re-assessment"
        default: false
      - name: status
        type: enum
        source: computed
        description: "PAID when fully funded; else PARTIALLY_PAID when any component was collected; else PAST_DUE when the logical clock reached due_date; else SCHEDULED; VOIDED when the loan closed early"
        default: SCHEDULED
        constraints: "status IN {SCHEDULED, PAST_DUE, PARTIALLY_PAID, PAID, VOIDED}"
      - name: paid_at
        type: datetime
        source: computed
        description: "logical-clock instant this installment reached PAID; cleared when a REVERSAL re-opens it; null otherwise"
        default: null
      - name: void_reason
        type: enum
        source: computed
        description: "why the installment was voided; null unless status == VOIDED"
        default: null
        constraints: "void_reason IN {LOAN_CLOSED, null}"

  - name: PaymentPosting
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> InstallmentLoan.id; loan the money was applied to"
      - name: posting_type
        type: enum
        source: input
        description: "PAYMENT applies the waterfall; REVERSAL undoes an earlier PAYMENT; PAYOFF settles a consumed EARLY_CANCELLATION quote"
        constraints: "posting_type IN {PAYMENT, REVERSAL, PAYOFF}"
      - name: reverses_posting_id
        type: string
        source: input
        description: "FK -> PaymentPosting.id; the PAYMENT this REVERSAL undoes; null for PAYMENT and PAYOFF"
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: "money moved by this posting; for REVERSAL it must equal the reversed posting's amount_cents"
        constraints: "> 0"
      - name: allocated_late_fee_cents
        type: integer
        source: computed
        description: portion of amount_cents consumed by outstanding late fees
        default: 0
      - name: allocated_premium_cents
        type: integer
        source: computed
        description: portion of amount_cents consumed by protection premium components
        default: 0
      - name: allocated_principal_cents
        type: integer
        source: computed
        description: portion of amount_cents consumed by principal components
        default: 0
      - name: installments_satisfied_count
        type: integer
        source: computed
        description: number of installments this posting drove to PAID
        default: 0
      - name: overpayment_cents
        type: integer
        source: computed
        description: "portion of amount_cents that found no bucket to fill; recorded, never auto-refunded"
        default: 0
      - name: obligation_balance_after_cents
        type: integer
        source: computed
        description: "InstallmentLoan.obligation_balance_cents immediately after this posting was applied"
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant the posting was applied

  - name: DeviceUnit
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> InstallmentLoan.id; loan financing this handset"
      - name: device_model_id
        type: string
        source: input
        description: "FK -> DeviceModel.id; model of this handset"
      - name: carrier_account_id
        type: string
        source: input
        description: "FK -> CarrierAccount.id; carrier account the handset is activated on; null while UNACTIVATED"
        default: null
      - name: imei
        type: string
        source: input
        description: handset serial identifier
        constraints: "unique across DeviceUnit; non-empty"
      - name: activation_status
        type: enum
        source: computed
        description: carrier activation dimension
        default: UNACTIVATED
        constraints: "activation_status IN {UNACTIVATED, ACTIVATED, DEACTIVATED}"
      - name: unlock_status
        type: enum
        source: computed
        description: carrier lock dimension, independent of activation_status
        default: LOCKED
        constraints: "unlock_status IN {LOCKED, UNLOCK_REQUESTED, UNLOCKED}"
      - name: possession_status
        type: enum
        source: computed
        description: physical custody dimension, independent of the other two
        default: WITH_CUSTOMER
        constraints: "possession_status IN {WITH_CUSTOMER, RETURN_PENDING, RETURNED, RETURN_FAILED}"
      - name: activated_at
        type: datetime
        source: computed
        description: "logical-clock instant of the UNACTIVATED -> ACTIVATED transition; null while UNACTIVATED"
        default: null
      - name: unlock_requested_at
        type: datetime
        source: computed
        description: "logical-clock instant of the LOCKED -> UNLOCK_REQUESTED transition; null otherwise"
        default: null
      - name: unlocked_at
        type: datetime
        source: computed
        description: "logical-clock instant unlock_status became UNLOCKED; null while locked"
        default: null
      - name: returned_at
        type: datetime
        source: computed
        description: "logical-clock instant possession_status became RETURNED; cleared when the handset goes back to the customer"
        default: null

  - name: UpgradeRequest
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> InstallmentLoan.id; loan being upgraded out of"
      - name: customer_id
        type: string
        source: computed
        description: "FK -> Customer.id; copied from the loan at creation"
      - name: target_device_model_id
        type: string
        source: input
        description: "FK -> DeviceModel.id; model the customer upgrades into"
      - name: new_loan_id
        type: string
        source: computed
        description: "FK -> InstallmentLoan.id; loan minted at completion; null before COMPLETED"
        default: null
      - name: payoff_quote_id
        type: string
        source: computed
        description: "FK -> PayoffQuote.id; the UPGRADE_ROLLOVER quote consumed at completion; null before COMPLETED"
        default: null
      - name: fulfillment_window_start
        type: datetime
        source: input
        description: "first instant of the reservation window on the target model"
        constraints: ">= logical clock at creation, at 00:00:00.000Z"
      - name: fulfillment_window_end
        type: datetime
        source: computed
        description: "fulfillment_window_start + FULFILLMENT_WINDOW_DAYS days; the window is half-open [start, end)"
      - name: paid_installment_count_at_request
        type: integer
        source: computed
        description: "snapshot of InstallmentLoan.paid_installment_count when eligibility was evaluated"
      - name: eligibility_ratio_bps
        type: integer
        source: computed
        description: "floor(paid_installment_count_at_request * 10000 / InstallmentLoan.term_months)"
      - name: trade_in_credit_projection_cents
        type: integer
        source: computed
        description: "latest trade-in credit known to this request: TradeIn.credit_estimate_cents while DECLARED/RECEIVED, TradeIn.credit_final_cents once GRADED; 0 before any declaration"
        default: 0
      - name: projected_rollover_balance_cents
        type: integer
        source: computed
        description: "max(0, UPGRADE_ROLLOVER payoff evaluated at the last recompute - trade_in_credit_projection_cents)"
        default: 0
      - name: credit_shortfall_cents
        type: integer
        source: computed
        description: "max(0, projected_rollover_balance_cents - ROLLOVER_SHORTFALL_LIMIT_CENTS)"
        default: 0
      - name: funding_flag
        type: enum
        source: computed
        description: "REQUIRES_DOWN_PAYMENT once credit_shortfall_cents > 0, otherwise FUNDED"
        default: FUNDED
        constraints: "funding_flag IN {FUNDED, REQUIRES_DOWN_PAYMENT}"
      - name: status
        type: enum
        source: computed
        description: upgrade workflow state
        default: ELIGIBILITY_PASSED
        constraints: "status IN {ELIGIBILITY_PASSED, TRADE_IN_DECLARED, TRADE_IN_GRADED, COMPLETED, EXPIRED, SUPERSEDED}"
      - name: additional_down_payment_cents
        type: integer
        source: computed
        description: "extra cash collected at completion to shrink the rollover balance; 0 unless supplied at completion"
        default: 0
      - name: expiry_reason
        type: enum
        source: computed
        description: "why the request left its reserving states without completing; null while live or COMPLETED"
        default: null
        constraints: "expiry_reason IN {FULFILLMENT_WINDOW_ELAPSED, CUSTOMER_FINANCING_LOCKED, SUPERSEDED_BY_NEW_REQUEST, null}"
      - name: completed_at
        type: datetime
        source: computed
        description: "logical-clock instant of the COMPLETED transition; null otherwise"
        default: null

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - name: upgrade_request_id
        type: string
        source: input
        description: "FK -> UpgradeRequest.id; upgrade this trade-in funds"
      - name: device_unit_id
        type: string
        source: input
        description: "FK -> DeviceUnit.id; handset being returned"
      - name: declared_condition
        type: enum
        source: input
        description: condition the customer self-declares at declaration time
        constraints: "declared_condition IN {EXCELLENT, GOOD, FAIR, POOR}"
      - name: credit_estimate_cents
        type: integer
        source: computed
        description: "DECLARED_ESTIMATE variant of calculations.trade_in_credit, computed at declaration from declared_condition alone"
      - name: graded_condition
        type: enum
        source: computed
        description: "condition derived by the latest DiagnosticReport; null before grading"
        default: null
        constraints: "graded_condition IN {EXCELLENT, GOOD, FAIR, POOR, null}"
      - name: credit_final_cents
        type: integer
        source: computed
        description: "FINAL_GRADED variant of calculations.trade_in_credit from the latest DiagnosticReport; null before grading"
        default: null
      - name: diagnostic_result
        type: enum
        source: computed
        description: "PASS or FAIL from the latest DiagnosticReport; null before grading"
        default: null
        constraints: "diagnostic_result IN {PASS, FAIL, null}"
      - name: latest_report_sequence_no
        type: integer
        source: computed
        description: "MAX(DiagnosticReport.sequence_no) over this trade-in's reports; 0 before grading"
        default: 0
      - name: credit_variance_cents
        type: integer
        source: computed
        description: "credit_final_cents - credit_estimate_cents; negative when grading came in below the declaration"
        default: 0
      - name: dispute_count
        type: integer
        source: computed
        description: "number of GRADED -> DISPUTED transitions so far; capped by MAX_TRADE_IN_DISPUTES"
        default: 0
      - name: dispute_reason
        type: string
        source: computed
        description: "free-text reason recorded by the customer on the newest dispute; null otherwise"
        default: null
      - name: status
        type: enum
        source: computed
        description: trade-in lifecycle; GRADED -> DISPUTED -> GRADED is a legal cycle
        default: DECLARED
        constraints: "status IN {DECLARED, RECEIVED, GRADED, DISPUTED, SETTLED, CANCELLED}"
      - name: received_at
        type: datetime
        source: computed
        description: "logical-clock instant the handset was received at the store; null before RECEIVED"
        default: null
      - name: graded_at
        type: datetime
        source: computed
        description: "logical-clock instant of the newest grading (initial or regrade); null before GRADED"
        default: null
      - name: settled_at
        type: datetime
        source: computed
        description: "logical-clock instant the credit was consumed by an upgrade completion; null before SETTLED"
        default: null

  - name: DiagnosticReport
    parent: null
    common_fields: false
    fields:
      - name: trade_in_id
        type: string
        source: input
        description: "FK -> TradeIn.id; graded trade-in"
      - name: sequence_no
        type: integer
        source: computed
        description: "1-based ordinal within the trade-in; the report with MAX(sequence_no) is authoritative"
      - name: report_type
        type: enum
        source: computed
        description: "INITIAL for the first grading, REGRADE for a dispute override filed by a different actor"
        constraints: "report_type IN {INITIAL, REGRADE}"
      - name: technician_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that filed this report"
      - name: screen_grade
        type: enum
        source: input
        description: measured screen condition
        constraints: "screen_grade IN {PRISTINE, SCRATCHED, CRACKED}"
      - name: battery_health_pct
        type: integer
        source: input
        description: measured battery health percentage
        constraints: "0 <= battery_health_pct <= 100"
      - name: water_damage_flag
        type: boolean
        source: input
        description: liquid-contact indicator tripped
      - name: functional_pass
        type: boolean
        source: input
        description: functional bench test passed
      - name: derived_condition
        type: enum
        source: computed
        description: "condition grade derived from screen_grade, battery_health_pct, water_damage_flag and functional_pass"
        constraints: "derived_condition IN {EXCELLENT, GOOD, FAIR, POOR}"
      - name: condition_multiplier_bps
        type: integer
        source: computed
        description: "CONDITION_MULTIPLIERS_BPS[derived_condition]"
      - name: battery_deduction_cents
        type: integer
        source: computed
        description: "BATTERY_DEDUCTION tier selected by battery_health_pct"
      - name: screen_deduction_cents
        type: integer
        source: computed
        description: "SCREEN_DEDUCTION amount selected by screen_grade"
      - name: computed_credit_cents
        type: integer
        source: computed
        description: "FINAL_GRADED credit this report implies for the trade-in"
      - name: diagnostic_result
        type: enum
        source: computed
        description: "FAIL when water_damage_flag is true or functional_pass is false, otherwise PASS"
        constraints: "diagnostic_result IN {PASS, FAIL}"
      - name: override_reason
        type: string
        source: input
        description: "justification recorded on a REGRADE report; null on an INITIAL report"
        default: null

  - name: PayoffQuote
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> InstallmentLoan.id; loan being quoted"
      - name: quote_type
        type: enum
        source: input
        description: which payoff variant the quote was priced with
        constraints: "quote_type IN {EARLY_CANCELLATION, UPGRADE_ROLLOVER}"
      - name: remaining_principal_cents
        type: integer
        source: computed
        description: "InstallmentLoan.principal_cents - InstallmentLoan.paid_principal_cents at issue time"
      - name: outstanding_late_fee_cents
        type: integer
        source: computed
        description: "InstallmentLoan.outstanding_late_fee_cents at issue time"
      - name: unearned_premium_cents
        type: integer
        source: computed
        description: "unearned protection premium under this quote_type's rebate method"
      - name: premium_rebate_cents
        type: integer
        source: computed
        description: "portion of unearned_premium_cents actually credited against the payoff"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "CANCELLATION_ADMIN_FEE_CENTS for EARLY_CANCELLATION, 0 for UPGRADE_ROLLOVER"
        default: 0
      - name: total_payoff_cents
        type: integer
        source: computed
        description: total amount required to settle the loan under this quote
      - name: past_due_amount_cents
        type: integer
        source: computed
        description: "SUM(Installment.amount_due_cents - Installment.paid_amount_cents) over installments with status IN {PAST_DUE, PARTIALLY_PAID} and due_date <= issued_at; disclosure only, NOT added into total_payoff_cents"
        default: 0
      - name: paid_installment_count_at_quote
        type: integer
        source: computed
        description: "InstallmentLoan.paid_installment_count snapshot at issue time"
      - name: issued_at
        type: datetime
        source: computed
        description: logical-clock instant the quote was priced
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + QUOTE_VALIDITY_DAYS days; validity is half-open [issued_at, expires_at)"
      - name: status
        type: enum
        source: computed
        description: quote lifecycle
        default: ISSUED
        constraints: "status IN {ISSUED, CONSUMED, EXPIRED, SUPERSEDED}"
      - name: consumed_at
        type: datetime
        source: computed
        description: "logical-clock instant the quote was consumed by a cancellation or an upgrade completion; null otherwise"
        default: null

  - name: DelinquencyEvent
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> InstallmentLoan.id; loan the event was recorded against"
      - name: event_type
        type: enum
        source: computed
        description: append-only collections audit record
        constraints: "event_type IN {GRACE_ENTERED, DELINQUENCY_ENTERED, DEFAULT_DECLARED, CURED, LATE_FEE_ASSESSED, FINANCING_LOCK_APPLIED, FINANCING_LOCK_RELEASED}"
      - name: from_state
        type: enum
        source: computed
        description: "InstallmentLoan.delinquency_state before the event; null for LATE_FEE_ASSESSED and lock events"
        default: null
        constraints: "from_state IN {CURRENT, GRACE, DELINQUENT, DEFAULT, null}"
      - name: to_state
        type: enum
        source: computed
        description: "InstallmentLoan.delinquency_state after the event; null for LATE_FEE_ASSESSED and lock events"
        default: null
        constraints: "to_state IN {CURRENT, GRACE, DELINQUENT, DEFAULT, null}"
      - name: days_past_due_at_event
        type: integer
        source: computed
        description: "InstallmentLoan.days_past_due at the moment the event was recorded"
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: "money attached to the event: the assessed fee for LATE_FEE_ASSESSED, otherwise 0"
        default: 0
      - name: occurred_at
        type: datetime
        source: system
        description: logical-clock instant the event was recorded

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- branching decision fork with divergent side-effect sets ---------------
  - entity: CreditApplication
    state_field: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [DECLINED, VOIDED_BY_LOCK, ORIGINATED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /credit-applications/{id}/decision"
        actor: CreditUnderwriter
        preconditions:
          - "status == SUBMITTED"
          - "Customer.status != FINANCING_LOCKED"
          - "calculations.credit_decision resolves exposure_at_decision_cents <= credit_limit_cents"
        side_effects:
          - "sets credit_score_band, credit_limit_cents, exposure_at_decision_cents from calculations.credit_decision"
          - "sets approved_principal_cents = requested_principal_cents and conditional_down_payment_required_cents = 0"
          - "sets decision_reason = 'WITHIN_LIMIT', underwriter_user_id = X-User-ID, decided_at = logical clock"
          - "writes Customer.credit_score_band and Customer.credit_limit_cents from this decision"
      - from: SUBMITTED
        to: CONDITIONAL_APPROVED
        trigger: "POST /credit-applications/{id}/decision"
        actor: CreditUnderwriter
        preconditions:
          - "status == SUBMITTED"
          - "Customer.status != FINANCING_LOCKED"
          - "credit_limit_cents < exposure_at_decision_cents <= round_half_up(credit_limit_cents * CONDITIONAL_BAND_BPS / 10000)"
        side_effects:
          - "sets conditional_down_payment_required_cents = exposure_at_decision_cents - credit_limit_cents"
          - "sets approved_principal_cents = requested_principal_cents - conditional_down_payment_required_cents"
          - "sets decision_reason = 'CONDITIONAL_DOWN_PAYMENT_REQUIRED', underwriter_user_id = X-User-ID, decided_at = logical clock"
          - "writes Customer.credit_score_band and Customer.credit_limit_cents from this decision"
        note: "divergent branch: unlike APPROVED, origination now additionally enforces validations[priority=71]"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /credit-applications/{id}/decision"
        actor: CreditUnderwriter
        preconditions:
          - "status == SUBMITTED"
          - "exposure_at_decision_cents > round_half_up(credit_limit_cents * CONDITIONAL_BAND_BPS / 10000)"
        side_effects:
          - "sets approved_principal_cents = 0, conditional_down_payment_required_cents = 0"
          - "sets decision_reason = 'EXPOSURE_ABOVE_CONDITIONAL_BAND', underwriter_user_id = X-User-ID, decided_at = logical clock"
          - "writes Customer.credit_score_band and Customer.credit_limit_cents from this decision"
      - from: APPROVED
        to: ORIGINATED
        trigger: "POST /loans"
        actor: RetailAssociate
        preconditions:
          - "status == APPROVED"
          - "Customer.status != FINANCING_LOCKED"
          - "X-User-ID != underwriter_user_id (segregation of duties)"
          - "Customer.outstanding_principal_cents + resulting principal_cents <= Customer.credit_limit_cents"
        side_effects:
          - "creates the InstallmentLoan (see state_machines.InstallmentLoan initial transition)"
      - from: CONDITIONAL_APPROVED
        to: ORIGINATED
        trigger: "POST /loans"
        actor: RetailAssociate
        preconditions:
          - "status == CONDITIONAL_APPROVED"
          - "Customer.status != FINANCING_LOCKED"
          - "X-User-ID != underwriter_user_id (segregation of duties)"
          - "down_payment_cents >= conditional_down_payment_required_cents"
          - "Customer.outstanding_principal_cents + resulting principal_cents <= Customer.credit_limit_cents"
        side_effects:
          - "creates the InstallmentLoan with principal_cents = DeviceModel.retail_price_cents - down_payment_cents"
      - from: SUBMITTED
        to: VOIDED_BY_LOCK
        trigger: "system cascade: Customer.status becomes FINANCING_LOCKED"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets decision_reason = 'CUSTOMER_FINANCING_LOCKED'"
      - from: APPROVED
        to: VOIDED_BY_LOCK
        trigger: "system cascade: Customer.status becomes FINANCING_LOCKED"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "sets decision_reason = 'CUSTOMER_FINANCING_LOCKED'"
      - from: CONDITIONAL_APPROVED
        to: VOIDED_BY_LOCK
        trigger: "system cascade: Customer.status becomes FINANCING_LOCKED"
        actor: system
        preconditions:
          - "status == CONDITIONAL_APPROVED"
        side_effects:
          - "sets decision_reason = 'CUSTOMER_FINANCING_LOCKED'"

  # --- servicing dimension of the loan --------------------------------------
  - entity: InstallmentLoan
    state_field: status
    shape: branching
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, ROLLED_OVER]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /loans"
        actor: RetailAssociate
        preconditions:
          - "CreditApplication.status IN {APPROVED, CONDITIONAL_APPROVED}"
          - "imei is not already registered on any DeviceUnit"
        side_effects:
          - "sets origination_date = logical clock and upgrade_window_opens_at = origination_date + UPGRADE_MIN_LOAN_AGE_DAYS days"
          - "runs calculations.installment_schedule_generation and creates term_months Installment rows in status SCHEDULED"
          - "creates one DeviceUnit (activation_status UNACTIVATED, unlock_status LOCKED, possession_status WITH_CUSTOMER) with the supplied imei"
          - "moves CreditApplication to ORIGINATED"
          - "recomputes Customer.outstanding_principal_cents and Customer.open_loan_count"
          - "sets delinquency_state = CURRENT, days_past_due = 0, protection_coverage_status = ACTIVE"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /loans/{id}/cancellation"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == ACTIVE"
          - "PayoffQuote.status == ISSUED AND PayoffQuote.quote_type == EARLY_CANCELLATION"
          - "logical clock < PayoffQuote.expires_at"
          - "payment_amount_cents == PayoffQuote.total_payoff_cents"
        side_effects:
          - "sets closure_reason = PROGRAM_CANCELLATION"
          - "creates a PaymentPosting with posting_type PAYOFF for payment_amount_cents"
          - "sets paid_principal_cents = principal_cents and drives every Installment with status IN {SCHEDULED, PAST_DUE, PARTIALLY_PAID} to VOIDED"
          - "sets outstanding_late_fee_cents = 0 and protection_coverage_status = TERMINATED"
          - "moves PayoffQuote to CONSUMED and every other ISSUED quote on this loan to SUPERSEDED"
          - "cascade link 1: because the loan left ACTIVE, its DeviceUnit.unlock_status becomes UNLOCKED"
          - "cascade link 2: because the DeviceUnit became UNLOCKED, its CarrierAccount.activation_state becomes PORT_ELIGIBLE"
          - "recomputes Customer.outstanding_principal_cents and Customer.open_loan_count"
      - from: ACTIVE
        to: ROLLED_OVER
        trigger: "POST /upgrade-requests/{id}/completion"
        actor: RetailAssociate
        preconditions:
          - "status == ACTIVE"
          - "UpgradeRequest.status == TRADE_IN_GRADED AND UpgradeRequest.loan_id == this loan"
          - "PayoffQuote.quote_type == UPGRADE_ROLLOVER AND PayoffQuote.status == ISSUED AND logical clock < PayoffQuote.expires_at"
        side_effects:
          - "sets closure_reason = UPGRADE_ROLLOVER and paid_principal_cents = principal_cents"
          - "drives every Installment with status IN {SCHEDULED, PAST_DUE, PARTIALLY_PAID} to VOIDED"
          - "sets protection_coverage_status = TERMINATED, upgrade_hold_flag = false"
          - "cascade link 1: because this loan reached ROLLED_OVER, its DeviceUnit.possession_status becomes RETURNED and unlock_status becomes UNLOCKED"
          - "cascade link 2: because that DeviceUnit was released, its CarrierAccount is re-pointed to the newly minted DeviceUnit and CarrierAccount.activation_state resets to PENDING"
          - "creates the successor InstallmentLoan per calculations.rollover_and_new_loan_principal with predecessor_loan_id = this loan"
      - from: null
        to: ACTIVE
        trigger: "POST /upgrade-requests/{id}/completion (successor loan)"
        actor: RetailAssociate
        preconditions:
          - "predecessor loan reached ROLLED_OVER in the same request"
          - "net rollover balance satisfies validations[priority=75]"
        side_effects:
          - "sets rolled_over_balance_cents, origination_fee_cents and principal_cents per calculations.rollover_and_new_loan_principal"
          - "sets term_months = predecessor term_months, monthly_protection_premium_cents = target DeviceModel.monthly_protection_premium_cents"
          - "creates term_months Installment rows via calculations.installment_schedule_generation with origination_date = logical clock"
          - "creates a new DeviceUnit for the target model with the supplied target_imei and carrier_account_id inherited from the predecessor device"
          - "recomputes Customer.outstanding_principal_cents, Customer.open_loan_count, Customer.completed_upgrade_count, Customer.last_upgrade_completed_at"

  # --- collections dimension of the loan: cyclic, independent of status ------
  - entity: InstallmentLoan
    state_field: delinquency_state
    shape: cyclic
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: GRACE
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "1 <= days_past_due <= GRACE_PERIOD_DAYS"
        side_effects:
          - "writes days_past_due from calculations.delinquency_progression"
          - "appends a DelinquencyEvent(event_type GRACE_ENTERED, from_state CURRENT, to_state GRACE)"
      - from: GRACE
        to: DELINQUENT
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "DELINQUENT_MIN_DPD <= days_past_due < DEFAULT_MIN_DPD"
        side_effects:
          - "assesses LATE_FEE_CENTS on each Installment whose own days-past-due > GRACE_PERIOD_DAYS and late_fee_assessed == false"
          - "appends a DelinquencyEvent(event_type LATE_FEE_ASSESSED, amount_cents LATE_FEE_CENTS) per assessed installment"
          - "appends a DelinquencyEvent(event_type DELINQUENCY_ENTERED, from_state GRACE, to_state DELINQUENT)"
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "DELINQUENT_MIN_DPD <= days_past_due < DEFAULT_MIN_DPD"
        side_effects:
          - "same late-fee assessment and DELINQUENCY_ENTERED event as the GRACE -> DELINQUENT transition"
        note: "a loan that skipped a sweep during its grace window enters DELINQUENT directly"
      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "days_past_due >= DEFAULT_MIN_DPD"
        side_effects:
          - "sets protection_coverage_status = SUSPENDED"
          - "appends a DelinquencyEvent(event_type DEFAULT_DECLARED, from_state DELINQUENT, to_state DEFAULT)"
          - "cascade link 1: because this loan reached DEFAULT, Customer.status becomes FINANCING_LOCKED with financing_lock_reason DEFAULTED_LOAN, Customer.default_strike_count += 1, and a FINANCING_LOCK_APPLIED DelinquencyEvent is appended"
          - "cascade link 2: because the Customer became FINANCING_LOCKED, every CreditApplication of that customer with status IN {SUBMITTED, APPROVED, CONDITIONAL_APPROVED} moves to VOIDED_BY_LOCK"
          - "cascade link 3: because the Customer became FINANCING_LOCKED, every UpgradeRequest of that customer with status IN {ELIGIBILITY_PASSED, TRADE_IN_DECLARED, TRADE_IN_GRADED} moves to EXPIRED"
          - "cascade link 4: because those UpgradeRequests left their reserving states, DeviceModel.reserved_slot_count is recomputed downward for each target model and InstallmentLoan.upgrade_hold_flag is cleared on each upgraded-from loan"
          - "cascade link 5: because those UpgradeRequests expired, each of their TradeIn rows with status IN {DECLARED, RECEIVED, GRADED, DISPUTED} moves to CANCELLED and the referenced DeviceUnit.possession_status returns to WITH_CUSTOMER"
      - from: DEFAULT
        to: CURRENT
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "after allocation no Installment with status IN {PAST_DUE, PARTIALLY_PAID} has due_date <= logical clock"
        side_effects:
          - "sets days_past_due = 0 and protection_coverage_status = ACTIVE"
          - "appends a DelinquencyEvent(event_type CURED, from_state DEFAULT, to_state CURRENT)"
          - "cascade link 1: because this loan left DEFAULT, and the customer now has no loan with delinquency_state == DEFAULT, Customer.status returns to ACTIVE with financing_lock_reason null and a FINANCING_LOCK_RELEASED DelinquencyEvent is appended"
        note: "Customer.default_strike_count is never decremented by a cure"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "after allocation no Installment with status IN {PAST_DUE, PARTIALLY_PAID} has due_date <= logical clock"
        side_effects:
          - "sets days_past_due = 0"
          - "appends a DelinquencyEvent(event_type CURED, from_state DELINQUENT, to_state CURRENT)"
      - from: GRACE
        to: CURRENT
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "after allocation no Installment with status IN {PAST_DUE, PARTIALLY_PAID} has due_date <= logical clock"
        side_effects:
          - "sets days_past_due = 0"
          - "appends a DelinquencyEvent(event_type CURED, from_state GRACE, to_state CURRENT)"
      - from: CURRENT
        to: DEFAULT
        trigger: "POST /loans/{id}/payments (REVERSAL restoring an earlier arrears position)"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "status == ACTIVE"
          - "posting_type == REVERSAL"
          - "after the reversal days_past_due >= DEFAULT_MIN_DPD"
        side_effects:
          - "recomputes days_past_due, re-applies the DEFAULT side-effect set including the FINANCING_LOCKED cascade"
          - "appends a DelinquencyEvent(event_type DEFAULT_DECLARED, from_state CURRENT, to_state DEFAULT)"
        note: "compensating path of calculations.payment_waterfall_allocation; the cure cascade is undone with zero drift"

  # --- per-installment lifecycle --------------------------------------------
  - entity: Installment
    state_field: status
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: PARTIALLY_PAID
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "this installment is the lowest-sequence unsatisfied installment after the waterfall reached it"
          - "0 < allocated amount < amount_due_cents - paid_amount_cents"
        side_effects:
          - "increments paid_amount_cents, paid_principal_cents and paid_premium_cents pro rata per calculations.payment_waterfall_allocation"
      - from: SCHEDULED
        to: PAID
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "allocated amount closes paid_amount_cents == amount_due_cents and late_fee_paid_cents == assessed late fee"
        side_effects:
          - "sets paid_at = logical clock"
          - "increments InstallmentLoan.paid_installment_count, paid_principal_cents and paid_premium_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "cumulative allocation closes the remaining amount_due_cents and any assessed late fee"
        side_effects:
          - "sets paid_at = logical clock and increments InstallmentLoan.paid_installment_count"
      - from: SCHEDULED
        to: PAST_DUE
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "due_date <= logical clock"
          - "paid_amount_cents == 0"
        side_effects:
          - "when the installment's own days-past-due exceeds GRACE_PERIOD_DAYS, sets late_fee_assessed = true, late_fee_cents = LATE_FEE_CENTS and adds LATE_FEE_CENTS to InstallmentLoan.outstanding_late_fee_cents"
      - from: PARTIALLY_PAID
        to: PAST_DUE
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "due_date <= logical clock"
          - "0 < paid_amount_cents < amount_cents"
        side_effects:
          - "same conditional late-fee assessment as the SCHEDULED -> PAST_DUE transition"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "allocation closes late_fee_cents first, then amount_due_cents"
        side_effects:
          - "sets paid_at = logical clock, decrements InstallmentLoan.outstanding_late_fee_cents by late_fee_cents, increments InstallmentLoan.paid_installment_count"
      - from: PAST_DUE
        to: PARTIALLY_PAID
        trigger: "POST /loans/{id}/payments"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "allocation covers late_fee_cents and part of amount_due_cents but does not close it"
        side_effects:
          - "decrements InstallmentLoan.outstanding_late_fee_cents by late_fee_cents"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /loans/{id}/payments with posting_type REVERSAL"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "the reversed PaymentPosting had allocation against this installment"
          - "the reversal removes part but not all of paid_amount_cents"
        side_effects:
          - "decrements paid_amount_cents / paid_principal_cents / paid_premium_cents by the reversed allocation, clears paid_at, decrements InstallmentLoan.paid_installment_count"
      - from: PAID
        to: SCHEDULED
        trigger: "POST /loans/{id}/payments with posting_type REVERSAL"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "the reversal removes the entire allocation against this installment"
          - "due_date > logical clock"
        side_effects:
          - "zeroes paid_amount_cents / paid_principal_cents / paid_premium_cents, clears paid_at, decrements InstallmentLoan.paid_installment_count"
      - from: PAID
        to: PAST_DUE
        trigger: "POST /loans/{id}/payments with posting_type REVERSAL"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "the reversal removes the entire allocation against this installment"
          - "due_date <= logical clock"
        side_effects:
          - "zeroes the paid amounts, clears paid_at, decrements InstallmentLoan.paid_installment_count and recomputes InstallmentLoan.days_past_due"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /loans/{id}/cancellation or POST /upgrade-requests/{id}/completion"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "the parent loan is leaving ACTIVE for PAID_OFF or ROLLED_OVER"
        side_effects:
          - "sets void_reason = LOAN_CLOSED"
      - from: PAST_DUE
        to: VOIDED
        trigger: "POST /loans/{id}/cancellation or POST /upgrade-requests/{id}/completion"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "the parent loan is leaving ACTIVE for PAID_OFF or ROLLED_OVER"
        side_effects:
          - "sets void_reason = LOAN_CLOSED and folds late_fee_cents into the settled payoff total"
      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: "POST /loans/{id}/cancellation or POST /upgrade-requests/{id}/completion"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "the parent loan is leaving ACTIVE for PAID_OFF or ROLLED_OVER"
        side_effects:
          - "sets void_reason = LOAN_CLOSED"

  # --- device: three independent dimensions (parallel shape) ----------------
  - entity: DeviceUnit
    state_field: activation_status
    shape: parallel
    initial_state: UNACTIVATED
    terminal_states: []
    transitions:
      - from: UNACTIVATED
        to: ACTIVATED
        trigger: "POST /device-units/{id}/activation"
        actor: "RetailAssociate | ServiceTechnician"
        preconditions:
          - "possession_status == WITH_CUSTOMER"
          - "the referenced CarrierAccount belongs to InstallmentLoan.customer_id"
          - "CarrierAccount.activation_state IN {PENDING, PORT_ELIGIBLE}"
          - "CarrierAccount.port_freeze_flag == false"
        side_effects:
          - "sets carrier_account_id and activated_at = logical clock"
          - "cross-entity: CarrierAccount.activation_state becomes ACTIVATED and CarrierAccount.active_device_imei records this handset"
      - from: ACTIVATED
        to: DEACTIVATED
        trigger: "system cascade: this DeviceUnit.possession_status becomes RETURNED"
        actor: system
        preconditions:
          - "activation_status == ACTIVATED"
        side_effects:
          - "clears activated_at"
        note: "the activation dimension moves without any change to the unlock dimension, and vice versa"
  - entity: DeviceUnit
    state_field: unlock_status
    shape: parallel
    initial_state: LOCKED
    terminal_states: []
    transitions:
      - from: LOCKED
        to: UNLOCK_REQUESTED
        trigger: "POST /device-units/{id}/unlock-request"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "activation_status == ACTIVATED"
          - "InstallmentLoan.paid_installment_count >= UNLOCK_MIN_PAID_INSTALLMENTS (6)"
          - "InstallmentLoan.delinquency_state == CURRENT"
          - "logical clock >= activated_at + CarrierAccount.unlock_policy_days days"
        side_effects:
          - "sets unlock_requested_at = logical clock"
      - from: UNLOCK_REQUESTED
        to: UNLOCKED
        trigger: "POST /device-units/{id}/unlock-request (second call once the carrier acknowledgement window elapsed) or loan closure cascade"
        actor: "Customer | RetailAssociate | system"
        preconditions:
          - "unlock_status == UNLOCK_REQUESTED"
        side_effects:
          - "sets unlocked_at = logical clock"
          - "cross-entity: CarrierAccount.activation_state becomes PORT_ELIGIBLE"
      - from: LOCKED
        to: UNLOCKED
        trigger: "system cascade: the parent InstallmentLoan reached PAID_OFF or ROLLED_OVER"
        actor: system
        preconditions:
          - "unlock_status == LOCKED"
        side_effects:
          - "sets unlocked_at = logical clock and CarrierAccount.activation_state becomes PORT_ELIGIBLE"
  - entity: DeviceUnit
    state_field: possession_status
    shape: parallel
    initial_state: WITH_CUSTOMER
    terminal_states: []
    transitions:
      - from: WITH_CUSTOMER
        to: RETURN_PENDING
        trigger: "POST /upgrade-requests/{id}/trade-in-declaration"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "possession_status == WITH_CUSTOMER"
          - "this DeviceUnit.loan_id == UpgradeRequest.loan_id"
        side_effects:
          - "the created TradeIn enters status DECLARED"
      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /trade-ins/{id}/receipt"
        actor: ServiceTechnician
        preconditions:
          - "possession_status == RETURN_PENDING"
          - "TradeIn.status == DECLARED"
        side_effects:
          - "sets returned_at = logical clock"
          - "cross-entity: activation_status becomes DEACTIVATED"
      - from: RETURNED
        to: RETURN_FAILED
        trigger: "POST /trade-ins/{id}/diagnostic-reports or POST /trade-ins/{id}/regrade yielding diagnostic_result == FAIL"
        actor: ServiceTechnician
        preconditions:
          - "possession_status == RETURNED"
          - "the newest DiagnosticReport has water_damage_flag == true or functional_pass == false"
        side_effects:
          - "cascade link 1: Customer.credit_score_band is downgraded one notch along CREDIT_BAND_DOWNGRADE_LADDER (PRIME -> NEAR_PRIME -> SUBPRIME, SUBPRIME is the floor) and Customer.credit_limit_cents is rewritten to CREDIT_LIMITS of the new band"
          - "cascade link 2: when Customer.default_strike_count >= 1, Customer.status additionally becomes FINANCING_LOCKED with financing_lock_reason DEVICE_RETURN_DIAGNOSTIC_FAILURE"
          - "the trade-in still settles, at the DIAGNOSTIC_FAIL_CREDIT_BPS credit"
      - from: RETURN_FAILED
        to: RETURNED
        trigger: "POST /trade-ins/{id}/regrade yielding diagnostic_result == PASS"
        actor: ServiceTechnician
        preconditions:
          - "possession_status == RETURN_FAILED"
          - "the newest DiagnosticReport has water_damage_flag == false and functional_pass == true"
        side_effects:
          - "compensating: Customer.credit_score_band and Customer.credit_limit_cents are restored to the values held before the failed grading, and a FINANCING_LOCKED status applied by that grading is released"
      - from: RETURN_PENDING
        to: WITH_CUSTOMER
        trigger: "system cascade: the owning UpgradeRequest moved to EXPIRED or SUPERSEDED"
        actor: system
        preconditions:
          - "possession_status == RETURN_PENDING"
        side_effects:
          - "clears returned_at"
      - from: RETURNED
        to: WITH_CUSTOMER
        trigger: "system cascade: the owning UpgradeRequest moved to EXPIRED or SUPERSEDED after physical receipt"
        actor: system
        preconditions:
          - "possession_status == RETURNED"
          - "the parent InstallmentLoan.status == ACTIVE"
        side_effects:
          - "clears returned_at; the activation dimension stays DEACTIVATED and must be re-activated explicitly"

  # --- upgrade orchestration -------------------------------------------------
  - entity: UpgradeRequest
    state_field: status
    shape: branching
    initial_state: ELIGIBILITY_PASSED
    terminal_states: [COMPLETED, EXPIRED, SUPERSEDED]
    transitions:
      - from: null
        to: ELIGIBILITY_PASSED
        trigger: "POST /upgrade-requests"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "expected_loan_version matches InstallmentLoan.version (see §1.2.1)"
          - "InstallmentLoan.status == ACTIVE and delinquency_state == CURRENT"
          - "calculations.upgrade_eligibility_ratio yields eligibility_ratio_bps >= UPGRADE_PAID_RATIO_BPS and logical clock >= upgrade_window_opens_at"
          - "the loan's DeviceUnit has activation_status == ACTIVATED"
          - "target DeviceModel.active == true and its fulfillment-window capacity is not exhausted"
        side_effects:
          - "sets fulfillment_window_end = fulfillment_window_start + FULFILLMENT_WINDOW_DAYS days and eligibility_checked_at = logical clock"
          - "snapshots paid_installment_count_at_request and eligibility_ratio_bps from the loan"
          - "sets InstallmentLoan.upgrade_hold_flag = true and increments target DeviceModel.reserved_slot_count"
          - "any existing UpgradeRequest on the same loan in status IN {ELIGIBILITY_PASSED, TRADE_IN_DECLARED, TRADE_IN_GRADED} moves to SUPERSEDED, releasing its own reservation"
          - "increments InstallmentLoan.version"
      - from: ELIGIBILITY_PASSED
        to: TRADE_IN_DECLARED
        trigger: "POST /upgrade-requests/{id}/trade-in-declaration"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == ELIGIBILITY_PASSED"
          - "the declared DeviceUnit belongs to this request's loan and has possession_status == WITH_CUSTOMER"
        side_effects:
          - "creates a TradeIn in status DECLARED with credit_estimate_cents from calculations.trade_in_credit (variant declared_estimate)"
          - "sets DeviceUnit.possession_status = RETURN_PENDING"
      - from: TRADE_IN_DECLARED
        to: TRADE_IN_GRADED
        trigger: "POST /trade-ins/{id}/diagnostic-reports"
        actor: ServiceTechnician
        preconditions:
          - "status == TRADE_IN_DECLARED"
          - "TradeIn.status == RECEIVED"
        side_effects:
          - "moves the TradeIn to GRADED and writes credit_final_cents from calculations.trade_in_credit (variant final_graded)"
          - "sets diagnostic_result on the TradeIn to PASS or FAIL"
      - from: TRADE_IN_GRADED
        to: COMPLETED
        trigger: "POST /upgrade-requests/{id}/completion"
        actor: RetailAssociate
        preconditions:
          - "status == TRADE_IN_GRADED"
          - "the referenced PayoffQuote is ISSUED, of quote_type UPGRADE_ROLLOVER, on this request's loan, and not expired"
          - "TradeIn.status == GRADED and not DISPUTED"
          - "net rollover balance after trade-in credit and additional_down_payment_cents <= ROLLOVER_SHORTFALL_LIMIT_CENTS"
        side_effects:
          - "sets completed_at = logical clock, new_loan_id, payoff_quote_id and realized_rollover_cents"
          - "drives the predecessor InstallmentLoan to ROLLED_OVER and mints the successor loan, its installments and its DeviceUnit"
          - "decrements target DeviceModel.reserved_slot_count and clears InstallmentLoan.upgrade_hold_flag"
          - "moves the TradeIn to SETTLED and the PayoffQuote to CONSUMED"
      - from: ELIGIBILITY_PASSED
        to: EXPIRED
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "logical clock >= fulfillment_window_end"
        side_effects:
          - "sets expiry_reason = FULFILLMENT_WINDOW_ELAPSED"
          - "compensating: decrements target DeviceModel.reserved_slot_count and clears InstallmentLoan.upgrade_hold_flag, restoring the pre-request capacity position exactly"
      - from: TRADE_IN_DECLARED
        to: EXPIRED
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "logical clock >= fulfillment_window_end"
        side_effects:
          - "sets expiry_reason = FULFILLMENT_WINDOW_ELAPSED"
          - "compensating: releases the model reservation, clears the loan upgrade hold, moves the TradeIn to CANCELLED and returns the DeviceUnit to WITH_CUSTOMER"
      - from: TRADE_IN_GRADED
        to: EXPIRED
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "logical clock >= fulfillment_window_end"
        side_effects:
          - "sets expiry_reason = FULFILLMENT_WINDOW_ELAPSED and performs the same compensating release set"
      - from: ELIGIBILITY_PASSED
        to: EXPIRED
        trigger: "system cascade: Customer.status became FINANCING_LOCKED"
        actor: system
        preconditions:
          - "status == ELIGIBILITY_PASSED"
        side_effects:
          - "sets expiry_reason = CUSTOMER_FINANCING_LOCKED and performs the compensating release set"
      - from: TRADE_IN_DECLARED
        to: EXPIRED
        trigger: "system cascade: Customer.status became FINANCING_LOCKED"
        actor: system
        preconditions:
          - "status == TRADE_IN_DECLARED"
        side_effects:
          - "sets expiry_reason = CUSTOMER_FINANCING_LOCKED and performs the compensating release set"
      - from: TRADE_IN_GRADED
        to: EXPIRED
        trigger: "system cascade: Customer.status became FINANCING_LOCKED"
        actor: system
        preconditions:
          - "status == TRADE_IN_GRADED"
        side_effects:
          - "sets expiry_reason = CUSTOMER_FINANCING_LOCKED and performs the compensating release set"
      - from: ELIGIBILITY_PASSED
        to: SUPERSEDED
        trigger: "POST /upgrade-requests (a newer request on the same loan supersedes this one)"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == ELIGIBILITY_PASSED"
        side_effects:
          - "sets expiry_reason = SUPERSEDED_BY_NEW_REQUEST and performs the compensating release set"
      - from: TRADE_IN_DECLARED
        to: SUPERSEDED
        trigger: "POST /upgrade-requests (a newer request on the same loan supersedes this one)"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == TRADE_IN_DECLARED"
        side_effects:
          - "sets expiry_reason = SUPERSEDED_BY_NEW_REQUEST and performs the compensating release set"
      - from: TRADE_IN_GRADED
        to: SUPERSEDED
        trigger: "POST /upgrade-requests (a newer request on the same loan supersedes this one)"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == TRADE_IN_GRADED"
        side_effects:
          - "sets expiry_reason = SUPERSEDED_BY_NEW_REQUEST and performs the compensating release set"

  # --- trade-in grading with a dispute/regrade loop --------------------------
  - entity: TradeIn
    state_field: status
    shape: cyclic
    initial_state: DECLARED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DECLARED
        to: RECEIVED
        trigger: "POST /trade-ins/{id}/receipt"
        actor: ServiceTechnician
        preconditions:
          - "status == DECLARED"
          - "the owning UpgradeRequest.status == TRADE_IN_DECLARED"
        side_effects:
          - "sets received_at = logical clock and drives DeviceUnit.possession_status to RETURNED"
      - from: RECEIVED
        to: GRADED
        trigger: "POST /trade-ins/{id}/diagnostic-reports"
        actor: ServiceTechnician
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "sets graded_condition, graded_at, diagnostic_result and credit_final_cents from calculations.trade_in_credit"
          - "on diagnostic_result == FAIL, drives DeviceUnit.possession_status RETURNED -> RETURN_FAILED, which downgrades Customer.credit_score_band one notch and rewrites Customer.credit_limit_cents"
          - "sets credit_variance_cents = credit_final_cents - credit_estimate_cents"
          - "moves the owning UpgradeRequest to TRADE_IN_GRADED"
      - from: GRADED
        to: DISPUTED
        trigger: "POST /trade-ins/{id}/dispute"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == GRADED"
          - "dispute_count < 2"
        side_effects:
          - "increments dispute_count and sets dispute_reason"
      - from: DISPUTED
        to: GRADED
        trigger: "POST /trade-ins/{id}/regrade"
        actor: ServiceTechnician
        preconditions:
          - "status == DISPUTED"
          - "X-User-ID != technician_user_id of the latest DiagnosticReport (segregation of duties)"
        side_effects:
          - "appends a DiagnosticReport with override fields set and supersedes the prior report"
          - "recomputes graded_condition, diagnostic_result, credit_final_cents and credit_variance_cents"
        note: "the loop may run at most twice; the second regrade leaves dispute_count == 2 so no further dispute is admissible"
      - from: GRADED
        to: SETTLED
        trigger: "POST /upgrade-requests/{id}/completion"
        actor: RetailAssociate
        preconditions:
          - "status == GRADED"
        side_effects:
          - "sets settled_at = logical clock and freezes credit_final_cents into the successor loan's rollover computation"
      - from: DECLARED
        to: CANCELLED
        trigger: "system cascade: the owning UpgradeRequest left its reserving states"
        actor: system
        preconditions:
          - "status == DECLARED"
        side_effects:
          - "returns DeviceUnit.possession_status to WITH_CUSTOMER"
      - from: RECEIVED
        to: CANCELLED
        trigger: "system cascade: the owning UpgradeRequest left its reserving states"
        actor: system
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "returns DeviceUnit.possession_status to WITH_CUSTOMER"
      - from: GRADED
        to: CANCELLED
        trigger: "system cascade: the owning UpgradeRequest left its reserving states"
        actor: system
        preconditions:
          - "status == GRADED"
        side_effects:
          - "returns DeviceUnit.possession_status to WITH_CUSTOMER and zeroes the pending credit"
      - from: DISPUTED
        to: CANCELLED
        trigger: "system cascade: the owning UpgradeRequest left its reserving states"
        actor: system
        preconditions:
          - "status == DISPUTED"
        side_effects:
          - "returns DeviceUnit.possession_status to WITH_CUSTOMER and zeroes the pending credit"

  # --- payoff quote validity ------------------------------------------------
  - entity: PayoffQuote
    state_field: status
    shape: linear
    initial_state: ISSUED
    terminal_states: [CONSUMED, EXPIRED, SUPERSEDED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /loans/{id}/payoff-quotes"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "InstallmentLoan.status == ACTIVE"
          - "for quote_type UPGRADE_ROLLOVER: the loan has an UpgradeRequest in status IN {ELIGIBILITY_PASSED, TRADE_IN_DECLARED, TRADE_IN_GRADED}"
        side_effects:
          - "sets issued_at = logical clock and expires_at = issued_at + QUOTE_VALIDITY_DAYS days (validity is the half-open interval [issued_at, expires_at))"
          - "computes remaining_principal_cents, unearned_premium_cents, premium_rebate_cents, past_due_amount_cents, outstanding_late_fee_cents, admin_fee_cents and total_payoff_cents per calculations.payoff_quote"
          - "snapshots paid_installment_count_at_quote"
      - from: ISSUED
        to: CONSUMED
        trigger: "POST /loans/{id}/cancellation or POST /upgrade-requests/{id}/completion"
        actor: "Customer | RetailAssociate"
        preconditions:
          - "status == ISSUED and logical clock < expires_at"
          - "quote_type matches the consuming operation"
        side_effects:
          - "sets consumed_at = logical clock"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /servicing/daily-run"
        actor: "CollectionsOfficer | ProgramAdmin"
        preconditions:
          - "logical clock >= expires_at"
        side_effects:
          - "no financial effect; the loan is untouched"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /loans/{id}/payoff-quotes (a newer quote of the same quote_type on the same loan) or the loan reaching a terminal status"
        actor: "Customer | RetailAssociate | CollectionsOfficer"
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "only one ISSUED quote of a given quote_type may occupy a loan at a time"

  # --- customer financing lock ----------------------------------------------
  - entity: Customer
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FINANCING_LOCKED
        trigger: "system cascade: one of the customer's loans reached delinquency_state DEFAULT"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets financing_lock_reason = DEFAULTED_LOAN, financing_locked_at = logical clock, default_strike_count += 1"
          - "voids the customer's non-terminal CreditApplications and expires their non-terminal UpgradeRequests (see the DEFAULT cascade)"
      - from: ACTIVE
        to: FINANCING_LOCKED
        trigger: "system cascade: a trade-in diagnostic returned FAIL on a customer whose default_strike_count >= 1"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "default_strike_count >= 1"
        side_effects:
          - "sets financing_lock_reason = DEVICE_RETURN_DIAGNOSTIC_FAILURE and financing_locked_at = logical clock"
        note: "a first-strike diagnostic failure only downgrades the credit band; it does not lock financing"
      - from: FINANCING_LOCKED
        to: ACTIVE
        trigger: "POST /loans/{id}/payments curing the last DEFAULT loan"
        actor: "Customer | CollectionsOfficer"
        preconditions:
          - "no loan of this customer has delinquency_state == DEFAULT after the payment"
          - "financing_lock_reason == DEFAULTED_LOAN"
        side_effects:
          - "clears financing_lock_reason and financing_locked_at; default_strike_count is preserved"

  # --- carrier account ------------------------------------------------------
  - entity: CarrierAccount
    state_field: activation_state
    shape: cyclic
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVATED
        trigger: "POST /device-units/{id}/activation"
        actor: "RetailAssociate | ServiceTechnician"
        preconditions:
          - "activation_state == PENDING"
          - "port_freeze_flag == false"
        side_effects:
          - "sets active_device_imei to the activated handset's imei"
      - from: ACTIVATED
        to: PORT_ELIGIBLE
        trigger: "system cascade: the linked DeviceUnit became UNLOCKED"
        actor: system
        preconditions:
          - "activation_state == ACTIVATED"
        side_effects:
          - "the account may now be activated onto a different DeviceUnit"
      - from: PORT_ELIGIBLE
        to: ACTIVATED
        trigger: "POST /device-units/{id}/activation on a different DeviceUnit"
        actor: "RetailAssociate | ServiceTechnician"
        preconditions:
          - "activation_state == PORT_ELIGIBLE and port_freeze_flag == false"
        side_effects:
          - "re-points active_device_imei"
      - from: ACTIVATED
        to: PENDING
        trigger: "system cascade: the linked DeviceUnit was released by an upgrade completion"
        actor: system
        preconditions:
          - "activation_state IN {ACTIVATED, PORT_ELIGIBLE}"
        side_effects:
          - "re-points active_device_imei at the successor loan's newly minted DeviceUnit and requires an explicit activation call before service resumes"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: upgrade-request-create-stale-loan
    parent_entity: InstallmentLoan
    write_endpoint: "POST /upgrade-requests"
    occ_field: "expected_loan_version"
    description: |
      Creating an UpgradeRequest against an InstallmentLoan whose version has advanced since
      the client last observed it is rejected. Request creation both reads the loan's payment
      position (paid_installment_count, eligibility_ratio_bps, delinquency_state, upgrade_window_opens_at)
      and writes to the loan (upgrade_hold_flag, version), and a new request legitimately
      supersedes any earlier non-terminal request on the same loan. Because superseding is a
      valid outcome, no state precondition can reject a writer whose eligibility decision was
      taken against a payment position that has since moved (a posting, a reversal, a servicing
      sweep, or an earlier superseding request); only the stale-version check can. The client
      must re-read the loan and re-decide.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    version_increment_writes:
      - "POST /loans (mints the loan at version 1)"
      - "POST /loans/{id}/payments (any posting_type, including REVERSAL)"
      - "POST /loans/{id}/payoff-quotes"
      - "POST /upgrade-requests (sets upgrade_hold_flag; increments InstallmentLoan.version by 1)"
      - "POST /upgrade-requests/{id}/completion (drives the loan to ROLLED_OVER)"
      - "POST /loans/{id}/cancellation (drives the loan to PAID_OFF)"
      - "POST /servicing/daily-run (for every loan whose delinquency_state, days_past_due or outstanding_late_fee_cents changed)"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_decision
    trigger: "POST /credit-applications/{id}/decision"
    algorithm: threshold
    formula: |
      credit_limit_cents      = CREDIT_LIMITS[credit_score_band]
      exposure_at_decision    = Customer.outstanding_principal_cents + application.requested_principal_cents
      conditional_ceiling     = round_half_up(credit_limit_cents * CONDITIONAL_BAND_BPS / 10000)

      if exposure_at_decision <= credit_limit_cents:
          status = APPROVED
          conditional_down_payment_required_cents = 0
          approved_principal_cents = application.requested_principal_cents
          decision_reason = "WITHIN_LIMIT"
      elif exposure_at_decision <= conditional_ceiling:
          status = CONDITIONAL_APPROVED
          conditional_down_payment_required_cents = exposure_at_decision - credit_limit_cents
          approved_principal_cents = application.requested_principal_cents
                                     - conditional_down_payment_required_cents
          decision_reason = "CONDITIONAL_DOWN_PAYMENT_REQUIRED"
      else:
          status = DECLINED
          conditional_down_payment_required_cents = 0
          approved_principal_cents = 0
          decision_reason = "EXPOSURE_ABOVE_CONDITIONAL_BAND"
      # requested_principal_cents was fixed at submission as
      #   DeviceModel.retail_price_cents - declared_down_payment_cents
    input_set: >-
      Customer.outstanding_principal_cents is the sum of (principal_cents - paid_principal_cents)
      over that customer's InstallmentLoan rows with status == ACTIVE only; loans in PAID_OFF or
      ROLLED_OVER contribute nothing.
    constants:
      CREDIT_LIMITS: { PRIME: 250000, NEAR_PRIME: 150000, SUBPRIME: 80000 }
      CONDITIONAL_BAND_BPS: 12500
    precision: "integer cents; round_half_up on the conditional ceiling"

  - name: installment_schedule_generation
    trigger: "POST /loans and the successor-loan leg of POST /upgrade-requests/{id}/completion"
    algorithm: waterfall_allocation
    formula: |
      base_principal_cents = round_half_up(loan.principal_cents / loan.term_months)
      premium_cents        = loan.monthly_protection_premium_cents      # flat, every installment

      for k in 1 .. term_months:
          if k < term_months:
              principal_component_cents = base_principal_cents
          else:
              # residual: the last installment absorbs the whole rounding remainder,
              # so sum(principal_component) == principal_cents exactly
              principal_component_cents = loan.principal_cents
                                          - base_principal_cents * (term_months - 1)
          premium_component_cents = premium_cents
          amount_due_cents        = principal_component_cents + premium_component_cents
          due_date                = loan.origination_date + k months   # same day-of-month
          status                  = SCHEDULED

      loan.monthly_installment_cents = base_principal_cents + premium_cents
      loan.premium_total_cents   = premium_cents * term_months
      loan.obligation_balance_cents = loan.principal_cents + loan.premium_total_cents
    input_set: >-
      All term_months installments are created in one shot at origination. installment_number runs
      1..term_months; the residual is never spread across installments and never lands on
      installment 1.
    constants:
      DEFAULT_TERM_MONTHS: 24
    precision: >-
      integer cents, round_half_up on base_principal_cents only. The premium is never
      rounded (it is a per-month constant). The residual makes the schedule sum exact: the
      last installment's principal component may be smaller OR larger than base_principal_cents.

  - name: payment_waterfall_allocation
    trigger: "POST /loans/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      # ---- REVERSAL -----------------------------------------------------------
      if posting_type == REVERSAL:
          target = PaymentPosting[reverses_posting_id]
          for each allocation the target made, in descending installment installment_number:
              subtract the allocated late_fee / principal / premium amounts from that installment
              recompute that installment.status per state_machines.Installment
          amount_cents must equal target.amount_cents; allocated_late_fee_cents,
          allocated_principal_cents and allocated_premium_cents mirror the amounts removed,
          while installments_satisfied_count = 0 and overpayment_cents = 0 (a reversal
          satisfies nothing)
          recompute loan.paid_principal_cents, loan.paid_premium_cents,
                    loan.paid_installment_count, loan.outstanding_late_fee_cents,
                    loan.days_past_due, loan.delinquency_state
          # invariant: the loan's post-reversal ledger equals its pre-target-posting ledger
          #            exactly, with zero drift in any cents field

      # ---- PAYMENT / PAYOFF ---------------------------------------------------
      remaining = amount_cents
      bucket_1 = installments with status == PAST_DUE and late_fee_assessed == true,
                 ordered by installment_number ascending          # assessed late fees first
      bucket_2 = installments with status IN {PAST_DUE, PARTIALLY_PAID},
                 ordered by installment_number ascending          # arrears next
      bucket_3 = installments with status IN {SCHEDULED, PARTIALLY_PAID},
                 ordered by installment_number ascending          # then future installments
      for bucket in [bucket_1, bucket_2, bucket_3]:
          for inst in bucket:
              if remaining == 0: break
              need  = (inst.late_fee_cents - inst.late_fee_paid_cents) if bucket is bucket_1
                      else (inst.amount_due_cents - inst.paid_amount_cents)
              taken = min(remaining, need)
              if bucket is bucket_1:
                  inst.late_fee_paid_cents += taken
                  loan.outstanding_late_fee_cents -= taken
              else:
                  # split the taken amount between principal and premium in the same
                  # proportion the installment itself carries
                  p = round_half_up(taken * inst.principal_component_cents / inst.amount_due_cents)
                  inst.paid_principal_cents += p
                  inst.paid_premium_cents   += taken - p
                  inst.paid_amount_cents    += taken
              remaining -= taken
      overpayment_cents = remaining        # recorded on the posting, never auto-refunded
    input_set: >-
      Only Installment rows of this loan with status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE}
      participate. VOIDED and PAID installments are excluded from every bucket. An installment
      may appear in bucket_1 and bucket_2 in the same pass (fee before body).
    constants:
      LATE_FEE_CENTS: 500
    precision: >-
      integer cents, round_half_up on the principal share of a partial allocation; the premium
      share is the arithmetic complement, so principal + premium == taken exactly.

  - name: delinquency_progression
    trigger: "POST /servicing/daily-run; recomputed after every POST /loans/{id}/payments"
    algorithm: threshold
    formula: |
      unsatisfied = installments of this loan with status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE}
                    and due_date <= current_utc
      days_past_due = 0 if unsatisfied is empty
                      else max(date(current_utc) - date(inst.due_date) in whole days)

      if loan.status != ACTIVE:                 next_state = unchanged
      elif days_past_due == 0:                  next_state = CURRENT
      elif days_past_due <= GRACE_PERIOD_DAYS:  next_state = GRACE
      elif days_past_due < DEFAULT_MIN_DPD:     next_state = DELINQUENT
      else:                                     next_state = DEFAULT

      # per-installment late fee, assessed independently of the loan-level state label
      for inst in unsatisfied:
          inst_dpd = date(current_utc) - date(inst.due_date)
          if inst_dpd > GRACE_PERIOD_DAYS and inst.late_fee_assessed == false:
              inst.late_fee_assessed = true
              inst.late_fee_cents    = LATE_FEE_CENTS
              loan.outstanding_late_fee_cents += LATE_FEE_CENTS
      # DELINQUENT_MIN_DPD == GRACE_PERIOD_DAYS + 1: a fee is assessed at dpd 11, never at dpd 10
    input_set: >-
      Only loans with status == ACTIVE are swept. Installments with status IN {PAID, VOIDED}
      never contribute to days_past_due and never attract a fee. A fee is assessed at most once
      per installment, and is not re-assessed after a reversal re-opens the installment.
    constants:
      GRACE_PERIOD_DAYS: 10
      DELINQUENT_MIN_DPD: 11
      DEFAULT_MIN_DPD: 90
      LATE_FEE_CENTS: 500
    precision: "whole calendar days, UTC date difference; no partial-day rounding"

  - name: unearned_premium_rebate
    trigger: "POST /loans/{id}/payoff-quotes (invoked by calculations.payoff_quote)"
    algorithm: decay_function
    formula: |
      n = loan.term_months
      r = n - loan.paid_installment_count        # unexpired months of protection coverage
      premium_total = loan.monthly_protection_premium_cents * n
      # base (variant-free) shape:
      unearned_premium_cents = <per variant>
      premium_rebate_cents   = <per variant>
    input_set: >-
      paid_installment_count counts only Installment rows with status == PAID; a PARTIALLY_PAID
      installment does not shorten the unexpired coverage term.
    constants:
      PRORATA_REBATE_BPS: 9000
    precision: "integer cents, round_half_up"
    variants:
      - name: rule_of_78
        when: "the rebate feeds a payoff quote of quote_type == UPGRADE_ROLLOVER"
        difference: |
          unearned_premium_cents = round_half_up(premium_total * (r * (r + 1)) / (n * (n + 1)))
          premium_rebate_cents   = unearned_premium_cents          # credited in full, no factor
          Front-loads the earned premium, so the rebate decays faster than elapsed time. At
          n = 24 and r = 12 the factor is 156/600 = 0.26, not 0.50.
      - name: pro_rata
        when: "the rebate feeds a payoff quote of quote_type == EARLY_CANCELLATION"
        difference: |
          unearned_premium_cents = premium_total - loan.paid_premium_cents
          premium_rebate_cents   = round_half_up(unearned_premium_cents * PRORATA_REBATE_BPS / 10000)
          Straight-line unexpired premium, then a 10% cancellation retention haircut. At
          n = 24 and 12 paid installments this returns a strictly larger rebate than
          rule_of_78 on identical loan data (10789 vs 6234 on the reference fixture).

  - name: payoff_quote
    trigger: "POST /loans/{id}/payoff-quotes"
    algorithm: aggregation
    formula: |
      remaining_principal_cents  = loan.principal_cents - loan.paid_principal_cents
      outstanding_late_fee_cents = loan.outstanding_late_fee_cents
      past_due_amount_cents      = sum(inst.amount_due_cents - inst.paid_amount_cents)
                                   over installments with status IN {PAST_DUE, PARTIALLY_PAID}
                                   and due_date <= current_utc          # disclosure figure
      paid_installment_count_at_quote = loan.paid_installment_count
      (unearned_premium_cents, premium_rebate_cents) = calculations.unearned_premium_rebate
                                                       with the variant selected below
      admin_fee_cents            = <per variant>
      total_payoff_cents         = remaining_principal_cents
                                   + outstanding_late_fee_cents
                                   + admin_fee_cents
                                   - premium_rebate_cents
      issued_at  = current_utc
      expires_at = issued_at + QUOTE_VALIDITY_DAYS days     # validity is [issued_at, expires_at)
    input_set: >-
      Only the loan's own installments participate. past_due_amount_cents is a disclosure figure
      and is NOT added to total_payoff_cents — the arrears body is already inside
      remaining_principal_cents; only the late fee sits outside it.
    constants:
      CANCELLATION_ADMIN_FEE_CENTS: 2500
      QUOTE_VALIDITY_DAYS: 7
    precision: "integer cents; the only rounding happens inside unearned_premium_rebate"
    variants:
      - name: upgrade_rollover
        when: "quote_type == UPGRADE_ROLLOVER (the loan is being retired by an upgrade)"
        difference: |
          admin_fee_cents = 0 and the rebate uses unearned_premium_rebate.rule_of_78.
          Requires a live UpgradeRequest on the loan.
      - name: early_cancellation
        when: "quote_type == EARLY_CANCELLATION (the customer leaves the program outright)"
        difference: |
          admin_fee_cents = CANCELLATION_ADMIN_FEE_CENTS and the rebate uses
          unearned_premium_rebate.pro_rata. On identical loan data this variant produces a
          total_payoff_cents that differs from upgrade_rollover by
          (CANCELLATION_ADMIN_FEE_CENTS - (pro_rata_rebate - rule_of_78_rebate)); on the
          reference fixture 36659 vs 38714.

  - name: trade_in_credit
    trigger: >-
      POST /upgrade-requests/{id}/trade-in-declaration (declared variant);
      POST /trade-ins/{id}/diagnostic-reports and POST /trade-ins/{id}/regrade (graded variant)
    algorithm: tiered_pricing
    formula: |
      base = DeviceModel.trade_in_base_credit_cents of the traded DeviceUnit's model

      # --- grade resolution (graded variant only) ---------------------------
      screen_implied_grade  = { PRISTINE: EXCELLENT, SCRATCHED: GOOD, CRACKED: FAIR }[screen_grade]
      battery_implied_grade = EXCELLENT if battery_health_pct >= 80
                              else GOOD if battery_health_pct >= 60
                              else FAIR
      graded_condition = min_by_severity(screen_implied_grade, battery_implied_grade)
                               # severity order EXCELLENT > GOOD > FAIR > POOR; the WORSE wins

      credit = max(TRADE_IN_CREDIT_FLOOR_CENTS,
                   round_half_up(base * CONDITION_MULTIPLIERS_BPS[grade] / 10000)
                   - SCREEN_DEDUCTION[screen_grade]
                   - battery_deduction(battery_health_pct))
    input_set: >-
      The graded variant reads only the newest non-superseded DiagnosticReport of the TradeIn;
      superseded reports are ignored entirely. The declared variant reads no DiagnosticReport at
      all.
    constants:
      CONDITION_MULTIPLIERS_BPS: { EXCELLENT: 10000, GOOD: 8500, FAIR: 6000, POOR: 3000 }
      MAX_TRADE_IN_DISPUTES: 2
      CREDIT_BAND_DOWNGRADE_LADDER: { PRIME: NEAR_PRIME, NEAR_PRIME: SUBPRIME, SUBPRIME: SUBPRIME }
      SCREEN_DEDUCTION: { PRISTINE: 0, SCRATCHED: 2500, CRACKED: 9500 }
      BATTERY_DEDUCTION: { at_or_above_80: 0, from_60_to_79: 4000, below_60: 8000 }
      DIAGNOSTIC_FAIL_CREDIT_BPS: 1000
      TRADE_IN_CREDIT_FLOOR_CENTS: 0
    precision: >-
      integer cents, round_half_up applied to the multiplier product BEFORE the deductions are
      subtracted, and the floor applied after. Deductions are never scaled by the multiplier.
    variants:
      - name: declared_estimate
        when: "the customer declares a condition at POST /upgrade-requests/{id}/trade-in-declaration"
        difference: |
          credit_estimate_cents = round_half_up(base
                                             * CONDITION_MULTIPLIERS_BPS[declared_condition] / 10000)
          No screen deduction, no battery deduction, no floor clamp, no diagnostic outcome —
          the multiplier alone. Non-binding: it never enters a payoff or rollover computation.
      - name: final_graded
        when: >-
          a DiagnosticReport exists (POST /trade-ins/{id}/diagnostic-reports, or the newest
          report after POST /trade-ins/{id}/regrade)
        difference: |
          diagnostic_result = FAIL if (water_damage_flag == true or functional_pass == false)
                               else PASS
          if diagnostic_result == FAIL:
              graded_condition = POOR
              credit_final_cents     = round_half_up(base * DIAGNOSTIC_FAIL_CREDIT_BPS / 10000)
              # short-circuit: the screen and battery deductions are NOT applied on FAIL
          else:
              graded_condition = min_by_severity(screen_implied, battery_implied)
              credit_final_cents     = the full max/min expression above
          credit_variance_cents = credit_final_cents - credit_estimate_cents
          The declared condition is ignored: an EXCELLENT declaration cannot raise a
          CRACKED-screen device above FAIR.

  - name: rollover_and_new_loan_principal
    trigger: "POST /upgrade-requests/{id}/completion"
    algorithm: tiered_pricing
    formula: |
      payoff = the referenced PayoffQuote (quote_type == UPGRADE_ROLLOVER, status == ISSUED)
      credit = TradeIn.credit_final_cents

      gross_rollover_cents = max(0, payoff.total_payoff_cents - credit)
      excess_credit_cents  = max(0, credit - payoff.total_payoff_cents)
      net_rollover_cents   = max(0, gross_rollover_cents - additional_down_payment_cents)

      pre_fee_base_cents   = target_model.retail_price_cents
                             + net_rollover_cents
                             - excess_credit_cents
      origination_fee_cents = 0    if pre_fee_base_cents <  ORIGINATION_FEE_TIER_1_MAX
                              1500 if pre_fee_base_cents <  ORIGINATION_FEE_TIER_2_MAX
                              2500 otherwise
      new_loan.principal_cents        = pre_fee_base_cents + origination_fee_cents
      new_loan.rolled_over_balance_cents = net_rollover_cents
      new_loan.term_months            = predecessor.term_months
      new_loan.monthly_protection_premium_cents = target_model.monthly_protection_premium_cents
      then calculations.installment_schedule_generation over new_loan
    input_set: >-
      Exactly one TradeIn (status GRADED) and one PayoffQuote (status ISSUED, unexpired) of the
      upgrade request participate. A superseded or expired quote is never used.
    constants:
      ORIGINATION_FEE_TIER_1_MAX: 60000
      ORIGINATION_FEE_TIER_2_MAX: 100000
      ORIGINATION_FEE_TIER_1_CENTS: 0
      ORIGINATION_FEE_TIER_2_CENTS: 1500
      ORIGINATION_FEE_TIER_3_CENTS: 2500
      ROLLOVER_SHORTFALL_LIMIT_CENTS: 30000
    precision: >-
      integer cents. The tier is keyed on pre_fee_base_cents — the amount BEFORE the fee is
      added — never on the resulting principal_cents. A pre_fee_base_cents of 99900 sits in
      tier 2 (fee 1500) even though the resulting principal_cents of 101400 would look like
      tier 3.

  - name: upgrade_eligibility_ratio
    trigger: "POST /upgrade-requests"
    algorithm: threshold
    formula: |
      eligibility_ratio_bps = floor(loan.paid_installment_count * 10000 / loan.term_months)
      eligible   = (eligibility_ratio_bps >= UPGRADE_PAID_RATIO_BPS)
                   and (current_utc >= loan.upgrade_window_opens_at)
                   and (loan.status == ACTIVE)
                   and (loan.delinquency_state == CURRENT)
      loan.upgrade_window_opens_at = loan.origination_date + UPGRADE_MIN_LOAN_AGE_DAYS days
    input_set: >-
      paid_installment_count counts only Installment rows with status == PAID. A PARTIALLY_PAID
      installment contributes nothing, however close to full it is; late fees and overpayments
      are irrelevant to the ratio.
    constants:
      UPGRADE_PAID_RATIO_BPS: 5000
      UPGRADE_MIN_LOAN_AGE_DAYS: 330
      UNLOCK_MIN_PAID_INSTALLMENTS: 6
    precision: >-
      integer basis points, floor division, compared with >=. At term_months 24 the threshold
      is met by exactly 12 PAID installments (5000 bps) and missed by 11 (4583 bps).

  - name: model_reservation_capacity
    trigger: "POST /upgrade-requests"
    algorithm: interval_merge
    formula: |
      candidate = [fulfillment_window_start,
                   fulfillment_window_start + FULFILLMENT_WINDOW_DAYS days)   # half-open
      live = UpgradeRequest rows with target_device_model_id == this model and
             status IN {ELIGIBILITY_PASSED, TRADE_IN_DECLARED, TRADE_IN_GRADED},
             excluding any request on this same loan that this call supersedes
      overlap_count = count(x in live where
                            candidate.start < x.fulfillment_window_end and
                            x.fulfillment_window_start < candidate.end)
      reject when overlap_count >= target_model.concurrent_reservation_capacity
      on success: target_model.reserved_slot_count += 1
      on any release (COMPLETED / EXPIRED / SUPERSEDED): reserved_slot_count -= 1
    input_set: >-
      Only non-terminal UpgradeRequest rows on the same target DeviceModel occupy capacity;
      COMPLETED, EXPIRED and SUPERSEDED requests free their slot immediately. Windows that merely
      touch (one's end equals the other's start) do NOT overlap.
    constants:
      FULFILLMENT_WINDOW_DAYS: 7
    precision: >-
      half-open interval arithmetic on whole UTC days. reserved_slot_count is an exact integer
      equal to the number of live (ELIGIBILITY_PASSED / TRADE_IN_DECLARED / TRADE_IN_GRADED)
      reservations on the model, NOT the overlap population of any one candidate window: two
      live requests whose windows merely touch leave reserved_slot_count at 2 while every
      candidate's overlap_count is still 1.

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:
  # ---- 1. authentication ---------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- 2. authorization ----------------------------------------------------
  - priority: 5
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 6
    category: auth
    check: >-
      when X-User-Role == Customer, X-User-ID equals the Customer.id that owns the addressed
      resource (the loan's customer_id, the device unit's loan.customer_id, the upgrade
      request's customer_id, the carrier account's customer_id)
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: >-
      GET /customers/{id}, GET /customers/{id}/carrier-accounts, POST /customers/{id}/carrier-accounts,
      POST /credit-applications, GET /credit-applications/{id}, GET /loans/{id},
      GET /loans/{id}/installments, GET /loans/{id}/delinquency-events, GET /loans/{id}/payoff-quotes,
      POST /loans/{id}/payments, POST /loans/{id}/payoff-quotes,
      POST /loans/{id}/cancellation, GET /payment-postings/{id}, GET /device-units/{id},
      POST /device-units/{id}/unlock-request, POST /upgrade-requests, GET /upgrade-requests/{id},
      POST /upgrade-requests/{id}/trade-in-declaration, GET /trade-ins/{id},
      GET /trade-ins/{id}/diagnostic-reports, POST /trade-ins/{id}/dispute

  # ---- 3. request shape ----------------------------------------------------
  - priority: 10
    category: existence
    check: >-
      every field marked required in the endpoint's input: is present; enum fields carry a
      declared member; integer cent fields are integers >= 0; ISO-8601 fields parse; UUID
      fields are well-formed
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 11
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list endpoints"

  # ---- 4. existence, path segments left-to-right then body FKs -------------
  - priority: 20
    category: existence
    check: "the {id} in /customers/{id} resolves to a Customer"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "GET /customers/{id}, GET /customers/{id}/carrier-accounts, POST /customers/{id}/carrier-accounts"
  - priority: 21
    category: existence
    check: "the {id} in /device-models/{id} resolves to a DeviceModel"
    error_id: ERR_DEVICE_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /device-models/{id}"
  - priority: 22
    category: existence
    check: "the {id} in /credit-applications/{id} resolves to a CreditApplication"
    error_id: ERR_CREDIT_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /credit-applications/{id}, POST /credit-applications/{id}/decision"
  - priority: 23
    category: existence
    check: "the {id} in /loans/{id} resolves to an InstallmentLoan"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /loans/{id}, GET /loans/{id}/installments, GET /loans/{id}/delinquency-events, GET /loans/{id}/payoff-quotes, POST /loans/{id}/payments, POST /loans/{id}/payoff-quotes, POST /loans/{id}/cancellation"
  - priority: 24
    category: existence
    check: "the {id} in /device-units/{id} resolves to a DeviceUnit"
    error_id: ERR_DEVICE_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /device-units/{id}, POST /device-units/{id}/activation, POST /device-units/{id}/unlock-request"
  - priority: 25
    category: existence
    check: "the {id} in /upgrade-requests/{id} resolves to an UpgradeRequest"
    error_id: ERR_UPGRADE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /upgrade-requests/{id}, POST /upgrade-requests/{id}/trade-in-declaration, POST /upgrade-requests/{id}/completion"
  - priority: 26
    category: existence
    check: "the {id} in /trade-ins/{id} resolves to a TradeIn"
    error_id: ERR_TRADE_IN_NOT_FOUND
    http_status: 404
    applies_to: "GET /trade-ins/{id}, GET /trade-ins/{id}/diagnostic-reports, POST /trade-ins/{id}/receipt, POST /trade-ins/{id}/diagnostic-reports, POST /trade-ins/{id}/dispute, POST /trade-ins/{id}/regrade"
  - priority: 27
    category: existence
    check: "the {id} in /payment-postings/{id} resolves to a PaymentPosting"
    error_id: ERR_PAYMENT_POSTING_NOT_FOUND
    http_status: 404
    applies_to: "GET /payment-postings/{id}"
  - priority: 30
    category: business_referential
    check: "body customer_id resolves to a Customer"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "POST /credit-applications"
  - priority: 31
    category: business_referential
    check: "body device_model_id / target_device_model_id resolves to a DeviceModel"
    error_id: ERR_DEVICE_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /credit-applications, POST /upgrade-requests"
  - priority: 32
    category: business_referential
    check: "body credit_application_id resolves to a CreditApplication"
    error_id: ERR_CREDIT_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /loans"
  - priority: 33
    category: business_referential
    check: "body loan_id resolves to an InstallmentLoan"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /upgrade-requests"
  - priority: 34
    category: business_referential
    check: "body carrier_account_id resolves to a CarrierAccount"
    error_id: ERR_CARRIER_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "POST /device-units/{id}/activation"
  - priority: 35
    category: business_referential
    check: "body device_unit_id resolves to a DeviceUnit"
    error_id: ERR_DEVICE_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /upgrade-requests/{id}/trade-in-declaration"
  - priority: 36
    category: business_referential
    check: "body payoff_quote_id resolves to a PayoffQuote"
    error_id: ERR_PAYOFF_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "POST /loans/{id}/cancellation, POST /upgrade-requests/{id}/completion"
  - priority: 37
    category: business_referential
    check: "body reverses_posting_id, when supplied, resolves to a PaymentPosting of this loan"
    error_id: ERR_PAYMENT_POSTING_NOT_FOUND
    http_status: 404
    applies_to: "POST /loans/{id}/payments"

  # ---- 5. cross-reference integrity (flat topology) -----------------------
  - priority: 40
    category: business_referential
    check: >-
      the referenced resource belongs to the same Customer / loan as the addressed resource:
      the CarrierAccount belongs to the loan's customer, the PayoffQuote belongs to the
      addressed loan, the declared DeviceUnit belongs to the upgrade request's loan, and the
      reversed PaymentPosting belongs to the addressed loan
    error_id: ERR_CROSS_REFERENCE_MISMATCH
    http_status: 409
    applies_to: "POST /device-units/{id}/activation, POST /loans/{id}/cancellation, POST /upgrade-requests/{id}/trade-in-declaration, POST /upgrade-requests/{id}/completion, POST /loans/{id}/payments"
  - priority: 41
    category: business_referential
    check: "the PayoffQuote's quote_type matches the consuming operation (EARLY_CANCELLATION for cancellation, UPGRADE_ROLLOVER for upgrade completion)"
    error_id: ERR_PAYOFF_QUOTE_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /loans/{id}/cancellation, POST /upgrade-requests/{id}/completion"

  # ---- 6. optimistic concurrency ------------------------------------------
  - priority: 45
    category: state
    check: "expected_loan_version equals InstallmentLoan.version (see §1.2.1)"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /upgrade-requests"

  # ---- 7. state preconditions ---------------------------------------------
  - priority: 50
    category: state
    check: "CreditApplication.status == SUBMITTED"
    error_id: ERR_APPLICATION_NOT_DECIDABLE
    http_status: 409
    applies_to: "POST /credit-applications/{id}/decision"
  - priority: 51
    category: state
    check: "CreditApplication.status IN {APPROVED, CONDITIONAL_APPROVED}"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /loans"
  - priority: 52
    category: state
    check: "InstallmentLoan.status == ACTIVE"
    error_id: ERR_LOAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /loans/{id}/payments, POST /loans/{id}/payoff-quotes, POST /loans/{id}/cancellation, POST /upgrade-requests, POST /upgrade-requests/{id}/completion"
  - priority: 53
    category: state
    check: "the reversed PaymentPosting has posting_type IN {PAYMENT, PAYOFF} and has not itself already been reversed"
    error_id: ERR_POSTING_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /loans/{id}/payments"
  - priority: 54
    category: state
    check: >-
      InstallmentLoan.delinquency_state == CURRENT (an upgrade request cannot be raised while
      the loan sits in GRACE, DELINQUENT or DEFAULT)
    error_id: ERR_LOAN_DELINQUENT
    http_status: 409
    applies_to: "POST /upgrade-requests, POST /device-units/{id}/unlock-request"
  - priority: 55
    category: state
    check: "UpgradeRequest.status == ELIGIBILITY_PASSED"
    error_id: ERR_UPGRADE_REQUEST_NOT_AWAITING_TRADE_IN
    http_status: 409
    applies_to: "POST /upgrade-requests/{id}/trade-in-declaration"
  - priority: 56
    category: state
    check: "UpgradeRequest.status == TRADE_IN_GRADED"
    error_id: ERR_UPGRADE_REQUEST_NOT_COMPLETABLE
    http_status: 409
    applies_to: "POST /upgrade-requests/{id}/completion"
  - priority: 57
    category: state
    check: >-
      TradeIn.status matches the operation: DECLARED for receipt, RECEIVED for the first
      diagnostic report, GRADED for dispute, DISPUTED for regrade
    error_id: ERR_TRADE_IN_INVALID_STATE
    http_status: 409
    applies_to: "POST /trade-ins/{id}/receipt, POST /trade-ins/{id}/diagnostic-reports, POST /trade-ins/{id}/dispute, POST /trade-ins/{id}/regrade"
  - priority: 58
    category: business_constraint
    check: "TradeIn.dispute_count < MAX_TRADE_IN_DISPUTES"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /trade-ins/{id}/dispute"
  - priority: 59
    category: state
    check: "PayoffQuote.status == ISSUED (not CONSUMED, EXPIRED or SUPERSEDED)"
    error_id: ERR_PAYOFF_QUOTE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /loans/{id}/cancellation, POST /upgrade-requests/{id}/completion"
  - priority: 60
    category: state
    check: "DeviceUnit.activation_status == UNACTIVATED and possession_status == WITH_CUSTOMER"
    error_id: ERR_DEVICE_ALREADY_ACTIVATED
    http_status: 409
    applies_to: "POST /device-units/{id}/activation"
  - priority: 61
    category: state
    check: "CarrierAccount.activation_state IN {PENDING, PORT_ELIGIBLE} and port_freeze_flag == false"
    error_id: ERR_CARRIER_ACCOUNT_NOT_PORTABLE
    http_status: 409
    applies_to: "POST /device-units/{id}/activation"
  - priority: 62
    category: state
    check: >-
      the loan's DeviceUnit has activation_status == ACTIVATED (an unactivated device has no
      carrier relationship to transfer, so no upgrade may start and no unlock may be requested)
    error_id: ERR_DEVICE_NOT_ACTIVATED
    http_status: 409
    applies_to: "POST /upgrade-requests, POST /device-units/{id}/unlock-request"
  - priority: 63
    category: state
    check: "DeviceUnit.unlock_status IN {LOCKED, UNLOCK_REQUESTED}"
    error_id: ERR_DEVICE_ALREADY_UNLOCKED
    http_status: 409
    applies_to: "POST /device-units/{id}/unlock-request"
  - priority: 64
    category: state
    check: "DeviceModel.active == true"
    error_id: ERR_DEVICE_MODEL_INACTIVE
    http_status: 409
    applies_to: "POST /credit-applications, POST /upgrade-requests"

  # ---- 8. business safety / compliance ------------------------------------
  - priority: 70
    category: business_safety
    check: >-
      X-User-ID differs from CreditApplication.underwriter_user_id — the underwriter who
      decided an application may not also originate its loan
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loans"
  - priority: 71
    category: business_safety
    check: >-
      X-User-ID differs from the technician_user_id of the TradeIn's newest non-superseded
      DiagnosticReport — a technician may not regrade their own diagnostic
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trade-ins/{id}/regrade"
  - priority: 72
    category: business_safety
    check: "Customer.status != FINANCING_LOCKED"
    error_id: ERR_CUSTOMER_FINANCING_LOCKED
    http_status: 409
    applies_to: "POST /credit-applications, POST /credit-applications/{id}/decision, POST /loans, POST /upgrade-requests"

  # ---- 9. business temporal -----------------------------------------------
  - priority: 80
    category: business_temporal
    check: "current_utc >= InstallmentLoan.upgrade_window_opens_at (origination_date + UPGRADE_MIN_LOAN_AGE_DAYS)"
    error_id: ERR_UPGRADE_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /upgrade-requests"
  - priority: 81
    category: business_temporal
    check: "fulfillment_window_start >= current_utc (a fulfillment window may not open in the past)"
    error_id: ERR_FULFILLMENT_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /upgrade-requests"
  - priority: 82
    category: business_temporal
    check: "current_utc < PayoffQuote.expires_at (validity is the half-open interval [issued_at, expires_at))"
    error_id: ERR_PAYOFF_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /loans/{id}/cancellation, POST /upgrade-requests/{id}/completion"
  - priority: 83
    category: business_temporal
    check: "current_utc < UpgradeRequest.fulfillment_window_end"
    error_id: ERR_FULFILLMENT_WINDOW_ELAPSED
    http_status: 409
    applies_to: "POST /upgrade-requests/{id}/trade-in-declaration, POST /trade-ins/{id}/receipt, POST /trade-ins/{id}/diagnostic-reports, POST /upgrade-requests/{id}/completion"
  - priority: 84
    category: business_temporal
    check: "current_utc >= DeviceUnit.activated_at + CarrierAccount.unlock_policy_days days"
    error_id: ERR_UNLOCK_POLICY_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /device-units/{id}/unlock-request"
  - priority: 85
    category: business_temporal
    check: "to_iso8601 parses as an ISO-8601 UTC instant and is not earlier than the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 400
    applies_to: "POST /_clock/set_current_utc"

  # ---- 10. business constraint --------------------------------------------
  - priority: 90
    category: business_constraint
    check: >-
      the candidate fulfillment window's overlap population on the target DeviceModel is below
      concurrent_reservation_capacity (see calculations.model_reservation_capacity)
    error_id: ERR_MODEL_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /upgrade-requests"
  - priority: 91
    category: business_constraint
    check: "imei / target_imei is 15 digits and is not already registered on any DeviceUnit"
    error_id: ERR_IMEI_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /loans, POST /upgrade-requests/{id}/completion"
  - priority: 92
    category: business_constraint
    check: >-
      sku is unique across DeviceModel; email is unique across Customer; account_number is
      unique across CarrierAccount
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /device-models, POST /customers, POST /customers/{id}/carrier-accounts"
  - priority: 93
    category: business_constraint
    check: >-
      the customer has no other InstallmentLoan with status == ACTIVE on the same
      DeviceModel as the target of this upgrade
    error_id: ERR_DUPLICATE_MODEL_ON_CUSTOMER
    http_status: 409
    applies_to: "POST /upgrade-requests"
  - priority: 94
    category: business_constraint
    check: "the loan has at least one Installment with status IN {SCHEDULED, PARTIALLY_PAID, PAST_DUE} to allocate against"
    error_id: ERR_NOTHING_TO_ALLOCATE
    http_status: 409
    applies_to: "POST /loans/{id}/payments"

  # ---- 11. business fiscal (last) -----------------------------------------
  - priority: 100
    category: business_fiscal
    check: >-
      calculations.upgrade_eligibility_ratio yields eligibility_ratio_bps >= UPGRADE_PAID_RATIO_BPS
      (12 PAID installments of 24 at the reference term)
    error_id: ERR_UPGRADE_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /upgrade-requests"
  - priority: 101
    category: business_fiscal
    check: "down_payment_cents >= CreditApplication.conditional_down_payment_required_cents"
    error_id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /loans"
  - priority: 102
    category: business_fiscal
    check: >-
      Customer.outstanding_principal_cents + the resulting loan principal_cents
      <= Customer.credit_limit_cents
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /loans"
  - priority: 103
    category: business_fiscal
    check: >-
      InstallmentLoan.paid_installment_count >= UNLOCK_MIN_PAID_INSTALLMENTS
      (6; see calculations.upgrade_eligibility_ratio.constants)
    error_id: ERR_UNLOCK_PAYMENT_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /device-units/{id}/unlock-request"
  - priority: 104
    category: business_fiscal
    check: "payment_amount_cents equals PayoffQuote.total_payoff_cents exactly"
    error_id: ERR_PAYOFF_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /loans/{id}/cancellation"
  - priority: 105
    category: business_fiscal
    check: >-
      net_rollover_cents <= ROLLOVER_SHORTFALL_LIMIT_CENTS after the trade-in credit and any
      additional_down_payment_cents are applied (see calculations.rollover_and_new_loan_principal)
    error_id: ERR_ROLLOVER_SHORTFALL_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /upgrade-requests/{id}/completion"
  - priority: 106
    category: business_fiscal
    check: "amount_cents >= 1 for every posting_type; for posting_type == REVERSAL it must equal the reversed PaymentPosting.amount_cents exactly"
    error_id: ERR_INVALID_POSTING_AMOUNT
    http_status: 422
    applies_to: "POST /loans/{id}/payments"
  - priority: 107
    category: business_fiscal
    check: "declared_down_payment_cents < DeviceModel.retail_price_cents (a fully pre-paid device needs no installment loan)"
    error_id: ERR_DOWN_PAYMENT_EXCEEDS_PRICE
    http_status: 422
    applies_to: "POST /credit-applications"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix "/" — all collections are top-level)
# =============================================================================
endpoints:
  # ---- Customer ------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Enrol a program participant."
    roles: [RetailAssociate, ProgramAdmin]
    code: 201
    input: [full_name, email, mobile_number]
    output: Customer
    side_effects:
      - "status = ACTIVE, credit_score_band = null, credit_limit_cents = 0, default_strike_count = 0"
  - method: GET
    path: "/customers/{id}"
    description: "Read one customer, including the computed financing posture and exposure fields."
    roles: [Customer, RetailAssociate, CreditUnderwriter, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/carrier-accounts"
    description: "Register a carrier account the customer's devices can be activated on."
    roles: [Customer, RetailAssociate, ProgramAdmin]
    code: 201
    input: [carrier_code, account_number, "unlock_policy_days?", "port_freeze_flag?"]
    output: CarrierAccount
    side_effects:
      - "activation_state = PENDING, active_device_imei = null"
      - "unlock_policy_days defaults to 60 when omitted; port_freeze_flag defaults to false"
  - method: GET
    path: "/customers/{id}/carrier-accounts"
    description: "List the carrier accounts of one customer (FK reverse-reachability for CarrierAccount.customer_id)."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CarrierAccount[]
    side_effects: []

  # ---- DeviceModel ---------------------------------------------------------
  - method: POST
    path: "/device-models"
    description: "Publish a financeable device model into the catalog."
    roles: [ProgramAdmin]
    code: 201
    input: [sku, display_name, retail_price_cents, monthly_protection_premium_cents, trade_in_base_credit_cents, generation_year, "concurrent_reservation_capacity?", "active?"]
    output: DeviceModel
    side_effects:
      - "reserved_slot_count = 0; concurrent_reservation_capacity defaults to 2; active defaults to true"
  - method: GET
    path: "/device-models"
    description: "List catalog models with their live reservation load."
    roles: [Customer, RetailAssociate, CreditUnderwriter, ServiceTechnician, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: ["active?", "generation_year?", "limit?", "offset?"]
    output: DeviceModel[]
    side_effects: []
  - method: GET
    path: "/device-models/{id}"
    description: "Read one catalog model."
    roles: [Customer, RetailAssociate, CreditUnderwriter, ServiceTechnician, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: []
    output: DeviceModel
    side_effects: []

  # ---- CreditApplication ---------------------------------------------------
  - method: POST
    path: "/credit-applications"
    description: "Submit a point-of-sale credit application for one model and term."
    roles: [Customer, RetailAssociate]
    code: 201
    input: [customer_id, device_model_id, requested_term_months, "declared_down_payment_cents?"]
    output: CreditApplication
    side_effects:
      - "status = SUBMITTED"
      - "requested_principal_cents = DeviceModel.retail_price_cents - declared_down_payment_cents"
  - method: GET
    path: "/credit-applications"
    description: "List credit applications, filtered by applicant, model or decision status."
    roles: [Customer, RetailAssociate, CreditUnderwriter, ProgramAdmin]
    code: 200
    input: ["customer_id?", "device_model_id?", "status?", "limit?", "offset?"]
    output: CreditApplication[]
    side_effects: []
  - method: GET
    path: "/credit-applications/{id}"
    description: "Read one credit application with its decision fields."
    roles: [Customer, RetailAssociate, CreditUnderwriter, ProgramAdmin]
    code: 200
    input: []
    output: CreditApplication
    side_effects: []
  - method: POST
    path: "/credit-applications/{id}/decision"
    description: "Record the underwriting decision. The band is supplied by the underwriter; the outcome is derived by calculations.credit_decision."
    roles: [CreditUnderwriter]
    code: 200
    input: [credit_score_band]
    output: CreditApplication
    side_effects:
      - "runs calculations.credit_decision; sets status to APPROVED, CONDITIONAL_APPROVED or DECLINED"
      - "writes credit_limit_cents, exposure_at_decision_cents, approved_principal_cents, conditional_down_payment_required_cents, decision_reason"
      - "sets underwriter_user_id = X-User-ID and decided_at = logical clock"
      - "writes Customer.credit_score_band and Customer.credit_limit_cents"

  # ---- InstallmentLoan -----------------------------------------------------
  - method: POST
    path: "/loans"
    description: "Originate the installment loan at point of sale and mint its schedule and handset."
    roles: [RetailAssociate]
    code: 201
    input: [credit_application_id, down_payment_cents, imei]
    output: InstallmentLoan
    side_effects:
      - "runs calculations.installment_schedule_generation; creates term_months Installment rows in SCHEDULED"
      - "creates one DeviceUnit (UNACTIVATED / LOCKED / WITH_CUSTOMER) carrying imei"
      - "moves CreditApplication to ORIGINATED"
      - "sets origination_date = logical clock and upgrade_window_opens_at = origination_date + UPGRADE_MIN_LOAN_AGE_DAYS days"
      - "recomputes Customer.outstanding_principal_cents and Customer.open_loan_count"
      - "enforces segregation of duties against CreditApplication.underwriter_user_id"
  - method: GET
    path: "/loans"
    description: "List installment loans, filtered by borrower, application, model, predecessor or status."
    roles: [Customer, RetailAssociate, CreditUnderwriter, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: ["customer_id?", "credit_application_id?", "device_model_id?", "predecessor_loan_id?", "status?", "delinquency_state?", "limit?", "offset?"]
    output: InstallmentLoan[]
    side_effects: []
  - method: GET
    path: "/loans/{id}"
    description: "Read one loan with its live ledger, delinquency dimension and version (read this before any OCC-guarded write)."
    roles: [Customer, RetailAssociate, CreditUnderwriter, ServiceTechnician, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: []
    output: InstallmentLoan
    side_effects: []
  - method: GET
    path: "/loans/{id}/installments"
    description: "List one loan's installment schedule (FK reverse-reachability for Installment.loan_id)."
    roles: [Customer, RetailAssociate, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []
  - method: GET
    path: "/loans/{id}/delinquency-events"
    description: "List one loan's collections audit trail (FK reverse-reachability for DelinquencyEvent.loan_id)."
    roles: [Customer, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: DelinquencyEvent[]
    side_effects: []
  - method: GET
    path: "/loans/{id}/payoff-quotes"
    description: "List one loan's payoff quotes (FK reverse-reachability for PayoffQuote.loan_id)."
    roles: [Customer, RetailAssociate, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: ["quote_type?", "status?", "limit?", "offset?"]
    output: PayoffQuote[]
    side_effects: []
  - method: POST
    path: "/loans/{id}/payments"
    description: "Post money to a loan, or reverse an earlier posting. Drives calculations.payment_waterfall_allocation."
    roles: [Customer, RetailAssociate, CollectionsOfficer, ProgramAdmin]
    code: 201
    input: [posting_type, amount_cents, "reverses_posting_id?"]
    output: PaymentPosting
    side_effects:
      - "runs calculations.payment_waterfall_allocation and writes allocated_late_fee_cents / allocated_principal_cents / allocated_premium_cents / installments_satisfied_count / overpayment_cents"
      - "advances or re-opens Installment rows and recomputes the loan ledger fields"
      - "recomputes delinquency_state and days_past_due; appends a CURED DelinquencyEvent when arrears clear"
      - "on REVERSAL, restores every ledger field to its pre-target value with zero drift and may re-enter DEFAULT"
      - "releases Customer.status FINANCING_LOCKED when no loan of the customer remains in DEFAULT"
      - "increments InstallmentLoan.version by 1"
  - method: POST
    path: "/loans/{id}/payoff-quotes"
    description: "Price a payoff quote in one of the two variants and issue it with a 7-day half-open validity."
    roles: [Customer, RetailAssociate, CollectionsOfficer, ProgramAdmin]
    code: 201
    input: [quote_type]
    output: PayoffQuote
    side_effects:
      - "runs calculations.payoff_quote (which selects the matching calculations.unearned_premium_rebate variant)"
      - "sets issued_at = logical clock and expires_at = issued_at + QUOTE_VALIDITY_DAYS days"
      - "moves any earlier ISSUED quote of the same quote_type on this loan to SUPERSEDED"
      - "increments InstallmentLoan.version by 1"
  - method: POST
    path: "/loans/{id}/cancellation"
    description: "Leave the program: settle an EARLY_CANCELLATION quote in full and close the loan."
    roles: [Customer, RetailAssociate, ProgramAdmin]
    code: 200
    input: [payoff_quote_id, payment_amount_cents]
    output: InstallmentLoan
    side_effects:
      - "creates a PAYOFF PaymentPosting for payment_amount_cents"
      - "moves the loan to PAID_OFF with closure_reason PROGRAM_CANCELLATION and voids its open installments"
      - "sets protection_coverage_status = TERMINATED and outstanding_late_fee_cents = 0"
      - "moves the quote to CONSUMED and any other ISSUED quote to SUPERSEDED"
      - "cascade: DeviceUnit.unlock_status becomes UNLOCKED, then CarrierAccount.activation_state becomes PORT_ELIGIBLE"
      - "recomputes Customer.outstanding_principal_cents and Customer.open_loan_count"
      - "increments InstallmentLoan.version by 1"

  # ---- PaymentPosting ------------------------------------------------------
  - method: GET
    path: "/payment-postings"
    description: "List payment postings, filtered by loan or by the posting they reverse."
    roles: [Customer, RetailAssociate, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: ["loan_id?", "reverses_posting_id?", "posting_type?", "limit?", "offset?"]
    output: PaymentPosting[]
    side_effects: []
  - method: GET
    path: "/payment-postings/{id}"
    description: "Read one posting with its allocation breakdown."
    roles: [Customer, RetailAssociate, CollectionsOfficer, ProgramAdmin]
    code: 200
    input: []
    output: PaymentPosting
    side_effects: []

  # ---- DeviceUnit ----------------------------------------------------------
  - method: GET
    path: "/device-units"
    description: "List handsets, filtered by loan, model or carrier account (FK reverse-reachability for all three DeviceUnit FKs)."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: ["loan_id?", "device_model_id?", "carrier_account_id?", "activation_status?", "possession_status?", "limit?", "offset?"]
    output: DeviceUnit[]
    side_effects: []
  - method: GET
    path: "/device-units/{id}"
    description: "Read one handset with its three independent status dimensions."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: []
  - method: POST
    path: "/device-units/{id}/activation"
    description: "Activate the handset on a carrier account."
    roles: [RetailAssociate, ServiceTechnician]
    code: 200
    input: [carrier_account_id]
    output: DeviceUnit
    side_effects:
      - "activation_status = ACTIVATED and activated_at = logical clock"
      - "cross-entity: CarrierAccount.activation_state = ACTIVATED and active_device_imei = this handset's imei"
  - method: POST
    path: "/device-units/{id}/unlock-request"
    description: "Ask the carrier to unlock the handset. The first accepted call moves LOCKED -> UNLOCK_REQUESTED; a second call completes UNLOCK_REQUESTED -> UNLOCKED."
    roles: [Customer, RetailAssociate]
    code: 200
    input: []
    output: DeviceUnit
    side_effects:
      - "enforces UNLOCK_MIN_PAID_INSTALLMENTS, delinquency_state == CURRENT and the carrier's unlock_policy_days window"
      - "sets unlock_requested_at, then unlocked_at on completion"
      - "on UNLOCKED, CarrierAccount.activation_state becomes PORT_ELIGIBLE"

  # ---- UpgradeRequest ------------------------------------------------------
  - method: POST
    path: "/upgrade-requests"
    description: "Open an annual-upgrade request against an eligible loan, reserving a fulfillment window on the target model. OCC-guarded on the loan (§1.2.1)."
    roles: [Customer, RetailAssociate]
    code: 201
    input: [loan_id, target_device_model_id, fulfillment_window_start, expected_loan_version]
    output: UpgradeRequest
    side_effects:
      - "checks expected_loan_version against InstallmentLoan.version and rejects a stale writer with ERR_STALE_LOAN_VERSION"
      - "runs calculations.upgrade_eligibility_ratio and calculations.model_reservation_capacity"
      - "sets fulfillment_window_end = fulfillment_window_start + FULFILLMENT_WINDOW_DAYS days"
      - "snapshots paid_installment_count_at_request and eligibility_ratio_bps"
      - "sets InstallmentLoan.upgrade_hold_flag = true and increments DeviceModel.reserved_slot_count"
      - "moves any earlier non-terminal UpgradeRequest on the same loan to SUPERSEDED, releasing its reservation"
      - "increments InstallmentLoan.version by 1"
  - method: GET
    path: "/upgrade-requests"
    description: "List upgrade requests, filtered by loan, customer, target model, minted loan or consumed quote (FK reverse-reachability for all five UpgradeRequest FKs)."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: ["loan_id?", "customer_id?", "target_device_model_id?", "new_loan_id?", "payoff_quote_id?", "status?", "limit?", "offset?"]
    output: UpgradeRequest[]
    side_effects: []
  - method: GET
    path: "/upgrade-requests/{id}"
    description: "Read one upgrade request with its reservation window and funding projection."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: []
    output: UpgradeRequest
    side_effects: []
  - method: POST
    path: "/upgrade-requests/{id}/trade-in-declaration"
    description: "Declare the handset that will be traded in, with the customer's self-assessed condition."
    roles: [Customer, RetailAssociate]
    code: 201
    input: [device_unit_id, declared_condition]
    output: TradeIn
    side_effects:
      - "creates the TradeIn in DECLARED with credit_estimate_cents from calculations.trade_in_credit (declared_estimate)"
      - "sets DeviceUnit.possession_status = RETURN_PENDING"
      - "moves the UpgradeRequest to TRADE_IN_DECLARED and refreshes trade_in_credit_projection_cents, projected_rollover_balance_cents, credit_shortfall_cents and funding_flag"
  - method: POST
    path: "/upgrade-requests/{id}/completion"
    description: "Complete the upgrade: consume the rollover quote, retire the old loan, and mint the successor loan, schedule and handset."
    roles: [RetailAssociate]
    code: 201
    input: [payoff_quote_id, target_imei, "additional_down_payment_cents?"]
    output: InstallmentLoan
    side_effects:
      - "runs calculations.rollover_and_new_loan_principal, then calculations.installment_schedule_generation on the successor loan"
      - "moves the predecessor loan to ROLLED_OVER with closure_reason UPGRADE_ROLLOVER and voids its open installments"
      - "cascade: predecessor DeviceUnit.possession_status = RETURNED and unlock_status = UNLOCKED; the CarrierAccount is re-pointed at the new handset and returns to PENDING"
      - "moves the TradeIn to SETTLED and the PayoffQuote to CONSUMED"
      - "decrements DeviceModel.reserved_slot_count and clears InstallmentLoan.upgrade_hold_flag"
      - "sets UpgradeRequest.status = COMPLETED, completed_at, new_loan_id, payoff_quote_id, additional_down_payment_cents"
      - "recomputes Customer.outstanding_principal_cents, open_loan_count, completed_upgrade_count, last_upgrade_completed_at"
      - "increments InstallmentLoan.version by 1 on the predecessor loan"

  # ---- TradeIn / DiagnosticReport -----------------------------------------
  - method: GET
    path: "/trade-ins"
    description: "List trade-ins, filtered by upgrade request or handset (FK reverse-reachability for both TradeIn FKs)."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: ["upgrade_request_id?", "device_unit_id?", "status?", "limit?", "offset?"]
    output: TradeIn[]
    side_effects: []
  - method: GET
    path: "/trade-ins/{id}"
    description: "Read one trade-in with its declared estimate, graded credit and variance."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: []
    output: TradeIn
    side_effects: []
  - method: POST
    path: "/trade-ins/{id}/receipt"
    description: "Record physical receipt of the traded handset at the store."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: TradeIn
    side_effects:
      - "status = RECEIVED, received_at = logical clock"
      - "DeviceUnit.possession_status = RETURNED and activation_status = DEACTIVATED"
  - method: POST
    path: "/trade-ins/{id}/diagnostic-reports"
    description: "File the bench diagnostic that grades the returned handset and fixes its final credit."
    roles: [ServiceTechnician]
    code: 201
    input: [screen_grade, battery_health_pct, water_damage_flag, functional_pass]
    output: DiagnosticReport
    side_effects:
      - "sequence_no = 1, report_type = INITIAL, technician_user_id = X-User-ID"
      - "runs calculations.trade_in_credit (final_graded) and writes derived_condition, condition_multiplier_bps, screen_deduction_cents, battery_deduction_cents, computed_credit_cents, diagnostic_result"
      - "moves the TradeIn to GRADED with graded_condition, credit_final_cents, credit_variance_cents, graded_at and latest_report_sequence_no"
      - "moves the UpgradeRequest to TRADE_IN_GRADED and refreshes its funding projection"
      - "on diagnostic_result FAIL: DeviceUnit.possession_status = RETURN_FAILED, Customer.credit_score_band downgrades one notch and Customer.credit_limit_cents is rewritten"
  - method: GET
    path: "/trade-ins/{id}/diagnostic-reports"
    description: "List one trade-in's diagnostic reports, newest sequence_no last (FK reverse-reachability for DiagnosticReport.trade_in_id)."
    roles: [Customer, RetailAssociate, ServiceTechnician, ProgramAdmin]
    code: 200
    input: ["report_type?", "limit?", "offset?"]
    output: DiagnosticReport[]
    side_effects: []
  - method: POST
    path: "/trade-ins/{id}/dispute"
    description: "Dispute the grading; admissible at most MAX_TRADE_IN_DISPUTES times."
    roles: [Customer, RetailAssociate]
    code: 200
    input: [dispute_reason]
    output: TradeIn
    side_effects:
      - "status = DISPUTED, dispute_count += 1, dispute_reason recorded"
  - method: POST
    path: "/trade-ins/{id}/regrade"
    description: "File an overriding diagnostic on a disputed trade-in. The actor must differ from the technician who filed the newest report."
    roles: [ServiceTechnician, ProgramAdmin]
    code: 201
    input: [screen_grade, battery_health_pct, water_damage_flag, functional_pass, override_reason]
    output: DiagnosticReport
    side_effects:
      - "sequence_no = TradeIn.latest_report_sequence_no + 1, report_type = REGRADE, technician_user_id = X-User-ID"
      - "enforces segregation of duties against the newest report's technician_user_id"
      - "re-runs calculations.trade_in_credit (final_graded) and rewrites the TradeIn grading fields and credit_variance_cents"
      - "returns the TradeIn to GRADED and refreshes the UpgradeRequest funding projection"
      - "a PASS regrade after a FAIL restores DeviceUnit.possession_status to RETURNED and reverses the credit-band downgrade"

  # ---- servicing and clock -------------------------------------------------
  - method: POST
    path: "/servicing/daily-run"
    description: "Advance the servicing calendar at the current logical clock: age installments, assess late fees, move delinquency states, declare defaults, and expire stale upgrade requests and quotes."
    roles: [CollectionsOfficer, ProgramAdmin]
    code: 200
    input: []
    output: { processed_loan_count: integer, transitioned_loan_count: integer, late_fees_assessed_cents: integer, defaulted_loan_count: integer, expired_upgrade_request_count: integer, expired_quote_count: integer }
    side_effects:
      - "runs calculations.delinquency_progression over every loan with status == ACTIVE, in ascending InstallmentLoan.created_at order"
      - "moves SCHEDULED / PARTIALLY_PAID installments whose due_date has passed to PAST_DUE and assesses LATE_FEE_CENTS once past the grace period"
      - "appends DelinquencyEvent rows for every state change and every fee"
      - "declares DEFAULT at DEFAULT_MIN_DPD and fires the full financing-lock cascade"
      - "expires UpgradeRequest rows whose fulfillment_window_end has passed, releasing their model reservations and loan holds"
      - "expires PayoffQuote rows whose expires_at has passed"
      - "increments InstallmentLoan.version by 1 for every loan it changed"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it never falls back to wall-clock time. The clock only moves forward."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "every subsequent date comparison (due dates, grace and default thresholds, quote validity, fulfillment windows, unlock policy windows, upgrade windows) uses the new value"
      - "no business state is recomputed by this call itself; POST /servicing/daily-run is what ages the portfolio"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or a Customer addresses another customer's loan, device, carrier account or upgrade request"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible upstream step: decided the application now being originated, or filed the diagnostic now being regraded"
  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is absent, an enum value is not a declared member, a cents field is not a non-negative integer, a timestamp does not parse, or limit/offset fall outside 1..100 / >= 0"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 400
    condition: "POST /_clock/set_current_utc carries a to_iso8601 earlier than the current logical clock"
  # ---- existence -----------------------------------------------------------
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "no Customer with the given path or body id"
  - id: ERR_DEVICE_MODEL_NOT_FOUND
    http: 404
    condition: "no DeviceModel with the given path, device_model_id or target_device_model_id"
  - id: ERR_CREDIT_APPLICATION_NOT_FOUND
    http: 404
    condition: "no CreditApplication with the given path or body credit_application_id"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "no InstallmentLoan with the given path or body loan_id"
  - id: ERR_DEVICE_UNIT_NOT_FOUND
    http: 404
    condition: "no DeviceUnit with the given path or body device_unit_id"
  - id: ERR_CARRIER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no CarrierAccount with the given carrier_account_id"
  - id: ERR_UPGRADE_REQUEST_NOT_FOUND
    http: 404
    condition: "no UpgradeRequest with the given path id"
  - id: ERR_TRADE_IN_NOT_FOUND
    http: 404
    condition: "no TradeIn with the given path id"
  - id: ERR_PAYOFF_QUOTE_NOT_FOUND
    http: 404
    condition: "no PayoffQuote with the given payoff_quote_id"
  - id: ERR_PAYMENT_POSTING_NOT_FOUND
    http: 404
    condition: "no PaymentPosting with the given path id or reverses_posting_id"
  # ---- referential integrity ----------------------------------------------
  - id: ERR_CROSS_REFERENCE_MISMATCH
    http: 409
    condition: "the referenced resource exists but belongs to a different customer or loan than the addressed resource (carrier account, payoff quote, traded handset, reversed posting)"
  - id: ERR_PAYOFF_QUOTE_TYPE_MISMATCH
    http: 409
    condition: "an EARLY_CANCELLATION quote is presented at upgrade completion, or an UPGRADE_ROLLOVER quote at program cancellation"
  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "expected_loan_version does not equal the current InstallmentLoan.version at POST /upgrade-requests (§1.2.1)"
  # ---- state preconditions -------------------------------------------------
  - id: ERR_APPLICATION_NOT_DECIDABLE
    http: 409
    condition: "a decision is filed against an application that is not SUBMITTED (already decided, voided or originated)"
  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "origination is attempted from an application that is not APPROVED or CONDITIONAL_APPROVED"
  - id: ERR_LOAN_NOT_ACTIVE
    http: 409
    condition: "a payment, quote, cancellation, upgrade request or upgrade completion targets a loan that already reached PAID_OFF or ROLLED_OVER"
  - id: ERR_POSTING_ALREADY_REVERSED
    http: 409
    condition: "the reversal target is itself a REVERSAL, or has already been reversed by an earlier posting"
  - id: ERR_NOTHING_TO_ALLOCATE
    http: 409
    condition: "a PAYMENT or PAYOFF posting arrives on a loan whose every installment is already PAID or VOIDED"
  - id: ERR_INVALID_POSTING_AMOUNT
    http: 422
    condition: "amount_cents is below 1, or a REVERSAL's amount_cents differs from the reversed posting's amount_cents"
  - id: ERR_LOAN_DELINQUENT
    http: 409
    condition: "an upgrade request or unlock request is raised while the loan's delinquency_state is GRACE, DELINQUENT or DEFAULT (the device financing lock)"
  - id: ERR_UPGRADE_REQUEST_NOT_AWAITING_TRADE_IN
    http: 409
    condition: "a trade-in declaration arrives on an upgrade request that is not ELIGIBILITY_PASSED"
  - id: ERR_UPGRADE_REQUEST_NOT_COMPLETABLE
    http: 409
    condition: "completion is attempted on an upgrade request that is not TRADE_IN_GRADED"
  - id: ERR_TRADE_IN_INVALID_STATE
    http: 409
    condition: "receipt, grading, dispute or regrade is attempted from the wrong TradeIn status"
  - id: ERR_DISPUTE_LIMIT_REACHED
    http: 409
    condition: "a third dispute is raised on the same trade-in (dispute_count already equals MAX_TRADE_IN_DISPUTES)"
  - id: ERR_PAYOFF_QUOTE_NOT_ISSUED
    http: 409
    condition: "the presented quote is CONSUMED, EXPIRED or SUPERSEDED rather than ISSUED"
  - id: ERR_DEVICE_ALREADY_ACTIVATED
    http: 409
    condition: "activation targets a handset that is not UNACTIVATED / WITH_CUSTOMER"
  - id: ERR_CARRIER_ACCOUNT_NOT_PORTABLE
    http: 409
    condition: "the carrier account is already ACTIVATED on another handset, or its port_freeze_flag is set"
  - id: ERR_DEVICE_NOT_ACTIVATED
    http: 409
    condition: "an upgrade request or unlock request is raised on a loan whose handset was never activated on a carrier"
  - id: ERR_DEVICE_ALREADY_UNLOCKED
    http: 409
    condition: "an unlock request arrives on a handset whose unlock_status is already UNLOCKED"
  - id: ERR_DEVICE_MODEL_INACTIVE
    http: 409
    condition: "an application or upgrade targets a DeviceModel with active == false"
  - id: ERR_CUSTOMER_FINANCING_LOCKED
    http: 409
    condition: "any new financing operation is attempted while Customer.status is FINANCING_LOCKED"
  # ---- temporal -----------------------------------------------------------
  - id: ERR_UPGRADE_WINDOW_NOT_OPEN
    http: 409
    condition: "the logical clock has not yet reached InstallmentLoan.upgrade_window_opens_at"
  - id: ERR_FULFILLMENT_WINDOW_IN_PAST
    http: 422
    condition: "fulfillment_window_start is earlier than the logical clock"
  - id: ERR_FULFILLMENT_WINDOW_ELAPSED
    http: 409
    condition: "a trade-in, grading or completion step arrives at or after UpgradeRequest.fulfillment_window_end"
  - id: ERR_PAYOFF_QUOTE_EXPIRED
    http: 409
    condition: "the logical clock has reached PayoffQuote.expires_at (validity is the half-open interval [issued_at, expires_at))"
  - id: ERR_UNLOCK_POLICY_PERIOD_NOT_ELAPSED
    http: 409
    condition: "fewer than CarrierAccount.unlock_policy_days whole days have elapsed since DeviceUnit.activated_at"
  # ---- constraint ---------------------------------------------------------
  - id: ERR_MODEL_CAPACITY_EXHAUSTED
    http: 409
    condition: "the candidate fulfillment window overlaps at least concurrent_reservation_capacity live windows already reserved on the target model"
  - id: ERR_IMEI_ALREADY_REGISTERED
    http: 409
    condition: "the supplied imei or target_imei is not 15 digits, or already identifies another DeviceUnit"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "a DeviceModel sku, a Customer email or a CarrierAccount account_number collides with an existing row"
  - id: ERR_DUPLICATE_MODEL_ON_CUSTOMER
    http: 409
    condition: "the customer already holds an ACTIVE loan on the model this upgrade targets"
  # ---- fiscal -------------------------------------------------------------
  - id: ERR_UPGRADE_THRESHOLD_NOT_MET
    http: 409
    condition: "eligibility_ratio_bps is below UPGRADE_PAID_RATIO_BPS (fewer than half the installments are PAID)"
  - id: ERR_DOWN_PAYMENT_INSUFFICIENT
    http: 422
    condition: "down_payment_cents is below the CONDITIONAL_APPROVED application's conditional_down_payment_required_cents"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 422
    condition: "the customer's outstanding principal plus this loan's principal would exceed Customer.credit_limit_cents"
  - id: ERR_DOWN_PAYMENT_EXCEEDS_PRICE
    http: 422
    condition: "declared_down_payment_cents is not strictly below the model's retail_price_cents"
  - id: ERR_UNLOCK_PAYMENT_THRESHOLD_NOT_MET
    http: 409
    condition: "fewer than UNLOCK_MIN_PAID_INSTALLMENTS (6) installments are PAID on the loan"
  - id: ERR_PAYOFF_AMOUNT_MISMATCH
    http: 422
    condition: "payment_amount_cents does not equal PayoffQuote.total_payoff_cents exactly"
  - id: ERR_ROLLOVER_SHORTFALL_EXCEEDS_LIMIT
    http: 422
    condition: "the net rollover balance after trade-in credit and any additional down payment exceeds ROLLOVER_SHORTFALL_LIMIT_CENTS"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "The program participant. Applies, pays, requests upgrades, declares trade-ins, disputes gradings and cancels."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /trade-ins/{id}/dispute (jointly with RetailAssociate acting on the customer's behalf)"
    shared_operations:
      - "GET /customers/{id} (own record only)"
      - "GET /customers/{id}/carrier-accounts, POST /customers/{id}/carrier-accounts (own accounts only)"
      - "POST /credit-applications, GET /credit-applications, GET /credit-applications/{id}"
      - "GET /loans, GET /loans/{id}, GET /loans/{id}/installments, GET /loans/{id}/delinquency-events, GET /loans/{id}/payoff-quotes"
      - "POST /loans/{id}/payments, POST /loans/{id}/payoff-quotes, POST /loans/{id}/cancellation"
      - "GET /device-units, GET /device-units/{id}, POST /device-units/{id}/unlock-request"
      - "POST /upgrade-requests, GET /upgrade-requests, GET /upgrade-requests/{id}"
      - "POST /upgrade-requests/{id}/trade-in-declaration"
      - "GET /trade-ins, GET /trade-ins/{id}, GET /trade-ins/{id}/diagnostic-reports"
      - "GET /device-models, GET /device-models/{id}"
    note: >-
      X-User-ID must equal the Customer.id that owns the addressed resource; a Customer that
      addresses another customer's loan, handset, carrier account or upgrade request is denied
      with ERR_UNAUTHORIZED before any state check runs.

  - name: RetailAssociate
    description: "Point-of-sale staff. Enrols customers, originates loans, activates handsets and completes upgrades."
    identity: opaque
    exclusive_operations:
      - "POST /loans"
      - "POST /upgrade-requests/{id}/completion"
    shared_operations:
      - "POST /customers, GET /customers/{id}"
      - "GET /customers/{id}/carrier-accounts, POST /customers/{id}/carrier-accounts"
      - "POST /credit-applications, GET /credit-applications, GET /credit-applications/{id}"
      - "GET /loans, GET /loans/{id}, GET /loans/{id}/installments, GET /loans/{id}/payoff-quotes"
      - "POST /loans/{id}/payments, POST /loans/{id}/payoff-quotes, POST /loans/{id}/cancellation"
      - "GET /payment-postings, GET /payment-postings/{id}"
      - "GET /device-units, GET /device-units/{id}, POST /device-units/{id}/activation, POST /device-units/{id}/unlock-request"
      - "POST /upgrade-requests, GET /upgrade-requests, GET /upgrade-requests/{id}, POST /upgrade-requests/{id}/trade-in-declaration"
      - "GET /trade-ins, GET /trade-ins/{id}, GET /trade-ins/{id}/diagnostic-reports, POST /trade-ins/{id}/dispute"
      - "GET /device-models, GET /device-models/{id}"
    note: >-
      An associate may not originate a loan from an application they themselves decided — the
      X-User-ID is compared with CreditApplication.underwriter_user_id and rejected with
      ERR_SEGREGATION_OF_DUTIES.

  - name: CreditUnderwriter
    description: "Credit desk. Files the underwriting decision and reads the resulting exposure."
    identity: opaque
    exclusive_operations:
      - "POST /credit-applications/{id}/decision"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /credit-applications, GET /credit-applications/{id}"
      - "GET /loans, GET /loans/{id}"
      - "GET /device-models, GET /device-models/{id}"

  - name: ServiceTechnician
    description: "Bench staff. Receives returned handsets, grades them, files regrades and activates devices."
    identity: opaque
    exclusive_operations:
      - "POST /trade-ins/{id}/receipt"
      - "POST /trade-ins/{id}/diagnostic-reports"
    shared_operations:
      - "POST /trade-ins/{id}/regrade"
      - "GET /trade-ins, GET /trade-ins/{id}, GET /trade-ins/{id}/diagnostic-reports"
      - "GET /device-units, GET /device-units/{id}, POST /device-units/{id}/activation"
      - "GET /customers/{id}/carrier-accounts"
      - "GET /loans/{id}"
      - "GET /upgrade-requests, GET /upgrade-requests/{id}"
      - "GET /device-models, GET /device-models/{id}"
    note: >-
      A technician may not regrade a trade-in whose newest DiagnosticReport carries their own
      X-User-ID as technician_user_id — ERR_SEGREGATION_OF_DUTIES.

  - name: CollectionsOfficer
    description: "Collections desk. Runs the servicing calendar, works arrears and posts reversals."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /servicing/daily-run"
      - "GET /customers/{id}"
      - "GET /loans, GET /loans/{id}, GET /loans/{id}/installments, GET /loans/{id}/delinquency-events, GET /loans/{id}/payoff-quotes"
      - "POST /loans/{id}/payments, POST /loans/{id}/payoff-quotes"
      - "GET /payment-postings, GET /payment-postings/{id}"
      - "GET /device-models, GET /device-models/{id}"

  - name: ProgramAdmin
    description: "Program operator. Owns the catalog and the logical clock, and can act across the whole surface."
    identity: opaque
    exclusive_operations:
      - "POST /device-models"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /customers, GET /customers/{id}, GET /customers/{id}/carrier-accounts, POST /customers/{id}/carrier-accounts"
      - "GET /credit-applications, GET /credit-applications/{id}"
      - "GET /loans, GET /loans/{id}, GET /loans/{id}/installments, GET /loans/{id}/delinquency-events, GET /loans/{id}/payoff-quotes"
      - "POST /loans/{id}/payments, POST /loans/{id}/cancellation"
      - "GET /payment-postings, GET /payment-postings/{id}"
      - "GET /device-units, GET /device-units/{id}"
      - "GET /upgrade-requests, GET /upgrade-requests/{id}"
      - "GET /trade-ins, GET /trade-ins/{id}, GET /trade-ins/{id}/diagnostic-reports, POST /trade-ins/{id}/regrade"
      - "POST /servicing/daily-run"
      - "GET /device-models, GET /device-models/{id}"
    note: >-
      ProgramAdmin is NOT a blanket override: it cannot originate a loan (POST /loans), file an
      underwriting decision, receive or initially grade a trade-in, complete an upgrade, or
      request a device unlock. Those remain with the roles that own the corresponding
      real-world control.
