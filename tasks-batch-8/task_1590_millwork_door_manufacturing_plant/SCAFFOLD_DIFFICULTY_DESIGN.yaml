scaffold_difficulty_design:
  # ==================================================================
  # Rule 1 — dual_variant_calc (two entity domains: order fiscal vs trip logistics)
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_budget_vs_contract_divergence
        grounds:
          - calculations.order_pricing
          - entities.MillworkOrder.fields.budget_quote_cents
          - entities.MillworkOrder.fields.contract_price_cents
        distinguishing_aspect: |
          Entity domain = order fiscal. Identical openings data is priced twice:
          BUDGET (flat 1.12 waste, flat 1.08 finish, flat 5500/opening hardware,
          no fire surcharge, flat 25000 freight, computed at CONFIGURE) versus
          CONTRACT (per-species waste, tiered finish pct, template charge, fire
          surcharge, tiered freight, computed at drawing APPROVE) — the two
          variants yield 173895 vs 185670 for the same inputs.
        test_recipe:
          setup:
            - "Project OPEN; template fire_rated_compatible=true; MAPLE/STAIN/SATIN order TEMPLATE_PREP with fire_rating_required=MIN_20; opening 101 leaf_count=2 MIN_20; opening 102 leaf_count=1 NONE; order CONFIGURED; drawing created, submitted by est-1, approved by arch-1."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Hillcrest Tower", site_address: "1200 Grand Ave", contract_code: "C-1001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-FR-1", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-1001", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "101", width_in: 36, height_in: 84, leaf_count: 2, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "102", width_in: 30, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          trigger:
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { budget: $.data.budget_quote_cents, merch: $.data.merchandise_total_cents, freight: $.data.freight_fee_cents, contract: $.data.contract_price_cents } }
          assert:
            - "Order.${ord_id}.budget_quote_cents == 173895"
            - "Order.${ord_id}.merchandise_total_cents == 160670"
            - "Order.${ord_id}.freight_fee_cents == 25000"
            - "Order.${ord_id}.contract_price_cents == 185670"
            - "captured ${contract} != captured ${budget}"
      - name: trip_fill_projected_vs_realized_divergence
        grounds:
          - calculations.trip_fill_efficiency
          - entities.DeliveryTrip.fields.projected_fill_pct
          - entities.DeliveryTrip.fields.realized_fill_pct
        distinguishing_aspect: |
          Entity domain = delivery logistics (different from order pricing).
          PROJECTED (forward-looking: committed leaves + STAGED-and-UNSCHEDULED
          project openings) versus REALIZED (settled: committed only, frozen at
          DEPARTED) — identical trip data yields 60.0 vs 50.0.
        test_recipe:
          setup:
            - "Unrated PAINT_GRADE order (INSTALLER_PREP, fire NONE) fully driven to FINISHING; openings O1/O2/O3 (3/2/1 leaves) batched to FINISHED then STAGED; trip capacity 10, arrival 2026-09-30 <= required 2026-10-01; O1 and O2 assigned (5 leaves committed), O3 left STAGED+UNSCHEDULED."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Fill Project", site_address: "9 Depot Rd", contract_code: "C-2001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-2001", species: "PAINT_GRADE", profile_code: "PR-1", finish_system: "PAINT", sheen_target: "MATTE", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "A1", width_in: 36, height_in: 84, leaf_count: 3, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "A2", width_in: 32, height_in: 84, leaf_count: 2, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op2: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "A3", width_in: 30, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op3: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 90 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-1", supported_species: ["PAINT_GRADE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 10 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op2}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op3}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-1", capacity: 2 }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 16 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 15 }, as: QAInspector }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op2}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op3}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-1", truck_capacity_leaves: 10, departure_date: "2026-09-28", site_arrival_date: "2026-09-30" }, as: PlantManager, captures: { trip_id: $.data.id } }
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator }
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op2}" }, as: ShippingCoordinator }
            - { call: "GET /millwork/delivery-trips/${trip_id}", as: Any, captures: { proj_fill: $.data.projected_fill_pct, committed: $.data.leaves_committed } }
          trigger:
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DEPARTED" }, as: ShippingCoordinator, captures: { realized: $.data.realized_fill_pct } }
          assert:
            - "captured ${proj_fill} == 60.0"
            - "captured ${committed} == 5"
            - "captured ${realized} == 50.0"
            - "captured ${realized} != captured ${proj_fill}"
            - "Opening.${op1}.ship_status == SHIPPED and Opening.${op2}.ship_status == SHIPPED and Opening.${op3}.ship_status == UNSCHEDULED"

  # ==================================================================
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contract_price_tiered_multi_factor
        grounds:
          - calculations.order_pricing
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: per-species waste
          (WALNUT 1.20), finish tier selected by TOTAL leaves (12 -> 1.07),
          conditional hardware branch (TEMPLATE_PREP +8500/opening), and
          per-rated-leaf fire surcharge (MIN_45 9500) combine into one
          conditional, tiered-rate formula.
        test_recipe:
          setup:
            - "WALNUT/CLEAR_COAT/SEMI_GLOSS order, TEMPLATE_PREP with fire-compatible template, fire_rating_required=MIN_45; opening W1 leaf_count=6 MIN_45; opening W2 leaf_count=6 NONE (total 12 leaves -> finish tier 1.07); order CONFIGURED; drawing approved."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Walnut Suites", site_address: "4 Loop W", contract_code: "C-3001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-FR-45", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-3001", species: "WALNUT", profile_code: "PR-9", finish_system: "CLEAR_COAT", sheen_target: "SEMI_GLOSS", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_45" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "W1", width_in: 36, height_in: 84, leaf_count: 6, fire_rating: "MIN_45", required_on_site_date: "2026-11-01" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "W2", width_in: 36, height_in: 84, leaf_count: 6, fire_rating: "NONE", required_on_site_date: "2026-11-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
          trigger:
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          assert:
            - "Order.${ord_id}.merchandise_total_cents == 936848"
            - "Order.${ord_id}.freight_fee_cents == 37474"
            - "Order.${ord_id}.contract_price_cents == 974322"
      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_line_rounding
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: each CHERRY 1-leaf line is
          raw 64392.6 cents; per-line round_half_up then sum yields 11*64393 -
          44000 = 664323, whereas sum-then-round yields 664319. The scaffold
          pins per-line-then-sum; 664323 is the only correct answer.
        test_recipe:
          setup:
            - "CHERRY/STAIN/SATIN order, INSTALLER_PREP, fire NONE; eleven openings C01..C11 each leaf_count=1 NONE (total 11 leaves -> finish tier 1.07); order CONFIGURED; drawing approved."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Cherry Lobby", site_address: "77 Vine St", contract_code: "C-3002" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-3002", species: "CHERRY", profile_code: "PR-3", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C01", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C02", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C03", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C04", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C05", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C06", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C07", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C08", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C09", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C10", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "C11", width_in: 32, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-11-15" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
          trigger:
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          assert:
            - "Order.${ord_id}.merchandise_total_cents == 664323"
            - "Order.${ord_id}.merchandise_total_cents != 664319"
            - "Order.${ord_id}.freight_fee_cents == 26573"
            - "Order.${ord_id}.contract_price_cents == 690896"
      - name: freight_keyed_on_merchandise_not_total
        grounds:
          - calculations.freight_fee_schedule
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order:
          freight tier is keyed on merchandise_total_cents ONLY (1,984,292 ->
          4% band -> 79372), NOT on contract_price_cents (2,063,664 > 2000000
          would wrongly select the 3% band -> 61910).
        test_recipe:
          setup:
            - "WALNUT/CLEAR_COAT/HIGH_GLOSS order, TEMPLATE_PREP with fire-compatible template, fire_rating_required=MIN_90; single opening X1 leaf_count=23 MIN_90 (23 leaves -> finish tier 1.07); order CONFIGURED; drawing approved."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Vault Wing", site_address: "1 Federal Pl", contract_code: "C-3003" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-FR-90", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-3003", species: "WALNUT", profile_code: "PR-9", finish_system: "CLEAR_COAT", sheen_target: "HIGH_GLOSS", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_90" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "X1", width_in: 48, height_in: 96, leaf_count: 23, fire_rating: "MIN_90", required_on_site_date: "2026-12-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
          trigger:
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          assert:
            - "Order.${ord_id}.merchandise_total_cents == 1984292"
            - "Order.${ord_id}.freight_fee_cents == 79372"
            - "Order.${ord_id}.freight_fee_cents != 61910"
            - "Order.${ord_id}.contract_price_cents == 2063664"

  # ==================================================================
  # Rule 3 — non_linear_state_machine (cycle on ShopDrawing; parallel axes on Opening)
  # ==================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: shop_drawing_revision_cycle_with_supersede
        grounds:
          - state_machines.ShopDrawing.DRAFT_to_SUBMITTED
          - state_machines.ShopDrawing.SUBMITTED_to_REJECTED
          - state_machines.ShopDrawing.SUBMITTED_to_APPROVED
          - state_machines.ShopDrawing.APPROVED_to_SUPERSEDED
          - state_machines.MillworkOrder.APPROVED_to_CONFIGURED
        distinguishing_aspect: |
          Cyclic machine on ShopDrawing (different entity than Opening below):
          rev1 SUBMITTED->REJECTED loops the order back to CONFIGURED; rev2 is
          approved; a change-order supersedes rev2 and rev3 is drafted,
          submitted and approved — DRAFT->SUBMITTED->APPROVED->SUPERSEDED and
          the order cycles APPROVED->CONFIGURED->SUBMITTED->APPROVED.
        test_recipe:
          setup:
            - "MAPLE order TEMPLATE_PREP MIN_20 with one 1-leaf rated opening; rev1 created, submitted, REJECTED by arch-1."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Cycle Proj", site_address: "5 Elm St", contract_code: "C-4001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-C1", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-4001", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v1: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v1}" }, as: Estimator, captures: { drw1: $.data.id, rev1_no: $.data.revision_no } }
            - { call: "PUT /millwork/shop-drawings/${drw1}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw1}/status", payload: { target_status: "REJECTED", review_note: "redesign stile" }, as: Architect, as_user_id: "arch-1" }
          trigger:
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v2: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v2}" }, as: Estimator, captures: { drw2: $.data.id, rev2_no: $.data.revision_no, rev2_sup: $.data.supersedes_drawing_id } }
            - { call: "PUT /millwork/shop-drawings/${drw2}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw2}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/orders/${ord_id}/change-order", as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v3: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v3}" }, as: Estimator, captures: { drw3: $.data.id, rev3_no: $.data.revision_no, rev3_sup: $.data.supersedes_drawing_id } }
          assert:
            - "captured ${rev1_no} == 1 and captured ${rev2_no} == 2 and captured ${rev3_no} == 3"
            - "captured ${rev2_sup} == ${drw1} and captured ${rev3_sup} == ${drw2}"
            - "ShopDrawing.${drw1}.status == REJECTED"
            - "ShopDrawing.${drw2}.status == SUPERSEDED"
            - "ShopDrawing.${drw3}.status == DRAFT"
            - "Order.${ord_id}.status == CONFIGURED and Order.${ord_id}.config_locked == false"
      - name: opening_parallel_fab_ship_axes
        grounds:
          - state_machines.Opening
        distinguishing_aspect: |
          Parallel state dimensions on Opening (different entity than
          ShopDrawing above): the ship axis advances UNSCHEDULED->SCHEDULED->
          SHIPPED->DELIVERED while the fab axis stays pinned at STAGED; the two
          axes evolve independently and a fab re-trigger (STAGED->STAGED) is
          rejected as an invalid transition.
        test_recipe:
          setup:
            - "Unrated PAINT_GRADE order driven through production and finishing; single opening O staged and assigned to a trip that is then DEPARTED and DELIVERED."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Parallel Proj", site_address: "8 Dock Ave", contract_code: "C-4002" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-4002", species: "PAINT_GRADE", profile_code: "PR-1", finish_system: "PAINT", sheen_target: "MATTE", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "P1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-05" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 45 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-P", supported_species: ["PAINT_GRADE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 6, end_hour: 8 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-P" }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 8, cure_end_hour: 12 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 14.5 }, as: QAInspector }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-P", truck_capacity_leaves: 4, departure_date: "2026-10-01", site_arrival_date: "2026-10-03" }, as: PlantManager, captures: { trip_id: $.data.id } }
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator }
          trigger:
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DEPARTED" }, as: ShippingCoordinator }
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DELIVERED" }, as: ShippingCoordinator }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead, captures: { err: $.data.error_id } }
          assert:
            - "Opening.${op1}.ship_status == DELIVERED and Opening.${op1}.fab_status == STAGED (axes moved independently)"
            - "captured ${err} == ERR_INVALID_OPENING_STATUS_TRANSITION (fab STAGED->STAGED rejected while ship is DELIVERED)"
            - "DeliveryTrip.${trip_id}.status == DELIVERED"

  # ==================================================================
  # Rule 4 — transitive_cascade (change-order chain depth 3; punch chain depth 3)
  # ==================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_supersede_cascade
        grounds:
          - state_machines.MillworkOrder.APPROVED_to_CONFIGURED
          - state_machines.ShopDrawing.APPROVED_to_SUPERSEDED
          - state_machines.MachiningProgram.SETUP_BOOKED_to_VOIDED
          - state_machines.MoulderSetupSlot.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 caused-by chain from trigger POST change-order: order
          change-order mutates drawing (APPROVED->SUPERSEDED); that mutation
          voids its programs (CREATED/SETUP_BOOKED/PROVEN->VOIDED); each
          program void cancels its BOOKED slots (->CANCELLED). Different
          trigger than the punch cascade below.
        test_recipe:
          setup:
            - "Rated MAPLE order APPROVED via drawing rev1; program created on rev1 and a moulder slot BOOKED (program SETUP_BOOKED)."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Cascade Proj", site_address: "12 Mill Rd", contract_code: "C-5001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-C5", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-5001", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-C", supported_species: ["MAPLE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 10, end_hour: 12 }, as: ProductionLead, captures: { slot_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/orders/${ord_id}/change-order", as: Estimator }
          assert:
            - "ShopDrawing.${drw_id}.status == SUPERSEDED"
            - "MachiningProgram.${prog_id}.status == VOIDED"
            - "MoulderSetupSlot.${slot_id}.status == CANCELLED"
            - "Order.${ord_id}.status == CONFIGURED and Order.${ord_id}.config_locked == false"
      - name: punch_rework_relabel_cascade
        grounds:
          - state_machines.PunchItem.TRIAGED_to_REWORK_AUTHORIZED
          - state_machines.LabelAllocation.VERIFIED_to_VOIDED
          - calculations.label_serial_accounting
        distinguishing_aspect: |
          Depth-3 caused-by chain from trigger PUT punch REWORK_AUTHORIZED:
          punch authorization mutates the opening (STAGED->REWORK); that
          mutation voids its VERIFIED label allocation (->VOIDED); each void
          rewrites roll accounting (serials_applied-1, serials_spoiled+1,
          version bumped). Different trigger than the change-order cascade.
        test_recipe:
          setup:
            - "Rated MIN_20 order (1 opening, 1 leaf) fully driven: FINISHED -> label issued (roll UL_20MIN capacity 2) -> APPLIED -> VERIFIED -> STAGED -> assigned -> trip DEPARTED -> DELIVERED; MAJOR FINISH_DEFECT punch reported by qa-9 and TRIAGED by qa-1."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Rework Proj", site_address: "3 Site Ln", contract_code: "C-5002" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-R1", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-5002", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "R1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "MIN_20", required_on_site_date: "2026-10-10" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-R", supported_species: ["MAPLE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 10 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-R" }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 16 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 35 }, as: QAInspector }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 2 }, as: PlantManager, captures: { roll_id: $.data.id } }
            - { call: "GET /millwork/fire-label-rolls/${roll_id}", as: Any, captures: { roll_v: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_id}", expected_roll_version: "${roll_v}" }, as: LabelAuthority, as_user_id: "la-1", captures: { alloc_id: $.data.id } }
            - { call: "PUT /millwork/label-allocations/${alloc_id}/status", payload: { target_status: "APPLIED" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "PUT /millwork/label-allocations/${alloc_id}/status", payload: { target_status: "VERIFIED" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-R", truck_capacity_leaves: 5, departure_date: "2026-10-08", site_arrival_date: "2026-10-10" }, as: PlantManager, captures: { trip_id: $.data.id } }
            - { call: "POST /millwork/delivery-trips/${trip_id}/assign", payload: { opening_id: "${op1}" }, as: ShippingCoordinator }
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DEPARTED" }, as: ShippingCoordinator }
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DELIVERED" }, as: ShippingCoordinator }
            - { call: "POST /millwork/punch-items", payload: { opening_id: "${op1}", category: "FINISH_DEFECT", severity: "MAJOR", description: "sheen burn-through at rail" }, as: QAInspector, as_user_id: "qa-9", captures: { punch_id: $.data.id } }
            - { call: "PUT /millwork/punch-items/${punch_id}/status", payload: { target_status: "TRIAGED" }, as: QAInspector, as_user_id: "qa-1" }
          trigger:
            - { call: "PUT /millwork/punch-items/${punch_id}/status", payload: { target_status: "REWORK_AUTHORIZED" }, as: PlantManager }
          assert:
            - "Opening.${op1}.fab_status == REWORK and Opening.${op1}.ship_status == PUNCH_LISTED"
            - "LabelAllocation.${alloc_id}.status == VOIDED"
            - "FireLabelRoll.${roll_id}.serials_applied == 0 and FireLabelRoll.${roll_id}.serials_spoiled == 1"
            - "FireLabelRoll.${roll_id}.serials_available == 1 and serials_issued == 0 (invariant: 0+0+1+1 == 2 == serial_capacity)"

  # ==================================================================
  # Rule 5 — priority_pair_validation_conflict (three different category pairs)
  # ==================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: label_issue_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_OPENING_NOT_FINISH_PASSED]
          - errors[ERR_INSUFFICIENT_LABEL_SERIALS]
        distinguishing_aspect: |
          Category pair state-vs-fiscal: the issue request violates BOTH the
          state gate (opening fab_status QUEUED, priority 4) AND the quota gate
          (leaf_count 2 > serials_available 1, priority 9); the state error
          ERR_OPENING_NOT_FINISH_PASSED must win.
        test_recipe:
          setup:
            - "Rated MIN_20 TEMPLATE_PREP order still DRAFT; opening Q1 leaf_count=2 MIN_20 (fab QUEUED); UL_20MIN roll with serial_capacity=1 (fiscal would also fail)."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Prio Proj", site_address: "2 Gate St", contract_code: "C-6001" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-P1", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-6001", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "Q1", width_in: 36, height_in: 84, leaf_count: 2, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 1 }, as: PlantManager, captures: { roll_id: $.data.id, roll_v: $.data.version } }
          trigger:
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_id}", expected_roll_version: "${roll_v}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_OPENING_NOT_FINISH_PASSED"
            - "captured ${err} != ERR_INSUFFICIENT_LABEL_SERIALS"
      - name: slot_booking_safety_beats_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_MACHINE_SPECIES_UNSUPPORTED]
          - errors[ERR_MACHINE_SLOT_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety-vs-business_constraint (different pair
          than label_issue_state_beats_fiscal): booking violates BOTH species
          capability (machine supports OAK only, order is MAPLE, priority 5)
          AND interval overlap (11<12 against an existing [10,12) slot,
          priority 6); ERR_MACHINE_SPECIES_UNSUPPORTED must win.
        test_recipe:
          setup:
            - "Order A (OAK) APPROVED with program PA; machine M supports [OAK] only; slot [10,12) BOOKED for PA. Order B (MAPLE) APPROVED with program PB (CREATED)."
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "Safety Proj", site_address: "6 Forge Way", contract_code: "C-6002" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-A", species: "OAK", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_a: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_a}", opening_no: "A1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_a}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_a}", as: Any, captures: { ord_a_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_a}", expected_order_version: "${ord_a_v}" }, as: Estimator, captures: { drw_a: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_a}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_a}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_a}", order_id: "${ord_a}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_a: $.data.id } }
