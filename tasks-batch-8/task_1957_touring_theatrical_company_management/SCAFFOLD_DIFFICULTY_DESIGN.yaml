              captures: { p2: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "U1", contract_type: UNDERSTUDY, weekly_salary_cents: 500000 }
              as: CompanyManager
              captures: { u1: "$.data.id "}
            - call: "PUT /cast/${p1}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${p2}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${u1}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Lead", required_covers: 1, principal_member_id: "${p1}" }
              as: CompanyManager
              captures: { t1: "$.data.id "}
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Villain", required_covers: 1, principal_member_id: "${p2}" }
              as: CompanyManager
              captures: { t2: "$.data.id "}
            - call: "POST /tracks/${t1}/coverages"
              payload: { cast_member_id: "${u1}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
              captures: { cov1: "$.data.id "}
            - call: "POST /tracks/${t2}/coverages"
              payload: { cast_member_id: "${p1}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
              captures: { cov2: "$.data.id "}
          trigger:
            - call: "POST /cast/${p1}/injuries"
              payload: { notes: "ankle" }
              as: CompanyManager
              captures: { inj: "$.data.id", inj_status: "$.data.status "}
            - call: "GET /cast/${p1}"
              as: CompanyManager
              captures: { p1_status: "$.data.status "}
            - call: "GET /tracks/${t1}/coverages"
              as: CompanyManager
              captures: { cov1_after: "$.data[0].status" }
            - call: "GET /tracks/${t2}/coverages"
              as: CompanyManager
              captures: { cov2_after: "$.data[0].status" }
            - call: "GET /tracks/${t1}"
              as: CompanyManager
              captures: { t1_avail: "$.data.available_covers", t1_exp: "$.data.exposed "}
            - call: "GET /tracks/${t2}"
