# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Document Shredding & Records Storage — Expert band
# Nine §0.5 rules x 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1-§1.7. Formula-derived asserts are pre-computed literals.
# Rate card used throughout (unless noted):
#   scheduled=5 c/kg, onetime=8 c/kg, onsite_trip=2500, console_swap=1000,
#   storage=300 c/box/period, retrieval=4000, rush=15000 bps (1.5x)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: destruction_charge_estimated_vs_actual_on_order
        grounds:
          - calculations.destruction_charge
          - entities.ServiceOrder.fields.order_charge_cents
          - entities.ServiceOrder.fields.billed_weight_kg
          - state_machines.ServiceOrder.EN_ROUTE_to_ON_SITE_SHREDDED
        distinguishing_aspect: "On the ServiceOrder domain, the estimated variant (sum of capacity_kg) and the actual variant (WeightTicket.net_weight_kg) produce different order_charge_cents (4900 vs 4785) from identical rate inputs."
        test_recipe:
          setup:
            - "ACTIVE account with an ACTIVE rate card (scheduled=5, onsite_trip=2500, console_swap=1000)"
            - "Two CONSOLE containers: capacity 50/tare 8.0 and capacity 30/tare 5.0; estimate weight 80kg -> est charge 4900"
            - "ON_SITE SCHEDULED order over both containers, dispatched, weighed-in at gross 70.0 (net 57.0)"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Acme", compliance_regime: "FACTA", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 30, tare_weight_kg: 5.0 }
              as: AccountManager
              captures: { c2: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}", "${c2}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id, est_charge: $.data.order_charge_cents }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 70.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /service-orders/${order_id}/shred-on-site"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { final_charge: $.data.order_charge_cents }
          assert:
            - "ServiceOrder.${order_id}.order_charge_cents == 4785"
            - "ServiceOrder.${order_id}.billed_weight_kg == 57.0"
            - "the estimate captured at create (est_charge) == 4900, differing from the final 4785"

      - name: storage_invoice_credit_variant_on_account
        grounds:
          - calculations.storage_invoice_total
          - entities.ServiceAccount.fields.storage_credit_cents
          - entities.StorageInvoice.fields.credit_applied_cents
          - entities.StorageInvoice.fields.amount_due_cents
        distinguishing_aspect: "On the ServiceAccount/StorageInvoice domain (different from destruction_charge's ServiceOrder), the with_credit variant yields amount_due 5600 while the without_credit variant on the same gross yields 6600."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE rate card (storage=300, retrieval=4000, rush=1.5x)"
            - "Two boxes shelved and STORED at period 0 with free_periods 0 (both billable at period-0 close)"
            - "One RUSH retrieval fulfilled in period 0 -> retrieval_charge 6000; account credited 1000 cents"
            - "gross = 2*300 + 6000 = 6600; credit 1000 applied -> amount_due 5600"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "BoxCo", compliance_regime: "HIPAA", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000, rush_retrieval_multiplier_bps: 15000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1", free_periods: 0 }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-2", free_periods: 0 }
              as: AccountManager
              captures: { box2: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /retention-boxes/${box2}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /retrieval-requests"
              payload: { box_id: "${box1}", account_id: "${acct_id}", priority: "RUSH", requested_by: "mgr-1" }
              as: AccountManager
              captures: { rr_id: $.data.id }
            - call: "POST /retrieval-requests/${rr_id}/fulfill"
              payload: {}
              as: PlantOperator
            - call: "POST /accounts/${acct_id}/credit"
              payload: { amount_cents: 1000 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /accounts/${acct_id}/advance-period"
              payload: {}
              as: ComplianceOfficer
              captures: { inv_id: $.data.id, due: $.data.amount_due_cents }
          assert:
            - "StorageInvoice.${inv_id}.storage_line_cents == 600"
            - "StorageInvoice.${inv_id}.retrieval_line_cents == 6000"
            - "StorageInvoice.${inv_id}.credit_applied_cents == 1000"
            - "StorageInvoice.${inv_id}.amount_due_cents == 5600"
            - "ServiceAccount.${acct_id}.storage_credit_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: destruction_charge_multi_input_nonlinear
        grounds:
          - calculations.destruction_charge
          - entities.ServiceOrder.fields.service_mode
          - entities.ServiceOrder.fields.cadence
          - entities.Container.fields.container_type
        distinguishing_aspect: "Mode (a): destruction_charge combines >=3 inputs with conditional branches — cadence selects the per-kg rate, service_mode toggles the trip fee, and only CONSOLE-typed containers add console fees (4900 = 80*5 + 2500 + 2*1000)."
        test_recipe:
          setup:
            - "ACTIVE account+rate card; ON_SITE SCHEDULED order with one CONSOLE (cap 50/tare 8.0) and one BIN (cap 30/tare 5.0)"
            - "Estimate weight 80; rate 5 -> 400; trip 2500 (ON_SITE); console fee 1000 (only the CONSOLE) -> 2900 base ... 400+2500+1000 = 3900"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Combo", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "BIN", capacity_kg: 30, tare_weight_kg: 5.0 }
              as: AccountManager
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}", "${c2}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z" }
              as: AccountManager
              captures: { order_id: $.data.id, charge: $.data.order_charge_cents }
          assert:
            - "ServiceOrder.${order_id}.order_charge_cents == 3900"
            - "ServiceOrder.${order_id}.billed_weight_kg == 80"

      - name: storage_invoice_pinned_evaluation_order
        grounds:
          - calculations.storage_invoice_total
          - entities.StorageInvoice.fields.amount_due_cents
          - entities.StorageInvoice.fields.credit_applied_cents
          - entities.ServiceAccount.fields.storage_credit_cents
        distinguishing_aspect: "Mode (c): storage_invoice_total has a pinned evaluation order — gross = storage_line + retrieval_line must be computed before credit_applied = min(credit, gross), and amount_due = gross - credit_applied; reversing the order would mis-cap the credit."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE rate card (storage=300)"
            - "One box shelved STORED at period 0, free_periods 0; no retrievals"
            - "Account credit 5000 (exceeds gross 300) -> credit_applied capped at gross 300, amount_due 0, credit_after 4700"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "EvalCo", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1", free_periods: 0 }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /accounts/${acct_id}/credit"
              payload: { amount_cents: 5000 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /accounts/${acct_id}/advance-period"
              payload: {}
              as: ComplianceOfficer
              captures: { inv_id: $.data.id }
          assert:
            - "StorageInvoice.${inv_id}.storage_line_cents == 300"
            - "StorageInvoice.${inv_id}.credit_applied_cents == 300"
            - "StorageInvoice.${inv_id}.amount_due_cents == 0"
            - "ServiceAccount.${acct_id}.storage_credit_cents == 4700"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_order_branching_fork_onsite_vs_plant
        grounds:
          - state_machines.ServiceOrder.SCHEDULED_to_EN_ROUTE
          - state_machines.ServiceOrder.EN_ROUTE_to_ON_SITE_SHREDDED
          - state_machines.ServiceOrder.EN_ROUTE_to_PICKED_UP
        distinguishing_aspect: "ServiceOrder is branching fork-join: from EN_ROUTE an ON_SITE order forks to ON_SITE_SHREDDED (terminal, certificate issued) while an OFF_SITE order forks to PICKED_UP->AT_PLANT->DESTROYED, with divergent side-effect sets per branch."
        test_recipe:
          setup:
            - "ACTIVE account+rate card; ON_SITE SCHEDULED order over one CONSOLE, dispatched to EN_ROUTE, weighed-in"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Fork", compliance_regime: "FACTA", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 70.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /service-orders/${order_id}/shred-on-site"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { st: $.data.status }
          assert:
            - "ServiceOrder.${order_id}.status == ON_SITE_SHREDDED"
            - "GET /certificates?order_id=${order_id} returns exactly one DestructionCertificate with status ISSUED (the on-site branch's distinct side effect)"

      - name: retrieval_request_refuse_return_cycle
        grounds:
          - state_machines.RetrievalRequest.DELIVERED_to_RETURN_PENDING
          - state_machines.RetrievalRequest.RETURN_PENDING_to_DELIVERED
          - state_machines.RetrievalRequest.RETURN_PENDING_to_RETURNED
        distinguishing_aspect: "RetrievalRequest (distinct entity from ServiceOrder) has a cycle: RETURN_PENDING loops back to DELIVERED via refuse-return, so the request can re-enter the return flow rather than progressing only forward."
        test_recipe:
          setup:
            - "ACTIVE account+rate card; box shelved STORED; STANDARD retrieval fulfilled (DELIVERED), start-return moves to RETURN_PENDING"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Cycle", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1" }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /retrieval-requests"
              payload: { box_id: "${box1}", account_id: "${acct_id}", priority: "STANDARD", requested_by: "mgr-1" }
              as: AccountManager
              captures: { rr_id: $.data.id }
            - call: "POST /retrieval-requests/${rr_id}/fulfill"
              payload: {}
              as: PlantOperator
            - call: "POST /retrieval-requests/${rr_id}/start-return"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /retrieval-requests/${rr_id}/refuse-return"
              payload: {}
              as: PlantOperator
              captures: { st: $.data.status }
          assert:
            - "RetrievalRequest.${rr_id}.status == DELIVERED"
            - "RetentionBox.${box1}.status == OUT_FOR_RETRIEVAL (box stays out on refused return)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: destroy_to_certificate_to_invoice_depth3
        grounds:
          - state_machines.ServiceOrder.AT_PLANT_to_DESTROYED
          - entities.DestructionCertificate.fields.status
          - entities.DestructionInvoice.fields.line_cents
          - calculations.destruction_invoice_total
        distinguishing_aspect: "Depth-3 cascade from the /destroy transition: order is finalized -> that finalization auto-issues a DestructionCertificate -> the certificate issuance itself creates a DestructionInvoice whose line_cents == order_charge_cents; each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "ACTIVE account+rate card; OFF_SITE_PICKUP ONE_TIME order over one BIN (cap 40/tare 4.0), assigned_tech_id tech-1"
            - "Dispatched, confirm-pickup, weigh-in gross 36.0 (net 32.0), received at plant -> AT_PLANT; final charge 256 (32*8)"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Casc", compliance_regime: "HIPAA", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "BIN", capacity_kg: 40, tare_weight_kg: 4.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "OFF_SITE_PICKUP", cadence: "ONE_TIME", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/confirm-pickup"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 36.0 }
              as: PlantOperator
            - call: "POST /service-orders/${order_id}/receive-at-plant"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /service-orders/${order_id}/destroy"
              payload: { witnessed_by: "witness-9" }
              as: DestructionWitness
              as_user_id: "witness-9"
          assert:
            - "ServiceOrder.${order_id}.status == DESTROYED"
            - "GET /certificates?order_id=${order_id} returns one DestructionCertificate, status ISSUED, destroyed_weight_kg == 32.0"
            - "GET /destruction-invoices?order_id=${order_id} returns one DestructionInvoice with line_cents == 256"

      - name: fulfill_request_drives_box_depth2
        grounds:
          - state_machines.RetrievalRequest.PENDING_to_DELIVERED
          - state_machines.RetentionBox.STORED_to_OUT_FOR_RETRIEVAL
          - entities.RetrievalRequest.fields.retrieval_charge_cents
        distinguishing_aspect: "Depth-2 cascade originating from the /fulfill transition (a different trigger than /destroy): the request moving PENDING->DELIVERED itself drives the box STORED->OUT_FOR_RETRIEVAL."
        test_recipe:
          setup:
            - "ACTIVE account+rate card; box shelved STORED; STANDARD retrieval PENDING"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Drive", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1" }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /retrieval-requests"
              payload: { box_id: "${box1}", account_id: "${acct_id}", priority: "STANDARD", requested_by: "mgr-1" }
              as: AccountManager
              captures: { rr_id: $.data.id }
          trigger:
