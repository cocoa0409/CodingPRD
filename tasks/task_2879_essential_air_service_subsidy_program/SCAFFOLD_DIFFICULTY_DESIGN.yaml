            - "Level 3 — Community.${comm_id}.status == HOLD_IN and active_agreement_count == 0"
            - "Level 4 — GET /eas/communities/${comm_id}/solicitations with created_reason REPLACEMENT returns exactly one row"
            - "Level 4 — Solicitation.${rep_sol_id}.status == OPEN, round_number == 1, created_reason == REPLACEMENT"
            - "Level 4 — Solicitation.${rep_sol_id}.closes_at == 2026-09-30T00:00:00Z"
            - "Level 4 — Solicitation.${rep_sol_id}.community_id == ${comm_id} and preference_filing_count == 0"
            - "Solicitation.${sol1_id}.status stays AWARDED and Proposal.${p1_id}.evaluation_state stays SELECTED"

      - name: deficient_review_cascade_suspends_carrier_agreement_and_community
        grounds:
          - calculations.carrier_completion_factor
          - calculations.carrier_performance_scoring
          - state_machines.Carrier
          - state_machines.ServiceAgreement
          - state_machines.Community
          - endpoints.POST_/eas/performance-reviews
        chain_depth: 5
        chain: "POST /eas/performance-reviews computing completion_factor 0.8173 -> tier DEFICIENT -> Carrier ACTIVE -> SUSPENDED -> the reviewed ServiceAgreement ACTIVE -> SUSPENDED -> Community SUBSIDIZED -> HOLD_IN -> a REPLACEMENT Solicitation is opened, with action_taken written back as AGREEMENT_SUSPENDED_AND_HOLD_IN"
        distinguishing_aspect: |
          The origin of this cascade is a *computed* value, not an action enum: whether five entities
          move at all depends on which side of TIER_WATCH_MIN the completion factor lands. It is also
          the only cascade that suspends the Carrier itself, so it is the only one that can strand a
          carrier's other agreements, and it reaches the community HOLD_IN state without any petition.
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under an ACTIVE agreement (Prairie Air, 1600000.00, min_monthly_seats 1976)."
            - "Its 2026-08 period is CERTIFIED with 104 scheduled, 85 completed, 15 carrier and 4 weather cancellations, 1615 seats and 580 passengers."
