      - name: channel_settlement_incentive_tier_keyed_on_provisional_total
        mode: c
        grounds:
          - calculations.channel_settlement_total
          - entities.Booking.fields.commission_cents
          - entities.Booking.fields.incentive_credit_cents
          - entities.Booking.fields.channel_settlement_total_cents
          - state_machines.Booking.booking_status.HELD_to_TICKETED
        distinguishing_aspect: |
          The incentive tier is keyed on provisional_total_cents (step 4), never on the final
          channel_settlement_total_cents (step 7). Fare 27523 at 900bp commission gives
          commission 2477 and provisional 30000 - exactly ON the 30000 tier boundary - so the
          150bp tier applies and 450 cents are credited, landing the settlement at 29550,
          which is BELOW that same boundary. An implementation that re-derived the tier from
          the settled 29550 would report incentive_tier 0, credit 0 and a total of 30000.
        test_recipe:
