      - 'the rejected update mutated nothing: PartOrder.${o1}.parts_subtotal_cents was already 1673 before it and the order stayed DRAFT'
      - PartOrder.${o1}.version advanced only on the accepted update
- rule_id: cross_entity_state_dependency
  instances:
  - name: loan_inspection_requires_live_loaned_order
    grounds:
    - state_machines.ToolLoan.field.status.transitions.RETURNED_to_INSPECTED
    - state_machines.PartOrder.field.status.transitions.CONFIRMED_to_VOID
    - entities.ToolLoan.fields.loaned_order_id
    - errors[ERR_RETURN_DESK_STOP_MISSING]
    distinguishing_aspect: 'The ToolLoan to PartOrder pair: a returned tool''s valid next state is

      INSPECTED only while the part order that carried the loan is still

      live, and voiding that order freezes the loan with no mutation on the

      loan row at all.

      '
    test_recipe:
      setup:
      - Satellite s_sat with stock; account A carries order O1 plus loan L1 whose loaned_order_id is O1
      - L1 is checked out, then returned, so it sits in RETURNED with a held deposit
      - A RETURN_DESK stop exists so the desk precondition is satisfied independently
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Loan Dep Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: PLUG-100
          description: Spark Plug Set
          line_code: IGN
          list_price_cents: 1673
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_plug: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
