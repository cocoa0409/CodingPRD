      - name: prize_distribution_void_restores_the_gross_prize_ledger_and_org_payable
        grounds:
          - calculations.prize_ledger_conservation
          - state_machines.PrizeDistribution.APPROVED_to_VOIDED
          - entities.PrizeDistribution.fields.unallocated_cents
          - entities.Organization.fields.prize_payable_cents
        distinguishing_aspect: |
          A different conserved quantity, INVARIANT_PRIZE: gross_prize_cents ==
          association_levy_cents + org_share_cents + allocated_cents + unallocated_cents. The void is
          the compensating action for calculate: every allocation moves to VOIDED, the four money
          fields collapse back to 0 and unallocated_cents returns to the full 10000000, while
          Organization.prize_payable_cents gives back exactly the 3412500 that calculate had added.
          The invariant is checked at all three states (DRAFT, APPROVED, VOIDED).
        test_recipe:
          setup:
            - "One league with player_association_levy_bp 250; one US-CA organization with org_prize_share_bp 3500"
            - "One ACTIVE contract effective 2026-08-05 with prize_split_player_pct_bp 4000 for an adult US-CA resident"
            - "One DRAFT PrizeDistribution of 10000000 cents with tournament_end_at 2026-08-20, calculated by finance-1 and approved by admin-1"
            - "Logical clock at 2026-08-21T00:00:00Z"
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, min_roster_size: 1, max_roster_size: 7, offer_response_window_hours: 72, player_association_levy_bp: 250, association_min_prize_split_bp: 4000, association_max_streaming_hours_per_week: 20, tryout_required_before_offer: false }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000, org_prize_share_bp: 3500 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "JP", association_member: true, education_enrollment_status: "NOT_ENROLLED" }
              as: Scout
              captures: { p1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${p1_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 10, tax_residency_code: "US-CA", signing_bonus_cents: 0, buyout_multiplier_bp: 5000 }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /contract-offers/${o1_id}/accept"
              payload: { effective_at: "2026-08-05T00:00:00Z" }
              as: PlayerAgent
              as_user_id: "${p1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /prize-distributions"
              payload: { organization_id: "${org_id}", league_id: "${league_id}", tournament_name: "Summer Invitational", placement: 2, gross_prize_cents: 10000000, tournament_end_at: "2026-08-20T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "finance-1"
              captures: { pd_id: $.data.id }
            - call: "POST /prize-distributions/${pd_id}/calculate"
              as: FinanceOfficer
