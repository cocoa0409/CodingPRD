      - name: the_ticket_closure_and_make_good_gates_all_fire_on_an_open_lot
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SALE_OUTSIDE_OPERATING_WINDOW]
          - errors[ERR_CLOSURE_OUTSIDE_OPERATING_WINDOW]
          - errors[ERR_NO_PROVISIONAL_SETTLEMENT]
          - errors[ERR_MAKEGOOD_STOP_MISMATCH]
          - errors[ERR_REFUND_NOT_ELIGIBLE]
          - errors[ERR_MAKEGOOD_CAP_EXCEEDED]
          - errors[ERR_MAKEGOOD_STATE_INVALID]
          - errors[ERR_SETTLEMENT_STATE_INVALID]
          - calculations.makegood_amount
          - calculations.stop_settlement
        distinguishing_aspect: |
          The money surface of an OPEN lot, walked once with every gate isolated so each answer is unambiguous:
          a sale dated after close_date (422), a closure that misses every daily operating window (422), a
          make-good proposed before any settlement exists (409 at 104), a make-good against a still-LOGGED closure
          (422 at 105), a CASH_REFUND against a RAIN closure (422 at 106), the guarantee-based cap
          (30 pct of 20000 = 6000, so the 9496 raw credit is clamped to 6000 on the first proposal and the second
          identical proposal breaks the cap at 93), a replayed sponsor response (409 at 44) and a reconcile on a
