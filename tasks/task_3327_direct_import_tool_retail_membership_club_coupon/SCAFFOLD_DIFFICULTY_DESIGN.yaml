            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST7", name: "Store 7", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "Cust Seven" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /coupons"
