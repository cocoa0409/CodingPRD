scaffold_corner_design:
  - section: entities
    instances:
      - name: c_create_refrigerant_program_stamps_defaults_and_active_status
        claim_type: creation
        grounds:
          - entities.RefrigerantProgram
          - endpoints.POST_/plant/refrigerant-programs
          - state_machines.RefrigerantProgram
        distinguishing_aspect: "A newly created program is ACTIVE with affected_platform_count 0, both lifecycle timestamps null, version 1, and created_at stamped from the logical clock rather than wall time."
        test_recipe:
          setup:
            - "Empty database with the logical clock explicitly set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == \"object\" and a non-empty meta.api_request_id"
            - "data.status == ACTIVE, data.affected_platform_count == 0, data.sell_through_entered_at is null, data.expired_at is null"
            - "data.refrigerant_code == \"R-454B\", data.gwp == 466, data.flammability_class == A2L"
            - "data.version == 1 and data.created_at == \"2026-08-01T00:00:00Z\""
            - "GET /plant/refrigerant-programs/${prog_id} returns the identical row"

      - name: c_get_regional_standard_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.RegionalStandard
          - endpoints.GET_/plant/regional-standards/{id}
        distinguishing_aspect: "The single-standard read returns every stored tier minimum unchanged and defaults prohibits_flammable_refrigerant to false when the field was omitted at creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE regional standard SOUTHEAST created without the prohibits_flammable_refrigerant flag."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/regional-standards"
              payload: { region_code: "SOUTHEAST", min_seer2_standard: 14.30, min_seer2_high: 15.20, min_seer2_premium: 16.00, effective_from_utc: "2026-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { std_id: $.data.id }
          trigger:
            - call: "GET /plant/regional-standards/${std_id}"
              payload: {}
              as: CertificationEngineer
          assert:
            - "HTTP 200; data.id == ${std_id}, data.region_code == \"SOUTHEAST\", data.status == ACTIVE"
            - "data.min_seer2_standard == 14.30, data.min_seer2_high == 15.20, data.min_seer2_premium == 16.00"
            - "data.prohibits_flammable_refrigerant == false - the omitted flag took its declared default"
            - "data.effective_from_utc == \"2026-01-01T00:00:00Z\""

      - name: c_list_platforms_paginates_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_/plant/product-platforms
          - response_envelope.pagination_fields
        distinguishing_aspect: "A three-row platform list served with limit 2 returns 2 items with total_count 3 and has_more true, and the offset-2 page returns the remaining 1 item with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE A1 program and three DRAFT platforms with distinct model codes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat1_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-3000-A1", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 30000, rated_eer: 12.10, rated_seer2: 15.40, compressor_part_number: "CMP-3T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat2_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-3600-A1", efficiency_tier: "PREMIUM", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.90, rated_seer2: 16.80, compressor_part_number: "CMP-5T-A1", control_board_part_number: "CTL-9X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat3_id: $.data.id }
          trigger:
            - call: "GET /plant/product-platforms?limit=2&offset=0"
              payload: { limit: 2, offset: 0 }
              as: PlantAdmin
            - call: "GET /plant/product-platforms?limit=2&offset=2"
              payload: { limit: 2, offset: 2 }
              as: PlantAdmin
            - call: "GET /plant/product-platforms?efficiency_tier=PREMIUM"
              payload: { efficiency_tier: "PREMIUM" }
              as: PlantAdmin
          assert:
            - "First trigger call: HTTP 200, response_type == \"array\", exactly 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second trigger call: exactly 1 item, total_count == 3, has_more == false"
            - "Third trigger call: exactly 1 item whose id == ${plat3_id} and total_count == 1 - the filter is applied before pagination"
            - "Every listed platform has status == DRAFT and salable_region_count == 0"

      - name: c_get_platform_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PLATFORM_NOT_FOUND
          - endpoints.GET_/plant/product-platforms/{id}
          - validations.referenced-entity-exists
        distinguishing_aspect: "A well-formed UUID that matches no stored platform returns 404 ERR_PLATFORM_NOT_FOUND in the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and no platform rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "GET /plant/product-platforms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == ERR_PLATFORM_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: c_create_platform_missing_rated_seer2_rejected
        claim_type: required_fields
        grounds:
          - validations.request-schema-shape
          - errors.ERR_INVALID_REQUEST
          - entities.ProductPlatform.fields.rated_seer2
        distinguishing_aspect: "rated_seer2 has source input and no default, so a create payload omitting it is refused with 422 ERR_INVALID_REQUEST and no platform row is written."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and one ACTIVE A1 program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 with ${err_id} == ERR_INVALID_REQUEST"
            - "GET /plant/product-platforms returns total_count == 0"
            - "RefrigerantProgram.${prog_id}.affected_platform_count == 0"

      - name: c_create_test_cell_applies_default_cooldown
        claim_type: defaults
        grounds:
          - entities.TestCell.fields.cooldown_minutes
          - endpoints.POST_/plant/test-cells
          - calculations.test_cell_window_eligibility
        distinguishing_aspect: "Omitting cooldown_minutes yields the declared default of 30, and the created cell is ACTIVE - the default is applied server-side, not left null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant/test-cells"
              payload: { cell_code: "CELL-9" }
              as: PlantAdmin
              captures: { cell_id: $.data.id }
          assert:
            - "HTTP 201; data.cooldown_minutes == 30 and data.status == ACTIVE"
            - "data.cell_code == \"CELL-9\" and data.version == 1"
            - "GET /plant/test-cells/${cell_id}/run-tests returns 0 records"

      - name: c_leak_test_record_is_immutable_without_version
        claim_type: immutability
        grounds:
          - entities.LeakTest
          - endpoints.POST_/plant/leak-tests
          - state_machines.LeakTest.CREATE_to_RECORDED
        distinguishing_aspect: "LeakTest declares common_fields false, so the created record exposes no version field and §1.5 offers no PATCH or DELETE for it - a wrong measurement is corrected by recording a new test, never by editing the old one."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED STANDARD-tier A1 platform with one lot at BRAZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 8, scheduled_start_utc: "2026-08-05T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /plant/build-orders/${bo_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
          trigger:
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo_id}", method: "PRESSURE_DECAY", decay_kpa: 1.50, hold_minutes: 15 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
              captures: { lt_id: $.data.id }
          assert:
            - "HTTP 201; the response body carries no version field and no updated_at field"
            - "data.applied_limit == 2.00 and data.verdict == PASS (A1 class factor 1.000 over a 15-minute hold)"
            - "data.performed_by_user_id == \"user-qt-1\" and data.performed_at == \"2026-08-01T00:00:00Z\""
            - "GET /plant/leak-tests?build_order_id=${bo_id} returns exactly 1 record whose id == ${lt_id}"
            - "BuildOrder.${bo_id}.status == LEAK_PASSED"

      - name: c_create_certification_for_unknown_platform_not_found
        claim_type: parent_relationships
        grounds:
          - validations.referenced-entity-exists
          - errors.ERR_PLATFORM_NOT_FOUND
          - entities.CertificationRecord.fields.platform_id
        distinguishing_aspect: "The flat topology validates the platform_id foreign key before any concurrency or business rule, so a certification naming an unknown platform returns 404 ERR_PLATFORM_NOT_FOUND rather than 412 on the version token that travels with it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One RELEASED platform exists, whose version is captured only to supply a well-formed OCC token; the certification names a different, non-existent platform id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/regional-standards"
              payload: { region_code: "SOUTHEAST", min_seer2_standard: 14.30, min_seer2_high: 15.20, min_seer2_premium: 16.00, effective_from_utc: "2026-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { std_id: $.data.id }
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
              captures: { plat_v: $.data.version }
          trigger:
            - call: "POST /plant/certification-records"
              payload: { platform_id: "00000000-0000-4000-8000-000000000000", region_code: "SOUTHEAST", rated_seer2_submitted: 14.60, expected_platform_version: "${plat_v}" }
              as: CertificationEngineer
              as_user_id: "user-ce-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with ${err_id} == ERR_PLATFORM_NOT_FOUND"
            - "GET /plant/certification-records returns total_count == 0"
            - "ProductPlatform.${plat_id}.version == ${plat_v} - the refused call bumped nothing"

      - name: c_component_supply_effective_units_derived_at_creation
        claim_type: computed_fields
        grounds:
          - calculations.supply_effective_capacity
          - entities.ComponentSupply.fields.effective_allocatable_units
          - entities.ComponentSupply.fields.available_units
        distinguishing_aspect: "A brand-new supply row derives effective_allocatable_units from total_allocatable_units at derate_pct 0 and reports available_units equal to it, with reserved and committed at 0 - the conserved identity holds from the first write."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant/component-supplies"
              payload: { component_type: "COMPRESSOR", part_number: "CMP-5T-A2L", supplier_lot_code: "LOT-CMP-77", supply_month: "2026-11", total_allocatable_units: 140 }
              as: SupplyPlanner
              captures: { cmp_id: $.data.id }
          assert:
            - "HTTP 201; data.status == ACTIVE, data.derate_pct == 0, data.effective_allocatable_units == 140"
            - "data.reserved_units == 0, data.committed_units == 0, data.available_units == 140"
            - "data.allocation_policy == PRIORITY_WATERFALL - the omitted policy took its declared default"
            - "Conservation holds: 140 == 140 + 0 + 0"
            - "GET /plant/component-supplies/${cmp_id}/allocation-lines returns 0 records"

  - section: state_machines
    instances:
      - name: c_program_expire_before_deadline_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RefrigerantProgram.SELL_THROUGH_to_EXPIRED
          - validations.sell-through-deadline-not-reached
          - errors.ERR_SELL_THROUGH_DEADLINE_NOT_REACHED
        distinguishing_aspect: "Expiry is refused while the logical clock is one day short of sell_through_deadline_utc, even though the program is correctly in SELL_THROUGH; the program keeps its status and its expired_at stays null."
        test_recipe:
          setup:
            - "An A1 program with manufacture_cutoff_utc 2026-10-01T00:00:00Z and sell_through_deadline_utc 2027-04-01T00:00:00Z."
            - "Logical clock advanced to 2026-10-02T00:00:00Z and the program moved to SELL_THROUGH."
            - "Logical clock then advanced to 2027-03-31T00:00:00Z, one day before the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2026-10-01T00:00:00Z", sell_through_deadline_utc: "2027-04-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs/${prog_id}/enter-sell-through"
              payload: {}
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-31T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant/refrigerant-programs/${prog_id}/expire"
              payload: {}
              as: PlantAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with ${err_id} == ERR_SELL_THROUGH_DEADLINE_NOT_REACHED"
            - "RefrigerantProgram.${prog_id}.status == SELL_THROUGH and expired_at is null"
            - "RefrigerantProgram.${prog_id}.sell_through_entered_at == \"2026-10-02T00:00:00Z\""

      - name: c_program_enter_sell_through_before_cutoff_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RefrigerantProgram.ACTIVE_to_SELL_THROUGH
          - validations.manufacture-cutoff-not-reached
          - errors.ERR_MANUFACTURE_CUTOFF_NOT_REACHED
        distinguishing_aspect: "Sell-through cannot be entered while manufacturing is still legal: at 2026-08-01 against a 2026-10-01 cutoff the call is refused and none of the four cascade hops fires, so the platform stays RELEASED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An A1 program with manufacture_cutoff_utc 2026-10-01T00:00:00Z and one RELEASED platform on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2026-10-01T00:00:00Z", sell_through_deadline_utc: "2027-04-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
          trigger:
            - call: "POST /plant/refrigerant-programs/${prog_id}/enter-sell-through"
              payload: {}
              as: PlantAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with ${err_id} == ERR_MANUFACTURE_CUTOFF_NOT_REACHED"
            - "RefrigerantProgram.${prog_id}.status == ACTIVE and sell_through_entered_at is null"
            - "ProductPlatform.${plat_id}.status == RELEASED - HOP 1 of the cascade did not fire"
            - "RefrigerantProgram.${prog_id}.affected_platform_count == 1"

      - name: c_platform_starts_in_draft_with_zeroed_counters
        claim_type: initial_state
        grounds:
          - state_machines.ProductPlatform.CREATE_to_DRAFT
          - entities.ProductPlatform.fields.status
          - entities.ProductPlatform.fields.revision_round
          - entities.RefrigerantProgram.fields.affected_platform_count
        distinguishing_aspect: "A created platform is DRAFT with revision_round 0, empty blocked_region_codes, warranty_posture OK, and every unit counter at 0, and the parent program's affected_platform_count immediately reads 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and one ACTIVE A2L program with no platforms."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
