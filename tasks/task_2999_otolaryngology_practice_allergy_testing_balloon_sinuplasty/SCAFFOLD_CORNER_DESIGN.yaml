          rationale: "The named §1.8 instance walks touching, overlapping and near-adjacent intervals on one scope and separates the closed-interval error from the 45-minute buffer error at their exact boundaries."

      - name: block_window_and_capacity_errors_on_booking_create
        claim_type: violation_to_error
        grounds:
