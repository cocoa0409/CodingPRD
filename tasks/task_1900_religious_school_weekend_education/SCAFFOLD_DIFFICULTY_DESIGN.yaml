            - "After the sixth ABSENT: Milestone.${m_id}.status == TRACKING (automatic ELIGIBLE -> TRACKING revert)"
            - "Milestone.${m_id}.current_attendance_pct == 66.67 (4.0 / 6)"

      - name: assistance_application_info_request_cycle
        grounds:
          - state_machines.AssistanceApplication.SUBMITTED_to_UNDER_REVIEW
          - state_machines.AssistanceApplication.UNDER_REVIEW_to_SUBMITTED
        distinguishing_aspect: |
          AssistanceApplication (different entity than Milestone) is cyclic: SUBMITTED
