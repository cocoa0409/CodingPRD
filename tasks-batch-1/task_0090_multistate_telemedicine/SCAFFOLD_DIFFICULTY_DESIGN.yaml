            - call: "GET /visits/${v_id}/compliance-checks"
              payload: {}
              as: ComplianceOfficer
              captures: { cc_outcome: "$.data[0].outcome", cc_reason: "$.data[0].reason_code" }
          assert:
            - "response status == 422 and data.error_id == ERR_NO_LICENSE_IN_STATE"
