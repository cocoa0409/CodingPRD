      - name: risk_decay_ladder_weights_the_fifth_item_at_half
        claim_type: decay_function
        grounds:
          - calculations.applicant_risk_score
          - entities.Applicant.fields.provisional_risk_score
          - entities.Applicant.fields.final_risk_score
          - entities.Applicant.fields.enhanced_support_required
          - state_machines.Applicant.medical_to_DEFERRED
        distinguishing_aspect: |
          Decay-function claim. Five CONDITIONAL items with severity 1 are recorded in
          the order INTERVIEW, BACKGROUND_CHECK, PSYCH_EVAL, INTERVIEW, MEDICAL_EXAM
          (medical last, so the required set completes only on the final write). Since
          all five share the logical-clock recorded_at, the ordering is settled by the
          created_at DESC tie-break: MEDICAL(1.00), INTERVIEW(0.80), PSYCH(0.60),
          BACKGROUND_CHECK(0.50) and the fifth row at 0.50 —
          1.0 + 0.6 + 1.2 + 0.75 + 0.375 = 3.925 -> 3.93 with a single round-half-up
          on the sum. PROVISIONAL_CEILING applies no decay at all and reads 6.00, and
          the CONDITIONAL medical exam defers the medical dimension while screening
          still clears.
        test_recipe:
          setup:
            - "One DOCUSOAP / GA production, one PUBLISHED REFERRAL call, one adult applicant SUBMITTED."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
