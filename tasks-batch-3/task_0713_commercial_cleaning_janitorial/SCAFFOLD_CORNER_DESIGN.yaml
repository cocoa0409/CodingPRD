              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Lobby", sqft: 4000, soil_level: "LIGHT", frequency_per_week: 1 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/send"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/contracts"
              payload: { proposal_id: "${prop}", term_months: 12 }
              as: SalesRep
              captures: { ctr: "$.data.id" }
            - call: "POST /accounts/${acct}/contracts/${ctr}/sign"
              payload: {}
              as: SalesRep
            - call: "GET /accounts/${acct}/startup-plans"
              payload: {}
              as: OperationsManager
              captures: { plan: "$.data[0].id" }
            - call: "POST /crews"
              payload: { name: "C1", weekly_capacity_hours: 50 }
              as: OperationsManager
              captures: { crew: "$.data.id" }
            - call: "POST /accounts/${acct}/startup-plans/${plan}/crew"
              payload: { crew_id: "${crew}", start_at: "2026-03-03T09:00:00Z", end_at: "2026-03-03T14:00:00Z" }
              as: OperationsManager
            - call: "POST /accounts/${acct}/startup-plans/${plan}/mark-ready"
              payload: {}
              as: OperationsManager
            - call: "POST /accounts/${acct}/startup-plans/${plan}/go-live"
              payload: {}
              as: OperationsManager
            - call: "POST /accounts/${acct}/contracts/${ctr}/renewal-cycles"
              payload: { escalation_method: "FLAT" }
              as: AccountManager
              as_user_id: "am-1"
              captures: { rc: "$.data.id" }
            - call: "POST /accounts/${acct}/renewal-cycles/${rc}/offer"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
            - call: "GET /accounts/${acct}/contracts/${ctr}"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
              captures: { ctr_v: "$.data.version" }
            - call: "POST /accounts/${acct}/renewal-cycles/${rc}/accept"
              payload: { expected_contract_version: "${ctr_v}" }
              as: AccountManager
              as_user_id: "am-1"
          trigger:
            - call: "POST /accounts/${acct}/renewal-cycles/${rc}/lapse"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"

