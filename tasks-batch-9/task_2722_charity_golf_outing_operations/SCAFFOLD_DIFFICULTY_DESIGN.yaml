  - rule_id: compensating_invariant
    instances:
      - name: allocation_release_restores_the_asset_capacity_conservation_identity
        grounds:
          - calculations.asset_occupancy_availability
          - state_machines.SponsorAllocation.INSTALLED_to_RELEASED
          - state_machines.SponsorshipAsset.RESERVED_to_AVAILABLE
          - entities.Outing.fields.reserved_asset_slot_count
        conserved_quantity: |
          capacity == remaining_capacity + reserved_count + committed_count + fulfilled_count
          for every SponsorshipAsset, and
          Outing.reserved_asset_slot_count == sum over the outing's assets of
          (reserved_count + committed_count + fulfilled_count)
        distinguishing_aspect: |
          The forward path walks the allocation three steps deep - RESERVED ->
          COMMITTED -> ARTWORK_APPROVED -> INSTALLED - moving the occupancy between three
          different counters on the way, and the compensating RELEASE must unwind ALL of it
          in one step: the counters return to zero, remaining_capacity returns to the full
          capacity of 3, the asset returns to AVAILABLE and the outing-level slot counter
          returns to 0. The identity holds at every intermediate step, so the test can
          check it after each call and catch an implementation that decrements the wrong
          counter and still lands on a plausible-looking total.
        test_recipe:
          setup:
            - "Outing OPEN with a SPONSOR tier entitling one HOLE_SIGN, one CONFIRMED sponsor registration paid 250000."
            - "A HOLE_SIGN asset with capacity 3 and fulfillment_due_at 2026-09-15T00:00:00Z."
            - "One PACKAGE_ENTITLEMENT allocation walked forward to INSTALLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SponsorshipManager
            - call: "POST /outing-ops/outings"
              payload: { name: "Conservation Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "GOLD", kind: "SPONSOR", price_cents: 250000, player_slots: 0, gsv_cents: 0, inventory_cap: 5, entitled_asset_type: "HOLE_SIGN", entitled_asset_count: 1 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Anchor Insurance", player_count: 0 }
              as: SponsorshipManager
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 250000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/sponsorship-assets"
              payload: { outing_id: "${o_id}", asset_type: "HOLE_SIGN", label: "Hole 14 triple sign", hole_number: 14, capacity: 3, exclusive: false, list_price_cents: 50000, fulfillment_due_at: "2026-09-15T00:00:00Z" }
              as: SponsorshipManager
              captures: { a_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations"
              payload: { registration_id: "${r_id}", sponsorship_asset_id: "${a_id}", source: "PACKAGE_ENTITLEMENT" }
              as: SponsorshipManager
              captures: { al_id: $.data.id }
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "COMMIT" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "APPROVE_ARTWORK" }
              as: SponsorshipManager
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "INSTALL" }
              as: SponsorshipManager
          trigger:
            - call: "POST /outing-ops/sponsor-allocations/${al_id}/fulfillment"
              payload: { action: "RELEASE" }
              as: SponsorshipManager
          assert:
            - "before the trigger - SponsorshipAsset.${a_id}.reserved_count == 0, committed_count == 1, fulfilled_count == 0, remaining_capacity == 2, status == COMMITTED, and 3 == 2 + 0 + 1 + 0"
            - "before the trigger - Outing.${o_id}.reserved_asset_slot_count == 1 and Registration.${r_id}.entitled_asset_balance == 0"
            - "after the trigger - SponsorAllocation.${al_id}.status == RELEASED"
            - "after the trigger - SponsorshipAsset.${a_id}.reserved_count == 0, committed_count == 0, fulfilled_count == 0, remaining_capacity == 3, status == AVAILABLE, and 3 == 3 + 0 + 0 + 0"
            - "after the trigger - Outing.${o_id}.reserved_asset_slot_count == 0 and Registration.${r_id}.entitled_asset_balance == 1 (the entitlement is handed back, not consumed)"
            - "no drift on a second cycle - reserving, committing and releasing again returns every one of those numbers to the same values"

      - name: receipt_reversal_restores_the_signed_deductible_ledger
        grounds:
          - calculations.charitable_deductible
          - entities.Outing.fields.receipted_deductible_total_cents
          - entities.CharitableReceipt.fields.reverses_receipt_id
          - validations[priority=10]
        conserved_quantity: |
          Outing.receipted_deductible_total_cents == the signed sum of
          deductible_amount_cents over every CharitableReceipt of the outing, with the
          forward receipt and its REVERSAL both retained as immutable rows
        distinguishing_aspect: |
          A different conserved quantity - a signed money ledger rather than integer
          inventory counters - and a different compensation mechanism: the ledger is
          APPEND-ONLY, so the forward row is never mutated or deleted. The reversal appends
          a mirror row with negated payment, gsv and deductible, and the outing total must
          come back to exactly 0 while the receipt count RISES from 1 to 2. An
          implementation that "compensates" by editing or deleting the original passes a
          naive total check but fails the immutability and count assertions - and a second
          reversal attempt must be refused with ERR_RECEIPT_IMMUTABLE, so the ledger cannot
          be driven negative.
        test_recipe:
          setup:
            - "Outing OPEN with a TEAM tier priced 120000 and gsv_cents 24000."
            - "One CONFIRMED registration paid in full."
            - "One REGISTRATION receipt issued, so the outing total reads 96000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CharityTreasurer
            - call: "POST /outing-ops/outings"
              payload: { name: "Ledger Symmetry Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 1, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0, fnb_minimum_cents: 0, fnb_per_player_cents: 4500 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 120000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Ledger Lions", player_count: 4 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 120000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_id}" }
              as: CharityTreasurer
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/receipts/${rec_id}/reversal"
              payload: { reversal_reason: "Sponsor asked for the receipt to be reissued to a subsidiary" }
              as: CharityTreasurer
              captures: { rev_id: $.data.id }
            - call: "POST /outing-ops/receipts/${rec_id}/reversal"
              payload: { reversal_reason: "Duplicate reversal attempt" }
              as: CharityTreasurer
              captures: { err_id: $.data.error_id }
          assert:
            - "before the trigger - CharitableReceipt.${rec_id}.payment_cents == 120000, gsv_cents == 24000, deductible_amount_cents == 96000, receipt_number == 'GR-0001'; Outing.${o_id}.receipted_deductible_total_cents == 96000"
            - "after the first trigger call - CharitableReceipt.${rev_id}.receipt_kind == REVERSAL, reverses_receipt_id == ${rec_id}, payment_cents == -120000, gsv_cents == -24000, deductible_amount_cents == -96000, receipt_number == 'GR-0002'"
            - "the ledger is conserved and back to zero - Outing.${o_id}.receipted_deductible_total_cents == 0"
            - "append-only, not undo - GET /outing-ops/receipts?outing_id=${o_id} returns total_count 2 and CharitableReceipt.${rec_id} still reads payment_cents 120000 and deductible_amount_cents 96000"
            - "the second trigger call returns HTTP 409 with error_id ERR_RECEIPT_IMMUTABLE and Outing.${o_id}.receipted_deductible_total_cents stays 0 (never -96000)"
            - "a fresh forward receipt for the same registration is admissible again after the reversal, and reissuing it moves the outing total back to 96000 with receipt_number 'GR-0003'"
