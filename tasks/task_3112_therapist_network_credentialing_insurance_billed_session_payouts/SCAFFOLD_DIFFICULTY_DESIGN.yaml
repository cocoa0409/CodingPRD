            - call: "POST /network/clinicians"
              payload: { full_name: "Dana Reyes", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 8, availability_blocks: [{ weekday: 2, start_minute: 480, end_minute: 1080 }] }
