# =============================================================================
# PRD Benchmark Seed Tables — Search & Rescue / Emergency Volunteer Coordination
# Difficulty: Expert
# =============================================================================

scenario: |
  Search & Rescue / Emergency Volunteer Coordination: incident & tasking,
  team/member certification & callout, resource & K9/air assignment,
  ground-track & clue log, ICS integration & briefing, hour/mileage &
  reimbursement, standby/deployment, after-action

domain_name: sar-volunteer-coordination
api_prefix: /sar

# api_prefix note: all resources are peers under a shared /sar root (graph
# topology). Endpoint paths below already include the /sar prefix. Every entity
# exposes a single-resource GET (/sar/<collection>/{id}) and a filtered-list GET
# (/sar/<collection>) so that every FK declared in §1.1 is reverse-reachable.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # graph: many-to-many via junction entities — Callout links Member<->Task,
  # ResourceAssignment links Resource<->Task; plus flat FK references throughout.

  state_machine_shape: cyclic
  # cyclic dominates (Task IN_PROGRESS<->SUSPENDED weather-hold loop;
  # ReimbursementClaim SUBMITTED<->RETURNED revision loop). Clue adds a branching
  # fork (LOGGED->{ACTIONABLE, DISMISSED}); Incident close is compound (gated on
  # aggregate child state).

  relationship_patterns:
    - one_to_many          # Incident->Task, Team->Member, Member->Certification
    - many_to_many         # Member<->Task via Callout; Resource<->Task via ResourceAssignment
    - cross_aggregate      # ReimbursementClaim references both Member and Incident

  role_model: peer_roles
  # Coordinator owns the operational surface; IncidentCommander owns command
  # decisions (incident lifecycle, task briefing, clue evaluation); FinanceOfficer
  # owns reimbursement adjudication; Member (entity-backed) acts on own callouts,
  # claims and ground-tracks.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Incident/mission name" }
      - { name: incident_type, type: enum, source: input, description: "WILDERNESS_SEARCH | DISASTER | URBAN | WATER | AIR_SEARCH" }
      - { name: ics_incident_number, type: string, source: input, description: "ICS incident number for external ICS integration" }
      - { name: operational_period_hours, type: integer, source: input, default: 12, description: "Length of the current operational period in hours" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | DEMOBILIZING | CLOSED | CANCELLED", default: "PLANNING" }
      - { name: active_task_count, type: integer, source: computed, description: "Count of Task where incident_id==this.id and status NOT IN {DEBRIEFED, CANCELLED}" }
      - { name: total_logged_hours, type: number, source: computed, description: "Sum of GroundTrack.duration_min (tracks on this incident's tasks) / 60, round_half_up 2dp" }
      - { name: total_mileage_miles, type: integer, source: computed, description: "round_half_up(sum(GroundTrack.distance_km on this incident) * 0.621371) to whole miles" }
      - { name: total_approved_reimbursement_cents, type: integer, source: computed, default: 0, description: "Running ledger: sum of final_amount_cents over this incident's APPROVED/PAID claims; conserved quantity for compensating-invariant" }

  - name: Task
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id" }
      - { name: task_number, type: string, source: input, description: "ICS task number" }
      - { name: task_type, type: enum, source: input, description: "HASTY | GRID_SEARCH | K9 | AIR_RECON | EVAC | CONTAINMENT" }
      - { name: priority, type: enum, source: input, default: "STANDARD", description: "URGENT | STANDARD | LOW" }
      - { name: segment_area_sqkm, type: number, source: input, description: "Area of the assigned search segment in square km (> 0)" }
      - { name: planned_searcher_hours, type: number, source: input, description: "Planned total searcher-hours for coverage estimate (>= 0)" }
      - { name: required_cert_types, type: array, source: input, default: [], description: "Cert types a Member must hold (VALID) to be DEPLOYED to this task, e.g. [WFR, K9_AREA]" }
      - { name: max_responders, type: integer, source: input, default: 8, description: "Maximum number of non-terminal Callouts allowed on this task" }
      - { name: planned_start, type: datetime, source: input, description: "Planned operational window start (ISO 8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned operational window end (ISO 8601 UTC); must be > planned_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSIGNED | IN_PROGRESS | SUSPENDED | DEBRIEFED | CANCELLED", default: "DRAFT" }
      - { name: estimated_coverage_pct, type: number, source: computed, description: "Planned-effort coverage estimate, set on ASSIGNED (see calc task_coverage_pct / estimate variant)" }
      - { name: actual_coverage_pct, type: number, source: computed, description: "Track-derived coverage, set on DEBRIEFED (see calc task_coverage_pct / actual variant)" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Team/unit name" }
      - { name: team_type, type: enum, source: input, description: "GROUND | K9 | AIR | SWIFTWATER | MOUNTAIN" }
      - { name: base_location, type: string, source: input, description: "Home base description" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: full_name, type: string, source: input, description: "Volunteer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: member_role, type: enum, source: input, description: "SEARCHER | TEAM_LEADER | K9_HANDLER | PILOT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | STANDBY | DEPLOYED", default: "ACTIVE" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: cert_type, type: enum, source: input, description: "WFR | ICS_100 | TRACKER | K9_AREA | ROPE_TECH | SWIFTWATER | PILOT" }
      - { name: issued_date, type: datetime, source: input, description: "ISO 8601 UTC issue instant" }
      - { name: expires_date, type: datetime, source: input, description: "ISO 8601 UTC expiry instant" }
      - { name: status, type: enum, source: computed, description: "VALID | EXPIRED — EXPIRED iff current_utc >= expires_date (see calc cert_currency)" }

  - name: Callout
    parent: null
    common_fields: true
    fields:
      - { name: task_id, type: string, source: input, description: "FK -> Task.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACKNOWLEDGED | STANDBY | DEPLOYED | DEMOBILIZED | DECLINED | NO_RESPONSE", default: "REQUESTED" }
      - { name: requested_at, type: datetime, source: system, description: "Server-stamped callout creation instant (logical clock)" }
      - { name: deployed_at, type: datetime, source: system, description: "Logical-clock instant the member was DEPLOYED; null until deploy" }

  - name: Resource
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Resource/asset name (e.g. K9 Ranger, Helo N123)" }
      - { name: resource_type, type: enum, source: input, description: "K9 | HELICOPTER | FIXED_WING | DRONE | UTV | BOAT" }
      - { name: handler_member_id, type: string, source: input, default: null, description: "FK -> Member.id; the handler/pilot (nullable, required for K9)" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | ASSIGNED | OUT_OF_SERVICE — ASSIGNED iff active_assignment_count > 0 and not OUT_OF_SERVICE", default: "AVAILABLE" }
      - { name: out_of_service, type: boolean, source: system, default: false, description: "Manual OOS flag set via set-status endpoint" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "COUNT(ResourceAssignment where resource_id==this.id and status IN {RESERVED, ACTIVE}); conserved quantity for compensating-invariant" }

  - name: ResourceAssignment
    parent: null
    common_fields: true
    fields:
      - { name: resource_id, type: string, source: input, description: "FK -> Resource.id" }
      - { name: task_id, type: string, source: input, description: "FK -> Task.id" }
      - { name: window_start, type: datetime, source: input, description: "Half-open occupation window start [start, end) (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open occupation window end; must be > window_start" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | RELEASED | CANCELLED", default: "RESERVED" }

  - name: GroundTrack
    parent: null
    common_fields: false     # append-only event log: only id + created_at, immutable
    fields:
      - { name: task_id, type: string, source: input, description: "FK -> Task.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id (the searcher who logged this track)" }
      - { name: recorded_at, type: datetime, source: input, description: "ISO 8601 UTC instant the track was recorded" }
      - { name: distance_km, type: number, source: input, description: "Track distance in km (>= 0), feeds mileage/hours rollups" }
      - { name: duration_min, type: integer, source: input, description: "Track duration in minutes (>= 0), feeds hours rollup" }
      - { name: coverage_area_sqkm, type: number, source: input, description: "Area swept in square km (>= 0), feeds task actual coverage" }

  - name: Clue
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id" }
      - { name: task_id, type: string, source: input, default: null, description: "FK -> Task.id (nullable; the task that surfaced the clue)" }
      - { name: clue_number, type: string, source: input, description: "Clue log number" }
      - { name: clue_priority, type: enum, source: input, default: "ROUTINE", description: "URGENT | SIGNIFICANT | ROUTINE" }
      - { name: description, type: string, source: input, description: "Free-text clue description" }
      - { name: found_at, type: datetime, source: input, description: "ISO 8601 UTC instant the clue was found" }
      - { name: status, type: enum, source: system, description: "LOGGED | ACTIONABLE | DISMISSED | RESOLVED", default: "LOGGED" }

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id (claimant)" }
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id" }
      - { name: declared_mileage_miles, type: integer, source: input, description: "Member-declared mileage in whole miles (>= 0)" }
      - { name: meal_count, type: integer, source: input, default: 0, description: "Number of reimbursable meals claimed (>= 0)" }
      - { name: lodging_nights, type: integer, source: input, default: 0, description: "Number of reimbursable lodging nights (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | APPROVED | REJECTED | PAID", default: "DRAFT" }
      - { name: estimated_amount_cents, type: integer, source: computed, description: "Reimbursement using declared_mileage_miles, set on SUBMITTED (calc reimbursement_amount / estimate variant)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Reimbursement using track-reconciled mileage, set on APPROVED (calc reimbursement_amount / final variant)" }

  - name: AfterActionReport
    parent: null
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id" }
      - { name: summary, type: string, source: input, description: "After-action summary narrative" }
      - { name: lessons_learned, type: string, source: input, default: "", description: "Lessons-learned narrative" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED", default: "DRAFT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Incident
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: "POST /sar/incidents/{incidentId}/activate"
        actor: IncidentCommander
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEMOBILIZING
        trigger: "POST /sar/incidents/{incidentId}/demobilize"
        actor: IncidentCommander
        preconditions: []
        side_effects: []
      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /sar/incidents/{incidentId}/close"
        actor: IncidentCommander
        preconditions:
          - "active_task_count == 0 (no Task in DRAFT/ASSIGNED/IN_PROGRESS/SUSPENDED) else ERR_INCIDENT_HAS_ACTIVE_TASKS"
        side_effects:
          - "recompute total_logged_hours and total_mileage_miles (calc incident_effort_rollup)"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /sar/incidents/{incidentId}/cancel"
        actor: IncidentCommander
        preconditions: []
        side_effects:
          - "CASCADE link 1: every Task with incident_id==this.id and status IN {DRAFT,ASSIGNED,IN_PROGRESS,SUSPENDED} -> CANCELLED"
          - "each cascaded Task cancellation fires the Task CANCELLED side_effects (see Task machine) — link 2 (Callout) and resource release"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /sar/incidents/{incidentId}/cancel"
        actor: IncidentCommander
        preconditions: []
        side_effects:
          - "CASCADE link 1: every Task with incident_id==this.id and status IN {DRAFT,ASSIGNED,IN_PROGRESS,SUSPENDED} -> CANCELLED"
          - "each cascaded Task cancellation fires the Task CANCELLED side_effects — link 2 (Callout DEMOBILIZED) then link 3 (Member -> ACTIVE)"

  - entity: Task
    initial_state: DRAFT
    terminal_states: [DEBRIEFED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ASSIGNED
        trigger: "POST /sar/tasks/{taskId}/assign"
        actor: IncidentCommander
        preconditions:
          - "parent Incident.status == ACTIVE else ERR_INCIDENT_NOT_ACTIVE"
        side_effects:
          - "compute estimated_coverage_pct (calc task_coverage_pct / estimate variant)"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /sar/tasks/{taskId}/start"
        actor: [IncidentCommander, Coordinator]
        preconditions:
          - "at least one Callout on this task has status == DEPLOYED else ERR_NO_DEPLOYED_RESPONDERS"
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /sar/tasks/{taskId}/suspend"
        actor: [IncidentCommander, Coordinator]
        preconditions: []
        side_effects:
          - "CASCADE link 1: every ResourceAssignment with task_id==this.id and status==ACTIVE -> RELEASED"
          - "each cascaded ResourceAssignment release fires its RELEASED side_effect — link 2: its Resource.active_assignment_count -= 1, Resource recomputed to AVAILABLE when count reaches 0"
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /sar/tasks/{taskId}/resume"
        actor: [IncidentCommander, Coordinator]
        preconditions: []
        side_effects: []
        note: "cyclic: IN_PROGRESS <-> SUSPENDED weather-hold loop"
      - from: IN_PROGRESS
        to: DEBRIEFED
        trigger: "POST /sar/tasks/{taskId}/debrief"
        actor: [IncidentCommander, Coordinator]
        preconditions: []
        side_effects:
          - "compute actual_coverage_pct from GroundTracks (calc task_coverage_pct / actual variant)"
          - "every Callout on this task with status==DEPLOYED -> DEMOBILIZED; each such demobilization sets its Member back to ACTIVE if the member has no other DEPLOYED callout"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sar/tasks/{taskId}/cancel OR system cascade from Incident cancel"
        actor: [IncidentCommander, Coordinator, system]
        preconditions: []
        side_effects:
          - "CASCADE link 2: every Callout with task_id==this.id and status IN {REQUESTED,ACKNOWLEDGED,STANDBY,DEPLOYED} -> DEMOBILIZED"
          - "CASCADE link 3: each Callout that was DEPLOYED sets its Member -> ACTIVE (when the member has no other DEPLOYED callout)"
          - "every ResourceAssignment with task_id==this.id and status IN {RESERVED,ACTIVE} -> CANCELLED; each fires Resource.active_assignment_count -= 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /sar/tasks/{taskId}/cancel OR system cascade from Incident cancel"
        actor: [IncidentCommander, Coordinator, system]
        preconditions: []
        side_effects:
          - "CASCADE link 2: every Callout with task_id==this.id and status IN {REQUESTED,ACKNOWLEDGED,STANDBY,DEPLOYED} -> DEMOBILIZED"
          - "CASCADE link 3: each Callout that was DEPLOYED sets its Member -> ACTIVE (when the member has no other DEPLOYED callout)"
          - "every ResourceAssignment with task_id==this.id and status IN {RESERVED,ACTIVE} -> CANCELLED; each fires Resource.active_assignment_count -= 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /sar/tasks/{taskId}/cancel OR system cascade from Incident cancel"
        actor: [IncidentCommander, Coordinator, system]
        preconditions: []
        side_effects:
          - "CASCADE link 2: every Callout with task_id==this.id and status IN {REQUESTED,ACKNOWLEDGED,STANDBY,DEPLOYED} -> DEMOBILIZED"
          - "CASCADE link 3: each Callout that was DEPLOYED sets its Member -> ACTIVE (when the member has no other DEPLOYED callout)"
          - "every ResourceAssignment with task_id==this.id and status IN {RESERVED,ACTIVE} -> CANCELLED; each fires Resource.active_assignment_count -= 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /sar/tasks/{taskId}/cancel OR system cascade from Incident cancel"
        actor: [IncidentCommander, Coordinator, system]
        preconditions: []
        side_effects:
          - "CASCADE link 2: every Callout with task_id==this.id and status IN {REQUESTED,ACKNOWLEDGED,STANDBY,DEPLOYED} -> DEMOBILIZED"
          - "CASCADE link 3: each Callout that was DEPLOYED sets its Member -> ACTIVE (when the member has no other DEPLOYED callout)"
          - "every ResourceAssignment with task_id==this.id and status IN {RESERVED,ACTIVE} -> CANCELLED"

  - entity: Callout
    initial_state: REQUESTED
    terminal_states: [DEMOBILIZED, DECLINED, NO_RESPONSE]
    transitions:
      - from: REQUESTED
        to: ACKNOWLEDGED
        trigger: "POST /sar/callouts/{calloutId}/acknowledge"
        actor: Member
        preconditions: ["acting Member owns this callout (member_id == X-User-ID)"]
        side_effects: []
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /sar/callouts/{calloutId}/decline"
        actor: Member
        preconditions: ["acting Member owns this callout"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: DECLINED
        trigger: "POST /sar/callouts/{calloutId}/decline"
        actor: Member
        preconditions: ["acting Member owns this callout"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: STANDBY
        trigger: "POST /sar/callouts/{calloutId}/standby"
        actor: [Coordinator, IncidentCommander]
        preconditions: []
        side_effects: ["Member.status -> STANDBY when the member has no DEPLOYED callout"]
      - from: STANDBY
        to: DEPLOYED
        trigger: "POST /sar/callouts/{calloutId}/deploy"
        actor: [Coordinator, IncidentCommander]
        preconditions:
          - "target Task.status IN {ASSIGNED, IN_PROGRESS} else ERR_TASK_NOT_READY (cross-entity: Callout depends on Task)"
          - "Member holds a VALID Certification for every cert_type in Task.required_cert_types else ERR_CERT_REQUIREMENT_NOT_MET"
          - "Member is not double-booked: no other DEPLOYED callout on a Task whose [planned_start, planned_end] is within MEMBER_REST_BUFFER_MIN (60 minutes) of this Task's window else ERR_MEMBER_DOUBLE_BOOKED"
        side_effects:
          - "Member.status -> DEPLOYED"
          - "deployed_at stamped from logical clock"
      - from: DEPLOYED
        to: DEMOBILIZED
        trigger: "POST /sar/callouts/{calloutId}/demobilize OR system cascade from Task debrief/cancel"
        actor: [Coordinator, IncidentCommander, system]
        preconditions: []
        side_effects: ["Member.status -> ACTIVE when the member has no other DEPLOYED callout"]
      - from: STANDBY
        to: DEMOBILIZED
        trigger: "system cascade from Task cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: DEMOBILIZED
        trigger: "system cascade from Task cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: NO_RESPONSE
        trigger: "system cascade from Task cancel (unacknowledged callouts)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ResourceAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /sar/resource-assignments/{assignmentId}/activate"
        actor: [Coordinator, IncidentCommander]
        preconditions: ["target Task.status == IN_PROGRESS else ERR_TASK_NOT_READY"]
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /sar/resource-assignments/{assignmentId}/release OR system cascade from Task suspend"
        actor: [Coordinator, IncidentCommander, system]
        preconditions: []
        side_effects:
          - "Resource.active_assignment_count -= 1; Resource recomputed to AVAILABLE when count reaches 0"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /sar/resource-assignments/{assignmentId}/cancel OR system cascade from Task cancel"
        actor: [Coordinator, IncidentCommander, system]
        preconditions: []
        side_effects:
          - "Resource.active_assignment_count -= 1; Resource recomputed to AVAILABLE when count reaches 0"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system cascade from Task cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Resource.active_assignment_count -= 1; Resource recomputed to AVAILABLE when count reaches 0"

  - entity: Clue
    initial_state: LOGGED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: LOGGED
        to: ACTIONABLE
        trigger: "POST /sar/clues/{clueId}/promote"
        actor: IncidentCommander
        preconditions: []
        side_effects: []
        note: "branching fork at LOGGED: promote -> ACTIONABLE OR dismiss -> DISMISSED"
      - from: LOGGED
        to: DISMISSED
        trigger: "POST /sar/clues/{clueId}/dismiss"
        actor: IncidentCommander
        preconditions: []
        side_effects: []
      - from: ACTIONABLE
        to: RESOLVED
        trigger: "POST /sar/clues/{clueId}/resolve"
        actor: IncidentCommander
        preconditions: []
        side_effects: []
      - from: ACTIONABLE
        to: DISMISSED
        trigger: "POST /sar/clues/{clueId}/dismiss"
        actor: IncidentCommander
        preconditions: []
        side_effects: []

  - entity: ReimbursementClaim
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sar/reimbursement-claims/{claimId}/submit"
        actor: Member
        preconditions: ["acting Member owns this claim (member_id == X-User-ID)"]
        side_effects: ["compute estimated_amount_cents (calc reimbursement_amount / estimate variant)"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /sar/reimbursement-claims/{claimId}/return"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /sar/reimbursement-claims/{claimId}/submit"
        actor: Member
        preconditions: ["acting Member owns this claim"]
        side_effects: ["recompute estimated_amount_cents (calc reimbursement_amount / estimate variant)"]
        note: "cyclic: SUBMITTED <-> RETURNED revision loop"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /sar/reimbursement-claims/{claimId}/approve"
        actor: FinanceOfficer
        preconditions:
          - "parent Incident.status IN {DEMOBILIZING, CLOSED} else ERR_INCIDENT_NOT_DEMOBILIZING (cross-entity: Claim depends on Incident)"
        side_effects:
          - "compute final_amount_cents from track-reconciled mileage (calc reimbursement_amount / final variant)"
          - "Incident.total_approved_reimbursement_cents += final_amount_cents (ledger credit)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /sar/reimbursement-claims/{claimId}/reject"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: "POST /sar/reimbursement-claims/{claimId}/reject"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "COMPENSATION: Incident.total_approved_reimbursement_cents -= final_amount_cents (ledger reversal restores the pre-approval total)"
      - from: APPROVED
        to: PAID
        trigger: "POST /sar/reimbursement-claims/{claimId}/pay"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

  - entity: AfterActionReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /sar/after-action-reports/{aarId}/finalize"
        actor: IncidentCommander
        preconditions:
          - "parent Incident.status == CLOSED else ERR_INCIDENT_NOT_CLOSED (cross-entity: AAR depends on Incident)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-resource
    parent_entity: Resource
    write_endpoint: "POST /sar/resource-assignments"
    occ_field: "expected_resource_version"
    description: |
      Creating a ResourceAssignment reserves the Resource's schedule for a
      window and legitimately supersedes the resource's prior scheduling view.
      A create whose expected_resource_version is older than the Resource's
      current version is rejected: it means another assignment was already
      created against the same Resource (advancing its version and its occupied
      windows) after the client last observed it, so the client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reimbursement_amount
    trigger: "ReimbursementClaim submit (estimate variant) and approve (final variant)"
    algorithm: tiered_pricing
    formula: |
      # mode (a) combinatorial: >=3 inputs, tiered-rate selection + min/max caps.
      mileage_reimb_cents = min(mileage, MILEAGE_TIER1_LIMIT_MI) * MILEAGE_RATE_TIER1_CPM
                          + max(mileage - MILEAGE_TIER1_LIMIT_MI, 0) * MILEAGE_RATE_TIER2_CPM
      meal_reimb_cents    = min(meal_count, MEAL_MAX_COUNT) * MEAL_PER_DIEM_CENTS
      lodging_reimb_cents = lodging_nights * LODGING_RATE_CENTS
      amount_cents        = mileage_reimb_cents + meal_reimb_cents + lodging_reimb_cents
      # `mileage` is whole miles; the tier boundary is >= (exactly TIER1_LIMIT_MI
      # miles is fully tier-1; only miles strictly beyond TIER1_LIMIT_MI use tier-2).
    input_set: "one ReimbursementClaim; mileage source differs per variant (see variants)"
    constants:
      MILEAGE_TIER1_LIMIT_MI: 50
      MILEAGE_RATE_TIER1_CPM: 65
      MILEAGE_RATE_TIER2_CPM: 40
      MEAL_PER_DIEM_CENTS: 1500
      MEAL_MAX_COUNT: 6
      LODGING_RATE_CENTS: 9000
    precision: "integer cents; no rounding needed (all inputs integer)"
    variants:
      - name: estimate
        when: "on submit (DRAFT->SUBMITTED / RETURNED->SUBMITTED); stored in estimated_amount_cents"
        difference: "mileage = claim.declared_mileage_miles (member-entered, unverified)"
      - name: final
        when: "on approve (SUBMITTED->APPROVED); stored in final_amount_cents"
        difference: "mileage = reconciled_mileage_miles = round_half_up(sum(GroundTrack.distance_km for tracks with member_id==claim.member_id AND task.incident_id==claim.incident_id) * MI_PER_KM); MI_PER_KM=0.621371. Differs from estimate whenever declared mileage != tracked mileage."

  - name: task_coverage_pct
    trigger: "Task assign (estimate variant) and debrief (actual variant)"
    algorithm: weighted_scoring
    formula: |
      # actual variant, mode (b) combinatorial: nested rounding where ORDER matters.
      # PINNED ORDER: round each track's fraction to 4 dp FIRST, then sum, then
      # clamp, then convert to percent rounded to 2 dp. (round-per-track-then-sum,
      # NOT sum-then-round — the two orders differ in the last cent of a percent.)
      for each GroundTrack gt with gt.task_id == task.id:
        frac_i = round_half_up(gt.coverage_area_sqkm / task.segment_area_sqkm, 4)
      actual_coverage_pct = round_half_up(min(1.0, sum(frac_i)) * 100, 2)
    input_set: "estimate: task.planned_searcher_hours; actual: all GroundTracks whose task_id == task.id"
    constants:
      COVERAGE_RATE_SQKM_PER_HOUR: 0.5
    precision: "fractions 4 dp round_half_up; percent 2 dp round_half_up"
    variants:
      - name: estimate
        when: "on assign (DRAFT->ASSIGNED); stored in estimated_coverage_pct"
        difference: "estimated_coverage_pct = round_half_up(min(1.0, (planned_searcher_hours * COVERAGE_RATE_SQKM_PER_HOUR) / segment_area_sqkm) * 100, 2); uses PLANNED effort, no tracks"
      - name: actual
        when: "on debrief (IN_PROGRESS->DEBRIEFED); stored in actual_coverage_pct"
        difference: "uses recorded GroundTracks with the pinned per-track rounding order above"

  - name: incident_effort_rollup
    trigger: "read of Incident computed fields; recomputed on close and on GroundTrack creation"
    algorithm: aggregation
    formula: |
      tracks = { GroundTrack gt : gt.task_id in (Task where incident_id==incident.id) }
      total_logged_hours   = round_half_up(sum(gt.duration_min for gt in tracks) / 60, 2)
      total_mileage_miles  = round_half_up(sum(gt.distance_km for gt in tracks) * 0.621371)
      active_task_count    = count(Task where incident_id==incident.id AND status IN {DRAFT,ASSIGNED,IN_PROGRESS,SUSPENDED})
      # empty-set boundary: when tracks == {} the sums are 0 and rollups are 0/0.00;
      # active_task_count == 0 is the close precondition.
    input_set: "all GroundTracks reachable via this incident's tasks; all Tasks of the incident"
    precision: "hours 2 dp round_half_up; miles whole number round_half_up"

  - name: cert_currency
    trigger: "evaluated whenever a Certification is read or a deploy checks cert requirements"
    algorithm: threshold
    formula: |
      # boundary is >= : a cert whose expires_date exactly equals the logical
      # clock is EXPIRED (expiry takes effect at the start of the expiry instant).
      status = EXPIRED if current_utc >= expires_date else VALID
    input_set: "one Certification vs the logical clock (default 2026-03-01T00:00:00Z)"
    precision: "instant comparison, inclusive lower bound (>=)"

  - name: resource_active_assignment_count
    trigger: "any ResourceAssignment create/activate/release/cancel affecting the resource"
    algorithm: aggregation
    formula: |
      active_assignment_count = count(ResourceAssignment
                                      where resource_id==resource.id
                                      AND status IN {RESERVED, ACTIVE})
      status = OUT_OF_SERVICE if resource.out_of_service
               else (ASSIGNED if active_assignment_count > 0 else AVAILABLE)
    input_set: "all ResourceAssignments of the resource"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource referenced in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_constraint
    check: "request body is well-formed: required fields present, enum values legal, numeric ranges honored (segment_area_sqkm>0, planned_end>planned_start, window_end>window_start, non-negative amounts), referenced FK bodies exist"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: business_referential
    check: "acting entity-backed Member owns the target resource (callout.member_id / claim.member_id / groundtrack.member_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "Member-owned callout/claim/ground-track actions"

  - priority: 6
    category: state
    check: "target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "referenced sibling entity is in the required state — Task ASSIGNED/IN_PROGRESS for deploy & activate; Resource not OUT_OF_SERVICE for assignment; Incident ACTIVE for task assign; Incident DEMOBILIZING/CLOSED for claim approve; Incident CLOSED for AAR finalize; Team ACTIVE for standby"
    error_id: "ERR_TASK_NOT_READY | ERR_RESOURCE_UNAVAILABLE | ERR_INCIDENT_NOT_ACTIVE | ERR_INCIDENT_NOT_DEMOBILIZING | ERR_INCIDENT_NOT_CLOSED | ERR_TEAM_INACTIVE"
    http_status: 409
    applies_to: "deploy, resource-assignment create/activate, task assign, claim approve, AAR finalize, callout standby"

  - priority: 8
    category: business_safety
    check: "on deploy: Member holds a VALID Certification for every cert_type in Task.required_cert_types (calc cert_currency)"
    error_id: ERR_CERT_REQUIREMENT_NOT_MET
    http_status: 409
    applies_to: "POST /sar/callouts/{calloutId}/deploy"

  - priority: 9
    category: business_temporal
    check: "temporal-overlap conflicts — Resource half-open window [start,end) collision on assignment create; Member closed-window + MEMBER_REST_BUFFER_MIN (60 minutes) double-book on deploy"
    error_id: "ERR_RESOURCE_WINDOW_CONFLICT | ERR_MEMBER_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /sar/resource-assignments, POST /sar/callouts/{calloutId}/deploy"

  - priority: 10
    category: business_constraint
    check: "capacity/uniqueness — Task non-terminal callout count < max_responders on callout create; at most one non-REJECTED ReimbursementClaim per (member_id, incident_id); Incident close requires active_task_count==0"
    error_id: "ERR_TASK_AT_CAPACITY | ERR_DUPLICATE_CLAIM | ERR_INCIDENT_HAS_ACTIVE_TASKS"
    http_status: 409
    applies_to: "POST /sar/callouts, POST /sar/reimbursement-claims, POST /sar/incidents/{incidentId}/close"

  - priority: 11
    category: business_constraint
    check: "no DEPLOYED responder present when starting a task (start requires >=1 DEPLOYED Callout)"
    error_id: ERR_NO_DEPLOYED_RESPONDERS
    http_status: 409
    applies_to: "POST /sar/tasks/{taskId}/start"

  - priority: 12
    category: state
    check: "OCC: expected_resource_version matches Resource.version on assignment create (checked last, after all business rules pass)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sar/resource-assignments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/sar/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default (never real wall-clock). All expiry/window/deadline evaluation uses this clock."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

  # --- Incident ---
  - method: POST
    path: "/sar/incidents"
    description: "Create an incident"
    roles: [Coordinator, IncidentCommander]
    code: 201
    input: [name, incident_type, ics_incident_number, "operational_period_hours?"]
    output: Incident
    side_effects: ["status=PLANNING, ledger fields 0"]
  - method: GET
    path: "/sar/incidents/{incidentId}"
    description: "Get one incident (computed rollups included)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: GET
    path: "/sar/incidents"
    description: "List incidents"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["status?", "incident_type?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: POST
    path: "/sar/incidents/{incidentId}/activate"
    description: "PLANNING -> ACTIVE"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/sar/incidents/{incidentId}/demobilize"
    description: "ACTIVE -> DEMOBILIZING"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> DEMOBILIZING"]
  - method: POST
    path: "/sar/incidents/{incidentId}/close"
    description: "DEMOBILIZING -> CLOSED (requires active_task_count==0)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> CLOSED", "recompute total_logged_hours, total_mileage_miles"]
  - method: POST
    path: "/sar/incidents/{incidentId}/cancel"
    description: "PLANNING/ACTIVE -> CANCELLED with 3-level cascade (Task -> Callout -> Member)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Incident
    side_effects:
      - "status -> CANCELLED"
      - "cascade: non-terminal Tasks -> CANCELLED (each fires Callout demobilize + Member restore + assignment cancel)"

  # --- Task ---
  - method: POST
    path: "/sar/tasks"
    description: "Create a task under an incident"
    roles: [Coordinator, IncidentCommander]
    code: 201
    input: [incident_id, task_number, task_type, "priority?", segment_area_sqkm, planned_searcher_hours, "required_cert_types?", "max_responders?", planned_start, planned_end]
    output: Task
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/sar/tasks/{taskId}"
    description: "Get one task"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Task
    side_effects: []
  - method: GET
    path: "/sar/tasks"
    description: "List tasks (filter by incident_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["incident_id?", "status?", "task_type?", "limit?", "offset?"]
    output: Task[]
    side_effects: []
  - method: POST
    path: "/sar/tasks/{taskId}/assign"
    description: "DRAFT -> ASSIGNED (requires Incident ACTIVE); computes estimated_coverage_pct"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Task
    side_effects: ["status -> ASSIGNED", "estimated_coverage_pct computed"]
  - method: POST
    path: "/sar/tasks/{taskId}/start"
    description: "ASSIGNED -> IN_PROGRESS (requires >=1 DEPLOYED callout)"
    roles: [IncidentCommander, Coordinator]
    code: 200
    input: []
    output: Task
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/sar/tasks/{taskId}/suspend"
    description: "IN_PROGRESS -> SUSPENDED with cascade releasing ACTIVE resource assignments"
    roles: [IncidentCommander, Coordinator]
    code: 200
    input: []
    output: Task
    side_effects: ["status -> SUSPENDED", "cascade: ACTIVE ResourceAssignments -> RELEASED -> Resource count decremented"]
  - method: POST
    path: "/sar/tasks/{taskId}/resume"
    description: "SUSPENDED -> IN_PROGRESS (cyclic)"
    roles: [IncidentCommander, Coordinator]
    code: 200
    input: []
    output: Task
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/sar/tasks/{taskId}/debrief"
    description: "IN_PROGRESS -> DEBRIEFED; computes actual_coverage_pct; demobilizes DEPLOYED callouts"
    roles: [IncidentCommander, Coordinator]
    code: 200
    input: []
    output: Task
    side_effects: ["status -> DEBRIEFED", "actual_coverage_pct computed", "DEPLOYED callouts -> DEMOBILIZED, members restored to ACTIVE"]
  - method: POST
    path: "/sar/tasks/{taskId}/cancel"
    description: "Non-terminal Task -> CANCELLED with cascade (Callout demobilize + Member restore + assignment cancel)"
    roles: [IncidentCommander, Coordinator]
    code: 200
    input: []
    output: Task
    side_effects: ["status -> CANCELLED", "cascade over callouts, members, resource assignments"]

  # --- Team ---
  - method: POST
    path: "/sar/teams"
    description: "Create a team"
    roles: [Coordinator]
    code: 201
    input: [name, team_type, base_location]
    output: Team
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/sar/teams/{teamId}"
    description: "Get one team"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Team
    side_effects: []
  - method: GET
    path: "/sar/teams"
    description: "List teams"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["status?", "team_type?", "limit?", "offset?"]
    output: Team[]
    side_effects: []
  - method: POST
    path: "/sar/teams/{teamId}/deactivate"
    description: "ACTIVE -> INACTIVE (blocks new deployments of the team's members)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Team
    side_effects: ["status -> INACTIVE"]

  # --- Member ---
  - method: POST
    path: "/sar/members"
    description: "Create a member under a team"
    roles: [Coordinator]
    code: 201
    input: [team_id, full_name, email, member_role]
    output: Member
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/sar/members/{memberId}"
    description: "Get one member"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/sar/members"
    description: "List members (filter by team_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["team_id?", "status?", "member_role?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  # --- Certification ---
  - method: POST
    path: "/sar/certifications"
    description: "Create a certification for a member"
    roles: [Coordinator]
    code: 201
    input: [member_id, cert_type, issued_date, expires_date]
    output: Certification
    side_effects: ["status computed VALID/EXPIRED vs logical clock"]
  - method: GET
    path: "/sar/certifications/{certificationId}"
    description: "Get one certification (status recomputed vs clock)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/sar/certifications"
    description: "List certifications (filter by member_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["member_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  # --- Callout ---
  - method: POST
    path: "/sar/callouts"
    description: "Create a callout (page a member to a task); enforces Task.max_responders"
    roles: [Coordinator, IncidentCommander]
    code: 201
    input: [task_id, member_id]
    output: Callout
    side_effects: ["status=REQUESTED, requested_at stamped from clock"]
  - method: GET
    path: "/sar/callouts/{calloutId}"
    description: "Get one callout"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Callout
    side_effects: []
  - method: GET
    path: "/sar/callouts"
    description: "List callouts (filter by task_id and/or member_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["task_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Callout[]
    side_effects: []
  - method: POST
    path: "/sar/callouts/{calloutId}/acknowledge"
    description: "REQUESTED -> ACKNOWLEDGED (member owns)"
    roles: [Member]
    code: 200
    input: []
    output: Callout
    side_effects: ["status -> ACKNOWLEDGED"]
  - method: POST
    path: "/sar/callouts/{calloutId}/decline"
    description: "REQUESTED/ACKNOWLEDGED -> DECLINED (member owns)"
    roles: [Member]
    code: 200
    input: []
    output: Callout
    side_effects: ["status -> DECLINED"]
  - method: POST
    path: "/sar/callouts/{calloutId}/standby"
    description: "ACKNOWLEDGED -> STANDBY (requires member's Team ACTIVE)"
    roles: [Coordinator, IncidentCommander]
    code: 200
    input: []
    output: Callout
    side_effects: ["status -> STANDBY", "Member.status -> STANDBY when no DEPLOYED callout"]
  - method: POST
    path: "/sar/callouts/{calloutId}/deploy"
    description: "STANDBY -> DEPLOYED (Task ready, certs valid, no double-book)"
    roles: [Coordinator, IncidentCommander]
    code: 200
    input: []
    output: Callout
    side_effects: ["status -> DEPLOYED", "Member.status -> DEPLOYED", "deployed_at stamped"]
  - method: POST
    path: "/sar/callouts/{calloutId}/demobilize"
    description: "DEPLOYED -> DEMOBILIZED"
    roles: [Coordinator, IncidentCommander]
    code: 200
    input: []
    output: Callout
    side_effects: ["status -> DEMOBILIZED", "Member.status -> ACTIVE when no other DEPLOYED callout"]

  # --- Resource ---
  - method: POST
    path: "/sar/resources"
    description: "Create a resource/asset (K9, aircraft, vehicle)"
    roles: [Coordinator]
    code: 201
    input: [name, resource_type, "handler_member_id?"]
    output: Resource
    side_effects: ["status=AVAILABLE, active_assignment_count=0"]
  - method: GET
    path: "/sar/resources/{resourceId}"
    description: "Get one resource"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Resource
    side_effects: []
  - method: GET
    path: "/sar/resources"
    description: "List resources (filter by handler_member_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["handler_member_id?", "resource_type?", "status?", "limit?", "offset?"]
    output: Resource[]
    side_effects: []
  - method: POST
    path: "/sar/resources/{resourceId}/set-status"
    description: "Toggle OUT_OF_SERVICE flag (AVAILABLE<->OUT_OF_SERVICE)"
    roles: [Coordinator]
    code: 200
    input: [out_of_service]
    output: Resource
    side_effects: ["out_of_service set; status recomputed"]

  # --- ResourceAssignment ---
  - method: POST
    path: "/sar/resource-assignments"
    description: "Assign a resource to a task for a half-open window [start,end); OCC on Resource.version; rejects window overlap"
    roles: [Coordinator, IncidentCommander]
    code: 201
    input: [resource_id, task_id, window_start, window_end, expected_resource_version]
    output: ResourceAssignment
    side_effects: ["status=RESERVED", "Resource.active_assignment_count += 1", "increments Resource.version by 1"]
  - method: GET
    path: "/sar/resource-assignments/{assignmentId}"
    description: "Get one resource assignment"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: ResourceAssignment
    side_effects: []
  - method: GET
    path: "/sar/resource-assignments"
    description: "List resource assignments (filter by resource_id and/or task_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["resource_id?", "task_id?", "status?", "limit?", "offset?"]
    output: ResourceAssignment[]
    side_effects: []
  - method: POST
    path: "/sar/resource-assignments/{assignmentId}/activate"
    description: "RESERVED -> ACTIVE (requires Task IN_PROGRESS)"
    roles: [Coordinator, IncidentCommander]
    code: 200
    input: []
    output: ResourceAssignment
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/sar/resource-assignments/{assignmentId}/release"
    description: "ACTIVE -> RELEASED"
    roles: [Coordinator, IncidentCommander]
    code: 200
    input: []
    output: ResourceAssignment
    side_effects: ["status -> RELEASED", "Resource.active_assignment_count -= 1"]
  - method: POST
    path: "/sar/resource-assignments/{assignmentId}/cancel"
    description: "RESERVED -> CANCELLED (compensation of the reserve)"
    roles: [Coordinator, IncidentCommander]
    code: 200
    input: []
    output: ResourceAssignment
    side_effects: ["status -> CANCELLED", "Resource.active_assignment_count -= 1"]

  # --- GroundTrack ---
  - method: POST
    path: "/sar/ground-tracks"
    description: "Log a ground track for a task (append-only)"
    roles: [Coordinator, Member]
    code: 201
    input: [task_id, member_id, recorded_at, distance_km, duration_min, coverage_area_sqkm]
    output: GroundTrack
    side_effects: ["feeds incident rollups and task actual coverage"]
  - method: GET
    path: "/sar/ground-tracks/{groundTrackId}"
    description: "Get one ground track"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: GroundTrack
    side_effects: []
  - method: GET
    path: "/sar/ground-tracks"
    description: "List ground tracks (filter by task_id and/or member_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["task_id?", "member_id?", "limit?", "offset?"]
    output: GroundTrack[]
    side_effects: []

  # --- Clue ---
  - method: POST
    path: "/sar/clues"
    description: "Log a clue for an incident"
    roles: [Coordinator, IncidentCommander, Member]
    code: 201
    input: [incident_id, "task_id?", clue_number, "clue_priority?", description, found_at]
    output: Clue
    side_effects: ["status=LOGGED"]
  - method: GET
    path: "/sar/clues/{clueId}"
    description: "Get one clue"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: Clue
    side_effects: []
  - method: GET
    path: "/sar/clues"
    description: "List clues (filter by incident_id and/or task_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["incident_id?", "task_id?", "status?", "clue_priority?", "limit?", "offset?"]
    output: Clue[]
    side_effects: []
  - method: POST
    path: "/sar/clues/{clueId}/promote"
    description: "LOGGED -> ACTIONABLE (branch)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Clue
    side_effects: ["status -> ACTIONABLE"]
  - method: POST
    path: "/sar/clues/{clueId}/dismiss"
    description: "LOGGED/ACTIONABLE -> DISMISSED (branch)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Clue
    side_effects: ["status -> DISMISSED"]
  - method: POST
    path: "/sar/clues/{clueId}/resolve"
    description: "ACTIONABLE -> RESOLVED"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: Clue
    side_effects: ["status -> RESOLVED"]

  # --- ReimbursementClaim ---
  - method: POST
    path: "/sar/reimbursement-claims"
    description: "Create a reimbursement claim (member owns; one non-REJECTED per member+incident)"
    roles: [Coordinator, Member]
    code: 201
    input: [member_id, incident_id, declared_mileage_miles, "meal_count?", "lodging_nights?"]
    output: ReimbursementClaim
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/sar/reimbursement-claims/{claimId}"
    description: "Get one claim"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []
  - method: GET
    path: "/sar/reimbursement-claims"
    description: "List claims (filter by member_id and/or incident_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["member_id?", "incident_id?", "status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []
  - method: POST
    path: "/sar/reimbursement-claims/{claimId}/submit"
    description: "DRAFT/RETURNED -> SUBMITTED (member owns); computes estimated_amount_cents"
    roles: [Member]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> SUBMITTED", "estimated_amount_cents computed"]
  - method: POST
    path: "/sar/reimbursement-claims/{claimId}/return"
    description: "SUBMITTED -> RETURNED (cyclic revision loop)"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> RETURNED"]
  - method: POST
    path: "/sar/reimbursement-claims/{claimId}/approve"
    description: "SUBMITTED -> APPROVED (requires Incident DEMOBILIZING/CLOSED); computes final_amount_cents; credits incident ledger"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> APPROVED", "final_amount_cents computed", "Incident.total_approved_reimbursement_cents += final_amount_cents"]
  - method: POST
    path: "/sar/reimbursement-claims/{claimId}/reject"
    description: "SUBMITTED/APPROVED -> REJECTED; from APPROVED reverses the ledger credit"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> REJECTED", "if from APPROVED: Incident.total_approved_reimbursement_cents -= final_amount_cents"]
  - method: POST
    path: "/sar/reimbursement-claims/{claimId}/pay"
    description: "APPROVED -> PAID"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> PAID"]

  # --- AfterActionReport ---
  - method: POST
    path: "/sar/after-action-reports"
    description: "Create an after-action report draft for an incident"
    roles: [Coordinator, IncidentCommander]
    code: 201
    input: [incident_id, summary, "lessons_learned?"]
    output: AfterActionReport
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/sar/after-action-reports/{aarId}"
    description: "Get one after-action report"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: []
    output: AfterActionReport
    side_effects: []
  - method: GET
    path: "/sar/after-action-reports"
    description: "List after-action reports (filter by incident_id for reverse-reachability)"
    roles: [Coordinator, IncidentCommander, FinanceOfficer, Member]
    code: 200
    input: ["incident_id?", "status?", "limit?", "offset?"]
    output: AfterActionReport[]
    side_effects: []
  - method: POST
    path: "/sar/after-action-reports/{aarId}/finalize"
    description: "DRAFT -> FINALIZED (requires Incident CLOSED)"
    roles: [IncidentCommander]
    code: 200
    input: []
    output: AfterActionReport
    side_effects: ["status -> FINALIZED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "Entity-backed Member acting on a callout/claim/ground-track they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, illegal enum, bad numeric range, or non-existent FK reference" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }
  - { id: ERR_INCIDENT_NOT_ACTIVE, http: 409, condition: "Task assign requires the parent Incident to be ACTIVE" }
  - { id: ERR_INCIDENT_NOT_DEMOBILIZING, http: 409, condition: "Claim approve requires the Incident to be DEMOBILIZING or CLOSED" }
  - { id: ERR_INCIDENT_NOT_CLOSED, http: 409, condition: "AAR finalize requires the Incident to be CLOSED" }
  - { id: ERR_INCIDENT_HAS_ACTIVE_TASKS, http: 409, condition: "Incident close requires active_task_count == 0" }
  - { id: ERR_TASK_NOT_READY, http: 409, condition: "Callout deploy / assignment activate requires the Task to be ASSIGNED or IN_PROGRESS" }
  - { id: ERR_NO_DEPLOYED_RESPONDERS, http: 409, condition: "Task start requires at least one DEPLOYED callout" }
  - { id: ERR_TASK_AT_CAPACITY, http: 409, condition: "Callout create would exceed Task.max_responders non-terminal callouts" }
  - { id: ERR_TEAM_INACTIVE, http: 409, condition: "Callout standby requires the member's Team to be ACTIVE" }
  - { id: ERR_CERT_REQUIREMENT_NOT_MET, http: 409, condition: "Member lacks a VALID certification for a required cert_type at deploy" }
  - { id: ERR_MEMBER_DOUBLE_BOOKED, http: 409, condition: "Member deploy conflicts with another DEPLOYED task window within MEMBER_REST_BUFFER_MIN (60 minutes)" }
  - { id: ERR_RESOURCE_UNAVAILABLE, http: 409, condition: "Resource is OUT_OF_SERVICE at assignment create/activate" }
  - { id: ERR_RESOURCE_WINDOW_CONFLICT, http: 409, condition: "New assignment half-open window [start,end) overlaps an existing RESERVED/ACTIVE assignment on the same resource" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A non-REJECTED ReimbursementClaim already exists for this (member_id, incident_id)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_resource_version does not match Resource.version on assignment create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Coordinator
    description: "Operations coordinator: owns the operational surface — creates incidents/tasks/teams/members/certifications/resources, runs callouts (standby/deploy/demobilize), assigns resources, logs ground-tracks and clues, and drives task lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /sar/teams, POST /sar/teams/{teamId}/deactivate"
      - "POST /sar/members"
      - "POST /sar/certifications"
      - "POST /sar/resources, POST /sar/resources/{resourceId}/set-status"
    shared_operations:
      - "POST /sar/incidents (with IncidentCommander)"
      - "POST /sar/tasks (with IncidentCommander)"
      - "task start/suspend/resume/debrief/cancel (with IncidentCommander)"
      - "POST /sar/callouts, callout standby/deploy/demobilize (with IncidentCommander)"
      - "resource-assignment create/activate/release/cancel (with IncidentCommander)"
      - "POST /sar/ground-tracks (with Member)"
      - "POST /sar/clues (with IncidentCommander, Member)"
      - "POST /sar/reimbursement-claims (with Member)"
      - "all GET endpoints"
  - name: IncidentCommander
    description: "Incident command: owns command decisions — incident lifecycle (activate/demobilize/close/cancel), task assign & lifecycle, clue evaluation (promote/dismiss/resolve), AAR finalize."
    identity: opaque
    exclusive_operations:
      - "incident activate/demobilize/close/cancel"
      - "POST /sar/tasks/{taskId}/assign"
      - "clue promote/dismiss/resolve"
      - "POST /sar/after-action-reports/{aarId}/finalize"
    shared_operations:
      - "POST /sar/incidents (with Coordinator)"
      - "POST /sar/tasks, task start/suspend/resume/debrief/cancel (with Coordinator)"
      - "POST /sar/callouts, callout standby/deploy/demobilize (with Coordinator)"
      - "resource-assignment create/activate/release/cancel (with Coordinator)"
      - "POST /sar/clues, POST /sar/after-action-reports (with Coordinator)"
      - "all GET endpoints"
  - name: FinanceOfficer
    description: "Finance: owns reimbursement adjudication — return/approve/reject/pay claims."
    identity: opaque
    exclusive_operations:
      - "reimbursement claim return/approve/reject/pay"
    shared_operations:
      - "all GET endpoints"
  - name: Member
    description: "Volunteer, entity-backed by Member. Acts on OWN callouts (acknowledge/decline), OWN reimbursement claims (create/submit), and logs OWN ground-tracks. X-User-ID equals the acting Member.id."
    identity: entity_backed:Member
    exclusive_operations:
      - "callout acknowledge/decline (own callout only)"
      - "reimbursement claim submit (own claim only)"
    shared_operations:
      - "POST /sar/reimbursement-claims (own; with Coordinator)"
      - "POST /sar/ground-tracks (own; with Coordinator)"
      - "POST /sar/clues (with Coordinator, IncidentCommander)"
      - "all GET endpoints"
