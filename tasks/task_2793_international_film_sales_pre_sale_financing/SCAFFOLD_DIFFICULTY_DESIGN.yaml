      - name: discounted_advance_nests_tenor_decay_inside_cap_then_unbonded_haircut
        grounds:
          - calculations.presale_discounted_advance
          - entities.BankingFacility.fields.eligible_collateral_usd
          - entities.BankingFacility.fields.advance_amount_usd
          - entities.BankingFacility.fields.completion_bond_posted
          - entities.Buyer.fields.credit_rating
          - "endpoints[PATCH /film-sales/buyers/{id}]"
        distinguishing_aspect: |
          Combinatorial mode (a) — four inputs (unpaid milestone sum, latest unpaid due_date, the
          facility's discount and advance rates) collapse through a 6dp decay factor, then a nested
          min() against facility_cap_usd, then a conditional 0.50 haircut. Three different answers
          come out of the same facility as only its bond flag and its buyer's rating move:
          500000.00 unbonded, 1000000.00 bonded, 0.00 once the buyer drops to BBB. The cap binds
          (1000000.00 < 1343649.60), so an implementation that haircuts the collateral before the
          cap, or caps after the haircut, cannot reproduce all three figures.
