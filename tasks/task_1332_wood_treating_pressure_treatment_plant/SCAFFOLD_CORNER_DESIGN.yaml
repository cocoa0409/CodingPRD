              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl1_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C2", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl2_id: "$.data.id" }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
