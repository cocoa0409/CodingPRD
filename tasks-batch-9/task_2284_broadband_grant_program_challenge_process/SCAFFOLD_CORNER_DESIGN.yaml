      - name: application_state_beats_program_funds_priority
        claim_type: priority_conflict
        grounds:
          - validations.ERR_APPLICATION_NOT_SELECTED
          - validations.ERR_PROGRAM_FUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / application_state_beats_program_funds_on_award
          rationale: "That instance already violates priority 44 and priority 91 in one call and asserts the state error wins over the fiscal error."

      - name: challenge_window_beats_duplicate_challenge_priority
        claim_type: priority_conflict
        grounds:
          - validations.ERR_CHALLENGE_WINDOW_CLOSED
          - validations.ERR_DUPLICATE_CHALLENGE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / challenge_window_beats_duplicate_challenge
          rationale: "That instance violates priority 65 and priority 75 together and asserts the temporal error wins over the uniqueness error."

      - name: construction_authorization_cross_entity_validation
        claim_type: cross_entity_validation
        grounds:
          - validations.ERR_EHP_NOT_CLEARED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / construction_authorization_gated_by_environmental_review_state
          rationale: "That instance walks the EnvironmentalReview through every non-CLEARED state and asserts authorize-construction is refused in each, then succeeds once CLEARED."

      - name: audit_window_aggregate_temporal_validation
        claim_type: temporal_validation
        grounds:
          - validations.ERR_AUDIT_WINDOW_BUFFER_CONFLICT
          - validations.ERR_LOCATION_CLAIM_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / compliance_audit_closed_window_24h_buffer
          rationale: "That instance and its half-open sibling location_claim_half_open_construction_window_overlap cover both interval semantics at their exact boundary offsets."

  - section: endpoints
    instances:
      - name: program_create_and_read_round_trip
        claim_type: standard_crud
        grounds:
          - response_envelope
          - endpoints.POST_broadband_programs
          - endpoints.GET_broadband_programs_id
        distinguishing_aspect: |
          Every response, success or error, must carry the same three-key envelope with a meta block
          holding api_request_id and api_request_timestamp. A create followed by a read of the same
          id must return response_type object with identical field values, while a read of a missing
          id must return response_type error with the same meta keys present - so the envelope is not
          special-cased on the error path.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /broadband/programs/${p_id}"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "GET /broadband/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the first trigger call returns 200 with response_type == object and meta.api_request_id and meta.api_request_timestamp present"
            - "the returned data reproduces name BEAD Round 1, fiscal_year 2026 and total_appropriation_cents 100000000"
            - "the second trigger call returns ERR_PROGRAM_NOT_FOUND (404) with response_type == error and the same two meta keys present"
            - "the list endpoint GET /broadband/programs returns response_type == array with limit 10 and offset 0 applied by default"

      - name: subgrantee_computed_read_matches_capability_index
        claim_type: computed_read
        grounds:
          - endpoints.GET_broadband_subgrantees_id
          - calculations.subgrantee_capability_index
        distinguishing_aspect: |
          The read must expose the three stored components, not just the rolled-up index, and each
          must match the formula with its own cap: technical min(40, 30) = 30.00, financial
          35.00 * min(1.0, 900000 / (3000000 * 0.25)) = 35.00 at the cap, and managerial
          min(25, 5 * 4 + 5) = 25.00 clipped from a raw 25. The components must sum to the returned
          index of 90.00, which is exactly the CAPABILITY_BONUS_THRESHOLD.
        test_recipe:
          setup:
            - "Program in DRAFT; subgrantee S1 registered, reviewed by reviewer-1 with technical_raw_score 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${p_id}", legal_name: "Northline Fiber Coop", ein: "81-1234567", net_assets_cents: 900000, requested_amount_cents: 3000000, key_personnel_count: 4, has_prior_federal_award: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { s1_id: $.data.id }
            - call: "POST /broadband/subgrantees/${s1_id}/begin-capability-review"
              payload: {}
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /broadband/subgrantees/${s1_id}/record-capability-determination"
              payload: { technical_raw_score: 30 }
              as: CapabilityReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "GET /broadband/subgrantees/${s1_id}"
              payload: {}
              as: ScoringOfficer
              as_user_id: "scorer-1"
          assert:
            - "the trigger returns 200"
            - "Subgrantee.${s1_id}.technical_component == 30.00"
            - "Subgrantee.${s1_id}.financial_component == 35.00"
            - "Subgrantee.${s1_id}.managerial_component == 25.00"
            - "Subgrantee.${s1_id}.capability_index == 90.00"
            - "Subgrantee.${s1_id}.capability_state == QUALIFIED"
            - "Subgrantee.${s1_id}.review_variant == INITIAL"
            - "Subgrantee.${s1_id}.remediation_count == 0"
            - "GET /broadband/subgrantees?program_id=${p_id}&capability_state=QUALIFIED returns total_count == 1"

      - name: location_claim_links_both_reverse_lists
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_broadband_location_claims
          - endpoints.GET_broadband_applications_id_location_claims
          - endpoints.GET_broadband_locations_id_location_claims
        distinguishing_aspect: |
          A LocationClaim is a flat-topology junction with two independent parents, so a single create
          must become visible from both directions at once, and its claim_state must be derived from
          the location's classification: the UNSERVED location yields CLAIMED_ELIGIBLE while the
          SERVED location yields CLAIMED_INELIGIBLE, which in turn splits the application's claim_count
          from its confirmed_location_count.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with L_SERVED (200/25 FIBER) and L_UNSERVED (10/1 DSL)."
            - "Registered subgrantee S1 (capability review not needed to file claims) with a DRAFT application already claiming L_UNSERVED."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
