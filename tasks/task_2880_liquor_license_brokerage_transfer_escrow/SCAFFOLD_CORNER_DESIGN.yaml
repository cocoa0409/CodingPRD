            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
          assert:
            - "valuation-preview data.comp_count == 2 (the NAP licence and the unpriced SON licence are both out)"
            - "valuation-preview data.comp_median_cents == 18500000 (round_half_up of the two-element mean)"
            - "valuation-preview data.comparable_sales_price_cents == 18500000"
            - "valuation-preview data.income_multiple_price_cents == 21600000"
            - "valuation-preview data.divergence_cents == 3100000"
            - "Listing.${lst_id}.market_price_cents == 18500000 and comp_count_at_activation == 2"
            - "County.${c_son}.quota_licenses_counted == 4 so scarcity_bps_at_activation == 0"

      - name: safekeeping_extension_fee_doubles_and_window_chains
        claim_type: constants_applied
        grounds:
          - calculations.safekeeping_grant
          - endpoints[POST /safekeeping-filings/{filing_id}/decide]
          - entities.License.fields.safekeeping_expires_at
          - entities.License.fields.safekeeping_extensions_count
        distinguishing_aspect: "The EXTENSION branch applies SAFEKEEPING_BASE_FEE_CENTS * 2**extension_index and chains effective_from off License.safekeeping_expires_at, so the first extension costs 40000 and runs 2027-08-01 -> 2028-02-01 after requested_months 9 is clamped to EXTENSION_MAX_MONTHS 6."
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100 and one CLASS_41_ONSALE_BEER_WINE licence whose last_active_date is 2026-02-02, exactly 180 nonuse days at the default clock."
            - "An INITIAL filing for 12 months has been granted, so the licence is SAFEKEEPING with safekeeping_expires_at 2027-08-01T00:00:00Z and safekeeping_extensions_count 0."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
