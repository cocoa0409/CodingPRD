            - "${e_closed} == ERR_CORRECTION_WINDOW_CLOSED with HTTP 409 — priority 24 outranks priority 41 when both are violated"
            - "Submission.${sub_a} stays ACCEPTED with resubmission_count == 2 after both refusals, and ReportingWindow.${win_1}.total_head is still 100"

      - name: comment_period_and_notice_minimums_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_28_ERR_COMMENT_PERIOD_TOO_SHORT
          - validations.priority_29_ERR_EFFECTIVE_DATE_TOO_SOON
        distinguishing_aspect: |
          The two calendar minimums of the methodology docket, each pinned one day
          on either side of its boundary against the logical clock at
          2026-08-01T00:00:00Z: a 29-day comment period is refused while exactly
          MIN_COMMENT_DAYS (30) is accepted, and an effective date 29 days after
          the comment close is refused while exactly MIN_NOTICE_DAYS (30) after it
          is accepted — so both are inclusive lower bounds measured from
          different anchors.
        test_recipe:
          setup:
            - "The logical clock is at the startup default 2026-08-01T00:00:00Z; no methodology change exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-A", affected_category: "LIVE_STEER_HEIFER", proposed_weighting_variant: "WEIGHT_WEIGHTED", comment_period_end: "2026-08-30T00:00:00Z", effective_from: "2026-10-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { e_short: $.data.error_id }
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-B", affected_category: "LIVE_STEER_HEIFER", proposed_weighting_variant: "WEIGHT_WEIGHTED", comment_period_end: "2026-08-31T00:00:00Z", effective_from: "2026-09-29T00:00:00Z" }
              as: ProgramAdmin
              captures: { e_soon: $.data.error_id }
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-C", affected_category: "LIVE_STEER_HEIFER", proposed_weighting_variant: "WEIGHT_WEIGHTED", comment_period_end: "2026-08-31T00:00:00Z", effective_from: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { mc_ok: $.data.id }
          assert:
            - "${e_short} == ERR_COMMENT_PERIOD_TOO_SHORT with HTTP 422 (2026-08-30 is 29 days after the clock)"
            - "${e_soon} == ERR_EFFECTIVE_DATE_TOO_SOON with HTTP 422 (2026-09-29 is 29 days after the comment close)"
            - "MethodologyChange.${mc_ok} is created with status COMMENT_OPEN, comment_count == 0, industry_notice_issued_at == null, restated_report_count == 0"
            - "Only one MethodologyChange row exists after the three calls"

      - name: comment_close_and_adoption_prerequisites_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_27_ERR_COMMENT_PERIOD_NOT_ENDED
          - validations.priority_49_ERR_NO_PUBLIC_COMMENTS
        distinguishing_aspect: |
          The docket's two procedural gates, isolated on two sibling changes that
          differ only in whether the public responded: closing the comment period
          before comment_period_end is refused and then succeeds at exactly that
          instant, and adoption of a change that drew zero comments is refused
          while the change that drew one comment adopts — so notice-and-comment is
          enforced as a substantive precondition, not a formality.
        test_recipe:
          setup:
            - "Two COMMENT_OPEN methodology changes, both with comment_period_end 2026-08-31T00:00:00Z: mc_a (LIVE_STEER_HEIFER) receives no comments, mc_b (LIVE_COW_BULL) receives one PublicUser comment."
          setup_api_calls:
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-A", affected_category: "LIVE_STEER_HEIFER", proposed_weighting_variant: "WEIGHT_WEIGHTED", comment_period_end: "2026-08-31T00:00:00Z", effective_from: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { mc_a: $.data.id }
            - call: "POST /methodology-changes"
              payload: { change_code: "MC-2026-B", affected_category: "LIVE_COW_BULL", proposed_weighting_variant: "WEIGHT_WEIGHTED", comment_period_end: "2026-08-31T00:00:00Z", effective_from: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { mc_b: $.data.id }
            - call: "POST /methodology-changes/${mc_b}/comments"
              payload: { commenter_reference: "state-cattlemen", comment_text: "weight weighting better reflects carcass trade", stance: "SUPPORT" }
              as: PublicUser
              captures: { pc_1: $.data.id }
          trigger:
            - call: "POST /methodology-changes/${mc_a}/close-comment"
              payload: {}
              as: ProgramAdmin
              captures: { e_not_ended: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /methodology-changes/${mc_a}/close-comment"
              payload: {}
              as: ProgramAdmin
            - call: "POST /methodology-changes/${mc_a}/adopt"
              payload: {}
              as: ProgramAdmin
              captures: { e_no_comments: $.data.error_id }
            - call: "POST /methodology-changes/${mc_b}/close-comment"
              payload: {}
              as: ProgramAdmin
            - call: "POST /methodology-changes/${mc_b}/adopt"
              payload: {}
              as: ProgramAdmin
          assert:
            - "${e_not_ended} == ERR_COMMENT_PERIOD_NOT_ENDED with HTTP 409 at clock 2026-08-01, and MethodologyChange.${mc_a}.status stays COMMENT_OPEN"
            - "At exactly 2026-08-31T00:00:00Z the same close-comment returns HTTP 200 with status COMMENT_CLOSED — the bound is inclusive"
            - "${e_no_comments} == ERR_NO_PUBLIC_COMMENTS with HTTP 409 for MethodologyChange.${mc_a} (comment_count == 0), which stays COMMENT_CLOSED"
            - "MethodologyChange.${mc_b}.comment_count == 1 and it adopts to status ADOPTED with industry_notice_issued_at set and restated_report_count == 0 (no published report existed)"
            - "PublicComment.${pc_1} is attached to ${mc_b} only"

      - name: penalty_money_gates_and_activation_block_rejected
