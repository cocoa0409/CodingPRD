            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-OV-6-CLOSED-LOOP", street_address: "6 Closed Loop", city: "Fairview", zip_code: "44021", occupancy_class: "RESIDENTIAL", police_beat: "B13"}, as: PermitClerk, captures: {site_ov: $.data.id}}
