      - name: duplicate_batch_number_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_DUPLICATE_BATCH_NUMBER]", "entities.RefundBatch.fields.batch_number"]
        distinguishing_aspect: "batch_number is globally unique across every RefundBatch regardless of channel, so reusing B-DUP on the TRUST channel after it was taken on OPERATING returns 409 ERR_DUPLICATE_BATCH_NUMBER even though the two windows do not overlap."
        test_recipe:
          setup: ["One OPEN RefundBatch B-DUP on the OPERATING channel occupying [2026-08-18T00:00:00Z, 2026-08-20T00:00:00Z)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /refund-batches"
              payload: { batch_number: "B-DUP", bank_account_code: "OPERATING", cutoff_at: "2026-08-18T00:00:00Z", scheduled_run_at: "2026-08-20T00:00:00Z" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { batch_dup_id: "$.data.id" }
          trigger:
            - call: "POST /refund-batches"
              payload: { batch_number: "B-DUP", bank_account_code: "TRUST", cutoff_at: "2026-08-25T00:00:00Z", scheduled_run_at: "2026-08-27T00:00:00Z" }
              as: DisbursementOfficer
              as_user_id: "disb-1"
              captures: { err_id: "$.data.error_id" }
          assert:
