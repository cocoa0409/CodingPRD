scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: facility_creation_returns_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Facility.fields.compliance_status
          - entities.Facility.fields.permit_track
          - entities.Facility.fields.fee_balance_cents
          - entities.Facility.fields.potential_to_emit_tpy
        distinguishing_aspect: "A newly created facility has permit_track=UNPERMITTED, compliance_status=COMPLIANT, potential_to_emit_tpy=0, fee_balance_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Romeo Co", operator_name: "Romeo LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          assert:
            - "Facility.${fac_id}.permit_track == UNPERMITTED"
            - "Facility.${fac_id}.compliance_status == COMPLIANT"
            - "Facility.${fac_id}.potential_to_emit_tpy == 0"
            - "Facility.${fac_id}.fee_balance_cents == 0"
      - name: facility_system_fields_generated
        claim_type: System Fields
        grounds:
          - entities.Facility.common_fields
        distinguishing_aspect: "Server mints id and sets version=1 on create; client cannot supply them."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Sierra Co", operator_name: "Sierra LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
          assert:
            - "Facility.${fac_id}.version == 1"
            - "response data.id is a non-empty server-minted UUID"
      - name: source_control_efficiency_default_zero_applied
        claim_type: Defaults
        grounds:
          - entities.EmissionSource.fields.control_efficiency
          - calculations.source_pte
        distinguishing_aspect: "Omitting control_efficiency defaults it to 0, so controlled_pte_tpy equals uncontrolled_pte_tpy (43.8 == 43.8)."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Tango Co", operator_name: "Tango LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
          trigger:
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
          assert:
            - "EmissionSource.${src_id}.uncontrolled_pte_tpy == 43.8"
            - "EmissionSource.${src_id}.controlled_pte_tpy == 43.8"
      - name: facility_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a random non-existent facility id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
      - name: source_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.EmissionSource.fields.pollutant
        distinguishing_aspect: "POST /sources without the required pollutant field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Uniform Co", operator_name: "Uniform LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
          trigger:
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
      - name: source_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.EmissionSource.fields.pollutant
        distinguishing_aspect: "POST /sources with pollutant outside the enum returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One facility."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Victor Co", operator_name: "Victor LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
          trigger:
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "XENON", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
  # =================================================================
  - section: state_machines
    instances:
      - name: exceedance_report_on_time_returns_reported
        claim_type: Valid Transition
        grounds:
          - state_machines.ExceedanceEvent.OPEN_to_REPORTED
        distinguishing_aspect: "Reporting within 72h of detected_at yields REPORTED (not REPORTED_LATE) and spawns no enforcement."
        test_recipe:
          setup: ["Facility + source; OPEN exceedance detected 2026-03-01; clock still 2026-03-01."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Whiskey Co", operator_name: "Whiskey LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /exceedances"
              payload: { source_id: "${src_id}", event_type: "EXCEEDANCE", detected_at: "2026-03-01T00:00:00Z", magnitude_pct: 5 }
              as: Inspector
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /exceedances/${exc_id}/report"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "ExceedanceEvent.${exc_id}.status == REPORTED"
      - name: stack_test_conduct_passed_sets_monitoring
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StackTest.CONDUCTED_to_PASSED
          - entities.EmissionSource.fields.monitoring_status
        distinguishing_aspect: "measured_rate_lbs (40) <= max (50) → StackTest PASSED and source.monitoring_status becomes STACK_TESTED."
        test_recipe:
          setup: ["Facility + source rate 50; stack test scheduled 2026-03-01..02."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Xray Co", operator_name: "Xray LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /stack-tests"
              payload: { source_id: "${src_id}", scheduled_start: "2026-03-01T00:00:00Z", scheduled_end: "2026-03-02T00:00:00Z" }
              as: Inspector
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /stack-tests/${st_id}/conduct"
              payload: { measured_rate_lbs: 40 }
              as: Inspector
          assert:
            - "StackTest.${st_id}.status == PASSED"
            - "EmissionSource.${src_id}.monitoring_status == STACK_TESTED"
      - name: certify_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.EmissionsInventory.SUBMITTED_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Certify on a DRAFT (not SUBMITTED) inventory returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Facility + source; a DRAFT inventory with one line item."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Yankee Co", operator_name: "Yankee LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 10.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: PermitReviewer
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /inventories/${inv_id}/certify"
              payload: { expected_facility_version: "${fac_v1}" }
              as: PermitReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
      - name: permit_full_issue_happy_path
        claim_type: Valid Transition
        grounds:
          - state_machines.Permit.PUBLIC_NOTICE_to_ISSUED
          - entities.Permit.fields.issued_at
        distinguishing_aspect: "A permit driven through submit->review->public-notice->close->issue reaches ISSUED with issued_at set."
        test_recipe:
          setup: ["Facility + small source (PERMIT_BY_RULE); permit taken to PUBLIC_NOTICE, notice closed after its window."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Zulu Co", operator_name: "Zulu LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "PERMIT_BY_RULE" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /permits/${perm_id}/begin-review"
              payload: {}
              as: PermitReviewer
            - call: "POST /public-notices"
              payload: { permit_id: "${perm_id}", comment_open_at: "2026-03-01T00:00:00Z", comment_close_at: "2026-03-05T00:00:00Z" }
              as: PermitReviewer
              captures: { notice_id: $.data.id }
            - call: "POST /permits/${perm_id}/open-public-notice"
              payload: {}
              as: PermitReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: PermitReviewer
            - call: "POST /public-notices/${notice_id}/close"
              payload: {}
              as: PermitReviewer
          trigger:
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: PermitReviewer
          assert:
            - "Permit.${perm_id}.status == ISSUED"
      - name: inventory_reject_returns_to_draft
        claim_type: Valid Transition
        grounds:
          - state_machines.EmissionsInventory.SUBMITTED_to_DRAFT
        distinguishing_aspect: "Reject on a SUBMITTED inventory returns it to DRAFT (revision cycle)."
        test_recipe:
          setup: ["Facility + source; a SUBMITTED inventory with one line item."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Alpha2 Co", operator_name: "Alpha2 LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 10.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /inventories/${inv_id}/reject"
              payload: {}
              as: PermitReviewer
          assert:
            - "EmissionsInventory.${inv_id}.status == DRAFT"
      - name: enforcement_variance_granted_branch
        claim_type: Valid Transition
        grounds:
          - state_machines.EnforcementAction.INITIATED_to_VARIANCE_GRANTED
        distinguishing_aspect: "A VARIANCE enforcement action with a valid window transitions INITIATED->VARIANCE_GRANTED."
        test_recipe:
          setup: ["Facility; an INITIATED VARIANCE enforcement action."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Bravo2 Co", operator_name: "Bravo2 LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /enforcement-actions"
              payload: { facility_id: "${fac_id}", action_type: "VARIANCE", origin: "MANUAL" }
              as: EnforcementOfficer
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/grant-variance"
              payload: { variance_start: "2026-04-01T00:00:00Z", variance_end: "2026-05-01T00:00:00Z" }
              as: EnforcementOfficer
          assert:
            - "EnforcementAction.${ea_id}.status == VARIANCE_GRANTED"
      - name: permit_renewal_cycle_increments_count
        claim_type: Valid Transition
        grounds:
          - state_machines.Permit.ISSUED_to_RENEWAL_PENDING
          - state_machines.Permit.RENEWAL_PENDING_to_ISSUED
          - entities.Permit.fields.renewal_count
        distinguishing_aspect: "ISSUED->RENEWAL_PENDING->ISSUED loop increments renewal_count to 1 and returns to ISSUED."
        test_recipe:
          setup: ["An ISSUED PERMIT_BY_RULE permit; renewal started."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Charlie2 Co", operator_name: "Charlie2 LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 10, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 50, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "PERMIT_BY_RULE" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "POST /permits/${perm_id}/begin-review"
              payload: {}
              as: PermitReviewer
            - call: "POST /public-notices"
              payload: { permit_id: "${perm_id}", comment_open_at: "2026-03-01T00:00:00Z", comment_close_at: "2026-03-05T00:00:00Z" }
              as: PermitReviewer
              captures: { notice_id: $.data.id }
            - call: "POST /permits/${perm_id}/open-public-notice"
              payload: {}
              as: PermitReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: PermitReviewer
            - call: "POST /public-notices/${notice_id}/close"
              payload: {}
              as: PermitReviewer
            - call: "POST /permits/${perm_id}/issue"
              payload: {}
              as: PermitReviewer
            - call: "POST /permits/${perm_id}/start-renewal"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /permits/${perm_id}/complete-renewal"
              payload: {}
              as: PermitReviewer
          assert:
            - "Permit.${perm_id}.status == ISSUED"
            - "Permit.${perm_id}.renewal_count == 1"
  # =================================================================
  - section: calculations
    instances:
      - name: fee_small_emitter_discount_applied
        claim_type: Constants Applied
        grounds:
          - calculations.emissions_fee
          - entities.EmissionsInventory.fields.estimated_fee_cents
        distinguishing_aspect: "A 15.0-ton total gives gross 67500 < SMALL_EMITTER_CEILING_CENTS (100000) so the 10% discount applies → 60750 (above MIN_FEE floor)."
        test_recipe:
          setup: ["Facility + source; inventory with a single 15.000-ton line item; submitted."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Delta2 Co", operator_name: "Delta2 LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 15.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "EmissionsInventory.${inv_id}.estimated_fee_cents == 60750"
      - name: fee_min_fee_floor_applied
        claim_type: Constants Applied
        grounds:
          - calculations.emissions_fee
          - entities.EmissionsInventory.fields.estimated_fee_cents
        distinguishing_aspect: "A 1.0-ton total (gross 4500, discounted 4050) is lifted to the MIN_FEE_CENTS floor of 50000."
        test_recipe:
          setup: ["Facility + source; inventory with a single 1.000-ton line item; submitted."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Echo2 Co", operator_name: "Echo2 LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /inventories"
              payload: { facility_id: "${fac_id}", reporting_year: 2025, due_at: "2026-12-31T00:00:00Z" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { inv_id: $.data.id }
            - call: "POST /line-items"
              payload: { inventory_id: "${inv_id}", source_id: "${src_id}", method: "ESTIMATED", reported_tons: 1.000 }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /inventories/${inv_id}/submit"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
          assert:
            - "EmissionsInventory.${inv_id}.estimated_fee_cents == 50000"
      - name: penalty_late_exceedance_escalation
        claim_type: Correct Result
        grounds:
          - calculations.enforcement_penalty
          - state_machines.ExceedanceEvent.OPEN_to_REPORTED_LATE
          - entities.EnforcementAction.fields.penalty_cents
        distinguishing_aspect: "Late report 4 days after detection with magnitude 20 (sev 2) gives 250000*2 + 50000*4 = 700000 on the auto-created NOV."
        test_recipe:
          setup: ["Facility + source; OPEN exceedance detected 2026-03-01 magnitude 20; reported at 2026-03-05 (late) spawning an INITIATED NOV enforcement action."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Foxtrot2 Co", operator_name: "Foxtrot2 LLC", county: "Kern" }
              as: FacilityOperator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /sources"
              payload: { facility_id: "${fac_id}", source_type: "BOILER", pollutant: "NOX", max_hourly_rate_lbs: 50, operating_hours_per_year: 8760, control_efficiency: 0, permit_limit_ppm: 100, expected_facility_version: "${fac_v0}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { src_id: $.data.id }
            - call: "POST /exceedances"
              payload: { source_id: "${src_id}", event_type: "EXCEEDANCE", detected_at: "2026-03-01T00:00:00Z", magnitude_pct: 20 }
              as: Inspector
              captures: { exc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: Inspector
            - call: "POST /exceedances/${exc_id}/report"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "GET /facilities/${fac_id}/enforcement-actions"
              payload: {}
              as: EnforcementOfficer
              captures: { ea_id: "$.data[0].id" }
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/assess-penalty"
