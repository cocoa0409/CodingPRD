          assert:
            - "the trigger is refused ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED (409): it strictly overlaps both SCHEDULED windows and the capacity is 2"
            - "ProcedureRecord.${pr3_id}.calibration_status is still REQUIRED with bay_id null, and CalibrationBay.${bay_id}.scheduled_window_count == 2"
            - "the same record scheduled 11:00:00Z - 11:30:00Z succeeds - it touches record 1's end instant, which does not overlap under [start, end), and overlaps only record 2"
