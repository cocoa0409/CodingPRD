# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 1127: Tree-Nut Huller & Processor. 9 rules x 2 instances = 18.
# All chains start from empty DB. Clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: kernel_weight_provisional_vs_final
        grounds:
          - calculations.kernel_weight_grading
          - entities.FieldLot.fields.provisional_kernel_lbs
          - entities.FieldLot.fields.graded_kernel_weight_lbs
        distinguishing_aspect: |
          Two valid algorithms on the SAME lot produce different kernel weights:
          provisional (intake estimate with moisture shrink) = 6242.60 lbs while
          final (completed-run output x edible grade) = 5400.00 lbs. This instance
          sits in the FieldLot/lot-grading entity domain.
        test_recipe:
          setup:
            - "Grower G1 (base 250 c/lb, premium 0.10); lot gross 10000 lbs"
            - "MOISTURE_KERNEL test: moisture 10.0, kernel_pct 0.65, fm 0.02"
            - "AFLATOXIN test 5.0 ppb (PASS) -> lot GRADED"
            - "Drying batch completed (final moisture 6.0) since moisture 10.0 > 8.0"
            - "Lot routed KERNEL; one run completed 6000/2000/1500; KERNEL_GRADE edible 0.90"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250, premium_rate_pct: 0.10 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 10000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 10.0, kernel_pct: 0.65, foreign_material_pct: 0.02 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 5.0 }
              as: LabTechnician
            - call: "POST /dryers"
              payload: { dryer_code: "D-1", capacity_lbs: 60000 }
              as: PlantAdmin
              captures: { dryer1: $.data.id }
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lot1}", start_at: "2026-05-02T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: PlantOperator
              captures: { batch1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/complete"
              payload: { final_moisture_pct: 6.0 }
              as: PlantOperator
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 6000, shell_out_lbs: 2000, hull_out_lbs: 1500 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.90, size_spec: "SPEC_23_25" }
              as: LabTechnician
          trigger:
            - call: "GET /lots/${lot1}"
              as: PlantOperator
          assert:
            - "FieldLot.${lot1}.provisional_kernel_lbs == 6242.60 (= 10000 * 0.65 * 0.98 * (1 - 0.01*2.0))"
            - "FieldLot.${lot1}.graded_kernel_weight_lbs == 5400.00 (= 6000 * 0.90)"
            - "FieldLot.${lot1}.provisional_kernel_lbs != FieldLot.${lot1}.graded_kernel_weight_lbs"
            - "FieldLot.${lot1}.status == PROCESSED"

      - name: bin_capacity_now_vs_projected
        grounds:
          - calculations.bin_capacity_projection
          - entities.StorageBin.fields.available_now_lbs
          - entities.StorageBin.fields.projected_available_lbs
        distinguishing_aspect: |
          Two valid capacity readings on the SAME bin diverge: current
          (available_now) = 3000 lbs vs forward-looking (projected, net of PLANNED
          shipment reservations) = 2000 lbs. This instance sits in the
          StorageBin/capacity entity domain — a different domain from the
          kernel-weight grading variant pair.
        test_recipe:
          setup:
            - "Processed KERNEL lot (kernel_out 2400, size SPEC_23_25); bin cap 5000 allowing KERNEL"
            - "Placement of 2000 lbs KERNEL in the bin (STORED)"
            - "OPEN contract (KERNEL, SPEC_23_25, required 10000) with a PLANNED shipment of 1000 lbs allocated from the placement"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250, premium_rate_pct: 0.10 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 5000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
              captures: { run1: $.data.id }
            - call: "POST /processing-runs/${run1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run1}/complete"
              payload: { kernel_out_lbs: 2400, shell_out_lbs: 1300, hull_out_lbs: 900 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.80, size_spec: "SPEC_23_25" }
              as: LabTechnician
            - call: "POST /bins"
              payload: { bin_code: "B-1", capacity_lbs: 5000, allowed_product_forms: ["KERNEL"] }
              as: PlantAdmin
              captures: { bin1: $.data.id }
            - call: "POST /placements"
              payload: { bin_id: "${bin1}", lot_id: "${lot1}", product_form: "KERNEL", quantity_lbs: 2000 }
              as: PlantOperator
              captures: { pl1: $.data.id }
            - call: "POST /buyers"
              payload: { name: "Acme Snacks", buyer_code: "AC-1" }
              as: PlantAdmin
              captures: { by1: $.data.id }
            - call: "POST /contracts"
              payload: { buyer_id: "${by1}", product_form: "KERNEL", size_spec: "SPEC_23_25", max_defects_pct: 0.05, price_cents_per_lb: 300, required_qty_lbs: 10000 }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "GET /contracts/${c1}"
              as: PlantOperator
              captures: { c1_v: $.data.version }
            - call: "POST /shipments"
              payload: { contract_id: "${c1}", bin_id: "${bin1}", quantity_lbs: 1000, expected_contract_version: "${c1_v}" }
              as: PlantOperator
              captures: { sh1: $.data.id }
          trigger:
            - call: "GET /bins/${bin1}"
              as: PlantOperator
          assert:
            - "StorageBin.${bin1}.occupied_lbs == 2000"
            - "StorageBin.${bin1}.available_now_lbs == 3000 (current variant: 5000 - 2000)"
            - "StorageBin.${bin1}.projected_available_lbs == 2000 (forward-looking variant: 5000 - 2000 - 1000)"
            - "StorageBin.${bin1}.projected_available_lbs != StorageBin.${bin1}.available_now_lbs"
            - "Shipment.${sh1}.status == PLANNED"

  - rule_id: combinatorial_formula
    instances:
      - name: settlement_component_rounding_order
        grounds:
          - calculations.settlement_amount
          - entities.Settlement.fields.total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: each component is rounded to whole cents
          BEFORE summation. With graded 3240.00 lbs, price 247 c/lb, premium
          7.5% (edible 0.72 >= 0.70) and moisture excess 1.5 points:
          base 800280, premium 60021, deduction 6002, total 854299 — pinned to
          round-per-component-then-sum; sum-then-round would give a different cent.
        test_recipe:
          setup:
            - "Grower G2 (base 247 c/lb, premium_rate 0.075)"
            - "Lot gross 8000; MK test moisture 11.5 / kernel 0.60 / fm 0.03; AFLATOXIN 3.0 PASS"
            - "Drying batch completed final moisture 9.5 (excess 1.5 over 8.0)"
            - "Routed KERNEL; run completed kernel 4500 / shell 1800 / hull 1200; KERNEL_GRADE edible 0.72"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Delta Farms", ranch_code: "DF-02", base_price_cents_per_lb: 247, premium_rate_pct: 0.075 }
              as: PlantAdmin
              captures: { g2: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g2}", variety: "Butte", gross_weight_lbs: 8000 }
              as: IntakeOperator
              captures: { lot2: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "MOISTURE_KERNEL", moisture_pct: 11.5, kernel_pct: 0.60, foreign_material_pct: 0.03 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "AFLATOXIN", aflatoxin_ppb: 3.0 }
              as: LabTechnician
            - call: "POST /dryers"
              payload: { dryer_code: "D-1", capacity_lbs: 60000 }
              as: PlantAdmin
              captures: { dryer1: $.data.id }
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lot2}", start_at: "2026-05-02T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: PlantOperator
              captures: { batch1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/complete"
              payload: { final_moisture_pct: 9.5 }
              as: PlantOperator
            - call: "POST /lots/${lot2}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot2}"
              as: PlantOperator
              captures: { lot2_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot2}", expected_lot_version: "${lot2_v}" }
              as: PlantOperator
              captures: { run2: $.data.id }
            - call: "POST /processing-runs/${run2}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run2}/complete"
              payload: { kernel_out_lbs: 4500, shell_out_lbs: 1800, hull_out_lbs: 1200 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.72, size_spec: "SPEC_25_27" }
              as: LabTechnician
          trigger:
            - call: "POST /settlements"
              payload: { lot_id: "${lot2}" }
              as: PlantAdmin
              captures: { st2: $.data.id }
          assert:
            - "Settlement.${st2}.graded_kernel_weight_lbs == 3240.00 (= 4500 * 0.72)"
            - "Settlement.${st2}.base_cents == 800280 (= round(3240.00 * 247))"
            - "Settlement.${st2}.premium_cents == 60021 (= round(800280 * 0.075); edible 0.72 >= 0.70)"
            - "Settlement.${st2}.moisture_deduction_cents == 6002 (= round(800280 * 0.005 * 1.5); post-dry moisture 9.5)"
            - "Settlement.${st2}.total_cents == 854299 (= 800280 + 60021 - 6002, summed AFTER per-component rounding)"

      - name: provisional_kernel_multi_input_shrink
        grounds:
          - calculations.kernel_weight_grading
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: the nested
          max(0, moisture - 8.0) conditional branch decides whether the shrink
          factor engages. Lot A (moisture 7.0, branch off) yields 1980.00;
          identical lot B except moisture 9.5 (branch on) yields 1950.30 —
          a different mode from settlement_component_rounding_order's nested rounding.
        test_recipe:
          setup:
            - "Grower G1; lot A gross 4000, MK moisture 7.0 / kernel 0.50 / fm 0.01"
            - "Lot B gross 4000, MK moisture 9.5 / kernel 0.50 / fm 0.01 (only moisture differs)"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250, premium_rate_pct: 0.10 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 4000 }
              as: IntakeOperator
              captures: { lotA: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotA}", test_type: "MOISTURE_KERNEL", moisture_pct: 7.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 4000 }
              as: IntakeOperator
              captures: { lotB: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lotB}", test_type: "MOISTURE_KERNEL", moisture_pct: 9.5, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
          trigger:
            - call: "GET /lots/${lotA}"
              as: IntakeOperator
            - call: "GET /lots/${lotB}"
              as: IntakeOperator
          assert:
            - "FieldLot.${lotA}.provisional_kernel_lbs == 1980.00 (= 4000 * 0.50 * 0.99 * 1.00; moisture branch inactive)"
            - "FieldLot.${lotA}.requires_drying == false"
            - "FieldLot.${lotB}.provisional_kernel_lbs == 1950.30 (= 4000 * 0.50 * 0.99 * (1 - 0.01*1.5); moisture branch active)"
            - "FieldLot.${lotB}.requires_drying == true"

  - rule_id: non_linear_state_machine
    instances:
      - name: lot_reject_resample_cycle
        grounds:
          - state_machines.FieldLot.REJECTED_to_SAMPLED
          - state_machines.FieldLot.SAMPLED_to_REJECTED
          - state_machines.FieldLot.SAMPLED_to_GRADED
        distinguishing_aspect: |
          FieldLot's machine is cyclic: SAMPLED -> REJECTED -> (resample)
          SAMPLED -> GRADED. The lot loops back to an earlier state and the
          aflatoxin_ppb field is cleared by the loop-back edge.
        test_recipe:
          setup:
            - "Grower G1; lot gross 3000; MK test recorded (moisture 6.0 / kernel 0.50 / fm 0.01)"
            - "First AFLATOXIN test 25.0 ppb -> FAIL -> lot REJECTED"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 3000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 25.0 }
              as: LabTechnician
          trigger:
            - call: "POST /lots/${lot1}/resample"
              payload: {}
              as: IntakeOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 4.0 }
              as: LabTechnician
            - call: "GET /lots/${lot1}"
              as: IntakeOperator
          assert:
            - "after resample: FieldLot.${lot1}.status == SAMPLED and aflatoxin_ppb == null"
            - "after second AFLATOXIN PASS: FieldLot.${lot1}.status == GRADED and aflatoxin_ppb == 4.0"

      - name: settlement_issue_void_loop
        grounds:
          - state_machines.Settlement.DRAFT_to_ISSUED
          - state_machines.Settlement.ISSUED_to_DRAFT
          - state_machines.Settlement.ISSUED_to_PAID
        distinguishing_aspect: |
          Settlement's machine is a branching revert loop (DRAFT -> ISSUED ->
          DRAFT -> ISSUED -> PAID), a different entity from FieldLot's cycle.
          The void edge undoes approve's ledger effect; pay ends the loop and
          bubbles the lot to SETTLED.
        test_recipe:
          setup:
            - "Processed lot with KERNEL_GRADE (graded 3240.00) per the settlement chain; Settlement DRAFT total 854299"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Delta Farms", ranch_code: "DF-02", base_price_cents_per_lb: 247, premium_rate_pct: 0.075 }
              as: PlantAdmin
              captures: { g2: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g2}", variety: "Butte", gross_weight_lbs: 8000 }
              as: IntakeOperator
              captures: { lot2: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "MOISTURE_KERNEL", moisture_pct: 11.5, kernel_pct: 0.60, foreign_material_pct: 0.03 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "AFLATOXIN", aflatoxin_ppb: 3.0 }
              as: LabTechnician
            - call: "POST /dryers"
              payload: { dryer_code: "D-1", capacity_lbs: 60000 }
              as: PlantAdmin
              captures: { dryer1: $.data.id }
            - call: "POST /drying-batches"
              payload: { dryer_id: "${dryer1}", lot_id: "${lot2}", start_at: "2026-05-02T00:00:00Z", end_at: "2026-05-03T00:00:00Z" }
              as: PlantOperator
              captures: { batch1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /drying-batches/${batch1}/complete"
              payload: { final_moisture_pct: 9.5 }
              as: PlantOperator
            - call: "POST /lots/${lot2}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot2}"
              as: PlantOperator
              captures: { lot2_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot2}", expected_lot_version: "${lot2_v}" }
              as: PlantOperator
              captures: { run2: $.data.id }
            - call: "POST /processing-runs/${run2}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /processing-runs/${run2}/complete"
              payload: { kernel_out_lbs: 4500, shell_out_lbs: 1800, hull_out_lbs: 1200 }
              as: PlantOperator
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot2}", test_type: "KERNEL_GRADE", edible_kernel_pct: 0.72, size_spec: "SPEC_25_27" }
              as: LabTechnician
            - call: "POST /settlements"
              payload: { lot_id: "${lot2}" }
              as: PlantAdmin
              captures: { st2: $.data.id }
          trigger:
            - call: "POST /settlements/${st2}/approve"
              payload: {}
              as: PlantAdmin
            - call: "POST /settlements/${st2}/void"
              payload: {}
              as: PlantAdmin
            - call: "POST /settlements/${st2}/approve"
              payload: {}
              as: PlantAdmin
            - call: "POST /settlements/${st2}/pay"
              payload: {}
              as: PlantAdmin
          assert:
            - "after first approve: Settlement.${st2}.status == ISSUED and Grower.${g2}.payable_outstanding_cents == 854299"
            - "after void: Settlement.${st2}.status == DRAFT and Grower.${g2}.payable_outstanding_cents == 0"
            - "after re-approve + pay: Settlement.${st2}.status == PAID"
            - "Grower.${g2}.lifetime_paid_cents == 854299 and payable_outstanding_cents == 0"
            - "FieldLot.${lot2}.status == SETTLED (bubble-up on pay)"

  - rule_id: transitive_cascade
    instances:
      - name: aflatoxin_fail_three_hop_quarantine
        grounds:
          - state_machines.FieldLot.PROCESSED_to_REJECTED
          - state_machines.StoragePlacement.STORED_to_QUARANTINED
          - state_machines.Shipment.PLANNED_to_BLOCKED
        distinguishing_aspect: |
          Depth-3 chain from POST /lab-tests: AFLATOXIN FAIL mutates the lot
          (PROCESSED -> REJECTED); that mutation quarantines the lot's STORED
          placements; that mutation blocks PLANNED shipments allocating them.
          Each hop is caused by the previous hop, not by the test call.
        test_recipe:
          setup:
            - "Processed KERNEL lot (kernel_out 2400, SPEC_23_25); bin B1 with placement 2000 KERNEL (STORED)"
            - "OPEN contract required 10000; PLANNED shipment 1000 allocated from the placement"
          setup_api_calls:
            - call: "POST /growers"
              payload: { name: "Riverbend Orchards", ranch_code: "RB-01", base_price_cents_per_lb: 250 }
              as: PlantAdmin
              captures: { g1: $.data.id }
            - call: "POST /lots"
              payload: { grower_id: "${g1}", variety: "Nonpareil", gross_weight_lbs: 5000 }
              as: IntakeOperator
              captures: { lot1: $.data.id }
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "MOISTURE_KERNEL", moisture_pct: 6.0, kernel_pct: 0.50, foreign_material_pct: 0.01 }
              as: LabTechnician
            - call: "POST /lab-tests"
              payload: { lot_id: "${lot1}", test_type: "AFLATOXIN", aflatoxin_ppb: 2.0 }
              as: LabTechnician
            - call: "POST /lots/${lot1}/route"
              payload: { route: "KERNEL" }
              as: IntakeOperator
            - call: "GET /lots/${lot1}"
              as: PlantOperator
              captures: { lot1_v: $.data.version }
            - call: "POST /processing-runs"
              payload: { lot_id: "${lot1}", expected_lot_version: "${lot1_v}" }
              as: PlantOperator
