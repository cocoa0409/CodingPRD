              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-NE", "state_code": "AZ", "asking_price_cents": 460000, "listed_mrr_cents": 43000, "listed_account_count": 3, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"listing_id": "$.data.id"}
            - call: "POST /service-accounts"
