          rationale: "Asserted as the existence-versus-payload pairing of the named difficulty instance."

      - name: seasonal_gate_precedes_occupancy_gate_on_visit_create
        claim_type: Priority conflict
        grounds: ["validations[priority=33]", "validations[priority=39]", "errors[ERR_SEASONAL_STATE_FORBIDS_VISIT]", "errors[ERR_OCCUPANCY_FORBIDS_VISIT]"]
        distinguishing_aspect: "A TURNOVER_INSPECT visit requested on a property that is BOTH in seasonal_state CLOSING (rung 33 violated) and occupancy_state RENTAL_OCCUPIED (rung 39 violated) returns ERR_SEASONAL_STATE_FORBIDS_VISIT, because G6 is evaluated in full before G7."
        test_recipe:
          setup:
            - "A rental-enrolled Z2 property with an ACTIVE STANDARD subscription."
            - "The occupancy axis moved to RENTAL_OCCUPIED first (which requires seasonal_state OPEN), and the seasonal axis then moved to CLOSING."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
