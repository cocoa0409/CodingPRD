          - entities.CensusDay.fields.census_class
        distinguishing_aspect: |
          A stay of 27 days containing one closed hospitalization yields exactly 27 CensusDay rows -
          one per calendar date, none duplicated and none missing: 2026-08-19 is a RESIDENT_DAY,
          the hospitalization start 2026-08-20 is a BED_HOLD_DAY priced at the rounded half rate
          5929, 2026-08-23 is still a BED_HOLD_DAY and the readmission date 2026-08-24 is a
