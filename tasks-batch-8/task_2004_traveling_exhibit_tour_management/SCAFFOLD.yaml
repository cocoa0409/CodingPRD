# =============================================================================
# PRD Benchmark Scaffold — task_2004_traveling_exhibit_tour_management
# =============================================================================

scenario: |
  2004. Traveling Exhibit Tour Management (traveling exhibition company): venue
  booking & tour route sequencing, participation fee & contract terms,
  crate/component inventory & shipping between venues, installation manual &
  on-site supervision, condition inspection & damage claim between venues,
  marketing kit & local sponsorship rights, insurance transfer & certificates,
  refurbishment window & tour retirement

domain_name: traveling-exhibit-tours
api_prefix: /tours

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Tour
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: title, type: string, source: input, description: "Exhibit tour title" }
      - { name: exhibit_code, type: string, source: input, description: "Unique exhibit identifier (e.g. DINOSAURS-2026)", constraints: "Unique across all tours" }
      - { name: crate_count, type: integer, source: input, description: "Total number of crates that make up the exhibit" }
      - { name: declared_value_cents, type: integer, source: input, description: "Total insured declared value of the exhibit in cents" }
      - { name: refurbishment_gap_days, type: integer, source: input, description: "Minimum days of refurbishment required between consecutive stops", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT → BOOKING → ON_TOUR / IN_REFURBISHMENT → RETIRED", constraints: "{DRAFT, BOOKING, ON_TOUR, IN_REFURBISHMENT, RETIRED}" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Sum of FINAL participation fees billed across all stops" }
      - { name: total_collected_cents, type: integer, source: computed, description: "Sum of payments applied to participation fees" }
      - { name: total_waived_cents, type: integer, source: computed, description: "Sum of sponsorship-credit waivers applied to participation fees" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: city, type: string, source: input, description: "Host city" }
      - { name: climate_controlled, type: boolean, source: input, description: "Whether the gallery is climate controlled" }
      - { name: max_gallery_sqm, type: integer, source: input, description: "Maximum gallery square meters available for the exhibit" }
      - { name: local_sponsorship_cap_cents, type: integer, source: input, description: "Maximum local sponsorship dollars (cents) the venue may raise against participation fee" }

  - name: TourStop
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: seq, type: integer, source: system, description: "Route sequence position assigned at booking time (chronological by install_start)" }
      - { name: install_start, type: datetime, source: input, description: "Install window start (inclusive), ISO 8601 UTC" }
      - { name: open_date, type: datetime, source: input, description: "Public opening date, ISO 8601 UTC" }
      - { name: close_date, type: datetime, source: input, description: "Public closing date, ISO 8601 UTC" }
      - { name: teardown_end, type: datetime, source: input, description: "Teardown window end (exclusive), ISO 8601 UTC" }
      - { name: projected_attendance, type: integer, source: input, description: "Projected visitor count used in PROVISIONAL fee" }
      - { name: actual_attendance, type: integer, source: input, description: "Final visitor count reported by venue; required before fee finalization", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "TENTATIVE → CONTRACTED → INSTALLING → OPEN → TEARDOWN → CLOSED | CANCELLED", constraints: "{TENTATIVE, CONTRACTED, INSTALLING, OPEN, TEARDOWN, CLOSED, CANCELLED}" }
      - { name: supervision_required, type: boolean, source: computed, description: "True when venue is NOT climate_controlled OR exhibit crate_count > CLIMATE_EXEMPT_CRATE_MAX; forces on-site supervisor assignment" }

  - name: ParticipationContract
    parent: TourStop
    common_fields: true
    fields:
      - { name: tour_stop_id, type: string, source: system, description: "FK -> TourStop.id" }
      - { name: base_fee_cents, type: integer, source: input, description: "Base participation fee in cents before attendance tier uplift" }
      - { name: sponsorship_credit_cents, type: integer, source: input, description: "Local sponsorship dollars (cents) the venue commits; credited against fee up to venue cap" }
      - { name: status, type: enum, source: system, description: "DRAFT → SENT → SIGNED → FINALIZED; SENT → DRAFT amendment loop allowed", constraints: "{DRAFT, SENT, SIGNED, FINALIZED}" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "PROVISIONAL variant of participation_fee using projected_attendance" }
      - { name: final_fee_cents, type: integer, source: computed, description: "FINAL variant of participation_fee using actual_attendance; null until finalization" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of applied fee payments" }

  - name: Crate
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: crate_label, type: string, source: input, description: "Human-readable crate label (e.g. CRATE-07)", constraints: "Unique within tour" }
      - { name: contents_value_cents, type: integer, source: input, description: "Declared value of contents in cents" }
      - { name: location_status, type: enum, source: system, description: "AT_ORIGIN → IN_TRANSIT → AT_VENUE → IN_REFURBISHMENT", constraints: "{AT_ORIGIN, IN_TRANSIT, AT_VENUE, IN_REFURBISHMENT}" }
      - { name: current_stop_id, type: string, source: system, description: "FK -> TourStop.id; the stop the crate is currently at or bound for; null while AT_ORIGIN" }
      - { name: condition_score, type: integer, source: computed, description: "Latest condition score 0-100 from most recent FINAL condition report covering this crate" }

  - name: Shipment
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: origin_stop_id, type: string, source: input, description: "FK -> TourStop.id; stop the crates depart from; null only for the first leg departing AT_ORIGIN inventory", constraints: "nullable" }
      - { name: destination_stop_id, type: string, source: input, description: "FK -> TourStop.id; stop the crates are bound for" }
      - { name: depart_at, type: datetime, source: input, description: "Departure timestamp, ISO 8601 UTC" }
      - { name: arrive_at, type: datetime, source: input, description: "Arrival timestamp, ISO 8601 UTC" }
      - { name: carrier_name, type: string, source: input, description: "Freight carrier name" }
      - { name: status, type: enum, source: system, description: "PLANNED → DISPATCHED → IN_TRANSIT → RECEIVED → CLEARED | DAMAGE_HOLD → CLEARED", constraints: "{PLANNED, DISPATCHED, IN_TRANSIT, RECEIVED, DAMAGE_HOLD, CLEARED}" }

  - name: ConditionReport
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id" }
      - { name: crate_id, type: string, source: input, description: "FK -> Crate.id" }
      - { name: inspector_name, type: string, source: input, description: "Registrar performing the inspection" }
      - { name: phase, type: enum, source: input, description: "UNPACK at destination or PACK at origin", constraints: "{UNPACK, PACK}" }
      - { name: surface_score, type: integer, source: input, description: "Surface condition 0-100", constraints: "0 <= x <= 100" }
      - { name: structural_score, type: integer, source: input, description: "Structural condition 0-100", constraints: "0 <= x <= 100" }
      - { name: seal_intact, type: boolean, source: input, description: "Whether tamper seal was intact on arrival" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → ACCEPTED | DISPUTED → ACCEPTED", constraints: "{DRAFT, SUBMITTED, ACCEPTED, DISPUTED}" }
      - { name: composite_score, type: integer, source: computed, description: "Weighted condition score per condition_score calculation" }

  - name: DamageClaim
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id" }
      - { name: condition_report_id, type: string, source: input, description: "FK -> ConditionReport.id evidencing the damage" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Total claimed amount in cents" }
      - { name: line_items, type: array, source: input, description: "Array of {description, amount_cents} damage line items" }
      - { name: status, type: enum, source: system, description: "FILED → UNDER_REVIEW → APPROVED → PAID | DENIED", constraints: "{FILED, UNDER_REVIEW, APPROVED, DENIED, PAID}" }
      - { name: assessed_payout_cents, type: integer, source: computed, description: "Payout per damage_claim_payout calculation; set on APPROVED" }

  - name: MarketingKit
    parent: TourStop
    common_fields: true
    fields:
      - { name: tour_stop_id, type: string, source: system, description: "FK -> TourStop.id" }
      - { name: language_count, type: integer, source: input, description: "Number of language editions to produce" }
      - { name: sponsor_logo_slots, type: integer, source: input, description: "Number of local sponsor logo slots sold by the venue" }
      - { name: press_release_sent, type: boolean, source: system, default: false, description: "Whether the tour press release has been issued to this venue" }
      - { name: status, type: enum, source: system, description: "PLANNED → PRODUCED → DELIVERED → RETIRED", constraints: "{PLANNED, PRODUCED, DELIVERED, RETIRED}" }
      - { name: production_cost_cents, type: integer, source: computed, description: "Per marketing_kit_cost calculation" }

  - name: InsuranceCertificate
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: tour_stop_id, type: string, source: input, description: "FK -> TourStop.id the certificate covers" }
      - { name: insurer_name, type: string, source: input, description: "Issuing insurer" }
      - { name: coverage_cents, type: integer, source: input, description: "Coverage amount in cents; must be >= tour.declared_value_cents" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive), ISO 8601 UTC" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (exclusive), ISO 8601 UTC" }
      - { name: status, type: enum, source: system, description: "ISSUED → ACTIVE → EXPIRED | VOID", constraints: "{ISSUED, ACTIVE, EXPIRED, VOID}" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Tour
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: BOOKING
        trigger: "POST /tours/{id}/transition (action=OPEN_BOOKING)"
        actor: TourManager
        preconditions:
          - "tour.crate_count > 0"
          - "At least one Crate row exists for this tour"
        side_effects: []

      - from: BOOKING
        to: ON_TOUR
        trigger: "system (first TourStop reaches INSTALLING)"
        actor: system
        preconditions:
          - "Exists TourStop with tour_id == tour.id and status == INSTALLING"
        side_effects:
          - "Crates bound for that stop move IN_TRANSIT -> AT_VENUE per Shipment RECEIVED"

      - from: ON_TOUR
        to: IN_REFURBISHMENT
        trigger: "system (a TourStop reaches CLOSED and the next stop's install_start is strictly more than refurbishment_gap_days after this stop's teardown_end)"
        actor: system
        preconditions:
          - "Closed stop is the latest CLOSED stop by teardown_end"
          - "Next stop exists with status in {TENTATIVE, CONTRACTED}"
          - "next.install_start - closed.teardown_end > tour.refurbishment_gap_days"
        side_effects:
          - "All crates with location_status == AT_VENUE on the closed stop move to IN_REFURBISHMENT"

      - from: IN_REFURBISHMENT
        to: ON_TOUR
        trigger: "system (next stop reaches INSTALLING)"
        actor: system
        preconditions:
          - "Exists TourStop with status == INSTALLING"
        side_effects:
          - "All crates in IN_REFURBISHMENT return to IN_TRANSIT bound for the INSTALLING stop"

      - from: BOOKING
        to: RETIRED
        trigger: "POST /tours/{id}/transition (action=RETIRE)"
        actor: TourManager
        preconditions:
          - "No TourStop in {CONTRACTED, INSTALLING, OPEN, TEARDOWN}"
        side_effects:
          - "All TENTATIVE TourStops -> CANCELLED"
          - "All non-terminal ParticipationContracts -> FINALIZED with final_fee_cents = provisional_fee_cents (deemed final on retirement)"
          - "All MarketingKits in {PLANNED, PRODUCED} -> RETIRED"
          - "All InsuranceCertificates in {ISSUED, ACTIVE} -> VOID"

      - from: ON_TOUR
        to: RETIRED
        trigger: "POST /tours/{id}/transition (action=RETIRE)"
        actor: TourManager
        preconditions:
          - "No TourStop in {INSTALLING, OPEN, TEARDOWN}"
          - "Every DamageClaim is terminal (PAID or DENIED)"
        side_effects:
          - "Same retirement cascade as BOOKING -> RETIRED"

      - from: IN_REFURBISHMENT
        to: RETIRED
        trigger: "POST /tours/{id}/transition (action=RETIRE)"
        actor: TourManager
        preconditions:
          - "Every DamageClaim is terminal (PAID or DENIED)"
        side_effects:
          - "Same retirement cascade as BOOKING -> RETIRED"
          - "All crates in IN_REFURBISHMENT -> AT_ORIGIN"

  - entity: TourStop
    initial_state: TENTATIVE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: CONTRACTED
        trigger: "system (linked ParticipationContract reaches SIGNED)"
        actor: system
        preconditions:
          - "ParticipationContract for this stop is SIGNED"
        side_effects: []

      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=CANCEL)"
        actor: TourManager
        preconditions:
          - "Stop is TENTATIVE"
        side_effects:
          - "Linked ParticipationContract (if any, non-FINALIZED) -> FINALIZED with final_fee_cents = 0 (no fee due on TENTATIVE cancel)"

      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=CANCEL)"
        actor: TourManager
        preconditions:
          - "Stop is CONTRACTED"
          - "No Shipment to this destination is in {DISPATCHED, IN_TRANSIT, RECEIVED, DAMAGE_HOLD}"
        side_effects:
          - "Linked ParticipationContract -> FINALIZED with final_fee_cents = provisional_fee_cents * CANCEL_PENALTY_PCT (cancellation penalty per participation_fee FINAL-CANCEL variant)"
          - "Linked MarketingKit (if any) -> RETIRED"
          - "Linked InsuranceCertificate -> VOID"

      - from: CONTRACTED
        to: INSTALLING
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=BEGIN_INSTALL)"
        actor: TourManager
        preconditions:
          - "Tour status in {BOOKING, ON_TOUR, IN_REFURBISHMENT}"
          - "An InsuranceCertificate with tour_stop_id == stop.id exists in {ISSUED, ACTIVE}"
          - "The inbound Shipment (destination_stop_id == stop.id) is in {RECEIVED, CLEARED}"
          - "If stop.supervision_required: a supervisor has been assigned via POST .../assign-supervisor"
        side_effects:
          - "Crates on the inbound shipment move IN_TRANSIT -> AT_VENUE with current_stop_id = stop.id"
          - "If tour.status == BOOKING: tour.status -> ON_TOUR"
          - "If tour.status == IN_REFURBISHMENT: tour.status -> ON_TOUR"

      - from: INSTALLING
        to: OPEN
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=OPEN_TO_PUBLIC)"
        actor: TourManager
        preconditions:
          - "Every crate on the inbound shipment has a ConditionReport with phase == UNPACK and status == ACCEPTED"
        side_effects: []

      - from: OPEN
        to: TEARDOWN
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=BEGIN_TEARDOWN)"
        actor: TourManager
        preconditions: []
        side_effects: []

      - from: TEARDOWN
        to: CLOSED
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=CLOSE_STOP)"
        actor: TourManager
        preconditions:
          - "Every crate on the stop has a ConditionReport with phase == PACK and status == ACCEPTED for the outbound shipment (or for the stop's inventory if no outbound shipment yet)"
          - "actual_attendance has been reported (PATCH actual_attendance)"
        side_effects:
          - "ParticipationContract finalized: provisional variant superseded by FINAL using actual_attendance; tour.total_billed_cents recomputed"
          - "Stop closure may trigger tour IN_REFURBISHMENT per tour transition rules"

      - from: TEARDOWN
        to: OPEN
        trigger: "POST /tours/{id}/stops/{stopId}/transition (action=REOPEN)"
        actor: TourManager
        preconditions:
          - "ParticipationContract is not yet FINALIZED"
        side_effects: []
        note: "Branching revert — teardown may be aborted and the exhibit reopened to the public before the contract is finalized."

  - entity: ParticipationContract
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /tours/{id}/stops/{stopId}/contract/transition (action=SEND)"
        actor: TourManager
        preconditions: []
        side_effects: []

      - from: SENT
        to: DRAFT
        trigger: "POST /tours/{id}/stops/{stopId}/contract/transition (action=REVOKE)"
        actor: TourManager
        preconditions: []
        side_effects: []
        note: "Amendment loop SENT -> DRAFT lets the manager revise terms before signature."

      - from: SENT
        to: SIGNED
        trigger: "POST /tours/{id}/stops/{stopId}/contract/transition (action=SIGN)"
        actor: VenueRegistrar
        preconditions:
          - "sponsorship_credit_cents <= venue.local_sponsorship_cap_cents"
        side_effects:
          - "TourStop TENTATIVE -> CONTRACTED"
          - "Tour.total_waived_cents += min(sponsorship_credit_cents, provisional_fee_cents)"

      - from: SIGNED
        to: FINALIZED
        trigger: "system (TourStop CLOSED, stop CANCELLED from CONTRACTED, or tour RETIRE)"
        actor: system
        preconditions: []
        side_effects:
          - "final_fee_cents computed per participation_fee FINAL variant"
          - "tour.total_billed_cents recomputed"

      - from: DRAFT
        to: FINALIZED
        trigger: "system (stop CANCELLED from TENTATIVE, or tour RETIRE with contract still DRAFT)"
        actor: system
        preconditions: []
        side_effects:
          - "final_fee_cents = 0 for TENTATIVE cancel; provisional_fee_cents deemed final on tour RETIRE"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [CLEARED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/transition (action=DISPATCH)"
        actor: Shipper
        preconditions:
          - "origin stop is TEARDOWN or CLOSED (or origin_stop_id is null for first leg)"
          - "An InsuranceCertificate with status in {ISSUED, ACTIVE} covers the destination stop with coverage_cents >= tour.declared_value_cents, effective_from <= depart_at and effective_to > arrive_at"
        side_effects:
          - "Crates listed on the shipment move AT_VENUE (or AT_ORIGIN) -> IN_TRANSIT with current_stop_id = destination_stop_id"

      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "POST /tours/{id}/shipments/{shipmentId}/transition (action=DEPART)"
        actor: Shipper
        preconditions: []
        side_effects: []

      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/transition (action=RECEIVE)"
        actor: Registrar
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: DAMAGE_HOLD
        trigger: "system (any UNPACK ConditionReport on this shipment reaches SUBMITTED with composite_score < DAMAGE_THRESHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Stop INSTALLING blocked while shipment in DAMAGE_HOLD"

      - from: DAMAGE_HOLD
        to: RECEIVED
        trigger: "system (all DamageClaims on this shipment reach PAID or DENIED)"
        actor: system
        preconditions:
          - "No DamageClaim on this shipment in {FILED, UNDER_REVIEW, APPROVED}"
        side_effects: []
        note: "Cyclic loop RECEIVED -> DAMAGE_HOLD -> RECEIVED; a shipment may cycle more than once."

      - from: RECEIVED
        to: CLEARED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/transition (action=CLEAR)"
        actor: Registrar
        preconditions:
          - "No DamageClaim on this shipment in {FILED, UNDER_REVIEW, APPROVED}"
          - "Every crate on the shipment has an ACCEPTED UNPACK ConditionReport"
        side_effects: []

  - entity: ConditionReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/reports/{reportId}/transition (action=SUBMIT)"
        actor: Registrar
        preconditions:
          - "phase == UNPACK requires shipment status in {RECEIVED, DAMAGE_HOLD}"
          - "phase == PACK requires origin stop status in {TEARDOWN, CLOSED}"
        side_effects:
          - "composite_score computed per condition_score calculation"
          - "If phase == UNPACK and composite_score < DAMAGE_THRESHOLD: shipment RECEIVED -> DAMAGE_HOLD"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/reports/{reportId}/transition (action=ACCEPT)"
        actor: TourManager
        preconditions: []
        side_effects:
          - "crate.condition_score := composite_score"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/reports/{reportId}/transition (action=DISPUTE)"
        actor: Shipper
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: ACCEPTED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/reports/{reportId}/transition (action=ACCEPT)"
        actor: TourManager
        preconditions: []
        side_effects:
          - "crate.condition_score := composite_score"
        note: "Branching DISPUTED -> ACCEPTED resolves disputes by manager override."

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /tours/{id}/shipments/{shipmentId}/claims/{claimId}/transition (action=REVIEW)"
        actor: TourManager
        preconditions:
          - "Referenced ConditionReport status is SUBMITTED or ACCEPTED"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/claims/{claimId}/transition (action=APPROVE)"
        actor: Insurer
        preconditions:
          - "claimed_amount_cents <= coverage_cents of an {ISSUED, ACTIVE} certificate covering the destination stop"
        side_effects:
          - "assessed_payout_cents computed per damage_claim_payout"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /tours/{id}/shipments/{shipmentId}/claims/{claimId}/transition (action=DENY)"
        actor: Insurer
        preconditions: []
        side_effects:
          - "assessed_payout_cents := 0"
          - "If no remaining open claims on shipment: shipment DAMAGE_HOLD -> RECEIVED"

      - from: APPROVED
        to: PAID
        trigger: "POST /tours/{id}/shipments/{shipmentId}/claims/{claimId}/transition (action=PAY)"
        actor: Insurer
        preconditions: []
        side_effects:
          - "If no remaining open claims on shipment: shipment DAMAGE_HOLD -> RECEIVED"

  - entity: MarketingKit
    initial_state: PLANNED
    terminal_states: [RETIRED]
    transitions:
      - from: PLANNED
        to: PRODUCED
        trigger: "POST /tours/{id}/stops/{stopId}/marketing-kit/transition (action=PRODUCE)"
        actor: TourManager
        preconditions:
          - "Stop status in {TENTATIVE, CONTRACTED}"
        side_effects:
          - "production_cost_cents computed per marketing_kit_cost"

      - from: PRODUCED
        to: DELIVERED
        trigger: "POST /tours/{id}/stops/{stopId}/marketing-kit/transition (action=DELIVER)"
        actor: TourManager
        preconditions:
          - "Stop status in {CONTRACTED, INSTALLING, OPEN}"
          - "press_release_sent == true (set via POST .../marketing-kit/send-press-release)"
        side_effects: []

      - from: PLANNED
        to: RETIRED
        trigger: "system (stop CANCELLED or tour RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PRODUCED
        to: RETIRED
        trigger: "system (stop CANCELLED or tour RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InsuranceCertificate
    initial_state: ISSUED
    terminal_states: [EXPIRED, VOID]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system (logical clock reaches effective_from)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock reaches effective_to)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: VOID
        trigger: "system (stop CANCELLED or tour RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: VOID
        trigger: "system (stop CANCELLED or tour RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: stop-book-stale-tour
    parent_entity: Tour
    write_endpoint: "POST /tours/{id}/stops"
    occ_field: "expected_tour_version"
    description: |
      Creating a TourStop against a Tour whose version has advanced since the
      client last observed it is rejected. Booking a stop legitimately appends
      to the tour's route and bumps tour.version; a second writer carrying a
      stale expected_tour_version is rejected so route sequencing decisions are
      never taken against a superseded route snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: participation_fee
    trigger: "Contract SEND (provisional), TourStop CLOSE_STOP / CANCEL (final), tour RETIRE (deemed final)"
    algorithm: tiered_pricing
    formula: |
      # Attendance tier uplift applied to base fee
      if attendance <= TIER1_MAX:
          uplift = 0
      elif attendance <= TIER2_MAX:
          uplift = base_fee_cents * TIER2_PCT
      else:
          uplift = base_fee_cents * TIER3_PCT
      fee_before_credit = base_fee_cents + uplift
      credit = min(sponsorship_credit_cents, venue.local_sponsorship_cap_cents, fee_before_credit)
      fee = fee_before_credit - credit
      # Evaluation order is pinned: uplift from tier, then credit cap, then subtract.
    input_set: "ParticipationContract.base_fee_cents + sponsorship_credit_cents, stop attendance (variant-dependent), venue.local_sponsorship_cap_cents"
    constants:
      TIER1_MAX: 10000
      TIER2_MAX: 50000
      TIER2_PCT: 0.10
      TIER3_PCT: 0.25
      CANCEL_PENALTY_PCT: 0.30
    precision: "integer cents; uplift computed as round_half_up(base_fee_cents * PCT)"
    variants:
      - name: PROVISIONAL
        when: "Contract SEND: provisional_fee_cents uses stop.projected_attendance"
        difference: "attendance = projected_attendance"
      - name: FINAL
        when: "Stop CLOSE_STOP: final_fee_cents uses stop.actual_attendance"
        difference: "attendance = actual_attendance"
      - name: FINAL_CANCEL
        when: "Stop CANCELLED from CONTRACTED"
        difference: "final_fee_cents = round_half_up(provisional_fee_cents * CANCEL_PENALTY_PCT); sponsorship credit already applied inside provisional"

  - name: condition_score
    trigger: "ConditionReport SUBMIT"
    algorithm: weighted_scoring
    formula: |
      # Seal breach forces a hard cap regardless of component scores
      if seal_intact == false:
          composite = min(SEAL_BREACH_CAP, round_half_up(surface_score * W_SURFACE + structural_score * W_STRUCTURAL))
      else:
          composite = round_half_up(surface_score * W_SURFACE + structural_score * W_STRUCTURAL)
    input_set: "surface_score, structural_score, seal_intact from the report"
    constants:
      W_SURFACE: 0.4
      W_STRUCTURAL: 0.6
      SEAL_BREACH_CAP: 40
      DAMAGE_THRESHOLD: 70
    precision: "integer 0-100, round_half_up"
    variants:
      - name: PACK_BASELINE
        when: "phase == PACK"
        difference: "Identical formula, but result is compared against the same crate's prior UNPACK score at claim time to establish transit delta"
      - name: UNPACK_OBSERVED
        when: "phase == UNPACK"
        difference: "Identical formula; scores below DAMAGE_THRESHOLD push shipment to DAMAGE_HOLD"

  - name: damage_claim_payout
    trigger: "DamageClaim APPROVE"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: round each line item first, then sum, then cap.
      # per_line = round_half_up(line.amount_cents * LINE_COVERAGE_PCT)
      # subtotal = sum(per_line over all line_items)
      # assessed_payout_cents = min(subtotal, round_half_up(claimed_amount_cents * CLAIM_CAP_PCT))
      per_line = round_half_up(amount_cents * LINE_COVERAGE_PCT)
      subtotal = sum(per_line)
      assessed_payout_cents = min(subtotal, round_half_up(claimed_amount_cents * CLAIM_CAP_PCT))
    input_set: "line_items[].amount_cents, claimed_amount_cents"
    constants:
      LINE_COVERAGE_PCT: 0.80
      CLAIM_CAP_PCT: 0.90
    precision: "integer cents, round_half_up per line BEFORE summing"

  - name: marketing_kit_cost
    trigger: "MarketingKit PRODUCE"
    algorithm: threshold
    formula: |
      # base + per-language + per-logo-slot; language bulk discount applies
      # only when language_count strictly exceeds BULK_LANG_MIN
      lang_cost = language_count * PER_LANG_CENTS
      if language_count > BULK_LANG_MIN:
          lang_cost = round_half_up(lang_cost * (1 - BULK_DISCOUNT_PCT))
      production_cost_cents = BASE_CENTS + lang_cost + sponsor_logo_slots * PER_LOGO_CENTS
    input_set: "language_count, sponsor_logo_slots"
    constants:
      BASE_CENTS: 150000
      PER_LANG_CENTS: 45000
      BULK_LANG_MIN: 3
      BULK_DISCOUNT_PCT: 0.15
      PER_LOGO_CENTS: 20000
    precision: "integer cents, round_half_up on discount application"

  - name: route_sequence
    trigger: "TourStop creation"
    algorithm: chronological
    formula: |
      # Stops are sequenced by install_start ascending; ties broken by created_at ascending.
      # seq = 1 + count(existing stops of this tour with
      #   (install_start < new.install_start) OR
      #   (install_start == new.install_start AND created_at < new.created_at))
      seq = 1 + count(earlier stops by (install_start, created_at))
    input_set: "all TourStops of the tour regardless of status"
    precision: "integer >= 1"
    note: "No random/id tie-breaks — created_at ASC is the only fallback."

  - name: insurance_coverage_check
    trigger: "Shipment DISPATCH, TourStop BEGIN_INSTALL"
    algorithm: threshold
    formula: |
      # A certificate covers a shipment leg iff ALL of:
      #   cert.status in {ISSUED, ACTIVE}
      #   cert.coverage_cents >= tour.declared_value_cents
      #   cert.effective_from <= shipment.depart_at
      #   cert.effective_to > shipment.arrive_at     # end-exclusive window
      covered = exists certificate satisfying the four clauses above
    input_set: "InsuranceCertificates with tour_stop_id == destination stop"
    precision: "boolean"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids exist (tour, stop, shipment, report, claim left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "expected_tour_version matches current tour.version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tours/{id}/stops"

  - priority: 5
    category: state
    check: "Target resource in a from-state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Certificate coverage: an InsuranceCertificate covering the destination stop exists with coverage_cents >= tour.declared_value_cents and window covering [depart_at, arrive_at)"
    error_id: ERR_NO_INSURANCE_COVERAGE
    http_status: 409
    applies_to: "shipment DISPATCH, stop BEGIN_INSTALL"

  - priority: 7
    category: business_safety
    check: "Supervision: stop.supervision_required implies a supervisor is assigned before BEGIN_INSTALL"
    error_id: ERR_SUPERVISOR_REQUIRED
    http_status: 409
    applies_to: "stop BEGIN_INSTALL"

  - priority: 8
    category: business_temporal
    check: "Venue double-booking: no other TourStop at the same venue with overlapping [install_start, teardown_end) half-open window, among stops in {TENTATIVE, CONTRACTED, INSTALLING, OPEN, TEARDOWN}"
    error_id: ERR_VENUE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tours/{id}/stops"

  - priority: 9
    category: business_temporal
    check: "Refurbishment gap: consecutive stops of the same tour must satisfy next.install_start - prev.teardown_end >= tour.refurbishment_gap_days"
    error_id: ERR_REFURBISHMENT_GAP_VIOLATED
    http_status: 409
    applies_to: "POST /tours/{id}/stops"

  - priority: 10
    category: business_temporal
    check: "Stop window well-formed: install_start < open_date < close_date < teardown_end"
    error_id: ERR_WINDOW_MALFORMED
    http_status: 422
    applies_to: "POST /tours/{id}/stops"

  - priority: 11
    category: business_constraint
    check: "Sponsorship credit within venue cap: sponsorship_credit_cents <= venue.local_sponsorship_cap_cents at SIGN time"
    error_id: ERR_SPONSORSHIP_OVER_CAP
    http_status: 409
    applies_to: "contract SIGN"

  - priority: 12
    category: business_constraint
    check: "One non-terminal ParticipationContract per stop"
    error_id: ERR_DUPLICATE_CONTRACT
    http_status: 409
    applies_to: "POST /tours/{id}/stops/{stopId}/contract"

  - priority: 13
    category: business_referential
    check: "Shipment destination stop exists on the same tour and origin/destination are consecutive by route seq"
    error_id: ERR_ROUTE_NOT_CONSECUTIVE
    http_status: 409
    applies_to: "POST /tours/{id}/shipments"

  - priority: 14
    category: business_referential
    check: "ConditionReport.crate_id belongs to the shipment's crate manifest"
    error_id: ERR_CRATE_NOT_ON_SHIPMENT
    http_status: 409
    applies_to: "POST /tours/{id}/shipments/{shipmentId}/reports"

  - priority: 15
    category: business_fiscal
    check: "DamageClaim line_items non-empty and claimed_amount_cents == sum(line_items[].amount_cents)"
    error_id: ERR_CLAIM_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /tours/{id}/shipments/{shipmentId}/claims"

  - priority: 16
    category: business_fiscal
    check: "claimed_amount_cents <= coverage_cents of an {ISSUED, ACTIVE} certificate covering the destination stop at claim APPROVE"
    error_id: ERR_CLAIM_EXCEEDS_COVERAGE
    http_status: 409
    applies_to: "claim APPROVE"

  - priority: 17
    category: business_fiscal
    check: "Stop CLOSE_STOP requires actual_attendance reported"
    error_id: ERR_ATTENDANCE_MISSING
    http_status: 409
    applies_to: "stop CLOSE_STOP"

  - priority: 18
    category: business_constraint
    check: "Tour retire blocked while any stop in {CONTRACTED, INSTALLING, OPEN, TEARDOWN} or any DamageClaim open"
    error_id: ERR_TOUR_NOT_RETIREABLE
    http_status: 409
    applies_to: "tour RETIRE"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never wall-clock)."
    roles: [TourManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["ISSUED certificates with effective_from <= now become ACTIVE", "ACTIVE certificates with effective_to <= now become EXPIRED"]

  # --- Tour ---
  - method: POST
    path: "/tours"
    description: "Create a tour"
    roles: [TourManager]
    code: 201
    input: [title, exhibit_code, crate_count, declared_value_cents, refurbishment_gap_days]
    output: Tour
    side_effects: ["status=DRAFT", "totals initialized to 0"]

  - method: GET
    path: "/tours/{id}"
    description: "Get a tour"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: GET
    path: "/tours"
    description: "List tours (paginated)"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Tour[]
    side_effects: []

  - method: POST
    path: "/tours/{id}/transition"
    description: "Tour lifecycle transition (OPEN_BOOKING, RETIRE)"
    roles: [TourManager]
    code: 200
    input: [action]
    output: Tour
    side_effects: ["per Tour state machine; retirement cascade"]

  # --- Venue ---
  - method: POST
    path: "/venues"
    description: "Register a venue"
    roles: [TourManager]
    code: 201
    input: [name, city, climate_controlled, max_gallery_sqm, local_sponsorship_cap_cents]
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues/{id}"
    description: "Get a venue"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- Crate ---
  - method: POST
    path: "/tours/{id}/crates"
    description: "Register a crate in the tour inventory"
    roles: [TourManager]
    code: 201
    input: [crate_label, contents_value_cents]
    output: Crate
    side_effects: ["location_status=AT_ORIGIN", "condition_score=null"]

  - method: GET
    path: "/tours/{id}/crates"
    description: "List crates of a tour"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["location_status?", "limit?", "offset?"]
    output: Crate[]
    side_effects: []

  - method: GET
    path: "/tours/{id}/crates/{crateId}"
    description: "Get a crate"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: Crate
    side_effects: []

  # --- TourStop ---
  - method: POST
    path: "/tours/{id}/stops"
    description: "Book a stop on the tour (OCC-guarded)"
    roles: [TourManager]
    code: 201
    input: [venue_id, install_start, open_date, close_date, teardown_end, projected_attendance, expected_tour_version]
    output: TourStop
    side_effects: ["status=TENTATIVE", "seq assigned per route_sequence", "supervision_required computed", "increments Tour.version by 1"]

  - method: GET
    path: "/tours/{id}/stops"
    description: "List stops of a tour"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: TourStop[]
    side_effects: []

  - method: GET
    path: "/tours/{id}/stops/{stopId}"
    description: "Get a stop"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: TourStop
    side_effects: []

  - method: PATCH
    path: "/tours/{id}/stops/{stopId}"
    description: "Update mutable stop fields (actual_attendance, projected_attendance while TENTATIVE)"
    roles: [TourManager, VenueRegistrar]
    code: 200
    input: ["actual_attendance?", "projected_attendance?"]
    output: TourStop
    side_effects: ["If provisional fee already computed and stop is TENTATIVE: provisional_fee_cents recomputed"]

  - method: POST
    path: "/tours/{id}/stops/{stopId}/transition"
    description: "Stop lifecycle transition (CANCEL, BEGIN_INSTALL, OPEN_TO_PUBLIC, BEGIN_TEARDOWN, REOPEN, CLOSE_STOP)"
    roles: [TourManager]
    code: 200
    input: [action]
    output: TourStop
    side_effects: ["per TourStop state machine; cascades to contract, crates, tour posture"]

  - method: POST
    path: "/tours/{id}/stops/{stopId}/assign-supervisor"
    description: "Assign an on-site installation supervisor (registrar user id)"
    roles: [TourManager]
    code: 201
    input: [supervisor_user_id]
    output: { supervisor_user_id: string, tour_stop_id: string }
    side_effects: ["Supervisor recorded on stop; satisfies ERR_SUPERVISOR_REQUIRED gate"]

  # --- ParticipationContract ---
  - method: POST
    path: "/tours/{id}/stops/{stopId}/contract"
    description: "Create the participation contract for a stop"
    roles: [TourManager]
    code: 201
    input: [base_fee_cents, sponsorship_credit_cents]
    output: ParticipationContract
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tours/{id}/stops/{stopId}/contract"
    description: "Get the contract(s) for a stop"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: ParticipationContract[]
    side_effects: []

  - method: POST
    path: "/tours/{id}/stops/{stopId}/contract/transition"
    description: "Contract transition (SEND, REVOKE, SIGN)"
    roles: [TourManager, VenueRegistrar]
    code: 200
    input: [action]
    output: ParticipationContract
    side_effects: ["SEND: provisional_fee_cents computed", "SIGN: stop TENTATIVE -> CONTRACTED, tour.total_waived_cents updated"]

  # --- MarketingKit ---
  - method: POST
    path: "/tours/{id}/stops/{stopId}/marketing-kit"
    description: "Create the marketing kit plan for a stop"
    roles: [TourManager]
    code: 201
    input: [language_count, sponsor_logo_slots]
    output: MarketingKit
    side_effects: ["status=PLANNED"]

  - method: GET
    path: "/tours/{id}/stops/{stopId}/marketing-kit"
    description: "Get marketing kit(s) for a stop"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: MarketingKit[]
    side_effects: []

  - method: POST
    path: "/tours/{id}/stops/{stopId}/marketing-kit/send-press-release"
    description: "Mark the press release issued to the venue"
    roles: [TourManager]
    code: 200
    input: []
    output: MarketingKit
    side_effects: ["press_release_sent=true"]

  - method: POST
    path: "/tours/{id}/stops/{stopId}/marketing-kit/transition"
    description: "Marketing kit transition (PRODUCE, DELIVER)"
    roles: [TourManager]
    code: 200
    input: [action]
    output: MarketingKit
    side_effects: ["PRODUCE: production_cost_cents computed per marketing_kit_cost"]

  # --- InsuranceCertificate ---
  - method: POST
    path: "/tours/{id}/certificates"
    description: "Issue an insurance certificate covering a stop"
    roles: [Insurer]
    code: 201
    input: [tour_stop_id, insurer_name, coverage_cents, effective_from, effective_to]
    output: InsuranceCertificate
    side_effects: ["status=ISSUED"]

  - method: GET
    path: "/tours/{id}/certificates"
    description: "List certificates of a tour (filterable by tour_stop_id)"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["tour_stop_id?", "status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: GET
    path: "/tours/{id}/certificates/{certId}"
    description: "Get a certificate"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/tours/{id}/shipments"
    description: "Plan a shipment leg between consecutive stops"
    roles: [Shipper, TourManager]
    code: 201
    input: [origin_stop_id, destination_stop_id, depart_at, arrive_at, carrier_name, crate_ids]
    output: Shipment
    side_effects: ["status=PLANNED", "crate manifest recorded"]

  - method: GET
    path: "/tours/{id}/shipments"
    description: "List shipments of a tour"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["destination_stop_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/tours/{id}/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/tours/{id}/shipments/{shipmentId}/transition"
    description: "Shipment transition (DISPATCH, DEPART, RECEIVE, CLEAR)"
    roles: [Shipper, Registrar]
    code: 200
    input: [action]
    output: Shipment
    side_effects: ["DISPATCH: crates -> IN_TRANSIT; RECEIVE/CLEAR per state machine"]

  # --- ConditionReport ---
  - method: POST
    path: "/tours/{id}/shipments/{shipmentId}/reports"
    description: "File a condition report on a crate in the shipment manifest"
    roles: [Registrar]
    code: 201
    input: [crate_id, inspector_name, phase, surface_score, structural_score, seal_intact]
    output: ConditionReport
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tours/{id}/shipments/{shipmentId}/reports"
    description: "List condition reports of a shipment"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["crate_id?", "phase?", "status?", "limit?", "offset?"]
    output: ConditionReport[]
    side_effects: []

  - method: POST
    path: "/tours/{id}/shipments/{shipmentId}/reports/{reportId}/transition"
    description: "Report transition (SUBMIT, ACCEPT, DISPUTE)"
    roles: [Registrar, Shipper, TourManager]
    code: 200
    input: [action]
    output: ConditionReport
    side_effects: ["SUBMIT: composite_score computed, DAMAGE_HOLD trigger", "ACCEPT: crate.condition_score updated"]

  # --- DamageClaim ---
  - method: POST
    path: "/tours/{id}/shipments/{shipmentId}/claims"
    description: "File a damage claim against a shipment"
    roles: [Registrar, TourManager]
    code: 201
    input: [condition_report_id, claimed_amount_cents, line_items]
    output: DamageClaim
    side_effects: ["status=FILED"]

  - method: GET
    path: "/tours/{id}/shipments/{shipmentId}/claims"
    description: "List damage claims of a shipment"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []

  - method: POST
    path: "/tours/{id}/shipments/{shipmentId}/claims/{claimId}/transition"
    description: "Claim transition (REVIEW, APPROVE, DENY, PAY)"
    roles: [TourManager, Insurer]
    code: 200
    input: [action]
    output: DamageClaim
    side_effects: ["APPROVE: assessed_payout_cents computed", "PAY/DENY: may release shipment DAMAGE_HOLD"]

  # --- Computed reads ---
  - method: GET
    path: "/tours/{id}/financial-summary"
    description: "Derived tour ledger totals"
    roles: [TourManager, VenueRegistrar, Registrar, Shipper, Insurer]
    code: 200
    input: []
    output: { total_billed_cents: integer, total_collected_cents: integer, total_waived_cents: integer, outstanding_cents: integer }
    side_effects: []

  # --- Flat read aliases (FK reverse-reachability) ---
  - method: GET
    path: "/tours/stops/{stopId}"
