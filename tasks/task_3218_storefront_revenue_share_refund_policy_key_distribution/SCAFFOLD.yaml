# =============================================================================
# Task 3218: Storefront Revenue Share, Refund Policy & Key Distribution
# =============================================================================

scenario: |
  Storefront Revenue Share, Refund Policy & Key Distribution (Steam): developer onboarding
  with title registration, store page review and release date scheduling, revenue share
  tiers that improve as a title's lifetime revenue crosses thresholds, refund policy with
  playtime and purchase-age limits and abuse detection across accounts, product key
  generation for developers to distribute through third-party retailers without platform
  revenue share, regional pricing recommendations with currency conversion and gray-market
  resale controls, early access rules requiring disclosure and update expectations,
  user review system with review bombing detection and off-topic period marking,
  community content, workshop items and creator revenue sharing

domain_name: storefront-revenue-share-refund-key
api_prefix: /storefront

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: beyond_expert
  entity_count: 13
  state_machine_count: 10
  calculation_count: 9
  endpoint_count: 75
  error_code_count: 27
  role_count: 6

# =============================================================================
# §1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: DeveloperAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal developer studio name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email; unique per developer" }
      - { name: onboarding_fee_paid, type: boolean, source: system, description: "True once onboarding fee is paid", default: false }
      - { name: bank_details_submitted, type: boolean, source: system, description: "True once payout bank details are on file", default: false }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | TERMINATED" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: developer_account_id, type: string, source: input, description: "FK -> DeveloperAccount.id; owning developer" }
      - { name: title_name, type: string, source: input, description: "Display name of the title; unique per developer" }
      - { name: base_price_usd_cents, type: integer, source: input, description: "USD list price in cents; must be > 0" }
      - { name: early_access, type: boolean, source: input, description: "True if title ships as early access" }
      - { name: early_access_disclosure_text, type: string, source: input, description: "Early-access disclosure + update-expectation statement; required non-null before an early-access title may be scheduled or released", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | RELEASE_SCHEDULED | RELEASED | DELISTED" }
      - { name: review_notes, type: string, source: system, description: "Reviewer's rejection reason when REJECTED back to DRAFT", default: null }
      - { name: scheduled_release_at, type: datetime, source: system, description: "Scheduled release instant", default: null }
      - { name: released_at, type: datetime, source: system, description: "Actual release instant", default: null }
      - { name: current_tier, type: integer, source: computed, description: "Active revenue share tier (1=highest cut); evaluated from lifetime recognized revenue" }
      - { name: lifetime_recognized_revenue_usd_cents, type: integer, source: computed, description: "Cumulative revenue that counts toward tier evaluation (credited sales minus compensation; partial-refund-retained portions count)" }
      - { name: lifetime_refund_events, type: integer, source: computed, description: "Cumulative count of completed refund events" }
      - { name: refund_abuse_flag, type: boolean, source: computed, description: "True when lifetime_refund_events > 0 and lifetime_refund_events > 0.30 * lifetime completed sales for this title" }
      - { name: review_score_bps, type: integer, source: computed, description: "Weighted review score in basis points (0..10000); null until first scored review" }
      - { name: recent_review_summary, type: enum, source: computed, description: "MOSTLY_POSITIVE | MIXED | MOSTLY_NEGATIVE from scored non-off-topic reviews in the trailing 30-day window; null when window empty" }
      - { name: review_bomb_flag, type: boolean, source: computed, description: "True while any active ReviewBombWindow covers now" }

  - name: StorePageReview
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title under review" }
      - { name: submission_seq, type: integer, source: system, description: "Per-title monotonically increasing submission sequence starting at 1" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission instant" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED" }

  - name: RegionPriceOverride
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; priced title" }
      - { name: currency, type: enum, source: input, description: "EUR | GBP | JPY | BRL" }
      - { name: price_cents, type: integer, source: input, description: "Override price in the currency's minor units; > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }
      - { name: deviation_bps, type: integer, source: computed, description: "Signed deviation of override vs recommended price in basis points: round((override - recommended) * 10000 / recommended)" }

  - name: ActivationKeyBatch
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title keys are minted for" }
      - { name: requested_quantity, type: integer, source: input, description: "Number of keys requested (1..10000)" }
      - { name: free_keys_in_batch, type: integer, source: input, description: "How many of the requested keys are free-of-charge (0..requested_quantity)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED" }
      - { name: free_key_allowance_at_request, type: integer, source: system, description: "Title free-key allowance snapshot at request time = max(5000, lifetime completed sale count)" }
      - { name: allocated_keys, type: integer, source: computed, description: "Keys minted on approval (== requested_quantity)" }

  - name: ActivationKey
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> ActivationKeyBatch.id; owning batch" }
      - { name: key_code, type: string, source: system, description: "Unique key string minted at approval" }
      - { name: is_free, type: boolean, source: system, description: "True if within the batch's free allocation" }
      - { name: status, type: enum, source: system, description: "UNUSED | REDEEMED | REVOKED" }
      - { name: redeemed_by_account_id, type: string, source: system, description: "FK -> UserAccount.id of redeemer when REDEEMED", default: null }
      - { name: redeemed_at, type: datetime, source: system, description: "Redemption instant", default: null }

  - name: UserAccount
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Account email; unique" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED | BANNED" }
      - { name: refund_abuse_score, type: integer, source: computed, description: "Cross-account refund abuse points (rolling 60 days): +1 per completed refund, +3 per refund where playtime_minutes >= PLAYTIME_LIMIT, -1 per completed purchase, floor 0" }
      - { name: refund_restricted, type: boolean, source: system, description: "True while account may not request refunds (score > 3 or admin-set)" }

  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - { name: user_account_id, type: string, source: input, description: "FK -> UserAccount.id; buyer" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; purchased title" }
      - { name: currency, type: enum, source: input, description: "USD | EUR | GBP | JPY | BRL" }
      - { name: gross_price_cents, type: integer, source: computed, description: "Charged price in purchase currency minor units, from pricing resolution at purchase time" }
      - { name: platform_fee_cents, type: integer, source: computed, description: "Platform cut in purchase currency; gross - developer_share" }
      - { name: developer_share_cents, type: integer, source: computed, description: "Developer cut = gross - round_half_up(gross * current tier rate)" }
      - { name: usd_recognized_cents, type: integer, source: computed, description: "USD-recognized snapshot added to the title ledger at completion: gross if currency == USD else round_half_up(gross / FX[currency])" }
      - { name: status, type: enum, source: system, description: "COMPLETED | REFUNDED | PARTIALLY_REFUNDED" }
      - { name: refunded_amount_usd_cents, type: integer, source: computed, description: "USD value of refunded portion, snapshotted per refund using the purchase-time FX (proportional to approved_amount_cents)", default: 0 }
      - { name: playtime_minutes, type: integer, source: computed, description: "Accumulated play minutes recorded via heartbeat", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunded amount in purchase currency", default: 0 }
      - { name: purchased_at, type: datetime, source: system, description: "Purchase instant" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: purchase_id, type: string, source: input, description: "FK -> Purchase.id; purchase under refund" }
      - { name: user_account_id, type: string, source: system, description: "FK -> UserAccount.id; denormalized from purchase" }
      - { name: amount_cents, type: integer, source: input, description: "Requested refund in purchase currency minor units; omit/0 treated as full remaining gross" }
      - { name: reason, type: string, source: input, description: "Free-text reason" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED" }
      - { name: decision_reason, type: string, source: system, description: "Reviewer reason on manual denial", default: null }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Amount actually refunded in purchase currency", default: 0 }
      - { name: decided_at, type: datetime, source: system, description: "Decision instant", default: null }

  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; reviewed title" }
      - { name: user_account_id, type: string, source: input, description: "FK -> UserAccount.id; author (must own a completed purchase or a REDEEMED key for the title)" }
      - { name: is_positive, type: boolean, source: input, description: "Recommended (true) or not (false)" }
      - { name: body, type: string, source: input, description: "Review text (1..8000 chars)" }
      - { name: author_playtime_minutes, type: integer, source: computed, description: "Author's playtime snapshot at posting" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | REMOVED" }
      - { name: off_topic, type: boolean, source: system, description: "True when created_at falls inside an active ReviewBombWindow for the title; excluded from score", default: false }

  - name: ReviewBombWindow
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; affected title" }
      - { name: start_at, type: datetime, source: system, description: "Window start (inclusive)" }
      - { name: end_at, type: datetime, source: system, description: "Window end (exclusive); must be > start_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }
      - { name: trigger_review_count, type: integer, source: system, description: "Negative-review count in detection window that triggered creation (>= 10)" }

  - name: WorkshopItem
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; host title" }
      - { name: creator_account_id, type: string, source: input, description: "FK -> UserAccount.id; item creator" }
      - { name: item_name, type: string, source: input, description: "Item display name" }
      - { name: price_cents, type: integer, source: input, description: "USD price in cents; > 0" }
      - { name: creator_share_bps, type: integer, source: input, description: "Creator cut in basis points, 1..5000 (max 50%); platform takes the remainder" }
      - { name: status, type: enum, source: system, description: "PENDING | PUBLISHED | REMOVED" }

  - name: WorkshopSale
    parent: null
    common_fields: true
    fields:
      - { name: workshop_item_id, type: string, source: input, description: "FK -> WorkshopItem.id; item sold" }
      - { name: buyer_account_id, type: string, source: input, description: "FK -> UserAccount.id; buyer" }
      - { name: gross_cents, type: integer, source: system, description: "Charged USD cents (== item price at sale time)" }
      - { name: creator_share_cents, type: integer, source: computed, description: "floor(gross_cents * creator_share_bps / 10000)" }
      - { name: platform_share_cents, type: integer, source: computed, description: "gross_cents - creator_share_cents" }
      - { name: sold_at, type: datetime, source: system, description: "Sale instant" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: DeveloperAccount
    field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /storefront/developer-accounts/{id}/activate"
        actor: PlatformOps
        preconditions:
          - "onboarding_fee_paid == true"
          - "bank_details_submitted == true"
        side_effects:
          - "Increments DeveloperAccount.version"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /storefront/developer-accounts/{id}/suspend"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "All titles of the developer in RELEASED or RELEASE_SCHEDULED transition to DELISTED"
          - "Blocks new purchases and key requests for all developer titles"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /storefront/developer-accounts/{id}/unsuspend"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "Titles delisted by suspension are NOT auto-restored; developer must resubmit for review"
      - from: [PENDING, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /storefront/developer-accounts/{id}/terminate"
        actor: PlatformOps
        preconditions: []
        side_effects:
          - "All non-DELISTED titles transition to DELISTED"
          - "All UNUSED keys in all of the developer's batches transition to REVOKED"

  - entity: Title
    field: status
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /storefront/titles/{id}/submit-review"
        actor: Developer
        preconditions:
          - "Owning DeveloperAccount.status == ACTIVE"
          - "No other StorePageReview for this title in SUBMITTED"
        side_effects:
          - "Creates StorePageReview(status=SUBMITTED, submission_seq = prior count + 1)"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /storefront/store-page-reviews/{id}/approve"
        actor: StoreReviewer
        preconditions:
          - "The referenced StorePageReview.status == SUBMITTED"
        side_effects:
          - "StorePageReview.status -> APPROVED"
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /storefront/store-page-reviews/{id}/reject"
        actor: StoreReviewer
        preconditions:
          - "The referenced StorePageReview.status == SUBMITTED"
        side_effects:
          - "StorePageReview.status -> REJECTED; Title.review_notes set from payload"
      - from: APPROVED
        to: RELEASE_SCHEDULED
        trigger: "POST /storefront/titles/{id}/schedule-release"
        actor: Developer
        preconditions:
          - "release_at must be strictly after now"
          - "If early_access == true: early_access_disclosure_text must be non-null"
        side_effects:
          - "scheduled_release_at set"
      - from: RELEASE_SCHEDULED
        to: APPROVED
        trigger: "POST /storefront/titles/{id}/cancel-release"
        actor: Developer
        preconditions: []
        side_effects:
          - "scheduled_release_at cleared"
      - from: RELEASE_SCHEDULED
        to: RELEASED
        trigger: "system clock reaches scheduled_release_at (checked lazily on any read/action of the title and on POST /storefront/_clock/set_current_utc sweep)"
        actor: system
        preconditions:
          - "current logical time >= scheduled_release_at"
        side_effects:
          - "released_at set to scheduled_release_at"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /storefront/titles/{id}/release-now"
        actor: Developer
        preconditions:
          - "If early_access == true: early_access_disclosure_text must be non-null"
        side_effects:
          - "released_at set to now"
      - from: [APPROVED, RELEASE_SCHEDULED, RELEASED]
        to: DELISTED
        trigger: "POST /storefront/titles/{id}/delist"
        actor: Developer
        preconditions: []
        side_effects:
          - "Blocks new purchases and key requests"
          - "All UNUSED keys of the title transition to REVOKED"
      - from: RELEASED
        to: DELISTED
        trigger: "system cascade: DeveloperAccount suspended or terminated"
        actor: system
        preconditions: []
        side_effects: []

  - entity: StorePageReview
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /storefront/store-page-reviews/{id}/approve"
        actor: StoreReviewer
        preconditions: []
        side_effects: ["Title -> APPROVED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /storefront/store-page-reviews/{id}/reject"
        actor: StoreReviewer
        preconditions: []
        side_effects: ["Title -> DRAFT with review_notes"]

  - entity: RegionPriceOverride
    field: status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /storefront/regional-prices/{id}/withdraw"
        actor: Developer
        preconditions:
          - "Owning Title.status in {DRAFT, PENDING_REVIEW, APPROVED, RELEASE_SCHEDULED, RELEASED}"
        side_effects: []

  - entity: ActivationKeyBatch
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /storefront/key-batches/{id}/approve"
        actor: PlatformOps
        preconditions:
          - "Title.status == RELEASED"
          - "Title.refund_abuse_flag == false (gray-market control)"
          - "free keys granted so far (sum of allocated free keys in APPROVED batches) + free_keys_in_batch <= free_key_allowance_at_request"
          - "Owning DeveloperAccount.status == ACTIVE"
        side_effects:
          - "Mints requested_quantity ActivationKey rows (first free_keys_in_batch marked is_free=true, ordered by created_at)"
          - "allocated_keys set"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /storefront/key-batches/{id}/reject"
        actor: PlatformOps
        preconditions: []
        side_effects: []

  - entity: ActivationKey
    field: status
    initial_state: UNUSED
    terminal_states: [REDEEMED, REVOKED]
    transitions:
      - from: UNUSED
        to: REDEEMED
        trigger: "POST /storefront/keys/redeem"
        actor: User
        preconditions:
          - "Key's Title.status == RELEASED"
          - "Key's owning DeveloperAccount.status == ACTIVE"
          - "Redeeming UserAccount.status == ACTIVE"
          - "Gray-market velocity control: in the trailing 60 minutes, the redeeming account has < 3 successful redemptions AND total successful redemptions across all accounts in the trailing 60 minutes < 50"
        side_effects:
          - "redeemed_by_account_id and redeemed_at set"
          - "Ownership recorded (account may now review the title)"
      - from: UNUSED
        to: REVOKED
        trigger: "system cascade: Title delisted or DeveloperAccount terminated"
        actor: system
        preconditions: []
        side_effects: []

  - entity: UserAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [BANNED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /storefront/user-accounts/{id}/restrict or system (refund_abuse_score > 3 sets refund_restricted and status RESTRICTED)"
        actor: "TrustSafety or system"
        preconditions: []
        side_effects:
          - "refund_restricted = true"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /storefront/user-accounts/{id}/unrestrict"
        actor: TrustSafety
        preconditions: []
        side_effects:
          - "refund_restricted = false; refund_abuse_score recomputed (floor 0)"
      - from: [ACTIVE, RESTRICTED]
        to: BANNED
        trigger: "POST /storefront/user-accounts/{id}/ban"
        actor: TrustSafety
        preconditions: []
        side_effects:
          - "Account's PUBLISHED reviews transition to REMOVED (score recompute follows)"

  - entity: Purchase
    field: status
    initial_state: COMPLETED
    terminal_states: [REFUNDED]
    transitions:
      - from: COMPLETED
        to: REFUNDED
        trigger: "system cascade: RefundRequest APPROVED with approved_amount == gross_price - prior refunded_cents (full remaining)"
        actor: system
        preconditions: []
        side_effects:
          - "Title.lifetime_recognized_revenue_usd_cents -= purchase's USD-recognized gross"
          - "Title.current_tier re-evaluated (tier can degrade)"
          - "Title.lifetime_refund_events += 1; Title.refund_abuse_flag recomputed"
          - "UserAccount.refund_abuse_score += (1 + (3 if playtime_minutes >= 120 else 0)) before RESTRICTED check; if score > 3 -> account RESTRICTED, refund_restricted = true"
      - from: COMPLETED
        to: PARTIALLY_REFUNDED
        trigger: "system cascade: RefundRequest APPROVED with approved_amount < gross_price - prior refunded_cents"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_cents += approved_amount"
          - "Title.lifetime_recognized_revenue_usd_cents -= approved_amount converted to USD (retained portion still counts)"
          - "Title.current_tier re-evaluated"
          - "Title.lifetime_refund_events += 1; refund_abuse_flag recomputed"
          - "UserAccount.refund_abuse_score updated as full-refund rule"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "system cascade: further RefundRequest APPROVED bringing refunded_cents to gross_price"
        actor: system
        preconditions: []
        side_effects: ["Same as COMPLETED -> REFUNDED"]

  - entity: RefundRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "system auto-approval on creation when policy satisfied, or POST /storefront/refund-requests/{id}/approve"
        actor: "system or TrustSafety"
        preconditions:
          - "Purchase.status in {COMPLETED, PARTIALLY_REFUNDED}"
          - "Purchase.playtime_minutes < 120"
          - "now - Purchase.purchased_at <= 14 days"
          - "amount_cents <= Purchase.gross_price_cents - Purchase.refunded_cents"
          - "amount_cents >= 0 (0 treated as full remaining)"
          - "UserAccount.refund_restricted == false"
          - "No other RefundRequest for this Purchase in REQUESTED"
        side_effects:
          - "approved_amount_cents set (0-amount request -> full remaining gross)"
          - "Purchase cascades to PARTIALLY_REFUNDED or REFUNDED (see Purchase transitions)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /storefront/refund-requests/{id}/deny"
        actor: TrustSafety
        preconditions: []
        side_effects:
          - "decision_reason set from payload"

  - entity: Review
    field: status
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: REMOVED
        trigger: "POST /storefront/reviews/{id}/remove or system cascade (author banned)"
        actor: "TrustSafety or system"
        preconditions: []
        side_effects:
          - "Title.review_score_bps recomputed excluding REMOVED and off_topic reviews"
          - "recent_review_summary recomputed over trailing 30 days"

  - entity: ReviewBombWindow
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /storefront/review-bomb-windows/{id}/close"
        actor: TrustSafety
        preconditions: []
        side_effects:
          - "If no other ACTIVE window covers now: Title.review_bomb_flag = false"
          - "Title.review_score_bps and recent_review_summary recomputed (off_topic marks remain on reviews created inside the window)"

  - entity: WorkshopItem
    field: status
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: PUBLISHED
        trigger: "POST /storefront/workshop-items/{id}/publish"
        actor: User
        preconditions:
          - "caller is the creator (X-User-ID == creator_account_id)"
          - "Host Title.status == RELEASED"
        side_effects: []
      - from: [PENDING, PUBLISHED]
        to: REMOVED
        trigger: "POST /storefront/workshop-items/{id}/remove (creator or TrustSafety)"
        actor: "User or TrustSafety"
        preconditions:
          - "If actor is User: caller is the creator"
        side_effects: []

# =============================================================================
# §1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: title-tier-adjust-stale-version
    parent_entity: Title
    write_endpoint: "POST /storefront/titles/{id}/adjustments"
    occ_field: "expected_title_version"
    description: |
      Recording a manual revenue adjustment against a Title whose version has
      advanced since the client last observed it is rejected. This captures the
      case where a refund cascade or another adjustment has already advanced the
      title's lifetime revenue (and possibly its tier), so the caller's view of
      the revenue base is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: review-submit-stale-title
    parent_entity: Title
    write_endpoint: "POST /storefront/reviews"
    occ_field: "expected_title_version"
    description: |
      Posting a Review carrying an expected_title_version that no longer matches
      the Title's current version is rejected. The caller's snapshot of the title
      (including review_bomb_flag / off-topic posture) is stale because an
      intervening mutation — review removal, bomb-window creation, or score
      recompute — advanced the version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: override-set-stale-title
    parent_entity: Title
    write_endpoint: "POST /storefront/regional-prices"
    occ_field: "expected_title_version"
    description: |
      Creating a RegionPriceOverride carrying an expected_title_version that no
      longer matches the Title's current version is rejected; the recommendation
      the deviation cap is checked against derives from title state that may have
      changed since the client read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: revenue_share_tier_evaluation
    trigger: "After every mutation of Title.lifetime_recognized_revenue_usd_cents (purchase completion, refund cascade, manual adjustment)"
    algorithm: threshold
    formula: |
      # Descending scan, first match wins; thresholds compared against
      # lifetime_recognized_revenue_usd_cents AFTER the mutation.
      R = lifetime_recognized_revenue_usd_cents
      if R >= TIER3_THRESHOLD: tier = 3, rate = TIER3_RATE      # 20%
      elif R >= TIER2_THRESHOLD: tier = 2, rate = TIER2_RATE    # 25%
      else: tier = 1, rate = TIER1_RATE                         # 30%
      # Boundary is inclusive: R == TIER2_THRESHOLD exactly -> tier 2.
      # Tier is fully re-derived from R each time (no hysteresis): a refund
      # that drags R back below a threshold degrades the tier.
    input_set: "Single title's lifetime_recognized_revenue_usd_cents"
    constants:
      TIER1_RATE: 0.30
      TIER2_RATE: 0.25
      TIER3_RATE: 0.20
      TIER2_THRESHOLD: 1000000000   # $10,000,000 in cents
      TIER3_THRESHOLD: 5000000000   # $50,000,000 in cents
    precision: "rates exact; tier integer"
    variants: []

  - name: purchase_split
    trigger: "On Purchase creation"
    algorithm: tiered_pricing
    formula: |
      # Dual-variant: SHARE_MODE decides platform-fee rounding order.
      # Variants produce different platform_fee for identical gross when
      # gross * rate is fractional.
      if SHARE_MODE == "PLATFORM_FIRST":
          platform_fee_cents = round_half_up(gross_price_cents * rate)
          developer_share_cents = gross_price_cents - platform_fee_cents
      else:  # SHARE_MODE == "DEVELOPER_FIRST" (pinned default)
          developer_share_cents = gross_price_cents - round_half_up(gross_price_cents * rate)
          platform_fee_cents = gross_price_cents - developer_share_cents
      # rate = current tier rate of the title at purchase time (snapshot).
    input_set: "Purchase gross_price_cents (post pricing resolution) + Title.current_tier at purchase time"
    constants:
      SHARE_MODE: DEVELOPER_FIRST
    precision: "integer cents, round_half_up on the fee only"
    variants:
      - name: platform_first
        when: "SHARE_MODE == PLATFORM_FIRST"
        difference: "fee rounded up first, developer gets remainder; differs by exactly 1 cent from developer_first when gross*rate has a fractional .5+ part vs floor split"
      - name: developer_first
        when: "SHARE_MODE == DEVELOPER_FIRST (default)"
        difference: "developer share = gross - round_half_up(fee); platform_fee = gross - developer_share"

  - name: regional_price_recommendation
    trigger: "On GET /storefront/titles/{id}/pricing-recommendation or when validating a RegionPriceOverride"
    algorithm: constraint_propagation
    formula: |
      # recommended_cents(cur) = round_half_up(base_price_usd_cents * FX[cur] * PPP_MULT[cur])
      # Effective price resolution order (pinned):
      #   1. ACTIVE RegionPriceOverride for (title, currency) -> price_cents
      #   2. else recommended_cents(currency)
      #   3. USD purchases always use base_price_usd_cents exactly (no FX).
      # Deviation guard for overrides (gray-market control):
      #   deviation_bps = round_half_up((override - recommended) * 10000 / recommended)
      #   override rejected when abs(deviation_bps) > MAX_DEVIATION_BPS (2500 = 25%).
      # USD-recognized value for revenue ledger: every non-USD purchase converts
      # gross back to USD as round_half_up(gross_price_cents / FX[cur]) BEFORE
      # tier accounting; refunds subtract the same USD value that was added
      # (recognized value is snapshotted on the purchase).
      recommended = round_half_up(base_usd * FX[cur] * PPP[cur])
      if override ACTIVE: price = override.price_cents
      else: price = recommended
      usd_recognized = gross if cur == USD else round_half_up(gross / FX[cur])
    input_set: "Title.base_price_usd_cents, ACTIVE RegionPriceOverride for (title, currency), FX + PPP tables"
    constants:
      FX_EUR: 0.92
      FX_GBP: 0.79
      FX_JPY: 149.50
      FX_BRL: 5.05
      PPP_EUR: 0.90
      PPP_GBP: 0.95
      PPP_JPY: 0.70
      PPP_BRL: 0.50
      MAX_DEVIATION_BPS: 2500
    precision: "integer minor units, round_half_up; JPY has 0 decimals by convention but stored in same integer field"
    variants: []

  - name: refund_eligibility
    trigger: "On RefundRequest creation (auto-decision) and re-checked on manual approve"
    algorithm: threshold
    formula: |
      age_ok    = (now - purchase.purchased_at) <= PURCHASE_AGE_LIMIT   # 14 days, INCLUSIVE at exactly 14d
      time_ok   = purchase.playtime_minutes < PLAYTIME_LIMIT            # 120, STRICT: 119 ok, 120 not
      amount_ok = amount_cents <= purchase.gross_price_cents - purchase.refunded_cents
      state_ok  = purchase.status in {COMPLETED, PARTIALLY_REFUNDED}
      abuse_ok  = user.refund_restricted == false
      policy_ok = age_ok AND time_ok AND amount_ok AND state_ok AND abuse_ok
      # On creation: policy_ok -> auto-APPROVED; else stays REQUESTED awaiting
      # TrustSafety manual review. Manual approve re-checks the same predicate.
    input_set: "Purchase fields, UserAccount.refund_restricted, logical clock now"
    constants:
      PURCHASE_AGE_LIMIT_DAYS: 14
      PLAYTIME_LIMIT_MINUTES: 120
    precision: "datetimes compared at second precision; playtime integer minutes"
    variants: []

  - name: review_score_aggregation
    trigger: "On review publish, review removal, bomb-window open/close"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant: two scoring modes over the same review set.
      # Included set: Review.status == PUBLISHED AND off_topic == false.
      # weight(r) = max(1, floor(sqrt(r.author_playtime_minutes)))  [0 playtime -> weight 1]
      # UNWEIGHTED: score_bps = round_half_up(10000 * count(positive) / count(all))
      # WEIGHTED (pinned default):
      #   score_bps = round_half_up(10000 * sum(weight for positive) / sum(weight for all))
      # Empty included set -> score_bps = null.
      # recent_review_summary over trailing 30 days (inclusive of now, exclusive
      # of now-30d) of the included set:
      #   positive_share >= 0.70 -> MOSTLY_POSITIVE
      #   positive_share >= 0.40 -> MIXED
      #   else                   -> MOSTLY_NEGATIVE  (empty window -> null)
    input_set: "PUBLISHED, non-off-topic reviews of the title"
    constants:
      SCORE_MODE: WEIGHTED
      POSITIVE_THRESHOLD: 0.70
      MIXED_THRESHOLD: 0.40
      RECENT_WINDOW_DAYS: 30
    precision: "basis points integer, round_half_up"
    variants:
      - name: unweighted
        when: "SCORE_MODE == UNWEIGHTED"
        difference: "each review counts 1 regardless of playtime; differs from weighted whenever playtime differs across reviewers"

  - name: review_bomb_detection
    trigger: "On every review creation (rolling evaluation)"
    algorithm: threshold
    formula: |
      # Detection window: trailing 24h (inclusive of now).
      # negatives = count of PUBLISHED reviews created in window with is_positive == false
      # total     = count of PUBLISHED reviews created in window
      # Trigger when negatives >= BOMB_MIN_COUNT (10) AND negatives / total >= BOMB_RATIO (0.80).
      # On trigger: create ReviewBombWindow(start_at = created_at of the OLDEST
      # negative review in the window (created_at ASC tie-break), end_at = now + 7 days).
      # Reviews created while any ACTIVE window covers their created_at are
      # marked off_topic = true (they still publish but never score) — INCLUDING
      # the very review whose creation triggers the window, and any reviews
      # earlier in the detection window that fall inside [start_at, end_at);
      # the covered pre-existing reviews are retro-marked off_topic at window
      # creation and restored (off_topic = false) when the window is CLOSED.
      # Only one ACTIVE window per title: a second trigger while one is ACTIVE
      # extends end_at of the existing window to now + 7 days instead.
    input_set: "Reviews of the title created in trailing 24h with status PUBLISHED"
    constants:
      BOMB_MIN_COUNT: 10
      BOMB_RATIO: 0.80
      BOMB_WINDOW_DAYS: 7
      DETECTION_WINDOW_HOURS: 24
    precision: "counts integer; ratio exact rational comparison negatives*5 >= total*4"
    variants: []

  - name: refund_abuse_scoring
    trigger: "On RefundRequest APPROVED (score up), on Purchase creation (score down), on unrestrict (recompute)"
    algorithm: aggregation
    formula: |
      # Rolling 60-day window over the account's events (created_at of the
      # refund request's decision / purchase).
      # +1 per APPROVED refund event in window
      # +3 extra per APPROVED refund whose purchase.playtime_minutes >= 120
      #        (manual overrides can approve over-limit refunds; they cost more)
      # -1 per completed Purchase in window
      # score = max(0, sum)
      # If score > RESTRICT_THRESHOLD (3): account -> RESTRICTED, refund_restricted = true.
      # Note the interplay: a >=120-playtime refund normally fails policy, but a
      # manual TrustSafety approval lets it through at +4 points.
    input_set: "Account's refund decisions and purchases in trailing 60 days"
    constants:
      RESTRICT_THRESHOLD: 3
      ABUSE_WINDOW_DAYS: 60
      OVER_LIMIT_PENALTY: 3
    precision: "integer score, floor 0"
    variants: []

  - name: free_key_allowance
    trigger: "On ActivationKeyBatch creation (allowance snapshot) and approval (check)"
    algorithm: aggregation
    formula: |
      # allowance = max(FREE_KEY_BASE, completed_lifetime_sales)
      # completed_lifetime_sales = count of Purchase for title with status in
      #   {COMPLETED, PARTIALLY_REFUNDED} (REFUNDED purchases no longer count).
      # Granted-so-far = sum of free_keys_in_batch over APPROVED batches of title.
      # Approve requires granted-so-far + batch.free_keys_in_batch <= allowance_at_request.
      # Snapshot is taken at REQUEST time; later sales do not retroactively
      # enlarge an old REQUESTED batch's allowance.
    input_set: "Title purchases + APPROVED key batches"
    constants:
      FREE_KEY_BASE: 5000
    precision: "integer keys"
    variants: []

  - name: workshop_creator_share
    trigger: "On WorkshopSale creation"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial (mode b): nested rounding, order pinned.
      # creator_share_cents = floor(gross_cents * creator_share_bps / 10000)
      # platform_share_cents = gross_cents - creator_share_cents
      # Order pinned: creator share floored FIRST; platform absorbs the
      # fractional remainder. floor(999 * 3333 / 10000) = floor(332.9667) = 332,
      # platform = 667. Reversed order (platform first) would give 333/666.
    input_set: "WorkshopSale.gross_cents, WorkshopItem.creator_share_bps"
    constants: {}
    precision: "integer cents, floor on creator share"
    variants: []

  - name: recognized_revenue_ledger
    trigger: "On purchase completion (+), refund approval (-), manual adjustment (+/-)"
    algorithm: aggregation
    formula: |
      # Dual-variant (metric variant): the tier threshold compares RECOGNIZED
      # revenue; the payout/export view reports GROSS revenue.
      # recognized += usd_recognized(purchase) at completion
      # recognized -= approved_amount_usd at refund (partial refunds subtract
      #   only the refunded part; the retained part still counts)
      # recognized += manual adjustment delta (signed, may be negative but the
      #   total may never go below 0 -> adjustment rejected if it would)
      # gross_export = sum of all completed purchase gross (never decremented
      #   by refunds) -> the two metrics DIVERGE after any refund.
    input_set: "Title purchases, refunds, adjustments"
    constants: {}
    precision: "integer USD cents"
    variants:
      - name: gross_export
        when: "Payout/export reporting"
        difference: "never decremented by refunds; diverges from recognized by cumulative refunded USD"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles and §1.7 matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id referenced in the path and body exists (left-to-right path order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "Entity-backed role owns the target resource: Developer X-User-ID == resource's developer_account_id chain; User X-User-ID == the user_account_id / creator_account_id of the acted-on resource"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "developer/user-scoped mutations"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /storefront/titles/{id}/adjustments, POST /storefront/reviews, POST /storefront/regional-prices"
  - priority: 7
    category: business_constraint
    check: "Required fields present, types valid, enums in range, strings non-empty, base_price_usd_cents > 0, price_cents > 0, requested_quantity in 1..10000, 0 <= free_keys_in_batch <= requested_quantity, creator_share_bps in 1..5000, body length 1..8000"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all creation endpoints"
  - priority: 8
    category: business_safety
    check: "DeveloperAccount.status == ACTIVE before title submission, key-batch creation, schedule/release, regional-price creation"
    error_id: ERR_DEVELOPER_NOT_ACTIVE
    http_status: 409
    applies_to: "developer-scoped write endpoints"
  - priority: 9
    category: business_safety
    check: "UserAccount.status == ACTIVE (not RESTRICTED/BANNED) before purchase, key redemption, review posting, workshop sale"
    error_id: ERR_ACCOUNT_RESTRICTED
    http_status: 409
    applies_to: "user-scoped write endpoints"
  - priority: 10
    category: business_temporal
    check: "schedule-release: release_at strictly > now; review-bomb-window creation: end_at > start_at"
    error_id: ERR_INVALID_SCHEDULE
    http_status: 422
    applies_to: "POST /storefront/titles/{id}/schedule-release, POST /storefront/review-bomb-windows"
  - priority: 11
    category: business_constraint
    check: "Early access: early_access titles must have non-null early_access_disclosure_text before schedule-release or release-now"
    error_id: ERR_MISSING_DISCLOSURE
    http_status: 422
    applies_to: "POST /storefront/titles/{id}/schedule-release, POST /storefront/titles/{id}/release-now"
  - priority: 12
    category: business_constraint
    check: "No other StorePageReview for the title is in SUBMITTED (one open review per title)"
    error_id: ERR_REVIEW_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /storefront/titles/{id}/submit-review"
  - priority: 13
    category: business_safety
    check: "RegionPriceOverride deviation guard: abs(deviation_bps) <= 2500 vs current recommendation"
    error_id: ERR_PRICE_DEVIATION
    http_status: 422
    applies_to: "POST /storefront/regional-prices"
  - priority: 14
    category: business_constraint
    check: "Only one ACTIVE RegionPriceOverride per (title, currency)"
    error_id: ERR_OVERRIDE_EXISTS
    http_status: 409
    applies_to: "POST /storefront/regional-prices"
  - priority: 15
    category: business_fiscal
    check: "Free-key allowance: granted-so-far + free_keys_in_batch <= free_key_allowance_at_request"
    error_id: ERR_FREE_KEY_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /storefront/key-batches/{id}/approve"
  - priority: 16
    category: business_safety
    check: "Gray-market control: Title.refund_abuse_flag == false before key-batch approval"
    error_id: ERR_GRAY_MARKET_RISK
    http_status: 422
    applies_to: "POST /storefront/key-batches/{id}/approve"
  - priority: 17
    category: business_temporal
    check: "Key redemption velocity: redeeming account < 3 successful redemptions in trailing 60 min AND global redemptions < 50 in trailing 60 min"
    error_id: ERR_REDEEM_VELOCITY
    http_status: 422
    applies_to: "POST /storefront/keys/redeem"
  - priority: 18
    category: business_temporal
    check: "Manual refund decision gate: TrustSafety approve/deny of a REQUESTED refund whose purchase is older than 14 days is rejected"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /storefront/refund-requests/{id}/approve, POST /storefront/refund-requests/{id}/deny"
  - priority: 19
    category: business_constraint
    check: "Manual refund approve gate: purchase.playtime_minutes >= 120 blocks approval (deny remains allowed)"
    error_id: ERR_PLAYTIME_EXCEEDED
    http_status: 422
    applies_to: "POST /storefront/refund-requests/{id}/approve"
  - priority: 20
    category: business_safety
    check: "Refund abuse: user.refund_restricted == false"
    error_id: ERR_REFUND_ABUSE
    http_status: 422
    applies_to: "POST /storefront/refund-requests"
  - priority: 21
    category: business_fiscal
    check: "Refund amount: amount_cents <= gross_price_cents - refunded_cents and purchase.status in {COMPLETED, PARTIALLY_REFUNDED}"
    error_id: ERR_REFUND_AMOUNT
    http_status: 422
    applies_to: "POST /storefront/refund-requests"
  - priority: 22
    category: business_constraint
    check: "No other RefundRequest for this purchase in REQUESTED"
    error_id: ERR_REFUND_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /storefront/refund-requests"
  - priority: 22.5
    category: business_temporal
    check: "Auto-decision policy evaluation: if playtime >= 120 or age > 14 days or user refund_restricted, the created RefundRequest stays REQUESTED (no error); it auto-APPROVED only when the full policy passes"
    error_id: null
    http_status: 201
    applies_to: "POST /storefront/refund-requests (auto-decision; policy failures leave status REQUESTED for manual review)"
  - priority: 23
    category: business_referential
    check: "Review eligibility: author owns a Purchase of the title in {COMPLETED, PARTIALLY_REFUNDED} or a REDEEMED ActivationKey for the title"
    error_id: ERR_REVIEW_NOT_OWNED
    http_status: 422
    applies_to: "POST /storefront/reviews"
  - priority: 24
    category: business_referential
    check: "Adjustment floor: recognized revenue after applying delta must be >= 0"
    error_id: ERR_NEGATIVE_REVENUE
    http_status: 422
    applies_to: "POST /storefront/titles/{id}/adjustments"
  - priority: 25
    category: business_referential
    check: "Workshop sale host: WorkshopItem.status == PUBLISHED and host Title.status == RELEASED"
    error_id: ERR_ITEM_NOT_PURCHASABLE
    http_status: 422
    applies_to: "POST /storefront/workshop-sales"
  - priority: 26
    category: business_constraint
    check: "Uniqueness: DeveloperAccount.contact_email unique; UserAccount.email unique; Title.title_name unique per developer; Review unique per (title_id, user_account_id)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "creation endpoints for those entities"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock / infra ----
  - method: POST
    path: "/storefront/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock. Sweeping side effect: RELEASE_SCHEDULED titles whose scheduled_release_at <= new time transition to RELEASED."
    roles: [PlatformOps]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["Auto-release sweep", "ReviewBombWindow ACTIVE coverage re-evaluated"]

  # ---- developer accounts ----
  - method: POST
    path: "/storefront/developer-accounts"
    description: "Register developer account (PENDING)"
    roles: [PlatformOps]
    code: 201
    input: [company_name, contact_email]
    output: DeveloperAccount
    side_effects: []
  - method: GET
    path: "/storefront/developer-accounts/{id}"
    description: "Read developer account"
    roles: [PlatformOps, Developer, StoreReviewer, TrustSafety]
    code: 200
    input: []
    output: DeveloperAccount
    side_effects: []
  - method: GET
    path: "/storefront/developer-accounts"
    description: "List developer accounts"
    roles: [PlatformOps, StoreReviewer, TrustSafety]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeveloperAccount[]"
    side_effects: []
  - method: POST
    path: "/storefront/developer-accounts/{id}/payment-info"
    description: "Record onboarding fee payment and/or bank details"
    roles: [Developer]
    code: 200
    input: ["pay_fee?", "submit_bank_details?"]
    output: DeveloperAccount
    side_effects: ["Increments DeveloperAccount.version"]
  - method: POST
    path: "/storefront/developer-accounts/{id}/activate"
    description: "Activate developer (fee paid + bank details required)"
    roles: [PlatformOps]
    code: 200
    input: []
    output: DeveloperAccount
    side_effects: ["Increments DeveloperAccount.version"]
  - method: POST
    path: "/storefront/developer-accounts/{id}/suspend"
    description: "Suspend developer; delists RELEASED/RELEASE_SCHEDULED titles"
    roles: [PlatformOps]
    code: 200
    input: []
    output: DeveloperAccount
    side_effects: ["Cascade: titles -> DELISTED", "Increments DeveloperAccount.version"]
  - method: POST
    path: "/storefront/developer-accounts/{id}/unsuspend"
    description: "Unsuspend developer (titles NOT auto-restored)"
    roles: [PlatformOps]
    code: 200
    input: []
    output: DeveloperAccount
    side_effects: ["Increments DeveloperAccount.version"]
  - method: POST
    path: "/storefront/developer-accounts/{id}/terminate"
    description: "Terminate developer; delists titles, revokes UNUSED keys"
    roles: [PlatformOps]
    code: 200
    input: []
    output: DeveloperAccount
    side_effects: ["Cascade: titles -> DELISTED", "Cascade: UNUSED keys -> REVOKED", "Increments DeveloperAccount.version"]

  # ---- titles ----
  - method: POST
    path: "/storefront/titles"
    description: "Register a title (DRAFT)"
    roles: [Developer]
    code: 201
    input: [developer_account_id, title_name, base_price_usd_cents, "early_access?", "early_access_disclosure_text?"]
    output: Title
    side_effects: []
  - method: GET
    path: "/storefront/titles/{id}"
    description: "Read title (computed fields resolved on read; lazy auto-release check)"
    roles: [PlatformOps, Developer, StoreReviewer, TrustSafety, User]
    code: 200
    input: []
    output: Title
