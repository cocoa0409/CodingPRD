# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Occupational Health Clinic — depth probe: 9 rules x >= 2 instances = 18 total.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls /
# trigger chain is executable from empty-DB via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billable_snapshot_vs_current_protocol_price
        grounds:
          - calculations.encounter_billable
          - entities.Encounter.fields.billable_amount_cents
          - entities.Encounter.fields.protocol_id
          - state_machines.Encounter.PENDING_RESULTS_to_COMPLETED
        distinguishing_aspect: |
          On the Encounter domain, completing an encounter prices it from the SNAPSHOTTED protocol
          (price_cents at scheduling), not the employer's later-activated ACTIVE protocol; the two
          interpretations diverge for the identical panel_code (snapshot 12000 vs current 20000).
        test_recipe:
          setup:
            - "Employer (non-DOT) with an ACTIVE protocol P1 pricing DRUG_NON_DOT at 12000 for job_category DRIVER."
            - "A worker (job_category DRIVER) has a SCHEDULED DRUG_SCREEN encounter snapshotting P1."
            - "After scheduling, a new protocol P2 re-prices DRUG_NON_DOT at 20000 and is activated (P1 -> RETIRED)."
            - "The drug screen runs to VERIFIED and a FIT clearance is issued."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Acme", dot_regulated: false, mro_user_id: "mro-1", net_terms_days: 30 }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "DRUG_NON_DOT", required_for_job_category: "DRIVER", price_cents: 12000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
              captures: { emp_v1: $.data.version }
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Dana Driver", job_category: "DRIVER", dob: "1990-05-05" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "DRUG_SCREEN", panel_code: "DRUG_NON_DOT" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "GET /clinic/employers/${emp_id}"
              payload: {}
              as: ClinicAdmin
              captures: { emp_v_pre_p2: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-02-01", panels: [ { panel_code: "DRUG_NON_DOT", required_for_job_category: "DRIVER", price_cents: 20000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /clinic/protocols/${p2_id}/activate"
              payload: { expected_employer_version: "${emp_v_pre_p2}" }
              as: ClinicAdmin
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/drug-screens"
              payload: { encounter_id: "${enc_id}", specimen_seal_intact: true }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ds_id: $.data.id }
            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "COLLECT" }
              as: Collector
            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "LAB_RECEIVE" }
              as: Collector
            - call: "POST /clinic/drug-screens/${ds_id}/lab-result"
              payload: { lab_result: "NEGATIVE" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/drug-screens/${ds_id}/mro-receive"
              payload: {}
              as: MRO
              as_user_id: "mro-1"
            - call: "POST /clinic/drug-screens/${ds_id}/mro-verify"
              payload: { mro_verified_result: "NEGATIVE" }
              as: MRO
              as_user_id: "mro-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/encounters/${enc_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { billable: $.data.billable_amount_cents }
          assert:
            - "Encounter.${enc_id}.billable_amount_cents == 12000"
            - "Encounter.${enc_id}.protocol_id == ${p1_id}"
            - "Encounter.${enc_id}.status == COMPLETED"

      - name: osha_column_away_dominates_restricted
        grounds:
          - calculations.osha_recordability
          - entities.InjuryCase.fields.osha_column
          - entities.InjuryCase.fields.is_osha_recordable
          - state_machines.InjuryCase.OPEN_to_RTW_PENDING
        distinguishing_aspect: |
          On the InjuryCase domain, an injury with BOTH days_away>=1 and days_restricted>=1 is logged
          in the DAYS_AWAY column (not RESTRICTED_TRANSFER); the precedence interpretation differs from a
          naive "restricted -> restricted column" reading and yields a different osha_column for identical data.
        test_recipe:
          setup:
            - "Employer ACTIVE with a protocol (any panel); a worker exists."
            - "An INJURY encounter is checked in; an injury case is created with treatment_level=LOST_TIME, days_away=3, days_restricted=5."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Beta", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "WELDER", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Will Welder", job_category: "WELDER", dob: "1985-03-03" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "INJURY" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/injury-cases"
              payload: { encounter_id: "${enc_id}", injury_date: "2026-01-02", treatment_level: "LOST_TIME", days_away: 3, days_restricted: 5 }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ic_id: $.data.id, col: $.data.osha_column }
          assert:
            - "InjuryCase.${ic_id}.is_osha_recordable == true"
            - "InjuryCase.${ic_id}.osha_column == DAYS_AWAY"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: osha_precedence_three_input_branch
        grounds:
          - calculations.osha_recordability
          - entities.InjuryCase.fields.treatment_level
          - entities.InjuryCase.fields.days_restricted
          - entities.InjuryCase.fields.osha_column
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear branch (treatment_level, days_away, days_restricted) with
          conditional precedence — RESTRICTED_DUTY treatment_level with days_away==0 and days_restricted==0
          still resolves to RESTRICTED_TRANSFER via the OR branch in rule 3, not OTHER_RECORDABLE.
        test_recipe:
          setup:
            - "Employer ACTIVE; worker exists; an INJURY encounter is checked in."
            - "Injury case created with treatment_level=RESTRICTED_DUTY, days_away=0, days_restricted=0."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Gamma", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Olive Op", job_category: "OP", dob: "1992-07-07" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "INJURY" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/injury-cases"
              payload: { encounter_id: "${enc_id}", injury_date: "2026-01-02", treatment_level: "RESTRICTED_DUTY", days_away: 0, days_restricted: 0 }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ic_id: $.data.id }
          assert:
            - "InjuryCase.${ic_id}.osha_column == RESTRICTED_TRANSFER"
            - "InjuryCase.${ic_id}.is_osha_recordable == true"

      - name: invoice_discount_round_once_then_subtract
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.discount_cents
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — discount_cents = round_half_up(subtotal*0.05)
          computed ONCE over the summed subtotal (61725*0.05=3086.25 -> 3086, total 58639), NOT by rounding
          each line item's 5% (which would give 3085 -> total 58640). The pinned order produces 58639.
        test_recipe:
          setup:
            - "Employer ACTIVE; protocol prices PHYSICAL at 12345; worker (job WELDER) exists."
            - "Five PHYSICAL encounters are completed (each FIT-cleared) within the billing period, billable 12345 each."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Delta", mro_user_id: "mro-1", net_terms_days: 30, current_date: "2026-03-15" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "WELDER", price_cents: 12345, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Pat Phys", job_category: "WELDER", dob: "1980-01-01" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { e1: $.data.id }
            - call: "POST /clinic/encounters/${e1}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${e1}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters/${e1}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { e2: $.data.id }
            - call: "POST /clinic/encounters/${e2}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${e2}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters/${e2}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { e3: $.data.id }
            - call: "POST /clinic/encounters/${e3}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${e3}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters/${e3}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { e4: $.data.id }
            - call: "POST /clinic/encounters/${e4}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${e4}", determination: "FIT" }
              as: Clinician
