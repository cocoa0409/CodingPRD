            - "ShiftAssignment.${day_shift_id}.version == ${cancelled_v}"

      - name: releasing_the_only_assignment_credits_the_shift_back_and_breaches_the_staffing_axis
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CareAssignment.ACTIVE_to_RELEASED
          - state_machines.LaborEncounter.RATIO_COVERED_to_COVERAGE_BREACH
          - entities.CareAssignment.fields.released_at
          - entities.CareAssignment.fields.acuity_units_consumed
          - entities.ShiftAssignment.fields.assigned_acuity_load_units
          - entities.LaborEncounter.fields.assigned_coverage_units
          - entities.ObstetricUnit.fields.coverage_deficit_units
          - endpoints[POST /care-assignments/{assignmentId}/release]
          - invariants.acuity_load_conservation
        distinguishing_aspect: |
          One release fires four side effects that must ALL land: the row goes RELEASED with
          released_at stamped from the clock (06:30, deliberately later than the 06:00 creation so a
          copied created_at is visible); the shift's assigned_acuity_load_units is credited back by
          EXACTLY the 0.5 that was debited, reaching 0.0 rather than drifting; the encounter's
          assigned_coverage_units drops to 0.0 and its staffing_state axis moves RATIO_COVERED ->
          COVERAGE_BREACH (not to RELEASED, because labor_phase is ANTEPARTUM, well before the
          POSTPARTUM_RECOVERY/DISCHARGED/TRANSFERRED_OUT set that RELEASED requires); and the unit's
          coverage_deficit_units rises to exactly 0.5. acuity_units_consumed itself must survive at
          0.5 — it is the ledger record the credit-back is computed from, not a live balance.
          The whole thing succeeds with 200: a self-inflicted breach raises no error.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit, one AVAILABLE LDR bed, one RN_LABOR_DELIVERY
            member with ADVANCED certification on an ACTIVE CHARGE shift 05:00-15:00 whose
            capacity_units_effective froze at 2.0, one ANTEPARTUM TIER_I encounter with
            required_coverage_units 0.5, and one ACTIVE RATIO_SHARED CareAssignment debiting exactly
            0.5 (0.0 + 0.5 <= 2.0 passes the inclusive priority-15 fit), which put the encounter at
            RATIO_COVERED and the unit's deficit at 0.0. The clock is then moved to 06:30, still
            inside the shift window.
