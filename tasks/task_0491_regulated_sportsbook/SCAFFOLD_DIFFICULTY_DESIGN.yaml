      - name: parlay_legs_must_span_distinct_events
        grounds:
          - validations[priority=11]
          - entities.Bet.fields.bet_type
          - errors[ERR_PARLAY_COMPOSITION_INVALID]
        distinguishing_aspect: |
          Different interval semantics = cross-event-spread on the Event resource:
          a PARLAY whose two legs both belong to selections on the SAME event_id
          fails the >=2-distinct-events rule (PARLAY requires disjoint events),
