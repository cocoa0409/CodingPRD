      - name: claim_appeal_cycle
        grounds:
          - state_machines.Claim.DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_ADJUDICATED
          - state_machines.Claim.ADJUDICATED_to_DENIED
        distinguishing_aspect: |
          Claim exhibits a cycle ADJUDICATED -> DENIED -> APPEALED -> ADJUDICATED
          (up to MAX_APPEALS times): a denied claim loops back through
          adjudication — a cyclic machine on Claim, distinct from the RTPProtocol
          regression cycle.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case; ACTIVE policy (deductible 0, coins 80, oop 1000000)"
            - "Claim billed 50000 submitted then adjudicated with deny=true -> DENIED"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "BASEBALL", season_start_date: "2026-08-01", season_end_date: "2026-11-01" }
