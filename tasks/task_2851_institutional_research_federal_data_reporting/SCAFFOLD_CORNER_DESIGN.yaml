              as_user_id: "u-shared"
              captures: { e2: $.data.error_id }
            - call: "POST /ir/restatements/${rst}/reject"
              payload: { rejection_reason: "Rejecting the request I filed myself." }
              as: IRDirector
              as_user_id: "u-shared"
              captures: { e3: $.data.error_id }
            - call: "POST /ir/restatements/${rst}/approve"
