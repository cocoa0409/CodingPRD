      - name: lab_staleness_pre_empts_symptom_score_on_redose
        grounds:
          - validations[priority=21]
          - validations[priority=25]
          - calculations.redose_eligibility
          - errors[ERR_LAB_STALE]
        distinguishing_aspect: |
          A third category pair: business_temporal (rung 21) versus business_constraint
          (rung 25). With a lab exactly 45 days old the request falls through to
          ERR_SYMPTOM_SCORE_BELOW_THRESHOLD; advancing the clock by one day so the same
          lab is 46 days old makes the identical request return ERR_LAB_STALE instead.
        test_recipe:
          setup:
            - "A patient with a COMPLETED 1000 mg testosterone insertion performed at 2026-05-10T09:00:00Z."
            - "A trough TOTAL_TESTOSTERONE panel of 400 drawn at 2026-07-25T09:00:00Z, 76 days after the anchor."
            - "A second consult with symptom_score 30, below the re-dose threshold of 40."
            - "Clock at 2026-09-08T09:00:00Z, exactly 45 days after the draw."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
