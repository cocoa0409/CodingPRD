scenario: |
  Deposit Product Pricing & Rate Sheet Governance (bank retail pricing committee): tier/rate structure design by product & market, competitor rate scan & repricing cadence, promotional rate & term with rollover treatment, exception pricing authority & documentation, rate change deployment across channels & disclosure timing, profitability & cost-of-funds analysis, relationship pricing bundles, grandfathered rate migration

domain_name: deposit-pricing-governance
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat        # peer entities joined by FK references; URL paths are flat
  state_machine_shape: cyclic  # RateSheet review loop, ExceptionPricingRequest docs loop, plus parallel dimensions on DepositAccount
  relationship_patterns:
    - one_to_many
    - self_referential         # RateSheet.supersedes_sheet_id
    - cross_aggregate
  role_model: segregation_of_duties   # exception approver must differ from submitter; committee vs banker authority tiers
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: DepositProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code (e.g. SAV-STD, CD-12M); unique across all products" }
      - { name: product_class, type: enum, source: input, description: "SAVINGS | MONEY_MARKET | CD | INTEREST_CHECKING" }
      - { name: term_months, type: integer, source: input, description: "Contractual term in months; 0 means non-term (variable-rate) product. term_months > 0 accounts lock their rate at open and become GRANDFATHERED when their sheet is superseded" }
      - { name: tier_application, type: enum, source: input, description: "MARGINAL | WHOLE_BALANCE — selects the tiered_balance_rate variant" }
      - { name: rate_cap_bp, type: integer, source: input, description: "Absolute internal rate ceiling in basis points; effective_account_rate clamps to this" }
      - { name: allows_promos, type: boolean, source: input, description: "Whether accounts of this product may enroll in promotional offers" }
      - { name: allows_exceptions, type: boolean, source: input, description: "Whether exception pricing requests may target accounts of this product" }

  - name: RateSheet
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> DepositProduct.id" }
      - { name: market_code, type: string, source: input, description: "Market code string (e.g. US-WEST, US-EAST); free-form market identifier, no Market entity" }
      - { name: sheet_version, type: integer, source: computed, description: "Per-(product_id, market_code) sequence starting at 1, incremented for each new sheet created for the pair" }
      - { name: effective_date, type: string, source: input, description: "ISO date; start of the half-open effective window [effective_date, end_date)" }
      - { name: end_date, type: string, source: input, default: "9999-12-31", description: "ISO date; exclusive end of the effective window; 9999-12-31 means open-ended" }
      - { name: disclosure_lead_days, type: integer, source: input, description: "Minimum days between disclosure sent date and effective_date; required_by_date = effective_date - disclosure_lead_days" }
      - { name: margin_floor_bp, type: integer, source: input, description: "Minimum acceptable projected margin over cost of funds in bp; 0 disables the submit-time margin check" }
      - { name: source_scan_id, type: string, source: input, default: null, description: "FK -> CompetitorRateScan.id; optional — the competitor scan that motivated this sheet" }
      - { name: supersedes_sheet_id, type: string, source: computed, default: null, description: "FK -> RateSheet.id; set at activation to the prior EFFECTIVE sheet for the same (product_id, market_code)" }
      - { name: tiers, type: array, source: input, description: "Embedded tier rows: { tier_index:int, lower_bound_cents:int (inclusive), upper_bound_cents:int (exclusive, -1 = unbounded), rate_bp:int, projected_balance_cents:int }. Must be contiguous from 0, ascending, last row unbounded" }
      - { name: total_projected_balance_cents, type: integer, source: computed, description: "Sum of tiers[*].projected_balance_cents; recomputed on create/patch" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMITTEE_REVIEW | APPROVED | SCHEDULED | EFFECTIVE | SUPERSEDED | RETIRED" }

  - name: CompetitorRateScan
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Market this scan covers" }
      - { name: scan_date, type: string, source: input, description: "ISO date the scan data was collected" }
      - { name: source_name, type: string, source: input, description: "Data vendor / source label" }
      - { name: entries, type: array, source: input, description: "Embedded rows: { competitor_name:string, product_class:enum, rate_bp:int, tier_balance_cents:int }. May be empty" }
      - { name: benchmark_weighted_bp, type: integer, source: computed, default: null, description: "Balance-weighted benchmark per competitor_market_benchmark; set by analyze" }
      - { name: benchmark_simple_bp, type: integer, source: computed, default: null, description: "Simple-average benchmark per competitor_market_benchmark; set by analyze" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ANALYZED | ACTIONED" }

  - name: RepricingCycle
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> DepositProduct.id; unique together with market_code" }
      - { name: market_code, type: string, source: input, description: "Market code; unique together with product_id" }
      - { name: cadence_days, type: integer, source: input, description: "Review cadence; next sheet activation for the pair must occur within this many days of last_reviewed_at" }
      - { name: last_reviewed_at, type: string, source: system, default: null, description: "ISO date of last sheet activation for the pair; null until first activation" }
      - { name: next_review_due, type: string, source: computed, default: null, description: "last_reviewed_at + cadence_days; null when last_reviewed_at is null" }
      - { name: status, type: enum, source: computed, description: "CURRENT | OVERDUE — per repricing_cadence_status; OVERDUE when last_reviewed_at is not null and logical today >= next_review_due" }

  - name: PromotionalOffer
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> DepositProduct.id" }
      - { name: market_code, type: string, source: input, description: "Market code the promo is offered in" }
      - { name: promo_rate_bp, type: integer, source: input, description: "Promotional rate in bp; replaces the sheet base rate while rate_source = PROMO" }
      - { name: promo_term_days, type: integer, source: input, description: "Days an enrolled account keeps the promo rate before rollover" }
      - { name: enrollment_start, type: string, source: input, description: "ISO date; inclusive start of the CLOSED enrollment window [enrollment_start, enrollment_end]" }
      - { name: enrollment_end, type: string, source: input, description: "ISO date; INCLUSIVE end of the enrollment window (closed interval semantics)" }
      - { name: min_opening_balance_cents, type: integer, source: input, default: 0, description: "Minimum current balance required to enroll" }
      - { name: rollover_treatment, type: enum, source: input, description: "ROLL_TO_SHEET | RENEW_THEN_SHEET — treatment when promo_term_days elapse" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | ACTIVE | CLOSED | EXPIRED" }

  - name: ExceptionPricingRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> DepositAccount.id" }
      - { name: sheet_id, type: string, source: input, description: "FK -> RateSheet.id; the baseline sheet the exception is priced against" }
      - { name: requested_rate_bp, type: integer, source: input, description: "Requested absolute rate in bp" }
      - { name: baseline_rate_bp, type: integer, source: computed, description: "Snapshot: tiered_balance_rate for the account's balance on sheet_id at request creation; re-snapshotted on resubmit" }
      - { name: delta_bp, type: integer, source: computed, description: "requested_rate_bp - baseline_rate_bp" }
      - { name: authority_tier, type: enum, source: computed, description: "BRANCH when delta_bp <= 25, COMMITTEE when 26 <= delta_bp <= 75; delta_bp > 75 rejected at creation" }
      - { name: term_days, type: integer, source: input, description: "Days the exception rate lasts once applied; exception_end_date = application date + term_days" }
      - { name: justification_doc_ref, type: string, source: input, default: null, description: "Document reference; mandatory when authority_tier = COMMITTEE" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation of duties)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the most recent decision actor" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | RETURNED | REBASE_REQUIRED | APPROVED | APPLIED | DECLINED | REVOKED | EXPIRED" }

  - name: DepositAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_ref, type: string, source: input, description: "External core-banking customer reference (opaque string; no Customer entity)" }
      - { name: product_id, type: string, source: input, description: "FK -> DepositProduct.id" }
      - { name: market_code, type: string, source: input, description: "Market the account is booked in" }
      - { name: sheet_id, type: string, source: computed, description: "FK -> RateSheet.id; the sheet currently pricing this account (re-pointed on activation for variable products; frozen for grandfathered CDs)" }
      - { name: balance_cents, type: integer, source: input, description: "Current posted balance; set at open (opening_balance_cents) and via PATCH" }
      - { name: channel, type: enum, source: input, description: "BRANCH | ONLINE | MOBILE | CALL_CENTER — home channel used for account-level notices" }
      - { name: lifecycle, type: enum, source: system, description: "OPEN | FROZEN | CLOSED — independent state dimension" }
      - { name: rate_source, type: enum, source: system, description: "SHEET | PROMO | EXCEPTION | GRANDFATHERED — independent state dimension (parallel with lifecycle)" }
      - { name: promo_offer_id, type: string, source: system, default: null, description: "FK -> PromotionalOffer.id; set while rate_source = PROMO" }
      - { name: promo_end_date, type: string, source: system, default: null, description: "ISO date the promo term ends (enrollment date + promo_term_days; extended by RENEW_THEN_SHEET)" }
      - { name: exception_request_id, type: string, source: system, default: null, description: "FK -> ExceptionPricingRequest.id; set while rate_source = EXCEPTION" }
      - { name: exception_end_date, type: string, source: system, default: null, description: "ISO date the applied exception expires" }
      - { name: base_rate_bp, type: integer, source: computed, description: "tiered_balance_rate(balance_cents) over the current sheet's tiers" }
      - { name: bundle_bonus_bp, type: integer, source: computed, description: "Relationship bonus currently applied (0 unless an ENROLLED qualifying enrollment exists and rate_source = SHEET)" }
      - { name: exception_rate_bp, type: integer, source: computed, default: null, description: "Approved exception rate while rate_source = EXCEPTION" }
      - { name: current_rate_bp, type: integer, source: computed, description: "Per effective_account_rate" }
      - { name: unposted_accrual_milli, type: integer, source: system, default: 0, description: "Accrued-but-unposted interest in integer milli-cents; incremented by the daily clock sweep (see interest_posting), zeroed at posting" }
      - { name: posted_interest_cents, type: integer, source: system, default: 0, description: "Cumulative posted interest in cents" }
      - { name: last_accrual_date, type: string, source: system, description: "ISO date interest was last accrued to; initialized to opened date" }
      - { name: opened_at, type: string, source: system, description: "ISO date of opening (logical clock)" }

  - name: FundingCurve
    parent: null
    common_fields: true
    fields:
      - { name: curve_date, type: string, source: input, description: "ISO date the curve takes effect; latest curve with curve_date <= logical today is the operative curve" }
      - { name: points, type: array, source: input, description: "Embedded rows: { tenor_months:int, cost_bp:int }; must include tenor_months 0; ascending tenors" }

  - name: RelationshipBundle
    parent: null
    common_fields: true
    fields:
      - { name: bundle_code, type: string, source: input, description: "Unique bundle code" }
      - { name: bonus_bp, type: integer, source: input, description: "Rate bonus applied to eligible products for ENROLLED, qualifying customers" }
      - { name: min_combined_balance_cents, type: integer, source: input, description: "Minimum combined_relationship_balance to qualify for the bonus" }
      - { name: required_product_classes, type: array, source: input, description: "Product classes the customer must hold at least one OPEN account in (qualification gate)" }
      - { name: eligible_product_classes, type: array, source: input, description: "Product classes the bonus applies to" }

  - name: CustomerBundleEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: bundle_id, type: string, source: input, description: "FK -> RelationshipBundle.id" }
      - { name: customer_ref, type: string, source: input, description: "External customer reference (matches DepositAccount.customer_ref)" }
      - { name: qualifying_balance_cents, type: integer, source: computed, description: "combined_relationship_balance(customer_ref, bundle) at enrollment and on each qualifying event" }
      - { name: status, type: enum, source: system, description: "ENROLLED | SUSPENDED | EXITED" }

  - name: DisclosureNotice
    parent: null
    common_fields: true
    fields:
      - { name: sheet_id, type: string, source: system, description: "FK -> RateSheet.id; sheet whose change triggered this notice" }
      - { name: account_id, type: string, source: system, default: null, description: "FK -> DepositAccount.id; null for sheet-level PRE_CHANGE notices, set for account-level RATE_CHANGE_ADVERSE / PROMO_EXPIRY notices" }
      - { name: channel, type: enum, source: system, description: "BRANCH | ONLINE | MOBILE | CALL_CENTER" }
      - { name: notice_type, type: enum, source: system, description: "PRE_CHANGE | RATE_CHANGE_ADVERSE | PROMO_EXPIRY" }
      - { name: required_by_date, type: string, source: computed, description: "PRE_CHANGE: sheet.effective_date - sheet.disclosure_lead_days. RATE_CHANGE_ADVERSE: triggering date + 5 days. PROMO_EXPIRY: promo_end_date - 30 days" }
      - { name: sent_at, type: string, source: system, default: null, description: "ISO datetime sent (logical clock)" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "True if sent date > required_by_date, or PENDING with logical today > required_by_date" }
      - { name: status, type: enum, source: system, description: "PENDING | SENT | WAIVED" }

  - name: RateDeployment
    parent: null
    common_fields: true
    fields:
      - { name: sheet_id, type: string, source: system, description: "FK -> RateSheet.id" }
      - { name: channel, type: enum, source: system, description: "BRANCH | ONLINE | MOBILE | CALL_CENTER" }
      - { name: deployed_at, type: string, source: system, default: null, description: "ISO datetime of successful deployment" }
      - { name: status, type: enum, source: system, description: "PENDING | DEPLOYED | FAILED | RETIRED" }

  - name: MigrationBatch
    parent: null
    common_fields: true
    fields:
      - { name: source_sheet_id, type: string, source: input, description: "FK -> RateSheet.id; must be SUPERSEDED" }
      - { name: target_sheet_id, type: string, source: input, description: "FK -> RateSheet.id; must be EFFECTIVE" }
      - { name: migrated_count, type: integer, source: computed, default: 0, description: "Accounts migrated by EXECUTE" }
      - { name: skipped_count, type: integer, source: computed, default: 0, description: "GRANDFATHERED accounts on source skipped because lifecycle = CLOSED" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | ABORTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RateSheet
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: COMMITTEE_REVIEW
        trigger: POST /rate-sheets/{id}/submit
        actor: PricingAnalyst
        preconditions:
          - "tiers non-empty and structurally valid (ERR_TIER_STRUCTURE_INVALID)"
          - "when margin_floor_bp > 0: sheet_margin_analysis(FORWARD_LOOKING) >= margin_floor_bp (ERR_MARGIN_BELOW_FLOOR); requires an operative FundingCurve covering the product tenor (ERR_NO_FUNDING_CURVE)"
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /rate-sheets/{id}/review-decision { decision: APPROVE }"
        actor: PricingCommittee
        preconditions: []
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: DRAFT
        trigger: "POST /rate-sheets/{id}/review-decision { decision: RETURN }"
        actor: PricingCommittee
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: COMMITTEE_REVIEW
        trigger: "POST /rate-sheets/{id}/review-decision { decision: RETURN }"
        actor: PricingCommittee
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SCHEDULED
        trigger: POST /rate-sheets/{id}/schedule
        actor: PricingAnalyst
        preconditions:
          - "half-open window [effective_date, end_date) must not overlap any sheet for the same (product_id, market_code) in status SCHEDULED or EFFECTIVE; adjacency (this effective_date == other's end_date) is allowed (ERR_EFFECTIVE_WINDOW_OVERLAP)"
        side_effects:
          - "Create 4 RateDeployment rows, one per channel, in the fixed channel order BRANCH, ONLINE, MOBILE, CALL_CENTER (list order for filtered GETs is creation order), status PENDING"
          - "Create 4 sheet-level DisclosureNotice rows (PRE_CHANGE, one per channel, same fixed channel order), required_by_date = effective_date - disclosure_lead_days"
      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /rate-sheets/{id}/review-decision { decision: RETURN }"
        actor: PricingCommittee
        preconditions: []
        side_effects:
          - "Delete this sheet's PENDING/FAILED RateDeployment rows and PENDING DisclosureNotice rows"
      - from: SCHEDULED
        to: EFFECTIVE
        trigger: POST /rate-sheets/{id}/activate
        actor: PricingAnalyst
        preconditions:
          - "All 4 RateDeployment rows for this sheet are DEPLOYED (ERR_DEPLOYMENT_INCOMPLETE)"
          - "All PRE_CHANGE DisclosureNotice rows for this sheet are SENT with is_late = false, or WAIVED (ERR_DISCLOSURE_LEAD_TIME_UNMET)"
          - "logical today >= effective_date (ERR_FUTURE_EFFECTIVE_DATE)"
        side_effects:
          - "Set supersedes_sheet_id to the prior EFFECTIVE sheet S_old for (product_id, market_code); S_old -> SUPERSEDED; S_old.end_date := this sheet's effective_date (window truncation)"
          - "CASCADE link 1 (from supersession): every RateDeployment of S_old in DEPLOYED -> RETIRED"
          - "CASCADE link 2 (from supersession): every DepositAccount with sheet_id == S_old.id and lifecycle != CLOSED: if product.term_months == 0 -> sheet_id := this sheet, recompute base_rate_bp/current_rate_bp, bump version; if term_months > 0 -> rate_source := GRANDFATHERED, sheet_id unchanged, rate frozen, bump version (CLOSED accounts are never re-pointed)"
          - "CASCADE link 3 (from each repriced account): if the account's rate dropped by >= 10 bp, create an account-level DisclosureNotice (RATE_CHANGE_ADVERSE, channel = account.channel, required_by_date = today + 5)"
          - "ExceptionPricingRequest rows with sheet_id == S_old.id in UNDER_REVIEW or RETURNED -> REBASE_REQUIRED"
          - "RepricingCycle for (product_id, market_code): last_reviewed_at := today, recompute next_review_due"
          - "If source_scan_id is set and that scan is ANALYZED -> ACTIONED"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: system (side effect of another sheet's activate for the same product+market)
        actor: system
        preconditions: []
        side_effects: ["see activate cascade links 1-3 above"]
      - from: EFFECTIVE
        to: RETIRED
        trigger: POST /rate-sheets/{id}/retire
        actor: PricingCommittee
        preconditions:
          - "No DepositAccount has sheet_id == this sheet's id (any rate_source) (ERR_SHEET_INVALID_STATE)"
        side_effects: []
      - from: SUPERSEDED
        to: RETIRED
        trigger: POST /rate-sheets/{id}/retire, OR system auto-retire when the last GRANDFATHERED account leaves the sheet (migration cascade link 2)
        actor: PricingCommittee | system
        preconditions:
          - "manual retire: no DepositAccount has sheet_id == this sheet's id (ERR_SHEET_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: RETIRED
        trigger: POST /rate-sheets/{id}/retire
        actor: PricingCommittee
        preconditions: []
        side_effects: []

  - entity: PromotionalOffer
    initial_state: DRAFT
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: POST /promotional-offers/{id}/publish
        actor: PricingAnalyst
        preconditions:
          - "enrollment_start <= enrollment_end (ERR_INVALID_REQUEST)"
          - "closed enrollment window [enrollment_start, enrollment_end] must not intersect any SCHEDULED or ACTIVE offer for the same (product_id, market_code); identical boundary dates CONFLICT (closed-interval semantics) (ERR_PROMO_WINDOW_OVERLAP)"
        side_effects: []
      - from: SCHEDULED
        to: ACTIVE
        trigger: system (clock sweep when logical today >= enrollment_start)
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: EXPIRED
        trigger: system (clock sweep when logical today > enrollment_end while still SCHEDULED)
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: system (clock sweep when logical today > enrollment_end)
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: POST /promotional-offers/{id}/close
        actor: PricingAnalyst
        preconditions: []
        side_effects:
          - "No new enrollments; existing PROMO accounts are unaffected until their promo_end_date"

  - entity: ExceptionPricingRequest
    initial_state: UNDER_REVIEW
    terminal_states: [DECLINED, REVOKED, EXPIRED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /exception-pricing-requests/{id}/decision { decision: APPROVE }"
        actor: BranchBanker (authority_tier BRANCH only) | PricingCommittee (any tier)
        preconditions:
          - "decided_by (X-User-ID) != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "authority_tier = BRANCH allows BranchBanker or PricingCommittee; authority_tier = COMMITTEE allows PricingCommittee only (ERR_EXCEPTION_AUTHORITY_INSUFFICIENT)"
          - "baseline sheet EFFECTIVE (ERR_BASELINE_SHEET_NOT_EFFECTIVE)"
        side_effects: ["decided_by_user_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /exception-pricing-requests/{id}/decision { decision: DECLINE }"
        actor: BranchBanker (BRANCH tier) | PricingCommittee
        preconditions: ["decided_by != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["decided_by_user_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /exception-pricing-requests/{id}/decision { decision: RETURN }"
        actor: BranchBanker (BRANCH tier) | PricingCommittee
        preconditions: ["decided_by != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: []
      - from: RETURNED
        to: UNDER_REVIEW
        trigger: POST /exception-pricing-requests/{id}/resubmit
        actor: BranchBanker (must be original submitter)
        preconditions: []
        side_effects: ["re-snapshot baseline_rate_bp from the CURRENT effective sheet for the account's product+market; recompute delta_bp and authority_tier; sheet_id re-pointed to the current EFFECTIVE sheet"]
      - from: REBASE_REQUIRED
        to: UNDER_REVIEW
        trigger: POST /exception-pricing-requests/{id}/resubmit
        actor: BranchBanker (must be original submitter)
        preconditions: []
        side_effects: ["re-snapshot baseline_rate_bp from the current EFFECTIVE sheet; recompute delta_bp and authority_tier"]
      - from: APPROVED
        to: APPLIED
        trigger: POST /exception-pricing-requests/{id}/apply
        actor: BranchBanker
        preconditions:
          - "baseline sheet EFFECTIVE (ERR_BASELINE_SHEET_NOT_EFFECTIVE)"
          - "account lifecycle = OPEN and rate_source = SHEET (ERR_ACCOUNT_INVALID_STATE)"
          - "product.allows_exceptions (ERR_INVALID_REQUEST)"
        side_effects:
          - "account.rate_source := EXCEPTION; exception_request_id, exception_end_date := today + term_days; exception_rate_bp := requested_rate_bp; recompute current_rate_bp; bump account version"
      - from: APPLIED
        to: REVOKED
        trigger: "POST /exception-pricing-requests/{id}/decision { decision: REVOKE }"
        actor: PricingCommittee
        preconditions: []
        side_effects:
          - "account.rate_source := SHEET; exception_request_id/exception_end_date/exception_rate_bp := null; recompute current_rate_bp from sheet tiers + bundle bonus (compensation: restores sheet-derived rate); bump account version"
      - from: APPLIED
        to: EXPIRED
        trigger: system (clock sweep when logical today > exception_end_date)
        actor: system
        preconditions: []
        side_effects:
          - "account.rate_source := SHEET; exception fields cleared; recompute current_rate_bp; bump account version"
          - "if the rate drops by >= 10 bp, create account-level RATE_CHANGE_ADVERSE notice (required_by = today + 5)"
      - from: APPROVED
        to: EXPIRED
        trigger: system (clock sweep when logical today > decided date + 30 days without apply)
        actor: system
        preconditions: []
        side_effects: []

  - entity: DepositAccount
    initial_state: OPEN (lifecycle) / SHEET (rate_source)
    terminal_states: [CLOSED (lifecycle)]
    note: "Two parallel state dimensions: lifecycle (OPEN | FROZEN | CLOSED) and rate_source (SHEET | PROMO | EXCEPTION | GRANDFATHERED) evolve independently on the same row."
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /deposit-accounts/{id}/actions { action: FREEZE }"
        actor: BranchBanker
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: OPEN
        trigger: "POST /deposit-accounts/{id}/actions { action: UNFREEZE }"
        actor: BranchBanker
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /deposit-accounts/{id}/actions { action: CLOSE }"
        actor: BranchBanker
        preconditions: []
        side_effects: ["final interest posting is NOT automatic; account excluded from combined_relationship_balance"]
      - from: FROZEN
        to: CLOSED
        trigger: "POST /deposit-accounts/{id}/actions { action: CLOSE }"
        actor: BranchBanker
        preconditions: []
        side_effects: []
      - from: SHEET (rate_source)
        to: PROMO (rate_source)
        trigger: "POST /deposit-accounts/{id}/actions { action: ENROLL_PROMO, promo_offer_id }"
        actor: BranchBanker
        preconditions:
          - "lifecycle = OPEN (ERR_ACCOUNT_INVALID_STATE)"
          - "product.allows_promos = true (ERR_INVALID_REQUEST)"
          - "offer status = ACTIVE and enrollment_start <= logical today <= enrollment_end (ERR_PROMO_NOT_ENROLLABLE)"
          - "offer.product_id == account.product_id and offer.market_code == account.market_code (ERR_PROMO_NOT_ENROLLABLE)"
          - "balance_cents >= offer.min_opening_balance_cents (ERR_PROMO_MIN_BALANCE_UNMET)"
        side_effects:
          - "rate_source := PROMO; promo_offer_id set; promo_end_date := today + offer.promo_term_days; recompute current_rate_bp; bump version"
      - from: PROMO (rate_source)
        to: SHEET (rate_source)
        trigger: system (clock sweep when logical today > promo_end_date)
        actor: system
        preconditions: []
        side_effects:
          - "rollover per offer.rollover_treatment: RENEW_THEN_SHEET with offer still ACTIVE -> promo_end_date += promo_term_days (stays PROMO, no transition); otherwise rate_source := SHEET, promo fields cleared, recompute current_rate_bp, bump version"
          - "if the rate drops by >= 10 bp on rollover, create account-level RATE_CHANGE_ADVERSE notice (required_by = today + 5)"
      - from: SHEET (rate_source)
        to: GRANDFATHERED (rate_source)
        trigger: system (activation cascade, term product account on superseded sheet)
        actor: system
        preconditions: []
        side_effects: ["rate frozen; sheet_id unchanged"]
      - from: GRANDFATHERED (rate_source)
        to: SHEET (rate_source)
        trigger: "POST /migration-batches/{id}/execution { action: EXECUTE }"
        actor: OperationsAdmin
        preconditions: ["lifecycle != CLOSED (CLOSED accounts are skipped, counted in skipped_count)"]
        side_effects:
          - "sheet_id := batch.target_sheet_id; recompute base_rate_bp/current_rate_bp; bump version"
          - "if the rate drops by >= 10 bp, create account-level RATE_CHANGE_ADVERSE notice (required_by = today + 5)"

  - entity: CompetitorRateScan
    initial_state: SUBMITTED
    terminal_states: [ACTIONED]
    transitions:
      - from: SUBMITTED
        to: ANALYZED
        trigger: POST /competitor-rate-scans/{id}/analyze
        actor: PricingAnalyst
        preconditions: []
        side_effects: ["compute and store benchmark_weighted_bp and benchmark_simple_bp per competitor_market_benchmark"]
      - from: ANALYZED
        to: ACTIONED
        trigger: system (activation of a RateSheet whose source_scan_id == this scan)
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerBundleEnrollment
    initial_state: ENROLLED
    terminal_states: [EXITED]
    transitions:
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /bundle-enrollments/{id}/transition { action: SUSPEND }"
        actor: OperationsAdmin
        preconditions: []
        side_effects: ["all OPEN accounts with customer_ref = this customer and product class in bundle.eligible_product_classes: bundle_bonus_bp := 0, recompute current_rate_bp, bump version"]
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /bundle-enrollments/{id}/transition { action: REINSTATE }"
        actor: OperationsAdmin
        preconditions: []
        side_effects: ["recompute qualifying_balance_cents; if >= bundle.min_combined_balance_cents, re-apply bonus to eligible OPEN accounts (recompute current_rate_bp, bump versions); else bonus stays 0"]
      - from: ENROLLED
        to: EXITED
        trigger: "POST /bundle-enrollments/{id}/transition { action: EXIT }"
        actor: OperationsAdmin
        preconditions: []
        side_effects: ["bonus removed from eligible OPEN accounts (recompute, bump versions)"]
      - from: SUSPENDED
        to: EXITED
        trigger: "POST /bundle-enrollments/{id}/transition { action: EXIT }"
        actor: OperationsAdmin
        preconditions: []
        side_effects: []

  - entity: DisclosureNotice
    initial_state: PENDING
    terminal_states: [SENT, WAIVED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /disclosure-notices/{id}/resolution { action: SEND }"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["sent_at := now; is_late := (sent date > required_by_date)"]
      - from: PENDING
        to: WAIVED
        trigger: "POST /disclosure-notices/{id}/resolution { action: WAIVE }"
        actor: ComplianceOfficer
        preconditions: ["reason required (ERR_INVALID_REQUEST)"]
        side_effects: []

  - entity: RateDeployment
    initial_state: PENDING
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING
        to: DEPLOYED
        trigger: "POST /rate-deployments/{id}/execution { action: DEPLOY }"
        actor: ChannelOperator
        preconditions: []
        side_effects: ["deployed_at := now"]
      - from: PENDING
        to: FAILED
        trigger: "POST /rate-deployments/{id}/execution { action: MARK_FAILED }"
        actor: ChannelOperator
        preconditions: []
        side_effects: []
      - from: FAILED
        to: DEPLOYED
        trigger: "POST /rate-deployments/{id}/execution { action: DEPLOY }"
        actor: ChannelOperator
        preconditions: []
        side_effects: ["deployed_at := now"]
      - from: DEPLOYED
        to: RETIRED
        trigger: system (supersession of the parent sheet)
        actor: system
        preconditions: []
        side_effects: []

  - entity: MigrationBatch
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /migration-batches/{id}/execution { action: EXECUTE }"
        actor: OperationsAdmin
        preconditions:
          - "source sheet status = SUPERSEDED (ERR_MIGRATION_INVALID_STATE)"
          - "target sheet status = EFFECTIVE (ERR_MIGRATION_TARGET_NOT_EFFECTIVE)"
          - "source and target sheets share product_id and market_code (ERR_INVALID_REQUEST)"
        side_effects:
          - "CASCADE link 1: every DepositAccount with sheet_id == source_sheet_id and rate_source = GRANDFATHERED and lifecycle != CLOSED: rate_source := SHEET, sheet_id := target, recompute rates, bump version; CLOSED accounts counted in skipped_count"
          - "CASCADE link 2: each migrated account whose rate drops >= 10 bp gets a RATE_CHANGE_ADVERSE notice (required_by = today + 5)"
          - "CASCADE link 2b: if no GRANDFATHERED accounts remain on the source sheet afterwards, source sheet -> RETIRED"
          - "migrated_count set"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /migration-batches/{id}/execution { action: ABORT }"
        actor: OperationsAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: sheet-patch-stale-version
    parent_entity: RateSheet
    write_endpoint: "PATCH /rate-sheets/{id}"
    occ_field: expected_sheet_version
    description: |
      Editing a DRAFT sheet whose version has advanced since the client last
      observed it is rejected. Both edits are legitimate writes under product
      semantics, so the stale writer is detected via expected_sheet_version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: account-adjust-stale-version
    parent_entity: DepositAccount
    write_endpoint: "PATCH /deposit-accounts/{id}"
    occ_field: expected_account_version
    description: |
      Adjusting an account balance with an expected_account_version older than
      the account's current version is rejected. Cascade-driven repricing (sheet
      activation, migration, bundle changes) bumps the account version, so a
      client holding a pre-cascade version is stale even though a balance
      adjustment itself remains a legitimate write.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: tiered_balance_rate
    description: "Rate in bp for a balance against a tier set"
    trigger: "account open, balance PATCH, sheet activation re-pointing, migration, exception resubmit/apply/expiry, rate-quote read"
    algorithm: tiered_pricing
    formula: |
      Tiers are half-open: [lower_bound_cents, upper_bound_cents); the last tier has
      upper_bound_cents = -1 (unbounded). Balance exactly at a boundary belongs to the
      tier whose lower_bound equals it.
      Variant MARGINAL: blended = round_half_up( sum over tiers of (slice_cents * rate_bp) / balance_cents )
        where slice_cents = balance_cents intersected with the tier range.
      Variant WHOLE_BALANCE: rate_bp of the single tier containing balance_cents.
      Zero balance -> 0 bp.
    input_set: "the account's current sheet tiers; account balance_cents"
    constants:
      UNBOUNDED_UPPER: -1
    precision: "integer bp, round_half_up (MARGINAL blend)"
    variants:
      - name: MARGINAL
        when: "product.tier_application = MARGINAL"
        difference: "each tier rate applies only to the balance slice inside it; result is the weighted blend"
      - name: WHOLE_BALANCE
        when: "product.tier_application = WHOLE_BALANCE"
        difference: "the rate of the tier containing the whole balance applies to the entire balance"

  - name: effective_account_rate
    description: "Stacked current rate on an account"
    trigger: "any change to sheet_id, balance_cents, rate_source, bundle enrollment, or exception state"
    algorithm: constraint_propagation
    formula: |
      Evaluate in this exact order:
        1. base: if rate_source = SHEET -> tiered_balance_rate(balance_cents, sheet tiers)
                 if rate_source = PROMO -> promo promo_rate_bp
                 if rate_source = EXCEPTION -> exception_rate_bp (approved requested rate)
                 if rate_source = GRANDFATHERED -> frozen current_rate_bp (no recompute)
        2. bundle bonus: bonus_bp from CustomerBundleEnrollment only when
           rate_source = SHEET AND an enrollment for account.customer_ref exists with
           status = ENROLLED AND enrollment.qualifying_balance_cents >= bundle.min_combined_balance_cents
           AND account product_class in bundle.eligible_product_classes; else 0.
           Bonus NEVER stacks on PROMO or EXCEPTION rates.
        3. effective = min(product.rate_cap_bp, base + bonus)
      base_rate_bp, bundle_bonus_bp, current_rate_bp are stored on the account.
    input_set: "account row, its sheet tiers, its product, its customer's ENROLLED enrollments"
    constants: {}
    precision: "integer bp"
    variants: []

  - name: combined_relationship_balance
    description: "Customer's qualifying combined balance for bundle qualification"
    trigger: "bundle enrollment create, REINSTATE, account open/close, balance PATCH of an enrolled customer's account"
    algorithm: aggregation
    formula: |
      combined = sum of balance_cents over DepositAccount rows where
        customer_ref = customer AND lifecycle = OPEN
        AND product.product_class in bundle.required_product_classes.
      EXCLUDES unposted accrued interest (uses posted balance_cents only) and CLOSED accounts.
      Evaluation-order pin (breaks the apparent circle rate <- bonus <- combined balance <-
      this account <- accrual <- rate): combined_relationship_balance uses balance_cents
      ONLY; unposted_accrual_milli and posted_interest_cents never feed it.
    input_set: "OPEN accounts of the customer in the bundle's required_product_classes"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: interest_posting
    description: "Daily accrual (clock sweep) plus periodic posting to an account"
    trigger: "daily accrual: POST /_clock/set_current_utc sweep per elapsed day; posting: POST /deposit-accounts/{id}/interest-postings"
    algorithm: chronological
    formula: |
      DAILY ACCRUAL (clock sweep, per elapsed day, per account with lifecycle != CLOSED):
        daily_milli = floor( balance_cents * current_rate_bp / 3650 )   # milli-cents, exact per-day floor
        unposted_accrual_milli += daily_milli
      Balance/rate changes mid-period apply from the day they take effect (chronological:
      the sweep processes day by day in date order).
      POSTING (sum-then-round — PINNED ORDER):
        posted_delta_cents = round_half_up( unposted_accrual_milli / 1000 )
        posted_interest_cents += posted_delta_cents
        unposted_accrual_milli := 0; last_accrual_date := logical today
      Posting with unposted_accrual_milli = 0 is a no-op (posted_delta 0).
      Posting on a CLOSED account -> ERR_ACCOUNT_INVALID_STATE.
    input_set: "the single account; logical clock"
    constants:
      DAYS_IN_YEAR: 365
      BP_DENOMINATOR: 10000
    precision: "per-day floor to integer milli-cents; round_half_up to integer cents exactly once at posting"
    variants:
      - name: daily_round_then_sum_REJECTED
        when: "never applied by the server — the rejected alternative reading"
        difference: "rounding each day's accrual to CENTS before summing yields a different posted total (e.g. 3,410 vs 3,397 cents for balance 1,000,069 at 400 bp over 31 days); the scaffold pins sum-then-round"

  - name: competitor_market_benchmark
    description: "Benchmark competitor rate for a product class in a market"
    trigger: "POST /competitor-rate-scans/{id}/analyze"
    algorithm: weighted_scoring
    formula: |
      Input set: entries where product_class = the requested analysis class (analyze runs
      per product class present; benchmarks stored for the class with the largest total
      tier_balance_cents; ties broken by product_class in enum order CD | INTEREST_CHECKING |
      MONEY_MARKET | SAVINGS (deterministic, never id-based)).
      BALANCE_WEIGHTED (official, stored as benchmark_weighted_bp):
        round_half_up( sum(rate_bp * tier_balance_cents) / sum(tier_balance_cents) )
      SIMPLE_AVERAGE (stored as benchmark_simple_bp):
        round_half_up( sum(rate_bp) / count(entries) )
      Empty matching entry set -> both fields null.
    input_set: "scan entries of the dominant product_class in the scan"
    constants: {}
    precision: "integer bp, round_half_up"
    variants:
      - name: BALANCE_WEIGHTED
        when: "official benchmark used by the committee"
        difference: "weights each competitor rate by its tier balance"
      - name: SIMPLE_AVERAGE
        when: "computed alongside for reference"
        difference: "unweighted mean; diverges from weighted whenever balances are unequal"

  - name: sheet_margin_analysis
    description: "Margin of a sheet over cost of funds, in bp"
    trigger: "GET /rate-sheets/{id}/margin-analysis; submit gate uses FORWARD_LOOKING"
    algorithm: forward_looking
    formula: |
      Evaluation order is pinned (1) rate, (2) funding, (3) margin:
        weighted_rate_bp = round_half_up( sum(tier.rate_bp * tier.projected_balance_cents)
                                          / sum(tier.projected_balance_cents) )   [FORWARD_LOOKING]
        funding_cost_bp  = funding_cost_at_term(product.term_months)
        margin_bp        = weighted_rate_bp - funding_cost_bp
    input_set: "FORWARD_LOOKING: the sheet's own tiers and projected balances. REALIZED_BOOK: OPEN DepositAccounts of this product+market with rate_source in {SHEET, PROMO, EXCEPTION}, weighted by balance_cents at current_rate_bp"
    constants: {}
    precision: "integer bp, round_half_up per step"
    variants:
      - name: FORWARD_LOOKING
        when: "submit gate and default variant"
        difference: "uses projected tier balances on the sheet; computable with zero accounts"
      - name: REALIZED_BOOK
        when: "variant=REALIZED_BOOK requested"
        difference: "uses actual OPEN account balances at current rates; requires >= 1 matching account else ERR_MARGIN_NOT_COMPUTABLE"

  - name: funding_cost_at_term
    description: "Cost of funds in bp for a product term from the operative FundingCurve"
    trigger: "inside sheet_margin_analysis"
    algorithm: threshold
    formula: |
      Curve = latest FundingCurve with curve_date <= logical today; none -> ERR_NO_FUNDING_CURVE.
      tenor = product.term_months.
      Exact tenor match on a point -> that point's cost_bp (no interpolation).
      Otherwise linear interpolation between the bracketing points, round_half_up to integer bp.
      tenor beyond the maximum point (or no curve) -> ERR_NO_FUNDING_CURVE.
    input_set: "the operative FundingCurve's points"
    constants: {}
    precision: "integer bp, round_half_up"
    variants: []

  - name: repricing_cadence_status
    description: "Whether a (product, market) pair is within its repricing cadence"
    trigger: "GET /repricing-cycles (computed on read)"
    algorithm: threshold
    formula: |
      next_review_due = last_reviewed_at + cadence_days (null when never activated).
      status = OVERDUE when last_reviewed_at is not null AND logical today >= next_review_due
      (the due date itself is already OVERDUE — inclusive boundary); else CURRENT.
    input_set: "RepricingCycle row, logical clock"
    constants: {}
    precision: "date granularity"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Required fields present, types and enum values valid, dates ISO (schema)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path resource id exists", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all pathed endpoints" }
  - { priority: 5, category: existence, check: "Body FK references exist: product_id (ERR_PRODUCT_NOT_FOUND), sheet_id (ERR_SHEET_NOT_FOUND), account_id (ERR_ACCOUNT_NOT_FOUND), promo_offer_id (ERR_PROMO_NOT_FOUND), bundle_id (ERR_BUNDLE_NOT_FOUND)", error_id: ERR_PRODUCT_NOT_FOUND, http_status: 422, applies_to: "endpoints with body FKs" }
  - { priority: 6, category: state, check: "Target resource in a valid from-state for the transition (per machine: ERR_SHEET_INVALID_STATE, ERR_PROMO_INVALID_STATE, ERR_EXCEPTION_INVALID_STATE, ERR_ACCOUNT_INVALID_STATE, ERR_MIGRATION_INVALID_STATE, ERR_ENROLLMENT_INVALID_STATE, ERR_SCAN_INVALID_STATE, ERR_DEPLOYMENT_INVALID_STATE, ERR_NOTICE_ALREADY_RESOLVED)", error_id: ERR_SHEET_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /rate-sheets/{id}, PATCH /deposit-accounts/{id}" }
  - { priority: 8, category: business_safety, check: "Activate gate 1: every PRE_CHANGE DisclosureNotice for the sheet is SENT with is_late=false, or WAIVED", error_id: ERR_DISCLOSURE_LEAD_TIME_UNMET, http_status: 409, applies_to: "POST /rate-sheets/{id}/activate" }
  - { priority: 9, category: business_safety, check: "Activate gate 2: all 4 channel RateDeployment rows for the sheet are DEPLOYED", error_id: ERR_DEPLOYMENT_INCOMPLETE, http_status: 409, applies_to: "POST /rate-sheets/{id}/activate" }
  - { priority: 10, category: business_safety, check: "Segregation of duties: exception decision actor X-User-ID != submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /exception-pricing-requests/{id}/decision" }
  - { priority: 11, category: business_constraint, check: "At most one DRAFT sheet per (product_id, market_code)", error_id: ERR_DRAFT_SHEET_EXISTS, http_status: 409, applies_to: "POST /rate-sheets" }
  - { priority: 12, category: business_constraint, check: "Tier structure: contiguous from 0, ascending, no gaps/overlaps, last tier unbounded (upper = -1), tier_index 0..n-1", error_id: ERR_TIER_STRUCTURE_INVALID, http_status: 422, applies_to: "POST /rate-sheets, PATCH /rate-sheets/{id}" }
  - { priority: 13, category: business_constraint, check: "Every tier rate_bp <= product.rate_cap_bp; promo_rate_bp <= product.rate_cap_bp", error_id: ERR_RATE_CAP_EXCEEDED, http_status: 422, applies_to: "POST /rate-sheets, PATCH /rate-sheets/{id}, POST /promotional-offers" }
  - { priority: 14, category: business_constraint, check: "Sheet effective window (half-open) must not overlap any OTHER sheet for the same (product_id, market_code) in status SCHEDULED (unconditional); it may overlap the current EFFECTIVE sheet only when effective_date > current.effective_date (chronological succession — the incumbent is superseded and truncated at activation); adjacency (new effective_date == other end_date) is always allowed", error_id: ERR_EFFECTIVE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /rate-sheets/{id}/schedule" }
  - { priority: 15, category: business_constraint, check: "Promo closed enrollment window does not intersect SCHEDULED/ACTIVE offers for same product+market; touching boundary dates conflict", error_id: ERR_PROMO_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /promotional-offers/{id}/publish" }
  - { priority: 16, category: business_constraint, check: "Promo enrollment: offer ACTIVE, within window, product+market match, product.allows_promos", error_id: ERR_PROMO_NOT_ENROLLABLE, http_status: 422, applies_to: "POST /deposit-accounts/{id}/actions (ENROLL_PROMO)" }
  - { priority: 17, category: business_constraint, check: "Promo enrollment: balance_cents >= offer.min_opening_balance_cents", error_id: ERR_PROMO_MIN_BALANCE_UNMET, http_status: 422, applies_to: "POST /deposit-accounts/{id}/actions (ENROLL_PROMO)" }
  - { priority: 18, category: business_constraint, check: "Exception request: product.allows_exceptions = true", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /exception-pricing-requests" }
  - { priority: 19, category: business_constraint, check: "Exception request: justification_doc_ref present when computed authority_tier = COMMITTEE", error_id: ERR_EXCEPTION_DOCS_MISSING, http_status: 422, applies_to: "POST /exception-pricing-requests, POST /exception-pricing-requests/{id}/resubmit" }
  - { priority: 20, category: business_referential, check: "Baseline sheet status = EFFECTIVE (exception create/approve/apply)", error_id: ERR_BASELINE_SHEET_NOT_EFFECTIVE, http_status: 422, applies_to: "POST /exception-pricing-requests, .../decision, .../apply" }
  - { priority: 21, category: business_referential, check: "Migration target sheet EFFECTIVE", error_id: ERR_MIGRATION_TARGET_NOT_EFFECTIVE, http_status: 422, applies_to: "POST /migration-batches/{id}/execution" }
  - { priority: 22, category: business_referential, check: "Operative FundingCurve exists and covers the product tenor (margin gate, margin-analysis)", error_id: ERR_NO_FUNDING_CURVE, http_status: 422, applies_to: "POST /rate-sheets/{id}/submit, GET /rate-sheets/{id}/margin-analysis" }
  - { priority: 23, category: business_temporal, check: "Activate gate 3: logical today >= effective_date", error_id: ERR_FUTURE_EFFECTIVE_DATE, http_status: 409, applies_to: "POST /rate-sheets/{id}/activate" }
  - { priority: 24, category: business_fiscal, check: "Submit gate: margin_floor_bp > 0 requires sheet_margin_analysis(FORWARD_LOOKING) >= margin_floor_bp (boundary: equality passes)", error_id: ERR_MARGIN_BELOW_FLOOR, http_status: 422, applies_to: "POST /rate-sheets/{id}/submit" }
  - { priority: 25, category: business_fiscal, check: "Exception delta_bp <= 75 (delta computed against baseline snapshot)", error_id: ERR_EXCEPTION_DELTA_EXCEEDS_MAX, http_status: 422, applies_to: "POST /exception-pricing-requests, POST /exception-pricing-requests/{id}/resubmit" }
  - { priority: 26, category: business_fiscal, check: "Exception approval authority: COMMITTEE tier (26..75 bp) requires PricingCommittee; BRANCH tier (<= 25 bp) allows BranchBanker", error_id: ERR_EXCEPTION_AUTHORITY_INSUFFICIENT, http_status: 403, applies_to: "POST /exception-pricing-requests/{id}/decision" }

# =============================================================================
# Table 5: API Endpoint Table
