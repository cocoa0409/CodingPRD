            - call: "POST /ppa/allocations/${alloc_h_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/rounds/${round_h_id}/respond"
              payload: { response: "ACCEPT" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/deals/${deal_h_id}/submit-credit"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals/${deal_h_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/deals/${deal_h_id}/execute"
              payload: {}
              as: DealCommittee
              as_user_id: "u_committee_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2027, commercial_operation_deadline: "2027-12-31T00:00:00Z", settlement_frequency: "MONTHLY", base_fixed_price_usd_per_mwh: 42.50, escalation_pct_per_year: 2.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_m_id: $.data.id }
            - call: "POST /ppa/deals/${deal_m_id}/rounds"
              payload: { proposed_by: "DEVELOPER", proposed_fixed_price_usd_per_mwh: 42.50, proposed_escalation_pct_per_year: 2.0, proposed_shape_product: "AS_GENERATED", proposed_basis_responsibility: "SHARED", response_deadline: "2026-08-15T00:00:00Z" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { round_m_id: $.data.id }
            - call: "GET /ppa/deals/${deal_m_id}"
              as: Originator
              as_user_id: "u_orig_1"
              captures: { deal_m_v: $.data.version }
            - call: "POST /ppa/deals/${deal_m_id}/allocations"
              payload: { offtaker_id: "${buyer_id}", allocated_mw: 25.000, expected_deal_version: "${deal_m_v}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { alloc_m_id: $.data.id }
            - call: "POST /ppa/allocations/${alloc_m_id}/decision"
              payload: { decision: "CONFIRM" }
              as: OfftakerRep
              as_user_id: "${buyer_id}"
            - call: "POST /ppa/rounds/${round_m_id}/respond"
              payload: { response: "ACCEPT" }
              as: OfftakerRep
