      - name: wrong_source_state_transitions_are_rejected_across_eleven_machines
        claim_type: invalid_transition
        grounds:
          - validations[priority 70]
          - errors[ERR_VENUE_INVALID_STATE]
          - errors[ERR_AGREEMENT_INVALID_STATE]
          - errors[ERR_SUBMISSION_INVALID_STATE]
          - errors[ERR_RUN_INVALID_STATE]
          - errors[ERR_SLOT_INVALID_STATE]
          - errors[ERR_ORDER_INVALID_STATE]
          - errors[ERR_STAFF_INVALID_STATE]
          - errors[ERR_SHIFT_INVALID_STATE]
          - errors[ERR_INSPECTION_INVALID_STATE]
          - errors[ERR_KIT_INVALID_STATE]
          - errors[ERR_STATEMENT_INVALID_STATE]
        distinguishing_aspect: |
          One transition attempted from a wrong source state on each of the eleven machines that
          own an *_INVALID_STATE identifier, all at priority 70. Two of the probes are the ones an
          implementation is most likely to mis-map: expiring a DRAFT agreement must report the
          state error rather than the P105 clock error ERR_TERM_NOT_ENDED even though the term has
          also not ended, and refurbishing a DEPLOYED kit must report ERR_KIT_INVALID_STATE rather
          than the P80 gate ERR_KIT_NOT_READY. Every probe must leave its row's version untouched.
