      - name: verify_allergy_conflict_violation
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ALLERGY_CONFLICT]"]
        distinguishing_aspect: "Plain safety violation (no competing higher-priority violation): patient allergic to the ordered drug -> verify returns ERR_ALLERGY_CONFLICT (422) and the order stays PENDING."
        test_recipe:
          setup: ["Patient allergic to drug D; order for D created"]
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr AL", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugAL", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat AL", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9, allergy_drug_product_ids: ["${drug_id}"] }
              as: PharmacyAdmin
