  # ---------------------------------------------------------- BallotRequest
  - method: POST
    path: "/vote-by-mail/ballot-requests"
    description: "Log a vote-by-mail ballot request for a voter and election; opens the address verification that gates mailing. Carries the OCC guard on Voter.version (§1.2.1 ballot-request-create-stale-voter)"
    roles: [ElectionsClerk]
    code: 201
    input: [voter_id, election_id, request_channel, delivery_method, expected_voter_version, "permanent_flag?"]
    output: BallotRequest
    side_effects:
      - "creates the BallotRequest in RECEIVED with forwarding_class = UNKNOWN"
      - "creates one AddressVerification in PENDING linked to this request"
      - "increments Voter.version by 1"
      - "any earlier BallotRequest by the same voter for the same election with status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED, APPROVED} transitions to SUPERSEDED; a QUEUED BallotPacket of that superseded request transitions to SPOILED"
      - "appends TransparencyLogEntry (event_type=REQUEST_LOGGED)"
  - method: GET
    path: "/vote-by-mail/ballot-requests/{id}"
    description: "Read one ballot request"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: BallotRequest
    side_effects: []
  - method: GET
    path: "/vote-by-mail/ballot-requests"
    description: "List ballot requests, optionally filtered by voter, election, or status"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["voter_id?", "election_id?", "status?", "limit?", "offset?"]
    output: BallotRequest[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/ballot-requests/{id}/approve"
    description: "Approve an address-cleared ballot request so it becomes packet-eligible"
    roles: [ElectionsClerk]
    code: 200
    input: []
    output: BallotRequest
    side_effects:
      - "status ADDRESS_CLEARED -> APPROVED"
      - "when permanent_flag == true and the voter has no ACTIVE/SUSPENDED enrollment, creates PermanentAbsenteeEnrollment in ACTIVE and sets Voter.permanent_absentee_active := true"
  - method: POST
    path: "/vote-by-mail/ballot-requests/{id}/reject"
    description: "Reject a ballot request"
    roles: [ElectionsClerk]
    code: 200
    input: [rejection_reason_code]
    output: BallotRequest
    side_effects:
      - "status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED} -> REJECTED and records rejection_reason_code"
      - "linked AddressVerification rows with status == PENDING become FAILED"
  - method: POST
    path: "/vote-by-mail/ballot-requests/{id}/address-recheck"
    description: "Re-open address verification for a request sitting in ADDRESS_HOLD"
    roles: [ElectionsClerk]
    code: 201
    input: []
    output: AddressVerification
    side_effects:
      - "creates a new AddressVerification in PENDING for this request; requires request.status == ADDRESS_HOLD"

  # ----------------------------------------------------- AddressVerification
  - method: GET
    path: "/vote-by-mail/address-verifications/{id}"
    description: "Read one address verification"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: AddressVerification
    side_effects: []
  - method: GET
    path: "/vote-by-mail/address-verifications"
    description: "List address verifications, optionally filtered by ballot request"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["ballot_request_id?", "status?", "limit?", "offset?"]
    output: AddressVerification[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/address-verifications/{id}/results"
    description: "Record the NCOA / forwarding result on a pending verification; drives the request's address branch and the enrollment-suspension cascade"
    roles: [ElectionsClerk]
    code: 200
    input: [ncoa_result, "verified_mailing_address?", "forwardable?"]
    output: AddressVerification
    side_effects:
      - "sets evaluated_at = logical clock now and resolves status to CLEARED or FAILED per ncoa_result"
      - "cascade link 1: linked BallotRequest moves to ADDRESS_CLEARED or ADDRESS_HOLD"
      - "cascade link 2: on a NON_FORWARDABLE hold, the voter's ACTIVE enrollment increments consecutive_undeliverable_count and suspends at PAE_SUSPENSION_THRESHOLD (2)"
      - "cascade link 3: on suspension, Voter.permanent_absentee_active := false and TransparencyLogEntry (event_type=ENROLLMENT_SUSPENDED) is appended"

  # ------------------------------------------------------------ MailingBatch
  - method: POST
    path: "/vote-by-mail/mailing-batches"
    description: "Open a mailing batch for an election; the statutory send-by date is derived from batch_type"
    roles: [ElectionsClerk]
    code: 201
    input: [election_id, batch_type, scheduled_send_date]
    output: MailingBatch
    side_effects:
      - "creates the batch in DRAFT with packet_count = 0 and estimated_postage_cents = 0"
      - "sets required_send_by_date = election.uocava_send_deadline_date when batch_type == UOCAVA, else election.domestic_send_deadline_date"
  - method: GET
    path: "/vote-by-mail/mailing-batches/{id}"
    description: "Read one mailing batch including frozen and actual postage"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: MailingBatch
    side_effects: []
  - method: GET
    path: "/vote-by-mail/mailing-batches"
    description: "List mailing batches, optionally filtered by election"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["election_id?", "status?", "batch_type?", "limit?", "offset?"]
    output: MailingBatch[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/mailing-batches/{id}/packets"
    description: "Add a ballot packet for an approved request to a DRAFT batch"
    roles: [ElectionsClerk]
    code: 201
    input: [ballot_request_id, packet_weight_grams]
    output: BallotPacket
    side_effects:
      - "creates the packet in QUEUED with batch_sequence = batch.packet_count + 1 and packet_serial derived from batch_sequence"
      - "writes packet_postage_cents via calculations.postage_assessment per-packet rounding"
      - "increments MailingBatch.packet_count by 1"
  - method: POST
    path: "/vote-by-mail/mailing-batches/{id}/seal"
    description: "Seal a DRAFT batch, freezing the ESTIMATED postage variant and committing it against the election's postage budget"
    roles: [ElectionsClerk]
    code: 200
    input: []
    output: MailingBatch
    side_effects:
      - "status DRAFT -> SEALED and sealed_at = logical clock now"
      - "writes estimated_postage_cents via calculations.postage_assessment variant ESTIMATED over packets with status == QUEUED at this instant"
      - "adds estimated_postage_cents to Election.postage_committed_cents (ERR_POSTAGE_BUDGET_EXCEEDED when the running commitment would exceed postage_budget_cents)"
  - method: POST
    path: "/vote-by-mail/mailing-batches/{id}/dispatch"
    description: "Dispatch a SEALED batch: mails every still-QUEUED packet, computes the ACTUAL postage variant, and drives the depth-3 mailing cascade"
    roles: [ElectionsClerk]
    code: 200
    input: []
    output: MailingBatch
    side_effects:
      - "status SEALED -> DISPATCHED and dispatched_at = logical clock now"
      - "writes actual_postage_cents via calculations.postage_assessment variant ACTUAL and adds it to Election.postage_actual_cents"
      - "cascade link 1: every BallotPacket with status == QUEUED transitions to MAILED with mailed_at set"
      - "cascade link 2: each mailed packet's BallotRequest transitions APPROVED -> MAILED"
      - "cascade link 3: Election.packets_mailed_count / outstanding_packet_count recomputed and Election auto-advances PRE_MAIL -> MAILING"
  - method: POST
    path: "/vote-by-mail/mailing-batches/{id}/cancel"
    description: "Cancel a DRAFT or SEALED batch, releasing any postage commitment it holds (compensating action for seal)"
    roles: [ElectionsClerk]
    code: 200
    input: [cancellation_reason_code]
    output: MailingBatch
    side_effects:
      - "status IN {DRAFT, SEALED} -> CANCELLED"
      - "when the batch was SEALED, subtracts its frozen estimated_postage_cents from Election.postage_committed_cents (conservation invariant calculations.postage_commitment_conservation)"
      - "every BallotPacket with status == QUEUED transitions to SPOILED"

  # ------------------------------------------------------------- BallotPacket
  - method: GET
    path: "/vote-by-mail/ballot-packets/{id}"
    description: "Read one ballot packet"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: BallotPacket
    side_effects: []
  - method: GET
    path: "/vote-by-mail/ballot-packets"
    description: "List ballot packets, optionally filtered by batch or request"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["mailing_batch_id?", "ballot_request_id?", "status?", "limit?", "offset?"]
    output: BallotPacket[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/ballot-packets/{id}/undeliverable"
    description: "Record a mailed packet returned by the carrier as undeliverable"
    roles: [ElectionsClerk]
    code: 200
    input: [undeliverable_reason_code]
    output: BallotPacket
    side_effects:
      - "status MAILED -> UNDELIVERABLE and records undeliverable_reason_code"
      - "recomputes Election.undeliverable_packet_count and outstanding_packet_count"
      - "the voter's ACTIVE enrollment increments consecutive_undeliverable_count and suspends at PAE_SUSPENSION_THRESHOLD (2), clearing Voter.permanent_absentee_active"

  # ------------------------------------------------------------ ReturnEnvelope
  - method: POST
    path: "/vote-by-mail/return-envelopes"
    description: "Log receipt of a returned ballot envelope against its mailed packet; writes the PRELIMINARY timeliness variant"
    roles: [ElectionsClerk]
    code: 201
    input: [ballot_packet_id, intake_channel, "postmark_date?", "postmark_legible?"]
    output: ReturnEnvelope
    side_effects:
      - "creates the envelope with signature_status = UNVERIFIED, custody_status = SEALED, challenge_status = NONE and received_at = logical clock now"
      - "writes preliminary_timeliness via calculations.envelope_timeliness variant PRELIMINARY"
      - "recomputes Election.envelopes_received_count / returned_packet_count / outstanding_packet_count"
      - "Election auto-advances MAILING -> RECEIVING on the first intake"
      - "appends TransparencyLogEntry (event_type=ENVELOPE_INTAKE)"
      - "rejected with ERR_ELECTION_POSTURE_FORBIDS once the election posture reaches CANVASS_LOCKED"
  - method: GET
    path: "/vote-by-mail/return-envelopes/{id}"
    description: "Read one return envelope with all three state dimensions and both timeliness variants"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, SignatureReviewer]
    code: 200
    input: []
    output: ReturnEnvelope
    side_effects: []
  - method: GET
    path: "/vote-by-mail/return-envelopes"
    description: "List return envelopes, optionally filtered by packet, remake lineage, or any state dimension"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, SignatureReviewer]
    code: 200
    input: ["ballot_packet_id?", "remade_from_envelope_id?", "signature_status?", "custody_status?", "challenge_status?", "limit?", "offset?"]
    output: ReturnEnvelope[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/return-envelopes/{id}/signature-reviews"
    description: "Open the next signature review round on an envelope; the reviewer is chosen by the server selector policy, never supplied by the client"
    roles: [ElectionsClerk]
    code: 201
    input: []
    output: SignatureReview
    side_effects:
      - "creates a SignatureReview in ASSIGNED with review_round = envelope.review_round_count + 1"
      - "reviewer_id is chosen by calculations.reviewer_assignment_selection (ERR_NO_ELIGIBLE_REVIEWER when the candidate set is empty)"
      - "increments Reviewer.active_review_count by 1"
      - "envelope signature_status UNVERIFIED -> PENDING_REVIEW, or ESCALATED -> PENDING_REVIEW for rounds >= 2"
  - method: POST
    path: "/vote-by-mail/return-envelopes/{id}/cure-notices"
    description: "Issue a cure notice for an envelope whose signature is missing or mismatched; freezes the propagated cure deadline"
    roles: [ElectionsClerk]
    code: 201
    input: []
    output: CureNotice
    side_effects:
      - "creates the notice in ISSUED with reason_code copied from the dispositive review outcome and issued_at = logical clock now"
      - "writes cure_deadline_at, canvass_days_at_issue and open_cure_count_at_issue via calculations.cure_deadline_derivation"
      - "increments Election.open_cure_count and may extend Election.canvass_days / canvass_lock_at through the propagation chain"
      - "appends TransparencyLogEntry (event_type=CURE_ISSUED)"
  - method: POST
    path: "/vote-by-mail/return-envelopes/{id}/remakes"
    description: "Open a bipartisan two-person remake session for a damaged or duplicate ballot. Carries the OCC guard on ReturnEnvelope.version (§1.2.1 remake-create-stale-envelope)"
    roles: [CanvassSupervisor]
    code: 201
    input: [team_member_a_reviewer_id, team_member_b_reviewer_id, reason_code, session_start_at, session_end_at, expected_envelope_version, "remade_serial?"]
    output: RemakeRecord
    side_effects:
      - "creates the RemakeRecord in OPEN"
      - "increments ReturnEnvelope.version by 1"
      - "requires the two team members to hold different party_affiliation values (ERR_REMAKE_TEAM_NOT_BIPARTISAN) and neither to have reviewed this envelope (ERR_SEGREGATION_OF_DUTIES)"
      - "closed-interval double-booking check with REMAKE_CHANGEOVER_BUFFER_MINUTES (15) applies to both members (ERR_REMAKE_TEAM_DOUBLE_BOOKED)"
  - method: POST
    path: "/vote-by-mail/return-envelopes/{id}/challenges"
    description: "File an observer challenge against a return envelope"
    roles: [Observer]
    code: 200
    input: [challenge_reason_code]
    output: ReturnEnvelope
    side_effects:
      - "challenge_status NONE -> CHALLENGED and custody_status SEALED -> SEQUESTERED"
      - "requires a CHECKED_IN ObserverAccessSession whose half-open window contains now and whose station_area IN {INTAKE, SIGNATURE_REVIEW} (ERR_OBSERVER_SESSION_REQUIRED)"
      - "appends TransparencyLogEntry (event_type=CHALLENGE_FILED, actor_role=Observer)"
  - method: POST
    path: "/vote-by-mail/return-envelopes/{id}/challenge-adjudication"
    description: "Adjudicate a filed challenge; sustaining it refers the voter to the provisional process, overruling it returns the envelope to the countable pool when nothing else disqualifies it"
    roles: [CanvassSupervisor]
    code: 200
    input: [outcome, challenge_findings]
    output: ReturnEnvelope
    side_effects:
      - "challenge_status CHALLENGED -> SUSTAINED or OVERRULED and records challenge_findings"
      - "on SUSTAIN: envelope stays SEQUESTERED, Voter.provisional_ballot_eligible := true, Election.provisional_referral_count incremented, TransparencyLogEntry (event_type=PROVISIONAL_REFERRAL) appended"
      - "on OVERRULE: custody_status SEQUESTERED -> SEALED only when signature_status == ACCEPTED and final_timeliness != UNTIMELY"
      - "appends TransparencyLogEntry (event_type=CHALLENGE_ADJUDICATED)"
  - method: POST
    path: "/vote-by-mail/return-envelopes/{id}/count"
    description: "Record tabulation of a separated ballot"
    roles: [CanvassSupervisor]
    code: 200
    input: []
    output: ReturnEnvelope
    side_effects:
      - "custody_status SEPARATED -> COUNTED"
      - "recomputes Election.countable_envelope_count and attributable_ballot_count"

  # ----------------------------------------------------- Election / separation
  - method: POST
    path: "/vote-by-mail/elections/{id}/separation-runs"
    description: "Separate a batch of signature-accepted envelopes from their ballots, preserving ballot secrecy by requiring a minimum pool size"
    roles: [CanvassSupervisor]
    code: 200
    input: [return_envelope_ids]
    output: "{ election_id: string, run_sequence: integer, separated_count: integer, secrecy_pool_size: integer, countable_envelope_count: integer, attributable_ballot_count: integer }"
    side_effects:
      - "increments Election.separation_run_sequence by 1 and stamps it on every separated envelope"
      - "each listed envelope moves custody_status SEALED -> SEPARATED; requires signature_status == ACCEPTED, challenge_status != CHALLENGED and final_timeliness != UNTIMELY"
      - "rejects an empty list with ERR_SEPARATION_SET_EMPTY and a pool below BALLOT_SECRECY_MIN_POOL (3) with ERR_BALLOT_SECRECY_POOL_TOO_SMALL"
      - "appends TransparencyLogEntry (event_type=SEPARATION_RUN, ballot_content_disclosed=false)"

  # ----------------------------------------------------------- SignatureReview
  - method: GET
    path: "/vote-by-mail/signature-reviews/{id}"
    description: "Read one signature review"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, SignatureReviewer]
    code: 200
    input: []
    output: SignatureReview
    side_effects: []
  - method: GET
    path: "/vote-by-mail/signature-reviews"
    description: "List signature reviews, optionally filtered by envelope or reviewer"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, SignatureReviewer]
    code: 200
    input: ["return_envelope_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: SignatureReview[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/signature-reviews/{id}/decision"
    description: "Submit the assigned reviewer's signature comparison decision; scores confidence and resolves or escalates the envelope"
    roles: [SignatureReviewer]
    code: 200
    input: [decision, "similarity_score?", "notes?"]
    output: SignatureReview
    side_effects:
      - "status ASSIGNED -> SUBMITTED with submitted_at = logical clock now"
      - "writes confidence_score via calculations.signature_confidence_score"
      - "decrements Reviewer.active_review_count and increments Reviewer.completed_review_count"
      - "increments ReturnEnvelope.review_round_count and applies calculations.escalation_quorum_resolution to move signature_status to ACCEPTED, ESCALATED, CURE_REQUIRED or REJECTED"
      - "on a REJECT outcome the envelope also moves custody_status SEALED -> SEQUESTERED"
      - "requires the acting X-User-ID to equal the assigned reviewer_id (ERR_NOT_ASSIGNED_REVIEWER) and that reviewer's training to be valid at now (ERR_REVIEWER_TRAINING_INVALID)"
      - "appends TransparencyLogEntry (event_type=SIGNATURE_DECISION, and SIGNATURE_ESCALATION when the envelope escalates)"

  # ---------------------------------------------------------------- CureNotice
  - method: GET
    path: "/vote-by-mail/cure-notices/{id}"
    description: "Read one cure notice including its frozen deadline"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: CureNotice
    side_effects: []
  - method: GET
    path: "/vote-by-mail/cure-notices"
    description: "List cure notices, optionally filtered by envelope"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["return_envelope_id?", "status?", "limit?", "offset?"]
    output: CureNotice[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/cure-notices/{id}/evidence"
    description: "Log a voter's cure evidence submission against an open notice"
    roles: [ElectionsClerk]
    code: 201
    input: [evidence_type, submission_channel, affirmation_signed]
    output: CureEvidence
    side_effects:
      - "creates the immutable CureEvidence row with received_at = logical clock now"
      - "notice status ISSUED -> UNDER_EVIDENCE_REVIEW and evidence_submission_count incremented"
      - "rejected with ERR_CURE_DEADLINE_PASSED when cure_deadline_at <= now"
  - method: POST
    path: "/vote-by-mail/cure-notices/{id}/adjudicate"
    description: "Adjudicate submitted cure evidence: CURE closes the notice and accepts the envelope, DEFICIENT sends the notice back to ISSUED for another attempt"
    roles: [CanvassSupervisor]
    code: 200
    input: [outcome, "deficiency_reason_code?"]
    output: CureNotice
    side_effects:
      - "on CURE: status UNDER_EVIDENCE_REVIEW -> CURED, resolved_at set, latest CureEvidence.accepted := true, envelope signature_status CURE_REQUIRED -> ACCEPTED, Election.open_cure_count decremented"
      - "on DEFICIENT: status returns to ISSUED, deficiency_count incremented, latest CureEvidence.accepted := false with deficiency_reason_code recorded, cure_deadline_at unchanged"
      - "appends TransparencyLogEntry (event_type=CURE_ADJUDICATED)"
  - method: GET
    path: "/vote-by-mail/cure-evidence/{id}"
    description: "Read one cure evidence submission (immutable record)"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: CureEvidence
    side_effects: []
  - method: GET
    path: "/vote-by-mail/cure-evidence"
    description: "List cure evidence submissions, optionally filtered by notice"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["cure_notice_id?", "limit?", "offset?"]
    output: CureEvidence[]
    side_effects: []

  # -------------------------------------------------------------- RemakeRecord
  - method: GET
    path: "/vote-by-mail/remake-records/{id}"
    description: "Read one remake record including its replacement envelope link"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: []
    output: RemakeRecord
    side_effects: []
  - method: GET
    path: "/vote-by-mail/remake-records"
    description: "List remake records, optionally filtered by original envelope, replacement envelope, or team member"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor]
    code: 200
    input: ["original_envelope_id?", "remade_envelope_id?", "team_member_a_reviewer_id?", "team_member_b_reviewer_id?", "status?", "limit?", "offset?"]
    output: RemakeRecord[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/remake-records/{id}/complete"
    description: "Complete a remake session: mints the replacement envelope and supersedes the original"
    roles: [CanvassSupervisor]
    code: 200
    input: [remade_serial]
    output: RemakeRecord
    side_effects:
      - "status OPEN -> COMPLETED with completed_at = logical clock now"
      - "creates the replacement ReturnEnvelope with remade_from_envelope_id = original_envelope_id, inheriting postmark_date, postmark_legible, received_at and both timeliness variants, and writes remade_envelope_id"
      - "original envelope custody_status SEALED|SEQUESTERED -> SUPERSEDED_BY_REMAKE; its ASSIGNED SignatureReview rows become VOIDED and its ISSUED CureNotice becomes WITHDRAWN (Election.open_cure_count decremented)"
      - "recomputes Election.attributable_ballot_count so the conservation invariant calculations.ballot_countability_conservation holds"
      - "rejects a duplicate remade_serial within the election with ERR_DUPLICATE_REMAKE_SERIAL"
      - "appends TransparencyLogEntry (event_type=REMAKE_COMPLETED)"
  - method: POST
    path: "/vote-by-mail/remake-records/{id}/void"
    description: "Void a remake session (compensating action): the replacement envelope is withdrawn and the original returns to the countable pool"
    roles: [CanvassSupervisor]
    code: 200
    input: [voided_reason_code]
    output: RemakeRecord
    side_effects:
      - "status IN {OPEN, COMPLETED} -> VOIDED"
      - "when the remake had COMPLETED: the replacement envelope moves signature_status -> REJECTED and custody_status -> SEQUESTERED, and the original envelope returns SUPERSEDED_BY_REMAKE -> SEALED"
      - "recomputes Election.attributable_ballot_count, which must return to its pre-completion value (calculations.ballot_countability_conservation)"
      - "appends TransparencyLogEntry (event_type=REMAKE_VOIDED)"

  # ------------------------------------------------------ ObserverAccessSession
  - method: POST
    path: "/vote-by-mail/elections/{id}/observer-sessions"
    description: "Schedule an observer access window on an election floor; per-party concurrency uses half-open interval semantics"
    roles: [ElectionsClerk, Observer]
    code: 201
    input: [observer_user_id, observer_name, organization, party_affiliation, station_area, window_start_at, window_end_at]
    output: ObserverAccessSession
    side_effects:
      - "creates the session in SCHEDULED"
      - "enforces at most OBSERVER_MAX_CONCURRENT_PER_PARTY (1) overlapping session per party (ERR_OBSERVER_PARTY_SLOT_CONFLICT) and OBSERVER_MAX_CONCURRENT_TOTAL (3) overlapping sessions on the floor (ERR_OBSERVER_FLOOR_CAPACITY)"
      - "appends TransparencyLogEntry (event_type=OBSERVER_SESSION_OPENED)"
  - method: GET
    path: "/vote-by-mail/observer-sessions/{id}"
    description: "Read one observer access session"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, Observer]
    code: 200
    input: []
    output: ObserverAccessSession
    side_effects: []
  - method: GET
    path: "/vote-by-mail/observer-sessions"
    description: "List observer access sessions, optionally filtered by election, party, or station area"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, Observer]
    code: 200
    input: ["election_id?", "party_affiliation?", "station_area?", "status?", "limit?", "offset?"]
    output: ObserverAccessSession[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/observer-sessions/{id}/check-in"
    description: "Check an observer in at the start of their window, activating floor access"
    roles: [Observer]
    code: 200
    input: []
    output: ObserverAccessSession
    side_effects:
      - "status SCHEDULED -> CHECKED_IN; requires the logical clock now to lie in the half-open window [window_start_at, window_end_at) (ERR_OBSERVER_WINDOW_NOT_ACTIVE)"
  - method: POST
    path: "/vote-by-mail/observer-sessions/{id}/revoke"
    description: "Revoke observer access, freeing the party slot for the remainder of the window"
    roles: [ElectionsAdmin, CanvassSupervisor]
    code: 200
    input: [revocation_reason_code]
    output: ObserverAccessSession
    side_effects:
      - "status IN {SCHEDULED, CHECKED_IN} -> REVOKED and the session leaves the party occupancy set"
      - "appends TransparencyLogEntry (event_type=OBSERVER_SESSION_REVOKED)"

  # ------------------------------------------------------ TransparencyLogEntry
  - method: GET
    path: "/vote-by-mail/transparency-log/{id}"
    description: "Read one transparency log entry (immutable, append-only)"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, Observer]
    code: 200
    input: []
    output: TransparencyLogEntry
    side_effects: []
  - method: GET
    path: "/vote-by-mail/transparency-log"
    description: "List transparency log entries in append order (sequence ASC), optionally filtered by election, event type, actor role, or subject"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, Observer]
    code: 200
    input: ["election_id?", "event_type?", "actor_role?", "subject_id?", "limit?", "offset?"]
    output: TransparencyLogEntry[]
    side_effects: []

  # ------------------------------------------------------------- Logical clock
  - method: POST
    path: "/vote-by-mail/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the service's logical clock. The logical clock defaults to 2026-08-01T00:00:00Z when never set, every datetime the service stamps is read from it, and it may only move forward (ERR_CLOCK_REWIND_FORBIDDEN)"
    roles: [ElectionsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock to to_iso8601; all subsequent computed datetimes and deadline comparisons use this value"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header is absent, empty, or not one of the five roles declared in §1.7"
  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "The authenticated role is not listed in the target endpoint's roles"

  # --- schema ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, a field has the wrong type, an enum value is outside its declared set, similarity_score is outside 0..100, session_end_at <= session_start_at, or window_end_at <= window_start_at"

  # --- existence ---
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "No Election exists with the supplied election id (path or body)"
  - id: ERR_VOTER_NOT_FOUND
    http: 404
    condition: "No Voter exists with the supplied voter id"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "No Reviewer exists with the supplied reviewer id, including either remake team member id"
  - id: ERR_ENVELOPE_NOT_FOUND
    http: 404
    condition: "No ReturnEnvelope exists with the supplied envelope id, including any id inside separation-runs return_envelope_ids"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "No BallotRequest, AddressVerification, PermanentAbsenteeEnrollment, MailingBatch, BallotPacket, SignatureReview, CureNotice, CureEvidence, RemakeRecord, ObserverAccessSession, or TransparencyLogEntry exists with the supplied id"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_VOTER_VERSION
    http: 412
    condition: "expected_voter_version does not equal the current Voter.version on POST /vote-by-mail/ballot-requests"
  - id: ERR_STALE_ENVELOPE_VERSION
    http: 412
    condition: "expected_envelope_version does not equal the current ReturnEnvelope.version on POST /vote-by-mail/return-envelopes/{id}/remakes"

  # --- state ---
  - id: ERR_ELECTION_POSTURE_FORBIDS
    http: 409
    condition: "The election posture forbids the operation: intake or cure issuance once posture == CANVASS_LOCKED, any mutating child operation once posture == CERTIFIED, posture-advance to a non-successor posture, or certification while reconciliation_status != IN_BALANCE, open_cure_count > 0, or any envelope still CHALLENGED"
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "The BallotRequest is not in a status that permits the operation (approve requires ADDRESS_CLEARED; reject requires RECEIVED, ADDRESS_HOLD, or ADDRESS_CLEARED; address-recheck requires ADDRESS_HOLD; packet creation requires APPROVED)"
  - id: ERR_VERIFICATION_ALREADY_RESOLVED
    http: 409
    condition: "The AddressVerification is already CLEARED or FAILED, so a result cannot be recorded again"
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "The MailingBatch status forbids the operation (packets require DRAFT; seal requires DRAFT; dispatch requires SEALED; cancel requires DRAFT or SEALED)"
  - id: ERR_PACKET_STATE_INVALID
    http: 409
    condition: "The BallotPacket status forbids the operation (envelope intake requires MAILED or UNDELIVERABLE; undeliverable requires MAILED)"
  - id: ERR_ENVELOPE_SIGNATURE_STATE_INVALID
    http: 409
    condition: "The envelope's signature_status forbids the operation (a new review round requires UNVERIFIED or ESCALATED; a decision requires PENDING_REVIEW; cure issuance requires CURE_REQUIRED; review_round would exceed SIGNATURE_MAX_ROUNDS (3))"
  - id: ERR_REVIEW_ALREADY_SUBMITTED
    http: 409
    condition: "The SignatureReview is already SUBMITTED or VOIDED, so its decision cannot be recorded or replaced"
  - id: ERR_ENVELOPE_CUSTODY_STATE_INVALID
    http: 409
    condition: "The envelope's custody_status forbids the operation (separation requires SEALED; count requires SEPARATED; a remake requires SEALED or SEQUESTERED)"
  - id: ERR_CURE_STATE_INVALID
    http: 409
    condition: "The CureNotice status forbids the operation (evidence requires ISSUED; adjudicate requires UNDER_EVIDENCE_REVIEW; a second open notice cannot be issued for the same envelope)"
  - id: ERR_REMAKE_STATE_INVALID
    http: 409
    condition: "The RemakeRecord status forbids the operation (complete requires OPEN; void requires OPEN or COMPLETED)"
  - id: ERR_ENROLLMENT_NOT_SUSPENDED
    http: 409
    condition: "Reinstatement was requested for an enrollment whose status is not SUSPENDED, or removal was requested for an enrollment already REMOVED"
  - id: ERR_CHALLENGE_STATE_INVALID
    http: 409
    condition: "The envelope's challenge_status forbids the operation (filing requires NONE; adjudication requires CHALLENGED)"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "The ObserverAccessSession status forbids the operation (check-in requires SCHEDULED; revoke requires SCHEDULED or CHECKED_IN)"

  # --- business safety ---
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "The acting SignatureReviewer's X-User-ID is not the SignatureReview.reviewer_id of the review being decided"
  - id: ERR_REVIEWER_TRAINING_INVALID
    http: 422
    condition: "The reviewer's training_status is not in {TRAINED, CERTIFIED_LEAD}, or training_expires_at is null, or training_expires_at <= the logical clock now at the moment of the decision"
  - id: ERR_REMAKE_TEAM_NOT_BIPARTISAN
    http: 422
    condition: "The two remake team members are the same reviewer, or share the same party_affiliation, so the team is not bipartisan"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "A remake team member already holds a SignatureReview row on the original envelope, or the selected escalation reviewer already decided a previous round on that envelope"
  - id: ERR_SEPARATION_SET_EMPTY
    http: 400
    condition: "return_envelope_ids is an empty list on POST /vote-by-mail/elections/{id}/separation-runs"
  - id: ERR_BALLOT_SECRECY_POOL_TOO_SMALL
    http: 422
    condition: "A separation run contains fewer than BALLOT_SECRECY_MIN_POOL (3) distinct envelopes, which would let a separated ballot be re-associated with its voter"
  - id: ERR_OBSERVER_SESSION_REQUIRED
    http: 403
    condition: "An Observer filed a challenge without a CHECKED_IN ObserverAccessSession for that election whose half-open window contains the logical clock now and whose station_area IN {INTAKE, SIGNATURE_REVIEW}"

  # --- business referential ---
  - id: ERR_VOTER_REGISTRATION_INACTIVE
    http: 422
    condition: "The voter's registration_status is not ACTIVE at request logging or approval"
  - id: ERR_DELIVERY_METHOD_NOT_ELIGIBLE
    http: 422
    condition: "delivery_method == EMAIL_UOCAVA while the voter's uocava_status is NONE"
  - id: ERR_UOCAVA_BATCH_MISMATCH
    http: 422
    condition: "The packet's voter does not match the batch_type eligibility (UOCAVA requires MILITARY or OVERSEAS; DOMESTIC_INITIAL requires NONE)"
  - id: ERR_REQUEST_ELECTION_MISMATCH
    http: 422
    condition: "The BallotRequest belongs to a different election than the MailingBatch it is being packeted into"
  - id: ERR_DUPLICATE_ENVELOPE_FOR_PACKET
    http: 409
    condition: "A ReturnEnvelope already exists for this ballot_packet_id and was not superseded by a remake"
  - id: ERR_DUPLICATE_REMAKE_SERIAL
    http: 409
    condition: "remade_serial is already recorded on another RemakeRecord within the same election"

  # --- business constraint ---
  - id: ERR_OBSERVER_PARTY_SLOT_CONFLICT
    http: 409
    condition: "A new observer session overlaps (half-open semantics) an existing non-REVOKED session of the same party_affiliation for the same election, exceeding OBSERVER_MAX_CONCURRENT_PER_PARTY (1)"
  - id: ERR_OBSERVER_FLOOR_CAPACITY
    http: 409
    condition: "A new observer session would make more than OBSERVER_MAX_CONCURRENT_TOTAL (3) non-REVOKED sessions overlap on the election floor"
  - id: ERR_REMAKE_TEAM_DOUBLE_BOOKED
    http: 409
    condition: "Either remake team member already sits on a non-VOIDED RemakeRecord whose session collides under closed-interval semantics widened by REMAKE_CHANGEOVER_BUFFER_MINUTES (15)"
  - id: ERR_NO_ELIGIBLE_REVIEWER
    http: 409
    condition: "The eligibility filter of calculations.reviewer_assignment_selection yields an empty candidate set for the requested review round"

  # --- business temporal ---
  - id: ERR_UOCAVA_SEND_DEADLINE_PASSED
    http: 422
    condition: "A UOCAVA batch is dispatched after election.uocava_send_deadline_date"
  - id: ERR_DOMESTIC_SEND_DEADLINE_PASSED
    http: 422
    condition: "A DOMESTIC_INITIAL or SUPPLEMENTAL batch is dispatched after election.domestic_send_deadline_date"
  - id: ERR_CURE_DEADLINE_PASSED
    http: 422
    condition: "Evidence submission or adjudication is attempted at or after the notice's frozen cure_deadline_at"
  - id: ERR_OBSERVER_WINDOW_NOT_ACTIVE
    http: 422
    condition: "Check-in was attempted while the logical clock now lies outside the half-open window [window_start_at, window_end_at)"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 422
    condition: "to_iso8601 is not strictly greater than the current logical clock value"

  # --- business fiscal ---
  - id: ERR_POSTAGE_BUDGET_EXCEEDED
    http: 402
    condition: "Sealing or dispatching a batch would drive Election.postage_committed_cents (or postage_actual_cents) above the election's postage_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ElectionsAdmin
    description: "County elections official who configures the election, manages reviewer certification, advances posture, runs the canvass sweep, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /vote-by-mail/elections"
      - "POST /vote-by-mail/elections/{id}/posture-advance"
      - "POST /vote-by-mail/elections/{id}/canvass-sweep"
      - "POST /vote-by-mail/reviewers"
      - "POST /vote-by-mail/reviewers/{id}/training-completions"
      - "POST /vote-by-mail/_clock/set_current_utc"
    shared_operations:
      - "POST /vote-by-mail/voters (with ElectionsClerk)"
      - "POST /vote-by-mail/observer-sessions/{id}/revoke (with CanvassSupervisor)"
      - "all GET reads except GET /vote-by-mail/cure-evidence ownership-free listing restrictions (shared with ElectionsClerk and CanvassSupervisor)"

  - name: ElectionsClerk
    description: "Processing-floor clerk who logs ballot requests and address results, builds and dispatches mailing batches, logs returned envelopes and cure evidence, opens review rounds, and issues cure notices"
    identity: "opaque"
    exclusive_operations:
      - "POST /vote-by-mail/ballot-requests"
      - "POST /vote-by-mail/ballot-requests/{id}/approve"
      - "POST /vote-by-mail/ballot-requests/{id}/reject"
      - "POST /vote-by-mail/ballot-requests/{id}/address-recheck"
      - "POST /vote-by-mail/address-verifications/{id}/results"
      - "POST /vote-by-mail/mailing-batches"
      - "POST /vote-by-mail/mailing-batches/{id}/packets"
      - "POST /vote-by-mail/mailing-batches/{id}/seal"
      - "POST /vote-by-mail/mailing-batches/{id}/dispatch"
      - "POST /vote-by-mail/mailing-batches/{id}/cancel"
      - "POST /vote-by-mail/ballot-packets/{id}/undeliverable"
      - "POST /vote-by-mail/return-envelopes"
      - "POST /vote-by-mail/return-envelopes/{id}/signature-reviews"
      - "POST /vote-by-mail/return-envelopes/{id}/cure-notices"
      - "POST /vote-by-mail/cure-notices/{id}/evidence"
      - "POST /vote-by-mail/voters/{id}/permanent-absentee-enrollments"
      - "POST /vote-by-mail/permanent-absentee-enrollments/{id}/reinstate"
      - "DELETE /vote-by-mail/permanent-absentee-enrollments/{id}"
    shared_operations:
      - "POST /vote-by-mail/voters (with ElectionsAdmin)"
      - "POST /vote-by-mail/elections/{id}/observer-sessions (with Observer)"
      - "all GET reads on requests, verifications, enrollments, batches, packets, envelopes, reviews, cure records, remakes, sessions, and the transparency log"

  - name: SignatureReviewer
    description: "Trained reviewer who compares the envelope signature against the registration record; acts only on reviews assigned to them by the server selector policy"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /vote-by-mail/signature-reviews/{id}/decision (X-User-ID must equal SignatureReview.reviewer_id)"
    shared_operations:
      - "GET /vote-by-mail/signature-reviews and GET /vote-by-mail/signature-reviews/{id}"
      - "GET /vote-by-mail/return-envelopes and GET /vote-by-mail/return-envelopes/{id}"
      - "GET /vote-by-mail/reviewers/{id}"
      - "GET /vote-by-mail/elections/{id}"

  - name: CanvassSupervisor
    description: "Canvass board supervisor who adjudicates cures and challenges, runs envelope separation and counting, and authorises bipartisan remakes; segregated from the reviewers who decided the same envelope"
    identity: "opaque"
    exclusive_operations:
      - "POST /vote-by-mail/cure-notices/{id}/adjudicate"
      - "POST /vote-by-mail/return-envelopes/{id}/challenge-adjudication"
      - "POST /vote-by-mail/return-envelopes/{id}/remakes"
      - "POST /vote-by-mail/return-envelopes/{id}/count"
      - "POST /vote-by-mail/remake-records/{id}/complete"
      - "POST /vote-by-mail/remake-records/{id}/void"
      - "POST /vote-by-mail/elections/{id}/separation-runs"
    shared_operations:
      - "POST /vote-by-mail/observer-sessions/{id}/revoke (with ElectionsAdmin)"
      - "all GET reads on elections, voters, requests, batches, packets, envelopes, reviews, cure records, remakes, sessions, and the transparency log"

  - name: Observer
    description: "Party, campaign, or media observer with a scheduled floor access window; may file challenges only while checked in and may never read voter registration records"
    identity: "opaque"
    exclusive_operations:
      - "POST /vote-by-mail/observer-sessions/{id}/check-in"
      - "POST /vote-by-mail/return-envelopes/{id}/challenges"
    shared_operations:
      - "POST /vote-by-mail/elections/{id}/observer-sessions (with ElectionsClerk)"
      - "GET /vote-by-mail/elections, GET /vote-by-mail/elections/{id}, GET /vote-by-mail/elections/{id}/accountability"
      - "GET /vote-by-mail/observer-sessions, GET /vote-by-mail/observer-sessions/{id}"
      - "GET /vote-by-mail/transparency-log, GET /vote-by-mail/transparency-log/{id}"
