        grounds:
          - state_machines.PreSaleContract.OFFERED_to_COUNTERED
          - state_machines.PreSaleContract.COUNTERED_to_OFFERED
          - state_machines.PreSaleContract.UNPAID_to_PARTIALLY_PAID
