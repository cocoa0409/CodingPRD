      - name: repointing_a_leaf_token_onto_its_own_alias_closes_a_cycle_and_is_refused
        claim_type: topological
        grounds:
          - calculations.token_alias_resolution
          - validations[priority=17]
          - errors[ERR_TOKEN_ALIAS_CYCLE]
          - endpoints["PUT /design-system/tokens/{id}"]
        distinguishing_aspect: |
          Tokens are re-pointable, so the cycle check must run on update and not only on create:
          with color.mid aliasing color.base, re-pointing color.base at color.mid closes a
          two-node cycle and must be refused with ERR_TOKEN_ALIAS_CYCLE at 409 before anything is
          written — color.base keeps raw_value #0055FF with alias_of_token_id null, and the token
          set's version does not advance.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "TokenSet `core` with leaf token color.base (#0055FF) and color.mid aliasing it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id, v0: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.base", category: "COLOR", expected_token_set_version: "${v0}", raw_value: "#0055FF" }
              as: DesignSystemLead
              captures: { base_id: $.data.id }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v1: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.mid", category: "COLOR", expected_token_set_version: "${v1}", alias_of_token_id: "${base_id}" }
              as: DesignSystemLead
              captures: { mid_id: $.data.id, mid_depth: $.data.alias_depth, mid_resolved: $.data.resolved_value }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v2: $.data.version, depth_before: $.data.max_alias_depth }
          trigger:
            - call: "PUT /design-system/tokens/${base_id}"
              payload: { expected_token_set_version: "${v2}", alias_of_token_id: "${mid_id}" }
              as: DesignSystemLead
              captures: { err: $.data.error_id }
            - call: "GET /design-system/tokens/${base_id}"
              payload: {}
              as: DesignSystemLead
              captures: { base_alias_after: $.data.alias_of_token_id, base_raw_after: $.data.raw_value, base_depth_after: $.data.alias_depth }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v_after: $.data.version, depth_after: $.data.max_alias_depth }
          assert:
            - "${mid_depth} == 1 and ${mid_resolved} == #0055FF and ${depth_before} == 1"
            - "${err} == ERR_TOKEN_ALIAS_CYCLE"
            - "HTTP status == 409"
            - "${base_alias_after} == null and ${base_raw_after} == #0055FF and ${base_depth_after} == 0"
            - "${v2} == 3 and ${v_after} == 3 and ${depth_after} == 1"

