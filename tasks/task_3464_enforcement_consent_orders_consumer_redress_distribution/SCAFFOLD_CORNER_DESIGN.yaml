  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: order_transition_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-transition-stale-version]
          - errors.ERR_STALE_ORDER_VERSION
        distinguishing_aspect: "After the order advanced DRAFT(1) -> IN_PUBLIC_COMMENT(2) -> DRAFT(3), a fresh propose still carrying expected_consent_order_version 1 is a legal state transition with a stale OCC token: rejected 412 ERR_STALE_ORDER_VERSION, proving version — not state — gates the write."
        test_recipe:
          setup:
            - "Consent order created (v1), proposed (v2), withdrawn back to DRAFT (v3)."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "DRAFT", expected_consent_order_version: "${order_v2}" }
              as: StaffAttorney
              captures: { order_v3: $.data.version }
          trigger:
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "IN_PUBLIC_COMMENT", expected_consent_order_version: "${order_v1}" }
              as: StaffAttorney
              captures: { error_id: $.data.error_id }
            - call: "POST /enforcement/consent-orders/${order_id}/transition"
              payload: { target_state: "IN_PUBLIC_COMMENT", expected_consent_order_version: "${order_v3}" }
              as: StaffAttorney
          assert:
            - "the stale attempt returns 412 with error_id == ERR_STALE_ORDER_VERSION"
            - "the retry with the current version succeeds 200 and the order is IN_PUBLIC_COMMENT at version 4 (created 1, proposed 2, withdrawn 3, re-proposed 4)"
            - "the failed OCC attempt created no second comment period before the retry: exactly 2 periods exist after the retry (round 1 VOIDED, round 2 OPEN)"

      - name: fund_transition_with_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fund-transition-stale-version]
          - errors.ERR_STALE_FUND_VERSION
        distinguishing_aspect: "After CLAIMS_CLOSED advanced the fund's version, a DISBURSING request still carrying the pre-close version is rejected 412 ERR_STALE_FUND_VERSION even though CLAIMS_CLOSED -> DISBURSING is a legal transition — OCC on the fund's version, per the second concurrency rule."
        test_recipe:
          setup:
            - "Fund OPEN_FOR_CLAIMS (1500000 collected, zero claims filed); administrator holds version V from a GET; the fund is then closed via a transition using V."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - *c_judgment
            - *c_get_fund
            - *c_pay_full
            - call: "GET /enforcement/redress-funds/${fund_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_v: $.data.version }
            - call: "POST /enforcement/redress-funds/${fund_id}/transition"
              payload: { target_state: "CLAIMS_CLOSED", expected_redress_fund_version: "${fund_v}" }
              as: FundAdministrator
              as_user_id: "fa-1"
          trigger:
            - call: "POST /enforcement/redress-funds/${fund_id}/transition"
              payload: { target_state: "DISBURSING", expected_redress_fund_version: "${fund_v}" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_FUND_VERSION"
            - "RedressFund.${fund_id} remains CLAIMS_CLOSED (a GET with the post-close version would succeed for DISBURSING)"

      - name: sod_check_issue_by_approving_user_rejected
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=7]
          - errors.ERR_SOD_CHECK_ISSUE
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties compares X-User-ID across roles: a DisbursementOfficer whose user id equals the claim's approved_by_user_id (fa-1) is rejected 403 ERR_SOD_CHECK_ISSUE; the same endpoint with a different officer (do-1) succeeds."
