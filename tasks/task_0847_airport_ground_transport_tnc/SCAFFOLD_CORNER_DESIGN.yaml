              as: Operator
              as_user_id: "${op_id}"
              captures: { st: $.data.status }
          assert:
            - "SettlementStatement.${stmt_id}.net_due_cents == 359"
            - "SettlementStatement.${stmt_id}.status == SETTLED"

      - name: list_vehicles_limit_zero_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Pagination limit below the min of 1 -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/vehicles?limit=0"
              payload: {}
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response http_status == 400"

  # ===========================================================================
  - section: rbac
    instances:
      - name: operator_cannot_create_staging_lot_unauthorized
        claim_type: role_denial
        grounds: [roles.Operator, roles.AirportAuthority, endpoints.POST_/v1/staging-lots]
        distinguishing_aspect: "Operator (not AirportAuthority) calling POST /v1/staging-lots -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/staging-lots"
              payload: { name: "Illegal", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: Operator
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "response http_status == 403"

      - name: curb_coordinator_cannot_issue_permit_unauthorized
        claim_type: role_denial
        grounds: [roles.CurbCoordinator, roles.AirportAuthority, endpoints.POST_/v1/permits]
        distinguishing_aspect: "CurbCoordinator calling POST /v1/permits -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["operator with a vehicle exists"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "CC Co", operator_type: "TNC", contact_email: "cc@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "CCV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
          trigger:
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-CCV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: CurbCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "response http_status == 403"

      - name: operator_cannot_register_vehicle_for_other_operator
        claim_type: peer_roles
        grounds: [roles.Operator, "validations[priority=2]"]
        distinguishing_aspect: "entity_backed ownership: Operator acting as op1 (X-User-ID=op1) posting a vehicle with operator_id=op2 -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["two operators op1, op2 exist"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "Own1", operator_type: "TNC", contact_email: "o1@x.com" }
              as: AirportAuthority
              captures: { op1: $.data.id }
            - call: "POST /v1/operators"
              payload: { legal_name: "Own2", operator_type: "TNC", contact_email: "o2@x.com" }
              as: AirportAuthority
              captures: { op2: $.data.id }
          trigger:
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op2}", plate: "STEAL" }
              as: Operator
              as_user_id: "${op1}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "response http_status == 403"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role header -> ERR_UNAUTHENTICATED (401) (checked before all other rules)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { legal_name: "NoAuth", operator_type: "TNC", contact_email: "na@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "response http_status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: permit_issue_stale_vehicle_version_returns_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-create-stale-vehicle]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential permit issues carrying the SAME observed expected_vehicle_version: the first advances Vehicle.version, the second (still carrying the pre-advance version) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["operator; a vehicle at version 1 (captured as veh_v)"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "OCC Co", operator_type: "TNC", contact_email: "oc2@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "OCCV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-OCC1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-OCC2", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response http_status == 412"

      - name: permit_issue_correct_version_increments_vehicle_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-create-stale-vehicle]", entities.Vehicle.fields.version]
        distinguishing_aspect: "A permit issue with the correct expected_vehicle_version succeeds and advances Vehicle.version from 1 to 2."
        test_recipe:
          setup: ["operator; a vehicle at version 1"]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { legal_name: "OCC2 Co", operator_type: "TNC", contact_email: "oc3@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "OCCV2" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
          trigger:
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-OCC3", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { p1: $.data.id }
            - call: "GET /v1/vehicles/${veh_id}"
              payload: {}
              as: AirportAuthority
              captures: { newv: $.data.version }
          assert:
            - "Vehicle.${veh_id}.version == 2"

      - name: operator_suspend_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Operator.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / operator_suspend_cascades_vehicle_trip_curb_depth3
          rationale: "The multi-level suspend cascade is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: dispatch_returns_provisional_fee_immediately
        claim_type: immediate
        grounds: [entities.Trip.fields.provisional_fee_cents, calculations.trip_fee]
        distinguishing_aspect: "immediate consistency: the POST /v1/trips response itself carries the computed provisional_fee_cents (no second read needed)."
        test_recipe:
          setup: ["TAXI operator ACTIVE; vehicle+permit queued; clock 2026-04-16T12:00:00Z (off-peak)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-16T12:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Imm Co", operator_type: "TAXI", contact_email: "im@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/vehicles"
              payload: { operator_id: "${op_id}", plate: "IMV1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /v1/permits"
              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-IMV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
              payload: { name: "LotW", geofence_center_lat: 40.64, geofence_center_lng: -73.78, geofence_radius_m: 5000, capacity: 5 }
              as: AirportAuthority
              captures: { lot_id: $.data.id }
            - call: "POST /v1/queue-entries"
              payload: { staging_lot_id: "${lot_id}", vehicle_id: "${veh_id}", lat: 40.64, lng: -73.78 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qe_id: $.data.id }
          trigger:
            - call: "POST /v1/trips"
              payload: { vehicle_id: "${veh_id}", staging_lot_id: "${lot_id}", trip_kind: "PICKUP" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { prov: $.data.provisional_fee_cents }
          assert:
            - "Trip provisional_fee_cents in the create response == 300"
