    output: ContractedFacility
    side_effects: []
  - method: GET
    path: "/api/facilities"
    description: "List facilities"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContractedFacility[]"
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}"
    description: "Get a facility"
    roles: [OperationsDirector, FacilityCoordinator, Technologist, ReadingRadiologist, ComplianceOfficer]
    code: 200
    input: []
    output: ContractedFacility
    side_effects: []

  # --- Mobile Imaging Units ---
