              captures: { m2_id: $.data.id }
            - call: "POST /memberships/${m2_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m1_id}", starts_at: "2026-02-01T08:00:00Z", ends_at: "2026-02-01T09:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m2_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 412"
            - "response error_id == ERR_STALE_VERSION (res_v0 is stale; the first booking advanced Resource.version)"

      - name: stale_version_on_waitlist_accept
        claim_type: violation_to_error
        grounds: ["concurrency_rules[waitlist-accept-stale-category]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Accepting an OFFERED waitlist entry with a deliberately stale expected_category_version (captured value minus 1) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Club; GOLF capacity 1 allows_golf; seat free; one entry W OFFERED; current category version captured."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "ERR2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 1, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", applicant_name: "W" }
              as: ClubManager
              captures: { w_id: $.data.id }
            - call: "POST /waitlist-entries/${w_id}/offer"
              payload: {}
              as: ClubManager
            - call: "GET /membership-categories/${cat_id}"
              payload: {}
              as: ClubManager
              captures: { cat_v: $.data.version }
          trigger:
            - call: "POST /waitlist-entries/${w_id}/accept"
              payload: { expected_category_version: "${cat_v} - 1" }
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 412"
            - "response error_id == ERR_STALE_VERSION"
            - "WaitlistEntry.${w_id}.status == OFFERED (unchanged)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_activate_membership
        claim_type: unauthorized_operation
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Member calling POST /memberships/{id}/activate (a ClubManager-exclusive op) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Club; SOCIAL category; Member M created (PENDING)."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "R1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
          trigger:
