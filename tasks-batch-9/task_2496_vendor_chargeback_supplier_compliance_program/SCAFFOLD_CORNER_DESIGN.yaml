      - name: corner_purchase_order_bubbles_up_to_received_when_all_units_arrive
        claim_type: bubble_up
        grounds:
          - state_machines.PurchaseOrder.PARTIALLY_RECEIVED_to_RECEIVED
          - complexity_profile.state_machine_shape
          - endpoints[POST /compliance/shipments/{id}/receive]
        distinguishing_aspect: "PurchaseOrder state is derived from its children, never posted directly: after a 600-unit receipt the parent is PARTIALLY_RECEIVED, and the second 400-unit receipt bubbles it to RECEIVED with received_units 1000 while first_receipt_at stays pinned to the earlier 2026-08-10 receipt rather than the later one."
        test_recipe:
          setup:
            - "Vendor V-2020 with PO-1 for 1000 units at 500 cents and two IN_TRANSIT shipments of 600 and 400 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
