      - name: qc_unlock_with_a_run_from_another_device_returns_qc_run_device_mismatch
        claim_type: error_triggerable
        grounds:
          - errors[ERR_QC_RUN_DEVICE_MISMATCH]
          - validations[priority:61]
          - state_machines.Device.QC_LOCKED_to_ACTIVE
        distinguishing_aspect: |
          The confirming run PASSED and its lot is VERIFIED, so priorities 44 and
          50 are both satisfied; it is simply a run recorded on the sibling
          instrument. A control run on a QC_LOCKED device is legal (priority 41
          excludes qc-runs), which is exactly how the correct unlock then works.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site, trained operator, TWO GLUCO-9 devices D1 and D2, one VERIFIED GLUCO-9 lot (verified from D2's LEVEL_1 + LEVEL_2 PASS runs)."
            - "A LEVEL_1 run of 200.0 on D1 fails the 80.0..120.0 window and locks D1 with QC_FAILURE."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243044", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Peds Clinic POCT", department_code: "DEPT-3800", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Fay Oyelaran", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-3801", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_1: $.data.id }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-3802", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_2: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_2}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc_d2_l1: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_2}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc_d2_l2: $.data.id, d2_l2_result: $.data.result }
            - call: "POST /poct/reagent-lots/${lot_id}/verify"
              payload: { level_1_qc_run_id: "${qc_d2_l1}", level_2_qc_run_id: "${qc_d2_l2}" }
              as: QualityCoordinator
              captures: { lot_state: $.data.verification_status }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_1}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 200.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { qc_fail: $.data.id, fail_result: $.data.result, fail_locked: $.data.locked_device }
          trigger:
            - call: "POST /poct/devices/${dev_1}/qc-unlock"
              payload: { confirming_qc_run_id: "${qc_d2_l2}", note: "control from the bench next to it" }
              as: QualityCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_1}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 101.0 }
              as: Operator
