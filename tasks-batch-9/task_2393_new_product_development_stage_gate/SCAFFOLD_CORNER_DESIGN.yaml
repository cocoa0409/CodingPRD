      - name: val_occ_scope_limited_to_declared_version_carrying_writes
        claim_type: rule_scope
        grounds:
          - validations[priority 7].applies_to
          - endpoints[POST /innovation-projects/{id}/concept-tests]
        distinguishing_aspect: |
          Optimistic concurrency guards exactly three child creations, so a concept test and a
          checklist item are accepted with no version token at all while a business case quoting
          the pre-screen version is refused 412, and the refused attempt does not itself move the
          version.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist."
            - "A project created at version 1 and screened to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
