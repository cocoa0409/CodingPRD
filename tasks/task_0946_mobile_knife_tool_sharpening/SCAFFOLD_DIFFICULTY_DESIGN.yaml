scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: item_price_quoted_vs_final_on_damage_tier_reassessment
        grounds:
          - calculations.item_service_price
          - calculations.item_service_minutes
          - entities.RequestItem.fields.quoted_gross_cents
          - entities.RequestItem.fields.final_gross_cents
          - state_machines.RequestItem.INTAKE_PENDING_to_ASSESSED
        distinguishing_aspect: |
          This dual variant lives on the money domain of RequestItem: the QUOTED variant prices
          the customer's declared_damage_tier at request time and the FINAL variant prices the
          technician's assessed_damage_tier at intake, so a CHEF_KNIFE declared ROUTINE_HONE and
          found CHIP_REPAIR carries quoted_gross_cents 900 and final_gross_cents 1440 on the very
          same row.
        test_recipe:
          setup:
            - "One ItemClassSpec for CHEF_KNIFE with list_price_cents 900 and base_service_minutes 6."
            - "One ACTIVE PER_VISIT Account in ZONE_N with no subscription."
            - "One VAN_ROUTE ServiceRequest carrying one CHEF_KNIFE item declared ROUTINE_HONE, driven all the way to bench custody on a dispatched run."
            - "Logical clock at the 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test", billing_mode: "PER_VISIT" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/technicians"
              payload: { full_name: "Ada Grind", certifications: ["SERRATED", "CLIPPER", "SHEAR", "SLICER"] }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /sharpening/vans"
              payload: { code: "VAN-01" }
              as: PlatformAdmin
              captures: { van: $.data.id }
            - call: "POST /sharpening/bench-days"
              payload: { bench_date: "2026-05-01", bench_minute_budget: 480 }
              as: PlatformAdmin
              captures: { bench: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item: $.data.id, quoted_at_create: $.data.quoted_gross_cents }
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/route-runs"
              payload: { van_id: "${van}", technician_id: "${tech}", run_date: "2026-05-01", zone_code: "ZONE_N", service_minute_budget: 420, stop_cap: 8 }
              as: Dispatcher
              captures: { run: $.data.id, run_v: $.data.version }
            - call: "POST /sharpening/route-runs/${run}/stops"
              payload: { service_request_id: "${sr}", sequence: 1, arrival_window_start: "09:00", expected_route_run_version: "${run_v}" }
              as: Dispatcher
              captures: { stop: $.data.id }
            - call: "POST /sharpening/route-runs/${run}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /sharpening/route-stops/${stop}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/pickup"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/bench-intake"
              payload: { bench_day_id: "${bench}" }
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /sharpening/request-items/${item}/assess"
              payload: { assessed_damage_tier: "CHIP_REPAIR" }
              as: Technician
              as_user_id: "${tech}"
              captures: { final_after: $.data.final_gross_cents }
          assert:
            - "RequestItem.${item}.quoted_gross_cents == 900"
            - "RequestItem.${item}.final_gross_cents == 1440"
            - "RequestItem.${item}.service_minutes_declared == 6"
            - "RequestItem.${item}.service_minutes_assessed == 12"
            - "RequestItem.${item}.part_fee_cents == 0"
            - "RequestItem.${item}.requires_reauthorization == false"
            - "RequestItem.${item}.authorization_status == NOT_REQUIRED"

      - name: run_minutes_provisional_vs_dispatch_final
        grounds:
          - calculations.run_committed_minutes
          - entities.RouteRun.fields.committed_minutes_provisional
          - entities.RouteRun.fields.committed_minutes_final
          - state_machines.RouteRun.PLANNED_to_DISPATCHED
        distinguishing_aspect: |
          This dual variant lives on the capacity domain of RouteRun, not on money: the PROVISIONAL
          variant charges only the per-stop drive buffer while DISPATCH_FINAL additionally charges
          RETURN_LEG_BUFFER_MINUTES, so the identical single-stop run reads
          committed_minutes_provisional 26 before dispatch and committed_minutes_final 51 after it.
        test_recipe:
          setup:
            - "One CHEF_KNIFE spec with base_service_minutes 6."
            - "One ACTIVE Account in ZONE_N, one SUBMITTED VAN_ROUTE request with two CHEF_KNIFE ROUTINE_HONE items."
            - "One PLANNED RouteRun on 2026-05-01 with service_minute_budget 420 holding exactly that one stop."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Blue Fork Kitchen", account_type: "RESTAURANT", zone_code: "ZONE_N", contact_email: "ops@bluefork.test", billing_mode: "PER_VISIT" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/technicians"
              payload: { full_name: "Ada Grind", certifications: [] }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /sharpening/vans"
              payload: { code: "VAN-01" }
              as: PlatformAdmin
              captures: { van: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/route-runs"
              payload: { van_id: "${van}", technician_id: "${tech}", run_date: "2026-05-01", zone_code: "ZONE_N", service_minute_budget: 420, stop_cap: 8 }
              as: Dispatcher
              captures: { run: $.data.id, run_v: $.data.version }
            - call: "POST /sharpening/route-runs/${run}/stops"
              payload: { service_request_id: "${sr}", sequence: 1, arrival_window_start: "09:00", expected_route_run_version: "${run_v}" }
              as: Dispatcher
              captures: { stop: $.data.id }
            - call: "GET /sharpening/route-runs/${run}"
              payload: {}
              as: Dispatcher
              captures: { prov_before: $.data.committed_minutes_provisional }
          trigger:
            - call: "POST /sharpening/route-runs/${run}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { final_after: $.data.committed_minutes_final }
          assert:
            - "RouteRun.${run}.booked_service_minutes == 12"
            - "RouteRun.${run}.committed_minutes_provisional == 26"
            - "RouteRun.${run}.committed_minutes_final == 51"
            - "RouteRun.${run}.committed_minutes_final != RouteRun.${run}.committed_minutes_provisional"
            - "RouteRun.${run}.status == DISPATCHED"
            - "RouteStop.${stop}.status == SCHEDULED"

  - rule_id: combinatorial_formula
    instances:
      - name: rush_floor_over_overage_discounted_base_mode_a
        grounds:
          - calculations.item_service_price
          - calculations.allowance_consumption_plan
          - entities.PlanTier.fields.overage_discount_pct
          - entities.ServiceRequest.fields.priority
          - entities.RequestItem.fields.charged_service_cents
        distinguishing_aspect: |
          Mode (a): four inputs (list price, damage multiplier, plan overage discount, rush policy)
          interact non-linearly through a nested max, and the allowance branch selects which of the
          two items even reaches the discount. The SALON_SHEAR absorbs the single included item and
          is still charged 500 because the rush floor beats 20 percent of zero, while the CHEF_KNIFE
          is discounted to 1721 and then also floored at 500, giving 2221.
        test_recipe:
          setup:
            - "Specs for CHEF_KNIFE (list 900, 6 min) and SALON_SHEAR (list 3200, 18 min, SHEAR certification)."
            - "PlanTier BLADE_BASIC with monthly_fee_cents 12000, included_items_per_cycle 1 and overage_discount_pct 0.15."
            - "An ACTIVE MONTHLY Subscription on a PER_VISIT account, allowance_remaining 1."
            - "A RUSH VAN_ROUTE request carrying one SALON_SHEAR (ROUTINE_HONE) and one CHEF_KNIFE (RE_TIP), delivered and invoiced."
          setup_api_calls:
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "CHEF_KNIFE", bevel_angle_degrees: 20, base_service_minutes: 6, list_price_cents: 900, required_certification: "NONE", price_tier: "TIER_1", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_chef: $.data.id }
            - call: "POST /sharpening/item-class-specs"
              payload: { item_class: "SALON_SHEAR", bevel_angle_degrees: 45, base_service_minutes: 18, list_price_cents: 3200, required_certification: "SHEAR", price_tier: "TIER_3", min_locker_size: "SMALL", loaner_eligible: true }
              as: PlatformAdmin
              captures: { spec_shear: $.data.id }
            - call: "POST /sharpening/plan-tiers"
              payload: { code: "BLADE_BASIC", monthly_fee_cents: 12000, included_items_per_cycle: 1, overage_discount_pct: 0.15, allowed_cadences: ["WEEKLY", "BIWEEKLY", "MONTHLY"] }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /sharpening/accounts"
              payload: { name: "Shear Bliss Salon", account_type: "SALON", zone_code: "ZONE_N", contact_email: "front@shearbliss.test", billing_mode: "PER_VISIT" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /sharpening/subscriptions"
              payload: { account_id: "${acct}", plan_tier_id: "${tier}", cadence: "MONTHLY", anchor_date: "2026-06-01" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sub: $.data.id }
            - call: "POST /sharpening/technicians"
              payload: { full_name: "Ada Grind", certifications: ["SERRATED", "CLIPPER", "SHEAR", "SLICER"] }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /sharpening/vans"
              payload: { code: "VAN-01" }
              as: PlatformAdmin
              captures: { van: $.data.id }
            - call: "POST /sharpening/bench-days"
              payload: { bench_date: "2026-05-01", bench_minute_budget: 480 }
              as: PlatformAdmin
              captures: { bench: $.data.id }
            - call: "POST /sharpening/service-requests"
              payload: { account_id: "${acct}", channel: "VAN_ROUTE", requested_date: "2026-05-01", subscription_id: "${sub}", priority: "RUSH" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { sr: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_shear}", item_class: "SALON_SHEAR", declared_damage_tier: "ROUTINE_HONE" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item_shear: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/items"
              payload: { item_class_spec_id: "${spec_chef}", item_class: "CHEF_KNIFE", declared_damage_tier: "RE_TIP" }
              as: AccountOwner
              as_user_id: "${acct}"
              captures: { item_chef: $.data.id }
            - call: "POST /sharpening/service-requests/${sr}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct}"
            - call: "POST /sharpening/route-runs"
              payload: { van_id: "${van}", technician_id: "${tech}", run_date: "2026-05-01", zone_code: "ZONE_N", service_minute_budget: 420, stop_cap: 8 }
              as: Dispatcher
              captures: { run: $.data.id, run_v: $.data.version }
            - call: "POST /sharpening/route-runs/${run}/stops"
              payload: { service_request_id: "${sr}", sequence: 1, arrival_window_start: "09:00", expected_route_run_version: "${run_v}" }
              as: Dispatcher
              captures: { stop: $.data.id }
            - call: "POST /sharpening/route-runs/${run}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /sharpening/route-stops/${stop}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /sharpening/service-requests/${sr}/pickup"
