              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${nox_id}/rata-tests"
              payload: { window_start_utc: "2026-08-02T00:00:00Z", window_end_utc: "2026-08-03T00:00:00Z", applicable_standard_value: 0.500 }
              as: QAAnalyst
              captures: { rata_n: $.data.id }
            - call: "POST /emissions/rata-tests/${rata_n}/runs"
              payload: { runs: [{ reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }, { reference_value: 0.400, cems_value: 0.380 }] }
              as: QAAnalyst
