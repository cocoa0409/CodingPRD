      - name: cascade_down_series_suspension_blocks_open_access_requests
        claim_type: side_effect_execution
        grounds:
          - state_machines.RecordSeries.ACTIVE_to_SUSPENDED
          - state_machines.AccessRequest.SCREENING_to_BLOCKED
          - state_machines.ConfidentialityScreening.OPEN_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / legal_hold_activation_three_hop_suspension_cascade
          rationale: "The three-hop cascade hold -> series -> request -> screening, with suspended_access_request_count and superseded_reason LEGAL_HOLD_BLOCK, is the entire assertion set of the named §1.8 instance."

      - name: bubble_up_plan_auto_satisfies_when_at_risk_units_reach_zero
        claim_type: side_effect_execution
        grounds:
          - state_machines.PreservationPlan.ACTIVE_to_SATISFIED
          - calculations.at_risk_unit_count
        excluded_because:
          difficulty_instance: transitive_cascade / migration_completion_two_hop_plan_satisfaction_cascade
          rationale: "Auto-transition of the parent plan once the last at-risk unit gains a surrogate is asserted end-to-end by the named §1.8 instance."

      - name: ledger_sync_and_compensation_of_plan_budget_on_job_cancellation
        claim_type: side_effect_execution
        grounds:
          - state_machines.MigrationJob.APPROVED_to_CANCELLED
          - calculations.preservation_budget_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / preservation_budget_committed_restored_exactly_by_job_cancellation
          rationale: "Commit-then-release of budget_committed_cents with zero drift is the conserved quantity the named §1.8 instance asserts before and after."

      - name: compensation_of_unit_custody_triple_on_exhibit_loan_return
        claim_type: side_effect_execution
        grounds:
          - state_machines.ArchivalItem.ON_LOAN_to_ACCESSIONED
          - calculations.unit_custody_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / unit_custody_triple_restored_exactly_by_exhibit_loan_return
          rationale: "Check-out then return restoring the exact shelf/loan/deaccessioned triple is the named §1.8 instance's conserved quantity."

      - name: guarded_transition_migration_start_requires_compliant_zone
        claim_type: precondition_enforcement
        grounds:
          - state_machines.MigrationJob.APPROVED_to_IN_PROGRESS
          - validations[priority=45]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / migration_job_cannot_start_while_zone_environment_marginal
          rationale: "The cross-entity guard on StorageZone.environmental_status is asserted, including the MARGINAL near-miss, by the named §1.8 instance."

      - name: parallel_axes_consent_and_transcription_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.OralHistoryInterview#consent_status
          - state_machines.OralHistoryInterview#transcription_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / oral_history_two_independent_state_axes_advance_separately
          rationale: "Independent advancement of the two axes and the resulting release_state ladder WITHHELD -> RESEARCH_ROOM_ONLY -> PUBLIC is the named §1.8 instance."

      - name: branching_fork_join_requires_both_clearances_before_approval
        claim_type: valid_transition
        grounds:
          - state_machines.DeaccessionProposal.LEGAL_CLEARED_to_DUALLY_CLEARED
          - state_machines.DeaccessionProposal.HERITAGE_CLEARED_to_DUALLY_CLEARED
        excluded_because:
          difficulty_instance: non_linear_state_machine / deaccession_fork_join_two_clearances_then_execute
          rationale: "Both fork orders converging on DUALLY_CLEARED and then APPROVED/EXECUTED are asserted by the named §1.8 instance."

  # ==========================================================================
  # §1.9 Section 3 — Calculations (Table 3)
  # ==========================================================================
  - section: calculations
    instances:

      - name: zone_status_compliant_exactly_at_18c_and_50pct_then_marginal_one_tenth_above
        claim_type: constants_applied
        grounds:
          - calculations.zone_environmental_status
          - calculations.zone_environmental_status.constants.TEMP_COMPLIANT_MAX_C
          - calculations.zone_environmental_status.constants.RH_COMPLIANT_MAX_PCT
        distinguishing_aspect: "Both COMPLIANT bounds are inclusive at exactly 18.0 C and 50.0 % RH; a single reading of 18.1 C with the same humidity drops the zone to MARGINAL (not NON_COMPLIANT, since 18.1 <= TEMP_MARGINAL_MAX_C 21.0) and reading_count advances from its creation value 1 to 2."
        test_recipe:
          setup:
            - "One StorageZone created at exactly the COMPLIANT ceilings 18.0 C / 50.0 % RH."
          setup_api_calls:
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-EDGE", temperature_c: 18.0, relative_humidity_pct: 50.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id, status_at_create: $.data.environmental_status }
          trigger:
            - call: "POST /storage-zones/${zone_id}/environment-readings"
              payload: { temperature_c: 18.1, relative_humidity_pct: 50.0 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
          assert:
            - "HTTP status is 200"
            - "${status_at_create} == COMPLIANT"
            - "StorageZone.${zone_id}.environmental_status == MARGINAL"
            - "StorageZone.${zone_id}.temperature_c == 18.1"
            - "StorageZone.${zone_id}.relative_humidity_pct == 50.0"
            - "StorageZone.${zone_id}.reading_count == 2"

      - name: at_risk_unit_count_sums_only_unloaned_tape_and_film_units
        claim_type: input_set_filtering
        grounds:
          - calculations.at_risk_unit_count
          - calculations.at_risk_unit_count.input_set
          - state_machines.PreservationPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: "Activation sums 5 (MAGNETIC_TAPE, UNPROCESSED) + 8 (FILM, UNPROCESSED) = 13 and excludes both the 40-unit PAPER item (format not in AT_RISK_FORMATS) and the 7-unit MAGNETIC_TAPE item that is ON_LOAN (status not in {UNPROCESSED, ACCESSIONED, IN_TREATMENT}) — a naive sum over the zone's tape and film would report 20."
        setup_notes: "All four items share one StorageZone; only the loaned item's accession is processed, so the other three remain UNPROCESSED."
        test_recipe:
          setup:
            - "One zone holding four items: TAPE 5 and FILM 8 and PAPER 40 all UNPROCESSED, plus TAPE 7 checked out on an exhibit loan."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "GEN-20", retention_years: 20, disposition_action: "REVIEW", legal_citation: "Corp Policy 3.1", min_appraisal_score_for_permanent: 78.00 }
              as: ArchivesDirector
              as_user_id: "director-a"
              captures: { sched_id: $.data.id }
            - call: "POST /record-series"
              payload: { title: "Broadcast Masters", business_unit: "Corporate Communications", retention_schedule_id: "${sched_id}", sensitivity_ceiling: "INTERNAL", annual_volume_linear_feet: 30, earliest_record_year: 1968, latest_record_year: 2004 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "Z-AR", temperature_c: 16.0, relative_humidity_pct: 42.0, max_overlapping_migration_jobs: 1 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Communications Vault", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 53 }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { acc_open_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_open_id}", storage_zone_id: "${zone_id}", item_label: "TAPE-A", unit_count: 5, condition_grade: "FAIR", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { tape_a_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_open_id}", storage_zone_id: "${zone_id}", item_label: "FILM-A", unit_count: 8, condition_grade: "FAIR", original_format: "FILM", sensitivity_level: "INTERNAL" }
              as: Archivist
              as_user_id: "archivist-a"
              captures: { film_a_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_open_id}", storage_zone_id: "${zone_id}", item_label: "PAPER-A", unit_count: 40, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL" }
