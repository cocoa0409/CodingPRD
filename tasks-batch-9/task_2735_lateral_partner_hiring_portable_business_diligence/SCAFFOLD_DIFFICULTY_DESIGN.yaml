      - name: book_totals_round_per_entry_then_sum_never_sum_then_round
        grounds:
          - calculations.portable_book_valuation
          - calculations.entry_validated_portable_amount
          - entities.PortabilityAssessment.fields.gross_baseline_total_usd
          - entities.PortabilityAssessment.fields.self_reported_total_usd
          - entities.PortabilityAssessment.fields.variance_pct
        distinguishing_aspect: |
          Mode (b): the fixture is engineered so BOTH totals land exactly one cent apart
          under the two rounding orders. Each entry's raw baseline ends in exactly half a
          cent (285000.285 and 171000.285), so round-then-sum gives 456000.58 while
          sum-then-round gives 456000.57; each entry's self-reported line likewise ends in
          half a cent (500000.005 and 1500000.005), so round-then-sum gives 2000000.02
          while sum-then-round gives 2000000.01. An implementation that defers rounding to
          the aggregate is off by 0.01 on two independent fields at once, and variance_pct
          shifts with them.
