              as: SortOperator
              captures: { pkg_q3: $.data.id }
            - call: "POST /airhub/packages/${pkg_q1}/induct"
              payload: { dimension_weight_grams: 100000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_q2}/induct"
              payload: { dimension_weight_grams: 100100 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_q3}/induct"
              payload: { dimension_weight_grams: 400 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_q1}/primary-sort"
