              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Fuel handling machine service", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 100, purpose: "DISCHARGE", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { res1_id: "$.data.id" }
            - call: "POST /pool-cell-reservations/${res1_id}/consume"
