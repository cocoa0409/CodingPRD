            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
