      - name: format_selection_prefers_market_when_feasible
        claim_type: correct_result
        grounds:
          - calculations.format_selection
        distinguishing_aspect: "Trade area (hh 5000, gap 40) makes DG_MARKET feasible (448000000 >= 220000000) — the selector picks the most capital-intensive feasible format and stamps build_cost_cents 700000000."
        test_recipe:
          setup: ["ACTIVE program; trade area B (drive 10, hh 5000, income 5000000, gap 40 -> score 79.72) QUALIFIED; store S created"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 3000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
