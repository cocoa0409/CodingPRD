  # ===========================================================================
  # Section 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: build_hours_floor_precision
        claim_type: precision
        grounds: [calculations.lead_time_estimation]
        distinguishing_aspect: "build_duration_hours uses integer floor( hours / 24 ): 30h build contributes 1 day, not 2 — ceil would be wrong."
        test_recipe:
          setup: ["account; chassis with build_duration_hours 30; component stock 10 (in stock, contributes 0)"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "CC1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cc1_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "CCL1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 30 }, as: PlatformAdmin, captures: { cc1_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CCC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { cc1_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${cc1_l}", component_id: "${cc1_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${cc1_a}"
                chassis_model_id: "${cc1_l}"
                component_selections: [{ component_id: "${cc1_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${cc1_a}"
              captures: { cc1_cf: $.data.id }
          trigger:
            - { call: "POST /api/configurations/${cc1_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${cc1_a}", captures: { cc1_lead: $.data.lead_time_estimate_days } }
          assert:
            - "Configuration.${cc1_cf}.lead_time_estimate_days == 1   # 0 (in stock) + floor(30/24) == 1"

      - name: min_qty_rule_violation_detected
        claim_type: input_set_filtering
        grounds: [calculations.lead_time_estimation, 'validations[priority=6]', 'errors[ERR_COMPATIBILITY_VIOLATION]']
        distinguishing_aspect: "A MIN_QTY rule requiring qty >= 2 of a memory component fails validation when the selection carries only 1 — the rule set is evaluated per-rule-type, not just ALLOWED membership."
        test_recipe:
          setup: ["account; chassis; MEM component ALLOWED plus MIN_QTY 2 rule; configuration with qty 1 of MEM"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "CC2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cc2_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "CCL2", category: "SERVER", base_price_cents: 200000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { cc2_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CCM2", kind: "MEMORY", price_cents: 9000, lead_time_days: 2, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { cc2_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${cc2_l}", component_id: "${cc2_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${cc2_l}", component_id: "${cc2_c}", rule_type: "MIN_QTY", min_qty: 2 }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${cc2_a}"
                chassis_model_id: "${cc2_l}"
                component_selections: [{ component_id: "${cc2_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${cc2_a}"
              captures: { cc2_cf: $.data.id }
          trigger:
            - { call: "POST /api/configurations/${cc2_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${cc2_a}", captures: { cc2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_COMPATIBILITY_VIOLATION (422)"
            - "Configuration.${cc2_cf}.status == DRAFT and compatibility_ok == false"

      - name: promised_ship_date_standard_tier_no_buffer
        claim_type: constants_applied
        grounds: [calculations.promised_ship_date]
        distinguishing_aspect: "STANDARD tier contributes 0 buffer and qty 49 stays below the bulk threshold — promised_ship_date is exactly submitted_at + committed lead time."
        test_recipe:
          setup: ["STANDARD account; chassis build 24h; component stock 100 lead 4 but in stock; config validated; order qty 49"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "CC3", account_tier: "STANDARD", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cc3_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "CCL3", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { cc3_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CCC3", kind: "CPU", price_cents: 20000, lead_time_days: 4, stock_on_hand: 100, revision: "A01" }, as: PlatformAdmin, captures: { cc3_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${cc3_l}", component_id: "${cc3_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${cc3_a}"
                chassis_model_id: "${cc3_l}"
                component_selections: [{ component_id: "${cc3_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${cc3_a}"
              captures: { cc3_cf: $.data.id }
            - { call: "POST /api/configurations/${cc3_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${cc3_a}", captures: { cc3_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${cc3_a}", po_number: "PO-CC3" }, as: CustomerUser, as_user_id: "${cc3_a}", captures: { cc3_o: $.data.id } }
            - { call: "POST /api/orders/${cc3_o}/lines", payload: { configuration_id: "${cc3_cf}", qty: 49, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${cc3_a}" }
          trigger:
            - { call: "POST /api/orders/${cc3_o}/submit", payload: { expected_configuration_version: "${cc3_cv}" }, as: CustomerUser, as_user_id: "${cc3_a}", captures: { cc3_psd: $.data.promised_ship_date } }
          assert:
            - "Order.${cc3_o}.promised_ship_date == '2026-09-02T00:00:00Z'   # 2026-09-01 + 1 day (in stock, build 1) + 0 tier buffer + 0 bulk (49 < 50)"

      - name: recovery_grade_poor_final_credit
        claim_type: correct_result
        grounds: [calculations.recovery_credit_reconciliation]
        distinguishing_aspect: "Grade poor yields 10% of unit price (12000c on a 120000c unit), verifying the grade-keyed constant table distinct from the 30% estimate and the 45% good grade."
