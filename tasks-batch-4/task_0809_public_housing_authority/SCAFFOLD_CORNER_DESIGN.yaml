      - name: request_missing_auth_returns_401
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A POST /pha/applicants sent with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED."
