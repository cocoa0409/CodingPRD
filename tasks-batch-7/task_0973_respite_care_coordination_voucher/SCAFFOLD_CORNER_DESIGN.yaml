        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_QUARTERLY_CAP_EXCEEDED]"]
        distinguishing_aspect: "With 60h reserved and granted adjusted to 100 (available 40), a 30h voucher fits available_hours but pushes the quarter load to 90 > 80 — ERR_QUARTERLY_CAP_EXCEEDED fires, proving the cap check is independent of raw availability."
        test_recipe:
          setup: ["Caregiver ACTIVE; voucher1 60.00h ISSUED; grant adjustment +20 applied (granted 100.00, available 40.00)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
