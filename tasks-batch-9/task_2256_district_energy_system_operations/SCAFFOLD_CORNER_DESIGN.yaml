      - name: pipe_segment_requires_an_existing_parent_loop
        claim_type: Parent Relationships
        grounds:
          - entities.PipeSegment.parent
          - endpoints[POST /district-energy/pipe-segments]
          - errors[ERR_LOOP_NOT_FOUND]
        distinguishing_aspect: "PipeSegment declares NetworkLoop as its parent, so a create quoting an unregistered loop_id returns HTTP 404 ERR_LOOP_NOT_FOUND and no segment row appears in the listing."
        test_recipe:
          setup:
            - "One registered NetworkLoop LOOP-Z1 so the listing endpoint has a scope to query."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
