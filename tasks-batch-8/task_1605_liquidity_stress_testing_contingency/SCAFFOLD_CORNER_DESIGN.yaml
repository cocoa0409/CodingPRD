  - section: cross_cutting_layers
    instances:
      - name: patch_playbook_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[playbook-update-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints[PATCH /liquidity/contingency-playbooks/{id}]"]
        distinguishing_aspect: "OCC on ContingencyPlaybook.version: a first PATCH succeeds (version 1 -> 2); a second PATCH carrying the stale captured version is rejected with ERR_STALE_VERSION (412) — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["BASELINE scenario; DRAFT playbook at version 1"]
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Base", tier: "BASELINE", deposit_runoff_pct: 5, wholesale_renewal_pct: 80, level2_addon_bps: 0, horizon_days: 30 }
              as: RiskOfficer
              captures: { sc: $.data.id }
            - call: "POST /liquidity/contingency-playbooks"
              payload: { name: "PB", scenario_id: "${sc}", min_activation_posture: "NORMAL", target_capacity_cents: 1000 }
              as: TreasuryAnalyst
              captures: { pb: $.data.id, pb_v1: $.data.version }
          trigger:
            - call: "PATCH /liquidity/contingency-playbooks/${pb}"
              payload: { expected_playbook_version: "${pb_v1}", name: "PB v2" }
              as: TreasuryAnalyst
              captures: { pb_v2: $.data.version }
            - call: "PATCH /liquidity/contingency-playbooks/${pb}"
              payload: { expected_playbook_version: "${pb_v1}", name: "PB v3" }
              as: TreasuryAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "pb_v2 == 2  (first patch succeeded and bumped version)"
            - "err == ERR_STALE_VERSION  (second patch carried the stale version 1)"

      - name: run_create_supersede_and_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[projection-run-create-stale-scenario]", state_machines.ProjectionRun.DRAFT_to_DISCARDED, "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on StressScenario.version combined with create-with-supersede: creating run B (same scenario + variant) with the current version succeeds and DISCARDS draft run A; a further create carrying the pre-run-A version fails with ERR_STALE_VERSION."
        test_recipe:
          setup: ["MODERATE scenario at version 1"]
          setup_api_calls:
            - call: "POST /liquidity/stress-scenarios"
              payload: { name: "Mod", tier: "MODERATE", deposit_runoff_pct: 10, wholesale_renewal_pct: 50, level2_addon_bps: 500, horizon_days: 10 }
              as: RiskOfficer
              captures: { sc: $.data.id, sc_v1: $.data.version }
