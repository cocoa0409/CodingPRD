              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 1 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_a}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { enrollment_a: $.data.id }
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_b}", group_session_id: "${session_id}", funding_preference: "PACKAGE_ONLY", request_waitlist: true }
              as: FrontDesk
              captures: { enrollment_b: $.data.id, status_b: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PerformanceDirector
              captures: { packages_expired_count: $.data.packages_expired_count }
          action:
            - call: "POST /enrollments/${enrollment_a}/cancel"
              payload: {}
              as: FrontDesk
              captures: { status_a: $.data.status }
          assertions:
            - "enrollment_b was created WAITLISTED (max_athletes 1) while the package was still ACTIVE and reserved a credit"
            - "the clock advance to 2026-08-10 swept package_b past its effective_expires_on 2026-08-05, so the sweep reported packages_expired_count == 1 and the package is EXPIRED"
            - "the action cancel returns 200 with $.data.status == 'CANCELED' (more than 24 h before start_at, so no LATE_CANCEL)"
            - "the freed slot triggers waitlist_promotion for enrollment_b; the promotion_allocation variant finds no eligible bucket because PACKAGE_ONLY forbids the drop-in bucket and the only package is EXPIRED"
            - "GET enrollment_b shows status 'CANCELED' with cancel_reason 'FUNDING_UNAVAILABLE', funding_source 'UNFUNDED' and charge_cents 0 -- the promotion does NOT return 402 to the cancelling caller"
            - "GET /group-sessions/${session_id} shows reserved_count 0 and waitlisted_count 0"

      - name: contract_tier_boundaries_selected_by_delivered_count
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: contract_rate_tier_read_before_delivered_counter_increment
          rationale: "team_contract_session_rate is the tiered_pricing rule; the cited §1.8 instance walks the CONTRACT_TIER_BREAKPOINT_1 2 and _2 5 boundaries and pins the off-by-one question of whether the tier is read before or after sessions_delivered is incremented."

      - name: readiness_decay_applied_per_elapsed_day_after_grace
        claim_type: decay_function
        excluded_because:
          difficulty_instance: readiness_decay_grace_boundary_at_day_30_versus_day_31_on_progress_report
          rationale: "athlete_readiness_index is the decay_function rule; the cited §1.8 instance sits exactly on DECAY_GRACE_DAYS 30 and one day past it, which is the boundary the guide asks for, and a second §1.8 instance covers the reset event via a fresh finalized battery."

      - name: screen_variant_divergence_between_intake_and_reassessment
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: movement_screen_intake_variant_scores_lower_than_reassessment_variant
          rationale: "Same raw screen data through both variants of movement_screen_risk_score, with the delta asserted, is exactly the cited §1.8 instance."

      - name: composite_variant_divergence_between_raw_and_maturity_adjusted
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: performance_composite_raw_norm_variant_diverges_from_maturity_adjusted_variant
          rationale: "The second dual-variant rule is performance_composite_percentile; the cited §1.8 instance runs identical metric values through the raw-norm and maturity-adjusted variants via MATURITY_OFFSET_TRIGGER_MONTHS 12 and asserts both results and the effective_age_years difference."

      - name: reconciliation_when_variant_switches_on_ledger
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: contract_slot_and_money_ledger_reversed_from_snapshots_on_void_completion
          rationale: "The only variant switch that touches a ledger is the reservation-to-completion path on the contract money ledger; the cited §1.8 instance asserts the delta applied on completion and its exact reversal from the persisted snapshots on void."

      - name: no_show_statement_aggregation_rounding
        claim_type: aggregation
        excluded_because:
          difficulty_instance: no_show_statement_rounds_each_line_before_summing_to_2476_not_2475
          rationale: "no_show_fee_statement_total is the aggregation rule whose running total is sensitive to per-line rounding; the cited §1.8 instance pins the 2476-versus-2475 divergence after three escalating strikes."

  # =========================================================================
  # SECTION 4 -- From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:

      - name: restricted_athlete_cannot_enroll_in_specific_prep_session
        claim_type: Violation -> Error
        claim: "An athlete whose training_clearance is RESTRICTED may only join GENERAL_PREP or TRANSITION sessions, so enrolling into a SPECIFIC_PREP session returns ERR_RESTRICTED_PHASE_NOT_PERMITTED"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Restricted Enroller", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 1, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 1, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 1, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 0, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 0, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
              captures: { risk_score: $.data.risk_score }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "SPECIFIC_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
          action:
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assertions:
            - "the finalize produced risk_score 12.00, at RISK_RESTRICTION_THRESHOLD, so the athlete is RESTRICTED"
            - "status 422"
            - "$.data.error_id == 'ERR_RESTRICTED_PHASE_NOT_PERMITTED'"
            - "the phase_focus is SPECIFIC_PREP rather than COMPETITION so the equally-ranked readiness gate cannot be the source of the error"
            - "no Enrollment row is created and reserved_count stays 0"

      - name: restricted_athlete_admitted_to_general_prep_session
        claim_type: Satisfaction -> Pass
        claim: "The same RESTRICTED athlete enrolls successfully into a GENERAL_PREP session: the phase restriction only fires for the disallowed phases"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Restricted But Allowed", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 1, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 1, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 1, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 0, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 0, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
          action:
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { enrollment_id: $.data.id }
          assertions:
            - "status 201"
            - "$.data.status == 'RESERVED' and $.data.funding_source == 'DROP_IN' with charge_cents 4500"
            - "GET /athletes/${athlete_id} still shows training_clearance 'RESTRICTED' -- the enrollment does not change the clearance"
            - "GET /group-sessions/${session_id} shows reserved_count 1 and athlete_units 1.0"

      - name: enrollment_after_start_at_returns_enrollment_window_closed
        claim_type: Temporal validation
        claim: "Once the clock reaches the session start_at the enrollment window is closed, so a new enrollment returns ERR_ENROLLMENT_WINDOW_CLOSED even though the session itself is still SCHEDULED"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Late Enroller", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T16:00:00Z" }
              as: PerformanceDirector
          action:
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assertions:
            - "status 409"
            - "$.data.error_id == 'ERR_ENROLLMENT_WINDOW_CLOSED'"
            - "the boundary is inclusive: start_at <= current clock closes the window, so equality already rejects"
            - "GET /group-sessions/${session_id} still shows session_status 'SCHEDULED' and reserved_count 0"

      - name: offsite_session_requires_offsite_location_and_onsite_forbids_it
        claim_type: Conditional validation
        claim: "The offsite_location field is conditionally required: it must be present when site_code is OFFSITE and must be absent when site_code is ONSITE"
        test_recipe:
          setup: []
          action:
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "OFFSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { err_missing: $.data.error_id }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8, offsite_location: "Northside High Gym" }
              as: PerformanceDirector
              captures: { err_extra: $.data.error_id }
          assertions:
            - "the OFFSITE call without offsite_location returns 422 with $.data.error_id == 'ERR_INVALID_REQUEST'"
            - "the ONSITE call carrying an offsite_location returns 422 with $.data.error_id == 'ERR_INVALID_REQUEST'"
            - "neither call creates a GroupSession row"

      - name: program_block_chain_gap_rejected_before_activation
        claim_type: Cascading validation
        claim: "The block chain check runs before the activation check: a block whose start_week leaves a gap after its predecessor is rejected at append time, and activating a program with zero blocks is rejected too"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Chain Gap Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /training-programs"
              payload: { athlete_id: "${athlete_id}", sport: "BASKETBALL", position: "GUARD", competition_start_date: "2026-11-01", competition_end_date: "2027-02-01" }
              as: PerformanceDirector
              captures: { program_gap: $.data.id }
            - call: "POST /training-programs/${program_gap}/blocks"
              payload: { expected_training_program_version: 1, phase: "GENERAL_PREP", start_week: 1, end_week: 4, target_intensity_pct: 60, weekly_volume_units: 20.00 }
              as: PerformanceDirector
              captures: { block_one: $.data.id }
            - call: "POST /training-programs"
              payload: { athlete_id: "${athlete_id}", sport: "BASKETBALL", position: "GUARD", competition_start_date: "2027-06-01", competition_end_date: "2027-08-01" }
              as: PerformanceDirector
              captures: { program_empty: $.data.id }
          action:
            - call: "POST /training-programs/${program_gap}/blocks"
              payload: { expected_training_program_version: 2, phase: "SPECIFIC_PREP", start_week: 6, end_week: 9, target_intensity_pct: 80, weekly_volume_units: 18.00, predecessor_block_id: "${block_one}" }
              as: PerformanceDirector
              captures: { err_gap: $.data.error_id }
            - call: "POST /training-programs/${program_empty}/activate"
              as: PerformanceDirector
              captures: { err_empty: $.data.error_id }
          assertions:
            - "the gap append returns 422 with $.data.error_id == 'ERR_PROGRAM_BLOCK_SEQUENCE_INVALID' because start_week 6 is not predecessor.end_week 4 plus 1"
            - "the OCC field was correct (version 2), so the failure is the chain check, not ERR_STALE_VERSION"
            - "GET /training-programs/${program_gap} still shows block_count 1 and version 2"
            - "the zero-block activation returns 422 with $.data.error_id == 'ERR_PROGRAM_BLOCK_SEQUENCE_INVALID' and program_empty stays DRAFT"

      - name: suspension_outranks_fiscal_credit_error
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: suspension_state_error_outranks_missing_session_credit_on_enrollment
          rationale: "The state layer (priority 8) versus the fiscal layer (priority 15) is the widest priority gap reachable on POST /enrollments, and the cited §1.8 instance violates both simultaneously and asserts the state error wins."

      - name: safety_layer_outranks_business_constraint_layer
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: medical_hold_safety_error_outranks_coach_ratio_error_on_offsite_enrollment
          rationale: "Athlete safety (priority 10) versus business constraint (priority 12) on the same POST /enrollments call is driven by the cited §1.8 instance, which also proves the loser fires on its own once the winner is cleared."

      - name: staff_safety_outranks_temporal_layer
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: staff_credential_error_outranks_staff_schedule_conflict_on_coach_assignment
          rationale: "Staff safety (priority 11) versus temporal (priority 13) on POST /group-sessions/{id}/coaches is driven by the cited §1.8 instance, which asserts both the winning and the losing error in isolation."

      - name: cross_entity_validation_depends_on_other_entity_state
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: roster_lock_blocked_until_staffing_recovers_from_staff_credential_state
          rationale: "lock-roster's validity depends entirely on the GroupSession staffing_status, which in turn depends on Certification state; the cited §1.8 instance tests the invalid and then the recovered valid case on the same session."

      - name: aggregate_validation_individually_valid_collectively_over_limit
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: aggregate_onsite_concurrency_cap_counts_overlaps_across_all_sessions
          rationale: "FACILITY_MAX_CONCURRENT_ONSITE 3 is the only aggregate limit: each individual session is legal but the fourth overlapping ONSITE session breaches the collective cap, which is exactly what the cited §1.8 instance asserts."

  # =========================================================================
  # SECTION 5 -- From Table 5 (Endpoints)
  # =========================================================================
  - section: endpoints
    instances:

      - name: staff_member_create_then_read_then_list_round_trip
        claim_type: Standard CRUD
        claim: "The StaffMember create path and the two Athlete read paths round-trip: a created staff member is retrievable and the created athletes appear in the list endpoint with correct pagination metadata"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
          action:
            - call: "POST /staff-members"
              payload: { full_name: "Coach Roundtrip", role_title: "HEAD_COACH", liability_insurance_expires_on: "2027-06-30" }
              as: PerformanceDirector
              captures: { staff_id: $.data.id }
            - call: "GET /staff-members/${staff_id}"
              as: PerformanceDirector
              captures: { credential_status: $.data.credential_status }
          assertions:
            - "the create returns 201 with $.data.role_title == 'HEAD_COACH', valid_certification_count 0, lapsed_certification_count 0, ceu_credits_earned_total 0, last_credential_review_at null and version 1"
            - "the read returns 200 with $.data.id == '${staff_id}' and the same field values"
            - "$.data.liability_insurance_expires_on == '2027-06-30'"

      - name: certification_renew_requires_ceu_credits_earned_to_reach_requirement
        claim_type: Action endpoint
        claim: "POST /certifications/{id}/renew enforces the CEU precondition: with fewer credits than ceu_credits_required it returns ERR_CEU_REQUIREMENT_NOT_MET, and once the requirement is met the renewal resets the credit counter and bumps renewal_count"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Renewal", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { staff_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${staff_id}", cert_code: "CSCS", issued_on: "2023-08-15", expires_on: "2026-08-15", ceu_credits_required: 6 }
              as: PerformanceDirector
              captures: { cert_id: $.data.id }
            - call: "POST /staff-members/${staff_id}/credential-review"
              as: PerformanceDirector
              captures: { credential_status: $.data.credential_status }
            - call: "POST /certifications/${cert_id}/ceu-credits"
              payload: { credits: 4 }
              as: PerformanceDirector
              captures: { earned_after_four: $.data.ceu_credits_earned }
          action:
            - call: "POST /certifications/${cert_id}/renew"
              payload: { new_expires_on: "2029-08-15" }
              as: PerformanceDirector
              captures: { err: $.data.error_id }
            - call: "POST /certifications/${cert_id}/ceu-credits"
              payload: { credits: 2 }
              as: PerformanceDirector
              captures: { earned_after_six: $.data.ceu_credits_earned }
            - call: "POST /certifications/${cert_id}/renew"
              payload: { new_expires_on: "2029-08-15" }
              as: PerformanceDirector
              captures: { renewal_count: $.data.renewal_count }
          assertions:
            - "the credential review moved the certification to EXPIRING (expires_on 2026-08-15 is within 30 days of the 2026-08-01 clock) and the staff member to credential_status 'EXPIRING'"
            - "after 4 credits $.data.ceu_credits_earned == 4, short of the required 6"
            - "the first renew returns 422 with $.data.error_id == 'ERR_CEU_REQUIREMENT_NOT_MET' and the certification stays EXPIRING with expires_on 2026-08-15"
            - "after the second credit grant $.data.ceu_credits_earned == 6, meeting the requirement inclusively"
            - "the second renew returns 200 with $.data.status == 'VALID', expires_on '2029-08-15', renewal_count 1 and ceu_credits_earned reset to 0"
            - "GET /staff-members/${staff_id} shows credential_status 'VALID' with valid_certification_count 1 and ceu_credits_earned_total 6 (the lifetime total is not reset)"

      - name: team_contract_athlete_link_requires_active_contract
        claim_type: Cross-reference link
        claim: "POST /team-contracts/{id}/athletes requires both entities to exist and the contract to be ACTIVE: linking against a DRAFT contract returns ERR_CONTRACT_NOT_ACTIVE, and after activation the same call sets Athlete.team_contract_id"
        test_recipe:
          setup:
            - call: "POST /athletes"
              payload: { full_name: "Contract Link Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /team-contracts"
              payload: { organization_name: "Eastside Club", organization_type: "CLUB", contracted_sessions: 8, base_rate_cents: 40000, offsite_allowance: 1, term_start: "2026-08-01", term_end: "2027-05-31" }
              as: PerformanceDirector
              captures: { contract_id: $.data.id }
          action:
            - call: "POST /team-contracts/${contract_id}/athletes"
              payload: { athlete_id: "${athlete_id}" }
              as: PerformanceDirector
              captures: { err: $.data.error_id }
            - call: "POST /team-contracts/${contract_id}/activate"
              as: PerformanceDirector
              captures: { contract_status: $.data.status }
            - call: "POST /team-contracts/${contract_id}/athletes"
              payload: { athlete_id: "${athlete_id}" }
              as: PerformanceDirector
              captures: { linked_contract_id: $.data.team_contract_id }
          assertions:
            - "the first link returns 422 with $.data.error_id == 'ERR_CONTRACT_NOT_ACTIVE' and GET the athlete still shows team_contract_id null"
            - "the activate returns 200 with $.data.status == 'ACTIVE' and sessions_available 8"
            - "the second link returns 200 and the response is the Athlete with $.data.team_contract_id == '${contract_id}'"

      - name: void_completion_blocked_when_any_enrollment_was_marked_no_show
        claim_type: Conditional action
        claim: "POST /group-sessions/{id}/void-completion is only allowed when no enrollment on the session was marked NO_SHOW; otherwise it returns ERR_VOID_BLOCKED_BY_NO_SHOW and the session stays COMPLETED"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach VoidBlock", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Void Block Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
