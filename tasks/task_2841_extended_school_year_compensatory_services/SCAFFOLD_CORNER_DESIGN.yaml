              as: CaseManager
              captures: { log1_id: $.data.id }
            - call: "POST /esy/service-logs"
              payload: { commitment_id: "${c1_id}", service_date: "2027-06-15", outcome: "MISSED_PARENT", minutes_scheduled: 60, minutes_delivered: 0, miss_reason_code: "PARENT_CANCELLED" }
