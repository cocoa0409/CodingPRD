            - "HedgePosition.${hp_id}.lots_committed == 4"

      - name: cancelling_with_market_loss_and_no_active_bid_returns_no_market_bid
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=30]
          - calculations.cancellation_damages
          - errors[ERR_NO_MARKET_BID]
        distinguishing_aspect: "The MARKET_LOSS eligibility filter admits only ACTIVE bids; once the only local bid is WITHDRAWN the candidate pool is empty and the cancel is refused with ERR_NO_MARKET_BID rather than silently pricing damages at zero."
        test_recipe:
          setup:
            - "Desk, elevator, SHORT 2026-12 hedge with 10 lots at 448, one FULLY_PRICED 20,000-bushel CASH contract, and the bid it was struck against subsequently WITHDRAWN."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
