# =============================================================================
# Task 1247: Campus Recruiting & Internship Program — §1.8 Test Targeting Index
# 2 instances per Difficulty Rule (18 total). Every recipe replays from empty
# DB using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — two dual-variant calculations on DIFFERENT
  # entity domains (Application screening score vs Offer exploding deadline)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: screening_score_provisional_vs_final
        grounds:
          - calculations.screening_score
          - entities.Application.fields.screening_score_provisional
          - entities.Application.fields.screening_score_final
        distinguishing_aspect: |
          Application-domain dual variant: the provisional variant (as_of =
          created_at, tier read at submission) and the final variant (as_of =
          screen-time clock, tier read at screen time) are both valid readings
          of "screening score" and produce 30 vs 55 for identical application
          data because two events completed and the tier changed in between.
        test_recipe:
          setup:
            - "Season (threshold 50) OPEN with school StateU tier TARGET; one COMPLETED RESUME_DROP event ending 2026-05-12; application submitted 2026-05-15 (provisional 30)"
            - "Two more events completed 2026-05-16/17 and school tier edited TARGET->CORE before screening; season advanced to SELECTION at 2026-05-21"
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 50, stipend_budget_cents: 1000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 100, stipend_region: "REGIONAL" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/campus-events"
              payload: { school_target_id: "${st_id}", event_type: "RESUME_DROP", start_at: "2026-05-12T10:00:00Z", end_at: "2026-05-12T12:00:00Z" }
              as: Recruiter
              captures: { ev1: $.data.id }
            - call: "POST /campus-recruiting/campus-events/${ev1}/complete"
              payload: { resume_count: 30 }
              as: Recruiter
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${cand_id}", school_target_id: "${st_id}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { app_id: $.data.id, prov: $.data.screening_score_provisional }
            - call: "POST /campus-recruiting/seasons/${sid}/campus-events"
              payload: { school_target_id: "${st_id}", event_type: "INFO_SESSION", start_at: "2026-05-16T10:00:00Z", end_at: "2026-05-16T12:00:00Z" }
              as: Recruiter
              captures: { ev2: $.data.id }
            - call: "POST /campus-recruiting/campus-events/${ev2}/complete"
              payload: { resume_count: 10 }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sid}/campus-events"
              payload: { school_target_id: "${st_id}", event_type: "CAREER_FAIR", start_at: "2026-05-17T10:00:00Z", end_at: "2026-05-17T12:00:00Z" }
              as: Recruiter
              captures: { ev3: $.data.id }
            - call: "POST /campus-recruiting/campus-events/${ev3}/complete"
              payload: { resume_count: 5 }
              as: Recruiter
            - call: "PATCH /campus-recruiting/school-targets/${st_id}"
              payload: { tier: "CORE", expected_school_target_version: "${st_v}" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
          trigger:
            - call: "POST /campus-recruiting/applications/${app_id}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
              captures: { fin: $.data.screening_score_final, app_status: $.data.status }
          assert:
            - "Application.${app_id}.screening_score_provisional == 30 (TARGET 25 + 1 completed event x 5, snapshot frozen at submission)"
            - "Application.${app_id}.screening_score_final == 55 (CORE 40 + 3 completed events x 5, evaluated at screen time)"
            - "${fin} == 55 and ${prov} == 30 and ${fin} != ${prov}"
            - "${app_status} == SHORTLISTED (55 >= threshold 50)"
      - name: exploding_deadline_wall_clock_vs_business_hours
        grounds:
          - calculations.exploding_offer_deadline
          - entities.Offer.fields.deadline_at
          - entities.RecruitingSeason.fields.deadline_policy_mode
        distinguishing_aspect: |
          Offer-domain dual variant (different entity domain than the
          Application screening score): identical extended_at (Friday
          2026-07-10T16:00:00Z) and identical 16 policy hours yield
          deadline_at 2026-07-11T08:00:00Z under WALL_CLOCK but
          2026-07-14T16:00:00Z under BUSINESS_HOURS.
        test_recipe:
          setup:
            - "Season A WALL_CLOCK and season B BUSINESS_HOURS, each with a school override of 16 exploding hours, each with one application driven to DECISION_PENDING and advanced to OFFER_PERIOD"
            - "Logical clock set to Friday 2026-07-10T16:00:00Z (inside both offer windows)"
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "SA", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 1000000, deadline_policy_mode: "WALL_CLOCK" }
              as: RecruitingAdmin
              captures: { sidA: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidA}/school-targets"
              payload: { school_name: "StateU", tier: "TARGET", application_cap: 10, stipend_region: "REGIONAL", exploding_offer_hours_override: 16 }
              as: RecruitingAdmin
              captures: { stA: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidA}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { candA: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidA}/applications"
              payload: { candidate_id: "${candA}", school_target_id: "${stA}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${candA}"
              captures: { appA: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sidA}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${appA}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sidA}/employees"
              payload: { full_name: "Eve A", email: "eva@co.com" }
              as: RecruitingAdmin
              captures: { evA: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidA}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { dayA: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${dayA}/interview-slots"
