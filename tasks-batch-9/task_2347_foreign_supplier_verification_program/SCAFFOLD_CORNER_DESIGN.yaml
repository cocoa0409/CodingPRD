              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ERR_RECORD_NOT_FOUND"

      - name: get_corrective_action_with_unknown_id_returns_corrective_action_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CORRECTIVE_ACTION_NOT_FOUND
          - validations[priority=12]
        distinguishing_aspect: "CorrectiveAction rows are only ever created by cascade, so the 404 path must exist even though no client can POST one."
        test_recipe:
          setup:
            - "Clock set; no corrective action has been raised."
