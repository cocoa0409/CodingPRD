            - "units_scrapped == 0, units_reworked == 0, material_writeoff_cents == 0, relabel_cost_cents == 0, changeover_base_cents == 0, changeover_expedite_cents == 0, total_changeover_cost_cents == 0 and reversal_count == 0"
