            - call: "POST /slate/program-blocks"
              payload: { season_id: "${season_id}", name: "Friday Premieres", block_start: "2027-11-05T00:00:00Z", premiere_cadence_days: 7, max_encores_per_title: 2, min_minutes_between_airings: 1440 }
              as: ProgrammingExec
              captures: { block_id: $.data.id }
            - call: "POST /slate/program-blocks/${block_id}/publish"
              payload: {}
