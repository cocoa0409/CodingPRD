  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: pricing_policy_legal_review_revision_cycle_twice
        grounds:
          - state_machines.PricingPolicy.DRAFT_to_IN_LEGAL_REVIEW
          - state_machines.PricingPolicy.IN_LEGAL_REVIEW_to_DRAFT
          - state_machines.PricingPolicy.IN_LEGAL_REVIEW_to_APPROVED
          - state_machines.PricingPolicy.APPROVED_to_PUBLISHED
          - entities.PricingPolicy.fields.revision_number
          - entities.PricingPolicy.fields.legal_review_notes
          - entities.PricingPolicy.fields.reviewed_by_user_id
        distinguishing_aspect: |
          Cycle on the PricingPolicy entity: DRAFT -> IN_LEGAL_REVIEW -> DRAFT is
          traversed twice before approval, so revision_number reaches 3 and
          PricingPolicy.version reaches 8 after exactly 7 mutations — a linear
          DRAFT->REVIEW->APPROVED->PUBLISHED reading cannot produce either number.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z (the documented default)."
            - "One DRAFT PricingPolicy MAP-2026-E created by the channel manager, revision_number 1, version 1, legal_review_notes null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-E", cure_window_days: 10, suspension_points_threshold: 6, termination_points_threshold: 12 }
              as: BrandChannelManager
              captures: { pol_id: $.data.id, rev0: $.data.revision_number, v0: $.data.version }
          trigger:
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
              captures: { st1: $.data.status }
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "RETURN", legal_review_notes: "First pass: tighten the non-negotiation language." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { st2: $.data.status, rev1: $.data.revision_number }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "RETURN", legal_review_notes: "Second pass: clarify the shipping definition." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { rev2: $.data.revision_number }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Antitrust review cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
              captures: { final_status: $.data.status, final_rev: $.data.revision_number, final_v: $.data.version }
          assert:
            - "${rev0} == 1 and ${v0} == 1"
            - "${st1} == IN_LEGAL_REVIEW and ${st2} == DRAFT (the machine returns to its own initial_state — a cycle, not a pipeline)"
            - "${rev1} == 2 and ${rev2} == 3 (revision_number increments once per RETURN, never on APPROVE or PUBLISH)"
            - "${final_rev} == 3 and PricingPolicy.${pol_id}.revision_number == 3"
            - "${final_status} == PUBLISHED and PricingPolicy.${pol_id}.effective_from == 2026-08-01T00:00:00Z"
            - "PricingPolicy.${pol_id}.legal_review_notes == 'Antitrust review cleared.' (only the most recent review decision is retained)"
            - "PricingPolicy.${pol_id}.reviewed_by_user_id == counsel-2 and PricingPolicy.${pol_id}.published_by_user_id == counsel-2"
            - "${final_v} == 8 and PricingPolicy.${pol_id}.version == 8 (7 mutations: submit, return, submit, return, submit, approve, publish)"
            - "PricingPolicy.${pol_id}.superseded_by_policy_id == null (no other policy was PUBLISHED, so the supersede branch is a no-op)"

      - name: reseller_supply_axis_moves_without_authorization_axis
        grounds:
          - state_machines.Reseller.OPEN_to_HOLD_QUALITY_OBLIGATION
          - state_machines.Reseller.HOLD_to_OPEN
          - state_machines.ResellerAgreement.ACTIVE_to_EXPIRED
          - entities.Reseller.fields.authorization_status
          - entities.Reseller.fields.supply_status
          - entities.Reseller.fields.hold_reason
        distinguishing_aspect: |
          Parallel state dimensions on the Reseller row (a different entity from the
          cyclic PricingPolicy): supply_status travels OPEN -> HOLD(QUALITY_OBLIGATION)
          -> OPEN -> HOLD(AGREEMENT_EXPIRED) across three mutations while
          authorization_status stays AUTHORIZED throughout.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-F published effective_from 2026-08-01T00:00:00Z."
            - "Reseller AUTHORIZED / OPEN / hold_reason NONE under an ACTIVE agreement whose term_ends_at is 2026-09-01T00:00:00Z."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-F", non_negotiation_ack_required: true }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /resellers"
              payload: { legal_name: "Bravo Retail LLC", contact_email: "notices@bravoretail.example", primary_channel: "OWN_WEBSITE" }
              as: BrandChannelManager
              captures: { rs_id: $.data.id }
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${rs_id}", policy_id: "${pol_id}", permitted_channels: ["OWN_WEBSITE"], quality_obligations: ["PACKAGING_INTACT"], term_ends_at: "2026-09-01T00:00:00Z", price_terms_included: false }
              as: BrandChannelManager
              captures: { ag_id: $.data.id }
            - call: "POST /reseller-agreements/${ag_id}/send"
              payload: {}
              as: BrandChannelManager
            - call: "POST /reseller-agreements/${ag_id}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${rs_id}"
            - call: "POST /reseller-agreements/${ag_id}/activate"
              payload: {}
              as: BrandChannelManager
            - call: "GET /resellers/${rs_id}"
              payload: {}
              as: BrandChannelManager
              captures: { v_active: $.data.version, auth_active: $.data.authorization_status, supply_active: $.data.supply_status }
          trigger:
            - call: "POST /resellers/${rs_id}/supply-status"
              payload: { supply_status: "HOLD", hold_reason: "QUALITY_OBLIGATION", note: "Packaging-intact obligation breach found in audit." }
              as: BrandChannelManager
              captures: { auth_hold: $.data.authorization_status, supply_hold: $.data.supply_status, reason_hold: $.data.hold_reason }
            - call: "POST /resellers/${rs_id}/supply-status"
              payload: { supply_status: "OPEN" }
              as: BrandChannelManager
              captures: { auth_reopen: $.data.authorization_status, supply_reopen: $.data.supply_status, reason_reopen: $.data.hold_reason }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enforcement-sweeps"
              payload: {}
              as: BrandChannelManager
              captures: { swept_agreements: $.data.expired_agreements, swept_resellers: $.data.reinstated_resellers }
          assert:
            - "${auth_active} == AUTHORIZED and ${supply_active} == OPEN"
            - "${auth_hold} == AUTHORIZED and ${supply_hold} == HOLD and ${reason_hold} == QUALITY_OBLIGATION (the authorization axis does not move when the supply axis does)"
            - "${auth_reopen} == AUTHORIZED and ${supply_reopen} == OPEN and ${reason_reopen} == NONE"
            - "${swept_agreements} == 1 and ${swept_resellers} == 0"
            - "ResellerAgreement.${ag_id}.status == EXPIRED and ResellerAgreement.${ag_id}.closed_reason == TERM_EXPIRED"
            - "Reseller.${rs_id}.supply_status == HOLD and Reseller.${rs_id}.hold_reason == AGREEMENT_EXPIRED"
            - "Reseller.${rs_id}.authorization_status == AUTHORIZED (agreement expiry moves the supply axis only)"
            - "Reseller.${rs_id}.terminated_at == null and Reseller.${rs_id}.suspension_ends_at == null"
            - "Reseller.${rs_id}.version == ${v_active} + 3 (hold, re-open, sweep-driven hold — three mutations on one row across two independent axes)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: termination_notice_cascades_reseller_agreement_serial_units
        grounds:
          - state_machines.Reseller.SUSPENDED_to_TERMINATED
          - state_machines.ResellerAgreement.ACTIVE_to_TERMINATED
          - state_machines.SerialUnit.SHIPPED_TO_RESELLER_to_RECALLED
          - state_machines.Violation.NOTICED_to_CLOSED_MOOT
          - calculations.ladder_rung_selection
          - calculations.violation_points
          - validations[priority=12]
          - entities.Reseller.fields.terminated_at
        distinguishing_aspect: |
          A depth-4 cascade fired by one POST /enforcement-notices that resolves to
          rung TERMINATION: notice -> Reseller (TERMINATED / CUT_OFF) -> ResellerAgreement
          (TERMINATED, closed_reason SUPPLY_TERMINATED) -> SerialUnit (RECALLED), with a
