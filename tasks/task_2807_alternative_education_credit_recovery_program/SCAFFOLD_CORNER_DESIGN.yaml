# §1.9 Scaffold Corner Design (Breadth Index)
# Walked row-by-row against references/claim-extraction-guide.md over this scaffold's §1.1-§1.7
# surface. Corners already asserted by a §1.8 instance appear as excluded_because stubs.
# Every numeric literal below was computed by executing the §1.3 formula against the pinned setup.
# Logical clock: the server starts at 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_home_school_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.HomeSchool
          - endpoints.POST_home_schools
          - calculations.cohort_accountability
        distinguishing_aspect: "A POST /home-schools with the three input fields returns 201 and every declared field, including the empty-cohort derivations cohort_size 0, graduates_count 0, alt_ed_placed_count 0, adjusted_grad_rate null and cohort_flag NOT_RATED."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
          assert:
            - "HTTP 201 and the body carries data.id, data.created_at, data.updated_at and data.version == 1"
            - "HomeSchool.${hs_id}.name == 'North High', district_code == 'NHS-01', accountability_cohort_year == 2026"
            - "HomeSchool.${hs_id}.cohort_size == 0, graduates_count == 0, alt_ed_placed_count == 0"
            - "HomeSchool.${hs_id}.adjusted_grad_rate == null and cohort_flag == NOT_RATED (the cohort_size == 0 branch of cohort_accountability)"

      - name: get_center_returns_stored_and_derived_seat_fields
        claim_type: retrieval
        grounds:
          - entities.Center
          - endpoints.GET_centers_center_id
          - calculations.center_intake_posture
        distinguishing_aspect: "GET /centers/{id} echoes the stored staffing inputs and recomputes the seat ledger on read: seats_committed 0, seats_available 20, student_teacher_ratio 0.00, staffing_headroom 24, intake_posture OPEN."
        test_recipe:
          setup: ["one center with seat_capacity 20, certified_teacher_fte 2.00, support_staff_fte 1.50, max_students_per_teacher 12"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 20, certified_teacher_fte: 2.00, support_staff_fte: 1.50, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "GET /centers/${ctr_id}"
              payload: {}
              as: DistrictAdmin
          assert:
            - "HTTP 200 with Center.${ctr_id}.seat_capacity == 20, certified_teacher_fte == 2.00, support_staff_fte == 1.50, max_students_per_teacher == 12"
            - "Center.${ctr_id}.active_student_count == 0, seats_reserved == 0, seats_committed == 0, seats_available == 20"
            - "Center.${ctr_id}.student_teacher_ratio == 0.00, staffing_headroom == 24, intake_posture == OPEN"
            - "Center.${ctr_id}.version == 1 (a read never bumps the version)"

      - name: list_courses_returns_filtered_collection
        claim_type: listing
        grounds:
          - endpoints.GET_courses
          - entities.Course.fields.subject_area
        distinguishing_aspect: "GET /courses?subject_area=MATH returns exactly the one MATH catalog row of the two created, inside the declared list envelope."
        test_recipe:
          setup: ["two catalog courses: ALG1 in MATH and ENG1 in ELA"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_a: $.data.id }
            - call: "POST /courses"
              payload: { code: "ENG1", title: "English I", subject_area: "ELA", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_b: $.data.id }
          trigger:
            - call: "GET /courses"
              payload: {}
              as: DistrictAdmin
          assert:
            - "HTTP 200 and the unfiltered list contains exactly 2 rows, ${crs_a} and ${crs_b}"
            - "GET /courses?subject_area=MATH returns exactly 1 row whose id == ${crs_a}"
            - "GET /courses?modality=ONLINE returns 0 rows"
            - "every row carries id, created_at, updated_at and version"

      - name: get_student_unknown_id_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_students_student_id
          - errors.ERR_STUDENT_NOT_FOUND
          - validations.priority_3
        distinguishing_aspect: "GET /students/{id} for an id that was never minted returns 404 ERR_STUDENT_NOT_FOUND, and the same holds for a well-formed id belonging to a different entity type."
        test_recipe:
          setup: ["one home school exists so that a valid id of another type is available"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
          trigger:
            - call: "GET /students/${hs_id}"
              payload: {}
              as: Registrar
          assert:
            - "HTTP 404 with error_id ERR_STUDENT_NOT_FOUND (the id is a real HomeSchool id, so type confusion must not resolve it)"
            - "the response body carries no data payload for a Student"
            - "GET /students/00000000-0000-0000-0000-000000000000 also returns 404 ERR_STUDENT_NOT_FOUND"

      - name: create_center_missing_required_seat_capacity_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_centers
          - errors.ERR_INVALID_REQUEST
          - validations.priority_5
        distinguishing_aspect: "POST /centers without seat_capacity returns 422 ERR_INVALID_REQUEST and creates nothing; seat_capacity has no default and is not inferable from staffing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /centers"
              payload: { name: "Cedar AEC", certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /centers returns 0 rows"

      - name: create_support_provider_applies_max_concurrent_default
        claim_type: defaults
        grounds:
          - entities.SupportProvider.fields.max_concurrent_students
          - endpoints.POST_support_providers
        distinguishing_aspect: "Omitting the optional max_concurrent_students on POST /support-providers applies the declared default of 1, so a single intersecting session already saturates the provider."
        test_recipe:
          setup: ["one center"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id }
          trigger:
            - call: "POST /support-providers"
              payload: { center_id: "${ctr_id}", role_type: "BEHAVIOR_SPECIALIST", full_name: "Ada Kell" }
              as: DistrictAdmin
              captures: { prov_id: $.data.id }
          assert:
            - "HTTP 201 with SupportProvider.${prov_id}.max_concurrent_students == 1 (the declared default)"
            - "SupportProvider.${prov_id}.completed_session_count == 0 and role_type == BEHAVIOR_SPECIALIST"

      - name: prior_record_grade_code_computed_client_value_ignored
        claim_type: computed_fields
        grounds:
          - entities.PriorCourseRecord.fields.original_grade_code
          - entities.PriorCourseRecord.fields.replacement_status
          - endpoints.POST_prior_course_records
        distinguishing_aspect: "original_grade_code is derived from original_percent by the published bands (59.50 rounds into the F band boundary test: 59.50 < 60 so F), and replacement_status always starts NOT_REPLACED regardless of what the client sends."
        test_recipe:
          setup: ["one home school, one student and one catalog course"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-1101", full_name: "Bo Nguyen", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /prior-course-records"
              payload: { student_id: "${stu_id}", course_id: "${crs_id}", term_code: "2025-S1", original_percent: 59.50, credits_attempted: 1.00, outcome: "FAILED" }
              as: Registrar
              captures: { pcr_id: $.data.id }
          assert:
            - "HTTP 201 with PriorCourseRecord.${pcr_id}.original_grade_code == 'F' (59.50 is below the 60 D band floor)"
            - "PriorCourseRecord.${pcr_id}.replacement_status == NOT_REPLACED"
            - "Student.${stu_id}.credits_earned_total == 0.00 (a FAILED row contributes no credits) and gpa == 0.00 (the F row counts in the GPA denominator with 0.000 quality points)"

      - name: create_course_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints.POST_courses
          - entities.Course
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server on POST /courses; the endpoint's input: list does not accept them, so a client cannot pin them."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { code: "BIO1", title: "Biology I", subject_area: "SCIENCE", credit_value: 1.00, modality: "ONLINE", total_modules: 10, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: true, proctored_exam_weight: 0.40, ncaa_approved: true, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id, crs_created: $.data.created_at }
          assert:
            - "HTTP 201 with Course.${crs_id}.version == 1 and created_at == updated_at == ${crs_created}"
            - "Course.${crs_id}.id is server-minted and GET /courses/${crs_id} returns the same row"
            - "Course.${crs_id}.proctoring_required == true and proctored_exam_weight == 0.40"

      - name: create_course_invalid_modality_enum_returns_422
        claim_type: type_constraints
        grounds:
          - entities.Course.fields.modality
          - errors.ERR_INVALID_REQUEST
          - validations.priority_5
        distinguishing_aspect: "modality accepts only ONLINE, PACKET or BLENDED; the value HYBRID is refused with 422 ERR_INVALID_REQUEST rather than silently coerced."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { code: "GEO1", title: "Geometry", subject_area: "MATH", credit_value: 1.00, modality: "HYBRID", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /courses returns 0 rows"

      - name: create_course_credit_value_not_quarter_multiple_returns_422
        claim_type: type_constraints
        grounds:
          - entities.Course.fields.credit_value
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "credit_value must be a multiple of 0.25 inside 0.25..2.00; 0.30 is refused with 422 ERR_INVALID_REQUEST, which is what keeps the quarter-credit award granularity meaningful."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { code: "ART1", title: "Art I", subject_area: "ELECTIVE", credit_value: 0.30, modality: "PACKET", total_modules: 4, required_seat_hours: 30.00, pacing_days: 20, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /courses returns 0 rows"

      - name: create_student_unknown_home_school_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Student.fields.home_school_id
          - errors.ERR_HOME_SCHOOL_NOT_FOUND
          - validations.priority_6
        distinguishing_aspect: "A body FK that names no existing HomeSchool row returns 404 ERR_HOME_SCHOOL_NOT_FOUND at priority 6, after request-shape validation but before any business rule."
        test_recipe:
          setup: ["one course exists so a syntactically valid id of the wrong type is available"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { code: "ALG1", title: "Algebra I", subject_area: "MATH", credit_value: 1.00, modality: "PACKET", total_modules: 8, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: false, ncaa_approved: false, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { home_school_id: "${crs_id}", state_student_id: "S-1201", full_name: "Cyd Marek", cohort_year: 2027, grade_level: 11 }
              as: Registrar
          assert:
            - "HTTP 404 with error_id ERR_HOME_SCHOOL_NOT_FOUND"
            - "GET /students returns 0 rows"

      - name: referral_center_fk_integrity_rejects_unknown_center
        claim_type: flat_topology
        grounds:
          - entities.Referral.fields.center_id
          - errors.ERR_CENTER_NOT_FOUND
          - validations.priority_6
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so Referral carries center_id as a body FK rather than a nested path segment; an unknown center_id is rejected with 404 ERR_CENTER_NOT_FOUND even though the student_id resolves."
        test_recipe:
          setup: ["one home school with one student, and one center whose id will be deliberately replaced by a foreign id"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-1301", full_name: "Dov Klein", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${hs_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 4.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
          assert:
            - "HTTP 404 with error_id ERR_CENTER_NOT_FOUND (a HomeSchool id must not satisfy a Center FK)"
            - "GET /referrals?student_id=${stu_id} returns 0 rows"

  - section: state_machines
    instances:
      - name: new_referral_starts_in_submitted_state
        claim_type: initial_state
        grounds:
          - state_machines.Referral.initial_state
          - calculations.referral_priority_score
        distinguishing_aspect: "A freshly created referral sits in the declared initial_state SUBMITTED with missing_items, waitlist_reason and offer_expires_on all null and promoted_from_waitlist false; priority_score is already computed at 0.5300 for deficiency 6.00 / behaviour 1 / disengaged 6 on the CREDIT_DEFICIENCY pathway."
        test_recipe:
          setup: ["one home school, one center and one student"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-2101", full_name: "Eli Rosa", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6, narrative: "six credits short" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
          assert:
            - "HTTP 201 with Referral.${ref_id}.status == SUBMITTED and version == 1"
            - "Referral.${ref_id}.priority_score == 0.5300"
            - "Referral.${ref_id}.missing_items == null, waitlist_reason == null, offer_expires_on == null, promoted_from_waitlist == false"
            - "Center.${ctr_id}.seats_reserved == 0 (a submitted referral reserves nothing) and intake_posture == OPEN"

      - name: screen_moves_referral_submitted_to_screening
        claim_type: valid_transition
        grounds:
          - state_machines.Referral.SUBMITTED_to_SCREENING
          - endpoints.POST_referrals_referral_id_screen
        distinguishing_aspect: "POST /referrals/{id}/screen moves SUBMITTED -> SCREENING, records the screening_note and bumps Referral.version to 2 without touching the center's seat ledger."
        test_recipe:
          setup: ["one SUBMITTED referral at a center with seat_capacity 10"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-2201", full_name: "Fay Oduya", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/screen"
              payload: { screening_note: "records reviewed with the counselor" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          assert:
            - "HTTP 200 with Referral.${ref_id}.status == SCREENING and version == 2"
            - "Referral.${ref_id}.screening_note == 'records reviewed with the counselor'"
            - "Center.${ctr_id}.seats_reserved == 0, seats_available == 10 and version == 1 (screening moves no seat)"

      - name: offer_from_submitted_state_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Referral.SCREENING_to_PLACEMENT_OFFERED
          - errors.ERR_REFERRAL_STATE_INVALID
          - validations.priority_10
        distinguishing_aspect: "The offer transition requires status SCREENING; offering an un-screened SUBMITTED referral returns 409 ERR_REFERRAL_STATE_INVALID and reserves no seat, even though the center is OPEN and the version token is fresh."
        test_recipe:
          setup: ["one SUBMITTED referral (never screened) at an OPEN center with seat_capacity 10"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-2301", full_name: "Gus Halim", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          assert:
            - "HTTP 409 with error_id ERR_REFERRAL_STATE_INVALID"
            - "Referral.${ref_id}.status == SUBMITTED, offer_expires_on == null and version == 1"
            - "Center.${ctr_id}.seats_reserved == 0, seats_available == 10 and version == 1 (a rejected transition fires no side effect)"

      - name: accept_offer_side_effects_create_placement_and_commit_seat
        claim_type: side_effect_execution
        grounds:
          - state_machines.Referral.PLACEMENT_OFFERED_to_ACCEPTED
          - state_machines.Placement.initial_state
          - calculations.center_seat_conservation_invariant
          - endpoints.POST_referrals_referral_id_accept_offer
        distinguishing_aspect: "Accepting an offer fires four declared side effects in one request: Referral -> ACCEPTED, a new ACTIVE Placement with the chosen credit_policy, Student -> PLACED_ALT, and the seat moving from seats_reserved to active_student_count with seats_committed unchanged at 1."
        test_recipe:
          setup: ["one screened referral holding an outstanding offer at a center with seat_capacity 10 (seats_reserved 1, active_student_count 0)"]
          setup_api_calls:
            - call: "POST /home-schools"
              payload: { name: "North High", district_code: "NHS-01", accountability_cohort_year: 2026 }
              as: DistrictAdmin
              captures: { hs_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-2401", full_name: "Hal Ibarra", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/accept-offer"
              payload: { credit_policy: "SEAT_TIME", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_id: $.data.id }
          assert:
