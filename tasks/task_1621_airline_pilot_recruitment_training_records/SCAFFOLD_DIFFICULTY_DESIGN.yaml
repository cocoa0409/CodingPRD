            - { call: "POST /pilot-training/applicants/${apA}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${apA}", request_type: "PRIA" }, as: Recruiter, captures: { rrA: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rrA}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rrA}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rrA}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${apA}", cert_class: "FIRST", issued_at: "2026-02-10T00:00:00Z", pilot_age_at_issue: 45 }, as: CrewScheduler, captures: { mcA: $.data.id } }
            - { call: "POST /pilot-training/applicants/${apA}/clear", payload: {}, as: Recruiter, captures: { snrA: $.data.seniority_number } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Jnr Bay", email: "jnr@x.com", license_number: "L311", total_flight_hours: 4000 }, as: Recruiter, captures: { apB: $.data.id } }
            - { call: "POST /pilot-training/applicants/${apB}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${apB}", request_type: "PRIA" }, as: Recruiter, captures: { rrB: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rrB}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rrB}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rrB}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${apB}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 33 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${apB}/clear", payload: {}, as: Recruiter, captures: { snrB: $.data.seniority_number } }
            - { call: "POST /pilot-training/bid-periods", payload: { equipment_id: "${eq_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-05T00:00:00Z", seats_available: 1 }, as: CrewScheduler, captures: { bp: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/bid-periods/${bp}/open", payload: {}, as: CrewScheduler }
            - { call: "POST /pilot-training/bids", payload: { bid_period_id: "${bp}", applicant_id: "${apA}", preference_rank: 1 }, as: CrewScheduler, captures: { bidA: $.data.id } }
            - { call: "POST /pilot-training/bids", payload: { bid_period_id: "${bp}", applicant_id: "${apB}", preference_rank: 1 }, as: CrewScheduler, captures: { bidB: $.data.id } }
            - { call: "POST /pilot-training/bid-periods/${bp}/close", payload: {}, as: CrewScheduler }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/_ops/run-daily-scan", payload: {}, as: SystemAdmin }
            - { call: "GET /pilot-training/medical-certificates/${mcA}", payload: {}, as: CrewScheduler, captures: { mcA_status: $.data.status } }
          trigger:
            - { call: "POST /pilot-training/bid-periods/${bp}/award", payload: {}, as: CrewScheduler }
            - { call: "GET /pilot-training/bids/${bidA}", payload: {}, as: CrewScheduler, captures: { bidA_status: $.data.status, bidA_reason: $.data.denial_reason } }
            - { call: "GET /pilot-training/bids/${bidB}", payload: {}, as: CrewScheduler, captures: { bidB_status: $.data.status } }
          assert:
            - "Applicant.${apA}.seniority_number == 1 and Applicant.${apB}.seniority_number == 2 (clear order pinned by request order)"
            - "MedicalCertificate.${mcA}.status == DOWNGRADED at award time"
            - "Bid.${bidA}.status == DENIED and Bid.${bidA}.denial_reason == INELIGIBLE (senior bidder filtered by another entity's state)"
            - "Bid.${bidB}.status == AWARDED"
            - "Applicant.${apB}.current_equipment_id == ${eq_id}"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: simulator_slot_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_SLOT_TEMPORAL_OVERLAP]
          - entities.SimulatorSlot.fields.start_at
        distinguishing_aspect: |
          Resource SimulatorSlot, half-open [start, end) semantics inside a
          containing window: an existing SCHEDULED booking 09:00-11:00 admits a
          back-to-back booking starting exactly 11:00 (adjacency allowed), but a
          booking 10:59-12:00 is rejected — one minute of overlap flips the
          verdict.
        test_recipe:
          setup:
            - "Enrollment IN_PROGRESS at phase SIMULATOR; slot window 08:00-18:00; first booking 09:00-11:00 SCHEDULED"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B788", name: "Boeing 787-8", simulator_cost_per_hour_cents: 55000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Cal Mew", email: "cal@x.com", license_number: "L320", total_flight_hours: 2500 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 31 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Deb Sim", instructor_type: "CHECK_AIRMAN", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ca1: $.data.id } }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Edd Sim", instructor_type: "SIMULATOR", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ins_s: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ca1}", phase: "GROUND_SCHOOL", event_type: "MILESTONE", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { ev_gm: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_gm}/complete", payload: { score: 88 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/simulator-slots", payload: { equipment_id: "${eq_id}", start_at: "2026-08-11T08:00:00Z", end_at: "2026-08-11T18:00:00Z" }, as: TrainingCoordinator, captures: { slot: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T11:00:00Z" }, as: TrainingCoordinator, captures: { ev_s1: $.data.id } }
          trigger:
            # Adjacent (allowed) booking 11:00-13:00 with a DIFFERENT instructor
            # to avoid tripping the instructor buffer rule (30-min gap).
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Fio Sim", instructor_type: "SIMULATOR", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ins_s2: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s2}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T11:00:00Z", scheduled_end: "2026-08-11T13:00:00Z" }, as: TrainingCoordinator, captures: { ev_s2: $.data.id } }
            # Overlapping booking 10:59-12:00 with a third instructor -> reject
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Geo Sim", instructor_type: "SIMULATOR", daily_max_sessions: 8 }, as: TrainingCoordinator, captures: { ins_s3: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s3}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T10:59:00Z", scheduled_end: "2026-08-11T12:00:00Z" }, as: TrainingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "adjacent booking succeeded: TrainingEvent.${ev_s2}.status == SCHEDULED (half-open semantics: 11:00 start touching an 11:00 end is not an overlap)"
            - "overlapping booking returns 409 error_id == ERR_SLOT_TEMPORAL_OVERLAP (10:59 < 11:00 collides)"
      - name: instructor_buffer_gap_semantics
        grounds:
          - validations[priority=12]
          - errors[ERR_INSTRUCTOR_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Resource Instructor with BUFFER interval semantics — the mirror image
          of the slot rule: two non-overlapping events with a 15-minute gap are
          REJECTED (buffer < 30 minutes), while a 30-minute gap is accepted;
          mere adjacency (gap 0), which the slot resource allows, is forbidden
          for instructors.
        test_recipe:
          setup:
            - "Same IN_PROGRESS-at-SIMULATOR setup shape as the slot instance; one instructor ins_s already teaches 09:00-11:00; the same instructor is booked 11:15-13:00 (15-minute gap) and separately 11:30-13:30 (exactly 30-minute gap)"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B789", name: "Boeing 787-9", simulator_cost_per_hour_cents: 55000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Hal Nyx", email: "hal@x.com", license_number: "L330", total_flight_hours: 2600 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
