            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
          assert:
            - "${units_before} == 15"
            - "${cl1_status_after_reject} == REWORK and ${cl1_rework_cycles} == 1"
            - "${units_mid} == 5 (exactly 15 minus EquipmentUnit.${e1}.weight_units of 10)"
            - "EquipmentUnit.${e1}.verification_status == PREFUNCTIONAL_VERIFIED after the re-verification"
            - "CxProject.${p}.verified_prefunctional_units == 15 after the re-verification, with zero drift"
            - "PrefunctionalChecklist.${cl1}.status == VERIFIED and PrefunctionalChecklist.${cl1}.rework_cycle_count == 1"
