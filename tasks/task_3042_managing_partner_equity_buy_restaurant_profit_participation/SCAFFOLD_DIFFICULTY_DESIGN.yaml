# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3042_managing_partner_equity_buy_restaurant_profit_participation
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: profit_provisional_includes_open_items_final_drops_them
        grounds:
          - calculations.restaurant_profit_computation
          - state_machines.ProfitPeriod.OPEN_to_COMPUTED
          - state_machines.ProfitPeriod.COMPUTED_to_FINALIZED
        distinguishing_aspect: |
          Same posted data, two variants on DIFFERENT inclusion sets: the
          provisional compute counts PROVISIONAL line items at amount_cents,
          while the final variant reads FINALIZED items at actual_amount_cents —
          a PROVISIONAL item left out of finalize changes provisional vs final
          by exactly its amount, and actualization changes it by the delta.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-10T00:00:00Z. Restaurant R1 ACTIVE with an ACTIVE managing-partner contract (partner P1, buy-in 2500000 paid)."
            - "ProfitPeriod P [2027-01-01, 2027-02-01) OPEN with: REVENUE 10000000 FINALIZED (actual 10000000), LABOR 3000000 PROVISIONAL, COST_OF_GOODS 2000000 FINALIZED (actual 2000000), CORPORATE_ADMIN_FEE 500000 FINALIZED (actual 500000, partner_basis EXCLUDED)."
            - "No meat batches."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c1_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c1_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c1_id}/buy-in-payments"
              payload: { amount_cents: 2500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
            - call: "POST /api/managing-partner-contracts/${c1_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-01-01", period_end_date: "2027-02-01" }
              as: OperationsAuditor
              captures: { pp1_id: $.data.id, pp1_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/profit-periods/${pp1_id}/line-items"
              payload: { category: "REVENUE", amount_cents: 10000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp1_v}" }
              as: OperationsAuditor
              captures: { li_rev: $.data.id, pp1_v2: $.data.version }
            - call: "GET /api/profit-periods/${pp1_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp1_v3: $.data.version }
            - call: "POST /api/profit-periods/${pp1_id}/line-items"
              payload: { category: "LABOR", amount_cents: 3000000, entry_status: "PROVISIONAL", expected_profit_period_version: "${pp1_v3}" }
              as: OperationsAuditor
              captures: { li_lab: $.data.id }
            - call: "GET /api/profit-periods/${pp1_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp1_v4: $.data.version }
            - call: "POST /api/profit-periods/${pp1_id}/line-items"
              payload: { category: "COST_OF_GOODS", amount_cents: 2000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp1_v4}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp1_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp1_v5: $.data.version }
            - call: "POST /api/profit-periods/${pp1_id}/line-items"
              payload: { category: "CORPORATE_ADMIN_FEE", amount_cents: 500000, entry_status: "FINALIZED", expected_profit_period_version: "${pp1_v5}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp1_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp1_v6: $.data.version }
            - call: "POST /api/profit-periods/${pp1_id}/compute"
              payload: { expected_profit_period_version: "${pp1_v6}" }
              as: OperationsAuditor
          trigger:
            - call: "POST /api/line-items/${li_lab}/finalize"
              payload: { actual_amount_cents: 3100000 }
              as: OperationsAuditor
            - call: "POST /api/profit-periods/${pp1_id}/finalize"
              payload: {}
              as: CorporateController
            - call: "GET /api/profit-periods/${pp1_id}"
              payload: {}
              as: CorporateController
          assert:
            - "after compute: ProfitPeriod.${pp1_id}.provisional_profit_cents == 5000000 (REVENUE 10000000 - LABOR 3000000 - COGS 2000000; CORPORATE_ADMIN_FEE excluded as a partner_basis EXCLUDED corporate charge)"
            - "after finalize: ProfitPeriod.${pp1_id}.final_distributable_profit_cents == 4900000 (LABOR actualized to 3100000)"
            - "provisional_profit_cents != final_distributable_profit_cents — the two variants diverge by exactly the LABOR actualization delta 100000"
            - "CORPORATE_ADMIN_FEE of 500000 appears in NEITHER variant (excluded corporate charge)"

      - name: override_net_group_basis_vs_per_restaurant_positive
        grounds:
          - calculations.market_partner_override
          - entities.MarketPartnerAgreement.fields.basis
        distinguishing_aspect: |
          Same finalized restaurant profit (6000000), two agreement variants on
          DIFFERENT bases: NET_GROUP_BASIS divides by the group restaurant count
          (2) before the 5% override (150000), PER_RESTAURANT_POSITIVE takes 5%
          of the restaurant's own positive profit (300000).
        test_recipe:
          setup:
            - "Logical clock at 2027-03-05T00:00:00Z. Market group G ACTIVE with ACTIVE restaurants R1 and R2. Market partner P2 certified."
            - "Agreement A on G: override_pct 5, coverage [2027-01-01, 2027-12-31] inclusive, basis NET_GROUP_BASIS — ACTIVE."
            - "R1 has ACTIVE contract C1; period PP2 [2027-02-01, 2027-03-01) OPEN with REVENUE 9000000 FINALIZED, COST_OF_GOODS 3000000 FINALIZED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-groups"
              payload: { name: "Central TX" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX", market_group_id: "${g1_id}" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse B", city: "Waco", state_code: "TX", market_group_id: "${g1_id}" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/restaurants/${r2_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/market-groups/${g1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/partners"
              payload: { full_name: "Kim Voss", email: "kv@x.com", role_in_program: "MARKET_PARTNER" }
              as: HRRecruiter
              captures: { p2_id: $.data.id }
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c1_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c1_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c1_id}/buy-in-payments"
              payload: { amount_cents: 2500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
            - call: "POST /api/managing-partner-contracts/${c1_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/market-partner-agreements"
              payload: { partner_id: "${p2_id}", market_group_id: "${g1_id}", coverage_start_date: "2027-01-01", coverage_end_date: "2027-12-31", override_pct: 5, basis: "NET_GROUP_BASIS" }
              as: CorporateController
              captures: { ag1_id: $.data.id }
            - call: "POST /api/market-partner-agreements/${ag1_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods"
