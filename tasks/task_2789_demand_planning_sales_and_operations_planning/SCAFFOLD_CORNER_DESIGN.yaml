          setup:
            - "The base family (units_per_hour 100, max_monthly_hours 800) and customer, a MATURE item priced at 750 cents with material_supply_cap_units 100000, avg_monthly_demand_units 1000 (safety_stock_units 330) and on_hand 0."
            - "A 10-hour block inside 2026-09 (1000 units) and one locked forecast of 20000 units, so the PLANNED SupplyPlan has constrained_units 1000 and shortfall_units 19330. The cycle is walked to SCENARIO_REVIEW."
            - "Two CAPACITY_INVESTMENT scenarios on the same item: S-100 buying 100 hours and S-99 buying 99 hours."
