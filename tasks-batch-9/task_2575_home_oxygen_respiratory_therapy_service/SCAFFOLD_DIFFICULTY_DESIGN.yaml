            - "Nothing about the contract blocks the resume: its cap position is 1 of 36, no placement is recalled, the patient is ACTIVE, and its own SUSPENDED -> ACCRUING transition exists — only the linked certificate's state refuses it"
            - "Placement.${pl_id}.status == PLACED AND EquipmentUnit.${u_stat}.status == DEPLOYED: the certificate expiry stops the money, not the oxygen"

      - name: travel_approval_blocked_when_patient_on_compliance_hold
        grounds:
          - validations[priority=53]
          - errors[ERR_PATIENT_ON_COMPLIANCE_HOLD]
          - calculations.oxygen_safety_risk_score
          - calculations.travel_supply_authorization
          - entities.Patient.fields.compliance_hold
          - state_machines.TravelAuthorization.REQUESTED_to_APPROVED
          - endpoints[POST /home-oxygen/placements/{placement_id}/malfunction]
        distinguishing_aspect: |
          Entity pair TravelAuthorization -> Patient (a different pair from
          RentalContract -> CertificateOfMedicalNecessity above): an already-created REQUESTED
          authorization becomes un-approvable purely because a malfunction report re-scored the
          Patient row to exactly 70.00 and set compliance_hold, without any field of the
          authorization changing.
