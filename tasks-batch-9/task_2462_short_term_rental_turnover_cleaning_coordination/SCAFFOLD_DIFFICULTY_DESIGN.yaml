        grounds:
          - state_machines.Turnover.AWAITING_VERIFICATION_to_REWORK_REQUIRED
          - state_machines.Turnover.REWORK_REQUIRED_to_AWAITING_VERIFICATION
          - state_machines.ChecklistTask.SUBMITTED_to_REJECTED
          - state_machines.ChecklistTask.REJECTED_to_SUBMITTED
          - entities.Turnover.fields.rework_round
          - calculations.cleaner_pay_line
        distinguishing_aspect: |
          The Turnover leaves AWAITING_VERIFICATION backwards into REWORK_REQUIRED on a single
