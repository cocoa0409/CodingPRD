          assert:
            - "${first_state} == \"ISSUED\", ${first_method} == \"SUBSTANTIAL_TRANSFORMATION\" and ${first_country} == \"VN\""
            - "HTTP 409 and ${err} == \"ERR_ORIGIN_STATE_INVALID\""
            - "${method_after} == \"SUBSTANTIAL_TRANSFORMATION\", ${country_after} == \"VN\" and ${issued_after} == ${first_issued_at}"
