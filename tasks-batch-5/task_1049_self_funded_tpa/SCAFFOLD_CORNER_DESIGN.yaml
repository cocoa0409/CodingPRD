            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_id}" }
              as: FundManager
              captures: { fa: $.data.id }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c}"] }
              as: FundManager
              captures: { cr1: $.data.id }
          trigger:
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c}"] }
              as: FundManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 ERR_CLAIM_ALREADY_IN_CHECK_RUN"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_fund_version_on_release_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[check-run-release-stale-fund]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A release carrying an expected_fund_account_version captured before a later deposit advanced the fund version is rejected with 412 ERR_STALE_VERSION; the two requests run strictly one after the other."
        test_recipe:
          setup: ["Plan (ded 0); provider; member; adjudicated claim (plan_paid 48000); fund; DRAFT check-run; fund version captured after first deposit, then a second deposit bumps the version."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 0, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_id}" }
              as: FundManager
              captures: { fa: $.data.id }
            - call: "POST /fund-accounts/${fa}/deposit"
              payload: { amount_cents: 60000 }
              as: FundManager
              captures: { fa_v_stale: $.data.version }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c}"] }
              as: FundManager
              captures: { cr: $.data.id }
            - call: "POST /fund-accounts/${fa}/deposit"
              payload: { amount_cents: 1 }
              as: FundManager
          trigger:
            - call: "POST /check-runs/${cr}/release"
              payload: { expected_fund_account_version: "${fa_v_stale}" }
              as: FundManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 412 ERR_STALE_VERSION"
            - "Claim.${c}.status == ADJUDICATED (release did not apply)"

      - name: occ_correct_fund_version_release_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
