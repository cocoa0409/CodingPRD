  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_locker_create_stale_member_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[locker-overage-stale-tier]"
          - endpoints
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Creating a Locker with expected_member_version one behind the member's current version (after a topup bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "MAKER member; client observes member.version then a topup advances it; client retries locker create with the stale version."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
