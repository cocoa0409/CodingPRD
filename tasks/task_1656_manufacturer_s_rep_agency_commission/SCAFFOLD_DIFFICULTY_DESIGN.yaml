            - "STATEMENT_PAYMENT entries: rep ${r1} -34815 (-(34,800 + 15)); rep ${r2} -23210"
            - "after settle: Rep.${r1}.commission_balance_cents == 0 and Rep.${r2}.commission_balance_cents == 0"
            - "Order.${o1}.commission_status == SETTLED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggering transitions)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: rma_receipt_chargeback_balance_hold_cascade
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_CLOSED
          - state_machines.Rep.ACTIVE_to_COMMISSION_HOLD
          - state_machines.SampleCheckout.OPEN_to_CHARGED
          - calculations.sample_depreciation_charge
          - calculations.chargeback_amount
        distinguishing_aspect: |
          Depth-3 chain triggered by RMA receive (link1: CHARGEBACK entries post;
          link2: the entry posting recomputes the rep's commission balance;
          link3: the balance drop flips the rep ACTIVE->COMMISSION_HOLD). The
          rep's balance is pre-lowered to +15,000c by an independent overdue
          sample charge (85,000c after 31 days at 15%/month on 100,000c list),
          so the -100,000c chargeback drives the balance to exactly -85,000c,
          below the -50,000c hold floor.
        test_recipe:
          setup:
            - "principal P2 (quota 100,000,000), agreement [NV] ACTIVE, schedule CONNECTORS 1000bp tier0-only, rep RH [NV], customer CH spec/ship NV"
            - "Order PO-H invoiced: L1 CONNECTORS 100x10000 = 1,000,000c -> sole rep RH SPECIFY 10000 -> ACCRUAL +100,000; RH balance 100,000"
            - "sample unit U1 (value 100,000c) checked out by RH at 2026-08-01, due 2026-08-31"
            - "clock 2026-09-01 -> sweep charges overdue checkout: 31 days -> 1 month started -> factor 8500bp -> SAMPLE_CHARGE -85,000; RH balance 15,000; checkout CHARGED, unit WRITTEN_OFF"
