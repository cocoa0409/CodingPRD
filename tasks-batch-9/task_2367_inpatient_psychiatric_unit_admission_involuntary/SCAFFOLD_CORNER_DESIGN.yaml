  - section: errors
    instances:
      - name: every_error_family_returns_the_same_envelope_and_declared_status
        claim_type: triggerable
        grounds:
          - response_envelope.error
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_EVALUATION_NOT_SIGNED]
        distinguishing_aspect: "Every rejection - 400 schema, 404 existence, 409 state - must come back as response_type \"error\" with exactly error_id and message under data and the HTTP status declared in the catalog, and the schema check at priority 3 must outrank the existence and state checks that the same request also violates."
        test_recipe:
          setup:
            - "Roster: one intake clinician; one adult patient; one evaluation left in DRAFT (never signed)."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-EV", legal_name: "Envelope Case", age_years: 44, gender_care_category: "FEMALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_ev: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_ev}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Draft only, intentionally unsigned." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_ev: $.data.id }
          trigger:
            - call: "GET /behavioral-health/units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_404: $.data.error_id, msg_404: $.data.message }
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_ev}", evaluation_id: "00000000-0000-4000-8000-000000000000", hold_type: "EMERGENCY_14D" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { err_400: $.data.error_id }
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_ev}", evaluation_id: "${e_ev}", hold_type: "EMERGENCY_72H" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { err_409: $.data.error_id }
          assert:
            - "the first call is HTTP 404 with ${err_404} == \"ERR_UNIT_NOT_FOUND\", response_type == \"error\", ${msg_404} a non-empty string, and data carrying no keys other than error_id and message"
            - "the second call is HTTP 400 with ${err_400} == \"ERR_INVALID_REQUEST\": the priority-3 schema check on hold_type outranks the priority-6 evaluation-existence check that the same body also violates, so ${err_400} != \"ERR_EVALUATION_NOT_FOUND\""
            - "the third call is HTTP 409 with ${err_409} == \"ERR_EVALUATION_NOT_SIGNED\" - a schema-valid, existence-valid request reaching the priority-13 state gate"
            - "no HoldOrder row exists for patient ${p_ev} after the three rejections, and EmergencyEvaluation.${e_ev}.status is still \"DRAFT\" with version unchanged - rejected requests mutate nothing"
            - "roll-up: taken together with the remaining corner instances and SCAFFOLD_DIFFICULTY_DESIGN.yaml, each of the 49 catalog codes is triggered by at least one recipe in this scaffold"

      - name: unit_posture_blocked_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_UNIT_POSTURE_BLOCKED]
        excluded_because:
          difficulty_instance: unit_posture_reserve_order_blocks_placement_with_free_bed
          rationale: "That instance already returns ERR_UNIT_POSTURE_BLOCKED from POST /admissions/{id}/place while a bed sits AVAILABLE, which is the only way to reach the code."

      - name: safety_search_incomplete_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_SAFETY_SEARCH_INCOMPLETE]
        excluded_because:
          difficulty_instance: place_safety_search_precedes_room_cohort_check
          rationale: "That instance places an admission whose contraband search is still outstanding and asserts the priority-24 code verbatim."

      - name: room_cohort_violation_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_ROOM_COHORT_VIOLATION]
        excluded_because:
          difficulty_instance: place_safety_search_precedes_room_cohort_check
          rationale: "The same instance's second placement attempt, after the search is completed, surfaces ERR_ROOM_COHORT_VIOLATION on an explicitly named bed."

      - name: hold_not_active_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_HOLD_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: petition_hold_state_precedes_filing_window
          rationale: "Filing a petition against an uncertified PENDING_CERTIFICATION hold there returns ERR_HOLD_NOT_ACTIVE at priority 15."

      - name: petition_window_closed_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_PETITION_WINDOW_CLOSED]
        excluded_because:
          difficulty_instance: petition_hold_state_precedes_filing_window
          rationale: "The same instance's second attempt files past petition_filing_deadline_at against an ACTIVE hold and asserts the 422."

      - name: capacity_lacking_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_CAPACITY_LACKING]
        excluded_because:
          difficulty_instance: convert_to_voluntary_requires_active_capacity_determination_true
          rationale: "Conversion with no determination, and again with capacity_present false, both return ERR_CAPACITY_LACKING there."

      - name: surrogate_scope_insufficient_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_SURROGATE_SCOPE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: surrogate_consent_requires_active_determination_with_medication_scope
          rationale: "That instance triggers the code twice - once for a NONE-scope determination and once for a SUPERSEDED but correctly scoped one."

      - name: advocate_docket_conflict_is_triggerable
        claim_type: triggerable
        grounds:
          - errors[ERR_ADVOCATE_DOCKET_CONFLICT]
        excluded_because:
          difficulty_instance: advocate_docket_thirty_minute_buffer_boundary
          rationale: "The 29-minute-gap hearing there is rejected with ERR_ADVOCATE_DOCKET_CONFLICT while the 30-minute gap is accepted."

  - section: rbac
    instances:
      - name: exclusive_operations_of_other_roles_are_rejected
        claim_type: denied
        grounds:
