              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${accF}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${accF}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${accF}"
              captures: { v_act: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v_act}" }
              as: BillingAdmin
              captures: { ord1: $.data.id }
            - call: "POST /api/orders/${ord1}/charge"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/orders/${ord1}/settle-charge"
