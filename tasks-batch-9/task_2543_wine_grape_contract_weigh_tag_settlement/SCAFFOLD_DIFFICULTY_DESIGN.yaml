            - "Hop 2: the CONTRACT-bucket SettlementLine of ${tag2_id} has status == VOID and voided_at == 2026-08-26T09:00:00Z; the SettlementLine of ${tag1_id} is untouched at status PROVISIONAL"
            - "Hop 3: GrapeContract.${contract_id}.delivered_contract_tons == 22.000, rejected_tons == 0.000 and tonnage_status == OPEN"
            - "Hop 3: GrapeContract.${contract_id}.provisional_settlement_cents == 6415200, down from 11178000"
            - "Hop 4: PickCall.${pick_id}.status == ISSUED, acknowledged_at == null, issued_at == 2026-08-26T09:00:00Z and ack_deadline_at == 2026-08-27T09:00:00Z"
            - "Compensation is partial and declared: DeliveryAppointment.${appt3_id}.status is STILL CANCELLED, CrushPadLane.${lane_id}.committed_tons is STILL 0.000 and PickCall.${pick_id}.appointed_tons is STILL 0.000"
            - "PickCall.${pick_id}.delivered_net_tons == 22.000 and fulfillment_pct == 48.9"

  # ===========================================================================
  # RULE 5 — priority-pair validation conflicts (three different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_grower_outranks_lane_window_conflict
        pair: "business_safety (priority 31, ERR_GROWER_SUSPENDED, 403) vs business_constraint (priority 33, ERR_LANE_WINDOW_CONFLICT, 409)"
        grounds:
          - validations.priority_31
          - validations.priority_33
          - entities.CrushPadLane.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          Category pair SAFETY over CONSTRAINT. One request violates both: the producer has been
          suspended AND the requested 16:00-18:00 window overlaps the 30-minute turnaround buffer
          of an existing 14:00-16:00 appointment (buffered to [13:30, 16:30)). The 403 safety
          error must win; reinstating the producer and repeating the identical request then
          surfaces the 409 constraint error, proving both rules were live.
        test_recipe:
          setup:
            - "Producer, block, reference QualitySpec, lane L1 with turnaround_buffer_minutes 30 and daily_capacity_tons 80.000, crew."
            - "ACTIVE contract, completed PICK_READY sampling visit, acknowledged pick call with target_pick_at 2026-08-25T14:00:00Z."
            - "One SCHEDULED appointment on L1 from 14:00 to 16:00 planned 22.000."
            - "The producer is then suspended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/crush-pad-lanes"
              payload: { lane_code: "L1", daily_capacity_tons: 80.000, turnaround_buffer_minutes: 30, max_load_tons: 40.0 }
              as: HarvestCoordinator
              captures: { lane_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-SAFETY", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_SPOT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 60.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 40.000 }
              as: HarvestCoordinator
              captures: { pick_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_id}/acknowledge"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 22.000 }
              as: HarvestCoordinator
              captures: { appt1_id: $.data.id }
            - call: "POST /grower-relations/growers/${grower_id}/suspend"
              payload: { reason: "expired producer license on file" }
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T16:00:00Z", window_end: "2026-08-25T18:00:00Z", planned_tons: 18.000 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/growers/${grower_id}/reinstate"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T16:00:00Z", window_end: "2026-08-25T18:00:00Z", planned_tons: 18.000 }
              as: HarvestCoordinator
          assert:
            - "The first trigger call returns 403 with error_id == ERR_GROWER_SUSPENDED, NOT 409 ERR_LANE_WINDOW_CONFLICT"
            - "After the reinstate, the identical third call returns 409 with error_id == ERR_LANE_WINDOW_CONFLICT"
            - "No DeliveryAppointment was created by either failed call: CrushPadLane.${lane_id}.scheduled_appointment_count == 1 and committed_tons == 22.000"
            - "Grower.${grower_id}.status == ACTIVE after the reinstate"

      - name: pick_window_temporal_outranks_lane_daily_capacity
        pair: "business_temporal (priority 35, ERR_APPOINTMENT_OUTSIDE_PICK_WINDOW, 422) vs business_fiscal (priority 44, ERR_LANE_DAILY_CAPACITY_EXCEEDED, 409)"
        grounds:
          - validations.priority_35
          - validations.priority_44
          - entities.CrushPadLane.fields.daily_capacity_tons
        distinguishing_aspect: |
          A DIFFERENT category pair from the first instance — TEMPORAL over FISCAL — on the same
          endpoint but with neither of the first instance's two rules involved. Lane L1 has
          daily_capacity_tons 30.000 with 22.000 already booked on 2026-08-25; the request asks
          for 09:00-11:00 (five hours BEFORE the pick call's target_pick_at) with planned_tons
          15.000 (which would make the day 37.000). The 422 temporal error must win. Moving the
          same 15.000 tons to a legal 20:00-22:00 window then yields the 409 fiscal error.
        test_recipe:
          setup:
            - "Producer, block, reference QualitySpec, crew, and lane L2 with daily_capacity_tons 30.000, turnaround_buffer_minutes 30 and max_load_tons 40.0."
            - "ACTIVE contract, completed PICK_READY sampling visit, acknowledged pick call with target_pick_at 2026-08-25T14:00:00Z."
