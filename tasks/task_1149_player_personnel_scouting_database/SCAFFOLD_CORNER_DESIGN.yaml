  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: reports_list_filters_by_status
        claim_type: standard_crud
        grounds: ['endpoints["GET /scouting/reports"]']
        distinguishing_aspect: "Filtered list returns only LOCKED reports when status=LOCKED is supplied."
        test_recipe:
          setup: ["scout s, director d; prospects p1, p2 each with a report by s; only r1 is locked"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "D", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P1", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P2", position: "WR", college: "B" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 8.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
          trigger:
            - call: "GET /scouting/reports"
              payload: { status: "LOCKED", scout_id: "${s1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "exactly one report returned and it is ${r1} (LOCKED); ${r2} (DRAFT) excluded"
            - "total_count == 1"

      - name: response_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data per the fixed envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Env", level: "AREA" }
              as: GeneralManager
              captures: { sid: $.data.id }
          assert:
            - "response contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == \"object\" and data carries the Scout fields"

      - name: video_tag_attached_to_draft_report
        claim_type: cross_reference_link
        grounds: ['endpoints["POST /scouting/reports/{id}/video-tags"]', "entities.VideoTag"]
        distinguishing_aspect: "Video tags link to their report and are listed back via the report sub-resource; VideoTag has no version field (common_fields false)."
        test_recipe:
          setup: ["scout s; prospect p with DRAFT report r"]
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA" }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P", position: "QB", college: "A" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /scouting/reports/${r1}/video-tags"
              payload: { clip_url: "https://video.example/c1", start_sec: 10, end_sec: 42, tag: "ATHLETICISM" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { vt: $.data.id }
            - call: "GET /scouting/reports/${r1}/video-tags"
              as: AreaScout
              as_user_id: "${s1}"
              captures: { listed: "$.data[0].id" }
          assert:
            - "created tag ${vt} is returned by the report's video-tags list"
            - "tag record has no version/updated_at fields (immutable event-like entity)"

