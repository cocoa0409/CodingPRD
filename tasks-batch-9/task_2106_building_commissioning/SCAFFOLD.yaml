    roles: [CxAuthority]
    code: 201
    input: [project_id, title, expected_project_version]
    output: CxPlan
    side_effects: ["every prior CxPlan of the project moves to SUPERSEDED", "increments CxProject.version by 1"]

  - method: GET
    path: "/cx-plans"
    description: "List commissioning plans"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "CxPlan[]"
    side_effects: []

  - method: GET
    path: "/cx-plans/{id}"
    description: "Read one commissioning plan including its pinned requirement set"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: CxPlan
    side_effects: []

  - method: POST
    path: "/cx-plans/{id}/approve"
    description: "Owner approves the plan; pins the project's currently APPROVED OwnerRequirement ids onto the plan"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: CxPlan
    side_effects: ["status = APPROVED, approved_at stamped", "pinned_requirement_ids / pinned_requirement_count written, pin_stale = false"]

  # ------------------------------------------------------------- Submittal
  - method: POST
    path: "/submittals"
    description: "Design team lodges a submittal for review"
    roles: [DesignTeam]
    code: 201
    input: [project_id, title, submittal_kind, "equipment_id?"]
    output: Submittal
    side_effects: ["status = RECEIVED, review_round = 1"]

  - method: GET
    path: "/submittals"
    description: "List submittals"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["project_id?", "equipment_id?", "status?", "limit?", "offset?"]
    output: "Submittal[]"
    side_effects: []

  - method: GET
    path: "/submittals/{id}"
    description: "Read one submittal"
