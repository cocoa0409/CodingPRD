scenario: |
  Scenic & Dinner Train Operations (tourist railroad): excursion schedule & car/class inventory, ticket classes & dining seating assignment, locomotive/car maintenance & availability, crew & volunteer staffing, track rights agreement & host railroad slot, weather/event cancellation & rain-check, food service provisioning by manifest, special event (holiday) surge pricing

domain_name: scenic-dinner-train-ops
api_prefix: /railroad

complexity_profile:
  primary_archetype: temporal_windowing      # slots, maintenance windows, service dates, refund windows
  secondary_archetype: quota_allocation      # seat/table inventory per class, daily train cap
  complexity_layers:
    - optimistic_concurrency                 # OCC on Excursion.version (publish) and ProvisioningManifest.version (lock)
    - cascading_side_effects                 # agreement terminate -> slot -> excursion -> booking -> rain-check
    - derived_field_reconciliation           # class availability + manifest counts recomputed from bookings
    - selector_policy                        # dining table assignment with eligibility/rank/tie-break/fallback
  entity_topology: flat                      # peer entities joined by FK references, no nested creation
  state_machine_shape: cyclic                # RollingStock AVAILABLE<->IN_MAINTENANCE, OperatingSlot OPEN<->RESERVED, CrewMember ACTIVE<->INACTIVE; Booking is branching
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: peer_roles                     # Scheduler / Mechanic / StationAgent / CrewManager / CateringManager own disjoint resources; OperationsManager overrides on cancel/terminate/clock
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (11 entities, flat topology)
# common_fields: true => id (server UUID, identity only, never a decision input),
#   created_at / updated_at (ISO8601 UTC, 3 fractional digits), version (int, from 1, +1 per mutation)
# =============================================================================
entities:
  - name: TrackRightsAgreement
    parent: null
    common_fields: true
    fields:
      - { name: host_railroad_name, type: string, source: input, description: "Host railroad legal name" }
      - { name: subdivision_code, type: string, source: input, description: "Track subdivision the rights cover" }
      - { name: valid_from, type: string, source: input, description: "ISO date (YYYY-MM-DD), first day slots may be granted" }
      - { name: valid_until, type: string, source: input, description: "ISO date, last day slots may be granted; must be >= valid_from" }
      - { name: max_trains_per_day, type: integer, source: input, description: "Cap on slots with status in {OPEN, RESERVED, CONSUMED} per service_date", constraints: ">= 1" }
      - { name: min_slot_minutes, type: integer, source: input, description: "Minimum slot duration in minutes", constraints: ">= 30" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED" }

  - name: OperatingSlot
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> TrackRightsAgreement.id; agreement must be ACTIVE at creation" }
      - { name: service_date, type: string, source: input, description: "ISO date the train runs; must satisfy agreement valid_from <= service_date <= valid_until" }
      - { name: start_minute, type: integer, source: input, description: "Minute-of-day 0..1439, half-open interval start" }
      - { name: end_minute, type: integer, source: input, description: "Minute-of-day 1..1440, exclusive end; end_minute - start_minute >= agreement.min_slot_minutes" }
      - { name: status, type: enum, source: system, description: "OPEN | RESERVED | CONSUMED | RELEASED" }

  - name: RollingStock
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique roster code, e.g. LOC-301, CAR-DINING-2", constraints: "unique across all RollingStock" }
      - { name: stock_type, type: enum, source: input, description: "LOCOMOTIVE | COACH_CAR | FIRST_CLASS_CAR | DINING_CAR" }
      - { name: seat_capacity, type: integer, source: input, description: "Passenger seats; must be 0 for LOCOMOTIVE, > 0 otherwise" }
      - { name: table_count, type: integer, source: input, description: "Dining tables; must be > 0 for DINING_CAR, 0 otherwise; each table seats up to 4" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_MAINTENANCE | OUT_OF_SERVICE" }

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: stock_id, type: string, source: input, description: "FK -> RollingStock.id" }
      - { name: window_start, type: datetime, source: input, description: "ISO datetime, half-open window start" }
      - { name: window_end, type: datetime, source: input, description: "ISO datetime, exclusive end; must be > window_start" }
      - { name: scope, type: enum, source: input, description: "INSPECTION | REPAIR | OVERHAUL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: Excursion
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Marketing name of the run" }
      - { name: slot_id, type: string, source: input, description: "FK -> OperatingSlot.id; slot must be OPEN and becomes RESERVED at creation" }
      - { name: event_type, type: enum, source: input, description: "REGULAR | HOLIDAY" }
      - { name: surge_multiplier_bp, type: integer, source: input, description: "Basis points over base fare; REGULAR must be exactly 10000, HOLIDAY must be 12000..20000" }
      - { name: service_date, type: string, source: computed, description: "Copied from OperatingSlot.service_date at creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | BOARDING | OPERATED | CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, description: "WEATHER | EVENT | OPERATOR | TRACK_RIGHTS_LOST; null until cancelled" , default: null }
      - { name: coach_seats_available, type: integer, source: computed, description: "Committed variant: COACH capacity minus party_size of CONFIRMED/CHECKED_IN bookings" }
      - { name: first_class_seats_available, type: integer, source: computed, description: "Committed variant: FIRST_CLASS capacity minus CONFIRMED/CHECKED_IN" }
      - { name: dining_seats_available, type: integer, source: computed, description: "Committed variant: DINING seat capacity minus CONFIRMED/CHECKED_IN diners" }

  - name: CarAssignment
    parent: null
    common_fields: true
    fields:
      - { name: excursion_id, type: string, source: input, description: "FK -> Excursion.id; excursion must be DRAFT" }
      - { name: stock_id, type: string, source: input, description: "FK -> RollingStock.id; stock must be AVAILABLE, not retired, not already on this excursion, no maintenance conflict on service_date" }
      - { name: class_code, type: enum, source: input, description: "LOCO | COACH | FIRST_CLASS | DINING; must match stock_type (LOCOMOTIVE->LOCO, COACH_CAR->COACH, FIRST_CLASS_CAR->FIRST_CLASS, DINING_CAR->DINING)" }
      - { name: position, type: integer, source: input, description: "Consist order, >= 1, unique per excursion" }
      - { name: effective_capacity, type: integer, source: computed, description: "Snapshot of stock.seat_capacity at assignment time" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: excursion_id, type: string, source: input, description: "FK -> Excursion.id; excursion must be PUBLISHED at creation" }
      - { name: customer_email, type: string, source: input, description: "Customer contact; rain-checks are matched on this" }
      - { name: class_code, type: enum, source: input, description: "COACH | FIRST_CLASS | DINING (LOCO is not sellable)" }
      - { name: party_size, type: integer, source: input, description: "1..8; DINING bookings limited to 1..4 (one table seats 4)" }
      - { name: dining_service, type: enum, source: input, description: "EARLY | LATE; required iff class_code = DINING, forbidden otherwise", default: null }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED | RAIN_CHECKED | NO_SHOW" }
      - { name: expires_at, type: datetime, source: system, description: "HELD expiry = created_at + 45 minutes; swept to CANCELLED by clock advance" }
      - { name: unit_fare_cents, type: integer, source: computed, description: "Set at CONFIRM: round_half_up(base fare * surge_multiplier_bp / 10000)" }
      - { name: total_price_cents, type: integer, source: computed, description: "Set at CONFIRM: unit_fare_cents * party_size" }
      - { name: paid_cents, type: integer, source: system, description: "Set at CONFIRM: max(0, total_price_cents - redeemed rain-check value)" }
      - { name: refund_cents, type: integer, source: system, description: "Refund issued on voluntary CANCEL from CONFIRMED; 0 otherwise", default: 0 }
      - { name: dining_table_number, type: integer, source: system, description: "Assigned by selector at CONFIRM for DINING bookings; null otherwise", default: null }
      - { name: dining_car_assignment_id, type: string, source: system, description: "FK -> CarAssignment.id; dining car chosen by selector at CONFIRM; null otherwise", default: null }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Full name" }
      - { name: role, type: enum, source: input, description: "ENGINEER | CONDUCTOR | CAR_HOST | CHEF | SERVER | DOCENT" }
      - { name: is_volunteer, type: boolean, source: input, description: "Volunteers may only hold DOCENT or CAR_HOST roles" }
      - { name: cert_expires_on, type: string, source: input, description: "ISO date; required for ENGINEER and CONDUCTOR, must be null for other roles", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: excursion_id, type: string, source: input, description: "FK -> Excursion.id; excursion must be DRAFT or PUBLISHED" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; member must be ACTIVE and free on service_date" }
      - { name: position, type: enum, source: input, description: "ENGINEER | CONDUCTOR | CAR_HOST | CHEF | SERVER | DOCENT; must equal crew member role" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED | COMPLETED" }

  - name: ProvisioningManifest
    parent: null
    common_fields: true
    fields:
      - { name: excursion_id, type: string, source: system, description: "FK -> Excursion.id; exactly one manifest per excursion, auto-created with the excursion" }
      - { name: status, type: enum, source: system, description: "DRAFT | LOCKED | PROVISIONED" }
      - { name: early_diner_count, type: integer, source: computed, description: "DINING party_size sum, service EARLY; inclusion set per galley_load variant" }
      - { name: late_diner_count, type: integer, source: computed, description: "DINING party_size sum, service LATE; inclusion set per galley_load variant" }
      - { name: galley_load_units, type: integer, source: computed, description: "ceil(early * 3 * 1.1) + ceil(late * 3 * 1.1); frozen at LOCK" }
      - { name: locked_at, type: datetime, source: system, description: "Clock timestamp when LOCKED; null while DRAFT", default: null }
      - { name: actual_loaded_units, type: integer, source: system, description: "Set at MARK_PROVISIONED; must be >= galley_load_units", default: null }

  - name: RainCheck
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; the rain-checked source booking" }
      - { name: customer_email, type: string, source: system, description: "Copied from the source booking" }
      - { name: value_cents, type: integer, source: system, description: "Equals source booking.paid_cents at issuance" }
      - { name: reason, type: enum, source: system, description: "WEATHER | EVENT | TRACK_RIGHTS_LOST; copied from excursion cancel_reason" }
      - { name: issued_on, type: string, source: system, description: "ISO date of issuance (logical clock date)" }
      - { name: expires_on, type: string, source: system, description: "issued_on + 365 days; redeemable through this date inclusive" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | EXPIRED" }
      - { name: redeemed_booking_id, type: string, source: system, description: "FK -> Booking.id; booking that consumed this rain-check; null until redeemed", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrackRightsAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /railroad/agreements/{id}/events (ACTIVATE)"
        actor: Scheduler
        preconditions: []
        side_effects: ["increments TrackRightsAgreement.version by 1"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /railroad/agreements/{id}/events (TERMINATE)"
        actor: OperationsManager
        preconditions: []
        side_effects: ["increments TrackRightsAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /railroad/agreements/{id}/events (TERMINATE)"
        actor: OperationsManager
        preconditions: []
        side_effects:
          - "Every OperatingSlot of this agreement in OPEN -> RELEASED"
          - "Every OperatingSlot of this agreement in RESERVED -> RELEASED; the excursion holding it (status in DRAFT/PUBLISHED/BOARDING) -> CANCELLED with cancel_reason=TRACK_RIGHTS_LOST, which itself cascades: its CONFIRMED/CHECKED_IN bookings -> RAIN_CHECKED and a RainCheck (reason=TRACK_RIGHTS_LOST) is issued per such booking; HELD bookings -> CANCELLED; ASSIGNED crew assignments -> RELEASED"
          - "CONSUMED slots unaffected"
          - "increments TrackRightsAgreement.version by 1"

  - entity: OperatingSlot
    initial_state: OPEN
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "POST /railroad/excursions (create with slot_id)"
        actor: Scheduler
        preconditions: ["slot.status == OPEN", "agreement.status == ACTIVE"]
        side_effects: ["increments OperatingSlot.version by 1"]
      - from: RESERVED
        to: OPEN
        trigger: "system (holding excursion CANCELLED before OPERATED)"
        actor: system
        preconditions: []
        side_effects: ["slot returns to the pool for the same agreement/date", "increments OperatingSlot.version by 1"]
      - from: RESERVED
        to: CONSUMED
        trigger: "system (holding excursion MARK_OPERATED)"
        actor: system
        preconditions: []
        side_effects: ["increments OperatingSlot.version by 1"]
      - from: OPEN
        to: RELEASED
        trigger: "system (agreement TERMINATE)"
        actor: system
        preconditions: []
        side_effects: ["increments OperatingSlot.version by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "system (agreement TERMINATE)"
        actor: system
        preconditions: []
        side_effects: ["triggers excursion CANCELLED (TRACK_RIGHTS_LOST) cascade", "increments OperatingSlot.version by 1"]

  - entity: RollingStock
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "system (POST /railroad/work-orders/{id}/events (START) on a SCHEDULED work order for this stock)"
        actor: system
        preconditions: []
        side_effects: ["increments RollingStock.version by 1"]
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "system (work order COMPLETE when no other IN_PROGRESS work order exists for this stock)"
        actor: system
        preconditions: ["no other MaintenanceWorkOrder for this stock with status IN_PROGRESS"]
        side_effects: ["increments RollingStock.version by 1"]
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /railroad/rolling-stock/{id}/events (RETIRE)"
        actor: Mechanic
        preconditions: ["no CarAssignment of this stock on an excursion in PUBLISHED or BOARDING", "no MaintenanceWorkOrder of this stock in IN_PROGRESS"]
        side_effects:
          - "SCHEDULED work orders for this stock -> CANCELLED"
          - "CarAssignments of this stock on DRAFT excursions are removed; each affected Excursion.version increments by 1"
          - "increments RollingStock.version by 1"
      - from: IN_MAINTENANCE
        to: OUT_OF_SERVICE
        trigger: "POST /railroad/rolling-stock/{id}/events (RETIRE)"
        actor: Mechanic
        preconditions: ["no MaintenanceWorkOrder of this stock in IN_PROGRESS"]
        side_effects: ["same cascades as AVAILABLE -> OUT_OF_SERVICE", "increments RollingStock.version by 1"]

  - entity: MaintenanceWorkOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /railroad/work-orders/{id}/events (START)"
        actor: Mechanic
        preconditions: ["stock.status == AVAILABLE"]
        side_effects: ["stock -> IN_MAINTENANCE", "increments MaintenanceWorkOrder.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /railroad/work-orders/{id}/events (COMPLETE)"
        actor: Mechanic
        preconditions: []
        side_effects: ["stock -> AVAILABLE if no other IN_PROGRESS work order for it", "increments MaintenanceWorkOrder.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (stock RETIRE)"
        actor: system
        preconditions: []
        side_effects: ["increments MaintenanceWorkOrder.version by 1"]

  - entity: Excursion
    initial_state: DRAFT
    terminal_states: [OPERATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /railroad/excursions/{id}/events (PUBLISH)"
        actor: Scheduler
        preconditions:
          - "expected_excursion_version equals current Excursion.version (OCC)"
          - "consist has >= 1 CarAssignment with class_code LOCO and >= 1 with class_code in {COACH, FIRST_CLASS, DINING}"
          - "crew coverage satisfied (see crew_coverage calculation)"
        side_effects: ["increments Excursion.version by 1"]
      - from: PUBLISHED
        to: BOARDING
        trigger: "POST /railroad/excursions/{id}/events (BEGIN_BOARDING)"
        actor: Scheduler
        preconditions:
          - "logical clock date == service_date"
          - "crew coverage still satisfied"
        side_effects: ["increments Excursion.version by 1"]
      - from: BOARDING
        to: OPERATED
        trigger: "POST /railroad/excursions/{id}/events (MARK_OPERATED)"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "OperatingSlot RESERVED -> CONSUMED"
          - "Bookings CHECKED_IN -> COMPLETED; bookings still CONFIRMED -> NO_SHOW"
          - "CrewAssignments ASSIGNED -> COMPLETED"
          - "increments Excursion.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /railroad/excursions/{id}/events (CANCEL) or system (agreement TERMINATE)"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects:
          - "cancel_reason = request reason (WEATHER|EVENT|OPERATOR) or TRACK_RIGHTS_LOST for system cascade"
          - "OperatingSlot RESERVED -> OPEN (manual cancel) or -> RELEASED (agreement cascade)"
          - "HELD bookings -> CANCELLED (no refund)"
          - "ASSIGNED CrewAssignments -> RELEASED"
          - "DRAFT manifest recomputes (counts drop as bookings leave the inclusion set); LOCKED manifest unchanged"
          - "increments Excursion.version by 1"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /railroad/excursions/{id}/events (CANCEL) or system (agreement TERMINATE)"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects:
          - "All DRAFT->CANCELLED side effects, plus: each CONFIRMED or CHECKED_IN booking -> RAIN_CHECKED and a RainCheck is created (value_cents = booking.paid_cents, reason = cancel_reason, issued_on = clock date, expires_on = issued_on + 365 days)"
          - "increments Excursion.version by 1"
      - from: BOARDING
        to: CANCELLED
        trigger: "POST /railroad/excursions/{id}/events (CANCEL) or system (agreement TERMINATE)"
        actor: "OperationsManager or system"
        preconditions: []
        side_effects: ["same as PUBLISHED -> CANCELLED (weather stop during boarding still issues rain-checks)", "increments Excursion.version by 1"]

  - entity: Booking
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, RAIN_CHECKED, NO_SHOW]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /railroad/bookings/{id}/events (CONFIRM)"
        actor: StationAgent
        preconditions:
          - "logical clock < expires_at (unexpired HELD)"
          - "conservative class capacity: party_size fits with HELD-unexpired + CONFIRMED + CHECKED_IN counted"
          - "if redeemed_rain_check_id present: RainCheck ISSUED, customer_email matches, clock date <= expires_on"
          - "if class_code == DINING: a free table exists in the requested service (selector_policy)"
        side_effects:
          - "unit_fare_cents and total_price_cents computed per fare_quote; paid_cents = max(0, total - rain-check value)"
          - "rain-check (if any) -> REDEEMED with redeemed_booking_id = this booking"
          - "DINING: dining_table_number and dining_car_assignment_id set by dining_table_selector"
          - "excursion availability fields recomputed; DRAFT manifest recomputed (galley_load), manifest.version increments by 1"
          - "increments Booking.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /railroad/bookings/{id}/events (CANCEL) or system (clock sweep: expires_at <= now) or system (excursion CANCELLED)"
        actor: "StationAgent or system"
        preconditions: []
        side_effects: ["no refund (never paid)", "DRAFT manifest recomputed if it counted this booking (HOLIDAY variant)", "increments Booking.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /railroad/bookings/{id}/events (CANCEL)"
        actor: StationAgent
        preconditions: []
        side_effects:
          - "refund_cents per refund_amount (100% if >= 48h before slot start, else 50% round_half_up)"
          - "DINING: table freed (dining_table_number/dining_car_assignment_id cleared)"
          - "excursion availability recomputed; DRAFT manifest recomputed, manifest.version increments by 1"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /railroad/bookings/{id}/events (CHECK_IN)"
        actor: StationAgent
        preconditions: ["excursion.status == BOARDING"]
        side_effects: ["increments Booking.version by 1"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (excursion MARK_OPERATED)"
        actor: system
        preconditions: []
        side_effects: ["increments Booking.version by 1"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (excursion MARK_OPERATED with booking never checked in)"
        actor: system
        preconditions: []
        side_effects: ["no refund", "increments Booking.version by 1"]
      - from: CONFIRMED
        to: RAIN_CHECKED
        trigger: "system (excursion CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["RainCheck created (ISSUED)", "excursion availability recomputed; DRAFT manifest recomputed", "increments Booking.version by 1"]
      - from: CHECKED_IN
        to: RAIN_CHECKED
        trigger: "system (excursion CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["RainCheck created (ISSUED)", "increments Booking.version by 1"]

  - entity: CrewMember
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /railroad/crew-members/{id}/events (DEACTIVATE)"
        actor: CrewManager
        preconditions: []
        side_effects:
          - "this member's CrewAssignments with status ASSIGNED on excursions in DRAFT or PUBLISHED -> RELEASED; each affected Excursion.version increments by 1"
          - "increments CrewMember.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /railroad/crew-members/{id}/events (REACTIVATE)"
        actor: CrewManager
        preconditions: []
        side_effects: ["no automatic reassignment", "increments CrewMember.version by 1"]

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /railroad/crew-assignments/{id}/events (RELEASE) or system (crew DEACTIVATE / excursion CANCEL)"
        actor: "CrewManager or system"
        preconditions: []
        side_effects: ["Excursion.version increments by 1", "increments CrewAssignment.version by 1"]
      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (excursion MARK_OPERATED)"
        actor: system
        preconditions: []
        side_effects: ["increments CrewAssignment.version by 1"]

  - entity: ProvisioningManifest
    initial_state: DRAFT
    terminal_states: [PROVISIONED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /railroad/manifests/{id}/events (LOCK)"
        actor: CateringManager
        preconditions: ["expected_manifest_version equals current ProvisioningManifest.version (OCC)"]
        side_effects: ["locked_at = clock timestamp; counts frozen (later booking changes do NOT recompute a LOCKED manifest)", "increments ProvisioningManifest.version by 1"]
      - from: LOCKED
        to: PROVISIONED
        trigger: "POST /railroad/manifests/{id}/events (MARK_PROVISIONED)"
        actor: CateringManager
        preconditions: ["actual_loaded_units >= galley_load_units"]
        side_effects: ["actual_loaded_units stored", "increments ProvisioningManifest.version by 1"]

  - entity: RainCheck
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "system (booking CONFIRM carrying redeemed_rain_check_id)"
        actor: system
        preconditions: ["customer_email matches booking", "clock date <= expires_on"]
        side_effects: ["redeemed_booking_id set; full value consumed even if it exceeds the new booking total (no change given)", "increments RainCheck.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock sweep: clock date > expires_on)"
        actor: system
        preconditions: []
        side_effects: ["increments RainCheck.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: excursion-publish-stale-consist
    parent_entity: Excursion
    write_endpoint: "POST /railroad/excursions/{id}/events"
    occ_field: expected_excursion_version
    description: |
      A PUBLISH request carries the Excursion.version the client last observed.
      If a consist or roster mutation (car assignment create/remove, crew
      assignment create/release, each of which increments Excursion.version)
      has advanced the version since, the publish is rejected with 412: the
      client must re-read the excursion and re-publish what it actually
      reviewed. Stated in OCC terms: stale expected version, not wall-clock overlap.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manifest-lock-stale-version
    parent_entity: ProvisioningManifest
    write_endpoint: "POST /railroad/manifests/{id}/events"
    occ_field: expected_manifest_version
    description: |
      A LOCK request carries the ProvisioningManifest.version the client last
      observed. Every booking confirm/cancel/rain-check that recomputes a DRAFT
      manifest increments its version; locking with a stale version is rejected
      with 412 so catering always locks the numbers it actually reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fare_quote
    trigger: "booking CONFIRM"
    algorithm: branched_pricing
    formula: |
      base = FARE_BY_CLASS[booking.class_code]            # branch 1: class
      unit_fare_cents = round_half_up(base * excursion.surge_multiplier_bp / 10000)
      total_price_cents = unit_fare_cents * party_size    # rounding pinned: round the unit fare FIRST, then multiply
      if redeemed_rain_check present:                     # branch 2: payment instrument
        paid_cents = max(0, total_price_cents - rain_check.value_cents)
      else:
        paid_cents = total_price_cents
    input_set: "the booking being confirmed, its excursion's surge_multiplier_bp (fixed at excursion creation), optional redeemed rain-check"
    constants:
      FARE_COACH_CENTS: 6000
      FARE_FIRST_CLASS_CENTS: 11000
      FARE_DINING_CENTS: 15000
      BASE_SURGE_BP: 10000
      MIN_HOLIDAY_SURGE_BP: 12000
      MAX_SURGE_BP: 20000
    precision: "integer cents; round_half_up applied once, to the unit fare, before multiplying by party_size"
    variants:
      - name: standard
        when: "no rain-check supplied"
        difference: "paid_cents = total_price_cents"
      - name: rain_check_applied
        when: "redeemed_rain_check_id supplied and valid"
        difference: "paid_cents = max(0, total - value); rain-check fully consumed even when value > total"

  - name: class_seat_availability
    trigger: "excursion read (committed variant); booking create and CONFIRM capacity gate (conservative variant)"
    algorithm: aggregation
    formula: |
      capacity(class) = sum of CarAssignment.effective_capacity over the excursion's assignments with this class_code
      committed_available(class)   = capacity(class) - sum(party_size over bookings of this class with status in {CONFIRMED, CHECKED_IN})
      conservative_available(class) = capacity(class) - sum(party_size over bookings of this class with status in
                                     {CONFIRMED, CHECKED_IN} UNION {HELD with expires_at > clock now})
      Excursion.coach_seats_available / first_class_seats_available / dining_seats_available expose the COMMITTED variant.
      Booking create requires conservative_available >= party_size; CONFIRM re-checks the same conservative gate.
    input_set: "CarAssignments of the excursion (any status of excursion); bookings of the excursion filtered by status sets above"
    constants: {}
    precision: "integer seats"
    variants:
      - name: committed
        when: "surfaced on Excursion read fields"
        difference: "excludes HELD bookings entirely"
      - name: conservative
        when: "create/confirm capacity gate"
        difference: "includes unexpired HELD bookings, so the gate can reject when the read fields still show open seats"

  - name: galley_load
    trigger: "recompute on any booking create (HELD) / CONFIRM / CANCEL / RAIN_CHECKED cascade while the excursion's manifest is DRAFT; frozen when LOCKED"
    algorithm: aggregation
    formula: |
      early_diner_count = sum(party_size over DINING bookings with dining_service = EARLY in the variant inclusion set)
      late_diner_count  = sum(party_size over DINING bookings with dining_service = LATE in the variant inclusion set)
      galley_load_units = ceil(early_diner_count * UNITS_PER_MEAL * (1 + BUFFER_PCT))
                        + ceil(late_diner_count  * UNITS_PER_MEAL * (1 + BUFFER_PCT))
      Rounding order is pinned: ceil per service FIRST, then sum. (Summing first and taking one ceil can yield a different integer.)
    input_set: "variant net (REGULAR excursions): DINING bookings in {CONFIRMED, CHECKED_IN}; variant conservative_prep (HOLIDAY excursions): additionally include HELD bookings with expires_at > clock now"
    constants:
      UNITS_PER_MEAL: 3
      BUFFER_PCT: 0.10
    precision: "integer units via ceil per service"
    variants:
      - name: net
        when: "excursion.event_type == REGULAR"
        difference: "HELD bookings excluded"
      - name: conservative_prep
        when: "excursion.event_type == HOLIDAY"
        difference: "unexpired HELD DINING bookings included, so identical booking data yields a larger load on HOLIDAY excursions"

  - name: refund_amount
    trigger: "voluntary CANCEL of a CONFIRMED booking"
    algorithm: threshold
    formula: |
      slot_start = service_date 00:00:00Z + slot.start_minute minutes
      if (slot_start - clock now) >= FULL_REFUND_HOURS hours:  refund_cents = paid_cents
      else:                                                    refund_cents = round_half_up(paid_cents * 0.5)
      Boundary is inclusive: exactly 48h00m00s before slot start pays the full refund.
    input_set: "the booking being cancelled (paid_cents), its excursion's slot start, logical clock"
    constants:
      FULL_REFUND_HOURS: 48
    precision: "integer cents, round_half_up"

  - name: crew_coverage
    trigger: "evaluated at excursion PUBLISH and BEGIN_BOARDING"
    algorithm: threshold
    formula: |
      counts = count of CrewAssignments with status ASSIGNED, grouped by position
      dining_cars = count of CarAssignments with class_code = DINING
      required: ENGINEER >= 1, CONDUCTOR >= 1, CAR_HOST >= 1
      if dining_cars >= 1: CHEF >= 1 and SERVER >= SERVERS_PER_DINING_CAR * dining_cars
      All thresholds are inclusive (>=); falling one short fails coverage.
    input_set: "CrewAssignments of the excursion with status ASSIGNED; CarAssignments of the excursion"
    constants:
      SERVERS_PER_DINING_CAR: 2
    precision: "integer headcounts"

  - name: dining_table_selector
    trigger: "CONFIRM of a DINING booking"
    algorithm: selector_policy
    formula: |
      Eligibility filter: for each CarAssignment of the excursion with class_code = DINING (ordered by position ASC),
        tables 1..stock.table_count; a table is free iff no booking of this excursion in {CONFIRMED, CHECKED_IN}
        has dining_car_assignment_id = that car AND dining_table_number = that table AND dining_service = this booking's service.
        Additionally the car's per-service seat load (sum party_size of such bookings) + this party_size must be <= effective_capacity.
      Ranking: (car position ASC, table_number ASC).
      Tie-break: none needed - (position, table_number) is a total order over distinct tables.
      Fallback (empty pool): reject CONFIRM with ERR_DINING_SERVICE_FULL.
    input_set: "DINING CarAssignments of the excursion; active DINING bookings in the requested service"
    constants:
      TABLE_SEATS: 4
    precision: "integer table numbers"

  - name: clock_sweep
    trigger: "POST /railroad/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      On every clock advance:
        bookings HELD with expires_at <= now -> CANCELLED (no refund)
        rain-checks ISSUED with expires_on < current clock date -> EXPIRED
      Sweep order: bookings first (earliest expires_at first), then rain-checks (earliest expires_on first).
    input_set: "all HELD bookings and ISSUED rain-checks"
    constants:
      HOLD_MINUTES: 45
      RAIN_CHECK_VALID_DAYS: 365
    precision: "datetime compare, inclusive expiry at expires_at"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the six declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed for this endpoint (and event_type where split)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target entity is in a valid from-state for the requested event/transition (includes: events on terminal entities; BEGIN_BOARDING/MARK_OPERATED ordering; car-assign on non-DRAFT excursion; WO START when stock not AVAILABLE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all */events endpoints, POST /railroad/car-assignments" }
  - { priority: 5, category: state, check: "Referenced parent state gates: agreement ACTIVE for slot create (ERR_AGREEMENT_NOT_ACTIVE); excursion PUBLISHED for booking create (ERR_EXCURSION_NOT_BOOKABLE); stock AVAILABLE for car-assign (ERR_STOCK_UNAVAILABLE); stock not OUT_OF_SERVICE for WO create (ERR_STOCK_OUT_OF_SERVICE); slot OPEN for excursion create (ERR_INVALID_STATE)", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /railroad/slots, /railroad/bookings, /railroad/car-assignments, /railroad/work-orders, /railroad/excursions" }
  - { priority: 6, category: state, check: "OCC: expected_excursion_version (PUBLISH) / expected_manifest_version (LOCK) equals current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /railroad/excursions/{id}/events (PUBLISH), POST /railroad/manifests/{id}/events (LOCK)" }
  - { priority: 7, category: business_referential, check: "Body FK references exist (agreement_id, slot_id, stock_id, excursion_id, crew_member_id, redeemed_rain_check_id)", error_id: ERR_INVALID_REFERENCE, http_status: 422, applies_to: "create endpoints with body FKs" }
  - { priority: 8, category: business_constraint, check: "Shape/constraint rules, evaluated in this order: (a) surge bounds by event_type (ERR_SURGE_MULTIPLIER_INVALID); (b) class_code vs stock_type compatibility (ERR_CLASS_STOCK_MISMATCH); (c) stock not already on this excursion and position unique per excursion (ERR_STOCK_ALREADY_ASSIGNED); (d) crew position equals member role (ERR_POSITION_ROLE_MISMATCH); (e) cert present for ENGINEER/CONDUCTOR at member create (ERR_CERTIFICATION_REQUIRED); (f) DINING party_size <= 4, others <= 8 (ERR_PARTY_TOO_LARGE_FOR_DINING); (g) conditional fields: dining_service required iff DINING, cert null for non-crew roles, seat_capacity/table_count by stock_type, volunteer roles limited to DOCENT/CAR_HOST (ERR_VALIDATION); (h) slot duration >= min_slot_minutes (ERR_SLOT_DURATION_TOO_SHORT); (i) consist completeness at PUBLISH (ERR_CONSIST_INCOMPLETE); (j) crew coverage at PUBLISH/BEGIN_BOARDING (ERR_CREW_COVERAGE_INCOMPLETE)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "create endpoints, PUBLISH, BEGIN_BOARDING" }
  - { priority: 9, category: business_temporal, check: "Temporal rules, in this order: (a) slot service_date within agreement validity (ERR_SLOT_OUTSIDE_AGREEMENT_WINDOW); (b) slot half-open overlap on same agreement+date, adjacency allowed (ERR_SLOT_OVERLAP); (c) daily train cap on agreement+date (ERR_DAILY_TRAIN_CAP_REACHED); (d) WO window vs other SCHEDULED/IN_PROGRESS WOs on same stock with 60-minute turnaround buffer, gap >= 60 required, adjacency without buffer NOT allowed; also car-assign of a stock whose SCHEDULED/IN_PROGRESS WO window intersects the excursion's service_date (ERR_MAINTENANCE_WINDOW_CONFLICT); (e) WO window intersecting a PUBLISHED/BOARDING excursion's service_date where the stock is assigned, or stock already assigned to another excursion on the same service_date (ERR_STOCK_COMMITTED); (f) same crew member ASSIGNED on two excursions sharing a service_date (ERR_CREW_DATE_CONFLICT); (g) ENGINEER/CONDUCTOR cert_expires_on >= service_date at crew-assign (ERR_CERTIFICATION_EXPIRED); (h) BEGIN_BOARDING only when clock date == service_date (ERR_NOT_SERVICE_DATE)", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: "POST /railroad/slots, /railroad/work-orders, /railroad/crew-assignments, excursion events" }
  - { priority: 10, category: business_fiscal, check: "Money/capacity rules, in this order: (a) conservative class capacity (ERR_CLASS_FULL); (b) dining table pool non-empty for requested service (ERR_DINING_SERVICE_FULL); (c) rain-check ISSUED + email match + not expired (ERR_RAIN_CHECK_INVALID); (d) actual_loaded_units >= galley_load_units (ERR_PROVISION_SHORTFALL)", error_id: ERR_CLASS_FULL, http_status: 409, applies_to: "booking create/CONFIRM, MARK_PROVISIONED" }

# =============================================================================
# 1.5 API Endpoint Table (35 endpoints)
# Roles shorthand below is explicit; GET endpoints are readable by all six roles.
# =============================================================================
endpoints:
  - { method: POST, path: "/railroad/agreements", description: "Create a track rights agreement (DRAFT)", roles: [Scheduler], code: 201, input: [host_railroad_name, subdivision_code, valid_from, valid_until, max_trains_per_day, min_slot_minutes], output: TrackRightsAgreement, side_effects: ["status=DRAFT, version=1"] }
  - { method: GET, path: "/railroad/agreements/{id}", description: "Get one agreement", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: TrackRightsAgreement, side_effects: [] }
  - { method: POST, path: "/railroad/agreements/{id}/events", description: "ACTIVATE (Scheduler) or TERMINATE (OperationsManager); TERMINATE cascades slots->RELEASED and reserved excursions->CANCELLED (TRACK_RIGHTS_LOST)", roles: [Scheduler, OperationsManager], code: 200, input: [event_type, "note?"], output: TrackRightsAgreement, side_effects: ["agreement version +1; cascade per state machine"] }
  - { method: GET, path: "/railroad/agreements/{id}/slots", description: "List slots of an agreement", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: "OperatingSlot[]", side_effects: [] }

  - { method: POST, path: "/railroad/slots", description: "Create an operating slot (OPEN) under an ACTIVE agreement; half-open overlap + daily cap + validity window enforced", roles: [Scheduler], code: 201, input: [agreement_id, service_date, start_minute, end_minute], output: OperatingSlot, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/railroad/slots/{id}", description: "Get one slot", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: OperatingSlot, side_effects: [] }

  - { method: POST, path: "/railroad/rolling-stock", description: "Roster a locomotive or car (AVAILABLE)", roles: [Mechanic], code: 201, input: [unit_code, stock_type, seat_capacity, table_count], output: RollingStock, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/railroad/rolling-stock/{id}", description: "Get one stock unit", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: RollingStock, side_effects: [] }
  - { method: POST, path: "/railroad/rolling-stock/{id}/events", description: "RETIRE: -> OUT_OF_SERVICE; cancels SCHEDULED work orders and removes assignments from DRAFT excursions", roles: [Mechanic], code: 200, input: [event_type, "reason?"], output: RollingStock, side_effects: ["WO cascade + DRAFT consist removal; version +1"] }
  - { method: GET, path: "/railroad/rolling-stock/{id}/work-orders", description: "List work orders of a stock unit", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: "MaintenanceWorkOrder[]", side_effects: [] }

  - { method: POST, path: "/railroad/work-orders", description: "Schedule a maintenance window (SCHEDULED); 60-minute turnaround buffer vs other WOs; conflict vs published excursions", roles: [Mechanic], code: 201, input: [stock_id, window_start, window_end, scope], output: MaintenanceWorkOrder, side_effects: ["status=SCHEDULED"] }
  - { method: POST, path: "/railroad/work-orders/{id}/events", description: "START (stock -> IN_MAINTENANCE) or COMPLETE (stock -> AVAILABLE if no other IN_PROGRESS WO)", roles: [Mechanic], code: 200, input: [event_type], output: MaintenanceWorkOrder, side_effects: ["stock status sync; version +1"] }

  - { method: POST, path: "/railroad/excursions", description: "Create an excursion (DRAFT) on an OPEN slot; reserves the slot and auto-creates a DRAFT provisioning manifest", roles: [Scheduler], code: 201, input: [title, slot_id, event_type, surge_multiplier_bp], output: Excursion, side_effects: ["slot OPEN->RESERVED; ProvisioningManifest created (DRAFT, zero counts); service_date copied"] }
  - { method: GET, path: "/railroad/excursions/{id}", description: "Get one excursion incl. committed availability fields", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: Excursion, side_effects: [] }
  - { method: GET, path: "/railroad/excursions", description: "List excursions, optional filters", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: ["slot_id?", "status?", "event_type?"], output: "Excursion[]", side_effects: [] }
  - { method: POST, path: "/railroad/excursions/{id}/events", description: "PUBLISH (Scheduler, OCC expected_excursion_version), BEGIN_BOARDING (Scheduler, service-date gated), MARK_OPERATED (Scheduler), CANCEL (OperationsManager, cancel_reason WEATHER|EVENT|OPERATOR)", roles: [Scheduler, OperationsManager], code: 200, input: [event_type, "expected_excursion_version?", "cancel_reason?"], output: Excursion, side_effects: ["per state machine; increments Excursion.version by 1"] }
  - { method: GET, path: "/railroad/excursions/{id}/provisioning-manifests", description: "Get the excursion's manifest (array of 0-1)", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: "ProvisioningManifest[]", side_effects: [] }

  - { method: POST, path: "/railroad/car-assignments", description: "Add a car/locomotive to a DRAFT excursion's consist; snapshots effective_capacity", roles: [Scheduler], code: 201, input: [excursion_id, stock_id, class_code, position], output: CarAssignment, side_effects: ["increments Excursion.version by 1"] }
  - { method: GET, path: "/railroad/car-assignments/{id}", description: "Get one car assignment", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: CarAssignment, side_effects: [] }
  - { method: GET, path: "/railroad/car-assignments", description: "List car assignments, optional filters", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: ["excursion_id?", "stock_id?"], output: "CarAssignment[]", side_effects: [] }

  - { method: POST, path: "/railroad/bookings", description: "Create a booking (HELD, expires_at = now + 45 min) on a PUBLISHED excursion; conservative capacity gate", roles: [StationAgent], code: 201, input: [excursion_id, customer_email, class_code, party_size, "dining_service?"], output: Booking, side_effects: ["status=HELD", "HOLIDAY excursions: DRAFT manifest recomputed (conservative_prep counts unexpired HELD), manifest version +1"] }
  - { method: GET, path: "/railroad/bookings/{id}", description: "Get one booking", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: GET, path: "/railroad/bookings", description: "List bookings, optional filters", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: ["excursion_id?", "customer_email?", "status?", "dining_car_assignment_id?"], output: "Booking[]", side_effects: [] }
  - { method: POST, path: "/railroad/bookings/{id}/events", description: "CONFIRM (fare computation, optional redeemed_rain_check_id, dining table selector), CANCEL (refund per 48h rule), CHECK_IN (excursion BOARDING)", roles: [StationAgent], code: 200, input: [event_type, "redeemed_rain_check_id?"], output: Booking, side_effects: ["per state machine; availability + DRAFT manifest recompute; increments Booking.version by 1"] }

  - { method: POST, path: "/railroad/crew-members", description: "Roster a crew member or volunteer (ACTIVE)", roles: [CrewManager], code: 201, input: [name, role, is_volunteer, "cert_expires_on?"], output: CrewMember, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/railroad/crew-members/{id}", description: "Get one crew member", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: CrewMember, side_effects: [] }
  - { method: POST, path: "/railroad/crew-members/{id}/events", description: "DEACTIVATE (releases ASSIGNED assignments on DRAFT/PUBLISHED excursions) or REACTIVATE", roles: [CrewManager], code: 200, input: [event_type], output: CrewMember, side_effects: ["assignment release cascade; version +1"] }

  - { method: POST, path: "/railroad/crew-assignments", description: "Assign an ACTIVE crew member to an excursion (DRAFT or PUBLISHED); role match, cert validity, same-date exclusivity", roles: [CrewManager], code: 201, input: [excursion_id, crew_member_id, position], output: CrewAssignment, side_effects: ["increments Excursion.version by 1"] }
  - { method: GET, path: "/railroad/crew-assignments/{id}", description: "Get one crew assignment", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: GET, path: "/railroad/crew-assignments", description: "List crew assignments, optional filters", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: ["excursion_id?", "crew_member_id?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: POST, path: "/railroad/crew-assignments/{id}/events", description: "RELEASE an assignment", roles: [CrewManager], code: 200, input: [event_type], output: CrewAssignment, side_effects: ["Excursion.version +1; assignment version +1"] }

  - { method: GET, path: "/railroad/manifests/{id}", description: "Get one provisioning manifest", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: ProvisioningManifest, side_effects: [] }
  - { method: POST, path: "/railroad/manifests/{id}/events", description: "LOCK (OCC expected_manifest_version; freezes counts) or MARK_PROVISIONED (actual_loaded_units >= galley_load_units)", roles: [CateringManager], code: 200, input: [event_type, "expected_manifest_version?", "actual_loaded_units?"], output: ProvisioningManifest, side_effects: ["per state machine; increments ProvisioningManifest.version by 1"] }

  - { method: GET, path: "/railroad/rain-checks/{id}", description: "Get one rain-check", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: [], output: RainCheck, side_effects: [] }
  - { method: GET, path: "/railroad/rain-checks", description: "List rain-checks, optional filters", roles: [Scheduler, Mechanic, StationAgent, CrewManager, CateringManager, OperationsManager], code: 200, input: ["booking_id?", "redeemed_booking_id?", "customer_email?", "status?"], output: "RainCheck[]", side_effects: [] }

  - { method: POST, path: "/railroad/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock sweeps expired HELD bookings -> CANCELLED and expired ISSUED rain-checks -> EXPIRED.", roles: [OperationsManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["clock_sweep calculation runs"] }

# =============================================================================
# 1.6 Error Code Catalog (32)
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum value, unknown event_type, or conditional-field violation (dining_service presence, cert nullability, stock capacity/table shape, volunteer role restriction, duplicate consist position)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint or event_type" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target or referenced entity in wrong from-state (terminal lockdown, bad transition, slot not OPEN, excursion not DRAFT for consist edits, CHECK_IN while not BOARDING)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_excursion_version / expected_manifest_version does not match current version" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body FK reference does not exist" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Slot create under an agreement not in ACTIVE" }
  - { id: ERR_SLOT_OUTSIDE_AGREEMENT_WINDOW, http: 422, condition: "service_date outside [valid_from, valid_until]" }
  - { id: ERR_SLOT_DURATION_TOO_SHORT, http: 422, condition: "end_minute - start_minute < agreement.min_slot_minutes" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open slot interval collides with another non-RELEASED slot on same agreement+date; adjacency (end == start) is allowed" }
  - { id: ERR_DAILY_TRAIN_CAP_REACHED, http: 409, condition: "Creating the slot would exceed max_trains_per_day on that date" }
  - { id: ERR_MAINTENANCE_WINDOW_CONFLICT, http: 409, condition: "WO window violates the 60-minute turnaround buffer vs another SCHEDULED/IN_PROGRESS WO on the same stock; or car-assign of a stock whose SCHEDULED/IN_PROGRESS WO window intersects the excursion's service_date (guard fires in both directions)" }
  - { id: ERR_STOCK_COMMITTED, http: 409, condition: "WO window intersects a PUBLISHED/BOARDING excursion service_date using this stock; or stock already assigned to another excursion on the same service_date; or retire while assigned to PUBLISHED/BOARDING excursion" }
  - { id: ERR_STOCK_UNAVAILABLE, http: 409, condition: "Stock IN_MAINTENANCE at car-assign or at WO START" }
  - { id: ERR_STOCK_OUT_OF_SERVICE, http: 409, condition: "Operation targets a retired (OUT_OF_SERVICE) stock unit" }
  - { id: ERR_CLASS_STOCK_MISMATCH, http: 422, condition: "class_code incompatible with stock_type" }
  - { id: ERR_STOCK_ALREADY_ASSIGNED, http: 409, condition: "Stock already in this excursion's consist" }
  - { id: ERR_SURGE_MULTIPLIER_INVALID, http: 422, condition: "REGULAR requires exactly 10000; HOLIDAY requires 12000..20000" }
  - { id: ERR_CONSIST_INCOMPLETE, http: 409, condition: "PUBLISH without >= 1 LOCO and >= 1 passenger car in the consist" }
  - { id: ERR_CREW_COVERAGE_INCOMPLETE, http: 409, condition: "PUBLISH/BEGIN_BOARDING without required ASSIGNED crew positions" }
  - { id: ERR_POSITION_ROLE_MISMATCH, http: 422, condition: "CrewAssignment position differs from the member's role" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "ENGINEER/CONDUCTOR created without cert_expires_on" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 422, condition: "cert_expires_on < excursion service_date at crew assignment" }
  - { id: ERR_CREW_DATE_CONFLICT, http: 409, condition: "Member already ASSIGNED to another excursion on the same service_date" }
  - { id: ERR_EXCURSION_NOT_BOOKABLE, http: 409, condition: "Booking create on an excursion not in PUBLISHED" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "Conservative class capacity (incl. unexpired HELD) insufficient for party_size" }
  - { id: ERR_DINING_SERVICE_FULL, http: 409, condition: "No free table in the requested dining service (selector empty pool)" }
  - { id: ERR_PARTY_TOO_LARGE_FOR_DINING, http: 422, condition: "DINING party_size > 4" }
  - { id: ERR_RAIN_CHECK_INVALID, http: 422, condition: "Rain-check not ISSUED, email mismatch, or expired at CONFIRM" }
  - { id: ERR_NOT_SERVICE_DATE, http: 409, condition: "BEGIN_BOARDING when clock date != service_date" }
  - { id: ERR_PROVISION_SHORTFALL, http: 409, condition: "actual_loaded_units < galley_load_units at MARK_PROVISIONED" }

# =============================================================================
# 1.7 RBAC Matrix (all roles opaque operator identities)
# =============================================================================
roles:
  - name: Scheduler
    description: "Plans the timetable: agreements, slots, excursions, consist, publish/board/operate"
    identity: opaque
    exclusive_operations:
      - "POST /railroad/agreements; ACTIVATE agreement event"
      - "POST /railroad/slots"
      - "POST /railroad/excursions; PUBLISH / BEGIN_BOARDING / MARK_OPERATED excursion events"
      - "POST /railroad/car-assignments"
    shared_operations: ["All GET / list endpoints"]
  - name: Mechanic
    description: "Maintains rolling stock and maintenance work orders"
    identity: opaque
    exclusive_operations:
      - "POST /railroad/rolling-stock; RETIRE stock event"
      - "POST /railroad/work-orders; START / COMPLETE work-order events"
    shared_operations: ["All GET / list endpoints"]
  - name: StationAgent
    description: "Sells and services tickets: booking create/confirm/cancel/check-in"
    identity: opaque
    exclusive_operations:
      - "POST /railroad/bookings"
      - "POST /railroad/bookings/{id}/events (CONFIRM, CANCEL, CHECK_IN)"
    shared_operations: ["All GET / list endpoints"]
  - name: CrewManager
    description: "Rosters crew and volunteers; manages excursion staffing"
    identity: opaque
    exclusive_operations:
      - "POST /railroad/crew-members; DEACTIVATE / REACTIVATE member events"
      - "POST /railroad/crew-assignments; RELEASE assignment event"
    shared_operations: ["All GET / list endpoints"]
  - name: CateringManager
    description: "Locks and provisions dining manifests"
    identity: opaque
    exclusive_operations:
      - "POST /railroad/manifests/{id}/events (LOCK, MARK_PROVISIONED)"
    shared_operations: ["All GET / list endpoints"]
  - name: OperationsManager
    description: "Duty officer: terminates agreements, cancels excursions (weather/event), drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "TERMINATE agreement event"
      - "CANCEL excursion event"
      - "POST /railroad/_clock/set_current_utc"
    shared_operations: ["All GET / list endpoints"]
