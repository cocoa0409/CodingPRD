  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: form_publication_gated_on_program_blueprint_posture_toggled_by_item_flagging
        grounds:
          - validations[priority=34]
          - errors.ERR_BLUEPRINT_DEFICIENT
          - calculations.blueprint_posture
          - calculations.item_flag_evaluation
          - state_machines.Item.OPERATIONAL_to_FLAGGED
          - state_machines.Item.FLAGGED_to_OPERATIONAL
          - state_machines.ExamForm.CUT_SCORE_SET_to_PUBLISHED
        distinguishing_aspect: |
          Whether POST /forms/{id}/publish succeeds is decided by the state of a THIRD entity
          the request never mentions: an operational response batch that drops the item's
          discrimination_index to -0.1333 flags the item, which decrements the programme's
          operational_item_count to 0 and flips blueprint_posture to DEFICIENT, so the
          CUT_SCORE_SET form is refused with 409 ERR_BLUEPRINT_DEFICIENT; a later batch that
          restores discrimination_index to 0.4333 un-flags the item, restores
          blueprint_posture COMPLETE, and the byte-identical publish call then succeeds.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 1, domain_specs [{D1, 100, min_operational_items 1}], psychometric_stat_basis POOLED, min_discrimination 0.15, min_panelists 1, panel_trim_count 0)."
            - "One Item promoted to OPERATIONAL by a pretest batch of 40 responses (p_value 0.6000, discrimination_index 0.6000), so operational_item_count == 1, deficient_domain_codes == [] and blueprint_posture == COMPLETE."
            - "One form CPX-F1 in status CUT_SCORE_SET / panel_status ADOPTED (single panelist rating 0.60 adopted by psy-1), raw_cut_score 0, never yet published."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX operational item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "ready"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.6}
              as: Panelist
              as_user_id: "pan-1"
              captures: { form_v: "$.data.version" }
            - call: "POST /forms/${form_id}/adopt-cut-score"
              payload: {"expected_form_version": "${form_v}", "adoption_note": "single-panelist adoption"}
              as: Psychometrician
              as_user_id: "psy-1"
          trigger:
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": false, "response_count": 60, "correct_count": 30, "upper_n": 20, "upper_correct": 5, "lower_n": 20, "lower_correct": 15}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms/${form_id}/publish"
              payload: {"publication_note": "publish over a deficient blueprint"}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { err_def: "$.data.error_id" }
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": false, "response_count": 60, "correct_count": 30, "upper_n": 30, "upper_correct": 30, "lower_n": 30, "lower_correct": 0}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms/${form_id}/publish"
              payload: {"publication_note": "publish over a restored blueprint"}
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "after trigger[0] Item.${item_id}.p_value == 0.5400 and Item.${item_id}.discrimination_index == -0.1333 (pooled totals 100 responses, 54 correct, upper 14/30, lower 18/30)"
            - "after trigger[0] Item.${item_id}.flag_reason == LOW_DISCRIMINATION and Item.${item_id}.status == FLAGGED"
            - "after trigger[0] CertificationProgram.${prog_id}.operational_item_count == 0, CertificationProgram.${prog_id}.deficient_domain_codes == [\"D1\"] and CertificationProgram.${prog_id}.blueprint_posture == DEFICIENT"
            - "trigger[1] responds 409 with ${err_def} == ERR_BLUEPRINT_DEFICIENT and ExamForm.${form_id}.status stays CUT_SCORE_SET"
            - "after trigger[2] Item.${item_id}.p_value == 0.5250 and Item.${item_id}.discrimination_index == 0.4333 (pooled totals 160 responses, 84 correct, upper 44/60, lower 18/60)"
            - "after trigger[2] Item.${item_id}.flag_reason == null, Item.${item_id}.status == OPERATIONAL and Item.${item_id}.retirement_reason == null"
            - "after trigger[2] CertificationProgram.${prog_id}.operational_item_count == 1 and CertificationProgram.${prog_id}.blueprint_posture == COMPLETE"
            - "trigger[3] responds 200 and ExamForm.${form_id}.status == PUBLISHED with raw_cut_score still 0 (publication does not recompute the cut)"


      - name: ceu_submission_gated_on_certificant_suspension_produced_by_a_disciplinary_sanction
        grounds:
          - state_machines.Certificant.ACTIVE_to_SUSPENDED
          - state_machines.Certificant.SUSPENDED_to_ACTIVE
          - validations[priority=16]
          - errors.ERR_CERTIFICANT_NOT_ACTIVE
          - endpoints.POST_/recertification-runs
          - entities.Certificant.fields.suspension_until
          - calculations.ceu_credit_accrual
        distinguishing_aspect: |
          POST /recertification-cycles/{id}/ceu-activities names only a cycle, yet it is gated on
          the PARENT Certificant's status, which is itself owned by a DisciplinaryCase: a
          SANCTIONED decision with sanction_months 6 suspends the certificant until
          2027-02-10 and every CEU submission is refused with 409 ERR_CERTIFICANT_NOT_ACTIVE
          even though the cycle stays OPEN and in-window; only the scheduled sweep at
          current_utc >= suspension_until returns the certificant to ACTIVE, after which the
          identical submission is accepted and satisfies the cycle.
