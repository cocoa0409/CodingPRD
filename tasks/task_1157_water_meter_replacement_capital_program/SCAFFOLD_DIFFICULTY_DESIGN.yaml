  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: wave_window_halfopen_overlap
        grounds:
          - validations[priority=14]
          - state_machines.Wave.DRAFT_to_OPEN
          - errors[ERR_WAVE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [window_start, window_end) on the Program's
          wave set — W2 [2026-06-01, 2026-07-01) adjacent to OPEN W1
          [2026-05-01, 2026-06-01) is allowed (touching endpoints do not
          intersect); W3 [2026-05-15, 2026-06-15) intersects and is rejected.
          Resource: Program. Different semantics and resource from
          crew_window_bucket_capacity.
        test_recipe:
          setup:
            - "Program ACTIVE with wave1 [2026-05-01, 2026-06-01) OPEN; wave2 [2026-06-01, 2026-07-01) and wave3 [2026-05-15, 2026-06-15) both DRAFT"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave1: $.data.id } }
            - { call: "POST /api/waves/${wave1}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 2, window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave2: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 3, window_start: "2026-05-15T00:00:00Z", window_end: "2026-06-15T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave3: $.data.id } }
          trigger:
            - { call: "POST /api/waves/${wave2}/open", payload: {}, as: ProgramManager, captures: { w2_status: $.data.status } }
            - { call: "POST /api/waves/${wave3}/open", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "adjacent wave2 opens: status == OPEN (window_end == window_start does not intersect)"
            - "overlapping wave3: error_id == ERR_WAVE_WINDOW_OVERLAP"
            - "Wave.${wave3}.status == DRAFT (unchanged)"

      - name: crew_window_bucket_capacity
        grounds:
          - validations[priority=15]
          - entities.Contractor.fields.crew_capacity_per_window
          - errors[ERR_CREW_WINDOW_FULL]
        distinguishing_aspect: |
          Interval semantics: aggregate bucket capacity on the Contractor's
          (slot_date, window) — NOT pairwise interval intersection. With capacity
          1, a second booking on the same 2026-05-06 AM bucket is rejected while
          the same date in the PM bucket succeeds. Resource: Contractor. Different
          semantics (count-per-bucket vs half-open pairwise) and resource from
          wave_window_halfopen_overlap.
        test_recipe:
          setup:
            - "Contractor crew_capacity_per_window = 1; two work orders F and G both NOTIFIED (delivered 2026-04-28); F already BOOKED 2026-05-06 AM"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 1, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/accounts", payload: { account_number: "A-9101", service_address: "21 Cherry St", meter_location: "OUTSIDE", customer_name: "Ned", customer_phone: "555-9101", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acctF: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-9101", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldmF: $.data.id } }
            - { call: "POST /api/meters/${oldmF}/install", payload: { service_account_id: "${acctF}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acctF}" }, as: Scheduler, captures: { woF: $.data.id, woF_v: $.data.version } }
            - { call: "POST /api/work-orders/${woF}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${woF_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${woF}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notifF: $.data.id } }
            - { call: "POST /api/notifications/${notifF}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-04-28T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${woF}", payload: {}, as: Scheduler, captures: { woF_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${woF}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${woF_v3}" }, as: Scheduler, captures: { apptF: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-9102", service_address: "22 Cherry St", meter_location: "OUTSIDE", customer_name: "Ora", customer_phone: "555-9102", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acctG: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-9102", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldmG: $.data.id } }
            - { call: "POST /api/meters/${oldmG}/install", payload: { service_account_id: "${acctG}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acctG}" }, as: Scheduler, captures: { woG: $.data.id, woG_v: $.data.version } }
            - { call: "POST /api/work-orders/${woG}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${woG_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${woG}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notifG: $.data.id } }
            - { call: "POST /api/notifications/${notifG}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-04-28T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${woG}", payload: {}, as: Scheduler, captures: { woG_v3: $.data.version } }
          trigger:
