            - "all four responses carry response_type == 'error', a meta block with api_request_id and api_request_timestamp, and a data object whose only keys are error_id and message"
            - "${m_422}, ${m_404}, ${m_409} and ${m_402} are all non-empty strings, and none of the four responses carries any entity field - a rejected create leaks no partial row"
            - "GET /outing-ops/registrations/${r_id} still reads status == 'PENDING_PAYMENT' with amount_paid_cents == 0 and GET /outing-ops/contracts?outing_id=${o_id} still returns total_count == 1"

      - name: six_distinct_schema_faults_all_collapse_to_invalid_request
