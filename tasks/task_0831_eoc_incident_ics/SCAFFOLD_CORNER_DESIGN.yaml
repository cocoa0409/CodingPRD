  - section: state_machines
    instances:
      - name: demobilize_incident_cascade_excluded
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Incident.ACTIVATED_to_DEMOBILIZING
        excluded_because:
          difficulty_instance: transitive_cascade / demobilize_incident_three_hop_release
          rationale: "The Incident DEMOBILIZING cascade (task cancel -> request demob -> pool release) is asserted end-to-end by that §1.8 instance."

  - section: calculations
    instances:
      - name: pool_units_conservation_excluded
        claim_type: Correct Result
        grounds:
          - calculations.resource_pool_availability
        excluded_because:
          difficulty_instance: compensating_invariant / pool_units_conserved_on_demobilize
          rationale: "total_units == available + reserved + committed conservation across FILL then DEMOBILIZE is asserted by that §1.8 instance."

      - name: declaration_threshold_boundary_excluded
