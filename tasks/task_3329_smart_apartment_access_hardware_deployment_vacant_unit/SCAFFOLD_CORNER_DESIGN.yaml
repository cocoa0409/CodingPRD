              payload: { device_type: "SMART_LOCK", unit_id: "${unit_o1}", building_id: "${bld_oo}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_o1: $.data.id }
            - call: "POST /buildings/${bld_oo}/device-scans"
              payload: { reachable_device_ids: ["${dev_o1}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_oo}", unit_id: "${unit_o1}", full_name: "Olive Owner", email: "olive@x.com" }
              as: PropertyManager
              captures: { res_o1: $.data.id }
            - call: "POST /residents/${res_o1}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /residents"
              payload: { property_id: "${prop_oo}", unit_id: "${unit_o2}", full_name: "Otto Other", email: "otto@x.com" }
              as: PropertyManager
              captures: { res_o2: $.data.id }
          trigger:
            - call: "POST /units/${unit_o2}/guest-passes"
              payload: { host_resident_id: "${res_o2}", guest_label: "Not Mine", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-11T09:00:00Z" }
              as: Resident
              as_user_id: "${res_o1}"
              captures: { e_oo: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "no GuestPass is created for ${unit_o2}"

      - name: leasing_agent_cannot_create_properties
        claim_type: Violation → Error
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /properties is exclusive to PlatformAdmin; a LeasingAgent caller is rejected 403 ERR_FORBIDDEN."
        test_recipe:
