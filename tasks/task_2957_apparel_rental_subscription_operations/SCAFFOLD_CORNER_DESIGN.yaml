        excluded_because:
          difficulty_instance: non_linear_state_machine / damage_claim_dispute_cycle_downgrades_twice_then_locks
          rationale: >-
            The delta posting when the severity downgrades on a PARTIAL verdict, including the DISPUTE_REVERSAL
            entry and the freshly posted pair, is asserted in the named §1.8 instance.
      - name: calc_swap_allowance_threshold_boundary
        claim_type: correct_result
