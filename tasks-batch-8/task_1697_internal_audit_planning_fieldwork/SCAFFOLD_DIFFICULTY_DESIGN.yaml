            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent1}", title: "Eng O1", scope_summary: "s", budget_hours: 80, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng1: "$.data.id" } }
            - { call: "GET /audit/audit-plans/${plan}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { plan_v2: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent2}", title: "Eng O2", scope_summary: "s", budget_hours: 80, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng2: "$.data.id" } }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng1}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}", captures: { asg1: "$.data.id" } }
          trigger:
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng2}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-15T00:00:00Z", end_date: "2026-03-15T00:00:00Z", allocated_hours: 20 }, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng2}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-03-01T00:00:00Z", end_date: "2026-04-01T00:00:00Z", allocated_hours: 30 }, as: AuditManager, as_user_id: "${mgr1}", captures: { asg3: "$.data.id" } }
          assert:
            - "Overlapping window: error_id == ERR_ASSIGNMENT_OVERLAP"
            - "Adjacent window [2026-03-01, 2026-04-01) touching asg1's end: EngagementAssignment.${asg3}.status == ACTIVE (half-open adjacency allowed)"
            - "Engagement.${eng2}.reserved_hours == 30 (only the accepted assignment reserves)"

      - name: auditable_entity_cooling_period_buffer_gap
        grounds:
          - errors[ERR_ENGAGEMENT_COOLING_PERIOD]
          - entities.Engagement.fields.start_date
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = AuditableEntity, interval semantics = 90-day buffer gap (NOT
          half-open intersection): after an engagement ending 2026-02-28, a new
          engagement on the same entity starting 2026-05-28 is rejected (89-day
          gap inside the buffer) while 2026-05-29 (gap exactly 90 days) is
          accepted — adjacency inside the buffer is a violation, unlike the
          auditor half-open rule.
        test_recipe:
          setup:
            - "Entity with one existing engagement windowed 2026-02-01..2026-02-28 (non-CANCELLED); plan DRAFT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity C1", business_owner: "Owner C1" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng base", scope_summary: "s", budget_hours: 60, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng1: "$.data.id" } }
          trigger:
            - { call: "GET /audit/audit-plans/${plan}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { plan_v2: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng early", scope_summary: "s", budget_hours: 60, start_date: "2026-05-28T00:00:00Z", end_date: "2026-06-15T00:00:00Z", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng boundary", scope_summary: "s", budget_hours: 60, start_date: "2026-05-29T00:00:00Z", end_date: "2026-06-30T00:00:00Z", expected_audit_plan_version: "${plan_v2}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng3: "$.data.id" } }
          assert:
            - "Start 2026-05-28 (89 days after 2026-02-28): error_id == ERR_ENGAGEMENT_COOLING_PERIOD"
            - "Start 2026-05-29 (exactly 90 days after 2026-02-28): Engagement.${eng3}.status == PLANNED (buffer boundary inclusive)"
            - "Failed creation did not bump AuditPlan.version (the accepted creation reused ${plan_v2})"

  - rule_id: compensating_invariant
    instances:
      - name: assignment_reserved_hours_create_cancel_neutral
        grounds:
          - state_machines.EngagementAssignment.ACTIVE_to_CANCELLED
          - entities.Engagement.fields.reserved_hours
        distinguishing_aspect: |
          Conserved quantity = reserved staff hours (a resource-reservation
          ledger): Engagement.reserved_hours == sum of allocated_hours over ACTIVE
          assignments after every step; each creation paired with its cancellation
          leaves the quantity unchanged (0 -> 40 -> 65 -> 25 -> 0).
        test_recipe:
          setup:
            - "Plan DRAFT; engagement PLANNED (assignments allowed pre-fieldwork); auditors a1, a2 on the roster"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity H1", business_owner: "Owner H1" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Ann A1", grade: "STAFF" }, as: AuditAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Bob A2", grade: "SENIOR" }, as: AuditAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng H1", scope_summary: "s", budget_hours: 200, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id", r0: "$.data.reserved_hours" } }
          trigger:
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${a1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 40 }, as: AuditManager, as_user_id: "${mgr1}", captures: { asg1: "$.data.id" } }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { r1: "$.data.reserved_hours" } }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${a2}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 25 }, as: AuditManager, as_user_id: "${mgr1}", captures: { asg2: "$.data.id" } }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { r2: "$.data.reserved_hours" } }
            - { call: "POST /audit/engagement-assignments/${asg1}/cancel", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { r3: "$.data.reserved_hours" } }
            - { call: "POST /audit/engagement-assignments/${asg2}/cancel", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { r4: "$.data.reserved_hours" } }
          assert:
            - "reserved_hours sequence == [0, 40, 65, 25, 0] (observed ${r0}=0, ${r1}=40, ${r2}=65, ${r3}=25, ${r4}=0)"
            - "Invariant: at every step reserved_hours == sum of allocated_hours over ACTIVE assignments"
            - "Create(40) paired with its cancel and create(25) paired with its cancel return the engagement to the initial 0 (no drift)"

      - name: workpaper_signoff_count_signoff_return_neutral
        grounds:
          - state_machines.Workpaper.SUBMITTED_to_SIGNED_OFF
          - state_machines.Workpaper.SIGNED_OFF_to_RETURNED
          - entities.Engagement.fields.signed_off_workpaper_count
        distinguishing_aspect: |
          Conserved quantity = the signed-off workpaper count/hours pair (a review
          pipeline tally, distinct from reserved hours): sign-off(wp1) later undone
          by return(wp1) nets zero — after the compensating pair the engagement
          shows exactly the count/hours contributed by the untouched workpaper.
        test_recipe:
          setup:
            - "Plan APPROVED; engagement FIELDWORK with LEAD mgr1 and STAFF staff1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: AuditAdmin }
            - { call: "POST /audit/auditable-entities", payload: { name: "Entity H2", business_owner: "Owner H2" }, as: AuditAdmin, captures: { ent: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "FY26 Plan" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent}", title: "Eng H2", scope_summary: "s", budget_hours: 200, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng: "$.data.id" } }
            - { call: "POST /audit/audit-plans/${plan}/submit", payload: {}, as: ChiefAuditExecutive, as_user_id: "cae-1" }
            - { call: "POST /audit/audit-plans/${plan}/approve", payload: {}, as: AuditCommittee, as_user_id: "ac-1" }
            - { call: "POST /audit/engagements/${eng}/scope", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${mgr1}", role_in_engagement: "LEAD", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 60 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagement-assignments", payload: { engagement_id: "${eng}", auditor_id: "${staff1}", role_in_engagement: "STAFF", start_date: "2026-02-01T00:00:00Z", end_date: "2026-03-01T00:00:00Z", allocated_hours: 60 }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "POST /audit/engagements/${eng}/begin-fieldwork", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
          trigger:
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "A-1", title: "WP1", hours_worked: 10 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp1: "$.data.id" } }
            - { call: "POST /audit/workpapers/${wp1}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp1}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { c1: "$.data.signed_off_workpaper_count", h1: "$.data.actual_hours" } }
            - { call: "POST /audit/workpapers", payload: { engagement_id: "${eng}", reference: "A-2", title: "WP2", hours_worked: 20 }, as: FieldAuditor, as_user_id: "${staff1}", captures: { wp2: "$.data.id" } }
            - { call: "POST /audit/workpapers/${wp2}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp2}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { c2: "$.data.signed_off_workpaper_count", h2: "$.data.actual_hours" } }
            - { call: "POST /audit/workpapers/${wp1}/return", payload: { note: "Evidence gap" }, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { c3: "$.data.signed_off_workpaper_count", h3: "$.data.actual_hours" } }
            - { call: "POST /audit/workpapers/${wp1}/revise", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp1}/submit", payload: {}, as: FieldAuditor, as_user_id: "${staff1}" }
            - { call: "POST /audit/workpapers/${wp1}/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}" }
            - { call: "GET /audit/engagements/${eng}", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { c4: "$.data.signed_off_workpaper_count", h4: "$.data.actual_hours" } }
          assert:
            - "signed_off_workpaper_count sequence == [1, 2, 1, 2] (${c1}, ${c2}, ${c3}, ${c4})"
            - "actual_hours sequence == [10.0, 30.0, 20.0, 30.0] (${h1}, ${h2}, ${h3}, ${h4})"
            - "After the sign-off(wp1)/return(wp1) pair, count == 1 and actual_hours == 20.0 — identical to the state as if the pair had never executed (no drift)"
