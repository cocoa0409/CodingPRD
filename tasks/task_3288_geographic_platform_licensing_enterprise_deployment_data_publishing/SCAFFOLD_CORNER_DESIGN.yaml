              as: ComplianceOfficer
              as_user_id: "${user_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 403 and err == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "EV remains UNDER_REVIEW"

      - name: portal_decommission_blocked_while_siblings_active
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", errors.ERR_PORTAL_IN_USE]
        distinguishing_aspect: "A PORTAL server cannot decommission while any sibling server of the org is AUTHORIZED; once the sibling decommissions, the portal can."
        test_recipe:
          setup: ["Org ACTIVE; server grant ACTIVE (32 cores); PORTAL and GIS_SERVER both AUTHORIZED."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - call: "POST /geo-orgs/license-products"
              payload: { product_code: "SRV-11", license_kind: "DEPLOYMENT_SERVER", edition: "STANDARD", major_version: 11, base_seat_count: 32, supports_offline: false, allows_derivative_works: false }
              as: PlatformAdmin
              captures: { prod_srv: $.data.id }
            - call: "POST /geo-orgs/license-grants"
              payload: { organization_id: "${org_id}", license_product_id: "${prod_srv}", grant_kind: "STANDARD", seats_allocated: 32, valid_from_period: 0, valid_to_period: 365 }
              as: LicenseAdmin
              captures: { grant_srv: $.data.id }
            - *c_act_org
            - call: "POST /geo-orgs/license-grants/${grant_srv}/transition"
              payload: { target_status: "ACTIVE", expected_organization_version: "${org_v0}" }
              as: LicenseAdmin
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "portal.meridian.example", role: "PORTAL", installed_major_version: 11, auth_mode: "OIDC", license_grant_id: "${grant_srv}", cores_allocated: 4 }
              as: DeploymentAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /geo-orgs/deployment-servers/${portal_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
            - call: "POST /geo-orgs/deployment-servers"
              payload: { organization_id: "${org_id}", hostname: "gis.meridian.example", role: "GIS_SERVER", installed_major_version: 11, auth_mode: "SAML", license_grant_id: "${grant_srv}", cores_allocated: 8 }
              as: DeploymentAdmin
              captures: { gis_id: $.data.id }
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "AUTHORIZED" }
              as: DeploymentAdmin
          trigger:
            - call: "POST /geo-orgs/deployment-servers/${portal_id}/transition"
              payload: { target_status: "DECOMMISSIONED" }
              as: DeploymentAdmin
              captures: { err: $.data.error_id }
            - call: "POST /geo-orgs/deployment-servers/${gis_id}/transition"
              payload: { target_status: "DECOMMISSIONED" }
              as: DeploymentAdmin
            - call: "POST /geo-orgs/deployment-servers/${portal_id}/transition"
              payload: { target_status: "DECOMMISSIONED" }
              as: DeploymentAdmin
          assert:
            - "first portal decommission returns 409 err == ERR_PORTAL_IN_USE"
            - "after the GIS server decommissions, the portal decommission succeeds"
            - "grant seats_in_use returns to 0"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: credit_batch_create_idempotency_replays_and_conflicts
        claim_type: idempotency
        grounds: [endpoints.POST_/credit-batches, errors.ERR_IDEMPOTENCY_CONFLICT]
        distinguishing_aspect: "Same idempotency_key + same payload replays the original 201 with the same batch id and does NOT double-reserve; same key + different payload is 409 ERR_IDEMPOTENCY_CONFLICT."
        test_recipe:
          setup: ["Base chain with key."]
          setup_api_calls: [*c_clock, *c_org, *c_pool, *c_prod, *c_grant, *c_act_org, *c_act_grant, *c_user, *c_accept, *c_key]
          trigger:
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 10, idempotency_key: "dup-key" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b_first: $.data.id }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 10, idempotency_key: "dup-key" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b_second: $.data.id }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 11, idempotency_key: "dup-key" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { err: $.data.error_id }
          assert:
            - "b_second == b_first (same id returned)"
            - "CreditPool.reserved_credits == 40 (reserved once, not twice)"
            - "err == ERR_IDEMPOTENCY_CONFLICT (409)"

      - name: publish_synthesizes_storage_batch_pending
        claim_type: conditional_action
        grounds: ["endpoints.POST_/content-items/{id}/transition", calculations.storage_credit_billing]
        distinguishing_aspect: "Publish is a conditional action with an automatic side effect: a STORAGE CreditBatch appears in PENDING with the ceiling-computed units and a 'storage:'-prefixed idempotency key."
        test_recipe:
          setup: ["Base chain; DRAFT item of 200 MiB + 1 byte."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/content-items"
              payload: { organization_id: "${org_id}", title: "Big", item_kind: "TILE_LAYER", storage_bytes: 209715201 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /geo-orgs/content-items/${item_id}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${user_id}"
            - call: "GET /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", service_kind: "STORAGE" }
              as: BillingAdmin
          assert:
            - "exactly one STORAGE batch exists with requested_units == 3 and provisional_credits == 3, status PENDING, api_key_id null"
            - "CreditPool.reserved_credits == 3"

      - name: settle_charges_api_key_and_cap_revokes
        claim_type: conditional_action
        grounds: ["endpoints.POST_/credit-batches/{id}/transition", state_machines.ApiKey]
        distinguishing_aspect: "A settle that pushes ApiKey.credits_consumed strictly past per_key_credit_cap auto-revokes the key; at exactly the cap the key stays ACTIVE (> comparison, not >=)."
        test_recipe:
          setup: ["Base chain; key with per_key_credit_cap 440; batch of 100 GEOCODE units (provisional 400) created period 0, clock +1 day (settled = 440)."]
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_pool
            - *c_prod
            - *c_grant
            - *c_act_org
            - *c_act_grant
            - *c_user
            - *c_accept
            - call: "POST /geo-orgs/api-keys"
              payload: { named_user_id: "${user_id}", organization_id: "${org_id}", label: "capped", allowed_service_kinds: ["GEOCODE"], per_key_credit_cap: 440 }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { key_id: $.data.id }
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 100, idempotency_key: "cap-1" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v: "$.data[0].version" }
          trigger:
            - call: "POST /geo-orgs/credit-batches/${b1}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v}" }
              as: BillingAdmin
            - call: "GET /geo-orgs/named-users/${user_id}/api-keys"
              payload: {}
              as: LicenseAdmin
            - call: "POST /geo-orgs/credit-batches"
              payload: { organization_id: "${org_id}", api_key_id: "${key_id}", service_kind: "GEOCODE", requested_units: 10, idempotency_key: "cap-2" }
              as: NamedUser
              as_user_id: "${user_id}"
              captures: { b2: $.data.id }
            - call: "GET /geo-orgs/credit-pools"
              payload: {}
              as: BillingAdmin
              captures: { pool_v2: "$.data[0].version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /geo-orgs/credit-batches/${b2}/transition"
              payload: { target_status: "SETTLED", expected_credit_pool_version: "${pool_v2}" }
              as: BillingAdmin
          assert:
            - "after first settle: ApiKey.credits_consumed == 440 and status == ACTIVE (440 > 440 is false — boundary)"
            - "after second settle: credits_consumed == 484 (440 + round(40*1.1)) and status == REVOKED"
            - "a subsequent POST /credit-batches with the revoked key returns ERR_API_KEY_REVOKED"

