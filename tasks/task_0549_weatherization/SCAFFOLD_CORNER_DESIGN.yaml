# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7. Corners already covered by a §1.8 instance are
# emitted as excluded_because stubs (no test_recipe). All others carry full
# reachable setup_api_calls chains against §1.5. Formula-derived asserts are
# pre-computed literals. Names are unique across §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_job_returns_201_with_initial_fields
        claim_type: Creation
        grounds:
          - 'entities.Job'
          - 'endpoints."POST /weatherization/jobs"'
        distinguishing_aspect: "POST /weatherization/jobs with all required fields returns 201, a server-minted UUID id, version 1, and computed money fields initialized to 0."
        test_recipe:
          setup: ["A dwelling to anchor the job"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "20 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
          trigger:
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
          assert:
            - "Job.${job_id}.job_status == ACTIVE"
            - "Job.${job_id}.install_status == PLANNED"
            - "Job.${job_id}.verification_status == PENDING"
            - "Job.${job_id}.version == 1"
            - "Job.${job_id}.approved_rebate_total_cents == 0"

      - name: create_job_missing_required_program_track_returns_validation
        claim_type: Required Fields
        grounds:
          - 'entities.Job.fields.program_track'
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "Omitting the required program_track on job create is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A dwelling exists"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "21 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
          trigger:
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"

      - name: create_dwelling_invalid_enum_foundation_returns_validation
        claim_type: Type Constraints
        grounds:
          - 'entities.Dwelling.fields.foundation_type'
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "A foundation_type outside {SLAB, CRAWLSPACE, BASEMENT} is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /weatherization/dwellings"
              payload: { address: "22 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "PIER", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"

      - name: get_job_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - 'entities.Job'
          - 'errors[ERR_NOT_FOUND]'
          - 'endpoints."GET /weatherization/jobs/{job_id}"'
        distinguishing_aspect: "GET a job with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /weatherization/jobs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND"

      - name: create_job_unknown_dwelling_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - 'entities.Job.fields.dwelling_id'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "Job create with a dwelling_id that resolves to nothing is rejected with ERR_NOT_FOUND (404) — body FK integrity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "11111111-1111-4111-8111-111111111111", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND"

      - name: diagnostic_test_is_immutable_id_only
        claim_type: Immutability
        grounds:
          - 'entities.DiagnosticTest'
        distinguishing_aspect: "DiagnosticTest is common_fields:false (append-only event): the created record exposes id + created_at and there is no update or version-bearing endpoint for it."
        test_recipe:
          setup: ["A job to attach a baseline test to"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "23 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "BASELINE", cfm_measured: 3000 }
              as: Auditor
              captures: { test_id: $.data.id }
          trigger:
            - call: "GET /weatherization/diagnostic-tests/${test_id}"
              payload: {}
              as: Auditor
          assert:
            - "DiagnosticTest.${test_id}.id is a present non-empty string"
            - "DiagnosticTest.${test_id}.cfm_measured == 3000"
            - "no state-transition or update endpoint exists for DiagnosticTest (append-only)"

      - name: list_jobs_pagination_envelope
        claim_type: Listing
        grounds:
          - 'entities.Job'
          - 'endpoints."GET /weatherization/jobs"'
          - 'response_envelope.pagination_fields'
        distinguishing_aspect: "GET /weatherization/jobs filtered by dwelling_id returns a Job[] with response_type array and pagination fields total_count=2, has_more=false."
        test_recipe:
          setup: ["One dwelling with two jobs"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "24 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
          trigger:
            - call: "GET /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "list response total_count == 2"
            - "list response has_more == false"

      - name: fk_reverse_lookup_scope_items_by_job
        claim_type: Retrieval
        grounds:
          - 'entities.ScopeItem.fields.job_id'
          - 'endpoints."GET /weatherization/scope-items"'
        distinguishing_aspect: "GET /weatherization/scope-items?job_id=... is the reverse-reachability channel for the ScopeItem.job_id FK, returning the job's scope items."
        test_recipe:
          setup: ["A job with one PROPOSED scope item"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "25 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "DUCT_SEALING", area_sqft: 500, target_r_value: 0, estimated_cost_cents: 40000, estimated_savings_kwh: 200 }
              as: Auditor
              captures: { scope_id: $.data.id }
          trigger:
            - call: "GET /weatherization/scope-items"
              payload: { job_id: "${job_id}" }
              as: ProgramAdmin
          assert:
            - "list response total_count == 1"
            - "list response data[0].id == ${scope_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: audit_decide_on_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - 'state_machines.EnergyAudit.SUBMITTED_to_APPROVED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "decide on a DRAFT (never submitted) audit is rejected with ERR_INVALID_STATE — decide requires SUBMITTED."
        test_recipe:
          setup: ["A DRAFT audit"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "26 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "EnergyAudit.${audit_id}.status == DRAFT"

      - name: audit_decide_on_approved_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - 'state_machines.EnergyAudit.terminal_states'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "decide on an APPROVED (terminal) audit is rejected with ERR_INVALID_STATE — no transition leaves APPROVED."
        test_recipe:
          setup: ["An APPROVED audit (submitted with no scope, then approved)"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "27 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "REJECT" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "EnergyAudit.${audit_id}.status == APPROVED"

      - name: audit_submit_twice_idempotency_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - 'state_machines.EnergyAudit.DRAFT_to_SUBMITTED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Submitting an already-SUBMITTED audit again is rejected with ERR_INVALID_STATE (submit requires DRAFT or REJECTED)."
        test_recipe:
          setup: ["A SUBMITTED audit"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "28 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
          trigger:
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "EnergyAudit.${audit_id}.status == SUBMITTED"

      - name: crew_assignment_sets_install_scheduled_side_effect
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.CrewAssignment.new_to_SCHEDULED'
          - 'entities.Job.fields.install_status'
        distinguishing_aspect: "Creating the first SCHEDULED CrewAssignment for a job moves Job.install_status PLANNED -> SCHEDULED (cross-entity side effect)."
        test_recipe:
          setup: ["A PLANNED job and a crew"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "29 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/crews"
              payload: { name: "Crew O", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-04T00:00:00Z" }
              as: ProgramAdmin
              captures: { ca_id: $.data.id }
          assert:
            - "CrewAssignment.${ca_id}.status == SCHEDULED"
            - "CrewAssignment.${ca_id}.duration_days == 3"
            - "Job.${job_id}.install_status == SCHEDULED"

      - name: verify_pass_completes_job_bubble_up
        claim_type: Bubble up
        grounds:
          - 'state_machines.Job.job_status_ACTIVE_to_job_status_COMPLETED'
          - 'state_machines.ScopeItem.INSTALLED_to_VERIFIED'
        distinguishing_aspect: "On verify PASS with install_status INSTALLED, Job.job_status auto-transitions ACTIVE -> COMPLETED and the INSTALLED ScopeItem -> VERIFIED (bubble-up)."
        test_recipe:
          setup:
            - "Attic scope INSTALLED, install complete; baseline 3000 by auditor-alice, post 2400 by auditor-bob (reduction 0.20 -> PASS)"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "30 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 30, estimated_cost_cents: 100000, estimated_savings_kwh: 500 }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
              as_user_id: "auditor-alice"
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew P", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 30, actual_cost_cents: 100000 }
              as: Installer
            - call: "POST /weatherization/jobs/${job_id}/complete-install"
              payload: {}
              as: ProgramAdmin
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "BASELINE", cfm_measured: 3000 }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { base_test_id: $.data.id }
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "POST", cfm_measured: 2400, baseline_test_id: "${base_test_id}" }
              as: Auditor
              as_user_id: "auditor-bob"
              captures: { post_test_id: $.data.id }
          trigger:
            - call: "POST /weatherization/jobs/${job_id}/verify"
              payload: { post_test_id: "${post_test_id}" }
              as: Auditor
              as_user_id: "auditor-bob"
          assert:
            - "Job.${job_id}.verification_status == PASSED"
            - "Job.${job_id}.job_status == COMPLETED"
            - "ScopeItem.${scope_id}.status == VERIFIED"

      - name: financing_second_offer_supersedes_first
        claim_type: Valid Transition
        grounds:
          - 'state_machines.FinancingPlan.OFFERED_to_SUPERSEDED'
          - 'entities.FinancingPlan.fields.status'
        distinguishing_aspect: "Creating a second FinancingPlan for a job supersedes the prior OFFERED plan (-> SUPERSEDED) while the new plan is OFFERED."
        test_recipe:
          setup: ["A job with one OFFERED financing plan"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "31 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /weatherization/financing-plans"
              payload: { job_id: "${job_id}", principal_cents: 500000, term_months: 60, apr_bps: 600, expected_job_version: "${job_v}" }
              as: ProgramAdmin
              captures: { fp_a_id: $.data.id }
            - call: "GET /weatherization/jobs/${job_id}"
              payload: {}
              as: ProgramAdmin
              captures: { job_v2: $.data.version }
          trigger:
            - call: "POST /weatherization/financing-plans"
              payload: { job_id: "${job_id}", principal_cents: 400000, term_months: 48, apr_bps: 500, expected_job_version: "${job_v2}" }
              as: ProgramAdmin
              captures: { fp_b_id: $.data.id }
          assert:
            - "FinancingPlan.${fp_a_id}.status == SUPERSEDED"
            - "FinancingPlan.${fp_b_id}.status == OFFERED"

      - name: financing_respond_accept_from_offered
        claim_type: Valid Transition
        grounds:
          - 'state_machines.FinancingPlan.OFFERED_to_ACCEPTED'
        distinguishing_aspect: "Homeowner respond(ACCEPT) moves an OFFERED financing plan to ACCEPTED."
        test_recipe:
          setup: ["A job with one OFFERED financing plan"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "32 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id, job_v: $.data.version }
            - call: "POST /weatherization/financing-plans"
              payload: { job_id: "${job_id}", principal_cents: 300000, term_months: 36, apr_bps: 700, expected_job_version: "${job_v}" }
              as: Homeowner
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /weatherization/financing-plans/${fp_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Homeowner
          assert:
            - "FinancingPlan.${fp_id}.status == ACCEPTED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: wap_income_above_limit_is_ineligible
        claim_type: Correct Result
        grounds:
          - 'calculations.wap_income_eligibility'
          - 'entities.WapApplication.fields.status'
        distinguishing_aspect: "One cent above the 200% FPL limit (household 3, limit 5000000; income 5000001) yields status INELIGIBLE — the opposite side of the inclusive boundary."
        test_recipe:
          setup: ["A dwelling"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "33 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
          trigger:
            - call: "POST /weatherization/wap-applications"
              payload: { dwelling_id: "${dwelling_id}", household_size: 3, annual_gross_income_cents: 5000001 }
              as: Homeowner
              captures: { wap_id: $.data.id }
          assert:
            - "WapApplication.${wap_id}.income_limit_cents == 5000000"
            - "WapApplication.${wap_id}.status == INELIGIBLE"

      - name: financing_amortization_monthly_payment
        claim_type: Correct Result
        grounds:
          - 'calculations.financing_amortization'
          - 'entities.FinancingPlan.fields.monthly_payment_cents'
        distinguishing_aspect: "financing_amortization for principal 500000, apr 600 bps, term 60 months yields monthly_payment_cents 9666 (standard amortization, round_half_up)."
        test_recipe:
          setup: ["A job to finance"]
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "34 Vine St", year_built: 1964, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
