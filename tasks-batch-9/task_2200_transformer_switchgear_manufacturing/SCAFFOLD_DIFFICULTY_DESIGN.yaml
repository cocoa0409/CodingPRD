              payload: { closed_by_user_id: "u_qe_1" }
              as: QualityEngineer
              as_user_id: "u_qe_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders/${ord_id}/warranty-claims"
              payload: { claim_number: "WC-0201", suspect_component_id: "${comp_id}", failure_reported_at: "2026-06-01T00:00:00Z", parts_claim_cents: 50000, labor_claim_cents: 0, freight_claim_cents: 0 }
              as: ContractAdmin
              captures: { wc1_id: $.data.id }
