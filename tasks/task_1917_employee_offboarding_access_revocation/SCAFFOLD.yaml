scenario: |
  1917. Employee Offboarding & Access Revocation (HR/IT offboarding process): resignation/termination intake & last-day determination, access revocation sequencing & manager notification, asset return tracking & payroll deduction for unreturned items, final pay timing by state law & PTO payout rules, exit interview & knowledge transfer plan, benefits/COBRA notification handoff, restrictive covenant reminder & post-employment obligations, rehire eligibility coding

domain_name: "employee-offboarding"
api_prefix: "/offboarding"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OffboardingCase
    parent: null
    common_fields: true
    fields:
      - name: employee_ref
        type: string
        source: input
        description: "External HRIS employee identifier (not an entity FK — HRIS is out of scope); unique per case"
        constraints: "unique across all OffboardingCase rows"
      - name: case_type
        type: enum
        source: input
        description: "Origin of the separation"
        constraints: "one of {RESIGNATION, TERMINATION, MUTUAL_SEPARATION, JOB_ABANDONMENT}"
      - name: work_state_code
        type: string
        source: input
        description: "Two-letter US state code governing final-pay timing and PTO payout law"
        constraints: "must be a supported state code in {CA, CO, IL, MA, TX, NY, WA, FL}"
      - name: notice_received_date
        type: datetime
        source: input
        description: "Date the resignation notice was given or termination decision was made (ISO 8601 UTC)"
      - name: requested_last_day
        type: datetime
        source: input
        description: "Employee-requested or manager-proposed last working day"
      - name: determined_last_day
        type: datetime
        source: computed
        description: "Authoritative last working day; derived by calc_last_day_determination at intake approval; null until APPROVED"
      - name: final_pay_due_at
        type: datetime
        source: computed
        description: "Deadline by which final wages must be paid; derived by calc_final_pay_deadline; null until APPROVED"
      - name: pto_balance_hours
        type: number
        source: input
        description: "Accrued, unused PTO balance in hours at intake time; 2-decimal"
        constraints: ">= 0"
      - name: tenure_years
        type: number
        source: input
        description: "Completed years of service, 1 decimal, used by PTO tier cap"
        constraints: ">= 0"
      - name: hourly_wage_cents
        type: integer
        source: input
        description: "Employee's final hourly wage in cents, used for PTO payout and deduction caps"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Compound posture of the whole offboarding; see state machine"
        default: INTAKE
        constraints: "one of {INTAKE, APPROVED, REVOCATION_IN_PROGRESS, PAYROLL_PENDING, CLEARANCE_IN_PROGRESS, READY_TO_CLOSE, CLOSED, VOIDED}"
      - name: revocation_posture
        type: enum
        source: computed
        description: "Aggregate of child AccessRevocationTask states; recomputed on every child mutation by calc_revocation_posture"
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETE}"
      - name: asset_posture
        type: enum
        source: computed
        description: "Aggregate of child AssetReturnItem states; recomputed on every child mutation by calc_asset_posture"
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, COMPLETE, DEFAULTED}"
      - name: deduction_total_cents
        type: integer
        source: computed
        description: "Sum over AssetReturnItem.deduction_amount_cents where deduction_status == APPLIED; maintained by calc_deduction_total"
        default: 0
      - name: rehire_code
        type: enum
        source: system
        description: "Rehire eligibility coding; set only by RehireEligibilityReview finalization"
        default: null
        constraints: "null until review finalized; one of {ELIGIBLE, ELIGIBLE_WITH_CONDITIONS, INELIGIBLE}"
      - name: closed_at
        type: datetime
        source: system
        description: "Timestamp when the case reached CLOSED; null otherwise"

  - name: AccessRevocationTask
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; owning case"
      - name: system_name
        type: enum
        source: input
        description: "Target system whose access must be revoked"
        constraints: "one of {EMAIL, VPN, ERP, CODE_REPO, BADGE, PAYROLL_SYSTEM, CRM, CLOUD_STORAGE}"
      - name: sequence_rank
        type: integer
        source: input
        description: "Revocation ordering; lower revokes first; ties forbidden within a case (uniqueness on (offboarding_case_id, sequence_rank))"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of this revocation task"
        default: PENDING
        constraints: "one of {PENDING, READY, EXECUTED, FAILED, RETRY_SCHEDULED, VERIFIED, WAIVED}"
      - name: scheduled_at
        type: datetime
        source: computed
        description: "When the task becomes executable; determined by calc_revocation_schedule; null until READY"
      - name: executed_at
        type: datetime
        source: system
        description: "When revocation was executed; null until EXECUTED"
      - name: verified_by
        type: string
        source: input
        description: "X-User-ID of the ITVerifier who verified the revocation; null until VERIFIED"
      - name: retry_count
        type: integer
        source: system
        description: "Number of FAILED -> RETRY_SCHEDULED cycles so far"
        default: 0
      - name: failure_reason
        type: string
        source: input
        description: "Operator-supplied reason recorded on FAILED transitions"

  - name: ManagerNotification
    parent: null
    common_fields: false
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; case this notification belongs to"
      - name: notification_kind
        type: enum
        source: input
        description: "Which manager notification this is"
        constraints: "one of {INTAKE_ALERT, LAST_DAY_CONFIRMED, REVOCATION_STARTED, REVOCATION_COMPLETE, CASE_CLOSED}"
      - name: sent_at
        type: datetime
        source: system
        description: "When the notification was dispatched (server clock)"
      - name: recipient_manager_ref
        type: string
        source: input
        description: "External manager identifier receiving the notification"
      - name: suppressed
        type: boolean
        source: system
        description: "True when dedupe rule calc_notification_dedupe collapsed this notification into an earlier one; suppressed rows remain queryable"
        default: false

  - name: AssetReturnItem
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; owning case"
      - name: asset_tag
        type: string
        source: input
        description: "Company asset tag; unique per case"
        constraints: "unique within offboarding_case_id"
      - name: asset_kind
        type: enum
        source: input
        description: "Class of asset, drives depreciation rate"
        constraints: "one of {LAPTOP, MONITOR, PHONE, KEYCARD, TOOLING, VEHICLE, UNIFORM, OTHER}"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: "Current replacement cost in cents"
        constraints: ">= 0"
      - name: issued_date
        type: datetime
        source: input
        description: "Date asset was issued to the employee; drives depreciation age"
      - name: return_due_at
        type: datetime
        source: computed
        description: "Return deadline; = determined_last_day + ASSET_RETURN_GRACE_DAYS (3 days); stamped when case APPROVED"
      - name: returned_at
        type: datetime
        source: system
        description: "When the asset was physically returned; null until RETURNED"
      - name: condition_on_return
        type: enum
        source: input
        description: "Condition recorded at return; drives damage deduction variant"
        constraints: "null until return; one of {GOOD, NORMAL_WEAR, DAMAGED, DESTROYED}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of this asset item"
        default: TRACKED
        constraints: "one of {TRACKED, RETURNED, OVERDUE, DEFAULTED, WAIVED}"
      - name: deduction_status
        type: enum
        source: system
        description: "Whether a payroll deduction has been computed/applied"
        default: NONE
        constraints: "one of {NONE, COMPUTED, APPLIED, WAIVED}"
      - name: deduction_amount_cents
        type: integer
        source: computed
        description: "Deduction computed by calc_asset_deduction; 0 unless deduction_status in {COMPUTED, APPLIED}"
        default: 0

  - name: FinalPayStatement
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; exactly one per case (unique)"
        constraints: "unique on offboarding_case_id"
      - name: regular_wages_cents
        type: integer
        source: input
        description: "Unpaid regular wages through determined_last_day"
        constraints: ">= 0"
      - name: pto_payout_cents
        type: integer
        source: computed
        description: "PTO payout per calc_pto_payout; recomputed at APPROVE and at each recalculation"
        default: 0
      - name: deduction_total_cents
        type: integer
        source: computed
        description: "Mirror of OffboardingCase.deduction_total_cents, capped by calc_final_net_pay"
        default: 0
      - name: net_pay_cents
        type: integer
        source: computed
        description: "regular_wages_cents + pto_payout_cents - deduction_total_cents, floor 0; per calc_final_net_pay"
        default: 0
      - name: state_law_variant
        type: enum
        source: computed
        description: "Which final-pay timing variant governs this case"
        constraints: "one of {IMMEDIATE_ON_TERMINATION, NEXT_PAYDAY, WITHIN_FIXED_DAYS}"
      - name: due_at
        type: datetime
        source: computed
        description: "Final pay legal deadline per calc_final_pay_deadline"
      - name: status
        type: enum
        source: system
        description: "Statement lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, CALCULATED, APPROVED, DISBURSED, LATE, VOIDED}"
      - name: disbursed_at
        type: datetime
        source: system
        description: "When payment was disbursed; null until DISBURSED"
      - name: late_penalty_cents
        type: integer
        source: computed
        description: "Waiting-time penalty per calc_late_penalty; 0 unless status LATE"
        default: 0

  - name: ExitInterview
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; owning case"
      - name: interviewer_ref
        type: string
        source: input
        description: "External HR interviewer identifier"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Interview start (ISO 8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Interview end (ISO 8601 UTC); must be > scheduled_start"
      - name: status
        type: enum
        source: system
        description: "Interview lifecycle; supports reschedule cycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RESCHEDULE_REQUESTED, COMPLETED, NO_SHOW, DECLINED, CANCELLED}"
      - name: reschedule_count
        type: integer
        source: system
        description: "Number of SCHEDULED -> RESCHEDULE_REQUESTED -> SCHEDULED loops so far (also incremented by NO_SHOW -> SCHEDULED rehabilitation); hard cap MAX_INTERVIEW_RESCHEDULES = 2 across both loops"
        default: 0
      - name: completion_notes_ref
        type: string
        source: input
        description: "Opaque pointer to notes store; required on COMPLETED"
      - name: declined_reason
        type: string
        source: input
        description: "Employee's reason when declining; required on DECLINED"

  - name: KnowledgeTransferPlan
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; exactly one per case (unique)"
        constraints: "unique on offboarding_case_id"
      - name: owner_manager_ref
        type: string
        source: input
        description: "Manager accountable for knowledge transfer"
      - name: required_session_count
        type: integer
        source: input
        description: "Number of KT sessions the manager deems necessary"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Plan posture derived from sessions; see state machine"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, COMPLETE, INCOMPLETE_AT_CLOSE, WAIVED}"
      - name: completed_session_count
        type: integer
        source: computed
        description: "Count of KnowledgeTransferSession rows with status == COMPLETED; maintained by calc_kt_progress"
        default: 0
      - name: waived_reason
        type: string
        source: input
        description: "Reason recorded when plan is waived (e.g., role redundancy)"

  - name: KnowledgeTransferSession
    parent: null
    common_fields: true
    fields:
      - name: knowledge_transfer_plan_id
        type: string
        source: input
        description: "FK -> KnowledgeTransferPlan.id; owning plan"
      - name: topic
        type: string
        source: input
        description: "Session topic"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Session start (ISO 8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Session end (ISO 8601 UTC); must be > scheduled_start"
      - name: successor_ref
        type: string
        source: input
        description: "Employee receiving the knowledge"
      - name: status
        type: enum
        source: system
        description: "Session lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED, NO_SHOW}"

  - name: BenefitsNotice
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; owning case"
      - name: notice_kind
        type: enum
        source: input
        description: "Which benefits notice this is"
        constraints: "one of {COBRA_ELECTION, BENEFITS_TERMINATION, RETIREMENT_PLAN, LIFE_INSURANCE_CONVERSION}"
      - name: status
        type: enum
        source: system
        description: "Notice handoff lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, QUEUED, SENT, ACKNOWLEDGED, FAILED, ESCALATED}"
      - name: send_by
        type: datetime
        source: computed
        description: "Legal send deadline per calc_benefits_deadline (notice-kind-specific); null until QUEUED"
      - name: sent_at
        type: datetime
        source: system
        description: "Dispatch timestamp; null until SENT"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "When the employee/vendor acknowledged; null until ACKNOWLEDGED"
      - name: failure_count
        type: integer
        source: system
        description: "Number of SENT/QUEUED -> FAILED cycles so far; hard cap MAX_NOTICE_FAILURES = 2 (requeue forbidden at cap, escalate allowed)"
        default: 0

  - name: RestrictiveCovenantAck
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; owning case"
      - name: covenant_kind
        type: enum
        source: input
        description: "Which restrictive covenant this acknowledgment covers"
        constraints: "one of {NON_COMPETE, NON_SOLICIT_CLIENTS, NON_SOLICIT_EMPLOYEES, CONFIDENTIALITY, IP_ASSIGNMENT}"
      - name: status
        type: enum
        source: system
        description: "Acknowledgment lifecycle"
        default: PENDING
        constraints: "one of {PENDING, REMINDED, ACKNOWLEDGED, EXPIRED, NOT_APPLICABLE}"
      - name: remind_at
        type: datetime
        source: computed
        description: "When the reminder notice fires per calc_covenant_reminder; null until REMINDED scheduled"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "When the employee acknowledged post-employment obligations"
      - name: acknowledgment_text_version
        type: string
        source: input
        description: "Version tag of the covenant text the employee acknowledged"

  - name: RehireEligibilityReview
    parent: null
    common_fields: true
    fields:
      - name: offboarding_case_id
        type: string
        source: input
        description: "FK -> OffboardingCase.id; exactly one per case (unique)"
        constraints: "unique on offboarding_case_id"
      - name: reviewer_hr_ref
        type: string
        source: input
        description: "HR reviewer external identifier; must differ from the intake approver (segregation of duties)"
      - name: recommended_code
        type: enum
        source: input
        description: "Reviewer's recommended rehire code"
        constraints: "one of {ELIGIBLE, ELIGIBLE_WITH_CONDITIONS, INELIGIBLE}"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, FINALIZED, RETURNED}"
      - name: finalized_at
        type: datetime
        source: system
        description: "When the review was finalized; null until FINALIZED"
      - name: rationale
        type: string
        source: input
        description: "Free-text rationale; required on SUBMITTED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OffboardingCase
    initial_state: INTAKE
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: INTAKE
        to: APPROVED
        trigger: "POST /offboarding/offboarding-cases/{id}/approve"
        actor: HRPartner
        preconditions:
          - "case.status == INTAKE"
          - "approver X-User-ID != case creator's recorded intake_hr_ref (segregation of duties, SoD-1)"
          - "requested_last_day >= notice_received_date"
        side_effects:
          - "run calc_last_day_determination -> sets determined_last_day"
          - "run calc_final_pay_deadline -> sets final_pay_due_at"
          - "create FinalPayStatement (status DRAFT) if absent; set state_law_variant and due_at"
          - "create KnowledgeTransferPlan (status DRAFT) if absent"
          - "create RehireEligibilityReview (status DRAFT) if absent"
          - "for each AssetReturnItem of this case: set return_due_at = determined_last_day + ASSET_RETURN_GRACE_DAYS"
          - "emit ManagerNotification(LAST_DAY_CONFIRMED) unless suppressed by calc_notification_dedupe"
          - "increments OffboardingCase.version by 1"
        note: "Approver must differ from intake recorder — enforced via X-User-ID vs recorded field"
      - from: APPROVED
        to: REVOCATION_IN_PROGRESS
        trigger: "system auto-transition when first AccessRevocationTask leaves PENDING for READY/EXECUTED"
        actor: system
        preconditions:
          - "case.status == APPROVED"
          - "at least one AccessRevocationTask of this case has status in {READY, EXECUTED}"
        side_effects:
          - "emit ManagerNotification(REVOCATION_STARTED) unless suppressed"
          - "increments OffboardingCase.version by 1"
      - from: REVOCATION_IN_PROGRESS
        to: PAYROLL_PENDING
        trigger: "system auto-transition when calc_revocation_posture yields COMPLETE"
        actor: system
        preconditions:
          - "case.status == REVOCATION_IN_PROGRESS"
          - "revocation_posture == COMPLETE (all AccessRevocationTask rows in {VERIFIED, WAIVED})"
        side_effects:
          - "emit ManagerNotification(REVOCATION_COMPLETE) unless suppressed"
          - "queue all BenefitsNotice rows of this case (DRAFT -> QUEUED) and stamp send_by via calc_benefits_deadline"
          - "schedule RestrictiveCovenantAck reminders: PENDING rows get remind_at via calc_covenant_reminder"
          - "increments OffboardingCase.version by 1"
      - from: REVOCATION_IN_PROGRESS
        to: CLEARANCE_IN_PROGRESS
        trigger: "system auto-transition when calc_revocation_posture yields COMPLETE and the FinalPayStatement is already APPROVED (payroll-first order)"
        actor: system
        preconditions:
          - "case.status == REVOCATION_IN_PROGRESS"
          - "revocation_posture == COMPLETE (all AccessRevocationTask rows in {VERIFIED, WAIVED})"
          - "FinalPayStatement.status in {APPROVED, DISBURSED, LATE}"
        side_effects:
          - "emit ManagerNotification(REVOCATION_COMPLETE) unless suppressed"
          - "queue all BenefitsNotice rows of this case (DRAFT -> QUEUED) and stamp send_by via calc_benefits_deadline"
          - "schedule RestrictiveCovenantAck reminders: PENDING rows get remind_at via calc_covenant_reminder"
          - "increments OffboardingCase.version by 1"
      - from: PAYROLL_PENDING
        to: CLEARANCE_IN_PROGRESS
        trigger: "POST /offboarding/final-pay-statements/{id}/approve"
        actor: PayrollSpecialist
        preconditions:
          - "case.status == PAYROLL_PENDING"
          - "FinalPayStatement.status == CALCULATED"
          - "statement.approver X-User-ID != statement calculator's recorded calc_by_ref (segregation of duties, SoD-2)"
        side_effects:
          - "FinalPayStatement.status -> APPROVED"
          - "increments OffboardingCase.version by 1"
      - from: CLEARANCE_IN_PROGRESS
        to: READY_TO_CLOSE
        trigger: "system auto-transition when asset_posture in {COMPLETE, DEFAULTED} AND every ExitInterview is in {COMPLETED, DECLINED, CANCELLED} AND KnowledgeTransferPlan in {COMPLETE, WAIVED}"
        actor: system
        preconditions:
          - "case.status == CLEARANCE_IN_PROGRESS"
          - "asset_posture in {COMPLETE, DEFAULTED}"
          - "no ExitInterview of this case in {SCHEDULED, RESCHEDULE_REQUESTED}"
          - "KnowledgeTransferPlan.status in {COMPLETE, WAIVED}"
        side_effects:
          - "increments OffboardingCase.version by 1"
      - from: READY_TO_CLOSE
        to: CLOSED
        trigger: "POST /offboarding/offboarding-cases/{id}/close"
        actor: HRPartner
        preconditions:
          - "case.status == READY_TO_CLOSE"
          - "RehireEligibilityReview.status == FINALIZED (rehire_code must be set before close)"
          - "every BenefitsNotice in {SENT, ACKNOWLEDGED, ESCALATED}"
          - "FinalPayStatement.status in {DISBURSED, LATE}"
        side_effects:
          - "copy RehireEligibilityReview.recommended_code into OffboardingCase.rehire_code"
          - "stamp closed_at"
          - "emit ManagerNotification(CASE_CLOSED) unless suppressed"
          - "any RestrictiveCovenantAck still PENDING/REMINDED -> EXPIRED"
          - "increments OffboardingCase.version by 1"
      - from: INTAKE
        to: VOIDED
        trigger: "POST /offboarding/offboarding-cases/{id}/void"
        actor: HRPartner
        preconditions:
          - "case.status in {INTAKE, APPROVED}"
          - "void_reason provided"
        side_effects:
          - "all AccessRevocationTask in {PENDING, READY, RETRY_SCHEDULED} -> WAIVED"
          - "all AssetReturnItem in {TRACKED} -> WAIVED"
          - "FinalPayStatement in {DRAFT, CALCULATED} -> VOIDED"
          - "increments OffboardingCase.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /offboarding/offboarding-cases/{id}/void"
        actor: HRPartner
        preconditions:
          - "case.status in {INTAKE, APPROVED}"
          - "void_reason provided"
          - "no AccessRevocationTask yet EXECUTED or VERIFIED (revocation already started cannot be voided)"
        side_effects:
          - "all AccessRevocationTask in {PENDING, READY, RETRY_SCHEDULED} -> WAIVED"
          - "all AssetReturnItem in {TRACKED} -> WAIVED"
          - "FinalPayStatement in {DRAFT, CALCULATED} -> VOIDED"
          - "increments OffboardingCase.version by 1"

  - entity: AccessRevocationTask
    initial_state: PENDING
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "system scheduler fires when current_utc >= scheduled_at AND every lower sequence_rank task of the same case is in {VERIFIED, WAIVED} (ordering gate)"
        actor: system
        preconditions:
          - "task.status == PENDING"
          - "current_utc >= task.scheduled_at"
          - "no sibling task with sequence_rank < this.sequence_rank in {PENDING, READY, EXECUTED, FAILED, RETRY_SCHEDULED}"
        side_effects:
          - "recompute OffboardingCase.revocation_posture via calc_revocation_posture (may flip case APPROVED -> REVOCATION_IN_PROGRESS)"
      - from: READY
        to: EXECUTED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/execute"
        actor: ITOperator
        preconditions:
          - "task.status == READY"
          - "parent OffboardingCase.status in {APPROVED, REVOCATION_IN_PROGRESS}"
        side_effects:
          - "stamp executed_at"
          - "recompute OffboardingCase.revocation_posture"
      - from: READY
        to: FAILED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/execute with outcome=FAILED and failure_reason"
        actor: ITOperator
        preconditions:
          - "task.status == READY"
          - "failure_reason non-empty"
        side_effects:
          - "recompute OffboardingCase.revocation_posture (may become BLOCKED)"
      - from: FAILED
        to: RETRY_SCHEDULED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/retry"
        actor: ITOperator
        preconditions:
          - "task.status == FAILED"
          - "task.retry_count < MAX_REVOKE_RETRIES (3)"
        side_effects:
          - "increment retry_count by 1"
          - "set scheduled_at = current_utc + RETRY_BACKOFF_MINUTES * retry_count"
          - "recompute OffboardingCase.revocation_posture"
      - from: RETRY_SCHEDULED
        to: READY
        trigger: "system scheduler fires when current_utc >= scheduled_at (same ordering gate as PENDING -> READY)"
        actor: system
        preconditions:
          - "task.status == RETRY_SCHEDULED"
          - "current_utc >= task.scheduled_at"
        side_effects:
          - "recompute OffboardingCase.revocation_posture"
      - from: EXECUTED
        to: VERIFIED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/verify"
        actor: ITVerifier
        preconditions:
          - "task.status == EXECUTED"
          - "verifier X-User-ID != executor's recorded user id (segregation of duties, SoD-3)"
        side_effects:
          - "stamp verified_by with verifier X-User-ID"
          - "recompute OffboardingCase.revocation_posture (may flip to COMPLETE -> cascades case REVOCATION_IN_PROGRESS -> PAYROLL_PENDING)"
      - from: EXECUTED
        to: FAILED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/verify with outcome=REJECTED"
        actor: ITVerifier
        preconditions:
          - "task.status == EXECUTED"
        side_effects:
          - "recompute OffboardingCase.revocation_posture"
      - from: RETRY_SCHEDULED
        to: WAIVED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/waive"
        actor: ITManager
        preconditions:
          - "task.status in {FAILED, RETRY_SCHEDULED}"
          - "task.retry_count >= MAX_REVOKE_RETRIES (3)"
          - "waive_reason provided"
        side_effects:
          - "recompute OffboardingCase.revocation_posture"
      - from: FAILED
        to: WAIVED
        trigger: "POST /offboarding/access-revocation-tasks/{id}/waive"
        actor: ITManager
        preconditions:
          - "task.status in {FAILED, RETRY_SCHEDULED}"
          - "task.retry_count >= MAX_REVOKE_RETRIES (3)"
          - "waive_reason provided"
        side_effects:
          - "recompute OffboardingCase.revocation_posture"

  - entity: AssetReturnItem
    initial_state: TRACKED
    terminal_states: [RETURNED, DEFAULTED, WAIVED]
    transitions:
      - from: TRACKED
        to: RETURNED
        trigger: "POST /offboarding/asset-return-items/{id}/record-return"
        actor: AssetClerk
        preconditions:
          - "item.status == TRACKED"
          - "condition_on_return provided"
          - "parent OffboardingCase.status in {APPROVED, REVOCATION_IN_PROGRESS, PAYROLL_PENDING, CLEARANCE_IN_PROGRESS, READY_TO_CLOSE}"
        side_effects:
          - "stamp returned_at = current_utc"
          - "if condition_on_return in {DAMAGED, DESTROYED}: run calc_asset_deduction (damage variant) and set deduction_status=COMPUTED"
          - "recompute OffboardingCase.asset_posture via calc_asset_posture"
      - from: TRACKED
        to: OVERDUE
        trigger: "system scheduler fires when current_utc > return_due_at AND item still TRACKED"
        actor: system
        preconditions:
          - "item.status == TRACKED"
          - "return_due_at is not null"
          - "current_utc > return_due_at"
        side_effects:
          - "recompute OffboardingCase.asset_posture (may become DEFAULTED)"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /offboarding/asset-return-items/{id}/record-return"
        actor: AssetClerk
        preconditions:
          - "item.status == OVERDUE"
          - "condition_on_return provided"
        side_effects:
          - "stamp returned_at = current_utc"
          - "run calc_asset_deduction (late + condition variant) and set deduction_status=COMPUTED"
          - "recompute OffboardingCase.asset_posture"
      - from: OVERDUE
        to: DEFAULTED
        trigger: "POST /offboarding/asset-return-items/{id}/mark-defaulted"
        actor: PayrollSpecialist
        preconditions:
          - "item.status == OVERDUE"
          - "current_utc > return_due_at + ASSET_DEFAULT_GRACE_DAYS (7)"
          - "parent OffboardingCase.status in {PAYROLL_PENDING, CLEARANCE_IN_PROGRESS}"
        side_effects:
          - "run calc_asset_deduction (default variant) and set deduction_status=APPLIED"
          - "run calc_deduction_total -> OffboardingCase.deduction_total_cents updated"
          - "if FinalPayStatement.status in {CALCULATED, APPROVED}: recompute calc_final_net_pay and stamp deduction_total_cents, net_pay_cents"
          - "recompute OffboardingCase.asset_posture"
      - from: TRACKED
        to: WAIVED
        trigger: "POST /offboarding/asset-return-items/{id}/waive"
        actor: AssetClerk
        preconditions:
          - "item.status in {TRACKED, OVERDUE}"
          - "waive_reason provided"
        side_effects:
          - "if deduction_status in {COMPUTED, APPLIED}: deduction_status -> WAIVED, deduction_amount_cents -> 0, run calc_deduction_total"
          - "recompute OffboardingCase.asset_posture"
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /offboarding/asset-return-items/{id}/waive"
        actor: AssetClerk
        preconditions:
          - "item.status in {TRACKED, OVERDUE}"
          - "waive_reason provided"
        side_effects:
          - "if deduction_status in {COMPUTED, APPLIED}: deduction_status -> WAIVED, deduction_amount_cents -> 0, run calc_deduction_total"
          - "recompute OffboardingCase.asset_posture"

  - entity: FinalPayStatement
    initial_state: DRAFT
    terminal_states: [DISBURSED, LATE, VOIDED]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /offboarding/final-pay-statements/{id}/calculate"
        actor: PayrollSpecialist
        preconditions:
          - "statement.status == DRAFT"
          - "parent OffboardingCase.status in {APPROVED, REVOCATION_IN_PROGRESS, PAYROLL_PENDING}"
        side_effects:
          - "run calc_pto_payout -> pto_payout_cents"
          - "run calc_final_net_pay -> deduction_total_cents, net_pay_cents"
          - "record calculator user id as calc_by_ref (for SoD-2)"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /offboarding/final-pay-statements/{id}/approve"
        actor: PayrollSpecialist
        preconditions:
          - "statement.status == CALCULATED"
          - "approver X-User-ID != recorded calc_by_ref (segregation of duties, SoD-2)"
          - "parent OffboardingCase.status in {APPROVED, REVOCATION_IN_PROGRESS, PAYROLL_PENDING}"
        side_effects:
          - "if parent case status == PAYROLL_PENDING: cascade parent case PAYROLL_PENDING -> CLEARANCE_IN_PROGRESS (revocation-first order); otherwise the case advances to CLEARANCE_IN_PROGRESS via the REVOCATION_IN_PROGRESS -> CLEARANCE_IN_PROGRESS auto-transition once revocation completes (payroll-first order)"
      - from: CALCULATED
        to: DRAFT
        trigger: "POST /offboarding/final-pay-statements/{id}/recalculate (reverts to DRAFT then recomputes)"
        actor: PayrollSpecialist
        preconditions:
          - "statement.status == CALCULATED"
          - "parent OffboardingCase.status in {APPROVED, REVOCATION_IN_PROGRESS, PAYROLL_PENDING}"
        side_effects:
          - "recompute pto_payout_cents, deduction_total_cents, net_pay_cents"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /offboarding/final-pay-statements/{id}/disburse"
        actor: PayrollSpecialist
        preconditions:
          - "statement.status == APPROVED"
          - "current_utc <= statement.due_at (on-time) — if past due, disburse transitions to LATE instead"
        side_effects:
          - "stamp disbursed_at"
      - from: APPROVED
        to: LATE
        trigger: "POST /offboarding/final-pay-statements/{id}/disburse when current_utc > statement.due_at, OR system scheduler marks LATE when due_at passes undisbursed"
        actor: PayrollSpecialist
        preconditions:
          - "statement.status == APPROVED"
          - "current_utc > statement.due_at"
        side_effects:
          - "stamp disbursed_at (if triggered by disburse call)"
          - "run calc_late_penalty -> late_penalty_cents"
      - from: DRAFT
        to: VOIDED
        trigger: "parent OffboardingCase voided (cascade)"
        actor: system
        preconditions:
          - "statement.status in {DRAFT, CALCULATED}"
        side_effects: []
      - from: CALCULATED
        to: VOIDED
        trigger: "parent OffboardingCase voided (cascade)"
        actor: system
        preconditions:
          - "statement.status in {DRAFT, CALCULATED}"
        side_effects: []

  - entity: ExitInterview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, DECLINED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /offboarding/exit-interviews/{id}/request-reschedule"
        actor: HRPartner
        preconditions:
          - "interview.status == SCHEDULED"
          - "reschedule_count < MAX_INTERVIEW_RESCHEDULES (2)"
          - "parent case not in {CLOSED, VOIDED}"
        side_effects:
          - "increment reschedule_count by 1"
      - from: RESCHEDULE_REQUESTED
        to: SCHEDULED
        trigger: "POST /offboarding/exit-interviews/{id}/reschedule with new scheduled_start/scheduled_end"
        actor: HRPartner
        preconditions:
          - "interview.status == RESCHEDULE_REQUESTED"
          - "new window does not overlap another SCHEDULED ExitInterview of the same case (calendar overlap rule OVERLAP-A: half-open [start, end))"
          - "new scheduled_end <= parent case determined_last_day + INTERVIEW_HARD_LIMIT_DAYS (5)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /offboarding/exit-interviews/{id}/complete"
        actor: HRPartner
        preconditions:
          - "interview.status == SCHEDULED"
          - "completion_notes_ref provided"
          - "current_utc >= scheduled_start (cannot complete before it begins)"
        side_effects:
          - "re-evaluate parent case READY_TO_CLOSE auto-transition gate"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system scheduler marks NO_SHOW when current_utc > scheduled_end AND still SCHEDULED"
        actor: system
        preconditions:
          - "interview.status == SCHEDULED"
          - "current_utc > scheduled_end"
        side_effects: []
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /offboarding/exit-interviews/{id}/reschedule (from NO_SHOW, one rehabilitation loop)"
        actor: HRPartner
        preconditions:
          - "interview.status == NO_SHOW"
          - "reschedule_count < MAX_INTERVIEW_RESCHEDULES (2)"
          - "new window does not overlap another SCHEDULED ExitInterview of the same case (OVERLAP-A)"
        side_effects:
          - "increment reschedule_count by 1"
      - from: SCHEDULED
        to: DECLINED
        trigger: "POST /offboarding/exit-interviews/{id}/decline"
        actor: HRPartner
        preconditions:
          - "interview.status == SCHEDULED"
          - "declined_reason provided"
        side_effects:
          - "re-evaluate parent case READY_TO_CLOSE auto-transition gate"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /offboarding/exit-interviews/{id}/cancel"
        actor: HRPartner
        preconditions:
          - "interview.status == SCHEDULED"
        side_effects:
          - "re-evaluate parent case READY_TO_CLOSE auto-transition gate"

  - entity: KnowledgeTransferPlan
    initial_state: DRAFT
    terminal_states: [COMPLETE, INCOMPLETE_AT_CLOSE, WAIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /offboarding/knowledge-transfer-plans/{id}/activate"
        actor: Manager
        preconditions:
          - "plan.status == DRAFT"
          - "required_session_count >= 0"
          - "parent OffboardingCase.status in {APPROVED, REVOCATION_IN_PROGRESS, PAYROLL_PENDING}"
        side_effects: []
      - from: ACTIVE
        to: COMPLETE
        trigger: "system auto-transition when completed_session_count >= required_session_count AND required_session_count > 0; also direct POST /offboarding/knowledge-transfer-plans/{id}/complete when required_session_count == 0"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "completed_session_count >= required_session_count"
        side_effects:
          - "re-evaluate parent case READY_TO_CLOSE auto-transition gate"
      - from: ACTIVE
        to: WAIVED
        trigger: "POST /offboarding/knowledge-transfer-plans/{id}/waive"
        actor: Manager
        preconditions:
          - "plan.status in {DRAFT, ACTIVE}"
          - "waived_reason provided"
        side_effects:
          - "re-evaluate parent case READY_TO_CLOSE auto-transition gate"
      - from: DRAFT
        to: WAIVED
        trigger: "POST /offboarding/knowledge-transfer-plans/{id}/waive"
        actor: Manager
        preconditions:
          - "plan.status in {DRAFT, ACTIVE}"
          - "waived_reason provided"
        side_effects:
          - "re-evaluate parent case READY_TO_CLOSE auto-transition gate"
      - from: ACTIVE
        to: INCOMPLETE_AT_CLOSE
        trigger: "system marks when parent case reaches READY_TO_CLOSE and plan still ACTIVE"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
          - "parent OffboardingCase.status == READY_TO_CLOSE"
        side_effects: []

  - entity: KnowledgeTransferSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /offboarding/knowledge-transfer-sessions/{id}/complete"
        actor: Manager
        preconditions:
          - "session.status == SCHEDULED"
          - "parent KnowledgeTransferPlan.status == ACTIVE"
          - "current_utc >= scheduled_start"
        side_effects:
          - "run calc_kt_progress -> plan.completed_session_count (may flip plan ACTIVE -> COMPLETE)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /offboarding/knowledge-transfer-sessions/{id}/cancel"
        actor: Manager
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "run calc_kt_progress"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system scheduler marks NO_SHOW when current_utc > scheduled_end AND still SCHEDULED"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
          - "current_utc > scheduled_end"
        side_effects:
          - "run calc_kt_progress"

  - entity: BenefitsNotice
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, ESCALATED]
    transitions:
      - from: DRAFT
        to: QUEUED
        trigger: "system cascade when parent case reaches PAYROLL_PENDING; stamps send_by via calc_benefits_deadline"
        actor: system
        preconditions:
          - "notice.status == DRAFT"
        side_effects:
          - "stamp send_by per calc_benefits_deadline (notice-kind-specific)"
      - from: QUEUED
        to: SENT
        trigger: "POST /offboarding/benefits-notices/{id}/send"
        actor: BenefitsAdministrator
        preconditions:
          - "notice.status == QUEUED"
          - "current_utc <= send_by (sending after deadline transitions to FAILED with compliance error instead)"
        side_effects:
          - "stamp sent_at"
      - from: QUEUED
        to: FAILED
        trigger: "system scheduler marks FAILED when current_utc > send_by AND still QUEUED"
        actor: system
        preconditions:
          - "notice.status == QUEUED"
          - "current_utc > send_by"
        side_effects:
          - "increment failure_count"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /offboarding/benefits-notices/{id}/acknowledge"
        actor: BenefitsAdministrator
        preconditions:
          - "notice.status == SENT"
        side_effects:
          - "stamp acknowledged_at"
      - from: SENT
        to: FAILED
        trigger: "POST /offboarding/benefits-notices/{id}/report-failure (vendor rejection)"
        actor: BenefitsAdministrator
        preconditions:
          - "notice.status == SENT"
        side_effects:
          - "increment failure_count"
      - from: FAILED
        to: QUEUED
        trigger: "POST /offboarding/benefits-notices/{id}/requeue"
        actor: BenefitsAdministrator
        preconditions:
          - "notice.status == FAILED"
          - "failure_count < MAX_NOTICE_FAILURES (2)"
          - "new send_by recomputed via calc_benefits_deadline from current_utc"
        side_effects:
          - "recompute send_by"
      - from: FAILED
        to: ESCALATED
        trigger: "POST /offboarding/benefits-notices/{id}/escalate"
        actor: BenefitsAdministrator
        preconditions:
          - "notice.status == FAILED"
          - "failure_count >= MAX_NOTICE_FAILURES (2)"
        side_effects: []

  - entity: RestrictiveCovenantAck
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, EXPIRED, NOT_APPLICABLE]
    transitions:
      - from: PENDING
        to: REMINDED
        trigger: "system scheduler fires reminder at remind_at (set when case reaches PAYROLL_PENDING)"
        actor: system
        preconditions:
          - "ack.status == PENDING"
          - "remind_at is not null"
          - "current_utc >= remind_at"
        side_effects: []
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /offboarding/restrictive-covenant-acks/{id}/acknowledge"
        actor: HRPartner
        preconditions:
          - "ack.status in {PENDING, REMINDED}"
          - "acknowledgment_text_version provided"
          - "parent case not in {CLOSED, VOIDED}"
        side_effects:
          - "stamp acknowledged_at"
      - from: REMINDED
        to: ACKNOWLEDGED
        trigger: "POST /offboarding/restrictive-covenant-acks/{id}/acknowledge"
        actor: HRPartner
        preconditions:
          - "ack.status in {PENDING, REMINDED}"
          - "acknowledgment_text_version provided"
          - "parent case not in {CLOSED, VOIDED}"
        side_effects:
          - "stamp acknowledged_at"
      - from: PENDING
        to: EXPIRED
        trigger: "system cascade when parent case CLOSED with ack still open"
        actor: system
        preconditions:
          - "ack.status in {PENDING, REMINDED}"
          - "parent OffboardingCase.status transitioned to CLOSED"
        side_effects: []
      - from: REMINDED
        to: EXPIRED
        trigger: "system cascade when parent case CLOSED with ack still open"
        actor: system
        preconditions:
          - "ack.status in {PENDING, REMINDED}"
          - "parent OffboardingCase.status transitioned to CLOSED"
        side_effects: []
      - from: PENDING
        to: NOT_APPLICABLE
        trigger: "POST /offboarding/restrictive-covenant-acks/{id}/mark-not-applicable"
        actor: HRPartner
        preconditions:
          - "ack.status == PENDING"
          - "parent case in {INTAKE, APPROVED}"
        side_effects: []

  - entity: RehireEligibilityReview
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /offboarding/rehire-eligibility-reviews/{id}/submit"
        actor: HRReviewer
        preconditions:
          - "review.status == DRAFT"
          - "rationale non-empty"
          - "recommended_code provided"
          - "parent OffboardingCase.status in {CLEARANCE_IN_PROGRESS, READY_TO_CLOSE}"
        side_effects: []
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /offboarding/rehire-eligibility-reviews/{id}/finalize"
        actor: HRDirector
        preconditions:
          - "review.status == SUBMITTED"
          - "finalizer X-User-ID != review.reviewer_hr_ref (segregation of duties, SoD-4)"
        side_effects:
          - "stamp finalized_at"
          - "parent case rehire_code becomes recommended_code at close time"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /offboarding/rehire-eligibility-reviews/{id}/return"
        actor: HRDirector
        preconditions:
          - "review.status == SUBMITTED"
          - "return_reason provided"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /offboarding/rehire-eligibility-reviews/{id}/submit (revision loop)"
        actor: HRReviewer
        preconditions:
          - "review.status == RETURNED"
          - "rationale non-empty"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-close-stale-version
    parent_entity: OffboardingCase
    write_endpoint: "POST /offboarding/offboarding-cases/{id}/close"
    occ_field: "expected_offboarding_case_version"
    description: |
      Closing an OffboardingCase whose version has advanced since the caller last
      observed it is rejected. Another writer (e.g., a cascaded posture flip from an
      AccessRevocationTask verification, or an asset deduction application) may have
      mutated the case between the caller's read and the close attempt; the close must
      observe the latest posture before sealing the record.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: statement-calculate-stale-version
    parent_entity: FinalPayStatement
    write_endpoint: "POST /offboarding/final-pay-statements/{id}/calculate"
    occ_field: "expected_final_pay_statement_version"
    description: |
      Calculating a FinalPayStatement whose version has advanced since the caller last
      observed it is rejected. A deduction application from AssetReturnItem DEFAULTED
      may have recomputed deduction_total_cents/net_pay_cents; recalculating from a
      stale view would silently overwrite those cascaded values.
    error_id: ERR_STALE_STATEMENT_VERSION
    http_status: 412
  - rule_id: asset-return-stale-version
    parent_entity: AssetReturnItem
    write_endpoint: "POST /offboarding/asset-return-items/{id}/record-return"
    occ_field: "expected_asset_return_item_version"
    description: |
      Recording a return against an AssetReturnItem whose version has advanced since
      the caller last observed it is rejected. The system scheduler may have flipped
      the item TRACKED -> OVERDUE, changing which deduction variant applies; the
      return must be recorded against the current item state.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_last_day_determination
    trigger: "OffboardingCase INTAKE -> APPROVED"
    algorithm: threshold
    formula: |
      # Dual-variant: resignation honors the employee's requested day unless it exceeds
      # the statutory notice cap; termination uses the company-controlled date.
      if case.case_type == RESIGNATION or case.case_type == MUTUAL_SEPARATION:
          cap = notice_received_date + NOTICE_CAP_DAYS (30 days, flat across states)
          determined_last_day = min(requested_last_day, cap)
      else:  # TERMINATION, JOB_ABANDONMENT
          determined_last_day = max(notice_received_date, requested_last_day)
      # Business-day alignment: if the result lands on a weekend, roll FORWARD to Monday
      # for RESIGNATION/MUTUAL_SEPARATION, BACKWARD to Friday for TERMINATION types.
      adjust_weekend(determined_last_day, direction_by_case_type)
    constants:
      NOTICE_CAP_DAYS: 30   # flat statutory resignation-notice cap for all supported states; CA's 72-hour rule lives in calc_final_pay_deadline, not here
    precision: "date at midnight UTC"
    variants:
      - name: resignation_cap
        when: "case_type in {RESIGNATION, MUTUAL_SEPARATION}"
        difference: "requested date capped by statutory notice cap; weekend rolls forward"
      - name: termination_floor
        when: "case_type in {TERMINATION, JOB_ABANDONMENT}"
        difference: "max(notice, requested); weekend rolls backward"

  - name: calc_pto_payout
    trigger: "FinalPayStatement DRAFT -> CALCULATED (and recalculate)"
    algorithm: tiered_pricing
    formula: |
      # Dual-variant: state-law method vs company-policy method; BOTH computed, the
      # GREATER is paid (state floor rule), but the cap tier differs.
      # Variant S (state law): payout = pto_balance_hours * hourly_wage_cents,
      #   but only if work_state_code in PTO_PAYOUT_STATES {CA, CO, IL, MA}; else 0.
      # Variant C (company policy): tiered cap by tenure:
      #   cap_hours = 40 if tenure_years < 2; 80 if 2 <= tenure_years < 5; 120 if >= 5
      #   payable_hours = min(pto_balance_hours, cap_hours)
      #   payout = payable_hours * hourly_wage_cents, with 0.5-hour FLOOR rounding:
      #   payable_hours = floor(payable_hours * 2) / 2  (round DOWN to half-hour)
      # Final: pto_payout_cents = max(variant_S_cents, variant_C_cents)
      # Round final cents to integer, round_half_up on the .5 cent edge.
    input_set: "OffboardingCase.pto_balance_hours, tenure_years, hourly_wage_cents, work_state_code; only cases with determined_last_day set"
    constants:
      PTO_PAYOUT_STATES: "{CA, CO, IL, MA}"
      TIER_1_HOURS: 40
      TIER_2_HOURS: 80
      TIER_3_HOURS: 120
    precision: "integer cents, round_half_up"
    variants:
      - name: state_law
        when: "work_state_code in PTO_PAYOUT_STATES"
        difference: "uncapped payout of full balance at hourly wage"
      - name: company_policy
        when: "all states (computed always as comparison floor)"
        difference: "tiered cap by tenure, half-hour floor rounding"

  - name: calc_final_pay_deadline
    trigger: "OffboardingCase INTAKE -> APPROVED"
    algorithm: chronological
    formula: |
      # Dual-variant: calendar-day rule vs business-day rule, per state.
      # Variant A (calendar-day, states {CA, CO, MA}):
      #   TERMINATION -> due_at = determined_last_day (same instant, IMMEDIATE_ON_TERMINATION)
      #   RESIGNATION with >= 72h notice -> due_at = determined_last_day
      #   RESIGNATION with < 72h notice  -> due_at = determined_last_day + 72 hours
      # Variant B (business-day, states {IL, NY, WA}):
      #   due_at = next business day after determined_last_day, skipping Sat/Sun
      # Variant C (next-payday, states {TX, FL}):
      #   due_at = next regular payday after determined_last_day; paydays are the 15th
      #   and last day of each month at 17:00 UTC.
      # state_law_variant recorded on FinalPayStatement (total mapping, no gaps):
      #   {CA,CO,MA} + (TERMINATION or JOB_ABANDONMENT)            -> IMMEDIATE_ON_TERMINATION
      #   {CA,CO,MA} + (RESIGNATION or MUTUAL_SEPARATION)          -> WITHIN_FIXED_DAYS (calendar-day class: at DL, or DL+72h when notice < 72h)
      #   {IL,NY,WA}  (any case_type)                              -> WITHIN_FIXED_DAYS (1 business day)
      #   {TX,FL}     (any case_type)                              -> NEXT_PAYDAY
    input_set: "case_type, work_state_code, determined_last_day, notice_received_date"
    constants:
      RESIGNATION_NOTICE_THRESHOLD_HOURS: 72
      BUSINESS_DAY_STATES: "{IL, NY, WA}"
      NEXT_PAYDAY_STATES: "{TX, FL}"
    precision: "instant, ISO 8601 UTC"
    variants:
      - name: calendar_day
        when: "work_state_code in {CA, CO, MA}"
        difference: "deadline in calendar hours/days, may land on weekend"
      - name: business_day
        when: "work_state_code in {IL, NY, WA}"
        difference: "deadline rolls past weekends"
      - name: next_payday
        when: "work_state_code in {TX, FL}"
        difference: "snapped to semi-monthly payday grid"

  - name: calc_asset_deduction
    trigger: "AssetReturnItem -> OVERDUE->DEFAULTED, or return with DAMAGED/DESTROYED"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant on the SAME item; which runs depends on trigger:
      # Variant DEFAULT (item never returned):
      #   age_days = floor((return_due_at - issued_date) / 86400)
      #   depreciation = min(age_days * DEPRECIATION_PER_DAY_BPS[kind], MAX_DEPRECIATION_BPS)
      #   depreciated_value = replacement_cost_cents * (10000 - depreciation) / 10000
      #   deduction = round_half_up(depreciated_value)  # per-item rounding, integer cents
      # Variant DAMAGE (returned DAMAGED or DESTROYED):
      #   base = replacement_cost_cents * DAMAGE_FRACTION[kind]  # DESTROYED = 1.0
      #   deduction = round_half_up(base)
      # Rounding order PINNED: round per-item first (this calc), then calc_deduction_total
      # sums the integers — never sum-then-round.
      # Late-return enhancement: if returned_at > return_due_at, add LATE_FEE_CENTS (2500)
      # to the computed deduction AFTER rounding.
    input_set: "AssetReturnItem fields; trigger context (default vs damage vs late)"
    constants:
      DEPRECIATION_PER_DAY_BPS_LAPTOP: 20
      DEPRECIATION_PER_DAY_BPS_PHONE: 25
      DEPRECIATION_PER_DAY_BPS_DEFAULT: 10
      MAX_DEPRECIATION_BPS: 7000
      DAMAGE_FRACTION_DEFAULT: 0.5
      LATE_FEE_CENTS: 2500
      ASSET_RETURN_GRACE_DAYS: 3
      ASSET_DEFAULT_GRACE_DAYS: 7
    precision: "integer cents, round_half_up per item"
    variants:
      - name: default_unreturned
        when: "item transitions to DEFAULTED"
        difference: "depreciated-value method keyed on age from issued_date"
      - name: damage_returned
        when: "returned with condition DAMAGED or DESTROYED"
        difference: "flat fraction of replacement cost; DESTROYED = full cost"

  - name: calc_deduction_total
    trigger: "Any AssetReturnItem.deduction_status change (COMPUTED, APPLIED, WAIVED)"
    algorithm: aggregation
    formula: |
      # Sum of deduction_amount_cents over items with deduction_status == APPLIED.
      # Item rows with COMPUTED (not yet applied) are EXCLUDED from the case-level
      # payroll total — they surface only after mark-defaulted applies them.
      # COMPUTED-but-not-APPLIED items are included in a separate projected total on
      # GET /offboarding/offboarding-cases/{id}/summary as projected_deduction_cents.
      OffboardingCase.deduction_total_cents =
          sum(item.deduction_amount_cents for item in items
              if item.deduction_status == APPLIED)
    input_set: "AssetReturnItem of the case, filtered deduction_status == APPLIED"
    precision: "integer cents"

  - name: calc_final_net_pay
    trigger: "FinalPayStatement calculate / recalculate; AssetReturnItem DEFAULTED cascade"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order PINNED (circular-looking dependency resolved):
      #   (1) pto_payout_cents  = calc_pto_payout
      #   (2) gross             = regular_wages_cents + pto_payout_cents
      #   (3) deduction_total_cents = min(case.deduction_total_cents, gross)
      #       — deductions may not push net below zero (wage-protection rule)
      #   (4) net_pay_cents     = gross - deduction_total_cents
      # Deduction cap references gross which references PTO — evaluate strictly 1..4.
    input_set: "statement regular_wages_cents, case pto inputs, case deduction_total_cents"
    precision: "integer cents"

  - name: calc_late_penalty
    trigger: "FinalPayStatement APPROVED -> LATE"
    algorithm: threshold
    formula: |
      # Waiting-time penalty: per late day (or fraction), penalty accrues at the
      # employee's daily wage, capped at WAITING_TIME_CAP_DAYS (30) days.
      # daily_wage_cents = hourly_wage_cents * 8
      # late_days = ceil((disbursed_at - due_at) / 86400)   # any fraction rounds UP
      # late_penalty_cents = min(late_days, 30) * daily_wage_cents
      # Boundary: disbursement exactly AT due_at (==) is on-time (no penalty);
      # 1 second past is 1 full day of penalty.
    input_set: "statement due_at, disbursed_at, case hourly_wage_cents"
    constants:
      WAITING_TIME_CAP_DAYS: 30
      HOURS_PER_DAY: 8
    precision: "integer cents"

  - name: calc_revocation_schedule
    trigger: "AccessRevocationTask creation (or case APPROVED if tasks pre-created at intake)"
    algorithm: constraint_propagation
    formula: |
      # Base schedule anchored on determined_last_day (DL):
      #   EMAIL, VPN       -> DL - 0h  (at end of last day, 17:00 UTC same day)
      #   ERP, PAYROLL_SYSTEM -> DL + 24h (keep working through payroll close)
      #   CODE_REPO, CLOUD_STORAGE -> DL - 24h (earlier; IP protection)
      #   BADGE            -> DL + 0h at 18:00 UTC
      #   CRM              -> DL - 0h at 17:00 UTC
      # Sequence gate: a task becomes READY only when all lower sequence_rank siblings
      # are terminal ({VERIFIED, WAIVED}) — see state machine ordering gate.
      # scheduled_at = DL + offset[system_name]
    input_set: "task system_name, case determined_last_day"
    constants:
      REVOKE_OFFSET_HOURS: "{EMAIL: 0, VPN: 0, ERP: 24, PAYROLL_SYSTEM: 24, CODE_REPO: -24, CLOUD_STORAGE: -24, BADGE: 1, CRM: 0}"
      MAX_REVOKE_RETRIES: 3
      RETRY_BACKOFF_MINUTES: 60
    precision: "instant, ISO 8601 UTC"

  - name: calc_revocation_posture
    trigger: "Every AccessRevocationTask status mutation"
    algorithm: aggregation
    formula: |
      # Aggregate over the case's AccessRevocationTask rows:
      #   COMPLETE    if all rows in {VERIFIED, WAIVED} and count > 0
      #   BLOCKED     if any row in {FAILED, RETRY_SCHEDULED} with retry_count >= MAX_REVOKE_RETRIES
      #   IN_PROGRESS if any row in {READY, EXECUTED, RETRY_SCHEDULED} (not blocked)
      #   NOT_STARTED if all rows PENDING or count == 0
      # Evaluation precedence: COMPLETE checked first, then BLOCKED, then IN_PROGRESS, else NOT_STARTED.
    input_set: "AccessRevocationTask rows of the case (all statuses)"
    precision: "enum"

  - name: calc_asset_posture
    trigger: "Every AssetReturnItem status/deduction_status mutation"
    algorithm: aggregation
    formula: |
      # Aggregate over the case's AssetReturnItem rows:
      #   COMPLETE   if all rows in {RETURNED, WAIVED} and count > 0
      #   DEFAULTED  if any row in {DEFAULTED} OR any row in {OVERDUE}
      #   IN_PROGRESS otherwise if count > 0
      #   NOT_STARTED if count == 0
      # Precedence: COMPLETE first, then DEFAULTED, then IN_PROGRESS, else NOT_STARTED.
    input_set: "AssetReturnItem rows of the case"
    precision: "enum"

  - name: calc_kt_progress
    trigger: "Every KnowledgeTransferSession status mutation"
    algorithm: aggregation
    formula: |
      # completed_session_count = count(sessions where status == COMPLETED)
      # Plan auto-completes when completed_session_count >= required_session_count
      # AND required_session_count > 0. A plan with required_session_count == 0 must be
      # completed explicitly (POST complete) — the aggregate never auto-completes it.
    input_set: "KnowledgeTransferSession rows of the plan, status == COMPLETED"
    precision: "integer count"

  - name: calc_benefits_deadline
    trigger: "BenefitsNotice DRAFT -> QUEUED; requeue"
    algorithm: chronological
    formula: |
      # COBRA_ELECTION      -> determined_last_day + 44 days (plan-administrator rule)
      # BENEFITS_TERMINATION -> determined_last_day + 30 days
      # RETIREMENT_PLAN      -> determined_last_day + 30 days
      # LIFE_INSURANCE_CONVERSION -> determined_last_day + 31 days
      # All deadlines at 17:00 UTC on the target date; calendar days (not business).
    input_set: "notice_kind, case determined_last_day; on requeue uses current_utc as base"
    constants:
      COBRA_DEADLINE_DAYS: 44
      BENEFITS_TERM_DAYS: 30
      LIFE_CONVERSION_DAYS: 31
    precision: "instant, ISO 8601 UTC"

  - name: calc_covenant_reminder
    trigger: "Case enters PAYROLL_PENDING (cascade schedules reminders)"
    algorithm: chronological
    formula: |
      # remind_at = determined_last_day + COVENANT_REMIND_DAYS (3) at 09:00 UTC.
      # Reminder fires once; no repeat. If current_utc already past remind_at when the
      # case reaches PAYROLL_PENDING, the reminder fires on the next scheduler tick.
    input_set: "case determined_last_day"
    constants:
      COVENANT_REMIND_DAYS: 3
    precision: "instant, ISO 8601 UTC"

  - name: calc_notification_dedupe
    trigger: "Any ManagerNotification creation"
    algorithm: threshold
    formula: |
      # If a notification of the same notification_kind for the same case already exists
      # with suppressed == false and was sent within DEDUPE_WINDOW_MINUTES (60), the new
      # row is persisted with suppressed = true (queryable, not dispatched).
      # Comparison window: [existing.sent_at, existing.sent_at + 60 minutes), half-open.
    input_set: "ManagerNotification rows of the case, same kind, suppressed == false"
    constants:
      DEDUPE_WINDOW_MINUTES: 60
    precision: "boolean"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles and §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resource exists (left-to-right: case, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource in a from-state the transition allows"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation-of-duties: actor X-User-ID must differ from the recorded counterparty (SoD-1 intake approver vs recorder; SoD-2 statement approver vs calculator; SoD-3 revocation verifier vs executor; SoD-4 rehire finalizer vs reviewer)"
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /offboarding/offboarding-cases/{id}/approve, POST /offboarding/final-pay-statements/{id}/approve, POST /offboarding/access-revocation-tasks/{id}/verify, POST /offboarding/rehire-eligibility-reviews/{id}/finalize"
  - priority: 6
    category: business_temporal
    check: "Temporal sanity: requested_last_day >= notice_received_date at intake; scheduled_end > scheduled_start for interviews/sessions; covenant acknowledgment only while case open"
    error_id: ERR_TEMPORAL_INVALID
    http_status: 422
    applies_to: "intake create/approve, interview/session create+reschedule, covenant acknowledge"
  - priority: 7
    category: business_referential
    check: "FK integrity: child references an existing parent; unique-per-case constraints (one FinalPayStatement, one KnowledgeTransferPlan, one RehireEligibilityReview per case; (case, sequence_rank) unique; (case, asset_tag) unique)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "all child-creation endpoints"
  - priority: 8
    category: business_constraint
    check: "Cross-resource calendar overlap: new/rescheduled ExitInterview window must not overlap another SCHEDULED ExitInterview of the same case (OVERLAP-A, half-open [start,end)); new KnowledgeTransferSession must not overlap another SCHEDULED session of the same plan (OVERLAP-B, closed [start,end] with 0-minute adjacency forbidden)"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 422
    applies_to: "POST /offboarding/exit-interviews, POST /offboarding/exit-interviews/{id}/reschedule, POST /offboarding/knowledge-transfer-sessions"
  - priority: 9
    category: business_constraint
    check: "Retry/reschedule caps: revocation retry_count < MAX_REVOKE_RETRIES; interview reschedule_count < MAX_INTERVIEW_RESCHEDULES; notice failure_count < MAX_NOTICE_FAILURES for requeue"
    error_id: ERR_RETRY_CAP_EXCEEDED
    http_status: 422
    applies_to: "retry, request-reschedule, reschedule, requeue endpoints"
  - priority: 10
    category: business_constraint
    check: "Ordering gate: revocation execute requires all lower sequence_rank siblings terminal; waive requires retry_count >= MAX_REVOKE_RETRIES"
    error_id: ERR_SEQUENCE_GATE
    http_status: 422
    applies_to: "POST /offboarding/access-revocation-tasks/{id}/execute, POST /offboarding/access-revocation-tasks/{id}/waive"
  - priority: 11
    category: business_fiscal
    check: "Fiscal sanity: hourly_wage_cents > 0; pto_balance_hours >= 0; replacement_cost_cents >= 0; regular_wages_cents >= 0; deduction cap floor net >= 0"
    error_id: ERR_FISCAL_INVALID
    http_status: 422
    applies_to: "case create, asset create, statement calculate"
  - priority: 12
    category: business_safety
    check: "Legal deadline protection: disburse when past due transitions to LATE (not rejected); benefits send after send_by is rejected (must requeue); close requires rehire review FINALIZED"
    error_id: ERR_DEADLINE_MISSED
    http_status: 422
    applies_to: "POST /offboarding/benefits-notices/{id}/send, POST /offboarding/offboarding-cases/{id}/close"
  - priority: 13
    category: business_constraint
    check: "Payload shape: required fields present, enum values in declared sets, numeric ranges honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 14
    category: state
    check: "OCC: expected_*_version matches the parent's current version"
    error_id: ERR_STALE_VERSION_GENERIC
    http_status: 412
    applies_to: "close, calculate, record-return"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/offboarding/_clock/set_current_utc"
    description: "Set the logical clock (ISO 8601 UTC). Startup default is 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock before any set call."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "fire all system scheduler transitions whose time predicates now hold (task READY/NO_SHOW/OVERDUE, notice FAILED, covenant REMINDED, interview NO_SHOW, session NO_SHOW, statement LATE-marking, posture recomputes, case auto-transitions)"
  - method: GET
    path: "/offboarding/_clock/current_utc"
    description: "Read the logical clock"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

  # --- OffboardingCase ---
  - method: POST
    path: "/offboarding/offboarding-cases"
    description: "Intake: create an OffboardingCase in INTAKE"
    roles: [HRPartner]
    code: 201
    input: [employee_ref, case_type, work_state_code, notice_received_date, requested_last_day, pto_balance_hours, tenure_years, hourly_wage_cents, intake_hr_ref]
    output: OffboardingCase
    side_effects:
      - "record intake_hr_ref (X-User-ID of creator) for SoD-1"
      - "emit ManagerNotification(INTAKE_ALERT)"
  - method: GET
    path: "/offboarding/offboarding-cases"
    description: "List cases; filter by status, work_state_code, case_type"
    roles: [HRPartner, HRReviewer, HRDirector, PayrollSpecialist, ITOperator, ITVerifier, ITManager, Manager, AssetClerk, BenefitsAdministrator]
    code: 200
    input: ["status?", "work_state_code?", "case_type?", "limit?", "offset?"]
    output: OffboardingCase[]
    side_effects: []
  - method: GET
    path: "/offboarding/offboarding-cases/{id}"
    description: "Fetch one case"
    roles: [HRPartner, HRReviewer, HRDirector, PayrollSpecialist, ITOperator, ITVerifier, ITManager, Manager, AssetClerk, BenefitsAdministrator]
    code: 200
    input: []
    output: OffboardingCase
    side_effects: []
  - method: GET
    path: "/offboarding/offboarding-cases/{id}/summary"
    description: "Computed read: posture, projected_deduction_cents (COMPUTED-not-APPLIED items), deduction_total_cents, net pay preview"
    roles: [HRPartner, HRDirector, PayrollSpecialist, Manager]
    code: 200
    input: []
    output: { revocation_posture: string, asset_posture: string, deduction_total_cents: integer, projected_deduction_cents: integer, net_pay_preview_cents: integer, ready_to_close: boolean }
    side_effects: []
  - method: POST
    path: "/offboarding/offboarding-cases/{id}/approve"
    description: "Approve intake; determines last day, final-pay deadline, creates children"
    roles: [HRPartner]
    code: 200
    input: []
    output: OffboardingCase
    side_effects:
      - "transition INTAKE -> APPROVED per state machine"
      - "increments OffboardingCase.version by 1"
  - method: POST
    path: "/offboarding/offboarding-cases/{id}/close"
    description: "Close the case (READY_TO_CLOSE -> CLOSED) with OCC guard"
    roles: [HRPartner]
    code: 200
    input: [expected_offboarding_case_version]
    output: OffboardingCase
    side_effects:
      - "transition READY_TO_CLOSE -> CLOSED per state machine"
      - "increments OffboardingCase.version by 1"
  - method: POST
    path: "/offboarding/offboarding-cases/{id}/void"
    description: "Void a case in INTAKE or APPROVED"
    roles: [HRPartner]
    code: 200
    input: [void_reason]
    output: OffboardingCase
    side_effects:
      - "transition -> VOIDED with cascades per state machine"
      - "increments OffboardingCase.version by 1"

  # --- AccessRevocationTask ---
  - method: POST
    path: "/offboarding/access-revocation-tasks"
    description: "Create a revocation task for a case"
    roles: [ITManager]
    code: 201
    input: [offboarding_case_id, system_name, sequence_rank]
    output: AccessRevocationTask
    side_effects:
      - "run calc_revocation_schedule -> scheduled_at (requires parent case APPROVED; else scheduled_at null)"
      - "recompute OffboardingCase.revocation_posture"
  - method: GET
    path: "/offboarding/access-revocation-tasks"
    description: "List revocation tasks; filter by offboarding_case_id, status, system_name"
    roles: [ITOperator, ITVerifier, ITManager, HRPartner]
    code: 200
    input: ["offboarding_case_id?", "status?", "system_name?", "limit?", "offset?"]
    output: AccessRevocationTask[]
    side_effects: []
  - method: GET
    path: "/offboarding/access-revocation-tasks/{id}"
    description: "Fetch one task"
    roles: [ITOperator, ITVerifier, ITManager, HRPartner]
    code: 200
    input: []
    output: AccessRevocationTask
    side_effects: []
  - method: GET
    path: "/offboarding/offboarding-cases/{id}/access-revocation-tasks"
    description: "Sub-resource listing of a case's revocation tasks"
    roles: [ITOperator, ITVerifier, ITManager, HRPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AccessRevocationTask[]
    side_effects: []
  - method: POST
    path: "/offboarding/access-revocation-tasks/{id}/execute"
    description: "Execute (or fail) a READY revocation task"
    roles: [ITOperator]
    code: 200
    input: [outcome, "failure_reason?"]
    output: AccessRevocationTask
    side_effects:
      - "transition READY -> EXECUTED or READY -> FAILED per state machine"
  - method: POST
    path: "/offboarding/access-revocation-tasks/{id}/verify"
    description: "Verify (or reject) an EXECUTED revocation task; SoD-3"
    roles: [ITVerifier]
    code: 200
    input: [outcome]
    output: AccessRevocationTask
    side_effects:
      - "transition EXECUTED -> VERIFIED or EXECUTED -> FAILED per state machine"
      - "record verifier user id for SoD-3"
  - method: POST
    path: "/offboarding/access-revocation-tasks/{id}/retry"
    description: "Schedule a retry of a FAILED task (backoff grows with retry_count)"
    roles: [ITOperator]
    code: 200
    input: []
    output: AccessRevocationTask
    side_effects:
      - "transition FAILED -> RETRY_SCHEDULED; backoff scheduled_at"
  - method: POST
    path: "/offboarding/access-revocation-tasks/{id}/waive"
    description: "Waive a task after retry cap reached"
    roles: [ITManager]
    code: 200
    input: [waive_reason]
    output: AccessRevocationTask
    side_effects:
      - "transition {FAILED, RETRY_SCHEDULED} -> WAIVED"

  # --- ManagerNotification ---
  - method: GET
    path: "/offboarding/manager-notifications"
    description: "List notifications; filter by offboarding_case_id, notification_kind, suppressed"
    roles: [Manager, HRPartner, HRDirector]
    code: 200
    input: ["offboarding_case_id?", "notification_kind?", "suppressed?", "limit?", "offset?"]
    output: ManagerNotification[]
    side_effects: []
  - method: GET
    path: "/offboarding/offboarding-cases/{id}/manager-notifications"
    description: "Sub-resource listing of a case's notifications"
    roles: [Manager, HRPartner, HRDirector]
    code: 200
    input: ["notification_kind?", "limit?", "offset?"]
    output: ManagerNotification[]
    side_effects: []

  # --- AssetReturnItem ---
  - method: POST
    path: "/offboarding/asset-return-items"
    description: "Register an asset to track for a case"
    roles: [AssetClerk]
    code: 201
    input: [offboarding_case_id, asset_tag, asset_kind, replacement_cost_cents, issued_date]
    output: AssetReturnItem
