# =============================================================================
# Scaffold: Document Digitization & Scanning Bureau (task_0992)
# Difficulty: beyond expert — HIPAA chain-of-custody compliance bureau with
# segregated duties, dual-variant pricing/projection, tiered storage accrual,
# clock-driven disposition, OCC on Batch, and two resource-overlap regimes.
# =============================================================================

scenario: |
  992. Document Digitization & Scanning Bureau: intake & box/inventory, prep &
  scan/OCR pipeline, indexing & metadata, secure destruction/return, cloud
  delivery & access, rush & per-page, chain-of-custody (HIPAA), retention

domain_name: document-digitization-bureau
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency       # OCC on Batch.version for scan-session commit
    - cascading_side_effects       # destroy -> custody flag -> retainer/clearance workflow
    - dual_variant_calculation     # invoice pricing + storage projection
    - scheduled_deferred_actions   # disposition_at / grant expires_at vs logical clock
    - derived_field_reconciliation # batch scanned_pages, projected_storage_fee_cents

  entity_topology: flat              # peer resources joined by FK references; sub-resource GETs for reverse reachability
  state_machine_shape: branching     # cyclic rework loop on Batch + branching disposition on Box + fork-join document gating
  relationship_patterns:
    - one_to_many
    - cross_aggregate                # AccessGrant -> Batch across the client boundary
  role_model: segregation_of_duties  # adjacent custody links must have different actors; destruction witness != recorder
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Client organization name" }
      - { name: hipaa_covered, type: boolean, source: input, description: "Whether the client is a HIPAA covered entity; drives vault-only placement, grant vault_only, and custody segregation emphasis" }
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Lifecycle status"
        constraints: "ACTIVE | SUSPENDED"

  - name: ServiceAgreement
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client" }
      - name: price_tier
        type: enum
        source: input
        description: "Per-page tariff tier"
        constraints: "STANDARD | VOLUME"
      - { name: rush_multiplier, type: number, source: input, description: "Multiplier applied to per-page rates for RUSH batches (e.g. 1.75)" }
      - { name: storage_free_days, type: integer, source: input, description: "Complimentary post-delivery storage days before daily accrual starts" }
      - { name: storage_daily_rate_cents, type: integer, source: input, description: "Per-box per-day storage charge after the free window" }
      - { name: retention_days, type: integer, source: input, description: "Days after delivery until physical disposition becomes mandatory" }
      - { name: max_boxes_per_batch, type: integer, source: input, description: "Capacity ceiling: a batch may not intake more boxes than this" }

  - name: Batch
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - name: priority
        type: enum
        source: input
        description: "Scheduling and pricing class"
        constraints: "STANDARD | RUSH"
      - name: status
        type: enum
        source: system
        default: INTAKE
        description: "Pipeline state with a cyclic QA-rework loop"
        constraints: "INTAKE | PREPPING | SCANNING | QA | INDEXING | DELIVERED | DISPOSITION_PENDING | CLOSED"
      - { name: scanned_pages, type: integer, source: computed, default: 0, description: "Produced page material: increments by Document.pages EVERY time a document transitions into SCANNED (first scan and each rework rescan), so rework accumulates here" }
      - { name: billable_scanned_pages, type: integer, source: computed, default: 0, description: "Pages counted exactly once per document: increments by Document.pages only on a document's FIRST transition into SCANNED; rework rescans never double-count (count-once ledger)" }
      - { name: rework_cycle_count, type: integer, source: computed, default: 0, description: "Number of QA->SCANNING rework loops executed on this batch" }
      - { name: delivery_status, type: enum, source: system, default: PENDING, description: "Parallel delivery dimension, independent of pipeline status", constraints: "PENDING | PARTIAL | COMPLETE" }
      - { name: delivered_at, type: datetime, source: system, description: "Set when the batch reaches DELIVERED; null until then" }
      - { name: disposition_at, type: datetime, source: computed, description: "= delivered_at + agreement.retention_days; null until delivered_at is set. Instant at which remaining physical material MUST be destroyed or returned" }
      - { name: projected_storage_fee_cents, type: integer, source: computed, default: 0, description: "Per storage_fee_projection (projected variant, as_of = logical clock)" }

  - name: Box
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; containing batch" }
      - { name: box_label, type: string, source: input, description: "Human-readable label; unique within the batch" }
      - { name: intake_weight_grams, type: integer, source: input, description: "Scale weight at intake (>= 1); anchors the shelf density-capacity rule" }
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "Branching disposition lifecycle"
        constraints: "RECEIVED | STORED | IN_PREP | IN_SCAN | SCAN_COMPLETE | AWAITING_DISPOSITION | IN_DESTRUCTION | DESTROYED | RETURNED"
      - { name: return_requested, type: boolean, source: system, default: false, description: "Set by POST /boxes/{id}/request-return; pins the disposition branch to return" }
      - { name: custody_flagged, type: boolean, source: computed, default: false, description: "Raised client-wide on non-final boxes when any box of the client is DESTROYED; blocks custody/destruction actions until a ComplianceOfficer clears it" }

  - name: Document
    parent: Box
    common_fields: true
    fields:
      - { name: box_id, type: string, source: system, description: "FK -> Box.id; containing box" }
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; denormalized batch reference (equals box.batch_id)" }
      - { name: doc_type, type: enum, source: input, description: "Document classification", constraints: "MEDICAL_RECORD | INVOICE | CONTRACT | CORRESPONDENCE | OTHER" }
      - { name: pages, type: integer, source: input, description: "Declared physical page count (>= 1); drives per-page pricing and scan-capacity math" }
      - { name: contains_phi, type: boolean, source: input, description: "Whether the document carries protected health information; gates vault-only shelving and vault_only grants for HIPAA clients" }
      - { name: ocr_confidence, type: integer, source: input, description: "Declared OCR quality 0-100; values below MIN_OCR_CONFIDENCE (70) route the document to REJECTED at index submission" }
      - name: status
        type: enum
        source: system
        default: REGISTERED
        description: "Per-document scan/QA lifecycle"
        constraints: "REGISTERED | SCANNED | QA_FAILED | INDEXED | DELIVERED | REJECTED"
      - { name: delivered_at, type: datetime, source: system, description: "Set when the document's INDEXED -> DELIVERED transition fires at batch delivery" }

  - name: ScanSession
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; batch being scanned" }
      - { name: scanner_id, type: string, source: input, description: "FK -> ScannerUnit.id; scanner the operator occupies" }
      - { name: operator_id, type: string, source: system, description: "Acting ScanOperator user id (from X-User-ID)" }
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Session lifecycle"
        constraints: "OPEN | COMMITTED | VOIDED"
      - { name: page_count, type: integer, source: computed, default: 0, description: "Accumulated pages logged in this session; must be > 0 and <= scanner capacity to commit" }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock timestamp at session open" }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock timestamp at commit/void; null while OPEN" }

  - name: PageLog
    parent: ScanSession
    common_fields: false   # append-only event rows: id + created_at only
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ScanSession.id; owning session" }
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; denormalized for reconciliation queries" }
      - { name: document_id, type: string, source: input, description: "FK -> Document.id; document these pages belong to" }
      - { name: pages, type: integer, source: input, description: "Pages scanned in this log entry (>= 1)" }

  - name: IndexRecord
    parent: Document
    common_fields: true
    fields:
      - { name: document_id, type: string, source: system, description: "FK -> Document.id; indexed document (1:1)" }
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; denormalized batch reference" }
      - { name: metadata_json, type: object, source: input, description: "Searchable metadata payload; must contain keys: title, record_date, subject" }
      - { name: ocr_text_ref, type: string, source: input, description: "Opaque reference to the OCR full-text blob in cloud storage" }

  - name: AccessGrant
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; owning client (identity entity of the ClientUser role)" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; batch whose documents become downloadable" }
      - { name: scope, type: enum, source: input, description: "Access breadth", constraints: "METADATA_ONLY | FULL_IMAGE" }
      - { name: expires_at, type: datetime, source: input, description: "Grant expiry; use rejected once the logical clock passes this instant" }
      - { name: vault_only, type: boolean, source: computed, description: "True when the client is hipaa_covered AND any document in the batch has contains_phi=true; vault_only grants forbid the public download channel" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Grant lifecycle", constraints: "ACTIVE | REVOKED | EXPIRED" }

  - name: CustodyEvent
    parent: Box
    common_fields: false   # append-only log: id + created_at only
    fields:
      - { name: box_id, type: string, source: system, description: "FK -> Box.id; box whose custody changed" }
      - { name: from_stage, type: string, source: system, description: "Custody stage before the event (INTAKE|PREP|SCAN|STORAGE|DESTRUCTION|RETURN)" }
      - { name: to_stage, type: string, source: system, description: "Custody stage after the event (same stage alphabet)" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; drives segregation-of-duties adjacency checks" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: notes, type: string, source: input, description: "Free-text custody note" }

  - name: DestructionCertificate
    parent: Box
    common_fields: true
    fields:
      - { name: box_id, type: string, source: system, description: "FK -> Box.id; destroyed box (1:1)" }
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; denormalized batch reference" }
      - { name: witness_user_id, type: string, source: input, description: "Second bureau staffer attesting destruction; MUST differ from the recording actor (segregation of duties)" }
      - { name: method, type: enum, source: input, description: "Destruction method", constraints: "SHRED | INCINERATE | PULP" }
      - { name: certificate_code, type: string, source: system, description: "Server-minted unique certificate code" }
      - { name: destroyed_at, type: datetime, source: system, description: "Logical-clock timestamp of destruction" }

  - name: ScannerUnit
    parent: null
    common_fields: true
    fields:
      - { name: scanner_code, type: string, source: input, description: "Unique scanner identifier (e.g. SCN-01)" }
      - { name: capacity_pages_per_session, type: integer, source: input, description: "Maximum pages committable in a single scan session on this unit" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Unit availability", constraints: "AVAILABLE | MAINTENANCE" }

  - name: ShelfSlot
    parent: null
    common_fields: true
    fields:
      - { name: shelf_code, type: string, source: input, description: "Unique shelf identifier (e.g. SH-A3)" }
      - { name: zone, type: enum, source: input, description: "Storage zone", constraints: "GENERAL | VAULT" }
      - { name: capacity_grams, type: integer, source: input, description: "Maximum aggregate intake weight of stored boxes" }
      - { name: occupied_weight_grams, type: integer, source: computed, default: 0, description: "Sum of intake_weight_grams over ACTIVE shelf assignments on this slot" }

  - name: ShelfAssignment
    parent: Box
    common_fields: true
    fields:
      - { name: box_id, type: string, source: system, description: "FK -> Box.id; stored box" }
      - { name: shelf_slot_id, type: string, source: input, description: "FK -> ShelfSlot.id; slot being occupied" }
      - { name: placed_at, type: datetime, source: system, description: "Logical-clock timestamp of placement" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp of release; null while ACTIVE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Assignment lifecycle", constraints: "ACTIVE | RELEASED" }

  - name: Invoice
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id; billed batch (1:1; auto-created DRAFT with the batch)" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; billed client" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Billing lifecycle", constraints: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | VOID" }
      - { name: page_subtotal_cents, type: integer, source: computed, description: "Per-page charges per invoice_pricing (variant selected by batch state: provisional pre-delivery, final from delivery on)" }
      - { name: storage_subtotal_cents, type: integer, source: computed, description: "Accrued storage charges; projected while DRAFT, frozen at issued_at on issue" }
      - { name: total_cents, type: integer, source: computed, description: "= page_subtotal_cents + storage_subtotal_cents" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cumulative captured payments" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance; null while DRAFT" }
      - { name: void_reason, type: string, source: input, description: "Reason recorded when the invoice is voided" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Batch
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: PREPPING
        trigger: "POST /batches/{id}/start-prep"
        actor: IntakeClerk
        preconditions:
          - "Batch.status == INTAKE (ERR_INVALID_STATE)"
          - "Batch has >= 1 Box (ERR_BATCH_EMPTY)"
          - "Every Box of the batch has >= 1 CustodyEvent (ERR_CUSTODY_GAP) — satisfied by the auto-intake event"
        side_effects:
          - "increments Batch.version by 1"
      - from: PREPPING
        to: SCANNING
        trigger: "POST /batches/{id}/start-scan"
        actor: ScanOperator
        preconditions:
          - "Batch.status == PREPPING (ERR_INVALID_STATE)"
          - "Batch has >= 1 Document registered (ERR_BATCH_EMPTY)"
        side_effects:
          - "increments Batch.version by 1"
      - from: SCANNING
        to: QA
        trigger: "POST /batches/{id}/submit-qa"
        actor: ScanOperator
        preconditions:
          - "Batch.status == SCANNING (ERR_INVALID_STATE)"
          - "No ScanSession of this batch is OPEN (ERR_OPEN_SCAN_SESSION_EXISTS)"
          - "Every Document of the batch is in SCANNED, QA_FAILED, or REJECTED (ERR_DOCUMENTS_INCOMPLETE)"
        side_effects:
          - "increments Batch.version by 1"
      - from: QA
        to: INDEXING
        trigger: "POST /batches/{id}/pass-qa"
        actor: QAReviewer
        preconditions:
          - "Batch.status == QA (ERR_INVALID_STATE)"
          - "No Document of the batch is in QA_FAILED (ERR_DOCUMENTS_INCOMPLETE)"
        side_effects:
          - "increments Batch.version by 1"
      - from: QA
        to: SCANNING
        trigger: "POST /batches/{id}/fail-qa"
        actor: QAReviewer
        preconditions:
          - "Batch.status == QA (ERR_INVALID_STATE)"
          - "At least one Document of the batch is in QA_FAILED (ERR_BATCH_NOT_REWORKABLE)"
        side_effects:
          - "QA_FAILED documents remain QA_FAILED (they become SCANNED again only via a rework scan-session commit)"
          - "Batch.rework_cycle_count += 1"
          - "Batch.scanned_pages unchanged; Batch.billable_scanned_pages unchanged"
          - "increments Batch.version by 1"
      - from: INDEXING
        to: DELIVERED
        trigger: "POST /batches/{id}/deliver"
        actor: QAReviewer
        preconditions:
          - "Batch.status == INDEXING (ERR_INVALID_STATE)"
          - "Batch is indexable per batch_indexability (ERR_BATCH_NOT_INDEXABLE)"
        side_effects:
          - "Every Document in INDEXED -> DELIVERED with delivered_at = logical clock"
          - "Batch.delivered_at = logical clock"
          - "Batch.disposition_at = delivered_at + agreement.retention_days"
          - "Batch.delivery_status = COMPLETE when zero documents are REJECTED, else PARTIAL"
          - "Invoice.page_subtotal_cents locked to the final pricing variant"
          - "increments Batch.version by 1"
      - from: DELIVERED
        to: DISPOSITION_PENDING
        trigger: "system (automatic when logical clock reaches Batch.disposition_at)"
        actor: system
        preconditions:
          - "Batch.status == DELIVERED"
          - "current_utc >= Batch.disposition_at"
        side_effects:
          - "Every Box of the batch in STORED or SCAN_COMPLETE -> AWAITING_DISPOSITION"
          - "Every ACTIVE ShelfAssignment of those boxes -> RELEASED with released_at = clock; ShelfSlot.occupied_weight_grams debited per box"
          - "increments Batch.version by 1"
      - from: DISPOSITION_PENDING
        to: CLOSED
        trigger: "POST /batches/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Batch.status == DISPOSITION_PENDING (ERR_INVALID_STATE)"
          - "Every Box of the batch is in DESTROYED or RETURNED (ERR_BOXES_NOT_FINAL)"
        side_effects:
          - "increments Batch.version by 1"
    parallel_dimensions:
      - dimension: delivery_status
        values: [PENDING, PARTIAL, COMPLETE]
        note: "Set once at delivery: COMPLETE when no document is REJECTED, PARTIAL otherwise. A DELIVERED batch with delivery_status == PARTIAL keeps its REJECTED documents undelivered forever."

  - entity: Box
    initial_state: RECEIVED
    terminal_states: [DESTROYED, RETURNED]
    transitions:
      - from: RECEIVED
        to: STORED
        trigger: "POST /boxes/{id}/shelf-assignments"
        actor: IntakeClerk
        preconditions:
          - "Box.status == RECEIVED (ERR_INVALID_STATE)"
          - "Box.custody_flagged == false (ERR_CUSTODY_FLAGGED)"
          - "ShelfSlot.capacity_grams - ShelfSlot.occupied_weight_grams >= Box.intake_weight_grams (ERR_SHELF_OVER_CAPACITY)"
          - "ShelfSlot.zone == VAULT whenever the batch client is hipaa_covered AND any Document in the box has contains_phi == true (ERR_VAULT_ZONE_REQUIRED)"
        side_effects:
          - "ShelfAssignment created (ACTIVE, placed_at = clock)"
          - "ShelfSlot.occupied_weight_grams += Box.intake_weight_grams"
          - "CustodyEvent appended (from_stage=INTAKE, to_stage=STORAGE)"
      - from: STORED
        to: IN_PREP
        trigger: "POST /boxes/{id}/custody-events (to_stage=PREP)"
        actor: PrepTechnician
        preconditions:
          - "Box.status == STORED (ERR_INVALID_STATE)"
          - "Box.custody_flagged == false (ERR_CUSTODY_FLAGGED)"
          - "Segregation: X-User-ID != actor_user_id of the immediately preceding CustodyEvent on this box (ERR_CUSTODY_SEGREGATION)"
        side_effects:
          - "ACTIVE ShelfAssignment of this box -> RELEASED (released_at = clock); ShelfSlot.occupied_weight_grams -= Box.intake_weight_grams"
          - "CustodyEvent appended (to_stage=PREP)"
      - from: IN_PREP
        to: IN_SCAN
        trigger: "POST /boxes/{id}/custody-events (to_stage=SCAN)"
        actor: ScanOperator
        preconditions:
          - "Box.status == IN_PREP (ERR_INVALID_STATE)"
          - "Box.custody_flagged == false (ERR_CUSTODY_FLAGGED)"
          - "Segregation adjacency check (ERR_CUSTODY_SEGREGATION)"
        side_effects:
          - "CustodyEvent appended (to_stage=SCAN)"
      - from: IN_SCAN
        to: SCAN_COMPLETE
        trigger: "POST /boxes/{id}/custody-events (to_stage=STORAGE)"
        actor: IntakeClerk
        preconditions:
          - "Box.status == IN_SCAN (ERR_INVALID_STATE)"
          - "Box.custody_flagged == false (ERR_CUSTODY_FLAGGED)"
          - "Segregation adjacency check (ERR_CUSTODY_SEGREGATION)"
        side_effects:
          - "CustodyEvent appended (to_stage=STORAGE)"
          - "note: post-scan physical box returns to storage shelving as SCAN_COMPLETE (no new shelf occupancy tracked after prep)"
      - from: SCAN_COMPLETE
        to: AWAITING_DISPOSITION
        trigger: "system (batch enters DISPOSITION_PENDING) or POST /boxes/{id}/request-return while batch DELIVERED"
        actor: system | ClientUser
        preconditions:
          - "Box.status in {SCAN_COMPLETE, STORED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: STORED
        to: AWAITING_DISPOSITION
        trigger: "system (batch enters DISPOSITION_PENDING) or POST /boxes/{id}/request-return while batch DELIVERED"
        actor: system | ClientUser
        preconditions:
          - "Box.status in {SCAN_COMPLETE, STORED} (ERR_INVALID_STATE)"
        side_effects:
          - "Any ACTIVE ShelfAssignment of this box -> RELEASED; ShelfSlot.occupied_weight_grams debited"
      - from: AWAITING_DISPOSITION
        to: IN_DESTRUCTION
        trigger: "POST /boxes/{id}/begin-destruction"
        actor: DestructionSpecialist
        preconditions:
          - "Box.status == AWAITING_DISPOSITION (ERR_INVALID_STATE)"
          - "Box.custody_flagged == false (ERR_CUSTODY_FLAGGED)"
          - "Box.return_requested == false (ERR_BOX_RETURN_COMMITTED)"
        side_effects:
          - "CustodyEvent appended (to_stage=DESTRUCTION)"
      - from: IN_DESTRUCTION
        to: DESTROYED
        trigger: "POST /boxes/{id}/destruction-certificates"
        actor: DestructionSpecialist
        preconditions:
          - "Box.status == IN_DESTRUCTION (ERR_INVALID_STATE)"
          - "Box.custody_flagged == false (ERR_CUSTODY_FLAGGED)"
          - "witness_user_id != X-User-ID of the recording actor (ERR_WITNESS_SEGREGATION)"
        side_effects:
          - "DestructionCertificate created (certificate_code minted, destroyed_at = clock)"
          - "Cascade: every other non-final Box (status not in {DESTROYED, RETURNED}) of every non-CLOSED batch of the same client gets custody_flagged = true"
      - from: AWAITING_DISPOSITION
        to: RETURNED
        trigger: "POST /boxes/{id}/mark-returned"
        actor: IntakeClerk
        preconditions:
          - "Box.status == AWAITING_DISPOSITION (ERR_INVALID_STATE)"
          - "Box.return_requested == true (ERR_BOX_NOT_RETURN_COMMITTED)"
        side_effects:
          - "CustodyEvent appended (to_stage=RETURN)"

  - entity: Document
    initial_state: REGISTERED
    terminal_states: [DELIVERED, REJECTED]
    transitions:
      - from: REGISTERED
        to: SCANNED
        trigger: "POST /scan-sessions/{id}/commit (document covered by committed PageLogs)"
        actor: system
        preconditions:
          - "Document.status == REGISTERED (rework path: QA_FAILED)"
          - "Cumulative COMMITTED-session PageLog pages for this document >= Document.pages"
        side_effects:
          - "Batch.scanned_pages += Document.pages"
          - "Batch.billable_scanned_pages += Document.pages (first scan only)"
      - from: QA_FAILED
        to: SCANNED
        trigger: "POST /scan-sessions/{id}/commit (rework rescan)"
        actor: system
        preconditions:
          - "Document.status == QA_FAILED"
          - "Cumulative COMMITTED-session PageLog pages logged after the document entered QA_FAILED >= Document.pages"
        side_effects:
          - "Batch.scanned_pages += Document.pages (produced material accumulates)"
          - "Batch.billable_scanned_pages unchanged (count-once ledger: the first scan already counted these pages)"
      - from: SCANNED
        to: QA_FAILED
        trigger: "POST /batches/{id}/qa-reviews"
        actor: QAReviewer
        preconditions:
          - "Batch.status in {SCANNING, QA} (ERR_INVALID_STATE)"
          - "Document.status == SCANNED (ERR_INVALID_STATE)"
        side_effects:
          - "Batch.scanned_pages unchanged; billable_scanned_pages unchanged (pages stay billed; rework is free)"
      - from: SCANNED
        to: INDEXED
        trigger: "POST /documents/{id}/index-records"
        actor: Indexer
        preconditions:
          - "Batch.status == INDEXING (ERR_INVALID_STATE)"
          - "Document.status == SCANNED (ERR_INVALID_STATE)"
          - "Document.ocr_confidence >= MIN_OCR_CONFIDENCE (70) — otherwise the document transitions to REJECTED instead"
          - "metadata_json contains required keys title, record_date, subject (ERR_METADATA_INCOMPLETE)"
        side_effects:
          - "IndexRecord created (1:1 with Document)"
      - from: SCANNED
        to: REJECTED
        trigger: "POST /documents/{id}/index-records with Document.ocr_confidence < 70"
        actor: system
        preconditions:
          - "Batch.status == INDEXING (ERR_INVALID_STATE)"
          - "Document.status == SCANNED"
          - "Document.ocr_confidence < MIN_OCR_CONFIDENCE"
        side_effects:
          - "No IndexRecord created; the endpoint responds 200 with the Document (not an IndexRecord)"
          - "Document permanently excluded from delivery; its pages remain in the provisional billing set but are removed from the final billing set at delivery"
      - from: INDEXED
        to: DELIVERED
        trigger: "POST /batches/{id}/deliver"
        actor: system
        preconditions:
          - "Document.status == INDEXED"
        side_effects:
          - "Document.delivered_at = logical clock"

  - entity: ScanSession
    initial_state: OPEN
    terminal_states: [COMMITTED, VOIDED]
    transitions:
      - from: OPEN
        to: COMMITTED
        trigger: "POST /scan-sessions/{id}/commit"
        actor: ScanOperator
        preconditions:
          - "ScanSession.status == OPEN (ERR_INVALID_STATE)"
          - "Batch.status == SCANNING (ERR_INVALID_STATE)"
          - "expected_batch_version == Batch.version (ERR_STALE_VERSION, 412)"
          - "ScanSession.page_count > 0 (ERR_EMPTY_SCAN_SESSION)"
          - "ScanSession.page_count <= ScannerUnit.capacity_pages_per_session (ERR_SCANNER_OVER_CAPACITY)"
          - "ScannerUnit.status == AVAILABLE (ERR_SCANNER_UNAVAILABLE)"
        side_effects:
          - "ScanSession.ended_at = clock"
          - "Per covered document: REGISTERED/QA_FAILED -> SCANNED per Document machine"
          - "Batch.scanned_pages / billable_scanned_pages reconciled"
          - "Invoice DRAFT page_subtotal_cents recomputed (provisional variant while batch < DELIVERED)"
          - "increments Batch.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /scan-sessions/{id}/void"
        actor: ScanOperator
        preconditions:
          - "ScanSession.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "ScanSession.ended_at = clock; its PageLogs are retained for audit but excluded from all aggregates"

  - entity: AccessGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /access-grants/{id}/revoke"
        actor: ClientUser
        preconditions:
          - "AccessGrant.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy evaluation at documents-list/download time when clock > expires_at)"
        actor: system
        preconditions:
          - "AccessGrant.status == ACTIVE and current_utc > expires_at"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT (ERR_INVALID_STATE)"
          - "Batch.status in {DELIVERED, DISPOSITION_PENDING, CLOSED} (ERR_INVALID_STATE)"
        side_effects:
          - "Invoice.issued_at = clock; storage_subtotal_cents frozen per storage_fee_projection evaluated at issued_at"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments (amount_cents < outstanding balance)"
        actor: BillingClerk
        preconditions:
          - "Invoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_NOT_ISSUED for DRAFT/VOID)"
          - "amount_cents >= 1 (ERR_INVALID_REQUEST)"
          - "amount_cents <= total_cents - amount_paid_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/payments (amount_cents == outstanding balance)"
        actor: BillingClerk
        preconditions:
          - "as above"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments (amount_cents == outstanding balance)"
        actor: BillingClerk
        preconditions:
          - "as above"
        side_effects:
          - "Invoice.amount_paid_cents += amount_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == DRAFT (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ShelfAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system (box leaves storage: custody-event to_stage=PREP, batch disposition sweep, request-return on a STORED box) or POST /shelf-assignments/{id}/release"
        actor: system | IntakeClerk
        preconditions:
          - "ShelfAssignment.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "ShelfSlot.occupied_weight_grams -= Box.intake_weight_grams; released_at = clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: scan-commit-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /scan-sessions/{id}/commit"
    occ_field: expected_batch_version
    description: |
      Committing a ScanSession against a Batch whose version has advanced since
      the client last observed it is rejected with 412. This captures the case
      where another writer has just committed a session (advancing scanned pages
      and the batch version) and the current writer's view of the batch is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_pricing
    trigger: "on every scan-session commit (provisional recompute) and on batch DELIVERED transition (final lock)"
    algorithm: tiered_pricing
    formula: |
      rate_for(batch):  # rate depends on batch + agreement only
        base = (agreement.price_tier == VOLUME) ? VOLUME_PAGE_RATE : STANDARD_PAGE_RATE
        if batch.priority == RUSH: base = base * agreement.rush_multiplier
        return base
      page_subtotal_cents = sum over documents d of the batch in the VARIANT'S
                            document set of round_half_up(d.pages * rate * 100)
      # rounding order PINNED: round each document's charge to cents FIRST, then
      # sum the rounded per-document amounts. (sum-then-round yields different
      # cents and is WRONG.) Variant selection is by BATCH STATE, not request flag:
      #   batch.status < DELIVERED  -> provisional: document set {SCANNED,
      #     QA_FAILED, INDEXED, DELIVERED, REJECTED} — everything produced so far,
      #     including rejected pages (work was produced) and QA_FAILED pages.
      #   batch.status >= DELIVERED -> final: document set {SCANNED, INDEXED,
      #     DELIVERED} — REJECTED documents are REMOVED from the bill at
      #     finalization (undeliverable work is not charged at settlement).
    constants:
      STANDARD_PAGE_RATE: 0.45   # dollars per page
      VOLUME_PAGE_RATE: 0.30     # dollars per page
    precision: "integer cents; round per document (round_half_up on pages*rate*100), then sum"
    variants:
      - name: provisional
        when: "batch not yet DELIVERED; recomputed on every commit and on DRAFT invoice reads"
        difference: "document set includes REJECTED and QA_FAILED documents (all produced pages billed)"
      - name: final
        when: "batch reached DELIVERED; persisted at delivery and frozen at invoice issue"
        difference: "document set excludes REJECTED documents; for a batch with rejected pages the final subtotal is STRICTLY SMALLER than the last provisional read that contained a REJECTED document"

  - name: storage_fee_projection
    trigger: "Batch/Invoice read while boxes retained (projected); invoice issue (frozen at issued_at)"
    algorithm: aggregation
    formula: |
      chargeable_days(box, as_of) =
        max(0, floor((as_of - box_batch.delivered_at) / 86400) - agreement.storage_free_days)
      # floor toward zero on whole days; a box becomes chargeable only after
      # delivered_at + storage_free_days whole days have FULLY elapsed.
      fee(box, as_of) = chargeable_days(box, as_of) * agreement.storage_daily_rate_cents
      total(as_of) = sum of fee(box, as_of) over boxes of the batch
                     where box.status in {STORED, SCAN_COMPLETE, AWAITING_DISPOSITION}
      # DESTROYED and RETURNED boxes stop accruing; RECEIVED/IN_PREP/IN_SCAN
      # boxes cannot exist post-delivery in a well-formed run but are excluded
      # defensively (accrual starts at delivered_at for retained stock only).
    constants: {}
    precision: "integer cents, no rounding (integer day arithmetic)"
    variants:
      - name: projected
        when: "as_of = current logical clock (Batch.projected_storage_fee_cents; DRAFT invoice storage_subtotal_cents)"
        difference: "accrues only up to 'now'; grows as the clock advances; shrinks when boxes reach DESTROYED/RETURNED"
      - name: actual_at_issue
        when: "as_of = invoice.issued_at, frozen at issue time into Invoice.storage_subtotal_cents"
        difference: "immutable once issued; two invoices read at different clocks with no interleaving destroy/return agree, while a projected read after a destruction is strictly smaller than the frozen issued value"

  - name: batch_indexability
    trigger: "evaluated at deliver-time and reported on batch reads"
    algorithm: constraint_propagation
    formula: |
      indexable(batch) =
        count(all documents of batch) >= 1
        AND FORALL documents d of batch: d.status in {INDEXED, DELIVERED, REJECTED}
        AND count(d.status == REJECTED) <= max(1, floor(0.10 * count(all documents of batch)))
      # boundary PINNED: the allowance is max(1, floor(10%)); a 10-document
      # batch tolerates exactly 1 rejection (1 <= max(1, 1)); a 20-document
      # batch tolerates exactly 2 (2 <= max(1, 2)); 21 documents tolerate 2.
    constants:
      MAX_REJECT_FRACTION: 0.10
    precision: "integer counts; floor on the allowance"

  - name: custody_segregation_check
    trigger: "POST /boxes/{id}/custody-events, POST /boxes/{id}/destruction-certificates"
    algorithm: chronological
    formula: |
      prev = CustodyEvent of this box with the greatest created_at
             (events are serialized per box; created_at ms precision makes ties
             impossible in a single-server evaluation)
      reject with ERR_CUSTODY_SEGREGATION when prev.actor_user_id == X-User-ID
      For destruction-certificates: reject with ERR_WITNESS_SEGREGATION when
      witness_user_id == X-User-ID.
      ENFORCEMENT SCOPE: the adjacency check is enforced on the explicit
      custody-events endpoint and on destruction-certificates only. System-
      generated events (auto-intake at box creation, STORAGE at shelf
      placement, DESTRUCTION at begin-destruction, RETURN at mark-returned)
      are recorded with the acting user's id and DO serve as the 'prev' link
      for the next explicit check, but are never themselves rejected.
    constants: {}
    precision: "exact string equality on user ids"

  - name: rush_capacity_window
    trigger: "POST /batches with priority=RUSH"
    algorithm: threshold
    formula: |
      admitted_rush = count of batches with priority == RUSH and status in
                      {INTAKE, PREPPING, SCANNING, QA, INDEXING}
      reject with ERR_RUSH_CAPACITY_FULL when admitted_rush >= RUSH_ADMISSION_LIMIT
      # boundary PINNED: admission succeeds only while admitted_rush < LIMIT;
      # the request that brings admitted_rush to exactly LIMIT is the LAST one
      # admitted; the next RUSH create is rejected. STANDARD batches are never
      # counted and never rejected by this rule.
    constants:
      RUSH_ADMISSION_LIMIT: 3
    precision: "integer count; >= comparison at the limit"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; ClientUser additionally restricted to its own client subtree (X-User-ID == the resource's client_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist and, where a sub-resource path is used, nest under the named parent (wrong-parent ids are NOT_FOUND, not 400); body-referenced ids (scanner_id, shelf_slot_id, document_id, batch_id) must exist and belong to the operation's scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 3.5
    category: business_constraint
    check: "Request body well-formed: required fields present, types match, enums within declared sets, numeric ranges honored (pages >= 1, intake_weight_grams >= 1, amount_cents >= 1, ocr_confidence in 0..100); unknown or computed/server fields in the payload rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body
  - priority: 4
    category: state
    check: "Client.status == ACTIVE (SUSPENDED clients reject all mutations on their subtree and all grant usage)"
    error_id: ERR_CLIENT_SUSPENDED
    http_status: 403
    applies_to: all client-scoped mutations and access-grant usage endpoints
  - priority: 5
    category: state
    check: "Target entity in a valid source state for the requested transition (all state-machine preconditions of category state); download additionally requires the document DELIVERED and the grant ACTIVE"
    error_id: ERR_INVALID_STATE / ERR_DOCUMENT_NOT_DELIVERED
    http_status: 409
    applies_to: "all action endpoints; GET /access-grants/{id}/documents/{docId}/download"
  - priority: 6
    category: business_safety
    check: "HIPAA custody segregation: actor may not author two adjacent custody events on the same box; destruction witness != recorder"
    error_id: ERR_CUSTODY_SEGREGATION / ERR_WITNESS_SEGREGATION
    http_status: 422
    applies_to: "POST /boxes/{id}/custody-events, POST /boxes/{id}/destruction-certificates"
  - priority: 7
    category: business_safety
    check: "Custody flag: boxes with custody_flagged == true reject custody-events / begin-destruction / destruction-certificates until a ComplianceOfficer clears the flag"
    error_id: ERR_CUSTODY_FLAGGED
    http_status: 409
    applies_to: "POST /boxes/{id}/custody-events, POST /boxes/{id}/begin-destruction, POST /boxes/{id}/destruction-certificates, POST /boxes/{id}/shelf-assignments"
  - priority: 8
    category: business_safety
    check: "Vault zone: PHI boxes of HIPAA clients may only occupy VAULT shelves; vault_only grants forbid the public download channel; download requires scope FULL_IMAGE"
    error_id: ERR_VAULT_ZONE_REQUIRED / ERR_GRANT_VAULT_ONLY / ERR_SCOPE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /boxes/{id}/shelf-assignments, GET /access-grants/{id}/documents/{docId}/download"
    note: "ERR_SCOPE_INSUFFICIENT surfaces with http 403 per the error catalog"
  - priority: 9
    category: business_temporal
    check: "Return requests must be recorded before the batch reaches DISPOSITION_PENDING; grants expire at expires_at (lazy)"
    error_id: ERR_RETURN_WINDOW_EXPIRED / ERR_GRANT_EXPIRED
    http_status: 409
    applies_to: "POST /boxes/{id}/request-return, GET /access-grants/{id}/documents(+download)"
  - priority: 10
    category: business_referential
    check: "Metadata completeness: metadata_json must contain keys title, record_date, subject"
    error_id: ERR_METADATA_INCOMPLETE
    http_status: 422
    applies_to: "POST /documents/{id}/index-records"
  - priority: 11
    category: business_constraint
    check: "Capacity and uniqueness ceilings: session page_count <= scanner capacity; shelf aggregate weight <= capacity_grams; batch box count <= max_boxes_per_batch; rush admission < RUSH_ADMISSION_LIMIT; one OPEN session per scanner; at most one service agreement per client"
    error_id: ERR_SCANNER_OVER_CAPACITY / ERR_SHELF_OVER_CAPACITY / ERR_MAX_BOXES_EXCEEDED / ERR_RUSH_CAPACITY_FULL / ERR_SCANNER_BUSY / ERR_AGREEMENT_EXISTS
    http_status: 409
    applies_to: "POST /scan-sessions/{id}/commit, POST /boxes/{id}/shelf-assignments, POST /batches/{id}/boxes, POST /batches, POST /batches/{id}/scan-sessions, POST /clients/{id}/service-agreements"
  - priority: 12
    category: business_fiscal
    check: "Payment amount within outstanding balance; invoice in a payable state"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE / ERR_INVOICE_NOT_ISSUED
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- platform / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. Drives disposition sweeps, grant expiry, and storage accrual."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "advance clock; fire Batch DELIVERED -> DISPOSITION_PENDING sweeps for batches whose disposition_at <= new clock (with box AWAITING_DISPOSITION + shelf release side effects)"

  - method: POST
    path: "/scanner-units"
    description: "Register a scanner unit"
    roles: [PlatformAdmin]
    code: 201
    input: [scanner_code, capacity_pages_per_session]
    output: ScannerUnit
    side_effects: []
  - method: GET
    path: "/scanner-units"
    description: "List scanner units"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScannerUnit[]"
    side_effects: []
  - method: GET
    path: "/scanner-units/{id}"
    description: "Get a scanner unit"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: ScannerUnit
    side_effects: []
  - method: POST
    path: "/scanner-units/{id}/maintenance"
    description: "Set scanner availability (AVAILABLE | MAINTENANCE)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: ScannerUnit
    side_effects: []
  - method: GET
    path: "/scanner-units/{id}/scan-sessions"
    description: "List scan sessions that occupied this scanner"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScanSession[]"
    side_effects: []

  - method: POST
    path: "/shelf-slots"
    description: "Register a shelf slot"
    roles: [PlatformAdmin]
    code: 201
    input: [shelf_code, zone, capacity_grams]
    output: ShelfSlot
    side_effects: []
  - method: GET
    path: "/shelf-slots"
    description: "List shelf slots (filterable by zone)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["zone?", "limit?", "offset?"]
    output: "ShelfSlot[]"
    side_effects: []
  - method: GET
    path: "/shelf-slots/{id}"
    description: "Get a shelf slot (includes occupied_weight_grams)"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: ShelfSlot
    side_effects: []
  - method: GET
    path: "/shelf-slots/{id}/shelf-assignments"
    description: "List shelf assignments occupying this slot"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShelfAssignment[]"
    side_effects: []

  # --- clients & agreements ---
  - method: POST
    path: "/clients"
    description: "Onboard a client"
    roles: [PlatformAdmin]
    code: 201
    input: [name, hipaa_covered]
    output: Client
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Client[]"
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Get a client"
    roles: [PlatformAdmin, IntakeClerk, PrepTechnician, ScanOperator, QAReviewer, Indexer, DestructionSpecialist, ComplianceOfficer, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Client
    side_effects: []
