  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: stale_financial_document_excluded_at_183_day_boundary
        claim_type: input_set_filtering
        grounds: [calculations.financial_coverage, "errors[ERR_INSUFFICIENT_VERIFIED_FUNDING]"]
        distinguishing_aspect: "Freshness window is inclusive at exactly 183 days: a VERIFIED document issued 2026-01-30 (exactly 183 days before clock 2026-08-01) funds issuance, while one issued 2026-01-29 (184 days) is excluded and issuance fails."
        test_recipe:
          setup:
            - "Clock 2026-08-01; students A and B each with DRAFT record and a DRAFT I-20 totalling 1980000 cents"
            - "A: VERIFIED doc 2000000 issued 2026-01-30 (boundary, fresh); B: VERIFIED doc 2000000 issued 2026-01-29 (stale)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_a: $.data.id } }
            - { call: "POST /sevis/students/${stu_a}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_a: $.data.id } }
            - { call: "POST /sevis/students/${stu_a}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-01-30" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_a}/i20-forms", payload: { sevis_record_id: "${rec_a}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_a: $.data.id } }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0087654321", full_name: "Li Wei", email: "li@example.edu", date_of_birth: "2001-09-02", country_of_citizenship: "CN", degree_level: "GRADUATE" }, as: DSO, captures: { stu_b: $.data.id } }
            - { call: "POST /sevis/students/${stu_b}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_b: $.data.id } }
            - { call: "POST /sevis/students/${stu_b}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-01-29" }, as: DSO, captures: { doc_b: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_b}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_b}/i20-forms", payload: { sevis_record_id: "${rec_b}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_b: $.data.id } }
          trigger:
            - { call: "POST /sevis/i20-forms/${i20_a}/issue", payload: {}, as: DSO, captures: { a_status: $.data.status, a_verified: $.data.verified_funding_cents } }
            - { call: "POST /sevis/i20-forms/${i20_b}/issue", payload: {}, as: DSO, captures: { err_b: $.data.error_id } }
          assert:
            - "A (issue_date exactly 183 days old) issues: status == ISSUED, verified_funding_cents == 2000000"
            - "B (issue_date 184 days old): HTTP 402; data.error_id == ERR_INSUFFICIENT_VERIFIED_FUNDING (stale document excluded from the input set)"

      - name: estimated_total_sums_cost_lines
        claim_type: computed_fields
        grounds: [calculations.estimated_total_cents, entities.I20Form.fields.estimated_total_cents]
        distinguishing_aspect: "estimated_total_cents on creation equals the exact integer sum 1200000+600000+120000+60000 == 1980000."
        test_recipe:
          setup: ["Student with DRAFT record"]
          setup_api_calls:
