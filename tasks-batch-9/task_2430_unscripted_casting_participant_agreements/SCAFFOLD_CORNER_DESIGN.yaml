      - name: shoot_block_wrap_from_scheduled_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.ShootBlock.ROLLING_to_WRAPPED
          - validations[priority=13]
          - validations[priority=32]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Invalid-from claim with priority isolation: the block has
          expected_crowd_headcount 0 and no releases, so release_coverage_complete is
          vacuously true and priority 32 could not fire. The 409 therefore proves the
          from-state check (priority 13) rejects wrap directly from SCHEDULED —
          ROLLING is the only declared source.
        test_recipe:
          setup:
            - "One production, one STUDIO location, one SCHEDULED block with no called participants and no crowd."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/locations"
              payload: { name: "Pier 7 Stage", state_code: "GA", capacity: 400, turnaround_buffer_minutes: 60 }
              as: ProductionAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /casting/shoot-blocks"
              payload: { production_id: "${prod_id}", location_id: "${loc_id}", block_kind: "STUDIO", start_utc: "2026-09-20T08:00:00Z", end_utc: "2026-09-20T12:00:00Z", participant_agreement_ids: [] }
              as: ProductionAdmin
              captures: { blk_id: $.data.id, blk_status0: $.data.status, blk_complete: $.data.release_coverage_complete }
          trigger:
            - call: "POST /casting/shoot-blocks/${blk_id}/wrap"
              payload: {}
              as: ProductionAdmin
              captures: { err_wrap: $.data.error_id }
          assert:
            - "the trigger call returns HTTP 409"
            - "${err_wrap} == ERR_INVALID_STATE_TRANSITION"
            - "${blk_status0} == SCHEDULED"
            - "${blk_complete} == true"
            - "ShootBlock.${blk_id}.status == SCHEDULED"
            - "ShootBlock.${blk_id}.covered_head_count == 0"

      - name: agreement_negotiation_loops_back_from_revised_to_sent
        claim_type: valid_transition
        grounds:
          - state_machines.ParticipantAgreement.REVISED_to_SENT
          - state_machines.ParticipantAgreement.SENT_to_COUNTERED
          - state_machines.ParticipantAgreement.COUNTERED_to_REVISED
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_negotiation_cycle_two_full_loops
          rationale: "The cyclic SENT -> COUNTERED -> REVISED -> SENT loop is traversed twice, with round_number and both stipend variants asserted at each pass, by the named §1.8 instance."

      - name: applicant_screening_and_medical_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.Applicant.transitions
          - entities.Applicant.fields.screening_status
          - entities.Applicant.fields.medical_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / applicant_parallel_dimensions_medical_advances_alone
          rationale: "The two parallel Applicant dimensions are advanced separately and asserted pairwise by the named §1.8 instance."

      - name: complaint_branches_fork_and_join_at_resolved
        claim_type: side_effect_execution
        grounds:
          - state_machines.Complaint.TRIAGED_to_ESCALATED
          - state_machines.Complaint.AFTERCARE_ACTIVE_or_ESCALATED_to_RESOLVED
        excluded_because:
          difficulty_instance: non_linear_state_machine / complaint_fork_join_branch_side_effects_diverge
          rationale: "Both forks of the TRIAGED branch and their divergent side-effect sets, joining at RESOLVED, are asserted by the named §1.8 instance."

      - name: execute_cascade_closes_open_calls_down_the_chain
        claim_type: side_effect_execution
        grounds:
          - state_machines.ParticipantAgreement.SENT_to_EXECUTED
          - state_machines.CastingCall.PUBLISHED_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / execute_rollup_restricts_posture_closes_open_calls_depth4
          rationale: "The four-link cascade-down from execute through the rollup and posture to OPEN_CALL closure is asserted link by link by the named §1.8 instance."

      - name: void_after_execute_reverses_every_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.ParticipantAgreement.EXECUTED_to_VOIDED
          - calculations.production_stipend_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / stipend_pool_conserved_across_execute_then_void
          rationale: "The compensation of every execute side effect, with the conserved-quantity equality re-checked after void, is asserted by the named §1.8 instance."

      - name: applicant_withdraw_cascade_releases_the_trust
        claim_type: side_effect_execution
        grounds:
          - state_machines.Applicant.screening_to_WITHDRAWN
          - state_machines.MinorProtection.to_RELEASED
          - calculations.trust_escrow_rollup
        excluded_because:
          difficulty_instance: compensating_invariant / minor_trust_escrow_conserved_across_deposit_then_withdrawal
          rationale: "The five-link withdraw cascade, including MinorProtection RELEASED and the trust escrow returning to its pre-deposit value, is asserted by the named §1.8 instance."

