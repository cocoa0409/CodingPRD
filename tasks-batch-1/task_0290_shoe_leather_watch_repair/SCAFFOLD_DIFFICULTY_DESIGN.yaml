  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rush_surcharge_tier1_cap_boundary
        grounds:
          - calculations.rush_surcharge
          - entities.Estimate.fields.rush_surcharge_cents
          - endpoints[POST /estimates/{id}/present]
        distinguishing_aspect: |
          Boundary on a numeric threshold: pre_rush exactly == RUSH_TIER1_CAP (5000) puts
          the full 5000 in tier 1 (5000*0.30=1500) and 0 in tier 2, so rush_surcharge==1500
          (also the floor). One cent more (5001) adds 1 cent to tier 2 (1500 + round(0.20)=1500
          still floored), so the half-open boundary is exercised at exactly 5000 via /present.
        test_recipe:
          setup:
            - "RUSH ticket, single QUOTED line base 5000, no parts -> pre_rush == 5000 (the tier-1 cap)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
