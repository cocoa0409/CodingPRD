            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh1}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-28T00:00:00Z" }, as: EventDirector }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh2}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected with error_id == ERR_SIGNUP_WINDOW_CLOSED (${err}), never ERR_SHIFT_TIME_OVERLAP — temporal (p8) beats constraint (p9)"
            - "overlap condition genuinely present: 10:00 < 11:00+30min buffer on cross-segment shifts"

  - rule_id: boundary_precision_check
    instances:
      - name: age_boundary_exact_vs_one_day_short
        grounds:
          - calculations.age_years_on_event
          - validations[priority=5]
        distinguishing_aspect: |
          Metric: integer age in years at the >= boundary, via POST /signups. A
          volunteer whose 18th birthday falls EXACTLY on event day (2008-10-04 vs
          event 2026-10-04) passes (age == 18 >= min_age 18); one day later
          (2008-10-05) is 17 and fails — pinning that the event-date birthday counts.
        test_recipe:
          setup:
            - "Role min_age_years 18; event_start_at 2026-10-04; clock inside the general window (2026-08-20)"
            - "V_OK born 2008-10-04 (exactly 18 on race day); V_SHORT born 2008-10-05 (17)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 18 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Exact", date_of_birth: "2008-10-04" }, as: Anonymous, captures: { vok: $.data.id, vok_age: $.data.age_years_on_event } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Short", date_of_birth: "2008-10-05" }, as: Anonymous, captures: { vno: $.data.id, vno_age: $.data.age_years_on_event } }
            - { call: "POST /volunteer-ops/volunteers/${vok}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${vno}/screen", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${vok}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg_ok: $.data.id, sg_ok_status: $.data.status } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${vno}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Volunteer.${vok}.age_years_on_event == 18 (${vok_age}) — birthday on event date counts as reached"
            - "Volunteer.${vno}.age_years_on_event == 17 (${vno_age})"
            - "boundary-in: signup for the exactly-18 volunteer succeeds 201 REQUESTED (${sg_ok_status})"
            - "boundary-out: signup for the 17-year-old rejected with ERR_MIN_AGE_NOT_MET (${err})"

      - name: stock_last_unit_then_out_of_stock
        grounds:
          - validations[priority=12]
          - entities.SupplyInventory.fields.quantity_issued
        distinguishing_aspect: |
          Metric: integer stock units at the zero-remaining edge, via
          POST /distribution-records — a different metric and endpoint than age.
          quantity_issued == quantity_total - 1 still issues (the LAST unit); the
          next request at quantity_issued == quantity_total fails ERR_OUT_OF_STOCK
          (strictly-guarded <, not <=).
        test_recipe:
          setup:
            - "Event RACE_DAY; signup S1 CHECKED_IN; inventory SAFETY_VEST quantity_total 2"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T14:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/supply-inventories", payload: { event_id: "${ev}", item_code: "SAFETY_VEST", description: "Vest", quantity_total: 2 }, as: VolunteerCoordinator, captures: { inv: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "POST /volunteer-ops/distribution-records", payload: { signup_id: "${sg1}", kind: SUPPLY_ITEM, inventory_id: "${inv}" }, as: VolunteerCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /volunteer-ops/distribution-records", payload: { signup_id: "${sg1}", kind: SUPPLY_ITEM, inventory_id: "${inv}" }, as: VolunteerCoordinator, captures: { d2: $.data.id } }
            - { call: "GET /volunteer-ops/supply-inventories/${inv}", as: VolunteerCoordinator, captures: { issued: $.data.quantity_issued } }
            - { call: "POST /volunteer-ops/distribution-records", payload: { signup_id: "${sg1}", kind: SUPPLY_ITEM, inventory_id: "${inv}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "first and second issue succeed (201) — issuing the LAST unit is legal"
            - "SupplyInventory.${inv}.quantity_issued == 2 == quantity_total (${issued})"
            - "third issue rejected with ERR_OUT_OF_STOCK (${err}) at the exact zero-remaining edge"

      - name: headcount_exact_fill_waitlist_route
        grounds:
          - calculations.shift_fill_posture
          - validations[priority=10]
          - state_machines.Shift.OPEN_to_FULL
        distinguishing_aspect: |
          Metric: integer seat count at the headcount boundary, via POST /signups
          and POST /signups/{id}/approve — a different metric and endpoint than age
          or stock. Approval #2 lands confirmed_count == required_headcount exactly
          (FULL); a further approve at the boundary fails ERR_SHIFT_CAPACITY_REACHED
          while a fresh create routes to WAITLISTED (201, never an error).
        test_recipe:
          setup:
            - "Shift headcount 2; four ELIGIBLE volunteers V1..V4 with REQUESTED signups S1..S3 created while OPEN"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Three", date_of_birth: "2000-01-03" }, as: Anonymous, captures: { v3: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Four", date_of_birth: "2000-01-04" }, as: Anonymous, captures: { v4: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v3}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v4}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v3}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg3: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg2}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { st_full: $.data.status, cnt_full: $.data.confirmed_count } }
          trigger:
            - { call: "POST /volunteer-ops/signups/${sg3}/approve", payload: {}, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v4}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg4: $.data.id, sg4_status: $.data.status } }
          assert:
            - "after exactly 2 approvals: Shift.status == FULL and confirmed_count == 2 == required_headcount (${st_full}/${cnt_full})"
            - "approve at the boundary rejected ERR_SHIFT_CAPACITY_REACHED (${err}) — >= blocks the third seat"
            - "create at the boundary does NOT error: Signup.${sg4}.status == WAITLISTED (${sg4_status}) via the waitlist route"

      - name: credit_tier_boundary_at_exact_100_hours
        grounds:
          - calculations.fundraising_credit
          - calculations.sponsor_match_credit
