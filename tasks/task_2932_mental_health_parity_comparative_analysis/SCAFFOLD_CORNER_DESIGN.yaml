          difficulty_instance: "priority_pair_validation_conflict / safety_priority_19_beats_fiscal_priority_34_on_corrective_plan_decision"
          rationale: "The aggregate cap check, and its deliberate position behind the segregation-of-duties rule, are asserted there."

