              captures: { mfr_id: "$.data.id" }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_id}", device_category_id: "${cat_ok_id}", model_name: "Speaker One", sku: "SPK-001", firmware_version: "1.0.0", declared_support_period_end: "2029-08-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id", product_v1: "$.data.version" }
          trigger:
            - call: "POST /labeling/products/${product_id}/assessments"
              payload: { expected_product_version: "${product_v1}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { asmt_a_id: "$.data.id" }
            - call: "GET /labeling/products/${product_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_v2: "$.data.version" }
            - call: "POST /labeling/products/${product_id}/assessments"
              payload: { expected_product_version: "${product_v2}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { asmt_b_id: "$.data.id" }
            - call: "POST /labeling/products/${product_id}/assessments"
              payload: { expected_product_version: "${product_v2}" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /labeling/products/${product_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "first response HTTP status is 201; second response: version == 2 and spec_revision == 1"
            - "third response HTTP status is 201, so the freshly observed version 2 was accepted"
            - "fourth response HTTP status is 412 with data.error_id == ERR_STALE_PRODUCT_VERSION, because version 2 has already been consumed"
            - "fifth response: version == 3 and spec_revision == 1, so the rejected replay bumped nothing"
            - "ConformanceAssessment.${asmt_a_id}.status == SUPERSEDED with superseded_by_assessment_id == ${asmt_b_id}"
            - "ConformanceAssessment.${asmt_b_id}.status == DRAFT and assessed_spec_revision == 1"

      - name: cascading_side_effects_three_level_chain_from_a_spec_change
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Product.conformance_currency.CURRENT_to_STALE
          - endpoints.POST_labeling_products_id_spec_changes
        excluded_because:
          difficulty_instance: transitive_cascade / spec_change_suspends_grant_withdraws_display_and_demotes_retailer
          rationale: "The three-level chain (grant SUSPENDED -> authorization WITHDRAWN -> retailer participation_tier demoted) and its ordering sensitivity are asserted level-by-level there, including the untouched non-terminal siblings."

      - name: dual_variant_calculation_provisional_and_verified_both_computed
        claim_type: dual_variant_calculation
        grounds:
          - calculations.conformance_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_verified_conformance_score_on_router_assessment
          rationale: "Both variants are computed on one THIRD_PARTY_TEST assessment there, with the provisional 90.00 and the verified 100.00 asserted on the same row so the delta on the switch is pinned."

      - name: derived_field_reconciliation_penalty_ledger_after_assessment_payment_and_vacate
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.manufacturer_penalty_ledger
          - calculations.enforcement_penalty
          - entities.Manufacturer.fields.outstanding_penalty_cents
          - entities.Manufacturer.fields.standing
        distinguishing_aspect: "The same five derived Manufacturer fields are re-read at four points - after an adjudication assesses 34020, after the payment clears it, after a second adjudication assesses 24150 at aggravation 1.25, and after that second case is vacated - and outstanding + paid + vacated equals total_assessed_penalty_cents at every one of them."
        test_recipe:
          setup:
            - "A SMALL manufacturer has two UNAUTHORIZED_DISPLAY cases: case 1 (ONLINE, 6 units) is already upheld for 34020 cents, and case 2 (IN_STORE, 4 units) is at NOTICE_ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.example", enterprise_class: "SMALL", annual_us_revenue_cents: 900000000 }
              as: ProgramAdministrator
              captures: { mfr_id: "$.data.id" }
            - call: "POST /labeling/enforcement-cases"
              payload: { subject_manufacturer_id: "${mfr_id}", reported_scannable_code: "ZZ-NO-SUCH-CD09", violation_type: "UNAUTHORIZED_DISPLAY", violation_line_items: [ { retail_listing_ref: "LST-21", channel: "ONLINE", unit_count: 6 } ], reporter_note: "Label artwork on a marketplace listing" }
              as: ProgramAdministrator
              captures: { case1_id: "$.data.id" }
            - call: "POST /labeling/enforcement-cases/${case1_id}/notice"
              payload: { notice_reference: "NOT-2026-0021" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /labeling/enforcement-cases/${case1_id}/adjudicate"
              payload: { outcome: "UPHELD", adjudication_note: "Unauthorized display substantiated" }
              as: ProgramAdministrator
              as_user_id: "admin-2"
            - call: "POST /labeling/enforcement-cases"
              payload: { subject_manufacturer_id: "${mfr_id}", reported_scannable_code: "ZZ-NO-SUCH-CD10", violation_type: "UNAUTHORIZED_DISPLAY", violation_line_items: [ { retail_listing_ref: "LST-22", channel: "IN_STORE", unit_count: 4 } ], reporter_note: "Shelf talker carrying the program label" }
              as: ProgramAdministrator
              captures: { case2_id: "$.data.id" }
            - call: "POST /labeling/enforcement-cases/${case2_id}/notice"
              payload: { notice_reference: "NOT-2026-0022" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "GET /labeling/manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /labeling/enforcement-cases/${case1_id}/penalty-payments"
              payload: { payment_reference: "PAY-2026-0021" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /labeling/manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /labeling/enforcement-cases/${case2_id}/adjudicate"
              payload: { outcome: "UPHELD", adjudication_note: "Second unauthorized display substantiated" }
              as: ProgramAdministrator
              as_user_id: "admin-2"
            - call: "GET /labeling/manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /labeling/enforcement-cases/${case2_id}/vacate"
              payload: { vacate_reason: "Evidence retracted on appeal" }
              as: ProgramAdministrator
              as_user_id: "admin-3"
            - call: "GET /labeling/manufacturers/${mfr_id}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "first read (after the assessment): outstanding_penalty_cents == 34020, paid_penalty_cents == 0, vacated_penalty_cents == 0, total_assessed_penalty_cents == 34020, upheld_case_count == 1, standing == DELINQUENT"
            - "second read (after the payment): outstanding_penalty_cents == 0, paid_penalty_cents == 34020, vacated_penalty_cents == 0, total_assessed_penalty_cents == 34020, upheld_case_count == 1, standing == GOOD"
            - "the second adjudication response carries aggravation_multiplier == 1.25 and penalty_cents == 24150, computed as 4200 x 4 x 1.25 x 1.15"
            - "third read (after the second assessment): outstanding_penalty_cents == 24150, paid_penalty_cents == 34020, vacated_penalty_cents == 0, total_assessed_penalty_cents == 58170, upheld_case_count == 2, standing == GOOD"
            - "fourth read (after the vacate): outstanding_penalty_cents == 0, paid_penalty_cents == 34020, vacated_penalty_cents == 24150, total_assessed_penalty_cents == 58170, upheld_case_count == 1, standing == GOOD"
            - "EnforcementCase.${case1_id}.penalty_status == PAID with payment_reference == PAY-2026-0021, and EnforcementCase.${case2_id}.penalty_status == VACATED with case_status == VACATED"

      - name: bulk_operations_all_four_criterion_responses_succeed_in_one_batch
        claim_type: bulk_operations
        grounds:
          - endpoints.POST_labeling_assessments_id_responses
          - entities.CriterionResponse.fields.lab_verified
          - calculations.conformance_score
        distinguishing_aspect: "One batch of four resolvable elements returns 201 with an array of exactly four CriterionResponse rows in the submitted order, each defaulting to lab_result NOT_TESTED and lab_verified false, and the following submit scores all four at once for provisional_overall_score 100.00."
        test_recipe:
