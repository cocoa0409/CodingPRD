scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_statement_provisional_vs_final
        grounds:
          - calculations.royalty_split
          - entities.RoyaltyStatement.fields.narrator_royalty_cents
          - state_machines.RoyaltyStatement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Same SalesEvents, two valid variants on the RoyaltyStatement domain: PROVISIONAL uses units_sold
          (narrator_royalty_cents == 67500) while FINAL uses units_sold - units_returned
          (narrator_royalty_cents == 63450). The two numbers differ by 4050 cents on identical inputs.
        test_recipe:
          setup:
            - "An EXCLUSIVE, WORLD-territory Title published; ROYALTY_SHARE contract with royalty_share_pct 0.40 (effective share 0.45 after +0.05 exclusivity bonus, tier 1.0)."
            - "One channel (retailer_cut_pct 0.40), one ACTIVE listing, two SalesEvents in period: (units_sold 100, units_returned 10, unit_price_cents 1500) and (units_sold 50, units_returned 0, unit_price_cents 2000)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A1", email: "a1@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N1", email: "n1@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T1", isbn: "111", exclusivity: "EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/1" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.40, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/1", finished_hours: 8.5 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /distribution-channels"
              payload: { name: "Ch1", supported_territories: ["US"], retailer_cut_pct: 0.40 }
              as: PlatformAdmin
              captures: { ch: $.data.id }
            - call: "POST /distribution-listings"
              payload: { title_id: "${ti}", channel_id: "${ch}", territory: "US", effective_from: "2026-03-01", effective_until: "2026-12-31" }
              as: PlatformAdmin
              captures: { li: $.data.id }
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 100, units_returned: 10, unit_price_cents: 1500, occurred_at: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 50, units_returned: 0, unit_price_cents: 2000, occurred_at: "2026-03-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /royalty-statements"
              payload: { title_id: "${ti}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z" }
              as: PlatformAdmin
              captures: { st: $.data.id, prov_nar: $.data.narrator_royalty_cents, prov_aut: $.data.author_royalty_cents }
            - call: "POST /royalty-statements/${st}/finalize"
              payload: {}
              as: PlatformAdmin
          assert:
            - "prov_nar == 67500"
            - "prov_aut == 82500"
            - "RoyaltyStatement.${st}.variant == FINAL"
            - "RoyaltyStatement.${st}.narrator_royalty_cents == 63450"
            - "RoyaltyStatement.${st}.author_royalty_cents == 77550"
            - "RoyaltyStatement.${st}.status == FINALIZED"

      - name: narrator_comp_per_hour_vs_royalty_share
        grounds:
          - calculations.narrator_compensation
          - entities.Contract.fields.deal_type
          - state_machines.ProductionMilestone.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          On the Contract domain, the same finished production (finished_hours 8.5) pays a PER_HOUR narrator a flat
          round_half_up(8.5 * 25000) == 212500 cents credited at FULL approval, independent of any sales — whereas a
          ROYALTY_SHARE contract would instead credit narrator_royalty_cents (a sales-derived, different figure) only at
          statement PAID. Different entity domain than dual_variant royalty (which lives on RoyaltyStatement).
        test_recipe:
          setup:
            - "A Title cast under a PER_HOUR contract (per_hour_rate_cents 25000), narrator payout_balance starts at 0, FULL milestone submitted with finished_hours 8.5."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A2", email: "a2@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N2", email: "n2@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T2", isbn: "222", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/2" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "PER_HOUR", per_hour_rate_cents: 25000, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/2", finished_hours: 8.5 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
          trigger:
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
          assert:
            - "ProductionMilestone.${mi}.status == APPROVED"
            - "Title.${ti}.finished_hours == 8.5"
            - "Narrator.${na}.payout_balance_cents == 212500"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_rounding_round_then_sum
        grounds:
          - calculations.royalty_split
          - entities.RoyaltyStatement.fields.statement_net_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: retailer cut is rounded per SalesEvent line THEN summed.
          Lines round_half_up(10732*0.70)=7512 and round_half_up(2002*0.70)=1401 sum to statement_net_cents == 8913,
          whereas sum-then-round (round_half_up(12734*0.70)) would give 8914. The scaffold pins round-then-sum.
        test_recipe:
          setup:
            - "NON_EXCLUSIVE title published; ROYALTY_SHARE 0.40 (effective 0.40, no bonus, tier 1.0); channel retailer_cut_pct 0.30; two SalesEvents (4 x 2683) and (2 x 1001), zero returns."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A3", email: "a3@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N3", email: "n3@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T3", isbn: "333", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2683 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/3" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.40, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/3", finished_hours: 5.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /distribution-channels"
              payload: { name: "Ch3", supported_territories: ["US"], retailer_cut_pct: 0.30 }
              as: PlatformAdmin
              captures: { ch: $.data.id }
            - call: "POST /distribution-listings"
              payload: { title_id: "${ti}", channel_id: "${ch}", territory: "US", effective_from: "2026-03-01", effective_until: "2026-12-31" }
              as: PlatformAdmin
              captures: { li: $.data.id }
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 4, units_returned: 0, unit_price_cents: 2683, occurred_at: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 2, units_returned: 0, unit_price_cents: 1001, occurred_at: "2026-03-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /royalty-statements"
              payload: { title_id: "${ti}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z" }
              as: PlatformAdmin
              captures: { st: $.data.id }
          assert:
            - "RoyaltyStatement.${st}.statement_net_cents == 8913"
            - "RoyaltyStatement.${st}.narrator_royalty_cents == 3565"
            - "RoyaltyStatement.${st}.author_royalty_cents == 5348"

      - name: effective_share_tiered_min_cap
        grounds:
          - calculations.effective_narrator_share
          - entities.Title.fields.exclusivity
          - entities.RoyaltyStatement.fields.narrator_share_pct_applied
        distinguishing_aspect: |
          Mode (a) non-linear formula with 3 inputs and a nested min: base 0.40 + EXCLUSIVE bonus 0.05 = 0.45, times
          tier multiplier 1.20 (cumulative units_sold 6000 >= 5000) = 0.54, clamped by min(SHARE_CAP=0.50, 0.54) = 0.50.
          narrator_share_pct_applied == 0.50 and narrator_royalty_cents == 1800000. Different mode than the (b) rounding instance.
        test_recipe:
          setup:
            - "EXCLUSIVE title published, ROYALTY_SHARE base 0.40; channel retailer_cut_pct 0.40; one SalesEvent units_sold 6000, unit_price_cents 1000, zero returns (pushes cumulative into the >=5000 tier)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A4", email: "a4@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N4", email: "n4@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T4", isbn: "444", exclusivity: "EXCLUSIVE", territory: "WORLD", list_price_cents: 1000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/4" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.40, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/4", finished_hours: 6.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "PASS" }
              as: QCReviewer
            - call: "POST /titles/${ti}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /distribution-channels"
              payload: { name: "Ch4", supported_territories: ["US"], retailer_cut_pct: 0.40 }
              as: PlatformAdmin
              captures: { ch: $.data.id }
            - call: "POST /distribution-listings"
              payload: { title_id: "${ti}", channel_id: "${ch}", territory: "US", effective_from: "2026-03-01", effective_until: "2026-12-31" }
              as: PlatformAdmin
              captures: { li: $.data.id }
            - call: "POST /sales-events"
              payload: { listing_id: "${li}", units_sold: 6000, units_returned: 0, unit_price_cents: 1000, occurred_at: "2026-03-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /royalty-statements"
              payload: { title_id: "${ti}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z" }
              as: PlatformAdmin
              captures: { st: $.data.id }
          assert:
            - "RoyaltyStatement.${st}.narrator_share_pct_applied == 0.50"
            - "RoyaltyStatement.${st}.statement_net_cents == 3600000"
            - "RoyaltyStatement.${st}.narrator_royalty_cents == 1800000"
            - "RoyaltyStatement.${st}.author_royalty_cents == 1800000"

  # =================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: milestone_qc_revision_cycle
        grounds:
          - state_machines.ProductionMilestone.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.ProductionMilestone.REVISION_REQUESTED_to_SUBMITTED
          - entities.ProductionMilestone.fields.revision_count
        distinguishing_aspect: |
          ProductionMilestone re-enters SUBMITTED after REVISION_REQUESTED (a true cycle
          SUBMITTED->REVISION_REQUESTED->SUBMITTED), not a linear pipeline. After one FAIL then one resubmit the
          milestone is back in SUBMITTED with revision_count == 1 and the Title is back in IN_QC.
        test_recipe:
          setup:
            - "A FULL milestone in SUBMITTED (Title IN_QC) for an ACCEPTED contract."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A5", email: "a5@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N5", email: "n5@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T5", isbn: "555", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/5" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
              as: Narrator
              as_user_id: "${na}"
            - call: "POST /production-milestones"
              payload: { contract_id: "${co}", milestone_type: "FULL", audio_url: "http://a/5a", finished_hours: 7.0 }
              as: Narrator
              as_user_id: "${na}"
              captures: { mi: $.data.id }
          trigger:
            - call: "POST /production-milestones/${mi}/qc-reviews"
              payload: { outcome: "FAIL", notes: "retake chapter 3" }
              as: QCReviewer
            - call: "POST /production-milestones/${mi}/resubmit"
              payload: { audio_url: "http://a/5b" }
              as: Narrator
              as_user_id: "${na}"
          assert:
            - "ProductionMilestone.${mi}.status == SUBMITTED"
            - "ProductionMilestone.${mi}.revision_count == 1"
            - "Title.${ti}.status == IN_QC"

      - name: contract_offered_branches_to_declined
        grounds:
          - state_machines.Contract.OFFERED_to_DECLINED
          - state_machines.Contract.OFFERED_to_ACCEPTED
          - state_machines.Title.CASTING_to_OPEN_FOR_AUDITION
        distinguishing_aspect: |
          From OFFERED the Contract forks to DECLINED (vs ACCEPTED), and each branch drives a divergent Title
          side-effect: DECLINE reverts Title CASTING->OPEN_FOR_AUDITION while ACCEPT advances CASTING->IN_PRODUCTION.
          Branching on the Contract entity, distinct from the ProductionMilestone cycle.
        test_recipe:
          setup:
            - "A Title in CASTING with one OFFERED contract to the narrator."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A6", email: "a6@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N6", email: "n6@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T6", isbn: "666", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/6" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
          trigger:
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "DECLINE" }
              as: Narrator
              as_user_id: "${na}"
          assert:
            - "Contract.${co}.status == DECLINED"
            - "Title.${ti}.status == OPEN_FOR_AUDITION"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rights_reversion_four_hop_chain
        grounds:
          - state_machines.Title.PUBLISHED_to_REVERTED
          - state_machines.Contract.ACCEPTED_to_TERMINATED
          - state_machines.DistributionListing.ACTIVE_to_WITHDRAWN
          - state_machines.RoyaltyStatement.PROVISIONAL_to_FROZEN
        distinguishing_aspect: |
          Depth-3 transitive chain from POST /titles/{id}/revert-rights: Title->REVERTED causes Contract->TERMINATED
          (link 1); the contract termination causes each ACTIVE DistributionListing->WITHDRAWN (link 2); each
          cascade withdrawal causes the title's PROVISIONAL RoyaltyStatement->FROZEN (link 3). Each hop is caused by
          the previous hop, not directly by the revert action.
        test_recipe:
          setup:
            - "A published Title with an ACCEPTED contract, one ACTIVE listing, and one PROVISIONAL royalty statement."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A7", email: "a7@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N7", email: "n7@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "T7", isbn: "777", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
              as: Author
              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/7" }
              as: Narrator
              as_user_id: "${na}"
              captures: { ad: $.data.id }
            - call: "POST /auditions/${ad}/decision"
              payload: { decision: "ACCEPT" }
              as: Author
              as_user_id: "${au}"
            - call: "POST /contracts"
              payload: { title_id: "${ti}", narrator_id: "${na}", deal_type: "ROYALTY_SHARE", royalty_share_pct: 0.30, expected_title_version: "${tv}" }
              as: Author
              as_user_id: "${au}"
              captures: { co: $.data.id }
            - call: "POST /contracts/${co}/respond"
              payload: { decision: "ACCEPT" }
