      - name: ingredient_retire_twice_is_rejected_from_the_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[Ingredient].terminal_states
          - validations[priority 31]
          - errors[ERR_INGREDIENT_RETIRED]
        distinguishing_aspect: "RETIRED is terminal: the second retire is rejected with ERR_INGREDIENT_RETIRED 422 rather than silently re-stamping retired_at, and the version does not move — the ingredient's own status is one of the five subjects of the priority-31 gate."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK created at clock 2026-08-01T00:00:00.000Z and retired once; the clock is then advanced to 2026-08-10T00:00:00.000Z so a silent re-stamp would be visible."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/ingredients/${ched_id}/retire"
              as: CulinaryDirector
              captures: { v1: $.data.version, ra1: $.data.retired_at }
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /culinary/ingredients/${ched_id}/retire"
              as: CulinaryDirector
              captures: { err: $.data.error_id }
            - call: "GET /culinary/ingredients/${ched_id}"
              as: CostAnalyst
              captures: { st: $.data.status, ra2: $.data.retired_at, v2: $.data.version }
          assert:
            - "${err} == ERR_INGREDIENT_RETIRED with HTTP 422"
            - "${st} == RETIRED, ${ra2} == ${ra1} == 2026-08-01T00:00:00.000Z — NOT the advanced clock, so no side effect ran"
            - "${v2} == ${v1} — a rejected transition never bumps the version"

      - name: price_feed_publish_twice_is_rejected
