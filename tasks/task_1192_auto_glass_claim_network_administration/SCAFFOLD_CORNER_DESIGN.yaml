  - section: calculations
    instances:
      - name: deductible_state_cap_applied
        claim_type: correct_result
        grounds: ["calculations.deductible_determination", "entities.StateRegulation.fields.max_deductible_cents"]
        distinguishing_aspect: "When StateRegulation.max_deductible_cents is set below the policy deductible, the effective deductible is min(policy, cap): policy 100000 with cap 25000 yields provisional 25000 and deductible_applied 25000."
        test_recipe:
          setup: ["SC regulation: zero_deductible_windshield=true BUT claim is SIDE_GLASS so zero-deductible does not apply; max_deductible_cents=25000; tax 600bp", "policyholder + COMPREHENSIVE policy deductible 100000", "claim SIDE_GLASS est 40000 SUBMITTED then verified"]
          setup_api_calls:
            - call: "POST /state-regulations"
              payload: { state_code: "SC", zero_deductible_windshield: true, max_deductible_cents: 25000, glass_sales_tax_rate_bp: 600 }
              as: NetworkAdmin
            - call: "POST /policyholders"
              payload: { full_name: "Cap Ded", email: "capd@x.com", phone: "555-3001", state_code: "SC" }
              as: NetworkAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", policy_number: "PN-CAPD-1", state_code: "SC", coverage_type: "COMPREHENSIVE", deductible_cents: 100000, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01" }
              as: NetworkAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", incident_state_code: "SC", service_zip_code: "29201", part_category: "SIDE_GLASS", loss_date: "2026-04-15", description: "cap ded", requires_adas_calibration: false, estimated_repair_cost_cents: 40000 }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim_id: $.data.id, provisional: $.data.provisional_customer_responsibility_cents }
          trigger:
            - call: "POST /claims/${claim_id}/verify-coverage"
              payload: {}
              as: ClaimAdjuster
          assert:
            - "provisional == 25000 (min(min(100000, 25000 cap), 40000 estimate))"
            - "Claim.${claim_id}.deductible_applied_cents == 25000 (state cap wins over policy deductible; zero-deductible NOT applied because part_category is SIDE_GLASS)"

      - name: zero_deductible_only_for_windshield
