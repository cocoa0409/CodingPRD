scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: honors_gpa_basis_divergence
        grounds:
          - calculations.honors_designation
          - calculations.gpa_calculation
          - entities.HonorsPolicy.fields.honors_gpa_basis
        distinguishing_aspect: |
          Dual variant on the Student/HonorsPolicy domain (honors GPA basis): identical enrollment
          data earns SUMMA_CUM_LAUDE under INSTITUTIONAL basis (3.900) and NONE under CUMULATIVE
          basis (2.950); distinct from the audit-progress variant which lives on the
          DegreeAudit/RequirementGroup domain.
        test_recipe:
          setup:
            - "Program BS-INST [2024,2028) min_total_credits 20, min_gpa 2.0, no groups; honors policy INSTITUTIONAL residency 10, thresholds 3.5/3.75/3.9, years [2024,2027]"
            - "Program BS-CUM identical numbers; honors policy basis CUMULATIVE"
            - "Student Alice: 9cr institutional A + 1cr institutional B (GPA 3.900) + 10cr transfer C; Student Bob: identical course mix"
            - "Both declared in their program catalog_year 2024, FINAL-audited, applied, submitted, reviewed, CLEARED, conferred"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-INST", name: "BS Inst", degree_type: "BACHELOR", min_total_credits: 20, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_inst: $.data.id } }
            - { call: "POST /programs/${p_inst}/honors-policies", payload: { honors_gpa_basis: "INSTITUTIONAL", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2024, effective_last_year: 2027, residency_min_credits: 10 }, as: RegistrarStaff }
            - { call: "POST /programs", payload: { program_code: "BS-CUM", name: "BS Cum", degree_type: "BACHELOR", min_total_credits: 20, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_cum: $.data.id } }
            - { call: "POST /programs/${p_cum}/honors-policies", payload: { honors_gpa_basis: "CUMULATIVE", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2024, effective_last_year: 2027, residency_min_credits: 10 }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "C100", title: "Core", credits: 3 }, as: RegistrarStaff, captures: { c100: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C101", title: "Semi", credits: 1 }, as: RegistrarStaff, captures: { c101: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "TR500", title: "Transfer", credits: 5 }, as: RegistrarStaff, captures: { tr500: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-INST", legal_name: "Alice Example" }, as: RegistrarStaff, captures: { s_a: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-CUM", legal_name: "Bob Example" }, as: RegistrarStaff, captures: { s_b: $.data.id } }
            - { call: "POST /students/${s_a}/enrollments", payload: { course_id: "${c100}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_a}/enrollments", payload: { course_id: "${c100}", term: "2025-SP", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_a}/enrollments", payload: { course_id: "${c100}", term: "2025-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_a}/enrollments", payload: { course_id: "${c101}", term: "2025-FA", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_a}/enrollments", payload: { course_id: "${tr500}", term: "2024-FA", is_transfer: true, grade: "C" }, as: RegistrarStaff }
            - { call: "POST /students/${s_a}/enrollments", payload: { course_id: "${tr500}", term: "2025-SP", is_transfer: true, grade: "C" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/enrollments", payload: { course_id: "${c100}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/enrollments", payload: { course_id: "${c100}", term: "2025-SP", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/enrollments", payload: { course_id: "${c100}", term: "2025-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/enrollments", payload: { course_id: "${c101}", term: "2025-FA", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/enrollments", payload: { course_id: "${tr500}", term: "2024-FA", is_transfer: true, grade: "C" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/enrollments", payload: { course_id: "${tr500}", term: "2025-SP", is_transfer: true, grade: "C" }, as: RegistrarStaff }
            - { call: "POST /students/${s_a}/programs", payload: { program_id: "${p_inst}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_a: $.data.id, sp_a_v: $.data.version } }
            - { call: "POST /student-programs/${sp_a}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_a_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_a}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15", diploma_name: "Alice A. Example" }, as: Student, as_user_id: "${s_a}", captures: { app_a: $.data.id } }
            - { call: "POST /applications/${app_a}/submit", payload: {}, as: Student, as_user_id: "${s_a}" }
            - { call: "POST /applications/${app_a}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_a}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff }
            - { call: "POST /students/${s_b}/programs", payload: { program_id: "${p_cum}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_b: $.data.id, sp_b_v: $.data.version } }
            - { call: "POST /student-programs/${sp_b}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_b_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_b}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_b}", captures: { app_b: $.data.id } }
            - { call: "POST /applications/${app_b}/submit", payload: {}, as: Student, as_user_id: "${s_b}" }
            - { call: "POST /applications/${app_b}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_b}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_a}/confer", payload: {}, as: RegistrarStaff, captures: { honors_a: $.data.honors_designation } }
            - { call: "POST /applications/${app_b}/confer", payload: {}, as: RegistrarStaff, captures: { honors_b: $.data.honors_designation } }
            - { call: "GET /students/${s_a}", as: RegistrarStaff, captures: { inst_gpa_a: $.data.institutional_gpa, cum_gpa_a: $.data.cumulative_gpa } }
            - { call: "GET /students/${s_b}", as: RegistrarStaff, captures: { inst_gpa_b: $.data.institutional_gpa, cum_gpa_b: $.data.cumulative_gpa } }
          assert:
            - "Student.${s_a}.institutional_gpa == 3.900 and cumulative_gpa == 2.950 (identical for ${s_b})"
            - "GraduationApplication.${app_a}.honors_designation == SUMMA_CUM_LAUDE (INSTITUTIONAL basis 3.900 >= 3.9)"
            - "GraduationApplication.${app_b}.honors_designation == NONE (CUMULATIVE basis 2.950 < 3.5)"
            - "GET /diplomas?application_id=${app_a} [0].honors_designation == SUMMA_CUM_LAUDE"

      - name: audit_final_vs_conditional_projection
        grounds:
          - calculations.degree_audit_progress
          - entities.DegreeAudit.fields.in_progress_credits_counted
        distinguishing_aspect: |
          Dual variant on the DegreeAudit/RequirementGroup domain (credit projection): identical
          enrollments yield overall_satisfied=false under the FINAL completed-only variant and
          true under the CONDITIONAL include-in-progress variant; distinct subject from the
          honors-GPA variant instance.
        test_recipe:
          setup:
            - "Program BS-PROJ [2024,2028) min_total_credits 12, min_gpa 2.0, no requirement groups"
            - "Student with 9 completed institutional credits (3x3cr A) and one 3cr IN_PROGRESS enrollment"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-PROJ", name: "BS Proj", degree_type: "BACHELOR", min_total_credits: 12, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_prj: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "PRJ1", title: "Proj", credits: 3 }, as: RegistrarStaff, captures: { c_prj: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-PROJ", legal_name: "Pat Proj" }, as: RegistrarStaff, captures: { s_prj: $.data.id } }
            - { call: "POST /students/${s_prj}/enrollments", payload: { course_id: "${c_prj}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_prj}/enrollments", payload: { course_id: "${c_prj}", term: "2025-SP", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_prj}/enrollments", payload: { course_id: "${c_prj}", term: "2025-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_prj}/enrollments", payload: { course_id: "${c_prj}", term: "2026-SP" }, as: RegistrarStaff }
            - { call: "POST /students/${s_prj}/programs", payload: { program_id: "${p_prj}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_prj: $.data.id, sp_prj_v: $.data.version } }
            - { call: "POST /student-programs/${sp_prj}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_prj_v}" }, as: RegistrarStaff, captures: { fin_applied: $.data.total_credits_applied, fin_outstanding: $.data.outstanding_credits, fin_satisfied: $.data.overall_satisfied, fin_ip: $.data.in_progress_credits_counted } }
            - { call: "GET /student-programs/${sp_prj}", as: RegistrarStaff, captures: { sp_prj_v2: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_prj}/audits", payload: { audit_kind: "CONDITIONAL", expected_student_program_version: "${sp_prj_v2}" }, as: RegistrarStaff, captures: { cond_applied: $.data.total_credits_applied, cond_outstanding: $.data.outstanding_credits, cond_satisfied: $.data.overall_satisfied, cond_ip: $.data.in_progress_credits_counted } }
          assert:
            - "FINAL audit: total_credits_applied == 9, outstanding_credits == 3, in_progress_credits_counted == 0, overall_satisfied == false"
            - "CONDITIONAL audit on identical data: total_credits_applied == 12, outstanding_credits == 0, in_progress_credits_counted == 3, overall_satisfied == true"
            - "gpa_at_audit == 4.000 on both variants (GPA projection never includes IN_PROGRESS)"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_allocation_group_contention
        grounds:
          - calculations.requirement_group_satisfaction
          - entities.DegreeAudit.fields.groups_result
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — eligible-course overlap between two
          groups, per-group min_grade filters, waiver offsets via max(0, required - waived), and a
          largest-deficit waterfall where one enrollment feeds at most one group; allocation order
          decides which group starves.
        test_recipe:
          setup:
            - "Program BS-WF [2024,2028) min_total_credits 6, min_gpa 2.0; group CORE required 6 min_grade C eligible [CS101, CS102]; group GEN required 3 min_grade D eligible [CS101]"
            - "Student completed CS101 3cr A (created first) then CS102 3cr B"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-WF", name: "BS WF", degree_type: "BACHELOR", min_total_credits: 6, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wf: $.data.id } }
            - { call: "POST /programs/${p_wf}/requirement-groups", payload: { group_code: "CORE", required_credits: 6, min_grade: "C", eligible_course_codes: ["CS101", "CS102"] }, as: RegistrarStaff, captures: { g_core: $.data.id } }
            - { call: "POST /programs/${p_wf}/requirement-groups", payload: { group_code: "GEN", required_credits: 3, min_grade: "D", eligible_course_codes: ["CS101"] }, as: RegistrarStaff, captures: { g_gen: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "CS101", title: "Intro", credits: 3 }, as: RegistrarStaff, captures: { c_cs101: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "CS102", title: "Data", credits: 3 }, as: RegistrarStaff, captures: { c_cs102: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WF", legal_name: "Wren Ford" }, as: RegistrarStaff, captures: { s_wf: $.data.id } }
            - { call: "POST /students/${s_wf}/enrollments", payload: { course_id: "${c_cs101}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_wf}/enrollments", payload: { course_id: "${c_cs102}", term: "2025-SP", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_wf}/programs", payload: { program_id: "${p_wf}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_wf: $.data.id, sp_wf_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_wf}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_wf_v}" }, as: RegistrarStaff, captures: { wf_satisfied: $.data.overall_satisfied, wf_groups: $.data.groups_result } }
          assert:
            - "CS101 is eligible for both CORE (deficit 6) and GEN (deficit 3); largest-deficit rule allocates CS101 to CORE, then CS102 to CORE"
            - "groups_result entry for CORE: credits_applied == 6, effective_required_credits == 6, satisfied == true"
            - "groups_result entry for GEN: credits_applied == 0, effective_required_credits == 3, satisfied == false"
            - "overall_satisfied == false despite total_credits_applied == 6 >= min_total_credits == 6 (group conjunct fails)"

      - name: gpa_single_final_rounding_vs_per_term
        grounds:
          - calculations.gpa_calculation
          - entities.Student.fields.institutional_gpa
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins sum-then-round-once
          (14/5 = 2.800); the alternative round-each-term-then-average order yields
          (3.333 + 4.000)/2 = 3.667 for identical enrollments, so the rounding order is observable.
        test_recipe:
          setup:
            - "Student with term 2024-FA: 1cr A + 2cr B; term 2025-SP: 1cr A (all institutional, no transfer)"
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "CX1", title: "One Credit", credits: 1 }, as: RegistrarStaff, captures: { c_x1: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "CY2", title: "Two Credit", credits: 2 }, as: RegistrarStaff, captures: { c_y2: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-GPA", legal_name: "Gail Paige" }, as: RegistrarStaff, captures: { s_gpa: $.data.id } }
            - { call: "POST /students/${s_gpa}/enrollments", payload: { course_id: "${c_x1}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_gpa}/enrollments", payload: { course_id: "${c_y2}", term: "2024-FA", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_gpa}/enrollments", payload: { course_id: "${c_x1}", term: "2025-SP", grade: "A" }, as: RegistrarStaff }
          trigger:
            - { call: "GET /students/${s_gpa}", as: RegistrarStaff, captures: { gpa_inst: $.data.institutional_gpa, gpa_cum: $.data.cumulative_gpa } }
          assert:
            - "Student.${s_gpa}.institutional_gpa == 2.800 ((4.00 + 6.00 + 4.00) / 5 credits, single final rounding, round_half_up)"
            - "institutional_gpa != 3.667 (the per-term-round-then-average order the scaffold explicitly rejects)"
            - "cumulative_gpa == 2.800 (no transfer enrollments, variants coincide)"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: waiver_deny_resubmit_cycle
        grounds:
          - state_machines.SubstitutionWaiver.SUBMITTED_to_DENIED
          - state_machines.SubstitutionWaiver.DENIED_to_SUBMITTED
          - state_machines.SubstitutionWaiver.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Cyclic machine on SubstitutionWaiver: SUBMITTED -> DENIED -> SUBMITTED loops with the
          original requester identity preserved across the loop; the GraduationApplication
          instance exhibits a different non-linear shape (branching fork) on a different entity.
        test_recipe:
          setup:
            - "Program BS-CYC [2024,2028) min_total_credits 3 min_gpa 2.0; group ELEC required 3 min_grade D eligible [HIST201]"
            - "Student with completed PSY101 3cr A; declared in program; SUBSTITUTION waiver mapping PSY101 into ELEC, requested by the student"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-CYC", name: "BS Cyc", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_cyc: $.data.id } }
            - { call: "POST /programs/${p_cyc}/requirement-groups", payload: { group_code: "ELEC", required_credits: 3, min_grade: "D", eligible_course_codes: ["HIST201"] }, as: RegistrarStaff, captures: { g_elec: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "PSY101", title: "Psych", credits: 3 }, as: RegistrarStaff, captures: { c_psy: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-CYC", legal_name: "Cy Cole" }, as: RegistrarStaff, captures: { s_cyc: $.data.id } }
            - { call: "POST /students/${s_cyc}/enrollments", payload: { course_id: "${c_psy}", term: "2024-FA", grade: "A" }, as: RegistrarStaff, captures: { en_psy: $.data.id } }
            - { call: "POST /students/${s_cyc}/programs", payload: { program_id: "${p_cyc}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_cyc: $.data.id } }
            - { call: "POST /student-programs/${sp_cyc}/waivers", payload: { requirement_group_id: "${g_elec}", kind: "SUBSTITUTION", enrollment_id: "${en_psy}", reason: "advising plan" }, as: Student, as_user_id: "${s_cyc}", captures: { w_cyc: $.data.id } }
          trigger:
            - { call: "POST /substitution-waivers/${w_cyc}/advisor-decision", payload: { decision: "DENY", decision_reason: "not justified" }, as: Advisor, as_user_id: "adv-2", captures: { st1: $.data.status } }
            - { call: "POST /substitution-waivers/${w_cyc}/resubmit", payload: { reason: "updated justification" }, as: Student, as_user_id: "${s_cyc}", captures: { st2: $.data.status, req_role: $.data.requested_by_role, req_uid: $.data.requested_by_user_id } }
            - { call: "POST /substitution-waivers/${w_cyc}/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-2", captures: { st3: $.data.status } }
            - { call: "POST /substitution-waivers/${w_cyc}/registrar-decision", payload: { decision: "APPROVE" }, as: RegistrarStaff, captures: { st4: $.data.status } }
            - { call: "POST /substitution-waivers/${w_cyc}/revoke", payload: { reason: "entered in error" }, as: RegistrarStaff, captures: { st5: $.data.status } }
            - { call: "POST /substitution-waivers/${w_cyc}/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-2", captures: { err_term: $.data.error_id } }
          assert:
            - "statuses in order: DENIED -> SUBMITTED -> ADVISOR_APPROVED -> APPROVED -> REVOKED (cycle DENIED->SUBMITTED traversed)"
            - "after resubmit, requested_by_role == STUDENT and requested_by_user_id == ${s_cyc} (original requester preserved, not the resubmitter)"
            - "REVOKED is terminal: advisor-decision after revoke returns error_id == ERR_WAIVER_INVALID_STATE"

      - name: application_conditional_clearance_fork
        grounds:
          - state_machines.GraduationApplication.UNDER_REVIEW_to_CONDITIONALLY_CLEARED
          - state_machines.GraduationApplication.CONDITIONALLY_CLEARED_to_DENIED
        distinguishing_aspect: |
          Branching fork on GraduationApplication: UNDER_REVIEW fans out to
          CLEARED / CONDITIONALLY_CLEARED / DENIED with divergent side-effect sets, and the
          CONDITIONALLY_CLEARED branch itself forks again on contingency resolution (here the
          failure branch fires with decision_reason CONTINGENCY_FAILED); different entity and
          different shape from the SubstitutionWaiver cycle.
        test_recipe:
          setup:
            - "Program BS-BR [2024,2028) min_total_credits 12 min_gpa 2.0; group CORE required 9 min_grade D eligible [C1,C2,C3]"
            - "Student completed C1 A, C2 B, C3 B (9cr) and has C4 3cr IN_PROGRESS; declared, FINAL-audited (unsatisfied 9<12), applied, submitted, UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-BR", name: "BS Branch", degree_type: "BACHELOR", min_total_credits: 12, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_br: $.data.id } }
            - { call: "POST /programs/${p_br}/requirement-groups", payload: { group_code: "CORE", required_credits: 9, min_grade: "D", eligible_course_codes: ["C1", "C2", "C3"] }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "C1", title: "C1", credits: 3 }, as: RegistrarStaff, captures: { c1: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C2", title: "C2", credits: 3 }, as: RegistrarStaff, captures: { c2: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C3", title: "C3", credits: 3 }, as: RegistrarStaff, captures: { c3: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C4", title: "C4", credits: 3 }, as: RegistrarStaff, captures: { c4: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-BR", legal_name: "Bree Branch" }, as: RegistrarStaff, captures: { s_br: $.data.id } }
            - { call: "POST /students/${s_br}/enrollments", payload: { course_id: "${c1}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_br}/enrollments", payload: { course_id: "${c2}", term: "2024-FA", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_br}/enrollments", payload: { course_id: "${c3}", term: "2025-SP", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_br}/enrollments", payload: { course_id: "${c4}", term: "2026-SP" }, as: RegistrarStaff, captures: { en_c4: $.data.id } }
            - { call: "POST /students/${s_br}/programs", payload: { program_id: "${p_br}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_br: $.data.id, sp_br_v: $.data.version } }
            - { call: "POST /student-programs/${sp_br}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_br_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_br}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_br}", captures: { app_br: $.data.id } }
            - { call: "POST /applications/${app_br}/submit", payload: {}, as: Student, as_user_id: "${s_br}" }
            - { call: "POST /applications/${app_br}/begin-review", payload: {}, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_br}/decide", payload: { decision: "CONDITIONALLY_CLEARED" }, as: RegistrarStaff, captures: { st_fork: $.data.status } }
            - { call: "POST /enrollments/${en_c4}/post-grade", payload: { grade: "F" }, as: RegistrarStaff, captures: { en_st: $.data.status, en_earned: $.data.credits_earned } }
            - { call: "GET /applications/${app_br}", as: RegistrarStaff, captures: { st_final: $.data.status, reason_final: $.data.decision_reason } }
            - { call: "GET /students/${s_br}", as: RegistrarStaff, captures: { gpa_final: $.data.institutional_gpa, earned_final: $.data.total_earned_credits } }
          assert:
            - "fork: decide CONDITIONALLY_CLEARED succeeds from UNDER_REVIEW (>=1 IN_PROGRESS enrollment exists)"
            - "failure branch: posting F on the last IN_PROGRESS enrollment auto-transitions the application to DENIED with decision_reason == CONTINGENCY_FAILED"
            - "Enrollment.${en_c4}: status == COMPLETED, credits_earned == 0"
            - "Student.${s_br}: total_earned_credits == 9, institutional_gpa == 2.500 (F counts in GPA denominator: 30.00 / 12)"
            - "the divergent CLEARED branch does NOT fire: status != CLEARED"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: post_grade_four_hop_clearance_cascade
        grounds:
          - state_machines.Enrollment.IN_PROGRESS_to_COMPLETED
          - state_machines.GraduationApplication.CONDITIONALLY_CLEARED_to_CLEARED
          - calculations.degree_audit_progress
        distinguishing_aspect: |
          Depth-3 chain Enrollment -> Student -> DegreeAudit -> GraduationApplication triggered
          by post-grade: each hop is caused by the previous hop's mutation (earned credits feed
          GPA recompute, which feeds audit recompute, which releases the conditional clearance);
          the waiver cascade instance is a depth-2 chain from a different trigger.
        test_recipe:
          setup:
            - "Program BS-CC [2024,2028) min_total_credits 12 min_gpa 2.0; group CORE required 9 min_grade D eligible [C1,C2,C3]"
            - "Student completed C1 A, C2 B, C3 B (9cr); C4 3cr IN_PROGRESS; FINAL audit CURRENT (unsatisfied); application CONDITIONALLY_CLEARED"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-CC", name: "BS Cascade", degree_type: "BACHELOR", min_total_credits: 12, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_cc: $.data.id } }
            - { call: "POST /programs/${p_cc}/requirement-groups", payload: { group_code: "CORE", required_credits: 9, min_grade: "D", eligible_course_codes: ["C1", "C2", "C3"] }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "C1", title: "C1", credits: 3 }, as: RegistrarStaff, captures: { cc1: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C2", title: "C2", credits: 3 }, as: RegistrarStaff, captures: { cc2: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C3", title: "C3", credits: 3 }, as: RegistrarStaff, captures: { cc3: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "C4", title: "C4", credits: 3 }, as: RegistrarStaff, captures: { cc4: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-CC", legal_name: "Cass Clear" }, as: RegistrarStaff, captures: { s_cc: $.data.id } }
            - { call: "POST /students/${s_cc}/enrollments", payload: { course_id: "${cc1}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_cc}/enrollments", payload: { course_id: "${cc2}", term: "2024-FA", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_cc}/enrollments", payload: { course_id: "${cc3}", term: "2025-SP", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_cc}/enrollments", payload: { course_id: "${cc4}", term: "2026-SP" }, as: RegistrarStaff, captures: { en_cc4: $.data.id } }
            - { call: "POST /students/${s_cc}/programs", payload: { program_id: "${p_cc}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_cc: $.data.id, sp_cc_v: $.data.version } }
            - { call: "POST /student-programs/${sp_cc}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_cc_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_cc}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_cc}", captures: { app_cc: $.data.id } }
            - { call: "POST /applications/${app_cc}/submit", payload: {}, as: Student, as_user_id: "${s_cc}" }
            - { call: "POST /applications/${app_cc}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_cc}/decide", payload: { decision: "CONDITIONALLY_CLEARED" }, as: RegistrarStaff }
          trigger:
            - { call: "POST /enrollments/${en_cc4}/post-grade", payload: { grade: "B" }, as: RegistrarStaff, captures: { cc_en_st: $.data.status, cc_en_earned: $.data.credits_earned } }
            - { call: "GET /students/${s_cc}", as: RegistrarStaff, captures: { cc_earned: $.data.total_earned_credits, cc_gpa: $.data.institutional_gpa } }
            - { call: "GET /student-programs/${sp_cc}/audits", as: RegistrarStaff, captures: { cc_audit_sat: "$.data[0].overall_satisfied", cc_audit_applied: "$.data[0].total_credits_applied" } }
            - { call: "GET /applications/${app_cc}", as: RegistrarStaff, captures: { cc_app_st: $.data.status } }
            - { call: "GET /student-programs/${sp_cc}", as: RegistrarStaff, captures: { cc_sp_flag: $.data.latest_audit_satisfied } }
          assert:
            - "hop 1: Enrollment.${en_cc4}.status == COMPLETED, credits_earned == 3"
            - "hop 2: Student.${s_cc}.total_earned_credits == 12, institutional_gpa == 3.250 (39.00 / 12)"
            - "hop 3: CURRENT FINAL audit recomputed: total_credits_applied == 12, overall_satisfied == true, StudentProgram.latest_audit_satisfied == true"
            - "hop 4: GraduationApplication.${app_cc}.status auto-transitioned CONDITIONALLY_CLEARED -> CLEARED"

      - name: waiver_approval_two_hop_audit_cascade
        grounds:
          - state_machines.SubstitutionWaiver.ADVISOR_APPROVED_to_APPROVED
          - entities.StudentProgram.fields.latest_audit_satisfied
        distinguishing_aspect: |
          Depth-2 chain SubstitutionWaiver -> DegreeAudit -> StudentProgram triggered by
          registrar-decision APPROVE: approval mutates audit group results, and that audit
          mutation itself flips the student-program's clearance flag; different trigger and
          different propagation pattern from the post-grade cascade.
        test_recipe:
          setup:
            - "Program BS-WC [2024,2028) min_total_credits 3 min_gpa 2.0; group ELEC required 3 min_grade D eligible [HIST201]"
            - "Student completed PSY101 3cr A (not eligible for ELEC); declared; CURRENT FINAL audit unsatisfied (ELEC 0/3); latest_audit_satisfied false"
            - "SUBSTITUTION waiver mapping PSY101 into ELEC, student-requested, advisor-approved"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-WC", name: "BS WC", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wc: $.data.id } }
            - { call: "POST /programs/${p_wc}/requirement-groups", payload: { group_code: "ELEC", required_credits: 3, min_grade: "D", eligible_course_codes: ["HIST201"] }, as: RegistrarStaff, captures: { g_wc: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "PSY101", title: "Psych", credits: 3 }, as: RegistrarStaff, captures: { c_wc: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WC", legal_name: "Wes Case" }, as: RegistrarStaff, captures: { s_wc: $.data.id } }
            - { call: "POST /students/${s_wc}/enrollments", payload: { course_id: "${c_wc}", term: "2024-FA", grade: "A" }, as: RegistrarStaff, captures: { en_wc: $.data.id } }
            - { call: "POST /students/${s_wc}/programs", payload: { program_id: "${p_wc}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_wc: $.data.id, sp_wc_v: $.data.version } }
            - { call: "POST /student-programs/${sp_wc}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_wc_v}" }, as: RegistrarStaff, captures: { wc_pre_sat: $.data.overall_satisfied } }
            - { call: "POST /student-programs/${sp_wc}/waivers", payload: { requirement_group_id: "${g_wc}", kind: "SUBSTITUTION", enrollment_id: "${en_wc}", reason: "content overlap" }, as: Student, as_user_id: "${s_wc}", captures: { w_wc: $.data.id } }
            - { call: "POST /substitution-waivers/${w_wc}/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-2" }
          trigger:
            - { call: "POST /substitution-waivers/${w_wc}/registrar-decision", payload: { decision: "APPROVE" }, as: RegistrarStaff, captures: { wc_w_st: $.data.status } }
            - { call: "GET /student-programs/${sp_wc}/audits", as: RegistrarStaff, captures: { wc_post_sat: "$.data[0].overall_satisfied" } }
            - { call: "GET /student-programs/${sp_wc}", as: RegistrarStaff, captures: { wc_flag: $.data.latest_audit_satisfied } }
          assert:
            - "pre-approval: FINAL audit overall_satisfied == false (ELEC 0/3)"
            - "hop 1: SubstitutionWaiver.${w_wc}.status == APPROVED"
            - "hop 2 (caused by hop 1): CURRENT FINAL audit recomputed with the substitution applied — PSY101's 3 credits allocated to ELEC, overall_satisfied == true"
            - "hop 3 of pattern (bubble-up): StudentProgram.${sp_wc}.latest_audit_satisfied == true"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: begin_review_state_before_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_APPLICATION_INVALID_STATE]
          - errors[ERR_FINANCIAL_HOLD]
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: begin-review on a DRAFT application whose
          student has a financial hold violates priority 5 (not SUBMITTED) and priority 11
          (hold); priority 5 wins with ERR_APPLICATION_INVALID_STATE.
        test_recipe:
          setup:
            - "Program BS-PF [2024,2028); student with financial_hold=true; declared; application created and still DRAFT (submit would itself fail on the hold)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-PF", name: "BS PF", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_pf: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-PF", legal_name: "Penny Frost", financial_hold: true }, as: RegistrarStaff, captures: { s_pf: $.data.id } }
            - { call: "POST /students/${s_pf}/programs", payload: { program_id: "${p_pf}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_pf: $.data.id } }
            - { call: "POST /student-programs/${sp_pf}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_pf}", captures: { app_pf: $.data.id } }
          trigger:
            - { call: "POST /applications/${app_pf}/begin-review", payload: {}, as: RegistrarStaff, captures: { err_pf: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_INVALID_STATE (priority 5 state check fires before priority 11 financial-hold check)"
            - "error_id != ERR_FINANCIAL_HOLD"
            - "application remains DRAFT"

      - name: advisor_self_approval_before_referential
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_ENROLLMENT_NOT_COMPLETED]
        distinguishing_aspect: |
          Category pair business_safety-vs-business_referential: advisor-decision by the
          requesting advisor on a substitution whose enrollment is still IN_PROGRESS violates
          priority 7 (segregation of duties) and priority 10 (enrollment not COMPLETED);
          priority 7 wins with ERR_SELF_APPROVAL_FORBIDDEN. Different pair from
          state-vs-business_fiscal.
        test_recipe:
          setup:
            - "Program BS-SD with group ELEC; student with an IN_PROGRESS enrollment; SUBSTITUTION waiver requested BY ADVISOR adv-1 referencing the IN_PROGRESS enrollment"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-SD", name: "BS SD", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_sd: $.data.id } }
            - { call: "POST /programs/${p_sd}/requirement-groups", payload: { group_code: "ELEC", required_credits: 3, min_grade: "D", eligible_course_codes: ["HIST201"] }, as: RegistrarStaff, captures: { g_sd: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "PSY101", title: "Psych", credits: 3 }, as: RegistrarStaff, captures: { c_sd: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-SD", legal_name: "Sal Dodd" }, as: RegistrarStaff, captures: { s_sd: $.data.id } }
            - { call: "POST /students/${s_sd}/enrollments", payload: { course_id: "${c_sd}", term: "2026-SP" }, as: RegistrarStaff, captures: { en_sd: $.data.id } }
            - { call: "POST /students/${s_sd}/programs", payload: { program_id: "${p_sd}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_sd: $.data.id } }
            - { call: "POST /student-programs/${sp_sd}/waivers", payload: { requirement_group_id: "${g_sd}", kind: "SUBSTITUTION", enrollment_id: "${en_sd}", reason: "advisor initiated" }, as: Advisor, as_user_id: "adv-1", captures: { w_sd: $.data.id } }
          trigger:
            - { call: "POST /substitution-waivers/${w_sd}/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-1", captures: { err_sd: $.data.error_id } }
          assert:
            - "error_id == ERR_SELF_APPROVAL_FORBIDDEN (priority 7 segregation-of-duties fires before priority 10 enrollment-completion check)"
            - "error_id != ERR_ENROLLMENT_NOT_COMPLETED"
            - "waiver remains SUBMITTED"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: honors_threshold_exact_gpa_boundary
        grounds:
          - calculations.honors_designation
          - entities.GraduationApplication.fields.honors_designation
        distinguishing_aspect: |
          Boundary metric is GPA: basis_gpa exactly 3.750 meets magna_threshold with >=
          (inclusive), earning MAGNA_CUM_LAUDE — not CUM_LAUDE — at the confer endpoint.
        test_recipe:
          setup:
            - "Program BS-HB [2024,2028) min_total_credits 12 min_gpa 2.0 no groups; honors policy INSTITUTIONAL residency 10 thresholds 3.5/3.75/3.9 years [2024,2027]"
            - "Student with exactly 12 institutional credits: 9cr A + 3cr B -> 45.00/12 = 3.750; full pipeline to CLEARED"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-HB", name: "BS HB", degree_type: "BACHELOR", min_total_credits: 12, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_hb: $.data.id } }
            - { call: "POST /programs/${p_hb}/honors-policies", payload: { honors_gpa_basis: "INSTITUTIONAL", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2024, effective_last_year: 2027, residency_min_credits: 10 }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "HB3", title: "HB", credits: 3 }, as: RegistrarStaff, captures: { c_hb: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-HB", legal_name: "Hank Bounds" }, as: RegistrarStaff, captures: { s_hb: $.data.id } }
            - { call: "POST /students/${s_hb}/enrollments", payload: { course_id: "${c_hb}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_hb}/enrollments", payload: { course_id: "${c_hb}", term: "2025-SP", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_hb}/enrollments", payload: { course_id: "${c_hb}", term: "2025-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_hb}/enrollments", payload: { course_id: "${c_hb}", term: "2026-SP", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_hb}/programs", payload: { program_id: "${p_hb}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_hb: $.data.id, sp_hb_v: $.data.version } }
            - { call: "POST /student-programs/${sp_hb}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_hb_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_hb}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_hb}", captures: { app_hb: $.data.id } }
            - { call: "POST /applications/${app_hb}/submit", payload: {}, as: Student, as_user_id: "${s_hb}" }
            - { call: "POST /applications/${app_hb}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_hb}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_hb}/confer", payload: {}, as: RegistrarStaff, captures: { hb_honors: $.data.honors_designation } }
            - { call: "GET /students/${s_hb}", as: RegistrarStaff, captures: { hb_gpa: $.data.institutional_gpa } }
          assert:
            - "Student.${s_hb}.institutional_gpa == 3.750 (exactly the magna threshold)"
            - "GraduationApplication.${app_hb}.honors_designation == MAGNA_CUM_LAUDE (>= is inclusive at 3.750)"
            - "honors_designation != CUM_LAUDE and != SUMMA_CUM_LAUDE"

      - name: total_credits_exact_boundary
        grounds:
          - calculations.degree_audit_progress
          - entities.DegreeAudit.fields.outstanding_credits
        distinguishing_aspect: |
          Boundary metric is the credit count: total_credits_applied exactly equal to
          min_total_credits (9 == 9) yields outstanding_credits == 0 and satisfied, via the
          audits endpoint — a different metric and endpoint from the GPA/honors boundary.
        test_recipe:
          setup:
            - "Program BS-TC [2024,2028) min_total_credits 9 min_gpa 2.0 no groups; student with exactly 9 completed credits (3x3cr A)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-TC", name: "BS TC", degree_type: "BACHELOR", min_total_credits: 9, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_tc: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "TC3", title: "TC", credits: 3 }, as: RegistrarStaff, captures: { c_tc: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-TC", legal_name: "Tess Count" }, as: RegistrarStaff, captures: { s_tc: $.data.id } }
            - { call: "POST /students/${s_tc}/enrollments", payload: { course_id: "${c_tc}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_tc}/enrollments", payload: { course_id: "${c_tc}", term: "2025-SP", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_tc}/enrollments", payload: { course_id: "${c_tc}", term: "2025-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_tc}/programs", payload: { program_id: "${p_tc}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_tc: $.data.id, sp_tc_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_tc}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_tc_v}" }, as: RegistrarStaff, captures: { tc_applied: $.data.total_credits_applied, tc_out: $.data.outstanding_credits, tc_sat: $.data.overall_satisfied } }
          assert:
            - "total_credits_applied == 9 (exactly min_total_credits)"
            - "outstanding_credits == 0 (zero-quantity boundary; max(0, 9-9))"
            - "overall_satisfied == true (>= is inclusive at 9 == 9)"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: begin_review_requires_current_final_audit
        grounds:
          - state_machines.GraduationApplication.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_FINAL_AUDIT_REQUIRED]
        distinguishing_aspect: |
          Entity pair DegreeAudit -> GraduationApplication: begin-review is gated on the
          existence of a CURRENT FINAL audit for the student-program; without one the
          transition is rejected even though the application itself is in a valid from-state.
        test_recipe:
          setup:
            - "Program BS-FR [2024,2028) min_total_credits 3; student declared; application created and SUBMITTED; NO audit of any kind has ever been run"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-FR", name: "BS FR", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_fr: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-FR", legal_name: "Fran Frost" }, as: RegistrarStaff, captures: { s_fr: $.data.id } }
            - { call: "POST /students/${s_fr}/programs", payload: { program_id: "${p_fr}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_fr: $.data.id } }
            - { call: "POST /student-programs/${sp_fr}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_fr}", captures: { app_fr: $.data.id } }
            - { call: "POST /applications/${app_fr}/submit", payload: {}, as: Student, as_user_id: "${s_fr}" }
          trigger:
            - { call: "POST /applications/${app_fr}/begin-review", payload: {}, as: RegistrarStaff, captures: { err_fr: $.data.error_id } }
          assert:
            - "error_id == ERR_FINAL_AUDIT_REQUIRED (DegreeAudit state gates the GraduationApplication transition)"
            - "application remains SUBMITTED"

      - name: substitution_decision_requires_completed_enrollment
        grounds:
          - state_machines.SubstitutionWaiver.SUBMITTED_to_ADVISOR_APPROVED
          - errors[ERR_ENROLLMENT_NOT_COMPLETED]
        distinguishing_aspect: |
          Entity pair Enrollment -> SubstitutionWaiver: a substitution decision is gated on the
          referenced enrollment being COMPLETED; an IN_PROGRESS enrollment blocks the advisor
          approval even though the waiver itself is in a valid from-state and the decider is
          not the requester. Different entity pair from DegreeAudit -> GraduationApplication.
        test_recipe:
          setup:
            - "Program BS-EC with group ELEC; student with an IN_PROGRESS enrollment; SUBSTITUTION waiver requested by the STUDENT referencing that enrollment"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-EC", name: "BS EC", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_ec: $.data.id } }
            - { call: "POST /programs/${p_ec}/requirement-groups", payload: { group_code: "ELEC", required_credits: 3, min_grade: "D", eligible_course_codes: ["HIST201"] }, as: RegistrarStaff, captures: { g_ec: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "PSY101", title: "Psych", credits: 3 }, as: RegistrarStaff, captures: { c_ec: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-EC", legal_name: "Eli Cross" }, as: RegistrarStaff, captures: { s_ec: $.data.id } }
            - { call: "POST /students/${s_ec}/enrollments", payload: { course_id: "${c_ec}", term: "2026-SP" }, as: RegistrarStaff, captures: { en_ec: $.data.id } }
            - { call: "POST /students/${s_ec}/programs", payload: { program_id: "${p_ec}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_ec: $.data.id } }
            - { call: "POST /student-programs/${sp_ec}/waivers", payload: { requirement_group_id: "${g_ec}", kind: "SUBSTITUTION", enrollment_id: "${en_ec}", reason: "planned substitution" }, as: Student, as_user_id: "${s_ec}", captures: { w_ec: $.data.id } }
          trigger:
            - { call: "POST /substitution-waivers/${w_ec}/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-9", captures: { err_ec: $.data.error_id } }
          assert:
            - "error_id == ERR_ENROLLMENT_NOT_COMPLETED (Enrollment state gates the waiver transition)"
            - "waiver remains SUBMITTED"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: program_catalog_halfopen_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_CATALOG_RANGE_OVERLAP]
          - entities.Program.fields.catalog_year_end
        distinguishing_aspect: |
          Resource Program with HALF-OPEN interval semantics [start, end): adjacency
          (end == start) is allowed, any strict interior overlap per program_code is rejected.
        test_recipe:
          setup:
            - "Two existing BS-OV versions: [2024,2027) and [2027,2030) — adjacency at 2027 accepted"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-OV", name: "V1", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2027 }, as: RegistrarStaff, captures: { p_ov1: $.data.id } }
            - { call: "POST /programs", payload: { program_code: "BS-OV", name: "V2", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2027, catalog_year_end: 2030 }, as: RegistrarStaff, captures: { p_ov2: $.data.id } }
          trigger:
            - { call: "POST /programs", payload: { program_code: "BS-OV", name: "V3", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2026, catalog_year_end: 2029 }, as: RegistrarStaff, captures: { err_ov: $.data.error_id } }
          assert:
            - "[2027,2030) creation succeeded: end==start adjacency is NOT an overlap under half-open semantics"
            - "[2026,2029) rejected with ERR_CATALOG_RANGE_OVERLAP (overlaps [2024,2027) on [2026,2027) and [2027,2030) on [2027,2029))"

      - name: honors_policy_closed_range_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_POLICY_RANGE_OVERLAP]
          - entities.HonorsPolicy.fields.effective_last_year
        distinguishing_aspect: |
          Resource HonorsPolicy with CLOSED inclusive interval semantics [first, last]: a shared
          boundary year IS an overlap (rejected), unlike the Program half-open rule where
          adjacency is allowed — different interval semantics on a different resource.
        test_recipe:
          setup:
            - "Program BS-POL [2024,2030); existing honors policies [2024,2026] and [2027,2030] — year-adjacent ranges accepted because no year is shared"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-POL", name: "BS POL", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2030 }, as: RegistrarStaff, captures: { p_pol: $.data.id } }
            - { call: "POST /programs/${p_pol}/honors-policies", payload: { honors_gpa_basis: "INSTITUTIONAL", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2024, effective_last_year: 2026, residency_min_credits: 10 }, as: RegistrarStaff, captures: { hp_1: $.data.id } }
            - { call: "POST /programs/${p_pol}/honors-policies", payload: { honors_gpa_basis: "CUMULATIVE", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2027, effective_last_year: 2030, residency_min_credits: 10 }, as: RegistrarStaff, captures: { hp_2: $.data.id } }
          trigger:
            - { call: "POST /programs/${p_pol}/honors-policies", payload: { honors_gpa_basis: "INSTITUTIONAL", cum_threshold: 3.4, magna_threshold: 3.7, summa_threshold: 3.85, effective_first_year: 2026, effective_last_year: 2028, residency_min_credits: 10 }, as: RegistrarStaff, captures: { err_pol: $.data.error_id } }
          assert:
            - "[2027,2030] after [2024,2026] succeeded: adjacent-but-disjoint years are allowed"
            - "[2026,2028] rejected with ERR_POLICY_RANGE_OVERLAP: year 2026 belongs to [2024,2026] under closed semantics (contrast: half-open catalog ranges would allow end==start adjacency)"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: grade_change_credit_ledger_invariant
        grounds:
          - state_machines.Enrollment.COMPLETED_to_COMPLETED
          - calculations.grade_point_and_credit_award
          - entities.Student.fields.total_earned_credits
        distinguishing_aspect: |
          Conserved quantity is the earned-credit ledger: grade change A->F paired with its
          compensating F->A leaves Student.total_earned_credits == sum(credits_earned over
          COMPLETED enrollments with grade in {A,B,C,D}) unchanged at 3 with zero drift.
        test_recipe:
          setup:
            - "Student with a single 3cr COMPLETED enrollment graded A (earned 3, institutional_gpa 4.000)"
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "GC3", title: "GC", credits: 3 }, as: RegistrarStaff, captures: { c_gc: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-GC", legal_name: "Gus Cole" }, as: RegistrarStaff, captures: { s_gc: $.data.id } }
            - { call: "POST /students/${s_gc}/enrollments", payload: { course_id: "${c_gc}", term: "2024-FA", grade: "A" }, as: RegistrarStaff, captures: { en_gc: $.data.id } }
            - { call: "GET /students/${s_gc}", as: RegistrarStaff, captures: { gc_earned0: $.data.total_earned_credits, gc_gpa0: $.data.institutional_gpa } }
          trigger:
            - { call: "POST /enrollments/${en_gc}/grade-changes", payload: { new_grade: "F", reason: "academic integrity" }, as: RegistrarStaff, captures: { gc_st1: $.data.status, gc_earned1: $.data.credits_earned } }
            - { call: "GET /students/${s_gc}", as: RegistrarStaff, captures: { gc_tot1: $.data.total_earned_credits, gc_gpa1: $.data.institutional_gpa } }
            - { call: "POST /enrollments/${en_gc}/grade-changes", payload: { new_grade: "A", reason: "integrity finding reversed" }, as: RegistrarStaff, captures: { gc_st2: $.data.status, gc_earned2: $.data.credits_earned } }
            - { call: "GET /students/${s_gc}", as: RegistrarStaff, captures: { gc_tot2: $.data.total_earned_credits, gc_gpa2: $.data.institutional_gpa } }
          assert:
            - "initial: total_earned_credits == 3, institutional_gpa == 4.000"
            - "after A->F: enrollment credits_earned == 0, total_earned_credits == 0, institutional_gpa == 0.000 (F keeps 3 credits in the GPA denominator with 0 points)"
            - "after compensating F->A: total_earned_credits == 3, institutional_gpa == 4.000 — exactly the initial values (invariant: Student.total_earned_credits == sum of credits_earned over COMPLETED enrollments with grade in {A,B,C,D}, no drift)"

      - name: diploma_revoke_reissue_cardinality_invariant
        grounds:
          - state_machines.Diploma.ISSUED_to_REVOKED
          - entities.Diploma.fields.reissue_of_diploma_id
        distinguishing_aspect: |
          Conserved quantity is active-diploma cardinality per conferred application: revoke
          paired with its compensating reissue leaves count(diplomas with status in
          {PENDING, ISSUED}) == 1, with the new diploma linked via reissue_of_diploma_id;
          a different conserved quantity from the credit ledger.
        test_recipe:
          setup:
            - "Student fully conferred under BS-DP (min_total 3, policy INSTITUTIONAL residency 3 thresholds 3.5/3.75/3.9 [2024,2027]); diploma D1 exists PENDING with printed_name Dana Old Name, honors SUMMA_CUM_LAUDE (GPA 4.000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-DP", name: "BS DP", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_dp: $.data.id } }
            - { call: "POST /programs/${p_dp}/honors-policies", payload: { honors_gpa_basis: "INSTITUTIONAL", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2024, effective_last_year: 2027, residency_min_credits: 3 }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "DP3", title: "DP", credits: 3 }, as: RegistrarStaff, captures: { c_dp: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-DP", legal_name: "Dana Old Name" }, as: RegistrarStaff, captures: { s_dp: $.data.id } }
            - { call: "POST /students/${s_dp}/enrollments", payload: { course_id: "${c_dp}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_dp}/programs", payload: { program_id: "${p_dp}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_dp: $.data.id, sp_dp_v: $.data.version } }
            - { call: "POST /student-programs/${sp_dp}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_dp_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_dp}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15", diploma_name: "Dana Old Name" }, as: Student, as_user_id: "${s_dp}", captures: { app_dp: $.data.id } }
            - { call: "POST /applications/${app_dp}/submit", payload: {}, as: Student, as_user_id: "${s_dp}" }
            - { call: "POST /applications/${app_dp}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_dp}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff }
            - { call: "POST /applications/${app_dp}/confer", payload: {}, as: RegistrarStaff }
            - { call: "GET /diplomas", as: RegistrarStaff, captures: { d1: "$.data[0].id" } }
            - { call: "POST /diplomas/${d1}/issue", payload: {}, as: RegistrarStaff }
          trigger:
            - { call: "POST /diplomas/${d1}/revoke", payload: { reason: "name misspelled" }, as: RegistrarStaff, captures: { d1_st: $.data.status } }
            - { call: "POST /applications/${app_dp}/diplomas/reissue", payload: { printed_name: "Dana Corrected Name", reason: "post-graduation name correction" }, as: RegistrarStaff, captures: { d2: $.data.id, d2_of: $.data.reissue_of_diploma_id, d2_name: $.data.printed_name, d2_st: $.data.status, d2_honors: $.data.honors_designation } }
          assert:
            - "D1 after revoke: status == REVOKED (active count dips to 0)"
            - "D2 after reissue: status == PENDING, reissue_of_diploma_id == ${d1}, printed_name == Dana Corrected Name"
            - "invariant restored: count(diplomas of ${app_dp} with status in {PENDING, ISSUED}) == 1 (D2 only; D1 REVOKED)"
            - "D2.honors_designation == SUMMA_CUM_LAUDE (recomputed from current GPAs; unchanged here)"
