              payload: {}
              as: ProgramAdmin
              captures: { committed_after_award: "$.data.committed_crew_hours" }
            - call: "GET /fire-district/parcels/${p1}"
              payload: {}
              as: ProgramAdmin
              captures: { status_after_award: "$.data.compliance_status", open_after_award: "$.data.open_violation_count" }
          trigger:
            - call: "POST /fire-district/abatement-orders/${o1}/cancel"
              payload: { reason: "owner completed the work voluntarily" }
              as: FireMarshal
          assert:
            - "${committed_initial} == 0, ${committed_after_award} == 12.5, ${status_after_award} == \"ABATEMENT_PENDING\" and ${open_after_award} == 1 before the trigger"
            - "Contractor.${c1}.committed_crew_hours == 0 after the trigger, exactly the pre-award value"
            - "Contractor.${c1}.completed_crew_hours == 0: cancellation must not touch the completed ledger"
            - "AbatementOrder.${o1}.status == \"CANCELLED\" with cancel_reason == \"owner completed the work voluntarily\" and actual_crew_hours still null"
            - "ViolationNotice.${n1}.status == \"OVERDUE\", NOT \"CLEARED\" and NOT \"ABATEMENT_AUTHORIZED\", and cleared_at_utc is still null"
            - "Parcel.${p1}.compliance_status == \"NON_COMPLIANT\", NOT \"COMPLIANT\", and open_violation_count is still 1"
            - "AbatementOrder.${o1}.total_recoverable_cents is still null: no invoice was ever produced, so no money is left behind"
            - "A fresh authorize-abatement on ${n1} now succeeds, because no order on that notice is in {AUTHORIZED, AWARDED, WORK_COMPLETE, INVOICED} any more"
            - "Awarding that fresh order to ${c1} for 12.5 crew hours and cancelling it again returns committed_crew_hours to 0 once more: two round trips leave no drift"

      - name: support_program_budget_restored_on_enrollment_cancel
        conserved_quantity: "SupportProgram.budget_remaining_cents"
        grounds:
          - state_machines.SupportEnrollment.APPROVED_to_CANCELLED
          - state_machines.SupportEnrollment.WAITLISTED_to_CANCELLED
          - entities.SupportProgram.fields.budget_remaining_cents
          - entities.SupportProgram.fields.reserved_slots
          - entities.SupportEnrollment.fields.reserved_amount_cents
          - calculations.cost_share_award
          - endpoints."POST /fire-district/support-enrollments/{enrollment_id}/cancel"
        distinguishing_aspect: |
          The conserved quantity is money on SupportProgram, and the compensation is
          STATE-DEPENDENT in a way the crew-hour instance is not: cancelling an APPROVED
          enrollment must credit back exactly its reserved_amount_cents and free a slot, while
          cancelling a WAITLISTED enrollment must move neither budget nor slots because nothing
          was ever reserved. The instance closes the loop by showing the restored budget is
          genuinely spendable: a cycle advance then promotes the waitlisted row and re-debits a
          different amount (60000, not 126500).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle."
            - "One COST_SHARE_GRANT program with budget_total_cents 500000 and capacity_slots 1, open 2026-08-01 to 2026-12-01."
            - "Parcel pb (HIGH, owner_hardship_flag true) enrolls first with vendor_invoice_cents 191667 and is APPROVED for 126500."
            - "Parcel pc (HIGH, no hardship) enrolls second with vendor_invoice_cents 100000 and is WAITLISTED at position 1 because capacity_slots is already full."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/support-programs"
              payload: { cycle_id: "${cyc}", program_type: "COST_SHARE_GRANT", budget_total_cents: 500000, capacity_slots: 1, service_window_start_utc: "2026-08-01T00:00:00Z", service_window_end_utc: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v1: "$.data.version", budget_initial: "$.data.budget_remaining_cents" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-9301", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED", owner_hardship_flag: true }
              as: ProgramAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-9302", owner_name: "Cara Diaz", owner_email: "cara@example.com", situs_address: "16 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED", owner_hardship_flag: false }
              as: ProgramAdmin
              captures: { pc: "$.data.id" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pb}", vendor_invoice_cents: 191667, expected_program_version: "${prog_v1}" }
              as: ProgramAdmin
              captures: { eb: "$.data.id", eb_status: "$.data.status", eb_reserved: "$.data.reserved_amount_cents" }
            - call: "GET /fire-district/support-programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v2: "$.data.version", budget_after_eb: "$.data.budget_remaining_cents", slots_after_eb: "$.data.reserved_slots" }
            - call: "POST /fire-district/support-enrollments"
              payload: { support_program_id: "${prog}", parcel_id: "${pc}", vendor_invoice_cents: 100000, expected_program_version: "${prog_v2}" }
              as: ProgramAdmin
              captures: { ec: "$.data.id", ec_status: "$.data.status", ec_reserved: "$.data.reserved_amount_cents", ec_pos: "$.data.waitlist_position" }
          trigger:
            - call: "POST /fire-district/support-enrollments/${eb}/cancel"
              payload: { reason: "owner withdrew the cost-share request" }
              as: PropertyOwner
              as_user_id: "${pb}"
          assert:
            - "${budget_initial} == 500000, ${eb_status} == \"APPROVED\", ${eb_reserved} == 126500, ${budget_after_eb} == 373500 and ${slots_after_eb} == 1 before the trigger"
            - "${ec_status} == \"WAITLISTED\", ${ec_reserved} == 0 and ${ec_pos} == 1: the second enrollment reserved nothing"
            - "SupportProgram.${prog}.budget_remaining_cents == 500000 after the trigger, exactly the pre-enrollment value"
            - "SupportProgram.${prog}.reserved_slots == 0 and SupportEnrollment.${eb}.status == \"CANCELLED\" with reserved_amount_cents == 0"
            - "SupportEnrollment.${eb}.award_cents is still 126500: the award computation is preserved for audit while the reservation is released"
            - "${ec} is NOT promoted by the cancel itself: SupportEnrollment.${ec}.status is still \"WAITLISTED\" with waitlist_position 1"
            - "Cancelling ${ec} as well leaves budget_remaining_cents at 500000 and reserved_slots at 0, because a WAITLISTED row holds no reservation"
            - "Instead advancing the cycle after the trigger promotes ${ec} to APPROVED with reserved_amount_cents 60000, leaving budget_remaining_cents 440000 and reserved_slots 1 — the restored budget is genuinely spendable and the re-debit is a different amount than the one released"
            - "A second cancel of ${eb} is rejected because CANCELLED is terminal, so the credit cannot be applied twice"
