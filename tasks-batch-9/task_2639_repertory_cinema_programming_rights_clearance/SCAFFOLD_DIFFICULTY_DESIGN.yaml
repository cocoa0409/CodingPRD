              as: TechnicalManager
              captures: { a1_id: $.data.id }
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-90002", ingest_window_start_at: "2026-08-05T06:00:00Z", ingest_window_end_at: "2026-08-06T06:00:00Z" }
              as: TechnicalManager
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-90003", ingest_window_start_at: "2026-08-05T12:00:00Z", ingest_window_end_at: "2026-08-06T12:00:00Z" }
