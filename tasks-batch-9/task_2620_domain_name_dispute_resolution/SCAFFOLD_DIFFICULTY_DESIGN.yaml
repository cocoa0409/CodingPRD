              as: ProviderAdmin
              captures: { pan_pres_id: "$.data.id" }
            - call: "POST /udrp/panelists"
              payload: { full_name: "Luca Rossi", nationality_code: "IT", roster_admitted_at: "2020-03-02T00:00:00Z", firm_name: "Rossi e Associati", specializations: ["DOMAIN_NAMES"], max_overlapping_engagements: 5 }
              as: ProviderAdmin
              captures: { pan_co1_id: "$.data.id" }
            - call: "POST /udrp/panelists"
              payload: { full_name: "Elena Ruiz", nationality_code: "ES", roster_admitted_at: "2021-07-09T00:00:00Z", firm_name: "Ruiz IP", specializations: ["TRADEMARK"], max_overlapping_engagements: 5 }
              as: ProviderAdmin
              captures: { pan_co2_id: "$.data.id" }
            - call: "GET /udrp/cases/${case_id}"
