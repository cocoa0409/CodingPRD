      - name: err_segregation_of_duties_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: segregation_of_duties_beats_remittance_imbalance
