      - name: voiding_a_contract_voids_its_pending_items_but_leaves_the_verified_one_alone
        claim_type: conditional_cascade
        grounds:
          - state_machines.Contract.ISSUED->VOID
          - state_machines.CredentialItem.PENDING->VOIDED
          - calculations.credential_packet_composition
        distinguishing_aspect: >
          The void cascade is conditional on child status: it sweeps only items in {PENDING, SUBMITTED,
          REJECTED}. The already VERIFIED state licence survives untouched with its verified_at intact,
