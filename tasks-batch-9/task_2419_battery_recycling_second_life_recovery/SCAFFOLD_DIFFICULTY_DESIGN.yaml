      - name: line_maintenance_safety_precedes_campaign_window_closed
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_LINE_NOT_AVAILABLE]
          - errors[ERR_CAMPAIGN_WINDOW_CLOSED]
          - state_machines.ProcessingCampaign.SCHEDULED_to_RUNNING
        distinguishing_aspect: |
          Priority pair 9 vs 10 - physical safety versus interval geometry, both HTTP 422 so only
          the error_id discriminates: the campaign is started on a line commissioned with status
          MAINTENANCE at an instant already past window_end, and the response must be
          ERR_LINE_NOT_AVAILABLE, never ERR_CAMPAIGN_WINDOW_CLOSED.
