      - name: version_increments_on_every_write_to_segment
        claim_type: optimistic_concurrency
        grounds:
          - entities.Segment.fields.status
          - endpoints[POST /cdp/segments/{segmentId}/submit-for-review]
          - endpoints[POST /cdp/segments/{segmentId}/governance-decision]
        distinguishing_aspect: "The OCC counter advances on every accepted write — including the REJECT that walks the segment BACKWARDS to DRAFT — while refused writes leave it alone, so version counts accepted mutations rather than forward progress."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Segment on postal_code EQ 10001, taken through submit, REJECT, submit again and APPROVE, with the version read after each accepted write."
