      - 'after create: open_remediation_count == 1'
      - 'after the AWAITING_VERIFICATION->IN_PROGRESS reject cycle: still == 1 (no drift from the loop)'
      - 'after WAIVED: == 0'
  - name: cascading_side_effects_covered_by_difficulty
    claim_type: cascade_chain
    grounds:
    - state_machines.Case.CLOSED_to_FIELDWORK
    - state_machines.PreservationNotice.ACKNOWLEDGED_to_RELEASED
    excluded_because:
      difficulty_instance: case_reopen_depth3_cascade
      rationale: N-level cascade ordering and compensation are asserted end-to-end by the depth-3 reopen instance (and notice_release_depth2_cascade for the second trigger).
  - name: dual_variant_layer_covered_by_difficulty
    claim_type: dual_variant_calculation
    grounds:
    - calculations.substantiation_score
    - calculations.discipline_severity_index
    excluded_because:
      difficulty_instance: substantiation_provisional_vs_final_input_sets
      rationale: Both variant pairs exercised with literal expected values in §1.8.
  - name: occ_layer_covered_by_error_corners
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[plan-create-stale-case]
    - concurrency_rules[report-create-stale-case]
    - concurrency_rules[disclosure-create-stale-case]
    excluded_because:
      difficulty_instance: plan_rejection_supersede_loop
      rationale: Happy-path OCC (fresh version accepted, version bumped on success) is exercised in the plan supersede loop; stale-version rejection for all three write endpoints is covered by the §1.9
        errors section instances above.
