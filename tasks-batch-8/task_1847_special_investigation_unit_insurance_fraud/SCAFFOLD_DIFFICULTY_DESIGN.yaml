        distinguishing_aspect: |
          Pair (state, business_safety): evidence admit on a case already
          DECISION_PENDING violates state precondition (case not in
          UNDER_INVESTIGATION — ERR_INVALID_STATE / ERR_CASE_NOT_IN_REQUIRED_STATE)
          AND would also violate segregation-of-duties if actor equals
          submitter; the priority-5 state error wins over priority-7 SoD.
        test_recipe:
          setup:
            - "Case K in DECISION_PENDING"
            - "Evidence E in UNDER_REVIEW submitted by investigator I1"
            - "Manager attempts admit using X-User-ID equal to I1's user id (SoD violation)"
