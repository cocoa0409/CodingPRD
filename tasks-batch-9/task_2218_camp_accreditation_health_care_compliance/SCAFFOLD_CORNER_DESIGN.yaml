            - call: "POST /accreditation/deficiencies/${def_id}/correction-plan"
              payload: { correction_plan_text: "second plan - replaces the first before review" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/deficiencies/${def_id}/correction-plan"
              payload: { correction_plan_text: "third plan - replaces the second before review" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/deficiencies/${def_id}/correction-plan"
