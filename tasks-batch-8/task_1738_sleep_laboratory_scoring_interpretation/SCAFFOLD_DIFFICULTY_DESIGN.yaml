            - { call: "POST /scoring-tasks", payload: { study_id: "${st2}", scorer_id: "${s2}", assignment_kind: "PRIMARY" }, as: LabDirector, captures: { tk3: $.data.id } }
            - { call: "POST /scoring-tasks/${tk3}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            # --- ST4: primary S1 + rescore S2 (second non-concordant case) ---
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o4: $.data.id, o4_v: $.data.version } }
            - { call: "POST /referral-orders/${o4}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-4", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o4_v}" }, as: Scheduler, captures: { a4: $.data.id } }
            - { call: "POST /authorizations/${a4}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o4}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st4: $.data.id } }
