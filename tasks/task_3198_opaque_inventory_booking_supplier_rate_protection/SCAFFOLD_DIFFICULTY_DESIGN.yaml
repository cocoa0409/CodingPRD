  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_fraud_gate_on_evaluate
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
          - errors.ERR_CUSTOMER_BLOCKED
        distinguishing_aspect: |
          Pair state-vs-business_safety: evaluating a bid that is already
          WITHDRAWN while the customer is BLOCKED must return ERR_INVALID_STATE
          (priority 5), not ERR_CUSTOMER_BLOCKED (priority 7).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; supplier/property/zone/window NB8 base exists."
            - "Customer C has a bid B created and then WITHDRAWN by the customer."
            - "C is then driven to BLOCKED via two upheld manual flags of 30 each (score 60 >= 50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB8", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB8", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c9@x.com", full_name: "Cust Nine" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB8", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /opaque/fraud-flags/${f1}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { f2: $.data.id }
            - call: "POST /opaque/fraud-flags/${f2}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "GET /opaque/customers/${cust_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "err != ERR_CUSTOMER_BLOCKED"

      - name: business_temporal_vs_business_constraint_on_bid_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_INVALID_DATE_RANGE
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Pair business_temporal-vs-business_constraint: creating a BID-mode bid
          with check_out_date == check_in_date AND no bid_price_cents must return
          ERR_INVALID_DATE_RANGE (priority 8), not ERR_INVALID_REQUEST (priority 9).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer C exists; zone NB9 exists (bid never reaches the candidate check because priority 8 fires first)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c10@x.com", full_name: "Cust Ten" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB9", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
          trigger:
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB9", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-02T00:00:00Z", offer_mode: "BID" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_DATE_RANGE"
            - "err != ERR_INVALID_REQUEST"
            - "GET /opaque/opaque-bids?customer_id=${cust_id} returns 0 rows"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: different metrics, different endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rooms_sold_equal_rooms_allocated_exhausts_window
        grounds:
          - state_machines.RateWindow.OPEN_to_EXHAUSTED
          - entities.RateWindow.fields.rooms_allocated
          - entities.RateWindow.fields.rooms_sold
        distinguishing_aspect: |
          Numeric threshold boundary on rooms: the window exhausts exactly when
          rooms_sold == rooms_allocated (>= semantics at equality, not >), reached
          through the evaluate endpoint with rooms_allocated == 1.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; NB10 base with window rooms_allocated 1, rate 15000, Oct 1-5; customer C with accepted FIXED bid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB10", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB10", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 1 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /opaque/customers"
              payload: { email: "c11@x.com", full_name: "Cust Eleven" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB10", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
          assert:
            - "OpaqueBid.${bid_id}.status == ACCEPTED"
            - "RateWindow.${win_id}.rooms_sold == 1 and status == EXHAUSTED"
            - "a second FIXED bid evaluated afterwards transitions to REJECTED (rooms_sold < rooms_allocated fails at equality)"

      - name: empty_booking_ids_blocks_batch_approval
        grounds:
          - validations[priority=12]
          - errors.ERR_BATCH_EMPTY
          - endpoints.POST_/opaque/settlement-batches/{batchId}/approve
        distinguishing_aspect: |
          Empty-collection boundary on booking_ids: a batch whose selection window
          contains zero eligible bookings cannot be approved — the empty set, not
          a numeric threshold, is the boundary, reached through the approve endpoint.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Supplier S exists but has NO bookings in November."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/settlement-batches"
              payload: { supplier_id: "${sup_id}", period_start_date: "2026-11-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z" }
              as: FinanceOps
              captures: { batch_id: $.data.id, batch_v: $.data.version }
          trigger:
            - call: "POST /opaque/settlement-batches/${batch_id}/approve"
              payload: { expected_settlement_batch_version: "${batch_v}" }
              as: FinanceOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_BATCH_EMPTY"
            - "SettlementBatch.${batch_id}.status remains DRAFT"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: different entity pairs.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_evaluation_depends_on_supplier_status
        grounds:
          - state_machines.OpaqueBid.PENDING_to_ACCEPTED
          - entities.Supplier.fields.status
          - calculations.opaque_fill_selector
        distinguishing_aspect: |
          Pair OpaqueBid→Supplier: a bid's evaluation depends on the candidate
          property's SUPPLIER being ACTIVE; with the only supplier SUSPENDED the
          candidate set is empty and the bid must be REJECTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; NB11 base with one supplier S (ACTIVE at bid creation), property, window."
            - "Customer C has a PENDING FIXED bid; S is then suspended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB11", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB11", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c12@x.com", full_name: "Cust Twelve" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB11", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/suppliers/${sup_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
          assert:
            - "OpaqueBid.${bid_id}.status == REJECTED (supplier not ACTIVE ⇒ no eligible candidate)"
            - "no Booking exists for customer ${cust_id}"

      - name: booking_service_failure_depends_on_complaint_resolution
        grounds:
          - state_machines.Booking.transitions
          - entities.ComplaintCase.fields.resolution
          - entities.ComplaintCase.fields.status
        distinguishing_aspect: |
          Pair Booking→ComplaintCase: mark-service-failure is valid only when the
          booking's complaint case is RESOLVED with resolution FULL_REFUND and
          category SERVICE_FAILURE — a case in UNDER_REVIEW blocks the transition
          even though the booking itself is CONFIRMED.
        test_recipe:
