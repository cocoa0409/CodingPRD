      - name: tool_life_projection_rated_derated_versus_observed
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: tool_life_budget_rated_derated_vs_conservative_observed
          rationale: >
            The §1.8 instance already drives both variants of tool_life_projection over the same die —
            the rated/derated budget after regrinds and the conservative observed-rate variant — and
            compares the two projected_remaining_pieces values against the exhaustion gate, which is
            exactly the Variant Divergence and Constants Applied claim this corner would make.

      - name: sampling_severity_flips_the_verdict_on_identical_failures
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: sampling_plan_normal_accepts_where_tightened_rejects
          rationale: >
            The §1.8 instance runs two lots of the same part and heat through NORMAL and TIGHTENED
            inspection with the same measured failure count and shows the ACCEPT/REJECT divergence, the
            TIGHTENED_SQRT_FACTOR sample size and the frozen inspection_severity, covering this corner's
            variant-selection claim end to end.

      - name: acceptance_number_boundary_at_twenty_sampled_pieces
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: sampling_acceptance_number_flips_at_sample_size_twenty
          rationale: >
            ACCEPTANCE_SAMPLE_THRESHOLD is probed at sample_size 19 versus 20 in §1.8 with lots sized so
            ceil(sqrt(available)) lands either side of the boundary, which is the only interesting
            statement this boundary corner could make.

      - name: by_weight_pack_rounds_each_pack_before_summing
        claim_type: Precision
        excluded_because:
          difficulty_instance: pack_declared_count_rounds_per_pack_before_summing
          rationale: >
            The §1.8 instance builds several BY_WEIGHT packs whose net weights each round up or down and
            shows the lot total differs from rounding the summed weight once, which subsumes the per-pack
            rounding and pieces_per_kg precision claims.

      - name: risk_score_pass_one_is_frozen_against_pass_two
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: risk_score_two_pass_freezes_severity_before_failure_penalty
          rationale: >
            The two-pass freeze — pass 1 written at BAKED, inspection_severity derived from it, then
            FAILURE_PENALTY added at results without recomputing pass 1 — is the entire subject of the
            §1.8 instance, including the certification ceiling interaction.

      - name: relief_bake_delay_window_boundary_at_four_hours
        claim_type: threshold_boundary
        excluded_because:
          difficulty_instance: relief_bake_delay_exactly_four_hours_passes_one_minute_later_fails
          rationale: >
            MAX_BAKE_DELAY_HOURS is exercised at exactly 4.000 h and at 4.017 h in §1.8, together with the
            resulting bake_term in the risk score, so a separate boundary corner would only repeat it.

      - name: furnace_capacity_aggregate_versus_lot_hold_priority
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: lot_hold_state_error_precedes_furnace_capacity_error
          rationale: >
            The §1.8 instance stages a charge that exceeds max_charge_mass_kg on a lot that is also on
            HOLD and shows the priority-15 state error winning over the priority-17 capacity error, which
            covers both the aggregate capacity claim and its ordering.

      - name: certification_risk_ceiling_at_issue_time
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: segregation_of_duties_error_precedes_risk_ceiling_error_at_issue
          rationale: >
            MAX_CERTIFIABLE_RISK is probed at issue time in §1.8 on a certificate that also violates
            segregation of duties, proving both that the ceiling is enforced and that the priority-12
            duty error is returned first.

  - section: validations
    instances:
      - name: quarantine_freeze_outranks_hold_and_is_not_restored_as_hold
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8, error_id=ERR_LOT_QUARANTINED]
          - validations[priority=9, error_id=ERR_LOT_ON_HOLD]
          - state_machines[ProductionLot.disposition].HOLD_to_QUARANTINED
          - state_machines[SteelHeat.cert_status].VERIFIED_to_SUSPECTED_COUNTERFEIT
          - endpoints[POST /production-lots/{id}/release-hold]
        distinguishing_aspect: >
          A lot already on a QUALITY hold that is then swept into quarantine by the counterfeit cascade
          answers ERR_LOT_QUARANTINED — not ERR_LOT_ON_HOLD — even for release-hold, the one endpoint the
          priority-9 rule exempts; and when the heat is re-verified the compensating cascade returns the
          lot to IN_PROCESS with hold_source NONE, silently discarding the operator's original QUALITY
          hold rather than restoring it.
        test_recipe:
          setup:
            - "Lot L-2620 in SETUP on a VERIFIED heat H-77410, then placed on hold by an inspector (hold_source QUALITY)."
            - "The heat is afterwards flagged SUSPECTED_COUNTERFEIT, quarantining the wire lot and the production lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "NP-M8-088", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.100, plating_spec: "NONE", packaging_mode: "BY_COUNT", nominal_pack_count: 100, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 500.0 }
              as: ProcessEngineer
              captures: { wire_id: $.data.id }
            - call: "POST /wire-lots/${wire_id}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { wire_v1: $.data.version }
            - call: "POST /heading-tools"
              payload: { tool_code: "DIE-4S-001", station_count: 4, rated_life_pieces: 120000 }
              as: ProcessEngineer
              captures: { tool_id: $.data.id }
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "POST /production-lots"
              payload: { lot_code: "L-2620", part_spec_id: "${spec_id}", wire_lot_id: "${wire_id}", heading_tool_id: "${tool_id}", press_code: "PRESS-3", press_window_start_at: "2026-09-01T06:00:00Z", press_window_end_at: "2026-09-01T10:00:00Z", planned_pieces: 5000, expected_wire_lot_version: "${wire_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /production-lots/${lot_id}/hold"
              payload: { reason: "AWAITING_FIRST_ARTICLE_APPROVAL" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /steel-heats/${heat_id}/flag-counterfeit"
              payload: { reason: "MILL_CERT_SERIAL_NOT_ON_MILL_REGISTER" }
              as: QualityManager
              as_user_id: "qm-2"
          trigger:
            - call: "POST /production-lots/${lot_id}/complete-heading"
              payload: { headed_count: 4900, heading_scrap_count: 60 }
              as: ProcessEngineer
              captures: { head_err: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/hold"
              payload: { reason: "SECOND_HOLD_ATTEMPT" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { hold_err: $.data.error_id }
            - call: "POST /production-lots/${lot_id}/release-hold"
              payload: { note: "TRYING_TO_RELEASE_A_QUARANTINED_LOT" }
