            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { l_due: $.data.applicable_due_date, l_sent: $.data.sent_date, l_dead: $.data.response_deadline } }
          assert:
            - "Letter at 2026-12-01 -> ERR_DUE_DILIGENCE_WINDOW_VIOLATION (due 2026-11-01 already past; rolled target window not yet open)"
            - "Letter at 2027-06-01 -> 201 with applicable_due_date == 2027-11-01, sent_date == 2027-06-01, response_deadline == 2027-07-01"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Any endpoint call without X-User-ID / X-User-Role is rejected 400 before role, existence, or business checks."
        test_recipe:
          setup: ["Empty DB. The trigger call is dispatched WITHOUT the X-User-ID and X-User-Role headers (the `as:` below documents intended role only; the test harness omits the headers)."]
          setup_api_calls: []
          trigger:
            - { call: "POST /escheatment/owners", payload: { full_name: "No Head", last_known_address: "24 W St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, captures: { err_id: $.data.error_id } }
          assert:
            - "http 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: schema_validation_priority_beats_not_found
        claim_type: priority_ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
          - "errors[ERR_PROPERTY_NOT_FOUND]"
        distinguishing_aspect: "A body that fails schema (missing required contact_type/contact_date/evidence_ref) on a nonexistent property path returns 400 ERR_INVALID_REQUEST (p3), not 404 (p4)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /escheatment/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/contact-events", payload: {}, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "http 400; error_id == ERR_INVALID_REQUEST — schema validation (p3) precedes existence (p4)"

      - name: submit_due_diligence_incomplete_after_threshold_lowered
        claim_type: conditional_validation
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_DUE_DILIGENCE_INCOMPLETE]"
          - "state_machines.HolderReport.DRAFT_to_SUBMITTED"
        distinguishing_aspect: "The DD-completeness submit gate is conditional on the CURRENT rule threshold: a property that became REPORTABLE under threshold 5000 (no letter needed) becomes non-compliant retroactively when the rule is lowered to 4000 below its 4999c value."
        test_recipe:
          setup:
            - "CA UNCASHED_CHECK rule (threshold 5000); property 4999c swept twice to REPORTABLE (under threshold, no letter); rule then updated to dd_threshold_cents 4000; DRAFT report with the property as its only line."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "UNCASHED_CHECK", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1", captures: { rule1: $.data.id } }
            - { call: "POST /escheatment/owners", payload: { full_name: "Cond Gate", last_known_address: "25 X St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "UNCASHED_CHECK", state_code: "CA", original_value_cents: 4999, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "PUT /escheatment/dormancy-rules/${rule1}", payload: { dd_threshold_cents: 4000 }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_DUE_DILIGENCE_INCOMPLETE (422): 4999 >= 4000 (lowered threshold) and no terminal letter exists"
            - "Report remains DRAFT"

      - name: priority_conflict_state_vs_fiscal
        claim_type: priority_conflict
        grounds:
          - "validations[priority=8]"
          - "validations[priority=12]"
        distinguishing_aspect: "State precondition beats fiscal variance on a FAILED remittance with a mismatched amount."
        excluded_because:
          difficulty_instance: confirm_failed_remittance_state_beats_fiscal_variance
          rationale: "The difficulty instance asserts ERR_REMITTANCE_NOT_PENDING wins over ERR_REMITTANCE_VARIANCE_NONZERO."

      - name: priority_conflict_constraint_vs_temporal
        claim_type: priority_conflict
        grounds:
          - "validations[priority=9]"
          - "validations[priority=10]"
        distinguishing_aspect: "Duplicate-letter constraint beats send-window temporal violation."
        excluded_because:
          difficulty_instance: duplicate_letter_constraint_beats_window_temporal
          rationale: "The difficulty instance asserts ERR_DUPLICATE_ACTIVE_LETTER wins over ERR_DUE_DILIGENCE_WINDOW_VIOLATION."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_and_envelope_shape
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /escheatment/dormancy-rules]"
        distinguishing_aspect: "List responses carry the fixed envelope (meta.api_request_id, response_type array) and pagination fields; limit/offset window correctly over 3 rows with defaults limit 10 / offset 0."
        test_recipe:
          setup: ["Three dormancy rules for distinct (state, type) pairs."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "NV", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "TX", property_type: "SAVINGS", dormancy_years: 5, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "GET /escheatment/dormancy-rules?limit=2&offset=0", as: Any }
            - { call: "GET /escheatment/dormancy-rules?limit=2&offset=2", as: Any }
            - { call: "GET /escheatment/dormancy-rules", as: Any }
          assert:
            - "Page 1 (limit=2, offset=0): data length 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2 (limit=2, offset=2): data length 1, total_count == 3, has_more == false"
            - "Default call: limit == 10, offset == 0, data length 3; every response has meta.api_request_id, meta.api_request_timestamp, response_type == array"

      - name: document_list_excludes_purged_by_default
        claim_type: listing
        grounds:
          - "endpoints[GET /escheatment/document-records]"
          - "state_machines.DocumentRecord.REGISTERED_to_PURGED"
        distinguishing_aspect: "Soft delete filter semantics: PURGED records vanish from default list output, reappear with include_purged=true, and remain directly readable by id."
        test_recipe:
          setup: ["A CLAIM_EVIDENCE record created at 2026-08-01 (retention_until 2033-08-01), purged after the clock reaches the retention date."]
          setup_api_calls:
            - { call: "POST /escheatment/document-records", payload: { artifact_type: "CLAIM_EVIDENCE", related_entity_type: "OwnerClaim", related_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { doc1: $.data.id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2033-08-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/document-records/${doc1}/purge", as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "GET /escheatment/document-records", as: Any }
            - { call: "GET /escheatment/document-records?include_purged=true", as: Any }
            - { call: "GET /escheatment/document-records/${doc1}", as: Any, captures: { d_st: $.data.status } }
          assert:
            - "Default list: total_count == 0 (PURGED excluded)"
            - "include_purged=true: total_count == 1, the record shows status PURGED with purged_at set"
            - "Single GET by id still returns the PURGED record (soft delete, not hard delete)"

  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_errors_across_resources
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OWNER_NOT_FOUND]"
          - "errors[ERR_DORMANCY_RULE_NOT_FOUND]"
          - "errors[ERR_REPORT_NOT_FOUND]"
          - "errors[ERR_LETTER_NOT_FOUND]"
          - "errors[ERR_LIQUIDATION_ORDER_NOT_FOUND]"
          - "errors[ERR_REMITTANCE_NOT_FOUND]"
          - "errors[ERR_CLAIM_NOT_FOUND]"
          - "errors[ERR_PENALTY_ASSESSMENT_NOT_FOUND]"
          - "errors[ERR_AUDIT_CASE_NOT_FOUND]"
          - "errors[ERR_DOCUMENT_RECORD_NOT_FOUND]"
        distinguishing_aspect: "Every single-resource GET with an unknown UUID returns its resource-specific 404 error_id (not a shared generic code)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /escheatment/owners/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_owner: $.data.error_id } }
            - { call: "GET /escheatment/dormancy-rules/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_rule: $.data.error_id } }
            - { call: "GET /escheatment/holder-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_rep: $.data.error_id } }
            - { call: "GET /escheatment/due-diligence-letters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_let: $.data.error_id } }
            - { call: "GET /escheatment/liquidation-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_liq: $.data.error_id } }
            - { call: "GET /escheatment/remittances/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_rem: $.data.error_id } }
            - { call: "GET /escheatment/owner-claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_clm: $.data.error_id } }
            - { call: "GET /escheatment/penalty-assessments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_pen: $.data.error_id } }
            - { call: "GET /escheatment/audit-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_aud: $.data.error_id } }
            - { call: "GET /escheatment/document-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_doc: $.data.error_id } }
          assert:
            - "ERR_OWNER_NOT_FOUND / ERR_DORMANCY_RULE_NOT_FOUND / ERR_REPORT_NOT_FOUND / ERR_LETTER_NOT_FOUND / ERR_LIQUIDATION_ORDER_NOT_FOUND / ERR_REMITTANCE_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_PENALTY_ASSESSMENT_NOT_FOUND / ERR_AUDIT_CASE_NOT_FOUND / ERR_DOCUMENT_RECORD_NOT_FOUND respectively, each with http 404"

      - name: invalid_enum_property_type_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.Property.fields.property_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "property_type outside the declared enum (CRYPTO) fails schema validation with 400."
        test_recipe:
          setup: ["Rule and owner exist."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Enum Bad", last_known_address: "26 Y St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "CRYPTO", state_code: "CA", original_value_cents: 5000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "http 400; error_id == ERR_INVALID_REQUEST"

      - name: property_create_without_rule_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_NO_APPLICABLE_DORMANCY_RULE]"
        distinguishing_aspect: "No DormancyRule covers (state, type) effective at last_contact_date -> 422 at property creation."
        test_recipe:
          setup: ["Owner exists; NO dormancy rule for (CA, SAVINGS)."]
          setup_api_calls:
            - { call: "POST /escheatment/owners", payload: { full_name: "No Rule", last_known_address: "27 Z St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 5000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "http 422; error_id == ERR_NO_APPLICABLE_DORMANCY_RULE"

      - name: property_state_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "entities.Property.fields.state_code"
          - "errors[ERR_OWNER_STATE_MISMATCH]"
        distinguishing_aspect: "property.state_code must equal the owner's state_code (governing-law rule); a mismatch is 422 even when a matching rule exists."
        test_recipe:
          setup: ["Owner with state_code CA; NV SAVINGS rule exists so the rule lookup would pass."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "NV", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Mis Match", last_known_address: "28 AA St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "NV", original_value_cents: 5000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "http 422; error_id == ERR_OWNER_STATE_MISMATCH"

      - name: duplicate_report_period_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_REPORT_PERIOD]"
          - "endpoints[POST /escheatment/holder-reports]"
        distinguishing_aspect: "One non-SUPERSEDED report per (state_code, report_year); the second base create is 409."
        test_recipe:
          setup: ["CA 2026 DRAFT report exists."]
          setup_api_calls:
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2027 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r2: $.data.id } }
          assert:
            - "Second CA-2026 report -> ERR_DUPLICATE_REPORT_PERIOD (409); CA-2027 report -> 201 (different year is a different period)"

      - name: pending_amendment_exists_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PENDING_AMENDMENT_EXISTS]"
          - "endpoints[POST /escheatment/holder-reports/{reportId}/amendments]"
        distinguishing_aspect: "With a fresh (non-stale) expected version, a second pending amendment against the same ACCEPTED report is rejected on the uniqueness constraint — proving the OCC check passed and the constraint fired."
        test_recipe:
          setup: ["CA 2026 report with one 80000c line ACCEPTED; amendment A2 already created (DRAFT) against it."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Pend Amend", last_known_address: "29 AB St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 80000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1", captures: { r1_vacc: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/amendments", payload: { expected_report_version: "${r1_vacc}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r2: $.data.id } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r1_vnow: $.data.version } }
          trigger:
            - { call: "POST /escheatment/holder-reports/${r1}/amendments", payload: { expected_report_version: "${r1_vnow}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_PENDING_AMENDMENT_EXISTS (409) — expected_report_version was fresh (${r1_vnow}), so the failure is the uniqueness constraint, not OCC"

      - name: duplicate_active_claim_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_ACTIVE_CLAIM]"
        distinguishing_aspect: "One non-terminal claim per property; a second claim while the first is SUBMITTED is 409."
        test_recipe:
          setup: ["Property REMITTED (full chain); claim1 SUBMITTED."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Dup Claim", last_known_address: "30 AC St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 90000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
