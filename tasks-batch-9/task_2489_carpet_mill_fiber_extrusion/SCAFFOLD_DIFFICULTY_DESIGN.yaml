              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
              captures: { cert2: $.data.id }
            - call: "POST /mill/cut-orders/${co2}/allocate"
              payload: {}
              as: MillPlanner
          assert:
            - "the first allocate returns HTTP 200, CutOrder.${co1}.status == ALLOCATED and RollGood.${rg}.available_yards == 150.0"
            - "after the clock advance, Certification.${cert1}.status == LAPSED and CarpetStyle.${st}.status == SUSPENDED"
            - "the clock response lists ${cert1} in lapsed_certification_ids and ${st} in suspended_style_ids"
            - "the second allocate returns HTTP 422 with data.error_id == ERR_FLAMMABILITY_CERT_REQUIRED, not ERR_STYLE_NOT_ORDERABLE"
            - "after the refused allocate, CutOrder.${co2}.status == SUBMITTED, CutOrder.${co1}.status == ALLOCATED and RollGood.${rg}.available_yards == 150.0"
            - "after the fresh certificate, Certification.${cert2}.status == ACTIVE and CarpetStyle.${st}.status == ACTIVE"
            - "the third allocate returns HTTP 200, CutOrder.${co2}.status == ALLOCATED and RollGood.${rg}.available_yards == 100.0"

      - name: tufter_load_setup_gated_on_style_status_driven_by_certificate_revocation
        grounds:
          - state_machines.Certification.ACTIVE_to_REVOKED
          - state_machines.CarpetStyle.ACTIVE_to_SUSPENDED
          - state_machines.CarpetStyle.SUSPENDED_to_ACTIVE
          - state_machines.ProductionRun.SCHEDULED_to_HELD
          - state_machines.ProductionRun.HELD_to_SCHEDULED
          - state_machines.ProductionRun.SCHEDULED_to_TUFTING
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
