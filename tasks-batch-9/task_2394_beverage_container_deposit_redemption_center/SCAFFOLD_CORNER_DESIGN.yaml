            - "the second trigger has status 200 with status COUNTED, counted_total 100, final_credit_cents 950, adjustment_cents 150, variance_pct 0.0000 and variance_flag false"
            - "the fourth trigger has status 409 and $.data.error_id == ERR_DISPUTE_WINDOW_CLOSED because 2026-08-08T09:00:00Z is exactly dropped_at plus 72 hours"
            - "BagDrop.${bag_id}.status == COUNTED and recount_count == 0 after the fourth trigger"
