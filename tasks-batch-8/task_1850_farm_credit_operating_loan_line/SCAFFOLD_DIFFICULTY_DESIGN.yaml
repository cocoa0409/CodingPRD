            - "invariant: outstanding_principal_cents after == before == 0 (${post_p} == ${pre_p} == 0)"
            - "invariant: accrued_interest_cents after == before == 0 (${post_i} == ${pre_i} == 0)"
            - "invariant: available_credit_cents after == before == 50000000 (${post_a} == ${pre_a})"

      - name: covenant_record_then_void_conserves_breach_count
