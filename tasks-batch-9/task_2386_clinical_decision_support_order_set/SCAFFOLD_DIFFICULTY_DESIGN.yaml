scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_priority_score_provisional_versus_committee_calibrated
        grounds:
          - calculations.content_request_priority_score
          - entities.ContentRequest.fields.priority_score
          - entities.ContentRequest.fields.priority_score_basis
          - entities.ContentRequest.fields.peer_reviewed_citation_count
          - state_machines.ContentRequest.INTAKE_SUBMITTED_to_TRIAGE_ACCEPTED
        distinguishing_aspect: |
          This dual variant lives on the ContentRequest intake domain: the provisional
          variant scores the sponsor's self-declared evidence_grade with no multiplier,
          while the committee_calibrated variant discards the grade entirely, replaces it
          with a peer-reviewed citation component and multiplies by a backlog-age factor,
          so identical stored data yields 57.00 then 58.50.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z so created_at is deterministic."
            - "One ClinicalSponsor clinician and one CommitteeChair clinician exist."
            - "One ContentRequest: evidence_grade B, urgency EXPEDITED, patient_safety_flag true, 5 citations of which 3 are peer reviewed, status INTAKE_SUBMITTED."
            - "Clock advanced to 2026-08-16T00:00:00Z (15 whole days of backlog age) before triage."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Okafor", npi: "1000000002", specialty: "INTERNAL_MEDICINE", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /cds/content-requests"
              payload:
                title: "Acute chest pain order set"
                request_type: "ORDER_SET"
                clinical_domain: "CARDIOLOGY"
                urgency: "EXPEDITED"
                evidence_grade: "B"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: true
                evidence_citations:
                  - { citation: "NEJM 2025;392:1", peer_reviewed: true }
                  - { citation: "JAMA 2025;333:9", peer_reviewed: true }
                  - { citation: "Circulation 2025;151:44", peer_reviewed: true }
                  - { citation: "Internal protocol memo 2025-11", peer_reviewed: false }
                  - { citation: "Vendor white paper", peer_reviewed: false }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id, provisional_score: $.data.priority_score, provisional_basis: $.data.priority_score_basis }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "ACCEPT", triage_note: "Evidence adequate; proceed to build" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { calibrated_score: $.data.priority_score }
          assert:
            - "${provisional_score} == 57.00 and ${provisional_basis} == INTAKE_PROVISIONAL"
            - "ContentRequest.${cr_id}.peer_reviewed_citation_count == 3"
            - "${calibrated_score} == 58.50"
            - "ContentRequest.${cr_id}.priority_score == 58.50"
            - "ContentRequest.${cr_id}.priority_score_basis == COMMITTEE_CALIBRATED"
            - "ContentRequest.${cr_id}.status == TRIAGE_ACCEPTED"
            - "58.50 != 57.00 — the two variants disagree on identical stored citation and urgency data"

      - name: dual_variant_burden_index_fire_weighted_versus_clinician_weighted
        grounds:
          - calculations.alert_burden_index
          - entities.AlertBurdenWindow.fields.burden_index
          - entities.AlertBurdenWindow.fields.burden_index_clinician_weighted
          - entities.AlertBurdenWindow.fields.burden_classification
          - state_machines.AlertBurdenWindow.OPEN_to_CLOSED
        distinguishing_aspect: |
          This dual variant lives on the Alert burden-monitoring domain, not on
          ContentRequest scoring: the fire_weighted variant normalises override count
          against 50 expected firings while the clinician_weighted variant normalises
          distinct clinicians against 20, so the same closed window scores 90.00 and
          60.00 and only the fire-weighted value crosses the 65.00 low-value threshold.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and two specialty approvers exist."
            - "An accepted ALERT content request carries one TIER_2_INTERRUPTIVE alert with two declared override reason codes."
            - "The alert is APPROVED by two unanimous specialty votes and ACTIVE."
            - "60 firings at 3600s intervals from 2026-09-01T00:00:00Z, the first 45 of them overrides, across 12 distinct synthetic clinicians."
            - "One OPEN burden window spanning 2026-09-01T00:00:00Z to 2026-09-05T00:00:00Z contains every one of those firings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Bhatt", npi: "1000000003", specialty: "INFORMATICS", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Okafor", npi: "1000000002", specialty: "INTERNAL_MEDICINE", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Lam", npi: "1000000004", specialty: "CARDIOLOGY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev1_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Nunes", npi: "1000000005", specialty: "CARDIOLOGY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev2_id: $.data.id }
            - call: "POST /cds/content-requests"
              payload:
                title: "Anticoagulation duplicate therapy alert"
                request_type: "ALERT"
                clinical_domain: "CARDIOLOGY"
                urgency: "ROUTINE"
                evidence_grade: "B"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: false
                evidence_citations:
                  - { citation: "NEJM 2025;392:1", peer_reviewed: true }
                  - { citation: "JAMA 2025;333:9", peer_reviewed: true }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "ACCEPT" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /cds/content-requests/${cr_id}/alerts"
              payload:
                name: "Duplicate anticoagulant"
                firing_criteria: { trigger_event: "NEW_MEDICATION_ORDER", expression: "active_order(anticoagulant) AND new_order(anticoagulant)" }
                severity_tier: "TIER_2_INTERRUPTIVE"
                designed_by_clinician_id: "${builder_id}"
                override_reason_codes: ["CLINICALLY_APPROPRIATE", "PATIENT_TOLERATES"]
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { al_id: $.data.id }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev1_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${al_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra1_id: $.data.id }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev2_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${al_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra2_id: $.data.id }
            - call: "POST /cds/review-assignments/${ra1_id}/cast"
              payload: { vote: "APPROVE" }
              as: SpecialtyApprover
              as_user_id: "${rev1_id}"
            - call: "POST /cds/review-assignments/${ra2_id}/cast"
              payload: { vote: "APPROVE" }
              as: SpecialtyApprover
              as_user_id: "${rev2_id}"
            - call: "POST /cds/alerts/${al_id}/activate"
              payload: { activation_note: "Go live" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /_events/alert-firings"
              payload: { alert_id: "${al_id}", fired_at_start: "2026-09-01T00:00:00Z", interval_seconds: 3600, fire_count: 60, override_count: 45, distinct_clinician_count: 12, override_reason_code: "CLINICALLY_APPROPRIATE" }
              as: SystemAdmin
              captures: { last_fired_at: $.data.last_fired_at }
            - call: "GET /cds/alerts/${al_id}"
              as: SystemAdmin
              captures: { al_v: $.data.version }
            - call: "POST /cds/alerts/${al_id}/burden-windows"
              payload: { expected_alert_version: "${al_v}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
              captures: { win_id: $.data.id }
          trigger:
            - call: "POST /cds/alerts/${al_id}/burden-windows/${win_id}/close"
              payload: { closure_reason: "MONITORING_PERIOD_ENDED" }
              as: SystemAdmin
              captures: { closed_index: $.data.burden_index, closed_index_clin: $.data.burden_index_clinician_weighted }
          assert:
            - "${last_fired_at} == 2026-09-03T11:00:00Z (every firing falls inside the window)"
            - "AlertBurdenWindow.${win_id}.fire_count == 60 and override_count == 45 and accept_count == 15"
            - "AlertBurdenWindow.${win_id}.override_rate == 0.7500 and volume_factor == 1.2000"
            - "${closed_index} == 90.00"
            - "${closed_index_clin} == 60.00"
            - "AlertBurdenWindow.${win_id}.distinct_fired_clinician_count == 12 and distinct_overriding_clinician_count == 12"
            - "AlertBurdenWindow.${win_id}.burden_classification == LOW_VALUE (driven by 90.00 >= 65.00, not by 60.00)"
            - "Alert.${al_id}.latest_burden_index == 90.00 and Alert.${al_id}.windowed_fire_count == 60"

  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_burden_index_volume_cap_and_tier_multiplier_interaction
        grounds:
          - calculations.alert_burden_index
          - entities.Alert.fields.severity_tier
          - entities.AlertBurdenWindow.fields.volume_factor
          - entities.AlertBurdenWindow.fields.burden_index
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (a): four inputs (override count, fire count, distinct clinician count and
          severity tier) interact non-linearly through two nested min() caps — the volume
          factor saturates at 2.0 and the product saturates at BURDEN_INDEX_CAP, so the
          raw 192.00 fire-weighted product is clipped to 100.00 while the
          clinician-weighted branch of the very same window lands at 64.00 uncapped.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and three specialty approvers exist."
            - "An accepted ALERT request carries a TIER_1_HARD_STOP alert with a hard_stop_justification and two override reason codes."
            - "The alert needs three unanimous specialty votes (ALERT_REQUIRED_VOTES[TIER_1_HARD_STOP]) and is ACTIVE."
            - "150 firings at 600s intervals from 2026-09-01T00:00:00Z, the first 90 overrides, across 8 distinct synthetic clinicians."
            - "One OPEN window spans 2026-09-01T00:00:00Z to 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Bhatt", npi: "1000000003", specialty: "INFORMATICS", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Okafor", npi: "1000000002", specialty: "INTERNAL_MEDICINE", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Lam", npi: "1000000004", specialty: "CARDIOLOGY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev1_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Nunes", npi: "1000000005", specialty: "CARDIOLOGY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev2_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Iqbal", npi: "1000000006", specialty: "PHARMACY", authorized_roles: ["SpecialtyApprover"] }
              as: SystemAdmin
              captures: { rev3_id: $.data.id }
            - call: "POST /cds/content-requests"
              payload:
                title: "Concentrated potassium hard stop"
                request_type: "ALERT"
                clinical_domain: "CRITICAL_CARE"
                urgency: "SAFETY_URGENT"
                evidence_grade: "A"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: true
                evidence_citations:
                  - { citation: "ISMP alert 2025-04", peer_reviewed: true }
                  - { citation: "NEJM 2025;392:88", peer_reviewed: true }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "ACCEPT" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /cds/content-requests/${cr_id}/alerts"
              payload:
                name: "Concentrated KCl hard stop"
                firing_criteria: { trigger_event: "NEW_MEDICATION_ORDER", expression: "order(potassium_chloride) AND concentration > 10 mEq per 100 mL" }
                severity_tier: "TIER_1_HARD_STOP"
                designed_by_clinician_id: "${builder_id}"
                hard_stop_justification: "Fatal dysrhythmia risk documented by ISMP"
                override_reason_codes: ["PHARMACY_VERIFIED", "CENTRAL_LINE_CONFIRMED"]
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { al_id: $.data.id }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev1_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${al_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra1_id: $.data.id }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev2_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${al_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra2_id: $.data.id }
            - call: "POST /cds/review-assignments"
              payload: { reviewer_id: "${rev3_id}", review_kind: "SPECIALTY_APPROVAL", alert_id: "${al_id}" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { ra3_id: $.data.id }
            - call: "POST /cds/review-assignments/${ra1_id}/cast"
              payload: { vote: "APPROVE" }
              as: SpecialtyApprover
              as_user_id: "${rev1_id}"
            - call: "POST /cds/review-assignments/${ra2_id}/cast"
              payload: { vote: "APPROVE" }
              as: SpecialtyApprover
              as_user_id: "${rev2_id}"
            - call: "POST /cds/review-assignments/${ra3_id}/cast"
              payload: { vote: "APPROVE" }
              as: SpecialtyApprover
              as_user_id: "${rev3_id}"
            - call: "POST /cds/alerts/${al_id}/activate"
              payload: { activation_note: "Go live" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /_events/alert-firings"
              payload: { alert_id: "${al_id}", fired_at_start: "2026-09-01T00:00:00Z", interval_seconds: 600, fire_count: 150, override_count: 90, distinct_clinician_count: 8, override_reason_code: "PHARMACY_VERIFIED" }
              as: SystemAdmin
              captures: { last_fired_at: $.data.last_fired_at }
            - call: "GET /cds/alerts/${al_id}"
              as: SystemAdmin
              captures: { al_v: $.data.version }
            - call: "POST /cds/alerts/${al_id}/burden-windows"
              payload: { expected_alert_version: "${al_v}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
              captures: { win_id: $.data.id }
          trigger:
            - call: "POST /cds/alerts/${al_id}/burden-windows/${win_id}/close"
              payload: { closure_reason: "MONITORING_PERIOD_ENDED" }
              as: SystemAdmin
              captures: { idx: $.data.burden_index, idx_clin: $.data.burden_index_clinician_weighted, vol: $.data.volume_factor }
          assert:
            - "${last_fired_at} == 2026-09-02T00:50:00Z"
            - "AlertBurdenWindow.${win_id}.override_rate == 0.6000"
            - "${vol} == 2.0 (round(150/50,4) = 3.0000 clipped by VOLUME_FACTOR_CAP)"
            - "${idx} == 100.00 (the uncapped product 0.6000 * 1.6 * 2.0 * 100 = 192.00 is clipped by BURDEN_INDEX_CAP)"
            - "${idx_clin} == 64.00 (distinct 8 of 20 expected: 1.0000 * 1.6 * 0.4000 * 100, no cap applied)"
            - "AlertBurdenWindow.${win_id}.severity_tier_snapshot == TIER_1_HARD_STOP"
            - "AlertBurdenWindow.${win_id}.burden_classification == LOW_VALUE"

      - name: combinatorial_adherence_rounding_order_per_unit_mean_versus_pooled_ratio
        grounds:
          - calculations.order_set_adherence
          - entities.AdherenceMeasurement.fields.adherence_pct_per_protocol
          - entities.AdherenceMeasurement.fields.adherence_pct_intention_to_treat
          - entities.AdherenceMeasurement.fields.unintended_event_rate_per_100
          - state_machines.AdherenceMeasurement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Mode (b): the scaffold pins "round each unit rate to 4dp, then average" for the
          per-protocol variant against "pool the raw numerators and denominators, then
          round once" for intention-to-treat, so the identical unit_observations array
          produces 58.60 and 51.00 — a 7.60 point spread that exists only because of the
          rounding order, and the unintended rate is pooled in every case.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sponsor, builder, chair and pharmacist exist."
            - "An ACTIVATED vendor release exists so the order set can be pinned."
            - "An accepted ORDER_SET request carries one DRAFT order set."
            - "A PROVISIONAL adherence measurement carries three unit observations: ICU 20/30 with 3 unintended events, WARD 490/970 with 27, and CLIN 0/0 with 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Reyes", npi: "1000000001", specialty: "CARDIOLOGY", authorized_roles: ["ClinicalSponsor"] }
              as: SystemAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Bhatt", npi: "1000000003", specialty: "INFORMATICS", authorized_roles: ["InformaticsBuilder"] }
              as: SystemAdmin
              captures: { builder_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Okafor", npi: "1000000002", specialty: "INTERNAL_MEDICINE", authorized_roles: ["CommitteeChair"] }
              as: SystemAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /cds/clinicians"
              payload: { full_name: "Dr Iqbal", npi: "1000000006", specialty: "PHARMACY", authorized_roles: ["PharmacyInformaticist"] }
              as: SystemAdmin
              captures: { pharm_id: $.data.id }
            - call: "POST /cds/vendor-releases"
              payload: { vendor_name: "FDB", release_label: "2026.08", content_domain: "DRUG_INTERACTION" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vr_id}/deltas"
              payload: { rule_code: "DDI-0001", change_type: "NEW_INTERACTION", description: "New moderate interaction", new_severity: "MODERATE" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vr_id}/run-impact-analysis"
              payload: { analysis_note: "Single low-weight delta" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/vendor-rule-deltas/${d1_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/vendor-releases/${vr_id}/activate"
              payload: { activation_note: "Fast track" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
            - call: "POST /cds/content-requests"
              payload:
                title: "Community acquired pneumonia order set"
                request_type: "ORDER_SET"
                clinical_domain: "HOSPITAL_MEDICINE"
                urgency: "ROUTINE"
                evidence_grade: "B"
                clinical_sponsor_id: "${sponsor_id}"
                patient_safety_flag: false
                evidence_citations:
                  - { citation: "IDSA 2025 guideline", peer_reviewed: true }
                  - { citation: "Chest 2025;167:210", peer_reviewed: true }
              as: ClinicalSponsor
              as_user_id: "${sponsor_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /cds/content-requests/${cr_id}/triage"
              payload: { decision: "ACCEPT" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { cr_v: $.data.version }
            - call: "POST /cds/content-requests/${cr_id}/order-sets"
              payload: { expected_content_request_version: "${cr_v}", name: "CAP admission", specialty: "HOSPITAL_MEDICINE", pinned_vendor_release_id: "${vr_id}", built_by_clinician_id: "${builder_id}" }
              as: InformaticsBuilder
              as_user_id: "${builder_id}"
              captures: { os_id: $.data.id }
            - call: "POST /cds/order-sets/${os_id}/adherence-measurements"
              payload:
                measurement_period_start: "2026-08-01T00:00:00Z"
                measurement_period_end: "2026-08-31T00:00:00Z"
                unit_observations:
                  - { unit_code: "ICU", eligible_orders: 30, adherent_orders: 20, unintended_events: 3 }
                  - { unit_code: "WARD", eligible_orders: 970, adherent_orders: 490, unintended_events: 27 }
                  - { unit_code: "CLIN", eligible_orders: 0, adherent_orders: 0, unintended_events: 0 }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { am_id: $.data.id, pp: $.data.adherence_pct_per_protocol, inc: $.data.included_unit_count, exc: $.data.excluded_unit_count }
          trigger:
            - call: "POST /cds/adherence-measurements/${am_id}/finalize"
              payload: { verdict: "REVISE", finalization_note: "Below floor; revise content" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { itt: $.data.adherence_pct_intention_to_treat, ue: $.data.unintended_event_rate_per_100 }
          assert:
