            - { call: "GET /potato-shed/sheds/${s_id}", payload: {}, as: QualityAssuranceManager, captures: { p2: "$.data.posture", f2: "$.data.consecutive_wash_failures" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T03:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager, captures: { c3: "$.data.result" } }
            - { call: "GET /potato-shed/sheds/${s_id}", payload: {}, as: QualityAssuranceManager, captures: { p3: "$.data.posture" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T04:00:00Z", turbidity_ntu: 9.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager, captures: { c4: "$.data.result" } }
            - { call: "GET /potato-shed/sheds/${s_id}", payload: {}, as: QualityAssuranceManager, captures: { p4: "$.data.posture" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-02T05:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "GET /potato-shed/sheds/${s_id}", payload: {}, as: QualityAssuranceManager, captures: { p5: "$.data.posture", f5: "$.data.consecutive_wash_failures" } }
          assert:
            - "c1 == FAIL (5.0 > 4.0) and p1 == NORMAL (only 1 consecutive failure)"
            - "c2 == FAIL and p2 == RESTRICTED and f2 == 2"
            - "c3 == PASS and p3 == NORMAL (counter reset)"
            - "c4 == FAIL and p4 == QUARANTINED (9.0 > 8.0 severe-turbidity flag, single check suffices)"
            - "p5 == NORMAL and f5 == 0 (PASS cleared the quarantine flag, completing the cycle)"

  - rule_id: transitive_cascade
    instances:
      - name: wash_fail_quarantine_cascade
        grounds:
          - state_machines.StorageShed.NORMAL_to_QUARANTINED
          - state_machines.FieldLot.CLEAR_to_ON_HOLD
          - state_machines.PackOrder.ALLOCATED_to_REQUESTED
          - calculations.wash_water_result
        distinguishing_aspect: |
          Depth-4 chain from one trigger (wash check create): severe FAIL -> shed QUARANTINED ->
          lot auto-ON_HOLD -> order's reservation released and coverage recheck fails ->
          order ALLOCATED -> REQUESTED with full release -> contract remaining restored 300 -> 500.
