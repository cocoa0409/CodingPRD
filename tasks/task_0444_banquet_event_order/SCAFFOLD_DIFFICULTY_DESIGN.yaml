              as: SalesManager
              captures: { booking_a: $.data.id }
            - call: "POST /events/${event_a}/hold"
              payload: {}
              as: SalesManager
            - call: "POST /events/${event_a}/bookings/${booking_a}/make-definite"
              payload: {}
