# =============================================================================
# Task 1226: Retirement Plan Loan & Hardship Withdrawal — §1.9 Corner Design
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: plan_creation_applies_documented_defaults
        claim_type: defaults
        grounds:
          - entities.Plan
          - endpoints["POST /plans"]
        distinguishing_aspect: "POST /plans with only `name` yields documented defaults: max_loans_outstanding 1, min 100,000c, max 5,000,000c, rate 500bps, THIRTY_360, allows_refinance false, lookback 12, suspension 6, FULL_DOCUMENTATION, withholding 2000bps, default 2-step chains, status ACTIVE, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Defaulted Plan" }, as: RecordkeeperAdmin, captures: { pl_d: "$.data.id" } }
          trigger:
            - { call: "GET /plans/${pl_d}", payload: {}, as: RecordkeeperAdmin, captures: { d_status: "$.data.status", d_maxloans: "$.data.max_loans_outstanding", d_min: "$.data.min_loan_amount_cents", d_max: "$.data.max_loan_amount_cents", d_rate: "$.data.interest_rate_bps", d_dc: "$.data.day_count_convention", d_refi: "$.data.allows_refinance", d_lb: "$.data.refinance_min_months_since_disbursement", d_susp: "$.data.hardship_suspension_months", d_sub: "$.data.substantiation_standard", d_wh: "$.data.withholding_rate_bps", d_chain: "$.data.loan_approval_chain", d_ver: "$.data.version" } }
          assert:
            - "captured d_status == ACTIVE and d_ver == 1"
            - "captured d_maxloans == 1 and d_min == 100000 and d_max == 5000000"
            - "captured d_rate == 500 and d_dc == THIRTY_360 and d_refi == false and d_lb == 12"
            - "captured d_susp == 6 and d_sub == FULL_DOCUMENTATION and d_wh == 2000"
            - "captured d_chain == [PLAN_SPONSOR, RECORDKEEPER_ADMIN]"

      - name: participant_enrollment_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Participant.fields.vested_balance_cents
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
        distinguishing_aspect: "Omitting required vested_balance_cents from enrollment fails schema validation with ERR_INVALID_REQUEST (400) before any state or business rule runs."
        test_recipe:
          setup: ["one plan exists"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Req" }, as: RecordkeeperAdmin, captures: { pl_rq: "$.data.id" } }
          trigger:
            - { call: "POST /plans/${pl_rq}/participants", payload: { full_name: "No Balance" }, as: RecordkeeperAdmin, captures: { rq_err: "$.data.error_id" } }
          assert:
            - "captured rq_err == ERR_INVALID_REQUEST"

      - name: loan_term_snapshot_ignores_later_policy_change
        claim_type: computed_fields
        grounds:
          - entities.Loan.fields.interest_rate_bps
          - entities.Loan.fields.day_count_convention
        distinguishing_aspect: "Loan terms are version-pinned at request: after the plan rate is updated to 900bps via policy PUT, a loan requested BEFORE the update still shows interest_rate_bps 500; a loan requested AFTER shows 900."
        test_recipe:
          setup:
            - "Plan at version 1 with default 500bps; participant vested 10,000,000c with max_loans_outstanding raised to 2 via the same policy update that later changes the rate — order pinned: first update raises max_loans (v1->v2), loan L1 requested, then second update sets rate 900 (v2->v3), loan L2 requested"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Pin" }, as: RecordkeeperAdmin, captures: { pl_pn: "$.data.id", pn_v1: "$.data.version" } }
            - { call: "POST /plans/${pl_pn}/participants", payload: { full_name: "Pin Pam", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_pn: "$.data.id" } }
            - { call: "PUT /plans/${pl_pn}/policy", payload: { expected_plan_version: "${pn_v1}", max_loans_outstanding: 2 }, as: RecordkeeperAdmin, captures: { pn_v2: "$.data.version" } }
            - { call: "POST /participants/${p_pn}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_pn}", captures: { loan_pn1: "$.data.id" } }
            - { call: "PUT /plans/${pl_pn}/policy", payload: { expected_plan_version: "${pn_v2}", interest_rate_bps: 900 }, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_pn}/loans", payload: { principal_amount_cents: 100000, term_months: 12 }, as: Participant, as_user_id: "${p_pn}", captures: { loan_pn2: "$.data.id" } }
          trigger:
            - { call: "GET /loans/${loan_pn1}", payload: {}, as: RecordkeeperAdmin, captures: { pn_rate1: "$.data.interest_rate_bps" } }
            - { call: "GET /loans/${loan_pn2}", payload: {}, as: RecordkeeperAdmin, captures: { pn_rate2: "$.data.interest_rate_bps" } }
          assert:
            - "captured pn_rate1 == 500 (snapshotted at request, untouched by the later policy update)"
            - "captured pn_rate2 == 900"

      - name: get_nonexistent_entities_return_typed_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_PARTICIPANT_NOT_FOUND]
          - errors[ERR_LOAN_NOT_FOUND]
          - errors[ERR_HARDSHIP_NOT_FOUND]
          - errors[ERR_REMITTANCE_NOT_FOUND]
          - errors[ERR_APPROVAL_TASK_NOT_FOUND]
          - errors[ERR_TAX_EVENT_NOT_FOUND]
        distinguishing_aspect: "Each resource family returns its own typed 404: participant, loan, hardship, remittance, approval-task, and tax-event ids that do not exist map to distinct error ids, not a shared generic one."
        test_recipe:
          setup: ["empty DB; a fixed UUID that collides with nothing"]
          setup_api_calls: []
          trigger:
            - { call: "GET /participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: RecordkeeperAdmin, captures: { nf_pt: "$.data.error_id" } }
            - { call: "GET /loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: RecordkeeperAdmin, captures: { nf_loan: "$.data.error_id" } }
            - { call: "GET /hardship-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: RecordkeeperAdmin, captures: { nf_hd: "$.data.error_id" } }
            - { call: "POST /remittances/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/reverse", payload: {}, as: RecordkeeperAdmin, captures: { nf_rm: "$.data.error_id" } }
            - { call: "POST /approval-tasks/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01", captures: { nf_tk: "$.data.error_id" } }
            - { call: "POST /tax-events/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/mark-reported", payload: {}, as: RecordkeeperAdmin, captures: { nf_tx: "$.data.error_id" } }
          assert:
            - "captured nf_pt == ERR_PARTICIPANT_NOT_FOUND"
            - "captured nf_loan == ERR_LOAN_NOT_FOUND"
            - "captured nf_hd == ERR_HARDSHIP_NOT_FOUND"
            - "captured nf_rm == ERR_REMITTANCE_NOT_FOUND"
            - "captured nf_tk == ERR_APPROVAL_TASK_NOT_FOUND"
            - "captured nf_tx == ERR_TAX_EVENT_NOT_FOUND"

      - name: hardship_unknown_reason_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.HardshipRequest.fields.reason_category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A reason_category outside the declared enum (e.g. VACATION) is a schema-level ERR_INVALID_REQUEST, distinct from a valid-but-plan-disallowed reason (ERR_UNSAFE_HARBOR_REASON)."
        test_recipe:
          setup: ["default plan; participant vested 20,000,000c"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Enum" }, as: RecordkeeperAdmin, captures: { pl_en: "$.data.id" } }
            - { call: "POST /plans/${pl_en}/participants", payload: { full_name: "Enum Ena", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_en: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_en}/hardship-requests", payload: { reason_category: "VACATION", amount_cents: 100000 }, as: Participant, as_user_id: "${p_en}", captures: { en_err: "$.data.error_id" } }
          assert:
            - "captured en_err == ERR_INVALID_REQUEST"

      - name: plan_disallowed_safe_harbor_reason_rejected
        claim_type: type_constraints
        grounds:
          - entities.Plan.fields.allowed_hardship_reasons
          - errors[ERR_UNSAFE_HARBOR_REASON]
          - validations[priority=11]
        distinguishing_aspect: "TUITION is a valid enum member but excluded by this plan's allowed_hardship_reasons [MEDICAL, FUNERAL], yielding ERR_UNSAFE_HARBOR_REASON (422), not ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["plan restricted to MEDICAL/FUNERAL; participant vested 20,000,000c"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan SH", allowed_hardship_reasons: ["MEDICAL", "FUNERAL"] }, as: RecordkeeperAdmin, captures: { pl_sh: "$.data.id" } }
            - { call: "POST /plans/${pl_sh}/participants", payload: { full_name: "Harbor Hank", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_sh: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_sh}/hardship-requests", payload: { reason_category: "TUITION", amount_cents: 100000 }, as: Participant, as_user_id: "${p_sh}", captures: { sh_err: "$.data.error_id" } }
          assert:
            - "captured sh_err == ERR_UNSAFE_HARBOR_REASON"

      - name: enrollment_under_nonexistent_plan_returns_plan_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Participant.fields.plan_id
          - errors[ERR_PLAN_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "Nested creation validates the parent first: POST /plans/{bad}/participants returns ERR_PLAN_NOT_FOUND even with a valid body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/participants", payload: { full_name: "Orphan Ora", vested_balance_cents: 1000000 }, as: RecordkeeperAdmin, captures: { or_err: "$.data.error_id" } }
          assert:
            - "captured or_err == ERR_PLAN_NOT_FOUND"

      - name: audit_events_immutable_and_append_only
        claim_type: immutability
        grounds:
          - entities.AuditEvent
          - endpoints["GET /plans/{id}/audit-events"]
        distinguishing_aspect: "AuditEvent carries no version/updated_at (common_fields false) and no endpoint mutates it; creating a plan appends PLAN_CREATED as the first row, and a subsequent enrollment appends PARTICIPANT_ENROLLED after it in created_at ASC order."
        test_recipe:
          setup: ["one plan with one participant"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Audit" }, as: RecordkeeperAdmin, captures: { pl_au: "$.data.id" } }
            - { call: "POST /plans/${pl_au}/participants", payload: { full_name: "Audit Amy", vested_balance_cents: 1000000 }, as: RecordkeeperAdmin }
          trigger:
            - { call: "GET /plans/${pl_au}/audit-events", payload: {}, as: Auditor, captures: { au_first: "$.data[0].action", au_second: "$.data[1].action", au_actor: "$.data[0].actor_role" } }
          assert:
            - "captured au_first == PLAN_CREATED"
            - "captured au_second == PARTICIPANT_ENROLLED"
            - "captured au_actor == RecordkeeperAdmin"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_loan_starts_requested_and_generates_chain_tasks
        claim_type: initial_state
        grounds:
          - state_machines.Loan
          - entities.Loan.fields.lifecycle_status
        distinguishing_aspect: "A freshly requested loan is REQUESTED with delinquency_status NONE, and exactly two PENDING ApprovalTasks exist (step_order 1 PLAN_SPONSOR, step_order 2 RECORDKEEPER_ADMIN) per the default chain."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Init" }, as: RecordkeeperAdmin, captures: { pl_in: "$.data.id" } }
            - { call: "POST /plans/${pl_in}/participants", payload: { full_name: "Init Ina", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_in: "$.data.id" } }
            - { call: "POST /participants/${p_in}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_in}", captures: { loan_in: "$.data.id" } }
          trigger:
            - { call: "GET /loans/${loan_in}", payload: {}, as: RecordkeeperAdmin, captures: { in_lc: "$.data.lifecycle_status", in_dq: "$.data.delinquency_status" } }
            - { call: "GET /loans/${loan_in}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { in_t1_role: "$.data[0].approver_role", in_t1_status: "$.data[0].status", in_t2_role: "$.data[1].approver_role", in_t2_status: "$.data[1].status" } }
          assert:
            - "captured in_lc == REQUESTED and in_dq == NONE"
            - "captured in_t1_role == PLAN_SPONSOR and in_t1_status == PENDING"
            - "captured in_t2_role == RECORDKEEPER_ADMIN and in_t2_status == PENDING"

      - name: withdraw_repaid_loan_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Loan.REQUESTED_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAW is only valid from REQUESTED; a REPAID (terminal) loan rejects withdraw with ERR_INVALID_STATE and fires no side effects."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed and fully repaid (85,607c + 941,682c remittances)"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan WD" }, as: RecordkeeperAdmin, captures: { pl_wd: "$.data.id" } }
            - { call: "POST /plans/${pl_wd}/participants", payload: { full_name: "Wd Will", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_wd: "$.data.id" } }
            - { call: "POST /participants/${p_wd}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_wd}", captures: { loan_wd: "$.data.id" } }
            - { call: "GET /loans/${loan_wd}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { wd_t1: "$.data[0].id", wd_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${wd_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${wd_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_wd}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_wd}/remittances", payload: { amount_cents: 85607, pay_date: "2026-06-01T00:00:00Z" }, as: PayrollProvider }
            - { call: "POST /participants/${p_wd}/remittances", payload: { amount_cents: 941682, pay_date: "2026-06-02T00:00:00Z" }, as: PayrollProvider }
          trigger:
            - { call: "POST /loans/${loan_wd}/withdraw", payload: {}, as: Participant, as_user_id: "${p_wd}", captures: { wd_err: "$.data.error_id" } }
          assert:
            - "captured wd_err == ERR_INVALID_STATE"
            - "Loan.${loan_wd}.lifecycle_status remains REPAID"

      - name: withdraw_paid_hardship_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.HardshipRequest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PAID is terminal: withdraw on a PAID hardship returns ERR_INVALID_STATE and the SuspensionRecord and TaxEvent produced by the payment remain."
        test_recipe:
          setup: ["1-step hardship chain plan; participant vested 20,000,000c; hardship 200,000c GROSS documented, approved, paid"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan HTerm", hardship_approval_chain: ["RECORDKEEPER_ADMIN"] }, as: RecordkeeperAdmin, captures: { pl_ht: "$.data.id" } }
            - { call: "POST /plans/${pl_ht}/participants", payload: { full_name: "Term Tara", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_ht: "$.data.id" } }
            - { call: "POST /participants/${p_ht}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_ht}", captures: { h_ht: "$.data.id" } }
            - { call: "POST /hardship-requests/${h_ht}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 200000 }, as: Participant, as_user_id: "${p_ht}" }
            - { call: "GET /hardship-requests/${h_ht}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { ht_t1: "$.data[0].id" } }
            - { call: "POST /approval-tasks/${ht_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /hardship-requests/${h_ht}/pay", payload: {}, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /hardship-requests/${h_ht}/withdraw", payload: {}, as: Participant, as_user_id: "${p_ht}", captures: { ht_err: "$.data.error_id" } }
          assert:
            - "captured ht_err == ERR_INVALID_STATE"
            - "HardshipRequest.${h_ht}.status remains PAID"

      - name: approval_out_of_order_decision_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ApprovalTask.PENDING_to_APPROVED
          - errors[ERR_APPROVAL_OUT_OF_ORDER]
        distinguishing_aspect: "Deciding step 2 (RECORDKEEPER_ADMIN) while step 1 (PLAN_SPONSOR) is still PENDING returns ERR_APPROVAL_OUT_OF_ORDER; both tasks remain PENDING."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan requested (tasks created, none decided)"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Order" }, as: RecordkeeperAdmin, captures: { pl_or: "$.data.id" } }
            - { call: "POST /plans/${pl_or}/participants", payload: { full_name: "Order Ollie", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_or: "$.data.id" } }
            - { call: "POST /participants/${p_or}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_or}", captures: { loan_or: "$.data.id" } }
            - { call: "GET /loans/${loan_or}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { or_t1: "$.data[0].id", or_t2: "$.data[1].id" } }
          trigger:
            - { call: "POST /approval-tasks/${or_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01", captures: { or_err: "$.data.error_id" } }
          assert:
            - "captured or_err == ERR_APPROVAL_OUT_OF_ORDER"
            - "ApprovalTask.${or_t1}.status == PENDING and ApprovalTask.${or_t2}.status == PENDING"
            - "Loan.${loan_or}.lifecycle_status == REQUESTED"

      - name: double_decision_on_task_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ApprovalTask
          - errors[ERR_TASK_ALREADY_DECIDED]
        distinguishing_aspect: "A task in APPROVED is terminal for decisions: a second decide call returns ERR_TASK_ALREADY_DECIDED even from the correct role."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan requested; step 1 APPROVED by sponsor-01"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Dbl" }, as: RecordkeeperAdmin, captures: { pl_db: "$.data.id" } }
            - { call: "POST /plans/${pl_db}/participants", payload: { full_name: "Dbl Deb", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_db: "$.data.id" } }
            - { call: "POST /participants/${p_db}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_db}", captures: { loan_db: "$.data.id" } }
            - { call: "GET /loans/${loan_db}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { db_t1: "$.data[0].id", db_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${db_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
          trigger:
            - { call: "POST /approval-tasks/${db_t1}/decide", payload: { decision: "REJECT" }, as: PlanSponsor, as_user_id: "sponsor-02", captures: { db_err: "$.data.error_id" } }
          assert:
            - "captured db_err == ERR_TASK_ALREADY_DECIDED"
            - "ApprovalTask.${db_t1}.status remains APPROVED"

      - name: loan_rejection_cancels_sibling_tasks
        claim_type: side_effect_execution
        grounds:
          - state_machines.Loan.REQUESTED_to_DENIED
          - state_machines.ApprovalTask.PENDING_to_CANCELLED
        distinguishing_aspect: "A REJECT at step 1 drives the loan to DENIED and cascades the still-PENDING step-2 task to CANCELLED; the loan can never be disbursed afterward."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan requested"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Rej" }, as: RecordkeeperAdmin, captures: { pl_rj: "$.data.id" } }
            - { call: "POST /plans/${pl_rj}/participants", payload: { full_name: "Rej Reed", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_rj: "$.data.id" } }
            - { call: "POST /participants/${p_rj}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_rj}", captures: { loan_rj: "$.data.id" } }
            - { call: "GET /loans/${loan_rj}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { rj_t1: "$.data[0].id", rj_t2: "$.data[1].id" } }
          trigger:
            - { call: "POST /approval-tasks/${rj_t1}/decide", payload: { decision: "REJECT" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /loans/${loan_rj}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { rj_err: "$.data.error_id" } }
          assert:
            - "Loan.${loan_rj}.lifecycle_status == DENIED"
            - "ApprovalTask.${rj_t2}.status == CANCELLED"
            - "captured rj_err == ERR_INVALID_STATE on the disburse attempt"

      - name: loan_auto_repaid_when_outstanding_hits_zero
        claim_type: valid_transition
        grounds:
          - state_machines.Loan.DISBURSED_to_REPAID
        distinguishing_aspect: "A single payoff remittance (1,027,289c covering all 12 scheduled installments) drives outstanding_principal_cents to exactly 0 and the system auto-transitions DISBURSED -> REPAID with no dedicated endpoint; remaining PENDING installments close."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed 2026-05-01"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Payoff" }, as: RecordkeeperAdmin, captures: { pl_po: "$.data.id" } }
