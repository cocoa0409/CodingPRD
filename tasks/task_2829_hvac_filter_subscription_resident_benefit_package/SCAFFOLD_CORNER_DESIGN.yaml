      - name: waiver_reversal_rounds_once_per_forfeited_row
        claim_type: precision
        grounds: [calculations.waiver_reversal_credit.precision]
        distinguishing_aspect: "One round_half_up per forfeited benefit row rather than a single rounding over the summed rows."
        excluded_because:
          difficulty_instance: "boundary_precision_check / evidence_score_exactly_at_confirm_threshold_passes_one_below_rejects"
          rationale: "Rounding-mode fidelity in this scaffold is already exercised at its sharpest point by that §1.8 instance, which pins the exact-rational weighted sum at the confirm threshold and one integer below it; a softer per-row rounding check adds no discriminating power."

      - name: monthly_fee_components_rounded_separately
        claim_type: tiered_pricing
        grounds: [calculations.monthly_fee_cents]
        distinguishing_aspect: "Three annual components each rounded after dividing by 12, then summed."
        excluded_because:
          difficulty_instance: "combinatorial_formula / monthly_fee_nested_rounding_per_component_not_on_the_sum"
          rationale: "That §1.8 instance already asserts 3546 against the rejected 3545 produced by summing first and rounding once, which is the only observable difference between the two orders."

      - name: settlement_waterfall_fills_the_credit_bucket_first
        claim_type: waterfall_allocation
        grounds: [calculations.cancellation_settlement]
        distinguishing_aspect: "Step 1's prorated credit is computed before the waiver tier is looked up and before the fee is relieved."
        excluded_because:
          difficulty_instance: "combinatorial_formula / cancellation_settlement_tier_keyed_on_gross_credit_not_on_net"
          rationale: "That §1.8 instance already walks all five steps in the pinned order and contrasts the correct net 324 against the -356 produced by keying the tier on the net settlement, which is the whole content of the waterfall claim here."

      - name: entitlement_set_recomputation_propagates_to_the_fee
        claim_type: constraint_propagation
        grounds: [calculations.benefit_entitlement_set, calculations.monthly_fee_cents]
        distinguishing_aspect: "Dropping the two rider codes re-prices the subscription and reaches a fixed point in one pass."
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_a_case_confirm_reaches_property_balance_five_links_deep"
          rationale: "That §1.8 instance already asserts the recomputed entitled_benefit_codes, the re-priced monthly_fee_cents 2546 and the two WAIVER_REVERSAL rows that follow from the same propagation, all in one request."

      - name: evidence_score_variants_diverge_on_the_same_fact
        claim_type: weighted_scoring
        grounds: [calculations.non_install_evidence_score.variants]
        distinguishing_aspect: "The runtime and survey variants score the same physical non-installation differently and carry different confirm thresholds."
        excluded_because:
          difficulty_instance: "dual_variant_calc / non_install_evidence_runtime_variant_vs_survey_variant_diverge"
          rationale: "That §1.8 instance already runs both variants against one subscription and asserts the divergent scores together with the divergent SUSPECT and CONFIRM thresholds."

      - name: settlement_variant_chosen_by_lifecycle_position
        claim_type: variant_selection
        grounds: [calculations.claim_settlement_amount.variants]
        distinguishing_aspect: "provisional_at_triage is frozen at triage while final_at_decision is recomputed at the decision instant."
        excluded_because:
          difficulty_instance: "dual_variant_calc / claim_settlement_provisional_at_triage_vs_final_at_decision_diverge"
          rationale: "That §1.8 instance already triages while COMPLIANT and decides after the posture became NON_INSTALL_SUSPECTED, asserting 30000 against 15000 on identical inputs — exactly the variant-selection claim."

  - section: validations
    instances:

      - name: list_limit_outside_one_to_one_hundred_returns_invalid_pagination
        claim_type: violation_to_error
        grounds: [validations.priority_6, errors.ERR_INVALID_PAGINATION, complexity_profile.pagination_defaults]
        distinguishing_aspect: "Priority 6 polices the declared window [1,100] on both edges and rejects a negative offset, while limit == 100 exactly is still legal."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "GET /subscriptions"
              payload: { limit: 101 }
              as: ProgramOperator
              captures: { err_over: "$.data.error_id" }
            - call: "GET /subscriptions"
              payload: { limit: 0 }
              as: ProgramOperator
              captures: { err_zero: "$.data.error_id" }
            - call: "GET /subscriptions"
              payload: { offset: -1 }
              as: ProgramOperator
              captures: { err_offset: "$.data.error_id" }
            - call: "GET /subscriptions"
              payload: { limit: 100, offset: 0 }
              as: ProgramOperator
          assert:
            - "limit 101 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit 0 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "offset -1 returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "limit 100 with offset 0 returns HTTP 200 with an empty data array, total_count == 0 and has_more == false"

