          - validations.priority_6_ERR_ACCOUNT_SCOPE_VIOLATION
          - roles.CustomerContact.id_semantics
        distinguishing_aspect: |
          CustomerContact is entity-backed, so authorisation is data-dependent:
          account A1's contact is refused both the read and the accept of a quote
          belonging to account A2 with 403 ERR_ACCOUNT_SCOPE_VIOLATION even
          though the row exists and is ISSUED, the scope check outranks the
          quote-state check that would otherwise fire on A1's own DRAFT quote,
          and A2's contact accepts the very same quote successfully.
