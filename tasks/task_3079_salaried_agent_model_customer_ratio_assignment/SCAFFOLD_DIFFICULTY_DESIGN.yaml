# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3079_salaried_agent_model_customer_ratio_assignment
#
# Machine-readable index of every difficulty feature §1.1–§1.7 claims, keyed to
# the nine Difficulty Rules of SKILL.md §0.5. Nine rule_id blocks, two instances
# each (>= 18 instances). §0.5 is authoritative for each rule's text and
# differentiation clause; this file only grounds them.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: listing_savings_pct_base_and_provisional_vs_final
        grounds:
          - calculations.listing_fee_and_savings
          - entities.ListingAgreement.fields.savings_pct
          - entities.ListingAgreement.fields.final_listing_fee_cents
        distinguishing_aspect: |
          The ListingAgreement domain exposes two valid algorithms whose results differ in
          KIND, not just in cents: the flat-rate variant charges
          round_half_up(list_price_cents * list_fee_rate_pct) = 750000, while the
          marginal-tier variant charges the same price at 0.015 / 0.0125 / 0.010 bands =
          875000 — a different number by a different construction, so savings_pct is
          ambiguous until the algorithm is pinned.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with traditional_commission_pct 0.025, one WA lead agent, one SELL client."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id, seattle_v0: $.data.version }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000, benefits_cents: 500000, expense_allowance_cents: 200000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id, lead_v0: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Sara Seller", email: "sara@x.com", service_area_code: "98101", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_id: $.data.id }
            - call: "POST /clients/${seller_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
              captures: { assignment_mode: $.data.assignment_mode, assignment_reason: $.data.assignment_reason, assignment_agent: $.data.assigned_agent_id }
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_before: $.data.version }
          trigger:
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_id}", list_price_cents: 60000000, list_fee_rate_pct: 0.0125, service_tier: "FULL_SERVICE", expected_region_version: "${seattle_v_before}" }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { agreement_id: $.data.id }
          assert:
            - "listing_agreements.gross_listing_fee_cents == 750000 (flat-rate variant)"
            - "the marginal-tier variant's band arithmetic over MARGINAL_TIER_BREAKS 50000000/100000000/200000000 at MARGINAL_TIER_RATES 0.015/0.0125/0.010 gives 750000 + 125000 = 875000"
            - "listing_agreements.traditional_listing_fee_cents == 1500000"
            - "listing_agreements.savings_amount_cents == 750000"
            - "listing_agreements.savings_pct == 0.5 (1500000 - 750000 over 1500000, the flat-rate variant)"
            - "the marginal-tier variant charges 875000 on the same price, so its savings_amount_cents would be 625000 and its savings_pct 0.4167 — savings_pct != 0.4167"
            - "listing_agreements.final_listing_fee_cents == 750000"

      - name: agent_bonus_csat_provisional_vs_final_weighting
        grounds:
          - calculations.salaried_bonus.variants.provisional_vs_final_csat
          - entities.Agent.fields.bonus_pct
          - entities.Survey.fields.bonus_eligible
        distinguishing_aspect: |
          The Agent domain's bonus_pct depends on which satisfaction_score variant is used:
          PROVISIONAL averages only RESPONDED surveys (mean 4.0, csat_component 0.24) while
          FINAL additionally applies the penalty whenever an answered survey carries
          bonus_eligible false (csat_component 0), giving 0.16. Two valid algorithms, two
          different bonus_cents for the identical close_rate and occupancy.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one WA lead agent, three closed transactions and three RESPONDED surveys — two scored 5 with bonus_eligible true and one scored 1 with bonus_eligible false."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000, benefits_cents: 500000, expense_allowance_cents: 200000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Buyer One", email: "b1@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { buyer1: $.data.id }
            - call: "POST /clients/${buyer1}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${buyer1}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx1: $.data.id }
            - call: "POST /transactions/${tx1}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 70000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx1}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /transactions/${tx1}/surveys"
              payload: { agent_id: "${lead_id}", score: 5 }
              as: TransactionCoordinator
              captures: { sv1: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Buyer Two", email: "b2@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { buyer2: $.data.id }
            - call: "POST /clients/${buyer2}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${buyer2}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx2: $.data.id }
            - call: "POST /transactions/${tx2}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 80000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx2}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /transactions/${tx2}/surveys"
              payload: { agent_id: "${lead_id}", score: 5 }
              as: TransactionCoordinator
            - call: "POST /clients"
              payload: { full_name: "Buyer Three", email: "b3@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { buyer3: $.data.id }
            - call: "POST /clients/${buyer3}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${buyer3}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx3: $.data.id }
            - call: "POST /transactions/${tx3}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 90000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx3}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /transactions/${tx3}/surveys"
              payload: { agent_id: "${lead_id}" }
              as: TransactionCoordinator
              captures: { sv3: $.data.id }
            - call: "POST /regions/${seattle_id}/run-ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /regions/${seattle_id}/run-ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /surveys/${sv3}/respond"
              payload: { score: 1 }
              as: TransactionCoordinator
          trigger:
            - call: "GET /agents/${lead_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Agent.${lead_id}.satisfaction_score == 3.67"
            - "Agent.${lead_id}.bonus_pct == 0.25 (FINAL variant: csat_component zeroed by the bonus_eligible-false survey, 0.2*1.0 + 0.1*min(0.5,1.0))"
            - "the PROVISIONAL variant on the same data would report bonus_pct 0.3601 (csat_component 0.15*0.734) — bonus_pct != 0.3601"
            - "Agent.${lead_id}.bonus_cents == 2000000"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a) and (b)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: region_occupancy_nested_min_max_non_linear_mode_a
        grounds:
          - calculations.region_occupancy
          - calculations.salaried_bonus.constants.BONUS_OCCUPANCY_WEIGHT
          - entities.Region.fields.occupancy_pct
        distinguishing_aspect: |
          Mode (a): the occupancy band and the bonus occupancy component take three inputs
          (active agent count, region client demand, target ratio) through a nested
          min() together with two threshold branches, so occupancy_pct 1.25 contributes
          0.2*min(1.25, 1.0) = 0.20 in the same evaluation as the veto branch that routes the region
          into the OVER_TARGET band — a non-linear interaction no single-threshold formula
          reproduces.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with target_client_ratio 2.0 and two active lead agents; five clients in the region, so occupancy_pct is 5 / (2 * 2.0) = 1.25."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_a: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ben Lead", agent_kind: "LEAD", home_zip: "98102", base_salary_cents: 7000000 }
              as: PlatformAdmin
              captures: { lead_b: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ref Client", email: "refc@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { ref_client: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C One", email: "c1@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c1: $.data.id }
            - call: "POST /clients/${c1}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Two", email: "c2@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c2: $.data.id }
            - call: "POST /clients/${c2}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Three", email: "c3@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c3: $.data.id }
            - call: "POST /clients/${c3}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Four", email: "c4@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c4: $.data.id }
            - call: "POST /clients/${c4}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_before: $.data.version, occupancy_before: $.data.occupancy_pct, band_before: $.data.occupancy_band }
          trigger:
            - call: "POST /referrals"
              payload: { client_id: "${ref_client}", partner_name: "Cascade Realty", referral_fee_bps: 1500, split_policy: "SPLIT_50_PARTNER", expected_region_version: "${seattle_v_before}" }
              as: OperationsCoordinator
              captures: { referral_id: $.data.id }
          assert:
            - "Region.${seattle_id}.clients_in_pipeline == 5"
            - "Region.${seattle_id}.agent_count == 2"
            - "occupancy_before == 1.25 and band_before == OVER_TARGET (the 1.25 veto-band ceiling is INCLUSIVE, so 1.25 is still in the band)"
            - "Region.${seattle_id}.open_referral_count == 1 and Region.${seattle_id}.referral_count == 1 after the referral (immediate re-derivation inside the same request)"

      - name: nested_rounding_order_divergence_on_tour_load_mode_b
        grounds:
          - calculations.listing_service_commitment.rounding_order
          - calculations.listing_service_commitment.constants.TRAILING_SLICE_HOURS
          - entities.ListingAgreement.fields.gross_listing_fee_cents
        distinguishing_aspect: |
          Mode (b): the service-commitment tuning splits list_price_cents across the
          TRAILING_SLICE_BREAKS 33333333 / 100000000 / 200000000 and rounds EACH slice to
          whole hours before summing. For list_price_cents 100000019 the per-slice order
          yields 490000 + 753333 + 0 = 1243333 while summing the raw products first
          (1243333.5029) rounds once to 1243334 — the two orders genuinely diverge here and
          the scaffold pins round-per-slice-then-sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region, one WA lead agent, one SELL client assigned to that agent."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sara Seller", email: "sara@x.com", service_area_code: "98101", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_id: $.data.id }
            - call: "POST /clients/${seller_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_before: $.data.version }
          trigger:
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_id}", list_price_cents: 62000001, list_fee_rate_pct: 0.0125, service_tier: "LIMITED_SERVICE", expected_region_version: "${seattle_v_before}" }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { agreement_id: $.data.id }
          assert:
            - "ListingAgreement.${agreement_id}.gross_listing_fee_cents == 775000"
            - "the service-commitment tuning over TRAILING_SLICE_BREAKS at TRAILING_SLICE_HOURS is 490000 + 753333 + 0 = 1243333 under the pinned round-per-slice-then-sum order"
            - "the sum-then-round order reports 1243334 for the same list_price_cents — the two orders are NOT equal here, so the pin is observable"
            - "the persisted fee is separately pinned by the flat rate: gross_listing_fee_cents == 775000"
            - "ListingAgreement.${agreement_id}.service_commitment_hours == 48 (LIMITED_SERVICE)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shapes on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: lead_capacity_compound_posture_derived_from_open_client_count_children
        grounds:
          - state_machines.LeadCapacity
          - calculations.lead_capacity_band
          - entities.OpenClientCount.fields.ratio_state
        distinguishing_aspect: |
          LeadCapacity is compound: its current_state is never assigned by a caller, it is
          re-derived from the OpenClientCount child row on every change, so the SAME entity
          walks OPEN -> AT_CAPACITY and back to OPEN as that child's integer crosses the
          floor and ceil of target_client_ratio — a derived aggregate posture, not a linear
          pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with target_client_ratio 1.5, one lead agent with zero clients and an OPEN capacity posture."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 1.5, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C One", email: "c1@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /clients/${c1}/assign-agent"
              payload: {}
              as: OperationsCoordinator
          assert:
            - "after the first assignment OpenClientCount.${lead_id}.active_client_count == 1"
            - "OpenClientCount.${lead_id}.ratio_state == ON_TARGET (count_normalized: 1 >= floor(1.5))"
            - "LeadCapacity.${lead_id}.current_state == AT_CAPACITY (1 >= floor(1.5))"
            - "Agent.${lead_id}.status == AT_CAPACITY (1 >= floor(1.5), the floor threshold — NOT the ceil 2)"
            - "the absolute_deficit variant would report UNDER_TARGET here, because 1 < 1.5 — ratio_state != UNDER_TARGET"

      - name: agent_referral_cyclic_late_price_supersession_round
        grounds:
          - state_machines.AgentReferral
          - calculations.referrer_split
          - entities.AgentReferral.fields.settlement_status
        distinguishing_aspect: |
          AgentReferral loops COMPUTED -> PENDING -> COMPUTED on a late contract price,
          re-deriving referral_fee_cents in place each round with no settlement postings, so
          the partner/house conservation holds across every cycle — a cyclic machine, not a
          one-way settlement pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, one client referred to a partner at 1500 bps with the 50/50 split policy."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Omar Overflow", email: "omar@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { overflow_client: $.data.id }
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_before: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${overflow_client}", partner_name: "Cascade Realty", referral_fee_bps: 1500, split_policy: "SPLIT_50_PARTNER", expected_region_version: "${seattle_v_before}" }
              as: OperationsCoordinator
              captures: { referral_id: $.data.id }
          trigger:
            - call: "POST /referrals/${referral_id}/reconcile"
              payload: { contract_price_cents: 100000000 }
              as: TransactionCoordinator
            - call: "POST /referrals/${referral_id}/reconcile"
              payload: { contract_price_cents: 90000000 }
              as: TransactionCoordinator
          assert:
            - "after the first reconcile AgentReferral.${referral_id}.settlement_status == COMPUTED"
            - "after the first reconcile AgentReferral.${referral_id}.referral_fee_cents == 15000000"
            - "after the second reconcile AgentReferral.${referral_id}.settlement_status == COMPUTED (the cyclic supersession round returns to COMPUTED, not SETTLED)"
            - "after the second reconcile AgentReferral.${referral_id}.referral_fee_cents == 13500000"
            - "AgentReferral.${referral_id}.partner_cents + AgentReferral.${referral_id}.house_cents == AgentReferral.${referral_id}.referral_fee_cents exactly (6750000 + 6750000 == 13500000)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggering transitions
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: client_closure_cascade_unwinds_agent_capacity_three_hops
        grounds:
          - state_machines.Client.transitions.IN_TRANSACTION_to_CLOSED
          - state_machines.LeadCapacity.transitions.AT_CAPACITY_to_OPEN
          - calculations.lead_capacity_band
          - entities.OpenClientCount.fields.ratio_state
        distinguishing_aspect: |
          Depth 4: closing a transaction itself releases the client's capacity, which itself
          re-derives the child ratio_state, which itself demotes LeadCapacity, which itself
          rewrites Agent.status and the region's agent_count. Hops 2–4 do not fire unless
          hop 1 changed the child count, so this is a true chain rather than a fan-out.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with target_client_ratio 1.0, one lead agent, two clients assigned to that agent (agent at AT_CAPACITY), the second client in an open transaction already at REVIEW."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 1.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Close Me", email: "close@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_a: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Stay Open", email: "stay@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_b: $.data.id }
            - call: "POST /clients/${client_a}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_b}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_a}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_a: $.data.id }
            - call: "POST /transactions/${tx_a}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 80000000 }
              as: TransactionCoordinator
          trigger:
            - call: "POST /transactions/${tx_a}/close"
              payload: {}
              as: TransactionCoordinator
          assert:
            - "hop 1: OpenClientCount.${lead_id}.active_client_count == 1 (was 2)"
            - "hop 2: OpenClientCount.${lead_id}.ratio_state == UNDER_TARGET"
            - "hop 3: LeadCapacity.${lead_id}.current_state == OPEN"
            - "hop 3: Agent.${lead_id}.status == ACTIVE"
            - "hop 4: GET /regions/${seattle_id} reports agent_count == 1"
            - "hop 4: GET /regions/${seattle_id}/activity-audits returns a row of kind CLIENT_CAPACITY_RELEASED whose entity_ref_id == ${lead_id}"
            - "Client.${client_a}.status == CLOSED"

      - name: tour_completion_cascade_reaches_capacity_posture_five_hops
        grounds:
          - state_machines.Tour.transitions.CONFIRMED_to_COMPLETED
          - state_machines.Survey.transitions.DISPATCHED_to_RESPONDED
          - calculations.agent_satisfaction_score
          - calculations.agent_salary_commitment
        distinguishing_aspect: |
          Depth 5 from a different trigger: completing a tour itself creates a survey, whose
          creation itself moves the agent's satisfaction_score, whose move itself recomputes
          the bonus, whose recompute itself rewrites LeadCapacity and the salary commitment.
          Each hop is caused by the previous one, and the trigger (a tour transition) is
          disjoint from the client-closure trigger of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, one associate agent, one client assigned to the lead agent with a confirmed tour."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000, benefits_cents: 500000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ann Associate", agent_kind: "ASSOCIATE", home_zip: "98102", base_salary_cents: 6000000, benefits_cents: 400000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tina Tour", email: "tina@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_t: $.data.id }
            - call: "POST /clients/${client_t}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_t}/transactions"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /tours"
              payload: { client_id: "${client_t}", associate_agent_id: "${assoc_id}", scheduled_at: "2026-09-02T10:00:00Z", access_instructions: "Lockbox 4821 at the side gate" }
              as: OperationsCoordinator
              captures: { tour_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours/${tour_id}/confirm"
              payload: {}
              as: AssociateAgent
              as_user_id: "${assoc_id}"
          trigger:
            - call: "POST /tours/${tour_id}/complete"
              payload: { feedback_rating: 5, feedback_notes: "Bright and quiet" }
              as: AssociateAgent
              as_user_id: "${assoc_id}"
          assert:
            - "hop 1: Tour.${tour_id}.status == COMPLETED"
            - "hop 2: GET /surveys?agent_id=${lead_id} returns exactly 1 row with response_status RESPONDED and bonus_eligible true"
            - "hop 3: Agent.${lead_id}.satisfaction_score == 5.0"
            - "hop 4: Agent.${lead_id}.bonus_pct == 0.4 and bonus_cents == 3200000 (close_rate 0.0, csat 1.0, occupancy 1.0)"
            - "hop 5: Agent.${lead_id}.salary_commitment_cents == 9900000 (8000000 + 1400000 + 500000), and LeadCapacity.${lead_id}.current_state == OPEN"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: referral_priority_6a_referential_out_ranks_8_fiscal
        grounds:
          - validations[priority=6a]
          - validations[priority=8]
          - errors.ERR_REGION_CAPACITY_EXCEEDED
          - errors.ERR_CONTRACT_PRICE_MISSING
        distinguishing_aspect: |
          Category pair business_referential (priority 6a) vs business_fiscal (priority 8):
          a referral-settlement request that both sits outside the region's open-referral
          capacity AND targets a referral with no contract price must answer with 6a's
          ERR_REGION_CAPACITY_EXCEEDED, not 8's ERR_CONTRACT_PRICE_MISSING, because 6a
          runs first.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with capacity 1, one lead agent, one client already referred (open_referral_count is at capacity)."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 1 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Omar Overflow", email: "omar@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { overflow_client: $.data.id }
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_before: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${overflow_client}", partner_name: "Cascade Realty", referral_fee_bps: 1500, split_policy: "SPLIT_50_PARTNER", expected_region_version: "${seattle_v_before}" }
              as: OperationsCoordinator
              captures: { referral_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Priya Overflow", email: "priya@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { overflow_client_2: $.data.id }
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_2: $.data.version }
          trigger:
            - call: "POST /referrals"
              payload: { client_id: "${overflow_client_2}", partner_name: "Pierce Realty", referral_fee_bps: 1500, split_policy: "SPLIT_50_PARTNER", expected_region_version: "${seattle_v_2}" }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id == ERR_REGION_CAPACITY_EXCEEDED"
            - "the trigger does NOT return ERR_CONTRACT_PRICE_MISSING, which is also violated on this request and sits two priorities lower at 8"
            - "GET /regions/${seattle_id}/referrals returns exactly 1 row and Region.${seattle_id}.open_referral_count == 1"

      - name: tour_priority_5_temporal_out_ranks_6_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_TOUR_SCHEDULE_CONFLICT
          - errors.ERR_ASSOCIATE_AGENT_REQUIRED
        distinguishing_aspect: |
          Category pair business_temporal (priority 5) vs business_safety (priority 6): a
          tour scheduled into a slot that collides with the lead agent's existing tour AND
          that omits the mandatory associate agent must answer with 5's
          ERR_TOUR_SCHEDULE_CONFLICT, not 6's ERR_ASSOCIATE_AGENT_REQUIRED, because the
          temporal rule runs first.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with target_client_ratio 1.0 (block threshold 1), one lead agent, two clients assigned to that agent, one tour already scheduled."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 1.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ann Associate", agent_kind: "ASSOCIATE", home_zip: "98102", base_salary_cents: 6000000 }
              as: PlatformAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Tina Tour", email: "tina@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Uma View", email: "uma@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_u: $.data.id }
            - call: "POST /clients/${client_t}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_u}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /tours"
              payload: { client_id: "${client_t}", associate_agent_id: "${assoc_id}", scheduled_at: "2026-09-02T10:00:00Z", access_instructions: "Lockbox 4821" }
              as: OperationsCoordinator
              captures: { tour_1: $.data.id }
          trigger:
            - call: "POST /tours"
              payload: { client_id: "${client_u}", scheduled_at: "2026-09-02T10:30:00Z", access_instructions: "Front desk will release the key" }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "the trigger returns 409 with error_id == ERR_TOUR_SCHEDULE_CONFLICT"
            - "the trigger does NOT return ERR_ASSOCIATE_AGENT_REQUIRED, which is also violated because the lead agent's UniServicedTourCount is 1 at the block threshold of 1"
            - "GET /tours?lead_agent_id=${lead_id} still returns exactly 1 row"
            - "response_type is error and data carries both error_id and message"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: occupancy_ratio_band_edge_is_inclusive_at_one_point_two_five
        grounds:
          - calculations.region_occupancy.constants.OVER_TARGET_VETO_CEILING
          - entities.Region.fields.occupancy_band
          - calculations.lead_capacity_band.constants.DEFAULT_TARGET_CLIENT_RATIO
        distinguishing_aspect: |
          A numeric threshold crossing on its own metric and endpoint: Region.occupancy_band
          is OVER_TARGET at occupancy_pct 1.25 and drops to NEAR_TARGET at 1.26, so the
          veto ceiling is inclusive — the exact boundary, not one step away from it, is the
          test.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with target_client_ratio 2.0, two lead agents, and five unassigned clients — occupancy_pct 1.25 exactly."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102", "98103"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_a: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ben Lead", agent_kind: "LEAD", home_zip: "98102", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_b: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C One", email: "c1@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Two", email: "c2@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Three", email: "c3@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Four", email: "c4@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
            - call: "POST /clients"
              payload: { full_name: "C Five", email: "c5@x.com", service_area_code: "98103", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c5: $.data.id }
          trigger:
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { occ_five: $.data.occupancy_pct, band_five: $.data.occupancy_band }
            - call: "POST /clients"
              payload: { full_name: "C Six", email: "c6@x.com", service_area_code: "98103", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { c6: $.data.id }
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { occ_six: $.data.occupancy_pct, band_six: $.data.occupancy_band }
          assert:
            - "occ_five == 1.25 and band_five == OVER_TARGET (the veto ceiling is inclusive — 1.25 is still vetoed)"
            - "occ_six == 1.5 and band_six == NEAR_TARGET (1.5 is above the 1.25 veto ceiling, so the veto band no longer applies)"
            - "the 1.00 edge is separately inclusive: at occupancy_pct 1.0 the band is OVER_TARGET, not NEAR_TARGET"

      - name: first_assignment_boundary_at_floor_versus_ceil
        grounds:
          - calculations.lead_capacity_band.formula
          - entities.LeadCapacity.fields.current_state
          - errors.ERR_NO_ELIGIBLE_AGENT
        distinguishing_aspect: |
          A zero/empty-collection edge on a different metric and endpoint: the first
          assignment onto a freshly seeded agent moves active_client_count from 0 to exactly
          1, which is >= floor(1.5) so the agent leaves the OPEN posture immediately and the
          very next selector call finds an empty candidate pool (ERR_NO_ELIGIBLE_AGENT) —
          the boundary is the first unit, not a large count.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with target_client_ratio 1.5, one lead agent with active_client_count 0, one unassigned client."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 1.5, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "First Buyer", email: "first@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_first: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Second Buyer", email: "second@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_second: $.data.id }
          trigger:
            - call: "POST /clients/${client_first}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_second}/assign-agent"
              payload: {}
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the first assignment succeeds: Client.${client_first}.status == ASSIGNED and assigned_agent_id == ${lead_id}"
            - "OpenClientCount.${lead_id}.active_client_count == 1 — the boundary is the FIRST client, not a larger count"
            - "LeadCapacity.${lead_id}.current_state == OPEN at count 1 (1 < floor(3.0))"
            - "the second assignment returns 409 with error_id == ERR_NO_ELIGIBLE_AGENT (the candidate pool is empty because the only agent left OPEN already)"
            - "Client.${client_second}.status == UNASSIGNED"
            - "the client-create endpoint is unaffected: POST /clients with no assignment still returns 201"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: tour_requires_client_in_assigned_state
        grounds:
          - state_machines.Tour.transitions.ACCESS_PENDING_to_ACCESS_PENDING
          - entities.Tour.fields.lead_agent_id
          - state_machines.Client.transitions.UNASSIGNED_to_ASSIGNED
          - validations[priority=4]
        distinguishing_aspect: |
          Cross-entity pair Tour -> Client: a tour can only be scheduled while the client is
          in ASSIGNED (or IN_TRANSACTION); the moment the client is dropped to UNASSIGNED
          the same tour request is refused with ERR_INVALID_STATE even though nothing about
          the tour request itself changed. A different entity pair from the sibling
          instance's Agreement -> Client dependency.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, one client left UNASSIGNED."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Unassigned Buyer", email: "un@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_unassigned: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Assigned Buyer", email: "as@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_assigned: $.data.id }
            - call: "POST /clients/${client_assigned}/assign-agent"
              payload: {}
              as: OperationsCoordinator
          trigger:
            - call: "POST /tours"
              payload: { client_id: "${client_unassigned}", scheduled_at: "2026-09-02T10:00:00Z", access_instructions: "Lockbox 4821" }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
            - call: "POST /tours"
              payload: { client_id: "${client_assigned}", scheduled_at: "2026-09-02T10:00:00Z", access_instructions: "Lockbox 4821" }
              as: OperationsCoordinator
              captures: { tour_id: $.data.id }
          assert:
            - "the first request returns 409 with error_id == ERR_INVALID_STATE because Client.${client_unassigned}.status == UNASSIGNED"
            - "the second request returns 201 with Tour.${tour_id}.lead_agent_id == ${lead_id} (the client's ASSIGNED state supplied the agent)"
            - "GET /tours?client_id=${client_unassigned} returns 0 rows"

      - name: listing_agreement_requires_sell_client_and_live_listing_pair
        grounds:
          - state_machines.ListingAgreement.transitions.DRAFT_to_ACTIVE
          - state_machines.ListingAgreement.transitions.ACTIVE_to_UNDER_CONTRACT
          - entities.ListingAgreement.fields.client_id
          - validations[priority=7]
        distinguishing_aspect: |
          Cross-entity pair ListingAgreement -> Client: publishing is admitted only while
          the client sits in {UNASSIGNED, ASSIGNED, IN_TRANSACTION}, and accepting an offer
          is refused outright once that client already carries a CLOSED transaction. This is
          a second, disjoint entity pair from the Tour -> Client dependency.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, two SELL clients."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sara Seller", email: "sara@x.com", service_area_code: "98101", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_id: $.data.id }
            - call: "POST /clients/${seller_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_1: $.data.version }
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_id}", list_price_cents: 60000000, list_fee_rate_pct: 0.0125, service_tier: "FULL_SERVICE", expected_region_version: "${seattle_v_1}" }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /listing-agreements/${agreement_id}/publish"
              payload: {}
              as: ListingAgent
              as_user_id: "${lead_id}"
            - call: "POST /clients/${seller_id}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_s: $.data.id }
            - call: "POST /transactions/${tx_s}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 60000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx_s}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /listing-agreements/${agreement_id}/accept-offer"
              payload: { contract_price_cents: 61000000 }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the trigger returns 409 with error_id == ERR_INVALID_STATE because Client.${seller_id}.status == CLOSED"
            - "ListingAgreement.${agreement_id}.status == CLOSED (the cascade from the transaction close already moved it) — not UNDER_CONTRACT"
            - "the same accept-offer on a listing whose client is still IN_TRANSACTION would succeed — the dependency is on the client's state, not on the request"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: lead_agent_block_window_adjacency_rule_with_buffer_on_tours
        grounds:
          - state_machines.Tour.transitions.ACCESS_PENDING_to_ACCESS_PENDING
          - errors.ERR_TOUR_SCHEDULE_CONFLICT
          - entities.Tour.fields.scheduled_at
        distinguishing_aspect: |
          Interval semantics: a lead agent's tour occupies a half-open block window
          [scheduled_at, scheduled_at + 60 minutes) with NO buffer, so a tour starting exactly
          60 minutes after the first begins (10:00 and 11:00) is ACCEPTED while one starting
          at 10:59 is REJECTED — the adjacency edge is the whole rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, four clients assigned to that agent."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102", "98103", "98104"], traditional_commission_pct: 0.025, target_client_ratio: 4.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "A Client", email: "a@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_a: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "B Client", email: "b@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_b: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C Client", email: "c@x.com", service_area_code: "98103", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_c: $.data.id }
            - call: "POST /clients/${client_a}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_b}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_c}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /tours"
              payload: { client_id: "${client_a}", scheduled_at: "2026-09-02T10:00:00Z", access_instructions: "Lockbox 1000" }
              as: OperationsCoordinator
              captures: { tour_base: $.data.id }
          trigger:
            - call: "POST /tours"
              payload: { client_id: "${client_b}", scheduled_at: "2026-09-02T10:59:00Z", access_instructions: "Lockbox 1001" }
              as: OperationsCoordinator
              captures: { error_id: $.data.error_id }
            - call: "POST /tours"
              payload: { client_id: "${client_c}", scheduled_at: "2026-09-02T11:00:00Z", access_instructions: "Lockbox 1002" }
              as: OperationsCoordinator
              captures: { tour_adjacent: $.data.id }
          assert:
            - "the 10:59 request returns 409 with error_id == ERR_TOUR_SCHEDULE_CONFLICT (it falls inside [10:00, 11:00))"
            - "the 11:00 request returns 201 with Tour.${tour_adjacent}.status == ACCESS_PENDING — the windows are half-open with no buffer, so exact adjacency is allowed"
            - "GET /tours?lead_agent_id=${lead_id} returns exactly 2 rows"

      - name: listing_registration_window_contiguous_no_gap_and_refuses_back_to_back
        grounds:
          - endpoints.POST_/listing-agreements/{id}/register
          - calculations.listing_service_commitment
          - entities.ListingAgreement.fields.service_commitment_hours
        distinguishing_aspect: |
          Different interval semantics on a different resource: listing registration windows
          must leave NO unregistered gap between adjacent windows, so a 14-day window and a
          second 14-day window that starts 20 days later is refused while one starting
          exactly 14 days later is accepted — a gap rule on a half-open window set, not the
          half-open collision rule of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region with enrolment_is_required true, one lead agent, one SELL client with an ACTIVE listing agreement."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10, enrolment_is_required: true }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Sara Seller", email: "sara@x.com", service_area_code: "98101", need_kind: "SELL" }
              as: OperationsCoordinator
              captures: { seller_id: $.data.id }
            - call: "POST /clients/${seller_id}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_1: $.data.version }
            - call: "POST /listing-agreements"
              payload: { client_id: "${seller_id}", list_price_cents: 60000000, list_fee_rate_pct: 0.0125, service_tier: "FULL_SERVICE", expected_region_version: "${seattle_v_1}" }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { agreement_id: $.data.id }
            - call: "POST /listing-agreements/${agreement_id}/publish"
              payload: {}
              as: ListingAgent
              as_user_id: "${lead_id}"
            - call: "POST /listing-agreements/${agreement_id}/register"
              payload: { enrolment_acknowledged: true, window_days: 14 }
              as: ListingAgent
              as_user_id: "${lead_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /listing-agreements/${agreement_id}/register"
              payload: { enrolment_acknowledged: true, window_days: 14 }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { window_2_status: $.data.status }
            - call: "POST /listing-agreements/${agreement_id}/register"
              payload: { enrolment_acknowledged: false, window_days: 14 }
              as: ListingAgent
              as_user_id: "${lead_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the window starting exactly 14 days after the first is ACCEPTED (contiguous, no gap) — the listing now carries two adjacent registration windows"
            - "the request that does not acknowledge enrolment returns 409 with error_id == ERR_ENROLMENT_NOT_CONFIRMED because Region.${seattle_id}.enrolment_is_required is true"
            - "the accepted window request returned 200 with window_2_status == ACTIVE, the agreement's status after registration"
            - "GET /listing-agreements/${agreement_id} reports service_commitment_hours unchanged at 24 (FULL_SERVICE) across both registrations, and the refused request leaves it at 24"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: referral_partner_and_house_split_conserves_contract_price_basis
        grounds:
          - calculations.referrer_split
          - entities.AgentReferral.fields.referral_fee_cents
          - state_machines.AgentReferral.transitions.COMPUTED_to_COMPUTED
        distinguishing_aspect: |
          Conserved quantity: the money. partner_cents + house_cents == fee_cents holds as an
          exact integer equality after every supply (reconcile) / compensate (re-settle on a
          late price) round, so a compensating re-derivation leaves no cent of drift in the
          referral ledger.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, one client referred to a partner at 1500 bps with the 50/50 split policy."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Omar Overflow", email: "omar@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { overflow_client: $.data.id }
            - call: "GET /regions/${seattle_id}"
              payload: {}
              as: PlatformAdmin
              captures: { seattle_v_before: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${overflow_client}", partner_name: "Cascade Realty", referral_fee_bps: 1500, split_policy: "SPLIT_50_PARTNER", expected_region_version: "${seattle_v_before}" }
              as: OperationsCoordinator
              captures: { referral_id: $.data.id }
          trigger:
            - call: "POST /referrals/${referral_id}/reconcile"
              payload: { contract_price_cents: 99999 }
              as: TransactionCoordinator
            - call: "POST /referrals/${referral_id}/reconcile"
              payload: { contract_price_cents: 100001 }
              as: TransactionCoordinator
          assert:
            - "after the first supply AgentReferral.${referral_id}.referral_fee_cents == 15000 and partner_cents + house_cents == 15000 exactly"
            - "after the compensating re-derivation AgentReferral.${referral_id}.referral_fee_cents == 15000 and partner_cents + house_cents == 15000 exactly (no drift)"
            - "the float-split order would divide one cent differently across the two rounds — the invariant is what forbids it"
            - "AgentReferral.${referral_id}.settlement_status == COMPUTED"

      - name: transaction_close_reopen_preserves_agent_satisfaction_credit_ledger
        grounds:
          - calculations.transaction_satisfaction_credit
          - state_machines.Client.transitions.CLOSED_to_IN_TRANSACTION
          - entities.Transaction.fields.agent_satisfaction_credit
        distinguishing_aspect: |
          Conserved quantity: the credited satisfaction count. A forward close and its
          compensating re-open 180+ days later must leave the agent's credited-satisfaction
          total unchanged (the credit is zero for the re-open) while the compensating path
          also leaves close_rate's denominator consistent — drift in either would be visible.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One WA region, one lead agent, one client whose transaction is already CLOSED with a contract price."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Seattle", service_area_codes: ["98101", "98102"], traditional_commission_pct: 0.025, target_client_ratio: 2.0, capacity: 10 }
              as: PlatformAdmin
              captures: { seattle_id: $.data.id }
            - call: "POST /agents"
              payload: { region_id: "${seattle_id}", full_name: "Ada Lead", agent_kind: "LEAD", home_zip: "98101", base_salary_cents: 8000000 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Repeat Buyer", email: "repeat@x.com", service_area_code: "98101", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { repeat_client: $.data.id }
            - call: "POST /clients/${repeat_client}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${repeat_client}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_1: $.data.id }
            - call: "POST /transactions/${tx_1}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 75000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx_1}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clients/${repeat_client}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_2: $.data.id }
          assert:
            - "Client.${repeat_client}.status == IN_TRANSACTION"
            - "Transaction.${tx_2}.agent_satisfaction_credit == 0.05"
            - "Agent.${lead_id}.close_rate == 1.0 — the uncompensated lifetime credit total is unchanged by the re-open"
            - "the boundary is inclusive: at exactly 180 days before now the credit is still 0.05, at 2027-03-04T23:59:59Z it would be 0.0"
            - "Agent.${lead_id}.bonus_pct == 0.15 and bonus_cents == 1200000 (close_rate 1.0, satisfaction 5.0, occupancy min(1.0,1.0))"