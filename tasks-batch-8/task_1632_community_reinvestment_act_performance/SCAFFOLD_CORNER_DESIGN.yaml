      - name: exam_window_end_before_start_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "evaluation_window_end earlier than evaluation_window_start is rejected ERR_INVALID_WINDOW 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-12-31", evaluation_window_end: "2024-01-01" }
              as: BankExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_WINDOW with http 400"

      - name: duplicate_area_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_AREA_CODE]"]
        distinguishing_aspect: "A second area with an existing area_code fails ERR_DUPLICATE_AREA_CODE 409 even when msa_code and tracts differ."
        test_recipe:
          setup: ["Area AA-DUP exists"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-DUP", name: "First", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
          trigger:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-DUP", name: "Second", msa_code: "12060", state_code: "GA", census_tracts: ["T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_AREA_CODE with http 409"

      - name: branch_close_notice_under_90_days_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CLOSURE_NOTICE_SHORT]"]
        distinguishing_aspect: "Notice posted 2026-05-04 is 89 days before the 2026-08-01 logical clock — one day short of the 90-day minimum; ERR_CLOSURE_NOTICE_SHORT 422. (2026-05-03 would be exactly 90 and pass.)"
        test_recipe:
          setup: ["AssessmentArea ACTIVE; branch OPEN"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-V6", name: "Notice Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-N", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "MIDDLE" }
              as: BankExecutive
              captures: { br_id: $.data.id }
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
          trigger:
            - call: "POST /cra/branches/${br_id}/close"
              payload: { notice_posted_date: "2026-05-04" }
              as: BankExecutive
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLOSURE_NOTICE_SHORT with http 422; branch remains OPEN"

      - name: second_public_file_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PUBLIC_FILE_EXISTS]"]
        distinguishing_aspect: "The public file is a singleton; a second POST fails ERR_PUBLIC_FILE_EXISTS 409."
        test_recipe:
          setup: ["PublicFile already exists"]
          setup_api_calls:
            - call: "POST /cra/public-files"
              payload: { bank_name: "First Bank" }
              as: CRAOfficer
          trigger:
            - call: "POST /cra/public-files"
              payload: { bank_name: "Second Bank" }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PUBLIC_FILE_EXISTS with http 409"

      - name: existence_checked_before_business_rules
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]", "errors[ERR_EXAM_CYCLE_NOT_FOUND]"]
        distinguishing_aspect: "begin-fieldwork on a non-existent exam id returns ERR_EXAM_CYCLE_NOT_FOUND (existence, priority 3) even though no COMPLETE public file exists (business_safety, priority 5, would also fail)."
        test_recipe:
          setup: ["empty database (no public file at all)"]
          setup_api_calls: []
          trigger:
            - call: "POST /cra/exam-cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/begin-fieldwork"
              payload: {}
              as: BankExaminer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EXAM_CYCLE_NOT_FOUND with http 404 (existence beats business_safety)"

      - name: area_period_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_AREA_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: area_period_half_open_adjacency_allowed
          rationale: "Half-open overlap rejection asserted in the named §1.8 instance."

      - name: exam_window_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXAM_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: exam_window_closed_interval_date_sharing
          rationale: "Closed-interval date-sharing rejection asserted in the named §1.8 instance."

      - name: tract_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRACT_OVERLAP]"]
        excluded_because:
          difficulty_instance: tract_partition_move_conserves_union
          rationale: "ERR_TRACT_OVERLAP asserted on the first PATCH of the named §1.8 instance."

      - name: rating_blocks_expansion_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_RATING_BLOCKS_EXPANSION]"]
        excluded_because:
          difficulty_instance: expansion_submit_gated_by_latest_exam_rating
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: public_file_incomplete_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_PUBLIC_FILE_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: fieldwork_gated_by_public_file_posture
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: lmi_threshold_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_LMI_THRESHOLD_NOT_MET]"]
        excluded_because:
          difficulty_instance: full_count_lmi_threshold_boundary_051
          rationale: "0.50 rejection asserted in the named §1.8 instance."

      - name: segregation_of_duties_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: review_decision_conflict_sod_beats_budget
          rationale: "Asserted as the winning error of the priority-conflict §1.8 instance."

  # -------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: lending_metrics_computed_read_default_basis
        claim_type: computed_read
        grounds: ["endpoints", "calculations.lending_test_metrics"]
        distinguishing_aspect: "Omitting basis defaults to CURRENT (CONFIRMED + REPORTED): one CONFIRMED loan in the window is counted without any explicit basis parameter."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; one CONFIRMED loan action_date 2024-04-01; exam window 2024"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-EP1", name: "Default Basis Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 100000, borrower_gross_annual_revenue_cents: 50000000, action_date: "2024-04-01", census_tract: "T1", tract_income_level: "LOW" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /cra/loan-records/${l_id}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
          trigger:
            - call: "GET /cra/exam-cycles/${ex_id}/lending-metrics"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "loan_count == 1 (CURRENT basis default); inside_aa_pct == 1.0; lmi_geography_pct == 1.0"
            - "small_business_register_total_cents == 0 (loan not REPORTED, register excludes it)"

      - name: performance_context_editable_only_before_rating
        claim_type: conditional_action
        grounds: ["entities.ExamCycle.fields.performance_context_narrative", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PATCH performance-context succeeds in SCHEDULED and FIELDWORK but is rejected with ERR_INVALID_STATE once the exam reaches PRELIMINARY_RATING."
        test_recipe:
          setup: ["AssessmentArea ACTIVE; PublicFile COMPLETE; exam driven to PRELIMINARY_RATING"]
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-EP2", name: "Narrative Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 500000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Narrative Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
          trigger:
            - call: "PATCH /cra/exam-cycles/${ex_id}/performance-context"
              payload: { performance_context_narrative: "Tight deposit competition in the MSA." }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
              payload: { lending_test_rating: "SATISFACTORY", investment_test_rating: "SATISFACTORY", service_test_rating: "SATISFACTORY" }
              as: BankExaminer
            - call: "PATCH /cra/exam-cycles/${ex_id}/performance-context"
              payload: { performance_context_narrative: "Late edit attempt." }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds: narrative == 'Tight deposit competition in the MSA.'"
            - "Second PATCH: error_id == ERR_INVALID_STATE with http 409 (state PRELIMINARY_RATING not editable)"

  # ----------------------------------------------------------------- errors
  - section: errors
    instances:
      - name: not_found_errors_across_remaining_entities
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOAN_RECORD_NOT_FOUND]", "errors[ERR_ACTIVITY_NOT_FOUND]", "errors[ERR_BRANCH_NOT_FOUND]", "errors[ERR_PUBLIC_COMMENT_NOT_FOUND]", "errors[ERR_PUBLIC_FILE_NOT_FOUND]", "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "Every path-id resource family returns its own domain-specific 404: loan, activity, branch, comment, public file, application."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cra/loan-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /cra/community-development-activities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/resubmit"
              payload: {}
              as: ComplianceAnalyst
              captures: { e2: $.data.error_id }
            - call: "GET /cra/branches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: BankExecutive
              captures: { e3: $.data.error_id }
            - call: "POST /cra/public-comments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/publish"
              payload: {}
              as: CRAOfficer
              captures: { e4: $.data.error_id }
            - call: "GET /cra/public-files/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: CRAOfficer
              captures: { e5: $.data.error_id }
            - call: "GET /cra/expansion-applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
