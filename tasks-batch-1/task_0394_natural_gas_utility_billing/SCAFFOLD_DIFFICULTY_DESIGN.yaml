              as: FieldTech
              captures: { r1_id: $.data.id }
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1100, read_date: "2026-02-15T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { r2_id: $.data.id }
            - call: "POST /meters/${m_id}/reads"
              payload: { reading_index: 1200, read_date: "2026-03-15T00:00:00.000Z", read_type: "ACTUAL" }
              as: FieldTech
              captures: { r3_id: $.data.id }
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-02", to_read_id: "${r2_id}", from_read_id: "${r1_id}" }
              as: BillingAdmin
              captures: { bill1_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/bills/${bill1_id}/issue"
              payload: { expected_account_version: "${acct_v}" }
              as: BillingAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/bills"
              payload: { service_month: "2026-03", to_read_id: "${r3_id}", from_read_id: "${r2_id}" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BILLING_PERIOD_OVERLAP"
            - "response.status == 409"

      - name: budget_plan_coverage_window_overlap_half_open
        grounds:
          - validations[priority=5.2]
          - errors[ERR_BUDGET_PERIOD_OVERLAP]
          - entities.BudgetPlan.fields.anchor_month
        distinguishing_aspect: |
          HALF-OPEN month interval on the Account resource (DIFFERENT interval semantics than the closed
          read-date bill window): an ACTIVE plan anchored 2026-01 covers [2026-01, 2027-01); a new plan
          anchored 2026-06 overlaps that window -> ERR_BUDGET_PERIOD_OVERLAP; an adjacent plan anchored
          exactly 2027-01 would NOT collide.
        test_recipe:
          setup:
            - "RES account with one ACTIVE BudgetPlan anchored 2026-01 (window [2026-01, 2027-01)); a second enrollment anchored 2026-06 is attempted."
          setup_api_calls:
            - call: "POST /_clock/set"
