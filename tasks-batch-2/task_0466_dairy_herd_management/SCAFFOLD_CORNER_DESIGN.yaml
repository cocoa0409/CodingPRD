# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Dairy Herd Management (DHIA) — Expert tier
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: herd_create_returns_all_fields_and_defaults
        claim_type: Creation
        grounds:
          - entities.Herd.fields.milk_quality_status
          - entities.Herd.fields.active_animal_count
        distinguishing_aspect: "POST /herds with name+federal_order_number => 201; milk_quality_status defaults GOOD, active_animal_count defaults 0, version starts at 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /herds"
              payload: { name: "Fresh Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Herd.${h_id}.milk_quality_status == GOOD"
            - "Herd.${h_id}.active_animal_count == 0"
            - "Herd.${h_id}.version == 1"

      - name: animal_create_applies_heifer_defaults
        claim_type: Defaults
        grounds:
          - entities.Animal.fields.status
          - entities.Animal.fields.parity
          - entities.Animal.fields.milk_eligible
        distinguishing_aspect: "POST /herds/animals defaults status=HEIFER, parity=0, milk_eligible=true; system fields ignored if supplied."
        test_recipe:
          setup: ["A herd exists."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Animal Default Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "AD-001", birth_date: "2024-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Animal.${a_id}.status == HEIFER"
            - "Animal.${a_id}.parity == 0"
            - "Animal.${a_id}.milk_eligible == true"

      - name: animal_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ANIMAL_NOT_FOUND]
        distinguishing_aspect: "GET /herds/animals/{id} with a non-existent UUID => ERR_ANIMAL_NOT_FOUND (404)."
        test_recipe:
          setup: ["A herd exists; no animal with the queried id."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "NF Dairy", federal_order_number: "30" }
              as: HerdManager
          trigger:
            - call: "GET /herds/animals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ANIMAL_NOT_FOUND"

      - name: testday_missing_required_milk_weight_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /herds/test-day-records missing required milk_weight_lbs => ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An OPEN lactation exists (cow calved 2026-02-01)."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Req Field Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "RF-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-1" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-03-10", fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 150 }
              as: ParlorTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: testday_fat_pct_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TestDayRecord.fields.fat_pct
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /herds/test-day-records with fat_pct=20 (>15 max) => ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An OPEN lactation exists (cow calved 2026-02-01)."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Range Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "RG-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-1" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-03-10", milk_weight_lbs: 85.0, fat_pct: 20.0, protein_pct: 3.1, scc_thousands: 150 }
              as: ParlorTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: animal_duplicate_ear_tag_returns_duplicate_key
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: "Second animal with an ear_tag already used in the same herd => ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["A herd with one animal ear_tag DUP-1."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Dup Tag Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "DUP-1", birth_date: "2023-01-01" }
              as: HerdManager
          trigger:
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "DUP-1", birth_date: "2023-02-01" }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_KEY"

      - name: coop_price_sheet_duplicate_month_returns_duplicate_key
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: "Second CoopPriceSheet with the same settlement_month in one herd => ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["A herd with a 2026-06 price sheet."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Dup Month Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00 }
              as: CoopSettlementAgent
          trigger:
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.900, protein_price_per_lb: 3.600, other_solids_price_per_lb: 0.410, ppd_per_cwt: 1.300, advance_rate_per_cwt: 16.50 }
              as: CoopSettlementAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_KEY"

      - name: parlor_create_requires_existing_herd
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_HERD_NOT_FOUND]
        distinguishing_aspect: "POST /herds/parlors with a non-existent herd_id => ERR_HERD_NOT_FOUND (404)."
        test_recipe:
          setup: ["No herd with the referenced id."]
          setup_api_calls: []
          trigger:
            - call: "POST /herds/parlors"
              payload: { herd_id: "00000000-0000-0000-0000-000000000000", name: "Ghost Parlor", stall_capacity: 12 }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_HERD_NOT_FOUND"

      - name: testday_nonexistent_lactation_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_LACTATION_NOT_FOUND]
        distinguishing_aspect: "POST /herds/test-day-records with a non-existent lactation_id => ERR_LACTATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["A herd exists; no lactation with the referenced id."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Lact NF Dairy", federal_order_number: "30" }
              as: HerdManager
          trigger:
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "00000000-0000-0000-0000-000000000000", test_date: "2026-03-10", milk_weight_lbs: 80.0, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 150 }
              as: ParlorTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_LACTATION_NOT_FOUND"

      - name: finalize_nonexistent_milkcheck_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_MILK_CHECK_NOT_FOUND]
        distinguishing_aspect: "POST /herds/milk-checks/{id}/finalize on a non-existent milk-check id => ERR_MILK_CHECK_NOT_FOUND (404)."
        test_recipe:
          setup: ["A herd with one real PROVISIONAL milk-check (to source a version token); a finalize targets a different, non-existent milk-check id."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "MC NF Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00 }
              as: CoopSettlementAgent
              captures: { ps_id: $.data.id }
            - call: "POST /herds/milk-checks"
              payload: { herd_id: "${h_id}", price_sheet_id: "${ps_id}" }
              as: CoopSettlementAgent
              captures: { mc_v: $.data.version }
          trigger:
            - call: "POST /herds/milk-checks/00000000-0000-0000-0000-000000000000/finalize"
              payload: { expected_milk_check_version: "${mc_v}" }
              as: CoopSettlementAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_MILK_CHECK_NOT_FOUND"

      - name: iofc_nonexistent_ration_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RATION_NOT_FOUND]
        distinguishing_aspect: "GET /herds/animals/{id}/iofc with a non-existent ration_id => ERR_RATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["An animal exists; no ration with the referenced id."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Ration NF Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "RN-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /herds/animals/${a_id}/iofc?ration_id=00000000-0000-0000-0000-000000000000&blend_price_per_cwt=22.000"
              payload: { ration_id: "00000000-0000-0000-0000-000000000000", blend_price_per_cwt: 22.000 }
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RATION_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dry_off_heifer_returns_animal_not_milking
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Animal.ACTIVE_to_DRY
          - errors[ERR_ANIMAL_NOT_MILKING]
        distinguishing_aspect: "Dry-off on a HEIFER (never ACTIVE) => ERR_ANIMAL_NOT_MILKING (409)."
        test_recipe:
          setup: ["A HEIFER animal."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "DryOff Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "DO-001", birth_date: "2024-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /herds/animals/${a_id}/dry-off"
              payload: {}
              as: HerdManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ANIMAL_NOT_MILKING"

      - name: confirm_already_confirmed_breeding_returns_not_pending
        claim_type: Idempotency
        grounds:
          - state_machines.BreedingEvent.BRED_to_CONFIRMED_PREGNANT
          - errors[ERR_BREEDING_NOT_PENDING]
        distinguishing_aspect: "Second confirm on a CONFIRMED_PREGNANT event => ERR_BREEDING_NOT_PENDING (409)."
        test_recipe:
          setup: ["A CONFIRMED_PREGNANT breeding event (clock 2026-01-10)."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Confirm Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "CF-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-1" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
          trigger:
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BREEDING_NOT_PENDING"

      - name: confirm_after_preg_window_returns_window_elapsed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BreedingEvent.BRED_to_CONFIRMED_PREGNANT
          - entities.BreedingEvent.fields.confirm_due_at
          - errors[ERR_PREG_CHECK_WINDOW_ELAPSED]
        distinguishing_aspect: "Confirm at clock past confirm_due_at (service 2026-01-10 + 45d = 2026-02-24; clock 2026-03-01) => ERR_PREG_CHECK_WINDOW_ELAPSED (409)."
        test_recipe:
          setup: ["A BRED event service 2026-01-10; clock advanced to 2026-03-01 (past the 45-day window)."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Window Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "WN-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/breeding-events"
              payload: { animal_id: "${a_id}", service_date: "2026-01-10", sire_code: "S-1" }
              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PREG_CHECK_WINDOW_ELAPSED"

      - name: clear_treatment_before_withhold_elapsed_returns_not_elapsed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.HealthTreatment.ACTIVE_to_CLEARED
          - errors[ERR_WITHHOLD_NOT_ELAPSED]
        distinguishing_aspect: "Clear a treatment while clock (2026-06-10) is before milk_withhold_until (administered 2026-06-09T08:00Z + 96h = 2026-06-13T08:00Z) => ERR_WITHHOLD_NOT_ELAPSED (409)."
        test_recipe:
          setup: ["An ACTIVE treatment with a withhold window still open at clock 2026-06-10."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Withhold Clear Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "WC-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/health-treatments"
              payload: { animal_id: "${a_id}", drug_name: "Penicillin", administered_at: "2026-06-09T08:00:00Z", milk_withhold_hours: 96, meat_withdrawal_hours: 240 }
              as: Veterinarian
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /herds/health-treatments/${t_id}/clear"
              payload: {}
              as: Veterinarian
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WITHHOLD_NOT_ELAPSED"

      - name: clear_treatment_after_withhold_elapsed_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.HealthTreatment.ACTIVE_to_CLEARED
          - entities.Animal.fields.milk_eligible
        distinguishing_aspect: "Clear after both windows elapse (clock 2026-06-20, withhold until 2026-06-13T08:00Z, meat until 2026-06-19T08:00Z) => CLEARED and milk_eligible restored true."
        test_recipe:
          setup: ["An ACTIVE treatment whose windows have both elapsed by clock 2026-06-20."]
          setup_api_calls:
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "Withhold Done Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/animals"
              payload: { herd_id: "${h_id}", ear_tag: "WD-001", birth_date: "2023-01-01" }
              as: HerdManager
              captures: { a_id: $.data.id }
            - call: "POST /herds/health-treatments"
              payload: { animal_id: "${a_id}", drug_name: "Penicillin", administered_at: "2026-06-09T08:00:00Z", milk_withhold_hours: 96, meat_withdrawal_hours: 240 }
              as: Veterinarian
              captures: { t_id: $.data.id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: HerdManager
          trigger:
            - call: "POST /herds/health-treatments/${t_id}/clear"
              payload: {}
              as: Veterinarian
          assert:
            - "response.status == 200"
            - "HealthTreatment.${t_id}.status == CLEARED"
            - "Animal.${a_id}.milk_eligible == true"

      - name: void_already_voided_shift_returns_not_logged
        claim_type: Idempotency
        grounds:
          - state_machines.MilkingShift.LOGGED_to_VOIDED
          - errors[ERR_SHIFT_NOT_LOGGED]
        distinguishing_aspect: "Second void on a VOIDED shift => ERR_SHIFT_NOT_LOGGED (409)."
        test_recipe:
          setup: ["A VOIDED milking shift."]
          setup_api_calls:
            - call: "POST /herds"
              payload: { name: "Void Shift Dairy", federal_order_number: "30" }
              as: HerdManager
              captures: { h_id: $.data.id }
            - call: "POST /herds/parlors"
              payload: { herd_id: "${h_id}", name: "P1", stall_capacity: 12 }
              as: HerdManager
              captures: { p_id: $.data.id }
            - call: "POST /herds/milking-shifts"
              payload: { parlor_id: "${p_id}", start_at: "2026-06-01T04:00:00Z", end_at: "2026-06-01T07:00:00Z", cows_milked: 12 }
              as: ParlorTech
              captures: { s_id: $.data.id }
            - call: "POST /herds/milking-shifts/${s_id}/void"
              payload: {}
              as: ParlorTech
          trigger:
            - call: "POST /herds/milking-shifts/${s_id}/void"
              payload: {}
              as: ParlorTech
