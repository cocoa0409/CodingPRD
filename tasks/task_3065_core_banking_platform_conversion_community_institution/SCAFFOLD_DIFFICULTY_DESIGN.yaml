          (priority 11): finalizing a MockRun that is already PASSED while the
          project sits in MOCK_CONVERSION — the run's own state violation must
          surface ERR_INVALID_STATE, never ERR_PHASE_GATE (the phase gate is
          satisfied, so the run-state check at the lower priority number
