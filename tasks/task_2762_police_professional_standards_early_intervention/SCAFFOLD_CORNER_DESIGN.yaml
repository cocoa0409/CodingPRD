              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 1 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-050", full_name: "Investigator Calder", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 10800000, demographic_code: "DG_C", hire_date: "2016-04-04T00:00:00Z", is_investigator: true, certification_level: 1, max_case_load: 3 }
