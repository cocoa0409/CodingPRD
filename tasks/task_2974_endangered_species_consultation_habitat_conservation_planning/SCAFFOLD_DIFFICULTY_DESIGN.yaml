            - "hop 2: GET /habitat-conservation-plans/${hcp_id} reports plan_status == 'CLOSED'"
            - "hop 3: GET /habitat-conservation-plans/${hcp_id}/mitigation-commitments shows both commitments with status == 'RELEASED', ordered created_at ASC"
            - "the bank ledger did NOT move: GET /conservation-banks/${bank_id} still reports credits_available == 440.28, credits_reserved == 0.00 and credits_transferred == 59.72 — transferred credits stay transferred when a SECURED commitment is released"
            - "the plan's money fields are frozen as they were: endowment_required_cents == 5026514 and endowment_secured_cents == 5026514 (the release does not re-run calculations.endowment_requirement on a CLOSED plan)"
            - "GET /project-actions/${action_id} still reports status == 'PERMITTED': expiry is not a reinitiation, so the cascade stops at the commitments"
            - "POST /incidental-take-permits/${permit_id}/monitoring-reports for [2027-01-01, 2027-04-01) returns ERR_PERMIT_NOT_ACTIVE (409) — the expired permit accepts nothing further"
            - "a further clock advance to 2027-11-01 changes nothing: the permit stays 'EXPIRED', the plan stays 'CLOSED' and suspension_count stays 0, so the cascade is not re-run on every clock write"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: permit_not_active_beats_take_limit_exceeded
        grounds:
          - validation_priority_conflicts["permit-not-active-beats-take-limit"]
          - validations[priority 10]
          - validations[priority 28]
          - errors["ERR_PERMIT_NOT_ACTIVE"]
          - errors["ERR_TAKE_LIMIT_EXCEEDED"]
          - endpoints["POST /incidental-take-permits/{id}/monitoring-reports"]
        distinguishing_aspect: >-
          Pairs a STATE-category rule (priority 10, ERR_PERMIT_NOT_ACTIVE, 409)
          against a BUSINESS_FISCAL-category rule (priority 28,
          ERR_TAKE_LIMIT_EXCEEDED, 422) — a state-vs-fiscal pair with different
          HTTP statuses, on the monitoring-report endpoint. Both conditions hold
          simultaneously in one request and the 18-step gap between them makes
          the ordering unmistakable.
        test_recipe:
          setup:
            - "The full canonical chain to an ACTIVE permit with authorized_take_units 4.00 and reinitiation_trigger_units 3.60."
            - "At clock 2027-02-14 report R1 covers [2026-10-01, 2026-12-31) with take_units_reported 3.60, which lands exactly on the trigger threshold: take_consumed_units becomes 3.60, take_remaining_units 0.40 and the permit is SUSPENDED."
            - "The clock advances to 2027-05-20 and the permit is re-read so the trigger can send a CURRENT expected_permit_version — the OCC gate at priority 8 must not be the one that fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
