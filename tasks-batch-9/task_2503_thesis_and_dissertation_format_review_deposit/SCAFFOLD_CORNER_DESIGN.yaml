      - name: five_level_cascade_from_a_seat_change_on_an_approved_committee
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Thesis.workflow_state
          - calculations.room_booked_minutes_total
        excluded_because:
          difficulty_instance: seat_added_to_approved_committee_cancels_defense_and_releases_room_minutes
          rationale: "That §1.8 instance already walks the full chain end to end - seat added, committee reverted to SUBMITTED, thesis reverted, defense CANCELLED, room minutes released, clearance recomputed - and asserts every level, so a breadth duplicate would repeat the same five assertions."

      - name: both_embargo_release_variants_produce_different_dates_from_one_dataset
        claim_type: dual_variant_calculation
        grounds:
          - calculations.embargo_release_date.variants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: embargo_release_anchor_diverges_between_full_and_partial_approval
          rationale: "The §1.8 instance holds approved_months and the deposit instant fixed and drives APPROVE against PARTIALLY_APPROVE, asserting both release_date values and both release_anchor values, which is exactly the variant-divergence claim for this layer."

      - name: grace_tier_boundary_at_a_turnaround_of_exactly_fifteen_business_days
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.deposit_late_fee_cents.constants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: late_fee_grace_applied_once_not_twice
          rationale: "The §1.8 instance places the total turnaround in the high tier and asserts that the 5 grace business days shift the deadline once and are not subtracted a second time, which covers the upper tier boundary that this breadth row would otherwise re-probe."

  - section: consistency_model
