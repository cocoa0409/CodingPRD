      - name: adherence_pause_threshold_exact_boundary_on_dose_events
        grounds:
          - calculations.adherence_score_pct
          - entities.Patient.fields.autoship_status
          - entities.Patient.fields.pause_reason
          - endpoints.POST_/pharmacy/patients/{id}/dose-events
          - state_machines.Patient.ACTIVE_to_PAUSED_ADHERENCE
        distinguishing_aspect: |
          Metric: adherence_score_pct, a floor-divided percentage of a growing event
          denominator, probed at exactly 80 (no pause) and at 76 (pause) by adding ONE
          more missed pouch. Endpoint under test: POST /pharmacy/patients/{id}/dose-events.
          The probe is on the pause gate's strict < comparison, a different quantity and a
          different endpoint from the refill-too-soon boundary.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z for the build, advanced to 2026-09-05T00:00:00Z before the events are reported (window [2026-08-08, 2026-09-05))"
            - "one patient synchronized BRIDGE_TO_START on anchor day 15 with a single MORNING-only prescription"
            - "cycle 2026-08-15 .. 2026-09-12 adjudicated and rolled into 28 pouches with dose dates 2026-08-15 .. 2026-09-11"
            - "auto-ship ACTIVE, adherence_score_pct 100 (no events yet)"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
