  - method: GET
    path: "/permits/{id}"
    description: "Fetch a permit."
    roles: [ComplianceOfficer, Dispatcher, FieldTechnician]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List permits; optional species_id filter (FK reverse-reachability for Permit.species_id)."
    roles: [ComplianceOfficer, Dispatcher]
    code: 200
    input: ["species_id?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{id}/approve"
    description: "ComplianceOfficer approves a REQUESTED permit; lifts REGULATORY_HOLD when all permits approved."
    roles: [ComplianceOfficer]
    code: 200
    input: [permit_number]
    output: Permit
    side_effects: ["status REQUESTED->APPROVED; bubble Property.posture if all permits approved."]
  - method: POST
    path: "/permits/{id}/deny"
    description: "ComplianceOfficer denies a REQUESTED permit; cancels the work order."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["status REQUESTED->DENIED; cascade WorkOrder->CANCELLED, SET traps cancelled + kit restored, Property.posture OPEN."]

  # ---- TrapPlacement ----
  - method: POST
    path: "/work-orders/{id}/trap-placements"
    description: "Set a trap on an OPEN work order (removal dimension)."
    roles: [FieldTechnician]
    code: 201
    input: [species_id, technician_id, window_start, window_end]
    output: TrapPlacement
    side_effects: ["status=SET; removal_status PENDING->TRAPPING on first set; technician kit decremented."]
  - method: GET
    path: "/work-orders/{id}/trap-placements"
    description: "List a work order's trap placements (FK reverse-reachability for TrapPlacement.work_order_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TrapPlacement[]
    side_effects: []
  - method: GET
    path: "/trap-placements/{id}"
    description: "Fetch a trap placement."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: []
    output: TrapPlacement
    side_effects: []
  - method: GET
    path: "/trap-placements"
    description: "List trap placements; optional species_id, technician_id filters (FK reverse-reachability for TrapPlacement.species_id, TrapPlacement.technician_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["species_id?", "technician_id?", "limit?", "offset?"]
    output: TrapPlacement[]
    side_effects: []
  - method: POST
    path: "/trap-placements/{id}/captures"
    description: "Record a humane capture + compliant relocation; resolves trap to SPENT."
    roles: [FieldTechnician]
    code: 201
    input: [captured_at, release_latitude, release_longitude]
    output: CaptureEvent
    side_effects: ["compute release_distance_miles; trap SET->SPENT; cascade removal_status->CLEARED if last set trap; kit restored; TRAP line performed=true."]
  - method: POST
    path: "/trap-placements/{id}/pull"
    description: "Pull an empty trap; resolves to EMPTY."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: TrapPlacement
    side_effects: ["trap SET->EMPTY; removal_status->CLEARED if no SET traps remain; kit restored; TRAP line performed=true."]

  # ---- CaptureEvent reverse-reachability ----
  - method: GET
    path: "/trap-placements/{id}/captures"
    description: "List a trap's capture events (FK reverse-reachability for CaptureEvent.trap_placement_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CaptureEvent[]
    side_effects: []

  # ---- ExclusionRepair ----
  - method: POST
    path: "/work-orders/{id}/exclusion-repairs"
    description: "Start an exclusion/sealing repair against an OPEN entry point (exclusion dimension)."
    roles: [FieldTechnician]
    code: 201
    input: [entry_point_id, "sanitation_included?"]
    output: ExclusionRepair
    side_effects: ["status=STARTED; exclusion_status PENDING->SEALING on first repair."]
  - method: GET
    path: "/work-orders/{id}/exclusion-repairs"
    description: "List a work order's exclusion repairs (FK reverse-reachability for ExclusionRepair.work_order_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ExclusionRepair[]
    side_effects: []
  - method: GET
    path: "/exclusion-repairs/{id}"
    description: "Fetch an exclusion repair."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: []
    output: ExclusionRepair
    side_effects: []
  - method: GET
    path: "/exclusion-repairs"
    description: "List exclusion repairs; optional entry_point_id filter (FK reverse-reachability for ExclusionRepair.entry_point_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["entry_point_id?", "limit?", "offset?"]
    output: ExclusionRepair[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/exclusion-repairs/{repair_id}/complete"
    description: "Complete a sealing repair; seals the entry point; may auto-close the work order."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: ExclusionRepair
    side_effects: ["status STARTED->COMPLETED; EntryPoint SEALED; EXCLUSION line performed=true; exclusion_status->SEALED if all targeted open; AUTO-CLOSE WorkOrder if both dimensions terminal."]

  # ---- MonitoringVisit ----
  - method: POST
    path: "/work-orders/{id}/monitoring-visits"
    description: "Record a recurring monitoring/re-set visit on a CLOSED work order's property."
    roles: [FieldTechnician]
    code: 201
    input: [visit_start, visit_end, "traps_reset?"]
    output: MonitoringVisit
    side_effects: ["overlap check against other MonitoringVisits on the property."]
  - method: GET
    path: "/work-orders/{id}/monitoring-visits"
    description: "List a work order's monitoring visits (FK reverse-reachability for MonitoringVisit.work_order_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer, PropertyOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: MonitoringVisit[]
    side_effects: []
  - method: GET
    path: "/monitoring-visits/{id}"
    description: "Fetch a single monitoring visit (lets the MonitoringVisit collection segment be resolved)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer, PropertyOwner]
    code: 200
    input: []
    output: MonitoringVisit
    side_effects: []
  - method: GET
    path: "/monitoring-visits"
    description: "List monitoring visits; optional property_id filter (FK reverse-reachability for MonitoringVisit.property_id)."
    roles: [FieldTechnician, Dispatcher, ComplianceOfficer, PropertyOwner]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: MonitoringVisit[]
    side_effects: []

  # ---- WarrantyClaim ----
  - method: POST
    path: "/work-orders/{id}/warranty-claims"
    description: "File a warranty/callback claim against a CLOSED work order."
    roles: [PropertyOwner]
    code: 201
    input: [reported_at, description]
    output: WarrantyClaim
    side_effects: ["status=FILED."]
  - method: GET
    path: "/work-orders/{id}/warranty-claims"
    description: "List a work order's warranty claims (FK reverse-reachability for WarrantyClaim.work_order_id)."
    roles: [PropertyOwner, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a warranty claim."
    roles: [PropertyOwner, Dispatcher, ComplianceOfficer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/adjudicate"
    description: "ComplianceOfficer adjudicates a FILED claim (warranty window + qualification check)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status FILED->ACCEPTED if within window and qualified, else REJECTED."]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default before any call is 2026-04-01T00:00:00Z (logical clock never falls back to wall-clock). Drives warranty deadlines and humane-check windows deterministically."
    roles: [Dispatcher, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server logical clock set to to_iso8601."]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced path or body resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state (invalid-from / terminal-lockdown)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_work_order_version does not match WorkOrder.version on cancel."
  - id: ERR_PERMIT_REQUIRED
    http: 409
    condition: "Setting a trap for a regulated species with no APPROVED Permit for that species on the work order."
  - id: ERR_TECH_NOT_CERTIFIED
    http: 409
    condition: "BASIC-tier technician used for a regulated-species trap (requires CERTIFIED)."
  - id: ERR_RELOCATION_DISTANCE
    http: 422
    condition: "Capture release distance falls outside the species relocation band [min, max] inclusive."
  - id: ERR_ENTRY_POINT_MISMATCH
    http: 409
    condition: "Exclusion repair targets an entry point not on the work order's inspection, or one already SEALED."
  - id: ERR_TECH_WINDOW_CONFLICT
    http: 409
    condition: "Trap visit window (buffered) overlaps another SET trap on the same technician."
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "Monitoring visit window overlaps another visit on the same property (half-open)."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end/visit_end not strictly after window_start/visit_start."
  - id: ERR_EMPTY_SET
    http: 409
    condition: "Sending a quote with zero line items, or pulling/clearing when no trap was ever SET."
  - id: ERR_KIT_EXHAUSTED
    http: 409
    condition: "Trap SET would drive technician traps_available below 0."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad enum, out-of-range number, or non-positive quantity."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Schedules inspections, builds and sends quotes, registers technicians/properties/accounts, cancels work orders."
    identity: opaque
    exclusive_operations:
      - "POST /service-accounts, POST /properties, POST /technicians"
      - "POST /properties/{id}/inspections, /complete, /cancel"
      - "POST /quotes, /quotes/{id}/line-items, /quotes/{id}/send, /quotes/{id}/reopen"
      - "POST /work-orders/{id}/cancel"
    shared_operations:
      - "POST /inspections/{id}/entry-points (with FieldTechnician)"
      - "GET reads across the domain"

  - name: PropertyOwner
    description: "The property/account owner; accepts/declines/requests-revision on quotes and files warranty claims."
    identity: entity_backed:ServiceAccount
    exclusive_operations:
      - "POST /quotes/{id}/accept, /decline, /request-revision"
      - "POST /work-orders/{id}/warranty-claims"
    shared_operations:
      - "GET reads of own quotes/work-orders/properties"

  - name: FieldTechnician
    description: "Executes trap placement, captures/relocation, pulls, exclusion repairs, and monitoring visits."
    identity: entity_backed:Technician
    exclusive_operations:
      - "POST /work-orders/{id}/trap-placements"
      - "POST /trap-placements/{id}/captures, /pull"
      - "POST /work-orders/{id}/exclusion-repairs, /complete"
      - "POST /work-orders/{id}/monitoring-visits"
    shared_operations:
      - "POST /inspections/{id}/entry-points (with Dispatcher)"
      - "GET reads across the domain"

  - name: ComplianceOfficer
    description: "Owns species configuration, permit approval/denial, and warranty adjudication (regulated-species + relocation compliance)."
    identity: opaque
    exclusive_operations:
      - "POST /species-profiles"
      - "POST /permits/{id}/approve, /deny"
      - "POST /warranty-claims/{id}/adjudicate"
    shared_operations:
      - "GET reads across the domain"
