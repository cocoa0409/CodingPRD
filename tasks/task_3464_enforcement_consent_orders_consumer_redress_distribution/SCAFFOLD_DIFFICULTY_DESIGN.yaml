          - entities.RedressFund.fields.available_cents
        distinguishing_aspect: "Conserved quantity = fund money identity: available + allocated + disbursed + admin_reserve + residual == total_collected (3000000) must hold after ISSUE (forward action) paired with its compensating VOID, and after the interleaved CASH — the pin catches any cascade that leaks a cent."
