              payload: { client_id: "${c_id}", title: "M90", media_kind: "FILE_BASED", duration_seconds: 5400, frame_rate: "FPS_24" }
              as: IntakeCoordinator
              captures: { m_90: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "M91", media_kind: "FILE_BASED", duration_seconds: 5460, frame_rate: "FPS_24" }
              as: IntakeCoordinator
              captures: { m_91: $.data.id }
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_90}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_90: $.data.id }
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_91}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_91: $.data.id }
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_90}/quote"
              payload: {}
              as: IntakeCoordinator
              captures: { q_90: $.data.quoted_price_cents }
            - call: "POST /caption-ad/work-orders/${wo_91}/quote"
              payload: {}
              as: IntakeCoordinator
              captures: { q_91: $.data.quoted_price_cents }
          assert:
            - "quoted_price_cents for 90 min == 43500 (10500 + 18000 + 15000 setup, no third bracket at exactly 90)"
            - "quoted_price_cents for 91 min == 43750 (28750 + 15000 — one minute at the 250c marginal rate)"

