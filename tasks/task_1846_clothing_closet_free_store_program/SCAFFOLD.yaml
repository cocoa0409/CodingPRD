# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity-backed role acting outside ownership scope" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum/type/range, start>=end, non-positive weight" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the resource's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the transition (incl. batch close from non-SORTED, double checkout, revoke of non-ISSUED voucher)" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "Line add on an item not currently STOCKED" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Client SUSPENDED at check-in or voucher issuance" }
  - { id: ERR_PARTNER_SUSPENDED, http: 409, condition: "Partner SUSPENDED at voucher issuance (path resource) or at redemption (referenced via voucher)" }
  - { id: ERR_VISIT_COOLDOWN_ACTIVE, http: 409, condition: "Fewer than 14 days since last checkout and no waiving voucher" }
  - { id: ERR_VISIT_LIMIT_REACHED, http: 409, condition: "3 checkouts already in the trailing 30 days" }
  - { id: ERR_VOUCHER_EXPIRED, http: 409, condition: "Redemption attempted at/after expires_at" }
  - { id: ERR_SHIFT_NOT_IN_WINDOW, http: 409, condition: "Shift check-in outside [start_at,end_at] or complete before end_at" }
  - { id: ERR_ROTATION_OUTSIDE_WINDOW, http: 409, condition: "Rotation execute outside [window_start, window_end]" }
  - { id: ERR_NO_SORTING_STAFF, http: 409, condition: "No CHECKED_IN signup on a SORTING shift covering now" }
  - { id: ERR_ZONE_FULL, http: 409, condition: "Zone at capacity (current_stock >= capacity_items)" }
  - { id: ERR_SEASON_INCOMPATIBLE, http: 409, condition: "Item season incompatible with zone season_policy" }
  - { id: ERR_SHIFT_FULL, http: 409, condition: "Shift LOCKED (at capacity)" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Volunteer holds an active signup overlapping the shift window" }
  - { id: ERR_ALREADY_SIGNED_UP, http: 409, condition: "Volunteer already has an active signup on this shift" }
  - { id: ERR_ITEM_LIMIT_EXCEEDED, http: 409, condition: "Per-visit general allowance or drive bonus pool exhausted" }
  - { id: ERR_CATEGORY_LIMIT_EXCEEDED, http: 409, condition: "Category cap exceeded for a general line (COATS 2, INTERVIEW_ATTIRE 1)" }
  - { id: ERR_ROLLING_ITEM_CAP_EXCEEDED, http: 409, condition: "Rolling 30-day item cap (30) would be exceeded" }
  - { id: ERR_EMPTY_VISIT_CHECKOUT, http: 409, condition: "Checkout with zero ACTIVE lines" }
  - { id: ERR_VOUCHER_QUOTA_EXHAUSTED, http: 409, condition: "Partner monthly voucher quota (with carryover) exhausted" }
  - { id: ERR_ZONE_CODE_TAKEN, http: 409, condition: "zone_code already in use" }
  - { id: ERR_DRIVE_WINDOW_CONFLICT, http: 409, condition: "Same-type drive window conflict within the 7-day buffer" }
  - { id: ERR_RECYCLING_EMPTY, http: 409, condition: "Seal attempted with zero assigned items" }
  - { id: ERR_CAPACITY_BELOW_STOCK, http: 409, condition: "Zone PATCH capacity_items below current_stock" }
  - { id: ERR_VOUCHER_NOT_REDEEMABLE, http: 409, condition: "Voucher not ISSUED at redemption (REVOKED/REDEEMED/EXPIRED)" }
  - { id: ERR_VOUCHER_CLIENT_MISMATCH, http: 409, condition: "Voucher issued to a different client" }
  - { id: ERR_DRIVE_NOT_ACTIVE, http: 409, condition: "Drive-pool item stocked outside UPCOMING/ACTIVE or distributed while drive not ACTIVE" }
  - { id: ERR_SOD_SORTER_CANNOT_CLOSE, http: 409, condition: "Batch close attempted by the volunteer who started sorting" }
  - { id: ERR_SOD_SEALER_CANNOT_PICKUP, http: 409, condition: "Pickup recorded by the same admin user who sealed the batch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Program administrator; full operational control incl. zones, drives, rotations, partners, recycling, reports, clock"
    identity: opaque
    exclusive_operations:
      - "storage-zone create/PATCH; seasonal-rotation create/execute/cancel"
      - "referral-partner create/suspend; drive create/close"
      - "recycling-batch create/sweep/seal/pickup; clock set; impact report"
    shared_operations: ["all read endpoints", "client/visit/item/voucher operations shared with staff roles"]
  - name: VolunteerLead
    description: "Lead volunteer (a Volunteer with is_lead=true); manages shifts, quarantine, batch close, client discipline"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "shift create/cancel/complete; item quarantine/release-quarantine"
      - "batch close; client PATCH/suspend/reinstate; visit void"
    shared_operations: ["all Volunteer operations (intake, sorting, stocking, visits, lines, checkout, signups)"]
  - name: Volunteer
    description: "Sorting/floor volunteer; intake, grading, stocking, visit assistance, own shift signups"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "donation-batch create/start-sorting/item grading (shared only with VolunteerLead among staff)"
    shared_operations: ["visit check-in/lines/checkout", "item stock", "own shift signup/check-in/cancel", "read endpoints"]
  - name: Client
    description: "Registered client; read-only access to own record, visits, vouchers"
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations: ["GET own client record, own visits, own vouchers"]
  - name: ReferralPartner
    description: "Partner agency; issues/revokes own vouchers and reads its own record"
    identity: "entity_backed:ReferralPartner"
    exclusive_operations: ["voucher issue/revoke under own partner id (shared only with ProgramAdmin)"]
    shared_operations: ["GET own partner record, own vouchers"]
