            - "KettleLocation.${loc_id}.covered_minutes == 0"

      - name: host_site_denied_is_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.HostSite.PENDING_to_DENIED
          - state_machines.HostSite.terminal_states
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: |
          Once a host site is DENIED every further transition attempt is rejected with
          ERR_ALREADY_TERMINAL, including a later APPROVE decision, so DENIED is a true terminal
          state rather than a reversible flag.
        test_recipe:
          setup:
            - "logical clock at 2026-11-15T00:00:00Z with one PENDING host site"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
