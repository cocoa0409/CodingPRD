            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 100.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { pile_v3: $.data.version } }
          trigger:
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: -85.0, reason: "write-down", expected_stockpile_version: "${pile_v3}" }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_ADJUSTMENT_BELOW_RESERVED (http 409): 100.0 - 85.0 = 15.0 < reserved 30.0"
            - "Stockpile.${pile}.on_hand_tons stays 100.0"

      - name: over_shipment_tolerance_inclusive_boundary
        claim_type: boundary_edge
