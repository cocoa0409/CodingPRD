          - state_machines.Scorecard.SUBMITTED_to_VOIDED
          - state_machines.InterviewSession.SCORED_to_COMPLETED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — voiding 1 of 3
          submitted scorecards reverts its session SCORED->COMPLETED, so the session REMAINS in
