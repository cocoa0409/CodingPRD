  - name: violation_error_duplicate_index_reading_for_one_code_and_period
    claim_type: violation_error
    grounds:
    - validations[priority=80]
    - errors[ERR_DUPLICATE_INDEX_READING]
    - entities.IndexReading
    distinguishing_aspect: 'Uniqueness is on the PAIR (index_code, period): republishing PPI_STEEL_MILL 2026-07 with a different value is ERR_DUPLICATE_INDEX_READING, while the same period under another code and the same code under another period both succeed — and the original 310.00 is never overwritten.'
    test_recipe:
      setup:
      - 'One published reading: PPI_STEEL_MILL 2026-07 = 310.00'
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-07, value: '310.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-07, value: '999.00', published_at: '2026-07-20T00:00:00.000Z'}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_COPPER_WIRE, period: 2026-07, value: '200.00', published_at: '2026-07-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: POST /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL, period: 2026-08, value: '322.00', published_at: '2026-08-15T00:00:00.000Z'}
        as: BuyoutManager
      - call: GET /procurement/index-readings
        payload: {index_code: PPI_STEEL_MILL}
        as: BuyoutManager
      assert:
      - the first trigger call fails with error_id ERR_DUPLICATE_INDEX_READING and HTTP 409
      - the second trigger call returns HTTP 201 (same period, different index_code)
      - the third trigger call returns HTTP 201 (same index_code, different period)
      - the listing returns total_count == 2 for PPI_STEEL_MILL
      - the PPI_STEEL_MILL 2026-07 row still reads value == 310.00, not 999.00
      - every IndexReading row carries no version field
