  # ===========================================================================
  - section: validations
    instances:

      - name: accept_nonexistent_batch_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Accept on a non-existent batch id returns 404 ERR_NOT_FOUND even though a real batch would also fail the state check — existence (priority 4) precedes state (priority 9)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /data-feed-batches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/accept"
              payload: { deid_qa_score: 0.99 }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: compile_safety_beats_temporal_priority
        claim_type: Priority Ordering
        grounds:
          - validations[priority=15]
          - validations[priority=19]
        distinguishing_aspect: "A compile that both forces an opted-out prescriber (safety, priority 15) and runs before period_end_date (temporal, priority 19) returns ERR_PRESCRIBER_OPT_OUT_VIOLATION — a different category pair than the two §1.8 conflicts."
        test_recipe:
          setup:
            - "Clock 2026-08-15 (before period_end 2026-08-31). Prescriber P1 with ACTIVE opt-out; methodology + CURRENT cell for 2026-08; client; product with prescriber_ids [P1]; period; one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /prescribers"
              payload: { full_name: "Dr P", npi: "NPI-401", state_code: "TX", specialty: "CARDIOLOGY" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /projection-methodologies"
              payload: { name: "M-PT", default_variant: "PROJECTION_WEIGHTED" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /projection-cells"
              payload: { methodology_id: "${m_id}", geography_code: "G1", specialty: "CARDIOLOGY", period_code: "2026-08", sample_units: 10, market_outlets: 10, sampled_outlets: 10, market_population: 1000, sampled_population: 1000, specialty_uptake_index: 1.0, supplier_ids: [] }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { name: "Client PT", entitlement_cells_total: 100 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /report-products"
              payload: { client_id: "${cl_id}", methodology_id: "${m_id}", name: "P-PT", prescriber_ids: ["${p1_id}"], base_fee_cents: 10000, cell_fee_base_cents: 1000, cell_fee_multiplier: 1.0, volume_discount_pct: 0.0, monthly_license_fee_cents: 200000 }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /prescribers/${p1_id}/opt-outs"
              payload: {}
              as: PrivacyOfficer
              captures: { oo_id: $.data.id }
            - call: "POST /prescriber-opt-outs/${oo_id}/verify"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /prescriber-opt-outs/${oo_id}/activate"
              payload: {}
              as: PrivacyOfficer
            - call: "POST /report-products/${pr_id}/delivery-periods"
              payload: { period_code: "2026-08", period_end_date: "2026-08-31", total_due_deliveries: 1 }
              as: PlatformAdmin
              captures: { pe_id: $.data.id }
            - call: "POST /report-delivery-periods/${pe_id}/deliveries"
              payload: {}
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
