              payload: { action: "SUBMIT_DOCS", income_sources: [{ source_type: "SALARY", amount_per_period_cents: 250000, periods_per_year: 12 }] }
              as: Applicant
              as_user_id: "${ap}"
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "CERTIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offers/generate"
              payload: { campaign_id: "${c}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "GET /offers?campaign_id=${c}&status=PENDING"
              as: LotteryAdministrator
              captures: { offer: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: HousingDeveloper
          trigger:
            - call: "POST /offers/${offer}/respond"
              payload: { action: "ACCEPT" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: "$.data.error_id" }
            - call: "GET /offers/${offer}"
              as: HousingDeveloper
              captures: { st: "$.data.status" }
          assert:
            - "respond at 2026-07-11 fails with ERR_OFFER_EXPIRED (409): clock > response_deadline 2026-07-10"
            - "UnitOffer.${offer}.status is still PENDING (${st}) — the deadline rejection is not itself the expiry transition"

      - name: quarter_misaligned_report_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - calculations.compliance_aggregation
        distinguishing_aspect: "CALENDAR_QUARTER mode requires quarter-aligned period bounds: period_start 2026-04-02 (not a quarter first day) is a shape violation, ERR_INVALID_REQUEST, before any aggregation runs."
        test_recipe:
          setup: ["one campaign exists"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /compliance-reports"
              payload: { campaign_id: "${c}", period_start: "2026-04-02T00:00:00Z", period_end: "2026-06-30T00:00:00Z", period_mode: "CALENDAR_QUARTER" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400): 2026-04-02 is not the first day of a calendar quarter"
