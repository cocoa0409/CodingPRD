            - "Patron.${blocky_id}.open_request_count == 0 and GET /ill/requests?patron_id=${blocky_id} returns total_count == 0"
            - "${admitted_status} == SOURCING and Patron.${admity_id}.open_request_count == 1"
            - "Patron.${admity_id}.provisional_risk_score == 39 after the successful intake — the score is unchanged by admitting a request"

      - name: licensed_electronic_access_blocks_a_request_only_once_the_embargo_has_lapsed
        claim_type: threshold
        grounds:
          - calculations.licensed_access_embargo_test
          - validations[priority=56]
          - errors[ERR_LICENSED_ACCESS_AVAILABLE]
          - entities.BibItem.fields.embargo_months
          - entities.BibItem.fields.licensed_access_status
        distinguishing_aspect: "With embargo_months 12 at current_year 2026 the accessibility test is publication_year <= 2025: the 2025 article is already covered by the licence so its request is refused with ERR_LICENSED_ACCESS_AVAILABLE, while the 2026 article is still embargoed and its request is admitted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, so current_year is 2026 and ceil(12 / MONTHS_PER_YEAR 12) is 1."
            - "Patron P-9026 with max_open_requests 5."
            - "Partner NORTHU with supplies_electronic true on a COPY rota."
            - "Two ARTICLE BibItems, both licensed_access_status LICENSED_EMBARGOED with embargo_months 12: LAPSED published 2025 and STILL published 2026. Both use issn values whose 2026 allowance is untouched, so no copyright branch interferes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9026", full_name: "Xan Reader", email: "xan@u.edu", patron_type: "FACULTY", department: "BIOL", max_open_requests: 5 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 1500, avg_turnaround_days: 2, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Article supply rota", material_type: "COPY", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 1500, quoted_turnaround_days: 2, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Ribosome assembly in vitro", item_type: "ARTICLE", issn: "4444-0001", journal_title: "Cell Reports Weekly", publication_year: 2025, local_holding_status: "NONE", licensed_access_status: "LICENSED_EMBARGOED", embargo_months: 12, list_price_cents: 4000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_lapsed_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Ribosome assembly in vivo", item_type: "ARTICLE", issn: "4444-0002", journal_title: "Cell Reports Weekly", publication_year: 2026, local_holding_status: "NONE", licensed_access_status: "LICENSED_EMBARGOED", embargo_months: 12, list_price_cents: 4000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_still_id: $.data.id }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_lapsed_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 10 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_licensed: $.data.error_id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_still_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 10 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { ok_req_id: $.data.id, ok_status: $.data.status }
          assert:
            - "${err_licensed} == ERR_LICENSED_ACCESS_AVAILABLE with HTTP 422 — 2025 <= 2026 - 1, so the licence already covers the article"
            - "${ok_status} == SOURCING — 2026 > 2026 - 1, so the embargo still bites and interlending is allowed"
            - "GET /ill/copyright-usage?issn=4444-0001&calendar_year=2026 reports counted_fill_count == 0 — the refused intake created no clearance"
            - "GET /ill/copyright-usage?issn=4444-0002&calendar_year=2026 reports counted_fill_count == 1 and free_fills_remaining == 4"
            - "Patron.${patron_id}.open_request_count == 1 and GET /ill/requests?patron_id=${patron_id} returns total_count == 1 containing only ${ok_req_id}"

      - name: invoice_surcharge_is_rounded_per_line_before_summation
        claim_type: precision
        grounds:
          - calculations.partner_invoice_reconciliation
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_consortium_surcharge_rounded_per_line_before_summation
          rationale: "That §1.8 instance pins three lines whose per-line rounding total (8421) differs from the sum-then-round total (8420) and asserts the per-line answer."

      - name: gross_and_net_settlement_variants_diverge_on_identical_lines
        claim_type: variant_divergence
        grounds:
          - calculations.partner_invoice_reconciliation
          - entities.PartnerInvoice.fields.settlement_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_net_variant_flips_direction_where_gross_variant_bills_the_borrower
          rationale: "That §1.8 instance drafts both variants over identical lines and asserts the -2831 / RECEIVABLE against 3440 / PAYABLE divergence."

      - name: provisional_standing_is_used_at_intake_and_final_standing_in_the_ops_run
        claim_type: variant_selection
        grounds:
          - calculations.patron_standing_score
          - entities.Patron.fields.final_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / patron_standing_provisional_admits_intake_that_final_variant_blocks
          rationale: "That §1.8 instance shows the provisional variant admitting an intake at 36 while the final variant blocks the same patron at 42 in the ops-run."

      - name: concurrent_loan_windows_are_merged_as_closed_intervals
        claim_type: interval_merge
        grounds:
          - calculations.patron_loan_window_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / loan_windows_are_closed_so_touching_endpoints_breach_aggregate_loan_capacity
          rationale: "That §1.8 instance proves the closed-interval convention by refusing a receipt whose window touches an existing one at a single instant and admitting it one day later."

      - name: due_date_projection_is_truncated_by_the_total_loan_ceiling
        claim_type: projection
        grounds:
          - calculations.loan_due_date_and_renewal_projection
        excluded_because:
          difficulty_instance: boundary_precision_check / renewal_at_the_total_loan_ceiling_extends_once_then_stalls_on_exact_equality
          rationale: "That §1.8 instance asserts the 4-day truncated first renewal and the exact-equality refusal at the MAX_TOTAL_LOAN_DAYS ceiling."

      - name: free_fill_counter_aggregates_only_active_contu_free_clearances_for_the_issn_year
        claim_type: aggregation
        grounds:
          - calculations.copyright_rule_of_five_counter
        excluded_because:
          difficulty_instance: compensating_invariant / cancelling_an_article_request_returns_its_contu_free_fill_to_the_journal_pool
          rationale: "That §1.8 instance voids one clearance and asserts the counter dropping from 5 to 4 and back to 5, which is exactly the input-set filter on status and method."

