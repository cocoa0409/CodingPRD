      - name: departments_list_paginates
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoints honor limit/offset with envelope fields: 3 departments, limit 2 -> page 1 has 2 items with total_count 3 and has_more true; offset 2 -> 1 item with has_more false; items ordered created_at ASC."
        test_recipe:
          setup: ["Jurisdiction with three departments created in order UTILITY, CODE_ENFORCEMENT, PERMIT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProviderAdmin }
            - call: "POST /jurisdictions"
              payload: { code: "FL-DADE", name: "Miami-Dade", state_code: "FL" }
              as: ProviderAdmin
              captures: { j_id: "$.data.id" }
            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000 }
