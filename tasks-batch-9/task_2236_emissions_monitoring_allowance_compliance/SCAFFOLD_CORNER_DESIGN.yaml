# =============================================================================
# 1.9 Scaffold Corner Design — emissions-monitoring-allowance-compliance
# =============================================================================
# Breadth probe over §1.1-§1.7. Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md; no category is invented.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * every chain starts with POST /emissions/_clock/set_current_utc so the
#     26-hour calibration-expiry sweep never fires mid-recipe;
#   * the facility is always created with operator_org "op_alpha", and every
#     FacilityOperator call passes as_user_id "op_alpha";
#   * preparers are prep_1 / prep_2, representatives dr_1 / dr_2;
#   * "00000000-0000-4000-8000-000000000000" is a syntactically valid id that is
#     never minted by any call in the chain, so it is the canonical unknown id;
#   * every negative trigger captures error_id so the intent is unambiguous.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: entity_facility_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Facility
          - endpoints[POST /emissions/facilities]
        distinguishing_aspect: "A facility created with every input field present returns 201 and echoes all inputs plus the initialised system and derived fields in the same response body."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2", "CSAPR_SO2_G1"], true_up_deadline_utc: "2027-03-01T00:00:00Z", max_concurrent_control_outages: 2 }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP 201 with Facility.${fac_id}.name == Kestrel Generating Station and orispl_code == 7101"
            - "Facility.${fac_id}.state_code == OH, operator_org == op_alpha and programs == [ARP_SO2, CSAPR_SO2_G1]"
            - "Facility.${fac_id}.true_up_deadline_utc == 2027-03-01T00:00:00Z and max_concurrent_control_outages == 2"
            - "Facility.${fac_id}.status == ACTIVE and compliance_posture == COMPLIANT"
            - "Facility.${fac_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: entity_unit_retrieval_returns_the_stored_record
        claim_type: retrieval
        grounds:
          - entities.Unit
          - endpoints[GET /emissions/units/{id}]
        distinguishing_aspect: "GET on a unit id returns exactly the row written by the nested create, including the facility_id resolved from the create path."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one facility with one unit U1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
          trigger:
            - call: "GET /emissions/units/${unit_id}"
              payload: {}
              as: QAAnalyst
          assert:
            - "HTTP 200 with Unit.${unit_id}.facility_id == ${fac_id} and unit_identifier == U1"
            - "Unit.${unit_id}.primary_fuel == COAL, nameplate_capacity_mw == 600 and max_rated_heat_input_mmbtu_hr == 6000"
            - "Unit.${unit_id}.control_device == FGD and version == 1"

      - name: entity_operating_hour_listing_paginates_and_rejects_bad_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /emissions/operating-hours]
          - validations[priority=95]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "The hour list honours limit/offset with total_count 3 and has_more true on the first page, and rejects limit 0, limit 101 and offset -1 with ERR_INVALID_PAGINATION."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "unit U1 with a CERTIFIED SO2 CEM and a DRAFT 2026 Q2 report holding three identical CEMS hours"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h1_id: "$.data[0].id" }
          trigger:
            - call: "GET /emissions/operating-hours"
              payload: { unit_id: "${unit_id}", limit: 2, offset: 0 }
              as: RegulatoryReviewer
            - call: "GET /emissions/operating-hours"
              payload: { unit_id: "${unit_id}", limit: 2, offset: 2 }
              as: RegulatoryReviewer
            - call: "GET /emissions/operating-hours"
              payload: { unit_id: "${unit_id}", limit: 0 }
              as: RegulatoryReviewer
              captures: { e_zero: $.data.error_id }
            - call: "GET /emissions/operating-hours"
              payload: { unit_id: "${unit_id}", limit: 101 }
              as: RegulatoryReviewer
              captures: { e_big: $.data.error_id }
            - call: "GET /emissions/operating-hours"
              payload: { unit_id: "${unit_id}", offset: -1 }
              as: RegulatoryReviewer
              captures: { e_neg: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 200 with 2 rows, total_count == 3 and has_more == true"
            - "trigger 2 returns HTTP 200 with 1 row, total_count == 3 and has_more == false"
            - "trigger 3 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION (limit 0 is below the range floor of 1)"
            - "trigger 4 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION (limit 101 is above the ceiling of 100)"
            - "trigger 5 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION (offset must be >= 0)"

      - name: entity_every_path_id_has_its_own_not_found_code
        claim_type: not_found
        grounds:
          - validations[priority=100]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_MONITORING_SYSTEM_NOT_FOUND]
          - errors[ERR_DAILY_CALIBRATION_NOT_FOUND]
          - errors[ERR_RATA_TEST_NOT_FOUND]
          - errors[ERR_OPERATING_HOUR_NOT_FOUND]
          - errors[ERR_FUEL_SAMPLE_NOT_FOUND]
          - errors[ERR_QUARTERLY_REPORT_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_PERMIT_LIMIT_NOT_FOUND]
          - errors[ERR_EXCESS_EVENT_NOT_FOUND]
          - errors[ERR_ALLOWANCE_ACCOUNT_NOT_FOUND]
          - errors[ERR_ALLOWANCE_TRANSACTION_NOT_FOUND]
          - errors[ERR_CONTROL_OUTAGE_NOT_FOUND]
        distinguishing_aspect: "Each of the thirteen id-bearing GET paths returns its OWN 404 code for the same unknown id rather than a single shared ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database — no row of any entity exists"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "GET /emissions/units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_unit: $.data.error_id }
            - call: "GET /emissions/monitoring-systems/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_sys: $.data.error_id }
            - call: "GET /emissions/daily-calibrations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_cal: $.data.error_id }
            - call: "GET /emissions/rata-tests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_rata: $.data.error_id }
            - call: "GET /emissions/operating-hours/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_hour: $.data.error_id }
            - call: "GET /emissions/fuel-samples/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_fuel: $.data.error_id }
            - call: "GET /emissions/quarterly-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_report: $.data.error_id }
            - call: "GET /emissions/certifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_cert: $.data.error_id }
            - call: "GET /emissions/permit-limits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_limit: $.data.error_id }
            - call: "GET /emissions/excess-emission-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_event: $.data.error_id }
            - call: "GET /emissions/allowance-accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_acct: $.data.error_id }
            - call: "GET /emissions/allowance-transactions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_tx: $.data.error_id }
            - call: "GET /emissions/control-outages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              captures: { e_outage: $.data.error_id }
          assert:
            - "every trigger returns HTTP 404"
            - "trigger 1 error_id == ERR_UNIT_NOT_FOUND; trigger 2 == ERR_MONITORING_SYSTEM_NOT_FOUND; trigger 3 == ERR_DAILY_CALIBRATION_NOT_FOUND"
            - "trigger 4 error_id == ERR_RATA_TEST_NOT_FOUND; trigger 5 == ERR_OPERATING_HOUR_NOT_FOUND; trigger 6 == ERR_FUEL_SAMPLE_NOT_FOUND"
            - "trigger 7 error_id == ERR_QUARTERLY_REPORT_NOT_FOUND; trigger 8 == ERR_CERTIFICATION_NOT_FOUND; trigger 9 == ERR_PERMIT_LIMIT_NOT_FOUND"
            - "trigger 10 error_id == ERR_EXCESS_EVENT_NOT_FOUND; trigger 11 == ERR_ALLOWANCE_ACCOUNT_NOT_FOUND; trigger 12 == ERR_ALLOWANCE_TRANSACTION_NOT_FOUND"
            - "trigger 13 error_id == ERR_CONTROL_OUTAGE_NOT_FOUND"

      - name: entity_create_with_a_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=90]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /emissions/facilities]
          - endpoints[POST /emissions/facilities/{id}/units]
        distinguishing_aspect: "Omitting a required input (facility orispl_code, unit max_rated_heat_input_mmbtu_hr, permit-limit averaging_basis) is rejected with ERR_INVALID_REQUEST and persists nothing, while omitting an optional input succeeds."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { e_fac: $.data.error_id }
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600 }
              as: RegulatoryReviewer
              captures: { e_unit: $.data.error_id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000 }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/permit-limits"
              payload: { pollutant: "SO2", limit_value: 300.0, limit_units: "LB_PER_HR", effective_from_utc: "2026-04-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { e_limit: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST and GET /emissions/facilities returns total_count == 0"
            - "trigger 2 returns HTTP 201 — the identical body with orispl_code present is accepted"
            - "trigger 3 returns HTTP 400 with error_id == ERR_INVALID_REQUEST (max_rated_heat_input_mmbtu_hr is required)"
            - "trigger 4 returns HTTP 201 with Unit.${unit_id}.control_device == NONE — control_device is optional"
            - "trigger 5 returns HTTP 400 with error_id == ERR_INVALID_REQUEST (averaging_basis is required) and GET /emissions/permit-limits?unit_id=${unit_id} returns total_count == 0"

      - name: entity_omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.max_concurrent_control_outages
          - entities.Unit.fields.control_device
          - entities.Unit.fields.control_status
          - entities.Unit.fields.dispatch_state
          - entities.MonitoringSystem.fields.calibration_error_spec_pct
        distinguishing_aspect: "A facility created without max_concurrent_control_outages, a unit created without control_device and a monitoring system created without calibration_error_spec_pct all receive their declared defaults, and the units's system-managed fields initialise to OFFLINE / AVAILABLE / 100.0 / 0.0."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000 }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0 }
              as: QAAnalyst
              captures: { cem_id: $.data.id }
          assert:
            - "Facility.${fac_id}.max_concurrent_control_outages == 2 and status == OPERATING and compliance_posture == COMPLIANT"
            - "Unit.${unit_id}.control_device == NONE"
            - "Unit.${unit_id}.dispatch_state == OFFLINE, control_status == AVAILABLE, dispatch_restricted == false"
            - "Unit.${unit_id}.data_availability_pct == 100.0 and certified_so2_lbs_ytd == 0.0"
            - "MonitoringSystem.${cem_id}.calibration_error_spec_pct == 2.5, qa_status == RECERTIFICATION_PENDING, cal_status == CAL_EXPIRED and bias_adjustment_factor == 1.0"

      - name: entity_system_fields_are_server_generated_on_every_create
        claim_type: system_fields
        grounds:
          - entities.Facility
          - entities.QuarterlyReport
          - endpoints[POST /emissions/units/{id}/quarterly-reports]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server from the logical clock, so two sibling creates in the same chain carry distinct ids but the identical created_at."
        test_recipe:
          setup:
            - "logical clock pinned at 2026-04-02T00:00:00Z"
            - "one facility with two units"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { u1_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U2", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "SCR" }
              as: RegulatoryReviewer
              captures: { u2_id: $.data.id }
          trigger:
            - call: "POST /emissions/units/${u1_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q_id: $.data.id }
          assert:
            - "Unit.${u1_id}.id != Unit.${u2_id}.id and both created_at == 2026-04-02T00:00:00Z"
            - "QuarterlyReport.${q_id}.id is present, version == 1 and created_at == updated_at == 2026-04-02T00:00:00Z"
            - "QuarterlyReport.${q_id}.unit_id == ${u1_id} — the parent is taken from the path, never from the body"
            - "QuarterlyReport.${q_id}.status == DRAFT with resubmission_count == 0 and every total_* field 0"

      - name: entity_enum_and_numeric_constraints_are_enforced_on_input
        claim_type: type_constraints
        grounds:
          - validations[priority=90]
          - validations[priority=340]
          - errors[ERR_VALUE_OUT_OF_RANGE]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An unknown enum member is a 400 ERR_INVALID_REQUEST at priority 90 while an in-range-typed but out-of-range number is a 422 ERR_VALUE_OUT_OF_RANGE at priority 340 — the two never collapse into one code."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "one facility with one unit U1 and a CERTIFIED SO2 CEM plus a DRAFT 2026 Q2 report"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "MERCURY", system_type: "CEM", span_value: 400.0 }
              as: QAAnalyst
              captures: { e_enum: $.data.error_id }
