    roles: [CarrierCoordinator]
    code: 200
    input: []
    output: CarrierPickup
    side_effects:
      - "status = CANCELLED; the window stops participating in calculations.carrier_pickup_window_conflict"
      - "increments CarrierPickup.version by 1"

  # ------------------------------------------------------------- Orders
  - method: POST
    path: "/fulfillment-network/orders"
    description: "Intake a customer order."
    roles: [CustomerCare]
    code: 201
    input: [order_code, customer_ref, destination_zone, service_level, promised_ship_by_utc]
    output: CustomerOrder
    side_effects:
      - "routing_status = UNROUTED, fulfillment_status = PENDING, all unit counters 0"
      - "dc_baseline_cost_cents computed from DC_BASE_CENTS_BY_ZONE[destination_zone] with total_units 0"

  - method: GET
    path: "/fulfillment-network/orders"
    description: "List orders."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["routing_status?", "fulfillment_status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/orders/{order_id}"
    description: "Read one order."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []

  - method: POST
    path: "/fulfillment-network/orders/{order_id}/lines"
    description: "Add a demand line to an unrouted order."
    roles: [CustomerCare]
    code: 201
    input: [sku_id, quantity, unit_price_cents]
    output: OrderLine
    side_effects:
      - "assigned_units = shipped_units = cancelled_units = dc_fallback_units = 0; open_units = quantity; line_status = OPEN"
      - "CustomerOrder.total_units, unassigned_units and dc_baseline_cost_cents recomputed"
      - "increments CustomerOrder.version by 1"

  - method: GET
    path: "/fulfillment-network/order-lines"
    description: "List demand lines, filterable by order and SKU (FK reverse-reachability for OrderLine.order_id and OrderLine.sku_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["order_id?", "sku_id?", "line_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/order-lines/{order_line_id}"
    description: "Read one demand line."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/fulfillment-network/orders/{order_id}/cancel"
    description: "Customer-initiated cancellation of an order with no shipped units."
    roles: [CustomerCare]
    code: 200
    input: [cancel_reason_code]
    output: CustomerOrder
    side_effects:
      - "cancels every non-terminal FulfillmentAssignment of the order with cancel_reason_code CUSTOMER_REQUEST and no reroute"
      - "released units become OrderLine.cancelled_units; open_units = 0; line_status = CANCELLED"
      - "releases StoreInventory reservations and Store.units_committed_epoch / reserved_labor_minutes; recomputes each affected Store.eligibility_score"
      - "emits one CustomerNotification with notification_type CANCELLATION_FULL"
      - "fulfillment_status = CANCELLED; recomputes provisional_cost_cents and cost_index_bps"
      - "increments CustomerOrder.version by 1"

  - method: GET
    path: "/fulfillment-network/orders/{order_id}/cost-comparison"
    description: "Computed read: store-fulfillment cost versus the distribution-centre baseline for this order (calculations.order_cost_per_order_comparison). variant is FINAL when the order's fulfillment_status == SHIPPED, else PROVISIONAL; the body is recomputed on read from the order's current assignment rows and never persisted by this call."
    roles: [NetworkPlanner, CustomerCare]
    code: 200
    input: []
    output: "{ order_id: string, variant: string, parcel_count: integer, component_sum_cents: integer, split_penalty_cents: integer, reroute_overhead_cents: integer, pre_fee_subtotal_cents: integer, network_fee_rate: number, network_fee_cents: integer, store_cost_cents: integer, dc_baseline_cost_cents: integer, cost_index_bps: integer, savings_vs_dc_cents: integer }"
    side_effects: []

  # ------------------------------------------------------------ Routing
  - method: POST
    path: "/fulfillment-network/orders/{order_id}/routing-runs"
    description: "Run the node-selection waterfall for an order. PROVISIONAL evaluates and persists candidates only; COMMIT supersedes still-unaccepted assignments and creates new ones."
    roles: [NetworkPlanner]
    code: 201
    input: [mode, expected_order_version, "override_cost_guardrail?"]
    output: RoutingRun
    side_effects:
      - "initiated_by = PLANNER; persists RoutingCandidate rows per iteration (calculations.routing_candidate_evaluation)"
      - "COMMIT only: cancels every ASSIGNED assignment of the order with cancel_reason_code SUPERSEDED and superseded_by_routing_run_id = this run, releasing its reservations first"
      - "COMMIT only: creates FulfillmentAssignment + AssignmentLine rows per selected node, raising StoreInventory.reserved_units, Store.units_committed_epoch, Store.reserved_labor_minutes and recomputing each selected Store.eligibility_score"
      - "COMMIT only: converts units stranded by MAX_SPLITS_PER_ORDER into OrderLine.dc_fallback_units and emits a DC_FALLBACK CustomerNotification; emits an UNROUTABLE notification when the iteration-1 pool is empty"
      - "re-derives CustomerOrder.routing_status (calculations.order_routing_status_derivation) and recomputes provisional_cost_cents, dc_baseline_cost_cents, cost_index_bps"
      - "increments CustomerOrder.version by 1"

  - method: GET
    path: "/fulfillment-network/routing-runs"
    description: "List routing runs, filterable by order (FK reverse-reachability for RoutingRun.order_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["order_id?", "mode?", "status?", "initiated_by?", "limit?", "offset?"]
    output: RoutingRun[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/routing-runs/{routing_run_id}"
    description: "Read one routing run."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: RoutingRun
    side_effects: []

  - method: GET
    path: "/fulfillment-network/routing-candidates"
    description: "List candidate evaluations, filterable by run and node (FK reverse-reachability for RoutingCandidate.routing_run_id and RoutingCandidate.store_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["routing_run_id?", "store_id?", "iteration?", "selected?", "eligible?", "limit?", "offset?"]
    output: RoutingCandidate[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/routing-candidates/{candidate_id}"
    description: "Read one candidate evaluation."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: RoutingCandidate
    side_effects: []

  # -------------------------------------------------------- Assignments
  - method: GET
    path: "/fulfillment-network/assignments"
    description: "List assignments, filterable by order, node, run, pickup and superseding run (FK reverse-reachability for all five FulfillmentAssignment FKs)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["order_id?", "store_id?", "routing_run_id?", "carrier_pickup_id?", "superseded_by_routing_run_id?", "status?", "epoch?", "limit?", "offset?"]
    output: FulfillmentAssignment[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/assignments/{assignment_id}"
    description: "Read one assignment."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: FulfillmentAssignment
    side_effects: []

  - method: POST
    path: "/fulfillment-network/assignments/{assignment_id}/accept"
    description: "Store accepts the pick task."
    roles: [StoreAssociate]
    code: 200
    input: []
    output: FulfillmentAssignment
    side_effects:
      - "status = ACCEPTED, accepted_at = now"
      - "enforces calculations.concurrent_pick_labor_load"
      - "increments FulfillmentAssignment.version by 1"

  - method: POST
    path: "/fulfillment-network/assignments/{assignment_id}/reject"
    description: "Store refuses the pick task, releasing its reservations and triggering a reroute."
    roles: [StoreAssociate]
    code: 200
    input: [reject_reason_code]
    output: FulfillmentAssignment
    side_effects:
      - "status = REJECTED; AssignmentLine.units_cancelled = units_assigned"
      - "releases OrderLine.assigned_units, StoreInventory.reserved_units, Store.units_committed_epoch and Store.reserved_labor_minutes; recomputes this Store.eligibility_score"
      - "creates a SYSTEM_REROUTE COMMIT RoutingRun excluding this store, which may create a replacement assignment at another node and recompute that node's eligibility_score"
      - "emits exactly one CustomerNotification whose notification_type follows the pinned selection in calculations.order_routing_status_derivation: REJECTION_REROUTED when the reroute run created at least one replacement assignment, DC_FALLBACK when the reroute run stranded units at MAX_SPLITS_PER_ORDER, else UNROUTABLE (the released units stay open)"
      - "re-derives CustomerOrder.routing_status; recomputes provisional_cost_cents and cost_index_bps"
      - "increments FulfillmentAssignment.version by 1"

  - method: POST
    path: "/fulfillment-network/assignments/{assignment_id}/pick"
    description: "Record the pick. A full pick moves to PICKED; a partial pick forks to SHORT_PICKED and reroutes the shortfall. line_picks is an array of { assignment_line_id, units_picked } objects covering every AssignmentLine of the assignment exactly once."
    roles: [StoreAssociate]
    code: 200
    input: [picked_units, line_picks]
    output: FulfillmentAssignment
    side_effects:
      - "status = PICKED when picked_units == assigned_units, else SHORT_PICKED with shortfall_units = assigned_units - picked_units"
      - "sets AssignmentLine.units_picked and (short pick) units_cancelled; recomputes billable_weight_grams"
      - "short pick only: releases the shortfall to OrderLine.open_units and StoreInventory.reserved_units, decrements Store.units_committed_epoch, creates a SYSTEM_REROUTE COMMIT RoutingRun for the shortfall excluding this store, and emits exactly one CustomerNotification whose notification_type follows the pinned selection in calculations.order_routing_status_derivation (SHORT_PICK_REROUTED when that run created a replacement assignment, DC_FALLBACK when it stranded units at MAX_SPLITS_PER_ORDER, else UNROUTABLE)"
      - "increments FulfillmentAssignment.version by 1"

  - method: POST
    path: "/fulfillment-network/assignments/{assignment_id}/pack"
    description: "Record packing, consuming one packaging unit."
    roles: [StoreAssociate]
    code: 200
    input: [package_type]
    output: FulfillmentAssignment
    side_effects:
      - "status = PACKED, packed_at = now, package_type stored, labor_minutes_actual = floor((packed_at - accepted_at) / 60s)"
      - "PackagingSupply.on_hand_units -= 1, lifetime_consumed_units += 1, reorder_flag re-derived"
      - "increments FulfillmentAssignment.version by 1"

  - method: POST
    path: "/fulfillment-network/assignments/{assignment_id}/ship"
    description: "Tender the parcel to a carrier pickup window."
    roles: [StoreAssociate]
    code: 200
    input: [carrier_pickup_id, expected_pickup_version]
    output: FulfillmentAssignment
    side_effects:
      - "status = SHIPPED, shipped_at = now, carrier_pickup_id set, cycle_time_minutes computed"
      - "final_cost_cents = calculations.assignment_fulfillment_cost variant final"
      - "CarrierPickup.reserved_parcels += 1 and increments CarrierPickup.version by 1"
      - "StoreInventory.on_hand_units and reserved_units decrease; available_to_promise_units recomputed"
      - "Store.reserved_labor_minutes decreases; Store.eligibility_score recomputed"
      - "OrderLine.shipped_units / assigned_units updated; CustomerOrder.fulfillment_status re-derived; final_cost_cents, cost_variance_cents and cost_index_bps recomputed when every unit is resolved"
      - "the store's OPEN NodePerformanceWindow metrics are recomputed (calculations.node_performance_metrics)"
      - "increments FulfillmentAssignment.version by 1"

  - method: POST
    path: "/fulfillment-network/assignments/{assignment_id}/cancel"
    description: "Care-initiated cancellation of a single assignment, with or without reroute."
    roles: [CustomerCare]
    code: 200
    input: [cancel_reason_code, reroute]
    output: FulfillmentAssignment
    side_effects:
      - "status = CANCELLED; releases reservations exactly as reject does and recomputes the store's eligibility_score"
      - "reroute true: creates a SYSTEM_REROUTE COMMIT RoutingRun excluding this store; reroute false: released units become OrderLine.cancelled_units"
      - "emits a CustomerNotification (CANCELLATION_PARTIAL or CANCELLATION_FULL)"
      - "re-derives CustomerOrder.routing_status and fulfillment_status"
      - "increments FulfillmentAssignment.version by 1"

  - method: GET
    path: "/fulfillment-network/assignment-lines"
    description: "List assignment lines, filterable by assignment and demand line (FK reverse-reachability for AssignmentLine.assignment_id and AssignmentLine.order_line_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["assignment_id?", "order_line_id?", "limit?", "offset?"]
    output: AssignmentLine[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/assignment-lines/{assignment_line_id}"
    description: "Read one assignment line."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: AssignmentLine
    side_effects: []

  # ------------------------------------------------- Node performance
  - method: POST
    path: "/fulfillment-network/performance-windows/close"
    description: "Ops-run: close every OPEN performance window, re-posture nodes, open the next epoch and retry deferred reroutes. Executes the seven pinned steps of the NodePerformanceWindow OPEN -> CLOSED transition."
    roles: [NetworkPlanner]
    code: 200
    input: []
    output: NodePerformanceWindow[]
    side_effects:
      - "step 1: cancels ASSIGNED / ACCEPTED assignments past pick_deadline_utc with cancel_reason_code PICK_SLA_EXPIRED, in ascending assignment.created_at order"
      - "step 2: computes every window's metrics (calculations.node_performance_metrics), stores ascending store.created_at"
      - "step 3: applies node_action, writes Store.review_score (variant governance_blended) and runs the DEACTIVATION cascade"
      - "step 4: window.status = CLOSED, closed_at_utc = now, Store.units_committed_epoch = 0"
      - "step 5: opens epoch+1 windows for stores with node_status IN {ELIGIBLE, PROBATION}"
      - "step 6: retries every CustomerOrder with routing_status == ROUTING via a COMMIT RoutingRun with excluded_store_ids = [], ascending order.created_at (initiated_by SYSTEM_DEACTIVATION when step 3 released the units, else SYSTEM_REROUTE)"
      - "step 7: recomputes Store.eligibility_score with eligibility_score_basis = TRAILING_WINDOW"
      - "returns the windows closed by this run, ascending store.created_at"

  - method: GET
    path: "/fulfillment-network/performance-windows"
    description: "List performance windows, filterable by node (FK reverse-reachability for NodePerformanceWindow.store_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["store_id?", "epoch?", "status?", "breached?", "limit?", "offset?"]
    output: NodePerformanceWindow[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/performance-windows/{window_id}"
    description: "Read one performance window."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: NodePerformanceWindow
    side_effects: []

  # ---------------------------------------------------- Notifications
  - method: GET
    path: "/fulfillment-network/notifications"
    description: "List customer notifications, filterable by order and assignment (FK reverse-reachability for CustomerNotification.order_id and CustomerNotification.assignment_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["order_id?", "assignment_id?", "notification_type?", "limit?", "offset?"]
    output: CustomerNotification[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/notifications/{notification_id}"
    description: "Read one customer notification."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: CustomerNotification
    side_effects: []

  # ----------------------------------------------------------- Clock
  - method: POST
    path: "/fulfillment-network/_clock/set_current_utc"
    description: "Test-driving endpoint: move the logical clock forward. The server's startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time; it may only move forward."
    roles: [NetworkPlanner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "sets the logical clock consulted by every deadline, cutoff, pickup-window and cycle-time rule"
      - "no entity is mutated: expired assignments are only reaped by POST /performance-windows/close"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_STORE_SCOPE_VIOLATION
    http: 403
    condition: "a StoreAssociate acts on an assignment, inventory row or packaging row whose store_id differs from X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range integer, or pagination limit outside 1..100"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "store_id in a path or body does not resolve"
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "sku_id in a path or body does not resolve"
  - id: ERR_INVENTORY_NOT_FOUND
    http: 404
    condition: "inventory_id does not resolve"
  - id: ERR_PACKAGING_NOT_FOUND
    http: 404
    condition: "supply_id does not resolve"
  - id: ERR_PICKUP_NOT_FOUND
    http: 404
    condition: "pickup_id or carrier_pickup_id does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id does not resolve"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order_line_id does not resolve"
  - id: ERR_ROUTING_RUN_NOT_FOUND
    http: 404
    condition: "routing_run_id does not resolve"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "candidate_id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not resolve"
  - id: ERR_ASSIGNMENT_LINE_NOT_FOUND
    http: 404
    condition: "assignment_line_id in a path or in line_picks does not resolve"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "window_id does not resolve"
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "notification_id does not resolve"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal CustomerOrder.version (§1.2.1 routing-run-create-stale-order)"
  - id: ERR_STALE_PICKUP_VERSION
    http: 412
    condition: "expected_pickup_version does not equal CarrierPickup.version (§1.2.1 pickup-slot-claim-stale-pickup)"
  - id: ERR_STALE_INVENTORY_VERSION
    http: 412
    condition: "expected_inventory_version does not equal StoreInventory.version (§1.2.1 inventory-adjustment-stale-inventory)"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "the assignment's current status does not permit the requested transition"
  - id: ERR_ORDER_NOT_ROUTABLE
    http: 409
    condition: "a routing run is requested for an order whose fulfillment_status is not PENDING"
  - id: ERR_ORDER_LINES_LOCKED
    http: 409
    condition: "a line is added to an order whose routing_status is no longer UNROUTED"
  - id: ERR_NO_ROUTABLE_LINES
    http: 409
    condition: "a routing run is requested for an order with no OrderLine having open_units >= 1"
  - id: ERR_ORDER_ALREADY_SHIPPED_UNITS
    http: 409
    condition: "an order cancellation is requested when shipped_units > 0 or fulfillment_status is not PENDING"
  - id: ERR_PICKUP_STATE_INVALID
    http: 409
    condition: "the pickup's status does not permit the requested operation (tendering to a CLOSED / DEPARTED / CANCELLED pickup, closing a non-SCHEDULED pickup, departing a non-CLOSED pickup)"
  - id: ERR_STORE_NODE_DEACTIVATED
    http: 409
    condition: "in-store work or pickup scheduling is attempted at a node whose node_status is DEACTIVATED"
  - id: ERR_STORE_NOT_DEACTIVATED
    http: 409
    condition: "reactivation is requested for a node whose node_status is not DEACTIVATED"
  - id: ERR_NO_OPEN_WINDOW
    http: 409
    condition: "accept is attempted at a node with no OPEN performance window, or the ops-run finds no OPEN window network-wide"
  - id: ERR_SAFETY_STOCK_EXCEEDS_ON_HAND
    http: 422
    condition: "safety_stock_units would exceed on_hand_units, so floor presentation could be promised away"
  - id: ERR_INVENTORY_BELOW_RESERVED
    http: 422
    condition: "counted_on_hand_units is lower than the row's reserved_units"
  - id: ERR_STORE_CUTOFF_PASSED
    http: 422
    condition: "in-store work is attempted after the node's cutoff_utc_minutes for the current UTC day"
  - id: ERR_PICK_DEADLINE_PASSED
    http: 422
    condition: "accept is attempted at or after assignment.pick_deadline_utc"
  - id: ERR_PICKUP_WINDOW_CLOSED
    http: 422
    condition: "ship is attempted outside the half-open pickup window [window_start_utc, window_end_utc)"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end_utc is not strictly after window_start_utc"
  - id: ERR_PICKUP_WINDOW_OVERLAP
    http: 409
    condition: "the requested pickup window leaves less than 30 minutes of gap to an existing SCHEDULED or CLOSED window at the same node"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is earlier than the logical clock's current value"
  - id: ERR_LABOR_WINDOW_OVERSUBSCRIBED
    http: 422
    condition: "accepting would push the node's overlapping in-progress pick labour above floor(staffed_labor_minutes * 0.5)"
  - id: ERR_PICKUP_CAPACITY_EXCEEDED
    http: 422
    condition: "the pickup window already holds parcel_capacity parcels"
  - id: ERR_PACKAGING_DEPLETED
    http: 422
    condition: "the node has no PackagingSupply unit of the requested package_type"
  - id: ERR_PACKAGE_TYPE_TOO_SMALL
    http: 422
    condition: "the chosen package_type ranks below the assignment's derived_package_type"
  - id: ERR_PICK_UNITS_INVALID
    http: 422
    condition: "picked_units exceeds assigned_units, or line_picks does not sum to picked_units, or a line's units_picked exceeds its units_assigned"
  - id: ERR_ZERO_PICK_NOT_ALLOWED
    http: 422
    condition: "pick is called with picked_units == 0"
  - id: ERR_DUPLICATE_STORE_CODE
    http: 409
    condition: "store_code already exists"
  - id: ERR_DUPLICATE_SKU_CODE
    http: 409
    condition: "sku_code already exists"
  - id: ERR_DUPLICATE_ORDER_CODE
    http: 409
    condition: "order_code already exists"
  - id: ERR_DUPLICATE_INVENTORY_ROW
    http: 409
    condition: "a StoreInventory row already exists for (store_id, sku_id)"
  - id: ERR_DUPLICATE_PACKAGING_ROW
    http: 409
    condition: "a PackagingSupply row already exists for (store_id, package_type)"
  - id: ERR_PICKUP_STORE_MISMATCH
    http: 409
    condition: "the carrier_pickup_id belongs to a different node than the assignment"
  - id: ERR_ASSIGNMENT_LINE_MISMATCH
    http: 409
    condition: "a line_picks entry references an AssignmentLine of a different assignment"
  - id: ERR_PICKUP_HAS_PARCELS
    http: 409
    condition: "cancellation is requested for a pickup whose reserved_parcels > 0"
  - id: ERR_COST_INDEX_GUARDRAIL
    http: 422
    condition: "a COMMIT routing run projects cost_index_bps above MAX_COST_INDEX_BPS (15000) without override_cost_guardrail"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkPlanner
    description: "Owns network configuration (nodes, SKUs, inventory, packaging), the routing engine and the ops-run."
    identity: "opaque"
    exclusive_operations:
      - "POST /fulfillment-network/stores"
      - "PATCH /fulfillment-network/stores/{store_id}"
      - "POST /fulfillment-network/stores/{store_id}/reactivate"
      - "POST /fulfillment-network/skus"
      - "POST /fulfillment-network/store-inventories"
      - "POST /fulfillment-network/packaging-supplies"
      - "POST /fulfillment-network/orders/{order_id}/routing-runs"
      - "POST /fulfillment-network/performance-windows/close"
      - "POST /fulfillment-network/_clock/set_current_utc"
    shared_operations:
      - "POST /fulfillment-network/stores/{store_id}/carrier-pickups (with CarrierCoordinator)"
      - "POST /fulfillment-network/store-inventories/{inventory_id}/adjustments (with StoreAssociate)"
      - "POST /fulfillment-network/packaging-supplies/{supply_id}/restock (with StoreAssociate)"
      - "GET /fulfillment-network/orders/{order_id}/cost-comparison (with CustomerCare)"
      - "every GET list and detail endpoint (with all roles)"

  - name: StoreAssociate
    description: "Executes pick / pack / ship inside one node; X-User-ID is that node's id and every write is scope-checked against it."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /fulfillment-network/assignments/{assignment_id}/accept"
      - "POST /fulfillment-network/assignments/{assignment_id}/reject"
      - "POST /fulfillment-network/assignments/{assignment_id}/pick"
      - "POST /fulfillment-network/assignments/{assignment_id}/pack"
      - "POST /fulfillment-network/assignments/{assignment_id}/ship"
    shared_operations:
      - "POST /fulfillment-network/store-inventories/{inventory_id}/adjustments (with NetworkPlanner)"
      - "POST /fulfillment-network/packaging-supplies/{supply_id}/restock (with NetworkPlanner)"
      - "every GET list and detail endpoint (with all roles; reads are network-wide and not scope-checked)"

  - name: CarrierCoordinator
    description: "Owns carrier pickup windows at every node after they are scheduled."
    identity: "opaque"
    exclusive_operations:
      - "POST /fulfillment-network/carrier-pickups/{pickup_id}/close"
      - "POST /fulfillment-network/carrier-pickups/{pickup_id}/depart"
      - "POST /fulfillment-network/carrier-pickups/{pickup_id}/cancel"
    shared_operations:
      - "POST /fulfillment-network/stores/{store_id}/carrier-pickups (with NetworkPlanner)"
      - "every GET list and detail endpoint (with all roles)"

  - name: CustomerCare
    description: "Owns order intake, demand lines and customer-driven cancellation."
    identity: "opaque"
    exclusive_operations:
      - "POST /fulfillment-network/orders"
      - "POST /fulfillment-network/orders/{order_id}/lines"
      - "POST /fulfillment-network/orders/{order_id}/cancel"
      - "POST /fulfillment-network/assignments/{assignment_id}/cancel"
    shared_operations:
      - "GET /fulfillment-network/orders/{order_id}/cost-comparison (with NetworkPlanner)"
      - "every GET list and detail endpoint (with all roles)"



