  - name: corner_vendor_create_omitting_optional_tuning_applies_declared_defaults
    claim_type: defaults
    grounds:
    - entities.Vendor.fields.inventory_refresh_cadence_minutes
    - entities.Vendor.fields.safety_buffer_units
    - entities.Vendor.fields.oversell_grace_units
    - entities.Vendor.fields.promise_padding_days
    - calculations.vendor_scorecard_metrics.constants.TIER_PADDING_DAYS
    distinguishing_aspect: Omitting every optional tuning input leaves the declared defaults in place, including
      promise_padding_days 2, which comes from the UNRATED entry of TIER_PADDING_DAYS rather than from the request.
    test_recipe:
      setup:
      - The logical clock is at 2026-08-01T00:00:00Z and no vendor exists.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-DEFAULTS
          legal_name: Defaults Only LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
        as: PlatformAdmin
        captures:
          vdf_id: $.data.id
      assert:
      - the response status is 201
      - Vendor.${vdf_id}.performance_tier == UNRATED
      - Vendor.${vdf_id}.promise_padding_days == 2 (the UNRATED entry of TIER_PADDING_DAYS)
      - Vendor.${vdf_id}.oversell_grace_units == 0
      - Vendor.${vdf_id}.onboarding_status == DRAFT
      - Vendor.${vdf_id}.integration_round == 1
  - name: corner_item_unit_cost_cents_is_computed_and_client_value_is_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.DropshipItem.fields.unit_cost_cents
    - calculations.line_cost_and_order_margin
    - endpoints[POST /dropship/items]
    distinguishing_aspect: 'unit_cost_cents has source computed and is not part of the endpoint''s input, so a client-supplied
      value of 1 is discarded and the field is derived from the vendor''s commission rate: round_half_up(24999 *
      8500 / 10000) == 21249.'
    test_recipe:
      setup:
      - Vendor V1 is ACTIVE with cost_model COMMISSION at 1500 bps.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
