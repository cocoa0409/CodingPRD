              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
          trigger:
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
              captures: { err_no_layer: $.data.error_id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
