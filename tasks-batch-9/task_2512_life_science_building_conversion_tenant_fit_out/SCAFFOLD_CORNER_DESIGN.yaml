        claim_type: valid_transition
        grounds:
          - state_machines.FitOutProject.permit_status
          - state_machines.FitOutProject.construction_status
        excluded_because:
          difficulty_instance: fitout_permit_and_construction_dimensions_advance_independently
          rationale: "The parallel-dimension claim is exactly that §1.8 instance's subject: it advances permit_status and construction_status on disjoint triggers and asserts neither dimension is derived from the other."

