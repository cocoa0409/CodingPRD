          - entities.PSPSEvent.fields.notification_status
          - state_machines.PSPSEvent
        distinguishing_aspect: "Both of PSPSEvent's state dimensions have source system, so a freshly created event reads scope_status DRAFT and notification_status NOT_STARTED with every derived score at its declared zero and benefit_variant PRE_EVENT — before any scope row exists."
        test_recipe:
          setup:
