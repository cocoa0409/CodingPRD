          tier: STANDARD
          monthly_rate_cents: 10000
        as: ParkingAttendant
        as_user_id: att-1
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_REFERENCE_NOT_FOUND and HTTP status 404
  - name: invalid_time_range_on_event_create
    claim_type: violation_to_error
    grounds:
    - validations[priority=18]
    - errors[ERR_INVALID_TIME_RANGE]
    distinguishing_aspect: Event with end_at == start_at (not strictly later) is rejected with ERR_INVALID_TIME_RANGE 400.
