- section: consistency_model
  instances:
  - name: immediate_consistency_after_transition
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - response_envelope
    distinguishing_aspect: 'Immediate consistency: every mutation''s effects are visible in the same response and in the very next read — a route
      response already carries queue_id/agent_id/route_depth, and a concurrent-free follow-up GET of the invoice after prepare shows gross/withheld/net
      fully computed.'
    test_recipe:
      setup:
      - ACTIVE contract, queue, certified agent, one waiting call.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          imm_call: $.data.id
      trigger:
      - call: POST /calls/${imm_call}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: GET /calls/${imm_call}
        payload: {}
        as: Supervisor
      assert:
      - the transition response body itself shows status ASSIGNED, queue_id ${kq_id}, agent_id ${ka_id}, route_depth 1, assigned_via PRIMARY
      - the immediate GET reflects identical values (no eventual-consistency lag)
      - updated_at == the logical clock at transition time and version == 2
