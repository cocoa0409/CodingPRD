      - name: cell_slot_counters_reconcile_after_reserve_waitlist_and_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ServiceCell.fields.reserved_slot_count
          - entities.ServiceCell.fields.waitlist_depth
          - entities.ServiceCell.fields.free_slot_count
          - entities.ServiceCell.fields.availability_state
          - state_machines.ServiceOrder.RESERVED_to_CANCELLED
          - 'endpoints["POST /satellite-broadband/service-orders/{id}/cancel"]'
        distinguishing_aspect: "The derived slot ledger is re-checked after a create, after a promotion-bearing cancel and after the last cancel: the promotion moves one unit from waitlist_depth to reserved_slot_count in a single response, so the counters must reconcile as a transfer rather than being recomputed twice."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence, beam BEAM-01 (1000 Mbps), cell CELL-001 with max_active_terminals 1, plan PLAN-P1-200."
            - "Subscribers sub1 and sub2 exist with no orders yet; the cell reads reserved 0 / waitlist 0 / free 1 / AVAILABLE."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 1000, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub2@example.com", full_name: "Sub Two", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub2_id: "$.data.id" }
          trigger:
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub2_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order2_id: "$.data.id" }
            - call: "GET /satellite-broadband/service-cells/${cell_id}/availability"
              payload: {}
              as: ProvisioningAgent
              captures: { free_after_create: "$.data.advertised_free_slot_count" }
            - call: "POST /satellite-broadband/service-orders/${order1_id}/cancel"
              payload: { cancel_reason: "changed mind" }
              as: ProvisioningAgent
              captures: { cancelled_state: "$.data.order_state" }
            - call: "POST /satellite-broadband/service-orders/${order2_id}/cancel"
              payload: { cancel_reason: "changed mind too" }
              as: Subscriber
              as_user_id: "${sub2_id}"
              captures: { cancelled_state2: "$.data.order_state" }
          assert:
            - "after the two creates: ServiceOrder.${order1_id}.order_state == RESERVED and ServiceOrder.${order2_id}.order_state == WAITLISTED"
            - "after the two creates: ServiceCell.${cell_id}.reserved_slot_count == 1, waitlist_depth == 1, committed_terminal_count == 0, free_slot_count == 0, availability_state == WAITLIST_ONLY"
            - "${free_after_create} == 0 (the availability read agrees with the persisted ledger)"
            - "after the first cancel: ServiceOrder.${order1_id}.order_state == CANCELLED and ServiceOrder.${order2_id}.order_state == RESERVED (promoted)"
            - "after the first cancel: ServiceCell.${cell_id}.reserved_slot_count == 1, waitlist_depth == 0, free_slot_count == 0, availability_state == WAITLIST_ONLY"
            - "after the first cancel: Subscriber.${sub2_id}.account_state == PROSPECT"
            - "after the second cancel: ServiceCell.${cell_id}.reserved_slot_count == 0, waitlist_depth == 0, committed_terminal_count == 0, free_slot_count == 1, availability_state == AVAILABLE"
            - "reserved_slot_count + committed_terminal_count + free_slot_count == max_active_terminals == 1 at every one of the three checkpoints"

  # ===========================================================================
  # 9. From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: activation_side_effects_are_visible_in_the_same_response_and_an_immediate_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Subscription.initial_transition
          - 'endpoints["POST /satellite-broadband/subscriptions"]'
          - 'endpoints["GET /satellite-broadband/service-cells/{id}"]'
          - 'endpoints["GET /satellite-broadband/beams/{id}"]'
        distinguishing_aspect: "One write, zero waiting: the activation response already carries every derived field it pins (disclosure version, deadline, cycle index), and reads issued immediately afterwards show the cell ledger and the beam's weighted load fully recomputed — nothing is deferred to a sweep or a later re-read."
        test_recipe:
          setup:
            - "ACTIVE + COORDINATED licence with consumer_disclosure_version CD-2026.1, beam BEAM-01 (1000 Mbps), cell CELL-001 (max 1), plan PLAN-P1-200."
            - "Subscriber sub1 has a RESERVED order and an INSTALLED terminal; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOpsEngineer }
            - call: "POST /satellite-broadband/spectrum-licenses"
              payload: { license_code: "LIC-US-CA-KA-01", jurisdiction_code: "US-CA", frequency_band: "KA_FORWARD", max_eirp_dbw: 62.5, expires_at: "2027-12-31T00:00:00Z", consumer_disclosure_version: "CD-2026.1", in_motion_permitted: true }
              as: ComplianceOfficer
              captures: { lic_id: "$.data.id" }
            - { call: "POST /satellite-broadband/spectrum-licenses/${lic_id}/coordination", payload: { outcome: "GRANTED", coordination_note: "no neighbour objection" }, as: ComplianceOfficer }
            - call: "POST /satellite-broadband/beams"
              payload: { beam_code: "BEAM-01", satellite_code: "SAT-A", spectrum_license_id: "${lic_id}", forward_capacity_mbps: 1000, oversubscription_limit: 4.0 }
              as: NetworkOpsEngineer
              captures: { beam_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-cells"
              payload: { cell_code: "CELL-001", beam_id: "${beam_id}", jurisdiction_code: "US-CA", max_active_terminals: 1 }
              as: NetworkOpsEngineer
              captures: { cell_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-plans"
              payload: { plan_code: "PLAN-P1-200", committed_rate_mbps: 200, priority_tier: "PRIORITY_1", monthly_fee_cents: 9900, priority_data_gb: 100, deprioritized_rate_mbps: 20, overage_rate_cents_per_gb: 25, roaming_allowed: true, in_motion_allowed: true }
              as: ProvisioningAgent
              captures: { plan_id: "$.data.id" }
            - call: "POST /satellite-broadband/subscribers"
              payload: { email: "sub1@example.com", full_name: "Sub One", jurisdiction_code: "US-CA" }
              as: ProvisioningAgent
              captures: { sub1_id: "$.data.id" }
            - call: "POST /satellite-broadband/service-orders"
              payload: { subscriber_id: "${sub1_id}", service_cell_id: "${cell_id}", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order1_id: "$.data.id" }
            - call: "POST /satellite-broadband/terminals"
              payload: { serial_number: "TRM-0001", subscriber_id: "${sub1_id}", warranty_expires_at: "2028-08-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { term1_id: "$.data.id" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/deliver", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/obstruction-scans", payload: { obstructed_sample_count: 1, total_sample_count: 200 }, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "POST /satellite-broadband/terminals/${term1_id}/install", payload: {}, as: Subscriber, as_user_id: "${sub1_id}" }
            - { call: "GET /satellite-broadband/service-cells/${cell_id}", payload: {}, as: ProvisioningAgent, captures: { cell_v1: "$.data.version" } }
          trigger:
            - call: "POST /satellite-broadband/subscriptions"
              payload: { service_order_id: "${order1_id}", terminal_id: "${term1_id}", expected_service_cell_version: "${cell_v1}" }
              as: ProvisioningAgent
              captures: { sn1_id: "$.data.id", issued_version: "$.data.disclosure_version_issued", deadline: "$.data.disclosure_ack_deadline_at" }
            - call: "GET /satellite-broadband/service-cells/${cell_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { cell_free_now: "$.data.free_slot_count" }
            - call: "GET /satellite-broadband/beams/${beam_id}"
              payload: {}
              as: NetworkOpsEngineer
              captures: { beam_weighted_now: "$.data.weighted_sold_mbps" }
            - call: "GET /satellite-broadband/subscribers/${sub1_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { account_now: "$.data.account_state" }
          assert:
            - "first trigger response HTTP status == 201"
            - "first trigger response body already carries service_state PENDING_ACTIVATION, authorization_state UNAUTHORIZED, priority_state PRIORITY, disclosure_ack_state PENDING_ACK"
            - "${issued_version} == CD-2026.1 and ${deadline} == 2026-08-15T00:00:00.000Z (pinned in the same response, no later fill-in)"
            - "first trigger response body carries cycle_billing_index == 0, cycle_priority_gb_used == 0, activated_at == 2026-08-01T00:00:00.000Z, effective_rate_mbps == 200"
            - "${cell_free_now} == 0 and ServiceCell.${cell_id}.committed_terminal_count == 1 and reserved_slot_count == 0 and availability_state == WAITLIST_ONLY"
            - "${beam_weighted_now} == 200 and Beam.${beam_id}.oversubscription_ratio == 0.2 and capacity_state == NORMAL"
            - "${account_now} == ACTIVE and ServiceOrder.${order1_id}.order_state == ACTIVATED"
            - "no assertion requires a second read or a clock advance to observe any of the above"
