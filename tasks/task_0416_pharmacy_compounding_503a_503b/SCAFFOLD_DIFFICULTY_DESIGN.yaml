              as: QualityAssurancePharmacist
              captures: { recall_id: $.data.id }
          assert:
            - "CompoundingBatch.${batch_id}.status == RECALLED"
            - "FinishedPreparation.${prep0_id}.dispense_status == RECALLED and FinishedPreparation.${prep1_id}.dispense_status == RECALLED"
            - "Prescription.${rx_id}.units_dispensed == 0 (decremented from 2 by both recalled-dispensed units)"
            - "Prescription.${rx_id}.status == ACTIVE (reverted from FILLED)"
            - "Recall.${recall_id}.units_in_scope == 2"

      - name: qc_fail_cascade_test_to_lot_quarantine_depth2
        grounds:
          - state_machines.QualityControlTest.IN_PROGRESS_to_FAILED
          - entities.IngredientLot.fields.status
          - state_machines.CompoundingBatch.IN_PROCESS_to_COMPILED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /qc-tests/{qid}/record):
          a STERILITY test failing on a sterile batch mutates the QualityControlTest
          (IN_PROGRESS->FAILED); that failure itself cascades to quarantine every
          AVAILABLE IngredientLot charged to the batch (AVAILABLE->QUARANTINED) — a
          contamination-trace propagation originating from QC, distinct from the recall trigger.
        test_recipe:
          setup:
            - "503B facility, clock 2026-06-01T00:00:00.000Z, sterile-aqueous MFR."
            - "One AVAILABLE lot charged to an OFFICE_USE batch; batch started and compiled."
            - "A STERILITY QC test added and begun (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "QCFail B", registration_type: "503B", state_code: "TX" }
