  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_accrual_create_with_a_stale_period_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[accrual-create-stale-period]
          - errors[ERR_STALE_PERIOD_VERSION]
        distinguishing_aspect: "The first accrual bumps AccrualPeriod.version, so a second create still carrying the version read at period creation is refused 412; re-reading the period and retrying with the fresh token succeeds."
        test_recipe:
          setup:
            - "The canonical FAM-A analog basis and family FAM-OC1 with TWO vintages so the retry is not a duplicate accrual."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_oc1_id: $.data.id, p_oc1_ver1: $.data.version }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-A", name: "Legacy Compressor Platform", launch_date: "2022-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 20000, reserve_cap_cents: 100000000 }
              as: WarrantyAnalyst
              captures: { fam_a_oc1: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_a_oc1}", vintage_code: "A-MY2022", units_shipped: 10000, ship_period_code: "2022-Q1", warranty_expiry_date: "2029-12-31" }
              as: WarrantyAnalyst
              captures: { vin_a_oc1: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_a_oc1}", mode_code: "FM-A-CORE", description: "Legacy compressor core wear", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_a_oc1: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_a_oc1}", failure_mode_id: "${fm_a_oc1}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 24, claim_count: 300, paid_cost_cents: 6000000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-OC1", name: "Concurrency Platform One", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 30000, reserve_cap_cents: 100000000, engineering_estimate_rate_ppm: 4000, analog_family_id: "${fam_a_oc1}" }
              as: WarrantyAnalyst
              captures: { fam_oc1_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_oc1_id}", vintage_code: "OC1-MY2024-A", units_shipped: 3000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_oc1_a: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_oc1_id}", vintage_code: "OC1-MY2024-B", units_shipped: 3000, ship_period_code: "2024-Q2", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_oc1_b: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_oc1_id}", mode_code: "FM-OC1-01", description: "Concurrency platform mode", severity: "FUNCTIONAL", cost_per_claim_cents: 30000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p_oc1_id}", vintage_id: "${vin_oc1_a}", method: "ANALOG_BLEND", elapsed_exposure_bps: 2000, expected_period_version: "${p_oc1_ver1}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_oc1_a: $.data.id }
          trigger:
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p_oc1_id}", vintage_id: "${vin_oc1_b}", method: "ANALOG_BLEND", elapsed_exposure_bps: 2000, expected_period_version: "${p_oc1_ver1}" }
              as: WarrantyAnalyst
              as_user_id: "ua-2"
              captures: { e_occ1: $.data.error_id }
            - call: "GET /warranty/periods/${p_oc1_id}"
              payload: {}
              as: WarrantyAnalyst
              captures: { p_oc1_ver_now: $.data.version }
            - call: "POST /warranty/accruals"
              payload: { period_id: "${p_oc1_id}", vintage_id: "${vin_oc1_b}", method: "ANALOG_BLEND", elapsed_exposure_bps: 2000, expected_period_version: "${p_oc1_ver_now}" }
