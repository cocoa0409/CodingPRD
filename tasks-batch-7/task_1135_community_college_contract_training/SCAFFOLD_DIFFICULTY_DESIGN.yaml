# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1135: Community College Contract Training
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: quote_pricing_per_participant_vs_flat_cohort
        grounds:
          - calculations.quote_pricing
          - entities.TrainingAgreement.fields.quoted_total_cents
          - endpoints."POST /ct/training-agreements/{id}/quote"
        distinguishing_aspect: |
          Two pricing variants on the SAME estimate inputs produce different quoted totals:
          PER_PARTICIPANT (tiered marginal per-head) yields 1025000 while FLAT_COHORT
          (flat base + overage) yields 809000 for n=20 ON_SITE no-rush. Entity domain:
          TrainingAgreement pricing.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; employer E with APPROVED assessment"
            - "Agreement A1: PER_PARTICIPANT, ON_SITE, est_participant_count=20, est_delivery_hours=10, target_start_date=2026-07-01 (60 days out: no rush)"
            - "Agreement A2: FLAT_COHORT, ON_SITE, identical estimates"
          setup_api_calls:
            - call: "POST /ct/employers"
              payload: { legal_name: "Acme Mfg", industry_code: "332710", contact_email: "hr@acme.example" }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { emp: $.data.id }
            - call: "POST /ct/employers/${emp}/needs-assessments"
              payload: { title: "CNC upskill", skill_gaps: ["cnc"], target_roles: ["operator"], curriculum_modules: [{ code: "CNC-1", hours: 10, required_credential_codes: ["CNC"] }] }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { na: $.data.id }
            - call: "POST /ct/needs-assessments/${na}/submit"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
            - call: "POST /ct/needs-assessments/${na}/approve"
              payload: {}
              as: CollegeAdmin
              as_user_id: "adm-01"
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "PER_PARTICIPANT", delivery_mode: "ON_SITE", est_participant_count: 20, est_delivery_hours: 10, target_start_date: "2026-07-01T00:00:00Z", max_cohorts: 3 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { a1: $.data.id }
            - call: "POST /ct/employers/${emp}/training-agreements"
              payload: { needs_assessment_id: "${na}", pricing_model: "FLAT_COHORT", delivery_mode: "ON_SITE", est_participant_count: 20, est_delivery_hours: 10, target_start_date: "2026-07-01T00:00:00Z", max_cohorts: 3 }
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /ct/training-agreements/${a1}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { q1: $.data.quoted_total_cents }
            - call: "POST /ct/training-agreements/${a2}/quote"
              payload: {}
              as: WorkforceCoordinator
              as_user_id: "wc-01"
              captures: { q2: $.data.quoted_total_cents }
          assert:
            - "TrainingAgreement.${a1}.quoted_total_cents == 1025000  (450000+400000 tuition + 150000 materials + 25000 ON_SITE surcharge)"
            - "TrainingAgreement.${a2}.quoted_total_cents == 809000   (480000 flat + 8*38000 overage + 25000 surcharge)"
            - "${q1} != ${q2}"

      - name: grant_reimbursement_provisional_vs_final
        grounds:
          - calculations.grant_award
          - entities.GrantApplication.fields.provisional_award_cents
          - entities.GrantApplication.fields.final_award_cents
          - state_machines.GrantApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.GrantApplication.APPROVED_to_CLAIMED
        distinguishing_aspect: |
          Grant-fiscal domain (distinct from agreement pricing): the PROVISIONAL award
          computed at approval (quoted/enrolled basis) is 500000 while the FINAL award at
          claim (actual FINAL-invoice gross/completer basis) is 402250 for the same
          application, because 3 of 20 enrollees did not complete.
        test_recipe:
          setup:
            - "Program GP: appropriation 10000000, max_share_pct 0.5, cap_per_trainee 50000, window ends 2026-06-30, claim_deadline_days 60"
            - "Employer E, APPROVED assessment, agreement AGR PER_PARTICIPANT ON_SITE n=20 hours=10 -> quoted 1025000, SIGNED"
            - "Cohort COH (min_enrollment 15, dates 2026-06-01..2026-06-05) with 5 sessions of 2h at EMPLOYER_SITE venue, instructor rate 8000 with CNC+OSHA30 credentials valid past 2026-07-05, all assignments CONFIRMED, 20 participants enrolled, cohort LAUNCHED"
            - "GrantApplication GAP on COH: requested_cents 500000, SUBMITTED -> UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /ct/grant-programs"
              payload: { code: "GP-26", name: "State Training Grant FY26", appropriation_cents: 10000000, max_share_pct: 0.5, cap_per_trainee_cents: 50000, application_window_end: "2026-06-30T23:59:59Z", claim_deadline_days: 60 }
