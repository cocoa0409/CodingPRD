  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_contract_in_force
        grounds:
          - state_machines.ExchangeCase.DRAFT_to_SUBMITTED
          - entities.ExistingContract.fields.status
          - errors[ERR_CONTRACT_NOT_IN_FORCE]
        distinguishing_aspect: |
          Entity pair ExchangeCase -> ExistingContract: a case cannot submit
          while its contract is EXCHANGED (even though no live case occupies it
          and no other check has fired yet — the state-category check at
          priority 6 fires before the anti-churn temporal check at 13).
        test_recipe:
          setup:
            - "Junior client; K_STD contract; case A fully COMPLETED at 2026-08-22 (contract now EXCHANGED, last_exchange_completed_at == 2026-08-22)"
            - "Case B created as DRAFT against the SAME contract"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
