      - name: a_prohibited_ranking_phrase_lands_flagged_while_a_neutral_body_lands_clean
        claim_type: correct_result
        grounds:
          - calculations.communication_compliance_scan
          - entities.CommunicationLog.contains_ranking_intent
          - entities.CommunicationLog.compliance_status
        distinguishing_aspect: >
          The scan is a case-insensitive substring test, so 'how will you rank' matches inside a longer
          sentence and mixed case does not save it. Both calls return 201 - a FLAGGED row is an audit
          record, not a rejection - and only the flagged one carries compliance_status FLAGGED, with
          sent_at stamped from the logical clock rather than the wall clock.
        test_recipe:
          setup:
            - "one Application under a program in REVIEW_OPEN, which is inside the pre-match window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Iris Kwon", is_program_director: true, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { pd_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand1_id}" }
              as: ProgramCoordinator
              captures: { app1_id: "$.data.id" }
          trigger:
            - call: "POST /communication-logs"
              payload: { application_id: "${app1_id}", channel: "EMAIL", body: "Great to meet you today - How Will You Rank our program?", author_faculty_id: "${pd_id}" }
              as: ProgramDirector
              as_user_id: "${pd_id}"
              captures: { flag_log_id: "$.data.id" }
            - call: "POST /communication-logs"
              payload: { application_id: "${app1_id}", channel: "EMAIL", body: "Thank you for interviewing with us today; our coordinator will follow up.", author_faculty_id: "${pd_id}" }
              as: ProgramDirector
              as_user_id: "${pd_id}"
              captures: { clean_log_id: "$.data.id" }
          assert:
            - "both trigger calls return HTTP 201"
            - "CommunicationLog.${flag_log_id}.contains_ranking_intent == true"
            - "CommunicationLog.${flag_log_id}.compliance_status == 'FLAGGED'"
            - "CommunicationLog.${flag_log_id}.sent_at == '2026-09-01T00:00:00Z'"
            - "CommunicationLog.${clean_log_id}.contains_ranking_intent == false"
            - "CommunicationLog.${clean_log_id}.compliance_status == 'CLEAN'"
            - "GET /communication-logs with compliance_status FLAGGED reports total_count == 1"

      - name: declining_with_an_empty_waitlist_frees_the_seat_without_promoting_anyone
        claim_type: input_set_filtering
        grounds:
          - calculations.waitlist_promotion_selector
          - state_machines.InterviewInvitation.ACCEPTED->DECLINED
          - state_machines.InterviewSlot.BOOKED->OPEN
