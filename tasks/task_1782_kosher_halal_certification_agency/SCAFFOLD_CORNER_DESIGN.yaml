            - { call: "POST /api/certificates/${certIm}/issue", as: CertificateOfficer, as_user_id: "co-1", captures: { stIm: $.data.status, iaIm: $.data.issued_at, vuIm: $.data.valid_until, ctIm: $.data.active_product_count } }
            - { call: "GET /api/clients/${cIm}", as: AccountManager, captures: { cImSt: $.data.status } }
          assert:
            - "Issue response itself: stIm == ACTIVE, iaIm == 2026-08-02T10:00:00Z, vuIm == 2027-08-02T10:00:00Z, ctIm == 1 (no re-read needed)"
            - "cImSt == CERTIFIED (client bubble-up visible immediately)"
