      - name: combination_criteria_violations_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_COMBINATION_CRITERIA_NOT_MET]", calculations.combination_window]
        distinguishing_aspect: "Absorb fails 422 ERR_COMBINATION_CRITERIA_NOT_MET in two distinct ways: (i) different customers even inside the window with a package flag; (ii) same customer inside the window but neither contract package-flagged."
        test_recipe:
          setup: ["customers U1 and U2; C1 (U1, signed 2026-05-10, flag true); C2 (U2, signed 2026-05-12); C3 (U1, signed 2026-05-12, flag false) — C1 has flag true"]
          setup_api_calls:
            - call: "POST /revrec/customers"
              payload: { legal_name: "U1 Co", external_ref: "U1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { u1: $.data.id }
            - call: "POST /revrec/customers"
              payload: { legal_name: "U2 Co", external_ref: "U2" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { u2: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${u1}", contract_ref: "CC-1", signed_date: "2026-05-10", fixed_consideration_cents: 100000, risk_tier: "STANDARD", package_negotiated_flag: true }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c1: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${u2}", contract_ref: "CC-2", signed_date: "2026-05-12", fixed_consideration_cents: 50000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
