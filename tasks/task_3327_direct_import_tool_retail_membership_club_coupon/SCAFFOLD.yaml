# =============================================================================
# SCAFFOLD: direct-import-tool-retail-membership-club-coupon (Harbor Freight style)
# Sections 1.0-1.7. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  Direct Import Tool Retail, Membership Club & Coupon Cadence (Harbor Freight Tools): direct sourcing from overseas manufacturers with private brand tiering across value, mid and professional lines, container flow from ports to distribution centers with store allocation and long replenishment lead times, coupon and promotional cadence driving traffic with print, email and app distribution and per-coupon limits, membership club providing member pricing, extended returns and early sale access with renewal management, item-level margin management under aggressive price positioning with quality claim exposure, extended warranty plan sales and claim handling, store expansion in secondary markets with small-format layouts, product recall and safety compliance for imported tools

domain_name: direct-import-tool-retail
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU code; unique across all items" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: brand_tier, type: enum, source: input, description: "Private brand tier: VALUE | MID | PROFESSIONAL" }
      - { name: origin_country, type: string, source: input, description: "ISO country code of the overseas manufacturer" }
      - { name: unit_retail_cents, type: integer, source: input, description: "Everyday retail price in cents; must be > 0" }
      - { name: member_price_cents, type: integer, source: input, description: "Club member price in cents; must be > 0 and <= unit_retail_cents" }
      - { name: floor_margin_pct, type: number, source: input, description: "Minimum allowed gross margin fraction (e.g. 0.15); item must never sell below this margin vs its current landed cost" }
      - { name: lead_time_days, type: integer, source: input, description: "Overseas replenishment lead time in days; >= 1" }
      - { name: unit_weight_kg, type: number, source: input, description: "Unit shipping weight; > 0" }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | ACTIVE | QUARANTINED | DISCONTINUED; initial DRAFT", default: DRAFT }
      - { name: open_recall_count, type: integer, source: computed, description: "Count of linked Recall rows with status ACTIVE; maintained by recall transitions", default: 0 }
      - { name: warranty_claim_rate, type: number, source: computed, description: "Settled+filed claim exposure ratio = (count of WarrantyClaim in FILED/UNDER_REVIEW/APPROVED/SETTLED on lines of this item) / (count of SaleLine rows of this item in COMPLETED/RETURNED_PARTIAL sales); 0 when denominator is 0" }
      - { name: current_landed_unit_cost_cents, type: integer, source: computed, description: "Most recent final landed unit cost from a RECEIVED container line for this item; null until first receipt" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: po_number, type: string, source: input, description: "Human-readable PO number; unique" }
      - { name: lines, type: array, source: input, description: "Array of {item_id (references Item.id), quantity, unit_cost_cents}; >= 1 line; quantity >= 1; unit_cost_cents >= 0" }
      - { name: estimated_duty_cents, type: integer, source: input, description: "Estimated total import duty for the whole PO; >= 0" }
      - { name: estimated_freight_cents, type: integer, source: input, description: "Estimated total ocean freight for the whole PO; >= 0" }
      - { name: actual_duty_cents, type: integer, source: input, description: "Actual duty, supplied when the first container for this PO is received; >= 0; null before" }
      - { name: actual_freight_cents, type: integer, source: input, description: "Actual freight, supplied at first container receipt; >= 0; null before" }
      - { name: provisional_landed_costs, type: object, source: computed, description: "Map item_id -> provisional landed unit cost cents (forward_looking variant), computed at ISSUED" }
      - { name: final_landed_costs, type: object, source: computed, description: "Map item_id -> final landed unit cost cents (chronological/actual variant), computed when each container is received" }
      - { name: received_quantities, type: object, source: computed, description: "Map item_id -> total units received across RECEIVED containers of this PO" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_RECEIVED | RECEIVED | CANCELLED", default: DRAFT }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: po_id, type: string, source: input, description: "FK -> PurchaseOrder.id; PO must be ISSUED or PARTIALLY_RECEIVED at booking" }
      - { name: container_number, type: string, source: input, description: "Unique container number" }
      - { name: lines, type: array, source: input, description: "Array of {item_id (references Item.id), quantity}; every item must appear in po.lines; quantity >= 1" }
      - { name: unallocated_quantities, type: object, source: computed, description: "Map item_id -> line quantity minus units held by StoreAllocation rows in PLANNED/COMMITTED for this container+item" }
      - { name: status, type: enum, source: system, description: "BOOKED | DEPARTED | AT_PORT | CUSTOMS_HOLD | CLEARED | RECEIVED | CANCELLED", default: BOOKED }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Unique store code" }
      - { name: name, type: string, source: input, description: "Store name" }
      - { name: format, type: enum, source: input, description: "SMALL_FORMAT | STANDARD; SMALL_FORMAT used for secondary-market expansion" }
      - { name: market_tier, type: enum, source: input, description: "PRIMARY | SECONDARY" }
      - { name: receiving_capacity_units, type: integer, source: input, description: "Max units receivable per calendar day at this store's dock; >= 1" }
      - { name: assortment_item_ids, type: array, source: input, description: "Array of Item.id this store carries; SMALL_FORMAT stores: array length (duplicates counted) must be <= 8 (SMALL_FORMAT_ASSORTMENT_CAP)" }

  - name: StoreAllocation
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: container_id, type: string, source: input, description: "FK -> Container.id" }
      - { name: item_id, type: string, source: input, description: "references Item.id; must be one of the container's line items" }
      - { name: quantity, type: integer, source: input, description: "Units allocated; >= 1" }
      - { name: eta_date, type: string, source: computed, description: "Expected store-delivery date (YYYY-MM-DD); set at creation from container status per calculations.allocation_eta" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMMITTED | RELEASED | BLOCKED", default: PLANNED }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: store_credit_cents, type: integer, source: computed, description: "Outstanding store credit balance; credited by returns, debited when applied to sales; never negative", default: 0 }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; at most one Membership row per customer" }
      - { name: tier, type: enum, source: input, description: "CLUB | CLUB_PLUS" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | CANCELLED", default: ACTIVE }
      - { name: started_at, type: datetime, source: system, description: "Enrollment timestamp (logical clock)" }
      - { name: expires_at, type: datetime, source: computed, description: "started_at (or last renewal effective time) + 365 days" }
      - { name: return_window_days, type: integer, source: computed, description: "90 while ACTIVE or within 30-day post-expiry grace; otherwise not applicable", default: 90 }
      - { name: settled_savings_cents, type: integer, source: computed, description: "Sum over member's COMPLETED sales (net of RETURNED_FULL) of (unit_retail price - price actually paid) per line, excluding membership-fee and warranty lines; settled variant", default: 0 }
      - { name: optimistic_savings_cents, type: integer, source: computed, description: "Settled savings plus projected discounts on the member's OPEN sales; optimistic variant", default: 0 }
      - { name: renewal_fee_cents, type: integer, source: computed, description: "Fee charged at last enrollment/renewal per calculations.renewal_fee_tier" }

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique coupon code (case-insensitive unique)" }
      - { name: channel, type: enum, source: input, description: "PRINT | EMAIL | APP" }
      - { name: audience, type: enum, source: input, description: "ALL | MEMBERS_ONLY" }
      - { name: discount_type, type: enum, source: input, description: "PERCENT_OFF_ITEM | AMOUNT_OFF_ITEM | PERCENT_OFF_BASKET | FIXED_AMOUNT_OFF_BASKET" }
      - { name: discount_value, type: number, source: input, description: "Percent (0-100 exclusive) for PERCENT_* types; cents (>0) for AMOUNT_/FIXED_ types" }
      - { name: min_basket_cents, type: integer, source: input, description: "Minimum post-member-price basket subtotal to redeem; 0 = none", default: 0 }
      - { name: max_discount_cents, type: integer, source: input, description: "Cap on computed discount; null = uncapped" }
      - { name: per_customer_limit, type: integer, source: input, description: "Max redemptions per customer across the coupon's life; >= 1" }
      - { name: budget_cents, type: integer, source: input, description: "Total promotional budget; >= 1" }
      - { name: budget_spent_cents, type: integer, source: computed, description: "Discount cents from COMPLETED sales using this coupon", default: 0 }
      - { name: budget_reserved_cents, type: integer, source: computed, description: "Discount cents currently reserved by OPEN sales that applied this coupon", default: 0 }
      - { name: usage_records, type: array, source: computed, description: "Array of {customer_id (references Customer.id), count} for COMPLETED redemptions; used for per_customer_limit" }
      - { name: window_start, type: datetime, source: input, description: "Redemption window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Redemption window end (exclusive); must be > window_start" }
      - { name: member_early_start, type: datetime, source: input, description: "Optional members-only early-access start; if set, members may redeem from this time and non-members only from window_start; must be <= window_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | EXPIRED | EXHAUSTED", default: DRAFT }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | RETURNED_PARTIAL | RETURNED_FULL | VOID", default: OPEN }
      - { name: applied_coupon_id, type: string, source: system, description: "references Coupon.id; at most one coupon per sale; null until applied" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded prices before coupon (see calculations.sale_total)" }
      - { name: coupon_discount_cents, type: integer, source: computed, description: "Discount from applied coupon per calculations.coupon_discount", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - coupon_discount_cents - store_credit_applied_cents" }
      - { name: store_credit_applied_cents, type: integer, source: system, description: "Store credit redeemed on this sale (requested at complete)", default: 0 }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }
      - { name: returned_line_quantities, type: object, source: computed, description: "Map sale_line_id -> cumulative returned quantity" }

  - name: SaleLine
    parent: Sale
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: system, description: "FK -> Sale.id" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: quantity, type: integer, source: input, description: ">= 1" }
      - { name: is_warranty_line, type: boolean, source: input, description: "true = extended warranty plan for covered_item_id; warranty lines are excluded from coupon discount and member savings", default: false }
      - { name: covered_item_id, type: string, source: input, description: "references Item.id; required iff is_warranty_line; the item the warranty covers (must be another line's item on this sale)" }
      - { name: warranty_price_cents, type: integer, source: input, description: "Plan price; required iff is_warranty_line; > 0" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Resolved unit price actually charged (member vs retail per calculations.member_price_resolution), rounded per line" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity (warranty lines: warranty_price_cents * quantity)" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: sale_line_id, type: string, source: input, description: "FK -> SaleLine.id; the line must be a warranty line on a COMPLETED/RETURNED_PARTIAL sale" }
      - { name: reason, type: string, source: input, description: "Free-text claim reason" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Requested claim amount; > 0" }
      - { name: settled_amount_cents, type: integer, source: system, description: "Amount paid at settle; <= claim_amount_cents; null until SETTLED" }
      - { name: appeal_count, type: integer, source: system, description: "Number of DENIED -> UNDER_REVIEW appeals; max 1 (second denial is final)", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | DENIED | SETTLED", default: FILED }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: severity, type: enum, source: input, description: "NOTICE | STOP_SALE | HAZARD" }
      - { name: reason, type: string, source: input, description: "Safety compliance description" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", default: DRAFT }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /purchase-orders/{poId}/issue"
        actor: PurchasingManager
        preconditions:
          - "PO has >= 1 line"
          - "every line item's lifecycle_status is ACTIVE (ERR_ITEM_NOT_ACTIVE)"
        side_effects:
          - "compute PurchaseOrder.provisional_landed_costs per calculations.provisional_landed_cost"
          - "PurchaseOrder.version increments by 1"

      - from: ISSUED
        to: PARTIALLY_RECEIVED
        trigger: "system (automatic when a Container of this PO reaches RECEIVED and some PO quantity remains unreceived)"
        actor: system
        preconditions: []
        side_effects:
          - "compute PurchaseOrder.final_landed_costs and received_quantities per calculations.final_landed_cost"

      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "system (automatic when received_quantities == po.lines quantities for every item)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute final_landed_costs (chronological full sweep)"

      - from: ISSUED
        to: RECEIVED
        trigger: "system (automatic when a single container receipt completes all quantities)"
        actor: system
        preconditions: []
        side_effects:
          - "compute PurchaseOrder.final_landed_costs and received_quantities per calculations.final_landed_cost"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{poId}/cancel"
        actor: PurchasingManager
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /purchase-orders/{poId}/cancel"
        actor: PurchasingManager
        preconditions:
          - "no Container of this PO is in DEPARTED/AT_PORT/CUSTOMS_HOLD/CLEARED/RECEIVED (ERR_PO_HAS_SHIPPED_CONTAINERS)"
        side_effects:
          - "all BOOKED Containers of this PO -> CANCELLED"
          - "all StoreAllocation rows on those containers -> RELEASED (full release of quantities)"

  - entity: Container
    initial_state: BOOKED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: BOOKED
        to: DEPARTED
        trigger: "POST /containers/{containerId}/depart"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

      - from: DEPARTED
        to: AT_PORT
        trigger: "POST /containers/{containerId}/arrive-port"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

      - from: AT_PORT
        to: CUSTOMS_HOLD
        trigger: "POST /containers/{containerId}/hold-customs"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

      - from: CUSTOMS_HOLD
        to: AT_PORT
        trigger: "POST /containers/{containerId}/release-customs"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
        note: "CYCLE: AT_PORT -> CUSTOMS_HOLD -> AT_PORT is repeatable; each hold/release pair is a full cycle"

      - from: AT_PORT
        to: CLEARED
        trigger: "POST /containers/{containerId}/clear-customs"
        actor: ComplianceOfficer
        preconditions:
          - "no line item of this container is lifecycle_status QUARANTINED with an ACTIVE Recall of severity HAZARD (ERR_CONTAINER_QUARANTINE_BLOCK)"
        side_effects: []

      - from: CLEARED
        to: RECEIVED
        trigger: "POST /containers/{containerId}/receive"
        actor: LogisticsCoordinator
        preconditions:
          - "PurchaseOrder.actual_duty_cents and actual_freight_cents are supplied (in the receive payload) if this is the PO's first receipt (ERR_PO_ACTUAL_COSTS_REQUIRED)"
        side_effects:
          - "cascade 1: PurchaseOrder recomputes final_landed_costs/received_quantities and may transition ISSUED->PARTIALLY_RECEIVED or ->RECEIVED"
          - "cascade 2 (from cascade 1): every line item's Item.current_landed_unit_cost_cents updates to the new final landed cost; Item.version increments"
          - "cascade 3 (from cascade 2): Item margin floor recheck per calculations.margin_floor_check flags but does not block"
          - "all COMMITTED StoreAllocation rows for this container are delivered: receiving_store capacity check per calculations.daily_receiving_capacity (ERR_STORE_DOCK_CAPACITY_EXCEEDED rejects the receive)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /containers/{containerId}/cancel"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "all StoreAllocation rows on this container -> RELEASED (quantities returned to unallocated pool)"

  - entity: StoreAllocation
    initial_state: PLANNED
    terminal_states: [RELEASED, BLOCKED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /store-allocations/{allocationId}/commit"
        actor: InventoryPlanner
        preconditions:
          - "container status is BOOKED or DEPARTED (ERR_CONTAINER_NOT_ALLOCATABLE)"
          - "quantity <= Container.unallocated_quantities[item_id] (ERR_OVER_ALLOCATION)"
        side_effects:
          - "Container.unallocated_quantities[item_id] -= quantity; Container.version increments by 1"

      - from: COMMITTED
        to: PLANNED
        trigger: "POST /store-allocations/{allocationId}/decommit"
        actor: InventoryPlanner
        preconditions: []
        side_effects:
          - "Container.unallocated_quantities[item_id] += quantity; Container.version increments by 1"
        note: "CYCLE: PLANNED <-> COMMITTED repeatable"

      - from: PLANNED
        to: RELEASED
        trigger: "POST /store-allocations/{allocationId}/release"
        actor: InventoryPlanner
        preconditions: []
        side_effects: []

      - from: COMMITTED
        to: RELEASED
        trigger: "POST /store-allocations/{allocationId}/release"
        actor: InventoryPlanner
        preconditions: []
        side_effects:
          - "Container.unallocated_quantities[item_id] += quantity"

      - from: PLANNED
        to: BLOCKED
        trigger: "system (automatic when a Recall on the allocation's item reaches ACTIVE with severity STOP_SALE or HAZARD)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMMITTED
        to: BLOCKED
        trigger: "system (automatic on recall activation as above)"
        actor: system
        preconditions: []
        side_effects:
          - "Container.unallocated_quantities[item_id] += quantity (commit released back to pool)"

  - entity: Item
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /items/{itemId}/activate"
        actor: PurchasingManager
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: QUARANTINED
        trigger: "system (automatic when a Recall on this item reaches ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Item.open_recall_count += 1"
          - "if recall severity is STOP_SALE or HAZARD: all non-terminal StoreAllocation rows for this item -> BLOCKED; containers holding this item in AT_PORT/CUSTOMS_HOLD cannot clear customs"

      - from: QUARANTINED
        to: ACTIVE
        trigger: "system (automatic when Item.open_recall_count drops to 0 via recall closure)"
        actor: system
        preconditions: []
        side_effects: []
        note: "CYCLE: ACTIVE <-> QUARANTINED repeatable"

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /items/{itemId}/discontinue"
        actor: PurchasingManager
        preconditions: []
        side_effects: []

      - from: QUARANTINED
        to: DISCONTINUED
        trigger: "POST /items/{itemId}/discontinue"
        actor: PurchasingManager
        preconditions: []
        side_effects: []

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic when logical clock passes expires_at without renewal; evaluated lazily on any membership access and on sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "member pricing no longer applies to OPEN sales of this customer (existing OPEN SaleLine rows are NOT repriced)"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/renew"
        actor: Customer
        preconditions:
          - "current logical time < expires_at + 30 days (grace window; else ERR_RENEWAL_WINDOW_CLOSED)"
        side_effects:
          - "expires_at = max(expires_at, current logical time) + 365 days"
          - "renewal_fee_cents computed per calculations.renewal_fee_tier"
        note: "CYCLE: ACTIVE -> LAPSED -> ACTIVE repeatable"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/renew (early renewal while still active)"
        actor: Customer
        preconditions: []
        side_effects:
          - "expires_at = max(expires_at, current logical time) + 365 days"
          - "renewal_fee_cents computed per calculations.renewal_fee_tier"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "no fee refund; membership benefits end immediately"

  - entity: Coupon
    initial_state: DRAFT
    terminal_states: [EXPIRED, EXHAUSTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /coupons/{couponId}/activate"
        actor: MarketingManager
        preconditions:
          - "window_start <= current logical time < window_end is NOT required at activation; activation allowed any time (redemption still time-gated)"
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /coupons/{couponId}/pause"
        actor: MarketingManager
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /coupons/{couponId}/activate"
        actor: MarketingManager
        preconditions: []
        side_effects: []
        note: "CYCLE: ACTIVE <-> PAUSED repeatable"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock reaches window_end; lazy evaluation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: EXPIRED
        trigger: "system (same clock rule)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when budget_spent_cents >= budget_cents after a sale completion)"
        actor: system
        preconditions: []
        side_effects:
          - "no further redemptions accepted (ERR_COUPON_EXHAUSTED)"

  - entity: Sale
    initial_state: OPEN
    terminal_states: [RETURNED_FULL, VOID]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /sales/{saleId}/complete"
        actor: StoreClerk
        preconditions:
          - "sale has >= 1 line (ERR_EMPTY_SALE)"
          - "store must carry every line item in its assortment_item_ids (ERR_ITEM_NOT_IN_STORE_ASSORTMENT)"
          - "if applied_coupon_id set: coupon passes calculations.coupon_redemption_gate"
          - "every line item lifecycle_status == ACTIVE (ERR_ITEM_NOT_ACTIVE)"
          - "store_credit_applied_cents <= Customer.store_credit_cents (ERR_INSUFFICIENT_STORE_CREDIT)"
        side_effects:
          - "completed_at = logical clock now"
          - "coupon budget: budget_reserved_cents -= coupon_discount_cents; budget_spent_cents += coupon_discount_cents; if budget_spent_cents >= budget_cents coupon -> EXHAUSTED"
          - "coupon usage_records[customer].count += 1"
          - "membership savings recompute (settled variant)"
          - "Customer.store_credit_cents -= store_credit_applied_cents"

      - from: COMPLETED
        to: RETURNED_PARTIAL
        trigger: "POST /sales/{saleId}/returns (some but not all units returned)"
        actor: StoreClerk
        preconditions:
          - "return within return window: effective_member(customer, now) => 90 days from completed_at; otherwise 30 days (ERR_RETURN_WINDOW_EXPIRED)"
          - "cumulative returned quantity per line <= line quantity (ERR_RETURN_QUANTITY_EXCEEDED)"
          - "if any returned line's item has an ACTIVE Recall with severity HAZARD, refund is ALWAYS allowed regardless of window (safety override)"
        side_effects:
          - "Customer.store_credit_cents += refund_cents per calculations.return_refund"
          - "if membership savings were counted on returned lines, Membership.settled_savings_cents reduced accordingly (compensating invariant: settled savings + refunds must not double-count)"

      - from: COMPLETED
        to: RETURNED_FULL
        trigger: "POST /sales/{saleId}/returns (all units returned)"
        actor: StoreClerk
        preconditions: ["same as RETURNED_PARTIAL"]
        side_effects:
          - "same as RETURNED_PARTIAL plus: coupon usage_records count NOT decremented (coupon stays consumed)"

      - from: RETURNED_PARTIAL
        to: RETURNED_PARTIAL
        trigger: "POST /sales/{saleId}/returns (further returns)"
        actor: StoreClerk
        preconditions: ["same as RETURNED_PARTIAL"]
        side_effects: ["same as RETURNED_PARTIAL"]

      - from: RETURNED_PARTIAL
        to: RETURNED_FULL
        trigger: "POST /sales/{saleId}/returns (remaining units returned)"
        actor: StoreClerk
        preconditions: ["same as RETURNED_PARTIAL"]
        side_effects: ["same as RETURNED_PARTIAL"]

      - from: OPEN
        to: VOID
        trigger: "POST /sales/{saleId}/void"
        actor: StoreClerk
        preconditions: []
        side_effects:
          - "if a coupon was applied: budget_reserved_cents -= coupon_discount_cents; applied_coupon_id retained for audit"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{claimId}/start-review"
        actor: WarrantyAdjuster
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{claimId}/approve"
        actor: WarrantyAdjuster
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{claimId}/deny"
        actor: WarrantyAdjuster
        preconditions: []
        side_effects: []

      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{claimId}/appeal"
        actor: Customer
        preconditions:
          - "appeal_count < 1 (ERR_CLAIM_APPEAL_EXHAUSTED)"
          - "claim_amount_cents <= 100000 (claims above $1000 are final on first denial; ERR_CLAIM_FINAL)"
        side_effects:
          - "appeal_count += 1"
        note: "CYCLE: UNDER_REVIEW -> DENIED -> UNDER_REVIEW allowed exactly once"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /warranty-claims/{claimId}/settle"
        actor: WarrantyAdjuster
        preconditions:
          - "settled_amount_cents <= claim_amount_cents (ERR_SETTLEMENT_EXCEEDS_CLAIM)"
        side_effects:
          - "Item.warranty_claim_rate recomputed"
          - "Customer.store_credit_cents += settled_amount_cents"

  - entity: Recall
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /recalls/{recallId}/activate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "cascade 1: Item.lifecycle_status ACTIVE -> QUARANTINED; Item.open_recall_count += 1; Item.version increments"
          - "cascade 2 (from cascade 1, severity STOP_SALE/HAZARD only): non-terminal StoreAllocation rows for this item -> BLOCKED; committed quantities returned to Container.unallocated_quantities; Container.version increments"
          - "cascade 3 (from cascade 2): containers in AT_PORT holding this item cannot clear customs until recall closes (guard on Container AT_PORT->CLEARED)"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /recalls/{recallId}/close"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Item.open_recall_count -= 1; if it reaches 0 and lifecycle_status == QUARANTINED, Item -> ACTIVE"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: alloc-commit-stale-container
    parent_entity: Container
    write_endpoint: "POST /store-allocations/{allocationId}/commit"
    occ_field: expected_container_version
    description: |
      Committing a StoreAllocation against a Container whose version has advanced
      since the client last observed it is rejected with 412. Another allocation
      commit or decommit on the same container legitimately mutates the shared
      unallocated pool, so a client holding a stale view of unallocated quantities
      must re-read before committing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_landed_cost
    trigger: "PurchaseOrder DRAFT -> ISSUED"
    algorithm: forward_looking
    formula: |
      For each PO line i:
        goods_i = quantity_i * unit_cost_cents_i
      goods_total = sum(goods_i over all lines)
      pool = estimated_duty_cents + estimated_freight_cents
      For each line i (in line order as given in po.lines):
        provisional_i = unit_cost_cents_i + floor(pool * goods_i / goods_total / quantity_i)
        # integer division, no remainder redistribution (provisional variant keeps it simple)
    input_set: "All lines of the PO being issued; uses estimated (not actual) duty/freight"
    precision: "integer cents, floor division as written"
    variants:
      - name: final_variant
        when: "Container CLEARED -> RECEIVED"
        difference: "uses actual_duty_cents/actual_freight_cents and chronological remainder redistribution; see final_landed_cost"

  - name: final_landed_cost
    trigger: "Container CLEARED -> RECEIVED (first receipt sets actuals; every receipt recomputes)"
    algorithm: chronological
    formula: |
      goods_total = sum over PO lines of (quantity_i * unit_cost_cents_i)
      pool = actual_duty_cents + actual_freight_cents
      Sort PO lines by (line order in po.lines).
      running_remainder = 0
      For each line i in order:
        exact_share_millicents = (pool * goods_i * 1000) / goods_total
        share_cents = floor(exact_share_millicents / 1000)
        running_remainder += exact_share_millicents - share_cents * 1000
        if running_remainder >= 1000:
          share_cents += 1
          running_remainder -= 1000
        final_i = unit_cost_cents_i + floor(share_cents / quantity_i)
      # chronological remainder redistribution: earlier lines absorb rounding pennies first
    input_set: "All lines of the PO (the whole PO cost pool is allocated regardless of which container triggered)"
    precision: "integer cents; per-line remainder carry as written"
    note: "Provisional and final variants MUST produce different results whenever estimated != actual pool, and may differ per-line even with equal pools because of remainder redistribution"

  - name: margin_floor_check
    trigger: "POST /items/{itemId}/reprice (input validation); POST /sales/{saleId}/complete (per non-warranty line); Container receive (flag-only recheck)"
    algorithm: threshold
    formula: |
      For an item with current_landed_unit_cost_cents = C (null C means check passes vacuously):
        floor_price = C * (1 + floor_margin_pct)   # floor_margin_pct is a fraction like 0.15
        A unit price P violates the floor iff P * 100000 < floor(C * (1 + floor_margin_pct) * 100000)
        # comparison in hundred-thousandths of a cent to avoid float drift; boundary: price exactly at floor is ALLOWED (>=)
    constants:
      COMPARISON_SCALE: 100000
    precision: "exact rational comparison, no rounding"

  - name: member_price_resolution
    trigger: "POST /sales/{saleId}/lines and POST /sales/{saleId}/complete"
    algorithm: tiered_pricing
    formula: |
      For a non-warranty SaleLine on a sale by customer C at time T:
        effective_member(C, T) := C has a Membership with status in {ACTIVE, LAPSED}
          and T <= Membership.expires_at + 30 days   (grace; CANCELLED never qualifies)
        if effective_member(C, T):
          unit_price = min(Item.member_price_cents, Item.unit_retail_cents)
        else:
          unit_price = Item.unit_retail_cents
      # price resolved at line-add time AND re-resolved at complete time; the complete-time value wins
    precision: "integer cents"

  - name: coupon_discount
    trigger: "POST /sales/{saleId}/apply-coupon (compute + reserve); POST /sales/{saleId}/complete (recompute + settle)"
    algorithm: threshold
    formula: |
      B = sum of line_total_cents over non-warranty lines (per-line rounded already)
      Eligible base E depends on discount_type:
        PERCENT_OFF_ITEM / AMOUNT_OFF_ITEM: E = line_total_cents of the SINGLE line whose item has the lowest per-line unit_price_cents;
          tie-break: the line created earliest (SaleLine.created_at ASC)
        PERCENT_OFF_BASKET / FIXED_AMOUNT_OFF_BASKET: E = B
      raw_discount =
        PERCENT_OFF_ITEM | PERCENT_OFF_BASKET: floor(E * discount_value / 100)
        AMOUNT_OFF_ITEM | FIXED_AMOUNT_OFF_BASKET: min(discount_value, E)
      discount = min(raw_discount, max_discount_cents) if max_discount_cents set else raw_discount
      if B < min_basket_cents: ERR_COUPON_MIN_BASKET_NOT_MET
      # EVALUATION ORDER (circular-looking, pinned): B computed from per-line totals FIRST;
      # discount computed from B SECOND; total = B - discount - store_credit THIRD. The discount
      # NEVER feeds back into B even though B's eligibility gate (min_basket) references B.
    precision: "integer cents, floor for percent math"

  - name: coupon_redemption_gate
    trigger: "POST /sales/{saleId}/apply-coupon and POST /sales/{saleId}/complete"
    algorithm: threshold
    formula: |
      Ordered gate (first failure wins):
        1. coupon.status == ACTIVE (else ERR_COUPON_NOT_ACTIVE; EXHAUSTED yields ERR_COUPON_EXHAUSTED)
        2. time window: if effective_member(customer, now) and coupon.member_early_start set:
             valid from member_early_start; else valid from window_start; always invalid at >= window_end
             (window_start inclusive, window_end exclusive) (ERR_COUPON_OUTSIDE_WINDOW)
        3. audience MEMBERS_ONLY requires effective_member(customer, now) (ERR_COUPON_MEMBERS_ONLY)
        4. per_customer_limit: usage_records[customer].count < per_customer_limit; boundary: count == limit REJECTS (ERR_COUPON_CUSTOMER_LIMIT_REACHED)
        5. budget gate: coupon_discount + budget_spent_cents + budget_reserved_cents <= budget_cents;
           boundary: equality ALLOWED (<=, not <) (ERR_COUPON_BUDGET_EXCEEDED)
      Channel cadence rule (channel_limit):
        PRINT coupons: per_customer_limit applies per calendar DAY of redemption (count resets daily);
        EMAIL/APP coupons: per_customer_limit applies across the coupon's whole life.
    precision: "integer cents"

  - name: renewal_fee_tier
    trigger: "POST /customers/{customerId}/membership (enroll) and POST /memberships/{membershipId}/renew"
    algorithm: tiered_pricing
    formula: |
      s = Membership.settled_savings_cents at enrollment/renewal time (0 for new enrollments)
      if tier == CLUB:
        if s >= TIER_HIGH: fee = FEE_LOW
        elif s >= TIER_MID: fee = FEE_MID
        else: fee = FEE_HIGH
      if tier == CLUB_PLUS: fee = FEE_PLUS (flat, no savings tiers)
      # boundaries are INCLUSIVE (>=): savings exactly at TIER_MID gets FEE_MID
    constants:
      TIER_MID: 5000
      TIER_HIGH: 20000
      FEE_LOW: 1999
      FEE_MID: 2999
      FEE_HIGH: 3999
      FEE_PLUS: 6999
    precision: "integer cents"

  - name: membership_savings
    trigger: "Sale OPEN -> COMPLETED and Sale COMPLETED -> RETURNED_* (recompute)"
    algorithm: aggregation
    formula: |
      settled_savings_cents = sum over the member's COMPLETED and RETURNED_PARTIAL sales,
        per non-warranty line, of (Item.unit_retail_cents - SaleLine.unit_price_cents) * (quantity - returned_quantity)
        only where unit_retail > unit_price (member actually saved)
      optimistic_savings_cents = settled_savings_cents + projected savings on the member's OPEN sales
        computed with member pricing assumed (even if membership lapses before completion)
      # The two variants diverge whenever OPEN sales exist; settled is the ledger of record,
      # optimistic is the marketing/projection view.
    precision: "integer cents"

  - name: return_refund
    trigger: "POST /sales/{saleId}/returns"
    algorithm: waterfall_allocation
    formula: |
      For a return of quantity q on line L:
        line_refund = L.unit_price_cents * q
      coupon_clawback: if sale.applied_coupon_id set and the returned line was the coupon's eligible line
        (per calculations.coupon_discount eligible-line rule):
          proportional clawback = floor(sale.coupon_discount_cents * q / L.quantity_at_coupon_application)
          line_refund -= clawback (never below 0)
      refund_cents = line_refund
      Allocate refund: credit Customer.store_credit_cents by refund_cents (store credit only; no cash)
    precision: "integer cents, floor on clawback"

  - name: allocation_eta
    trigger: "POST /stores/{storeId}/allocations (create)"
    algorithm: projection
    formula: |
      container status BOOKED/DEPARTED: eta_date = (logical clock date) + Item.lead_time_days
      container status AT_PORT/CUSTOMS_HOLD/CLEARED: eta_date = (logical clock date) + TRANSFER_DAYS
      # long replenishment lead times dominate until the container reaches port
    constants:
      TRANSFER_DAYS: 7
    precision: "whole days"

  - name: daily_receiving_capacity
    trigger: "Container CLEARED -> RECEIVED (per COMMITTED allocation's store)"
    algorithm: threshold
    formula: |
      For store S on receive date D (logical clock date):
        delivered_today = sum of quantities of COMMITTED allocations to S whose containers were RECEIVED with date D earlier
        if delivered_today + this_container_committed_quantity_to_S > S.receiving_capacity_units:
          reject the entire receive with ERR_STORE_DOCK_CAPACITY_EXCEEDED
      # boundary: delivered_today + qty == capacity is ALLOWED (>), comparison strict
    precision: "integer units"

  - name: warranty_claim_rate
    trigger: "WarrantyClaim transitions to SETTLED; any WarrantyClaim created"
    algorithm: aggregation
    formula: |
      numerator = count of WarrantyClaim rows whose sale_line's covered item is I,
        status in {FILED, UNDER_REVIEW, APPROVED, SETTLED}
      denominator = count of SaleLine rows of item I on sales with status in {COMPLETED, RETURNED_PARTIAL}
      rate = numerator / denominator if denominator > 0 else 0
    precision: "4 decimal places, round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids exist (item_id, container_id, sale_line_id, etc.)"
    error_id: "ERR_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_constraint
    check: "Field-shape and domain constraints: required fields present, enums valid, quantity >= 1, member_price_cents <= unit_retail_cents, window_end > window_start, SMALL_FORMAT assortment <= 2000 items, warranty line requires covered_item_id present on same sale"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutation endpoints"

  - priority: 6
    category: business_referential
    check: "Referential integrity: PO line items exist; container lines subset of PO lines; allocation item in container lines; warranty covered_item_id is another line's item on the same sale; store assortment contains sale line items"
    error_id: "ERR_INVALID_REFERENCE (or specific: ERR_ITEM_NOT_IN_STORE_ASSORTMENT)"
    http_status: 422
    applies_to: "creation endpoints with cross-references"

  - priority: 7
    category: state
    check: "Item lifecycle gate: item must be ACTIVE to be placed on a PO line at issue time, added to a sale line, or sold at completion; QUARANTINED/DISCONTINUED items rejected"
    error_id: ERR_ITEM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /purchase-orders/{poId}/issue, POST /sales/{saleId}/lines, POST /sales/{saleId}/complete"

  - priority: 8
    category: business_safety
    check: "Recall safety gate: sale completion with a line whose item has an ACTIVE Recall of severity STOP_SALE or HAZARD is rejected; container customs clearance blocked while holding HAZARD-recalled items"
    error_id: ERR_SAFETY_HOLD
    http_status: 409
    applies_to: "POST /sales/{saleId}/complete, POST /containers/{containerId}/clear-customs"

  - priority: 9
    category: business_temporal
    check: "Coupon time window (with member_early_start for members) per calculations.coupon_redemption_gate step 2"
    error_id: ERR_COUPON_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /sales/{saleId}/apply-coupon, POST /sales/{saleId}/complete"

  - priority: 10
    category: business_constraint
    check: "Coupon audience and per-customer limit per coupon_redemption_gate steps 3-4 (PRINT daily reset, EMAIL/APP lifetime)"
    error_id: "ERR_COUPON_MEMBERS_ONLY | ERR_COUPON_CUSTOMER_LIMIT_REACHED"
    http_status: 422
    applies_to: "POST /sales/{saleId}/apply-coupon, POST /sales/{saleId}/complete"

  - priority: 11
    category: business_fiscal
    check: "Margin floor: every non-warranty sale line's unit_price_cents passes calculations.margin_floor_check at completion"
    error_id: ERR_MARGIN_FLOOR_VIOLATION
    http_status: 422
    applies_to: "POST /sales/{saleId}/complete, POST /items/{itemId}/reprice"

  - priority: 12
    category: business_fiscal
    check: "Coupon budget gate per coupon_redemption_gate step 5; store credit sufficiency (store_credit_applied_cents <= Customer.store_credit_cents)"
    error_id: "ERR_COUPON_BUDGET_EXCEEDED | ERR_INSUFFICIENT_STORE_CREDIT"
    http_status: 402
    applies_to: "POST /sales/{saleId}/apply-coupon, POST /sales/{saleId}/complete"

  - priority: 13
    category: business_temporal
    check: "Return window: 90 days for members (ACTIVE or within 30-day post-expiry grace), else 30 days, measured from Sale.completed_at against logical clock; HAZARD-recall returns exempt"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /sales/{saleId}/returns"

  - priority: 14
    category: business_fiscal
    check: "Allocation pool: commit quantity <= Container.unallocated_quantities[item_id]; store daily receiving capacity per calculations.daily_receiving_capacity"
    error_id: "ERR_OVER_ALLOCATION | ERR_STORE_DOCK_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /store-allocations/{allocationId}/commit, POST /containers/{containerId}/receive"

  - priority: 15
    category: state
    check: "OCC: expected_container_version matches Container.version on allocation commit"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /store-allocations/{allocationId}/commit"

# =============================================================================
# 1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (never wall-clock). All time-gated rules (coupon windows, return windows, membership expiry, ETA) read this clock."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["lazy expiry sweeps: Membership ACTIVE->LAPSED past expires_at; Coupon ACTIVE/PAUSED->EXPIRED at window_end"]

  # --- Item ---
  - method: POST
    path: "/items"
    description: "Create a catalog item (DRAFT)"
    roles: [PurchasingManager]
    code: 201
    input: [sku, name, brand_tier, origin_country, unit_retail_cents, member_price_cents, floor_margin_pct, lead_time_days, unit_weight_kg]
    output: Item
    side_effects: []

  - method: GET
    path: "/items"
    description: "List items"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner, MarketingManager, StoreClerk, WarrantyAdjuster, Customer]
    code: 200
    input: ["limit?", "offset?", "brand_tier?", "lifecycle_status?"]
    output: "Item[]"
    side_effects: []

  - method: GET
    path: "/items/{itemId}"
    description: "Get an item"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner, MarketingManager, StoreClerk, WarrantyAdjuster, Customer]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/items/{itemId}/activate"
    description: "Activate an item for sale"
    roles: [PurchasingManager]
    code: 200
    input: []
    output: Item
    side_effects: ["lifecycle_status DRAFT -> ACTIVE"]

  - method: POST
    path: "/items/{itemId}/reprice"
    description: "Change retail/member price; rejected if new price violates margin floor vs current landed cost"
    roles: [PurchasingManager]
    code: 200
    input: ["unit_retail_cents?", "member_price_cents?"]
    output: Item
    side_effects: ["margin_floor_check", "version increments"]

  - method: POST
    path: "/items/{itemId}/discontinue"
    description: "Discontinue an item"
    roles: [PurchasingManager]
    code: 200
    input: []
    output: Item
    side_effects: ["lifecycle_status -> DISCONTINUED"]

  # --- PurchaseOrder ---
  - method: POST
    path: "/purchase-orders"
    description: "Create a PO (DRAFT)"
    roles: [PurchasingManager]
    code: 201
    input: [po_number, lines, estimated_duty_cents, estimated_freight_cents]
    output: PurchaseOrder
    side_effects: []

  - method: GET
    path: "/purchase-orders"
    description: "List POs"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: GET
    path: "/purchase-orders/{poId}"
    description: "Get a PO"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: POST
    path: "/purchase-orders/{poId}/issue"
    description: "Issue PO to the overseas manufacturer"
    roles: [PurchasingManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["provisional_landed_costs computed (forward_looking variant)", "status DRAFT -> ISSUED"]

  - method: POST
    path: "/purchase-orders/{poId}/cancel"
    description: "Cancel a PO"
    roles: [PurchasingManager]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: ["BOOKED containers -> CANCELLED; their allocations -> RELEASED"]

  # --- Container ---
  - method: POST
    path: "/containers"
    description: "Book a container against an ISSUED/PARTIALLY_RECEIVED PO"
    roles: [LogisticsCoordinator]
    code: 201
    input: [po_id, container_number, lines]
    output: Container
    side_effects: []

  - method: GET
    path: "/containers"
    description: "List containers"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner]
    code: 200
    input: ["limit?", "offset?", "status?", "po_id?"]
    output: "Container[]"
    side_effects: []

  - method: GET
    path: "/containers/{containerId}"
    description: "Get a container"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner]
    code: 200
    input: []
    output: Container
    side_effects: []

  - method: POST
    path: "/containers/{containerId}/depart"
    description: "Mark container departed origin port"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status BOOKED -> DEPARTED"]

  - method: POST
    path: "/containers/{containerId}/arrive-port"
    description: "Mark container arrived at destination port"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status DEPARTED -> AT_PORT"]

  - method: POST
    path: "/containers/{containerId}/hold-customs"
    description: "Place container on customs hold"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Container
    side_effects: ["status AT_PORT -> CUSTOMS_HOLD"]

  - method: POST
    path: "/containers/{containerId}/release-customs"
    description: "Release container from customs hold"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Container
    side_effects: ["status CUSTOMS_HOLD -> AT_PORT"]

  - method: POST
    path: "/containers/{containerId}/clear-customs"
    description: "Clear customs (blocked by HAZARD recall on held items)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Container
    side_effects: ["status AT_PORT -> CLEARED"]

  - method: POST
    path: "/containers/{containerId}/receive"
    description: "Receive container at DC; first receipt of the PO must carry actual duty/freight"
    roles: [LogisticsCoordinator]
    code: 200
    input: ["actual_duty_cents?", "actual_freight_cents?"]
    output: Container
    side_effects: ["status CLEARED -> RECEIVED", "final_landed_cost cascade on PO and Items", "store dock capacity check", "COMMITTED allocations delivered"]

  - method: POST
    path: "/containers/{containerId}/cancel"
    description: "Cancel a BOOKED container"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status BOOKED -> CANCELLED", "allocations -> RELEASED"]

  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Open a store (small-format secondary-market expansion supported)"
    roles: [OpsAdmin]
    code: 201
    input: [store_code, name, format, market_tier, receiving_capacity_units, assortment_item_ids]
    output: Store
    side_effects: []

  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner, StoreClerk]
    code: 200
    input: ["limit?", "offset?", "format?", "market_tier?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/stores/{storeId}"
    description: "Get a store"
    roles: [OpsAdmin, PurchasingManager, LogisticsCoordinator, ComplianceOfficer, InventoryPlanner, StoreClerk]
    code: 200
    input: []
    output: Store
    side_effects: []

  # --- StoreAllocation ---
  - method: POST
    path: "/stores/{storeId}/allocations"
    description: "Create a store allocation from a container line (PLANNED)"
    roles: [InventoryPlanner]
    code: 201
    input: [container_id, item_id, quantity]
    output: StoreAllocation
    side_effects: ["eta_date computed per calculations.allocation_eta"]

  - method: GET
    path: "/stores/{storeId}/allocations"
    description: "List allocations for a store"
    roles: [OpsAdmin, InventoryPlanner, LogisticsCoordinator, StoreClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "container_id?", "item_id?"]
    output: "StoreAllocation[]"
    side_effects: []

  - method: GET
    path: "/store-allocations"
    description: "List allocations filtered by store/container/item"
    roles: [OpsAdmin, InventoryPlanner, LogisticsCoordinator, StoreClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "store_id?", "container_id?", "item_id?"]
    output: "StoreAllocation[]"
    side_effects: []

  - method: GET
    path: "/store-allocations/{allocationId}"
    description: "Get an allocation"
    roles: [OpsAdmin, InventoryPlanner, LogisticsCoordinator, StoreClerk]
    code: 200
    input: []
    output: StoreAllocation
    side_effects: []

  - method: POST
    path: "/store-allocations/{allocationId}/commit"
    description: "Commit a PLANNED allocation, reserving container pool units (OCC-guarded on Container.version)"
    roles: [InventoryPlanner]
    code: 200
    input: [expected_container_version]
    output: StoreAllocation
    side_effects: ["status PLANNED -> COMMITTED", "Container.unallocated_quantities decremented", "Container.version increments by 1"]

  - method: POST
    path: "/store-allocations/{allocationId}/decommit"
    description: "Decommit back to PLANNED, returning units to pool"
    roles: [InventoryPlanner]
    code: 200
    input: []
    output: StoreAllocation
    side_effects: ["status COMMITTED -> PLANNED", "Container.unallocated_quantities incremented", "Container.version increments by 1"]

  - method: POST
    path: "/store-allocations/{allocationId}/release"
    description: "Release an allocation"
    roles: [InventoryPlanner]
    code: 200
    input: []
    output: StoreAllocation
    side_effects: ["status -> RELEASED; pool returned if COMMITTED"]

  # --- Customer & Membership ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [StoreClerk, Customer, OpsAdmin]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [StoreClerk, Customer, WarrantyAdjuster, OpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/membership"
    description: "Enroll customer in the club (one membership per customer)"
    roles: [StoreClerk, Customer]
    code: 201
    input: [tier]
    output: Membership
    side_effects: ["renewal_fee_tier computed", "started_at/expires_at set from logical clock"]

  - method: GET
    path: "/customers/{id}/membership"
    description: "Get the customer's membership"
    roles: [StoreClerk, Customer, WarrantyAdjuster, OpsAdmin]
    code: 200
    input: []
    output: "Membership[]"
    side_effects: []

  - method: GET
    path: "/memberships/{membershipId}"
    description: "Get a membership (includes settled_savings_cents and optimistic_savings_cents)"
    roles: [StoreClerk, Customer, WarrantyAdjuster, OpsAdmin, MarketingManager]
    code: 200
    input: []
    output: Membership
    side_effects: ["lazy expiry: ACTIVE -> LAPSED if past expires_at"]

  - method: POST
    path: "/memberships/{membershipId}/renew"
    description: "Renew (early while ACTIVE, or within 30-day grace while LAPSED)"
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: Membership
    side_effects: ["expires_at extended per state machine", "renewal_fee_cents recomputed"]

  - method: POST
    path: "/memberships/{membershipId}/cancel"
    description: "Cancel membership"
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> CANCELLED"]

  # --- Coupon ---
  - method: POST
    path: "/coupons"
    description: "Create a coupon campaign (DRAFT)"
    roles: [MarketingManager]
    code: 201
    input: [code, channel, audience, discount_type, discount_value, "min_basket_cents?", "max_discount_cents?", per_customer_limit, budget_cents, window_start, window_end, "member_early_start?"]
    output: Coupon
    side_effects: []

  - method: GET
    path: "/coupons"
    description: "List coupons"
    roles: [OpsAdmin, MarketingManager, StoreClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "channel?"]
    output: "Coupon[]"
    side_effects: []

  - method: GET
    path: "/coupons/{couponId}"
    description: "Get a coupon"
    roles: [OpsAdmin, MarketingManager, StoreClerk]
    code: 200
    input: []
    output: Coupon
    side_effects: ["lazy expiry: ACTIVE/PAUSED -> EXPIRED at window_end"]

  - method: POST
    path: "/coupons/{couponId}/activate"
    description: "Activate (or resume from PAUSED)"
    roles: [MarketingManager]
    code: 200
    input: []
    output: Coupon
    side_effects: ["status DRAFT|PAUSED -> ACTIVE"]

  - method: POST
    path: "/coupons/{couponId}/pause"
    description: "Pause an active campaign"
    roles: [MarketingManager]
    code: 200
    input: []
    output: Coupon
    side_effects: ["status ACTIVE -> PAUSED"]

  # --- Sale ---
  - method: POST
    path: "/sales"
    description: "Open a sale at a store for a customer"
    roles: [StoreClerk]
    code: 201
    input: [store_id, customer_id]
    output: Sale
    side_effects: []

  - method: GET
    path: "/sales/{saleId}"
    description: "Get a sale"
    roles: [StoreClerk, Customer, WarrantyAdjuster, OpsAdmin]
    code: 200
    input: []
    output: Sale
    side_effects: []

  - method: GET
    path: "/sales"
    description: "List sales"
    roles: [StoreClerk, OpsAdmin, WarrantyAdjuster]
    code: 200
    input: ["limit?", "offset?", "store_id?", "customer_id?", "status?"]
    output: "Sale[]"
    side_effects: []

  - method: POST
    path: "/sales/{saleId}/lines"
    description: "Add a line (merchandise or extended warranty plan)"
    roles: [StoreClerk]
    code: 201
    input: [item_id, quantity, "is_warranty_line?", "covered_item_id?", "warranty_price_cents?"]
    output: SaleLine
    side_effects: ["member_price_resolution", "sale subtotal recompute", "margin_floor_check (non-warranty lines)"]

  - method: GET
    path: "/sales/{id}/lines"
    description: "List sale lines"
    roles: [StoreClerk, Customer, WarrantyAdjuster, OpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SaleLine[]"
    side_effects: []

  - method: GET
    path: "/sale-lines/{lineId}"
    description: "Get a sale line"
    roles: [StoreClerk, Customer, WarrantyAdjuster, OpsAdmin]
    code: 200
    input: []
    output: SaleLine
    side_effects: []

  - method: GET
    path: "/sale-lines"
    description: "List sale lines filtered by sale or item"
    roles: [StoreClerk, WarrantyAdjuster, OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "sale_id?", "item_id?"]
    output: "SaleLine[]"
    side_effects: []

  - method: POST
    path: "/sales/{saleId}/apply-coupon"
    description: "Apply a coupon to an OPEN sale (at most one coupon per sale)"
    roles: [StoreClerk]
    code: 200
    input: [coupon_code]
    output: Sale
    side_effects: ["coupon_redemption_gate evaluated", "coupon_discount computed", "budget_reserved_cents += discount"]

  - method: POST
    path: "/sales/{saleId}/complete"
    description: "Complete the sale"
    roles: [StoreClerk]
    code: 200
    input: ["store_credit_applied_cents?"]
    output: Sale
    side_effects: ["status OPEN -> COMPLETED", "coupon budget settle + usage_records", "membership savings recompute", "store credit debit"]

  - method: POST
    path: "/sales/{saleId}/void"
    description: "Void an OPEN sale"
    roles: [StoreClerk]
    code: 200
    input: []
    output: Sale
    side_effects: ["status OPEN -> VOID", "coupon reservation released"]

  - method: POST
    path: "/sales/{saleId}/returns"
    description: "Return units of a line"
    roles: [StoreClerk]
    code: 200
    input: [sale_line_id, quantity]
    output: Sale
    side_effects: ["return_refund waterfall (incl. coupon clawback)", "store credit credit", "membership savings reduction"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/warranty-claims"
    description: "File a claim against a warranty line"
    roles: [Customer, StoreClerk]
    code: 201
    input: [sale_line_id, reason, claim_amount_cents]
    output: WarrantyClaim
    side_effects: ["Item.warranty_claim_rate recompute"]

  - method: GET
    path: "/warranty-claims"
    description: "List claims"
    roles: [WarrantyAdjuster, OpsAdmin, StoreClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "sale_line_id?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/warranty-claims/{claimId}"
    description: "Get a claim"
    roles: [WarrantyAdjuster, OpsAdmin, StoreClerk, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{claimId}/start-review"
    description: "Begin review"
    roles: [WarrantyAdjuster]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status FILED -> UNDER_REVIEW"]

  - method: POST
    path: "/warranty-claims/{claimId}/approve"
    description: "Approve a claim"
    roles: [WarrantyAdjuster]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status UNDER_REVIEW -> APPROVED"]

  - method: POST
    path: "/warranty-claims/{claimId}/deny"
    description: "Deny a claim"
    roles: [WarrantyAdjuster]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status UNDER_REVIEW -> DENIED"]

  - method: POST
    path: "/warranty-claims/{claimId}/appeal"
    description: "Customer appeals a denial (max 1 appeal; claims > $1000 final on first denial)"
    roles: [Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status DENIED -> UNDER_REVIEW; appeal_count += 1"]

  - method: POST
    path: "/warranty-claims/{claimId}/settle"
    description: "Settle an approved claim to store credit"
    roles: [WarrantyAdjuster]
    code: 200
    input: [settled_amount_cents]
    output: WarrantyClaim
    side_effects: ["status APPROVED -> SETTLED", "Customer.store_credit_cents += settled_amount_cents", "Item.warranty_claim_rate recompute"]

  # --- Recall ---
  - method: POST
    path: "/recalls"
    description: "Open a recall record (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [item_id, severity, reason]
    output: Recall
    side_effects: []

  - method: GET
    path: "/recalls"
    description: "List recalls"
    roles: [OpsAdmin, ComplianceOfficer, PurchasingManager, StoreClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "item_id?", "severity?"]
    output: "Recall[]"
    side_effects: []

  - method: GET
    path: "/recalls/{recallId}"
    description: "Get a recall"
    roles: [OpsAdmin, ComplianceOfficer, PurchasingManager, StoreClerk]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: POST
    path: "/recalls/{recallId}/activate"
    description: "Activate recall (quarantines item, blocks allocations, holds customs)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Recall
    side_effects: ["cascade per Recall DRAFT->ACTIVE side effects"]

  - method: POST
    path: "/recalls/{recallId}/close"
    description: "Close an active recall"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Recall
    side_effects: ["open_recall_count decrement; Item may return to ACTIVE"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (path ids checked left-to-right)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field-shape/domain constraint violated (missing required field, bad enum, quantity < 1, member_price > retail, window_end <= window_start, SMALL_FORMAT assortment > 8, duplicate sku/po_number/container_number/code/email)" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Cross-reference invalid: container line item not on PO; allocation item not a container line; warranty covered_item_id not a merchandise line on the same sale" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine precondition failed (generic invalid transition)" }
  - { id: ERR_ITEM_NOT_ACTIVE, http: 409, condition: "Item lifecycle_status not ACTIVE where required (PO issue, sale line add, sale complete)" }
  - { id: ERR_SAFETY_HOLD, http: 409, condition: "ACTIVE STOP_SALE/HAZARD recall blocks sale completion or container customs clearance" }
  - { id: ERR_CONTAINER_QUARANTINE_BLOCK, http: 409, condition: "Container holds an item with ACTIVE HAZARD recall; customs clearance blocked" }
  - { id: ERR_PO_HAS_SHIPPED_CONTAINERS, http: 409, condition: "PO cancel attempted while a container is DEPARTED or beyond" }
  - { id: ERR_PO_ACTUAL_COSTS_REQUIRED, http: 422, condition: "First container receipt for a PO must supply actual_duty_cents and actual_freight_cents" }
  - { id: ERR_OVER_ALLOCATION, http: 409, condition: "Commit quantity exceeds Container.unallocated_quantities[item_id]" }
  - { id: ERR_CONTAINER_NOT_ALLOCATABLE, http: 409, condition: "Allocation commit allowed only while container is BOOKED or DEPARTED" }
  - { id: ERR_STORE_DOCK_CAPACITY_EXCEEDED, http: 409, condition: "Container receive would push a store's same-day received units above receiving_capacity_units (strict >)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_container_version != current Container.version on allocation commit" }
  - { id: ERR_MARGIN_FLOOR_VIOLATION, http: 422, condition: "Price would fall below item margin floor vs current landed cost (price < floor; equality allowed)" }
  - { id: ERR_EMPTY_SALE, http: 422, condition: "Sale completion with zero lines" }
  - { id: ERR_ITEM_NOT_IN_STORE_ASSORTMENT, http: 422, condition: "Sale line item not in the store's assortment_item_ids" }
  - { id: ERR_COUPON_NOT_ACTIVE, http: 409, condition: "Coupon status not ACTIVE (DRAFT/PAUSED/EXPIRED)" }
  - { id: ERR_COUPON_EXHAUSTED, http: 409, condition: "Coupon budget fully spent (status EXHAUSTED)" }
  - { id: ERR_COUPON_OUTSIDE_WINDOW, http: 422, condition: "Redemption outside window [member_early_start|window_start, window_end)" }
  - { id: ERR_COUPON_MEMBERS_ONLY, http: 422, condition: "MEMBERS_ONLY coupon redeemed by customer without ACTIVE membership" }
  - { id: ERR_COUPON_CUSTOMER_LIMIT_REACHED, http: 422, condition: "usage_records count == per_customer_limit (PRINT: per day; EMAIL/APP: lifetime)" }
  - { id: ERR_COUPON_MIN_BASKET_NOT_MET, http: 422, condition: "Post-member-price non-warranty subtotal < min_basket_cents" }
  - { id: ERR_COUPON_BUDGET_EXCEEDED, http: 402, condition: "discount + spent + reserved > budget_cents (equality allowed)" }
  - { id: ERR_COUPON_ALREADY_APPLIED, http: 409, condition: "Sale already has an applied coupon (max 1 per sale)" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "store_credit_applied_cents > Customer.store_credit_cents" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 422, condition: "Return after 90 days (member) / 30 days (non-member) from completed_at; HAZARD recalls exempt" }
  - { id: ERR_RETURN_QUANTITY_EXCEEDED, http: 422, condition: "Cumulative returned quantity exceeds line quantity" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "Renewal of LAPSED membership attempted >= 30 days after expires_at" }
  - { id: ERR_MEMBERSHIP_EXISTS, http: 409, condition: "Customer already has a Membership row" }
  - { id: ERR_CLAIM_APPEAL_EXHAUSTED, http: 409, condition: "appeal on claim with appeal_count == 1" }
  - { id: ERR_CLAIM_FINAL, http: 409, condition: "appeal on denied claim with claim_amount_cents > 100000 (final on first denial)" }
  - { id: ERR_SETTLEMENT_EXCEEDS_CLAIM, http: 422, condition: "settled_amount_cents > claim_amount_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator; clock control, store setup, read-mostly elsewhere"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /stores"]
    shared_operations: ["GET on all resources"]

  - name: PurchasingManager
    description: "Owns item catalog, pricing, purchase orders"
    identity: opaque
    exclusive_operations: ["POST /items", "POST /items/{itemId}/activate", "POST /items/{itemId}/reprice", "POST /items/{itemId}/discontinue", "POST /purchase-orders", "POST /purchase-orders/{poId}/issue", "POST /purchase-orders/{poId}/cancel"]
    shared_operations: ["GET items, purchase-orders, containers, stores, recalls"]

  - name: LogisticsCoordinator
    description: "Owns container booking and freight movement"
    identity: opaque
    exclusive_operations: ["POST /containers", "POST /containers/{containerId}/depart", "POST /containers/{containerId}/arrive-port", "POST /containers/{containerId}/receive", "POST /containers/{containerId}/cancel"]
    shared_operations: ["GET purchase-orders, containers, allocations"]

  - name: ComplianceOfficer
    description: "Owns customs decisions and product recalls/safety compliance"
    identity: opaque
    exclusive_operations: ["POST /containers/{containerId}/hold-customs", "POST /containers/{containerId}/release-customs", "POST /containers/{containerId}/clear-customs", "POST /recalls", "POST /recalls/{recallId}/activate", "POST /recalls/{recallId}/close"]
    shared_operations: ["GET items, containers, recalls"]

  - name: InventoryPlanner
    description: "Owns store allocation of inbound inventory"
    identity: opaque
    exclusive_operations: ["POST /stores/{storeId}/allocations", "POST /store-allocations/{allocationId}/commit", "POST /store-allocations/{allocationId}/decommit", "POST /store-allocations/{allocationId}/release"]
    shared_operations: ["GET containers, stores, allocations, purchase-orders"]

  - name: MarketingManager
    description: "Owns coupon campaigns and promotional cadence"
    identity: opaque
    exclusive_operations: ["POST /coupons", "POST /coupons/{couponId}/activate", "POST /coupons/{couponId}/pause"]
    shared_operations: ["GET coupons, memberships"]

  - name: StoreClerk
    description: "Store associate; runs sales, returns, enrollments, warranty intake"
    identity: opaque
    exclusive_operations: ["POST /sales", "POST /sales/{saleId}/lines", "POST /sales/{saleId}/apply-coupon", "POST /sales/{saleId}/complete", "POST /sales/{saleId}/void", "POST /sales/{saleId}/returns"]
    shared_operations: ["POST /customers", "POST /customers/{customerId}/membership", "POST /memberships/{membershipId}/renew", "POST /memberships/{membershipId}/cancel", "POST /warranty-claims", "GET customers, memberships, sales, items, coupons, warranty-claims"]

  - name: WarrantyAdjuster
    description: "Owns extended warranty claim adjudication"
    identity: opaque
    exclusive_operations: ["POST /warranty-claims/{claimId}/start-review", "POST /warranty-claims/{claimId}/approve", "POST /warranty-claims/{claimId}/deny", "POST /warranty-claims/{claimId}/settle"]
    shared_operations: ["GET warranty-claims, sales, customers"]

  - name: Customer
    description: "The retail customer; self-service membership, warranty filing and appeal"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /warranty-claims/{claimId}/appeal"]
    shared_operations: ["POST /customers", "POST /customers/{customerId}/membership", "POST /memberships/{membershipId}/renew", "POST /memberships/{membershipId}/cancel", "POST /warranty-claims", "GET own customer record, membership, sales"]
