        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/submit
        payload: {}
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-3
