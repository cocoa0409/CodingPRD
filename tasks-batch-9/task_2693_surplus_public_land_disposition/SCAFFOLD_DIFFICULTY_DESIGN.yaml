# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids, two differentiated instances each (18 total).
# Every literal below was computed against the §1.3 formulas and their constants:
#   appraised_value_cents 100000000, cured curative spend 250000, reoffer_count 0
#     -> MARKET_FLOOR minimum 99750000, AFFORDABLE_HOUSING_PREFERENCE minimum 64750000
#   required_bid_deposit(99750000) = max(round_half_up(4987500), 500000) = 4987500
#   net proceeds 108000000 - 1249999 - 1500000 = 105250001; cap 15787500
#   waterfall over F1..F4 -> 5000000 / 30000000 / 30000000 / 40000001 (residual 1)
#   good faith: 3 officer rounds, 2 timely, latest officer price 66000000 inside
#     the near band 67987500 -> INTERIM 65 (capped path unused), FINAL 90
#   net proceeds with 20250000 incurred curative -> cap binds -> 89462501
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: minimum_price_market_floor_versus_affordable_housing_write_down
        grounds:
          - calculations.minimum_price_determination
          - entities.DispositionOffering.fields.minimum_price_variant
          - entities.PreferenceOffer.fields.ah_minimum_price_cents
          - state_machines.StatutoryNotice.ISSUED_to_INTEREST_EXPRESSED
          - state_machines.DispositionOffering.null_to_DRAFT
        distinguishing_aspect: |
          Subject domain is real-property valuation: the identical parcel, appraisal
          and curative data yield PreferenceOffer.ah_minimum_price_cents == 64750000
          under AFFORDABLE_HOUSING_PREFERENCE and DispositionOffering.minimum_price_cents
          == 99750000 under MARKET_FLOOR, a 35000000-cent divergence, and only the
          AFFORDABLE_HOUSING_PREFERENCE result is allowed to sit below
          Parcel.book_value_cents == 70000000.
        test_recipe:
          setup:
            - "One custodian Agency and one HOUSING_AUTHORITY Agency that is a registered preference entity with preference_category AFFORDABLE_HOUSING."
            - "One Parcel with book_value_cents 70000000 and a single TitleCurativeItem resolved CURED at actual_cure_cost_cents 250000, so open_title_item_count is 0."
            - "One Appraisal ACCEPTED at appraised_value_cents 100000000 with effective_date 2026-08-01T00:00:00Z, so expires_on is 2027-08-01T00:00:00Z and Parcel.valuation_status is CURRENT."
            - "One SurplusDeclaration ADOPTED with an EXEMPT EnvironmentalReview already CERTIFIED, notices served on the housing authority, and its AFFORDABLE_HOUSING PreferenceOffer negotiated to IMPASSE at the negotiation deadline with a SATISFIED good-faith determination (final score 90)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Housing Authority", agency_type: "HOUSING_AUTHORITY", contact_email: "acq@rbha.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { pref_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-001", address: "14 Depot Road", acreage: 2.5, zoning_code: "R-3", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /parcels/${parcel_id}/title-items"
              payload: { item_type: "LIEN", description: "Recorded mechanics lien from 2019 sidewalk work", cure_cost_estimate_cents: 250000 }
              as: RealPropertyOfficer
              captures: { title_item_id: "$.data.id" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44120", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 100000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Sales comparison of four infill R-3 sales within 0.8 miles." }
              as: Appraiser
              as_user_id: "${appraiser_id}"
            - call: "POST /appraisals/${appraisal_id}/accept"
              payload: {}
              as: RealPropertyOfficer
            - call: "POST /title-items/${title_item_id}/resolve"
              payload: { resolution: "CURED", actual_cure_cost_cents: 250000 }
              as: RealPropertyOfficer
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Depot Road remnant is no longer needed for public works staging." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
