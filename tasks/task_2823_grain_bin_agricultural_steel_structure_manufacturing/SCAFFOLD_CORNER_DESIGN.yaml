        claim_type: violation_to_error
        grounds:
          - validations.p17
          - validations.p26
          - validations.p27
          - validations.p28
          - validations.p29
          - errors.ERR_HIGH_CUBE_ACCESS_DENIED
          - errors.ERR_LOAD_DEALER_MISMATCH
          - errors.ERR_ORDER_ALREADY_ON_LOAD
          - errors.ERR_LOAD_CAPACITY_EXCEEDED
          - errors.ERR_LOAD_HAS_NO_ORDERS
        distinguishing_aspect: "Five distinct gates are separated on one FLATBED load. The high-cube denial is a property of the DEALER rather than of the trailer, so the identical HIGH_CUBE_VAN body would be legal for Alpha and is refused for Pinnacle. The duplicate assignment is refused by priority 28 even though the load has ample room left, which distinguishes an already-attached order from a capacity problem. The fourth kit then breaches the FLATBED envelope on both limbs at once - 25641.6 kg against 21000 and 73.8 m3 against 62.0 - and the critical assertion is that the load is left completely unchanged at three orders, so the rejection is not a partial write. The empty-load dispatch refusal proves order_count is the gate."
