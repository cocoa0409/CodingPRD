            - "${cv_tx_flag} == true and ${cv_az_flag} == false, and GET /state-rate-rules/${cv_tx}/licenses returns total_count == 0 at the start"
            - "LEG 1 — flag on, no License: ${cv_e_unlicensed} == 'ERR_STATE_NOT_LICENSED' with HTTP 422"
            - "LEG 2 — flag off, no License: the byte-identical request against the AZ rule returns 201 with ${cv_agr_az_status} == 'DRAFT', then ${cv_az_sub} == 'PENDING_VERIFICATION' and ${cv_az_act} == 'ACTIVE' with ${cv_az_top} == 539650, so the whole lifecycle runs unlicensed"
            - "LEG 3 — flag on, License added: ${cv_tx_lic_eff} == true (ACTIVE and 2026-01-01 <= 2026-08-15 <= 2027-12-31) and the previously refused TX request now returns 201 with ${cv_agr_tx_status} == 'DRAFT'"
            - "LEG 4 — flag off, License present but SUSPENDED: ${cv_az_lic_status} == 'SUSPENDED' with ${cv_az_lic_eff} == false, yet the AZ request still returns 201 with ${cv_agr_az2_status} == 'DRAFT' — the flag is consulted before any License row is examined"
            - "GET /state-rate-rules/${cv_az}/licenses?status=SUSPENDED returns total_count == 1, confirming leg 4 really did have an ineffective License on file"

      - name: cascading_validation_down_payment_ratio_needs_the_premium_basis_first
        claim_type: cascading_validation
        grounds:
          - validations.priority_26_ERR_DOWN_PAYMENT_BELOW_MINIMUM
          - validations.priority_29_ERR_NO_FINANCED_POLICIES
          - calculations.finance_charge_and_amount_financed.input_set
        distinguishing_aspect: |
          Priority 26 sits ABOVE priority 29 in the ordered list, yet on an agreement with no policies
          it is priority 29 that surfaces — because 26's comparison consumes total_premium_cents, which
          is produced by summing the policy set that 29 is there to guarantee. With an empty basis the
          ratio test degenerates to 0 * 10000 >= 0 * 1500, which holds, so the earlier rule is
          satisfied vacuously and control falls through. Adding a single 600000 policy to an otherwise
          identical agreement then makes 26 fire. The pair proves the dependency rather than the
          ordering: check 26 cannot be evaluated meaningfully until the input set behind check 29
          exists.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "two agreements are created with down_payment_cents 0, which is legal at creation because priority 26 applies only at submit"
            - "agreement X is left with no policies; agreement Y is given one 600000 policy, whose 15 percent minimum would be 90000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { cd_rule: "$.data.id", cd_min_bps: "$.data.min_down_payment_bps" }
            - call: "POST /state-rate-rules/${cd_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { cd_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { cd_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { cd_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${cd_insured}", producer_agent_id: "${cd_agent}", state_rule_id: "${cd_rule}", down_payment_cents: 0, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cd_agr_x: "$.data.id", cd_x_down: "$.data.down_payment_cents", cd_x_policies: "$.data.policy_count" }
            - call: "POST /agreements"
              payload: { insured_id: "${cd_insured}", producer_agent_id: "${cd_agent}", state_rule_id: "${cd_rule}", down_payment_cents: 0, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cd_agr_y: "$.data.id", cd_y_status: "$.data.status" }
            - call: "POST /agreements/${cd_agr_y}/policies"
              payload: { insurer_id: "${cd_insurer}", policy_number: "MC-CD-Y", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cd_pol_y: "$.data.id" }
          trigger:
            - call: "POST /agreements/${cd_agr_x}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cd_e_x: "$.data.error_id" }
            - call: "POST /agreements/${cd_agr_y}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cd_e_y: "$.data.error_id" }
            - call: "GET /agreements/${cd_agr_x}"
              payload: {}
              as: FinanceAnalyst
              captures: { cd_x_status_after: "$.data.status", cd_x_total: "$.data.total_premium_cents" }
            - call: "GET /agreements/${cd_agr_y}"
              payload: {}
              as: FinanceAnalyst
              captures: { cd_y_status_after: "$.data.status", cd_y_policies: "$.data.policy_count", cd_y_total: "$.data.total_premium_cents" }
            - call: "GET /state-rate-rules/${cd_rule}"
              payload: {}
              as: ComplianceOfficer
              captures: { cd_active_count: "$.data.active_agreement_count" }
          assert:
            - "both agreements were created (201) with ${cd_x_down} == 0 and ${cd_y_status} == 'DRAFT', because priority 26 applies only to submit and restructure, never to creation"
            - "${cd_x_policies} == 0 and ${cd_min_bps} == 1500"
            - "AGREEMENT X: ${cd_e_x} == 'ERR_NO_FINANCED_POLICIES' with HTTP 422, NOT ERR_DOWN_PAYMENT_BELOW_MINIMUM, even though 26 is the earlier rule — with an empty premium basis the ratio test reads 0 * 10000 >= 0 * 1500, which holds, so 26 is satisfied vacuously"
            - "AGREEMENT Y: ${cd_e_y} == 'ERR_DOWN_PAYMENT_BELOW_MINIMUM' with HTTP 422, because the basis is now 600000 and 0 * 10000 == 0 < 600000 * 1500 == 900000000, so the minimum is 90000 and nothing was tendered"
            - "the SAME down payment of 0 therefore produces two different errors depending only on whether the policy set behind check 29 exists — the ordering is real but the dependency is what selects the code"
            - "${cd_x_status_after} == ${cd_y_status_after} == 'DRAFT' with ${cd_x_total} and ${cd_y_total} both null: neither refused submit stamped a provisional quote"
            - "${cd_y_policies} == 1 and ${cd_active_count} == 0 — no submit succeeded, so the StateRateRule counter never incremented"

      - name: priority_ordering_higher_rule_wins_when_two_are_violated
        claim_type: priority_ordering
        grounds:
          - validations.priority_22_ERR_STATE_NOT_LICENSED
          - validations.priority_33_ERR_INVALID_FIRST_DUE_DATE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / licensing_beats_temporal_due_date_on_origination
          rationale: "The §1.8 instance violates the licensing rule at priority 22 and the first-due-date rule at priority 33 in one request and asserts that 22's code is returned, then relieves each violation in turn to show the second code appearing."

      - name: priority_conflict_state_gate_beats_the_fiscal_gate_on_payment
        claim_type: priority_conflict
        grounds:
          - validations.priority_11_ERR_AGREEMENT_STATE_INVALID
          - validations.priority_39_ERR_PAYMENT_EXCEEDS_PAYOFF
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / agreement_state_beats_fiscal_overpayment_on_payment
          rationale: "The §1.8 instance posts a grossly excessive payment to a non-ACTIVE note so that priority 11 and priority 39 are both violated, and asserts the state error, which is precisely the priority-conflict row for a distinct error-category pair."

      - name: cross_entity_validation_license_state_decides_agreement_activation
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_22_ERR_STATE_NOT_LICENSED
          - entities.License.fields.is_effective
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / license_effectiveness_gates_agreement_activation
          rationale: "The §1.8 instance tests activation with the License both effective and ineffective (suspended and out-of-window), which is the valid/invalid pair this row asks for."

      - name: temporal_validation_notice_reissue_creates_a_future_blackout
        claim_type: temporal_validation
        grounds:
          - validations.priority_35_ERR_NOTICE_BLACKOUT_ACTIVE
          - validations.priority_34_ERR_NOTICE_WINDOW_OPEN
        excluded_because:
          difficulty_instance: resource_temporal_overlap / renotice_blackout_closed_window_on_agreement
          rationale: "The §1.8 instance cures a delinquency and then probes the closed blackout window at both endpoints and one day past it, which is the temporal-validation row: an operation legal now that creates a future conflict."

  # ---------------------------------------------------------------------------
  # §1.9 — Table 5 (Endpoints)
