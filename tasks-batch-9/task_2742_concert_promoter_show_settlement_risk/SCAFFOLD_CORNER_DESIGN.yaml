      - name: cancellation_event_forks_into_the_reschedule_path_and_the_refund_insurance_path
        claim_type: branching
        grounds:
          - "state_machines.CancellationEvent.transitions.OPENED_to_REFUNDS_PROCESSED"
          - "state_machines.CancellationEvent.transitions.REFUNDS_PROCESSED_to_CLAIM_FILED"
          - "state_machines.CancellationEvent.transitions.CLAIM_FILED_to_CLAIM_SETTLED"
          - "state_machines.CancellationEvent.transitions.OPENED_to_RESCHEDULED"
          - "state_machines.Show.transitions.POSTPONED_to_RESCHEDULED"
          - "calculations.refund_liability_and_recovery"
          - "calculations.adjusted_gross_receipts"
          - "calculations.market_guarantee_exposure"
        distinguishing_aspect: "Two CancellationEvents born in the same state OPENED take the two declared forks and NEVER rejoin: the POSTPONED event walks OPENED -> RESCHEDULED (money moves onto the replacement show, refund_liability collapses to 0, nothing is ever claimed) while the CANCELLED event walks OPENED -> REFUNDS_PROCESSED -> CLAIM_FILED -> CLAIM_SETTLED (refund_liability 500000 is paid out and insurance recovers exactly 600000); afterwards process-refunds on the rescheduled event and reschedule on the settled event are both refused with ERR_ALREADY_TERMINAL 409."
        test_recipe:
          setup:
            - "One market Fork Market with guarantee_exposure_limit_cents 10000000 and one venue Fork Arena (cap 800, facility 0, tax 0)."
            - "Show P (artist Fork Act P, RENTAL rental_fee 150000, announce 2026-08-01) CONFIRMED on a 1000000 guarantee with deposit 0, then ON_SALE with 200 of 400 GA seats sold at 5000 -> gross_sold 1000000, adjusted_gross 975000."
            - "Show Q (artist Fork Act Q, RENTAL rental_fee 0, announce 2026-08-01) CONFIRMED on a 1000000 guarantee with deposit 100000, one ACTIVE PRODUCTION line budgeted 1000000 fully APPROVED at 1000000, then ON_SALE with 100 seats sold at 5000 -> gross_sold 500000."
            - "Replacement show R exists in PLANNED with rescheduled_from_show_id = P. Logical clock stays at 2026-08-01T00:00:00Z throughout, well inside INSURANCE_CLAIM_WINDOW_DAYS."
