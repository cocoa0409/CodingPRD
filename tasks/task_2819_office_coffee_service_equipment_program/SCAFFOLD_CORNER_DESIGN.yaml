            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset2_id}", terms_type: "LOAN", minimum_purchase_cents: 90000, min_term_months: 24, expected_site_version: "${site_v2}" }
              as: AccountManager
              captures: { plc2_id: "$.data.id" }
          assert:
            - "before the trigger EquipmentPlacement.${plc1_id}.placement_status == ACTIVE and EquipmentAsset.${asset1_id}.asset_status == PLACED"
            - "the second placement is HTTP 201 with placement_status ACTIVE, compliance_status MEETING_MINIMUM and terms_type LOAN"
            - "EquipmentPlacement.${plc1_id}.placement_status == SUPERSEDED - a terminal status, so a later /retrieve on it is rejected with ERR_PLACEMENT_STATE_INVALID"
            - "EquipmentAsset.${asset1_id}.asset_status == IN_STOCK again (PLACED -> IN_STOCK) while EquipmentAsset.${asset2_id}.asset_status == PLACED"
            - "GET /ocs/equipment-placements?site_id=${site_id}&placement_status=ACTIVE returns exactly 1 row whose id == ${plc2_id}"
            - "Account.${acct_id}.program_posture is still ACTIVE - the ONBOARDING -> ACTIVE hop fires on the FIRST placement only and is not repeated"

      - name: corner_account_closes_when_the_last_placement_is_retrieved
        claim_type: bubble_up
        grounds:
          - state_machines.Account.transitions
          - state_machines.Site.transitions
          - endpoints[POST /ocs/equipment-placements/{placement_id}/retrieve]
        distinguishing_aspect: "CANCELLATION_PENDING -> CLOSED is a bubble-up: retrieving the LAST non-terminal placement closes the account, which in turn closes its SUSPENDED site - retrieval of a non-last placement would not."
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; one COFFEE product; model URN-30; two PLACEMENT assets"
            - "one account with TWO planned sites, each holding one ACTIVE RENTAL placement; both retrieval_due_by land at 2026-09-30 so nothing is unreturned-billed"
