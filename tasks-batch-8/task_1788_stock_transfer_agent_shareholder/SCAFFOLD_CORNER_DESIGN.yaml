            - call: "POST /inquiries"
              payload: { account_id: "${acct}", channel: "EMAIL", subject: "q1" }
              as: Shareholder
              as_user_id: "${acct}"
            - call: "POST /inquiries"
              payload: { account_id: "${acct}", channel: "PHONE", subject: "q2" }
              as: Shareholder
              as_user_id: "${acct}"
            - call: "POST /inquiries"
              payload: { account_id: "${acct}", channel: "MAIL", subject: "q3" }
              as: Shareholder
              as_user_id: "${acct}"
          trigger:
            - call: "GET /inquiries?account_id=${acct}&limit=2&offset=0"
              as: ServiceAgent
            - call: "GET /inquiries?account_id=${acct}&limit=2&offset=2"
              as: ServiceAgent
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset=2): data length == 1, total_count == 3, has_more == false"
            - "the two pages are disjoint and together cover all 3 inquiries"

  - section: errors
    instances:
      - name: error_envelope_shape_on_not_found
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_TRANSFER_NOT_FOUND]"]
        distinguishing_aspect: "The error body follows the fixed envelope: response_type == error, data.error_id / data.message present, and meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /transfer-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve"
              payload: {}
              as: TransferSupervisor
              as_user_id: "sup_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRANSFER_NOT_FOUND with HTTP 404"
            - "response body has meta.api_request_id and meta.api_request_timestamp set"
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: medallion_coverage_exact_value_boundary
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEDALLION_COVERAGE_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: medallion_coverage_boundary_inclusive
          rationale: "The == and == - 1 arms of the medallion coverage boundary are both asserted by the named §1.8 instance."

      - name: dormancy_exact_anniversary_boundary
        claim_type: violation_to_error
        grounds: [calculations.dormancy_determination]
        excluded_because:
          difficulty_instance: dormancy_boundary_inclusive_year
          rationale: "The inclusive 3-year anniversary boundary (dormant vs one-day-short active) is asserted by the named §1.8 instance."

      - name: bond_open_fixed_price_divergence
        claim_type: variant_divergence
        grounds: [calculations.indemnity_bond_premium]
        excluded_because:
          difficulty_instance: bond_open_vs_fixed_penalty_divergence
          rationale: "Both bond variants and their literal divergence are asserted by the named §1.8 instance."

      - name: provisional_final_withholding_divergence
        claim_type: variant_divergence
        grounds: [calculations.dividend_withholding]
        excluded_because:
          difficulty_instance: withholding_provisional_vs_final_tin_cure
          rationale: "Provisional vs final withholding divergence on a W-9 cure is asserted by the named §1.8 instance."

      - name: settle_cascade_issuer_total_recompute
        claim_type: side_effect_execution
        grounds: ["state_machines.TransferRequest.APPROVED_to_SETTLED"]
        excluded_because:
          difficulty_instance: settle_cascade_cert_position_issuer
          rationale: "The three-hop settle cascade (certificate, positions, issuer totals) is asserted by the named §1.8 instance."

      - name: stale_dating_auto_case_creation
        claim_type: side_effect_execution
        grounds: ["state_machines.DividendPayment.DISBURSED_to_STALE_DATED"]
        excluded_because:
          difficulty_instance: stale_dating_cascade_payment_account_case
          rationale: "The stale-dating cascade into escheatment case creation is asserted by the named §1.8 instance."

      - name: transfer_deficient_cure_loop
        claim_type: valid_transition
        grounds: ["state_machines.TransferRequest.DEFICIENT_to_UNDER_REVIEW"]
        excluded_because:
          difficulty_instance: transfer_deficiency_cycle_loops
          rationale: "The deficiency cure cycle, traversed twice, is asserted by the named §1.8 instance."

      - name: freeze_window_boundary_touch_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_FREEZE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: freeze_window_closed_interval_overlap
          rationale: "Closed-interval boundary-touch overlap and the disjoint-accept arm are asserted by the named §1.8 instance."

      - name: second_report_lost_stop_occupancy
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_OPEN_CLAIM]"]
        excluded_because:
