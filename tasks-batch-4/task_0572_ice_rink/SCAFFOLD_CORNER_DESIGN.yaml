  # =================================================================
  - section: endpoints
    instances:
      - name: admissions_reverse_reachable_by_slot
        claim_type: Computed read
        grounds: [endpoints, entities.PublicSkateAdmission.fields.ice_slot_id]
        distinguishing_aspect: "GET /admissions?ice_slot_id=<slot> returns the array of admissions for that slot (reverse-reachability of the ice_slot_id FK)."
        test_recipe:
          setup: ["One rink (fee 0); a published PUBLIC_SKATE slot with two admissions."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 5, public_skate_fee_cents: 0, rental_skate_count: 2, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /skaters"
              payload: { full_name: "A", email: "aa@x.com" }
              as: RinkManager
              captures: { s1: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "B", email: "bb@x.com" }
              as: RinkManager
              captures: { s2: $.data.id }
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s1}" }
              as: FrontDesk
            - call: "POST /ice-slots/${slot_id}/admissions"
              payload: { skater_id: "${s2}" }
              as: FrontDesk
          trigger:
            - call: "GET /admissions?ice_slot_id=${slot_id}"
              payload: {}
              as: RinkManager
          assert:
            - "response data array length == 2"
            - "every item.ice_slot_id == ${slot_id}"

      - name: ice_slots_list_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /ice-slots?limit=1 over two slots returns one item with total_count == 2 and has_more == true."
        test_recipe:
          setup: ["One rink; two DRAFT ice slots."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T12:00:00Z", end_utc: "2026-06-10T13:00:00Z" }
              as: RinkManager
          trigger:
            - call: "GET /ice-slots?rink_id=${rink_id}&limit=1&offset=0"
              payload: {}
              as: RinkManager
          assert:
            - "response data array length == 1"
            - "meta/pagination total_count == 2 and has_more == true"

  # =================================================================
  - section: rbac
    instances:
      - name: skater_cannot_publish_ice_slot
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Skater calling POST /ice-slots/{id}/publish (a RinkManager-exclusive op) is denied ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One rink; a DRAFT PUBLIC_SKATE slot; a skater."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "PUBLIC_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "S", email: "role@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: Skater
              as_user_id: "${sk}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: skater_cannot_release_other_skaters_locker
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Skater releasing a LockerAssignment owned by a different skater (X-User-ID != skater_id) is denied ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One rink (locker_fee 0); skater A holds locker 1; skater B is a different user."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "A", email: "oa@x.com" }
              as: RinkManager
              captures: { sk_a: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "B", email: "ob@x.com" }
              as: RinkManager
              captures: { sk_b: $.data.id }
            - call: "POST /rinks/${rink_id}/locker-assignments"
              payload: { skater_id: "${sk_a}", locker_number: 1, season_start_date: "2026-06-01", season_end_date: "2026-09-01" }
              as: Skater
              as_user_id: "${sk_a}"
              captures: { la: $.data.id }
          trigger:
            - call: "POST /locker-assignments/${la}/release"
              payload: {}
              as: Skater
              as_user_id: "${sk_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "http status == 403"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401); this trigger is issued with headers omitted."
        test_recipe:
          setup: ["One skater exists."]
          setup_api_calls:
            - call: "POST /skaters"
              payload: { full_name: "S", email: "auth@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
          trigger:
            - call: "GET /skaters/${sk}"
              payload: {}
              as: Skater
              captures: { err: $.data.error_id }
          assert:
            - "with auth headers omitted, response error_id == ERR_UNAUTHENTICATED"
            - "http status == 401"

  # =================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_enrollment_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tuition-subscription-create-stale-enrollment]", "errors[ERR_STALE_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "After a first subscription create bumps Enrollment.version to 2, a second create still carrying expected_enrollment_version = the pre-bump value (1) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["One rink; published LEARN_TO_SKATE slot + class; a funded skater with an enrollment (version 1) that already has one ACTIVE subscription (enrollment now version 2)."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "S", email: "occ@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk}" }
              as: RinkManager
              captures: { enr: $.data.id, enr_v: $.data.version }
            - call: "POST /enrollments/${enr}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8 }
              as: RinkManager
              captures: { sub1: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8 }
              as: RinkManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: occ_subscription_create_bumps_enrollment_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tuition-subscription-create-stale-enrollment]", entities.Enrollment.fields.status]
        distinguishing_aspect: "A successful subscription create increments Enrollment.version by 1 (from 1 to 2), giving the OCC check something to observe."
        test_recipe:
          setup: ["One rink; published LEARN_TO_SKATE slot + class; a funded skater with an enrollment at version 1."]
          setup_api_calls:
            - call: "POST /rinks"
              payload: { name: "Main", resurface_buffer_minutes: 15, public_skate_capacity: 2, public_skate_fee_cents: 0, rental_skate_count: 1, locker_count: 3, locker_fee_cents: 0 }
              as: RinkManager
              captures: { rink_id: $.data.id }
            - call: "POST /ice-slots"
              payload: { rink_id: "${rink_id}", purpose: "LEARN_TO_SKATE", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: RinkManager
              captures: { slot_id: $.data.id }
            - call: "POST /ice-slots/${slot_id}/publish"
              payload: {}
              as: RinkManager
            - call: "POST /learn-to-skate-classes"
              payload: { ice_slot_id: "${slot_id}", level_name: "BASIC_1", capacity: 5 }
              as: RinkManager
              captures: { class_id: $.data.id }
            - call: "POST /skaters"
              payload: { full_name: "S", email: "occ2@x.com" }
              as: RinkManager
              captures: { sk: $.data.id }
            - call: "POST /skaters/${sk}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: RinkManager
            - call: "POST /learn-to-skate-classes/${class_id}/enrollments"
              payload: { skater_id: "${sk}" }
              as: RinkManager
              captures: { enr: $.data.id, enr_v: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr}/tuition-subscriptions"
              payload: { expected_enrollment_version: "${enr_v}", monthly_fee_cents: 12000, billing_cycle_start: "2026-06-01", billing_cycle_end: "2026-07-01", total_sessions_in_cycle: 8 }
              as: RinkManager
              captures: { sub: $.data.id }
          assert:
            - "GET /enrollments/${enr} shows version == 2"
            - "TuitionSubscription.${sub}.status == ACTIVE"

