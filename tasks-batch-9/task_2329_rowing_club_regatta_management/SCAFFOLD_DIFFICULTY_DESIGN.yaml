              as: ClubAdmin
              captures: { shell_b_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Hull C", boat_class: "1X", hull_weight_kg: 14.4, home_bay: "BAY-2" }
              as: ClubAdmin
              captures: { shell_c_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_a_id}", reported_by_member_id: "${coach_id}", severity: "MAJOR", narrative: "cracked rib at station 4" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { report_a_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_b_id}", reported_by_member_id: "${coach_id}", severity: "MAJOR", narrative: "split gunwale" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { report_b_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_c_id}", reported_by_member_id: "${coach_id}", severity: "MAJOR", narrative: "bow ball sheared off" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { report_c_id: $.data.id }
            - call: "POST /boathouse/damage-reports/${report_a_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_b_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_c_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_a_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-A", repair_window_start_at: "2026-08-03T08:00:00Z", repair_window_end_at: "2026-08-03T12:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          trigger:
            - call: "POST /boathouse/damage-reports/${report_b_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-A", repair_window_start_at: "2026-08-03T12:00:00Z", repair_window_end_at: "2026-08-03T16:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_c_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-B", repair_window_start_at: "2026-08-03T08:00:00Z", repair_window_end_at: "2026-08-03T12:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${report_b_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-A", repair_window_start_at: "2026-08-03T12:01:00Z", repair_window_end_at: "2026-08-03T16:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_REPAIR_BAY_CONFLICT because the closed windows [08:00,12:00] and [12:00,16:00] share the endpoint 12:00"
            - "after that rejection DamageReport.${report_b_id}.status == TRIAGED with assigned_repair_bay == null, repair_window_start_at == null and repair_window_end_at == null, and Shell.${shell_b_id}.status == DAMAGED"
            - "the second trigger call returns HTTP 200: BAY-B has no reservation, so the identical 08:00-12:00 window is accepted and DamageReport.${report_c_id}.status == REPAIR_SCHEDULED with assigned_repair_bay == BAY-B"
            - "the third trigger call returns HTTP 200: [12:01,16:00] is disjoint from [08:00,12:00], so DamageReport.${report_b_id}.status == REPAIR_SCHEDULED with repair_window_start_at == 2026-08-03T12:01:00Z"
            - "Shell.${shell_b_id}.status == IN_REPAIR and Shell.${shell_c_id}.status == IN_REPAIR after their reports are scheduled, while Shell.${shell_a_id}.status == IN_REPAIR from setup"

  - rule_id: compensating_invariant
    instances:
      - name: rack_units_conserved_across_assignment_release_cycles
        grounds:
          - calculations.trailer_rack_allocation
          - entities.TrailerLoad.rack_units_used
          - entities.TrailerLoad.rack_units_free
          - entities.TrailerLoad.rack_unit_capacity
          - endpoints[POST /boathouse/trailer-loads/{id}/rack-releases]
          - concurrency_rules[TrailerLoad]
        distinguishing_aspect: |
          Conserved quantity #1 is rack capacity: rack_units_used + rack_units_free must equal
          rack_unit_capacity (16 on the default 4x4 rack) after every assignment and every release,
          and a release followed by a re-assignment must hand back the identical contiguous slot
          (tier 1, position 1 for a 2-unit "4+"), proving the compensating release leaves no leaked
          or double-counted units.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one certified coach, one EquipmentManager/driver, four rowers and one certified coxswain"
            - "one 4+ hull and one 1X hull"
            - "one AWAY regatta with entry_deadline_at 2026-08-10T00:00:00Z"
            - "entry Q (4+, 2 rack units) and entry S (1X, 1 rack unit), both SUBMITTED"
            - "one OPEN TrailerLoad on the default 4 tiers x 4 units rack (rack_unit_capacity 16) already holding Q at tier 1 position 1 and S at tier 1 position 3"
