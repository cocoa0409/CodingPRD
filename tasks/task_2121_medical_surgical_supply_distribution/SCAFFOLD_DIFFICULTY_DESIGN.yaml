          - state_machines.ReplenishmentOrder.CLAIMED_to_REBILL_REQUIRED
          - state_machines.ChargebackClaim.SUBMITTED_to_REBILL_REQUIRED
          - calculations.order_total
          - entities.GpoContract.fields.chargeback_payable_cents
        distinguishing_aspect: |
