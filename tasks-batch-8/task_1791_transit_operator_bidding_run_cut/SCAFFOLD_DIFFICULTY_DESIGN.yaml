scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pay_record_provisional_vs_final_divergence
        grounds:
          - calculations.pay_price
          - entities.PayRecord.fields.variant
          - state_machines.DailyAssignment.SCHEDULED_to_WORKED
        distinguishing_aspect: |
          Same DailyAssignment priced twice by the same formula: PROVISIONAL
          uses scheduled_minutes (500 -> gross 25500 cents), FINAL uses
          actual_platform_minutes (460 -> gross 23000 cents). Identical
          assignment, two valid variants, different gross_cents.
        test_recipe:
          setup:
            - "SignUpPeriod S in IMPLEMENTED with daily_ot_threshold_minutes=480, weekly_ot_threshold_minutes=2400, spread_limit=780, paid_break=30"
            - "Operator O (ACTIVE, seniority_rank 1) awarded Run R with one piece {report 300, release 800, platform 470}; spread=500 <600 so paid=470"
            - "DailyAssignment A created from the award with scheduled_minutes=470, PROVISIONAL PayRecord priced"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Fall", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 800, platform_minutes: 470 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/implement"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/daily-assignments"
              payload: { operator_id: "${op_id}", sign_up_period_id: "${sup_id}" }
              as: SchedulingOfficer
              captures: { asg_id: "$.data[0].id" }
          trigger:
            - call: "GET /api/daily-assignments/${asg_id}/pay-records"
              payload: {}
              as: PayrollClerk
              captures: { prov_gross: "$.data[0].gross_cents" }
            - call: "POST /api/daily-assignments/${asg_id}/close-out"
              payload: { actual_platform_minutes: 430 }
              as: PayrollClerk
            - call: "GET /api/daily-assignments/${asg_id}/pay-records"
              payload: {}
              as: PayrollClerk
          assert:
            - "PROVISIONAL PayRecord.gross_cents == 23500 (470*50; 470 < 480 daily threshold, no break credit since spread 500 < 600)"
            - "FINAL PayRecord.gross_cents == 21500 (430*50)"
            - "PROVISIONAL PayRecord.variant == PROVISIONAL and FINAL PayRecord.variant == FINAL"
            - "FINAL PayRecord.gross_cents != PROVISIONAL PayRecord.gross_cents"

      - name: seniority_rank_two_orderings
        grounds:
          - calculations.seniority_rank
          - entities.Operator.fields.seniority_rank
        distinguishing_aspect: |
          seniority_rank is a derived ranking over the roster; a later-hired
          operator created first observes rank 1, then drops to rank 2 when an
          earlier-hired operator is registered — the same roster yields
          different rank values depending on composition (recompute variant),
          a different entity domain (Operator roster) from pay pricing.
        test_recipe:
          setup:
            - "Operator A created first with hire_date 2010-05-01"
            - "Operator B created second with hire_date 2005-03-01 (earlier hire)"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { employee_number: "E100", full_name: "Later Hire", hire_date: "2010-05-01", vacation_hours_balance: 100 }
              as: SchedulingOfficer
              captures: { op_a_id: $.data.id, op_a_rank_initial: $.data.seniority_rank }
            - call: "POST /api/operators"
              payload: { employee_number: "E200", full_name: "Earlier Hire", hire_date: "2005-03-01", vacation_hours_balance: 100 }
              as: SchedulingOfficer
              captures: { op_b_id: $.data.id, op_b_rank: $.data.seniority_rank }
            - call: "GET /api/operators/${op_a_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { op_a_rank_after: $.data.seniority_rank }
          trigger:
            - call: "GET /api/operators/${op_a_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "Operator.${op_a_id}.seniority_rank == 2 after B's creation (was 1 initially)"
            - "Operator.${op_b_id}.seniority_rank == 1 (earlier hire_date wins)"

  # =========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes (a) and (b)/(c))
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pay_price_three_input_tiered_split
        grounds:
          - calculations.pay_price
        distinguishing_aspect: |
          Mode (a): >=3 inputs (basis minutes, daily_ot_threshold_minutes,
          weekly_ot_threshold_minutes, weekly prior straight) interact
          non-linearly through nested max() tiers — weekly OT extra only
          appears when straight_after_daily exceeds weekly_remaining.
        test_recipe:
          setup:
            - "SignUpPeriod S IMPLEMENTED with daily threshold 480, weekly threshold 2400"
            - "Operator O with one FINAL PayRecord earlier in the same ISO week contributing 2300 straight minutes"
            - "second DailyAssignment A2 on a later date in the same week, scheduled 500, closed out with actual_platform_minutes 500"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "W", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 760, platform_minutes: 460 } ] }
              as: SchedulingOfficer
              captures: { run1_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R2", service_date: "2026-09-08", pieces: [ { report_minutes: 300, release_minutes: 800, platform_minutes: 500 } ] }
              as: SchedulingOfficer
              captures: { run2_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run1_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v2: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run2_id}", preference_rank: 2, expected_sign_up_period_version: "${sup_v2}" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/implement"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/daily-assignments"
              payload: { operator_id: "${op_id}", sign_up_period_id: "${sup_id}", service_date: "2026-09-07" }
              as: SchedulingOfficer
              captures: { asg1_id: "$.data[0].id" }
            - call: "POST /api/daily-assignments/${asg1_id}/close-out"
              payload: { actual_platform_minutes: 2300 }
              as: PayrollClerk
            - call: "GET /api/daily-assignments"
              payload: { operator_id: "${op_id}", sign_up_period_id: "${sup_id}", service_date: "2026-09-08" }
              as: SchedulingOfficer
              captures: { asg2_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/daily-assignments/${asg2_id}/close-out"
              payload: { actual_platform_minutes: 500 }
              as: PayrollClerk
            - call: "GET /api/daily-assignments/${asg2_id}/pay-records"
              payload: {}
              as: PayrollClerk
          assert:
            - "FINAL PayRecord on ${asg2_id}: straight_minutes == 100 (2400-2300 weekly remaining), overtime_minutes == 420 (20 daily + 400 weekly)"
            - "FINAL PayRecord.gross_cents == round_half_up(100*50 + 420*75) == 36500"

      - name: extra_board_size_ceil_ordering
        grounds:
          - calculations.extra_board_size
          - entities.ExtraBoardSlot.fields.slot_index
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — ceil(posted * ratio
          / 100) MUST be computed as ceil of the exact rational product, not
          floor-then-round or round of posted*(ratio/100) after pre-dividing;
          7 posted runs at 20% => ceil(1.4) = 2 slots, not 1.
        test_recipe:
          setup:
            - "SignUpPeriod S with extra_board_ratio_pct=20 and exactly 7 POSTED runs"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "B", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R2", service_date: "2026-09-08", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R3", service_date: "2026-09-09", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R4", service_date: "2026-09-10", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R5", service_date: "2026-09-11", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R6", service_date: "2026-09-12", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R7", service_date: "2026-09-13", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}/extra-board-slots"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "ExtraBoardSlot count == 2 (ceil(7*20/100) == ceil(1.4) == 2, not floor==1)"
            - "slot_index values are exactly [1, 2] with status OPEN"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: signup_period_picking_to_runs_cut_cycle
        grounds:
          - state_machines.SignUpPeriod.PICKING_to_RUNS_CUT
          - state_machines.SignUpPeriod
        distinguishing_aspect: |
          SignUpPeriod exhibits a cycle: PICKING -> RUNS_CUT -> OPEN ->
          PICKING driven by mid-pick schedule revision; picked_through_rank
          resets to 0 while prior AWARDED bids survive — non-linear (cyclic)
          shape on SignUpPeriod.
        test_recipe:
          setup:
            - "SignUpPeriod S in PICKING with operator O1 awarded run R1; run R2 still POSTED"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Cyc", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op1_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run1_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R2", service_date: "2026-09-08", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run2_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op1_id}", run_id: "${run1_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op1_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/schedule-revisions"
              payload: { new_runs: [ { run_number: "R3", service_date: "2026-09-09", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] } ] }
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "SignUpPeriod.${sup_id}.status == RUNS_CUT (cycle back from PICKING)"
            - "SignUpPeriod.${sup_id}.schedule_revision == 2"
            - "SignUpPeriod.${sup_id}.picked_through_rank == 0 (reset)"
            - "Run.${run1_id}.status == AWARDED (survives revision)"
            - "Run.${run2_id}.status == WITHDRAWN (stale POSTED run)"

      - name: daily_assignment_parallel_pay_dimension
        grounds:
          - state_machines.DailyAssignment
          - entities.DailyAssignment.fields.pay_status
        distinguishing_aspect: |
          DailyAssignment carries two independent state dimensions:
          status (SCHEDULED->WORKED) and pay_status
          (PROVISIONAL->DISPUTED->FINALIZED) evolve independently — parallel
          dimensions on one entity, a different entity and shape from the
          SignUpPeriod cycle.
        test_recipe:
          setup:
            - "DailyAssignment A in status WORKED with pay_status PROVISIONAL"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Par", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/implement"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/daily-assignments"
              payload: { operator_id: "${op_id}", sign_up_period_id: "${sup_id}" }
              as: SchedulingOfficer
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /api/daily-assignments/${asg_id}/close-out"
              payload: { actual_platform_minutes: 400 }
              as: PayrollClerk
          trigger:
            - call: "POST /api/daily-assignments/${asg_id}/dispute-pay"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /api/daily-assignments/${asg_id}/finalize-pay"
              payload: {}
              as: PayrollClerk
            - call: "GET /api/daily-assignments/${asg_id}"
              payload: {}
              as: PayrollClerk
          assert:
            - "DailyAssignment.${asg_id}.status == WORKED (unchanged by pay-dimension transitions)"
            - "DailyAssignment.${asg_id}.pay_status == FINALIZED after dispute-then-finalize loop"

  # =========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: absence_cover_three_hop_cascade
        grounds:
          - state_machines.AbsenceCase.REPORTED_to_COVERED
          - state_machines.DailyAssignment.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          Depth-3 chain: cover(AbsenceCase) -> creates covering
          DailyAssignment (hop 1: new entity) -> absent operator's original
          DailyAssignment transitions SCHEDULED->NO_SHOW (hop 2) -> covering
          EXTRA_BOARD operator's ExtraBoardSlot transitions FILLED->EXHAUSTED
          (hop 3, caused by hop 2's fill, not by the original request).
        test_recipe:
          setup:
            - "SignUpPeriod IMPLEMENTED; operator A (ACTIVE) has SCHEDULED assignment on run R date D"
            - "operator B is EXTRA_BOARD with board_position 1 holding FILLED slot"
            - "AbsenceCase AC REPORTED for A on date D"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Cov", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 50 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EA", full_name: "Op A", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { opa_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EB", full_name: "Op B", hire_date: "2005-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { opb_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${opa_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${opa_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/implement"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/absence-cases"
              payload: { operator_id: "${opa_id}", absence_date: "2026-09-07", reason_code: "SICK" }
              as: SchedulingOfficer
              captures: { ac_id: $.data.id, ac_v: $.data.version }
          trigger:
            - call: "POST /api/absence-cases/${ac_id}/cover"
              payload: { allow_overtime: false, expected_absence_case_version: "${ac_v}" }
              as: SchedulingOfficer
            - call: "GET /api/absence-cases/${ac_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "AbsenceCase.${ac_id}.status == COVERED"
            - "AbsenceCase.${ac_id}.covering_assignment_id is non-null"
            - "original DailyAssignment of ${opa_id} on 2026-09-07 has status NO_SHOW"
            - "covering DailyAssignment for an EXTRA_BOARD operator created with source == EXTRA_BOARD_FILL"

      - name: schedule_revision_two_hop_bid_cascade
        grounds:
          - state_machines.SignUpPeriod.PICKING_to_RUNS_CUT
          - state_machines.Run.POSTED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: schedule-revisions on
          SignUpPeriod -> stale POSTED Runs WITHDRAWN (hop 1) -> SUBMITTED
          BidEntries referencing those runs WITHDRAWN (hop 2, caused by the
          run withdrawal, not by the request directly).
        test_recipe:
          setup:
            - "SignUpPeriod PICKING; operator O has SUBMITTED bid on POSTED run R2; no awards yet"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Rev", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R2", service_date: "2026-09-08", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run2_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run2_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/schedule-revisions"
              payload: { new_runs: [ { run_number: "R9", service_date: "2026-09-09", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] } ] }
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}" }
              as: SchedulingOfficer
          assert:
            - "Run.${run2_id}.status == WITHDRAWN"
            - "BidEntry.${bid_id}.status == WITHDRAWN (cascaded from run withdrawal)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_bid_on_locked_period
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DUPLICATE_PREFERENCE]
        distinguishing_aspect: |
          Pair (state, business_constraint): a bid submitted to a LOCKED
          sign-up that ALSO duplicates an existing preference_rank MUST fail
          with ERR_INVALID_STATE (priority 5), not ERR_DUPLICATE_PREFERENCE
          (priority 8).
        test_recipe:
          setup:
            - "SignUpPeriod LOCKED; operator O already holds SUBMITTED->AWARDED bid at preference_rank 1"
            - "O attempts a second bid with preference_rank 1 (duplicate) while period is LOCKED"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "P1", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R1", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /api/sign-up-periods/${sup_id}/adjudicate-next"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/lock"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v_locked: $.data.version }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v_locked}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state check priority 5 beats business_constraint priority 8)"
            - "no new BidEntry created"

      - name: referential_vs_fiscal_vacation_grant
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - errors[ERR_INSUFFICIENT_VACATION_BALANCE]
          - errors[ERR_VACATION_SLOT_FULL]
        distinguishing_aspect: |
          Pair (business_referential, business_fiscal): a grant where the
          operator has insufficient balance AND the slot is full MUST fail
          with ERR_INSUFFICIENT_VACATION_BALANCE (priority 12), not
          ERR_VACATION_SLOT_FULL (priority 13).
        test_recipe:
          setup:
            - "VacationSlot V capacity 1 already FULLY_ALLOCATED by operator X"
            - "operator Y has vacation_hours_balance 0"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "V", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EX", full_name: "Op X", hire_date: "2000-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { opx_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EY", full_name: "Op Y", hire_date: "2001-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { opy_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/vacation-slots"
              payload: { week_start_date: "2026-10-05", capacity: 1 }
              as: SchedulingOfficer
              captures: { slot_id: $.data.id }
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${opx_id}" }
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${opy_id}" }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_VACATION_BALANCE (referential priority 12 beats fiscal priority 13)"
            - "VacationSlot.${slot_id}.allocated_count == 1 (unchanged)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # =========================================================================
