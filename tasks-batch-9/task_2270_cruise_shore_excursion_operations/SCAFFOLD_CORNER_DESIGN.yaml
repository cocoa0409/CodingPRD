      - name: the_departure_version_advances_by_one_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.ExcursionDeparture.fields.precruise_sold_seats
          - endpoints[POST /shore-excursions/departures/{departureId}/reschedule-meeting]
          - endpoints[POST /shore-excursions/departures/{departureId}/allocation]
          - endpoints[POST /shore-excursions/bookings]
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The counter starts at 1 on creation and advances by exactly one per mutation -
          reschedule, rebalance and a booking that only touches the departure through its seat
          counters - so the OCC token is monotone and gap-free.
        test_recipe:
          setup:
            - "Cozumel world with one SELLING departure created at version 1, meeting 09:00, capacity 40 split 25/15."
            - "The version was read immediately after creation and before any mutation."
