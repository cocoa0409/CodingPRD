# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Wine, Brewery & Food Tour Operator — Expert tier
# Breadth probe over §1.1-§1.7; excludes corners already covered by §1.8.
# Logical-clock startup default: 2026-03-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_tour_product_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.TourProduct
          - endpoints
        distinguishing_aspect: "POST /tour-products with required fields returns 201, status DRAFT, server-minted id/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tour-products"
              payload: { name: "Cellar Crawl", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "TourProduct.${p_id}.status == DRAFT"
            - "TourProduct.${p_id}.version == 1"

      - name: get_partner_venue_returns_stored_data
        claim_type: Retrieval
        grounds:
          - entities.PartnerVenue
          - endpoints
        distinguishing_aspect: "GET /partner-venues/{id} returns the stored venue with commission_pct and tasting cost intact."
        test_recipe:
          setup: ["one partner venue exists"]
          setup_api_calls:
            - call: "POST /partner-venues"
              payload: { name: "Oak Ridge", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /partner-venues/${v_id}"
              payload: {}
              as: Operator
              captures: { cp: $.data.commission_pct, tc: $.data.tasting_cost_per_guest_cents }
          assert:
            - "PartnerVenue.${v_id}.commission_pct == 0.10"
            - "PartnerVenue.${v_id}.tasting_cost_per_guest_cents == 1200"

      - name: list_departures_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Departure
          - endpoints
          - response_envelope
        distinguishing_aspect: "GET /departures returns a paginated array with limit/offset/total_count/has_more in the envelope."
        test_recipe:
          setup: ["one product, one van, one SCHEDULED departure"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
          trigger:
            - call: "GET /departures"
              payload: { limit: 10, offset: 0 }
              as: Operator
          assert:
            - "response_type == array"
            - "meta.total_count == 1 AND meta.has_more == false"

      - name: get_departure_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Departure
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /departures/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /departures/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response status == 404"

      - name: create_tour_product_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.TourProduct
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /tour-products without base_price_per_person_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response status == 400"

      - name: tour_product_gratuity_pct_default_applied
        claim_type: Defaults
        grounds:
          - entities.TourProduct.fields.gratuity_pct
        distinguishing_aspect: "Omitting gratuity_pct on create applies the default 0.18."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id, gp: $.data.gratuity_pct }
          assert:
            - "TourProduct.${p_id}.gratuity_pct == 0.18"

      - name: booking_total_is_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Booking.fields.total_cents
          - calculations.booking_price_quote
        distinguishing_aspect: "total_cents is server-computed from the quote; any client-supplied total in the body is ignored (not in input schema)."
        excluded_because:
          difficulty_instance: combinatorial_formula / gratuity_circular_dep_excludes_charter_mode_c
          rationale: "Computed total_cents correctness is asserted as the trigger outcome of the named §1.8 instance (113324)."

      - name: departure_status_system_field_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Departure.fields.status
        distinguishing_aspect: "Departure.status is system-set to SCHEDULED on create regardless of any client value (status is not an input field)."
        test_recipe:
          setup: ["one product, one van"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id, st: $.data.status }
          assert:
            - "Departure.${d_id}.status == SCHEDULED"

      - name: tour_product_invalid_theme_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.TourProduct.fields.theme
          - "validations[priority=6]"
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "POST /tour-products with theme 'SPIRITS' (not in WINE|BREWERY|FOOD|MIXED) returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "SPIRITS", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"
            - "response status == 422"

      - name: departure_return_before_depart_out_of_range
        claim_type: Type Constraints
        grounds:
          - entities.Departure.fields.depart_at
          - entities.Departure.fields.return_at
          - "validations[priority=7]"
          - "errors[ERR_VALUE_OUT_OF_RANGE]"
        distinguishing_aspect: "POST /departures with return_at <= depart_at returns ERR_VALUE_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["one product, one van"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T23:00:00Z", return_at: "2026-04-10T18:00:00Z" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALUE_OUT_OF_RANGE"
            - "response status == 422"

      - name: booking_fk_departure_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Booking.fields.departure_id
          - "validations[priority=4]"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "POST /bookings with a non-existent departure_id returns ERR_FK_NOT_FOUND (422)."
        test_recipe:
          setup: ["a guest and a pickup point exist; no departure with the supplied id"]
          setup_api_calls:
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { departure_id: "00000000-0000-0000-0000-000000000000", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FK_NOT_FOUND"
            - "response status == 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_already_published_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TourProduct.DRAFT_to_PUBLISHED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Publishing a product already PUBLISHED returns ERR_INVALID_STATE (409); no version bump beyond the first publish."
        test_recipe:
          setup: ["a PUBLISHED product"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: depart_before_depart_at_too_early
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Departure.CONFIRMED_to_DEPARTED
          - "validations[priority=13]"
          - "errors[ERR_TOO_EARLY_TO_DEPART]"
        distinguishing_aspect: "Depart on a CONFIRMED departure while clock < depart_at returns ERR_TOO_EARLY_TO_DEPART (409)."
        test_recipe:
          setup: ["CONFIRMED departure (one confirmed stop, one RESERVED booking party 4); clock at 2026-04-10T17:00:00Z (1h before depart)"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${d_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 4 }
              as: Operator
              captures: { vc_id: $.data.id }
            - call: "POST /venue-confirmations/${vc_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${d_v0}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /departures/${d_id}/confirm"
              payload: {}
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T17:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /departures/${d_id}/depart"
              payload: {}
              as: Guide
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TOO_EARLY_TO_DEPART"
            - "response status == 409"

      - name: confirm_departure_without_confirmed_stop_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Departure.SCHEDULED_to_CONFIRMED
          - "validations[priority=14]"
          - "errors[ERR_VENUE_NOT_CONFIRMED]"
        distinguishing_aspect: "Confirming a departure whose stop's VenueConfirmation is still REQUESTED returns ERR_VENUE_NOT_CONFIRMED (409)."
        test_recipe:
          setup: ["SCHEDULED departure, one stop with a REQUESTED (not confirmed) VenueConfirmation, one RESERVED booking party 4"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${d_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 4 }
              as: Operator
              captures: { vc_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${d_v0}" }
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /departures/${d_id}/confirm"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VENUE_NOT_CONFIRMED"
            - "response status == 409"

      - name: new_booking_starts_in_draft_unpaid
        claim_type: Initial State
        grounds:
          - state_machines.Booking
          - entities.Booking.fields.status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: "A newly created Booking starts status DRAFT and payment_status UNPAID."
        test_recipe:
          setup: ["SCHEDULED departure, a guest, a pickup point"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id, st: $.data.status, pay: $.data.payment_status }
          assert:
            - "Booking.${b_id}.status == DRAFT"
            - "Booking.${b_id}.payment_status == UNPAID"

      - name: cancel_completed_booking_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Booking
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) booking returns ERR_INVALID_STATE (409); no refund or seat change fires."
        test_recipe:
          setup: ["A booking that reached COMPLETED via the full departure lifecycle"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
              payload: { name: "Oak", kind: "WINERY", commission_pct: 0.10, tasting_cost_per_guest_cents: 1200 }
              as: Operator
              captures: { venue_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /stops"
              payload: { departure_id: "${d_id}", partner_venue_id: "${venue_id}", sequence: 1, dwell_minutes: 60 }
              as: Operator
              captures: { stop_id: $.data.id }
            - call: "POST /venue-confirmations"
              payload: { stop_id: "${stop_id}", requested_headcount: 4 }
              as: Operator
              captures: { vc_id: $.data.id }
            - call: "POST /venue-confirmations/${vc_id}/confirm"
              payload: {}
              as: PartnerVenue
              as_user_id: "${venue_id}"
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /_verify/age"
              payload: { guest_id: "${g_id}" }
              as: Operator
            - call: "POST /guests/${g_id}/sign-waiver"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${d_v0}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /bookings/${b_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /departures/${d_id}/confirm"
              payload: {}
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T18:00:00Z" }
              as: Operator
            - call: "POST /departures/${d_id}/depart"
              payload: {}
              as: Guide
            - call: "POST /bookings/${b_id}/check-in"
              payload: {}
              as: Guide
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T23:00:00Z" }
              as: Operator
            - call: "POST /departures/${d_id}/complete"
              payload: {}
              as: Guide
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: venue_confirmation_declined_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.VenueConfirmation
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Confirming a VenueConfirmation already DECLINED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A VenueConfirmation in DECLINED"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "BREWERY", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /partner-venues"
