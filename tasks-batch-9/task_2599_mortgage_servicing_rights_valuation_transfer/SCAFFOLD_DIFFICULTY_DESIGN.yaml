    instances:

      - name: rate_curve_publication_cascades_four_levels_to_lapsed_bid
        grounds:
          - state_machines.RateCurveSnapshot.transitions[ACTIVE -> SUPERSEDED]
          - state_machines.ValuationRun.transitions[COMPLETED -> STALE]
          - state_machines.BidPackage.transitions[PUBLISHED -> BIDDING_SUSPENDED]
          - state_machines.Bid.transitions[SUBMITTED -> LAPSED]
          - entities.BidPackage.fields.suspended_reason
          - entities.ServicingPortfolio.fields.valuation_freshness
          - endpoints[POST /msr/rate-curves]
        distinguishing_aspect: |
          Cascade A: a DOWNWARD-fanning chain of depth four originating on a row nobody in the
          marketing workflow touches. One POST to /msr/rate-curves rewrites four other entity types
          — RateCurveSnapshot -> ValuationRun -> BidPackage -> Bid — and additionally repaints the
          ServicingPortfolio's derived valuation_freshness. It is transitive in the strict sense:
          the Bid lapses because its package suspended, the package suspended because its run went
          stale, and the run went stale because the curve it referenced was superseded.
        test_recipe:
          setup:
            - "Fixture T is TAPE_LOCKED, valued against RateCurveSnapshot C1 (as_of_date 2026-07-31, 4000 bps), stratified, published, and holds one SUBMITTED bid at 118 bps."
            - "Before the trigger: C1 ACTIVE, run COMPLETED, package PUBLISHED, bid SUBMITTED, portfolio valuation_freshness CURRENT."
