      - name: statement_supersede_chain_conserves_active_provisional_count
        grounds:
          - state_machines.IncentiveStatement.PROVISIONAL_to_SUPERSEDED
          - endpoints.POST_/survey/statements
          - entities.IncentiveStatement.fields.supersedes_id
        distinguishing_aspect: |
          Conserved quantity: count of PROVISIONAL statements per (dealer_id,
          wave_id). Forward action: create statement ST1 (PROVISIONAL count=1).
          Compensating action: create statement ST2 for the same (dealer, wave)
          — ST1 transitions to SUPERSEDED, ST2 is PROVISIONAL (count stays 1).
          The supersedes_id chain links ST2 -> ST1. Different conserved
          quantity from the wave invitation partition (count of active
          provisional statements vs wave invitation status partition).
