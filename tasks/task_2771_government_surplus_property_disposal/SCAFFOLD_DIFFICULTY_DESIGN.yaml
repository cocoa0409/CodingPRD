# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2771 — Government Surplus Property Disposal
# 9 rule_ids / 24 instances. Every literal in `assert:` was computed against the
# formulas and constants declared in SCAFFOLD.yaml §1.3 using exact decimal
# arithmetic with ROUND_HALF_UP.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dv_asset_value_transfer_basis_vs_auction_reserve
        grounds:
          - calculations.asset_fair_market_value
          - calculations.transfer_order_price
          - entities.SurplusAsset.fields.fair_market_value_cents
          - entities.AuctionLot.fields.reserve_price_cents
          - entities.TransferOrder.fields.transfer_price_cents
          - state_machines.SurplusAsset.SCREENING_to_AWARDED_TRANSFER
          - state_machines.SurplusAsset.AUCTION_ELIGIBLE_to_LISTED
        distinguishing_aspect: |
          Two structurally identical assets carrying the identical computed fair_market_value_cents of
          297620 yield 161310 through the transfer_basis variant and 178572 through the auction_reserve
          variant, because the transfer variant applies a recipient-tier discount plus a handling fee
          while the reserve variant applies a 0.60 floor-guarded percentage — the divergence is on the
          SurplusAsset valuation domain.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one STATE_AGENCY organization (DOT-01) and one LOCAL_GOVERNMENT organization (CITY-77, CERTIFIED donee through 2027-03-31)"
            - "one ACCEPTED turn-in carrying two identical 2019 pickups, each assessed C4 / functional / repair 185000 so both hold fair_market_value_cents == 297620"
            - "asset X is AWARDED_TRANSFER to CITY-77 through the LOCAL_GOVERNMENT screening tier; asset Y is AUCTION_ELIGIBLE after the screening ladder is exhausted"
            - "one ACTIVE venue AUS-01 with concurrent_lot_capacity 2, buyer_premium_pct 0.105, sales_tax_pct 0.0635"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: $.data.id }
            - call: "POST /agencies"
              payload: { name: "City of Cedar Park", agency_code: "CITY-77", agency_type: "LOCAL_GOVERNMENT", federal_donee_status: "CERTIFIED", donee_certification_expires_on: "2027-03-31" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_lg: $.data.id }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag_st}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { ti1: $.data.id }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "VEHICLE", description: "2019 Ford F-250 three-quarter ton pickup, unit 1", acquisition_cost_cents: 3217467, acquisition_date: "2019-03-15", vin: "1FT7W2BT9KEB12345", odometer_reading: 184320, title_number: "TX-88231" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { asset_x: $.data.id, asset_x_v: $.data.version }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "VEHICLE", description: "2019 Ford F-250 three-quarter ton pickup, unit 2", acquisition_cost_cents: 3217467, acquisition_date: "2019-03-15", vin: "1FT7W2BT9KEB12346", odometer_reading: 179880, title_number: "TX-88232" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { asset_y: $.data.id, asset_y_v: $.data.version }
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag_st}"
            - call: "POST /assets/${asset_x}/condition-assessments"
              payload: { condition_code: "C4", functional: true, repair_cost_estimate_cents: 185000, assessed_on: "2026-07-28", expected_asset_version: "${asset_x_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /assets/${asset_y}/condition-assessments"
              payload: { condition_code: "C4", functional: true, repair_cost_estimate_cents: 185000, assessed_on: "2026-07-28", expected_asset_version: "${asset_y_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti1}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${asset_x}", opens_at: "2026-08-01T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc_x: $.data.id }
            - call: "POST /screening-cycles/${cyc_x}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-requests"
              payload: { screening_cycle_id: "${cyc_x}", requesting_agency_id: "${ag_lg}", intended_use: "Municipal public works fleet replacement", justification: "Existing unit 4102 failed inspection and the city has no replacement budget this cycle.", needed_by_date: "2026-09-15" }
              as: AgencyOfficer
              as_user_id: "${ag_lg}"
              captures: { req_x: $.data.id }
            - call: "POST /screening-cycles/${cyc_x}/award"
              payload: { screening_request_id: "${req_x}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${asset_y}", opens_at: "2026-08-01T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc_y: $.data.id }
            - call: "POST /screening-cycles/${cyc_y}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc_y}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc_y}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles/${cyc_y}/advance-tier"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /venues"
              payload: { name: "Austin Surplus Yard", venue_code: "AUS-01", concurrent_lot_capacity: 2, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /transfer-orders"
              payload: { asset_id: "${asset_x}", recipient_agency_id: "${ag_lg}", screening_request_id: "${req_x}" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { to_x: $.data.id }
            - call: "POST /auction-lots"
              payload: { asset_id: "${asset_y}", venue_id: "${v1}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-05T00:00:00Z" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { lot_y: $.data.id }
          assert:
            - "SurplusAsset.${asset_x}.fair_market_value_cents == 297620"
            - "SurplusAsset.${asset_y}.fair_market_value_cents == 297620"
            - "TransferOrder.${to_x}.base_transfer_cents == 148810"
            - "TransferOrder.${to_x}.handling_fee_cents == 12500"
            - "TransferOrder.${to_x}.transfer_price_cents == 161310"
            - "AuctionLot.${lot_y}.reserve_price_cents == 178572"
            - "AuctionLot.${lot_y}.reserve_source == COMPUTED"
            - "TransferOrder.${to_x}.transfer_price_cents != AuctionLot.${lot_y}.reserve_price_cents — 161310 vs 178572 from one identical fair_market_value_cents"
            - "AuctionLot.${lot_y}.required_deposit_cents == 0 because 178572 < 500000"

      - name: dv_proceeds_accrual_vs_cash_basis_on_defaulted_invoice
        grounds:
          - calculations.proceeds_distribution_net
          - entities.ProceedsDistribution.fields.distributable_base_cents
          - entities.ProceedsDistribution.fields.net_to_agency_cents
          - entities.SaleInvoice.fields.amount_paid_cents
          - state_machines.SaleInvoice.PARTIALLY_PAID_to_DEFAULTED
          - state_machines.ProceedsDistribution.CALCULATED_to_SUPERSEDED
          - validations[priority=88]
        distinguishing_aspect: |
          On one settled lot the ACCRUAL variant bases the waterfall on AuctionLot.high_bid_cents 640000
          and returns net_to_agency_cents 557750, while the CASH variant bases it on the defaulted
          invoice's amount_paid_cents 200000 and returns 167500 — the divergence is on the
          ProceedsDistribution money-distribution domain, a different entity domain from the
          SurplusAsset valuation divergence in dv_asset_value_transfer_basis_vs_auction_reserve.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-09-01 -> 2026-09-05 -> 2026-09-13"
            - "one STATE_AGENCY organization DOT-01 owning an ACCEPTED turn-in with one data-bearing rack server assessed C2 / functional / repair 0, so fair_market_value_cents == 985946"
            - "one verified DATA_SANITIZATION certificate on that asset (cost recovery 7500), filed by tech-01 who never appraised it"
            - "asset AUCTION_ELIGIBLE after four tier advances, listed at AUS-01 with computed reserve 591568 and required_deposit_cents 59157"
            - "bidder Lone Star Equipment REGISTERED with a 59157 cash deposit, hammer bid 640000 accepted, lot CLOSED_MET, invoice total_due_cents 752107"
