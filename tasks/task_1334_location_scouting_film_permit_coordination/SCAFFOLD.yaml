# =============================================================================
# Task 1334: Location Scouting & Film Permit Coordination
# Seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Location Scouting & Film Permit Coordination (location manager & film office):
  location search & photo scout package, owner agreement & location fee negotiation,
  permit application by jurisdiction & lead time, neighborhood notification &
  parking/street closure, insurance certificate & indemnity requirements,
  restoration/damage deposit & walkthrough, monitor/officer staffing requirement,
  shoot-day compliance & complaint response

domain_name: location-film-permits
api_prefix: /

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Production working title" }
      - { name: production_company, type: string, source: input, description: "Legal entity name of the production company" }
      - { name: cast_size, type: integer, source: input, description: "Total cast + crew headcount on the largest shoot day; drives monitor staffing and permit fee tier" }
      - { name: umbrella_liability_limit_cents, type: integer, source: input, description: "Umbrella liability coverage the production carries; insurance certificates must meet jurisdiction minimums against this" }
      - { name: status, type: enum, source: system, description: "PREP | ACTIVE | WRAPPED | CANCELLED", constraints: "PREP on create; ACTIVE once any ShootDay completes; WRAPPED only when every LocationBooking is RELEASED and every PermitApplication is terminal; CANCELLED from PREP only" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code, e.g. LA-CITY, LA-COUNTY, PASADENA", constraints: "Unique across all Jurisdiction rows" }
      - { name: name, type: string, source: input, description: "Human-readable jurisdiction name" }
      - { name: lead_time_business_days, type: integer, source: input, description: "Minimum business days between permit submission and the earliest shoot day" }
      - { name: notification_lead_calendar_days, type: integer, source: input, description: "Minimum calendar days before the earliest shoot day by which neighborhood notifications must be POSTED" }
      - { name: notification_radius_ft, type: integer, source: input, description: "Required radius around the location for neighborhood notification" }
      - { name: base_fee_cents, type: integer, source: input, description: "Flat permit application fee component" }
      - { name: per_day_fee_cents, type: integer, source: input, description: "Fee component per shoot day" }
      - { name: per_lane_fee_cents, type: integer, source: input, description: "Fee component per closed lane per shoot day" }
      - { name: large_cast_threshold, type: integer, source: input, description: "cast_size strictly greater than this triggers the LARGE_CAST fee multiplier and an extra monitor" }
      - { name: large_cast_multiplier_bps, type: integer, source: input, description: "Fee multiplier in basis points applied when cast_size > large_cast_threshold (e.g. 12500 = 1.25x)" }
      - { name: min_liability_limit_cents, type: integer, source: input, description: "Minimum umbrella liability limit an InsuranceCertificate must show to be VERIFIED for this jurisdiction" }
      - { name: police_monitor_lane_threshold, type: integer, source: input, description: "closed_lanes >= this requires at least one POLICE monitor assignment" }
      - { name: holidays, type: array, source: input, description: "Array of ISO dates (YYYY-MM-DD) that are jurisdiction holidays; excluded from business-day counting", default: [] }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "SUSPENDED jurisdictions reject new permit applications and new bookings" }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Location nickname" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; governing jurisdiction for permits and notifications" }
      - { name: owner_id, type: string, source: input, description: "FK -> LocationOwner.id; legal owner who must sign the OwnerAgreement" }
      - { name: deposit_floor_cents, type: integer, source: input, description: "Minimum restoration/damage deposit the owner will accept" }
      - { name: buffer_days, type: integer, source: input, description: "Owner-mandated rest days that must separate two bookings at this location; a new booking's [start-buffer, end+buffer] closed interval must not touch any existing CONFIRMED booking's closed [start,end] interval" }
      - { name: max_shoot_hours_per_day, type: integer, source: input, description: "Owner-imposed cap on shoot hours per day" }
      - { name: status, type: enum, source: system, description: "SCOUTING | AGREEMENT_EXECUTED | RETIRED", constraints: "SCOUTING on create; AGREEMENT_EXECUTED when an OwnerAgreement reaches EXECUTED; RETIRED removes the location from new bookings" }

  - name: LocationOwner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Owner legal name" }
      - { name: contact_email, type: string, source: input, description: "Owner contact email", constraints: "Unique across all LocationOwner rows" }
      - { name: default_day_rate_cents, type: integer, source: input, description: "Owner's asking day rate used as the anchor for the first negotiation round" }

  - name: LocationBooking
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id being booked" }
      - { name: booking_start_date, type: string, source: input, description: "First booked date (inclusive, closed interval semantics)" }
      - { name: booking_end_date, type: string, source: input, description: "Last booked date (inclusive, closed interval semantics)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | RELEASED", constraints: "CONFIRMED on create when the buffer rule passes; RELEASED frees the interval. Buffer rule: the new booking's closed interval [booking_start_date - buffer_days, booking_end_date + buffer_days] must not intersect any other CONFIRMED booking's closed [booking_start_date, booking_end_date] at the same location — touching counts as conflict (closed-closed adjacency is a CONFLICT, unlike StreetClosure's half-open adjacency which is not)." }

  - name: ScoutPackage
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; parent production" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; scouted location" }
      - { name: photo_count, type: integer, source: input, description: "Number of scout photos delivered", constraints: "Must be >= 6 for the package to be SUBMITTED" }
      - { name: coverage_score_pct, type: integer, source: input, description: "Surveyor-rated coverage 0-100", constraints: "0 <= coverage_score_pct <= 100" }
      - { name: scout_date, type: string, source: input, description: "ISO date of the physical scout" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED", constraints: "DRAFT on create; SUBMITTED requires photo_count >= 6; ACCEPTED is required before an OwnerAgreement may be countersigned" }

  - name: OwnerAgreement
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; parent production" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id" }
      - { name: shoot_start_date, type: string, source: input, description: "ISO date of first shoot day covered" }
      - { name: shoot_end_date, type: string, source: input, description: "ISO date of last shoot day covered (inclusive)" }
      - { name: proposed_day_rate_cents, type: integer, source: system, description: "Day rate on the table in the current round; set by the proposing party each round" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of completed proposal rounds; increments on each PROPOSE" }
      - { name: max_rounds, type: integer, source: input, default: 5, description: "Negotiation hard cap; the PROPOSE that would push round_count beyond max_rounds is rejected" }
      - { name: agreed_day_rate_cents, type: integer, source: system, description: "Final day rate locked at EXECUTED; equals the proposed_day_rate_cents of the accepted round" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERED | EXECUTED | COLLAPSED", constraints: "Cyclic negotiation: PROPOSED <-> COUNTERED may iterate; EXECUTED and COLLAPSED are terminal" }

  - name: PermitApplication
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id; parent production" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; copied from Location at create and pinned (version-pinning on approval)" }
      - { name: shoot_start_date, type: string, source: input, description: "First shoot day requested" }
      - { name: shoot_end_date, type: string, source: input, description: "Last shoot day requested (inclusive)" }
      - { name: closed_lanes, type: integer, source: input, default: 0, description: "Number of traffic lanes requested for closure" }
      - { name: shoot_hours_per_day, type: integer, source: input, description: "Planned shoot hours per day; must be <= Location.max_shoot_hours_per_day" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped logical-clock timestamp at SUBMIT; lead-time math uses this" }
      - { name: business_days_available, type: integer, source: system, description: "Business days between submitted_at's date and shoot_start_date per the pinned jurisdiction's calendar; computed at SUBMIT" }
      - { name: lead_time_satisfied, type: boolean, source: system, description: "business_days_available >= jurisdiction.lead_time_business_days; computed at SUBMIT" }
      - { name: fee_cents, type: integer, source: computed, description: "Permit fee per calc permit_fee; computed at SUBMIT and recomputed on amendment" }
      - { name: amendment_of_id, type: string, source: input, description: "Nullable FK -> PermitApplication.id (self-referential); an amendment supersedes the referenced ISSUED or CONDITIONALLY_APPROVED application", constraints: "When set, the referenced application transitions to SUPERSEDED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | CONDITIONALLY_APPROVED | ISSUED | DENIED | SUPERSEDED | EXPIRED | WITHDRAWN", constraints: "See state machine" }

  - name: StreetClosure
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: permit_application_id, type: string, source: input, description: "FK -> PermitApplication.id; the ISSUED permit that authorizes this closure" }
      - { name: street_segment, type: string, source: input, description: "Normalized street segment identifier, e.g. 'MAIN-ST-100-BLOCK'" }
      - { name: closure_start, type: datetime, source: input, description: "Closure window start (ISO8601)" }
      - { name: closure_end, type: datetime, source: input, description: "Closure window end (ISO8601); half-open interval [start, end) — a second closure starting exactly at this end does NOT overlap" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | ACTIVE | COMPLETED | CANCELLED", constraints: "APPROVED requires the backing permit ISSUED; ACTIVE auto at window start; COMPLETED auto at window end" }

  - name: NotificationRecord
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: permit_application_id, type: string, source: input, description: "FK -> PermitApplication.id; notification attaches to a specific application" }
      - { name: posted_at, type: datetime, source: system, description: "Server-stamped logical-clock time when notification was posted" }
      - { name: households_reached, type: integer, source: input, description: "Households within the jurisdiction radius that received notice" }
      - { name: radius_ft_used, type: integer, source: input, description: "Radius actually canvassed; must be >= jurisdiction.notification_radius_ft" }
      - { name: calendar_days_before_shoot, type: integer, source: system, description: "Calendar days between posted_at's date and permit shoot_start_date" }
      - { name: notification_adequate, type: boolean, source: system, description: "calendar_days_before_shoot >= jurisdiction.notification_lead_calendar_days AND radius_ft_used >= notification_radius_ft" }
      - { name: status, type: enum, source: system, description: "POSTED | ACKED | DEFICIENT", constraints: "POSTED on create; ACKED by film office after adequacy check passes; DEFICIENT when adequacy check fails" }

  - name: InsuranceCertificate
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id the certificate is presented to" }
      - { name: insurer_name, type: string, source: input, description: "Issuing insurer" }
      - { name: umbrella_limit_cents, type: integer, source: input, description: "Certificate's umbrella liability limit" }
      - { name: indemnity_clause_ref, type: string, source: input, description: "Reference to the indemnity clause; must be non-empty for verification" }
      - { name: effective_date, type: string, source: input, description: "Coverage effective date (inclusive)" }
      - { name: expiry_date, type: string, source: input, description: "Coverage expiry date (inclusive); must cover every shoot day of any linked permit" }
      - { name: status, type: enum, source: system, description: "PRESENTED | VERIFIED | REJECTED | LAPSED", constraints: "VERIFIED requires umbrella_limit_cents >= jurisdiction.min_liability_limit_cents, non-empty indemnity_clause_ref, and coverage spanning the permit window; LAPSED auto when the logical clock passes expiry_date" }

  - name: DepositAccount
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; one deposit account per (production, location) pair", constraints: "Unique on (production_id, location_id)" }
      - { name: required_amount_cents, type: integer, source: computed, description: "Deposit required per calc deposit_required; max(location.deposit_floor_cents, risk-based amount)" }
      - { name: held_amount_cents, type: integer, source: system, default: 0, description: "Cumulative funds the production has deposited and not yet had released" }
      - { name: claimed_amount_cents, type: integer, source: system, default: 0, description: "Cumulative damage-claim allocations against the deposit" }
      - { name: released_amount_cents, type: integer, source: system, default: 0, description: "Cumulative funds returned to the production after walkthrough" }
      - { name: status, type: enum, source: system, description: "OPEN | FUNDED | SETTLING | CLOSED", constraints: "OPEN on create; FUNDED when held_amount_cents >= required_amount_cents; SETTLING after the final walkthrough opens claims; CLOSED when claims are settled and remainder released" }

  - name: WalkthroughReport
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id" }
      - { name: kind, type: enum, source: input, description: "PRE | POST", constraints: "PRE must exist and be SIGNED before the first ShootDay at the location; POST opens deposit settlement" }
      - { name: damage_item_count, type: integer, source: input, default: 0, description: "Number of damage line items observed" }
      - { name: damage_claim_cents, type: integer, source: input, default: 0, description: "Total claimed restoration cost across line items" }
      - { name: signed_by_owner, type: boolean, source: input, default: false, description: "Owner signature flag" }
      - { name: signed_by_manager, type: boolean, source: input, default: false, description: "Location manager signature flag" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | DISPUTED | FINAL", constraints: "SIGNED requires both signature flags true; DISPUTED when a party rejects the POST report; FINAL when claims settle" }

  - name: MonitorAssignment
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: shoot_day_id, type: string, source: input, description: "FK -> ShootDay.id the monitor staffs" }
      - { name: monitor_type, type: enum, source: input, description: "POLICE | FIRE | FILM_OFFICER", constraints: "POLICE required when permit.closed_lanes >= jurisdiction.police_monitor_lane_threshold" }
      - { name: officer_badge, type: string, source: input, description: "Badge/identifier of the assigned officer", constraints: "One officer may hold at most one assignment per shoot day (unique on (officer_badge, shoot_day_id) among non-RELEASED rows)" }
      - { name: hours_booked, type: integer, source: input, description: "Hours booked for this officer" }
      - { name: checked_in, type: boolean, source: system, default: false, description: "Set true by the check-in endpoint on the shoot day; CONFIRMED + not checked_in at completion -> NO_SHOW" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | RELEASED | NO_SHOW", constraints: "ASSIGNED on create; CONFIRMED by film office; RELEASED frees the officer; NO_SHOW recorded on the shoot day and feeds complaint escalation" }

  - name: ShootDay
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: permit_application_id, type: string, source: input, description: "FK -> PermitApplication.id (must be ISSUED) authorizing this day" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id" }
      - { name: shoot_date, type: string, source: input, description: "ISO date of the shoot day; must lie within the permit's [shoot_start_date, shoot_end_date] inclusive window" }
      - { name: planned_hours, type: integer, source: input, description: "Planned hours; must be <= location.max_shoot_hours_per_day" }
      - { name: actual_hours, type: integer, source: system, description: "Actual hours recorded at completion" }
      - { name: overtime_minutes, type: integer, source: system, default: 0, description: "max(0, actual_hours - planned_hours) * 60 recorded at completion" }
      - { name: monitors_required, type: integer, source: computed, description: "Per calc monitors_required from permit.closed_lanes, shoot hours, production.cast_size, jurisdiction thresholds" }
      - { name: monitors_confirmed, type: integer, source: computed, description: "Count of MonitorAssignment rows for this day with status CONFIRMED" }
      - { name: compliance_status, type: enum, source: computed, description: "COMPLIANT | DEGRADED | VIOLATION — derived per calc shoot_day_compliance" }
      - { name: status, type: enum, source: system, description: "PLANNED | READY | IN_PROGRESS | COMPLETED | CANCELLED | SHUT_DOWN", constraints: "READY is gated by posture; IN_PROGRESS auto on the shoot date when READY; SHUT_DOWN from IN_PROGRESS on a CRITICAL complaint" }

  - name: Complaint
    parent: Production
    common_fields: true
    fields:
      - { name: production_id, type: string, source: system, description: "FK -> Production.id" }
      - { name: shoot_day_id, type: string, source: input, description: "FK -> ShootDay.id the complaint concerns" }
      - { name: category, type: enum, source: input, description: "NOISE | PARKING | PROPERTY_DAMAGE | HOURS_VIOLATION | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL", constraints: "CRITICAL on an IN_PROGRESS shoot day triggers SHUT_DOWN" }
      - { name: filed_at, type: datetime, source: system, description: "Server-stamped logical-clock time the complaint was filed" }
      - { name: response_due_at, type: datetime, source: system, description: "filed_at + 24h; an OPEN complaint past due at ops sweep escalates" }
      - { name: resolution_note, type: string, source: input, description: "Resolution narrative recorded at resolve", default: "" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED | ESCALATED", constraints: "OPEN -> ACKNOWLEDGED -> RESOLVED; OPEN past response_due_at auto-escalates at the ops sweep; ESCALATED requires film-office resolution" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Jurisdiction
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /jurisdictions/{id}/suspend"
        actor: FilmOffice
        preconditions: []
        side_effects:
          - "New permit submissions into this jurisdiction rejected (ERR_JURISDICTION_SUSPENDED)"

  - entity: Location
    initial_state: SCOUTING
    terminal_states: [RETIRED]
    transitions:
      - from: SCOUTING
        to: AGREEMENT_EXECUTED
        trigger: "system (cascade when an OwnerAgreement for this location reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCOUTING
        to: RETIRED
        trigger: "POST /locations/{id}/retire"
        actor: LocationManager
        preconditions: []
        side_effects: []
      - from: AGREEMENT_EXECUTED
        to: RETIRED
        trigger: "POST /locations/{id}/retire"
        actor: LocationManager
        preconditions: []
        side_effects: []

  - entity: LocationBooking
    initial_state: CONFIRMED
    terminal_states: [RELEASED]
    transitions:
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /productions/{id}/location-bookings/{id}/release"
        actor: LocationManager
        preconditions:
          - "No ShootDay for this location in PLANNED/READY/IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Booking interval freed for future buffer checks"

  - entity: ScoutPackage
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /productions/{id}/scout-packages/{id}/submit"
        actor: LocationManager
        preconditions:
          - "photo_count >= 6 (ERR_PACKAGE_INCOMPLETE)"
          - "Production.status == PREP"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /productions/{id}/scout-packages/{id}/review with decision=ACCEPT"
        actor: FilmOffice
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /productions/{id}/scout-packages/{id}/review with decision=REJECT"
        actor: FilmOffice
        preconditions: []
        side_effects: []

  - entity: OwnerAgreement
    initial_state: DRAFT
    terminal_states: [EXECUTED, COLLAPSED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /productions/{id}/owner-agreements/{id}/propose"
        actor: LocationManager
        preconditions:
          - "An ACCEPTED ScoutPackage exists for (production_id, location_id) (ERR_SCOUT_NOT_ACCEPTED)"
          - "proposed_day_rate_cents > 0"
        side_effects:
          - "round_count += 1"
          - "proposed_day_rate_cents := payload rate"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /productions/{id}/owner-agreements/{id}/counter"
        actor: OwnerRep
        preconditions:
          - "round_count < max_rounds (ERR_NEGOTIATION_EXHAUSTED)"
        side_effects:
          - "proposed_day_rate_cents := payload counter rate"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /productions/{id}/owner-agreements/{id}/propose"
        actor: LocationManager
        preconditions:
          - "round_count < max_rounds (ERR_NEGOTIATION_EXHAUSTED)"
        side_effects:
          - "round_count += 1"
          - "proposed_day_rate_cents := payload rate"
      - from: PROPOSED
        to: EXECUTED
        trigger: "POST /productions/{id}/owner-agreements/{id}/accept"
        actor: OwnerRep
        preconditions:
          - "Location.status != RETIRED"
        side_effects:
          - "agreed_day_rate_cents := proposed_day_rate_cents"
          - "Location.status := AGREEMENT_EXECUTED"
      - from: COUNTERED
        to: EXECUTED
        trigger: "POST /productions/{id}/owner-agreements/{id}/accept"
        actor: LocationManager
        preconditions:
          - "Location.status != RETIRED"
        side_effects:
          - "agreed_day_rate_cents := proposed_day_rate_cents"
          - "Location.status := AGREEMENT_EXECUTED"
      - from: PROPOSED
        to: COLLAPSED
        trigger: "POST /productions/{id}/owner-agreements/{id}/walk-away"
        actor: LocationManager
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: COLLAPSED
        trigger: "POST /productions/{id}/owner-agreements/{id}/walk-away"
        actor: OwnerRep
        preconditions: []
        side_effects: []

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [DENIED, SUPERSEDED, EXPIRED, WITHDRAWN]  # ISSUED is the live-approved state (outgoing: SUPERSEDED, EXPIRED); for the Production wrap gate, 'terminal' means NOT IN {DRAFT, SUBMITTED, UNDER_REVIEW, CONDITIONALLY_APPROVED}
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /productions/{id}/permit-applications/{id}/submit"
        actor: LocationManager
        preconditions:
          - "Production.status IN {PREP, ACTIVE}"
          - "Location.status == AGREEMENT_EXECUTED (ERR_AGREEMENT_NOT_EXECUTED)"
          - "Jurisdiction.status == ACTIVE (ERR_JURISDICTION_SUSPENDED)"
          - "OwnerAgreement EXECUTED window covers [shoot_start_date, shoot_end_date] (ERR_AGREEMENT_NOT_EXECUTED)"
          - "shoot_hours_per_day <= Location.max_shoot_hours_per_day (ERR_HOURS_EXCEED_LOCATION_CAP)"
        side_effects:
          - "submitted_at := logical clock now"
          - "business_days_available := calc business_days_between(submitted_at date, shoot_start_date, jurisdiction.holidays)"
          - "lead_time_satisfied := business_days_available >= jurisdiction.lead_time_business_days"
          - "fee_cents := calc permit_fee (permit_fee variant A: calendar-day model vs variant B pinned business-day model — variant B is authoritative at submit)"
          - "if NOT lead_time_satisfied: status := SUBMITTED but review is gated (see UNDER_REVIEW precondition)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /productions/{id}/permit-applications/{id}/start-review"
        actor: FilmOffice
        preconditions:
          - "lead_time_satisfied == true (ERR_LEAD_TIME_SHORT)"
        side_effects: []
      - from: UNDER_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "POST /productions/{id}/permit-applications/{id}/decide with decision=APPROVE_WITH_CONDITIONS"
        actor: FilmOffice
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ISSUED
        trigger: "POST /productions/{id}/permit-applications/{id}/decide with decision=ISSUE"
        actor: FilmOffice
        preconditions:
          - "A VERIFIED InsuranceCertificate exists for (production_id, jurisdiction_id) whose [effective_date, expiry_date] covers [shoot_start_date, shoot_end_date] (ERR_INSURANCE_INSUFFICIENT)"
        side_effects: []
      - from: CONDITIONALLY_APPROVED
        to: ISSUED
        trigger: "POST /productions/{id}/permit-applications/{id}/decide with decision=ISSUE"
        actor: FilmOffice
        preconditions:
          - "VERIFIED InsuranceCertificate covering the window (ERR_INSURANCE_INSUFFICIENT)"
          - "NotificationRecord for this application with status == ACKED (ERR_NOTIFICATION_DEFICIENT)"
        side_effects: []
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /productions/{id}/permit-applications/{id}/decide with decision=DENY"
        actor: FilmOffice
        preconditions: []
        side_effects: []
      - from: CONDITIONALLY_APPROVED
        to: DENIED
        trigger: "POST /productions/{id}/permit-applications/{id}/decide with decision=DENY"
        actor: FilmOffice
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /productions/{id}/permit-applications with amendment_of_id := this application (create-with-supersede)"
        actor: LocationManager
        preconditions: []
        side_effects:
          - "New application created in DRAFT pinned to same jurisdiction"
          - "This application -> SUPERSEDED"
          - "StreetClosures of this application with status REQUESTED or APPROVED -> CANCELLED"
          - "ShootDays of this application in PLANNED or READY -> CANCELLED, and that cancellation itself releases their ASSIGNED/CONFIRMED MonitorAssignments -> RELEASED (link 3 of the supersede cascade)"
      - from: CONDITIONALLY_APPROVED
        to: SUPERSEDED
        trigger: "POST /productions/{id}/permit-applications with amendment_of_id := this application"
        actor: LocationManager
        preconditions: []
        side_effects:
          - "This application -> SUPERSEDED"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (ops sweep when logical clock passes shoot_end_date and no ShootDay reached IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "StreetClosures REQUESTED/APPROVED -> CANCELLED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /productions/{id}/permit-applications/{id}/withdraw"
        actor: LocationManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /productions/{id}/permit-applications/{id}/withdraw"
        actor: LocationManager
        preconditions: []
        side_effects: []

  - entity: StreetClosure
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /productions/{id}/street-closures/{id}/approve"
        actor: FilmOffice
        preconditions:
          - "Backing PermitApplication.status == ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "No other APPROVED or ACTIVE StreetClosure on the same street_segment whose half-open [closure_start, closure_end) intersects this window (ERR_CLOSURE_OVERLAP)"
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "system (ops sweep when logical clock reaches closure_start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (ops sweep when logical clock reaches closure_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (cascade when the backing ShootDay is SHUT_DOWN)"
        actor: system
        preconditions: []
        side_effects:
          - "Interval freed on the street segment"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /productions/{id}/street-closures/{id}/cancel"
        actor: LocationManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /productions/{id}/street-closures/{id}/cancel"
        actor: LocationManager
        preconditions: []
        side_effects: []

  - entity: NotificationRecord
    initial_state: POSTED
    terminal_states: [ACKED, DEFICIENT]
    transitions:
      - from: POSTED
        to: ACKED
        trigger: "POST /productions/{id}/notifications/{id}/acknowledge"
        actor: FilmOffice
        preconditions:
          - "notification_adequate == true (ERR_NOTIFICATION_DEFICIENT)"
        side_effects: []
      - from: POSTED
        to: DEFICIENT
        trigger: "system (automatic at create when notification_adequate == false)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InsuranceCertificate
    initial_state: PRESENTED
    terminal_states: [REJECTED, LAPSED]  # VERIFIED is live-approved (outgoing: LAPSED)
    transitions:
      - from: PRESENTED
        to: VERIFIED
        trigger: "POST /productions/{id}/insurance-certificates/{id}/verify"
        actor: FilmOffice
        preconditions:
          - "umbrella_limit_cents >= Jurisdiction.min_liability_limit_cents (ERR_INSURANCE_INSUFFICIENT)"
          - "indemnity_clause_ref non-empty (ERR_INDEMNITY_MISSING)"
          - "expiry_date >= effective_date"
        side_effects: []
      - from: PRESENTED
        to: REJECTED
        trigger: "POST /productions/{id}/insurance-certificates/{id}/reject"
        actor: FilmOffice
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: LAPSED
        trigger: "system (ops sweep when logical clock passes expiry_date)"
        actor: system
        preconditions: []
        side_effects:
          - "If any linked PermitApplication is ISSUED and its shoot window is not fully in the past: the application is NOT retroactively revoked, but new ShootDay creation for it is blocked (ERR_INSURANCE_INSUFFICIENT)"

  - entity: DepositAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FUNDED
        trigger: "system (automatic when held_amount_cents >= required_amount_cents after a deposit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FUNDED
        to: SETTLING
        trigger: "system (automatic when a POST WalkthroughReport for the location becomes SIGNED or DISPUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SETTLING
        to: CLOSED
        trigger: "POST /productions/{id}/deposit-accounts/{id}/settle"
        actor: FilmOffice
        preconditions:
          - "The POST WalkthroughReport for the location is SIGNED (not DISPUTED) (ERR_WALKTHROUGH_DISPUTED)"
          - "awarded_claim_cents <= held_amount_cents - released_amount_cents (ERR_CLAIM_EXCEEDS_DEPOSIT)"
        side_effects:
          - "claimed_amount_cents += awarded_claim_cents per waterfall in calc deposit_waterfall"
          - "released_amount_cents += (held_amount_cents - released_amount_cents - awarded_claim_cents)"
          - "Invariant: held == claimed + released after settle"

  - entity: WalkthroughReport
    initial_state: DRAFT
    terminal_states: [FINAL]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /productions/{id}/walkthrough-reports/{id}/sign"
        actor: LocationManager
        preconditions:
          - "signed_by_owner == true AND signed_by_manager == true (ERR_SIGNATURE_MISSING)"
          - "For kind == PRE: no other SIGNED PRE report exists for the location (ERR_DUPLICATE_PRE_WALKTHROUGH)"
        side_effects:
          - "If kind == POST: DepositAccount for (production, location) -> SETTLING"
      - from: DRAFT
        to: DISPUTED
        trigger: "POST /productions/{id}/walkthrough-reports/{id}/dispute"
        actor: OwnerRep
        preconditions:
          - "kind == POST"
        side_effects:
          - "DepositAccount for (production, location) -> SETTLING"
      - from: DISPUTED
        to: SIGNED
        trigger: "POST /productions/{id}/walkthrough-reports/{id}/sign (re-sign after dispute)"
        actor: LocationManager
        preconditions:
          - "signed_by_owner == true AND signed_by_manager == true (ERR_SIGNATURE_MISSING)"
        side_effects: []
      - from: SIGNED
        to: FINAL
        trigger: "system (automatic for POST reports when DepositAccount -> CLOSED; PRE reports FINAL when the POST report becomes SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MonitorAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /productions/{id}/monitor-assignments/{id}/confirm"
        actor: FilmOffice
        preconditions:
          - "ShootDay.status == PLANNED or READY"
        side_effects:
          - "ShootDay.monitors_confirmed recomputed"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /productions/{id}/monitor-assignments/{id}/release"
        actor: FilmOffice
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /productions/{id}/monitor-assignments/{id}/release"
        actor: FilmOffice
        preconditions:
          - "ShootDay.status != IN_PROGRESS (ERR_DAY_IN_PROGRESS)"
        side_effects:
          - "ShootDay.monitors_confirmed recomputed"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /productions/{id}/monitor-assignments/{id}/check-in"
        actor: FilmOffice
        preconditions:
          - "ShootDay.status == IN_PROGRESS"
        side_effects:
          - "checked_in := true"
        note: "Self-loop: records officer presence on the day"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (when the ShootDay completes with checked_in == false) OR POST /productions/{id}/monitor-assignments/{id}/mark-no-show"
        actor: FilmOffice
        preconditions: []
        side_effects:
          - "ShootDay.monitors_confirmed recomputed (NO_SHOW no longer counts)"
          - "ShootDay.compliance_status recomputed; a NO_SHOW when monitors_confirmed falls below monitors_required forces compliance_status := VIOLATION"

  - entity: ShootDay
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED, SHUT_DOWN]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "POST /productions/{id}/shoot-days/{id}/mark-ready"
        actor: LocationManager
        preconditions:
          - "PermitApplication.status == ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "NotificationRecord ACKED for the permit (ERR_NOTIFICATION_DEFICIENT)"
          - "VERIFIED InsuranceCertificate covering shoot_date (ERR_INSURANCE_INSUFFICIENT)"
          - "DepositAccount for the location is FUNDED (ERR_DEPOSIT_NOT_FUNDED)"
          - "A SIGNED PRE WalkthroughReport exists for the location (ERR_PRE_WALKTHROUGH_MISSING)"
          - "monitors_confirmed >= monitors_required (ERR_MONITOR_SHORTFALL)"
          - "Every APPROVED StreetClosure needed for this day's lanes exists (ERR_CLOSURE_MISSING) when permit.closed_lanes > 0"
        side_effects:
          - "status := READY; Production.status := ACTIVE if it was PREP"
      - from: READY
        to: IN_PROGRESS
        trigger: "system (ops sweep on shoot_date when status == READY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /productions/{id}/shoot-days/{id}/complete"
        actor: LocationManager
        preconditions:
          - "actual_hours provided; actual_hours <= location.max_shoot_hours_per_day (ERR_HOURS_EXCEED_LOCATION_CAP)"
        side_effects:
          - "overtime_minutes := max(0, actual_hours - planned_hours) * 60"
          - "compliance_status recomputed per calc shoot_day_compliance"
          - "CONFIRMED MonitorAssignments with no check-in -> NO_SHOW"
      - from: IN_PROGRESS
        to: SHUT_DOWN
        trigger: "system (automatic when a CRITICAL Complaint is filed against this IN_PROGRESS day) — also explicit POST /productions/{id}/shoot-days/{id}/shut-down by FilmOffice"
        actor: system
        preconditions: []
        side_effects:
          - "status := SHUT_DOWN"
          - "StreetClosures for this day in APPROVED or ACTIVE -> CANCELLED (link 2)"
          - "That cancellation frees the street_segment interval; Production remains ACTIVE"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /productions/{id}/shoot-days/{id}/cancel"
        actor: LocationManager
        preconditions: []
        side_effects:
          - "ASSIGNED/CONFIRMED MonitorAssignments -> RELEASED"
      - from: READY
        to: CANCELLED
        trigger: "POST /productions/{id}/shoot-days/{id}/cancel"
        actor: LocationManager
        preconditions: []
        side_effects:
          - "ASSIGNED/CONFIRMED MonitorAssignments -> RELEASED"

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED]  # ESCALATED is live (outgoing: RESOLVED by FilmOffice)
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /productions/{id}/complaints/{id}/acknowledge"
        actor: LocationManager
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /productions/{id}/complaints/{id}/resolve"
        actor: LocationManager
        preconditions:
          - "resolution_note non-empty (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "system (ops sweep when logical clock passes response_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "If ShootDay is IN_PROGRESS and complaint severity == CRITICAL: ShootDay -> SHUT_DOWN (fires the shut-down cascade)"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /productions/{id}/complaints/{id}/resolve"
        actor: FilmOffice
        preconditions:
          - "resolution_note non-empty (ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: Production
    initial_state: PREP
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: PREP
        to: ACTIVE
        trigger: "system (automatic when the first ShootDay becomes READY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: WRAPPED
        trigger: "POST /productions/{id}/wrap"
        actor: LocationManager
        preconditions:
          - "Every PermitApplication NOT IN {DRAFT, SUBMITTED, UNDER_REVIEW, CONDITIONALLY_APPROVED} (ERR_APPLICATIONS_OPEN) — checked first"
          - "Every DepositAccount CLOSED (ERR_DEPOSITS_OPEN) — checked second"
          - "No Complaint in OPEN or ACKNOWLEDGED (ERR_COMPLAINTS_OPEN) — checked last"
        side_effects: []
      - from: PREP
        to: CANCELLED
        trigger: "POST /productions/{id}/cancel"
        actor: LocationManager
        preconditions:
          - "No ShootDay has reached READY or beyond (ERR_INVALID_STATE)"
        side_effects:
          - "All DRAFT/SUBMITTED PermitApplications -> WITHDRAWN"
          - "All PROPOSED/COUNTERED OwnerAgreements -> COLLAPSED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: permit-amend-stale-application
    parent_entity: Production
    write_endpoint: "POST /productions/{id}/permit-applications"
    occ_field: "expected_production_version"
    description: |
      Creating a PermitApplication whose amendment_of_id supersedes an existing
      application mutates the Production (its version advances) as part of the
      supersede cascade. A create carrying an expected_production_version older
      than the Production's current version is rejected: the client's view of
      which applications are live is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: shoot-day-ready-stale-day
    parent_entity: ShootDay
    write_endpoint: "POST /productions/{id}/shoot-days/{id}/mark-ready"
    occ_field: "expected_shoot_day_version"
    description: |
      Marking a ShootDay READY consumes derived state (monitors_confirmed,
      deposit posture, certificate status) that other writers advance. A
      mark-ready carrying an expected_shoot_day_version older than the day's
      current version is rejected; the client must re-read the day and re-check
      the gate set before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: business_days_between
    trigger: "PermitApplication submit (lead_time check)"
    algorithm: chronological
    formula: |
      Count days d with start_date < d <= shoot_start_date... precisely:
      business_days_available = number of dates t such that
        submitted_date < t <= shoot_start_date
        AND weekday(t) NOT IN {Saturday, Sunday}
        AND t NOT IN jurisdiction.holidays
      Note the half-open exclusion of the submission date itself and the
      INCLUSION of the shoot date if it is a business day.
    input_set: "The single pinned Jurisdiction's holidays array; logical-clock date at submit"
    precision: "integer days"
    variants: []

  - name: permit_fee
    trigger: "PermitApplication submit and any amendment that changes shoot days, lanes, or cast tier"
    algorithm: tiered_pricing
    formula: |
      days = number of calendar dates in [shoot_start_date, shoot_end_date] inclusive
      subtotal_cents = jurisdiction.base_fee_cents
                     + days * jurisdiction.per_day_fee_cents
                     + days * closed_lanes * jurisdiction.per_lane_fee_cents
      if production.cast_size > jurisdiction.large_cast_threshold:
        fee_cents = floor(subtotal_cents * jurisdiction.large_cast_multiplier_bps / 10000)
      else:
        fee_cents = subtotal_cents
      Evaluation order is pinned: days computed first, then subtotal, then the
      single terminal floor — no intermediate rounding.
    input_set: "PermitApplication fields, pinned Jurisdiction fee fields, Production.cast_size"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer cents; single floor at the final multiplication only"
    variants:
      - name: calendar_day_model
        when: "Estimate quoted at DRAFT (pre-submit) for budgeting"
        difference: "days counts calendar days in the window (identical to base — used for display only)"
      - name: business_day_model
        when: "Authoritative fee at SUBMIT"
        difference: "days counts only business days per business_days_between over the same window (weekend/holiday dates excluded), so a window spanning a weekend produces a STRICTLY SMALLER fee than the calendar-day model for the same inputs"

  - name: notification_adequacy
    trigger: "NotificationRecord create"
    algorithm: threshold
    formula: |
      calendar_days_before_shoot = (shoot_start_date - posted_date) in whole calendar days
      notification_adequate = (calendar_days_before_shoot >= jurisdiction.notification_lead_calendar_days)
                              AND (radius_ft_used >= jurisdiction.notification_radius_ft)
      Boundary: both comparisons are >= (a posting exactly N days before, at
      exactly the radius, IS adequate).
    input_set: "NotificationRecord posted_at (logical clock), PermitApplication.shoot_start_date, pinned Jurisdiction fields"
    precision: "integer days / feet"

  - name: monitors_required
    trigger: "ShootDay create and any permit amendment that changes closed_lanes or hours"
    algorithm: threshold
    formula: |
      base = ceil(shoot_hours_per_day / 8)
      lane_extra = 1 if permit.closed_lanes >= jurisdiction.police_monitor_lane_threshold else 0
      cast_extra = 1 if production.cast_size > jurisdiction.large_cast_threshold else 0
      monitors_required = base + lane_extra + cast_extra
      When lane_extra == 1, at least one of the assignments counted toward
      monitors_confirmed MUST have monitor_type == POLICE, else the READY gate
      fails with ERR_MONITOR_SHORTFALL even if the numeric count is met.
    input_set: "PermitApplication.closed_lanes + shoot_hours_per_day, Production.cast_size, pinned Jurisdiction thresholds"
    precision: "integer count"
    variants: []

  - name: deposit_required
    trigger: "DepositAccount create and any OwnerAgreement execution for the location"
    algorithm: threshold
    formula: |
      shoot_days = number of calendar dates in the agreement window
      risk_amount_cents = floor(agreed_day_rate_cents * shoot_days * 50 / 100)
      required_amount_cents = max(location.deposit_floor_cents, risk_amount_cents)
      Rounding order is PINNED: multiply rate * days first, then * 50, then a
      single floor on division by 100. The counterfactual order
      floor(agreed_day_rate_cents * 50 / 100) * shoot_days produces a DIFFERENT
      value whenever agreed_day_rate_cents is odd (e.g. rate 99999 x 3 days:
      pinned = floor(299997*50/100) = 149998; counterfactual = 49999*3 = 149997).
      Boundary: when deposit_floor_cents == risk_amount_cents exactly, the max
      is that common value (no tie-break surcharge).
    input_set: "Location.deposit_floor_cents, OwnerAgreement agreed rate + window"
    precision: "integer cents; single floor at the final division only"
    variants: []

  - name: deposit_waterfall
    trigger: "DepositAccount settle"
    algorithm: waterfall_allocation
    formula: |
      awarded = min(awarded_claim_cents, held_amount_cents - released_amount_cents)
      claimed_amount_cents += awarded
      released_amount_cents += (held_amount_cents - released_amount_cents - awarded)
      Invariant after settle: held_amount_cents == claimed_amount_cents + released_amount_cents
      Bucket order pinned: claims first, remainder to release. The award itself
      is an explicit FilmOffice input (not derived), capped at the un-released
      balance.
    input_set: "DepositAccount fields; FilmOffice-provided awarded_claim_cents"
    precision: "integer cents"

  - name: shoot_day_compliance
    trigger: "ShootDay complete, MonitorAssignment NO_SHOW, or Complaint CRITICAL"
    algorithm: weighted_scoring
    formula: |
      violations = 0
      if overtime_minutes > 0: violations += 1
      if monitors_confirmed < monitors_required: violations += 1
      if any counted complaint with severity IN {HIGH, CRITICAL}: violations += 2
      if any counted complaint with severity == MEDIUM: violations += 1
      compliance_status =
        VIOLATION if violations >= 2
        DEGRADED  if violations == 1
        COMPLIANT if violations == 0
      Boundary: violations >= 2 (two MEDIUM complaints already tip VIOLATION).
      The set of "counted" complaints depends on the variant below.
    input_set: "ShootDay overtime + monitor counts; Complaint rows for the day (variant-dependent)"
    precision: "integer score"
    variants:
      - name: strict
        when: "Authoritative compliance_status persisted on the ShootDay and used for wrap gating"
        difference: "ALL complaints against the day count, including RESOLVED ones — resolution does not erase the compliance fact"
      - name: lenient_display
        when: "Film-office dashboard projection only (never persisted to ShootDay.compliance_status)"
        difference: "Only complaints in OPEN/ACKNOWLEDGED/ESCALATED count; a RESOLVED HIGH complaint drops the projection from VIOLATION (2 points) to COMPLIANT (0) while the persisted strict value stays VIOLATION"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist and belong to the production scope, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC expected_*_version matches the parent entity's current version when the endpoint requires it"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /productions/{id}/permit-applications; POST /productions/{id}/shoot-days/{id}/mark-ready"
  - priority: 5
    category: state
    check: "Target resource state permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Insurance sufficiency (limit, indemnity clause, coverage window) before ISSUE, mark-ready, or certificate verify"
    error_id: ERR_INSURANCE_INSUFFICIENT
    http_status: 422
    applies_to: "permit decide ISSUE; insurance verify; shoot-day mark-ready"
  - priority: 7
    category: business_safety
    check: "Indemnity clause reference non-empty at certificate verification"
    error_id: ERR_INDEMNITY_MISSING
    http_status: 422
    applies_to: "insurance verify"
  - priority: 8
    category: business_temporal
    check: "Lead time: business_days_available >= jurisdiction.lead_time_business_days before review starts"
    error_id: ERR_LEAD_TIME_SHORT
    http_status: 422
    applies_to: "permit start-review"
  - priority: 9
    category: business_temporal
    check: "Notification adequacy (calendar days + radius) before ACK and before conditional-issue"
    error_id: ERR_NOTIFICATION_DEFICIENT
    http_status: 422
    applies_to: "notification acknowledge; permit decide ISSUE from CONDITIONALLY_APPROVED"
  - priority: 10
    category: business_referential
    check: "Agreement chain: ACCEPTED scout package before PROPOSE; EXECUTED agreement window covering permit window before SUBMIT"
    error_id: ERR_SCOUT_NOT_ACCEPTED
    http_status: 422
    applies_to: "owner-agreement propose"
  - priority: 11
    category: business_referential
    check: "EXECUTED OwnerAgreement covering [shoot_start_date, shoot_end_date] exists for (production, location)"
    error_id: ERR_AGREEMENT_NOT_EXECUTED
    http_status: 422
    applies_to: "permit submit"
  - priority: 12
    category: business_constraint
    check: "StreetClosure half-open interval overlap on the same street_segment among APPROVED/ACTIVE rows"
    error_id: ERR_CLOSURE_OVERLAP
    http_status: 409
    applies_to: "street-closure approve"
  - priority: 13
    category: business_constraint
    check: "Location booking buffer: new booking's [start-buffer_days, end+buffer_days] closed interval must not touch any existing CONFIRMED booking's closed [start,end]"
    error_id: ERR_BOOKING_BUFFER_CONFLICT
    http_status: 409
    applies_to: "location booking create"
  - priority: 14
    category: business_constraint
    check: "shoot_hours_per_day <= location.max_shoot_hours_per_day at permit submit; actual_hours <= cap at complete"
    error_id: ERR_HOURS_EXCEED_LOCATION_CAP
    http_status: 422
    applies_to: "permit submit; shoot-day complete"
  - priority: 15
    category: business_constraint
    check: "Monitor coverage: monitors_confirmed >= monitors_required AND at least one POLICE when required"
    error_id: ERR_MONITOR_SHORTFALL
    http_status: 422
    applies_to: "shoot-day mark-ready"
  - priority: 16
    category: business_fiscal
    check: "Deposit funded (held >= required) before mark-ready; claim award <= unreleased balance at settle"
    error_id: ERR_DEPOSIT_NOT_FUNDED
    http_status: 422
    applies_to: "shoot-day mark-ready"
  - priority: 17
    category: business_fiscal
    check: "Claim exceeds unreleased deposit balance"
    error_id: ERR_CLAIM_EXCEEDS_DEPOSIT
    http_status: 422
    applies_to: "deposit settle"
  - priority: 18
    category: business_constraint
    check: "Negotiation round cap: PROPOSE/COUNTER rejected when round_count would exceed max_rounds"
    error_id: ERR_NEGOTIATION_EXHAUSTED
    http_status: 422
    applies_to: "owner-agreement propose/counter"
  - priority: 19
    category: business_constraint
    check: "Scout package photo floor at submit"
    error_id: ERR_PACKAGE_INCOMPLETE
    http_status: 422
    applies_to: "scout-package submit"
  - priority: 20
    category: business_constraint
    check: "PRE walkthrough must be SIGNED before mark-ready; exactly one SIGNED PRE per location"
    error_id: ERR_PRE_WALKTHROUGH_MISSING
    http_status: 422
    applies_to: "shoot-day mark-ready"
  - priority: 21
    category: business_constraint
    check: "Signature pair complete before sign transition"
    error_id: ERR_SIGNATURE_MISSING
    http_status: 422
    applies_to: "walkthrough sign"
  - priority: 22
    category: business_constraint
    check: "Jurisdiction must be ACTIVE for new permits"
    error_id: ERR_JURISDICTION_SUSPENDED
    http_status: 422
    applies_to: "permit submit"
  - priority: 23
    category: business_referential
    check: "StreetClosure approval requires an ISSUED permit; mark-ready requires an ISSUED permit; shoot-day create requires a non-terminal permit"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 422
    applies_to: "shoot-day mark-ready; street-closure approve; shoot-day create (terminal permits only)"
  - priority: 24
    category: business_constraint
    check: "Duplicate SIGNED PRE walkthrough for the same location"
    error_id: ERR_DUPLICATE_PRE_WALKTHROUGH
    http_status: 422
    applies_to: "walkthrough sign"
  - priority: 25
    category: business_constraint
    check: "POST settle blocked while the POST walkthrough is DISPUTED"
    error_id: ERR_WALKTHROUGH_DISPUTED
    http_status: 422
    applies_to: "deposit settle"
  - priority: 26
    category: state
    check: "Monitor release blocked while the day is IN_PROGRESS"
    error_id: ERR_DAY_IN_PROGRESS
    http_status: 409
    applies_to: "monitor-assignment release"
  - priority: 27
    category: state
    check: "Production wrap requires all applications terminal, deposits closed, complaints resolved"
    error_id: "ERR_APPLICATIONS_OPEN / ERR_DEPOSITS_OPEN / ERR_COMPLAINTS_OPEN"
    http_status: 409
    applies_to: "production wrap"
  - priority: 28
    category: business_constraint
    check: "Required input fields present and well-typed; enum values valid; dates parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 29
    category: business_constraint
    check: "ShootDay needs APPROVED StreetClosure rows covering the day's lanes when permit.closed_lanes > 0"
    error_id: ERR_CLOSURE_MISSING
    http_status: 422
    applies_to: "shoot-day mark-ready"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [FilmOffice]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["Advance logical clock; subsequent ops sweeps and server stamps use it"]

  # --- Ops sweep ---
  - method: POST
    path: "/_ops/sweep"
    description: "Advance the system epoch: expire stale permits past shoot_end_date, lapse expired certificates, escalate overdue complaints, activate/complete street closures whose window the clock has entered/passed, move READY shoot days to IN_PROGRESS on their shoot date, mark no-show monitors on completed days."
    roles: [FilmOffice]
    code: 200
    input: []
    output: "{ swept: integer }"
    side_effects:
      - "PermitApplication ISSUED past shoot_end_date with no IN_PROGRESS day -> EXPIRED"
      - "InsuranceCertificate VERIFIED past expiry -> LAPSED"
      - "Complaint OPEN past response_due_at -> ESCALATED (with CRITICAL cascade)"
      - "StreetClosure APPROVED -> ACTIVE -> COMPLETED per window"
      - "ShootDay READY on shoot_date -> IN_PROGRESS"

  # --- Jurisdictions (config) ---
  - method: POST
    path: "/jurisdictions"
    description: "Create a jurisdiction (film-office configuration)"
    roles: [FilmOffice]
    code: 201
    input: [code, name, lead_time_business_days, notification_lead_calendar_days, notification_radius_ft, base_fee_cents, per_day_fee_cents, per_lane_fee_cents, large_cast_threshold, large_cast_multiplier_bps, min_liability_limit_cents, police_monitor_lane_threshold, "holidays?"]
    output: Jurisdiction
    side_effects: ["status := ACTIVE"]
  - method: GET
    path: "/jurisdictions/{id}"
    description: "Get a jurisdiction"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
