              as_user_id: "${s1}"
          assert:
            - "Before the trigger the invariant holds with money in flight: Customer.${c1}.ebt_snap_balance_cents == 2242 and Customer.${c1}.ebt_captured_total_cents == 2758 (sum 5000)"
            - "After the trigger: Order.${o1}.payment_status == REFUNDED and Order.${o1}.refunded_cents == 5244 (2758 EBT + 2486 card)"
            - "After the trigger: Order.${o1}.ebt_captured_cents == 0 and Customer.${c1}.ebt_captured_total_cents == 0"
            - "After the trigger: Customer.${c1}.ebt_snap_balance_cents == 5000, so ebt_snap_balance_cents + ebt_captured_total_cents == 5000 exactly as before any capture (no drift, no double credit)"
            - "The card slice is compensated separately: one CreditLedgerEntry with reason_code POST_CHECKOUT_REVERSAL and amount_cents == 2486, plus one with reason_code ABANDONMENT_INCONVENIENCE and amount_cents == 914 (500 flat + 10% of estimated_subtotal 4138, all three lines picked)"
            - "Customer.${c1}.credit_balance_cents == 3400 and no CreditLedgerEntry carries reason_code PARITY_ADJUSTMENT"
            - "Order.${o1}.fulfillment_status == REASSIGN_PENDING while every OrderLine of O1 is back to REQUESTED with final_price_cents == 0"
            - "Batch.${b1}.status == ABANDONED and the ShopperPayout for Batch.${b1} has status FORFEITED with total_payout_cents == 0"

      - name: capacity_units_conserved_on_claim_then_abandon
        grounds:
          - calculations.shopper_commitment_ledger
          - state_machines.Batch.OFFERED_to_CLAIMED
          - state_machines.Batch.CLAIMED_to_ABANDONED
          - entities.Shopper.fields.committed_units
        distinguishing_aspect: |
          A different conserved quantity from the money instance: shopper capacity units.
          committed_units must travel 0 -> 5 -> 0 across a claim and its compensating abandonment,
          and at BOTH observation points the stored field must equal the recomputed ledger sum over
          batches in {CLAIMED, SHOPPING, CHECKED_OUT}; the abandonment_count side effect rises to 1
          but capacity itself leaks nothing, and the shopper stays ACTIVE below the threshold of 2.
        test_recipe:
          setup:
            - "Retailer R1 (markup 0.15) with item I1 EACH in_store 400 unit_weight 1.0."
            - "Customer C1; a single Shopper SC in SF-09 with vehicle_capacity_units 10, committed_units 0 and abandonment_count 0."
            - "Order OC: one line of I1 x5 -> BatchOrder.units 5; Batch BC window 08:00-11:00 tier_access_floor PROBATION holding OC, dispatched to SC and claimed by SC (committed_units 5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-EACH-EBT", name: "Canned Beans", pricing_unit: "EACH", in_store_price_cents: 400, is_ebt_eligible: true, unit_weight_lb: 1.0 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { i1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Dana Ortiz", card_last4: "4242" }
              as: CustomerSupport
              captures: { c1: $.data.id }
            - call: "POST /shoppers"
              payload: { display_name: "Cass Nolan", service_area_code: "SF-09", vehicle_capacity_units: 10 }
              as: DispatchAdmin
              captures: { sc: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1}", retailer_id: "${r1}", delivery_distance_mi: 3.0, delivery_deadline: "2026-08-01T11:00:00Z", ebt_requested: false, tip_amount_cents: 0 }
              as: Customer
              as_user_id: "${c1}"
              captures: { oc: $.data.id }
            - call: "POST /orders/${oc}/lines"
              payload: { catalog_item_id: "${i1}", requested_qty: 5 }
              as: Customer
              as_user_id: "${c1}"
              captures: { kc: $.data.id }
            - call: "POST /orders/${oc}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /batches"
              payload: { service_area_code: "SF-09", shop_window_start: "2026-08-01T08:00:00Z", shop_window_end: "2026-08-01T11:00:00Z", tier_access_floor: "PROBATION" }
              as: DispatchAdmin
              captures: { bc: $.data.id, bc_v: $.data.version }
            - call: "POST /batches/${bc}/orders"
              payload: { order_id: "${oc}", expected_batch_version: "${bc_v}" }
              as: DispatchAdmin
              captures: { bc_units: $.data.units }
            - call: "POST /batches/${bc}/dispatch"
              payload: {}
              as: DispatchAdmin
            - call: "POST /batches/${bc}/claim"
              payload: {}
              as: Shopper
              as_user_id: "${sc}"
          trigger:
            - call: "POST /batches/${bc}/abandon"
              payload: { reason_note: "flat tyre before shopping" }
              as: Shopper
              as_user_id: "${sc}"
          assert:
            - "Before the trigger: Batch.${bc}.total_units == 5, Batch.${bc}.status == CLAIMED and Shopper.${sc}.committed_units == 5, equal to the ledger sum over {CLAIMED, SHOPPING, CHECKED_OUT} batches"
            - "After the trigger: Shopper.${sc}.committed_units == 0, exactly the pre-claim value, and equal to the ledger sum which is now empty"
            - "After the trigger: Batch.${bc}.status == ABANDONED with claimed_shopper_id null and declined_shopper_ids == [${sc}], so the batch no longer holds any of the shopper's capacity"
            - "Shopper.${sc}.abandonment_count == 1, Shopper.${sc}.completed_batch_count == 0 and Shopper.${sc}.status == ACTIVE (1 < ABANDONMENT_SUSPENSION_THRESHOLD 2, so no suspension cascade fires)"
            - "The compensation is money-neutral for the shopper: the ShopperPayout for Batch.${bc} is FORFEITED with base_pay_cents == 0, heavy_pay_cents == 0, mileage_bonus_cents == 0, tip_paid_cents == 0 and total_payout_cents == 0"
            - "Customer.${c1} receives exactly one CreditLedgerEntry, reason_code ABANDONMENT_INCONVENIENCE with amount_cents == 500 (zero picked lines, so disruption_pct 0.00) and credit_balance_cents == 500"
            - "Order.${oc}.fulfillment_status == REASSIGN_PENDING and OrderLine.${kc}.status == REQUESTED with picked_qty == 0"
