            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${or_agr}" }
              as: HotelManagerOps
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${or_agr}" }
              as: AssetManager
            - call: "GET /hotel-management/budgets"
              payload: { agreement_id: "${or_agr}" }
