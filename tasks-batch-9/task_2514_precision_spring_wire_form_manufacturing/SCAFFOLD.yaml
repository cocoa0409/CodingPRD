scenario: |
  Generate task harder than expert level!

  2514. Precision Spring & Wire Form Manufacturing (precision spring manufacturer): design engineering
  with spring rate, stress and fatigue life calculation for the application, wire material selection with
  tensile grades, coatings and corrosion requirements, coiling setup on computer-controlled machines with
  tooling and first-article inspection, stress relief, shot peening and heat treatment for fatigue
  performance, load testing and dimensional inspection with statistical process control on critical
  characteristics, high-volume automotive and medical qualification with production part approval
  documentation, tooling amortization, minimum order quantities and prototype-to-production transition,
  packaging to prevent tangling and damage in transit
domain_name: precision-spring-wire-form-manufacturing
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # graph: SpringDesign is the hub referenced by CriticalCharacteristic, ToolingAsset, MachineSetup,
  # ProductionRun and QualificationSubmission; ProductionRun joins MachineSetup x WireLot; ShipmentLot
  # joins ProductionRun x CustomerProgram; InspectionRecord joins ProductionRun x CriticalCharacteristic.
  # Every collection is a flat top-level path (no ownership nesting in URLs except the immutable
  # CriticalCharacteristic sub-resource), and cross-references are FK fields validated on write.

  state_machine_shape: parallel
  # ProductionRun carries two independent state axes on one row (process_status x quality_status);
  # QualificationSubmission is cyclic (REVISION_REQUESTED -> SUBMITTED, round_no increments);
  # SpringDesign is branching-with-revert (ENG_REVIEW -> {PROTOTYPE_RELEASED, REJECTED}, both revert to
  # DRAFT through a revision); ShipmentLot is cyclic through QUARANTINED -> ALLOCATED.

  relationship_patterns:
    - one_to_many        # CustomerProgram -> SpringDesign, SpringDesign -> ToolingAsset
    - many_to_many       # ProductionRun bridges MachineSetup x WireLot; InspectionRecord bridges Run x Characteristic
    - cross_aggregate    # ShipmentLot mutates CustomerProgram and ToolingAsset ledgers across aggregate boundaries

  role_model: segregation_of_duties
  # DesignEngineer authors a design but may never review it; the QualityInspector who measured a
  # first-article record may never disposition it. Beyond the two segregation gates the roles are
  # peer-scoped: each role owns a disjoint slice of the shop-floor surface, and PlantAdmin is NOT a
  # superset (it owns machines, ovens and the logical clock only).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================================
# 1.1 Entity-Relationship Table
# =====================================================================================
entities:
  - name: CustomerProgram
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: Customer-facing program identifier, unique across all programs
        constraints: "unique; 3-40 chars"
      - name: customer_name
        type: string
        source: input
        description: Buying organisation name
      - name: application_class
        type: enum
        source: input
        description: Application category that drives fatigue criterion, packaging rules and PPAP depth
        constraints: "AUTOMOTIVE_SAFETY | AUTOMOTIVE_NON_SAFETY | MEDICAL_IMPLANT | MEDICAL_DEVICE | INDUSTRIAL"
      - name: ppap_level
        type: integer
        source: input
        description: Production Part Approval Process submission level demanded by the customer
        constraints: "1..5"
      - name: committed_pieces
        type: integer
        source: input
        description: Total pieces the customer has committed to over the program life
        constraints: "> 0"
      - name: minimum_order_quantity
        type: integer
        source: input
        description: Smallest shippable lot size accepted by this program
        constraints: "> 0"
      - name: required_salt_spray_hours
        type: integer
        source: input
        description: Minimum coating salt-spray endurance the selected MaterialSpec must meet
        default: 0
        constraints: ">= 0"
      - name: biocompatibility_required
        type: boolean
        source: input
        description: When true the selected MaterialSpec must be biocompatible
        default: false
      - name: min_fatigue_margin
        type: number
        source: input
        description: Fatigue margin floor a SpringDesign must reach to leave ENG_REVIEW for this program
        default: 1.000
      - name: required_ppk
        type: number
        source: input
        description: Long-run Ppk floor every safety-critical characteristic must reach before a lot may be allocated
        default: 1.000
      - name: amortization_method
        type: enum
        source: input
        description: Selects which variant of tooling_amortization_recovery runs when a lot ships
        constraints: "FORECAST_BASIS | ACTUAL_BASIS"
      - name: open_commitment_pieces
        type: integer
        source: computed
        description: Pieces still un-allocated against the commitment; initialised to committed_pieces
      - name: allocated_pieces
        type: integer
        source: computed
        description: Sum of piece_count over ShipmentLot rows of this program with lot_status IN {ALLOCATED, PACKED}
        default: 0
      - name: shipped_pieces
        type: integer
        source: computed
        description: Sum of piece_count over ShipmentLot rows of this program with lot_status == SHIPPED
        default: 0
      - name: quarantined_lot_count
        type: integer
        source: computed
        description: Count of ShipmentLot rows of this program with lot_status == QUARANTINED
        default: 0
      - name: delivery_posture
        type: enum
        source: computed
        description: Derived gate over the whole program; recomputed by calculations.program_delivery_posture
        default: BLOCKED
        constraints: "BLOCKED | AT_RISK | ON_TRACK"
      - name: quoted_qty
        type: integer
        source: computed
        description: Quantity the frozen quote was priced at; null until the first quote call
      - name: quoted_pre_discount_subtotal_cents
        type: integer
        source: computed
        description: Step-4 tier key of calculations.program_quote_pricing; null until the first quote call
      - name: quoted_volume_discount_pct
        type: number
        source: computed
        description: Volume discount tier selected from quoted_pre_discount_subtotal_cents
      - name: quoted_tooling_amort_per_piece_cents
        type: integer
        source: computed
        description: Capped per-piece tooling amortization folded into the quoted unit price
      - name: quoted_unit_price_cents
        type: integer
        source: computed
        description: Whole-cent unit price snapshotted onto every ShipmentLot created afterwards
      - name: quoted_total_cents
        type: integer
        source: computed
        description: quoted_unit_price_cents * quoted_qty + SETUP_FEE_CENTS
      - name: quote_frozen
        type: boolean
        source: computed
        description: Set true when the program's design reaches PRODUCTION_RELEASED; blocks re-quoting
        default: false

  - name: MaterialSpec
    parent: null
    common_fields: false
    fields:
      - name: spec_code
        type: string
        source: input
        description: Material specification identifier, unique
        constraints: "unique"
      - name: wire_material
        type: enum
        source: input
        description: Base wire alloy family
        constraints: "MUSIC_WIRE_ASTM_A228 | CHROME_SILICON_A401 | STAINLESS_302_A313 | ELGILOY_AMS5876 | TITANIUM_GR5"
      - name: tensile_grade_mpa
        type: number
        source: input
        description: Minimum ultimate tensile strength of the grade, in MPa
        constraints: "> 0"
      - name: shear_modulus_gpa
        type: number
        source: input
        description: Shear modulus G used by the spring-rate formula, in GPa
        constraints: "> 0"
      - name: elastic_modulus_gpa
        type: number
        source: input
        description: Young's modulus E, in GPa (torsion forms)
        constraints: "> 0"
      - name: density_kg_per_m3
        type: number
        source: input
        description: Density used by the wire-mass formula
        constraints: "> 0"
      - name: coating
        type: enum
        source: input
        description: Applied corrosion coating
        constraints: "NONE | ZINC_PHOSPHATE | PASSIVATED | ELECTROPOLISHED | PTFE"
      - name: salt_spray_hours
        type: integer
        source: input
        description: Salt-spray endurance of the coating in hours
        constraints: ">= 0"
      - name: biocompatible
        type: boolean
        source: input
        description: True when the grade plus coating is qualified for implant/device contact
        default: false
      - name: cost_per_kg_cents
        type: integer
        source: input
        description: Purchased wire cost in cents per kilogram
        constraints: "> 0"

  - name: SpringDesign
    parent: CustomerProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CustomerProgram.id; the program this part is designed for
      - name: material_spec_id
        type: string
        source: input
        description: FK -> MaterialSpec.id; selected wire material, tensile grade and coating
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number
      - name: form_type
        type: enum
        source: input
        description: Wire form family
        constraints: "COMPRESSION | EXTENSION | TORSION"
      - name: end_type
        type: enum
        source: input
        description: End configuration; drives TAIL_LENGTH_MM and tangle risk
        constraints: "CLOSED_GROUND | CLOSED_UNGROUND | OPEN | HOOK_EXTENSION | TORSION_LEG"
      - name: wire_diameter_mm
        type: number
        source: input
        description: Wire diameter d in millimetres
        constraints: "> 0"
      - name: outer_diameter_mm
        type: number
        source: input
        description: Coil outer diameter OD in millimetres
        constraints: "> wire_diameter_mm"
      - name: free_length_mm
        type: number
        source: input
        description: Free length in millimetres
        constraints: "> 0"
      - name: active_coils
        type: number
        source: input
        description: Active coil count Na
        constraints: ">= 1"
      - name: max_working_load_n
        type: number
        source: input
        description: Maximum working load in newtons used for peak stress
        constraints: "> 0"
      - name: min_working_load_n
        type: number
        source: input
        description: Minimum working load in newtons used for the alternating/mean split
        constraints: ">= 0 and < max_working_load_n"
      - name: cycle_seconds_per_piece
        type: number
        source: input
        description: Coiling cycle time per piece, drives the labour term of the quote
        constraints: "> 0"
      - name: shot_peening_required
        type: boolean
        source: input
        description: When true the endurance limit uses SSE_PEENED_FACTOR and heat-treat batches must peen
        default: false
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignEngineer who created or last revised the design
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the EngineeringManager who last decided the ENG_REVIEW; null before review
      - name: current_revision_no
        type: integer
        source: computed
        description: Revision counter; starts at 1 and increments on every accepted revision
        default: 1
      - name: superseded_revision_no
        type: integer
        source: computed
        description: Revision number the latest revision replaced; null before the first revision
      - name: spring_rate_n_per_mm
        type: number
        source: computed
        description: Output of calculations.spring_rate; 3 decimal places
      - name: shear_stress_max_mpa
        type: number
        source: computed
        description: Wahl-corrected shear stress at max_working_load_n; 2 decimal places
      - name: shear_stress_min_mpa
        type: number
        source: computed
        description: Wahl-corrected shear stress at min_working_load_n; 2 decimal places
      - name: stress_amplitude_mpa
        type: number
        source: computed
        description: (shear_stress_max_mpa - shear_stress_min_mpa) / 2, 2 decimal places
      - name: mean_stress_mpa
        type: number
        source: computed
        description: (shear_stress_max_mpa + shear_stress_min_mpa) / 2, 2 decimal places
      - name: fatigue_criterion
        type: enum
        source: computed
        description: Variant selector resolved from the program's application_class
        constraints: "GOODMAN | SODERBERG"
      - name: fatigue_margin_ratio
        type: number
        source: computed
        description: Output of calculations.fatigue_margin_ratio under fatigue_criterion; 3 decimal places
      - name: predicted_fatigue_life_cycles
        type: integer
        source: computed
        description: Tiered output of calculations.predicted_fatigue_life
      - name: wire_mass_per_piece_kg
        type: number
        source: computed
        description: Output of calculations.wire_mass_per_piece; exactly 6 decimal places
      - name: tangle_risk_index
        type: number
        source: computed
        description: round(free_length_mm / outer_diameter_mm, 3)
      - name: tangle_risk_class
        type: enum
        source: computed
        description: HIGH when tangle_risk_index >= 4.000 or end_type == HOOK_EXTENSION, else LOW
        constraints: "LOW | HIGH"
      - name: release_status
        type: enum
        source: computed
        description: Lifecycle state of the design; see state_machines.SpringDesign
        default: DRAFT
        constraints: "DRAFT | ENG_REVIEW | PROTOTYPE_RELEASED | PRODUCTION_RELEASED | REJECTED | OBSOLETE"

  - name: CriticalCharacteristic
    parent: SpringDesign
    common_fields: false
    fields:
      - name: design_id
        type: string
        source: input
        description: FK -> SpringDesign.id; the design this characteristic belongs to
      - name: char_code
        type: enum
        source: input
        description: Which measured characteristic this is; unique per design
        constraints: "FREE_LENGTH | SPRING_RATE | OUTER_DIAMETER | COIL_COUNT | HOOK_POSITION | LOAD_AT_HEIGHT"
      - name: nominal_value
        type: number
        source: input
        description: Print nominal for the characteristic
      - name: lsl
        type: number
        source: input
        description: Lower specification limit
        constraints: "< nominal_value"
      - name: usl
        type: number
        source: input
        description: Upper specification limit
        constraints: "> nominal_value"
      - name: is_safety_critical
        type: boolean
        source: input
        description: When true an out-of-control subgroup escalates the whole run to SPC_HOLD
        default: false
      - name: cpk_floor
        type: number
        source: input
        description: Short-run Cpk floor for this characteristic; compared with >=
        default: 1.333

  - name: ToolingAsset
    parent: SpringDesign
    common_fields: true
    fields:
      - name: design_id
        type: string
        source: input
        description: FK -> SpringDesign.id; the design this coiling tooling set was cut for
      - name: tool_code
        type: string
        source: input
        description: Tool room identifier, unique
        constraints: "unique"
      - name: original_cost_cents
        type: integer
        source: input
        description: Capitalised tool cost in cents; the conserved quantity of the amortization ledger
        constraints: "> 0"
      - name: amortization_status
        type: enum
        source: computed
        description: Ledger state of the tool; see state_machines.ToolingAsset
        default: PENDING
        constraints: "PENDING | AMORTIZING | FULLY_AMORTIZED | WRITTEN_OFF"
      - name: amortization_basis_pieces
        type: integer
        source: computed
        description: Piece basis frozen from CustomerProgram.committed_pieces when the design reaches PRODUCTION_RELEASED
      - name: amort_per_piece_cents
        type: integer
        source: computed
        description: ceil(original_cost_cents / amortization_basis_pieces), frozen at the same moment
      - name: recovered_cents
        type: integer
        source: computed
        description: Cumulative cents recovered through shipped lots
        default: 0
      - name: unamortized_cents
        type: integer
        source: computed
        description: original_cost_cents - recovered_cents; initialised to original_cost_cents

  - name: WireLot
    parent: null
    common_fields: true
    fields:
      - name: material_spec_id
        type: string
        source: input
        description: FK -> MaterialSpec.id; the grade this heat was purchased against
      - name: heat_number
        type: string
        source: input
        description: Mill heat number, unique
        constraints: "unique"
      - name: received_kg
        type: number
        source: input
        description: Kilograms received; the conserved quantity of the wire ledger, 3 decimal places
        constraints: "> 0"
      - name: tensile_test_mpa
        type: number
        source: system
        description: Measured tensile strength recorded at certification; null while UNCERTIFIED
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who certified or rejected the heat
      - name: certification_status
        type: enum
        source: computed
        description: See state_machines.WireLot
        default: UNCERTIFIED
        constraints: "UNCERTIFIED | CERTIFIED | REJECTED"
      - name: on_hand_kg
        type: number
        source: computed
        description: Unreserved kilograms still in the rack; initialised to received_kg, 3 decimal places
      - name: reserved_kg
        type: number
        source: computed
        description: Kilograms reserved by non-terminal ProductionRun rows, 3 decimal places
        default: 0.000
      - name: consumed_kg
        type: number
        source: computed
        description: Kilograms consumed by completed runs (good plus scrap), 3 decimal places
        default: 0.000

  - name: CoilingMachine
    parent: null
    common_fields: true
    fields:
      - name: machine_code
        type: string
        source: input
        description: CNC coiler identifier, unique
        constraints: "unique"
      - name: max_wire_diameter_mm
        type: number
        source: input
        description: Largest wire diameter the coiler can form
        constraints: "> 0"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Minutes of tooling changeover that must separate two setup windows on this machine
        constraints: ">= 0"
      - name: machine_state
        type: enum
        source: computed
        description: See state_machines.CoilingMachine
        default: IDLE
        constraints: "IDLE | SETUP | PRODUCTION"
      - name: active_setup_id
        type: string
        source: computed
        description: >-
          Denormalised pointer to the id of the MachineSetup currently ACTIVE on this machine, resolved as
          the single MachineSetup row with machine_id == CoilingMachine.id and setup_status == ACTIVE;
          null when no such row exists. Not a foreign key input.

  - name: MachineSetup
    parent: null
    common_fields: true
    fields:
      - name: machine_id
        type: string
        source: input
        description: FK -> CoilingMachine.id; the coiler this setup occupies
      - name: design_id
        type: string
        source: input
        description: FK -> SpringDesign.id; the design being set up
      - name: tooling_asset_id
        type: string
        source: input
        description: FK -> ToolingAsset.id; the tool set mounted for this setup
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the machine occupation window, ISO 8601 UTC
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the machine occupation window, ISO 8601 UTC
        constraints: "> window_start"
      - name: set_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProcessTechnician who scheduled the setup
      - name: setup_status
        type: enum
        source: computed
        description: See state_machines.MachineSetup
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | RELEASED | SUPERSEDED | ABORTED"
      - name: superseded_by_setup_id
        type: string
        source: computed
        description: >-
          Denormalised pointer to the id of the MachineSetup row whose creation superseded this one
          (same machine_id and same design_id, created later); null unless setup_status == SUPERSEDED.
          Not a foreign key input.

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: setup_id
        type: string
        source: input
        description: FK -> MachineSetup.id; the ACTIVE setup this run coils under
      - name: wire_lot_id
        type: string
        source: input
        description: FK -> WireLot.id; the certified heat this run draws wire from
      - name: design_id
        type: string
        source: input
        description: FK -> SpringDesign.id; must equal MachineSetup.design_id of setup_id
      - name: planned_pieces
        type: integer
        source: input
        description: Pieces the run is scheduled to coil; drives the wire reservation
        constraints: "> 0"
      - name: produced_pieces
        type: integer
        source: computed
        description: Good pieces recorded at completion
        default: 0
      - name: scrapped_pieces
        type: integer
        source: computed
        description: Scrap pieces recorded at completion
        default: 0
      - name: wire_reserved_kg
        type: number
        source: computed
        description: Kilograms reserved on the wire lot at creation, 3 decimal places; released verbatim on cancel
      - name: wire_consumed_kg
        type: number
        source: computed
        description: Kilograms actually consumed at completion, 3 decimal places
        default: 0.000
      - name: process_status
        type: enum
        source: computed
        description: Manufacturing axis of the run; see state_machines.ProductionRun
        default: FAI_PENDING
        constraints: "FAI_PENDING | RUNNING | COMPLETE | CANCELLED"
      - name: quality_status
        type: enum
        source: computed
        description: Quality axis of the run, independent of process_status
        default: OPEN
        constraints: "OPEN | SPC_HOLD | DISPOSITIONED_ACCEPT | SCRAPPED"
      - name: fai_disposition
        type: enum
        source: computed
        description: First-article verdict recorded by a second inspector
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED"
      - name: min_cpk_observed
        type: number
        source: computed
        description: Lowest cpk_value across all InspectionRecord rows of this run; null before the first record
      - name: min_ppk_observed
        type: number
        source: computed
        description: Lowest ppk_value across safety-critical characteristics of this run; null before the first SPC record
      - name: heat_treat_state
        type: enum
        source: computed
        description: Derived from this run's HeatTreatBatch rows
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_PROCESS | COMPLETE"
      - name: peening_verified
        type: boolean
        source: computed
        description: True once a COMPLETE HeatTreatBatch of this run recorded peening_performed == true
        default: false

  - name: InspectionRecord
    parent: ProductionRun
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; the run this subgroup was drawn from
      - name: characteristic_id
        type: string
        source: input
        description: FK -> CriticalCharacteristic.id; the characteristic measured
      - name: record_kind
        type: enum
        source: system
        description: >-
          Stamped from the endpoint that created the row: FAI by POST /production-runs/{id}/fai,
          SPC by POST /production-runs/{id}/inspections. Never accepted from the request body.
        constraints: "FAI | SPC"
      - name: measurements
        type: array
        source: input
        description: Measured values of the subgroup, in measurement order
        constraints: "array of number; length >= SPC_MIN_SUBGROUP_SIZE"
      - name: subgroup_size
        type: integer
        source: computed
        description: Length of measurements
      - name: mean_value
        type: number
        source: computed
        description: Arithmetic mean of measurements, 4 decimal places
      - name: sigma_value
        type: number
        source: computed
        description: Bessel-corrected sample standard deviation of measurements, 6 decimal places
      - name: cpk_value
        type: number
        source: computed
        description: Short-run capability of this subgroup, 3 decimal places
      - name: ppk_value
        type: number
        source: computed
        description: Pooled long-run capability over this run and characteristic; null on FAI records
      - name: control_state
        type: enum
        source: computed
        description: OUT_OF_CONTROL when cpk_value < characteristic.cpk_floor or any measurement is outside [lsl, usl]
        constraints: "IN_CONTROL | OUT_OF_CONTROL"
      - name: inspected_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who recorded the subgroup

  - name: StressReliefOven
    parent: null
    common_fields: true
    fields:
      - name: oven_code
        type: string
        source: input
        description: Oven identifier, unique
        constraints: "unique"
      - name: capacity_kg
        type: number
        source: input
        description: Maximum aggregate load in kilograms co-resident in the oven at any instant
        constraints: "> 0"
      - name: max_temp_c
        type: number
        source: input
        description: Maximum stress-relief temperature the oven holds
        constraints: "> 0"
      - name: scheduled_load_kg
        type: number
        source: computed
        description: Sum of load_kg over this oven's HeatTreatBatch rows with batch_status IN {SCHEDULED, RUNNING}
        default: 0.000

  - name: HeatTreatBatch
    parent: null
    common_fields: true
    fields:
      - name: oven_id
        type: string
        source: input
        description: FK -> StressReliefOven.id; the oven this batch occupies
      - name: run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; the run whose pieces are being stress relieved
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the oven occupation window, ISO 8601 UTC
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the oven occupation window, ISO 8601 UTC
        constraints: "> window_start"
      - name: load_kg
        type: number
        source: input
        description: Weighed basket load in kilograms, 3 decimal places
        constraints: "> 0"
      - name: target_temp_c
        type: number
        source: input
        description: Soak temperature requested, must not exceed oven.max_temp_c
        constraints: "> 0"
      - name: peening_requested
        type: boolean
        source: input
        description: Whether shot peening is part of this batch's recipe
        default: false
      - name: peening_performed
        type: boolean
        source: system
        description: Whether peening actually happened, recorded at completion; null while not COMPLETE
      - name: batch_status
        type: enum
        source: computed
        description: See state_machines.HeatTreatBatch
        default: SCHEDULED
        constraints: "SCHEDULED | RUNNING | COMPLETE | CANCELLED"

  - name: QualificationSubmission
    parent: CustomerProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> CustomerProgram.id; the program being qualified
      - name: design_id
        type: string
        source: input
        description: FK -> SpringDesign.id; the design the PPAP package covers
      - name: ppap_level
        type: integer
        source: input
        description: Submission level; must equal the program's ppap_level
        constraints: "1..5"
      - name: round_no
        type: integer
        source: computed
        description: Submission round; starts at 1, increments on every resubmit
        default: 1
      - name: submission_status
        type: enum
        source: computed
        description: See state_machines.QualificationSubmission
        default: SUBMITTED
        constraints: "SUBMITTED | INTERIM_APPROVED | REVISION_REQUESTED | APPROVED | REJECTED_FINAL"
      - name: interim_piece_cap
        type: integer
        source: computed
        description: Piece ceiling attached to an INTERIM_APPROVED verdict; null in every other status
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramManager who submitted or resubmitted the package
      - name: reviewed_by_program_id
        type: string
        source: system
        description: X-User-ID of the CustomerRepresentative who decided the round; equals program_id
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest customer verdict; null before the first verdict

  - name: ShipmentLot
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; the run the pieces came from
      - name: program_id
        type: string
        source: input
        description: FK -> CustomerProgram.id; the program being shipped against
      - name: piece_count
        type: integer
        source: input
        description: Pieces in the lot; compared against minimum_order_quantity with >=
        constraints: "> 0"
      - name: packaging_method
        type: enum
        source: system
        description: Packaging recorded at pack time; null while ALLOCATED
        constraints: "BULK_BOX | BAG_AND_TAG | TANGLE_FREE_TRAY | INTERLEAVED_TUBE | CLEANROOM_DOUBLE_BAG"
      - name: lot_status
        type: enum
        source: computed
        description: See state_machines.ShipmentLot
        default: ALLOCATED
        constraints: "ALLOCATED | PACKED | SHIPPED | QUARANTINED | RETURNED"
      - name: unit_price_cents
        type: integer
        source: computed
        description: Snapshot of CustomerProgram.quoted_unit_price_cents taken at lot creation
      - name: tooling_amort_per_piece_cents
        type: integer
        source: computed
        description: Snapshot of CustomerProgram.quoted_tooling_amort_per_piece_cents taken at lot creation
      - name: extended_price_cents
        type: integer
        source: computed
        description: piece_count * unit_price_cents
      - name: tooling_recovery_cents
        type: integer
        source: computed
        description: Cents posted to ToolingAsset.recovered_cents when the lot shipped; reversed verbatim on return
        default: 0
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock instant the lot shipped; null before SHIPPED
      - name: quarantine_reason
        type: enum
        source: system
        description: Why the lot was quarantined; null unless it has ever been quarantined
        constraints: "SPC_HOLD_CASCADE | INSPECTOR_ACTION"

# =====================================================================================
# 1.2 State Machine Table
# =====================================================================================
state_machines:
  - entity: SpringDesign
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: "(none)"
        to: DRAFT
        trigger: "POST /spring-designs"
        actor: DesignEngineer
        preconditions:
          - "program_id resolves to a CustomerProgram"
          - "material_spec_id resolves to a MaterialSpec"
          - "material_spec.salt_spray_hours >= program.required_salt_spray_hours"
          - "program.biocompatibility_required == false OR material_spec.biocompatible == true"
          - "min_working_load_n < max_working_load_n and outer_diameter_mm > wire_diameter_mm"
        side_effects:
          - "sets created_by_user_id from X-User-ID"
          - "computes spring_rate_n_per_mm (calculations.spring_rate)"
          - "computes shear_stress_max_mpa, shear_stress_min_mpa, stress_amplitude_mpa, mean_stress_mpa (calculations.corrected_shear_stress)"
          - "resolves fatigue_criterion from program.application_class, then computes fatigue_margin_ratio (calculations.fatigue_margin_ratio)"
          - "computes predicted_fatigue_life_cycles (calculations.predicted_fatigue_life)"
          - "computes wire_mass_per_piece_kg (calculations.wire_mass_per_piece)"
          - "computes tangle_risk_index and tangle_risk_class"
          - "current_revision_no = 1; release_status = DRAFT"
      - from: DRAFT
        to: ENG_REVIEW
        trigger: "POST /spring-designs/{id}/submit-for-review"
        actor: DesignEngineer
        preconditions:
          - "release_status == DRAFT"
          - "count of CriticalCharacteristic rows with design_id == this design >= 1"
        side_effects:
          - "release_status = ENG_REVIEW"
      - from: ENG_REVIEW
        to: PROTOTYPE_RELEASED
        trigger: "POST /spring-designs/{id}/review with decision == APPROVE_PROTOTYPE"
        actor: EngineeringManager
        preconditions:
          - "release_status == ENG_REVIEW"
          - "X-User-ID != created_by_user_id (segregation of duties)"
          - "fatigue_margin_ratio >= program.min_fatigue_margin"
        side_effects:
          - "release_status = PROTOTYPE_RELEASED; reviewed_by_user_id = X-User-ID"
          - "recomputes CustomerProgram.delivery_posture (calculations.program_delivery_posture)"
      - from: ENG_REVIEW
        to: REJECTED
        trigger: "POST /spring-designs/{id}/review with decision == REJECT"
        actor: EngineeringManager
        preconditions:
          - "release_status == ENG_REVIEW"
          - "X-User-ID != created_by_user_id (segregation of duties)"
        side_effects:
          - "release_status = REJECTED; reviewed_by_user_id = X-User-ID"
        note: "REJECT is accepted even when fatigue_margin_ratio is above the program floor."
      - from: REJECTED
        to: DRAFT
        trigger: "POST /spring-designs/{id}/revisions"
        actor: DesignEngineer
        preconditions:
          - "release_status IN {DRAFT, ENG_REVIEW, REJECTED, PROTOTYPE_RELEASED}"
          - "expected_design_version == version (concurrency_rules.design-revision-stale-design)"
        side_effects:
          - "superseded_revision_no = current_revision_no; current_revision_no += 1"
          - "re-runs every computed engineering field of calculations.spring_rate, corrected_shear_stress, fatigue_margin_ratio, predicted_fatigue_life, wire_mass_per_piece"
          - "release_status = DRAFT; reviewed_by_user_id = null; created_by_user_id = X-User-ID"
      - from: PROTOTYPE_RELEASED
        to: DRAFT
        trigger: "POST /spring-designs/{id}/revisions"
        actor: DesignEngineer
        preconditions:
          - "release_status == PROTOTYPE_RELEASED"
          - "no QualificationSubmission with design_id == this design has submission_status == APPROVED"
          - "expected_design_version == version"
        side_effects:
          - "same recompute and revision bookkeeping as the REJECTED -> DRAFT transition"
          - "every MachineSetup with design_id == this design and setup_status == SCHEDULED transitions to ABORTED, which in turn returns each such setup's CoilingMachine to machine_state IDLE"
        note: "Cyclic edge: a released prototype can be pulled back to DRAFT for another engineering loop."
      - from: PROTOTYPE_RELEASED
        to: PRODUCTION_RELEASED
        trigger: "system event: QualificationSubmission for this design reaches APPROVED"
        actor: system
        preconditions:
          - "release_status == PROTOTYPE_RELEASED"
        side_effects:
          - "release_status = PRODUCTION_RELEASED (cascade hop 2 of transitive_cascade.ppap_approval_release_chain)"
          - "because the design became PRODUCTION_RELEASED, every ToolingAsset with design_id == this design and amortization_status == PENDING transitions to AMORTIZING, freezing amortization_basis_pieces = program.committed_pieces and amort_per_piece_cents = ceil(original_cost_cents / amortization_basis_pieces) (cascade hop 3)"
          - "because the tooling began amortizing, CustomerProgram.quote_frozen = true and CustomerProgram.delivery_posture is recomputed (cascade hop 4)"
      - from: PROTOTYPE_RELEASED
        to: REJECTED
        trigger: "system event: QualificationSubmission for this design reaches REJECTED_FINAL"
        actor: system
        preconditions:
          - "release_status == PROTOTYPE_RELEASED"
        side_effects:
          - "release_status = REJECTED"
          - "because the design was rejected, CustomerProgram.delivery_posture is recomputed to BLOCKED"
      - from: PRODUCTION_RELEASED
        to: OBSOLETE
        trigger: "POST /spring-designs/{id}/obsolete"
        actor: EngineeringManager
        preconditions:
          - "release_status IN {PROTOTYPE_RELEASED, REJECTED, PRODUCTION_RELEASED}"
          - "no ProductionRun with design_id == this design has process_status IN {FAI_PENDING, RUNNING}"
        side_effects:
          - "release_status = OBSOLETE"
          - "because the design became OBSOLETE, every ToolingAsset with design_id == this design and amortization_status IN {PENDING, AMORTIZING} transitions to WRITTEN_OFF (unamortized_cents and recovered_cents are left untouched)"
          - "because the tooling was written off, CustomerProgram.delivery_posture is recomputed to BLOCKED"
      - from: REJECTED
        to: OBSOLETE
        trigger: "POST /spring-designs/{id}/obsolete"
        actor: EngineeringManager
        preconditions:
          - "release_status IN {PROTOTYPE_RELEASED, REJECTED, PRODUCTION_RELEASED}"
        side_effects:
          - "same as the PRODUCTION_RELEASED -> OBSOLETE transition"
      - from: PROTOTYPE_RELEASED
        to: OBSOLETE
        trigger: "POST /spring-designs/{id}/obsolete"
        actor: EngineeringManager
        preconditions:
          - "release_status IN {PROTOTYPE_RELEASED, REJECTED, PRODUCTION_RELEASED}"
          - "no ProductionRun with design_id == this design has process_status IN {FAI_PENDING, RUNNING}"
        side_effects:
          - "same as the PRODUCTION_RELEASED -> OBSOLETE transition; a prototype whose tooling is still PENDING writes that tooling off from PENDING rather than from AMORTIZING"
        note: "A prototype can be abandoned before its PPAP package is ever granted; this is the third and last edge into OBSOLETE."

  - entity: WireLot
    initial_state: UNCERTIFIED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: "(none)"
        to: UNCERTIFIED
        trigger: "POST /wire-lots"
        actor: QualityInspector
        preconditions:
          - "material_spec_id resolves to a MaterialSpec"
          - "received_kg > 0"
        side_effects:
          - "on_hand_kg = received_kg; reserved_kg = 0.000; consumed_kg = 0.000"
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /wire-lots/{id}/certify with tensile_test_mpa >= material_spec.tensile_grade_mpa"
        actor: QualityInspector
        preconditions:
          - "certification_status == UNCERTIFIED"
        side_effects:
          - "certification_status = CERTIFIED; tensile_test_mpa and certified_by_user_id recorded"
      - from: UNCERTIFIED
        to: REJECTED
        trigger: "POST /wire-lots/{id}/certify with tensile_test_mpa < material_spec.tensile_grade_mpa"
        actor: QualityInspector
        preconditions:
          - "certification_status == UNCERTIFIED"
        side_effects:
          - "certification_status = REJECTED; tensile_test_mpa and certified_by_user_id recorded"
        note: "Branching verdict on one endpoint; the heat can never be re-tested."

  - entity: CoilingMachine
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: SETUP
        trigger: "POST /machine-setups/{id}/activate"
        actor: ProcessTechnician
        preconditions:
          - "machine_state == IDLE"
        side_effects:
          - "machine_state = SETUP; active_setup_id = the activated setup's id"
      - from: SETUP
        to: PRODUCTION
        trigger: "POST /production-runs"
        actor: ProcessTechnician
        preconditions:
          - "machine_state == SETUP"
        side_effects:
          - "machine_state = PRODUCTION"
      - from: PRODUCTION
        to: IDLE
        trigger: "POST /production-runs/{id}/complete or POST /production-runs/{id}/cancel"
        actor: system
        preconditions:
          - "machine_state == PRODUCTION"
        side_effects:
          - "machine_state = IDLE; active_setup_id = null"
      - from: SETUP
        to: IDLE
        trigger: "POST /machine-setups/{id}/abort"
        actor: ProcessTechnician
        preconditions:
          - "machine_state == SETUP"
        side_effects:
          - "machine_state = IDLE; active_setup_id = null"
        note: "Cyclic: IDLE -> SETUP -> PRODUCTION -> IDLE, with an early exit back to IDLE on abort."

  - entity: MachineSetup
    initial_state: SCHEDULED
    terminal_states: [RELEASED, SUPERSEDED, ABORTED]
    transitions:
      - from: "(none)"
        to: SCHEDULED
        trigger: "POST /machine-setups"
        actor: ProcessTechnician
        preconditions:
          - "design.release_status IN {PROTOTYPE_RELEASED, PRODUCTION_RELEASED}"
          - "tooling_asset.design_id == design_id"
          - "design.wire_diameter_mm <= machine.max_wire_diameter_mm"
          - "window_start >= current logical clock; window_end > window_start"
          - "no buffered overlap against SCHEDULED or ACTIVE setups on the same machine (validations priority 67)"
          - "expected_machine_version == machine.version (concurrency_rules.setup-create-stale-machine)"
        side_effects:
          - "set_by_user_id = X-User-ID; setup_status = SCHEDULED"
          - "increments CoilingMachine.version by 1"
          - "every other MachineSetup with the same machine_id and the same design_id and setup_status == SCHEDULED transitions to SUPERSEDED with superseded_by_setup_id = this setup's id"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /machine-setups/{id}/activate"
        actor: ProcessTechnician
        preconditions:
          - "setup_status == SCHEDULED"
          - "machine.machine_state == IDLE"
          - "current logical clock >= window_start and current logical clock < window_end"
        side_effects:
          - "setup_status = ACTIVE"
          - "because the setup became ACTIVE, its CoilingMachine transitions IDLE -> SETUP and machine.active_setup_id is set"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system event: a newer MachineSetup for the same machine_id and design_id is created"
        actor: system
        preconditions:
          - "setup_status == SCHEDULED"
        side_effects:
          - "setup_status = SUPERSEDED; superseded_by_setup_id set"
      - from: ACTIVE
        to: RELEASED
        trigger: "system event: the setup's ProductionRun reaches process_status COMPLETE"
        actor: system
        preconditions:
          - "setup_status == ACTIVE"
        side_effects:
          - "setup_status = RELEASED"
          - "because the setup was released, its CoilingMachine transitions PRODUCTION -> IDLE"
      - from: ACTIVE
        to: ABORTED
        trigger: "POST /machine-setups/{id}/abort or system event: the setup's ProductionRun reaches process_status CANCELLED"
        actor: ProcessTechnician
        preconditions:
          - "setup_status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "setup_status = ABORTED"
          - "because the setup was aborted, its CoilingMachine returns to machine_state IDLE with active_setup_id = null"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /machine-setups/{id}/abort"
        actor: ProcessTechnician
        preconditions:
          - "setup_status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "setup_status = ABORTED"

  - entity: ProductionRun
    initial_state: "FAI_PENDING x OPEN"
    terminal_states: ["COMPLETE x DISPOSITIONED_ACCEPT", "CANCELLED x SCRAPPED", CANCELLED]
    note: >-
      Two independent state axes on one row. process_status (FAI_PENDING -> RUNNING -> COMPLETE, with
      CANCELLED as an early exit) tracks manufacturing; quality_status (OPEN <-> SPC_HOLD, then
      DISPOSITIONED_ACCEPT or SCRAPPED) tracks conformance. A run may be COMPLETE while on SPC_HOLD, and
      may be on SPC_HOLD while still FAI_PENDING; neither axis gates the other's transitions except where
      a precondition says so explicitly.
    transitions:
      - from: "(none)"
        to: "FAI_PENDING x OPEN"
        trigger: "POST /production-runs"
        actor: ProcessTechnician
        preconditions:
          - "setup.setup_status == ACTIVE"
          - "wire_lot.certification_status == CERTIFIED"
          - "design.release_status IN {PROTOTYPE_RELEASED, PRODUCTION_RELEASED} (validations priority 41); a PROTOTYPE_RELEASED design may be run for first articles and prototype quantities before its PPAP package exists"
          - "design_id == setup.design_id"
          - "wire_lot.material_spec_id == design.material_spec_id"
          - "wire_lot.on_hand_kg >= calculations.wire_mass_required.required_kg for planned_pieces"
        side_effects:
          - "wire_reserved_kg = calculations.wire_mass_required.required_kg; WireLot.on_hand_kg -= wire_reserved_kg; WireLot.reserved_kg += wire_reserved_kg"
          - "because the run was created, its setup's CoilingMachine transitions SETUP -> PRODUCTION"
          - "process_status = FAI_PENDING; quality_status = OPEN; fai_disposition = PENDING"
      - from: "FAI_PENDING"
        to: "RUNNING"
        trigger: "POST /production-runs/{id}/fai-disposition with decision == ACCEPT"
        actor: QualityInspector
        preconditions:
          - "process_status == FAI_PENDING and fai_disposition == PENDING"
          - "for every CriticalCharacteristic of design_id there exists an InspectionRecord with record_kind == FAI on this run"
          - "count of CriticalCharacteristic rows for design_id >= 1"
          - "X-User-ID is not the inspected_by_user_id of any FAI record of this run (segregation of duties)"
        side_effects:
          - "fai_disposition = ACCEPTED; process_status = RUNNING"
      - from: "FAI_PENDING"
        to: "CANCELLED"
        trigger: "POST /production-runs/{id}/fai-disposition with decision == REJECT"
        actor: QualityInspector
        preconditions:
          - "same preconditions as the ACCEPT branch"
        side_effects:
          - "fai_disposition = REJECTED; process_status = CANCELLED (cascade hop 1 of transitive_cascade.fai_reject_release_chain)"
          - "because the run was cancelled, WireLot.reserved_kg -= wire_reserved_kg and WireLot.on_hand_kg += wire_reserved_kg using the stored wire_reserved_kg verbatim (cascade hop 2)"
          - "because the run was cancelled, its MachineSetup transitions ACTIVE -> ABORTED (cascade hop 3), which in turn returns the CoilingMachine to machine_state IDLE with active_setup_id = null (cascade hop 4)"
      - from: "RUNNING"
        to: "COMPLETE"
        trigger: "POST /production-runs/{id}/complete"
        actor: ProcessTechnician
        preconditions:
          - "process_status == RUNNING"
          - "quality_status != SPC_HOLD"
          - "produced_pieces + scrapped_pieces <= planned_pieces"
        side_effects:
          - "produced_pieces and scrapped_pieces recorded; wire_consumed_kg = calculations.wire_consumption_at_completion"
          - "WireLot.reserved_kg -= wire_reserved_kg; WireLot.consumed_kg += wire_consumed_kg; WireLot.on_hand_kg += (wire_reserved_kg - wire_consumed_kg)"
          - "because the run completed, its MachineSetup transitions ACTIVE -> RELEASED, which in turn returns the CoilingMachine to machine_state IDLE"
      - from: "FAI_PENDING or RUNNING"
        to: "CANCELLED"
        trigger: "POST /production-runs/{id}/cancel"
        actor: ProcessTechnician
        preconditions:
          - "process_status IN {FAI_PENDING, RUNNING}"
        side_effects:
          - "process_status = CANCELLED"
          - "because the run was cancelled, WireLot.reserved_kg -= wire_reserved_kg and WireLot.on_hand_kg += wire_reserved_kg using the stored wire_reserved_kg verbatim (compensating_invariant.wire_mass_conservation)"
          - "because the run was cancelled, its MachineSetup transitions ACTIVE -> ABORTED, which in turn returns the CoilingMachine to machine_state IDLE"
          - "every ShipmentLot with run_id == this run and lot_status IN {ALLOCATED, PACKED} transitions to QUARANTINED with quarantine_reason = SPC_HOLD_CASCADE"
      - from: "OPEN"
        to: "SPC_HOLD"
        trigger: "system event: POST /production-runs/{id}/inspections creates an InspectionRecord with control_state == OUT_OF_CONTROL on a characteristic with is_safety_critical == true"
        actor: system
        preconditions:
          - "quality_status == OPEN"
        side_effects:
          - "quality_status = SPC_HOLD (cascade hop 2 of transitive_cascade.spc_violation_quarantine_chain)"
          - "because the run went on SPC_HOLD, every ShipmentLot with run_id == this run and lot_status IN {ALLOCATED, PACKED} transitions to QUARANTINED with quarantine_reason = SPC_HOLD_CASCADE (cascade hop 3)"
          - "because those lots were quarantined, each lot's CustomerProgram gets open_commitment_pieces += lot.piece_count, quarantined_lot_count += 1, allocated_pieces -= lot.piece_count (cascade hop 4)"
          - "because quarantined_lot_count rose above zero, CustomerProgram.delivery_posture is recomputed by calculations.program_delivery_posture (cascade hop 5)"
      - from: "SPC_HOLD"
        to: "OPEN"
        trigger: "POST /production-runs/{id}/quality-disposition with decision == RELEASE"
        actor: QualityInspector
        preconditions:
          - "quality_status == SPC_HOLD"
          - "the newest InspectionRecord by created_at for every safety-critical characteristic of design_id has control_state == IN_CONTROL"
        side_effects:
          - "quality_status = OPEN"
          - "recomputes CustomerProgram.delivery_posture for every program that has a ShipmentLot on this run"
        note: "Cyclic edge on the quality axis: a run can be put on hold and released repeatedly."
      - from: "SPC_HOLD"
        to: "DISPOSITIONED_ACCEPT"
        trigger: "POST /production-runs/{id}/quality-disposition with decision == ACCEPT_AS_IS"
        actor: QualityInspector
        preconditions:
          - "quality_status == SPC_HOLD"
          - "no CriticalCharacteristic of design_id with is_safety_critical == true has an OUT_OF_CONTROL newest InspectionRecord by created_at"
        side_effects:
          - "quality_status = DISPOSITIONED_ACCEPT (terminal on the quality axis)"
          - "recomputes CustomerProgram.delivery_posture for every program that has a ShipmentLot on this run"
      - from: "SPC_HOLD"
        to: "SCRAPPED"
        trigger: "POST /production-runs/{id}/quality-disposition with decision == SCRAP"
        actor: QualityInspector
        preconditions:
          - "quality_status == SPC_HOLD"
        side_effects:
          - "quality_status = SCRAPPED"
          - "if process_status IN {FAI_PENDING, RUNNING} then process_status = CANCELLED, which releases the wire reservation and aborts the MachineSetup exactly as the cancel transition does"
          - "every ShipmentLot with run_id == this run and lot_status IN {ALLOCATED, PACKED} transitions to QUARANTINED with quarantine_reason = SPC_HOLD_CASCADE"

  - entity: HeatTreatBatch
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: "(none)"
        to: SCHEDULED
        trigger: "POST /heat-treat-batches"
        actor: ProcessTechnician
        preconditions:
          - "run.process_status IN {RUNNING, COMPLETE}"
          - "run.quality_status != SPC_HOLD"
          - "target_temp_c <= oven.max_temp_c"
          - "window_end > window_start and window_start >= current logical clock"
          - "aggregate load on the oven over the closed-interval intersection stays within capacity_kg (validations priority 71)"
        side_effects:
          - "batch_status = SCHEDULED; StressReliefOven.scheduled_load_kg += load_kg"
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /heat-treat-batches/{id}/start"
        actor: ProcessTechnician
        preconditions:
          - "batch_status == SCHEDULED"
          - "current logical clock >= window_start"
        side_effects:
          - "batch_status = RUNNING"
          - "because the batch started, ProductionRun.heat_treat_state = IN_PROCESS"
      - from: RUNNING
        to: COMPLETE
        trigger: "POST /heat-treat-batches/{id}/complete"
        actor: ProcessTechnician
        preconditions:
          - "batch_status == RUNNING"
        side_effects:
          - "peening_performed recorded from the request body; batch_status = COMPLETE; StressReliefOven.scheduled_load_kg -= load_kg"
          - "because the batch completed, ProductionRun.heat_treat_state = COMPLETE and ProductionRun.peening_verified = peening_performed"
          - "if design.shot_peening_required == true and peening_performed == false then the run's quality_status transitions OPEN -> SPC_HOLD, which cascades to quarantine that run's ALLOCATED/PACKED lots and recompute each affected CustomerProgram.delivery_posture"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /heat-treat-batches/{id}/cancel"
        actor: ProcessTechnician
        preconditions:
          - "batch_status == SCHEDULED"
        side_effects:
          - "batch_status = CANCELLED; StressReliefOven.scheduled_load_kg -= load_kg"
          - "because the load left the schedule, the oven interval it occupied stops counting toward capacity for later batch creations"

  - entity: QualificationSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED_FINAL]
    transitions:
      - from: "(none)"
        to: SUBMITTED
        trigger: "POST /qualification-submissions"
        actor: ProgramManager
        preconditions:
          - "design.release_status == PROTOTYPE_RELEASED"
          - "design.program_id == program_id"
          - "ppap_level == program.ppap_level"
          - "no QualificationSubmission for the same (program_id, design_id) has submission_status IN {SUBMITTED, INTERIM_APPROVED, REVISION_REQUESTED}"
          - "there exists a ProductionRun with design_id == design_id and fai_disposition == ACCEPTED"
        side_effects:
          - "round_no = 1; submission_status = SUBMITTED; submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /qualification-submissions/{id}/review with decision == APPROVE"
        actor: CustomerRepresentative
        preconditions:
          - "submission_status == SUBMITTED"
          - "X-User-ID == program_id (ownership)"
        side_effects:
          - "submission_status = APPROVED; decided_at = current logical clock; reviewed_by_program_id = X-User-ID (cascade hop 1 of transitive_cascade.ppap_approval_release_chain)"
          - "because the submission was approved, SpringDesign transitions PROTOTYPE_RELEASED -> PRODUCTION_RELEASED (hop 2), which promotes the design's ToolingAsset PENDING -> AMORTIZING (hop 3), which in turn freezes CustomerProgram.quote_frozen = true and recomputes delivery_posture (hop 4)"
      - from: SUBMITTED
        to: INTERIM_APPROVED
        trigger: "POST /qualification-submissions/{id}/review with decision == INTERIM_APPROVE"
        actor: CustomerRepresentative
        preconditions:
          - "submission_status == SUBMITTED"
          - "X-User-ID == program_id (ownership)"
          - "interim_piece_cap present in the request body and > 0"
        side_effects:
          - "submission_status = INTERIM_APPROVED; interim_piece_cap recorded; decided_at set"
          - "recomputes CustomerProgram.delivery_posture"
        note: "Interim approval unlocks shipping but caps cumulative allocated + shipped pieces."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /qualification-submissions/{id}/review with decision == REQUEST_REVISION"
        actor: CustomerRepresentative
        preconditions:
          - "submission_status == SUBMITTED"
          - "X-User-ID == program_id (ownership)"
        side_effects:
          - "submission_status = REVISION_REQUESTED; decided_at set"
      - from: SUBMITTED
        to: REJECTED_FINAL
        trigger: "POST /qualification-submissions/{id}/review with decision == REJECT_FINAL"
        actor: CustomerRepresentative
        preconditions:
          - "submission_status == SUBMITTED"
          - "X-User-ID == program_id (ownership)"
        side_effects:
          - "submission_status = REJECTED_FINAL; decided_at set"
          - "because the submission was finally rejected, SpringDesign transitions PROTOTYPE_RELEASED -> REJECTED, which recomputes CustomerProgram.delivery_posture to BLOCKED"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /qualification-submissions/{id}/resubmit"
        actor: ProgramManager
        preconditions:
          - "submission_status IN {REVISION_REQUESTED, INTERIM_APPROVED}"
          - "round_no < MAX_SUBMISSION_ROUNDS"
          - "design.release_status == PROTOTYPE_RELEASED"
        side_effects:
          - "round_no += 1; submission_status = SUBMITTED; interim_piece_cap = null; submitted_by_user_id = X-User-ID"
        note: "Cyclic: REVISION_REQUESTED -> SUBMITTED -> REVISION_REQUESTED, bounded by MAX_SUBMISSION_ROUNDS."
      - from: INTERIM_APPROVED
        to: SUBMITTED
        trigger: "POST /qualification-submissions/{id}/resubmit"
        actor: ProgramManager
        preconditions:
          - "submission_status IN {REVISION_REQUESTED, INTERIM_APPROVED}"
          - "round_no < MAX_SUBMISSION_ROUNDS"
        side_effects:
          - "round_no += 1; submission_status = SUBMITTED; interim_piece_cap = null"
          - "recomputes CustomerProgram.delivery_posture, which returns to BLOCKED while no verdict is in force"

  - entity: ToolingAsset
    initial_state: PENDING
    terminal_states: [FULLY_AMORTIZED, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: AMORTIZING
        trigger: "system event: the tool's SpringDesign reaches PRODUCTION_RELEASED"
        actor: system
        preconditions:
          - "amortization_status == PENDING"
        side_effects:
          - "amortization_basis_pieces = CustomerProgram.committed_pieces; amort_per_piece_cents = ceil(original_cost_cents / amortization_basis_pieces)"
      - from: AMORTIZING
        to: FULLY_AMORTIZED
        trigger: "system event: a ShipmentLot ship posting drives unamortized_cents to 0"
        actor: system
        preconditions:
          - "amortization_status == AMORTIZING"
          - "unamortized_cents == 0 after the posting"
        side_effects:
          - "amortization_status = FULLY_AMORTIZED"
      - from: PENDING
        to: WRITTEN_OFF
        trigger: "system event: the tool's SpringDesign reaches OBSOLETE"
        actor: system
        preconditions:
          - "amortization_status IN {PENDING, AMORTIZING}"
        side_effects:
          - "amortization_status = WRITTEN_OFF; unamortized_cents and recovered_cents unchanged"
      - from: AMORTIZING
        to: WRITTEN_OFF
        trigger: "system event: the tool's SpringDesign reaches OBSOLETE"
        actor: system
        preconditions:
          - "amortization_status IN {PENDING, AMORTIZING}"
        side_effects:
          - "amortization_status = WRITTEN_OFF; unamortized_cents and recovered_cents unchanged"

  - entity: ShipmentLot
    initial_state: ALLOCATED
    terminal_states: [RETURNED]
    transitions:
      - from: "(none)"
        to: ALLOCATED
        trigger: "POST /shipment-lots"
        actor: ProgramManager
        preconditions:
          - "run.process_status == COMPLETE"
          - "run.quality_status IN {OPEN, DISPOSITIONED_ACCEPT}"
          - "design.release_status IN {PROTOTYPE_RELEASED, PRODUCTION_RELEASED} and the newest QualificationSubmission for (program_id, run.design_id) is APPROVED or INTERIM_APPROVED (validations priority 41)"
          - "run.heat_treat_state == COMPLETE and (design.shot_peening_required == false or run.peening_verified == true)"
          - "program.delivery_posture != BLOCKED"
          - "the newest QualificationSubmission by created_at for (program_id, run.design_id) has submission_status IN {APPROVED, INTERIM_APPROVED}"
          - "run.min_ppk_observed >= program.required_ppk"
          - "piece_count >= program.minimum_order_quantity"
          - "piece_count <= run.produced_pieces - (pieces already allocated or shipped from this run)"
          - "piece_count <= program.open_commitment_pieces"
          - "if the newest submission is INTERIM_APPROVED then program.allocated_pieces + program.shipped_pieces + piece_count <= submission.interim_piece_cap"
        side_effects:
          - "unit_price_cents = program.quoted_unit_price_cents; tooling_amort_per_piece_cents = program.quoted_tooling_amort_per_piece_cents; extended_price_cents = piece_count * unit_price_cents"
          - "program.open_commitment_pieces -= piece_count; program.allocated_pieces += piece_count"
      - from: ALLOCATED
        to: PACKED
        trigger: "POST /shipment-lots/{id}/pack"
        actor: ProcessTechnician
        preconditions:
          - "lot_status == ALLOCATED"
          - "packaging_method is in the permitted set for program.application_class (validations priority 45)"
          - "if design.tangle_risk_class == HIGH then packaging_method NOT IN {BULK_BOX, BAG_AND_TAG}"
        side_effects:
          - "packaging_method recorded; lot_status = PACKED"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /shipment-lots/{id}/ship"
        actor: ProgramManager
        preconditions:
          - "lot_status == PACKED"
          - "run.quality_status != SPC_HOLD"
          - "program.delivery_posture != BLOCKED (validations priority 44)"
          - "tooling.amortization_status IN {AMORTIZING, FULLY_AMORTIZED}"
        side_effects:
          - "tooling_recovery_cents = calculations.tooling_amortization_recovery under program.amortization_method"
          - "ToolingAsset.recovered_cents += tooling_recovery_cents; ToolingAsset.unamortized_cents -= tooling_recovery_cents"
          - "if ToolingAsset.unamortized_cents == 0 then ToolingAsset transitions AMORTIZING -> FULLY_AMORTIZED"
          - "program.allocated_pieces -= piece_count; program.shipped_pieces += piece_count"
          - "lot_status = SHIPPED; shipped_at = current logical clock"
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /shipment-lots/{id}/return"
        actor: ProgramManager
        preconditions:
          - "lot_status == SHIPPED"
        side_effects:
          - "ToolingAsset.recovered_cents -= tooling_recovery_cents; ToolingAsset.unamortized_cents += tooling_recovery_cents using the stored tooling_recovery_cents verbatim (compensating_invariant.tooling_cost_conservation)"
          - "if ToolingAsset.amortization_status == FULLY_AMORTIZED and unamortized_cents > 0 after the reversal then amortization_status returns to AMORTIZING"
          - "program.shipped_pieces -= piece_count; program.open_commitment_pieces += piece_count"
          - "lot_status = RETURNED; tooling_recovery_cents left as the historical posting amount"
      - from: ALLOCATED
        to: QUARANTINED
        trigger: "POST /shipment-lots/{id}/quarantine, or system event: the lot's ProductionRun enters SPC_HOLD or SCRAPPED"
        actor: QualityInspector
        preconditions:
          - "lot_status IN {ALLOCATED, PACKED}"
        side_effects:
          - "lot_status = QUARANTINED; quarantine_reason = INSPECTOR_ACTION for the endpoint, SPC_HOLD_CASCADE for the system event"
          - "program.open_commitment_pieces += piece_count; program.allocated_pieces -= piece_count; program.quarantined_lot_count += 1"
          - "recomputes program.delivery_posture"
      - from: PACKED
        to: QUARANTINED
        trigger: "POST /shipment-lots/{id}/quarantine, or system event: the lot's ProductionRun enters SPC_HOLD or SCRAPPED"
        actor: QualityInspector
        preconditions:
          - "lot_status IN {ALLOCATED, PACKED}"
        side_effects:
          - "identical to the ALLOCATED -> QUARANTINED edge; packaging_method is retained"
      - from: QUARANTINED
        to: ALLOCATED
        trigger: "POST /shipment-lots/{id}/release-from-quarantine"
        actor: QualityInspector
        preconditions:
          - "lot_status == QUARANTINED"
          - "run.quality_status IN {OPEN, DISPOSITIONED_ACCEPT}"
          - "piece_count <= program.open_commitment_pieces"
        side_effects:
          - "lot_status = ALLOCATED; packaging_method = null"
          - "program.open_commitment_pieces -= piece_count; program.allocated_pieces += piece_count; program.quarantined_lot_count -= 1"
          - "recomputes program.delivery_posture"
        note: "Cyclic edge: ALLOCATED -> QUARANTINED -> ALLOCATED, and the lot must be packed again."

# =====================================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =====================================================================================
concurrency_rules:
  - rule_id: design-revision-stale-design
    parent_entity: SpringDesign
    write_endpoint: "POST /spring-designs/{id}/revisions"
    occ_field: "expected_design_version"
    description: |
      Creating a revision against a SpringDesign whose version has advanced since the client last
      observed it is rejected. A revision legitimately supersedes the prior revision and rewrites every
      computed engineering field, so a writer holding a stale view would silently base new geometry on
      superseded stress and fatigue numbers.
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412
  - rule_id: setup-create-stale-machine
    parent_entity: CoilingMachine
    write_endpoint: "POST /machine-setups"
    occ_field: "expected_machine_version"
    description: |
      Scheduling a MachineSetup against a CoilingMachine whose version has advanced since the client
      last observed it is rejected. A new setup for the same machine and design legitimately supersedes
      the prior SCHEDULED setup, so a writer holding a stale machine view would supersede a setup it
      never saw.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
  - rule_id: quote-supersede-stale-program
    parent_entity: CustomerProgram
    write_endpoint: "POST /customer-programs/{id}/quote"
    occ_field: "expected_program_version"
    description: |
      Pricing a CustomerProgram whose version has advanced since the client last observed it is
      rejected. A new quote legitimately supersedes the previous frozen price that later ShipmentLot
      rows snapshot, so a writer holding a stale program view would overwrite a price computed against
      tooling and commitment figures it never saw.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =====================================================================================
# 1.3 Calculation Rules Table
# =====================================================================================
calculations:
  - name: spring_rate
    trigger: "POST /spring-designs and POST /spring-designs/{id}/revisions — writes SpringDesign.spring_rate_n_per_mm"
    algorithm: closed_form
    formula: |
      D_mean_mm = outer_diameter_mm - wire_diameter_mm
      G_mpa     = material_spec.shear_modulus_gpa * 1000
      spring_rate_n_per_mm = round_half_up(
          (G_mpa * wire_diameter_mm ** 4) / (8 * (D_mean_mm ** 3) * active_coils), 3)
    input_set: "The design's own geometry fields plus the shear modulus of the linked MaterialSpec. No other entity contributes."
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: corrected_shear_stress
    trigger: "POST /spring-designs and POST /spring-designs/{id}/revisions — writes shear_stress_max_mpa, shear_stress_min_mpa, stress_amplitude_mpa, mean_stress_mpa"
    algorithm: closed_form
    formula: |
      D_mean_mm      = outer_diameter_mm - wire_diameter_mm
      spring_index   = D_mean_mm / wire_diameter_mm
      wahl_factor Kw = (4 * spring_index + 2) / (4 * spring_index - 3)
      tau(F)         = Kw * (8 * F * D_mean_mm) / (PI * wire_diameter_mm ** 3)
      shear_stress_max_mpa = round_half_up(tau(max_working_load_n), 2)
      shear_stress_min_mpa = round_half_up(tau(min_working_load_n), 2)
      # the amplitude/mean split is taken from the UNROUNDED tau values, then rounded once
      stress_amplitude_mpa = round_half_up((tau(max_working_load_n) - tau(min_working_load_n)) / 2, 2)
      mean_stress_mpa      = round_half_up((tau(max_working_load_n) + tau(min_working_load_n)) / 2, 2)
    input_set: "Design geometry and the two working loads. PI is math.pi."
    constants:
      PI: 3.141592653589793
    precision: "2 decimal places, round_half_up; intermediate tau values carry full precision"

  - name: fatigue_margin_ratio
    trigger: "POST /spring-designs and POST /spring-designs/{id}/revisions — writes SpringDesign.fatigue_criterion and SpringDesign.fatigue_margin_ratio"
    algorithm: weighted_scoring
    formula: |
      Sse_mpa = (SSE_PEENED_FACTOR if shot_peening_required else SSE_UNPEENED_FACTOR)
                * material_spec.tensile_grade_mpa
      Ssu_mpa = SSU_FACTOR * material_spec.tensile_grade_mpa      # ultimate shear strength
      Ssy_mpa = SSY_FACTOR * material_spec.tensile_grade_mpa      # shear yield strength
      # tau_alt and tau_mean are the UNROUNDED amplitude/mean from corrected_shear_stress
      denominator_goodman   = tau_alt / Sse_mpa + tau_mean / Ssu_mpa
      denominator_soderberg = tau_alt / Sse_mpa + tau_mean / Ssy_mpa
      fatigue_criterion = SODERBERG if program.application_class IN
                          {AUTOMOTIVE_SAFETY, MEDICAL_IMPLANT} else GOODMAN
      fatigue_margin_ratio = round_half_up(1 / denominator_of(fatigue_criterion), 3)
    input_set: "The design's unrounded tau_alt/tau_mean, the linked MaterialSpec tensile grade, the design's shot_peening_required flag, and the owning CustomerProgram.application_class."
    constants:
      SSE_UNPEENED_FACTOR: 0.20
      SSE_PEENED_FACTOR: 0.30
      SSU_FACTOR: 0.67
      SSY_FACTOR: 0.45
    precision: "3 decimal places, round_half_up"
    variants:
      - name: goodman_line
        when: "program.application_class IN {AUTOMOTIVE_NON_SAFETY, MEDICAL_DEVICE, INDUSTRIAL}"
        difference: "Divides the mean stress by the ultimate shear strength Ssu (0.67 * tensile), producing the larger, less conservative margin."
      - name: soderberg_line
        when: "program.application_class IN {AUTOMOTIVE_SAFETY, MEDICAL_IMPLANT}"
        difference: "Divides the mean stress by the shear yield strength Ssy (0.45 * tensile) instead of Ssu, producing a strictly smaller margin for identical geometry, loads and material."

  - name: predicted_fatigue_life
    trigger: "POST /spring-designs and POST /spring-designs/{id}/revisions — writes SpringDesign.predicted_fatigue_life_cycles"
    algorithm: threshold
    formula: |
      m = fatigue_margin_ratio            # the already-rounded 3dp value
      if m >= 1.300: predicted_fatigue_life_cycles = 10000000
      elif m >= 1.150: predicted_fatigue_life_cycles = 5000000
      elif m >= 1.050: predicted_fatigue_life_cycles = 1000000
      elif m >= 1.000: predicted_fatigue_life_cycles = 250000
      else:            predicted_fatigue_life_cycles = 0
    input_set: "Only the rounded fatigue_margin_ratio of the same design. Tier comparisons are inclusive at the lower bound (>=)."
    constants:
      LIFE_TIER_BREAKPOINTS: [1.300, 1.150, 1.050, 1.000]
      LIFE_TIER_CYCLES: [10000000, 5000000, 1000000, 250000, 0]
    precision: "integer cycles, no rounding"

  - name: wire_mass_per_piece
    trigger: "POST /spring-designs and POST /spring-designs/{id}/revisions — writes SpringDesign.wire_mass_per_piece_kg"
    algorithm: closed_form
    formula: |
      D_mean_mm  = outer_diameter_mm - wire_diameter_mm
      tail_mm    = TAIL_LENGTH_MM[end_type]
      length_mm  = PI * D_mean_mm * (active_coils + END_COIL_ALLOWANCE_COILS) + 2 * tail_mm
      area_m2    = PI * ((wire_diameter_mm / 2000) ** 2)
      wire_mass_per_piece_kg = round_half_up(
          (length_mm / 1000) * area_m2 * material_spec.density_kg_per_m3, 6)
    input_set: "Design geometry, end_type, and the linked MaterialSpec density."
    constants:
      PI: 3.141592653589793
      END_COIL_ALLOWANCE_COILS: 2.0
      TAIL_LENGTH_MM: { CLOSED_GROUND: 0.0, CLOSED_UNGROUND: 0.0, OPEN: 0.0, HOOK_EXTENSION: 15.0, TORSION_LEG: 25.0 }
    precision: "exactly 6 decimal places, round_half_up — this rounded value is the ONLY per-piece mass any downstream formula may read"

  - name: wire_mass_required
    trigger: "POST /production-runs — writes ProductionRun.wire_reserved_kg and drives the WireLot reservation"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: the per-piece mass is rounded to 6 dp FIRST (by
      # wire_mass_per_piece and stored on the design), THEN scaled by planned_pieces,
      # THEN inflated by the scrap allowance, THEN rounded once to 3 dp.
      required_kg = round_half_up(
          design.wire_mass_per_piece_kg * planned_pieces * (1 + SCRAP_ALLOWANCE_PCT), 3)
      # FORBIDDEN alternative: round_half_up(unrounded_mass_per_piece * planned_pieces
      # * (1 + SCRAP_ALLOWANCE_PCT), 3) — for a 10000-piece run of a 0.021185 kg part this
      # yields 218.205 instead of the correct 218.206.
    input_set: "The design's stored wire_mass_per_piece_kg (already 6dp) and the run's planned_pieces. The wire lot's on_hand_kg is only compared against the result, never fed into it."
    constants:
      SCRAP_ALLOWANCE_PCT: 0.03
    precision: "3 decimal places, round_half_up, applied exactly once at the end"

  - name: wire_consumption_at_completion
    trigger: "POST /production-runs/{id}/complete — writes ProductionRun.wire_consumed_kg and the three WireLot ledger fields"
    algorithm: aggregation
    formula: |
      wire_consumed_kg = round_half_up(
          design.wire_mass_per_piece_kg * (produced_pieces + scrapped_pieces), 3)
      # ledger postings, in this exact order:
      WireLot.reserved_kg = round_half_up(WireLot.reserved_kg - run.wire_reserved_kg, 3)
      WireLot.consumed_kg = round_half_up(WireLot.consumed_kg + wire_consumed_kg, 3)
      WireLot.on_hand_kg  = round_half_up(WireLot.on_hand_kg + (run.wire_reserved_kg - wire_consumed_kg), 3)
    input_set: "The stored 6dp per-piece mass, the run's recorded produced_pieces + scrapped_pieces, and the run's STORED wire_reserved_kg (never recomputed)."
    constants: {}
    precision: "3 decimal places, round_half_up per posting"

  - name: process_capability
    trigger: "POST /production-runs/{id}/fai and POST /production-runs/{id}/inspections — writes InspectionRecord.mean_value, sigma_value, cpk_value, ppk_value, control_state and refreshes ProductionRun.min_cpk_observed / min_ppk_observed"
    algorithm: weighted_scoring
    formula: |
      n          = len(measurements)
      mean_value = round_half_up(sum(measurements) / n, 4)
      sigma_value = round_half_up(sqrt(sum((x - mean_unrounded) ** 2 for x in measurements) / (n - 1)), 6)
      # min() makes the metric non-linear: the binding side flips with the mean
      cpk_value  = round_half_up(
          min(characteristic.usl - mean_unrounded, mean_unrounded - characteristic.lsl)
          / (3 * sigma_unrounded), 3)
      # ppk pools EVERY measurement of every InspectionRecord with record_kind == SPC for the
      # same (run_id, characteristic_id), including the record being created, into one sample;
      # pooling order does not affect the result. FAI records get ppk_value = null.
      ppk_value  = null if record_kind == FAI else round_half_up(
          min(usl - pooled_mean, pooled_mean - lsl) / (3 * pooled_sigma), 3)
      control_state = OUT_OF_CONTROL if (cpk_value < characteristic.cpk_floor
                       or any(x > usl or x < lsl for x in measurements)) else IN_CONTROL
      ProductionRun.min_cpk_observed = min(cpk_value over all InspectionRecord rows of this run)
      ProductionRun.min_ppk_observed = min(ppk_value over all InspectionRecord rows of this run
                       whose characteristic.is_safety_critical == true and record_kind == SPC)
    input_set: "measurements of the record being created; for ppk_value additionally every SPC InspectionRecord with the same (run_id, characteristic_id) regardless of created_at order. Records of other runs never pool in."
    constants:
      SPC_MIN_SUBGROUP_SIZE: 3
      CPK_SIGMA_MULTIPLIER: 3
    precision: "mean 4 dp, sigma 6 dp, cpk/ppk 3 dp, all round_half_up; cpk_value is compared with the floor AFTER rounding, using >= for pass"

  - name: program_quote_pricing
    trigger: "POST /customer-programs/{id}/quote — writes quoted_qty, quoted_pre_discount_subtotal_cents, quoted_volume_discount_pct, quoted_tooling_amort_per_piece_cents, quoted_unit_price_cents, quoted_total_cents"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED because the dependency looks circular: the discount tier is
      # keyed on a subtotal computed BEFORE any discount or amortization, while the amortization
      # cap is keyed on the unit price AFTER the discount.
      1. material_cents_pp = round_half_up(design.wire_mass_per_piece_kg
                                           * material_spec.cost_per_kg_cents, 4)
      2. labor_cents_pp    = round_half_up(design.cycle_seconds_per_piece / 3600
                                           * LABOR_RATE_CENTS_PER_HOUR, 4)
      3. base_unit_cents   = round_half_up(material_cents_pp + labor_cents_pp, 4)
      4. quoted_pre_discount_subtotal_cents = round_half_up(base_unit_cents * quoted_qty, 0)
      5. quoted_volume_discount_pct = tier(quoted_pre_discount_subtotal_cents):
             < 50000        -> 0.00
             < 250000       -> 0.03
             < 1000000      -> 0.06
             >= 1000000     -> 0.09
      6. discounted_unit_cents = round_half_up(base_unit_cents
                                   * (1 - quoted_volume_discount_pct), 4)
      7. amort_raw_cents = ceil(tooling.unamortized_cents / quoted_qty)
      8. amort_cap_cents = floor(TOOLING_AMORT_CAP_PCT * discounted_unit_cents)
      9. quoted_tooling_amort_per_piece_cents = min(amort_raw_cents, amort_cap_cents)
      10. quoted_unit_price_cents = round_half_up(discounted_unit_cents
                                     + quoted_tooling_amort_per_piece_cents, 0)
      11. quoted_total_cents = quoted_unit_price_cents * quoted_qty + SETUP_FEE_CENTS
    input_set: "The single SpringDesign named in the request, its MaterialSpec, the newest ToolingAsset by created_at for that design (its unamortized_cents at call time), and quoted_qty from the request body. Rows of other designs never contribute."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 6500
      SETUP_FEE_CENTS: 125000
      TOOLING_AMORT_CAP_PCT: 0.25
      VOLUME_TIER_BREAKPOINTS_CENTS: [50000, 250000, 1000000]
      VOLUME_TIER_DISCOUNTS: [0.00, 0.03, 0.06, 0.09]
    precision: "per-piece money carried at 4 decimal places (mills) through step 9; whole cents only at steps 4, 8, 10 and 11"

  - name: tooling_amortization_recovery
    trigger: "POST /shipment-lots/{id}/ship — writes ShipmentLot.tooling_recovery_cents and posts to the ToolingAsset ledger"
    algorithm: waterfall_allocation
    formula: |
      tooling = the newest ToolingAsset by created_at for run.design_id
      # program.open_commitment_pieces is read BEFORE this shipment changes any counter
      if program.amortization_method == FORECAST_BASIS:
          recovery = min(lot.piece_count * tooling.amort_per_piece_cents, tooling.unamortized_cents)
      else:  # ACTUAL_BASIS
          recovery = min(ceil(tooling.unamortized_cents * ACCELERATION_FACTOR * lot.piece_count
                              / max(program.open_commitment_pieces, 1)),
                         tooling.unamortized_cents)
      tooling_recovery_cents = recovery
      ToolingAsset.recovered_cents  += recovery
      ToolingAsset.unamortized_cents -= recovery
    input_set: "The lot's piece_count, the tooling row's frozen amort_per_piece_cents and live unamortized_cents, and the program's open_commitment_pieces as of the instant before this ship posts its own counter changes."
    constants:
      ACCELERATION_FACTOR: 1.5
    precision: "integer cents; the ceil() in the ACTUAL_BASIS branch rounds toward +infinity"
    variants:
      - name: straight_line_forecast
        when: "program.amortization_method == FORECAST_BASIS"
        difference: "Recovers a flat per-piece amount frozen at design release from committed_pieces, so recovery is linear in piece_count and independent of how much is still outstanding."
      - name: accelerated_declining
        when: "program.amortization_method == ACTUAL_BASIS"
        difference: "Recovers 1.5x the pro-rata share of the REMAINING balance against the REMAINING commitment, front-loading recovery: for a 2000-piece lot against a 40000-piece commitment on a 4800000-cent tool it posts 360000 instead of the 240000 the forecast variant posts on identical inputs."

  - name: program_delivery_posture
    trigger: "system event on every transition that changes a program's submissions, quarantine count, or its designs' release_status — writes CustomerProgram.delivery_posture"
    algorithm: constraint_propagation
    formula: |
      approved_exists = exists QualificationSubmission with program_id == program.id
                        and submission_status IN {APPROVED, INTERIM_APPROVED}
      hold_exists = exists ProductionRun r with r.quality_status == SPC_HOLD
                    and r.design_id IN (SpringDesign ids with program_id == program.id)
      if not approved_exists:                                     delivery_posture = BLOCKED
      elif quarantined_lot_count >= 1 or hold_exists:              delivery_posture = AT_RISK
      else:                                                        delivery_posture = ON_TRACK
    input_set: "QualificationSubmission rows of this program in any status; ProductionRun rows whose design_id belongs to this program; the program's own quarantined_lot_count. Rows of other programs are excluded."
    constants: {}
    precision: "enum, no rounding"

  - name: oven_interval_load
    trigger: "POST /heat-treat-batches — the capacity gate of validations priority 71; also refreshes StressReliefOven.scheduled_load_kg"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals: two windows collide when they merely touch at an endpoint.
      collides(a, b) = a.window_start <= b.window_end and b.window_start <= a.window_end
      occupied_kg = sum(b.load_kg for b in HeatTreatBatch
                        where b.oven_id == new.oven_id
                          and b.batch_status IN {SCHEDULED, RUNNING}
                          and collides(b, new))
      reject when round_half_up(occupied_kg + new.load_kg, 3) > oven.capacity_kg
      StressReliefOven.scheduled_load_kg = round_half_up(
          sum(load_kg for batches of this oven with batch_status IN {SCHEDULED, RUNNING}), 3)
    input_set: "HeatTreatBatch rows of the same oven whose batch_status IN {SCHEDULED, RUNNING}; CANCELLED and COMPLETE batches are excluded even when their windows collide."
    constants: {}
    precision: "3 decimal places, round_half_up; the capacity comparison is strict (> capacity rejects, == capacity passes)"

  - name: setup_window_conflict
    trigger: "POST /machine-setups — the temporal gate of validations priority 67"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [window_start, window_end) plus a mandatory changeover buffer.
      buffer = timedelta(minutes = machine.changeover_buffer_minutes)
      conflicts(existing, new) = new.window_start < existing.window_end + buffer
                                 and existing.window_start < new.window_end + buffer
      reject when any conflicting MachineSetup exists on machine_id with
             setup_status IN {SCHEDULED, ACTIVE}
    input_set: "MachineSetup rows on the same machine_id with setup_status IN {SCHEDULED, ACTIVE}. RELEASED, SUPERSEDED and ABORTED setups never conflict."
    constants: {}
    precision: "minute-resolution timestamps; a gap exactly equal to changeover_buffer_minutes is permitted"

# =====================================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins a dual failure)
# =====================================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "When X-User-Role == CustomerRepresentative, X-User-ID equals the program_id of the targeted QualificationSubmission / ShipmentLot / CustomerProgram"
    error_id: ERR_PROGRAM_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all endpoints CustomerRepresentative may call"
  - priority: 4
    category: business_constraint
    check: "Request body parses; required fields present; enums are declared members; numbers respect their constraints; measurements is an array of numbers"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "limit within [1,100] and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"
  - priority: 6
    category: existence
    check: "program_id in path or body resolves to a CustomerProgram"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /customer-programs/{id}/*, POST /spring-designs, POST /qualification-submissions, POST /shipment-lots"
  - priority: 7
    category: existence
    check: "material_spec_id resolves to a MaterialSpec"
    error_id: ERR_MATERIAL_SPEC_NOT_FOUND
    http_status: 404
    applies_to: "GET /material-specs/{id}, POST /spring-designs, POST /spring-designs/{id}/revisions, POST /wire-lots"
  - priority: 8
    category: existence
    check: "design_id in path or body resolves to a SpringDesign"
    error_id: ERR_DESIGN_NOT_FOUND
    http_status: 404
    applies_to: "all /spring-designs/{id}/* endpoints, POST /machine-setups, POST /production-runs, POST /qualification-submissions, POST /tooling-assets, POST /customer-programs/{id}/quote"
  - priority: 9
    category: existence
    check: "characteristic_id resolves to a CriticalCharacteristic"
    error_id: ERR_CHARACTERISTIC_NOT_FOUND
    http_status: 404
    applies_to: "POST /production-runs/{id}/fai, POST /production-runs/{id}/inspections"
  - priority: 10
    category: existence
    check: "tooling_asset_id resolves to a ToolingAsset"
    error_id: ERR_TOOLING_NOT_FOUND
    http_status: 404
    applies_to: "GET /tooling-assets/{id}, POST /machine-setups"
  - priority: 11
    category: existence
    check: "wire_lot_id resolves to a WireLot"
    error_id: ERR_WIRE_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /wire-lots/{id}/*, POST /production-runs"
  - priority: 12
    category: existence
    check: "machine_id resolves to a CoilingMachine"
    error_id: ERR_MACHINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /coiling-machines/{id}, POST /machine-setups"
  - priority: 13
    category: existence
    check: "setup id in path or setup_id in body resolves to a MachineSetup"
    error_id: ERR_SETUP_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /machine-setups/{id}/*, POST /production-runs"
  - priority: 14
    category: existence
    check: "run id in path or run_id in body resolves to a ProductionRun"
    error_id: ERR_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /production-runs/{id}/*, POST /heat-treat-batches, POST /shipment-lots"
  - priority: 15
    category: existence
    check: "oven_id resolves to a StressReliefOven; batch id in path resolves to a HeatTreatBatch"
    error_id: ERR_OVEN_NOT_FOUND
    http_status: 404
    applies_to: "GET /stress-relief-ovens/{id}, POST /heat-treat-batches"
  - priority: 16
    category: existence
    check: "batch id in path resolves to a HeatTreatBatch"
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /heat-treat-batches/{id}/*"
  - priority: 17
    category: existence
    check: "submission id in path resolves to a QualificationSubmission; lot id in path resolves to a ShipmentLot"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /qualification-submissions/{id}/*"
  - priority: 18
    category: existence
    check: "lot id in path resolves to a ShipmentLot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /shipment-lots/{id}/*"
  - priority: 19
    category: state
    check: "expected_design_version equals SpringDesign.version (OCC, concurrency_rules.design-revision-stale-design)"
    error_id: ERR_STALE_DESIGN_VERSION
    http_status: 412
    applies_to: "POST /spring-designs/{id}/revisions"
  - priority: 19
    category: state
    check: "expected_machine_version equals CoilingMachine.version (OCC, concurrency_rules.setup-create-stale-machine)"
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
    applies_to: "POST /machine-setups"
  - priority: 19
    category: state
    check: "expected_program_version equals CustomerProgram.version (OCC, concurrency_rules.quote-supersede-stale-program)"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /customer-programs/{id}/quote"
  - priority: 20
    category: state
    check: "SpringDesign.release_status is in the from-set of the requested transition: DRAFT for submit-for-review and for adding a critical characteristic, ENG_REVIEW for review, {DRAFT, ENG_REVIEW, REJECTED, PROTOTYPE_RELEASED} for revisions, {PROTOTYPE_RELEASED, REJECTED, PRODUCTION_RELEASED} for obsolete. On POST /spring-designs/{id}/revisions this row outranks priority 21, so an OBSOLETE design answers ERR_DESIGN_INVALID_STATE while a live design carrying an in-flight package answers ERR_DESIGN_LOCKED."
    error_id: ERR_DESIGN_INVALID_STATE
    http_status: 409
    applies_to: "POST /spring-designs/{id}/submit-for-review, POST /spring-designs/{id}/review, POST /spring-designs/{id}/obsolete, POST /spring-designs/{id}/critical-characteristics, POST /spring-designs/{id}/revisions"
  - priority: 21
    category: state
    check: "no QualificationSubmission for this design has submission_status IN {SUBMITTED, INTERIM_APPROVED, APPROVED} — a package in flight or already granted freezes the engineering record"
    error_id: ERR_DESIGN_LOCKED
    http_status: 409
    applies_to: "POST /spring-designs/{id}/revisions"
  - priority: 22
    category: state
    check: "ProductionRun.process_status == COMPLETE"
    error_id: ERR_RUN_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /shipment-lots"
  - priority: 23
    category: state
    check: "ProductionRun.quality_status != SPC_HOLD"
    error_id: ERR_RUN_ON_SPC_HOLD
    http_status: 409
    applies_to: "POST /production-runs/{id}/complete, POST /heat-treat-batches, POST /shipment-lots/{id}/ship"
  - priority: 24
    category: state
    check: "ProductionRun.process_status is in the from-set of the requested transition (RUNNING for complete, FAI_PENDING for fai and fai-disposition, {FAI_PENDING, RUNNING} for cancel, {RUNNING, COMPLETE} for in-process/final SPC inspections)"
    error_id: ERR_RUN_INVALID_STATE
    http_status: 409
    applies_to: "POST /production-runs/{id}/complete, POST /production-runs/{id}/cancel, POST /production-runs/{id}/fai, POST /production-runs/{id}/fai-disposition, POST /production-runs/{id}/inspections"
  - priority: 25
    category: state
    check: "MachineSetup.setup_status == ACTIVE"
    error_id: ERR_SETUP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /production-runs"
  - priority: 26
    category: state
    check: "MachineSetup.setup_status is in the from-set of the requested transition (SCHEDULED for activate, {SCHEDULED, ACTIVE} for abort); RELEASED, SUPERSEDED and ABORTED are terminal"
    error_id: ERR_SETUP_INVALID_STATE
    http_status: 409
    applies_to: "POST /machine-setups/{id}/activate, POST /machine-setups/{id}/abort"
  - priority: 27
    category: state
    check: "CoilingMachine.machine_state == IDLE"
    error_id: ERR_MACHINE_NOT_IDLE
    http_status: 409
    applies_to: "POST /machine-setups/{id}/activate"
  - priority: 28
    category: state
    check: "WireLot.certification_status == UNCERTIFIED"
    error_id: ERR_WIRE_LOT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /wire-lots/{id}/certify"
  - priority: 29
    category: state
    check: "ProductionRun.fai_disposition == PENDING"
    error_id: ERR_FAI_ALREADY_DISPOSITIONED
    http_status: 409
    applies_to: "POST /production-runs/{id}/fai-disposition"
  - priority: 30
    category: state
    check: "ProductionRun.quality_status == SPC_HOLD"
    error_id: ERR_RUN_NOT_ON_HOLD
    http_status: 409
    applies_to: "POST /production-runs/{id}/quality-disposition"
  - priority: 31
    category: state
    check: "QualificationSubmission.submission_status == SUBMITTED for review; IN {REVISION_REQUESTED, INTERIM_APPROVED} for resubmit"
    error_id: ERR_SUBMISSION_INVALID_STATE
    http_status: 409
    applies_to: "POST /qualification-submissions/{id}/review, POST /qualification-submissions/{id}/resubmit"
  - priority: 32
    category: state
    check: "ShipmentLot.lot_status is in the from-set of the requested transition"
    error_id: ERR_LOT_INVALID_STATE
    http_status: 409
    applies_to: "POST /shipment-lots/{id}/pack, .../ship, .../return, .../quarantine, .../release-from-quarantine"
  - priority: 33
    category: state
    check: "HeatTreatBatch.batch_status is in the from-set of the requested transition (SCHEDULED for start/cancel, RUNNING for complete)"
    error_id: ERR_BATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /heat-treat-batches/{id}/start, .../complete, .../cancel"
  - priority: 34
    category: state
    check: "CustomerProgram.quote_frozen == false"
    error_id: ERR_QUOTE_FROZEN
    http_status: 409
    applies_to: "POST /customer-programs/{id}/quote"
  - priority: 35
    category: business_safety
    check: "material_spec.salt_spray_hours >= program.required_salt_spray_hours"
    error_id: ERR_CORROSION_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /spring-designs, POST /spring-designs/{id}/revisions"
  - priority: 36
    category: business_safety
    check: "program.biocompatibility_required == false OR material_spec.biocompatible == true"
    error_id: ERR_BIOCOMPATIBILITY_REQUIRED
    http_status: 422
    applies_to: "POST /spring-designs, POST /spring-designs/{id}/revisions"
  - priority: 37
    category: business_safety
    check: "X-User-ID != SpringDesign.created_by_user_id (segregation of duties on the engineering review)"
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 409
    applies_to: "POST /spring-designs/{id}/review"
  - priority: 38
    category: business_safety
    check: "fatigue_margin_ratio >= program.min_fatigue_margin (only on decision == APPROVE_PROTOTYPE)"
    error_id: ERR_FATIGUE_MARGIN_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /spring-designs/{id}/review"
  - priority: 39
    category: business_safety
    check: "X-User-ID is not the inspected_by_user_id of any FAI InspectionRecord of this run (segregation of duties on the first-article verdict)"
    error_id: ERR_SELF_DISPOSITION_FORBIDDEN
    http_status: 409
    applies_to: "POST /production-runs/{id}/fai-disposition"
  - priority: 40
    category: business_safety
    check: "WireLot.certification_status == CERTIFIED"
    error_id: ERR_WIRE_LOT_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /production-runs"
  - priority: 41
    category: business_safety
    check: "on POST /machine-setups and POST /production-runs: design.release_status IN {PROTOTYPE_RELEASED, PRODUCTION_RELEASED}; on POST /shipment-lots: design.release_status IN {PROTOTYPE_RELEASED, PRODUCTION_RELEASED} AND the newest QualificationSubmission by created_at for (program_id, run.design_id) has submission_status IN {APPROVED, INTERIM_APPROVED} — a full APPROVE always implies PRODUCTION_RELEASED, while an INTERIM_APPROVE admits capped quantities for allocation and packing off a still PROTOTYPE_RELEASED design, whose tooling is still PENDING so validations priority 76 keeps those lots from shipping until full approval"
    error_id: ERR_PPAP_NOT_APPROVED
    http_status: 422
    applies_to: "POST /machine-setups, POST /production-runs, POST /shipment-lots"
  - priority: 42
    category: business_safety
    check: "run.heat_treat_state == COMPLETE and (design.shot_peening_required == false or run.peening_verified == true)"
    error_id: ERR_HEAT_TREAT_INCOMPLETE
    http_status: 422
    applies_to: "POST /shipment-lots"
  - priority: 43
    category: business_safety
    check: "run.min_ppk_observed is not null and >= program.required_ppk"
    error_id: ERR_PPK_BELOW_PROGRAM_FLOOR
    http_status: 422
    applies_to: "POST /shipment-lots"
  - priority: 44
    category: business_safety
    check: >-
      program.delivery_posture != BLOCKED. On POST /shipment-lots this row is structurally shadowed by
      priority 41 (a program whose posture is BLOCKED has no APPROVED/INTERIM_APPROVED submission, so 41
      answers first); it becomes the answering error on POST /shipment-lots/{id}/ship, where an already
      PACKED lot may be presented after a resubmit dropped the program's posture back to BLOCKED.
    error_id: ERR_PROGRAM_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /shipment-lots, POST /shipment-lots/{id}/ship"
  - priority: 45
    category: business_safety
    check: "packaging_method is in the permitted set of program.application_class: MEDICAL_IMPLANT/MEDICAL_DEVICE -> {CLEANROOM_DOUBLE_BAG, INTERLEAVED_TUBE}; AUTOMOTIVE_SAFETY -> {TANGLE_FREE_TRAY, INTERLEAVED_TUBE}; AUTOMOTIVE_NON_SAFETY -> {TANGLE_FREE_TRAY, INTERLEAVED_TUBE, BAG_AND_TAG}; INDUSTRIAL -> all five"
    error_id: ERR_PACKAGING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /shipment-lots/{id}/pack"
  - priority: 46
    category: business_safety
    check: "if design.tangle_risk_class == HIGH then packaging_method NOT IN {BULK_BOX, BAG_AND_TAG}"
    error_id: ERR_TANGLE_RISK_PACKAGING
    http_status: 422
    applies_to: "POST /shipment-lots/{id}/pack"
  - priority: 47
    category: business_referential
    check: "body design_id == MachineSetup.design_id of setup_id"
    error_id: ERR_SETUP_DESIGN_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs"
  - priority: 48
    category: business_referential
    check: "WireLot.material_spec_id == SpringDesign.material_spec_id"
    error_id: ERR_MATERIAL_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs"
  - priority: 49
    category: business_referential
    check: "ToolingAsset.design_id == body design_id"
    error_id: ERR_TOOLING_DESIGN_MISMATCH
    http_status: 422
    applies_to: "POST /machine-setups"
  - priority: 50
    category: business_referential
    check: "SpringDesign.program_id == body program_id (submission) / == ShipmentLot's program_id via run.design_id (lot)"
    error_id: ERR_PROGRAM_DESIGN_MISMATCH
    http_status: 422
    applies_to: "POST /qualification-submissions, POST /shipment-lots, POST /customer-programs/{id}/quote"
  - priority: 51
    category: business_referential
    check: "CriticalCharacteristic.design_id == run.design_id"
    error_id: ERR_CHARACTERISTIC_DESIGN_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs/{id}/fai, POST /production-runs/{id}/inspections"
  - priority: 52
    category: business_referential
    check: "body ppap_level == program.ppap_level"
    error_id: ERR_PPAP_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /qualification-submissions"
  - priority: 53
    category: business_constraint
    check: "design.wire_diameter_mm <= machine.max_wire_diameter_mm"
    error_id: ERR_WIRE_DIAMETER_EXCEEDS_MACHINE
    http_status: 422
    applies_to: "POST /machine-setups"
  - priority: 54
    category: business_constraint
    check: "len(measurements) >= SPC_MIN_SUBGROUP_SIZE (3)"
    error_id: ERR_INVALID_SUBGROUP_SIZE
    http_status: 422
    applies_to: "POST /production-runs/{id}/fai, POST /production-runs/{id}/inspections"
  - priority: 55
    category: business_constraint
    check: "count of CriticalCharacteristic rows for the design >= 1 (empty-collection edge)"
    error_id: ERR_CHARACTERISTIC_SET_EMPTY
    http_status: 422
    applies_to: "POST /spring-designs/{id}/submit-for-review, POST /production-runs/{id}/fai-disposition"
  - priority: 56
    category: business_constraint
    check: "every CriticalCharacteristic of the run's design has at least one InspectionRecord with record_kind == FAI on this run"
    error_id: ERR_INCOMPLETE_FAI_COVERAGE
    http_status: 422
    applies_to: "POST /production-runs/{id}/fai-disposition"
  - priority: 57
    category: business_constraint
    check: "char_code is unique within the design"
    error_id: ERR_DUPLICATE_CHARACTERISTIC
    http_status: 409
    applies_to: "POST /spring-designs/{id}/critical-characteristics"
  - priority: 58
    category: business_constraint
    check: "program_code / spec_code / heat_number / tool_code / machine_code / oven_code is unique in its collection"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /customer-programs, POST /material-specs, POST /wire-lots, POST /tooling-assets, POST /coiling-machines, POST /stress-relief-ovens"
  - priority: 59
    category: business_constraint
    check: "no QualificationSubmission for the same (program_id, design_id) has submission_status IN {SUBMITTED, INTERIM_APPROVED, REVISION_REQUESTED}"
    error_id: ERR_OPEN_SUBMISSION_EXISTS
    http_status: 409
    applies_to: "POST /qualification-submissions"
  - priority: 60
    category: business_constraint
    check: "there exists a ProductionRun with design_id == body design_id and fai_disposition == ACCEPTED"
    error_id: ERR_NO_QUALIFIED_RUN
    http_status: 422
    applies_to: "POST /qualification-submissions"
  - priority: 61
    category: business_constraint
    check: "round_no < MAX_SUBMISSION_ROUNDS (3)"
    error_id: ERR_MAX_SUBMISSION_ROUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /qualification-submissions/{id}/resubmit"
  - priority: 62
    category: business_constraint
    check: "target_temp_c <= oven.max_temp_c"
    error_id: ERR_TEMP_EXCEEDS_OVEN
    http_status: 422
    applies_to: "POST /heat-treat-batches"
  - priority: 63
    category: business_constraint
    check: "piece_count >= program.minimum_order_quantity (inclusive at the boundary)"
    error_id: ERR_BELOW_MINIMUM_ORDER_QUANTITY
    http_status: 422
    applies_to: "POST /shipment-lots"
  - priority: 64
    category: business_constraint
    check: "piece_count <= run.produced_pieces minus pieces already carried by ShipmentLot rows of this run with lot_status IN {ALLOCATED, PACKED, SHIPPED}"
    error_id: ERR_RUN_PIECES_EXHAUSTED
    http_status: 422
    applies_to: "POST /shipment-lots"
  - priority: 65
    category: business_temporal
    check: "window_end > window_start"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /machine-setups, POST /heat-treat-batches"
  - priority: 66
    category: business_temporal
    check: "window_start >= current logical clock"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /machine-setups, POST /heat-treat-batches"
  - priority: 67
    category: business_temporal
    check: "no buffered half-open overlap with a SCHEDULED or ACTIVE setup on the same machine (calculations.setup_window_conflict)"
    error_id: ERR_SETUP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /machine-setups"
  - priority: 68
    category: business_temporal
    check: "window_start <= current logical clock < window_end"
    error_id: ERR_OUTSIDE_SETUP_WINDOW
    http_status: 409
    applies_to: "POST /machine-setups/{id}/activate"
  - priority: 69
    category: business_temporal
    check: "current logical clock >= window_start"
    error_id: ERR_BATCH_WINDOW_NOT_REACHED
    http_status: 409
    applies_to: "POST /heat-treat-batches/{id}/start"
  - priority: 70
    category: business_temporal
    check: "to_iso8601 >= the current logical clock (the clock never runs backwards)"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 71
    category: business_fiscal
    check: "closed-interval aggregate oven load including the new batch <= oven.capacity_kg (calculations.oven_interval_load)"
    error_id: ERR_OVEN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /heat-treat-batches"
  - priority: 72
    category: business_fiscal
    check: "wire_lot.on_hand_kg >= calculations.wire_mass_required.required_kg"
    error_id: ERR_INSUFFICIENT_WIRE
    http_status: 409
    applies_to: "POST /production-runs"
  - priority: 73
    category: business_fiscal
    check: "program.quoted_unit_price_cents is not null (a quote must be on file before pieces can be priced)"
    error_id: ERR_PROGRAM_NOT_QUOTED
    http_status: 409
    applies_to: "POST /shipment-lots"
  - priority: 74
    category: business_fiscal
    check: "piece_count <= program.open_commitment_pieces"
    error_id: ERR_COMMITMENT_EXCEEDED
    http_status: 422
    applies_to: "POST /shipment-lots, POST /shipment-lots/{id}/release-from-quarantine"
  - priority: 75
    category: business_fiscal
    check: "when the newest submission is INTERIM_APPROVED: program.allocated_pieces + program.shipped_pieces + piece_count <= submission.interim_piece_cap"
    error_id: ERR_INTERIM_PIECE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /shipment-lots"
  - priority: 76
    category: business_fiscal
    check: "tooling.amortization_status IN {AMORTIZING, FULLY_AMORTIZED}"
    error_id: ERR_TOOLING_NOT_AMORTIZING
    http_status: 409
    applies_to: "POST /shipment-lots/{id}/ship"

# =====================================================================================
# 1.5 API Endpoint Table
# =====================================================================================
endpoints:

  # ---------------------------------------------------------------- CustomerProgram
  - method: POST
    path: "/customer-programs"
    description: "Open a customer program with its PPAP level, volume commitment, MOQ, corrosion/biocompatibility/fatigue/Ppk acceptance floors and tooling amortization method."
    roles: [ProgramManager]
    code: 201
    input: [program_code, customer_name, application_class, ppap_level, committed_pieces, minimum_order_quantity, "required_salt_spray_hours?", "biocompatibility_required?", "min_fatigue_margin?", "required_ppk?", amortization_method]
    output: CustomerProgram
    side_effects:
      - "open_commitment_pieces := committed_pieces; allocated_pieces := 0; shipped_pieces := 0; quarantined_lot_count := 0"
      - "delivery_posture := BLOCKED (calculations.program_delivery_posture with no approved submission on file)"
      - "quote_frozen := false; all quoted_* fields null"
  - method: GET
    path: "/customer-programs/{id}"
    description: "Read one customer program including its live commitment ledger and frozen quote."
    roles: [ProgramManager, DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, PlantAdmin, CustomerRepresentative]
    code: 200
    input: []
    output: CustomerProgram
    side_effects: []
  - method: GET
    path: "/customer-programs"
    description: "List customer programs, filterable by application class and delivery posture."
    roles: [ProgramManager, DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, PlantAdmin]
    code: 200
    input: ["application_class?", "delivery_posture?", "limit?", "offset?"]
    output: CustomerProgram[]
    side_effects: []
  - method: POST
    path: "/customer-programs/{id}/quote"
    description: "Price the program for a stated quantity against one released-or-drafted design and freeze the result on the program. OCC-guarded by expected_program_version."
    roles: [ProgramManager]
    code: 200
    input: [design_id, quoted_qty, expected_program_version]
    output: CustomerProgram
    side_effects:
      - "runs calculations.program_quote_pricing in its pinned 11-step order"
      - "writes quoted_qty, quoted_pre_discount_subtotal_cents, quoted_volume_discount_pct, quoted_tooling_amort_per_piece_cents, quoted_unit_price_cents, quoted_total_cents"
      - "increments CustomerProgram.version by 1 — this endpoint is the ONLY writer of CustomerProgram.version; the counter and delivery_posture cascades fired by lots and submissions leave version untouched"
  - method: GET
    path: "/customer-programs/{id}/tooling-amortization"
    description: "Computed read: for the program's design tooling, return the recovery both the straight_line_forecast and the accelerated_declining variant of calculations.tooling_amortization_recovery would produce for a hypothetical lot of piece_count pieces, alongside the live ledger."
    roles: [ProgramManager, EngineeringManager, PlantAdmin, CustomerRepresentative]
    code: 200
    input: [piece_count]
    output:
      amortization_method: "enum: FORECAST_BASIS | ACTUAL_BASIS — the variant this program actually applies"
      tooling_asset_id: "string: the newest ToolingAsset by created_at for the program's most recently quoted design"
      original_cost_cents: "integer"
      recovered_cents: "integer"
      unamortized_cents: "integer"
      open_commitment_pieces: "integer"
      forecast_basis_recovery_cents: "integer: variant straight_line_forecast result for piece_count; when amort_per_piece_cents is not yet frozen it is computed on the fly as ceil(original_cost_cents / committed_pieces)"
      actual_basis_recovery_cents: "integer: variant accelerated_declining result for piece_count"
    side_effects: []

  # ---------------------------------------------------------------- MaterialSpec
  - method: POST
    path: "/material-specs"
    description: "Register a wire material specification: tensile grade, shear/elastic moduli, density, coating, salt-spray rating, biocompatibility and cost per kg."
    roles: [DesignEngineer]
    code: 201
    input: [spec_code, wire_material, tensile_grade_mpa, shear_modulus_gpa, elastic_modulus_gpa, density_kg_per_m3, coating, salt_spray_hours, "biocompatible?", cost_per_kg_cents]
    output: MaterialSpec
    side_effects: []
  - method: GET
    path: "/material-specs/{id}"
    description: "Read one material specification."
    roles: [DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, ProgramManager, PlantAdmin]
    code: 200
    input: []
    output: MaterialSpec
    side_effects: []
  - method: GET
    path: "/material-specs"
    description: "List material specifications, filterable by wire material family."
    roles: [DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, ProgramManager, PlantAdmin]
    code: 200
    input: ["wire_material?", "limit?", "offset?"]
    output: MaterialSpec[]
    side_effects: []

  # ---------------------------------------------------------------- SpringDesign
  - method: POST
    path: "/spring-designs"
    description: "Create a spring/wire-form design in DRAFT. Runs the full engineering stack: spring rate, corrected shear stress, both fatigue criteria, life tier, wire mass per piece and tangle-risk class."
    roles: [DesignEngineer]
    code: 201
    input: [program_id, material_spec_id, part_number, form_type, end_type, wire_diameter_mm, outer_diameter_mm, free_length_mm, active_coils, max_working_load_n, min_working_load_n, cycle_seconds_per_piece, "shot_peening_required?"]
    output: SpringDesign
    side_effects:
      - "created_by_user_id := X-User-ID"
      - "runs calculations.spring_rate, corrected_shear_stress, fatigue_margin_ratio (both variants; fatigue_criterion selects the binding one), predicted_fatigue_life, wire_mass_per_piece, tangle_risk_index"
      - "release_status := DRAFT; current_revision_no := 1"
  - method: GET
    path: "/spring-designs/{id}"
    description: "Read one spring design with all computed engineering fields."
    roles: [DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, ProgramManager, PlantAdmin, CustomerRepresentative]
    code: 200
    input: []
    output: SpringDesign
    side_effects: []
  - method: GET
    path: "/spring-designs"
    description: "List spring designs, filterable by program, material spec and release status."
    roles: [DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, ProgramManager, PlantAdmin]
    code: 200
    input: ["program_id?", "material_spec_id?", "release_status?", "limit?", "offset?"]
    output: SpringDesign[]
    side_effects: []
  - method: POST
    path: "/spring-designs/{id}/critical-characteristics"
    description: "Add a critical characteristic (with LSL/USL and Cpk floor) to a DRAFT design's SPC plan."
    roles: [DesignEngineer]
    code: 201
    input: [char_code, nominal_value, lsl, usl, "is_safety_critical?", "cpk_floor?"]
    output: CriticalCharacteristic
    side_effects: []
  - method: GET
    path: "/spring-designs/{id}/critical-characteristics"
    description: "Sub-resource list: the SPC plan of one design."
    roles: [DesignEngineer, EngineeringManager, ProcessTechnician, QualityInspector, ProgramManager, PlantAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CriticalCharacteristic[]
    side_effects: []
  - method: POST
    path: "/spring-designs/{id}/submit-for-review"
    description: "Move a DRAFT design to ENG_REVIEW. Requires a non-empty critical-characteristic set."
    roles: [DesignEngineer]
    code: 200
    input: []
    output: SpringDesign
    side_effects:
      - "release_status := ENG_REVIEW"
  - method: POST
    path: "/spring-designs/{id}/review"
    description: "Engineering verdict on an ENG_REVIEW design: APPROVE_PROTOTYPE (gated by the program's fatigue-margin floor) or REJECT. The reviewer must not be the design's author."
    roles: [EngineeringManager]
    code: 200
    input: [decision]
    output: SpringDesign
    side_effects:
      - "reviewed_by_user_id := X-User-ID"
      - "release_status := PROTOTYPE_RELEASED on APPROVE_PROTOTYPE, := REJECTED on REJECT"
  - method: POST
    path: "/spring-designs/{id}/revisions"
    description: "Cut a new revision of a REJECTED or PROTOTYPE_RELEASED design, dropping it back to DRAFT and re-running the whole engineering stack. OCC-guarded by expected_design_version."
    roles: [DesignEngineer]
    code: 200
    input: [expected_design_version, "material_spec_id?", "wire_diameter_mm?", "outer_diameter_mm?", "free_length_mm?", "active_coils?", "max_working_load_n?", "min_working_load_n?", "cycle_seconds_per_piece?", "shot_peening_required?"]
    output: SpringDesign
    side_effects:
      - "superseded_revision_no := current_revision_no; current_revision_no += 1"
      - "release_status := DRAFT"
      - "re-runs calculations.spring_rate, corrected_shear_stress, fatigue_margin_ratio, predicted_fatigue_life, wire_mass_per_piece, tangle_risk_index"
      - "increments SpringDesign.version by 1"
  - method: POST
    path: "/spring-designs/{id}/obsolete"
    description: "Retire a PRODUCTION_RELEASED or REJECTED design; cascades its tooling to WRITTEN_OFF and re-derives the program's delivery posture."
    roles: [EngineeringManager]
    code: 200
    input: []
    output: SpringDesign
    side_effects:
      - "release_status := OBSOLETE"
      - "every ToolingAsset of the design with amortization_status != FULLY_AMORTIZED := WRITTEN_OFF"
      - "every MachineSetup of the design in SCHEDULED := ABORTED"
      - "re-derives CustomerProgram.delivery_posture"
  - method: GET
    path: "/spring-designs/{id}/fatigue-analysis"
    description: "Computed read exposing both fatigue variants side by side plus the stress state they are built from."
    roles: [DesignEngineer, EngineeringManager, QualityInspector, ProgramManager, PlantAdmin]
    code: 200
    input: []
    output:
      criterion_in_force: "enum: GOODMAN | SODERBERG — the variant whose ratio the design persisted"
      fatigue_margin_goodman: "number: 3dp result of variant goodman_line"
      fatigue_margin_soderberg: "number: 3dp result of variant soderberg_line"
      stress_amplitude_mpa: "number: 2dp"
      mean_stress_mpa: "number: 2dp"
      endurance_limit_mpa: "number: 2dp, after the shot-peening factor"
      predicted_fatigue_life_cycles: "integer: tier from calculations.predicted_fatigue_life"
    side_effects: []

  # ---------------------------------------------------------------- ToolingAsset
  - method: POST
    path: "/tooling-assets"
    description: "Capitalise a coiling tool set against a design, in PENDING amortization status."
    roles: [EngineeringManager]
    code: 201
    input: [design_id, tool_code, original_cost_cents]
    output: ToolingAsset
    side_effects:
      - "amortization_status := PENDING; recovered_cents := 0; unamortized_cents := original_cost_cents"
      - "amortization_basis_pieces and amort_per_piece_cents remain null until the design is production-released"
  - method: GET
    path: "/tooling-assets/{id}"
    description: "Read one tooling asset with its amortization ledger."
    roles: [EngineeringManager, ProgramManager, ProcessTechnician, DesignEngineer, QualityInspector, PlantAdmin]
    code: 200
    input: []
    output: ToolingAsset
    side_effects: []
  - method: GET
    path: "/tooling-assets"
    description: "List tooling assets, filterable by design and amortization status."
    roles: [EngineeringManager, ProgramManager, ProcessTechnician, DesignEngineer, QualityInspector, PlantAdmin]
    code: 200
    input: ["design_id?", "amortization_status?", "limit?", "offset?"]
    output: ToolingAsset[]
    side_effects: []

  # ---------------------------------------------------------------- WireLot
  - method: POST
    path: "/wire-lots"
    description: "Receive a wire heat lot against a material spec. Opens the mass ledger (on_hand = received, reserved = consumed = 0)."
    roles: [QualityInspector]
    code: 201
    input: [material_spec_id, heat_number, received_kg]
    output: WireLot
    side_effects:
      - "certification_status := UNCERTIFIED"
      - "on_hand_kg := received_kg; reserved_kg := 0.000; consumed_kg := 0.000"
  - method: GET
    path: "/wire-lots/{id}"
    description: "Read one wire lot with its three-bucket mass ledger."
    roles: [QualityInspector, ProcessTechnician, DesignEngineer, EngineeringManager, ProgramManager, PlantAdmin]
    code: 200
    input: []
    output: WireLot
    side_effects: []
  - method: GET
    path: "/wire-lots"
    description: "List wire lots, filterable by material spec and certification status."
    roles: [QualityInspector, ProcessTechnician, DesignEngineer, EngineeringManager, ProgramManager, PlantAdmin]
    code: 200
    input: ["material_spec_id?", "certification_status?", "limit?", "offset?"]
    output: WireLot[]
    side_effects: []
  - method: POST
    path: "/wire-lots/{id}/certify"
    description: "Record the incoming tensile test on an UNCERTIFIED lot: CERTIFIED when the measured value reaches the spec's tensile grade, REJECTED otherwise."
    roles: [QualityInspector]
    code: 200
    input: [tensile_test_mpa]
    output: WireLot
    side_effects:
      - "tensile_test_mpa := input; certified_by_user_id := X-User-ID"
      - "certification_status := CERTIFIED when tensile_test_mpa >= material_spec.tensile_grade_mpa, else REJECTED"

  # ---------------------------------------------------------------- CoilingMachine
  - method: POST
    path: "/coiling-machines"
    description: "Commission a computer-controlled coiler with its wire-diameter ceiling and changeover buffer."
    roles: [PlantAdmin]
    code: 201
    input: [machine_code, max_wire_diameter_mm, changeover_buffer_minutes]
    output: CoilingMachine
    side_effects:
      - "machine_state := IDLE; active_setup_id := null"
  - method: GET
    path: "/coiling-machines/{id}"
    description: "Read one coiling machine."
    roles: [PlantAdmin, ProcessTechnician, DesignEngineer, EngineeringManager, QualityInspector, ProgramManager]
    code: 200
    input: []
    output: CoilingMachine
    side_effects: []
  - method: GET
    path: "/coiling-machines"
    description: "List coiling machines, filterable by machine state."
    roles: [PlantAdmin, ProcessTechnician, DesignEngineer, EngineeringManager, QualityInspector, ProgramManager]
    code: 200
    input: ["machine_state?", "limit?", "offset?"]
    output: CoilingMachine[]
    side_effects: []

  # ---------------------------------------------------------------- MachineSetup
  - method: POST
    path: "/machine-setups"
    description: "Book a coiling setup window on a machine for one design/tooling pair. Enforces the wire-diameter ceiling before the buffered window conflict. OCC-guarded by expected_machine_version."
    roles: [ProcessTechnician]
    code: 201
    input: [machine_id, design_id, tooling_asset_id, window_start, window_end, expected_machine_version]
    output: MachineSetup
    side_effects:
      - "set_by_user_id := X-User-ID; setup_status := SCHEDULED"
      - "runs calculations.setup_window_conflict against SCHEDULED and ACTIVE setups of the machine"
      - "every other SCHEDULED MachineSetup with the same machine_id and design_id := SUPERSEDED with superseded_by_setup_id := the new setup id"
      - "increments CoilingMachine.version by 1"
  - method: GET
    path: "/machine-setups/{id}"
    description: "Read one machine setup."
    roles: [ProcessTechnician, PlantAdmin, DesignEngineer, EngineeringManager, QualityInspector, ProgramManager]
    code: 200
    input: []
    output: MachineSetup
    side_effects: []
  - method: GET
    path: "/machine-setups"
    description: "List machine setups, filterable by machine, design, tooling asset and status."
    roles: [ProcessTechnician, PlantAdmin, DesignEngineer, EngineeringManager, QualityInspector, ProgramManager]
    code: 200
    input: ["machine_id?", "design_id?", "tooling_asset_id?", "setup_status?", "limit?", "offset?"]
    output: MachineSetup[]
    side_effects: []
  - method: POST
    path: "/machine-setups/{id}/activate"
    description: "Take the machine into SETUP/PRODUCTION on a SCHEDULED setup, only inside its booked window and only while the machine is IDLE."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: MachineSetup
    side_effects:
      - "setup_status := ACTIVE"
      - "CoilingMachine.machine_state := SETUP; CoilingMachine.active_setup_id := this setup id"
      - "increments CoilingMachine.version by 1"
  - method: POST
    path: "/machine-setups/{id}/abort"
    description: "Abort a SCHEDULED or ACTIVE setup, freeing the machine and cancelling every run of the setup that has not yet completed."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: MachineSetup
    side_effects:
      - "setup_status := ABORTED"
      - "if the setup was ACTIVE: CoilingMachine.machine_state := IDLE; active_setup_id := null; increments CoilingMachine.version by 1"
      - "every ProductionRun of the setup with process_status IN {FAI_PENDING, RUNNING} := CANCELLED, releasing its wire reservation (WireLot.reserved_kg -= wire_reserved_kg; on_hand_kg += wire_reserved_kg)"

  # ---------------------------------------------------------------- StressReliefOven
  - method: POST
    path: "/stress-relief-ovens"
    description: "Commission a stress-relief / heat-treat oven with its aggregate mass capacity and temperature ceiling."
    roles: [PlantAdmin]
    code: 201
    input: [oven_code, capacity_kg, max_temp_c]
    output: StressReliefOven
    side_effects:
      - "scheduled_load_kg := 0.000"
  - method: GET
    path: "/stress-relief-ovens/{id}"
    description: "Read one oven with its currently scheduled aggregate load."
    roles: [PlantAdmin, ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, ProgramManager]
    code: 200
    input: []
    output: StressReliefOven
    side_effects: []

  # ---------------------------------------------------------------- ProductionRun
  - method: POST
    path: "/production-runs"
    description: "Open a production run on an ACTIVE setup from a CERTIFIED wire lot. Reserves wire per calculations.wire_mass_required and starts in FAI_PENDING / OPEN."
    roles: [ProcessTechnician]
    code: 201
    input: [setup_id, wire_lot_id, design_id, planned_pieces]
    output: ProductionRun
    side_effects:
      - "runs calculations.wire_mass_required (mode (b) pinned rounding order) -> wire_reserved_kg"
      - "WireLot.reserved_kg += wire_reserved_kg; WireLot.on_hand_kg -= wire_reserved_kg (received_kg conserved)"
      - "process_status := FAI_PENDING; quality_status := OPEN; fai_disposition := PENDING; heat_treat_state := NOT_STARTED"
      - "CoilingMachine.machine_state := PRODUCTION (SETUP -> PRODUCTION); increments CoilingMachine.version by 1"
  - method: GET
    path: "/production-runs/{id}"
    description: "Read one production run with both status axes, the wire ledger and the observed capability minima."
    roles: [ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, ProgramManager, PlantAdmin]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/production-runs"
    description: "List production runs, filterable by setup, wire lot, design and either status axis."
    roles: [ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, ProgramManager, PlantAdmin]
    code: 200
    input: ["setup_id?", "wire_lot_id?", "design_id?", "process_status?", "quality_status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/production-runs/{id}/fai"
    description: "Record a first-article measurement subgroup for one critical characteristic of a FAI_PENDING run. Computes Cpk/Ppk and the control state."
    roles: [QualityInspector]
    code: 201
    input: [characteristic_id, measurements]
    output: InspectionRecord
    side_effects:
      - "record_kind := FAI; inspected_by_user_id := X-User-ID"
      - "runs calculations.process_capability -> subgroup_size, mean_value, sigma_value, cpk_value, control_state; ppk_value stays null on FAI records"
      - "ProductionRun.min_cpk_observed := min(existing, cpk_value); min_ppk_observed is untouched by FAI records"
      - "control_state is recorded but the quality axis stays OPEN — only in-process SPC records can drive a run to SPC_HOLD"
  - method: POST
    path: "/production-runs/{id}/fai-disposition"
    description: "First-article verdict on a FAI_PENDING run. Requires full coverage of the design's non-empty characteristic set and a different inspector than the one who measured."
    roles: [QualityInspector]
    code: 200
    input: [decision]
    output: ProductionRun
    side_effects:
      - "fai_disposition := ACCEPTED on ACCEPT, := REJECTED on REJECT"
      - "on ACCEPT: process_status := RUNNING"
      - "on REJECT: process_status := CANCELLED; MachineSetup.setup_status := ABORTED; CoilingMachine.machine_state := IDLE and active_setup_id := null; wire reservation released (WireLot.reserved_kg -= wire_reserved_kg; on_hand_kg += wire_reserved_kg); increments CoilingMachine.version by 1"
  - method: POST
    path: "/production-runs/{id}/inspections"
    description: "Record an in-process or final SPC subgroup on a RUNNING or COMPLETE run for one critical characteristic. Dimensional and load-test subgroups recorded after the last piece is coiled are still SPC records."
    roles: [QualityInspector]
    code: 201
    input: [characteristic_id, measurements]
    output: InspectionRecord
    side_effects:
      - "record_kind := SPC; inspected_by_user_id := X-User-ID"
      - "runs calculations.process_capability -> subgroup_size, mean_value, sigma_value, cpk_value, ppk_value, control_state"
      - "ProductionRun.min_cpk_observed := min cpk_value over all InspectionRecord rows of the run; min_ppk_observed := min ppk_value over the run's record_kind == SPC rows on safety-critical characteristics, each row keeping the pooled ppk_value it was stamped with at its own creation (earlier rows are never restamped)"
      - "if control_state == OUT_OF_CONTROL: ProductionRun.quality_status := SPC_HOLD; every ShipmentLot of this run in ALLOCATED or PACKED := QUARANTINED with quarantine_reason SPC_HOLD_CASCADE; per quarantined lot CustomerProgram.quarantined_lot_count += 1, allocated_pieces -= lot.piece_count, open_commitment_pieces += lot.piece_count; CustomerProgram.delivery_posture re-derived"
  - method: POST
    path: "/production-runs/{id}/quality-disposition"
    description: "Quality verdict lifting an SPC_HOLD: RELEASE returns the run to OPEN, ACCEPT_AS_IS records a concession, SCRAP cancels the run."
    roles: [QualityInspector]
    code: 200
    input: [decision]
    output: ProductionRun
    side_effects:
      - "quality_status := OPEN on RELEASE, := DISPOSITIONED_ACCEPT on ACCEPT_AS_IS, := SCRAPPED on SCRAP"
      - "on RELEASE or ACCEPT_AS_IS the run's quarantined lots stay QUARANTINED and no CustomerProgram counter moves — this endpoint only lifts the run-level hold; each lot returns to ALLOCATED solely through POST /shipment-lots/{id}/release-from-quarantine. CustomerProgram.delivery_posture is still re-derived for every program holding a lot on this run (a lingering quarantined_lot_count keeps it AT_RISK)"
      - "on SCRAP: if process_status IN {FAI_PENDING, RUNNING} then process_status := CANCELLED, releasing the wire reservation and aborting the MachineSetup exactly as the cancel transition does; every ShipmentLot of the run still in ALLOCATED or PACKED := QUARANTINED with quarantine_reason SPC_HOLD_CASCADE, and per quarantined lot CustomerProgram.quarantined_lot_count += 1, allocated_pieces -= lot.piece_count, open_commitment_pieces += lot.piece_count; delivery_posture re-derived"
  - method: POST
    path: "/production-runs/{id}/complete"
    description: "Close out a RUNNING run with its produced and scrapped piece counts, settling the wire ledger."
    roles: [ProcessTechnician]
    code: 200
    input: [produced_pieces, scrapped_pieces]
    output: ProductionRun
    side_effects:
      - "produced_pieces and scrapped_pieces := input; process_status := COMPLETE"
      - "runs calculations.wire_consumption_at_completion -> wire_consumed_kg"
      - "WireLot.consumed_kg += wire_consumed_kg; WireLot.reserved_kg -= wire_reserved_kg; WireLot.on_hand_kg += (wire_reserved_kg - wire_consumed_kg) (received_kg conserved)"
      - "MachineSetup.setup_status := RELEASED; CoilingMachine.machine_state := IDLE; active_setup_id := null; increments CoilingMachine.version by 1"
  - method: POST
    path: "/production-runs/{id}/cancel"
    description: "Abandon a FAI_PENDING or RUNNING run, returning the whole wire reservation."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "process_status := CANCELLED"
      - "WireLot.reserved_kg -= wire_reserved_kg; WireLot.on_hand_kg += wire_reserved_kg (received_kg conserved)"
      - "MachineSetup.setup_status := ABORTED; CoilingMachine.machine_state := IDLE; active_setup_id := null; increments CoilingMachine.version by 1"
  - method: GET
    path: "/inspection-records/{id}"
    description: "Read one inspection record with its capability indices."
    roles: [QualityInspector, ProcessTechnician, EngineeringManager, DesignEngineer, ProgramManager, PlantAdmin]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: []
  - method: GET
    path: "/inspection-records"
    description: "List inspection records, filterable by run, characteristic, record kind and control state."
    roles: [QualityInspector, ProcessTechnician, EngineeringManager, DesignEngineer, ProgramManager, PlantAdmin]
    code: 200
    input: ["run_id?", "characteristic_id?", "record_kind?", "control_state?", "limit?", "offset?"]
    output: InspectionRecord[]
    side_effects: []

  # ---------------------------------------------------------------- HeatTreatBatch
  - method: POST
    path: "/heat-treat-batches"
    description: "Schedule a stress-relief / shot-peening batch for a run in an oven window. Enforces the temperature ceiling before the closed-interval aggregate capacity."
    roles: [ProcessTechnician]
    code: 201
    input: [oven_id, run_id, window_start, window_end, load_kg, target_temp_c, "peening_requested?"]
    output: HeatTreatBatch
    side_effects:
      - "batch_status := SCHEDULED"
      - "runs calculations.oven_interval_load over SCHEDULED and RUNNING batches of the oven"
      - "StressReliefOven.scheduled_load_kg += load_kg"
      - "ProductionRun.heat_treat_state stays NOT_STARTED until the batch is charged"
  - method: GET
    path: "/heat-treat-batches/{id}"
    description: "Read one heat-treat batch."
    roles: [ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, ProgramManager, PlantAdmin]
    code: 200
    input: []
    output: HeatTreatBatch
    side_effects: []
  - method: GET
    path: "/heat-treat-batches"
    description: "List heat-treat batches, filterable by oven, run and status."
    roles: [ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, ProgramManager, PlantAdmin]
    code: 200
    input: ["oven_id?", "run_id?", "batch_status?", "limit?", "offset?"]
    output: HeatTreatBatch[]
    side_effects: []
  - method: POST
    path: "/heat-treat-batches/{id}/start"
    description: "Charge a SCHEDULED batch into the oven once its window has been reached on the logical clock."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: HeatTreatBatch
    side_effects:
      - "batch_status := RUNNING"
      - "ProductionRun.heat_treat_state := IN_PROCESS"
  - method: POST
    path: "/heat-treat-batches/{id}/complete"
    description: "Discharge a RUNNING batch, recording whether shot peening was actually performed."
    roles: [ProcessTechnician]
    code: 200
    input: [peening_performed]
    output: HeatTreatBatch
    side_effects:
      - "peening_performed := input; batch_status := COMPLETE"
      - "StressReliefOven.scheduled_load_kg -= load_kg"
      - "ProductionRun.heat_treat_state := COMPLETE; ProductionRun.peening_verified := true only when peening_performed is true"
  - method: POST
    path: "/heat-treat-batches/{id}/cancel"
    description: "Cancel a SCHEDULED batch, returning its mass to the oven's free capacity."
    roles: [ProcessTechnician]
    code: 200
    input: []
    output: HeatTreatBatch
    side_effects:
      - "batch_status := CANCELLED"
      - "StressReliefOven.scheduled_load_kg -= load_kg"
      - "ProductionRun.heat_treat_state := NOT_STARTED when no RUNNING or COMPLETE batch remains for the run"

  # ---------------------------------------------------------------- QualificationSubmission
  - method: POST
    path: "/qualification-submissions"
    description: "Submit a PPAP / production-part-approval package for a design that already has an ACCEPTED first article. Starts at round 1 in SUBMITTED."
    roles: [ProgramManager]
    code: 201
    input: [program_id, design_id, ppap_level]
    output: QualificationSubmission
    side_effects:
      - "round_no := 1; submission_status := SUBMITTED; submitted_by_user_id := X-User-ID"
  - method: GET
    path: "/qualification-submissions/{id}"
    description: "Read one qualification submission."
    roles: [ProgramManager, EngineeringManager, DesignEngineer, QualityInspector, ProcessTechnician, PlantAdmin, CustomerRepresentative]
    code: 200
    input: []
    output: QualificationSubmission
    side_effects: []
  - method: GET
    path: "/qualification-submissions"
    description: "List qualification submissions, filterable by program, design and status."
    roles: [ProgramManager, EngineeringManager, DesignEngineer, QualityInspector, ProcessTechnician, PlantAdmin, CustomerRepresentative]
    code: 200
    input: ["program_id?", "design_id?", "submission_status?", "limit?", "offset?"]
    output: QualificationSubmission[]
    side_effects: []
  - method: POST
    path: "/qualification-submissions/{id}/review"
    description: "Customer verdict on a SUBMITTED package: APPROVE (full release), INTERIM_APPROVE (capped release, requires interim_piece_cap), REQUEST_REVISION, or REJECT_FINAL."
    roles: [CustomerRepresentative]
    code: 200
    input: [decision, "interim_piece_cap?"]
    output: QualificationSubmission
    side_effects:
      - "reviewed_by_program_id := X-User-ID; decided_at := current logical clock"
      - "submission_status := APPROVED | INTERIM_APPROVED | REVISION_REQUESTED | REJECTED_FINAL"
      - "on REJECTED_FINAL: SpringDesign.release_status := REJECTED; CustomerProgram.delivery_posture re-derived"
      - "on APPROVED: SpringDesign.release_status := PRODUCTION_RELEASED; every PENDING ToolingAsset of the design := AMORTIZING with amortization_basis_pieces and amort_per_piece_cents set from calculations.tooling_amortization_recovery; CustomerProgram.quote_frozen := true; CustomerProgram.delivery_posture re-derived"
      - "on INTERIM_APPROVED: interim_piece_cap := input; SpringDesign.release_status stays PROTOTYPE_RELEASED and every ToolingAsset stays PENDING (only a full APPROVE promotes the design and arms amortization); CustomerProgram.delivery_posture re-derived"
  - method: POST
    path: "/qualification-submissions/{id}/resubmit"
    description: "Resubmit a REVISION_REQUESTED or INTERIM_APPROVED package for the next review round, bounded by MAX_SUBMISSION_ROUNDS."
    roles: [ProgramManager]
    code: 200
    input: []
    output: QualificationSubmission
    side_effects:
      - "round_no += 1; submission_status := SUBMITTED; reviewed_by_program_id := null; decided_at := null"

  # ---------------------------------------------------------------- ShipmentLot
  - method: POST
    path: "/shipment-lots"
    description: "Allocate finished pieces from a COMPLETE run to the program. The single densest gate in the API: run completeness, PPAP standing, heat-treat/peening, Ppk floor, posture, MOQ, run availability, quote presence, commitment and interim cap all apply in §1.4 priority order."
    roles: [ProgramManager]
    code: 201
    input: [run_id, program_id, piece_count]
    output: ShipmentLot
    side_effects:
      - "lot_status := ALLOCATED"
      - "unit_price_cents := CustomerProgram.quoted_unit_price_cents; tooling_amort_per_piece_cents := CustomerProgram.quoted_tooling_amort_per_piece_cents; extended_price_cents := unit_price_cents * piece_count"
      - "CustomerProgram.allocated_pieces += piece_count; CustomerProgram.open_commitment_pieces -= piece_count (committed_pieces conserved)"
      - "CustomerProgram.delivery_posture re-derived"
  - method: GET
    path: "/shipment-lots/{id}"
    description: "Read one shipment lot with its pricing and amortization recovery."
    roles: [ProgramManager, ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, PlantAdmin, CustomerRepresentative]
    code: 200
    input: []
    output: ShipmentLot
    side_effects: []
  - method: GET
    path: "/shipment-lots"
    description: "List shipment lots, filterable by run, program and status."
    roles: [ProgramManager, ProcessTechnician, QualityInspector, EngineeringManager, DesignEngineer, PlantAdmin, CustomerRepresentative]
    code: 200
    input: ["run_id?", "program_id?", "lot_status?", "limit?", "offset?"]
    output: ShipmentLot[]
    side_effects: []
  - method: POST
    path: "/shipment-lots/{id}/pack"
    description: "Pack an ALLOCATED lot with a packaging method that is both permitted for the application class and adequate for the design's tangle-risk class."
    roles: [ProcessTechnician]
    code: 200
    input: [packaging_method]
    output: ShipmentLot
    side_effects:
      - "packaging_method := input; lot_status := PACKED"
  - method: POST
    path: "/shipment-lots/{id}/ship"
    description: "Ship a PACKED lot. Recovers tooling cost through the program's amortization variant and moves the pieces from allocated to shipped."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ShipmentLot
    side_effects:
      - "lot_status := SHIPPED; shipped_at := current logical clock"
      - "runs calculations.tooling_amortization_recovery with the program's variant -> tooling_recovery_cents"
      - "ToolingAsset.recovered_cents += tooling_recovery_cents; ToolingAsset.unamortized_cents -= tooling_recovery_cents (original_cost_cents conserved); amortization_status := FULLY_AMORTIZED when unamortized_cents reaches 0"
      - "CustomerProgram.allocated_pieces -= piece_count; CustomerProgram.shipped_pieces += piece_count"
      - "CustomerProgram.delivery_posture re-derived"
  - method: POST
    path: "/shipment-lots/{id}/return"
    description: "Take back a SHIPPED lot, reversing every ledger effect of the shipment exactly."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ShipmentLot
    side_effects:
      - "lot_status := RETURNED; shipped_at := null"
      - "ToolingAsset.recovered_cents -= tooling_recovery_cents; ToolingAsset.unamortized_cents += tooling_recovery_cents; amortization_status returns to AMORTIZING when unamortized_cents becomes positive"
      - "CustomerProgram.shipped_pieces -= piece_count; CustomerProgram.open_commitment_pieces += piece_count"
      - "CustomerProgram.delivery_posture re-derived"
  - method: POST
    path: "/shipment-lots/{id}/quarantine"
    description: "Quarantine an ALLOCATED or PACKED lot on a stated reason (INSPECTOR_ACTION for a manual hold; SPC_HOLD_CASCADE is reserved for the automatic cascade)."
    roles: [QualityInspector]
    code: 200
    input: [quarantine_reason]
    output: ShipmentLot
    side_effects:
      - "quarantine_reason := input; lot_status := QUARANTINED; packaging_method is retained"
      - "CustomerProgram.quarantined_lot_count += 1; CustomerProgram.allocated_pieces -= piece_count; CustomerProgram.open_commitment_pieces += piece_count (the pieces go back on the commitment)"
      - "CustomerProgram.delivery_posture re-derived"
  - method: POST
    path: "/shipment-lots/{id}/release-from-quarantine"
    description: "Return a QUARANTINED lot to ALLOCATED, re-charging its pieces against the program's live commitment."
    roles: [QualityInspector]
    code: 200
    input: []
    output: ShipmentLot
    side_effects:
      - "lot_status := ALLOCATED; quarantine_reason := null; packaging_method := null (the lot must be packed again)"
      - "CustomerProgram.quarantined_lot_count -= 1; CustomerProgram.allocated_pieces += piece_count; CustomerProgram.open_commitment_pieces -= piece_count"
      - "CustomerProgram.delivery_posture re-derived"

  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every window, activation gate and shipped_at stamp reads. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; it may only move forward."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "the logical clock advances to to_iso8601; no entity is mutated"

# =====================================================================================
# 1.6 Error Code Catalog
# =====================================================================================
errors:
  # ---- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_PROGRAM_OWNERSHIP_MISMATCH
    http: 403
    condition: "A CustomerRepresentative acts on a program, submission, design or lot that does not belong to the program its X-User-ID names"
  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unknown enum member, non-numeric measurement, negative quantity or non-ISO-8601 timestamp"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset negative"
  # ---- existence
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id does not resolve to a CustomerProgram"
  - id: ERR_MATERIAL_SPEC_NOT_FOUND
    http: 404
    condition: "material_spec_id does not resolve to a MaterialSpec"
  - id: ERR_DESIGN_NOT_FOUND
    http: 404
    condition: "design_id does not resolve to a SpringDesign"
  - id: ERR_CHARACTERISTIC_NOT_FOUND
    http: 404
    condition: "characteristic_id does not resolve to a CriticalCharacteristic"
  - id: ERR_TOOLING_NOT_FOUND
    http: 404
    condition: "tooling_asset_id does not resolve to a ToolingAsset"
  - id: ERR_WIRE_LOT_NOT_FOUND
    http: 404
    condition: "wire_lot_id does not resolve to a WireLot"
  - id: ERR_MACHINE_NOT_FOUND
    http: 404
    condition: "machine_id does not resolve to a CoilingMachine"
  - id: ERR_SETUP_NOT_FOUND
    http: 404
    condition: "setup_id does not resolve to a MachineSetup"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "run_id does not resolve to a ProductionRun"
  - id: ERR_OVEN_NOT_FOUND
    http: 404
    condition: "oven_id does not resolve to a StressReliefOven"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "The path batch id does not resolve to a HeatTreatBatch"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "The path submission id does not resolve to a QualificationSubmission"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "The path lot id does not resolve to a ShipmentLot"
  # ---- optimistic concurrency
  - id: ERR_STALE_DESIGN_VERSION
    http: 412
    condition: "expected_design_version does not equal the SpringDesign's current version"
  - id: ERR_STALE_MACHINE_VERSION
    http: 412
    condition: "expected_machine_version does not equal the CoilingMachine's current version"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the CustomerProgram's current version"
  # ---- state
  - id: ERR_DESIGN_INVALID_STATE
    http: 409
    condition: "The design's release_status is not in the requested transition's from-set (e.g. reviewing a DRAFT, submitting an ENG_REVIEW design, adding a characteristic to a released design, revising a DRAFT)"
  - id: ERR_DESIGN_LOCKED
    http: 409
    condition: "A revision is attempted while the design has a SUBMITTED, INTERIM_APPROVED or APPROVED production-part approval package on file"
  - id: ERR_RUN_NOT_COMPLETE
    http: 409
    condition: "Pieces are allocated from a run whose process_status is not COMPLETE"
  - id: ERR_RUN_ON_SPC_HOLD
    http: 409
    condition: "A run under SPC_HOLD is completed, heat-treat-scheduled, or has one of its lots shipped"
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "The run's process_status is not in the requested transition's from-set (completing a FAI_PENDING run, measuring a CANCELLED run, cancelling a COMPLETE run)"
  - id: ERR_SETUP_NOT_ACTIVE
    http: 409
    condition: "A production run is opened on a setup whose setup_status is not ACTIVE"
  - id: ERR_SETUP_INVALID_STATE
    http: 409
    condition: "Activating a non-SCHEDULED setup, or aborting one already ABORTED, RELEASED or SUPERSEDED"
  - id: ERR_MACHINE_NOT_IDLE
    http: 409
    condition: "A setup is activated while its coiler is already in SETUP or PRODUCTION for another setup"
  - id: ERR_WIRE_LOT_ALREADY_DECIDED
    http: 409
    condition: "Certifying a wire lot whose certification_status is already CERTIFIED or REJECTED"
  - id: ERR_FAI_ALREADY_DISPOSITIONED
    http: 409
    condition: "A second first-article verdict is issued on a run whose fai_disposition is no longer PENDING"
  - id: ERR_RUN_NOT_ON_HOLD
    http: 409
    condition: "A quality disposition is issued on a run whose quality_status is not SPC_HOLD"
  - id: ERR_SUBMISSION_INVALID_STATE
    http: 409
    condition: "Reviewing a submission that is not SUBMITTED, or resubmitting one that is SUBMITTED, APPROVED or REJECTED_FINAL"
  - id: ERR_LOT_INVALID_STATE
    http: 409
    condition: "The lot's lot_status is not in the requested transition's from-set (packing a SHIPPED lot, shipping an ALLOCATED lot, releasing a lot that is not QUARANTINED)"
  - id: ERR_BATCH_INVALID_STATE
    http: 409
    condition: "Starting or cancelling a batch that is not SCHEDULED, or completing one that is not RUNNING"
  - id: ERR_QUOTE_FROZEN
    http: 409
    condition: "A program is re-quoted after its PPAP package was fully APPROVED and quote_frozen became true"
  # ---- business safety (engineering, metallurgical, segregation of duties, packaging)
  - id: ERR_CORROSION_REQUIREMENT_UNMET
    http: 422
    condition: "The chosen material spec's salt_spray_hours is below the program's required_salt_spray_hours"
  - id: ERR_BIOCOMPATIBILITY_REQUIRED
    http: 422
    condition: "A program requiring biocompatibility is given a design on a non-biocompatible material spec"
  - id: ERR_SELF_REVIEW_FORBIDDEN
    http: 409
    condition: "The engineering reviewer's X-User-ID equals the design's created_by_user_id"
  - id: ERR_FATIGUE_MARGIN_BELOW_FLOOR
    http: 422
    condition: "A design is approved for prototype while its binding fatigue_margin_ratio is below the program's min_fatigue_margin"
  - id: ERR_SELF_DISPOSITION_FORBIDDEN
    http: 409
    condition: "The first-article disposition is issued by the same X-User-ID that recorded one of the run's FAI measurements"
  - id: ERR_WIRE_LOT_NOT_CERTIFIED
    http: 422
    condition: "A run is opened from a wire lot whose certification_status is UNCERTIFIED or REJECTED"
  - id: ERR_PPAP_NOT_APPROVED
    http: 422
    condition: "Production or shipment is attempted without the production-part approval the application class demands (design not production-released, or no APPROVED/INTERIM_APPROVED submission on file)"
  - id: ERR_HEAT_TREAT_INCOMPLETE
    http: 422
    condition: "Pieces are allocated from a run whose heat-treat is not COMPLETE, or whose design requires shot peening that was never verified"
  - id: ERR_PPK_BELOW_PROGRAM_FLOOR
    http: 422
    condition: "The run's pooled min_ppk_observed is null or below the program's required_ppk"
  - id: ERR_PROGRAM_POSTURE_BLOCKED
    http: 409
    condition: >-
      Pieces are allocated, or a PACKED lot is shipped, while the program's delivery_posture is BLOCKED
  - id: ERR_PACKAGING_NOT_PERMITTED
    http: 422
    condition: "The packaging method is not in the permitted set of the program's application class"
  - id: ERR_TANGLE_RISK_PACKAGING
    http: 422
    condition: "A HIGH tangle-risk design is packed in BULK_BOX or BAG_AND_TAG, which cannot prevent tangling and transit damage"
  # ---- business referential
  - id: ERR_SETUP_DESIGN_MISMATCH
    http: 422
    condition: "The run's design_id differs from the design the setup was tooled for"
  - id: ERR_MATERIAL_MISMATCH
    http: 422
    condition: "The wire lot's material_spec_id differs from the design's material_spec_id"
  - id: ERR_TOOLING_DESIGN_MISMATCH
    http: 422
    condition: "The tooling asset belongs to a different design than the setup's design_id"
  - id: ERR_PROGRAM_DESIGN_MISMATCH
    http: 422
    condition: "The design does not belong to the program named in the request"
  - id: ERR_CHARACTERISTIC_DESIGN_MISMATCH
    http: 422
    condition: "The critical characteristic belongs to a different design than the run's design"
  - id: ERR_PPAP_LEVEL_MISMATCH
    http: 422
    condition: "The submitted ppap_level differs from the program's declared ppap_level"
  # ---- business constraint
  - id: ERR_WIRE_DIAMETER_EXCEEDS_MACHINE
    http: 422
    condition: "The design's wire_diameter_mm exceeds the coiler's max_wire_diameter_mm"
  - id: ERR_INVALID_SUBGROUP_SIZE
    http: 422
    condition: "Fewer than SPC_MIN_SUBGROUP_SIZE (3) measurements are submitted, so no Bessel-corrected sigma exists"
  - id: ERR_CHARACTERISTIC_SET_EMPTY
    http: 422
    condition: "A design with zero critical characteristics is submitted for review, or its run is dispositioned"
  - id: ERR_INCOMPLETE_FAI_COVERAGE
    http: 422
    condition: "At least one critical characteristic of the design has no FAI record on this run"
  - id: ERR_DUPLICATE_CHARACTERISTIC
    http: 409
    condition: "char_code already exists on the design"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "program_code, spec_code, heat_number, tool_code, machine_code or oven_code already exists"
  - id: ERR_OPEN_SUBMISSION_EXISTS
    http: 409
    condition: "A SUBMITTED, INTERIM_APPROVED or REVISION_REQUESTED submission already exists for the same program and design"
  - id: ERR_NO_QUALIFIED_RUN
    http: 422
    condition: "No production run of the design has an ACCEPTED first-article disposition to document the submission"
  - id: ERR_MAX_SUBMISSION_ROUNDS_EXCEEDED
    http: 422
    condition: "Resubmission is attempted at round_no == MAX_SUBMISSION_ROUNDS (3)"
  - id: ERR_TEMP_EXCEEDS_OVEN
    http: 422
    condition: "target_temp_c exceeds the oven's max_temp_c"
  - id: ERR_BELOW_MINIMUM_ORDER_QUANTITY
    http: 422
    condition: "piece_count is below the program's minimum_order_quantity"
  - id: ERR_RUN_PIECES_EXHAUSTED
    http: 422
    condition: "piece_count exceeds the run's produced pieces not already carried by a live lot"
  # ---- business temporal
  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "window_start is before the current logical clock"
  - id: ERR_SETUP_WINDOW_CONFLICT
    http: 409
    condition: "The half-open window, extended by the machine's changeover buffer, intersects a SCHEDULED or ACTIVE setup on the same coiler"
  - id: ERR_OUTSIDE_SETUP_WINDOW
    http: 409
    condition: "A setup is activated before window_start or at/after window_end on the logical clock"
  - id: ERR_BATCH_WINDOW_NOT_REACHED
    http: 409
    condition: "A batch is charged before its window_start on the logical clock"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "The requested logical time is earlier than the current logical clock"
  # ---- business fiscal / capacity
  - id: ERR_OVEN_CAPACITY_EXCEEDED
    http: 409
    condition: "The aggregate closed-interval load of overlapping SCHEDULED/RUNNING batches plus the new load exceeds the oven's capacity_kg"
  - id: ERR_INSUFFICIENT_WIRE
    http: 409
    condition: "The wire lot's on_hand_kg is below the mass the run would reserve"
  - id: ERR_PROGRAM_NOT_QUOTED
    http: 409
    condition: "Pieces are allocated before any quote has been priced on the program"
  - id: ERR_COMMITMENT_EXCEEDED
    http: 422
    condition: "piece_count exceeds the program's open_commitment_pieces"
  - id: ERR_INTERIM_PIECE_CAP_EXCEEDED
    http: 422
    condition: "Under an interim approval, allocated plus shipped plus requested pieces exceed the submission's interim_piece_cap"
  - id: ERR_TOOLING_NOT_AMORTIZING
    http: 409
    condition: "A lot is shipped while the design's tooling is still PENDING or has been WRITTEN_OFF, so no recovery can be posted"

# =====================================================================================
# 1.7 RBAC Matrix
# =====================================================================================
roles:
  - name: DesignEngineer
    description: "Owns the engineering record: material specs, spring/wire-form designs, the SPC plan of critical characteristics, and revisions. May submit a design for review but never approve one (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /material-specs"
      - "POST /spring-designs"
      - "POST /spring-designs/{id}/critical-characteristics"
      - "POST /spring-designs/{id}/submit-for-review"
      - "POST /spring-designs/{id}/revisions"
    shared_operations:
      - "all GET reads on programs, specs, designs, characteristics, tooling, wire lots, machines, setups, runs, inspection records, ovens, batches, submissions and lots"
      - "GET /spring-designs/{id}/fatigue-analysis"
  - name: EngineeringManager
    description: "Independent engineering authority: approves or rejects designs against the program's fatigue floor, retires designs, and capitalises tooling. Cannot author or revise a design, and cannot review one it authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /spring-designs/{id}/review"
      - "POST /spring-designs/{id}/obsolete"
      - "POST /tooling-assets"
    shared_operations:
      - "all GET reads on programs, specs, designs, characteristics, tooling, wire lots, machines, setups, runs, inspection records, ovens, batches, submissions and lots"
      - "GET /spring-designs/{id}/fatigue-analysis"
      - "GET /customer-programs/{id}/tooling-amortization"
  - name: ProcessTechnician
    description: "Runs the floor: books and activates coiling setups, opens/completes/cancels production runs, schedules and discharges stress-relief and peening batches, and packs finished lots. Holds no quality authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /machine-setups"
      - "POST /machine-setups/{id}/activate"
      - "POST /machine-setups/{id}/abort"
      - "POST /production-runs"
      - "POST /production-runs/{id}/complete"
      - "POST /production-runs/{id}/cancel"
      - "POST /heat-treat-batches"
      - "POST /heat-treat-batches/{id}/start"
      - "POST /heat-treat-batches/{id}/complete"
      - "POST /heat-treat-batches/{id}/cancel"
      - "POST /shipment-lots/{id}/pack"
    shared_operations:
      - "all GET reads on programs, specs, designs, characteristics, tooling, wire lots, machines, setups, runs, inspection records, ovens, batches, submissions and lots"
  - name: QualityInspector
    description: "Owns incoming certification, first-article and in-process SPC measurement, both dispositions, and lot quarantine. Cannot open or complete a run, and cannot disposition a first article it measured itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /wire-lots"
      - "POST /wire-lots/{id}/certify"
      - "POST /production-runs/{id}/fai"
      - "POST /production-runs/{id}/fai-disposition"
      - "POST /production-runs/{id}/inspections"
      - "POST /production-runs/{id}/quality-disposition"
      - "POST /shipment-lots/{id}/quarantine"
      - "POST /shipment-lots/{id}/release-from-quarantine"
    shared_operations:
      - "all GET reads on programs, specs, designs, characteristics, tooling, wire lots, machines, setups, runs, inspection records, ovens, batches, submissions and lots"
      - "GET /spring-designs/{id}/fatigue-analysis"
  - name: ProgramManager
    description: "Owns the commercial record: opens programs, prices and freezes quotes, files PPAP packages, allocates and ships lots, and processes returns. Cannot review its own PPAP package — that verdict belongs to the customer."
    identity: "opaque"
    exclusive_operations:
      - "POST /customer-programs"
      - "POST /customer-programs/{id}/quote"
      - "POST /qualification-submissions"
      - "POST /qualification-submissions/{id}/resubmit"
      - "POST /shipment-lots"
      - "POST /shipment-lots/{id}/ship"
      - "POST /shipment-lots/{id}/return"
    shared_operations:
      - "all GET reads on programs, specs, designs, characteristics, tooling, wire lots, machines, setups, runs, inspection records, ovens, batches, submissions and lots"
      - "GET /spring-designs/{id}/fatigue-analysis"
      - "GET /customer-programs/{id}/tooling-amortization"
  - name: CustomerRepresentative
    description: "The buying organisation acting as itself: X-User-ID is the id of its CustomerProgram. Sole holder of the production-part approval verdict (full, interim-capped, or revision requested). Reads are limited to its own program's record; every plant-internal listing is denied."
    identity: "entity_backed:CustomerProgram"
    exclusive_operations:
      - "POST /qualification-submissions/{id}/review"
    shared_operations:
      - "GET /customer-programs/{id} (own program only)"
      - "GET /customer-programs/{id}/tooling-amortization (own program only)"
      - "GET /spring-designs/{id} (designs of its own program only)"
      - "GET /qualification-submissions and GET /qualification-submissions/{id} (own program only)"
      - "GET /shipment-lots and GET /shipment-lots/{id} (own program only)"
  - name: PlantAdmin
    description: "Asset and infrastructure custodian: commissions coilers and stress-relief ovens and drives the logical clock. Deliberately NOT a superset of the other roles — it can neither engineer, run, inspect, nor sell."
    identity: "opaque"
    exclusive_operations:
      - "POST /coiling-machines"
      - "POST /stress-relief-ovens"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads on programs, specs, designs, characteristics, tooling, wire lots, machines, setups, runs, inspection records, ovens, batches, submissions and lots"
      - "GET /spring-designs/{id}/fatigue-analysis"
      - "GET /customer-programs/{id}/tooling-amortization"
