  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_lot_release
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_LOT_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Pair (state, business_safety): the lot is REJECTED (wrong state, p5)
          AND its lab values breach the contamination cap (p6). The higher-
          priority state error must win: ERR_INVALID_STATE, never
          ERR_LOT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock 2026-03-01; plant; supplier; one PCR_FILM lot with contamination_ppm 3000 (over the 2000 cap) already REJECTED."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
