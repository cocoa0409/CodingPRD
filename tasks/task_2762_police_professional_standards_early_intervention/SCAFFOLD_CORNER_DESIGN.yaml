              as: SystemAdmin
              captures: { err_cert: "$.data.error_id" }
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "Empty allegation list.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: [], subject_unit_id: "${patrol_unit_id}", complainant_name: "Dana Ruiz", complainant_contact: "dana@example.org" }
              as: Complainant
