  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-AUTH-01", full_name: "Pat Auth", date_of_birth: "1970-01-01" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED (test sends the request with the auth headers omitted)"

      - name: auth_submit_on_pending_order_state_not_occ
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]", "errors[ERR_ORDER_NOT_AUTHORIZABLE_STATE]", "errors[ERR_STALE_VERSION]", "concurrency_rules[auth-submit-stale-order]"]
        distinguishing_aspect: "A second authorization submit carrying the CURRENT order version passes the OCC check (p6) and fails on state (p7): ERR_ORDER_NOT_AUTHORIZABLE_STATE, proving OCC precedence is about version freshness, not a blanket duplicate guard."
        test_recipe:
          setup: ["Order in AUTH_IN_PROGRESS with one SUBMITTED authorization; client holds the current order version"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-VAL-01", full_name: "Pat Val", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "HST", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "GET /referral-orders/${o1}", payload: {}, as: Scheduler, captures: { o1_v2: $.data.version } }
          trigger:
            - call: "POST /referral-orders/${o1}/authorizations"
              payload: { payer_name: "UHC", authorization_number: "AU-2", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v2}" }
              as: Scheduler
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_ORDER_NOT_AUTHORIZABLE_STATE (NOT 412 ERR_STALE_VERSION — the version matched)"

      - name: split_remaining_179_rejected
        claim_type: violation_to_error
        grounds: [calculations.split_night_eligibility, "errors[ERR_SPLIT_INSUFFICIENT_REMAINING]"]
        distinguishing_aspect: "remaining_minutes_available 179 (one below the 180 floor) is rejected even with all other inputs eligible."
        test_recipe:
          setup: ["SPLIT_NIGHT study IN_PROGRESS on 2026-08-01"]
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-VAL-02", full_name: "Pat Val Two", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
            - { call: "POST /technologists", payload: { full_name: "Tech One", credential: "RPSGT" }, as: LabDirector, captures: { t1: $.data.id } }
            - { call: "POST /beds", payload: { room_label: "B1", titration_capable: true }, as: LabDirector, captures: { bed1: $.data.id } }
            - { call: "POST /staffing-assignments", payload: { technologist_id: "${t1}", shift_date: "2026-08-01", patient_capacity: 2 }, as: LabDirector, captures: { sa1: $.data.id } }
            - { call: "POST /staffing-assignments/${sa1}/confirm", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
            - { call: "POST /referral-orders", payload: { patient_id: "${p1}", ordering_provider_name: "Dr Ref", requested_study_type: "SPLIT_NIGHT", icd10_primary: "G47.33" }, as: Scheduler, captures: { o1: $.data.id, o1_v: $.data.version } }
            - { call: "POST /referral-orders/${o1}/authorizations", payload: { payer_name: "Aetna", authorization_number: "AU-1", approved_nights: 1, window_start: "2026-07-01", window_end: "2026-09-30", expected_referral_order_version: "${o1_v}" }, as: Scheduler, captures: { a1: $.data.id } }
            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "SPLIT_NIGHT", scheduled_date: "2026-08-01", bed_id: "${bed1}" }, as: Scheduler, captures: { st1: $.data.id } }
            - { call: "POST /sleep-studies/${st1}/check-in", payload: {}, as: SleepTechnologist, as_user_id: "${t1}" }
          trigger:
            - call: "POST /sleep-studies/${st1}/split-decision"
