            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "FAB-2", demand_avg_nm3h: 4500, demand_peak_nm3h: 6000, required_purity_percent: 99.99, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_fab2: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations/${e_fab2}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_fab}"
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", evaluation_id: "${e_fab2}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 1999999, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42 }
              as: SupplyPlanner
              captures: { k_low: $.data.id }
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { k_ok_st: $.data.status }
            - call: "POST /gas-supply/supply-contracts/${k_low}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { err_mv: $.data.error_id }
          assert:
            - "K_OK at exactly 2,000,000 activates: status == ACTIVE"
            - "K_LOW at 1,999,999 rejected: 422 ${err_mv} == ERR_MIN_VOLUME_BELOW_FLOOR and status stays DRAFT"

      - name: pipeline_activation_requires_primary_connection
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors[ERR_PIPELINE_CONNECTION_REQUIRED]
        distinguishing_aspect: "A PIPELINE-mode contract with zero ACTIVE PRIMARY connections cannot activate; adding the connection first (while DRAFT) makes the same call succeed."
        test_recipe:
          setup:
            - "Customer MetCo; PIPELINE evaluation accepted; K_MET DRAFT; N_MAIN exists."
          setup_api_calls:
            - *k_clock
            - *k_network
            - &k_cust_met
              call: "POST /gas-supply/customers"
              payload: { name: "MetCo", segment: "METALS", credit_standing: "PRIME" }
              as: PlatformAdmin
              captures: { c_met: $.data.id }
            - &k_eval_met
              call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_met}", site_label: "MILL-9", demand_avg_nm3h: 2000, demand_peak_nm3h: 2600, required_purity_percent: 99.9, required_product: "N2", pipeline_available: true }
              as: SupplyPlanner
              captures: { e_met: $.data.id }
            - &k_accept_met
              call: "POST /gas-supply/supply-mode-evaluations/${e_met}/accept"
              payload: {}
              as: CustomerOps
              as_user_id: "${c_met}"
            - &k_contract_met
              call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_met}", evaluation_id: "${e_met}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 800000, unit_price_cents_per_nm3: 10, monthly_facility_fee_cents: 200000, facility_fee_escalation_pct_annual: 0.02, base_power_index: 0.08, power_kwh_per_nm3: 0.30 }
              as: SupplyPlanner
              captures: { k_met: $.data.id }
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_met}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { err_pc: $.data.error_id }
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_met}", reserved_flow_nm3h: 6000, purpose: "PRIMARY" }
              as: PipelineDispatcher
            - call: "POST /gas-supply/supply-contracts/${k_met}/activate"
              payload: {}
              as: SupplyPlanner
              captures: { k_met_st: $.data.status }
          assert:
            - "without a connection: 409 ${err_pc} == ERR_PIPELINE_CONNECTION_REQUIRED"
            - "after creating the PRIMARY connection (allowed while DRAFT): activation succeeds, status == ACTIVE"

      - name: connection_purpose_mode_mismatch
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors[ERR_MODE_MISMATCH]
        distinguishing_aspect: "purpose PRIMARY against an ONSITE_PLANT contract is 422 ERR_MODE_MISMATCH; the symmetric BACKUP-on-PIPELINE pairing fails the same way."
        test_recipe:
          setup:
            - "K_FAB DRAFT (ONSITE_PLANT mode); N_MAIN exists."
          setup_api_calls:
            - *k_clock
            - *k_network
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
          trigger:
            - call: "POST /gas-supply/pipeline-connections"
              payload: { network_id: "${n_main}", contract_id: "${k_fab}", reserved_flow_nm3h: 1000, purpose: "PRIMARY" }
              as: PipelineDispatcher
              captures: { err_mm: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_mm} == ERR_MODE_MISMATCH"
            - "GET /gas-supply/pipeline-connections?network_id=${n_main} returns 0 rows"

      - name: certify_inconsistent_result_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors[ERR_RESULT_INCONSISTENT]
        distinguishing_aspect: "A CERTIFIED decision against measurements that violate the delivery's purity snapshot (99.99 < 99.999) is 422 ERR_RESULT_INCONSISTENT — the certifier cannot override physics."
        test_recipe:
          setup:
            - "Tank-triggered delivery confirmed; certificate recorded with failing purity 99.99."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_ri: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d_ri}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
            - call: "POST /gas-supply/deliveries/${d_ri}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.99, measured_impurity_ppm: 5 }
              as: QualityAnalyst
              as_user_id: "qa-1"
              captures: { qc_ri: $.data.id }
          trigger:
            - call: "POST /gas-supply/quality-certificates/${qc_ri}/certify"
              payload: { decision: "CERTIFIED" }
              as: QualityCertifier
              as_user_id: "qc-9"
              captures: { err_ri: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_ri} == ERR_RESULT_INCONSISTENT"
            - "QualityCertificate.${qc_ri}.result remains RECORDED and Delivery.${d_ri}.transport_status remains DELIVERED"

      - name: confirm_overfill_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=5]
          - errors[ERR_DELIVERY_OVERFILL]
        distinguishing_aspect: "Tank headroom is exactly 30,000 L (capacity 50,000 - level 20,000); confirming 30,001 L is 422 ERR_DELIVERY_OVERFILL while the boundary value succeeds (covered in §1.8 quality_fail setup)."
        test_recipe:
          setup:
            - "Tank-triggered delivery D_OF exists (qty 30,000)."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_of: "$.data[0].id" }
          trigger:
            - call: "POST /gas-supply/deliveries/${d_of}/confirm-delivery"
              payload: { delivered_quantity_liters: 30001 }
              as: PipelineDispatcher
              captures: { err_of: $.data.error_id }
          assert:
            - "the response status is 422 and ${err_of} == ERR_DELIVERY_OVERFILL"
            - "Delivery.${d_of}.transport_status remains SCHEDULED"

      - name: makeup_apply_above_balance_rejected
        claim_type: Violation -> Error
        grounds:
